name: Check evaluation tooling
on:
  push:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock', 'config/**', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uvx --from actionlint-py actionlint .github/workflows/weekly.yaml .github/workflows/ci.yaml
