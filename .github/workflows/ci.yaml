name: Check evaluation tooling
on:
  push:
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock', 'config/**', 'schemas/**', 'reports/latest/recuration/**', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uvx --from actionlint-py actionlint .github/workflows/*.yaml
      - run: uv run dismech-evals site
      - run: uv run --group browser playwright install --with-deps chromium
      - run: uv run --group browser pytest tests/test_browser.py -q
