      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Neurodevelopmental Transcriptional Program
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'The downstream transcriptional consequence in the developing nervous system. Mouse
          genetics gives this node real content rather than leaving it a placeholder: losing SOX5 causes
          the three principal sequentially born corticofugal neuron subtypes to overlap in identity, because
          SOX5 normally prevents later-born subtypes from appearing early. So the program SOX5 controls
          is a temporal one, and the defect is mistiming of subtype generation rather than failure of
          neurogenesis as such.

          The node is PROVISIONAL rather than ESTABLISHED for a specific reason, not as a hedge. The mouse
          result comes from a homozygous null, and the human lesion is a heterozygous dosage reduction;
          whether halving SOX5 mistimes the same programme is not shown. Nor has the transcriptional programme
          been characterised in any patient-derived neural material. Those are two different gaps and
          the second is recorded separately.'
        biological_processes:
        - preferred_term: central nervous system development
          modifier: DECREASED
          term:
            id: GO:0007417
            label: central nervous system development
      selected_evidence:
        snippet: Lamb-Shaffer syndrome (LAMSHF) is a neurodevelopmental disorder described in just over
          two dozen patients with heterozygous genetic alterations involving SOX5, a gene encoding a transcription
          factor regulating cell fate and differentiation in neurogenesis and other discrete developmental
          processes.
        supports: SUPPORT
        directness: INDIRECT
