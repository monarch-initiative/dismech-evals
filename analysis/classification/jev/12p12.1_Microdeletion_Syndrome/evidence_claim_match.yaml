  91c26d805efab87d2a0d4d33d239d164f40cda700fe5c078174de1424494a6b8:
    claim:
      about:
        disease:
          name: 12p12.1 Microdeletion Syndrome
          disease_term:
            preferred_term: 12p12.1 microdeletion syndrome
            term:
              id: MONDO:0017781
              label: 12p12.1 microdeletion syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: entity_is_gene_not_region
        kind: KNOWLEDGE_GAP
        attaches_to:
        - disease#12p12.1 Microdeletion Syndrome
        - pathophysiology#Loss of One Functional SOX5 Allele
        prompt: Should this concept be named and modelled as a chromosomal microdeletion syndrome at all,
          given that most reported lesions are not deletions?
        rationale: 'MONDO:0017781 names a cytogenetic region and sits under "chromosome 12p deletion".
          The disease it labels is SOX5 haploinsufficiency, and in the most recent series nine of sixteen
          lesions were single nucleotide variants rather than deletions, while two reported patients have
          balanced translocations with no copy-number change at all. A region-named class implies that
          contiguous-gene effects matter, and nothing in the literature cited here suggests they do: no
          second gene in the interval has been implicated, and deletion size does not track severity.
