            family, which matters for counselling: an apparently de novo variant does not guarantee a
            negligible recurrence risk.'
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          modifier: DECREASED
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
      selected_evidence:
        snippet: Thus, the present patient has SOX5 haploinsufficiency affecting 2 long forms of SOX5
          and is the second reported case of Lamb-Shaffer syndrome caused by a de novo balanced reciprocal
          translocation.
        supports: SUPPORT
        directness: DIRECT
