        variant_origin: GERMLINE
        notes: SRY-box transcription factor 5, a SOXD-family transcription factor regulating cell fate
          and differentiation in neurogenesis. The disease-relevant lesions affect the two long isoforms.
          Disease-associated missense variants cluster in the SOX-specific high-mobility-group domain
          and abolish DNA binding and transactivation; missense variants elsewhere do not and are better
          tolerated.
