      assertion_type: Discussion
      assertion:
        discussion_id: no_genotype_phenotype_correlation
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Loss of One Functional SOX5 Allele
        - phenotypes#Microcephaly
        prompt: Why is the clinical severity of SOX5 haploinsufficiency so variable when the molecular
          lesion is uniform, and does the microcephaly signal in point-variant patients survive a larger
          cohort?
        rationale: A 41-patient study found no clear genotype-phenotype correlation beyond the tolerance
          of out-of-domain missense variants, and severity nonetheless varies widely. Two readings are
          open. If the lesion really is uniform haploinsufficiency, the variability must come from modifiers
          or from the genetic background, and nothing has been done to look. Alternatively the lesions
          are not equivalent, and the later observation that point-variant patients tend toward lower
          growth parameters and microcephaly than deletion patients hints at that - which would be counterintuitive,
          since a whole-gene deletion is the more complete loss. That observation is a tendency in sixteen
          patients and needs replication before it is treated as a correlation. Until then this entry
          makes no claim that lesion class predicts severity.
      selected_evidence:
        snippet: No clear genotype-phenotype correlations were found, except that missense variants outside
          the high-mobility-group domain were generally better tolerated.
        supports: SUPPORT
        directness: DIRECT
