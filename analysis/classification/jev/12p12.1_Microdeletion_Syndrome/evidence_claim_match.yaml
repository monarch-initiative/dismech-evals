        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: no_model_system
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Disrupted Neurodevelopmental Transcriptional Program
        - animal_models#Mouse
        prompt: Does halving SOXFive in a human brain mistime corticofugal subtype generation the way
          abolishing it does in a mouse?
        rationale: 'This is a mismatch rather than an absence, which is why it is typed HUMAN_MODEL_MISMATCH.
          Evidence exists and it is good: the Sox5 null mouse identifies the programme SOX5 controls and
          shows precisely how its loss disorders corticofugal subtype timing. What it cannot establish
          is the step this disease turns on. The mouse is a homozygous null and every reported patient
          is heterozygous, so the experiment answers "is SOX5 required" and the disease asks "what does
          half of it do". A dosage-sensitive transcription factor is exactly the case where those can
          come apart.

          Two further gaps sit alongside it and are genuinely absences. No patient-derived neural material
          has been transcriptionally characterised, so the human targets are unidentified. And mouse corticogenesis
          lacks the expanded outer subventricular zone that shapes human cortical layering, so even a
          heterozygous mouse would leave a species question open.

          Until that is addressed, the mechanism node stays PROVISIONAL and no therapeutic target follows
          from it.'
      selected_evidence:
        snippet: The present study was aimed at increasing our understanding of LAMSHF, its clinical and
          genetic spectrum, and the pathophysiological mechanisms involved.
        supports: SUPPORT
        directness: INDIRECT
