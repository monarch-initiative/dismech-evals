        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_dup15q_mouse_sleep_physiology
        prompt: Why do maternal-duplication mice reproduce the human beta EEG signature but not the abnormal
          human NREM-sleep phenotype, and which part of the model is appropriate for preclinical target-engagement
          studies?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - phenotypes#Abnormal sleep physiology
        - diagnosis#EEG beta oscillation biomarker
        - pathophysiology#GABAA-receptor-associated beta oscillations
        rationale: Chromosome-engineered maternal-duplication mice reproduce elevated beta oscillations
          across brain states, supporting use of beta power as a translational measurement. The same mice
          do not reproduce the abnormal NREM sleep architecture observed in children with Dup15q and retain
          normal NREM recovery after sleep deprivation. The agreement is therefore biomarker specific
          rather than evidence that the mouse faithfully models the broader human sleep phenotype. This
          distinction matters when a preclinical intervention changes beta power without demonstrating
          a patient-relevant sleep or behavioral effect.
        proposed_experiments:
        - experiment_id: exp_dup15q_harmonized_human_mouse_sleep_eeg
          name: Harmonized longitudinal human-mouse sleep EEG perturbation study
          description: Use matched spectral definitions, sleep-stage metrics, age windows, and medication
            annotations in longitudinal human Dup15q sleep EEG and maternal-duplication mice, then compare
            responses to the same target-engagement perturbation. Treat beta power and NREM architecture
            as separate outcomes and test whether either predicts patient-centered sleep measures.
      selected_evidence:
        snippet: Our study revealed that across brain states, matDp/+ mice mirrored the elevated beta
          oscillation phenotype observed in clinical EEGs from individuals with Dup15q syndrome.
        supports: SUPPORT
    origin:
