      assertion_type: Treatment
      assertion:
        name: Individualized epilepsy treatment
        description: Epilepsy treatment is tailored to seizure type and syndrome. Family-survey and retrospective
          multicenter data associate broad-spectrum antiseizure medications, oxcarbazepine, and valproate
          with responses in subsets; the survey also found ACTH more effective than vigabatrin for infantile
          spasms. These nonrandomized findings do not establish a universal hierarchy.
        notes: No prospective or randomized controlled trial data establish an antiseizure medication
          hierarchy for Dup15q. The 2014 family survey had a low return rate, and the 2026 multicenter
          study was retrospective; therapy should therefore be individualized by seizure type, structural
          subtype, tolerability, and specialist judgment.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        target_phenotypes:
        - preferred_term: Seizure
          term:
            id: HP:0001250
            label: Seizure
        - preferred_term: Infantile spasms
          term:
            id: HP:0012469
            label: Infantile spasms
      selected_evidence:
        snippet: Broad spectrum antiepileptic drugs (AEDs) were the most effective medications, but carbamazepine
          and oxcarbazepine were also effective, although typical benzodiazepines were relatively ineffective.
        supports: SUPPORT
