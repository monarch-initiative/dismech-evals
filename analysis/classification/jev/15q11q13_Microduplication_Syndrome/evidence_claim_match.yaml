      assertion_type: ProgressionInfo
      assertion:
        phase: Epilepsy evolution
        age_range: Infancy through adulthood
        notes: Epilepsy may begin with infantile spasms or with focal or generalized seizures later in
          childhood. Multiple seizure types can accumulate, and a substantial subgroup develops drug-resistant
          developmental and epileptic encephalopathy, including Lennox-Gastaut syndrome; onset and severity
          are generally earlier and greater with idic15 than with int15.
      selected_evidence:
        snippet: Seizures are common in idic(15) and typically difficult to control, often presenting
          with infantile spasms and progressing to a Lennox-Gastaut-type syndrome.
        supports: SUPPORT
