            term:
              id: MONDO:0012081
              label: 15q11q13 microduplication syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Maternal 15q11-q13 dosage increase
        description: One or more extra maternally derived copies of 15q11.2-q13.1 increase dosage of neuronal
          UBE3A and multiple biallelically expressed genes. Human genetic and cell-model data support
          UBE3A as an important contributor, but neither UBE3A nor the duplicated GABAA-receptor genes
          alone explain the full clinical phenotype.
        genes:
        - preferred_term: UBE3A
          term:
            id: hgnc:12496
            label: UBE3A
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Maternally inherited duplications are always associated with a clinical phenotype (ranging
          from learning difficulties to intellectual impairment, epilepsy and psychiatric disorders),
          while paternal duplications are normal or associated with milder phenotypes (mild learning difficulties
          and dyslexia).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37029316
      reference_title: 'Population screening for 15q11-q13 duplications: corroboration of the difference
        in impact between maternally and paternally inherited alleles.'
      evidence_source: HUMAN_CLINICAL
      explanation: This directly supports a parent-of-origin effect as a key driver of phenotypic impact
        in 15q11-q13 duplications.
