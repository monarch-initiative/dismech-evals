        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dup15q_gabaa_beta_clinical_causality
        prompt: Does increased dosage of GABRB3, GABRA5, or GABRG3 generate the Dup15q beta EEG biomarker,
          and is that signal causally related to epilepsy or clinical outcomes rather than merely correlated
          with them?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#GABAA-receptor-associated beta oscillations
        - pathophysiology#Epileptogenic network dysfunction
        - diagnosis#EEG beta oscillation biomarker
        rationale: Human EEG establishes a stable beta biomarker and pharmacologic resemblance to GABAA-receptor
          modulation, but the exact mechanism remains unknown. A 2026 study using locally referenced beta
          power found cross-sectional correlations with cognitive and adaptive severity in participants
          without epilepsy, but not in those with epilepsy; the analyses were exploratory and uncorrected
          for multiple testing. Selective α5-receptor modulation normalized the measured behavioral phenotypes
          and partially normalized beta power in a paternal-duplication mouse model. Neither result establishes
          directionality or clinical treatment response, and the basmisanil trial terminated after only
          seven participants. Individual-gene perturbation and prospective human intervention data are
          still needed before the GABAA cluster, beta biomarker, clinical outcomes, and therapeutic response
          can be placed in one causal chain.
        proposed_experiments:
        - experiment_id: exp_dup15q_gabaa_gene_dosage_network_rescue
          name: Isogenic GABAA-cluster dosage dissection in human neuronal networks
          description: In patient-derived mixed excitatory-inhibitory neuronal cultures, normalize GABRB3,
            GABRA5, and GABRG3 singly and in combinations while leaving UBE3A dosage unchanged. Measure
            receptor composition, inhibitory currents, network beta oscillations, and epileptiform activity,
            then compare the rescued signatures with longitudinal human EEG and seizure outcomes.
      selected_evidence:
        snippet: Although an exact mechanism of beta oscillations has not been elucidated in Dup15q syndrome
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32791992
      reference_title: Properties of beta oscillations in Dup15q syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: This explicitly states that the gene-dosage mechanism remains unresolved.
