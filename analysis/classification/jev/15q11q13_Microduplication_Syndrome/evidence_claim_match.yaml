      assertion_type: DifferentialDiagnosis
      assertion:
        name: Paternal 15q11.2-q13.1 duplication
        description: The same 15q11.2-q13.1 copy-number gain can be paternal rather than maternal. Paternal
          duplications are generally normal or associated with milder, variable findings and do not define
          maternal Dup15q, so parent-of-origin testing is the direct discriminator.
      selected_evidence:
        snippet: Maternally inherited duplications are always associated with a clinical phenotype (ranging
          from learning difficulties to intellectual impairment, epilepsy and psychiatric disorders),
          while paternal duplications are normal or associated with milder phenotypes (mild learning difficulties
          and dyslexia).
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
