              label: 15q11q13 microduplication syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Maternal parent-of-origin effect with subtype-dependent recurrence risk
        inheritance_term:
          preferred_term: Autosomal dominant inheritance with paternal imprinting
          term:
            id: HP:0012274
            label: Autosomal dominant inheritance with paternal imprinting
        parent_of_origin_effect: The diagnosis of maternal Dup15q requires at least one extra maternally
          derived copy of the 15q11.2-q13.1 Prader-Willi/Angelman critical region. Paternal duplications
          do not define maternal Dup15q and show variable, generally milder outcomes, so parent of origin
          must be established rather than inferred from copy number alone.
        de_novo_rate: Maternal idic(15) has been reported de novo in all affected individuals to date.
          Maternal interstitial 15q11.2-q13.1 duplication is de novo in approximately 85% of probands
          and maternally inherited in approximately 15%.
        description: Recurrence counseling depends on the structural subtype and parental origin. Unaffected
          parents of a child with de novo idic(15) generally have low recurrence risk, with residual concern
          for maternal germline mosaicism. If a mother carries an interstitial 15q11.2-q13.1 duplication,
          each child has a 50% risk of inheriting the duplication; prenatal or preimplantation genetic
          testing by chromosomal microarray can detect the duplication but cannot reliably predict severity.
      selected_evidence:
        snippet: the risk to each child of inheriting the duplication is 50%
        supports: SUPPORT
