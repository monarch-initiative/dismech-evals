      reference: PMID:28545977
      reference_title: Elevated glutaric acid levels in Dhtkd1-/Gcdh- double knockout mice challenge our
        current understanding of lysine metabolism.
      evidence_source: MODEL_ORGANISM
      explanation: Glutaryl-CoA-derived metabolites persisted in Dhtkd1/Gcdh double knockout mice, implying
