        hypothesis_label: Accumulated 2-oxoadipate or 2-aminoadipate causes neurodevelopmental symptoms
          in some patients
        status: EMERGING
        description: A minority of reported patients have developmental delay, intellectual disability,
          epilepsy, ataxia, hypotonia, microcephaly or behavioural problems. It has been proposed that
          the accumulated metabolites, an imbalance in lysine catabolism, or altered reactive oxygen species
          production cause these features. No study has shown a causal link, and the alternative explanation,
          that the biochemistry was found because children with unrelated neurological disease were screened,
          fits the asymptomatic siblings and screening-detected cases equally well. This hypothesis is
          recorded so that the provisional edges in the pathograph are scoped and can be withdrawn together.
      selected_evidence:
        snippet: This disorder has been associated with varying neurological symptoms.
        supports: SUPPORT
