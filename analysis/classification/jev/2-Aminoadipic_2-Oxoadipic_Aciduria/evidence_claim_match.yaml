              label: 2-aminoadipic 2-oxoadipic aciduria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: amoxad_cardiometabolic_signal
        prompt: Do people with AMOXAD, who have lifelong high 2-aminoadipate, show the dysglycaemia or
          low HDL cholesterol that population studies link to plasma 2-aminoadipate and to common DHTKD1
          variants?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#2-Aminoadipate Accumulation
        - biochemical#2-Aminoadipic acid (urine and plasma)
        rationale: 'In the BXD mouse reference population Dhtkd1 was the main genetic regulator of 2-aminoadipate
          and explained variance in fasting glucose and diabetes status; in humans, plasma 2-aminoadipate
          associates inversely with HDL cholesterol and is influenced by common DHTKD1 variants, and it
          has been linked to type 2 diabetes risk. DHTKD1 knockout cells have impaired mitochondrial respiration.
          AMOXAD patients are a natural experiment of very high 2-aminoadipate from birth, yet no study
          has measured glucose tolerance, insulin secretion or lipids in them. This is a gap in curation
          of the disease rather than a claimed feature: none of these cardiometabolic traits is recorded
          as a phenotype here, because no patient data exist.'
        proposed_experiments:
        - experiment_id: exp_amoxad_metabolic_phenotyping
          name: Cardiometabolic phenotyping of genotyped AMOXAD patients
          description: Measure fasting glucose, oral glucose tolerance with insulin and C-peptide, HbA1c
            and lipid profile, including HDL cholesterol, in genotyped AMOXAD patients and age-matched
            unaffected siblings.
          supporting_outcome:
          - Altered insulin secretion or lower HDL in patients would make the population association plausibly
            causal and add a phenotype.
          refuting_outcome:
          - Normal values despite very high 2-aminoadipate would argue that the population association
            is not driven by 2-aminoadipate itself.
      selected_evidence:
        snippet: Most prominently, Dhtkd1 was identified as a primary regulator of 2-aminoadipate, explaining
          variance in fasted glucose and diabetes status in both mice and humans.
        supports: SUPPORT
    origin:
