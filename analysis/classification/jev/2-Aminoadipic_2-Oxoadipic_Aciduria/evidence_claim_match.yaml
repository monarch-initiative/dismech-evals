  8cf5b621bd21ae77be960fd96330b4b286ba43219573dd17d77991bd3c29bc60:
    claim:
      about:
        disease:
          name: 2-Aminoadipic 2-Oxoadipic Aciduria
          disease_term:
            preferred_term: 2-aminoadipic 2-oxoadipic aciduria
            term:
              id: MONDO:0008774
              label: 2-aminoadipic 2-oxoadipic aciduria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: amoxad_mouse_model_discordance
        prompt: Why does one Dhtkd1 knockout mouse stay clinically normal while another develops a CMT2-like
          neuropathy, and which better represents the human biallelic disorder?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Dhtkd1 knockout mouse (Biagosch 2017)
        - animal_models#Dhtkd1 knockout mouse with CMT2-like neuropathy (Xu 2018)
        - pathophysiology#2-Aminoadipate Accumulation
        rationale: Both knockouts reproduce the human biochemistry, so evidence exists in the model; what
          is uncertain is how to read the clinical phenotype. The Biagosch line is asymptomatic even on
          a high-lysine diet, matching the many asymptomatic patients. The Xu line develops progressive
          distal weakness, slowed nerve conduction and myelin damage, which the authors attribute to 2-aminoadipate
          stimulating insulin secretion and altering Schwann cell myelin protein zero expression, and
          2-aminoadipate feeding alone reproduced the phenotype. If that mechanism applied to humans,
          AMOXAD patients, who have high 2-aminoadipate, would be expected to have neuropathy and altered
          insulin secretion; neither has been reported. Strain background is a further confounder, because
          C57BL/6J, the most common background, is itself a natural Dhtkd1 hypomorph. Until the difference
          is explained, neither line's clinical phenotype should be taken as evidence about the human
          disorder, though both support the biochemical nodes.
        proposed_experiments:
        - experiment_id: exp_dhtkd1_ko_side_by_side
          name: Side-by-side phenotyping of Dhtkd1 knockout lines on matched backgrounds
          description: Back-cross both knockout alleles onto a Dhtkd1-wild-type background, phenotype
            littermates in one facility for nerve conduction, nerve histology, glucose-stimulated insulin
            secretion and urinary metabolites, and test 2-aminoadipate feeding in wild-type mice of the
            same background.
          supporting_outcome:
          - Neuropathy in both lines on a matched background would make the neuropathy a property of Dhtkd1
            loss that human patients should be examined for.
          refuting_outcome:
          - Neuropathy confined to one line or background would point to a line- or strain-specific modifier.
      selected_evidence:
