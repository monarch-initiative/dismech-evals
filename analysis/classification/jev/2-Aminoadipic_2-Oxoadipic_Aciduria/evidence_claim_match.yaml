      assertion_type: Pathophysiology
      assertion:
        name: DHTKD1 Biallelic Loss of Function
        description: Biallelic germline DHTKD1 variants reduce or abolish functional E1a. The index patients
          were compound heterozygous for a start-loss variant (c.1A>G) or a nonsense variant (c.1228C>T,
          p.Arg410*) together with the recurrent missense variant c.2185G>A (p.Gly729Arg). Later series
          added missense, nonsense, splice-donor, duplication and deletion-insertion alleles. Most tested
          missense variants impair folding or stability and reduce activity, although three tested variants
          showed no defect.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: DHTKD1
          term:
            id: hgnc:23537
            label: DHTKD1
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Sequence analysis of a second individual identified the same missense mutation together
          with a nonsense mutation
