          name: 2-Aminoadipic 2-Oxoadipic Aciduria
          disease_term:
            preferred_term: 2-aminoadipic 2-oxoadipic aciduria
            term:
              id: MONDO:0008774
              label: 2-aminoadipic 2-oxoadipic aciduria
        context: []
      assertion_type: Genetic
      assertion:
        name: DHTKD1
        gene_term:
          preferred_term: DHTKD1
          term:
            id: hgnc:23537
            label: DHTKD1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Biallelic loss-of-function variants (autosomal recessive)
        notes: ClinGen rates DHTKD1 in autosomal recessive 2-aminoadipic 2-oxoadipic aciduria as Definitive.
          The relationship is CAUSATIVE for the biochemical trait that defines the disorder; ClinGen explicitly
          classifies the condition as a biochemical abnormality, so this is not a claim that DHTKD1 variants
          cause the neurodevelopmental features. A heterozygous DHTKD1 nonsense variant in one family
          causes dominant Charcot-Marie-Tooth disease type 2Q, curated as a subtype of Charcot-Marie-Tooth_Disease_Type_2
          and assessed separately by ClinGen.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_d6dd5de3-9819-432d-996c-12a66dff277f-2020-11-03T193815.515Z
        features: DHTKD1 on 10p14 has 17 exons and encodes a 919-amino-acid mitochondrial protein. Reported
          alleles include start-loss (c.1A>G), nonsense (c.1228C>T, p.Arg410*), splice-donor, duplication,
          deletion-insertion and missense variants; two missense variants, one of them c.2185G>A (p.Gly729Arg),
          account for most alleles. Ten disease-associated missense variants have been characterised biochemically.
        variants:
        - name: c.2185G>A (p.Gly729Arg)
          description: The recurrent missense allele, found in the index patients and in most later cases.
            The variant protein assembles poorly with DLST (E2o) and the reconstituted complex has about
            50-fold lower catalytic efficiency.
        - name: c.1A>G (start-loss)
          description: Loss of the initiating methionine; found in trans with p.Gly729Arg in the first
            patient.
        - name: c.1228C>T (p.Arg410*)
          description: Nonsense allele found in trans with p.Gly729Arg in the second index patient.
      selected_evidence:
        snippet: our results establish mutations in DHTKD1 as a cause of human 2-aminoadipic and 2-oxoadipic
          aciduria via impaired turnover of decarboxylation 2-oxoadipate to glutaryl-CoA
        supports: SUPPORT
    origin:
