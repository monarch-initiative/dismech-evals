        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_dhtkd1_oadh_block
        hypothesis_label: DHTKD1 loss blocks 2-oxoadipate decarboxylation, causing upstream metabolite
          accumulation
        status: CANONICAL
        description: Biallelic DHTKD1 variants remove or inactivate E1a, so the 2-oxoadipate dehydrogenase
          complex cannot convert 2-oxoadipate to glutaryl-CoA. 2-Oxoadipate and its transamination partner
          2-aminoadipate accumulate and are excreted, together with 2-hydroxyadipate. This explains the
          defining biochemistry and is supported by patient genetics, fibroblast complementation and tracer
          studies, recombinant-enzyme kinetics and two knockout mouse lines. It does not, by itself, explain
          any clinical feature.
      selected_evidence:
        snippet: our results establish mutations in DHTKD1 as a cause of human 2-aminoadipic and 2-oxoadipic
          aciduria via impaired turnover of decarboxylation 2-oxoadipate to glutaryl-CoA
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23141293
      reference_title: DHTKD1 mutations cause 2-aminoadipic and 2-oxoadipic aciduria.
      evidence_source: HUMAN_CLINICAL
      explanation: The gene-discovery study states the canonical mechanism.
