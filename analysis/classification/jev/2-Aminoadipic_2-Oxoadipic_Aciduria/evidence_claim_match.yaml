  92e7775fdeff4c56387febe557e437e50f3481d68a36e1d9de4684361a91944b:
    claim:
      about:
        disease:
          name: 2-Aminoadipic 2-Oxoadipic Aciduria
          disease_term:
            preferred_term: 2-aminoadipic 2-oxoadipic aciduria
            term:
              id: MONDO:0008774
              label: 2-aminoadipic 2-oxoadipic aciduria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: amoxad_clinical_significance
        prompt: Is 2-aminoadipic 2-oxoadipic aciduria a disease, or a benign biochemical trait whose apparent
          clinical features come from ascertaining children who were already neurologically unwell?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - disease#2-Aminoadipic 2-Oxoadipic Aciduria
        - phenotypes#Global developmental delay
        - phenotypes#Intellectual disability
        - mechanistic_hypotheses#amoxad_metabolite_neurotoxicity
        rationale: 'The biochemical defect is certain and ClinGen rates the gene Definitive, but ClinGen
          explicitly restricts that rating to a biochemical abnormality. The clinical evidence points
          both ways. Most patients were found by urine screening of children with developmental delay
          or epilepsy, which guarantees an association whether or not the defect is causal. Against causation:
          the first described patient had a mentally and physically normal sister with the same metabolites,
          a mentally normal brother of another patient shared the defect, three of four newly genotyped
          individuals in one series were asymptomatic, and screening-detected neonates have been asymptomatic.
          Metabolite levels do not separate affected from unaffected individuals, and one knockout mouse
          line is clinically normal. For causation: the symptomatic proportion is high in the published
          series, and two deaths in early childhood (one with apparent immunodeficiency, one sudden death
          with fatty liver) have been reported, though neither was genetically confirmed or shown to result
          from the defect. Until genotype-first data exist, the neurodevelopmental phenotypes in this
          entry are recorded as reported associations, not established disease features, and the edge
          to developmental delay is scoped to an emerging hypothesis.'
        proposed_experiments:
        - experiment_id: exp_amoxad_genotype_first_recall
          name: Genotype-first recall of biallelic DHTKD1 carriers
          description: Identify individuals with biallelic predicted loss-of-function or functionally
            validated DHTKD1 variants in population biobanks or sequenced cohorts unselected for neurological
            disease, confirm the biochemical phenotype by urine and plasma metabolite measurement, and
            compare neurodevelopmental, seizure and educational outcomes with matched non-carriers and
            unaffected siblings.
          would_support:
          - mechanistic_hypotheses#amoxad_metabolite_neurotoxicity
          supporting_outcome:
          - A clear excess of developmental delay, intellectual disability or epilepsy in biochemically
            confirmed carriers relative to controls.
          refuting_outcome:
          - No excess of neurodevelopmental features at adequate power, which would support reclassifying
            the condition as a benign biochemical trait.
      selected_evidence:
        snippet: This broad range of phenotypes has led some to question whether 2-ketoadipic aciduria
          represents a true disease state or if the biochemical abnormalities found in these patients
          merely reflect an ascertainment bias.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26141459
      reference_title: New Cases of DHTKD1 Mutations in Patients with 2-Ketoadipic Aciduria.
      evidence_source: HUMAN_CLINICAL
      explanation: Frames the controversy.
