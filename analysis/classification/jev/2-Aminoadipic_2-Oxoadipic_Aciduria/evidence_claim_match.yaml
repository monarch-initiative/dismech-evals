  96177b1d6090d5bca3e3038acaa416df70d7931732b2bee6dd3275738bc20c0a:
    claim:
      about:
        disease:
          name: 2-Aminoadipic 2-Oxoadipic Aciduria
          disease_term:
            preferred_term: 2-aminoadipic 2-oxoadipic aciduria
            term:
              id: MONDO:0008774
              label: 2-aminoadipic 2-oxoadipic aciduria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: amoxad_dhtkd1_inhibition_ga1
        prompt: Does the mild course of DHTKD1 deficiency make DHTKD1 a safe substrate-reduction target
          for glutaric aciduria type 1, given that OGDH can also make glutaryl-CoA from 2-oxoadipate?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Residual 2-Oxoadipate Decarboxylation by OGDH
        - pathophysiology#Impaired Oxidative Decarboxylation of 2-Oxoadipate to Glutaryl-CoA
        - mechanistic_hypotheses#ogdh_compensation_benign_course
        rationale: 'DHTKD1 acts one step upstream of glutaryl-CoA dehydrogenase, the enzyme deficient
          in glutaric aciduria type 1, so blocking it was proposed to prevent accumulation of neurotoxic
          glutarate and 3-hydroxyglutarate; the near-benign course of AMOXAD is the safety argument. Genetic
          Dhtkd1 deletion did not rescue Gcdh-deficient mice, and cell work showed OGDH supplies the remaining
          glutaryl-CoA through a hybrid complex. This bears on AMOXAD itself: the same OGDH route may
          be why DHTKD1 loss is tolerated. Small-molecule DHTKD1 inhibitors (adipoyl phosphonate and its
          esters, tenatoprazole) now exist, and in rats they changed brain metabolism and the ECG, which
          is a reminder that pharmacological inhibition and lifelong genetic deficiency need not have
          the same consequences. Whether combined DHTKD1 and partial OGDH inhibition could reduce glutaryl-CoA
          without harming TCA-cycle function is untested.'
        proposed_experiments:
        - experiment_id: exp_dhtkd1_ogdh_flux_partition
          name: Partition of 2-oxoadipate flux between DHTKD1 and OGDH in human cells
          description: In patient fibroblasts and DHTKD1-knockout human hepatocyte models, measure labelled
            lysine flux to glutaryl-CoA derivatives with and without partial OGDH knockdown, to quantify
            how much decarboxylation OGDH carries when E1a is absent.
          would_support:
          - mechanistic_hypotheses#ogdh_compensation_benign_course
          supporting_outcome:
          - Substantial residual glutaryl-CoA formation that falls with OGDH knockdown in DHTKD1-null
            cells.
          refuting_outcome:
          - Negligible residual flux, which would mean the mild phenotype needs another explanation.
      selected_evidence:
        snippet: We hypothesized that inhibition of DHTKD1 may prevent the accumulation of neurotoxic
          dicarboxylic metabolites suggesting DHTKD1 inhibition as a possible treatment strategy for GA-I.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28545977
      reference_title: Elevated glutaric acid levels in Dhtkd1-/Gcdh- double knockout mice challenge our
