  66cb3b29f445599ea3b9c968a2dbb883b8793b599140b544a009f10a09ef72ae:
    claim:
      about:
        disease:
          name: 2-Aminoadipic 2-Oxoadipic Aciduria
          disease_term:
            preferred_term: 2-aminoadipic 2-oxoadipic aciduria
            term:
              id: MONDO:0008774
              label: 2-aminoadipic 2-oxoadipic aciduria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: amoxad_cmt2q_allelic_relationship
        prompt: How can biallelic DHTKD1 loss of function produce a mostly benign aciduria while a single
          heterozygous DHTKD1 nonsense variant was reported to cause dominant axonal Charcot-Marie-Tooth
          disease type 2Q?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#DHTKD1 Biallelic Loss of Function
        - genetic#DHTKD1
        rationale: 'CMT2Q rests on one five-generation Chinese family in which a heterozygous nonsense
          variant (p.Tyr485*) segregated with neuropathy and halved DHTKD1 mRNA through nonsense-mediated
          decay. If halving DHTKD1 were sufficient for neuropathy, the heterozygous parents of AMOXAD
          patients, and the patients themselves with little or no residual activity, would be expected
          to have neuropathy, which has not been reported. Possible explanations include a second, unidentified
          variant on the CMT2Q haplotype, a dominant-acting effect specific to that allele or to residual
          truncated protein, or under-examination of AMOXAD patients and carriers for peripheral nerve
          disease. ClinGen assessed the two conditions separately and noted the CMT2Q evidence comes from
          a single family. The mouse data disagree: one Dhtkd1 knockout develops a CMT2-like neuropathy
          and a knock-in of the CMT2Q allele gives a partial sensory phenotype, while another knockout
          is clinically normal. CMT2Q is curated as a subtype of Charcot-Marie-Tooth_Disease_Type_2; this
          entry does not duplicate it.'
        proposed_experiments:
        - experiment_id: exp_amoxad_nerve_conduction_survey
          name: Peripheral nerve assessment of AMOXAD patients and heterozygous relatives
          description: Perform nerve conduction studies and a structured neuropathy examination in genotyped
            AMOXAD patients and their heterozygous parents, and re-sequence the CMT2Q family across the
            linked 10p13-14 interval for a second candidate variant.
          supporting_outcome:
          - Axonal neuropathy in AMOXAD patients or carriers would indicate that DHTKD1 dosage itself
            affects peripheral nerve.
          refuting_outcome:
          - Normal studies, or a second causal variant in the CMT2Q family, would indicate that the CMT2Q
            effect is allele- or locus-specific.
      selected_evidence:
        snippet: DHTKD1 mRNA expression levels in peripheral blood of affected persons were observed to
          be half of those in unaffected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
