    claim:
      about:
        disease:
          name: 2-Aminoadipic 2-Oxoadipic Aciduria
          disease_term:
            preferred_term: 2-aminoadipic 2-oxoadipic aciduria
            term:
              id: MONDO:0008774
              label: 2-aminoadipic 2-oxoadipic aciduria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: amoxad_diagnostic_confounders
        prompt: Which published cases of alpha-aminoadipic or alpha-ketoadipic aciduria are DHTKD1 deficiency,
          and which are phenocopies or unconfirmed?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - diagnosis#Plasma and urine amino acid analysis
        - differential_diagnoses#Vigabatrin-induced alpha-aminoadipic aciduria
        - differential_diagnoses#Kearns-Sayre syndrome presenting with 2-oxoadipic aciduria
        rationale: 'Much of the clinical description of this disorder comes from case reports published
          before DHTKD1 was identified in 2012, diagnosed on biochemistry alone. Several cannot be assumed
          to be DHTKD1 deficiency: one girl with seizures, dysmorphism and persistent fetal haemoglobin
          had normal fibroblast decarboxylation; one child''s transient 2-oxoadipic aciduria preceded
          Kearns-Sayre syndrome; vigabatrin reproduces the plasma and urine 2-aminoadipate levels of the
          inherited disorder; and in one sequencing series two of ten biochemically diagnosed patients
          had no causal DHTKD1 variants. Pooling these cases inflates the apparent clinical burden. When
          adding phenotypes to this entry, prefer genotyped cases and record the diagnostic basis of older
          ones.'
      selected_evidence:
        snippet: We have now sequenced DHTKD1 in nine patients diagnosed with alpha-aminoadipic and alpha-ketoadipic
          aciduria as well as one patient with isolated alpha-aminoadipic aciduria, and identified causal
          mutations in eight.
        supports: SUPPORT
