      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ogdh_compensation_benign_course
        hypothesis_label: OGDH-containing complexes partly decarboxylate 2-oxoadipate, limiting the consequences
          of DHTKD1 loss
        status: EMERGING
        description: E1o (OGDH) can also decarboxylate 2-oxoadipate, and DHTKD1 forms a hybrid complex
          with OGDH, DLST and DLD. Residual glutaryl-CoA production through OGDH would let lysine flux
          continue past the block, which may explain why DHTKD1 deficiency is mild or silent in most people
          and in knockout mice, and why DHTKD1 loss does not abolish glutaryl-CoA formation in a GA1 background.
          The human contribution of this route has not been measured.
      selected_evidence:
        snippet: provides evidence for a so far unknown mechanism leading to glutaryl-CoA
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
