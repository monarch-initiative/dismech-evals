      assertion:
        phase: Newborn-screening ascertainment
        age_range: Neonatal period
        notes: SBCADD is usually detected incidentally through elevated C5. Urine organic acid or acylglycine
          analysis and ACADSB testing distinguish it from isovaleric acidemia and pivalate-related C5
          elevations. C5 and urinary metabolites can vary, so a single normal follow-up value does not
          exclude the biochemical phenotype.
