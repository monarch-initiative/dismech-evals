      assertion:
        name: ACADSB pathogenic variants
        gene_term:
          preferred_term: ACADSB
          term:
            id: hgnc:91
            label: ACADSB
        association: Pathogenic Variants
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: c.1165A>G (exon 10 skipping), Hmong founder variant
          description: c.1165A>G causes exon 10 skipping and is a founder variant in the Hmong population.
            In random Wisconsin Hmong newborn cards, 1.3% were homozygous and 21.8% heterozygous. The
            variant is enriched in Miao and Dong groups in China, but those data do not prove a separate
            founder event.
        - name: c.303+3A>G, Somali/Eritrean population-enriched splice variant
          description: The intron 3 c.303+3A>G splice-region variant was observed homozygously in a Somali
            child and in two previously reported people of Somali and Eritrean origin. This small case
            series suggests population enrichment but does not establish a founder effect or penetrance
            for neurologic findings.
        - name: Diverse ACADSB loss-of-function and missense variants
          description: Nonsense, splice, frameshift, and missense variants occur outside the Hmong founder
            background. Expression studies of selected missense alleles demonstrated inactive or unstable
            SBCAD protein; genotype-phenotype correlations remain unresolved.
        features: Biallelic pathogenic ACADSB variants reduce the activity or stability of the mitochondrial
          short/branched-chain acyl-CoA dehydrogenase. The gene-disease relationship is definitive, but
          variant class does not currently predict whether an individual will have attributable clinical
          symptoms.
      selected_evidence:
        snippet: ACADSB | HGNC:91 | 2-methylbutyryl-CoA dehydrogenase deficiency | MONDO:0012392 | AR
          | Definitive
        supports: SUPPORT
