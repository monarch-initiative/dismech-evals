        name: C5-acylcarnitine signal in blood
        presence: INCREASED
        context: Elevated C5 is the usual newborn-screening signal. Standard tandem mass spectrometry
          does not resolve 2-methylbutyrylcarnitine from isovalerylcarnitine or pivaloylcarnitine, so
          it is a screening trigger rather than proof of SBCADD. C5 can be normal in genetically confirmed
          cases.
        readouts:
        - target: Impaired isoleucine catabolism via SBCAD loss-of-function
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: In a confirmed case, 2-methylbutyrylcarnitine contributes to the unresolved
            C5 signal and reports the upstream SBCAD-dependent isoleucine block.
      selected_evidence:
        snippet: Ten individuals showed elevated C5 in blood, ranging from 0.32 to 1.64 µmol/L; the remaining
          two individuals showed C5 levels within the normal reference range.
        supports: SUPPORT
