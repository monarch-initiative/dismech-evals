        prompt: Are neurologic findings and catabolic decompensation causally attributable to ACADSB deficiency,
          and what is the lifetime penetrance of clinically meaningful disease among screen-detected individuals?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Largely asymptomatic course
        - phenotypes#Developmental delay
        - phenotypes#Seizures
        - phenotypes#Autism
        - phenotypes#Metabolic acidosis
        - pathophysiology#Possible catabolic-stress susceptibility
        rationale: Symptom-ascertained reports describe neurologic disease and occasional decompensation,
          whereas newborn-screening cohorts are overwhelmingly well and include symptomatic people sharing
          genotypes with asymptomatic people. Authors explicitly question causation, and follow-up is
          too short and heterogeneous to estimate lifetime penetrance.
        proposed_experiments:
        - experiment_id: exp_sbcadd_natural_history_registry
          name: Genotype-first prospective natural-history registry
          description: Enroll newborn-screened and genotype-ascertained individuals irrespective of symptoms;
            collect uniform developmental, neurologic, illness, biochemical, genomic, and treatment data
            with population comparators.
