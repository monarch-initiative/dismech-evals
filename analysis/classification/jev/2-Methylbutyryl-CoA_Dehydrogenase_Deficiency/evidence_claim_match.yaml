          of SBCADD. Standard C5 measurement does not resolve 2-methylbutyrylcarnitine from isovalerylcarnitine
          or pivaloylcarnitine, and some genetically confirmed individuals have C5 below a program cutoff.
        phenotype_term:
          preferred_term: Elevated circulating C5 acylcarnitine concentration
          term:
            id: HP:0035019
            label: Elevated circulating C5 acylcarnitine concentration
        reports_on:
        - target: C5-acylcarnitine signal in blood
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Tandem mass spectrometry reports the unresolved C5-acylcarnitine signal; standard
            C5 measurement does not identify which isomer is elevated.
      selected_evidence:
        snippet: Ten individuals showed elevated C5 in blood, ranging from 0.32 to 1.64 µmol/L; the remaining
          two individuals showed C5 levels within the normal reference range.
        supports: SUPPORT
