      assertion_type: Discussion
      assertion:
        discussion_id: gap_22q11_multigene_genotype_phenotype_prediction
        prompt: Which deleted genes, remaining-allele variants, deletion boundaries, and genome-wide modifiers
          causally determine the major cardiac, immune, neurodevelopmental, and psychiatric phenotypes
          of 22q11.2 deletion syndrome?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Recurrent LCR22-mediated multigene deletion
        - pathophysiology#TBX1-associated pharyngeal developmental vulnerability
        - pathophysiology#DGCR8-associated miRNA-processing disruption
        rationale: TBX1 is a major developmental contributor but does not explain the full contiguous-gene
          syndrome. A large cohort now links deletion size and background variation to lesion-specific
          cardiac outcomes, while overall genotype-phenotype prediction remains weak. Resolving gene-
          and tissue-specific contributions is necessary to avoid both singular-TBX1 attribution and untestable
          multigene narratives.
        proposed_experiments:
        - experiment_id: exp_22q11_multicenter_genotype_phenotype_modifier_cohort
          name: Deletion-resolved longitudinal genotype-phenotype modifier cohort
          description: Combine precisely mapped deletion intervals, long-read or whole-genome remaining-allele
            data, longitudinal cardiac/immune/neuropsychiatric phenotypes, and ancestry-aware analyses
            across multiple centers to test reproducible gene- and background-modifier effects.
      selected_evidence:
        snippet: These lesion-specific findings suggest the hypothesis that deletion interval and broader
          genetic background may contribute to CHD variability in 22q11.2DS, pending future replication.
        supports: SUPPORT
