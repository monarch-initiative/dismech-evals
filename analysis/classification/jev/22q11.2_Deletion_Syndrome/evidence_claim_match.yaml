        context: []
      assertion_type: Treatment
      assertion:
        name: Velopharyngeal surgery for persistent hypernasality
        action_category: THERAPEUTIC
        therapeutic_modality: SURGERY
        description: 'Speech surgery for velopharyngeal insufficiency that persists after speech therapy.
          A small single-centre series (14 patients, 7 per arm) reported that pharyngoplasty resolved
          hypernasality where palatoplasty did not, which the authors attributed to the deficit being
          pharyngeal and myogenic as well as palatal; the comparison is underpowered and is reported by
          its authors as a "may be less effective" signal rather than a settled preference. Separately,
          and in a larger matched cohort, outcomes after sphincter pharyngoplasty are comparable to those
          in non-syndromic patients, so the deletion is not by itself a reason to expect surgical failure.

          NCIT has no pharyngoplasty or velopharyngeal-repair term reachable from NCIT:C25218, so the
          binding is the generic surgical action and the specificity is carried in preferred_term.'
        treatment_term:
          preferred_term: velopharyngeal (pharyngoplasty) surgical procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        target_phenotypes:
        - preferred_term: Velopharyngeal insufficiency
          term:
            id: HP:0000220
            label: Velopharyngeal insufficiency
        - preferred_term: Hypernasal speech
          term:
            id: HP:0001611
            label: Hypernasal speech
      selected_evidence:
        snippet: In contrast, 86% of patients in the pharyngoplasty group had resolution of hypernasality.
        supports: SUPPORT
