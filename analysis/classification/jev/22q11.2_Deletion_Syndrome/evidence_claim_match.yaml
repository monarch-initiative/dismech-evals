              label: 22q11.2 deletion syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Velopharyngeal structural and myogenic insufficiency
        description: The velopharyngeal port fails to close during speech because of combined structural
          and muscular factors - a deep pharynx, palatal anomalies that are often submucous rather than
          overt, and hypodynamic pharyngeal musculature. This is the mechanistic substrate of the historical
          velocardiofacial presentation, and it is the proposed explanation for resonance persisting after
          a purely palatal repair - proposed rather than established, since the supporting surgical comparison
          is a 14-patient series.
        biological_scale: TISSUE
        locations:
        - preferred_term: soft palate
          term:
            id: UBERON:0001733
            label: soft palate
        - preferred_term: pharynx
          term:
            id: UBERON:0001042
            label: chordate pharynx
        biological_processes:
        - preferred_term: palate development
          term:
            id: GO:0060021
            label: roof of mouth development
      selected_evidence:
        snippet: Patients who underwent palatoplasty achieved an increase in velar length, but this did
          not lead to resolution of hypernasality, suggesting that underlying anatomical differences such
          as increased pharyngeal depth and hypodynamic muscles may make palatoplasty less effective at
          resolving hypernasality in patients with 22q.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39056299
      reference_title: Do Palatoplasty Procedures Resolve Hypernasality as Effectively as Pharyngoplasty
        Procedures in Patients with 22q11.2 Deletion Syndrome?
      evidence_source: HUMAN_CLINICAL
      explanation: Names both components of this node - pharyngeal depth (structural) and hypodynamic
        muscles (myogenic) - and shows they persist after velar lengthening, which is why the node is
        not reducible to palatal anatomy.
