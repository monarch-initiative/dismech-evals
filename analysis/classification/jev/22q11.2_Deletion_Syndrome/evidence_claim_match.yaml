      assertion:
        name: Velocardiofacial
        display_name: Velocardiofacial (Shprintzen) syndrome
        subtype_term:
          preferred_term: velocardiofacial syndrome
          term:
            id: MONDO:0008644
            label: velocardiofacial syndrome
        genes:
        - preferred_term: TBX1
          description: 'Bound for the same reason as on the DiGeorge row: TBX1 point mutations without
            a deletion have been reported in patients with this presentation.'
          term:
            id: hgnc:11592
            label: TBX1
        description: The historical Shprintzen label, emphasising the velopharyngeal, cardiac and facial
          features. As with DiGeorge syndrome it names a presentation of the same deletion rather than
          a distinct lesion, and the entry models its mechanistic substrate as the "Velopharyngeal structural
          and myogenic insufficiency" node. This entry's own description records both, along with CATCH22,
          as historical labels for the same deletion, which is why the entry is anchored on the deletion
          and carries them as subtypes rather than splitting into separate disease files.
      selected_evidence:
        snippet: We identified three mutations of TBX1 in two unrelated patients without the 22q11.2 deletion-one
          with sporadic conotruncal anomaly face syndrome/velocardiofacial syndrome and one with sporadic
          DiGeorge's syndrome-and in three patients from a family with conotruncal anomaly face syndrome/velocardiofacial
          syndrome.
        supports: SUPPORT
