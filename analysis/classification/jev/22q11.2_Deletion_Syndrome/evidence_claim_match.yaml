      assertion_type: ProgressionInfo
      assertion:
        phase: Congenital multisystem presentation
        age_range: Prenatal period through infancy
        notes: Developmental anomalies may be recognized prenatally or at birth, but presentation varies
          widely and some individuals are diagnosed later.
      selected_evidence:
        snippet: The major clinical manifestations of 22q11.2DS include congenital heart disease, particularly
          conotruncal malformations (ventricular septal defect, tetralogy of Fallot, interrupted aortic
          arch, and truncus arteriosus), palatal abnormalities (velopharyngeal incompetence, submucosal
          cleft palate, bifid uvula, and cleft palate), immune deficiency, characteristic facial features,
          and learning difficulties.
        supports: SUPPORT
