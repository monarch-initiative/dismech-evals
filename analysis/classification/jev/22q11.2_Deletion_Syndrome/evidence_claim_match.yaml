      assertion_type: Subtype
      assertion:
        name: DiGeorge
        display_name: DiGeorge syndrome
        subtype_term:
          preferred_term: DiGeorge syndrome
          term:
            id: MONDO:0008564
            label: DiGeorge syndrome
        genes:
        - preferred_term: TBX1
          description: Bound as the dosage-sensitive gene whose loss drives the thymic/parathyroid/conotruncal
            arm of this presentation, and the gene in which the cited report found point mutations reproducing
            it in patients with no 22q11.2 deletion. That report screened TBX1 and does not establish
            that no other interval gene behaves the same way. In nearly every patient the lesion is the
            deletion, not a TBX1 sequence variant; see the "Recurrent 22q11.2 deletion" record in `genetic`.
          term:
            id: hgnc:11592
            label: TBX1
        description: 'The historical label for the thymic, parathyroid and conotruncal presentation of
          the 22q11.2 deletion. It is carried here as a named clinical presentation rather than a separate
          mechanism: the lesion is the same contiguous-gene deletion this entry curates, and the entry
          already models the immunodeficiency and cardiac arms as pathophysiology nodes. This row exists
          so that the MONDO concept, and the gene MONDO attaches to it, are addressable in the same place
          as the presentation they describe.'
      selected_evidence:
        snippet: We identified three mutations of TBX1 in two unrelated patients without the 22q11.2 deletion-one
          with sporadic conotruncal anomaly face syndrome/velocardiofacial syndrome and one with sporadic
          DiGeorge's syndrome-and in three patients from a family with conotruncal anomaly face syndrome/velocardiofacial
          syndrome.
        supports: SUPPORT
