  ae545c3a860c2a6b65832a222c8ebf72036f6174b03b547d9403da27208bcba3:
    claim:
      about:
        disease:
          name: 22q11.2 Deletion Syndrome
          disease_term:
            preferred_term: 22q11.2 deletion syndrome
            term:
              id: MONDO:0018923
              label: 22q11.2 deletion syndrome
        context:
        - path: /treatments/6
          value:
            name: Velopharyngeal surgery for persistent hypernasality
            action_category: THERAPEUTIC
            therapeutic_modality: SURGERY
            description: 'Speech surgery for velopharyngeal insufficiency that persists after speech therapy.
              A small single-centre series (14 patients, 7 per arm) reported that pharyngoplasty resolved
              hypernasality where palatoplasty did not, which the authors attributed to the deficit being
              pharyngeal and myogenic as well as palatal; the comparison is underpowered and is reported
              by its authors as a "may be less effective" signal rather than a settled preference. Separately,
              and in a larger matched cohort, outcomes after sphincter pharyngoplasty are comparable to
              those in non-syndromic patients, so the deletion is not by itself a reason to expect surgical
              failure.

              NCIT has no pharyngoplasty or velopharyngeal-repair term reachable from NCIT:C25218, so
              the binding is the generic surgical action and the specificity is carried in preferred_term.'
            treatment_term:
              preferred_term: velopharyngeal (pharyngoplasty) surgical procedure
              term:
                id: NCIT:C15329
                label: Surgical Procedure
            target_phenotypes:
            - preferred_term: Velopharyngeal insufficiency
              term:
                id: HP:0000220
                label: Velopharyngeal insufficiency
            - preferred_term: Hypernasal speech
              term:
                id: HP:0001611
                label: Hypernasal speech
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Velopharyngeal structural and myogenic insufficiency
        description: Pharyngoplasty narrows the velopharyngeal port, addressing the pharyngeal and myogenic
          components of the node that palatal repair alone leaves.
      selected_evidence:
        snippet: No patient who underwent palatoplasty achieved resolution of hypernasality; 1/7 patients
          had worse hypernasality, 4/7 had no change, and 2/7 had improved hypernasality.
        supports: SUPPORT
