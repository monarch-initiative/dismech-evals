              label: 22q11.2 deletion syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Recurrent LCR22-mediated multigene deletion
        description: Low-copy repeats at 22q11.2 predispose to non-allelic homologous recombination and
          recurrent deletions. The common A-D interval removes more than 40 coding genes, so the syndrome
          reflects combined dosage effects and background modifiers rather than a single-gene lesion.
        genes:
        - preferred_term: TBX1
          term:
            id: hgnc:11592
            label: TBX1
        - preferred_term: DGCR8
          term:
            id: hgnc:2847
