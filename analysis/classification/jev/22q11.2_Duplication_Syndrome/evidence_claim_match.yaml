      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant duplication with markedly reduced penetrance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        de_novo_rate: Both de novo and inherited duplications are reported; unlike the reciprocal deletion,
          most tested cases are inherited.
        description: The duplication can arise de novo or be inherited in an autosomal dominant manner
          with incomplete penetrance and variable expressivity. A carrier has a 50% chance of transmitting
          the duplication to each offspring; this is a transmission probability, not a probability of
          clinical impairment. Prenatal detection establishes the copy-number gain but cannot reliably
          predict the phenotype.
      selected_evidence:
        snippet: Both patients with a de novo 22q11.2 duplication and patients in whom the duplication
          has been inherited from a phenotypically normal parent have been reported.
        supports: SUPPORT
