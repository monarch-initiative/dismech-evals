      assertion_type: Pathophysiology
      assertion:
        name: Variable breakpoint-dependent 2q37 deletion
        description: Terminal and interstitial 2q37 deletions remove variable gene content and produce
          a contiguous-gene dosage disorder. Clinical expressivity is incomplete and depends on the specific
          chromosome anomaly; the available evidence does not support a simple rule that larger deletions
          always cause more severe disease.
      selected_evidence:
        snippet: These features overlap with other neurodevelopmental conditions, including Smith-Magenis
          syndrome (SMS), and may be incompletely penetrant or demonstrate variable expressivity, depending
          on the specific chromosomal anomaly.
        supports: SUPPORT
