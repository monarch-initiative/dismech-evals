      selected_evidence:
        snippet: Most individuals with the 2q37 microdeletion syndrome have a de novo chromosome deletion
          and their parents have normal karyotypes. In approximately 5% of published cases, probands have
          inherited the deletion from a parent who is a balanced translocation carrier.
        supports: SUPPORT
