        prompt: Which components of the constitutional 2q37 deletion phenotype are caused specifically
          by HDAC4 haploinsufficiency, which require other deleted genes or breakpoint effects, and which
          associations remain insufficiently resolved for a gene-specific causal edge?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Partial contribution of HDAC4 haploinsufficiency
        - genetic#HDAC4
        rationale: Early reports concluded that HDAC4 haploinsufficiency was sufficient for the brachydactyly-intellectual
          disability phenotype, but later individuals with HDAC4 haploinsufficiency had normal intelligence,
          and some 2q37 deletions lacking HDAC4 had intellectual or skeletal findings. Current ontology
          separately identifies HDAC4-related haploinsufficiency syndrome, so this record already treats
          deletion-negative disease as a differential. Expert resolution is still needed to determine
          how much gene-specific causal detail belongs in this multigene deletion record.
      selected_evidence:
        snippet: Although two patients had some skeletal findings, the deletion region did not contain
          HDAC4 gene in one of the patients.
        supports: SUPPORT
