        prompt: Do the liver-specific HMGCL-knockout acyl-CoA/N-acetylglutamate mechanism and intracerebroventricular
          HMG neurotoxicity model quantitatively explain human hyperammonemia and neurologic injury?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Preclinical hepatic acyl-CoA disequilibrium
        - pathophysiology#Preclinical HMG-mediated mitochondrial injury
        rationale: Both models establish biological plausibility, but one is a liver-restricted knockout
          and the other bypasses systemic metabolism by directly injecting HMG into the neonatal rat brain.
          Human acyl-CoA/NAG measurements and patient-derived neural models are needed before these branches
          can be treated as established human mechanisms.
      selected_evidence:
        snippet: We created a mouse model of one such condition, deficiency of 3-hydroxy-3-methylglutaryl-CoA
          lyase (HL), in liver (HLLKO mice).
        supports: SUPPORT
