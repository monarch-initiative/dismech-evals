        prompt: What combination of 4HMP, acute plasma C2/C0, ketone response, and molecular testing provides
          adequate sensitivity and specificity, and can any strategy reliably identify presymptomatic
          patients or support newborn screening?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - biochemical#Urinary 4-hydroxy-6-methyl-2-pyrone
        - biochemical#Plasma C2/C0 acylcarnitine ratio
        - diagnosis#HMGCS2 molecular genetic testing
        rationale: 4HMP is frequently found during acute episodes but is not pathognomonic; acute plasma
          C2/C0 performs better than dried blood spots; and routine profiles can normalize intercritically.
          These limitations leave screening sensitivity and the optimal confirmatory workflow unresolved.
          No prospective diagnostic-accuracy study exists, and the only reported performance figure rests
          on eight decompensation samples with a confidence interval spanning 35% to 100%.
      selected_evidence:
        snippet: We have also noted these markers (including 4HMP) in severely ketotic patients and thus
          these metabolites are not pathognomonic for this condition.
        supports: SUPPORT
