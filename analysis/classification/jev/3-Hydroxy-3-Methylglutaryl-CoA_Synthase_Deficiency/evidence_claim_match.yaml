      - /disease_term
    evidence_metadata:
      reference: PMID:32905056
      reference_title: 'Hypoglycemia is not a defining feature of metabolic crisis in mitochondrial 3-hydroxy-3-methylglutaryl-CoA
        synthase deficiency: Further evidence of specific biochemical markers which may aid diagnosis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Human evidence qualifies hypoglycemia as common rather than required.
