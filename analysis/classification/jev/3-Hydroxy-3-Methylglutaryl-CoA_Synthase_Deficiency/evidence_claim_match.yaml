      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_human_hmgcs2_ketogenesis_failure
        hypothesis_label: Canonical Human HMGCS2 Ketogenesis-Failure Model
        status: CANONICAL
        description: Biallelic pathogenic HMGCS2 variants reduce mitochondrial HMG-CoA synthase activity
          in hepatocytes. The resulting block in HMG-CoA formation limits hepatic ketone-body synthesis.
          When fasting or illness increases reliance on ketogenesis, inadequate alternative-fuel production
          predisposes to an acute hypoketotic metabolic crisis. Hypoglycemia is common but is not a required
          component of the crisis.
      selected_evidence:
        snippet: This case provides further evidence that hypoglycemia is not invariably present in symptomatic
          mHS deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
