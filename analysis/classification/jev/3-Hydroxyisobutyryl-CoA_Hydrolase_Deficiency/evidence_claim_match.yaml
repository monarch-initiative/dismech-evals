      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_hibch_reactive_metabolite_model
        hypothesis_label: Canonical HIBCH Reactive-Metabolite Model
        status: CANONICAL
        description: Loss of HIBCH activity blocks hydrolysis of 3-hydroxyisobutyryl-CoA. Accumulated
          valine-pathway intermediates are associated with 3-hydroxyisobutyrylcarnitine and methacrylyl-CoA-derived
          thiol conjugates. Reactive intermediate toxicity is proposed to impair mitochondrial proteins
          and energy metabolism, but the causal steps and the reason for selective basal-ganglia vulnerability
          are not fully established in humans.
      selected_evidence:
        snippet: The index case had deficiencies of multiple RC enzymes and PDHc in skeletal muscle and
          fibroblasts respectively, but these were normal in his younger brother.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24299452
      reference_title: HIBCH mutations can cause Leigh-like disease with combined deficiency of multiple
        mitochondrial respiratory chain enzymes and pyruvate dehydrogenase.
      evidence_source: HUMAN_CLINICAL
      explanation: Human secondary mitochondrial abnormalities support part of the model but their sibling
        discordance shows that they are not required.
