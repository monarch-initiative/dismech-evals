  700594dbfb90e2da40648281e46b9905756b89793ef3386165330671958b23a2:
    claim:
      about:
        disease:
          name: 3-M Syndrome
          disease_term:
            preferred_term: 3-M syndrome
            term:
              id: MONDO:0007477
              label: 3-M syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysfunction of a 3-M Complex Component
        biological_scale: MOLECULAR
        description: Biallelic pathogenic variants impair CUL7, OBSL1 or CCDC8 function. CUL7 provides
          the scaffold of a ubiquitin ligase; OBSL1 and CCDC8 have adaptor and localization functions.
          Loss of either adaptor need not abolish the purified ligase catalytic activity. The experimental
          phenotypes below were studied in different cell types and genotypes and do not constitute one
