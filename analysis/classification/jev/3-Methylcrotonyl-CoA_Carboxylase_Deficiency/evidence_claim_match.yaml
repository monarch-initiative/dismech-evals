        prompt: 'Do the mitochondrial and oxidative-stress effects observed in two affected fibroblast
          lines and metabolite-exposed rat cortex preparations operate in vivo, and do they explain any
          human clinical outcome?

          '
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Experimental mitochondrial and oxidative stress
        rationale: 'The experimental findings are mechanistically interesting but derive from very small
          in-vitro systems. The branch is intentionally detached from patient phenotypes until human tissue,
          biomarker, or intervention data establish translation.

          '
        proposed_experiments:
        - experiment_id: exp_3mccd_human_metabolic_stress_translation
          name: Genotype-confirmed human metabolic-stress translation study
          description: 'Compare isogenic control and MCCC1- or MCCC2-deficient human iPSC-derived hepatocytes
            under basal and catabolic-stress conditions, measuring MCC flux, C5OH and organic-acid release,
            free carnitine, mitochondrial respiration, and redox markers. In parallel, test whether the
            same marker signature is detectable prospectively during well and illness visits in molecularly
            confirmed patients, including asymptomatic and crisis-prone groups. Concordant, crisis-associated
            human-cell and patient signatures would support translation; their absence would argue that
            the fibroblast and rat-preparation findings are model-specific.

            '
      selected_evidence:
        snippet: It is therefore presumed that alterations of the cellular redox homeostasis
        supports: SUPPORT
