        prompt: 'Should MCCC1 p.Arg385Ser be treated as a clinically relevant dominant-negative, biotin-responsive
          exception, or as a low-penetrance biochemical allele whose reported two-patient response does
          not justify changing canonical recessive inheritance or routine treatment?

          '
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - genetic#MCCC1
        rationale: 'An early report described partial deficiency, heterozygous dominant-negative behavior,
          and biotin responsiveness in two people. A larger later cohort found the allele in both severely
          affected and asymptomatic individuals. This exceptional literature should not support routine
          biotin therapy without specialist review.

          '
      selected_evidence:
        snippet: Both showed evidence of biotin responsiveness and were heterozygous for the missense
          mutation MCCA-R385S.
        supports: SUPPORT
