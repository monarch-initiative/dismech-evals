        description: 'Biallelic pathogenic variants in MCCC1 or MCCC2 reduce activity of the mitochondrial
          alpha6-beta6 methylcrotonyl-CoA carboxylase holoenzyme. The biotin-dependent enzyme catalyzes
          the fourth step of leucine catabolism, converting 3-methylcrotonyl-CoA toward 3-methylglutaconyl-CoA.

          '
