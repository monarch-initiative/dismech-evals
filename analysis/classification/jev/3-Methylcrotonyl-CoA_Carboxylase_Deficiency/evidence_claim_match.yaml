      assertion_type: DifferentialDiagnosis
      assertion:
        name: Maternal 3-methylcrotonyl-CoA carboxylase deficiency
        description: 'Placental transfer of maternal C5OH-related metabolites can produce an abnormal
          newborn result in an unaffected infant. Repeat infant studies can normalize while maternal acylcarnitines
          remain abnormal; maternal molecular or enzyme confirmation then identifies the source.

          '
        distinguishing_features:
        - Resolution of the infant C5OH elevation on repeat testing.
        - Persistent abnormal maternal acylcarnitines or urine organic acids.
        - Maternal biallelic MCCC1/MCCC2 variants or isolated MCC enzyme deficiency.
      selected_evidence:
        snippet: 18 asymptomatic mothers who were discovered to have MCCD only by detection of abnormal
          C5OH-carnitine in the newborn screening sample
        supports: SUPPORT
