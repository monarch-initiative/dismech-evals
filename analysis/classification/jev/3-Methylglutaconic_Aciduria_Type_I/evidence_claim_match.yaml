        name: Secondary 3-methylglutaconic acidurias
        description: TAZ/Barth, SERAC1/MEGDEL, OPA3/Costeff, DNAJC19/DCMA, TMEM70-related disease, and
          other mitochondrial disorders can produce persistent 3-methylglutaconic aciduria without an
          AUH-dependent leucine-catabolism block.
        distinguishing_features:
        - Biallelic AUH variants and deficient 3-methylglutaconyl-CoA hydratase establish primary MGA1.
        - Secondary disorders are classified by their causal protein and syndrome-specific phenotype rather
          than by a numbered 3-MGA type.
        - In a specialist series, leucine loading increased urinary 3-methylglutaconic acid only in AUH
          defect.
      selected_evidence:
        snippet: One should distinguish between "primary 3-methylglutaconic aciduria" formerly known as
          type I (3-methylglutaconyl-CoA hydratase deficiency, AUH defect) due to defective leucine catabolism
          and the--currently known--three groups of "secondary 3-methylglutaconic aciduria".
        supports: SUPPORT
