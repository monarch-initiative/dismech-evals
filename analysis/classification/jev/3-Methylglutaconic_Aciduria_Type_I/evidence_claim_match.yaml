      assertion_type: DifferentialDiagnosis
      assertion:
        name: 3-hydroxy-3-methylglutaryl-CoA lyase deficiency
        description: HMGCL deficiency is an adjacent leucine-pathway disorder that can produce C5-OH,
          3-methylglutaconic acid, 3-methylglutaric acid, and 3-hydroxyisovaleric acid. Unlike the uncertain
          clinical penetrance of MGA1, HMGCL deficiency can cause severe acute hypoketotic metabolic crises.
        distinguishing_features:
        - Urinary 3-hydroxy-3-methylglutaric acid is a discriminating HMGCL-deficiency marker not expected
          in the core MGA1 profile.
        - Acute vomiting, acidosis, and hypoketotic hypoglycemia support HMGCL deficiency rather than
          uncomplicated MGA1.
        - HMGCL enzyme or molecular testing, rather than AUH testing, confirms the diagnosis.
      selected_evidence:
        snippet: Patients with HMGCLD present with a diagnostic urinary pattern of elevated organic acids
          such as 3‐hydroxyisovaleric acid (3HIV‐A), 3‐methylglutaconic acid (3MGC‐A), 3‐hydroxy‐3‐methylglutaric
          acid (3H3MG‐A), 3‐methylglutaric acid (3MG‐A) and in some cases 3‐methylcrotonylglycine.
        supports: SUPPORT
