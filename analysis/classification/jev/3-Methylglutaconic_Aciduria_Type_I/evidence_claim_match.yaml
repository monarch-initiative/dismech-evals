        status: OPEN
        attaches_to:
        - pathophysiology#Reported pediatric neurodevelopmental association of uncertain causality
        - phenotypes#Delayed speech and language development
        - phenotypes#Severe global developmental delay
        rationale: Clinically ascertained cases report heterogeneous pediatric findings, but four newborn-screened
          patients, including three followed for more than 18 years without treatment, remained asymptomatic.
          The current evidence cannot estimate clinical penetrance or separate AUH effects from background
          neurodevelopmental variation.
        proposed_experiments:
        - experiment_id: exp_mga1_family_controlled_natural_history
          name: Family-controlled longitudinal natural-history study
          description: Follow all molecularly confirmed individuals identified through screening, including
            untreated participants and variant-negative relatives, with standardized cognition, language,
            motor, psychiatric, metabolite, and MRI assessments. Prespecified family-control comparisons
            would quantify penetrance while limiting ascertainment bias.
      selected_evidence:
        snippet: We describe two siblings with 3-methylglutaconic aciduria type I with phenotypic heterogeneity.
        supports: SUPPORT
