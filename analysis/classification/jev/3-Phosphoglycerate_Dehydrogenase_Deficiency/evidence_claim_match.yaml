            label: brain white matter
        diagnostic: false
        subtype: Infantile
        context: Four-patient MRI series; the finding is characteristic but not pathognomonic.
        description: Pretreatment brain MRI showed hypomyelination and profound white-matter attenuation
          in four individuals. Increased white-matter volume and progress of myelination during amino-acid
          treatment occurred in only two of four.
      selected_evidence:
        snippet: Recently, patients were reported with a potentially treatable disorder of serine biosynthesis.
          They presented with congenital microcephaly, severe psychomotor retardation and intractable
          seizures. Low concentrations of the amino acids serine, glycine as well as 5-methyltetrahydrofolate
          were found in plasma and CSF and were due to a deficiency of the enzyme 3-phosphoglycerate dehydrogenase
          (3-PGDH). We studied four patients aged 10 months to 7 years by MRI before and after treatment
          with amino acids with a follow-up of 16 months to 6 years. Magnetic resonance spectroscopy (MRS)
          was performed in two patients at 4 and 16 months of treatment. Pre-treatment MRI demonstrated
          hypomyelination and profound white matter attenuation in all patients. During treatment, a significant
          increase in white matter volume was found and a progress of myelination in two patients.
        supports: SUPPORT
