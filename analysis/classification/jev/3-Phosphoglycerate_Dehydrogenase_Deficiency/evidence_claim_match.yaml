        prompt: How reproducible, safe, dose-dependent, and timing-dependent are early postnatal and antenatal
          L-serine benefits in PHGDH deficiency?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: Seizure improvement is repeated across small cohorts, but developmental recovery is
          inconsistent. One antenatally treated fetus had improved head growth and an unremarkable 48-month
          outcome, which establishes precedent but not general efficacy or safety.
        attaches_to:
        - pathophysiology#Low L-Serine and Downstream Metabolites
        - pathophysiology#Infantile and Juvenile Neurologic Disease
        proposed_experiments:
        - experiment_id: phgdh_prospective_treatment_registry
          name: Prospective genotype- and treatment-timing registry
          description: Enroll molecularly confirmed PHGDH cases before treatment and collect standardized
            dose, treatment-age, seizure, development, amino-acid, and longitudinal MRI outcomes, with
            a separately governed prenatal cohort.
          decision_criterion: A reproducible dose/timing-response relationship across independent families
            with prospectively defined biochemical and clinical outcomes.
          would_support:
          - pathophysiology#Low L-Serine and Downstream Metabolites
      selected_evidence:
        snippet: At birth, the girl's head circumference was normal, and at 48 months' follow-up, her
          psychomotor development has been unremarkable.
        supports: SUPPORT
