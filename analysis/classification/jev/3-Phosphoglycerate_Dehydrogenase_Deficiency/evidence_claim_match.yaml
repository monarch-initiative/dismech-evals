          description: Compare matched PHGDH-deficient and corrected neural progenitor, astrocyte-neuron,
            oligodendrocyte, peripheral-nerve, lens, and fetal developmental models using isotope-resolved
            serine, lipid, nucleotide, glycine, and D-serine flux with L-serine rescue.
          decision_criterion: A tissue-specific deficit is reproduced across variants, corrected by isogenic
            repair, and rescued by pathway-specific supplementation in parallel with disease-relevant
            cellular readouts.
