        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Causative
        features: Biallelic HADH variants cause autosomal recessive hyperinsulinemic hypoglycemia. Reported
          variants include missense, nonsense, frameshift, exon/promoter deletions, and deep intronic
          splice-altering variants. Protein abundance and residual catalytic activity vary by variant;
          a uniform loss of all protein expression should not be assumed. The deep intronic c.636+471G>T
          variant activates a pseudoexon and introduces a premature termination codon.
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        case_fractions:
        - population: Selected patients with diazoxide-responsive hyperinsulinemic hypoglycemia after
            exclusion of common genetic causes
          case_fraction_percent: 9.6
          cohort_size: 115
          notes: The 11/115 reported yield applies to a selected referral cohort with ABCC8, KCNJ11, GCK,
            and HNF4A variants excluded; GLUD1 testing was performed in the seven patients with hyperammonemia.
            Consanguinity was reported in 18 probands, of whom five had reported HADH variants. This is
            not a worldwide prevalence or a fraction of an entirely consanguineous cohort. One reported
            compound heterozygote carried a second variant in an alternative transcript whose pathogenicity
            remained unproven in the paper.
      selected_evidence:
        snippet: Six different HADH mutations were identified in 11/115 (10%) patients tested.
        supports: SUPPORT
