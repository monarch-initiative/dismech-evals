          from a requirement for global SCHAD deficiency.
        notes: The authors establish sufficiency of mutant islets in this transplant setting, not beta-cell-specific
          autonomy or exclusion of all systemic modifiers. The study does not resolve contributions from
          alpha cells or metabolites generated within the transplanted islets.
        modeled_mechanisms:
        - target: Inappropriate Insulin Secretion
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The transplant shows that mutant islets are sufficient to shift glucose regulation
            without a global Hadh deletion in the recipient.
          limitations: Glycemia and circulating insulin are whole-animal readouts. Insulin concentrations
            were not significantly higher at every time point, and the experiment does not distinguish
            beta-cell effects from contributions of other islet cells or local metabolites.
      selected_evidence:
        snippet: We therefore transplanted islets from global SCHAD knockout (SCHADKO) mice into mice
          with streptozotocin-induced diabetes.
        supports: SUPPORT
