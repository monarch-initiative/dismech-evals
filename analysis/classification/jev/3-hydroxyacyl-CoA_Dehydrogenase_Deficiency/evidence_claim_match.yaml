        name: Loss of Tonic SCHAD Inhibition of Glutamate Dehydrogenase
        role: central_effector
        biological_scale: MOLECULAR
        description: Under physiological conditions, the SCHAD protein physically binds to mitochondrial
          glutamate dehydrogenase (GDH/GLUD1) in pancreatic beta cells and exerts tonic allosteric inhibition.
          In HADH deficiency, absence of SCHAD protein eliminates this tonic inhibition, leaving GDH hyperactive
          and hyperresponsive to allosteric activation by amino acids like leucine.
        molecular_functions:
        - preferred_term: glutamate dehydrogenase [NAD(P)+] activity
          term:
            id: GO:0004353
            label: L-glutamate dehydrogenase [NAD(P)+] activity
          modifier: INCREASED
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        cell_types:
        - preferred_term: type B pancreatic cell
          term:
            id: CL:0000169
            label: type B pancreatic cell
      selected_evidence:
        snippet: These studies indicate that SCHAD deficiency causes hyperinsulinism by activation of
          GDH via loss of inhibitory regulation of GDH by SCHAD.
        supports: SUPPORT
