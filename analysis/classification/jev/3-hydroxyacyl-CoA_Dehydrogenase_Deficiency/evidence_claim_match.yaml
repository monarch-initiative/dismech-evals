      assertion_type: Diagnosis
      assertion:
        name: Biochemical Diagnosis of Hyperinsulinism
        description: Assess insulin secretion and action during documented hypoglycemia using a critical
          sample that includes glucose, insulin, beta-hydroxybutyrate and free fatty acids. Suppressed
          ketones and free fatty acids or an inappropriate glucose response to glucagon may support excessive
          insulin action even when insulin is low. These findings establish hyperinsulinism; molecular
          testing determines whether HADH is responsible.
        notes: 'The composite critical-sample assessment is retained without a procedure binding. OAK
          queries `runoak -i ols:ncit search ''biochemical analysis'' ''clinical chemistry'' ''blood glucose''`
          returned Clinical Chemistry (NCIT:C16417), Clinical Chemistry Service Type (NCIT:C212727), Clinical
          Chemistry Finding (NCIT:C70922), Blood Glucose Measurement (NCIT:C92744), Whole Blood Equivalent
          Glucose Measurement (NCIT:C176296), and related glucose concepts. None represents the composite
          assessment: chemistry is a discipline/service/finding and glucose measurement covers one analyte.'
        diagnosis_term:
          preferred_term: Critical-sample biochemical assessment for hyperinsulinism
      selected_evidence:
        snippet: The diagnosis of HI is made on the basis of increased insulin action and/or inadequate
          suppression of plasma insulin during either spontaneous or fasting-induced hypoglycemia.
        supports: SUPPORT
