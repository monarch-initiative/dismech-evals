      assertion_type: AnimalModel
      assertion:
        name: Global Hadh Knockout Mouse
        species: Mouse
        genotype: Global Hadh-/-
        publication: PMID:20670938
        description: Global Hadh deletion produces fasting hypoglycemia and exaggerated insulin responses
          to oral amino acids. Isolated-islet experiments from the same model characterize GDH regulation,
          amino-acid oxidation, energy charge and calcium responses; those assays are distinguished from
          whole-animal measurements.
        notes: Normal basal insulin release and calcium in isolated islets do not negate the fasting phenotype
          in intact mice. No neuroglycopenic brain-injury outcome is claimed for this model. The C4-OH
          and urinary 3-hydroxyglutarate readouts are not assigned a causal role in hypoglycemia.
        modeled_mechanisms:
        - target: Biallelic HADH Loss of Function
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Genetic ablation perturbs HADH function throughout the animal.
          limitations: The knockout is a mouse model; individual human HADH variants may preserve catalytic
            or regulatory functions that a null model removes.
        - target: Loss of SCHAD-GDH Inhibitory Interaction
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Biochemical studies associated with the knockout model support a SCHAD-GDH protein
            interaction and its inhibitory regulatory role.
          limitations: The cited pull-down experiments used extracts or isolated proteins; they do not
            directly visualize the interaction in a living human beta cell.
        - target: Increased Islet GDH Activity
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Islet homogenates from knockout mice show altered GDH substrate affinity under
            the assay conditions.
          limitations: Affinity was measured using alpha-ketoglutarate in the reductive-amination direction;
            the opposite oxidative-deamination direction could not be measured in these islet assays.
        - target: Increased Islet Glutamine Oxidation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Isolated knockout islets show increased glutamine oxidation.
          limitations: This is an ex vivo metabolic measurement. Glutamine alone did not stimulate insulin
            secretion; co-stimulation with other amino acids changes the response.
        - target: Increased Islet ATP/ADP Ratio
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Amino-acid stimulation raises the ATP/ADP ratio in isolated knockout islets.
          limitations: The relevant response depends on stimulus composition. A basal trend toward increased
            ATP/ADP was insufficient to stimulate insulin release.
        - target: Exaggerated Amino-Acid-Induced Calcium Response
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Calcium imaging of isolated knockout islets shows abnormal amino-acid responses
            with normal basal calcium.
          limitations: The assay is performed in isolated islets and does not establish every intervening
            channel step in vivo.
        - target: Inappropriate Insulin Secretion
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The intact knockout responds to amino acids with excessive insulin relative to
            glucose. Separate isolated-islet tests limit an explanation based on a specific effect of
            accumulated fatty-acid intermediates.
          limitations: The knockout is a mouse model; individual human HADH variants may preserve catalytic
            or regulatory functions that a null model removes. The negative fatty-acid result comes from
            isolated-islet experiments and does not exclude every possible metabolic modifier.
        - target: Accumulation of 3-Hydroxybutyrylcarnitine
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The global knockout reproduces increased plasma 3-hydroxybutyrylcarnitine.
          limitations: This is a whole-animal biochemical readout. Metabolite abnormalities are variable
            in human disease, and their measurement does not establish that they drive insulin secretion.
        - target: Accumulation of 3-Hydroxyglutarate
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The global knockout reproduces increased urinary 3-hydroxyglutarate.
          limitations: This is a whole-animal biochemical readout. Metabolite abnormalities are variable
            in human disease, and their measurement does not establish that they drive insulin secretion.
      selected_evidence:
        snippet: Following oral amino acid stimulation, there were significant decreases in glucose and
          increases in plasma insulin in the hadh−/− mice, whereas there were no significant changes in
          glucose or insulin levels in control mice.
        supports: SUPPORT
