        context: []
      assertion_type: Treatment
      assertion:
        name: Dietary Protein Moderation
        description: Because loss of SCHAD unleashes GDH allosteric activation, amino acid consumption
          (particularly protein/leucine-rich meals) triggers hyperactivation of glutamate dehydrogenase
          and causes postprandial hypoglycemic episodes. Moderating dietary protein intake prevents protein-induced
          hyperinsulinism.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Dietary Intervention
          term:
            id: NCIT:C15447
            label: Dietary Intervention
      selected_evidence:
        snippet: The index case presented at 4 months of age with hypoglycemic seizures. Her HH responded
          to diazoxide, but she continued to have episodes of hypoglycemia even on diazoxide, especially
          when consuming high-protein foods.
        supports: SUPPORT
