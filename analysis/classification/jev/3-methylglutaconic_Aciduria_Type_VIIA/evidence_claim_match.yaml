            term:
              id: MONDO:0859237
              label: 3-methylglutaconic aciduria, type VIIA
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Inhibition of CLPB Disaggregase
        description: Mutant CLPB subunits carrying the dominant variants assemble with wild-type subunits
          into the hexameric and dodecameric disaggregase and poison it, abolishing most disaggregase
          activity and to a lesser degree ATPase activity. Subunits carrying the recessive (MGCA7) variants
          do not do this, which is why one recessive allele is harmless while one dominant allele causes
          disease.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CLPB
