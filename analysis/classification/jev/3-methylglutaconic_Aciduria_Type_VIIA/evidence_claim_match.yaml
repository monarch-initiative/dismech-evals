            label: HAX1
      selected_evidence:
        snippet: In control fibroblasts, HAX1 migrated predominantly as monomer while in patient samples
          multiple HAX1 peaks were observed at higher molecular masses comigrating with CLPB thus suggesting
          a longer-lasting interaction between CLPB and HAX1.
        supports: SUPPORT
