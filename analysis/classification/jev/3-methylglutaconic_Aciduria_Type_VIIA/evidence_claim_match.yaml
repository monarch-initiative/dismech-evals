            term:
              id: MONDO:0859237
              label: 3-methylglutaconic aciduria, type VIIA
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mgca7a_vs_scn9_boundary
        prompt: Are 3-methylglutaconic aciduria type VIIA (dominant CLPB deficiency with neurological
          involvement) and severe congenital neutropenia type 9 (isolated neutropenia from heterozygous
          CLPB variants) two disorders or one disorder with variable expression?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - disease#
        - pathophysiology#Dominant-Negative Inhibition of CLPB Disaggregase
        rationale: Both are caused by heterozygous CLPB missense variants that inhibit wild-type CLPB
          dominant-negatively, and the arginine finger R561 is mutated in both. The distinction rests
          partly on 3-methylglutaconic aciduria, which was not measured in about half of the published
          neutropenia cases. A variant-level comparison of residual disaggregase activity against neurological
          outcome would test whether the two are a continuum.
      selected_evidence:
        snippet: It remains to be established whether the distinction between dominant CLPB deficiency
          (MGA 7A) and CLPB-SCN is scientifically valid or if these entities represent, in fact, one disorder.
        supports: SUPPORT
