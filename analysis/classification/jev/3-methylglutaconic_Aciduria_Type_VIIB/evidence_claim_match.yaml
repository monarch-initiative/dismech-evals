        prompt: Why does loss of a ubiquitously expressed mitochondrial disaggregase produce neutropenia
          across the severity range but neurological disease of widely varying severity, and which CLPB
          substrates are limiting in granulocytic precursors versus neurons?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#HAX1 Insolubility
        - pathophysiology#Progressive Encephalopathy with Brain Atrophy
        - phenotypes#Congenital neutropenia
        rationale: The neutropenia has a candidate mechanism through HAX1 and the CLPB/HAX1/PRKD2/HSP27
          axis, but no comparable substrate has been linked to neuronal loss, and the neurological severity
          tracks residual disaggregase activity without a known cell-specific explanation. Candidate links
          such as secondary complex I instability and impaired mitochondrial calcium uptake are shown
          only in cultured cells.
      selected_evidence:
        snippet: Importantly, Skd3 variants linked to 3-methylglutaconic aciduria, a severe mitochondrial
          disorder, display diminished disaggregase activity (but not always reduced ATPase activity),
          which predicts disease severity.
        supports: SUPPORT
