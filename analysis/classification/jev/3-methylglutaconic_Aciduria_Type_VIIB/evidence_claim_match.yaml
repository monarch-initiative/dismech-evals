        hypothesis_label: CLPB-HAX1 Mitochondrial Proteostasis Model of Neutropenia
        status: EMERGING
        description: Loss of CLPB disaggregase activity leaves HAX1 and other intermembrane space proteins
          insoluble, disrupting a CLPB/HAX1/PRKD2/HSP27 axis needed for granulocytic differentiation,
          so that myeloid precursors undergo apoptosis at the onset of differentiation. The model is supported
          in cultured human and mouse myeloid cells and by the shared neutropenia of HAX1 deficiency;
          it has not been tested in patient marrow.
      selected_evidence:
        snippet: We found that CLPB-deficient 32Dcl3 cells showed a decreased mitochondrial membrane potential
          and increased levels of insoluble HAX1 aggregates in mitochondria, as compared to control cells.
        supports: SUPPORT
