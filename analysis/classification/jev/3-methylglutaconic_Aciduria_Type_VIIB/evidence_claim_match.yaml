        description: A general scenario for secondary 3-methylglutaconic acidurias in which constitutive
          mitochondrial dysfunction activates AMPK, diverting cytoplasmic acetyl-CoA to peroxisomes where
          HMG-CoA is converted to 3-methylglutaconate. The authors consider additional contributors for
          CLPB deficiency. Theoretical synthesis; not tested in CLPB cells.
      selected_evidence:
        snippet: constitutive mitochondrial dysfunction induces AMPK activation which, by inhibiting early
