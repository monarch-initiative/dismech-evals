        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Secondary 3-Methylglutaconic Acid Accumulation
        - mechanistic_hypotheses#aggregate_membrane_perturbation_3mga
        - mechanistic_hypotheses#ampk_peroxisomal_3mga
        - mechanistic_hypotheses#acetyl_coa_tca_3mga
        rationale: Three proposals exist, membrane perturbation by protein aggregates, an AMPK-driven
          peroxisomal HMG-CoA route, and the class-wide mitochondrial acetyl-CoA build-up model, and none
          has been tested in CLPB-deficient cells or patients. 3-methylglutaconic aciduria was also not
          observed in one series of patients with the dominant-negative form, a contrast that may help
          discriminate between them.
      selected_evidence:
        snippet: its genesis in non-canonical (secondary) 3-MGAs, a growing-up group of disorders encompassing
          more than a dozen of inherited metabolic diseases, is a mystery still remaining unresolved for
          three decades
        supports: SUPPORT
