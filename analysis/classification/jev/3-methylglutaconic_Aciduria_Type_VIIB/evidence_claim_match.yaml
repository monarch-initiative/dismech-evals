        prompt: How does loss of CLPB disaggregase activity raise urinary 3-methylglutaconic acid?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Secondary 3-Methylglutaconic Acid Accumulation
