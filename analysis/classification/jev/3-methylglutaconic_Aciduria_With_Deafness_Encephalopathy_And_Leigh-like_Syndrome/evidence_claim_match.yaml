  77f7f89ac190ed8bf48275554cd1df579cdc11fac49132aecd93c37214b14dd0:
    claim:
      about:
        disease:
          name: 3-methylglutaconic_Aciduria_With_Deafness_Encephalopathy_And_Leigh-like_Syndrome
          disease_term:
            preferred_term: 3-methylglutaconic aciduria with deafness, encephalopathy, and Leigh-like
              syndrome
            term:
              id: MONDO:0013875
              label: 3-methylglutaconic aciduria with deafness, encephalopathy, and Leigh-like syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: canine_model_organ_coverage
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the canine SERAC1 disorder model the non-neurological features of MEGDEL, or only
          the movement disorder?
        attaches_to:
        - pathophysiology#Cochlear and Auditory Pathway Degeneration
        - pathophysiology#Hepatocellular Mitochondrial Injury
        rationale: Canine multiple system degeneration is caused by SERAC1 loss and shares striatal neurodegeneration
          with the human disease, but the published description covers only the movement disorder and
          its neuropathology. Deafness, hepatopathy and 3-methylglutaconic aciduria - three of the four
          letters of the human acronym - are not reported in the dogs, and the canine lesion additionally
          involves the cerebellum and substantia nigra, which the human disease does not. So it is not
          known whether the dog fails to develop those features or whether nobody has looked, and the
          model cannot currently be used to study the auditory or hepatic mechanism.
        proposed_experiments:
        - experiment_id: canine_audiology_and_organic_acids
          name: Auditory, hepatic and organic-acid phenotyping of SERAC1 dogs
          description: Perform brainstem auditory evoked response testing, liver function and histology,
            and urine organic acid analysis on genotyped affected, carrier and wild-type Kerry Blue Terriers
            and Chinese Crested dogs.
          readouts:
          - name: Brainstem auditory evoked response threshold
            target: pathophysiology#Cochlear and Auditory Pathway Degeneration
            direction: INCREASED
            interpretation: A raised threshold in affected dogs would show the canine model does reach
              the auditory system.
          - name: Urinary 3-methylglutaconic acid
            target: pathophysiology#Hepatocellular Mitochondrial Injury
            direction: INCREASED
            interpretation: Organic aciduria in affected dogs would show the biochemical phenotype is
              conserved.
          would_support:
          - pathophysiology#Cochlear and Auditory Pathway Degeneration
          supporting_outcome:
          - Affected dogs show raised auditory brainstem response thresholds and increased urinary 3-methylglutaconic
            acid relative to genotyped littermate controls.
          would_refute:
          - pathophysiology#Cochlear and Auditory Pathway Degeneration
          refuting_outcome:
          - Affected dogs have normal hearing thresholds, normal liver histology and normal organic acids
            despite advanced striatal degeneration, showing the canine phenotype is restricted to the
            nervous system.
      selected_evidence:
        snippet: The associated pathologic lesions include degeneration of the cerebellum, caudate nucleus,
          and substantia nigra
        supports: SUPPORT
