          value:
            name: SERAC1
            gene_term:
              preferred_term: SERAC1
              term:
                id: hgnc:21061
                label: SERAC1
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            notes: SERAC1 (serine active site containing 1, 6q25.3) is the only gene associated with MEGDEL
              syndrome. It encodes a phosphatidylglycerol remodeling enzyme; reported disease alleles
              include nonsense, frameshift, canonical splice and multi-exon deletion variants, all of
              which reduce or abolish protein expression, plus hypomorphic missense alleles associated
              with the milder phenotypes. p.Phe471 (rs112780453) is reported as a benign variant and should
              not be treated as a disease allele.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: c.442C>T (p.Arg148*)
        description: Nonsense allele found in trans with c.438delC in a patient with MEGDEL syndrome,
          optic atrophy and myoclonic epilepsy.
        functional_effects:
        - function: SERAC1 phosphatidylglycerol remodeling activity
          description: Loss of function; the allele reduces or abolishes SERAC1 protein.
      selected_evidence:
        snippet: 'Whole exome sequencing revealed two loss-of-function mutations in SERAC1 in trans: c.438delC
          (p.T147Rfs*22) and c.442C>T (p.R148X)'
        supports: SUPPORT
