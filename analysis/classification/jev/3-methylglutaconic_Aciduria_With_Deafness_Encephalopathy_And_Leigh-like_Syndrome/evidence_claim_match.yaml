              label: 3-methylglutaconic aciduria with deafness, encephalopathy, and Leigh-like syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: serac1_localization_conflict
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Where in the cell does SERAC1 act - at the mitochondria-associated ER membrane, or on
          the outer mitochondrial membrane?
        attaches_to:
        - pathophysiology#Absent or Mislocalized SERAC1 Protein
        - mechanistic_hypotheses#serine_transport_mtdna
        rationale: The gene-discovery study localized SERAC1 to the mitochondria-associated membrane fraction
          at the ER-mitochondria interface and assigned it a phospholipid remodeling role there. A later
          study using a knockout mouse placed it on the outer mitochondrial membrane as a partner of the
          serine transporter SFXN1, with a one-carbon-cycle and mtDNA-maintenance role. The two localizations
          imply different primary defects and different candidate treatments, and no study has tested
          them against each other. Until they are reconciled, this entry curates the phospholipid route
          as the main chain and the serine-transport route as an explicit hypothesis group.
      selected_evidence:
        snippet: We found that SERAC1 localizes to the outer mitochondrial membrane and is a protein component
          of the one-carbon cycle
        supports: SUPPORT
    origin:
