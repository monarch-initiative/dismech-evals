      assertion:
        name: SERAC1
        gene_term:
          preferred_term: SERAC1
          term:
            id: hgnc:21061
            label: SERAC1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: c.442C>T (p.Arg148*)
          description: Nonsense allele found in trans with c.438delC in a patient with MEGDEL syndrome,
            optic atrophy and myoclonic epilepsy.
          functional_effects:
          - function: SERAC1 phosphatidylglycerol remodeling activity
            description: Loss of function; the allele reduces or abolishes SERAC1 protein.
        - name: c.1018delT
          description: Homozygous frameshift allele generating premature translation termination, reported
            in a Palestinian child.
          functional_effects:
          - function: SERAC1 phosphatidylglycerol remodeling activity
            description: Loss of function; the allele reduces or abolishes SERAC1 protein.
        - name: c.1495A>G (p.Met499Val)
          description: Hypomorphic missense allele found in compound heterozygosity in a Chinese patient
            whose phenotype was complicated hereditary spastic paraplegia rather than classic MEGDEL.
          functional_effects:
          - function: SERAC1 phosphatidylglycerol remodeling activity
            description: Hypomorphic; residual activity is associated with the milder phenotype.
        - name: c.1379G>A (p.Trp460*)
          description: Homozygous nonsense allele in a consanguineous Tunisian family with the severe
            phenotype.
          functional_effects:
          - function: SERAC1 phosphatidylglycerol remodeling activity
            description: Loss of function; premature termination in the studied family.
        - name: rs797045105 insertion
          description: Homozygous frameshift insertion identified by exome sequencing in an Iranian proband,
            heterozygous in both unaffected parents.
          functional_effects:
          - function: SERAC1 phosphatidylglycerol remodeling activity
            description: Loss of function; the insertion causes a frameshift.
        - name: c.1404-2A>G
          description: Homozygous canonical splice-acceptor allele in an Egyptian proband with relatively
            delayed onset and neither hepatopathy nor deafness.
          functional_effects:
          - function: SERAC1 phosphatidylglycerol remodeling activity
            description: Predicted loss of function through disrupted splicing.
        - name: Homozygous splice variant causing juvenile complicated HSP
          description: The hypomorphic splice allele underlying the juvenile complicated-hereditary-spastic-paraplegia
            presentation in a large consanguineous family. It abolishes full-length protein yet leaves
            a milder lipid phenotype than the classic infantile alleles, which is the clearest genotype-phenotype
            evidence in this disease.
          functional_effects:
          - function: SERAC1 phosphatidylglycerol remodeling activity
            description: Loss of the full-length protein with a milder phosphatidylglycerol remodeling
              defect than classic infantile alleles.
        - name: Deletion of exons 2-4
          description: Multi-exon deletion allele, in trans with c.1601A>T (p.His534Leu), in a child whose
            development improved beyond clinical expectation.
          functional_effects:
          - function: SERAC1 phosphatidylglycerol remodeling activity
            description: Loss of function; the allele reduces or abolishes SERAC1 protein.
        notes: SERAC1 (serine active site containing 1, 6q25.3) is the only gene associated with MEGDEL
          syndrome. It encodes a phosphatidylglycerol remodeling enzyme; reported disease alleles include
          nonsense, frameshift, canonical splice and multi-exon deletion variants, all of which reduce
          or abolish protein expression, plus hypomorphic missense alleles associated with the milder
          phenotypes. p.Phe471 (rs112780453) is reported as a benign variant and should not be treated
