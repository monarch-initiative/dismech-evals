      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: serine_transport_mtdna
        hypothesis_label: SERAC1 as an outer-membrane partner of the serine transporter SFXN1
        status: EMERGING
        description: An alternative model in which SERAC1 acts not as a phospholipid remodeling enzyme
          at the ER-mitochondria contact site but on the outer mitochondrial membrane, as a required partner
          of the mitochondrial serine transporter SFXN1. On this model the primary defect is a failure
          of serine import that starves the one-carbon cycle, unbalances the nucleotide pool and depletes
          mitochondrial DNA, making MEGD(H)EL a mtDNA depletion syndrome. The two models differ in the
          subcellular location they assign to SERAC1 and have not been reconciled; the therapeutic implication
          of the second, that nucleoside supplementation might help, does not follow from the first.
      selected_evidence:
        snippet: We localized SERAC1 at the interface between the mitochondria and the endoplasmic reticulum
          in the mitochondria-associated membrane fraction that is essential for phospholipid exchange
        supports: REFUTE
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
