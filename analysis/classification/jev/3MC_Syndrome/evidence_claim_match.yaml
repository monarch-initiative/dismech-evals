            description: Healthy-donor KOLF2 iPSCs and paired CRISPR-edited COLEC11-deficient clones were
              differentiated through myeloid precursors to osteoclasts with M-CSF and RANKL. Recombinant
              human CL-11 with calcium tested rescue; Mirococept tested pharmacologic complement-convertase
              inhibition.
            organism:
