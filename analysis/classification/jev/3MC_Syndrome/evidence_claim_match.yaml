              term:
                id: hgnc:17213
                label: COLEC11
            molecular_functions:
            - preferred_term: calcium ion binding
              term:
                id: GO:0005509
                label: calcium ion binding
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Reduced Extracellular CL-K1 Availability
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Failure of calcium binding is proposed to compromise CL-K1 during biosynthesis and
          prevent secretion. Cellular quality-control recognition and degradation are plausible intermediates
          that were not directly demonstrated.
      selected_evidence:
        snippet: We propose that failure to bind Ca(2+) during biosynthesis leads to structural defects
          that prevent secretion of CL-K1, thus providing a molecular explanation of the genetic disorder.
        supports: SUPPORT
        directness: INDIRECT
