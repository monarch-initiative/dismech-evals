  c17b7409ca255bd4b4347017e494bfd74bd2af248b57968c24f82841899345ee:
    claim:
      about:
        disease:
          name: 3MC Syndrome
          disease_term:
            preferred_term: 3MC syndrome
            term:
              id: MONDO:0017398
              label: 3MC syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Complement-Dependent Osteoclastogenesis
        biological_scale: CELLULAR
        description: Experimental loss of collectin-11 impairs osteoclast differentiation in mouse bone-marrow
          cultures and engineered healthy-donor human iPSC-derived cells. The effect is modest after isolated
          mouse Colec11 deletion and pronounced in Colec11/C3 or Colec11/Cfb double-knockout cultures;
          isolated human COLEC11 deletion already has a marked effect. Recombinant CL-11 partially rescues
          differentiation, and complement-convertase inhibition impairs differentiation in human cells.
          These results identify a candidate mechanism relevant to 3MC, without establishing osteoclast
          dysfunction as the cause of skeletal malformations in affected patients.
        cell_types:
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        biological_processes:
        - preferred_term: osteoclast differentiation
          term:
            id: GO:0030316
            label: osteoclast differentiation
          modifier: DECREASED
        notes: Terminal-complement deposition accompanies the cellular phenotype, but colocalization does
          not by itself demonstrate mediation. Recombinant CL-11 partly restores MAC deposition even in
          C3-deficient cultures; the authors propose a C3-bypass route rather than establish obligatory
          C3 dependence or direct C5 cleavage. PMX53 inhibition of C5aR1 had no significant effect under
          the tested non-inflammatory culture conditions. Postnatal vertebral pathology in combined-knockout
          mice is associated with the cellular findings; it does not isolate impaired osteoclast differentiation
          as the mediator of bone loss, and it is not equivalent to the developmental craniofacial abnormalities
          of human 3MC.
      selected_evidence:
        snippet: In addition, treatment with Mirococept—a truncated complement receptor-1–based inhibitor
          of C3 and C5 convertases (23)—significantly reduced OCL formation, demonstrating that normal
          human OCL differentiation is complement-dependent.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/3
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41774788
      reference_title: Collectin-11 regulates osteoclastogenesis and bone maintenance via a complement-dependent
        mechanism.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: Pharmacologic C3/C5 convertase inhibition supports complement involvement; it is not
        a C3 gene-deletion experiment or proof that a specific linear complement sequence is necessary.
