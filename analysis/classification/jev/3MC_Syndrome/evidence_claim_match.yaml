      assertion_type: Genetic
      assertion:
        name: MASP1
        gene_term:
          preferred_term: MASP1
          term:
            id: hgnc:6901
            label: MASP1
        relationship_type: CAUSATIVE
        notes: Biallelic MASP1 variants cause 3MC syndrome 1. Exon-12 missense changes and deletions implicate
          the MASP-3-specific protease domain, while early truncating alleles such as p.Trp290Ter affect
          shared sequence. MASP-3 loss is central, but other isoforms may also be affected by some alleles.
        variants:
        - name: Biallelic MASP1 loss-of-function alleles
          description: Reported alleles include p.Gly687Arg and other missense changes in the MASP-3 protease
            domain, earlier nonsense variants such as p.Trp290Ter, and intragenic deletions partially
            affecting exon 12.
      selected_evidence:
        snippet: In MASP1, either truncating mutations or missense variants in exon 12 encoding the C-terminal
          serine protease domain specific for isoform MASP-3 are causative.
        supports: SUPPORT
