          carried the likely founder COLEC10 c.311G>T (p.Gly104Val) allele.'
      selected_evidence:
        snippet: We identified nine individuals from five families of Ashkenazi Jewish descent with homozygosity
          of the c.311G > T (p.Gly104Val) variant in COLEC10 and phenotype consistent with 3MC syndrome.
          Carrier frequency was calculated among 52,278 individuals of Jewish descent. Testing revealed
          400 carriers out of 39,750 individuals of Ashkenazi Jewish descent, giving a carrier frequency
          of 1 in 99 or 1.01%. ... The c.311G > T (p.Gly104Val) variant likely represents a founder variant,
          and homozygosity is associated with features of 3MC syndrome.
        supports: SUPPORT
