          variants can affect sequence shared with other MASP1 products. Pro-factor D maturation is additionally
          impaired.
        subtype_term:
          preferred_term: 3MC syndrome 1
          term:
            id: MONDO:0009770
            label: 3MC syndrome 1
        genes:
        - preferred_term: MASP1
          term:
