            description: The homozygous COLEC10 c.807_810delCTGT (p.Cys270Serfs*33) variant extends the
              protein and removes a conserved cysteine. Plasma CL-L1 levels were normal in the reported
              family, while mutant protein induced less HeLa-cell migration than wild type. Loss of extracellular
              function can therefore occur without reduced measured abundance.
            genes:
            - preferred_term: COLEC10
              term:
                id: hgnc:2220
                label: COLEC10
            genetic_context:
              variant_origin: GERMLINE
              functional_impact_category: LOSS_OF_FUNCTION
              description: Homozygous germline c.807_810delCTGT (p.Cys270Serfs*33), with reduced function
                in a cell-migration assay.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired Neural Crest Cell Guidance
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Reduced CL-L1 chemoattraction provides a candidate explanation for the developmental
          phenotype of the Cys270Serfs*33 patient. Transfer from the HeLa assay to neural crest migration
          remains inferential.
      selected_evidence:
        snippet: However, the variant affects the chemo-attractive feature of CL-L1, as HeLa cells migrate
          significantly less in response to the mutant protein compared to the wild-type one.
        supports: SUPPORT
