      assertion:
        target: Impaired Complement-Dependent Osteoclastogenesis
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Isolated COLEC11 deletion markedly reduces osteoclast differentiation in this human
          cellular system, and recombinant CL-11 partly restores it. Mirococept separately inhibits C3/C5
          convertases and reduces osteoclast formation.
        limitations: Engineered healthy-donor cells are not 3MC patient-derived cells. Mirococept treatment
          is distinct from genetic deletion of C3 or another complement component; these interventions
          do not prove an obligatory linear C3-to-MAC route. Three independent differentiation experiments
          were reported, without a patient clinical or in-vivo bone endpoint.
        readouts:
        - name: TRAP-positive multinucleated osteoclast area after COLEC11 deletion
          target: Impaired Complement-Dependent Osteoclastogenesis
          direction: DECREASED
          interpretation: Deletion reduces differentiation relative to parental wild-type cells.
        - name: Osteoclast formation after recombinant CL-11 supplementation
          target: Impaired Complement-Dependent Osteoclastogenesis
          direction: RESTORED
          interpretation: The cellular deficit is partially rescued; full normalization or clinical benefit
            is not established.
        - name: Osteoclast formation during Mirococept treatment
          target: Impaired Complement-Dependent Osteoclastogenesis
          direction: DECREASED
          interpretation: Complement-convertase inhibition supports a role for complement in normal differentiation
            independently of the engineered COLEC11 deletion.
      selected_evidence:
        snippet: CL-11 deletion resulted in marked impairment of OCL differentiation, which was partially
          rescued by supplementation of the differentiation medium with recombinant CL-11.
        supports: SUPPORT
