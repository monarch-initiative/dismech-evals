        description: Some biallelic COLEC10 variants impair CL-L1 expression or secretion. Arg9Ter and
          Gly77Glufs*66 constructs yield no detectable protein, whereas Cys176Trp accumulates intracellularly
          with severely reduced secretion. This route is distinct from the Cys270Serfs*33 allele, which
          has normal measured plasma levels but impaired chemoattractant activity.
        genes:
        - preferred_term: COLEC10
          term:
            id: hgnc:2220
            label: COLEC10
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic COLEC10 variants affecting protein expression or secretion; compound
            heterozygous genotypes occur.
      selected_evidence:
        snippet: We demonstrate how mutations in COLEC10 (c.25C>T; p.Arg9Ter, c.226delA; p.Gly77Glufs*66
          and c.528C>G p.Cys176Trp) impair the expression and/or secretion of CL-L1 highlighting their
          pathogenicity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
