      assertion_type: Diagnosis
      assertion:
        name: Molecular diagnosis by sequencing of MASP1, COLEC11 and COLEC10
        description: 'Known-gene molecular confirmation identifies biallelic pathogenic variants in MASP1,
          COLEC11 or COLEC10, interpreted with the clinical phenotype. Confirm gene coverage and deletion
          detection when choosing or interpreting a sequencing assay: a 2021 case used a clinical exome
          panel that omitted COLEC10, and a MASP1 intragenic deletion in another case required careful
          visual review of exome data. These are documented historical assay limitations, not statements
          that all current panels have the same gaps. The likely Ashkenazi Jewish COLEC10 founder allele
          is relevant to variant interpretation, but a negative result for one allele does not exclude
          3MC.'
      selected_evidence:
        snippet: 3MC syndrome should be in the differential diagnosis for individuals with short stature,
          radioulnar synostosis, cleft lip and cleft palate.
        supports: SUPPORT
