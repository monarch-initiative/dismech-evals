      assertion:
        name: Impaired Pro-Factor D Maturation
        biological_scale: MOLECULAR
        description: MASP-3 deficiency compromises conversion of pro-factor D to mature factor D. Tested
          patient samples predominantly contain pro-factor D but retain detectable mature factor D, consistent
          with an additional maturation route. Resting-plasma inhibition experiments establish MASP-3
          dependence under those assay conditions; serum coagulation and patient measurements need separate
          interpretation.
        biological_processes:
        - preferred_term: protein maturation
          term:
            id: GO:0051604
            label: protein maturation
          modifier: DECREASED
        notes: This is a biochemical consequence. No direct edge to the congenital craniofacial phenotype
          or to a clinical immunodeficiency is established by these experiments.
      selected_evidence:
        snippet: although 3MC patients predominantly contain pro-FD, they also contain detectable levels
          of mature FD
        supports: SUPPORT
