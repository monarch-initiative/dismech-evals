          shared sequence. MASP-3 loss is central, but other isoforms may also be affected by some alleles.
        variants:
        - name: Biallelic MASP1 loss-of-function alleles
          description: Reported alleles include p.Gly687Arg and other missense changes in the MASP-3 protease
            domain, earlier nonsense variants such as p.Trp290Ter, and intragenic deletions partially
            affecting exon 12.
      selected_evidence:
        snippet: By trio exome sequencing we now identified a novel, homozygous 2kb deletion, partially
          affecting exon 12 in an adult female with the typical facial gestalt of 3MC syndrome and hearing
          loss, but without the main feature cleft lip/palate, and without intellectual disability, or
          short stature.
        supports: SUPPORT
