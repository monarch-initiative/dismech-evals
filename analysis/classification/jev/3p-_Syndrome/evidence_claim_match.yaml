      assertion_type: DifferentialDiagnosis
      assertion:
        name: BRPF1-related intellectual disability
        description: The other single-gene disorder inside the 3p25.3 interval. Historically most of the
          3p25 deletion phenotype was attributed to SETD5 before BRPF1 was characterised, and ptosis and
          blepharophimosis in particular track with BRPF1 loss. A contiguous deletion can remove both,
          so the question at the bedside is whether a microarray shows a deletion or sequencing shows
          an intragenic BRPF1 variant.
      selected_evidence:
        snippet: We conclude that both genes contribute to the phenotypic severity of 3p25 deletion syndrome
          but that some specific features, such as ptosis and blepharophimosis, are mostly driven by BRPF1
          haploinsufficiency.
        supports: SUPPORT
        directness: DIRECT
