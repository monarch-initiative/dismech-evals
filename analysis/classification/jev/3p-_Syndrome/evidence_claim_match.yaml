        description: A single-gene model with developmental abnormalities, altered vocalization and behavioral
          inflexibility. Ex vivo hippocampal slices showed enhanced long-term potentiation. Separate engineered
          embryonic stem-cell and neural-progenitor cultures were used for protein-complex and chromatin
          assays.
        modeled_mechanisms:
        - target: Reduced SETD5 Dosage
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Heterozygous germline disruption models reduced dosage of one contributing gene.
          limitations: This single-gene mouse model does not reproduce a human multigene deletion. Behavioral
            inflexibility and impaired adaptation coexist with enhanced memory retention and ex vivo hippocampal
            potentiation; gross brain architecture and neural-progenitor proliferation were not impaired
            in this study.
        notes: The transcription mechanism also draws on separately engineered heterozygous and homozygous
          cell cultures. Neither a cell-culture assay nor a behavioral test directly measures human intellectual
          disability.
      selected_evidence:
        snippet: Here we show that Setd5-haploinsufficient mice present developmental defects such as
          abnormal brain-to-body weight ratios and neural crest defect-associated phenotypes. Furthermore,
          Setd5-mutant mice show impairments in cognitive tasks, enhanced long-term potentiation, delayed
          ontogenetic profile of ultrasonic vocalization, and behavioral inflexibility.
        supports: SUPPORT
        directness: DIRECT
