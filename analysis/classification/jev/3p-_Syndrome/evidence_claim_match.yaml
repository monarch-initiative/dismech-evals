      assertion:
        name: Unbalanced translocation producing 3p monosomy
        description: A 3p deletion can arise as one half of an unbalanced translocation carried by a parent,
          with a reciprocal gain elsewhere in the genome. The deletion phenotype is then overlaid on whatever
          the duplicated segment contributes, so features outside the 3p- picture should prompt a look
          at the other chromosome, and parental karyotyping changes the recurrence risk.
      selected_evidence:
        snippet: A chromosomal imbalance with a partial trisomy 13q31.1q34 and monosomy 3p26.3 of paternal
          origin were detected.
        supports: SUPPORT
        directness: DIRECT
