        description: BRPF1-containing deletions and heterozygous intragenic loss-of-function variants
          support a contribution to intellectual disability and eyelid abnormalities. In a small genotype–phenotype
          comparison, five individuals with both BRPF1 and SETD5 deleted had more severe walking and speech
          delay than individuals with only one gene affected. The study used one index person per family
          and heterogeneous clinical assessments; it does not establish a universal severity rule.
        role: mechanism
        biological_scale: MOLECULAR
        genes:
        - preferred_term: BRPF1
          term:
            id: hgnc:14255
            label: BRPF1
      selected_evidence:
        snippet: We conclude that both genes contribute to the phenotypic severity of 3p25 deletion syndrome
          but that some specific features, such as ptosis and blepharophimosis, are mostly driven by BRPF1
          haploinsufficiency.
        supports: SUPPORT
        directness: DIRECT
