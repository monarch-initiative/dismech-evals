          progenitors. Setd5 deficiency redistributes RNA polymerase II and alters developmental gene
          expression. The 2018 study found both increases and decreases in transcriptional measures, without
          reduced Hdac3 enzymatic activity or a major loss of its chromatin recruitment. Selected patient
          truncations impaired complex interactions in engineered cells. These experiments support altered
          transcriptional regulation; they do not establish uniform chromatin repression or an intrinsic
          SETD5 methyltransferase mechanism in human neurons.
