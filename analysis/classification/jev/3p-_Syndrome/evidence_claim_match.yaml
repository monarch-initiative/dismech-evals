              id: MONDO:0013424
              label: 3p- syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: del3p_gene_content_and_variable_expression
        kind: KNOWLEDGE_GAP
        prompt: How do gene content and genetic background jointly determine the variable phenotype of
          distal 3p deletions?
        rationale: Human sequence-variant and deletion comparisons support SETD5 and BRPF1 contributions.
          Small comparative cohorts suggest more severe developmental delay when both are lost, but assessments
          are heterogeneous. SRGAP3 and the distal adhesion genes remain additional candidates. Different
          outcomes among relatives with the same 7.4 Mb deletion show that deletion size alone is insufficient.
          The CHL1 family’s additional 1q44 duplication further limits single-gene attribution.
        attaches_to:
        - genetic#SETD5
        - genetic#BRPF1
        - genetic#SRGAP3
        - genetic#CHL1
      selected_evidence:
        snippet: All individuals from group 3 acquired walking after 3 years of age (5/5 for group 3 versus
          2/19 for groups 1 and 2, p value = 0.0005) and presently have no language (5/5 for group 3 versus
          1/19 for groups 1 and 2, p value = 0.0001) (Table 3), suggesting that disruption of both BRPF1
          and SETD5 contributes to the phenotype of 3p25 deletion syndrome.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27939639
      evidence_source: HUMAN_CLINICAL
      explanation: The comparison is five co-deleted individuals versus single-gene groups; it is not
        a population frequency estimate.
      reference_title: Mutations in Histone Acetylase Modifier BRPF1 Cause an Autosomal-Dominant Form
        of Intellectual Disability with Associated Ptosis.
