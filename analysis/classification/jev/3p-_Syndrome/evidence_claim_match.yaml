        kind: HUMAN_MODEL_MISMATCH
        prompt: Which IgCAM model findings explain human deletion phenotypes, and which depend on genotype,
          neural region or behavioral assay?
        rationale: The review’s abstract broadly describes weak mouse phenotypes, but its full text reports
          structural and behavioral abnormalities. Compound Chl1/Cntn6 heterozygotes already show enhanced
          dendritic misorientation. Cntn4 deficiency lacked ASD-related behavioral effects in one assay
          battery while enhancing Barnes-maze performance and acoustic startle. Compensation is a proposed
          explanation, not a demonstrated universal rescue. These results neither refute all neurite effects
          nor prove a human ASD mechanism.
        attaches_to:
        - pathophysiology#Abnormal Neurite Development
      selected_evidence:
        snippet: This study also included assessments for ASD-related behaviors such as the juvenile social
          interaction test, three-chamber social interaction test, novel object investigation task and
          the Barnes maze; however, Cntn4-deficiency was not observed to affect ASD-related behaviors
          (Molenhuis et al., 2016).
        supports: SUPPORT
        directness: DIRECT
