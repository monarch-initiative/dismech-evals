      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Cardiac Development
        description: Deletion mapping suggests a cardiac susceptibility interval in 3p25.3. The reported
          approximately 200 kb refinement explicitly assumed complete penetrance; it is a conditional
          candidate interval, not a proven causal gene or obligatory phenotype. CAV3 is outside that refined
          interval. A 2025 infant with hypoplastic left heart syndrome had only a low-resolution 3p26
          karyotype, which did not demonstrate CAV3 deletion.
        role: mechanism
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: heart development
          term:
            id: GO:0007507
            label: heart development
          modifier: ABNORMAL
      selected_evidence:
        snippet: On the other hand, some known candidate genes, such as CAV3 and SEC13R, were shown to
          be outside the target interval.
        supports: SUPPORT
        directness: DIRECT
