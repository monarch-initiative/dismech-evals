            term:
              id: MONDO:0015779
              label: 45,X/46,XY mixed gonadal dysgenesis
        context: []
      assertion_type: Inheritance
      assertion:
        name: Sporadic post-zygotic mosaicism
        description: Usually sporadic chromosomal mosaicism arising through an early post-zygotic error,
          including mitotic Y-chromosome loss. Structural Y abnormalities can also contribute. This differs
          from Mendelian forms of 46,XY gonadal dysgenesis; counseling should use the individual cytogenetic
          findings rather than infer a universal parental karyotype or a precisely quantified recurrence
          risk.
      selected_evidence:
        snippet: MGD arises due to late anaphase lag during mitosis in the zygote, although Y chromosomal
          abnormalities are sometimes seen and interchromosomal rearrangement occurs.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/1
      context_paths:
      - /name
      - /disease_term
