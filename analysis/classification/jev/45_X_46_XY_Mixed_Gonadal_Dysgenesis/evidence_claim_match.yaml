        discussion_id: mgd_gonad_position_and_tumour_risk
        kind: KNOWLEDGE_GAP
        prompt: How should gonadal position, histology and function inform individualized tumour-risk
          assessment?
        rationale: In one 14-patient prophylactic gonadectomy series, all gonadoblastomas were in abdominal
          gonads. A different 21-child study found germ cell neoplasia in situ in abdominal, inguinal
          and scrotal dysgenetic testes. These cohorts studied different lesions and selected populations,
          so their counts are not directly contradictory or suitable for pooling. Scrotal position does
          not exclude neoplasia, and current surveillance methods have important sensitivity and sampling
          limitations. Reliable individual risk prediction while preserving gonadal function remains unresolved.
        attaches_to:
        - pathophysiology#Germ Cell Neoplasia in Dysgenetic Gonads
        - treatments#Individualized Gonadal Surgery
        - treatments#Surveillance of Retained Gonads
      selected_evidence:
        snippet: The exclusive presence of GB in intra-abdominal gonads is in keeping with the findings
          of several other series.
        supports: SUPPORT
