      assertion:
        name: Turner syndrome
        disease_term:
          preferred_term: Turner syndrome
          term:
            id: MONDO:0019499
            label: Turner syndrome
        description: Turner syndrome overlaps clinically and cytogenetically with this mosaic population.
          Some individuals with 45,X/46,XY and female external genitalia meet Turner diagnostic criteria;
          the presence of Y material does not exclude that diagnosis. Those with atypical or male external
          genitalia are outside the guideline definition of Turner syndrome but still warrant its surveillance
          recommendations.
        distinguishing_features:
        - Interpret Turner syndrome using phenotype and cytogenetic findings rather than an absolute absence
          of Y material.
        - Asymmetric streak/testicular anatomy supports the MGD description, but gonadal patterns in the
          mosaic population are variable.
      selected_evidence:
        snippet: Individuals with 45,X/46,XY mosaicism who do not have typical female external genitalia
          are also excluded from the diagnosis, although we recommend that the guidelines also apply to
          these individuals due to a similar comorbidity profile
        supports: SUPPORT
