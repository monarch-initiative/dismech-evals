      assertion_type: ProgressionInfo
      assertion:
        phase: Pubertal and post-pubertal gonadal decline
        notes: Spontaneous pubertal onset is common in individuals raised male who retain functioning
          testes, but later Sertoli or Leydig dysfunction can occur. In a 63-person multicenter male cohort,
          80% entered puberty spontaneously; a separate mild-genital-phenotype series found impaired Sertoli
          markers in five of seven evaluated at the end of puberty. These selected cohorts do not imply
          inevitable pubertal arrest.
      selected_evidence:
        snippet: Eighty percent of all patients experienced spontaneous pubertal onset, significantly
          more in the nongenital group (P = 0.023).
        supports: SUPPORT
