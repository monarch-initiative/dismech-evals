  16a656c1f8a8455cbe52b923627545fa734dc588ee4564ad23ae36fcbeb8b82e:
    claim:
      about:
        disease:
          name: 45,X/46,XY Mixed Gonadal Dysgenesis
          disease_term:
            preferred_term: 45,X/46,XY mixed gonadal dysgenesis
            term:
              id: MONDO:0015779
              label: 45,X/46,XY mixed gonadal dysgenesis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mgd_mosaic_distribution_and_development
        kind: KNOWLEDGE_GAP
        prompt: How does gonadal mosaic distribution shape differentiation during fetal development?
        rationale: Human gonadal FISH already demonstrates tissue and cellular mosaicism. Two MGD cases
          in a five-person study had higher XY fractions in testicular than ovarian tissue. In a later
          case, combined FISH and lineage-marker staining demonstrated gonadal mosaicism despite a 46,XY
          blood karyotype, but only one gonad was examined and both FISH artifacts and cell-dependent
          SRY expression complicated inference. These observations do not establish the timing, spatial
          signal interactions or causal mosaic threshold during fetal development. A high XY fraction
          also occurred in an atrophic infertile testis, showing that fraction alone is insufficient to
          predict function.
        attaches_to:
        - pathophysiology#Tissue-Specific Sex Chromosome Mosaicism
        - pathophysiology#Abnormal Gonadal Differentiation
      selected_evidence:
        snippet: In the mixed gonadal dysgenesis cases (cases 3 and 4), the testis had a higher percentage
          (greater than two fold) of XY cells than the ovary had.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
