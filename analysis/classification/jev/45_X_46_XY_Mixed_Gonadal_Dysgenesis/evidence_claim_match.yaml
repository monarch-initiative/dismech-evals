        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mgd_sry_threshold_model_is_murine
        kind: HUMAN_MODEL_MISMATCH
        prompt: How does the mouse FGF9-SOX9 and WNT4 network translate to a human mosaic gonad?
        rationale: Mouse knockout and culture experiments establish interdependent SOX9 and FGF9 expression
          and antagonism with WNT4. Fgf9-null XY gonads initially express SRY and SOX9 but fail to maintain
          SOX9 and form normal testis cords. The experimental genotypes are not 45,X/46,XY mosaic models.
          A requirement for a critical number of supporting cells and non-cell-autonomous recruitment
          is an author-proposed explanation rather than a measured human threshold. FGF9/WNT4 antagonism
          does not specify a direct biochemical repression step, and transient SOX9 induction in Wnt4-null
          XX gonads did not produce Sertoli differentiation or testis cords.
        attaches_to:
        - pathophysiology#Abnormal Gonadal Differentiation
      selected_evidence:
        snippet: Whether FGF9 normally acts non-cell-autonomously in vivo to recruit XY cells to the Sertoli
          lineage by up-regulating SOX9 is not clear.
        supports: SUPPORT
