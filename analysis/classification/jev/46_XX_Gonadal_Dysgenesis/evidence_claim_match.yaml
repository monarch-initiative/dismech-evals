          ODG1–ODG11 gene-disease relations, and which additional candidate genes survive segregation
          and functional validation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - diagnosis#Molecular genetic testing
        - genetic#ESR2
        - genetic#HROB
        rationale: Several numbered subtypes remain supported by very small family series, and broad sequencing
          cohorts mix pathogenic findings with VUSs and proposed candidates. Functional validation and
          independent replication are needed before expanding the causal series or estimating diagnostic
          yield.
      selected_evidence:
        snippet: We recruited 20 patients with 46,XX-CGD and identified 8 variants in 6 genes, including
          three homozygous variants in MCM9, POF1B, and PSMC3IP; compound heterozygous variants in TWNK;
          and three heterozygous variants in TP63 and INSRR, from 7 patients.
        supports: SUPPORT
