            term:
              id: MONDO:0009299
              label: 46 XX gonadal dysgenesis
        context: []
      assertion_type: Definition
      assertion:
        name: Clinical boundary of 46,XX gonadal dysgenesis
        definition_type: CASE_DEFINITION
        description: A primary ovarian developmental or gonadotropin-response disorder in a phenotypically
          female person with a 46,XX karyotype and hypergonadotropic ovarian failure. Ovarian morphology
          and clinical severity vary from follicles with arrested maturation and partial pubertal development
          to complete ovarian underdevelopment, streak gonads, absent puberty, and primary amenorrhea.
        scope: This entry models the ovarian outcome shared by ODG1 through ODG11. It excludes Turner
          or other sex-chromosome abnormalities, 46,XY gonadal dysgenesis, central hypogonadotropic hypogonadism,
          Müllerian agenesis with functioning ovaries, androgen-excess or testicular/ovotesticular 46,XX
          DSD, acquired ovarian failure, and the substantially independent multisystem mechanisms of Perrault
          and broader NR5A1-related disease.
      selected_evidence:
        snippet: XX female gonadal dysgenesis (XX-GD) is a rare, genetically heterogeneous disorder that
          is characterized by underdeveloped, dysfunctional ovaries, with subsequent lack of spontaneous
          pubertal development, primary amenorrhea, uterine hypoplasia, and hypergonadotropic hypogonadism.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26485283
      reference_title: A mutation in the nucleoporin-107 gene causes XX gonadal dysgenesis.
      evidence_source: HUMAN_CLINICAL
      explanation: Defines the complete ovarian-underdevelopment end of the 46,XX disease spectrum.
