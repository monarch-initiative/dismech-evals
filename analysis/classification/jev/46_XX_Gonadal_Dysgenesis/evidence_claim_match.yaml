      assertion:
        discussion_id: gap_xxgd_residual_follicles_and_fertility_preservation
        prompt: Can genotype, imaging, or ovarian-reserve measures reliably identify the minority with
          residual follicles early enough for evidence-based fertility preservation counseling?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#FSHR
        - pathophysiology#Failed Follicular Growth and Maturation
        - treatments#Fertility counseling and reproductive-endocrinology referral
        rationale: Follicles can persist in FSHR-related ovarian resistance, whereas many meiotic and
          germ-cell-development disorders deplete the follicle pool. The available studies do not establish
          a validated selection rule or treatment outcome for fertility preservation in this heterogeneous
          umbrella.
      selected_evidence:
        snippet: These findings suggest that a subset of ovarian dysgenesis patients with the FSH receptor
          mutation 566C-->T is pathogenetically distinct, possibly due to residual receptor activity,
          and that these patients can be tentatively identified by demonstrating the presence of ovarian
          follicles and confirmed by mutation analysis.
        supports: SUPPORT
