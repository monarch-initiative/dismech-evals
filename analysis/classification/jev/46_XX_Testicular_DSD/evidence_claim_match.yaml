        - diagnosis#Selective gonadal histology when the TDSD-OTDSD boundary is unresolved
        - differential_diagnoses#46,XX ovotesticular disorder of sex development
        rationale: Gonadal tissue is spatially heterogeneous, and a limited childhood biopsy can miss
          ovarian follicles later demonstrated during puberty. Misclassification changes counseling, fertility
          considerations, and interpretation of tumor evidence.
      selected_evidence:
        snippet: In 4 patients, the first sample obtained from gonadal biopsy failed to identify ovarian
          tissue that was later demonstrated during pubertal evaluation.
        supports: SUPPORT
