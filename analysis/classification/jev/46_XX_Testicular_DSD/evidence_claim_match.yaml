      assertion_type: Inheritance
      assertion:
        name: Usually de novo molecular events
        description: SRY-positive disease usually arises from a de novo X-Y interchange; known SOX3 CNVs
          and nonsyndromic WT1 variants have also usually been de novo when parents were tested. Recurrence
          risk is therefore molecular-cause specific and cannot be summarized by one Mendelian mode.
      selected_evidence:
        snippet: SRY-positive 46,XX testicular DSD is generally not inherited because it results from
          de novo abnormal interchange between the Y chromosome and the X chromosome, resulting in the
          presence of SRY on the X chromosome and infertility.
        supports: SUPPORT
