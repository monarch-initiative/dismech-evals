        prompt: What combination of imaging, endocrine markers, longitudinal observation, and adequately
          sampled histology best distinguishes testicular-only from ovotesticular 46,XX DSD without making
          biopsy routine?
        kind: KNOWLEDGE_GAP
        status: OPEN
