        prompt: Are there rigorously confirmed non-mosaic, testicular-only 46,XX cases with retrievable
          autologous sperm, and what evidence threshold should govern counseling about TESE or fertility
          preservation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Germ-cell loss and seminiferous-tubule failure
        - treatments#Donor-sperm assisted reproduction and family-building counseling
        rationale: AZF regions were absent in all tested members of the largest adult cohort and pure
          testicular biopsies show germ-cell loss, making success biologically unlikely. Rare reports
          may reflect mosaicism or TDSD-OTDSD misclassification, so counseling should avoid both false
          hope and an unsupported categorical prohibition.
      selected_evidence:
        snippet: The available fertility option proved to achieve live birth was limited to ART using
          donor spermatozoa.
        supports: SUPPORT
