        definition_type: CASE_DEFINITION
        description: The disease boundary requires a 46,XX karyotype and testicular-only gonadal differentiation,
          without ovarian tissue. Typical nonsyndromic disease also lacks Müllerian structures and congenital
          or neurodevelopmental features outside the genitourinary system. Histologic ovarian tissue instead
          defines ovotesticular DSD; palmoplantar keratoderma, cutaneous squamous-cell-carcinoma predisposition,
