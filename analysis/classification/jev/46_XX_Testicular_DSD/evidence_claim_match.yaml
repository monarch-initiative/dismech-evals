      selected_evidence:
        snippet: 'Nonsyndromic 46,XX testicular disorders/differences of sex development (DSD) are characterized
          by: the presence of a 46,XX karyotype; external genitalia ranging from typical male to ambiguous;
          two testicles; azoospermia; absence of müllerian structures; and absence of other syndromic
          features, such as congenital anomalies outside of the genitourinary system, learning disorders
          / cognitive impairment, or behavioral issues.'
        supports: SUPPORT
