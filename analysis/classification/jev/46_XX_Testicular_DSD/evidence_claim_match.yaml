        name: 46,XX ovotesticular disorder of sex development
        description: The closest boundary differential contains both ovarian follicles and testicular
          tissue. Müllerian structures and estrogen-producing ovarian tissue may be present, and a limited
          biopsy can miss the ovarian component.
        distinguishing_features:
        - Histologic ovarian follicles together with seminiferous tubules define ovotesticular DSD.
        - Testicular-only gonads and absent Müllerian structures favor nonsyndromic testicular DSD.
        disease_term:
          preferred_term: 46,XX ovotesticular disorder of sex development
          term:
            id: MONDO:0016281
            label: 46,XX ovotesticular disorder of sex development
      selected_evidence:
        snippet: The differential diagnosis between ovotesticular and testicular DSD is based on histological
          analysis. It requires the concomitant existence of testicular tissue (seminiferous tubules)
          and ovarian tissue (follicles containing oocytes)
        supports: SUPPORT
