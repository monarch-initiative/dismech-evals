              label: 46,XX testicular disorder of sex development
        context: []
      assertion_type: Definition
      assertion:
        name: Nonsyndromic 46,XX testicular DSD case definition
        definition_type: CASE_DEFINITION
        description: The disease boundary requires a 46,XX karyotype and testicular-only gonadal differentiation,
          without ovarian tissue. Typical nonsyndromic disease also lacks Müllerian structures and congenital
          or neurodevelopmental features outside the genitourinary system. Histologic ovarian tissue instead
          defines ovotesticular DSD; palmoplantar keratoderma, cutaneous squamous-cell-carcinoma predisposition,
          congenital heart disease, or other syndromic findings should trigger evaluation for a separate
          molecular syndrome.
        scope: MONDO:0100249 is curated here as the nonsyndromic testicular-only umbrella, not as a generic
          phenotype bucket for every cause of testicular tissue in a 46,XX individual.
      selected_evidence:
        snippet: It is characterized by the presence of testes in 46,XX individuals, with concomitant
          absence of Mullerian derivatives.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38841305
      reference_title: '46,XX Differences of Sex Development outside congenital adrenal hyperplasia: pathogenesis,
        clinical aspects, puberty, sex hormone replacement therapy and fertility outcomes.'
      evidence_source: OTHER
      explanation: This review independently supports testicular gonads and absent Müllerian derivatives
        as the defining anatomic pattern.
