      assertion_type: Treatment
      assertion:
        name: Testosterone Replacement Therapy
        description: For individuals seeking androgen-mediated puberty, incremental testosterone replacement
          can induce and sustain pubertal development when endogenous production is inadequate. Dose and
          timing follow growth, hormone results, clinical response and individual goals. Penile response
          varies; the Belgian series documents limited growth in two DHX37 carriers at Tanner G3 and does
          not establish universal adult failure. Short courses in infancy for micropenis are a separate
          individualized decision. Adequate sex-steroid replacement supports adolescent bone accrual.
          Follow pubertal progression, growth, skeletal maturation, hormone results and adverse effects
          during induction; the Endo-ERN guideline describes clinical review every three to six months.
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Hormone Replacement Therapy
          term:
            id: NCIT:C15599
            label: Hormone Replacement Therapy
          therapeutic_agent:
          - preferred_term: testosterone
            term:
              id: CHEBI:17347
              label: testosterone
        target_phenotypes:
        - preferred_term: Hypergonadotropic hypogonadism
          term:
            id: HP:0000815
            label: Hypergonadotropic hypogonadism
        - preferred_term: Hypogonadism
          term:
            id: HP:0000135
            label: Hypogonadism
      selected_evidence:
        snippet: Statural growth and pubertal development are adequate with incremental doses of testosterone
          replacement therapy (TRT); however, penile growth is often suboptimal
        supports: SUPPORT
        directness: INDIRECT
