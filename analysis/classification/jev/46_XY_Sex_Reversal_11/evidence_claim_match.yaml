        - animal_models#Sertoli-cell conditional Dhx37 knockout mouse
        rationale: The apparent disagreement is partly resolved by the full texts. McElreavey and colleagues
          report fetal somatic-cell localization and explicitly report adult spermatogonial expression.
          The da Silva series includes late fetal, neonatal and adult specimens and observes germ-cell/Leydig
          staining with rare weak Sertoli staining. These stage- and assay-dependent observations do not
          establish a mutually exclusive somatic-versus-germ-cell mechanism. Expression outside the gonad
          also precludes interpreting fetal somatic localization as whole-body gonad specificity.
      selected_evidence:
        snippet: Immunohistochemistry analysis in human testis showed that DHX37 is mainly expressed in
          germ cells at different stages of testis maturation, in Leydig cells, and rarely in Sertoli
          cells.
