        prompt: How does disruption of DHX37, a housekeeping nucleolar helicase needed for ribosome biogenesis
          in every cell, produce a phenotype restricted to the gonad and expressed only in 46,XY individuals?
        attaches_to:
        - pathophysiology#Impaired Small Ribosomal Subunit Biogenesis
        - pathophysiology#Nucleolar Structural Disruption
        rationale: DHX37 has broad cellular roles, while specific variants are associated with testicular-development
          disease. The clinical genetic evidence is stronger than the proposed universal ribosome-stress
          mechanism. Selected variants alter protein abundance or beta-catenin in overexpression systems,
          whereas Ser408Leu does not increase p53 or apoptosis relative to wild type. The Glu257Lys VUS
          was functionally negative in the reported assays and co-occurred with a likely pathogenic NR5A1
          variant; that case does not demonstrate an undetectable disease mechanism. Patient gonadal pre-rRNA/40S
          measurements and allele-matched developmental models remain gaps.
      selected_evidence:
