          domain location and enrichment establish a genetic association without proving decreased ATPase
          activity, dominant-negative action, gain of function or haploinsufficiency. Reports of variants
          of uncertain significance require separate interpretation.'
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: DHX37
