        name: Multidisciplinary DSD Supportive Care
        description: Provide ongoing endocrine, urologic/gynecologic, genetics and psychological care,
          with age-appropriate explanation and active participation in decisions. Sex of rearing does
          not determine later identity or treatment preferences. Three DHX37 carriers in one selected
          cohort reported male, female and non-binary identities; these observations are not predictive
          probabilities. Discuss sex-steroid effects, fertility implications, body image and transition
          to adult care. Nonessential irreversible genital procedures should be considered in a process
          that enables the affected individual to participate.
        action_category: THERAPEUTIC
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: The three participants with a DHX37 variant developed a male, female, and non-binary
          gender identity, respectively; all other participants identified as males.
