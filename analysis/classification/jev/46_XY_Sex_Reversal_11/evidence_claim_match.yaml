        description: Specific heterozygous DHX37 variants show sex-limited autosomal dominant inheritance
          with variable expression and incomplete penetrance in 46,XY carriers. Unaffected 46,XX carriers,
          unaffected or mildly affected fertile fathers, and de novo variants are reported. Maternal transmission
          predominates in some family series, whereas five of six parentally tested cases in the 2019
          discovery cohort were de novo; these ascertained series do not establish a population penetrance
          or de novo fraction.
      selected_evidence:
