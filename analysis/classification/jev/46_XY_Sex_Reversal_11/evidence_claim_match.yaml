              label: 46,XY sex reversal 11
        context: []
      assertion_type: Definition
      assertion:
        name: 46,XY sex reversal 11 case definition
        definition_type: CASE_DEFINITION
        description: A 46,XY individual with a difference of testicular development and a pathogenic or
          likely pathogenic DHX37 variant consistent with the phenotype and inheritance. Most established
          alleles are heterozygous missense changes in conserved helicase domains. A rare variant or an
          in silico damaging prediction alone does not establish the diagnosis. A homozygous missense
          case has also been reported, so heterozygosity is not an absolute requirement.
        scope: This gene-defined entry spans gonadal dysgenesis and testicular regression because recurrent
          alleles produce both presentations within and across families. Other genetic and non-genetic
          causes of those clinical phenotypes require separate diagnosis. The allelic DHX37 neurodevelopmental
          disorder NEDBAVC is distinct and can involve biallelic or de novo heterozygous variants.
      selected_evidence:
        snippet: Missense variants in the RNA-helicase DHX37 are associated with either 46,XY gonadal
          dysgenesis or 46,XY testicular regression syndrome (TRS). DHX37 is required for ribosome biogenesis,
          and this subgroup of XY DSD is a new human ribosomopathy.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
