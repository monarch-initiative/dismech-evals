          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        description: Interpret FSH, LH, testosterone, AMH and inhibin B against age-appropriate ranges
          and the clinical examination. Selected hCG testing can characterize Leydig-cell function but
          is not required in every case. Low markers or a blunted response indicate impaired function
          without necessarily proving absent tissue; hormonal testing cannot distinguish one from two
          functioning gonads. NCIT search for "hormone stimulation test" found no fitting specific term;
          this entry also includes basal hormone assays, so the broader diagnostic-procedure binding is
          retained.
