  eb19f4c2a9334fd75864f7ca89c802c19101610a68de0c2b6dbce971448952f0:
    claim:
      about:
        disease:
          name: 46,XY Sex Reversal 11
          disease_term:
            preferred_term: 46,XY sex reversal 11
            term:
              id: MONDO:8000015
              label: 46,XY sex reversal 11
        context: []
      assertion_type: Genetic
      assertion:
        name: DHX37
        gene_term:
          preferred_term: DHX37
          term:
            id: hgnc:17210
            label: DHX37
        presence: Missense variant, heterozygous in the great majority of cases
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        frequency: Diagnostic yields vary with ascertainment. The discovery cohort found variants in 9/81
          unexplained gonadal-dysgenesis cases and 4/16 testicular-regression cases. A Japanese series
          selected for TRS/PGD without Müllerian derivatives found DHX37 variants in four of ten families.
          The Belgian series identified three carriers among 34 successfully analyzed participants. These
          are selected cohort fractions, not disease prevalence or penetrance.
        inheritance:
        - name: Sex-limited autosomal dominant, incomplete penetrance in 46,XY
          inheritance_term:
            preferred_term: sex-limited autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          penetrance: INCOMPLETE
        notes: Established congenital DSD-associated variants are predominantly missense alleles affecting
          conserved helicase regions. The molecular mechanism is unresolved; variant class alone does
          not establish gain of function, dominant-negative action or haploinsufficiency. Co-occurring
          variants in NR5A1 or SOX9 do not establish digenic inheritance, particularly when the DHX37
          allele is uncertain or likely benign. A frameshift described in an infertility context should
          not be generalized to the congenital SRXY11 phenotype.
        case_fractions:
        - population: Japanese TRS/PGD cohort without Müllerian derivatives
          case_fraction_percent: 40.0
          cohort_size: 10
          notes: Four of ten families among eleven selected Japanese individuals with TRS/PGD and no Müllerian
            derivatives. The denominator is families, not unrelated unselected DSD patients.
        - population: Brazilian 46,XY DSD referral cohort, embryonic testicular regression subgroup
          notes: The primary abstract and author manuscript report 7/14 ETRS index cases (50%). The methods
            describe ten affected members of five ETRS families plus eight sporadic cases, yielding thirteen
            apparent index families; that accounting does not reconcile cleanly with fourteen. Preserve
            the authors’ numerator/denominator in prose and omit a machine-readable fraction pending clarification.
            The separate overall yield is 11/78 index cases.
        - population: Belgian bilateral testicular regression cohort
          case_fraction_percent: 8.8
          cohort_size: 34
          notes: Three carriers among 34 participants with analyzable DNA; one of the 35 recruited participants
            was excluded for suboptimal DNA quality. This was a retrospective multicenter clinical series,
            not population screening.
        - population: Previously unexplained 46,XY gonadal dysgenesis in the discovery cohort
          cohort_size: 81
          case_fraction_percent: 11.1
          notes: Nine of 81 gonadal-dysgenesis cases; complete and partial disease are not separated in
            this fraction.
        - population: Previously unexplained 46,XY testicular regression in the discovery cohort
          cohort_size: 16
          case_fraction_percent: 25.0
          notes: Four of sixteen clinically classified TRS cases; cohort definitions differ from later
            regression series.
      selected_evidence:
        snippet: Thirteen children carried heterozygous missense pathogenic variants involving the RNA
          helicase DHX37, which is essential for ribosome biogenesis.
        supports: SUPPORT
        directness: DIRECT
