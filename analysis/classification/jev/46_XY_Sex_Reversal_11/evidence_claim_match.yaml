              id: hgnc:17210
              label: DHX37
          allele_type: MISSENSE
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
      selected_evidence:
        snippet: Twelve variants are clustered in two highly conserved functional domains and were specifically
          associated with gonadal dysgenesis and TRS.
        supports: SUPPORT
        directness: DIRECT
