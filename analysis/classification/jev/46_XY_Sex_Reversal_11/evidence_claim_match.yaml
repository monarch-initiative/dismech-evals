      assertion_type: Pathophysiology
      assertion:
        name: Impaired Small Ribosomal Subunit Biogenesis
        description: DHX37 normally supports small-subunit maturation. Human HeLa-cell depletion reduces
          18S rRNA and 40S output and impairs conversion of 21S pre-rRNA to 18SE. Wild-type DHX37 rescues
          processing defects in HEK293 complementation assays, whereas engineered catalytic T282A does
          not and causes retention of U3 snoRNA on pre-ribosomes. T282A is not a patient DSD allele; ribosome
          processing/output has not been demonstrated to fail in affected human gonads, so the SRXY11
          mechanism remains hypothetical. Yeast experiments on neurological or zebrafish ortholog substitutions
          do not fill this gap.
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        biological_processes:
        - preferred_term: ribosomal small subunit biogenesis
          term:
            id: GO:0042274
            label: ribosomal small subunit biogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: Using an in vivo crosslinking approach, we show that DHX37 binds directly to the U3 small
          nucleolar RNA (snoRNA) and demonstrate that the catalytic activity of the helicase is required
          for dissociation of the U3 snoRNA from pre-ribosomal complexes.
        supports: SUPPORT
        directness: INDIRECT
