      assertion_type: Treatment
      assertion:
        name: Genetic Counseling
        description: Explain sex-limited expression, variable severity, incomplete penetrance in 46,XY
          carriers and the distinction between an established variant and a VUS. A heterozygous parent
          has a 50% chance of transmitting the allele in each pregnancy, which is not a 50% chance of
          an affected child. Parental testing informs recurrence counseling; negative blood testing cannot
          exclude germline mosaicism. Once a familial pathogenic variant is established, testing of relatives
          and reproductive testing options can be discussed. NEDBAVC is a distinct allelic disorder with
          variant-dependent inheritance.
        action_category: COUNSELING_INFORMATIONAL
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: the risk to sibs of inheriting the genetic alteration is 50%.
        supports: SUPPORT
        directness: INDIRECT
