        - path: /experimental_models/3
          value:
            name: Human DHX37 depletion and catalytic-mutant complementation
            experimental_model_type: CELL_LINE
            description: HeLa RNAi and HEK293 complementation with RNAi-resistant wild-type or engineered
              T282A DHX37 define pre-rRNA processing and small-subunit assembly functions. Wild-type transgene
              rescues processing defects. Purified recombinant-protein experiments independently show
              RNA-dependent ATPase activity and stimulation by directly interacting UTP14A. The catalytic
              mutant retains the protein-presence function that prevents aberrant pre-rRNA turnover, separating
              that function from ATPase-dependent maturation.
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            publication: PMID:30582406
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Small Ribosomal Subunit Biogenesis
        relationship: PERTURBS
        fidelity: LOW
        description: Depletion and catalytic perturbation impair small-subunit maturation; complementation
          with wild-type DHX37 reverses the processing defect.
