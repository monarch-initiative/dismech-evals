        context: []
      assertion_type: Treatment
      assertion:
        name: Estrogen Replacement Therapy
        description: For individuals seeking estrogen-mediated puberty, gradual estrogen replacement induces
          breast development and supports bone accrual when gonadal steroid production is inadequate.
          If a uterus is present, progesterone is added after puberty has progressed. Treatment follows
          the individual’s goals and anatomy. Direct DHX37 observations include estradiol induction at
          age 11.3 years in an Arg308Gln carrier and estrogen at age 12 years 2 months in an Arg674Trp
          carrier; these are case-level observations rather than comparative trials. The broader Endo-ERN
          guideline favors 17β-estradiol and gradual dose escalation with clinical monitoring; much of
          its evidence derives from other forms of gonadal insufficiency.
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Estrogen Replacement Therapy
          term:
            id: NCIT:C15231
            label: Estrogen Replacement Therapy
          therapeutic_agent:
          - preferred_term: estradiol
            term:
              id: CHEBI:23965
              label: estradiol
        target_phenotypes:
        - preferred_term: Hypergonadotropic hypogonadism
          term:
            id: HP:0000815
            label: Hypergonadotropic hypogonadism
        - preferred_term: Hypogonadism
          term:
            id: HP:0000135
            label: Hypogonadism
      selected_evidence:
        snippet: We recommend to use 17β-oestradiol for puberty induction or to sustain puberty in girls
        supports: SUPPORT
        directness: INDIRECT
