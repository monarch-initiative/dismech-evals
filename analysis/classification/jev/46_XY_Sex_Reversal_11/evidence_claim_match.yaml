      assertion_type: Diagnosis
      assertion:
        name: Selected surgical exploration and gonadal histology
        diagnosis_term:
          preferred_term: Surgical Procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        description: Exploration and histology may define tissue that remains anatomically or functionally
          uncertain and inform management of a retained dysgenetic gonad. They are individualized procedures
          rather than mandatory tests in every carrier. Biopsy has sampling limitations and may compromise
          future gonadal function. NCIT "testicular biopsy" resolves to C51894 (Biopsy of Testis), but
          this combined assessment includes exploration and sampling of potentially nontesticular dysgenetic
          tissue; the broader procedure binding preserves that scope.
      selected_evidence:
        snippet: Histological analysis of two participants with DHX37 variants suggested early disruption
          of gonadal development due to the presence of Müllerian remnants in both and undifferentiated
          gonadal tissue in one.
        supports: SUPPORT
        directness: DIRECT
