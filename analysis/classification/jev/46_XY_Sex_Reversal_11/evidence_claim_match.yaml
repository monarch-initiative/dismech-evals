      assertion_type: Treatment
      assertion:
        name: Gonadal Surgery
        description: Decisions depend on gonadal function, histology, location and tumor concern. Removal
          of nonfunctioning dysgenetic gonads may be appropriate; potentially functioning retained gonads
          may instead be positioned for examination and monitored after individualized counseling. Surveillance
          has limitations and no validated DHX37-specific protocol. Management of a fibrotic regression
          remnant is a separate question from a retained dysgenetic testis. Prostheses are optional and
          discussed according to the individual’s preferences.
        action_category: THERAPEUTIC
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: gonadectomy (bilateral orchiectomy)
          term:
            id: NCIT:C15288
            label: Orchiectomy
        target_phenotypes:
        - preferred_term: Germ cell neoplasia
          term:
            id: HP:0100728
            label: Germ cell neoplasia
        notes: Tumour-risk figures specific to DHX37-related gonads have not been published; risk estimates
          are extrapolated from 46,XY gonadal dysgenesis generally. Do not quote a DHX37-specific gonadoblastoma
          risk.
      selected_evidence:
        snippet: Depending on the specific diagnosis, potentially functional gonads may be retained with
          appropriate surveillance for tumor development.
        supports: SUPPORT
        directness: INDIRECT
