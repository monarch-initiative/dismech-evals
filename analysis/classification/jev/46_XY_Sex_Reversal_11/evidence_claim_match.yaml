      assertion_type: Discussion
      assertion:
        discussion_id: dhx37_allele_mechanism_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Which consequences of a Sertoli-cell conditional null model also occur with heterozygous
          human DHX37 missense variants?
        attaches_to:
        - animal_models#Sertoli-cell conditional Dhx37 knockout mouse
        - pathophysiology#DHX37 Missense Variation
        rationale: Amh-Cre deletion begins after initial sex determination and adult knockout findings
          test maintenance of a formed testis. The model does not establish early human sex reversal,
          a shared missense mechanism or p53 necessity. Variant-specific abundance and signaling assays
          also differ from null perturbations. A heterozygous allele-matched developmental model with
          appropriate dosage controls would help test which pathways mediate the human phenotype.
        proposed_experiments:
        - experiment_id: dhx37_r308q_knockin_mouse
          name: Knock-in of a recurrent human DHX37 missense allele in mouse
          description: Generate a mouse carrying the orthologue of p.Arg308Gln or p.Arg674Trp in the heterozygous
            state and assess fetal gonadal development, Müllerian regression, external genital masculinization,
            and postnatal gonadal presence, alongside nucleolar integrity and p53 activation in gonadal
            supporting cells.
          would_support:
          - pathophysiology#DHX37 Missense Variation
          - pathophysiology#Nucleolar Structural Disruption
          supporting_outcome:
          - A heterozygous allele reproduces a gonadal phenotype together with the proposed cellular change;
            comparison with heterozygous null animals and pathway rescue helps distinguish dosage effects
            from other mechanisms.
          refuting_outcome:
          - Absence of the proposed molecular change or failure of pathway rescue would weaken that particular
            mechanism. A phenotypically normal mouse would limit this model without excluding human pathogenicity
            or proving a species-specific mechanism.
      selected_evidence:
        snippet: In the Dhx37-/- mice, we observed pronounced defects, including diminished testicular
          volume, lower testosterone levels, and marked vacuolization of the seminiferous tubules.
        supports: SUPPORT
        directness: INDIRECT
