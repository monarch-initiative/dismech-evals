        context: []
      assertion_type: Subtype
      assertion:
        name: CBX2.2
        display_name: CBX2.2 (isoform 2) related, undervirilized phenotype with dysgenetic testes
        description: 'Two unrelated 46,XY individuals carrying distinct variants in the shorter CBX2.2
          isoform (p.Cys132Arg and p.Cys154fs) presented with atypical external genitalia, microphallus,
          perineal hypospadias and no palpable gonads, and were found to have dysgenetic Sertoli-cell-only
          testes or no residual gonadal tissue, with hypergonadotropic hypogonadism. In vitro these variants
          fail to regulate a target set distinct from that of CBX2.1, most notably EMX2. This arm is grouped
          under the same entry because the causal gene is the same, but note the caveats recorded in the
          entry notes: the zygosity of these variants is not reported as biallelic, so this subtype''s
          relationship to the autosomal recessive CBX2.1 entity is not settled.'
      selected_evidence:
        snippet: Here, we describe two patients with features of DSD i.e. atypical external genitalia,
          perineal hypospadias and no palpable gonads, each patient carrying a distinct CBX2.2 variant,
          p.Cys132Arg (c.394T>C) and p.Cys154fs (c.460delT).
        supports: SUPPORT
