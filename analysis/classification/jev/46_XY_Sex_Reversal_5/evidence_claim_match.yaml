      assertion_type: Pathophysiology
      assertion:
        name: Failure of CBX2.2-Dependent EMX2 Regulation
        biological_scale: MOLECULAR
        description: 'A separate molecular arm specific to the short CBX2.2 isoform. Both reported CBX2.2
          variants failed to regulate their target genes in transactivation assays, with defective EMX2
          expression proposed as the proximate cause of the severe 46,XY phenotype in those patients.
          EMX2 is required for urogenital ridge development, so this arm converges on the same gonadal
          endpoint as the CBX2.1 arm by a non-overlapping target route. Independent support for a CBX2-EMX2
          axis comes from a different disease gene: a PBX1 variant causing 46,XY gonadal dysgenesis was
          shown to abolish PBX1''s physical interaction with both CBX2 and EMX2, placing the three proteins
          in one testis-determining module.'
        biological_processes:
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: We show that both CBX2.2 variants fail to regulate the expression of genes essential
          for sexual development
        supports: SUPPORT
