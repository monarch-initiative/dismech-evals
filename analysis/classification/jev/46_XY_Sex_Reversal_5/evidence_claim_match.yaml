      - /disease_term
    evidence_metadata:
      reference: PMID:22186409
      reference_title: Cbx2, a polycomb group gene, is required for Sry gene expression in mice.
      evidence_source: MODEL_ORGANISM
      explanation: Rescue by supplying Sry or Sox9 is the central genetic argument that the defect is
