  22672f4414bf17abfb412b335ac234d26a41d0cdd5d6ab2addee7c59e6570027:
    claim:
      about:
        disease:
          name: 46,XY Sex Reversal 5
          disease_term:
            preferred_term: 46,XY sex reversal 5
            term:
              id: MONDO:0013120
              label: 46,XY sex reversal 5
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cbx2_adrenal_splenic_mismatch
        prompt: Why do Cbx2-null mice have adrenal and splenic hypoplasia through reduced SF1, while human
          CBX2 patients have no reported adrenal or splenic disease, even though the human mutant protein's
          defining defect is failure to transactivate the same gene, NR5A1/SF1?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of CBX2 Transactivation of NR5A1 and SOX9
        rationale: 'The mouse work makes SF1 the mechanistic centre of the disorder: PRC1 containing M33
          binds the Ad4BP/SF1 locus directly, M33 nulls have significantly reduced SF1, and the resulting
          adrenal and splenic phenotypes are the ones SF1 haploinsufficiency itself produces. The human
          index patient''s mutant CBX2.1 also fails to transactivate NR5A1/SF1 - that assay is the primary
          functional evidence for pathogenicity. Yet none of the three published human patients has reported
          adrenal insufficiency, and a review of the CBX2 transcriptional landscape notes explicitly that
          human mutants do not appear to recapitulate the murine splenic and adrenal defects. Either the
          human alleles are hypomorphic enough to spare a less dosage-sensitive human adrenal, or CBX2
          is not rate-limiting for human SF1 outside the gonad. The distinction matters clinically: if
          the first explanation is right, adrenal reserve should be tested in CBX2 patients, and it currently
          is not.'
        proposed_experiments:
        - experiment_id: exp_cbx2_adrenal_reserve
          name: Adrenal reserve testing in CBX2 variant carriers
          description: Measure basal and ACTH-stimulated cortisol, along with electrolytes and plasma
            renin activity, in every ascertained individual with biallelic or isoform-specific CBX2 variants,
            to convert the current absence of reported adrenal disease into a tested negative.
          would_refute:
          - pathophysiology#Failure of CBX2 Transactivation of NR5A1 and SOX9
          refuting_outcome:
          - Normal ACTH-stimulated cortisol across all carriers would show that human CBX2 loss does not
            limit SF1-dependent adrenal function, restricting the transactivation defect to the gonadal
            compartment rather than being a general SF1 deficit.
        - experiment_id: exp_cbx2_sf1_dose_response
          name: Comparative SF1 dose-response between mouse and human adrenocortical cells
          description: Titrate CBX2 knockdown in human and murine adrenocortical cells in parallel and
            measure SF1 output, to test whether the human adrenal simply tolerates a lower CBX2 dose than
            the mouse adrenal does.
      selected_evidence:
        snippet: although human mutants do not seem to recapitulate these defects
        supports: SUPPORT
    origin:
