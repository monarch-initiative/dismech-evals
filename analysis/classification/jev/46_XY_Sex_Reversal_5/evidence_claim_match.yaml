        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No population prevalence or incidence figure has been published. The entire literature
          this entry draws on describes three individuals: one 46,XY girl with double-heterozygous CBX2.1
          variants (2009) and two 46,XY individuals with CBX2.2 variants (2018). That is the set of primary
          reports found here, not a verified census of the world literature. A dedicated screen of 47
          patients with 46,XY or 46,XX gonadal DSD found no pathogenic CBX2 variant, which bounds the
          contribution of CBX2 to ascertained gonadal DSD from above but yields no population rate. This
          is a case tally, not an occurrence estimate.'
      selected_evidence:
        snippet: This study does not support CBX2 gene disruption as a common cause of gonadal DSD.
        supports: SUPPORT
