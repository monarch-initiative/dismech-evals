  b7640b358801e30c5a035fe77327b673f515b53965ba80476f4436500a6cad39:
    claim:
      about:
        disease:
          name: 46,XY Sex Reversal 5
          disease_term:
            preferred_term: 46,XY sex reversal 5
            term:
              id: MONDO:0013120
              label: 46,XY sex reversal 5
        context: []
      assertion_type: AnimalModel
      assertion:
        name: M33cterm/Cbx2 null mouse (C57BL/6)
        species: Mouse
        genotype: M33cterm homozygous (poly(A) neo insertion into Cbx2 exon 5)
        background: C57BL/6
        genes:
        - preferred_term: CBX2
          term:
            id: hgnc:1552
            label: CBX2
        publication: PMID:9641679
        description: 'Targeted disruption of M33/Cbx2 by insertion of a poly(A) capture-type neo vector
          into the fifth exon, maintained on C57BL/6. More than half of homozygous mutants die before
          weaning; survivors show male-to-female sex reversal, and genital ridge formation is retarded
          in both XX and XY embryos. This model is the origin of the entire CBX2 sex-development hypothesis:
          the human index case was investigated precisely because the girl''s phenotype matched it. Later
          work in the same line established the Sry-expression mechanism and the Sry/Sox9 rescue. Its
          principal divergence from human disease is the extragonadal phenotype - skeletal, splenic and
          adrenal - which human CBX2 patients do not report. Note this is one of two distinct published
          Cbx2 null lines and the two are not interchangeable: the separately curated BALB/c line below
          uses a different allele and gives a substantially lower sex-reversal rate, and figures from
          one must not be quoted for the other.'
        modeled_mechanisms:
        - target: Reduced SRY Expression in the Bipotential Gonad
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Cbx2-null gonads have reduced Sry expression, and forced Sry or Sox9 expression
            rescues the sex reversal. This is the strongest evidence in either species for the node.
          limitations: The ordering is established in mouse; the human equivalent rests on in vitro transactivation
            assays with the patient's mutant protein rather than on measured SRY levels in a patient gonad.
          readouts:
          - name: Gonadal Sry transcript level
            target: Reduced SRY Expression in the Bipotential Gonad
            direction: DECREASED
            interpretation: Sry expression is altered in the knockout gonad. The direction recorded here
              is DECREASED, which the cited sentence does not itself state - it says only "affected" -
              and which follows from the paper's title claim that Cbx2 is required for Sry expression,
              and from the rescue by forced Sry expression.
        - target: Impaired Genital Ridge Growth
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Genital ridge formation is retarded in both XX and XY nulls, and rescued XY animals
            still have hypoplastic testes, isolating a growth defect from the sex-determination defect.
          limitations: No human CBX2 patient has had gonadal volume measured against a normative standard,
            so the human counterpart of this readout is inferred from non-visualized or atrophic gonads
            rather than measured.
          readouts:
          - name: Testis size after Sry/Sox9 rescue
            target: Impaired Genital Ridge Growth
            direction: DECREASED
            interpretation: Persisting hypoplasia after the sex reversal is rescued is what establishes
              gonadal size as a separately controlled output.
        - target: Dysgenetic Gonad
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: XY nulls on this background develop ovaries rather than testes, matching the CBX2.1
            index patient's ovarian tissue but not the Sertoli-cell-only dysgenetic testes of the CBX2.2
            patients.
          limitations: Even on this background the outcome is not uniform - about half of surviving adults
            have bilateral ovaries - so the line does not reproduce a single consistent human gonadal
            outcome. The mouse also has no CBX2.2 equivalent arm, so the second human presentation is
            unmodelled. Rates from the BALB/c line curated separately below do not apply here.
          readouts:
          - name: Gonadal histology in XY nulls on C57BL/6
            target: Dysgenetic Gonad
            direction: ALTERED
            interpretation: The XY gonad follows the ovarian route rather than forming a normal testis,
              in the majority of animals on this background.
      selected_evidence:
        snippet: More than half of the resultant M33cterm/M33cterm mutant mice died before weaning, and
          survivors showed male-to-female sex reversal.
        supports: SUPPORT
