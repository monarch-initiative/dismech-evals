        context: []
      assertion_type: Genetic
      assertion:
        name: CBX2
        gene_term:
          preferred_term: CBX2
          term:
            id: hgnc:1552
            label: CBX2
        relationship_type: CAUSATIVE
        notes: 'CBX2 (chromobox homolog 2, formerly M33) at 17q25.3 encodes a chromodomain subunit of
          Polycomb repressive complex 1. Two protein isoforms are produced: the long CBX2.1 and the short
          CBX2.2, which have partly non-overlapping target sets and are implicated in the two phenotypically
          distinct arms of this disorder. Reported disease alleles are the double-heterozygous CBX2.1
          variants of the index patient, and the CBX2.2 changes c.394T>C (p.Cys132Arg) and c.460delT (p.Cys154fs).
          The index alleles are reported as p.Pro98Leu and p.Arg443Pro; both are recorded in ClinVar as
          pathogenic for this condition, but no cached publication in this entry names them, so they are
          given here without an evidence item rather than attributed to a source that does not state them.
          On constraint: the 2018 CBX2.2 report quotes an ExAC pLI of 0.95 for CBX2. Current gnomAD constraint
          says the opposite: pLI 0.024, observed/expected LoF 0.52 (90% CI 0.33-0.87), LoF Z 1.85 (gnomAD
          API, GRCh38, queried 2026-09-01; the deep-research report committed with this entry reports
          the same figures independently). CBX2 is therefore not loss-of-function intolerant, heterozygous
          LoF is tolerated in the general population, and that is what a recessive mechanism predicts.
          The 0.95 figure is retained above only because it is what the cited paper reported, and it should
          not be used to argue for dominance.'
      selected_evidence:
        snippet: each patient carrying a distinct CBX2.2 variant, p.Cys132Arg (c.394T>C) and p.Cys154fs
          (c.460delT)
        supports: SUPPORT
