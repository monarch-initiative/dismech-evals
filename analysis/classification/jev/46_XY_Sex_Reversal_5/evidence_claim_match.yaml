        biological_scale: TISSUE
        description: A growth arm that is separable from the sex-determination arm. In M33-null mice the
          genital ridge forms late in both XX and XY embryos, and when sex reversal is genetically rescued
          by forced Sry or Sox9 expression the resulting testes are still hypoplastic. Gonadal size and
          gonadal sex are therefore controlled by different sets of CBX2-dependent genes, and this node
          carries the size component. It is the mechanistic reason a CBX2 gonad can be small or non-visualized
          independently of which way it differentiates.
