        - path: /has_subtypes/1
          value:
            name: CBX2.2
            display_name: CBX2.2 (isoform 2) related, undervirilized phenotype with dysgenetic testes
            description: 'Two unrelated 46,XY individuals carrying distinct variants in the shorter CBX2.2
              isoform (p.Cys132Arg and p.Cys154fs) presented with atypical external genitalia, microphallus,
              perineal hypospadias and no palpable gonads, and were found to have dysgenetic Sertoli-cell-only
              testes or no residual gonadal tissue, with hypergonadotropic hypogonadism. In vitro these
              variants fail to regulate a target set distinct from that of CBX2.1, most notably EMX2.
              This arm is grouped under the same entry because the causal gene is the same, but note the
              caveats recorded in the entry notes: the zygosity of these variants is not reported as biallelic,
              so this subtype''s relationship to the autosomal recessive CBX2.1 entity is not settled.'
          role: subtype
      assertion_type: Phenotype
      assertion:
        name: Gonadal dysgenesis
        category: Anatomical
        subtype: CBX2.2
        description: Dysgenetic or non-visualized gonads in the CBX2.2 arm. One patient had bilateral
          atrophic testes removed at ten years of age; the other had no gonadal tissue identifiable at
          gonadectomy. Bound to the male-specific child term rather than to HP:0000133, whose own HPO
          definition asks that it be avoided for new annotations in favour of more specific terms.
        phenotype_term:
          preferred_term: Gonadal dysgenesis, male
          term:
            id: HP:0008668
            label: Gonadal dysgenesis, male
      selected_evidence:
        snippet: At 10 years of age he was submitted to exploratory laparotomy which disclosed bilateral
          atrophic testis that were removed.
        supports: SUPPORT
