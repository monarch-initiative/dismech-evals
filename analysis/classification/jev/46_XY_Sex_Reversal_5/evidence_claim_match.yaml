          in the human gonad from around week 7 of gestation, before testis determination, and continues
          to be detected in both male and female gonads from week 9 to week 25. Because the protein acts
          both as a chromatin modifier and as a direct transactivator, its loss removes two separable
          activities at once, which is why downstream male genes fall and female genes rise from the same
          lesion. The node is named for the loss, not for a zygosity: the CBX2.1 index patient carried
          two variants, but the two CBX2.2 patients are each reported with a single variant, so calling
          the node biallelic would assert what the zygosity knowledge gap says is unresolved.'
