  d00ee46cce21a21925ca8a0f01028732b8fdec40acd1df8de23717c95655f74b:
    claim:
      about:
        disease:
          name: 46,XY Sex Reversal 5
          disease_term:
            preferred_term: 46,XY sex reversal 5
            term:
              id: MONDO:0013120
              label: 46,XY sex reversal 5
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Karyotype-phenotype discordance as the entry point
        description: 'There is no screening pathway for this disorder; every reported patient reached
          diagnosis through a mismatch between chromosomal and phenotypic sex. The CBX2.1 index patient
          is the instructive case: her external genitalia were entirely normal, so nothing at birth would
          have prompted investigation, and she was identified only because a prenatal 46,XY karyotype
          already existed to contradict. That route implies the fully sex-reversed presentation is systematically
          under-ascertained.'
        diagnosis_term:
          preferred_term: karyotyping
          term:
            id: NCIT:C16768
            label: Karyotyping
        results: A 46,XY karyotype that does not match the observed phenotype.
      selected_evidence:
        snippet: A girl with a prenatal 46,XY karyotype was born with a completely normal female phenotype,
          including uterus and histologically normal ovaries.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19361780
      reference_title: Ovaries and female phenotype in a girl with 46,XY karyotype and mutations in the
        CBX2 gene.
      evidence_source: HUMAN_CLINICAL
      explanation: The prenatal karyotype is what made the discordance visible in a patient whose phenotype
        was otherwise unremarkable.
