      assertion_type: Phenotype
      assertion:
        name: Sex reversal
        category: Anatomical
        description: 'Discordance between chromosomal sex and gonadal or phenotypic sex, shared by the
          human index patient and the mouse models. No frequency is asserted despite the disease name,
          because the term fits the two arms unevenly: the CBX2.1 index patient was fully sex-reversed,
          whereas the CBX2.2 patients were undervirilized 46,XY individuals who lived as male, which is
          a difference of sex development rather than a reversal in the usual sense. Recording OBLIGATE
          would let the OMIM series name stand in for an observation.'
        phenotype_term:
          preferred_term: Sex reversal
          term:
            id: HP:0012245
            label: Sex reversal
        diagnostic: true
      selected_evidence:
        snippet: In contrast, our study reveals that in the BALB/C model <30% of mice exhibit sex reversal.
        supports: SUPPORT
