      assertion:
        discussion_id: cbx2_gonadal_tumour_risk
        prompt: What is the gonadal germ-cell tumour risk in CBX2-related 46,XY DSD, and does the presence
          of apparently normal ovarian tissue rather than a streak gonad change it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Gonadectomy
        - phenotypes#Ovarian tissue in an individual with a 46,XY karyotype
        rationale: 'Gonadectomy was performed in both CBX2.2 patients, and prophylactic gonadectomy is
          standard practice in 46,XY gonadal dysgenesis generally because of germ-cell tumour risk. But
          no tumour has been reported in any CBX2 patient, the publications give no malignancy rationale
          for either operation, and with three published patients there is no denominator from which any
          risk estimate could be formed. Importing a percentage from generic 46,XY gonadal dysgenesis
          series would be unsourced inference, and it is specifically unsafe here: those series describe
          streak or dysgenetic gonads, whereas the index CBX2.1 patient had histologically normal ovarian
          tissue, which is not the substrate those risk figures were measured on. This entry therefore
          records gonadectomy as reported management with no attached risk figure, and this gap is why.'
        proposed_experiments:
        - experiment_id: exp_cbx2_gonadal_histology_registry
          name: Systematic gonadal histology and outcome reporting for CBX2 patients
          description: Record gonadal histology, germ-cell tumour markers and follow-up duration for every
            ascertained CBX2 patient in a shared DSD registry, so that a denominator exists before any
            risk-based management recommendation is made.
      selected_evidence:
        snippet: including uterus and histologically normal ovaries
        supports: SUPPORT
