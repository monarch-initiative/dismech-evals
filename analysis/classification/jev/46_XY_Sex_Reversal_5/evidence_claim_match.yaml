        description: 'Molecular confirmation. A dedicated MLPA probe set for CBX2 copy-number change was
          developed for the 47-patient gonadal-DSD screen and is the published means of excluding CBX2
          deletions and duplications, which sequencing alone would miss. That screen found no pathogenic
          CBX2 variant and no copy-number change in any patient, which is also the reason CBX2 testing
          in practice happens as part of a DSD panel or exome rather than as a single-gene test. Isoform
          coverage matters: the CBX2.2 report postdates that screen, so an assay designed only around
          CBX2.1 may not interrogate the short isoform adequately.'
