      assertion:
        discussion_id: cbx2_2_zygosity_and_gene_validity
        prompt: Is the CBX2.2 arm of this entry the same recessive disorder as the CBX2.1 index case,
          given that each CBX2.2 patient is reported as carrying a single distinct variant and the phenotypes
          differ so markedly?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - has_subtypes#CBX2.2
        - inheritance#Autosomal recessive
        rationale: The SRXY5 entity is defined as autosomal recessive on the strength of one double-heterozygous
          CBX2.1 patient. The two CBX2.2 patients are each described as carrying one distinct variant,
          with no second allele reported, and one of the two alleles has a population frequency (ExAC
          minor allele frequency 0.001418) that is high for a fully penetrant recessive DSD allele. Functional
          data are supportive but functional data alone do not establish a mode of inheritance. Working
          against a common-cause interpretation, a dedicated screen of 47 patients with 46,XY or 46,XX
          gonadal DSD found no pathogenic CBX2 variant at all, so there is no independent cohort in which
          the CBX2.2 signal has been replicated. Until the second allele is reported or excluded, grouping
          this arm under SRXY5 is a curation convenience and should not be read as an assertion that the
          two arms share an inheritance mode.
        proposed_experiments:
        - experiment_id: exp_cbx2_2_second_allele
          name: Complete allelic characterization of the reported CBX2.2 patients
          description: Re-analyse the existing exome data with attention to deep intronic, regulatory
            and structural variation at CBX2, plus parental segregation, to determine whether a second
            CBX2 allele is present in either CBX2.2 patient.
        - experiment_id: exp_cbx2_isoform_targeted_cohort_screen
          name: Isoform-resolved CBX2 screening in a large 46,XY DSD cohort
          description: Screen an unsolved 46,XY DSD cohort with coverage and annotation specific to both
            CBX2 isoforms, since the earlier negative screen predates the CBX2.2 report and may not have
            interrogated the short isoform adequately.
      selected_evidence:
        snippet: No pathogenic CBX2 mutation was detected.
        supports: SUPPORT
