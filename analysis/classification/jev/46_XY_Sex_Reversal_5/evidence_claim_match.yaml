      assertion_type: Subtype
      assertion:
        name: CBX2.1
        display_name: CBX2.1 (isoform 1) related, complete female phenotype
        description: 'The originally described and OMIM-defining presentation: a 46,XY individual with
          a completely female phenotype — normal female external genitalia, a uterus, and histologically
          normal ovarian tissue rather than streak gonads. Reported in one girl carrying double-heterozygous
          variants in the long CBX2.1 isoform, whose mutant protein failed to transactivate NR5A1/SF1.
          Because the external phenotype is unremarkable, ascertainment depended on a prenatal karyotype,
          which is why this presentation is expected to be systematically under-detected.'
      selected_evidence:
        snippet: A girl with a prenatal 46,XY karyotype was born with a completely normal female phenotype,
          including uterus and histologically normal ovaries.
        supports: SUPPORT
