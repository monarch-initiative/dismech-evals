      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cbx2_ovarian_derepression_model
        hypothesis_label: CBX2 as a repressor of the ovary-promoting pathway
        status: ALTERNATIVE
        description: The competing account, and the one that fits CBX2's Polycomb identity. Here the primary
          lesion is loss of H3K27me3-mediated repression of ovary-promoting genes, which then block testis
          development; reduced Sry is a consequence rather than the cause. Sex-determining genes are bivalent
          in the bipotential gonad, CBX2 directly binds the Wnt effector Lef1, and deleting Wnt4 rescues
          both Sry expression and testis development in XY Cbx2-null mice.
        notes: 'This is not a refinement of the canonical model but a direct challenge to it: the authors
          explicitly investigated it as the alternative to CBX2 being an activator of Sry. The two models
          are not yet reconciled, and the human data cannot discriminate between them because no human
          CBX2 gonad has been profiled. Curated as ALTERNATIVE rather than CANONICAL because the decisive
          experiment is murine and the human diagnostic assay remains the transactivation one.'
      selected_evidence:
        snippet: Our results suggest that stabilization of the testis fate requires CBX2-mediated repression
          of bivalent ovary-determining genes, which would otherwise block testis development.
        supports: SUPPORT
