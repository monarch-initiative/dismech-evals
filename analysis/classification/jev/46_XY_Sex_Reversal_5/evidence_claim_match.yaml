        status: CANONICAL
        description: 'The model the disorder was originally built on. CBX2 acts, unusually for a Polycomb
          protein, as a positive regulator: PRC1 containing CBX2/M33 binds the NR5A1/SF1 locus directly,
          CBX2-null mouse gonads have reduced Sry and Sox9, forced Sry or Sox9 expression rescues the
          sex reversal, and the human index patient''s mutant CBX2.1 fails to transactivate NR5A1/SF1
          in vitro. On this account the lesion is a failure to switch the male programme on.'
        notes: 'Retained as CANONICAL because it is what the human functional diagnosis rests on: pathogenicity
          of the index patient''s CBX2.1 variants was established by an NR5A1 transactivation assay, not
          by a repression assay.'
      selected_evidence:
        snippet: We show that Sry expression and testis development were rescued in XY Cbx2-/-;Wnt4-/-
          mice.
        supports: REFUTE
