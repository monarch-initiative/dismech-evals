            genes:
            - preferred_term: CBX2
              term:
                id: hgnc:1552
                label: CBX2
            publication: PMID:22200029
            description: 'A second, independently generated Cbx2 null line carrying a different allele
              - deletion of the 5'' untranslated region including the translation start site and the first
              four coding exons - and maintained on BALB/c rather than C57BL/6. It is curated separately
              from the M33cterm line above because the two give materially different phenotypes and the
              paper that characterised this one makes that contrast its central point: fewer than 30%
              of BALB/c nulls are sex-reversed, against a majority on B6. Most affected BALB/c males instead
              have bilateral testicular hypoplasia, which is what makes this line the cleaner one for
              separating the gonadal growth defect from the sex-determination defect. Quoting a rate from
              this line for the B6 line, or the reverse, is a strain error.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Genital Ridge Growth
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: The majority of XY nulls on this background are not sex-reversed and instead have
          bilateral testicular hypoplasia, isolating the gonadal growth phenotype from sex reversal within
          a single line.
        limitations: Gonadal volume in human CBX2 patients has never been measured against a normative
          standard, so the human counterpart of this readout is inferred from non-visualized or atrophic
          gonads rather than measured. The BALB/c background is itself the reason the growth phenotype
          is visible here, so the dissociation may be strain-specific rather than a general property of
          Cbx2 loss.
        readouts:
        - name: Gonadal phenotype in XY nulls on BALB/c
          target: Impaired Genital Ridge Growth
          direction: DECREASED
          interpretation: Bilateral testicular hypoplasia in non-sex-reversed XY nulls is the growth defect
            observed without the confound of sex reversal.
      selected_evidence:
        snippet: In contrast, our study reveals that in the BALB/C model <30% of mice exhibit sex reversal.
        supports: SUPPORT
