        description: An epistasis model rather than a disease model. Removing the ovary-promoting gene
          Wnt4 from a Cbx2-null XY animal restores both Sry expression and testis development, which is
          the decisive experiment behind the alternative ovarian-derepression hypothesis. Its value here
          is that it tests the direction of causation, not that it reproduces the human phenotype - which
          it deliberately does not.
        modeled_mechanisms:
        - target: Loss of CBX2 Repression of the Ovarian Programme
          relationship: RESCUES
          fidelity: MODERATE
          description: Deleting Wnt4 removes the de-repressed ovarian signal and rescues the XY gonad,
            showing that the block to testis development in Cbx2 nulls runs through unopposed ovarian
            determinants.
          limitations: The rescue is genetic and murine. There is no human counterpart, and the experiment
            cannot say which mechanism dominates in a human gonad carrying hypomorphic rather than null
            CBX2 alleles.
          readouts:
          - name: Sry expression and testis development in XY double nulls
            target: Loss of CBX2 Repression of the Ovarian Programme
            direction: RESTORED
            interpretation: Restoration of both the Sry pulse and testis morphogenesis on removing a single
              ovarian determinant is what makes this an epistasis result rather than a modifier effect.
