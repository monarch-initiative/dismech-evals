              label: 46,XY complete gonadal dysgenesis
        context: []
      assertion_type: Treatment
      assertion:
        name: Physiologic pubertal induction and maintenance hormone replacement
        action_category: THERAPEUTIC
        description: Hormone treatment proceeds in parallel with tumor-risk management; it is not contingent
          on waiting until after surgery. Near the expected age of puberty, use low-dose physiologic 17-beta-estradiol
          with gradual individualized escalation; later diagnosis can justify a faster individualized
          induction. If an endometrium-bearing uterine cavity is present, add progestogen to avoid unopposed
          estrogen; with patent outflow, cyclic progesterone is generally introduced after about two years
          of estrogen or first breakthrough bleeding. Obstructed or noncommunicating anatomy requires
          specialist management of the outflow and hormone regimen. Replacement usually continues through
          the expected age of natural menopause, followed by individualized reassessment. Treatment induces
          secondary sexual development and, when anatomy permits, scheduled withdrawal bleeding; it does
          not restore spontaneous menarche or ovulatory menstrual cycles. These regimen details derive
          from broader congenital gonadal-hormone-deficiency guidance and expert practice, not Swyer-specific
          comparative trials.
        treatment_term:
          preferred_term: Hormone Replacement Therapy
          term:
            id: NCIT:C15599
            label: Hormone Replacement Therapy
          therapeutic_agent:
          - preferred_term: estradiol
            term:
              id: CHEBI:23965
              label: estradiol
          - preferred_term: progesterone
            term:
              id: CHEBI:17026
              label: progesterone
        target_phenotypes:
        - preferred_term: Delayed puberty
          term:
            id: HP:0000823
            label: Delayed puberty
