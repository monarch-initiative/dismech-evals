              label: 46,XY complete gonadal dysgenesis
        context: []
      assertion_type: Definition
      assertion:
        name: Classic nonsyndromic 46,XY complete gonadal dysgenesis case definition
        definition_type: CASE_DEFINITION
        description: The modeled disease requires a 46,XY karyotype, typical female external genitalia
          and Müllerian internal structures, absent functional testicular differentiation, and bilateral
          streak or severely dysgenetic gonads.
        scope: This entry models the classic nonsyndromic complete phenotype. Partial or mixed 46,XY gonadal
          dysgenesis, complete androgen insensitivity, androgen synthesis defects, testicular regression
          syndrome without the complete phenotype, and syndromic gonadal dysgenesis are differential diagnoses
          or separate disease entities. Gene-related subtype terms that span partial and complete disease
          are included here only for their complete presentations.
      selected_evidence:
        snippet: Thirty-two patients with hypergonadotropic hypogonadism, streak gonads, internal and
          external female genitalia, and normal karyotype (46,XX or 46,XY)
        supports: SUPPORT
    origin:
