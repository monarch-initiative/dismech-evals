      assertion_type: Pathophysiology
      assertion:
        name: Cell-Type-Specific Transcriptional Dysregulation
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: Patient-derived XYY fibroblasts, iPSCs and neural stem cells show distinct widespread
          transcriptional changes, including autosomal loci. Some signatures overlap XXY cells. Expression
          and enrichment results nominate mechanisms for investigation without demonstrating a specific
          neuronal functional deficit.
        biological_processes:
        - preferred_term: regulation of DNA-templated transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
        notes: The study derives XYY cultures from three patient donors; clone counts are not independent
          patient counts. GO enrichment does not prove altered axon guidance or neuronal migration. Only
          63 differential methylation regions were detected in iPSCs versus 4,197 in fibroblasts, so limited
          methylation changes in iPSCs do not establish methylation independence in every tissue. No causal
          edge to autism or language impairment is asserted from these experiments.
      selected_evidence:
        snippet: The differential expression analysis (DEA) performed on 47,XYY and 46,XY karyotypes identified
          1838, 1789, and 4413 differentially expressed genes (DEGs) in fibroblasts, iPSCs and NSCs, respectively
        supports: SUPPORT
        directness: DIRECT
