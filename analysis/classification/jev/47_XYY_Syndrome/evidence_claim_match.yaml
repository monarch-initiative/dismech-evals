      assertion_type: Treatment
      assertion:
        name: Individualized Fertility Evaluation and Assisted Reproduction
        description: For reproductive difficulty, assess semen parameters and reproductive hormones and
          discuss assisted reproduction where appropriate.
        treatment_term:
          preferred_term: In Vitro Fertilization
          term:
            id: NCIT:C16580
            label: In Vitro Fertilization
        notes: The 36-couple study was nonrandomized, included repeat cycles, had only six conventional-treatment
          couples, and had incomplete pregnancy follow-up. Nonsignificant differences do not establish
          equal success or offspring safety, or that PGT is unnecessary. Five successful micro-TESE retrievals
          in selected azoospermic men do not establish a general 100% retrieval rate. The IVF ontology
          binding and phenotype target describe only the assisted-reproduction component; semen analysis,
          ultrasound and hormone measurements are diagnostic assessments.
      selected_evidence:
        snippet: Men with 47,XYY who are being seen for infertility should receive a semen analysis, testicular
          ultrasound, and bloodwork to measure reproductive hormones.
