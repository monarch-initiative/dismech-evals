      assertion_type: Pathophysiology
      assertion:
        name: UTY-Dependent KDM6A Upregulation
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: In XYY iPSCs, increased KDM6A expression depends in part on UTY. UTY knockout reduces
          KDM6A RNA and protein, whereas UTY overexpression increases KDM6A in male embryonic stem cells.
          Equivalent induction was not observed in the tested female cell line.
        genes:
        - preferred_term: UTY
          term:
            id: hgnc:12638
            label: UTY
        - preferred_term: KDM6A
          term:
            id: hgnc:12637
            label: KDM6A
        notes: The molecular dependency is experimentally supported in cultured cells. The study does
          not establish changed histone-demethylase activity, a direct promoter interaction, clinical
          causation, or therapeutic rescue. UTY siRNA cross-reacted with KDM6A, so the CRISPR and overexpression
          experiments are the stronger support.
      selected_evidence:
        snippet: KDM6A mRNAs and protein levels were significantly decreased in multiple 47,XYY UTY−/−
          iPSC clones
        supports: SUPPORT
        directness: DIRECT
