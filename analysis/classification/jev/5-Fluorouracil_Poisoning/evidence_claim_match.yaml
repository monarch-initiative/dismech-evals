              label: 5-fluorouracil poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Thymidylate Synthase Inhibition
        description: FdUMP forms a stable ternary complex with thymidylate synthase and the folate cofactor
          5,10-methylenetetrahydrofolate, blocking de novo synthesis of dTMP. The resulting dTTP depletion
          and nucleotide-pool imbalance drive uracil misincorporation, futile excision-repair cycling
          and DNA strand breaks ("thymineless death"). Thymidylate synthase is the sole de novo source
          of thymidylate and the principal target of 5-FU.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: TYMS catalyzes methylation of dUMP to dTMP. As the sole de novo source of thymidylate
          in the cell it is an important target for 5-flurouracil (5-FU) and capecitabine (CAP).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
