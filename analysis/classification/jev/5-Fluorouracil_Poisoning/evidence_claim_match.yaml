      assertion_type: Pathophysiology
      assertion:
        name: Deficient DPD-Mediated Catabolism
        description: Dihydropyrimidine dehydrogenase (DPD) is the initial and rate-limiting enzyme of
          pyrimidine catabolism and clears the large majority of administered 5-FU to inactive dihydrofluorouracil.
          Partial or complete DPD deficiency, usually from DPYD variants, markedly raises and prolongs
          5-FU exposure so that a standard dose behaves as an overdose and shunts more drug into the anabolic
          pathway.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: DPYD, the gene encoding dihydropyrimidine dehydrogenase (DPD), the rate-limiting enzyme
          for fluoropyrimidine catabolism
        supports: SUPPORT
