      assertion_type: Pathophysiology
      assertion:
        name: Myocardial Toxicity
        description: 5-FU and its fluorinated catabolites injure the myocardium, producing myocardial
          ischaemia through proposed mechanisms including coronary artery spasm, endothelial injury with
          thrombosis, and oxidative energetic failure of cardiomyocytes. No single mechanism is established.
        biological_scale: TISSUE
      selected_evidence:
        snippet: 'the proposed mechanisms are: endothelial injury followed by thrombosis, increased metabolism
          leading to energy depletion and ischemia, oxidative stress causing cellular damage, coronary
          artery spasm leading to myocardial ischemia and diminished ability of RBCs to transfer oxygen
          resulting in myocardial ischemia.'
        supports: SUPPORT
