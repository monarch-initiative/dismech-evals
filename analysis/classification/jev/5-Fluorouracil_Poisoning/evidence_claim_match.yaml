        - preferred_term: Lactate
          term:
            id: LOINC:2524-7
            label: Lactate [Moles/volume] in Serum or Plasma
        notes: 'LOINC:1841-6 is bound specifically to Serum rather than Plasma: LOINC has no combined
          Serum-or-Plasma ammonia code (ammonia assays are frequently specimen-sensitive, which may be
          why), and this row''s own name specifies serum ammonia. Lactate is bound to the method-less
          Serum-or-Plasma code.'
      selected_evidence:
        snippet: found to have hyperammonemia (84 mcmol/L), without hepatic failure
        supports: SUPPORT
