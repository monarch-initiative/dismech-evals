      assertion:
        name: Serum ammonia and lactate in acute neurotoxicity
        description: When a patient on 5-FU develops acute encephalopathy, serum ammonia (with lactate)
          identifies 5-FU hyperammonaemic encephalopathy, which occurs without hepatic failure, and separates
          it from other causes of altered mental status.
        measurements:
        - preferred_term: Serum ammonia
          term:
            id: LOINC:1841-6
