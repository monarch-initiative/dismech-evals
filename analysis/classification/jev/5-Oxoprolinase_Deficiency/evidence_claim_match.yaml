      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acquired drug-related pyroglutamic acidosis
        description: 'Acquired 5-oxoproline accumulation usually presents as severe high-anion-gap metabolic
          acidosis in an adult exposed to paracetamol, sometimes with a beta-lactamase-resistant penicillin
          or vigabatrin. Undernutrition, alcohol-use disorder, kidney disease, and infection are common
          predisposing contexts.

          '
        distinguishing_features:
        - Recent or prolonged paracetamol exposure
        - Flucloxacillin or another beta-lactamase-resistant penicillin, or vigabatrin exposure
        - Adult onset with severe high-anion-gap metabolic acidosis
        - Undernutrition, alcohol-use disorder, kidney disease, or active infection
        - Improvement after removal of the acquired trigger rather than recessive OPLAH segregation
      selected_evidence:
        snippet: At least 92% of patients were on paracetamol therapy for >10 days at an appropriate dose,
          32% on a β-lactamase-resistant penicillin, and 2.3% on vigabatrin.
        supports: SUPPORT
