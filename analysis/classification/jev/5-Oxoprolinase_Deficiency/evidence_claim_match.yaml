  2a99d3e6378acca12d22d1613b3899b7a44b1b10d4c0727be4b50828335a1504:
    claim:
      about:
        disease:
          name: 5-Oxoprolinase Deficiency
          disease_term:
            preferred_term: 5-oxoprolinase deficiency
            term:
              id: MONDO:0009825
              label: 5-oxoprolinase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_oplah_clinical_pathogenicity
        prompt: 'Does biallelic OPLAH deficiency cause a reproducible clinical syndrome, or is it primarily
          a biochemical trait that can be incidental to neurologic and systemic disease?

          '
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#5-oxo-L-proline accumulation and urinary excretion
        - phenotypes#Delayed speech and language development
        - phenotypes#Seizure
        rationale: 'The enzyme defect, recessive segregation, and persistent 5-oxoprolinuria are established.
          Earlier molecular reports describe benign courses, and the largest family series found nonsegregation
          of clinical findings. Recent case reports argue for epilepsy, developmental abnormalities, growth
          retardation, and neuroimaging changes, but remain vulnerable to ascertainment bias, circular
          phenotype-based variant interpretation, and alternative diagnoses. Until this is resolved, the
          causal graph stops at the biochemical phenotype and clinical observations are marked PARTIAL
          without frequency assignments.

          '
        proposed_experiments:
        - experiment_id: exp_oplah_genotype_first_natural_history
          name: Prospective genotype-first OPLAH natural-history cohort
          description: 'Ascertain biallelic OPLAH carriers without selecting for neurologic disease, quantify
            urinary and plasma 5-oxoproline longitudinally, and use standardized developmental, neurologic,
            renal, hematologic, and gastrointestinal assessments against matched controls.

            '
        - experiment_id: exp_oplah_intrafamilial_segregation
          name: Intrafamilial genotype-metabolite-phenotype segregation
          description: 'Study symptomatic and asymptomatic relatives with the same OPLAH genotypes, using
            quantitative metabolomics and genome-wide testing for second diagnoses or modifiers.

            '
        - experiment_id: exp_oplah_neuronal_causality
          name: Human neuronal OPLAH loss-and-rescue model
          description: 'Compare OPLAH-deficient and isogenic rescued human neuronal cells or organoids
            for 5-oxoproline accumulation, electrophysiology, myelination-related readouts, cell stress,
            and dose-response to exogenous 5-oxoproline.

            '
        notes: 'Expert review is tracked in https://github.com/monarch-initiative/dismech/issues/6615.

          '
      selected_evidence:
        snippet: The present findings give evidence that 5-oxoprolinase deficiency is not associated with
          a distinct morbid phenotype.
        supports: SUPPORT
