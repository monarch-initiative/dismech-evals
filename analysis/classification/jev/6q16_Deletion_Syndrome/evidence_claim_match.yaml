        name: SIM1-sparing POU3F2-containing 6q16.1 deletions
        description: Small overlapping intervals include POU3F2 and FBXL4 while sparing SIM1. Developmental
          impairment and later hyperphagia or obesity overlap the SIM1-associated phenotype, but individual
          children can remain nonobese.
