        phase: Variable developmental and growth trajectories
        notes: Developmental difficulties can present in infancy, while hyperphagia and obesity may emerge
          later. Neither an obligatory early obesity phase nor a uniform progressive neurological course
          is established. A child with a POU3F2-containing deletion remained nonobese at five years despite
          persistent language delay.
