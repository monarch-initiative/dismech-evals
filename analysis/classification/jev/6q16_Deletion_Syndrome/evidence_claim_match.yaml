            preferred_term: 6q16 deletion syndrome
            term:
              id: MONDO:0015749
              label: 6q16 deletion syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: del6q16_interval_and_ascertainment
        kind: KNOWLEDGE_GAP
        prompt: How do gene content, age and additional genetic findings modify the phenotype?
        rationale: Intervals vary and some reported patients carry additional CNVs or large deletions.
          The 2015 series has inconsistent obesity totals between narrative and tables and includes a
          fetus among SIM1 deletions; the quoted 8/13 is not used as a penetrance estimate. The EPHA7
          cohort includes unaffected transmitting parents and two severe cases with substantial alternative
          genetic contributions. These sources support qualitative variability rather than disease-wide
          frequency bands.
        attaches_to:
        - pathophysiology#Heterozygous 6q16 Deletion
        - genetic#EPHA7
      selected_evidence:
        snippet: The deletions were inherited in nine out of 12 patients, suggesting variable expressivity
          and incomplete penetrance.
        supports: SUPPORT
        directness: DIRECT
