            term:
              id: MONDO:0019876
              label: 8p inverted duplication/deletion syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: invdupdel8p_clinical_evidence_scope
        prompt: How should heterogeneous cohorts and proposed care guidance be interpreted?
        rationale: 'The main clinical sources represent selected cohorts: Okur includes 49 recurrent invdupdel
          cases within 102 individuals with several 8p rearrangements; Vibert includes 33 postnatal cases
          and three fetuses, with five relatives; Santucci includes 14 invdupdel cases within a 24-person
          mixed clinic. Their denominators are not pooled. Proposed management recommendations were not
          evaluated for efficacy. Internal aggregate MRI and cardiac counts in the Santucci table do not
          reconcile, so those pooled rates are not used. The prenatal 2025 series includes an inherited
          interstitial-deletion case retaining the terminal 8p segment; its apparently unaffected five-year
          outcome is not generalized to classic terminal-deletion invdupdel. The eight-case Yurchenko
          series also reports different seizure and cardiac observations from the larger cohorts, illustrating
          selection and age effects rather than defining an invariant phenotype.'
      selected_evidence:
        snippet: the shared deleted interval in individuals with invdupdel(8p) was the most distal 6.7
          Mb and the shared duplicated interval was approximately 11.1 Mb.
        supports: SUPPORT
        directness: DIRECT
