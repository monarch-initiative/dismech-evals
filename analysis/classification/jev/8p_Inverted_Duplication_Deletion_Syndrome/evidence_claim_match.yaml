      assertion_type: Subtype
      assertion:
        name: Complex invdupdel(8p) with captured additional chromosomal material
        description: A rearranged 8p end may contain material from another chromosome arm. Buysse characterized
          an additional 8q gain; that extra imbalance can modify the phenotype and should not be pooled
          with uncomplicated invdupdel cohorts.
      selected_evidence:
        snippet: By high resolution oligo array CGH, we detected the smallest inverted duplication of
          8p reported thus far, with additional duplication of 8q24.13/qter on the short arm of the abnormal
          chromosome 8 (Figs. 1 and 2 A and B).
        supports: SUPPORT
        directness: DIRECT
