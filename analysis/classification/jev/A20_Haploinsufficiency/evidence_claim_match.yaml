      assertion:
        name: A20 myeloid-specific knockout mouse
        species: Mouse
        genotype: Tnfaip3 fl/fl LysM-Cre (A20 myel-KO)
        publication: PMID:25043000
        description: A conditional knockout deleting A20 in the myeloid lineage. It is the source of the
          inflammasome arm modelled in this entry, and it is a poor genetic match for the human disease,
          which is why that arm is graded HYPOTHETICAL.
        modeled_mechanisms:
        - target: Inflammasome Derepression
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Demonstrates that losing A20 derepresses the NLRP3 inflammasome and produces spontaneous
            arthritis that does not require TNF receptor 1, which is the evidence for a second arm beyond
            NF-kappa-B.
          limitations: Three mismatches against the human disease, and they run in the same direction.
            The mouse is a complete knockout, not haploinsufficiency. It is restricted to the myeloid
            lineage rather than germline. And the arthritis it produces is erosive, whereas the arthritis
            in this disease is typically nonerosive. The model therefore supports the existence of the
            pathway rather than its operation in patients.
      selected_evidence:
        snippet: Myeloid-cell-specific deletion of the rheumatoid arthritis susceptibility gene A20/Tnfaip3
          in mice (A20(myel-KO) mice) triggers a spontaneous erosive polyarthritis that resembles rheumatoid
          arthritis in patients.
        supports: SUPPORT
