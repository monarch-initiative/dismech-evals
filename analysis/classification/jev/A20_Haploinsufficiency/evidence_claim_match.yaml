        variant_origin: GERMLINE
        association: Heterozygous Loss of Function
        notes: True haploinsufficiency. Nonsense variants, missense variants and whole-gene deletions
          all cause the disease, and a 236 kb deletion removing TNFAIP3 entirely produces the same phenotype
          as a point mutation. That argues the mechanism is gene dosage rather than a dominant negative
          or gain-of-function protein. Missense alleles require functional demonstration before they can
          be called causal, which is what the NF-kappa-B reporter work in patient cells provides.
      selected_evidence:
        snippet: We identified c.1434C>A:p.(Cys478*) in one family and a 236 kb deletion at 6q23.3 containing
          TNFAIP3 in another family.
