      assertion_type: EpidemiologyInfo
      assertion:
        name: Manifestation frequencies
        description: In the largest synthesis, recurrent oral and genital ulcers occur in more than 70%,
          recurrent fevers in about 50%, skin involvement and gastrointestinal disease in about 40% each,
          and arthralgia or arthritis in about 34%.
      selected_evidence:
        snippet: 'The most common manifestations and their frequency include: (1) recurrent painful oral/genital
          ulcers, typically during disease flares (>70% of persons); (2) recurrent fevers (~50%), typically
          lasting for three to seven days that can rarely progress to a cytokine storm and/or hemophagocytic
          lymphohistiocytosis; (3) skin involvement (~40%), including pustular rashes, folliculitis, vasculitic
          purpura, urticaria, lupus-like macular rashes, and eczematoid dermatitis; (4) gastrointestinal
          disease (~40%), ranging from dull abdominal pain (due to serositis, ulcers, or bowel inflammation)
          to severe inflammation with risk of bowel perforation; and (5) arthralgia/arthritis (~34%),
          typically relapsing and/or remitting nonerosive inflammatory polyarthritis with synovitis, and
          rarely resembling rheumatoid arthritis or psoriatic-like erosions.'
        supports: SUPPORT
