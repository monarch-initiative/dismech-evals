          modifier: DECREASED
          term:
            id: GO:0043124
            label: negative regulation of canonical NF-kappaB signal transduction
      selected_evidence:
        snippet: Therefore, to keep the inflammatory response in check, elaborate negative regulatory
          mechanisms operate to terminate NF-κB activation at multiple levels by de novo synthesis of
          NF-κB inhibitory proteins, and orchestration of protein ubiquitination and deubiquitination.
        supports: SUPPORT
