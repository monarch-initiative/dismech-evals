      assertion:
        name: SAA Proteolytic Cleavage
        description: AA deposits contain truncated SAA species, and MMP-1 cleaves SAA isoforms differently
          in vitro. These observations do not establish that MMP-1 is the relevant human enzyme or that
          cleavage must precede fibril assembly.
        role: amplifier
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: proteolysis
          term:
            id: GO:0006508
            label: proteolysis
        notes: This node is deliberately not joined to the SAA(1–76) conformational assay. MMP-1 cleavage
          at residue 57 and synthetic truncation at residue 76 are different experimental perturbations;
          neither establishes an obligatory cleavage-before-fibril sequence in tissue.
      selected_evidence:
        snippet: We found that SAA1.5 is more resistant to degradation by MMP-1 than SAA1.1. This difference
          is caused by the capacity of MMP-1 to cleave at the site of the polymorphism at position 57.
        supports: SUPPORT
        directness: DIRECT
