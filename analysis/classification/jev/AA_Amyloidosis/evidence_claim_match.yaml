        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Systemic AL Amyloidosis
        description: AL amyloid derives from immunoglobulin light chains, whereas AA derives from SAA.
          Tissue precursor typing is essential because management differs. Renal-predominant presentation
          and an inflammatory history can suggest AA but do not establish its type.
        disease_term:
          preferred_term: primary systemic amyloidosis
          term:
            id: MONDO:0017816
            label: primary systemic amyloidosis
        distinguishing_features:
        - AA usually has dominant renal involvement; clinically important cardiac involvement is less
          typical but can occur.
        - Light-chain restriction supports AL, while negative immunofluorescence suggests a non-AL type;
          definitive typing remains necessary.
      selected_evidence:
        snippet: The detection of Congo red positive deposits coupled with negative immunofluorescence
          studies is highly suggestive of non-AL amyloidosis.
        supports: SUPPORT
        directness: DIRECT
    origin:
