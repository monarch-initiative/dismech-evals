              id: MONDO:0019439
              label: AA amyloidosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: saa_threshold_vs_deposition_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Why do only a minority of patients with equivalently sustained, equivalently high SAA
          concentrations develop AA amyloidosis?
        rationale: Persistent SAA elevation, common coding alleles, inflammation and cofactors do not
          fully predict deposition. The rare promoter variant illustrates a supply mechanism, while cell-free
          cleavage and fibril assays suggest additional contributors. Their relative effects in patients
          remain unresolved.
        attaches_to:
        - pathophysiology#SAA Amyloid Fibril Assembly
        status: OPEN
        proposed_experiments:
        - experiment_id: exp_aa_matched_saa_exposure_genotype_cohort
          name: Prospective cohort with matched cumulative SAA exposure stratified by SAA1 genotype
          description: Follow inflammatory-disease patients with serial SAA, genotype and prospectively
            assessed amyloid outcomes. Model cumulative measured exposure and relevant confounders. A
            genotype association after adjustment would motivate direct functional studies but cannot
            by itself distinguish processing, tissue exposure, clearance or residual confounding.
          supporting_outcome:
          - A reproducible genotype association after measured-SAA adjustment supports additional genotype-linked
            risk, without locating its molecular mediator.
          refuting_outcome:
          - A sufficiently precise null limits the detectable genotype effect in this population, but
            does not exclude smaller effects or inadequately measured exposure.
        - experiment_id: exp_aa_pre_clinical_seed_detection
          name: Detection of endogenous nucleating seed before clinically apparent deposition
          description: Apply high-sensitivity amyloid-seeding assays to accessible tissue (fat aspirate,
            minor salivary gland) from patients with sustained high SAA but no clinical amyloidosis, to
            test whether a subclinical nucleating seed precedes and predicts overt disease.
          supporting_outcome:
          - Prediagnostic seeding activity associated with future disease supports its predictive relevance;
            it does not by itself establish that seeding is rate-limiting.
          refuting_outcome:
          - Absence of detectable seeding activity in patients who subsequently develop amyloidosis would
            argue against a detectable pre-clinical seed.
      selected_evidence:
        snippet: A chronically high plasma concentration of SAA results in the aggregation of amyloid
          into cross-β-sheet fibrillar deposits by mechanisms not fully understood.
        supports: SUPPORT
        directness: DIRECT
    origin:
