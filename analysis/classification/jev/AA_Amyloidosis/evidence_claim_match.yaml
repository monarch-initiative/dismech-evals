        description: A small molecule intended to interfere with amyloid–glycosaminoglycan interactions.
          In the initial 183-patient randomized trial, the 24-month worsening proportions were 27% versus
          40% (P=.06), while the prespecified time-to-event analysis favored eprodisate (HR 0.58, P=.02).
          Neither end-stage kidney disease nor mortality improved significantly, and there was no proteinuria
          or amyloid-load benefit. The 261-patient confirmatory trial failed its different renal composite
          endpoint (HR 1.0, 95% CI 0.7–1.4; P=.882 in 260 treated participants). These findings do not
          establish a clinically effective AA therapy.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: At 24 months, disease was worsened in 24 of 89 patients who received eprodisate (27%)
          and 38 of 94 patients given placebo (40%, P=0.06); the hazard ratio for worsening disease with
          eprodisate treatment was 0.58 (95% confidence interval, 0.37 to 0.93; P=0.02).
        supports: SUPPORT
        directness: DIRECT
