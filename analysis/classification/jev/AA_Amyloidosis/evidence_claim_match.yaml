      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_saa_overproduction
        hypothesis_label: Canonical SAA Overproduction Model
        status: CANONICAL
        description: In the common inflammation-associated pathway, cytokines stimulate hepatic SAA production.
          Persistent circulating precursor supplies fibril assembly; lower serial SAA concentrations are
          associated with amyloid regression and better renal and survival outcomes. Adipose production
          and the rare hereditary SAA1 promoter mechanism provide additional routes to elevated SAA.
      selected_evidence:
        snippet: In AA amyloidosis, the expression of cytokines, particularly interleukin 6, leads to
          overproduction of serum amyloid A (SAA) by the liver. A chronically high plasma concentration
          of SAA results in the aggregation of amyloid into cross-β-sheet fibrillar deposits by mechanisms
          not fully understood.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
