        description: Colchicine controls FMF inflammation and reduces the risk of AA amyloidosis. In established
          FMF-associated renal AA, observational studies report stabilization or proteinuria regression
          in some patients, with worse outcomes when renal injury is advanced. The historical dose and
          creatinine associations are not universal modern prescribing thresholds; dosing requires individual
          assessment of renal function, tolerance and interactions.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: colchicine
            term:
              id: CHEBI:23359
              label: colchicine
      selected_evidence:
        snippet: In a study examining 960 patients with FMF without evidence of amyloidosis at baseline,
          the cumulative rate of proteinuria after 11 years was reported as 1.7% in colchicine-compliant
          patients while 48.9% in the non-compliants
        supports: SUPPORT
        directness: DIRECT
