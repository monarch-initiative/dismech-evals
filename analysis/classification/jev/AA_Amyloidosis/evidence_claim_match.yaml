        context: []
      assertion_type: AnimalModel
      assertion:
        name: Heterologous fibril acceleration of murine AA deposition
        species: Mus musculus
        genotype: Non-transgenic NMRI and FVB mice
        category: Induced (non-transgenic) AA amyloidosis model
        description: Five- to ten-week-old female NMRI mice and age-matched FVB mice of both sexes were
          studied. Heterologous silk, Sup35 or curli preparations were injected with a silver-nitrate
          inflammatory challenge; matched vehicle and nonamyloid actin controls also received the challenge.
          Splenic AA deposition was evaluated after 16 days using blinded Congo-red microscopy and immunohistochemistry.
          In the FVB Sup35 experiment, 10/12 seeded mice had deposits versus 2/11 controls with minimal
          deposits; results varied across preparations and strains. This tests experimental cross-seeding,
          not live bacterial infection, oral transmission or environmental risk in humans.
        modeled_mechanisms:
        - target: SAA Amyloid Fibril Assembly
          relationship: PERTURBS
          fidelity: LOW
          description: Heterologous fibrils accelerate splenic AA deposition during an inflammatory challenge,
            supporting an in vivo seeding contribution to assembly.
          limitations: This induced model does not establish spontaneous clinical latency, human environmental
            transmission, systemic clinical organ failure or therapeutic rescue. Splenic deposits are
            an endpoint of assembly and accumulation, not a direct kinetic measurement of molecular nucleation.
            Separate Sup35-variant results were not significantly different.
          readouts:
          - name: Splenic AA deposition after Sup35 seeding
            target: SAA Amyloid Fibril Assembly
            direction: INCREASED
            interpretation: At day 16, deposits were found in 10/12 FVB mice given Sup35 versus minimal
              deposits in 2/11 vehicle controls; both groups received an inflammatory challenge. The study
              does not demonstrate clinical renal benefit or rescue.
          divergences:
          - divergence_type: PROXY_QUANTITY
            description: Splenic deposits measured after 16 days reflect assembly and accumulation; they
              do not directly quantify the kinetics of molecular SAA nucleation.
          - divergence_type: SPECIES_MISMATCH
            description: Injected heterologous fibrils with an inflammatory challenge in NMRI/FVB mice
              do not establish human environmental transmission or spontaneous clinical organ failure.
      selected_evidence:
        snippet: 'We studied three such naturally occurring protein fibrils: silk from Bombyx mori, Sup35
          from Saccharomyces cerevisiae, and curli from Escherichia coli.'
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
