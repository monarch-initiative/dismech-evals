        name: Miridesap followed by dezamizumab (Investigational)
        description: SAP depletion followed by anti-SAP antibody was tested in mixed systemic amyloidosis.
          The 23-person phase 1 extension included two AA participants, each receiving only one dose;
          one had lower renal amyloid burden on scintigraphy, without demonstrated renal-function or proteinuria
          improvement through day 42. Neither AA participant had liver deposits. Later cardiac studies
          enrolled no AA participants and were stopped for lack of efficacy and a serious vasculitis event.
          These data do not establish routine AA use or an AA-specific contraindication.
      selected_evidence:
        snippet: Renal function, serum creatinine and urea concentrations, and urinary protein excretion
          were unchanged in all subjects up to day 42
