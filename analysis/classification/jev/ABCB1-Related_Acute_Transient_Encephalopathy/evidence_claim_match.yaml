      assertion:
        name: Avoidance of P-glycoprotein Substrate Drugs
        description: 'Withholding P-glycoprotein substrate drugs, ivermectin in particular, removes the
          one precipitant shown to produce an episode in a patient with this genotype. This is an inference
          from the reported case and from the transporter''s role, not a tested intervention: no study
          has measured episode frequency with and without substrate exposure.'
        treatment_term:
          preferred_term: avoidance of P-glycoprotein substrate drugs
          term:
            id: NCIT:C15843
            label: Preventive Intervention
        therapeutic_modality: BEHAVIORAL
        notes: The index report raises the adjacent clinical point without testing it, noting that unexpected
          central nervous system drug effects could emerge in conditions such as severe infection, pregnancy
          or surgery. That is a caution about any substrate, recorded here rather than expanded into a
          drug list this disorder's literature does not contain.
      selected_evidence:
        snippet: Definitive human evidence has established that loss-of-function mutations in ABCB1 can
          precipitate profound ivermectin neurotoxicity even at standard doses
        supports: SUPPORT
        directness: INDIRECT
