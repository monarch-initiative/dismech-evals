    claim:
      about:
        disease:
          name: ABCB1-Related Acute Transient Encephalopathy
          disease_term:
            preferred_term: acute transient encephalopathy
            term:
              id: MONDO:0975801
              label: encephalopathy, acute transient
        context: []
      assertion_type: Environmental
      assertion:
        name: Exposure to ivermectin at a therapeutic dose
        presence: PRESENT
        description: Ivermectin is a P-glycoprotein substrate whose entry into the brain is normally restrained
          by barrier efflux. In an individual with biallelic ABCB1 loss of function a single prophylactic
          dose inside the ordinary therapeutic range was followed by coma and focal deficits, with full
          recovery on supportive care. The exposure is recorded as a trigger of the substrate-accumulation
          step rather than as the disease itself.
        exposure_term:
          preferred_term: exposure to ivermectin
          term:
            id: ECTO:9002436
            label: exposure to ivermectin
        notes: 'The index family is the counter-case and is recorded as such: the authors reviewed those
          patients'' medication histories and found no drug consistently associated with an episode, so
          a substrate exposure is one route to an episode and not a requirement for one. The wider list
          of P-glycoprotein substrates and inhibitors is not transcribed here, because only ivermectin
          has been reported to precipitate an episode in a patient with this genotype.'
      selected_evidence:
        snippet: Loss of transporter activity resulted in impaired drug extrusion from endothelial cells
          of the barrier and excessive CNS exposure, explaining the unexpected severity of toxicity despite
          therapeutic dosing.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
