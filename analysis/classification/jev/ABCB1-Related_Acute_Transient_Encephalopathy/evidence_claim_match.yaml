  dbf8c5f9f6f2a76375dac422984421722fbf772a3070be0119d4ba6b7cd1caf0:
    claim:
      about:
        disease:
          name: ABCB1-Related Acute Transient Encephalopathy
          disease_term:
            preferred_term: acute transient encephalopathy
            term:
              id: MONDO:0975801
              label: encephalopathy, acute transient
        context: []
      assertion_type: Genetic
      assertion:
        name: ABCB1
        gene_term:
          preferred_term: ABCB1
          term:
            id: hgnc:40
            label: ABCB1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'ABCB1 encodes P-glycoprotein, an ATP-dependent efflux transporter. Both reported genotypes
          are biallelic and inactivating: a nonsense allele with a splice-donor allele in the index twins,
          and two nonsense alleles in the ivermectin-exposed boy. No gene-disease validity classification
          has been published for this pair by ClinGen or another external body, so no assertion is recorded;
          the basis for calling it causative is two independent families with concordant genotypes plus
          the functional demonstration of lost brain efflux in the index patients. The index twins retained
          roughly a tenth of wild-type transcript rather than none, so the human disorder is a severe
          hypomorphic state rather than a demonstrated complete null. That matters for interpreting the
          episodic course: a residual transporter pool is consistent with a threshold being crossed only
          under an added load.'
        variants:
        - name: p.Pro1182X
          description: Nonsense allele in the index twin family, inherited from the father.
          clinical_significance: PATHOGENIC
        - name: c.2786+1G>T
          description: Splice-donor allele near exon 23 in the index twin family. Amplicon sequencing
            of patient-derived lymphocyte transcripts found the variant drove an 11-base-pair deletion,
            exon skipping and intron retention, all frameshifting or truncating.
          clinical_significance: PATHOGENIC
        - name: p.Arg794Ter
          description: Nonsense allele in the second reported family, carried in trans with p.Ile1018ThrfsTer8
            by a boy who developed coma after a therapeutic dose of ivermectin.
          clinical_significance: PATHOGENIC
        - name: p.Ile1018ThrfsTer8
          description: Frameshift allele in the second reported family, carried in trans with p.Arg794Ter.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: the sisters are likely to express a small portion of wild-type protein (~10%)
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
