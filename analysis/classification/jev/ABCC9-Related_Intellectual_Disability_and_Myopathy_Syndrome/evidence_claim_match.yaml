  9ac5b6b8a3f3b758e6d506b925a0f7e58bdde5db5d22803469e4b2cb0e92d316:
    claim:
      about:
        disease:
          name: ABCC9-Related Intellectual Disability and Myopathy Syndrome
          disease_term:
            preferred_term: ABCC9-related intellectual disability and myopathy syndrome
            term:
              id: MONDO:0859224
              label: intellectual disability and myopathy syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Heterozygous ABCC9 loss-of-function cardiac phenotypes
        description: 'A cluster of monoallelic ABCC9 loss-of-function associations - dilated cardiomyopathy,
          Brugada and early repolarization syndromes, and idiopathic ventricular fibrillation - reported
          in adults with no intellectual disability, no myopathy and no white matter disease. These share
          both the gene and the direction of effect with AIMS, which makes them the subtlest confusion
          in the ABCC9 literature: a paper titled "loss-of-function ABCC9 variant" may be describing a
          heterozygous adult arrhythmia case, not AIMS. Zygosity is the discriminator. AIMS carriers in
          the published families have no conserved clinical pathology.'
        distinguishing_features:
        - Monoallelic (heterozygous) ABCC9 loss of function, versus the biallelic state required for AIMS
        - Isolated cardiac presentation in adults - arrhythmia or cardiomyopathy - without intellectual
          disability, myopathy or white matter disease
        - AIMS heterozygous parents show no conserved clinical pathology, so these associations are not
          simply the AIMS carrier state
        - Some of the reported alleles sit in the SUR2A-specific exon, a cardiac-restricted isoform region
        notes: 'Deliberately left unbound. There is no single MONDO term for "heterozygous ABCC9 loss-of-function
          cardiac phenotype": the reported associations span dilated cardiomyopathy, Brugada syndrome,
          early repolarization syndrome and idiopathic ventricular fibrillation, and binding any one of
          those general disease terms would misrepresent the group and would also bind a term whose gene
          attribution is not ABCC9-specific. The dismech entries Dilated_Cardiomyopathy and Familial_Atrial_Fibrillation
          already carry the ABCC9 heterozygous-cardiac material in their own gene sections; this differential
          exists to keep that literature out of the AIMS phenotype set, not to duplicate it.'
      selected_evidence:
        snippet: The loss-of-function mutations in the ABCC9 gene were associated with the Brugada syndrome,
          early repolarization syndrome, and dilated cardiomyopathy.
        supports: SUPPORT
