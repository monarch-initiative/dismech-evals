  0a1dea699c45587c5619116557d4791ab7a5d9e1c62ec10182792c9762e08ca1:
    claim:
      about:
        disease:
          name: ABCC9-Related Intellectual Disability and Myopathy Syndrome
          disease_term:
            preferred_term: ABCC9-related intellectual disability and myopathy syndrome
            term:
              id: MONDO:0859224
              label: intellectual disability and myopathy syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: aims_id_anxiety_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why do SUR2-null mice show no learning, memory or anxiety phenotype when intellectual
          disability and anxiety are defining features of AIMS in humans, and does that mean the murine
          model cannot be used to study the cognitive arm of the disease?
        attaches_to:
        - pathophysiology#Intellectual Disability and Developmental Delay
        rationale: 'This is a model-evidence-exists-and-is-negative situation, not an absence of data.
          The SUR2-STOP mouse was formally tested for spatial learning and memory in a Morris water maze
          and for anxiety-like behaviour in an elevated plus maze and was negative on both, while every
          human patient tested has intellectual disability and several have anxiety. The original authors
          also note that it is not obvious how myocyte KATP dysfunction could produce intellectual disability
          at all, and that neuronal KATP channels are predominantly Kir6.2/SUR1 rather than SUR2-containing.
          Together these make the cognitive arm the least secure part of the AIMS mechanism: either the
          murine assays are too coarse for a mild human intellectual disability, or the human cognitive
          phenotype is mediated by something (most plausibly the cerebrovascular route) that the mouse
          does not reproduce.'
        proposed_experiments:
        - experiment_id: exp_aims_mouse_working_memory
          name: Higher-sensitivity cognitive phenotyping of SUR2-null mice
          description: Test SUR2-null mice with working-memory and fear-conditioning paradigms rather
            than the Morris water maze alone, on the hypothesis that a mild human intellectual disability
            may be below the resolution of standard spatial-learning assays.
        - experiment_id: exp_aims_knockin_human_allele
          name: Knock-in mouse carrying an actual human AIMS allele
          description: Generate a mouse carrying a human AIMS variant rather than an independently engineered
            premature stop, so that the model's genetic lesion matches the patients' and residual-protein
            effects are preserved.
        - experiment_id: exp_aims_human_cbf_measurement
          name: Direct cerebral blood flow and neurovascular coupling measurement in AIMS patients
          description: Measure resting cerebral perfusion and task-evoked neurovascular coupling (arterial
            spin labelling, BOLD reactivity) in genotyped AIMS patients against controls, to test the
            cerebrovascular hypothesis directly in the species that actually has the cognitive phenotype.
      selected_evidence:
        snippet: and there are no reports of cognitive impairment in previous SUR2 mutant animal models.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31575858
      reference_title: ABCC9-related Intellectual disability Myopathy Syndrome is a K(ATP) channelopathy
        with loss-of-function mutations in ABCC9.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors state, in the same sentence, both that the route from channel loss to intellectual
        disability is not obvious and that no earlier SUR2 mutant animal model showed cognitive impairment.
