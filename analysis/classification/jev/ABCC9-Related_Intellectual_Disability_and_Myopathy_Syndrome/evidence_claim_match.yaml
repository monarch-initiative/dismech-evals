      assertion:
        name: Periventricular leukomalacia of perinatal hypoxic-ischaemic origin
        description: The most recent AIMS cohort describes its white matter abnormalities as resembling
          periventricular leukomalacia, making acquired perinatal injury an important radiological differential.
          AIMS is distinguished by its biallelic ABCC9 loss-of-function cause and accompanying myopathic
          phenotype; pregnancy and birth were uneventful in a documented index patient.
        distinguishing_features:
        - Acquired perinatal insult typically has a relevant perinatal history, whereas a documented AIMS
          index patient had an uneventful pregnancy and birth
        - Acquired perinatal leukomalacia is non-progressive, whereas serial MRI documented progression
          of AIMS white matter lesions in an index patient
        - No accompanying fatigable myopathy with painful post-exercise spasms
        - No familial recurrence pattern; AIMS is recessive with affected siblings
        - No late systolic cardiac dysfunction
        notes: 'Deliberately left unbound. The confusable entity here is an acquired perinatal aetiology
          rather than a nosological disease with a defensible MONDO term: HP:0006970 (Periventricular
          leukomalacia) is the appropriate ontology binding and is already used above as an AIMS phenotype,
          and binding a broad cerebral palsy MONDO term would assert a specific alternative diagnosis
          that the AIMS literature does not name. The distinguishing features are recorded instead.'
      selected_evidence:
        snippet: These new cases further demonstrate the prominence of white matter abnormalities resembling
          periventricular leukomalacia or small vessel disease as a key hallmark of the disorder, alongside
          developmental delay, intellectual impairment, seizures, and fatigability.
        supports: SUPPORT
