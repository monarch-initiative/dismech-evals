          with intellect typically normal - none of which describes AIMS. Conversely no AIMS patient has
          had hypertrichosis, and AIMS cardiac disease is reduced rather than enhanced systolic function.
        distinguishing_features:
        - Gain-of-function ABCC9 variants, not loss-of-function
        - Autosomal dominant with de novo missense alleles clustering at Arg1154, not autosomal recessive
          truncating or splice alleles
        - Congenital hypertrichosis is characteristic; no AIMS patient has had hypertrichosis
        - Coarse facial features and osteochondrodysplasia, versus the distinct AIMS facies with prominent
          supraorbital ridges
        - Cardiomegaly with enhanced systolic function and patent ductus arteriosus, versus reduced systolic
          function in older AIMS patients
        - Intellect typically normal despite common developmental delay, versus intellectual disability
          in essentially all AIMS patients
        - Cerebral white matter hyperintensity resembling periventricular leukomalacia is an AIMS hallmark,
          not a Cantu feature
        - The Cantu GeneReviews "agents to avoid" list (minoxidil, diazoxide, ACE inhibitors) is specific
          to KATP overactivity and must not be transferred to AIMS
        disease_term:
          preferred_term: Cantu syndrome
          term:
            id: MONDO:0009406
            label: hypertrichotic osteochondrodysplasia Cantu type
        notes: MONDO:0009406 is the canonical MONDO term for Cantu syndrome, carries "Cantu syndrome"
          as an exact synonym, is bound to the same gene (RO:0004003 HGNC:60 ABCC9), is not obsolete,
          and is not an ancestor of this entry's anchor MONDO:0859224 - the anchor's only ontological
          ancestors are MONDO:0003847 (hereditary disease) and its superclasses. There is no Cantu syndrome
          entry in the dismech KB to cross-reference, so this differential is the only place the contrast
          is recorded.
      selected_evidence:
        snippet: The diagnosis of Cantú syndrome can be established in a proband with characteristic clinical
          and imaging findings and/or a heterozygous gain-of-function pathogenic variant in ABCC9 or KCNJ8
          identified by molecular genetic testing.
        supports: SUPPORT
