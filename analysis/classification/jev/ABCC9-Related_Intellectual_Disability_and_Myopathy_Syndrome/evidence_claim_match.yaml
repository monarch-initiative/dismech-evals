        hypothesis_group_id: cav1_1_calcium_influx_myopathy
        hypothesis_label: CaV1.1-mediated calcium influx as the driver of AIMS myopathy
        status: DEPRECATED
        description: 'Excessive calcium influx through skeletal-muscle CaV1.1 channels was tested as the
          downstream cause of the SUR2 loss-of-function myopathy. The model is not retained as the current
          mechanism: making CaV1.1 non-permeable did not reverse the pathology, while verapamil caused
          premature death in AIMS mice. The directly observed unstimulated-force phenotype remains established,
          but its downstream effector is unresolved.'
      selected_evidence:
        snippet: We sought to determine whether excessive Ca2+ influx through CaV 1.1 channels was responsible
          for myopathology but found that the Ca2+ channel blocker verapamil unexpectedly resulted in
          premature death of AIMS mice and that rendering CaV 1.1 channels nonpermeable by mutation failed
          to reverse pathology; results which caution against the use of calcium channel blockers in AIMS.
        supports: REFUTE
