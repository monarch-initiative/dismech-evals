            term:
              id: MONDO:0859224
              label: intellectual disability and myopathy syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Heart failure pharmacotherapy
        description: 'Standard heart-failure pharmacotherapy for the reduced systolic function that emerges
          in older individuals: an ACE inhibitor plus a beta-blocker was started in the index patient
          found to have biventricular systolic dysfunction with an ejection fraction of 35-40%. This is
          a single reported case managed by conventional heart-failure practice, not an AIMS-specific
          regimen, and no outcome is reported. Note the direction-of-effect contrast with Cantu syndrome,
          where ACE inhibitors appear on the GeneReviews agents-to-avoid list because they open KATP channels
          that are already overactive; in AIMS the channels carry no measurable current, so that rationale
          does not transfer.'
        treatment_term:
          preferred_term: heart failure pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ACE inhibitor
            term:
              id: NCIT:C247
              label: ACE Inhibitor
          - preferred_term: beta-blocker
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
        notes: 'Curated as reported management of a documented complication, not as a recommendation:
