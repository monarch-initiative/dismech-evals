        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: ChannelopathyAssignment
      assertion:
        classification_value: skeletal muscle channelopathy
        notes: ChannelopathyOrganSystemEnum is single-valued in the schema and AIMS is a multi-organ KATP
          channelopathy (skeletal muscle, brain and heart). The skeletal-muscle value is chosen because
          tissue-selective suppression experiments localised the myopathy specifically to skeletal muscle
          (PMID:37154692), making it the one arm with a demonstrated cell-autonomous site of action. The
          neurological arm (white matter injury, intellectual disability, seizures) and the cardiac arm
          are modeled instead as separate pathophysiology nodes.
      selected_evidence:
        snippet: Given the roles of KATP channels in all muscles, we sought to determine how myopathy
          arises using tissue-selective suppression of KATP and found that LoF in skeletal muscle, specifically,
          underlies myopathy.
        supports: SUPPORT
    origin:
