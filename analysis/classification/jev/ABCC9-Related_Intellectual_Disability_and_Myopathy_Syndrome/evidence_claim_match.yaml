      assertion_type: Prevalence
      assertion:
        population: Worldwide, published cases
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'Derivation from published denominators only; no population-based rate has ever been reported
          for AIMS, so no rate_per_100000 is recorded. The published series are: PMID:31575858 (2019)
          six patients from two non-consanguineous Northern Norwegian families; PMID:38217872 (2024) nine
          additional subjects from seven unrelated families, plus an eighth family ascertained only through
          intra-uterine fetal deaths; PMID:42290677 (2026) five further cases. Summing the genotyped,
          clinically described patients across the three series gives 20, which supports the qualitative
          ULTRA_RARE tier and nothing more precise.'
      selected_evidence:
        snippet: Here, we report a syndrome in six patients from two families with a consistent phenotype
          of mild intellectual disability, similar facies, myopathy, and cerebral white matter hyperintensities,
          with cardiac systolic dysfunction present in the two oldest patients.
        supports: SUPPORT
