        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: aims_natural_history_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the natural history of AIMS across the lifespan, and at what interval should cardiac
          and cerebral imaging surveillance be performed?
        rationale: Around twenty patients have ever been reported, in three cross-sectional series with
          no prospective follow-up. Two features are known to be age-dependent - systolic dysfunction,
          present only in the oldest patients of the index cohort, and cognitive and motor decline reported
          in a sexagenarian - but neither has a defined onset distribution, so no surveillance interval
          can be evidence-based. No registry, survival analysis, or quality-of-life instrument has ever
          been applied.
        proposed_experiments:
        - experiment_id: exp_aims_prospective_registry
          name: International AIMS natural-history registry
          description: Enrol genotyped AIMS patients with standardised serial cardiac imaging, brain MRI,
            neuropsychological testing and functional measures, to establish onset distributions for the
            age-dependent complications and to set surveillance intervals.
      selected_evidence:
        snippet: These latest findings also highlight neonatal presentation of disease, deterioration
          following surgical procedures, and the potential for motor and cognitive decline, which should
          be monitored in older individuals.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
