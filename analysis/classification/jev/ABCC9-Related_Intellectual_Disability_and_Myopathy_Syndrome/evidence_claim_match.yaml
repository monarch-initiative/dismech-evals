      reference_title: Skeletal muscle delimited myopathy and verapamil toxicity in SUR2 mutant mouse
        models of AIMS.
      evidence_source: MODEL_ORGANISM
      explanation: Tissue-selective suppression localises the myopathic arm of AIMS to skeletal muscle.
