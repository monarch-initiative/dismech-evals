            term:
              id: MONDO:0859224
              label: intellectual disability and myopathy syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of calcium channel blockers
        description: Calcium channel blockers warrant strong caution on current preclinical evidence.
          Verapamil was tested in SUR2 loss-of-function mice on the hypothesis that excess CaV1.1-mediated
          calcium entry drove the myopathy; instead of rescuing the phenotype it caused premature death,
          and genetically rendering CaV1.1 non-permeable also failed to reverse the pathology. The authors
          state explicitly that this cautions against calcium channel blockers in AIMS. This is a model-organism
          safety signal, not a human trial result, and is recorded here because it is the only actionable
          drug-safety statement in the AIMS literature.
        treatment_term:
          preferred_term: avoidance of calcium channel blocker therapy
          term:
            id: NCIT:C15747
            label: Supportive Care
          therapeutic_agent:
          - preferred_term: verapamil
            term:
              id: CHEBI:9948
              label: verapamil
          - preferred_term: calcium channel blocker
            term:
              id: NCIT:C333
              label: Calcium Channel Blocker
      selected_evidence:
        snippet: results which caution against the use of calcium channel blockers in AIMS.
        supports: SUPPORT
