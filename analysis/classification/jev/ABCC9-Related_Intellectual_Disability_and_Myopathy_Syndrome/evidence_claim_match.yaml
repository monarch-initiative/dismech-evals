              label: intellectual disability and myopathy syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Tuberous sclerosis
        description: A documented misdiagnosis in AIMS, not a hypothetical one. One index patient was
          worked up for tuberous sclerosis on the basis of periventricular white matter change together
          with depigmented skin patches, and the diagnosis was later abandoned. The combination of white
          matter lesions, developmental delay, seizures and hypopigmented macules is genuinely TSC-like
          on a first pass.
        distinguishing_features:
        - Caused by TSC1 or TSC2, not ABCC9
        - Autosomal dominant with frequent de novo variants, not autosomal recessive
        - Cortical tubers, subependymal nodules and subependymal giant cell astrocytoma on MRI, a different
          lesion pattern from confluent periventricular white matter change
        - Renal angiomyolipoma, cardiac rhabdomyoma, facial angiofibroma and retinal hamartoma have no
          AIMS counterpart
        - Fatigable myopathy with painful exercise-induced spasms is an AIMS feature, not a TSC feature
        disease_term:
          preferred_term: tuberous sclerosis
          term:
            id: MONDO:0001734
            label: tuberous sclerosis
        notes: MONDO:0001734 is the current non-obsolete term (MONDO:0019341 "tuberous sclerosis complex"
          is obsolete and must not be used). It is not an ancestor of MONDO:0859224.
      selected_evidence:
        snippet: showed periventricular white matter changes, and a diagnosis of tuberous sclerosis was
          considered
        supports: SUPPORT
