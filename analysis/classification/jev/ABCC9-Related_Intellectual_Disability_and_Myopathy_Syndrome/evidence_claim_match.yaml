            term:
              id: MONDO:0859224
              label: intellectual disability and myopathy syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mitochondrial disease
        description: Mitochondrial disease is an important alternative for the combination of myopathy,
          exercise intolerance and cerebral white matter change. In several index patients, mitochondrial
          DNA sequence/deletion testing and screening for inborn errors of metabolism were among investigations
          reported as normal before ABCC9 was identified.
        distinguishing_features:
        - Caused by biallelic nuclear ABCC9 variants, not by mtDNA or nuclear-encoded mitochondrial gene
          defects
        - Normal mitochondrial DNA sequencing and deletion screening in the AIMS index families
        - Baseline serum lactate, creatine kinase, nerve conduction and electromyography were normal in
          the index cohort
        - Strictly autosomal recessive, without the maternal transmission or heteroplasmy-dependent variability
          of mtDNA disease
        disease_term:
          preferred_term: mitochondrial disease
          term:
            id: MONDO:0044970
            label: mitochondrial disease
        notes: Bound at the broad grouping level deliberately. The competing clinical consideration in
          the published AIMS families was "mitochondrial disease" as a category rather than any one named
          mitochondrial disorder, and binding a specific entity would assert a differential the literature
          does not name. MONDO:0044970 is not obsolete and is not an ancestor of MONDO:0859224.
      selected_evidence:
        snippet: S-CK, B-lactate, nerve conduction velocities, and electromyography, including repetitive
          nerve stimulation, are normal in all individuals
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/6
      evidence_path: /differential_diagnoses/6/evidence/0
