        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: ABCC8-related congenital hyperinsulinism
        description: ABCC8 encodes SUR1, the pancreatic sulfonylurea receptor, and differs from ABCC9
          by one character in the gene symbol and one paralogue in the same KATP family. Biallelic ABCC8
          loss of function is the commonest genetic cause of congenital hyperinsulinism, which is a neonatal
          hypoglycaemia disorder with no myopathy and no primary white matter disease. The mechanistic
          parallel is real - both are recessive loss-of-function sulfonylurea-receptor channelopathies
          - which is exactly why the literature is easy to misattribute, and why every mechanistic sentence
          in this entry was checked for which receptor it names.
        distinguishing_features:
        - Caused by ABCC8 (SUR1), not ABCC9 (SUR2)
        - Presents with severe persistent neonatal hyperinsulinaemic hypoglycaemia, which is not a feature
          of AIMS
        - Tissue of action is the pancreatic beta cell, not skeletal muscle, brain vasculature or myocardium
        - Focal and diffuse histological forms with 18F-DOPA PET localisation, a workup with no AIMS counterpart
        - Any brain injury is secondary to hypoglycaemia, whereas AIMS white matter disease is primary
          and present without hypoglycaemia
        disease_term:
          preferred_term: autosomal recessive hyperinsulinism due to SUR1 deficiency
          term:
            id: MONDO:0019333
            label: autosomal recessive hyperinsulinism due to SUR1 deficiency
        notes: MONDO:0019333 is bound rather than the broader congenital hyperinsulinism term because
          it names the SUR1 (ABCC8) recessive form specifically, which is the precise mirror-image entity.
          It is not obsolete and is not an ancestor of MONDO:0859224.
      selected_evidence:
        snippet: Congenital hyperinsulinism (CHI) is a rare disorder of glucose metabolism and is the
          most common cause of severe and persistent hypoglycemia (hyperinsulinemic hypoglycemia, HH)
          in the neonatal period and childhood.
        supports: SUPPORT
