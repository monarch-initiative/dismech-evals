  8765ef6eb960fe39549c73f2b9d36187c647fe7e2797dd35d9caead971309ea7:
    claim:
      about:
        disease:
          name: ABCC9-Related Intellectual Disability and Myopathy Syndrome
          disease_term:
            preferred_term: ABCC9-related intellectual disability and myopathy syndrome
            term:
              id: MONDO:0859224
              label: intellectual disability and myopathy syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: ABCC9
        gene_term:
          preferred_term: ABCC9
          term:
            id: hgnc:60
            label: ABCC9
        association: Causative
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        features: Only loss-of-function ABCC9 alleles cause AIMS, and only in the biallelic state. The
          founding allele is the homozygous splice-site variant c.1320+1G>A, which causes in-frame skipping
          of exon 8 and a SUR2 protein missing 52 amino acids with no plasmalemmal KATP function. The
          expanded cohorts add homozygous nonsense and frameshift alleles predicted to trigger nonsense-mediated
          decay or severe truncation of SUR2; recombinant testing confirms complete loss of function for
          the truncations. Gain-of-function missense ABCC9 alleles, several clustering at Arg1154, cause
          Cantu syndrome instead and are dominant - direction of effect, not the gene, is the discriminator.
          Heterozygous ABCC9 loss-of-function carriers in AIMS families have no conserved clinical pathology
          but report an excess of intra-uterine fetal death; the fetal genotypes were not established,
          so this remains a reproductive observation rather than an established heterozygote phenotype.
          The founding c.1320+1G>A allele is enriched in the Finnish population - gnomAD heterozygote
          allele frequency 0.0007 (18/24,850), against 0.00004 in non-Finnish Europeans and absent in
          Asian and African populations, with no homozygotes recorded - which matches the probable Finnish
          ancestry of the index families and predicts that AIMS is more prevalent in that population.
      selected_evidence:
        snippet: According to gnomAD, the variant is reported at surprisingly high frequency in heterozygous
          state in the Finnish population with an allele frequency of 0.0007 (18/24850).
        supports: SUPPORT
