      assertion_type: Discussion
      assertion:
        discussion_id: gap_acad9_riboflavin_response_mechanism
        prompt: Which patients with ACAD9 deficiency benefit from riboflavin, what dose and treatment
          timing are optimal, and how does response arise when ECSIT-driven conversion of ACAD9 into its
          complex I assembly state normally releases the FAD cofactor?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired ACAD9 complex I assembly-factor function
        - pathophysiology#Tissue-dependent long-chain fatty-acid-oxidation impairment
        - treatments#Riboflavin (Vitamin B2) Supplementation
        rationale: Riboflavin improves complex I activity in only 9/15 tested fibroblast lines, and retrospective
          reports include substantial clinical nonresponse and an acknowledged survivor-treatment-selection
          bias. The recent structural model also shows FAD release, rather than retention, when ECSIT
          commits ACAD9 to the assembly state. Prospective response criteria and a variant-aware mechanism
          are needed before observational survival differences can be interpreted causally or a regimen
          can be optimized.
      selected_evidence:
        snippet: ACAD 9 (n = 29, 75.9% responsive)
        supports: SUPPORT
