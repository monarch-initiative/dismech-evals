          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Mitochondrial complex I deficiency
        description: 'Loss of ACAD9 assembly-factor function prevents proper assembly of respiratory chain
          complex I, producing isolated complex I deficiency.

          '
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Furthermore, ACAD9 mutations result in complex I deficiency and not in disturbed long-chain
