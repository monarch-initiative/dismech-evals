  5ea08cdce584e44877294bc51d10ec2228cb58c2195b177d3e74b6ce2182b0e7:
    claim:
      about:
        disease:
          name: ACAN-Related Short Stature Spectrum
          disease_term:
            preferred_term: ACAN-related short stature spectrum
            term:
              id: MONDO:1060149
              label: ACAN-related short stature spectrum
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
        description: Established only in patient-derived cells, and only for the p.V2303M familial-osteochondritis-dissecans
          allele. Chondrocytes differentiated from patient bone-marrow mesenchymal stromal cells and from
          patient iPSC lines accumulate large amounts of aggrecan inside the endoplasmic reticulum while
          the surrounding matrix is depleted of it - the authors' term is chondrocyte aggrecanosis. The
          pellets these cells form are rich in glycosaminoglycan and still structurally poor, which is
          the cellular-level version of the whole entry's point that the defect is in matrix assembly
          rather than in bulk synthesis.
        role: mechanism
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: response to endoplasmic reticulum stress
          modifier: INCREASED
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
        notes: Observed in differentiated patient BM-MSC and iPSC-derived chondrocytes carrying p.V2303M.
          The relationship to reduced secretion is mechanistic interpretation of co-occurring cellular
          abnormalities, not proof that reduced secretion causes ER retention. Native growth-plate localization
          has not been established by these experiments.
      selected_evidence:
        snippet: Second, it was evident that large amounts of aggrecan accumulated within the endoplasmic
          reticulum of chondrocytes differentiated from both BM-MSCs and iPSCs.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
