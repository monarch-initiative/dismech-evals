      assertion_type: Diagnosis
      assertion:
        name: Bone Age Radiograph
        description: A hand and wrist radiograph estimates skeletal maturation; the 2017 study used the
          Greulich and Pyle method. Markedly advanced bone age can be a diagnostic clue, but normal bone
          age does not exclude ACAN-related disease. Height predictions require caution in a skeletal
          growth disorder.
        diagnosis_term:
          preferred_term: radiographic bone age assessment
          term:
            id: NCIT:C137876
            label: Bone Radiography
        presence: Variable bone age advancement; normal bone age does not exclude the disorder
        notes: 'Bound to NCIT:C137876 Bone Radiography, the imaging action this test performs. NCIT does
          carry the exact method the description names - NCIT:C181502 Greulich and Pyle Bone Age Estimation,
          returned by `runoak -i ols:ncit search "l~bone age"` - but it is not bindable here on positive
          grounds rather than absent ones: its ancestors are C81307 Estimation Method and C16847 Technique,
          with no path to NCIT:C25218 Clinical Intervention or Procedure, which is the TreatmentActionTerm
          root. It names the reading method, not the clinical action. C137876 is reachable from that root
          via C128940 Radiographic Examination, C16502 Diagnostic Imaging Testing, C17369 Imaging Procedure
          and C18020 Diagnostic Procedure, so the binding keeps the radiograph and leaves the bone-age
          reading to preferred_term. An earlier note here recorded a search for "Bone Age Determination"
          returning nothing and concluded no term existed; that query was too narrow, and the broader
          one above returns both terms.'
      selected_evidence:
        snippet: BA was assessed according to the method of Greulich and Pyle (12) by a single reader
          of the films, who was kept unaware of the age and identification of the individuals.
        supports: SUPPORT
        directness: DIRECT
