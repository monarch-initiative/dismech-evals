      assertion:
        name: Heterozygous ACAN Variants
        description: Heterozygous pathogenic ACAN variants include truncating, splice-site and missense
          alleles distributed across the gene. Missense variants associated with familial osteochondritis
          dissecans are enriched in the G3 domain, but neither all missense variants nor all familial
          osteochondritis dissecans variants are restricted to that domain. Variant class, domain and
          experimental system must be distinguished when interpreting functional effects.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ACAN
          term:
            id: hgnc:319
            label: ACAN
        notes: The variant numbering in the cited sources is not uniform - see the nomenclature hazard
          recorded in the entry notes. Each snippet quotes its own source's notation rather than a normalized
          form.
      selected_evidence:
        snippet: We screened AGC1 for mutations and identified a single-base-pair insertion, within the
          variable repeat region of exon 12 in affected individuals from the family with SEDK, that introduces
          a frameshift of 212 amino acids, including 22 cysteine residues, followed by a premature stop
          codon.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
