            preferred_term: ACAN-related short stature spectrum
            term:
              id: MONDO:1060149
              label: ACAN-related short stature spectrum
        context: []
      assertion_type: Diagnosis
      assertion:
        name: ACAN Sequencing
        description: A pathogenic or likely pathogenic heterozygous ACAN variant interpreted with the
          phenotype and segregation supports molecular diagnosis. Published approaches include candidate-gene
          Sanger sequencing, targeted panels and exome sequencing. Neither a normal skeletal survey nor
          absence of advanced bone age excludes the disorder. A VUS alone does not establish the diagnosis.
        diagnosis_term:
          preferred_term: ACAN sequence analysis
          term:
            id: NCIT:C153598
            label: DNA Sequencing
        presence: Heterozygous ACAN variant in all confirmed patients
        notes: 'A variant-of-unknown-significance rate high enough to matter: 10 of 16 variants in one
          series were VUS, and the probands carrying them differed from the pathogenic-variant probands
          in bone age and in coxa valga frequency. A reported ACAN variant is not by itself a diagnosis.'
      selected_evidence:
        snippet: genetic testing for ACAN deficiency should be considered in any child with significant
          short stature, even in the absence of disproportion, specific dysmorphic features, or BA advancement.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/2
