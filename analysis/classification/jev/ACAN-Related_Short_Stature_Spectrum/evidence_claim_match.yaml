              id: MONDO:1060149
              label: ACAN-related short stature spectrum
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Growth Plate Chondrogenesis
        description: Longitudinal bone growth is produced at the growth plate by chondrocyte proliferation,
          hypertrophy and matrix production, then replacement of that cartilage by bone. Aggrecan is a
          critical component of the matrix the plate is built from, so a reduced dose degrades the template
          and the mechanical environment the chondrocytes work in at the same time. This is the growth
          arm of the spectrum, and it is the same lesion as the joint arm one tissue over.
        role: mechanism
        biological_scale: TISSUE
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: growth plate cartilage development
          modifier: ABNORMAL
          term:
            id: GO:0003417
            label: growth plate cartilage development
        - preferred_term: endochondral ossification
          modifier: ABNORMAL
          term:
            id: GO:0001958
            label: endochondral ossification
        locations:
        - preferred_term: epiphyseal plate
          term:
            id: UBERON:0002516
            label: epiphyseal plate
      selected_evidence:
        snippet: Aggrecan is a critical proteoglycan component of the cartilage matrix, both in articular
          and growth plate cartilage, thus accounting for the dual phenotypic effects on both these types
          of cartilage.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
