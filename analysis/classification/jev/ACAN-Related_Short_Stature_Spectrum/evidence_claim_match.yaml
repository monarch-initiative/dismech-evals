      assertion_type: Discussion
      assertion:
        discussion_id: acan_secretion_versus_presence
        kind: CONTROVERSY
        prompt: How do assay context and allele-specific secretion influence the amount and function of
          aggrecan in patient cartilage?
        rationale: The 2010 study detected variant protein in patient cartilage and found similar total
          proteoglycan in a patient extract and pooled osteoarthritic control extracts. The 2016 differentiated-cell
          study found ER retention and extracellular depletion. The 2022 p.V2455M explant pilot measured
          less variant than wild-type protein in tissue and medium. These are distinct measurements in
          different systems, not proof of either normal secretion or complete failure across all tissues.
          Splice construct and differentiation state may influence results; their contributions have not
          been isolated in a matched comparison.
        attaches_to:
        - pathophysiology#Impaired Matrix Ligand Binding of G3-Domain Variant Aggrecan
        - pathophysiology#Aggrecan Retention in the Chondrocyte Endoplasmic Reticulum
        - pathophysiology#Reduced Secretion of G3-Domain Variant Aggrecan
      selected_evidence:
        snippet: Mass spectrometric analyses of aggrecan purified from patient cartilage verified that
          V2303M aggrecan is produced and present in the tissue.
        supports: SUPPORT
        directness: DIRECT
