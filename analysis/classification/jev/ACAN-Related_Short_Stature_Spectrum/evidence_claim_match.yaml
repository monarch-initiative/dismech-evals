      assertion_type: Treatment
      assertion:
        name: Recombinant Human Growth Hormone
        description: Growth hormone has shown improved childhood growth in retrospective cohorts and in
          an open-label, single-arm prospective study of ten children followed for three years. The prospective
          median height gain was +1.21 SDS. These results do not establish the size of an adult-height
          benefit against an untreated control group. Older children entering puberty showed an attenuated
          response; IGF-I elevations frequently prompted dose reduction.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: somatropin
            term:
              id: NCIT:C837
              label: Somatropin
        notes: Graded PROTEIN_REPLACEMENT as the modality because somatropin is recombinant human growth
          hormone given as a protein; note it replaces nothing that is deficient in this disease, which
          is the point of the MODULATES rather than CORRECTS link above.
      selected_evidence:
        snippet: The long-term impact on final adult height remains to be elucidated.
        supports: SUPPORT
        directness: DIRECT
