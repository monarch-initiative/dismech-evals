          functional_impact_category: DOMINANT_NEGATIVE
          description: 'Most dominant ACTA1 variants are de novo missense changes and act as dominant-negative
            "poison" alleles; the minority recessive alleles are instead genetic or functional nulls and
            are modelled by the separate node below.

            '
