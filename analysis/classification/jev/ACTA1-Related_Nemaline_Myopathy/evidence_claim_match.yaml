      assertion:
        name: Dominant
        display_name: Dominant (poison mutant actin) ACTA1 disease
        description: 'Approximately 90% of ACTA1 disease. A heterozygous, usually de novo, missense variant
          is expressed and the mutant protein is incorporated into the thin filament alongside wild-type
          alpha-actin, so the mechanism is a dominant-negative or "poison peptide" one rather than haploinsufficiency.
          Severity ranges from lethal neonatal disease to mild childhood-onset weakness and depends in
          part on the proportion of mutant protein present.

          '
      selected_evidence:
        snippet: Approximately 200 different ACTA1 mutations have been identified, with 90 % resulting
          in dominant disease and 10 % resulting in recessive disease.
        supports: SUPPORT
