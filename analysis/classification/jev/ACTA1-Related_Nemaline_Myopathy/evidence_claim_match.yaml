              label: congenital myopathy 2a, typical, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Actin-Tropomyosin Regulation
        description: 'Incorporated mutant alpha-actin interacts abnormally with tropomyosin, which is
          held over the myosin-binding site of the thin filament in the "switched off" position, so fewer
          myosin heads bind actin when the fibre is activated. This is a regulatory defect of an intact
          thin filament and is separable from structural breakdown of the sarcomere: the ACTA1 variants
          that produce congenital fibre-type disproportion carry the actin-tropomyosin defect while sarcomeric
          structure on electron microscopy stays normal. Because it requires mutant protein in the filament,
          it describes the dominant poison-peptide mechanism and not the recessive null one.

          '
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: tropomyosin binding
          modifier: DYSREGULATED
          term:
            id: GO:0005523
            label: tropomyosin binding
        biological_processes:
        - preferred_term: muscle filament sliding
          modifier: DECREASED
          term:
            id: GO:0030049
            label: muscle filament sliding
      selected_evidence:
        snippet: In vitro motility studies indicate that abnormal interactions between actin and tropomyosin
          are the likely principal cause of muscle weakness for D292V, with tropomyosin stabilized in
          the "switched off" position.
        supports: SUPPORT
