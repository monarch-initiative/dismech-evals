          genetic or functional nulls, so no functional skeletal muscle alpha-actin was made; cardiac
          alpha-actin, which is 99% identical and is the predominant sarcomeric actin in fetal muscle,
          is the isoform available to substitute for it and is the basis of the isoform-replacement therapeutic
          strategy. That generalisation is no longer complete: homozygous missense variants preserving
          skeletal alpha-actin expression have since been reported in brothers with congenital muscular
          dystrophy with rigid spine and dystrophic biopsy features, which the authors describe as a new
          class of recessive ACTA1 variant.

          '
