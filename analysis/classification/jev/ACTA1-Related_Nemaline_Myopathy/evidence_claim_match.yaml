        disease:
          name: ACTA1-Related Nemaline Myopathy
          disease_term:
            preferred_term: ACTA1 nemaline myopathy
            term:
              id: MONDO:0008070
              label: congenital myopathy 2a, typical, autosomal dominant
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: 'About 90% of ACTA1 variants cause dominant disease, and most affected individuals
          are simplex cases carrying a de novo missense variant that is absent from parental blood. Recurrence
          in a sibship after an apparently de novo variant is a real risk because parental somatic and
          germline mosaicism has been documented, and a mildly affected or asymptomatic mosaic parent
          may carry the same allele that is lethal in the proband. Expressivity is variable: age at onset
          and severity differ markedly between carriers of the same variant, including between affected
          members of one family, so ACTA1 genotype alone does not predict the clinical course.

          '
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        de_novo_rate: 84% of sporadic patients with parental testing available
        expressivity: VARIABLE
      selected_evidence:
        snippet: Most mutations are dominant and most patients have de novo mutations not present in the
          peripheral blood DNA of either parent. Only 10% of mutations are recessive and they are genetic
          or functional null mutations.
        supports: SUPPORT
