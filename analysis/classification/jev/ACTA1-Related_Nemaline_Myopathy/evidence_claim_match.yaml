              the ACTA1 variants that produce congenital fibre-type disproportion carry the actin-tropomyosin
              defect while sarcomeric structure on electron microscopy stays normal. Because it requires
              mutant protein in the filament, it describes the dominant poison-peptide mechanism and not
              the recessive null one.

