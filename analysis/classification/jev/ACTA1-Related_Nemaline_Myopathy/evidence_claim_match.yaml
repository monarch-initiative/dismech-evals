        description: 'Cardiac alpha-actin is 99% identical to the skeletal isoform and is the predominant
          sarcomeric actin in fetal muscle, so re-expressing it postnatally can substitute for absent
          or poisoned skeletal alpha-actin. In mice it rescued the recessive null model and markedly reduced
          lethality in one dominant model but not another, so its benefit is allele-dependent rather than
          general. Preclinical only.

          '
        action_category: THERAPEUTIC
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: In one model, lethality of ACTA1(D286G). Acta1(+/-) mice was reduced from ∼59% before
          30 days of age to ∼12%. In the other model, Acta1(H40Y), in which ∼80% of male mice die by 5
          months of age, the cardiac α-actin transgene did not significantly improve survival.
        supports: SUPPORT
