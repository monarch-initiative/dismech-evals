            label: ATP metabolic process
        - preferred_term: regulation of mitochondrial membrane potential
          modifier: DYSREGULATED
          term:
            id: GO:0051881
            label: regulation of mitochondrial membrane potential
      selected_evidence:
        snippet: Together, these findings suggest that mitochondrial dysfunction and oxidative stress
          are disease phenotypes in the in vitro model of ACTA1 nemaline myopathy, and that modulation
          of ATP levels was sufficient to protect NM-iSkM mitochondria from stress-induced injury.
        supports: SUPPORT
