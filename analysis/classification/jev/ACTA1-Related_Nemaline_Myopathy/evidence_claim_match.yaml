        name: Non-Nemaline ACTA1 Congenital Myopathies
        description: 'The same gene causes intranuclear rod myopathy, actin filament aggregate myopathy,
          congenital fibre-type disproportion and myopathy with core-like areas. These are distinguished
          on biopsy rather than clinically, and a single biopsy may show several patterns at once, so
          the separation is a histological convention rather than a boundary between diseases.

          '
