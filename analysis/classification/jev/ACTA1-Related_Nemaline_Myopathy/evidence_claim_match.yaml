      assertion_type: Diagnosis
      assertion:
        name: ACTA1 Sequencing
        description: 'Sequencing of the whole ACTA1 coding region, in practice as part of a congenital
          myopathy gene panel or exome, is required to assign the genotype. Because there is no mutation
          hotspot and most variants are private, partial-gene testing is not adequate, and parental testing
          is needed to distinguish a de novo dominant variant from a recessive genotype — a distinction
          that changes the recurrence risk from 50% to 25%.

          '
      selected_evidence:
        snippet: Where DNA has been available for testing from the parents of sporadic patients, 79/94
          or 84% had de novo dominant mutations not present in the peripheral blood DNA of either parent,
          while only 16% had recessive ACTA1 mutations.
        supports: SUPPORT
