      assertion:
        name: Avoidance of Neuromuscular Blocking Agents
        description: 'Neuromuscular blocking agents are to be avoided because of a possible association
          with malignant hyperthermia susceptibility. This is an anaesthetic-safety warning that applies
          at every surgical or procedural encounter, and is one of the few actionable items a family can
          carry on a care plan.

          '
        action_category: COUNSELING_INFORMATIONAL
        treatment_term:
          preferred_term: perioperative risk management
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: 'The source states a *possible* association with malignant hyperthermia susceptibility,
          and it is a retired GeneReviews chapter, so the strength of this claim should not be read as
          equivalent to the established susceptibility in RYR1-related core myopathies. A PubMed search
          for `ACTA1 malignant hyperthermia` returns four records, of which the only nemaline-myopathy
          one is this same retired chapter (PMID:20301465) and its companion chapter PMID:20301436; a
          search for `nemaline myopathy malignant hyperthermia` returns 39 records whose top hits are
          about TPM2 multiple pterygium syndrome and unrelated topics. No primary study establishing malignant
          hyperthermia susceptibility in ACTA1 disease was found, so the warning is recorded as the chapter
          states it and not strengthened.

          '
