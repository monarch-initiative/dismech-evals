      assertion_type: Discussion
      assertion:
        discussion_id: acta1_lesion_specificity_mechanism
        kind: KNOWLEDGE_GAP
        prompt: 'Why do ACTA1 variants cause muscle weakness, and what determines which structural lesion
          — nemaline rods, actin aggregates, intranuclear rods, fibre-type disproportion — a given variant
          produces?

          '
        attaches_to:
        - pathophysiology#Defective Actin-Tropomyosin Regulation
        - pathophysiology#Sarcomeric Disorganisation
        - pathophysiology#Nemaline Rod Formation
        rationale: 'Despite two decades of work in cell culture, animal models and patient tissue, the
          mechanism linking mutant alpha-actin to weakness and to a particular structural lesion is not
          established, and single biopsies frequently show several lesions at once. This is why the histological
          boundary of this entry is a convention rather than a mechanistic distinction, and why genotype
          does not predict phenotype.

          '
      selected_evidence:
        snippet: Despite extensive research into normal actin function and the functional consequences
          of ACTA1 mutations in cell culture, animal models and patient tissue, the mechanisms underlying
          muscle weakness and the formation of structural lesions remains largely unknown.
        supports: SUPPORT
