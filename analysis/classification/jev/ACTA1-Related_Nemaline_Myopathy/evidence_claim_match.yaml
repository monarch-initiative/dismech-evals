              label: congenital myopathy 2a, typical, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nuclear Envelope and LINC Complex Disruption
        description: 'In severe ACTA1 disease the pathology extends to the myonucleus: the perinuclear
          space is enlarged and lamin A/C, nesprin-1 and nesprin-2 — the LINC complex components that
          tether the nucleus to the cytoskeleton — are mislocalised. This implies a physiological role
          for skeletal muscle alpha-actin in maintaining nuclear shape that is lost when the mutant protein
          is present. Intranuclear rods are recorded on the Nemaline Rod Formation node rather than here,
          because the available evidence shows them co-occurring with this nuclear pathology in severe
          biopsies and does not establish that envelope disruption produces them.

          '
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: We also detected structural anomalies of the perinuclear space, emphasizing a physiological
          contribution of skeletal muscle α-actin to nuclear shape.
        supports: SUPPORT
