          and superoxide production rise, and supplying ATP protects the mitochondria from stress-induced
          injury. The evidence comes from isogenic H40Y iPSC-derived myocytes rather than from patient
          muscle, so this is a candidate contributor to the contractile deficit and not an established
          step in it.

          '
        biological_scale: CELLULAR
