  a4bf6dd0e9281d8711fb34d912e5692c6a4db80bd352f25ea54b9add1b2ea5c6:
    claim:
      about:
        disease:
          name: ACTB-Related Syndromic Thrombocytopenia
          disease_term:
            preferred_term: ACTB-associated syndromic thrombocytopenia
            term:
              id: MONDO:0100433
              label: ACTB-associated syndromic thrombocytopenia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: actb_ast_versus_plof_disorder
        kind: OPEN_QUESTION
        prompt: Is ACTB-related syndromic thrombocytopenia a separate disorder, or part of a single ACTB
          loss-of-function spectrum?
        rationale: 'ClinGen and OMIM keep this disorder separate, restricted to exon 5 and 6 variants.
          A 2026 study of 290 individuals with non-muscle actinopathies found that deletion carriers,
          carriers of truncating variants and the syndromic thrombocytopenia patients share a facial gestalt
          and variable thrombocytopenia, and proposed one ACTB pLoF disorder with three molecular routes:
          deletion, nonsense-mediated decay, and unstable protein. The founding report instead detected
          the mutant peptide and argued that mutant actin is incorporated into filaments, which is not
          a simple loss of function. This entry follows the ClinGen and MONDO scope until the question
          is settled; if the merge is adopted, its disease_term, genetic scope and loss-of-function phenotypes
          will need revisiting.'
        attaches_to:
        - pathophysiology#Heterozygous ACTB 3' Coding Region Variant
        - disease#
