        name: ACTB Loss-of-Function Disorder
        description: Developmental delay, intellectual disability, microcephaly, growth restriction, heart
          and renal tract malformations and a recognizable facial gestalt, caused by whole-gene deletions
          (including 7p22.1 microdeletions) or truncating ACTB variants. OMIM files it under Baraitser-Winter
          syndrome 1. A 2026 cohort study found that it overlaps substantially with this disorder and
          proposed merging the two.
        distinguishing_features:
        - 'The variant class: deletion of the whole gene or a truncating variant expected to undergo nonsense-mediated
          decay, rather than a 3'' exon 5 or 6 variant that escapes it.'
      selected_evidence:
