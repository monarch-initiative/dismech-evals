  e96035f440b9d6ddc22908560cd3ff17f75cf2d936d40b40db96977a1fe310b7:
    claim:
      about:
        disease:
          name: ACTB-Related Syndromic Thrombocytopenia
          disease_term:
            preferred_term: ACTB-associated syndromic thrombocytopenia
            term:
              id: MONDO:0100433
              label: ACTB-associated syndromic thrombocytopenia
        context: []
      assertion_type: Genetic
      assertion:
        name: ACTB
        gene_term:
          preferred_term: ACTB
          term:
            id: hgnc:132
            label: ACTB
        variant_origin: GERMLINE
        notes: 'relationship_type is left unset. ACTB is the gene that causes this disease, but the schema
          defines CAUSATIVE as a ClinGen Definitive or Strong tier and ClinGen rates this pair Moderate;
          that tier is recorded in gene_disease_validity. No other value of the enum describes a Mendelian
          cause with Moderate evidence. Variants arise de novo or are inherited from an affected parent,
          with variable expressivity within families. The ClinGen curation scores only exon 5 and 6 variants;
          two exon 4 variants with a partly overlapping phenotype are listed but not scored. ACTB variants
          elsewhere in the gene cause other disorders: missense variants in exons 2 to 4 cause Baraitser-Winter
          cerebrofrontofacial syndrome, and whole-gene deletions and truncating variants that undergo
          nonsense-mediated decay cause the ACTB loss-of-function (pleiotropic developmental) disorder.
          ACTB lies at 7p22.1; 7p22.1 microdeletions spanning ACTB belong to the loss-of-function disorder,
          although thrombocytopenia has been confirmed in some deletion carriers (see discussions).'
        variants:
        - name: c.938T>G p.Met313Arg
          description: Missense in subdomain 3; inherited from an affected father in family A.
        - name: c.992_1008del p.Ala331Val_fs*27
          description: Last-exon frameshift replacing 26 residues from position 331 and truncating at
            357; escapes nonsense-mediated decay and the frameshift peptide is produced. Inherited from
            an affected mother in family B.
        - name: c.1012_1023del p.Ser338_Ile341del
          description: De novo in-frame deletion in subdomain 1; the most severely affected founding patient.
        - name: c.1101dup p.Ser368Leu_fs*13
          description: De novo last-exon insertion replacing the last 8 residues and adding 4; recombinant
            protein shows slow polymerization and weak profilin-1 binding.
        - name: c.1090G>A p.Glu364Lys
          description: Exon 6 missense in the 1999 patient with neutrophil dysfunction, recurrent infections
            and intellectual disability; assigned to this disorder by the founding report.
        gene_disease_validity:
        - validity_classification: MODERATE
          classified_by: CLINGEN
          external_id: CGGV:assertion_9cee7fd2-09f7-41dc-9742-542917d856b0-2024-06-03T160000.000Z
      selected_evidence:
        snippet: Given the distinct genotype–phenotype correlation, we name this actinopathy ACTB-associated
          syndromic thrombocytopenia (ACTB-AST).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
