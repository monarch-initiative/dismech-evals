  3ae90c20b3f84b4e06fdde0bca0d4811d33dd5f5c2821dc24bfb6528b5e785f4:
    claim:
      about:
        disease:
          name: ACTH-Independent Macronodular Adrenal Hyperplasia 3
          disease_term:
            preferred_term: KDM1A-related primary bilateral macronodular adrenal hyperplasia with food-dependent
              Cushing syndrome
            term:
              id: MONDO:0700299
              label: ACTH-independent macronodular adrenal hyperplasia 3
        context: []
      assertion_type: Treatment
      assertion:
        name: Somatostatin Analogue Therapy
        description: The obvious mechanism-directed drug idea, and it does not work. Somatostatin analogues
          suppress GIP release from intestinal K cells, so they should in principle cut off the stimulus
          driving cortisol secretion. In the one detailed published trial - a single patient given octreotide
          for six months and then pasireotide for three - both drugs did acutely suppress the postprandial
          cortisol response, but the effect escaped, and neither improved the clinical or metabolic features.
          The patient proceeded to bilateral adrenalectomy. The authors concluded the failure was independent
          of somatostatin receptor subtype affinity, which matters because it removes the natural next
          move of trying a broader-spectrum analogue.
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: octreotide
            term:
              id: CHEBI:7726
              label: octreotide
          - preferred_term: pasireotide
            term:
              id: CHEBI:72312
              label: pasireotide
      selected_evidence:
        snippet: This case report illustrates the lack of sustained efficacy of somatostatin analogues
          on GIP-dependent Cushing's syndrome, independent of their affinity for the different somatostatin
          receptor subtypes.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
      context_paths:
