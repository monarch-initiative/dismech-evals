      assertion_type: Phenotype
      assertion:
        category: Endocrine
        name: Decreased Circulating ACTH
        description: Plasma ACTH is low or suppressed, because autonomous adrenal cortisol production
          shuts down pituitary corticotrophs. This is the feature that makes the syndrome ACTH-INDEPENDENT
          and separates it from Cushing disease, so it is definitional for the entity rather than incidental.
        phenotype_term:
          preferred_term: Decreased circulating ACTH concentration
          term:
            id: HP:0002920
            label: Decreased circulating ACTH concentration
        notes: 'Evidenced at the level of PBMAH rather than of KDM1A-related PBMAH specifically. None
          of the KDM1A cohort papers reports ACTH values, so the citations below are a PBMAH case report
          and a PBMAH review. The inference to KDM1A carriers is safe - ACTH-independence is definitional
          for the parent entity and the KDM1A form is a subset of it - but it is an inference, and the
          evidence grading says so.

          One nuance the entry does not smooth over: a 2026 review notes intra-adrenal ACTH production
          by steroidogenic cells in PBMAH, so "ACTH-independent" refers to independence from PITUITARY
          ACTH, not to the absence of ACTH signalling altogether.'
      selected_evidence:
        snippet: Her laboratory results showed increased cortisol and suppressed ACTH, and an abdominal
          CT scan revealed 2 heterogeneous masses in the adrenal glands.
        supports: SUPPORT
