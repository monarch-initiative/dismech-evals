            term:
              id: MONDO:0700299
              label: ACTH-independent macronodular adrenal hyperplasia 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ectopic GIP Receptor Expression in Adrenocortical Cells
        biological_scale: CELLULAR
        description: The defining lesion of the disease. Adrenocortical cells that have lost KDM1A express
          the glucose-dependent insulinotropic polypeptide receptor (GIPR), a receptor they normally do
          not carry. This was seen as a very large upregulation of GIPR transcript in patient lesions
          relative to controls, and - critically for causality - was reproduced prospectively in human
          adrenocortical H295R cells by inhibiting or CRISPR-inactivating KDM1A. That experiment is what
          upgrades the relationship from association to mechanism.
        genes:
        - preferred_term: GIPR
          term:
            id: hgnc:4271
            label: GIPR
        cell_types:
        - preferred_term: adrenocortical cell
          term:
            id: CL:0002097
            label: cortical cell of adrenal gland
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: In vitro pharmacological inhibition and inactivation of KDM1A by CRISPR-Cas9 genome editing
          resulted in an increase of GIP receptor transcripts and protein in human adrenocortical H295R
          cells.
        supports: SUPPORT
