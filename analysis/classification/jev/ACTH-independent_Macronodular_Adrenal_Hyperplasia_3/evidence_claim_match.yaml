        biological_scale: ORGANISM
        description: 'The downstream consequences are those of any chronic cortisol excess and are not
          specific to the KDM1A mechanism: central fat redistribution, insulin resistance and diabetes,
          hypertension, proximal myopathy, osteoporosis, thin skin with striae and easy bruising. They
          are modelled as a single terminal node rather than as separate mechanistic branches because
          the disease-specific biology ends upstream of them - everything distinctive about AIMAH3 is
          in how the cortisol comes to be secreted, not in what it then does.'
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: All patients should undergo clinical and biochemical assessment for steroid excess-particularly
          cortisol, as many exhibit mild autonomous cortisol secretion.
        supports: SUPPORT
