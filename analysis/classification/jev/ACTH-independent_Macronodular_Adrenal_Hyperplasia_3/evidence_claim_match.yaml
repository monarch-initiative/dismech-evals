        relationship_type: CAUSATIVE
        variant_origin: GERMLINE_AND_SOMATIC
        notes: 'KDM1A encodes lysine-specific demethylase 1A (LSD1) at 1p36.12. In AIMAH3 it behaves as
          a two-hit tumour suppressor: a germline heterozygous truncating allele plus somatic loss of
          the wild-type allele on 1p within the adrenal lesion. Every KDM1A-variant patient in the systematic
          screening series was female, an association that is unexplained and is recorded here as an observation
          rather than a mechanism.

          Variant configuration: germline heterozygous truncating allele (loss of function), with somatic
          loss of heterozygosity through 1p deletion in the affected adrenal tissue. `variant_origin:
          GERMLINE_AND_SOMATIC` records that both compartments are involved; the per-compartment zygosity
          (heterozygous in the germline, effectively null in the lesion) cannot be expressed in a single
          slot and is stated here instead.'
      selected_evidence:
        snippet: All patients with KDM1A variants were women, vs 65% of ARMC5 patients and 67% of wild-type
          patients (P = .0337).
        supports: SUPPORT
