  13e647716ae3d460004b472b72c43146f717137045c1306150e1b40915aa3852:
    claim:
      about:
        disease:
          name: ACTH-Independent Macronodular Adrenal Hyperplasia 3
          disease_term:
            preferred_term: KDM1A-related primary bilateral macronodular adrenal hyperplasia with food-dependent
              Cushing syndrome
            term:
              id: MONDO:0700299
              label: ACTH-independent macronodular adrenal hyperplasia 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of KDM1A H3K4 Demethylase Activity in Adrenocortical Cells
        biological_scale: MOLECULAR
        description: KDM1A (LSD1) is a flavin-dependent amine oxidase that demethylates mono- and di-methylated
          histone H3 lysine 4, a mark associated with active transcription; removing it represses target
          genes. Concomitant inactivation of both alleles abolishes KDM1A protein in the lesion, and the
          transcriptional repression it normally imposes is lifted. Note that the enzymatic interpretation
