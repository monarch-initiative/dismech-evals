      assertion:
        name: Somatic Loss of the KDM1A Wild-Type Allele on 1p
        biological_scale: MOLECULAR
        description: Within adrenal lesions, a recurrent somatic deletion of the short arm of chromosome
          1 removes the wild-type KDM1A allele. This is the second hit, and it is what converts a heterozygous
          carrier into a locally KDM1A-null tissue. Its presence in lesions and absence in control adrenal
          tissue is the specific observation that places KDM1A in the tumour-suppressor category rather
          than treating the germline variant as a simple dominant.
        genes:
        - preferred_term: KDM1A
          term:
            id: hgnc:29079
            label: KDM1A
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: We also identified a recurrent deletion in the short p arm of chromosome 1 harboring
          the KDM1A locus in adrenal lesions of these patients.
        supports: SUPPORT
