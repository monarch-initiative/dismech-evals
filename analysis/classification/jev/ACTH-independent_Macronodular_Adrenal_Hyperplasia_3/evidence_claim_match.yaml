      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Transmission of the germline truncating KDM1A allele is autosomal dominant with
          incomplete penetrance for overt Cushing syndrome. The disease in the adrenal cortex is nonetheless
          recessive at the cellular level: a somatic second hit removing the wild-type allele is required
          for a nodule to lose KDM1A expression, which is the classic two-hit tumour-suppressor configuration.'
      selected_evidence:
        snippet: We propose that GIP-dependent primary bilateral macronodular adrenal hyperplasia with
          Cushing's syndrome results from a two-hit inactivation of KDM1A, consistent with the tumour
          suppressor gene model of tumorigenesis.
        supports: SUPPORT
