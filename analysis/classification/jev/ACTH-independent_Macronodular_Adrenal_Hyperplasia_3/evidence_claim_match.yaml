              label: ACTH-independent macronodular adrenal hyperplasia 3
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Mixed meal test with oral versus intravenous glucose
        description: 'The confirmatory test, and the cleanest physiological demonstration of the modelled
          mechanism. Cortisol rises after a mixed meal, and - decisively - after ORAL but not INTRAVENOUS
          glucose. The oral/intravenous dissociation is the whole argument: only the oral route passes
          nutrients through the gut and triggers GIP release from intestinal K cells, so a cortisol response
          that depends on the route rather than on the glucose load localises the stimulus to an incretin.
          Failure of cortisol to suppress after dexamethasone establishes the autonomy.'
      selected_evidence:
        snippet: The diagnosis was confirmed by further investigations, showing significant plasma cortisol
          responses after a mixed meal test and after oral, but not intravenous glucose administration,
          as well as ACTH-independent bilateral macronodular adrenal hyperplasia (AIMAH).
        supports: SUPPORT
