      assertion:
        discussion_id: hccaa_environmental_modifier
        prompt: Which specific environmental or life-style exposure accounts for the halving of L68Q carrier
          life span between 1825 and 1900?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Recurrent Lobar Intracerebral Hemorrhage
        rationale: The genealogical evidence for an environmental modifier is strong and replicated across
          independent extended families, and it implies that a preventive strategy may exist. But the
          responsible exposure has never been identified, so no ECTO term can be bound and the effect
          cannot be modeled mechanistically. A parent-of-origin effect emerging over the same period is
          an additional unexplained observation.
      selected_evidence:
        snippet: At the same time, a parent-of-origin effect emerged, whereby maternal inheritance of
          the mutation was associated with a 9 year reduction in life span relative to paternal inheritance.
        supports: SUPPORT
