      assertion_type: Discussion
      assertion:
        discussion_id: hccaa_basement_membrane_primacy
        prompt: Are basement membrane changes an early driver that facilitates cystatin C deposition,
          or a consequence of deposition already underway?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Cystatin C Amyloid Deposition in Cerebral Arterial Walls
        - pathophysiology#Arterial Wall Matrix Accumulation and Thickening
        - pathophysiology#Systemic Extracerebral Cystatin C Deposition
        rationale: This entry currently draws the edge from amyloid deposition to matrix accumulation,
          following the arterial post-mortem description. The skin biopsy study argues the opposite direction
          - that basement membrane change is early and facilitates deposition - and reports collagen IV
          increased to a similar extent in all carrier biopsies regardless of deposit stage. Both directions
          are supported by cross-sectional human material only, and resolving the order would require
          longitudinal sampling or a model system that does not yet exist.
      selected_evidence:
        snippet: suggest that BM changes are early and important events in HCCAA pathogenesis that could
          facilitate cystatin C deposition and aggregation
        supports: SUPPORT
