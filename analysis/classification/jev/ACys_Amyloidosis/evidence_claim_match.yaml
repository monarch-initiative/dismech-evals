      assertion_type: Discussion
      assertion:
        discussion_id: hccaa_no_animal_model
        prompt: Why does HCCAA still lack an animal model, and what would a faithful model have to reproduce?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cystatin C Amyloid Deposition in Cerebral Arterial Walls
        - pathophysiology#Arterial Wall Matrix Accumulation and Thickening
        rationale: Essentially all mechanistic knowledge of HCCAA comes from human post-mortem tissue,
          patient-derived cells, and in vitro structural biology. The absence of an animal model is stated
          explicitly in the vascular pathology literature, and it is why the temporal ordering of amyloid
          deposition, matrix accumulation, and smooth muscle cell loss remains inferred from cross-sectional
          autopsy material rather than demonstrated longitudinally.
      selected_evidence:
        snippet: The aetiology of HCCAA pathology is not clear and there is, at present, no animal model
          of the disease.
        supports: SUPPORT
