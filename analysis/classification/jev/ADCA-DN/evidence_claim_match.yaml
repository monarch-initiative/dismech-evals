  442dc31999b73026420d4262753e0e81b33567ee3e934ffc8d93627672f06594:
    claim:
      about:
        disease:
          name: Autosomal Dominant Cerebellar Ataxia Deafness and Narcolepsy
          disease_term:
            preferred_term: autosomal dominant cerebellar ataxia, deafness and narcolepsy
            term:
              id: MONDO:0011397
              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_adcadn_methylome_direction
        prompt: Does ADCA-DN produce net hypermethylation of normally unmethylated regions, bidirectional
          change that depends on locus and cell type, or both depending on the tissue examined?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Cell-Type-Specific Methylome and Transcriptome Disruption
        rationale: A genome-wide array on DNA from a six-affected ADCA-DN family found a shift out of
          the lowest and upper-intermediate methylation bins into intermediate and near-complete methylation,
          with 82 regionally hypermethylated loci, consistent with increased methylation of normally unmethylated
          promoters and CpG islands. In contrast, patient fibroblasts, iPSCs, and induced neurons showed
          changes whose direction depended on cell type, including ZFP57 promoter hypomethylation with
          increased ZFP57 expression. Neither result supports the older global-hypomethylation model,
          but they are not obviously reconcilable with each other, and the tissue examined differs (peripheral
          blood-derived DNA versus derived neural cells). Resolving this determines whether any methylation
          episignature could serve as a diagnostic or pharmacodynamic biomarker.
        proposed_experiments:
        - experiment_id: exp_adcadn_matched_tissue_methylome_comparison
          name: Matched multi-tissue methylome comparison in the same ADCA-DN carriers
          description: Profile whole-genome bisulfite methylomes from peripheral blood, skin fibroblasts,
            and iPSC-derived neurons from the same set of ADCA-DN carriers and matched controls, using
            one analysis pipeline, and test whether the direction of change at shared loci is concordant
            across tissues or genuinely dependent on tissue.
          decision_criterion: Concordant direction across tissues would indicate that the earlier discrepancy
            was methodological; discordant direction at shared loci would confirm a genuine dependence
            on cell type and rule out a single blood-based episignature.
      selected_evidence:
        snippet: This pattern suggests an increase in methylation of normally unmethylated regions, such
          as promoters and CpG islands, as well as further methylation of highly methylated gene bodies
          and intergenic regions.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27602171
      reference_title: Identification of a methylation profile for DNMT1-associated autosomal dominant
        cerebellar ataxia, deafness, and narcolepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: States the hypermethylation-leaning interpretation from patient DNA.
