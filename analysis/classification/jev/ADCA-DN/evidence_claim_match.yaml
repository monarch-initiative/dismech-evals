  20d7ca66e4858bf70e0a2de7675ecce794c2f9267afa1faf3daf18a7d4718157:
    claim:
      about:
        disease:
          name: Autosomal Dominant Cerebellar Ataxia Deafness and Narcolepsy
          disease_term:
