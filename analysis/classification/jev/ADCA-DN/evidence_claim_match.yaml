              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypothalamic Hypocretin System Dysfunction
        conforms_to: orexin_arousal_instability#Sleep-Wake State Instability
        notes: Conformance is declared at the module's central effector (#Sleep-Wake State Instability)
          and deliberately NOT at its trigger (#Loss of Hypothalamic Orexin (Hypocretin) Signal). The
          module's stated entry bar for the trigger is demonstrated CSF hypocretin-1 deficiency, postmortem
          orexin neuron loss, or a causal HCRT/HCRTR variant; ADCA-DN meets none of them, since CSF hypocretin-1
          here can be low, intermediate, or normal and no neuropathological study has shown hypocretin
          neuron loss. What this entry does evidence is the downstream state instability the module makes
          rate-limiting - sleep-onset REM periods alongside excessive daytime somnolence and cataplexy
          - which is exactly the partial conformance the module permits for narcolepsy phenotypes without
          a demonstrated orexin lesion. The disorder is a neurodegenerative route into that node rather
          than an autoimmune one, so it also does not inherit the module's immune trigger.
        biological_scale: TISSUE
        description: Impaired hypothalamic hypocretin (orexin) signaling destabilizes the sleep-wake and
          REM-sleep control that hypocretin neurons normally maintain, producing excessive daytime somnolence,
          cataplexy, and sleep-onset REM periods. Unlike common sporadic narcolepsy type 1, in which CSF
          hypocretin-1 is usually markedly reduced following extensive hypocretin neuron loss, CSF hypocretin-1
          in DNMT1 disease can be low, intermediate, or normal, and cataplexy may be absent. No neuropathological
          study has demonstrated hypocretin neuron loss in ADCA-DN, so this node records system dysfunction
          rather than confirmed cell loss.
        cell_types:
        - preferred_term: hypocretin (orexin) neuron
          term:
            id: CL:0011109
            label: hypocretin-secreting neuron
        biological_processes:
        - preferred_term: circadian sleep/wake cycle
          term:
            id: GO:0042745
            label: circadian sleep/wake cycle
          modifier: ABNORMAL
        locations:
        - preferred_term: hypothalamus
          term:
            id: UBERON:0001898
            label: hypothalamus
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: CSF hypocretin-1 was 191 pg/mL (normal values > 200 pg/mL).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/1
      context_paths:
      - /name
      - /disease_term
