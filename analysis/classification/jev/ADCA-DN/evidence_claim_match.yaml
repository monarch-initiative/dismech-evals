      assertion_type: Discussion
      assertion:
        discussion_id: open_adcadn_cataract_unexplained
        prompt: Is cataract a genuine mechanistic consequence of DNMT1 dysfunction in ADCA-DN, or an incidental
          age-related comorbidity in a small reported series?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - phenotypes#Cataract
        rationale: Cataract is listed among the variable manifestations of ADCA-DN in two independent
          sources, but no mechanism links maintenance-methylation failure or the neurodegenerative cascade
          to lens opacification, and the affected patients are in an age range where cataract is common
          in the general population. The phenotype is therefore recorded but deliberately left unwired
          in the pathograph rather than attached to an existing node, which would assert an unsupported
          causal claim.
      selected_evidence:
        snippet: Optic atrophy, cataract, sensory neuropathy, and dementia may develop in the later stages
          of the disease.
        supports: SUPPORT
