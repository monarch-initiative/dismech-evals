              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_adcadn_hypocretin_neuron_pathology
        prompt: Is the narcolepsy of ADCA-DN caused by loss of hypothalamic hypocretin neurons, by dysfunction
          of surviving hypocretin neurons, or by failure of downstream sleep-wake circuitry?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hypothalamic Hypocretin System Dysfunction
        - biochemical#Cerebrospinal fluid hypocretin-1
        rationale: In sporadic narcolepsy type 1 the near-complete destruction of hypocretin neurons is
          established and CSF hypocretin-1 is uniformly low. In DNMT1 disease CSF hypocretin-1 is variously
          low, intermediate, or normal, and patients can develop progressive polysomnographic abnormalities
          while their CSF hypocretin-1 remains normal. No neuropathological study has counted hypocretin
          neurons in an ADCA-DN brain, and PubMed returns no ADCA-DN autopsy series. The pathophysiology
          node therefore asserts system dysfunction rather than neuron loss, and the distinction matters
          because it determines whether hypocretin agonist therapy would be expected to work.
        proposed_experiments:
        - experiment_id: exp_adcadn_hypothalamic_hypocretin_neuron_quantification
          name: Quantitative hypothalamic hypocretin neuron counts in ADCA-DN autopsy tissue
          description: Recruit ADCA-DN brain donations through an ataxia or narcolepsy brain bank and
            perform stereological counts of hypocretin-immunoreactive and melanin-concentrating-hormone-immunoreactive
            neurons in the lateral hypothalamus, comparing against sporadic narcolepsy type 1 and age-matched
            controls. Pair each brain with the donor's antemortem CSF hypocretin-1 value where available.
          decision_criterion: Hypocretin neuron counts comparable to sporadic narcolepsy type 1 would
            support a cell-loss mechanism; preserved counts with normal or borderline CSF hypocretin-1
            would support neuronal dysfunction or downstream circuit failure.
      selected_evidence:
        snippet: Remarkably, narcolepsy with or without cataplexy with low/intermediate or normal cerebrospinal
          fluid hypocretin-1 is present in both diseases.
        supports: SUPPORT
