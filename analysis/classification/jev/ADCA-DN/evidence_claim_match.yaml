        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Relief of RFTS Autoinhibition and DNMT1 Destabilization
        - pathophysiology#Aberrant DNMT1-NSUN2 RNA m5C Methylation
        - pathophysiology#Oxidative Stress and Mitochondrial Dysfunction
        - pathophysiology#Selective Central and Peripheral Neurodegeneration
        rationale: The only published knock-in mice carry mouse equivalents of the human HSAN1E variants
          Y495C and D490E-P491Y, which lie in the middle or N-terminal part of the targeting-sequence
          domain, not the C-terminal exon-21 region that defines ADCA-DN. Since intradomain variant position
          is the principal determinant separating the two human phenotypes, a model built on HSAN1E alleles
          cannot be assumed to capture the ADCA-DN phenotype. The heterozygous mice show reduced DNMT1
          protein and impaired learning and memory, but the three defining ADCA-DN features (narcolepsy,
          sensorineural deafness, cerebellar ataxia) have not been demonstrated. Mechanistic conclusions
          from these mice about RFTS destabilization and cleavage are recorded as PARTIAL support for
          that reason. A 2025 follow-up using RFTS-mutant mice identified aberrant DNMT1-dependent RNA
          m5C methylation, oxidative stress, and mitochondrial dysfunction. Its published abstract does
          not name the mouse RFTS allele or establish translation to classical exon-21 ADCA-DN, so that
          branch is likewise recorded as provisional, PARTIAL support rather than an established ADCA-DN
          mechanism.
        proposed_experiments:
        - experiment_id: exp_adcadn_exon21_knockin_mouse_deep_phenotyping
          name: Exon-21-allele knock-in mouse with longitudinal sleep, auditory, and cerebellar phenotyping
          description: Generate heterozygous knock-in mice carrying the mouse equivalent of human DNMT1
            p.Ala570Val or p.Val606Phe and phenotype them longitudinally with EEG/EMG sleep architecture
            and cataplexy scoring, hypothalamic hypocretin neuron counts, auditory brainstem responses
            and distortion-product otoacoustic emissions, rotarod and gait analysis with cerebellar histology,
            DNA methylome and RNA m5C profiling resolved by cell type, and mitochondrial functional assays.
            Run the existing HSAN1E-allele lines side by side as comparators.
          decision_criterion: Emergence of sleep-onset REM intrusion, cataplexy-like attacks, elevated
            auditory brainstem response thresholds, and progressive cerebellar degeneration in the exon-21
            line but not the HSAN1E lines would establish phenotype dependence on allele position and
            give the field a genuine ADCA-DN model.
      selected_evidence:
        snippet: Our results indicate that all the mutations causal for HSAN1E are located in the middle
          part or N-terminus end of the TS domain, whereas all the mutations causal for autosomal dominant
          cerebellar ataxia, deafness and narcolepsy are located in the C-terminus end of the TS domain.
        supports: SUPPORT
