            term:
              id: MONDO:0011397
              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: DNMT1 Exon 21 RFTS Domain Missense Variant
        role: trigger
        biological_scale: MOLECULAR
        description: A single heterozygous germline missense variant in exon 21 of DNMT1 alters the C-terminal
          portion of the replication foci targeting sequence (RFTS, also called targeting sequence or
          TS) domain of DNA methyltransferase 1, the sole maintenance methyltransferase that restores
          symmetrical CpG methylation on hemimethylated DNA after replication and during DNA repair. The
          recurrent ADCA-DN alleles p.Ala570Val, p.Gly605Ala, and p.Val606Phe cluster in close spatial
          proximity within this region. Variant position within the same TS domain is what separates ADCA-DN
          from allelic HSAN1E, whose variants lie in the N-terminal-to-middle part of the domain, most
          often in exon 20.
        gene:
          preferred_term: DNMT1
          term:
            id: hgnc:2976
            label: DNMT1
        molecular_functions:
        - preferred_term: DNA (cytosine-5-)-methyltransferase activity
          term:
            id: GO:0003886
            label: DNA (cytosine-5-)-methyltransferase activity
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Our results indicate that all the mutations causal for HSAN1E are located in the middle
          part or N-terminus end of the TS domain, whereas all the mutations causal for autosomal dominant
          cerebellar ataxia, deafness and narcolepsy are located in the C-terminus end of the TS domain.
        supports: SUPPORT
