      about:
        disease:
          name: Autosomal Dominant Cerebellar Ataxia Deafness and Narcolepsy
          disease_term:
            preferred_term: autosomal dominant cerebellar ataxia, deafness and narcolepsy
            term:
              id: MONDO:0011397
              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_adcadn_no_disease_modifying_therapy
        prompt: Is there any tractable disease-modifying strategy for ADCA-DN, given that the mechanism
          combines impaired maintenance methylation with potentially toxic mutant-protein species?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Mutant DNMT1 Mislocalization and Aggresome Formation
        rationale: No approved or investigational disease-modifying drug, gene therapy, RNA therapy, or
          epigenome-editing treatment exists for ADCA-DN, and no disease-specific interventional clinical
          trial has been registered. The mechanism is not a clean loss of function, so simple gene supplementation
          is unlikely to be sufficient and broad DNMT inhibition would be expected to be harmful. Allele-selective
          silencing of the mutant transcript, or pharmacological correction of mutant-protein mislocalization
          and aggresome formation, are the mechanistically plausible directions but neither has been attempted.
        proposed_experiments:
        - experiment_id: exp_adcadn_allele_selective_knockdown_in_patient_neurons
          name: Allele-selective mutant DNMT1 knockdown in patient-derived induced neurons
          description: In induced neurons from ADCA-DN patients carrying p.Ala570Val, p.Gly605Ala, or
            p.Val606Phe, apply allele-selective antisense oligonucleotides or base editing to reduce the
            mutant transcript while preserving the wild-type allele, then measure DNMT1 subcellular localization,
            aggresome burden, autophagic flux, and reversal of the patient methylome and transcriptome
            signature.
          decision_criterion: Normalization of DNMT1 localization and of the patient methylome and transcriptome
            signature without loss of total maintenance methylation would support allele-selective knockdown
            as a therapeutic direction.
      selected_evidence:
        snippet: Our results suggest mutations in DNMT1 result in imbalanced protein homeostasis through
          aggresome-induced autophagy.
        supports: SUPPORT
