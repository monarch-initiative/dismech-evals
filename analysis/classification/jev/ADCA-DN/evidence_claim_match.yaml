      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: RARE
        notes: No population prevalence or incidence estimate exists for ADCA-DN. The published evidence
          base consists of a small number of individual pedigrees and case reports from European, Brazilian,
          Taiwanese, Canadian, and other populations, so the entity is best described qualitatively as
          rare with a worldwide distribution and no ancestry restriction. Orphanet records no epidemiological
          class for ORPHA:314404. RARE rather than ULTRA_RARE is used here because no source quantifies
          the rate; the qualitative band is the most that the literature supports.
      selected_evidence:
        snippet: The Brazilian patient reported here further adds to the worldwide distribution of ADCA-DN.
        supports: SUPPORT
