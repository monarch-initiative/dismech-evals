  624f5cf94451626f1bd0303542ea88b05e95fb1bab8874603077f0558f68f5b5:
    claim:
      about:
        disease:
          name: Autosomal Dominant Cerebellar Ataxia Deafness and Narcolepsy
          disease_term:
            preferred_term: autosomal dominant cerebellar ataxia, deafness and narcolepsy
            term:
              id: MONDO:0011397
              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: open_adcadn_module_conformance_declined
        prompt: Which cell populations actually degenerate in the ADCA-DN cerebellum and auditory system,
          and would that support conformance to the cerebellar_purkinje_degeneration and sensorineural_hair_cell_loss
          modules?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Cerebellar Degeneration
        - pathophysiology#Auditory Pathway Degeneration
        rationale: Conformance to both modules was evaluated and declined. The cerebellar_purkinje_degeneration
          module turns on Purkinje neuron degeneration as its central effector, but the only ADCA-DN cerebellar
          data are MRI atrophy and a raised MR spectroscopy myo-inositol signal, which reflects glial
          density rather than Purkinje loss; no autopsy series exists. The sensorineural_hair_cell_loss
          module turns on hair cell mechanotransduction failure and death, whereas the ADCA-DN deafness
          is described as sensory neuronal and is accompanied by attenuated brainstem auditory evoked
          potentials, which points to auditory-neural or retrocochlear rather than hair cell pathology.
          Declaring conformance in either case would assert an effector cell type that has not been demonstrated.
          Both decisions should be revisited if neuropathological or temporal-bone data appear.
        proposed_experiments:
        - experiment_id: exp_adcadn_cerebellar_and_temporal_bone_neuropathology
          name: Cerebellar and temporal-bone neuropathology in ADCA-DN donors
          description: In ADCA-DN brain and temporal-bone donations, perform calbindin and parvalbumin
            immunohistochemistry with stereological Purkinje cell counts and Bergmann glia assessment
            in the cerebellar cortex, and cytocochleogram analysis of inner and outer hair cells together
            with spiral ganglion neuron counts in the temporal bone.
          decision_criterion: Significant Purkinje cell loss relative to age-matched controls would justify
            conformance to cerebellar_purkinje_degeneration; a hair-cell-loss cytocochleogram pattern
            would justify conformance to sensorineural_hair_cell_loss, whereas isolated spiral ganglion
            or auditory nerve loss would confirm the retrocochlear interpretation and the decision to
            decline.
      selected_evidence:
        snippet: Electrophysiological studies revealed that visual evoked potentials were attenuated with
          prolonged latencies in both eyes, and brainstem auditory and somatosensory evoked potentials
          were also attenuated.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32984563
      reference_title: 'Autosomal dominant cerebellar ataxia, deafness, and narcolepsy with amenorrhea,
        subclinical optic atrophy, and electroencephalographic abnormality: A case report.'
      evidence_source: HUMAN_CLINICAL
      explanation: The attenuated brainstem auditory evoked potentials are the evidence that points away
        from a purely cochlear hair cell lesion.
