            gene_term:
              preferred_term: DNMT1
              term:
                id: hgnc:2976
                label: DNMT1
            association: Causative
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            presence: Present
            features: ADCA-DN is caused by heterozygous germline missense variants in DNMT1 (19p13.2),
              which encodes the sole maintenance DNA methyltransferase. The ADCA-DN alleles cluster in
              exon 21, encoding the C-terminal part of the replication foci targeting sequence (RFTS/TS)
              domain. The recurrent alleles are p.Ala570Val, p.Gly605Ala, and p.Val606Phe; additional
              exon-21 alleles include p.Cys596Arg, p.Glu575Lys, and p.Glu578Lys. Position within the TS
              domain is the principal genotype-phenotype determinant separating ADCA-DN from allelic HSAN1E.
              No disease-causing chromosomal abnormality, repeat expansion, mitochondrial variant, or
              validated modifier gene has been established, and population allele frequencies for the
              individual variants are not reported.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: TS-domain positional genotype-phenotype correlation
        description: 'Variant position within the DNMT1 targeting-sequence domain separates the two allelic
          phenotypes: ADCA-DN alleles occupy the C-terminal end of the domain (exon 21) whereas HSAN1E
          alleles occupy the middle or N-terminal part (often exon 20, with Tyr495 a hot spot). The correlation
          is strong but not absolute, since expanding case series describe overlapping phenotypes and
          at least one allele outside the domain.'
      selected_evidence:
        snippet: Amino acid Tyr495 is a hot spot for HSAN1E, distinct from exon 21 mutations associated
          with narcolepsy.
        supports: SUPPORT
