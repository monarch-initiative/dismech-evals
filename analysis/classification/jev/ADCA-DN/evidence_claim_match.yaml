        context: []
      assertion_type: Definition
      assertion:
        name: ADCA-DN clinical case definition
        definition_type: CASE_DEFINITION
        derivation_basis: ESTABLISHED_CRITERIA
        description: Adult-onset (typically 30 to 40 years) progressive cerebellar ataxia, sensory neuronal
          (sensorineural) deafness, and narcolepsy with cataplexy, with dementia developing later, in
          an individual carrying a heterozygous DNMT1 variant in the C-terminal part of the targeting-sequence
          domain (classically exon 21). There are no independently validated formal diagnostic criteria;
          molecular confirmation is central, and the full triad may not be present at onset.
      selected_evidence:
        snippet: Autosomal dominant cerebellar ataxia, deafness and narcolepsy (ADCA-DN) is characterized
          by late onset (30-40 years old) cerebellar ataxia, sensory neuronal deafness, narcolepsy-cataplexy
          and dementia.
        supports: SUPPORT
