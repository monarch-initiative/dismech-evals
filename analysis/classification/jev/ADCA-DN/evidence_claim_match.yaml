        name: Cerebrospinal fluid hypocretin-1
        presence: Decreased
        context: CSF hypocretin-1 (orexin-A) supports the narcolepsy component but, unlike sporadic narcolepsy
          type 1, it is not uniformly deficient in DNMT1 disease. Reported values in genetically confirmed
          patients span low, intermediate, and normal, and can remain normal even as polysomnographic
          abnormalities progress. A normal value therefore does not exclude ADCA-DN.
      selected_evidence:
        snippet: During the 4 years of follow-up her walking ability declined, she became more somnolent
          and repeated PSG documented REM sleep latency shortening, and finally the evidence of de novo
          spontaneous SOREMPs, although normal CSF hrct-1 at second revaluation.
        supports: SUPPORT
