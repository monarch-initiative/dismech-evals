              id: MONDO:0011397
              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Treatment
      assertion:
        name: Symptomatic narcolepsy pharmacotherapy
        description: Excessive daytime somnolence and cataplexy are managed with standard narcolepsy therapy
          under a sleep specialist, typically a wake-promoting agent such as modafinil with anticataplectic
          treatment where needed, plus scheduled naps, driving and occupational risk counseling, and avoidance
          of sedating drugs. No ADCA-DN-specific efficacy study or interventional trial exists; this is
          extrapolated from idiopathic narcolepsy and is symptomatic only. Broad DNA methyltransferase
          inhibitors used in oncology are not a rational therapy here, because systemic interference with
          maintenance methylation could be harmful and the disease mechanism includes both deficient function
          and potentially toxic mutant-protein species.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: modafinil
            term:
              id: CHEBI:31859
              label: modafinil
        target_phenotypes:
        - preferred_term: Excessive daytime somnolence
          term:
            id: HP:0001262
            label: Excessive daytime somnolence
        - preferred_term: Cataplexy
          term:
            id: HP:0002524
            label: Cataplexy
        notes: No published ADCA-DN cohort reports treatment response rates for wake-promoting or anticataplectic
          agents.
      selected_evidence:
        snippet: No cure for DNMT1 disorder currently exists.
        supports: SUPPORT
