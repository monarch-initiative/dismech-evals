      assertion_type: ProgressionInfo
      assertion:
        phase: Presymptomatic carrier
        age_range: Third decade (documented in carriers aged 23 and 28)
        notes: Clinically unaffected DNMT1 variant carriers can already show sleep-onset REM periods on
          polysomnography and increased cerebellar myo-inositol on proton MR spectroscopy, while neurological
          examination, audiometry, ophthalmological evaluation, and structural brain MRI remain normal.
          These are promising early markers observed in only two carriers and are not validated screening
          biomarkers.
