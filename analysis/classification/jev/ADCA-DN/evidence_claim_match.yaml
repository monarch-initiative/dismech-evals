        description: Cochlear implantation is the clearest reported intervention with an objectively measured
          benefit in DNMT1-complex disorder, and may be considered for ADCA-DN when amplification becomes
          inadequate. Direct ADCA-DN-specific outcome evidence is not available.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: cochlear device implantation
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        target_phenotypes:
        - preferred_term: Sensorineural hearing impairment
          term:
            id: HP:0000407
            label: Sensorineural hearing impairment
        notes: Evidence scoping caveat. Both reported implanted patients carried DNMT1 targeting-sequence
          variants outside the classical exon-21 ADCA-DN cluster (p.T497P and p.Cys430Tyr) and were described
          within DNMT1-complex disorder or HSN1E. The benefit is therefore established for DNMT1-related
          sensorineural hearing loss broadly, and extrapolated to ADCA-DN.
      selected_evidence:
        snippet: Case 4 (p.T497P) underwent left cochlear implant, resulting in significant hearing improvements
          at all tested frequencies (250-6,000 Hz).
        supports: SUPPORT
