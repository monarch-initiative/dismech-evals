      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        inheritance_term:
          preferred_term: autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: UNKNOWN
        expressivity: VARIABLE
        description: 'ADCA-DN is transmitted as an autosomal dominant trait caused by a single heterozygous
          DNMT1 missense allele. Onset is strongly age dependent, so penetrance cannot be estimated reliably
          from the small published pedigrees and is recorded as unknown rather than complete. Expressivity
          is variable even within one family: in a three-generation kindred carrying p.Ala570Val, the
          presenting features, presence of cataplexy, and age at onset differed markedly between generations.
          De novo variants occur, so a negative family history does not exclude the diagnosis.'
      selected_evidence:
        snippet: DNMT1 disorder is inherited in an autosomal dominant manner. Most affected individuals
          have an affected parent; the proportion of affected individuals with a de novo DNMT1 pathogenic
          variant is unknown.
        supports: SUPPORT
