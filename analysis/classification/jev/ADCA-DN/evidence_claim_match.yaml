  febaf496e0bd1da5b00cff516407ef490c935cb1522cd5211df5fdd4a141e4cd:
    claim:
      about:
        disease:
          name: Autosomal Dominant Cerebellar Ataxia Deafness and Narcolepsy
          disease_term:
