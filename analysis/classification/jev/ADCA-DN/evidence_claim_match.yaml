          disease_term:
            preferred_term: autosomal dominant cerebellar ataxia, deafness and narcolepsy
            term:
              id: MONDO:0011397
              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_adcadn_natural_history_scoped_to_hsan1e
        prompt: What are the ADCA-DN-specific age at onset, survival, and rate of cognitive decline, as
          opposed to the figures derived from HSAN1E and mixed DNMT1-complex cohorts?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Selective Central and Peripheral Neurodegeneration
        rationale: The most frequently quoted DNMT1 natural-history numbers (mean onset 37.7 years, average
          survival 53.6 years, significant cognitive deficit in 89 percent by age 45) come from a cohort
          of nine HSAN1E kinships comprising 45 affected subjects. In the source abstract these figures
          are attributed explicitly to HSAN1E, not to ADCA-DN. Because HSAN1E and ADCA-DN are discrete
          clinical entities with different variant positions within the same domain, these values are
          deliberately not recorded as ADCA-DN prevalence, progression, or prognosis in this entry. No
          registry-scale ADCA-DN natural history cohort exists, and no variant-specific penetrance estimate
          is available.
        proposed_experiments:
        - experiment_id: exp_adcadn_international_natural_history_registry
          name: International DNMT1 registry stratified by targeting-sequence variant position
          description: Assemble an international registry of genetically confirmed DNMT1 patients with
            prospective standardized assessment of ataxia scales, audiometry, polysomnography, neuropsychology,
            and survival, analyzed with strata defined by variant position within the targeting-sequence
            domain (C-terminal/exon 21 versus middle and N-terminal/exon 20) rather than by clinical label
            alone.
          decision_criterion: Stratified onset, survival, and cognitive-decline curves that differ significantly
            between variant-position strata would establish ADCA-DN-specific natural history and confirm
            that pooled DNMT1 figures are not transferable.
      selected_evidence:
        snippet: The average survival of HSAN1E was 53.6 years.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25678562
      reference_title: Defects of mutant DNMT1 are linked to a spectrum of neurological disorders.
