            term:
              id: MONDO:0011397
              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Relief of RFTS Autoinhibition and DNMT1 Destabilization
        biological_scale: MOLECULAR
        description: The RFTS domain normally folds back into the catalytic pocket and acts as an endogenous
          inhibitor of DNMT1 activity. ADCA-DN missense substitutions in this domain weaken that intramolecular
          interaction. Purified mutant enzyme shows markedly reduced thermal stability, a 2.5 to 3.5-fold
          increase in DNA binding affinity, and weakened RFTS-mediated inhibition of methylation activity.
          In knock-in mouse models of the allelic HSAN1E substitutions the destabilized protein is additionally
          susceptible to proteolytic cleavage within the RFTS domain, generating a truncated species,
          and steady-state DNMT1 protein is reduced in heterozygotes. The disease mechanism is therefore
          not simple haploinsufficiency but a mixture of impaired regulation, reduced stability, and potentially
          toxic mutant-protein species.
        molecular_functions:
        - preferred_term: DNA (cytosine-5-)-methyltransferase activity
          term:
            id: GO:0003886
            label: DNA (cytosine-5-)-methyltransferase activity
          modifier: ABNORMAL
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Taken together, these data suggest these disease-associated mutations decrease protein
          stability and, at least partially, relieve normal RFTS-mediated autoinhibition of DNMT1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
