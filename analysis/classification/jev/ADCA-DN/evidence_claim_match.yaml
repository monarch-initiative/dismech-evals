  2464c3b9246e37f07288d4947c96a37ea511ba38fe6aef4acb3ab40308a06e0f:
    claim:
      about:
        disease:
          name: Autosomal Dominant Cerebellar Ataxia Deafness and Narcolepsy
          disease_term:
            preferred_term: autosomal dominant cerebellar ataxia, deafness and narcolepsy
            term:
              id: MONDO:0011397
              label: autosomal dominant cerebellar ataxia, deafness and narcolepsy
        context: []
      assertion_type: Genetic
      assertion:
        name: DNMT1
        gene_term:
          preferred_term: DNMT1
          term:
            id: hgnc:2976
            label: DNMT1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Present
        features: ADCA-DN is caused by heterozygous germline missense variants in DNMT1 (19p13.2), which
          encodes the sole maintenance DNA methyltransferase. The ADCA-DN alleles cluster in exon 21,
          encoding the C-terminal part of the replication foci targeting sequence (RFTS/TS) domain. The
          recurrent alleles are p.Ala570Val, p.Gly605Ala, and p.Val606Phe; additional exon-21 alleles
          include p.Cys596Arg, p.Glu575Lys, and p.Glu578Lys. Position within the TS domain is the principal
          genotype-phenotype determinant separating ADCA-DN from allelic HSAN1E. No disease-causing chromosomal
          abnormality, repeat expansion, mitochondrial variant, or validated modifier gene has been established,
          and population allele frequencies for the individual variants are not reported.
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        variants:
        - name: Exon 21 TS-domain missense cluster (p.Ala570Val, p.Gly605Ala, p.Val606Phe)
          description: The three recurrent ADCA-DN alleles identified in the discovery study, all conserved
            missense substitutions in exon 21 lying in close spatial proximity within the C-terminal part
            of the targeting-sequence domain. p.Ala570Val has since been reported repeatedly, including
            in a six-affected Canadian family and a three-generation Spanish family.
          clinical_significance: PATHOGENIC
          type: missense variant
          functional_effects:
          - function: DNA (cytosine-5-)-methyltransferase regulation by the RFTS domain
            description: The substitutions destabilize DNMT1 and relieve RFTS-mediated autoinhibition,
              so the net effect combines impaired maintenance methylation with abnormal, potentially toxic
              mutant protein rather than a clean loss of enzyme activity.
            type: loss-of-function
          - function: mutant DNMT1 protein handling
            description: Mutant protein mislocalizes to the cytoplasm, forms aggresomes, and in RFTS knock-in
              models is internally cleaved, which has been interpreted as a toxic gain of function superimposed
              on reduced activity.
            type: gain-of-function
        - name: Additional exon 21 alleles (p.Cys596Arg, p.Glu575Lys, p.Glu578Lys)
          description: Further pathogenic or likely pathogenic exon-21 substitutions reported in single
            ADCA-DN patients or families, including a de novo p.Cys596Arg in a Brazilian patient, p.Glu575Lys
            segregating with disease in an Italian mother and daughter, and p.Glu578Lys in a Taiwanese
            patient.
          clinical_significance: LIKELY_PATHOGENIC
          type: missense variant
        - name: TS-domain positional genotype-phenotype correlation
          description: 'Variant position within the DNMT1 targeting-sequence domain separates the two
            allelic phenotypes: ADCA-DN alleles occupy the C-terminal end of the domain (exon 21) whereas
            HSAN1E alleles occupy the middle or N-terminal part (often exon 20, with Tyr495 a hot spot).
            The correlation is strong but not absolute, since expanding case series describe overlapping
            phenotypes and at least one allele outside the domain.'
      selected_evidence:
        snippet: We performed exome sequencing in five individuals from three ADCA-DN kindreds and identified
          DNMT1 as the only gene with mutations found in all five affected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22328086
      reference_title: Mutations in DNMT1 cause autosomal dominant cerebellar ataxia, deafness and narcolepsy.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes DNMT1 as the causal gene by exome sequencing across three independent ADCA-DN
        kindreds.
