        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Regional Cortical Patterning Dependence on GPR56 Expression
        description: 'GPR56 is expressed in cortical progenitor cells in a regionally restricted, promoter-controlled
          pattern, and its expression levels regulate progenitor proliferation. A 15-base-pair deletion
          in a region-specific regulatory element selectively disrupts lateral/perisylvian cortex and
          represents a related ADGRG1 allelic phenotype, whereas classic BFPP is usually frontoparietal
          or follows an anterior-posterior severity gradient. Regional control is important but not absolute:
          rare coding-variant cases with diffuse polymicrogyria without a clear gradient have been reported.'
        genes:
        - preferred_term: ADGRG1
          term:
            id: hgnc:4512
            label: ADGRG1
        cell_types:
        - preferred_term: cortical progenitor cell
          term:
            id: CL:0000047
            label: neural stem cell
        biological_processes:
        - preferred_term: cerebral cortex regionalization
          term:
            id: GO:0021796
            label: cerebral cortex regionalization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Magnetic resonance imaging revealed diffuse polymicrogyria with relative sparing of the
          anterior temporal lobes, without an anterior-posterior gradient, diffuse hypomyelination and
          pontine and cerebellar hypoplasia.
        supports: SUPPORT
