      assertion_type: Pathophysiology
      assertion:
        name: Impaired Oligodendrocyte Precursor Proliferation and Maturation
        description: GPR56 is highly expressed in oligodendrocyte precursor cells and signals through
          RhoA to maintain their proliferation. Constitutive or OPC-conditional Gpr56 loss reduces active
          RhoA, causes premature cell-cycle exit, lowers the numbers of mature oligodendrocytes and myelinated
          axons, and produces early CNS hypomyelination. This is a cell-autonomous white-matter branch
          rather than a consequence assigned solely to cortical dyslamination.
        genes:
        - preferred_term: ADGRG1
          term:
            id: hgnc:4512
            label: ADGRG1
        cell_types:
        - preferred_term: oligodendrocyte precursor cell
          term:
            id: CL:0002453
            label: oligodendrocyte precursor cell
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        locations:
        - preferred_term: brain white matter
          term:
            id: UBERON:0003544
            label: brain white matter
        biological_processes:
        - preferred_term: Rho protein signal transduction
          term:
            id: GO:0007266
            label: Rho protein signal transduction
          modifier: DECREASED
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: DECREASED
        - preferred_term: myelination
          term:
            id: GO:0042552
            label: myelination
          modifier: DECREASED
      selected_evidence:
        snippet: Gpr56-knockout mice manifest with decreased oligodendrocyte precursor cell (OPC) proliferation
          and diminished levels of active RhoA, leading to fewer mature oligodendrocytes and a reduced
          number of myelinated axons in the corpus callosum and optic nerves.
        supports: SUPPORT
