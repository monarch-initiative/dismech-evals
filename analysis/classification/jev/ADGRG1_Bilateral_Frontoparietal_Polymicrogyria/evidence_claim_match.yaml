              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Disrupted GPR56-Collagen III Signaling
        description: Reduced receptor availability and function diminish the independently established
          collagen III-GPR56 pathway that normally restrains neuronal migration.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Here we identify collagen, type III, alpha-1 (gene symbol Col3a1) as the ligand of GPR56
          through an in vitro biotinylation/proteomics approach.
        supports: SUPPORT
