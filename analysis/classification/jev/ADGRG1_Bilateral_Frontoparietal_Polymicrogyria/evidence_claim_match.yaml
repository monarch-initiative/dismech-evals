              receptor expressed in cortical radial glial progenitors and their basal endfeet, impair
              receptor function. Missense variants analyzed in PMID:21349848 were located in the extracellular
              region (ectodomain, GPS autoproteolysis site and extracellular loops) and affected different
              combinations of surface expression, proteolysis, shedding, ligand interaction and membrane
              distribution. These heterogeneous defects converge on reduced GPR56 function as the initiating
              molecular lesion of BFPP.
