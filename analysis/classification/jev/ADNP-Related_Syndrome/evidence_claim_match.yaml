      assertion:
        hypothesis_group_id: allele_specific_haploinsufficiency_branch
        hypothesis_label: Allele-Specific ADNP Haploinsufficiency Branch
        status: CANONICAL
        description: True ADNP haploinsufficiency is experimentally confirmed for a non-coding splice-acceptor
          deletion that causes exon skipping and no detectable truncated protein. This branch is allele
          specific and is not generalized to the common last-exon truncating variants.
      selected_evidence:
        snippet: An N-terminal truncated protein could not be detected in transfection experiments with
          a mutant expression vector in HEK293T cells, strongly suggesting this is a first confirmed diagnosis
          exclusively due to haploinsufficiency of the ADNP gene.
        supports: SUPPORT
