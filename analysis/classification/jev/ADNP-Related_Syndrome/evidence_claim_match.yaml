        prompt: 'What are the age-specific developmental trajectories, true frequency and domains of regression,
          adult outcomes, and nonprogressive versus progressive subgroups in ADNP-related syndrome?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Global Developmental Delay
        - phenotypes#Speech Delay
        - phenotypes#Motor Delay
        rationale: 'The main cohort was young and cross-sectional. Apparent skill loss was reported in
          12 children without a feature-specific denominator, so a globally progressive or neurodegenerative
          label is not justified.

          '
        proposed_experiments:
        - experiment_id: exp_adnp_longitudinal_natural_history
          name: Allele-stratified longitudinal ADNP natural-history cohort
          description: 'Follow children and adults prospectively with standardized developmental, adaptive,
            speech, motor, behavioral, sleep, seizure, sensory, growth, and organ-system measures, recording
            acquisition and loss of individual skills and stratifying by allele position, NMD prediction,
            episignature group, age, and sex.

            '
          decision_criterion: 'Classify regression or progression only from repeated within-person decline
            exceeding measurement variability, with domain-specific denominators and age-specific incidence;
            otherwise retain a variable lifelong neurodevelopmental course.

            '
      selected_evidence:
        snippet: 'Apparent loss of acquired abilities was reported in 12 children for skills such as speaking,
          counting, riding a bicycle, or being toilet trained.

          '
        supports: SUPPORT
