          whereas most common human alleles escape NMD. Several mouse phenotypes are sex dependent, and
          the 2026 frameshift study tested only males.

          '
      selected_evidence:
        snippet: 'While it is tempting to draw parallels between the clinical presentation of patients
          and the abnormalities observed in the mouse model, it should be stressed that the model described
          is a full deletion and the mutational mechanism of the Helsmoortel–Van der Aa syndrome has not
          been fully established.

          '
        supports: SUPPORT
