                disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_adnp_allele_specific_molecular_mechanism
        prompt: 'For common NMD-escaping truncating alleles, does disease result from reduced effective
          ADNP function, dominant interference, toxic gain of function, or an allele-specific mixture,
          and how does that compare with confirmed true-null and emerging missense alleles?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#NMD-Escaping Mutant ADNP Transcripts
        - pathophysiology#Allele-Specific ADNP Haploinsufficiency
        - pathophysiology#ADNP Chromatin-Complex Dysfunction
        - pathophysiology#Heterozygous ADNP Pathogenic Variation
        - mechanistic_hypotheses#nmd_escape_truncation_branch
        - mechanistic_hypotheses#allele_specific_haploinsufficiency_branch
        rationale: 'Mutant RNA is demonstrable for common last-exon alleles, but mutant protein has not
          been unambiguously demonstrated in patients. A splice allele proves true haploinsufficiency
          can cause disease, while p.C687R supplies limited gain-of-function-like experimental evidence.
          Therapy and model selection therefore require allele-stratified mechanism.

          '
        proposed_experiments:
        - experiment_id: exp_adnp_isogenic_allele_mechanism_panel
          name: Isogenic ADNP allele-mechanism panel in human neural lineages
          description: 'Create isogenic human iPSC lines carrying representative NMD-escaping truncations,
            the confirmed splice-null allele, p.C687R, matched knockouts, corrected controls, and allele-specific
            mutant knockdown. Compare allele-specific RNA and proteomics, ADNP localization and chromatin
            occupancy, methylome/transcriptome states, microtubule dynamics, neuronal differentiation,
            dendritic spines, and synaptic physiology, with wild-type addback and mutant-selective suppression
            arms.

            '
          decision_criterion: 'Support a dominant or toxic mutant mechanism only if an NMD-escaping or
            missense allele produces effects exceeding matched dosage loss and those effects are preferentially
            rescued by mutant-selective suppression; support pure dosage loss when matched knockout and
            variant phenotypes align and wild-type addback rescues both.

            '
          would_support:
          - pathophysiology#NMD-Escaping Mutant ADNP Transcripts
          - pathophysiology#Allele-Specific ADNP Haploinsufficiency
      selected_evidence:
        snippet: Most of these mutations are situated in the last exon and we previously demonstrated
          escape from nonsense-mediated decay by detecting mutant ADNP mRNA in patient blood.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
