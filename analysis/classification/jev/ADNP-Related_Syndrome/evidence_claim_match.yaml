            term:
              id: MONDO:0014379
              label: ADNP-related multiple congenital anomalies - intellectual disability - autism spectrum
                disorder
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: nmd_escape_truncation_branch
        hypothesis_label: NMD-Escaping Truncation Branch
        status: ALTERNATIVE
        description: 'Most pathogenic last-exon truncating variants escape nonsense-mediated decay and
          produce mutant transcript; mutant ADNP mRNA is directly detectable in patient blood. Whether
          their downstream effect is functional insufficiency, dominant interference, toxic gain of function,
          or a mixture remains unresolved. That is not simply for want of looking: a systematic western
          assessment across patient-derived materials and multiple antibodies found no detectable mutant
          ADNP protein and read the result as degradation or absence, which cuts against a stable mutant
          product being the effector. The branch is better read as a candidate modifier on a dosage-loss
          baseline than as a symmetric competitor to it.'
      selected_evidence:
        snippet: as many mutations cluster in the fifth and last exon and escape from NMD has been demonstrated,
          the majority of patients might still produce protein. Thought it needs to be mentioned that
          mutated protein has never been unambiguously demonstrated in patients, an additional gain of
          toxic function of the mutant protein, if present, could also be envisaged
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36945042
      reference_title: Chromatin remodeler Activity-Dependent Neuroprotective Protein (ADNP) contributes
        to syndromic autism.
      evidence_source: OTHER
      explanation: This review defines the unresolved mechanism of the common NMD-escaping truncation
        branch and explicitly separates mutant transcript from proof of mutant protein.
