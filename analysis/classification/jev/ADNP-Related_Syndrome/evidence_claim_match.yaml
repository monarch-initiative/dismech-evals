        association: Causative
        presence: Positive
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Heterozygous pathogenic ADNP variants are usually de novo and predominantly protein truncating.
          Most variants in the main cohort lie in the last exon and are predicted to escape NMD, so they
          should not be labeled uniformly haploinsufficient. Rare true-null alleles establish an allele-specific
          haploinsufficiency branch. Emerging missense alleles require variant-specific functional evidence
          and should not be generalized from a single experimental system. The recurrent p.Tyr719* allele
          was associated with later walking and higher pain threshold in the main cohort, but a blanket
          claim of globally greater severity is not retained.

          '
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: 'ADNP-related syndrome is autosomal dominant. Most molecularly tested cases are
            de novo, with rare inheritance from an apparently unaffected parent.

            '
      selected_evidence:
        snippet: 'Here, we report ten patients with ASD and other shared clinical characteristics, including
          intellectual disability and facial dysmorphisms caused by a mutation in ADNP, a transcription
          factor involved in the SWI/SNF remodeling complex.

          '
        supports: SUPPORT
