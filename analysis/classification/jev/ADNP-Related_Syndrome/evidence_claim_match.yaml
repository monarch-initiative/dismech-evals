        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous ADNP Pathogenic Variation
        description: The initiating lesion is a heterozygous pathogenic ADNP variant. Most established
          alleles are protein-truncating and usually de novo, but their molecular consequences differ
          by position and RNA processing. This root therefore represents pathogenic variation without
          presupposing uniform haploinsufficiency.
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: ADNP
          term:
            id: hgnc:15766
            label: ADNP
        genetic_context:
          gene:
            preferred_term: ADNP
            term:
              id: hgnc:15766
              label: ADNP
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: UNKNOWN
          description: 'De novo heterozygous ADNP alleles, mostly last-exon truncations that escape nonsense-mediated
            decay. Recorded as UNKNOWN: true haploinsufficiency is demonstrated only for a splice allele
            (mechanistic_hypotheses#allele_specific_haploinsufficiency_branch), mutant protein has never
            been unambiguously shown in patients carrying the common truncations (mechanistic_hypotheses#nmd_escape_truncation_branch),
            and one missense allele shows gain-of-function-like behaviour in vitro. The gap_adnp_allele_specific_molecular_mechanism
            discussion records the allele-stratified experiment that would resolve this.'
      selected_evidence:
        snippet: We found 46 unique mutations on the DNA level, of which 25 were nonsense and 21 frameshift
          (Supplemental Table S2). All but three mutations were located in the fifth and last exon of
          the ADNP gene and were predicted to escape nonsense-mediated decay.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29724491
      reference_title: Clinical Presentation of a Complex Neurodevelopmental Disorder Caused by Mutations
