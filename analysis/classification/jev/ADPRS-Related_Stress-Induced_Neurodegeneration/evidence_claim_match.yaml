            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Episodic Stepwise Neurological Deterioration
        biological_scale: ORGANISM
        description: 'The integrated clinical phenotype: not a smooth degenerative slope but a staircase,
          in which a febrile illness or other stressor produces an acute episode of ataxia, dystonia,
          seizures or encephalopathy from which recovery is partial. Between episodes the child may appear
          stable for months. The pattern explains two things that otherwise look contradictory in the
          literature - the frequent early misdiagnosis as episodic ataxia, an ion-channel disorder or
          an acute post-infectious cerebellitis, and the coexistence in the same disease of patients who
          die at 2 years and patients who reach 40. Whether variation in stressor exposure, residual ARH3
          activity or another modifier explains that range remains unknown.'
      selected_evidence:
        snippet: She had three more severe episodes in recent years, and her neurologic findings got progressively
          worse.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/1
