      assertion_type: Pathophysiology
      assertion:
        name: Physiological Stressor
        biological_scale: ORGANISM
        description: The exogenous trigger, and the feature that names the disorder. Febrile illness and
          infection are by far the commonest, but the reported list also includes surgery, trauma, diarrhoea,
          physical exercise, emotional stress and cold-water immersion. A trigger was documented in 59.5%
          of the 47 pooled published patients, which is a floor rather than an estimate because triggers
          are recorded only when someone thought to ask. The mechanistic bridge assumed throughout the
          field is that these states raise cellular oxidative and genotoxic burden and therefore PARP1
          activity; that bridge is supported by model-system surrogates (hydrogen peroxide, ischaemia
          reperfusion) rather than by any direct measurement during a human febrile episode, and the honest
          strength of the link is stated in the discussions section.
        triggers:
        - preferred_term: Febrile illness
        - preferred_term: Infection
        - preferred_term: Surgery
        - preferred_term: Trauma
        - preferred_term: Physical exertion
        - preferred_term: Cold water immersion
      selected_evidence:
        snippet: A distinctive feature of this condition is the exacerbation of clinical symptoms triggered
          by physical or emotional stress, as well as febrile illnesses.
        supports: SUPPORT
