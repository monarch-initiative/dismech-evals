            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing with bi-allelic ADPRS variant interpretation
        description: 'Molecular diagnosis rests on identifying bi-allelic ADPRS variants against transcript
          NM_017825.2/NM_017825.3, and there are three interpretation points that follow from the published
          allelic spectrum. First, a conservative-looking missense change must not be dismissed: several
          of the best-characterised alleles are missense and abolish detectable protein. Second, the gene
          appears in older variant-call pipelines and databases under ADPRHL2, so a filter keyed on the
          current symbol alone can miss an existing annotation. Third, parental testing is required to
          establish that two variants are in trans, since heterozygotes are unaffected; and the historical
          predominance of homozygous genotypes reflects consanguineous ascertainment and must not be used
          as an argument against a compound heterozygous call.'
      selected_evidence:
        snippet: 'we identified two novel compound heterozygous ADPRS variants: NM_017825.3:c.580C>T (p.Gln194Ter)
          and NM_017825.3:c.803-1G>A'
        supports: SUPPORT
