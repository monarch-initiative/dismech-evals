  aad6fa9ab4300989188059367854e23849cdab7ef22ef8bdf1a80cd8b360ac7a:
    claim:
      about:
        disease:
          name: ADPRS-Related Stress-Induced Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and
              seizures
            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Drosophila melanogaster
        genotype: Loss of the Drosophila Parg paralog, with human ADPRHL2 rescue
        category: Loss-of-function with cross-species rescue
        description: 'The model that established functional conservation and produced the first therapeutic
          lead. Loss of the fly Parg paralog causes lethality specifically in response to oxidative challenge
          - not at baseline - which reproduces the stress-conditional character of the human disease more
          faithfully than any other model. Two rescues were performed: expression of human ADPRHL2 rescued
          the lethality, establishing that the human protein performs the conserved function; and pharmacological
          PARP inhibition also rescued it, establishing that the lethality runs through PARP activity
          and is therefore druggable.

          An important limitation is in the model''s own construction: the gene deleted is the Drosophila
          Parg paralog, not a fly orthologue of ADPRHL2, and Drosophila does not separate the PARG and
          ARH3 activities the way mammals do. The model therefore tests the pathway rather than the gene,
          and the rescue by human ADPRHL2 is what licenses reading it as a model of this disorder. It
          also has no nervous-system phenotype corresponding to ataxia, seizures or neuropathy - the read-out
          is organismal lethality.'
        associated_phenotypes:
        - Lethality on oxidative challenge
        - Rescue by human ADPRHL2 expression
        - Rescue by pharmacological PARP inhibition
      selected_evidence:
        snippet: Loss of the Drosophila paralog Parg showed lethality in response to oxidative challenge
          that was rescued by human ADPRHL2, suggesting functional conservation.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
