        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Distal Axonal Degeneration of Peripheral Nerve
        biological_scale: TISSUE
        description: 'A length-dependent axonal, often sensorimotor, polyneuropathy is a core part of
          the phenotype and was prominent enough in one series that ADPRHL2 homozygotes were identified
          in a cohort assembled for hereditary motor neuropathy rather than for neurodegeneration. Nerve
          conduction studies show axonal loss with relatively preserved conduction velocity; distal weakness,
          foot drop, pes cavus and hammer toes follow. The neuropathy is a genuine discriminator: it is
          what separates this disorder from the purely cerebellar ataxias in the differential, and its
          presence in a child with stress-triggered ataxia should redirect testing towards ADPRS.'
        conforms_to: peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination
        locations:
        - preferred_term: peripheral nerve
          term:
            id: UBERON:0001021
            label: nerve
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        notes: 'Conformance is declared to the axonal arm of `peripheral_axonal_degeneration` only. The
          module''s demyelination arm (myelination and axon ensheathment DECREASED, Schwann cell) is deliberately
          NOT copied here: every published nerve conduction study in this disorder describes an axonal
          process, and no demyelinating neuropathy has been reported, so importing those module bindings
          would assert something the literature contradicts. No biological-process binding is copied:
          the module''s remaining process, neuron apoptotic process, refers to neuronal soma death and
          is not established by evidence of distal axonal loss alone; no sufficiently specific axonal-degeneration
          GO process was verified for this node.'
      selected_evidence:
        snippet: key clinical features including developmental delay or regression, seizures, ataxia,
          and axonal (sensori-)motor neuropathy
        supports: SUPPORT
    origin:
