          central rather than solely a consequence of neuromuscular weakness or aspiration: patients develop
          hypoventilation during sleep without infection, apnoeic episodes, and eventually require tracheostomy
          and long-term ventilation. Autonomic dysfunction - tachycardia, hypertension, abdominal distension
          and impaired sweating - can appear in the same phase. A brainstem substrate is clinically plausible
          but has not been demonstrated by pathology. Because a child can be alert and communicative on
          ventilatory support, this is the point where the disorder''s management question becomes explicit
          rather than implicit.'
