  8690d0d3b5370dc3716a05b1c045b266884ac675b772bc723962e19a4b6a2740:
    claim:
      about:
        disease:
          name: ADPRS-Related Stress-Induced Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and
              seizures
            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Treatment
      assertion:
        name: PARP inhibition (investigational)
        description: 'The leading mechanistically rational disease-modifying strategy, with convergent
          preclinical support. If the disease is caused by an inability to clear PARP1-generated ADP-ribose,
          then reducing PARP1 output should rescue it, and it does - in a Drosophila oxidative-challenge
          model, in patient-derived fibroblasts, and in Arh3-knockout mice subjected to cerebral ischaemia-reperfusion.
          Prolonged PARP inhibition also clears the chromatin scars and restores histone acetylation in
          patient cells, so it addresses both proposed mechanisms. What is entirely absent is any human
          trial: no PARP inhibitor has been given to a patient with this disorder in a controlled setting,
          the licensed agents are oncology drugs with myelosuppressive toxicity and uncertain brain penetration,
          and the dose, timing (chronic prophylaxis versus treatment of an acute episode) and safety in
          a developing child are all unknown.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: poly(ADP-ribose) polymerase inhibitor
            term:
              id: NCIT:C62554
              label: Poly (ADP-Ribose) Polymerase Inhibitor
        therapeutic_modality: SMALL_MOLECULE
        notes: Deliberately not framed as an available treatment. No clinical trial of a PARP inhibitor
          in this disorder is registered to this curation's knowledge, and every supporting result is
          preclinical.
      selected_evidence:
        snippet: Pharmacological inhibition of PARP also rescued the phenotype, suggesting the possibility
          of postnatal treatment for this genetic condition.
        supports: SUPPORT
