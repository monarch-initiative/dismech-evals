            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'Disease requires two damaging ADPRS alleles. Both founding cohorts were bi-allelic,
          and heterozygous parents are consistently reported as unaffected. Homozygosity strongly predominates
          over compound heterozygosity, which is a consequence of ascertainment through consanguineous
          families rather than a property of the locus: in the pooled review a history of consanguinity
          was present in 30 of 42 patients for whom it was recorded. Compound heterozygous genotypes are
          nonetheless documented (only 2 of the 47 patients in the pooled review, with further examples
          since: PMID:35664652, PMID:35222245, PMID:42015965).

          Penetrance is deliberately left unset rather than recorded as COMPLETE. No unaffected bi-allelic
          individual has been reported, which superficially argues for complete penetrance, but the entire
          literature is clinically ascertained case reports with no population screening, so non-penetrance
          could not have been detected even if it existed. The intra-familial variability that is reported
          - one adult sibling described as only mildly affected alongside a severely affected 8-year-old,
          and two of three affected sisters in the PAMP-syndrome family described as having "much milder
          phenotypes" than the index case - shows that expressivity is variable at fixed genotype, which
          is a separate question from penetrance and is the more clinically consequential one here. The
          consanguinity fraction (30/42) is from Table 1 of PMID:38365196, which is PDF-extracted full
          text rather than the cached abstract, so it is recorded here and not as an evidence snippet.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: We used exome sequencing to identify five different bi-allelic pathogenic ADPRHL2 variants
          in 12 individuals from 8 families affected by a neurodegenerative disorder manifesting in childhood
          or adolescence
        supports: SUPPORT
