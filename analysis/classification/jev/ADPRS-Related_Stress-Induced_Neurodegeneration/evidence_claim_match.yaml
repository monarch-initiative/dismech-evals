              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: AIF Release from Mitochondria and Parthanatos
        biological_scale: CELLULAR
        description: Parthanatos is a caspase-independent, PAR-dependent form of regulated cell death,
          and it is the effector step of the canonical model of this disorder. PARG liberates protein-free
          PAR from PARylated nuclear proteins; that free polymer reaches the cytoplasm and acts on mitochondria
          to release apoptosis-inducing factor, which translocates back to the nucleus and drives large-scale
          DNA cleavage. ARH3's protective role is to keep nuclear and cytoplasmic PAR below the threshold
          at which this happens, so ARH3 loss lowers the amount of stress needed to commit a cell to death.
          This is the node at which a transient febrile illness could plausibly convert into permanent
          neurological loss, and the ratchet-like clinical course - episodes followed by incomplete recovery
          - is what a threshold-crossing cell-death mechanism predicts.
        biological_processes:
        - preferred_term: programmed cell death
          modifier: INCREASED
          term:
            id: GO:0012501
            label: programmed cell death
        - preferred_term: apoptotic mitochondrial changes
          modifier: INCREASED
          term:
            id: GO:0008637
            label: apoptotic mitochondrial changes
        cellular_components:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        notes: The cell-type binding to neuron rests on a single sentence in PMID:30830864 reporting that
          parthanatos was observed in neurons of a deceased sibling. That is the only direct human neuropathological
          observation in the whole literature, and it is quoted below rather than paraphrased. Fibroblast
          is the cell type in which the mechanism has actually been dissected. No autopsy series, neuronal-subtype
          quantification or regional distribution of neuronal death has ever been reported for this disorder.
      selected_evidence:
        snippet: Consistent with the previous findings, the patient's fibroblasts and ARH3-deficient mice
          were more sensitive, respectively, to H2O2 stress and cerebral ischemia/reperfusion-induced
          PAR accumulation and cell death.
        supports: SUPPORT
    origin:
