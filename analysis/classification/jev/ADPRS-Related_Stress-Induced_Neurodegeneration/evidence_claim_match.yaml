        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Selective Neuronal Loss with Cerebellar and Cerebral Atrophy
        biological_scale: TISSUE
        description: 'The tissue-level endpoint in the central nervous system. Cerebral and cerebellar
          atrophy with white matter signal change is the commonest imaging abnormality, present in 77.7%
          of the imaged patients in the pooled review, with the cerebellar vermis particularly affected
          and spinal cord atrophy or T2 hyperintensity in a substantial minority. The atrophy is acquired
