        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deregulated Histone Acetylation and Transcription
        biological_scale: CELLULAR
        description: 'ARH3-deficient patient cells show reduced endogenous levels of activating chromatin
          modifications, most clearly H3K9 acetylation, and measurable deregulation of transcription.
          The causal direction was tested rather than assumed: prolonged PARP inhibition removes the scars
          and restores acetylation to normal, so the acetylation deficit is a consequence of the retained
          ADP-ribose and not an independent abnormality. In a long-lived post-mitotic neuron, which cannot
          dilute chromatin marks by division, a slowly accumulating transcriptional deficit of this kind
          is an attractive explanation for degeneration that appears only after years of normal function
          - but the link from this cellular phenotype to human neurodegeneration has not been demonstrated
          in neurons or in patient tissue.'
        biological_processes:
        - preferred_term: protein acetylation
          modifier: DECREASED
          term:
            id: GO:0006473
            label: protein acetylation
        - preferred_term: regulation of DNA-templated transcription
          modifier: ABNORMAL
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
        - preferred_term: chromatin remodeling
          modifier: ABNORMAL
          term:
            id: GO:0006338
            label: chromatin remodeling
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        mechanism_confidence: PROVISIONAL
        notes: Marked PROVISIONAL and separated into its own hypothesis group because the two best studies
          of this arm disagree about its importance. PMID:32636369 frames the scars and the resulting
          acetylation loss as the pathogenic lesion. PMID:34019811, from an overlapping group, then showed
          that persistent MARylation is "surprisingly well tolerated" while persistent PARylation is highly
          toxic, and reattributed the disease to a stress-induced PARylation excess. Both cannot be the
          dominant mechanism. This entry curates both and marks the canonical PAR/parthanatos model as
          CANONICAL and the chromatin-scar model as ALTERNATIVE rather than adjudicating between them;
          see the `mechanistic_hypotheses:` block and the corresponding discussion.
      selected_evidence:
        snippet: We demonstrate that the ADP-ribose chromatin scars result in reduced endogenous levels
          of important chromatin modifications such as H3K9 acetylation, and that ARH3 patient cells exhibit
          measurable levels of deregulated transcription.
        supports: SUPPORT
