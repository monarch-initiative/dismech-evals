        notes: 'Recorded as a separate phenotype from generalised ataxia deliberately: the two carry different
          diagnostic weight and different mechanistic implications, and a child may pass from one to the
          other. The HPO annotation set for OMIM:618170 does not include HP:0002131; this phenotype is
          curated from the primary reports.'
