          of the imaged patients in the pooled review, with the cerebellar vermis particularly affected
          and spinal cord atrophy or T2 hyperintensity in a substantial minority. The atrophy is acquired
          and progressive rather than developmental: serial imaging in the same child can move from normal,
          to mild frontal atrophy, to marked cortical and cerebellar atrophy within a year. Why the cerebellum
          and the long tracts are preferentially affected, when ARH3 is ubiquitously expressed, is unexplained.'
