              seizures
            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Poly(ADP-Ribose) Turnover under Stress
        biological_scale: MOLECULAR
        description: 'The acute arm. Oxidative and genotoxic stress activates PARP1, which accounts for
          the great majority of cellular ADP-ribosylation after DNA damage and builds long poly(ADP-ribose)
          chains within seconds. In a normal cell PARG and ARH3 together dismantle those chains on a timescale
          of minutes. An ARH3-deficient cell has only PARG, and the result is a larger and longer-lasting
          PAR burst in both the nucleus and the cytoplasm. This is the step at which the disorder becomes
          stress-conditional: basal ADP-ribosylation in ARH3-deficient cells can be close to normal, and
          the abnormality appears when the system is loaded. Patient fibroblasts show reduced viability
          on hydrogen peroxide challenge, and Arh3-knockout cells show PARP1 activation with increased
          nuclear and then cytoplasmic PAR.'
        biological_processes:
        - preferred_term: protein poly-ADP-ribosylation
          modifier: INCREASED
          term:
            id: GO:0070212
            label: protein poly-ADP-ribosylation
        - preferred_term: cellular response to oxidative stress
          modifier: ABNORMAL
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
        - preferred_term: DNA damage response
          modifier: ABNORMAL
          term:
            id: GO:0006974
            label: DNA damage response
        molecular_functions:
        - preferred_term: NAD+ poly-ADP-ribosyltransferase activity
          modifier: INCREASED
          term:
            id: GO:0003950
            label: NAD+ poly-ADP-ribosyltransferase activity
        chemical_entities:
        - preferred_term: hydrogen peroxide (experimental stressor)
          term:
            id: CHEBI:16240
            label: hydrogen peroxide
        cell_types:
        - preferred_term: patient-derived dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: This leads to defective ARH3-dependent removal of ADP-ribosylation, both under basal
          conditions and following oxidative stress.
        supports: SUPPORT
