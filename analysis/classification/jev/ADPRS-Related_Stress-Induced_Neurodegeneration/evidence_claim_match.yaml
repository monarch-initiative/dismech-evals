  7db436ee8d799999be537ec2ccd842d793a3034b37e50a26820e139af08aed7b:
    claim:
      about:
        disease:
          name: ADPRS-Related Stress-Induced Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and
              seizures
            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: Arh3 (Adprs) knockout
        category: Knockout
        description: 'Arh3-knockout mice are viable and do not spontaneously develop the human neurodegenerative
          phenotype, which is the central fact about this model and the reason it is used as a stress-challenge
          system rather than as a phenocopy. Subjected to cerebral ischaemia-reperfusion they show increased
          PAR accumulation, increased cell death and larger brain infarcts than wild-type animals, and
          both the injury and the infarct size are reduced by PARP inhibitors.

