            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No incidence or prevalence estimate of any kind has been published, so no numeric rate
          is recorded and `rate_per_100000` is deliberately left empty. The qualitative ULTRA_RARE band
          is taken from the explicit characterisation in the source literature rather than derived from
          a count. The published denominator as of this curation is 47 patients from 12 articles up to
          3 February 2023 (PMID:38365196), plus subsequent individual reports curated here (PMID:38365196's
          own two cases, PMID:39580621, PMID:40493129, PMID:42015965), so the true published total is
          now somewhat above 50. No founder effect is asserted at population level, although the authors
          of PMID:38365196 raise the possibility of one for the recurrent p.Thr79Pro allele in Turkey;
          ascertainment is heavily weighted towards consanguineous populations and towards centres running
          research exome sequencing. Table 2 of PMID:32746785, which tabulates the nationality of each
          reported family, lists Turkey (three families), Iran (two), the United Arab Emirates, Pakistan
          and Lebanon alongside Italy, Germany, Kosovo, Poland and China; the pooled review records consanguinity
          in 30 of 42 patients for whom it was documented. That distribution reflects reporting and consanguinity
          patterns, not the true geographic range of the disorder.
      selected_evidence:
        snippet: In total, 12 articles describing 47 patients were included in the final analysis.
        supports: SUPPORT
