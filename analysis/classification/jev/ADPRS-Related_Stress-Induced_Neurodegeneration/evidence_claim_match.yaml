              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Serial brain and spinal cord MRI
        description: Imaging serves two purposes and has one important pitfall. It documents the characteristic
          cerebral and cerebellar atrophy with white matter change and the spinal cord involvement, and
          repeated over time it demonstrates progression, which is what distinguishes this disorder from
          a static or post-infectious process. The pitfall is that in the pooled review 7 of the 28 patients
          who ever had an abnormal MRI (25%) had a normal first scan and became abnormal only on follow-up,
          so a normal MRI during or shortly after a first episode does not exclude the diagnosis and should
          be repeated.
        notes: The normal-first-scan figure is not in the abstract and so is not carried by the snippet
          below. It comes from Table 1 of PMID:38365196, MRI findings block, row "Normal at first imaging
          study but abnormal during follow-up", which gives 7/28 (25) beneath "Abnormal 28/36 (77.7)".
          The running text of the same paper renders the numerator as n = 8 for the same 25%; 25% of 28
          is 7, so the table figure is used. That row is PDF-extracted text carrying a ligature in "first",
          which the reference validator does not fold, so it cannot be quoted as a snippet.
      selected_evidence:
        snippet: cerebral and cerebellar atrophy with white matter changes (28/36; 77.7%) were the other
          clues
        supports: SUPPORT
