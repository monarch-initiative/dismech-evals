          may ask about it, not because it is supported. The observation is uncontrolled, the specific
          vitamins and doses are not extractable from the abstract, the third patient in the same series
          stabilised spontaneously without any intervention, and the natural history of this disorder
          includes spontaneous remission of episodes over weeks - all of which make a treatment effect
          impossible to separate from the disease''s own fluctuation. There is also a confounder specific
          to this differential: high-dose biotin and thiamine are the established treatment for biotin-responsive
          basal ganglia disease, the closest treatable mimic.'
