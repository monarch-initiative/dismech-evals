              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Stress-triggered episodic deterioration
        age_range: Early childhood onwards
        notes: 'The defining phase. Discrete episodes - ataxia, dystonic posturing or torticollis, seizures,
          encephalopathy, sudden loss of ambulation or speech - are precipitated by febrile illness, infection,
          surgery, trauma, diarrhoea, exercise or cold-water immersion. Recovery between episodes is partial,
          so each event leaves a lower baseline. Some episodes resolve spontaneously over weeks and are
          misread as benign, which is a documented cause of diagnostic delay: in the first case of PMID:38365196
          the episodic head tilt attacks recurred about weekly over some two months and then resolved
          without any treatment, only to return six weeks before presentation and then increase in frequency
          and progress.'
      selected_evidence:
        snippet: Triggering factors (28/47; 59.5%) and regression (28/43; 60.4%), axonal polyneuropathy
          (9/23; 39.1%), and cerebral and cerebellar atrophy with white matter changes (28/36; 77.7%)
          were the other clues.
        supports: SUPPORT
