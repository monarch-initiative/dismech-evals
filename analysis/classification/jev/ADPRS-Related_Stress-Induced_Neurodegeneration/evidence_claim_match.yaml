          reported family, lists Turkey (three families), Iran (two), the United Arab Emirates, Pakistan
          and Lebanon alongside Italy, Germany, Kosovo, Poland and China; the pooled review records consanguinity
          in 30 of 42 patients for whom it was documented. That distribution reflects reporting and consanguinity
          patterns, not the true geographic range of the disorder.
      selected_evidence:
        snippet: an ultra-rare neurodegenerative autosomal recessive disorder
        supports: SUPPORT
