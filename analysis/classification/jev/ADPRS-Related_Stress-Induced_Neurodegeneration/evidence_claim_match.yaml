              seizures
            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mar_chromatin_scar_transcriptional_model
        hypothesis_label: Mono(ADP-Ribose) Chromatin Scar and Transcriptional Deregulation Model
        status: ALTERNATIVE
        description: The alternative model. Because ARH3 is the only enzyme that can remove serine-linked
          mono(ADP-ribose), its loss leaves persistent ADP-ribose scars on core histones marking every
          recently repaired single-strand break. These scars suppress activating acetylation marks such
          as H3K9ac and deregulate transcription, and in post-mitotic neurons the effect would accumulate
          over years. This model has the attraction of explaining a chronic degenerative process without
          requiring a discrete death event, and it explains why the disorder is degenerative rather than
          purely episodic. Its problem is that the same laboratory subsequently reported that persistent
          MARylation is well tolerated whereas PARylation is toxic, which argues that the scars are a
          marker rather than the injury.
      selected_evidence:
        snippet: Collectively, these data indicate that ARH3 can act as an eraser of ADP-ribose chromatin
          scars at sites of PARP activity during DNA single-strand break repair.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32636369
      reference_title: Pathogenic ARH3 mutations result in ADP-ribose chromatin scars during DNA strand
        break repair.
      evidence_source: IN_VITRO
      explanation: States the model's central claim, that ARH3's disease-relevant job is erasing chromatin
