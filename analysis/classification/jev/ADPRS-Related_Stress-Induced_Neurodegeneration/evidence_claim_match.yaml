            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: NEUROLOGIC
        notes: 'Essentially the entire reported morbidity is neurological: ataxia, seizures, developmental
          regression, dystonia, axonal sensorimotor neuropathy, spasticity, cerebral and cerebellar atrophy,
          and terminally central hypoventilation. Non-neurological findings are reported but are either
          downstream of neurological failure (central hypoventilation of unresolved neuroanatomical origin,
          cardiac arrhythmia and hypertension from autonomic dysfunction) or rare add-ons in single reports
          (ichthyosis, cataract, endocrine deficits). A single NEUROLOGIC chapter is therefore the correct
          assignment, and no second chapter is asserted.'
      selected_evidence:
        snippet: Affected individuals exhibited a pediatric-onset neurodegenerative disorder with progressive
          brain atrophy, developmental regression, and seizures in association with periods of stress,
          such as infections.
        supports: SUPPORT
    origin:
