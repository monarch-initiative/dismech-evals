            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Genetic
      assertion:
        name: ADPRS
        association: Bi-allelic inactivating variants (missense, nonsense, frameshift and splice), all
          converging on loss of ARH3 protein or activity
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: ADPRS
          term:
            id: hgnc:21304
            label: ADPRS
        notes: 'Nomenclature. HGNC:21304 is the current symbol ADPRS (ADP-ribosylserine hydrolase), verified
          with OAK on 2026-08-01. The former symbol ADPRHL2 is used by the MONDO definition, by both 2018
          founding papers and by most case reports; ARH3 is the protein name used by the biochemical literature;
          two further typographical variants circulate - ADPRLH2 in the abstract of PMID:35664652 ("ADP-ribosylhydrolase-like
          2 (ADPRS or ADPRLH2; OMIM: 610624)") and AHR3 in the title of PMID:33528672. The gene MIM number
          is 610624 and the phenotype MIM number is 618170; a source citing "ADPRHL2 (OMIM: 618170)" as
          a gene identifier, as PMID:32746785 does, has conflated the two.

          Reference transcript. NM_017825.2 and NM_017825.3 are both used in the literature; variant coordinates
          below are as published.

          Allelic spectrum, with the caveat that it is drawn from a clinically ascertained, consanguinity-enriched
          series. In the 47-patient review, homozygous genotypes accounted for 45 of the reported patients
          and only two compound heterozygotes had been described at that point; further compound heterozygotes
          have since been reported (PMID:35664652, PMID:35222245, PMID:42015965). Missense variants were
          the commonest class (about half), followed by nonsense and frameshift. Exon 6 carried roughly
          half of the homozygous variants and exon 2 the recurrent Turkish allele.

          Named alleles with published functional data: p.Thr79Pro (recurrent, at least seven patients
          from unrelated Turkish families, protein destabilisation on expression in E. coli); p.Cys26Phe
          (protein instability and reduced function, PMID:34479984); p.Val335Gly (mild loss of expression
          with retained enzymatic activity but altered cytosolic/nuclear localisation and elevated nuclear
          ADP-ribosylation under stress, PMID:34479984); p.His182Arg (active-site residue; instability,
          degradation, and failure of nuclear localisation, PMID:39580621); p.Ala280Thr (no detectable
          protein on western blot, PMID:33528672); p.Leu162Pro in trans to p.Gln106* (severe reduction
          of protein with defective ADP-ribosylation removal, PMID:42015965); c.580C>T p.Gln194Ter with
          c.803-1G>A (nonsense-mediated decay plus intron 5 retention, PMID:35664652).

          A correction that should not be silently propagated. PMID:38365196 writes the recurrent Turkish
          allele as "c.235A > C" in its case descriptions and as "c.235C > A" in its discussion, for the
          same protein change p.(Thr79Pro). Threonine 79 is encoded ACG, and proline requires CCG, so
          the change must be c.235A>C; the "c.235C>A" spelling in that paper is an error. This entry uses
          c.235A>C.

          Not asserted, deliberately. No gnomAD constraint metric (pLI, o/e LoF, missense Z) and no carrier
          frequency is recorded anywhere in this entry: cached sources do not provide them and they were
          not looked up, so writing them would be unverifiable. No ClinGen gene-disease validity classification
          is quoted because the ClinGen data payload is absent from this checkout. No genotype-phenotype
          correlation is asserted beyond the observation, made explicitly by PMID:38365196, that the current
          data are insufficient to establish one; the suggestion in that paper that exon 2 missense alleles
          have earlier onset than exon 6 alleles rests on seven versus twelve patients and the authors
          themselves warn it may be misleading.'
      selected_evidence:
        snippet: 'we identified two novel compound heterozygous ADPRS variants: NM_017825.3:c.580C>T (p.Gln194Ter)
          and NM_017825.3:c.803-1G>A'
        supports: SUPPORT
