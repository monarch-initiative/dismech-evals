  37d33893322d14d6faf9139065c60837b47aa3910cfa06862caad75040dd036a:
    claim:
      about:
        disease:
          name: ADPRS-Related Stress-Induced Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and
              seizures
            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NAD+ Consumption and Bioenergetic Failure
        biological_scale: CELLULAR
        description: 'Each ADP-ribose transferred by PARP1 costs one NAD+. Unrestrained PARylation is
          therefore not only a signalling abnormality but a metabolic drain, and the normal turnover of
          PAR is part of how a cell restores its energy reservoir after a genotoxic insult. In an ARH3-deficient
          cell that restoration is impaired. This node is included because it is a standard and well-supported
          feature of PARP1 hyperactivation biology and because it offers a plausible reason why neurons
          - the most energy-demanding and least glycolytically flexible cells - are the ones that fail.
          It is marked HYPOTHETICAL for this disorder specifically: no measurement of NAD+ or of bioenergetic
          function has been published in ADPRS-deficient patient cells or tissue.'
        biological_processes:
        - preferred_term: NAD+ catabolic process
          modifier: INCREASED
          term:
            id: GO:0019677
            label: NAD+ catabolic process
        chemical_entities:
        - preferred_term: NAD+
          term:
            id: CHEBI:15846
            label: NAD(+)
        mechanism_confidence: HYPOTHETICAL
        notes: No evidence item asserts NAD+ depletion in ADPRS-deficient human cells, because none has
          been reported. The single quoted item below supports only the general principle that PAR turnover
          restores the cellular energy reservoir, and it is attached with that limitation stated. Treating
          this as established for CONDSIAS would be exactly the kind of borrowed-mechanism inference this
          entry tries to avoid.
      selected_evidence:
        snippet: This turnover of PARylation is not only required for effective control of cellular signaling
          pathways but also restores the cellular energy reservoir
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
