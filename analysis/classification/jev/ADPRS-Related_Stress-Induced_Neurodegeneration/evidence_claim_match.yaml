  9d791930eab965930c289c1d5d7bf3fd6eb77cbc645379dc420e5a858e00e044:
    claim:
      about:
        disease:
          name: ADPRS-Related Stress-Induced Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and
              seizures
            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of ARH3 Serine-ADP-Ribosylhydrolase Activity
        biological_scale: MOLECULAR
        description: 'ARH3 is a 39 kDa binuclear-magnesium metalloenzyme of the ARH family. It has two
          distinct, non-redundant activities relevant to this disease. The first is unique to it: ARH3
          is the only human enzyme that cleaves the terminal seryl-ADP-ribosyl bond, that is, the single
          ADP-ribose left attached to a serine residue after PARG has trimmed the poly(ADP-ribose) chain.
          PARG cannot perform this step, so there is no redundancy and no compensation. The second is
          shared: ARH3 also hydrolyses poly(ADP-ribose) chains, acting in tandem with PARG on nuclear
          and cytoplasmic PAR and providing the principal PAR-degrading activity of the mitochondrial
          matrix, where PARG is scarce. Loss of ARH3 therefore removes one activity outright and reduces
          the reserve capacity of the other, which is why the resulting phenotype is unmasked by stress
          rather than being constant.'
        genes:
        - preferred_term: ADPRS
          term:
            id: hgnc:21304
            label: ADPRS
        molecular_functions:
        - preferred_term: ADP-ribosylserine hydrolase activity
          modifier: DECREASED
          term:
            id: GO:0140292
            label: ADP-ribosylserine-[protein] hydrolase activity
        biological_processes:
        - preferred_term: protein de-ADP-ribosylation
          modifier: DECREASED
          term:
            id: GO:0051725
            label: protein de-ADP-ribosylation
        cellular_components:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        notes: 'Subcellular localisation is itself a disease mechanism at this locus and not merely a
          descriptive detail. Two independently characterised alleles are mislocalisation alleles: p.His182Arg
          fails to reach the nucleus (PMID:39580621) and p.Val335Gly retains mitochondrial localisation
          while showing altered cytosolic/nuclear distribution with near-normal basal activity but elevated
          nuclear ADP-ribosylation specifically under stress (PMID:34479984). The p.Val335Gly result is
          the cleanest published demonstration that the defect in this disease is conditional on stress
          rather than constitutive.'
      selected_evidence:
        snippet: However, we show an alternative PAR-degradation pathway, resulting from action of ADP
          ribosyl-acceptor hydrolase (ARH) 3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
