              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_par_parthanatos_model
        hypothesis_label: Canonical PAR Accumulation and Parthanatos Model
        status: CANONICAL
        description: The model proposed by both 2018 founding papers and supported by the strongest chain
          of experimental evidence. Stress activates PARP1; ARH3 deficiency prevents timely clearance
          of the resulting poly(ADP-ribose); PAR accumulates in nucleus and cytoplasm; free PAR triggers
          mitochondrial AIF release and caspase-independent parthanatos; repeated episodes of neuronal
          death produce the neurodegeneration. Its strongest support is that PARP inhibition rescues the
          phenotype in three independent systems - a Drosophila oxidative-challenge model, patient fibroblasts,
          and Arh3-knockout mice subjected to cerebral ischaemia-reperfusion. Its weakest link is that
          the human trigger, febrile illness, has never been shown to produce the proposed PAR burst in
          a patient.
      selected_evidence:
        snippet: we extend our findings to neurodegeneration, suggesting that patients with inherited
          ARH3 deficiency suffer from stress-induced pathogenic increase in PARylation that can be mitigated
          by PARP inhibition
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34019811
      reference_title: Unrestrained poly-ADP-ribosylation provides insights into chromatin regulation
        and human disease.
      evidence_source: IN_VITRO
      explanation: The authors of the competing chromatin-scar arm converge on the PARylation model as
