  a298de1f84470fe3e5dc2ac4fd0738f87eae6b309de153f36664dc7cbbfda195:
    claim:
      about:
        disease:
          name: ADPRS-Related Stress-Induced Neurodegeneration
          disease_term:
            preferred_term: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and
              seizures
            term:
              id: MONDO:0100095
              label: neurodegeneration, childhood-onset, stress-induced, with variable ataxia and seizures
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bi-allelic Inactivating ADPRS Variants
        biological_scale: MOLECULAR
        description: 'The primary lesion is bi-allelic damage to ADPRS at 1p34.3, reported against transcript
          NM_017825.2/NM_017825.3. Missense, nonsense, frameshift and splice-site alleles are all represented
          and all converge on loss of ARH3 protein or activity rather than on a gain of function or a
          dominant-negative effect. The missense alleles are not a mild class: p.Thr79Pro, p.Cys26Phe,
          p.His182Arg, p.Leu162Pro and p.Ala280Thr have each been shown biochemically to destabilise the
          protein, and in the PAMP-syndrome family the p.Ala280Thr protein was undetectable on western
          blot despite being a single amino-acid substitution. The practical consequence for variant interpretation
          is that a conservative-looking ADPRS missense change cannot be dismissed on in-silico grounds.'
        genes:
        - preferred_term: ADPRS
          term:
            id: hgnc:21304
            label: ADPRS
      selected_evidence:
        snippet: All affected patients had homozygous novel NM_017825.3:c.838G>A (p.Ala280Thr) mutations
          in a highly conserved region of ADPRHL2. Western blot analyses demonstrated that ADPRHL2 was
          not expressed in these patients.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33528672
      reference_title: Episodic psychosis, ataxia, motor neuropathy with pyramidal signs (PAMP syndrome)
        caused by a novel mutation in ADPRHL2 (AHR3).
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates that a single missense substitution can abolish detectable protein, which
        is why missense alleles at this locus behave as null.
