      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: adan_amyloidogenesis_model
        hypothesis_label: ADan Amyloidogenesis and Cerebral Amyloid Angiopathy Model
        status: CANONICAL
        description: The Danish ITM2B duplication extends mutant BRI2, generates the 34-residue ADan peptide,
          and enables ADan self-assembly, extracellular deposition, and progressive vascular and parenchymal
          accumulation. The canonical branch is limited to ADan amyloidogenesis and ADan-containing cerebral
          amyloid angiopathy; it does not assume that ADan causes Aβ deposition or tauopathy.
      selected_evidence:
        snippet: The decamer duplication mutation produces a frame-shift in the BRI sequence generating
          a larger-than-normal precursor protein, of which the amyloid subunit (designated ADan) comprises
          the last 34 C-terminal amino acids.
        supports: SUPPORT
    origin:
