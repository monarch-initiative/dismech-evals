      assertion_type: ProgressionInfo
      assertion:
        phase: Natural history
        age_range: third to sixth decade
        duration: Progressive over decades
        notes: The published Danish kindred shows staged progression from cataracts in the third decade
          to hearing impairment, cerebellar signs, dementia in later adulthood, and death in the fifth
          or sixth decade.
      selected_evidence:
        snippet: Clinically, FDD is characterized by the development and progression of cataracts during
          the third decade of life (Strömgren et al. 1970). Hearing impairment was reported to appear
          10–20 years following the development of ocular problems. Severe to total perceptive hearing
          loss developed by the fifth decade of life, with vestibular reflex disturbances, slurred speech,
          and a swaying gait (Strömgren et al. 1970; Strömgren 1981). Patients with FDD developed cerebellar
          ataxia with intention tremor in their fourth decade of life, however, unlike FBD cases, did
          not develop spastic para-paresis. Progressive dementia probably begins in the sixth decade and
          may be associated with paranoid reactions and temporal disturbances of consciousness. The majority
          of patients succumb within the fifth or sixth decade of life.
        supports: SUPPORT
