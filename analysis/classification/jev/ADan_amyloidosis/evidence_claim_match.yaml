        discussion_id: mismatch_fdd_ki_rat_vascular_cascade
        prompt: How faithfully does the homozygous Danish, humanized-APP FDD-KI rat model reproduce human
          vascular amyloid topology and the proposed sequence from CAA through leakage, inflammation,
          white-matter injury, and motor deficits?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#ADan-Containing Cerebral Amyloid Angiopathy
        - pathophysiology#Cerebrovascular Permeability and Fibrinogen Leakage
        - pathophysiology#Reactive Microglial and Macrophage Activation
        - pathophysiology#Cerebellar Myelin Disruption and Axonal Loss
        - pathophysiology#Motor and Gait Dysfunction in FDD-KI Rats
        rationale: The rat supports a useful vascular-injury constellation, but it carries a homozygous
          Danish allele and humanized App background rather than the human heterozygous genotype. Its
          Aβ-CAA is capillary-predominant, unlike the subpial-large-vessel predominance in FDD, and the
          proposed injury sequence is observational. Each causal edge is therefore typed UNKNOWN.
      selected_evidence:
        snippet: 'Additionally, vascular Aβ deposits (Aβ-CAA) were present in FDD-KI rats, but Aβ-CAA
          patterns showed some differences between species: in FDD patients, Aβ-CAAs were more abundant
          in subpial large vessels, while in FDD-KI rats, Aβ-CAA was mostly observed in capillaries.'
        supports: SUPPORT
