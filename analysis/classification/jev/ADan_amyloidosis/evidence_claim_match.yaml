      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_adan_abeta_tau_causal_order
        prompt: Do ADan accumulation, Aβ co-deposition, and tau degeneration form an ordered human causal
          cascade, or are Aβ and tau parallel or modifying pathologies in familial Danish dementia?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Progressive Cerebral ADan Amyloid Accumulation
        - pathophysiology#Aβ Co-deposition with ADan
        - pathophysiology#Neurofibrillary Degeneration
        rationale: Human postmortem studies establish that ADan, selected Aβ species, and severe tau pathology
          coexist, but neither their direction nor necessity is resolved. The graph therefore treats ADan
          amyloidogenesis as canonical, Aβ co-deposition as descriptive, and the amyloid–tau edge as unknown
          rather than converting co-occurrence into a linear cascade.
      selected_evidence:
        snippet: However, it remains to be determined whether abnormal tau phosphorylation is the consequence
          of cerebral amyloid deposition or a different disease characteristic, given that hyper-phosphorylated
          tau can lead to dementia in the absence of amyloid plaques (Goedert et al. 2000).
        supports: SUPPORT
