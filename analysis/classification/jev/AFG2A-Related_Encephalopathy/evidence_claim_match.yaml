        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing
        description: The diagnosis is molecular. Multiple reported cohorts were ascertained by whole-exome
          sequencing, often after a clinical suspicion of a mitochondrial disorder or of an unexplained
          developmental and epileptic encephalopathy. The symbol in older reports and some resources is
          SPATA5.
        notes: 'Papuc and colleagues identified causative biallelic SPATA5 variants in 2 of 63 research
          participants with early-onset epileptic encephalopathy and 1 of 39 diagnostic cases (3 of 102
          combined, reported as 3%). This is a diagnostic yield in a selected cohort, not a population
          prevalence estimate.

          Elevated or high-normal blood copper was reported in the three Japanese children (PMID:27246907)
          but has never been replicated in any later cohort, so it is recorded here as an unreplicated
          observation and not curated as a biochemical feature of the disease.'
      selected_evidence:
        snippet: This study describes five patients with psychomotor developmental delay, microcephaly,
          epilepsy and hearing impairment, who were thought clinically to have a mitochondrial disease
          with subsequent whole-exome sequencing analysis detecting compound heterozygous variants in
          the SPATA5 gene.
        supports: SUPPORT
