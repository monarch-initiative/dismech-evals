  bc7bcfa5e7ca6ec42c25000cf351008ead16034cf257398b02a86980c5af5d11:
    claim:
      about:
        disease:
          name: AFG2A-Related Encephalopathy
          disease_term:
            preferred_term: AFG2A-related encephalopathy
            term:
              id: MONDO:0014698
              label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
                muscle tone syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: afg2a_mitochondrial_localisation_tension
        kind: CONTROVERSY
        status: OPEN
        prompt: Is the mitochondrial dysfunction in AFG2A deficiency a direct consequence of a mitochondrial
          pool of the protein, or is it secondary to reduced translational capacity?
        attaches_to:
        - pathophysiology#Neuronal Mitochondrial Fusion-Fission Imbalance
        rationale: 'The protein carries a putative mitochondrial matrix-targeting sequence and was originally
          described as a mitochondrial morphogenesis factor in spermatogenesis, and patient cells reproducibly
          show bioenergetic deficits. Against a direct mitochondrial role: the overexpressed protein is
          dominantly cytosolic in cortical neurons and does not co-localise with mitochondrial markers
          (PMID:29343804), no patient shows a consistent mitochondrial biomarker abnormality (PMID:41933351),
          respiratory chain findings are inconsistent between patients, and the established molecular
          function of the 55LCC complex is cytoplasmic ribosome maturation. The entry models the mitochondrial
          arm as downstream and provisional, but the question is genuinely open.'
      selected_evidence:
        snippet: To our surprise the localization of overexpressed SPATA5 in cultured primary cortical
          neurons was dominantly cytosolic and clearly not co-localizing with the mitochondrial marker
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
