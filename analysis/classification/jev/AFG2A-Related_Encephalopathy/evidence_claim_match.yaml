            term:
              id: MONDO:0014698
              label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
                muscle tone syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: AFG2B-related neurodevelopmental disorder
        description: 'Caused by biallelic variants in AFG2B, the gene formerly called SPATA5L1 and therefore
          one character away from this disorder''s own former gene symbol. The two proteins are partners
          in the same 55LCC ATPase complex, so the disorders overlap for a real mechanistic reason and
          are routinely discussed together. The discriminators are quantitative and developmental rather
          than absolute: in AFG2B disease sensorineural hearing loss is present in all affected individuals
          but only about half have any neurodevelopmental involvement at all, the neurodevelopmental phenotype
          is described as non-progressive and mixed with spastic-dystonic cerebral palsy prominent, and
          microcephaly is not a defining feature. In AFG2A disease microcephaly is present in around 86%,
          intellectual disability in around 98%, and the epilepsy is typically an infantile epileptic
          spasms syndrome.'
        distinguishing_features:
        - Caused by AFG2B (SPATA5L1, HGNC:28762), not AFG2A (SPATA5, HGNC:18119)
        - Sensorineural hearing loss is universal but the neurodevelopmental phenotype is present in only
          about half of affected individuals
        - Neurodevelopmental involvement is described as non-progressive and mixed, with spastic-dystonic
          cerebral palsy prominent
        - Congenital microcephaly is not a cardinal feature, whereas it is one of the AFG2A triad
        - Periventricular leukomalacia and reduced white matter volume are reported, rather than the hypomyelination
          plus progressive cerebral atrophy pattern of AFG2A disease
        disease_term:
          preferred_term: AFG2B-related neurodevelopmental disorder
          term:
            id: MONDO:0859206
            label: neurodevelopmental disorder with hearing loss and spasticity
      selected_evidence:
        snippet: We report 28 bi-allelic variants in SPATA5L1 associated with sensorineural hearing loss
          in 47 individuals from 28 (26 unrelated) families. In addition, 25/47 affected individuals (53%)
          presented with microcephaly, developmental delay/intellectual disability, cerebral palsy, and/or
          epilepsy.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
