      assertion_type: Pathophysiology
      assertion:
        name: Biallelic AFG2A Loss of Function
        description: Biallelic pathogenic variants in AFG2A (formerly SPATA5) reduce the amount or the
          activity of an 892-amino-acid AAA+ ATPase. Most reported alleles are missense or small in-frame
          changes rather than complete nulls, and no individual carrying two unequivocal null alleles
          has been reported, which is consistent with hypomorphic rather than complete loss of function
          being compatible with life. The protein carries two conserved ATPase modules.
        role: root
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        gene:
          preferred_term: AFG2A
          term:
            id: hgnc:18119
            label: SPATA5
        cellular_components:
        - preferred_term: Cytosol
          term:
            id: GO:0005829
            label: cytosol
      selected_evidence:
        snippet: SPATA5 encodes a ubiquitously expressed member of the ATPase associated with diverse
          activities (AAA) protein family and is involved in mitochondrial morphogenesis during early
          spermatogenesis.
        supports: SUPPORT
