              label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
                muscle tone syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuroepithelial Vulnerability During Differentiation
        description: 'This node answers the central puzzle of the disorder: why a defect in a ubiquitous
          housekeeping machine produces an almost purely neurological phenotype. Human cerebral organoid
          work on the sister 55LCC subunit AIRIM/C1orf109 showed that ribosome levels fall physiologically
          during neuroepithelial differentiation, creating a developmental window in which any further
          reduction in 60S output crosses a threshold and selectively impairs translation of specific
          transcripts, disrupting both survival and cell fate commitment. Enhancing mTOR activity suppressed
          the AIRIM organoid phenotype, identifying a candidate rescue axis for 55LCC-related ribosome-biogenesis
          disorders that remains untested in AFG2A deficiency.'
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        notes: The organoid evidence is from AIRIM/C1orf109, a different subunit of the same 55LCC complex,
          not from AFG2A itself. The node is therefore provisional and its evidence is recorded as PARTIAL.
          No AFG2A cerebral organoid model has been published.
        biological_processes:
        - preferred_term: Cytoplasmic translation
          term:
            id: GO:0002181
            label: cytoplasmic translation
        cell_types:
        - preferred_term: Differentiating neuroepithelium
          term:
            id: CL:0011020
            label: neural progenitor cell
      selected_evidence:
        snippet: Enhancing mTOR activity suppresses the growth and developmental defects associated with
          AIRIM/C1orf109 variants.
        supports: SUPPORT
