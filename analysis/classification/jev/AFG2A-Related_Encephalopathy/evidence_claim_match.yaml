      assertion:
        name: Replisome Proteostasis Failure
        description: 'The 55LCC complex has a second, ribosome-independent job: its ATPase activity is
          stimulated by replication fork DNA and it couples cysteine protease-dependent cleavage of replisome
          substrates to replication fork damage. Losing that activity produces ubiquitin-independent proteotoxicity,
          replication stress and chromosome instability. Whether this branch contributes to the human
          neurodevelopmental phenotype is proposed by the authors but not established in patient material,
          so the node is provisional.'
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: DNA replication
          term:
            id: GO:0006260
            label: DNA replication
