              label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
                muscle tone syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Ketogenic diet
        description: The ketogenic diet is the only intervention with disease-specific evidence. In a
          series of five genotyped patients, four received the diet for drug-resistant epilepsy with seizure
          reduction rates of 0%, 30%, 70% and 100%; the patient who became seizure free is maintained
          on ketogenic diet monotherapy. Non-seizure benefits (social interaction, attention, motor function)
          were reported in three. Fibroblasts from these patients cultured in a ketogenic-diet-mimicking
          medium showed reversal of the mitochondrial morphology, dynamics and ATP abnormalities, giving
          a plausible mechanistic rationale. The evidence is a small uncontrolled series and is recorded
          as partial.
        action_category: THERAPEUTIC
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Ketogenic diet
          term:
            id: NCIT:C173168
            label: Ketogenic Diet
        notes: Four treated patients is the entire published experience. The 2026 review adds that neither
          corticosteroids nor vigabatrin achieved seizure control in the reported IESS series, which is
          why the diet is being explored.
        target_phenotypes:
        - preferred_term: Seizure
          term:
            id: HP:0001250
            label: Seizure
        - preferred_term: Infantile spasms
          term:
            id: HP:0012469
            label: Infantile spasms
      selected_evidence:
        snippet: Four patients received KD treatment for DRE, with seizure reduction rates of 0 %, 30
          %, 70 % and 100 %, respectively.
        supports: SUPPORT
