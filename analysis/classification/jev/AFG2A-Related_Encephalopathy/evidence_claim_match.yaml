      assertion_type: Phenotype
      assertion:
        name: Increased circulating lactate concentration
        category: Metabolic
        description: Mild, persistent elevation of plasma lactate has been observed in a small minority
          of individuals, without any other abnormality of mitochondrial biomarkers and without elevated
          lactate in urine or cerebrospinal fluid. This is the only biochemical abnormality reported with
          any consistency, and it is important mainly because it reinforces the mistaken impression of
          a primary mitochondrial disease.
        notes: 'Frequency band deliberately omitted. Two individuals (Patient IDs 43 and 45) had a persistent
          mild lactate elevation of 1.9 to 3.9 mmol/l, but the denominator is not the full 51-individual
          cohort: the phrase used is "two individuals in our cohort", and the discussion identifies them
          as cases 3 and 5 of the authors'' own five-patient ketogenic-diet series, so systematic metabolic
          data are not available for the pooled literature cases. Against a denominator of 51 the band
          would be VERY_RARE and against a denominator of 5 it would be VERY_FREQUENT, so no band is asserted.'
        phenotype_term:
          preferred_term: Increased circulating lactate concentration
          term:
            id: HP:0002151
            label: Increased circulating lactate concentration
      selected_evidence:
        snippet: Two individuals in our cohort (Patient ID 43, 45)... a persistent mild elevation of lactate
          (1.9-3.9 mmol/l) without other abnormalities in mitochondrial... including acid-base balance,
          creatine kinase... organic acids, amino acids, carnitines, oxidative stress markers, circulating
          cytokines, or mitochondrial growth factors. No elevated lactate was detected in urine or cerebrospinal
          fluid.
        supports: SUPPORT
