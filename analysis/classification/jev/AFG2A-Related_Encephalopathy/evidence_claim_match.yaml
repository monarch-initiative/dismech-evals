              label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
                muscle tone syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: 55LCC ATPase Complex Dysfunction
        description: AFG2A does not act alone. It assembles with its paralogue AFG2B (SPATA5L1) and the
          heterodimeric partners C1orf109 and CINP into a 4:2:2:2 assembly named 55LCC, built from an
          N-terminal ring of C1orf109, CINP and the N-terminal domains of AFG2A and AFG2B sitting above
          two hexameric AAA+ ATPase rings. Reduced AFG2A activity therefore compromises a shared machine
          rather than a single enzyme, which is the structural reason AFG2A and AFG2B disease phenotypes
          overlap.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        protein_complexes:
        - preferred_term: 55LCC complex
      selected_evidence:
        snippet: Here we reveal that SPATA5 forms a 4:2:2:2 complex with SPATA5L1, C1orf109, and CINP.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40268917
      reference_title: Cryo-EM structure of the AAA+ SPATA5 complex and its role in human cytoplasmic
