      assertion:
        name: AFG2A
        gene_term:
          preferred_term: AFG2A
          term:
            id: hgnc:18119
            label: SPATA5
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Biallelic pathogenic or likely pathogenic variants
        notes: AFG2A is the current HGNC-approved symbol for the gene published throughout the clinical
          literature as SPATA5. The gene lies at 4q28.1 and encodes an 892-amino-acid AAA+ ATPase with
          two conserved ATPase modules. Forty-two different disease-associated variants had been reported
          across the 51 pooled individuals; the majority are compound heterozygous rather than homozygous,
          and four recurrent alleles (c.2081G>A, c.989_991del, c.251G>A and c.1714+1G>A) account for 42%
          of individuals. See the entry-level notes for the full symbol history and the reason the term
          label reads SPATA5.
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        variants:
        - name: c.989_991del (p.Thr330del)
          description: A recurrent in-frame single-amino-acid deletion reported in multiple unrelated
            families, including the Japanese siblings, the Polish family in which one sibling had isolated
            hearing loss, and several of the Estonian and German compound heterozygotes.
          type: in-frame deletion
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: AFG2A
            term:
              id: hgnc:18119
              label: SPATA5
        - name: c.1822_1824del (p.Asp608del)
          description: Homozygous in-frame deletion segregating with severe intellectual disability and
            microcephaly in an extended consanguineous family with seven affected individuals; molecular
            modelling predicted a deleterious effect on protein function.
          type: in-frame deletion
          clinical_significance: LIKELY_PATHOGENIC
          gene:
            preferred_term: AFG2A
            term:
              id: hgnc:18119
              label: SPATA5
        - name: c.251G>A (p.Arg84Gln)
          description: Recurrent missense allele; found homozygous through maternal uniparental isodisomy
            of chromosome 4 in a diagnostic case of developmental encephalopathy with late-onset epilepsy,
            and one of the four alleles accounting for 42% of reported individuals.
          type: missense
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: AFG2A
            term:
              id: hgnc:18119
              label: SPATA5
      selected_evidence:
        snippet: Using whole-exome sequencing, we have identified in ten families 14 individuals with
          microcephaly, developmental delay, intellectual disability, hypotonia, spasticity, seizures,
          sensorineural hearing loss, cortical visual impairment, and rare autosomal-recessive predicted
          pathogenic variants in spermatogenesis-associated protein 5 (SPATA5).
        supports: SUPPORT
