              label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
                muscle tone syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Primary mitochondrial disease
        description: 'This is the differential that actually costs patients time. Congenital microcephaly
          with deafness, cortical visual impairment, epilepsy, hypotonia and a mildly raised lactate is
          a classic mitochondrial presentation, and both the auditory and the optic nerve are selectively
          vulnerable to energy failure. Several published AFG2A cohorts were assembled precisely because
          the children were being investigated for suspected mitochondrial disease. The discriminator
          is that no consistent mitochondrial biomarker abnormality has been found in AFG2A disease: lactate
          is normal in all but a few individuals and is normal in urine and cerebrospinal fluid even in
          those, and acid-base balance, creatine kinase, pyruvate, organic acids, amino acids and carnitines
          are unremarkable. Mitochondrial DNA studies in the reported patients were normal. AFG2A dysfunction
          does produce secondary mitochondrial abnormalities, but the primary lesion is in cytoplasmic
          ribosome maturation, not in oxidative phosphorylation.'
        distinguishing_features:
        - No consistent mitochondrial biomarker abnormality; lactate elevation is mild and confined to
          a small minority, and urine and cerebrospinal fluid lactate are normal
        - Mitochondrial DNA depletion, deletion and sequencing studies were normal in the reported patients
        - Congenital microcephaly with sensorineural deafness as an obligate pairing is unusual in primary
          mitochondrial disease
        - The primary molecular lesion is in cytoplasmic pre-60S ribosome maturation, with mitochondrial
          dysfunction as a secondary consequence
        disease_term:
          preferred_term: Mitochondrial disease
          term:
            id: MONDO:0044970
            label: mitochondrial disease
      selected_evidence:
        snippet: The cardinal clinical features of AFG2A-RE may mimic those of a mitochondrial disease.
        supports: SUPPORT
    origin:
