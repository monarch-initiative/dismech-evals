            term:
              id: MONDO:0014698
              label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
                muscle tone syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: AIRIM/C1orf109-related neurodevelopmental disorder
        description: The third disease gene of the same 55LCC complex, described in 2025. Eleven unrelated
          families comprising eighteen individuals presented with severe global developmental delay and
          intellectual disability, muscular hypotonia with limb spasticity and dystonia, microcephaly,
          hearing and vision impairment and infantile seizures. This is close enough to AFG2A-related
          encephalopathy that the two are separable only by gene. It is included here partly because the
          2026 AFG2A systematic review states that no neurological disorder has been linked to C1orf109
          or CINP, a statement that this paper, published five months earlier, already contradicted; a
          curator relying on the review alone would omit this differential entirely.
        distinguishing_features:
        - Caused by AIRIM/C1orf109 (hgnc:26039), a different subunit of the same 55LCC complex
        - Hearing impairment is less consistent than in AFG2A disease (9 of 17 versus around 94%)
        - Reported seizure semiology is dominated by generalised tonic-clonic and myoclonic seizures and
          Lennox-Gastaut syndrome rather than by infantile epileptic spasms syndrome
        - Neuroimaging emphasises severe supratentorial atrophy with ex-vacuum ventricular dilatation,
          rather than the hypomyelination-predominant AFG2A pattern
        notes: Deliberately left UNBOUND. A `runoak` search of MONDO for both "AIRIM" and "C1orf109" returns
          no term, so no disease entity exists in MONDO for this disorder yet. The gene itself resolves
          (hgnc:26039 ! C1orf109) but a gene is not a disease term and must not be put in `disease_term`.
      selected_evidence:
        snippet: Here we describe variants in the ribosome biogenesis factor AIRIM/C1orf109 that are primarily
          associated with neurodevelopmental disorders.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/3
      evidence_path: /differential_diagnoses/3/evidence/0
      context_paths:
