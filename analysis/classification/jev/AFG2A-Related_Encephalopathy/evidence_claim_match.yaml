  9b083d367dd6ab09bfa7c798e74479497e34b749378439d9b33782a5c38d1f7a:
    claim:
      about:
        disease:
          name: AFG2A-Related Encephalopathy
          disease_term:
            preferred_term: AFG2A-related encephalopathy
            term:
              id: MONDO:0014698
              label: microcephaly-intellectual disability-sensorineural hearing loss-epilepsy-abnormal
                muscle tone syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: afg2a_intrafamilial_variability
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Why do siblings carrying the identical biallelic AFG2A genotype range from isolated sensorineural
          hearing loss to full developmental and epileptic encephalopathy?
        attaches_to:
        - phenotypes#Sensorineural hearing impairment
        rationale: In the family reported in PMID:28293831 the proband had the typical encephalopathy
          while her younger sister's only manifestation was isolated sensorineural hearing loss, on the
          same two variants. Comparable variability in epilepsy status occurred within the large consanguineous
          family of PMID:27683084. No modifier gene has been identified. Plausible but untested candidates
          are variation in the other 55LCC subunits or in general ribosome biogenesis capacity. Until
          this is resolved, genotype cannot be used to counsel on severity.
      selected_evidence:
        snippet: The proband had a similar clinical picture to the previous descriptions of EHLMRS. In
          the sister, the only manifestation was an isolated sensorineural hearing loss.
        supports: SUPPORT
