          100%. The deep research artifact records the GMFCS subgroup as n=22 explicitly, and the same
          paper reports motor impairment over a different subgroup again (97.83%, i.e. 45/46), so denominators
          vary from section to section. The cached paper''s own prose conflicts with its own arithmetic.
          It reads "All individuals were assessed using the Gross Motor Function Classification System
          (GMFCS)", which taken literally would put the denominator at 51. The arithmetic is preferred
          here over the prose. The band is chosen on the n=22 reading: 19 of the 22 individuals actually
          graded (86.36%) were at GMFCS level IV or V, both of which denote non-ambulatory status requiring
          physical assistance, and 86.36% is above 80% and so maps to VERY_FREQUENT. On the alternative
          reading, in which the same 19 individuals are taken over the full pooled cohort, 19/51 is 37%
          and the band would be FREQUENT. The n=22 reading is used because individuals who were not graded
          are unknown rather than known to be ambulatory, which is the usual convention for frequency
          denominators; a reader who instead treats the paper''s "All individuals" wording as authoritative
          should read this band as FREQUENT. Note that the entry deliberately omits three other frequency
          bands (for example infantile epileptic spasms syndrome, 16/24 with detailed epilepsy data but
          16/51 of the cohort) where the denominator is unknown, is very small, or is conditioned in a
          way that leaves no principled choice between readings. Here the band is retained rather than
          dropped because the subgroup denominator is recoverable exactly from the published percentages
          and both readings are recorded. The 9.09% at level III walk with a handheld mobility device
          and the 4.55% at level II are ambulatory with limitations.'
