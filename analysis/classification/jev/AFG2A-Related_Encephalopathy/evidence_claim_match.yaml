          term:
            id: GO:0030894
            label: replisome
      selected_evidence:
        snippet: These findings define 55LCC-mediated proteostasis as critical for replication fork progression
          and genome stability and provide a rationale for pathogenic variants seen in associated human
          neurodevelopmental disorders.
        supports: SUPPORT
