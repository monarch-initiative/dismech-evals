        description: 'ClinGen classifies the AFG3L2 relationship as semidominant: one damaging allele
          can cause dominant optic atrophy or a cerebellar syndrome, while two damaging alleles usually
          cause more severe recessive spastic-ataxia / neurodevelopmental disease. Some heterozygous carriers
          of recessive-family alleles are asymptomatic, while others show subtle optic or cerebellar findings.'
      selected_evidence:
        snippet: Heterozygous AFG3L2 mutations cause spinocerebellar ataxia type 28 (SCA28) or dominant
          optic atrophy type 12 (DOA12), while biallelic AFG3L2 mutations result in the rare and severe
          spastic ataxia type 5 (SPAX5).
        supports: SUPPORT
