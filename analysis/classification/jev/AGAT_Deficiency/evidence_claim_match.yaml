      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cerebral_creatine_energy_buffering_model
        hypothesis_label: Cerebral Creatine Depletion and Energy-Buffering Model
        status: EMERGING
        description: Cerebral creatine depletion is directly measured, and creatine is central to phosphocreatine-mediated
          ATP buffering. Treatment timing and response support a contribution to neurodevelopmental impairment,
          but the proposed energy-buffering intermediate has not been directly measured in human AGAT
          brain tissue.
      selected_evidence:
        snippet: Cr, an amino acid derivative, is one of the most important sources of energy due to its
          primary function as both a spatial and temporal energy buffer. By way of the phosphorylated
          analogue phosphocreatine (PCr) and creatine kinase (CK) it transfers high energy groups from
          mitochondria to sites of consumption and regenerates ATP from ADP.
        supports: SUPPORT
