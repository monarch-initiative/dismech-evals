        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Biallelic AHCY missense or truncating variants cause the disease. The index genotype includes
          p.Trp112Ter and p.Tyr143Cys; the review shorthand T112stop is not a p.Thr112Ter allele. Recombinant
          p.Arg49Cys and p.Asp86Gly have condition-dependent functional defects. Homozygous p.Arg49His
          recurs in Pakistani families with mild childhood presentations, but one confirmed adult developed
          HCC; a uniformly benign outcome or measured residual activity for this allele is not established.
          The 2024 report cites allele frequencies of approximately 0.000065 in South Asia and 0.000012
          globally, not carrier frequencies or disease prevalence. ClinGen classified the gene-disease
          association as Definitive in December 2024; the older Moderate wording remaining in its narrative
          was superseded by that reevaluation.
