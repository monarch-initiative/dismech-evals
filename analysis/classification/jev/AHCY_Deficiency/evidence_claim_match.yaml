              label: hypermethioninemia with deficiency of S-adenosylhomocysteine hydrolase
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other inherited methylation disorders
        description: The differential diagnosis of isolated hypermethioninemia includes MAT I/III (MAT1A)
          deficiency, GNMT deficiency, AHCY deficiency, and adenosine kinase deficiency. CBS deficiency
          usually adds marked hyperhomocysteinemia. Sibling methionine-cycle disorders stay separate Disease
          entries.
        distinguishing_features:
        - Markedly elevated plasma AdoHcy with elevated AdoMet favors AHCY deficiency.
        - MAT I/III deficiency typically has high methionine with low or inappropriately normal AdoMet.
        - CBS deficiency produces homocystinuria with elevated total homocysteine.
        - ADK deficiency combines hypermethioninemia with adenosine-salvage disruption and is a neighboring,
          not identical, enzyme block.
      selected_evidence:
        snippet: These are methionine adenosyltransferase I/III, glycine N-methyltransferase, S-adenosylhomocysteine
          hydrolase and adenosine kinase deficiencies.
        supports: SUPPORT
        directness: DIRECT
