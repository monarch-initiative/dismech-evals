      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: purine_nucleotide_deficiency
        hypothesis_label: Insufficient de novo purine supply during development
        status: ALTERNATIVE
        description: Purine supply could be inadequate in tissues that depend on de novo synthesis during
          embryogenesis and organogenesis. Salvage may compensate in some tissues and conditions, but
          normal circulating purines do not exclude local or developmental shortages. Both this model
          and substrate cytotoxicity remain hypotheses.
      selected_evidence:
        snippet: since the salvage recycling pathway may not completely compensate for a purine deficiency
        supports: SUPPORT
