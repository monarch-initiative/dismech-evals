  6e27a21e2a37c98d66e6a869017bf7a879afddd96dbb26dffc71dd0ca2ede110:
    claim:
      about:
        disease:
          name: AICA-ribosiduria
          disease_term:
            preferred_term: AICA-ribosiduria
            term:
              id: MONDO:0012099
              label: AICA-ribosiduria
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ATIC Bifunctional Enzyme Deficiency
        description: Biallelic ATIC dysfunction impairs the terminal reactions of de novo IMP synthesis.
          In the index patient, fibroblast transformylase activity was profoundly deficient and cyclohydrolase
          activity was 40% of normal; recombinant p.Lys426Arg abolished transformylase activity. These
          measurements are allele-specific. The 2020 series also reported p.Ala136Thr in the cyclohydrolase
          domain, but its proposed functional effect and the suggested genotype-severity relationship
          were not established by enzyme assays.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ATIC
          term:
            id: hgnc:794
            label: ATIC
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Reported alleles include the recurrent missense p.Lys426Arg (c.1277A>G), which
            abolishes transformylase activity of the recombinant protein, frameshift and nonsense (p.Arg141Ter)
            alleles, a canonical splice-site variant (c.1321-2A>G), and missense p.Thr585Ala and p.Gln214His.
        molecular_functions:
        - preferred_term: AICAR formyltransferase activity
          term:
            id: GO:0004643
            label: phosphoribosylaminoimidazolecarboxamide formyltransferase activity
          modifier: DECREASED
        - preferred_term: IMP cyclohydrolase activity
          term:
            id: GO:0003937
            label: IMP cyclohydrolase activity
          modifier: DECREASED
        cell_types:
        - preferred_term: skin fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
      selected_evidence:
        snippet: Recombinant protein carrying mutation K426R completely lacks AICAR transformylase activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15114530
      reference_title: 'AICA-ribosiduria: a novel, neurologically devastating inborn error of purine biosynthesis
        caused by mutation of ATIC.'
      evidence_source: IN_VITRO
      explanation: The recombinant mutant protein establishes that the missense allele itself abolishes
