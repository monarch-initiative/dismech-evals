        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: aicar_riboside_cytotoxicity
        hypothesis_label: Accumulated AICA-riboside and ZMP are cytotoxic to developing tissues
        status: CANONICAL
        description: The block at the AICAR transformylase step causes accumulation of ZMP (AICAR) and
          its phosphorylated derivatives inside cells and of AICA-riboside in body fluids. The favoured
          explanation of the neurological, retinal, growth and skeletal phenotype is a direct toxic effect
          of these accumulated intermediates. ZMP is an AMP mimetic that activates AMP-activated protein
          kinase, one proposed route of toxicity, but no study has measured AMPK activity in patient tissue.
      selected_evidence:
        snippet: accumulation of AICA-riboside is the biochemical hallmark and presumed pathomechanism
          of the condition
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
