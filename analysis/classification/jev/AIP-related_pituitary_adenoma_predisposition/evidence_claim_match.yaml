      assertion:
        discussion_id: gap_aip_ahr_branch_tumor_growth_causality
        prompt: Does altered AIP-AHR transcriptional signaling directly promote somatotroph tumor growth
          or invasiveness in human AIP-mutant pituitary adenomas, beyond the demonstrated cell-model effects
          on AHR target genes and ligand-dependent growth hormone secretion?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced AIP-AHR co-chaperone binding function
        - pathophysiology#Dysregulated AHR target-gene transcriptional response
        - pathophysiology#Altered ligand-dependent growth hormone secretion
        - phenotypes#Growth hormone excess
        rationale: 'The AIP-AHR branch now has a supported immediate outcome: altered AHR target-gene
          transcription and altered kynurenine-dependent GH secretion in GH3 cells. What remains unresolved
          is whether that branch is a causal driver of the human macroadenoma growth and invasiveness
