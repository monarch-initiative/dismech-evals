      assertion_type: Pathophysiology
      assertion:
        name: Impaired PDE6 Holoenzyme Folding and Assembly
        biological_scale: MOLECULAR
        description: Without functional AIPL1 co-chaperone activity, the PDE6 holoenzyme (catalytic alpha/beta
          and regulatory gamma subunits) fails to fold and assemble correctly and is targeted for degradation,
          abolishing cGMP hydrolysis capacity in photoreceptor outer segments. AIPL1 variants that disrupt
          either the FKBP-like or TPR domain impair both HSP90 interaction and PDE6 activity together.
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        molecular_functions:
        - preferred_term: 3',5'-cyclic-GMP phosphodiesterase activity
          modifier: DECREASED
          term:
            id: GO:0047555
            label: 3',5'-cyclic-GMP phosphodiesterase activity
      selected_evidence:
        snippet: We confirm that missense and nonsense variants in the FKBP-like and tetratricopeptide
          repeat domains of AIPL1 lead to the loss of both HSP90 interaction and PDE6 activity, confirming
          these variants cause LCA.
        supports: SUPPORT
