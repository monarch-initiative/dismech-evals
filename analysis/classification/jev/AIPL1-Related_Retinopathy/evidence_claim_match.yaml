      assertion_type: Genetic
      assertion:
        name: AIPL1 pathogenic variants
        gene_term:
          preferred_term: AIPL1
          term:
            id: hgnc:359
            label: AIPL1
        association: Causative
        features: Biallelic AIPL1 variants form an allelic severity gradient. Null alleles (nonsense,
          frameshift, or splice-disrupting), including the recurrent c.421C>T (historically W278X) variant,
          abolish AIPL1 function and cause classic LCA. Nonnull (missense) alleles, especially c.152A>G
          and c.572T>C, predict a significantly milder EOSRD phenotype. A rare hypomorphic missense variant,
          p.Gly122Arg, retains HSP90 binding but has impaired PDE6/cGMP modulation, producing a later-onset,
          milder retinitis pigmentosa phenotype. Rare heterozygous variants have also been reported in
          dominant families with juvenile retinitis pigmentosa or dominant cone-rod dystrophy.
        inheritance:
        - name: Autosomal recessive
      selected_evidence:
        snippet: The most common mutation was the nonsense variants of c.421C>T, with an allele frequency
          of 53.9%.
        supports: SUPPORT
