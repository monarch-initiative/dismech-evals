        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Rapid Photoreceptor Apoptosis and Congenital Retinal Dystrophy
        biological_scale: TISSUE
        description: Both the rod (cGMP-accumulation) and cone (reduced cGMP-synthesis) branches converge
          on rapid, light-independent photoreceptor apoptosis and disorganization of photoreceptor outer
          segments. In biallelic null alleles this produces the classic severe congenital LCA phenotype
          from birth; missense or hypomorphic alleles that retain partial chaperone function slow this
          process, producing the milder, later-onset EOSRD/juvenile RP end of the spectrum. Unlike the
          photoreceptor_degeneration module's rod-first apoptosis followed by non-cell-autonomous secondary
          cone loss, AIPL1 cone death is primary and cell-autonomous (PMID:24108108), arising from the
          same direct chaperone-loss mechanism as the rod branch rather than as a bystander effect of
          rod death, so this node does not declare conforms_to the module.
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: phototransduction
          modifier: DECREASED
          term:
            id: GO:0007602
            label: phototransduction
      selected_evidence:
        snippet: In Aipl1(-/-) retinas, the outer nuclear layer develops normally, but rods and cones
          then quickly degenerate. Aipl1(-/-) mice have highly disorganized, short, fragmented photoreceptor
          outer segments and lack both rod and cone electroretinogram responses.
        supports: SUPPORT
