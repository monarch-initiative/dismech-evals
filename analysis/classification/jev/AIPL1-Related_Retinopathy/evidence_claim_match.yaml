          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        description: Sequencing of AIPL1 confirms the diagnosis and classifies the allele burden as null,
          missense/nonnull, or hypomorphic -- a classification directly correlated with clinical severity
          and gene-therapy eligibility.
        results: Two null alleles predict classic, severe congenital LCA. At least one nonnull (missense)
          allele, particularly c.152A>G or c.572T>C, predicts a significantly milder EOSRD phenotype.
          The rare hypomorphic p.Gly122Arg allele predicts the mildest, latest-onset retinitis pigmentosa
          phenotype.
