      assertion_type: Subtype
      assertion:
        name: Milder EOSRD
        display_name: Early-Onset Severe Retinal Dystrophy / Juvenile RP (Missense Alleles)
        description: 'Patients carrying at least one missense or hypomorphic AIPL1 allele (e.g., c.152A>G,
          c.572T>C, or the rare hypomorphic p.Gly122Arg) that retains partial chaperone function present
          with a later-onset, milder disease course: a severe cone-rod (rather than fully extinguished)
          electroretinogram pattern, slower visual acuity decline, and in some families a juvenile retinitis
          pigmentosa or dominant cone-rod dystrophy phenotype rather than classic LCA.'
      selected_evidence:
        snippet: Patients harboring at least one nonnull mutation, especially c.152A>G and c.572T>C, were
          significantly more likely to have a milder EOSRD phenotype than those with two null mutations.
        supports: SUPPORT
