      assertion_type: Treatment
      assertion:
        name: Supportive care and monitoring
        therapeutic_modality: OTHER
        description: In the absence of an approved disease-modifying therapy, management consists of low-vision
          support, early referral for gene-therapy consideration if biallelic AIPL1 variants are confirmed,
          and routine ophthalmological monitoring. Because AIPL1 is a phototransduction chaperone rather
          than a visual-cycle protein, vitamin A/retinoid supplementation strategies used for visual-cycle
          diseases have no mechanistic rationale here, consistent with the general lack of demonstrated
          benefit of such supplementation across LCA/EOSRD.
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: Vitamin A, minerals and amino acids supplementation have failed to show a clear benefit
          for these patients
