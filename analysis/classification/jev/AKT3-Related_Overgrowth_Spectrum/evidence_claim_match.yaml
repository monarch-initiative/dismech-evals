              label: AKT3-related overgrowth spectrum
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: AKT3 Gain-of-Function Variant
        biological_scale: MOLECULAR
        description: A heterozygous activating AKT3 variant, either constitutional (de novo or inherited
          from a mosaic parent) or post-zygotic. All tested variants raise AKT3 kinase activity; variants
          in the pleckstrin homology (PH) domain, such as p.E17K, additionally increase binding to membrane
          phosphoinositides, the step that recruits AKT to the membrane for activation. Strongly activating
          variants tend to be tolerated only as low-level mosaics and produce focal malformations, while
          milder constitutional variants produce diffuse megalencephaly.
        genes:
        - preferred_term: AKT3
          term:
            id: hgnc:393
            label: AKT3
        molecular_functions:
        - preferred_term: AKT3 kinase activity
          term:
            id: GO:0004674
            label: protein serine/threonine kinase activity
          modifier: INCREASED
        - preferred_term: PH-domain phosphoinositide binding
          term:
            id: GO:0035091
            label: phosphatidylinositol binding
          modifier: INCREASED
      selected_evidence:
        snippet: All mutations increased kinase activity, and pleckstrin homology domain mutants exhibited
          enhanced phospholipid binding.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
