      assertion_type: Subtype
      assertion:
        name: MPPH2
        display_name: Megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 2
        description: The constitutional arm. A heterozygous activating AKT3 variant present in every cell,
          almost always de novo, causes diffuse bilateral megalencephaly with variable bilateral cortical
          malformation (polymicrogyria, periventricular nodular heterotopia) or megalencephaly without
          visible cortical dysplasia. The germline variant p.R465W is a recurrent hotspot.
        subtype_term:
          preferred_term: megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 2
          term:
            id: MONDO:0014407
            label: megalencephaly-polymicrogyria-polydactyly-hydrocephalus syndrome 2
        genes:
        - preferred_term: AKT3
          term:
            id: hgnc:393
            label: AKT3
      selected_evidence:
        snippet: patients with constitutional AKT3 mutations exhibiting more variable phenotypes including
          bilateral cortical malformations, polymicrogyria, periventricular nodular heterotopia and diffuse
          megalencephaly without cortical dysplasia
        supports: SUPPORT
