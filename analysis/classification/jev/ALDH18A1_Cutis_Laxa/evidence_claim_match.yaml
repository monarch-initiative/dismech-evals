      assertion_type: Treatment
      assertion:
        name: Multisystem surveillance
        description: 'GeneReviews proposes longitudinal neurologic and developmental assessment, brain
          MRI and MRA, growth and orthopedic review, annual ocular assessment, periodic echocardiography,
          and pulmonary testing. These are expert-review recommendations for the broader mitochondrial
          proline-synthesis disorder group and should be individualized for ADCL.

          '
        action_category: MONITORING
        treatment_term:
          preferred_term: clinical monitoring
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: 'Neurologic exam initially every six months then annually; EEG as clinically indicated;
          brain MRI every ten years or more frequently in those with imaging abnormalities or new neurologic
          concerns; monitor developmental progress and educational needs every six months initially then
          annually; assess growth at each visit; assess for orthopedic manifestations every six months
          until age one year then annually; anterior chamber evaluation to assess for corneal clouding
          and cataract annually; echocardiogram every three years or more frequently in those with abnormal
          findings; brain MR angiogram every ten years or more frequently in those with abnormal findings;
          peak flow measurements or pulmonary function tests every three years beginning at age eight
          years.

          '
        supports: SUPPORT
