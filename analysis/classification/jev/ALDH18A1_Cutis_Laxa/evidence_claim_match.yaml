            term:
              id: MONDO:0014706
              label: cutis laxa, autosomal dominant 3
        context: []
      assertion_type: Genetic
      assertion:
        name: ALDH18A1
        gene_term:
          preferred_term: ALDH18A1
          term:
            id: hgnc:9722
            label: ALDH18A1
        association: Causative
        features: 'Recurrent de novo heterozygous missense mutations affecting residue Arg138 of P5CS
          (R138W, R138Q, R138L) have been reported in multiple affected individuals. A substitution at
          Arg126 (R126H) and a substitution at Ser134 (S134P) have also been described. Functional evidence
          for p.Arg138Trp shows stable mutant P5CS that interacts with wild-type protein but has altered
          submitochondrial distribution and complex organization, consistent with a dominant-negative
          mechanism. The same functional mechanism has not been directly established for p.Arg138Gln,
          p.Arg138Leu, p.Arg126His, or p.Ser134Pro.

          '
        inheritance:
        - name: Autosomal Dominant
      selected_evidence:
        snippet: We found three heterozygous mutations in ALDH18A1 leading to amino acid substitutions
          of the same highly conserved residue, Arg138 in P5CS.
        supports: SUPPORT
