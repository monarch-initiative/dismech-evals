        results: Pathogenic ALDH18A1 variant(s), variant-disease association, zygosity, segregation, and
          phenotype consistent with the suspected SPG9A, SPG9B, or ARCL3A branch support the molecular
          diagnosis.
      selected_evidence:
        snippet: In 2015 to 2016, an upper motor neuron syndrome (spastic paraparesis/paraplegia SPG9)
          complicated with some traits of the neurocutaneous syndrome, although without report of cutis
          laxa, joint laxity, or herniae, was associated with monoallelic or biallelic ALDH18A1 mutations
          with, respectively, dominant and recessive inheritance.
        supports: SUPPORT
