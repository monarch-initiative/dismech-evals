          term:
            id: MONDO:0014702
            label: autosomal recessive complex spastic paraplegia type 9B
        description: 'Autosomal recessive hereditary spastic paraplegia caused by biallelic ALDH18A1 pathogenic
          variants. Many reported cases have earlier onset and more complex neurologic disease than SPG9A,
          but later-onset SPG9B without cognitive impairment is documented. Published SPG9 cohorts did
          not have the cutis laxa, joint laxity, or hernia phenotype that defines the cutis-laxa branches.

          '
      selected_evidence:
        snippet: 'conclude that both mutations are disease-causing, that SPG9B associates with

          partial P5CS deficiency and that it is clinically more severe than SPG9A, as

          reflected in onset age, disability, cognitive status, growth, and dysmorphic

          traits.'
        supports: SUPPORT
