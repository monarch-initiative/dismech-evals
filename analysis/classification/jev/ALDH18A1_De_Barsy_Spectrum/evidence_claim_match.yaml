        context: []
      assertion_type: Genetic
      assertion:
        name: ALDH18A1
        gene_term:
          preferred_term: ALDH18A1
          term:
            id: hgnc:9722
            label: ALDH18A1
        association: Causative
        features: 'ALDH18A1 encodes the bifunctional mitochondrial enzyme P5CS (delta-1-pyrroline-5-carboxylate
          synthetase) composed of glutamate 5-kinase (G5K) and gamma-glutamyl phosphate reductase (G5PR)
          domains. Mutations in either domain can cause disease. Reduced P5CS function is the shared mechanism,
          but the molecular effect and residual activity are variant dependent. Dominant-negative action
          is proposed for dominant variants. Low plasma amino acids have been reported for some variants,
          whereas other molecularly confirmed cases have normal profiles; domain location is therefore
          not a reliable diagnostic rule.

          '
        inheritance:
        - name: Autosomal Dominant
        - name: Autosomal Recessive
      selected_evidence:
        snippet: 'Mutations in ALDH18A1 can cause autosomal recessive and dominant hereditary

          spastic paraplegia and autosomal recessive and dominant cutis laxa.'
        supports: SUPPORT
    origin:
