        description: 'Autosomal dominant hereditary spastic paraplegia caused by heterozygous ALDH18A1
          pathogenic variants. Presentations range from pure to complex HSP; age at onset and additional
          findings, including cognitive involvement, are variable. Reduced P5CS function is established,
          while dominant-negative action is a proposed mechanism for dominant variants rather than a universal
          property of every SPG9A allele.

          '
