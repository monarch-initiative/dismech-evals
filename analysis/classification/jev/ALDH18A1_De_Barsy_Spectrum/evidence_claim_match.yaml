              (G5PR) domains. Mutations in either domain can cause disease. Reduced P5CS function is the
              shared mechanism, but the molecular effect and residual activity are variant dependent.
              Dominant-negative action is proposed for dominant variants. Low plasma amino acids have
              been reported for some variants, whereas other molecularly confirmed cases have normal profiles;
              domain location is therefore not a reliable diagnostic rule.

