      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_alg1_cdg_model
        hypothesis_label: Canonical ALG1-CDG Precursor Assembly and Protein Hypoglycosylation Model
        status: CANONICAL
        description: Biallelic ALG1 loss of function reduces ER beta-1,4-mannosyltransferase activity,
          blocking transfer of the first mannose onto dolichol-pyrophosphate-GlcNAc2. GlcNAc2-PP-dolichol
          and GlcNAc1-PP-dolichol precursors accumulate, full-sized dolichol-linked oligosaccharide synthesis
          is impaired, and truncated glycans are transferred to nascent proteins, producing under-occupied
          N-glycosylation sites and a type I transferrin pattern.
      selected_evidence:
        snippet: indicated a severely reduced activity of the beta 1,4-mannosyltransferase, elongating
          GlcNAc(2)-PP-dolichol to Man(1)GlcNAc(2)-PP-dolichol at the cytosolic side of the endoplasmic
          reticulum.
        supports: SUPPORT
