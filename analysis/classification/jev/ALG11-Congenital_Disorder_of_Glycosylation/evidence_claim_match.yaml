      assertion_type: ExperimentalModel
      assertion:
        name: ALG11-CDG fibroblasts treated with liposomal mannose-1-phosphate
        experimental_model_type: PRIMARY_CELL_CULTURE
        description: Fibroblasts from two individuals homozygous for p.Pro311Leu or p.Thr55Ala were treated
          with 1 mM GLM101 for 24 hours in low-glucose culture and assessed by multiplexed proteomics
          and N-glycoproteomics. Some mature high-mannose glycopeptides increased, with a smaller response
          than in PMM2-CDG and ALG2-CDG. This is an experimental cellular intervention, not evidence of
          benefit in treated people.
        publication: PMID:38733638
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        modeled_mechanisms:
        - target: Protein Hypoglycosylation
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Partial shifts toward larger high-mannose glycoforms were observed after treatment;
            this does not establish complete normalization of glycosylation.
          limitations: Only two ALG11 donor lines were studied. The main comparison was treated versus
            untreated fibroblasts; an empty-liposome pilot was described for PMM2 cells only. There was
            no ALG11 clinical efficacy study, no demonstration of brain delivery, and no established correction
            of neurological disease. Increased substrate utilization through residual enzyme activity
            is proposed rather than directly measured in these ALG11 cells.
          readouts:
          - name: High-mannose glycopeptide abundance
            target: Protein Hypoglycosylation
            direction: ALTERED
            interpretation: Eighty-seven significantly increased high-mannose glycopeptides exceeded a
              1.5-fold change and contained Man6 or higher glycans; smaller glycans often decreased.
      selected_evidence:
        snippet: '| P7 | 10/F | ALG11 | c.932C>T/c.932C>T | p.P311L/p.P311L |'
        supports: SUPPORT
