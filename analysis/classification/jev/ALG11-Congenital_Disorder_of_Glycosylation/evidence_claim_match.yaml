        features: Reported ALG11 alleles include missense, frameshift and splice-site variants and a whole-gene
          deletion. The index variant was homozygous c.257T>C (p.Leu86Ser). The 2019 deletion/p.Leu46Pro
          genotype illustrates how a deletion can make a sequence variant appear homozygous. Homozygous
