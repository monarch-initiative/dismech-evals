      assertion_type: Genetic
      assertion:
        name: ALG11
        gene_term:
          preferred_term: ALG11
          term:
            id: hgnc:32456
            label: ALG11
        association: Biallelic loss-of-function variants
        features: Reported ALG11 alleles include missense, frameshift and splice-site variants and a whole-gene
          deletion. The index variant was homozygous c.257T>C (p.Leu86Ser). The 2019 deletion/p.Leu46Pro
          genotype illustrates how a deletion can make a sequence variant appear homozygous. Homozygous
          c.953A>C (p.Gln318Pro) recurred in three unrelated Turkish families reported in 2025; recurrence
          alone does not establish a founder effect. No robust genotype–phenotype prediction follows from
          the small series.
        relationship_type: CAUSATIVE
        notes: The reviewed reports do not establish complete penetrance through systematic assessment
          of all biallelic carriers; no penetrance estimate is assigned.
      selected_evidence:
        snippet: Verification of the mutation as a primary cause for the genetic defect was proved by
          retroviral expression of human wild-type and mutated ALG11 cDNA in patient-derived fibroblasts
          as well as using a yeast alg11 deletion strain as a heterologous expression system for hALG11
          variants.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
