        status: EMERGING
        description: A rare severe prenatal or neonatal branch may extend ALG12-CDG to multicystic renal
          malformation and skeletal-dysplasia-like abnormalities. This branch is kept separate from the
          canonical clinical spectrum because it is supported by limited severe-case evidence and its
          organ-specific intermediates are unknown.
      selected_evidence:
        snippet: We report on a case expanding the phenotype of ALG12-CDG to include bilateral, multicystic
          kidneys in a neonatal demise identified with homozygous pathogenic variants in the ALG12 gene
          at c.1001del (p.N334Tfs*15) through clinical trio exome sequencing.
        supports: SUPPORT
