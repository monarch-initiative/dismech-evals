        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_alg12_cdg_model
        hypothesis_label: Canonical ALG12-CDG Glycoprotein Hypoglycosylation Model
        status: CANONICAL
        description: Biallelic loss of ALG12 function reduces the ER alpha1,6-mannosyltransferase step
          in lipid-linked oligosaccharide assembly. The resulting precursor defect causes underoccupancy
          and abnormal N-glycosylation of multiple proteins and a multisystem CDG phenotype. The biochemical
          sequence is canonical, while the tissue-specific intermediates connecting systemic glycoprotein
          dysfunction to individual clinical findings remain unresolved.
      selected_evidence:
        snippet: In the patient's fibroblasts, the biosynthetic intermediate GlcNAc(2)Man(7) oligosaccharide
          was detected both on the lipid carrier dolichyl pyrophosphate and on newly synthesized glycoproteins,
          thus pointing to a defect in the dolichyl pyrophosphate-GlcNAc(2)Man(7)-dependent ALG12 alpha1,6
          mannosyltransferase.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12217961
      reference_title: ALG12 mannosyltransferase defect in congenital disorder of glycosylation type lg.
      evidence_source: IN_VITRO
      explanation: Patient-fibroblast measurements directly support the ALG12 precursor-assembly defect
        at the center of the canonical model.
