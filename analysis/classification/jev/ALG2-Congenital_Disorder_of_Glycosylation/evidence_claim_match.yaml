      assertion_type: Pathophysiology
      assertion:
        name: Photoreceptor Maintenance Failure
        biological_scale: TISSUE
        description: 'An engineered model of the index patient''s allele loses rod photoreceptors progressively,
          with the phototransduction machinery massively under-represented at the protein level, giving
          retinitis pigmentosa. No human ALG2-CDG patient has been reported with retinitis pigmentosa,
          so this node records a model finding whose translational status is open; it is flagged as a
          human/model mismatch rather than asserted as human disease biology. The eye features that are
          established in patients are developmental — iris coloboma and nystagmus — not degenerative.

          This node is deliberately model-only: it has no inbound pathophysiology edge and no outbound
          edge to a human phenotype. An earlier version pointed it at Iris coloboma, which was wrong in
          the way this description already says it would be — coloboma is a failure of optic fissure closure
          during development, not a consequence of progressive rod loss. Wiring the node into the human
          chain in either direction would assert the translational claim the HUMAN_MODEL_MISMATCH discussion
          exists to hold open.'
      selected_evidence:
        snippet: These deficiencies relate to a specific failure to maintain rod photoreceptors, resulting
          in retinitis pigmentosa characterized by the progressive loss of these photoreceptors.
        supports: SUPPORT
