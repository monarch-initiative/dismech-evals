      assertion_type: ExperimentalModel
      assertion:
        name: Medaka alg2 p.G336* knock-in
        experimental_model_type: OTHER
        description: A CRISPR knock-in medaka (Oryzias latipes) carrying a premature stop at the position
          orthologous to the index patient's c.1040delG allele. Homozygotes are normal through early embryogenesis
          and then decompensate shortly before hatching, dying 2-3 days post-hatch, which reproduces the
          human normal-at-birth, first-year-onset pattern in miniature.
        publication: PMID:34106226
        modeled_mechanisms:
        - target: Protein Hypoglycosylation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Reduced N-glycan levels were measured in the fish and, in the same study, in the
            patient's fibroblasts, so the molecular phenotype is matched across species.
          limitations: A teleost is not a mammal, and the allele modelled is a premature stop at the orthologous
            position rather than the human frameshift itself. The model is homozygous for one engineered
            allele where the index patient was compound heterozygous.
          readouts:
          - name: Total N-glycan level
            target: Protein Hypoglycosylation
            direction: DECREASED
            interpretation: The core biochemical defect, measured in both the model and human patient
              cells.
        - target: Photoreceptor Maintenance Failure
          relationship: RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: Progressive rod loss with under-representation of phototransduction proteins. This
            is the model's most striking finding and its least transferable one.
          limitations: No human ALG2-CDG patient has been reported with retinitis pigmentosa. Teleost
            and mammalian retinas differ in rod regeneration capacity and in photoreceptor turnover, and
            the fish dies within days of hatching, so the timescale has no human counterpart. The node
            this links to exists only to hold the model finding.
          readouts:
          - name: Rod photoreceptor number
            target: Photoreceptor Maintenance Failure
            direction: DECREASED
            interpretation: Progressive elimination of rods over the fish's short lifespan.
      selected_evidence:
        snippet: We modelled a putative hypomorphic mutation described in an alpha-1,3/1,6-mannosyltransferase
          (ALG2) index patient (ALG2-CDG) to address the developmental consequences in the teleost medaka
          (Oryzias latipes).
        supports: SUPPORT
