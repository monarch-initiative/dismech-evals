              label: ALG2-congenital disorder of glycosylation
        context: []
      assertion_type: Genetic
      assertion:
        name: ALG2
        gene_term:
          preferred_term: ALG2
          term:
            id: hgnc:23159
            label: ALG2
        relationship_type: CAUSATIVE
        notes: ALG2 (9q31.1) encodes the ER alpha-1,3/1,6-mannosyltransferase. Every published ALG2-CDG
          genotype is biallelic. The functionally characterised alleles act by lowering protein abundance
          rather than by producing a normally-expressed but catalytically dead enzyme, which fits the
          observation that complete loss of ALG2 is expected to be lethal and that surviving patients
          carry hypomorphic combinations.
        variants:
        - name: c.1040delG (p.Gly347Valfs*26)
          description: The maternal allele of the index patient. A frameshift truncating the glycosyltransferase
            domain; used as the template for the medaka model.
        - name: p.Val68Gly
          description: Identified in one of the two congenital myasthenic syndrome kindreds and shown
            to severely reduce ALG2 expression in patient muscle and in culture.
        - name: c.752G>T (p.Arg251Leu)
          description: Homozygous in three Argentinean patients; reduces ALG2 protein level and glycan
            content in a photoreceptor cell model.
      selected_evidence:
        snippet: Mutations were identified in two kinships, with mutation ALG2p.Val68Gly found to severely
          reduce ALG2 expression both in patient muscle, and in cell cultures.
        supports: SUPPORT
