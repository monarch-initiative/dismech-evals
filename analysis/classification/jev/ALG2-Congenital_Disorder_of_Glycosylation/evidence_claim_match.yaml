        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Stalled Dolichol-Linked Oligosaccharide Assembly
        biological_scale: MOLECULAR
        description: 'ALG2 makes the first branch of the lipid-linked oligosaccharide, adding both the
          alpha-1,3- and alpha-1,6-mannose to Man1GlcNAc2-PP-dolichol to give the branched Man3GlcNAc2-PP-dolichol.
          When it is deficient the pathway backs up at the immediately preceding species: patient fibroblasts
          accumulate Man1GlcNAc2-PP-dolichol and Man2GlcNAc2-PP-dolichol instead of proceeding to the
          mature Glc3Man9GlcNAc2 donor.'
        biological_processes:
        - preferred_term: dolichol-linked oligosaccharide biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0006488
            label: dolichol-linked oligosaccharide biosynthetic process
      selected_evidence:
        snippet: An accumulation of Man1GlcNAc2-PP-dolichol and Man2GlcNAc2-PP-dolichol was observed in
          skin fibroblasts of the patient.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
