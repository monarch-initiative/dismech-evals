            term:
              id: MONDO:0011933
              label: ALG2-congenital disorder of glycosylation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ALG2 Alpha-1,3/1,6-Mannosyltransferase Deficiency
        biological_scale: MOLECULAR
        conforms_to: congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect
        description: 'Biallelic ALG2 variants reduce the abundance or catalytic activity of the ER membrane
          enzyme that adds both the alpha-1,3- and the alpha-1,6-mannose to Man1GlcNAc2-PP-dolichol. Reported
          alleles act by destabilising the protein rather than by abolishing catalysis on an otherwise
          normal enzyme: both the p.Gly80Asp missense and the p.Gly347Valfs*27 frameshift were shown to
          work through markedly reduced ALG2 expression, and the p.Arg251Leu homozygous allele likewise
          lowers protein level in a cell model.'
        molecular_functions:
        - preferred_term: ALG2 alpha-1,3-mannosyltransferase activity
          modifier: DECREASED
          term:
            id: GO:0000033
            label: alpha-1,3-mannosyltransferase activity
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Western blot in whole cell lysates of HEK293 cells transfected with p.Gly80Asp, or p.Gly347Valfs*27
          expression constructs indicated that p.Gly347Valfs*27 is likely a null allele and p.Gly80Asp
          is pathogenic through marked reduction of ALG2 expression.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34980536
      reference_title: 'Novel pathogenic ALG2 mutation causing congenital myasthenic syndrome: A case
        report.'
      evidence_source: IN_VITRO
      explanation: Shows the mechanism of two alleles is reduced protein abundance, not altered kinetics
        of a normally expressed enzyme.
