        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ALG3 Alpha-1,3-Mannosyltransferase Deficiency
        biological_scale: MOLECULAR
        conforms_to: congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect
        description: 'ALG3 is the endoplasmic reticulum alpha-1,3-mannosyltransferase (historically mannosyltransferase
          VI) that transfers the sixth mannose residue onto the growing lipid-linked oligosaccharide on
          the luminal face of the ER. Biallelic loss of function stalls assembly at that exact step, which
          is the organ-specific substitution this entry makes against the conserved CDG module: the module''s
          generic assembly defect is here a single, positionally defined missing sugar.'
        genes:
        - preferred_term: ALG3
          term:
            id: hgnc:23056
            label: ALG3
        molecular_functions:
        - preferred_term: alpha-1,3-mannosyltransferase activity
          term:
            id: GO:0000033
            label: alpha-1,3-mannosyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: dolichol-linked oligosaccharide biosynthetic process
          term:
            id: GO:0006488
            label: dolichol-linked oligosaccharide biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: Here we show that the molecular defect in the index patient is a missense mutation in
          the gene encoding the mannosyltransferase that transfers mannose from dolichyl-phosphate mannose
          on to the lipid-linked oligosaccharide (LLO) intermediate Man(5)GlcNAc(2)-PP-dolichol.
        supports: SUPPORT
    origin:
