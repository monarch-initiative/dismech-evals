  4e958f064ce172c71ab13f3ef39610981720fb7262bf8cf4fdad951271466117:
    claim:
      about:
        disease:
          name: ALG3-congenital disorder of glycosylation
          disease_term:
            preferred_term: ALG3-congenital disorder of glycosylation
            term:
              id: MONDO:0010998
              label: ALG3-congenital disorder of glycosylation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_alg3_glycan_signature_as_biomarker
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Can the ALG3-specific N-glycan signature serve as a quantitative severity or treatment-response
          biomarker rather than only a diagnostic fingerprint?
        attaches_to:
        - pathophysiology#Truncated Man5GlcNAc2 Lipid-Linked Precursor
        - pathophysiology#Multisystem Glycoprotein Dysfunction
        rationale: The combined deficiency of hybrid glycans and of extension beyond Man5GlcNAc2 is described
          as unique to ALG3-CDG, which establishes it as a diagnostic fingerprint. What is not established
          is whether the magnitude of that deviation tracks clinical severity across the small published
          population, or whether it would move under any intervention. Without that, any future trial
          in this ultra-rare disorder has no surrogate endpoint and would have to rely on clinical outcomes
          in a population where about half die neonatally.
        proposed_experiments:
        - experiment_id: exp_alg3_glycan_severity_correlation
          name: Correlating quantitative N-glycan deviation with clinical severity across the reported
            ALG3-CDG cohort
          description: Assemble quantitative N-glycan profiles alongside standardized severity scoring
            and residual enzyme activity across available ALG3-CDG individuals and, where possible, serial
            samples, to test whether glycan deviation predicts severity and whether it varies within an
            individual over time.
          decision_criterion: A monotonic relationship between glycan deviation and severity score, stable
            within individuals, would qualify it as a candidate surrogate endpoint.
          supporting_outcome:
          - Glycan deviation tracks severity and is a viable surrogate endpoint for trials
          refuting_outcome:
          - Glycan profile is invariant across severities, confining it to a purely diagnostic role
      selected_evidence:
        snippet: The degree of elevation of the mono/di oligo ratio of transferrin may correlate with
          severity and/or age, as seen in other CDGs, but we do not have enough power to definitively
          illustrate this.
        supports: SUPPORT
