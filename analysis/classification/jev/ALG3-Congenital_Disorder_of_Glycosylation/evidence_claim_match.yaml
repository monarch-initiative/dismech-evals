      assertion:
        name: Antithrombin III
        presence: DECREASED
        notes: Low antithrombin III is the most common haematologic defect, alongside decreased factor
          XI and a prolonged activated partial thromboplastin time. Coagulopathy is a classic congenital-disorder-of-glycosylation
