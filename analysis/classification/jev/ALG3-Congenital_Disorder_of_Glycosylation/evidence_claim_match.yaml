        biological_scale: MOLECULAR
        description: ALG3 deficiency causes Man5GlcNAc2-PP-dolichol to accumulate, while the leaky enzymatic
          defect permits some full-length precursor formation. Truncated oligosaccharides are transferred
          alongside full-length species, and later Golgi processing generates characteristic Man3-4 structures.
          The combined deficiency of hybrid glycans and extension beyond Man5GlcNAc2 is a disease-characteristic
          biochemical fingerprint.
        biological_processes:
        - preferred_term: dolichol-linked oligosaccharide biosynthetic process
          term:
            id: GO:0006488
            label: dolichol-linked oligosaccharide biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: The defect results in the accumulation of the LLO intermediate and, due to its leaky
          nature, a residual formation of full-length LLOs.
        supports: SUPPORT
