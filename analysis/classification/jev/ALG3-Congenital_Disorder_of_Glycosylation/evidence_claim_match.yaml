          of normal against a reference range of 86-145%. A structured reference_ranges block with a LOINC
          binding is a natural follow-up; the LOINC codes were not verified during this curation, so the
          interval is recorded here as source-quoted text rather than as a machine-readable range.
      selected_evidence:
        snippet: 'Low antithrombin III (43-59; RR: 86%-145%), decreased factor XI (44%-46%; RR 63%-142%),
          and prolonged APTT (37.2-58; RR 22-36 seconds) were the most common hematologic defects.'
