  e59e2949d9f7ea57190760376679a8833b201ee7a80a3e70eebf88cff1c66627:
    claim:
      about:
        disease:
          name: ALG3-congenital disorder of glycosylation
          disease_term:
            preferred_term: ALG3-congenital disorder of glycosylation
            term:
              id: MONDO:0010998
              label: ALG3-congenital disorder of glycosylation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_alg3_truncated_versus_absent_glycan
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the severity of ALG3-CDG driven by the absence of mature glycan, or by the active transfer
          of a truncated Man5GlcNAc2 glycan that misfolds or mistargets its carrier proteins?
        attaches_to:
        - pathophysiology#Truncated Man5GlcNAc2 Lipid-Linked Precursor
        - pathophysiology#Protein Hypoglycosylation
        rationale: 'ALG3-CDG does not simply fail to glycosylate: it transfers a short, abnormal glycan,
          and the resulting N-glycan spectrum is disease characteristic. Patient fibroblasts now establish
          chronic UPR and ERAD activation, but do not distinguish toxicity of the truncated glycan from
          the consequences of missing mature glycans. That raises the possibility that the truncated glycan
          is actively harmful rather than merely insufficient, which would explain why a block partway
          along the assembly line is so severe. Distinguishing loss of function from gain of a bad glycan
          matters therapeutically, because the two imply opposite strategies: supplying the missing sugar
          versus preventing transfer of the truncated precursor.'
        proposed_experiments:
        - experiment_id: exp_alg3_truncated_glycan_toxicity
          name: Comparing truncated-glycan transfer against no-transfer in ALG3-deficient cells
          description: In ALG3-deficient patient fibroblasts, compare glycoprotein folding, trafficking
            and ER stress between the native truncated-transfer state and a state where oligosaccharyltransferase-mediated
            transfer of the truncated precursor is blocked, to determine whether removing the abnormal
            glycan improves or worsens client protein handling.
          decision_criterion: Improved client folding and reduced ER stress when truncated transfer is
            blocked would show the short glycan is actively harmful.
          supporting_outcome:
          - The truncated glycan is actively deleterious, favouring strategies that prevent its transfer
          refuting_outcome:
          - Blocking transfer worsens outcomes, confirming that any glycan is better than none and favouring
