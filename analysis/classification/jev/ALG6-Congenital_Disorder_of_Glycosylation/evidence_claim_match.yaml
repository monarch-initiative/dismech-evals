      assertion_type: ExperimentalModel
      assertion:
        name: ALG6-deficient Saccharomyces cerevisiae complementation assay
        experimental_model_type: OTHER
        description: Human wild-type or p.Ala333Val ALG6 was expressed in Saccharomyces cerevisiae alg6
          mutants. CPY glycoform rescue and synthetic growth rescue in alg6 wbp1-2 double mutants are
          distinct readouts. These assays support impaired but residual activity of the founding allele;
          they did not test every human variant.
        publication: PMID:10359825
        modeled_mechanisms:
        - target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Heterologous complementation assesses functional capacity of the human construct
            in a yeast pathway.
          limitations: Growth and CPY glycosylation depend on yeast background, expression and assay conditions.
            Failure of one rescue readout is not a quantitative zero-activity measurement or proof of
            human organ pathology.
          readouts:
          - name: Failure of mutant CPY glycosylation rescue
            target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
            direction: INCREASED
            interpretation: Compared with the partially rescuing wild-type human construct, p.Ala333Val
              leaves CPY hypoglycosylation uncorrected in this assay.
          - name: Growth rescue in alg6 wbp1-2 yeast
            target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
            direction: DECREASED
            interpretation: The p.Ala333Val construct partially restores growth, supporting residual function.
      selected_evidence:
        snippet: Expression of the human ALG5 and ALG6 cDNA could partially complement the respective
          S. cerevisiae alg5 and alg6 deficiency.
        supports: SUPPORT
