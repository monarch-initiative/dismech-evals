        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
        conforms_to: congenital_disorder_of_glycosylation#ER Lipid-Linked Oligosaccharide Assembly Defect
        biological_scale: MOLECULAR
        description: Biallelic ALG6 variants impair the ER-luminal alpha-1,3-glucosyltransferase that
          transfers the first glucose from dolichylphosphate-glucose onto the dolichol-linked Man9GlcNAc2
          intermediate. Pathogenicity of individual alleles has been established by their failure to complement
          an ALG6-deficient Saccharomyces cerevisiae strain.
        genes:
        - preferred_term: ALG6
          term:
            id: hgnc:23157
            label: ALG6
        molecular_functions:
        - preferred_term: alpha-1,3-glucosyltransferase activity
          modifier: DECREASED
          term:
            id: GO:0042281
            label: dolichyl pyrophosphate Man9GlcNAc2 alpha-1,3-glucosyltransferase activity
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
      selected_evidence:
        snippet: By contrast, the mutant ALG6 cDNA of CDGS patients failed to revert the hypoglycosylation
          observed in alg6 yeasts, thereby proving a functional relationship between the alanine to valine
          substitution introduced by the C-->T transition and the CDGS phenotype.
        supports: SUPPORT
