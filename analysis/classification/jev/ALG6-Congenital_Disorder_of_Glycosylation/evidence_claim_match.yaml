          Euroglycan cohort, eleven children died before the age of four, of protein-losing enteropathy,
          sepsis or seizures, while the oldest patient in the same cohort was a 40-year-old woman. Protein-losing
          enteropathy is therefore not only a morbidity: it is among the named causes of death.'
      selected_evidence:
        snippet: The oldest patient was a 40 year-old Dutch woman.
        supports: SUPPORT
