        experimental_model_type: OTHER
        description: Saccharomyces cerevisiae ALG6 expressed through an Sf9/baculovirus system was purified
          for cryo-EM and synthetic-substrate assays. The apo nanodisc structure is 3.0 Å and donor-bound
          detergent structure 3.9 Å. Patient positions were mapped onto the yeast structure; they were
          not functionally tested as a clinical allele series. The acceptor groove, donor-glucose geometry
          and binding order remain incompletely resolved.
        publication: PMID:32103179
        modeled_mechanisms:
        - target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
          relationship: PERTURBS
          fidelity: MODERATE
          description: Engineered catalytic-site substitutions interrogate the conserved first-glucose
            reaction.
          limitations: Asp69/Asp99/His378 substitutions are engineered yeast variants, not patient alleles.
            Endpoint incubation times differ between wild type and mutants; most assays were conducted
            once. The STT3-coupled readout is distinct from ALG6 catalysis. No patient residual-activity
            threshold, clinical rescue or human tissue mechanism is established.
          readouts:
          - name: Engineered Asp69 substitution reduces transfer
            target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
            direction: INCREASED
            interpretation: Asp69Ala abolishes and Asp69Asn reduces the measured transfer reaction.
      selected_evidence:
        snippet: Purified ALG6 indeed retains activity in the presence of EDTA
        supports: SUPPORT
