            term:
              id: MONDO:0011291
              label: ALG6-congenital disorder of glycosylation 1C
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: ALG6-deficient Saccharomyces cerevisiae complementation assay
        experimental_model_type: OTHER
        description: Yeast lacking the ALG6 orthologue accumulate the same unglucosylated lipid-linked
          oligosaccharide as patient cells, so patient alleles can be scored by whether they restore glycosylation
          when expressed in that strain. This assay is what established pathogenicity for the founding
          p.Ala333Val allele and has been used for every subsequent allele, including the contested p.Tyr131His.
        publication: PMID:10359825
        modeled_mechanisms:
        - target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
          relationship: MEASURES
          fidelity: MODERATE
          description: Reads out residual ALG6 catalytic function of a human allele in a null background.
          limitations: 'A yeast cell is not a human cell, and the assay measures glycosylation rescue
            rather than the human clinical phenotype. Its limits are visible in this disease: it grades
            p.Tyr131His as severe as the common pathogenic allele, yet the one reported human homozygote
            had normal transferrin glycosylation. Growth rate also modulates the readout, so assay conditions
            affect the apparent severity of an allele.'
          readouts:
          - name: Rescue of hypoglycosylation in the alg6-null strain
            target: ALG6 Alpha-1,3-Glucosyltransferase Deficiency
            direction: ABOLISHED
            interpretation: Wild-type human ALG6 complements the yeast defect; the patient allele does
              not, which is the operational definition of loss of function used here.
      selected_evidence:
        snippet: Expression of the human ALG5 and ALG6 cDNA could partially complement the respective
          S. cerevisiae alg5 and alg6 deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10359825
      reference_title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes
        carbohydrate-deficient glycoprotein syndrome type-Ic.
      evidence_source: IN_VITRO
      explanation: Establishes that human ALG6 functionally substitutes in the yeast system, which is
        what makes the assay informative for human alleles.
