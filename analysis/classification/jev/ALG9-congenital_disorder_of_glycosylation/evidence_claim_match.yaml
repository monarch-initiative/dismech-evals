        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_alg9_cdg_model
        hypothesis_label: Canonical ALG9-CDG Precursor Assembly and Protein Hypoglycosylation Model
        status: CANONICAL
        description: Biallelic ALG9 loss of function reduces ER alpha-1,2-mannosyltransferase activity,
          causing Man6GlcNAc2-PP-dolichol and Man8GlcNAc2-PP-dolichol intermediates to accumulate. Transfer
          of incomplete oligosaccharides to proteins produces protein hypoglycosylation and a type I transferrin
          pattern, followed by multisystem disease through incompletely resolved client-protein and tissue-specific
          intermediates.
      selected_evidence:
        snippet: Hypoglycosylation was confirmed by the typical CDG type 1 pattern of serum transferrin
          analyzed by isoelectric focusing.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15945070
      reference_title: 'CDG-IL: an infant with a novel mutation in the ALG9 gene and additional phenotypic
        features.'
      evidence_source: HUMAN_CLINICAL
      explanation: The patient transferrin result supports protein hypoglycosylation as the central biochemical
        lesion downstream of the ALG9 precursor defect.
