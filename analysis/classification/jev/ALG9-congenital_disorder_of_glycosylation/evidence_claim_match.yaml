        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: emerging_er_quality_control_degradation_model
        hypothesis_label: Emerging ER Glycoprotein Quality-Control and Degradation Model
        status: EMERGING
        description: 'Glycoproteins bearing the truncated Man6GlcNAc2 and Man8GlcNAc2 structures can enter
          the ER glucosylation-deglucosylation quality-control cycle, while misfolded glycoproteins are
          degraded more rapidly in patient cells. This is a bounded cellular-response hypothesis: the
          in-vitro finding is established, but whether enhanced degradation materially contributes to
          human ALG9-CDG manifestations has not been demonstrated.'
      selected_evidence:
        snippet: We also showed that in comparison with control cells, patient's cells degraded misfolded
          glycoproteins at an increasing rate. The Man(8)GlcNAc(2) isomer C on the patient's glycoproteins
          was found to promote the degradation of misfolded glycoproteins.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
