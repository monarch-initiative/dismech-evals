              label: neuroblastoma, susceptibility to, 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: alk_nbts_surveillance_upper_age_bound
        kind: KNOWLEDGE_GAP
        prompt: Does the risk of a new neuroblastic tumor in a germline ALK carrier end in late childhood,
          as the current surveillance protocol assumes, or does it continue through adult life?
        attaches_to:
        - diagnosis#Carrier surveillance for neuroblastic tumors
        - pathophysiology#Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
        rationale: 'The surveillance protocol stops at age ten, on the reasoning that the permissive sympathoadrenal
          progenitor pool involutes and that risk falls through childhood. Against that, Mosse and colleagues
          report a carrier who developed bilateral adrenal neuroblastoma at 36 after an asymptomatic childhood,
          and argue for surveillance through adulthood using circulating tumor DNA and whole-body MRI.
          The disagreement is not about the penetrance figure but about whether the mechanism has a true
          endpoint: if a residual progenitor population persists in adults, the second-hit model predicts
          a lifelong hazard rather than a childhood-limited one. The dissenting evidence is a single kindred,
          so neither position is settled. Note that the JCO Precision Oncology report has no abstract
          in the reference cache, so it is listed as a reference rather than quoted as evidence here.'
        status: OPEN
        posed_by: 'dismech curation (neuroblastoma project, issue #15238)'
      selected_evidence:
        snippet: Screening beyond age ten years is not indicated.
        supports: SUPPORT
