            term:
              id: MONDO:0013083
              label: neuroblastoma, susceptibility to, 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
        biological_scale: TISSUE
        description: 'Sympathetic ganglia and the adrenal medulla carry an enlarged, persistently undifferentiated
          neuroblast population beyond the normal developmental window. An activating Alk allele at the
          endogenous mouse locus produces this on its own, and MYCN overexpression drives the same hyperplasia,
          so the germline allele and the cooperating somatic lesion both feed it. It is the permissive
          state of the carrier rather than a tumor: about half of carriers never develop a neuroblastic
          tumor at all, and tumor risk falls through childhood. What becomes of the pool in an unaffected
          human carrier is not reported - no study follows sympathoadrenal tissue in carriers - so this
          entry states the penetrance and the age gradient and does not claim that the hyperplasia regresses.'
        cell_types:
        - preferred_term: neural crest derived neuroblast
          term:
            id: CL:0002676
            label: neural crest derived neuroblast
        - preferred_term: sympathetic neuron
          term:
            id: CL:0011103
            label: sympathetic neuron
        - preferred_term: chromaffin cell
          term:
            id: CL:0000166
            label: chromaffin cell
        locations:
        - preferred_term: sympathetic ganglion
          term:
            id: UBERON:0001806
            label: sympathetic ganglion
        - preferred_term: adrenal medulla
          term:
            id: UBERON:0001236
            label: adrenal medulla
        biological_processes:
        - preferred_term: sympathetic nervous system development
          modifier: ABNORMAL
          term:
            id: GO:0048485
            label: sympathetic nervous system development
        - preferred_term: positive regulation of cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008284
            label: positive regulation of cell population proliferation
        - preferred_term: neuron differentiation
          modifier: DECREASED
          term:
            id: GO:0030182
            label: neuron differentiation
      selected_evidence:
        snippet: The overall penetrance of a germline ALK pathogenic variant is approximately 50%, with
          the risk for neuroblastic tumor development highest in infancy and decreasing by late childhood.
        supports: SUPPORT
