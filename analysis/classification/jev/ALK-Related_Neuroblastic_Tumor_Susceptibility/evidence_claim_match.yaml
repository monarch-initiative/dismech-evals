  6afcdc8016a92f3bbe09ca69b4c490b4909def952a1a2ed8af765824ec9a7fbb:
    claim:
      about:
        disease:
          name: ALK-Related Neuroblastic Tumor Susceptibility
          disease_term:
            preferred_term: neuroblastoma, susceptibility to, 3
            term:
              id: MONDO:0013083
              label: neuroblastoma, susceptibility to, 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: alk_nbts_models_engineer_away_penetrance
        kind: HUMAN_MODEL_MISMATCH
        prompt: Every available animal model of this syndrome reaches far higher penetrance than the human
          carrier state, so do these models tell us anything about risk, as opposed to about tumor formation
          once a second hit has occurred?
        attaches_to:
        - pathophysiology#Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
        - pathophysiology#Block of Developmentally Timed Neuroblast Apoptosis
        rationale: The defining clinical property of this syndrome is that about half of carriers never
          develop a tumor. The models invert that property. Compound MYCN and activated-ALK systems are
          selected and reported for high penetrance, and the transgenic lines drive supraphysiological,
          promoter-controlled expression rather than carrying one mutant allele at the endogenous locus.
          What the models therefore establish well is the mechanism of transformation given cooperation;
          what they cannot establish is why one carrier of the same allele is affected and a sibling is
          not. Human-specific sympathoadrenal development, including the contribution of Schwann cell
          precursors and the timing of commitment, is a plausible part of that answer and is exactly what
          the fish and mouse systems do not reproduce. The gap is not that evidence is missing but that
          the available evidence comes from systems built to remove the variable of interest.
        status: OPEN
        posed_by: 'dismech curation (neuroblastoma project, issue #15238)'
      selected_evidence:
        snippet: The overall penetrance of a germline ALK pathogenic variant is approximately 50%, with
          the risk for neuroblastic tumor development highest in infancy and decreasing by late childhood.
        supports: SUPPORT
