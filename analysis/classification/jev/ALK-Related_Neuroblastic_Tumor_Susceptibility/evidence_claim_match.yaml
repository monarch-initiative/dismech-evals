            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        penetrance_percentage: '50'
        expressivity: VARIABLE
        de_novo_rate: unknown
        description: 'Transmitted as a dominant trait with reduced penetrance, so a variant is frequently
          inherited from a clinically unaffected parent. Each child of a carrier has a 50% chance of inheriting
          the variant; the chance that an inheriting child develops a tumor is about 50% again. Penetrance
          for any neuroblastic tumor is approximately 50%, age-dependent and highest in infancy. Expressivity
          is highly variable within a single family: tumor type (neuroblastoma versus ganglioneuroma),
          site, number of foci, stage and outcome all differ between carriers of the same allele, and
          obligate carriers who never develop a tumor are common. GeneReviews states explicitly that the
          proportion of probands with a de novo variant has not been established.'
      selected_evidence:
        snippet: The overall penetrance of a germline ALK pathogenic variant is approximately 50%, with
          the risk for neuroblastic tumor development highest in infancy and decreasing by late childhood.
        supports: SUPPORT
