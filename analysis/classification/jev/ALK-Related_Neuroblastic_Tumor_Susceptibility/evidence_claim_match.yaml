              label: neuroblastoma, susceptibility to, 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Germline ALK Kinase Domain Activating Variant
        biological_scale: MOLECULAR
        description: 'A heterozygous missense substitution in the ALK tyrosine kinase domain is present
          in every cell from conception. The recurrent alleles reported in neuroblastoma families - R1275Q,
          G1128A, R1192P and T1151M/T1151R - all lie in the kinase domain. No germline truncating, frameshift,
          splice or whole-gene deletion allele causes this syndrome: the mechanism is gain of function,
          so loss-of-function alleles are not causal.'
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: Heterozygous activating missense variant in the ALK kinase domain, inherited from
            a frequently unaffected parent or arising de novo.
        genes:
        - preferred_term: ALK
          term:
            id: hgnc:427
            label: ALK
        molecular_functions:
        - preferred_term: ALK receptor tyrosine kinase activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004714
            label: transmembrane receptor protein tyrosine kinase activity
      selected_evidence:
        snippet: Resequencing of regional candidate genes identified three separate germline missense
          mutations in the tyrosine kinase domain of ALK that segregated with the disease in eight separate
          families.
        supports: SUPPORT
