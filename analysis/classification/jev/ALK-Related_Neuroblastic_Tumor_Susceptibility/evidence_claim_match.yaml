        - path: /animal_models/1
          value:
            name: Alk knock-in mouse (F1178L and R1279Q at the endogenous locus)
            species: Mouse
            genotype: Alk F1178L or Alk R1279Q knocked in at the endogenous locus (orthologs of human
              F1174L and R1275Q)
            publication: PMID:24811913
            description: 'The closest genetic model of this syndrome: one activating allele at the endogenous
              locus, which is what a human carrier has, rather than a promoter-driven transgene. The F1178L
              line shows enlarged sympathetic ganglia from embryonic life into adulthood with raised neuroblast
              proliferation before birth, and in a MYCN transgenic background F1178L gives a shorter tumor
              latency than R1279Q. R1279Q is the ortholog of R1275Q, the commonest human germline allele,
              and its tumors respond to crizotinib - matching the allele-specific inhibitor sensitivity
              recorded on the crizotinib treatment.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
        relationship: RECAPITULATES
        fidelity: HIGH
        model_scale: ORGANISM
        description: 'Reproduces the permissive state this entry turns on, from a single activating allele
          at physiological dosage and with no cooperating transgene: the sympathetic ganglia are enlarged
          and neuroblast proliferation is raised.'
        limitations: The ganglion enlargement is reported for F1178L, the ortholog of human F1174L, rather
          than for R1279Q; residue numbering differs from the human alleles by four, which is a trap for
          automated cross-species annotation. Mouse sympathoadrenal development does not reproduce human
          adrenal medulla ontogeny, and the model says nothing about what becomes of the pool in an unaffected
          carrier.
        readouts:
        - name: Sympathetic ganglion size and neuroblast proliferation
          target: Sympathoadrenal Neuroblast Hyperplasia and Delayed Differentiation
          direction: INCREASED
          interpretation: Ganglion enlargement persisting into adulthood, with the proliferative increase
            measured between E14.5 and birth, which is the developmental window the permissive state occupies.
      selected_evidence:
        snippet: A dramatic enlargement of sympathetic ganglia is observed in AlkF1178L mice from embryonic
          to adult stages associated with an increased proliferation of sympathetic neuroblasts from E14.5
          to birth.
        supports: SUPPORT
