    evidence_metadata:
      reference: PMID:24811913
      reference_title: Activated Alk triggers prolonged neurogenesis and Ret upregulation providing a
        therapeutic target in ALK-mutated neuroblastoma.
      evidence_source: MODEL_ORGANISM
      explanation: 'The observation this edge needs, and the only one here made without a MYCN transgene:
        a single activating Alk allele knocked in at the endogenous locus enlarges sympathetic ganglia
        and raises neuroblast proliferation. Mouse F1178L is the ortholog of human F1174L, so the residue
        numbering differs from the human allele by four; the paper reports the enlargement for F1178L
        rather than for R1279Q, the ortholog of the commonest human germline allele.'
