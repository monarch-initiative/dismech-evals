      assertion_type: Diagnosis
      assertion:
        name: Carrier surveillance for neuroblastic tumors
        description: The core actionable content of the entry. Asymptomatic carriers, and carriers already
          treated for a neuroblastic tumor, undergo abdominal ultrasound and urine catecholamine metabolite
          measurement every three months with physical examination and chest radiograph every six months
          from birth to age six, then the same tests six-monthly to age ten. The stated rationale is stage
          shift - detecting a tumor before it becomes high risk or causes end-organ damage.
        diagnosis_term:
          preferred_term: surveillance abdominal ultrasonography
          term:
            id: NCIT:C17230
            label: Ultrasound Imaging
        notes: Whether the age-ten boundary is right is disputed; see the knowledge gap recorded in discussions.
          Population-based newborn screening for neuroblastoma by urinary catecholamines is a different
          proposition and was abandoned after large trials, so this protocol is targeted at known carriers
          and should not be read as a population measure.
      selected_evidence:
        snippet: Screening beyond age ten years is not indicated.
        supports: SUPPORT
