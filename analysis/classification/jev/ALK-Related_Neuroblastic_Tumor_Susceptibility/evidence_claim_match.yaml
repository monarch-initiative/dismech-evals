          disease_term:
            preferred_term: neuroblastoma, susceptibility to, 3
            term:
              id: MONDO:0013083
              label: neuroblastoma, susceptibility to, 3
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Germline ALK sequencing
        description: 'The diagnosis requires two things, and the second is what makes it harder than most:
          a heterozygous germline ALK kinase-domain variant, plus evidence that the variant activates
          the kinase. A variant of uncertain significance in the kinase domain is not a diagnosis. Single-gene
          ALK sequencing is the test for at-risk relatives once the familial variant is known; a wider
          panel is the route when the differential is open, and ALK, PHOX2B and BARD1 are the three genes
          the neuroblastoma predisposition literature cited here establishes, which is a statement about
          those genes rather than about any particular commercial panel''s content. Chromosomal microarray,
          karyotype and FISH have no role in making this diagnosis, because there is no germline copy-number
          mechanism.'
        diagnosis_term:
          preferred_term: germline ALK sequencing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: 'Who to test: any patient with bilateral or multifocal primary neuroblastic tumors, any
          family history of a neuroblastic tumor, congenital neuroblastoma with encephalopathy or brainstem
          malformation, and any tumor-only finding of an ALK mutation at roughly 50% allele fraction.
          Young age at onset on its own is not a useful selection criterion.'
      selected_evidence:
        snippet: ALK-related neuroblastic tumor susceptibility is established by identification of a heterozygous
          germline ALK activating pathogenic variant in the tyrosine kinase domain that is known or suspected
          to cause altered kinase function by molecular genetic testing.
        supports: SUPPORT
