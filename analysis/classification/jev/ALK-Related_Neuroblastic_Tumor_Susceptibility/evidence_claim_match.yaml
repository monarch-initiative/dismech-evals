          are the hallmark that should raise suspicion of a germline ALK variant: all three germline variants
          in the French series arose in multifocal cases, against a background rate of 3-4% bilateral
          or multifocal primaries among neuroblastoma patients generally. There is no HPO term for multifocal
          primary neuroblastoma, so that feature is carried here rather than bound.'
        phenotype_term:
          preferred_term: Neuroblastoma
