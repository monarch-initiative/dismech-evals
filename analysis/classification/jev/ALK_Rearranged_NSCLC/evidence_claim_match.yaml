      assertion:
        name: Cohort-dependent ALK-rearrangement frequency
        description: ALK rearrangements define a minority molecular subtype whose measured frequency varies
          with histology, stage, population, and testing strategy. A surgical NSCLC cohort found 3.8%,
          whereas a large Chinese advanced-NSCLC cohort found 6.7%; these selected-cohort proportions
          are not population point-prevalence estimates.
      selected_evidence:
        snippet: The overall ALK gene rearrangement rate was 6.7% in 23,689 patients with advanced NSCLC
          and 8.2% in 17,436 patients with advanced lung adenocarcinoma.
        supports: SUPPORT
