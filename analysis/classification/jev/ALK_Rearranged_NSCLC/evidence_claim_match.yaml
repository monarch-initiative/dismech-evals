        hypothesis_label: Canonical ALK Fusion Mitogenic Signaling Model
        status: CANONICAL
        description: A somatic ALK fusion creates a constitutively active kinase that assembles cytoplasmic
          signaling foci and sustains MAPK and PI3K-AKT output. The resulting ALK-dependent proliferation
          and survival program drives the predominantly adenocarcinoma NSCLC phenotype and creates a targetable
          oncogene dependence. Metastatic progression to the CNS uses additional general invasion, dissemination,
          and colonization steps rather than a demonstrated direct ALK-to-brain route.
      selected_evidence:
        snippet: To evaluate potential treatment strategies for lung cancers driven by an activated EML4-ALK
          chimeric oncogene, we generated a genetically engineered mouse model that phenocopies the human
          disease where this rearranged gene arises.
