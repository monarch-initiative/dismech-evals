        discussion_id: alpk3_mavacamten_safety
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is mavacamten safe in ALPK3 cardiomyopathy given that most carriers are non-obstructive
          and a substantial minority are hypokinetic?
        attaches_to:
        - treatments#Mavacamten
        rationale: The only ALPK3 mavacamten data are ex vivo, from isolated cardiomyocytes of a knock-in
          mouse that does not itself develop overt wall thickening. The drug reduced fractional shortening
          as expected from its mechanism. Because outflow obstruction is uncommon in ALPK3 carriers, biallelic
          disease frequently presents hypokinetic, and about 15% of initial hypertrophic cases later burn
          out to a dilated phenotype, the population in which benefit would outweigh negative inotropy
          has not been defined.
      selected_evidence:
        snippet: In heterozygous ALPK3 PTVs, hypertrophy is typically apical or concentric, LVOT obstruction
          is uncommon (~4% overall), and systolic function is preserved in most.
        supports: SUPPORT
