        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: alpk3_risk_model_calibration
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do the conventional hypertrophic cardiomyopathy sudden-death risk models perform adequately
          in ALPK3 truncating variant carriers?
        attaches_to:
        - phenotypes#Ventricular tachycardia
        - phenotypes#Cardiac arrest
        - treatments#Implantable Cardioverter-Defibrillator
        rationale: 'Established risk models were derived largely from sarcomere-gene cohorts and weight
          maximal wall thickness and outflow tract gradient heavily. ALPK3 carriers have wall thickness
          comparable to sarcomere-negative patients, rarely have outflow obstruction, and yet carry extensive
          fibrosis and a rate of non-sustained ventricular tachycardia comparable to sarcomere-positive
          disease. No study has assessed model calibration in this genotype, so it is not known whether
          the models under-call risk here. Note that this entry asserts no sudden cardiac death phenotype:
          across every source curated here the only sudden-death language is generic background about
          hypertrophic cardiomyopathy, the recorded deaths are heart-failure deaths, and the largest heterozygous
          cohort reported no appropriate ICD shocks over follow-up and said outright that sudden-death
          risk could not be modelled in this genotype. The arrhythmic endpoint that is evidenced is cardiac
          arrest, in the paediatric biallelic group.'
      selected_evidence:
        snippet: The absence of arrhythmic events despite of the high proportion of ICD referrals, fibrosis
          and non-sustained ventricular tachycardia at baseline and follow-up did not allow modelling
          of SCD risk in patients with this particular genotype.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
