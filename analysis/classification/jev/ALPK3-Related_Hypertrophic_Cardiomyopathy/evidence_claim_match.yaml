      assertion_type: Discussion
      assertion:
        discussion_id: alpk3_pseudokinase_controversy
        kind: CONTROVERSY
        status: OPEN
        prompt: Is ALPK3 a catalytically inactive scaffold, or a genuine kinase that phosphorylates SQSTM1
          and other M-band proteins?
        attaches_to:
        - pathophysiology#Loss of M-Band Scaffolding
        rationale: 'Two groups reach opposite conclusions from overlapping systems. Agarwal and colleagues
          found no phosphoproteomic change on either inhibition or overexpression of the ALPK3 kinase
          domain and called ALPK3 a pseudokinase; a subsequent study found no activity in vitro and showed
          that mice carrying a kinase-dead knock-in of the invariant catalytic lysine are healthy into
          adulthood, which is the strongest in vivo argument for the pseudokinase view. McNamara and colleagues
          report the opposite: recombinant ALPK3 kinase domain increases phosphorylation in ALPK3-deficient
          cardiomyocyte lysates, and ALPK3 directly phosphorylates SQSTM1 at T269/S272. The same two studies
          also disagree on localization - the pseudokinase work places ALPK3 at both the nuclear envelope
          and the M-band, while endogenously tagged ALPK3 showed no nuclear localization at all. This
          is unresolved and matters therapeutically: a scaffold is addressed by replacing the protein,
          whereas a kinase might be addressed by restoring its downstream phosphorylation. Note the two
          views agree on the M-band localization and on the proteostatic role, so the pathograph downstream
          of this node is not in dispute.'
      selected_evidence:
        snippet: Recent studies present conflicting findings on ALPK3's kinase activity2,3.
        supports: SUPPORT
