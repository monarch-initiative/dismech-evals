        discussion_id: alpk3_knockout_fibrosis_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does the constitutive Alpk3 knockout mouse not develop the myocardial fibrosis that
          dominates the human phenotype?
        attaches_to:
        - pathophysiology#Reactive Interstitial Fibrosis
        rationale: Extensive myocardial fibrosis is a defining and prognostically important feature of
          human ALPK3 cardiomyopathy, reported both as late gadolinium enhancement on cardiac MRI and
          at histopathology. The constitutive Alpk3-null mouse reproduces the contractile and ultrastructural
          lesions but explicitly lacks interstitial fibrosis and inflammation. Until this divergence is
          explained, the mouse cannot be used to test antifibrotic or fibrosis-targeted interventions,
          and negative fibrosis results in that model should not be read back onto human disease.
      selected_evidence:
        snippet: Interstitial fibrosis and inflammation were notably absent in Alpk3 (-/-) mice
        supports: SUPPORT
