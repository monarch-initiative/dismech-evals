        relationship_type: CAUSATIVE
        case_fractions:
        - population: UK hypertrophic cardiomyopathy discovery cohort (770 probands)
          case_fraction_percent: 1.56
          notes: Heterozygous ALPK3 truncating variants, versus gnomAD (OR 16.11).
        - population: International hypertrophic cardiomyopathy validation cohort (2047 probands)
          case_fraction_percent: 1.56
          notes: Independent replication of the discovery-cohort fraction (OR 16.17).
        - population: Dutch cardiomyopathy patients referred for initial genetic analysis (1548 probands)
          case_fraction_percent: 2.5
          case_fraction_low: 1.8
          case_fraction_high: 3.4
          notes: Rare heterozygous ALPK3 variants of any class, not restricted to truncating.
        notes: On re-analysis of sarcomere-negative hypertrophic cardiomyopathy by exome or genome sequencing,
          ALPK3 protein-truncating variants ranked second or third among newly identified variants in
          five of seven pooled cohorts, behind cryptic-splice MYBPC3 and, in the French cohort, FLNC.
          Non-truncating ALPK3 variants make up a substantial share of the observed spectrum - 99 of 268
          cohort variants (37%), and at least one non-truncating allele in 13 of 42 curated biallelic
          patients - but were not significantly enriched over population controls, so their contribution
          is not modelled as a separate mechanism here.
      selected_evidence:
        snippet: ALPK3 | HGNC:17574 | hypertrophic cardiomyopathy | MONDO:0005045 | AD | Strong
        supports: SUPPORT
