        measure_type: UNKNOWN
        prevalence_class: UNKNOWN
        notes: Not a population prevalence. Reported only as the share of adult hypertrophic cardiomyopathy
          probands carrying an ALPK3 protein-truncating variant, pooled across seven cohorts totalling
          27,147 probands. The population-level occurrence of ALPK3-related cardiomyopathy has never been
          measured directly, and cannot be inferred from this fraction because penetrance is incomplete
          and age-related.
      selected_evidence:
