      assertion_type: Pathophysiology
      assertion:
        name: Loss of M-Band Scaffolding
        description: 'ALPK3 is an atypical alpha-kinase that sits at the sarcomeric M-band, where it organizes
          myomesins and the machinery that turns over sarcomere proteins, including MuRF E3 ubiquitin
          ligases and SQSTM1/p62. The node is deliberately scoped to the M-band. Two further claims are
          contested and are therefore not asserted here (see the discussion alpk3_pseudokinase_controversy):
          whether ALPK3 has catalytic activity at all, and whether it also occupies the nuclear envelope,
          which one group reports and another, using endogenously tagged protein, did not observe. The
          M-band localization and the proteostatic role are agreed on by both sides of that dispute.'
        biological_scale: MOLECULAR
        cellular_components:
        - preferred_term: sarcomere M-band
          term:
            id: GO:0031430
            label: M band
      selected_evidence:
        snippet: Phosphoproteomic evaluation of both ALPK3 kinase domain inhibition and overexpression
          failed to detect significant changes in catalytic activity, establishing ALPK3 as a pseudokinase.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
