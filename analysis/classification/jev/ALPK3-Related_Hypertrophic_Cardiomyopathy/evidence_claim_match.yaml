      assertion_type: Treatment
      assertion:
        name: Cascade Genetic Testing and Cardiac Surveillance of Variant Carriers
        description: Because heterozygous ALPK3 truncating variants have incomplete, age-related penetrance,
          relatives who carry one may be unaffected when first tested and develop hypertrophy later. Both
          the paediatric and adult literature therefore recommend identifying carriers and putting them
          under cardiac surveillance rather than discharging them.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: Adults with ALPK3 LoF variants therefore warrant evaluations for cardiomyopathy.
        supports: SUPPORT
