      assertion_type: Subtype
      assertion:
        name: Biallelic
        display_name: Biallelic (autosomal recessive, paediatric-onset) ALPK3 cardiomyopathy
        description: Two damaging ALPK3 alleles, most often two protein-truncating variants. Presents
          prenatally, neonatally, or in the first years of life, frequently as a dilated and hypocontractile
          ventricle that transitions to hypertrophy, and carries a high burden of death and transplantation.
          Extracardiac craniofacial and musculoskeletal features are common, and left ventricular outflow
          tract obstruction is characteristically absent.
      selected_evidence:
        snippet: All patients with biallelic mutations presented with severe hypertrophic and/or dilated
          cardiomyopathy in utero, at birth, or in early childhood.
        supports: SUPPORT
