        hypothesis_label: Canonical AL Amyloid Deposition Model
        status: CANONICAL
        description: A plasma-cell clone produces an amyloidogenic monoclonal light chain that misfolds,
          forms beta-sheet-rich oligomers and fibrils, deposits in the extracellular matrix of multiple
          organs, and causes organ-specific dysfunction.
      selected_evidence:
        snippet: Systemic immunoglobulin light chain amyloidosis is a protein misfolding disease caused
          by the conversion of immunoglobulin light chains from their soluble functional states into highly
          organized amyloid fibrillar aggregates that lead to organ dysfunction.
        supports: SUPPORT
