  0954d72da3a2d0d877b409de987109cd33cf32b4e1fb73489ebaf6c172c497fe:
    claim:
      about:
        disease:
          name: Systemic AL Amyloidosis
          disease_term:
            preferred_term: systemic AL amyloidosis
            term:
              id: MONDO:0017816
              label: primary systemic amyloidosis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Transthyretin Amyloidosis
        description: ATTR amyloidosis is the principal alternative precursor diagnosis when cardiac amyloid
          is suspected. AL uses an immunoglobulin light chain, whereas ATTR uses wild-type or variant
          transthyretin. Clinical and imaging features overlap, so a monoclonal-protein result alone cannot
          type the tissue deposit; precise biochemical typing is required when AL remains possible.
        distinguishing_features:
        - AL amyloid is composed of an immunoglobulin light chain; ATTR amyloid is composed of transthyretin.
        - A monoclonal-protein screen raises suspicion for AL but does not itself identify the protein
          in a tissue deposit.
        - Congo red establishes amyloid but not its type; mass spectrometry or another validated typing
          method identifies the precursor.
        - Cardiac involvement can occur in either disease, so demographic heuristics are not diagnostic
          substitutes.
      selected_evidence:
        snippet: The need for a high index of suspicion and the critical importance of precise biochemical
          typing of the amyloid deposits is paramount in light of recent therapeutic advances that can
          significantly improve prognosis.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
