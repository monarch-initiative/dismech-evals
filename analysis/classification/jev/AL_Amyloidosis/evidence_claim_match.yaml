      assertion:
        hypothesis_group_id: soluble_light_chain_cardiotoxicity
        hypothesis_label: Soluble Light-Chain Cardiotoxicity Model
        status: CANONICAL
        description: Soluble or prefibrillar amyloidogenic light chains exert direct cardiac proteotoxicity
          superimposed on structural injury from deposited fibrils, activating oxidative stress and non-canonical
          p38alpha MAPK signaling in cardiomyocytes and promoting contractile dysfunction and apoptosis.
      selected_evidence:
        snippet: In this study, we report that amyloidogenic light chain (AL-LC) proteins provoke oxidative
          stress, cellular dysfunction, and apoptosis in isolated adult cardiomyocytes through activation
          of p38 mitogen-activated protein kinase (MAPK).
        supports: SUPPORT
