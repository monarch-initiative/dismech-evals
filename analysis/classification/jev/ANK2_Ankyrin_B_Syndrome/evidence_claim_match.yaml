        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: variant_specific_ankyrin_b_cardiac_model
        hypothesis_label: Variant-Specific Ankyrin-B Cardiac Trafficking Model
        status: EMERGING
        description: Functionally damaging ANK2 variants may impair ankyrin-B-dependent membrane organization
          in working cardiomyocytes or sinoatrial-node cells. Ventricular calcium-handling defects and
          sinoatrial pacing failure are modeled as parallel branches. The cellular mechanisms are experimentally
          supported, but their penetrance and applicability to individual human variants require independent
          genetic evidence.
      selected_evidence:
        snippet: Thus, we identify a new mechanism for cardiac arrhythmia due to abnormal coordination
          of multiple functionally related ion channels and transporters.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
