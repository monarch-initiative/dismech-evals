      reference: PMID:12571597
      reference_title: Ankyrin-B mutation causes type 4 long-QT cardiac arrhythmia and sudden cardiac
        death.
      evidence_source: MODEL_ORGANISM
      explanation: The model-organism study supports the ankyrin-B trafficking mechanism, while not by
        itself establishing broad human variant validity.
