      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ank2_kv7_cortical_hyperexcitability_model
        hypothesis_label: ANK2-Kv7 Cortical Hyperexcitability Model
        status: EMERGING
        description: Developmental Ank2 loss in mouse cortical excitatory neurons reduces the abundance
          and function of AIS Kv7.2/KCNQ2 and Kv7.3/KCNQ3 channels, producing cortical hyperexcitability
          and seizure-related death. Kv7 activation and AMPA-receptor antagonism rescue model phenotypes,
          but this mechanism and its pharmacologic tractability have not been established in affected
          humans.
      selected_evidence:
        snippet: These changes accompanied decreases in the total level and function of the Kv7.2/KCNQ2
          and Kv7.3/KCNQ3 potassium channels and the density of these channels in the enlengthened axon
          initial segment.
        supports: SUPPORT
    origin:
