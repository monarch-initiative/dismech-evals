      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: general_ank2_haploinsufficiency_neuronal_model
        hypothesis_label: General ANK2 Haploinsufficiency Neuronal Model
        status: EMERGING
        description: Reduced ankyrin-B expression in human neurons produces parallel somatodendritic/AIS
          abnormalities and hyperactive, desynchronized network activity. Links from these cellular phenotypes
          to intellectual disability and epilepsy remain candidate disease mechanisms rather than established
          linear causal chains.
      selected_evidence:
        snippet: Our functional in vitro data of ANK2-deficient human neurons show a specific neuronal
          phenotype in which reduced ANKB expression leads to hyperactive and desynchronized neuronal
          network activity, increased somatodendritic complexity and AIS structure and impaired activity-dependent
          plasticity of the AIS.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
