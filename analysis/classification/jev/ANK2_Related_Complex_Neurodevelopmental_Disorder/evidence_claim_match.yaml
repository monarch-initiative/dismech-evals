        hypothesis_label: Giant Ankyrin-B Axon-Branching Model
        status: EMERGING
        description: The neurospecific giant ankyrin-B isoform normally couples axonal microtubules to
          L1CAM-containing membrane domains and restricts collateral branch formation. Disruption produces
          ectopic axon branching and connectivity in a mouse-derived neuronal model; relevance to human
          autistic behavior remains a candidate link.
      selected_evidence:
        snippet: Thus, gain of axon branching due to giant ankB-deficiency/mutation is a candidate cellular
          mechanism to explain aberrant structural connectivity and penetrant behavioral consequences
          in mice as well as humans bearing ASD-related ANK2 mutations.
        supports: SUPPORT
