        association: Causative heterozygous loss-of-function variants
        relationship_type: CAUSATIVE
        features: Heterozygous loss-of-function variants cause an autosomal dominant complex neurodevelopmental
          disorder. ClinGen curated seven de novo protein-truncating variants across eight probands and
          identifies loss of function as the predicted disease mechanism. De novo missense variants are
          also reported, including variants of uncertain significance; these are not generalized here
          as an established causative class. A separate familial giant-isoform frameshift report describes
          an epilepsy-only allelic presentation.
      selected_evidence:
        snippet: We collected clinical and molecular data of 12 individuals with heterozygous de novo
          LoF variants in ANK2.
        supports: SUPPORT
