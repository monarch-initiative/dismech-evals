          without a documented complex neurodevelopmental phenotype, and a separate familial missense
          report described high-functioning autism in a child and subthreshold autistic traits in her
          father.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: We collected clinical and molecular data of 12 individuals with heterozygous de novo
          LoF variants in ANK2.
        supports: SUPPORT
