        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dendritic_nav1_2_scaffolding_model
        hypothesis_label: Dendritic NaV1.2 Scaffolding Model
        status: EMERGING
        description: Ankyrin-B scaffolds NaV1.2 at the dendritic membrane of mouse neocortical pyramidal
          neurons. Ank2 haploinsufficiency reproduces dendritic excitability and synaptic deficits seen
          with Scn2a haploinsufficiency, suggesting a convergent dendritic mechanism for autism-related
          neurodevelopmental risk.
      selected_evidence:
        snippet: Here, we show that ankyrin-B is essential for scaffolding NaV1.2 to the dendritic membrane
          of mouse neocortical neurons and that haploinsufficiency of Ank2 phenocopies intrinsic dendritic
          excitability and synaptic deficits observed in Scn2a+/- conditions.
        supports: SUPPORT
    origin:
