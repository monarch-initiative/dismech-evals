        name: Eltrombopag
        description: The thrombopoietin receptor agonist eltrombopag raised the platelet count in seven
          of eight evaluable ANKRD26-RT patients in a phase II trial, mostly as minor responses, enough
          to avoid platelet transfusion before most surgery. Because carriers are predisposed to myeloid
          malignancy and ANKRD26-high cells are hypersensitive to eltrombopag in vitro, caution is advised,
          especially with long-term use.
        therapeutic_modality: SMALL_MOLECULE
