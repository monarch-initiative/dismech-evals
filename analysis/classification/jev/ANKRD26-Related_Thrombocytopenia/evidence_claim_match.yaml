      assertion_type: Discussion
      assertion:
        discussion_id: ankrd26_malignancy_risk_and_tpo_ra_safety
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Somatic Driver Mutation Acquisition and Myeloid Transformation
        - treatments#Eltrombopag
        prompt: What is the absolute lifetime risk of myeloid malignancy in ANKRD26 5' UTR variant carriers,
          which somatic events drive it, and does long-term thrombopoietin receptor agonist treatment
          raise it?
        rationale: Reported frequencies come from referral series of about 100 to 200 patients (about
          8% myeloid malignancy; an estimated 24-fold AML risk), and a pediatric series found no malignancy
          among eight carriers. ANKRD26 excess makes progenitors hypersensitive to thrombopoietin and
          to eltrombopag, which is the basis of the safety caution, but no longitudinal data on treated
          carriers exist. Baseline marrow blasts and dysplasia can also be raised without clonal evolution,
          which complicates surveillance endpoints.
      selected_evidence:
        snippet: HM also coexistent with RUNX1 (10/14) and ETV6 (1/2) variants but not ANKRD26 (0/8 patients),
          consistent with the reduced penetrance of ANKRD26 for HM
        supports: SUPPORT
