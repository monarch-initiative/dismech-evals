  e2160b2f3b1198ba56a79936774a03a9483dff9cc0a6a2a3e36d77ec6c64ee3f:
    claim:
      about:
        disease:
          name: ANKRD26-Related Thrombocytopenia
          disease_term:
            preferred_term: thrombocytopenia 2
            term:
              id: MONDO:0008555
              label: thrombocytopenia 2
        context: []
      assertion_type: Genetic
      assertion:
        name: ANKRD26
        gene_term:
          preferred_term: ANKRD26
          term:
            id: hgnc:29186
            label: ANKRD26
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Pathogenic variants are single nucleotide substitutions clustered in a highly conserved
          19 bp stretch of the 5' UTR covering the RUNX1 binding site and a short flanking region (for
          example c.-125T>G and c.-118C>T), and one variant (c.-107C>T) lies in the adjacent FLI1 binding
          site. The mechanism is gain of function (persistent expression), not haploinsufficiency. A complex
          structural variant producing a WAC-ANKRD26 fusion transcript caused a THC2-like phenotype in
          one family, and N-terminal truncating ANKRD26 variants found in apparently sporadic AML produce
          stable isoforms that activate MAPK/ERK signalling. The c.-140C>G 5' UTR variant, once reported
          as pathogenic, segregated with normal platelet counts in two later families and is regarded
          as likely benign.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_e86bee2b-8353-48c2-8ea3-a6b2b26cdb2f-2019-09-25T160000.000Z
        variants:
        - name: c.-125T>G
          description: 5' UTR single nucleotide substitution in the RUNX1-binding hotspot. In a series
            of 250 apparently sporadic adult AML patients, its carrier proved to have unrecognized THC2.
          variant_type: single nucleotide variant
          genomic_contexts:
          - 5' UTR
        - name: c.-118C>T
          description: 5' UTR substitution that segregated with thrombocytopenia in a three-generation
            family and raised platelet ANKRD26 expression.
          variant_type: single nucleotide variant
          genomic_contexts:
          - 5' UTR
        - name: c.-107C>T
          description: 5' UTR substitution in the FLI1 binding site, outside the previously reported RUNX1-site
            cluster, predicted to disrupt FLI1 binding.
          variant_type: single nucleotide variant
          genomic_contexts:
          - 5' UTR
          functional_effects:
          - function: silencing of ANKRD26 transcription during megakaryocyte maturation
            description: Loss of FLI1 binding increases ANKRD26 promoter activity in a reporter assay
              and sustains ANKRD26 expression in differentiating patient cells.
            regulatory_element_type: SILENCER
            affected_developmental_stage: late megakaryopoiesis
            regulatory_mechanism: Predicted loss of a hydrogen bond between FLI1 and its binding site
              in the ANKRD26 5' UTR.
        - name: c.-140C>G
          description: 5' UTR variant originally reported in thrombocytopenic patients; later family studies
            found it in relatives with normal platelet counts and normal ANKRD26 expression.
          variant_type: single nucleotide variant
          genomic_contexts:
          - 5' UTR
          clinical_significance: LIKELY_BENIGN
      selected_evidence:
        snippet: The mechanism of disease is proposed to be gain of function, not haploinsufficiency
        supports: SUPPORT
