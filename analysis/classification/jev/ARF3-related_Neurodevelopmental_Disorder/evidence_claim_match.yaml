        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated ARF3 GTP/GDP Cycling
        biological_scale: MOLECULAR
        description: 'ARF3 cycles between an inactive GDP-bound and an active, membrane-bound GTP-bound
          form under the control of ARF guanine nucleotide exchange factors and GTPase-activating proteins.
          The disease variants push this switch in one of two directions: some lower the GTP-bound fraction
          and destabilise the protein (dominant-negative behaviour), while others stabilise the GTP-bound
          conformation or increase effector binding (activating behaviour), as shown for increased GGA1
          adaptor binding by p.Arg99Leu.'
        molecular_functions:
        - preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          modifier: DYSREGULATED
        - preferred_term: GTP binding
          term:
            id: GO:0005525
            label: GTP binding
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Pull-down assays revealed that the p.Asp67Val had a loss-of-function effect and the p.Arg99Leu
          variant had increased binding of the adaptor protein, Golgi-localized, γ-adaptin ear-containing,
          ARF-binding protein 1 (GGA1), supporting the gain of function.
        supports: SUPPORT
