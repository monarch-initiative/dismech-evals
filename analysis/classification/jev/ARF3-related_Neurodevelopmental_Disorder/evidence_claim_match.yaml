        context:
        - path: /genetic/0
          value:
            name: ARF3
            gene_term:
              preferred_term: ARF3
              term:
                id: hgnc:654
                label: ARF3
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            notes: ARF3 (12q13.12) encodes ADP-ribosylation factor 3, a class I ARF small GTPase that
              shares 96% amino-acid identity with ARF1. All reported disease variants are de novo heterozygous
              missense changes. Variants reported to date include p.Leu12Val with p.Asp67Val in cis, p.Thr32Asn,
              p.Pro47Ser, p.Asp67Val, p.Asp93Asn, p.Arg99Leu and p.Lys127Glu (on NM_001659), with further
              variants in the 2026 follow-up series. Variant records below cover the alleles with a published
              per-allele clinical or functional description that can be quoted; p.Thr32Asn, p.Pro47Ser
              and the p.Leu12Val/p.Asp67Val haplotype are characterised in the pathophysiology node's
              genetic_context instead. ARF1, its closest paralog, causes a clinically similar disorder.
              A heterozygous ARF3 nonsense allele (p.Arg99*) inherited from a clinically unaffected parent
              has been reported as a secondary finding in a child with Bosch-Boonstra-Schaaf optic atrophy
              syndrome (PMID:42606787); a single carrier does not establish whether ARF3 haploinsufficiency
              is tolerated.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: p.Asp93Asn
        description: p.Asp93Asn. Reported de novo in a child with hypotonia, severe developmental delay,
          postnatal microcephaly, thin corpus callosum and milder skeletal defects. Stabilises the GTP-bound
          conformation (activating behaviour) and produces late-onset microcephaly in zebrafish.
      selected_evidence:
        snippet: Altogether, these data suggest a stabilized GTP-bound conformation and an overall hyperactive
          behavior for ARF3D93N and, to a minor extent, ARF3P47S, while a DN behavior could be established
          for the ARF3T32N variant.
        supports: SUPPORT
