  2f57f27c07b00556cc7d0ddbece2f3f0bf5796ece50506ebfa9a5efed90ac6e5:
    claim:
      about:
        disease:
          name: ARF3-related Neurodevelopmental Disorder
          disease_term:
            preferred_term: ARF3-related neurodevelopmental disorder
            term:
              id: MONDO:0700366
              label: ARF3-related neurodevelopmental disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: ARF3
        gene_term:
          preferred_term: ARF3
          term:
            id: hgnc:654
            label: ARF3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: ARF3 (12q13.12) encodes ADP-ribosylation factor 3, a class I ARF small GTPase that shares
          96% amino-acid identity with ARF1. All reported disease variants are de novo heterozygous missense
          changes. Variants reported to date include p.Leu12Val with p.Asp67Val in cis, p.Thr32Asn, p.Pro47Ser,
          p.Asp67Val, p.Asp93Asn, p.Arg99Leu and p.Lys127Glu (on NM_001659), with further variants in
          the 2026 follow-up series. Variant records below cover the alleles with a published per-allele
          clinical or functional description that can be quoted; p.Thr32Asn, p.Pro47Ser and the p.Leu12Val/p.Asp67Val
          haplotype are characterised in the pathophysiology node's genetic_context instead. ARF1, its
          closest paralog, causes a clinically similar disorder. A heterozygous ARF3 nonsense allele (p.Arg99*)
          inherited from a clinically unaffected parent has been reported as a secondary finding in a
          child with Bosch-Boonstra-Schaaf optic atrophy syndrome (PMID:42606787); a single carrier does
          not establish whether ARF3 haploinsufficiency is tolerated.
        variants:
        - name: p.Asp67Val
          description: NM_001659.2:c.200A>T, p.Asp67Val. Reported de novo in a child with severe microcephaly,
            diffuse brain atrophy and epilepsy, again in a patient with acquired microcephaly, drug-resistant
            epilepsy and a Z-shaped brainstem, and in cis with p.Leu12Val in a further severely affected
            child. Shows a dispersed cytosolic and Golgi pattern like the dominant-negative p.Thr31Asn
            mutant, is lethal when expressed in flies, and has reduced GTP-bound levels.
          clinical_significance: PATHOGENIC
        - name: p.Arg99Leu
          description: NM_001659:c.296G>T, p.Arg99Leu. Reported de novo in a child with developmental
            delay, epilepsy and cerebellar hypoplasia. Localises normally to the Golgi but binds GGA1
            more strongly and produces a rough eye in flies like the activating p.Gln71Leu mutant, consistent
            with gain of function.
        - name: p.Lys127Glu
          description: NM_001659.2:c.379A>G, p.Lys127Glu, in the NKXD guanine-nucleotide binding motif.
            Reported de novo in a girl with the most severe phenotype (growth restriction, severe microcephaly,
            progressive cortical atrophy, pontine hypoplasia, seizures, profound developmental delay,
            eleven rib pairs, severe scoliosis, inguinal hernia and congenital heart defects). The corresponding
            Lys127Glu substitution has been reported in ARF1 in a patient with a similar disorder.
        - name: p.Asp93Asn
          description: p.Asp93Asn. Reported de novo in a child with hypotonia, severe developmental delay,
            postnatal microcephaly, thin corpus callosum and milder skeletal defects. Stabilises the GTP-bound
            conformation (activating behaviour) and produces late-onset microcephaly in zebrafish.
      selected_evidence:
        snippet: We report that de novo missense variants in ARF3, encoding a small GTPase regulating
          Golgi dynamics, cause a developmental disease in humans impairing nervous system and skeletal
          formation.
        supports: SUPPORT
