        discussion_id: arhgdia_mechanism_wording
        kind: INTERPRETATION
        prompt: Is ARHGDIA disease loss of function or gain of function?
        attaches_to:
        - pathophysiology#Biallelic ARHGDIA Loss of Function
        rationale: ClinGen's evidence summary states the mechanism of pathogenicity as gain of function.
          The primary studies it cites show loss of RhoGDIalpha function (recessive, including a nonsense
          allele, with loss of GTPase binding) whose consequence is gain of RAC1 activity. The entry records
          loss of function on the variant and increased activity on the RAC1 node, which is what the functional
          data show; the ClinGen wording is best read as describing the downstream GTPase state.
