      assertion_type: Discussion
      assertion:
        discussion_id: arhgdia_motility_direction
        kind: CONTROVERSY
        prompt: Does RhoGDIalpha loss make podocytes more migratory or less?
        attaches_to:
        - pathophysiology#Podocyte Actin Cytoskeleton and Motility Derangement
        rationale: 'The Gee group found enhanced migration of human podocytes after ARHGDIA knockdown
          or mutant overexpression, reversible with RAC1 inhibitors. The Gupta and Auguste studies found
          impaired motility in mouse podocytes and in patient fibroblasts. Auguste et al. attribute the
          difference to design: Gee overexpressed mutants on a background of endogenous wild-type RhoGDIalpha,
          whereas they knocked down the endogenous protein and re-expressed the mutant. Both groups agree
          that RAC1 is hyperactivated and that podocyte motility is abnormal; the entry therefore records
          the process as dysregulated rather than increased or decreased.'
      selected_evidence:
        snippet: These differences may be explained by the WT GDIα present in the human podocytes used
          by Gee et al. since they overexpressed the mutants without knocking down the endogenous GDIα
        supports: SUPPORT
