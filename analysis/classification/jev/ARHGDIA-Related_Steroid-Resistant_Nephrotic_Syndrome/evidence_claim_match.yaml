            label: actin cytoskeleton organization
        - preferred_term: podocyte cell migration
          modifier: DYSREGULATED
          term:
            id: GO:0090521
            label: podocyte cell migration
      selected_evidence:
        snippet: All three mutant GDIα proteins resulted in slow podocyte motility, suggesting that podocytes
          are sensitive to the relative balance of Rho-GTPase activity.
        supports: SUPPORT
