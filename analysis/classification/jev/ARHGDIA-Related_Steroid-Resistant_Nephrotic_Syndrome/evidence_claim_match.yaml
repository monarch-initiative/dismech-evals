        description: 'Loss of RhoGDIalpha disturbs podocyte actin and motility, but the direction of the
          motility change depends on the experimental system: overexpression of mutant alleles over endogenous
          wild-type protein, or siRNA knockdown, enhanced migration of human podocytes, whereas replacing
          endogenous RhoGDIalpha with the mutant forms slowed mouse podocytes, reduced actin polymerization
          and cell size, and increased cellular projections. The studies agree that podocytes are sensitive
          to the balance of Rho-GTPase activity.'
        cell_types:
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
