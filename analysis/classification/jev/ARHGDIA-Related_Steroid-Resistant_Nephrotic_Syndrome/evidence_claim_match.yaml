  244ef1f362cf374b8b074e98c9bc9c53a283b367422a7bbe1e8697b33dcc65a7:
    claim:
      about:
        disease:
          name: ARHGDIA-Related Steroid-Resistant Nephrotic Syndrome
          disease_term:
            preferred_term: nephrotic syndrome, type 8
            term:
              id: MONDO:0014099
              label: nephrotic syndrome, type 8
        context: []
      assertion_type: Genetic
      assertion:
        name: ARHGDIA
        gene_term:
          preferred_term: ARHGDIA
          term:
            id: hgnc:678
            label: ARHGDIA
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: c.553_555del (p.Asp185del)
          description: In-frame deletion of one of three consecutive aspartate residues (183-185) at the
            GTPase-binding interface; homozygous in two Pakistani sisters with congenital nephrotic syndrome.
            The deleted residue cannot be assigned, so the variant is named for position 185.
        - name: c.518G>T (p.Gly173Val)
          description: Missense, homozygous in two Ashkenazi Jewish siblings; associated with the later
            onset. Retains partial GTPase binding in one study but still fails to restrain RAC1.
        - name: c.358C>T (p.Arg120Ter)
          description: Nonsense, homozygous in an infant with congenital nephrotic syndrome.
        - name: p.Gly168Arg
          description: Homozygous missense in exon 6, reported as likely pathogenic by clinical exome
            sequencing in an 11-month-old South Indian girl; not functionally tested.
        - name: c.275-1G>A
          description: Canonical splice-acceptor variant, homozygous and classified likely pathogenic,
            in a child with congenital onset from an Iranian SRNS cohort; not functionally tested.
        notes: All reported affected individuals are homozygous, from consanguineous families of Pakistani,
          Ashkenazi Jewish, Iranian and South Indian origin. The founding screen found one further ARHGDIA
          family after examining 65 individuals with diffuse mesangial sclerosis and 350 with SRNS, and
          the Iranian cohort found one in 30 consanguineous families; no population frequency is available.
          ClinGen's evidence summary states the mechanism of pathogenicity as gain of function, while
          the functional studies describe loss of RhoGDIalpha function with consequent gain of RAC1 activity;
          see the arhgdia_mechanism_wording discussion.
      selected_evidence:
        snippet: Congenital cases are often caused by disease-causing variants in NPHS1 and we identified
          such variants in two cases as well as disease-causing variants in SGPL1 or ARHGDIA in one case,
          respectively.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
