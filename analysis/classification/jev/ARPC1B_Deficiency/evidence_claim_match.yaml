        context: []
      assertion_type: Genetic
      assertion:
        name: ARPC1B
        gene_term:
          preferred_term: ARPC1B
          term:
            id: hgnc:704
            label: ARPC1B
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal recessive
        notes: 'Variants are scattered through the gene and span four consequence classes: frameshift
          (p.Val91Trpfs*30), missense affecting the WD40 repeats (p.Ala105Val, p.Ala238Thr), splice site
          (the Nepalese founder allele c.64+2T>A), and - importantly for how the gene is tested - two
          lesions that a coding-consequence filter would not flag at all: the synonymous c.783G>A (p.Ala261Ala),
          which disrupts splicing, and the intronic c.64+4_64+24del.

          The founder allele c.64+2T>A is associated with a more severe phenotype and worse long-term
          outcome than other variants. Expressivity is otherwise wide even within a family: the three
          siblings homozygous for c.783G>A were reported for the significant intrafamilial clinical heterogeneity
          of their presentation, and that same genotype produces the syndrome without thrombocytopenia.'
      selected_evidence:
        snippet: Comparative phenotypic analysis showed significantly greater proportions of otitis, gastroenteritis,
          inflammatory bowel disease-like manifestations, and elevated IgA in patients with c.64+2T>A
          variant as compared to other variants.
        supports: SUPPORT
