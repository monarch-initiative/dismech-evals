  a9403883a314043967645b81fc9cf4a62afb8d73e739b58d181269d164c7b7c8:
    claim:
      about:
        disease:
          name: ARPC1B Deficiency
          disease_term:
            preferred_term: ARPC1B deficiency
            term:
              id: MONDO:0060583
              label: platelet abnormalities with eosinophilia and immune-mediated inflammatory disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_growth_failure_not_corrected_by_transplant
        kind: INTERPRETATION
        status: OPEN
        prompt: Why does haematopoietic stem cell transplantation resolve the autoinflammatory disease
          of ARPC1B deficiency but not its growth failure?
        attaches_to:
        - pathophysiology#Combined Immunodeficiency with Allergic and Autoinflammatory Disease
        rationale: 'Growth failure is universal in the largest cohort, growth hormone testing was impaired
          where it was performed, and there was no catch-up growth after transplantation in the three
          patients where it could be assessed. Transplantation otherwise works: it resolves the autoinflammatory
          features and leaves patients off medication.

          The dissociation is informative about where the disease acts. If growth failure were secondary
          to chronic inflammation and recurrent infection, correcting those should permit catch-up. It
          did not. Two readings remain, and the cited literature does not choose between them: either
          the growth deficit is established irreversibly before transplant, or it has a non-haematopoietic
          component - which would be surprising for a gene whose expression is described as predominantly
          haematopoietic, and would be the more interesting answer.

          The partial growth hormone deficiency is the concrete lead. It was found in two patients and
          points at the pituitary, which is not a haematopoietic tissue and would not be replaced by a
          transplant.'
      selected_evidence:
        snippet: Growth failure was noted in all patients (Table E2), with growth hormone tests found
          to be impaired when performed (P2 and P3), compatible with a partial growth hormone deficiency,
          and no catch-up growth after hematopoietic stem cell transplantation (HSCT) (P2, P3, and P6).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
