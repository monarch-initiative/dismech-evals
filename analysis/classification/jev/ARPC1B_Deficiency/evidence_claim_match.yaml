      assertion:
        name: Biallelic ARPC1B Loss-of-Function Variant
        role: trigger
        biological_scale: MOLECULAR
        description: 'Variants are diverse and scattered across the gene - frameshift, missense affecting
          the WD40 repeats, and splice-site - and in every patient tested the ARPC1B protein is undetectable
          on immunoblot. A splice-site founder variant, c.64+2T>A, accounts for a Nepalese cluster and
          is associated with a more severe course than other alleles.

          The WD40 repeats matter structurally: six of them form the beta-propeller through which ARPC1B
          contacts the mother actin filament, so a truncation removing five of the six removes the interaction
          surface rather than merely shortening the protein.'
        molecular_functions:
        - preferred_term: ARPC1B within the Arp2/3 complex
          term:
            id: GO:0071933
            label: Arp2/3 complex binding
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
