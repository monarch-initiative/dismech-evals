        role: effector
        biological_scale: CELLULAR
        description: 'The newest and least-explored arm. Arp2/3 has a nuclear role: it promotes chromatin
          dynamics and drives clustering of DNA double-strand breaks for homology-directed repair. ARPC1B-deficient
          patient cells are radiosensitive by three independent methods, with more chromatid-type aberrations,
          more gamma-H2AX foci and more cells arrested in G2/M after ionising radiation or bleomycin.

          This arm is curated separately rather than folded into the immune one because it is mechanistically
          distinct - it is nuclear, not cytoskeletal-motility - and because its clinical consequences
          are unknown. It was proposed as a disease trait in 2022 and has not been shown to cause any
          of the disease''s manifestations.'
