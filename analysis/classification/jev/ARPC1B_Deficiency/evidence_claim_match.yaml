              id: MONDO:0060583
              label: platelet abnormalities with eosinophilia and immune-mediated inflammatory disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_radiosensitivity_clinical_significance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the cellular radiosensitivity of ARPC1B-deficient cells have clinical consequences
          - for conditioning regimens before transplantation, for diagnostic imaging, or for malignancy
          risk?
        attaches_to:
        - pathophysiology#Impaired Arp2/3-Dependent Double-Strand Break Clustering
        rationale: 'Radiosensitivity was proposed as a disease trait in 2022 on the basis of three assays
          in a small number of patients. Nothing links it to any clinical event. That matters specifically
          because transplantation is the only curative treatment for this disease and conditioning regimens
          are chosen partly on DNA-repair status - a radiosensitive patient conditioned as though they
          were not is a real hazard, and the authors say as much when they call for this to be investigated
          to optimise therapeutic interventions.

          The gap is that nobody has looked at outcomes. The transplanted patients reported in the literature
          were not, so far as the cited sources record, stratified by radiosensitivity, and none of the
          sources read for this entry reports a malignancy outcome in an ARPC1B-deficient patient - the
          malignancy discussion in the founding paper is about Wiskott-Aldrich syndrome and about ARPC1
          isoforms in sporadic tumours, not about these patients.'
        proposed_experiments:
        - experiment_id: arpc1b_conditioning_outcome_by_radiosensitivity
          name: Transplant conditioning toxicity stratified by measured radiosensitivity
          description: Retrospectively assay radiosensitivity in stored cells from transplanted ARPC1B
            patients and relate it to regimen-related toxicity, engraftment and late effects, to establish
            whether reduced-intensity conditioning should be the default.
      selected_evidence:
        snippet: Overall, our data suggest increased radiosensitivity as an additional trait in ARPC1B
          deficiency and support the necessity to investigate this feature in ARPC1B patients as well
          as in other IEI with cytoskeleton defects to address specific clinical follow-up and optimize
          therapeutic interventions.
        supports: SUPPORT
