        rationale: 'Three sources, two answers. The founding report describes microthrombocytopenia in
          its index child and states that patient platelets are microthrombocytes similar to those seen
          in Wiskott-Aldrich syndrome - that resemblance is part of why ARPC1B was pursued as a WAS-like
          candidate gene at all. The 14-patient cohort reports reduced platelet counts with normal volume
          in most cases. The IUIS 2022 classification table records mild thrombocytopenia with normal-sized
          platelets, siding with the cohort.

          This is not a detail. Platelet size is the classical bedside discriminator between Wiskott-Aldrich
          syndrome and its mimics, and it is one of the three separators this entry''s differential-diagnosis
          section relies on. If normal-sized platelets do not exclude ARPC1B deficiency, then a WAS-like
          child with normal platelet volume still needs the gene tested.

          An allelic reconciliation is the obvious first guess - the founding cases include a complete-null
          frameshift and a near-null missense pair, while the cohort spans variants scattered across the
          gene - and the founding paper''s own discussion argues against it. Microthrombocytes were seen
          in all three of its patients, spanning both allele classes, while platelet *counts* varied between
          them: always low in the frameshift patient, low to normal in one missense sibling and normal
          in the other. So in that series genotype tracked count and not size, which is the opposite of
          what the allelic hypothesis needs.

          That leaves measurement as the more likely explanation - platelet sizing is method-dependent,
          and small platelets are easy to lose at the lower gate of an automated analyser - but no cited
          source compares methods, so this stays a controversy rather than a resolution.

          One later report widens the question from size to presence. Three siblings homozygous for the
          synonymous c.783G>A allele have the syndrome with **no thrombocytopenia at all**. That does
          not settle the size disagreement, but it does mean the platelet phenotype in ARPC1B deficiency
          is not a fixed feature to be characterised so much as a variable one to be stratified - and
          it is a further reason not to use platelet findings to include or exclude the diagnosis.'
        proposed_experiments:
        - experiment_id: arpc1b_mpv_by_genotype_and_method
          name: Platelet volume by ARPC1B genotype and by measurement method
          description: Pool published and unpublished ARPC1B cases and measure platelet size both by automated
            analyser and by microscopy on the same samples, alongside Wiskott-Aldrich and healthy controls,
            stratifying by complete-null versus hypomorphic genotype. The method arm is the important
            one, since the founding series found microthrombocytes across both allele classes and so does
            not support a purely genotypic explanation.
      selected_evidence:
        snippet: Mild thrombocytopenia with normal sized platelets, recurrent invasive
        supports: REFUTE
