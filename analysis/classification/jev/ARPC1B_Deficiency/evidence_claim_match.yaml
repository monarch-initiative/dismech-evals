      assertion_type: Treatment
      assertion:
        name: Sirolimus for Thrombocytopenia
        description: 'An mTOR inhibitor, reported to control refractory relapsing thrombocytopenia in
          a patient with an isolated-cytopenia phenotype, along with the lymphoproliferation and autoantibodies.

          The mechanistic finding is the interesting part and it constrains the indication. Actin polymerisation
          assays before and after treatment showed no significant difference, so sirolimus is not correcting
          the Arp2/3 defect - the authors read the benefit as immunomodulatory, reducing autoimmunity.
          That is also offered as the explanation for why sirolimus failed in previously reported patients
          with broader immune dysregulation. So this is a treatment for the autoimmune component in a
          mild phenotype, not a treatment for ARPC1B deficiency, and an entry that recorded it without
          the assay result would imply the latter.'
        therapeutic_modality: SMALL_MOLECULE
