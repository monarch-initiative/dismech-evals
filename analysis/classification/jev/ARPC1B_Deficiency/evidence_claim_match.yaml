  b27c320cb9f9585cddf8f0c6876863d175f8da96e77eecae2d192682b07c0cb1:
    claim:
      about:
        disease:
          name: ARPC1B Deficiency
          disease_term:
            preferred_term: ARPC1B deficiency
            term:
              id: MONDO:0060583
              label: platelet abnormalities with eosinophilia and immune-mediated inflammatory disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Arp2/3 Complex Destabilisation Not Rescued by ARPC1A
        role: central_effector
        biological_scale: MOLECULAR
        description: 'The rate-limiting node, and the one that makes this disease mechanistically interesting.
          ARPC1B-null platelets contain no ARPC1B and greatly reduced Arp2/3 complex, while the other
          five components are present at normal levels. So the complex is not merely missing a part; without
          this particular subunit it does not assemble.

          ARPC1A is the obvious candidate substitute - same slot, 68% identity - and it is actively upregulated
          in ARPC1B-deficient cells. It does not rescue. Some ARPC1A does appear in the residual Arp2/3
          of null platelets, where none is detectable in normal platelets, so the substitution physically
          happens and is simply not sufficient. The authors'' conclusion, that the ARPC1 isoforms are
          not functionally interchangeable, is the human genetic evidence for a proposition that had only
          been argued experimentally.'
        protein_complexes:
        - preferred_term: Arp2/3 protein complex
          term:
            id: GO:0005885
            label: Arp2/3 protein complex
          modifier: DECREASED
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
      selected_evidence:
        snippet: Platelet lysates reveal no ARPC1B protein and greatly reduced Arp2/3 complex.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
