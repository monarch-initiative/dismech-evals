    claim:
      about:
        disease:
          name: ARPC1B Deficiency
          disease_term:
            preferred_term: ARPC1B deficiency
            term:
              id: MONDO:0060583
              label: platelet abnormalities with eosinophilia and immune-mediated inflammatory disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Branched Actin Nucleation
        role: central_effector
        biological_scale: CELLULAR
        description: 'Arp2/3 nucleates a daughter filament off the side of an existing one, which is how
          cells build the branched networks that drive lamellipodia, phagocytosis, endocytosis, vesicular
          trafficking and immune-synapse formation. Losing it does not abolish actin polymerisation -
          patient platelets still spread, and still make prominent filopodia, which are unbranched bundles
          - it removes the branched arm specifically, leaving lamellipodia limited.

          That morphological signature, filopodia preserved and lamellipodia lost, is the cellular fingerprint
          of the defect and is what connects the platelet, immune and DNA-repair arms below to one molecular
          lesion.'
        biological_processes:
        - preferred_term: Arp2/3 complex-mediated actin nucleation
          term:
            id: GO:0034314
            label: Arp2/3 complex-mediated actin nucleation
          modifier: DECREASED
      selected_evidence:
        snippet: Human actin-related protein 2/3 complex (Arp2/3), required for actin filament branching,
          has two ARPC1 component isoforms, with ARPC1B prominently expressed in blood cells.
        supports: SUPPORT
