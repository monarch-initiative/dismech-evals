        biological_scale: CELLULAR
        description: 'The immune arm has been resolved to specific cell types. Regulatory T cells expanded
          from patients show decreased FOXP3, Helios, CD25 and CTLA-4 and defective suppressor activity
          against both CD4 and CD8 responders - a cell-intrinsic Treg defect, which is the most economical
          explanation for exaggerated Th2 responses, IgE reactivity and autoimmunity in one disease. NK
          cells show impaired degranulation against K562 targets, and, as in Wiskott-Aldrich syndrome,
          IL-2 restores it, which places the defect in signalling-dependent cytoskeletal remodelling rather
          than in the killing machinery.

          Conventional T cells are reduced in number with a skewed naive compartment, but their proliferative
          responses are largely normal - so this is not a proliferation defect.'
