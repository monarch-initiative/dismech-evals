  c8cdc18f16075bbe1cea3ea9a53d02200e1ccaa8c39da4029ea9511364f66864:
    claim:
      about:
        disease:
          name: ARPC1B Deficiency
          disease_term:
            preferred_term: ARPC1B deficiency
            term:
              id: MONDO:0060583
              label: platelet abnormalities with eosinophilia and immune-mediated inflammatory disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Arp2/3-Dependent Double-Strand Break Clustering
        role: effector
        biological_scale: CELLULAR
        description: 'The newest and least-explored arm. Arp2/3 has a nuclear role: it promotes chromatin
          dynamics and drives clustering of DNA double-strand breaks for homology-directed repair. ARPC1B-deficient
          patient cells are radiosensitive by three independent methods, with more chromatid-type aberrations,
          more gamma-H2AX foci and more cells arrested in G2/M after ionising radiation or bleomycin.

          This arm is curated separately rather than folded into the immune one because it is mechanistically
          distinct - it is nuclear, not cytoskeletal-motility - and because its clinical consequences
          are unknown. It was proposed as a disease trait in 2022 and has not been shown to cause any
          of the disease''s manifestations.'
        biological_processes:
        - preferred_term: double-strand break repair via homologous recombination
          term:
            id: GO:0000724
            label: double-strand break repair via homologous recombination
          modifier: DECREASED
      selected_evidence:
        snippet: In particular, higher levels of chromatid-type aberrations and γH2AX foci, with an increased
