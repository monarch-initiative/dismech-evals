  398038b9636a31383f5a48fb09fe21a9e8b3eab7fa76d336e62ba536739181e0:
    claim:
      about:
        disease:
          name: ARPC1B Deficiency
          disease_term:
            preferred_term: ARPC1B deficiency
            term:
              id: MONDO:0060583
              label: platelet abnormalities with eosinophilia and immune-mediated inflammatory disease
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of Ionising Radiation and Radiomimetics
        description: 'A precaution rather than a therapy, and the actionable half of the radiosensitivity
          finding. Patient cells show increased chromatid aberrations, gamma-H2AX foci and G2/M arrest
          after ionising radiation *and* after bleomycin, so the exposure to avoid is not only radiotherapy.

          Two contexts make this concrete: transplantation is the only curative option and conditioning
          intensity is chosen partly on DNA-repair status, and bleomycin is a conventional chemotherapy
          agent. The clinical consequences are unestablished - that remains an open knowledge gap - but
          the authors themselves call for the trait to be investigated in order to optimise therapeutic
          interventions, and a precaution costs nothing while the question is open.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: In particular, higher levels of chromatid-type aberrations and γH2AX foci, with an increased
          number of cells arrested in the G2/M-phase of the cell cycle, were found in patients' cells
          after ionizing radiation exposition and radiomimetic bleomycin treatment.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/6
      evidence_path: /treatments/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35967303
      reference_title: 'Radiosensitivity in patients affected by ARPC1B deficiency: a new disease trait?'
      evidence_source: HUMAN_CLINICAL
      explanation: Both exposures produce the damage, which is why the precaution covers radiomimetics
        and not only radiotherapy.
