        context: []
      assertion_type: Diagnosis
      assertion:
        name: Differentiation from Wiskott-Aldrich Syndrome
        description: 'The two diseases sit in the same IUIS sub-table and look alike: thrombocytopenia,
          eczema, recurrent infection, bloody diarrhoea, vasculitis. Three findings separate them. WASP
          is present at normal levels in ARPC1B-deficient platelets, so a normal WASP does not exclude
          the phenotype. The humoral response to polysaccharide vaccine is normal in ARPC1B deficiency
          and impaired in Wiskott-Aldrich. And IUIS records ARPC1B deficiency as mild thrombocytopenia
          with normal-sized platelets against Wiskott-Aldrich''s small ones - though see the controversy
          below, because the founding ARPC1B report says the opposite.'
      selected_evidence:
        snippet: In contrast to Wiskott-Aldrich Syndrome or DOCK8 deficiency,5 the humoral response to
          polysaccharide vaccine was normal in most cases
        supports: SUPPORT
