      assertion:
        name: Sequencing Strategy and RNA Confirmation for Non-Coding Variants
        description: Next-generation sequencing - exome, or a targeted inborn-errors-of-immunity panel
          - is the entry point. The important qualifier is that two of the disease's reported alleles
          are a synonymous change and an intronic deletion, neither of which a coding-consequence filter
          would flag. Targeted RNA studies are what establish that such a variant disrupts splicing, and
          without that step the diagnosis is missed rather than excluded.
      selected_evidence:
        snippet: The next generation sequencing (NGS) studies facilitated the diagnosis of this rare combined
          immunodeficiency and led to the decision to treat the affected patients with hematopoietic cell
          transplant (HCT) from an human leukocyte antigen (HLA)-matched healthy sibling.
        supports: SUPPORT
