        prompt: Which ARX-dependent process produces the defining human XLAG gyral malformation, given
          that the constitutive and conditional mouse models robustly reproduce interneuron, basal-ganglia,
          projection, and testicular defects but cannot phenocopy loss of gyral architecture in a naturally
          lissencephalic species?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#ARX Functional Deficiency
        - pathophysiology#Tangential Migration Failure from Ganglionic Eminences
        - pathophysiology#Candidate Neocortical SVZ Radial-Migration Disruption
        rationale: Mouse models validate the conserved subpallial interneuronopathy and several ARX-specific
          developmental branches. They do not establish that tangential interneuron migration failure
          is sufficient for human lissencephaly. Human XLAG neuropathology suggests an additional radial-migration
          contribution from the neocortical subventricular zone, while general human lissencephaly work
          shows that outer radial glia important for neocortical expansion are largely absent from lissencephalic
          rodents. The canonical graph therefore does not connect tangential migration directly to lissencephaly;
          an explicitly alternative, human-enriched dorsal cortical route carries that endpoint.
        proposed_experiments:
        - experiment_id: exp_arx_human_cortical_assembloid
          name: Isogenic ARX-null Human MGE-Cortex Assembloid Migration and Lamination Assay
          description: Generate isogenic ARX-null, corrected, and wild-type human iPSC-derived MGE and
            dorsal-cortical organoids, fuse them into assembloids, and quantify interneuron specification,
            tangential migration, dorsal progenitor proliferation, radial migration, and cortical lamination.
            Timed ARX rescue should distinguish lineage-specification, migration, and post-migration requirements.
          experiment_type:
            preferred_term: iPSC assembloid perturbation assay
          model_systems:
          - name: Isogenic human MGE-cortex assembloid
            description: Fused subpallial and cortical organoids generated from matched ARX-null, corrected,
              and wild-type human iPSC lines.
            experimental_model_type: ORGANOID
          decision_criterion: A reproducible dorsal progenitor, radial-migration, or lamination defect
            in ARX-null cortical tissue that is rescued by gene correction would support a human dorsal
            route beyond the conserved tangential-interneuron phenotype.
          supporting_outcome:
          - Dorsal cortical defects occur in ARX-null tissue independently of the genotype of incoming
            interneurons.
          - Gene correction or appropriately timed ARX restoration rescues the dorsal cortical readout.
          refuting_outcome:
          - ARX-null dorsal tissue shows normal progenitor dynamics and lamination while only interneuron
            entry is altered.
        - experiment_id: exp_arx_gyrencephalic_ferret
          name: ARX Perturbation in a Gyrencephalic Ferret Cortex
          description: Perturb Arx in developing ferret dorsal and subpallial compartments using spatially
            restricted strategies, then assess gyral architecture, progenitor dynamics, cortical lamination,
            interneuron migration, and basal-ganglia development against matched sham and rescue controls.
          experiment_type:
            preferred_term: in vivo gyrencephalic model study
          model_systems:
          - name: Gyrencephalic ferret cortex
            description: Developing ferret cortex with a prominent outer subventricular zone, used as
              a bridge between naturally lissencephalic mice and humans.
            experimental_model_type: OTHER
          decision_criterion: Gyral simplification or regional agyria that tracks dorsal Arx perturbation
            and is rescued by ARX restoration would support a gyrencephaly-dependent cortical branch.
          supporting_outcome:
          - Dorsal Arx perturbation produces reproducible gyral and lamination abnormalities.
          - Subpallial-only perturbation reproduces interneuron loss without the full gyral phenotype.
          refuting_outcome:
          - Neither dorsal nor subpallial perturbation affects gyral architecture despite robust molecular
            target engagement.
      selected_evidence:
        snippet: However, the mouse brain is naturally lissencephalic, suggesting that certain aspects
          of cortical development may not be adequately assessed in mice.
        supports: SUPPORT
