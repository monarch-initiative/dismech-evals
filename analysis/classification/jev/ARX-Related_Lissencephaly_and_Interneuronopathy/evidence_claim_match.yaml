            term:
              id: MONDO:0010268
              label: X-linked lissencephaly with abnormal genitalia
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other ARX Allelic Disorders
        description: Proud syndrome, polyalanine-expansion ARX developmental epilepsy/infantile spasms,
          Partington syndrome, and nonsyndromic intellectual disability share the causal gene but are
          distinct from classic XLAG.
        distinguishing_features:
        - Infantile spasms without the XLAG malformation pattern favor a polyalanine-expansion ARX disorder.
        - Classic XLAG has fetal/neonatal clonic or myoclonic seizures and was reported without infantile
          spasms or hypsarrhythmia.
        - Variant class and the presence or absence of structural brain and genital abnormalities separate
          the allelic diagnoses.
      selected_evidence:
        snippet: In addition, several less severe phenotypes without malformations have been reported,
          including mental retardation with cryptogenic infantile spasms (West syndrome), other seizure
          types, dystonia or autism, and nonsyndromic mental retardation.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/4
      evidence_path: /differential_diagnoses/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:14722918
      reference_title: Mutations of ARX are associated with striking pleiotropy and consistent genotype-phenotype
        correlation.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the non-malformative allelic spectrum that must not be merged into XLAG
        phenotypes.
