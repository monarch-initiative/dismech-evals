      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: human_xlag_lissencephaly_route
        hypothesis_label: Candidate Human-Specific Radial-Migration Route
        status: ALTERNATIVE
        description: The defining gyral malformation may require an additional ARX-dependent radial-migration
          process in the neocortical subventricular zone rather than following solely from tangential
          interneuron migration failure. Human XLAG neuropathology only suggests such a role; an ARX defect
          in dorsal excitatory progenitors, outer radial glia, or cortical lamination remains untested.
          General non-ARX lissencephaly organoid work motivates the species limitation but does not establish
          this mechanism in XLAG.
      selected_evidence:
        snippet: Our findings suggest that ARX protein controls not only the tangential migration of GABAergic
          interneurons from the ganglionic eminence, but also may serve to induce radial migration from
          the neocortical subventricular zone.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
