      assertion_type: DifferentialDiagnosis
      assertion:
        name: PAFAH1B1- or DCX-Related Classical Lissencephaly
        description: PAFAH1B1 and DCX disorders can produce agyria-pachygyria and severe epilepsy, but
          their gradient, cortical thickness, associated malformations, and molecular cause differ from
          XLAG.
        distinguishing_features:
        - Temporal-predominant thin lissencephaly with complete callosal agenesis and hypoplastic basal
          ganglia favors ARX.
        - Classic thick posterior-predominant lissencephaly favors PAFAH1B1; anterior-predominant thick
          lissencephaly in males favors DCX.
        - Abnormal male genitalia strongly favors XLAG.
      selected_evidence:
        snippet: Mutations of DCX and actin isoforms (ACTB, ACTG1) account for almost all anterior predominant
          LIS with thick cortex (classic LIS).
        supports: SUPPORT
