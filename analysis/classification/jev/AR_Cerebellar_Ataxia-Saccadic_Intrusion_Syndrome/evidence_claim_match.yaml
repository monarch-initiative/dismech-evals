        prompt: How do VPS13D mitochondrial and contact-site defects produce selective cerebellar, oculomotor,
          corticospinal, and peripheral axonal dysfunction in humans, and which model best reproduces
          the compound-hypomorphic disease?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Dysregulated VPS13D-Dependent Organelle Contact-Site Lipid Handling
        - pathophysiology#Impaired Mitochondrial Fission and Mitophagic Completion
        - pathophysiology#Neuronal Dysfunction and Neurodegeneration
        rationale: Fly knockdown and conditional mouse knockout strongly support mitochondrial quality-control
          and neuronal-degeneration mechanisms, but severe depletion or null states do not reproduce the
          typical human combination of one loss-of-function and one missense allele. The mouse model adds
          a microglia-dependent inflammatory death pathway that has not been shown in human SCASI, while
          neither model recreates the defining macrosaccadic oscillations or establishes selective peripheral-nerve
          involvement. Variant-matched human iPSC-derived cerebellar and peripheral neurons with isogenic
          controls are needed to test the cellular-to-circuit bridge.
      selected_evidence:
        snippet: All but 2 patients carried a loss-of-function (nonsense or splice site) mutation on one
          and a missense mutation on the other allele.
        supports: SUPPORT
