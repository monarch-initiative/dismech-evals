      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated VPS13D-Dependent Organelle Contact-Site Lipid Handling
        description: VPS13D is a large contact-site protein with a lipid-transfer domain. Its lipid-transfer
          domain binds glycerophospholipids and fatty acids in vitro; VPS13D depletion inhibits lipid-droplet-to-mitochondria
          fatty-acid trafficking, and Miro/VAP recruitment can bridge VPS13D between the ER and mitochondria.
          Whether VPS13D directly transports endogenous lipids in affected human neurons, and how this
          function contributes to SCASI, remain unproven.
        gene:
          preferred_term: VPS13D
          term:
            id: hgnc:23595
            label: VPS13D
        biological_processes:
        - preferred_term: intermembrane lipid transfer
          term:
            id: GO:0120009
            label: intermembrane lipid transfer
          modifier: DECREASED
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: VPS13D, which in turn binds the ER in a VAP-dependent way and thus could provide a lipid
          conduit between the ER and mitochondria.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
