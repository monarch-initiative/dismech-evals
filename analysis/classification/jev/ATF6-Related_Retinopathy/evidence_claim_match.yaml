      assertion_type: Pathophysiology
      assertion:
        name: ATF6 Unfolded Protein Response Impairment
        biological_scale: MOLECULAR
        description: 'ATF6 is an ER-membrane-resident transcription factor that normally migrates from
          the ER to the Golgi under ER stress, where it undergoes regulated intramembrane proteolysis
          (RIP) to release a cytosolic transcriptional-activator domain that upregulates protein-folding
          chaperones. Pathogenic ATF6 variants disrupt this UPR arm through three distinct mechanisms
          rather than a single loss-of-function direction: impaired ER-to-Golgi trafficking with diminished
          RIP and transcriptional output, aberrant constitutive transcriptional activation independent
          of ER stress, or complete loss of DNA-binding transcriptional activity.'
        genes:
        - preferred_term: ATF6
          term:
            id: hgnc:791
            label: ATF6
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: ATF6-mediated unfolded protein response
          term:
            id: GO:0036500
            label: ATF6-mediated unfolded protein response
          modifier: DYSREGULATED
      selected_evidence:
        snippet: a truncated protein that lacks the DNA binding and transmembrane domains
        supports: SUPPORT
