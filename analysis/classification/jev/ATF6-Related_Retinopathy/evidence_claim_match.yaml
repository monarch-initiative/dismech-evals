        name: Cone-Rod Dystrophy
        display_name: ATF6-Related Cone-Rod Dystrophy
        description: A minority phenotype in which cone responses are extinguished but rod responses are
          also decreased, with some residual color discrimination -- clinically distinct from classic
          achromatopsia despite the shared genetic cause. No ATF6-specific numbered cone-rod dystrophy
          entry exists in OMIM/MONDO (ATF6's only disease-specific identifier is achromatopsia 7/ACHM7);
          this subtype is therefore bound to the generic cone-rod dystrophy disease-series term rather
          than a gene-specific one.
        subtype_term:
          preferred_term: cone-rod dystrophy
          term:
            id: MONDO:0015993
            label: cone-rod dystrophy
      selected_evidence:
        snippet: Detailed phenotypic examination revealed extinguished cone responses but also decreased
          rod responses together with the ability to discriminate some colours suggestive rather for cone-rod
          dystrophy than achromatopsia.
        supports: SUPPORT
