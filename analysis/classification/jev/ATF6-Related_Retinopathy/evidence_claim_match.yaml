            id: hgnc:791
            label: ATF6
        features: 'Biallelic loss- or gain-of-function variants in ATF6 (encoding activating transcription
          factor 6) fall into three functional classes: impaired ER-to-Golgi trafficking with diminished
          transcriptional activity (class 1), constitutively active transcriptional activity even without
          ER stress (class 2), and complete loss of transcriptional activity from a defective bZIP DNA-binding
          domain (class 3). Multiexon deletions have also been reported. ATF6 is a rare cause of achromatopsia
          overall, identified in ten independent families in the founding cohort study.'
      selected_evidence:
        snippet: impaired ER-to-Golgi trafficking and diminished regulated intramembrane proteolysis and
          transcriptional activity
        supports: SUPPORT
