      assertion_type: Discussion
      assertion:
        discussion_id: atp6v0c_cellular_routes
        prompt: Which cellular defects connect ATP6V0C dysfunction to neurodevelopmental impairment and
          epilepsy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced V-ATPase Proton Pumping
        rationale: The founding study proposes combined effects on synaptic signaling, trans-Golgi trafficking
          and lysosomal/autophagic function. Evidence from other V-ATPase genes motivates these possibilities
          but does not establish the corresponding pathway defects in ATP6V0C patient neurons. Worm aldicarb
          sensitivity cannot by itself distinguish GABA from acetylcholine dysfunction. Direct cellular
          measurements would be needed to resolve the relative contributions.
      selected_evidence:
        snippet: We hypothesize that the epilepsy and other neurodevelopmental phenotypes seen in patients
          with pathogenic V-ATPase variants may be due to a combinatorial effect of impaired synaptic
          signalling, trafficking and sorting of various membrane bound proteins, and defects along the
          endomembrane system including the lysosomal/autophagy degradation pathway.
        supports: SUPPORT
        directness: INDIRECT
