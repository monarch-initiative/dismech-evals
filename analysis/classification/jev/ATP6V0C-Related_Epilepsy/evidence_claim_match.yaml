      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: vesicle_loading_deficit
        hypothesis_label: Reduced V-ATPase pumping underfills synaptic vesicles and lowers transmitter
          release
        status: EMERGING
        description: Patient-equivalent variants impair vacuolar acidification in yeast. Applying the
          established dependence of synaptic vesicle loading on the proton electrochemical gradient suggests
          a route through vesicle underfilling and altered neurotransmission. The ATP6V0C clinical and
          functional studies cited here do not directly measure vesicle transmitter content in patient
          neurons or establish preferential failure of inhibitory transmission.
      selected_evidence:
        snippet: Newly-formed synaptic vesicles (SVs) are rapidly acidified by vacuolar adenosine triphosphatases
          (vATPases), generating a proton electrochemical gradient that drives neurotransmitter loading.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
