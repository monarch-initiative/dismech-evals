      assertion:
        name: 16p13.3 microdeletion including TBC1D24, ATP6V0C and PDPK1
        description: Overlapping 16p13.3 deletions involving ATP6V0C, TBC1D24, PDPK1 and other genes cause
          a contiguous-gene syndrome. All eight individuals in the original deletion series had developmental
          delay, intellectual disability and seizures, and six had microcephaly. Chromosomal microarray
          defines the deletion. ATP6V0C has been proposed as a major contributor, but the multigene context
          precludes assigning all features to it alone.
        distinguishing_features:
        - Microcephaly is common in the deletion.
        - Detected by chromosomal microarray.
      selected_evidence:
        snippet: We propose that 16p13.3 microdeletions resulting in simultaneous haploinsufficiencies
          of TBC1D24, ATP6V0C, and PDPK1 cause a novel rare contiguous gene deletion syndrome of microcephaly,
          developmental delay, intellectual disability, and epilepsy.
        supports: SUPPORT
