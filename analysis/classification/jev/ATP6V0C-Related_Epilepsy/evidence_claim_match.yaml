        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ATP6V0C Heterozygous Variant
        conforms_to: synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency
        description: Heterozygous ATP6V0C variants are the initiating genetic lesion; both de novo and
          familial variants occur. Selected patient-equivalent missense variants impair V-ATPase function
          in yeast. Structural modelling proposes interference with c-ring rotation, but the yeast null-complementation
          experiment does not establish dominant-negative action in human heterozygotes. Reduced total
          leukocyte RNA in one stop-loss carrier suggests a dosage contribution; mutant RNA persists,
          and the balance between haploinsufficiency and altered-protein effects remains unresolved.
        notes: Four founding-cohort patients were mosaic. Their seizure histories varied, including early-onset
          epilepsy, late onset, unconfirmed seizure-like episodes and no reported seizures; mosaicism
          does not guarantee a mild presentation.
        biological_scale: MOLECULAR
        role: trigger
        genes:
