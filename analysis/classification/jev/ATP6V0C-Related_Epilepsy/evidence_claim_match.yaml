          term:
            id: hgnc:855
            label: ATP6V0C
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
        molecular_functions:
        - preferred_term: V-ATPase proton pumping activity
          term:
            id: GO:0046961
            label: proton-transporting ATPase activity, rotational mechanism
          modifier: DECREASED
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: We describe heterozygous point variants in ATP6V0C, encoding the c-subunit in the membrane
          bound integral domain of the vacuolar H+-ATPase, in 27 patients with neurodevelopmental abnormalities
          with or without epilepsy.
        supports: SUPPORT
