      assertion_type: Discussion
      assertion:
        discussion_id: gap_atrx_mouse_tissue_models_human_translation
        prompt: To what extent do Sertoli-cell and oligodendrocyte phenotypes in conditional Atrx mouse
          models explain genital and white-matter manifestations in human ATR-X-related syndrome?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Sertoli Cell Survival and Androgen-Signaling Impairment
        - pathophysiology#Oligodendrocyte Differentiation and Myelination Impairment
        rationale: Conditional mouse studies provide tissue-specific mechanisms, but neither branch has
          been established as the causal route in human tissue. The glial study explicitly says the mouse
          functions could explain human white-matter pathology, and the Sertoli model does not directly
          reproduce or prove each human genital phenotype. Human cellular models and patient-correlated
          molecular readouts are needed before these branches are considered canonical.
      selected_evidence:
        snippet: These functions of ATRX identified in mice could explain white matter pathogenesis observed
          in ATR-X syndrome patients.
        supports: SUPPORT
