      assertion_type: Pathophysiology
      assertion:
        name: Reduced Circulating TTR Precursor Pool
        description: 'Serum transthyretin falls deeply and stays low for the dosing interval, removing
          the substrate upstream of tetramer dissociation. Knockdown is reversible and does not alter
          the genome, so the effect depends on continued dosing. Clinical benefit is curated on the treatments
          rather than asserted here: lowering the precursor slows further deposition but does not itself
          clear amyloid already laid down.'
        role: consequence
        biological_scale: ORGANISM
        conforms_to: rnai_gene_silencing#Sustained Reduction of the Encoded Protein
        biological_processes:
