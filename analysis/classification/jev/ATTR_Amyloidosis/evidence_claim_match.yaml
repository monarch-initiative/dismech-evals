  240a5de2027ce229ea28e9cc8791ea80583e3cc237375b7da971eca4dddad5a8:
    claim:
      about:
        disease:
          name: Hereditary Transthyretin Amyloidosis
          disease_term:
            preferred_term: familial amyloid neuropathy
            term:
              id: MONDO:0007100
              label: familial amyloid neuropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hepatic TTR Transcript Abundance
        description: Hepatocytes are the source of essentially all circulating transthyretin, so the hepatic
          TTR message is the single upstream point at which the supply of amyloid precursor - variant
          and wild-type alike - can be reduced. The transcript itself is structurally normal; it is the
          amount of protein it yields that feeds fibrillogenesis. This node exists to anchor the RNAi
          therapeutic chain and is not a claim that TTR transcription is abnormal in ATTR amyloidosis.
        role: therapeutic_vulnerability
        biological_scale: MOLECULAR
        conforms_to: rnai_gene_silencing#Pathogenic Transcript Abundance
        genes:
        - preferred_term: TTR
          term:
            id: hgnc:12405
            label: TTR
        biological_processes:
        - preferred_term: mRNA metabolic process
          term:
            id: GO:0016071
            label: mRNA metabolic process
      selected_evidence:
        snippet: Transthyretin (TTR) is a tetrameric protein synthesized primarily by the liver.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1007/s40259-023-00577-7
      reference_title: RNA Targeting and Gene Editing Strategies for Transthyretin Amyloidosis
      evidence_source: OTHER
      explanation: Establishes the liver as the source of circulating TTR, which is what makes the hepatic
        transcript the actionable upstream target for a liver-directed siRNA.
