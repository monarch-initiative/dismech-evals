      assertion_type: Pathophysiology
      assertion:
        name: Hepatocyte-Directed siRNA Delivery
        description: An administered TTR-directed siRNA reaches the hepatocyte cytosol by one of two platforms,
          and ATTR amyloidosis is the disease where both are approved against the same transcript. Patisiran
          is encapsulated in an ionizable lipid nanoparticle and infused intravenously; vutrisiran is
          a GalNAc conjugate taken up through the hepatocyte asialoglycoprotein receptor after subcutaneous
          injection. The targeting sequence is not what differs between them - the delivery platform is,
          and it is what sets route, dosing interval, and the need for premedication.
        role: effector
        biological_scale: CELLULAR
        conforms_to: rnai_gene_silencing#Target-Cell siRNA Delivery
        biological_processes:
        - preferred_term: receptor-mediated endocytosis of a GalNAc-conjugated siRNA
          term:
            id: GO:0006898
            label: receptor-mediated endocytosis
          modifier: INCREASED
      selected_evidence:
        snippet: Patisiran is formulated in a lipid nanoparticle to ensure delivery to the hepatocyte.
        supports: SUPPORT
