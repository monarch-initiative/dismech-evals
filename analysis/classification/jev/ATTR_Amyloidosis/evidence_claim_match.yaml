              label: Lipid Nanoparticle Encapsulating mRNA Encoding Cas9 Protein and TTR-targeting Single
                Guide RNA NTLA-2001
      selected_evidence:
        snippet: In a small group of patients with hereditary ATTR amyloidosis with polyneuropathy, administration
          of NTLA-2001 was associated with only mild adverse events and led to decreases in serum TTR
          protein concentrations through targeted knockout of TTR.
        supports: SUPPORT
