        hypothesis_label: Canonical Variant-TTR Amyloidogenesis Model
        status: CANONICAL
        description: A pathogenic TTR variant destabilizes the circulating transthyretin tetramer. Tetramer
          dissociation releases monomers that misfold, oligomerize, and assemble into extracellular amyloid
          fibrils; progressive tissue accumulation then produces organ-specific dysfunction.
      selected_evidence:
        snippet: TTR protein destabilised by TTR gene mutation is prone to dissociate from its native
          tetramer to monomer, and to then misfold and aggregate into amyloid fibrils
        supports: SUPPORT
