        action_category: THERAPEUTIC
        therapeutic_modality: GENE_EDITING
        description: NTLA-2001 (nexiguran ziclumeran) is an investigational, single-infusion lipid nanoparticle
          CRISPR-Cas9 therapy designed to disrupt TTR in hepatocytes and durably lower circulating TTR.
          The first-in-human report included only six participants with hereditary ATTR polyneuropathy
          and established target engagement, not clinical efficacy; it remains an emerging therapy rather
          than established care.
        treatment_term:
          preferred_term: gene therapy
