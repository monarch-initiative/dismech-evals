      assertion_type: Pathophysiology
      assertion:
        name: siRNA-Directed TTR Transcript Cleavage
        description: The siRNA guide strand base-pairs with hepatic TTR mRNA and Argonaute-2 cleaves it,
          blocking translation of further transthyretin. Because the complex is released to cleave again,
          the effect is catalytic, which is why a small intracellular dose sustains knockdown between
          widely spaced injections. This node is conditional on ongoing siRNA administration.
        role: effector
        biological_scale: MOLECULAR
        conforms_to: rnai_gene_silencing#Argonaute-2 Cleavage of the Target Transcript
        molecular_functions:
        - preferred_term: Argonaute-2 slicer activity on TTR mRNA
          term:
            id: GO:0070551
            label: endoribonuclease activity, cleaving siRNA-paired mRNA
          modifier: INCREASED
        biological_processes:
        - preferred_term: siRNA-mediated degradation of the TTR transcript
          term:
            id: GO:0090625
            label: siRNA-mediated gene silencing by mRNA destabilization
          modifier: INCREASED
      selected_evidence:
        snippet: Patisiran, an investigational RNA interference therapeutic agent, specifically inhibits
          hepatic synthesis of transthyretin.
        supports: SUPPORT
