      evidence_source: HUMAN_CLINICAL
      explanation: Retrospective multicenter cohort of 32 ATTRV30M (p.V50M) polyneuropathy patients who
        progressed on tafamidis 20 mg and were switched to patisiran. Slower on-treatment neuropathy progression
        after the switch is cited as indirect support for TTR knockdown acting on the mechanism this treatment
        targets. The comparison is against tafamidis specifically, in one genotype, and not against TTR
        stabilizers as a class.
