      assertion_type: Pathophysiology
      assertion:
        name: Matrix metalloproteinase-mediated aortic wall proteolysis
        biological_scale: MOLECULAR
        description: Macrophage- and smooth muscle cell-derived matrix metalloproteinases (notably MMP-2
          and MMP-9) are the predominant proteinases in the AAA wall. A shift in the balance between MMPs
          and their tissue inhibitors (TIMPs) toward net proteolysis drives destruction of the load-bearing
          matrix. MMP-9 is elevated in the circulation of patients who later develop AAA.
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        biological_processes:
        - preferred_term: extracellular matrix disassembly
          modifier: INCREASED
          term:
            id: GO:0022617
            label: extracellular matrix disassembly
      selected_evidence:
        snippet: macrophage production of proteolytic enzymes is deemed responsible for the damaging loss
          of ECM proteins, especially elastin and fibrillar collagens, which characterise AAA progression
          and rupture.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
