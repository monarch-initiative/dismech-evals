        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_retinal_tissue_autonomous_mtp
        prompt: Does loss of local retinal MTP-dependent lipid transport contribute to the retinopathy
          of abetalipoproteinemia independently of systemic vitamin A and E deficiency?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: This entry attributes retinal degeneration to chronic vitamin A and E deficiency and
          does not assume a separate tissue-autonomous mechanism. MTP is nonetheless expressed in human
          retinal pigment epithelium and retinal ganglion cells, so a local contribution is biologically
          possible. The study reporting that expression addressed age-related maculopathy and raised the
          abetalipoproteinemia interpretation only as a possibility, and no experiment has separated local
          retinal MTP loss from systemic vitamin deficiency. The answer determines whether vitamin supplementation
          alone can be expected to prevent retinal degeneration.
        attaches_to:
        - pathophysiology#Vitamin A/E-Associated Retinal Degeneration
        proposed_experiments:
        - experiment_id: retina_specific_mttp_conditional_knockout
          name: Retina-restricted conditional Mttp knockout with normal systemic vitamin E
          description: Cross a retinal Cre driver with a floxed Mttp allele so that MTP is lost in retinal
            pigment epithelium and retinal ganglion cells while systemic lipoprotein assembly and circulating
            vitamin E remain normal, then follow retinal structure and function longitudinally.
          decision_criterion: Retinal degeneration in animals with documented normal circulating vitamin
            E and normal plasma apoB lipoproteins.
          would_support:
          - pathophysiology#Vitamin A/E-Associated Retinal Degeneration
          supporting_outcome:
          - Progressive photoreceptor or retinal pigment epithelium degeneration develops despite normal
            systemic vitamin E, establishing a retinal mechanism that supplementation cannot be expected
            to correct.
          refuting_outcome:
          - Retinal structure and function remain normal, leaving systemic fat-soluble vitamin deficiency
            as the sufficient explanation for the retinopathy.
        notes: Raised as Gap 2 of the OpenScientist evaluation of canonical_mttp_lipoprotein_assembly_model.
          The assessment qualified the claim and asked that it be kept as a discriminating-experiment
          lead rather than promoted to a curated causal edge, which is how it is recorded here.
      selected_evidence:
        snippet: MTP is expressed in RPE, the ARPE-19 cell line, and, unexpectedly, retinal ganglion cells,
          which are neurons of the central nervous system.
        supports: SUPPORT
    origin:
