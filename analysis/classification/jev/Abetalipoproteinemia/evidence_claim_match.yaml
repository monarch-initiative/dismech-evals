  6e094f567645fb8638ce53d6707b11f50f65cefd367a907d287c3a670890f3b6:
    claim:
      about:
        disease:
          name: Abetalipoproteinemia
          disease_term:
            preferred_term: abetalipoproteinemia
            term:
              id: MONDO:0008692
              label: abetalipoproteinemia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_acanthocyte_membrane_mechanism
        prompt: By what erythrocyte membrane mechanism does the absence of apoB-containing lipoproteins
          produce acanthocytes in abetalipoproteinemia?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: Acanthocytosis is a hallmark diagnostic finding, but the steps between absent plasma
          apoB lipoproteins and the spiculated erythrocyte shape are not established. A raised ratio of
          sphingomyelin to glycerophospholipids is documented in abetalipoproteinemia erythrocytes, and
          a Band 3 conformational account has been proposed to unify the inherited and acquired acanthocytoses,
          but neither has been measured directly in patient cells alongside acanthocyte counts.
        attaches_to:
        - pathophysiology#Acanthocytosis and Hemolysis
        - phenotypes#Acanthocytosis
        proposed_experiments:
        - experiment_id: abl_erythrocyte_lipidomics_and_band3_profiling
          name: Erythrocyte membrane lipidomics and Band 3 conformational profiling
          description: Compare erythrocyte membranes from molecularly confirmed patients against healthy
            controls and against lipid-loaded control cells, measuring membrane lipid composition by mass
            spectrometry alongside Band 3 conformational and anion-transport assays on the same samples.
          decision_criterion: A membrane lipid or Band 3 conformational change that tracks with acanthocyte
            counts in patients and is reproduced when control erythrocytes are brought to the same composition.
          would_support:
          - pathophysiology#Acanthocytosis and Hemolysis
          supporting_outcome:
          - Patient erythrocytes show a shifted ratio of sphingomyelin to glycerophospholipids together
            with a measurable shift in Band 3 conformation, and imposing the same composition on control
            cells reproduces the spiculated morphology.
          refuting_outcome:
          - Patient membrane lipid composition and Band 3 conformation are indistinguishable from controls,
            placing the shape change downstream of some other membrane or cytoskeletal determinant.
        notes: Raised as Gap 1 of the OpenScientist evaluation of canonical_mttp_lipoprotein_assembly_model
          and retained by the assessment, which found the terminal acanthocyte link the least resolved
          step of the canonical model.
      selected_evidence:
        snippet: The acanthocytoses in alcoholic cirrhosis and abetalipoproteinemia are accompanied by
          significant increases of the cholesterol level and of the ratio of sphingomyelin and glycerophospholipids,
          respectively.
        supports: SUPPORT
    origin:
