      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_mttp_lipoprotein_assembly_model
        hypothesis_label: Canonical MTTP ApoB-Lipoprotein Assembly Model
        status: CANONICAL
        description: Biallelic MTTP loss of function disrupts the microsomal triglyceride transfer protein
          complex and prevents normal assembly and secretion of intestinal apoB48-containing chylomicrons
          and hepatic apoB100-containing VLDL. The resulting absence of apoB lipoproteins produces severe
          hypolipidemia, intestinal fat and fat-soluble-vitamin malabsorption, hepatic triglyceride retention,
          and downstream multisystem complications.
        notes: The proximal MTTP-to-apoB-assembly mechanism is established. The detailed intermediates
          linking apoB-lipoprotein absence to acanthocyte formation remain incompletely resolved, and
          this entry does not treat retinal MTTP expression or single hypomorphic cases as established
          alternative disease mechanisms or genotype-phenotype rules.
      selected_evidence:
        snippet: MTP activity and the 88-kilodalton component of MTP were present in intestinal biopsy
          samples from eight control individuals but were absent in four abetalipoproteinemic subjects.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:1439810
      reference_title: Absence of microsomal triglyceride transfer protein in individuals with abetalipoproteinemia.
      evidence_source: HUMAN_CLINICAL
      explanation: Human intestinal-biopsy data directly demonstrate absent MTP protein and activity in
        affected individuals.
