  16a1636d9627febbdd5377fb7a2c51f9bcbe78c5e1c07647915b9711d035afb8:
    claim:
      about:
        disease:
          name: Abetalipoproteinemia
          disease_term:
            preferred_term: abetalipoproteinemia
            term:
              id: MONDO:0008692
              label: abetalipoproteinemia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_mttp_residual_activity_genotype_phenotype
        prompt: How much residual MTP activity is needed to attenuate the abetalipoproteinemia phenotype,
          and do MTTP genotypes predict clinical severity?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: 'More than thirty MTTP variants are reported without a systematic genotype to phenotype
          analysis. One compound heterozygous case is suggestive: a normally spliced transcript carrying
          a missense variant retained 65% of MTP activity and apoB48 secretion in vitro, and the patient
          had normal serum apoB48 and red cell vitamin E after supplementation. That transcript was a
          low-frequency species, the same patient had no measurable lipid transfer activity in intestinal
          extract, and one case cannot establish an activity threshold or a predictive rule.'
        attaches_to:
        - genetic#MTTP pathogenic variants
        proposed_experiments:
        - experiment_id: mttp_hypomorphic_allelic_series_and_registry
          name: Hypomorphic Mttp allelic series with a standardized patient genotype series
          description: Knock patient-derived hypomorphic MTTP alleles into mice as a series spanning a
            range of residual lipid transfer activity, and in parallel collect standardized intestinal
            MTP activity, serum apoB48, fat-soluble vitamin, and clinical severity measurements on genotyped
            patients.
          decision_criterion: A reproducible threshold of residual MTP activity below which apoB48 secretion
            and fat-soluble vitamin status fail, holding in an independently ascertained patient cohort.
          would_support:
          - genetic#MTTP pathogenic variants
          supporting_outcome:
          - Residual MTP activity measured in intestinal tissue predicts serum apoB48 and clinical severity
            across both the allelic series and independently ascertained patients.
          refuting_outcome:
          - Patients and animals with comparable residual MTP activity show discordant apoB48 secretion
            and clinical severity, indicating that modifiers outside the MTTP genotype set the phenotype.
        notes: Raised as Gap 3 of the OpenScientist evaluation of canonical_mttp_lipoprotein_assembly_model.
          The assessment qualified the report's genotype to phenotype gradient claim to a testable hypothesis,
          and that scope is what is recorded here. The report's companion claim that no prospective study
          or registry includes this disorder was rejected by the assessment and is deliberately not carried
          over.
      selected_evidence:
        snippet: producing in vitro 65% of normal MTP activity and apoB48 secretion, and two abnormally
          spliced transcripts resulting in a non-functional MTP protein
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30875496
      reference_title: Normal serum ApoB48 and red cells vitamin E concentrations after supplementation
        in a novel compound heterozygous case of abetalipoproteinemia.
      evidence_source: IN_VITRO
      explanation: Splicing and secretion assays quantify residual activity for a single MTTP missense
        allele, which is the observation any genotype to phenotype rule would have to generalize.
