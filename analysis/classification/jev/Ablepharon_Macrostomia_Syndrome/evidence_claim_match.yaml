      assertion_type: Discussion
      assertion:
        discussion_id: ams_residue_specific_phenotype_gap
        prompt: Why does lysine at TWIST2 residue 75 give ablepharon with sparse hair, when glutamine
          or alanine at the same residue gives ectropion with generalized hypertrichosis?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Sparse Scalp Hair
        - pathophysiology#Hair Follicle Development Deficit
        - mechanistic_hypotheses#twist2_glu75_neomorphic_binding
        rationale: The two allelic syndromes differ most in hair and in eyelid severity, yet no study
          among the references cited here has examined hair follicles, eyelid mesenchyme or target genes
          in either. The binding comparison of the alleles was done in HeLa cells. The hair follicle node
          in this entry is therefore hypothetical, and a residue-specific difference in target binding
          is the leading but untested explanation.
      selected_evidence:
        snippet: Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur in both entities,
          and general hypertrichosis occurs in BSS.
        supports: SUPPORT
