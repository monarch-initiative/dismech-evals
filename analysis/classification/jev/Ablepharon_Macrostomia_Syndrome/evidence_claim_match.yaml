          mechanism of each feature is unstudied in AMS. The strongest model support is the heterozygous
          zebrafish twist2 p.Glu78Lys knock-in (the equivalent of human p.Glu75Lys), whose adults develop
          a protruding jaw and a mouth that does not close.'
