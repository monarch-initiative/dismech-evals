      assertion_type: Pathophysiology
      assertion:
        name: Hair Follicle Development Deficit
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: 'Sparse or absent scalp hair, eyebrows, eyelashes and lanugo are consistent features
          of AMS and separate it from Barber-Say syndrome, in which the same residue substituted by glutamine
          or alanine gives generalized hypertrichosis. Twist2 is expressed in dermal mesenchyme and is
          required for normal hair follicle formation in mice, so impaired follicle induction is the most
          direct candidate mechanism. HYPOTHETICAL: no hair or scalp histology from an AMS patient has
          been reported, and the opposite hair phenotypes of the two allelic syndromes show that the lesion
          is not simple loss of TWIST2 function.'
        locations:
        - preferred_term: dermis
          term:
            id: UBERON:0002067
            label: dermis
        biological_processes:
        - preferred_term: hair follicle development
          term:
            id: GO:0001942
            label: hair follicle development
          modifier: DECREASED
      selected_evidence:
        snippet: Twist2 knockdown on E13 left visible marks at the wound site, inhibited regeneration,
          and resulted in defective follicle formation.
        supports: SUPPORT
