            term:
              id: MONDO:0008693
              label: ablepharon macrostomia syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ams_model_fidelity_gap
        prompt: Would a heterozygous Twist2 Glu75Lys knock-in mouse reproduce the eyelid, skin and hair
          phenotype, and which mesenchymal targets would it show to be lost or newly bound?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Zebrafish twist2 p.Glu78Lys base-edited knock-in
        - pathophysiology#Altered TWIST2 Genomic DNA-Binding Pattern
        - pathophysiology#Craniofacial Soft-Tissue Patterning Defect
        rationale: The functional results for p.Glu75Lys come from overexpressed human protein (zebrafish
          mRNA injection, tagged protein in HeLa cells), from engineered alleles in the single C. elegans
          Twist homolog, and from one heterozygous zebrafish twist2 knock-in whose phenotype (jaw and
          mouth, emaciation) was described qualitatively in a methods paper. None of these organisms has
          eyelids, hair or mammalian dermis. Twist2 knockout mice model loss of function, which corresponds
          to Setleis syndrome rather than to this dominant allele. Whether the mechanism is dominant-negative,
          neomorphic or both cannot be settled until the allele is studied in mammalian mesenchyme. No
          mammalian knock-in model was found among the references cited here.
      selected_evidence:
        snippet: Notably, Setleis syndrome patients and Twist2 knockout mice have similar facial features,
          indicating the gene's conserved role in mammalian development.
        supports: SUPPORT
