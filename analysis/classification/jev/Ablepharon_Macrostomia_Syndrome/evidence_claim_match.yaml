            name: Zebrafish embryos injected with mutant human TWIST2 mRNA
            species: Zebrafish
            genotype: Wild-type embryos injected at the one-cell stage with human TWIST2 mRNA (wild-type,
              p.Glu75Lys or p.Glu75Gln); stable Cre-inducible transgenic lines confirmed the phenotypes
            publication: PMID:26119818
            description: Mutant TWIST2 overexpression caused more severe head, trunk and cardiac-edema
              phenotypes than wild-type overexpression. Wild-type human TWIST2 itself caused mild developmental
              defects in approximately 65% of injected embryos, limiting interpretation of the assay as
              a specific disease model. RNA-seq at shield stage identified altered developmental transcription,
              with reductions in extracellular matrix, membrane and cytoskeleton gene sets. Stable inducible
              transgenic experiments supported the reported effects.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Dysregulated TWIST2-Dependent Mesenchymal Transcription
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: ORGANISM
        description: Shows that p.Glu75Lys changes developmental transcription relative to wild-type TWIST2.
        limitations: Global overexpression of human mRNA from the one-cell stage, not a heterozygous allele
          expressed in mesenchyme, so any effect of TWIST2 dose itself is mixed with the effect of the
          substitution. Fish have no eyelids or hair, so the defining features cannot be assessed.
      selected_evidence:
        snippet: Comparison of wild-type and mutant TWIST2 expressed in zebrafish identified abnormal
          developmental phenotypes and widespread transcriptome changes.
        supports: SUPPORT
