      - /disease_term
    evidence_metadata:
      reference: PMID:21595001
      reference_title: Evidence for autosomal dominant inheritance of ablepharon-macrostomia syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: A more mildly affected transmitting father. The authors' suggestion of anticipation
        predates the recognition of parental mosaicism, which explains the same observation.
