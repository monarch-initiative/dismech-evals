      assertion:
        hypothesis_group_id: twist2_glu75_neomorphic_binding
        hypothesis_label: Glu75Lys gives TWIST2 new genomic targets
        status: EMERGING
        description: Mutant TWIST2 may alter transcription by binding sites that wild-type protein does
          not occupy. Mutant-only ChIP-seq peaks directly support altered genomic occupancy in HeLa cells.
          Whether those new targets drive the tissue-specific phenotype, rather than loss of normal binding
          or both effects, remains unresolved. The worm Glu29Lys allele also produces a sex-myoblast proliferation
          defect more severe than the null, which the authors interpret as possible interference with
          another bHLH pathway; this does not establish a specific new human target.
      selected_evidence:
        snippet: Previous studies have shown that the E75K mutation in twsit2 altered the DNA binding
          activity of itself, leading to both gain of function and dominant-negative effects.
        supports: SUPPORT
