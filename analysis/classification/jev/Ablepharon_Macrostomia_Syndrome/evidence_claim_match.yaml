      assertion_type: Pathophysiology
      assertion:
        name: TWIST2 p.Glu75Lys Basic-Domain Substitution
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: A heterozygous substitution of lysine for the conserved glutamic acid at codon 75
          of TWIST2 (NM_057179.2 c.223G>A), in the basic region of the bHLH domain that contacts DNA.
          It was the allele found in all seven AMS families of the gene-discovery series. Glutamine or
          alanine at the same residue gives Barber-Say syndrome instead, so the substituting amino acid,
          not only the position, sets the phenotype.
        gene:
          preferred_term: TWIST2
          term:
            id: hgnc:20670
            label: TWIST2
        genetic_context:
          gene:
            preferred_term: TWIST2
            term:
              id: hgnc:20670
              label: TWIST2
          allele_type: SNV
          zygosity: HETEROZYGOUS
          description: 'Heterozygous missense p.Glu75Lys (c.223G>A), mostly de novo and occasionally inherited
            from a mosaic parent. functional_impact_category is left unset deliberately: the primary functional
            study reports both lost wild-type binding and gained off-target binding and names a dominant-negative
            and a neomorphic mechanism as alternatives, while the C. elegans allelic series favours a
            predominantly dominant-negative mechanism. Picking one enum value would assert more than either
            source does; see mechanistic_hypotheses.'
      selected_evidence:
        snippet: We identified a recurrent de novo mutation in TWIST2 in seven independent AMS-affected
          families, as well as another recurrent de novo mutation affecting the same amino acid in ten
          independent BSS-affected families.
        supports: SUPPORT
    origin:
