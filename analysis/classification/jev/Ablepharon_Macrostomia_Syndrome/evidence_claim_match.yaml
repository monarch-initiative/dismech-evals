          binding pattern relative to wild-type. Wild-type TWIST2 had 630 binding peaks with a canonical
          E-box consensus. Mutants, including p.Glu75Lys, retained only a fraction of wild-type peaks
          and bound additional sites. This supports both loss of normal binding and acquisition of abnormal
          binding; the relative contribution of each to human disease remains unresolved. The relevance
          to endogenous TWIST2 in craniofacial or dermal mesenchyme is provisional because the assay used
          overexpression in a cancer cell line.
