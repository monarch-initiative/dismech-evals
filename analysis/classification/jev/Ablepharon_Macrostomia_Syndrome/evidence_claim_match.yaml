        description: The diagnosis is clinical at birth and is confirmed by sequencing TWIST2. Because
          the substituting amino acid at Glu75 distinguishes AMS from Barber-Say syndrome, the report
          should name the variant. Testing both parents establishes de novo or inherited origin; a mildly
          affected parent may be mosaic.
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: 'Moreover, a genotype-phenotype correlation was observed, because the two syndromes differed
          based solely upon the nature of the substituting amino acid: a lysine at TWIST2 residue 75 resulted
          in AMS, whereas a glutamine or alanine yielded BSS.'
        supports: SUPPORT
