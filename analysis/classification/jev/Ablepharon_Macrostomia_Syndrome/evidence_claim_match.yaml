        discussion_id: ams_developmental_outcome_gap
        prompt: How often does molecularly confirmed AMS cause developmental delay, and is any delay intrinsic
          to TWIST2 p.Glu75Lys or secondary to visual and hearing impairment and prolonged hospitalisation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Developmental Delay
        rationale: Older clinically diagnosed series reported delay in about two-thirds of patients. The
          molecular series documents variable motor and language delays alongside normal development,
          with two individuals unassessed and one delayed individual having cerebral hemorrhage. Later
          patient-perspective reports largely describe normal cognition. These are different outcomes
          and ascertainment frames; sensory impairment and prolonged hospitalization may also affect development.
          A systematic prospective assessment of genotyped patients is lacking.
      selected_evidence:
        snippet: Both are characterized by abnormalities in ectoderm-derived structures and cause a very
          unusual morphology of mainly the face in individuals with otherwise normal cognition and normal
          physical functioning.
        supports: SUPPORT
