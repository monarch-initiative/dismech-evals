      assertion_type: Discussion
      assertion:
        discussion_id: ams_historical_case_reclassification
        prompt: Which older reports should be excluded from the AMS phenotype spectrum?
        kind: INTERPRETATION
        status: RESOLVED
        rationale: The 2016 critical review excluded the Pellegrino chromosome-18q case (PMID:8834257),
          the Amor/Savarirayan CNS case (PMID:11746001), the Kallish limb-anomaly case (PMID:22002929),
          and the Larumbe dental/skin case (PMID:23198177). The authors considered the Kallish phenotype
          an acrofacial dysostosis, possibly Nager syndrome, and the Larumbe phenotype severe congenital
          ichthyosis. The Amor/Savarirayan and Kallish cases tested negative for TWIST2 mutations. These
          exclusions limit the use of older clinically assembled series for phenotype frequencies and
          prevent transferring case-specific findings or interventions to molecularly defined AMS.
      selected_evidence:
        snippet: Lastly, the patient reported by Larumbe et al. ... clearly had severe congenital ichthyosis.
        supports: SUPPORT
