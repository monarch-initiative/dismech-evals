        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: Heterozygous TWIST2 p.Glu75Lys causes the disorder. Most probands carry a de novo
          variant. Before the gene was known, autosomal recessive inheritance had been proposed; familial
          cases with an affected parent and child, in which the parent was more mildly affected, argued
          for dominant transmission with variable expression. Somatic mosaicism for a TWIST2 variant gives
          a milder phenotype, so a mildly affected parent may be mosaic. As for any autosomal dominant
          disorder, a child of a non-mosaic affected person has a 50 percent chance of inheriting the
          variant.
      selected_evidence:
        snippet: Additionally, the child shows more prominent features of the disorder when compared to
          her father documenting variable expression and possible anticipation.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/2
      context_paths:
