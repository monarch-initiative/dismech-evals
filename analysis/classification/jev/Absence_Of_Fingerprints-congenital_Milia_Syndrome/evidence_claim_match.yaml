              label: absence of fingerprints-congenital milia syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SMARCAD1
        gene_term:
          preferred_term: SMARCAD1
          term:
            id: hgnc:18398
            label: SMARCAD1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Heterozygous loss-of-function variants disrupting the skin-specific short isoform of SMARCAD1,
          which starts with an alternative first exon. Reported disease alleles are point mutations in
          the donor splice site of that exon (for example NM_001254949.1:c.-10+2T>G and the recurrent
          c.378+1G>T) or, in one family, a large complex structural variant (deletion plus nontandem inverted
          duplication) removing the first nine exons. A 12-bp deletion spanning the exon-intron junction
          of the alternative exon 1 was found in a further family. The structural-deletion family indicates
          that loss of the skin-specific isoform, not of full-length SMARCAD1, is pathogenic. No ClinGen
          gene-disease validity record for SMARCAD1 and Basan syndrome was found in the local reference
          cache, so no gene_disease_validity assertion is recorded.
      selected_evidence:
        snippet: We demonstrated the existence of a short isoform of SMARCAD1 exclusively expressed in
          the skin.
        supports: SUPPORT
