        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Skin-Specific SMARCAD1 Expression
        biological_scale: MOLECULAR
        description: A minigene assay of the founding variant showed aberrant splicing with reduced stability
          of the short RNA isoform, demonstrated by RT-PCR; the structural deletion family shows that
          one copy of full-length SMARCAD1 suffices, so it is the loss of the skin-specific isoform that
          is pathogenic. Reduced protein level is inferred from the RNA-level data.
      selected_evidence:
        snippet: Although this variant results in the removal of the first nine exons of SMARCAD1 and
          exon 1 of the skin-specific isoform, it manifested in the typical Basan phenotype. This suggests
          that unlike the skin-specific isoform, a single copy of full-length SMARCAD1 is sufficient for
          its respective function.
        supports: SUPPORT
