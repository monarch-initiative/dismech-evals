        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SMARCAD1 Skin-Specific Isoform Splice-Donor Variant
        biological_scale: MOLECULAR
        description: A heterozygous variant affecting the skin-specific short isoform of SMARCAD1, which
          begins with an alternative, otherwise-noncoding first exon. In almost all reported families
          the variant is a point mutation in the donor splice site of that alternative exon 1; one family
          instead carries a large structural variant (a deletion with nontandem inverted duplication)
          that removes the first nine exons including the skin-isoform exon 1. SMARCAD1 is a SNF2-family
          chromatin remodeller.
        genes:
        - preferred_term: SMARCAD1
          term:
            id: hgnc:18398
            label: SMARCAD1
        molecular_functions:
        - preferred_term: ATP-dependent chromatin remodeler activity
          term:
            id: GO:0140658
            label: ATP-dependent chromatin remodeler activity
          modifier: DECREASED
      selected_evidence:
        snippet: Sequencing of all SMARCAD1 coding and noncoding exons revealed a heterozygous transversion
          predicted to disrupt a conserved donor splice site adjacent to the 3' end of a noncoding exon
          uniquely present in the skin-specific short isoform of the gene.
        supports: SUPPORT
