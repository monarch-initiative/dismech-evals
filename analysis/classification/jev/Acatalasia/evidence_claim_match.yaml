      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_cat_deficiency_oral_injury_model
        hypothesis_label: Canonical CAT Deficiency and Oral Injury Model
        status: CANONICAL
        description: Biallelic CAT variants produce marked erythrocyte catalase deficiency and impaired
          hydrogen peroxide decomposition. Most affected people remain asymptomatic, but at gingival wounds
          hydrogen peroxide-producing oral microorganisms can create a local oxidant burden. Historical
          patient-blood agar experiments propose that oxyhemoglobin oxidation, reduced oxygen availability,
          and a self-reinforcing necrotic ulcer and periodontal-injury cycle follow. The same catalase
          deficit makes exogenous hydrogen peroxide an acute methemoglobinemia hazard.
        notes: The oral co-trigger is conditional rather than inevitable. The graph does not treat acatalasia
          as a generalized peroxisome-biogenesis disorder and does not infer chronic hemolysis or universal
          systemic oxidative injury.
      selected_evidence:
        snippet: It is postulated that the gingival lesions resulted from damage to tissue from hydrogen
          peroxide generated by organisms in gingival plaque.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
