      assertion_type: Diagnosis
      assertion:
        name: Quantitative erythrocyte catalase activity assessment
        description: Quantitative erythrocyte catalase activity is the defining biochemical assay. Marked
          or near-total deficiency supports acatalasia, while intermediate activity can suggest heterozygous
          hypocatalasemia; testing for a familial CAT variant is preferred for carrier confirmation. Oral
          findings alone are neither necessary nor sufficient because most affected people are asymptomatic.
        diagnosis_term:
          preferred_term: erythrocyte enzyme activity assessment
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        results: Markedly reduced erythrocyte catalase activity supports acatalasia; intermediate activity
          suggests carrier status and should be confirmed molecularly when a familial variant is known.
      selected_evidence:
        snippet: Affected homozygotes have no blood catalase activity, whereas heterozygotes show activities
          intermediate between this inactivity and the activity of normal controls, without overlap.
        supports: SUPPORT
