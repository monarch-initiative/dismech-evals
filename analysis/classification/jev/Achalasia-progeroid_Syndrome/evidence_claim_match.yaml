      assertion_type: Pathophysiology
      assertion:
        name: Alternative Splicing to a Stable Truncated BUD13 Protein
        description: 'The nonsense substitution causes alternative splicing of BUD13 transcripts, producing
          a stable truncated protein instead of no protein. Its expression level differs between affected
          individuals and tracks disease expression and life expectancy, which the authors interpret as
          the residual function that sets severity and survival. Patient cells are therefore BUD13-deficient
          rather than BUD13-null. The node carries no outgoing causal edge on purpose: the truncated protein
          limits the downstream defects rather than causing them, and the schema has no edge type for
          a severity modifier, so the defects hang from the variant node and this node records the modulation.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: BUD13
          term:
            id: hgnc:28199
            label: BUD13
      selected_evidence:
        snippet: The nucleotide substitution caused alternative splicing of BUD13 leading to a stable
          truncated protein whose expression positively correlated with disease expression and life expectancy.
        supports: SUPPORT
