      assertion_type: Pathophysiology
      assertion:
        name: Defective RES Complex Splicing with Elevated Intron Retention
        description: BUD13 is a subunit of the RES complex, which in vertebrates is required for efficient
          splicing of a subset of short, GC-rich introns. Patient dermal fibroblasts show elevated intron
          retention. Loss of bud13 or the other RES subunits in zebrafish causes a global intron-splicing
          defect, and BUD13 deficiency in macrophages increases retention of BUD13-dependent introns and
          reduces the corresponding mature transcripts.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: BUD13
          term:
            id: hgnc:28199
            label: BUD13
        protein_complexes:
        - preferred_term: RES complex
          term:
            id: GO:0070274
            label: RES complex
        molecular_functions:
        - preferred_term: RNA binding
          modifier: DECREASED
          term:
            id: GO:0003723
            label: RNA binding
