    evidence_metadata:
      reference: PMID:40604280
      reference_title: Range extender mediates long-distance enhancer activity.
      evidence_source: MODEL_ORGANISM
      explanation: In mouse, a ZRS with mutated homeodomain motifs that keeps its enhancer activity but
        cannot act over long range still produces severe limb reduction. This shows that failure of the
        long-distance ZRS-SHH communication, rather than loss of the enhancer itself, is sufficient for
        limb reduction; it is indirect because the mouse lesion alters ZRS motifs, not the CTCF sites
        deleted in acheiropodia.
