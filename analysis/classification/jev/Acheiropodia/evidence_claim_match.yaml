      assertion_type: CausalEdge
      assertion:
        target: Loss of Limb-Bud SHH Expression
        causal_link_type: UNKNOWN
        description: 'Loss of enhancer-promoter contact is proposed to prevent ZRS-driven SHH transcription
          in the limb bud. This step is inferred. SHH expression in the embryonic limb bud has not been
          measured for the human allele; the only human measurement is in EBV-transformed lymphoblastoid
          cells, where SHH mRNA was low overall and lower in proband than wild-type cells. The orthologous
          mouse deletion leaves Shh expression unchanged because mouse CTCF architecture differs. Mouse
          data cut both ways: deleting CTCF sites around the ZRS reduced limb Shh by about half with no
          limb phenotype, whereas an inversion that disrupted ZRS-Shh contact abolished ZPA Shh and truncated
          the limb. A partial contact defect may therefore not be enough, and how completely the human
          deletion silences limb SHH is unknown.'
      selected_evidence:
        snippet: We also checked the mRNA expression of SHH in the wild-type and mutant cells, observing
          overall low expression levels that were significantly higher in wild-type versus proband cells
        supports: SUPPORT
        directness: INDIRECT
