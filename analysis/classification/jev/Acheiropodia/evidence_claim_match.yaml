        context:
        - path: /genetic/0
          value:
            name: LMBR1
            gene_term:
              preferred_term: LMBR1
              term:
                id: hgnc:13243
                label: LMBR1
            affected_regions:
            - name: LMBR1 exon 4 CTCF scaffold region
              chromosomal_region: 7q36
              within_gene:
                preferred_term: LMBR1
                term:
                  id: hgnc:13243
                  label: LMBR1
              description: The roughly 12 kb interval around LMBR1 exon 4 removed by the Brazilian acheiropodia
                allele. It carries three CTCF sites (LSC3-5) in convergent orientation to SHH and showed
                no limb enhancer activity in a transgenic assay. The ZRS enhancer in LMBR1 intron 5 lies
                outside the deletion and is intact.
            association: Homozygous deletions within LMBR1 cause acheiropodia. The common Brazilian allele
              removes LMBR1 exon 4 and the CTCF sites that tether the ZRS to the SHH promoter; SHH, about
              1 Mb away, is the presumed regulatory target.
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            features: 'LMBR1 is bound here because the causal deletions physically remove LMBR1 sequence
              and because OMIM and MONDO assign acheiropodia to LMBR1. The functional evidence does not
              support loss of the LMBR1 protein as the mechanism: Ushiki et al. note that a mouse deletion
              of Lmbr1 exons 1-3 has no limb phenotype and attribute the disease to loss of the CTCF-mediated
              ZRS-SHH promoter contact. The exon-4-skipped transcript and premature stop codon reported
              by Ianakiev et al. are therefore recorded as a consequence of the deletion, not as the disease
              mechanism.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: Homozygous 12 kb deletion encompassing LMBR1 exon 4
        description: The common Brazilian founder allele, found homozygous in all five families studied
          by Ianakiev et al. Whole-genome sequencing of one proband refined it to a 12 kb deletion surrounding
          LMBR1 exon 4. At the RNA level it produces an LMBR1 transcript lacking exon 4 with a downstream
          premature stop codon. It removes three CTCF sites that tether the ZRS to the SHH promoter; the
          ZRS itself is not deleted and carried no rare variant in the sequenced proband.
        gene:
          preferred_term: LMBR1
          term:
            id: hgnc:13243
            label: LMBR1
        regulatory_target_gene:
          preferred_term: SHH
          term:
            id: hgnc:10848
            label: SHH
        variant_type: deletion
        genomic_contexts:
        - coding sequence
        - intron
        affected_regions:
        - name: LMBR1 exon 4 CTCF scaffold region
          chromosomal_region: 7q36
          within_gene:
            preferred_term: LMBR1
            term:
              id: hgnc:13243
              label: LMBR1
          description: The deleted interval containing CTCF sites LSC3-5; it lies within LMBR1, centromeric
            to the intact ZRS enhancer.
        clinical_significance: PATHOGENIC
        functional_effects:
        - function: CTCF-mediated contact between the ZRS enhancer and the SHH promoter
          description: In patient lymphoblastoid cells the SHH promoter no longer contacts the ZRS and
            instead contacts a CTCF site centromeric to it. Reduced limb-bud SHH expression is inferred
            from this and from mouse ZRS and Shh knockouts; limb-bud SHH expression has not been measured
            for the human allele. In patient lymphoblastoid cells SHH mRNA was low overall and lower than
            in wild-type cells.
          type: loss of enhancer-promoter contact
          affected_developmental_stage: embryonic limb development
          regulatory_mechanism: Deletion of three convergent CTCF sites that act as a scaffold bringing
            the ZRS to the SHH promoter.
      selected_evidence:
        snippet: Using whole-genome sequencing, we fine-mapped the acheiropodia-associated region to 12
          kb and show that it does not function as an enhancer.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0/variants/0
