        biological_scale: CELLULAR
        description: Pulse-chase measurements in ACG1A patient fibroblasts found total secretory output
          reduced to approximately 50% of controls. Pro-COL1A1 secretion was also impaired. ODCD fibroblasts
          retained normal bulk secretion despite defects in specific cargoes. Mouse chondrocyte experiments
          similarly identify cargo-selective changes, so fibroblast bulk output should not be treated
          as a measurement of every cartilage protein. In HeLa-cell depletion experiments, GM130 partially
          compensated for anterograde ER-to-Golgi trafficking, but not retrograde Golgi-to-ER trafficking;
          this redundancy has not been demonstrated in patient chondrocytes.
