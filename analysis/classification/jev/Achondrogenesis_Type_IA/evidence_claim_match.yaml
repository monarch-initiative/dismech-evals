        - pathophysiology#Variable Primary Cilium Abnormalities
        prompt: Does loss of GMAP-210 impair primary cilia in ACG1A, and does this contribute to the phenotype?
        rationale: Golgi IFT20 dispersal is established, but the 2019 patient-cell study found normal
          ciliary morphology, length and IFT20 targeting. It could not assess transport of relevant ciliary
          cargoes. The 2021 deep-intronic-variant study instead found reduced ciliogenesis and shorter
          cilia. Differences in alleles, cell lines or culture conditions remain possible explanations
          rather than demonstrated causes.
