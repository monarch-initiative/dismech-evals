        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of IFT20 Anchoring at the Golgi
        prompt: Does loss of GMAP-210 impair primary cilia in ACG1A, and does this contribute to the phenotype?
        rationale: IFT20 loses its normal distribution in ACG1A cells. Ciliogenesis was reduced in fibroblasts
          homozygous for a deep intronic allele, whereas an earlier functional study of TRIP11-mutant
          patient cells favoured a Golgi-based over a ciliary mechanism. The discrepancy could reflect
          the alleles, the culture conditions or the cell lines, and chondrocyte cilia have not been examined.
      selected_evidence:
        snippet: This association and extraskeletal disease manifestations in ODCD point to a cilium-dependent
          pathogenesis. However, our functional studies in patient-derived primary cells clearly support
          a Golgi-based disease mechanism.
        supports: REFUTE
        directness: INDIRECT
