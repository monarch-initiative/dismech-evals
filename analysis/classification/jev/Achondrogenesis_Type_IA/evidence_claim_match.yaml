        - pathophysiology#Cranial Osteogenic Cell Golgi Stress
        - pathophysiology#Premature Cranial Osteogenic Cell Death
        - pathophysiology#Reduced Cranial Osteoblast Collagen Secretion
        prompt: Is the unossified skull vault of ACG1A secondary to cartilage failure, or does GMAP-210
          act directly in skull-forming osteogenic cells?
        rationale: Chondrocyte-specific deletion reproduces skull undermineralization, while Bglap-Cre
          deletion leaves skeletal measurements normal. Wnt1-Cre deletion instead produces impaired collagen
          secretion and, later, ER/Golgi stress with increased cell death in neural crest-derived skull
          bone. These drivers act in different cellular and developmental contexts; the observations do
          not establish a single universal osteoblast mechanism. Human calvarial tissue confirmation is
          lacking.
      selected_evidence:
        snippet: This includes the delay in mineralization of the vertebral column and the bones of the
          skull, thus showing that these features are a secondary consequence of the cartilage phenotype
          and not a cell-autonomous bone phenotype.
        supports: SUPPORT
