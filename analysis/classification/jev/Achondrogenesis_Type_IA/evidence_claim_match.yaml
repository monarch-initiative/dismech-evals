            biological_scale: CELLULAR
            description: Deleting Trip11 in cranial neural crest cells raises ER and Golgi stress in the
              developing frontal bone, with increased cell death and reduced collagen secretion and an
              osteopenia-like skull. This suggests the skull vault defect, where chondrocytes are not
              present, may not be solely secondary to cartilage failure. It conflicts with the finding
              that deleting Trip11 in mature osteoblasts (Bglap-Cre) leaves the skull normal, and the
              two have not been reconciled.
            cell_types:
            - preferred_term: osteoblast
              term:
                id: CL:0000062
                label: osteoblast
            biological_processes:
            - preferred_term: response to endoplasmic reticulum stress
              modifier: INCREASED
              term:
                id: GO:0034976
                label: response to endoplasmic reticulum stress
            - preferred_term: intramembranous ossification
              modifier: DECREASED
              term:
                id: GO:0001957
                label: intramembranous ossification
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Decreased Skull Ossification
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Proposed from mouse data; not shown in human tissue.
      selected_evidence:
        snippet: Unexpectedly, we also found that Golgi stress increased in Trip11 mutant skulls, suggesting
          that both ER and Golgi stress-induced cell death may lead to osteopenia-like phenotypes in Trip11
