            preferred_term: Achondrogenesis Type IA
            term:
              id: MONDO:0008701
              label: achondrogenesis type IA
        context: []
      assertion_type: Genetic
      assertion:
        name: TRIP11
        gene_term:
          preferred_term: TRIP11
          term:
            id: hgnc:12305
            label: TRIP11
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: Reported ACG1A alleles are nonsense and frameshift variants scattered across the gene,
          a deletion of the 3' end of the gene, and a deep intronic splice variant; all tested alleles
          reduce TRIP11 mRNA or GMAP-210 protein to very low levels. Two null alleles give ACG1A, whereas
          a null allele in trans with a partially functional splice allele gives odontochondrodysplasia.
        variants:
        - name: Nonsense and frameshift variants
          description: Truncating variants, homozygous or compound heterozygous, predicted to undergo
            nonsense-mediated decay.
        - name: Deletion of the 3' end of TRIP11
          description: Found in trans with a nonsense variant in a patient whose phenotype was milder
            than classic ACG1A.
        - name: c.5457+81T>A deep intronic variant
          description: Homozygous in four fetuses from two families; creates aberrant splicing with retention
            of 77 bp of intron 18.
      selected_evidence:
        snippet: It is known that null mutations in TRIP11 disrupt Golgi function and cause a lethal skeletal
          dysplasia known as achondrogenesis type 1A (ACG1A)
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31903676
      reference_title: Pathogenic variants in the TRIP11 gene cause a skeletal dysplasia spectrum from
        odontochondrodysplasia to achondrogenesis 1A.
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      explanation: States the null-allele basis of ACG1A within the TRIP11 spectrum.
