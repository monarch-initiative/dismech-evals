        snippet: cilia in GMAP-210–deficient fibroblasts had normal length and exhibited no structural
          abnormalities. Furthermore, ciliary targeting of IFT20 itself was normal in ODCD and ACG1A,
          in spite of its partial, or complete, dispersal from the Golgi.
        supports: REFUTE
