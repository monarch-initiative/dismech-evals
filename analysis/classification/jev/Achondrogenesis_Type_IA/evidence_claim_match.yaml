      assertion_type: Discussion
      assertion:
        discussion_id: acg1a_skull_ossification_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Decreased Skull Ossification
        - pathophysiology#Cranial Osteogenic Cell ER and Golgi Stress
        prompt: Is the unossified skull vault of ACG1A secondary to cartilage failure, or does GMAP-210
          act directly in skull-forming osteogenic cells?
        rationale: The calvarial bones form by intramembranous ossification without a cartilage template,
          yet they are undermineralized in ACG1A. Chondrocyte-specific deletion reproduces the skull defect
          and osteocalcin-Cre deletion does not, which was read as the skull defect being secondary. Neural
          crest-specific deletion, however, produces ER and Golgi stress and cell death in frontal-bone
          osteogenic cells. The two mouse results use Cre drivers acting at different stages of the osteoblast
          lineage, and no human calvarial tissue has been examined.
      selected_evidence:
        snippet: This includes the delay in mineralization of the vertebral column and the bones of the
          skull, thus showing that these features are a secondary consequence of the cartilage phenotype
          and not a cell-autonomous bone phenotype.
        supports: SUPPORT
