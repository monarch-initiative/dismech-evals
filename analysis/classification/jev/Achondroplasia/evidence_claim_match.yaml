      reference_title: The transmembrane mutation G380R in fibroblast growth factor receptor 3 uncouples
        ligand-mediated receptor activation from down-regulation.
      evidence_source: IN_VITRO
      explanation: Direct receptor experiments qualify strict constitutive-activation shorthand.
