        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ach_ciliary_contribution_unquantified
        prompt: How much of the human growth-plate phenotype is attributable to the ciliary branch, as
          opposed to the direct MAPK and STAT arms it lies downstream of?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Primary cilium shortening and disrupted ciliary signaling
        rationale: 'Cilium shortening and IFT20 mis-sorting are reproducible in chondrocytes from human
          achondroplasia and thanatophoric dysplasia cartilage and in mouse models, and a ciliogenesis-restoring
          compound increases bone elongation in the mouse. What has not been done is a measurement that
          separates the ciliary contribution from the receptor''s direct signaling output: every available
          intervention acts upstream of both, and the rescue compound is not cilia-selective. Until such
          an experiment exists, the "achondroplasia is a ciliopathy" reading found in the source literature
          is an interpretive proposal rather than an established classification, and this entry curates
          the branch without adopting that label.'
        notes: Corresponds to gap KG-3 in the OpenScientist report for this hypothesis.
      selected_evidence:
        snippet: Transcriptomic analysis in an Fgfr3 mouse model showed that ciliary mRNA expression was
          modified and influenced significantly by the Indian hedgehog and PKA pathways.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/5
      evidence_path: /discussions/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35078974
      reference_title: Theobroma cacao improves bone growth by modulating defective ciliogenesis in a
        mouse model of achondroplasia.
      evidence_source: MODEL_ORGANISM
      explanation: Shows the ciliary program is transcriptionally entangled with hedgehog and PKA signaling
        in the model, which is why an intervention that restores ciliogenesis does not isolate a ciliary
        contribution.
