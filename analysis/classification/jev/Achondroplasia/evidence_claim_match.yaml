  001090b30d0ac27c9285540619944c3772b6eb1058693c9d278ffb2d9e661014:
    claim:
      about:
        disease:
          name: Achondroplasia
          disease_term:
            preferred_term: achondroplasia
            term:
              id: MONDO:0007037
              label: achondroplasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ach_signaling_arm_attribution
        prompt: Which achondroplasia features depend on the MAPK arm, which on the STAT1 arm, and what
          weight should the p38 branch carry, given that the only approved and late-stage drugs act on
          one arm?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Prolonged FGFR3 signaling in growth-plate chondrocytes
        - pathophysiology#CNP-NPR2 counter-regulation of FGFR3-MAPK signaling
        rationale: Mouse genetics separates the arms — CNP overexpression corrects matrix synthesis through
          MAPK without touching STAT1, constitutively active MEK1 causes Stat1-independent dwarfism —
          and a CDK8 inhibitor now moves the STAT1-Ser727 branch in a mouse model without affecting MAPK
          activation. No study has tested the two interventions together, and no human data assign specific
          clinical features to specific arms; the vosoritide result is consistent with the model but does
          not rank the arms against each other. A third, p38 branch is proposed on the strength of a single
          ATDC5 cell-line study and is not curated as a pathophysiology node here for that reason.
        proposed_experiments:
        - experiment_id: ach_cnp_analogue_plus_cdk8_inhibition
          name: Combined CNP-analogue and CDK8-inhibitor treatment in a humanized knock-in model
          description: Treat humanized FGFR3 p.Gly380Arg knock-in mice with a CNP analogue alone, a CDK8
            inhibitor alone, both together, and vehicle, then compare long-bone length, growth-plate zone
            architecture, and phospho-STAT1 Ser727 versus phospho-ERK in the growth plate.
          perturbations:
          - name: CNP-analogue treatment
            target: pathophysiology#CNP-NPR2 counter-regulation of FGFR3-MAPK signaling
            description: Activates the counter-regulatory branch that brakes MAPK output.
          - name: CDK8 inhibition
            target: pathophysiology#Growth-plate chondrocyte dysregulation
            description: Targets the STAT1-Ser727 arm reported to act independently of MAPK.
          readouts:
          - name: Long-bone length and growth-plate zone architecture
            target: pathophysiology#Impaired endochondral ossification and chondrodysplasia
            direction: RESTORED
            interpretation: A more-than-additive effect of the two agents would indicate that the arms
              contribute separably to the growth deficit.
          controls:
          - name: Vehicle-treated knock-in littermates
            description: Untreated disease-model arm establishing the untreated growth trajectory.
          - name: Wild-type littermates
            description: Isogenic unaffected comparator for growth-plate architecture.
          - name: Single-agent arms
            description: Each agent given alone, so that any combined effect can be judged against the
              better single agent rather than against vehicle.
          decision_criterion: Whether combined treatment exceeds the better single agent on long-bone
            length while each agent moves only its own phospho-marker.
          would_support:
          - pathophysiology#Growth-plate chondrocyte dysregulation
          supporting_outcome:
          - Combined treatment produces greater long-bone elongation than either agent alone, with each
            agent reducing only its own phospho-readout, establishing that the two arms contribute separably.
          refuting_outcome:
          - Combined treatment matches the better single agent, indicating the arms converge on a shared
            limiting step rather than acting separably.
        notes: Corresponds to gap KG-1 in the OpenScientist report for this hypothesis.
      selected_evidence:
        snippet: The CDK8 expression and STAT1Ser727 phosphorylation were upregulated in chondrocytes
          isolated from ACH model mice, and KY-065 repressed its phosphorylation and restored normal chondrogenic
          differentiation without affecting MAPK activation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39674288
      reference_title: CDK8 inhibitor KY-065 rescues skeletal abnormalities in achondroplasia model mice.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that the STAT1 arm is separately druggable in a mouse model without engaging
        MAPK, which is what makes the arm-attribution question experimentally answerable.
