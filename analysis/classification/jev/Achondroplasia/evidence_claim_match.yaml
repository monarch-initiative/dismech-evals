        discussion_id: ach_hypotonia_joint_laxity_mechanism
        prompt: By what mechanism does FGFR3 gain of function produce infantile hypotonia and generalized
          joint hypermobility, and through them thoracolumbar kyphosis?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Floppy infant
        - phenotypes#Knee joint hypermobility
        - phenotypes#Hip joint hypermobility
        - phenotypes#Thoracolumbar kyphosis
        rationale: Hypotonia and generalized joint laxity are documented proximate contributors to motor
          delay and dynamic knee instability, and infantile thoracolumbar kyphosis is managed clinically
          as a consequence of truncal hypotonia during unsupported sitting, usually resolving as trunk
          strength increases and walking begins. No cited source establishes how FGFR3 gain of function
          produces the hypotonia or the ligamentous laxity (candidate contributors include craniocervical
          compression for hypotonia), so no causal edge is asserted for these phenotypes.
      selected_evidence:
        snippet: This results in delayed acquisition of gross motor skills and dynamic knee varus in some
          children
        supports: SUPPORT
