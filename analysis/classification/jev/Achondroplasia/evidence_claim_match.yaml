        prompt: What mechanism links FGFR3 p.Gly380Arg to macrocephaly and the calvarial and upper-facial
          features (frontal bossing, prominent forehead, parietal bossing, wide anterior fontanel, anteverted
          nares)?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
