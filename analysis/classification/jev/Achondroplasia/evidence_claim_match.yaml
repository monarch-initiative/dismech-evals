      reference: PMID:28583899
      reference_title: Statins do not inhibit the FGFR signaling in chondrocytes.
      evidence_source: IN_VITRO
      explanation: 'The authors state both halves of the gap: the chondrocyte-intrinsic FGFR mechanism
        is excluded, and the mechanism behind the earlier rescue is left open.'
