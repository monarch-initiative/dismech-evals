  1652d602f1dbe7f5899f801d10b6d92a619de710a9a19ada642399567799b133:
    claim:
      about:
        disease:
          name: Achondroplasia
          disease_term:
            preferred_term: achondroplasia
            term:
              id: MONDO:0007037
              label: achondroplasia
        context: []
      assertion_type: Treatment
      assertion:
        name: Infigratinib (oral FGFR1-3 tyrosine kinase inhibitor)
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        description: 'Once-daily oral ATP-competitive FGFR1-3 tyrosine kinase inhibitor, repurposed from
          oncology at roughly a hundredth of the oncology dose (0.25 mg/kg/day). It is mechanistically
          distinct from the approved CNP analogues: vosoritide and navepegritide act on a parallel counter-regulatory
          arm (NPR-B/cGMP braking MAPK downstream of the receptor), whereas infigratinib inhibits the
          mutant receptor''s kinase output directly — the first drug in achondroplasia to do so. In the
          52-week phase 3 PROPEL 3 trial (NCT06164951) it increased annualized height velocity by 1.74
          cm/year over placebo, and it is oral rather than injected. Two caveats belong with the result:
          the upper-to-lower segment ratio, the measure of *disproportion* as opposed to height, did not
          change, and the drug is a pan-FGFR1-3 rather than FGFR3-selective inhibitor, so long-term off-target
          skeletal effects are not yet characterized in children. Not approved at time of curation.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: infigratinib
            term:
              id: CHEBI:63451
              label: BGJ-398
        target_phenotypes:
        - preferred_term: Limb undergrowth
          term:
            id: HP:0009826
            label: Limb undergrowth
      selected_evidence:
        snippet: The difference between infigratinib and placebo in the least-squares mean change from
          baseline to week 52 was 1.74 cm per year (95% confidence interval [CI], 1.31 to 2.17; P<0.001)
          for the annualized height velocity, 0.32 (96% CI, 0.23 to 0.41; P<0.001) for the height z score,
          and -0.02 (96% CI, -0.06 to 0.01) for the upper-to-lower body segment ratio.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42370681
      reference_title: Phase 3 Trial of Oral Infigratinib in Children with Achondroplasia.
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the effect and records that the upper-to-lower segment ratio, the disproportion
        measure, was not improved.
