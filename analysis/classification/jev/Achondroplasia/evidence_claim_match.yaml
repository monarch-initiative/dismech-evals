          with impaired receptor down-regulation; strict ligand-independent activation is not required
          by this record.
        variants:
        - name: c.1138G>A (p.Gly380Arg)
          description: The predominant recurrent allele; 150 of 153 p.Gly380Arg-positive cases in one
            154-person series carried c.1138G>A.
        - name: c.1138G>C (p.Gly380Arg)
          description: A less common nucleotide substitution producing the same p.Gly380Arg protein change;
            three cases were observed in the same series.
