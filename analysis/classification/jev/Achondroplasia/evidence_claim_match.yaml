      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_fgfr3_gain_of_function_chondrocyte_model
        hypothesis_label: FGFR3 Growth-Plate Signaling Model
        status: CANONICAL
        description: Recurrent heterozygous FGFR3 p.Gly380Arg gain-of-function prolongs receptor signaling
          in growth-plate chondrocytes. Experiments support delayed receptor down-regulation while G380R
          activation remains predominantly ligand dependent. MAPK-mediated inhibition of hypertrophic
          differentiation and a qualified STAT-p21 branch impair endochondral ossification.
        notes: Strict constitutive activation is not asserted as the sole receptor-level mechanism. CNP-analogue
          growth-velocity responses support therapeutic counter-regulation but do not establish final-height
          or complication benefit.
      selected_evidence:
        snippet: We found that dimerization and activation of the G380R mutant receptor are predominantly
          ligand dependent.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
