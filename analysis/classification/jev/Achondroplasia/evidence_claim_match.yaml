        - phenotypes#Frontal bossing
        - phenotypes#Prominent forehead
        - phenotypes#Parietal bossing
        - phenotypes#Wide anterior fontanel
        - phenotypes#Anteverted nares
        rationale: These features are well documented, but the cited sources provide descriptive or association-level
          statements only. Proposed contributors include relative sparing of membranous calvarial growth
          against a restricted endochondral skull base, markedly delayed sutural closure, frontal-bone
          ossification delay (raised as a possibility in the craniofacial 3D study), and, for macrocephaly,
          brain and CSF-compartment factors related to venous outflow. None is established as the causal
          route in ordinary heterozygous achondroplasia, so no causal edge is asserted for these phenotypes.
      selected_evidence:
        snippet: Sutural closure is markedly delayed (as evidenced by anterior fontanelle closure as late
          as age 5-6 years).
        supports: SUPPORT
