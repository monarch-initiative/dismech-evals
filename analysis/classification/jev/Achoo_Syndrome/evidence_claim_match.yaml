  2326fd4d87aa69dce79ee43a8e4a949e43d926cd5fd02485236bbfc21e8f903f:
    claim:
      about:
        disease:
          name: Achoo Syndrome
          disease_term:
            preferred_term: Achoo syndrome
            term:
              id: MONDO:0007038
              label: Achoo syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Allergic rhinitis
        description: 'Allergic rhinitis is the commonest cause of recurrent paroxysmal sneezing and is
          the principal condition to exclude when sneezing attacks are reported. The overlap with PSR
          is limited to the sneeze itself: allergic sneezing follows IgE-mediated mast-cell mediator release
          after allergen re-exposure and is accompanied by nasal itch, watery rhinorrhoea, and congestion,
          whereas PSR is a brief burst locked to an abrupt light transition with no nasal inflammation.
          The two can coexist, and coexistence does not reclassify the photic trigger.'
        disease_term:
          preferred_term: Allergic rhinitis
          term:
            id: MONDO:0011786
            label: allergic rhinitis
        distinguishing_features:
        - Trigger is allergen exposure (pollen, house dust mite, animal dander) rather than an abrupt
          light transition
        - Sneezing occurs together with nasal itching, watery discharge, and congestion rather than as
          an isolated short burst
        - Allergen-specific IgE or skin-prick sensitization can be demonstrated; PSR has no confirmatory
          test
        - Symptoms are sustained or seasonal rather than lasting seconds after a change in illumination
        notes: 'Ontology caveat, stated here because this entry is the other half of the problem: MONDO
          asserts the idiopathic (vasomotor) non-allergic rhinitis differential below (`MONDO:0006004`)
          to be a *subclass of* this entry''s `MONDO:0011786`. A consumer reasoning over the subclass
          hierarchy will therefore collapse the two differentials into one, despite the prose separating
          them on exactly the allergic/non-allergic axis. See the fuller caveat on that entry; the defect
          is upstream in MONDO, not a claim of either entry here.'
      selected_evidence:
        snippet: Allergic rhinitis affects approximately one in four of the population of westernized
          countries and is characterized by typical symptoms of nasal itching, sneezing, watery discharge
          and congestion.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
