            term:
              id: MONDO:0007038
              label: Achoo syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Trigeminal irritant-induced sneezing
        description: Direct mechanical or chemical stimulation of the nasal mucosa (nasal hair plucking,
          pepper and other irritants, cold dry air, intranasal instrumentation) activates the trigeminal
          afferents of the ordinary sneeze reflex. This is the physiological reflex that PSR is presumed
          to borrow downstream, so the two share the final sneeze-execution circuit and differ only in
          the afferent stimulus. It should be excluded before a light transition is accepted as the trigger,
          because bright-light exposure often coincides with going outdoors, where cold air and airborne
          irritants are simultaneously encountered.
        distinguishing_features:
        - A direct nasal stimulus is identifiable (irritant, instrumentation, cold dry air) at the time
          of sneezing
        - Reproducible with the nasal stimulus in the absence of any change in illumination
        - Occurs in essentially everyone, whereas PSR is present in a susceptible minority
      selected_evidence:
        snippet: A sneeze (or sternutation) is expulsion of air from the lungs through the nose and mouth,
          most commonly caused by the irritation of the nasal mucosa.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/5
      evidence_path: /differential_diagnoses/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19617285
      reference_title: 'Sneeze reflex: facts and fiction.'
      evidence_source: OTHER
      explanation: The review identifies nasal-mucosal irritation as the ordinary cause of sneezing, which
        is the baseline reflex a photic trigger must be distinguished from.
