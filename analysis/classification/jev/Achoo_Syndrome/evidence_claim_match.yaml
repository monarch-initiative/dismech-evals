      reference_title: Prevalence and food avoidance behaviors for gustatory rhinitis.
      evidence_source: HUMAN_CLINICAL
      explanation: The high reported frequency supports treating co-occurrence with PSR as expected rather
        than diagnostically informative. The figure is self-reported from a dermatology outpatient sample,
        not a general-population prevalence, and the same study found allergic-rhinitis patients significantly
        more likely to report symptoms, so it establishes that gustatory rhinitis is common in clinic
