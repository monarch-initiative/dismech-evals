  66a2e5852ee1660ef7ebea5266696adddac51d207f3cbaad9a4339b34d402e0d:
    claim:
      about:
        disease:
          name: Achoo Syndrome
          disease_term:
            preferred_term: Achoo syndrome
            term:
              id: MONDO:0007038
              label: Achoo syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Sneezing secondary to lateral medullary syndrome
        description: Lateral medullary (posterior inferior cerebellar artery) syndrome is a brainstem
          infarct involving the medulla, where the sneeze-execution circuitry resides, and sneezing has
          been described as a manifestation of it. Together with epilepsy it forms the only non-benign
          arm of this differential, and it is the reason a new-onset sneezing pattern in an adult should
          not simply be labelled a photic sneeze reflex.
        disease_term:
          preferred_term: Lateral medullary syndrome
          term:
            id: MONDO:0006827
            label: lateral medullary syndrome
        distinguishing_features:
        - Abrupt new onset in adulthood rather than a lifelong trait, and without a family history
        - Accompanied by the lateral medullary deficit pattern - crossed sensory loss, dysphagia, dysarthria,
          vertigo, Horner syndrome
        - Not reproducibly locked to an abrupt bright-light transition
        - Confirmed by neuroimaging (MRI) rather than by trigger history alone
        notes: 'The medullary localization is what makes this differential mechanistically pointed: it
          lesions the same brainstem sneeze-execution circuit that the "General Sneeze Execution Circuit"
          pathophysiology node of this entry models as the shared final common pathway.'
      selected_evidence:
        snippet: Sneezing is a protective reflex, and is sometimes a sign of various medical conditions.
        supports: SUPPORT
