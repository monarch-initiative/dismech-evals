      assertion:
        hypothesis_group_id: cortical_sensory_hyperexcitability
        hypothesis_label: Cortical Sensory Hyperexcitability Model
        status: EMERGING
        description: Enhanced responsiveness of visual cortex and co-activation of insular and secondary
          somatosensory regions may contribute to nasal prickling and photic sneezing. Human EEG supports
          cortical involvement, but the pathway from these cortical responses to sneeze execution has
          not been established.
      selected_evidence:
        snippet: we found a generally enhanced excitability of the visual cortex (mainly in the cuneus)
          to visual stimuli in 'photic sneezers' compared with control subjects
        supports: SUPPORT
