        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Sneezing secondary to epilepsy
        description: Sneezing can occur as a paroxysmal manifestation of epilepsy, whether as an ictal
          automatism or peri-ictally. It shares with PSR the character of a stereotyped, involuntary,
          abruptly-onset paroxysm, which is precisely why it can be mistaken for a benign reflex; photosensitive
          epilepsy makes the overlap sharper still, since there the paroxysm is genuinely light-provoked.
        disease_term:
          preferred_term: Epilepsy
          term:
            id: MONDO:0005027
            label: epilepsy
        distinguishing_features:
        - Accompanied by other seizure semiology (impaired awareness, automatisms, post-ictal state) rather
          than occurring as an isolated sneeze
        - Onset timing does not discriminate - epilepsy commonly begins in childhood, so a lifelong history
          is not reassuring here the way it is against an adult-onset vascular cause
        - Requires EEG for diagnosis; PSR is diagnosed on trigger history alone
        - In photosensitive epilepsy the light trigger overlaps with PSR, so the discriminator is the
          accompanying seizure activity rather than the trigger
        notes: Photosensitive epilepsy is the sub-case where the trigger-based logic used throughout this
          differential block breaks down, because both conditions are then light-provoked; the discriminator
          becomes the presence of seizure activity, not the stimulus.
      selected_evidence:
        snippet: Sneezing can further be triggered through sudden exposure to bright light, a particularly
          full stomach and physical stimulants of the trigeminal nerve, as a result of central nervous
          system pathologies such as epilepsy, posterior inferior cerebellar artery syndrome or as a symptom
          of psychogenic pathologies.
        supports: SUPPORT
