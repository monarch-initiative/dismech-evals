            term:
              id: MONDO:0007038
              label: Achoo syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Idiopathic (vasomotor) non-allergic rhinitis
        description: Non-allergic rhinitis produces sneezing and rhinorrhoea in response to non-immunological
          environmental triggers such as temperature change, strong odours, tobacco smoke, and air pollution,
          without demonstrable IgE sensitization. It is the closest phenocopy of PSR among the rhinitides
          because both are non-inflammatory and both are provoked by an abrupt environmental change; the
          discriminator is that the provoking change is thermal, chemical, or olfactory rather than photic,
          and that symptoms persist beyond the moment of exposure.
        disease_term:
          preferred_term: Vasomotor rhinitis
          term:
            id: MONDO:0006004
            label: vasomotor rhinitis
        distinguishing_features:
        - Triggered by temperature fluctuation, strong odours, tobacco smoke, or air pollution rather
          than by bright light
        - Chronic nasal congestion and rhinorrhoea accompany the sneezing; PSR is a self-limited sneeze
          burst
        - Allergy testing is negative, as it also is in PSR, so a negative test does not distinguish the
          two
        notes: 'Because neither PSR nor idiopathic rhinitis has a confirmatory laboratory test, the separation
          rests on trigger specificity elicited by history. Ontology caveat: MONDO asserts `is_a: MONDO:0011786`
          (allergic rhinitis) for `MONDO:0006004`, placing this non-allergic entity under allergic rhinitis
          and inheriting hypersensitivity-reaction and allergic-respiratory-disease ancestry. This contradicts
          the very distinction the entry exists to draw, and a consumer reasoning over the subclass hierarchy
          would collapse this differential into the allergic rhinitis differential above it. It also contradicts
          MONDO''s own logical definition of the term, whose `intersection_of` is rhinitis + regulation
          of vasoconstriction with no allergic component, and its NCIT-derived `def:` makes no mention
          of IgE. The term is nonetheless retained because it is the correct entity and the best available:
          the alternative is the undifferentiated `MONDO:0003014` parent. Treat the asserted parentage
          as an upstream defect to be reported to MONDO, not as a curation claim of this entry.'
      selected_evidence:
        snippet: Rhinitis is a heterogeneous condition that has been associated with inflammatory responses
          as in allergic rhinitis but can also occur in the absence of inflammation such as in so-called
          idiopathic (previously 'vasomotor') rhinitis.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
