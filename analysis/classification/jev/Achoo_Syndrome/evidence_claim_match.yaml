  dae9f5b38d5a4c44fd97a350e4ec3c4fcba7731b241c320e2d0f3a01d03e557e:
    claim:
      about:
        disease:
          name: Achoo Syndrome
          disease_term:
            preferred_term: Achoo syndrome
            term:
              id: MONDO:0007038
              label: Achoo syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Gustatory rhinitis
        description: 'Gustatory rhinitis is a non-allergic rhinitis in which food ingestion provokes rhinorrhoea
          and sneezing. It sits between the rhinitides and the trigger-defined sneeze reflexes and is
          the nearest neighbour of snatiation: both are meal-associated, but gustatory rhinitis is driven
          by a property of the food rather than by gastric distension, and it produces prominent rhinorrhoea
          rather than an isolated sneeze burst. Hot and spicy foods are the classic and most frequently
          identified triggers, but the source study concluded that almost any food can be implicated,
          so an atypical food history does not exclude it. It appears to be common, so its co-occurrence
          with PSR is better treated as expected than as diagnostically meaningful.'
        distinguishing_features:
        - Trigger is food ingestion - classically hot or spicy, most often chili peppers, though a wide
          range of foods is implicated - not a light transition
        - Rhinorrhoea is the dominant symptom rather than a short sneeze burst
        - Occurs during or shortly after eating, so it is separable from PSR on timing alone
        - Distinguished from snatiation by being driven by food properties rather than by stomach fullness
        notes: 'No `disease_term` is attached because MONDO has no gustatory rhinitis term (checked with
          OAK against `sqlite:obo:mondo`). The available neighbours are unsuitable rather than merely
          imprecise: `MONDO:0003014` rhinitis is the shared parent of several entries here and so discriminates
          nothing, and `MONDO:0006004` vasomotor rhinitis names a different type of non-allergic rhinitis
          already used for a separate differential in this block, so attaching it would conflate two distinct
          entities (note that MONDO asserts that term *under* allergic rhinitis rather than as a non-allergic
          sibling - see the misclassification recorded on that entry). Following the same convention as
          the snatiation entry, no term is preferable to a wrong one; this is a second MONDO new-term-request
          candidate.'
      selected_evidence:
        snippet: Of the 571 participants who completed the survey, 396 (69%) indicated at least 1 food
          resulted in gustatory rhinitis symptoms.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/1
