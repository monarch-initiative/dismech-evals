      assertion_type: DifferentialDiagnosis
      assertion:
        name: Psychogenic (intractable) sneezing
        description: Psychogenic sneezing presents as persistent, often paroxysmal and unremitting sneezing,
          characteristically in adolescents, that is not locked to any external physical trigger and typically
          abates during sleep. It matters as a differential because a sufferer may attribute the attacks
          to whatever was happening at onset, including going out into sunlight, and because it is a diagnosis
          of exclusion that should not be reached until organic causes have been ruled out.
        distinguishing_features:
        - Sneezing is intractable and continuous rather than a short burst locked to an abrupt light transition
        - No reproducible physical trigger, and attacks typically remit during sleep
        - A precipitating psychosocial event may be identifiable on psychiatric assessment
        - Diagnosis of exclusion; organic lesions and other causes must be excluded first
      selected_evidence:
        snippet: An overwhelming number of such patients may be linked to a psychogenic cause; nevertheless,
          organic lesions or causes should be carefully excluded.
        supports: SUPPORT
    origin:
