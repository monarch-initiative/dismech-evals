  6035f7725b7ab18f48433217c673cb437587ed6f1ff5a29d583599fac72e6a3a:
    claim:
      about:
        disease:
          name: Achoo Syndrome
          disease_term:
            preferred_term: Achoo syndrome
            term:
              id: MONDO:0007038
              label: Achoo syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Snatiation (stomach-fullness sneeze reflex)
        description: 'Snatiation is an involuntary sneeze burst provoked by gastric distension after a
          large meal. It is the closest nosological relative of PSR: both are benign, familial, trigger-specific
          sneeze reflexes reported to segregate in a dominant-like fashion in selected kindreds, and both
          are diagnosed purely on the reproducible trigger. The distinction is the eliciting stimulus,
          and the two traits can be reported in the same individual.'
        distinguishing_features:
        - Trigger is a particularly full stomach after eating, not sudden bright light
        - Sneezing follows meals rather than light transitions, so a food diary or meal-linked history
          separates the two
        - No visual or ocular component and no relationship to illumination
        notes: 'The trait was described as an autosomal dominant sneezing disorder provoked by fullness
          of the stomach (PMID:2769729) and later given the backronym SNATIATION (PMID:2325110); both
          are brief letters without abstracts, so no snippet-verified quote is available and the claim
          is carried here by the review citation. No `disease_term` is attached because MONDO has no current
          term for this trait: the only candidate, MONDO:0007645 "gastric sneezing" (xref OMIM:137130),
          is obsoleted, and per convention no term is preferable to a wrong or deprecated one. This is
          a candidate for a MONDO new-term request.'
      selected_evidence:
        snippet: Sneezing can further be triggered through sudden exposure to bright light, a particularly
          full stomach and physical stimulants of the trigeminal nerve, as a result of central nervous
          system pathologies such as epilepsy, posterior inferior cerebellar artery syndrome or as a symptom
          of psychogenic pathologies.
        supports: SUPPORT
    origin:
