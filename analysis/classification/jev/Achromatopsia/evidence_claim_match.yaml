        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Blue-cone monochromatism
        description: Blue-cone monochromatism overlaps through congenital severe visual acuity reduction,
          infantile nystagmus, photophobia, normal-appearing fundus, and poor color discrimination.
        distinguishing_features:
        - X-linked inheritance and predominant male affection favor blue-cone monochromatism over autosomal
          recessive achromatopsia.
        - Blue-cone monochromatism preserves S-cone function, so blue flashes on a yellow background can
          elicit cone ERG responses.
        - Special four-color plate or two-color filter testing can distinguish blue-cone monochromats
          from rod monochromats.
      selected_evidence:
        snippet: Blue-cone monochromatism
        supports: SUPPORT
