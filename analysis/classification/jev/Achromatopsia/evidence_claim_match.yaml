      assertion:
        name: Electroretinography (ERG)
        description: 'Full-field electroretinography is the cornerstone diagnostic test for achromatopsia.
          Cone-mediated (photopic) ERG responses are absent or severely reduced, including absent or markedly
          diminished 30-Hz flicker responses, while rod-mediated (scotopic) responses are preserved or
          only mildly abnormal. A 15-Hz flicker ERG can demonstrate absence of the cone-driven fast pathway
          at high flash intensities.

          '
        diagnosis_term:
          preferred_term: electroretinogram procedure
          term:
            id: NCIT:C101217
            label: Retinal Examination
      selected_evidence:
        snippet: The photopic response (including the 30-Hz flicker response) is absent or markedly diminished
