        description: 'PDE6C encodes the catalytic alpha prime subunit of cone cGMP phosphodiesterase.
          Activated cone transducin normally stimulates PDE6 to convert cGMP to 5-prime-GMP, lowering
          cGMP and closing CNG channels during the light response. Loss of PDE6C catalytic function impairs
          cGMP hydrolysis, favoring persistently elevated cGMP and open CNG channels and preventing a
          normal cone light response.

          '
        genes:
        - preferred_term: PDE6C
          term:
            id: hgnc:8787
