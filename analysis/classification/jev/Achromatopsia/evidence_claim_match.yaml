          couples activated cone opsin to phosphodiesterase activation. Loss of GNAT2 function prevents
          signal transduction from photoactivated cone opsin to PDE6C, blocking the phototransduction
          cascade at the G-protein coupling step. cGMP levels remain constitutively high, but without
          transducin signaling the cone cannot generate a light response.

          '
        genes:
