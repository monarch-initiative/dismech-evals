      assertion_type: Treatment
      assertion:
        name: Gene Augmentation Therapy (CNGA3)
        description: 'Subretinal delivery of AAV8 vectors carrying wild-type CNGA3 cDNA under a cone-specific
          promoter (human cone arrestin ARR3 promoter). Published phase I data show modest within-eye
          outcome signals, but the small, nonrandomized study cannot establish a causal efficacy effect.
          Active and completed phase 1/2 programs support continued clinical study, but CNGA3 gene augmentation
          remains investigational rather than approved therapy.

          '
        action_category: THERAPEUTIC
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: all 9 treated eyes demonstrated some level of improvement in secondary end points regarding
          cone function, including mean change in visual acuity of 2.9 letters (95% CI, 1.65-4.13; P =
          .006, 2-sided t test paired samples). Contrast sensitivity improved by a mean of 0.33 log (95%
          CI, 0.14-0.51 log; P = .003, 2-sided t test paired samples).
        supports: SUPPORT
