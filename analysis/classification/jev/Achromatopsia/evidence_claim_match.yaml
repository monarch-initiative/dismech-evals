      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cone and cone-rod dystrophies
        description: Cone and cone-rod dystrophies overlap with achromatopsia through reduced visual acuity,
          photophobia, glare sensitivity, and abnormal color vision.
        distinguishing_features:
        - Disease progression over time favors cone or cone-rod dystrophy, whereas achromatopsia is typically
          congenital and relatively stable.
        - Later onset and elevated dark-adapted rod thresholds support cone-rod dystrophy rather than
          isolated congenital cone dysfunction.
      selected_evidence:
        snippet: Best clinical discriminator is disease progression.
        supports: SUPPORT
