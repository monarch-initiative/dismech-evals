        - path: /treatments/1
          value:
            name: Gene Augmentation Therapy (CNGB3)
            description: 'Subretinal AAV-mediated delivery of CNGB3 aims to restore cone CNG channel function.
              Preclinical studies in CNGB3-mutant dogs demonstrated stable restoration of cone function
              for at least 33 months. In the first-in-human NCT03001310 report, inflammation occurred
              in nine of 23 participants. It was mainly mild or moderate, but severe cases occurred primarily
              at the highest dose and two events were serious and dose limiting. No consistent group-level
              efficacy pattern was observed at 24 weeks. Human phase 1/2 programs remain investigational.

              '
            action_category: THERAPEUTIC
            therapeutic_modality: GENE_THERAPY
            treatment_term:
              preferred_term: gene therapy
              term:
                id: NCIT:C15238
                label: Gene Therapy
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Cone CNG Channel Dysfunction
        treatment_effect: RESTORES
        description: CNGB3 gene augmentation supplies the beta subunit needed for functional heteromeric
          cone CNG channels.
      selected_evidence:
        snippet: rAAV-mediated gene replacement therapy with different forms of the human red cone opsin
          promoter led to the restoration of cone function and day vision in two canine models of CNGB3
          achromatopsia
        supports: SUPPORT
