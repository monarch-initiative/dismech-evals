      assertion_type: Discussion
      assertion:
        discussion_id: acne_pathogenic_ordering
        prompt: How do follicular lineage state, sebaceous activity, microbial community structure, and
          inflammation vary across non-lesional skin, microcomedones, comedones, papules, and pustules,
          and which changes are causal initiators?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Abnormal Pilosebaceous Differentiation
        - pathophysiology#Lesion-Context-Dependent Sebaceous Lipid Dysregulation
        - pathophysiology#C. acnes Community and Strain-Dependent Immune Signaling
        - pathophysiology#Early and Sustained Pilosebaceous Inflammation
        rationale: The traditional four-factor account remains clinically useful, but early inflammation,
          lesion-specific sebogenesis, strain-level microbiome effects, and new genetics all argue against
          a universal linear sequence from sebum through bacteria to inflammation. Cross-sectional tissue
          studies cannot establish temporal order. Longitudinal and paired spatial/single-cell sampling
          across lesion stages is needed to distinguish causes from responses.
      selected_evidence:
        snippet: comedonal skin upregulates sebogenesis genes, whereas pustular skin downregulates sebogenesis.
        supports: SUPPORT
