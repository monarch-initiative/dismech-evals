  899b62eb0428fcec5e0bc75fa24a50127da1213f59000125ac8d32bed57d87cf:
    claim:
      about:
        disease:
          name: Aconitine Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Persistent Voltage-Gated Sodium Channel Activation
        conforms_to: xenobiotic_cardiac_channel_perturbation#Xenobiotic Cardiac Ion-Channel Perturbation
        biological_scale: MOLECULAR
        description: The rate-limiting molecular lesion. Aconitine and mesaconitine bind with high affinity
          to neurotoxin binding site 2 on the alpha subunit of the voltage-gated sodium channel, and do
          so preferentially in the open state. Binding suppresses channel inactivation, so the channel
          remains persistently activated instead of closing after depolarisation - a qualitative escape
          from normal voltage-dependent gating rather than a quantitative increase in channel number or
          conductance, which is why `GAIN_OF_FUNCTION` is used here in preference to `INCREASED`. The
          most toxic Aconitum alkaloids carry two ester bonds on the diterpene skeleton and open the channel
          even at resting potential.
        molecular_functions:
        - preferred_term: voltage-gated sodium channel activity, held open by suppressed inactivation
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
        biological_processes:
        - preferred_term: persistent sodium influx across the plasma membrane
          modifier: INCREASED
          term:
            id: GO:0098719
            label: sodium ion import across plasma membrane
      selected_evidence:
        snippet: Aconitine and mesaconitine bind with high affinity to the open state of the voltage-sensitive
          sodium channels at site 2, thereby causing a persistent activation of the sodium channels, which
          become refractory to excitation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:19514874
      reference_title: Aconite poisoning.
      evidence_source: OTHER
      explanation: States the binding site, the state dependence, and the persistent-activation consequence
        that defines this node.
