  a455b2c0df8165bf76bd5fedb416b56c59a96ad0e8df9001f36366bace452dcf:
    claim:
      about:
        disease:
          name: Aconitine Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-Occlusive Mesenteric Ischaemia
        biological_scale: TISSUE
        description: A complication of the shock state rather than of aconitine itself. Sustained low
          cardiac output and vasopressor exposure provoke splanchnic arteriolar vasoconstriction with
          patent mesenteric arteries - the defining feature of non-occlusive mesenteric ischaemia - producing
          small bowel wall oedema, reduced mucosal enhancement, and potential intestinal ischaemia and
          necrosis. The vasospasm is known to persist even after the precipitating haemodynamic event
          has been corrected, which is why the complication can declare itself days after successful resuscitation.
        biological_processes:
        - preferred_term: splanchnic arteriolar vasoconstriction with patent mesenteric arteries
          modifier: INCREASED
          term:
            id: GO:0042310
            label: vasoconstriction
        notes: '`GO:0002014` "vasoconstriction of artery involved in ischemic response to lowering of
          systemic arterial blood pressure" looks like an exact match on its label and is deliberately
          NOT used: its definition restricts it to vasoconstriction "triggered by vasomotor excitation
          resulting from the detection of high carbon dioxide levels in the vasomotor center of the central
          nervous system", i.e. the CNS ischaemic response, which is not the splanchnic sympathetic and
          renin-angiotensin mechanism of non-occlusive mesenteric ischaemia. The plain parent `GO:0042310`
          is bound instead with a specific preferred_term. Read the definition, not the label.'
      selected_evidence:
        snippet: Portal venous gas accumulation originated from non-occlusive mesenteric ischaemia triggered
          by aconitine-mediated cardiovascular collapse.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:41627141
      reference_title: Transient hepatic portal venous gas following resuscitated cardiac arrest in a
        patient with aconitine poisoning.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' own causal attribution linking aconitine-induced collapse to non-occlusive
        mesenteric ischaemia.
