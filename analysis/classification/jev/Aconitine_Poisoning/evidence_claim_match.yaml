  35c7049507f2977f8f9a08866d2dd825b645268d305d80fc7325134fc1b4367e:
    claim:
      about:
        disease:
          name: Aconitine Poisoning
        context: []
      assertion_type: Environmental
      assertion:
        name: Ingestion of inadequately processed Aconitum root preparations
        exposure_term:
          preferred_term: ingestion of aconite diester alkaloids in an Aconitum root preparation
          term:
            id: ECTO:9000271
            label: exposure to alkaloid
        description: The dominant exposure route. Aconite root is taken as a decoction, powder, tincture
          or medicinal wine for analgesic and antirheumatic indications; poisoning follows when processing
          is inadequate, the dose exceeds that recommended, or an alcoholic preparation is used. Self-prepared
          preparations are a recurring setting because processing is uncontrolled.
        notes: ECTO has no aconitine, aconite or Aconitum exposure term - checked by substring search
          of ECTO labels for `aconit`, which returns only an aconitate hydratase inhibitor. `ECTO:9000271`
          exposure to alkaloid is a true parent (aconitine is a diterpenoid alkaloid) rather than an approximation,
          and is bound with a specific preferred_term. This is more specific than the `ECTO:0000231` exposure
          to chemical fallback used by `Organophosphate_Poisoning`.
      selected_evidence:
        snippet: However, the use of a larger than recommended dose and inadequate processing increases
          the risk of poisoning.
        supports: SUPPORT
    origin:
