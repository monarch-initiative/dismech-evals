              bypass term - a direct label scan of the NCIT release used here for `cardiopulmonary bypass`
              returns nothing. `NCIT:C171507` Extracorporeal Membrane Oxygenation exists but is a different
              modality from the bypass the source recommends, and substituting it would misstate the cited
              recommendation.
          role: ancestor
