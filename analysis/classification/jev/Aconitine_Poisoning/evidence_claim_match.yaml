  6c12c302201af92470064eb9fbf738c0d1c5843a33ca2339a16ab915698db9a6:
    claim:
      about:
        disease:
          name: Aconitine Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ingestion of Aconitum Alkaloids
        biological_scale: ORGANISM
        description: The toxic exposure. Aconitum roots and root tubers concentrate the diester diterpenoid
          alkaloids aconitine, mesaconitine and hypaconitine. Traditional processing - soaking and boiling
          - hydrolyses these to far less toxic monoester and alkamine derivatives, so the dose of intact
          diester alkaloid reaching the circulation is set by preparation method as much as by the quantity
          of root consumed. Inadequate processing, a larger than recommended dose, and alcoholic tincture
          or wine preparations (which extract rather than hydrolyse the alkaloids) are the recognised
          routes to poisoning, alongside accidental ingestion of the wild plant.
        notes: Deliberately carries no ontology-bound process descriptor. The node denotes an exposure
          event, not a biological process of the host, and no GO term describes it; binding the downstream
          sodium term here would assert the mechanism one step before it occurs. The exposure itself is
          grounded in the `environmental:` block via ECTO.
      selected_evidence:
        snippet: Soaking and boiling during processing or decoction preparation will hydrolyze aconite
          alkaloids into less toxic and non-toxic derivatives.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:19514874
      reference_title: Aconite poisoning.
      evidence_source: OTHER
      explanation: Supports processing as the step that determines the delivered dose of intact diester
        alkaloid.
