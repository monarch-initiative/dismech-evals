  c8260c355fd625e56d4519761f77822415a4b703829cbbcab04c3b60476f9a0a:
    claim:
      about:
        disease:
          name: Aconitine Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuromuscular Transmission Block
        biological_scale: CELLULAR
        description: Acting on axonal voltage-gated sodium channels, aconitine reduces the evoked quantal
          release of acetylcholine at the neuromuscular junction, blocking transmission and producing
          the motor weakness of the four limbs seen in severe poisoning. This is a presynaptic release
          failure secondary to depolarising block, not receptor antagonism.
        biological_processes:
        - preferred_term: evoked quantal acetylcholine release at the neuromuscular junction
          modifier: DECREASED
          term:
            id: GO:0014055
            label: acetylcholine secretion, neurotransmission
      selected_evidence:
        snippet: Through its action on voltage-sensitive sodium channels in the axons, aconitine blocks
          neuromuscular transmission by decreasing the evoked quantal release of acetylcholine.
        supports: SUPPORT
