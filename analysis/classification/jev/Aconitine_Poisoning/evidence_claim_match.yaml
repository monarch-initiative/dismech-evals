        biological_scale: ORGANISM
        description: The organism-level consequence and the usual mode of death. Aconitine-induced ventricular
          arrhythmias are characteristically refractory to direct current cardioversion and to antiarrhythmic
          drugs, so haemodynamic collapse can persist despite standard resuscitation; refractory ventricular
          arrhythmia and asystole are the main causes of death, with a reported overall in-hospital mortality
          of 5.5%. Cardiac arrest may require prolonged cardiopulmonary resuscitation, defibrillation
          and vasopressor support.
      selected_evidence:
        snippet: The main causes of death are refractory ventricular arrhythmias and asystole and the
          overall in-hospital mortality is 5.5%.
