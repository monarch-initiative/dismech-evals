  dc23abbe5755ea5a059297f6ff13520241d39d0bf393c5df34944edc9fbe0b4e:
    claim:
      about:
        disease:
          name: Aconitine Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Central Hypotensive and Bradycardic Drive
        biological_scale: ORGANISM
        description: 'A centrally mediated haemodynamic arm, separate from the myocardial one. Chan attributes
          aconitine''s hypotensive and bradycardic actions to activation of the ventromedial nucleus of
          the hypothalamus. This is the mechanism behind the bradycardia and hypotension of the toxidrome
          and is what atropine and inotropes are directed at. It is deliberately kept apart from the cardiac
          triggered-activity node: the two produce opposite rate effects, and conflating them is what
          makes an anticholinergic look like an antiarrhythmic.'
        notes: Placed downstream of ingestion rather than of the sodium-channel node because the source
          attributes the effect to hypothalamic activation without stating that the channel action mediates
          it. Note also that the only vagally mediated action the source describes is aconitine's own
          cholinolytic (anticholinergic) effect, which is vagolytic and would tend toward tachycardia
          - so a vagal attribution for the bradycardia would invert the source. An earlier draft of this
          entry made exactly that error.
      selected_evidence:
        snippet: It has hypotensive and bradycardic actions due to activation of the ventromedial nucleus
          of the hypothalamus.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:19514874
      reference_title: Aconite poisoning.
      evidence_source: OTHER
      explanation: States both the effects and the central mechanism this node asserts.
