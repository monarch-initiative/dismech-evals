  cfa87e080672e2d5b440f7830bacb3891664721c85c7a3c5254e1e0b1158d684:
    claim:
      about:
        disease:
          name: Aconitine Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cholinergic Ileal Hypercontractility
        biological_scale: TISSUE
        description: The gastrointestinal arm. Aconitine, mesaconitine and hypaconitine induce strong
          contractions of the ileum by releasing acetylcholine from postganglionic cholinergic nerves
          - a presynaptic release effect on enteric nerves rather than a direct action on smooth muscle.
          This is the mechanism behind the nausea, vomiting, abdominal pain and diarrhoea of the toxidrome.
        biological_processes:
        - preferred_term: acetylcholine release from postganglionic cholinergic nerves
          modifier: INCREASED
          term:
            id: GO:0014055
            label: acetylcholine secretion, neurotransmission
        - preferred_term: ileal smooth muscle contraction
          modifier: INCREASED
          term:
            id: GO:0006939
            label: smooth muscle contraction
        notes: 'Note the direction contrast with `Neuromuscular Transmission Block`, which is the same
          neurotransmitter and the same GO process in the opposite direction: acetylcholine release is
          DECREASED at the skeletal neuromuscular junction and INCREASED at postganglionic enteric nerves.
          Both are curated because the source states both; they are not a contradiction but different
          synapses.'
      selected_evidence:
        snippet: Aconitine, mesaconitine, and hypaconitine can induce strong contractions of the ileum
          through acetylcholine release from the postganglionic cholinergic nerves.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:19514874
      reference_title: Aconite poisoning.
      evidence_source: OTHER
      explanation: States the effector, the mediator and the nerve population this node asserts.
