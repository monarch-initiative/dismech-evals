  1317e78a37fda79e642300cd724b058627d7be2adc88154bba2c2868cd1856ac:
    claim:
      about:
        disease:
          name: Aconitine Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Triggered Activity and Ventricular Tachyarrhythmia
        conforms_to: xenobiotic_cardiac_channel_perturbation#Arrhythmogenic Triggered Activity
        biological_scale: CELLULAR
        description: The lethal arm. In ventricular cardiomyocytes the persistent sodium current prolongs
          the action potential and generates both early and delayed after-depolarisations; these reach
          threshold and produce triggered activity, the electrophysiological substrate of aconitine-induced
          ventricular tachycardia and fibrillation. A cholinolytic (anticholinergic) action mediated through
          the vagus nerve contributes to the arrhythmogenicity, so the arrhythmia is not attributable
          to the sodium channel effect alone.
        cell_types:
        - preferred_term: ventricular cardiomyocyte
          term:
            id: CL:2000046
            label: ventricular cardiac muscle cell
        molecular_functions:
        - preferred_term: cardiac voltage-gated sodium channel activity, persistently activated
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0086006
            label: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
        biological_processes:
        - preferred_term: prolonged depolarisation of the cardiac action potential
          modifier: INCREASED
          term:
            id: GO:0086012
            label: membrane depolarization during cardiac muscle cell action potential
      selected_evidence:
        snippet: The electrophysiological mechanism of arrhythmia induction is triggered activity due
          to delayed after-depolarization and early after-depolarization.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
