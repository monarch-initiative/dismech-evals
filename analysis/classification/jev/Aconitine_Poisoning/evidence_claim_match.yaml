  8feb97c0ccd87dbf5975d852e80975c4dc563e0897f6259b866e0a77a09d6ae5:
    claim:
      about:
        disease:
          name: Aconitine Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sustained Depolarisation and Loss of Excitability
        biological_scale: CELLULAR
        description: Persistent sodium entry depolarises excitable cells and keeps them depolarised, so
          voltage-gated channels cannot recover from inactivation and the cell becomes inexcitable. This
          biphasic behaviour - initial excitation followed by depolarising block - explains the clinical
          sequence in peripheral nerve, where early paraesthesia and numbness of the face, perioral area
          and limbs give way to motor weakness.
        biological_processes:
        - preferred_term: sustained membrane depolarisation ending in inexcitability
          modifier: INCREASED
          term:
            id: GO:0051899
            label: membrane depolarization
      selected_evidence:
        snippet: Activation of sodium channels and in consequence excessive depolarization with final
          inexcitability and suppression of pain transmission account for their antinociceptive properties.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:9760702
      reference_title: The effects of Aconitum alkaloids on the central nervous system.
      evidence_source: OTHER
      explanation: States the excitation-then-inexcitability sequence that is the substance of this node.
