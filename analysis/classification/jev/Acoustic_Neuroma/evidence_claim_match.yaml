      assertion:
        discussion_id: interpretation_acoustic_hearing_not_size_only
        prompt: What proportions of vestibular-schwannoma-associated hearing loss arise from retrocochlear
          nerve effects, mechanical compression, cochlear degeneration, or tumor-secreted factors, and
          why can hearing severity diverge from tumor size?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Vestibular Schwannoma Formation and Tumor Growth
        - pathophysiology#Vestibular Schwannoma Secretome and Cochlear Injury
        rationale: Human temporal-bone data show cochlear degeneration, while tumor size and distance
          from the cochlea did not correlate with structural cochlear change or hearing threshold. A compression-only
          graph would therefore overstate what is known; the entry retains parallel local-nerve and secretome/cochlear
          branches.
      selected_evidence:
        snippet: Tumor size, distance from the cochlea, and nerve of origin did not correlate with structural
          changes in the cochlea or the hearing threshold.
        supports: SUPPORT
