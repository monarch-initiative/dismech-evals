      assertion:
        name: Loss of Merlin-Dependent Contact Inhibition and Receptor Control
        role: central_effector
        description: Merlin normally limits delivery of growth-factor receptors to the Schwann-cell surface
          at cell-cell contact and restrains downstream AKT and MAPK signaling. Merlin loss weakens contact
          inhibition and permits excess mitogenic receptor signaling.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: contact inhibition
          modifier: DECREASED
          term:
            id: GO:0060242
            label: contact inhibition
      selected_evidence:
        snippet: merlin regulates contact inhibition of proliferation by limiting the delivery of several
          growth factor receptors at the plasma membrane of primary SCs.
        supports: SUPPORT
