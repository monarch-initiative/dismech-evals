  88e5bbb0dcd5bb568724b0d8a297d3d0758bc52790e13aa152f928d71910c33e:
    claim:
      about:
        disease:
          name: Acoustic Neuroma
          disease_term:
            preferred_term: acoustic neuroma
            term:
              id: MONDO:0001569
              label: acoustic neuroma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_acoustic_preclinical_models_and_human_function
        prompt: How faithfully do Nf2-null mouse tumors, isolated human primary cells, and murine cochlear
          explants reproduce the human eighth-nerve anatomy, immune and vascular microenvironment, hearing
          loss, tinnitus, and vestibular natural history of sporadic vestibular schwannoma?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#YAP/TAZ-TEAD-Dependent Mitogenic Signaling
        - pathophysiology#Vestibular Schwannoma Secretome and Cochlear Injury
        rationale: The YAP/TAZ study establishes tumor-growth dependence in primary cells and mouse models,
          but not human auditory outcomes. The secretome experiment applies human tumor products to murine
          cochlear explants, establishing plausibility but not the in-vivo fraction of human hearing loss
          caused by soluble factors. A human multicellular model preserving tumor, nerve, cochlear, immune,
          and vascular interactions is needed to bridge these gaps.
        proposed_experiments:
        - experiment_id: exp_acoustic_human_tumor_nerve_cochlea_coculture
          name: Patient-derived vestibular schwannoma, auditory-neuron, and cochlear co-culture
          description: Compare patient-derived NF2-null tumor cells and isogenic NF2-restored controls
            in a human multicellular co-culture containing auditory neurons and cochlear sensory cells;
            perturb TEAD and neutralize candidate secreted factors while measuring tumor growth, neurite
            integrity, hair-cell survival, and electrophysiologic function.
          experiment_type:
            preferred_term: human multicellular tumor-neural co-culture perturbation assay
          model_systems:
          - name: Human vestibular schwannoma-auditory pathway co-culture
            description: Human patient-derived tumor cells combined with auditory-neural and cochlear
              sensory-cell compartments.
            experimental_model_type: CO_CULTURE
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
      selected_evidence:
        snippet: successful use of TEAD palmitoylation inhibitors in a preclinical mouse model of schwannoma
          points to their potential future clinical use.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
