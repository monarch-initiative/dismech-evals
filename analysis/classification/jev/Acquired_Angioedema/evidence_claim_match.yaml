      assertion_type: Diagnosis
      assertion:
        name: Complement and C1-INH Antigenic and Functional Testing
        description: Evaluate recurrent angioedema without wheals using C4, C1-INH antigen, and C1-INH
          function, then interpret C1q, age, family history, and genetic findings in combination. Functional
          and antigenic assays should both be considered because concentration alone can miss functional
          deficiency.
        results: Low C1-INH function with low antigen and/or C4 supports C1-INH-deficiency angioedema.
          Low C1q supports the acquired form, but no single laboratory or historical feature is specific
          on its own.
      selected_evidence:
        snippet: Diagnosis is established by nephelometry, turbidimetry, or radial immunodiffusion for
          quantitative measurement of C1 inhibitor, and chromogenic assay or ELISA has been used for functional
          C1-INH analysis.
        supports: SUPPORT
