      assertion_type: IUISAssignment
      assertion:
        classification_value: phenocopy of IEI
        notes: 'IUIS 2022 phenotypic classification of inborn errors of immunity (Tangye et al., PMID:35748970),
          Table 10 "Phenocopies of inborn errors of immunity", second section, "Associated with autoantibodies".
          The row is "Acquired angioedema", with the presumed pathogenesis given as autoantibody to C1
          inhibitor and the similar-PID column naming hereditary angioedema (C1 INH deficiency) as the
          germline disease it copies. That pairing is the reason to keep this value on this entry and
          off the other one: dismech curates Hereditary_Angioedema separately, and hereditary angioedema
          is a Table 8 (complement deficiency) entity, not a phenocopy. The entity IUIS lists here is
          the acquired functional C1-INH deficiency that this entry defines, so the assignment is entry-level
          rather than subtype-level. Note the table prints the inhibitor as "CI inhibitor"; that is an
          OCR artefact of the source PDF, preserved verbatim in the snippet below because a quoted snippet
          must match the cached text byte for byte.'
      selected_evidence:
        snippet: Acquired angioedema AutoAb to CI inhibitor Normal Normal Normal
        supports: SUPPORT
