          response occurred in 63/68 and remission in 45/61 with that outcome reported. Relapse occurred
          in 15/38 with durability data, with mean follow-up of 23 months. Adverse events were reported
          in 11/39 with safety data, including two fatal pneumonias. These selected, heterogeneous, frequently
          combination-treated reports do not establish randomized comparative efficacy or routine safety.'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
