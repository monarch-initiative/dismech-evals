      assertion:
        name: Integrated clinical and immunopathological diagnosis
        description: Clinical morphology alone is insufficient. Histology, perilesional DIF and COL7-specific
          or antigen-localization tests are combined according to availability. The 2018 international
          consensus established nine criteria but no single worldwide procedure; its stated limitation
          was not addressing bullous systemic lupus erythematosus.
      selected_evidence:
        snippet: This included nine diagnostic criteria, which are summarized in a flow chart. The IBDG
          was unable to determine one procedure that would be applicable worldwide. A limitation of the
          study is that differential diagnosis of bullous systemic lupus erythematosus has not been addressed.
        supports: SUPPORT
        directness: DIRECT
