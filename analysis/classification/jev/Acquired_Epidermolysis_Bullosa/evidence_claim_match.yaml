      assertion_type: Diagnosis
      assertion:
        name: Anti-type-VII-collagen serology
        description: COL7 ELISA or immunoblot supports diagnosis in context. In one 14-patient NC1+NC2
          ELISA study, 12/14 EBA samples were positive (86% sensitivity); two bullous-pemphigoid controls
          were positive among 143 controls (98.6% specificity). Titres correlated with activity in this
          small sample, but larger validation was requested. Negative serum testing does not exclude EBA,
          and IgG-only assays can miss IgA-only disease.
      selected_evidence:
        snippet: 12 out of the 14 samples were positive in ELISA
        supports: SUPPORT
