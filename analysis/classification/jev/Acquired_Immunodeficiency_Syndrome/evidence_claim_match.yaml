        loinc_term:
          id: LOINC:104781-0
          label: HIV 1 RNA [#/volume] in Serum or Plasma by Molecular genetics method
        notes: 'A Monarch KG search found no method-less quantitative HIV-1 RNA code for serum or plasma,
          and no LOINC Part for HIV-1 RNA, so loinc_term binds the quantitative code whose method is the
          generic molecular genetics method rather than one of the specific amplification or probe methods.
          No virological-suppression or failure band is recorded: the 2024 IAS-USA recommendations (PMID:39616604)
          state no numeric viral-load threshold in their PubMed abstract, and PubMed searches for IAS-USA
          recommendations, WHO viral-load thresholds and virological-failure definitions found no guideline
          statement of a cut-off that could be quoted.'
        presence: Variable
        context: Plasma HIV RNA monitors viral replication and treatment response; values can become suppressed
          with effective ART.
        readouts:
        - target: Persistent HIV Infection and Replication
          relationship: PHARMACODYNAMIC_MARKER_OF
          direction: POSITIVE
          endpoint_context: PHARMACODYNAMIC
          interpretation: Falling HIV RNA indicates pharmacodynamic suppression of viral replication by
            ART.
      selected_evidence:
        snippet: The main outcomes were mortality, virological effectiveness (percentage of patients with
          viral load of ≤50 copies/mL) and immune restoration (percentage of patients with CD4+ T cell
          count above 350 cells/mm3).
        supports: SUPPORT
