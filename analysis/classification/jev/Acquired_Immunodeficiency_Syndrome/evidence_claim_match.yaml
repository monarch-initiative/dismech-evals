      assertion:
        name: CD4 T-Cell Count
        biomarker_term:
          preferred_term: CD4 Expressing T Cell Count
          term:
            id: NCIT:C74608
            label: CD4 Expressing T Cell Count
        presence: Decreased
        context: Absolute count and percentage are U.S. CDC surveillance-stage measures with age-specific
          thresholds. The count takes precedence, and percentage is used only when the count is missing.
          Stage 0 and a qualifying opportunistic illness can take precedence over the CD4 table. Values
          can rise after ART and must be interpreted with clinical history.
        readouts:
        - target: Severe Cell-Mediated Immunodeficiency
          relationship: READOUT_OF
          direction: THRESHOLD_DEPENDENT
          endpoint_context: DIAGNOSTIC
          interpretation: For a person aged 6 years or older who does not meet stage-0 criteria, a CD4
            count below 200 cells per microliter indicates U.S. CDC surveillance stage 3; a CD4 percentage
            below 14 percent is used only when the count is missing. Children younger than 6 years have
            age-specific stage-3 cutoffs.
      selected_evidence:
        snippet: The Centers for Disease Control and Prevention (CDC) has revised the classification system
          for HIV infection to emphasize the clinical importance of the CD4+ T-lymphocyte count in the
          categorization of HIV-related clinical conditions.
        supports: SUPPORT
