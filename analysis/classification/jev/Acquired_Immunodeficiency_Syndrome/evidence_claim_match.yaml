              label: AIDS
        context: []
      assertion_type: Diagnosis
      assertion:
        name: U.S. CDC CD4 Surveillance-Stage Classification
        description: After HIV confirmation, apply the age-specific U.S. CDC surveillance table. Absolute
          CD4 count takes precedence; use percentage only if the count is missing, and apply stage-0 precedence
          before later-stage criteria.
        diagnosis_term:
          preferred_term: diagnostic procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        results: At age 6 years or older, count below 200 cells per microliter indicates stage 3 when
          stage-0 criteria do not apply; percentage below 14 percent is used only when count is missing.
          Children younger than 6 years have higher age-specific stage-3 cutoffs.
        measurements:
        - preferred_term: absolute CD4 T-lymphocyte count
          term:
            id: LOINC:24467-3
            label: CD3+CD4+ (T4 helper) cells [#/volume] in Blood
        reference_ranges:
        - loinc_term:
            id: LOINC:24467-3
            label: CD3+CD4+ (T4 helper) cells [#/volume] in Blood
          unit: cells/uL
          population: U.S. CDC 2014 HIV surveillance case definition, persons with confirmed HIV infection
            aged under 1 year
          notes: 'Count columns of the CDC staging table for children younger than 1 year: stage 1 at
            or above 1,500 cells/uL, stage 2 from 750 to 1,499, stage 3 below 750. The table gives whole-number
            count ranges, so the half-open bands reproduce it exactly. These are surveillance-stage bands:
            stage-0 criteria take precedence over every CD4 result, a stage-3-defining opportunistic illness
            sets stage 3 regardless of the count, and the CD4 percentage columns apply only when the count
            is missing (those rules are on this row''s evidence). The case definition states it is not
            a basis for clinical decisions for individual patients.'
          interpretation_bands:
          - name: Stage 1
            lower_bound: 1500
            unit: cells/uL
            abnormal_flag: NORMAL
          - name: Stage 2
            lower_bound: 750
            upper_bound: 1500
            unit: cells/uL
            abnormal_flag: LOW
          - name: Stage 3 (AIDS)
