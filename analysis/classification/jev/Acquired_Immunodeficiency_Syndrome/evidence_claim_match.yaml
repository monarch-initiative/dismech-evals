        context: []
      assertion_type: Definition
      assertion:
        name: CDC HIV stage-3 surveillance case definition
        definition_type: CASE_DEFINITION
        scope: United States public-health surveillance in people with confirmed HIV infection
        description: In the U.S. CDC framework, AIDS is HIV infection classified as stage 3. The surveillance
          framework uses severe CD4 depletion and AIDS-defining clinical conditions; it is intended for
          population surveillance and is not, by itself, a clinical decision rule for an individual patient.
      selected_evidence:
        snippet: A confirmed case can be classified in one of five HIV infection stages (0, 1, 2, 3, or
          unknown); early infection, recognized by a negative HIV test within 6 months of HIV diagnosis,
          is classified as stage 0, and acquired immunodeficiency syndrome (AIDS) is classified as stage
          3.
        supports: SUPPORT
    origin:
