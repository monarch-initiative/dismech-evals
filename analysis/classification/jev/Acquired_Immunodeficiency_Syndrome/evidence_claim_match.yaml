  96d082a7123dfb7a5146ec0da85666f6707308e68736b007e104795b59318da7:
    claim:
      about:
        disease:
          name: Acquired Immunodeficiency Syndrome
          disease_term:
            preferred_term: AIDS
            term:
              id: MONDO:0012268
              label: AIDS
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Confirm HIV Infection and Differentiate HIV-1 from HIV-2
        description: AIDS classification first requires established HIV infection. Contemporary multitest
          algorithms include differentiation of HIV-1 and HIV-2. In the U.S. laboratory testing algorithm,
          specimens are screened with an HIV-1/2 antigen/antibody (fourth-generation) immunoassay; a reactive
          screen reflexes to an HIV-1/HIV-2 antibody differentiation immunoassay, and a negative or indeterminate
          differentiation result is resolved with an HIV-1 nucleic acid amplification test, the step that
          identifies acute HIV-1 infection.
        diagnosis_term:
          preferred_term: diagnostic procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        results: Laboratory evidence confirms HIV infection and, where possible, distinguishes HIV-1 from
          HIV-2.
        measurements:
        - preferred_term: HIV-1/2 antigen/antibody immunoassay (fourth generation)
          term:
            id: LOINC:105080-6
            label: HIV 1+2 Ab+HIV1 p24 Ag [Presence] in Serum or Plasma
        - preferred_term: HIV-1 antibody (differentiation assay)
          term:
            id: LOINC:7917-8
            label: HIV 1 Ab [Presence] in Serum
        - preferred_term: HIV-2 antibody (differentiation assay)
          term:
            id: LOINC:7919-4
            label: HIV 2 Ab [Presence] in Serum
        - preferred_term: HIV-1 RNA
          term:
            id: LOINC:104781-0
            label: HIV 1 RNA [#/volume] in Serum or Plasma by Molecular genetics method
        notes: 'The screen binds the method-less fourth-generation code rather than its immunoassay-specific
          sibling. The differentiation assay reports HIV-1 and HIV-2 antibody separately, so it is recorded
          as two method-less presence measurements rather than as the method-specific identifier code.
          A Monarch KG search found no method-less HIV-1 RNA code for serum or plasma and no LOINC Part
          for it, so the RNA step binds the quantitative code whose method is the generic molecular genetics
          method; the algorithm''s third step is often a qualitative NAAT. No band is recorded on this
          row: the algorithm''s steps are qualitative.'
      selected_evidence:
        snippet: Guidelines recommend an HIV-1/2 antigen/antibody (Ag/Ab) immunoassay screen that reflexes
          reactive samples to an HIV-1/2 antibody differentiation immunoassay for confirmation. If negative
          or indeterminate antibody differentiation results are observed, an HIV nucleic acid amplification
          test (NAAT) is used to determine HIV status.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42054824
      reference_title: Evaluation of a modified 2-step diagnostic algorithm for human immunodeficiency
        virus type 1 utilizing an HIV-1/2 antigen/antibody immunoassay screen and an HIV nucleic acid
        amplification test.
      evidence_source: OTHER
      quote_role: BACKGROUND
      explanation: States the three-step laboratory testing algorithm (antigen/antibody screen, antibody
        differentiation, NAAT) that the row's measurements encode; the sentence restates guideline recommendations
        in the introduction of a laboratory comparison study.
