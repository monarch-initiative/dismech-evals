    claim:
      about:
        disease:
          name: Acquired Immunodeficiency Syndrome
          disease_term:
            preferred_term: AIDS
            term:
              id: MONDO:0012268
              label: AIDS
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: HIV Infection Without AIDS
        description: Confirmed HIV infection is broader than AIDS. In U.S. CDC surveillance, early infection
          can be stage 0, other cases can be stage 1, 2, or unknown, and AIDS is stage 3.
        distinguishing_features:
        - Confirmed HIV infection alone does not establish AIDS.
        - Apply the surveillance framework's stage rules rather than inferring AIDS from HIV positivity
          alone.
