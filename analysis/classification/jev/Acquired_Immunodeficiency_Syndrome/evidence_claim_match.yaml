      assertion:
        name: Persistent HIV Infection and Replication
        description: HIV establishes ongoing infection in susceptible immune cells. Viral replication
          drives pathogenesis, while the resulting immunodeficiency reflects both direct viral effects
          and dysregulated host immune homeostasis.
        cell_types:
        - preferred_term: CD4-positive, alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: viral process
          modifier: ABNORMAL
          term:
            id: GO:0016032
            label: viral process
      selected_evidence:
        snippet: Thus, the onset of overt immune deficiency appears to be intimately linked with CD4(+)
          memory T-cell dynamics and reflects the complex interplay of direct viral cytopathogenicity
          and the indirect effects of persistent immune activation on CD4(+) memory T-cell proliferation,
          differentiation, and survival.
        supports: SUPPORT
