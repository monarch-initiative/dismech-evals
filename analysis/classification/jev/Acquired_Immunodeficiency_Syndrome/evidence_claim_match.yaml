          HIV infection with a CD4 T-cell count below 200 cells per microliter or a CD4 percentage below
          14 percent.
      selected_evidence:
        snippet: Consistent with the 1993 revised classification system, CDC has also expanded the AIDS
          surveillance case definition to include all HIV-infected persons who have less than 200 CD4+
          T-lymphocytes/microL, or a CD4+ T-lymphocyte percentage of total lymphocytes of less than 14.
        supports: SUPPORT
