          value:
            name: Alternative Complement Pathway Dysregulation
            description: Acquired partial lipodystrophy is strongly associated with alternative complement
              pathway dysregulation. C3NeF specifically stabilizes the C3 convertase; other reported complement
              autoantibodies have variable or incompletely defined functional effects. Persistent activation
              consumes C3 and produces the characteristic low-serum-C3 state.
            biological_processes:
            - preferred_term: complement activation, alternative pathway
              modifier: INCREASED
              term:
                id: GO:0006957
                label: complement activation, alternative pathway
            - preferred_term: complement activation
              modifier: DYSREGULATED
              term:
                id: GO:0006956
                label: complement activation
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Adipose Complement-Directed Injury
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Persistent complement dysregulation is consistent with local complement activation
          in affected adipose tissue, but the human evidence comes from one biopsy and does not establish
          a universal causal pathway.
      selected_evidence:
        snippet: Simultaneous detection of IgG, C3, C5a and C5b-9 proved the ongoing complement activity
          and complement-directed injury within the adipose tissue.
        supports: SUPPORT
