        rationale: NeF sera can lyse rat adipocytes and complement is present in one affected human biopsy,
          but C3NeF is also common in immune glomerulonephritis without lipodystrophy. No current evidence
          explains anatomical selectivity or why most complement-dysregulated patients retain adipose
          tissue.
