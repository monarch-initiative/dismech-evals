        discussion_id: gap_apl_hla_lmnb2_susceptibility
        prompt: Are HLA-DRB1*11:03 enrichment and rare LMNB2 variation reproducible susceptibility signals,
          and does either connect mechanistically to complement dysregulation or adipose injury?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Alternative Complement Pathway Dysregulation
        - phenotypes#Progressive Upper-Body Lipoatrophy
        rationale: Small cohorts report HLA enrichment and a single LMNB2 variant, but neither establishes
          a causal gene-disease relationship. The largest cohort found no family history, supporting an
          acquired, non-Mendelian model. These signals remain hypotheses rather than structured causal
          genes.
      selected_evidence:
        snippet: Furthermore, none of our patients had a family history of APL, so our data strongly speak
          against monogenic inheritance among patients with APL.
        supports: SUPPORT
