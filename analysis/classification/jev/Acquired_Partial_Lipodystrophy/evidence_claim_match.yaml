          complications despite standard therapy. In the EU, Myalepta is authorized for confirmed partial
          lipodystrophy, including Barraquer-Simons syndrome, from age 12 after standard treatments fail.
          The current US label is limited to generalized lipodystrophy and states that safety and effectiveness
          in partial lipodystrophy are not established. APL-specific efficacy remains uncertain because
          published cohorts combine partial-lipodystrophy subtypes; treatment does not restore fat distribution.
