        context: []
      assertion_type: Treatment
      assertion:
        name: Lifestyle and complication-directed metabolic therapy
        action_category: THERAPEUTIC
        description: Balanced energy-appropriate nutrition and regular physical activity are the foundation
          of care. Treat detected dysglycemia with standard agents such as metformin or insulin and dyslipidemia
          with statins, fibrates, or omega-3 therapy as clinically indicated. In selected patients, off-label
          thiazolidinedione therapy may improve metabolic complications, but evidence is for partial lipodystrophy
          broadly rather than classic APL and regional fat excess can increase. This manages complications
          but does not regrow lost adipose tissue or arrest the complement process.
        treatment_term:
          preferred_term: therapeutic procedure
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
        target_phenotypes:
        - preferred_term: Abnormal glucose homeostasis
          term:
            id: HP:0011014
            label: Abnormal glucose homeostasis
        - preferred_term: Hypertriglyceridemia
          term:
            id: HP:0002155
            label: Hypertriglyceridemia
        - preferred_term: Hepatic steatosis
          term:
            id: HP:0001397
            label: Hepatic steatosis
      selected_evidence:
        snippet: Diet is essential for the management of metabolic complications of lipodystrophy. Metreleptin
          therapy is effective for metabolic complications in hypoleptinemic patients with generalized
          lipodystrophy and selected patients with partial lipodystrophy. Other treatments not specific
          for lipodystrophy may be helpful as well (eg, metformin for diabetes, and statins or fibrates
          for hyperlipidemia).
        supports: SUPPORT
