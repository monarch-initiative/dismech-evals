        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ittp_second_hit_and_organ_tropism
        prompt: Why do some people with severe ADAMTS13 deficiency remain clinically well while others
          develop an acute episode with a particular pattern of organ injury?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Severe ADAMTS13 Activity Deficiency
        - pathophysiology#Disseminated Platelet-VWF Microthrombosis
        rationale: Severe deficiency is necessary for TTP but does not by itself explain the timing of
          attacks, infection and pregnancy triggers, or variable cerebral, cardiac, and renal involvement.
          Endothelial activation, VWF release, inflammation, and vascular susceptibility are candidate
          additional factors.
      selected_evidence:
        snippet: Triggers of acute episodes were similar for cTTP and iTTP, with pregnancy and infection
          the most commonly observed.
        supports: SUPPORT
