      assertion:
        phase: Clinical remission with residual relapse and survivorship risk
        notes: Platelet recovery and resolution of acute hemolysis define clinical response, but ADAMTS13
          activity may remain suppressed or later fall again. Relapse timing is unpredictable, and survivors
          remain at risk for stroke, cardiovascular disease, cognitive impairment, depression, and reduced
          quality of life.
      selected_evidence:
        snippet: Relapses can occur in up to 50% of patients who survive their initial episode, and the
          timing may be unpredictable, occurring close to achievement of remission or months later.
        supports: SUPPORT
