      assertion_type: Pathophysiology
      assertion:
        name: Severe ADAMTS13 Activity Deficiency
        description: Functional ADAMTS13 activity below 10% is the defining biochemical lesion of TTP
          in the appropriate thrombotic-microangiopathy context. Severe deficiency can persist during
