          Allelic KIF7 disease spans the more severe hydrolethalus syndrome 2 and Joubert-spectrum presentations.
          Rare de novo GLI3-related acrocallosal phenocopies are handled as a differential, not as a second
          causal gene in this KIF7-scoped entry.
