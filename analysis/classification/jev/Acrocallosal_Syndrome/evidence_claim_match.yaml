        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Neurodevelopmental course
        age_range: Childhood to adulthood
        notes: Developmental impairment is usually substantial but varies across the KIF7-associated spectrum.
          Long-term observations include persistent craniofacial dysmorphism and severe intellectual disability
          in many KIF7-positive individuals, while milder adult cognitive outcomes have been reported
          for some alleles.
      selected_evidence:
        snippet: However, long-term follow-up revealed that patients with pathogenic KIF7 variants had
          more severe and persistent facial dysmorphism and in general more severe ID, while in patients
          with (likely) pathogenic C5orf42 variants, facial dysmorphism became less prominent over time
          and they could catch up and reach a level of mild to moderate ID despite initial severe DD.
        supports: SUPPORT
    origin:
      assertion_path: /progression/1
      evidence_path: /progression/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29321670
      reference_title: Clinical and experimental evidence suggest a link between KIF7 and C5orf42-related
        ciliopathies through Sonic Hedgehog signaling.
      evidence_source: HUMAN_CLINICAL
      explanation: Long-term comparative follow-up documents persistence and variability in the KIF7-associated
        neurodevelopmental course.
