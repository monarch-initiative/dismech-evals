          splice-disrupting alleles are well established; biallelic missense substitutions have also been
          reported with broader, sometimes atypical phenotypes, so the allelic spectrum should not be
          described as exclusively loss of function.
      selected_evidence:
        snippet: We describe the first four compound heterozygous cases
        supports: SUPPORT
