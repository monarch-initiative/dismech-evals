        context: []
      assertion_type: Pathophysiology
      assertion:
        name: KIF7 Cilium-Tip Dysfunction and Impaired Hedgehog Signal Transduction
        conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
        description: KIF7, the human ortholog of Drosophila Costal2, is an immotile kinesin-4 protein
          that localizes to the tip of the primary cilium, where it organizes the cilium-tip compartment
          and regulates the GLI transcription factors of the Hedgehog pathway. In the absence of Hedgehog
          ligand KIF7 promotes processing of GLI3 into its transcriptional repressor form; upon pathway
          activation KIF7 and GLI accumulate at the cilium tip. Pathogenic KIF7 dysfunction deregulates
          GLI target genes and impairs GLI3 processing, disrupting the tightly dosed Hedgehog output required
          for midline brain, limb, and craniofacial patterning.
        genes:
        - preferred_term: KIF7
          term:
            id: hgnc:30497
            label: KIF7
        biological_processes:
        - preferred_term: Smoothened (Hedgehog) Signaling
          term:
            id: GO:0007224
            label: smoothened signaling pathway
          modifier: DYSREGULATED
        - preferred_term: Regulation of Hedgehog Signaling
          term:
            id: GO:0008589
            label: regulation of smoothened signaling pathway
          modifier: DYSREGULATED
        cellular_components:
        - preferred_term: Ciliary Tip
          term:
            id: GO:0097542
            label: ciliary tip
        - preferred_term: Primary Cilium
          term:
            id: GO:0005929
            label: cilium
        cell_types:
        - preferred_term: Ciliated Cell
          term:
            id: CL:0000064
            label: ciliated cell
      selected_evidence:
        snippet: we show deregulation of most GLI transcription factor targets and impaired GLI3 processing
          in tissues from individuals with KIF7 mutations
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21552264
      reference_title: KIF7 mutations cause fetal hydrolethalus and acrocallosal syndromes.
