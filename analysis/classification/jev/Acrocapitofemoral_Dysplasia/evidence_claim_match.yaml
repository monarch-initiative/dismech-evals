          the plates fuse. In all eight patients tabulated in 2025, longitudinal growth of the tubular
          bones of the hands and the long bones of the limbs was permanently reduced. Growth of the proximal
          femur is most visibly affected: the capital epiphysis is egg-shaped and the femoral neck is
          very short.'
