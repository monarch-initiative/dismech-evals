  d063bfcb4e57f02298943a822447f51d01929f63464ce6afe5e6aa1542905730:
    claim:
      about:
        disease:
          name: Acrocapitofemoral Dysplasia
          disease_term:
            preferred_term: Acrocapitofemoral Dysplasia
            term:
              id: MONDO:0011907
              label: acrocapitofemoral dysplasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: acfd_missense_vs_null_models
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced IHH Signaling Output
        - pathophysiology#Biallelic IHH Signaling-Domain Missense Variants
        prompt: Do the ACFD missense alleles reduce IHH signaling, by how much, and through which step
          (protein stability, secretion, Patched binding or signaling range), given that every mechanistic
          model of the disease is a complete or conditional Ihh deletion?
        rationale: All four ACFD alleles are homozygous missense changes. The only direct evidence about
          what they do is an in silico prediction for p.Ala173Asp. The mouse growth plate data come from
          Ihh-null or conditionally deleted animals. Those models recapitulate early growth plate closure
          and dwarfism, but they cannot say whether ACFD alleles are hypomorphs, unstable proteins or
          receptor-binding mutants. They also cannot explain why the phenotype is restricted to the skeleton
          when a null allele disrupts many Hedgehog-dependent tissues. The 2003 report placed the ACFD
          residues outside the BDA1 cluster, which suggests a different molecular defect from the dominant
          alleles. BDA1 alleles have been assayed for Patched binding and stability; ACFD alleles have
          not.
        proposed_experiments:
        - experiment_id: exp_acfd_allele_signaling_assays
          name: Cell-based signaling and stability assays of the four ACFD IHH alleles
          description: Express wild-type and P46L, R160C, A173D and V190A IHH-N in a Hedgehog reporter
            system (for example Gli-luciferase in responsive fibroblasts, or chondrogenic differentiation
            of a mesenchymal line). Measure secretion, processing, Patched1 binding and pathway activation
            side by side with a BDA1 allele.
          would_support:
          - pathophysiology#Reduced IHH Signaling Output
          supporting_outcome:
          - Reduced, but not absent, pathway activation for all four alleles would support a hypomorphic
            mechanism consistent with a recessive, skeleton-restricted phenotype.
          would_refute:
          - pathophysiology#Reduced IHH Signaling Output
          refuting_outcome:
          - Normal signaling in reporter assays would indicate that the alleles act through a step the
            assay does not capture, such as long-range transport in cartilage matrix.
      selected_evidence:
        snippet: In silico modeling and dynamic simulation analysis revealed that the variant disturbed
          the core structure of the domain and destabilized the loop region and the region surrounding
          the variant.
        supports: SUPPORT
