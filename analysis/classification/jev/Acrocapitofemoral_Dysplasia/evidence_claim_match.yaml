              label: acrocapitofemoral dysplasia
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No population estimate exists. Four molecularly confirmed families have been published:
          Belgian and Dutch families in 2003, a Turkish sibship in 2021 and a Pakistani sibship in 2025.
          The published patient counts do not agree with each other. The 2003 molecular report describes
          two patients in family 1 and three in family 2, while the 2021 and 2025 reports count four children
          from the first two families. A 2025 report of a Syrian child homozygous for an IHH variant,
          with a second homozygous variant in a short-rib thoracic dysplasia gene, a heterozygous COL11A1
          variant and a blended phenotype that includes cardiac anomalies (PMID:40771183), is not counted
          here as a typical case.'
      selected_evidence:
        snippet: To date, only four child patients from two families have been reported.
        supports: SUPPORT
    origin:
