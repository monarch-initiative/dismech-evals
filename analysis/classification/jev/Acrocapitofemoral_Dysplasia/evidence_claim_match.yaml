        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - inheritance#Autosomal Recessive
        prompt: Do heterozygous carriers of ACFD alleles have short stature or subtle hand changes?
        rationale: Heterozygous IHH variants cause dominant short stature with nonspecific skeletal changes,
          and in the Pakistani ACFD family both carrier parents had short stature (-3.0 and -3.6 SD) with
          normal hands. Carrier heights in the other three families are not reported in the available
          abstracts. If ACFD alleles have a heterozygous effect, the disorder would sit on a dosage continuum
          with IHH-related short stature, rather than being strictly recessive.
      selected_evidence:
        snippet: The height of the father (53 years old) and the mother (45 years old) was short, with
          155 cm (-3.0SD) and 140.2 cm (-3.6 SD), respectively, but their hands were normal, with normal
          fingers.
        supports: SUPPORT
