            term:
              id: MONDO:0011907
              label: acrocapitofemoral dysplasia
        context: []
      assertion_type: Genetic
      assertion:
        name: IHH
        gene_term:
          preferred_term: IHH
          term:
            id: hgnc:5956
            label: IHH
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Four homozygous missense variants are known, one per family: c.137C>T p.(Pro46Leu),
          c.569T>C p.(Val190Ala), c.478C>T p.(Arg160Cys) and c.518C>A p.(Ala173Asp). All lie in the amino-terminal
          signaling fragment (IHH-N), away from the central cluster of residues (codons 95-154) that carries
          the dominant brachydactyly type A1 variants. The 2025 report describes the ACFD variants as
          lying in "amino acids 201-308"; that range does not fit its own list of variant positions (46-190)
          and is not used here.'
        variants:
        - name: IHH c.137C>T p.(Pro46Leu)
          description: Homozygous in the two affected members of family 1 (2003).
        - name: IHH c.569T>C p.(Val190Ala)
          description: Homozygous in the three affected members of family 2 (2003).
        - name: IHH c.478C>T p.(Arg160Cys)
          description: Homozygous in two adult siblings from a Turkish family (2021).
        - name: IHH c.518C>A p.(Ala173Asp)
          description: Homozygous in two siblings from a Pakistani family (2025). Classified likely pathogenic
            by the reporting authors under ACMG criteria. In silico modeling places Ala173 in the core
            of the domain.
      selected_evidence:
        snippet: Using a candidate-gene approach, we identified two missense mutations in the amino-terminal
          signaling domain of the gene encoding Indian hedgehog (IHH).
        supports: SUPPORT
