            term:
              id: MONDO:0011907
              label: acrocapitofemoral dysplasia
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Every reported patient is homozygous for an IHH missense variant, and every family
          is consanguineous or from a founder population. Parents who were tested are heterozygous carriers
          with normal hands. In the Pakistani family both carrier parents had short stature (-3.0 and
          -3.6 SD). Heterozygous IHH variants cause brachydactyly type A1 or dominant short stature, so
          a mild carrier phenotype is plausible, but it has not been studied systematically (see discussions).
      selected_evidence:
        snippet: Both affected individuals of family 1 are homozygous for a 137C-->T transition (P46L),
          and the three patients in family 2 are homozygous for a 569T-->C transition (V190A).
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
