  41a4852b8110f6d0f3537c1db2a60504d8ac4e390f5f5f8f8f803a1fb2cb1108:
    claim:
      about:
        disease:
          name: Acrodermatitis Enteropathica
          disease_term:
            preferred_term: acrodermatitis enteropathica
            term:
              id: MONDO:0008713
              label: acrodermatitis enteropathica
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Zinc, alkaline phosphatase, and SLC39A4 sequencing
        description: Assess the clinical pattern, plasma or serum zinc, and supportive alkaline phosphatase,
          then evaluate SLC39A4 coding exons and splice boundaries with parental segregation when variants
          are identified. A response to zinc demonstrates zinc responsiveness but does not distinguish
          inherited from acquired deficiency. Persistent dependence on zinc and relapse after withdrawal
          can prompt molecular investigation. An unresolved result may require evaluation for structural
          or regulatory alleles rather than assuming a coding-only assay excludes the disease.
      selected_evidence:
        snippet: Since most SLC39A4 mutations are private and occur in different types and over the entire
          gene, direct sequencing of all coding exons and flanking intronic sequences is the molecular
