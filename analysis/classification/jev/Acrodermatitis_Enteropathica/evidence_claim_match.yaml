        context: []
      assertion_type: Treatment
      assertion:
        name: Clioquinol with zinc supplementation
        description: In the conditional intestinal Zip4 knockout, combined dietary clioquinol and zinc
          rescued many animals even when supplementation began after severe depletion, whereas either
          treatment alone was ineffective under those delayed-treatment conditions. This is preclinical
          rescue evidence, not an established human regimen.
        therapeutic_modality: SMALL_MOLECULE
        context: Preclinical intestinal Zip4 knockout mouse; clinical efficacy and an acceptable human
          risk-benefit profile are not established by this study.
        treatment_term:
          preferred_term: clioquinol plus zinc supplementation
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: clioquinol
            term:
              id: CHEBI:74460
              label: 5-chloro-7-iodoquinolin-8-ol
          - preferred_term: zinc sulfate
            term:
              id: CHEBI:35176
              label: zinc sulfate
        notes: The report describes incomplete rescue and apparent blindness in some nonthriving treated
          knockout mice. Historical use of related hydroxyquinolines and neurotoxicity concerns do not
          establish present clinical safety; the authors could not separate every contribution of severe
          zinc deficiency and drug exposure.
      selected_evidence:
        snippet: Dietary CQ with zinc supplementation rapidly restored intestine stem cell division and
          differentiation of secretory and the absorptive cells.
        supports: SUPPORT
