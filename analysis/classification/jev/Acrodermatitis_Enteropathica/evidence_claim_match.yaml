            term:
              id: CHEBI:35176
              label: zinc sulfate
          - preferred_term: zinc gluconate
            term:
              id: CHEBI:29708
              label: Zinc gluconate
        notes: The intervention is therapeutic mineral replacement for inherited malabsorption, bound
          to Pharmacotherapy with specific zinc agents. A nutritional-supplement product term would not
          describe the clinical action. The mechanism permitting high-dose uptake without ZIP4 is incompletely
          defined.
      selected_evidence:
        snippet: Thirty out of 32 (93.8%) patients with SLC39A4 gene mutations received zinc supplementation,
