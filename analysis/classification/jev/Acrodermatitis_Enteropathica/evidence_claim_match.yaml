    claim:
      about:
        disease:
          name: Acrodermatitis Enteropathica
          disease_term:
            preferred_term: acrodermatitis enteropathica
            term:
              id: MONDO:0008713
              label: acrodermatitis enteropathica
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Intestine-specific Zip4 knockout mouse
        species: Mouse
        genotype: villin-ErtCre; Slc39a4 (Zip4) floxed, tamoxifen-induced enterocyte knockout
        publication: PMID:22737083
        description: Tamoxifen-inducible villin-CreERT2 intestinal Slc39a4 deletion models zinc depletion,
          wasting, and epithelial injury. It does not reproduce severe human dermatitis or alopecia.
        modeled_mechanisms:
        - target: Systemic Zinc Deficiency
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Intestinal ZIP4 loss rapidly depletes tissue zinc and causes wasting and death
            unless excess dietary zinc is supplied.
          limitations: Acute intestinal deletion in mice differs from germline human alleles. The model
            lacks severe dermatitis and alopecia; human survival is not evidence that every human allele
            is hypomorphic.
          readouts:
          - name: Total tissue zinc
            target: Systemic Zinc Deficiency
            direction: DECREASED
            interpretation: Elemental analysis shows rapid zinc depletion in intestine, liver, and pancreas.
        - target: Intestinal Epithelial Dysfunction
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Intestinal knockout causes crypt and villus disorganization; Paneth-cell changes,
            altered proliferation, and compartment-specific signaling are separately represented in the
            pathograph.
          limitations: Acute intestinal deletion in mice differs from germline human alleles. The model
            lacks severe dermatitis and alopecia; human survival is not evidence that every human allele
            is hypomorphic.
        - target: Paneth Cell Reprogramming
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Intestinal Zip4 deletion reprograms Paneth cells in the crypt stem-cell niche.
          limitations: Acute intestine-specific deletion in mice does not establish the timing or extent
            of Paneth-cell changes in patients with germline SLC39A4 variants.
          readouts:
          - name: Paneth cell reprogramming
            target: Paneth Cell Reprogramming
            direction: ALTERED
            interpretation: Loss of Paneth cell labile zinc with downstream stem-niche disruption.
        notes: The 2012 paper proposes species differences in embryonic nutrient uptake as an explanation
          for global mouse knockout lethality. It also reports both hypomorphic and complete loss-of-function
          human alleles; residual function must not be assumed for all patients. Hepatic metal concentrations
          and AMPK/TORC1 signaling change with time and should not be treated as established human biomarkers.
      selected_evidence:
        snippet: A significant difference between this mouse model and human AE is the lack of severe
          dermatitis and alopecia in mice.
        supports: SUPPORT
    origin:
