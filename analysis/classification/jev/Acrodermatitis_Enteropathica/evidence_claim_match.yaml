          disease_term:
            preferred_term: acrodermatitis enteropathica
            term:
              id: MONDO:0008713
              label: acrodermatitis enteropathica
        context: []
      assertion_type: Treatment
      assertion:
        name: Zinc Supplementation
        description: Sustained oral zinc replacement is the central treatment. The 2025 literature review
          separately reports improvement in 29 of 30 supplemented patients with SLC39A4 mutations, including
          one nonresponder who died. Among those treated, 12 received 1-3 mg/kg/day and six received more
          than 3 mg/kg/day; the remaining doses were not weight-adjusted or not recorded. These heterogeneous
          case reports do not establish an optimal dose. Zinc and copper monitoring accompany long-term
          replacement.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: oral zinc replacement
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: zinc sulfate
            term:
              id: CHEBI:35176
              label: zinc sulfate
          - preferred_term: zinc gluconate
            term:
              id: CHEBI:29708
              label: Zinc gluconate
        notes: The intervention is therapeutic mineral replacement for inherited malabsorption, bound
          to Pharmacotherapy with specific zinc agents. A nutritional-supplement product term would not
          describe the clinical action. The mechanism permitting high-dose uptake without ZIP4 is incompletely
          defined.
      selected_evidence:
        snippet: the copper level must be monitored, because zinc supplementation usually reduces copper
          absorption
        supports: SUPPORT
