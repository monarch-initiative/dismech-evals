              label: acrofacial dysostosis Cincinnati type
        context: []
      assertion_type: Genetic
      assertion:
        name: POLR1A
        notes: Heterozygous missense, truncating and in-frame variants are associated with a variable
          phenotype. De novo and inherited alleles are documented, including transmission from mildly
          affected or apparently unaffected parents. The 2023 cohort includes uncertain variants and relatives;
          it does not establish that every rare POLR1A variant is causal. Eight newly evaluated variants
          had increased, decreased or unchanged rRNA transcription in engineered HCT116 cells. p.Glu593Gln
          has a dominant-negative effect in an overexpression assay, but this does not generalize to all
          alleles. p.Pro1638Leu had no detectable transcription phenotype and corresponding mice were
          normal, leaving its clinical contribution uncertain. The p.Met496Ile cell assay showed a mild
          increase, whereas the 2025 structural analysis proposed impaired interactions computationally;
          the latter is not a measured decrease in transcription.
        gene_term:
          preferred_term: POLR1A
          term:
            id: hgnc:17264
            label: POLR1A
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Each individual has a heterozygous mutation in POLR1A, which encodes a core component
          of RNA polymerase 1.
        supports: SUPPORT
        directness: DIRECT
