      assertion_type: Discussion
      assertion:
        discussion_id: polr1a_later_development
        prompt: Does later Polr1a loss cause a distinct developmental defect?
        notes: Temporal ubiquitous knockout supports a later requirement for skeletal development, but
          its cell-state proportions and morphology do not discriminate fate selection from altered survival
          or proliferation. Separate NHP2 and TSR3 perturbations in engineered iPSCs and mice are not
          proven mediators of human POLR1A disease. The 2026 correction concerned author names and did
          not alter experimental results.
      selected_evidence:
        snippet: mutant embryos exhibited reduced SOX9 signal in the mandible, consistent with diminished
          cartilage development.
        supports: SUPPORT
        directness: DIRECT
