              produces nonfunctional DNA-binding-domain protein; the paper abbreviates this as tp53 knockout,
              but it is not a genomic deletion. Early apoptosis and morphology improve, while later cartilage
              development and survival remain abnormal. Some double mutants survive to eight rather than
              five days. This dose and developmental timing differ from heterozygous human disease.
            publication: PMID:29750247
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced Pol I rRNA Transcription
        relationship: MEASURES
        fidelity: MODERATE
        description: Precursor-rRNA spacer abundance falls in the mutant and is not restored by tp53 inhibition.
        limitations: RT-qPCR is a transcription proxy. Mature 18S RNA is unchanged at 24 hours but decreases
          at 48 hours; residual rRNA remains.
        readouts:
        - name: Precursor-rRNA or nascent nucleolar RNA signal
          target: Reduced Pol I rRNA Transcription
          direction: DECREASED
          interpretation: Precursor-rRNA spacer abundance falls in the mutant and is not restored by tp53
            inhibition.
      selected_evidence:
        snippet: polr1a-/- mutants exhibit deficient 47S rRNA transcription, reduced monosomes and polysomes
          and, consequently, defects in protein translation
        supports: SUPPORT
        directness: DIRECT
