        name: Abnormal Pol I Condensate Formation
        biological_scale: MOLECULAR
        description: Inducible p.Glu593Gln POLR1A in HeLa cells produces abnormal nucleolar condensates
          containing mutant and wild-type polymerase. Single-molecule tracking supports stable mutant
          association and impaired productive wild-type binding as a dominant-negative model. Expression
          was approximately twice the endogenous level; this is not a measurement in patient neural crest
          cells.
        cellular_components:
        - preferred_term: nucleolus
          term:
            id: GO:0005730
            label: nucleolus
      selected_evidence:
        snippet: Not only the mutant but also the WT Pol I was localized to the condensates (HaloTag-WT
          RPA194; Fig. 4A), suggesting that mutant Pol I compromised the stable Pol I cluster.
        supports: SUPPORT
        directness: DIRECT
