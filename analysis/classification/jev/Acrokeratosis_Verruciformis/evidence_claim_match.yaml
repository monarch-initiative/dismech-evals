        biological_scale: MOLECULAR
        description: The recurrent heterozygous ATP2A2 missense variant p.(Pro602Leu) replaces a proline
          in the ATP-binding domain of SERCA2. Expressed in vitro, the mutant pump has lost its ability
          to transport calcium into the sarco/endoplasmic reticulum. This is the same gene and the same
          functional class of lesion as in Darier disease, which is the basis for regarding the two as
          allelic.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        molecular_functions:
