      assertion_type: Genetic
      assertion:
        name: ATP2A2
        notes: ATP2A2 encodes SERCA2, the sarco/endoplasmic reticulum calcium ATPase isoform 2. Familial
          AKV is associated with one recurrent heterozygous missense variant, p.(Pro602Leu), in the ATP-binding
          domain, and a second missense variant, p.(Ala698Val), has also been described in AKV; neither
          had been reported among Darier disease variants at the time. Some AKV families, notably in China,
          carry no ATP2A2 variant and show no linkage to 12q23-q24, so AKV is genetically heterogeneous
          and the other gene or genes are unknown.
        gene_term:
          preferred_term: ATP2A2
          term:
            id: hgnc:812
            label: ATP2A2
        relationship_type: CAUSATIVE
        variants:
        - name: p.(Pro602Leu)
          description: Recurrent heterozygous missense variant (P602L) in exon 14, in the ATP-binding
            domain of SERCA2, segregating with AKV in several unrelated families; the expressed mutant
            has no calcium transport activity.
        - name: p.(Ala698Val)
          description: Heterozygous missense variant (A698V) previously described in AKV.
      selected_evidence:
        snippet: we studied a family affected with acrokeratosis verruciformis in six generations and
          identified a heterozygous P602L mutation in ATP2A2
        supports: SUPPORT
