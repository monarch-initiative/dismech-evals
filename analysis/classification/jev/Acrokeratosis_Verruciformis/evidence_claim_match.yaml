            preferred_term: ATP2A2
            term:
              id: hgnc:812
              label: ATP2A2
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous p.(Pro602Leu) missense variant; the mutant protein shows no calcium
            transport in a functional assay.
      selected_evidence:
        snippet: we studied a family affected with acrokeratosis verruciformis in six generations and
