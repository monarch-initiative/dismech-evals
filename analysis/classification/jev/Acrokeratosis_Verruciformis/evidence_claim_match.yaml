              label: acrokeratosis verruciformis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disturbed Endoplasmic Reticulum Calcium Homeostasis in Acral Keratinocytes
        biological_scale: CELLULAR
        description: SERCA2 sequesters cytosolic calcium into the endoplasmic reticulum of keratinocytes,
          and this store supports keratinocyte differentiation and, indirectly, intercellular adhesion.
          Loss of pump activity is inferred to disturb that store in the affected acral epidermis. No
          study has measured keratinocyte calcium handling in AKV directly, and why the lesion is confined
          to acral skin, and why it largely spares adhesion here when it does not in Darier disease, is
          unexplained.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: endoplasmic reticulum calcium ion homeostasis
          term:
            id: GO:0032469
            label: endoplasmic reticulum calcium ion homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: it encodes the calcium pump SERCA2, which is present in the membrane of the endo-sarcoplasmic
          reticulum and plays a key role in calcium transport, and indirectly in the intercellular adhesion
          of keratinocytes.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42205461
      reference_title: 'Acrokeratosis verruciformis of Hopf: Genetic, clinicopathologic and therapeutic
