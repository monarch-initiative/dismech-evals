            term:
              id: MONDO:0007048
              label: acrokeratosis verruciformis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: akv_genotype_phenotype_and_second_locus
        prompt: Why does ATP2A2 p.(Pro602Leu) produce an acral keratinization disorder largely without
          acantholysis, when other loss-of-function ATP2A2 variants produce Darier disease, and which
          gene causes AKV in families without an ATP2A2 variant?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#ATP2A2 Pro602Leu Loss of SERCA2 Calcium Transport
        - pathophysiology#Disturbed Endoplasmic Reticulum Calcium Homeostasis in Acral Keratinocytes
        - genetic#ATP2A2
        rationale: The P602L pump has lost calcium transport in vitro, the same functional class as Darier
          alleles, so loss of transport alone does not explain the different phenotype. No study has examined
          calcium handling or desmosome assembly in AKV keratinocytes, and the second AKV locus excluded
          by linkage in Chinese families has not been identified.
      selected_evidence:
        snippet: Our findings provide evidence for the genetic heterogeneity of AKV and demonstrate that
          mutations in genes other than ATP2A2 are responsible for AKV in a proportion of the Chinese
          population.
        supports: SUPPORT
