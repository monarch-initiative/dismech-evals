      assertion:
        name: Biallelic BMPR1B Loss-of-Function Variants
        gene_term:
          preferred_term: BMPR1B
          term:
            id: hgnc:1077
            label: BMPR1B
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: Severe Grebe-like disease has been reported with the founding 8-bp deletion (historically
          del359-366; subsequently described as c.361_368delGGACCTAT), p.Trp219*, p.Arg401* and p.Cys53Arg.
          Transcript decay or truncated protein production is predicted for truncating alleles; patient
          RNA/protein studies were not reported. C53R reaches the cell surface but fails to produce the
          wild-type GDF5-responsive reporter signal. A separate p.Met397Arg kindred was described clinically
          as Hunter-Thompson type, illustrating the wider BMPR1B acromesomelic spectrum.
      selected_evidence:
        snippet: Mutation analysis of BMPR1B revealed a homozygous 8 bp deletion (del359-366). This mutation
          is expected to result in a loss of function
        supports: SUPPORT
