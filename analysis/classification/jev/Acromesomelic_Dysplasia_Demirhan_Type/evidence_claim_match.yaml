        description: Du Pan dysplasia is a milder acromesomelic phenotype associated with GDF5 or BMPR1B.
          BMPR1B p.Arg31Cys retained more reporter activity than p.Cys53Arg, supporting an allele-dependent
          severity hypothesis.
        distinguishing_features:
        - The p.Arg31Cys adult had a height of 148 cm and absent fibulae, with preserved radius, ulna
          and femur; normal stature and preservation of every long bone are not required.
        - Residual signaling has been measured for selected alleles, but a precise functional cutoff separating
          Du Pan from Grebe dysplasia has not been established.
      selected_evidence:
