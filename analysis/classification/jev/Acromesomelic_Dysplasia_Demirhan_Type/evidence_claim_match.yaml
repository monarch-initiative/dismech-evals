          that historical sequence does not require every present-day test to follow the same order. Distinguish
          severe recessive alleles from dominant brachydactyly variants and milder Du Pan-associated alleles.
      selected_evidence:
        snippet: Mutation analysis of BMPR1B revealed a homozygous 8 bp deletion (del359-366). This mutation
          is expected to result in a loss of function
