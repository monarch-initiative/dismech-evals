  20a5a59bca8558c4b1e171a81b89c7816279a77f89c20192f8957f4f0cf348fb:
    claim:
      about:
        disease:
          name: Acromesomelic Dysplasia Demirhan Type
          disease_term:
            preferred_term: acromesomelic dysplasia, Demirhan type
            term:
              id: MONDO:0012274
              label: acromesomelic dysplasia 3
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: bmpr1b_reproductive_role
        hypothesis_label: BMPR1B contribution to the reproductive phenotype
        status: EMERGING
        description: Loss of BMPR1B may contribute to the ovarian endocrine and uterine abnormalities
          documented in the founder. Null mice show impaired cumulus expansion, fertility and uterine
          gland formation but retain follicles and ovulation. These findings support reproductive involvement
          without reproducing human ovarian nonvisualization or proving a granulosa-cell-specific human
          pathway. A second genetic contributor in the consanguineous family remains an alternative.
        notes: Later reports include males and a two-year-old girl whose uterus was normal but ovaries
          were not assessable. These observations cannot estimate adult female penetrance. The sheep Q249R
          hyperprolific allele is not a model of complete receptor loss. In the null-mouse full text,
