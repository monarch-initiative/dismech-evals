  73b66b4dee0aa57da3c57e1933cc95352f5e8f59106e6e2a33aa8151d861ab41:
    claim:
      about:
        disease:
          name: Acromesomelic Dysplasia Demirhan Type
          disease_term:
            preferred_term: acromesomelic dysplasia, Demirhan type
            term:
              id: MONDO:0012274
              label: acromesomelic dysplasia 3
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Bmpr1b-null female reproductive model
        species: Mus musculus
        genotype: Homozygous Bmpr1b-null
        background: Hybrid 129Sv × C57BL/6
        genes:
        - preferred_term: BMPR1B
          term:
            id: hgnc:1077
            label: BMPR1B
        publication: PMID:11416163
        description: Null females have severely impaired fertility, defective cumulus expansion and deficient
          uterine gland development. Over 30 matings across 60 weeks yielded two litters, so the phenotype
          is not absolute sterility. Developing follicles, corpora lutea and gonadotropin-responsive ovulation
          were preserved.
        modeled_mechanisms:
        - target: Ovarian Endocrine Dysfunction
          relationship: PARTIALLY_RECAPITULATES
          description: The model supports a reproductive requirement for BMPR1B but differs substantially
            from the founding human ovarian phenotype.
          fidelity: LOW
          limitations: Follicles and ovulation remain present. Cyp19 mRNA showed a nonsignificant downward
            trend, and estradiol was not directly compared. Primary granulosa-cell versus oocyte effects
            are unresolved; these experiments do not establish human ovarian agenesis or a fertility treatment.
          readouts:
          - name: Ovarian follicle histology
            target: Ovarian Endocrine Dysfunction
            direction: UNCHANGED
            interpretation: Developing follicles and corpora lutea were retained despite impaired cumulus
              expansion and fertility.
          - name: Cumulus cell expansion
            target: Ovarian Endocrine Dysfunction
            direction: DECREASED
            interpretation: Cumulus expansion was defective despite retained follicles and ovulatory responses;
              the human endocrine mechanism remains unresolved.
        - target: Impaired Uterine Development
          relationship: PARTIALLY_RECAPITULATES
          description: Thin uterine linings and impaired endometrial gland development supply partial
            correspondence to human uterine hypoplasia.
          fidelity: MODERATE
          limitations: The experiment does not separate direct uterine receptor effects from secondary
            endocrine effects.
          readouts:
          - name: Endometrial gland development
            target: Impaired Uterine Development
            direction: DECREASED
            interpretation: Glands were absent or underdeveloped in eight of nine mutants.
        notes: The full PMC35456 paper was used to qualify its stronger abstract language about aromatase
          and estrogen biosynthesis. Oocyte fertilization after cumulus removal in vitro is an experimental
          result, not a clinical treatment recommendation.
      selected_evidence:
        snippet: The uterine linings were thin, and endometrial glands were absent or underdeveloped in
          89% (8/9) of the mutants
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/1
      context_paths:
