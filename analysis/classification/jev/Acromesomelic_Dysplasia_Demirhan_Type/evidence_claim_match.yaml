        name: Brachydactyly Type A2
        description: The dominant BMPR1B disorder. It is caused by dominant-negative missense alleles
          rather than loss of function, and is the reason a heterozygous BMPR1B variant cannot be read
          as carrier status without knowing its functional class.
        distinguishing_features:
        - Brachydactyly type A2 is autosomal dominant and arises from dominant-negative BMPR1B missense
          alleles.
        - The Demirhan-type alleles are recessive loss-of-function changes whose heterozygous carriers
          show at most mild brachydactyly.
      selected_evidence:
        snippet: In contrast, dominant-negative BMPR1B mutations described previously are associated with
          autosomal-dominant brachydactyly-type A2.
