      assertion_type: Genetic
      assertion:
        name: Biallelic GDF5 Variants
        gene_term:
          preferred_term: GDF5
          term:
            id: hgnc:4220
            label: GDF5
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Reported causative alleles include frameshift and other truncating variants in the
          mature region, and missense variants in the mature active domain. Missense alleles at the conserved
          cysteines or at the RRKRR processing recognition motif behave differently from truncating alleles:
          they yield a retained, dominant-negative protein rather than simple absence.'
      selected_evidence:
        snippet: In affected subjects, an insertion of a C at nucleotide 297 of the coding sequence was
          discovered. This insertion produced a shift in the reading frame at amino acid residue 99, causing
          premature termination of the polypeptide six amino acids downstream.
        supports: SUPPORT
