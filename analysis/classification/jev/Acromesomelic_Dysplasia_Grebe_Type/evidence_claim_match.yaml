      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: processing_failure_model
        hypothesis_label: Precursor-Processing Failure Model
        status: EMERGING
        description: 'A third allele class acts before either of the above: p.Arg377Trp sits in the RRKRR
          recognition motif at the proteolytic processing site, so the lesion is failure to mature the
          GDF5 precursor into active ligand rather than failure of the mature protein to fold, be secreted,
          or bind. The functional consequence has been inferred from the motif rather than measured, and
          no processing assay has been run on this allele.'
        notes: The three groups describe different allele classes rather than competing accounts of one
          allele, and a single entry can only be explained by one of them. They are curated together because
          the clinical phenotype does not distinguish them, so the mechanism operating in any given family
          is read from the variant rather than from the radiographs.
      selected_evidence:
        snippet: The p.Arg377Trp mutation is located within the recognition motif at the processing site
          of GDF5 where the sequence RRKRR changes to WRKRR.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
      context_paths:
