  218318f5f310bee5e846ddae3fc0eda1664ba99d227aa49347029c4a752b25d9:
    claim:
      about:
        disease:
          name: Acromesomelic Dysplasia Grebe Type
          disease_term:
            preferred_term: acromesomelic dysplasia, Grebe type
            term:
              id: MONDO:0008703
              label: acromesomelic dysplasia 2A
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dominant_negative_bmp_sequestration
        hypothesis_label: Dominant-Negative BMP Sequestration Model
        status: ALTERNATIVE
        description: 'The archetypal Grebe missense allele does more than remove GDF5. The mutant protein
          is retained inside the cell and, because BMP family members dimerise, drags partner BMPs out
          of the secretory pathway with it, so the lesion is a broader withdrawal of BMP signalling than
          a GDF5 null produces. The clinical prediction that distinguishes the two models is carrier status:
          a null allele should leave heterozygotes unaffected, whereas a sequestering allele should give
          them a brachydactyly, and heterozygous brachydactyly is exactly what the reported families show.
          What has never been done is the comparison that would settle it, matching homozygous phenotype
          severity between a sequestering allele and a true null.

          A refinement worth noting is that the sequestration may not be a simple property of the mutant
          protein. For a prodomain GDF5 variant, inhibition of wild-type GDF5 secretion happened only
          when the latent TGF-beta binding proteins LTBP1 or LTBP2 were co-expressed. If the effect depends
          on the local abundance of such co-factors, dominant-negative penetrance is partly a property
          of the tissue environment rather than of the allele alone, which would be one way to explain
          why carriers of a single allele in one pedigree range from unaffected to frankly brachydactylous.'
      selected_evidence:
        snippet: It produces a dominant negative effect by preventing the secretion of other, related
          BMP family members. We present evidence that this may occur through the formation of heterodimers.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9288098
      reference_title: Disruption of human limb morphogenesis by a dominant negative mutation in CDMP1.
      evidence_source: IN_VITRO
      explanation: Establishes the sequestration mechanism that makes this allele more than a null.
