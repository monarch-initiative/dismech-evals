    evidence_metadata:
      reference: PMID:26275437
      reference_title: 'Characterization of an acromesomelic dysplasia, Grebe type case: novel mutation
        affecting the recognition motif at the processing site of GDF5.'
      evidence_source: HUMAN_CLINICAL
      explanation: Localises the allele to the processing motif. Support is partial because the pathogenic
        effect was established by in silico and structural prediction rather than by a processing assay.
