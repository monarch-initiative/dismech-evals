        rationale: Gain-of-function NPR2 alleles and CNP overproduction cause tall stature with macrodactyly
          and slipped capital femoral epiphysis, mirroring the AMDM picture in the opposite direction,
          and the reported gain-of-function receptor is overactive both at baseline and with ligand. If
          activity maps onto stature continuously, then measured receptor activity should predict height
          across the whole allelic range, which would give AMDM a quantitative severity model it currently
          lacks. The competing possibility is that the relationship saturates or is buffered at the top
          of the range, so that the overgrowth phenotype is not simply AMDM run backwards. No study has
          plotted measured NPR-B activity against stature across loss- and gain-of-function alleles together.
        attaches_to:
        - pathophysiology#Reduced CNP-Stimulated Guanylyl Cyclase Activity and cGMP
        - phenotypes#Severe Disproportionate Short-Limb Short Stature
      selected_evidence:
        snippet: Loss of function mutations at NPR2 cause acromesomelic dysplasia, type Maroteaux, while
          overproduction of CNP by chromosomal translocation and a gain-of-function mutation at NPR2 have
          been reported to be responsible for an overgrowth syndrome in three cases and one family, respectively.
        supports: SUPPORT
