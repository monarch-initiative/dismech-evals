      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: chondrocyte_cgmp_deficit_convergence
        hypothesis_label: Chondrocyte cGMP-Deficit Convergence Model
        status: CANONICAL
        description: 'The unit that matters for growth-plate output is chondrocyte cGMP, and AMDM is one
          of several ways to lower it. Achondroplasia lowers it from above by activating FGFR3; AMDM lowers
          it by disabling the cyclase that makes it; the PRKG2 disorder leaves it intact but removes the
          kinase that reads it. The model earns its keep by being predictive rather than descriptive:
          it is why a CNP analogue developed for achondroplasia was expected to help NPR2 deficiency,
          and a 2026 basket trial found that it does in heterozygous NPR2 carriers.'
      selected_evidence:
        snippet: Activating mutations in fibroblast growth factor receptor 3 (FGFR3) and inactivating
          mutations in the natriuretic peptide receptor 2 (NPR2) guanylyl cyclase both result in decreased
          production of cyclic GMP in chondrocytes and severe short stature
        supports: SUPPORT
