        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: allele_dominant_negative_model
        hypothesis_label: Dominant-Negative Allele Model of Carrier Short Stature
        status: EMERGING
        description: Carrier short stature has usually been read as haploinsufficiency, but at least some
          AMDM missense alleles produce a normally expressed receptor that poisons the wild-type subunit
          within the homodimer. On that reading a carrier's residual activity is below fifty percent,
          which would explain both why heterozygous relatives are short and why their height z-scores
          drift downward with age rather than tracking a fixed deficit. The prediction that separates
          this from haploinsufficiency is that truncating alleles should give milder carrier phenotypes
          than dominant-negative missense alleles; that comparison has not been made systematically.
      selected_evidence:
        snippet: Both mutant ANPRB proteins were normally expressed in HEK293T cells and exhibited dominant
          negative effects on wild-type ANPRB catalytic activity.
        supports: SUPPORT
    origin:
