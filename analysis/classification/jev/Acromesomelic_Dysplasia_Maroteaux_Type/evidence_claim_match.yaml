        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: npr_b_phosphoregulation_modifier
        hypothesis_label: NPR-B Phosphoregulation Modifier Model
        status: EMERGING
        description: 'CNP can only activate NPR-B when the receptor is phosphorylated on several serines
          and threonines, and FGFR3 signalling drives a PPP-family phosphatase that strips those sites.
          This makes the receptor''s phosphorylation state a second, variant-independent determinant of
          how much cGMP an AMDM growth plate makes, and predicts two things worth testing: that FGF tone
          modifies severity in patients carrying residual-activity alleles, and that a phosphatase inhibitor
          should raise output from those same alleles. Both predictions currently rest on mouse achondroplasia
          models. Nothing has been measured in an NPR2-mutant background, where the relevant question
          is whether a partially active mutant receptor is still subject to the same regulation.'
      selected_evidence:
        snippet: because FGFR3 signaling decreases NPR2 activity by dephosphorylating the NPR2 protein
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
