      assertion_type: Discussion
      assertion:
        discussion_id: vosoritide_in_biallelic_npr2_disease
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does vosoritide help AMDM, where both NPR2 alleles are damaged, given that it works by
          agonising NPR-B?
        rationale: 'A 2026 phase 2 basket trial reported a large growth-velocity gain in children with
          NPR2 deficiency, but that arm enrolled heterozygous carriers, who retain one wild-type receptor
          for the drug to act on. AMDM is the harder case, because the drug''s target is the damaged protein
          itself. Whether it helps should depend on residual activity: alleles with partial catalytic
          function might be drivable by supraphysiological CNP, whereas a receptor that cannot bind ligand
          or reach the membrane offers nothing to agonise. That makes this a question about allele class,
          not about the disease as a whole, and the existing entry already records that AMDM alleles differ
          in trafficking and catalytic behaviour. The safety signal from the trial is also relevant to
          a population already prone to skeletal complications.'
        attaches_to:
        - treatments#
        - pathophysiology#Reduced CNP-Stimulated Guanylyl Cyclase Activity and cGMP
        - mechanistic_hypotheses#chondrocyte_cgmp_deficit_convergence
      selected_evidence:
        snippet: 5 subjects discontinued medication due to adverse events, including 3 slipped capital
          femoral epiphyses and 4 cases of genu valgum
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
