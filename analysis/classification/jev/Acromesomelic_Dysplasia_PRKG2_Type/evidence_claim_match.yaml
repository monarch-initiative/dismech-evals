      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: raf1_mapk_brake_model
        hypothesis_label: c-Raf-1 Ser43 MAPK-Brake Model
        status: CANONICAL
        description: 'cGKII restrains the FGF-driven MAPK cascade in growth-plate chondrocytes by phosphorylating
          c-Raf-1 at Ser43, and pathogenic alleles lose that phosphorylation and with it the regulation
          it provides. The model is about the missing brake; it does not by itself specify how far ERK1/2
          output moves in a growth plate. This is the canonical model for AMDP because it is the readout
          against which every human PRKG2 allele has been assayed: the founding nonsense and frameshift
          alleles, the p.Asp761Glufs*34 allele from an independent family, and the first missense allele
          p.Val470Gly all fail the same Raf-1/ERK test. It also connects AMDP to the wider growth-plate
          literature, where excess FGFR3-MAPK signalling is the established cause of achondroplasia and
          where CNP-cGMP is the physiological counterweight.'
      selected_evidence:
        snippet: alter the downstream mitogen activation protein kinase signalling pathway by failing
          to phosphorylate c-Raf 1 at Ser43 and subsequently reduce ERK1/2 activation in response to fibroblast
          growth factor 2
        supports: SUPPORT
