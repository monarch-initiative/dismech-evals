      assertion_type: Pathophysiology
      assertion:
        name: Loss of cGKII Restraint on the c-Raf-1/ERK1/2 Cascade
        role: central_effector
        biological_scale: MOLECULAR
        description: In chondrocytes, cGKII acts as an inhibitory input onto the FGF-MAPK cascade by phosphorylating
          c-Raf-1 at Ser43. Losing that input dysregulates FGF2-driven ERK1/2 signalling in a pathway
          whose excess activity is a well-established cause of impaired chondrocyte proliferation in the
          FGFR3 chondrodysplasias. This node is deliberately named for the lesion rather than for a direction
          of change. Two of the three source abstracts phrase the mutant effect ambiguously - the clause
          reads equally as the mutant reducing ERK activation or as the mutant failing to reduce it -
          and only PMID:37789084 states it unambiguously, that the mutant was unable to down-regulate
          FGF2-induced MAPK signalling. Loss of restraint is therefore what the evidence supports; a quantified
          increase in chondrocyte ERK output is not.
        biological_processes:
        - preferred_term: ERK1 and ERK2 cascade
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
          modifier: ABNORMAL
        - preferred_term: Negative regulation of ERK1 and ERK2 cascade
          term:
            id: GO:0070373
            label: negative regulation of ERK1 and ERK2 cascade
          modifier: DECREASED
        - preferred_term: Fibroblast growth factor receptor signaling pathway
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
          modifier: ABNORMAL
        - preferred_term: Peptidyl-serine phosphorylation of c-Raf-1
          term:
            id: GO:0018105
            label: peptidyl-serine phosphorylation
          modifier: DECREASED
        cell_types:
        - preferred_term: Growth-plate chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: Wild-type cGKII downregulated MAPK signalling by reducing ERK1/2 activation through the
          upstream phosphorylation of Raf-1 at Ser-43 in a cGMP-dependent manner.
        supports: SUPPORT
    origin:
