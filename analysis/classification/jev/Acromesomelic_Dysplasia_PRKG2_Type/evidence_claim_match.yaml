      assertion:
        name: Biallelic PRKG2 Loss-of-Function Variants
        gene_term:
          preferred_term: PRKG2
          term:
            id: hgnc:9416
            label: PRKG2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Reported causative alleles include nonsense, frameshift, splice-site, and missense
          variants, in homozygous and in compound-heterozygous configuration. Most are loss of function:
          truncating transcripts are subject to nonsense-mediated decay and the residual mutant proteins
          partially or completely lack the kinase domain, and the first reported missense allele, p.Val470Gly,
          retains the protein but abolishes downstream signalling regulation. Allele class is not always
          readable from the coding change - the p.Asp544Tyr missense variant acts by creating a cryptic
          splice site and yields two aberrant products rather than a single substituted protein.'
      selected_evidence:
        snippet: 'Functional analysis unveiled a unique dual pathogenic mechanism: the missense variant
          creates a cryptic splice site, resulting in two aberrant protein products - an in-frame deletion
          and a missense substitution.'
        supports: SUPPORT
