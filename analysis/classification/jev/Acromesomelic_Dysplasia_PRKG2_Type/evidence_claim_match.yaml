      reference_title: 'Case Report: Dual pathogenic mechanism of a PRKG2 missense variant underlies an
        attenuated phenotype of acromesomelic dysplasia.'
      evidence_source: HUMAN_CLINICAL
      explanation: The dose-response account is offered as a hypothesis about a single proband, which
