      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sox9_nuclear_exclusion_switch
        hypothesis_label: SOX9 Nuclear-Exclusion Switch Model
        status: ALTERNATIVE
        description: 'cGKII acts as the switch that ends proliferation and starts hypertrophic differentiation
          by excluding SOX9 from the chondrocyte nucleus; without it, SOX9 persists and cells accumulate
          in a postmitotic but non-hypertrophic state. The model rests on the cGKII-deficient KMI rat,
          where SOX9 knockdown rescues the differentiation block, and it is attractive for AMDP because
          it predicts exactly the collagen shift measured in the human alleles: SOX9 drives COL2A1 and
          represses COL10A1, and the human mutants upregulate COL2A1 while downregulating COL10A1. It
          is curated as ALTERNATIVE rather than canonical because no human AMDP allele has been tested
          for SOX9 localisation.'
      selected_evidence:
        snippet: They also downregulate COL10A1 and upregulate COL2A1 expression through SOX9.
        supports: SUPPORT
