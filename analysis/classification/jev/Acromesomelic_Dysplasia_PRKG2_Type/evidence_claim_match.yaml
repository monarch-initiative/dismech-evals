                id: hgnc:9416
                label: PRKG2
            description: A naturally occurring nonsense PRKG2 allele segregating in American Angus cattle
              causes disproportionate dwarfism and was the first evidence that PRKG2 loss impairs longitudinal
              growth in a large mammal.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Dysregulated SOX9-Dependent Chondrocyte Collagen Program
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: The bovine truncating allele reproduces the loss of PRKG2 control over COL2 and COL10
          expression seen with the human alleles.
        limitations: 'Bovine growth-plate biology and body proportions differ from human, and the cattle
          phenotype is described as dwarfism without the acromesomelic radiographic detail used to define
          the human entity. The direction of the collagen change also diverges: dwarf cattle show COL10
          mRNA increased, whereas the human alleles downregulate COL10A1. What the two systems agree on
          is that PRKG2 loss removes regulation of the collagen genes, not which way each transcript moves,
          so the model supports the regulatory claim at this node and not the human direction of effect.'
        readouts:
        - name: COL2 and COL10 mRNA expression
          target: Dysregulated SOX9-Dependent Chondrocyte Collagen Program
          direction: INCREASED
          interpretation: Loss of PRKG2 regulation raises collagen transcript levels in dwarf cattle,
            the same regulatory node dysregulated by the human alleles.
      selected_evidence:
        snippet: These experiments indicate that the R678X mutation is functional, resulting in a loss
          of PRKG2 regulation of COL2 and COL10 mRNA expression.
        supports: SUPPORT
