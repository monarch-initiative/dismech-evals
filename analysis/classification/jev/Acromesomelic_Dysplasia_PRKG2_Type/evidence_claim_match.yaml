          direction: INCREASED
          interpretation: Loss of PRKG2 regulation raises collagen transcript levels in dwarf cattle,
            the same regulatory node dysregulated by the human alleles.
      selected_evidence:
        snippet: These experiments indicate that the R678X mutation is functional, resulting in a loss
          of PRKG2 regulation of COL2 and COL10 mRNA expression.
        supports: SUPPORT
