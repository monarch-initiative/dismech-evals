      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acromesomelic Dysplasia, Maroteaux Type
        disease_term:
          preferred_term: acromesomelic dysplasia, Maroteaux type
          term:
            id: MONDO:0011275
            label: acromesomelic dysplasia 1, Maroteaux type
        description: 'The closest differential and the immediate upstream disorder in the same signalling
          axis: biallelic NPR2 variants disable the receptor that generates the cGMP signal cGKII transduces.'
        distinguishing_features:
        - Biallelic NPR2 variants rather than biallelic PRKG2 variants establish AMDM.
        - Pronounced generalised cone-shaped epiphyses with phalangeal shortening are characteristic of
          AMDM; in the PRKG2 family presenting as spondylometaphyseal dysplasia, coning was subtle and
          unaccompanied by shortening.
      selected_evidence:
        snippet: In humans, biallelic variants in NPR2, encoding NPR-B, cause acromesomelic dysplasia,
          type Maroteaux, while heterozygous variants in NPR2 (natriuretic peptide receptor 2) and NPPC
          (natriuretic peptide precursor C), encoding CNP, cause milder phenotypes.
        supports: SUPPORT
