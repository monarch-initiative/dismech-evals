      assertion_type: Discussion
      assertion:
        discussion_id: cnp_axis_pharmacology_in_amdp
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        - pathophysiology#Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
        prompt: Would vosoritide, which acts upstream of cGKII, be expected to fail in AMDP where it succeeds
          in NPR2 deficiency?
        rationale: 'Vosoritide raises CNP signalling through NPR-B, which sits upstream of cGKII. A 2026
          phase 2 basket trial reported a marked growth-velocity gain in children with heterozygous NPR2
          variants, so the axis is pharmacologically tractable where receptor signalling is merely reduced.
          AMDP is the harder case in principle: the receptor is intact and it is the intracellular effector
          that is absent, so there may be nothing left to transduce the agonised signal. The mouse epistasis
          result points the same way, since growth-plate CNP overexpression fails to rescue the Prkg2-null
          skeleton. Against that, the human AMDP alleles are not all complete nulls and residual cGKII
          might be drivable. No treatment data of any kind have been published for AMDP, so this entry
          carries no treatments section rather than an inferred one. The `treatments: []` section is deliberately
          empty and present rather than absent, so that the absence of published management is a curated
          statement rather than an omission.'
      selected_evidence:
        snippet: Vosoritide led to marked increases in growth velocity in children with RASopathies, ACAN,
          and NPR2 deficiency
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41967490
      reference_title: A phase II basket trial of vosoritide in children with RASopathies, ACAN, and NPR2
        deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that CNP-analogue therapy works in a related axis disorder. Support is
        partial because the trial enrolled heterozygous NPR2 carriers, not AMDP or biallelic NPR2 disease.
