        - Biallelic NPR2 variants rather than biallelic PRKG2 variants establish AMDM.
        - Pronounced generalized cone-shaped epiphyses with phalangeal shortening are characteristic of
          AMDM. In the PRKG2 family presenting as spondylometaphyseal dysplasia, the subtle coning involved
          distal phalangeal metaphyses and was unaccompanied by shortening; these are anatomically distinct
          observations.
