      assertion:
        hypothesis_group_id: gsk3b_beta_catenin_route
        hypothesis_label: GSK-3beta / beta-Catenin Hypertrophy Route
        status: ALTERNATIVE
        description: 'cGKII phosphorylates and inactivates GSK-3beta, sparing beta-catenin and permitting
          the canonical Wnt output that drives chondrocyte hypertrophy. This is the only one of the three
          models tested by genetic epistasis in a mammal: removing one Gsk3b allele partially rescues
          the Prkg2-null growth plate. The rescue is partial, which is itself the argument that GSK-3beta
          is one route rather than the whole mechanism, and no human AMDP data address it.'
        notes: The three groups are not mutually exclusive. A single kinase with several substrates can
          act through all of them at once, and the growth-plate phenotypes they predict overlap. What
          separates them for curation purposes is which has been tested in human AMDP alleles, which is
          only the first.
      selected_evidence:
        snippet: These data indicate that hypertrophic differentiation of growth plate chondrocytes during
          skeletal growth is promoted by phosphorylation and inactivation of GSK-3beta by cGKII.
        supports: SUPPORT
