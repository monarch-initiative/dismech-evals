        prompt: Which interventions improve growth or function in molecularly confirmed PRKG2 disease?
        rationale: The reported growth-hormone exposure has no published outcome in that case report.
          CNP overexpression fails to rescue the Prkg2-null mouse, but this is not a human vosoritide
          trial and cannot settle responses of all partially functional alleles. The phase II vosoritide
          basket study included RASopathies, ACAN variants and heterozygous NPR2 variants, not PRKG2 disease;
          its efficacy cannot be transferred to this diagnosis.
        discussion_id: treatment_response
      selected_evidence:
        snippet: targeted expression of CNP in the growth plate chondrocytes fails to rescue the skeletal
          defect of Prkg2(-/-) mice
