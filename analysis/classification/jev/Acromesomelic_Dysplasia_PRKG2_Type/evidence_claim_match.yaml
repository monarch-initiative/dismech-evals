      assertion_type: Discussion
      assertion:
        discussion_id: prkg2_residual_activity_and_severity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does residual cGKII activity set AMDP severity, as residual signalling does across the
          GDF5-BMPR1B acromesomelic dysplasias?
        rationale: A 2025 report attributes an attenuated phenotype to partial rather than complete loss
          of protein function, which is the same dose-response logic that separates du Pan syndrome from
          Grebe dysplasia in the other half of ISDS group 16. It is stated there as a hypothesis on one
          proband, and the reported PRKG2 families range from spondylometaphyseal dysplasia with no acromesomelic
          shortening to severe acromesomelic disease without a measured activity series to explain the
          spread. A systematic comparison of residual kinase activity against phenotype has not been done.
        attaches_to:
        - pathophysiology#Loss of cGKII Kinase Activity Downstream of CNP/NPR-B
        - genetic#Biallelic PRKG2 Loss-of-Function Variants
      selected_evidence:
        snippet: We hypothesize that these alterations cause a partial, rather than a complete, loss of
          protein function, which may account for the patient's attenuated clinical phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
