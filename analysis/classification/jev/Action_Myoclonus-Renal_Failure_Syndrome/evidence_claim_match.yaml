              label: action myoclonus-renal failure syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuronal Lysosomal Storage and Intracellular Inclusions
        biological_scale: CELLULAR
        description: 'Storage material accumulates in cerebral and cerebellar cortical neurons. Notably
          the stored species is not bulk glucosylceramide: in the LIMP-2-deficient mouse, glucosylceramide
          is not markedly raised, while its downstream deacylated and sterol-conjugated metabolites glucosylsphingosine
          and glucosylated cholesterol are. That distinction is the current best explanation for why LIMP-2
          deficiency produces a neuronal storage encephalopathy with glomerulosclerosis rather than the
          visceral, macrophage-centred picture of Gaucher disease.'
        cell_types:
        - preferred_term: cortical and cerebellar neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
      selected_evidence:
        snippet: Reanalysis of an existing Limp2 knockout mouse showed intracellular inclusions in cerebral
          and cerebellar cortex, and the kidneys showed subtle glomerular changes.
        supports: SUPPORT
