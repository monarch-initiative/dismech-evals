          term:
            id: GO:0005765
            label: lysosomal membrane
      selected_evidence:
        snippet: Mutations in SCARB2/Limp2 were found in all three families used for mapping and subsequently
          confirmed in two other unrelated AMRF families. The mutations were associated with lack of SCARB2
          protein.
        supports: SUPPORT
