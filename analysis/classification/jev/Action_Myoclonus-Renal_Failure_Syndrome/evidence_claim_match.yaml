      assertion_type: Pathophysiology
      assertion:
        name: Cortical Hyperexcitability and Cerebellar Degeneration
        biological_scale: TISSUE
        description: 'Sensorimotor cortex becomes hyperexcitable and cerebellar output degenerates. The
          myoclonus of AMRF is cortical in origin, not subcortical: EEG-EMG coherence and phase analysis
          in SCARB2 patients show significant coupling with a direct corticospinal transfer, and the rhythmic
          12-20 Hz jerking can be mistaken clinically for a postural tremor. Marked photosensitivity accompanies
          it. Cognition is characteristically spared relative to the other progressive myoclonic epilepsies.'
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
        - preferred_term: cerebellar cortex
          term:
            id: UBERON:0002129
            label: cerebellar cortex
      selected_evidence:
        snippet: The cortical origin of rhythmic myoclonus was demonstrated mainly by coherence and phase
          analysis of EEG-EMG signals indicating a significant EEG-EMG coupling and a direct corticospinal
          transfer.
        supports: SUPPORT
