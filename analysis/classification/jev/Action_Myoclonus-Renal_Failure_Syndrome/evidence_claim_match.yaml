              id: MONDO:0009699
              label: action myoclonus-renal failure syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Diagnosis of SCARB2-AMRF
        description: 'The diagnosis is established by identifying biallelic loss-of-function SCARB2 variants
          in a proband with suggestive findings. Because progressive myoclonic epilepsy is genetically
          heterogeneous, a PME gene panel or exome/genome sequencing is the appropriate first-tier test.
          A leukocyte beta-glucocerebrosidase assay must not be used to exclude the diagnosis: leukocyte
          activity can be normal in a patient whose fibroblasts are severely deficient, because blood
          cells retain a LIMP-2-independent delivery route. SCARB2 testing is warranted in adolescent-
          or young-adult-onset PME of unknown cause even with no renal involvement.'
        notes: 'Differential diagnosis: the other progressive myoclonic epilepsies - EPM1 (Unverricht-Lundborg,
          CSTB), Lafora disease (EPM2A/NHLRC1), the neuronal ceroid lipofuscinoses, MERRF, sialidosis
          type 1, and DRPLA. The relative preservation of cognition and the pronounced photosensitivity
          are the clinical discriminators; coexisting proteinuria is close to decisive when present.'
      selected_evidence:
        snippet: The diagnosis of SCARB2-AMRF is established in a proband with suggestive findings and
          biallelic loss-of-function pathogenic variants in SCARB2 identified by molecular genetic testing.
        supports: SUPPORT
    origin:
