      assertion_type: Pathophysiology
      assertion:
        name: LIMP-2 Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic SCARB2 variants - nonsense, frameshift, splice-site and rarely missense
          - abolish functional LIMP-2. Nonsense and frameshift alleles leave no immunodetectable protein;
          the alleles that do produce protein are retained in the endoplasmic reticulum rather than reaching
          the lysosomal membrane. The consequence is the same in either case: no functional sorting receptor
          at the site where cargo must be handed over.'
        genetic_context:
          gene:
            preferred_term: SCARB2
