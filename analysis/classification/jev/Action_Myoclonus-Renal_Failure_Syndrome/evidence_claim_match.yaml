        model_scale: MOLECULAR
        description: Tissue GCase deficiency with the same tissue-specific sparing of leukocytes seen
          in patients.
        limitations: 'What the mouse measures is enzyme activity, by activity assay and activity-based
          probe, in whole-tissue preparations and in isolated leukocytes. The node it is linked to claims
          something one step up: that lysosomal GCase delivery is LIMP-2-dependent in particular cell
          types. A whole-tissue activity assay cannot attribute the residual activity it finds to any
          one cell type within that tissue, so the leukocyte-versus-tissue contrast is the only cell-resolved
          comparison this model supplies. The finer claim in the node, that fibroblasts and neuronal cells
          are entirely LIMP-2-dependent while blood cells are not, rests on the human fibroblast and leukocyte
          data cited on that node rather than on this mouse.'
      selected_evidence:
        snippet: Noteworthy, in LIMP-2-deficient mice, residual GCase is remarkably high in leukocytes.
