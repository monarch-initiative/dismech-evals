        snippet: GCase deficiency in tissues does not correlate with increases in GlcCer, but rather with
          increases in glucosylsphingosine (GlcSph) and glucosylated cholesterol (GlcChol), both glucosylated
          metabolites derived from GlcCer.
        supports: SUPPORT
