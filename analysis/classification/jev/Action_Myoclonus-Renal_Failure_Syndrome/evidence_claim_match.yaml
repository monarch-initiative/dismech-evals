      assertion_type: Genetic
      assertion:
        name: SCARB2
        gene_term:
          preferred_term: SCARB2
          term:
            id: hgnc:1665
            label: SCARB2
        presence: Positive
        association: Biallelic Loss-of-Function Variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'SCARB2 encodes LIMP-2. Reported AMRF alleles include nonsense (W178X, Q288X), frameshift
          (W146SfsX16), splice-site and a single missense (H363N) variant. The missense allele is mechanistically
          distinctive: rather than weakening binding it increases GCase binding to LIMP-2, so the defect
          there is failure of release rather than failure of capture.

          Genotype-phenotype: the one correlation that survives statistical testing across the reported
          cases is positional rather than mechanistic. Variant *type* does not predict the clinical course,
          but a C-terminal variant location is significantly associated with age at onset. That is the
          only established modifier for this disease, and it means the allele''s position in the protein
          carries prognostic information that its class does not.'
      selected_evidence:
        snippet: In contrast to the reduced binding properties of the nonsense mutations, the only missense
          mutation (H363N) found in AMRF leads to increased binding of beta-GC to LIMP-2
        supports: SUPPORT
