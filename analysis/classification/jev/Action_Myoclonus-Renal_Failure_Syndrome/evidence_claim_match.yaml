        context:
        - path: /animal_models/0
          value:
            name: Limp2 knockout mouse
            species: Mouse
            genotype: Scarb2 (Limp2) homozygous null
            publication: PMID:12620969
            description: 'The Limp2-null mouse predates the discovery of AMRF''s cause and was characterized
              in its own right in 2003; it was reanalysed in 2008 once SCARB2 was identified as the AMRF
              gene. Read on its own terms it is a poor model of the human disease: its reported phenotype
              is ureteropelvic junction obstruction with hydronephrosis, hearing loss from loss of spiral
              ganglia and hair cells, and a peripheral demyelinating neuropathy - none of which is the
              human syndrome. The neuronal storage component and the glomerular change were found on reanalysis,
              and the glomerular change is subtle. The mouse''s own authors proposed it as a lead for
              human disorders of the stria vascularis or peripheral demyelination, not for a progressive
              myoclonic epilepsy with glomerulosclerosis.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Cortical Hyperexcitability and Cerebellar Degeneration
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        model_scale: ORGANISM
        description: The null mouse's characterized phenotype is renal-outflow, cochlear and peripheral-nerve
          disease. No progressive myoclonus, seizure phenotype or cerebellar syndrome is reported in it.
        limitations: The organism-level phenotype is in different organs from the human disease and the
          mouse's own describing authors pointed it at a different set of human disorders. It therefore
          cannot be used to test a myoclonus or seizure endpoint, which is the arm that matters most clinically
          and the one substrate reduction therapy is aimed at.
      selected_evidence:
        snippet: The phenotype of LIMP-2-deficient mice stimulates the search for mutations in human disorders
          associated with degeneration of the stria vascularis and/or demyelinization of peripheral nerves.
        supports: SUPPORT
