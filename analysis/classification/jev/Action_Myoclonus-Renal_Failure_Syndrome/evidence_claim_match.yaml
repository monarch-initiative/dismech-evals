        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Lysosomal Glucocerebrosidase Activity
        biological_scale: CELLULAR
        description: 'Lysosomal GCase activity falls in the cell types that depend on LIMP-2 for its delivery.
          The dependence is tissue-specific, and this is the reason AMRF is not Gaucher disease: in fibroblasts
          and neuronal cells GCase targeting is entirely LIMP-2 dependent, while in blood cells a LIMP-2-independent
          route preserves substantial activity. Leukocyte GCase can therefore be normal in a patient whose
          fibroblasts are severely deficient, which is a diagnostic trap as well as a mechanistic fact.'
        biological_processes:
        - preferred_term: glucosylceramide catabolism in the lysosome
          modifier: DECREASED
          term:
            id: GO:0006680
            label: glucosylceramide catabolic process
        molecular_functions:
        - preferred_term: glucocerebrosidase activity
          modifier: DECREASED
          term:
            id: GO:0004348
            label: glucosylceramidase activity
      selected_evidence:
        snippet: The biochemical analysis of one of the patients revealed a normal beta-glucocerebrosidase
          activity in leukocytes, but a severe enzymatic deficiency in cultured skin fibroblasts.
        supports: SUPPORT
