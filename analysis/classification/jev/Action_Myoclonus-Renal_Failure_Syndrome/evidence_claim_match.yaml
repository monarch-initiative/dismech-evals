  79a88226fbc9da922c74409d38b79d6b66f8cec9b735ef10428a591423f5f650:
    claim:
      about:
        disease:
          name: Action Myoclonus-Renal Failure Syndrome
          disease_term:
            preferred_term: action myoclonus-renal failure syndrome
            term:
              id: MONDO:0009699
              label: action myoclonus-renal failure syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Beta-Glucocerebrosidase Lysosomal Targeting
        biological_scale: MOLECULAR
        description: LIMP-2 binds beta-glucocerebrosidase in the ER through a conserved coiled-coil domain
          and releases it in the acidified late endosome/lysosome, a handover gated by a critical histidine
          that acts as a pH sensor. This route is mannose-6-phosphate independent, which is why AMRF spares
          the many lysosomal hydrolases that use the M6P receptor. With LIMP-2 absent, GCase is stranded
          in the ER, remains endoglycosidase-H sensitive, and is degraded.
        biological_processes:
        - preferred_term: LIMP-2-mediated sorting of beta-glucocerebrosidase
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0006622
            label: protein targeting to lysosome
      selected_evidence:
        snippet: We now demonstrate that the lumenal acidification mediated by the vacuolar (H(+) )-ATPase
          triggers the dissociation of LIMP-2 and GC in late endosomal/lysosomal compartments.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22537104
      reference_title: A critical histidine residue within LIMP-2 mediates pH sensitive binding to its
        ligand beta-glucocerebrosidase.
      evidence_source: IN_VITRO
      explanation: 'Defines the normal delivery step whose loss this node describes: pH-gated release
        of GCase from LIMP-2 at the lysosome.'
