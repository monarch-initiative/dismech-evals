  1e69e4f7f4c23897a61198ef84854910afa5e8da68ceb913e8ca1f139df9aa97:
    claim:
      about:
        disease:
          name: Action Myoclonus-Renal Failure Syndrome
          disease_term:
            preferred_term: action myoclonus-renal failure syndrome
            term:
              id: MONDO:0009699
              label: action myoclonus-renal failure syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Substrate Reduction Therapy (Miglustat)
        description: The only treatment in this entry that targets the mechanism rather than the symptoms.
          Miglustat inhibits glucosylceramide synthase, so it reduces production of the substrate that
          the mistrafficked glucocerebrosidase cannot degrade - the same logic used in Gaucher disease,
          reached here from the opposite direction. One patient treated for three years after several
          years of steady worsening had progression of myoclonus halt, dysphagia resolve, some skills
          reacquired and seizures remain controlled. A second, earlier report describes significant improvement
          in one of two affected sisters given substrate reduction therapy.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: miglustat
            term:
              id: CHEBI:50381
              label: miglustat
        target_phenotypes:
        - preferred_term: Action myoclonus
          term:
            id: HP:0034360
            label: Action myoclonus
        notes: 'The evidence base is two single patients in uncontrolled reports, and the authors of the
          three-year report state the conclusion with matching hedging ("could be ameliorated, at least
          partly"). This is not established therapy. Note also that miglustat was used because it has
          modest CNS penetration: eliglustat, the more potent inhibitor, does not cross the blood-brain
          barrier, and compassionate-use access to the CNS-penetrant venglustat was declined. The drug
          choice is therefore a constraint of availability, not an optimum.'
      selected_evidence:
        snippet: When substrate-reduction therapy, to correct the possible glucocerebroside storage in
          the cells with glucocerebrosidase deficiency, was administered to one of the siblings, a significant
          improvement was observed.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21782476
      reference_title: 'Progressive myoclonus epilepsy with nephropathy C1q due to SCARB2/LIMP-2 deficiency:
        clinical report of two siblings.'
      evidence_source: HUMAN_CLINICAL
      explanation: An independent single-patient report of benefit. Graded INDIRECT because the report
        names substrate reduction therapy generically rather than the agent, so it supports the strategy
        rather than this specific drug.
