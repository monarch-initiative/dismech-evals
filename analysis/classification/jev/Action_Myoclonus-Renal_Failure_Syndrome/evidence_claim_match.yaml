              label: action myoclonus-renal failure syndrome
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: C1q accumulation in glomerular capillary loops and mesangium
        description: 'Strong C1q deposition in capillary loops and mesangium on renal biopsy, reported
          alongside the nephrotic syndrome. This is what gives the renal lesion its alternative name in
          the literature, where SCARB2 disease is sometimes reported as progressive myoclonus epilepsy
          with C1q nephropathy. It sits beside rather than instead of the collapsing focal segmental glomerulosclerosis
          curated under phenotypes, and the entry does not assert that either is the invariable renal
          histology. The two are not confined to separate families: one patient (II.13 of the Turkish
          p.N45MfsX88 family) has C1q, C3 and IgM deposition and FSGS in the same biopsy. That biopsy
          is reported as FSGS without the collapsing qualifier, so what co-occurs there is C1q deposition
          with FSGS, not specifically with the collapsing variant.'
        finding_term:
          preferred_term: C1q deposition in glomerular capillary loops and mesangium
      selected_evidence:
        snippet: The main clinical features of two siblings from a consanguineous marriage were progressive
          myoclonic epilepsy without intellectual impairment and a nephrotic syndrome with a strong accumulation
          of C1q in capillary loops and mesangium of kidney.
        supports: SUPPORT
