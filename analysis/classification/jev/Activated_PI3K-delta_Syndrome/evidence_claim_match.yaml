        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing
        description: Molecular diagnosis is established by identifying a heterozygous pathogenic gain-of-function
          variant in PIK3CD (APDS1) or a heterozygous pathogenic loss-of-function variant in PIK3R1 (APDS2).
          Panel-based or exome sequencing is appropriate given the clinical overlap with common variable
          immunodeficiency, hyper-IgM syndrome, and combined immunodeficiency. PTEN loss-of-function APDS-like
          immunodeficiency is a related but out-of-scope entity for this APDS1/APDS2 entry.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
        results: Heterozygous pathogenic gain-of-function PIK3CD variant (APDS1) or loss-of-function PIK3R1
          variant (APDS2)
      selected_evidence:
        snippet: The clinical diagnosis of APDS can be established in a proband based on suggestive clinical
          findings, or the molecular diagnosis can be established in a proband with suggestive findings
          and a heterozygous pathogenic variant in PIK3CD (for APDS1) or PIK3R1 (for APDS2) identified
          by molecular genetic testing.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
