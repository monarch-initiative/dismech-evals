  cb4950b495827d348f29884c04e0dba56edfb66d14132746f995db8a3db2ccc8:
    claim:
      about:
        disease:
          name: Activated PI3K-delta syndrome
          disease_term:
            preferred_term: Activated PI3K-delta syndrome
            term:
              id: MONDO:0018338
              label: activated PI3K-delta syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PI3K-delta pathway hyperactivation
        description: Germline gain-of-function variants in the PIK3CD catalytic subunit (APDS1) or loss-of-function
          variants in the inhibitory PIK3R1 regulatory subunit (APDS2) create constitutive PI3K-delta
          signaling with increased downstream AKT and mTOR activity. Persistent pathway activation disrupts
          lymphocyte homeostasis and underlies the precision-medicine rationale for PI3K-delta inhibition.
        genes:
        - preferred_term: PIK3CD
          term:
            id: hgnc:8977
            label: PIK3CD
        - preferred_term: PIK3R1
          term:
            id: hgnc:8979
            label: PIK3R1
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: CD4-positive alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        - preferred_term: CD8-positive alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
          modifier: INCREASED
        - preferred_term: TOR signaling
          term:
            id: GO:0031929
            label: TOR signaling
          modifier: INCREASED
      selected_evidence:
        snippet: Treatment with leniolisib (CDZ173), a selective PI3Kδ inhibitor, caused dose-dependent
          suppression of PI3Kδ pathway hyperactivation (measured as phosphorylation of AKT/S6) in cell
          lines ectopically expressing APDS-causative p110δ variants and in T-cell blasts derived from
          patients.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28972011
      reference_title: Effective "activated PI3Kδ syndrome"-targeted therapy with the PI3Kδ inhibitor
        leniolisib.
      evidence_source: HUMAN_CLINICAL
      explanation: Directly links APDS-causing variants to increased PI3Kdelta-AKT-S6 signaling and shows
        reversibility with selective PI3Kdelta inhibition.
