      assertion_type: Treatment
      assertion:
        name: Multisystem, viral, and malignancy surveillance
        action_category: MONITORING
        description: Longitudinal follow-up should assess infections and herpesvirus burden, immune function,
          lymphoproliferation and blood counts, autoimmunity, respiratory function, and gastrointestinal/liver
          status at least annually. GeneReviews also recommends chest CT or MRI every three to five years
          and baseline then periodic liver ultrasonography. Persistent or changing lymphadenopathy warrants
          clinical evaluation because benign lymphoproliferation can be difficult to distinguish from
          lymphoma.
        treatment_term:
          preferred_term: clinical assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: 'Surveillance: Annually assess infection risk (blood/sputum cultures for EBV, CMV, and
          HSV), immune function (immunoglobulin levels, CD4+, CD8+, B-cell subsets, response to vaccines),
          lymphoproliferative status (CBC, B-cell counts), autoimmunity (ANA screen, TSH, TPO), respiratory
          function (including pulmonary function tests), and gastrointestinal status (liver function tests);
          CT or MRI of the chest every three to five years; colonoscopy symptomatically as needed; liver
          ultrasound at baseline and every two to three years; psychiatric assessments as needed.'
        supports: SUPPORT
