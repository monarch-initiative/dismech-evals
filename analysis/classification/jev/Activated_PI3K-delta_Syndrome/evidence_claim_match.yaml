      assertion_type: Diagnosis
      assertion:
        name: Enhanced phospho-AKT in circulating B cells
        description: Flow cytometric measurement of AKT phosphorylation at Ser473 in CD19+ peripheral
          blood B cells is a supportive functional biomarker of PI3K-delta hyperactivation. Enhanced pAKT,
          particularly in CD10+ immature B cells, may help distinguish PI3K-pathway hyperactivation from
          common variable immunodeficiency and CD40L-related hyper-IgM syndrome, but the assay remains
          incompletely validated. Because this functional abnormality can also occur in PTEN-related APDS-like
          immunodeficiency, it complements but does not replace subtype-defining molecular testing.
        diagnosis_term:
          preferred_term: phospho-AKT flow cytometry
          term:
            id: NCIT:C16585
            label: Flow Cytometry
        results: Elevated phospho-AKT (Ser473) in CD19+ B cells, most pronounced in CD10+ immature B cells;
          normalized by p110delta inhibitor
      selected_evidence:
        snippet: These results suggest that the enhanced pAKT in circulating B cells may be useful for
          the discrimination of APDS1, APDS2, and APDS-L from other antibody deficiencies.
        supports: SUPPORT
