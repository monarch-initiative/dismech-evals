      assertion_type: Discussion
      assertion:
        discussion_id: mcpg_contribution_to_ackee_illness
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How much does co-exposure to methylenecyclopropylglycine contribute to symptomatic human
          ackee poisoning?
        attaches_to:
        - pathophysiology#Hypoglycin A Ingestion
        rationale: MCPG-related conjugates have been detected after ackee consumption, including in a
          volunteer study, but an exposed volunteer is not a clinical Jamaican vomiting sickness cohort.
          HGA remains the main established toxin. Quantitative clinical attribution and potential co-toxin
          effects remain unresolved.
        proposed_experiments:
        - experiment_id: paired_toxin_metabolite_sampling
          name: Prospective paired toxin and metabolite sampling
          description: Measure HGA, MCPG and conjugates over time in clinically characterized poisoning
            cases and asymptomatic people sharing the implicated food; record dose, preparation, nutritional
            status and sampling delay.
          decision_criterion: Determine whether MCPG exposure or its metabolites associate with clinical
            severity after accounting for HGA exposure and sampling time.
          supporting_outcome:
          - A reproducible adjusted association would support a co-toxin contribution and justify targeted
            mechanistic testing.
          refuting_outcome:
          - Absence of an association would weaken the proposed contribution within the sampled exposures,
            without proving HGA acts alone.
        notes: The 2021 foal report inferred long-chain enoyl-CoA hydratase dysfunction from acylcarnitines;
          no enzyme assay or genetic confirmation was available. It does not establish a corresponding
          human ackee mechanism.
      selected_evidence:
        snippet: Both metabolites were detected in urine after ingestion of ackee as well as litchi fruit.
          These results created a renewed interest in cases of JVS, with respect to whether MCPG may be
          a causative agent along with HGA.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
