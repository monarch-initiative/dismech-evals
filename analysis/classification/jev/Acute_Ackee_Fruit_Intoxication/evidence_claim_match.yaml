      assertion_type: AnimalModel
      assertion:
        name: Hypoglycin A and MCPA immersion in zebrafish embryos and larvae
        species: Zebrafish (Danio rerio)
        publication: PMID:39459322
        description: Wild-type AB embryos were exposed by immersion beginning at 24 hours after fertilization,
          with monitoring through 96 hours. HGA and MCPA produced mortality, bradycardia and cardiac edema,
          with later toxicity onset after HGA; MCPA also reduced swimming under selected exposure conditions.
          The model was developed for Sapindaceae-associated equine atypical myopathy and captures shared
          toxin biology rather than human ackee ingestion or a demonstrated human hypoglycemic syndrome.
          Whole-body metabolite and locomotor experiments each had one experimental replicate; metabolomics
          pooled twenty larvae per concentration. Mortality assays used biological triplicates. Glycine
          and carnitine co-exposure reduced 72-hour mortality, whereas riboflavin did not protect in this
          protocol. Compounds were added simultaneously with toxin, so this is prevention/co-treatment
          evidence, not treatment after established poisoning. Surviving larvae could retain cardiac abnormalities.
          MCPrG caused no observed toxicity in this exposure system, but uptake and activation were unresolved;
          the result does not establish safety in mammals.
        modeled_mechanisms:
        - target: MCPA-CoA Formation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: HGA-exposed larvae accumulated the downstream conjugate MCPA-carnitine.
          limitations: Indirect bioactivation readout from pooled whole-body material with no biological
            replicate series; neither MCPA-CoA nor a specific activating enzyme was directly quantified.
            Immersion differs from oral human exposure.
          readouts:
          - name: Whole-body MCPA-carnitine after HGA exposure
            target: MCPA-CoA Formation
            direction: INCREASED
            interpretation: A conjugated metabolite supports bioactivation but does not quantify the active
              CoA ester.
        - target: Impaired Fatty Acid Beta-Oxidation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Short- and medium-chain acylcarnitine changes provide indirect evidence of disturbed
            fatty-acid metabolism.
          limitations: Acylcarnitine accumulation does not isolate beta-oxidation flux or individual acyl-CoA
            dehydrogenases, and the pooled metabolic time course was not biologically replicated. Human
            glucose production, ketogenesis and clinical treatment response were not established.
          readouts:
          - name: Whole-body acylcarnitine profile
            target: Impaired Fatty Acid Beta-Oxidation
            direction: INCREASED
            interpretation: C6, C8 and C10 acylcarnitines increased after HGA exposure; these are metabolic
              proxies.
      selected_evidence:
        snippet: Twenty fertilised eggs per concentration and four eggs for the negative control (E3)
          were exposed from approximately 24 hpf until 96 hpf with one egg per well in 24 well-plates
          (2 mL per well) or in 96 well-plates (120 μL per well) for MCPA and HGA, respectively.
        supports: SUPPORT
        directness: DIRECT
