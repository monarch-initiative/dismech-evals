        context: []
      assertion_type: Treatment
      assertion:
        name: Safe harvesting, preparation and exposure prevention
        description: Use fully mature naturally opened fruit, remove seeds and raphe, and follow reliable
          processing controls. Do not force open or heat-shock immature fruit to accelerate opening; cooking
          does not make toxic unripe fruit safe. Educate households and evaluate other exposed people
          after a shared meal.
        notes: The final April 2014 FDA guide treats more than 100 ppm hypoglycin A in finished products
          as an action criterion for improper processing; this is a food-control policy, not a clinical
          poisoning threshold. Its guidance is nonbinding except where it cites statutory requirements.
      selected_evidence:
        snippet: Prior to further processing and packaging, the black seeds and raphe are removed, and
          the arils are visually inspected for damage, blemishes, or signs of spoilage.
        supports: SUPPORT
        directness: DIRECT
