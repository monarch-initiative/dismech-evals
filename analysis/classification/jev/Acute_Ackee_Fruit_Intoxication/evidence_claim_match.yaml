          experimental or anecdotal use, without established clinical efficacy; coadministration of vitamin
          B complex in the sibling series cannot identify a vitamin-specific treatment effect.
      selected_evidence:
        snippet: Patients with persistent hypoglycemia, seizures, metabolic acidosis, altered mental status,
          or poor perfusion frequently require intensive care unit admission.
