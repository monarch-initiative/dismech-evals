          patterns in hypoglycin-exposed horses support a comparative acquired-MADD mechanism; they do
          not prove that every human poisoning profile is identical to inherited MADD.
        distinguishing_features:
        - A compatible shared-food or preserved-ackee exposure supports poisoning.
        - Toxin-specific metabolites support exposure when demonstrable; absence depends on sampling and
          assay.
