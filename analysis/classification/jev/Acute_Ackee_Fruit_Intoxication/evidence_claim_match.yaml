          exposure_duration:
          - classification_value: ACUTE
        notes: The broad toxin exposure term is retained with a specific food-source annotation. The 2011
          fruit study measured residual hypoglycin A in ripe Cheese arils (271 mg/kg); maturity is not
          a claim of zero toxin in every sample. The FDA food action criterion is not a human toxic-dose
          threshold.
