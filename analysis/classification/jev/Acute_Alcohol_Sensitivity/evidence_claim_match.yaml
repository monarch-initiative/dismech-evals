      assertion_type: ModelMechanismLink
      assertion:
        target: Acetaldehyde Accumulation After Ethanol Exposure
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Knockout mice exposed to ethanol or acetaldehyde show higher blood acetaldehyde and
          greater toxicity than wild-type, which is the defining biochemical feature of the human disorder.
        limitations: A null allele models homozygous ALDH2 inactivity, not the heterozygous dominant-negative
          state that most affected humans carry; the human phenotype's hallmark - that one poisoned subunit
          disables the tetramer - cannot be represented by an absent protein. The cited source is also
          a review rather than primary data.
        readouts:
        - name: Blood acetaldehyde after ethanol or acetaldehyde exposure
          target: Acetaldehyde Accumulation After Ethanol Exposure
          direction: INCREASED
          interpretation: Higher blood acetaldehyde in knockouts than wild-type reproduces the human biochemical
            phenotype.
      selected_evidence:
        snippet: Aldh2 knockout mice appear to be a valid animal model for humans with inactive ALDH2
        supports: SUPPORT
