            description: 'The standard rodent model of human ALDH2 inactivity. Note the allelic mismatch:
              this is a null, whereas the common human allele rs671 is a dominant-negative missense subunit
              that assembles into tetramers. The null reproduces the *consequence* (no ALDH2 activity,
              acetaldehyde accumulation) without reproducing the *mechanism* by which a single human allele
              achieves it. The source is a review of published Aldh2-knockout studies rather than a single
              primary experiment.'
