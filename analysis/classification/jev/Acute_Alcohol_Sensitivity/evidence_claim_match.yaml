  c854a85c92a0c5775bd055549155e3ccd195cf0a3e10ca61b3e284e41f89eada:
    claim:
      about:
        disease:
          name: Acute Alcohol Sensitivity
          disease_term:
            preferred_term: acute alcohol sensitivity
            term:
              id: MONDO:0012454
              label: alcohol sensitivity, acute
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Tetrameric ALDH2 Catalytic Activity
        biological_scale: MOLECULAR
        description: 'The mitochondrial low-Km aldehyde dehydrogenase that oxidises acetaldehyde to acetate
          loses activity. Because ALDH2 is the low-Km enzyme, it is what normally keeps circulating acetaldehyde
          near zero during drinking, and there is no redundant activity that substitutes at physiological
          concentrations.

          No GO annotation for tetramer assembly is attached to this node, and the omission is deliberate:
          assembly behaves *oppositely* across the alleles that reach this node. The dominant rs671 subunit
          assembles normally and poisons the tetramer it joins - that is precisely what "dominant negative"
          means here, and annotating decreased homotetramerization would state the opposite. p.Arg101Gly,
          by contrast, does show a lack of functional dimer/tetramer formation. A single-valued modifier
          cannot carry both, so the distinction is stated here and in the two downstream evidence items
          rather than flattened into one wrong annotation.'
        molecular_functions:
        - preferred_term: aldehyde dehydrogenase (NAD+) activity
          modifier: DECREASED
          term:
            id: GO:0004029
            label: aldehyde dehydrogenase (NAD+) activity
        biological_processes:
        - preferred_term: ethanol catabolic process
          modifier: DECREASED
          term:
            id: GO:0006068
            label: ethanol catabolic process
      selected_evidence:
        snippet: About half of Chinese individuals lack mitochondrial aldehyde dehydrogenase-2 (ALDH2)
          activity, which is responsible for the oxidation of acetaldehyde produced during ethanol metabolism.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
