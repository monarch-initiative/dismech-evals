            term:
              id: MONDO:0012454
              label: alcohol sensitivity, acute
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Alcohol Use Disorder
        description: Not a diagnostic confusion so much as the mechanistic mirror image, and the reason
          this entry matters to the rest of the knowledge base. The same inactive ALDH2 allele that *causes*
          acute alcohol sensitivity is one of the two largest-effect *protective* loci against alcohol
          use disorder, because the reaction is aversive. `Alcohol_Use_Disorder` already curates ALDH2
          in that protective role; this entry curates the disorder that produces the aversion.
        disease_term:
          preferred_term: alcohol use disorder
          term:
            id: MONDO:0007079
            label: alcohol dependence
        distinguishing_features:
        - Opposite direction of the same allele - carriers are less likely, not more likely, to develop
          dependence.
        - Acute alcohol sensitivity is an exposure-triggered metabolic reaction with an onset in minutes;
          alcohol use disorder is a chronic behavioural condition.
        - A carrier who abstains has neither condition; a carrier who drinks despite the reaction carries
          elevated cancer risk without necessarily meeting dependence criteria.
      selected_evidence:
        snippet: reported to be a negative risk factor for development of alcohol dependence
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
