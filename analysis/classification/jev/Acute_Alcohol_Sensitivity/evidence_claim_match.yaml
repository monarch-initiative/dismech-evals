        context:
        - path: /pathophysiology/2
          value:
            name: Ethanol Oxidation to Acetaldehyde by Alcohol Dehydrogenase
            biological_scale: MOLECULAR
            description: 'Ingested ethanol is oxidised to acetaldehyde by alcohol dehydrogenase before
              ALDH2 has anything to clear. This node exists because acetaldehyde exposure is set by the
              *ratio* of two enzyme steps, not by ALDH2 alone: the fast-metabolizing ADH1B*2 allele raises
              the production rate, and the slow-metabolizing ADH1B*1/*1 genotype lowers it. That is why
              ADH1B genotype modifies risk on top of ALDH2, and why the combination is far more informative
              than either alone.'
            molecular_functions:
            - preferred_term: alcohol dehydrogenase (NAD+) activity
              term:
                id: GO:0004022
                label: alcohol dehydrogenase (NAD+) activity
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Acetaldehyde Accumulation After Ethanol Exposure
        causal_link_type: DIRECT
        description: Acetaldehyde produced here is what accumulates when ALDH2 cannot clear it. The two-enzyme
          balance is why ADH1B genotype modifies the phenotype.
      selected_evidence:
        snippet: The combination of ADH1B*1/*1 and ALDH2*1/*2 markedly increased the risk of esophageal
          DIULs ≥5 mm (39.3 [10.6-146]).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2/downstream/0
      evidence_path: /pathophysiology/2/downstream/0/evidence/0
