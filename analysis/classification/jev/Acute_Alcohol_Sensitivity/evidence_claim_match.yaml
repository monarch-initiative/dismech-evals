  4e1426d26464558927fff75192dbf7fe6261125836dad592d0fa6ec59e139350:
    claim:
      about:
        disease:
          name: Acute Alcohol Sensitivity
          disease_term:
            preferred_term: acute alcohol sensitivity
            term:
              id: MONDO:0012454
              label: alcohol sensitivity, acute
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Disulfiram-ethanol reaction
        description: A pharmacologically identical syndrome produced on purpose. Disulfiram inhibits ALDH2,
          so a patient taking it who drinks develops flushing, nausea and tachycardia by the same acetaldehyde-accumulation
          mechanism curated here. Cyanamide is another ALDH inhibitor used the same way. The distinguishing
          feature is drug exposure, not phenotype - which is a useful reminder that the mechanism, not
          the genotype, produces the syndrome.
        distinguishing_features:
        - Acquired and reversible on stopping the drug, rather than lifelong.
        - No family history; onset coincides with starting an ALDH-inhibiting drug.
        - Genotyping is normal at ALDH2 unless the patient also carries an inactivating variant, in which
          case the reaction is more severe.
      selected_evidence:
        snippet: Aldehyde dehydrogenase 2 (ALDH2) is critical for alcohol metabolism by converting acetaldehyde
          to acetic acid.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39075523
      reference_title: Uncovering newly identified aldehyde dehydrogenase 2 genetic variants that lead
        to acetaldehyde accumulation after an alcohol challenge.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the shared enzymatic step that a pharmacological ALDH2 inhibitor blocks. Graded
        PARTIAL because this entry holds no source characterising the disulfiram reaction itself; that
        claim rests on the shared mechanism, and a curator adding disulfiram detail should cite a source
        for it.
