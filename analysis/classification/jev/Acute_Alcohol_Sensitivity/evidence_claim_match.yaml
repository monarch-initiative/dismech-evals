  b91762e15814dfa6e70a454559f1d8e8b9a1b766fbb0d2bda0e8c228c3f825b1:
    claim:
      about:
        disease:
          name: Acute Alcohol Sensitivity
          disease_term:
            preferred_term: acute alcohol sensitivity
            term:
              id: MONDO:0012454
              label: alcohol sensitivity, acute
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Flushing history
        description: 'Asking whether alcohol has previously caused facial flushing identifies ALDH2 deficiency
          without a laboratory test, because the reaction is intense enough that affected people are aware
          of it. The authors of the landmark paper propose this explicitly as a clinical screening question
          and the basis for counselling and, in high-risk patients, endoscopic screening.

          Its performance is good but population-dependent, and the dependence runs the wrong way for
          the people most at risk. In male clinic patients aged 50 and over, a validated flushing questionnaire
          had 96.1% sensitivity and 79.0% specificity for inactive ALDH2 - better on both counts than
          the ethanol patch test (72.4% / 71.4%), which is worth stating because the patch test is sometimes
          proposed as the more objective alternative. But in 472 Japanese *alcohol-dependent women*, sensitivity
          fell to 50.0%, against 88% previously reported in the Japanese general female population. The
          authors'' inference is the mechanistically interesting one: a *lack* of flushing may itself
