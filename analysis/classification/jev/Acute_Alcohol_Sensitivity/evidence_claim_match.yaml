        features: 'Alcohol dehydrogenase 1B, the upstream enzyme of the same two-step pathway. It does
          not cause acute alcohol sensitivity, but it sets the rate at which the acetaldehyde ALDH2 must
          clear is produced, so it modifies both the reaction and the downstream cancer risk. The slow-metabolizing
