          iodine-unstained lesions than either genotype alone: in PMID:30629674''s multiple logistic models
          the separate odds ratios were 12.5 and 9.89 for ADH1B*1/*1 and 2.94 and 3.79 for ALDH2*1/*2,
          against 39.3 for the combination. Note that ADH1B carried the larger independent effect in that
          cohort - a reason not to treat ALDH2 genotype as the whole story.'
