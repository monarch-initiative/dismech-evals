      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: immune_boundary_injury
        hypothesis_label: Immune-mediated boundary-injury model
        status: EMERGING
        description: The visible gray annular border has been proposed to represent an advancing immune
          boundary between normal and abnormal outer retina. Antiretinal antibodies have also been reported
          in AAOR, but neither finding establishes a specific antigen, effector pathway, or causal autoimmune
          mechanism.
      selected_evidence:
        snippet: We speculate that this disorder is part of the spectrum of acute zonal occult outer retinopathy
          and that the gray border, which separates the normal from the abnormal retina, represents an
          immune ring phenomenon.
        supports: SUPPORT
