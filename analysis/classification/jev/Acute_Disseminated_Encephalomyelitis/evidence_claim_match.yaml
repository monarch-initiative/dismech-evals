  ee1c7ebf8292616b86d5379dcfba0bab8d51e0dc0264d8f61c58f76d723bccd7:
    claim:
      about:
        disease:
          name: Acute Disseminated Encephalomyelitis
          disease_term:
            preferred_term: acute disseminated encephalomyelitis
            term:
              id: MONDO:0019383
              label: acute disseminated encephalomyelitis
        context: []
      assertion_type: Definition
      assertion:
        name: IPMSSG pediatric clinical definition
        definition_type: CASE_DEFINITION
        description: 'The IPMSSG definition applies to pediatric ADEM: a first polyfocal clinical CNS
          event of presumed inflammatory demyelinating cause, encephalopathy not explained by fever or
          a postictal state, and an abnormal brain MRI during the acute phase. Symptoms or MRI changes
          during the first three months may represent evolution or treatment-related fluctuation of the
          same event. Infectious, inflammatory, neoplastic, metabolic, genetic, and other mimics must
          be excluded. There is no equivalently accepted international adult case definition, so adult
          diagnosis is an extrapolation supported by compatible clinical and radiologic findings and exclusion
          of alternatives.'
        criteria_sets:
        - name: Core clinical features
          core_clinical_characteristics:
          - preferred_term: Encephalopathy
            term:
              id: HP:0001298
              label: Encephalopathy
          - preferred_term: CNS demyelination
            term:
              id: HP:0007305
              label: CNS demyelination
          - preferred_term: Multifocal neurologic deficits
            term:
              id: HP:0012638
              label: Abnormal nervous system physiology
            description: HPO lacks a single term for polyfocal neurologic deficits; this descriptor captures
              the broad CNS physiologic disturbance while the entry's individual phenotypes encode the
              component neurologic findings.
      selected_evidence:
        snippet: Diagnostic evaluation for ADEM involves neuroimaging and laboratory studies to exclude
          potential infectious, inflammatory, neoplastic, and genetic mimics of ADEM.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
