      assertion_type: Subtype
      assertion:
        name: Multiphasic ADEM
        description: The classic IPMSSG construct is one ADEM attack followed more than three months later
          by a second ADEM episode with renewed encephalopathy, new polyfocal findings, and new MRI lesions,
          without further attacks. More than two attacks or later non-ADEM attacks should prompt reassessment
          for MOGAD, multiple sclerosis, NMOSD, or another diagnosis.
      selected_evidence:
        snippet: MDEM is defined as an ADEM attack followed >3 months later by a second ADEM episode without
          any further attacks
        supports: SUPPORT
