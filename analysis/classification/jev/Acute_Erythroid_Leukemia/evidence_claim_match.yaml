        description: The congenital dyserythropoietic anemias (CDAs) are inherited disorders of erythroid
          differentiation/proliferation that produce dysplastic erythroid precursors (multinuclearity,
          internuclear chromatin bridging) and ineffective erythropoiesis, morphologically overlapping
          with the dyserythropoiesis of AEL but arising from germline variants rather than an acquired,
          TP53-driven clonal leukemic process.
        distinguishing_features:
        - CDA presents from infancy/childhood with a chronic, non-progressive course and a specific germline
          genetic cause (e.g., CDAN1, SEC23B, KLF1), without biallelic TP53 alteration, complex karyotype,
          or blast excess.
        - CDA shows characteristic ultrastructural findings (e.g., binuclearity, chromatin bridges, or
          a spongy heterochromatin pattern depending on type), whereas AEL shows leukemic proerythroblast-predominant
          dysplasia.
        - AEL is acquired, typically presents in older adults, and carries the TP53/cytogenetic abnormalities
          characteristic of clonal leukemia.
      selected_evidence:
        snippet: Congenital dyserythropoietic anemias (CDAs) are a heterogeneous group of inherited anemias
          that affect the normal differentiation-proliferation pathways of the erythroid lineage.
        supports: SUPPORT
