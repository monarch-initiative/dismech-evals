          phenotype, carries focal gains or amplifications of EPOR and/or JAK2 (sometimes with activating
          point mutations in either gene), resulting in enhanced STAT5 pathway activation. This erythropoietin-axis
          signaling amplification is a proliferative driver largely specific to AEL among TP53-mutated
          myeloid neoplasms and confers even worse prognosis than TP53 mutation alone.
        genes:
        - preferred_term: EPOR
