  d70021312cbfdfca4e1c85d76822408abfaef8ef5f143e213d03a72e1bf0e7c7:
    claim:
      about:
        disease:
          name: Acute Erythroid Leukemia
          disease_term:
            preferred_term: acute erythroid leukemia
            term:
              id: MONDO:0017858
              label: acute erythroid leukemia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ael-classification-boundary-controversy
        kind: CONTROVERSY
        prompt: Should AEL/pure erythroid leukemia be defined by erythroid lineage percentage and morphology
          (the WHO-HAEM5 approach) or unified with other TP53-mutated AML/MDS by genomic profile alone
          (the position argued by Iacobucci et al. and reflected in part by the ICC)?
        status: OPEN
        rationale: A comprehensive genomic comparison of AEL against non-erythroid AML and MDS found that
          the mutational spectrum of AEL is statistically distinct from both, arguing against collapsing
          AEL into either category on genomic grounds even though TP53 mutation is common to all three.
          This directly contests the WHO 2016 blast-percentage-driven reclassification of the erythroid/myeloid
          (M6a) category into MDS, and is in tension with the ICC's decision to fold pure erythroid leukemia
          into a TP53-unified AML category rather than keep a distinct erythroid entity.
        attaches_to:
        - pathophysiology#Biallelic TP53 Inactivation
        notes: Recorded so this entry does not silently pick one classification vintage as though the
          boundary were settled; see the `definitions` block for the WHO-HAEM5, ICC, and retired FAB/WHO
          2001-2016 positions.
      selected_evidence:
        snippet: Thus, mutational prevalence varies significantly between the three major subtypes of
          myeloid neoplasms (AEL, non-erythroid AML and MDS) in both children and adults, suggesting the
          recent reclassification of many AEL case as MDS or AML is unfounded from a mutational perspective.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30926971
      reference_title: Genomic subtyping and therapeutic targeting of acute erythroleukemia.
      evidence_source: HUMAN_CLINICAL
      explanation: A large genomic cohort argues the mutational spectrum of AEL is distinguishable from
        MDS and non-erythroid AML, contesting the blast-percentage-only rationale for the WHO 2016 reclassification
        of the erythroid/myeloid category. Marked PARTIAL because this is one cohort's argument, not a
        settled resolution, and the current WHO-HAEM5 and ICC positions differ from it in different directions.
