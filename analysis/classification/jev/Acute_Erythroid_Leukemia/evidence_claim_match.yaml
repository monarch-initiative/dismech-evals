            label: erythropoietin-mediated signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: In addition to activation of the STAT5 pathway, a common feature across all AEL cases,
          these AEL cases exhibited enhanced cell proliferation and heme metabolism and often showed high
          sensitivity to ruxolitinib in vitro and in xenograft models, highlighting a potential role of
          JAK2 inhibition in therapeutics of AEL.
        supports: SUPPORT
