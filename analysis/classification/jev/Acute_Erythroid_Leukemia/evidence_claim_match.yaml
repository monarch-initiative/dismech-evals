              label: acute erythroid leukemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Erythroid Maturation Arrest at the Proerythroblast Stage
        biological_scale: CELLULAR
        role: central_effector
        description: The defining cellular phenotype of AEL is a block in erythroid differentiation at
          the proerythroblast stage. Mechanistic modeling shows that a cooperating lesion (the pediatric
          NFIA-ETO2 fusion is the best characterized example) can impair terminal erythroid differentiation
          by shifting occupancy of erythroid regulatory elements from GATA-motif to ETS-motif-containing
          target genes, repressing the terminal differentiation program; this differentiation block cooperates
          with, rather than requires, the TP53-mutant clone's separately conferred survival and self-renewal
          advantage.
        cell_types:
        - preferred_term: proerythroblast
          term:
            id: CL:0000547
            label: proerythroblast
        genes:
        - preferred_term: GATA1
          term:
            id: hgnc:4170
            label: GATA1
        biological_processes:
        - preferred_term: Erythrocyte Differentiation
          term:
            id: GO:0030218
            label: erythrocyte differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: in the presence of 1 of the most prevalent erythroleukemia-associated mutations, TP53R248Q,
          expression of NFIA-ETO2 resulted in aberrant clonogenic activity and induced a fully penetrant
          transplantable PEL-like disease in mice.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36735909
      reference_title: The NFIA-ETO2 fusion blocks erythroid maturation and induces pure erythroid leukemia
        in cooperation with mutant TP53.
      evidence_source: MODEL_ORGANISM
      explanation: Shows the maturation-arrest lesion cooperates with mutant TP53 to produce a fully penetrant
        pure-erythroid-leukemia-like disease, supporting the causal link modeled here between the two
        upstream pathophysiology arms and this differentiation-arrest node.
