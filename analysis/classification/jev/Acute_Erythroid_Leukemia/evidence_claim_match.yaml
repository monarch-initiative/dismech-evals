        description: AEL/pure erythroid leukemia is characterized by extensive karyotypic complexity,
          including a high rate of chromothripsis (massive, single-event chromosome shattering and reassembly)
          that is significantly enriched in TP53-mutated cases relative to MDS and non-erythroid AML.
          Karyotype is complex in essentially all cases and monosomal in the large majority, with deletions
          in 5q and 7q, monosomy 5/7, trisomy 8, and 17p13 abnormalities (the region containing TP53 itself)
          among the most common recurrent findings.
