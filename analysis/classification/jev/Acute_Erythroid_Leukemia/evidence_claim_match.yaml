  376461b7007af533d2fbef2387d97e025fc0596aa4fd9c7329488df13a721992:
    claim:
      about:
        disease:
          name: Acute Erythroid Leukemia
          disease_term:
            preferred_term: acute erythroid leukemia
            term:
              id: MONDO:0017858
              label: acute erythroid leukemia
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Rapid Clinical Decline Despite Treatment
        notes: Reported outcomes are extremely poor overall. A 41-case, entirely TP53-biallelic Mayo Clinic
          series treated across the modern HMA/HMA plus venetoclax/intensive-chemotherapy/supportive-care
          spectrum saw no responses or transplants and a median survival of 1.8 months. A larger, more
          heterogeneous 217-patient multinational cohort using older definitions reported a longer median
          overall survival, and the small subset of patients who reached allogeneic transplant fared substantially
          better than those who did not (see the Allogeneic Hematopoietic Cell Transplantation treatment
          entry) - underscoring that reaching deep remission and transplant, not any single drug regimen,
          is the main outcome-modifying factor identified so far.
      selected_evidence:
        snippet: no responses or allogeneic stem cell transplants were documented, and all patients died
          at a median 1.8 months (range 0.2-9.3).
        supports: SUPPORT
    origin:
      assertion_path: /progression/1
      evidence_path: /progression/1/evidence/0
