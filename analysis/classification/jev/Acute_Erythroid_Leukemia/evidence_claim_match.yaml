        name: Myelodysplastic Syndrome with Erythroid Predominance
        disease_term:
          preferred_term: myelodysplastic syndrome
          term:
            id: MONDO:0018881
            label: myelodysplastic syndrome
        description: 'Myelodysplastic syndrome can present with marked erythroid hyperplasia and dysplasia,
          and this is precisely the diagnostic space the retired "erythroid/myeloid" (M6a) AEL category
          was reclassified into under WHO 2016: cases with erythroid predominance but blast counts and
          biology below the current AEL threshold are now diagnosed as MDS rather than AEL.'
        distinguishing_features:
        - Diagnosis turns on the current WHO-HAEM5 blast/proerythroblast thresholds (AEL requires marked
          erythroid predominance with >=30% proerythroblasts).
        - Biallelic TP53 alteration with complex/monosomal karyotype favors AEL/pure erythroid leukemia,
          while lower blast counts, non-TP53 MDS-typical mutations (e.g., SF3B1, ASXL1), and a more indolent
          course favor MDS.
        - The ICC's TP53-unified "AML with mutated TP53" category and the ongoing genomic-versus-morphologic
          classification debate (see `discussions`) mean this boundary is actively contested rather than
          fixed.
      selected_evidence:
        snippet: MDS-associated mutations such as SF3B1 and ASXL1 were less frequent in AEL compared to
          MDS
        supports: SUPPORT
