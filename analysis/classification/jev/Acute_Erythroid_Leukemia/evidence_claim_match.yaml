        context: []
      assertion_type: Definition
      assertion:
        name: Retired FAB/WHO 2008-2016 erythroid/myeloid (M6a) category
        definition_type: DIAGNOSTIC_CRITERIA
        scope: Historical FAB and WHO 2001/2008 classification (superseded)
        description: 'The FAB classification and WHO 2001/2008 editions recognized two AEL subtypes by
          erythroid/blast percentage alone: "M6a" (erythroid/myeloid, >=50% erythroid cells plus >=20%
          blasts among non-erythroid cells) and "M6b" (pure erythroid, >=80% erythroid precursors). WHO
          2016 eliminated M6a as an AML entity, reclassifying most such cases as MDS, AML-MR, or AML/MDS
          not otherwise specified based on blast percentage rather than biology; M6b was retained, renamed
          pure erythroid leukemia, and is the direct ancestor of the current WHO-HAEM5 AEL definition.
          This history is recorded here so the historical FAB "M6" label is not read as interchangeable
          with the current, much narrower AEL concept.'
      selected_evidence:
        snippet: M6a was merged into a hybrid subtype of myelodysplasia and AML (specifically, "myelodysplastic
          syndrome (MDS) or AML, not otherwise specified (NOS) (non-erythroid subtype)" based on the percentage
          of blasts in the bone marrow rather than biological or genetic features.
        supports: SUPPORT
