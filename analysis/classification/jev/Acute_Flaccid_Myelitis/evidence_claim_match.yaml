      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ev_d68_direct_neuroinvasion_model
        hypothesis_label: EV-D68 Direct Neuroinvasion Model
        status: CANONICAL
        description: In the best-supported model for epidemic AFM, EV-D68 respiratory infection is followed
          rarely by CNS access, receptor-mediated infection of spinal neural cells, and anterior-horn
          motor-neuron injury. Epidemiologic and human CSF evidence support the association, while mouse
          and organoid systems show that contemporary EV-D68 strains can infect neural tissue and cause
          paralytic myelitis. The model does not imply virologic confirmation in every patient.
      selected_evidence:
        snippet: Virus isolated from spinal cords of infected mice transmitted disease when injected into
          naïve mice, fulfilling Koch's postulates in this model.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
