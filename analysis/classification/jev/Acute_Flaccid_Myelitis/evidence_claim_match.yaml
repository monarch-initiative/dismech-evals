      assertion_type: Treatment
      assertion:
        name: Immunomodulatory acute therapies
        description: Intravenous immunoglobulin, corticosteroids, and plasma exchange have been used empirically
          in AFM, especially early in the syndrome when mimics remain possible. Available clinical evidence
          does not establish that these therapies reverse AFM motor neuron injury, so this entry models
          them as empiric and uncertain rather than proven disease-modifying treatment. Preclinical EV-D68
          AFM-model data further caution against assuming benefit from corticosteroids.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: Dexamethasone treatment worsened motor impairment, increased mortality, and increased
          viral loads.
        supports: SUPPORT
