        prompt: What proportion of human AFM is directly caused by EV-D68 neuroinvasion, and which tests
          can establish that cause in an individual patient?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - infectious_agent#Enterovirus D68
        - pathophysiology#Non-polio Enterovirus Respiratory Infection
        rationale: Outbreak timing, respiratory detections, CSF antibodies, animal causation, and human-organoid
          infection form a coherent causal case. However, viral RNA is rarely detected in human CSF, case-control
          estimates are heterogeneous, and AFM is a syndrome with other infectious and noninfectious mimics.
          The graph therefore treats EV-D68 neuroinvasion as the canonical model for epidemic disease
          without assigning it to every case.
        posed_date: '2026-07-20T00:00:00Z'
