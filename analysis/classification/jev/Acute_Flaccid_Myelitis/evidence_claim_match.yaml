        prompt: Which immune and developmental features must be added to organoid and mouse systems to
          reproduce human AFM motor-neuron loss and recovery?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - experimental_models#Human iPSC-derived spinal cord organoids infected with EV-D68
        - animal_models#mouse
        rationale: Organoids show prolonged productive infection without appreciable cytopathy and lack
          a complete immune compartment. Mice are not native EV-D68 hosts and commonly require neonatal
          or modified conditions. These systems prove mechanistic capabilities but cannot determine the
          human balance between direct infection and immune-mediated injury.
        posed_date: '2026-07-20T00:00:00Z'
      selected_evidence:
        snippet: Mice are not native hosts for EV-D68, and thus, existing mouse models use immunosuppressed
          or neonatal mice, mouse-adapted viruses, or intracranial inoculations.
        supports: SUPPORT
