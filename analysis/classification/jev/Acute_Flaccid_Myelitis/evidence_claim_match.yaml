      assertion:
        name: CSF and respiratory or stool enterovirus testing
        description: CSF cell count and protein are supportive, while respiratory and stool specimens
          should be collected early for enterovirus typing and poliovirus exclusion. A negative CSF PCR
          does not exclude AFM or an enterovirus association because viral RNA is rarely recovered from
          CSF.
        results: Pleocytosis supports CNS inflammation; enterovirus detection outside CSF can support
          an association but does not independently prove viral causation of the neurologic syndrome.
      selected_evidence:
        snippet: An infectious agent is only rarely detected in cerebrospinal fluid (CSF).
