      assertion:
        hypothesis_group_id: canonical_acute_hcv_clearance_persistence_model
        hypothesis_label: Host-virus response balance determines clearance or persistence
        status: CANONICAL
        description: Productive hepatocyte infection generates viremia and innate antiviral activation
          while HCV simultaneously suppresses interferon induction. Adaptive immune responses can accompany
          clearance, but ongoing immune responses and viral escape can coexist with persistence. Hepatocellular
          injury is immune-associated, although the contribution of individual cell populations is not
          fully resolved.
      selected_evidence:
        snippet: Elimination of HCV during acute infection correlates with a rapid induction of innate,
          especially interferon (IFN) induced genes, and a delayed induction of adaptive immune responses.
        supports: SUPPORT
