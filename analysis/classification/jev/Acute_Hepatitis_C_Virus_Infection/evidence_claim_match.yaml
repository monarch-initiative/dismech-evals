      assertion:
        name: Drug-induced liver injury
        disease_term:
          preferred_term: drug-induced liver injury
          term:
            id: MONDO:0005359
            label: drug-induced liver injury
        description: Drug-induced liver injury can closely mimic the hepatocellular presentation of acute
          HCV. Medication and supplement exposure, dechallenge, and formal causality assessment are interpreted
          alongside both anti-HCV and HCV RNA.
        distinguishing_features:
        - A compatible drug or supplement exposure and improvement after withdrawal favor drug-induced
          injury.
        - HCV RNA during an antibody-negative window or longitudinal seroconversion favors acute HCV.
      selected_evidence:
        snippet: These findings indicate that patients presenting with acute hepatocellular injury, even
          with features suggestive of DILI, should be tested for both anti-HCV and HCV RNA to reliably
          exclude acute HCV infection.
