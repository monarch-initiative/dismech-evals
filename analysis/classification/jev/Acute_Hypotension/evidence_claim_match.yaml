    claim:
      about:
        disease:
          name: Acute Hypotension
          disease_term:
            preferred_term: acute hypotension
            term:
              id: MONDO:0005174
              label: acute hypotension
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hypotension_organ_injury_causality
        prompt: When is hypotension a causal driver of organ injury, and when is it primarily a marker
          of illness severity or another upstream process?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Context-Dependent Organ Hypoperfusion
        - pathophysiology#Renal Hypoperfusion and Ischemic Stress
        - phenotypes#Acute kidney injury
        rationale: Observational cohorts repeatedly associate deeper hypotension with adverse outcomes,
          but confounding by illness severity, treatment indication, and concurrent injury pathways limits
          causal interpretation. Kidney outcomes are especially uncertain because the pooled analysis
          did not reproduce the descriptive AKI association.
        proposed_experiments:
        - experiment_id: exp_etiology_stratified_pressure_target_trial
          name: Etiology-stratified perfusion-target trial
          description: Randomize feasible, well-defined hemodynamic subgroups to individualized pressure-target
            strategies while measuring organ-specific perfusion and injury biomarkers, with prespecified
            mediation analysis separating pressure effects from the triggering illness and treatment exposures.
      selected_evidence:
        snippet: Exposure to hypotension during ICU stay was associated with increased mortality and AKI
          in the majority of included studies, and associations for both outcomes increased with increasing
          hypotension severity. The meta-analysis reinforced the descriptive findings regarding mortality
          but did not yield similar support for AKI.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
