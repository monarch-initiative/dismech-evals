        name: Reduced Effective Circulating Volume
        description: Hemorrhage, external fluid loss, or redistribution of intravascular volume can reduce
          venous return, cardiac preload, and stroke volume. Compensatory vasoconstriction may initially
          preserve pressure, whereas severe or rapidly progressive volume loss can produce an acute pressure
          fall.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: At the late stage of severe hemorrhage (equivalent to loss of approximately 30% of blood
          volume), a paradoxical increase of vagal drive may occur leading to a decrease in heart rate,
          and systemic vascular resistance resulting in a reduction of arterial blood pressure, and possibly
          to a circulatory collapse (26, 29, 30).
        supports: SUPPORT
