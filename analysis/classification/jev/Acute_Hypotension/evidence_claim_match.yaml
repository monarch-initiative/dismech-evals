      assertion_type: Discussion
      assertion:
        discussion_id: gap_context_specific_hypotension_threshold
        prompt: Which combinations of absolute pressure, change from baseline, exposure duration, organ-specific
          autoregulatory reserve, and care setting best identify a clinically important acute hypotensive
          episode?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Acute Arterial Pressure Fall
        - diagnosis#Repeated Blood-Pressure Measurement and Trend Assessment
        rationale: Published studies use heterogeneous definitions, and organ perfusion does not map uniformly
          to one arterial-pressure value. A universal cutoff would obscure this heterogeneity, whereas
          purely individualized definitions are difficult to compare and validate.
        proposed_experiments:
        - experiment_id: exp_multicontext_pressure_perfusion_thresholds
          name: Multicontext pressure-perfusion threshold study
          description: Prospectively collect continuous blood pressure, individual baseline pressure,
            exposure duration, organ-perfusion readouts, and adjudicated outcomes across emergency, perioperative,
            and critical-care cohorts, then externally validate context-specific threshold models.
      selected_evidence:
        snippet: Although hypotension is common in acute care, there is a lack of accepted criteria for
          its definition.
        supports: SUPPORT
    origin:
