  bb60598b9a1e6f568e9f74dff8f83d4a5ba53eca42e611d0c6614c8d5b8b482e:
    claim:
      about:
        disease:
          name: Acute Intermittent Porphyria
          disease_term:
            preferred_term: acute intermittent porphyria
            term:
              id: MONDO:0008294
              label: acute intermittent porphyria
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: neural_heme_deficiency_versus_precursor_toxicity
        prompt: Does chronic porphyric neuropathy reflect cumulative circulating-precursor toxicity, or
          heme deficiency and hemeprotein dysfunction inside neural tissue, given that partially PBGD-deficient
          mice degenerate motor axons at normal or near-normal systemic ALA?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Hepatic ALA and PBG accumulation
        - phenotypes#Peripheral neuropathy
        rationale: 'The chronic arm of the classic mouse model does not follow a circulating-precursor
          dose model: motor axon loss accumulated while plasma and urinary ALA were normal or only twofold
          raised, and the authors concluded that heme deficiency and hemeprotein dysfunction can themselves
          cause porphyric neuropathy. The human observation usually cited against a heme-deficiency mechanism
          is the explanted AIP liver, which had sufficient microsomal heme and essentially normal cytochrome
          P450 activities. That measurement was made in liver, in one patient, and says nothing about
          heme status in peripheral nerve or brain. The two claims are therefore not in conflict: generalized
          hepatic heme deficiency is argued against, while neural-tissue heme deficiency remains untested
          in either species. Which mechanism dominates matters clinically, because sustained precursor
          lowering would be expected to halt one and not the other.'
        proposed_experiments:
        - experiment_id: exp_aip_tissue_compartment_heme_status
          name: Neural versus hepatic heme and hemeprotein status under sustained precursor lowering
          description: Measure heme content and hemeprotein-dependent enzyme activities in peripheral
            nerve and CNS tissue alongside liver in partially PBGD-deficient mice carried to the chronic
            neuropathic stage, comparing animals held at near-normal systemic ALA with animals given sustained
            hepatic ALAS1 suppression. Pair the tissue measurements with serial nerve conduction and large-caliber
            axon counts so that neural heme status and axon loss are read out in the same animals.
          would_support:
          - pathophysiology#Hepatic ALA and PBG accumulation
          supporting_outcome:
          - Neural heme and hemeprotein activity are preserved while axon loss tracks cumulative precursor
            exposure, and sustained ALAS1 suppression halts progression.
          refuting_outcome:
          - Neural heme and hemeprotein activity are depleted at near-normal systemic ALA and axon loss
            continues despite sustained precursor lowering.
      selected_evidence:
        snippet: Interestingly, the neuropathy in PBGD-/- mice developed chronically and progressively
          and in the presence of normal or only slightly (twofold) increased plasma and urinary levels
          of the putative neurotoxic heme precursor delta-aminolevulinic acid.
        supports: SUPPORT
