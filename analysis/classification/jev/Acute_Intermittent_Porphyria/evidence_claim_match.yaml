      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_hepatic_precursor_overproduction_model
        hypothesis_label: Canonical Hepatic Precursor Overproduction Model
        status: CANONICAL
        description: Partial HMBS deficiency becomes clinically pathogenic when hepatic ALAS1 is induced,
          leading to excess upstream precursor synthesis and export.
        notes: 'HMBS deficiency and trigger-driven ALAS1 induction are parallel prerequisites for clinically
          important precursor accumulation: the HMBS defect does not itself induce ALAS1. Human intervention
          data support the hepatic precursor-overproduction model, but penetrance, mouse-only hepatic
          energetic effects, and liver-cancer associations are modeled separately.'
      selected_evidence:
        snippet: Biochemical abnormalities are thought to result from primary defects of porphobilinogen
          deaminase (PBGD; also called hydroxymethyl bilane synthase), the third enzyme of the heme synthesis
          pathway, and consecutive hepatic overexpression of the first enzyme of the pathway, 5-aminolevulinate
          synthase.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
