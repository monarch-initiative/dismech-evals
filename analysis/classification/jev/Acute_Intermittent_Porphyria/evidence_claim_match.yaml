        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: noncirrhotic_hepatocarcinogenesis_mechanism
        prompt: By what molecular route does persistent ALA and PBG elevation raise primary liver cancer
          risk in AIP, given that the tumors usually arise without underlying cirrhosis?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Precursor-associated primary liver cancer risk
        - phenotypes#Hepatocellular carcinoma
        rationale: Cohort and case-control data establish that persistently high urinary precursors mark
          a large excess of primary liver cancer, and that the cirrhosis frequency differs from the common
          causes of liver cancer, which implies a route other than cirrhotic regeneration. The proposed
          route is ALA autoxidation generating reactive oxygen species with consequent oxidative DNA and
          mitochondrial damage, but the supporting work is chemical and cell-culture, and the AIP-specific
          transcriptomic study used 25 mM ALA in HepG2 cells, far above attack-range plasma concentrations.
          No in vivo experiment and no somatic mutational analysis of AIP-associated tumors connects chronic
          physiologic precursor exposure to transformation, so the curated edge is kept as an association
          with an unresolved intermediate.
        proposed_experiments:
        - experiment_id: exp_aip_hcc_mutational_signature
          name: Mutational signature analysis of AIP-associated primary liver cancer
          description: Whole-genome sequence AIP-associated liver tumors and compare their mutational
            signatures with non-cirrhotic liver cancers of other aetiologies, testing specifically for
            signatures attributable to oxidative base damage. Where available, relate signature burden
            to the patient's long-term urinary ALA and PBG record.
          would_support:
          - pathophysiology#Precursor-associated primary liver cancer risk
          supporting_outcome:
          - AIP tumors are enriched for oxidative-damage mutational signatures, and signature burden scales
            with lifetime precursor excretion.
          refuting_outcome:
          - AIP tumors carry the same signature profile as other non-cirrhotic liver cancers with no relationship
            to precursor excretion.
      selected_evidence:
        snippet: Sex distribution and frequency of cirrhosis differs from more common aetiologies of primary
          liver cancer.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
