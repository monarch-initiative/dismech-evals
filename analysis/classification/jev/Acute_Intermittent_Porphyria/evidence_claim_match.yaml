        snippet: 'Given the relevant role of the kidney in porphyrin metabolism, the mechanisms possibly
          intervening in causing renal damage in AHPs are different: among others, δ-aminolevulinic acid
          (ALA)-induced oxidative damage on mitochondria, intracellular toxic aggregation of porphyrins
          in proximal tubular cells, and derangements in the delicate microcirculatory balances of the
          kidney might be implicated.'
