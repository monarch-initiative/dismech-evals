        - pathophysiology#Neurovisceral attack susceptibility
        rationale: The classic mouse requires pharmacologic induction and develops progressive neuropathy
          under repeated challenge, whereas the homozygous model has about 5% residual activity and early
          CNS-intrinsic disease. Each addresses a different mechanism boundary and neither reproduces
          the complete natural history of classic heterozygous AIP.
      selected_evidence:
        snippet: Human AIP heterozygotes have episodic acute neurovisceral attacks that typically start
          after puberty, whereas patients with homozygous dominant AIP (HD-AIP) have early-onset chronic
          neurological impairment, including ataxia and psychomotor retardation.
        supports: SUPPORT
