        name: Clinical morphology with skin biopsy and clinicopathologic correlation
        description: Lesions at several stages suggest PLEVA, but biopsy is commonly needed because inflammatory
          eruptions and cutaneous lymphoproliferative disorders can mimic it. Histology must be interpreted
          with the distribution, lesion evolution, and clinical course.
        diagnosis_term:
          preferred_term: skin biopsy
          term:
            id: NCIT:C51692
            label: Skin Biopsy
        results: Supportive findings include interface or lichenoid dermatitis, vacuolar change or necrotic
          keratinocytes, superficial and deep lymphocytes, lymphocytes in adnexal epithelium, perivascular
          or intraepidermal erythrocytes, and a CD8/TIA-1-rich infiltrate. No single feature is pathognomonic.
      selected_evidence:
        snippet: The diagnosis is made by clinical suspicion and confirmed by histology.
        supports: SUPPORT
