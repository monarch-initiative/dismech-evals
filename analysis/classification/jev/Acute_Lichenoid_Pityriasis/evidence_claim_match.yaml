        hypothesis_label: Systemic Hyperinflammatory Escalation Model
        status: EMERGING
        description: In the FUMHD severity variant, the cutaneous cytotoxic process is accompanied by
          high fever and systemic inflammation, and in extreme cases can meet criteria for hemophagocytic
          lymphohistiocytosis (HLH), suggesting a hyperinflammatory escalation beyond ordinary PLEVA.
          Whether HLH is a driver or a downstream complication of severe FUMHD is unresolved.
        notes: Evidence is limited to case-level associations. The HLH association is a single-case observation
          and should be read as an illustrative severe-end phenotype, not an established obligatory mechanism.
          Applies only to the FUMHD subtype, not to uncomplicated PLEVA.
      selected_evidence:
        snippet: The patient also met 7 of 9 HLH-2004 criteria, leading to a diagnosis of HLH.
        supports: SUPPORT
