        hypothesis_label: Cytotoxic T-Cell Epidermal Injury Model
        status: EMERGING
        description: CD8-positive, TIA-1-positive cytotoxic T cells accumulate in PLEVA lesions and may
          contribute to epidermal keratinocyte injury, interface damage, and the papulonecrotic eruption.
          Their causal effector function has not been directly demonstrated.
        notes: PLEVA-specific human tissue supports cytotoxic-cell enrichment and an inferred epidermal-damage
          role. The antigen, effector repertoire, and exact death pathway remain unresolved, so this model
          should not be expanded into unsupported molecular signaling claims.
      selected_evidence:
        snippet: The predominant T-cell infiltrate in PLEVA is dominated by CD8+ cells, and by increased
          numbers of TIA1+ cells, which may indicate a cytotoxic T-cell damage to the epidermis.
        supports: SUPPORT
