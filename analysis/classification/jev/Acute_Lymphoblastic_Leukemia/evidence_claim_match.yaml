      assertion_type: Biochemical
      assertion:
        name: Measurable Residual Disease
        presence: VARIABLE
        notes: MRD is a post-treatment quantitative readout of residual leukemic burden, not a substitute
          for initial lineage and genomic diagnosis. Flow cytometry is established, while high-throughput
          clonotype sequencing can detect additional low-level disease in pediatric B-ALL. Results must
          be interpreted at protocol-defined time points and assay thresholds.
        readouts:
        - target: Common Lymphoblast Clonal Expansion
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: MONITORING
          interpretation: Detectable MRD after therapy reports persistence of the leukemic clone; lower
            or undetectable signal reports deeper response within the limits of the assay used.
        - target: Common Lymphoblast Clonal Expansion
          relationship: PREDICTS
          direction: POSITIVE
          endpoint_context: PROGNOSTIC
          interpretation: Detectable end-induction marrow MRD predicts worse event-free survival; this
            is a prognostic association and does not itself prove that MRD causes relapse.
      selected_evidence:
        snippet: The presence of MRD in day-8 blood and day-29 marrow MRD was associated with shorter
          event-free survival (EFS) in all risk groups; even patients with 0.01% to 0.1% day-29 MRD had
          poor outcome compared with patients negative for MRD patients (59% +/- 5% vs 88% +/- 1% 5-year
          EFS).
        supports: SUPPORT
