        description: B-ALL with a BCR::ABL1-like expression profile but no BCR::ABL1 fusion. Diverse ABL-class,
          JAK-STAT, cytokine-receptor, and other kinase lesions require molecular characterization rather
          than inference from the label.
      selected_evidence:
