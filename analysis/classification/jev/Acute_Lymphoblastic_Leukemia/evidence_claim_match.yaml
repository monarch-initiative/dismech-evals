      assertion_type: Subtype
      assertion:
        name: T-ALL
        display_name: T-cell acute lymphoblastic leukemia
        classification: lineage
        children:
        - ETP-ALL
        description: Precursor T-lineage ALL characterized by recurrent disruption of T-cell transcriptional
          programs, NOTCH1 signaling, cell-cycle control, and other stage-associated pathways.
      selected_evidence:
        snippet: Genetic alterations that activate NOTCH1 signaling and T cell transcription factors,
          coupled with inactivation of the INK4/ARF tumor suppressors, are hallmarks of T-lineage acute
          lymphoblastic leukemia (T-ALL), but detailed genome-wide sequencing of large T-ALL cohorts has
          not been carried out.
        supports: SUPPORT
