        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: emerging_choriocapillaris_perfusion_deficit_model
        hypothesis_label: Emerging Choriocapillaris Perfusion Deficit Model
        status: EMERGING
        description: An alternative hypothesis proposes that the primary perfusion deficit in AMN lies
          in the choriocapillaris and choroid rather than the deep capillary plexus, based on quantitative
          OCTA vessel-area-density analysis finding no retinal-layer flow differences but significantly
          reduced choriocapillaris and choroidal density in COVID-19-associated AMN cases.
        notes: Based on a single small retrospective series (n=6) of SARS-CoV-2-related AMN; the authors
          themselves note this contradicts "the predominant hypothesis in current literature." Retained
          as EMERGING pending independent replication and confirmation in non-COVID AMN cohorts.
      selected_evidence:
        snippet: Our data suggests that a perfusion deficit in the choroidal layers is responsible for
          AMN rather than in the DCP, which is the predominant hypothesis in current literature.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
