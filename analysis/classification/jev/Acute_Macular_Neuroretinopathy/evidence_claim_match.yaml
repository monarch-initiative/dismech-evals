        name: Retinal Deep Capillary Plexus Ischemia
        description: In predisposed individuals, transient microvascular occlusion/ischemia develops in
          the deep capillary plexus (DCP) of the retina, the vascular bed supplying the outer plexiform
          and outer nuclear layers. OCT angiography directly demonstrates a flow void in the DCP co-localized
          with the acute lesion, with partial recovery of flow signal on follow-up in most cases.
        role: trigger
