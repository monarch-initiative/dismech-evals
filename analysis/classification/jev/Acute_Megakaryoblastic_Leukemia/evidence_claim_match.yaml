          KMT2A rearrangements, and NUP98::KDM5A. Broader RNA-based fusion profiling can detect additional
          RBM15::MRTFA and diverse HOX-rearranged subgroups. Molecular assignment supports risk stratification
          because major pediatric subgroups differ in outcome and some lesions are cryptic.
        results: Molecular findings classify recurrent non-DS genomic subgroups and, when interpreted
          with constitutional-versus-acquired chromosome-21 status, support distinction from ML-DS and
          risk stratification.
      selected_evidence:
        snippet: Of the 93 patients for whom sufficient RNA was available ... 72.4% pediatric cases carried
          a structural variation (SV) predicted to lead to a fusion product by RNAseq ... RBM15-MKL1 (10.5%)
          ... Chimeric transcripts not previously described include several fusions involving genes within
          the HOX cluster
        supports: SUPPORT
