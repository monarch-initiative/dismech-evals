      assertion:
        name: Trisomy 21 and GATA1 Truncation Generate GATA1s
        description: In the usual Down syndrome-associated sequence, an acquired GATA1 mutation introduces
          a premature stop in the N-terminal activation domain. Full-length GATA1 is lost while a shorter
          downstream-initiated GATA1s protein is retained. The trisomy-21 fetal hematopoietic context
          and GATA1s cooperate to establish the precursor clone.
        subtypes:
        - Down Syndrome-Associated AMKL
        genes:
        - preferred_term: GATA1
          term:
            id: hgnc:4170
            label: GATA1
        cell_types:
        - preferred_term: megakaryocyte progenitor cell
          term:
            id: CL:0000553
            label: megakaryocyte progenitor cell
      selected_evidence:
        snippet: These mutations prevent synthesis of full-length GATA1, but not synthesis of a shorter
          variant that is initiated downstream.
        supports: SUPPORT
