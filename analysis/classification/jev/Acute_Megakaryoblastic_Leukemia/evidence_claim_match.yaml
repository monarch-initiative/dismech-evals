              usually mutually exclusive molecular subgroups with different outcomes. These are molecular
              subgroups among AML cases with megakaryoblastic differentiation and are not all formal WHO
              disease classes. No exact pediatric-umbrella ontology class is bound here.
            children:
            - RBM15::MRTFA-Rearranged AMKL
            - CBFA2T3::GLIS2-Positive AMKL
            - NUP98::KDM5A-Positive AMKL
            - KMT2A-Rearranged AMKL
            - HOX-Rearranged AMKL
            - GATA1-Mutant Non-Down Syndrome AMKL
          role: subtype
      assertion_type: ProgressionInfo
      assertion:
        phase: Molecularly Stratified Pediatric Relapse Risk
        subtype: Pediatric Non-Down Syndrome AMKL
        notes: Pediatric non-DS AMKL outcome is strongly subgroup-dependent. CBFA2T3::GLIS2 and KMT2A
          rearrangements are adverse; GATA1-mutant and HOXr subgroups had favorable outcomes in the genomic
          cohort. These associations inform risk stratification but do not establish a universal transplant
          indication.
      selected_evidence:
        snippet: GATA1 and HOXr subgroups carried significantly superior outcomes
        supports: SUPPORT
