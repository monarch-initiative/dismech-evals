        name: Cytogenetic Analysis
        diagnosis_term:
          preferred_term: cytogenetic analysis
          term:
            id: NCIT:C18280
            label: Cytogenetic Analysis
        description: Tumor karyotyping and targeted FISH detect chromosome-21 abnormalities, t(1;22),
          KMT2A rearrangements, monosomy 7, and other risk lesions, but tumor testing alone cannot distinguish
          constitutional from acquired trisomy 21. Matched remission or nonhematopoietic tissue is needed
          to resolve that distinction, especially when mosaicism is possible. Cryptic CBFA2T3::GLIS2 and
          NUP98::KDM5A lesions require targeted FISH, RT-PCR, or sequencing rather than conventional karyotyping
          alone.
        results: Recurrent cytogenetic and fusion findings assign subtype and inform pediatric risk stratification.
      selected_evidence:
        snippet: CBFA2T3/GLIS2 was identified in 16% of the cases; RBM15/MKL1, in 12%; NUP98/KDM5A and
          KMT2A rearrangements, in 9% each; and monosomy 7, in 6%.
        supports: SUPPORT
