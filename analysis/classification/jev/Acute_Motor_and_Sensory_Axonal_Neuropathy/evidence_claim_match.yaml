  ca509fc60a06c9d6b9e0d8a08a0a62bb6a093eaf8afabb9d98783a6d1651c5f3:
    claim:
      about:
        disease:
          name: Acute Motor and Sensory Axonal Neuropathy
          disease_term:
            preferred_term: Acute motor and sensory axonal neuropathy
            term:
              id: MONDO:0020348
              label: acute motor and sensory axonal neuropathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_motor_only_models_for_sensory_inclusive_amsan
        prompt: Do current anti-GM1/anti-GD1a motor-axon models reproduce the sensory-axon injury that
          defines human AMSAN?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Classical Complement Activation at Axonal Membranes
        - pathophysiology#Motor and Sensory Axonal Degeneration
        rationale: Existing rabbit, transgenic-mouse, and ex vivo systems convincingly model motor-axon
          antibody/complement injury. Direct human AMSAN pathology instead shows dorsal as well as ventral
          root injury. A sensory-inclusive model is needed before subtype-specific mechanism or therapeutic
          claims are made.
        proposed_experiments:
        - experiment_id: exp_paired_human_motor_sensory_nodal_injury
          name: Paired human motor- and sensory-neuron nodal injury assay
          description: Build matched human iPSC-derived motor-neuron and sensory-neuron systems with Schwann-cell
            myelination and mature nodal domains. Expose both to acute serially confirmed AMSAN IgG with
            human complement; comparator conditions should include heat-inactivated complement, healthy,
            AMAN, AIDP, antigen-depleted, and C1q-inhibited controls. Measure antibody/C1q/C3/MAC deposition,
            conduction, calcium influx, axonal integrity, and sensory-versus-motor susceptibility.
          decision_criterion: A sensory-inclusive model is established if AMSAN IgG causes reproducible
            complement-dependent injury in both compartments, whereas AMAN IgG remains motor-predominant
            and antigen depletion or C1q blockade rescues injury.
          would_support:
          - pathophysiology#Classical Complement Activation at Axonal Membranes
          - pathophysiology#Motor and Sensory Axonal Degeneration
      selected_evidence:
        snippet: wallerian-like degeneration of fibers in the ventral and dorsal roots
        supports: SUPPORT
    origin:
