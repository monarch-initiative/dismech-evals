        discussion_id: gap_seronegative_amsan_antigens
        prompt: What immune targets and effector mechanisms drive clinically compatible AMSAN when standard
          anti-ganglioside antibodies are absent?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cross-Reactive Anti-Ganglioside IgG Response
        rationale: Ganglioside antibodies occur in only a subset of GBS, and routine testing has limited
          clinical value. Treating the canonical GM1/GD1a mechanism as universal would erase seronegative
          disease and mechanisms following non-C. jejuni antecedents.
        proposed_experiments:
        - experiment_id: exp_seronegative_amsan_unbiased_antigen_screen
          name: Unbiased seronegative AMSAN neural-surface antigen discovery
          description: Screen acute serum and CSF from serially confirmed seronegative AMSAN against live
            human motor-neuron, sensory-neuron, and Schwann-cell nodal cultures, followed by immunoprecipitation-mass
            spectrometry, antigen validation, complement-deposition assays, and longitudinal titer-outcome
            analysis with GBS-subtype and healthy controls.
          decision_criterion: A candidate is prioritized if disease-phase IgG binds a reproducible neural
            surface target, deposits complement or disrupts conduction, declines with recovery, and is
            enriched over control groups.
          would_support:
          - pathophysiology#Ganglioside Antibody Binding at Nodal and Axolemmal Membranes
      selected_evidence:
        snippet: Whether ganglioside-seronegative patients have other antibodies relevant to GBS is currently
          unclear.
        supports: SUPPORT
