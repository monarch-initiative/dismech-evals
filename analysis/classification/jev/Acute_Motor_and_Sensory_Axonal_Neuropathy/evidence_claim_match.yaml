            id: NCIT:C38081
            label: Pulmonary Function Test
        notes: Standard inpatient prevention also addresses aspiration, venous thrombosis, pressure injury,
          infection, corneal injury in facial weakness, contracture, nutrition, communication, and psychological
          distress.
