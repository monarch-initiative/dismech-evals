        prompt: Should poor predicted prognosis or initial non-response prompt routine corticosteroids,
          a second IVIG course, or immediate plasma exchange followed by IVIG?
        kind: INTERPRETATION
        status: RESOLVED
        attaches_to:
        - disease#Acute Motor and Sensory Axonal Neuropathy
        rationale: These regimens can be mistaken for positive treatment options if represented as ordinary
          treatment nodes. Current guideline and randomized evidence do not support routine use for poor
          prognosis or initial non-response.
        posed_date: '2026-07-18T00:35:23Z'
        resolved_date: '2026-07-18T00:35:23Z'
        resolution_note: Do not represent these regimens as routine beneficial AMSAN treatments. True
          treatment-related fluctuation after stabilization or improvement is a separate scenario in which
          specialist-guided re-treatment may be considered.
      selected_evidence:
        snippet: recommends against using oral corticosteroids, and weakly recommends against using IV
          corticosteroids
        supports: SUPPORT
