      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: antiganglioside_complement_axonal_injury
        hypothesis_label: Antiganglioside-complement nodopathy-to-axonopathy continuum
        status: CANONICAL
        description: In the seropositive and especially C. jejuni-associated axonal GBS subset, molecular
          mimicry generates cross-reactive anti-ganglioside IgG. Antibody binding at nodal and axolemmal
          sites activates classical complement, producing a continuum from reversible nodal conduction
          failure to macrophage-associated irreversible motor and sensory axonal degeneration.
        notes: Canonical does not mean universal. Ganglioside antibodies are absent in a substantial fraction
          of GBS, viral and other antecedents remain mechanistically unresolved, and the sensory-axon
          target in AMSAN is less experimentally developed than the motor-axon arm.
      selected_evidence:
        snippet: acute motor axonal neuropathy, acute motor and sensory neuropathy and acute sensory neuropathy
          and possibly also a chronic disorder as multifocal motor neuropathy represent a spectrum of
          the same immunopathologic process.
        supports: SUPPORT
