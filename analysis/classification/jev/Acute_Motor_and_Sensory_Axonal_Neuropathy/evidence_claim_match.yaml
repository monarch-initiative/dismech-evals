        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interp_amsan_stable_subtype_or_axonal_spectrum
        prompt: Is AMSAN a stable mechanistically distinct subtype, or does it often represent the severe
          motor-sensory end of a dynamic nodopathy-to-axonopathy spectrum shared with AMAN and other GBS
          patterns?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - pathophysiology#Reversible Nodal Conduction Failure
        - pathophysiology#Motor and Sensory Axonal Degeneration
        rationale: Fatal pathology supports genuine motor and sensory axonal destruction, but serial NCS
          shows frequent bidirectional subtype changes and no added value from electrodiagnostic subtyping.
          Resolving which patients have reversible nodal failure versus fixed sensory and motor axon loss
          matters more than a single early label.
        proposed_experiments:
        - experiment_id: exp_amsan_serial_ncs_biomarker_trajectory
          name: Prospective AMSAN-enriched serial electrophysiology and biomarker study
          description: Enroll early motor-sensory GBS before definitive subtyping; obtain standardized
            NCS/EMG at baseline, 2-3 weeks, and recovery, with blinded classification by multiple criteria,
            ganglioside-antibody profiling, complement activity, NfL, and motor, sensory, autonomic, and
            functional outcomes. Test whether fixed low CMAP/SNAP trajectories separate from reversible
            nodal-failure trajectories and outperform the initial subtype label for prognosis.
          decision_criterion: A stable AMSAN entity is supported if combined motor-sensory axonal trajectories
            remain reproducible across criteria and time and predict outcomes independently; frequent
            migration with biomarker-defined nodal recovery supports a continuum model.
          would_support:
          - pathophysiology#Reversible Nodal Conduction Failure
          - pathophysiology#Motor and Sensory Axonal Degeneration
      selected_evidence:
        snippet: the electrodiagnostic subtype changed on serial NCS in 37.8% (Hadden) and 44.7% (Rajabally).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
