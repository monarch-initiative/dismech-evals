        discussion_id: gap_cebpa_model_to_human_variant_fidelity
        prompt: Do p30-only and paired Cebpa knock-in mice reproduce the variant-specific human bZIP in-frame-indel
          outcome subgroup and its treatment response?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#N-Terminal CEBPA p42-to-p30 Dysregulation
        - pathophysiology#C-Terminal CEBPA bZIP DNA-Binding and Dimerization Dysfunction
        rationale: The mouse models establish etiologic and cellular effects of Cebpa isoform imbalance
          and paired terminal lesions, but human favorable risk is most clearly associated with diverse
          bZIP in-frame indels. The models do not reproduce the complete human allelic, co-mutation, immune/metabolic,
          and treatment-context landscape.
        proposed_experiments:
        - experiment_id: exp_cebpa_isogenic_human_variant_panel
          name: Isogenic human CEBPA variant-panel leukemia model
          description: Engineer representative N-terminal truncating, bZIP in-frame indel, bZIP stop,
            and bZIP missense alleles singly and in phased pairs in human CD34+ hematopoietic cells, with
            matched xenografts and drug-response profiling.
          decision_criterion: Model fidelity would be supported if variant classes reproduce the human
            hierarchy of differentiation arrest, stem/progenitor state, transcriptome, chemotherapy sensitivity,
            and relapse-associated MRD in independent donors.
      selected_evidence:
        snippet: We here use knockin mutagenesis in the mouse to model the spectrum of acquired CEBPA
          mutations in human acute myeloid leukemia.
        supports: SUPPORT
