        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_cebpa_classification_and_risk_boundaries
        prompt: How should WHO-HAEM5, ICC 2022, and ELN 2022 CEBPA categories be represented without conflating
          disease definition, blast threshold, allelic state, and treatment-context risk?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - definitions#WHO-HAEM5 AML with CEBPA mutation definition
        - definitions#ICC 2022 AML with in-frame bZIP CEBPA mutation definition
        - has_subtypes#CEBPA bZIP In-Frame-Indel AML
        rationale: WHO includes biallelic CEBPA or a single bZIP mutation and retains 20% blasts; ICC
          requires an in-frame bZIP mutation and permits diagnosis from 10% blasts; ELN assigns in-frame
          bZIP CEBPA to favorable risk in intensively treated adults. These are overlapping but non-identical
          assertions, and newer outcome data suggest that in-frame bZIP indels, not every bZIP mutation,
          carry the clearest favorable signal.
        proposed_experiments:
        - experiment_id: exp_cebpa_harmonized_classification_outcomes
          name: Harmonized WHO-ICC-ELN prospective outcome analysis
          description: Prospectively phase full-length CEBPA variants and assign each case in parallel
            under WHO, ICC, and ELN rules, stratified by intensive versus lower-intensity treatment and
            serial flow MRD.
          decision_criterion: A boundary is clinically coherent if it independently separates remission,
