        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_cebpa_comutations_mrd_and_transplant
        prompt: Which co-mutations or post-treatment MRD states identify in-frame bZIP CEBPA AML patients
          who benefit from transplantation in first remission?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - genetic#WT1
        - genetic#DNMT3A
        - genetic#FLT3-ITD
        - diagnosis#Bone-Marrow Multiparameter Flow MRD Assessment
        - treatments#Allogeneic Hematopoietic Stem Cell Transplantation
        rationale: One intensively treated cohort associated WT1, DNMT3A, immune/metabolic expression,
          and upfront transplant with outcome, whereas a larger pooled analysis found no independent overall-survival
          effect from several co-mutations. Flow MRD during consolidation is prognostic, but there is
          no validated CEBPA-specific randomized rule for transplant in first remission.
        proposed_experiments:
        - experiment_id: exp_cebpa_mrd_adapted_transplant_strategy
          name: Prospective MRD-adapted transplant strategy study
          description: Enroll molecularly defined in-frame bZIP CEBPA AML, stratify by harmonized co-mutation
            profile and consolidation-time bone-marrow flow MRD, and compare chemotherapy consolidation
            with allogeneic transplantation in the prespecified high-risk/MRD-positive strata.
          decision_criterion: A first-remission transplant rule would require a reproducible interaction
            showing improved overall survival, not only relapse reduction, with an acceptable non-relapse
            mortality tradeoff in an independent cohort.
      selected_evidence:
        snippet: co-mutations in bZIPInDel patients (e.g. GATA2, FLT3, WT1 as well as ELN2022 adverse
          risk aberrations) had no independent impact on OS
        supports: SUPPORT
    origin:
