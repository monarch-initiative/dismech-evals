        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cebpa_variant_convergence
        hypothesis_label: Variant-specific CEBPA dysfunction converges on differentiation arrest
        status: CANONICAL
        description: N-terminal truncating lesions preserve and overproduce p30, whereas C-terminal bZIP
          lesions alter DNA binding and dimerization. These distinct molecular defects converge on abnormal
          granulocytic transcription, differentiation arrest, leukemic progenitor expansion, and AML.
      selected_evidence:
        snippet: The mutant proteins block wild-type C/EBPalpha DNA binding and transactivation of granulocyte
          target genes in a dominant-negative manner, and fails to induce granulocytic differentiation.
        supports: SUPPORT
    origin:
