            term:
              id: MONDO:0017894
              label: acute myeloid leukemia with CEBPA somatic mutations
        context: []
      assertion_type: Subtype
      assertion:
        name: CEBPA bZIP In-Frame-Indel AML
        display_name: AML with CEBPA bZIP in-frame insertion/deletion
        description: Narrow outcome-defined subgroup with an acquired in-frame insertion/deletion in the
          C-terminal CEBPA basic leucine zipper region. It overlaps the ICC entity and ELN 2022 favorable
          genetic-risk group but is not coextensive with their broader bZIP wording, which can include
          bZIP missense variants. The indel-specific favorable association is established most securely
          in intensively treated adults and does not eliminate relapse risk.
        genes:
        - preferred_term: CEBPA
          term:
            id: hgnc:1833
            label: CEBPA
      selected_evidence:
        snippet: Only bZIPInDel patients had significantly higher rates of complete remission and longer
          relapse free and overall survival (OS) compared with all other CEBPA-mutant subgroups.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38228680
      reference_title: Prognostic impact of CEBPA mutational subgroups in adult AML.
      evidence_source: HUMAN_CLINICAL
      explanation: The pooled cohort localizes the favorable outcome association to the bZIP in-frame-indel
