            term:
              id: MONDO:0017894
              label: acute myeloid leukemia with CEBPA somatic mutations
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: N-Terminal CEBPA p42-to-p30 Dysregulation
        description: Acquired N-terminal TAD frameshift or nonsense variants truncate the p42 isoform
          while permitting downstream translation reinitiation and excess p30. The retained p30 protein
          interferes with normal C/EBPalpha transcriptional control; this is a dominant-negative isoform
          imbalance rather than simple absence of the protein.
        genes:
        - preferred_term: CEBPA
          term:
            id: hgnc:1833
            label: CEBPA
        gene_products:
        - preferred_term: CCAAT/enhancer binding protein alpha
          term:
            id: NCIT:C45488
            label: CCAAT/Enhancer Binding Protein Alpha
        cell_types:
        - preferred_term: hematopoietic multipotent progenitor cell
          term:
            id: CL:0000837
            label: hematopoietic multipotent progenitor cell
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          modifier: ABNORMAL
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
      selected_evidence:
        snippet: We found that five mutations in the amino terminus truncate the full-length protein,
          but did not affect a 30-kD protein initiated further downstream.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
