      assertion_type: DifferentialDiagnosis
      assertion:
        name: Clonidine and imidazoline toxicity
        description: The classic pharmacologic mimic of the opioid toxidrome. Central alpha-2-adrenergic
          agonism from clonidine (and imidazoline decongestants) produces CNS depression, miosis, and
          respiratory depression that look like opioid poisoning, and it may even partially respond to
          naloxone. It is a frequent cause of accidental pediatric exposure.
        distinguishing_features:
        - Prominent bradycardia and hypotension accompany the CNS depression and miosis in clonidine toxicity.
        - Reversal of CNS depression by naloxone, when it occurs in clonidine toxicity, typically requires
          higher-than-standard doses and is inconsistent.
      selected_evidence:
        snippet: Clonidine toxicity mimics an opioid toxidrome, often presenting with CNS depression,
          miosis, bradycardia, and hypotension.
        supports: SUPPORT
