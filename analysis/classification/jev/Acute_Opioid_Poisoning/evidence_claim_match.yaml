        name: Sedative-hypnotic toxidrome
        description: Overdose of benzodiazepines, barbiturates, ethanol, antipsychotics, or anticonvulsants
          depresses consciousness and can even cause miosis, but it lacks the respiratory depression that
          defines opioid toxicity. Benzodiazepines are also a common co-ingestant that worsens opioid
          overdose.
        distinguishing_features:
        - The respiratory depression that defines opioid toxicity is usually absent in sedative-hypnotic
          overdose.
        - Sedative-hypnotic overdose does not respond to naloxone.
      selected_evidence:
        snippet: overdose from antipsychotic drugs, anticonvulsant agents, ethanol, and other sedative
          hypnotic agents can cause miosis and coma, but the respiratory depression that defines opioid
          toxicity is usually absent
