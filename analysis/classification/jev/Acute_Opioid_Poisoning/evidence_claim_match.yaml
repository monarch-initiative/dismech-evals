        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Systemic Opioid Exposure
        role: trigger
        description: An opioid agonist is absorbed and distributed systemically, crossing the blood-brain
          barrier to reach central mu-opioid receptors. The dose that produces the toxidrome depends on
          the agent's potency, the route, and the patient's tolerance; children who ingest opioids intended
          for adults are a recurring accidental source.
      selected_evidence:
        snippet: data indicate that the frequent prescription of opioid analgesics contributes to overdose-related
          mortality among children, who may find and ingest agents in the home that were intended for
          adults
        supports: SUPPORT
    origin:
