      assertion_type: Pathophysiology
      assertion:
        name: Central Mu-Opioid Receptor Overactivation
        role: central_effector
        biological_scale: MOLECULAR
        description: Excess agonism of the mu-opioid receptor, a Gi/Go-coupled G-protein-coupled receptor
          that inhibits adenylate cyclase, hyperpolarizes and silences neurons across brainstem respiratory
          centers, cortical and thalamic arousal pathways, the Edinger-Westphal nucleus, and enteric circuits.
          The mu receptor accounts for the preponderance of opioid clinical effects.
        molecular_functions:
        - preferred_term: mu-opioid receptor activity
          modifier: INCREASED
          term:
            id: GO:0004985
            label: G protein-coupled opioid receptor activity
        biological_processes:
        - preferred_term: adenylate cyclase-inhibiting opioid receptor signaling
          modifier: INCREASED
          term:
            id: GO:0031635
            label: adenylate cyclase-inhibiting opioid receptor signaling pathway
        cell_types:
        - preferred_term: central nervous system neuron
          term:
            id: CL:2000029
            label: central nervous system neuron
        genes:
        - preferred_term: OPRM1
          term:
            id: hgnc:8156
            label: OPRM1
      selected_evidence:
        snippet: The mu opioid receptor is responsible for the preponderance of clinical effects caused
          by opioids.
        supports: SUPPORT
