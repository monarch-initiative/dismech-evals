  1efe19344f88d5995a82885cf29c731bd7b5523e11ab1f89df8fdbe9a08bb233:
    claim:
      about:
        disease:
          name: Acute Post-Surgical Pain
          disease_term:
            preferred_term: Acute post-surgical pain
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Spinal Microglial Gating of Opioid Antinociception
        description: 'A preclinical therapeutic vulnerability at the same spinal dorsal-horn / microglial
          substrate as the central-sensitization node (its inbound edge). In the paw-incision (post-surgical)
          pain model, spinal Hsp90 inhibition activates microglial Src kinase signaling that enhances
          mu-opioid-receptor antinociception, enabling an opioid dose-reduction strategy; better acute
          analgesia via this route is hypothesized to blunt the acute-to-chronic transition (its downstream
          edge). This node conforms to the `spinal_hsp90_opioid_enhancement` module. IMPORTANT: the evidence
          is preclinical (mouse, intrathecal/isoform-selective dosing) and spinal-compartment-specific
          - brain/systemic non-selective Hsp90 inhibition blocks opioid antinociception - so this is a
          research target, not established human therapy.'
        role: therapeutic_vulnerability
        biological_scale: CELLULAR
        conforms_to: spinal_hsp90_opioid_enhancement#Microglial Src Kinase Activation
        cell_types:
        - preferred_term: Spinal dorsal horn microglia
          term:
            id: CL:0000129
            label: microglial cell
        biological_processes:
        - preferred_term: Microglial modulation of spinal opioid antinociceptive signaling
          term:
            id: GO:0038003
            label: G protein-coupled opioid receptor signaling pathway
          modifier: INCREASED
        locations:
        - preferred_term: Spinal cord dorsal horn
          term:
            id: UBERON:0002256
            label: dorsal horn of spinal cord
      selected_evidence:
        snippet: The enhanced antinociception seen with 17-AAG was completely abolished in the inhibitor
          groups in tail-flick and paw-incision pain models
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
