            preferred_term: Acute post-surgical pain
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Surgical Incision and Nociceptor Activation
        description: The trigger. A surgical incision through skin, fascia, and muscle directly activates
          high-threshold A-delta and C-fiber nociceptors at the wound. In the Brennan rat plantar-incision
          model - the standard preclinical analogue of human post-surgical pain - a hindpaw incision produces
          reliable, quantifiable mechanical hyperalgesia lasting several days, with input carried by the
          sural and tibial nerves.
        role: trigger
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Nociceptor (A-delta / C-fiber primary afferent)
          term:
            id: CL:0000198
            label: pain receptor cell
        locations:
        - preferred_term: Skin and soft tissue at the surgical wound
          term:
            id: UBERON:0002097
            label: skin of body
      selected_evidence:
        snippet: a surgical incision of the rat foot causes a reliable and quantifiable mechanical hyperalgesia
          lasting for several days after surgery
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8783314
      reference_title: Characterization of a rat model of incisional pain.
      evidence_source: MODEL_ORGANISM
      explanation: 'Establishes the trigger: surgical incision produces quantifiable mechanical hyperalgesia.
        Evidence source is MODEL_ORGANISM because this is the Brennan rat plantar-incision model, the
        standard preclinical analogue of acute post-surgical pain.'
