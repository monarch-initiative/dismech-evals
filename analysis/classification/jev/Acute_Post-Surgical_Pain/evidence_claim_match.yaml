  a8e0857e16340b3f79da3bb8c9493463b4ac99531aab93adf58013c941504f8e:
    claim:
      about:
        disease:
          name: Acute Post-Surgical Pain
          disease_term:
            preferred_term: Acute post-surgical pain
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Spinal Central Sensitization
        description: 'The central effector. Sustained nociceptor barrage into the spinal dorsal horn triggers
          activity-dependent synaptic plasticity - a prolonged, reversible increase in the excitability
          and synaptic efficacy of central nociceptive neurons (central sensitization), with a major NMDA-receptor/glutamatergic
          component ("wind-up") and a contribution from activated dorsal-horn microglia. Clinically it
          manifests as pain hypersensitivity beyond the wound: dynamic tactile allodynia and secondary
          hyperalgesia. Post-surgical pain is one of the conditions in which central sensitization is
          an established contributor.'
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Spinal dorsal horn microglia
          term:
            id: CL:0000129
            label: microglial cell
        biological_processes:
        - preferred_term: Activity-dependent synaptic potentiation (central sensitization)
          term:
            id: GO:0060291
            label: long-term synaptic potentiation
          modifier: INCREASED
        - preferred_term: NMDA/glutamatergic signaling in the dorsal horn
          term:
            id: GO:0007215
            label: glutamate receptor signaling pathway
          modifier: INCREASED
        - preferred_term: Dorsal-horn microglial activation
          term:
            id: GO:0001774
            label: microglial cell activation
          modifier: INCREASED
        locations:
        - preferred_term: Spinal cord dorsal horn
          term:
            id: UBERON:0002256
            label: dorsal horn of spinal cord
      selected_evidence:
        snippet: Nociceptor inputs can trigger a prolonged but reversible increase in the excitability
          and synaptic efficacy of neurons in central nociceptive pathways, the phenomenon of central
          sensitization.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
