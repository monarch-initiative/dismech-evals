      assertion_type: Pathophysiology
      assertion:
        name: NaV1.8-Mediated Peripheral Nociceptive Signal Propagation
        description: NaV1.8 voltage-gated sodium channels on peripheral pain-sensing neurons and dorsal-root-ganglion
          nociceptors sustain action-potential firing and transmit incisional pain signals toward the
          spinal cord. Human-neuron pharmacology identifies this peripheral signaling step as a tractable,
          non-opioid therapeutic target.
        role: signal_transmission
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Peripheral nociceptor
          term:
            id: CL:0000198
            label: pain receptor cell
        molecular_functions:
        - preferred_term: NaV1.8 voltage-gated sodium channel activity
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
      selected_evidence:
        snippet: This novel allosteric mechanism results in tonic inhibition of NaV1.8 and reduces pain
          signals in primary human DRG sensory neurons.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
