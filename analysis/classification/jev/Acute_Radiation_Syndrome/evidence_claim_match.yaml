      assertion_type: Discussion
      assertion:
        discussion_id: ars_animal_rule_evidence_base
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: How do exposure heterogeneity, combined injury and available supportive care modify the
          benefit expected from controlled animal countermeasure studies?
        attaches_to:
        - pathophysiology#Bone Marrow Hematopoietic Suppression
        rationale: 'Animal efficacy studies support regulatory approval because controlled efficacy experiments
          involving deliberate harmful human irradiation are unethical or infeasible. Human accident-treatment
          observations and healthy-volunteer safety/pharmacology studies nevertheless exist. Their designs
          answer different questions: uncontrolled temporal marrow recovery is not a randomized survival
          estimate, and healthy-volunteer pharmacology is not irradiated-patient efficacy. Neither the
          filgrastim macaque experiment nor any single regimen establishes a universal effect for all
          countermeasures.'
      selected_evidence:
        snippet: The purpose of this study is to determine whether HemaMax is safe and well tolerated
          to support efficacy under FDA's Animal Rule to reduce the morbidity and mortality associated
          with the hematopoietic syndrome of acute radiation syndrome.
