        name: Cytopenia-Related Clinical Complications
        description: Neutropenic infection and haemorrhage are the proximate causes of death in the haematopoietic
          subsyndrome, and they are what supportive care and growth factors are given to prevent. Kept
          separate from the cytopenias themselves because the countermeasures act on the counts while
          the mortality is driven by the complications.
