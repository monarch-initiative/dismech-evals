  3333d794c96f2e585cc68d3e3533c576bcb8aeedbe1df2b9871174914e94a643:
    claim:
      about:
        disease:
          name: Acute Radiation Syndrome
          disease_term:
            preferred_term: acute radiation syndrome
            term:
              id: MONDO:0033938
              label: acute radiation syndrome
        context: []
      assertion_type: Environmental
      assertion:
        name: Acute whole-body ionizing radiation exposure
        description: A single high-dose exposure from a criticality accident, radiological source mishandling,
          reactor accident or nuclear detonation. It is distinguished from therapeutic irradiation by
          being uncontrolled, unfractionated, and usually of initially unknown dose, which is what makes
          early triage on lymphocyte depletion kinetics necessary.
        exposure_term:
          preferred_term: acute whole-body exposure to ionizing radiation
          term:
            id: ECTO:7000047
            label: exposure to ionizing radiation
        exposure_classifications:
          hazard_agent_type:
          - classification_value: PHYSICAL
          exposure_route:
          - classification_value: MULTIPLE
            notes: Whole-body external irradiation is not an absorption route in the chemical sense; MULTIPLE
              is recorded because the exposure is not confined to one portal of entry.
          exposure_duration:
          - classification_value: ACUTE
        notes: 'Bound to ECTO:7000047 (exposure to ionizing radiation), which resolves in the repository''s
          ECTO adapter (sqlite:obo:ecto) and is already in the validated cache. An earlier draft of this
          entry bound ECTO:0000006 (exposure to ultraviolet radiation), which is wrong - ultraviolet is
          non-ionizing and does not produce this syndrome - together with a note claiming no better term
          was available. That note was itself wrong: the correct term was in the cache all along and had
          simply not been searched for. The acute, whole-body and unfractionated character of the exposure
          is carried in preferred_term and description, since the ECTO class does not distinguish it from
          chronic or partial-body irradiation.'
      selected_evidence:
        snippet: It is critical that additional agents for other major sub-syndromes of ARS (gastrointestinal-ARS)
          be approved.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34402734
      reference_title: 'Radiation countermeasures for hematopoietic acute radiation syndrome: growth factors,
        cytokines and beyond.'
      evidence_source: OTHER
      explanation: Records that the syndrome has subsyndromes beyond the haematopoietic one modelled here,
        and that countermeasure coverage for them remains an acknowledged gap.
