  399a085a4b59648d856af4c3068f517b7f17f43d8e82c4e3de2be188c7070bfc:
    claim:
      about:
        disease:
          name: Acute Radiation Syndrome
          disease_term:
            preferred_term: acute radiation syndrome
            term:
              id: MONDO:0033938
              label: acute radiation syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hematopoietic Progenitor Injury
        description: Penetrating ionizing radiation delivered to the whole body over a short period kills
          proliferating haematopoietic stem and progenitor cells in the marrow. The marrow is the first
          compartment to fail because its progenitors are the most rapidly cycling, which is the same
          reason it is the dose-limiting tissue for cytotoxic chemotherapy - the insult differs but the
          vulnerable cell population does not.
        role: trigger
        biological_scale: CELLULAR
        conforms_to: myelosuppression#Cytotoxic Insult to Proliferating Hematopoietic Progenitors
        cell_types:
        - preferred_term: hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        - preferred_term: hematopoietic progenitor cell
          term:
            id: CL:0008001
            label: hematopoietic precursor cell
        biological_processes:
        - preferred_term: cellular response to ionizing radiation
          term:
            id: GO:0071479
            label: cellular response to ionizing radiation
          modifier: INCREASED
        locations:
        - preferred_term: bone marrow
          term:
            id: UBERON:0002371
            label: bone marrow
      selected_evidence:
        snippet: These agents are largely recombinant growth factors (e.g. rhuG-CSF/filgrastim, rhuGM-CSF/sargramostim)
          that target and stimulate myeloid progenitors within bone marrow.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34402734
      reference_title: 'Radiation countermeasures for hematopoietic acute radiation syndrome: growth factors,
        cytokines and beyond.'
      evidence_source: OTHER
      explanation: 'Identifies myeloid progenitors in bone marrow as the compartment the approved countermeasures
        act on. This is INDIRECT support for the node: it establishes the target compartment rather than
        demonstrating that radiation kills progenitors, and is retained for that narrower purpose alongside
        the direct survival evidence carried on the exposure link.'
