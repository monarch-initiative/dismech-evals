              preferred_term: acute whole-body exposure to ionizing radiation
              term:
                id: ECTO:7000047
                label: exposure to ionizing radiation
            exposure_classifications:
              hazard_agent_type:
              - classification_value: PHYSICAL
              exposure_route:
              - classification_value: MULTIPLE
                notes: Whole-body external irradiation is not an absorption route in the chemical sense;
                  MULTIPLE is recorded because the exposure is not confined to one portal of entry.
              exposure_duration:
              - classification_value: ACUTE
            notes: 'Bound to ECTO:7000047 (exposure to ionizing radiation), which resolves in the repository''s
              ECTO adapter (sqlite:obo:ecto) and is already in the validated cache. An earlier draft of
              this entry bound ECTO:0000006 (exposure to ultraviolet radiation), which is wrong - ultraviolet
              is non-ionizing and does not produce this syndrome - together with a note claiming no better
              term was available. That note was itself wrong: the correct term was in the cache all along
              and had simply not been searched for. The acute, whole-body and unfractionated character
              of the exposure is carried in preferred_term and description, since the ECTO class does
              not distinguish it from chronic or partial-body irradiation.'
