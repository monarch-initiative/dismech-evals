      - /disease_term
    evidence_metadata:
      reference: PMID:23210705
      reference_title: Filgrastim improves survival in lethally irradiated nonhuman primates.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that duration of neutropenia, not nadir depth, is the parameter that responds
        to treatment - which is why this node is framed around duration and infection risk rather than
        around the nadir alone.
