        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Multilineage Peripheral Cytopenias
        description: Neutropenia, thrombocytopenia and anaemia appear in sequence set by each lineage's
          circulating half-life, with lymphocytes falling first and fastest. Duration of neutropenia rather
          than nadir depth is the parameter the approved countermeasures actually shift.
        role: effector
        biological_scale: ORGANISM
        conforms_to: myelosuppression#Multilineage Peripheral Cytopenias
      selected_evidence:
        snippet: Filgrastim significantly decreased the duration of neutropenia, but did not affect the
          absolute neutrophil count nadir.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23210705
      reference_title: Filgrastim improves survival in lethally irradiated nonhuman primates.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that duration of neutropenia, not nadir depth, is the parameter that responds
        to treatment - which is why this node is framed around duration and infection risk rather than
