      assertion_type: Discussion
      assertion:
        discussion_id: ars_animal_rule_evidence_base
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: How far do non-human primate survival results for the haematopoietic subsyndrome transfer
          to human radiation casualties, given that human efficacy trials for this indication cannot ethically
          be run?
        attaches_to:
        - pathophysiology#Bone Marrow Hematopoietic Suppression
        rationale: Every treatment in this entry is graded MODEL_ORGANISM, and that is a feature of the
          regulatory pathway rather than a gap in curation. Countermeasures for acute radiation syndrome
          are approved under the FDA Animal Rule, which permits marketing approval on adequate and well-controlled
          animal efficacy data precisely because deliberately irradiating humans to test a drug is not
          ethical or feasible. The consequence for this knowledge base is that the efficacy claims here
          can never be upgraded to HUMAN_CLINICAL by finding a better trial - no such trial will exist.
          What human data does exist comes from accident case series with uncontrolled dose, heterogeneous
          supportive care and small numbers. The open question is therefore not whether the animal data
          are good, but how dose-equivalence and supportive-care differences between a primate protocol
          and a mass-casualty setting affect the expected benefit.
      selected_evidence:
        snippet: The Animal Rule enumerates criteria whereby the FDA would approve a drug or biologic
          for ARS indication based on animal efficacy data when efficacy studies in humans are unethical
          or not feasible.
        supports: SUPPORT
