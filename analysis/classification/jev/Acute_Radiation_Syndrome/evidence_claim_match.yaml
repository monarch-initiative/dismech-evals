        biological_scale: ORGANISM
        conforms_to: myelosuppression#Cytopenia-Related Clinical Complications
      selected_evidence:
        snippet: Filgrastim, administered at this dose and schedule, effectively mitigated the lethality
          of the hematopoietic subsyndrome of the acute radiation syndrome.
        supports: SUPPORT
