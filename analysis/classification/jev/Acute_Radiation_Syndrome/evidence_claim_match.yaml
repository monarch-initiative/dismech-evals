              id: MONDO:0033938
              label: acute radiation syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Dicentric chromosome assay biodosimetry
        description: 'The reference method for reconstructing absorbed dose when no physical dosimeter
          was worn, which is the usual case in an accident or a release. Scoring dicentric chromosomes
          in peripheral lymphocytes gives a dose estimate against a calibration curve. Its weakness is
          throughput: it is slow and needs expert readers, which is the wrong shape for a mass-casualty
          event and the reason automated scoring is being developed.'
      selected_evidence:
        snippet: The dicentric chromosome assay is the "gold standard" in biodosimetry for estimating
          radiation exposure.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
