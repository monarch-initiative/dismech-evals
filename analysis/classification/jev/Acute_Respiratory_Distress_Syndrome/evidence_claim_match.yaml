        - path: /experimental_models/0
          value:
            name: Human airway-on-a-chip chlorine gas exposure model
            description: 'A microfluidic human airway chip with pseudostratified mucociliary epithelium,
              a biomimetic extracellular matrix hydrogel, an endothelial compartment, and integrated electrodes
              for transepithelial electrical resistance, coupled to a chlorine generation and delivery
              platform that controls concentration and exposure duration precisely. Transcriptomics and
              metabolomics were run across post-exposure timepoints. It addresses a gap that is unusually
              hard to fill any other way: human clinical data on acute chlorine exposure are scarce for
              obvious reasons, and animal models translate poorly.'
            experimental_model_type: ORGAN_ON_CHIP
            namo_type: namo:OrganOnChip
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
