  01ee15dea60fef2f8a48f57389b73da969408080822e7b7ae3cc4bc31d52035a:
    claim:
      about:
        disease:
          name: Acute Respiratory Distress Syndrome
          disease_term:
            preferred_term: Acute respiratory distress syndrome
            term:
              id: MONDO:0006502
              label: acute respiratory distress syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Global Consensus Clinical Diagnosis
        diagnosis_term:
          preferred_term: clinical assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        description: Diagnose ARDS when acute or worsening hypoxemic respiratory failure occurs within
          one week of a predisposing insult or new respiratory symptoms, with bilateral loss of lung aeration
          on radiography, CT, or qualified ultrasound, and edema not primarily explained by cardiac failure,
          fluid overload, collapse, effusion, or embolism. Hypoxemia can be identified by PaO2:FiO2 at
          or below 300 mm Hg or by SpO2:FiO2 at or below 315 when SpO2 is at or below 97%; the global
          definition includes specified nonintubated and resource-limited pathways.
        results: Acute bilateral noncardiogenic inflammatory lung injury with qualifying hypoxemia supports
          the diagnosis; severity and respiratory-support category should be recorded separately.
      selected_evidence:
        snippet: 'The committee made four main recommendations: 1) include high-flow nasal oxygen with
          a minimum flow rate of ⩾30 L/min; 2) use PaO2:FiO2 ⩽ 300 mm Hg or oxygen saturation as measured
          by pulse oximetry SpO2:FiO2 ⩽ 315 (if oxygen saturation as measured by pulse oximetry is ⩽97%)
          to identify hypoxemia; 3) retain bilateral opacities for imaging criteria but add ultrasound
          as an imaging modality, especially in resource-limited areas; and 4) in resource-limited settings,
          do not require positive end-expiratory pressure, oxygen flow rate, or specific respiratory support
          devices.'
        supports: SUPPORT
