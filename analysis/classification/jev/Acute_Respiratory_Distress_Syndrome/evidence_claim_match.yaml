      assertion_type: ProgressionInfo
      assertion:
        phase: Exudative inflammatory phase
        notes: The early injury phase features proinflammatory alveolar-macrophage activation, neutrophil
          recruitment, epithelial injury, endothelial activation, and permeability edema. Diffuse alveolar
          damage may occur but is not required for the clinical diagnosis.
      selected_evidence:
        snippet: During the exudative phase of ARDS, macrophages are activated by pathogens through pattern
          recognition receptors (PRRs), including Toll-like receptors (TLRs), leucine-rich repeat sequence
          receptors (NLRs), transmembrane C-type lectin receptors (CLRs), and retinoic acid-induced gene-like
          receptors (RLRs), which promote the transition of resident AM cells to the predominant proinflammatory
          phenotype.
        supports: SUPPORT
