      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: immunometabolic_resilience_model
        hypothesis_label: Immunometabolic Persistence and Metabolic Resilience Model
        status: EMERGING
        description: Sustained glycolytic programming, impaired mitochondrial oxidative phosphorylation,
          redox imbalance, and bioactive metabolite signaling in immune and structural lung cells may
          amplify inflammation and delay alveolar-capillary repair. The related concept of metabolic resilience
          proposes that recovery depends partly on restoring coordinated mitochondrial function, substrate
          use, and redox balance. These mechanisms may help explain clinical heterogeneity, but they are
          not yet validated as a diagnostic endotype or treatment-selection framework.
        notes: Much of the pathway-level causality and therapeutic rationale is derived from experimental
          systems, sepsis extrapolation, or associative human multi-omics. No metabolism-targeted ARDS
          therapy or bedside metabolic-resilience assay has established prospective clinical utility.
      selected_evidence:
        snippet: Emerging evidence suggests that immunometabolic reprogramming, characterized by increased
          glycolysis, impaired mitochondrial oxidative phosphorylation, and altered metabolite signalling,
          plays a critical role in shaping immune-cell activation, inflammatory persistence, and tissue
          repair during critical illness.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
