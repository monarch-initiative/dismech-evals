        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_ards_metabolic_endotype_validation
        prompt: Do longitudinal immunometabolic states causally define reproducible ARDS endotypes that
          predict recovery and treatment response, and can metabolic resilience be measured prospectively
          well enough to guide therapy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Immunometabolic Reprogramming and Mitochondrial Dysfunction
        rationale: PMID:42432720 synthesizes glycolytic shifts, impaired oxidative phosphorylation, metabolite
          signaling, and mitochondrial dysfunction into a metabolic-resilience framework. However, it
          is a narrative review, human multi-omic studies are largely associative and compartment-dependent,
          and some longitudinal claims are extrapolated from sepsis or experimental acute lung injury.
          Prospective ARDS-specific validation is needed to establish whether these metabolic states are
          causal, stable enough for bedside classification, and predictive of benefit from a metabolism-targeted
          intervention rather than merely markers of severity.
      selected_evidence:
        snippet: Multi-omic studies further demonstrate that distinct metabolic signatures are associated
          with ARDS phenotypes, disease severity, and treatment responsiveness.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42432720
      reference_title: 'Immunometabolic reprogramming and mitochondrial dysfunction in acute respiratory
        distress syndrome: mechanisms, metabolic resilience, and therapeutic perspectives- a narrative
        review.'
      evidence_source: OTHER
      explanation: The association of metabolic signatures with phenotype and response is the evidence
        base that motivates, but does not resolve, the prospective causal and treatment-selection question.
