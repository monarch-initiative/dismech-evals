        target: Alveolar-Capillary Barrier Disruption
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: 'Epithelial junctional gaps appeared immediately after exposure, and endothelial
          junctional disruption followed only at 72 hours despite the endothelium never being directly
          exposed. The delay is the point: it establishes that barrier injury propagates from the epithelial
          to the endothelial layer rather than both being independently damaged.'
        limitations: The chip has no neutrophils or macrophages, so the inflammatory amplification and
          resolution phases that dominate barrier disruption in clinical ARDS are represented only indirectly
          through early epithelial-endothelial signalling. It is also airway rather than alveolar epithelium.
        readouts:
        - name: Endothelial VE-cadherin junction integrity at 72 hours post-exposure
          target: Alveolar-Capillary Barrier Disruption
          direction: DECREASED
          interpretation: Delayed endothelial junctional loss after an exclusively epithelial exposure
            is evidence of trans-barrier propagation.
      selected_evidence:
        snippet: A primary constraint is the absence of innate immune system components, limiting evaluation
          of inflammatory responses to early epithelial/endothelial signaling that would typically recruit
          neutrophils and macrophages.
        supports: SUPPORT
