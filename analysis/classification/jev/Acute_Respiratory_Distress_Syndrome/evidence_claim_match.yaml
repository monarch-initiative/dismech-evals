      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: alveolar_capillary_injury_model
        hypothesis_label: Alveolar-Capillary Permeability Injury Model
        status: CANONICAL
        description: A direct pulmonary or indirect systemic insult initiates dysregulated innate inflammation
          and coagulation. Macrophage activation and recruited neutrophils injure the alveolar epithelium
          and pulmonary endothelium, increasing barrier permeability. Protein-rich edema, loss of aerated
          lung, and atelectasis then produce shunt physiology, reduced compliance, and hypoxemic respiratory
          failure.
      selected_evidence:
        snippet: ARDS is an acute, diffuse, inflammatory lung injury precipitated by a risk factor such
          as pneumonia, nonpulmonary infection, trauma, transfusion, burn, aspiration, or shock. The resulting
          injury leads to pulmonary edema from an increase in pulmonary vascular and alveolar epithelial
          permeability.
        supports: SUPPORT
    origin:
