        context:
        - path: /experimental_models/1
          value:
            name: Organoid-derived Pseudomonas pneumonia-on-a-chip (VAP) model
            description: An alveolus chip lined with organoid-derived alveolar epithelial cells that differentiate
              into both type 2 and type 1-like cells, plus primary pulmonary microvascular endothelium,
              cycled at a respiratory-like 0.25 Hz at either physiological (5%) or hyperphysiological
              (10%) strain and infected with Pseudomonas aeruginosa. Comparing the two strain levels under
              an otherwise identical infection isolates the contribution of ventilation-associated stretch,
              which is the central question in ventilator-associated pneumonia and ventilator-induced
              lung injury.
            experimental_model_type: ORGAN_ON_CHIP
            namo_type: namo:OrganOnChip
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: alveolus of lung
              term:
                id: UBERON:0002299
                label: alveolus of lung
            cell_types:
            - preferred_term: Pulmonary alveolar type 2 cell
              term:
                id: CL:0002063
                label: pulmonary alveolar type 2 cell
            - preferred_term: Pulmonary alveolar type 1 cell
              term:
                id: CL:0002062
                label: pulmonary alveolar type 1 cell
            - preferred_term: Pulmonary capillary endothelial cell
              term:
                id: CL:4028001
                label: pulmonary capillary endothelial cell
            conditions:
            - physiological cyclic strain (5%, 0.25 Hz)
            - hyperphysiological cyclic strain (10%, 0.25 Hz)
            - Pseudomonas aeruginosa PAO1 infection
            cell_source: Human alveolar organoid-derived epithelial cells and primary pulmonary microvascular
              endothelial cells
            culture_system: Alveolus-on-a-chip with air-liquid interface, vascular flow, and controlled
              cyclic strain
            publication: PMID:41252215
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Ventilator-Induced Lung Injury
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Raising cyclic strain from physiological to hyperphysiological levels increased apparent
          permeability and, under infection, increased bacterial counts in the vascular channel. This
          reproduces the clinical interaction in which ventilation-associated overdistension worsens an
          infectious insult rather than merely coexisting with it.
        limitations: Uniform cyclic strain across a chip membrane is not the regionally heterogeneous
          overdistension and cyclic recruitment-derecruitment of an injured ventilated lung, and the model
          has no immune cells, so the leukocyte-mediated component of ventilator-induced injury is absent.
          Readouts are at 12 hours post-infection only.
        readouts:
        - name: Apparent permeability under hyperphysiological versus physiological strain
          target: Ventilator-Induced Lung Injury
          direction: INCREASED
          interpretation: Strain-dependent permeability increase is the barrier readout for stretch injury.
        - name: Bacterial translocation to the vascular channel under increased strain
          target: Ventilator-Induced Lung Injury
          direction: INCREASED
          interpretation: Higher vascular-channel colony counts under greater strain quantify the strain-infection
            interaction.
      selected_evidence:
        snippet: We hereby present what we believe to be the first functional Pseudomonas POC and VAP-on-a-chip
          model that replicates key features of disease, including enhanced mechanical strain.
        supports: SUPPORT
