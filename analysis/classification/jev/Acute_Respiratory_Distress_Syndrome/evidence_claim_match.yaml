      assertion_type: Environmental
      assertion:
        name: Inhalation of chlorine gas
        description: Chlorine is among the commonest chemical causes of acute lung injury, encountered
          through transport accidents, industrial spills, water treatment and swimming-pool exposures,
          and deliberate release. Inhaled chlorine reacts in the airway to form oxidative products, so
          the insult delivered to the alveolar-capillary interface is chemical and oxidative rather than
          infectious or mechanical.
        exposure_term:
          preferred_term: inhalation of chlorine gas
          term:
            id: ECTO:9000077
            label: exposure to chlorine
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
          exposure_route:
          - classification_value: INHALATION
            notes: Inhalation is the route by which chlorine reaches the alveolar-capillary interface;
              dermal and ocular contact cause local irritation without this mechanism.
          exposure_duration:
          - classification_value: ACUTE
            notes: The ARDS-producing exposures are short, high-concentration events (spills, accidents,
              release), not the chronic low-level occupational and swimming-pool exposures that produce
              airway hyperreactivity.
        notes: Bound to ECTO:9000077 (exposure to chlorine), confirmed against the ontology service. This
          entry was originally scoped to "irritant halogen gases" and bound to the substance-level ECTO:0000231
          while the service was unreachable; it is now narrowed to chlorine so the binding, the name and
          the quoted evidence all describe the same agent. Bromine is curated as a separate entry because
          ECTO has no bromine exposure class, and binding the chlorine term to an entry that also asserted
          bromine would have manufactured a narrower match than the claim.
      selected_evidence:
        snippet: More severely affected individuals may suffer acute lung injury (ALI) and/or acute respiratory
          distress syndrome (ARDS).
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
