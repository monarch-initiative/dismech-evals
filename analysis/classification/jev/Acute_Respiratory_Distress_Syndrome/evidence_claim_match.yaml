          term:
            id: NCIT:C124351
            label: Clinical Evaluation
        description: Diagnose ARDS when acute or worsening hypoxemic respiratory failure occurs within
          one week of a predisposing insult or new respiratory symptoms, with bilateral loss of lung aeration
          on radiography, CT, or qualified ultrasound, and edema not primarily explained by cardiac failure,
          fluid overload, collapse, effusion, or embolism. Hypoxemia can be identified by PaO2:FiO2 at
