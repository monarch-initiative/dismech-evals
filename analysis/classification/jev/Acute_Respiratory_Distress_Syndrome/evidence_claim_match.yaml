            - preferred_term: Bronchial epithelial cell
              term:
                id: CL:0002328
                label: bronchial epithelial cell
            - preferred_term: Pulmonary capillary endothelial cell
              term:
                id: CL:4028001
                label: pulmonary capillary endothelial cell
            conditions:
            - chlorine gas 10, 20, and 30 ppm for 10 to 30 minutes
            - medical air exposure control
            culture_system: Microfluidic airway-on-a-chip at air-liquid interface with integrated TEER
              electrodes and controlled gas exposure
            publication: PMID:41442163
          role: ancestor
        - path: /experimental_models/0/modeled_mechanisms/1
          value:
            target: Alveolar-Capillary Barrier Disruption
            relationship: PARTIALLY_RECAPITULATES
            fidelity: MODERATE
            description: 'Epithelial junctional gaps appeared immediately after exposure, and endothelial
              junctional disruption followed only at 72 hours despite the endothelium never being directly
              exposed. The delay is the point: it establishes that barrier injury propagates from the
              epithelial to the endothelial layer rather than both being independently damaged.'
            limitations: The chip has no neutrophils or macrophages, so the inflammatory amplification
              and resolution phases that dominate barrier disruption in clinical ARDS are represented
              only indirectly through early epithelial-endothelial signalling. It is also airway rather
              than alveolar epithelium.
          role: ancestor
