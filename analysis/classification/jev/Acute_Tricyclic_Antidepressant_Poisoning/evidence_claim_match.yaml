          alkalemia, sodium loading and hypokalemia are relevant limits. The optimal endpoint and maintenance
          strategy are not settled by the experimental comparisons.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
