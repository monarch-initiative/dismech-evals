  83f98a3eb0d29d07f08e06ebfc5a38eba20acb9b8a2759c22ac214deb65e37c4:
    claim:
      about:
        disease:
          name: Acute Tricyclic Antidepressant Poisoning
          disease_term:
            preferred_term: acute tricyclic antidepressant poisoning
            term:
              id: MONDO:0018547
              label: acute tricyclic antidepressant poisoning
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Potentially fatal acute poisoning with rapid deterioration in severe cases. Historical
          UK observational comparisons found greater relative overdose toxicity for TCAs than for several
          newer antidepressant classes, with substantial variation within the TCA class. These comparisons
          and selected hospital cohorts do not provide a universal mortality percentage or population
          incidence.
      selected_evidence:
        snippet: Case fatality rate ratios showed greater toxicity for TCAs (13.8, 95% CI 13.0-14.7) than
          the SNRI venlafaxine (2.5, 95% CI 2.0-3.1) and the NaSSA mirtazapine (1.9, 95% CI 1.1-2.9),
          both of which had greater toxicity than the SSRIs (0.5, 95% CI 0.4-0.7).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /clinical_burden
      evidence_path: /clinical_burden/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20435959
      reference_title: 'Toxicity of antidepressants: rates of suicide relative to prescribing and non-fatal
        overdose.'
      evidence_source: HUMAN_CLINICAL
      explanation: The published figures are comparative rate ratios, not percentages. Mortality, prescribing
        and nonfatal-overdose data came from different geographic source populations, with limitations
        including dose and coingestant information.
      quote_role: PRIMARY_RESULT
