              is limited. Animal results do not demonstrate superiority to bicarbonate in human poisoning.
              Sodium and acid-base monitoring are necessary.
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
