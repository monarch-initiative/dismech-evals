      assertion:
        target: Slowed Cardiac Phase 0 Depolarization
        treatment_effect: MODULATES
        description: Experimental sodium loading can improve depressed phase 0 characteristics; clinical
          rescue efficacy is less certain.
      selected_evidence:
        snippet: The results suggest that the beneficial effects of NaHCO3 are related to a reversal of
          drug effects on phase 0 characteristics and that this effect is due both to alkalinization and
          to increases in extracellular Na concentration.
