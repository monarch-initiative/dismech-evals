      assertion:
        name: CYP2D6
        gene_term:
          preferred_term: CYP2D6
          term:
            id: hgnc:2625
            label: CYP2D6
        relationship_type: MODIFIER
        association: CYP2D6 activity affects therapeutic TCA exposure; poor metabolizers can have higher
          plasma concentrations at usual doses. This pharmacokinetic modifier is not a genetic cause of
          poisoning, and the cited guidance does not validate CYP2D6 genotype as a predictor of acute-overdose
          outcome.
        notes: CYP2D6 inhibitors can also alter exposure; genotype-guided therapeutic prescribing should
          not be substituted for immediate clinical and ECG assessment of poisoning.
      selected_evidence:
        snippet: The FDA-approved drug label for amitriptyline states that CYP2D6 PM have higher than
          expected plasma concentrations of tricyclic antidepressants when given usual doses.
        supports: SUPPORT
        directness: DIRECT
