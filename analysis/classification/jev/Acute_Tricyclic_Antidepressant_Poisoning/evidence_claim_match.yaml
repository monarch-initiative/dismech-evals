      assertion_type: AnimalModel
      assertion:
        name: Intraperitoneal amitriptyline rat model of tricyclic cardiotoxicity
        species: Rat
        publication: PMID:25939777
        description: 'Thirty-six female Sprague-Dawley rats were divided into six groups: three received
          intraperitoneal amitriptyline alone or with simultaneous sodium bicarbonate or hypertonic saline,
          and three served as saline/bicarbonate/control comparison groups. ECG changes and time to the
          study death endpoint were followed for 60 minutes. This tests prophylaxis during experimental
          intoxication, not delayed rescue after oral human overdose.'
        modeled_mechanisms:
        - target: Slowed His-Purkinje and Myocardial Conduction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: QRS duration lengthens significantly in every amitriptyline-treated group, so the
            conduction defect is reproduced.
          limitations: Intraperitoneal exposure, concomitant prophylactic therapy, anesthetic coexposures,
            60-minute follow-up and a heart-rate/asystole death endpoint limit translation. Blood pH was
            not measured, and sodium sampling differed between early deaths and survivors.
      selected_evidence:
        snippet: Amitriptyline was administered at a dose 50 mg/kg i.p. to induce toxicity.
        supports: SUPPORT
        directness: DIRECT
