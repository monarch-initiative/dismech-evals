          These translocations are consistently absent in true adamantinoma, despite the misleading shared
          name.
        distinguishing_features:
        - Carries the EWSR1::FLI1 t(11;22) or EWSR1::ERG t(21;22) translocation, absent in true adamantinoma
        - Not restricted to the tibial diaphysis in the same site-specific pattern as adamantinoma
        - Aggressive small round blue cell histology rather than the biphasic epithelial-osteofibrous
          pattern of adamantinoma
      selected_evidence:
        snippet: This study investigated the putative presence of t(11; 22) and t(21; 22) in 14 cases
          of adamantinoma by RT-PCR. These translocations were not found in any of these cases. The results
          support the view that these tumours are genetically and clinically distinct, but may eventually
          show overlapping morphological and immunohistochemical features.
        supports: SUPPORT
