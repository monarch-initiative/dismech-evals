  f01efa866376110d1caffb0558d7d7f389dff85e3d51cdc010f726fb1804f715:
    claim:
      about:
        disease:
          name: Adamantinoma
          disease_term:
            preferred_term: adamantinoma
            term:
              id: MONDO:0002422
              label: adamantinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: adam_ofd_progression_sequence
        prompt: Does osteofibrous dysplasia progress through an OFD-like adamantinoma intermediate to
          classic adamantinoma along a single histogenetic continuum, or are these three diagnostically
          overlapping but biologically separate entities?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Biphasic Epithelial-Osteofibrous Neoplastic Proliferation
        - pathophysiology#Recurrent Chromosomal Copy-Number Gains Without an Established Driver
        - histopathology#Osteofibrous Dysplasia-Like Pattern
        - differential_diagnoses#Osteofibrous Dysplasia
        rationale: 'Shared cytogenetic findings (trisomies 7, 8, and 12 reported in both OFD and adamantinoma)
          and shared, if focal, p63/keratin epithelial positivity in OFD have long been read as evidence
          of a common histogenesis and a possible progression sequence from OFD through OFD-like adamantinoma
          to classic adamantinoma. However, a contemporary genomic comparison found classic adamantinomas
          carry multiple chromosome/arm-level copy-number gains that OFDs largely lack, arguing the two
          may be genetically distinct rather than points on one continuum; and the largest recent single-institution
          clinicopathologic series observed a morphological continuum among the three diagnoses but did
          not observe any OFD progressing to adamantinoma during prospective follow-up (median 51 months,
          range 4-98 months). Both the "shared histogenesis/progression" and "distinct entities" readings
          remain live in the literature, and no study to date has followed a cohort of confirmed OFD cases
          long enough, with sufficiently consistent molecular workup, to settle the question. This bears
          directly on clinical management: if OFD can progress to a malignant tumor, that argues for closer
          surveillance of pediatric OFD than is currently standard.'
        proposed_experiments:
        - experiment_id: exp_adam_ofd_longitudinal_molecular_cohort
          name: Prospective longitudinal molecular cohort of OFD, OFD-like adamantinoma, and classic adamantinoma
          description: Assemble a multi-institutional cohort of histologically confirmed OFD cases with
            long-term (>15 year) clinical and radiographic follow-up, paired with serial genomic profiling
            (copy-number/SNP array or targeted sequencing) of the lesion at diagnosis and at any subsequent
            biopsy or recurrence, to determine whether any lesion acquires the classic-adamantinoma copy-number
            gain pattern over time and whether that acquisition precedes clinical/histologic progression.
      selected_evidence:
        snippet: The trisomies 7, 8, and 12 also were described in OFD, which suggests a common histogenesis
          of OFD and adamantinoma.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
