      assertion_type: Pathophysiology
      assertion:
        name: Local Recurrence After Incomplete Surgical Resection
        biological_scale: TISSUE
        description: Local recurrence is common and can occur late (documented beyond 15 years post-treatment).
          Across a synthesized literature base, local recurrence rates range from 15-31% for classic adamantinoma
          and 22-43% for the OFD-like variant. Wide resection with uncontaminated margins is the most
          consistently protective surgical variable identified across the case-series literature; intralesional
          or marginal margins predispose to recurrence.
      selected_evidence:
        snippet: Wide resection with uncontaminated margins is the most consistently protective surgical
          variable (hazard ratio 0.164; p < 0.001).
        supports: SUPPORT
