      assertion_type: Treatment
      assertion:
        name: Wide En Bloc Surgical Resection
        description: Complete surgical excision with uncontaminated (wide) margins is the standard, and
          most consistently effective, treatment for adamantinoma. Conventional chemotherapy and radiotherapy
          have not been shown to be reliably effective, so margin-negative surgery is the primary curative-intent
          modality; reconstruction (e.g., with a vascularized fibular graft) is frequently required for
          the resulting tibial defect.
        treatment_term:
          preferred_term: en bloc surgical resection
          term:
            id: NCIT:C139567
            label: En Bloc Resection
      selected_evidence:
        snippet: Wide resection with uncontaminated margins is the most consistently protective surgical
          variable (hazard ratio 0.164; p < 0.001).
        supports: SUPPORT
