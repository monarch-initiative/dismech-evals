        description: 'Classic adamantinoma metastasizes predominantly to the lungs, in an estimated 10-27%
          of cases, but metastatic spread is not confined to the lung: it is also reported to regional
          lymph nodes (including a case with inguinal nodal recurrence and no pulmonary disease at all)
          and, less commonly, to abdominal/pelvic sites, liver, brain, and skeleton. In contrast, the
          OFD-like variant, despite a locally aggressive recurrence rate, shows no metastases in series
          that report it separately, indicating a biologically distinct clinical behavior from classic
          adamantinoma despite their morphologic overlap.'
        locations:
        - preferred_term: lung
