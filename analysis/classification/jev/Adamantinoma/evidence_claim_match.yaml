      assertion_type: Diagnosis
      assertion:
        name: Centrally-Sampled Biopsy with Immunohistochemistry
        description: Because the diagnostic epithelial component can be sparse and patchy -- especially
          in OFD-like adamantinoma, where it may be detectable only by immunostain and not on light microscopy
          (see `histopathology#Osteofibrous Dysplasia-Like Pattern`) -- adequate, ideally centrally-sampled
          biopsy with immunohistochemistry (pankeratin, p40, p63) is needed to avoid false-negative or
          misclassified diagnoses; radiologic-histologic concordance is imperfect even among experienced
          centers.
        diagnosis_term:
          preferred_term: image-guided biopsy with immunohistochemistry
          term:
            id: NCIT:C15189
            label: Biopsy Procedure
      selected_evidence:
        snippet: To assure the histological diagnosis, pathologists should employ immunohistochemistry
          for demonstrating the sometimes sparse epithelial cell nests when the radiological features
          are suggestive of adamantinoma.
        supports: SUPPORT
