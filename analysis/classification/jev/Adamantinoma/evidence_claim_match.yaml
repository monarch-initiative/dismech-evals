              label: adamantinoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Ameloblastoma
        description: 'Ameloblastoma is a locally aggressive odontogenic epithelial tumor of the jaw (mandible/maxilla)
          that shares keratin-positive epithelial histology with adamantinoma of long bone, and historically
          gave adamantinoma its name, but the two are anatomically, embryologically, and clinically distinct
          entities: ameloblastoma arises from odontogenic epithelium in the jaw, whereas adamantinoma
          is a primary bone tumor with a striking predilection for the tibial diaphysis and no odontogenic
          relationship. This entry (MONDO:0002422) is NOT ameloblastoma (MONDO:0017795).'
        disease_term:
          preferred_term: ameloblastoma
          term:
            id: MONDO:0017795
            label: ameloblastoma
        distinguishing_features:
        - Arises in the jaw (mandible/maxilla) from odontogenic epithelium, not in long bones
        - No predilection for the tibial diaphysis
        - Distinct molecular drivers (e.g., BRAF V600E, SMO) not reported as recurrent in true adamantinoma
      selected_evidence:
        snippet: The tumor is called adamantinoma due to its histological similarity to ameloblastoma,
          often found in the mandible.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
