        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biphasic Epithelial-Osteofibrous Neoplastic Proliferation
        biological_scale: TISSUE
        description: Adamantinoma is defined by a neoplastic proliferation of keratin- and p63-positive
          epithelial cells, arranged in tubular, basaloid, spindle-cell, or squamoid patterns, embedded
          within a fibro-osseous (osteofibrous) stroma. The epithelial component shows a keratin subclass
          immunoreactivity pattern (widespread keratin 14 and 19, with keratin 5 in the majority of cases)
          that is independent of histologic growth pattern and is conserved in local recurrences and metastases,
          supporting a common basal epithelial cell-like histogenesis for all growth patterns. Almost
          all tumors arise in the tibial diaphysis or metaphysis.
        cell_types:
        - preferred_term: basal epithelial-like tumor cell
          term:
            id: CL:0000646
            label: basal cell
        - preferred_term: osteofibrous stromal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        locations:
        - preferred_term: tibial diaphysis
          term:
            id: UBERON:0013280
            label: diaphysis of tibia
        biological_processes:
        - preferred_term: aberrant basal epithelial differentiation of tumor cells
          modifier: ABNORMAL
          term:
            id: GO:0030855
            label: epithelial cell differentiation
      selected_evidence:
        snippet: The results revealed the widespread presence of keratins 14 and 19 in all specimens studied;
          74% showed immunoreactivity of keratin 5
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
