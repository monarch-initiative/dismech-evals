      assertion_type: Pathophysiology
      assertion:
        name: Recurrent Chromosomal Copy-Number Gains Without an Established Driver
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: 'Cytogenetic and, more recently, genomic studies of classic adamantinoma recurrently
          identify extra copies of chromosomes 7, 8, 12, 19, and 21 (and, in a targeted sequencing/SNP-array
          series, chromosomes 7, 8, 10, 12, and/or 19), sometimes accompanied by isolated structural events
          (e.g., a chromosome 12q tandem duplication, an FGFR1 rearrangement, or an NRAS p.G12D variant
          in single cases). No single recurrent driver gene, mutation, or fusion has been established
          across cases: this genomic profile is what most clearly distinguishes true adamantinoma from
          its principal molecular mimic, "adamantinoma-like Ewing sarcoma," which instead carries the
          canonical EWSR1::FLI1/ERG t(11;22) or t(21;22) translocations that are consistently absent from
          true adamantinoma. Osteofibrous dysplasia-like adamantinoma is genomically heterogeneous and,
          in a small paired series, could show either no detectable variants or the same chromosome 7/8/19
          gain pattern as classic adamantinoma, so genomic profiling has been proposed as an aid to (but
          not yet a settled arbiter of) distinguishing these entities.'
      selected_evidence:
        snippet: This study investigated the putative presence of t(11; 22) and t(21; 22) in 14 cases
          of adamantinoma by RT-PCR. These translocations were not found in any of these cases.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/3
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11592101
      reference_title: Adamantinoma-like Ewing's sarcoma and Ewing's-like adamantinoma. The t(11; 22),
        t(21; 22) status
      evidence_source: HUMAN_CLINICAL
      explanation: Shows true adamantinoma lacks the EWSR1 translocations that define its principal molecular
        mimic, adamantinoma-like Ewing sarcoma, supporting genomic distinctness despite morphologic overlap.
