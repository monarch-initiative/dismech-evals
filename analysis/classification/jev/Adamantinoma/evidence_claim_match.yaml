            label: lymph node
      selected_evidence:
        snippet: The osteofibrous dysplasia-like subtype (OFD-AD) showed no metastases in any series that
          reports this subtype separately but carries a locally aggressive recurrence rate of 22-43%.
        supports: SUPPORT
