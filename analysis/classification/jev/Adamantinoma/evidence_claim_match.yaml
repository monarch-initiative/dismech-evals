        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: Rarely, classic adamantinoma undergoes high-grade sarcomatoid transformation, with
          progressive loss of pankeratin and other epithelial marker expression in the transformed component
          (a "revertant mesenchymal phenotype"). This dedifferentiated form behaves more aggressively;
          the evidence base for its mechanism is limited to a small number of case reports.
      selected_evidence:
        snippet: 'On the en bloc resection specimen, areas of classic adamantinoma were found but most
          of the tumor corresponded to a high-grade neoplasm with 2 histologic patterns: one made up by
          epithelial nests with a basaloid arrangement and positive for pankeratins and so-called glandular
          keratins, and a second sarcomatoid component, negative for these epithelial markers.'
        supports: SUPPORT
