        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Tubular/Basaloid/Spindle-Cell/Squamoid Growth Patterns (Classic Adamantinoma)
        diagnostic: true
        description: Classic adamantinoma displays a spectrum of architectural growth patterns — tubular,
          basaloid, spindle-cell, and squamoid — within the same underlying epithelial-osteofibrous biphasic
          lesion. The keratin immunoreactivity pattern is conserved across all of these patterns, indicating
          a shared histogenesis; spindle and basaloid patterns are disproportionately associated with
          recurrence and metastasis.
        finding_term:
          preferred_term: Tubular growth pattern
          term:
            id: NCIT:C35925
            label: Tubular Pattern
      selected_evidence:
        snippet: This keratin immunoreactivity pattern was independent of histologic subtype, despite
          marked variety in differentiation pattern, suggesting a common histogenesis for all subtypes
          of adamantinoma.
        supports: SUPPORT
