      assertion_type: DifferentialDiagnosis
      assertion:
        name: Aplasia cutis-enamel dysplasia syndrome
        description: The FOSL2-related disorder overlaps AOS through localized scalp aplasia cutis with
          or without skull defects. Its reported combination of enamel hypoplasia, neurodevelopmental
          delay or autism, congenital cataracts, and prenatal growth restriction distinguishes it from
          the classic AOS ACC/terminal-limb pattern.
        distinguishing_features:
        - Enamel hypoplasia with neurodevelopmental delay or autism favors the FOSL2-related disorder.
        - Congenital cataracts and prenatal growth restriction were recurrent in the reported FOSL2 series.
        - A pathogenic last-exon truncating FOSL2 variant supports this differential; FOSL2 is not modeled
