        description: AOS denotes the clinical spectrum centered on the combination of scalp aplasia cutis
          congenita and terminal transverse limb defects. Marked intrafamilial variability and clinically
          overlapping ACC/TTLD presentations mean that this is a spectrum definition, not a sensitivity-
          or specificity-validated algorithm.
