        description: Sequence analysis of established AOS genes can identify an etiologic subtype. A 2018
          mixed AOS/isolated-ACC/TTLD cohort received a molecular diagnosis in 30% of cases before VCP
          was discovered; that cohort-specific yield must not be treated as disease prevalence or as a
          current sensitivity estimate.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
        results: A pathogenic variant in an established AOS gene supports molecular subtype assignment;
          a negative result does not erase the clinical ACC/TTLD phenotype.
      selected_evidence:
        snippet: Molecular diagnostic screening of 194 AOS/ACC/TTLD probands/families was conducted using
          next-generation and/or capillary sequencing analyses. In total, we identified 63 (likely) pathogenic
          mutations, comprising 56 distinct and 22 novel mutations, providing a molecular diagnosis in
          30% of patients.
        supports: SUPPORT
