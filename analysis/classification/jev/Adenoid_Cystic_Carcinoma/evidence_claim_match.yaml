      assertion_type: Pathophysiology
      assertion:
        name: Late Haematogenous Metastasis
        biological_scale: ORGANISM
        conforms_to: invasion_and_metastasis#Metastatic Colonization
        description: 'ACC disseminates preferentially by the haematogenous rather than the lymphatic route,
          so regional nodal involvement is comparatively uncommon while distant metastasis — most often
          pulmonary, then bone and liver — is the dominant mode of failure. The defining feature is its
          latency: distant relapse typically appears several years after primary treatment and can occur
          more than a decade later, and patients may survive for years with established metastatic disease,
          so metastasis in ACC marks a chronic phase rather than an immediately terminal one.'
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: In 20 patients, at a median free interval time of 3 years (range 1-12), a distant metastasis
          relapse was observed.
        supports: SUPPORT
