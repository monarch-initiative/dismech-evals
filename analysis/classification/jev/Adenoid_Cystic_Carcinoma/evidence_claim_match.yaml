        - preferred_term: MYB
          term:
            id: hgnc:7545
            label: MYB
      selected_evidence:
        snippet: we demonstrate that MYBL1 rearrangements and MYB amplification probably constitute alternative
          genetic drivers of breast AdCCs, functioning through MYBL1 or MYB overexpression.
        supports: SUPPORT
