    claim:
      about:
        disease:
          name: Adenoid Cystic Carcinoma
          disease_term:
            preferred_term: adenoid cystic carcinoma
            term:
              id: MONDO:0004971
              label: adenoid cystic carcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: acc_bdnf_causal_vs_marker_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is BDNF a causal driver of ACC neurotropism, or a marker of the neural-adjacent tumor
          microenvironment?
        attaches_to:
        - pathophysiology#Neurotropic Perineural Invasion
        rationale: Perineural invasion is the defining behaviour of ACC and independently predicts worse
          survival, yet the mechanistic evidence for its leading candidate mediator remains immunohistochemical
          and correlative more than two decades after the original observation. No study has shown that
          interrupting BDNF-TrkB signalling reduces perineural invasion in ACC. Because perineural spread
          is the direct cause of both cranial neuropathy and margin-positive resection, a genuinely causal
          mediator would be a high-value therapeutic target.
        proposed_experiments:
        - experiment_id: exp_acc_trkb_blockade_orthotopic
          name: TrkB blockade in orthotopic ACC models with perineural readout
          description: Apply pharmacological or genetic TrkB blockade in orthotopic ACC models and quantify
            perineural invasion histologically, testing whether interrupting the BDNF-TrkB axis reduces
            neurotropic spread.
        - experiment_id: exp_acc_organoid_drg_coculture
          name: ACC organoid-dorsal root ganglion co-culture under BDNF neutralisation
          description: Co-culture patient-derived ACC organoids with dorsal root ganglion explants under
            BDNF neutralisation to test whether directed migration toward nerve is BDNF-dependent.
      selected_evidence:
        snippet: Further studies are warranted to gain better understanding of this possible relationship.
        supports: SUPPORT
