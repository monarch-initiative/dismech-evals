          anatomically feasible. Achieving negative margins is difficult because microscopic perineural
          extension can reach beyond the visible tumor. In anterior craniofacial ACC, incomplete R2 resection
          did not improve on nonsurgical treatment, so the benefit should not be generalized to unresectable
          disease.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Definitive Surgical Resection
          term:
            id: NCIT:C154430
            label: Definitive Surgical Resection
      selected_evidence:
        snippet: In multivariable analysis, older age, male sex, thoracic cancer, the presence of regional
          and distal disease, receiving chemotherapy, not undergoing surgical resection, and being treated
          in the West vs. Northeast region were found to be independent predictors of poor survival.
        supports: SUPPORT
