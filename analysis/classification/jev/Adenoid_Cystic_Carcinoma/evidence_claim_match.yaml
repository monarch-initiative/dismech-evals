        variant_origin: SOMATIC
        relationship_type: SOMATIC_DRIVER
        notes: Somatic gain-of-function NOTCH1 mutations cluster in the negative regulatory region and
          PEST domain. In the largest integrated series they occur in 8.5% of primary and 26.3% of recurrent/metastatic
          tumors, an approximately three-fold enrichment with progression (Ho et al., PMID:31483290).
          Figures around 13.7% (NOTCH1 alone) and 20.5% (broader Notch-pathway genes) come from a separate
          mixed primary-plus-recurrent cohort of 102 tumors and are not primary-restricted (Ferrarotto
          et al., PMID:27870570); the two denominators should not be compared directly. NOTCH1 mutation
          defines an aggressive solid-histology subgroup and is the actionable biomarker for Notch-directed
          therapy.
      selected_evidence:
        snippet: Approximately 20% of patients with ACC carry NOTCH-activating mutations that are associated
          with a distinct phenotype, aggressive disease, and poor prognosis.
        supports: SUPPORT
