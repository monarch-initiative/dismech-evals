  db4aa7aeb4fc6c88594bab89776e0dc087559222f4fa32d8038708c2ddace73e:
    claim:
      about:
        disease:
          name: Adenoid Cystic Carcinoma
          disease_term:
            preferred_term: adenoid cystic carcinoma
            term:
              id: MONDO:0004971
              label: adenoid cystic carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MYB-NFIB Fusion Oncogene Formation
        genetic_context:
          variant_origin: SOMATIC
        biological_scale: MOLECULAR
        description: A recurrent t(6;9)(q22-23;p23-24) translocation fuses the MYB proto-oncogene at 6q23
          to the transcription factor gene NFIB at 9p23-24, producing chimeric transcripts in which MYB
          exon 14 is joined to the last coding exon(s) of NFIB. The rearrangement consistently deletes
          MYB exon 15 including the 3' UTR, which carries conserved binding sites for the repressive miR-15a/16
          and miR-150 microRNAs. Loss of this post-transcriptional brake is the proximate mechanism of
          MYB overexpression. Reported prevalence varies widely across cohorts, largely reflecting assay
          methodology rather than true biological heterogeneity.
        genes:
        - preferred_term: MYB
          term:
            id: hgnc:7545
            label: MYB
        - preferred_term: NFIB
          term:
            id: hgnc:7785
            label: NFIB
        cell_types:
        - preferred_term: salivary gland cell
          term:
            id: CL:0009005
            label: salivary gland cell
      selected_evidence:
        snippet: The minimal common part of MYB deleted as the result of fusion was exon 15 including
          the 3'-UTR, which contains several highly conserved target sites for miR-15a/16 and miR-150
          microRNAs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
