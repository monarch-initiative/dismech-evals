        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: acc_myb_not_prognostic_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does MYB-family activation, which is present in the great majority of ACCs and is
          the defining lesion of the disease, carry no prognostic information?
        attaches_to:
        - pathophysiology#MYB-Driven Oncogenic Transcriptional Program
        rationale: A systematic review of 36 studies found no consistent association between t(6;9)(MYB-NFIB)
          status and survival, while NOTCH1 mutation, TERT promoter mutation, solid histology, and perineural
          invasion all stratify outcome strongly. This implies that MYB activation is necessary for the
          ACC phenotype but that the clinically important variation lies in the cooperating lesions layered
          on top of it. Which cooperating events convert an indolent MYB-driven tumor into an aggressive
          one is not resolved.
        proposed_experiments:
        - experiment_id: exp_acc_multiregion_progression_sequencing
          name: Multi-region sequencing of matched indolent and aggressive ACC
          description: Sequence multiple regions of matched indolent and aggressive tumors from the same
            patient to identify progression-specific cooperating alterations against a constant MYB-fusion
            background, separating drivers of aggressiveness from the shared initiating lesion.
        - experiment_id: exp_acc_isogenic_cooperating_lesions
          name: Isogenic dissection of cooperating lesions on a MYB-NFIB background
          description: Express MYB-NFIB in isogenic salivary epithelial models with and without candidate
            cooperating lesions (NOTCH1 activation, TERT promoter mutation, chromatin-remodeler loss)
            and assay invasive and metastatic capacity to test which lesion supplies the aggressive phenotype.
      selected_evidence:
        snippet: A total of 11 studies attempted to determine the prognostic importance of the translocation,
          but no study found any significant association with survival rates
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
