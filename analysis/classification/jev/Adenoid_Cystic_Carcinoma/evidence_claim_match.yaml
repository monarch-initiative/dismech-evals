      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: bdnf_neurotropism
        hypothesis_label: BDNF-Mediated Neurotropism Model of Perineural Invasion
        status: EMERGING
        description: 'ACC uniformly expresses brain-derived neurotrophic factor, and BDNF-TrkB neurotrophin
          signalling is the leading candidate explanation for the tumor''s unusual predilection for perineural
          spread. The supporting human evidence is immunohistochemical and correlative rather than functional:
          no study has yet shown that blocking BDNF or TrkB reduces perineural invasion in ACC. The alternative
          interpretation — that BDNF expression is a marker of the neural-adjacent microenvironment rather
          than a driver of neurotropism — has not been excluded.'
      selected_evidence:
        snippet: Further studies are warranted to gain better understanding of this possible relationship.
        supports: SUPPORT
