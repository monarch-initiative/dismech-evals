        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neurotropic Perineural Invasion
        biological_scale: TISSUE
        description: 'Perineural invasion is the single most characteristic pathophysiological behaviour
          of ACC: tumor cells track along the perineural and endoneural spaces of named nerves, forming
          a target-like cuff around nerve fascicles and extending microscopically far beyond the grossly
          visible tumor margin, in many cases to the skull base. Brain-derived neurotrophic factor (BDNF),
          a neurotrophin involved in neurogenesis, is uniformly expressed by ACC and is the leading candidate
          mediator of this neurotropism. Perineural spread is the principal reason margin-negative resection
          is difficult and local recurrence is late and frequent.'
        locations:
        - preferred_term: nerve
          term:
            id: UBERON:0001021
            label: nerve
      selected_evidence:
        snippet: This is accounted for histologically by its infiltrative capacity and distinct propensity
          for perineural invasion.
        supports: SUPPORT
