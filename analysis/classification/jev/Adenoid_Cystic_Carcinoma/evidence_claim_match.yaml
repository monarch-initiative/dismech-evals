  6afd788a84faee2a2a1360fdc97acc8e00c1f25cde457de27641ba1588fa75f5:
    claim:
      about:
        disease:
          name: Adenoid Cystic Carcinoma
          disease_term:
            preferred_term: adenoid cystic carcinoma
            term:
              id: MONDO:0004971
              label: adenoid cystic carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MYB-Driven Oncogenic Transcriptional Program
        biological_scale: CELLULAR
        description: 'Overexpressed MYB (or MYBL1), acting as a sequence-specific DNA-binding transcription
          factor, drives a transcriptional program promoting cell-cycle progression, survival, angiogenesis
          and adhesion. Critically, MYB binds lineage-specific enhancers and therefore drives different
          regulatory programs in the two cell compartments of the tumor: it cooperates with TP63 in myoepithelial
          cells and with a Notch program in luminal epithelial cells. This single-driver, two-program
          behaviour is the molecular explanation for the defining biphasic architecture of ACC.'
        molecular_functions:
        - preferred_term: MYB DNA-binding transcription factor activity
          modifier: INCREASED
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        biological_processes:
        - preferred_term: MYB target gene transcriptional activation
          modifier: INCREASED
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: Our data indicate that the MYB-NFIB fusion is a hallmark of ACC and that deregulation
          of the expression of MYB and its target genes is a key oncogenic event in the pathogenesis of
          ACC.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
