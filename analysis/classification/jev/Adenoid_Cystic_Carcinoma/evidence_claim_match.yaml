        biological_scale: MOLECULAR
        description: 'In tumors lacking the MYB-NFIB fusion, the same MYB-family transcriptional output
          is reached by alternative genetic routes: rearrangements of the second MYB-family gene MYBL1
          (MYBL1-NFIB, MYBL1-ACTN1) or high-level amplification of MYB itself, each producing MYBL1 or
          MYB overexpression. These lesions are mutually exclusive with the MYB-NFIB fusion, making ACC
          a convergent phenotype at the level of MYB-family activation rather than a single-lesion disease.'
        genes:
