        measure_type: UNKNOWN
        prevalence_class: RARE
        notes: ACC is consistently characterised as a rare malignancy, accounting for a small fraction
          of head and neck cancers and roughly one in ten salivary gland neoplasms. Published incidence
          figures are on the order of a few cases per million per year, but the sources reviewed here
          state rarity qualitatively rather than reporting a directly quotable rate, so only the coarse
          class is recorded. A registry-derived numeric rate remains a curation gap.
