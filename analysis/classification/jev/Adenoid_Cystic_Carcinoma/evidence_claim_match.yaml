        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Super-Enhancer Translocation and MYB Positive Feedback Loop
        biological_scale: MOLECULAR
        description: Beyond creating a chimeric protein, the recurrent rearrangements act as regulatory
          translocations that juxtapose distal super-enhancers to the MYB locus. MYB protein then binds
          these translocated enhancers itself, establishing a self-sustaining positive feedback loop that
          locks in MYB overexpression. This enhancer dependency is the rationale for bromodomain (BET)
          inhibition in preclinical ACC models.
        biological_processes:
        - preferred_term: enhancer-driven positive regulation of MYB transcription
          modifier: INCREASED
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: we identify super-enhancer translocations that drive overexpression of the oncogenic
          transcription factor MYB as a recurrent theme in adenoid cystic carcinoma (ACC)
        supports: SUPPORT
    origin:
