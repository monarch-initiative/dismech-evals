      assertion_type: Genetic
      assertion:
        name: KRAS
        gene_term:
          preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        relationship_type: SOMATIC_DRIVER
        association: Activating somatic KRAS mutations are the characteristic genetic lesion of adenomyosis,
          confined to endometrial-type epithelial cells and shared with matched eutopic endometrium and
          with endometriosis, while absent from the driver landscape of uterine leiomyoma. They confer
          survival and proliferative advantage and are associated with progesterone resistance.
        case_fractions:
        - population: Japanese adenomyosis cohort, multi-regional NGS
          case_fraction_percent: 37.1
          cohort_size: 70
          notes: 26/70 individuals, 192 multi-regional samples.
        - population: Taiwanese adenomyosis cohort, 275-gene targeted NGS panel
          case_fraction_percent: 24.0
          cohort_size: 17
          notes: Smaller targeted-panel series; KRAS was the most frequently mutated gene, ARID1A second.
      selected_evidence:
        snippet: Activating mutations of KRAS are the most commonly found genetic variant in endometriotic
          epithelial cells, whereas the adenomyotic epithelial cells almost exclusively bear KRAS mutations.
        supports: SUPPORT
    origin:
