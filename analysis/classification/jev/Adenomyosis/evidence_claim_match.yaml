      assertion_type: Pathophysiology
      assertion:
        name: Lesional Fibrosis and Myofibroblast Transdifferentiation
        biological_scale: TISSUE
        conforms_to: fibrotic_response#Mesenchymal Cell Activation
        description: 'Adenomyotic lesions behave as wounds undergoing repeated tissue injury and repair,
          and their natural history is progressive fibrosis via three linked routes: epithelial-mesenchymal
          transition, fibroblast-to-myofibroblast transdifferentiation, and smooth muscle metaplasia.
          This is the same central-effector step conserved across organs in the fibrotic_response module,
          with the uterine specialization that smooth muscle metaplasia contributes alongside classical
          myofibroblast conversion. Fibrosis is not confined to the lesion: it propagates into the neighbouring
          endometrial-myometrial interface and endometrium, which is what converts a focal lesion into
          the diffuse uterine phenotype and links the lesion directly to heavy menstrual bleeding.'
        locations:
        - preferred_term: myometrium
          term:
            id: UBERON:0001296
            label: myometrium
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        - preferred_term: myofibroblast
          term:
            id: CL:0000186
            label: myofibroblast cell
        - preferred_term: uterine smooth muscle cell
          term:
            id: CL:0002601
            label: uterine smooth muscle cell
        biological_processes:
        - preferred_term: epithelial to mesenchymal transition
          term:
            id: GO:0001837
            label: epithelial to mesenchymal transition
          modifier: INCREASED
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: ABNORMAL
        - preferred_term: wound healing
          term:
            id: GO:0042060
            label: wound healing
          modifier: ABNORMAL
      selected_evidence:
        snippet: adenomyotic lesions are fundamentally wounds undergoing repeated tissue injury and repair
          (ReTIAR), which progress to fibrosis through epithelial-mesenchymal transition, fibroblast-to-myofibroblast
          transdifferentiation, and smooth muscle metaplasia
        supports: SUPPORT
