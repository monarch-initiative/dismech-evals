              id: MONDO:0010888
              label: adenomyosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic KRAS Activation in Endometrial Epithelium
        biological_scale: MOLECULAR
        description: Adenomyotic epithelial cells carry activating KRAS mutations almost exclusively,
          and the same mutations map to matched intracavitary endometrial tissue — the genetic argument
          that the lesion originates from eutopic endometrium rather than arising in situ. Mutations are
          restricted to endometrial-type epithelial cells and are absent from the surrounding smooth muscle;
          conversely, the driver mutations characteristic of uterine fibroids are not found in adenomyosis,
          separating the two commonest myometrial disorders at the molecular level. Activated KRAS signaling
          increases cell survival and proliferation and is associated with progesterone resistance.
        cell_types:
        - preferred_term: glandular epithelial cell of endometrium
          term:
            id: CL:0009084
            label: glandular epithelial cell of endometrium
        genes:
        - preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        biological_processes:
        - preferred_term: Ras protein signal transduction
          term:
            id: GO:0007265
            label: Ras protein signal transduction
          modifier: INCREASED
      selected_evidence:
        snippet: KRAS and other less frequent mutations are limited to endometrial-type epithelial cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
