  3f9fbd9d9fc9646f36ea1e57178067578c12900313a32858f194d2188635b248:
    claim:
      about:
        disease:
          name: Adenomyosis
          disease_term:
            preferred_term: adenomyosis
            term:
              id: MONDO:0010888
              label: adenomyosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Local Estrogen Production and TIAR Self-Perpetuation
        biological_scale: TISSUE
        description: The tissue injury and repair response includes local estrogen production at the site
          of injury. Because uterine peristalsis is itself under ovarian steroid control, locally produced
          estrogen acts in a paracrine fashion to override that control, driving further hyperperistalsis
          and further injury. This feed-forward loop is what converts a self-limited repair response into
          a self-perpetuating disease process, and it explains why adenomyosis progresses across the reproductive
          years and regresses after menopause.
        biological_processes:
        - preferred_term: estrogen biosynthetic process
          term:
            id: GO:0006703
            label: estrogen biosynthetic process
          modifier: INCREASED
        - preferred_term: cellular response to estrogen stimulus
          term:
            id: GO:0071391
            label: cellular response to estrogen stimulus
          modifier: INCREASED
      selected_evidence:
        snippet: With ongoing peristaltic activity, such sites might increase and the increasingly produced
          estrogens interfere in a paracrine fashion with the ovarian control over uterine peristaltic
          activity, resulting in permanent hyperperistalsis and a self-perpetuation of the disease process.
        supports: SUPPORT
    origin:
