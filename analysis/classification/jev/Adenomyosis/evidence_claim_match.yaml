      assertion_type: Pathophysiology
      assertion:
        name: Aromatase-Driven Estrogen Signaling and Progesterone Resistance
        biological_scale: MOLECULAR
        description: 'Epigenetic abnormalities in lesional stromal cells produce an abnormal nuclear receptor
          expression pattern. The consequences are excessive local estrogen biosynthesis by aromatase,
          abnormal estrogen action routed through estrogen receptor beta, and deficient progesterone receptor
          expression yielding progesterone resistance. This receptor lesion is shared with endometriosis
          and is clinically consequential: it is the mechanistic reason progestin-based therapy is variably
          effective, and the rationale for combining or substituting agents that lower estrogen exposure.'
        cell_types:
        - preferred_term: endometrial stromal cell
          term:
            id: CL:0002255
            label: stromal cell of endometrium
        biological_processes:
        - preferred_term: estrogen biosynthetic process
          term:
            id: GO:0006703
            label: estrogen biosynthetic process
          modifier: INCREASED
        - preferred_term: response to progesterone
          term:
            id: GO:0032570
            label: response to progesterone
          modifier: DECREASED
      selected_evidence:
        snippet: These epigenetic defects give rise to excessive local estrogen biosynthesis by aromatase
          and abnormal estrogen action via estrogen receptor-β.
        supports: SUPPORT
    origin:
