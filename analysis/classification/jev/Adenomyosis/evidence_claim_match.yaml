            term:
              id: MONDO:0010888
              label: adenomyosis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: emid_model
        hypothesis_label: Endometrial-myometrial interface disruption (EMID)
        status: EMERGING
        description: A more recent reframing that shifts emphasis from how endometrial tissue gets into
          the myometrium to what breaches the interface in the first place. EMID holds that iatrogenic
          or obstetric disruption of the endometrial-myometrial interface is the initiating event, and
          is supported by epidemiologic data associating adenomyosis with uterine instrumentation and
          parturition, plus a mouse model. It also implicates Schwann cells in the interface region in
          lesion genesis, a cell type absent from both the invagination and metaplasia accounts. EMID
          is compatible with, rather than exclusive of, the TIAR-invagination model — it proposes a specific
          class of initiating injury for the same repair-driven cascade.
      selected_evidence:
        snippet: a new hypothesis, called endometrial-myometrial interface disruption (EMID), which is
          backed by extensive epidemiologic data and demonstrated by a mouse model, is reviewed, along
          with recent data implicating the role of Schwann cells in the EMI area in the genesis of adenomyosis
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
      context_paths:
