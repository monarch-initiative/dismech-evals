      - /disease_term
    evidence_metadata:
      reference: PMID:19644696
      reference_title: 'The pathophysiology of endometriosis and adenomyosis: tissue injury and repair.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the TIAR mechanism and localizes the initiating microtrauma to the endometrial-myometrial
