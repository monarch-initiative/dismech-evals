      assertion_type: Discussion
      assertion:
        discussion_id: adenomyosis_two_phase_invasion
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Basalis Invagination and Myometrial Infiltration
        prompt: Are epithelial-mesenchymal transition and collective cell migration sequential phases
          of a single invasive program in adenomyosis, or alternative programs operating in different
          lesions?
        rationale: EMT evidence comes from human lesions with mouse corroboration and is assigned to early
          progression; collective migration evidence comes from a baboon model and is assigned to later
          invasion. The temporal assignment rests on comparing findings across different species and model
          systems rather than on a single longitudinal series, so the ordering is an inference rather
          than an observation. Whether invasiveness is genuinely time-dependent — and if so, when the
          switch occurs — matters for whether an anti-EMT strategy would help established disease or only
          prevent early spread.
      selected_evidence:
        snippet: This suggests that the invasiveness of this complex uterine disorder is not driven by
          a single mechanism of migration but by a time-dependent combination of two processes.
        supports: SUPPORT
