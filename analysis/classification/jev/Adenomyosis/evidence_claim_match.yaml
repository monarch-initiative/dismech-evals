      assertion_type: EpidemiologyInfo
      assertion:
        name: Diagnostic ascertainment and prevalence uncertainty
        description: Adenomyosis prevalence estimates vary widely because the diagnosis was historically
          confined to hysterectomy specimens, biasing series toward severe symptomatic disease in older
          parous women. Imaging-based diagnosis has broadened ascertainment but introduced its own variability,
          since junctional zone criteria differ between studies and transient peristaltic junctional zone
          enlargement can mimic disease. Adenomyosis remains, on the authors' assessment, among the most
          challenging uterine disorders to diagnose.
      selected_evidence:
        snippet: is one of the most challenging uterine disorders in terms of diagnosis and management
        supports: SUPPORT
