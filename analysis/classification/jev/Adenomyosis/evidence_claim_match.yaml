              id: MONDO:0010888
              label: adenomyosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Uterine Hyperperistalsis and Junctional Zone Microtrauma
        biological_scale: TISSUE
        description: The endometrial-myometrial junction, visible on MRI as the junctional zone, is the
          site of initiating injury. Chronic uterine peristaltic activity, or episodic hyperperistalsis,
          inflicts repeated microtrauma at this interface, concentrated near the fundo-cornual raphe.
          Junctional zone thickening is the imaging correlate and the basis of non-invasive diagnosis.
          The model accommodates both early-onset disease, where an event early in reproductive life triggers
          hyperperistalsis, and late premenopausal adenomyosis, where cumulative normoperistalsis over
          decades produces equivalent microtraumatization.
        locations:
        - preferred_term: myometrium
          term:
            id: UBERON:0001296
            label: myometrium
        - preferred_term: endometrium
          term:
            id: UBERON:0001295
            label: endometrium
        cell_types:
        - preferred_term: uterine smooth muscle cell
          term:
            id: CL:0002601
            label: uterine smooth muscle cell
        biological_processes:
        - preferred_term: wound healing
          term:
            id: GO:0042060
            label: wound healing
          modifier: INCREASED
      selected_evidence:
        snippet: as indicated by the high prevalence of the disease, it appears to be unavoidable that,
          with time, chronic normoperistalsis throughout the reproductive period of life leads to the
          same extent of microtraumatization
        supports: SUPPORT
