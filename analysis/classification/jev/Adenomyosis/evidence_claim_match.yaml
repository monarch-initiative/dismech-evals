      assertion_type: DifferentialDiagnosis
      assertion:
        name: Uterine leiomyoma
        description: 'Uterine fibroids are the principal clinical mimic, sharing heavy menstrual bleeding,
          pelvic pain, and uterine enlargement. The two are separable molecularly: the driver mutations
          of uterine fibroid smooth muscle are absent from adenomyosis, whose driver (KRAS) is confined
          to endometrial-type epithelium. Imaging distinguishes the diffuse, ill-defined junctional zone
          thickening of adenomyosis from the discrete, well-circumscribed leiomyoma.'
      selected_evidence:
        snippet: Driver mutations found in smooth muscle cells of uterine fibroids are absent in adenomyosis.
        supports: SUPPORT
