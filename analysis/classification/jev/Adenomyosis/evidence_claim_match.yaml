      assertion:
        name: Junctional zone thickening on MRI
        description: Thickening of the junctional zone — the inner myometrium adjacent to the endometrium
          — is the principal MRI criterion for adenomyosis. Careful multiplanar visualization is required
          to distinguish true adenomyotic lesions from transient junctional zone enlargement caused by
          peristaltic waves or sporadic myometrial contractions, which otherwise mimic the diagnosis.
      selected_evidence:
        snippet: By this method of "visualization" all transient enlargement of the JZ, such as peristaltic
          waves of the archimyometrium and sporadic neometral contractions that might mimic adenomyotic
          lesions could be excluded.
        supports: SUPPORT
