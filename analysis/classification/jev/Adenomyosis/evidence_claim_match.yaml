      assertion_type: Discussion
      assertion:
        discussion_id: adenomyosis_invagination_vs_metaplasia
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Basalis Invagination and Myometrial Infiltration
        prompt: Does adenomyosis arise by invagination of basalis endometrium through an injured junctional
          zone, or by metaplasia of Müllerian remnants and resident stem cells already within the myometrium?
        rationale: 'The two theories predict different origins for the lesional epithelium and therefore
          different prevention strategies: reducing junctional zone microtrauma versus targeting a resident
          progenitor population. Next-generation sequencing has moved the field substantially toward invagination,
          because KRAS mutations map to both adenomyotic lesions and the matched intracavitary endometrium
          — hard to reconcile with an independent in-situ origin. The debate is nonetheless recorded as
          live rather than settled: deep lesions without demonstrable continuity with the basalis, and
          adenomyosis in women without evident junctional zone disruption, are not fully explained by
          invagination alone. The two mechanisms are not mutually exclusive and may account for different
          lesion subsets.'
        proposed_experiments:
        - experiment_id: exp_adenomyosis_clonal_lineage_mapping
          name: Spatially resolved clonal lineage mapping from cavity to deep lesion
          description: Perform spatially resolved single-cell sequencing along a continuous transect from
            intracavitary endometrium through the junctional zone into deep adenomyotic lesions in hysterectomy
            specimens, testing whether lesional clones form a contiguous mutational gradient with the
            eutopic endometrium (invagination) or constitute independent clones lacking shared ancestry
            (metaplasia). Deep lesions without junctional zone continuity are the informative cases.
      selected_evidence:
        snippet: Two main theories have been proposed to explain the origin of adenomyosis.
        supports: SUPPORT
