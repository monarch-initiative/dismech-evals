      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: invagination_tiar_model
        hypothesis_label: Basalis invagination driven by tissue injury and repair at the endometrial-myometrial
          junction
        status: CANONICAL
        description: 'The dominant model holds that adenomyosis begins with microtrauma at the endometrial-myometrial
          interface, inflicted by chronic uterine peristalsis or hyperperistalsis. Injury activates the
          physiological tissue injury and repair (TIAR) response, including local estrogen production,
          which in an estrogen-sensitive organ feeds back to intensify peristalsis and perpetuate the
          injury. The basalis endometrium then invaginates into the myometrial wall. Molecular genetics
          supports this route: adenomyotic epithelium carries KRAS mutations shared with the matched eutopic
          endometrium, placing the origin of the lesion in intracavitary endometrial tissue rather than
          in situ within the myometrium.'
      selected_evidence:
        snippet: chronic uterine peristaltic activity or phases of hyperperistalsis induce, at the endometrial-myometrial
          interface near the fundo-cornual raphe, microtraumatizations with the activation of the mechanism
          of 'tissue injury and repair' (TIAR)
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
