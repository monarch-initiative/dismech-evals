      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: metaplasia_stem_cell_model
        hypothesis_label: Metaplasia of Müllerian remnants or resident stem/progenitor cells
        status: ALTERNATIVE
        description: The competing model holds that adenomyotic lesions arise de novo within the myometrium,
          by metaplastic differentiation of displaced embryonic pluripotent Müllerian remnants or of adult
          endometrial stem/progenitor cells resident in the myometrium, rather than by invasion from the
          uterine cavity. This model accounts more naturally for deep lesions with no demonstrable continuity
          with the basalis, but it is not supported by the somatic-mutation concordance between eutopic
          endometrium and adenomyotic epithelium.
      selected_evidence:
        snippet: An alternative theory maintains that adenomyotic lesions result from metaplasia of displaced
          embryonic pluripotent Müllerian remnants or differentiation of adult stem cells.
        supports: SUPPORT
