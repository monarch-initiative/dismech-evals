      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other Hypermethioninemic Disorders
        description: The differential diagnosis of elevated methionine includes CBS deficiency, MAT1A
          deficiency, GNMT deficiency, AHCY deficiency, citrin deficiency, and FAH deficiency/tyrosinemia
          type I.
        distinguishing_features:
        - CBS deficiency usually produces homocystinuria with elevated homocysteine.
        - MAT1A, GNMT, and AHCY deficiencies are alternative methionine-cycle disorders with overlapping
          hypermethioninemia.
        - Citrin deficiency and tyrosinemia type I can also present with hypermethioninemia, but the broader
          metabolic context differs.
        - ADK deficiency is distinguished by the combination of hypermethioninemia with elevated S-adenosylhomocysteine
          and ADK variants.
      selected_evidence:
        snippet: This review covers briefly the major conditions, genetic and non-genetic, sometimes leading
          to abnormally elevated methionine, with emphasis on recent developments. A major aim is to assist
          in the differential diagnosis of hypermethioninemia.
