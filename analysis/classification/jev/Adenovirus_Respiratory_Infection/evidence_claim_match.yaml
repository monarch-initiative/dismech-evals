      assertion:
        name: Innate Antiviral Response
        biological_scale: CELLULAR
        conforms_to: innate_antiviral_interferon_response#Interferon-Stimulated Gene Antiviral State
        description: Intrinsic restriction factors, pattern-recognition receptors, and cytosolic DNA sensors
          mount an antiviral response to adenovirus and trigger interferon. Adenovirus early proteins
          and virus-associated RNAs counter several of these defenses, so the net response varies by cell
          and host context.
        biological_processes:
        - preferred_term: antiviral innate immune response
          term:
            id: GO:0140374
            label: antiviral innate immune response
        - preferred_term: defense response to virus
          term:
            id: GO:0051607
            label: defense response to virus
      selected_evidence:
        snippet: Important innate factors restricting adenovirus in the cytosol are tripartite motif-containing
          proteins, nucleotide-binding oligomerization domain-like inflammatory receptors, and DNA sensors
          triggering interferon, such as DEAD (Asp-Glu-Ala-Asp) box polypeptide 41 and cyclic guanosine
          monophosphate-adenosine monophosphate synthase.
        supports: SUPPORT
