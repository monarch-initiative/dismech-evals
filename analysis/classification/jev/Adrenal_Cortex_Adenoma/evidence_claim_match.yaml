  c9d846c64f86e073508c436b3b9a988399d01d07e27cfb182f4949fb97aa2ec8:
    claim:
      about:
        disease:
          name: Adrenal Cortex Adenoma
          disease_term:
            preferred_term: adrenal cortex adenoma
            term:
              id: MONDO:0003924
              label: adrenal cortex adenoma
        context:
        - path: /has_subtypes/1
          value:
            name: MACS
            display_name: Mild Autonomous Cortisol Secretion (MACS)
            description: 'Biochemical cortisol autonomy — serum cortisol above 50 nmol/L (1.8 ug/dL) after
              a 1-mg overnight dexamethasone suppression test — in a patient without the clinical signs
              of overt Cushing syndrome. Formerly dismissed as "subclinical hypercortisolism", MACS is
              now recognised as a genuine cardiometabolic risk condition carrying excess hypertension,
              type 2 diabetes, osteoporosis, fracture and all-cause mortality relative to non-functioning
              adenomas. It is by far the largest functional group: roughly 45% of benign adrenal tumours
              in the ENSAT EURINE-ACT cohort fell into the MACS-1 or MACS-2 strata.'
          role: subtype
      assertion_type: Phenotype
      assertion:
        category: Musculoskeletal
        name: Vertebral Fracture
        subtype: MACS
        description: Fragility fracture of the vertebral body. Roughly twice as likely in adrenal adenoma
          with MACS as in non-functioning adenoma — one of the key observations that reclassified MACS
          from benign to consequential.
        phenotype_term:
          preferred_term: Vertebral compression fracture
          term:
            id: HP:0002953
            label: Vertebral compression fracture
        frequency: FREQUENT
        notes: Bound to HP:0002953 (Vertebral compression fracture) because the claim and its evidence
          concern fracture *events*. An earlier draft used HP:0005625 (Osteoporosis of vertebrae), which
          asserts bone density rather than fracture and partly duplicated the separate Osteoporosis phenotype;
          that was corrected in review.
      selected_evidence:
        snippet: 'vertebral fractures (OR 2.10; 95% CI: 1.28, 3.45; P = 0.0035)'
        supports: SUPPORT
    origin:
