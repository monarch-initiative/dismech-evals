  760200eb3ee712fa3fcb141a9212833dfee104159eaec084a3693c2cfcfd25d4:
    claim:
      about:
        disease:
          name: Adrenal Cortex Adenoma
          disease_term:
            preferred_term: adrenal cortex adenoma
            term:
              id: MONDO:0003924
              label: adrenal cortex adenoma
        context: []
      assertion_type: Biochemical
      assertion:
        name: 1-mg Overnight Dexamethasone Suppression Test Cortisol
        biomarker_term:
          preferred_term: cortisol
          term:
            id: CHEBI:17650
            label: cortisol
        notes: The pivotal test for cortisol autonomy in adrenal adenoma. Dexamethasone 1 mg is given
          at 2300 h and serum cortisol measured at 0800-0900 h the next morning. In a normal hypothalamic-pituitary-adrenal
          axis, cortisol suppresses below 50 nmol/L. Failure to suppress indicates that adrenal cortisol
          output is not under pituitary control.
        reference_ranges:
        - loinc_term:
            id: LOINC:97765-2
            label: Cortisol [Moles/volume] in Serum or Plasma --post dose dexamethasone PO overnight
          upper_bound: 50.0
          unit: nmol/L
          population: adults with an adrenal incidentaloma, no exogenous glucocorticoid or interfering
            medication
          notes: 'One-sided interval: suppression to below 50 nmol/L (1.8 ug/dL) is the normal / non-functioning
            result under the 2023 ESE guideline cutoff. Results are invalid in patients on drugs that
            induce or inhibit CYP3A4, or with abnormal cortisol-binding globulin. The LOINC code was verified
            against the NLM clinical-tables LOINC service; LOINC is not covered by the repository''s OAK
            term validation.'
          interpretation_bands:
          - name: Non-functioning adenoma
            upper_bound: 50.0
            unit: nmol/L
            abnormal_flag: NORMAL
            interpretation: Cortisol suppressed. No cortisol autonomy; the adenoma is non-functioning
              with respect to glucocorticoid secretion.
          - name: Possible MACS (MACS-1)
            lower_bound: 50.0
            upper_bound: 138.0
            unit: nmol/L
            abnormal_flag: HIGH
            phenotype_term:
              preferred_term: Increased circulating cortisol level
              term:
                id: HP:0003118
                label: Increased circulating cortisol level
            interpretation: Partial non-suppression, classified as possible autonomous cortisol secretion
              in the NAPACA and EURINE-ACT stratifications. Already associated with excess cardiometabolic
              comorbidity and increased all-cause mortality.
          - name: Definitive MACS (MACS-2)
            lower_bound: 138.0
            unit: nmol/L
            abnormal_flag: HIGH
            phenotype_term:
              preferred_term: Increased circulating cortisol level
              term:
                id: HP:0003118
                label: Increased circulating cortisol level
            interpretation: Frank non-suppression above 138 nmol/L in the absence of typical clinical
              Cushing features. The same result accompanied by overt Cushing stigmata is classified as
              Cushing syndrome rather than MACS — the distinction at this threshold is clinical, not biochemical.
      selected_evidence:
        snippet: 'serum cortisol: <50 nmol/L, nonfunctioning adrenal tumor ... ; 50 to 138 nmol/L, possible
          MACS ... ; >138 nmol/L and absence of typical clinical Cushing syndrome'
        supports: SUPPORT
