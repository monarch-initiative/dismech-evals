      assertion_type: Subtype
      assertion:
        name: Cortisol-Producing
        display_name: Cortisol-Producing Adenoma (overt Cushing syndrome)
        description: A unilateral adenoma secreting cortisol autonomously and sufficiently to produce
          clinically overt ACTH-independent Cushing syndrome. Somatic PRKACA hotspot mutations are the
          dominant driver; GNAS activating mutations account for an additional subset. Cortisol autonomy
          suppresses pituitary ACTH and causes atrophy of the contralateral adrenal cortex, so unilateral
          adrenalectomy is followed by transient adrenal insufficiency requiring glucocorticoid cover.
        genes:
        - preferred_term: PRKACA
          term:
            id: hgnc:9380
            label: PRKACA
        - preferred_term: GNAS
          term:
            id: hgnc:4392
            label: GNAS
      selected_evidence:
        snippet: somatic PRKACA mutations resulted in unilateral cortisol-producing adrenal adenomas
        supports: SUPPORT
