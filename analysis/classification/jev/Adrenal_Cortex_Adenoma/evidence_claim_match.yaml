      assertion:
        name: Renin-Independent Mineralocorticoid Excess
        biological_scale: ORGANISM
        role: effector
        description: Excess aldosterone acting on the distal nephron produces sodium retention with volume
          expansion, kaliuresis and hydrogen-ion loss. The resulting biochemical signature is hypertension
          with a suppressed plasma renin and an elevated aldosterone-to-renin ratio, sometimes with hypokalaemia
          (and, when hypokalaemia is marked, a metabolic alkalosis that is not separately curated here
          for want of an adenoma-specific citable source). Normokalaemia does not exclude primary aldosteronism
          — an important reason the condition is under-recognised.
      selected_evidence:
        snippet: Aldosterone signaling defends intravascular volume by increasing intestinal and renal
          Na-Cl absorption and reabsorption, respectively.
        supports: SUPPORT
