        genetic_context:
          variant_origin: SOMATIC
        biological_scale: MOLECULAR
        role: driver
        description: 'Aldosterone-producing adenomas carry mutually exclusive somatic mutations in a small
          set of genes encoding ion channels and pumps of the zona glomerulosa plasma membrane: KCNJ5
          (inwardly rectifying K+ channel; the commonest), CACNA1D (Cav1.3 L-type calcium channel), ATP1A1
          (Na+/K+-ATPase alpha subunit) and ATP2B3 (plasma-membrane Ca2+-ATPase). CTNNB1 mutations occur
          in a minority. Different genes, one shared functional endpoint — the resting membrane potential
          of the glomerulosa cell can no longer be maintained.'
        genes:
        - preferred_term: KCNJ5
          term:
            id: hgnc:6266
            label: KCNJ5
        - preferred_term: CACNA1D
          term:
            id: hgnc:1391
            label: CACNA1D
        - preferred_term: ATP1A1
          term:
