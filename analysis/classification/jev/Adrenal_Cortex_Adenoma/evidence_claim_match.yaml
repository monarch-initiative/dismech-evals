      assertion_type: Biochemical
      assertion:
        name: Aldosterone-to-Renin Ratio
        biomarker_term:
          preferred_term: aldosterone
          term:
            id: CHEBI:27584
            label: aldosterone
        notes: 'The screening test for primary aldosteronism: plasma aldosterone concentration divided
          by plasma renin activity or concentration. An elevated ratio indicates aldosterone production
          that is not being driven by renin. It should be measured with the patient off interfering agents
          (mineralocorticoid receptor antagonists in particular) and with potassium repleted, and a positive
          result requires confirmatory testing before subtype work-up.'
        reference_ranges:
        - loinc_term:
            id: LOINC:30894-0
            label: Aldosterone/Renin [Ratio] in Plasma
          unit: '{ratio}'
          population: hypertensive adults screened for primary aldosteronism
          notes: 'No numeric cutoff is asserted here. The threshold for a positive aldosterone-to-renin
            ratio is assay- and unit-dependent: values differ by orders of magnitude depending on whether
            aldosterone is reported in ng/dL or pmol/L and whether renin is reported as activity or concentration,
            so a single interval would be misleading. The qualitative criterion — an elevated ratio with
            a suppressed renin — is what HP:6000318 (Elevated aldosterone:renin ratio) captures. The LOINC
            code was verified against the NLM clinical-tables LOINC service.'
      selected_evidence:
        snippet: Every patient needs a thorough clinical and endocrine work-up to exclude hormone excess
        supports: SUPPORT
