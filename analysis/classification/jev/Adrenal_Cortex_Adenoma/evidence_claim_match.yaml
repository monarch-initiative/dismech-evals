        name: Primary Pigmented Nodular Adrenocortical Disease
        disease_term:
          preferred_term: primary pigmented nodular adrenocortical disease
          term:
            id: MONDO:0015999
            label: primary pigmented nodular adrenocortical disease
        description: Bilateral micronodular pigmented adrenocortical disease causing ACTH-independent
          Cushing syndrome, usually in children and young adults, caused by germline inactivating PRKAR1A
          mutations and frequently part of Carney complex. It converges on the same pathway as the cortisol-producing
          adenoma — loss of PKA regulatory-subunit restraint — but from the opposite direction (germline
          loss of the regulatory subunit rather than somatic gain in the catalytic subunit) and with a
          bilateral, germline, syndromic presentation. Curated separately in this knowledge base as Primary_Pigmented_Nodular_Adrenocortical_Disease.
        distinguishing_features:
        - Bilateral pigmented micronodules rather than a solitary unilateral adenoma
        - Germline PRKAR1A inactivating mutations, often with Carney complex features (lentigines, myxomas,
          other endocrine tumours)
        - Typically presents in childhood or young adulthood
        - Paradoxical rise in urinary free cortisol on the Liddle dexamethasone test
      selected_evidence:
        snippet: have been identified in patients with Cushing’s syndrome due to primary pigmented nodular
          adrenocortical disease
        supports: SUPPORT
