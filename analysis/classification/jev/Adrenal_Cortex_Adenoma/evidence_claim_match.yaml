      assertion_type: Pathophysiology
      assertion:
        name: PRKACA Catalytic Subunit Activation
        biological_scale: MOLECULAR
        role: driver
        description: Somatic hotspot mutations in PRKACA — the recurrent change is c.617A>C, designated
          p.Leu206Arg when the initiator methionine is counted and widely reported in the earlier literature
          as L205R under mature-protein numbering that omits it — lie in the P+1 loop at the interface
          between the PKA catalytic subunit and its regulatory subunit. The mutant catalytic subunit can
          no longer be held inactive by the regulatory subunit, so kinase activity becomes constitutive
          and cAMP-independent. Activating GNAS mutations produce the same functional endpoint one step
          upstream by locking Gs-alpha in its active state.
        genes:
        - preferred_term: PRKACA
          term:
            id: hgnc:9380
            label: PRKACA
        - preferred_term: GNAS
          term:
            id: hgnc:4392
            label: GNAS
        molecular_functions:
        - preferred_term: cAMP-dependent protein kinase activity
          modifier: INCREASED
          term:
            id: GO:0004691
            label: cAMP-dependent protein kinase activity
      selected_evidence:
        snippet: PRKACA somatic mutations were identified in 22 of 59 unilateral adenomas (37%) from patients
          with overt Cushing's syndrome
        supports: SUPPORT
