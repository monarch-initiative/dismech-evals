        description: A catecholamine-secreting tumour of the adrenal medulla, not the cortex. It is a
          mandatory exclusion in any adrenal incidentaloma work-up because unrecognised pheochromocytoma
          can precipitate a hypertensive crisis during biopsy, surgery or anaesthesia. Plasma or urinary
          metanephrines must be measured in every patient before any invasive procedure.
        distinguishing_features:
