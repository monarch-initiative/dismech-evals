  0dae08cb9e1a729d58f2fa00246769dc4bf643e53cbec0c35c52a537c960128e:
    claim:
      about:
        disease:
          name: Adrenal Cortex Adenoma
          disease_term:
            preferred_term: adrenal cortex adenoma
            term:
              id: MONDO:0003924
              label: adrenal cortex adenoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Adrenal Cortex Carcinoma
        disease_term:
          preferred_term: adrenal cortex carcinoma
          term:
            id: MONDO:0006639
            label: adrenal cortex carcinoma
        description: The single most consequential distinction. Adrenocortical carcinoma is a malignant
          tumour of the same cortical lineage with an entirely different prognosis, and misclassifying
          one as the other is the main harm the adrenal incidentaloma work-up exists to prevent. Carcinoma
          is favoured by larger size, inhomogeneity and higher unenhanced attenuation on CT, by high proliferation
          rate and angioinvasion on histology, by IGF2 overexpression, and by TP53 and CTNNB1 alterations
          with broad copy-number instability. Rapid virilisation or feminisation, or mixed steroid excess,
          is a red flag for carcinoma rather than adenoma.
        distinguishing_features:
        - Size greater than 4 cm with inhomogeneity or unenhanced CT attenuation above 20 HU
        - Weiss score of 4 or more (adenoma 2 or less); angioinvasion; more than 5 mitoses per 10 mm2
          and more than 5% Ki67
        - IGF2 overexpression detectable by immunohistochemistry
        - Broad copy-number instability, TP53 disruption, extensive methylomic derangement
        - Rapid onset of virilisation, feminisation or mixed steroid excess
        notes: Adrenal cortex carcinoma is a distinct disease entity, not a subtype or a progression stage
          of adrenal cortex adenoma. There is no established adenoma-to-carcinoma sequence in the adrenal
          cortex analogous to the colorectal adenoma-carcinoma sequence.
      selected_evidence:
        snippet: None of the 24 tumors with two or less of these criteria metastasized or recurred, while
          all but one of the 19 tumors with four or more of these criteria either recurred or metastasized.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
