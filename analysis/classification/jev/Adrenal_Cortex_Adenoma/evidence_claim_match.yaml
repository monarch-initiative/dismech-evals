        description: Secondary deposit in the adrenal gland, most often from lung, breast, renal or gastrointestinal
          primaries or melanoma. In a patient with a known extra-adrenal malignancy this — not adenoma
          — is the leading explanation for a new adrenal mass, which is why the ESE guideline treats prior
          malignancy as a distinct management context. Metastases are typically inhomogeneous, lipid-poor
          with unenhanced attenuation above 10 HU, and are frequently bilateral.
        distinguishing_features:
