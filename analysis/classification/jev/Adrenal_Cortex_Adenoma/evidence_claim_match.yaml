        role: consequence
        description: Negative feedback from tumour-derived cortisol suppresses pituitary ACTH secretion;
          the non-tumorous ipsilateral and contralateral adrenal cortex atrophies. This is clinically
          silent while the adenoma is in place but becomes the dominant management problem immediately
          after adrenalectomy, when the remaining gland cannot mount a cortisol response — hence the requirement
          for perioperative and tapering glucocorticoid cover, with hypothalamic-pituitary-adrenal recovery
          often taking months.
