        - Elevated plasma free or urinary fractionated metanephrines
        - High unenhanced CT attenuation (above 10 HU), often with marked contrast enhancement
        - Episodic headache, palpitations and sweating with paroxysmal hypertension
        - Biopsy or unprepared surgery can precipitate a hypertensive crisis
      selected_evidence:
