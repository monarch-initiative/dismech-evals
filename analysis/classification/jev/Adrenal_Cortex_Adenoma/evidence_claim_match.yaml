              label: spironolactone
          - preferred_term: eplerenone
            term:
              id: CHEBI:31547
              label: eplerenone
      selected_evidence:
        snippet: We recommend that patients with bilateral adrenal hyperplasia or those unsuitable for
          surgery should be treated primarily with a mineralocorticoid receptor antagonist.
        supports: SUPPORT
