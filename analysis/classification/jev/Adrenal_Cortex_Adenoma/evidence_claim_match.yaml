        context: []
      assertion_type: Subtype
      assertion:
        name: Non-Functioning
        display_name: Non-Functioning Adenoma (NFAT)
        description: An adenoma without demonstrable autonomous hormone secretion — normal metanephrines,
          a suppressed 1-mg dexamethasone test (below 50 nmol/L) and, where indicated, a normal aldosterone-to-renin
          ratio. This is the largest single group among incidentally detected adrenal masses. Molecularly
          heterogeneous; CTNNB1/Wnt-beta-catenin activation is the commonest recurrent alteration. A homogeneous
          lesion of 10 HU or less on unenhanced CT requires no further imaging follow-up and no surgery.
        genes:
        - preferred_term: CTNNB1
          term:
            id: hgnc:2514
            label: CTNNB1
      selected_evidence:
        snippet: Twenty-two NFACAs (36.67%) had genetic alterations in CTNNB1.
        supports: SUPPORT
