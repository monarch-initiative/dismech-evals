      assertion_type: Pathophysiology
      assertion:
        name: Mild Autonomous Cortisol Secretion
        biological_scale: ORGANISM
        role: effector
        description: Low-grade cortisol autonomy sufficient to fail the 1-mg dexamethasone suppression
          test but insufficient to produce the classical Cushing habitus. The mechanistically important
          point — and the reason this node exists separately from Chronic Glucocorticoid Excess — is the
          reclassification of MACS. It was long treated as a biochemical curiosity of no consequence ("subclinical
          hypercortisolism"). Contemporary multicentre cohort data show that MACS is instead an independent
          cardiometabolic and skeletal risk state, carrying excess hypertension, insulin-requiring diabetes,
          vertebral fracture, and — critically — increased all-cause mortality relative to non-functioning
          adenomas, with the excess concentrated in women under 65. The 2023 ESE guideline formalised
          the term and mandated screening for cortisol-attributable comorbidity in every patient with
          MACS.
      selected_evidence:
        snippet: Cortisol autonomy is associated with increased all-cause mortality, particularly in women
          younger than 65 years.
        supports: SUPPORT
    origin:
