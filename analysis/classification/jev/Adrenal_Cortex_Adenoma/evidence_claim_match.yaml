        therapeutic_modality: SMALL_MOLECULE
        description: Patients with cortisol autonomy who undergo adrenalectomy have a suppressed hypothalamic-pituitary-adrenal
          axis and an atrophic contralateral cortex, and will develop adrenal insufficiency on removal
          of the tumour. Stress-dose hydrocortisone is given perioperatively and then tapered according
          to recovery of the axis, which may take months. Omitting this is a recognised cause of avoidable
          postoperative adrenal crisis.
