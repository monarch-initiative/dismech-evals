      assertion:
        name: Aldosterone-Mediated Target Organ Damage
        biological_scale: ORGANISM
        role: consequence
        description: The clinically decisive feature of primary aldosteronism is that its cardiovascular
          and renal injury is disproportionate to the blood pressure. Compared with essential hypertensives,
          patients with primary aldosteronism have markedly higher odds of stroke, coronary disease, atrial
          fibrillation and heart failure. Combined with the fact that primary aldosteronism remains largely
          underdiagnosed and undertreated, this is the strongest argument for biochemical screening of
          hypertensive patients with an adrenal adenoma rather than treating blood pressure alone.
      selected_evidence:
        snippet: compared with patients with essential hypertension, patients with primary aldosteronism
          had an increased risk of stroke (odds ratio ... 2·58, 95% CI 1·93-3·45), coronary artery disease
          (1·77, 1·10-2·83), atrial fibrillation (3·52, 2·06-5·99), and heart failure (2·05, 1·11-3·78).
        supports: SUPPORT
