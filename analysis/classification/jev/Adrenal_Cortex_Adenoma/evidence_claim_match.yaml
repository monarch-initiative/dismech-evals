        context: []
      assertion_type: Subtype
      assertion:
        name: Aldosterone-Producing
        display_name: Aldosterone-Producing Adenoma (APA, Conn adenoma)
        description: A unilateral adenoma of zona glomerulosa lineage secreting aldosterone renin-independently,
          causing unilateral primary aldosteronism. Driven by mutually exclusive somatic mutations in
          KCNJ5 (most common), CACNA1D, ATP1A1, ATP2B3 and CTNNB1. Because CT cannot reliably identify
          the secreting side (non-functioning nodules become common with age), adrenal vein sampling is
          usually required before lateralising surgery.
        genes:
        - preferred_term: KCNJ5
          term:
            id: hgnc:6266
            label: KCNJ5
        - preferred_term: CACNA1D
          term:
            id: hgnc:1391
            label: CACNA1D
        - preferred_term: ATP1A1
          term:
            id: hgnc:799
            label: ATP1A1
        - preferred_term: ATP2B3
          term:
            id: hgnc:816
            label: ATP2B3
        - preferred_term: CTNNB1
          term:
            id: hgnc:2514
            label: CTNNB1
      selected_evidence:
        snippet: We identify two recurrent somatic mutations in and near the selectivity filter of the
          potassium (K(+)) channel KCNJ5 that are present in 8 of 22 human APAs studied.
        supports: SUPPORT
