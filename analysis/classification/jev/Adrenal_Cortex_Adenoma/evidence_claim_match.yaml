          and family screening, and cannot be cured by unilateral adrenalectomy. It is a separate entity,
          not a bilateral variant of adrenal cortex adenoma.
        distinguishing_features:
        - Bilateral macronodular adrenal enlargement rather than a solitary unilateral mass
        - Germline ARMC5 inactivating mutations in approximately 44% of cases
        - Heritable; warrants cascade genetic testing of relatives
        - Not curable by unilateral adrenalectomy
