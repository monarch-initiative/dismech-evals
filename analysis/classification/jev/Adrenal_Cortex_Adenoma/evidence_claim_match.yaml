            term:
              id: MONDO:0003924
              label: adrenal cortex adenoma
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Adrenal Vein Sampling
        description: 'Bilateral adrenal venous sampling is the reference standard for deciding whether
          confirmed primary aldosteronism is unilateral (an aldosterone-producing adenoma, curable by
          adrenalectomy) or bilateral (hyperplasia, treated medically). It is required because CT cannot
          reliably identify the secreting side: non-functioning adrenal nodules become common with age,
          so a visible nodule may not be the source of the aldosterone, and conversely an aldosterone-producing
          lesion may be too small to see. Getting this wrong means either removing the wrong gland or
          denying a curable patient surgery.'
        notes: 'No structured `diagnosis_term` is bound: NCIT has no adrenal-venous-sampling concept that
          is both specific and reachable from the procedure roots used by this schema, so a term is omitted
          rather than approximated.'
      selected_evidence:
        snippet: We recommend that an experienced radiologist should establish/exclude unilateral primary
          aldosteronism using bilateral adrenal venous sampling, and if confirmed, this should optimally
          be treated by laparoscopic adrenalectomy.
        supports: SUPPORT
