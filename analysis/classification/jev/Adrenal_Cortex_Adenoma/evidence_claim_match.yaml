        context: []
      assertion_type: Subtype
      assertion:
        name: MACS
        display_name: Mild Autonomous Cortisol Secretion (MACS)
        description: 'Biochemical cortisol autonomy — serum cortisol above 50 nmol/L (1.8 ug/dL) after
          a 1-mg overnight dexamethasone suppression test — in a patient without the clinical signs of
          overt Cushing syndrome. Formerly dismissed as "subclinical hypercortisolism", MACS is now recognised
          as a genuine cardiometabolic risk condition carrying excess hypertension, type 2 diabetes, osteoporosis,
          fracture and all-cause mortality relative to non-functioning adenomas. It is by far the largest
          functional group: roughly 45% of benign adrenal tumours in the ENSAT EURINE-ACT cohort fell
          into the MACS-1 or MACS-2 strata.'
      selected_evidence:
        snippet: Recent studies have provided evidence that most patients without clinical signs of overt
          Cushing's syndrome but serum cortisol levels post dexamethasone >50 nmol/L (>1.8 µg/dL) harbor
          increased risk of morbidity and mortality.
        supports: SUPPORT
