      assertion_type: Treatment
      assertion:
        name: Mineralocorticoid Receptor Antagonist Therapy
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        description: Spironolactone or eplerenone block the mineralocorticoid receptor, addressing both
          the blood-pressure and the direct target-organ effects of aldosterone excess. Used when surgery
          is declined or not feasible, while awaiting lateralisation, or when disease proves bilateral.
          Requires monitoring for hyperkalaemia and declining renal function; spironolactone additionally
          causes gynaecomastia and menstrual disturbance through its antiandrogenic and progestogenic
          activity, which is the usual reason for switching to eplerenone.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: spironolactone
            term:
