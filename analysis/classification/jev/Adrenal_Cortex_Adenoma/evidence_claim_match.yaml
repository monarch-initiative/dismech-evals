        name: Low Weiss Score
        description: Adrenal cortical adenoma is distinguished from carcinoma by multiparameter histologic
          scoring. In Weiss's original series, none of the 24 tumours with two or fewer of the nine criteria
          metastasised or recurred, while almost all with four or more did. A Weiss score of 2 or less
          therefore supports adenoma. The 2022 WHO classification retains Weiss and modified Weiss alongside
          the reticulin algorithm, Lin-Weiss-Bisceglia and Helsinki systems.
        diagnostic: true
      selected_evidence:
        snippet: None of the 24 tumors with two or less of these criteria metastasized or recurred, while
          all but one of the 19 tumors with four or more of these criteria either recurred or metastasized.
