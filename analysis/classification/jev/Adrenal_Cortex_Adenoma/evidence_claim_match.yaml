            label: ATP1A1
        - preferred_term: ATP2B3
          term:
            id: hgnc:816
            label: ATP2B3
        cell_types:
        - preferred_term: zona glomerulosa cell
          term:
            id: CL:0002099
            label: type I cell of adrenal cortex
        locations:
        - preferred_term: zona glomerulosa
          term:
            id: UBERON:0002053
            label: zona glomerulosa of adrenal gland
      selected_evidence:
        snippet: We identified 5 somatic mutations (4 altering Gly403 and 1 altering Ile770) in CACNA1D,
          encoding a voltage-gated calcium channel, among 43 APAs without mutated KCNJ5.
        supports: SUPPORT
