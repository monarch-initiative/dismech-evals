        snippet: Bioenergetic measurements in fibroblasts from both patients detected reduced spare respiratory
          capacities and altered extracellular acidification rates, revealing a switch from mitochondrial
          respiration to glycolysis to uphold ATP production.
        supports: SUPPORT
