    evidence_metadata:
      reference: PMID:20953793
      reference_title: Heterogeneous patterns of tissue injury in NARP syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates that measured heteroplasmy fails to explain within-family phenotypic variation
