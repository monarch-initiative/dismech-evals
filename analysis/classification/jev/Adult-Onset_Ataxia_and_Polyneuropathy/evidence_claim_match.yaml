        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which cerebellar cell population is lost in adult-onset MT-ATP6 ataxia, and is the Purkinje
          neuron the primary target as it is in most hereditary ataxias?
        attaches_to:
        - pathophysiology#Cerebellar Dysfunction
        rationale: The reviewed adult clinical reports establish cerebellar signs and variable MRI atrophy
          but not specific Purkinje-cell loss. The original family included a deceased childhood-onset
          sibling with nonspecific brain gliosis at autopsy and no documented molecular assay; that historical
          case does not establish adult cell-specific neuropathology.
        proposed_experiments:
        - experiment_id: cerebellar_neuropathology_mtatp6
          name: Post-mortem cerebellar neuropathology in genetically confirmed adult-onset MT-ATP6 ataxia
          description: Quantitative stereology of Purkinje, granule and dentate neurons with per-cell
            heteroplasmy measurement, compared against age-matched controls and against NARP/Leigh cerebellum.
      selected_evidence:
        snippet: Brain MRI showed slight periventricular white matter abnormali- ties and mild atrophy
          in cerebellar vermis.
