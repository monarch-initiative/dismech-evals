        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heteroplasmy-Dependent Expression
        role: modulator
        biological_scale: CELLULAR
        description: Mutant load modifies clinical expression but is not a universal onset clock or a
          fixed threshold. The defining adult proband had 89% mutant mtDNA in blood; related adult-ataxia
          pedigrees had 90–99% in leukocytes. GeneReviews describes relatively little tissue- or age-dependent
          heteroplasmy variation for m.8993T>C/G, unlike some other mtDNA variants. Differences among
          tissues can nevertheless occur, and high load does not reliably predict an individual phenotype.
          Nuclear, haplogroup and copy-number modifiers remain candidate explanations rather than demonstrated
          determinants here.
      selected_evidence:
        snippet: In our families, six patients had their genetic testing performed on leucocyte DNA, with
          heteroplasmy levels ranging from 90-99%.
        supports: SUPPORT
        directness: INDIRECT
