      assertion_type: Inheritance
      assertion:
        name: Maternal mitochondrial inheritance
        description: Maternal transmission of a mitochondrial MT-ATP6 variant, with variable heteroplasmy
          and expression. Adult onset is not explained simply by a low mutant load; related adult ataxia
          pedigrees had 90–99% heteroplasmy in leukocytes. Males do not transmit mtDNA variants; offspring
          of affected females are at risk, but inheritance does not guarantee clinical disease.
        inheritance_term:
          preferred_term: Mitochondrial inheritance
          term:
            id: HP:0001427
            label: Mitochondrial inheritance
      selected_evidence:
        snippet: Pathogenic variants in MT-ATP6 are a well-known cause of maternally-inherited mitochondrial
          disorders
        supports: SUPPORT
