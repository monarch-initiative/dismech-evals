        description: Molecular testing of MT-ATP6, through targeted sequencing or an appropriate comprehensive
          mitochondrial/genomic approach, should be considered in unexplained adult ataxia with neuropathy
          despite normal muscle investigations. Quantify heteroplasmy and interpret the pathogenic variant
          together with the phenotype. Leukocyte DNA was informative in the published adult MT-ATP6 families;
          tissue selection and assay sensitivity should be individualized, without importing the low-blood-load
          behavior of unrelated mtDNA variants.
