              label: ataxia and polyneuropathy, adult-onset
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: heteroplasmy_does_not_explain_onset
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Why do some MT-ATP6 pedigrees with very high mutant load present in infancy with Leigh
          syndrome while others present only in adulthood with ataxia and neuropathy?
        attaches_to:
        - pathophysiology#Heteroplasmy-Dependent Expression
        rationale: 'Mutant load is necessary but demonstrably not sufficient to predict age of onset or
          severity: patients with childhood-onset and adult-onset MT-ATP6 ataxia have both been reported
          at 90-100% heteroplasmy, and within a single m.8993T>C family, phenotype differed markedly between
          members with comparably high ectodermal and mesodermal loads. Candidate modifiers include mtDNA
          haplogroup, nuclear background, mtDNA copy number, and differences in antioxidant scavenging
          capacity, none of which has been tested for this entity.'
      selected_evidence:
        snippet: There were marked phenotypic differences between family members, even between individuals
          with the greatest degrees of ectodermal and mesodermal heteroplasmy.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
