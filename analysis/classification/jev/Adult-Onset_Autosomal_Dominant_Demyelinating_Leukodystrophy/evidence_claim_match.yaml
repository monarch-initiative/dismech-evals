        association: Causative
        features: 'LMNB1 causes ADLD through increased expression, most often by whole-gene tandem duplication
          and more rarely by upstream regulatory deletion. Regulatory architecture matters in both classes:
          some larger tandem duplications predicted to preserve the oligodendrocyte silencer interaction
          were not associated with demyelination, whereas an inverted duplication predicted to disrupt
          that interaction was associated with severe ADLD.'
        inheritance:
        - name: Autosomal dominant inheritance
      selected_evidence:
        snippet: However, Multiplex ligand-dependent probe amplification (MLPA) showed whole duplication
          of LMNB1 gene which is co-segregated with the disease phenotype in this family.
        supports: SUPPORT
