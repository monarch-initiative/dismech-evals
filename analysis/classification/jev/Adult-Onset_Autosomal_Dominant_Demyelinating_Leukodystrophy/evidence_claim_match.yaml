        context: []
      assertion_type: Variant
      assertion:
        name: LMNB1 ADLD-1-TO upstream deletion (approximately 660 kb)
        regulatory_target_gene:
          preferred_term: LMNB1
          term:
            id: hgnc:6637
            label: LMNB1
        variant_type: deletion
        genomic_contexts:
        - coding sequence
        - intron
        - intergenic region
        description: Heterozygous deletion reported by Giorgio et al. in the ADLD-1-TO family, spanning
          hg19 chr5:125385805-126043053 and ending approximately 66 kb upstream of the LMNB1 promoter.
          The interval removes GRAMD3, ALDH7A1, and PHAX and intervening sequence while sparing LMNB1
          itself. Its ADLD mechanism is altered regulation of LMNB1 rather than deletion of LMNB1 coding
          sequence. Lamin B1 excess was demonstrated in frontal-lobe postmortem tissue. The original study
          proposed forebrain enhancer adoption; later work implicates loss of an oligodendrocyte silencer
          and leaves the additional requirement for ectopic enhancers unresolved.
        functional_effects:
        - function: LMNB1 transcriptional regulation
          type: Increased expression through altered regulatory contacts
          regulatory_element_type: TAD_BOUNDARY
          regulatory_mechanism: Boundary deletion with proposed enhancer adoption
          description: The rearrangement removes a topological boundary and changes the regulatory neighborhood
            of an intact LMNB1 promoter. This is increased expression in an affected tissue, not evidence
            by itself for a new protein activity or expression in a normally non-expressing cell type.
        - function: Oligodendrocyte-specific repression of LMNB1
          type: Loss of silencer-mediated repression
          regulatory_element_type: SILENCER
          regulatory_mechanism: Deletion of a CTCF-associated silencer region
          affected_cell_types:
          - preferred_term: oligodendrocyte
            term:
              id: CL:0000128
              label: oligodendrocyte
          description: The upstream-deletion class removes the silencer region characterized using CRISPR-edited
            cells and mouse models. These experiments support a mechanism for the human deletion class
            without directly testing this complete approximately 660 kb allele in human oligodendrocytes.
      selected_evidence:
        snippet: patients carry a large (∼660 kb) heterozygous deletion that begins 66 kb upstream of
          the LMNB1 promoter.
        supports: SUPPORT
