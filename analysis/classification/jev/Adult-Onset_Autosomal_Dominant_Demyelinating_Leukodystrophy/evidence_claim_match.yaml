            biological_scale: MOLECULAR
            mechanism_confidence: PROVISIONAL
            description: A CTCF-associated upstream silencer restrains LMNB1 expression through chromatin
              looping and PRC2 recruitment. Silencer activity is supported by CRISPR deletion and reporter
              assays in mouse oligodendrocyte-lineage cells. Human upstream deletions remove the relevant
              interval, whereas the inverted duplication retains silencer sequence but is predicted to
              disrupt its regulatory contact. Their proposed convergence is loss of silencer control,
              not physical loss of the element in every allele. The human oligodendrocyte mechanism remains
              an extrapolation from model experiments and human genotype comparisons.
            genes:
            - preferred_term: LMNB1
              term:
                id: hgnc:6637
                label: LMNB1
            - preferred_term: CTCF
