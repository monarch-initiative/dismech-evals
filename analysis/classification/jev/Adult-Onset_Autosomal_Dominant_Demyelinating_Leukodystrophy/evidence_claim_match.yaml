        description: 'Inverted duplication of approximately 475 kb, including LMNB1 and its upstream silencer
          region, inserted centromeric to LMNB1. The allele was described as BR-1 in the original structural
          analysis and F4 in the 2025 functional study. It is associated with an accelerated ADLD phenotype.
          This coding-overlapping SV also has a proposed regulatory mechanism: its insertion and orientation
          separate the original LMNB1 copy from its silencer interaction. The silencer region is retained,
          so sequence content alone does not predict preserved regulation.'
