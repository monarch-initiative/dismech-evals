          looping and PRC2 recruitment. Silencer activity is supported by CRISPR deletion and reporter
          assays in mouse oligodendrocyte-lineage cells. Human upstream deletions remove the relevant
          interval, whereas the inverted duplication retains silencer sequence but is predicted to disrupt
          its regulatory contact. Their proposed convergence is loss of silencer control, not physical
          loss of the element in every allele. The human oligodendrocyte mechanism remains an extrapolation
          from model experiments and human genotype comparisons.
