      assertion:
        target: LMNB1 Overexpression
        causal_link_type: DIRECT
        description: Loss of silencer activity increases Lmnb1 expression in experimental oligodendrocyte-lineage
          cells. This supports a route to LMNB1 excess in human disease without establishing the expression
          state in every tissue or every deletion carrier.
