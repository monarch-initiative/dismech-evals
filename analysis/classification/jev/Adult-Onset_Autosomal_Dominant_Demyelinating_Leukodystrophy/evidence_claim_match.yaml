          regulatory_mechanism: Inverted-duplication insertion alters promoter-silencer topology
          description: Orca chromatin-contact predictions indicated loss of the original promoter-silencer
            interaction despite retention of a silencer copy in the inverted duplicated segment. Patient-derived
            fibroblasts showed high LMNB1 expression, but that measurement is separate from the computational
            inference about the causal chromatin contact.
      selected_evidence:
        snippet: Fibroblasts derived from the F4-1 patient exhibited the highest level of LMNB1 expression
        supports: SUPPORT
