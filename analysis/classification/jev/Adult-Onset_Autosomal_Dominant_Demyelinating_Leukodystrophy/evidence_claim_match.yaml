  b1028b325dd4cc5e7d6ea1c11995a5c91c1dd77011c55a0e3c9535ff73dc8de2:
    claim:
      about:
        disease:
          name: Adult-Onset Autosomal Dominant Demyelinating Leukodystrophy
          disease_term:
            preferred_term: adult-onset autosomal dominant demyelinating leukodystrophy
            term:
              id: MONDO:0008215
              label: adult-onset autosomal dominant demyelinating leukodystrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_adld_deletion_dysautonomia_spinal_cord
        prompt: Is the absence of early dysautonomia in upstream-deletion (atypical) ADLD caused by the
          sparing of the spinal cord below the uppermost cervical level, and if so why does the same LMNB1
          overexpression spare the cord in deletion carriers but not in duplication carriers?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Upstream LMNB1 Regulatory Deletion
        - pathophysiology#Autonomic-System Involvement (Mechanism Unresolved)
        rationale: 'The two OMIM criteria that separate atypical from typical ADLD, lack of early autonomic
          involvement and relative sparing of cerebellum and spinal cord, are the same fact seen clinically
          and radiologically if the dysautonomia of ADLD is cord-derived. The deletion cohort authors
          advance exactly that reading, but they label it a hypothesis, and it rests on spinal MRI from
          only two deletion carriers. It also leaves the harder question untouched: both routes raise
          LMNB1, so an anatomically selective difference in outcome implies a difference in where or how
          much the gene is de-repressed that the enhancer-adoption and silencer-loss models do not yet
          specify.'
        proposed_experiments:
        - experiment_id: exp_adld_deletion_cord_autonomic_correlation
          name: Prospective spinal-cord imaging and autonomic testing across ADLD genotypes
          description: Enroll genotyped ADLD duplication and upstream-deletion carriers, including presymptomatic
            relatives, and pair quantitative cervical and thoracic spinal-cord cross-sectional-area measurement
            with the standard autonomic battery, tilt table, QSART, and urodynamics, at matched ages.
            A cord-derived dysautonomia model predicts that autonomic deficit tracks cord atrophy within
            and across genotypes; a genotype effect that survives adjustment for cord atrophy would refute
            it.
          experiment_type:
            preferred_term: Genotype-stratified prospective imaging and autonomic phenotyping study
      selected_evidence:
        snippet: The presence of cerebellar symptoms and lesions may be characteristic in our patients
          with the deletion compared with the previously reported family with the deletion.
        supports: SUPPORT
