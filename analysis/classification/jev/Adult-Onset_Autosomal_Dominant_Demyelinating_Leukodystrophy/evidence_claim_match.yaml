        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: The nonrecurrent upstream deletions segregate as heterozygous, fully penetrant
            dominant alleles across the reported multigenerational families.
        description: 'A regulatory structural-variant subtype in which heterozygous upstream deletion
          disrupts LMNB1 regulation without duplicating the gene. Loss of an oligodendrocyte silencer
          and enhancer adoption have been implicated; the requirement for ectopic enhancer activity remains
          unresolved. OMIM separates this as ADLDAT, and MONDO as the "atypical" child term, because the
          clinical picture diverges from the duplication form: onset is earlier, speech symptoms rather
          than dysautonomia dominate the presentation, early autonomic involvement is absent, and cerebellar
          and spinal-cord involvement is comparatively limited. It remains a subtype rather than a separate
          disease entry because both routes converge on the same proximal driver, LMNB1 overexpression.'
      selected_evidence:
        snippet: This second route to LMNB1 overexpression and ADLD is a new example of the relevance
          of regulatory landscape modifications in determining Mendelian phenotypes.
        supports: SUPPORT
    origin:
