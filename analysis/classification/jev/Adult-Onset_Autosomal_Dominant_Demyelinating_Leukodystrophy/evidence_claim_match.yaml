        attaches_to:
        - pathophysiology#RAVER2/PTB-Dependent PLP1 Spliceopathy
        - pathophysiology#Oligodendrocyte Lipid and Myelin Program Dysfunction
        - pathophysiology#Astrocyte LIF-Support Dysfunction
        - pathophysiology#Axon-Myelin Unit Injury
        - pathophysiology#Autonomic-System Involvement (Mechanism Unresolved)
        rationale: Available mouse and cultured-cell models yield conflicting cell-type results and do
          not reproduce the early autonomic manifestations seen in patients. This mismatch prevents any
          one glial or axonal branch from being asserted as the established human bridge from LMNB1 overexpression
          to demyelination.
        proposed_experiments:
        - experiment_id: exp_adld_patient_derived_glial_coculture
          name: Patient-derived isogenic glial and neuronal co-culture study
          description: Compare LMNB1-duplication and corrected isogenic iPSC-derived astrocytes, oligodendrocytes,
            and neurons in co-culture, measuring LIF signaling, RAVER2/PTB-dependent PLP1 splicing, myelin-lipid
            programs, axon-myelin integrity, and rescue after LMNB1 normalization to distinguish primary
            from secondary cellular effects.
          experiment_type:
            preferred_term: Isogenic patient-derived iPSC co-culture perturbation study
      selected_evidence:
        snippet: Indeed, neither of the two in vivo models is able to fully recapitulate the clinical
          phenotype observed in ADLD patients, since they do not display the autonomic symptoms that are
          characteristic of ADLD initial stages [36].
        supports: SUPPORT
