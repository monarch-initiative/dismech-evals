            display_name: Atypical ADLD (LMNB1 upstream deletion)
            classification: molecular
            subtype_term:
              preferred_term: atypical adult-onset autosomal dominant demyelinating leukodystrophy
              term:
                id: MONDO:0700286
                label: leukodystrophy, demyelinating, adult-onset, autosomal dominant, atypical
            genes:
            - preferred_term: LMNB1
              term:
                id: hgnc:6637
                label: LMNB1
            description: 'A regulatory structural-variant subtype in which heterozygous upstream deletion
              disrupts LMNB1 regulation without duplicating the gene. Loss of an oligodendrocyte silencer
              and enhancer adoption have been implicated; the requirement for ectopic enhancer activity
              remains unresolved. OMIM separates this as ADLDAT, and MONDO as the "atypical" child term,
              because the clinical picture diverges from the duplication form: onset is earlier, speech
              symptoms rather than dysautonomia dominate the presentation, early autonomic involvement
              is absent, and cerebellar and spinal-cord involvement is comparatively limited. It remains
              a subtype rather than a separate disease entry because both routes converge on the same
              proximal driver, LMNB1 overexpression.'
          role: subtype
      assertion_type: Phenotype
      assertion:
        name: Hypophonia at Presentation
        category: Neurologic
        subtype: Upstream Deletion-Related ADLD
        phenotype_term:
          preferred_term: Hypophonia
          term:
            id: HP:0001621
            label: Weak voice
        description: Reduced voice volume, with dysarthria, is the characteristic presenting complaint
          of the upstream-deletion form and is what most sharply separates it at onset from the duplication
          form, where dysautonomia presents first.
      selected_evidence:
        snippet: Clinically, 4/5 patients presented at onset with speech symptoms including dysarthria
          and hypophonia. This has not been reported for ADLD with LMNB1 duplications, where the most
          common presenting feature was autonomic dysfunction.
        supports: SUPPORT
