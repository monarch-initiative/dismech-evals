        discussion_id: adult-mg-interpretation-2
        prompt: Striational antibodies and associated muscle or cardiac inflammation
        rationale: Myositis and myocarditis can accompany MG, particularly in selected thymoma-associated
          or late-onset series. A 2019 study analyzed stored sera from 30 patients selected for MG with
          myositis and/or myocarditis; it was not a population-incidence study. Titin and Kv1.4 antibodies
          were common in that selected group, while RyR reactivity lacked specificity. These assays do
          not establish that the antibodies caused muscle or cardiac injury, and myocarditis mortality
          must not be presented as the mortality of myasthenic crisis.
        kind: INTERPRETATION
        status: OPEN
      selected_evidence:
        snippet: MG patients with myositis and/or myocarditis as well as late-onset and thymoma-associated
          MG had anti-titin, anti-ryanodine receptor, and anti-Kv1.4 antibodies.
        supports: SUPPORT
        directness: DIRECT
