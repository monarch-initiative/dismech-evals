      assertion_type: Subtype
      assertion:
        name: VLOMG
        display_name: Very Late-Onset MG (onset after ~65 years)
        description: A further age stratum within late-onset disease, often defined as onset at or beyond
          65 years. Focal ocular or bulbar presentations can occur; comorbidity, diagnostic alternatives,
          and treatment tolerability warrant particular attention. The threshold varies between reports.
        subtype_term:
          preferred_term: very late-onset myasthenia gravis
      selected_evidence:
        snippet: We define late-onset myasthenia gravis (LOMG) when symptoms appear at ≥65 years of age.
          There has been a continuous increase in the incidence of LOMG with a clear male predominance.
        supports: SUPPORT
        directness: DIRECT
    origin:
