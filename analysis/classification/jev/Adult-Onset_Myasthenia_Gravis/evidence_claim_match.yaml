            term:
              id: MONDO:0018324
              label: adult-onset myasthenia gravis
        context: []
      assertion_type: Treatment
      assertion:
        name: Thymectomy for Nonthymomatous AChR-Positive Generalized MG
        description: MGTX randomized 126 adults aged 18–65 with AChR-positive generalized nonthymomatous
          MG of less than five years duration to extended transsternal thymectomy plus prednisone or prednisone
          alone. Surgery improved the three-year time-weighted QMG score and reduced steroid requirements.
          Older adults were included; age-subgroup analyses do not establish benefit exclusively in early-onset
          disease. Evidence for very old patients, long-standing disease, pure ocular disease, and other
          surgical approaches is less direct. MuSK-positive MG without a tumor is not an immunological
          indication.
        action_category: THERAPEUTIC
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Thymectomy
          term:
            id: NCIT:C29894
            label: Thymectomy
      selected_evidence:
        snippet: Patients who underwent thymectomy had a lower time-weighted average Quantitative Myasthenia
          Gravis score over a 3-year period than those who received prednisone alone (6.15 vs. 8.99, P<0.001)
        supports: SUPPORT
        directness: DIRECT
    origin:
