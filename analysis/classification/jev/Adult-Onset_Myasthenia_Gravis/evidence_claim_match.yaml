      assertion_type: Discussion
      assertion:
        discussion_id: adult-mg-interpretation-1
        prompt: Onset-associated genetic architecture and ascertainment
        rationale: Onset-age strata show differing HLA and non-HLA associations, with shared susceptibility
          and substantial ascertainment limits. Older studies were enriched for European AChR-positive,
          nonthymomatous disease and early-onset cohorts could include adolescents. The 2024 discovery
          analysis included 5,708 cases and 432,028 controls and reused prior European cohorts; replication
          used 3,989 self-reported cases and 226,643 controls. Its early-onset replication used age below
          50 at participation, while late-onset replication used all cases because onset age was unavailable.
          These results do not prove that the age strata are distinct diseases or establish clinical diagnostic
          use of polygenic scores.
        kind: INTERPRETATION
        status: OPEN
      selected_evidence:
        snippet: As no age of onset information was available, we replicated the LOMG discovery GWAS loci
          using the full 23andMe MG dataset.
        supports: SUPPORT
        directness: DIRECT
