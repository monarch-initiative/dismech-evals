        context: []
      assertion_type: Subtype
      assertion:
        name: LOMG
        display_name: Late-Onset MG (onset at or after ~50 years)
        description: Disease beginning at or beyond the study-specific late-onset boundary, commonly 50
          years. AChR-positive disease, male predominance, ocular presentation, and anti-titin antibodies
          are relatively enriched in several cohorts. An atrophic thymus is common but does not prove
          immunological inactivity or an exclusively extrathymic origin.
        subtype_term:
          preferred_term: late-onset myasthenia gravis
      selected_evidence:
        snippet: LOMG with onset ≥ 50 years of age is more common in men and ocular onset is common. Frequency
          of anti-AChR and anti-titin antibodies are high.
        supports: SUPPORT
        directness: DIRECT
