              label: adult-onset myasthenia gravis
        context: []
      assertion_type: Subtype
      assertion:
        name: EOMG
        display_name: Early-Onset MG (onset before ~50 years)
        description: Adult-onset disease before the study-specific late-onset boundary, commonly 50 years.
          Female predominance and follicular thymic hyperplasia are especially associated with AChR-positive
          early-onset cohorts. Research labeled EOMG may include juvenile cases, so its results are not
          automatically adult-specific.
        subtype_term:
          preferred_term: early-onset myasthenia gravis
      selected_evidence:
        snippet: EOMG often presents with distinct immunological and genetic profiles, a predominance
          of female patients, and a higher incidence of thymic hyperplasia.
        supports: SUPPORT
        directness: DIRECT
    origin:
