        name: Anti-Titin Antibody
        subtype: LOMG
        context: Titin antibodies are associated with older onset and thymoma in selected cohorts, but
          are not established causes of neuromuscular transmission failure. A retrospective series found
          an association with generalized disease within its late-onset subgroup; this is not a validated
          prediction of progression.
        biomarker_term:
          preferred_term: Anti-titin antibody positivity
          term:
            id: HP:5000038
            label: Anti-titin antibody positivity
        notes: The 2019 cohort abstract reports 56 positive and 61% within 95 participants without specifying
          the tested denominator in the excerpt. No pooled frequency is inferred. In the 2024 cohort,
          130 of 230 clinic patients were tested; 32 were positive, and testing often occurred long after
          thymectomy.
      selected_evidence:
        snippet: Anti-titin positivity was significantly associated with generalized MG in the late-onset
          group (P=0.005).
        supports: SUPPORT
        directness: DIRECT
