      assertion_type: Pathophysiology
      assertion:
        name: Impaired Autophagic Flux and RNA-Binding Protein Mislocalization
        biological_scale: CELLULAR
        role: intermediate
        mechanism_confidence: PROVISIONAL
        description: p.Pro56Ser disturbs both the initiation and the completion of autophagy, with autophagosomes
          failing to fuse with lysosomes. Aggregates accumulate together with LC3 and p62 and sequester
          RNA-binding proteins — phosphorylated TDP-43, FUS and Matrin 3 — into persistent stress granules,
          connecting this disorder to the wider TDP-43 proteinopathy of ALS. The human material is a single
          ALS8 index patient's muscle biopsy and fibroblasts, which is why the node is PROVISIONAL.
        biological_processes:
        - preferred_term: macroautophagy
          modifier: DECREASED
          term:
            id: GO:0016236
            label: macroautophagy
      selected_evidence:
        snippet: Autophagy and RBP homeostasis are interdependent, as demonstrated by the cytoplasmic
          mis-localisation of several RBPs including pTDP-43, FUS, Matrin 3 which often sequestered with
          P56S-VAPB aggregates both in cell culture and in the muscle biopsy of the ALS8 patient.
        supports: SUPPORT
