            label: Autosomal dominant inheritance
        description: A single heterozygous VAPB p.Pro56Ser allele is sufficient. The disorder was mapped
          in a large Brazilian kindred and the same variant then found in six further kindreds; haplotype
          analysis across eight families of both Portuguese-Brazilian and African-Brazilian ancestry places
          the origin in a single founding event, so most of the world's reported patients share one ancestral
          chromosome rather than representing independent mutational events.
      selected_evidence:
        snippet: Subsequently, the same mutation was identified in patients from six additional kindreds
          but with different clinical courses, such as ALS8, late-onset SMA, and typical severe ALS with
          rapid progression.
        supports: SUPPORT
