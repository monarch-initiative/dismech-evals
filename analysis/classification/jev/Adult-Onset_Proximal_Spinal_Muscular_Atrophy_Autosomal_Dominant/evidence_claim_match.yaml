  2fbab309325a90232c18a1061b738eb8e99b9009184000a2b14459c9066081fa:
    claim:
      about:
        disease:
          name: Adult-Onset Proximal Spinal Muscular Atrophy, Autosomal Dominant
          disease_term:
            preferred_term: adult-onset proximal spinal muscular atrophy, autosomal dominant
            term:
              id: MONDO:0008453
              label: adult-onset proximal spinal muscular atrophy, autosomal dominant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: vapb_aggregates_absent_at_physiological_expression
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the ER-derived VAPB aggregates that dominate the mechanistic literature actually form
          in human motor neurons carrying one p.Pro56Ser allele, or are they an artefact of overexpression?
        attaches_to:
        - pathophysiology#ER-Derived Aggregation of Misfolded VAPB
        rationale: 'The aggregation-and-sequestration model was built almost entirely in overexpression
          systems, where mutant VAPB reliably forms tubular ER clusters and drags in wild-type VAP. Three
          lines of evidence complicate transferring that to patients. Patient-derived iPSC motor neurons
          show reduced VAPB but no identifiable cytoplasmic aggregates. In transgenic mice the inclusions
          do not correlate with degeneration, disappear after axotomy, and behave as a reversible ERAD-linked
          quality-control compartment — possibly protective. Against that, physiological-level knock-in
          mice do form motor-neuron inclusions, so dose alone does not explain the discrepancy. The mismatch
          is not academic: it decides whether a therapy should clear aggregates or restore wild-type VAPB,
          and the two hypotheses in mechanistic_hypotheses point in opposite directions.'
        proposed_experiments:
        - experiment_id: exp_vapb_aggregate_detection_in_patient_tissue
