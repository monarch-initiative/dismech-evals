      assertion_type: Pathophysiology
      assertion:
        name: ER-Derived Aggregation of Misfolded VAPB
        biological_scale: CELLULAR
        role: intermediate
        mechanism_confidence: ESTABLISHED
        conforms_to: loss_of_proteostasis#Misfolded-Protein Aggregation
        description: 'Mutant VAPB misfolds and self-associates into immobile, tubular ER-derived inclusions
          in motor neurons, dragging endogenous wild-type VAPA and VAPB into the same aggregates. The
          inclusions are not inert: they are decorated with ER-associated degradation machinery (p97/VCP,
          Derlin-1, BAP31) and behave as a quality-control compartment formed when misfolded VAPB exceeds
          ERAD capacity. Their pathogenic weight is contested — see the HUMAN_MODEL_MISMATCH discussion
          below, since patient-derived motor neurons expressing the allele at physiological level do not
          show them.'
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: protein folding
          modifier: ABNORMAL
          term:
            id: GO:0006457
            label: protein folding
      selected_evidence:
        snippet: We report that in the CNS, VAPB is abundant in motor neurons and that the P56S substitution
          causes aggregation of mutant VAPB in immobile tubular ER clusters, perturbs FFAT-motif binding,
          and traps endogenous VAP in mutant aggregates.
        supports: SUPPORT
