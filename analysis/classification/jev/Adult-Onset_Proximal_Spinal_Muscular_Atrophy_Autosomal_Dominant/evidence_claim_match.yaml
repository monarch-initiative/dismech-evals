        biological_scale: CELLULAR
        role: intermediate
        mechanism_confidence: PROVISIONAL
        description: VAPB is a mitochondria-associated-membrane protein that tethers ER to mitochondria
          by binding the outer-mitochondrial-membrane protein PTPIP51, and this contact is where calcium
          released from ER stores is taken up by mitochondria. p.Pro56Ser alters PTPIP51 binding and increases
          mitochondrial calcium uptake. PROVISIONAL rather than ESTABLISHED because the direct evidence
          comes from overexpression in cell lines and from yeast and mammalian model systems, not from
          VAPB-mutant human motor neurons.
        biological_processes:
        - preferred_term: mitochondrial calcium ion homeostasis
          modifier: ABNORMAL
          term:
            id: GO:0051560
            label: mitochondrial calcium ion homeostasis
      selected_evidence:
        snippet: Finally, we demonstrate that VAPBP56S has altered binding to PTPIP51 and increases Ca(2+)
          uptake by mitochondria following release from ER stores.
