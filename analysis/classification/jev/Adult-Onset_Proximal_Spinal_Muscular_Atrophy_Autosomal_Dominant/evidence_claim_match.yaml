              id: MONDO:0008453
              label: adult-onset proximal spinal muscular atrophy, autosomal dominant
        context: []
      assertion_type: Genetic
      assertion:
        name: VAPB
        gene_term:
          preferred_term: VAPB
          term:
            id: hgnc:12649
            label: VAPB
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'VAPB (20q13.32) encodes VAMP-associated protein B/C, a type II integral membrane protein
          of the endoplasmic reticulum whose cytosolic MSP domain recruits FFAT-motif partners and so
          builds membrane contact sites between the ER and essentially every other cellular membrane.
          The recurrent disease allele is c.166C>T (p.Pro56Ser), which lies in the MSP domain.

          Two facts about this gene shape how a VAPB result should be read. First, p.Pro56Ser is not a
          set of independent observations: haplotype analysis of eight families of both Portuguese-Brazilian
          and African-Brazilian ancestry traces them all to one founding event about 23 generations ago,
          so the apparent recurrence of the allele is largely genealogy. Second, one allele does not equal
          one phenotype — the same p.Pro56Ser produces late-onset SMA, slowly progressive atypical ALS,
          and rapidly progressive typical ALS in different kindreds, and no modifier explaining that has
          been identified.

          Other VAPB variants (T46I, A145V, S160del) have been reported in ALS cohorts, but the Finkel-type
          SMA phenotype curated here is a p.Pro56Ser phenotype; nothing establishes that the other alleles
          produce it.'
      selected_evidence:
        snippet: Subsequently, the same mutation was identified in patients from six additional kindreds
          but with different clinical courses, such as ALS8, late-onset SMA, and typical severe ALS with
          rapid progression.
        supports: SUPPORT
