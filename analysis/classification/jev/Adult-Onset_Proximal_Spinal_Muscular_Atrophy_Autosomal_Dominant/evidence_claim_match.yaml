      assertion:
        name: Amyotrophic lateral sclerosis
        description: 'Not a clean differential so much as a continuum: the same VAPB p.Pro56Ser allele
          produces late-onset SMA, atypical slowly progressive ALS, and rapidly progressive typical ALS
          in different kindreds, and most ALS8 patients eventually show subtle pyramidal signs. Distinguishing
          them matters prognostically — median survival here is 21.9 years — but the boundary is clinical,
          not molecular.'
      selected_evidence:
        snippet: Subsequently, the same mutation was identified in patients from six additional kindreds
          but with different clinical courses, such as ALS8, late-onset SMA, and typical severe ALS with
          rapid progression.
