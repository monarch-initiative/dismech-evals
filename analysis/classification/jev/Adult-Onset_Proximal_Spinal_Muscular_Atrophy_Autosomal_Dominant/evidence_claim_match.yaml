        description: p.Pro56Ser disturbs both the initiation and the completion of autophagy, with autophagosomes
          failing to fuse with lysosomes. Aggregates accumulate together with LC3 and p62 and sequester
          RNA-binding proteins — phosphorylated TDP-43, FUS and Matrin 3 — into persistent stress granules,
          connecting this disorder to the wider TDP-43 proteinopathy of ALS. The human material is a single
          ALS8 index patient's muscle biopsy and fibroblasts, which is why the node is PROVISIONAL.
        biological_processes:
