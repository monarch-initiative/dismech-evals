              label: adult-onset proximal spinal muscular atrophy, autosomal dominant
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: vapb_p56s_one_allele_many_phenotypes
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a single founder allele, VAPB p.Pro56Ser, produce late-onset Finkel SMA in some
          carriers, slowly progressive atypical ALS in others, and rapidly progressive typical ALS in
          a few?
        attaches_to:
        - pathophysiology#VAPB p.Pro56Ser MSP-Domain Variant
        - pathophysiology#Lower Motor Neuron Degeneration
        rationale: 'This is the central unresolved question for this entry, and it is unusually well posed
          because the founder effect removes allelic heterogeneity as an explanation: nearly all reported
          patients carry the same ancestral chromosome. The 2004 discovery paper already reported the
          three courses across seven kindreds, and the 2026 series of 78 patients quantified the split
          — 42% presenting as pure progressive muscular atrophy, of whom 30% later developed upper motor
          neuron signs. Whatever separates them is therefore modifier, environmental or stochastic, and
          none has been identified. Practically, this determines whether MONDO:0008453 names a disease
          or a presentation.'
        proposed_experiments:
        - experiment_id: exp_vapb_modifier_scan_within_founder_pedigree
          name: Genome-wide modifier scan within the founder pedigree
          description: Because carriers share one ancestral haplotype, a within-pedigree association of
            genome-wide genotype against presentation category (pure LMN versus UMN-positive) and age
            at onset isolates modifiers with the causal allele held constant — a design most Mendelian
            disorders cannot support.
        - experiment_id: exp_vapb_isogenic_motor_neuron_subtype_panel
          name: Isogenic corticospinal versus spinal motor neuron comparison
          description: Introduce p.Pro56Ser into isogenic iPSC lines differentiated separately to corticospinal-like
            and spinal motor neurons, and compare ER stress, contact-site integrity and survival, testing
            whether the corticospinal selectivity seen in the transgenic mouse is a property of the neuron
            subtype or of the transgene.
      selected_evidence:
        snippet: At admission, 51% had spinal-onset ALS, 42% progressive muscular atrophy (PMA) and 6%
          flail leg; 30% of patients with PMA subsequently developed UMN signs.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
