        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: vapb_haploinsufficiency
        hypothesis_label: Haploinsufficiency of the wild-type allele
        status: EMERGING
        description: 'The competing reading: at physiological expression a single mutant allele produces
          too little protein to sequester anything, aggregates are not seen in patient-derived cells,
          and what actually matters is that the wild-type allele alone cannot supply enough VAPB. On this
          account the disorder is a haploinsufficiency and the aggregates seen in overexpression systems
          are an artefact of dose. The two hypotheses are not mutually exclusive — both converge on the
          same central_effector node — but they imply opposite therapeutic strategies (clear the aggregate
          versus raise wild-type VAPB).'
      selected_evidence:
        snippet: Instead, loss-of-function of the single wild-type allele is required for pathological
          effects, and VAPB haploinsufficiency may be the main driver of the disease.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
