        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autonomic and Unmyelinated Small-Fibre Degeneration
        biological_scale: TISSUE
        role: consequence
        mechanism_confidence: PROVISIONAL
        description: 'A parallel, non-motor arm of the same VAPB deficit: peripheral autonomic and other
          unmyelinated fibres degenerate. Sural nerve biopsy in a p.Pro56Ser family showed loss of nerve
          fibres with a marked unmyelinated-fibre predominance and collagen pockets on electron microscopy,
          and the sympathetic skin response was absent. This is curated as a distinct arm rather than
