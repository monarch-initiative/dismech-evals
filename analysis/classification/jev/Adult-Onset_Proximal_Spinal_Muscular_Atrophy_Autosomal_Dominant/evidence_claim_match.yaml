            term:
              id: MONDO:0008453
              label: adult-onset proximal spinal muscular atrophy, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Functional VAPB at ER Membrane Contact Sites
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'However the aggregates are read, the functional consequence converges on too little
          working VAPB at the ER surface. The mutant protein is unstable and non-functional, and VAPB
          levels are reduced in patient-derived motor neurons and in ALS spinal cord. Because VAPB is
          the tether that recruits FFAT-motif partners to the ER, its shortfall degrades a whole family
          of contact-site functions at once: ER-to-Golgi transport, lipid exchange (with a characteristic
          rise in phosphatidylinositol-4-phosphate), phosphoinositide and calcium handling, and ER protein
          quality control.'
        biological_processes:
        - preferred_term: intermembrane lipid transfer
          modifier: DECREASED
          term:
            id: GO:0120009
            label: intermembrane lipid transfer
        - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
          modifier: DECREASED
          term:
            id: GO:0006888
            label: endoplasmic reticulum to Golgi vesicle-mediated transport
      selected_evidence:
        snippet: The mutant protein is aggregation-prone, non-functional and unstable, and its expression
          from a single allele appears to be insufficient to support toxic gain-of-function effects within
          motor neurons.
        supports: SUPPORT
