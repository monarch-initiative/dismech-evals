        prompt: Should adult-onset Still disease and systemic juvenile idiopathic arthritis (sJIA) be
          classified as a single disease continuum across ages rather than two distinct entities?
        kind: CONTROVERSY
        status: RESOLVED
        attaches_to:
        - pathophysiology#Systemic Hyperinflammation and Multiorgan Involvement
        rationale: AOSD and sJIA share clinical features, cytokine profiles, and pathogenesis; the historical
          dichotomy has increasingly given way to a unified "Still disease" continuum spanning childhood
          and adulthood, which has implications for shared diagnostic criteria and therapeutic targets.
      selected_evidence:
