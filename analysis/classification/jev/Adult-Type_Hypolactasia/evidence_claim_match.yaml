      assertion_type: DifferentialDiagnosis
      assertion:
        name: Secondary lactase deficiency
        description: Acquired small-intestinal mucosal injury can lower lactase at any age. Celiac disease,
          infection including giardiasis and rotavirus, Crohn disease and malnutrition are possible causes;
          activity may improve when the underlying process resolves.
        distinguishing_features:
        - Look for underlying intestinal disease, alarm signs, acquired timing or other evidence of malabsorption.
        - Lactase-persistence genotype does not rule out secondary deficiency.
      selected_evidence:
        snippet: Secondary lactase deficiency, due to damage to the small intestinal mucosa, may occur
          at any age and may be caused by infectious enteritis (i.e., Rotavirus, particularly in infancy),
          enteropathy (i.e., celiac disease, Giardiasis, and Crohn's disease), or severe malnutrition
          and may, thus, be transient and related to the underlying condition.
        supports: SUPPORT
        directness: DIRECT
