        name: clinicaltrials:NCT03659747
        status: COMPLETED
        phase: NOT_APPLICABLE
        description: Booster Alpha randomized 34 adults aged 25–60 with a positive screening lactose breath
          test in a blinded three-period crossover. Each 25-g lactose challenge used fat-free milk and
          Bi-07, 4662 FCC units lactase or placebo. The primary six-hour breath-H2 iAUC was lower with
          Bi-07 than placebo, but higher than with lactase; noninferiority to lactase was not established.
          No Bi-07 symptom advantage over placebo was demonstrated. The primary per-protocol population
          was 33 after one smoking exclusion.
        notes: Registry status, phase and actual enrollment checked against the live ClinicalTrials.gov
          API on 2026-09-21. One-week washouts, significant carryover and sequence effects, an unvalidated
          symptom questionnaire and industry involvement limit inference. These were acute challenges,
          not chronic symptom-control trials.
      selected_evidence:
        snippet: The noninferiority of Bi-07 compared with lactase was not shown
        supports: SUPPORT
