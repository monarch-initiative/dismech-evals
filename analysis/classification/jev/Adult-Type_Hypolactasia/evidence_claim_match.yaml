        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Genotype-Associated Regulatory DNA Modification
        biological_scale: MOLECULAR
        description: Adult surgical jejunal enterocytes show genotype-associated DNA modification and
          age associations at LCT-MCM6 regions. The assays measure modified cytosines without uniquely
          resolving 5mC from 5hmC. The 115 adults were sampled cross-sectionally at ages 21–72; proposed
          earlier-life trajectories are postdictions. A separate selected pediatric duodenal-biopsy study
          supports genotype-associated methylation and enzyme-activity correlations. Neither study proves
          a universal methylation-mediated route to symptoms. Regulatory DNA deletions establish element
          function, not the causal effect of changing its methylation.
      selected_evidence:
        snippet: In lactase non-persistent individuals (CC), DNA modifications consistently increased
          with age across LCT and MCM6 (Fig. 4).
        supports: SUPPORT
        directness: DIRECT
