          disease_term:
            preferred_term: lactose intolerance adult type
            term:
              id: MONDO:0006065
              label: lactose intolerance adult type
        context: []
      assertion_type: Genetic
      assertion:
        name: Regionally distributed lactase-persistence variants
        gene_term:
          preferred_term: MCM6
          term:
            id: hgnc:6949
            label: MCM6
        relationship_type: PROTECTIVE
        notes: The 2007 East African study analyzed 470 reliable lactose-tolerance phenotypes. C-14010
          had robust corrected association; G-13915 and G-13907 were candidate associations that did not
          remain significant after multiple-testing correction in that study. Derived reporter haplotypes
          enhanced transcription relative to ancestral constructs, but the G-13907 construct also contained
          linked T-13495. These variants favor persistence; they are not non-persistence alleles. A C/T-13910-only
          assay has incomplete population coverage, rather than being uniformly invalid in every non-European
          individual.
      selected_evidence:
        snippet: These SNPs originated on different haplotype backgrounds from the European C/T-13910
          SNP and from each other.
        supports: SUPPORT
        directness: DIRECT
    origin:
