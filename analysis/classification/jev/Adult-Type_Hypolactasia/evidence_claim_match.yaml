        context: []
      assertion_type: ClinicalTrial
      assertion:
        name: clinicaltrials:NCT03814668
        status: COMPLETED
        phase: NOT_APPLICABLE
        description: Booster Omega randomized 34 adults in the analogous three-period crossover protocol
          using 25 g aqueous lactose. Bi-07 lowered breath-H2 iAUC relative to placebo and met the prespecified
          noninferiority margin against lactase for that gas endpoint. Lactase did not significantly outperform
          placebo on the primary iAUC measure. No broad symptom advantage was shown; Bi-07 increased nausea.
          All 34 were in the per-protocol population, but two Bi-07 visits with vomiting were excluded
          from that outcome analysis (32 Bi-07 versus 34 comparator observations).
        notes: Registry status, phase and actual enrollment checked against the live ClinicalTrials.gov
          API on 2026-09-21. Sequence effects, possible taste-related unblinding, an unvalidated symptom
          questionnaire and industry involvement limit translation. The gas noninferiority result does
          not show symptomatic equivalence or long-term efficacy.
      selected_evidence:
        snippet: Bi-07 was superior to placebo and noninferior to lactase, based on BHC iAUC values.
        supports: SUPPORT
        directness: DIRECT
