  8b16374ad35d07bd6922e0936478eccda4bf3d911c0dbbbb454a87ae7733749f:
    claim:
      about:
        disease:
          name: Adult Granulosa Cell Tumor of Ovary
          disease_term:
            preferred_term: adult-type granulosa cell tumor of the ovary
            term:
              id: MONDO:0020541
              label: maligant granulosa cell tumor of ovary
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered FOXL2 Transcriptional Program
        biological_scale: MOLECULAR
        description: Mutant FOXL2 C134W binds most of the wild-type FOXL2 DNA elements but additionally
          engages a large collection of genomic elements not bound by wild-type FOXL2. The result is a
          gain-of-function shift in the regulatory output of FOXL2-containing complexes rather than a
          simple loss of FOXL2 activity, and mouse modelling shows the resulting transcriptome is dominated
          by hallmark-of-cancer programs including dysregulated TGF-beta signalling.
        molecular_functions:
        - preferred_term: FOXL2 DNA-binding transcription factor activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        cell_types:
        - preferred_term: granulosa cell
          term:
            id: CL:0000501
            label: granulosa cell
        notes: SLC35F2, a uniquely FOXL2 C134W-bound target identified in the isogenic model, is an uptake
          transporter whose expression increases sensitivity to YM155 (sepantronium). This is recorded
          as a preclinical mechanism-to-therapy lead only; no clinical data in adult granulosa cell tumor
          exist, so no corresponding treatment is curated.
      selected_evidence:
        snippet: FOXL2C134W associated with the majority of the FOXL2 wild-type DNA elements as well as
          a large collection of unique elements genome wide.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32641414
      reference_title: The Pathognomonic FOXL2 C134W Mutation Alters DNA-Binding Specificity.
      evidence_source: IN_VITRO
      explanation: Isogenic ChIP-seq shows the mutation redirects rather than abolishes FOXL2 DNA binding,
        which is the mechanistic content of this node.
