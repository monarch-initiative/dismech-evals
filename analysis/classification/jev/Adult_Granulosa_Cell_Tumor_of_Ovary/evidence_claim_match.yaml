        biological_scale: ORGANISM
        description: Because AGCT arises from a hormonally active lineage, the tumor continues to secrete
          granulosa-cell products. Excess estrogen production unopposed by progesterone drives the endometrial
          proliferative pathology and abnormal bleeding that dominate the clinical presentation, and the
          same retained differentiation makes inhibin B and anti-Mullerian hormone useful circulating
          tumor markers.
        biological_processes:
