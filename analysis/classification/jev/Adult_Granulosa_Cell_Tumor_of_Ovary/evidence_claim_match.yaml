  a6d1913df0c76b72b35344697bd8ce41c3dbcae58b8ca049b2cd529c9ff31f01:
    claim:
      about:
        disease:
          name: Adult Granulosa Cell Tumor of Ovary
          disease_term:
            preferred_term: adult-type granulosa cell tumor of the ovary
            term:
              id: MONDO:0020541
              label: maligant granulosa cell tumor of ovary
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Estrogen-Driven Endometrial Pathology
        biological_scale: TISSUE
        description: Chronic unopposed estrogen from the tumor produces endometrial proliferation and
          hyperplasia in about half of patients at presentation, with a minority developing synchronous
          endometrial carcinoma. This is the mechanistic route by which a hormonally active ovarian tumor
          presents as a uterine bleeding problem.
        locations:
        - preferred_term: endometrium
          term:
            id: UBERON:0001295
            label: endometrium
        notes: This node deliberately has no outgoing causal edge. Early symptomatic bleeding does bring
          most patients to diagnosis at stage I, but early *detection* is not a cause of the tumor's indolent
          *biology*, so drawing an edge to the late-recurrence node would assert a causal claim the evidence
          does not make. The stage-at-diagnosis observation is recorded under progression instead.
      selected_evidence:
        snippet: The most common presenting symptom was abnormal uterine bleeding (53.7%).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19809549
      reference_title: 'Prognostic factors in adult granulosa cell tumors of the ovary: a retrospective
        analysis of 80 cases.'
      evidence_source: HUMAN_CLINICAL
