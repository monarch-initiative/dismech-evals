        genetic_context:
          variant_origin: SOMATIC
        biological_scale: MOLECULAR
        description: A single recurrent somatic missense point mutation, c.402C>G (p.C134W), in the forkhead
          transcription factor FOXL2 is present in essentially all morphologically typical adult-type
          granulosa cell tumors and is absent from other sex cord-stromal tumor types and from unrelated
          ovarian and breast tumors. FOXL2 is the master transcriptional regulator of granulosa-cell identity,
          so the mutation lands in the lineage-defining factor of the tumor's cell of origin.
        cell_types:
        - preferred_term: granulosa cell
          term:
            id: CL:0000501
            label: granulosa cell
        locations:
        - preferred_term: ovary
          term:
            id: UBERON:0000992
            label: ovary
      selected_evidence:
        snippet: All four index GCTs had a missense point mutation, 402C-->G (C134W), in FOXL2, a gene
          encoding a transcription factor known to be critical for granulosa-cell development.
        supports: SUPPORT
