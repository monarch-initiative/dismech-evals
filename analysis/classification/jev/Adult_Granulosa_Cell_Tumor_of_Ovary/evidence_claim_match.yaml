          FOXO1 mutation is a secondary event in only about 7% of human tumors and PTEN loss is not a
          recognised driver, so this model does not reproduce the disease''s defining genetics and speaks
          to downstream permissive signalling rather than to causation.'
        readouts:
        - name: Nuclear FOXL2 and phosphorylated SMAD2/3 in tumor cells
          target: Granulosa Cell Proliferation and Survival
          direction: INCREASED
          interpretation: The shared signalling state that makes this genetically divergent model informative
            for the human tumor.
      selected_evidence:
        snippet: Selective inactivation of the Foxo1 and Foxo3 genes in murine ovarian granulosa cells
          severely impairs follicular development and apoptosis causing infertility, and as shown here,
          granulosa cell tumor (GCT) formation.
        supports: SUPPORT
