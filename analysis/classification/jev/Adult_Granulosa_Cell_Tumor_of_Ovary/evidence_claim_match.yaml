      assertion:
        name: FOXL2 c.402C>G Mutation Testing
        description: 'Because AGCT morphology overlaps other sex cord-stromal histotypes and cannot be
          predicted reliably by morphology alone, targeted testing for the FOXL2 c.402C>G (p.C134W) mutation
          is the decisive diagnostic step separating AGCT from its siblings. The corollary matters too:
          a negative result does not exclude the diagnosis when morphology and immunophenotype are characteristic,
          since a small FOXL2-wildtype subset is driven by FGFR1 instead.'
      selected_evidence:
        snippet: Histological diagnosis of adult-type granulosa cell tumor is challenging, therefore testing
          for the FOXL2 mutation is crucial for differential diagnosis.
        supports: SUPPORT
