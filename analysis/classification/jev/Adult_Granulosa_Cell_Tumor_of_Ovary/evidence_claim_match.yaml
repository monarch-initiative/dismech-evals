              label: maligant granulosa cell tumor of ovary
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Prognostic Immunohistochemical Markers (CD56, GATA-4, SMAD3)
        description: A systematic review of prognostic markers in adult granulosa cell tumor found immunohistochemical
          expression of CD56, GATA-4 and SMAD3 to be associated with reduced prognosis, while estrogen
          receptor, anti-Mullerian hormone and inhibin staining carried no prognostic information despite
          AMH and inhibin being the established circulating disease markers. Mitotic rate, Ki-67, p53,
          beta-catenin and HER2 gave inconsistent results across studies. The SMAD3 signal is of mechanistic
          interest because SMAD2/3 activation in the presence of FOXL2 is the shared feature of the genetically
          unrelated Foxo1/3/Pten mouse tumor model.
      selected_evidence:
        snippet: FOXL2 mutation and FOXL2 mRNA were inverse and immunohistochemical (IHC) expression of
          CD56, GATA-4 and SMAD3 was associated with reduced prognosis. IHC analysis of estrogen receptor,
          Anti-Mullerian hormone (AMH) and inhibin was not associated with prognosis for GCT.
        supports: SUPPORT
