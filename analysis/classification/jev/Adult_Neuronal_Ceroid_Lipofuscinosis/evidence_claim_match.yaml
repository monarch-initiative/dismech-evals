      assertion:
        name: Genetic diagnosis
        description: 'Diagnosis was traditionally dependent on demonstration of characteristic storage
          material via brain biopsy or autopsy. For the three classic adult branches modeled here, gene-first
          testing of CLN6, CTSF, and DNAJC5 can establish a molecular diagnosis and largely supersede
          invasive biopsy; broader adult-NCL presentations require an appropriately broad NCL panel.

          '
