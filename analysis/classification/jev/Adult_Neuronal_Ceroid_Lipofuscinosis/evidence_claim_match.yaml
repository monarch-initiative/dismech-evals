          term:
            id: hgnc:2531
            label: CTSF
      selected_evidence:
        snippet: Although CTSF mutations account for a minority of cases of type B Kufs, CTSF screening
          should be considered in cases with early-onset dementia and may avoid the need for invasive
          biopsies.
        supports: SUPPORT
