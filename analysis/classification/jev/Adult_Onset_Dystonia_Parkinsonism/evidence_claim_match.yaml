      assertion:
        name: PLA2G6 Functional Dysregulation
        description: Biallelic PLA2G6 variants alter group VIA calcium-independent phospholipase A2 beta
          function in adult PLAN. Reported parkinsonism alleles are mainly nontruncating, and biochemical
          assays can retain catalytic activity; altered regulation, protein interactions, or context-specific
          membrane homeostasis are therefore more conservative than an asserted catalytic loss-of-function
          mechanism.
        genes:
        - preferred_term: PLA2G6
          term:
            id: hgnc:9039
            label: PLA2G6
        molecular_functions:
        - preferred_term: phospholipase A2 activity
          term:
            id: GO:0004623
            label: A2-type glycerophospholipase activity
          modifier: DYSREGULATED
        biological_processes:
        - preferred_term: phospholipid metabolic process
          term:
            id: GO:0006644
            label: phospholipid metabolic process
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Conversely, mutations associated with dystonia-parkinsonism did not impair catalytic
          activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
