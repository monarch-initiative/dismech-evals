        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Late childhood to adult-onset multisystem disease
        age_range: Childhood to adulthood
        notes: Symptoms can begin in late childhood or later, with progressive sensory, neurologic, dermatologic,
          skeletal, and cardiac involvement.
      selected_evidence:
        snippet: Adult Refsum disease (ARD) is associated with elevated plasma phytanic acid levels, late
          childhood-onset (or later) retinitis pigmentosa, and variable combinations of anosmia, polyneuropathy,
          deafness, ataxia, and ichthyosis. Onset of symptoms ranges from age seven months to older than
          age 50 years. Cardiac arrhythmia and heart failure caused by cardiomyopathy are potentially
          severe health problems that develop later in life.
        supports: SUPPORT
    origin:
