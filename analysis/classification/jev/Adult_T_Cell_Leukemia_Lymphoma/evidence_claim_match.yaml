      assertion:
        name: TP53-Mutant Senescence Escape
        conforms_to: viral_oncogenesis#Host Tumor Suppressor Inactivation and Signaling Hijack
        description: Somatic TP53 sequence or copy-number alterations mark an adverse ATL subset. Under
          AZT exposure, functional and patient evidence shows that wild-type p53 supports senescence and
          tumor-cell death, whereas mutated p53 is associated with treatment nonresponse and selection
          of an inactive-p53 clone at relapse. The modeled mechanism is explicitly bounded to this treatment
          context.
        genes:
        - preferred_term: TP53
          term:
            id: hgnc:11998
            label: TP53
        biological_processes:
        - preferred_term: cellular senescence
          modifier: DECREASED
          term:
            id: GO:0090398
            label: cellular senescence
      selected_evidence:
        snippet: Here, we report that enduring AZT treatment of T-cell leukemia virus I-infected cells,
          in vitro and in vivo in ATL patients, results in inhibition of telomerase activity, progressive
          telomere shortening, and increased p14(ARF) expression. In turn, this elicits stabilization
          and reactivation of the tumor suppressor p53-dependent transcription, increased expression of
          the cyclin-dependent kinase inhibitor p21(Waf1), and accumulation of p27(kip1), thereby inducing
          cellular senescence and tumor cell death.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
