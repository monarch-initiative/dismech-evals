      assertion_type: Subtype
      assertion:
        name: Smoldering ATLL
        description: Smoldering ATL usually has at least 5% abnormal peripheral-blood T lymphocytes with
          a normal absolute lymphocyte level and no hypercalcemia. With fewer than 5% abnormal T lymphocytes,
          a histologically proven skin or pulmonary lesion is required.
      selected_evidence:
        snippet: Smouldering type, 5% or more abnormal lymphocytes of T-cell nature in PB, normal lymphocyte
          level (less than 4 x 10(9)/l), no hypercalcaemia (corrected calcium level less than 2.74 mmol/l),
          lactate dehydrogenase (LDH) value of up to 1.5 x the normal upper limit, no lymphadenopathy,
          no involvement of liver, spleen, central nervous system (CNS), bone and gastrointestinal tract,
          and neither ascites nor pleural effusion. Skin and pulmonary lesion(s) may be present. In case
          of less than 5% abnormal T-lymphocytes in PB, at least one of histologically-proven skin and
          pulmonary lesions should be present.
        supports: SUPPORT
