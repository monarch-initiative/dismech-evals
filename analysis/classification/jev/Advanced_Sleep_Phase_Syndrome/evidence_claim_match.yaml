      assertion:
        name: Irregular Sleep-Wake Rhythm Disorder
        description: Particularly relevant to the sporadic/age-related arm, since it arises in the same
          population - older adults, and especially those with dementia, in whom SCN degeneration is advanced.
          Whereas ASPS represents a coherent circadian rhythm shifted early, ISWRD represents loss of
          a consolidated rhythm altogether, with sleep fragmented into multiple bouts across the 24 hours.
          Sundowning and fragmented nocturnal sleep in dementia typically belong here rather than to ASPS.
        disease_term:
          preferred_term: circadian rhythm sleep disorder, irregular sleep wake type
          term:
            id: MONDO:0024379
            label: circadian rhythm sleep disorder, irregular sleep wake type
        distinguishing_features:
        - At least three irregular sleep episodes per 24-hour period, rather than one consolidated but
          early sleep episode
        - No stable phase relationship to clock time, so actigraphy shows fragmentation rather than a
          consistent early schedule
        - Total sleep across 24 hours may be normal but is not consolidated, whereas ASPS sleep is consolidated
          and normal in architecture
        - AASM gives it different treatment recommendations from ASWPD (melatonin in children/adolescents
          with comorbid neurological disorders; light therapy in elderly with dementia)
      selected_evidence:
        snippet: Recommendations against the use of melatonin and discrete sleep-promoting medications
          are provided for demented elderly patients
        supports: SUPPORT
