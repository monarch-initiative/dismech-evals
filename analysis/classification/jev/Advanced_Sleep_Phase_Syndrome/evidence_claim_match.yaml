              label: advanced sleep phase syndrome
        context: []
      assertion_type: Definition
      assertion:
        name: Dim Light Melatonin Onset (DLMO) Phase Assessment
        definition_type: OTHER
        derivation_basis: ESTABLISHED_CRITERIA
        description: The reference measurement protocol for objectively locating circadian phase. Serial
          salivary or plasma melatonin samples are collected under dim-light conditions over several hours
          before habitual bedtime, and DLMO is the clock time at which melatonin rises above a defined
          assay threshold. In ASPS, DLMO occurs abnormally early. Core body temperature minimum is an
          equivalent phase marker. DLMO is what converts a patient report of early sleep into a demonstrated
          circadian phase advance, and it is what allows light therapy to be timed on the correct side
          of the phase-response curve - which is why it is a treatment-enabling measurement, not merely
          a confirmatory one.
        notes: 'Typed as OTHER rather than PHENOTYPE_ALGORITHM: this is a laboratory phase-assessment
          protocol, not a computable EHR/OMOP case-finding query, which is what PHENOTYPE_ALGORITHM denotes
          in this schema. No `validation_status` is asserted, because DLMO IS the reference standard for
          circadian phase - it is the comparator against which candidate biomarkers are validated, so
          it cannot coherently be marked VALIDATED_AGAINST_GOLD_STANDARD against itself. A specific numeric
          salivary-melatonin threshold is deliberately not stated here; thresholds are assay- and laboratory-dependent
          and no cached source states one verbatim. See also the parallel `diagnosis` entry, which records
          DLMO as a diagnostic test; this entry records the measurement definition.'
      selected_evidence:
        snippet: circadian phase estimates from the biomarker panels will be compared with those derived
          from plasma or saliva melatonin (the current "gold-standard" circadian phase marker)
        supports: SUPPORT
    origin:
      assertion_path: /definitions/1
      evidence_path: /definitions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: clinicaltrials:NCT04690504
      reference_title: Proteomic and Transcriptomic Biomarkers of Circadian Timing - Validation of Circadian
        Biomarkers in Patients With Sleep Disorders
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes plasma/saliva melatonin phase as the current gold-standard circadian phase
        marker - the reason no separate validation status is asserted for DLMO itself.
