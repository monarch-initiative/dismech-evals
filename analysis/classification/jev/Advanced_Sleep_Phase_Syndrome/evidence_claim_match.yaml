          preferred_term: Advanced phase of melatonin secretion
          term:
            id: HP:0012689
            label: Abnormal pineal melatonin secretion
        notes: HP:0012689 is defined as "An anomaly in the amount or timing of melatonin secretion by
          the pineal gland", so the timing sense is within its scope; the more specific claim (advance
          rather than delay) is carried by preferred_term and description, as HPO has no direction-specific
          child.
      selected_evidence:
        snippet: affected individuals are "morning larks" with a 4-hour advance of the sleep, temperature,
          and melatonin rhythms
        supports: SUPPORT
