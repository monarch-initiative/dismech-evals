          this row asserts the specific clock-time observation of involuntary sleep onset in the early
          evening. "Advanced sleep onset" is an EXACT synonym of HP:0031873, so it is the correct available
          binding, and the alternative (the grandparent HP:0006979 Sleep-wake cycle disturbance) is direction-neutral
