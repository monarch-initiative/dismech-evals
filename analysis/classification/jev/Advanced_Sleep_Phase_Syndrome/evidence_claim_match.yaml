  ecaabf3017dff7580106f47f44c292f04a3956cad97a0f369578261931fc6567:
    claim:
      about:
        disease:
          name: Advanced Sleep Phase Syndrome
          disease_term:
            preferred_term: Advanced Sleep Phase Syndrome
            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        name: Preserved Sleep Quality and Duration on a Self-Selected Schedule
        category: Behavioral
        description: The single most useful discriminating feature. When affected individuals are permitted
          to sleep at their own early hours, sleep is consolidated and of normal architecture, quality,
          and total duration. This distinguishes ASPS from insomnia disorder (where sleep is poor regardless
          of timing), from depression with early-morning waking (where sleep is typically nonrestorative),
          and from familial natural short sleep (where duration itself is reduced). Sleep loss in ASPS
          is secondary to schedule conflict, not intrinsic.
        notes: Deliberately curated WITHOUT a phenotype_term. This assertion is the ABSENCE of a sleep-quality
          abnormality, so binding any HPO abnormality term (e.g. HP:0006979 Sleep-wake cycle disturbance)
          would make the entry assert the negation of its own claim and would be read by downstream consumers
          as a positive abnormality. HPO has no "normal sleep architecture" term; a normality/negation
          construct or a new term request would be needed. The same discriminating information is carried
          in the Insomnia Disorder and Major Depressive Disorder differential_diagnoses and in the ICSD-3
          criteria set.
      selected_evidence:
        snippet: Unlike other sleep maintenance disorders, early morning awakenings occur after a normal
          period of undisturbed sleep, that is, the sleep cycle is normal for the age.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/4
      evidence_path: /phenotypes/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34493186
      reference_title: Treatment of Circadian Rhythm Sleep-Wake Disorders.
      evidence_source: OTHER
      explanation: Directly evidences the discriminating feature - the early awakening follows a NORMAL,
        undisturbed sleep period, explicitly contrasted with other sleep-maintenance disorders. This is
        the sentence that separates ASWPD from insomnia disorder.
