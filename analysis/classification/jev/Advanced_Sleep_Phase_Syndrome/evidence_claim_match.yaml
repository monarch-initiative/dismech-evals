        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: asps_melatonin_evidence_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does correctly timed morning melatonin actually produce clinically meaningful phase delay
          in ASWPD without unacceptable daytime sedation?
        attaches_to:
        - pathophysiology#Advanced Circadian Phase of Melatonin, Temperature and Sleep Propensity
        rationale: Morning melatonin is mechanistically indicated for ASWPD by the melatonin phase-response
          curve, and review literature names advanced sleep phase among the disorders in which timed melatonin
          is useful. But the AASM guideline could make no recommendation for melatonin in ASWPD, the review
          literature states outright that clinical safety and effectiveness data are lacking, and the
          sedative effect of morning dosing may undermine the very schedule the treatment is meant to
          establish. The evidence for this treatment therefore carries a deliberate mixture of SUPPORT,
          NO_EVIDENCE, and REFUTE items in this entry - an honest reflection of an unresolved question
          rather than an internal inconsistency.
        proposed_experiments:
        - experiment_id: asps_exp_melatonin_rct
          name: Randomized trial of DLMO-timed morning melatonin in ASWPD
          description: Randomized placebo-controlled trial of morning melatonin timed against individually
            measured DLMO, in DLMO-confirmed ASWPD, with DLMO shift and actigraphic sleep timing as primary
            endpoints and next-day sleepiness plus schedule adherence as co-primary safety endpoints,
            since sedation is the predicted failure mode.
      selected_evidence:
        snippet: However, there is a lack of clinical data and information regarding the safety and effectiveness
          of melatonin
        supports: SUPPORT
