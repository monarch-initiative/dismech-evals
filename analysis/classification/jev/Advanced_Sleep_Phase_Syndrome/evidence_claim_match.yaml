  68f461053e450a1e51f4fec6b0490801edc99f045ab42e3ec2e4f99e7e8cfe67:
    claim:
      about:
        disease:
          name: Advanced Sleep Phase Syndrome
          disease_term:
            preferred_term: Advanced Sleep Phase Syndrome
            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CK1delta Reduced Kinase Activity
        description: 'CSNK1D p.Thr44Ala (T44A) mutates the kinase rather than the substrate: the mutant
          kinase has decreased enzymatic activity in vitro and causes FASPS in humans. Transgenic mice
          bearing CK1delta-T44A have a shortened circadian period, and CK1delta dosage modulates the PER2
          S662G phenotype in vivo, showing genetic interaction with PER2. This does not establish that
