      assertion_type: Pathophysiology
      assertion:
        name: Altered Photic Entrainment of the Circadian Pacemaker
        conforms_to: circadian_phase_misalignment#Loss or Mistiming of Photic Entrainment Input
        description: 'Light reaching intrinsically photosensitive retinal ganglion cells is conveyed by
          the retinohypothalamic tract to the suprachiasmatic nucleus and is the dominant zeitgeber that
          entrains the clock to the 24-hour day. The direction of the resulting shift depends on when
          in the circadian cycle the light falls (the phase-response curve): light in the late night/early
          morning advances the clock, light in the evening delays it. A clock lesion can therefore advance
          phase either by shortening period or by biasing this entrainment response; TIMELESS and CACNA1D
          variants act predominantly through the latter. This node is also the substrate on which treatment
          acts, and the reason mistimed light worsens the disorder.'
        biological_scale: CELLULAR
        role: mediator
        cell_types:
        - preferred_term: Intrinsically photosensitive retinal ganglion cell
          term:
            id: CL:0020014
            label: intrinsically photosensitive retinal ganglion cell
        biological_processes:
        - preferred_term: Entrainment of circadian clock by photoperiod
          term:
            id: GO:0043153
            label: entrainment of circadian clock by photoperiod
        locations:
        - preferred_term: Retina
          term:
            id: UBERON:0000966
            label: retina
        - preferred_term: Suprachiasmatic nucleus
          term:
            id: UBERON:0002034
            label: suprachiasmatic nucleus
      selected_evidence:
        snippet: A phase response curve (PRC) has been generated to describe the magnitude and direction
          of the phase shift of the circadian rhythm according to the time, duration, and intensity of
          light exposure
        supports: SUPPORT
