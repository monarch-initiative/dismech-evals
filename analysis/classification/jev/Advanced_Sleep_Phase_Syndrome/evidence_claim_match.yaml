      assertion_type: ComputationalModel
      assertion:
        name: Vanselow PER2 Multisite-Phosphorylation Oscillator
        description: Five-variable ordinary differential equation extension of a Goodwin oscillator that
          separates PER2 into unphosphorylated, singly phosphorylated, doubly phosphorylated, and nuclear
          species. The FASPS perturbation reduces the second phosphorylation rate, representing loss of
          the human PER2 S662 priming site, and tests how competing phosphorylation routes change clock
          period.
        model_type: KINETIC
        model_id: PMID:16983144#PER2-multisite-phosphorylation-ODE
        base_model: Goodwin oscillator
        model_software: MATLAB
        model_format: Five-variable ordinary differential equation system
        publication: PMID:16983144
        modeled_mechanisms:
        - target: PER2 S662-Site Hypophosphorylation
          relationship: PERTURBS
          fidelity: MODERATE
          description: Reducing the model's second phosphorylation rate represents loss of the FASPS priming
            phosphosite and shifts PER2 toward faster nuclear clearance and degradation.
          limitations: The deliberately minimal oscillator lumps many PER2 phosphosites and interacting
            proteins into five variables, was parameterized from mouse fibroblast experiments rather than
            human pacemaker neurons, and does not encode a heterozygous human allele or allele dosage.
