  eb23f883215d7e394665122fa2b0f6e071a9678d1a95cf1f83f8758621b76ab7:
    claim:
      about:
        disease:
          name: Advanced Sleep Phase Syndrome
          disease_term:
            preferred_term: Advanced Sleep Phase Syndrome
            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Timed Evening Bright Light Therapy
        description: 'The principal evidence-based treatment. Bright light delivered in the evening falls
          on the phase-delay portion of the human phase-response curve and pushes the advanced clock later.
          Phototherapy for ASWPD is usually given between 19:00 and 21:00, and the recommended dose to
          achieve a phase delay is at least 5,000 lux for 2 hours at night. The AASM 2015 guideline gives
          light therapy positive endorsement, at a second-tier degree of confidence, for adults with ASWPD,
          and the AASM guideline is summarized in the review literature as recommending night bright light
          therapy for ASWPD specifically.

          Tolerability is the main practical limitation: multiple studies report that elderly patients
          exposed to bright light at night could not tolerate it, resulting in poor compliance, and one
          comparison found better compliance (and symptom improvement) with dim rather than enhanced-intensity
          evening light. Side effects are otherwise minimal (eye fatigue, nausea, restlessness, headache)
          and usually self-limiting.

          DIRECTION IS CRITICAL. The same intervention mistimed does harm - morning bright light falls
          on the phase-advance portion of the curve and would further advance an already-advanced clock,
          worsening the disorder. Correct timing therefore depends on knowing circadian phase (DLMO or
          core body temperature minimum), not merely clock time. Tolerance of prolonged evening light
          can be poor in older adults, the group in whom ASPS is most common.'
        treatment_term:
          preferred_term: bright white light therapy
          term:
            id: NCIT:C174524
            label: Bright White Light Therapy
        therapeutic_modality: DEVICE
        notes: 'Strength of recommendation should not be overstated. The AASM 2015 recommendation for
          light therapy in adult ASWPD is graded WEAK FOR on VERY LOW quality evidence: the single randomized
          ASWPD trial identified by the AASM systematic review was small (47 participants, mean age 70)
          and used relatively dim evening light (~265 lux), and it did not find a significant post-treatment
          group difference. Reported side effects of phototherapy (eye fatigue, nausea, restlessness,
          headaches) are minimal and usually resolve spontaneously.'
      selected_evidence:
        snippet: Phototherapy is usually performed between 19:00~21:00 hours, which can improve sleep
          efficiency and delay the circadian rhythm
        supports: SUPPORT
