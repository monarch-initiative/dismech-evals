        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Delayed Sleep-Wake Phase Disorder
        description: 'The mirror-image intrinsic circadian rhythm sleep-wake disorder, and by far the
          more commonly diagnosed of the two. Both are disorders of sleep timing with normal sleep when
          the preferred schedule is followed, and they share almost all of their clinical vocabulary -
          which is precisely why the literatures are easy to conflate. The direction of the phase shift
          is opposite and so is the treatment: DSWPD is treated with morning light and evening melatonin
          to advance the clock, ASPS with evening light to delay it. Applying DSWPD treatment to ASPS
          would worsen it.'
        disease_term:
          preferred_term: circadian rhythm sleep disorder, delayed sleep phase type
          term:
            id: MONDO:0024377
            label: circadian rhythm sleep disorder, delayed sleep phase type
        distinguishing_features:
        - Sleep onset and offset are late (typically 02:00-06:00 onset) rather than early
        - Presenting complaint is sleep-onset insomnia and difficulty awakening in the morning, rather
          than evening sleepiness and early-morning awakening
        - Dim light melatonin onset (DLMO) is late rather than early
        - Onset is predominantly in adolescence rather than in early adulthood or with aging
        - Treatment direction is opposite - morning light and evening melatonin, versus evening light
          for ASPS
      selected_evidence:
        snippet: strategically timed melatonin (for the treatment of DSWPD, blind adults with N24SWD,
          and children/ adolescents with ISWRD and comorbid neurological disorders), and light therapy
          with or without accompanying behavioral interventions (adults with ASWPD, children/adolescents
          with DSWPD, and elderly with dementia)
        supports: SUPPORT
