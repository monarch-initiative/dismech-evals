      assertion_type: Definition
      assertion:
        name: Advanced Sleep-Wake Phase Disorder Diagnostic Criteria (ICSD-3-aligned)
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: Consensus clinical criteria for advanced sleep-wake phase disorder. The defining
          requirements are (a) a stable advance of the major sleep episode relative to the desired or
          required sleep and wake times, (b) symptoms - evening sleepiness and/or early-morning awakening
          - present for at least three months, (c) improvement in sleep quality and duration when the
          individual is allowed to follow their own preferred early schedule, (d) objective corroboration
          by sleep diary plus actigraphy for at least seven and preferably fourteen days including both
          work and free days, and (e) exclusion of another sleep, medical, neurological, psychiatric,
          medication-related, or environmental explanation.
        criteria_sets:
        - name: Core clinical criteria
          description: Criteria that must be jointly satisfied to diagnose ASWPD rather than a non-disordered
            advanced chronotype.
          core_clinical_characteristics:
          - preferred_term: Advance of the major sleep episode relative to desired sleep-wake time
            term:
              id: HP:0031873
              label: Early chronotype
          - preferred_term: Evening sleepiness
            term:
              id: HP:0002329
              label: Drowsiness
          - preferred_term: Early-morning awakening with inability to return to sleep
            term:
              id: HP:0031356
              label: Terminal insomnia
          additional_requirements:
          - preferred_term: Sleep onset and wake times occur at least 2 hours earlier than the societal
              norm
          - preferred_term: Symptoms present for at least three months
          - preferred_term: Sleep quality and duration improve when following the self-selected early
              schedule
          - preferred_term: Sleep diary plus actigraphy for at least 7 (preferably 14) days, including
              work and free days
          exclusion_criteria:
          - preferred_term: Another sleep, medical, neurological, psychiatric, medication-related, or
              environmental explanation for the sleep timing
        notes: 'The distress/impairment requirement is what separates ASWPD (a disorder) from an extreme
          but well-tolerated advanced chronotype. Many people with a markedly advanced phase never meet
          criteria because they arrange their lives around it.

          PROVENANCE: every numeric threshold in this criteria set is now sourced to a verbatim quotation.
          PMID:34493186 restates the five ICSD criteria in full ("The diagnosis of ASWPD requires that
          the following five main criteria are met") and separately gives the >=2 hour advance threshold.
          The definition is named "ICSD-3-aligned" because the criteria are quoted from a review restating
          them rather than from the ICSD-3 manual itself, which is not PubMed-indexed and therefore not
          citable under the project''s snippet rules.'
      selected_evidence:
        snippet: Sleep diaries, actigraphy, and determination of day and night phase markers (dim light
          melatonin onset and core body temperature minimum) have all become routine diagnostic methods
          for CRSWDs.
        supports: SUPPORT
    origin:
