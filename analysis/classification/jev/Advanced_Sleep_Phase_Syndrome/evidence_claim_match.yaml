      assertion:
        name: PER2 S662-Site Hypophosphorylation
        description: 'The original FASPS lesion, PER2 p.Ser662Gly (S662G), substitutes glycine for a serine
          within the casein kinase I epsilon/delta binding region of hPER2. The substitution causes hypophosphorylation
          by CK1epsilon in vitro. Newer evidence separates in-vitro kinase capacity from physiological
          control: MARK2 binds PER2, phosphorylates S662, and stabilizes PER2, while deletion of CK1delta/epsilon
          or five other candidate kinases did not reproduce phase advancement. Loss of S662-site phosphorylation
          retunes PER2 stability and the feedback loop, altering circadian period.'
        biological_scale: MOLECULAR
        role: central_effector
        biological_processes:
