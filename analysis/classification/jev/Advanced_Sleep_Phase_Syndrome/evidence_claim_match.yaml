      assertion_type: DifferentialDiagnosis
      assertion:
        name: Major Depressive Disorder with Early-Morning Awakening
        description: A clinically important differential in the opposite direction - terminal insomnia
          is a classic melancholic feature of major depression, and an ASPS patient reporting that they
          always wake at 4 a.m. is readily misread as depressed. Conversely, a depressed patient may be
          misclassified as having a circadian disorder. Getting this wrong matters because the treatments
          diverge completely, and because PER3-associated FASP is itself reported alongside elevated depression
          and seasonality scores, so the two can genuinely co-occur.
        disease_term:
          preferred_term: major depressive disorder
          term:
            id: MONDO:0002009
            label: major depressive disorder
        distinguishing_features:
        - Evening sleepiness is absent in depression; sleep onset is often delayed or unimpaired rather
          than involuntarily early
        - Sleep is nonrestorative in depression, whereas in ASPS it is restorative when taken at the preferred
          early hours
        - The whole circadian ensemble need not be phase-advanced in depression; DLMO is typically normal
        - Core depressive symptoms (anhedonia, low mood, guilt, appetite and psychomotor change) are present
          in depression and typically absent in ASPS
      selected_evidence:
        snippet: We identified two rare variants in the circadian clock gene PERIOD3 (PER3-P415A/H417R)
          in humans with familial advanced sleep phase accompanied by higher Beck Depression Inventory
          and seasonality scores.
        supports: SUPPORT
