            label: PER2
        - preferred_term: MARK2
          term:
            id: hgnc:3332
            label: MARK2
      selected_evidence:
        snippet: Affected individuals have a serine to glycine mutation within the casein kinase Iepsilon
          (CKIepsilon) binding region of hPER2
        supports: SUPPORT
