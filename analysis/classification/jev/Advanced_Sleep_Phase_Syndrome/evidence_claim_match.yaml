      assertion_type: Pathophysiology
      assertion:
        name: Altered PER/CRY Negative Feedback on CLOCK-BMAL1
        description: The protein-stability and phosphorylation routes to FASPS converge here. The TTFL
          keeps time because PER/CRY repressor complexes accumulate, are post-translationally delayed,
          enter the nucleus, repress CLOCK-BMAL1, and are then degraded, permitting the next cycle. Reducing
          the delay - through PER2 S662-site hypophosphorylation, reduced CSNK1D activity, accelerated
          CRY2 degradation, or PER3 destabilization - can make each iteration of the loop complete faster.
          CACNA1D bypasses this node and acts through altered entrainment; TIMELESS also has a distinct
          entrainment phenotype.
        biological_scale: MOLECULAR
        role: central_effector
        biological_processes:
        - preferred_term: Circadian regulation of gene expression
          term:
            id: GO:0032922
            label: circadian regulation of gene expression
        - preferred_term: PER/CRY transcriptional repression of CLOCK-BMAL1
          term:
            id: GO:0045892
            label: negative regulation of DNA-templated transcription
      selected_evidence:
        snippet: Thus, a variant in human sleep behavior can be attributed to a missense mutation in a
          clock component, hPER2, which alters the circadian period.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
