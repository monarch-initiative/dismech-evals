              label: advanced sleep phase syndrome
        context:
        - path: /has_subtypes/1
          value:
            name: Sporadic/Age-Related ASPS
            display_name: Sporadic and Age-Related Advanced Sleep Phase
            description: The non-familial form, in which advanced sleep timing arises without an identified
              Mendelian variant. Advanced sleep timing becomes progressively more common with age, and
              age-related circadian change is compounded by neurodegenerative disease affecting the suprachiasmatic
              nucleus and by reduced sensitivity and responsiveness to light. Early morning awakening
              occurs in roughly 4% of older individuals, and distressing advanced sleep-wake timing (ASWPD)
              affects approximately 1% of middle-aged adults.
            classification: etiologic
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Photic Sensitivity and Light Responsiveness
        description: 'The mediating step of the sporadic/age-related arm. Ageing reduces both the sensitivity
          of the circadian system to light and its responsiveness to it - through the SCN and its input
          pathway - so the daily zeitgeber signal that normally holds the clock at the correct phase is
          weakened. A weakened entraining signal is less able to oppose a drift toward earlier timing,
          and it also blunts the response to the evening light used therapeutically, which is part of
          why light therapy is harder to deliver effectively in exactly the older population in which
          this arm predominates.

          A behavioral positive-feedback loop compounds this: early awakening leads to premature morning
          light exposure, which falls on the phase-advance limb of the phase-response curve and advances
          the clock further.'
        biological_scale: CELLULAR
        role: mediator
        subtypes:
        - Sporadic/Age-Related ASPS
        cell_types:
        - preferred_term: Intrinsically photosensitive retinal ganglion cell
          term:
            id: CL:0020014
            label: intrinsically photosensitive retinal ganglion cell
        biological_processes:
        - preferred_term: Entrainment of circadian clock by photoperiod
          term:
            id: GO:0043153
            label: entrainment of circadian clock by photoperiod
          modifier: DECREASED
        locations:
        - preferred_term: Retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: If an individual receives less light in the afternoon or evening, or is prematurely exposed
          to morning light following early awakening, the circadian rhythm can be advanced, leading to
          an increased risk of an early sleep phase
        supports: SUPPORT
