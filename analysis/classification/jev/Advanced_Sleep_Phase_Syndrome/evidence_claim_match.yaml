  d9c546707d6b486d541321d775c73370ea115966b34873e5f7b178e0b1c486e7:
    claim:
      about:
        disease:
          name: Advanced Sleep Phase Syndrome
          disease_term:
            preferred_term: Advanced Sleep Phase Syndrome
            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TIMELESS Nuclear Exclusion
        description: 'A mutation in human TIMELESS (hTIM) prevents TIM from accumulating in the nucleus
          and alters its affinity for CRY2, destabilizing the PER/CRY complex and weakening repression
          of CLOCK-BMAL1. Notably, this variant produces advanced sleep phase primarily by altering photic
          entrainment rather than by shortening the organismal period: CRISPR mutant mice show advanced
          sleep phase with altered photic entrainment but a normal circadian period, even though period
          shortening is seen in mutant fibroblasts. What distinguishes TIMELESS from the other FASPS lesions
          is specifically the NORMAL organismal period - entrainment involvement as such is not unique
          to it, since the CRY2 A260T variant also shows a reduced phase-shift to early-night light while
          additionally shortening period.'
        biological_scale: MOLECULAR
        role: mediator
        biological_processes:
        - preferred_term: Protein import into nucleus
          term:
            id: GO:0006606
            label: protein import into nucleus
          modifier: DECREASED
        - preferred_term: Entrainment of circadian clock by photoperiod
          term:
            id: GO:0043153
            label: entrainment of circadian clock by photoperiod
        genes:
        - preferred_term: TIMELESS
          term:
            id: hgnc:11813
            label: TIMELESS
      selected_evidence:
        snippet: We demonstrate that the mutation prevents TIM accumulation in the nucleus and has altered
          affinity for CRY2, leading to destabilization of PER/CRY complex and a shortened period in nonmature
          mouse embryonic fibroblasts (MEFs).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31138685
      reference_title: TIMELESS mutation alters phase responsiveness and causes advanced sleep phase.
