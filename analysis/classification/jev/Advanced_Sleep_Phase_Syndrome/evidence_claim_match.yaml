      assertion:
        discussion_id: asps_variant_and_penetrance_reporting
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the specific TIMELESS variant causing familial advanced sleep phase, and what
          is the penetrance of each ASPS gene?
        attaches_to:
        - pathophysiology#TIMELESS Nuclear Exclusion
        rationale: The cached TIMELESS abstract establishes that a human TIMELESS mutation causes FASP
          and characterizes its molecular consequences, but names no specific variant, so this entry deliberately
          declines to assert one rather than importing an unverifiable variant name from the deep-research
          report. More broadly, penetrance is quantified for none of the six ASPS genes beyond the original
          PER2 kindreds being described as highly penetrant, and penetrance may be age- and light-environment-dependent.
          This limits both variant interpretation and genetic counselling.
        proposed_experiments:
        - experiment_id: asps_exp_timeless_variant_sourcing
          name: Source the TIMELESS variant to a citable record
          description: Extract the specific TIMELESS variant with HGVS nomenclature against a stated transcript
            from the primary full text and ClinVar, so it can be asserted with a verifiable citation.
        - experiment_id: asps_exp_penetrance
          name: Age-stratified penetrance estimation across ASPS genes
          description: Aggregate reported kindreds per gene to estimate age-specific penetrance, recording
            light environment and habitual schedule as covariates given that both are expected to modify
            expression.
      selected_evidence:
        snippet: Here, we report a mutation in the human TIMELESS (hTIM) gene that causes familial advanced
          sleep phase (FASP).
        supports: SUPPORT
