            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Circadian clock gene panel or exome/genome sequencing
        description: 'Molecular testing may be considered for a strongly familial, extreme, early-onset
          phenotype, although it is not required for the clinical diagnosis of ASWPD and its diagnostic
          yield is not established. Sequence analysis by a circadian-gene panel or exome/genome can interrogate
          the six reported causal or candidate genes - PER2, CSNK1D, CRY2, PER3, TIMELESS, and CACNA1D.
          Interpretation requires caution because evidence strength varies substantially: PER3 remains
          disputed, several relationships derive from small numbers of kindreds, and no ASPS gene has
          a ClinGen validity classification. Karyotype, chromosomal microarray, mitochondrial sequencing,
          and repeat-expansion testing have no routine indication unless another phenotype suggests a
          separate diagnosis. Sequence variants should be classified under ACMG/AMP criteria; cascade
          testing is appropriate only after establishing a pathogenic or likely pathogenic familial variant,
          and predictive testing of asymptomatic minors warrants counselling because an early chronotype
          may never cause disorder-level impairment.'
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Autosomal dominant mutations in circadian clock genes like PER2, CK1, PER3, CRY2, TIMELESS,
          and DEC2 have been linked to FASP
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
