        - path: /computational_models/3
          value:
            name: Wearable-Light Circadian Phase Particle-Filter Model
            description: Human physiological circadian model that drives the St. Hilaire light-response
              process and modified van der Pol pacemaker with each participant's ambulatory wrist-light
              time series. A particle ensemble spans unknown starting phases and produces a posterior
              distribution of predicted dim-light melatonin onset (DLMO).
            model_type: PHYSIOLOGICAL
            repository_url: https://github.com/Lara-Weed/circadian-wearable-init/tree/f953b2c6d4351ff93544248189d6c71ed580938d
            model_id: GitHub:Lara-Weed/circadian-wearable-init@f953b2c6d4351ff93544248189d6c71ed580938d
            base_model: St. Hilaire 2007 modification of the Jewett-Forger-Kronauer human circadian pacemaker
              model
            model_software: MATLAB with R functional principal-component analysis
            model_format: MATLAB/R scripts
            publication: PMID:41342262
            variables:
            - name: Wrist-measured illuminance
              dataset_identifier: I_all
              description: Time-varying personal light input supplied to the circadian light-response
                process.
              unit: lux
            - name: Circadian pacemaker state
              dataset_identifier: x
              description: Modified van der Pol oscillator state used to derive circadian phase.
              unit: dimensionless
            - name: Predicted dim-light melatonin onset
              dataset_identifier: DLMO
              description: Clock-time phase estimate derived from the simulated pacemaker state.
              unit: clock time
            - name: DLMO prediction error
              dataset_identifier: RMSE
              description: Root-mean-square error of the maximum-likelihood phase estimate relative to
                laboratory DLMO.
              unit: h
            notes: Repository inspected at commit f953b2c6d4351ff93544248189d6c71ed580938d. It contains
              MATLAB/R analysis and ODE code but no license, dependency manifest, or participant data.
              Several scripts contain author-local absolute paths, so the published workflow is not runnable
              end to end without manual path repair and restricted input data. The model is classified
              as PHYSIOLOGICAL rather than DIGITAL_TWIN because it assimilates individual light histories
              and state uncertainty but does not fit individual model parameters or validate counterfactual
              treatment response.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Advanced Circadian Phase of Melatonin, Temperature and Sleep Propensity
        relationship: MEASURES
        fidelity: LOW
        description: The participant-specific light history drives a human pacemaker model whose phase
          is reported as predicted DLMO and compared with an in-laboratory DLMO measurement.
        limitations: The validation cohorts comprised 56 healthy adults with regular schedules and 32
          shift workers, not people with ASPS. Model parameters and light sensitivity were not individually
          fitted, wrist illuminance is an imperfect proxy for retinal exposure, and validation used one
          laboratory phase marker per participant. The model estimates phase but does not represent the
