            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Schedule Accommodation and Sleep Scheduling
        description: 'Where occupational and social circumstances permit, the simplest and often the most
          effective management is to accommodate the early schedule rather than fight it, since sleep
          is normal when taken at the biologically preferred time. Where a delay is required, a prescribed
          and consistently maintained later sleep-wake schedule may be attempted, typically alongside
          evening light. The AASM guideline made no recommendation on prescribed sleep scheduling or timed
          exercise for ASWPD because the evidence was insufficient.

          Health education and behavioral guidance for ASWPD explicitly includes AVOIDANCE OF BRIGHT LIGHT
          IN THE MORNING - the direction-critical negative instruction, since morning light sits on the
          phase-advance limb of the PRC and would worsen the disorder - alongside a midday nap, postponing
          bedtime, physical activity, and walking outdoors in the evening under bright light. Chronotherapy
          for ASWPD delays sleep onset progressively (by 3 hours every 2 days) until the desired later
          bedtime is reached; a single case maintained a 23:00 bedtime at 5-month follow-up.'
        treatment_term:
          preferred_term: behavioral and educational intervention
          term:
            id: NCIT:C63474
            label: Behavioral, Psychological or Informational Intervention
        therapeutic_modality: BEHAVIORAL
      selected_evidence:
        snippet: No recommendations were provided for remaining treatments/ populations, due to either
          insufficient or absent data.
        supports: NO_EVIDENCE
