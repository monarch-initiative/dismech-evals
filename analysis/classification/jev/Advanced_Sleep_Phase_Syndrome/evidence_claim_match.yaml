  31bbd3c25cdac6558262afc9e4573a92eae016d4f01bea326bff23a2e25807d9:
    claim:
      about:
        disease:
          name: Advanced Sleep Phase Syndrome
          disease_term:
            preferred_term: Advanced Sleep Phase Syndrome
            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Shortened Intrinsic Circadian Period
        description: 'A major physiological route in Mendelian FASPS - a free-running circadian period
          (tau) measurably shorter than the normal ~24.2 hours. A clock that runs fast must be reset backwards
          each day by the zeitgeber; the steady-state consequence of entraining a short-period oscillator
          to a 24-hour day is that it settles at an abnormally early phase angle. This is the direct mechanistic
          explanation for why a period abnormality produces a phase abnormality, and it is the reason
          FASPS individuals are phase-advanced rather than simply free-running. It is not universal: TIMELESS
          and CACNA1D model organisms show altered photic entrainment with a normal organismal period
          and reach the advanced phase by the parallel entrainment route.'
        biological_scale: CELLULAR
        role: central_effector
