      assertion_type: Subtype
      assertion:
        name: Sporadic/Age-Related ASPS
        display_name: Sporadic and Age-Related Advanced Sleep Phase
        description: The non-familial form, in which advanced sleep timing arises without an identified
          Mendelian variant. Advanced sleep timing becomes progressively more common with age, and age-related
          circadian change is compounded by neurodegenerative disease affecting the suprachiasmatic nucleus
          and by reduced sensitivity and responsiveness to light. Early morning awakening occurs in roughly
          4% of older individuals, and distressing advanced sleep-wake timing (ASWPD) affects approximately
          1% of middle-aged adults.
        classification: etiologic
      selected_evidence:
        snippet: Early morning awakening is, instead, more common among older individuals, occurring in
          almost 4% of cases, without considering associated comorbidities. Advanced sleep-wake phase
          disorder (ASWPD) is characterized by a consistent and distressing anticipation of sleep-wake
          timing, affecting almost 1% of middle-aged individuals.
        supports: SUPPORT
