        context: []
      assertion_type: Phenotype
      assertion:
        name: Early Evening Sleep Onset
        category: Behavioral
        description: Involuntary sleep onset in the early evening, typically between 18:00 and 21:00,
          several hours earlier than the socially conventional bedtime. Sleep onset latency is short and
          sleep initiation is not impaired - this is not sleep-onset insomnia but a clock set early.
        phenotype_term:
          preferred_term: Advanced sleep onset
          term:
            id: HP:0031873
            label: Early chronotype
          temporality: CHRONIC
        notes: 'NEEDS TERM (NTR candidate). This phenotype shares HP:0031873 with `Early Chronotype`,
          but the two are distinct claims: HP:0031873 is defined as "A tendency towards rising very early
          in the morning and going to bed early in the evening" - a stable trait disposition - whereas
          this row asserts the specific clock-time observation of involuntary sleep onset in the early
          evening. "Advanced sleep onset" is an EXACT synonym of HP:0031873, so it is the correct available
          binding, and the alternative (the grandparent HP:0006979 Sleep-wake cycle disturbance) is direction-neutral
          and would fit delayed sleep phase equally well. A distinct HPO child term for advanced sleep
          onset would resolve the reuse.'
        frequency: VERY_FREQUENT
      selected_evidence:
        snippet: This disorder, advanced sleep-phase syndrome, is characterized by very early sleep onset
          and offset
        supports: SUPPORT
