          value:
            name: Sporadic/Age-Related ASPS
            display_name: Sporadic and Age-Related Advanced Sleep Phase
            description: The non-familial form, in which advanced sleep timing arises without an identified
              Mendelian variant. Advanced sleep timing becomes progressively more common with age, and
              age-related circadian change is compounded by neurodegenerative disease affecting the suprachiasmatic
              nucleus and by reduced sensitivity and responsiveness to light. Early morning awakening
              occurs in roughly 4% of older individuals, and distressing advanced sleep-wake timing (ASWPD)
              affects approximately 1% of middle-aged adults.
            classification: etiologic
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Age-Related Suprachiasmatic Nucleus Decline
        description: The trigger of the SPORADIC / AGE-RELATED arm, mechanistically distinct from the
          Mendelian arm. With advancing age - and compounded by neurodegenerative disease - the suprachiasmatic
          nucleus itself is affected, reducing the robustness and amplitude of central pacemaker output.
          This is a degenerative/structural route to an unstable, easily-advanced clock rather than a
          change in the kinetics of the molecular oscillator, and it explains why advanced sleep timing
          becomes progressively more common with age. It is the arm that accounts for the substantially
          higher population-level prevalence figures (approximately 1% of middle-aged adults, and early
          morning awakening in about 4% of older individuals) relative to the rare Mendelian kindreds.
        biological_scale: CELLULAR
        role: trigger
        subtypes:
        - Sporadic/Age-Related ASPS
        cell_types:
        - preferred_term: Suprachiasmatic nucleus pacemaker neuron
          term:
            id: CL:4072019
            label: SCN pacemaker neuron
        biological_processes:
        - preferred_term: Regulation of circadian rhythm
          term:
            id: GO:0042752
            label: regulation of circadian rhythm
          modifier: DECREASED
        locations:
        - preferred_term: Suprachiasmatic nucleus
          term:
            id: UBERON:0002034
            label: suprachiasmatic nucleus
        notes: The direction of the association between ASWPD and cognitive decline is NOT settled. PMID:39864932
          reports "Conflicting data has surfaced regarding the protective or detrimental effects of ASWPD
          in studies on aging, mild cognitive impairment (MCI), and diverse dementia conditions." This
          node therefore models age/neurodegeneration as an upstream contributor to advanced phase, and
          deliberately does NOT assert a downstream effect of advanced phase on cognition.
      selected_evidence:
        snippet: Age-related alterations in circadian rhythms are exacerbated and compounded by neurodegenerative
          disorders, impacting the suprachiasmatic nucleus (SCN), sensitivity to light, and light responsiveness
          in those affected.
        supports: SUPPORT
