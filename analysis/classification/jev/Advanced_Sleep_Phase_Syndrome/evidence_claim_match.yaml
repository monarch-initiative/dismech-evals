        context: []
      assertion_type: Subtype
      assertion:
        name: FASPS
        display_name: Familial Advanced Sleep Phase Syndrome (FASPS/FASP)
        description: The inherited form, segregating as an autosomal dominant trait; high penetrance is
          documented in the original PER2 kindred but is not quantified for every reported gene. Typically
          emerges before age 30 and is present in a first-degree relative. Caused by variants in circadian-regulatory
          genes (PER2, CSNK1D, CRY2, PER3, TIMELESS, CACNA1D) that shorten the intrinsic circadian period
          or alter photic entrainment. This is the form to which the MONDO concept and its familial advanced
          sleep-phase syndrome synonyms most directly correspond, and it is the mechanistic centrepiece
          of this entry.
        classification: etiologic
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Here we describe three kindreds with a profound phase advance of the sleep-wake, melatonin
          and temperature rhythms associated with a very short tau. The trait segregates as an autosomal
          dominant with high penetrance.
        supports: SUPPORT
