  9ae9ef2bc0d298336d51d37a1937cd43a17ec3cbbb4fa2f0cea086fec0df97b5:
    claim:
      about:
        disease:
          name: Advanced Sleep Phase Syndrome
          disease_term:
            preferred_term: Advanced Sleep Phase Syndrome
            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Strategically Timed Melatonin
        description: 'Exogenous melatonin shifts circadian phase according to a phase-response curve that
          is approximately the inverse of the light PRC - melatonin taken in the morning delays the clock,
          whereas melatonin taken in the evening advances it. For ASPS the theoretically correct direction
          is therefore MORNING melatonin to produce a phase delay, the exact opposite of the evening dosing
          used in delayed sleep-wake phase disorder. Evening melatonin would advance the clock further
          and is expected to worsen ASPS.

          This treatment is included because review-level literature reports timed melatonin as useful
          across circadian rhythm sleep disorders including advanced sleep phase, but it must be flagged
          that the AASM 2015 guideline did NOT endorse melatonin for ASWPD - its melatonin endorsement
          was restricted to DSWPD, blind adults with N24SWD, and children/adolescents with ISWRD. Morning
          dosing also risks residual daytime sleepiness. Melatonin for ASPS should therefore be regarded
          as mechanistically rational but not guideline-supported.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: melatonin
            term:
              id: CHEBI:16796
              label: melatonin
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: 'In addition, timed administration of melatonin, either alone or in combination with
          light therapy has been shown to be useful in the treatment of the following circadian rhythm
          sleep disorders: delayed sleep phase, advanced sleep phase, free-running, irregular sleep wake,
          jet lag and shift work.'
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
