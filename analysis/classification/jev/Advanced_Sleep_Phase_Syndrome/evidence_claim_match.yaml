        name: Rigid Conventional Social and Occupational Schedule
        description: A non-photic environmental determinant of whether an advanced chronotype becomes
          a disorder. An early clock is only impairing when the person is required to be awake and functional
          in the evening or asleep past their spontaneous wake time. Schedules that permit early sleep
          and early rising render the same biology asymptomatic - which is also why ASPS is under-ascertained.
        effect: EXACERBATES
