  6bd3065981a200372aaab7f8a638d748c831e8b8e260f63cbbedcd56c9749d62:
    claim:
      about:
        disease:
          name: Advanced Sleep Phase Syndrome
          disease_term:
            preferred_term: Advanced Sleep Phase Syndrome
            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context:
        - path: /computational_models/1
          value:
            name: Revised PER2 Circadian Phosphoswitch Model
            description: Mechanistic mammalian circadian-clock ODE model embedding competing PER2 phosphorylation
              fates in the transcription-translation feedback loop. Its FASP-like condition reduces both
              modeled priming-phosphorylation rates to 10% of their wild-type values, while the 2018 revision
              explicitly represents CK1epsilon and CK1delta isoform binding, phosphorylation, and carboxyl-terminal-tail
              regulation.
            model_type: KINETIC
            repository_url: https://github.com/Mathbiomed/Phosphoswitch_Clock/tree/493a69d40c224b93d975d890277a4d71797aee2c
            model_id: GitHub:Mathbiomed/Phosphoswitch_Clock@493a69d40c224b93d975d890277a4d71797aee2c#Math_Model_Code2.nb
            base_model: Kim-Forger mammalian circadian clock with the 2015 Zhou-Kim PER2 phosphoswitch
            model_software: Wolfram Mathematica
            model_format: Mathematica Notebook (.nb)
            publication: PMID:29784789
            variables:
            - name: First CK1 priming-phosphorylation rate
              dataset_identifier: kr1
              description: PER2 priming-site phosphorylation rate for the first modeled CK1 species; reduced
                to 10% of wild type in the FASP condition.
              unit: model rate constant
            - name: Second CK1 priming-phosphorylation rate
              dataset_identifier: kr2
              description: PER2 priming-site phosphorylation rate for the second modeled CK1 species;
                reduced to 10% of wild type in the FASP condition.
              unit: model rate constant
            - name: PER2 abundance
              dataset_identifier: PER2
              description: Total modeled PER2 across phosphorylation and binding states.
              unit: normalized concentration
            - name: Free-running circadian period
              dataset_identifier: period
              description: Period of the simulated mammalian clock under each genetic condition.
              unit: h
            notes: Repository inspected at commit 493a69d40c224b93d975d890277a4d71797aee2c. The repository
              is linked from the Biomedical Mathematics Group's software catalog and contains the 2015
              Simple_Model_Final_Sub.nb and 2018 Math_Model_Code2.nb Mathematica notebooks, but no license
              or environment manifest. The paper's prose names the two FASP rates kp1/kp2, whereas its
              parameter table and the archived notebook use kr1/kr2. A smoke test that independently transcribed
              the published equations and used SciPy BDF integration produced a 23.937-h wild-type period
              and a 20.012-h period after reducing kr1/kr2 by 90%; direct notebook execution requires
              proprietary Wolfram software and was not available in the verification environment.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: PER2 S662-Site Hypophosphorylation
        relationship: PERTURBS
        fidelity: MODERATE
        description: The model represents competition between the stabilizing FASP-region phosphorylation
          route and the degradation-promoting beta-TrCP phosphodegron route, then lowers FASP-route phosphorylation
          as an S662G-like parameterization.
        limitations: The 2018 revision assigns physiological priming-site control to CK1delta/epsilon,
          whereas 2026 knockout and biochemical evidence found no phase-advance phenotype after deletion
          of CK1delta/epsilon or five other candidate kinases and instead identified MARK2 as physiologically
          significant at S662. The phosphoswitch competition remains informative, but its enzyme assignment
          should not be treated as settled human biology. The parameter reduction does not explicitly
          represent a heterozygous allele or human allele dosage.
        readouts:
        - name: Simulated PER2 degradation kinetics
          target: PER2 S662-Site Hypophosphorylation
          direction: ALTERED
          interpretation: The degradation plateau and subsequent loss of PER2 report competition between
            the stabilizing FASP route and the degradation route.
      selected_evidence:
        snippet: Here, we propose a phosphoswitch model, where two competing phosphorylation sites determine
          whether PER2 has a fast or slow degradation rate.
        supports: SUPPORT
    origin:
      assertion_path: /computational_models/1/modeled_mechanisms/0
      evidence_path: /computational_models/1/modeled_mechanisms/0/evidence/0
