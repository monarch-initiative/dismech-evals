        description: The integrated organism-level output - the entire circadian ensemble, pineal melatonin
          secretion, core body temperature nadir, and the circadian drive for sleep, is displaced several
          hours earlier than normal. In the original FASPS kindreds this amounted to roughly a 4-hour
          advance of the sleep, temperature, and melatonin rhythms. Crucially, the oscillation itself
          is intact and of normal amplitude; only its phase is shifted. This is why sleep architecture
          and duration remain normal, and why the disorder is one of timing rather than of sleep quality.
