      assertion_type: Pathophysiology
      assertion:
        name: Circadian Misalignment with Conventional Social Schedule
        conforms_to: circadian_phase_misalignment#Misalignment Between Endogenous Circadian Phase and
          the Imposed Sleep-Wake Schedule
        description: The clinically disabling step. An advanced clock is not intrinsically harmful; morbidity
          arises when biological night conflicts with the socially required schedule. Attempting to stay
          awake for evening obligations produces overwhelming evening sleepiness; attempting to remain
          asleep to a conventional wake time produces early-morning awakening experienced as terminal
          insomnia; and resisting the advanced schedule at both ends causes chronic sleep restriction.
          Distress or functional impairment arising from this misalignment - not the early timing per
          se - is what converts an advanced chronotype into advanced sleep-wake phase disorder.
        biological_scale: ORGANISM
        role: outcome
      selected_evidence:
        snippet: Negative health consequences have been identified when individuals do not sleep at their
          ideal circadian timing or are sleep deprived relative to intrinsic sleep need.
        supports: SUPPORT
