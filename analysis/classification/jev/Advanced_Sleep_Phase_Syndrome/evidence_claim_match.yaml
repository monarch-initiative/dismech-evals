            term:
              id: MONDO:0015609
              label: advanced sleep phase syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: asps_per3_validity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is PER3 a genuine advanced-sleep-phase gene, or is the reported P415A/H417R association
          confounded by the co-reported seasonal mood trait?
        attaches_to:
        - pathophysiology#PER3 Destabilization
        rationale: The original PER3 association used one kindred carrying a two-variant haplotype and
          bundled familial advanced sleep phase with elevated Beck Depression Inventory and seasonality
          scores. A 2024 Slovenian cohort found the same haplotype in one extreme-morning proband and
          the proband's father, providing limited replication but not broad segregation or objective DLMO
          confirmation. The functional data (destabilized PER3, failure to stabilize PER1/PER2) are real
          but do not by themselves establish which clinical trait is attributable to PER3. The entry therefore
          retains DISPUTED rather than CAUSATIVE status. No ClinGen gene-disease validity classification
          exists for any ASPS gene.
        proposed_experiments:
        - experiment_id: asps_exp_per3_replication
          name: Larger independent segregation series for PER3
          description: Identify additional unrelated kindreds with objective circadian-phase phenotyping
            and segregation of PER3 variants, ideally separating the two variants of the P415A/H417R haplotype
            to determine which (if either) drives the circadian phenotype.
        - experiment_id: asps_exp_per3_phase_vs_mood
          name: Phase-versus-mood phenotype separation in PER3 carriers
          description: Phenotype PER3 variant carriers with DLMO and actigraphy alongside structured mood
            and seasonality assessment, to determine whether phase advance occurs independently of the
            mood trait.
      selected_evidence:
        snippet: We identified two rare variants in the circadian clock gene PERIOD3 (PER3-P415A/H417R)
          in humans with familial advanced sleep phase accompanied by higher Beck Depression Inventory
          and seasonality scores.
        supports: SUPPORT
    origin:
