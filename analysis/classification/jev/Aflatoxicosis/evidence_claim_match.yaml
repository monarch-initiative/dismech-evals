      assertion_type: Pathophysiology
      assertion:
        name: Protein Synthesis Disruption and Oxidative Injury
        biological_scale: CELLULAR
        description: 'The cytotoxic arm that distinguishes acute aflatoxicosis from the chronic carcinogenic
          route. Adducted macromolecules disrupt protein synthesis, and DNA damage, oxidative stress and
          lipid peroxidation act alongside it. This node exists because it is the acute-specific mechanism:
          none of it is the TP53 mutagenesis that drives the chronic arm curated in Aflatoxin_Related_HCC.'
        biological_processes:
        - preferred_term: translation
          modifier: DECREASED
          term:
            id: GO:0006412
            label: translation
        - preferred_term: response to oxidative stress
          modifier: INCREASED
          term:
            id: GO:0006979
            label: response to oxidative stress
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Disruption of protein synthesis and immune suppression further contribute to disease
          severity, and impaired production of clotting factors leads to coagulopathy and bleeding risks
          (Benkerroum, 2020).
        supports: SUPPORT
        directness: DIRECT
