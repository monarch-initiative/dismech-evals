      assertion_type: Pathophysiology
      assertion:
        name: Macromolecular Adduct Formation
        biological_scale: MOLECULAR
        description: A small but fixed fraction of ingested aflatoxin binds irreversibly to protein and
          DNA. The albumin adduct is the measurable one and, because it is not repaired, it persists with
          the half-life of albumin itself — which is what makes it a usable exposure biomarker weeks after
          the meal.
      selected_evidence:
        snippet: From 1 to 3% of ingested aflatoxins irreversibly bind to proteins and DNA bases to form
          adducts such as aflatoxin B1-lysine in albumin (Skipper and Tannenbaum 1990).
        supports: SUPPORT
        directness: DIRECT
    origin:
