        context: []
      assertion_type: Biochemical
      assertion:
        name: Serum aflatoxin B1-lysine albumin adduct
        readouts:
        - target: Macromolecular Adduct Formation
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: 'The assay measures the adduct node directly: the analyte is the adduct. This
            is the join between the biomarker and the mechanism, and it is the reason exposure can be
            confirmed weeks after the contaminated meal.'
        - target: Acute Hepatic Failure
          relationship: PREDICTS
          direction: POSITIVE
          endpoint_context: PROGNOSTIC
          interpretation: 'Higher adduct concentration tracks with shorter survival after the onset of
            jaundice. Prognostic rather than a readout of the failure itself: the adduct records the dose
            received, not the state of the liver.'
        notes: The exposure biomarker for aflatoxicosis. Because the adduct is not repaired, its serum
          half-life approximates that of albumin itself — roughly 20-60 days — so it records exposure
          long after unbound aflatoxin has cleared, which happens within minutes to a couple of hours.
          In the Kenyan case-control study adduct concentration was associated with survival time from
          jaundice to death, making it prognostic as well as diagnostic.
      selected_evidence:
        snippet: Serum adduct concentrations were associated with time from jaundice to death [adjusted
          hazard ratio = 1.3; 95% confidence interval (CI), 1.04-1.6].
        supports: SUPPORT
        directness: DIRECT
