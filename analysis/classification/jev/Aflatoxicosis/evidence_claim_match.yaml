      - /disease_term
    evidence_metadata:
      reference: PMID:40252547
      reference_title: 'Incidence and mortality of acute aflatoxicosis: A systematic review.'
      evidence_source: HUMAN_CLINICAL
      explanation: Refutes attributing the 1991 series' neurological severity to aflatoxin alone, which
