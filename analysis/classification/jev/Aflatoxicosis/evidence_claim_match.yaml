      assertion_type: Discussion
      assertion:
        discussion_id: neurological_features_attribution
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Acute Hepatic Failure
        prompt: Does acute aflatoxicosis produce hepatic encephalopathy, or are the reported neurological
          features attributable to a co-intoxicant?
        rationale: 'Encephalopathy is a standard feature of fulminant hepatic failure of any cause, and
          it would be easy to import it here on that basis. The cited corpus does not support it. Not
          one of the five references uses the phrase "hepatic encephalopathy". The only neurological figures
          in the literature — fits in 85 percent and coma in 31 percent of cases — come from a single
          1991 series, and the systematic review that pools it says explicitly that that outbreak involved
          co-intoxication with boric acid and that its severity should be interpreted with caution. A
          phenotype was therefore not created: doing so would assert on a general clinical expectation
          what the sources actually contest. Resolving this needs neurological findings from an outbreak
          without a co-intoxicant.'
      selected_evidence:
        snippet: Mortality rates in the study of Tzee-Cheng et al. (1991) should be interpreted with caution,
          as co-intoxication with excessive levels of boric acid may have influenced the severity of the
          acute aflatoxicosis (Tzee‐Cheng et al., 1991).
        supports: REFUTE
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
