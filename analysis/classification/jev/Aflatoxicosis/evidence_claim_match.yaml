      assertion_type: Diagnosis
      assertion:
        name: Exclusion of viral hepatitis
        description: Aflatoxicosis is diagnosed against a case definition of acute jaundice of unknown
          origin, so serological exclusion of the hepatotropic viruses circulating locally is the step
          that gets there. In the 2004 Kenyan outbreak this is what redirected the investigation from
          an infectious to a toxic aetiology.
        diagnosis_term:
          preferred_term: serological exclusion of hepatotropic viral infection
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        results: Negative for yellow fever, Rift Valley fever, dengue, hepatitis A, B and C, West Nile
          virus, Chikungunya and Bunyamwera.
        notes: 'Hepatitis B surface antigen is the exception: it is not an exclusion here but a recorded
          risk factor, positive roughly ten times more often in cases than controls. Whether that reflects
          susceptibility or confounding is the open question in the hepatitis_b_role_in_acute_aflatoxicosis
          discussion.'
      selected_evidence:
        snippet: Seven patients had serum samples analyzed at the Kenya Medical Research Institute (KEMRI),
          and all were negative for viruses known to cause hepatic disease in Kenya (e.g., yellow fever;
          Rift Valley fever; dengue; acute hepatitis A, B, and C; West Nile virus; and Chikungunya and
          Bunyamwera) (American Public Health Association 2000).
        supports: SUPPORT
        directness: DIRECT
