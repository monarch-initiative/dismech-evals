      assertion_type: Pathophysiology
      assertion:
        name: Bruch Membrane Protein Homeostasis Gene Variation
        description: Variation in three genes whose products act on extracellular protein homeostasis
          at Bruch's membrane contributes to AMD susceptibility. Rare missense variants in FBLN5, a member
          of the fibulin gene family, were found only in AMD cases in a screen of five fibulin genes,
          and every carrier had cuticular drusen. CST3 encodes cystatin C, a cysteine proteinase inhibitor
          abundantly secreted by the retinal pigment epithelium and proposed to regulate protein turnover
          in Bruch's membrane; its AMD risk variant is secreted at reduced levels. TIMP3 is constitutively
          expressed by retinal pigment epithelium, resides in Bruch's membrane in healthy eyes where it
          regulates the membrane's thickness by inhibiting matrix metalloproteinases, and is implicated
          in AMD by rare coding variants. The node groups the three by the compartment they act in, and
          does not claim that they converge on one molecular step.
        biological_scale: MOLECULAR
        locations:
        - preferred_term: Bruch's membrane
          term:
            id: UBERON:0003957
            label: Bruch's membrane
        genes:
        - preferred_term: FBLN5
          term:
            id: hgnc:3602
            label: FBLN5
        - preferred_term: CST3
          term:
            id: hgnc:2475
            label: CST3
        - preferred_term: TIMP3
          term:
            id: hgnc:11822
            label: TIMP3
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: Cystatin C, a potent cysteine proteinase inhibitor, is abundantly secreted by the RPE
          and may contribute to regulating protein turnover in the Bruch's membrane (BrM).
        supports: SUPPORT
    origin:
