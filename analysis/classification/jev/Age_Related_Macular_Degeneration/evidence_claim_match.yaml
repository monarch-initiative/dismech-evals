        association: 'TLR4 rs4986790 (Asp299Gly) and rs4986791 (Thr399Ile) have been tested repeatedly
          against AMD risk, and are the variants behind the OMIM and MONDO "age related macular degeneration
          10" designation. Two meta-analyses of overlapping study sets disagree: one reports rs4986790
          as associated under recessive and overdominant models, the other finds that no TLR4 association
          survives correction for multiple testing. They do not disagree about the effect itself. Both
          report a nominal recessive-model odds ratio of 0.73 for rs4986790, and the dispute is only over
          whether that survives correction.'
        relationship_type: DISPUTED
        variant_origin: GERMLINE
        notes: MONDO:0012674 (age related macular degeneration 10) is a child of age-related macular degeneration
          and carries "TLR4 age-related macular degeneration" as an exact synonym generated by MONDO's
          disease_series_by_gene design pattern; it records no causal-gene edge, so it is not in the reconciliation
          checklist for this job. This entry declines it as an AMD subtype and does not wire TLR4 into
          the pathograph.
      selected_evidence:
        snippet: we found associations under the genotypic model of TLR4 c.896A>G ... although after Bonferroni
          correction (P'-value<0.02) none of these associations remained significant.
        supports: REFUTE
