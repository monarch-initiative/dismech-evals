            term:
              id: MONDO:0005150
              label: age-related macular degeneration
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Early to intermediate extracellular-deposit stage
        notes: Outer-retinal extracellular deposits and macular drusen characterize early disease and
          predict progression, but drusen are not asserted as a universally causal lesion because advanced
          AMD can occur without them.
      selected_evidence:
        snippet: Drusen are one of the most characteristic pathologies of precursor lesion of age-related
          macular degeneration (AMD). Drusen comprise a yellowish white substance that accumulates typically
          under the retinal pigment epithelium (RPE), and their constituents are lipids, complement, amyloid,
          crystallin, and others. In the past, many researchers have focused on drusen and tried to elucidate
          the pathophysiology of AMD because they believed that disease progression from early AMD to
          advanced AMD might be based on drusen or drusen might cause AMD. In fact, it is well established
          that drusen are the hallmark of precursor lesion of AMD and a major risk factor for AMD progression
          mainly based on their size and number. However, the existence of advanced AMD without drusen
          has long been recognized. For example, polypoidal choroidal vasculopathy (PCV), which comprises
          the majority of AMD cases in Asians, often lacks drusen. Thus, there is the possibility that
          drusen might be no more than a biomarker of AMD and not a cause of AMD.
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38731137
      reference_title: Drusen in AMD from the Perspective of Cholesterol Metabolism and Hypoxic Response.
      evidence_source: OTHER
      explanation: Describes sub-RPE drusen, their precursor-stage and progression-risk associations,
        and advanced AMD without drusen, preserving uncertainty about causality.
