        association: The CST3 p.Ala25Thr variant, in the cysteine proteinase inhibitor cystatin C, is
          associated with exudative AMD with a recessive effect. Cystatin C is abundantly secreted by
          the retinal pigment epithelium and has been proposed to regulate protein turnover in Bruch's
          membrane, and the risk variant shows reduced secretion from retinal pigment epithelium, which
          is the mechanistic link this entry wires.
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        notes: This is a candidate-gene association with a replication, not a genome-wide significant
          locus. The combined recessive estimate rests on 350 newly genotyped exudative AMD cases plus
          one previously published association study, so the effect size should be read as provisional.
      selected_evidence:
        snippet: Bringing together our data with the previously reported AMD-CST3 association study, the
          evidence of a recessive effect on AMD risk is strengthened (OR = 1.89, P = 0.005).
        supports: SUPPORT
