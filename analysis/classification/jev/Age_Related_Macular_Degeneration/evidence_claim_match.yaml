      assertion_type: Pathophysiology
      assertion:
        name: Complement-Pathway Genetic Susceptibility
        description: Common variation at CFH and in other complement-pathway genes, including C3 and CFB,
          alters susceptibility to AMD. CFB is not modeled as uniformly risk-increasing because human
          haplotype studies identify both risk and protective complement-region haplotypes.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CFH
          term:
            id: hgnc:4883
            label: CFH
        - preferred_term: C3
          term:
            id: hgnc:1318
            label: C3
        - preferred_term: CFB
          term:
            id: hgnc:1037
            label: CFB
        biological_processes:
        - preferred_term: complement activation
          term:
            id: GO:0006956
            label: complement activation
      selected_evidence:
        snippet: The common genetic variants linked to AMD are found on chromosome 1q32 (in the complement
          factor H gene) and 10q26 (age-related maculopathy susceptibility 2 and high-temperature requirement
          A serine peptidase 1 genes) loci, along with several other risk variants.
        supports: SUPPORT
