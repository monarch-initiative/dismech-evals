        association: Very rare coding variants in TIMP3 were among the rare-variant signals taken as evidence
          of a causal role in a genome-wide association study of 16,144 AMD patients and 17,832 controls.
          TIMP3 is constitutively expressed by retinal pigment epithelium and resides in Bruch's membrane
          in healthy eyes, where it limits matrix metalloproteinase activity and so regulates the thickness
          of that membrane.
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        notes: TIMP3's Mendelian disease is Sorsby fundus dystrophy, which the cited review describes
          as an autosomal dominant macular dystrophy with onset around the fourth to sixth decade. It
          has no entry in this knowledge base. The record here rests on the AMD rare-variant burden result,
          not on the Sorsby literature; the Sorsby review is cited only for where the TIMP3 protein sits
          and what it does, which is what justifies binding the gene to the Bruch's membrane node.
      selected_evidence:
        snippet: Very rare coding variants (frequency <0.1%) in CFH, CFI and TIMP3 suggest causal roles
          for these genes, as does a splice variant in SLC16A8.
