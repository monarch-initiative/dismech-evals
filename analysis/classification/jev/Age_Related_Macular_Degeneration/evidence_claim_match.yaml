            description: The exudative neovascular form, characterized by macular neovascularization with
              subretinal and/or intraretinal exudation and potentially rapid visual decline.
          role: subtype
      assertion_type: ImagingFinding
      assertion:
        name: Macular neovascularization with intraretinal thickening and subretinal exudation on OCT
        modality: OCT
        imaging_finding_term:
          preferred_term: Macular neovascularization with intraretinal thickening and subretinal exudation
        description: OCT can show a focal macular neovascular lesion with overlying intraretinal thickening
          and/or subretinal exudation, supporting diagnosis of wet AMD.
        located_in:
          preferred_term: macula lutea
          term:
            id: UBERON:0000053
            label: macula lutea
        spatial_extent: FOCAL
        phenotype_term:
          preferred_term: Choroidal neovascularization
          term:
            id: HP:0011506
            label: Choroidal neovascularization
        diagnostic: true
        subtype: Wet AMD
      selected_evidence:
        snippet: Neovascularization of the macula, a common complication of many chorioretinal diseases
          such as neovascular age-related macular degeneration, polypoidal choroidal vasculopathy, and
          pathologic myopia, results from increased synthesis of vascular endothelial growth factor (VEGF)
          by the retinal pigment epithelium and/or Müller cells because of localized ischemia and inflammation.
          The Consensus on Neovascular AMD Nomenclature (CONAN) study group acknowledged that these vessels
          may originate from either the choriocapillaris or the retinal microvasculature, prompting them
          to propose the term 'macular neovascularization' (MNV) to include intraretinal, subretinal,
          and sub-pigment epithelial neovascularization localized to the macula. MNV frequently appears
          as a grey-green macular lesion with overlying intraretinal thickening and/or subretinal exudation,
          causing metamorphopsia, reduced central vision, relative central scotoma, decreased reading
          speed, and problems with color recognition. Multimodal imaging with optical coherence tomography
          (OCT), OCT angiography, dye-based angiographies, fundus autofluorescence, and multiwavelength
          photography help establish the diagnosis and aid in selecting an appropriate treatment.
        supports: SUPPORT
