  4d0ce0afbf29213b45b2b61096a110dc9870981c80be5f5cb33ec7dd8701a452:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Heterogeneous measured trajectories
        notes: In 1,271 MAPT participants, four assessed domains followed five model-derived patterns
          over four years. A separate Taiwan analysis identified four different groups from repeated adapted
          domain measures in 1,782 selected survivors through the trajectory period, followed for later
          outcomes. These are cohort-specific statistical groups, not a universal sequence or causal disease
          subtypes. The Taiwanese sensory, appetite and several other measures were self-reported; appetite
          loss alone is not a general diagnosis of malnutrition.
      selected_evidence:
        snippet: 'We identified four subtypes of IC decline: robust with mild decline (n=902), hearing
          loss with cognitive decline (n=197), physio-cognitive decline (PCD) with depression (n=373),
          and severe IC decline (n=310).'
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/1
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:38029399
      reference_title: 'Multi-Trajectories of Intrinsic Capacity Decline and Their Impact on Age-Related
        Outcomes: A 20-Year National Longitudinal Cohort Study.'
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: The Taiwan study used 1996–2007 trajectories and subsequent four- and eight-year outcome
        follow-up. Its grouping differs from MAPT and does not establish a common molecular cause.
