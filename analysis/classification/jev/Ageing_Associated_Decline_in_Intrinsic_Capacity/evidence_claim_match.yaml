      assertion_type: Biochemical
      assertion:
        name: DNA methylation estimate of intrinsic capacity
        presence: Research score associated with measured IC and later mortality
        context: Elastic-net model using 91 CpG sites in 933 INSPIRE-T participants; external mortality
          associations evaluated in 1,680 Framingham Heart Study participants.
        notes: Tenfold cross-validation correlated 0.61 with measured IC, but participants with IC below
          0.55 were excluded, limiting application to severe impairment. The external cohort tested mortality
          associations rather than calibration against the same measured IC score. The score is not a
          validated diagnostic threshold, rate of decline, intervention-response surrogate, or evidence
          that changing methylation restores capacity. Immune-cell estimates and pathway enrichment remain
          associative.
      selected_evidence:
        snippet: We built the predictive model using elastic net regression and tenfold cross-validation
        supports: SUPPORT
