    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: Treatment
      assertion:
        name: Integrated Multidomain Care in Multimorbid Older Adults
        action_category: THERAPEUTIC
        therapeutic_modality: BEHAVIORAL
        description: An ancillary TIGER randomized-trial analysis in 398 community-dwelling adults aged
          65 or older with at least three chronic conditions found greater improvement in measured IC
          during a 12-month integrated multidomain program than usual care, mainly in locomotion and cognition.
          Biomarker changes were associated with IC changes but do not establish mediation or efficacy
          of an isolated component.
        treatment_term:
          preferred_term: integrated multidomain lifestyle intervention
          term:
            id: NCIT:C15900
            label: Lifestyle Therapy
      selected_evidence:
        snippet: The intervention arm had greater improvement in IC than the usual care arm (overall difference
          1.5; 95% CI 0.5-2.5; P = .005)
        supports: SUPPORT
