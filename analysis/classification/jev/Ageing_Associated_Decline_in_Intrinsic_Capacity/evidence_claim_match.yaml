  cdae12f8ea4b6aea9e975d2b244ccbfadf29bf75211c8a993ec798f2da8fa013:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: Treatment
      assertion:
        name: Multicomponent Physical Activity with Nutritional Counselling
        action_category: THERAPEUTIC
        therapeutic_modality: BEHAVIORAL
        description: SPRINTT tested moderate-intensity physical activity with technological support and
          nutritional counselling in 1519 community-dwelling adults aged 70 or older with physical frailty
          and sarcopenia. In the prespecified SPPB 3–7 group (1205 participants), first mobility disability/death
          was reduced (HR 0.78, 95% CI 0.67–0.92); persistent mobility disability was not significantly
          reduced. The exploratory SPPB 8–9 group did not show benefit on the primary outcome. Strength
          and lean-mass benefits were sex-specific, and falls were more frequent in the lower-function
          intervention group. Exercise should be individualized and supervised where needed; component-specific
          effects cannot be separated.
        treatment_term:
          preferred_term: multicomponent physical activity and nutrition programme
          term:
            id: NCIT:C15900
            label: Lifestyle Therapy
      selected_evidence:
        snippet: The between group difference in SPPB score was 0.8 points (95% confidence interval 0.5
          to 1.1 points; P<0.001) and 1.0 point (95% confidence interval 0.5 to 1.6 points; P<0.001) in
          favour of the multicomponent intervention at 24 and 36 months, respectively.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/1
      context_paths:
      - /name
