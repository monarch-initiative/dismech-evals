        name: Hearing Intervention with Hearing Aid Provision
        action_category: THERAPEUTIC
        therapeutic_modality: DEVICE
        description: Audiological assessment, hearing-aid fitting, communication strategies and follow-up
          can improve audibility and communication. In ACHIEVE (977 adults aged 70–84), hearing intervention
          did not reduce three-year global cognitive decline overall. A prespecified recruitment-source
          analysis found less decline in the higher-risk ARIC subgroup, but not in healthier newly recruited
          volunteers; incident cognitive impairment was not significantly reduced. Hearing aids compensate
          for impairment and do not reverse its underlying cause.
        treatment_term:
          preferred_term: hearing device fitting and audiological rehabilitation
          term:
            id: NCIT:C15315
            label: Rehabilitation
          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: hearing aid
              term:
                id: NCIT:C183182
                label: Hearing Aid
      selected_evidence:
        snippet: The hearing intervention did not reduce 3-year cognitive decline in the primary analysis
          of the total cohort.
        supports: SUPPORT
