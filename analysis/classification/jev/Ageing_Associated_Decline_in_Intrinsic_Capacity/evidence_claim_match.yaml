  5a7442c2fac6543d50c5d78825c1ffa9d83e10febd79e535c62df297fa61cc8d:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context:
        - path: /definitions/3
          value:
            name: WHO ICOPE Step 1 screening for decline in intrinsic capacity
            definition_type: PHENOTYPE_ALGORITHM
            derivation_basis: ESTABLISHED_CRITERIA
            description: The original ICOPE Step 1 instrument uses brief questions and tests for cognition,
              mobility, nutrition, vision, hearing and depressive symptoms. A positive result prompts
              domain-specific assessment. The second-edition handbook expands Step 1 into basic assessment
              and community-level interventions, also considering urinary incontinence, social support
              and carers. Vision/hearing testing can require equipment; the instrument is not an equipment-free
              case definition.
            scope: Community-dwelling and primary-care populations aged 60 years and older. Not a diagnostic
              replacement for organ-specific assessment of any single domain.
          role: ancestor
      assertion_type: AlgorithmValidationStatus
      assertion:
        status: VALIDATED_AGAINST_GOLD_STANDARD
        rationale: Published studies evaluated versions of the original screen against operational domain
          reference assessments. INSPIRE-T reported variable sensitivity across domains. The Toledo study
          evaluated an adapted instrument and found no added prognostic information from its composite
          over individual domains in that cohort. These results do not validate every adaptation or establish
          a universal diagnostic threshold, and do not constitute validation of the expanded second-edition
          pathway.
      selected_evidence:
        snippet: High specificity (>70%) was observed for all the IC domains, except for vision (2.7%).
        supports: SUPPORT
    origin:
