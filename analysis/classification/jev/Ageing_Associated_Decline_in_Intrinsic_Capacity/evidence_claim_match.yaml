  57b8fbd07e29e86b81faee50f6588b729314ac2d0f740cbae5c450ef0ba49d43:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: Definition
      assertion:
        name: WHO working definition of vitality capacity
        definition_type: OTHER
        derivation_basis: ESTABLISHED_CRITERIA
        description: The WHO expert group proposed a working definition of vitality capacity as a physiological
          state arising from interactions among energy/metabolism, neuromuscular function and immune/stress
          responses. It is a conceptual framework for measurement development; its proposed position beneath
          other domains is not an established causal ordering in patients.
        scope: Working definition of the vitality domain; not a diagnostic cutoff or demonstrated intervention-mediated
          pathway.
      selected_evidence:
        snippet: vitality capacity is a physiological state (due to normal or accelerated biological ageing
          processes) resulting from the interaction between multiple physiological systems, reflected
          in (the level of) energy and metabolism, neuromuscular function, and immune and stress response
          functions of the body.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/2
      evidence_path: /definitions/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:36356628
      reference_title: WHO working definition of vitality capacity for healthy longevity monitoring.
      evidence_source: OTHER
      explanation: The expert group proposed this working definition and candidate attributes; the statement
        does not establish a causal pathway from ageing hallmarks to clinical IC.
      quote_role: REVIEW_SYNTHESIS
