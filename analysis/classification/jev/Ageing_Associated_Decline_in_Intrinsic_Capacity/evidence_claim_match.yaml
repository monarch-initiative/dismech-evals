        prompt: Does treating pain improve intrinsic capacity?
        attaches_to:
        - pathophysiology#Psychological Capacity Decline
        - pathophysiology#Locomotor Capacity Decline
        rationale: A cross-sectional INSPIRE-T study of 971 adults aged 20–102 associated pain during
          the previous eight days with lower IC. It did not establish chronic pain, direction of causation,
          inflammatory-clock moderation or an effect of pain treatment. This clinical association is not
          classified as a proven external environmental cause of ageing-associated IC decline.
      selected_evidence:
