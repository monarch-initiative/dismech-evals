  c59d0fd1bb692bc9057bdc86d22a0f1d4649abaf69ef3e1a965e24662f61f739:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_icope_screening_tool_structure
        kind: CONTROVERSY
        status: OPEN
        prompt: Which IC instruments are suitable for triage, repeated measurement and prediction in each
          population?
        attaches_to:
        - definitions#WHO ICOPE Step 1 screening for decline in intrinsic capacity
        rationale: The original ICOPE screen, its local adaptations, factor-derived research scores and
          the expanded second-edition basic assessment serve different purposes. INSPIRE-T reported vision
          sensitivity 97.2% but specificity 2.7%, with sensitivity 42.0–69.6% for the other evaluated
          domains. The adapted Toledo composite added no statistically significant prognostic information
          over its domains in that sample. Hong Kong validation data also contain denominator and diagnostic-table
          inconsistencies. These findings require population- and instrument-specific interpretation,
          not a universal endorsement or rejection of all IC measurement.
      selected_evidence:
        snippet: High specificity (>70%) was observed for all the IC domains, except for vision (2.7%).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:38676323
      reference_title: 'Predictive Capacity of the Integrated Care for Older People Screening Tool for
        Intrinsic Capacity Impairments: Results From the INSPIRE-T Cohort.'
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: The low vision specificity is necessary context for its high sensitivity.
