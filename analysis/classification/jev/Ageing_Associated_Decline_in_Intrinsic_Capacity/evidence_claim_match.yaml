  91a327308c5afefff40f497624fc2b205fa6f5b373425f8bab1d38578183a367:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Association with later functional limitation and mortality
        notes: Lower baseline IC predicts later functional difficulty in several cohorts, but an association
          does not establish the effect of changing the score. In ELSA, participants with baseline ADL/IADL
          difficulty were excluded; both IC and multimorbidity predicted incident ADL loss, while only
          IC independently predicted IADL loss. In 10/66, baseline latent status, rather than within-person
          change itself, predicted outcomes; the highest-impairment group had adjusted mortality HR 1.89
          (95% CI 1.63–2.19) relative to high IC, compared with unadjusted HR 4.60. Neither analysis establishes
          universal superiority over frailty measures or inevitable care dependence.
      selected_evidence:
        snippet: Both intrinsic capacity score and multimorbidity independently predicted incident loss
          of ADLs, however only intrinsic capacity independently predicted incident loss of IADLs.
        supports: SUPPORT
    origin:
      assertion_path: /progression/2
      evidence_path: /progression/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:31678933
      reference_title: The structure and predictive value of intrinsic capacity in a longitudinal study
        of ageing.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: The ELSA analysis used baseline capacity and later self-reported functional difficulty;
