        name: Five-domain operational model of intrinsic capacity
        definition_type: OTHER
        derivation_basis: ESTABLISHED_CRITERIA
        description: The conceptual model comprises locomotion, vitality, cognition, psychological and
          sensory capacity. A general factor and five subfactors were recovered in one ELSA analysis,
          but operational measures and composite construction differ across studies. ICOPE assesses hearing
          and vision separately in practice.
