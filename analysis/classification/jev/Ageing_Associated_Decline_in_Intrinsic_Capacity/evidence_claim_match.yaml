  e0816c2f41152868f7887dd14271cb4f5f24d8e7912093b118c2b73d1616c8c6:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: Genetic
      assertion:
        name: Polygenic background of intrinsic capacity
        relationship_type: SUSCEPTIBILITY
        association: Common genetic variation is associated with variation in measured intrinsic capacity.
          Cohort-specific SNP-based heritability estimates were 25.2% in UK Biobank and 19.5% in CLSA.
        notes: The GWAS analyzed 57,716 participants, including middle-aged adults, from predominantly
          European-ancestry cohorts. It studied separately derived cross-sectional IC composites, not
          the rate of longitudinal decline. Loci were near PTP4A2, PRPF3, LCORL, RN7SL89P, ANAPC10, HK1,
          DLEU1, MAPT, SCN4A and STAU1; positional/eQTL/chromatin gene mapping does not identify proven
          causal genes. None of 88 nominal pathway enrichments survived multiple-testing correction. The
          polygenic score explained 0.3% of IC variation. APOE and FOXO3 are not lead findings of this
          study, and no gene-specific clinical testing indication is established.
      selected_evidence:
        snippet: The h2snp for IC was estimated at 25.2% in UKB and 19.5% in CLSA. Our GWAS identified
          38 independent SNPs for IC across 10 genomic loci and 4289 candidate SNPs, mapped to 197 genes.
        supports: SUPPORT
