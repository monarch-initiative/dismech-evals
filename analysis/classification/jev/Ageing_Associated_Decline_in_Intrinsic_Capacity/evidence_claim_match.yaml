        prompt: Should a MONDO term be requested for this ICD-11-anchored clinical construct?
        attaches_to:
        - disease#Ageing Associated Decline in Intrinsic Capacity
        rationale: This entry retains its ICD-11 Foundation mapping without substituting a MONDO term
          for frailty or sarcopenia. Any future MONDO request should address the distinction between a
          functional-capacity construct and an aetiological disease and should be checked against the
          then-current ontology. The unresolved mapping is not evidence that related concepts are equivalent.
      selected_evidence:
        snippet: IC should not be seen as the mere opposite of frailty.
