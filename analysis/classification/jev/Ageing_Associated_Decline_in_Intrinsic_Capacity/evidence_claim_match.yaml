        name: Combined Exercise and Cognitive Stimulation Therapy
        action_category: THERAPEUTIC
        therapeutic_modality: BEHAVIORAL
        description: A Singapore pre/post study compared exercise, exercise plus cognitive stimulation,
          and a control group from another clinic. Allocation was not randomized, participants and assessors
          were unblinded, and analyses included 187 participants completing baseline and three-month assessments.
          A four-domain IC composite improved in the intervention groups; cognition improved at three
          months in the combined group. Baseline differences, clinic selection and varying vitality definitions
          limit causal interpretation; hearing and vision were not measured.
        treatment_term:
          preferred_term: combined exercise and cognitive stimulation programme
          term:
            id: NCIT:C15900
            label: Lifestyle Therapy
      selected_evidence:
        snippet: Participants and outcome assessors were not blinded and there was no concealment.
        supports: SUPPORT
