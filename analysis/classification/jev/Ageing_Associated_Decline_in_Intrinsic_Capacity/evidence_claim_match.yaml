  451e8dfa3a4fd954d0336cc7fd597b3ebfb0ee87d7cf48816d435736fbb5d228:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: Definition
      assertion:
        name: WHO ICOPE Step 1 screening for decline in intrinsic capacity
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        description: The original ICOPE Step 1 instrument uses brief questions and tests for cognition,
          mobility, nutrition, vision, hearing and depressive symptoms. A positive result prompts domain-specific
          assessment. The second-edition handbook expands Step 1 into basic assessment and community-level
          interventions, also considering urinary incontinence, social support and carers. Vision/hearing
          testing can require equipment; the instrument is not an equipment-free case definition.
        scope: Community-dwelling and primary-care populations aged 60 years and older. Not a diagnostic
          replacement for organ-specific assessment of any single domain.
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: Published studies evaluated versions of the original screen against operational domain
            reference assessments. INSPIRE-T reported variable sensitivity across domains. The Toledo
            study evaluated an adapted instrument and found no added prognostic information from its composite
            over individual domains in that cohort. These results do not validate every adaptation or
            establish a universal diagnostic threshold, and do not constitute validation of the expanded
            second-edition pathway.
      selected_evidence:
        snippet: Individuals aged ≥60 years were screened (step 1) by health-care providers or through
          self-assessments using digital tools (the ICOPE MONITOR app and the ICOPEBOT conversational
          robot).
        supports: SUPPORT
    origin:
      assertion_path: /definitions/3
      evidence_path: /definitions/3/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:36098317
      reference_title: 'Implementation of the WHO integrated care for older people (ICOPE) programme in
        clinical practice: a prospective study.'
      evidence_source: HUMAN_CLINICAL
      explanation: Describes how the Step 1 screen is actually applied at scale, in the 10 903-person
        Occitania implementation that this definition is drawn from.
      quote_role: PRIMARY_RESULT
