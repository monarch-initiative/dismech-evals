      assertion_type: ProgressionInfo
      assertion:
        phase: Transitions between capacity states
        notes: The 10/66 analysis used two-wave latent transition models in 14,923 adults aged 65 years
          and older from selected catchments in seven countries. Some model-estimated improvement occurred,
          but movement to high IC was not observed over the studied interval. This does not prove biological
          irreversibility. The abstract and main Discussion conflict about whether 61% worsened or remained
          stable, so the disputed overall proportions are not used here.
      selected_evidence:
        snippet: The latent statuses consider the quantity and quality of the domains affected.
        supports: SUPPORT
