        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Birth-cohort differences in capacity
        notes: Analyses of 14,710 ELSA and 11,411 CHARLS participants aged 60 years and older found higher
          entry levels and less steep average IC declines in more recent birth cohorts. These population
          averages do not imply a uniformly downward individual trajectory, identify a treatment effect,
          or generalize to other countries and future cohorts. CHARLS had shorter follow-up and its domain
          measurement invariance was incomplete; sex-specific scores were not directly comparable.
      selected_evidence:
        snippet: we found that more recent cohorts entered older ages with higher levels of capacity,
          while subsequent age-related declines were somewhat compressed compared to earlier cohorts.
        supports: SUPPORT
