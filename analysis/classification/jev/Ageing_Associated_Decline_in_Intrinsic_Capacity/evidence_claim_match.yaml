  36242af9a6812811f8cd530e5089779a27a0852bc0cb4f3ad6d3650cc9448e0a:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: Definition
      assertion:
        name: WHO definition of intrinsic capacity
        definition_type: OTHER
        derivation_basis: ESTABLISHED_CRITERIA
        description: Intrinsic capacity is the composite of all the physical and mental capacities an
          individual can draw on. With the environment and the interaction between the two, it determines
          functional ability, which is what the WHO healthy-ageing model treats as the object of care
          rather than the presence or absence of disease.
        scope: Defines the construct whose decline this entry models; it is not a diagnostic threshold
          and does not by itself identify an affected individual.
      selected_evidence:
        snippet: 'The report is built around a redefinition of healthy ageing that centres on the notion
          of functional ability: the combination of the intrinsic capacity of the individual, relevant
          environmental characteristics, and the interactions between the individual and these characteristics.'
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:26520231
      reference_title: 'The World report on ageing and health: a policy framework for healthy ageing.'
      evidence_source: OTHER
      explanation: States the WHO model in which intrinsic capacity is one of the two determinants of
        functional ability. Evidence source is OTHER because this is a policy framework paper rather than
        a study.
      quote_role: REVIEW_SYNTHESIS
