      assertion_type: Treatment
      assertion:
        name: Group-Based Multidomain Intervention with Brain-Structure Outcomes
        action_category: THERAPEUTIC
        therapeutic_modality: BEHAVIORAL
        description: 'ENHANCE randomized 102 Taiwanese community-dwelling adults to twice-weekly exercise,
          cognitive training and nutrition education or quarterly telephone education. Analyses were explicitly
          per-protocol: 88 completed functional follow-up and a smaller MRI subset was analyzed. Adjusted
          imaging analyses found less left inferior temporal grey-matter volume loss, with different regional
          results between urban and rural subgroups. Age/BMI imbalance, attrition, inconsistent MRI denominators
          in the report and the small sample limit interpretation. MRI volume changes do not establish
          a cellular mechanism or dementia prevention.'
        treatment_term:
          preferred_term: group-based multidomain lifestyle intervention
          term:
            id: NCIT:C15900
            label: Lifestyle Therapy
      selected_evidence:
        snippet: All analyses followed a per‐protocol approach rather than intention‐to‐treat, as the
          study's focus on neuroanatomical changes required complete longitudinal data for meaningful
          interpretation.
        supports: SUPPORT
