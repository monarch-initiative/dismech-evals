        name: Multidomain Lifestyle Intervention for Cognitive Decline
        action_category: THERAPEUTIC
        therapeutic_modality: BEHAVIORAL
        description: FINGER randomized 1,260 adults aged 60–77 at increased dementia risk to two years
          of diet, exercise, cognitive training and vascular-risk monitoring or general advice. Modified
          intention-to-treat analysis showed a small benefit in neuropsychological test performance (between-group
          annual change 0.022 z-score units, 95% CI 0.002–0.042). This was not a demonstrated reduction
          in incident dementia. Adverse events were more common in the intervention group, principally
          musculoskeletal pain.
