  6287df8f72c8086665cf7638822fba474909febc0a20d44473517e3b284406a2:
    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: Diagnosis
      assertion:
        name: WHO ICOPE Basic and In-Depth Assessment
        description: Use brief domain questions/tests as the first assessment, followed by locally validated
          confirmatory measures for affected domains. In-depth assessment also reviews diseases, medication,
          the person’s goals, and social and physical environments. Examples include cognitive testing,
          nutritional assessment, SPPB and vision/hearing assessment; instruments and cutoffs require
          local adaptation. No single composite cutoff defines all affected people.
