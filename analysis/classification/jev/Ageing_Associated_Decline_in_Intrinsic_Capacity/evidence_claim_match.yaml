    claim:
      about:
        disease:
          name: Ageing Associated Decline in Intrinsic Capacity
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Four-performance-criterion frailty model in aged mice
        species: Mouse
        genotype: Naturally aged C57BL/6 mice
        publication: PMID:24336799
        description: The Liu study assessed weakness, walking performance, activity and endurance in 27-
          to 28-month-old mice. Each criterion used a cutoff 1.5 standard deviations below the cohort
          mean; three low criteria defined frailty and two mild frailty. This is a performance-based frailty
          classification, not a 31-deficit index.
        notes: The small initial cohort and cohort-relative cutoffs limit transportability. The source
          does not validate a five-domain human IC equivalent or measure cognitive, psychological and
          sensory capacity.
        modeled_mechanisms:
        - target: Locomotor Capacity Decline
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Captures selected physical performance limitations that overlap with locomotor
            capacity.
          limitations: Frailty classification rather than an IC-specific mechanism or five-domain instrument.
          readouts:
          - name: Inverted-cling, rotarod, wheel-running and derived endurance performance
            target: Locomotor Capacity Decline
            direction: DECREASED
            interpretation: Low performance on multiple cohort-relative criteria identifies physical frailty
              in this model.
      selected_evidence:
        snippet: The criteria in mice were evaluated by the inverted-cling grip test, rotarod test, voluntary
          wheel running, and derived endurance scores.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
