      assertion:
        name: Clinical deficit-accumulation frailty index in mice
        species: Mouse
        publication: PMID:28463656
        description: The reviewed Whitehead clinical mouse frailty index scores 31 observations across
          integumentary, musculoskeletal, auditory, ocular and other systems, together with body weight
          and temperature. It measures accumulated deficits and should not be conflated with the Liu performance
          criteria.
        notes: Observer characteristics, testing conditions and strain-specific deficits can influence
          scoring. Sensory observations are included, but comprehensive cognition and the human psychological
          IC domain are not established by this tool. The source evaluates frailty, not validation of
          the WHO IC composite.
      selected_evidence:
        snippet: It assesses 31 different deficits across a range of domains including the in tegument,
          musculoskeletal system, vestibulocochlear/auditory systems, ocular and nasa l systems, digestive
          system, urogenital system, respiratory system, signs of discomfort, as well as the body weight,
          and body surface temperature.
        supports: SUPPORT
        directness: INDIRECT
