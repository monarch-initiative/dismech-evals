        hypothesis_label: Multihit NK-Cell Neoplasia Model
        status: EMERGING
        description: Recurrent JAK-STAT, RAS-MAPK, DDX3X, TP53/checkpoint, and epigenetic-regulator alterations
          co-occur and are implicated in malignant NK-cell survival and expansion. No single recurrent
          pathway is sufficient to explain the fulminant phenotype.
      selected_evidence:
        snippet: This suggests that deregulated JAK-STAT signaling alone is unlikely to explain the aggressive
          course of ANKL
        supports: SUPPORT
