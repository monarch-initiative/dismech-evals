          the full descendant set of HP:0011337 "Abnormality of mouth size", whose only children are HP:0000154
          "Wide mouth" and HP:0000160 "Narrow mouth"). No HPO term denotes absence of the mouth. HP:0000160
          "Narrow mouth" is already used for the Microstomia phenotype in this entry and asserts a small
          aperture rather than its absence, so it is deliberately NOT reused here: no term beats a bad
          one. This phenotype stays preferred-term-only pending an HPO new-term request.'
      selected_evidence:
        snippet: The condition is characterized by hypoplasia or the absence of the mandible (micrognathia/agnathia),
