      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: agotc_smad_tgfb_bmp_network
        hypothesis_label: Agnathia-otocephaly is the severe pole of a phenotypic spectrum caused by lesions
          in the interacting SMAD/TGFB/BMP/SHH/FGF developmental network
        status: EMERGING
        description: A single fetus with severe agnathia-otocephaly carried a de novo SMAD3 missense variant
          with demonstrated reduction of SMAD3 mRNA. SMAD3 transduces TGF-beta and BMP signals that pattern
          pharyngeal-arch-derived craniofacial structures, and the reporting authors proposed that the
          complex may represent the severe end of a spectrum related to this interacting signalling network.
          The proposal rests on one observation and has not been independently replicated, so the SMAD3
          node and its causal edge are grouped here as an emerging rather than established mechanism,
          distinct from the canonical PRRX1/OTX2 arch-patterning arm.
      selected_evidence:
        snippet: Agnathia-otocephaly with or without associated anomalies may represent the severe end
          of a phenotypic spectrum related to variants in genes in the interacting SMAD/TGFB/BMP/SHH/FGF
          developmental pathways.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
