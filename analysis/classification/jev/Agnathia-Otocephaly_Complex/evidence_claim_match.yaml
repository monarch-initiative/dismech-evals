      assertion_type: Genetic
      assertion:
        name: OTX2
        gene_term:
          preferred_term: OTX2
          term:
            id: hgnc:8522
            label: OTX2
        relationship_type: CAUSATIVE
        notes: OTX2 (orthodenticle homeobox 2), a known microphthalmia/anophthalmia locus, is the second
          established causal gene. OTX2 variants (point mutations and deletions) show incomplete penetrance
          and striking intrafamilial variability, and OTX2 mutations alone may not be sufficient — a second
          genetic hit is proposed. OTX2 accounted for 7 of the ~32 genetically tested patients in the
          2021 review. Lesions span frameshift and missense point mutations, small in-frame and out-of-frame
          deletions, and contiguous deletions of the whole locus detectable only by array-CGH.
        case_fractions:
        - population: Pooled cohort plus 1998-2019 literature review of genetically tested AOC patients
          case_fraction_percent: 21.9
          cohort_size: 32
          notes: '7 of 32 genetically tested patients carried an OTX2 lesion: 6 of the 22 literature patients
            plus 1 further array-CGH-detected deletion in the authors'' own 10-patient cohort. Together
            with the 4 PRRX1 patients this gives the reported 11 of 32 (34%).'
      selected_evidence:
        snippet: Identification of OTX2 involvement in otocephaly/dysgnathia in humans, even if loss of
          function mutations at this locus does not sufficiently explain the complex anatomical defects
          of these patients, suggests the requirement for a second genetic hit.
        supports: SUPPORT
