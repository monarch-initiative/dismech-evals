          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: DECREASED
        - preferred_term: BMP signaling pathway
          term:
            id: GO:0030509
            label: BMP signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: The results showed a significant decrease of SMAD3 mRNA (Figure 1f) up to 44% in kidney
          and 20% in liver tissue, confirming that the SMAD3 variant affects the expression of mRNA.
        supports: SUPPORT
