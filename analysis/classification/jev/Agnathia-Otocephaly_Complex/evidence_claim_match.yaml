      assertion_type: DifferentialDiagnosis
      assertion:
        name: Amniotic-band or teratogenic craniofacial disruption
        description: A non-genetic disruption mechanism (amniotic band constriction, or an identified
          teratogenic exposure) can produce a craniofacial phenotype overlapping agnathia-otocephaly complex.
          The craniofacial amniotic-band literature itself argues the dysmorphology is not explained by
          disruption alone and is most likely multifactorial, so this changes recurrence-risk counselling
          relative to a Mendelian first-arch defect without asserting a clean disruption-vs-malformation
          dichotomy.
        distinguishing_features:
        - Constriction rings, limb-reduction defects, or a documented teratogenic exposure, rather than
          an isolated PRRX1/OTX2-driven first-arch field defect
        - Sporadic occurrence, consistent with a disruption/teratogenic rather than Mendelian mechanism
        - Craniofacial amniotic band sequence is itself multifactorial rather than pure mechanical disruption,
          so overlap with this complex is a spectrum rather than a bright line
        disease_term:
          preferred_term: Amniotic band syndrome
          term:
            id: MONDO:0015167
            label: amniotic band syndrome
      selected_evidence:
        snippet: Major craniofacial anomalies in patients with ABS is a rare clinical finding that cannot
          be completely explained on the basis of premature amniotic layer disruption alone.
        supports: SUPPORT
