        description: A de novo SMAD3 missense variant with demonstrated reduction in SMAD3 mRNA was identified
          in a fetus with severe agnathia-otocephaly. SMAD3 transduces TGF-beta and BMP signals that pattern
          pharyngeal-arch-derived craniofacial structures, placing agnathia-otocephaly at the severe end
          of a spectrum of phenotypes caused by lesions in the interacting SMAD/TGFB/BMP/SHH/FGF developmental
          network. This is a single-family observation and is modelled as an emerging, not established,
          mechanism.
        biological_scale: MOLECULAR
        role: trigger
        genes:
        - preferred_term: SMAD3
          term:
            id: hgnc:6769
            label: SMAD3
        biological_processes:
