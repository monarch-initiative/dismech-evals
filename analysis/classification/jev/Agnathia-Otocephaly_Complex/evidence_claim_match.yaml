      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: An autosomal recessive pattern (the classic OMIM:202650 designation) rests on limited
          biallelic PRRX1 and consanguineous reports; the literature cautions that a consanguineous case
          does not make the disorder generally recessive. Most cases overall are sporadic. In at least
          one apparently recessive pedigree the true mechanism proved to be paternal germline mosaicism
          rather than autosomal recessive transmission, so recurrence-risk counselling requires care.
      selected_evidence:
        snippet: Agnathia-otocephaly is a rare craniofacial malformation complex that is caused by de
          novo heterozygous and biallelic mutations in PRRX1 in two unrelated babies, respectively.
        supports: SUPPORT
