              id: MONDO:0008740
              label: agnathia-otocephaly complex
        context: []
      assertion_type: Genetic
      assertion:
        name: PRRX1
        gene_term:
          preferred_term: PRRX1
          term:
            id: hgnc:9142
            label: PRRX1
        relationship_type: CAUSATIVE
        notes: PRRX1 (paired related homeobox 1) is one of the two established causal genes. Reported
          variants include frameshift and other loss-of-function alleles; a biallelic form has been reported
          in an affected infant. PRRX1 mutations were identified in 4 of the ~32 genetically tested patients
          compiled in the 2021 review. A recurrent frameshift arising by DNA replication slippage in a
          poly-A tract was transmitted through paternal germline mosaicism in one family; only frameshift
          lesions, not in-frame duplications of the same tract, abolish function in cell-based assays.
          PRRX1 is also implicated in a much milder, incompletely penetrant craniosynostosis phenotype.
        case_fractions:
        - population: Pooled cohort plus 1998-2019 literature review of genetically tested AOC patients
          case_fraction_percent: 12.5
          cohort_size: 32
          notes: 4 of 32 genetically tested patients carried a PRRX1 lesion; combined with the OTX2 patients
            this gives the reported 11 of 32 (34%) of tested patients with a molecular diagnosis.
      selected_evidence:
        snippet: Mutations in the orthodenticle homeobox 2 (OTX2) and paired related homeobox 1 (PRRX1)
          genes have recently been identified in some cases.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
