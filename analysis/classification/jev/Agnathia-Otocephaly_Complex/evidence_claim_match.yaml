        prompt: Do CNBP mutations cause agnathia-otocephaly in humans, given that Cnbp heterozygous mice
          recapitulate the phenotype but human CNBP screening has been negative?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#First-Arch Neural Crest Patterning Failure
        rationale: Cnbp heterozygous mice reproduce the mandibular and eye defects of agnathia-otocephaly,
          making CNBP a strong candidate, yet Sanger screening of human cases found no CNBP variants.
          Whether this reflects true absence of human involvement or a species-specific compensatory effect
          is unresolved — the model shows the phenotype while the human translational validity is the
          open question.
      selected_evidence:
        snippet: Heterozygous mutations in Cnbp in mice are responsible for mandibular and eye defects
          mimicking the agnathia-otocephaly complex in humans and appear as a good candidate.
        supports: SUPPORT
