              label: agnathia-otocephaly complex
        context: []
      assertion_type: Treatment
      assertion:
        name: Airway management (including EXIT-to-airway)
        description: 'In the exceptional, anatomically feasible case where active neonatal intervention
          is chosen, a secured airway is the pivotal intervention: an EXIT (ex utero intrapartum treatment)-to-airway
          procedure or immediate surgical airway (tracheostomy) at delivery, planned by a multidisciplinary
          difficult-airway team. Evidence is limited to individual case reports rather than response-rate
          studies. EXIT delivers the fetus on placental support so that a surgical airway can be established
          before the umbilical circulation is interrupted; the indication must be weighed carefully, because
          EXIT is invasive and coexisting pulmonary hypoplasia can still be fatal after a technically
          successful tracheostomy.'
        treatment_term:
          preferred_term: airway management (EXIT-to-airway)
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        therapeutic_modality: SURGERY
        notes: Reported experience is limited to individual EXIT/surgical-airway case reports without
          a citable quantitative response rate, so no outcome statistic is asserted; the attached evidence
          establishes the indication and its documented limits rather than efficacy. This entry is the
          umbrella delivery-planning strategy; the mechanism link to the airway-obstruction node is carried
          by the specific `Perinatal tracheostomy` treatment rather than duplicated here.
      selected_evidence:
        snippet: The evaluation methods of lung maturation are inconsistent, and the indication of the
          invasive EXIT procedure must be carefully considered.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/1
      context_paths:
