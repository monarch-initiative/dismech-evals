            term:
              id: MONDO:0003709
              label: agoraphobia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GLRB Glycine Receptor Variation
        description: Non-coding variants in GLRB, encoding the glycine receptor beta subunit, are associated
          with agoraphobic cognitions at genome-wide significance in a dimensional phenotype based on
          the Agoraphobia Cognition Questionnaire, and replicate against dichotomous and categorical agoraphobia
          phenotypes. The same gene carries rare coding mutations causing hyperekplexia, a neurological
          startle disorder with agoraphobic behavior.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: We followed up on this finding in a larger dimensional ACQ sample (N=2547) and in independent
          samples with a dichotomous AG phenotype based on the Symptoms Checklist (SCL-90; N=3845) and
          a case-control sample with the categorical phenotype PD/AG (Ncombined =1012) obtaining highly
          significant P-values also for GLRB single-nucleotide variants rs17035816 (P=3.8 × 10-4) and
          rs7688285 (P=7.6 × 10-5).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28167838
      reference_title: 'GLRB allelic variation associated with agoraphobic cognitions, increased startle
        response and fear network activation: a potential neurogenetic pathway to panic disorder.'
      evidence_source: HUMAN_CLINICAL
      explanation: Replication across dimensional, dichotomous and categorical agoraphobia phenotypes
