      explanation: 'Multicenter retrospective JAK1/2 inhibitor study (12 treated vs 20 untreated) shows
        that IFN blockade improves immunological and dermatological features but neurological benefit
        is limited and heterogeneous. This limited/heterogeneous response is compatible with an IFN-independent
        CNS injury component, but the retrospective, non-randomized design cannot distinguish that from
        prenatal or irreversible injury, treatment timing, or incomplete CNS target engagement by the
        drug. The authors themselves conclude the results "suggest that the pathogenetic complexity of
        AGS goes beyond the JAK-STAT pathway."

