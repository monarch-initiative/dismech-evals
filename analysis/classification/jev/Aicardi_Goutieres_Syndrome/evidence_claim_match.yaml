  fe89ba55048839a2bb4488bdb858b362b3f47fe4e077917ca1f1a085698f4ea1:
    claim:
      about:
        disease:
          name: Aicardi-Goutieres Syndrome
          disease_term:
            preferred_term: Aicardi-Goutieres syndrome
            term:
              id: MONDO:0018866
              label: Aicardi-Goutieres syndrome
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: autoinflammatory syndrome
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 7 "Autoinflammatory
          disorders", section 1 "Type 1 Interferonopathies". IUIS lists the AGS series as seven separate
          rows keyed by gene: AGS1 (TREX1), AGS2 (RNASEH2B), AGS3 (RNASEH2C), AGS4 (RNASEH2A), AGS5 (SAMHD1),
          AGS6 (ADAR1) and AGS7 (IFIH1). This entry lumps the series and carries subtypes AGS1 through
          AGS9, so it covers the seven IUIS rows plus the later LSM11/RNU7-1 genotypes, which the 2022
          table records as separate interferonopathy rows rather than as AGS numbers. The AGS1 row is
          damaged in the cached text extraction, where the inheritance column value "AR" fuses onto the
          gene symbol as "ARTREX1", so the AGS3 row is quoted instead.'
      selected_evidence:
        snippet: RNASEH2C deficiency, AGS3 RNASEH2C AR 610330 Not assessed Not assessed Classical AGS
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
      evidence_path: /classifications/iuis_category/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /classifications
    evidence_metadata:
      reference: PMID:35748970
      reference_title: 'Human Inborn Errors of Immunity: 2022 Update on the Classification from the International
        Union of Immunological Societies Expert Committee.'
      evidence_source: OTHER
      explanation: An IUIS Table 7 type I interferonopathy row for the AGS series, naming the numbered
        subtype AGS3, its RNASEH2C genetic defect, autosomal recessive inheritance, OMIM 610330 and the
        "Classical AGS" associated feature.
