      reference: PMID:39254994
      reference_title: cGAS activation in classical dendritic cells causes autoimmunity in TREX1-deficient
        mice.
      evidence_source: MODEL_ORGANISM
      explanation: 'Cell-type-conditional cGAS deletion on the Trex1-/- background rescues lethality,
        T-cell activation, tissue inflammation, antinuclear antibodies, and interferon-stimulated gene
        induction when cGAS is removed from classical (conventional) dendritic cells, but not when it
        is removed from macrophages. This localizes the disease-driving DNA-sensing compartment of the
        TREX1 arm to cDCs. Scope: the experiment is in the Trex1-/- mouse only; the equivalent cell-type
        requirement has not been tested in human AGS tissue, nor in the RNA-sensing (ADAR/IFIH1) or histone-processing
        genotypes.

        '
