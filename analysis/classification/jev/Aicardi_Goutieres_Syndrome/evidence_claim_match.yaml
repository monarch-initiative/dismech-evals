            term:
              id: MONDO:0018866
              label: Aicardi-Goutieres syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SAMHD1-dependent replication fork processing defect
        description: 'Besides its dNTP triphosphohydrolase activity, SAMHD1 promotes MRE11-dependent degradation
          of nascent DNA at stalled replication forks. When SAMHD1 is depleted in human cell lines, single-stranded
          DNA fragments escape from stalled forks into the cytosol and activate cGAS-STING. This is a
          candidate proximal source of the immunostimulatory self-DNA in SAMHD1-related AGS (AGS5). The
          evidence comes from human cell lines rather than patient tissue or an AGS animal model, and
          which SAMHD1 activity (dNTPase versus fork processing) dominates in patients is unresolved —
          see the linked knowledge-gap discussion.

          '
        biological_processes:
        - preferred_term: replication fork processing
          term:
            id: GO:0031297
            label: replication fork processing
          modifier: ABNORMAL
      selected_evidence:
        snippet: In SAMHD1-depleted cells, single-stranded DNA fragments are released from stalled forks
          and accumulate in the cytosol, where they activate the cGAS-STING pathway to induce expression
          of pro-inflammatory type I interferons.
        supports: SUPPORT
    origin:
