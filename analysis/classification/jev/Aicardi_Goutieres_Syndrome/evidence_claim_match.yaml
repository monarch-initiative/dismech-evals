      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ags_endogenous_nucleic_acid_interferon_model
        hypothesis_label: Endogenous Nucleic Acid and Type I Interferon Model
        status: CANONICAL
        description: 'AGS-causing variants perturb enzymes and sensors that normally clear, edit, process,
          or recognize nucleic acids and histone-associated chromatin. The resulting self nucleic-acid
          or chromatin stress activates innate immune pathways, including cGAS-STING in histone-processing
          subtypes, causing chronic type I interferon signaling and multi-organ inflammatory injury.

          '
        notes: 'Retained as CANONICAL. The 2026 openscientist hypothesis-search report (kb/hypotheses/Aicardi_Goutieres_Syndrome/ags_endogenous_nucleic_acid_interferon_model)
          found the canonical IFN-centric mechanism strongly supported by definitive genetic epistasis
          (cGAS knockout fully rescues Trex1-/- lethal autoimmunity; MDA5 deletion rescues ADAR1 Zα-mutant
          encephalopathy), pharmacological STING inhibition, near-universal IFN biomarker positivity,
          and IFIH1 gain-of-function evidence. Four qualifications, each scoped to the study that supports
          it, refine the model: (1) in a complete `Rnaseh2b`-null mouse neural-progenitor model, cerebellar
          defects are rescued by p53 but not by cGAS deletion — establishing a p53/DNA-damage-driven injury
          arm in that model, not that p53 signaling is the primary route across hypomorphic human RNASEH2
          AGS; (2) a 2013 case-control cohort found that 7 of 26 RNASEH2B-mutant participants (27%) had
          a negative *peripheral-blood* interferon-stimulated-gene score — the six-gene ISG score was
          derived from whole blood only, and the study did not test pathway dependence in nervous tissue,
          so this is a blood-biomarker finding, not evidence of IFN-independent disease in the nervous
          system; separately, a distinct small case series later reported clinically asymptomatic individuals
          biallelic for RNase H2 complex gene variants, showing that biallelic loss-of-function alone
          is not fully penetrant; (3) a retrospective 12-treated/20-untreated JAK1/2-inhibitor comparison
          found immunological and dermatological improvement but limited, heterogeneous neurological benefit
          — compatible with an IFN-independent CNS injury component, but equally compatible with prenatal
          or irreversible injury, treatment timing, or incomplete CNS target engagement, which the study
          design cannot distinguish; (4) ADAR1 Zα-mutant encephalopathy is fully reversed by blocking
          type I IFN, while PKR or ZBP1 deletion alone is insufficient, confirming type I IFN itself (not
          individual dsRNA effectors) is the central mediator in the RNA-sensing arm.'
      selected_evidence:
        snippet: cGAS-stimulator of interferon genes (STING) pathway in patient-derived
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
