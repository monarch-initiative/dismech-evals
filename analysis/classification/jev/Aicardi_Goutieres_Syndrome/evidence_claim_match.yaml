      assertion_type: Pathophysiology
      assertion:
        name: Endogenous nucleic acid-driven innate immune activation
        conforms_to: cgas_sting_pathway_activation#Cytosolic DNA Accumulation and cGAS-Dependent cGAMP
          Synthesis
        notes: 'Conformance to the cGAS-STING module covers the DNA-sensing genotypes only: TREX1, RNASEH2A/B/C,
          SAMHD1 and the LSM11/RNU7-1 histone-processing cases, where undegraded or misprocessed self
          DNA and chromatin engage cGAS. The IFIH1 gain-of-function and ADAR loss-of-function genotypes
          reach the same interferon output through MDA5-dependent RNA sensing and do not run through that
          module; the shared interferon signature does not distinguish them.'
        description: 'Failure to clear, edit, or correctly process endogenous nucleic acids and chromatin
          causes innate immune receptors to activate antiviral inflammatory programs. In histone-processing
          AGS, patient-derived cells show enhanced cGAS-STING signaling; in canonical AGS, self nucleic
          acids are inferred to drive a type I interferon response. Conditional-knockout work in the Trex1-/-
          mouse localizes the disease-driving cGAS activation to classical (conventional) dendritic cells
          rather than macrophages.

          '
        cell_types:
        - preferred_term: classical dendritic cell
          term:
