  34cd49feeabb48827d0b07adbda81f8e253b5f340c0415039fe3ddd344f168e0:
    claim:
      about:
        disease:
          name: Aicardi-Goutieres Syndrome
          disease_term:
            preferred_term: Aicardi-Goutieres syndrome
            term:
              id: MONDO:0018866
              label: Aicardi-Goutieres syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ags_samhd1_dominant_function
        prompt: Which SAMHD1 activity — dNTP triphosphohydrolase function or MRE11-dependent processing
          of stalled replication forks — supplies the immunostimulatory self-DNA that drives interferon
          signaling in SAMHD1-related Aicardi-Goutieres syndrome?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#SAMHD1-dependent replication fork processing defect
        - pathophysiology#Endogenous nucleic acid-driven innate immune activation
        rationale: SAMHD1 was characterized first as a dNTPase and only later as a factor acting at stalled
          replication forks. The fork-processing route to cytosolic single-stranded DNA is demonstrated
          in SAMHD1-depleted human cell lines, not in patient tissue or in an animal model that develops
          AGS-like disease, and no study separates the two activities with function-selective SAMHD1 alleles
          in such a system. Until that is done, the proximal self-DNA species in SAMHD1-related AGS is
          unidentified, and treatments aimed at the DNA-sensing arm cannot be matched to a defined substrate
          for this genotype.
        proposed_experiments:
        - experiment_id: exp_ags_samhd1_separation_of_function_alleles
          name: Separation-of-function SAMHD1 alleles in a disease-relevant model
          description: Introduce SAMHD1 alleles that selectively abolish dNTPase activity or selectively
            abolish MRE11-dependent nascent-strand processing into patient-derived neural and myeloid
            cells and into an in vivo model, then measure cytosolic DNA species, interferon-stimulated
            gene induction, and neuroinflammatory phenotype for each allele.
          would_support:
          - pathophysiology#SAMHD1-dependent replication fork processing defect
          supporting_outcome:
          - The fork-processing-dead allele reproduces cytosolic single-stranded DNA accumulation and
            interferon induction while the dNTPase-dead allele does not.
          refuting_outcome:
          - Only the dNTPase-dead allele induces interferon signaling, or neither allele separates the
            phenotypes, indicating that fork-derived DNA is not the driving substrate in this genotype.
      selected_evidence:
        snippet: The mechanism by which SAMHD1 protects against cancer and chronic inflammation is unknown.
        supports: SUPPORT
    origin:
