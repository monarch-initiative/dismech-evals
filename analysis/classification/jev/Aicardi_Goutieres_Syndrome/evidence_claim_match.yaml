    evidence_metadata:
      reference: PMID:30566866
      reference_title: The Cyclopeptide Astin C Specifically Inhibits the Innate Immune CDN Sensor STING.
      evidence_source: MODEL_ORGANISM
      explanation: 'A STING-specific small-molecule inhibitor attenuates autoinflammation in the Trex1-/-
        mouse, giving the "pharmacological STING inhibition" limb of this hypothesis a citation. Scope:
        this is preclinical target validation in the TREX1 model. The openscientist report grouped this
        result with seven further STING-directed agents as a "pharmacological convergence" that independently
        validates the axis, but those agents act through heterogeneous mechanisms (direct binding, trafficking
        blockade, multicomponent herbal formulations) and are not equivalent replications; none has been
        tested for efficacy in human AGS.

        '
