    evidence_metadata:
      reference: PMID:29670289
      reference_title: SAMHD1 acts at stalled replication forks to prevent interferon induction.
      evidence_source: IN_VITRO
      explanation: 'The primary study shows in human cell lines that loss of SAMHD1 releases single-stranded
        DNA from stalled replication forks into the cytosol, where it activates cGAS-STING and induces
        type I interferon. This supplies a specific proximal self-DNA species for the SAMHD1 genotype,
        as an in vitro mechanism rather than a demonstrated patient neuropathology.

        '
