      assertion_type: Diagnosis
      assertion:
        name: Clinical Triad and Modified Diagnostic Criteria
        description: 'Aicardi syndrome is diagnosed clinically rather than by a definitive molecular test.
          The classic triad is agenesis of the corpus callosum, chorioretinal lacunae, and infantile spasms;
          modified criteria support the diagnosis when two classic features are present with at least
          two other major or supporting findings. Important major/supporting findings include cortical
          malformations, periventricular or subcortical heterotopia, intracranial cysts, optic nerve anomalies,
          vertebral or rib abnormalities, microphthalmia, split-brain EEG pattern, and cerebral asymmetry.

          '
        diagnosis_term:
          preferred_term: clinical assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: Modified diagnostic criteria include either presence of the classic triad or the presence
          of two of the classic triad plus at least two other major or supporting features.
        supports: SUPPORT
