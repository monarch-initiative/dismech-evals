      assertion:
        name: EEG and Genetic Differential Assessment
        description: 'EEG helps characterize infantile spasms, atypical hypsarrhythmia, and the split-brain
          pattern caused by corpus callosum agenesis. Genetic testing is useful mainly to exclude alternative
          diagnoses because no causative Aicardi syndrome gene has been identified. Clinicians should
          distinguish Aicardi syndrome from Aicardi-Goutieres syndrome, an unrelated interferonopathy
          with intracranial calcification and inflammatory features rather than chorioretinal lacunae
          with callosal agenesis.

          '
        diagnosis_term:
          preferred_term: electroencephalography
          term:
            id: NCIT:C38054
            label: Electroencephalography
      selected_evidence:
        snippet: Electroencephalograms (EEG) are often abnormal with asynchrony between the two hemispheres,
          burst-suppression, and atypical hypsarrhythmia
