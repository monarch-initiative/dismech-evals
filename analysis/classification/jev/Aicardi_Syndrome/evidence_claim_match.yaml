      assertion_type: Genetic
      assertion:
        name: Unknown X-linked Gene
        notes: 'The specific causative gene remains unidentified despite decades of research. The disorder
          is believed to result from a de novo mutation in an X-linked gene, supported by exclusive female
          presentation and non-random X-inactivation patterns. A locus at Xp22.3 has been suggested but
          not confirmed. Recent genomic studies suggest genetic heterogeneity with autosomal candidates
          including KMT2B, SLF1, SMARCB1, SZT2, and WNT8B.

          '
      selected_evidence:
        snippet: Our findings suggest that AIC is genetically heterogeneous with implicated genes converging
          on molecular pathways central to cortical development.
        supports: SUPPORT
