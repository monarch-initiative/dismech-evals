  6166774468df2f56da94f6167984f107e47b9cdc7734c5360429c2bc263e871b:
    claim:
      about:
        disease:
          name: Aicardi Syndrome
          disease_term:
            preferred_term: Aicardi syndrome
            term:
              id: MONDO:0010568
              label: Aicardi syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cortical Migration Abnormalities
        description: 'Widespread neuronal migration defects including polymicrogyria (predominantly frontal
          and perisylvian), periventricular and subcortical heterotopia, and intracranial cysts. These
          likely result from partial cortical necrosis during development rather than a primary migratory
          disturbance.

          '
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: Radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        biological_processes:
        - preferred_term: Neuron migration
          term:
            id: GO:0001764
            label: neuron migration
          modifier: ABNORMAL
        notes: 'These malformations are modeled as developmental outcomes associated with Aicardi syndrome.
          The causal molecular pathway leading to the cortical migration phenotype has not been established.

          '
      selected_evidence:
        snippet: The neuropathological examination of the brain of a 4-month-old girl with Aicardi syndrome
          (infantile spasms, chorioretinal lacunae, psychomotor retardation, agenesis of the corpus callosum
          and vertebral anomalies) showed agenesis of the corpus callosum, agenesis of the anterior commissure
          and abnormal orientation of the hippocampal formation, in addition to periventricular cerebral
          nodules and extensive non-laminated cortical polymicrogyria of the fronto-parietal regions and
          gyrus cinguli of both hemispheres.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
