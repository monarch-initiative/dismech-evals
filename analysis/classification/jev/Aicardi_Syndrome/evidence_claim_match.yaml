      assertion_type: Pathophysiology
      assertion:
        name: Chorioretinal Lacunae Formation
        description: 'Pathognomonic chorioretinal lacunae are depigmented, well-circumscribed lesions
          of the retinal pigment epithelium and choroid. These lesions result from thinning of the choroid
          and sclera with degeneration of overlying photoreceptor cells. They are bilateral, clustered
          around the optic nerve head and posterior pole, and remain stable over time.

          '
        cell_types:
        - preferred_term: Retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        biological_processes:
        - preferred_term: Retinal pigment epithelium development
          term:
            id: GO:0003406
            label: retinal pigment epithelium development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Aicardi syndrome is characterized by agenesis of the corpus callosum, chorioretinal lacunae,
          and infantile spasms. The authors describe the case of a girl with chorioretinal lacunae, seizures,
          and cerebral cyst, but a normal corpus callosum. Incomplete forms of Aicardi syndrome are reported
          in the literature, but typical choroidal lacunae are always present and are pathognomonic.
        supports: SUPPORT
