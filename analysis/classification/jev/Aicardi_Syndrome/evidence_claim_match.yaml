        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Genetic Heterogeneity and Cortical Development Disruption
        description: 'Although the causal gene remains unidentified, recent genomic analyses have identified
          rare de novo variants in KMT2B, SLF1, SMARCB1, SZT2, and WNT8B in a small subset of clinically
          diagnosed individuals. These variants are candidate findings rather than established recurrent
          causes, but they converge on molecular pathways central to cortical development. Earlier candidate
          genes TEAD1 and OCEL1 were not confirmed in an independent cohort of 38 patients. Non-random
          X-inactivation in 33% of patients supports the longstanding X-linked hypothesis, while the absence
          of a recurrent X-linked gene in sequencing studies leaves autosomal or mosaic mechanisms with
          sex-limited expression unresolved.

          '
        biological_processes:
        - preferred_term: Cerebral cortex development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Our findings suggest that AIC is genetically heterogeneous with implicated genes converging
          on molecular pathways central to cortical development.
        supports: SUPPORT
