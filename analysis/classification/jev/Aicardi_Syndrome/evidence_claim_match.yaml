      assertion_type: Pathophysiology
      assertion:
        name: Corpus Callosum Developmental Agenesis
        description: 'Complete or partial absence of the corpus callosum, the major white matter tract
          connecting the two cerebral hemispheres. Complete agenesis is found in approximately 72% of
          affected individuals. This disrupts interhemispheric communication and manifests as a characteristic
          split-brain pattern on EEG, contributing to seizure intractability and neurodevelopmental impairment.

          '
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Corpus callosum morphogenesis
          term:
            id: GO:0021540
            label: corpus callosum morphogenesis
          modifier: DECREASED
        notes: 'The molecular event upstream of callosal agenesis remains unresolved; this node represents
          an observed developmental structural consequence rather than a proven primary molecular mechanism.

          '
      selected_evidence:
        snippet: Aicardi syndrome (AS) is characterized by a triad of callosal agenesis, infantile spasms
          and chorioretinal 'lacunae'.
        supports: SUPPORT
