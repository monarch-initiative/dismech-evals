        hypothesis_label: Mechanical-Inflammatory Wound-Repair Model
        status: ALTERNATIVE
        description: Histopathologic observations support a candidate mechanical-inflammatory wound-repair
          process involving hyperkeratosis, chronic dermatitis, fibroblast-rich repair, and lymphocytic
          inflammation. These findings do not establish whether inflammation and repair initiate the band
          or arise secondarily after chronic constriction.
