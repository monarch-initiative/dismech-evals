      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: progressive_constriction_model
        hypothesis_label: Progressive Constriction Model
        status: CANONICAL
        description: This descriptive natural-history model links a plantar fifth-toe groove or fissure
          to circumferential constriction, distal enlargement, progressive soft-tissue and phalangeal
          destruction, and eventual autoamputation. It describes the observed sequence without assigning
          an established initiating molecular cause.
      selected_evidence:
        snippet: Eventually, the groove extends to encircle the toe, the underlying structures are absorbed
          and the toe autoamputates.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17924881
      reference_title: 'An unusual cause of ulceration: ainhum (dactylolysis spontanea).'
      evidence_source: HUMAN_CLINICAL
      explanation: The case report and clinical review state the characteristic sequence from encircling
        groove through tissue absorption to autoamputation.
