      assertion_type: DifferentialDiagnosis
      assertion:
        name: Pseudo-Ainhum
        description: Pseudo-ainhum is an ainhum-like annular digital constriction secondary to an identifiable
          hereditary or acquired condition. The visible ring can closely resemble true ainhum, but causal
          history, associated systemic or cutaneous findings, congenital onset, or a foreign-body tourniquet
          favors the secondary diagnosis.
        distinguishing_features:
        - An identifiable precipitating factor or underlying disorder.
        - Congenital onset, non-classic distribution, or syndromic skin findings.
        - Management must address the underlying cause as well as the constriction.
      selected_evidence:
        snippet: Pseudoainhum is a similar condition that occurs as a secondary event resulting from certain
          hereditary and nonhereditary diseases that lead to annular constriction of digits.
        supports: SUPPORT
