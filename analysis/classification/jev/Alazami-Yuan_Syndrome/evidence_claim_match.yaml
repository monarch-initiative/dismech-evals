          whether this reflects residual TAF6 function, allele position (histone fold versus C-terminal
          HEAT domain), or ascertainment.

          '
      selected_evidence:
        snippet: We report a 6-year-old boy with genetically confirmed TAF6-related Alazami-Yuan syndrome,
          severe developmental impairment, complete atrioventricular block requiring permanent epicardial
          VVIR pacing, and syndromic DRE refractory to multiple antiseizure medications (ASMs).
        supports: SUPPORT
