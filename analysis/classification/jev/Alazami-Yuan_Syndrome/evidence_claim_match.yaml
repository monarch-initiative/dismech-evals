              label: Alazami-Yuan syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cornelia de Lange syndrome
        description: 'Classic CdLS shares the arched eyebrows, synophrys, long eyelashes, hypertrichosis,
          growth restriction and intellectual disability, and several AYS individuals carried a clinical
          CdLS diagnosis before molecular testing. No AYS individual has met the clinical score for classic
          CdLS.

          '
        distinguishing_features:
        - Prominent nasal bridge and low hairline in AYS, versus a short nose with concave nasal ridge
          in CdLS
        - Absence in AYS of oligodactyly, other hand anomalies and congenital diaphragmatic hernia
        - Autosomal recessive TAF6 variants rather than cohesin-pathway variants (NIPBL, SMC1A, SMC3,
          RAD21, HDAC8)
      selected_evidence:
        snippet: In contrast, no individuals with AYS had a short nose with a concave nasal ridge, hand
          anomalies, or congenital diaphragmatic hernia that are more specific features of CdLS.
        supports: SUPPORT
