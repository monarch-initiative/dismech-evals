          value:
            name: Disrupted TAF6 Binding to TFIID Subunits
            role: intermediate
            biological_scale: MOLECULAR
            description: 'In Drosophila S2 cells depleted of endogenous TAF6, human TAF6 N-terminal fragments
              carrying p.Arg46Cys or p.Ile71Thr co-precipitate less of the TFIID subunits TAF1, TAF4,
              TAF9 and TBP. p.Ile71Thr reduces binding to all four; p.Arg46Cys reduces it moderately;
              both lose binding to TBP. The assay uses a truncated human fragment in insect cells and
              has not been repeated in patient cells, and the frameshift alleles found in later probands
              have not been tested.

              '
            protein_complexes:
            - preferred_term: TFIID complex
              term:
                id: GO:0005669
                label: transcription factor TFIID complex
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired TFIID-Dependent Transcription Initiation
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'TAF6 stabilizes the core promoter-recognition TFIID complex, so reduced TAF6 binding
          to its partners is proposed to destabilize TFIID. Complex stability and promoter function were
          not measured, so this step rests on TAF6''s known normal role.

          '
      selected_evidence:
        snippet: The compact tri lobed architecture is stabilized by a topologically closed Taf5-Taf6
          tetramer.
