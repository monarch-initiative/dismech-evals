      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tafopathy_transcriptomopathy
        hypothesis_label: Global transcriptional disturbance from TFIID destabilization drives the CdLS-like
          phenotype
        status: EMERGING
        description: 'The founding report proposed that CdLS and the clinically related syndromes form
          a class of "transcriptomopathies", in which a disturbance of the transcription machinery rather
          than of cohesin per se produces the shared phenotype, and placed TAF6 in that class through
          its role in TFIID. The edges from impaired TFIID-dependent transcription to individual phenotypes
          belong to this group. No patient-derived transcriptome, TFIID assembly assay, or animal model
          of the human alleles has been reported, and how a ubiquitous general transcription factor defect
          yields tissue-restricted features is unexplained.

          '
      selected_evidence:
        snippet: As the cohesin may participate in the same pathway as the genes involved in transcriptional
          regulation, the identification of deleterious mutations in TAF6 strongly supports the hypothesis
          that defects of genes involved in the transcription machinery, such as complexes with function
          of chromatin structure remodeling and transcriptional regulation, may result in a spectrum of
          disorders resembling CdLS.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
