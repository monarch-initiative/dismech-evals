  3650f0846f78b4689c1dab73f041d43ab3700fb186bf19b4237e9d2ca292d173:
    claim:
      about:
        disease:
          name: Alazami-Yuan Syndrome
          disease_term:
            preferred_term: Alazami-Yuan syndrome
            term:
              id: MONDO:0014931
              label: Alazami-Yuan syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: TAF6
        gene_term:
          preferred_term: TAF6
          term:
            id: hgnc:11540
            label: TAF6
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'TAF6 maps to 7q22.1 and encodes a histone H4-like TFIID subunit. The p.Ile71Thr allele
          recurs: homozygous in the Saudi family and in a Turkish proband, and in trans with c.1863dup
          in the seventh reported individual. Variant descriptions follow NM_005641; the seventh-case
          report also gives NM_001190415.1 coordinates (c.323T>C, c.1974dup) for the same alleles. The
          c.76A>T p.(Met26Leu) allele was classified as of uncertain significance by its reporters. No
          ClinGen gene-disease validity assertion for TAF6 was found in the committed caches.

          '
        variants:
        - name: TAF6 c.136C>T p.(Arg46Cys)
          description: 'Homozygous histone-fold missense variant in a Turkish proband (CdLS-4) born to
            consanguineous parents; reduces TAF6 binding to TFIID subunits in co-immunoprecipitation.

            '
        - name: TAF6 c.212T>C p.(Ile71Thr)
          description: 'Recurrent histone-fold missense variant, homozygous in three affected Saudi siblings
            and in a Turkish proband, and compound heterozygous with c.1863dup in the seventh reported
            individual.

            '
        - name: TAF6 c.1863dup p.(Thr622HisfsTer?)
          description: 'Last-exon duplication predicted to replace the final 56 codons with an extended
            reading frame. Blood RNA showed no reduction in transcript level, so the allele is not thought
            to trigger nonsense-mediated decay.

            '
        - name: TAF6 c.1052delT p.(Ile351ThrfsTer40)
          description: 'Maternally inherited frameshift in trans with paternal c.76A>T p.(Met26Leu) in
            a Chinese boy with normal intelligence.

            '
        - name: TAF6 c.610_611delGC p.(Ala204fs)
          description: 'Homozygous exon 7 frameshift in a Jordanian boy with severe developmental delay,
            drug-resistant epilepsy and complete heart block; an older brother with similar features died
            in adolescence untested.

            '
      selected_evidence:
        snippet: Alazami‐Yuan syndrome (AYS) is an autosomal recessive Cornelia de Lange‐like syndrome
          caused by loss of function variants in TAF6.
        supports: SUPPORT
