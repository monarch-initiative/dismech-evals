        role: intermediate
        biological_scale: MOLECULAR
        description: 'TFIID, built from TBP and the TBP-associated factors with TAF6 in its core, is required
          for RNA polymerase II transcription initiation. A destabilized TFIID is proposed to perturb
          transcription initiation broadly, which is the basis for grouping Alazami-Yuan syndrome with
          the TAFopathies and with the Cornelia de Lange-like "transcriptomopathies". No study has measured
          TFIID assembly, promoter occupancy, or the transcriptome in patient material, and why a defect
          in a ubiquitous general transcription factor yields a tissue-restricted developmental phenotype
          is unexplained.

          '
        biological_processes:
        - preferred_term: RNA polymerase II preinitiation complex assembly
          term:
