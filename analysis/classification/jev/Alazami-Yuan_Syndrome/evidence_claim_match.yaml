      assertion_type: Discussion
      assertion:
        discussion_id: taf6_no_patient_cell_transcription_data
        kind: KNOWLEDGE_GAP
        prompt: 'Do TAF6 patient alleles actually destabilize TFIID and alter RNA polymerase II transcription
          in human cells, and which genes mediate the craniofacial, neurodevelopmental and growth phenotypes?

          '
        attaches_to:
        - pathophysiology#Impaired TFIID-Dependent Transcription Initiation
        - mechanistic_hypotheses#tafopathy_transcriptomopathy
        rationale: 'The only functional data are co-immunoprecipitation of a truncated human TAF6 fragment
          in Drosophila cells and a yeast growth assay in which the patient-equivalent alleles had little
          effect. TFIID assembly, promoter occupancy, and the transcriptome have not been measured in
          patient cells, and the frameshift alleles found in later probands have not been tested at all.
          Every causal step past the binding defect is therefore inferred from TAF6''s normal role.

          '
      selected_evidence:
        snippet: Thus, this yeast growth assay may not be an optimal and conclusive approach to studying
          the downstream effects of these 2 perhaps more subtle mutations.
        supports: SUPPORT
