            term:
              id: MONDO:0014931
              label: Alazami-Yuan syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TAF6 Biallelic Variants
        role: trigger
        biological_scale: MOLECULAR
        description: 'Biallelic germline TAF6 variants are the initiating lesion. The two founding missense
          alleles, p.Arg46Cys and p.Ile71Thr, both fall in the N-terminal histone-fold domain through
          which TAF6 assembles into the TFIID core. Later probands carry a missense allele in trans with
          a frameshift (c.1052delT, c.1863dup) or a homozygous frameshift (c.610_611delGC). The founding
          missense alleles retain enough function to support viability: they caused only a slight growth
          reduction when tested in a yeast taf6 temperature-sensitive strain, which the authors read as
          compatible with survival of homozygous patients. Whether every allele is hypomorphic, or some
          combinations are near-null, is not established.

          '
        genes:
        - preferred_term: TAF6
          term:
            id: hgnc:11540
            label: TAF6
        molecular_functions:
        - preferred_term: TFIID general transcription initiation factor activity of TAF6
          term:
            id: GO:0016251
            label: RNA polymerase II general transcription initiation factor activity
          modifier: DECREASED
      selected_evidence:
        snippet: This prescreening step led to the identification of 69 recessive genes not previously
          associated with disease, of which 33 are here described (SPDL1, TUBA3E, INO80, NID1, TSEN15,
          DMBX1, CLHC1, C12orf4, WDR93, ST7, MATN4, SEC24D, PCDHB4, PTPN23, TAF6, TBCK, FAM177A1, KIAA1109,
          MTSS1L, XIRP1, KCTD3, CHAF1B, ARV1, ISCA2, PTRH2, GEMIN4, MYOCD, PDPR, DPH1, NUP107, TMEM92,
          EPB41L4A, and FAM120AOS).
        supports: SUPPORT
    origin:
