    claim:
      about:
        disease:
          name: Alexander Disease
          disease_term:
            preferred_term: Alexander disease
            term:
              id: MONDO:0008752
              label: Alexander disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mutant GFAP Proteotoxicity
        description: 'Gain-of-function mutations in GFAP lead to accumulation of misfolded GFAP protein
          that forms Rosenthal fibers within astrocytes. These inclusions contain GFAP complexed with
          small heat shock proteins alphaB-crystallin and HSP27. The aggregation overwhelms the protein
          quality control machinery. Rosenthal fibers originate as small osmiophilic masses deposited
          on bundles of intermediate filaments and continue to form over time.

          '
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        conforms_to: loss_of_proteostasis#Misfolded-Protein Aggregation
        genes:
        - preferred_term: GFAP
          term:
            id: hgnc:4235
            label: GFAP
        molecular_functions:
        - preferred_term: structural constituent of cytoskeleton
          term:
