  a7af68a840537dbe2f0ba24f3e7630d95210f1653bd694467326c32ae81cea95:
    claim:
      about:
        disease:
          name: Alexander Disease
          disease_term:
            preferred_term: Alexander disease
            term:
              id: MONDO:0008752
              label: Alexander disease
        context: []
      assertion_type: Genetic
      assertion:
        name: GFAP Gain-of-Function Mutations
        gene_term:
          preferred_term: GFAP
          term:
            id: hgnc:4235
            label: GFAP
        association: Causative
        notes: 'Heterozygous missense mutations in GFAP account for the vast majority of cases. Hotspot
          mutations at R79 and R239 are most common, accounting for 16.6% and 20.3% of the 2011 cohort
          respectively. R239 variants as a group are associated with early, severe disease, but age at
          onset differs among substitutions at that residue. Most cases are de novo, although familial
          disease occurs. The mutations cause a toxic gain of function leading to protein aggregation
          rather than haploinsufficiency.

          '
        inheritance:
        - name: Autosomal Dominant
        variants:
        - name: GFAP R79 missense hotspot
          description: 'Recurrent heterozygous GFAP R79 substitutions, especially R79H, are a common Alexander
            disease hotspot. They enter the canonical toxic gain-of-function path from mutant GFAP through
            Rosenthal fiber formation, astrocyte dysfunction, white matter injury, and subtype-specific
            neurologic phenotypes.

            '
          gene:
            preferred_term: GFAP
            term:
              id: hgnc:4235
              label: GFAP
          type: missense
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: toxic gain-of-function
            description: Missense substitution in the GFAP rod domain promotes dominant astrocyte intermediate-filament
              pathology.
        - name: GFAP R239 missense hotspot
          description: 'Recurrent heterozygous GFAP R239 substitutions, including R239C and R239H, are
            the most common hotspot group and are associated with a more aggressive clinical course, while
            R239H has earlier onset than R239C. R239 variants follow the toxic GFAP path through aggregation,
            Rosenthal fibers, astrocyte dysfunction, and severe Type I-weighted neurologic phenotypes.

            '
          gene:
            preferred_term: GFAP
            term:
              id: hgnc:4235
              label: GFAP
          type: missense
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: toxic gain-of-function
            description: Missense substitution at GFAP Arg239 promotes dominant GFAP aggregation and severe
              astrocyte pathology.
        - name: GFAP cysteine-generating aggregation-prone variants
          description: 'Cysteine-generating GFAP variants, represented in Alexander disease cohorts by
            R239C and R88C, provide a variant-specific path into abnormal GFAP oxidation and crosslinking
            before aggregate and Rosenthal fiber formation.

            '
          gene:
            preferred_term: GFAP
            term:
              id: hgnc:4235
              label: GFAP
          type: missense
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: abnormal GFAP oxidation and crosslinking
            description: Cysteine-generating substitutions promote GFAP crosslinking, defective assembly,
              and decreased filament solubility.
      selected_evidence:
        snippet: GFAP | HGNC:4235 | Alexander disease | MONDO:0008752 | AD | Definitive
        supports: SUPPORT
