  ea6426a1bb6bb36d2cae4c912a848fafa7b3e1beddbd20617199d30858cdbd2f:
    claim:
      about:
        disease:
          name: Allan-Herndon-Dudley Syndrome
          disease_term:
            preferred_term: Allan-Herndon-Dudley syndrome
            term:
              id: MONDO:0010354
              label: Allan-Herndon-Dudley syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Reverse T3 in the newborn period
        description: AHDS is missed by newborn screening. Current TSH/T4-based screening exists to detect
          congenital hypothyroidism and does not measure T3, and newborns with MCT8 deficiency have TSH
          and T4 that are normal for gestational age because the pathognomonic T3 rise does not appear
          until roughly four months of age. Adding T3 to the screening panel would not by itself separate
          MCT8 deficiency from other thyroid disorders. The only characteristic alteration present in
          the newborn period is a low reverse T3, but this assay is not widely available and is rarely
          performed - a recognised screening gap rather than a current recommendation.
        diagnosis_term:
          preferred_term: reverse T3 measurement
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        results: A low reverse T3 is the only characteristic MCT8-related alteration detectable in the
          newborn period.
        notes: 'Recorded as a diagnostic gap, not an established pathway: no newborn screening programme
          currently detects AHDS, and reverse T3 assays are not routinely available.'
      selected_evidence:
        snippet: Current newborn screening (NBS) was established to help identify congenital hypothyroidism
          and does not include serum T3 levels
        supports: SUPPORT
