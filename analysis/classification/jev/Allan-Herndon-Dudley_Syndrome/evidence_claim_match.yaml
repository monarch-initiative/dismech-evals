      assertion:
        name: Serum total triiodothyronine (T3)
        notes: Serum T3 is elevated in essentially all affected males and is the entry point to the diagnosis.
          In the Triac Trial cohort, mean baseline T3 was 4.97 nmol/L against a normal target range of
          1.4-2.5 nmol/L, roughly double the upper limit of normal.
        presence: INCREASED
        reference_ranges:
        - loinc_term:
            id: LOINC:14930-2
            label: Triiodothyronine (T3) [Moles/volume] in Serum or Plasma
          lower_bound: 1.4
          upper_bound: 2.5
          unit: nmol/L
          population: Reference target range used in the international Triac Trial for paediatric and
            adult males with MCT8 deficiency.
          notes: 'The trial reports values in nmol/L, so the molar LOINC code is used. Age-specific paediatric
            intervals differ; the cohort study assessed T3 against age-specific upper limits rather than
            a single adult cut-off. ANALYTE MISMATCH FLAG: this marker is TOTAL T3 (LOINC:14930-2), but
            the abnormal interpretation band below is bound to HP:0011788 "Increased circulating free
            T3" because HPO has no "increased circulating total T3" term (the HP:0031508 subtree was enumerated
            and contains no total-T3 equivalent). HP:0011788 is used as the closest available term; a
            new-term request to HPO for an increased-total-T3 class would resolve this.'
          interpretation_bands:
          - name: Normal
            lower_bound: 1.4
            upper_bound: 2.5
            unit: nmol/L
            abnormal_flag: NORMAL
            interpretation: Within the target range used in the Triac trials. Untreated AHDS essentially
              never falls here; a normal T3 on treatment is the therapeutic goal.
          - name: Elevated T3 typical of untreated MCT8 deficiency
            lower_bound: 2.5
            unit: nmol/L
            abnormal_flag: HIGH
            phenotype_term:
              preferred_term: Elevated serum T3
              term:
                id: HP:0011788
                label: Increased circulating free T3
            interpretation: An elevated T3 in a boy with severe developmental delay and hypotonia should
              prompt free T4, TSH, and SLC16A2 sequencing. Untreated AHDS averages about 4.97 nmol/L,
              roughly twice the upper limit of normal.
      selected_evidence:
        snippet: Tri-iodothyronine concentrations were above the age-specific upper limit in 96 (95%)
          of 101 patients
        supports: SUPPORT
