        - AHDS has markedly elevated T3, an elevated T3/T4 ratio, low reverse T3, and prominent tachycardia
          and failure to thrive. RTH-alpha lacks the peripheral thyrotoxic signature. Definitive separation
          is by sequencing SLC16A2 versus THRA.
