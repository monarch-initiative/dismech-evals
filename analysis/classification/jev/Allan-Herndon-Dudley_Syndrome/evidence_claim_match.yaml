      assertion_type: Pathophysiology
      assertion:
        name: SLC16A2 Loss of Function
        description: Loss-of-function variants in SLC16A2 at Xq13.2 (deletions, nonsense, frameshift,
          and missense variants that misfold or mistraffic the protein) abolish or severely reduce the
          activity of monocarboxylate transporter 8 (MCT8), a 12-transmembrane-domain thyroid hormone-specific
          plasma membrane transporter. Because males are hemizygous, a single variant allele removes all
          functional transporter.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SLC16A2
          term:
            id: hgnc:10923
            label: SLC16A2
      selected_evidence:
        snippet: In two patients, gene deletions of 2.4 kb and 24 kb were recorded and in three patients
          missense mutations Ala150Val, Arg171 stop, and Leu397Pro were identified.
        supports: SUPPORT
    origin:
