              label: Allan-Herndon-Dudley syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Serum thyroid function testing (T3, free T4, TSH)
        description: 'The diagnostic entry point is a serum thyroid panel that INCLUDES T3. After about
          four months of age the profile is a characteristic fingerprint: elevated free or total T3, low
          or low-normal free T4, and a normal or only slightly elevated TSH. Because T3 is not part of
          routine paediatric thyroid testing, the single most common obstacle to diagnosis outside the
          newborn period is simply that serum T3 is never measured. Only resistance to thyroid hormone
          alpha produces a similar pattern, so the biochemistry narrows the differential to two disorders
          before any sequencing is done.'
        diagnosis_term:
          preferred_term: thyroid function testing
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        results: Elevated T3 with low or low-normal free T4 and a normal or mildly elevated TSH, giving
          an increased T3/T4 ratio. An elevated T3 in a boy with unexplained developmental delay should
          trigger confirmatory SLC16A2 sequencing.
        markers: T3, free T4, TSH, T3/T4 ratio, reverse T3, SHBG
      selected_evidence:
        snippet: elevated T3 with low FT4 and normal or slightly elevated TSH
        supports: SUPPORT
