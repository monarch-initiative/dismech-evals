            abnormal_flag: NORMAL
            phenotype_term:
              preferred_term: Normal or only mildly elevated TSH despite high T3
              term:
                id: HP:0033075
                label: Inappropriately normal thyroid-stimulating hormone level
            interpretation: A numerically normal TSH is the expected AHDS result and must not be read
              as reassuring. Interpreted against a T3 of roughly twice normal, a TSH in this band is inappropriately
              non-suppressed and is diagnostically informative.
          - name: Mildly elevated TSH
            lower_bound: 4.0
            upper_bound: 10.0
            unit: mU/L
            abnormal_flag: HIGH
