      assertion_type: Treatment
      assertion:
        name: Tiratricol (Triac)
        description: 'Triac (3,3'',5-triiodothyroacetic acid, tiratricol) is a T3 analogue that binds
          the same thyroid hormone receptors as T3 but enters cells independently of MCT8. It is the rational
          therapy for AHDS: it suppresses the pituitary, lowering the elevated serum T3 and thereby relieving
          peripheral thyrotoxicosis, and can in principle reach MCT8-dependent tissues that T3 cannot.
          In the international phase 2 Triac Trial (46 patients), serum T3 fell from 4.97 to 1.82 nmol/L
          over 12 months with only transient adverse effects; a real-life cohort of 67 patients treated
          up to 6 years confirmed sustained benefit with gains in body weight, reductions in heart rate,
          and falling SHBG. Evidence that Triac reverses the cerebral hypothyroidism is much weaker than
          the evidence for peripheral benefit, and is the question Triac Trial II was designed to answer
          by treating boys aged 30 months or younger. Tiratricol received European Union approval in 2025
          specifically for peripheral thyrotoxicosis in MCT8 deficiency from birth; this approval does
          not establish neurological efficacy.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: tiratricol
            term:
              id: CHEBI:40021
              label: tiratricol
        target_phenotypes:
        - preferred_term: Elevated serum T3
          term:
            id: HP:0011788
            label: Increased circulating free T3
        - preferred_term: Failure to thrive / underweight
          term:
            id: HP:0001508
            label: Failure to thrive
        - preferred_term: Resting tachycardia
          term:
            id: HP:0001649
            label: Tachycardia
      selected_evidence:
        snippet: Key features of peripheral thyrotoxicosis were alleviated in paediatric and adult patients
          with MCT8 deficiency who were treated with Triac. Triac seems a reasonable treatment strategy
          to ameliorate the consequences of untreated peripheral thyrotoxicosis in patients with MCT8
          deficiency.
        supports: SUPPORT
