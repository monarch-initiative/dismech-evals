  39cf24d1f732e7e3fd2e8f97493aa91cf3fa0f40579f6992898999f20f725e0a:
    claim:
      about:
        disease:
          name: Allan-Herndon-Dudley Syndrome
          disease_term:
            preferred_term: Allan-Herndon-Dudley syndrome
            term:
              id: MONDO:0010354
              label: Allan-Herndon-Dudley syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cerebral Thyroid Hormone Deprivation
        description: 'Brain thyroid hormone content falls despite normal or elevated circulating T3, because
          MCT8 is the rate-limiting import step at the blood-brain barrier and in MCT8-dependent neurons.
          The CNS therefore behaves as a hypothyroid tissue: T3-responsive gene programs are under-driven,
          and compensatory deiodinase changes (increased DIO2, decreased DIO3) fail to restore local hormone
          supply. This is the one conserved step AHDS shares with classical hypothyroidism, and the only
          node here that declares module conformance.'
        role: central_effector
        biological_scale: TISSUE
        conforms_to: hypothyroidism_thyroid_hormone_deficiency#Reduced Thyroid Hormone Action at Peripheral
          Sites
        biological_processes:
        - preferred_term: Response to Thyroid Hormone
          term:
            id: GO:0097066
            label: response to thyroid hormone
          modifier: DECREASED
      selected_evidence:
        snippet: This local hypothyroidism in the brain of these patients causes severe psychomotor retardation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: clinicaltrials:NCT02060474
      reference_title: 'Thyroid Hormone Analog Therapy of Patients With Severe Psychomotor Retardation
