            term:
              id: MONDO:0010354
              label: Allan-Herndon-Dudley syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MCT8 Thyroid Hormone Transport Failure
        description: MCT8 is a thyroid hormone-specific transporter that carries T3 and T4 across the
          plasma membrane. Its loss does not affect hormone synthesis or receptor function; it blocks
          hormone entry into cells. Critically, MCT8 dependence is tissue-selective. Brain barriers and
          many neurons rely on MCT8 as the rate-limiting import route, whereas liver, heart, and skeletal
          muscle import T3 through alternative transporters (MCT10, OATP family). This single lesion therefore
          partitions the body into hormone-deprived and hormone-overexposed compartments.
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: Thyroid Hormone Transport
          term:
            id: GO:0070327
            label: thyroid hormone transport
          modifier: DECREASED
      selected_evidence:
        snippet: Here, we report cryoelectron microscopy (cryo-EM) structures of MCT8 and OATP1C1 bound
          with the active thyroid hormone triiodothyronine (T3) and the prohormone thyroxine (T4) at 2.9
          and 2.3 Å resolutions, respectively. Combined with functional studies, we elucidate their distinct
          thyroid hormone recognition and transport mechanisms and explain disease mutations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/3
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40680733
      reference_title: Structural insights into brain thyroid hormone transport via MCT8 and OATP1C1.
      evidence_source: IN_VITRO
      explanation: Current structural and functional evidence directly resolves MCT8 bound to its thyroid-hormone
        substrate and links disease mutations to the transport mechanism.
