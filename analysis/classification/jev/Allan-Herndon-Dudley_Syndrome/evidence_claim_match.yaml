  3f8fa0608a9b67da2f62d8f307e89090623138e792c5b3caf224f2d0cd692379:
    claim:
      about:
        disease:
          name: Allan-Herndon-Dudley Syndrome
          disease_term:
            preferred_term: Allan-Herndon-Dudley syndrome
            term:
              id: MONDO:0010354
              label: Allan-Herndon-Dudley syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Peripheral Thyrotoxicosis in MCT8-Independent Tissues
        description: 'Liver, heart, kidney, and skeletal muscle import T3 through MCT10, OATP, and other
          non-MCT8 routes, so they are fully exposed to the elevated circulating T3. These tissues are
          therefore chronically thyrotoxic while the brain is hypothyroid. This is the mechanistic reason
          why levothyroxine or liothyronine replacement is harmful in AHDS: extra hormone cannot reach
          the brain but does reach and further over-stimulate the periphery.'
        role: effector
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: Response to Thyroid Hormone
          term:
            id: GO:0097066
            label: response to thyroid hormone
          modifier: INCREASED
      selected_evidence:
        snippet: This chronic thyrotoxicosis leads to progressive deterioration in bodyweight, tachycardia,
          and muscle wasting, predisposing affected individuals to substantial morbidity and mortality.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31377265
      reference_title: 'Effectiveness and safety of the tri-iodothyronine analogue Triac in children and
        adults with MCT8 deficiency: an international, single-arm, open-label, phase 2 trial.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes chronic peripheral thyrotoxicosis as the driver of the systemic morbidity
