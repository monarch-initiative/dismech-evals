        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ahds-mouse-model-mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cerebral Thyroid Hormone Deprivation
        prompt: Does the Mct8 single-knockout mouse model the human cerebral phenotype of AHDS closely
          enough for its neurological readouts to be translated, given that it reproduces the human serum
          thyroid profile but develops without overt neurological deficits?
        rationale: 'This is a genuine translational mismatch rather than a gap in evidence. Mct8-null
          mice reproduce the human biochemical signature almost exactly (high T3, low T4, increased hepatic
          D1) and show reduced brain T3 uptake and a locally hypothyroid brain, yet they are neurologically
          near-normal and their cerebellar Purkinje cells develop normally. The accepted explanation is
          species difference in brain thyroid hormone transporter redundancy: mice express OATP1C1 at
          the blood-brain barrier as an alternative T4 route that humans rely on much less. Consequently
          the Mct8/Oatp1c1 double knockout, not the single knockout, is the appropriate model, and human
          iPSC-derived cerebral organoids are the strongest human-specific system. Any mouse-derived conclusion
          about the severity, reversibility, or therapeutic window of the human cerebral phenotype must
          be qualified accordingly.'
        proposed_experiments:
        - experiment_id: ahds-cross-model-cerebral-deficit
          name: Cross-model comparison of the cerebral deficit
          description: Compare T3-responsive gene induction, oligodendrocyte maturation, and cortical
            unit thickness across Mct8 single-knockout mouse, Mct8/Oatp1c1 double-knockout mouse, and
            patient-derived human cerebral organoids under matched analogue treatment, to quantify how
            much of the human deficit each model captures.
          decision_criterion: If the double-knockout mouse and human organoid converge on comparable deficits
            while the single knockout does not, the single knockout should be retired as a model of the
            human cerebral phenotype.
        - experiment_id: ahds-organoid-therapeutic-window
          name: Therapeutic window mapping in human cerebral organoids
          description: Apply Triac or DITPA to patient-derived cerebral organoids at staged developmental
            time points to define how late the MCT8-bypass strategy can still restore T3-responsive gene
            programs and cortical unit thickness.
          decision_criterion: Identification of a developmental stage after which analogue treatment no
            longer restores T3-responsive gene induction would define the human therapeutic window and
            set the target age for early treatment.
      selected_evidence:
        snippet: In conclusion, the circulating thyroid hormone levels of MCT8-null mice closely resemble
          those of humans with MCT8 mutations, yet in the mice, CNS development is only partially affected.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
