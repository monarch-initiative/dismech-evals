              label: Allan-Herndon-Dudley syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Signature Serum Iodothyronine Pattern
        description: The diagnostic biochemical triad is high serum T3 with low or low-normal free T4
          and a normal or only mildly elevated TSH, giving an increased T3/T4 ratio and low reverse T3.
          This pattern arises because tissues that retain hormone uptake (notably liver) increase type
          1 deiodinase activity, converting T4 to T3, while the pituitary and hypothalamus receive a mixed
          signal, so TSH is not suppressed to the degree the elevated T3 would predict. The combination
          is what distinguishes AHDS from ordinary primary hypothyroidism (low T3 and T4 with high TSH)
          and from thyroid hormone resistance syndromes, and it is the diagnostic key.
        role: biomarker
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: Thyroid Hormone Metabolic Process
          term:
            id: GO:0042403
            label: thyroid hormone metabolic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: Tri-iodothyronine concentrations were above the age-specific upper limit in 96 (95%)
          of 101 patients and free thyroxine concentrations were below the age-specific lower limit in
          94 (89%) of 106 patients.
        supports: SUPPORT
