      - /disease_term
    evidence_metadata:
      reference: PMID:28412864
      reference_title: 'Cutaneous allergic drug reactions: update on pathophysiology, diagnostic procedures
        and differential diagnosic.'
      evidence_source: OTHER
      explanation: Places DRESS alongside SJS/TEN as a severe cutaneous adverse reaction sharing allopurinol
