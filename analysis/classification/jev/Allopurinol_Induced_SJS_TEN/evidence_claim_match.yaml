        name: Acute generalized exanthematous pustulosis (AGEP)
        disease_term:
          preferred_term: acute generalized exanthematous pustulosis
          term:
            id: MONDO:0017384
            label: acute generalized exanthematous pustulosis
        description: AGEP is the third severe cutaneous adverse reaction pattern. It presents with sterile
          non-follicular pustules on an erythematous base and fever, with a short latency, and lacks the
          full-thickness keratinocyte death that defines the SJS/TEN spectrum. Its boundary with pustular
          psoriasis is itself contested on genetic grounds, which is worth knowing before treating an
          AGEP label as a settled alternative diagnosis.
        distinguishing_features:
        - Sterile non-follicular pustules rather than epidermal detachment
        - Short latency, typically within days of exposure
        - Rapid spontaneous resolution on drug withdrawal
      selected_evidence:
        snippet: Similar mutations in the IL36R gene, which were found in both patients with an AGEP (Acute
          Generalized Exanthematous Pustulosis) and pustular psoriasis, make the differential diagnosis
          more difficult
        supports: SUPPORT
