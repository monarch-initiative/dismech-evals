        context: []
      assertion_type: Diagnosis
      assertion:
        name: HLA-B*58:01 pharmacogenomic screening before allopurinol
        diagnosis_term:
          preferred_term: HLA typing
          term:
            id: NCIT:C71329
            label: HLA Typing
        description: 'Genotyping for HLA-B*58:01 before starting allopurinol identifies the susceptibility
          allele that this entry''s trigger node depends on, making it a preventive test rather than a
          diagnostic one. Its performance is strongly population-dependent, which is the operative point
          for practice: pooled sensitivity is only about 56% in European and Japanese populations against
          about 97% in Korean, Thai, Sardinian Italian and Han Chinese populations. A negative result
          therefore carries very different reassurance depending on ancestry, and does not exclude risk
          in the lower-sensitivity groups.'
        notes: This entry was merged from a duplicate that previously sat under treatments with the same
          name. Diagnostic procedures belong in diagnosis, so the treatments copy was the misplaced one;
          its two evidence items are carried here in full and nothing was dropped. The diagnosis_term
          was also upgraded from the treatments entry's NCIT:C15709 (Genetic Testing) to the more specific
          NCIT:C71329 (HLA Typing).
      selected_evidence:
        snippet: Overall, HLA-B*5801 was associated with allopurinol-induced TEN/SJS in European and Japanese
          populations, but only had a 50-60% sensitivity (pooled sensitivity 56%), compared to the 80-100%
          sensitivity (pooled sensitivity 97%) observed in Korean, Thai, Sardinia Italian and Han Chinese
          populations.
        supports: SUPPORT
