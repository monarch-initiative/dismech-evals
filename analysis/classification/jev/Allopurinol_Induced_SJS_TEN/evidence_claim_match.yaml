            term:
              id: MONDO:0044739
              label: Stevens-Johnson syndrome/toxic epidermal necrolysis overlap syndrome
        context: []
      assertion_type: Environmental
      assertion:
        name: Renal impairment
        notes: Deliberately left without an exposure_term. Reduced renal function is a host susceptibility
          factor that modifies oxypurinol clearance, not an exposure, so no ECTO term applies; ECTO is
          an exposure ontology and binding a disease or physiological state here would misuse it. It is
          modelled under environmental only so that it can reach the pathograph through influences_mechanisms.
          `just environmental-term-audit` will continue to report this entry as UNBOUND, and that is the
          correct outcome rather than a gap to close.
        description: Poor renal function delays oxypurinol clearance, increasing exposure to the metabolite
          that drives the dose-dependent T-cell response and worsening prognosis in allopurinol-SCAR,
          including SJS/TEN.
      selected_evidence:
        snippet: Poor renal function was significantly associated with the delayed clearance of plasma
          oxypurinol, and increased the risk of allopurinol-SCAR (p<0.001, OR (95% CI) 8.0 (3.9 to 17)).
          Sustained high levels of oxypurinol after allopurinol withdrawal correlated with the poor prognosis
          of allopurinol-SCAR.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/1
      evidence_path: /environmental/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25115449
      reference_title: 'Insights into the poor prognosis of allopurinol-induced severe cutaneous adverse
        reactions: the impact of renal insufficiency, high plasma levels of oxypurinol and granulysin.'
      evidence_source: HUMAN_CLINICAL
      explanation: A prospective cohort directly links renal impairment to delayed oxypurinol clearance,
        increased allopurinol-SCAR risk, and worse prognosis.
