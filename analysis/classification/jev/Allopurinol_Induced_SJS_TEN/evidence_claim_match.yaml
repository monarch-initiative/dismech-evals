      assertion:
        name: DRESS syndrome
        disease_term:
          preferred_term: DRESS syndrome
          term:
            id: MONDO:0015340
            label: drug rash with eosinophilia and systemic symptoms
        description: Drug Reaction with Eosinophilia and Systemic Symptoms shares allopurinol as a leading
          culprit drug and is the principal alternative severe cutaneous adverse reaction to consider.
          It is distinguished by eosinophilia, facial oedema, a longer latency, and prominent visceral
          involvement, rather than by the full-thickness epidermal necrolysis and mucosal detachment that
          define SJS/TEN.
        distinguishing_features:
        - Peripheral eosinophilia and atypical lymphocytosis
        - Facial oedema with a morbilliform eruption rather than epidermal detachment
        - Longer latency from drug start, typically two to six weeks
        - Prominent hepatic and renal involvement
      selected_evidence:
        snippet: in severe drug allergic reactions such as SJS (Stevens-Johnson Syndrome), TEN (Toxic
          Epidermal Necrolysis), or DRESS (Drug Reaction with Eosinophilia and Systemic Symptoms) Syndrome,
          compounds like allopurinol and anticonvulsants are the main causes
        supports: SUPPORT
    origin:
