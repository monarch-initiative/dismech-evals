      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: fetuin_tgfb_antagonism_model
        hypothesis_label: Reduced fetuin-A antagonism of hair-cycle TGF-beta signaling
        status: EMERGING
        description: This candidate model links a possible reduction in fetuin-A antagonism to excessive
          TGF-beta2 activity and premature follicular catagen. It is an inference from biochemical binding
          experiments and human follicle organ culture, not an observed effect of p.Arg317His. Neither
          mutant TGF-beta binding nor excess pathway activity or premature catagen was measured in APMR1.
          Adult follicle cycling also does not directly explain failure to establish hair at birth. This
          model addresses the hair phenotype only; fetal fetuin-A expression does not establish a TGF-beta-dependent
          route to intellectual disability.
      selected_evidence:
        snippet: In the presence of the antibody as well as fetuin, hair follicles were markedly elongated
          in a concentration-dependent manner.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
