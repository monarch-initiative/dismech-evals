        prompt: What do the AHSG-null observations establish about the APMR1 allele?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#AHSG
        - animal_models#Ahsg-null mouse
        rationale: Ahsg-null mice were assessed principally for calcification, not hair cycling or cognition.
          A separate nine-week-old infant with homozygous p.Lys2Ter and undetectable circulating fetuin-A
          had infantile cortical hyperostosis and was followed for one year. The authors explicitly described
          an association without experimental proof of ICH causation. Neither study provides dedicated
          negative hair or cognitive testing that rules out loss of function in APMR1 or establishes a
          neomorphic mechanism. Targeted allele-matched functional and developmental studies are needed.
      selected_evidence:
        snippet: After 1 year of follow-up, the patient was completely well with no bone deformity and/or
          elevated inflammatory markers.
        supports: SUPPORT
