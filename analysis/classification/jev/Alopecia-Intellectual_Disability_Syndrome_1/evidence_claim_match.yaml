        kind: INTERPRETATION
        status: RESOLVED
        attaches_to:
        - disease#Alopecia-Intellectual Disability Syndrome 1
        rationale: APMR1 was mapped to 3q26.33-q27.3 and later associated with AHSG at 3q27.3. APMR2 is
          a non-overlapping chromosome 3 locus; APMR3 maps to chromosome 18; LSS-related APMR4 maps to
          chromosome 21. Findings from the different families require their own subtype and gene attribution.
        resolution_note: The entry retains APMR1 as a distinct disease and the existing APMR grouping.
          Unidentified genes do not prevent disease curation, and the numbered forms are not all on different
          chromosomes.
      selected_evidence:
        snippet: The linkage interval of the APMR locus identified here does not overlap with the one
          described previously; therefore, this locus has been designated as APMR2.
        supports: SUPPORT
