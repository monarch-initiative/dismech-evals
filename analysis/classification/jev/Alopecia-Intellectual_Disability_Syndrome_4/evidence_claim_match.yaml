      assertion_type: Genetic
      assertion:
        name: LSS Pathogenic Variants
        gene_term:
          preferred_term: LSS
          term:
            id: hgnc:6708
            label: LSS
        association: CAUSAL
        notes: 'Biallelic pathogenic LSS variants (chromosome 21q22.3) cause APMR4. Reported alleles span
          missense, splice-site, nonsense, and frameshift changes distributed across the gene; most affected
          individuals carry at least one hypomorphic missense allele, and no patient has been reported
          with two alleles predicting complete loss of protein, consistent with presumed lethality of
          total enzyme absence. LSS is also associated with two other autosomal recessive traits — congenital
          cataract type 44 and hypotrichosis simplex type 14 — with an emerging genotype-phenotype correlation
          across LSS-related disease.

          '
      selected_evidence:
        snippet: We reported ten APMR individuals from six unrelated families with biallelic variants
          in LSS.
        supports: SUPPORT
