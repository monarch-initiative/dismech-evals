        context: []
      assertion_type: Genetic
      assertion:
        name: POLG
        gene_term:
          preferred_term: POLG
          term:
            id: hgnc:9179
            label: POLG
        relationship_type: CAUSATIVE
        notes: POLG encodes the catalytic subunit of mitochondrial DNA polymerase gamma. Pathogenic alleles
          can impair catalysis, processivity, DNA binding, proofreading or protein stability; effects
          differ between alleles and do not imply complete loss of all enzyme functions. Recurrent p.Ala467Thr
          is associated with several POLG phenotypes, so its presence alone does not determine Alpers
          severity. Common p.Gln1236His and p.Glu1143Gly substitutions are not equivalent to biallelic
          Alpers-causing variants.
      selected_evidence:
        snippet: Molecular studies revealed homozygous p.R597W or p.A467T mutations in two patients. The
          other two patients showed compound heterozygous mutations, p.A467T/p.Q68X and p.L83P/p.G888S.
        supports: SUPPORT
        directness: DIRECT
