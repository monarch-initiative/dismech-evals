      assertion:
        name: Hepatic, metabolic and tissue assessment
        description: Assess liver enzymes, synthetic function, glucose, ammonia and lactate alongside
          neurological findings. Tissue mtDNA measurement and respiratory-chain testing can be informative
          when needed, but normal muscle histology, enzyme activity or mtDNA content does not exclude
          disease. Do not delay appropriate genetic evaluation because a screening test is normal.
      selected_evidence:
        snippet: In muscle biopsy samples, ragged-red fibers, COX-negative fibers, excessive lipid deposits,
          and abnormal respiratory chain activities can be present. However, biochemical findings on muscle
          biopsy can be normal.
