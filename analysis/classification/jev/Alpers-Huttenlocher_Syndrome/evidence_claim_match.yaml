        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: alpers-neural-selectivity
        prompt: Does early inhibitory-network dysfunction drive seizures, or does prolonged epilepsy amplify
          the observed neuronal injury?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Cortical Inhibition
        - pathophysiology#Cortical Neuronal Loss
        rationale: End-stage human tissue shows respiratory-chain protein deficiency and cell loss, but
          cannot order these events. Both interneuron and pyramidal-cell densities were reduced; respiratory-chain
          abnormalities were more pronounced in interneurons. Limited sampled regions do not establish
          occipital exclusivity. Longitudinal, appropriately controlled neural models are needed to separate
          intrinsic dysfunction from seizure-related injury.
      selected_evidence:
        snippet: Although loss of interneurons and pyramidal cells was similar, the magnitude of respiratory
          chain deficiency was more pronounced in interneurons raising the possibility that the loss of
          inhibitory neural networks plays a role in the seizure development in these patients.
        supports: SUPPORT
        directness: INDIRECT
