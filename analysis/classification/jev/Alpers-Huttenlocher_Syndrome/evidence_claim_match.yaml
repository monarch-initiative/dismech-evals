            preferred_term: Alpers-Huttenlocher syndrome
            term:
              id: MONDO:0008758
              label: mitochondrial DNA depletion syndrome 4a
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Variable survival with risk of fatal decompensation
        notes: The course is usually life limiting, but survival is variable and may include periods of
          stability. GeneReviews describes three months to 12 years from symptom onset. The 2017 Alpers
          subgroup had a median reported survival of four months (range 0.5–181 months); the pooled cohort's
          median age at death must not be treated as a universal Alpers prognosis.
      selected_evidence:
        snippet: Twenty-seven patients (15 male, 12 female) from 22 pedigrees (including two patients
          from consanguineous families) with genetically confirmed POLG mutations were identified. ...
          Of 27 patients, four were alive at the time of data analysis, and one had been lost to follow-up.
          Median age at death was 15.8 months (range 1.0 to 184.6 months), whereas median time from disease
          onset to death was 4.9 months (range 0.5 to 181.2 months). The main causes of death were liver
          failure (13/22), sepsis (5/22), and status epilepticus (4/22). ... Survival analysis by phenotype
          showed that the median survival time for patients with MCHS was 5 months (range 0.6 –22) and
          4 months (range 0.5 –181) for Alpers.
        supports: SUPPORT
        directness: DIRECT
