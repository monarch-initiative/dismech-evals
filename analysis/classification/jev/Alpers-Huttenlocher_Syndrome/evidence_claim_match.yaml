      assertion:
        name: Other early-onset POLG phenotypes
        description: Myocerebrohepatopathy and severe digestive-predominant presentations overlap with
          Alpers but can lack epilepsy, especially with rapidly fatal hepatic disease. Age categories
          and clinical syndromes are not equivalent.
