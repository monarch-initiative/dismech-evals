        context: []
      assertion_type: Treatment
      assertion:
        name: 'Deoxycytidine and Deoxythymidine: Clinical Investigation'
        description: Enteral deoxycytidine/deoxythymidine is being studied in recessive POLG disease.
          An initial 10-person report, including six Alpers participants, was followed by a 25-person
          mixed-POLG report from the same open-label program. Disease-scale and seizure improvements warrant
          further study, but unblinded assessment, cointerventions, missing observations and survival
          selection preclude a proven Alpers-specific benefit. Diarrhea sometimes required dose reduction;
          five deaths in the expanded cohort mean that absence of attributed serious drug toxicity is
          not proof of safety. This remains investigational for POLG disease, distinct from treatment
          of TK2 deficiency.
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: 'Deoxycytidine and Deoxythymidine: Clinical Investigation'
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: 2'-deoxycytidine
            term:
              id: CHEBI:15698
              label: 2'-deoxycytidine
          - preferred_term: Deoxythymidine
            term:
              id: CHEBI:17748
              label: thymidine
      selected_evidence:
        snippet: We present 6-month interim data from the first ten people with POLG-related disorders
          enrolled in the trial, six with Alpers-Huttenlocher syndrome, two with ataxia-neuropathy spectrum,
          and two who do not fit into a classical POLG-related phenotype.
        supports: SUPPORT
        directness: DIRECT
    origin:
