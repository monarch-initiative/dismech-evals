      assertion_type: ProgressionInfo
      assertion:
        phase: Progressive neurological and hepatic involvement
        notes: Seizures often become resistant to medication, and regression, spasticity, visual loss
          or ataxia can accumulate. Hepatic involvement has variable timing and can be precipitated or
          accelerated by valproate. Intercurrent illness may trigger abrupt decline.
      selected_evidence:
        snippet: In some children, seizures are initially controllable with standard dosages of anti-seizure
          medications (ASM); in others, seizures, such as EPC, are refractory from the onset. Over time,
          seizures become increasingly resistant to ASMs.
        supports: SUPPORT
        directness: DIRECT
