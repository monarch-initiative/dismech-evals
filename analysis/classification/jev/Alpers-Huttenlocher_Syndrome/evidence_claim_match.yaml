      assertion_type: Treatment
      assertion:
        name: Individualized Non-Valproate Antiseizure Therapy
        description: Use specialist-led treatment matched to seizure type and clinical condition. The
          2024 consensus generally follows standard epilepsy guidance for children older than 28 days
          and adults, with the POLG valproate contraindication and other patient-specific restrictions.
          Levetiracetam and several other ASMs are not generally contraindicated by mitochondrial disease
          alone, but this does not establish comparative Alpers efficacy. Lamotrigine may worsen myoclonus;
          topiramate warrants caution with renal tubular acidosis.
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Individualized Non-Valproate Antiseizure Therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: Many ASMs may be effective; none has been demonstrated effective specifically for this
          disorder.
        supports: SUPPORT
        directness: DIRECT
