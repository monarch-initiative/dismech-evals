            label: Seizure
        notes: Registry phase is 2/3; PHASE_III is used because the schema has no combined-phase value.
          Full posted registry results, status, participant flow and adverse-event summaries were checked
          on 2026-09-21. ClinicalTrials.gov reports 3 deaths among 34 vatiquinone recipients and 0/34
          placebo recipients during the double-blind period; the counts alone do not establish drug causation.
          The open-label extension must not be treated as a continued randomized comparison.
      selected_evidence:
        snippet: This is a parallel-arm, double-blind, placebo-controlled study with a screening phase
          that includes a 28-day run-in phase to establish baseline seizure frequency, followed by a 24-week,
          randomized, placebo-controlled phase.
