          name: Alpers-Huttenlocher Syndrome
          disease_term:
            preferred_term: Alpers-Huttenlocher syndrome
            term:
              id: MONDO:0008758
              label: mitochondrial DNA depletion syndrome 4a
        context: []
      assertion_type: ClinicalTrial
      assertion:
        name: NCT04802707
        description: Single-centre open-label phase 2 pyrimidine deoxynucleoside study across mitochondrial
          depletion disorders. The 2024 POLG interim report included 10 participants, six with Alpers;
          the 2026 report extends the same program to 25 participants with varied POLG phenotypes, including
          adults. Disease-scale scores improved among available follow-up observations, and 10/14 with
          uncontrolled epilepsy had reported seizure reductions over 50%. Five participants died and five
          withdrew. These uncontrolled mixed-phenotype findings do not establish Alpers-specific efficacy
          or a survival benefit.
        phase: PHASE_II
        status: RECRUITING
        target_phenotypes:
        - preferred_term: Seizure
          term:
            id: HP:0001250
            label: Seizure
        - preferred_term: Developmental regression
          term:
            id: HP:0002376
            label: Developmental regression
        notes: 'Live registry checked 2026-09-21: recruiting, estimated total enrollment 200 for the broader
          protocol. The 2026 POLG publication documents an amended upper age limit of 60 years and treatment
          duration up to 60 months; the cached brief registry summary still says children 0–18 years.
          The 2024 and 2026 papers are overlapping reports. One-tailed exploratory analyses, changing
          denominators, unblinded assessments, missing biomarker measurements, cointerventions and survivor
          selection constrain causal inference. GDF-15 is not a direct mtDNA-rescue measurement. Pediatric
          quality-of-life scores alone were not significantly improved in the 2026 report; its positive
          pooled result normalized different pediatric/adult instruments.'
      selected_evidence:
        snippet: In this phase II Trial a mix of Deoxynucleosides Pyrimidine (Deoxycytidine dC and Deoxythymidine
          dT) will be used as early treatment of MDS.
        supports: SUPPORT
        directness: DIRECT
