      assertion:
        name: Selected Adjuncts for Refractory Epilepsy
        description: Ketogenic diet or neuromodulation may be considered by specialist teams where appropriate,
          but Alpers-specific efficacy is unproven. In the 2024 mixed POLG status cohort, only 2/13 diet-treated
          patients reported benefit and both had juvenile/adult-onset disease; VNS was not used. Late
          rescue use and confounding prevent a definitive negative efficacy conclusion. Immunomodulatory
          therapies likewise lack demonstrated benefit for Alpers status.
        action_category: THERAPEUTIC
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Selected Adjuncts for Refractory Epilepsy
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: The use of other treatments for refractory epilepsy, such as corticotropin or prednisone,
          ketogenic diet, and intravenous immunoglobulin G, are unproven in the treatment of AHS.
        supports: SUPPORT
        directness: DIRECT
