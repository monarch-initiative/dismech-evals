              label: mitochondrial DNA depletion syndrome 4a
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        description: Alpers-Huttenlocher syndrome due to POLG is associated with biallelic pathogenic
          or likely pathogenic variants, usually inherited from asymptomatic heterozygous parents. Parental
          testing establishes phase and recurrence risk. If both parents carry one familial pathogenic
          variant, each pregnancy has a 25% chance of an affected child; severity can differ between siblings.
          Common POLG polymorphisms and dominant POLG-associated ophthalmoplegia require separate interpretation.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Molecular studies revealed homozygous p.R597W or p.A467T mutations in two patients. The
          other two patients showed compound heterozygous mutations, p.A467T/p.Q68X and p.L83P/p.G888S.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
