            term:
              id: MONDO:0009883
              label: alpha-2-plasmin inhibitor deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unopposed Plasmin Activity on Fibrin
        biological_scale: MOLECULAR
        description: Without alpha-2-antiplasmin, plasmin generated on the fibrin surface is neither neutralised
          in a covalent serpin complex nor prevented from binding fibrin, and no inhibitor is cross-linked
          into the clot by factor XIIIa. Fibrin-bound plasmin therefore degrades the clot freely. Plasma
          fibrinogen stays normal, consistent with alpha-2-macroglobulin still restraining free plasmin
          in the circulation.
        biological_processes:
        - preferred_term: fibrinolysis
          modifier: INCREASED
          term:
            id: GO:0042730
            label: fibrinolysis
        - preferred_term: negative regulation of fibrinolysis
          modifier: DECREASED
          term:
            id: GO:0051918
            label: negative regulation of fibrinolysis
      selected_evidence:
        snippet: Mechanistically, α2AP restrains fibrinolysis by (i) forming a covalent serpin complex
          with plasmin, (ii) blocking plasminogen binding to fibrin, and (iii) undergoing factor XIIIa-mediated
          cross-linking into fibrin to harden clots against local lysis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42257473
      reference_title: 'Alpha-2 antiplasmin deficiency: a rare fibrinolytic disorder identified after
        decades of diagnostic delay.'
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      explanation: Lists the three mechanisms of fibrinolysis restraint that are lost in the deficiency.
