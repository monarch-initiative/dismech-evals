        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function variants in SERPINF2 (chromosome 17p13) are the initiating
          lesion. The best-characterised alleles are in-frame deletions and frameshifts that produce a
          misfolded protein retained in the endoplasmic reticulum: alpha-2-PI Okinawa (deletion of Glu137)
          and alpha-2-PI Nara, together with a single-thymine deletion in exon 5 that truncates the protein
          after 83 native residues. Most variants therefore cause a quantitative (type I) deficiency with
          parallel loss of antigen and activity. Heterozygous carriers of a single pathogenic allele,
          such as the reactive-site-adjacent missense p.Val384Met or the intron 6 splice-donor allele
          Artas that skips exon 6, have intermediate activity and antigen and bleed after surgery or trauma.
          Variants are largely private to individual families.'
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
