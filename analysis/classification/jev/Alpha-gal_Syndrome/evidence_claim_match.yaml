      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tick_associated_microorganism
        hypothesis_label: Tick-Associated Microorganism Model
        status: DEPRECATED
        description: The response is induced by another organism present in the tick (e.g. commensal or
          pathogenic microbes such as Rickettsia or Borrelia), rather than by tick or mammalian glycans
          directly.
        notes: Deprecated. A dedicated 2026 openscientist hypothesis-search for this model (kb/hypotheses/Alpha-gal_Syndrome/tick_associated_microorganism,
          51 papers) returned an explicit REFUTED verdict, which the committed assessment of that report
          downgraded to WEAKLY_SUPPORTED_UNRESOLVED; this entry follows the assessment. The negative evidence
          is real but narrower than a class-wide refutation. A Polish cohort found no correlation between
          alpha-gal sIgE and serology for the tick-borne pathogens it assayed - Borrelia burgdorferi,
          Anaplasma phagocytophilum and tick-borne encephalitis virus (PMID:35382677) - and tick salivary
          gland extract alone sensitizes AGKO mice without live tick feeding (PMID:34034363). That extract
          study, however, neither reports pathogen or endosymbiont screening nor describes its material
          as pathogen free; it used partially blood fed extract, so it establishes that a transmitted
          infection is unnecessary rather than that microbial components are. Laboratory-reared Amblyomma
          americanum are in fact dominated by Francisella-like endosymbionts across tissues and developmental
          stages (PMID:35493735), so no reported experiment has yet tested sensitization with tick material
          depleted of microorganisms. DEPRECATED remains the right curation status - the model has no
          direct positive support and endogenous tick alpha-gal synthesis is a more parsimonious account
          - but a modulatory or adjuvant contribution from tick endosymbionts is untested rather than
          excluded, and is tracked as disc_ags_tick_endosymbiont_contribution.
      selected_evidence:
        snippet: That the response is induced by another organism that is present in the tick.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
