      assertion_type: Discussion
      assertion:
        discussion_id: disc_ags_agko_mouse_translational_fidelity
        prompt: Does the alpha-gal-deficient (AGKO) mouse - in which lone-star tick bites raise total
          IgE and alpha-gal IgG1 and pork challenge causes a body-temperature drop - faithfully model
          the human IgE-mediated, glycolipid-delayed anaphylaxis of alpha-gal syndrome?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Tick-saliva alpha-gal exposure and type 2 immune polarization
        - pathophysiology#Slow glycolipid-borne alpha-gal appearance in circulation
        rationale: Humans are naturally alpha-gal-negative and mount an IgE response, whereas the AGKO
          model's alpha-gal-specific response is predominantly IgG1 and its readout is hypothermia rather
          than the characteristic 2-6 hour delayed, glycolipid-dependent human anaphylaxis; the delay
          mechanism in particular is not captured, so translational validity for the human effector phase
