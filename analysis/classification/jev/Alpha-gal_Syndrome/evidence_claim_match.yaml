  11b2a84943368d30325d151ac6a09f6e71299ea6307aebb25dba09bd46249f1f:
    claim:
      about:
        disease:
          name: Alpha-gal Syndrome
          disease_term:
            preferred_term: alpha-gal syndrome
            term:
              id: MONDO:0100001
              label: alpha-gal syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_ags_tick_endosymbiont_contribution
        prompt: Do obligate tick endosymbionts contribute to alpha-gal sensitization, either as an additional
          source of the alpha-gal epitope or as an adjuvant, given that no reported sensitization experiment
          has used tick material depleted of microorganisms?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Tick-saliva alpha-gal exposure and type 2 immune polarization
        - mechanistic_hypotheses#tick_associated_microorganism
        rationale: The tick-associated-microorganism model is deprecated because no experiment supports
          a co-transmitted pathogen as the primary sensitizer, but the experiments read as refuting it
          do not reach endosymbionts. Laboratory-reared Amblyomma americanum carry a dominant Francisella-like
          endosymbiont in the same tissues from which sensitizing salivary gland extract is prepared,
          and the extract studies report no microbial screening or depletion. Resolving whether that microbial
          background contributes antigen or adjuvant activity is what would convert the deprecation from
          absence of support into exclusion.
        proposed_experiments:
        - experiment_id: exp_ags_endosymbiont_depleted_tsge
          name: Endosymbiont-depleted salivary gland extract sensitization assay
          description: Sensitize alpha-gal-deficient mice with salivary gland extract from antibiotic-treated
            versus untreated laboratory Amblyomma americanum, confirming endosymbiont load by 16S sequencing
            in both arms, and compare alpha-gal-specific IgE induction and challenge response.
          would_support:
          - mechanistic_hypotheses#tick_associated_microorganism
          would_refute:
          - mechanistic_hypotheses#tick_associated_microorganism
          supporting_outcome:
          - Endosymbiont depletion reduces alpha-gal-specific IgE induction, indicating that tick-associated
            microorganisms contribute antigen or adjuvant activity.
          refuting_outcome:
          - Depleted and untreated extracts sensitize equivalently, leaving tick-derived salivary constituents
            as the sufficient sensitizing material.
      selected_evidence:
        snippet: Overall, Francisellaceae was the most dominant bacteria identified in the microbiome
          of both laboratory-raised and field-collected Am. americanum across all tissues and developmental
          stages.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
