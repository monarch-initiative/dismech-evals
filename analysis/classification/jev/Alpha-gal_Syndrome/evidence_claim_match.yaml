      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: residual_blood_meal_glycoconjugate
        hypothesis_label: Residual Mammalian Blood-Meal Glycoconjugate Model
        status: DEPRECATED
        description: Residual mammalian glycoproteins or glycolipids carried in the tick from a previous
          mammalian blood meal are responsible for inducing the anti-alpha-gal response, i.e. the antigen
          is borrowed from prior mammalian hosts rather than made by the tick.
        notes: 'Deprecated. A dedicated 2026 openscientist hypothesis-search for this model (kb/hypotheses/Alpha-gal_Syndrome/residual_blood_meal_glycoconjugate,
          46 papers) returned an explicit REFUTED verdict, but the committed assessment of that report
          downgraded the verdict to WEAKLY_SUPPORTED_UNRESOLVED, and this entry follows the assessment.
          What holds is the absence of any modern experiment supporting a borrowed blood-meal antigen
          source, alongside a positive alternative: endogenous tick galactosyltransferases (PMID:30242261),
          and alpha-gal concentrated in the salivary glands of vegetation-collected ticks independently
          of current-stage diet (PMID:38741222). Two arguments previously recorded here as refutations
          do not carry that weight. The AGKO-mouse inoculum is described by its own authors as partially
          blood fed salivary gland extract (PMID:34034363), so it does not exclude blood-meal material.
          The dog result (PMID:31540167) is not source-discriminating: alpha-gal is the identical epitope
          whichever organism synthesized it, so a dog responding to it shows that the salivary context
          can break tolerance to a self-glycan, not where the glycan came from, and a single experimental
          infestation raised anti-alpha-gal IgM alone with IgG unchanged. The diet-independence work also
          used ELISA rather than high-resolution glycomics, and the vegetation-collected ticks were adults
          rather than ticks reared blood-meal-naive through the lifecycle, so a trace contribution of
          residual mammalian glycoconjugates is not excluded. DEPRECATED remains the right curation status
          - the model has no direct support and a more parsimonious alternative exists - but it is disfavored
          rather than experimentally falsified. The decisive experiment is still outstanding: tick galactosyltransferase
          knockout or knockdown combined with controlled host blood and a sensitization readout, designed
          to separate loss of alpha-gal synthesis from impaired tick viability and feeding.'
      selected_evidence:
        snippet: non-primate mammals, including dogs, have the ability to synthetize α-Gal and, thus,
          their immune system is not expected to naturally generate the antibodies toward this self-antigen
          molecule
        supports: NO_EVIDENCE
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/2
      context_paths:
