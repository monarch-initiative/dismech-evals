      - /disease_term
    evidence_metadata:
      reference: PMID:31540167
      reference_title: Tick Bites Induce Anti-α-Gal Antibodies in Dogs.
      evidence_source: MODEL_ORGANISM
      explanation: Does not bear on the antigen-source question. Alpha-gal is the identical epitope whether
        a tick synthesized it or carried it over from a prior mammalian host, so anti-alpha-gal antibodies
        in a dog show only that the tick-bite context can break tolerance to a self-glycan, not where
        the glycan came from. Experimental infestation in this study raised anti-alpha-gal IgM alone,
        with IgG explicitly unchanged and no IgE increase.
