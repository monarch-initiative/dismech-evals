    evidence_metadata:
      reference: PMID:35493735
      reference_title: Recently Evolved Francisella-Like Endosymbiont Outcompetes an Ancient and Evolutionarily
        Associated Coxiella-Like Endosymbiont in the Lone Star Tick (Amblyomma americanum) Linked to the
        Alpha-Gal Syndrome.
      evidence_source: OTHER
      explanation: Establishes that laboratory-reared lone star ticks, the source of the salivary gland
        extract used in sensitization experiments, carry an abundant endosymbiont across all tissues and
        stages, so those experiments cannot have tested a microorganism-free preparation.
