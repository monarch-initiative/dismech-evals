      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tick_salivary_constituent_sensitization
        hypothesis_label: Tick-Intrinsic Salivary Constituent Model
        status: CANONICAL
        description: The anti-alpha-gal IgE response is induced by normal, tick-derived constituents of
          tick saliva. Contemporary work supports ticks synthesizing alpha-gal via their own galactosyltransferases
          and presenting it, together with Th2-skewing salivary factors, at the bite site, so the sensitizing
          antigen is intrinsic to the tick rather than borrowed.
        notes: 'Promoted from ALTERNATIVE to CANONICAL for the antigen-source question. The 2026 openscientist
          hypothesis-search report (kb/hypotheses/Alpha-gal_Syndrome/tick_salivary_constituent_sensitization)
          reviewed 80+ primary papers and found convergent support: tick galactosyltransferases cloned
          and functionally validated (PMID:30242261), alpha-gal glycolipids detected directly in Amblyomma
          americanum saliva by mass spectrometry (PMID:39053323), feeding-independent alpha-gal in tick
          salivary glands (PMID:38741222), and tick salivary gland extract alone sufficient to induce
          AGS-like sensitization in AGKO mice (PMID:34034363). CANONICAL is scoped to the antigen SOURCE
          only; the downstream IgE class-switching step for a carbohydrate antigen remains unresolved
          (see the disc_ags_ige_class_switch_site knowledge gap). The committed assessment of that report
          graded it PARTIALLY_SUPPORTED and declined the proposed upgrade to a fully supported source-and-sensitization
          chain: the four pillars establish biosynthetic capacity, antigen presence and extract sufficiency
          in separate systems and species, but no single experiment traces the alpha-gal that sensitizes
          a host in a natural bite back to tick synthesis. The saliva mass spectrometry used sheep-fed
          ticks and its authors called the glycolipid origin inconclusive; the AGKO inoculum was partially
          blood fed extract; the Hyalomma comparison used vegetation-collected adults rather than blood-meal-naive
          ticks. A galactosyltransferase-perturbation sensitization experiment under controlled host blood
          remains the outstanding test. A separate lead, not yet integrated as a claim of this entry:
          a tsetse fly case series reports allergic reactions with galactosyltransferase transcripts detected
          in Glossina fuscipes fuscipes (PMID:40485140), which would extend endogenous arthropod alpha-gal
          production beyond ticks, but the authors call that production putative and the series carries
          possible alternative arthropod exposures.'
      selected_evidence:
        snippet: activation of basophils by extracted alpha-gal bound lipids and proteins
        supports: SUPPORT
