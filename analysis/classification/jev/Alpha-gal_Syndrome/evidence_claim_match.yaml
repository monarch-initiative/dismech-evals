            id: CL:0000451
            label: dendritic cell
        - preferred_term: T-helper 2 cell
          term:
            id: CL:0000546
            label: T-helper 2 cell
        biological_processes:
        - preferred_term: T-helper 2 cell differentiation
          term:
            id: GO:0045064
            label: T-helper 2 cell differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: Twenty-five patients living in a tick-endemic region of Sydney, New South Wales developed
          red meat allergy after experiencing large local reactions to tick bites.
        supports: SUPPORT
