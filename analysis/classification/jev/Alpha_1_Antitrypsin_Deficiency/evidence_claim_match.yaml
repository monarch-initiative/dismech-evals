    evidence_metadata:
      reference: PMID:35868681
      reference_title: Alpha-1 Antitrypsin Deficiency Liver Disease.
      evidence_source: OTHER
      explanation: Attributes the liver disease to accumulation of mutant Z protein polymers, i.e. a proteotoxic
        rather than a loss-of-function mechanism.
