        snippet: Alpha-1 antitrypsin deficiency (AATD) can present with hepatic dysfunction in individuals
          from infancy to adulthood and with chronic obstructive lung disease (emphysema and/or bronchiectasis),
          characteristically in individuals older than age 30 years.
