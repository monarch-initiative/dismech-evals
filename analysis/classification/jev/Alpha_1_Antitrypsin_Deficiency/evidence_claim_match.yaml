        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: MechanisticNosologyAssignment
      assertion:
        classification_value: proteotoxic disease
        notes: 'The hepatic arm is a toxic gain-of-function from misfolded Z-AAT polymerizing and being
          retained in the hepatocyte endoplasmic reticulum - the archetypal serpinopathy. This is deliberately
          a claim about the liver disease only: the emphysema arm is a loss-of-function antiprotease deficiency,
          not a proteotoxic one, and the two arms of this disease have opposite mechanistic characters.'
      selected_evidence:
        snippet: Liver disease in homozygous ZZ alpha-1 antitrypsin (AAT) deficiency occurs due to the
          accumulation of large quantities of AAT mutant Z protein polymers in the liver.
        supports: SUPPORT
    origin:
      assertion_path: /classifications/mechanistic_category/0
      evidence_path: /classifications/mechanistic_category/0/evidence/0
      context_paths:
