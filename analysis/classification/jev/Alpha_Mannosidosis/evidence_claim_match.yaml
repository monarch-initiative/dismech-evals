        discussion_id: mismatch_alpha_mannosidosis_mouse_hearing_motor_fidelity
        prompt: 'Why does the alpha-mannosidase-deficient mouse reproduce storage neuropathology and behavioral
          changes but not the progressive hearing and basic neuromotor impairment prominent in human alpha-mannosidosis?

          '
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Neurodevelopmental and motor impairment
        - phenotypes#Hearing impairment
        rationale: 'The knockout model is informative for neuronal storage, hippocampal physiology, and
          selected behavioral domains, but normal auditory-evoked potentials and basic neuromotor performance
          show that its fidelity is domain-specific. Preclinical rescue in this model should not be generalized
          to human hearing or motor outcomes without orthogonal validation.

          '
      selected_evidence:
        snippet: Brainstem auditory-evoked potentials and basic neuromotor abilities were not impaired
          and did not deteriorate with age.
        supports: SUPPORT
