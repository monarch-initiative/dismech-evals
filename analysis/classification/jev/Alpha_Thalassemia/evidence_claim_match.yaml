      assertion_type: Pathophysiology
      assertion:
        name: Defective Alpha-Globin Synthesis
        description: 'Deletions or point mutations in HBA1 and/or HBA2 genes reduce or abolish alpha-globin
          chain production. Large deletions are the most common cause, removing one or both alpha-globin
          genes on chromosome 16p13.3. Non-deletional mutations (point mutations, small insertions/deletions)
          tend to produce more severe phenotypes for the same number of affected alleles.

          '
        genes:
        - preferred_term: HBA1
          term:
            id: hgnc:4823
            label: HBA1
        - preferred_term: HBA2
          term:
            id: hgnc:4824
            label: HBA2
        biological_processes:
        - preferred_term: hemoglobin biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0042541
            label: hemoglobin biosynthetic process
        cell_types:
        - preferred_term: erythroblast
          term:
            id: CL:0000765
            label: erythroblast
      selected_evidence:
        snippet: characterized by decreased synthesis of α-globin chains that results in an imbalance
          of α and β globin
        supports: SUPPORT
    origin:
