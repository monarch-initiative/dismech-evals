  0700126e94f79d55dac6212212736ac880f3942f52e8a669f4d561b9d7bda687:
    claim:
      about:
        disease:
          name: Alpha Thalassemia
          disease_term:
            preferred_term: alpha thalassemia
            term:
              id: MONDO:0011399
              label: alpha thalassemia spectrum
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Beta-Globin Chain Excess and Hemoglobin H Formation
        description: 'In the absence of sufficient alpha-globin chains, excess beta-globin chains form
          unstable tetramers called hemoglobin H (beta4). HbH precipitates as inclusion bodies in mature
          red cells, causing membrane damage and premature destruction. In the most severe form (Hb Bart
          syndrome), excess gamma-globin chains form hemoglobin Bart (gamma4), which has extremely high
          oxygen affinity and cannot deliver oxygen to tissues.

          '
        biological_processes:
        - preferred_term: response to oxidative stress
          modifier: INCREASED
          term:
            id: GO:0006979
            label: response to oxidative stress
        - preferred_term: hemoglobin biosynthetic process
          modifier: ABNORMAL
          term:
            id: GO:0042541
            label: hemoglobin biosynthetic process
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
      selected_evidence:
        snippet: varying degrees of ineffective erythropoiesis, decreased red blood cell (RBC) survival,
          chronic hemolytic anemia, and subsequent comorbidities
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38182489
      reference_title: 'Αlpha-thalassemia: A practical overview.'
      evidence_source: HUMAN_CLINICAL
      explanation: Confirms that alpha-thalassemia leads to ineffective erythropoiesis, decreased RBC
        survival, and chronic hemolytic anemia.
