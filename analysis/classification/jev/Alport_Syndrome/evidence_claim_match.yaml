        prompt: 'Does initiating renin-angiotensin system blockade at the earliest (microhematuria-only)
          stage, before the onset of proteinuria, improve long-term kidney outcomes compared with starting
          at proteinuria onset?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Microscopic Hematuria
        rationale: 'ACE inhibitors/ARBs delay ESKD in Alport syndrome, and microhematuria precedes proteinuria
          by years, but the optimal threshold for starting therapy - at the hematuria-only stage versus
          at proteinuria onset - is not established, leaving a key preventive window uncertain.

          '
        proposed_experiments:
        - experiment_id: exp_alport_early_raas_rct
          name: Early versus proteinuria-triggered RAAS blockade trial
          description: 'Randomize children/young adults with genetically confirmed Alport syndrome and
            microhematuria but no proteinuria to early RAAS blockade versus initiation at proteinuria
            onset, with ESKD-free survival and eGFR slope as endpoints, to define the optimal treatment
            window.

            '
          experiment_type:
            preferred_term: randomized controlled trial
      selected_evidence:
        snippet: Angiotensin-converting enzyme inhibitor or angiotensin receptor blocker to delay onset
          of ESKD
        supports: SUPPORT
