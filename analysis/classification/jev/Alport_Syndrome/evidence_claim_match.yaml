        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_alport_female_adas_progression
        prompt: 'What genetic and non-genetic modifiers predict which heterozygous females with X-linked
          Alport syndrome, and which individuals with autosomal dominant Alport syndrome, will progress
          to end-stage kidney disease, given that their course is highly variable and often delayed until
          later adulthood?

          '
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#GBM Structural Deterioration
        rationale: 'X-linked carrier females and autosomal dominant Alport syndrome show wide, poorly
          predictable variability in renal outcome - many reach ESKD only in later adulthood or not at
          all - so clinicians cannot reliably stratify risk or time nephroprotective therapy. Identifying
          predictive genotype (variant type/position, X-inactivation) and non-genetic modifiers would
          enable risk-adapted surveillance and treatment.

          '
        proposed_experiments:
        - experiment_id: exp_alport_female_adas_cohort
          name: Prospective modifier cohort in XLAS females and ADAS
          description: 'Follow a genotyped prospective cohort of heterozygous XLAS females and ADAS individuals
            from the hematuria-only stage, integrating variant type/position, X-inactivation, proteinuria
            trajectory, and candidate modifier loci, to derive and validate a model predicting progression
            to ESKD.

            '
          experiment_type:
            preferred_term: prospective cohort study
      selected_evidence:
        snippet: In females with XLAS and individuals with autosomal dominant Alport syndrome (ADAS),
          ESKD is frequently delayed until later adulthood, SNHL is relatively late in onset, and ocular
          involvement is rare.
        supports: SUPPORT
