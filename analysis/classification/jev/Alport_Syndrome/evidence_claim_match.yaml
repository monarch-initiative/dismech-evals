  0b16791330755f7d8bcd1a44a8f44cb22272c5f335fafeecc7afa9bb5333e353:
    claim:
      about:
        disease:
          name: Alport Syndrome
          disease_term:
            preferred_term: Alport syndrome
            term:
              id: MONDO:0018965
              label: Alport syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: Digenic
        display_name: Digenic Alport Syndrome
        subtype_term:
          preferred_term: digenic Alport syndrome
          term:
            id: MONDO:0958104
            label: digenic Alport syndrome
        description: 'A distinct named entity for pathogenic variants in two of the three collagen IV
          genes (COL4A3 plus COL4A4, or COL4A5 together with COL4A3 or COL4A4), accounting for approximately
          1.7% of Alport syndrome cases in a large single-center cohort. The second variant raises the
          fraction of defective alpha3-alpha4-alpha5(IV) heterotrimers above the ~50% seen in autosomal
          dominant disease -- to 75% for COL4A3+COL4A4 digenic disease, and to a comparable 75% in women
          who already carry a pathogenic COL4A5 variant -- without reaching the ~100% of autosomal recessive
          or hemizygous X-linked disease. For COL4A3+COL4A4 digenic disease specifically, the two variants
          transmit as autosomal dominant when they lie on the same chromosome (in cis) or in an autosomal-recessive-like
          pattern when on different chromosomes (in trans); this cross-cutting of the inheritance-mode
          axis is why digenic disease is curated as its own subtype rather than folded into the autosomal
          dominant or recessive entries above. Clinical severity -- age at proteinuria detection and at
          end-stage kidney disease -- is intermediate between the autosomal dominant and autosomal recessive
          forms. This named entity is distinct from, and additive to, the general digenic inheritance
          model described below in `inheritance`; the two record different claims (a specific MONDO disease
          concept vs. the mode-of-transmission pattern) and neither supersedes the other.

          '
        genes:
        - preferred_term: COL4A3
          term:
            id: hgnc:2204
            label: COL4A3
        - preferred_term: COL4A4
          term:
            id: hgnc:2206
            label: COL4A4
        - preferred_term: COL4A5
          term:
            id: hgnc:2207
            label: COL4A5
      selected_evidence:
        snippet: The COL4A3 and COL4A4 genes occur head-to-head on chromosome 2, and inheritance is autosomal
          dominant when both variants affect the same chromosome (in cis) or recessive when they affect
          different chromosomes (in trans).
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/3
      evidence_path: /has_subtypes/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35675912
      reference_title: Digenic Alport Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Supports the cis/trans transmission-pattern distinction for COL4A3+COL4A4 digenic
        disease, the point that keeps it from mapping cleanly onto either existing inheritance-mode subtype.

        '
