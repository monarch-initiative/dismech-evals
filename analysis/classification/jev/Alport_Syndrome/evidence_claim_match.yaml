      - /disease_term
    evidence_metadata:
      reference: PMID:28275241
      reference_title: Characterization of contiguous gene deletions in COL4A6 and COL4A5 in Alport syndrome-diffuse
        leiomyomatosis.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Molecular basis for why the deletion produces the smooth-muscle phenotype rather than
        isolated Alport syndrome: inactivation of both COL4A5 and COL4A6, not COL4A5 alone.

        '
