  cc29737e41f15642ab12d95a5052d407e7449b76281083566c0d3f9e399115eb:
    claim:
      about:
        disease:
          name: Alport Syndrome
          disease_term:
            preferred_term: Alport syndrome
            term:
              id: MONDO:0018965
              label: Alport syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: AS-DL
        display_name: X-linked Diffuse Leiomyomatosis-Alport Syndrome (AS-DL)
        subtype_term:
          preferred_term: X-linked diffuse leiomyomatosis-Alport syndrome
          term:
            id: MONDO:0010641
            label: X-linked diffuse leiomyomatosis-Alport syndrome
        description: 'A contiguous-gene deletion spanning the 5'' ends of COL4A5 and the adjacent COL4A6
          gene at Xq22.3, combining X-linked Alport syndrome with diffuse leiomyomatosis: benign overgrowth
          of visceral smooth muscle, characteristically of the esophagus and tracheobronchial tree and
          sometimes the female genital tract. The bidirectional promoter region shared by both genes lies
          within the deleted segment, and inactivation of both COL4A5 and COL4A6 is thought to be required
          for the leiomyomatosis component. Already curated in this entry as the "Diffuse Leiomyomatosis"
          phenotype and the matched "Leiomyoma Surgery (COL4A5-COL4A6 Deletion Subtype)" treatment; this
          binding gives that existing content a named subtype entity. Note that MONDO does not nest this
          concept under Alport syndrome -- its declared parents are "kidney disorder" and "partial deletion
          of the long arm of chromosome X" -- so it sits outside the ontology branch the other subtypes
          in this list share, even though it is clinically and mechanistically an X-linked Alport variant.

          '
        genes:
        - preferred_term: COL4A5
          term:
            id: hgnc:2207
            label: COL4A5
        - preferred_term: COL4A6
          term:
            id: hgnc:2208
            label: COL4A6
      selected_evidence:
        snippet: 'Alport syndrome-diffuse leiomyomatosis (AS-DL, OMIM: 308940) is a rare variant of the
          X-linked Alport syndrome that shows overgrowth of visceral smooth muscles in the gastrointestinal,
          respiratory and female reproductive tracts in addition to renal symptoms.'
        supports: SUPPORT
