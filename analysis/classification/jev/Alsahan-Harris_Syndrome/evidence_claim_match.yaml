      assertion_type: Pathophysiology
      assertion:
        name: TBC1D32/BROMI Ciliary Trafficking and IFT Turnaround Defect
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        biological_scale: CELLULAR
        description: TBC1D32 (BROMI) is a ciliary protein required for the intraflagellar transport (IFT)
          turnaround at the ciliary tip. It interacts with CCRK/CDK20, which phosphorylates and activates
          the ICK/CILK1 kinase that controls the change in direction of the IFT machinery. Loss of TBC1D32
          function (modelled by BROMI-knockout cells and mouse mutants) produces abnormally long cilia
          with accumulation of IFT proteins and ICK at the bulged ciliary tip, deranging the bidirectional
          cargo trafficking on which cilium-dependent signaling depends.
        genes:
        - preferred_term: TBC1D32
          term:
            id: hgnc:21485
            label: TBC1D32
        cell_types:
        - preferred_term: ciliated cell
          term:
            id: CL:0000064
            label: ciliated cell
        biological_processes:
        - preferred_term: intraflagellar transport
          term:
            id: GO:0042073
            label: intraciliary transport
          modifier: ABNORMAL
        - preferred_term: cilium assembly
          term:
            id: GO:0060271
            label: cilium assembly
          modifier: ABNORMAL
        - preferred_term: protein localization to cilium
          term:
            id: GO:0061512
            label: protein localization to cilium
          modifier: ABNORMAL
      selected_evidence:
        snippet: BROMI/TBC1D32 interacts with CCRK/CDK20, which phosphorylates and activates the intestinal
          cell kinase (ICK)/CILK1 kinase, to regulate the change in direction of the IFT machinery at
          the ciliary tip.
        supports: SUPPORT
    origin:
