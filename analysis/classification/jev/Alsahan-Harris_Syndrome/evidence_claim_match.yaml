      assertion_type: Pathophysiology
      assertion:
        name: Impaired Hedgehog Signal Transduction
        conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
        biological_scale: CELLULAR
        description: The CCRK-BROMI(TBC1D32) module governs ciliary Hedgehog signaling. Loss of CCRK or
          its TBC1D32/BROMI partner causes overaccumulation of IFT proteins at the ciliary tip and abnormal
          enrichment of Hedgehog pathway components (GPR161 and Smoothened) on the ciliary membrane, deregulating
          cilium-dependent Hedgehog signal transduction. Because Hedgehog signaling patterns the limb
          and craniofacial midline, its disruption underlies the polydactyly and oral-facial-digital malformations
          of the syndrome.
        biological_processes:
        - preferred_term: Hedgehog (smoothened) signaling pathway
          term:
            id: GO:0007224
            label: smoothened signaling pathway
          modifier: DYSREGULATED
      selected_evidence:
        snippet: the overaccumulation of IFT proteins at the bulged ciliary tips, which appear to be eliminated
          as extracellular vesicles, and the enrichment of GPR161 and Smoothened on the ciliary membrane
        supports: SUPPORT
