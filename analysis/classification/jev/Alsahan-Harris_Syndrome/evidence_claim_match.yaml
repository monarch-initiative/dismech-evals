        context: []
      assertion_type: Genetic
      assertion:
        name: TBC1D32 (BROMI) Variants
        association: Causative
        gene_term:
          preferred_term: TBC1D32
          term:
            id: hgnc:21485
            label: TBC1D32
        notes: Biallelic (homozygous or compound heterozygous) variants in TBC1D32 (6q22), historically
          named BROMI or C6orf170, cause Alsahan-Harris syndrome (OMIM:621307). TBC1D32/BROMI functions
          with CCRK/CDK20 and ICK/CILK1 to regulate IFT turnaround at the ciliary tip and cilium-dependent
          Hedgehog signaling. Reported loss-of-function alleles include frameshift and splice-site variants;
          RNA analysis of recent splice variants demonstrated exon skipping with premature truncation.
          The human TBC1D32-related ciliopathy was first reported in the 2014 OFD-IX series (PMID:24285566),
          confirmed by Alsahan and Alkuraya (PMID:32573025), and expanded by Harris et al. (PMID:36826837).
      selected_evidence:
        snippet: Biallelic TBC1D32 variants underlie syndromic hypopituitarism
        supports: SUPPORT
