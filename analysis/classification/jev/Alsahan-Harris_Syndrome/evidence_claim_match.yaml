      assertion_type: Discussion
      assertion:
        discussion_id: tbc1d32_multisystem_mechanism_model_fidelity
        prompt: Do the knockout-cell, Xenopus, and retinal-organoid mechanisms reproduce the tissue-specific
          consequences of patient TBC1D32 alleles across the complete human syndrome?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#TBC1D32/BROMI Ciliary Trafficking and IFT Turnaround Defect
        - pathophysiology#Impaired Hedgehog Signal Transduction
        rationale: IFT-turnaround evidence is dominated by engineered knockout cells and the Hedgehog
          inference partly relies on CCRK-knockout experiments. Patient-derived retinal models provide
          strong tissue-specific support, but no single model currently recapitulates the craniofacial,
          pituitary, retinal, auditory, and prenatal manifestations together.
        proposed_experiments:
        - experiment_id: exp_tbc1d32_isogenic_ift_rescue
          name: Isogenic patient-allele IFT-turnaround and rescue study
          description: Introduce representative patient loss-of-function and splice alleles into isogenic
            human ciliated-cell models and compare IFT turnaround, ciliary-tip cargo accumulation, and
            wild-type rescue.
        - experiment_id: exp_tbc1d32_developmental_hedgehog_response
          name: Patient-allele Hedgehog-response study in developmental cell models
          description: Test GLI processing and Hedgehog target-gene responses in patient-derived hypothalamic-pituitary
            and craniofacial developmental models.
        - experiment_id: exp_tbc1d32_cross_organoid_allelic_series
          name: Cross-organoid TBC1D32 allelic series
          description: Compare allele-specific phenotypes across retinal, pituitary, and craniofacial
            organoids.
      selected_evidence:
        snippet: our results suggested photoreceptor differentiation defects, including connecting cilium
          anomalies, that resulted in impaired trafficking to the outer segment in cones and rods
        supports: SUPPORT
