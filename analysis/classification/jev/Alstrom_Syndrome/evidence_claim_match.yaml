        prompt: Why do current Alms1-deficient mouse models reproduce adult cardiac dysfunction only incompletely
          and fail to reproduce infantile cardiomyopathy?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cardiac Fibroelastotic Remodeling
        rationale: Human disease is biphasic, but global knockout mice had normal cardiac function at
          postnatal day 15 and eight weeks; only adult females developed early restrictive features. This
          sex- and age-limited phenotype constrains translation of mouse cardiac mechanisms and motivates
          complementary human iPSC and longitudinal in-vivo studies.
      selected_evidence:
        snippet: Cardiac function was unaltered in Alms1 global KO mice of both sexes at postnatal day
          15 (P15) and 8 weeks. At 23 weeks, female - but not male - KO mice showed increased left atrial
          area and decreased isovolumic relaxation time, consistent with early restrictive cardiomyopathy,
          as well as reduced ejection fraction.
        supports: SUPPORT
