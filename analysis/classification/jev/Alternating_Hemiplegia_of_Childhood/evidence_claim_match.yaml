      assertion_type: DifferentialDiagnosis
      assertion:
        name: Familial hemiplegic migraine
        disease_term:
          preferred_term: familial hemiplegic migraine
          term:
            id: MONDO:0000700
            label: familial hemiplegic migraine
        description: 'Familial hemiplegic migraine overlaps with AHC through episodic hemiplegia and through
          the Na+/K+-ATPase alpha subunit family, but the two disorders have different genes: AHC is caused
          by ATP1A3, while the FHM2 subtype is caused by the paralogous ATP1A2. Headache-predominant attacks
          and the broader infantile AHC phenotype favor FHM only when migraine features dominate.'
        distinguishing_features:
        - Migraine aura and headache are more prominent in familial hemiplegic migraine.
        - AHC typically begins before 18 months and includes sleep-resolving, trigger-sensitive attacks
          with dystonia and nystagmus.
        - The shared Na+/K+-ATPase involvement is paralogy between ATP1A3 (AHC) and ATP1A2 (FHM2), not
          a shared locus; sporadic AHC has not been attributed to ATP1A2.
      selected_evidence:
