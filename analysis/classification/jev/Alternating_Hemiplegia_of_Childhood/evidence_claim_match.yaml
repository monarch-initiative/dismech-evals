      assertion_type: Pathophysiology
      assertion:
        name: ATP1A3-Dependent Cardiac Conduction Dysfunction
        biological_scale: TISSUE
        description: ATP1A3 is expressed in cardiac conduction tissue in addition to neurons. A multicenter
          cohort found frequent resting and Holter ECG repolarization or conduction abnormalities across
          the ATP1A3-related syndrome spectrum (AHC, RDP, CAPOS), with dynamic serial-ECG changes and
          normal echocardiography (a primary electrical, not structural, disease). An Atp1a3 knock-in
          mouse showed baseline intracardiac conduction delay that progressed to heart block or complete
          sinus arrest during induced seizures, causing sudden death - a seizure-triggered mechanism for
          sudden cardiac death that parallels the human life-threatening-arrhythmia risk identified in
          this cohort.
        locations:
        - preferred_term: cardiac conduction system
          term:
            id: UBERON:0002350
            label: conducting system of heart
        biological_processes:
        - preferred_term: cardiac conduction
          term:
            id: GO:0061337
            label: cardiac conduction
          modifier: DYSREGULATED
      selected_evidence:
        snippet: The first Holter ECG was abnormal in 24 of 65 (37%) cases with AHC and RDP with either
          repolarization or conduction abnormalities.
        supports: SUPPORT
