        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        description: ACDMPV results from heterozygous FOXF1 sequence variants or deletion copy-number
          variants affecting FOXF1 or its distant enhancer, so inheritance is formally autosomal dominant.
          Most affected children have a de novo lesion, although parental transmission from an unaffected
          or mosaic parent and familial recurrence are documented.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        de_novo_rate: All 31 parentally resolved pathogenic 16q24.1 deletions in the cited cohort were
          de novo; this estimate does not apply to every FOXF1 sequence variant.
        parent_of_origin_effect: 'Thirty of 31 parentally resolved pathogenic 16q24.1 deletions arose
          on the maternally inherited chromosome 16. This strongly supports parent-specific regulation
          of the distant enhancer, but it does not establish complete paternal-allele silencing: pathogenic
          paternal-chromosome lesions occur, FOXF1 is transcribed from both alleles, and enhancer methylation
          studies do not support a simple whole-locus imprinting model.'
      selected_evidence:
        snippet: Alveolar capillary dysplasia with misalignment of pulmonary veins (ACDMPV) is a lethal
          lung developmental disorder caused by heterozygous point mutations or genomic deletion copy-number
          variants (CNVs) of FOXF1 or its upstream enhancer involving fetal lung-expressed long noncoding
          RNA genes LINC01081 and LINC01082.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27071622
      reference_title: Pathogenetics of alveolar capillary dysplasia with misalignment of pulmonary veins.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes heterozygous coding and enhancer lesions at the FOXF1 locus as the cause,
        including the long non-coding RNA enhancer element.
