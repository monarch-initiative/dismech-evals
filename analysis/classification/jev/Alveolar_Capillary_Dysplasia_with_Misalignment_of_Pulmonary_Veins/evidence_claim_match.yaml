      assertion_type: Diagnosis
      assertion:
        name: Molecular testing including copy-number analysis
        description: Molecular confirmation requires sequencing FOXF1 together with copy-number analysis
          spanning the upstream enhancer region. Sequencing alone will miss the substantial fraction of
          patients whose lesion is an enhancer deletion leaving the coding sequence intact.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Heterozygous point mutations in FOXF1 (OMIM 601089) and genomic deletion copy-number
          variants (CNVs) at chromosomal region 16q24.1 including FOXF1 or its upstream regulatory region
          have been identified in the vast majority of patients with ACDMPV
        supports: SUPPORT
