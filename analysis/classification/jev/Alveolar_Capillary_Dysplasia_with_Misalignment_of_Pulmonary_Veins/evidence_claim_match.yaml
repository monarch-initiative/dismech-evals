            term:
              id: MONDO:0009934
              label: alveolar capillary dysplasia with misalignment of pulmonary veins
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_acdmpv_direction_of_angiogenic_therapy
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Should experimental therapy restore capillary angiogenesis through STAT3, or suppress
          maladaptive intussusceptive angiogenesis and TIE2 signalling?
        attaches_to:
        - pathophysiology#Failed Pulmonary Microvascular Angiogenesis
        rationale: STAT3 delivery restored endothelial proliferation and stimulated lung angiogenesis
          in one Foxf1 S52F neonatal mouse model. Human ACD lung tissue, however, shows abundant intussusceptive
          angiogenesis with increased CXCR4, HIF1A and angiopoietin signalling and has prompted the opposite
          therapeutic proposal—anti-angiogenic intervention. These findings may reflect different vessel
          compartments, disease stages or productive versus nonproductive angiogenesis; treating them
          as interchangeable would be unsafe.
        proposed_experiments:
        - experiment_id: exp_acdmpv_compartment_resolved_angiogenic_rescue
          name: Compartment-resolved comparison of pro- and anti-angiogenic intervention
          description: Compare STAT3 restoration with selective CXCR4 or TIE2 modulation in patient-derived
            vascular organoids and Foxf1 S52F mice, separating alveolar capillary endothelial cells, systemic
            bronchial endothelium and intussusceptive pillars over developmental time.
          decision_criterion: A useful intervention must increase correctly apposed alveolar capillaries
            and gas exchange without expanding dysfunctional bronchial or intussusceptive vessels.
          supporting_outcome:
          - Productive capillary differentiation, rather than total angiogenic activity, is the therapeutic
            target
          refuting_outcome:
          - Total angiogenic activity alone predicts restoration of gas exchange
      selected_evidence:
        snippet: nanoparticle delivery of STAT3 cDNA into the neonatal circulation restored endothelial
          proliferation and stimulated lung angiogenesis in Foxf1WT/S52F mice.
        supports: SUPPORT
