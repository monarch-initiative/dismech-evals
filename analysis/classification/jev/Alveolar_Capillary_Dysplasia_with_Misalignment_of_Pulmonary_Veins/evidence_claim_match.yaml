      assertion_type: Pathophysiology
      assertion:
        name: FOXF1 Coding or Upstream Enhancer Lesion
        biological_scale: MOLECULAR
        description: 'The causal lesion is either a heterozygous point mutation in FOXF1 itself or, frequently,
          a deletion of the distant upstream enhancer region at 16q24.1 that contains the fetal lung-expressed
          long non-coding RNA genes LINC01081 and LINC01082. The enhancer route is what makes exome-only
          testing an incomplete strategy here: the coding sequence can be entirely normal while the gene
          is functionally silenced in lung.'
        genes:
        - preferred_term: FOXF1
          term:
            id: hgnc:3809
            label: FOXF1
      selected_evidence:
        snippet: We describe novel deletion CNVs at the FOXF1 locus in 13 unrelated ACDMPV patients.
        supports: SUPPORT
