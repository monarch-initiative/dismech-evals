        hypothesis_label: Parent-Specific FOXF1 Enhancer Activity
        status: EMERGING
        description: The marked maternal-chromosome bias of pathogenic enhancer deletions is best treated
          as evidence for parent-specific functional asymmetry within the bipartite lung enhancer, not
          as proof that the paternal FOXF1 allele is globally silenced. Unit 1 may be more active on paternal
          chromosome 16 and Unit 2 on maternal chromosome 16; the molecular basis, developmental window,
          and penetrance of this asymmetry remain unresolved.
      selected_evidence:
        snippet: all 31 genomic deletions in 16q24.1, pathogenic for ACDMPV, for which parental origin
          was determined, arose de novo with 30 of them occurring on the maternally inherited chromosome
          16, strongly implicating genomic imprinting of the FOXF1 locus in human lungs
        supports: SUPPORT
