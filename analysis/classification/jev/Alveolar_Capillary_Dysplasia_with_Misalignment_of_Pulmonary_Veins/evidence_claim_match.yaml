            term:
              id: MONDO:0009934
              label: alveolar capillary dysplasia with misalignment of pulmonary veins
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_acdmpv_imprinting_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What molecular mechanism creates parent-specific activity across the two FOXF1 enhancer
          units, and how does it vary by lung cell type and developmental stage?
        attaches_to:
        - pathophysiology#Parent-Specific FOXF1 Enhancer Activity
        rationale: Thirty of thirty-one parentally resolved deletions arose on the maternal chromosome,
          yet paternal-chromosome pathogenic lesions occur and FOXF1 is transcribed from both alleles.
          Methylation data exclude a simple maternal enhancer-imprinting model, while later work proposes
          a bipartite enhancer with opposing parent-specific activity. Resolving the mechanism matters
          for recurrence counselling and interpretation of inherited enhancer variants.
        proposed_experiments:
        - experiment_id: exp_acdmpv_allele_specific_lung_expression
          name: Allele-specific FOXF1 expression across human fetal lung development
          description: Perform allele-specific expression and methylation profiling across the 16q24.1
            locus in human fetal lung at successive gestational ages, in parallel with the same measurements
            in intestine and heart, to map where and when enhancer-unit asymmetry is established and whether
            effect size correlates with deletion position.
          decision_criterion: Reproducible parent-specific expression and chromatin activity that maps
            separately to enhancer Units 1 and 2 would support functional dimorphism.
          supporting_outcome:
          - Parent-specific enhancer-unit activity is cell-type- and developmental-stage-dependent
          refuting_outcome:
          - Both enhancer units have equivalent activity on maternal and paternal chromosomes
      selected_evidence:
        snippet: FOXF1 seems to be similarly transcribed from both alleles, which opposes imprinting of
          the FOXF1 transcription region itself
        supports: SUPPORT
    origin:
