  6a24ec2c17c4d1cd0bf79cd6fe840cfb05f05c63f97c5e6224a3c8ab68bf511f:
    claim:
      about:
        disease:
          name: Alveolar Rhabdomyosarcoma
          disease_term:
            preferred_term: alveolar rhabdomyosarcoma
            term:
              id: MONDO:0009994
              label: alveolar rhabdomyosarcoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_arms_pax_foxo1_dependency_hierarchy
        prompt: Which upstream or feedback-maintenance mechanism is required for the fusion-dependent
          regulatory program that produces the ARMS-specific open-chromatin signature, and can any chemical
          or genetic perturbation phenocopy acute fusion withdrawal at that assay readout?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#PAX-FOXO1 Fusion Oncogene
        - pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
        - pathophysiology#ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
        - pathophysiology#YOD1-N-Myc PAX-FOXO1 Feedback Loop
        - pathophysiology#HDAC3-SMARCA4-miR-27a Chemotherapy Resistance Circuit
        - pathophysiology#Chemotherapy Resistance and Relapse
        - treatments#PAX-FOXO1/ETS1 Complex Disruption
        - treatments#YOD1 Inhibition
        - treatments#Histone Deacetylase Inhibitor Therapy
        rationale: 'Older work established PAX3::FOXO1 and PAX7::FOXO1 as molecular drivers, but a 2025
          therapy review still notes that standard systemic therapy remains VAC despite decades of fusion
          knowledge. The disease model now makes the hidden middle explicit but should not treat open
          chromatin as a causal node: open chromatin is the observable readout of a fusion-dependent regulatory
          program. The causal candidates are upstream or feedback-maintenance mechanisms such as PAX-FOXO1
          protein abundance, ETS1/KDM3A cofactor occupancy, and YOD1/N-Myc stabilization. HDAC3-SMARCA4-miR-27a
          is better treated as a chemotherapy-resistance branch, and FGFR4/FGF8 signaling is better treated
          as a downstream output or feedback-control test, unless perturbation proves that either one
          feeds back onto the regulatory program. Forward curation through 2024-2026 provides partial
          therapeutic handles for those layers, but does not yet establish which handle changes the disease-defining
          regulatory state rather than only improving a downstream phenotype in one model context.'
        proposed_experiments:
        - experiment_id: exp_arms_isogenic_pax_foxo1_dependency_prioritization
          name: ARMS regulatory-state dependency screen using open chromatin as readout
          description: 'Define disease-specific open chromatin regions in matched FP-RMS models and use
            that signature as an assay readout, not as the causal mechanism. Perturb candidate causes
            of the fusion-dependent regulatory program first: acute PAX3-FOXO1 withdrawal, PAX3-FOXO1/ETS1
            complex disruption, and YOD1 inhibition. Then use HDAC inhibition as a resistance-branch test
            under chemotherapy pressure and FGFR inhibition as a downstream-output control. Compare diagnostic-like,
            relapse-like, and chemotherapy-resistant states to determine which perturbation changes the
            regulatory-state readout and which only changes viability, signaling, or drug response downstream.'
          experiment_type:
            preferred_term: isogenic dependency mapping experiment
          model_systems:
          - name: FP-RMS cell-line and patient-derived culture panel
            description: Human fusion-positive rhabdomyosarcoma models spanning PAX3-FOXO1 and PAX7-FOXO1
              states, including diagnostic-like cultures and relapse- or chemotherapy-resistance-enriched
              cultures with matched baseline ATAC-seq or equivalent open-chromatin profiles.
            experimental_model_type: CELL_LINE
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_types:
            - preferred_term: skeletal muscle myoblast
              term:
                id: CL:0000515
                label: skeletal muscle myoblast
            publication: PMID:41401084
            modeled_mechanisms:
            - target: PAX-FOXO1 Fusion Oncogene
              description: Provides the reference perturbation for complete fusion dependency.
            - target: PAX-FOXO1 Disease Enhancer Reprogramming
              description: Defines the latent regulatory program whose assayable projection is the ARMS-specific
                open chromatin signature.
            - target: ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
              description: Tests whether cofactor disruption phenocopies fusion withdrawal at disease
                enhancers.
            - target: YOD1-N-Myc PAX-FOXO1 Feedback Loop
              description: Tests whether destabilizing the feedback loop reduces the fusion-dependent
                regulatory program.
            - target: HDAC3-SMARCA4-miR-27a Chemotherapy Resistance Circuit
              description: Tests a chemotherapy-resistance branch rather than baseline regulatory-state
                maintenance.
            - target: FGFR-Driven RTK Signaling
              description: Tests a downstream signaling output and potential feedback control, not a primary
                cause of open chromatin.
            - target: Chemotherapy Resistance and Relapse
              description: Measures whether regulatory-state changes predict durable suppression of resistant
                outgrowth.
          perturbations:
          - name: Acute PAX-FOXO1 withdrawal reference
            target: pathophysiology#PAX-FOXO1 Fusion Oncogene
            description: Degrade, silence, or inducibly withdraw the fusion protein to create the reference
              regulatory-state and open-chromatin-signature change for all downstream comparisons.
          - name: PAX-FOXO1/ETS1 complex disruption
            target: treatments#PAX-FOXO1/ETS1 Complex Disruption
            description: Apply YK-4-279-like complex disruption to test whether the ETS1/KDM3A cofactor
              handle collapses PAX-FOXO1 enhancer occupancy.
          - name: YOD1 feedback-loop inhibition
            target: treatments#YOD1 Inhibition
            description: Inhibit or knock down YOD1 to destabilize PAX-FOXO1 and N-Myc and test whether
              feedback-loop collapse changes the fusion-dependent regulatory program as measured by open
              chromatin and transcriptional readouts.
          - name: HDAC3 resistance-circuit inhibition
            target: treatments#Histone Deacetylase Inhibitor Therapy
            description: Treat with entinostat or a more selective HDAC3 perturbation during chemotherapy
              exposure to test whether a resistance-specific branch is reversed. This is not interpreted
              as baseline regulatory-state maintenance unless it also shifts the fusion-withdrawal-like
              ATAC and occupancy readouts.
          - name: FGFR pathway inhibition
            target: treatments#FGFR Inhibitor Therapy
            description: Inhibit FGFR4/FGF8 signaling as a downstream-output control. A viability or ERK/AKT
              response without an ATAC or fusion-occupancy shift would classify FGFR signaling as an output
              of the regulatory program rather than a maintainer of it.
          - name: Combination rescue matrix
            target: pathophysiology#Chemotherapy Resistance and Relapse
            description: Combine upstream/feedback regulatory-state perturbations with resistance-branch
              or downstream-output inhibitors to test whether chromatin-state rescue must be paired with
              suppression of resistant outgrowth.
          readouts:
          - name: Disease-specific open chromatin signature change
            target: pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
            description: Measure whether disease-specific ATAC-seq peaks and enhancer activity shift toward
              the acute fusion-withdrawal or fusion-negative comparator state after each perturbation.
              The ATAC-seq peaks are the observable signature used to infer regulatory-state change, not
              a separate causal node in the pathograph.
            biological_processes:
            - preferred_term: chromatin remodeling
              term:
                id: GO:0006338
                label: chromatin remodeling
            - preferred_term: positive regulation of transcription by RNA polymerase II
              term:
                id: GO:0045944
                label: positive regulation of transcription by RNA polymerase II
            assays:
            - preferred_term: ATAC-seq
            - preferred_term: CUT&Tag
            - preferred_term: single-cell RNA-seq
            direction: NEGATIVE
          - name: Fusion occupancy and mechanism-specific target output
            target: pathophysiology#ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
            description: Quantify PAX-FOXO1 and ETS1 occupancy, FGF8/IL4R/MEST/PODXL expression, MYCN/N-Myc
              expression, YOD1-dependent protein abundance, and HDAC3-resistance-circuit markers after
              each perturbation to distinguish causal regulatory-state change from downstream output change.
            biological_processes:
            - preferred_term: positive regulation of transcription by RNA polymerase II
              term:
                id: GO:0045944
                label: positive regulation of transcription by RNA polymerase II
            assays:
            - preferred_term: CUT&Tag
            - preferred_term: RNA sequencing
            - preferred_term: immunoblot
            direction: NEGATIVE
          - name: Differentiation and malignant-growth response
            target: pathophysiology#Blocked Myogenic Differentiation
            description: Measure myogenic differentiation, proliferation, apoptosis, and invasive properties
              after each regulatory-state perturbation or downstream-output control.
            biological_processes:
            - preferred_term: cell differentiation
              term:
                id: GO:0030154
                label: cell differentiation
            assays:
            - preferred_term: differentiation assay
            - preferred_term: cell viability assay
            - preferred_term: invasion assay
            direction: POSITIVE
          - name: Chemotherapy-resistance reversal
            target: pathophysiology#Chemotherapy Resistance and Relapse
            description: Quantify whether regulatory-state changes or HDAC3 resistance-branch inhibition
              predict improved chemotherapy sensitivity and suppression of resistant outgrowth in relapse-like
              models.
            biological_processes:
            - preferred_term: response to xenobiotic stimulus
              term:
                id: GO:0009410
                label: response to xenobiotic stimulus
            assays:
            - preferred_term: cell viability assay
            - preferred_term: chemotherapy response assay
            direction: NEGATIVE
          controls:
          - name: Fusion-negative RMS comparator
            description: Tests whether perturbation effects are specific to PAX-FOXO1-driven disease.
          - name: Acute fusion-withdrawal positive control
            description: Defines the expected full chromatin-collapse signature for a fusion-dependent
              state.
          - name: Vehicle or non-targeting perturbation controls
            description: Baseline control for drug, degron, or genetic perturbation effects.
          decision_criterion: A mechanism is classified as regulatory-state-maintaining if its chemical
            or genetic perturbation reproducibly shifts the ARMS-specific open chromatin signature and
            fusion/cofactor occupancy toward the acute fusion-withdrawal reference, then produces coherent
            downstream effects on differentiation, proliferation or invasion, and chemotherapy response.
            A perturbation that improves viability, signaling, or chemotherapy response without changing
            the open-chromatin and occupancy readouts is classified as a downstream or branch-specific
            therapeutic handle, not as closure of the core regulatory-state gap.
          would_support:
          - pathophysiology#PAX-FOXO1 Fusion Oncogene
          - pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
          - pathophysiology#ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
          - pathophysiology#YOD1-N-Myc PAX-FOXO1 Feedback Loop
          - pathophysiology#HDAC3-SMARCA4-miR-27a Chemotherapy Resistance Circuit
          - pathophysiology#Chemotherapy Resistance and Relapse
          - pathophysiology#Blocked Myogenic Differentiation
          - pathophysiology#Aberrant Cell Proliferation
      selected_evidence:
        snippet: Although the gene fusions PAX3::FOXO1 and PAX7::FOXO1 were discovered in the early 1990s,
          and since that time shown to be the molecular drivers of the disease, the best treatment to
          date still remains VAC (vincristine, actinomycin D, cyclophosphamide) combination therapy, first
          instituted as standard of care in the 1970s.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41038289
      reference_title: Towards directed therapy for fusion-positive rhabdomyosarcoma.
      evidence_source: OTHER
      explanation: Shows that the therapy gap remains open despite longstanding knowledge of the causal
        fusion oncogenes.
