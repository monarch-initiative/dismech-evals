          target: pathophysiology#ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
          description: Quantify PAX-FOXO1 and ETS1 occupancy, FGF8/IL4R/MEST/PODXL expression, MYCN/N-Myc
            expression, YOD1-dependent protein abundance, and HDAC3-resistance-circuit markers after each
            perturbation to distinguish causal regulatory-state change from downstream output change.
          biological_processes:
          - preferred_term: positive regulation of transcription by RNA polymerase II
            term:
              id: GO:0045944
              label: positive regulation of transcription by RNA polymerase II
          assays:
          - preferred_term: CUT&Tag
          - preferred_term: RNA sequencing
          - preferred_term: immunoblot
          direction: NEGATIVE
        - name: Differentiation and malignant-growth response
          target: pathophysiology#Blocked Myogenic Differentiation
          description: Measure myogenic differentiation, proliferation, apoptosis, and invasive properties
            after each regulatory-state perturbation or downstream-output control.
          biological_processes:
          - preferred_term: cell differentiation
            term:
              id: GO:0030154
              label: cell differentiation
          assays:
          - preferred_term: differentiation assay
          - preferred_term: cell viability assay
          - preferred_term: invasion assay
          direction: POSITIVE
        - name: Chemotherapy-resistance reversal
          target: pathophysiology#Chemotherapy Resistance and Relapse
          description: Quantify whether regulatory-state changes or HDAC3 resistance-branch inhibition
            predict improved chemotherapy sensitivity and suppression of resistant outgrowth in relapse-like
            models.
          biological_processes:
          - preferred_term: response to xenobiotic stimulus
            term:
              id: GO:0009410
              label: response to xenobiotic stimulus
          assays:
          - preferred_term: cell viability assay
          - preferred_term: chemotherapy response assay
          direction: NEGATIVE
        controls:
        - name: Fusion-negative RMS comparator
          description: Tests whether perturbation effects are specific to PAX-FOXO1-driven disease.
        - name: Acute fusion-withdrawal positive control
          description: Defines the expected full chromatin-collapse signature for a fusion-dependent state.
        - name: Vehicle or non-targeting perturbation controls
          description: Baseline control for drug, degron, or genetic perturbation effects.
        decision_criterion: A mechanism is classified as regulatory-state-maintaining if its chemical
          or genetic perturbation reproducibly shifts the ARMS-specific open chromatin signature and fusion/cofactor
          occupancy toward the acute fusion-withdrawal reference, then produces coherent downstream effects
          on differentiation, proliferation or invasion, and chemotherapy response. A perturbation that
          improves viability, signaling, or chemotherapy response without changing the open-chromatin
          and occupancy readouts is classified as a downstream or branch-specific therapeutic handle,
          not as closure of the core regulatory-state gap.
        would_support:
        - pathophysiology#PAX-FOXO1 Fusion Oncogene
        - pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
        - pathophysiology#ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
        - pathophysiology#YOD1-N-Myc PAX-FOXO1 Feedback Loop
        - pathophysiology#HDAC3-SMARCA4-miR-27a Chemotherapy Resistance Circuit
        - pathophysiology#Chemotherapy Resistance and Relapse
        - pathophysiology#Blocked Myogenic Differentiation
        - pathophysiology#Aberrant Cell Proliferation
      selected_evidence:
        snippet: We further show that the PAX3-FOXO1/ETS1 complex can be disrupted by the clinically relevant
          small molecule inhibitor YK-4-279.
        supports: SUPPORT
