      assertion_type: DifferentialDiagnosis
      assertion:
        name: Embryonal rhabdomyosarcoma
        description: ERMS shares skeletal-muscle differentiation and can overlap clinically with ARMS.
          Fusion-negative tumors called ARMS by morphology frequently resemble ERMS molecularly and clinically,
          so morphology and fusion status must be reported separately.
        disease_term:
          preferred_term: embryonal rhabdomyosarcoma
          term:
            id: MONDO:0009993
            label: embryonal rhabdomyosarcoma
        distinguishing_features:
        - Predominantly alveolar architecture or monotonous solid-sheet cytology supports ARMS histology.
        - A PAX3-FOXO1 or PAX7-FOXO1 fusion supports fusion-positive RMS biology and adverse-risk stratification.
        - Fusion-negative alveolar histology has molecular and clinical behavior closer to ERMS.
      selected_evidence:
        snippet: Further, gene expression profiling of RMS shows ARMSn is highly similar to ERMS
        supports: SUPPORT
