        description: Reference multi-platform genomic landscape study of primary human rhabdomyosarcoma.
          Includes WGS (44 tumor/normal pairs at ~105× depth), WES (103 tumor/normal pairs), RNA-seq (80
          tumors), and SNP arrays (865 consented subjects in dbGaP v5). PAX3-FOXO1 (n≈35) and PAX7-FOXO1
          (n≈15) fusion-positive cases dominate the cohort. Establishes that the RTK/RAS/PIK3CA genetic
          axis is altered in 93% of cases, revealing a framework for genomics-directed therapy. Identifies
          the recurrent secondary somatic landscape (MYCN amplification, CDK4/CDKN2A alterations, TP53
          mutations) co-occurring with PAX fusions. Publicly accessible mutation summary and expression
          data via cBioPortal study rms_nih_2014; raw BAM/VCF files require dbGaP controlled-access approval.
