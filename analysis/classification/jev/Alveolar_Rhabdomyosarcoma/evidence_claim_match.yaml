      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: chromatin_feedback_maintenance_model
        hypothesis_label: Chromatin-Cofactor and Protein-Stability Feedback Model
        status: EMERGING
        description: ETS1/KDM3A chromatin cofactor activity and YOD1/N-Myc protein-stability feedback
          are candidate maintenance mechanisms for the PAX3-FOXO1 regulatory state. They are not modeled
          as downstream consequences of measured open chromatin; they are candidate inputs or feedback
          arms that can be tested against a chromatin-state readout.
        notes: Current evidence supports biochemical interaction, chromatin occupancy, target-gene regulation,
          and growth effects. It does not yet fully resolve whether these mechanisms are required upstream
          of all disease-defining chromatin features, restricted to a subset of target loci, or partly
          downstream adaptive programs.
      selected_evidence:
        snippet: The reciprocal transcriptional activation of PAX3-FOXO1 and N-Myc is critical for FP-RMS
          malignancy.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41401084
      reference_title: Therapeutic targeting of YOD1 disrupts the PAX-FOXO1/N-Myc feedback loop in rhabdomyosarcoma.
      evidence_source: IN_VITRO
      explanation: Supports the YOD1/N-Myc branch as a feedback-maintenance hypothesis rather than a simple
        downstream proliferation marker.
