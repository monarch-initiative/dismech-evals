            prompt: Which upstream or feedback-maintenance mechanism is required for the fusion-dependent
              regulatory program that produces the ARMS-specific open-chromatin signature, and can any
              chemical or genetic perturbation phenocopy acute fusion withdrawal at that assay readout?
            kind: KNOWLEDGE_GAP
            status: OPEN
            attaches_to:
            - pathophysiology#PAX-FOXO1 Fusion Oncogene
            - pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
            - pathophysiology#ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
            - pathophysiology#YOD1-N-Myc PAX-FOXO1 Feedback Loop
            - pathophysiology#HDAC3-SMARCA4-miR-27a Chemotherapy Resistance Circuit
            - pathophysiology#Chemotherapy Resistance and Relapse
            - treatments#PAX-FOXO1/ETS1 Complex Disruption
            - treatments#YOD1 Inhibition
            - treatments#Histone Deacetylase Inhibitor Therapy
            rationale: 'Older work established PAX3::FOXO1 and PAX7::FOXO1 as molecular drivers, but a
              2025 therapy review still notes that standard systemic therapy remains VAC despite decades
              of fusion knowledge. The disease model now makes the hidden middle explicit but should not
              treat open chromatin as a causal node: open chromatin is the observable readout of a fusion-dependent
              regulatory program. The causal candidates are upstream or feedback-maintenance mechanisms
              such as PAX-FOXO1 protein abundance, ETS1/KDM3A cofactor occupancy, and YOD1/N-Myc stabilization.
              HDAC3-SMARCA4-miR-27a is better treated as a chemotherapy-resistance branch, and FGFR4/FGF8
              signaling is better treated as a downstream output or feedback-control test, unless perturbation
              proves that either one feeds back onto the regulatory program. Forward curation through
              2024-2026 provides partial therapeutic handles for those layers, but does not yet establish
              which handle changes the disease-defining regulatory state rather than only improving a
              downstream phenotype in one model context.'
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: exp_arms_isogenic_pax_foxo1_dependency_prioritization
        name: ARMS regulatory-state dependency screen using open chromatin as readout
        description: 'Define disease-specific open chromatin regions in matched FP-RMS models and use
          that signature as an assay readout, not as the causal mechanism. Perturb candidate causes of
          the fusion-dependent regulatory program first: acute PAX3-FOXO1 withdrawal, PAX3-FOXO1/ETS1
          complex disruption, and YOD1 inhibition. Then use HDAC inhibition as a resistance-branch test
          under chemotherapy pressure and FGFR inhibition as a downstream-output control. Compare diagnostic-like,
          relapse-like, and chemotherapy-resistant states to determine which perturbation changes the
          regulatory-state readout and which only changes viability, signaling, or drug response downstream.'
        experiment_type:
          preferred_term: isogenic dependency mapping experiment
        model_systems:
        - name: FP-RMS cell-line and patient-derived culture panel
          description: Human fusion-positive rhabdomyosarcoma models spanning PAX3-FOXO1 and PAX7-FOXO1
            states, including diagnostic-like cultures and relapse- or chemotherapy-resistance-enriched
            cultures with matched baseline ATAC-seq or equivalent open-chromatin profiles.
          experimental_model_type: CELL_LINE
          organism:
            preferred_term: human
            term:
              id: NCBITaxon:9606
              label: Homo sapiens
          cell_types:
          - preferred_term: skeletal muscle myoblast
            term:
              id: CL:0000515
              label: skeletal muscle myoblast
          publication: PMID:41401084
          modeled_mechanisms:
          - target: PAX-FOXO1 Fusion Oncogene
            description: Provides the reference perturbation for complete fusion dependency.
          - target: PAX-FOXO1 Disease Enhancer Reprogramming
            description: Defines the latent regulatory program whose assayable projection is the ARMS-specific
              open chromatin signature.
          - target: ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
            description: Tests whether cofactor disruption phenocopies fusion withdrawal at disease enhancers.
          - target: YOD1-N-Myc PAX-FOXO1 Feedback Loop
            description: Tests whether destabilizing the feedback loop reduces the fusion-dependent regulatory
              program.
          - target: HDAC3-SMARCA4-miR-27a Chemotherapy Resistance Circuit
            description: Tests a chemotherapy-resistance branch rather than baseline regulatory-state
              maintenance.
          - target: FGFR-Driven RTK Signaling
            description: Tests a downstream signaling output and potential feedback control, not a primary
              cause of open chromatin.
          - target: Chemotherapy Resistance and Relapse
            description: Measures whether regulatory-state changes predict durable suppression of resistant
              outgrowth.
        perturbations:
        - name: Acute PAX-FOXO1 withdrawal reference
          target: pathophysiology#PAX-FOXO1 Fusion Oncogene
          description: Degrade, silence, or inducibly withdraw the fusion protein to create the reference
            regulatory-state and open-chromatin-signature change for all downstream comparisons.
        - name: PAX-FOXO1/ETS1 complex disruption
          target: treatments#PAX-FOXO1/ETS1 Complex Disruption
          description: Apply YK-4-279-like complex disruption to test whether the ETS1/KDM3A cofactor
            handle collapses PAX-FOXO1 enhancer occupancy.
        - name: YOD1 feedback-loop inhibition
          target: treatments#YOD1 Inhibition
          description: Inhibit or knock down YOD1 to destabilize PAX-FOXO1 and N-Myc and test whether
            feedback-loop collapse changes the fusion-dependent regulatory program as measured by open
            chromatin and transcriptional readouts.
        - name: HDAC3 resistance-circuit inhibition
          target: treatments#Histone Deacetylase Inhibitor Therapy
          description: Treat with entinostat or a more selective HDAC3 perturbation during chemotherapy
            exposure to test whether a resistance-specific branch is reversed. This is not interpreted
            as baseline regulatory-state maintenance unless it also shifts the fusion-withdrawal-like
            ATAC and occupancy readouts.
        - name: FGFR pathway inhibition
          target: treatments#FGFR Inhibitor Therapy
          description: Inhibit FGFR4/FGF8 signaling as a downstream-output control. A viability or ERK/AKT
            response without an ATAC or fusion-occupancy shift would classify FGFR signaling as an output
            of the regulatory program rather than a maintainer of it.
        - name: Combination rescue matrix
          target: pathophysiology#Chemotherapy Resistance and Relapse
          description: Combine upstream/feedback regulatory-state perturbations with resistance-branch
            or downstream-output inhibitors to test whether chromatin-state rescue must be paired with
            suppression of resistant outgrowth.
        readouts:
        - name: Disease-specific open chromatin signature change
          target: pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
          description: Measure whether disease-specific ATAC-seq peaks and enhancer activity shift toward
            the acute fusion-withdrawal or fusion-negative comparator state after each perturbation. The
            ATAC-seq peaks are the observable signature used to infer regulatory-state change, not a separate
            causal node in the pathograph.
          biological_processes:
