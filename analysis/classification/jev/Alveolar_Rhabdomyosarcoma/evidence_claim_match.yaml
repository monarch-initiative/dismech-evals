        title: PAX3-FOXO1 coordinates enhancer architecture, eRNA transcription, and controls RNA polymerase
          pause release at select gene targets
        description: Most causally informative ARMS dataset available. Uses dTAG-mediated targeted degradation
          of endogenously tagged PAX3-FOXO1 in RH4 and RH30 cell lines with time-resolved multi-omics
          (0.5–72 h). ATAC-seq tracks chromatin accessibility loss in real time; PRO-seq captures nascent
          enhancer RNA transcription to identify active super-enhancer elements; CUT&RUN maps histone
          marks; RNA-seq defines direct vs. indirect gene expression responses. SuperSeries comprising
          10 subseries (≥209 samples total). Definitively distinguishes immediate-early PAX3-FOXO1 direct
          targets from secondary transcriptional cascades.
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        data_type: MULTI_OMICS_PERTURBATION
        sample_types:
        - preferred_term: alveolar rhabdomyosarcoma cell line
          tissue_term:
            preferred_term: skeletal muscle tissue
            term:
              id: UBERON:0001134
              label: skeletal muscle tissue
        sample_count: 209
        conditions:
        - PAX3-FOXO1 dTAG degradation (0.5–72 h time course)
        - DMSO control
        platform: Illumina NovaSeq 6000
        publication: PMID:36395771
        notes: SuperSeries (GSE183281); 10 component subseries covering ATAC-seq, PRO-seq, ChIP-seq, CUT&RUN,
