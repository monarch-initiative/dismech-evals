        hypothesis_group_id: therapy_resistance_branch_model
        hypothesis_label: HDAC3 Chemotherapy-Resistance Branch Model
        status: EMERGING
        description: PAX3::FOXO1-mediated checkpoint adaptation and the HDAC3-SMARCA4-miR-27a-PAX3::FOXO1
          circuit form a therapy-context resistance branch that contributes to relapse under chemotherapy
          pressure.
        notes: This group should not be conflated with the initiating ARMS regulatory program. It is a
          curated resistance branch that may affect chromatin state in resistant disease, but the cited
          evidence primarily supports chemotherapy-resistance biology.
      selected_evidence:
        snippet: Chemotherapy resistance in ARMS has previously been attributed to PAX3::FOXO1-mediated
          cell cycle checkpoint adaptation, which is mediated by an HDAC3-SMARCA4-miR-27a-PAX3::FOXO1
          circuit that can be disrupted by HDAC3 inhibition.
        supports: SUPPORT
