        description: scRNA-seq of patient-derived aRMS and eRMS primary cultures plus RH4/RH30 cell lines
          (~53,000 cells total). Identifies a PAX3::FOXO1-stabilized "myogenin+ cycling progenitor" cell
          state that persists across individual tumors. PAX3::FOXO1 shRNA knockdown releases the differentiation
          block and shifts cells toward a myogenin-high differentiated state. Companion CyTOF mass cytometry
          and a 244-compound phenotypic drug screen (MYOscopy imaging) identify MEK inhibitor (trametinib)
          + RAF inhibitor (dabrafenib) as cell-fate hijackers that redirect aRMS toward differentiation.
          Survival analysis shows the progenitor/MuSC-like transcriptional signature correlates with inferior
          patient outcomes.
