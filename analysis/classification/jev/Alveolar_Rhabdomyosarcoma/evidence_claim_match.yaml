  66ee273384a79e31383eb9403fbb685ebcd3be80c7ad19b70bb9a5175c99f99c:
    claim:
      about:
        disease:
          name: Alveolar Rhabdomyosarcoma
          disease_term:
            preferred_term: alveolar rhabdomyosarcoma
            term:
              id: MONDO:0009994
              label: alveolar rhabdomyosarcoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_arms_tme_immunotherapy_resistance
        prompt: In fusion-positive ARMS, is immunotherapy resistance driven by a fusion/enhancer-imposed
          immune-cold chromatin state, antigen heterogeneity, cancer-associated fibroblast checkpoint/cytokine
          support, or a combined tumor-intrinsic and microenvironmental resistance state?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#PAX-FOXO1 Fusion Oncogene
        - pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
        - pathophysiology#Immune-Evasive Tumor Microenvironment
        - pathophysiology#Chemotherapy Resistance and Relapse
        - pathophysiology#Aberrant Cell Proliferation
        rationale: Recent immunotherapy and tumor-microenvironment papers make the gap more specific than
          "immunotherapy has not worked." CAR-T reviews identify limited clinical activity and hurdles
          such as antigen heterogeneity and immunosuppressive microenvironments; tumor-immune reviews
          connect PAX3:FOXO1 to reduced antigen presentation and immune infiltration; and a 2025 fusion-positive
          RMS fibroblast model shows immune-checkpoint and cyclophosphamide-resistance effects. With the
          fusion/enhancer node now explicit, the remaining gap is whether immune resistance is encoded
          in the tumor-cell chromatin state, imposed by CAF-supported microenvironmental signaling, or
          produced by both layers together.
        proposed_experiments:
        - experiment_id: exp_arms_tme_coculture_immunotherapy_resistance_panel
          name: FP-RMS tumor-CAF-immune coculture resistance panel
          description: Build human FP-RMS tumor-cell, cancer-associated fibroblast, and immune cocultures
            with matched antigen-expression, cytokine, single-cell transcriptomic, and open-chromatin
            profiling. Test CAR-T targets, checkpoint blockade, CXCR4 inhibition, CAF depletion, and fusion/enhancer
            perturbation to distinguish antigen-loss, tumor-intrinsic immune-cold chromatin, immune-exclusion,
            and fibroblast-mediated resistance mechanisms.
          experiment_type:
            preferred_term: tumor microenvironment immunotherapy resistance experiment
          model_systems:
          - name: FP-RMS tumor-CAF-immune coculture
            description: Human fusion-positive rhabdomyosarcoma tumor cells cocultured with patient-derived
              or metastatic-site cancer-associated fibroblasts and T cells.
            experimental_model_type: CO_CULTURE
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_types:
            - preferred_term: cancer-associated fibroblast
              term:
                id: CL:0000057
                label: fibroblast
            - preferred_term: T cell
              term:
                id: CL:0000084
                label: T cell
            publication: PMID:41131073
            modeled_mechanisms:
            - target: PAX-FOXO1 Disease Enhancer Reprogramming
              description: Tests whether fusion/enhancer state directly controls antigen-presentation
                or immune-exclusion programs.
            - target: Immune-Evasive Tumor Microenvironment
              description: Tests whether fibroblast and immune-cell context creates therapy resistance.
            - target: Chemotherapy Resistance and Relapse
              description: Tests whether TME support converges with relapse and chemotherapy-resistance
                states.
            - target: Aberrant Cell Proliferation
              description: Measures whether microenvironmental support sustains growth under therapy.
          perturbations:
          - name: CAR-T and checkpoint intervention
            target: pathophysiology#Immune-Evasive Tumor Microenvironment
            description: Compare single-antigen and dual-antigen CAR-T approaches with checkpoint blockade
              in the presence and absence of fibroblast-conditioned microenvironmental support.
          - name: CAF/CXCR4-axis disruption
            target: pathophysiology#Immune-Evasive Tumor Microenvironment
            description: Deplete fibroblasts or inhibit CXCR4-linked signaling to test whether CAF-derived
              factors drive immune evasion and chemotherapy resistance.
          - name: Fusion/enhancer-state perturbation
            target: pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
            description: Perturb the fusion/enhancer program with fusion withdrawal or selected chromatin-handle
              interventions to test whether antigen presentation and T-cell killing can be restored from
              the tumor-cell side.
          readouts:
          - name: Antigen-presentation chromatin and immune infiltration state
            target: pathophysiology#Immune-Evasive Tumor Microenvironment
            description: Measure open chromatin and expression at antigen-presentation and immune-response
              programs, target-antigen expression, T-cell killing, immune-checkpoint expression, cytokines,
              and tumor-cell survival after immunotherapy challenge.
            biological_processes:
            - preferred_term: antigen processing and presentation
              term:
                id: GO:0019882
                label: antigen processing and presentation
            - preferred_term: immune response
              term:
                id: GO:0006955
                label: immune response
            assays:
            - preferred_term: ATAC-seq
            - preferred_term: single-cell RNA-seq
            - preferred_term: flow cytometry
            - preferred_term: cytokine profiling
            - preferred_term: cell killing assay
            direction: POSITIVE
          - name: Chemotherapy and immunotherapy resistance
            target: pathophysiology#Immune-Evasive Tumor Microenvironment
            description: Quantify cyclophosphamide sensitivity, CAR-T cytotoxicity, checkpoint response,
              and rescue by CAF/CXCR4-axis perturbation.
            assays:
            - preferred_term: cell viability assay
            - preferred_term: cytotoxicity assay
            direction: NEGATIVE
          controls:
          - name: Tumor-only and normal fibroblast coculture controls
            description: Separates CAF-specific effects from generic stromal support.
          - name: Antigen-negative CAR-T control
            description: Controls for nonspecific T-cell activation or cytotoxicity.
          decision_criterion: A resistance mechanism is prioritized if its perturbation restores antigen-presentation
            chromatin or expression, improves T-cell killing, and improves chemotherapy or immunotherapy
            response in CAF-supported FP-RMS cultures, while tumor-only, normal-fibroblast, or fusion-negative
            controls lack the same resistance phenotype.
          would_support:
          - pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
          - pathophysiology#Immune-Evasive Tumor Microenvironment
          would_refute:
          - pathophysiology#Immune-Evasive Tumor Microenvironment
      selected_evidence:
        snippet: While preclinical studies are promising, antitumor activity in clinical studies to date
          has been limited.
        supports: SUPPORT
