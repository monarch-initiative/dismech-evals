  4cf2fa4f0ee0b178532c1ef8a7c27c6a49396c4f304b34b9cecb9d15518bb7b5:
    claim:
      about:
        disease:
          name: Alveolar Rhabdomyosarcoma
          disease_term:
            preferred_term: alveolar rhabdomyosarcoma
            term:
              id: MONDO:0009994
              label: alveolar rhabdomyosarcoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_arms_fgfr_response_biomarkers
        prompt: Which fusion-positive ARMS tumors have disease-specific open chromatin at FGF8 regulatory
          elements that correspond to previously reported PAX3-FOXO1/ETS1/KDM3A-bound enhancers of FGF8,
          and also show high FGF8 RNA, high FGFR4 RNA, and FGFR4 phosphorylation, such that the tumor
          is clinically responsive to FGFR inhibition? Conversely, which tumors express some of the FGF8/FGFR4/FGFR4_pY
          signature but are not FGFR-dependent because downstream RAS/PI3K activation, relapse-associated
          adaptation, or other resistance circuitry bypasses FGFR signaling?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#PAX-FOXO1 Fusion Oncogene
        - pathophysiology#PAX-FOXO1 Disease Enhancer Reprogramming
        - pathophysiology#ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
        - pathophysiology#FGFR-Driven RTK Signaling
        - pathophysiology#RAS/PI3K Effector Pathway Activation
        - treatments#FGFR Inhibitor Therapy
        rationale: 'Recent 2026 multiplatform profiling provides the strongest forward evidence that FGFR4/FGF8
          coexpression with FGFR4 phosphorylation can identify FGFR-inhibitor-sensitive FP-RMS. The same
          paper frames the broader unresolved question: RNA overexpression alone is common, but it is
          not always clear when receptor expression marks kinase activation, signaling dependence, and
          drug response. Because the pathograph now connects FGF8 to the ETS1/KDM3A/PAX-FOXO1 chromatin
          cofactor module, the open curation problem is whether disease-specific open chromatin at FGF8
          regulatory elements that correspond to PAX3-FOXO1/ETS1/KDM3A-bound enhancers of FGF8, direct
          factor-occupancy evidence where available, FGF8/FGFR4 transcript abundance, FGFR4 phosphorylation,
          and drug response form one coherent dependency signature or split into bypass states.'
        proposed_experiments:
        - experiment_id: exp_arms_fgfr_functional_biomarker_response_panel
          name: Functional FGFR biomarker-response panel in FP-RMS
          description: Assemble FP-RMS patient samples, cell lines, organoids, and PDX-derived cultures
            stratified by ATAC-seq accessibility at FGF8 regulatory elements that correspond to PAX3-FOXO1/ETS1/KDM3A-bound
            enhancers of FGF8, by direct PAX3-FOXO1/ETS1/KDM3A occupancy where factor-binding data are
            available, by FGFR4 RNA, FGF8 RNA, FGFR4 phosphorylation, and RTK/RAS/PI3K alterations. Test
            FGFR4-selective and multikinase FGFR inhibitors alone and with downstream pathway blockade
            to determine which biomarker combinations predict response or bypass.
          experiment_type:
            preferred_term: functional precision-oncology biomarker experiment
          model_systems:
          - name: FP-RMS phosphoproteomic response panel
            description: Human fusion-positive rhabdomyosarcoma samples and derived models with matched
              transcriptomic, phosphoproteomic, genomic, and drug-response measurements.
            experimental_model_type: OTHER
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            publication: PMID:42041178
            modeled_mechanisms:
            - target: PAX-FOXO1 Disease Enhancer Reprogramming
              description: Tests whether FGFR response tracks an upstream disease-enhancer state.
            - target: ETS1-KDM3A PAX-FOXO1 Chromatin Cofactor Module
              description: Tests whether FGF8/FGFR4 dependence is coupled to the modeled cofactor-occupancy
                branch.
            - target: FGFR-Driven RTK Signaling
              description: Tests whether FGFR4/FGF8 expression and FGFR4_pY mark active signaling dependence.
            - target: RAS/PI3K Effector Pathway Activation
