        description: 'Comprehensive single-cell atlas (122,731 nuclei/cells) from 18 primary patient tumors
          (6 ARMS + 12 ERMS), 18 orthotopic PDX models, and organoids. Multi-modal: snRNA-seq (frozen
          tumors), scRNA-seq (fresh), scATAC-seq (paired chromatin accessibility), and lentiviral barcode
          lineage tracking. Defines a 3-state myogenic developmental hierarchy (progenitor / myoblast-like
          / myocyte-like) shared across subtypes. ARMS shows a narrower late-stage developmental bias
          vs. ERMS. scATAC-seq links chromatin accessibility to cell-state transitions. Chemotherapy selects
          for ABCG2+ mesoderm-like quiescent progenitor cells, providing a mechanistic model for disease
          relapse. Includes matched pre/post-treatment samples from RMS13 clinical trial.'
