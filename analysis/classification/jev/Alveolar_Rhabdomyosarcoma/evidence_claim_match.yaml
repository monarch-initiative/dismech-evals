      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: fgfr_downstream_output_dependency_model
        hypothesis_label: FGFR/FGF8 Downstream Output Dependency Model
        status: EMERGING
        description: A subset of fusion-positive RMS shows high FGF8/FGFR4 expression, FGFR4 phosphorylation,
          and FGFR inhibitor response. This is modeled as a downstream output or branch dependency unless
          perturbation evidence shows that FGFR signaling feeds back to maintain the fusion chromatin
          state.
        notes: This grouping separates a druggable output branch from the core chromatin regulatory-state
          hypothesis. FGF8 enhancer occupancy supports a link to the fusion/cofactor program, while FGFR4
          phosphorylation and inhibitor response support branch activity and therapeutic relevance.
      selected_evidence:
        snippet: We highlight the utility of FGFR inhibitors in PAX3-FOXO1 fusion-positive rhabdomyosarcomas
          (FP-RMS) characterized by high FGFR4 and FGF8 RNA expression levels and FGFR4 activation (FGFR4_pY).
        supports: SUPPORT
