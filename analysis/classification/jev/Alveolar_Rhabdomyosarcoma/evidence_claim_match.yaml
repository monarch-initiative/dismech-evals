              of fusion knowledge. The disease model now makes the hidden middle explicit but should not
              treat open chromatin as a causal node: open chromatin is the observable readout of a fusion-dependent
              regulatory program. The causal candidates are upstream or feedback-maintenance mechanisms
              such as PAX-FOXO1 protein abundance, ETS1/KDM3A cofactor occupancy, and YOD1/N-Myc stabilization.
