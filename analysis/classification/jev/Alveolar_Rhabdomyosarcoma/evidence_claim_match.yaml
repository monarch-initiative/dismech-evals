      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_fusion_regulatory_program
        hypothesis_label: Canonical PAX-FOXO1 Fusion Regulatory Program
        status: CANONICAL
        description: PAX3/7-FOXO1 is the initiating molecular driver of fusion-positive ARMS and produces
          a fusion-dependent transcriptional and enhancer state that blocks myogenic differentiation and
          supports malignant behavior.
        notes: This hypothesis group is intentionally not a fully ordered linear chain. Edges from the
          fusion regulatory program to sibling outputs should be read as curated disease-model links supported
          at the current graph granularity, not as proof that all sibling outputs are causally upstream
          of one another.
      selected_evidence:
        snippet: We discuss the central role of fusion proteins in transcriptional reprogramming, impaired
          myogenic differentiation, and super-enhancer activation.
        supports: SUPPORT
