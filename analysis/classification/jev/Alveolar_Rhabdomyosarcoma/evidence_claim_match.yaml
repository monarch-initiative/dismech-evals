        description: Foundational epigenomic atlas of the PAX3-FOXO1 super-enhancer regulatory program
          in fusion-positive ARMS. Includes H3K27ac, BRD4, MED1, MYOD, MYOG, MYCN, CTCF, and PAX3-FOXO1
          ChIP-seq across RH3, RH4, RH5, RH41 (FP-ARMS), RD (ERMS), and patient-derived primary cultures
          (≥10 donors), plus a causal fibroblast model (7250 cells ± PAX3-FOXO1). DNase-seq and 4C-seq
          provide chromatin-accessibility and 3D contact data. Subseries GSE83726 contains H3K27ac ChIP-seq
          from primary human ARMS tumor biopsies. Defines the BET-bromodomain vulnerability of the PAX3-FOXO1
          transcriptional program.
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        data_type: MULTI_OMICS
        sample_types:
        - preferred_term: alveolar rhabdomyosarcoma cell line
          tissue_term:
            preferred_term: skeletal muscle tissue
            term:
              id: UBERON:0001134
              label: skeletal muscle tissue
        sample_count: 80
        conditions:
        - fusion-positive alveolar rhabdomyosarcoma (FP-ARMS)
        - embryonal rhabdomyosarcoma (FN-RMS)
        - normal fibroblast ± PAX3-FOXO1
        platform: Illumina HiSeq 2000/2500
        publication: PMID:28446439
        notes: SuperSeries; subseries GSE83724 (RNA-seq), GSE83725 (fibroblast causal model ChIP/DNase),
          GSE83726 (primary tumor H3K27ac), GSE83727 (4C-seq). The fibroblast subseries (GSE83725) provides
          the cleanest causal model for PAX3-FOXO1 pioneer-factor chromatin remodelling independent of
          pre-existing RMS epigenome.
      selected_evidence:
        snippet: We find PAX3-FOXO1 reprograms the cis-regulatory landscape by inducing de novo super
          enhancers.
