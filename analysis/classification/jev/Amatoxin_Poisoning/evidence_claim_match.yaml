  b1acaeb426d0653633a48a9d54e2644f29efe9ec0b3ce851c5b1e663afabeed8:
    claim:
      about:
        disease:
          name: Amatoxin Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: OATP1B3-Mediated Hepatocyte Uptake of Alpha-Amanitin
        biological_scale: CELLULAR
        description: Carriage of alpha-amanitin across the sinusoidal membrane into the hepatocyte by
          the organic anion transporting polypeptide OATP1B3, encoded by SLCO1B3. This is the step that
          converts a poorly permeant peptide into a hepatocyte poison, and it is the reason the disease
          is a hepatopathy rather than a generalised cytotoxicity. It is also the step the first-line
          antidote targets.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        genes:
        - preferred_term: SLCO1B3
          term:
            id: hgnc:10961
            label: SLCO1B3
        notes: The node is bound to CL:0000182 hepatocyte rather than to a zonal subtype because the uptake
          step is not reported as zone-restricted; the zonation appears downstream, at the necrosis node,
          which binds CL:0019029.
      selected_evidence:
        snippet: we have identified OATP1B3 as the human hepatic uptake transporter for amatoxins
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:16495352
      reference_title: Molecular characterization and inhibition of amanitin uptake into human hepatocytes.
      evidence_source: IN_VITRO
      explanation: The identification of the transporter, from uptake assays in cells stably expressing
        each candidate OATP.
