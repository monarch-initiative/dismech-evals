          uptake: OATP1B3 explains which organs are reached, while STT3B is required for entry at the
          cellular level, and depleting it reduces toxin entry. It also nominated a repurposable inhibitor,
          which is why it appears here as a node with a treatment attached rather than as a note.'
      selected_evidence:
        snippet: The N-glycan biosynthesis pathway and its main component, STT3B, were found to play a
          crucial role in α-amanitin toxicity
        supports: SUPPORT
