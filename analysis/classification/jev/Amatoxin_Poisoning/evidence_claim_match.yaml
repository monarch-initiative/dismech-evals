  a5b5645e49a6f42b14bbecbf26dae2bbe6de36cecf147bacd2f05ab92963f4ed:
    claim:
      about:
        disease:
          name: Amatoxin Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: STT3B-Dependent Cellular Entry of Alpha-Amanitin
        biological_scale: CELLULAR
        description: 'A requirement for the N-glycan biosynthesis component STT3B for alpha-amanitin to
          enter human cells, identified by CRISPR screening. It is a separate determinant from sinusoidal
          uptake: OATP1B3 explains which organs are reached, while STT3B is required for entry at the
          cellular level, and depleting it reduces toxin entry. It also nominated a repurposable inhibitor,
          which is why it appears here as a node with a treatment attached rather than as a note.'
      selected_evidence:
        snippet: Depletion of STT3B significantly decreased the entrance of α-amanitin in human cells
        supports: SUPPORT
        directness: DIRECT
