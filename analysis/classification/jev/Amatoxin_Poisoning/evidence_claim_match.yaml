  bb23779d31efff828fffb4254aa0703d431e5f6fd116d6e78cd4d1b0a0b00d33:
    claim:
      about:
        disease:
          name: Amatoxin Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ros_causal_role_in_hepatotoxicity
        kind: KNOWLEDGE_GAP
        prompt: Do reactive oxygen species contribute causally to amatoxin hepatotoxicity, or are they
          a marker of cells already dying from transcriptional arrest?
        attaches_to:
        - pathophysiology#TNF-Mediated Amplification of Hepatocyte Injury
        rationale: This is not an idle question, because N-acetylcysteine is given in nearly every protocol
          and its rationale is the oxidative arm. The TNF half of the loop has a blocking experiment behind
          it; the ROS half does not, and the review that reports both says so in as many words. Until
          it is settled, the standard use of an antioxidant antidote rests on a mechanism the same literature
          declines to assert.
      selected_evidence:
        snippet: Although some in vivo and in vitro studies have found some association between α-amanitin
          and the development of ROS, further investigation is needed
        supports: SUPPORT
