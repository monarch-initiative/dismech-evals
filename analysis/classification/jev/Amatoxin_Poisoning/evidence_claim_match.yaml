  5591709d1e762f38760b9550ad37b6adc784480473789c58a0b59ffa8042ef0b:
    claim:
      about:
        disease:
          name: Amatoxin Poisoning
        context: []
      assertion_type: Environmental
      assertion:
        name: Ingestion of foraged amatoxin-containing mushrooms
        description: Consumption of wild-collected mushrooms of Amanita, Galerina or Lepiota mistaken
          for edible species. The exposure is dietary, the dose is set by the quantity of fruiting body
          eaten, and no method of preparation reduces it.
        exposure_term:
          preferred_term: dietary exposure to amatoxins in foraged mushrooms
          term:
            id: ECTO:0000537
            label: exposure to toxin
        food_source:
          preferred_term: mushroom fruitbody
          term:
            id: FOODON:00003528
            label: mushroom fruitbody
        notes: 'Bound to the genus ECTO:0000537 exposure to toxin rather than to ECTO:0000524 exposure
          to mycotoxin, on positive grounds rather than for want of searching. Searched the pinned local
          build (`uv run runoak -i sqlite:obo:ecto search ''l~mushroom''`, `''l~amanit''`, `''l~fungal
          toxin''`, `''l~mycotoxin''`, `''l~toxin''`, `''l~exposure to fung''`, `''l~poisonous''`) on
          2026-09-19: ECTO has no mushroom, Amanita or amatoxin exposure class, and the only fungal-toxin
          hit is ECTO:0000524. That term is defined as `RO:0002309` involving CHEBI:25442 mycotoxin, and
          `uv run runoak -i sqlite:obo:chebi ancestors CHEBI:37415 -p i` shows alpha-amanitin is not a
          descendant of CHEBI:25442 - it sits under cyclic peptide, not under mycotoxin - so binding it
          would assert a classification CHEBI does not make. This also matches how the KB already splits
          the two: Ergotism, a genuine mould mycotoxicosis, binds ECTO:0000524, while Ciguatera_Fish_Poisoning
          and Acute_Ackee_Fruit_Intoxication bind ECTO:0000537 and carry the agent in preferred_term,
          which is what this entry does.'
      selected_evidence:
        snippet: Amatoxins have good heat stability and are not destroyed by cooking or drying
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
