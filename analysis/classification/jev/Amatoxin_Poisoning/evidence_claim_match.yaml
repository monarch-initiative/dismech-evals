  cefb17e701bf6acd6fc1e2fc139a9ccbe2ed1244e788a7b8d60e21ebb91545dd:
    claim:
      about:
        disease:
          name: Amatoxin Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: biliary_drainage_survival_benefit
        kind: KNOWLEDGE_GAP
        prompt: Does interrupting enterohepatic recirculation by biliary drainage improve survival, or
          does the nine-patient pilot reflect selection?
        attaches_to:
        - treatments#Biliary Drainage
        rationale: Two of this entry's interventions - multiple-dose charcoal and biliary drainage - target
          the recirculation node directly, and a third, silibinin, targets the uptake step that recirculation
          feeds. Recirculation is the one part of the mechanism that is straightforwardly interruptible.
          The drainage result is the largest effect reported for any intervention here and rests on five
          treated patients against four controls; the mechanistic case is strong and the clinical case
          is a pilot. The same manoeuvre is a core element of the canine protocol, which is supportive
          but also uncontrolled.
      selected_evidence:
        snippet: Interrupting the enterohepatic recirculation of amatoxins is a mechanistically rational
          but unproven therapeutic strategy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
