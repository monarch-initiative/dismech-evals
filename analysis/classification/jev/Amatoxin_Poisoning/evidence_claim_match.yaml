              compartment is a conduit rather than a reservoir - which is why extracorporeal removal aimed
              at the blood has a narrow window. The ingestion event itself is modelled once, as the `environmental:`
              entry that TRIGGERS this node, rather than duplicated as a pathophysiology node; that follows
              Arsenic_Poisoning, whose exposure entries likewise point at the systemic-exposure node.
