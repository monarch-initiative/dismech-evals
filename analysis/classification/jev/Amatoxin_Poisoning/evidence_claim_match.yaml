  af95f187f2a1321800be14246893929cba86bb3e3901ae381b322182d5089287:
    claim:
      about:
        disease:
          name: Amatoxin Poisoning
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Urinary amatoxin detection
        description: The only specific confirmatory test. Urine is the correct matrix; the window is narrow,
          and a negative result late after ingestion does not exclude poisoning.
        diagnosis_term:
          preferred_term: urinary amatoxin assay
          term:
            id: NCIT:C217459
            label: Diagnostic Toxicology Testing
        notes: 'Bound to NCIT:C217459 Diagnostic Toxicology Testing, whose OLS hierarchicalAncestors include
          both NCIT:C25218 Clinical Intervention or Procedure (so it satisfies the dynamic enum) and NCIT:C18020
          Diagnostic Procedure (so it is a strict specialisation of the generic term). The assay methods
          named in the source were searched first and rejected on positive grounds: NCIT:C17156 Mass Spectrometry
          and NCIT:C16435 Liquid Chromatography have no NCIT:C25218 ancestor, because they are technique
          concepts rather than clinical actions, and would fail the enum. NCIT:C17241 Urinalysis is reachable
          from NCIT:C25218 but not from NCIT:C18020 and names the specimen rather than the analysis, so
          it was not preferred.'
      selected_evidence:
        snippet: After 36 h from the time of ingestion, the accuracy of the analysis is unreliable, and
          a negative result does not rule out amatoxin toxicity
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
