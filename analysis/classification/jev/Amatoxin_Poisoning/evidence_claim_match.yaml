  47a91bc5e6d9d3bc71f598639d07181d5b46fcd32c0b51c6ef33e9c32eae5c77:
    claim:
      about:
        disease:
          name: Amatoxin Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oatp1b3_independent_entry_route
        kind: KNOWLEDGE_GAP
        prompt: By what route does alpha-amanitin enter haematopoietic cells, given that OATP1B3 inhibition
          does not protect them?
        attaches_to:
        - pathophysiology#Hematopoietic Cell Apoptosis
        rationale: 'OATP1B3 expression is the accepted explanation for why amatoxin spares lung, heart
          and brain while destroying liver, gut and kidney, and the hepatic evidence for it is strong
          in both directions - the transporter carries the toxin, and knocking it down abolishes the cytotoxicity.
          Haematopoietic cells do not fit: they are killed at comparable concentrations, and OATP1B3 inhibitors
          do not rescue them. Either another carrier is involved or the transporter account is incomplete
          as a general theory of cellular susceptibility. The question matters therapeutically, because
          silibinin''s mechanism is transporter blockade, and a compartment that takes up toxin without
          OATP1B3 is a compartment the antidote cannot protect.'
      selected_evidence:
        snippet: The antidotes and OATP1B3 inhibitors did not reverse α-amanitin-induced toxicity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:38276537
      reference_title: Unraveling Hematotoxicity of α-Amanitin in Cultured Hematopoietic Cells.
      evidence_source: IN_VITRO
      explanation: The observation that opens the gap.
