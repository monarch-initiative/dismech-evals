      assertion_type: Subtype
      assertion:
        name: Conventional
        display_name: Conventional ameloblastoma
        description: The intraosseous conventional form includes tumors historically described as solid
          or multicystic. Conventional classification is a reported risk factor for recurrence.
      selected_evidence:
        snippet: 'The identified prognostic factors for recurrence included: (1) Tumor size/diameter/volume,
          (2) cortical bone perforation/ soft tissue invasion, (3) multilocular radiolucency, (4) impacted
          tooth-involving lesions, (5) root resorption, (6) WHO classification - conventional (solid/multicystic)
          ameloblastoma, (7) histological subtype - mural invasion of unicystic ameloblastoma, (8) conservative
          treatment modalities - simple enucleation, curettage, and marsupialization, and (9) non-extraction/preservation
          of involved teeth.'
        supports: SUPPORT
