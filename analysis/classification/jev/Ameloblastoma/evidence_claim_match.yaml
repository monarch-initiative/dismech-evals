      assertion_type: Discussion
      assertion:
        discussion_id: ameloblastoma_preclinical_model_fidelity
        prompt: How faithfully do current ameloblastoma models predict durable responses in patients?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - experimental_models#Conditionally reprogrammed human ameloblastoma cell-line panel
        - experimental_models#Fully humanized 3D ameloblastoma-bone coculture
        - treatments#Molecularly Matched Targeted Therapy
        rationale: Benign ameloblastoma cells have finite proliferation in two-dimensional culture, immortalization
          may alter phenotype, and subcutaneous xenograft engraftment is inefficient. Current response
          evidence is encouraging but small, and organoid or humanized models require further validation
          against long-term clinical outcomes.
      selected_evidence:
        snippet: In fact, benign tumor cells generally showed a finite proliferative capacity in two-dimensional
          culture, and most likely, they could exhibit altered cellular phenotype after immortalization.
          Moreover, this benign tumor presented low chances of subcutaneous engraftment in nude mice.
        supports: SUPPORT
