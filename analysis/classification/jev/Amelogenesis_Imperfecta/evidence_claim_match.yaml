      assertion_type: Pathophysiology
      assertion:
        name: Defective Enamel Matrix Processing and Maturation
        description: 'During the maturation stage, the enamel proteases MMP20 (enamelysin) and KLK4 (kallikrein-4)
          progressively degrade and remove the enamel matrix, allowing crystallites to grow and the tissue
          to harden. Biallelic mutations in MMP20 and KLK4 impair matrix processing, leaving residual
          protein and soft, hypomineralized/hypomature enamel.

          '
        cell_types:
        - preferred_term: Ameloblast
          term:
            id: CL:0000059
            label: ameloblast
        biological_processes:
        - preferred_term: Enamel mineralization
          term:
            id: GO:0070166
            label: enamel mineralization
          modifier: DECREASED
      selected_evidence:
        snippet: Genes expressed by odontoblasts (COL1A1, COL1A2, and DSPP), and ameloblasts (AMELX, ENAM,
          MMP20, and KLK4) during the crown formation stage, are associated with dentinogenesis imperfecta,
          dentin dysplasia, and amelogenesis imperfecta.
        supports: SUPPORT
