          term:
            id: GO:0031214
            label: biomineral tissue development
          modifier: ABNORMAL
        genes:
        - preferred_term: FAM83H
          term:
            id: hgnc:24797
            label: FAM83H
      selected_evidence:
        snippet: Dental enamel formation is a remarkable example of a biomineralization process.
        supports: SUPPORT
