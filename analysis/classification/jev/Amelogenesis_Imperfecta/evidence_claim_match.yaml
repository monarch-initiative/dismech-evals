            label: biomineral tissue development
          modifier: ABNORMAL
        genes:
        - preferred_term: FAM83H
          term:
            id: hgnc:24797
            label: FAM83H
      selected_evidence:
        snippet: The function of FAM83H remains obscure.
        supports: SUPPORT
