              label: amelogenesis imperfecta
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ameloblast Dysfunction and Defective Enamel Biomineralization
        description: 'AI is fundamentally a disorder of the ameloblast, the ectoderm-derived epithelial
          cell that builds enamel. Enamel formation is a tightly staged biomineralization process in which
          ameloblasts first secrete an organic enamel matrix and then drive its mineralization. Mutations
          in the genes critical for this process disrupt ameloblast function and produce structurally
          and/or quantitatively abnormal enamel. The specific inherited dental phenotype maps onto the
          developmental stage at which the mutated gene is critically required.

          '
        cell_types:
        - preferred_term: Ameloblast
          term:
            id: CL:0000059
            label: ameloblast
        biological_processes:
        - preferred_term: Amelogenesis
          term:
            id: GO:0097186
            label: amelogenesis
          modifier: DECREASED
        - preferred_term: Biomineral tissue development
          term:
            id: GO:0031214
            label: biomineral tissue development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Dental enamel formation is a remarkable example of a biomineralization process.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
