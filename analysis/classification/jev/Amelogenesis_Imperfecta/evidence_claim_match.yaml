              label: amelogenesis imperfecta
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Transcriptional Control of Ameloblast Differentiation
        description: 'Before any enamel matrix is laid down, the inner enamel epithelium must proliferate
          and differentiate into secretory ameloblasts. Two AI genes encode the transcription factors
          that drive this step rather than any structural or enzymatic component of enamel: SP6, whose
          first zinc finger is altered in autosomal dominant hypoplastic AI, and DLX3, whose DNA-binding
          homeodomain is truncated in AI with taurodontism. A lesion here is upstream of every matrix
          and processing defect below.

          '
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Ameloblast
          term:
            id: CL:0000059
            label: ameloblast
        biological_processes:
        - preferred_term: Ameloblast differentiation
          term:
            id: GO:0036305
            label: ameloblast differentiation
          modifier: DECREASED
        genes:
        - preferred_term: SP6
          term:
            id: hgnc:14530
            label: SP6
        - preferred_term: DLX3
          term:
            id: hgnc:2916
            label: DLX3
      selected_evidence:
        snippet: We identified a potential SP6 binding motif in the AMBN proximal promoter sequence and
          showed that wild-type (WT) SP6 binds more strongly to it than the mutant protein.
        supports: SUPPORT
    origin:
