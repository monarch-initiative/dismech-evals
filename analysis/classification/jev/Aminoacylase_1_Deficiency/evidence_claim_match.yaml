            id: MONDO:0010079
            label: Canavan disease
        description: Both disorders involve urinary N-acetylated metabolites, but Canavan disease is ASPA
          deficiency with prominent N-acetylaspartate accumulation and a characteristic leukodystrophy,
          whereas ACY1 deficiency produces a broader profile of aliphatic N-acetylated amino acids and
          is confirmed by ACY1 testing or enzyme assay.
        distinguishing_features:
        - Markedly elevated urine N-acetylaspartate and biallelic ASPA variants favor Canavan disease.
        - A multi-metabolite urinary N-acetylated amino-acid profile with biallelic ACY1 variants or deficient
          ACY1 activity favors aminoacylase 1 deficiency.
      selected_evidence:
        snippet: Canavan disease (CD) is an ultra-rare autosomal recessive leukodystrophy caused by loss-of-function
          mutations in ASPA, which encodes aspartoacylase (ASPA), leading to accumulation of N-acetylaspartate
          (NAA).
