        description: 'Because the deacetylation step is blocked, N-acetylated amino acids accumulate and
          are excreted in the urine, producing the biochemical signature of the disease: a specific profile
          of ~11 N-acetylated amino acids on urine GC-MS/NMR (N-acetyl derivatives of methionine, glutamate,
          alanine, glycine, threonine, leucine, isoleucine, valine, serine, plus N-acetylglutamine and
          N-acetylasparagine). Notably, one study found no increase of N-acetylated amino acids in cerebrospinal
          fluid, leaving the consequences for brain metabolism unresolved.

          '
