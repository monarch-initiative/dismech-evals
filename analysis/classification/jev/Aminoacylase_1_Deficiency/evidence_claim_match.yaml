      assertion:
        hypothesis_group_id: acy1_auditory_hair_cell_hypothesis
        hypothesis_label: ACY1-dependent auditory hair-cell development
        status: EMERGING
        description: ACY1 loss may impair auditory hair-cell development and function. This model is supported
          by a single human candidate case and by morpholino knockdown and rescue in zebrafish, but the
          gene-hearing-loss relationship requires unrelated human cases and independent replication.
      selected_evidence:
        snippet: A zebrafish model with morpholino-mediated acy1 knockdown revealed a significant reduction
          in hair cells and impaired auditory function, which were effectively rescued by wild-type but
          not mutant human ACY1 mRNA.
        supports: SUPPORT
