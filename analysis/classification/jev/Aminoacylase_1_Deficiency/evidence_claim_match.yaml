              label: aminoacylase 1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aminoacylase 1 Enzyme Deficiency
        biological_scale: MOLECULAR
        description: 'Biallelic pathogenic loss-of-function or missense variants in ACY1 abolish or reduce
          the activity of aminoacylase 1, a zinc-binding metalloenzyme that hydrolyzes N-acetyl amino
          acids into the free amino acid and acetate. Enzyme deficiency is demonstrable in patient-derived
          (EBV-transformed) lymphoblasts and reproduced by expression of mutant ACY1 in HEK293 cells,
          where most disease-associated mutations cause a nearly complete loss of enzyme function. This
          blocks the deacetylation/recycling step of amino-acid metabolism performed by the enzyme.

          '
        genes:
        - preferred_term: ACY1
          term:
            id: hgnc:177
            label: ACY1
        biological_processes:
        - preferred_term: N-acetyl amino acid hydrolysis in amino acid metabolism
          term:
            id: GO:0042219
            label: modified amino acid catabolic process
          modifier: DECREASED
        molecular_functions:
        - preferred_term: aminoacylase activity
          term:
            id: GO:0004046
            label: aminoacylase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Aminoacylase 1 (ACY1; EC 3.5.14) is the most abundant of the aminoacylases, a class of
          enzymes involved in hydrolysis of N-acetylated proteins.
        supports: SUPPORT
