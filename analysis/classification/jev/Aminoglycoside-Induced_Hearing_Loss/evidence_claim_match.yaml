      assertion_type: ExperimentalModel
      assertion:
        name: Human-sequence mitochondrial decoding sites in bacterial hybrid ribosomes
        experimental_model_type: OTHER
        description: A 34-nucleotide human mitochondrial decoding-site sequence was introduced into Mycobacterium
          smegmatis ribosomes, with wild-type, A1555G and C1494T variants. Cell-free amino-acid incorporation,
          luciferase and gentamicin-footprinting assays separate decoding fidelity, protein output and
          drug binding.
        modeled_mechanisms:
        - target: Mitoribosomal Decoding Errors
          relationship: PARTIALLY_RECAPITULATES
          description: Variant hybrid ribosomes show intrinsic and aminoglycoside-exacerbated miscoding.
          model_scale: MOLECULAR
          limitations: A human rRNA segment is tested in a bacterial ribosome. No hair cells, mitochondrial
            membrane transport or auditory outcome is represented.
          readouts:
          - name: Translation accuracy
            target: Mitoribosomal Decoding Errors
            direction: DECREASED
            description: Near-cognate amino-acid misincorporation increased; reporter function fell without
              lower full-length protein output.
        - target: Aminoglycoside Binding to the Mitochondrial Ribosome
          relationship: PARTIALLY_RECAPITULATES
          description: Chemical footprinting supports increased aminoglycoside interaction with variant
            decoding sites.
          model_scale: MOLECULAR
          limitations: Binding to hybrid ribosomes does not quantify drug entry into human cochlear mitochondria.
        notes: Structural interpretation is not a solved atomic structure of the complete human mutant
          mitoribosome. Loop closure alone was insufficient to reproduce the fidelity defect.
      selected_evidence:
        snippet: increased drug binding to its target and excessive aggravation of the mutants' inherent
          deficiency in ribosomal accuracy.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC2634874/
      reference_title: Genetic analysis of interactions with eukaryotic rRNA identify the mitoribosome
        as target in aminoglycoside ototoxicity - PMC
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: Chemical footprinting and translation assays support enhanced drug binding plus inherent
