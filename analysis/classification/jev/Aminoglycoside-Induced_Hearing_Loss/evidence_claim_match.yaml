        name: Avoidance or substitution of aminoglycoside antibiotics
        therapeutic_modality: OTHER
        description: For carriers of an actionable MT-RNR1 variant, choose an effective non-aminoglycoside
          regimen when available. This reduces the drug-associated risk but does not eliminate all possible
          hearing loss. The precaution applies across the aminoglycoside class. Inhaled delivery can still
          produce systemic exposure; low-absorption topical/enteral use and damaged barriers require route-specific
          assessment.
      selected_evidence:
        snippet: aminoglycosides should be avoided unless the increased risk of hearing loss is outweighed
          by the severity of infection and lack of safe or effective alternative therapies
        supports: SUPPORT
