  2e7645aa1673b69179363221477436b6993347fd04ec1a3d06b68266f619082c:
    claim:
      about:
        disease:
          name: Aminoglycoside-Induced Hearing Loss
          disease_term:
            preferred_term: deafness, aminoglycoside-induced
            term:
              id: MONDO:0010799
              label: deafness, aminoglycoside-induced
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: TRMU A10S and m.1555A>G family-derived lymphoblasts
        experimental_model_type: CELL_LINE
        description: The 2006 study examined selected family lymphoblasts and controls for mitochondrial
          import, tRNA thiolation/abundance and protein labeling. The 2017 study used eight non-isogenic
          lines, two per group, for tRNA modification, mitochondrial protein abundance, respiration, ATP
          and oxidant-response assays. No aminoglycoside challenge was used in these modifier experiments.
        modeled_mechanisms:
        - target: Reduced TRMU-Dependent tRNA Thiolation
          relationship: PARTIALLY_RECAPITULATES
          description: A10S-bearing lines have reduced tRNA thiolation.
          model_scale: MOLECULAR
          limitations: Selected nuclear/mitochondrial genotype combinations, not an isogenic comparison
            or universal modifier effect.
          readouts:
          - name: Wobble-uridine 2-thiouridine modification
            target: Reduced TRMU-Dependent tRNA Thiolation
            direction: DECREASED
            description: Affected tRNA modification in selected modifier lines.
        - target: Reduced Mitochondrial tRNA Abundance
          relationship: PARTIALLY_RECAPITULATES
          description: Double-mutant lines have reduced mitochondrial tRNA steady-state abundance.
          model_scale: MOLECULAR
          limitations: Reduced abundance does not directly establish accelerated degradation.
          readouts:
          - name: Mitochondrial tRNA abundance
            target: Reduced Mitochondrial tRNA Abundance
            direction: DECREASED
            description: Northern-blot comparison to control cell lines.
        - target: Reduced Mitochondrial Protein Synthesis
          relationship: PARTIALLY_RECAPITULATES
          description: Protein labeling was lower in the homozygous double-mutant lines.
          model_scale: MOLECULAR
          limitations: The 2006 labeling assay measures synthesis; the 2017 immunoblots measure abundance
            and are not interchangeable.
          readouts:
          - name: Mitochondrial protein labeling
            target: Reduced Mitochondrial Protein Synthesis
            direction: DECREASED
            description: A 44–57% decrease, averaging 51%, in the two homozygous double-mutant lines.
        - target: Reduced Mitochondrial Respiration
          relationship: PARTIALLY_RECAPITULATES
          description: Oxygen-consumption rates were reduced in selected mutant groups.
          model_scale: CELLULAR
          limitations: Family background, two lines per group and lack of aminoglycoside exposure limit
            translation to carrier cochleae.
          readouts:
          - name: Basal oxygen-consumption rate
            target: Reduced Mitochondrial Respiration
            direction: DECREASED
            description: Group means were 54%, 76% and 88% of control for homozygous modifier, heterozygous
              modifier and m.1555A>G-only lines.
        - target: Reduced Mitochondrial ATP Production
          relationship: PARTIALLY_RECAPITULATES
          description: ATP production was reduced with glycolysis suppressed.
          model_scale: CELLULAR
          limitations: Total cellular ATP was relatively preserved; this assay does not establish whole-cell
            energy collapse or hearing-cell ATP levels.
          readouts:
          - name: ATP under glycolysis-suppressed conditions
            target: Reduced Mitochondrial ATP Production
            direction: DECREASED
            description: Group means were 48%, 61% and 83% of controls; these are assay-specific mitochondrial
              ATP values.
        notes: The 2017 oxidant assay used a fluorescent-probe response to hydrogen peroxide. Aminoacylation
          increased for some tRNAs, so reduced aminoacylation or measured mischarging should not be asserted.
          The original import assay did not detect an A10S import defect.
      selected_evidence:
        snippet: The A10S mutation caused marked decreases in 2-thiouridine modification of U34 of tRNALys,
          tRNAGlu and tRNAGln
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/2
      evidence_path: /experimental_models/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28049726
      reference_title: Biochemical Evidence for a Nuclear Modifier Allele (A10S) in TRMU (Methylaminomethyl-2-thiouridylate-methyltransferase)
        Related to Mitochondrial tRNA Modification in the Phenotypic Manifestation of Deafness-associated
        12S rRNA Mutation.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: TRMU A10S-associated tRNA thiolation defect in family-derived cell lines, without aminoglycoside
        treatment.
