      assertion_type: ExperimentalModel
      assertion:
        name: Paromomycin-exposed m.1555A>G family lymphoblasts
        experimental_model_type: CELL_LINE
        description: Lymphoblastoid lines from five deaf carriers, five hearing carriers and three married-in
          controls from an Arab-Israeli family were exposed to 2 mg/ml paromomycin. Carrier cells had
          greater drug-associated growth slowing and mitochondrial translation inhibition.
        modeled_mechanisms:
        - target: Reduced Mitochondrial Protein Synthesis
          relationship: PARTIALLY_RECAPITULATES
          description: Drug/no-drug mitochondrial translation-rate ratios were lower in carrier cells.
          model_scale: MOLECULAR
          limitations: Non-isogenic family lymphoblasts, high in-vitro exposure and abstract-only accessible
            report; not a hair-cell model or clinical dose threshold.
          readouts:
          - name: Relative mitochondrial translation under paromomycin
            target: Reduced Mitochondrial Protein Synthesis
            direction: DECREASED
            description: The drug/no-drug ratios were lower than control ratios in both symptomatic- and
              asymptomatic-carrier lines.
        notes: The experiment supports drug susceptibility in hearing as well as deaf carriers, without
          showing that cellular response predicts individual future hearing outcome.
      selected_evidence:
        snippet: The ratios of translation rates in the presence and absence of paromomycin, which reflected
          the effect of the drug on mitochondrial protein synthesis, were significantly decreased in the
          cell lines derived from symptomatic and asymptomatic individuals (by 30 and 28% on average,
          respectively), compared with the ratios in the control cell lines.
        supports: SUPPORT
