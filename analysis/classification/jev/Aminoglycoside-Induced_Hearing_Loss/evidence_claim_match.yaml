      assertion:
        discussion_id: clinical_otoprotection_and_testing_outcomes
        prompt: Can alternative antibiotics or otoprotective strategies preserve hearing in actionable-variant
          carriers without compromising infection treatment?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - treatments#Avoidance or substitution of aminoglycoside antibiotics
        - clinical_trials#NCT04105205
        rationale: PALOH demonstrated prescribing change and similar mean antibiotic timing within its
          implementation comparison, not comparative long-term hearing protection. Apramycin has progressed
          beyond purely preclinical work to a healthy-volunteer phase I study, but that does not establish
          carrier safety. Antioxidant and other otoprotective findings in general drug models should not
          replace current genotype-guided avoidance.
      selected_evidence:
        snippet: Three participants with the m.1555A>G variant were identified, all of whom avoided aminoglycoside
          antibiotics.
        supports: SUPPORT
