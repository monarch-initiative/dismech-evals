        modeled_mechanisms:
        - target: Cochlear Hair Cell Loss
          relationship: PARTIALLY_RECAPITULATES
          description: Lateral-line sensory-cell loss provides a comparative drug-injury model for the
            cochlear injury node.
          model_scale: CELLULAR
          limitations: Lateral-line rather than cochlear hair cells; no MT-RNR1 susceptibility allele,
            hearing test or human regeneration claim.
          readouts:
          - name: Hair-cell survival after gentamicin washout
            target: Cochlear Hair Cell Loss
            direction: DECREASED
            description: Delayed loss despite removal of extracellular drug after one hour.
        notes: GPN altered intracellular distribution without lowering total fluorescent uptake, whereas
          bafilomycin reduced uptake and confounded a purely downstream lysosomal interpretation. Labeling
          efficiency prevented absolute between-drug concentration comparisons. Lysosomal membrane permeabilization,
          ferroptosis and pyroptosis were not established mediators. Calcium necessity/sufficiency was
          supported by cited prior work, not a new universal test in this study.
      selected_evidence:
        snippet: Experiments were conducted on 5–8 dpf (days postfertilization) larval zebrafish.
        supports: SUPPORT
