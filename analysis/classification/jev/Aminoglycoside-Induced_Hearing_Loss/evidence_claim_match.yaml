      assertion_type: Discussion
      assertion:
        discussion_id: carrier_penetrance_and_exposure
        prompt: Which exposures and modifiers explain clinical penetrance across actionable MT-RNR1 variants?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#MT-RNR1
        - pathophysiology#Predisposing MT-RNR1 Variants
        rationale: Severe loss after limited exposure is well documented, but selected maternal pedigrees
          and neonatal screening endpoints do not yield an unbiased lifetime risk. The British birth cohort
          had no individual aminoglycoside-exposure data and assessed better-ear thresholds at two frequencies
          in midlife. TRMU modifier families were selected and had no reported aminoglycoside exposure.
          General drug-resistant-tuberculosis ototoxicity estimates mix genetically unselected populations
          and cannot serve as prevalence of this inherited disorder.
      selected_evidence:
        snippet: It is important to note, that most infants with failed newborn hearing screening do not
          develop permanent hearing loss.
        supports: SUPPORT
    origin:
