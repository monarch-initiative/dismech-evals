              label: deafness, aminoglycoside-induced
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: human_cochlear_mechanistic_bridge
        prompt: How do allele-specific mitoribosomal defects produce selective cochlear injury in exposed
          carriers?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Mitoribosomal Decoding Errors
        - pathophysiology#Cochlear Hair Cell Loss
        rationale: Hybrid ribosomes isolate decoding-site effects and lymphoblasts establish cellular
          susceptibility, but neither reproduces the complete sensory-cell context. General drug models
          show multiple exposure-dependent injury responses, including delayed routes not protected by
          the tested mitochondrial antioxidant. A patient-genotype hair-cell system with allele correction
          and physiological drug exposure would help distinguish initiating defects from secondary stress.
      selected_evidence:
        snippet: The mechanism of involvement of mitochondrial mutations in ototoxic hair cell death is
          not completely understood.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
