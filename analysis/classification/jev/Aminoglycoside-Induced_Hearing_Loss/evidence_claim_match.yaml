      assertion_type: ExperimentalModel
      assertion:
        name: Gentamicin and mechanotransduction perturbation in neonatal mouse cochlear explants
        experimental_model_type: PRIMARY_CELL_CULTURE
        description: P3–P5 cochlear explants were used to image RIPOR2 localization and Annexin-V phosphatidylserine
          signals after gentamicin, washout, benzamil or selected stereociliary mutations. Tmie-deficient
          cells lacked both gentamicin responses; benzamil caused phosphatidylserine exposure without
          RIPOR2 movement.
        modeled_mechanisms:
        - target: RIPOR2 Redistribution in Hair Cells
          relationship: PARTIALLY_RECAPITULATES
          description: Gentamicin induced reversible redistribution requiring an intact tested mechanotransduction
            context.
          model_scale: CELLULAR
          limitations: No human MT-RNR1 variant, hearing outcome or newly demonstrated RIPOR2-mediated
            death rescue. Surface phosphatidylserine is not sufficient evidence of apoptosis.
          readouts:
          - name: RIPOR2 subcellular localization
            target: RIPOR2 Redistribution in Hair Cells
            direction: ALTERED
            description: Movement from the stereociliary base to the pericuticular region and subsequent
              recovery.
        notes: Phosphatidylserine exposure alone was insufficient for redistribution. Selective scramblase
          inhibition was not available to establish whether phosphatidylserine is necessary for death.
          Proposed TMC scramblase/TMIE roles and prior RIPOR2–GABARAP rescue results should not be treated
          as new assays here. Benzamil-associated uptake inhibition was inferred rather than measured.
      selected_evidence:
        snippet: cochlear explants dissected from postnatal day 3 to 5 (P3-P5) wild-type C57/BL6 mice
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/4
