      assertion:
        name: MT-RNR1
        gene_term:
          preferred_term: MT-RNR1
          term:
            id: hgnc:7470
            label: MT-RNR1
        relationship_type: CAUSATIVE
        notes: MT-RNR1 encodes mitochondrial 12S rRNA. m.1555A>G and m.1494C>T have high-level evidence
          for aminoglycoside susceptibility; m.1095T>C has moderate evidence and receives the same prescribing
          precaution. Other variants require variant-specific assessment; omission from these actionable
          variants does not prove benignity. There is no established heteroplasmy threshold below which
          an actionable variant makes aminoglycoside exposure safe.
        variants:
        - name: m.1555A>G
          description: The best-studied predisposing variant; high evidence for a drug-variant interaction.
            Hybrid-ribosome experiments show both intrinsic decoding errors and increased drug susceptibility.
        - name: m.1494C>T
          description: A decoding-site variant with high evidence for aminoglycoside susceptibility, including
            maternal pedigrees and hybrid-ribosome experiments. Clinical severity varies.
        - name: m.1095T>C
          description: An actionable susceptibility variant with moderate evidence. The detailed structural
            experiments on m.1555A>G and m.1494C>T should not be assumed to establish an identical molecular
            mechanism for this allele.
      selected_evidence:
        snippet: there was sufficient and consistent evidence to assign actionability to the m.1555A>G
          and m.1494C>T variants with high levels of evidence and the m.1095T>C variant with a moderate
          level of evidence
        supports: SUPPORT
