      assertion_type: Discussion
      assertion:
        discussion_id: alm_vs_thmd4_genotype_phenotype
        prompt: Why does p.Gly177Ala cause a prenatal brain-growth failure while other SLC25A19 variants
          spare development and cause THMD4?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#SLC25A19 Thiamine Pyrophosphate Carrier Deficiency
        rationale: 'Both phenotypes deplete mitochondrial ThPP, but they differ in timing and tissue:
          congenital microcephaly with organic aciduria here, and episodic striatal necrosis with polyneuropathy
          in an otherwise normal child in THMD4. One proposal is that the alleles differ in how well the
          carrier structure tolerates them. The alleles have been compared in the same expression system
          only for uptake and abundance.'
      selected_evidence:
        snippet: An SLC25A19 mutation was previously reported in Amish congenital lethal microcephaly
          but the present patients' phenotype is markedly different, with normal head circumference, normal
          early childhood development, age-appropriate cognitive skills, and normal urinary organic acid
          profile.
        supports: SUPPORT
