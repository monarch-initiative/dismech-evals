      assertion:
        name: Pyruvate Dehydrogenase Complex Insufficiency
        biological_scale: MOLECULAR
        description: Pyruvate dehydrogenase also needs ThPP, and its insufficiency has been proposed to
          explain the lactic acidosis seen during metabolic crises and the persistent lactic acidemia
          of the long-term survivor. Pyruvate dehydrogenase activity has not been measured in patient
          cells, so this node is a hypothesis drawn from the cofactor requirement and the lactate phenotype.
        notes: The same source also names the branched-chain 2-oxoacid dehydrogenase as a ThPP-dependent
          enzyme whose activity may be reduced. It is not modelled as a node because no branched-chain
          amino acid or branched-chain keto acid abnormality has been reported in patients, so such a
          node would have no observed consequence to connect to.
