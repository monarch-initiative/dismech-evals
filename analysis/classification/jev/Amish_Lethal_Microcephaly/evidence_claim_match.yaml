        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: alm_null_mouse_vs_hypomorphic_human
        prompt: Does the Slc25a19 null mouse, which dies at mid-gestation with a neural-tube defect, tell
          us how partial ThPP depletion causes congenital microcephaly and a smooth cortex in humans?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Prenatal Central Nervous System Development
        - animal_models#Mouse
        rationale: The mouse reproduces the biochemical lesion (ThPP depletion and 2-oxoglutarate accumulation)
          but, as a complete null, dies by embryonic day 12, before cortical neurogenesis. Patients carry
          a hypomorphic allele with residual mitochondrial ThPP and survive to birth with a brain that
          stopped developing at about mid-gestation. The neural phenotype of the model (neural-tube closure
          failure) is therefore not the human one, and the cellular route from cofactor deficiency to
          failed cortical growth remains untested in any model.
        proposed_experiments:
        - experiment_id: slc25a19_g177a_knockin_corticogenesis
          experiment_design: TARGETED_PERTURBATION
          name: Slc25a19 p.Gly177Ala knock-in or human cortical organoid model
          description: Introduce the founder p.Gly177Ala allele into mouse, or into human iPSC cortical
            organoids, and measure mitochondrial ThPP, 2-oxoglutarate dehydrogenase flux, neural progenitor
            proliferation and cortical size, with and without high-dose thiamine.
      selected_evidence:
        snippet: These animals had 100% prenatal lethality by embryonic day 12.
        supports: SUPPORT
