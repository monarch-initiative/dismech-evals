          with Amish lethal microcephaly?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Thiamine Supplementation
        rationale: The thiamine recommendation rests on THMD4 cases, in which development is normal before
          episodic striatal injury. In Amish lethal microcephaly the carrier has negligible transport
          activity and the brain malformation is established before birth, so any benefit would be expected
          mainly against postnatal metabolic crises. No treated patient has been reported.
      selected_evidence:
        snippet: In SLC25A19 and TPK1 defects, thiamine has also led to clinical stabilization in single
          cases.
        supports: SUPPORT
