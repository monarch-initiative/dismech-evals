          disease_term:
            preferred_term: Amish lethal microcephaly
            term:
              id: MONDO:0011790
              label: Amish lethal microcephaly
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Urine Organic Acids and SLC25A19 Genetic Testing
        description: Suspected in an infant with severe congenital microcephaly, particularly with a smooth
          brain, callosal dysgenesis or spinal dysraphism, and Amish ancestry. Urine organic acids may
          show isolated 2-oxoglutaric aciduria, but the finding is intermittent, so a normal result does
          not exclude the disease. The diagnosis is confirmed by biallelic pathogenic SLC25A19 variants;
          in Amish patients, by homozygosity for c.530G>C (p.Gly177Ala). Genotyping also separates it
          from other lethal congenital microcephalies with a similar appearance.
      selected_evidence:
        snippet: The diagnosis should be considered in patients with severe congenital microcephaly, especially
          in association with lissencephaly, dysgenesis of the corpus callosum, or a spinal dysraphic
          state.
        supports: SUPPORT
