          name: Amish Lethal Microcephaly
          disease_term:
            preferred_term: Amish lethal microcephaly
            term:
              id: MONDO:0011790
              label: Amish lethal microcephaly
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC25A19
        gene_term:
          preferred_term: SLC25A19
          term:
            id: hgnc:14409
            label: SLC25A19
        relationship_type: CAUSATIVE
        variants:
        - name: c.530G>C (p.Gly177Ala)
          description: Founder missense variant, homozygous in every reported patient. Gly177 is a highly
            conserved residue in the second signature motif of the mitochondrial carrier family. In reconstituted
            proteoliposomes the mutant carrier has negligible transport activity; in HepG2 cells it is
            correctly targeted to mitochondria but is expressed at a reduced level and takes up much less
            ThPP.
          type: MISSENSE
        notes: Biallelic SLC25A19 variants cause the disease; only the homozygous founder variant p.Gly177Ala
          has been reported in it. Other SLC25A19 variants cause THMD4 instead. The only ClinGen gene-disease
          validity record for SLC25A19 in the cached ClinGen export is for Leigh syndrome (MONDO:0009723,
          Limited), a different disease, so no gene_disease_validity tier is recorded here.
      selected_evidence:
        snippet: One of the genes in this region, SLC25A19, which encodes a nuclear mitochondrial deoxynucleotide
          carrier (DNC), contains a substitution that segregates with the disease in affected individuals
          and alters an amino acid that is highly conserved in similar proteins.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
