      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: extrinsic_amnion_rupture_model
        hypothesis_label: Extrinsic amnion-rupture and constriction model
        status: CANONICAL
        description: In prototypic band-positive ABS, amnion rupture or detachment exposes fibrous strands
          that tether and locally constrict fetal parts. Downstream mechanical deformation, venous-lymphatic
          obstruction, impaired distal perfusion, neural compromise, and tissue loss explain the limb-predominant
          spectrum. This model is canonical for that presentation, not universal across every case labeled
          ABS.
      selected_evidence:
        snippet: 'Amniotic rupture appeared to cause injury through three basic mechanisms: (1) interruption
          of normal morphogenesis; (2) crowing of fetal parts; and (3) disruption of previously differentiated
          structure.'
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
