      assertion:
        phase: Prenatal onset and disruption
        age_range: Antenatal
        notes: 'Timing influences the observed spectrum: early rupture was associated with multisystem
          defects and poor fetal outcome, whereas later rupture was predominantly associated with limb
          involvement.'
      selected_evidence:
        snippet: Comparison of 35 cases in which the timing of amniotic rupture could be estimated suggests
          that early amniotic rupture results in multiply affected infants who are frequently aborted
          or stillborn, whereas later rupture results primarily in limb involvement.
        supports: SUPPORT
