        name: Prenatal limb-disruption pattern
        modality: ULTRASOUND
        description: In a small prenatal series, fetal structural findings included syndactyly, limb amputation,
          talipes, a flexed knee, a constriction ring, umbilical-cord strangulation, and acrania. Structural
          abnormalities supported suspicion even when prenatal evidence of amnion rupture was absent.
        diagnostic: true
      selected_evidence:
        snippet: 'To describe the spectrum of clinical deformities related to amniotic band sequence (ABS),
          ranging from mild to severe. ... Retrospective evaluation of 9 cases of ABS managed during a
          4-year period (February 2006 to April 2010) in a tertiary hospital. ... The median gestational
          age at prenatal diagnosis was 15 weeks (range 11-26). Only 2 patients had clinical prenatal
          evidence of amnion rupture. In the other 5 cases the diagnosis of ABS was established prenatally
          based on fetal structural abnormalities. These abnormalities included: (1) upper limb defects:
          syndactyly, amputation at the level of phalanges or first metacarpal or forearm; (2) inferior
          extremities defects: tallus equinovarus and flexed knee, and constriction ring; (3) umbilical
          cord strangulation, and (4) acrania.'
        supports: SUPPORT
