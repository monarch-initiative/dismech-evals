      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: vascular_disruption_adhesion_model
        hypothesis_label: Primary vascular disruption with or without cephalo-amniotic adhesion
        status: ALTERNATIVE
        description: Fetopathologic evidence separates constrictive limb bands from many severe craniofacial
          lesions. In this alternative model, a primary vascular disruption produces encephaloceles or
          facial clefts, sometimes accompanied by broad adhesion of the disrupted fetal part to an intact
          amnion.
