        prompt: Which immune observations are causal rather than accompanying critical illness?
        rationale: Low C1 inhibitor activity and complement concentrations, pulmonary degranulation and
          occasional cytokine elevations supply hypotheses rather than an established ordered pathway.
          Serum and tissue tryptase measurements sample different compartments and times; negative serum
          findings in other cases do not refute local lung degranulation. Healthy controls alone do not
          resolve specificity against sepsis, anaphylaxis or hemorrhagic shock.
        attaches_to:
