      assertion:
        discussion_id: afe_survivorship
        kind: INTERPRETATION
        status: OPEN
        prompt: What is known about long-term recovery and subsequent pregnancy?
        rationale: 'Selected registry interviews at least one year after AFE found PTSD-consistent symptoms
          in 16/29 available survivors; this is not a population PTSD diagnosis rate. Seven women reported
          a later pregnancy: one miscarriage and six uncomplicated term births without recurrence. These
          small selected observations support follow-up and individualized counseling, not a claim of
          zero recurrence risk. The Australasian surveillance captured initial management rather than
          long-term neurologic outcomes.'
      selected_evidence:
        snippet: Of 29 survivors available for interview, 2 reported thyroid abnormalities, 1 reported
          persistent liver dysfunction, and 16 (55.1%) endorsed symptoms consistent with PTSD
        supports: SUPPORT
