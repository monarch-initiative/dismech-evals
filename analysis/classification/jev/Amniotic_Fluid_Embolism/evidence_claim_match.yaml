        - pathophysiology#Reduced C1 Esterase Inhibitor Activity
        - pathophysiology#Pulmonary Mast Cell Degranulation
        - pathophysiology#Maternal Inflammatory Mediator Activation
      selected_evidence:
        snippet: the results obtained were negative for serum tryptase and urinary histamine measurements
          in women with AFE
        supports: SUPPORT
