      assertion:
        discussion_id: afe_mechanical_hypothesis
        kind: CONTROVERSY
        status: OPEN
        prompt: Does fetal material cause collapse through pulmonary microvascular obstruction?
        rationale: Mechanical obstruction was the historical explanation and remains discussed in older
          pathology accounts. Detection of fetal material does not quantify occlusion or establish causality.
          The 2026 SMFM statement considers a direct embolic explanation unlikely; the initiating inflammatory
          trigger remains unresolved. This entry therefore does not assert an established mechanical-obstruction
          node.
      selected_evidence:
        snippet: the fetal materials create physical obstructions in the maternal microvessels in various
          organs, such as the lung
        supports: SUPPORT
