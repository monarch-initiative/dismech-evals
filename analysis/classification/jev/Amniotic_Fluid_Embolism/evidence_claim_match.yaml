          value:
            name: Hemostatic Resuscitation and Fibrinogen Replacement
            therapeutic_modality: OTHER
            description: Activate the massive transfusion protocol for severe bleeding and assess coagulation
              early. Replace red cells, plasma and platelets according to the evolving deficit, with prompt
              fibrinogen replacement using cryoprecipitate or locally appropriate concentrates. The 2026
              checklist describes approximately 1:1:1 component resuscitation and favors concentrated
              cryoprecipitate for fibrinogen support to limit volume overload; this does not replace every
              plasma indication. Avoid excessive crystalloid or colloid loading.
            treatment_term:
              preferred_term: blood transfusion
              term:
                id: NCIT:C15192
                label: Blood Transfusion
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Impaired Hemostasis
        treatment_effect: RESTORES
        description: Replaces deficient hemostatic components while bleeding sources are controlled.
      selected_evidence:
        snippet: we recommend the early assessment of clotting status and early aggressive management
          of clinical bleeding with standard massive transfusion protocols
        supports: SUPPORT
