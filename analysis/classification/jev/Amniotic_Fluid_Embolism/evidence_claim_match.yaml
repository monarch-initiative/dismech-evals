        kind: INTERPRETATION
        status: OPEN
        prompt: Do epidemiologic associations justify altering obstetric practice?
        rationale: Population studies report associations with medical induction, advanced maternal age
          and placental or delivery complications. These do not identify a deterministic cause; confounding,
          reverse causation and case misclassification remain possible. Absence of an actionable prevention
          rule does not refute an association. The Canadian three-million-delivery study reported adjusted
          odds 1.8 for medical induction with low absolute excess risk. Current clinical assessment should
          follow indications for obstetric care rather than an unvalidated AFE prevention strategy.
      selected_evidence:
        snippet: Medical induction of labour nearly doubled the risk of overall cases of amniotic-fluid
          embolism (adjusted odds ratio 1.8 [1.3-2.7])
