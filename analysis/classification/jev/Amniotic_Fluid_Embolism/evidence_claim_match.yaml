      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Although rare, AFE can cause maternal death, emergency hysterectomy, critical illness,
          neurologic injury and substantial psychological morbidity. Population estimates and survival
          differ with ascertainment and diagnostic criteria. There is no validated screening test or established
          prevention strategy; treatment requires a coordinated emergency response.
      selected_evidence:
        snippet: Five woman died (case fatality rate 15%)
        supports: SUPPORT
