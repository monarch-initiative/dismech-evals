      assertion_type: Diagnosis
      assertion:
        name: Strict Criteria for Research Reporting
        description: The 2016 research definition requires sudden arrest, or hypotension with respiratory
          compromise; overt DIC before blood loss sufficient to explain the coagulopathy; onset during
          labor or within 30 minutes of placental delivery; and no intrapartum fever of 38°C or higher.
          These criteria deliberately exclude some atypical clinical cases and should not be used to delay
          support or automatically rule out clinical AFE. In 115 selected registry charts, 54 fulfilled
          the criteria and 14 additional cases were considered AFE by expert review; the comparator was
          expert consensus, not a diagnostic gold standard.
      selected_evidence:
        snippet: The 14 cases (21%) identified by the expert panel as AFE that did not meet the objective
          criteria are believed to represent atypical presentations of this condition.
        supports: SUPPORT
