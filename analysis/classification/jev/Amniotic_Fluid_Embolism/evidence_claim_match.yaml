      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: maternal_inflammatory_response
        hypothesis_label: Abnormal maternal inflammatory response to fetal-compartment exposure
        status: CANONICAL
        description: A prevailing explanatory model links fetal-compartment material entering maternal
          blood to inflammatory mediator activation. Neither a specific antigen nor an IgE-independent
          pathway has been established for every clinical presentation. Complement, mast-cell and cytokine
          observations are heterogeneous and do not prove an obligatory sequence.
      selected_evidence:
        snippet: The pathophysiology appears to involve an abnormal maternal response to fetal tissue
          exposure associated with breaches of the maternal-fetal physiologic barrier during parturition.
        supports: SUPPORT
