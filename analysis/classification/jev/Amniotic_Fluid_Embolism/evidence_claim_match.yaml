      assertion_type: Diagnosis
      assertion:
        name: Clinical Diagnosis and Immediate Differential Assessment
        description: AFE is a clinical diagnosis in sudden peripartum cardiopulmonary compromise with
          coagulopathy after considering alternative causes. Resuscitation proceeds while the differential
          is evaluated. No individual laboratory assay, fetal squame finding or cytokine result can currently
          confirm or exclude AFE.
      selected_evidence:
        snippet: we do not recommend the use of any specific diagnostic laboratory test to either confirm
