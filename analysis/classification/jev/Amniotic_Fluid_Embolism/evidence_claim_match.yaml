      assertion_type: Treatment
      assertion:
        name: Hemostatic Resuscitation and Fibrinogen Replacement
        therapeutic_modality: OTHER
        description: Activate the massive transfusion protocol for severe bleeding and assess coagulation
          early. Replace red cells, plasma and platelets according to the evolving deficit, with prompt
          fibrinogen replacement using cryoprecipitate or locally appropriate concentrates. The 2026 checklist
          describes approximately 1:1:1 component resuscitation and favors concentrated cryoprecipitate
          for fibrinogen support to limit volume overload; this does not replace every plasma indication.
          Avoid excessive crystalloid or colloid loading.
        treatment_term:
          preferred_term: blood transfusion
          term:
            id: NCIT:C15192
            label: Blood Transfusion
      selected_evidence:
        snippet: in AFE, cryoprecipitate is favored over fresh or frozen plasma to limit the risk of volume
          overload while addressing coagulopathy
        supports: SUPPORT
