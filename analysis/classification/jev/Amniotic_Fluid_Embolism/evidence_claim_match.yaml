      assertion_type: Discussion
      assertion:
        discussion_id: afe_case_definition
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How do case definitions affect mechanistic and outcome estimates?
        rationale: Strict research criteria improve consistency but exclude some expert-adjudicated atypical
          cases. The 2020 voluntary registry classified 59/129 typical, 15 atypical, 27 alternative and
          28 indeterminate; indeterminate does not mean a proven alternative diagnosis. A 2024 series
          selected 29 cases using broader proposed criteria, none meeting Clark criteria, without a gold-standard
          validation of the new definition. Different ascertainment and incomplete records limit pooled
          frequency and mortality interpretations.
      selected_evidence:
        snippet: 22% (28/129) had an uncertain diagnosis.
        supports: SUPPORT
