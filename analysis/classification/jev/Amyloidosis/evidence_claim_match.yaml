      assertion_type: Subtype
      assertion:
        name: ATTRv
        display_name: ATTRv (Hereditary Transthyretin) Amyloidosis
        description: Autosomal dominant amyloidosis caused by pathogenic variants in the TTR gene that
          destabilize the transthyretin tetramer, leading to monomer dissociation, misfolding, and amyloid
          fibril deposition predominantly in peripheral nerve and heart.
      selected_evidence:
        snippet: TTR protein destabilised by TTR gene mutation is prone to dissociate from its native
          tetramer to monomer, and to then misfold and aggregate into amyloid fibrils, resulting in autosomal
          dominant hereditary amyloidosis
        supports: SUPPORT
