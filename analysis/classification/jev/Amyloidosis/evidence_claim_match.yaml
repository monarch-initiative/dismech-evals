      assertion_type: Discussion
      assertion:
        discussion_id: amyloidosis_precursor_specificity_and_umbrella_scope
        prompt: How should precursor-specific epidemiology, organ tropism, and treatment effects be compared
          without treating amyloidosis as one homogeneous disease?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Amyloid Fibril Formation and Extracellular Deposition
        rationale: Amyloid fibril formation is shared, but AL, ATTRv, ATTRwt, AA, hereditary non-TTR,
          and localized forms differ in precursor supply, affected populations, organ distribution, prognosis,
          and therapy. This umbrella record therefore retains subtype qualifiers and defers subtype-level
          detail to dedicated entries.
      selected_evidence:
        snippet: 'Possible novel human amyloid fibril proteins, appearing as ''classical'' in vivo amyloid,
          were discussed. It was decided to include fibulin-like extracellular matrix protein 1 (amyloid
          protein: AEFEMP1), which appears as localised amyloid in portal veins. There are several possible
          amyloid proteins under investigation'
        supports: SUPPORT
