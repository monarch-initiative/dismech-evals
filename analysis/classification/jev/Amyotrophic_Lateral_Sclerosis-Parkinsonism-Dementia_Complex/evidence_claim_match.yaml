      assertion_type: EpidemiologyInfo
      assertion:
        name: Divergent late-century incidence trajectories
        description: Case-registration data from 1940-1999 showed a sustained decline in Guam ALS incidence,
          whereas PDC incidence declined until the late 1980s and then rose slightly over 1980-1999. The
          authors considered the rapid change inconsistent with a purely genetic explanation, but the
          study did not identify a specific causal exposure.
      selected_evidence:
        snippet: The results of this study confirmed that the incidence of ALS declined steadily during
          the past 40 years. The incidence of PDC also declined until the late 1980s but, unlike ALS,
          showed a slight increase from 1980 to 1999.
        supports: SUPPORT
