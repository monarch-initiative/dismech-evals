        snippet: In replicated experiments, we found that chronic dietary exposure to a cyanobacterial
          toxin present in the traditional Chamorro diet, β-N-methylamino-l-alanine (BMAA), triggers the
          formation of both NFT and β-amyloid deposits similar in structure and density to those found
          in brain tissues of Chamorros who died with ALS/PDC.
