        hypothesis_label: Cycad-Derived L-BMAA Neurotoxicity Model
        status: ALTERNATIVE
        description: Chronic dietary L-BMAA exposure through traditional cycad-associated foods is proposed
          to cause glutamate-receptor-mediated motor-neuron injury and, based on a primate model, tau
          and amyloid-beta pathology. The mechanistic steps are experimentally supported in cells and
          vervets, but human Guam causation is not established and a critical review found the causal
          hypothesis unsupported.
