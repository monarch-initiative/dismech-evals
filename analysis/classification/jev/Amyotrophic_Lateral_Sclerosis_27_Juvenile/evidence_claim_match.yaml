          the selective neuronal injury pathway remains unresolved. Plasma concentrations do not localize
          the relevant tissue exposure. Candidate mitochondrial and inflammatory signals in non-neural
          cells do not establish necessary mediators. Sensory-motor overlap also argues against a strict
          two-disease dichotomy.
