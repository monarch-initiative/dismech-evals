          patient ALS27 alleles. The article labels one SPTLC1 construct Y23A, whereas patient reports
          identify Y23F. Binding-pocket occupancy and allosteric effects for every ALS allele remain unresolved.
        readouts:
        - name: Ceramide-dependent inhibition of selected variant complexes
          target: Reduced Ceramide Responsiveness
          direction: DECREASED
          interpretation: Selected SPTLC1 variant complexes had impaired ceramide sensing despite ORMDL
            retention.
      selected_evidence:
        snippet: Our results, in which ORMDL3 is apparently associated with the complexes containing the
          SPTLC1 variants, demonstrate that the unrestrained sphingolipid biosynthesis caused by SPTLC1
          ALS variants is associated, at least in part, with impaired ceramide sensing of these variants
          when ORMDL is contained within the SPT complex.
        supports: SUPPORT
        directness: DIRECT
