      assertion_type: AnimalModel
      assertion:
        name: Sptlc1 exon 2 deletion mouse
        species: Mouse
        genotype: Sptlc1ΔE2/+ and Sptlc1ΔE2/ΔE2; CRISPR 195-bp genomic deletion
        category: GENETIC
        publication: PMID:42392979
        description: The mouse exon deletion models the human c.58G>T splice consequence. Heterozygotes
          lacked overt motor deficits through 15 months, had tested CMAP measurements at 17 months and
          no overt neuronal-loss/gliosis findings at 18 months. Four-month tissue lipid concentrations
          were unchanged in the measured classes. Among 100 offspring only three homozygotes were found;
          those survivors failed to thrive and died at 6–8 weeks. Prenatal loss was inferred from under-representation,
          not demonstrated by staged embryonic observation. No direct SPT activity or synthesis-flux assay
          established whether the allele increases or decreases enzymatic function in vivo.
        genes:
        - preferred_term: SPTLC1
          term:
            id: hgnc:11277
            label: SPTLC1
        modeled_mechanisms:
        - target: Lower Motor Neuron Degeneration
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Overt tested motor, CMAP and late histological abnormalities were not reproduced
            in heterozygotes.
          limitations: The exon deletion models the splice consequence of human c.58G>T, but not every
            ALS27 allele. Steady-state lipid concentrations are not synthesis flux. Mutant-protein abundance,
            incorporation and SPT-ORMDL stoichiometry were unresolved; several partner antibodies were
            unusable. Homozygous under-representation and death do not prove enzymatic loss of function.
            Negative findings apply to the tested ages, assays and housing conditions.
          readouts:
          - name: Tested heterozygous motor and neurodegenerative phenotype
            target: Lower Motor Neuron Degeneration
            direction: UNCHANGED
            interpretation: Overt tested motor, CMAP and late histological abnormalities were not reproduced
              in heterozygotes.
        - target: Canonical Sphingolipid Accumulation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The measured tissue lipid pools were not significantly different at four months;
            this does not refute increased synthesis in human cells.
          limitations: The exon deletion models the splice consequence of human c.58G>T, but not every
            ALS27 allele. Steady-state lipid concentrations are not synthesis flux. Mutant-protein abundance,
            incorporation and SPT-ORMDL stoichiometry were unresolved; several partner antibodies were
            unusable. Homozygous under-representation and death do not prove enzymatic loss of function.
            Negative findings apply to the tested ages, assays and housing conditions.
          readouts:
          - name: Steady-state tissue sphingolipid concentrations
            target: Canonical Sphingolipid Accumulation
            direction: UNCHANGED
            interpretation: The measured tissue lipid pools were not significantly different at four months;
              this does not refute increased synthesis in human cells.
      selected_evidence:
        snippet: Leveraging the high genomic sequence similarity between mouse and human SPTLC1, we created
          a novel knock-in mouse model with a CRISPR/Cas9-mediated deletion of exon 2 in the endogenous
          murine Sptlc1 locus.
        supports: SUPPORT
        directness: DIRECT
