        name: Patient fibroblasts and allele-selective siRNA
        experimental_model_type: PRIMARY_CELL_CULTURE
        description: Fibroblasts with L39del or F40_S41del showed altered lipid synthesis and ceramide
          feedback. Allele-selective siRNA lowered excess synthesis and restored ceramide responsiveness
          under the tested culture conditions. Primary cultures supplied several lipid assays; native-complex
          profiling additionally used immortalized derivatives.
        modeled_mechanisms:
        - target: Increased De Novo Sphingolipid Synthesis
          relationship: RESCUES
          fidelity: MODERATE
          description: Allele-selective siRNA reduced abnormal lipid synthesis in tested patient cultures.
          limitations: Non-neuronal patient skin fibroblasts reproduce biochemical defects but do not
            test selective motor neuron death or clinical efficacy. The native-gel complex experiment
            used immortalized fibroblast derivatives; it must not be described as an entirely primary-cell
            assay.
          readouts:
          - name: Canonical lipid synthesis after variant-selective knockdown
            target: Increased De Novo Sphingolipid Synthesis
            direction: RESTORED
            interpretation: Allele-selective siRNA reduced abnormal lipid synthesis in tested patient
              cultures.
        - target: Reduced SPT Feedback Inhibition
          relationship: RESCUES
          fidelity: MODERATE
          description: Variant-selective knockdown restored sensitivity to C6-ceramide.
          limitations: Non-neuronal patient skin fibroblasts reproduce biochemical defects but do not
            test selective motor neuron death or clinical efficacy. The native-gel complex experiment
            used immortalized fibroblast derivatives; it must not be described as an entirely primary-cell
            assay.
          readouts:
          - name: C6-ceramide feedback response
            target: Reduced SPT Feedback Inhibition
            direction: RESTORED
            interpretation: Variant-selective knockdown restored sensitivity to C6-ceramide.
        cell_source: Patient skin-derived fibroblasts, with immortalized derivatives for native-complex
          assays
      selected_evidence:
        snippet: For blue-native PAGE (BN-PAGE) analysis, control and patient fibroblasts were immortalized
          by transduction with retroviral vectors expressing the HPV-16 E7 gene and the catalytic component
          of human telomerase, as described previously (35).
        supports: SUPPORT
        directness: DIRECT
