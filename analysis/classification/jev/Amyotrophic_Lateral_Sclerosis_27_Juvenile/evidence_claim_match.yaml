      assertion_type: ExperimentalModel
      assertion:
        name: Purified human SPT-ORMDL and engineered membrane assays
        experimental_model_type: OTHER
        description: Human SPT-ORMDL complexes expressed in HEK293F cells were purified for cryo-EM and
          biochemical inhibition assays. Engineered ORMDL mutations tested the proposed ceramide-sensing
          site; related HeLa membrane assays tested feedback outside detergent-purified preparations.
          ALS-variant complexes retained ORMDL in this study while showing impaired ceramide response,
          providing a route distinct from universal dissociation.
        modeled_mechanisms:
        - target: Reduced Ceramide Responsiveness
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Selected SPTLC1 variant complexes had impaired ceramide sensing despite ORMDL retention.
          limitations: Recombinant proteins, detergent micelles and short-chain ceramide assays do not
            fully reproduce native neuronal membranes. ORMDL N13A/ΔN2 mutations are engineered probes
            rather than patient ALS27 alleles. The article labels one SPTLC1 construct Y23A, whereas patient
            reports identify Y23F. Binding-pocket occupancy and allosteric effects for every ALS allele
            remain unresolved.
          readouts:
          - name: Ceramide-dependent inhibition of selected variant complexes
            target: Reduced Ceramide Responsiveness
            direction: DECREASED
            interpretation: Selected SPTLC1 variant complexes had impaired ceramide sensing despite ORMDL
              retention.
      selected_evidence:
        snippet: Here we show that purified human SPT-ORMDL complexes are inhibited by the central sphingolipid
          metabolite ceramide.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /experimental_models/3
