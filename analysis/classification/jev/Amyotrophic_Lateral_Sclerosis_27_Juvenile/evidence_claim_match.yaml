      assertion:
        name: 'Allele-selective SPTLC1 siRNA: preclinical investigation'
        description: Variant-selective siRNAs reduced abnormal lipid synthesis in fibroblasts carrying
          L39del or F40_S41del. This is biochemical rescue in cultured non-neuronal cells, not demonstrated
          rescue of neuron survival or patient disability. Each allele needs its own validated sequence;
          delivery, specificity and safe long-term lowering in the nervous system remain unresolved.
        treatment_term:
          preferred_term: 'Allele-selective SPTLC1 siRNA: preclinical investigation'
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        therapeutic_modality: SIRNA
      selected_evidence:
        snippet: We custom designed small interfering RNAs that selectively target the SPTLC1 ALS allele
          for degradation, leave the normal allele intact and normalize sphingolipid levels in vitro.
        supports: SUPPORT
        directness: DIRECT
