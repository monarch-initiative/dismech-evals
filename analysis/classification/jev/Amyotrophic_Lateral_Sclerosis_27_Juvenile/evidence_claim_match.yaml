            label: SPTLC1
        relationship_type: CAUSATIVE
        notes: SPTLC1 encodes an SPT subunit. Heterozygous transmembrane-region variants include Y23F,
          L38R, L39del and F40_S41del. c.58G>T predominantly alters splicing, whereas c.58G>A retained
          exon 2 in one non-neural assay despite sharing codon 20. Sequence, transcript and protein-level
          interpretations must be distinguished. The p.Leu38Arg case-report title has discordant nucleotide/protein
          notation, so only the protein designation is used here. S331 substitutions can produce mixed
          sensory-autonomic and motor disease. Neither variant position alone nor a single plasma lipid
          result determines clinical classification.
      selected_evidence:
        snippet: all patients in this family carried the same SPTLC1 variant (NM_006415.4:c.115_117delCTT,
          p.(L39del)), which was recurrent in two unrelated childhood ALS patients
