        context: []
      assertion_type: Treatment
      assertion:
        name: 'L-serine supplementation: unresolved clinical and biochemical effects'
        description: One compassionate-use patient gained weight without demonstrated neurological improvement.
          A HEK293FT study reported substrate-preference and mitochondrial-probe changes improved by serine,
          whereas isotope-labeled motor neuron-like cells showed increased canonical lipid production
          with serine availability. The substrate-preference result was not reproduced under another study's
          conditions. These are different assays and alleles; neither clinical benefit nor clinical worsening
          is established. Supplementation is not an established ALS27 treatment, and a theoretical risk
          of increasing lipid production warrants specialist caution.
        treatment_term:
          preferred_term: 'L-serine supplementation: unresolved clinical and biochemical effects'
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: L-serine
            term:
              id: CHEBI:17115
              label: L-serine
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: We did not observe evidence of neurological improvement, although prolonged therapy would
          be required to detect such an effect.
        supports: SUPPORT
        directness: DIRECT
