            term:
              id: MONDO:0007103
              label: amyotrophic lateral sclerosis type 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Nutritional Support and Gastrostomy
        description: Assess swallowing, nutrition and feeding effort and discuss gastrostomy early, revisiting
          the decision as disease progresses. In respiratory insufficiency, introduce NIV and perform
          gastrostomy with the patient established on NIV. Tube feeding supports nutritional delivery
          without restoring bulbar motor function.
      selected_evidence:
        snippet: Discuss gastrostomy at an early stage, and at regular intervals as ALS progresses, taking
          into account the person's preferences and issues, such as ability to swallow, weight loss, respiratory
          function, effort of feeding and drinking, and risk of choking.
        supports: SUPPORT
    origin:
