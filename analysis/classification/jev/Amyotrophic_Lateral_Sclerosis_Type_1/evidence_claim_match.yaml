      assertion_type: Treatment
      assertion:
        name: Tofersen
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        description: Tofersen is an intrathecal antisense oligonucleotide that promotes RNase H-mediated
          degradation of SOD1 mRNA and reduces SOD1 protein production. EAN guidance recommends it for
          progressive ALS caused by pathogenic SOD1 variants, with discussion of treatment burden and
          serious adverse events. US accelerated approval was based on reduced plasma NfL. In the 108-participant
          randomized VALOR phase, the 28-week primary clinical endpoint in the prespecified faster-progression
          subgroup (60 of 108 participants) was not met despite reduced CSF SOD1 and plasma NfL. The extension
          retained the original randomized early/delayed groups, but everyone could receive active drug
          after week 28; later comparisons therefore lack an untreated control. At week 148, earlier initiation
          was associated with numerically less decline, with imprecise survival estimates. Four uncontrolled
          Icelandic p.Gly94Ser cases provide additional clinical observations, not proof of universal
          stabilization. Myelitis/radiculitis, raised intracranial pressure with papilledema, and aseptic
          meningitis require specific safety discussion and evaluation.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: tofersen
            term:
              id: NCIT:C166584
              label: Tofersen
        oligonucleotide_details:
          target_gene:
            preferred_term: SOD1
            term:
              id: hgnc:11179
              label: SOD1
          target_transcript: SOD1 mRNA
          conjugation: UNCONJUGATED
          oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
          oligonucleotide_chemistry: TWO_PRIME_O_METHOXYETHYL
      selected_evidence:
        snippet: In patients with progressive ALS caused by pathogenic mutations in superoxide dismutase
          1 (SOD1), offer tofersen as first‐line treatment.
        supports: SUPPORT
