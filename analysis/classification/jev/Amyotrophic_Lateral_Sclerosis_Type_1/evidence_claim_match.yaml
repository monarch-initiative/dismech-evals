              label: amyotrophic lateral sclerosis type 1
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: ATP-triggered SOD1 donor and recipient cultures
        experimental_model_type: CELL_LINE
        description: Transfected NSC34 cells exposed to 3–5 mM ATP release particulate material. Recipient
          NSC34 cells and EOC13 microglia show ER stress reporter activity and TNF release respectively.
        modeled_mechanisms:
        - target: P2X7-Associated SOD1 Release
          relationship: PARTIALLY_RECAPITULATES
          model_scale: CELLULAR
          description: Antagonist-sensitive release occurs after high ATP exposure.
          limitations: NSC34 is a murine hybrid line, not a primary human motor neuron. A single antagonist
            without receptor knockout supports pharmacological involvement; low LDH only limits overt
            lysis under the tested conditions.
        notes: Released 20000-g pellets contain mixed material. EGFP control preparations can also provoke
          responses, so purified SOD1 necessity and recipient death are not demonstrated. Release includes
          tested wild-type SOD1. The CELL_LINE classification reflects separate donor and recipient cell-line
          assays with transfer of released material, rather than an assumption of direct mixed-cell coculture.
      selected_evidence:
        snippet: ATP induced the rapid release of aggregated SOD1G93A from NSC-34 cells transiently transfected
          with SOD1G93A, a process blocked by AZ10606120 and revealing a role for P2X7 in this process.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/2
      evidence_path: /experimental_models/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35478453
      reference_title: P2X7 receptor activation mediates superoxide dismutase 1 (SOD1) release from murine
