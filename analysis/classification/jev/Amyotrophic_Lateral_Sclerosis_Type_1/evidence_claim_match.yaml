  e0c18f7589e657b765c31d887669c63e6263e5df96bd4f0666ddc4cadbf7c1e8:
    claim:
      about:
        disease:
          name: Amyotrophic Lateral Sclerosis Type 1
          disease_term:
            preferred_term: amyotrophic lateral sclerosis type 1
            term:
              id: MONDO:0007103
              label: amyotrophic lateral sclerosis type 1
        context: []
      assertion_type: Genetic
      assertion:
        name: SOD1
        gene_term:
          preferred_term: SOD1
          term:
            id: hgnc:11179
            label: SOD1
        relationship_type: CAUSATIVE
        notes: SOD1 encodes Cu/Zn superoxide dismutase. More than 200 ALS-associated variants are reported,
          with variant-dependent penetrance and progression. A5V (legacy A4V) is associated with rapid
          progression in described families, whereas some other variants have slower courses. These associations
          do not determine an individual prognosis. p.Asp91Ala can occur in recessive or dominant contexts;
          homozygosity for a different allele does not establish the Scandinavian D90A inheritance mechanism.
        frequency: The SOD1 share of ALS varies by ancestry, familial ascertainment and cohort; the selected
          Indian cohort reported 24.2% of familial ALS and 4.8% of all sequenced ALS.
        case_fractions:
        - population: Familial ALS probands, single-center Indian cohort (NIMHANS)
          case_fraction_percent: 24.2
          notes: 37 SOD1-ALS probands from 33 families among 765 individuals undergoing whole-exome sequencing;
            the 24.2% figure is the share of familial ALS, while SOD1-ALS was 4.8% of the whole sequenced
            cohort.
      selected_evidence:
        snippet: We identified 11 different SOD1 missense mutations in 13 different FALS families.
        supports: SUPPORT
