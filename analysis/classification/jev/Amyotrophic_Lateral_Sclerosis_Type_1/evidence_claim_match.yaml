              label: amyotrophic lateral sclerosis type 1
        context: []
      assertion_type: Subtype
      assertion:
        name: D90A homozygous
        display_name: SOD1 p.Asp90Ala homozygous (D90A/D91A, recessive Scandinavian form)
        description: Homozygosity for p.Asp91Ala (legacy D90A) defines a well-described recessive Scandinavian
          form, often with slowly progressive leg-onset disease. Sensory and urinary manifestations and
          widespread pathology were documented in a selected nine-person autopsy series. The same variant
          can be associated with dominant ALS outside this recessive context, and ataxia-first presentations
          have occurred in both heterozygous and homozygous carriers. Normal or near-normal dismutase
          activity in this variant argues against a universal enzymatic-loss explanation. Transgenic coexpression
          and aggregate-strain experiments are retained as models, not as proof of the human recessive
          mechanism.
      selected_evidence:
        snippet: the heredity is usually recessive, the phenotype is stereotypic with slowly evolving
          motor symptoms beginning in the legs and may also include sensory, autonomic, and urinary bladder
          involvement
        supports: SUPPORT
    origin:
