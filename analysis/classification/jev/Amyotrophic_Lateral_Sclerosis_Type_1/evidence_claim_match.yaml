      assertion_type: Treatment
      assertion:
        name: Noninvasive Ventilation
        description: Offer noninvasive ventilation when symptoms, signs or investigations support respiratory
          insufficiency, with efforts to accommodate bulbar dysfunction. Discuss invasive ventilation
          in advance according to preferences and clinical circumstances. Diaphragmatic pacing is not
          recommended.
      selected_evidence:
        snippet: NIV should be offered to all patients with ALS with either symptoms, signs, or laboratory
          investigations supportive of respiratory insufficiency.
        supports: SUPPORT
