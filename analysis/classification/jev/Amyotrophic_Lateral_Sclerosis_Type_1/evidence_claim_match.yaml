          value:
            name: D90A homozygous
            display_name: SOD1 p.Asp90Ala homozygous (D90A/D91A, recessive Scandinavian form)
            description: Homozygosity for p.Asp91Ala (legacy D90A) defines a well-described recessive
              Scandinavian form, often with slowly progressive leg-onset disease. Sensory and urinary
              manifestations and widespread pathology were documented in a selected nine-person autopsy
              series. The same variant can be associated with dominant ALS outside this recessive context,
              and ataxia-first presentations have occurred in both heterozygous and homozygous carriers.
              Normal or near-normal dismutase activity in this variant argues against a universal enzymatic-loss
              explanation. Transgenic coexpression and aggregate-strain experiments are retained as models,
              not as proof of the human recessive mechanism.
          role: subtype
      assertion_type: Phenotype
      assertion:
        name: Somatic Sensory Dysfunction
        category: Neurological
        subtype: D90A homozygous
        description: Sensory abnormalities are documented in selected SOD1 phenotypes. In nine D90A homozygotes,
          vibration sense was impaired in all and tactile sensation in two; the same autopsy cohort had
          dorsal-column degeneration. These findings do not imply sensory involvement in every SOD1 carrier.
        phenotype_term:
          preferred_term: Somatic sensory dysfunction
          term:
            id: HP:0003474
            label: Somatic sensory dysfunction
      selected_evidence:
        snippet: In addition to degeneration of the corticospinal tracts, all patients had degeneration
          of the dorsal columns.
        supports: SUPPORT
