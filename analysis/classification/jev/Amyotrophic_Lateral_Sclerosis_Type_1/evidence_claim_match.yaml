            vary together; long incubation overlaps spontaneous disease in some older animals. Conditional
            incubation analyses exclude asymptomatic animals. An internal six-versus-five denominator
            discrepancy prevents a universal seeding-rate estimate.
        - target: Motor Neuron Degeneration
