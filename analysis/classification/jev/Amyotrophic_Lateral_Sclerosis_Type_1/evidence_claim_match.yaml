        context: []
      assertion_type: Subtype
      assertion:
        name: A4V
        display_name: SOD1 p.Ala4Val (A4V, legacy numbering; p.Ala5Val in HGVS)
        description: The p.Ala5Val allele (legacy A4V) is associated with rapid progression in reported
          North American families. A historical study reported mean survival of 1.4 years from onset;
          this is a cohort estimate rather than an individual prognosis. Most carriers studied shared
          a founder haplotype. The inferred founder origin and failure to identify a nearby modifier do
          not exclude distant modifiers or prove that every carrier has the same course.
      selected_evidence:
        snippet: It therefore appears likely that the aggressive nature of the SOD1(A4V) mutation is not
          a result of a modifying factor within the region around the SOD1 gene.
        supports: SUPPORT
