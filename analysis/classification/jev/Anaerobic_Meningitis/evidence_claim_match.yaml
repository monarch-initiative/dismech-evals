      reference: PMID:22618789
      reference_title: Pathophysiology of acute meningitis caused by Streptococcus pneumoniae and adjunctive
        therapy approaches.
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      explanation: States that the modelled oxidative-injury cascade is characterized in pneumococcal
        meningitis, the source of the extrapolation this gap names.
