          on tumor-infiltrating T cells, consistent with adaptive immune resistance to anti-tumor immunity.
          This mechanism is the therapeutic rationale for PD-1 blockade (pembrolizumab, nivolumab) in
          recurrent or metastatic disease.
        cell_types:
        - preferred_term: stratified squamous epithelial cell of anal canal
