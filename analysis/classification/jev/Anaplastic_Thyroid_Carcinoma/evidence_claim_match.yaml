          or SMARCB1. These mutations are enriched in ATC relative to less advanced thyroid cancers and
          collapse chromatin accessibility at thyroid lineage-specification genes, reinforcing the dedifferentiated,
          radioiodine-refractory state and rendering tumors insensitive to MAPK-inhibitor-based redifferentiation.
