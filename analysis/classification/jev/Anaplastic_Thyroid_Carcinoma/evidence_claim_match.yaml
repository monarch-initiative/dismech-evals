        description: 'During progression to ATC, tumor cells activate an epithelial-mesenchymal transition
          (EMT) program: they lose the epithelial adhesion molecule E-cadherin and gain mesenchymal markers
          such as vimentin together with the EMT transcription factor ZEB1. This phenotypic switch underlies
          the migratory, invasive, and metastatic behavior that characterizes anaplastic thyroid carcinoma.'
        biological_processes:
