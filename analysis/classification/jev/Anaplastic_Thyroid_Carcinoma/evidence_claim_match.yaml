          modifier: INCREASED
          term:
            id: GO:0001837
            label: epithelial to mesenchymal transition
      selected_evidence:
        snippet: Marked E-cadherin immunoreactivity in the cell membrane of cancer cells (score 2–3) was
          detected in non-cancerous control tissues (100%; 15/15), but not detected (score 0–1) in the
          ATC tissues (0%; 14/14). Vimentin immunoreactivity score of ≥2 was detected in all ATC and normal
          or AG tissues (100%; 14/14 and 15/15, respectively). Marked ZEB1 immunoreactivity scoring ≥2
          was observed in all ATC tissues (100%; 14/14), but not in AG tissues (0%; 0/15).
        supports: SUPPORT
