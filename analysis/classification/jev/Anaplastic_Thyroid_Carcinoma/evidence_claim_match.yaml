      assertion:
        name: Adaptive Immune Resistance and Immunosuppressive Microenvironment
        conforms_to: immune_checkpoint_blockade#Adaptive Immune Resistance
        description: ATC frequently upregulates tumor-cell PD-L1 within an immune-infiltrated microenvironment.
          The majority of ATCs are PD-L1-positive and contain abundant CD3+/CD8+ tumor-infiltrating lymphocytes
          and tumor-associated macrophages, indicating an "immune-adapted" tumor in which pre-existing
          anti-tumor immunity is actively suppressed through the PD-1/PD-L1 axis. PD-L1 positivity is
          enriched in BRAF V600E-mutant ATC and is considered predictive of response to anti-PD-1/PD-L1
          therapy.
        cell_types:
