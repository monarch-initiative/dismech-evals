  71fa776cea0c89450003fec5343d1d158dfa752be6009023a3067f6beef32ea6:
    claim:
      about:
        disease:
          name: Anauxetic dysplasia
          disease_term:
            preferred_term: anauxetic dysplasia
            term:
              id: MONDO:0011773
              label: anauxetic dysplasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_anauxetic_is_it_really_a_ribosomopathy
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is anauxetic dysplasia genuinely a disorder of ribosome biogenesis, or does the rRNA-cleavage
          correlation track something else that RNase MRP does?
        attaches_to:
        - pathophysiology#Impaired rRNA Cleavage in Ribosome Assembly
        - pathophysiology#RNase MRP Complex Loss of Function
        rationale: 'The ribosomopathy framing rests on a correlation between residual rRNA cleavage activity
          and skeletal severity, and it is how this entry and most of the literature describe the disorder.
          But that assumption has been questioned directly in the POP1 literature, and RNase MRP has at
          least four known activities beyond 5.8S rRNA processing: Cyclin B2 mRNA cleavage, mitochondrial
          RNA processing, and complex formation with hTERT. A correlation with rRNA cleavage does not
          establish that reduced ribosome output is the effector, since the same alleles may degrade a
          co-varying activity. This matters because it determines whether anauxetic dysplasia belongs
          mechanistically alongside the other ribosomopathies or forms its own class.'
        proposed_experiments:
        - experiment_id: exp_anauxetic_ribosome_output_vs_severity
          name: Direct measurement of ribosome output against skeletal severity across CHH-AD alleles
          description: Measure ribosome biogenesis output directly, by polysome profiling and nascent
            5.8S rRNA quantification, in patient chondrocytes or chondroprogenitors across an allelic
            series spanning CHH to anauxetic dysplasia, and test whether ribosome output rather than cleavage-assay
            activity predicts skeletal severity. Measure Cyclin B2 turnover and mitochondrial RNA processing
            in the same cells as co-varying candidates.
          decision_criterion: If ribosome output predicts skeletal severity better than the other activities
            do, the ribosomopathy label is earned; if a co-varying activity predicts it as well or better,
            it is not.
          supporting_outcome:
          - Reduced ribosome output is the effector and the disorder is a true ribosomopathy
          refuting_outcome:
          - A co-varying RNase MRP activity predicts skeletal severity equally well, so the ribosomopathy
            label is an artefact of assay choice
      selected_evidence:
        snippet: Although CHH and other skeletal dysplasias caused by mutations in RMRP or POP1 are commonly
          cited as ribosomal biogenesis disorders, recent studies question this assumption.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28067412
      reference_title: 'Broadening the phenotypic spectrum of POP1-skeletal dysplasias: identification
        of POP1 mutations in a mild and severe skeletal dysplasia.'
      evidence_source: HUMAN_CLINICAL
      explanation: Direct published challenge to the ribosomopathy framing this entry otherwise adopts.
