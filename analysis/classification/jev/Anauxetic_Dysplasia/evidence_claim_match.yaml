        name: Impaired rRNA Cleavage in Ribosome Assembly
        biological_scale: MOLECULAR
        description: The first of the two substrate arms. RNase MRP participates in ribosomal RNA processing
          during ribosome assembly, and the magnitude of the rRNA cleavage defect correlates directly
          with the degree of bone dysplasia. Anauxetic dysplasia sits at the severe end because its allele
          combinations produce the greatest loss of this specific activity. The ribosomopathy label is
          the conventional reading of that correlation, but it is contested; see the knowledge gap attached
          to this node.
        biological_processes:
        - preferred_term: rRNA processing
          term:
            id: GO:0006364
            label: rRNA processing
          modifier: DECREASED
      selected_evidence:
        snippet: In vitro testing of RNase MRP multiprotein-specific mRNA and rRNA cleavage of different
          mutations revealed a strong correlation between the decrease in rRNA cleavage in ribosomal assembly
          and the degree of bone dysplasia
        supports: SUPPORT
