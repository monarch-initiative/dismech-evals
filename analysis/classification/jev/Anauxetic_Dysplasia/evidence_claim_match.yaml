      assertion:
        name: RNase MRP Complex Loss of Function
        biological_scale: MOLECULAR
        description: RMRP encodes the untranslated RNA component of RNase MRP, a ribonucleoprotein endoribonuclease.
          Pathogenic variants either alter evolutionarily conserved nucleotides or disrupt the secondary
          structure by mispairing within stem regions, so the lesion is one of RNA folding and catalysis
          rather than of a protein coding sequence. The genetically distinct forms hit protein members
          of the same complex (POP1) or an interacting nucleolar partner (NEPRO), which is why they converge
          on one phenotype.
        genes:
        - preferred_term: RMRP
          term:
            id: hgnc:10031
            label: RMRP
        - preferred_term: POP1
          term:
            id: hgnc:30129
            label: POP1
        - preferred_term: NEPRO
          term:
            id: hgnc:24496
            label: NEPRO
      selected_evidence:
        snippet: The RMRP gene encodes the untranslated RNA component of the mitochondrial RNA-processing
          ribonuclease, RNase MRP.
        supports: SUPPORT
