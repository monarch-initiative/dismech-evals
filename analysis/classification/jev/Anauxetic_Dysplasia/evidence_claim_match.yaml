      assertion_type: Pathophysiology
      assertion:
        name: Growth Plate Chondrocyte Differentiation Failure
        biological_scale: TISSUE
        description: Chondrocytes in the proliferative zone of the growth plate are among the most biosynthetically
          demanding cells in the developing skeleton, which is why a generalized ribosome assembly defect
          strikes them hardest. Experimentally the step most affected is hypertrophic differentiation
          rather than proliferation alone, and RNase MRP is itself expressed in the growth plate with
          expression tracking chondrocyte hypertrophy. The result is metaphyseal dysplasia and a failure
          of endochondral bone elongation that is already evident at birth.
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: chondrocyte differentiation
          term:
            id: GO:0002062
            label: chondrocyte differentiation
          modifier: DECREASED
        - preferred_term: chondrocyte hypertrophy
          term:
            id: GO:0003415
            label: chondrocyte hypertrophy
          modifier: DECREASED
        - preferred_term: endochondral ossification
          term:
            id: GO:0001958
            label: endochondral ossification
          modifier: DECREASED
      selected_evidence:
        snippet: CHH-AD spectrum disorders are characterized by severe disproportionate (short-limb) short
          stature that is usually recognized in the newborn, and occasionally prenatally because of the
          short extremities.
        supports: SUPPORT
