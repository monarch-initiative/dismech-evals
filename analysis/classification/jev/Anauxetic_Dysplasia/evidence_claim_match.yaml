        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_anauxetic_natural_history_and_therapy
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What are the subtype-specific natural history, complication rates, and treatment outcomes
          of anauxetic dysplasia?
        rationale: Published evidence consists mainly of single cases, small families, and mechanism studies
          across the broader CHH-AD spectrum. There are no reliable ANXD-specific prevalence, penetrance,
          survival, quality-of-life, or treatment-response estimates, and no disease-specific interventional
          trial was identified. The 2026 ANXD3 report adds three cases and new systemic findings but remains
          too small to establish frequency or causality for each manifestation. A longitudinal, genotype-stratified
          registry is needed to distinguish reproducible subtype features from family-specific observations
          and to evaluate orthopedic and surveillance outcomes.
        attaches_to:
        - phenotypes#Severe short stature
        - phenotypes#Atlantoaxial dislocation
        - phenotypes#Thoracolumbar kyphoscoliosis
        proposed_experiments:
        - experiment_id: exp_anauxetic_longitudinal_registry
          name: Genotype-stratified international ANXD natural-history registry
          description: Enroll molecularly confirmed RMRP-, POP1-, and NEPRO-related cases with harmonized
            skeletal imaging, cervical stability, mobility, pain, development, hearing, ophthalmology,
            renal, dental, surgical, and patient-reported outcomes assessed longitudinally.
          decision_criterion: Replication of each manifestation in unrelated families and stable subtype-specific
            incidence estimates would distinguish core findings from family-specific observations and
            provide endpoints for future trials.
          supporting_outcome:
          - The recently reported systemic ANXD3 findings are reproducible subtype features
          - Defined imaging and functional measures can serve as natural-history and trial endpoints
          refuting_outcome:
          - The systemic findings remain confined to single families and are not reproducible ANXD3 associations
      selected_evidence:
        snippet: This study reports three new ANXD3 cases from a consanguineous Iranian family
        supports: SUPPORT
