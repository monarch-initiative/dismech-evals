  df7848d2a291afbd3542fa1316e8c6e42eb758eec39633d0a68acd74d281bb10:
    claim:
      about:
        disease:
          name: Anauxetic dysplasia
          disease_term:
            preferred_term: anauxetic dysplasia
            term:
              id: MONDO:0011773
              label: anauxetic dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: mRNA Cleavage-Dependent Spectrum Modulation
        biological_scale: MOLECULAR
        description: The second substrate arm is a modifier of position within the CHH-AD spectrum rather
          than an obligatory ANXD lesion. Reduced cleavage of RNase MRP messenger-RNA targets impairs
          cell-cycle regulation, and the degree of that impairment predicts hair hypoplasia, immunodeficiency
          and haematological abnormality rather than bone severity. Pure ANXD can therefore combine profound
          skeletal dysplasia with relative preservation of these extraskeletal systems. The concrete substrate
          is Cyclin B2 mRNA, cleaved at the end of mitosis.
