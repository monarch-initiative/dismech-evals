          supporting_outcome:
          - Reduced ribosome output is the effector and the disorder is a true ribosomopathy
          refuting_outcome:
          - A co-varying RNase MRP activity predicts skeletal severity equally well, so the ribosomopathy
            label is an artefact of assay choice
      selected_evidence:
        snippet: processing the mitochondrial RNA, and forming a complex with hTERT suggesting a possible
          involvement in expression regulation by siRNA synthesis
        supports: SUPPORT
