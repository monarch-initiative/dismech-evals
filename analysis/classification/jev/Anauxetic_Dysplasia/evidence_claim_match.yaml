  7ab2418bb36463ec1de13ace7f34bde31a8391a12a192b25431858e003b8cc9b:
    claim:
      about:
        disease:
          name: Anauxetic dysplasia
          disease_term:
            preferred_term: anauxetic dysplasia
            term:
              id: MONDO:0011773
              label: anauxetic dysplasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_anauxetic_chondrocyte_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a defect in a ubiquitously required ribosome assembly step strike the growth
          plate so much harder than other proliferating tissues?
        attaches_to:
        - pathophysiology#Growth Plate Chondrocyte Differentiation Failure
        - pathophysiology#Extreme Disproportionate Short-Limb Short Stature
        rationale: 'This is the general paradox of the ribosomopathies, and anauxetic dysplasia is an
          unusually clean instance of it because the same enzyme lesion produces a graded skeletal phenotype
          across the spectrum. Whether growth plate chondrocytes are simply the most ribosome-hungry cells
          in the developing body, or whether there is a chondrocyte-specific client transcript whose translation
          fails first, is not established, and the answer determines whether any tissue-directed intervention
          is conceivable. The question is posed explicitly in the chondrocyte literature, and the observation
          that RNase MRP expression is itself regulated across chondrogenic differentiation raises a third
          possibility: that the growth plate is not merely the most demanding tissue but one that actively
          modulates this complex.'
        proposed_experiments:
        - experiment_id: exp_anauxetic_chondrocyte_translatome
          name: Comparative translatome profiling across tissues in an RMRP hypomorphic model
          description: Profile ribosome occupancy and nascent translation in growth plate chondrocytes
            alongside lymphoid progenitors, erythroid progenitors and hair follicle keratinocytes in a
            graded RMRP hypomorphic background, to test whether chondrocytes show disproportionate loss
            of translational output or selective loss of specific transcripts.
          decision_criterion: Disproportionate global translational collapse in chondrocytes supports
            a demand model; selective transcript loss supports a client-specific model.
          supporting_outcome:
          - Growth plate chondrocytes have the highest ribosome demand and fail first on a purely quantitative
            basis
          refuting_outcome:
          - Specific chondrocyte transcripts are selectively lost, implicating a targeted client rather
            than global demand
      selected_evidence:
        snippet: However, it is not clear why mutations in RMRP RNA lead to skeletal dysplasia.
        supports: SUPPORT
