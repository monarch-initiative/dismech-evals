              id: MONDO:0008222
              label: Andersen-Tawil syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Beta-Blocker Therapy
        description: Beta-adrenergic blockade is widely used in inherited arrhythmia syndromes and is
          frequently prescribed in ATS on the rationale that suppressing adrenergic drive limits triggered
          activity. In the largest ATS1 outcome cohort, however, beta-blockers alone did not reduce the
          rate of life-threatening arrhythmic events relative to no therapy, nor did they in combination
          with class Ic antiarrhythmic drugs. Beta-blockade is therefore recorded here as a commonly used
          but unproven strategy in ATS rather than as an established disease-modifying therapy, and it
          is the comparator arm under formal test in the ongoing N-of-1 trial series NCT06205550.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: beta-adrenergic antagonist
            term:
              id: NCIT:C29576
              label: Beta-Adrenergic Antagonist
      selected_evidence:
        snippet: was not reduced by beta-blockers alone (1.37 per 100 py; p = 1.00), or in combination
          with Class Ic antiarrhythmic drugs (1.46 per 100 py, p = 1.00).
        supports: REFUTE
    origin:
      assertion_path: /treatments/3
