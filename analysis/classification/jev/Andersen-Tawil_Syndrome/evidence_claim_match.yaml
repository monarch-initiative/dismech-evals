      assertion_type: Treatment
      assertion:
        name: Avoidance of QT-Prolonging and Potassium-Wasting Agents
        description: 'ATS carries specific drug-safety warnings. Medications known to prolong the QT interval
          should be avoided; salbutamol inhalers may exacerbate cardiac arrhythmias; and thiazide and
          other potassium-wasting diuretics may provoke drug-induced hypokalaemia, precipitating paralytic
          attacks and aggravating QT prolongation. Amiodarone deserves separate emphasis: in the largest
          ATS1 outcome cohort its administration carried by far the strongest association with life-threatening
          arrhythmic events, and the authors conclude it is proarrhythmic and should be avoided. Because
          cardiac and skeletal muscle respond differently, a drug that helps one tissue may harm the other,
          which is the central management difficulty of the disorder.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: avoidance of contraindicated medications
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: 'Agents/circumstances to avoid: Medications known to prolong QT intervals; salbutamol
          inhalers (may exacerbate cardiac arrhythmias); thiazide and other potassium-wasting diuretics
          (may provoke drug-induced hypokalemia and could aggravate the QT interval prolongation).'
