      assertion_type: Diagnosis
      assertion:
        name: Clinical and electrocardiographic diagnostic criteria
        description: ATS is diagnosed by recognizing the characteristic triad of periodic paralysis, ventricular
          arrhythmia with repolarization abnormality, and dysmorphic features, combined with the electrocardiographic
          signature. The diagnosis can be established on clinical and EKG grounds alone, so a negative
          molecular result does not exclude it. Because only about 60% of affected individuals express
          all three components, incomplete presentations still qualify when the electrocardiographic phenotype
          is characteristic.
        results: Characteristic clinical and EKG findings, with or without an identified KCNJ2 pathogenic
          variant, establish the diagnosis of ATS.
        diagnosis_term:
          preferred_term: clinical evaluation for the ATS triad
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: The diagnosis of ATS is established in an individual with characteristic clinical and
          EKG findings and/or identification of a pathogenic variant in KCNJ2.
        supports: SUPPORT
