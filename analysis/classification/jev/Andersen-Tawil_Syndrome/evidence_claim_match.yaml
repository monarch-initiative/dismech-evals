        name: Long QT syndrome
        description: ATS has historically been labelled LQT7, but the repolarization abnormality is QU
          rather than QT prolongation and the arrhythmia profile differs. Frequent resting premature ventricular
          contractions and asymptomatic ventricular tachycardia are characteristic of ATS and uncommon
          in long QT syndrome, whose torsade de pointes is faster and more often symptomatic.
        disease_term:
          preferred_term: long QT syndrome
          term:
            id: MONDO:0002442
            label: long QT syndrome
        distinguishing_features:
        - ATS prolongs QU/QUc with a normal or only minimally prolonged QT/QTc
        - Frequent resting premature ventricular contractions and asymptomatic ventricular tachycardia
          are typical of ATS but uncommon in LQTS
        - Periodic paralysis and the dysmorphic triad are absent in isolated LQTS
      selected_evidence:
        snippet: PVCs at rest are quite frequent in ATS1 patients, however, in LQTS patients, PVCs and
          asymptomatic VT are uncommon which also contributes to differentiating them.
        supports: SUPPORT
