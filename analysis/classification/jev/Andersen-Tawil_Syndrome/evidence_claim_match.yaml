        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Paradoxical Sarcolemmal Depolarization and Inexcitability
        description: 'Normally, a fall or rise in extracellular potassium is buffered by the strong inward
          rectifier, which holds resting potential near the potassium equilibrium potential. With Kir2.1
          lost, that buffering fails and the fiber depolarizes paradoxically during potassium shifts.
          Sustained depolarization inactivates the voltage-gated sodium channels and the fiber becomes
          electrically inexcitable despite being structurally intact, producing flaccid weakness that
          resolves as the potassium disturbance corrects. This is why attacks in ATS may be hypokalaemic,
          hyperkalaemic, or normokalaemic: the defect is the loss of buffering, not a fixed direction
          of potassium sensitivity.'
        role: effector
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: skeletal muscle contraction
          term:
            id: GO:0003009
            label: skeletal muscle contraction
          modifier: DECREASED
      selected_evidence:
        snippet: The skeletal muscle and cardiac symptoms are accounted for, in most cases, by a dominant
          negative effect of the mutations on potassium channel current, resulting in prolonged depolarization
          of the action potential.
        supports: SUPPORT
