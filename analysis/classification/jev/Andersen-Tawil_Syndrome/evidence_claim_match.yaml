        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Delayed Terminal Repolarization and Triggered Activity
        description: With IK1 reduced, the late phase-3 repolarizing brake is weakened and the resting
          potential is less firmly clamped, so residual depolarizing drive (including sodium-calcium exchanger
          current responding to cytosolic calcium) more readily reaches threshold. The result is delayed
          afterdepolarizations and triggered beats arising at rest, which is why ATS produces heavy resting
          ventricular ectopy rather than the exercise-restricted arrhythmia of catecholaminergic polymorphic
          ventricular tachycardia. This is the ATS-specific instance of the arrhythmogenic substrate node
          of the cardiac channelopathy module, and it is the pharmacological target of the variant-specific
          flecainide debate.
        role: amplifier
        conforms_to: cardiac_ion_channel_repolarization#Arrhythmogenic Substrate and Triggered Activity
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: cardiac muscle cell action potential
          term:
            id: GO:0086001
            label: cardiac muscle cell action potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: The presence of frequent PVCs at rest are helpful in distinguishing ATS from typical
          catecholaminergic polymorphic ventricular tachycardia (CPVT). In typical CPVT, rapid PMVT and
          BiVT usually manifest during or after exercising.
        supports: SUPPORT
    origin:
