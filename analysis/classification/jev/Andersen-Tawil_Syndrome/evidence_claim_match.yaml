  735f0294d48347854baccc6282a2ed73012b1dc804f68505b0818500f6141268:
    claim:
      about:
        disease:
          name: Andersen-Tawil Syndrome
          disease_term:
            preferred_term: Andersen-Tawil syndrome
            term:
              id: MONDO:0008222
              label: Andersen-Tawil syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Bioelectric Craniofacial Patterning
        description: 'The third arm of the divergence, and the least understood. Beyond its role in excitable
          tissue, Kir2.1-dependent potassium flux establishes a regionalized pattern of resting membrane
          potential across the anterior ectoderm during early neurulation. This voltage pattern acts as
          a morphogenetic instruction: in Xenopus, misexpressing human ATS-associated KCNJ2 variants disrupts
          the voltage map, derails ten craniofacial patterning genes including cranial neural crest and
          placode markers, and produces craniofacial anomalies in the same structures affected in humans.
          Critically, the effect is voltage-specific rather than channel-specific: unrelated ion translocators
          that change membrane voltage reproduce the anomalies, whereas electroneutral or inactive channels
          do not. The resulting malformations are developmental and fixed, unlike the episodic cardiac
          and muscular manifestations.'
        role: effector
        cell_types:
        - preferred_term: migratory cranial neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        biological_processes:
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: DYSREGULATED
        - preferred_term: embryonic cranial skeleton morphogenesis
          term:
            id: GO:0048701
            label: embryonic cranial skeleton morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Misexpression in Xenopus of KCNJ2 carrying ATS-associated mutations causes CFAs in the
          same structures affected in humans, changes the normal pattern of membrane voltage potential
          regionalization in the developing face and disrupts expression of important craniofacial patterning
          genes, revealing the endogenous control of craniofacial patterning by bioelectric cell states.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26864374
      reference_title: 'Bioelectric signalling via potassium channels: a mechanism for craniofacial dysmorphogenesis
        in KCNJ2-associated Andersen-Tawil Syndrome.'
      evidence_source: MODEL_ORGANISM
      explanation: 'Provides the mechanistic model for the developmental arm: human ATS KCNJ2 variants
        disrupt the ectodermal voltage map and craniofacial patterning gene expression in Xenopus.'
