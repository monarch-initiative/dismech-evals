              id: MONDO:0008222
              label: Andersen-Tawil syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Cardiac Inward Rectifier Current
        description: 'Loss of Kir2.1 lowers the cardiac inward-rectifier current IK1. IK1 has two jobs
          in the ventricular myocyte: it clamps the phase-4 resting membrane potential near the potassium
          equilibrium potential, and its strong inward rectification means it supplies most of the repolarizing
          current in the terminal (phase 3) portion of the action potential while contributing almost
          nothing during the plateau. Reducing it therefore destabilizes the resting potential and prolongs
          terminal repolarization, which is registered on the surface electrocardiogram as a prolonged
          QU interval with prominent U waves rather than as marked QTc prolongation.'
        role: central_effector
        conforms_to: cardiac_ion_channel_repolarization#Altered Action Potential and Calcium Handling
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        - preferred_term: cardiac Purkinje fibre cell
          term:
            id: CL:0002068
            label: Purkinje myocyte
        biological_processes:
        - preferred_term: membrane repolarization during cardiac muscle cell action potential
          term:
            id: GO:0086013
            label: membrane repolarization during cardiac muscle cell action potential
          modifier: DECREASED
        - preferred_term: regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: DYSREGULATED
      selected_evidence:
        snippet: The spontaneous pulsation rate of myocardial cells in the mutation group was significantly
          lower than that in the repair CRISPR group, the action potential duration was prolonged, and
          the Kir2.1 current of the inward rectifier potassium ion channel was decreased, which is consistent
          with the clinical symptoms of ATS patients.
        supports: SUPPORT
