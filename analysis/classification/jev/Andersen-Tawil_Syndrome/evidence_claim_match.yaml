      assertion_type: Genetic
      assertion:
        name: KCNJ2
        notes: KCNJ2 encodes the alpha subunit of the strong inward-rectifier potassium channel Kir2.1,
          which assembles as a homotetramer. Pathogenic variants are predominantly heterozygous missense
          changes distributed across the channel, with in-frame deletions also reported. Loss of function
          arises through impaired plasma-membrane trafficking, reduced conductance or altered gating,
          and weakened coupling to phosphatidylinositol 4,5-bisphosphate (PIP2). Because mutant and wild-type
          subunits coassemble into the same tetramer, many variants exert a dominant-negative effect that
          suppresses current well below the 50% expected from simple haploinsufficiency. KCNJ2 variants
          account for roughly 50-60% of clinically diagnosed ATS (ATS type 1).
        gene_term:
          preferred_term: KCNJ2
          term:
            id: hgnc:6263
            label: KCNJ2
        relationship_type: CAUSATIVE
        case_fractions:
        - population: Clinically diagnosed ATS
          case_fraction_low: 50.0
          case_fraction_high: 60.0
          notes: KCNJ2 (ATS type 1) accounts for approximately 50-60% of clinically diagnosed ATS.
      selected_evidence:
        snippet: Mechanisms of disruption of channel function include abnormal trafficking and assembly
          of second messengers such as phosphatidylinositol 4,5-bisphosphate, abnormal gating of the channel,
          and incorrect folding of the Kir2.1 protein.
        supports: SUPPORT
