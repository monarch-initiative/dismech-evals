      reference: PMID:11371347
      reference_title: Mutations in Kir2.1 cause the developmental and episodic electrical phenotypes
        of Andersen's syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The founding paper explicitly frames the divergence: one channel with an excitability
