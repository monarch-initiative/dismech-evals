      assertion_type: ChannelopathyAssignment
      assertion:
        classification_value: cardiac channelopathy
        notes: 'ATS is a mixed cardiac and skeletal-muscle inward-rectifier channelopathy: the same Kir2.1
          loss of function reduces IK1 in both tissues. ChannelopathyOrganSystemEnum is single-valued
          in the schema, so only the cardiac assignment can be recorded here; the skeletal-muscle channelopathy
          arm is modeled explicitly in the pathophysiology nodes "Reduced Skeletal Muscle Inward Rectifier
          Current" and "Paradoxical Sarcolemmal Depolarization and Inexcitability". The cardiac value
          is chosen because it is the arm that carries the mortality risk and the reason this entry joins
          the Inherited_Arrhythmia_Syndromes grouping.'
      selected_evidence:
        snippet: Andersen-Tawil syndrome (ATS) is a potassium channelopathy affecting cardiac and skeletal
          muscle.
        supports: SUPPORT
