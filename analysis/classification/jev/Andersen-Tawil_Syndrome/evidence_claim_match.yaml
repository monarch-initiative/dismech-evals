      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: single_channel_three_tissue_divergence
        hypothesis_label: Single-Channel Three-Tissue Divergence Model
        status: CANONICAL
        description: 'One Kir2.1 loss-of-function lesion produces three clinically unrelated manifestations
          because the same channel serves three distinct roles in three tissues: terminal repolarization
          and resting potential in cardiomyocytes and Purkinje fibers (yielding ventricular ectopy and
          bidirectional ventricular tachycardia); resting potential and excitability in skeletal myofibers
          (yielding potassium-sensitive periodic paralysis); and bioelectric patterning of the anterior
          ectoderm during neurulation (yielding craniofacial and skeletal dysmorphism). The cardiac and
          skeletal-muscle arms are excitability phenomena; the developmental arm is a non-excitable, voltage-mediated
          morphogenetic phenomenon.'
      selected_evidence:
        snippet: These findings suggest that Kir2.1 plays an important role in developmental signaling
          in addition to its previously recognized function in controlling cell excitability in skeletal
          muscle and heart.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
