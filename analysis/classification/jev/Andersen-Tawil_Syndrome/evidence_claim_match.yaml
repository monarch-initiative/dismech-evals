      selected_evidence:
        snippet: Cardiac manifestations of ATS include frequent premature ventricular contractions (PVC),
          Q-U interval prolongation, prominent U-waves, and a special type of polymorphic ventricular
          tachycardia (PMVT) called bidirectional ventricular tachycardia (BiVT).
