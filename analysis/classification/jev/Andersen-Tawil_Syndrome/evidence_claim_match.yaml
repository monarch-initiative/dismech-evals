      assertion_type: Treatment
      assertion:
        name: Flecainide
        description: 'Flecainide is used empirically for significant, frequent ventricular arrhythmia
          in ATS and has suppressed bidirectional ventricular tachycardia where beta-blockade failed.
          Its safety is now under active reassessment: a 2024 preprint reviewing 53 ATS1 patients found
          genuine arrhythmia reduction in only 23%, non-fatal cardiac arrest in 13.5%, and variant-dependent
          proarrhythmia in mouse and patient-derived iPSC models, concluding that class-Ic drugs may be
          proarrhythmic in some ATS1 patients. Separately, GeneReviews cautions that class I antiarrhythmics
          may paradoxically worsen the neuromuscular symptoms, so flecainide is a drug whose benefit must
          be weighed against two distinct hazards.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: flecainide therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
