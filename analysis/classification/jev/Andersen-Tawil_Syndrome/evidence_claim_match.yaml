        description: Twelve-lead electrocardiography is the core cardiac diagnostic test in suspected
          ATS. The type-1 ATS electrocardiographic phenotype comprises frequent premature ventricular
          contractions, Q-U interval prolongation, prominent U waves, and bidirectional ventricular tachycardia,
          with QT/QTc typically normal or only minimally prolonged. Dedicated electrocardiographic criteria
          for type-1 ATS have been proposed on this basis.
        results: Frequent resting premature ventricular contractions, QU/QUc prolongation, prominent U
          waves, and bidirectional ventricular tachycardia with a normal or minimally prolonged QT support
          type-1 ATS.
