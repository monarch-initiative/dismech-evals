      assertion:
        name: Oral Potassium Repletion for Hypokalaemic Attacks
        description: For a paralytic attack occurring with documented hypokalaemia, oral potassium is
          given until the serum concentration normalizes. Potassium must be measured before repletion
          and cardiac monitoring obtained where possible, because ATS attacks may also be normokalaemic
          or hyperkalaemic and blanket supplementation would then be unsafe. If serum potassium is high,
          ingesting carbohydrates instead lowers it.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: oral potassium repletion
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: potassium chloride
            term:
              id: CHEBI:32588
              label: potassium chloride
