            term:
              id: CHEBI:75984
              label: flecainide
      selected_evidence:
        snippet: Empiric treatment with flecainide should be considered for significant, frequent ventricular
          arrhythmias in the setting of reduced left ventricular function.
        supports: SUPPORT
