        snippet: 'For episodic weakness: if serum potassium concentration is low (<3.0 mmol/L), administration
          of oral potassium (20-30 mEq/L) every 15-30 minutes (not to exceed 200 mEq in a 12-hour period)
          until the serum concentration normalizes'
        supports: SUPPORT
