        - path: /pathophysiology/1
          value:
            name: Failure of Cranial Neuropore Closure
            biological_scale: TISSUE
            description: Primary neurulation requires the flat neural plate to bend, elevate its neural
              folds, and fuse dorsally to form the closed neural tube, a process that proceeds by multiple
              closure initiation sites and zips both rostrally and caudally. Anencephaly arises specifically
              from failure of closure of the rostral (anterior/cranial) neuropore, which normally seals
              by approximately embryonic day 24-26. When the cranial neural folds fail to appose and fuse,
              the forebrain neuroepithelium remains open and the future cranial vault does not form over
              it.
            genes:
            - preferred_term: PAX3
              term:
                id: hgnc:8617
                label: PAX3
            - preferred_term: PDGFRA
              term:
