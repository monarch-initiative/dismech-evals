      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Folate One-Carbon Metabolism
        biological_scale: MOLECULAR
        description: Periconceptional folate status is the strongest modifiable determinant of successful
          neural tube closure. Folate one-carbon metabolism supplies the methyl groups and nucleotide
          precursors required by the rapidly proliferating cranial neuroepithelium; reduced 5,10-methylenetetrahydrofolate
          reductase (MTHFR) activity and inadequate folate availability compromise this supply and increase
          the risk that the cranial neuropore fails to close.
        genes:
        - preferred_term: MTHFR
          term:
            id: hgnc:7436
            label: MTHFR
        biological_processes:
        - preferred_term: tetrahydrofolate interconversion
          term:
            id: GO:0035999
            label: tetrahydrofolate interconversion
          modifier: DECREASED
      selected_evidence:
        snippet: a significant correlation between MTHFR C677T polymorphism and NTD risk was found in
          NTD patients and in their mother
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
