      assertion_type: Pathophysiology
      assertion:
        name: Convergent Extension and Neural Plate Morphogenesis Defect
        biological_scale: CELLULAR
        description: Convergent extension movements, governed by the non-canonical Wnt/planar cell polarity
          (PCP) pathway, narrow and lengthen the neural plate and are required to bring the neural folds
          close enough to fuse. Disruption of PCP signaling (e.g. VANGL1/VANGL2, CELSR1, SCRIB) broadens
          the neural plate and prevents fold apposition, producing severe open neural tube defects including
          anencephaly and craniorachischisis in model organisms and humans.
        genes:
        - preferred_term: VANGL1
          term:
            id: hgnc:15512
            label: VANGL1
        - preferred_term: VANGL2
          term:
            id: hgnc:15511
            label: VANGL2
        biological_processes:
        - preferred_term: convergent extension in neural plate elongation
          term:
            id: GO:0022007
            label: convergent extension involved in neural plate elongation
          modifier: DECREASED
      selected_evidence:
        snippet: 'convergent extension cell movements are dependent on non-canonical Wnt signalling: the
          planar cell polarity (PCP) pathway'
        supports: SUPPORT
