          were computed. ... The CRL/OFD is a reliable indicator for predicting the acrania-exencephaly-anencephaly
          sequence. When combined with cranial ultrasound morphological changes, it can accurately diagnose
          the acrania-exencephaly-anencephaly sequence before 11 weeks of gestation. However, diagnosis
          at this stage still requires reconfirmation after 11 weeks
