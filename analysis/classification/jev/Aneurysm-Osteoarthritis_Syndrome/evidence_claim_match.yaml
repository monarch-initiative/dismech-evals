  4ffcd388180356f19d57a606e60545dd372f728ed03891d60f2bbebe884443f4:
    claim:
      about:
        disease:
          name: Aneurysm-Osteoarthritis Syndrome
          disease_term:
            preferred_term: aneurysm-osteoarthritis syndrome
            term:
              id: MONDO:0013426
              label: aneurysm-osteoarthritis syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SMAD3
        gene_term:
          preferred_term: SMAD3
          term:
            id: hgnc:6769
            label: SMAD3
        association: Causative
        relationship_type: CAUSATIVE
        notes: Heterozygous pathogenic variants in SMAD3, encoding the receptor-regulated SMAD3 of the
          TGF-beta pathway, cause aneurysm-osteoarthritis syndrome (Loeys-Dietz syndrome type 3). Inheritance
          is autosomal dominant. The variant spectrum includes haploinsufficiency alleles and missense
          substitutions in the MH2 domain (as well as MH1-domain variants and in-frame deletions); MH2
          missense variants are associated with earlier aortic events. Penetrance for aortic disease is
          reduced and age of onset is variable.
      selected_evidence:
        snippet: Individuals with dominant negative (DN) SMAD3 variant in the MH2 domain exhibited more
          major events (66.7% vs. 44.0%, P = 0.054), occurring at a younger age compared to those with
          haploinsufficient (HI) variants.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/3
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
