        description: Primary fibroblasts and vascular smooth muscle cells from individuals with pathogenic/likely
          pathogenic SMAD3 variants were compared across dominant-negative MH2 and haploinsufficient variant
          classes. The system resolves variant-class effects on differentiation, smooth-muscle markers,
          MYH11 isoforms, and extracellular-matrix formation. It is limited by small numbers of patient
          lines, in-vitro differentiation, and the borderline clinical genotype-event comparisons; it
          does not reproduce arterial biomechanics, immune recruitment, or longitudinal aneurysm formation.
        experimental_model_type: PRIMARY_CELL_CULTURE
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        cell_types:
        - preferred_term: vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        cell_source: Primary patient-derived dermal fibroblasts and vascular smooth muscle cells
        culture_system: Monolayer culture with fibroblast-to-myofibroblast differentiation
        conditions:
        - dominant-negative SMAD3 MH2-domain variants
        - haploinsufficient SMAD3 variants
        - control cell lines
        publication: DOI:10.1093/hmg/ddae044
        modeled_mechanisms:
        - target: SMAD3 Loss-of-Function
          description: Compares functional consequences of dominant-negative and haploinsufficient pathogenic
            SMAD3 variants.
        - target: Aortic Medial Degeneration and Wall Weakening
          description: Measures vascular smooth-muscle differentiation and extracellular-matrix outputs
            relevant to aortic wall homeostasis.
        findings:
        - statement: Dominant-negative and haploinsufficient SMAD3 variants produced distinct differentiation,
            smooth-muscle-marker, MYH11-isoform, and matrix phenotypes.
          supporting_text: Fibroblasts carrying DN SMAD3 variants displayed reduced differentiation potential,
            contrasting with increased differentiation potential in HI SMAD3 variant fibroblasts.
      selected_evidence:
        snippet: A retrospective analysis on clinical data from individuals with a P/LP SMAD3 variant
          and functional analyses on SMAD3 patient-derived VSMCs and SMAD3 patient-derived fibroblasts,
          differentiated into myofibroblasts.
        supports: SUPPORT
