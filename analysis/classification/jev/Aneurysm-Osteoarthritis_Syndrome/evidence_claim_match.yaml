      assertion_type: DifferentialDiagnosis
      assertion:
        name: Marfan syndrome
        description: Marfan syndrome overlaps in aortic-root aneurysm, skeletal findings, and autosomal
          dominant inheritance.
        distinguishing_features:
        - FBN1-associated ectopia lentis favors Marfan syndrome.
        - The absence of characteristic early-onset osteoarthritis and osteochondritis dissecans favors
          Marfan syndrome.
        - AOS/LDS can dissect at smaller diameters and has more diffuse arterial involvement; SMAD3 molecular
          testing distinguishes AOS.
        disease_term:
          preferred_term: Marfan syndrome
          term:
            id: MONDO:0007947
            label: Marfan syndrome
      selected_evidence:
        snippet: aortic dissection can occur at smaller aortic diameters and at younger ages than observed
          in Marfan syndrome; vascular disease is not limited to the aortic root
        supports: SUPPORT
