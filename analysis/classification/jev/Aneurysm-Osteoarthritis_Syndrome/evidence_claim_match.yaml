        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SMAD3 Loss-of-Function
        biological_scale: MOLECULAR
        description: Heterozygous pathogenic variants in SMAD3 disrupt the receptor-regulated SMAD that
          transduces TGF-beta signals from activated TGF-beta receptors to the nucleus. SMAD3 forms a
          complex with the co-SMAD SMAD4 and regulates transcription of TGF-beta target genes. Loss of
          normal SMAD3 function is the conserved genetic trigger for the syndrome.
        biological_processes:
        - preferred_term: SMAD protein signal transduction
          term:
            id: GO:0060395
            label: SMAD protein signal transduction
          modifier: ABNORMAL
        genes:
        - preferred_term: SMAD3
          term:
            id: hgnc:6769
            label: SMAD3
        genetic_context:
          gene:
            preferred_term: SMAD3
            term:
              id: hgnc:6769
              label: SMAD3
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous SMAD3 alleles (haploinsufficiency alleles and MH2-domain missense).
            Recorded as LOSS_OF_FUNCTION; the paradoxical increase in TGF-beta signalling in aortic tissue
            is a downstream consequence, not the variant's effect on SMAD3 itself.
      selected_evidence:
        snippet: the disease is caused by mutations in SMAD3. This gene encodes a member of the TGF-β
          pathway that is essential for TGF-β signal transmission
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21217753
      reference_title: Mutations in SMAD3 cause a syndromic form of aortic aneurysms and dissections with
        early-onset osteoarthritis.
      evidence_source: HUMAN_CLINICAL
      explanation: van de Laar et al. identified SMAD3 as the causal gene, encoding an essential mediator
