            label: vascular associated smooth muscle cell
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: DECREASED
      selected_evidence:
        snippet: However, early pathology was evident, with SMCs separated from elastic lamellae by a
          thin layer of glycosaminoglycans. Confocal reconstructions revealed that elastic fibers were
          poorly decorated by microfibrils, with reduced fibrillin-1, fibrillin-2, microfibril associated
          glycoprotein-2, fibulin-1 and fibulin-2.
        supports: SUPPORT
