  185db869699098617e5ee883985dbf210156d63ed97da55a9605f652bf071c92:
    claim:
      about:
        disease:
          name: Aneurysm-Osteoarthritis Syndrome
          disease_term:
            preferred_term: aneurysm-osteoarthritis syndrome
            term:
              id: MONDO:0013426
              label: aneurysm-osteoarthritis syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: arb_tgfbeta_target_uncertainty
        kind: CONTROVERSY
        status: OPEN
        prompt: Does angiotensin receptor blockade benefit SMAD3-related aneurysm-osteoarthritis syndrome
          by inhibiting aortic TGF-beta signaling, or only by reducing hemodynamic wall stress - and is
          TGF-beta the right therapeutic target in AOS at all?
        attaches_to:
        - pathophysiology#TGF-beta Signaling Dysregulation
        rationale: 'The entry models an ARB -> "TGF-beta Signaling Dysregulation" INHIBITS edge, but that
          edge is not directly evidenced in AOS. The GeneReviews statement attached to the ARB treatment
          supports only reduction of hemodynamic stress, not TGF-beta inhibition. Two SMAD3 mouse studies
          point away from TGF-beta as the actionable target: PMID:27688095 concludes that immune suppression
          may be more beneficial than targeting TGF-beta signaling, and PMID:23782924 nominates macrophage
          depletion and iNOS antagonism instead. The paradoxical-TGF-beta-increase model is inherited
          from the aortopathy_tgfbeta_dysregulation module and from Marfan/losartan biology, so there
          is a real risk of importing a mechanism that has not been demonstrated for SMAD3 specifically.
          Resolving this matters clinically, since ARB therapy is a modeled treatment for this disease.'
        notes: Both refuting studies are MODEL_ORGANISM evidence, so they constrain the mechanistic claim
          rather than the clinical practice of using ARBs in AOS. Retained rather than deleting the target_mechanisms
          edge so the open question stays visible; a curator may prefer to retarget the edge to the hemodynamic-stress
          node instead.
      selected_evidence:
        snippet: instead of targeting TGF-β signaling, immune suppression may be more beneficial
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
