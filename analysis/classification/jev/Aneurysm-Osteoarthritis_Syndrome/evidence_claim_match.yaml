      assertion_type: HistopathologyFinding
      assertion:
        name: Aortic Medial Degeneration
        description: Histology of human AOS aortic wall fragments shows disorganization of the tunica
          media with characteristic mucoid medial degeneration and accumulation of collagen in the media.
          This is the human tissue-level counterpart of the "Aortic Medial Degeneration and Wall Weakening"
          pathophysiology node.
        notes: 'Two caveats. (1) Human-versus-model discordance: the medial collagen accumulation seen
          in human AOS aortas is NOT recapitulated in the Smad3-/- mouse, where PMID:27688095 reports
          no collagen accumulation. The human histology above is therefore the primary support for this
          finding, and the mouse data should not be read as confirming it. (2) No finding_term is bound
          because the precise HPO aortic-histopathology terms (HP:0032079 medial degeneration, HP:0200146
          mucoid extracellular matrix accumulation) are not admissible under the current HistopathologyFindingTerm
          dynamic enum, which is reachable only from NCIT branches plus HP:0025461; NCIT has no equivalent
          term.'
      selected_evidence:
        snippet: On histology of aortic wall fragments, evident disorganization of the tunica media with
          fragmentation and loss of elastic fibers was observed, as well as characteristic mucoid medial
          degeneration and accumulation of collagen in media.
        supports: SUPPORT
