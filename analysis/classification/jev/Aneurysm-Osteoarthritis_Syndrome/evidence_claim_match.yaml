        biological_scale: TISSUE
        description: Early human aortic pathology in SMAD3 variant carriers consists of smooth muscle
          cells separated from elastic lamellae by glycosaminoglycans and elastic fibers that are poorly
          decorated by multiple microfibril proteins, even while lamellar structure and SMC content remain
          relatively intact.
        cell_types:
        - preferred_term: vascular smooth muscle cell
