      reference_title: Functional analysis of cell lines derived from SMAD3-related Loeys-Dietz syndrome
        patients provides insights into genotype-phenotype relation
      evidence_source: IN_VITRO
      explanation: The expanded cohort and patient-cell study supports a possible dominant-negative-versus-haploinsufficient
