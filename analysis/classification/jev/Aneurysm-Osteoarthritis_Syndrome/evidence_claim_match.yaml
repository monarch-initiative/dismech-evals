      assertion_type: Treatment
      assertion:
        name: Angiotensin Receptor Blocker Therapy
        description: Angiotensin receptor blockers (e.g., losartan) are used to reduce hemodynamic stress
          and are hypothesized to attenuate dysregulated TGF-beta signaling in the aortic wall.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: losartan
            term:
              id: CHEBI:6541
              label: losartan
        notes: Pregnancy contraindication. Angiotensin receptor blockers act on the renin-angiotensin
          system and are contraindicated in pregnancy because of fetal renal and developmental toxicity,
          so ARB therapy has to be reviewed and withdrawn before or at conception. This matters particularly
          in aneurysm-osteoarthritis syndrome, where the peripartum period itself carries a high risk
          of aortic dissection/rupture and uterine rupture and warrants intensified imaging instead (see
          the "Pregnancy and Peripartum Aortic Surveillance" treatment). Recorded as a note rather than
          as an evidence item because none of the cached references for this entry states the ARB pregnancy
          contraindication in quotable form.
      selected_evidence:
        snippet: angiotensin receptor blockers, beta-adrenergic receptor blockers, or other medications
          are used to reduce hemodynamic stress
        supports: SUPPORT
