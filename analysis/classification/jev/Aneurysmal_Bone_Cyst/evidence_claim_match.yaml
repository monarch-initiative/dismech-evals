      assertion_type: Diagnosis
      assertion:
        name: USP6 break-apart fluorescence in situ hybridization
        presence: PRESENT
        description: 'A break-apart FISH probe for USP6 separates primary aneurysmal bone cyst from the
          secondary form, giant cell tumour of bone and telangiectatic osteosarcoma, which are morphologically
          similar. Read the operating characteristics carefully: in the validation study specificity and
          positive predictive value were both 100%, but sensitivity was only 53% and negative predictive
          value 69%. A positive result settles the diagnosis; a negative result does not exclude it. Note
          also that this 53% falls short of the 70 to 75% rearrangement rate the same paper cites from
          the literature, so some of the shortfall is assay performance rather than true absence of the
          rearrangement.'
      selected_evidence:
        snippet: The test sensitivity and specificity in primary ABC were 53% (9/17) and 100% (18/18),
          respectively. The positive predictive value and negative predictive value were 100% (9/9) and
          69% (18/26), respectively.
        supports: SUPPORT
