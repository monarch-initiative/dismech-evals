        - path: /has_subtypes/0
          value:
            name: Primary
            display_name: Primary (USP6-rearranged)
            description: The true neoplasm. Carries a USP6 rearrangement, which is what the pathograph
              in this entry describes.
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: USP6 Promoter-Swap Rearrangement
        biological_scale: MOLECULAR
        subtypes:
        - Primary
        description: The initiating lesion, and an unusual one. The recurrent t(16;17)(q22;p13) juxtaposes
          the CDH11 promoter region to the entire USP6 coding sequence, so the protein made is ordinary
          USP6 and only its transcription is deregulated. That distinguishes this from the fusion-protein
          oncogenes it superficially resembles. At least thirteen partner promoters are now known, all
          of them strongly expressed in bone or connective tissue, which is consistent with the promoter
          being the operative element rather than the partner gene.
        genes:
        - preferred_term: USP6
          term:
            id: hgnc:12629
            label: USP6
        - preferred_term: CDH11
          term:
            id: hgnc:1750
            label: CDH11
      selected_evidence:
        snippet: Herein we show that a recurring ABC chromosomal translocation t(16;17)(q22;p13) creates
          a fusion gene in which the osteoblast cadherin 11 gene (CDH11) promoter region on 16q22 is juxtaposed
          to the entire ubiquitin-specific protease USP6 (Tre2) coding sequence on 17p13.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
