        context: []
      assertion_type: Pathophysiology
      assertion:
        name: USP6 Overexpression with Intact Deubiquitinase Activity
        biological_scale: MOLECULAR
        description: 'Overexpressed USP6 is sufficient on its own to initiate tumour formation. The domain
          mapping is informative: the deubiquitinase activity is required, while the TBC domain that binds
          the Arf6 GTPase is not. That narrows the mechanism to the protease function rather than to vesicular
          trafficking, which had been the other candidate.'
        biological_processes:
        - preferred_term: protein deubiquitination
          modifier: INCREASED
          term:
            id: GO:0016579
            label: protein deubiquitination
      selected_evidence:
        snippet: In this study we show that TRE17 is sufficient to induce expression of MMP-9 and MMP-10,
          in a manner requiring its USP activity, but not its ability to bind Arf6.
        supports: SUPPORT
