        disease_term:
          preferred_term: Houge-Janssens syndrome
          term:
            id: MONDO:0957553
            label: Houge-Janssens syndrome
        description: Houge-Janssens syndrome can overlap clinically with Angelman syndrome through early
          neurodevelopmental delay, severe language involvement, seizure risk, and behavioral phenotypes.
        distinguishing_features:
        - Houge-Janssens syndrome is PP2A-subunit related (PPP2R5D, PPP2R1A, PPP2CA, PPP2R5C) rather than
          UBE3A-imprinting related.
        - Angelman syndrome is diagnosed through 15q11.2-q13 methylation/UBE3A testing, whereas Houge-Janssens
          diagnosis relies on PP2A-gene variant identification.
      selected_evidence:
        snippet: The core features are neurodevelopmental delay, especially concerning language, prolonged
          hypotonia, high risk of seizures, and behavior problems.
        supports: SUPPORT
