      assertion:
        name: Amplified and temporally altered cortical hemodynamic responses during visual stimulation
          on fNIRS
        modality: OTHER
        diagnostic: false
        located_in:
          preferred_term: visual cortex
          term:
            id: UBERON:0000411
            label: visual cortex
        modifier: INCREASED
        notes: 'Evidence tier: every item on this finding cites one preprint (PPR:PPR1289264), which is
          not peer-reviewed, so the finding is recorded as a candidate biomarker rather than an established
          one. The amplitude and timing components come from the same human cohort and are not independently
          replicated. `modifier: INCREASED` describes the amplitude component only, since the altered
          response timing has no direction on that axis.'
        context: Functional neuroimaging biomarker (functional near-infrared spectroscopy / fNIRS) for
          disease severity and treatment response monitoring; not an established diagnostic criterion
          but demonstrates translational value as a cross-species biomarker of AS-specific cortical dysfunction.
        description: 'Functional near-infrared spectroscopy (fNIRS) during visual stimulation reveals
          amplified and temporally altered hemodynamic responses in individuals with AS compared to controls.
          In the human arm these alterations are consistently detected across preprocessing strategies
          and stable across age; sensitivity to therapeutic UBE3A restoration has been shown only in the
          mouse, not in the human cohort. The finding is conserved across species: AS mouse models exhibit
          enhanced visual cortical responses on intrinsic optical signal imaging that persist across development,
          scale with disease severity, and normalize with UBE3A restoration.'
      selected_evidence:
        snippet: Individuals with AS display amplified and temporally altered hemodynamic responses that
          are consistently detected across preprocessing strategies and remaine stable across age.
        supports: SUPPORT
    origin:
      assertion_path: /imaging_findings/1
