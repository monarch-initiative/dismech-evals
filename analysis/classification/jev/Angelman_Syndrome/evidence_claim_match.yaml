      assertion_type: Subtype
      assertion:
        name: Maternal 15q11.2-q13 deletion Angelman syndrome
        classification: molecular
        subtype_frequency: 70%
        description: Most common molecular subtype, caused by de novo deletion of the maternally inherited
          15q11.2-q13 region including UBE3A. The deletion frequently spans the GABRB3-GABRA5-GABRG3 GABA-A
          receptor subunit cluster and OCA2. The larger deletion is associated with more severe, earlier-onset
          epilepsy, while the independent GABA-A cluster contribution remains proposed; OCA2 haploinsufficiency
          mediates a distinct ocular hypopigmentation phenotype.
      selected_evidence:
        snippet: Approximately 70% of patients show a deletion involving the maternally inherited chromosome
          15q11-q13, encompassing a cluster of gamma-aminobutyric acid receptor subunit genes
        supports: SUPPORT
