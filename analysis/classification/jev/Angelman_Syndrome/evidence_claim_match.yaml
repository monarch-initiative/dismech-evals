      assertion_type: Definition
      assertion:
        name: Molecular diagnostic criteria framework
        definition_type: DIAGNOSTIC_CRITERIA
        description: Molecular diagnosis is primarily established by 15q11.2-q13 methylation testing with
          reflex UBE3A sequence analysis when methylation testing is negative.
        scope: Molecular confirmation strategy for suspected Angelman syndrome
      selected_evidence:
        snippet: Analysis of parent-specific DNA methylation imprints in the 15q11.2-q13 chromosome region
          detects approximately 80% of individuals with AS, including those with a deletion, uniparental
          disomy, or an imprinting defect; fewer than 1% of individuals have a cytogenetically visible
          chromosome rearrangement (e.g., translocation or inversion).
        supports: SUPPORT
