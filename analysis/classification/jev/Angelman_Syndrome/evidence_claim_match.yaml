      assertion_type: Discussion
      assertion:
        discussion_id: gap_angelman_human_model_fidelity
        prompt: Which phenotypes and therapeutic-response windows in maternal UBE3A-loss models faithfully
          predict human Angelman syndrome across development?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced neuronal UBE3A protein abundance
        - pathophysiology#Impaired experience-dependent synaptic remodeling
        rationale: Maternal Ube3a-null mice reproduce useful EEG, seizure, sleep, and synaptic phenotypes,
          but rodent models do not reproduce the entire human syndrome. The duration and developmental
          timing of mouse myelination delay cannot be extrapolated directly to people. The newer pig model
          broadens developmental coverage but remains preclinical and has not yet demonstrated predictive
          validity for treatment response.
      selected_evidence:
        snippet: Rodent models of Angelman syndrome do not fully recapitulate all the symptoms associated
          with the condition and are limited as a preclinical model for therapeutic development.
        supports: SUPPORT
    origin:
