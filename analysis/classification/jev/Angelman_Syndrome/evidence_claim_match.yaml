  3e644b9fbbb5b55c82cd6527505603f578e617240b5c45ecc2e882d18784c554:
    claim:
      about:
        disease:
          name: Angelman Syndrome
          disease_term:
            preferred_term: Angelman syndrome
            term:
              id: MONDO:0007113
              label: Angelman syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mouse (Mus musculus)
        genotype: Maternally inherited Ube3a exon-2 deletion (Ube3am-/p+)
        background: C57BL/6J
        category: Knockout
        genes:
        - preferred_term: UBE3A
          term:
            id: hgnc:12496
            label: UBE3A
        associated_phenotypes:
        - Reduced seizure threshold
        - Increased epileptiform spiking and EEG delta power
        - Abnormal sleep architecture and reduced sleep spindles
        description: A widely used maternal Ube3a-loss mouse model that reproduces several EEG, seizure,
          and sleep phenotypes. Model timing and magnitude of white-matter changes cannot be directly
          extrapolated to humans.
        modeled_mechanisms:
        - target: Cortical network hyperexcitability with abnormal EEG background
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Intrinsic optical signal imaging shows enhanced visually evoked cortical responses
            in the model that persist across development and partly track disease severity in adulthood,
            and that normalize when UBE3A expression is restored. The same amplification is detectable
            in individuals with AS by fNIRS, which is what makes this a cross-species readout of the node.
          limitations: The model reads out visually evoked hemodynamic amplitude in one cortical area,
            not the epileptiform spiking and abnormal EEG background this node is named for, so the link
            is an inference from one correlate of cortical excitability rather than a reproduction of
            the node. Severity tracking is described as partial and confined to adulthood, and the only
            source is a preprint.
          readouts:
          - name: Visually evoked intrinsic optical signal amplitude in visual cortex
            target: Cortical network hyperexcitability with abnormal EEG background
            direction: INCREASED
            interpretation: Enhanced visual cortical response amplitude in the model, the murine counterpart
              of the amplified human fNIRS response recorded under imaging_findings.
          - name: Visually evoked response after UBE3A restoration
            target: Cortical network hyperexcitability with abnormal EEG background
            direction: RESTORED
            interpretation: The amplified response is reversible on UBE3A reactivation, which is what
              makes it a candidate treatment-monitoring readout for the rugonersen UBE3A-ATS programme
              rather than a static disease marker.
      selected_evidence:
        snippet: 'RESULTS: Ube3a-del mice exhibited reduced seizure threshold compared to WT. EEG illustrated
          that Ube3a-del mice had increased epileptiform spiking activity and delta power, which corroborates
          findings from other laboratories and recapitulates clinical reports in AS.'
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
