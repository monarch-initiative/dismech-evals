              label: histiocytoma, Angiomatoid fibrous
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Constitutive CRE-Dependent Transcription
        description: The fusion protein acts as a constitutive activator of CRE-driven transcription that
          no longer requires cAMP induction, deregulating a lineage-dependent gene program. In mesenchymal
          precursors this drives neoplastic proliferation; because the IL6 promoter carries a CRE site,
          CREB1 fusions also drive IL-6 transcription.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: positive regulation of transcription by RNA polymerase II
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: expression of EWSR1-CREB1/ATF1 fusion in hES cells recapitulates the core gene signatures,
          respectively, of angiomatoid fibrous histiocytoma (AFH) and gastrointestinal clear cell sarcoma
          (GI-CCS), although both fusions lead to cell lethality.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
