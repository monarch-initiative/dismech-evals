  63a1237246d805de3dd09f4a151aa7386effec139e685256259a50108e7c3dc7:
    claim:
      about:
        disease:
          name: Angiomatoid Fibrous Histiocytoma
          disease_term:
            preferred_term: angiomatoid fibrous histiocytoma
            term:
              id: MONDO:0012809
              label: histiocytoma, Angiomatoid fibrous
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FET-CREB Family Gene Fusion
        description: The initiating lesion is a somatic chromosomal translocation that joins the 5' portion
          of EWSR1 (or, rarely, FUS) to the 3' portion of a CREB-family transcription factor gene. EWSR1::CREB1
          from t(2;22)(q33;q12) is the predominant fusion; EWSR1::ATF1 from t(12;22)(q13;q12), FUS::ATF1
          from t(12;16)(q13;p11), and EWSR1::CREM occur in smaller subsets. The cell in which the translocation
          arises has not been identified; the tumor is of uncertain differentiation, with a myoid (myofibroblastic)
          immunophenotype.
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: SOMATIC
          functional_impact_category: NEOMORPHIC
          genes:
          - preferred_term: EWSR1
            term:
              id: hgnc:3508
              label: EWSR1
          - preferred_term: CREB1
            term:
              id: hgnc:2345
              label: CREB1
          - preferred_term: ATF1
            term:
              id: hgnc:783
              label: ATF1
          - preferred_term: FUS
            term:
              id: hgnc:4010
              label: FUS
          - preferred_term: CREM
            term:
              id: hgnc:2352
              label: CREM
          description: Acquired in-frame fusion of a FET-family N-terminal domain to the bZIP DNA-binding
            domain of CREB1, ATF1, or CREM, producing a chimeric transcription factor.
        cell_types:
        - preferred_term: mesenchymal cell of uncertain differentiation
          term:
            id: CL:0008019
            label: mesenchymal cell
        molecular_functions:
        - preferred_term: aberrant DNA-binding transcription factor activity (chimeric FET-CREB protein)
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        notes: The cell type is bound only at the broad mesenchymal level because no specific cell of
          origin has been established. A myoid phenotype is supported by desmin and calponin expression,
          and the AFIP series raised a possible relationship to myoid cells of lymphoid tissue, but neither
          is a demonstrated origin.
      selected_evidence:
        snippet: By RT-PCR, eight out of nine tumors showed the presence of the EWSR1-CREB1 fusion, while
          one had an EWSR1-ATF1 transcript.
        supports: SUPPORT
    origin:
