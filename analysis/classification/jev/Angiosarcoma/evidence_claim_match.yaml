      assertion_type: HistopathologyFinding
      assertion:
        name: Anastomosing Vascular Channel Formation
        finding_term:
          preferred_term: Anastomosing vascular channel formation
          term:
            id: NCIT:C35973
            label: Irregular Vascular Channel Formation
        frequency: VERY_FREQUENT
        diagnostic: true
        description: Irregular, anastomosing vascular channels lined by atypical endothelial cells are
          the architectural hallmark of angiosarcoma. Tumors span a spectrum from purely vasoformative
          to mixed vasoformative-and-solid, with a minority showing a purely solid (poorly differentiated,
          often epithelioid) pattern that obscures the vascular nature and is a recognized diagnostic
          pitfall. Endothelial lineage of the neoplastic lining cells is confirmed immunohistochemically
          by near-universal CD31 and ERG positivity, with more variable CD34 that is frequently lost in
          tumors with lymphatic differentiation.
      selected_evidence:
        snippet: Histomorphological patterns observed were mixed vasoformative and solid ( n = 22), pure
          vasoformative ( n = 13), and pure solid ( n = 1).
        supports: SUPPORT
    origin:
      assertion_path: /histopathology/0
      evidence_path: /histopathology/0/evidence/0
