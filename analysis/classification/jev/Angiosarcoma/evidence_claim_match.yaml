      reference_title: 'Angiosarcoma of the head and neck: A clinicopathologic study with special emphasis
        on diagnostic pitfalls.'
      evidence_source: HUMAN_CLINICAL
      explanation: In a 36-case head and neck angiosarcoma series, 35/36 tumors showed vasoformative architecture
