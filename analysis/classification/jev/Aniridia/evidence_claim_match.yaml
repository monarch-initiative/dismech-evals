        name: Congenital Visual Impairment with Nystagmus
        description: 'Foveal hypoplasia deprives the developing visual system of a high-acuity fixation
          locus, so acuity is subnormal from birth and infantile nystagmus develops as a consequence of
          that sensory deficit rather than as an independent motor abnormality. The absent or deficient
          iris compounds disability by removing the aperture stop, producing the photophobia and glare
          that patients frequently rank above acuity loss as their dominant symptom. Because the sensory
          deficit is congenital and structural, acuity in aniridia does not improve with refractive correction.

          '
        role: consequence
