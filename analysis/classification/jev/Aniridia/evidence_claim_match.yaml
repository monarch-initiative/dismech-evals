          express PAX6 from the normal homolog but not the deletion homolog. Separately, deletion of the
          DRR from a human PAX6 reporter YAC in transgenic mice removes retinal expression while lens
          expression remains at embryonic day E10.5. Together these experiments support loss of regulatory
          input to intact PAX6. They do not establish uniform loss across all tissues in the patients,
          so no all-tissue expression-loss category is assigned to these deletions.
        genes:
        - preferred_term: PAX6
          term:
