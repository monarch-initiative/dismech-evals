      assertion_type: Pathophysiology
      assertion:
        name: Aniridia-Associated Keratopathy
        description: 'The clinical expression of limbal failure: conjunctival epithelium progressively
          invades the corneal surface, bringing vessels with it, and the cornea becomes vascularized,
          opaque and unstable. It begins peripherally and advances centrally over decades, so a patient
          whose acuity was limited by foveal hypoplasia in childhood may lose further vision to the cornea
          in adulthood. Keratopathy is the feature that most often prompts surgery, and the one whose
          surgery most often fails, because a transplanted cornea placed on a limbally deficient surface
          is re-invaded.

          '
        role: consequence
        biological_scale: TISSUE
        cell_types:
        - preferred_term: corneal epithelial cell
          term:
            id: CL:0000575
            label: corneal epithelial cell
        locations:
        - preferred_term: cornea
          term:
            id: UBERON:0000964
            label: cornea
      selected_evidence:
        snippet: Aniridia-associated keratopathy (AAK) is a progressive and potentially debilitating problem
          affecting aniridic patients.
        supports: SUPPORT
