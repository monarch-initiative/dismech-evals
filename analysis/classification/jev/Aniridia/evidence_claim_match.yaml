            subtype_term:
              preferred_term: WAGR syndrome
              term:
                id: MONDO:0008681
                label: WAGR syndrome
            description: 'Aniridia arising as part of a contiguous gene deletion at 11p13 that removes
              WT1 as well as PAX6, producing Wilms tumour predisposition, genitourinary anomalies and
              intellectual disability alongside the ocular phenotype. Because the aniridia is the visible
              sign and often the presenting one, every child with apparently isolated sporadic aniridia
              requires molecular definition of the deletion breakpoints before renal tumour surveillance
              can be safely omitted.

              '
          role: subtype
      assertion_type: Genetic
      assertion:
        name: WT1
        association: Heterozygous loss within a contiguous 11p13 deletion
        notes: 'Wilms tumour 1, immediately adjacent to PAX6 at 11p13. It is not a cause of aniridia;
          its loss in a contiguous deletion is what converts isolated aniridia into WAGR syndrome and
          creates the nephroblastoma risk.

          '
        subtype: WAGR
        gene_term:
          preferred_term: WT1
          term:
            id: hgnc:12796
            label: WT1
        relationship_type: CAUSATIVE
      selected_evidence:
        snippet: WAGR results from a contiguous gene deletion within the 11p13 region, encompassing the
          WT1 gene, often responsible for WT development, and the PAX6 gene, responsible for aniridia.
        supports: SUPPORT
