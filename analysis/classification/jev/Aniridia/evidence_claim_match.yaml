        display_name: Isolated (non-syndromic) aniridia
        subtype_term:
          preferred_term: isolated aniridia
          term:
            id: MONDO:0007119
            label: isolated aniridia
        description: 'Aniridia caused by an intragenic PAX6 loss-of-function variant or by a deletion
          confined to PAX6 and its cis-regulatory region, without extraocular malignancy risk. This is
          the majority form. Within it, genotype modulates severity: missense variants, which retain partial
          PAX6 function, give the mildest phenotype, whereas whole-gene deletions and nonsense or frameshift
          variants abolish one allele outright.

          '
      selected_evidence:
        snippet: Overall, the missense mutation subgroup had the mildest phenotype, and surgically naive
          eyes maintained better visual acuity.
        supports: SUPPORT
