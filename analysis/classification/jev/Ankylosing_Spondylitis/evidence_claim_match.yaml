        description: Environmental exposures such as smoking and heavy metals, combined with reduced antioxidant
          capacity, increase reactive oxygen species in AS patients. Oxidative injury potentiates NF-kB-driven
          cytokine production and is associated with more active and progressive disease.
        biological_processes:
        - preferred_term: Response to Oxidative Stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
