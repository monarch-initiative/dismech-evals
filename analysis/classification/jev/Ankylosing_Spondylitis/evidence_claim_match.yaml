        snippet: Exposure to heavy metals and lifestyle factors like smoking contribute to the production
          of free oxygen radicals. This fact, combined with a lowered total antioxidant status, can induce
          even more damage in the development of ankylosing spondylitis (AS).
        supports: SUPPORT
