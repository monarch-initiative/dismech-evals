      assertion_type: Pathophysiology
      assertion:
        name: Gut Dysbiosis and Gut-Joint Axis
        description: Intestinal dysbiosis and altered gut permeability are consistent features of AS.
          Gut-primed, IL-23-responsive immune cells (including alpha4-beta7+ ILC3s) are proposed to traffic
          from the mucosa to joints and entheses, where they produce IL-17 and IL-22, linking the gut
          to axial inflammation.
        cell_types:
        - preferred_term: Group 3 innate lymphoid cell
          term:
            id: CL:0001071
            label: group 3 innate lymphoid cell
        biological_processes:
        - preferred_term: Host-Microbe Interaction
          term:
            id: GO:0044403
            label: biological process involved in symbiotic interaction
      selected_evidence:
        snippet: According to the gut-joint axis theory the intestinal activation of different immune
          cell subsets, among the ones above described, followed by their recirculation in blood may lead
          to their final localization in joint and enthesis where the inflammatory process is carried
          out.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33692806
      reference_title: 'Role of the IL-23/IL-17 Pathway in Rheumatic Diseases: An Overview.'
      evidence_source: HUMAN_CLINICAL
      explanation: This directly supports the gut-joint axis claim that intestinal immune activation can
        seed joint and entheseal inflammation in AS.
