  632803c6a788d99bfcf6659942fcbe94cc70bdbc0b84d48298dfae14685e233c:
    claim:
      about:
        disease:
          name: Ankylosing Spondylitis
          disease_term:
            preferred_term: Ankylosing Spondylitis
            term:
              id: MONDO:0005306
              label: ankylosing spondylitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_as_cuproptosis_evidence_hierarchy
        prompt: Is the copper-associated mitochondrial and redox stress reported in ankylosing spondylitis
          a distinct canonical cuproptosis mechanism - copper-dependent, FDX1-lipoylation-driven, with
          lipoylated-protein aggregation and Fe-S cluster destabilization - or is it subsumed by the oxidative
          stress this entry already models downstream of HLA-B27 misfolding?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Oxidative Stress
        - pathophysiology#HLA-B27 Misfolding and ER Stress
        rationale: Ankylosing spondylitis is one of the organ-specific autoimmune diseases named in the
          cuproptosis-in-autoimmunity literature, and this entry already carries an oxidative stress node
          fed by HLA-B27 misfolding and ER stress - the exact place a copper-dependent mitochondrial mechanism
          would have to be distinguished from what is already modeled. The source review sets a five-part
          bar for calling something canonical cuproptosis and reports that the AS-relevant findings do
          not clear it, amounting to copper-associated metabolic stress or susceptibility markers. No
          cuproptosis node is added here; the gap is recorded so the question survives as a curation target
          and so a future transcriptomic association is not mistaken for a resolved mechanism. Copper-modulating
          therapy is likewise not curated as a treatment, since the review classes chelators and ionophores
          as hypothesis-generating.
        proposed_experiments:
        - experiment_id: exp_as_canonical_cuproptosis_criteria_at_the_enthesis
          name: Canonical-cuproptosis criteria applied to entheseal and sacroiliac tissue in spondyloarthritis
          description: 'Apply the five canonical cuproptosis criteria to spondyloarthritis-relevant material
            rather than to transcriptomic surrogates: quantify copper in entheseal, sacroiliac, and bone-marrow
            biopsy tissue and in sorted peripheral immune subsets from HLA-B27-positive patients, assay
            FDX1 protein with lipoylated DLAT/DLST aggregation, measure Fe-S cluster protein destabilization,
            and test chelation and ionophore rescue in an HLA-B27 transgenic model with the same panel
            read out at the enthesis. Model every readout against matched markers of HLA-B27 misfolding,
            ER stress, and general oxidative stress so a copper-specific program can be separated from
            the stress response this entry already curates.'
          experiment_type:
            preferred_term: mechanism validation study with biochemical and in vivo arms
          assays:
          - preferred_term: tissue and intracellular copper quantification
          - preferred_term: FDX1 immunoblot and in situ protein detection
          - preferred_term: lipoylated protein aggregation assay
          - preferred_term: Fe-S cluster protein stability assay
          - preferred_term: unfolded protein response and oxidative stress marker profiling
          readouts:
          - name: Copper specificity against the existing oxidative stress node
            target: pathophysiology#Oxidative Stress
            description: FDX1-lipoylation and Fe-S destabilization readouts modeled against matched general
              oxidative-stress markers in the same entheseal tissue.
            direction: ALTERED
            interpretation: A copper-dependent signal that persists after adjusting for general oxidative
              stress would justify a distinct mechanism node; one that collapses would confirm it is already
              captured by the oxidative stress node.
          - name: Relationship to HLA-B27 misfolding
            target: pathophysiology#HLA-B27 Misfolding and ER Stress
            description: Copper handling and FDX1-lipoylation readouts compared between HLA-B27-positive
              and HLA-B27-negative spondyloarthritis and healthy tissue.
            direction: ALTERED
            interpretation: A copper phenotype restricted to HLA-B27-positive tissue would place it downstream
              of misfolding and ER stress; an HLA-B27-independent phenotype would argue for a parallel
              mechanism.
          controls:
          - name: HLA-B27-negative spondyloarthritis
            description: Separates copper biology attributable to HLA-B27 misfolding from inflammation-associated
              copper handling.
          - name: Mechanical enthesopathy without inflammatory disease
            description: Non-autoimmune entheseal injury, to test whether any copper signal is specific
              to inflammatory spondyloarthritis.
          decision_criterion: Add a cuproptosis pathophysiology node to this entry only if all five canonical
            criteria are met in entheseal or sacroiliac material and the signal survives adjustment for
            general oxidative stress; otherwise record copper dysregulation as a susceptibility or metabolic-stress
            marker on the existing oxidative stress node.
          would_support:
          - pathophysiology#Oxidative Stress
          - pathophysiology#HLA-B27 Misfolding and ER Stress
        posed_date: '2026-08-11T00:00:00Z'
        notes: Filed from monarch-initiative/dismech#6381. The parallel gap is recorded on Systemic_Lupus_Erythematosus
          and Rheumatoid_Arthritis, the other dismech entries named in the source review.
      selected_evidence:
        snippet: direct in vivo evidence of canonical cuproptosis in autoimmune lesions remains scarce,
          and most relevant studies rely on transcriptomic associations, public dataset mining, or model-dependent
          experiments
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42435071
      reference_title: 'From copper imbalance to immunometabolic remodeling: cuproptosis-related vulnerability
        and therapeutic hypotheses in autoimmune diseases.'
      evidence_source: OTHER
      explanation: States the evidence-hierarchy gap directly - the reason this entry records cuproptosis
        as an open question rather than as a pathophysiology node.
