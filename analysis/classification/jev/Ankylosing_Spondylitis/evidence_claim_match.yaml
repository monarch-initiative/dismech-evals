      assertion_type: Pathophysiology
      assertion:
        name: HLA-B27 Misfolding and ER Stress
        description: HLA-B27 has a tendency to misfold in the endoplasmic reticulum and form aberrant
          homodimers. Accumulation of misfolded protein triggers the unfolded protein response (UPR) and
          drives IL-23 production, linking the major genetic susceptibility allele to downstream cytokine
          activation.
        biological_processes:
        - preferred_term: Unfolded Protein Response
          term:
            id: GO:0030968
            label: endoplasmic reticulum unfolded protein response
        - preferred_term: Interleukin-23 Production
          term:
            id: GO:0032627
            label: interleukin-23 production
          modifier: INCREASED
        genes:
        - preferred_term: HLA-B27
          term:
            id: hgnc:4932
            label: HLA-B
      selected_evidence:
        snippet: the unfolded protein response (UPR) theory postulates that unconventional HLA-B27 variants
          homodimerize instead of heterodimerize; the misfolded proteins accumulate in the intracellular
          compartment triggering endoplasmic reticulum stress and increasing IL-23 production (102).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
