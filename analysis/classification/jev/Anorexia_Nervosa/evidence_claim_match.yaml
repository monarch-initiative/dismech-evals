            preferred_term: anorexia nervosa
            term:
              id: MONDO:0005351
              label: anorexia nervosa
        context: []
      assertion_type: Biochemical
      assertion:
        name: Elevated Soluble Leptin Receptor
        biomarker_term:
          preferred_term: Leptin Receptor
          term:
            id: NCIT:C26349
            label: Leptin Receptor
        notes: Soluble leptin receptor (sOB-R, the shed/cleaved extracellular domain of the leptin receptor)
          circulates at elevated levels in acute anorexia nervosa. sOB-R acts as a circulating leptin
          antagonist by sequestering leptin and reducing its bioavailability; together with hypoleptinemia
          (low total leptin), sOB-R elevation reflects a dual-arm dysfunction in the leptin signaling
          system during starvation adaptation. The elevation of sOB-R complements the findings of low
          total leptin and indexes the severity of leptin resistance in the starvation state.
        specificity: Low as a stand-alone diagnostic marker (elevated sOB-R can occur in other states
          of metabolic stress and altered leptin signaling); high as part of the dual biomarker pattern
          (hypoleptinemia + sOB-R elevation) characterizing the acute AN starvation state.
        presence: INCREASED
      selected_evidence:
        snippet: soluble leptin receptor levels were significantly higher in cases of AN compared with
          those in non-AN controls
        supports: SUPPORT
