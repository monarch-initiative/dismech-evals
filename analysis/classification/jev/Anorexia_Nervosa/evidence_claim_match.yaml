        rationale: AN can cause multi-organ medical instability, prolonged disability, hospitalization,
          relapse, and excess mortality, including suicide-related mortality. Burden varies by illness
          phase, but the potential need for intensive multidisciplinary care supports a high disease-level
          rating.
      selected_evidence:
        snippet: Anorexia nervosa is associated with a mortality rate of 5.1 deaths per 1000 person-years
          (95% CI, 4.0-6.1), nearly 6 times higher than that of individuals of the same age without anorexia
          nervosa; 25% of deaths among individuals with anorexia nervosa are from suicide.
        supports: SUPPORT
