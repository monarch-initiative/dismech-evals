      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: leptin_hyperactivity
        hypothesis_label: Hypoleptinemia-driven starvation-induced hyperactivity
        status: EMERGING
        description: The hypothesis that low circulating leptin is a causal driver of the physical hyperactivity
          and motor restlessness of AN, not merely a correlate. The causal step is demonstrated in the
          rodent activity-based anorexia (ABA) model, where recombinant leptin suppresses semi-starvation-induced
          hyperactivity; human evidence is correlational (an inverted U-shaped leptin-activity relationship)
          and inconsistent, so the causal claim is retained as emerging pending controlled human testing.
      selected_evidence:
        snippet: the rat model activity-based anorexia (ABA) convincingly demonstrates the pivotal role
          of hypoleptinemia in the development of starvation-induced hyperactivity.
        supports: SUPPORT
    origin:
