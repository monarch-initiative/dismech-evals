          term:
            id: NCIT:C46081
            label: Leptin
        notes: Markedly low circulating leptin is an endocrinological hallmark of the acute underweight
          state of AN, resulting from the loss of adipose (leptin-secreting) tissue during energy restriction.
          Leptin partially normalizes with weight restoration. Hypoleptinemia is not diagnostic of AN
          in isolation (it reflects low fat mass from any cause) but is the biomarker that indexes the
          starvation-adaptation state and the target of metreleptin substitution.
        specificity: Low for AN as a stand-alone diagnostic marker (reflects low fat mass generally);
          high as an index of the acute starvation-adaptation state.
