            indexes the severity of the starvation-adaptation state; it partially normalizes with weight
            restoration and is the pharmacodynamic target of metreleptin substitution.
      selected_evidence:
        snippet: Hypoleptinemia acts as a key trigger for the adaptation to starvation by affecting diverse
