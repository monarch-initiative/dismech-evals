      assertion:
        name: Compressive myelopathy
        description: Epidural, vertebral, disc, hemorrhagic, or neoplastic compression can cause an acute
          anterior cord phenotype. Demonstrated cord compression shifts the diagnosis away from arterial
          spinal cord infarction and may require urgent cause-directed intervention.
        distinguishing_features:
        - Structural compression of the cord on MRI rather than a noncompressive vascular-territory lesion.
        - A mechanically explanatory lesion at the neurologic level.
      selected_evidence:
        snippet: the lack of cord compression on Magnetic Resonance Imaging (MRI) is the only mandatory
          feature for diagnosis.
        supports: SUPPORT
