      assertion_type: Pathophysiology
      assertion:
        name: Aortic, arterial, or procedure-related spinal arterial supply compromise
        description: Aortic or vertebral atherosclerosis and dissection, embolic arterial occlusion, systemic
          hypoperfusion, and interruption of segmental or collateral supply during aortic or spine procedures
          can compromise inflow to the spinal cord. A substantial fraction of spontaneous infarcts nevertheless
          remain etiologically unexplained.
        locations:
        - preferred_term: aorta
          term:
            id: UBERON:0000947
            label: aorta
        - preferred_term: anterior spinal artery
          term:
            id: UBERON:0005431
            label: anterior spinal artery
        - preferred_term: spinal cord
          term:
            id: UBERON:0002240
            label: spinal cord
      selected_evidence:
        snippet: Many factors have been shown to increase the risk of this complication, including the
          extent of TAA repair, length of aortic and collateral network coverage, embolization, and reduced
          spinal cord perfusion pressure.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
