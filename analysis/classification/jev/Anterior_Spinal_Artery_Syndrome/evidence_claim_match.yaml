      reference: PMID:34740806
      reference_title: A systematic review of spinal cord ischemia prevention and management after open
        and endovascular aortic repair.
      evidence_source: HUMAN_CLINICAL
      explanation: This systematic review supports collateral-network interruption, embolization, and
        reduced perfusion pressure in the aortic-repair setting.
