      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: The syndrome can abruptly cause paraplegia or tetraplegia, sensory loss, sphincter
          dysfunction, long-term wheelchair dependence, and death. Burden varies with lesion level and
          severity at nadir, but substantial permanent disability is common in published spinal cord infarction
          cohorts.
      selected_evidence:
        snippet: Acute spinal cord ischemia syndrome has a severe prognosis with permanent and disabling
          sequelae.
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
      evidence_path: /clinical_burden/evidence/0
      context_paths:
