      assertion_type: Discussion
      assertion:
        discussion_id: asas_preclinical_secondary_injury_translation
        prompt: Which secondary ischemia-reperfusion and cell-death pathways demonstrated in animal spinal
          cord models are active, measurable, and therapeutically important in human anterior spinal artery
          syndrome?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Hypoxic-ischemic spinal cord tissue injury
        rationale: Animal aortic-occlusion models consistently demonstrate gray-matter-predominant injury
          and are used to study oxidative, inflammatory, apoptotic, pyroptotic, and ferroptotic mechanisms.
          Human ASAS evidence is dominated by clinical phenotype and imaging, so those molecular pathways
          are not promoted to established human causal nodes without translational confirmation.
        proposed_experiments:
        - experiment_id: exp_asas_human_injury_biomarkers
          name: Human ASAS longitudinal imaging-biomarker study
          description: Collect acute and serial spinal DWI/perfusion imaging, CSF and blood injury/inflammation
            markers, treatment timing, and ASIA outcomes to test whether candidate secondary-injury pathways
            track tissue evolution and functional recovery in humans.
      selected_evidence:
        snippet: Preclinical models have been developed to simulate the clinical paradigm to better understand
          the neuropathophysiology and develop therapeutic treatment.
        supports: SUPPORT
