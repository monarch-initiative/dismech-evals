      assertion:
        discussion_id: asas_acute_reperfusion_strategy
        prompt: Which patients with hyperacute anterior spinal artery syndrome benefit from thrombolysis,
          spinal perfusion rescue, or other reperfusion strategies, and within what time window?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Cerebrospinal fluid drainage with blood-pressure augmentation in selected acute cases
        - treatments#Intravenous thrombolysis in carefully selected hyperacute occlusive ASAS
        rationale: 'Acute care is extrapolated from cerebral stroke, aortic-surgery prevention, and uncontrolled
          spinal cord infarction case reports. Etiologic heterogeneity is crucial: thrombolysis could
          be hazardous in aortic dissection or spinal hemorrhage, while CSF drainage has its own procedural
          risks. The record therefore presents these as selected, low-certainty strategies rather than
          universal treatment recommendations.'
        proposed_experiments:
        - experiment_id: exp_asas_multicenter_acute_registry
          name: Prospective multicenter hyperacute ASAS treatment registry
          description: Enroll patients using standardized time-to-nadir, MRI/DWI, vascular etiology, contraindication,
            ASIA, treatment-timing, safety, and long-term functional-outcome fields so causal-adjusted
            comparisons of reperfusion strategies become possible despite disease rarity.
      selected_evidence:
        snippet: There is a lack of controlled clinical trials on acute treatment strategies in ASAS.
        supports: SUPPORT
