      assertion_type: ProgressionInfo
      assertion:
        phase: Variable neurologic recovery with frequent residual disability
        duration: Months to years
        notes: Recovery is heterogeneous. Initial and nadir neurologic severity are the strongest prognostic
          indicators; anatomical level, etiology, age, and rehabilitation needs also shape outcome.
      selected_evidence:
        snippet: A literature review of 11 patient series of nontraumatic SCI found that prognosis is
          primarily determined by the severity of motor or sensory involvement, in particular, initial
          and nadir ASIA A/B scores which strongly correlate with poor outcome.
        supports: SUPPORT
    origin:
