      assertion_type: DifferentialDiagnosis
      assertion:
        name: Inflammatory acute or subacute myelopathy
        description: Inflammatory myelitis can mimic acute spinal cord infarction. A severe deficit reaching
          nadir within hours and a compatible anterior-territory DWI pattern favor infarction, while slower
          evolution or inflammatory evidence should broaden the work-up; atypical infarcts still occur.
        distinguishing_features:
        - Severe neurologic nadir within 12 hours favors infarction over many inflammatory myelopathies.
        - Anterior-territory diffusion restriction supports infarction but is not universal.
        - Lack of cord compression is required for either noncompressive diagnostic pathway.
      selected_evidence:
        snippet: Furthermore, many cases may be misdiagnosed as other forms of acute and subacute myelopathies.
        supports: SUPPORT
