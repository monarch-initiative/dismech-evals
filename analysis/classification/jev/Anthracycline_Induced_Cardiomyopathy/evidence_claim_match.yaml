        context: []
      assertion_type: Treatment
      assertion:
        name: Anthracycline interruption and individualized rechallenge
        description: Discontinue anthracyclines for severe symptomatic dysfunction; temporarily interrupt
          for moderate symptomatic or moderate/severe asymptomatic dysfunction. Mild symptomatic cases
          require multidisciplinary benefit-risk discussion. Mild asymptomatic dysfunction with preserved
          LVEF generally permits continued treatment with close monitoring and selected cardioprotection.
          Restarting after recovery requires an oncology-cardiology decision; dose minimization, liposomal
          formulation and dexrazoxane may be considered, with monitoring every 1–2 cycles. These measures
          do not guarantee safe rechallenge.
      selected_evidence:
        snippet: Temporary interruption of anthracycline chemotherapy and initiation of HF therapy is
          recommended in patients who develop asymptomatic moderate or severe CTRCD.
        supports: SUPPORT
