      assertion_type: Pathophysiology
      assertion:
        name: Reduced ABCB8 Expression
        biological_scale: MOLECULAR
        description: Doxorubicin reduces the abundance of the mitochondrial iron-export regulator ABCB8
          in neonatal rat cardiomyocytes and mouse hearts. The data implicate regulation at the mRNA level;
          direct binding of doxorubicin to the ABCB8 promoter or a measured transport-blocking interaction
          is not established.
      selected_evidence:
        snippet: These results suggest that DOX regulates ABCB8 at the mRNA level and that this regulation
          is independent of cytotoxic effects of the drug.
        supports: SUPPORT
