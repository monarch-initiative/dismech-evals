      assertion:
        name: Risk-adapted cardiac surveillance
        description: Obtain baseline echocardiography before anthracyclines and reassess according to
          risk, cumulative exposure and new findings. ESC recommends an echocardiogram within 12 months
          after completion in all adults; high/very-high-risk patients require more frequent imaging and
          biomarkers. Continue risk-adapted survivorship follow-up because a normal early assessment does
          not eliminate late risk.
