        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Neonatal rat cardiomyocyte iron-transport perturbation
        experimental_model_type: OTHER
        description: Doxorubicin preferentially accumulates in mitochondria in this culture system. Neonatal
          rat cardiomyocytes are exposed to doxorubicin with ABCB8 knockdown or overexpression. Compartmental
          iron, cellular oxidant probes, viability and TUNEL are assessed. Separate TOP2B and ABCB8 manipulations
          support parallel contributions to injury.
        modeled_mechanisms:
        - target: Mitochondrial Iron Accumulation
          relationship: PERTURBS
          model_scale: CELLULAR
          description: Manipulation of an iron-export regulator changes compartmental iron accumulation.
          limitations: Neonatal rat cultures and short high-concentration exposure differ from adult human
            myocardium. These assays do not identify ferroptosis specifically or establish clinical benefit
            of nonspecific chelation.
          readouts:
          - name: Mitochondrial iron after ABCB8 knockdown
            target: Mitochondrial Iron Accumulation
            direction: INCREASED
            description: Mitochondrial iron is higher with ABCB8 siRNA plus doxorubicin than with control
              siRNA plus drug.
        notes: Drug sequestration and iron loading are measured together, but the study does not selectively
          perturb sequestration to establish it as the mediator of iron accumulation.
      selected_evidence:
        snippet: While ABCB8 siRNA did not affect baseline cellular ROS levels, it resulted in a significantly
          higher ROS after DOX treatment
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/1
      evidence_path: /experimental_models/1/evidence/0
