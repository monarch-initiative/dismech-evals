        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Recovery or persistent dysfunction
        notes: Anthracycline cardiomyopathy is not uniformly irreversible. In the serial-monitoring cohort,
          prompt heart-failure treatment was followed by full recovery in 11% and partial recovery in
          71% of affected patients. These observational results lack a randomized untreated comparator
          and do not guarantee recovery. Childhood survivors can later develop a restrictive physiological
          pattern despite periods of compensated systolic function.
      selected_evidence:
        snippet: Twenty-five (11%) patients had full recovery, and 160 (71%) patients had partial recovery.
        supports: SUPPORT
