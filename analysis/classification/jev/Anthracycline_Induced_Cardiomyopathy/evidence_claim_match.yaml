      assertion_type: Treatment
      assertion:
        name: Spironolactone prevention evidence
        description: A small randomized study of 83 women with breast cancer tested concurrent spironolactone
          and reported preservation of LVEF and diastolic measures. A later network meta-analysis ranked
          its LVEF effect highly, but small indirect comparisons and risk of bias limit ranking-based
          claims. This is limited primary-prevention evidence, distinct from mineralocorticoid receptor
          antagonists as established guideline HF therapy; no clinical superiority or direct antifibrotic
          effect in these patients is inferred.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: spironolactone
            term:
              id: CHEBI:9241
              label: spironolactone
      selected_evidence:
        snippet: Eighty-three female patients who were diagnosed with breast cancer were included in the
          study. The study population was randomized into spironolactone and control groups.
        supports: SUPPORT
