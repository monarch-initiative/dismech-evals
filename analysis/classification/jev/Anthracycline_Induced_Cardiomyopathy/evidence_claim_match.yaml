              label: cardiomyopathy due to anthracyclines
        context: []
      assertion_type: Treatment
      assertion:
        name: Atorvastatin prevention in selected lymphoma patients
        description: STOP-CA randomized 300 adults receiving anthracycline-based lymphoma treatment to
          atorvastatin 40 mg daily or placebo for 12 months. Atorvastatin reduced the prespecified LVEF-decline
          endpoint (13/150 versus 33/150), while incident heart failure over 24 months did not differ
          significantly. This supports a preventive option for selected patients with lymphoma; it does
          not establish benefit across all cancers, treatment of established cardiomyopathy, or mortality
          benefit.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: atorvastatin
            term:
              id: CHEBI:39548
              label: atorvastatin
      selected_evidence:
        snippet: The incidence of the primary end point was 9% (13/150) in the atorvastatin group and
          22% (33/150) in the placebo group (P = .002).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/8
      evidence_path: /treatments/8/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37552303
      reference_title: 'Atorvastatin for Anthracycline-Associated Cardiac Dysfunction: The STOP-CA Randomized
