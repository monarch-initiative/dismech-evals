              label: cardiomyopathy due to anthracyclines
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Commercial human iPSC-derived cardiomyocyte TOP2B knockdown
        experimental_model_type: OTHER
        description: Commercial CDI cardiomyocytes receive pooled TOP2B siRNAs or dexrazoxane pretreatment
          before 48-hour doxorubicin exposure. Knockdown improves several viability, electrical, oxidant-probe
          and ultrastructural readouts. It does not uniformly outperform dexrazoxane across assays or
          completely normalize calcium transients.
        modeled_mechanisms:
        - target: Mitochondrial Structural Injury
          relationship: PERTURBS
          model_scale: CELLULAR
          description: TOP2B knockdown attenuates the ultrastructural lesion.
          limitations: No direct ATP, oxygen-consumption or biogenesis assay is reported. Donor diversity
            is unspecified; pooled siRNAs lack a re-expression rescue. Pretreatment addresses acute prevention,
            not established cardiomyopathy.
          readouts:
          - name: TEM structural preservation
            target: Mitochondrial Structural Injury
            direction: RESTORED
            description: TOP2B knockdown attenuates the structural abnormality relative to doxorubicin
              exposure alone; this is partial morphological preservation.
        - target: Sarcomere Disruption
          relationship: PERTURBS
          model_scale: CELLULAR
          description: Knockdown preserves sarcomere alignment in the same culture experiment.
          limitations: Shared time-point preservation does not establish a mitochondrial-to-sarcomere
            causal sequence or whole-heart contractile recovery.
          readouts:
          - name: TEM structural preservation
            target: Sarcomere Disruption
            direction: RESTORED
            description: TOP2B knockdown attenuates the structural abnormality relative to doxorubicin
              exposure alone; this is partial morphological preservation.
        notes: MTT benefit exceeds the tested dexrazoxane condition whereas LDH reduction is comparable.
          cTnT is a transcript readout, not blood troponin. No cancer-cell killing, in-vivo delivery or
          long-term safety outcome establishes clinical superiority or preservation of antitumor efficacy.
      selected_evidence:
        snippet: Treatment with Dox, Dox + Dex, and Dox + TOP2B-KD resulted in a significant decrease
          in transient amplitude
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
