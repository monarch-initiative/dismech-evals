          term:
            id: hgnc:14015
            label: CELF4
        relationship_type: SUSCEPTIBILITY
        notes: A two-step genome-wide gene-by-dose analysis implicated rs1786814 in 331 non-Hispanic White
          childhood-cancer survivors after quality control (112 cases, 219 controls). No marginal SNP
          association passed the study threshold. The reported 10.16-fold odds ratio compares GG with
          >300 mg/m² exposure against GA/AA with ≤300 mg/m², changing both genotype and dose. Replication
          included 54 cases without controls and tested genotype-dose association, not the same disease-risk
          contrast. In 33 healthy heart samples, embryonic/adult TNNT2 isoform coexpression was observed
          in 19/21 GG versus 5/12 GA/AA samples. This supports a molecular association; neither variant
          perturbation nor anthracycline-exposed myocardial contractility was measured. Clinical prediction
          and treatment selection remain unvalidated.
      selected_evidence:
        snippet: No SNP was marginally associated with cardiomyopathy. However, SNP rs1786814 on the CELF4
          gene passed the significance cutoff for gene-environment interaction (Pge = 1.14 × 10(-5)).
        supports: SUPPORT
