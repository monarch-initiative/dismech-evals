        context: []
      assertion_type: Diagnosis
      assertion:
        name: Echocardiography and global longitudinal strain
        description: Compare LVEF and GLS with baseline, using the same modality and strain vendor when
          possible. ESC asymptomatic severe dysfunction is a new LVEF below 40%; moderate dysfunction
          is a decline of at least 10 percentage points to 40–49%, or a smaller decline to that range
          with a new relative GLS fall over 15% or biomarker rise. Mild dysfunction requires LVEF at least
          50% plus a new relative GLS fall over 15% and/or a biomarker rise. Symptomatic severity is graded
          clinically and is not interchangeable with these EF strata.
      selected_evidence:
        snippet: Current deﬁnitions of CTRCD are based on a reduction of LVEF and/or relative changes
          in global longitudinal strain (GLS)
        supports: SUPPORT
