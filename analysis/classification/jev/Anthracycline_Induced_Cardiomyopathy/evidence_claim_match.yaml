  048ccb6e4487b1cfdfa67a3d96cf28835382d941701cad724c9a664275794bae:
    claim:
      about:
        disease:
          name: Anthracycline-Induced Cardiomyopathy
          disease_term:
            preferred_term: anthracycline-induced cardiomyopathy
            term:
              id: MONDO:0022653
              label: cardiomyopathy due to anthracyclines
        context: []
      assertion_type: Treatment
      assertion:
        name: Dexrazoxane cardioprotection
        description: Dexrazoxane is considered before anthracycline administration for selected patients
          at high or very high cardiac-toxicity risk or requiring substantial cumulative exposure. ESC
          adult prevention guidance is broader than product-label eligibility and should not be read as
          a universal indication. The pediatric IGHG guideline makes a moderate recommendation when anticipated
          cumulative doxorubicin-equivalent exposure is at least 250 mg/m²; it makes no recommendation
          below that threshold because evidence is insufficient. Historical secondary-neoplasm concerns
          remain part of benefit-risk discussion, not proof that the drug causes such cancers. TOP2B-associated
          DNA damage and mitochondrial iron handling are proposed cardioprotective mechanisms, distinct
          from clinical proof of prevention. A later survivor follow-up analyzed 195 people from legacy
          trials, mostly originally randomized, with modest systolic-function differences after about
          18 years. The prespecified structural measure did not differ significantly, and only 41% of
          potentially eligible survivors enrolled; this is incomplete protection, not proven elimination
          of lifetime heart-failure risk.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: dexrazoxane
            term:
              id: CHEBI:50223
              label: (+)-dexrazoxane
      selected_evidence:
