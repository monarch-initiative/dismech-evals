  0396710e8984bf8355e838682659ed7c542288bf7377da214a157fe34d71a2f0:
    claim:
      about:
        disease:
          name: Anthracycline-Induced Cardiomyopathy
          disease_term:
            preferred_term: anthracycline-induced cardiomyopathy
            term:
              id: MONDO:0022653
              label: cardiomyopathy due to anthracyclines
        context: []
      assertion_type: Genetic
      assertion:
        name: CBR3
        gene_term:
          preferred_term: CBR3
          term:
            id: hgnc:1549
            label: CBR3
        relationship_type: SUSCEPTIBILITY
        notes: In a matched study of 170 childhood-cancer survivors with cardiomyopathy and 317 controls,
          CBR3 rs1056892 (V244M) GG was associated with greater risk than GA/AA within the 1–250 mg/m²
          anthracycline-exposure stratum (OR 3.30, 95% CI 1.41–7.73). High-dose exposure was associated
          with disease in both genotype groups. Most participants were non-Hispanic White; 114 controls
          lacked echocardiography, and fatal cases were excluded by survivor ascertainment. This observational
          result does not establish a safe dose for any genotype, population penetrance, or benefit from
          genotype-guided prescribing. The later CELF4 study overlapped this cohort substantially and
          is not independent CBR3 replication. CBR1 rs9024 (1096G>A) was a candidate susceptibility variant
          in the same survivor study, but the full results found no overall association. The low/moderate-dose
          GG association was borderline before CBR3 adjustment (OR 3.29, P=.05) and nonsignificant after
          adjustment (OR 2.63, P=.11). CBR1 is recorded as an investigated candidate, not an established
          risk determinant. Proposed effects on alcohol-metabolite production are background from prior
          experiments and do not prove mediation of the observed clinical associations.
      selected_evidence:
        snippet: One hundred seventy patient cases with cardiomyopathy and 317 matched controls participated
          in this study.
        supports: SUPPORT
