      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: conformeropathy
        hypothesis_label: Conformeropathy / cryptic-neoepitope model
        status: CANONICAL
        description: 'The dominant mechanistic model holds that anti-GBM disease is an autoimmune "conformeropathy":
          the immunodominant epitopes are normally sequestered within the cross-linked alpha345NC1 hexamer
          (immune privilege), and disease requires an environmental insult that dissociates the hexamer
          to expose cryptic neoepitopes on alpha3/alpha5(IV)NC1 in an HLA-DR15-susceptible host.'
      selected_evidence:
        snippet: The antibodies bound to distinct epitopes encompassing region E(A) in the alpha5NC1 monomer
          and regions E(A) and E(B) in the alpha3NC1 monomer, but they did not bind to the native cross-linked
          alpha345NC1 hexamer
        supports: SUPPORT
