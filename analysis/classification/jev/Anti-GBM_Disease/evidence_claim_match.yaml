              and alpha5 NC1 monomers that patient antibodies can bind. This molecular architecture supports
              a cryptic-epitope model, but does not by itself establish which exposure initiates disease
              in humans.
            biological_scale: MOLECULAR
            genes:
            - preferred_term: COL4A3
              term:
                id: hgnc:2204
                label: COL4A3
            biological_processes:
