        description: C3 or C4 deficiency reduced neutrophil infiltration, proteinuria, and capillary thrombosis
          after nephritogenic antibody exposure, supporting a causal complement role. The heterologous
          antibody-transfer model bypasses human loss of tolerance, and protection was overcome at higher
          antibody dose.
        associated_phenotypes:
        - Proteinuria
        - Glomerular capillary thrombosis
      selected_evidence:
        snippet: These studies support a critical role for complement in the development of anti-GBM disease.
          However, the protective effect of complement deficiency can be broken if the dose of nephritogenic
          antibody is increased.
        supports: SUPPORT
