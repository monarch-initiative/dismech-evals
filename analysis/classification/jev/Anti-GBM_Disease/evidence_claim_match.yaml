        description: 'Pointed at the loss-of-tolerance node because the cited sentence conditions its
          claim on genetic susceptibility and that node is the one carrying the HLA restriction. Graded
          predisposing rather than triggering despite the sentence using the word trigger, because the
          sentence hedges it twice, saying clustering suggests environmental factors may trigger disease,
          and the exposure''s own name calls infection possible. The intermediates are unknown in the
          strict sense: no organism is named and no route from infection to autoantibody production is
          given.'
      selected_evidence:
        snippet: The recent confirmation of spatial and temporal clustering of cases suggests that environmental
          factors, including infection, may trigger disease in genetically susceptible individuals.
        supports: SUPPORT
