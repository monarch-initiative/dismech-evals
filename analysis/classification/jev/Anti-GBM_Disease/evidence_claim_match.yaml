        name: Atypical seronegative anti-GBM disease
        display_name: Atypical seronegative anti-GBM disease
        description: A heterogeneous biopsy-defined presentation with linear GBM IgG but absent circulating
          anti-GBM antibodies. In a 60-patient cohort, kidney injury was generally milder than classic
          disease, but hematuria, proteinuria, complement deposition, crescent formation, kidney failure,
          and death still occurred.
      selected_evidence:
        snippet: Atypical cases of anti-glomerular basement membrane (GBM) disease had absent circulating
          antibodies but linear IgG deposits along GBM in the kidneys.
        supports: SUPPORT
