              modifier: ABNORMAL
              term:
                id: GO:0030198
                label: extracellular matrix organization
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: HLA-restricted loss of tolerance and anti-GBM IgG production
        description: Exposure of normally cryptic NC1 epitopes provides antigenic substrate for the autoreactive
          response in the conformeropathy model.
        hypothesis_groups:
        - conformeropathy
      selected_evidence:
        snippet: The antibodies bound to distinct epitopes encompassing region E(A) in the alpha5NC1 monomer
          and regions E(A) and E(B) in the alpha3NC1 monomer, but they did not bind to the native cross-linked
          alpha345NC1 hexamer
        supports: SUPPORT
        directness: INDIRECT
