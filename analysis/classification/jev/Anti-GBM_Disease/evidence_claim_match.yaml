                label: exposure to cigarette smoking
            description: Current smoking is associated with pulmonary involvement in anti-GBM disease.
              This observational association supports smoking as a harmful modifier of the pulmonary phenotype,
              not as a necessary cause of autoimmunity.
            effect: HARMFUL
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Alveolar capillary-wall disruption
        environmental_effect: EXACERBATES
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: 'Exacerbating rather than triggering, because this exposure does not cause the disease:
          the antibody is already made, and smoking decides whether the lung is involved. The classic
          1983 series settles both halves of that sentence. All 37 cigarette smokers in it had lung haemorrhage
          against 2 of 10 non-smokers, and crucially the anti-GBM antibody titres did not differ between
          the two groups, so smoking is not acting by making more antibody. That null result is what places
          this edge on the alveolar capillary wall rather than on the loss-of-tolerance node, and it is
          a stronger argument for the target than the association alone would be. One patient in that
          series resumed smoking and the lung haemorrhage returned, which is a within-patient rechallenge
          and the strongest causal design available anywhere in this entry.'
      selected_evidence:
        snippet: Of these, all 37 cigarette smokers suffered lung haemorrhage, compared with only 2 of
          10 non-smokers
        supports: SUPPORT
