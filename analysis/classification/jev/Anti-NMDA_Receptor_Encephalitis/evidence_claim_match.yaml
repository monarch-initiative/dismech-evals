            term:
              id: MONDO:0021081
              label: anti-NMDA receptor encephalitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_nmdare_gas_trigger
        prompt: Can Group A Streptococcus infection independently trigger anti-NMDAR autoimmunity, or
          is co-occurring GAS incidental in teratoma-bearing patients?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Triggered Anti-GluN1 Autoimmunity
        rationale: A single case report (PMID:42344622) documents concurrent GAS infection in a patient
          with bilateral ovarian teratomas and anti-NMDAR encephalitis, but the paper's own conclusion
          notes limited evidence of a causal relationship. Whether GAS triggers molecular mimicry or epitope
          spreading against NMDAR epitopes — analogous to the established post-HSE pathway — remains untested.
        proposed_experiments:
        - experiment_id: exp_nmdare_gas_serology_cohort
          name: GAS serology screening in non-teratoma NMDARE cohorts
          description: Systematic screening for GAS serology in non-teratoma NMDARE cohorts to determine
            whether GAS infection precedes disease onset independently of teratoma presence.
        - experiment_id: exp_nmdare_gas_cross_reactivity
          name: GAS M-protein cross-reactivity testing against GluN1
          description: In vitro cross-reactivity testing of GAS M-protein epitopes against GluN1 to evaluate
            molecular mimicry as a potential mechanistic pathway.
      selected_evidence:
        snippet: The observed association between Group A Streptococcus infection preceding symptom onset
          suggests a possible infectious trigger leading to an immunologic response and subsequent anti-NMDAR
          encephalitis; however, there is limited evidence of a causal relationship in the literature.
        supports: SUPPORT
