            term:
              id: MONDO:0021081
              label: anti-NMDA receptor encephalitis
        context: []
      assertion_type: Phenotype
      assertion:
        name: Catatonia
        category: Psychiatric
        frequency: VERY_FREQUENT
        description: A psychomotor syndrome — immobility, staring, mutism and posturing predominating,
          with excitement often co-occurring in the same patient — present in roughly two thirds of prospectively
          assessed patients. It is curated as a disease in its own right in the transdiagnostic entry
          `Catatonia` (MONDO:0800105), whose immune-mediated hypothesis arm is anchored on this disease;
          what is recorded here is the frequency and sign profile specific to anti-NMDAR encephalitis.
          Recognising it matters clinically because catatonia is widely assumed to indicate a primary
          psychiatric illness, which is the route by which this encephalitis is misdiagnosed.
        notes: 'Deliberately carries no `phenotype_term`: HPO has no catatonia class. Re-verified 2026-09-20
          by searching OLS `hp` for "catatonia", which returns nothing — the same upstream gap recorded
          when `kb/disorders/Catatonia.yaml` was curated, and the reason the `Catatonia` phenotype in
          `kb/disorders/Schizophrenia.yaml` is likewise unbound. Leaving the class unbound is the shared
          convention; the `Catatonia` entry does the same. The constituent signs HPO does carry are curated
          as `sequelae` below (Mutism `HP:0002300`, Abnormal posturing `HP:0002533`) so this arm stays
          reachable from HPO-grounded queries despite the missing class. That `sequelae` attachment is
          this entry''s own compromise and is not a convention the `Catatonia` entry follows - that entry
          has no `sequelae` at all and leaves Mutism and Abnormal posturing disconnected. Note also that
          the two edges carry a part-of relation rather than a causal one: the signs constitute the catatonic
          state rather than following from it. `sequelae` is the closest available slot, there is no part-of
          edge type in the schema, and each edge description says so explicitly.'
      selected_evidence:
        snippet: The most frequent neuropsychiatric patterns were psychosis (81%), delirium (75%), catatonia
          (69%), anxiety-depression (65%), and mania (27%).
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/1
      evidence_path: /phenotypes/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35534479
      reference_title: 'Neuropsychiatric phenotypes of anti-NMDAR encephalitis: a prospective study.'
