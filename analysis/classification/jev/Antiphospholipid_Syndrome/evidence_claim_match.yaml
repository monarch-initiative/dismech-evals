  9f29430032a32d636558dcc32be319e91c2f6145f243e6ea8560e81817c52e03:
    claim:
      about:
        disease:
          name: Antiphospholipid Syndrome
          disease_term:
            preferred_term: antiphospholipid syndrome
            term:
              id: MONDO:8000010
              label: antiphospholipid syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Long-term warfarin anticoagulation
        action_category: THERAPEUTIC
        description: Vitamin K antagonist therapy is standard secondary prevention for thrombotic APS.
          For a first unprovoked venous event, the usual target INR is 2-3; after an arterial event, INR
          2-3 versus 3-4 is individualized to thrombosis and bleeding risk. Recurrent thrombosis despite
          adequate therapy prompts adherence/INR review and selected escalation rather than assuming universal
          treatment failure.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: warfarin
            term:
              id: CHEBI:10033
              label: warfarin
        target_phenotypes:
        - preferred_term: Venous thrombosis
          term:
            id: HP:0004936
            label: Venous thrombosis
        - preferred_term: Arterial thrombosis
          term:
            id: HP:0004420
            label: Arterial thrombosis
        notes: Rivaroxaban should not be used in triple-aPL-positive APS. Evidence for DOACs in lower-risk
          single- or double-positive venous-only populations is less definitive, so anticoagulant choice
          is individualized rather than implying that every DOAC exposure has identical risk.
      selected_evidence:
        snippet: Patients with APS and first unprovoked venous thrombosis should receive long-term treatment
          with vitamin K antagonists (VKA) with a target international normalised ratio (INR) of 2-3.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
