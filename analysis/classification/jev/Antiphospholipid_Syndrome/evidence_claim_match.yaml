        name: Impaired fibrinolysis
        description: In APS, reduced fibrinolytic activity and fibrin morphology less amenable to lysis
          can favor persistence of an existing clot. This is a parallel, nonconforming persistence amplifier
          rather than part of the atomic conserved coagulation/thrombin/fibrin-formation node; it is also
          reported in obstetric APS and therefore is not specific to the mapped thrombotic branch.
        biological_processes:
        - preferred_term: fibrinolysis
          term:
            id: GO:0042730
            label: fibrinolysis
          modifier: DECREASED
      selected_evidence:
        snippet: Impaired fibrinolysis has been found in APS patients with thrombotic as well as obstetric
          manifestations.
        supports: SUPPORT
