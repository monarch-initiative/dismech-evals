      assertion:
        name: HELLP syndrome
        description: HELLP syndrome overlaps with obstetric APS and catastrophic APS through thrombocytopenia,
          hemolysis, liver injury, and severe pregnancy-associated maternal morbidity.
        distinguishing_features:
        - A pregnancy-specific pre-eclampsia context with hemolysis, elevated liver enzymes, and low platelet
          count favors HELLP syndrome.
        - Neurologic involvement, dialysis requirement, or absent disseminated intravascular coagulation
          raise concern for thrombotic microangiopathy or APS mimics rather than isolated HELLP.
        disease_term:
          preferred_term: HELLP syndrome
          term:
            id: MONDO:0008585
            label: HELLP syndrome
      selected_evidence:
        snippet: Pre-eclampsia complicated by severe HELLP (hemolysis, elevated liver enzymes and low
          platelet count) syndrome is a multi-organ disease, and can be difficult to differentiate from
          thrombotic microangiopathy (appearing as thrombotic thrombocytopenic purpura or hemolytic uremic
          syndrome), acute fatty liver, systemic erythematous lupus, antiphospholipid syndrome and severe
          sepsis.
        supports: SUPPORT
