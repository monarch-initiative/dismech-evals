        name: Trigger-dependent thromboinflammatory amplification
        description: Persistent aPL create susceptibility, but overt thrombosis is often intermittent.
          Infection, inflammation, vascular injury, surgery, pregnancy, or interruption of anticoagulation
          can supply an additional trigger; this two-hit model is useful but is not universal, especially
          for obstetric APS.
