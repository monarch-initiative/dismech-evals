            id: MONDO:0018896
            label: thrombotic thrombocytopenic purpura
      selected_evidence:
        snippet: The differential diagnosis of CAPS includes thrombotic thrombocytopenic purpura (TTP)
          and this distinction may be difficult, but essential, for appropriate therapy.
        supports: SUPPORT
