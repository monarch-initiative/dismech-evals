      assertion_type: Definition
      assertion:
        name: 2023 ACR/EULAR APS classification criteria
        definition_type: OTHER
        description: A weighted research-classification system designed for high specificity. It is not
          a stand-alone diagnostic rule and should not override clinical judgment or exclude otherwise
          clinically diagnosed patients.
        scope: Research classification of people with suspected APS
        criteria_sets:
        - name: Entry criterion
          description: At least one positive aPL test must occur within three years of an aPL-associated
            clinical criterion.
          minimum_required: 1
        - name: Weighted clinical and laboratory domains
          description: After the entry criterion, classification requires at least three points from clinical
            domains and at least three points from laboratory domains. Clinical domains are macrovascular
            venous, macrovascular arterial, microvascular, obstetric, cardiac-valve, and hematologic;
            laboratory domains are lupus-anticoagulant functional assays and solid-phase aCL or anti-beta2GPI
            assays.
      selected_evidence:
        snippet: To develop new antiphospholipid syndrome (APS) classification criteria with high specificity
          for use in observational studies and trials, jointly supported by the American College of Rheumatology
          (ACR) and EULAR.
        supports: SUPPORT
