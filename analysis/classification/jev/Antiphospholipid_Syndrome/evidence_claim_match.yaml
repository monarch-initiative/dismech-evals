      assertion:
        name: Thrombotic thrombocytopenic purpura
        description: Thrombotic thrombocytopenic purpura can closely mimic catastrophic APS through thrombocytopenia,
          microangiopathic hemolysis, neurologic injury, renal dysfunction, and multiorgan ischemia.
        distinguishing_features:
        - Undetectable ADAMTS13 activity strongly favors thrombotic thrombocytopenic purpura.
        - Rapid multisite thrombosis and organ dysfunction in a patient with a qualifying APS clinical
          and persistent laboratory context support CAPS; aPL positivity alone and empiric anticoagulation
          do not distinguish CAPS from TTP.
        disease_term:
          preferred_term: thrombotic thrombocytopenic purpura
