              label: antisocial personality disorder
        context: []
      assertion_type: Treatment
      assertion:
        name: Early preventive intervention in high-risk children
        description: The Fast Track trial randomized 891 early-starting high-risk children to a ten-year
          multicomponent intervention addressing parent behavior management, child social-cognitive skills,
          reading, home visiting, mentoring and classroom curricula. It prevented lifetime externalizing
          diagnoses, including conduct disorder, but only among children at highest initial risk. Because
          childhood conduct disorder is a diagnostic prerequisite for ASPD, prevention at this stage acts
          upstream of the adult disorder.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: behavioral intervention
          term:
            id: NCIT:C15184
            label: Behavioral Intervention
      selected_evidence:
        snippet: Significant interaction effects between intervention and initial risk level indicated
          that intervention prevented the lifetime prevalence of all diagnoses, but only among those at
          highest initial risk, suggesting that targeted intervention can prevent externalizing disorders
          to promote the raising of healthy children.
        supports: SUPPORT
        directness: INDIRECT
