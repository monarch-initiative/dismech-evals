      assertion_type: Pathophysiology
      assertion:
        name: MAOA-Moderated Sensitivity to Maltreatment
        description: A functional polymorphism in MAOA, encoding the monoamine-metabolizing enzyme monoamine
          oxidase A, moderates the effect of childhood maltreatment on later antisocial outcomes. Maltreated
          boys with the high-activity genotype were less likely to develop antisocial problems, so the
          genotype acts as a moderator of environmental sensitivity rather than as an independent cause.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: A functional polymorphism in the gene encoding the neurotransmitter-metabolizing enzyme
          monoamine oxidase A (MAOA) was found to moderate the effect of maltreatment.
        supports: SUPPORT
