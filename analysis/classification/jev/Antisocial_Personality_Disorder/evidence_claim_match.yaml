      assertion_type: Environmental
      assertion:
        name: Childhood maltreatment
        description: Physical and emotional maltreatment in childhood is the best-replicated environmental
          contributor to later antisocial behavior, and its effect is conditional on MAOA genotype rather
          than uniform across exposed children.
        exposure_term:
          preferred_term: childhood maltreatment
        notes: ECTO was searched for a childhood-maltreatment or child-abuse exposure term and none was
          found, so exposure_term carries a free-text preferred_term with no binding rather than a poor-fitting
          substitute. The cohort was male-only, so the exposure effect is not established in girls by
          this study.
      selected_evidence:
        snippet: We studied a large sample of male children from birth to adulthood to determine why some
          children who are maltreated grow up to develop antisocial behavior, whereas others do not.
        supports: SUPPORT
