  e737b897377b43764a416dd941af564fbfd13e3e5579fbbaef78713f0e8dde21:
    claim:
      about:
        disease:
          name: Antisocial Personality Disorder
          disease_term:
            preferred_term: antisocial personality disorder
            term:
              id: MONDO:0001164
              label: antisocial personality disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Polygenic Genetic Susceptibility
        description: Genome-wide association analysis of ASPD diagnostic criteria in 3217 alcohol-dependent
          participants identified a chromosome 15 variant, rs9806493, an eQTL for SLCO3A1, a gene strongly
          expressed in anterior cingulate and frontal cortices. Polygenic risk for ASPD correlates positively
          with smoking, ADHD, depression traits and PTSD, indicating substantially shared rather than
          disorder-specific genetic risk.
        biological_scale: MOLECULAR
        notes: The discovery sample consisted entirely of alcohol-dependent participants, so the finding
          is not established as generalizable to ASPD in the general population.
      selected_evidence:
        snippet: rs9806493 is an eQTL for SLCO3A1 (Solute Carrier Organic Anion Transporter Family Member
          3A1), a ubiquitously expressed gene with strong expression in brain regions that include the
          anterior cingulate and frontal cortices.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37756443
      reference_title: Genome-wide association study of antisocial personality disorder diagnostic criteria
        provides evidence for shared risk factors across disorders.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the gene implicated by the genome-wide significant ASPD association and
        its regional brain expression.
