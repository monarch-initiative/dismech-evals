      assertion:
        name: HARS Immune-Complex Activation of Alveolar Monocyte-Macrophages
        description: In a small 2026 paired blood/BALF multi-omics study, inflammatory monocyte-macrophage
          populations were expanded in antisynthetase-syndrome ILD, and HARS-containing immune complexes
          activated primary human macrophages in vitro. This provides provisional, anti-Jo-1-specific
          support for an immune-complex-to-lung inflammation route; it does not establish that this mechanism
          explains other anti-synthetase specificities or clinical outcomes.
        mechanism_confidence: PROVISIONAL
        biological_scale: CELLULAR
        genes:
        - preferred_term: HARS1
          term:
            id: hgnc:4816
            label: HARS1
        cell_types:
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: Macrophage activation
          term:
            id: GO:0042116
            label: macrophage activation
          modifier: INCREASED
      selected_evidence:
        snippet: In ASS-ILD BALF, monocyte-macrophages showed significantly higher cytokine and inflammatory
          gene module scores compared with IPF and HCs
        supports: SUPPORT
