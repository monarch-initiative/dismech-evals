        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Polymyositis and Dermatomyositis
        description: Other idiopathic inflammatory myopathies with which antisynthetase syndrome overlaps;
          historically these patients were diagnosed as PM or DM.
        distinguishing_features:
        - Antisynthetase syndrome is defined by anti-aminoacyl-tRNA synthetase antibodies and has a higher
          prevalence and severity of ILD than DM/PM.
        - It lacks the defining DM skin signs (heliotrope rash, Gottron papules) unless in overlap.
        - Muscle biopsy shows perimysial fragmentation/perifascicular necrosis distinct from DM perifascicular
          atrophy and PM endomysial CD8 invasion.
      selected_evidence:
        snippet: There is a higher prevalence and increased severity of interstitial lung disease in patients
          with anti-synthetase syndrome, as compared to dermatomyositis and polymyositis
        supports: SUPPORT
