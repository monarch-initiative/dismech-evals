  39b3fee0229b5b8f06e843fb21ef8a5a7d0eaef5c2456ba76c41e28e4482cc2f:
    claim:
      about:
        disease:
          name: Antley-Bixler Syndrome, FGFR2-Related
          disease_term:
            preferred_term: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
            term:
              id: MONDO:0020667
              label: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_abs_two_disorders_one_name
        prompt: How should a knowledge base represent a disease name that denotes two mechanistically
          unrelated disorders, when the field has not agreed which one owns the name?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#FGFR2 IgIII Cysteine-Creating Activation
        rationale: 'This is a curation-practice gap as much as a biological one, recorded because it will
          recur. "Antley-Bixler syndrome" covers this FGFR2 craniosynostosis and a distinct autosomal
          recessive POR (cytochrome P450 oxidoreductase) deficiency presenting with disordered steroidogenesis
          and ambiguous genitalia — a disorder of steroid synthesis with no FGFR involvement whatever.
          MONDO splits them (MONDO:0020667 here, MONDO:0008726 for the POR form), but the literature does
          not: a PubMed sweep on the syndrome name returns an overwhelmingly POR-dominated result set,
          so any automated literature harvest keyed on the name will import the wrong disorder into this
          entry. The published nomenclature proposals conflict, with at least one arguing the name should
          go to the POR form. Until the field settles, the practical protections are the ones applied
          here: scope by genotype rather than by name, quote only sources whose subject can be identified
          from the quoted text, and state the hazard in the entry so it is not re-inherited. The dismech
          NEC preflight (`just preflight-dr`) is the relevant tooling, and this disorder is a good test
          case for it.'
        proposed_experiments:
        - experiment_id: exp_abs_name_keyed_literature_precision
          name: Measure precision of name-keyed literature retrieval for split eponyms
          description: Quantify what fraction of "Antley-Bixler syndrome" publications concern each genotype.
            A precision figure would let the NEC preflight flag name-keyed harvests for split eponyms
            generally, rather than relying on a curator recognizing the hazard case by case.
      selected_evidence:
        snippet: in the scientific literature is genetically heterogeneous with at least two distinct
          disorders, (1) ABS without disordered steroidogenesis, which appears to be a variant of the
          autosomal dominant fibroblast growth factor receptor (FGFR)
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16145814
      reference_title: 'Use of the term "Antley-Bixler syndrome": minimizing confusion.'
      evidence_source: OTHER
      explanation: Confirms the name covers two distinct disorders in the literature.
