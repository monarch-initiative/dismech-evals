      assertion_type: Genetic
      assertion:
        name: FGFR2 p.Ser351Cys
        gene_term:
          preferred_term: FGFR2
          term:
            id: hgnc:3689
            label: FGFR2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'The recurrent allele of the FGFR2 form, c.1052C>G p.Ser351Cys in the IgIII domain, reported
          predominantly in patients with normal genitalia and normal steroidogenesis. The same substitution
          has been reported in severe Pfeiffer syndrome, which is part of why the entity status of the
          FGFR2 form is disputed. Distinguishing this entry from the POR form is a genotype question,
          not a phenotype one: the two overlap substantially in skeletal features, and urinary steroid
          profiling is what separates them clinically.'
      selected_evidence:
        snippet: The patient was found to be heterozygous for a C-->G transversion at nucleotide 1064,
          which predicts a Ser351Cys amino acid substitution in the IgIII domain of FGFR2.
        supports: SUPPORT
