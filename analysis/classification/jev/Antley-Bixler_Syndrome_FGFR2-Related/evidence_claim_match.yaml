      assertion:
        population: Worldwide, published-case literature
        measure_type: CASES_IN_LITERATURE
        prevalence_class: BELOW_1_IN_1000000
        notes: 'No population estimate exists, and the case literature is additionally confounded by the
          two-disorder problem: many published "Antley-Bixler syndrome" cases are the POR form, so counts
          drawn from the name rather than the genotype overstate this entry. The FGFR2 form is described
          in single case reports and small series.'
      selected_evidence:
        snippet: Antley-Bixler syndrome (ABS) is an exceptionally rare craniosynostosis syndrome characterized
          by radiohumeral synostosis present from the perinatal period.
        supports: SUPPORT
