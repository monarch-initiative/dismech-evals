  f698c2f0ea86d69469c6cf319ef597a8fee50a758d8b478e28059c0ada5431f0:
    claim:
      about:
        disease:
          name: Antley-Bixler Syndrome, FGFR2-Related
          disease_term:
            preferred_term: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
            term:
              id: MONDO:0020667
              label: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FGFR2 IgIII Cysteine-Creating Activation
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Constitutive FGFR Activation
        description: 'A de novo heterozygous FGFR2 p.Ser351Cys substitution in the third immunoglobulin-like
          (IgIII) domain. Introducing an unpaired cysteine into the extracellular domain permits intermolecular
          disulfide bonding between receptor monomers and hence ligand-independent constitutive activation
          — the same activation class as Beare-Stevenson p.Tyr375Cys and the extracellular-cysteine alleles
          of Crouzon syndrome and thanatophoric dysplasia type 1. This is what qualifies the disorder
          for the FGFR gain-of-function grouping, and it is the one thing about this entry that is not
          in dispute.

          '
        gene:
          preferred_term: FGFR2
          description: Fibroblast growth factor receptor 2, constitutively activated by a cysteine-creating
            IgIII-domain substitution.
          modifier: GAIN_OF_FUNCTION
          term:
            id: hgnc:3689
            label: FGFR2
        molecular_functions:
        - preferred_term: transmembrane receptor protein tyrosine kinase activity
          term:
            id: GO:0004714
            label: transmembrane receptor protein tyrosine kinase activity
          modifier: INCREASED
      selected_evidence:
        snippet: The patient was found to be heterozygous for a C-->G transversion at nucleotide 1064,
          which predicts a Ser351Cys amino acid substitution in the IgIII domain of FGFR2.
        supports: SUPPORT
