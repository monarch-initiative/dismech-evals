        description: Focus formation tested FGFR2 extracellular domains fused to the Neu transmembrane
          and kinase domains. Three to five experiments per construct used activated Neu as a normalization
          comparator. The transforming output belongs to this artificial reporter, not native FGFR2 kinase
          or an osteogenic differentiation assay. Removing both IgIII cysteines suppressed transformation
          by W290G/T341P constructs. No S351C, cranial suture or clinical rescue experiment was reported.
        modeled_mechanisms:
        - target: Aberrant FGFR2 Disulfide Dimerization
          relationship: PERTURBS
          fidelity: LOW
          model_scale: CELLULAR
          description: Removing the two IgIII cysteines abolishes the transforming activity of related
            mutant extracellular domains in an artificial FGFR2/Neu reporter. This perturbation supports
            cysteine dependence, with dimer formation measured separately in full-length COS-1 receptors.
          limitations: Focus formation is a downstream reporter phenotype rather than a direct dimerization
            readout. The kinase/transmembrane domains are Neu, p.Ser351Cys was not tested, and no cranial
            differentiation or clinical rescue was measured.
      selected_evidence:
        snippet: Chimeric FGFR2/Neu receptors (Fig.1), containing the FGFR2 extracellular domain fused
          to the transmembrane and kinase domains of Neu, allow the extent of activation to be assayed
          through focus formation using the intracellular domain of Neu as a reporter
