        discussion_id: gap_abs_fgfr2_distinct_entity_status
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the Antley–Bixler label identify a distinct FGFR2 phenotype?
        attaches_to:
        - genetic#FGFR2 extracellular variants
        rationale: The same S351C allele appears under Antley–Bixler, Pfeiffer and Crouzon labels. Elbow
          ankylosis is not unique to the ABS label, and contractures need not represent bony fusion. Nomenclature
          proposals differ over whether ABS should be reserved for POR deficiency. This entry retains
          the existing MONDO concept without treating the clinical labels as distinct molecular mechanisms.
          A genotype-stratified comparison should deduplicate re-reported patients and record radiographic
          joint anatomy.
      selected_evidence:
        snippet: The mutation identified in our patient, Ser351Cys in FGFR2, represents the first reported
          cause of Pfeiffer syndrome type III.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
