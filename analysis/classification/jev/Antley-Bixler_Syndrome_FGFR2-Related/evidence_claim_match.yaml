        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cranial Suture and Joint Osteogenic Dysregulation
        biological_scale: TISSUE
        conforms_to: fgfr_gain_of_function_skeletal_dysplasia#Cranial Suture Osteogenic Acceleration
        description: 'Accelerated osteogenic differentiation in suture mesenchyme, together with abnormal
          ossification at developing joints. The joint arm is what distinguishes this phenotype from the
          other FGFR2 craniosynostoses: the same receptor lesion that fuses cranial sutures also produces
          bony fusion across the elbow, so synostosis of cranial sutures and of the elbow joint were together
          the original minimal diagnostic criteria for the syndrome.

          '
        cell_types:
        - preferred_term: Osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: osteoblast differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: The Antley-Bixler syndrome (ABS) is a rare syndrome with synostosis of cranial sutures
          and elbow joints as minimal diagnostic criteria.
        supports: SUPPORT
