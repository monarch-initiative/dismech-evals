  d07bc4adfd529f1559ec6a34d8ae41fd08bab28220718862e50aa5dd945e21a5:
    claim:
      about:
        disease:
          name: Antley-Bixler Syndrome, FGFR2-Related
          disease_term:
            preferred_term: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
            term:
              id: MONDO:0020667
              label: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_abs_fgfr2_distinct_entity_status
        prompt: Is FGFR2-related Antley-Bixler syndrome a distinct disease entity, or a severe variant
          of the FGFR2 craniosynostosis syndromes that happens to carry a separate eponym?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#FGFR2 IgIII Cysteine-Creating Activation
        - pathophysiology#Cranial Suture and Joint Osteogenic Dysregulation
        rationale: 'The entity status is disputed in the published record and this entry does not resolve
          it. The first FGFR2 case (Chun et al. 1998) drew two rebuttals in the same journal arguing the
          patient did not have Antley-Bixler syndrome — "Patient described by Chun et al. may not present
          Antley-Bixler syndrome" (PMID:10076886) and "Not Antley-Bixler syndrome" (PMID:10076887); neither
          caches with an abstract, so neither can be quoted here, and both are cited in prose only. Cragun
          et al. (PMID:16145814) subsequently concluded that ABS without disordered steroidogenesis appears
          to be a variant of the FGFR-related craniosynostosis syndromes, and argued the ABS name should
          be reserved for the POR form — the opposite of the convention MONDO:0020667 encodes and that
          this entry follows. Compounding it, the same FGFR2 p.Ser351Cys allele is reported under the
          Pfeiffer label by independent groups across twenty-five years, so genotype does not discriminate:
          Pulleyn et al. 1996 (PMID:8946174) found it in a craniosynostosis-spectrum series two years
          before the Antley-Bixler report, Gripp et al. 1998 (PMID:9714439) called it the first reported
          cause of Pfeiffer syndrome type III, and Danso et al. 2021 (PMID:34909104) diagnosed a carrier
          as Pfeiffer syndrome type 3. Three things would be needed to settle this and none exists: a
          genotype-stratified phenotype comparison of p.Ser351Cys carriers labelled Antley-Bixler against
          those labelled Pfeiffer; agreement on whether humeroradial synostosis is a discriminating feature
          or a severity marker within the FGFR2 spectrum; and a nomenclature decision that the field has
          not made. Note what is NOT in dispute: the receptor mechanism. A future decision that this is
          not a separate entity would be a lump into Pfeiffer syndrome or a broader FGFR2 craniosynostosis
          concept — it would not remove the disorder from the FGFR gain-of-function grouping.'
        proposed_experiments:
        - experiment_id: exp_abs_fgfr2_vs_pfeiffer_phenotype_comparison
          name: Genotype-stratified comparison of FGFR2 p.Ser351Cys carriers
          description: Assemble all reported p.Ser351Cys carriers regardless of the syndrome label applied
            and compare skeletal, craniofacial and joint features. If carriers labelled Antley-Bixler
            and carriers labelled severe Pfeiffer are phenotypically indistinguishable, the eponym is
            not tracking biology.
        - experiment_id: exp_abs_humeroradial_synostosis_specificity
          name: Frequency of humeroradial synostosis across FGFR2 craniosynostosis genotypes
          description: Determine how often elbow fusion occurs in FGFR2 craniosynostosis syndromes other
            than Antley-Bixler. If it is a severity marker rather than a discriminating feature, the case
            for a separate entity weakens further.
      selected_evidence:
        snippet: in the scientific literature is genetically heterogeneous with at least two distinct
          disorders, (1) ABS without disordered steroidogenesis, which appears to be a variant of the
          autosomal dominant fibroblast growth factor receptor (FGFR)
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
