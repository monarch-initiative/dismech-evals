            term:
              id: MONDO:0020667
              label: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Autosomal dominant, reported as a de novo variant. This is itself a point of historical
          interest: Antley-Bixler syndrome had been assumed autosomal recessive on the basis of sib recurrence
          and consanguineous parents, and the first FGFR2 case was explicitly reported as an apparent
          dominant de novo exception. That apparent contradiction is now understood as the two-disorder
          split — the recessive pedigrees belong to the POR form.

          '
      selected_evidence:
        snippet: The inheritance has been suggested to be autosomal recessive based on two families with
          sib recurrence with both sexes being affected, and two cases born to consanguineous parents.
          We report the first case of ABS associated with an apparent dominant de novo mutation in the
          fibroblast growth factor receptor 2 (FGFR2) gene.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9605588
      reference_title: FGFR2 mutation associated with clinical manifestations consistent with Antley-Bixler
        syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Records both the prior recessive assumption and the dominant de novo FGFR2 case that
        first separated the two forms.
