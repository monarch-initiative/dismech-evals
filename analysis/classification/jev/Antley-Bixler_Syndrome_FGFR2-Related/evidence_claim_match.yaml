        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_abs_allele_specific_function
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How directly does the disulfide-activation mechanism apply to S351C?
        attaches_to:
        - pathophysiology#Aberrant FGFR2 Disulfide Dimerization
        - pathophysiology#Increased FGFR2 Kinase Activity
        rationale: The human S351C report predicts aberrant disulfide bonding and altered ligand binding.
          The cited experiments directly demonstrate dimerization and kinase activation for other alleles,
          not S351C. Their telokin-based homology model is not a mutant FGFR2 crystal structure or direct
          bond map. Allele-specific dimerization, ligand dependence and kinase measurements, ideally with
          expression-matched controls, would strengthen the current class inference. Cranial osteogenic
          and joint-development effects require separate tissue-level testing.
      selected_evidence:
        snippet: All three cases were found to have the same FGFR2 Ser351Cys (1231C to G) mutation predicted
          to form an aberrant disulfide bond(s) and affect ligand binding.
        supports: SUPPORT
        directness: INDIRECT
