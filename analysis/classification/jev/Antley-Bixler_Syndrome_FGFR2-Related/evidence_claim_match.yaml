  d94c7d9151b463fab7f8814c1a32dacf0672689ff3c61ecd5727b6b049e0ce61:
    claim:
      about:
        disease:
          name: Antley-Bixler Syndrome, FGFR2-Related
          disease_term:
            preferred_term: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
            term:
              id: MONDO:0020667
              label: Antley-Bixler syndrome without genital anomalies or disordered steroidogenesis
        context: []
      assertion_type: Treatment
      assertion:
        name: Staged craniofacial and airway management
        action_category: THERAPEUTIC
        therapeutic_modality: SURGERY
        description: 'No disease-modifying therapy exists. Management follows the pattern of the other
          severe FGFR2 craniosynostoses — airway securing in the neonate given the combination of midface
          hypoplasia and choanal narrowing, then staged cranial vault and midface procedures. The fused
          elbows and joint contractures add an orthopaedic and rehabilitation dimension the purely craniofacial
          FGFR2 syndromes do not have, and they are not correctable by the craniofacial pathway.

          '
        treatment_term:
          preferred_term: Craniofacial surgery
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        notes: treatment_term is left at the generic Surgical Procedure deliberately. This entry curates
          a staged multi-compartment management program - neonatal airway securing, then cranial vault
          procedures, then midface advancement, alongside orthopedic management of the synostosed elbows
          - not a single operation. NCIT:C15214 Craniotomy would name only the vault component and would
          misdescribe the airway, midface and limb arms. Splitting this into per-compartment treatments,
          each separately bound, is the right long-term fix and is deferred rather than done here.
        target_phenotypes:
        - preferred_term: Craniosynostosis
          term:
            id: HP:0001363
            label: Craniosynostosis
        - preferred_term: Midface retrusion
          term:
            id: HP:0011800
            label: Midface retrusion
      selected_evidence:
        snippet: We report a series of 4 patients with ABS and review their main findings and management.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20818252
      reference_title: Spectrum of Antley-Bixler syndrome.
