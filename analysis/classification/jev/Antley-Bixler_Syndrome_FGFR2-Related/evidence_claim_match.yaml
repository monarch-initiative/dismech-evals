      - /disease_term
    evidence_metadata:
      reference: PMID:9605588
      reference_title: FGFR2 mutation associated with clinical manifestations consistent with Antley-Bixler
        syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Records both the prior recessive assumption and the dominant de novo FGFR2 case that
        first separated the two forms.
