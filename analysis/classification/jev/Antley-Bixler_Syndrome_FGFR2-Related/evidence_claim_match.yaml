        name: Multidisciplinary surveillance
        description: Monitor head growth and symptoms of raised intracranial pressure, with frequent assessment
          in infancy and at least annual ophthalmological evaluation. Evaluate hearing, dentition, speech
          and development. The 2020 craniosynostosis guideline recommends annual type 1 polysomnography
          through at least age six for syndromic children, in addition to symptom-triggered assessment.
          Surgical and anesthetic planning should consider airway anatomy, possible cervical anomalies
          and eye protection.
        action_category: MONITORING
