        - path: /pathophysiology/0
          value:
            name: ROBO4 Loss of Function
            description: Heterozygous germline ROBO4 variants reduce or structurally disrupt the endothelial
              ROBO4 receptor. The family 1 splice-donor variant causes in-frame skipping of exon 13, removing
              36 amino acids from the intracellular domain; the family 2 missense variant p.Arg64Cys changes
              a conserved residue in the first extracellular Ig-like domain. Silencing and mutant-expression
              experiments point to loss of function, by haploinsufficiency or an antimorphic effect of
              mutant protein, as the pathogenic mechanism.
            biological_scale: MOLECULAR
            genes:
            - preferred_term: ROBO4
              modifier: DECREASED
              term:
                id: hgnc:17985
                label: ROBO4
            molecular_functions:
            - preferred_term: ROBO4 endothelial receptor activity
              term:
                id: GO:0038023
                label: signaling receptor activity
            notes: The molecular function is bound without a modifier. The discovery paper found the familial
              missense variants spread along the whole protein and argues against loss of any domain-specific
              function (dimerization, partner binding, SLIT recruitment), so which aspect of ROBO4 receptor
              activity the variants reduce has not been established. GO:0038023 is the curated GO molecular
              function for ROBO4 (Q8WZ75).
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Abnormal Aortic Valve Development
        description: Loss of Robo4 in mice produces aortic valve thickening, bicuspid valves and valve
          dysfunction. The intervening developmental steps were not studied; ROBO4 is expressed in the
          endocardial cushions where the valve forms.
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
      selected_evidence:
        snippet: Homozygous Robo4tm1Lex/tm1Lex knockout mice exhibited a complex cardiovascular phenotype
          that includes a combination of aortic valve thickening with or without BAV, aortic valve stenosis
          and/or regurgitation and/or AscAA.
        supports: SUPPORT
