      assertion_type: Pathophysiology
      assertion:
        name: Mesenchymal Shift of Aortic Endothelial Cells
        description: 'ROBO4-deficient aortic endothelial cells express alpha-smooth muscle actin and SNAI1,
          elongate and invade collagen gels, a pattern the authors read as suggestive of endothelial-to-mesenchymal
          transition. In the patient''s aneurysm, ROBO4-positive cells co-staining for alpha-smooth muscle
          actin were found in the aortic media. No single signaling pathway was identified: ROBO4 silencing
          gave a modest decline in BMP and Notch target-gene expression without altered TGF-beta responses.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: aortic endothelial cell
          term:
            id: CL:0002544
            label: aortic endothelial cell
        notes: No biological_processes binding. GO searched through ols:go with the queries "endothelial
          to mesenchymal" and "endothelial-mesenchymal"; both returned only GO:0140074 cardiac endothelial
          to mesenchymal transition and its three regulation terms. The cells studied were aortic endothelium,
          not cardiac endothelium, so the cardiac term would overstate the claim.
      selected_evidence:
        snippet: Together, these results suggest that reduction or structural disruption of ROBO4 compromises
          endothelial identity and performance, as well as its capacity to suppress transition to a mesenchymal
          invasive character and synthetic repertoire.
        supports: SUPPORT
    origin:
