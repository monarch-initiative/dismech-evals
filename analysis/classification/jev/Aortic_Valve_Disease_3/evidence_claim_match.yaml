  f102ada311c57661beafdc122a4bba7f7519cb0b804400ab1ef056697cb88ff2:
    claim:
      about:
        disease:
          name: Aortic Valve Disease 3
          disease_term:
            preferred_term: aortic valve disease 3
            term:
              id: MONDO:0032783
              label: aortic valve disease 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ROBO4 Loss of Function
        description: Heterozygous germline ROBO4 variants reduce or structurally disrupt the endothelial
          ROBO4 receptor. The family 1 splice-donor variant causes in-frame skipping of exon 13, removing
          36 amino acids from the intracellular domain; the family 2 missense variant p.Arg64Cys changes
          a conserved residue in the first extracellular Ig-like domain. Silencing and mutant-expression
          experiments point to loss of function, by haploinsufficiency or an antimorphic effect of mutant
          protein, as the pathogenic mechanism.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ROBO4
          modifier: DECREASED
          term:
            id: hgnc:17985
            label: ROBO4
        molecular_functions:
        - preferred_term: ROBO4 endothelial receptor activity
          term:
            id: GO:0038023
            label: signaling receptor activity
        notes: The molecular function is bound without a modifier. The discovery paper found the familial
          missense variants spread along the whole protein and argues against loss of any domain-specific
          function (dimerization, partner binding, SLIT recruitment), so which aspect of ROBO4 receptor
          activity the variants reduce has not been established. GO:0038023 is the curated GO molecular
          function for ROBO4 (Q8WZ75).
      selected_evidence:
        snippet: These data suggest that loss-of-function (by functional haploinsufficiency or the antimorphic
          effects of overexpressed mutant protein) is the relevant pathogenic mechanism.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30455415
      reference_title: ROBO4 variants predispose individuals to bicuspid aortic valve and thoracic aortic
        aneurysm.
      evidence_source: IN_VITRO
      explanation: The authors' conclusion from the cultured endothelial-cell experiments that the variants
        act through loss of function.
