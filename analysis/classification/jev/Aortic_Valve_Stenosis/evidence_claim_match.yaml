        - pathophysiology#Valvular Osteogenic Program
        - clinical_trials#NCT02132026
        rationale: Null statin-based trials in established stenosis do not prove that lipids are irrelevant
          to initiation or that osteogenic commitment makes the lesion autonomous. SALTIRE2 did not show
          imaging benefit from denosumab or alendronic acid in its mostly mild/moderate cohort despite
          lower bone-turnover markers. Its interventions, species context and disease timing differ from
          the OPG mouse experiment. Selective Lp(a) lowering remains under prospective evaluation; genetic
          evidence alone does not establish efficacy.
