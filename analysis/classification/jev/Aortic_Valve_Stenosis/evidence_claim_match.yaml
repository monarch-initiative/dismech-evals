      assertion_type: Discussion
      assertion:
        discussion_id: as_gwas_candidates
        prompt: Which statistically nominated susceptibility genes are causal in valve cells?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#TWIST1
        - genetic#PALMD
        - genetic#NAV1
        rationale: European-ancestry GWAS, valve eQTL, colocalization and Mendelian randomization prioritize
          expression candidates, but selected surgical bulk tissue and instrumental-variable assumptions
          limit mechanistic inference. TWIST1 genotype-stratified RNA sequencing compared already severe-stenosis
          cases, rather than perturbing TWIST1 or measuring endothelial-to-mesenchymal conversion. Candidate
          genes require cell-specific functional validation; neither genetic overlap nor pathway enrichment
          proves a causal comorbidity.
      selected_evidence:
        snippet: After removing genes with a low probability for colocalization of the GWAS and eQTL signals
          (PP4 < 0.75, n = 20), with no MR instrument (n = 3) or with high heterogeneity of the instrument
          (n = 2), ten genes remained (PALMD, NAV1, PRRX1, ATP13A3, BCL10, TWIST1, RAD9A, NRBP1, FES and
          AFAP1).
        supports: SUPPORT
        directness: INDIRECT
    origin:
