              id: MONDO:0042981
              label: aortic valve stenosis
        context: []
      assertion_type: Treatment
      assertion:
        name: Early intervention in selected asymptomatic severe disease
        description: The 2025 guideline supports intervention as an alternative to close surveillance
          in asymptomatic severe high-gradient stenosis with ejection fraction ≥50% and low procedural
          risk (Class IIa, A). Ejection fraction <50% without another cause is a Class I indication. Very
          severe hemodynamics, rapid progression with heavy calcification, markedly elevated natriuretic
          peptides or abnormal exercise blood pressure strengthen selection. Trials differ in age, valve
          anatomy, fibrosis enrichment, procedures and outcome definitions; there is no uniform mortality
          benefit across all asymptomatic populations.
        treatment_term:
          preferred_term: Aortic Valve Replacement
          term:
            id: NCIT:C50815
            label: Aortic Valve Replacement
      selected_evidence:
        snippet: Intervention is recommended in asymptomatic patients with severe AS and LVEF <50% without
          another cause.
        supports: SUPPORT
