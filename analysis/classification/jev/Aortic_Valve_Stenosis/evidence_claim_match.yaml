  219805bcf8658ade91042497fc64a322902e7c48a925facffbfee79e8660e7cd:
    claim:
      about:
        disease:
          name: Aortic Valve Stenosis
          disease_term:
            preferred_term: aortic valve stenosis
            term:
              id: MONDO:0042981
              label: aortic valve stenosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: as_calcification_function_mediation
        prompt: Which processes mediate valve dysfunction in experimental anti-calcification interventions?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Aortic Leaflet Calcification
        - animal_models#Osteoprotegerin-treated Western-diet LA mouse
        - animal_models#Notch1-haploinsufficient mouse with Htr2b perturbation
        rationale: OPG reduces calcification and partly preserves older-mouse valve function without reducing
          fibrosis, lipids or superoxide. This coresponse does not isolate calcification as the mediator.
          Htr2b deletion improves hemodynamics without significant measured fibrosis or osteogenic-marker
          changes, while its tested antagonist regimen is negative. Cell-specific and temporally controlled
          perturbations with mechanical and tissue readouts are needed before assigning one necessary
          pathway.
      selected_evidence:
        snippet: 5-HT2B receptor antagonism, however, did not affect hemodynamic progression.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33237915
      reference_title: Genetic ablation of serotonin receptor 2B improves aortic valve hemodynamics of
        Notch1 heterozygous mice in a high-cholesterol diet model.
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      explanation: The tested SB204741 regimen was negative; lifelong gene deletion and pharmacologic
        treatment are not equivalent.
