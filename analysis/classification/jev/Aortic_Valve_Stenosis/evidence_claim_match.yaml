  03ac54a194734b3e32b89c656ac9703728265a0f4af82a55f6dcb10f41493125:
    claim:
      about:
        disease:
          name: Aortic Valve Stenosis
          disease_term:
            preferred_term: aortic valve stenosis
            term:
              id: MONDO:0042981
              label: aortic valve stenosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: as_medical_modification
        prompt: Why have mechanistically motivated medical therapies not yet modified established valve
          disease in trials?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Valvular Lipid Accumulation
        - pathophysiology#Valvular Osteogenic Program
        - clinical_trials#NCT02132026
        rationale: Null statin-based trials in established stenosis do not prove that lipids are irrelevant
          to initiation or that osteogenic commitment makes the lesion autonomous. SALTIRE2 did not show
          imaging benefit from denosumab or alendronic acid in its mostly mild/moderate cohort despite
          lower bone-turnover markers. Its interventions, species context and disease timing differ from
          the OPG mouse experiment. Selective Lp(a) lowering remains under prospective evaluation; genetic
          evidence alone does not establish efficacy.
      selected_evidence:
        snippet: Intensive lipid-lowering therapy does not halt the progression of calcific aortic stenosis
          or induce its regression.
        supports: SUPPORT
