        description: EVOLVED analyzed 224 fibrosis-enriched asymptomatic severe-AS patients of 356 planned.
          Early intervention versus guideline-directed care did not significantly reduce the primary death/AS-hospitalization
          composite (20/113 versus 25/111; HR 0.79, 95% CI 0.44–1.43). Median intervention timing was
          5 versus 20.2 months. Hospitalization and symptom secondary findings were unadjusted for multiplicity
          and remain hypothesis-generating; the trial does not establish equivalence or a fibrosis-selection
          threshold. The registry remains active for longer follow-up.
        notes: Status and phase checked on 2026-09-21. Published analysis size is distinguished from registry
          planned enrollment and subsequent extension.
