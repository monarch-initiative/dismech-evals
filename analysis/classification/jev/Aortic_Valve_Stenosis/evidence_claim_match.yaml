      assertion_type: Treatment
      assertion:
        name: Active surveillance and symptom education
        description: For patients managed without immediate intervention, educate patients and caregivers
          to report symptoms promptly and reassess severity and ventricular function. The 2025 guideline
          recommends at least six-monthly follow-up for asymptomatic severe disease, annual reassessment
          for moderate degenerative stenosis, and potentially two- to three-year intervals for younger
          patients with mild disease and little leaflet calcium. New symptoms prompt earlier reassessment.
      selected_evidence:
        snippet: Asymptomatic pa- tients with severe AS should be followed up at least every 6 months
          to allow detection of early symptoms
        supports: SUPPORT
