  1a85955658f002a7066408d91a3c12113a4817c31105978cc8aff80ec3c3916a:
    claim:
      about:
        disease:
          name: Aortic Valve Stenosis
          disease_term:
            preferred_term: aortic valve stenosis
            term:
              id: MONDO:0042981
              label: aortic valve stenosis
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Osteoprotegerin-treated Western-diet LA mouse
        species: Mouse
        genotype: Ldlr-null; Apob100/100
        publication: PMID:23762316
        description: Exogenous osteoprotegerin reduced valve calcification and osteogenic markers in Western-diet
          LA mice; older mice also had partial preservation of cusp separation. These findings inform
          experimental intervention, not established clinical treatment.
        notes: Treatment began before overt disease; young mice were treated from 2 to 8 months and older
          mice from 6 to 12 months, with 12 planned per group and assay-specific subsets. Lipid deposition,
          fibrosis and superoxide were not reduced. Young-mouse function showed only a nonsignificant
          trend. Parallel improvements in calcification and function do not establish that one mediates
          the other.
        modeled_mechanisms:
        - target: Aortic Leaflet Calcification
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: TISSUE
          description: OPG reduced valve calcium deposition.
          limitations: Treatment began before overt disease; young mice were treated from 2 to 8 months
            and older mice from 6 to 12 months, with 12 planned per group and assay-specific subsets.
            Lipid deposition, fibrosis and superoxide were not reduced. Young-mouse function showed only
            a nonsignificant trend. Parallel improvements in calcification and function do not establish
            that one mediates the other.
          readouts:
          - name: Valve calcium deposition
            target: Aortic Leaflet Calcification
            direction: DECREASED
            interpretation: OPG reduced valve calcium deposition.
        - target: Reduced Aortic Valve Opening
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: TISSUE
          description: Cusp separation declined less under OPG in the older cohort.
          limitations: Treatment began before overt disease; young mice were treated from 2 to 8 months
            and older mice from 6 to 12 months, with 12 planned per group and assay-specific subsets.
            Lipid deposition, fibrosis and superoxide were not reduced. Young-mouse function showed only
            a nonsignificant trend. Parallel improvements in calcification and function do not establish
            that one mediates the other.
          readouts:
          - name: Preservation of systolic cusp separation
            target: Reduced Aortic Valve Opening
            direction: INCREASED
            interpretation: Cusp separation declined less under OPG in the older cohort.
      selected_evidence:
        snippet: OPG attenuated calcification of valve tissue in Young mice and in Older mice by about
          70% (Figure 4).
        supports: SUPPORT
