      assertion_type: Subtype
      assertion:
        name: Congenital valve-associated stenosis
        description: Bicuspid or unicuspid anatomy can cause valvular obstruction and predispose to later
          calcification. Bicuspid valves may coexist with aortopathy; only a minority of familial disease
          is explained by recognized NOTCH1 variants.
      selected_evidence:
        snippet: Etiologies include congenital (bicuspid/unicuspid), calcific, and rheumatic disease.
        supports: SUPPORT
