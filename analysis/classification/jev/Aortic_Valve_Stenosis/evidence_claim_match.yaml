            description: Exogenous osteoprotegerin reduced valve calcification and osteogenic markers
              in Western-diet LA mice; older mice also had partial preservation of cusp separation. These
              findings inform experimental intervention, not established clinical treatment.
            notes: Treatment began before overt disease; young mice were treated from 2 to 8 months and
              older mice from 6 to 12 months, with 12 planned per group and assay-specific subsets. Lipid
              deposition, fibrosis and superoxide were not reduced. Young-mouse function showed only a
              nonsignificant trend. Parallel improvements in calcification and function do not establish
              that one mediates the other.
