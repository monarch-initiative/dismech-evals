              label: aortic valve stenosis
        context: []
      assertion_type: Genetic
      assertion:
        name: ATP13A3
        gene_term:
          preferred_term: ATP13A3
          term:
            id: hgnc:24113
            label: ATP13A3
        relationship_type: SUSCEPTIBILITY
        notes: Candidate expression-mediated susceptibility from 2024 GWAS, valve eQTL, colocalization
          and Mendelian randomization. The study associated higher valve expression with risk; this is
          statistical nomination, not a patient pathogenic-variant series or gene perturbation/rescue.
          The GWAS included 14,819 cases and 927,044 European-ancestry controls; 484 selected surgical/transplant
          valve samples passed expression QC. Bulk tissue, ancestry restriction and instrument assumptions
          limit interpretation.
      selected_evidence:
        snippet: After removing genes with a low probability for colocalization of the GWAS and eQTL signals
          (PP4 < 0.75, n = 20), with no MR instrument (n = 3) or with high heterogeneity of the instrument
          (n = 2), ten genes remained (PALMD, NAV1, PRRX1, ATP13A3, BCL10, TWIST1, RAD9A, NRBP1, FES and
          AFAP1).
        supports: SUPPORT
        directness: INDIRECT
    origin:
