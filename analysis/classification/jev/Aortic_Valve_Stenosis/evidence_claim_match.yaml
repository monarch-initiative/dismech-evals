              label: aortic valve stenosis
        context: []
      assertion_type: Genetic
      assertion:
        name: NOTCH1
        gene_term:
          preferred_term: NOTCH1
          term:
            id: hgnc:7881
            label: NOTCH1
        relationship_type: CAUSATIVE
        notes: Rare loss-of-function variants cause familial aortic valve developmental anomalies and
          calcification. A 2022 sequencing/systematic study found a pathogenic variant in one of eight
          recruited pedigrees and none in 381 sporadic BAV patients. Its approximately 2% familial and
          <0.1% sporadic literature estimates use heterogeneous congenital-heart-disease denominators,
          mainly of White ancestry; they are not population fractions of all aortic stenosis. Incomplete
          penetrance and uncertain variants remain important.
      selected_evidence:
        snippet: mutations in the signalling and transcriptional regulator NOTCH1 cause a spectrum of
          developmental aortic valve anomalies and severe valve calcification in non-syndromic autosomal-dominant
          human pedigrees.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/1
      evidence_path: /genetic/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16025100
      reference_title: Mutations in NOTCH1 cause aortic valve disease.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes NOTCH1 as a causal gene for human aortic valve disease.
      quote_role: PRIMARY_RESULT
