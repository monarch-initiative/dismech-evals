      assertion_type: Genetic
      assertion:
        name: LPA
        gene_term:
          preferred_term: LPA
          term:
            id: hgnc:6667
            label: LPA
        relationship_type: SUSCEPTIBILITY
        notes: LPA rs10455872 was associated with CT-detected aortic valve calcium in a 6,942-person European-ancestry
          discovery analysis, with separate prospective clinical-stenosis associations. Replication was
          positive in several ancestry groups but not significant in the small Chinese-American analysis.
          Mendelian randomization supports a causal contribution of circulating Lp(a) under instrument
          assumptions; it does not demonstrate drug efficacy or a resolved molecular pathway.
      selected_evidence:
        snippet: One SNP in the lipoprotein(a) (LPA) locus (rs10455872) reached genomewide significance
          for the presence of aortic-valve calcification
        supports: SUPPORT
