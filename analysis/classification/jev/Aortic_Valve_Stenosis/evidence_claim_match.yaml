      assertion_type: Treatment
      assertion:
        name: Balloon aortic valvotomy as a bridge
        description: In the adult severe-stenosis guideline, balloon valvotomy may be considered as a
          temporary bridge to SAVR or TAVI in hemodynamic instability or urgent high-risk noncardiac surgery
          (Class IIb, C). Benefits are limited and severe regurgitation is a risk; it is not a durable
          substitute for replacement in calcific adult disease. Pediatric congenital-valve decisions require
          their own clinical context.
      selected_evidence:
        snippet: Balloon aortic valvotomy may be considered as a bridge to SAVR or TAVI in haemodynamically
          unstable patients, and (if feasible) in those with severe AS who require urgent high-risk NCS.
        supports: SUPPORT
