      assertion_type: AnimalModel
      assertion:
        species: Mouse (Mus musculus)
        background: SCID mouse bearing a human temporal-artery xenograft
        description: Human temporal arteries with giant-cell arteritis remain inflamed after engraftment
          into SCID mice, enabling in-vivo study of vascular immune persistence and glucocorticoid response.
          The model uses temporal artery, not aorta, and does not reproduce systemic disease or chronic
          aortic remodeling and aneurysm formation.
        associated_phenotypes:
        - Persistent human arterial inflammation
        - Cytokine expression after glucocorticoid treatment
        modeled_mechanisms:
        - target: Immune-mediated aortic wall inflammation in large-vessel vasculitis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: The engrafted human artery keeps its giant-cell arteritic infiltrate alive in vivo,
            so the model captures the persistence of the immune lesion and its glucocorticoid response.
          limitations: The tissue is temporal artery, not aorta, and the model reproduces neither systemic
            disease nor the chronic aortic remodeling and aneurysm formation that dominate the clinical
            course, so it cannot be used to extrapolate to aortic outcomes.
      selected_evidence:
        snippet: GCA is self-sustained in temporal arteries engrafted into SCID mice, providing a model
          in which the mechanisms of action and limitations of glucocorticoid therapy can be examined
          in vivo.
        supports: SUPPORT
