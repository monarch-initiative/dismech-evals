        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: The newest long-term report traces only 24 UK patients first described in 1960. Its
          reassuring conclusion argues against assuming a markedly shortened lifespan or a syndrome-specific
          cancer predisposition in every affected person, but the small, historical cohort cannot precisely
          estimate current adult risks or subgroup effects.
