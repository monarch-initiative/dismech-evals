          ear and eyelid findings with less severe syndactyly.
        distinguishing_features:
        - Ptosis and characteristic ear anomalies favor Saethre-Chotzen syndrome over Apert syndrome.
        - Hand syndactyly is usually limited and variable rather than the severe complex fusion typical
          of Apert syndrome.
        disease_term:
          preferred_term: Saethre-Chotzen syndrome
          term:
            id: MONDO:0007042
            label: Saethre-Chotzen syndrome
      selected_evidence:
        snippet: Classic Saethre-Chotzen syndrome (SCS) is characterized by coronal synostosis (unilateral
          or bilateral), facial asymmetry (particularly in individuals with unicoronal synostosis), strabismus,
          ptosis, and characteristic appearance of the ear (small pinna with a prominent superior and/or
          inferior crus). Syndactyly of digits two and three of the hand is variably present.
        supports: SUPPORT
