      assertion_type: Definition
      assertion:
        name: Molecular diagnostic definition for Apert syndrome
        definition_type: DIAGNOSTIC_CRITERIA
        description: Practical diagnosis is based on the distinctive craniosynostosis-syndactyly phenotype
          with confirmatory identification of a recurrent activating FGFR2 variant, most often p.Ser252Trp
          or p.Pro253Arg.
        scope: Clinical recognition and molecular confirmation of suspected Apert syndrome
      selected_evidence:
        snippet: We have identified specific missense substitutions involving adjacent amino acids (Ser252Trp
          and Pro253Arg) in the linker between the second and third extracellular immunoglobulin (Ig)
          domains of fibroblast growth factor receptor 2 (FGFR2) in all 40 unrelated cases of Apert syndrome
          studied.
        supports: SUPPORT
