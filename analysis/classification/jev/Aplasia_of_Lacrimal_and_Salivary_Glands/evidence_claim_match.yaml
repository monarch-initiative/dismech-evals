        description: 'Mice heterozygous for an Fgf10 null allele have a phenotype similar to ALSG. Lacrimal
          gland primordia fail to form, submandibular glands are hypoplastic, and the Harderian gland
          is often degenerated or absent, frequently on one side.

          '
        modeled_mechanisms:
        - target: Failure of Lacrimal Gland Budding
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: TISSUE
          description: Heterozygotes lack lacrimal gland primordia, as patients lack the gland.
          limitations: The mouse main lacrimal gland is exorbital with a long excretory duct, unlike the
            human intraorbital gland, and a small fraction of heterozygous primordia still show budding
            at E15.5.
        - target: Impaired Salivary Gland Branching Morphogenesis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Heterozygotes have hypoplastic submandibular glands.
          limitations: Heterozygous mice show submandibular hypoplasia rather than the aplasia seen in
            many patients, and parotid development was not reported.
      selected_evidence:
        snippet: Fgf10(+/-) mice have a phenotype similar to ALSG, providing a model for this disorder.
        supports: SUPPORT
