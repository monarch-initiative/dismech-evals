        rationale: 'Both are autosomal dominant FGF10 haploinsufficiency disorders, and a mother with
          ALSG and her daughter with LADD syndrome carried the same nonsense allele, so the extra-glandular
          features cannot be predicted from the allele. Whether modifier loci, the residual activity of
          particular alleles, or chance decide whether ears, teeth and digits are affected has not been
          studied. The G138E allele has been reported both in an ALSG family and as a LADD-causing allele.

          '
      selected_evidence:
        snippet: A nonsense mutation was also found in exon 2 of FGF10 (Family 2) in a 19-year-old mother
          with ALSG and her 2-year-old daughter with LADD syndrome.
