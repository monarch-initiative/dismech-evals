  0f0e442ed135d8fd102c02d22f9037fade123d7fce408c43dd2bea89dbd42c80:
    claim:
      about:
        disease:
          name: Aplasia of Lacrimal and Salivary Glands
          disease_term:
            preferred_term: Aplasia of Lacrimal and Salivary Glands
            term:
              id: MONDO:0008397
              label: aplasia of lacrimal and salivary glands
        context: []
      assertion_type: Genetic
      assertion:
        name: FGF10
        notes: 'FGF10 (5p12) encodes fibroblast growth factor 10, the principal FGFR2b ligand in branching
          organogenesis. Reported ALSG alleles include nonsense (p.Trp79*), canonical splice-site (c.429+1G>T,
          c.430-1G>A, c.429+2T>A) and missense variants (R80S, G138E and several others), plus a heterozygous
          5p12 deletion spanning the gene. The same gene causes some cases of LADD syndrome and, with
          heterozygous loss of function, lethal lung developmental disorders and childhood interstitial
          lung disease; those are separate entities. No ClinGen gene-disease validity record for FGF10
          and ALSG was found in the local cache.

          '
        gene_term:
          preferred_term: FGF10
          term:
            id: hgnc:3666
            label: FGF10
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: We mapped ALSG to 5p13.2-5q13.1, which coincides with the gene fibroblast growth factor
          10 (FGF10). In two extended pedigrees, we identified heterozygous mutations in FGF10 in all
          individuals with ALSG.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
