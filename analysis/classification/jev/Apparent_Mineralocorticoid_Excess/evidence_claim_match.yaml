        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does the proposed nonclassic AME construct overlap with milder biallelic HSD11B2 disease?
        attaches_to:
        - genetic#HSD11B2
        - pathophysiology#Reduced 11-Beta-HSD2 Activity
        rationale: The 2020 review describes a broader partial-enzyme-deficiency construct involving genetic,
          epigenetic, environmental and inhibitor effects. This should not automatically be equated with
          genetically confirmed mild recessive AME. Its 7.1% estimate comes from a particular screening
          population and is not the prevalence of biallelic HSD11B2 disease. The screening construct used
          high serum cortisol/cortisone together with low cortisone in a selected Chilean population including
          normotensive and hypertensive people. Renin-guided outcome benefit is extrapolated from primary
          aldosteronism, not demonstrated prospectively in nonclassic AME.
      selected_evidence:
        snippet: Nonclassic AME (NC-AME) is mainly related to partial 11βHSD2 deficiency associated with
          genetic variations and epigenetic modifications (first hit) and potential additive actions of
          endogenous or exogenous inhibitors (ie, glycyrrhetinic acid-like factors [GALFS]) and other
          factors (ie, age, high sodium intake) (second hit).
        supports: SUPPORT
