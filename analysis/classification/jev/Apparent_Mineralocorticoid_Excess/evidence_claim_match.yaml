          enzyme assay, while the other two children carried variants classified likely pathogenic. The
          2026 child carried homozygous p.Arg208Cys; a single heterozygous UBE3B variant was incidental.
          Structural proposals in the 2017 study derive from homology modeling and molecular dynamics,
          not direct measurements of each patient variant. Genotype alone does not provide a validated
          individual severity prediction.
