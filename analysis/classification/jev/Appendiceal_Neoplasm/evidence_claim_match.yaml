        name: Mucinous Neoplasm
        display_name: Appendiceal mucinous neoplasm (LAMN/HAMN)
        description: Noninvasive mucinous epithelial neoplasm of the appendix, encompassing low-grade
          appendiceal mucinous neoplasm (LAMN) and high-grade appendiceal mucinous neoplasm (HAMN). Both
          lack infiltrative invasion; HAMN is distinguished from LAMN by high-grade cytologic atypia.
          These tumors are the usual origin of pseudomyxoma peritonei.
        subtype_term:
          preferred_term: appendix mucinous neoplasm
          term:
            id: NCIT:C170734
            label: Appendix Mucinous Neoplasm
        children:
        - LAMN
        - HAMN
      selected_evidence:
        snippet: Appendiceal mucinous tumors (AMTs) include low-grade mucinous appendiceal neoplasms (LAMNs),
          high-grade mucinous appendiceal neoplasms (HAMNs), and mucinous adenocarcinomas (MACs).
        supports: SUPPORT
