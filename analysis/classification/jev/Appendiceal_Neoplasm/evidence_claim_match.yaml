      assertion_type: Pathophysiology
      assertion:
        name: KRAS and GNAS Oncogenic Activation
        description: Appendiceal mucinous neoplasms are driven by activating somatic mutations in the
          KRAS oncogene (codons 12/13) and the GNAS oncogene (codon 201). KRAS activation engages downstream
          MAPK and PI3K signaling to drive proliferation and survival, while activating GNAS mutations
          constitutively activate the stimulatory G protein alpha subunit. In appendiceal mucinous tumors
          KRAS and GNAS mutations frequently co-occur, and GNAS is characteristically enriched in low-grade
          lesions.
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: intestinal epithelial cell (appendiceal mucinous epithelium)
          term:
            id: CL:0002563
            label: intestinal epithelial cell
        locations:
        - preferred_term: vermiform appendix
          term:
            id: UBERON:0001154
            label: vermiform appendix
        biological_processes:
        - preferred_term: Ras protein signal transduction
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0007265
            label: Ras protein signal transduction
        - preferred_term: adenylate cyclase-activating G protein-coupled receptor signaling pathway
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0007189
            label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
      selected_evidence:
        snippet: A mutational analysis identified activating GNAS mutations in 16 of 32 low-grade appendiceal
          mucinous neoplasms (LAMNs) but in none of three mucinous adenocarcinomas (MACs). KRAS mutations
          were found in 30 LAMNs and in all MACs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23403822
      reference_title: Frequent GNAS mutations in low-grade appendiceal mucinous neoplasms.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes activating KRAS and GNAS mutations as the characteristic genetic drivers
