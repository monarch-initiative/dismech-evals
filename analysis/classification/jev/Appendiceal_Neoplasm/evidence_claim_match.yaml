        name: Adenocarcinoma
        display_name: Appendiceal adenocarcinoma
        description: Invasive epithelial malignancy of the appendix, including conventional (colonic-type)
          adenocarcinoma, mucinous adenocarcinoma (infiltrative invasion with abundant extracellular mucin),
          and signet ring cell carcinoma. Defined by infiltrative invasion, distinguishing it from the
          noninvasive mucinous neoplasms. Molecularly resembles but is distinct from colorectal cancer,
          with frequent KRAS and lower APC mutation rates.
        subtype_term:
          preferred_term: appendix adenocarcinoma
          term:
            id: MONDO:0006087
            label: appendix adenocarcinoma
      selected_evidence:
        snippet: it was agreed that "mucinous adenocarcinoma" should be reserved for lesions with infiltrative
          invasion
        supports: SUPPORT
