      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acute Appendicitis
        description: Appendiceal neoplasms frequently present as, or are discovered during surgery for,
          presumed acute appendicitis. Distinguishing an incidental underlying neoplasm from uncomplicated
          appendicitis before surgery is imprecise.
        distinguishing_features:
        - Older age and larger sonographic appendiceal diameter raise suspicion for neoplasm.
        - Definitive distinction requires histopathologic examination of the resected specimen.
      selected_evidence:
        snippet: In multivariate analysis, age ≥ 50 years and a diameter of the appendix in the sonography
          ≥ 13 mm were independent risk factors predicting the presence of appendiceal neoplasm and malignancy.
        supports: SUPPORT
