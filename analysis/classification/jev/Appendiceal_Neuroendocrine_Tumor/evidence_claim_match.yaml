        phase: Rare regional or distant progression
        notes: Recurrence and disease-specific death are uncommon, but late recurrence can occur. Long-term
          follow-up is therefore selective rather than automatically intensive for every completely resected
          small tumor.
      selected_evidence:
        snippet: aNETs are indolent with very high rates of overall and relapse-free survival. Recurrence
          is rare, and in this series only occurred decades later, making a compelling case for selective
          surveillance and follow-up.
        supports: SUPPORT
