        phase: Incidental localized disease
        notes: Most appendiceal NETs are clinically silent and are discovered by pathologic examination
          after appendectomy, commonly performed for a clinical presentation attributed to appendicitis.
          The appendicitis presentation should not be treated as proof that the tumor caused the inflammation
          in every patient.
      selected_evidence:
        snippet: Most acute presentations are attributed clinically to appendicitis, with most cases detected
          incidentally on pathology after an appendectomy.
        supports: SUPPORT
