      assertion_type: DifferentialDiagnosis
      assertion:
        name: Goblet Cell Adenocarcinoma
        description: Goblet cell adenocarcinoma, historically called goblet cell carcinoid, is an amphicrine
          appendiceal epithelial malignancy with glandular and neuroendocrine differentiation. Despite
          historical terminology and partial neuroendocrine marker expression, it is not an appendiceal
          NET subtype.
        distinguishing_features:
        - Glandular or mucinous morphology with goblet-cell differentiation rather than a conventional
          well-differentiated NET pattern.
        - Staged and treated as an adenocarcinoma rather than as an appendiceal neuroendocrine tumor.
        - A mutational profile distinct from both appendiceal NET and conventional appendiceal adenocarcinoma
          in the available genomic series.
      selected_evidence:
        snippet: This limited series reveals mutations in SOX9, RHOA, and chromatin-modifier genes in
          goblet cell tumors, and shows that the mutational profile of GCC/GCC-AC is distinct from NET
          and conventional appendiceal AC.
        supports: SUPPORT
