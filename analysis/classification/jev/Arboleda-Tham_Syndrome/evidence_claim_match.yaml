            name: KAT6A-RSPO2-Wnt Hippocampal Signaling Deficit
            description: In a mouse model, KAT6A deficiency lowers transcription of the CA3-enriched Wnt
              activator R-spondin 2 (RSPO2), impairing canonical Wnt signaling and synaptic structure
              and plasticity in hippocampal CA3 pyramidal neurons and producing memory deficits. Restoring
              RSPO2 in CA3 neurons rescues Wnt signaling and learning behaviors, nominating this axis
              as a candidate therapeutic target. This mechanism is currently established only in mice;
              its fidelity to human KAT6A-syndrome cognition is unproven.
            biological_scale: CELLULAR
            mechanism_confidence: PROVISIONAL
            cell_types:
