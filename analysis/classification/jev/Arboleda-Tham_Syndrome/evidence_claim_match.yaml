        presence: Positive
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Heterozygous pathogenic KAT6A variants are usually de novo and predominantly protein-truncating
          (nonsense or frameshift), with recurrent hotspots in the arginine-rich acidic domain (amino
          acid positions 1019, 1024, 1129). Variant position drives an allele-dependent molecular consequence:
          early-truncating variants (exons 1-15) are predicted to trigger NMD and haploinsufficiency and
          are associated with milder disease, whereas late-truncating variants (exons 16-17) escape NMD
          and are associated with more severe disease. Missense variants are reported but require variant-specific
          functional evidence.'
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: Arboleda-Tham syndrome is autosomal dominant and almost always caused by a de novo
            KAT6A variant.
      selected_evidence:
        snippet: Our analysis identifies hotspot nonsense mutations within the penultimate exons at amino
          acid positions 1019, 1024, and 1129 that account for 19.1% (13/68) of pathogenic variants in
          unrelated individuals.
        supports: SUPPORT
