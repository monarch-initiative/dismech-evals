        prompt: Do late-truncating KAT6A alleles that escape nonsense-mediated decay act through a dysfunctional
          protein with gain-of-function or dominant-negative activity, or is Arboleda-Tham syndrome a
          haploinsufficiency disorder across the whole allelic series with position effects explained
          by residual dosage?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Heterozygous KAT6A Pathogenic Variation
        - pathophysiology#NMD-Mediated KAT6A Haploinsufficiency
        - pathophysiology#NMD-Escaping Dysfunctional KAT6A Protein
        - mechanistic_hypotheses#early_truncating_nmd_haploinsufficiency
        - mechanistic_hypotheses#late_truncating_nmd_escape
        posed_by: claude-code
        posed_date: '2026-09-05T00:00:00Z'
        rationale: The genotype-phenotype correlation (late truncations more severe) and patient-cell
          multi-omics showing HOXC derepression point toward an active truncated protein, while the earliest
          truncations behave as nulls and a heterozygous Kat6a null mouse reproduces core behavioural
          features. Neither truncated protein in patient cells nor a same-background comparison of early,
          late and null alleles has been published, so the variant's functional_impact_category is UNKNOWN
          and the two hypotheses are kept as separate branches.
        proposed_experiments:
        - experiment_id: exp_arths_truncation_position_isogenic_panel
          name: Truncated-KAT6A protein detection and early- versus late-truncation isogenic comparison
          description: Test for truncated KAT6A protein in patient lymphoblastoid or fibroblast lines
            carrying early (exon 1-15) and late (exon 16-17) truncations by N-terminal immunoblot and
            targeted proteomics, with and without nonsense-mediated-decay inhibition. Then derive isogenic
            human iPSC lines carrying a representative early truncation, a representative late truncation,
            a heterozygous KAT6A null, and a corrected control; differentiate to neural progenitors; and
            compare H3K9/H3K23 acetylation, posterior HOXC cluster expression, and neural-progenitor proliferation,
            with wild-type add-back and mutant-selective knockdown arms.
          experiment_type:
            preferred_term: Patient-cell proteomics plus isogenic iPSC allelic series stratified by truncation
              position
          decision_criterion: The late-truncation branch is dominant or gain of function if truncated
            protein is detected for late but not early alleles and the late knock-in line diverges from
            the null on HOXC and acetylation readouts in a way that mutant-selective knockdown corrects;
            both branches are loss of function if early, late and null lines match and wild-type add-back
            rescues each.
          would_support:
          - mechanistic_hypotheses#late_truncating_nmd_escape
          - mechanistic_hypotheses#early_truncating_nmd_haploinsufficiency
          would_refute:
          - mechanistic_hypotheses#early_truncating_nmd_haploinsufficiency
          - mechanistic_hypotheses#late_truncating_nmd_escape
          supporting_outcome:
          - 'Late alleles express truncated protein and behave differently from the null with mutant-selective
            rescue: the entry should carry two contexts, LOSS_OF_FUNCTION for early and GAIN_OF_FUNCTION
            or DOMINANT_NEGATIVE for late truncations.'
          refuting_outcome:
          - 'No truncated protein for either class and all mutant lines match the null: a single LOSS_OF_FUNCTION
            context covers the allelic series.'
      selected_evidence:
        snippet: our study suggests that KAT6A truncating mutations may have some abnormal, potentially
          gain-of-function effects causing upregulation of specific HOX genes and clusters.
        supports: SUPPORT
