        rationale: The largest cohort explicitly cautions that the common childhood infections reported
          by a subset of patients are not necessarily indicative of immunodysfunction, while isolated
          patients had hypogammaglobulinemia, unusual infections, or structural predispositions. Mouse
          studies show KAT6A-dependent memory B-cell formation and CD8 T-cell responses, but no human
          immunophenotyping study has tested that bridge, so no causal edge is asserted for this phenotype.
      selected_evidence:
        snippet: Many children experience recurrent infections of these types, so this is not necessarily
          indicative of immunodysfunction.
        supports: SUPPORT
