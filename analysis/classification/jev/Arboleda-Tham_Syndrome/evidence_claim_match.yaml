        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: kat6a_rspo2_wnt_hippocampal
        hypothesis_label: KAT6A-RSPO2-Wnt Hippocampal Signaling Branch
        status: EMERGING
        description: 'An emerging mechanism, so far demonstrated only in mice, links KAT6A deficiency
          to impaired cognition through a specific transcriptional target: KAT6A activates the CA3-enriched
          Wnt activator R-spondin 2 (RSPO2), and its loss reduces hippocampal CA3 synaptic structure,
          plasticity, and Wnt signaling. Restoring RSPO2 in CA3 neurons rescues Wnt signaling and learning
          behaviors in Kat6a mutant mice, nominating the KAT6A-RSPO2-Wnt axis as a candidate therapeutic
          target. Fidelity to human KAT6A-syndrome cognition is not yet established.'
      selected_evidence:
        snippet: Collectively, our results demonstrate that KAT6A-RSPO2-Wnt signaling plays a critical
          role in regulating hippocampal CA3 synaptic plasticity and cognitive function, providing potential
          therapeutic targets for KAT6A syndrome and related neurodevelopmental diseases.
        supports: SUPPORT
    origin:
