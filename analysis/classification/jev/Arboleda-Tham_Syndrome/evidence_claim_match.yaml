      assertion:
        hypothesis_group_id: early_truncating_nmd_haploinsufficiency
        hypothesis_label: Early-Truncating NMD / Haploinsufficiency Branch
        status: CANONICAL
        description: Truncating variants in exons 1-15 are predicted to trigger nonsense-mediated decay
          of the mutant transcript, producing KAT6A haploinsufficiency. This branch is associated with
          a milder phenotype, with a majority of early-truncating cases rated as having mild intellectual
          disability.
      selected_evidence:
        snippet: This suggests a potential role for nonsense mediated decay (NMD), where truncating mutations
          in the first 15 exons trigger NMD mechanisms and result in haploinsufficiency while mutations
          in exons 16 and 17 would not result in NMD, therefore the mRNA would result in a translated
          but dysfunctional protein that may have gain-of function or dominant negative effects.
        supports: SUPPORT
