  0681a25b2f80b0170dc4e4163236c2881f2da5f4c7eb25d2fcc789a392df1b2c:
    claim:
      about:
        disease:
          name: Arboleda-Tham Syndrome
          disease_term:
            preferred_term: KAT6A syndrome
            term:
              id: MONDO:0014558
              label: autosomal dominant intellectual disability-craniofacial anomalies-cardiac defects
                syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: late_truncating_nmd_escape
        hypothesis_label: Late-Truncating NMD-Escape Branch
        status: ALTERNATIVE
        description: 'Truncating variants in the last two exons (16-17) escape nonsense-mediated decay
          and are predicted to yield a translated but dysfunctional protein with possible gain-of-function
          or dominant-negative effects. This branch is associated with more severe developmental delay
          and a higher frequency of several syndromic features. Direct demonstration of mutant protein
          and its mode of action in patient tissue remains an evidence gap. The two halves of this branch
          are not equally supported: the clinical severity gradient is reproduced across independent cohorts,
          while the molecular claim is unproven. KAT6A is among the most loss-of-function-intolerant genes
          in the genome and early decay-competent truncations are unambiguously pathogenic, so haploinsufficiency
          is the baseline mechanism and this branch is better read as a severity modifier layered on it
          than as a competing primary mechanism.'
      selected_evidence:
        snippet: 95% of late truncating cases (exon 16 and 17) were rated as moderate or severe, while
          60% of early truncating cases (exons 1-15) were rated as mild
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30245513
      reference_title: 'KAT6A Syndrome: genotype-phenotype correlation in 76 patients with pathogenic
        KAT6A variants.'
      evidence_source: HUMAN_CLINICAL
      explanation: The cohort documents the more severe developmental phenotype associated with the NMD-escaping
        late-truncating branch.
