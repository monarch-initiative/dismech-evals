              label: arginase deficiency
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Advanced untreated disease
        notes: 'If untreated, the disorder advances from slowing of linear growth in the toddler years,
          through spasticity and plateauing of cognitive development, to loss of previously acquired developmental
          milestones, severe spasticity with loss of ambulation, loss of bowel and bladder control, and
          severe intellectual disability. Individuals treated from birth — through newborn screening or
          because of an affected older sibling — appear to have minimal symptoms, so this phase describes
          the untreated natural history rather than the expected outcome of managed disease.

          '
      selected_evidence:
        snippet: Individuals treated from birth, either as a result of newborn screening or having an
          affected older sib, appear to have minimal symptoms.
        supports: SUPPORT
    origin:
      assertion_path: /progression/2
