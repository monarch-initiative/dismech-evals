      assertion_type: Phenotype
      assertion:
        name: Hyperammonemia
        frequency: OCCASIONAL
        description: 'Episodic hyperammonemia occurs during catabolic stress, but is notably less frequent
          than in other urea cycle disorders. This distinguishing feature reflects the unique position
          of ARG1 as the terminal urea cycle enzyme with partial compensatory activity from ARG2.

          '
        notes: 'Frequency band is genuinely contested and OCCASIONAL is a deliberate choice made AGAINST
          a discordant source. Orphanet ORPHA:90 bands hyperammonemia Frequent (79-30%), which maps to
          FREQUENT and is the strongest argument for raising the band. Against it: PMID:26467175 describes
          "infrequent episodes of hyperammonemia" and GeneReviews states individuals with arginase deficiency
          "are not as likely to have episodes of hyperammonemia" - both COMPARATIVE statements relative
          to other urea cycle disorders rather than absolute frequencies - while GeneReviews'' own opening
          line describes untreated disease as "characterized by episodic hyperammonemia of variable degree".
          OCCASIONAL is retained because the comparative infrequency is the better-sourced and more clinically
          load-bearing claim: it is precisely what distinguishes ARG1 deficiency from the proximal urea
          cycle disorders, and is the reason this disease presents as progressive spastic paraparesis
          rather than as acute hyperammonemic crises. A curator revisiting this should weigh the Orphanet
          band against that distinction rather than assume either was set carelessly. The discordant Orphanet
          row is recorded below as a PARTIAL evidence item so the conflict is machine-visible.

          '
        phenotype_term:
          preferred_term: Hyperammonemia
          term:
            id: HP:0001987
            label: Hyperammonemia
      selected_evidence:
        snippet: ARG1-deficient patients exhibit hyperargininemia with spastic paraparesis, progressive
          neurological and intellectual impairment, persistent growth retardation, and infrequent episodes
          of hyperammonemia, a clinical pattern that differs strikingly from other urea cycle disorders.
        supports: SUPPORT
