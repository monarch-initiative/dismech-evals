      assertion_type: ProgressionInfo
      assertion:
        phase: Progressive neurological deterioration
        age_range: Early childhood through adolescence
        notes: 'Progressive spastic diplegia or paraparesis typically emerges in early childhood, with
          seizures and cognitive decline following. Accumulation of guanidino compounds drives neurotoxicity.
          Late disease features include cerebral and cerebellar atrophy, corticospinal tract degeneration,
          and progressive mobility impairment.

          '
      selected_evidence:
        snippet: Progressive spastic diplegia constituted the key clinical abnormality in this group,
          but variability in clinical presentation and progression were evident in our series.
        supports: SUPPORT
