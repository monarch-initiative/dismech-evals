        name: Acute hyperammonemia management
        description: 'Acute decompensation is managed by rapidly lowering plasma ammonia: intravenous
          fluids, reversal of catabolism with carbohydrate and fat calories while restricting nitrogen
          intake, and intravenous alternative-pathway agents (sodium benzoate and/or sodium phenylacetate),
          while avoiding overhydration and consequent cerebral edema. Because hyperammonemic episodes
          in arginase deficiency are usually milder than in proximal urea-cycle disorders, they often
          respond to conservative measures alone.

          '
