              resulting in aromatase overexpression and estrogen excess.
            term:
              id: MONDO:0007690
              label: aromatase excess syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: CYP19A1
        gene_term:
          preferred_term: CYP19A1
          term:
            id: hgnc:2594
            label: CYP19A1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Heterozygous gain-of-function structural rearrangements at 15q21.2 fall into three variant
          classes: tandem duplications (which raise CYP19A1 dosage via extra native promoters) and deletions
          and inversions (which recruit novel ectopic promoters of neighboring genes to form chimeric
          CYP19A1 transcripts). No CYP19A1 coding-sequence point mutations cause AEXS; loss-of-function
          CYP19A1 point mutations instead cause the opposite disease, aromatase deficiency. Phenotypic
          severity is not uniform across the classes: it is determined by the tissue-expression pattern
          of the driving promoter and the structural property of the fused promoter-associated exons (in
          particular whether the chimeric first exon carries a natural translation start codon).'
      selected_evidence:
        snippet: an 8-year-old boy diagnosed with AEXS by chromosomal array that revealed a 1.1 Mb novel
          de novo duplication at 15q21.2
        supports: SUPPORT
