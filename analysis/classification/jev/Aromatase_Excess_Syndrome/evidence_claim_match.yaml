  7212186dd6e9919e08b0513188b18389a326693f232e835d335c391a7d310c65:
    claim:
      about:
        disease:
          name: Aromatase Excess Syndrome
          disease_term:
            preferred_term: aromatase excess syndrome
            description: A rare autosomal dominant disorder caused by CYP19A1 gain-of-function rearrangements
              resulting in aromatase overexpression and estrogen excess.
            term:
              id: MONDO:0007690
              label: aromatase excess syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CYP19A1 Locus Rearrangement and Aromatase Overexpression
        description: 'Heterozygous submicroscopic rearrangements at chromosome 15q21.2 drive CYP19A1 overexpression
          by two routes: tandem duplications increase the copy number of the native tissue-specific promoters,
          while deletions and inversions juxtapose the CYP19A1 coding region with constitutively active
          or ectopic promoters of neighboring genes (e.g., TMOD3, DMXL2, GLDN, CGNL1, MAPK6, TLN2), forming
          chimeric transcripts. The aromatase protein itself is structurally normal; its expression is
          pathologically increased and broadened across tissues.'
        role: Primary
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: CYP19A1
            term:
              id: hgnc:2594
              label: CYP19A1
          functional_impact_category: HYPERMORPHIC
          variant_origin: GERMLINE
          description: 'Regulatory gain-of-function: structural rearrangements increase and broaden expression
            of a catalytically normal aromatase, rather than altering the enzyme''s coding sequence.'
        genes:
        - preferred_term: CYP19A1
          term:
            id: hgnc:2594
            label: CYP19A1
      selected_evidence:
        snippet: Heterozygous inversions in chromosome 15q21.2-3, which caused the coding region of the
          aromatase gene to lie adjacent to constitutively active cryptic promoters that normally transcribe
          other genes, resulted in severe estrogen excess owing to the overexpression of aromatase in
          many tissues.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12736278
      reference_title: Estrogen excess associated with novel gain-of-function mutations affecting the
        aromatase gene.
      evidence_source: HUMAN_CLINICAL
      explanation: The original AEXS gain-of-function report establishes the promoter-swap mechanism driving
        aromatase overexpression.
