  b7e6f4f9f004eea89b4f9f743b00b499071854a694332b54bb8feba5076fbe9f:
    claim:
      about:
        disease:
          name: Aromatic L-amino acid decarboxylase deficiency
          disease_term:
            preferred_term: aromatic L-amino acid decarboxylase deficiency
            term:
              id: MONDO:0012084
              label: aromatic L-amino acid decarboxylase deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: aadc_residual_activity_mouse_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Which model can reproduce the near-absent AADC activity and profound motor phenotype of
          severe human disease while remaining viable for longitudinal mechanistic and treatment studies?
        rationale: The available S250F knock-in mouse retains enough activity for substantial dopamine
          production, has only modest dopamine depletion, and lacks dopaminergic-cell pathology. It is
          informative for mild residual-activity disease but cannot establish mechanisms or treatment
          thresholds for the severe phenotype that dominates clinical cohorts.
        attaches_to:
        - pathophysiology#DDC Enzymatic Deficiency
        - pathophysiology#Motor Circuit Dysfunction
        proposed_experiments:
        - experiment_id: aadc_human_neuron_allelic_series
          name: Isogenic human monoaminergic-neuron DDC allelic series
          description: Compare DDC null, severe splice, ligand-binding-site, S250F, and corrected isogenic
            human iPSC-derived dopaminergic and serotonergic neurons for AADC activity, monoamine flux,
            maturation, electrophysiology, and rescue by gene addition or variant-directed substrate therapy.
      selected_evidence:
        snippet: We conclude that even minute levels of active AADC are sufficient to allow for substantial
          amounts of dopamine to be produced in model mice harboring the S250F mutation. Such mutants
          represent a novel, mild model of human AADC deficiency.
        supports: SUPPORT
