          neutralization in a Dsg2-mutant mouse support causal or sensitizing innate branches. None measured
          antibody generation or antibody-dependent injury, and their DSP, broader ACM, or homozygous-mouse
          scope cannot be generalized to a human ARVC DAMP-to-autoantibody sequence. Resolving temporal
          order, antigen specificity, target accessibility, and necessity or sufficiency is therefore
          required before adding a causal immune edge, clinical biomarker, immunosuppressive treatment,
          or a single DAMP-to-autoantibody cascade.
