      - /disease_term
      - /environmental/0
    evidence_metadata:
      reference: PMID:17030684
      reference_title: Age- and training-dependent development of arrhythmogenic right ventricular cardiomyopathy
        in heterozygous plakoglobin-deficient mice.
      evidence_source: MODEL_ORGANISM
      explanation: 'On a desmosomal (plakoglobin) haploinsufficiency background, endurance training accelerates
        right-ventricular dysfunction and arrhythmia, showing that exercise acts as a modifier of the
        adhesion defect rather than as an independent cause. Scope caveat preserved from the same abstract:
        the accelerated phenotype in these mice was functional and electrophysiologic, and histology and
        electron microscopy did not identify right-ventricular abnormalities, so this supports exercise
        acting on the adhesion-failure node but is not evidence for accelerated fibrofatty replacement.'
