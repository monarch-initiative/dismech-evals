      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: anti_dsg2_causal_injury_driver_or_amplifier
        hypothesis_label: Anti-DSG2 Causal Injury Driver or Amplifier
        status: EMERGING
        description: Anti-DSG2 antibodies may causally worsen genetically vulnerable myocardium either
          as antecedent drivers or as injury-dependent amplifiers. Candidate mechanisms are direct impairment
          of junctional adhesion or electrical coupling and Fc-receptor- or complement-dependent injury.
          A signal that merely follows tissue damage without antigen-specific functional activity is the
          null, biomarker-only alternative and refutes this causal hypothesis. DAMP-mediated innate activation
          remains a separately tested possible upstream or parallel branch rather than a presumed linear
          cascade. Current evidence does not warrant wiring this emerging hypothesis to a causal pathophysiology
          edge, defining a clinical biomarker, or proposing an immune-directed treatment.
      selected_evidence:
        snippet: While these observations support a possible role for autoimmunity, the causal contribution
          of these autoantibodies to myocardial injury and disease progression remains incompletely established
          and constitutes a proposed rather than confirmed model.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42406223
      reference_title: 'From inflammation to inheritance: rethinking myocarditis as the first signal of
        desmosomal cardiomyopathy.'
      evidence_source: OTHER
      explanation: The seed narrative review explicitly identifies the causal autoimmune interpretation
        as a working model while emphasizing that it remains unconfirmed. This supports testing an emerging
        causal hypothesis, not treating an injury-associated antibody signal as part of that hypothesis.
