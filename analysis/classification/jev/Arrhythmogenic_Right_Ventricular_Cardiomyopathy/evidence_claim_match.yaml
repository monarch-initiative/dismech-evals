    evidence_metadata:
      reference: PMID:42160918
      reference_title: Evaluation of anti-desmoglein-2 antibodies and cardiac biomarkers in Boxer dogs
        with arrhythmogenic right ventricular cardiomyopathy.
      evidence_source: MODEL_ORGANISM
      explanation: A separate prospective study of 28 affected and 24 screened-control Boxers found poor
        anti-DSG2 discrimination by ELISA and Western blot, while troponin and NT-proBNP performed substantially
        better and tracked ventricular premature-complex burden. This independently refutes the model-specific
        diagnostic premise and favors conventional injury or dysfunction markers, while remaining non-decisive
        about a causal human antibody subset.
