    evidence_metadata:
      reference: PMID:39597880
      reference_title: 'Prevalence and Correlates of Anti-DSG2 Antibodies in Arrhythmogenic Right Ventricular
        Cardiomyopathy and Myocarditis: Immunological Insights from a Multicenter Study.'
      evidence_source: HUMAN_CLINICAL
      explanation: In 77 ARVC cases, 91 myocarditis or DCM cases, 27 systemic immune-mediated disease
        cases, and 50 controls, 56% of ARVC cases were positive, but titers did not distinguish ARVC from
        myocarditis or DCM and anti-DSG2 positivity had no ARVC clinical correlates. This argues against
        treating the antibody as ARVC-specific or as an established mediator.
