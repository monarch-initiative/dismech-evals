        classification_value: desmosomopathy
        notes: Applies to the predominant desmosomal-gene forms of ARVC (PKP2, DSP, DSG2, DSC2, JUP).
          A minority of ARVC is caused by non-desmosomal loci (e.g. TMEM43, LMNA, PLN, DES, CTNNA3, TGFB3),
          which this mechanistic category does not cover.
      selected_evidence:
        snippet: Familial ARVC presentations have been mapped to 9 chromosomal loci, and identified gene
          mutations are predominantly those of cell-to-cell adhesion proteins, specifically, proteins
          comprising the desmosome [4, 5].
