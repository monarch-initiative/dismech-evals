              preferred_term: strenuous exercise
              term:
                id: ECTO:6000031
                label: exposure to strenuous exercise
            description: Vigorous exercise is an important disease modifier that accelerates progression
              and increases arrhythmic risk.
            effect: EXACERBATES
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Intercalated-disc adhesion failure
        environmental_effect: EXACERBATES
        causal_link_type: DIRECT
        description: 'Endurance and competitive exercise imposes repeated mechanical and haemodynamic
          load on an already desmosomally weakened intercalated disc. This is the gene-environment interaction
          that converts a genetically susceptible but structurally near-normal heart into overt disease:
          the same pathogenic desmosomal variant produces markedly earlier and more severe expression
          under high exercise exposure, which is why exercise restriction is a disease-modifying intervention
          rather than merely symptomatic advice.'
      selected_evidence:
        snippet: Endurance training accelerated the development of right ventricular dysfunction and arrhythmias
          in plakoglobin+/- mice.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0/influences_mechanisms/0
      evidence_path: /environmental/0/influences_mechanisms/0/evidence/0
      context_paths:
