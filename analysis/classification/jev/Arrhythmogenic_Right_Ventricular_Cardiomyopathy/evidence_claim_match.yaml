            assays:
            - preferred_term: orthogonal autoantibody profiling
            - preferred_term: B-cell receptor repertoire sequencing
            direction: THRESHOLD_DEPENDENT
          - name: Necrotic injury and innate immune chronology
            target: discussions#gap_arvc_anti_dsg2_autoimmune_causality
            description: Quantify troponin, cell-free cardiac DNA, HMGB1 and other candidate DAMPs, cytokines,
