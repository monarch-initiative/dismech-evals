    evidence_metadata:
      reference: PMID:42090754
      reference_title: Interleukin-1β Drives Disease Progression in Arrhythmogenic Cardiomyopathy.
      evidence_source: MODEL_ORGANISM
      explanation: The intervention portion of this mixed human-and-mouse study gives causal support to
        an IL-1β inflammatory branch in homozygous Dsg2-mutant mice. It did not measure or remove anti-DSG2
        antibodies, establish a DAMP source, or test human treatment, so the result cannot be used to
        infer a DAMP-to-antibody chain or an immune-directed ARVC therapy.
