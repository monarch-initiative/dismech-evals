          positivity. Persistent anti-DSG2 signals after COVID-19 further show that the response is not
          confined to ARVC. A newer functional study found cohesion loss for total IgG from only three
          of six broader ACM donors; GSK-3β inhibition rescued the responder phenotype but did not identify
          DSG2-specific activity or establish a treatment target. Separately, cytosolic-DNA–cGAS epistasis
          in a Dsp-deletion mouse, TLR hypersensitivity in human DSP engineered heart tissue, and IL-1β
          neutralization in a Dsg2-mutant mouse support causal or sensitizing innate branches. None measured
          antibody generation or antibody-dependent injury, and their DSP, broader ACM, or homozygous-mouse
          scope cannot be generalized to a human ARVC DAMP-to-autoantibody sequence. Resolving temporal
          order, antigen specificity, target accessibility, and necessity or sufficiency is therefore
          required before adding a causal immune edge, clinical biomarker, immunosuppressive treatment,
          or a single DAMP-to-autoantibody cascade.
        proposed_experiments:
        - experiment_id: exp_arvc_longitudinal_antibody_origin_and_function
          name: Genotype-stratified longitudinal autoantibody origin and function study
          description: Prospectively follow genotype-positive and gene-elusive ARVC participants, including
            unaffected variant-positive relatives, through quiescent, myocarditis-like hot-phase, and
            recovery intervals. Sample clinically matched inflammatory and structural cardiac controls
            on the same schedule, use orthogonal blinded antibody assays, and connect within-person antibody
            trajectories to injury, imaging, rhythm, and ex-vivo IgG function.
          experiment_type:
            preferred_term: prospective longitudinal mechanistic cohort study
          model_systems:
          - name: Genotype-stratified ARVC natural-history cohort
            description: Enroll DSP-, PKP2-, DSG2-, and other genotype-positive ARVC participants, gene-elusive
              cases, and phenotype-negative variant carriers. Include both sexes, pediatric and adult
              strata, and prespecified exercise and infection exposures without pooling distinct genotypes
              as though they share one inflammatory trajectory.
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
          - name: Clinically relevant cardiac comparator cohort
            description: Match acute myocarditis, dilated cardiomyopathy, cardiac sarcoidosis, right-ventricular
              pressure or volume overload, post-infection cardiac injury, and healthy controls by age,
              sex, sampling phase, and injury burden where feasible.
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
          perturbations:
          - name: Within-person injury and recovery time course
            target: mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
            description: Obtain scheduled baseline specimens plus event-triggered samples before treatment
              where possible, during peak troponin or imaging activity, and through recovery. Record infection,
              exercise, immunomodulation, heart failure therapy, and arrhythmia procedures as time-varying
              exposures.
          - name: Antigen-specific IgG depletion and add-back
            target: mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
            description: Purify total IgG from serial samples, affinity-deplete DSG2-reactive fractions
              with independently verified native extracellular DSG2, and add the eluted fraction back
              at its measured concentration. Compare intact IgG with matched Fab and Fc fragments and
              heat-inactivated or complement-reconstituted conditions.
          readouts:
          - name: Orthogonal antibody identity and trajectory
            target: mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
            description: Compare preregistered ELISA, immunofluorescence, native-cell binding, immunoprecipitation,
              and cleavage assays. Map epitope, isotype, affinity, glycosylation, clonotype, and cross-reactivity
              to N-cadherin and other intercalated-disc antigens at every longitudinal phase.
            assays:
            - preferred_term: orthogonal autoantibody profiling
            - preferred_term: B-cell receptor repertoire sequencing
            direction: THRESHOLD_DEPENDENT
          - name: Necrotic injury and innate immune chronology
            target: discussions#gap_arvc_anti_dsg2_autoimmune_causality
            description: Quantify troponin, cell-free cardiac DNA, HMGB1 and other candidate DAMPs, cytokines,
              complement products, cardiac magnetic resonance edema and scar, positron-emission tomography
              inflammation, ventricular function, and biopsy findings when clinically obtained. Where
              tissue permits, distinguish necrotic injury from apoptosis rather than mapping all cardiomyocyte
              loss to the existing apoptosis-only node.
            assays:
            - preferred_term: serial cardiac magnetic resonance imaging
            - preferred_term: plasma injury and immune mediator profiling
            direction: THRESHOLD_DEPENDENT
          - name: Electrical and adhesion effect of serial IgG
            target: pathophysiology#Gap-junction and sodium-channel remodeling
            description: At participant-matched concentrations, test intact, depleted, and add-back IgG
              in mechanically loaded human cardiomyocyte cultures for DSG2 accessibility and cleavage,
              cell-cell adhesion, Cx43 localization, conduction velocity, gap-junction transfer, cell
              death, complement deposition, and immune-cell recruitment.
            assays:
            - preferred_term: cardiomyocyte adhesion and conduction assay
            - preferred_term: antigen-specific immunoadsorption and add-back assay
            direction: NEGATIVE
          controls:
          - name: Assay and temporal-bias controls
            description: Lock cutoffs before outcome analysis, blind laboratories to diagnosis and phase,
              include bridge samples and calibrators across sites, verify native antigen folding and Fc-tag
              artifacts, and repeat decisive results with a second antigen preparation and laboratory.
          - name: Disease and injury-burden controls
            description: Analyze each comparator separately and match or adjust for troponin, scar, ventricular
              function, renal function, infection timing, exercise, genotype, age, sex, and immunomodulatory
              exposure. Do not derive a diagnostic cutoff and test it in the same cohort.
          decision_criterion: An antecedent pathogenic contribution requires a reproducible antibody clone
            or activity to be present or rise before objective injury within individuals, predict subsequent
            injury beyond genotype and prior disease burden, bind native cardiomyocyte DSG2, and produce
            an effect lost by antigen-specific depletion and restored by concentration-matched add-back.
            An amplifier is supported when the activity appears after structural injury but specifically
            worsens adhesion, conduction, or immune injury. A marker is favored when titers follow troponin,
            DAMP, or scar burden but depletion and add-back do not alter function. Similar phase- and
            injury-matched trajectories in myocarditis, sarcoidosis, post-infection injury, or right-ventricular
            overload support an injury-nonspecific response; failure of orthogonal assays supports assay
            artifact. Either biomarker-only result is the null outcome and refutes the causal driver-or-amplifier
            hypothesis. This study can establish temporal and ex-vivo support but is not alone sufficient
            for clinical biomarker adoption or therapeutic targeting.
          would_support:
          - mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
          would_refute:
          - mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
        - experiment_id: exp_arvc_anti_dsg2_causal_epistasis
          name: Antigen-specific anti-DSG2 causal epistasis under mechanical stress
          description: Reconstruct patient antibody activity in isogenic human cardiac microtissues and
            genotype-specific animal models. Separate antigen binding or catalytic effects from Fc-receptor,
            complement, cellular cytotoxicity, and DAMP-sensing pathways using adsorption and add-back,
            monoclonal reconstruction, rescue, and branch-specific epistasis.
          experiment_type:
            preferred_term: antigen-specific cardiac autoantibody causal epistasis study
          model_systems:
          - name: Isogenic human mechanically loaded cardiac immune microtissue
            description: Combine ventricular iPSC-derived cardiomyocytes with cardiac fibroblasts, endothelial
              cells, macrophages, and natural killer cells in an electrically paced, mechanically loaded
              format. Use multiple donor backgrounds and matched wild-type, DSP-, PKP2-, and DSG2-variant
              lines.
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
          - name: Genotype-specific arrhythmogenic cardiomyopathy models
            description: Use sex-balanced, age-matched Dsp-, Pkp2-, and Dsg2-perturbed mice with longitudinal
              telemetry and imaging. Include wild-type recipients and prespecified low- and high-mechanical-load
              conditions while separating developmental from adult-onset injury. Before antibody transfer,
              demonstrate binding to native murine Dsg2 and the intended epitope. For Fc- or complement-dependent
              questions, use variable regions reformatted onto a species-compatible murine Fc with murine
              complement, or validated human DSG2/Fc-gamma-receptor/complement-humanized recipients.
            organism:
              preferred_term: house mouse
              term:
                id: NCBITaxon:10090
                label: Mus musculus
          perturbations:
          - name: Patient anti-DSG2 loss-and-add-back series
            target: mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
            description: Compare total patient IgG, DSG2-depleted IgG, the affinity-eluted add-back fraction,
              nonbinding IgG, matched Fab and Fc fragments, and sequence-defined monoclonal antibodies
              reconstructed from expanded DSG2-reactive B-cell clonotypes. Confirm binding to intact cardiomyocyte
              DSG2 and exclude N-cadherin or unrelated protease activity. In mice, interpret only reagents
              with verified native Dsg2 cross-reactivity and species-compatible effector handling, or
              use the validated humanized recipients.
          - name: Antigen and effector-pathway epistasis
            target: pathophysiology#Intercalated-disc adhesion failure
            description: Alter the mapped DSG2 epitope without disrupting baseline adhesion, then independently
              block Fc-gamma receptors, complement, natural-killer cell cytotoxicity, candidate catalytic
              activity, GSK-3β, and p38 signaling. Rescue with an antibody-insensitive but adhesion-competent
              DSG2 allele. Treat rescue at a shared downstream signaling node as mechanistically non-specific
              unless antigen-specific loss and add-back also identify the initiating antibody activity.
          - name: Parallel DAMP-sensing branch perturbation
            target: discussions#gap_arvc_anti_dsg2_autoimmune_causality
            description: Manipulate HMGB1 or nucleic-acid release and cGAS-STING, selected TLR, NLRP3,
              or IL-1β signaling independently of antibody exposure. Cross these perturbations with antigen-specific
              antibody loss and add-back so a parallel innate branch is distinguishable from a required
              DAMP-to-antibody sequence. Quantify necrotic and apoptotic cell death separately rather
              than presuming that DAMP release reports apoptosis.
          readouts:
          - name: Junctional target engagement and function
            target: pathophysiology#Intercalated-disc adhesion failure
            description: Quantify native DSG2 occupancy or cleavage, desmosomal ultrastructure, intercellular
              force, Cx43 and Nav1.5 localization, dye coupling, conduction velocity, triggered activity,
              and mechanical-load-dependent cell loss with blinded longitudinal analysis.
            assays:
            - preferred_term: super-resolution junctional imaging
            - preferred_term: force spectroscopy and multielectrode mapping
            direction: NEGATIVE
          - name: Immune injury and remodeling
            target: pathophysiology#Fibrofatty myocardial replacement
            description: Resolve complement deposition, Fc-receptor activation, cytotoxicity, macrophage
              states, cytokines, DAMPs, fibrosis, adipose replacement, ventricular function, and arrhythmia
              from acute exposure through remodeling.
            assays:
            - preferred_term: spatial single-cell immune profiling
            - preferred_term: telemetry, imaging, and quantitative histopathology
            direction: THRESHOLD_DEPENDENT
          controls:
          - name: Antigen and immunoglobulin specificity controls
            description: Use participant-matched control IgG, myocarditis and post-infection IgG, irrelevant
              antigen adsorption, sham elution, isotype-matched monoclonal controls, endotoxin testing,
              complement-free and reconstituted media, and blinded replication with independently prepared
              antibody.
          - name: Model and branch controls
            description: Include no-load and matched-load conditions, genotype-matched untreated controls,
              wild-type recipients, Fc-receptor and complement single perturbations, DAMP-pathway perturbations
              without antibody, and antibody exposure without immune cells. Measure antibody pharmacokinetics
              and myocardial access rather than assuming surface epitope availability.
          - name: Cross-species antigen and effector compatibility controls
            description: Before interpreting an in-vivo transfer, verify binding and antigen occupancy
              for the native DSG2 ortholog expressed in that recipient, plus Fc-gamma-receptor engagement
              and complement activation for the exact antibody format. Where recipients express murine
              Dsg2, demonstrate cross-reactivity directly; otherwise validate that the humanized target
              and effector components are functional. Treat an incompatible format as a failed model-transfer
              control, not as evidence against causality.
          decision_criterion: A direct autoantibody driver requires a sequence-defined anti-DSG2 antibody
            or affinity-purified fraction to reproduce junctional, electrical, and tissue injury by itself;
            loss of effect after DSG2-specific adsorption or epitope alteration; restoration by add-back;
            and the predicted antigen or effector-pathway rescue in both human tissue and an independent
            in-vivo model. The in-vivo arm counts toward this criterion only after antigen and Fc/complement
            compatibility are verified; otherwise effector inference is bounded to the human microtissue
            and a negative mouse result is non-informative. Activity only after pre-existing desmosomal
            injury or mechanical stress, with a reproducible increase in injury magnitude, supports an
            amplifier. Association without antigen-specific functional effects is the biomarker-only null
            and refutes this causal hypothesis. Persistence after DSG2 adsorption or epitope rescue, equal
            effects from control or inflammatory-disease IgG, failure to reach myocardium, or dependence
            on nonspecific protease contamination also refutes an anti-DSG2-specific mechanism. Independent
            DAMP effects after antibody removal establish a parallel innate branch; DAMP perturbation
            must alter antibody generation and antibody-dependent injury in order to support a serial
            cascade.
          would_support:
          - mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
          would_refute:
          - mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
      selected_evidence:
        snippet: we treated Dsg2mut/mut mice with an anti-IL1B neutralizing antibody and observed attenuated
          fibrosis, reduced levels of inflammatory cytokines and chemokines, preserved cardiac function,
          and diminished conduction slowing and automaticity
        supports: SUPPORT
