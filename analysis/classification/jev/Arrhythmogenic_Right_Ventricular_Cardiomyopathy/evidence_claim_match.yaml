      explanation: Genetic epistasis supports a causal cytosolic-DNA–cGAS contribution in a severe homozygous
        cardiomyocyte-Dsp deletion mouse, but systemic rather than cardiomyocyte-specific Mb21d1 deletion
        limits cell-of-origin inference and did not reduce arrhythmia or conduction defects. This is not
        human ARVC evidence, and the study did not test anti-DSG2 production or antibody-dependent injury.
