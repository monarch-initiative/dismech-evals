      reference: PMID:37450050
      reference_title: Catalytic antibodies in arrhythmogenic cardiomyopathy patients cleave desmoglein 2
        and N-cadherin and impair cardiomyocyte cohesion.
      evidence_source: IN_VITRO
      explanation: In biochemical and murine atrial cell-line assays, 11 of 15 IgG fractions cleaved recombinant
        DSG2, six reduced cellular cohesion, and p38 inhibition rescued cohesion for selected fractions.
        The fractions also targeted N-cadherin, the study could not detect anti-DSG2 binding by its ELISAs,
        and it used no antigen-specific adsorption, monoclonal reconstruction, or intact-animal transfer.
