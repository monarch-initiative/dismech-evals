    evidence_metadata:
      reference: PMID:42219531
      reference_title: Autoantibodies in Patients With Arrhythmogenic Cardiomyopathy Activate GSK-3β,
        Resulting in a Loss of Cardiomyocyte Cohesion.
      evidence_source: IN_VITRO
      explanation: Total polyclonal IgG from only half of the six broader arrhythmogenic cardiomyopathy
        donors reduced cohesion in cell and tissue assays, and healthy-relative IgG also stained intercalated
        discs. GSK-3β inhibition rescued the responder-IgG phenotype, but the study did not use DSG2-specific
        depletion and add-back, a sequence-defined monoclonal, epitope rescue, or intact-animal transfer.
        It therefore supports a reproducible functional signal in a subset, not an anti-DSG2-specific
        causal axis or a treatment claim.
    first_seen_at: '2026-09-25T15:06:45.179715+00:00'
