            for clinical biomarker adoption or therapeutic targeting.
          would_support:
          - mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
          would_refute:
          - mechanistic_hypotheses#anti_dsg2_causal_injury_driver_or_amplifier
