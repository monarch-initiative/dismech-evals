              is the principal in vivo demonstration that endurance training accelerates the ARVC phenotype
              on a desmosomal-deficiency background, which is why it anchors the exercise exposure edge
              in this entry. Important scope limit: histology and electron microscopy did not identify
              right-ventricular abnormalities in affected animals, so the model recapitulates the functional,
              conduction and arrhythmic arms of the disease but NOT the fibrofatty replacement that defines
