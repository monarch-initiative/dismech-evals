    evidence_metadata:
      reference: PMID:38768074
      reference_title: Susceptibility to innate immune activation in genetically mediated myocarditis.
      evidence_source: IN_VITRO
      explanation: Patient-derived engineered heart tissues with heterozygous DSP truncating variants
        support genotype-dependent susceptibility to innate stimulation. The study models DSP-associated
        myocarditis rather than exact ARVC, does not establish which endogenous DAMP, if any, initiates
        human ARVC, and contains no anti-DSG2 measurement or antibody perturbation. It therefore supports
        a parallel innate branch rather than a serial autoimmune cascade.
