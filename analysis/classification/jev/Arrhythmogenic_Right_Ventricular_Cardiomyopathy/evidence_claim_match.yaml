      assertion_type: ExperimentalModel
      assertion:
        name: Heterozygous plakoglobin-deficient (plakoglobin+/-) mouse
        description: 'Mice heterozygous for a plakoglobin (Jup) null allele, modelling the desmosomal
          haploinsufficiency mechanism of ARVC. By ten months they show increased right-ventricular volume,
          reduced right-ventricular function and spontaneous ventricular ectopy with preserved left-ventricular
          size and function, and isolated perfused hearts show ventricular tachycardia of right-ventricular
          origin with prolonged right-ventricular conduction times. The model is the principal in vivo
          demonstration that endurance training accelerates the ARVC phenotype on a desmosomal-deficiency
          background, which is why it anchors the exercise exposure edge in this entry. Important scope
          limit: histology and electron microscopy did not identify right-ventricular abnormalities in
          affected animals, so the model recapitulates the functional, conduction and arrhythmic arms
          of the disease but NOT the fibrofatty replacement that defines its histopathology - it must
          not be cited as evidence for accelerated fibrofatty remodelling.'
        experimental_model_type: OTHER
        organism:
          preferred_term: house mouse
          term:
            id: NCBITaxon:10090
            label: Mus musculus
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        modeled_mechanisms:
        - target: Intercalated-disc adhesion failure
          description: Plakoglobin haploinsufficiency reproduces the desmosomal adhesion defect in vivo,
            and endurance training accelerates its functional and arrhythmic consequences - the model
            system behind the exercise EXACERBATES edge on this node.
        publication: PMID:17030684
      selected_evidence:
        snippet: Ten-month-old heterozygous plakoglobin-deficient mice (plakoglobin+/-) had increased
          right ventricular volume, reduced right ventricular function, and spontaneous ventricular ectopy
          (all P<0.05). Left ventricular size and function were not altered.
        supports: SUPPORT
