      - /disease_term
    evidence_metadata:
      reference: PMID:39597880
      reference_title: 'Prevalence and Correlates of Anti-DSG2 Antibodies in Arrhythmogenic Right Ventricular
        Cardiomyopathy and Myocarditis: Immunological Insights from a Multicenter Study.'
      evidence_source: HUMAN_CLINICAL
      explanation: Within one multicenter cohort, the serological phenotype carrying ARVC clinical correlates
        was anti-intercalated-disc antibody status measured by indirect immunofluorescence, not ELISA-defined
        anti-DSG2 positivity, and the investigators read this as DSG2 being one autoantigen inside a wider
        intercalated-disc spectrum. This cuts against an anti-DSG2-specific causal axis and shows that
        the detection method decides which antibody phenotype carries clinical signal, so repeated detection
        of anti-DSG2 reactivity across cohorts does not make its positivity rate or its assay-defined
        clinical phenotype robust. The comparison is cross-sectional and does not exclude a pathogenic
        anti-DSG2 subset undetected by these assays.
