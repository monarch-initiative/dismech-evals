    evidence_metadata:
      reference: PMID:41351822
      reference_title: Anti-desmoglein-2 autoantibodies do not discriminate between UK boxer dogs with
        and without arrhythmogenic right ventricular cardiomyopathy.
      evidence_source: MODEL_ORGANISM
      explanation: In an independent 40-Boxer cohort, anti-DSG2 was nearly ubiquitous across healthy,
        preclinical-ARVC, and clinical-ARVC groups. This fails to reproduce the original Boxer-model disease-specificity
        anchor. It does not by itself exclude a pathogenic human antibody subset or an injury-dependent
        amplifier, but directly refutes using Boxer seropositivity as evidence that anti-DSG2 distinguishes
        affected from unaffected animals.
