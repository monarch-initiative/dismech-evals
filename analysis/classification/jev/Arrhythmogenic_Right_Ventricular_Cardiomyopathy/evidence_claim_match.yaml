      reference: url:https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13256025/fullTextXML
      reference_title: Introduction
      evidence_source: HUMAN_CLINICAL
      explanation: In 101 definite ARVC cases, antibody levels separated cases from 37 selected Ebstein-anomaly
        or Eisenmenger-syndrome controls and 31 healthy controls. A separately derived higher threshold
        correlated with cardiac death or transplantation but not arrhythmic events. The single-centre
        study lacked longitudinal antibody measurements and myocarditis or DCM comparators, so its favorable
        internally derived cutoffs do not reverse the comparator-rich PMID:39597880 finding or establish
        temporal order, disease specificity, or causality.
