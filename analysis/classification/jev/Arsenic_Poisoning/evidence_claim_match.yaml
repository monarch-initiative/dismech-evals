  fbeb7550deb0ccd553db25c03e6d2962d7c6918e9e1dd4c48691d6faac5f3e2d:
    claim:
      about:
        disease:
          name: Arsenic Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_arsenic_molecular_human_translation
        prompt: To what extent do PDH inhibition and ROS/RNS-mediated PARP-1 impairment drive the acute
          and chronic organ syndromes in exposed humans at clinically relevant internal doses?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#MMA(III)-sensitive pyruvate dehydrogenase inhibition
        - pathophysiology#Arsenite-generated oxidative and nitrosative stress
        - pathophysiology#PARP-1 zinc loss and activity impairment
        rationale: The retained proximal mechanisms are supported by purified-enzyme, cell, and animal
          experiments, while the direct quantitative bridge to human organ injury remains unresolved.
          The graph therefore does not connect these molecular nodes directly to cancer, neuropathy, or
          cutaneous lesions.
      selected_evidence:
        snippet: Our results show that direct enzyme inhibition is not a common toxic effect of As and
          that only a few sensitive enzymes are responsible for arsenic-induced cellular toxicity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:9806419
      reference_title: Arsenic toxicity is enzyme specific and its affects on ligation are not caused
        by the direct inhibition of DNA repair enzymes.
      evidence_source: IN_VITRO
      explanation: Directly supports limiting the breadth of the enzyme-inhibition model.
