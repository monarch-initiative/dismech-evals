  7a78bbc8a635d74f4f8e35be89927417323915349cc46a2c96f9c79d8484a2a4:
    claim:
      about:
        disease:
          name: Arsenic Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_arsenic_acute_chelation_outcomes
        prompt: Which dithiol chelator, timing, and regimen improve patient-centered outcomes in severe
          acute inorganic arsenic poisoning beyond modern supportive care?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Early dithiol chelation for severe acute poisoning
        rationale: 'Acute treatment reports combine chelation with resuscitation, gastrointestinal decontamination,
          and other interventions, preventing a clean estimate of comparative efficacy. Chronic arsenicosis
          should not be used as a proxy indication: a randomized placebo-controlled DMSA trial did not
          show clinical, biochemical, or histopathologic benefit.'
      selected_evidence:
        snippet: Under the conditions of this study, 2,3-dimercaptosuccinic acid was not effective in
          producing any clinical or biochemical benefit or any histopathological improvement of skin lesions
          in patients with chronic arsenicosis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:9865236
      reference_title: Randomized placebo-controlled trial of 2,3-dimercaptosuccinic acid in therapy of
        chronic arsenicosis due to drinking arsenic-contaminated subsoil water.
      evidence_source: HUMAN_CLINICAL
      explanation: The randomized trial directly establishes that chronic DMSA treatment did not provide
        the asserted benefits under the studied regimen.
