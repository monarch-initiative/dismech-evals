  65cf316fe78572b404b2f061159264dbfa9c4b571266e33bb91368f5538fd94d:
    claim:
      about:
        disease:
          name: Arsenic-Related Cancers
          disease_term:
            preferred_term: squamous cell carcinoma
            term:
              id: MONDO:0005096
              label: squamous cell carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cellular Immune Dysfunction
        description: Chronic arsenic exposure impairs cell-mediated antitumor immunity, providing a co-carcinogenic
          route distinct from direct genotoxicity. Arsenic depletes peripheral CD4+ T helper cells (through
          selective CD4+ T-cell apoptosis and reduced interleukin-2 signaling) and reduces the number
          and antigen-presenting function of epidermal Langerhans cells within arsenic-induced Bowen disease
          lesions. The resulting loss of immunosurveillance permits tumor immune escape and helps explain
          the characteristically multiple and recrudescent nature of arsenic-induced skin cancers.
        cell_types:
        - preferred_term: CD4+ T helper cell
          modifier: DECREASED
          term:
            id: CL:0000492
            label: CD4-positive helper T cell
        - preferred_term: Langerhans cell
          modifier: DECREASED
          term:
            id: CL:0000453
            label: Langerhans cell
        biological_processes:
        - preferred_term: T cell apoptotic process
          modifier: INCREASED
          term:
            id: GO:0070231
            label: T cell apoptotic process
        - preferred_term: antigen processing and presentation
