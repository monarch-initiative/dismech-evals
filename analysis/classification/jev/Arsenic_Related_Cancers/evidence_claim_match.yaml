                label: exposure to arsenic
            description: Chronic exposure to inorganic arsenic through contaminated drinking water is
              the primary route of exposure affecting large populations. Occupational exposure occurs
              in mining, smelting, pesticide manufacturing, and wood preservation. The latency period
              between exposure and cancer development is typically 20-40 years. Arsenic is methylated
              in the liver to monomethylarsonic acid (MMA) and dimethylarsinic acid (DMA); the intermediate
              MMA(III) is particularly toxic. Individual variation in arsenic metabolism affects cancer
              susceptibility.
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Arsenic Uptake and Metabolism
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: 'Chronic ingestion of contaminated drinking water and occupational inhalation are
          the routes by which inorganic arsenic reaches the hepatic methylation pathway this node models.
          Direct for the same reason as the aflatoxin case: absorption is inside the node''s own description,
          so the edge steps over nothing. This mirrors the Arsenic_Poisoning links added in #8084, which
          point that entry''s ingestion routes at its systemic-burden node.'
      selected_evidence:
        snippet: Naturally occurring inorganic arsenic is known to increase the risk of cancers of the
          skin and several other organs, including the urinary bladder, lung, and liver.
        supports: SUPPORT
        directness: INDIRECT
    origin:
