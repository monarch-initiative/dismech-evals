      assertion_type: Prevalence
      assertion:
        population: Global (dietary inorganic arsenic exposure)
        notes: A quantitative global-burden risk assessment estimated that inorganic arsenic in food accounts
          for approximately 9,100–119,200 additional bladder cancer cases, 11,800–121,400 additional lung
          cancer cases, and 10,700–110,000 additional skin cancer cases (basal cell and squamous cell
          carcinoma) worldwide each year. Drinking-water-attributable cases are typically much larger
          in high-exposure regions such as Bangladesh and Taiwan.
      selected_evidence:
        snippet: We estimated that each year 9,129 to 119,176 additional cases of bladder cancer, 11,844
          to 121,442 of lung cancer, and 10,729 to 110,015 of skin cancer worldwide are attributable to
          inorganic arsenic in food.
        supports: SUPPORT
