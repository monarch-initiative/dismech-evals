      assertion_type: DifferentialDiagnosis
      assertion:
        name: Pseudoxanthoma Elasticum
        description: PXE and GACI share ABCC6/pyrophosphate-pathway biology and can overlap genetically.
          Classic PXE is generally a later-onset elastic-tissue disorder with characteristic skin and
          retinal disease, whereas GACI is defined by congenital or infantile diffuse arterial calcification
          and stenosis.
        distinguishing_features:
        - Congenital or infantile diffuse arterial calcification and stenosis favors GACI.
        - Yellow papules, angioid streaks, and a later-onset elastic-tissue phenotype favor classic PXE.
        - ENPP1 is the major GACI gene; ABCC6 can cause either phenotype, so molecular results must be
          interpreted with presentation and age.
      selected_evidence:
        snippet: A recent report described two siblings with identical ABCC6 gene mutations that led to
          classical PXE in the older brother and a phenotype similar to GACI in the younger brother
        supports: SUPPORT
    origin:
