      assertion:
        phase: Critical fetal and early-infantile vascular phase
        age_range: Fetal life through the first 6 months after birth
        notes: Severe diffuse arterial disease can cause fetal loss, early myocardial or cerebral ischemic
          events, heart failure, and death. Ascertainment is enriched for severe cases, but the first
          six months are the clearest high-risk period in the published natural-history series.
      selected_evidence:
        snippet: Overall mortality was 54.7% (13.4% in utero or stillborn), with a 50.4% probability of
          death before the age of 6 months (critical period).
        supports: SUPPORT
