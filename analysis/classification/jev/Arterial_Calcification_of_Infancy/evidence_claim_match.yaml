  7da7e407635f351bd69c1eb8da696e1da5f3f5afa8ec64c6fd26ba1c99b5a2c9:
    claim:
      about:
        disease:
          name: Arterial Calcification of Infancy
          disease_term:
            preferred_term: arterial calcification of infancy
            term:
              id: MONDO:0018870
              label: arterial calcification of infancy
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Survivor multisystem phase
        age_range: Later infancy through adulthood
        notes: Arterial calcification may regress or leave limited residual imaging involvement, while
          ENPP1-deficient survivors commonly develop FGF23-associated hypophosphatemic rickets and may
          develop hearing loss, cervical fusion, enthesis calcification, and PXE-like findings. These
          later complications are not uniformly shared by the ABCC6 subtype.
      selected_evidence:
        snippet: Sixteen of 20 subjects presented with arterial calcifications, but only 5 had residual
          involvement at the time of evaluation. Individuals with ENPP1 deficiency either had hypophosphatemic
          rickets or were predicted to develop it by 14 years of age; 14/16 had elevated intact FGF23
          levels (iFGF23).
        supports: SUPPORT
    origin:
      assertion_path: /progression/1
      evidence_path: /progression/1/evidence/0
      context_paths:
