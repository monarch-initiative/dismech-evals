        description: Without EMILIN1, the elastogenic protein EFEMP2 (fibulin-4) is poorly deposited in
          the extracellular matrix and lysyl oxidase (LOX) levels and enzyme activity fall, shown in patient
          material and in Emilin1 knockout mice. This places EMILIN1 deficiency on the same EFEMP2-LOX
          axis as EFEMP2-related cutis laxa type 1B.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: LOX
