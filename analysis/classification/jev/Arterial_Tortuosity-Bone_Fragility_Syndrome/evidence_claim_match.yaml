            id: hgnc:6664
            label: LOX
        molecular_functions:
        - preferred_term: lysyl oxidase activity
          modifier: DECREASED
          term:
            id: GO:0004720
            label: protein-lysine 6-oxidase activity
      selected_evidence:
        snippet: In both humans and mice, absence of EMILIN1 impairs EFEMP2 extracellular matrix deposition
          and LOX activity resulting in impaired elastogenesis, reduced collagen crosslinking, and aberrant
          growth factor signaling.
        supports: SUPPORT
