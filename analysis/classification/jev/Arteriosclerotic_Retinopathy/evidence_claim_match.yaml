        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hypertensive retinopathy
        description: Hypertensive retinopathy reflects pressure-related retinal vascular and, in severe
          disease, parenchymal injury. Arteriolar narrowing belongs primarily to the hypertensive axis,
          while hemorrhages, hard exudates, cotton-wool spots, and optic-disc edema indicate more severe
          acute hypertensive injury. Chronic wall-reflex and crossing changes can coexist, so blood pressure
          and the complete fundus pattern must be interpreted together.
        distinguishing_features:
        - Modified Scheie H and S grades are separate axes and should both be reported when used.
        - Generalized or focal arteriolar narrowing favors the hypertensive vascular response rather than
          isolated arteriosclerotic S grading.
        - Retinal hemorrhages, hard exudates, cotton-wool spots, or optic-disc edema indicate parenchymal
          hypertensive injury and should not be collapsed into arteriosclerotic retinopathy.
      selected_evidence:
        snippet: Hypertensive retinopathy causes vascular constriction of retinal arterioles and typical
          fundus findings, such as blot hemorrhages, hard exudates and cotton wool spots resulting from
          ischemia within the nerve fiber layer.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
