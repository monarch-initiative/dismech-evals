          variant and delayed amino-propeptide processing. Dermal electron microscopy was a separate patient-tissue
          investigation, not an outcome of a fibroblast rescue.
        modeled_mechanisms:
        - target: Loss of Exon 6 Sequence from Collagen Transcripts
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Patient transcript sequencing identified the skipped exon.
          limitations: Patient-cell observations with limited sampling; no gene correction, tissue-mechanical
            rescue, orthopedic outcome or treatment efficacy was tested.
          readouts:
          - name: Exon 6-skipped RNA
            target: Loss of Exon 6 Sequence from Collagen Transcripts
            direction: ALTERED
            interpretation: Patient transcript sequencing identified the skipped exon.
        - target: Retained Procollagen N-Propeptide
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Amino-propeptide processing was substantially delayed relative to controls.
          limitations: Patient-cell observations with limited sampling; no gene correction, tissue-mechanical
            rescue, orthopedic outcome or treatment efficacy was tested.
          readouts:
          - name: Delayed propeptide processing
            target: Retained Procollagen N-Propeptide
            direction: INCREASED
            interpretation: Amino-propeptide processing was substantially delayed relative to controls.
      selected_evidence:
        snippet: In comparison with processing of procollagen from control cell cultures, amino propeptide
          processing was substantially delayed in this proband.
        supports: SUPPORT
