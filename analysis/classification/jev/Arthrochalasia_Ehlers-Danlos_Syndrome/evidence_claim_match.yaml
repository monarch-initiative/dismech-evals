      assertion_type: Diagnosis
      assertion:
        name: RNA and collagen-processing studies
        description: Transcript analysis can establish complete exon skipping or cryptic splice-site use.
          Fibroblast collagen electrophoresis may show retained pN chains and delayed processing. These
          assays characterize uncertain molecular effects and were diagnostic in historical cases; current
          diagnosis is not established by an arbitrary collagen-gene VUS alone.
      selected_evidence:
        snippet: In comparison with processing of procollagen from control cell cultures, amino propeptide
          processing was substantially delayed in this proband.
        supports: SUPPORT
