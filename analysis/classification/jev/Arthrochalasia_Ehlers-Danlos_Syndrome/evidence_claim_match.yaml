            id: HP:0000006
            label: Autosomal dominant inheritance
        description: Classic exon-6-related disease may be inherited or arise de novo. An affected heterozygous
          parent has a one-in-two transmission probability per pregnancy. A negative parental blood result
          does not exclude gonadal mosaicism, but the reviewed aEDS reports do not establish a numeric
          mosaic recurrence risk. Familial transmission and affected adults with children contradict a
          presumed universal reproductive limitation.
      selected_evidence:
        snippet: Arthrochalasia Ehlers-Danlos syndrome (aEDS) is a rare autosomal dominant connective
          tissue disorder
        supports: SUPPORT
