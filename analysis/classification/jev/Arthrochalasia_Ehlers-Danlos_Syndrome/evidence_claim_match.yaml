      assertion:
        discussion_id: aeds_cardiovascular_scope
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What cardiovascular surveillance is justified in molecularly confirmed aEDS?
        attaches_to:
        - phenotypes#Mitral Regurgitation
        - treatments#Cardiovascular assessment and individualized follow-up
        rationale: One confirmed COL1A2 exon-6 case developed valve regurgitation while systolic function
          and aortic-root dimensions remained normal. This differs genetically from recessive cardiac-valvular
          EDS due to biallelic COL1A2 null variants. A systematic review of nonvascular EDS included 17
          selected aEDS patients and identified one perioperative hemorrhage, plus a separate report of
          postpartum bleeding; its surgical paragraph inconsistently gives a denominator of 18. These
          case-based data do not establish population risks or a vascular-EDS-like arterial phenotype.
          The review did not report arterial aneurysm or dissection in its aEDS subset. This is absence
          from selected literature, not proof that such an event is impossible. Routine preventive vascular
          drugs or intensive arterial screening cannot be inferred from the reviewed reports.
      selected_evidence:
        snippet: in one patient with aEDS (1/18, 6%) who bled excessively at surgery (unspecified)
        supports: SUPPORT
