        name: Pregnancy and delivery planning
        description: Offer specialist follow-up through pregnancy and plan delivery where maternal and
          neonatal complications can be managed. Published affected mothers had live births, including
          affected children; possible perineal or pelvic-floor risks extrapolated from classical EDS should
          not be represented as measured aEDS event rates. Postpartum hemorrhage has been reported in
          one published affected mother; the selected literature denominator is not a prospective risk
          estimate.
