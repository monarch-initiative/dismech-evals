        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the age-specific fracture burden in molecularly confirmed aEDS?
        attaches_to:
        - phenotypes#Bone Fractures
        - phenotypes#Osteopenia
        rationale: 'The 2020 selected cohort reports 9/12 with fractures; the 2019 mixed-EDS study contains
          only one probable, non-molecularly confirmed aEDS case without fractures. Its pooled odds ratio
          and infant findings should not become aEDS-specific risk estimates. The 2012 article contains
          incompatible fracture statements: patient 4 had slowly healing fractures and a positive table
          cell, but the table total is 0/7 and discussion says none. The 2022 review also misrepresents
          the 2020 bone review, whose abstract explicitly includes aEDS among rare types with frequent
          fractures/low BMD. A deduplicated, genetically defined longitudinal cohort is needed; source
          contradictions should not be resolved by inventing a numerator.'
      selected_evidence:
        snippet: Fractures were present in 9/12 individuals with 1 patient requiring bisphosphonate treatment.
        supports: SUPPORT
