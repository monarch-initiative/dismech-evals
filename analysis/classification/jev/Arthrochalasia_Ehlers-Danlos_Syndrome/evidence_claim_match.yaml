      assertion:
        name: COL1A2 partial-exon deletion biochemical studies
        experimental_model_type: PRIMARY_CELL_CULTURE
        cell_source: Patient-derived cultured dermal fibroblasts
        description: Cultured fibroblasts and collagen peptide/cDNA analysis from a heterozygous family
          showed loss of fifteen nucleotides and five residues, with persistent pNalpha2 chains. The crosslink
          lysine remained; dermal solubility/extraction suggested altered crosslinking but did not map
          every crosslink. The available cache is abstract-only.
        modeled_mechanisms:
        - target: Loss of Exon 6 Sequence from Collagen Transcripts
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Cryptic splicing removes fifteen coding nucleotides from the collagen transcript.
          limitations: Patient-cell observations with limited sampling; no gene correction, tissue-mechanical
            rescue, orthopedic outcome or treatment efficacy was tested. Methods beyond the available
            abstract were inaccessible.
          readouts:
          - name: Partial exon 6 deletion
            target: Loss of Exon 6 Sequence from Collagen Transcripts
            direction: ALTERED
            interpretation: Cryptic splicing removes fifteen coding nucleotides from the collagen transcript.
        - target: Retained Procollagen N-Propeptide
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Mutant pN chains persisted in patient collagen preparations.
          limitations: Patient-cell observations with limited sampling; no gene correction, tissue-mechanical
            rescue, orthopedic outcome or treatment efficacy was tested.
          readouts:
          - name: Persistent pNalpha2 chains
            target: Retained Procollagen N-Propeptide
            direction: ALTERED
            interpretation: Mutant pN chains persisted in patient collagen preparations.
      selected_evidence:
        snippet: These 15 nucleotides were deleted in the splicing of alpha 2(I) pre-mRNA to mRNA as a
          result of inactivation of the 3' splice site of intron 5 by an AG to AC mutation and the activation
          of a cryptic AG splice acceptor site corresponding to positions +14 and +15 of exon 6.
        supports: SUPPORT
