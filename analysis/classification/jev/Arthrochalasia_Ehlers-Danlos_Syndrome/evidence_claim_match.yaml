            term:
              id: MONDO:0007525
              label: Ehlers-Danlos syndrome, arthrochalasia type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: aeds_recessive_overlap_boundary
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How should biallelic non-exon-6 COL1A1 arthrochalasia-like disease be classified?
        attaches_to:
        - genetic#COL1A1
        rationale: A 2026 report describes one ten-month-old child homozygous for exon 31 p.Glu684Lys
          with healthy heterozygous parents. The authors call the variant likely pathogenic using PM1/PM2/PP3/PP5,
          including a prior assertion whose underlying evidence was unavailable. They explicitly distinguish
          an arthrochalasia-like or COL1-related overlap phenotype from the currently recognized dominant
          form. No RNA, N-propeptide processing, helix stability, integrin binding or rescue assay was
          performed. Proposed charge and GFOGER-binding effects remain hypotheses; long-term cognition,
          course and founder origin are unresolved. These observations should not change classic aEDS
          inheritance or its exon 6 mechanism by assumption.
      selected_evidence:
        snippet: Although the p.Glu684Lys substitution is predicted to disrupt integrin–collagen interaction,
          in vivo impairment of this interaction has not been experimentally confirmed for this particular
          variant. Consequently, the functional consequences remain hypothetical.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42353838
      reference_title: 'A Homozygous Missense COL1A1 Variant (p.Glu684Lys) Associated with an Arthrochalasia-like
        Ehlers-Danlos Syndrome Phenotype: A Case Report.'
      evidence_source: OTHER
      quote_role: PRIMARY_RESULT
      explanation: No direct binding or organismal validation.
