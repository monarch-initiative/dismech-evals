        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: aeds_genotype_severity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does COL1A1 exon6 disruption consistently cause more severe disease than COL1A2 disruption?
        attaches_to:
        - genetic#COL1A1
        - genetic#COL1A2
        rationale: Type I collagen contains two alpha1 chains and one alpha2 chain, motivating a mutant-molecule
          stoichiometry hypothesis. Clinical comparisons remain small and overlapping. The 2020 series
          suggested more severe COL1A1 musculoskeletal involvement; the 2012 series reported similar early
          phenotypes, but its three COL1A1 participants came from one family. Neither establishes a deterministic
          prognosis or a universally measured fraction of defective molecules.
      selected_evidence:
        snippet: Part of this similarity can be attributed to the fact that patients 5-7 all come from
          the same family
        supports: SUPPORT
