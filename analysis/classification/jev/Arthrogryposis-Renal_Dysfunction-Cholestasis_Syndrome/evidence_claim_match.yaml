        context: []
      assertion_type: Treatment
      assertion:
        name: Liver-targeted VPS33B lentiviral gene addition (preclinical only)
        description: 'A liver-specific integrating lentiviral vector restored VPS33B and canalicular organization
          in VPS33B-knockout HepG2 cells and improved survival, growth, liver function, fibrosis and bile-canalicular
          structure in liver-specific Vps33b-knockout mice. This is preclinical evidence only: human efficacy
          and safety have not been studied, the approach treats hepatic rather than multisystem disease,
          and it does not replace VIPAS39 in ARCS2. A ubiquitous promoter vector produced liver tumors
          in the mouse safety arm, underscoring that the favorable result applies specifically to the
          liver-specific vector.

          '
        action_category: THERAPEUTIC
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: Here, we show that liver-targeted lentiviral gene therapy safely and effectively rescues
          key features of ARC syndrome in a mouse model following in vivo administration by intravenous
          injection, combined with transient liver macrophage depletion.
        supports: SUPPORT
