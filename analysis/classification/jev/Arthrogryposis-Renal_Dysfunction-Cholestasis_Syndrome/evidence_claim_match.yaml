        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Loss of VPS33B or VIPAS39 Function
        biological_scale: MOLECULAR
        description: 'Germline biallelic loss-of-function variants in VPS33B (15q26.1) or, in VPS33B-negative
          families, in VIPAS39/VIPAR abolish production of functional protein. VPS33B is a Sec1/Munc18-family
          protein containing a Sec1-like domain that regulates vesicle-to-target SNARE complex formation
          and subsequent membrane fusion; VIPAR is its obligate binding partner. Nearly all reported VPS33B
          alleles are null (nonsense, frameshift, splice), and no VPS33B protein is detectable in tissues
          from classical ARC cases. VPS33B accounts for roughly three-quarters of ARC-spectrum cases,
          with VIPAS39 explaining the remainder.

          '
        genes:
        - preferred_term: VPS33B
          modifier: DECREASED
          term:
            id: hgnc:12712
            label: VPS33B
        - preferred_term: VIPAS39
          modifier: DECREASED
          term:
            id: hgnc:20347
            label: VIPAS39
        molecular_functions:
        - preferred_term: syntaxin binding (Sec1/Munc18-type SNARE regulation)
          modifier: DECREASED
          term:
            id: GO:0019905
            label: syntaxin binding
      selected_evidence:
        snippet: we mapped the disease to a 7-cM interval on 15q26.1 and then identified germline mutations
          in the gene VPS33B in 14 kindreds with ARC
        supports: SUPPORT
