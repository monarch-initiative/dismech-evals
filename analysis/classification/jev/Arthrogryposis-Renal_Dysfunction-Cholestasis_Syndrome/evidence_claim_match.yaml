        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Fanconi Renotubular Syndrome
        description: 'The isolated renal phenotype. ARC-spectrum disease includes renal Fanconi syndrome
          as one component of a multisystem disorder, so an infant presenting first with proximal tubulopathy
          can be mistaken for isolated FRTS. The distinguishing move is to look for the extrarenal components
          — cholestasis, ichthyosis, contractures, platelet defect — none of which belong to FRTS. This
          is also the entity MONDO places MONDO:0022948 (the Deal-Barratt-Dillon stub) under, which is
          why the nomenclatural argument in `discussions` turns on it.

          '
        distinguishing_features:
        - Isolated FRTS lacks low-GGT cholestasis, ichthyosis, neurogenic arthrogryposis and the platelet
          alpha-granule defect
        - Renal Fanconi syndrome in ARC-spectrum disease is one component of a CHEVI-trafficking multisystem
          disorder, not the whole phenotype
      selected_evidence:
        snippet: a new syndrome comprising the Fanconi syndrome, ichthyosis, musculoskeletal abnormalities,
          jaundice and diarrhoea
        supports: SUPPORT
