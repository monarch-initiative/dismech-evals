          name: Arthrogryposis-Renal Dysfunction-Cholestasis Syndrome
          disease_term:
            preferred_term: arthrogryposis-renal dysfunction-cholestasis syndrome
            term:
              id: MONDO:0017123
              label: arthrogryposis-renal dysfunction-cholestasis syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fid_icd11_fanconi_anaemia_misparent
        kind: INTERPRETATION
        status: OPEN
        prompt: 'Should the ICD-11 Foundation classification of Fanconi-ichthyosis-dysmorphism syndrome
          as a child of Fanconi anaemia be corrected to renal Fanconi syndrome?

          '
        rationale: 'The ICD-11 Foundation entity icd11f:235762608 defines FID as "the association of Fanconi
          anaemia, ichthyosis, musculo-skeletal anomalies, jaundice, and diarrhoea" and places it under
          Fanconi anaemia. The primary description (PMID:2206896), its MeSH synonym, and MONDO all use
          "Fanconi syndrome" in the renal proximal-tubulopathy sense; MONDO:0022948 is classified under
          MONDO:0001083 Fanconi renotubular syndrome. Nothing in the primary literature describes bone
          marrow failure, pancytopenia, chromosome breakage or cancer predisposition in these infants,
          and the molecular aetiology — biallelic VPS33B/VIPAS39 loss disrupting apical trafficking —
          has no relationship to the Fanconi anaemia DNA interstrand-crosslink repair pathway. The ICD-11
          placement appears to be a homonym error between two unrelated Fanconi eponyms, and it propagates
          into any downstream system that inherits ICD-11 parentage. dismech records the mapping as a
          narrow match - the ICD-11 definition delimits the arthrogryposis-poor FID end of this entry''s
          ARC spectrum - while flagging the parentage as incorrect.

          '
        attaches_to:
        - pathophysiology#Proximal Tubular Apical Transport Failure
      selected_evidence:
        snippet: No evidence of a recognised metabolic disorder was found in any of the six infants
        supports: SUPPORT
