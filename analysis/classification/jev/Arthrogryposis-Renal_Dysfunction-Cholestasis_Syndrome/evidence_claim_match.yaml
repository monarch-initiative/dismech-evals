        name: ARCS2
        display_name: ARCS2 (VIPAS39/VIPAR-related)
        subtype_term:
          preferred_term: arthrogryposis, renal dysfunction, and cholestasis 2
          term:
            id: MONDO:0013255
            label: arthrogryposis, renal dysfunction, and cholestasis 2
        description: 'ARC syndrome caused by biallelic VIPAS39 (formerly C14orf133, protein VIPAR) variants.
          VIPAR is the obligate binding partner of VPS33B within the CHEVI complex. The 2010 discovery
          cohort found VIPAS39 variants in every classical ARC case in which VPS33B mutation and linkage
          had been excluded, but that cohort-level result is not a universal diagnostic partition. A 2024
          systematic review identified only eight published VIPAS39-related cases and found no distinct
          clinical differences from VPS33B-related disease, while documenting both severe and milder courses.

          '
        genes:
        - preferred_term: VIPAS39
          term:
            id: hgnc:20347
            label: VIPAS39
        inheritance:
        - name: Autosomal recessive
      selected_evidence:
        snippet: We detected no differences in clinical symptoms, signs or disease course between subjects
          in VPS33B- and VIPAR-mutated ARC subsets.
        supports: SUPPORT
