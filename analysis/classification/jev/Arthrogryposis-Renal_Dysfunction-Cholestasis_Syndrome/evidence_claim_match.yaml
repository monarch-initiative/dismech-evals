          of intercellular lipids — manifesting clinically as ichthyosis. Skin biopsy typically shows
          mild hyperkeratosis without parakeratosis. Impaired absorption of free fatty acids, secondary
          to cholestasis and intestinal disease, has been proposed as an additional contributor.

          '
