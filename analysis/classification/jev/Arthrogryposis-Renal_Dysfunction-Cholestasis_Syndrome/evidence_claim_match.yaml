      assertion_type: DifferentialDiagnosis
      assertion:
        name: Biliary atresia
        description: 'The dominant differential for any infant with conjugated hyperbilirubinaemia. Distinguished
          by an elevated GGT and by hepatobiliary imaging showing obstruction; in ARC-spectrum disease
          the biliary tree is patent but intrahepatic bile flow is absent, and GGT is normal. Misdirection
          towards biliary atresia risks a hazardous laparotomy or biopsy in a child with a bleeding diathesis.

          '
        distinguishing_features:
        - GGT is usually elevated in biliary atresia and normal or low in ARC-spectrum cholestasis, but
          a high-GGT ARC case is documented, so GGT does not reliably rule ARC out
        - Biliary tract is patent in ARC-spectrum disease despite absent intrahepatic bile flow
      selected_evidence:
        snippet: this case indicates that ARC syndrome cannot be excluded from the differential diagnosis
          of neonatal cholestasis even if high GGT activity is found
        supports: SUPPORT
