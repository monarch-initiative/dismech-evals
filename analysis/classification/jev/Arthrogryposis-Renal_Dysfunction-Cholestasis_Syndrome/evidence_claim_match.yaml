        description: 'Congenital joint contractures in the ARC spectrum are neurogenic rather than primarily
          myopathic or connective-tissue in origin. In the FID series this component was described as
          "musculoskeletal abnormalities" rather than frank arthrogryposis, and its relative mildness
          is precisely why FID was initially separated from ARC. Complete loss-of-function VPS33B alleles
          have since been shown to produce ichthyosis, cholestasis and renal dysfunction without arthrogryposis,
          so its absence does not exclude the diagnosis. Reported skeletal features across the spectrum
          include congenital hip dislocation and vertical talus.

          '
      selected_evidence:
        snippet: an autosomal recessive multisystem disorder characterized by neurogenic arthrogryposis
          multiplex congenita
        supports: SUPPORT
