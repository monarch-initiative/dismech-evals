              label: arthrogryposis-renal dysfunction-cholestasis syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: ARCS1
        display_name: ARCS1 (VPS33B-related)
        subtype_term:
          preferred_term: arthrogryposis, renal dysfunction, and cholestasis 1
          term:
            id: MONDO:0008822
            label: arthrogryposis, renal dysfunction, and cholestasis 1
        description: 'ARC syndrome caused by biallelic VPS33B variants at 15q26.1, accounting for roughly
          three-quarters of cases. VPS33B is the Sec1/Munc18-family subunit of the CHEVI complex. The
          allelic spectrum is dominated by null variants, and no VPS33B protein is detectable in tissues
          from classical cases. Some alleles are associated with attenuated phenotypes and prolonged survival,
          but the functional basis is assay-dependent: c.1225+5G>C retained partial VIPAR interaction
          in a 2012 cell assay yet showed null platelet VPS33B expression in a 2026 sibling study.

          '
        genes:
        - preferred_term: VPS33B
          term:
            id: hgnc:12712
            label: VPS33B
        inheritance:
        - name: Autosomal recessive
      selected_evidence:
        snippet: we mapped the disease to a 7-cM interval on 15q26.1 and then identified germline mutations
          in the gene VPS33B in 14 kindreds with ARC
        supports: SUPPORT
    origin:
