      assertion:
        name: Death in Infancy
        biological_scale: ORGANISM
        description: 'The convergent endpoint. Death follows in infancy from dehydration, acidosis, sepsis,
          or internal haemorrhage. Every infant in the original FID series died by 6 months and most classical
          ARC cases die within the first year. This is not universal: attenuated VPS33B- and VIPAS39-related
          courses can reach childhood or adolescence, and an adult VPS33B-related survivor underwent liver
          transplantation after progressive decompensation. Residual CHEVI function is demonstrated for
          some prolonged-survival alleles but cannot be assumed for all.

          '
      selected_evidence:
        snippet: Most patients with ARC do not survive past the first year of life.
        supports: SUPPORT
