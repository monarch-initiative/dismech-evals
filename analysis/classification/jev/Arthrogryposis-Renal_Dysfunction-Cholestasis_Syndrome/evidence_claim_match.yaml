      reference_title: ARC syndrome with high GGT cholestasis caused by VPS33B mutations.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Counter-evidence bounding the low-GGT rule. A genotype-confirmed ARC patient (compound
        heterozygous VPS33B c.403+2T>A / c.1509-1510insG) had a HIGH GGT on three consecutive tests alongside
        otherwise typical arthrogryposis, renal involvement and ichthyosis. A high GGT therefore does
        not exclude ARC.

        '
