  b1f547935d884a26899c2709b23d381d93fdf2ab7a4666d0e141245905efc0df:
    claim:
      about:
        disease:
          name: Arthrogryposis-Renal Dysfunction-Cholestasis Syndrome
          disease_term:
            preferred_term: arthrogryposis-renal dysfunction-cholestasis syndrome
            term:
              id: MONDO:0017123
              label: arthrogryposis-renal dysfunction-cholestasis syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fid_molecular_confirmation_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Were the six original Deal-Barratt-Dillon infants molecularly VPS33B- or VIPAS39-deficient,
          and does any FID-labelled case exist that is not explained by CHEVI complex loss?

          '
        rationale: 'The 1990 FID series predates the identification of VPS33B (2004) and VIPAS39 (2010),
          so no proband from that series has a confirmed genotype. The assignment of FID to the ARC spectrum
          rests on the phenotypic argument made by Eastham and colleagues in 2001 (PMID:11668108) plus
          the subsequent demonstration that VPS33B-null patients can lack arthrogryposis (PMID:16492441).
          That argument is strong but is not the same as molecular proof for these specific families.
          Because the assignment determines whether FID should be retired as an independent entity or
          retained as a distinct locus, the gap is worth stating explicitly rather than papering over.

          '
        attaches_to:
        - pathophysiology#Biallelic Loss of VPS33B or VIPAS39 Function
        - pathophysiology#Neurogenic Arthrogryposis and Musculoskeletal Anomalies
        proposed_experiments:
        - experiment_id: fid_archival_genotyping
          name: Retrospective genotyping of archival FID material
          description: 'Where archival DNA or fixed tissue from the 1990 Great Ormond Street cohort or
            surviving relatives can be located and consented, sequence VPS33B and VIPAS39 (with copy-number
            analysis) to test directly whether the FID probands carry biallelic CHEVI-complex variants.

            '
          supporting_outcome:
          - FID is a phenotypic variant of VPS33B/VIPAS39-related ARC-spectrum disease and should be retired
            as an independent entity
          refuting_outcome:
          - FID represents a distinct, still-unidentified locus that phenocopies the ARC spectrum
        - experiment_id: fid_phenotype_negative_cohort_sequencing
          name: Exome/genome sequencing of ARC-phenotype, CHEVI-negative infants
          description: 'Sequence infants presenting with renal Fanconi syndrome, low-GGT cholestasis,
            ichthyosis and diarrhoea but no VPS33B or VIPAS39 variant, to determine whether a third locus
            exists that would correspond to a genuinely separate FID entity.

            '
          supporting_outcome:
          - A distinct FID locus exists outside the CHEVI complex
          refuting_outcome:
          - VPS33B and VIPAS39 account for the entire phenotypic spectrum, as suggested when VIPAR mutations
            explained all VPS33B-negative classical ARC cases
      selected_evidence:
        snippet: 'The association of Fanconi syndrome, ichthyosis, dysmorphism, jaundice, and diarrhoea
          has previously been reported as a separate syndrome: our observations indicate that it is part
          of the ARC spectrum.'
        supports: SUPPORT
