        discussion_id: fid_chevi_trafficking_module_candidate
        kind: CURATION_TODO
        status: OPEN
        prompt: 'Should a "CHEVI-complex apical trafficking failure" mechanism module be factored out
          of this entry and its allelic relatives?

          '
        rationale: 'The mechanism curated here — CHEVI/RAB11A-dependent apical recycling failure producing
          simultaneous epithelial polarity loss and defective biogenesis of two lysosome-related organelles
          (lamellar body, platelet alpha-granule) — is shared across ARC syndrome, this FID presentation,
          and the allelic ARKID syndrome, and is conceptually adjacent to other lysosome-related-organelle
          disorders (Hermansky-Pudlak, Chediak-Higashi). No existing dismech module covers it: the `epithelial_barrier_dysfunction`
          and `intestinal_barrier_dysfunction` modules model allergic and inflammatory barrier loss, not
          a constitutive trafficking lesion. No `conforms_to` edge is asserted in this entry for that
          reason. If ARC syndrome and ARKID are curated as separate entries, a shared module becomes worthwhile.

          '
        attaches_to:
        - pathophysiology#Loss of the VPS33B-VIPAR (CHEVI) Tethering Complex
      selected_evidence:
        snippet: corroborate its role in the specialized delivery of cargo in different cell types
        supports: SUPPORT
