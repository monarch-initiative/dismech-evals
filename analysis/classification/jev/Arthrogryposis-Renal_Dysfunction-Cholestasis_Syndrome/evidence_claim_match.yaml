            term:
              id: MONDO:0017123
              label: arthrogryposis-renal dysfunction-cholestasis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed Platelet Alpha-Granule Biogenesis
        biological_scale: CELLULAR
        description: 'VPS33B colocalises with alpha-granule markers in normal megakaryocytes and is required
          to build the alpha-granule, which is a lysosome-related organelle like the lamellar body. Its
          loss produces platelets that are large, pale on blood films, deficient in both soluble and membrane-bound
          alpha-granule proteins, and that show compensatorily increased delta-granules. This is the mechanistic
          basis of the "grey platelet syndrome" morphology reported in two of the six original FID infants
          — a phenocopy of, not an instance of, true NBEAL2/GFI1B grey platelet syndrome.

          '
        cell_types:
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        cellular_components:
        - preferred_term: platelet alpha granule
          modifier: ABSENT
          term:
            id: GO:0031091
            label: platelet alpha granule
        biological_processes:
        - preferred_term: platelet alpha granule organization
          modifier: DECREASED
          term:
            id: GO:0070889
            label: platelet alpha granule organization
      selected_evidence:
        snippet: VPS33B colocalized appreciably with markers of alpha-granules, moderately with late endosomes/lysosomes,
          minimally with delta-granules/lysosomes, and not with cis-Golgi complexes.
        supports: SUPPORT
    origin:
