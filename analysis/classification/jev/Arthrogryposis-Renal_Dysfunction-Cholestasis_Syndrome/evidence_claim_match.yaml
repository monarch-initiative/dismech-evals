        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'Uniformly lethal in the index FID series — all six infants died by 6 months of age
          — and ARC-spectrum disease more broadly kills most affected infants within the first year of
          life. The burden combines multiorgan failure (renal solute wasting with acidosis and dehydration,
          cholestatic liver disease, malabsorptive diarrhoea, failure to thrive), a bleeding diathesis
          that makes diagnostic biopsy hazardous, recurrent sepsis, and the absence of any approved disease-modifying
          therapy.

          '
      selected_evidence:
        snippet: Most patients with ARC do not survive past the first year of life.
        supports: SUPPORT
