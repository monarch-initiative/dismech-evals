        prompt: 'Should MONDO:0022948 (Deal Barratt Dillon syndrome) be obsoleted and merged into, or
          asserted as a subclass of, MONDO:0017123 arthrogryposis-renal dysfunction-cholestasis syndrome?

          '
        rationale: 'MONDO:0022948 is an unreconciled legacy class. It has no textual definition, no gene
          association, and no OMIM xref - only Genetic and Rare Diseases Information Center, MEDGEN, MeSH
          and UMLS cross-references - and it is classified under MONDO:0001083 Fanconi renotubular syndrome.
          By contrast MONDO:0017123 has an Orphanet-sourced definition, an OMIMPS xref, and two gene-defined
          children (MONDO:0008822 VPS33B, MONDO:0013255 VIPAS39). The primary literature closed this gap
          in 2001: PMID:11668108 concluded that the Fanconi syndrome-ichthyosis-dysmorphism-jaundice-diarrhoea
          association "is part of the ARC spectrum", and the molecular basis was established in 2004 and
          2010. So the two MONDO classes denote the same patients, one of them without any mechanistic
          grounding. dismech anchors on MONDO:0017123 and records MONDO:0022948 as a close match; the
          ontology-side fix is out of scope here but worth filing upstream.

          '
        attaches_to:
        - pathophysiology#Biallelic Loss of VPS33B or VIPAS39 Function
      selected_evidence:
        snippet: 'The association of Fanconi syndrome, ichthyosis, dysmorphism, jaundice, and diarrhoea
          has previously been reported as a separate syndrome: our observations indicate that it is part
          of the ARC spectrum.'
        supports: SUPPORT
