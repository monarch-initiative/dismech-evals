              label: arthrogryposis-renal dysfunction-cholestasis syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Fanconi anemia
        description: 'Not a clinical mimic but a persistent nomenclatural trap, entered through this entry''s
          historical FID synonym. The "Fanconi" in Fanconi-ichthyosis-dysmorphism syndrome denotes renal
          Fanconi syndrome (proximal tubulopathy), not Fanconi anaemia (the DNA interstrand-crosslink
          repair and bone marrow failure disorder). The ICD-11 Foundation entry for FID both defines it
          as an association with "Fanconi anaemia" and classifies it as a child of Fanconi anaemia; MONDO
          instead places the same entity under Fanconi renotubular syndrome, which matches the primary
          literature.

          '
        distinguishing_features:
        - ARC-spectrum disease has proximal renal tubulopathy with no reported DNA crosslinker sensitivity;
          Fanconi anemia is defined by chromosome breakage on diepoxybutane/mitomycin C testing
        - ARC-spectrum disease causes early-infantile death from acidosis, dehydration and sepsis; Fanconi
          anemia presents with progressive bone marrow failure and cancer predisposition over years
        - ARC-spectrum disease has low-GGT cholestasis and ichthyosis, neither of which is characteristic
          of Fanconi anemia
      selected_evidence:
        snippet: a new syndrome comprising the Fanconi syndrome, ichthyosis, musculoskeletal abnormalities,
          jaundice and diarrhoea
        supports: SUPPORT
