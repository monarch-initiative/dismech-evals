      assertion_type: Subtype
      assertion:
        name: AMC2
        display_name: Arthrogryposis multiplex congenita 2, neurogenic type (ERGIC1)
        subtype_term:
          preferred_term: arthrogryposis multiplex congenita 2, neurogenic type
          term:
            id: MONDO:0008823
            label: arthrogryposis multiplex congenita 2, neurogenic type
        genes:
        - preferred_term: ERGIC1
          term:
            id: hgnc:29205
            label: ERGIC1
        description: 'A homozygous pathogenic ERGIC1 variant identified in a large Israeli Arab kindred
          previously mapped to chromosome 5qter. ERGIC1 encodes a cycling membrane protein with a possible
          role in endoplasmic reticulum to Golgi transport, so the authors propose protein trafficking,
          rather than a contractile or myelin lesion, as the underlying abnormality. Note that the bound
          term does double duty in MONDO: it carries the ERGIC1 OMIM entity (OMIM:208100) and is also
          the parent of arthrogryposis-renal dysfunction-cholestasis syndrome (MONDO:0017123, VPS33B and
          VIPAS39), which is curated separately here. A causal-gene query against this term therefore
          returns VPS33B and VIPAS39 alongside ERGIC1; only ERGIC1 is bound on this row, because only
          ERGIC1 is the gene of the AMC2 concept itself.'
      selected_evidence:
        snippet: Using whole exome sequencing, we have now identified homozygous pathogenic variant in
          the ERGIC1 gene within the previously defined linked region.
        supports: SUPPORT
