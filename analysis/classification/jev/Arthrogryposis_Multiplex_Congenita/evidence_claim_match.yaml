      assertion:
        name: Distal arthrogryposis group
        description: Distal arthrogryposis diagnoses emphasize hand and foot contractures with comparatively
          less proximal involvement. Individual disorders in this group can have defined genes and inheritance
          modes, which should be recorded only after the specific diagnosis is established.
        distinguishing_features:
