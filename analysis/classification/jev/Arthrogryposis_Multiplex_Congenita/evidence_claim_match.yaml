      assertion_type: DifferentialDiagnosis
      assertion:
        name: Fetal akinesia deformation sequence
        description: Fetal akinesia deformation sequence is a severe overlapping deformation pattern caused
          by marked prenatal immobilization. Multiple contractures may coexist with pulmonary hypoplasia,
          micrognathia, growth restriction, short umbilical cord, and polyhydramnios. It is not synonymous
          with all AMC, and the cause of the akinesia still requires investigation.
        distinguishing_features:
        - Pulmonary hypoplasia and craniofacial or broader deformation findings suggest a severe fetal-akinesia
          sequence.
        - Identifying the neurologic, neuromuscular, environmental, or mechanical cause of akinesia is
          necessary for classification and counseling.
      selected_evidence:
        snippet: Diagnostic evaluation of patients with this group of anomalies should include the identification
          of the underlying pathologic process (etiology of the akinesia)
        supports: SUPPORT
