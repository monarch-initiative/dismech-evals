      assertion_type: DifferentialDiagnosis
      assertion:
        name: Distal arthrogryposis group
        description: Distal arthrogryposis diagnoses emphasize hand and foot contractures with comparatively
          less proximal involvement. Individual disorders in this group can have defined genes and inheritance
          modes, which should be recorded only after the specific diagnosis is established.
        distinguishing_features:
        - Distal joints predominate and proximal joint involvement is less extensive than in Amyoplasia
          in a pediatric cohort.
        - A compatible family history or molecular result supports a specific distal arthrogryposis diagnosis,
          not generic AMC.
      selected_evidence:
        snippet: Children with DA had less involvement of the proximal joints than those in the two other
          groups.
        supports: SUPPORT
