      assertion_type: Pathophysiology
      assertion:
        name: Etiology-specific fetal hypomobility or akinesia
        description: Reduced or absent fetal movement is a mechanistically supported route to contractures
          when an upstream neurologic, neuromuscular, muscular, mechanical, or environmental process restricts
          movement. Evidence for sufficiency comes mainly from experimental immobilization. This node
          represents a bounded causal branch and is not asserted for every person meeting the AMC definition.
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: It is suggested that this phenotype is not specific but, rather, represents a deformation
          sequence which results from fetal immobilization or akinesia.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
