      assertion_type: Pathophysiology
      assertion:
        name: Anterior horn motor neuron loss
        description: 'The motor command fails at its origin: the anterior horn motor neurons of the ventral
          spinal cord are absent or severely depleted, with the peripheral nerve and the muscle secondarily
          affected. GLE1 encodes the mRNA export mediator whose mutation underlies LCCS1 and LAAHD, the
          two GLE1-related AMC subtypes, and the autopsy series that delineated LAAHD found a paucity
          of anterior horn motor neurons in the spinal cord together with neurogenic muscular atrophy
          in every infant examined. The GLE1 report concludes that mRNA processing is a critical molecular
          mechanism in motoneuron development and maturation, which is the basis for binding motor neuron
          differentiation on this node.'
        mechanism_confidence: PROVISIONAL
        biological_scale: CELLULAR
        genes:
        - preferred_term: GLE1
          term:
            id: hgnc:4315
