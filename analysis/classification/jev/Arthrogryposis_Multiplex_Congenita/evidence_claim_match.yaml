        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ERGIC1-associated etiologic branch
        description: ERGIC1 is an established cause of congenital arthrogryposis, but the lesion it produces
          is not localized to a cell type or a process by the reported cases, so this node binds neither.
          MONDO labels the form neurogenic and the original Israeli Arab kindred was reported as the neuropathic
          type; the reporting authors propose protein trafficking on the basis of a possible role for
          ERGIC1 in transport between endoplasmic reticulum and Golgi, which is how they state it. A later
          family with complete loss of ERGIC1 expression had a relatively mild phenotype and a neurological
          examination that never pointed towards a neuromuscular disorder, so no myelin, anterior horn
          cell, or muscle lesion is asserted here.
        notes: 'Searched for a nerve or muscle pathology that would place ERGIC1 on the hypomyelination
          or anterior horn node: a PubMed title/abstract search for ERGIC1 returns 17 records, of which
          three concern arthrogryposis (PMID:28317099, PMID:34037256, PMID:42140882). None reports nerve
          or muscle histology; PMID:34037256 states explicitly that no muscular investigation was indicated
          in its family. Bind a cell type or biological process here only if such a report appears.'
        mechanism_confidence: HYPOTHETICAL
        biological_scale: CELLULAR
        genes:
        - preferred_term: ERGIC1
          term:
            id: hgnc:29205
            label: ERGIC1
      selected_evidence:
        snippet: ERGIC1 encodes a cycling membrane protein which has a possible role in transport between
          endoplasmic reticulum and Golgi.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
