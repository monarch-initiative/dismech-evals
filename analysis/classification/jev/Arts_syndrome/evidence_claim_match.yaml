      assertion_type: Inheritance
      assertion:
        name: X-linked recessive inheritance
        description: Arts syndrome is inherited in an X-linked manner; hemizygous males are typically
          more severely affected, while heterozygous females may be asymptomatic or variably affected
          because of X-chromosome inactivation.
        inheritance_term:
          preferred_term: X-linked recessive inheritance
          term:
            id: HP:0001419
            label: X-linked recessive inheritance
      selected_evidence:
        snippet: PRS deficiency is inherited in an X-linked manner. If the mother of the proband has a
          PRPS1 pathogenic variant, the chance of transmitting it in each pregnancy is 50%; if the father
          of the proband has a PRPS1 pathogenic variant, he will transmit it to all his daughters and
          none of his sons.
        supports: SUPPORT
