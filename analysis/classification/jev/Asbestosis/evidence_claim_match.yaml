        description: Alveolar macrophages attempt to engulf the deposited fibers, but long fibers physically
          cannot be fully internalized. This "frustrated phagocytosis" leaves macrophages persistently
          activated and unable to clear the fiber, with leakage of lysosomal contents at the incomplete
          phagosome.
        role: driver
        cell_types:
