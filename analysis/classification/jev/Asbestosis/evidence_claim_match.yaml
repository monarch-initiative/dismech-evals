  b52366cd8f827bb5c11a82aab27d5537bffcc6ef2450fbffa79d703141a49b7a:
    claim:
      about:
        disease:
          name: Asbestosis
          disease_term:
            preferred_term: asbestosis
            term:
              id: MONDO:0016466
              label: asbestosis
        context: []
      assertion_type: Environmental
      assertion:
        name: Occupational asbestos inhalation
        exposure_term:
          preferred_term: exposure to asbestos
          term:
            id: ECTO:9000033
            label: exposure to asbestos
        environment_context:
          preferred_term: asbestos dust
          term:
            id: ENVO:02000106
            label: asbestos dust
        chemicals:
        - asbestos
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
          exposure_route:
          - classification_value: INHALATION
            notes: Inhalation of airborne fibres is the route for asbestosis. Ingestion is the route implicated
              in the gastrointestinal cancers the European schedule added to its suspected list in 2025
              (Annex II 2.309-2.311).
          exposure_duration:
          - classification_value: CHRONIC
            notes: ATSDR chronic duration (365 days and longer). Asbestosis is dose-dependent on cumulative
              fibre burden with a 15-40 year latency.
          iarc_carcinogen_group:
            classification_value: GROUP_1
            notes: 'IARC classifies all forms of asbestos as Group 1, carcinogenic to humans. Recorded
              on the exposure because it is a property of the agent: asbestosis is a fibrosis, not a cancer,
              and the Group 1 listing refers to the malignant outcomes of the same exposure (lung cancer,
              mesothelioma, laryngeal and ovarian cancer).'
          ghs_health_hazard_class:
          - classification_value: CARCINOGENICITY
          - classification_value: STOT_REPEATED_EXPOSURE
            notes: The fibrotic lung injury of asbestosis is target-organ toxicity from repeated exposure,
              distinct from the carcinogenicity classification.
          exposome_domain:
          - classification_value: SPECIFIC_EXTERNAL
        description: Inhalation of airborne asbestos fibers during mining, milling, shipbuilding, insulation,
          construction, brake-lining, and textile work is the dominant exposure route. Both amphibole
          fibers (crocidolite, amosite) and, to a lesser fibrogenic degree, serpentine chrysotile can
          cause asbestosis; long, thin, biopersistent amphibole fibers are the most fibrogenic. Risk is
          dose-dependent (cumulative fiber burden) and paraoccupational/household and environmental exposures
          also occur.
      selected_evidence:
        snippet: The first identified disease was asbestosis, a type of incurable pneumoconiosis caused
          by asbestos dust and fibres.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
