      assertion_type: Pathophysiology
      assertion:
        name: Biopersistent asbestos fiber deposition
        biological_scale: TISSUE
        description: Inhaled asbestos fibers with a high length-to-width (aspect) ratio deposit at alveolar
          duct bifurcations and in the distal airspaces. Amphibole fibers (crocidolite, amosite) are cleared
          poorly and are retained for decades (biopersistence); over time host cells encase retained fibers
          in an iron-protein coat, forming ferruginous asbestos bodies. This retained, biopersistent fiber
          burden is the injurious insult that initiates the disease.
        conforms_to: fibrotic_response#Tissue Injury
        role: trigger
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        - preferred_term: alveolar type I epithelial cell
          term:
            id: CL:0002062
            label: pulmonary alveolar type 1 cell
        - preferred_term: alveolar type II epithelial cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: An inability to clear asbestos from the lower respiratory tract initiates a host process
          of iron biomineralization (i.e., asbestos body formation).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
