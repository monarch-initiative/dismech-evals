          - classification_value: CHEMICAL
          exposure_route:
          - classification_value: INHALATION
            notes: Inhalation of airborne fibres is the route for asbestosis. Ingestion is the route implicated
              in the gastrointestinal cancers the European schedule added to its suspected list in 2025
              (Annex II 2.309-2.311).
          exposure_duration:
          - classification_value: CHRONIC
            notes: ATSDR chronic duration (365 days and longer). Asbestosis is dose-dependent on cumulative
