      assertion:
        name: Pro-fibrotic mediator release
        biological_scale: CELLULAR
        description: 'Activated macrophages and injured epithelial cells release pro-fibrotic growth factors
          - chiefly TGF-beta, plus PDGF, IGF-1, and fibronectin - that shift the chronic inflammatory
          response toward tissue remodeling. This mediator surge is the bridge from inflammation to mesenchymal
          activation. TGF-beta is the mediator with direct experimental support here: forced pulmonary
          TGF-beta1 expression is by itself sufficient to produce fibroproliferative lung disease. The
          accompanying PDGF, IGF-1, and fibronectin claims are drawn from the wider fibrosis literature
          and are not separately evidenced in this entry.'
        role: driver
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        biological_processes:
        - preferred_term: transforming growth factor beta production
          term:
            id: GO:0071604
            label: transforming growth factor beta production
          modifier: INCREASED
      selected_evidence:
        snippet: both strains of mice were treated intratracheally with an adenovirus vector (AdV), which
          transduces expression of active transforming growth factor (TGF)-beta(1) in the lungs, producing
          fibroproliferative lung disease
        supports: SUPPORT
