          plausibly by reducing detoxification of fiber-generated reactive electrophiles and oxidants.
          The evidence is conflicting: an early cross-sectional study found increased risk, whereas a
          later, larger nested case-control study found no GSTM1 association.'
        relationship_type: SUSCEPTIBILITY
