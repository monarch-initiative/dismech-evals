              label: Asherman syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cellular_origins
        kind: KNOWLEDGE_GAP
        prompt: Which cells contribute to the fibrogenic effector pool in human adhesion disease?
        rationale: Partial EMT markers, CD31/alpha-SMA co-localization and transcriptomic intermediate
          states do not by themselves trace cellular origin. The rat experiment uses scraping plus LPS
          and has no endothelial lineage tracing. Lack of an EndMT conclusion in the human atlas is not
          a negative test of the hypothesis; resident stromal fibroblasts cannot be excluded.
        attaches_to:
        - pathophysiology#Epithelial Mesenchymal Marker Shift
        - pathophysiology#Endothelial Mesenchymal Marker Coexpression
        - pathophysiology#Stromal Fibrogenic Activation
        proposed_experiments:
        - experiment_id: exp_lineage_resolved_fibrosis
          name: Lineage-resolved fibrosis with matched human spatial validation
          description: Use inducible epithelial, endothelial and stromal lineage tracing plus selective
            perturbations in a defined injury model; quantify lineage-labelled matrix-producing cells.
            Spatial human RNA/protein coexpression can validate states but must not be treated as equivalent
            to prospective lineage tracing.
      selected_evidence:
        snippet: Immunofluorescence co-localization of CD31 and a-SMA showed that 14 days after moulding,
          double positive cells for CD31 and a-SMA could be clearly observed in the endometrium.
        supports: SUPPORT
