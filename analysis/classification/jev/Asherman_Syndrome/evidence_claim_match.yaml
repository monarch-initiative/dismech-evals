            preferred_term: Asherman syndrome
            term:
              id: MONDO:0015299
              label: Asherman syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Postoperative estrogen with or without progestin
        description: The 2017 guideline gives a Grade B recommendation that estrogen may reduce recurrence.
          A later single-centre randomized trial found no significant adhesion, pregnancy or living-child
          benefit from adding estrogen in selected women with previously regular ovulatory cycles, successful
          adhesiolysis and an inert IUD in both groups. Of 114 analyzed women, second-look recurrence
          was 16/59 versus 14/55; living-child outcomes were 40/59 versus 33/55. Wide uncertainty, selection
          and the shared barrier limit extrapolation to every regimen or anovulatory patient. Side effects
          were frequent in the estrogen group. These results do not demonstrate equivalence or a universal
          regenerative effect.
      selected_evidence:
        snippet: Of the women in usual care, 89.8% got pregnant within 3 years, and 67.8% got a living
          child; this was 83.6% and 60.0%, respectively, in the no-estrogen group (p = 0.33 and p = 0.39,
          respectively).
        supports: SUPPORT
