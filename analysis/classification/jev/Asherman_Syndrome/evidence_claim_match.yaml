    claim:
      about:
        disease:
          name: Asherman_Syndrome
          disease_term:
            preferred_term: Asherman syndrome
            term:
              id: MONDO:0015299
              label: Asherman syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_regenerative_capacity
        kind: KNOWLEDGE_GAP
        prompt: Which injury and niche features determine regeneration versus persistent scarring?
        rationale: Residual epithelial populations, injury depth, hormonal state, inflammatory context
          and niche interactions may all matter. Existing evidence does not identify one necessary switch
          or prove that complete progenitor depletion is required. The contribution of epithelial/stromal
          plasticity is species- and injury-dependent.
        attaches_to:
        - pathophysiology#Endometrial Basal Layer Injury
        - pathophysiology#Excessive Endometrial Matrix Deposition
        proposed_experiments:
        - experiment_id: exp_matched_injury_niche
          name: Matched longitudinal injury and repair profiling
          description: Compare defined injury depths and hormonal states with serial tissue histology,
            epithelial coverage and validated lineage tracing in an appropriate model. Match human observational
            samples by cycle, treatment and sampling location rather than infer temporality from one biopsy.
      selected_evidence:
        snippet: In the endometrium, the diversion of healing towards a fibrotic outcome is often attributed
          to the obliteration of the stem cell reservoir during injury. However, this model is complicated
          by the observation that diverse cell populations may contribute to re-epithelialization of the
          endometrium
        supports: SUPPORT
