        publication: PMID:37302615
        description: Erastin-induced epithelial stress promotes EMT/fibrosis markers, whereas direct erastin
          does not induce stromal fibrogenic differentiation. Transfer of stimulated epithelial supernatant
          promotes the stromal response.
        notes: The abstract calls this a co-culture experiment; the accessible record does not establish
          simultaneous contact culture, the necessary soluble mediator, dose or donor replication. No
          mediator-neutralization result or direct epithelial lineage conversion is inferred.
        modeled_mechanisms:
        - target: Epithelial Profibrotic Supernatant Activity
          relationship: MEASURES
          description: Supernatant carries transferable fibrogenic activity.
        - target: Stromal Fibrogenic Activation
          relationship: PERTURBS
          description: HESC fibrotic response increases after stimulated epithelial supernatant.
          readouts:
          - name: Stromal fibrotic response
            target: Stromal Fibrogenic Activation
            direction: INCREASED
            interpretation: HESC fibrotic response increases after stimulated epithelial supernatant.
      selected_evidence:
        snippet: In vitro experiments showed that erastin-induced ferroptosis promoted EMT and fibrosis
          in endometrial epithelial cells (P < 0.05), but did not lead to pro-fibrotic differentiation
          in endometrial stromal cells (HESCs).
        supports: SUPPORT
