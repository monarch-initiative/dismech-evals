        name: Treatment of confirmed genital tuberculosis
        description: Treat confirmed genital tuberculosis with appropriate multidrug antimicrobial care
          and infectious-disease input; adhesions and infertility may persist after microbiological treatment.
          One reported patient received two months of rifampin, isoniazid, pyrazinamide and ethambutol,
          followed by rifampin/isoniazid, with an extension after persistent acid-fast staining despite
          negative culture. Cyclic spotting returned only during subsequent estrogen priming; neither
          antibiotic-only menstrual recovery nor restored fertility was demonstrated.
