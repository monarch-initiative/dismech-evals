        context: []
      assertion_type: Definition
      assertion:
        name: Symptomatic intrauterine adhesion disease
        definition_type: DIAGNOSTIC_CRITERIA
        description: Intrauterine or endocervical adhesions accompanied by attributable menstrual disturbance,
          pain or reproductive dysfunction constitute the symptomatic syndrome; every symptom is not required.
        inclusion_criteria:
        - preferred_term: Intrauterine adhesions established by cavity assessment
        - preferred_term: Attributable pain, menstrual disturbance or subfertility in any combination
      selected_evidence:
        snippet: The terms “Asherman syndrome” and IUAs are often used interchangeably, although the syndrome
          requires the constellation of signs and symptoms (in this case, pain, menstrual disturbance,
          and subfertility in any combination) related to the presence of IUAs
        supports: SUPPORT
