        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_human_niche_and_organoid_scope
        kind: KNOWLEDGE_GAP
        prompt: How much of the human atlas signature reflects disease, hormonal preparation or cell recovery?
        rationale: The human atlas included nine women with moderate or severe AS, five moderate and four
          severe, aged 34–42. AS biopsies were HRT-synchronized and obtained at least 1 cm from visible
          adhesions, while controls had natural cycles. Ten historical secretory controls and a twelve-sample
          WOI comparator overlap; they are not 22 independent controls. Recovered cell proportions, CellChat
          communication and RNAscope localization do not directly measure tissue-volume fractions, cell-death
          rates, cytokine secretion or angiogenesis. Organoids use three overlapping AS donors and three
          controls; P2 enrichment and XAV939 may mask differences. The paper provides no before/after
          cell-transplant efficacy comparison.
        attaches_to:
        - pathophysiology#Reduced Endometrial Epithelial Abundance
        - pathophysiology#Reduced WNT Communication Signature
        - pathophysiology#Reduced NOTCH Communication Signature
      selected_evidence:
        snippet: A potential confounding element in this work may arise due to the comparison of AS patients
          undergoing hormonal replacement therapy (HRT) cycles with control patients undergoing natural
          cycles
        supports: SUPPORT
