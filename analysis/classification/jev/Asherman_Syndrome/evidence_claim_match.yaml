      assertion_type: Discussion
      assertion:
        discussion_id: gap_clinical_translation_and_adjuncts
        kind: KNOWLEDGE_GAP
        prompt: Which postoperative adjuncts improve live birth, beyond reducing visible adhesions?
        rationale: Cavity scores, recurrence, menstrual recovery, pregnancy and live birth are distinct
          endpoints. Some barriers reduce short-term reformation, while comparative fertility benefit
          remains uncertain. The newer estrogen trial in selected ovulatory women with an IUD found no
          significant added benefit, without proving equivalence for every regimen. A 2026 hydrogel trial
          improves a short-term anatomical endpoint in the adhesiolysis subgroup; this does not establish
          long-term fertility or molecular regeneration. Animal drug timing and species-specific exposure
          preclude routine T3, rapamycin or ferrostatin treatment claims.
        attaches_to:
        - pathophysiology#Intrauterine Adhesion Formation
        - pathophysiology#Reduced Receptive Endometrial Surface
        proposed_experiments:
        - experiment_id: exp_adjunct_live_birth
          name: Controlled adjunct trial with reproductive follow-up
          description: Compare well-defined postoperative regimens with standardized baseline severity,
            second-look assessment and subsequent live-birth follow-up. Report infertility co-factors,
            repeat procedures, adverse effects and subgroup uncertainty; use anatomical outcomes as intermediate
            endpoints rather than validated fertility surrogates.
      selected_evidence:
        snippet: Semi-solid barriers such as hyaluronic acid and auto-cross-linked hyaluronic acid gel
          reduce adhesion reformation. At this time, their effect on post-treatment pregnancy rates is
          unknown. Grade A
        supports: SUPPORT
