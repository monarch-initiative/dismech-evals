        - target: Excessive Endometrial Matrix Deposition
          relationship: PARTIALLY_RECAPITULATES
          description: The injury model produces histological fibrosis, with model-specific inflammatory
            injury.
          limitations: Acute dual injury does not reproduce every human procedure or chronic niche.
          readouts:
          - name: Histological fibrotic area at day 7
            target: Excessive Endometrial Matrix Deposition
            direction: INCREASED
            interpretation: Masson-stained fibrosis area is increased versus the model control.
