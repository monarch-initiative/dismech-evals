      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: asparagine_insufficiency_model
        hypothesis_label: Context-dependent cellular asparagine insufficiency model
        status: CANONICAL
        description: Reduced ASNS activity limits de novo asparagine synthesis. Cells in environments
          with limited extracellular asparagine, especially within the developing nervous system, cannot
          fully compensate, impairing proliferation and broader metabolism and contributing to abnormal
          brain growth.
      selected_evidence:
        snippet: significant decrements in TCA cycle intermediates and anaplerotic substrates in ASNS-deficient
          cells challenged with Asn deprivation
        supports: SUPPORT
    origin:
