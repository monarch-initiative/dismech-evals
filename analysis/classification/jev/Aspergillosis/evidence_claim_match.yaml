      assertion:
        name: TLR4
        relationship_type: SUSCEPTIBILITY
        notes: 'Donor TLR4 haplotypes carrying the D299G and T399I substitutions increased the risk of
          invasive aspergillosis in recipients of unrelated-donor allogeneic haematopoietic-cell transplants,
          in a discovery cohort and a replication cohort. Note the direction of the effect: it is the
          donor''s genotype, not the recipient''s, because the relevant innate cells are donor-derived
          after engraftment.'
        gene_term:
          preferred_term: TLR4
          term:
            id: hgnc:11850
            label: TLR4
      selected_evidence:
        snippet: In the discovery study, two donor TLR4 haplotypes (S3 and S4) increased the risk of invasive
          aspergillosis (adjusted hazard ratio for S3, 2.20; 95% confidence interval [CI], 1.14 to 4.25;
          P=0.02; adjusted hazard ratio for S4, 6.16; 95% CI, 1.97 to 19.26; P=0.002).
        supports: SUPPORT
