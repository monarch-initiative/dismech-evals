              id: MONDO:0005657
              label: aspergillosis
        context: []
      assertion_type: Genetic
      assertion:
        name: CARD9
        relationship_type: SUSCEPTIBILITY
        notes: Autosomal recessive CARD9 deficiency causes invasive fungal disease in otherwise healthy
          children and adults. CARD9 sits downstream of the C-type lectin receptors — the dectin-1 arm
          this entry models as the first recognition step — and its loss impairs myeloid cytokine and
          chemokine output, neutrophil fungal killing in vitro, and neutrophil recruitment in vivo. Every
          causal fungus reported in these patients belongs to the Ascomycota, Aspergillus among them.
          Like CYBB, this is a susceptibility relationship rather than a cause of aspergillosis as such.
        gene_term:
          preferred_term: CARD9
          term:
            id: hgnc:16391
            label: CARD9
      selected_evidence:
        snippet: 'Strikingly, all the causal fungi belonged to the phylum Ascomycota: commensal Candida
          and saprophytic Trychophyton, Aspergillus, Phialophora, Exophiala, Corynesprora, Aureobasidium,
          and Ochroconis.'
        supports: SUPPORT
