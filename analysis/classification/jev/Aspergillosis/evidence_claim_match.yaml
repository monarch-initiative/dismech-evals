        context: []
      assertion_type: Treatment
      assertion:
        name: Amphotericin B
        description: 'Polyene that binds and sequesters membrane ergosterol, forming pores that release
          intracellular ions, and that additionally drives reactive oxygen species accumulation. Because
          it acts on ergosterol itself rather than on the biosynthetic enzyme the azoles inhibit, a cyp51A
          target-site substitution does not by itself confer polyene cross-resistance — which is the basis
          for its role in azole-resistant disease, alongside use where triazoles are contraindicated.
          This is not a claim of universal polyene activity against Aspergillus: A. terreus is characteristically
          amphotericin B resistant by an unrelated oxidative-stress-response mechanism. Nephrotoxicity
          limits the deoxycholate formulation; lipid formulations are used in practice.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Antifungal Therapy
          term:
            id: NCIT:C15704
            label: Antifungal Therapy
          therapeutic_agent:
          - preferred_term: amphotericin B
            term:
              id: CHEBI:2682
              label: amphotericin B
      selected_evidence:
        snippet: First, several molecules of AMB incorporate into the fungal lipid bilayer and bind to
          ergosterol. By ergosterol sequestration, pores are formed, and both the ions (K+, Mg2+, Ca2+,
          and Cl−) and electrolyte glucose are released.
        supports: SUPPORT
