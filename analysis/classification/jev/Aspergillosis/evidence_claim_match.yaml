        description: 'Aspergillus species are intrinsically resistant to fluconazole, so identifying the
          organism as Aspergillus excludes that agent before any susceptibility result and mandates a
          mould-active triazole (voriconazole, isavuconazole, posaconazole, itraconazole) or amphotericin
          B. This lineage-determined exclusion is deliberately kept separate from the acquired environmental
          cyp51A resistance modelled above: one is fixed by taxonomy and gates empiric therapy, the other
          is isolate-dependent and requires susceptibility testing to detect.'
      selected_evidence:
        snippet: Whereas some intrinsic resistance has been found naturally, e.g., fluconazole-resistant
          ... and Aspergillus species
        supports: SUPPORT
