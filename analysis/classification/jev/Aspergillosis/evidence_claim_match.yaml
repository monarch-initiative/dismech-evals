        context: []
      assertion_type: Diagnosis
      assertion:
        name: Composite criteria for chronic pulmonary aspergillosis
        description: Chronic pulmonary aspergillosis has no single confirmatory test. The diagnosis requires
          a cavity or nodules on thoracic imaging, direct or immunological evidence of Aspergillus, exclusion
          of alternatives, and all of it persisting for at least three months. The persistence requirement
          is what separates this from subacute invasive aspergillosis, which progresses in under three
          months and is managed as invasive disease.
        diagnosis_term:
          preferred_term: composite clinical, radiological and immunological assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: 'The diagnosis of CPA requires a combination of characteristics: one or more cavities
          with or without a fungal ball present or nodules on thoracic imaging, direct evidence of Aspergillus
          infection (microscopy or culture from biopsy) or an immunological response to Aspergillus spp.
          and exclusion of alternative diagnoses, all present for at least 3 months.'
        supports: SUPPORT
    origin:
