      assertion_type: Subtype
      assertion:
        name: Chronic Pulmonary
        display_name: Chronic pulmonary aspergillosis (CCPA and chronic fibrosing forms)
        description: 'Slowly progressive cavitary and fibrosing lung infection in a patient with prior
          or current structural lung disease (treated tuberculosis, COPD, sarcoidosis, prior thoracic
          surgery) but without significant systemic immunocompromise. Chronic cavitary pulmonary aspergillosis
          is the commonest form and may progress to chronic fibrosing pulmonary aspergillosis. No subtype_term
          is bound: MONDO carries a term for pulmonary aspergilloma (bound on the Aspergilloma subtype)
          and for invasive aspergillosis, but none for chronic cavitary or chronic fibrosing pulmonary
          aspergillosis, which are covered only by the parent term MONDO:0005657 already on this entry.'
      selected_evidence:
        snippet: The most common form of CPA is chronic cavitary pulmonary aspergillosis (CCPA), which
          untreated may progress to chronic fibrosing pulmonary aspergillosis.
        supports: SUPPORT
