          marker of invasive disease. The trade-off between cut-offs is the point: raising the optical
          density index from 0.5 to 1.5 moves specificity from 81% to 93% but drops sensitivity from 82%
          to 61%, so the threshold has to be chosen against the pre-test probability of the population
          being tested.'
