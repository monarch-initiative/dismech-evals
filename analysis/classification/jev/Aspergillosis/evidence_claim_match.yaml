      assertion_type: Treatment
      assertion:
        name: Anti-type-2 biologic therapy for ABPA
        description: For ABPA that stays dependent on oral corticosteroids, biologics directed at the
          type-2 pathway are used as steroid-sparing add-ons. A systematic review and meta-analysis of
          86 studies covering 346 patients found that the anti-IgE antibody omalizumab reduced exacerbation
          rates, oral corticosteroid dose and total IgE while improving FEV1; dupilumab and mepolizumab
          showed the same direction on an individual-patient-data meta-analysis. This is adjunctive and
          the evidence is pooled case series rather than randomised trials, which is why it sits behind
          corticosteroids and itraconazole here.
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
