          term:
            id: CL:0000775
            label: neutrophil
      selected_evidence:
        snippet: This is illustrated by the prevalence of Aspergillus infections in patients with neutropenia
          or phagocyte functional defects, such as chronic granulomatous disease.
        supports: SUPPORT
