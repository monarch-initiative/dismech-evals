            label: invasive aspergillosis
        description: Acute, tissue-invasive infection of the severely immunocompromised host — prolonged
          neutropenia after chemotherapy or allogeneic transplantation, high-dose corticosteroids, chronic
          granulomatous disease — and, increasingly, of the non-classically-immunocompromised ICU patient
          with severe influenza or COVID-19. Hyphae invade lung parenchyma and blood vessels, producing
          thrombosis, infarction and haematogenous spread. Mortality is high.
