              id: MONDO:0005657
              label: aspergillosis
        context: []
      assertion_type: InfectiousAgent
      assertion:
        name: Aspergillus species
        infectious_agent_term:
          preferred_term: Aspergillus
          term:
            id: NCBITaxon:5052
            label: Aspergillus
        description: Aspergillus fumigatus causes the large majority of human aspergillosis; A. flavus,
          A. terreus, A. niger and A. nidulans account for most of the remainder and matter clinically
          because susceptibility differs by species (A. terreus is characteristically amphotericin B resistant).
          A. fumigatus is a soil saprotroph whose small hydrophobic conidia are dispersed in air and reach
          the alveolus on inhalation; its capacity to grow at 37 C and to tolerate host oxidative and
          nutritional stress is an adaptation to that saprotrophic niche rather than to parasitism, which
          is why disease is opportunistic.
      selected_evidence:
        snippet: Aspergillus fumigatus is a saprotrophic fungus; its primary habitat is the soil. In its
          ecological niche, the fungus has learned how to adapt and proliferate in hostile environments.
          This capacity has helped the fungus to resist and survive against human host defenses
        supports: SUPPORT
    origin:
      assertion_path: /infectious_agent/0
      evidence_path: /infectious_agent/0/evidence/0
