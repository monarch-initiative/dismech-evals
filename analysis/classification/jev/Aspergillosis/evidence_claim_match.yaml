        context: []
      assertion_type: Environmental
      assertion:
        name: Severe influenza or COVID-19 critical illness
        effect: Predisposition to invasive pulmonary aspergillosis in hosts with no classical host factor
        description: 'Severe respiratory viral infection is a distinct and comparatively recent route
          into invasive aspergillosis: it produces the phenotype in ICU patients who carry no EORTC/MSG
          host factor at all. In seven influenza seasons across seven Belgian and Dutch ICUs, 14% of non-immunocompromised
          influenza patients developed invasive pulmonary aspergillosis against 5% of influenza-negative
          severe community-acquired pneumonia controls. Ninety-day mortality was 51% among influenza patients
          who developed it versus 28% among those who did not. The same pattern was then reported for
          COVID-19-associated pulmonary aspergillosis. No exposure_term is bound: this is an acute infectious
          comorbidity rather than an environmental exposure, and ECTO has no term that describes it without
          overstating it as an environmental agent.'
      selected_evidence:
        snippet: COVID-19 associated invasive pulmonary aspergillosis was found in five of 19 consecutive
          critically ill patients with moderate to severe ARDS.
        supports: SUPPORT
