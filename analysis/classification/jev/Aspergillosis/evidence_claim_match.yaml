        name: Echinocandin salvage therapy
        description: Caspofungin and the other echinocandins inhibit beta-1,3-glucan synthesis. Against
          Aspergillus they are fungistatic rather than fungicidal and their single-agent activity is limited,
          so they are an alternative or combination option rather than first-line — a genuinely different
          position from the one the same class holds in candidiasis. They are exceptionally well tolerated
          and have almost no drug-drug interactions, which is why they remain useful when triazoles cannot
          be given.
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: Antifungal Therapy
