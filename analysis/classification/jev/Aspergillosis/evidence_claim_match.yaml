      assertion_type: Pathophysiology
      assertion:
        name: Resistance-Gated Narrowing of Antifungal Options
        biological_scale: ORGANISM
        role: consequence
        conforms_to: antifungal_intrinsic_resistance_gating#Resistance-Gated Narrowing of Antifungal Options
        description: 'The shared consequence of the two resistance arms is a smaller set of viable agents.
          The fixed lineage-level exclusion constrains empiric therapy from the moment the organism is
          identified; the acquired environmental cyp51A alleles remove agents only once susceptibility
          testing detects them. Convergence here does not assert that either arm causes the other. The
          clinical cost is measurable: in a haematology cohort, 12-week mortality among non-ICU patients
          was 54.4% with voriconazole-resistant invasive aspergillosis against 30.7% with susceptible
          disease.'
      selected_evidence:
        snippet: Currently, four antifungal drug classes are used by clinicians and veterinarians for
          systemic treatment
        supports: SUPPORT
