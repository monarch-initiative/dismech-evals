              label: aspergillosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gliotoxin_virulence_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does gliotoxin production contribute materially to Aspergillus virulence in human disease,
          or is its measured virulence contribution specific to invertebrate infection models?
        attaches_to:
        - pathophysiology#Gliotoxin-Mediated Suppression of Host Phagocyte Function
        rationale: The direct evidence tying virulence to gliotoxin production rather than to growth rate
          or enzyme activity comes from Galleria mellonella, and the authors qualify the finding to that
          model. Galleria has no adaptive immunity and no neutrophils, so it cannot test the phagocyte
          suppression that the mechanism is proposed to act through in humans. Human aspergillosis is
          dominated by host-side phagocyte defects, which this entry models upstream. The gap matters
          because gliotoxin is periodically proposed as a therapeutic or diagnostic target on the strength
          of model-system data.
      selected_evidence:
        snippet: implicating a critical role for gliotoxin production rather than growth rate or enzymatic
          activity in the virulence of A. fumigatus in this model
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15487324
      reference_title: Correlation between gliotoxin production and virulence of Aspergillus fumigatus
        in Galleria mellonella.
      evidence_source: MODEL_ORGANISM
      explanation: The authors themselves restrict the virulence conclusion to the Galleria model, which
        is the mismatch this discussion records.
