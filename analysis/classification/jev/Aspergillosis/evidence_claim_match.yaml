      assertion:
        name: Posaconazole antifungal prophylaxis in prolonged neutropenia
        description: 'Primary prevention rather than treatment: in patients neutropenic from chemotherapy
          for acute myelogenous leukaemia or myelodysplastic syndrome, posaconazole prophylaxis cut invasive
          aspergillosis from 7% to 1% versus fluconazole or itraconazole and improved overall survival.
          Fluconazole is inactive against Aspergillus, so part of this effect is simply the switch to
          a mould-active agent — the intrinsic-resistance gate modelled in the pathophysiology, applied
          prospectively.'
