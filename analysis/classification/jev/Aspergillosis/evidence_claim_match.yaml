              term:
                id: MONDO:0015243
                label: allergic bronchopulmonary aspergillosis
            description: Th2-driven hypersensitivity to Aspergillus antigens in a host with asthma or
              cystic fibrosis, with no tissue invasion. Presents as poorly controlled asthma with recurrent
              pulmonary infiltrates, mucus plugging, marked total and Aspergillus-specific IgE elevation,
              eosinophilia and, over time, central bronchiectasis. The dismech entries for Cystic_Fibrosis
              and Hypersensitivity_Pneumonitis are the adjacent host-context and allergic-lung-disease
              entries.
          role: subtype
      assertion_type: Phenotype
      assertion:
        category: Laboratory
        name: Eosinophilia
        subtype: ABPA
        description: 'Peripheral blood eosinophilia reflects the Th2-driven eosinophilic airway inflammation
          modelled in the pathophysiology, but it is a poor diagnostic discriminator: in a 209-patient
          ABPA series the median count was 850 cells/microlitre and 60% of patients fell below the traditional
          1000 cells/microlitre criterion. Where it does track disease is with structural damage — counts
          were higher in patients with bronchiectasis and with high-attenuation mucus, which is the link
          between this laboratory finding and the airway destruction downstream of it.'
        phenotype_term:
          preferred_term: Increased total eosinophil count
          term:
            id: HP:0001880
            label: Increased total eosinophil count
      selected_evidence:
        snippet: The median (IQR) eosinophil count at diagnosis was 850 (510-1541)cells/μl, and 60% of
          the patients had an eosinophil count of <1000 cells/μl.
