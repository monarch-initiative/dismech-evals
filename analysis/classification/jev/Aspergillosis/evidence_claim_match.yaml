          role: subtype
      assertion_type: Biochemical
      assertion:
        name: Serum galactomannan
        subtype: Invasive
        notes: 'Galactomannan is a polysaccharide of the Aspergillus cell wall released during hyphal
          growth; its detection in serum or bronchoalveolar lavage by sandwich ELISA is the standard non-invasive
          marker of invasive disease. The trade-off between cut-offs is the point: raising the optical
          density index from 0.5 to 1.5 moves specificity from 81% to 93% but drops sensitivity from 82%
          to 61%, so the threshold has to be chosen against the pre-test probability of the population
          being tested.'
        presence: increased
        specificity: Validated in patients with neutropenia or functionally compromised neutrophils; performance
          in other host groups is not established by this evidence.
      selected_evidence:
        snippet: At a cut-off value of 1.5 ODI, the sensitivity was 61% (47% to 75%) and the specificity
          was 93% (89% to 97%).
        supports: SUPPORT
