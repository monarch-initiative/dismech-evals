      assertion_type: Pathophysiology
      assertion:
        name: Environmental cyp51A-Mediated Azole Resistance
        biological_scale: MOLECULAR
        role: adaptive_escape
        conforms_to: fungal_ergosterol_synthesis_inhibition#Azole-Target Resistance
        description: Agricultural azole fungicides share the Cyp51 target with clinical triazoles, so
          field application selects pan-azole-resistant A. fumigatus in the environment rather than in
          the treated patient. The dominant genotype is TR34/L98H — a 34-bp tandem repeat in the cyp51A
          promoter driving overexpression, plus a leucine-to-histidine substitution at codon 98 — with
          TR46/Y121F/T289A the second common allele. Because selection happens outside the host, azole-naive
          patients can present with resistant disease, and the resistant genotypes have spread across
          Europe from a common ancestor.
        molecular_functions:
        - preferred_term: sterol 14-alpha-demethylase activity
          term:
            id: GO:0008398
            label: sterol 14-demethylase activity
      selected_evidence:
        snippet: Such long-term application of azole fungicides to crop fields provides environmental
          selection pressure for the emergence of pan-azole-resistant fungal strains such as Aspergillus
          fumigatus having TR34/L98H mutations, specifically, a 34 bp insertion into the cytochrome P450
          51A (CYP51A) gene promoter region and a leucine-to-histidine substitution at codon 98 of CYP51A.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/16
      evidence_path: /pathophysiology/16/evidence/0
      context_paths:
