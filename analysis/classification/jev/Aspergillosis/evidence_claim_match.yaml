        role: effector
        description: 'Hyphae are too large to phagocytose, so neutrophils kill them extracellularly: antibody
          opsonisation, Fc-gamma receptor recognition, and Syk/PI3K/PKC signalling to the NADPH oxidase
          and myeloperoxidase. This is the arm lost in chronic granulomatous disease, and it is why CGD
          patients control conidia but not established hyphal growth. NET formation is induced by A. fumigatus
          but did not contribute to killing in this work.'
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: neutrophil-mediated killing of Aspergillus hyphae
          term:
            id: GO:0070947
            label: neutrophil-mediated killing of fungus
        - preferred_term: respiratory burst
          term:
            id: GO:0045730
            label: respiratory burst
      selected_evidence:
        snippet: the extracellular destruction of the Aspergillus hyphae needs opsonization by Abs and
          involves predominantly recognition via Fcγ receptors, signaling via Syk, PI3K, and protein kinase
          C to trigger the production of toxic reactive oxygen metabolites by the NADPH oxidase and myeloperoxidase
        supports: SUPPORT
