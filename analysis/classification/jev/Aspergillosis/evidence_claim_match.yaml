        name: Aspergilloma
        display_name: Aspergilloma (pulmonary fungal ball)
        subtype_term:
          preferred_term: pulmonary aspergilloma
          term:
            id: MONDO:0000266
            label: pulmonary aspergilloma
        description: Saprophytic colonisation of a pre-existing pulmonary cavity by a conglomerate of
          hyphae, mucus and cellular debris, without tissue invasion. Usually minimally symptomatic, but
          haemoptysis from the bronchial circulation surrounding the cavity can be life-threatening. Formally
          a subset of chronic pulmonary aspergillosis; kept as its own subtype because it has its own
          MONDO identity, its own natural history and a distinct management pathway (surgical excision
          rather than long-term azole therapy).
      selected_evidence:
        snippet: Aspergilloma and chronic cavitary pulmonary aspergillosis (CCPA) refer to the inert saprophytic
          colonization of preexisting cavitary spaces in the pulmonary parenchyma
        supports: SUPPORT
