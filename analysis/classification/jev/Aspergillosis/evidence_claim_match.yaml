            term:
              id: MONDO:0005657
              label: aspergillosis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mucormycosis
        description: 'The clinically decisive differential, because the treatment diverges: the Mucorales
          are intrinsically resistant to voriconazole and to the echinocandins, so an Aspergillus-directed
          regimen is inactive against them. The two are separated on tissue morphology.'
        distinguishing_features:
        - Broad, aseptate, ribbon-like hyphae branching at right angles, versus the thin, narrow, septate,
          acute-angle-branching hyphae of Aspergillus
        - Serum and BAL galactomannan is negative in mucormycosis
        - Intrinsic resistance to voriconazole and the echinocandins, leaving amphotericin B or isavuconazole
      selected_evidence:
        snippet: All the surgical debridement specimens from post-COVID cases had histomorphology of mucormycosis
          displaying broad, aseptate, ribbon-like fungal hyphae with right-angle branching (45/45).
        supports: SUPPORT
    origin:
