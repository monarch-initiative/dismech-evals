            term:
              id: NCIT:C29299
              label: Omalizumab
      selected_evidence:
        snippet: Omalizumab therapy significantly reduced exacerbation rates (- 2.29 [95%CI - 3.32, -
          1.26]), OCS dosage (- 10.91 mg [95%CI - 18.98, - 2.85]), and total IgE levels (- 273.07 IU/mL
          [95%CI - 379.30, - 166.84]), meanwhile improving FEV1% predicted (10.09% [95%CI 6.62, 13.55]).
        supports: SUPPORT
