      assertion:
        name: Failure of Phagocyte Clearance of Aspergillus
        biological_scale: CELLULAR
        role: consequence
        description: The branch point of the whole entry. Prolonged chemotherapy-induced neutropenia removes
          the effector cell; corticosteroids and calcineurin inhibitors impair macrophage and neutrophil
          function while the cells are still present; chronic granulomatous disease removes the NADPH
          oxidase-dependent anti-hyphal mechanism specifically; and severe influenza or COVID-19 produces
          a comparable functional defect in hosts with no classical EORTC/MSG host factor at all. Whatever
          the cause, ungated conidia germinate.
        biological_processes:
        - preferred_term: defense response to fungus
          modifier: DECREASED
          term:
            id: GO:0050832
            label: defense response to fungus
        cell_types:
