      assertion_type: Subtype
      assertion:
        name: Disseminated
        display_name: Disseminated and extrapulmonary aspergillosis
        description: 'Haematogenous spread from an angioinvasive pulmonary focus to brain, skin, eye,
          heart, bone or viscera, or primary cutaneous inoculation at a catheter or burn site. CNS involvement
          (neuroaspergillosis, MONDO:0005873) is the commonest and most lethal extrapulmonary site. No
          subtype_term is bound at this level: MONDO codes individual organ forms such as neuroaspergillosis
          but has no general disseminated-aspergillosis term, and binding the CNS term here would misdescribe
          the non-CNS forms this subtype also covers.'
      selected_evidence:
        snippet: Some of these hyphal fragments can break off and circulate in the bloodstream. In severely
          immunocompromised hosts, these blood-borne hyphal fragments adhere to the luminal surface of
          the endothelial cells and they penetrate the endothelial cell lining of the vasculature by passing
          from the luminal to the abluminal surface.
        supports: SUPPORT
