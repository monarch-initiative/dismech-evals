              label: aspergillosis
        context: []
      assertion_type: Genetic
      assertion:
        name: CYBB
        relationship_type: SUSCEPTIBILITY
        notes: 'X-linked chronic granulomatous disease is caused by loss-of-function variants in CYBB
          (gp91-phox), the catalytic subunit of the phagocyte NADPH oxidase. Losing the oxidative burst
          removes the antibody-opsonisation- and NADPH oxidase-dependent extracellular route that kills
          Aspergillus hyphae, which is why Aspergillus is the leading cause of pneumonia in CGD and its
          commonest cause of death. This is a susceptibility relationship: the variant causes CGD, and
          CGD permits aspergillosis on exposure.'
        gene_term:
          preferred_term: CYBB
          term:
            id: hgnc:2578
            label: CYBB
      selected_evidence:
        snippet: The most common causes of death were pneumonia and/or sepsis due to Aspergillus (23 patients)
          or Burkholderia cepacia (12 patients).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10844935
      reference_title: Chronic granulomatous disease. Report on a national registry of 368 patients.
      evidence_source: HUMAN_CLINICAL
      explanation: In the 368-patient CGD registry Aspergillus is the leading cause of death, which is
        the clinical measure of how much the NADPH oxidase route matters for this organism.
