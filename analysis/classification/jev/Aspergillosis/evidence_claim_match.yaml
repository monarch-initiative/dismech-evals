  828e5868cc38cb409d60802589981fdadec23855fa30b9a77762d3f47dd1ee7b:
    claim:
      about:
        disease:
          name: Aspergillosis
          disease_term:
            preferred_term: aspergillosis
            term:
              id: MONDO:0005657
              label: aspergillosis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Serum or bronchoalveolar lavage galactomannan enzyme immunoassay
        description: 'The standard non-invasive test for invasive aspergillosis, detecting the Aspergillus
          cell-wall polysaccharide released during hyphal growth. The cut-off is a clinical decision rather
          than a fixed property of the assay: at an optical density index of 0.5 the Cochrane meta-analysis
          of 54 studies and 5660 patients reports 82% sensitivity and 81% specificity, at 1.0 it is 72%
          and 88%, and at 1.5 it is 61% and 93%. Which point to use depends on the pre-test probability
          in the population being screened, and the evidence base is confined to patients with neutropenia
          or functionally compromised neutrophils.'
        diagnosis_term:
          preferred_term: serum or bronchoalveolar galactomannan enzyme immunoassay
          term:
            id: NCIT:C154817
            label: Galactomannan Antigen Measurement
        markers: Serum galactomannan
      selected_evidence:
        snippet: When using an optical density index (ODI) of 0.5 as a cut-off value, the sensitivity
          of the test was 82% (73% to 90%) and the specificity was 81% (72% to 90%). At a cut-off value
          of 1.0 ODI, the sensitivity was 72% (65% to 80%) and the specificity was 88% (84% to 92%). At
          a cut-off value of 1.5 ODI, the sensitivity was 61% (47% to 75%) and the specificity was 93%
          (89% to 97%).
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26716951
      reference_title: Galactomannan detection for invasive aspergillosis in immunocompromised patients.
      evidence_source: HUMAN_CLINICAL
      explanation: Gives the diagnostic accuracy at all three cut-offs named in the description, which
        is the substance of this diagnostic entry.
