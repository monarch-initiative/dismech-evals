          In the 52-week NAVIGATOR analysis, the post hoc subgroup with a history of aspirin or NSAID
          sensitivity had an estimated 83% lower annualized exacerbation rate than placebo (95% CI 66–91).
          This subgroup is distinct from the smaller recorded AERD/N-ERD/Samter triad subgroup. No formal
          hypothesis testing or between-biologic comparison was performed; the result does not establish
          aspirin tolerance or superiority for challenge-confirmed AERD.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
