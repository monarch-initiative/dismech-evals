      assertion_type: Treatment
      assertion:
        name: Aspirin desensitization followed by maintenance aspirin
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        description: 'A specialist option for confirmed AERD with persistent symptoms, recurrent polyps
          or a separate need for aspirin. Benefits vary by patient and regimen: one 34-person randomized
          trial reported symptom/medication benefit, whereas a 2025 trial randomizing 26 successfully
          desensitized participants found no significant between-group difference in SNOT-22, asthma-control
          or polyp scores over 11 months. That trial used 125 mg daily initially then 250 mg and does
          not exclude benefit from other regimens. Screen for uncontrolled asthma, ulcer/bleeding risk,
          pregnancy and ability to adhere. Daily maintenance is needed; more than two missed days requires
          reassessment before unsupervised resumption.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: acetylsalicylic acid
            term:
              id: CHEBI:15365
              label: acetylsalicylic acid
      selected_evidence:
        snippet: Symptom scores and medication needs of patients with AERD who have undergone AD were
          significantly lower compared to the placebo group after 6 months
        supports: SUPPORT
