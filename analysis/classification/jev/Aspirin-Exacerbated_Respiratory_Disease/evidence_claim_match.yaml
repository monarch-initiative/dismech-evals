      assertion_type: Discussion
      assertion:
        discussion_id: aerd_tolerance_biomarkers
        kind: KNOWLEDGE_GAP
        attaches_to:
        - treatments#Dupilumab
        - biochemical#Urinary leukotriene E4
        prompt: Can a reproducible biomarker predict aspirin tolerance during biologic therapy?
        rationale: In the 2026 nested challenge study, ten NSAID-tolerant CRSwNP controls lacked asthma
          and disease controls were younger. N-ERD kinetics were aligned to reaction onset while controls
          were aligned to dosing; repeat challenge was only in the 11 N-ERD patients. Clinical and type
          2 mediator improvement did not uniquely distinguish the five complete/partial tolerance responders
          from six remaining intolerant participants. Bulk nasal transcripts cannot establish protein
          flux, pathway mediation or a clinical decision threshold.
      selected_evidence:
        snippet: Interestingly, the development of tolerance was not associated with specific cytokine
          patterns.
        supports: SUPPORT
