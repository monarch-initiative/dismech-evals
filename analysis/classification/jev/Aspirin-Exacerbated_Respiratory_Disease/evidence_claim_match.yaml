      assertion_type: Treatment
      assertion:
        name: Dupilumab
        action_category: THERAPEUTIC
        therapeutic_modality: MONOCLONAL_ANTIBODY
        description: An IL-4R-alpha blocker used in eligible uncontrolled asthma/CRSwNP. In an open-label
          AERD cohort, 7 of 30 tolerated the highest aspirin challenge dose after six months and another
          10 tolerated higher doses; this was not universal tolerance or a placebo-controlled comparison.
          Average polyp, asthma and smell outcomes improved. A nested 11-person 2026 mechanistic analysis
          found reduced nasal type 2 responses without a cytokine pattern reliably distinguishing tolerance;
          transcriptional associations do not establish mediation. NSAID use still requires individual
          specialist assessment.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: Dupilumab
            term:
              id: NCIT:C162455
              label: Dupilumab
      selected_evidence:
