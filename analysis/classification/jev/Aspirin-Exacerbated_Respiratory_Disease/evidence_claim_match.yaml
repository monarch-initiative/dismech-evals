      assertion_type: Diagnosis
      assertion:
        name: Supervised aspirin provocation when indicated
        description: Graded oral aspirin challenge is the reference test when the history is unclear.
          It requires specialist supervision, stable airway disease and rescue capability. Recent polyp
          surgery, leukotriene modifiers, systemic corticosteroids or biologics can attenuate reactions;
          a negative test in these settings needs contextual interpretation. The WAO diagnostic-challenge
          guidance requires stable patients with FEV1 at least 70% predicted and identifies current beta-blocker
          treatment as a contraindication.
      selected_evidence:
        snippet: Oral ASA challenge testing is the gold standard for diagnosing hypersensitivity to NSAIDs,
          and sensitive and specific for N-ERD.
        supports: SUPPORT
