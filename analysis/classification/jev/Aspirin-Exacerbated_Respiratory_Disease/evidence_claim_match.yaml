              label: Tezepelumab
      selected_evidence:
        snippet: 'Reductions with tezepelumab compared with placebo in patients with asthma‑related comorbidities
          ranged from 58% (95% CI: 47, 67) in patients with rhinitis to 83% (95% CI: 66, 91) in patients
          with aspirin or NSAID sensitivity'
        supports: SUPPORT
