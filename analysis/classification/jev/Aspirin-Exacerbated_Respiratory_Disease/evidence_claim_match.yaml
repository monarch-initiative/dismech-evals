        prompt: Which inflammatory cells and remodeling processes are necessary for persistent polyp disease?
        rationale: Tissue eosinophilia is prominent, but depletion need not improve polyps. Likewise,
          mediator biology and receptor activation do not guarantee efficacy of a proposed blocking drug.
      selected_evidence:
        snippet: In an open-label study of 16 patients with CRSwNP, several of whom had AERD, dexpramipexole
