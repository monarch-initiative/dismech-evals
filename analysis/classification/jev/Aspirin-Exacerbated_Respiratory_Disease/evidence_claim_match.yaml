      assertion_type: ExperimentalModel
      assertion:
        name: AERD granulocyte-platelet ex vivo preparations
        experimental_model_type: CO_CULTURE
        publication: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3335383/?report=xml
        cell_source: Freshly isolated human peripheral blood granulocytes and autologous platelets
        description: Platelet stripping, exogenous LTA4-methyl-ester conversion, A23187 stimulation, fMLP
          stimulation and platelet add-back interrogated platelet-associated leukotriene production. Removal
          reduced both LTC4 synthase-associated activity and stimulated output; add-back restored robust
          generation.
        notes: Platelet-intrinsic LTC4 synthase activity did not significantly differ between AERD and
          aspirin-tolerant asthma. Substrate-conversion, ionophore and receptor-agonist assays had different
          sample subsets; the fMLP result came from three AERD preparations. Ex vivo removal/add-back
          supports a contribution but does not quantify in vivo necessity or establish antiplatelet treatment
          efficacy.
        modeled_mechanisms:
        - target: Enhanced Transcellular Cysteinyl Leukotriene Synthesis
          relationship: MEASURES
          model_scale: CELLULAR
          fidelity: MODERATE
          description: Platelet removal lowers fMLP-stimulated cysteinyl leukotriene release.
          limitations: Cell preparations do not reproduce vascular recruitment, intact airway context
            or clinical treatment response.
      selected_evidence:
        snippet: Removal of platelets also reduced fMLP-induced generation of cysLTs by 64 ± 16%
        supports: SUPPORT
