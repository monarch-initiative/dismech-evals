      assertion:
        name: Pharmacological COX-1 Inhibition
        biological_scale: MOLECULAR
        description: Aspirin and other strong COX-1 inhibitors suppress cyclooxygenase activity. This
          acute pharmacologic exposure triggers reactions in a susceptible airway; it does not explain
          the acquired chronic asthma and sinonasal disease.
      selected_evidence:
        snippet: Inhibition of COX-1 activity in patients with N-ERD further reduces the “braking” effects
          of PGE2/EP2 on mast cells and 5-LO activity, which increases the release of cysLTs in urine
          and airway fluids, precipitating respiratory symptoms.
        supports: SUPPORT
