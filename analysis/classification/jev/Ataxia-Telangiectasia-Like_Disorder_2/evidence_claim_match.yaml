      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: lost_client_interactions
        hypothesis_label: Disease follows from specific lost PCNA client interactions
        status: CANONICAL
        description: The account that came with the founding report. The p.Ser228Ile substitution alters
          the partner-binding pocket, PCNA's interactions with flap endonuclease 1, DNA ligase 1 and a
          long list of other PIP-box clients are impaired, and the resulting failures of repair and of
          Okazaki-fragment maturation produce the phenotype. It explains the photosensitivity and the
          UV phenotypes of patient cells directly.
      selected_evidence:
        snippet: The p.Ser228Ile change also profoundly altered PCNA's interaction with Flap endonuclease
          1 and DNA Ligase 1, DNA metabolism enzymes.
        supports: SUPPORT
        directness: DIRECT
