            term:
              id: MONDO:0014399
              label: ataxia-telangiectasia-like disorder 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: why_the_phenotype_is_neurological
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Defective DNA Damage Response
        - phenotypes#
        prompt: PCNA is required in every dividing cell. Why is a hypomorphic PCNA allele a neurodegenerative
          disease rather than a proliferative or a cancer-predisposition one?
        rationale: 'This is the question the pathograph does not answer. The chain runs from the allele
          to a repair defect that is demonstrable in patient fibroblasts, and then to a phenotype that
          is overwhelmingly cerebellar and neurodevelopmental. Nothing in the sources cited here explains
          the tissue selectivity.

          A candidate exists and is worth recording so that it can be tested rather than assumed: global-genome
          nucleotide excision repair is constitutively weaker in neurons and astrocytes than in fibroblasts,
          and the amount of PCNA recruited to UV-damage sites is correspondingly lower in those cells.
          If neural cells already operate near the lower limit of what the pathway can deliver, a hypomorphic
          clamp would bite there first while dividing tissues absorb it. The measurement supporting that
          is rat primary culture on wild-type cells, so it is a hypothesis about the general biology and
          not an observation about this disease.

          Two things would move it. A patient-derived neural model, of which none is reported here, and
          a comparison of chromatin-bound PCNA between patient neural cells and patient fibroblasts, which
          is measurable with the assay the founding reports already use.'
      selected_evidence:
        snippet: That result was consistent with the finding that levels of an NER-related protein (proliferating
          cell nuclear antigen, PCNA) recruited at the localized UV-damage sites were lower in neurons
          and in astrocytes than in fibroblasts.
        supports: SUPPORT
        directness: INDIRECT
