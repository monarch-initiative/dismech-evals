      assertion_type: Discussion
      assertion:
        discussion_id: allele_specific_mechanism
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Impaired PCNA Client Protein Binding
        - pathophysiology#Reduced PCNA Thermostability
        - mechanistic_hypotheses#reduced_functional_clamp_pool
        prompt: Do the two causal PCNA alleles produce the same disease by the same route, or by two different
          routes that happen to converge on the clinical phenotype?
        rationale: 'p.Ser228Ile impairs client binding across most PIP-box partners; p.Cys148Ser has wild-type-like
          structure and wild-type-like partner affinity and causes the same disease. The only property
          the alleles share is reduced thermostability, which points at the amount of functional clamp
          rather than at any lost interaction. But the inference is not closed: no experiment has shown
          that lowering PCNA levels by an unrelated means reproduces the cellular phenotype, and the S228I
          cells were explicitly reported to have normal PCNA protein levels, so a shared level-based mechanism
          has to explain how that allele produces the disease without a measured level change. Resolving
          this determines whether evidence gathered on one allele can be read as evidence about the disease,
          which is currently assumed throughout the literature and throughout this entry.'
      selected_evidence:
        snippet: Interestingly, while the p.Ser228Ile alteration appeared to have no effect on protein
          levels or DNA replication, patient cells exhibited marked abnormalities in response to UV irradiation,
          displaying substantial reductions in both UV survival and RNA synthesis recovery.
        supports: REFUTE
        directness: DIRECT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24911150
      reference_title: Hypomorphic PCNA mutation underlies a human DNA repair disorder.
      evidence_source: IN_VITRO
      explanation: Recorded as REFUTE against the unified clamp-level account. If S228I cells have normal
        PCNA protein levels, then reduced clamp availability cannot be the whole mechanism for that allele,
        whatever the thermostability assays show in vitro.
