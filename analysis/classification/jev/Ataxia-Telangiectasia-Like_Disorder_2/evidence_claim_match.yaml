        - Reported additional features not described in ATLD2, including hypergonadotropic hypogonadism
          and neutrophil hypersegmentation
      selected_evidence:
        snippet: Western blot assay demonstrated total loss of MRE11 and reduction of ATM-dependent phosphorylation;
          thus, we diagnosed ATLD.
