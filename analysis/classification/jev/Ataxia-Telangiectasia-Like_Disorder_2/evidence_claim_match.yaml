            term:
              id: MONDO:0014399
              label: ataxia-telangiectasia-like disorder 2
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: reduced_functional_clamp_pool
        hypothesis_label: Disease follows from a reduced pool of functional PCNA
        status: EMERGING
        description: The account that the second allele forces. p.Cys148Ser causes the same disease with
          wild-type-like structure and wild-type-like partner affinity, so lost client binding cannot
          be the common cause. What both alleles do share is reduced thermostability, and C148S patient
          cells carry less PCNA on chromatin and behave differently at different temperatures. On this
          reading the operative variable is how much functional clamp is available, and the S228I interaction
          defects are one route to that rather than the mechanism itself.
      selected_evidence:
        snippet: The stability defect of both PARD variants indicates that PCNA levels are likely an important
          driver of PARD disease.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36990216
      reference_title: A thermosensitive PCNA allele underlies an ataxia-telangiectasia-like disorder.
      evidence_source: IN_VITRO
      explanation: States the hypothesis in the authors' own terms, and note their own hedge - "likely
        an important driver", not "the cause" - which is why this is EMERGING and not CANONICAL.
