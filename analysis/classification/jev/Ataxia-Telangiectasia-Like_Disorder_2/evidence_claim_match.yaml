          by MRE11 variants and is a double-strand-break repair defect. The shared name reflects the era
          in which both were described clinically, and grouping the two by mechanism would be a mistake.'
        distinguishing_features:
        - Caused by MRE11 rather than PCNA
        - Double-strand-break repair rather than nucleotide excision repair
        - No UV photosensitivity phenotype
