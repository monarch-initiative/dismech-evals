            term:
              id: MONDO:0014399
              label: ataxia-telangiectasia-like disorder 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: untested_epigenetic_branch
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Impaired PCNA Client Protein Binding
        prompt: DNMT1 is among the PIP-box clients whose binding is impaired. Does ATLD2 carry a maintenance-methylation
          defect, and has anyone looked?
        rationale: 'The client-binding node records that DNMT1 is affected alongside the repair enzymes,
          and DNMT1 is how CpG methylation patterns survive replication. If clamp-dependent loading of
          DNMT1 is impaired in patient cells, the disease would have an epigenetic arm in addition to
          a repair arm, which would be a different kind of disease from the one this entry describes.

          The supporting biology is established outside this disease: DNMT1 is targeted to replication
          sites through a PCNA-binding domain, with a second PCNA-independent route through UHRF1/Np95
          binding hemimethylated DNA. Two routes matter here, because a defect in the PCNA-dependent one
          need not abolish maintenance methylation - which is a reason the branch might be real and still
          hard to see.

          No source cited here reports methylation in ATLD2 patient cells, so this is an untested branch
          and not a suppressed finding. It is recorded rather than modelled: putting a methylation node
          in the pathograph would assert a claim nobody has made.'
      selected_evidence:
        snippet: Two subdomains, the proliferating cell nuclear antigen (PCNA)-binding domain (PBD) and
          the targeting sequence (TS) domain, target Dnmt1 to the replication sites in S phase.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23535145
      reference_title: Dissection of cell cycle-dependent dynamics of Dnmt1 by FRAP and diffusion-coupled
        modeling.
      evidence_source: IN_VITRO
      explanation: Establishes the PCNA-dependent route the gap is about, and that it is one of two. Mouse
        somatic cells and wild-type PCNA, so it says nothing about the disease variant.
