          phenotype, which is why the link is EXACERBATES rather than TRIGGERS. Note the interaction is
          demonstrated in patient fibroblasts under controlled irradiation; no source cited here reports
          a dose-response in patients, so this is the mechanism of the exposure rather than a quantified
          clinical risk.
        exposure_term:
