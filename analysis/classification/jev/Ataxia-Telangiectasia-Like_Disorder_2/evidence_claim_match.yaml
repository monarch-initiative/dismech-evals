      assertion:
        discussion_id: cellular_defect_to_clinical_severity
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Defective DNA Damage Response
        - phenotypes#Neurodegeneration
        prompt: Why does a repair defect that produces only subtle changes in undamaged cells produce
          progressive neurodegeneration in the whole organism?
        rationale: 'The in vitro effects of the S228I allele on client binding are dramatic, and yet the
          downstream cellular consequences are described as subtle: p21 and Cdt1 stability are only minimally
          altered in patient cells, and DNA replication is unaffected. The authors of that work explicitly
          frame the gap - large biochemical perturbation, small cellular effect - and propose that the
          small effects accumulate. Nothing has tested that in neural tissue, and no model system for
          this disorder has been reported at all, so the step from a mild fibroblast phenotype to cerebellar
          atrophy is currently an argument rather than a finding.'
      selected_evidence:
        snippet: Despite the dramatic in vitro effects of the PARD mutation on PIP-degron binding, there
          are only minor alterations to the stability of p21 and Cdt1 in cells from affected individuals.
        supports: SUPPORT
        directness: DIRECT
