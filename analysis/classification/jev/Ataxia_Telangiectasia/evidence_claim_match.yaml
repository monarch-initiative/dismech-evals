      assertion_type: Subtype
      assertion:
        name: Classic ataxia-telangiectasia
        description: The severe end of the ATM-related spectrum. Progressive cerebellar ataxia begins
          in early childhood and is followed by extrapyramidal involvement, sensorimotor neuropathy, variable
          combined immunodeficiency, pulmonary disease, and early malignancy risk. ATM kinase activity
          is usually absent or extremely low, but clinical severity should not be inferred from variant
          class alone.
        genes:
        - preferred_term: ATM
          term:
            id: hgnc:795
            label: ATM
      selected_evidence:
        snippet: childhood onset of progressive neurologic manifestations (initially cerebellar ataxia,
          followed typically by extrapyramidal involvement and peripheral sensorimotor neuropathy), immunodeficiency
          (variably associated with abnormalities of humoral immunity, cellular immunity, or combined
          immune deficiency), pulmonary disease (resulting from recurrent infections, immune deficiency,
          aspiration, interstitial lung disease, and neurologic abnormalities), and increased risk of
          malignancy.
        supports: SUPPORT
