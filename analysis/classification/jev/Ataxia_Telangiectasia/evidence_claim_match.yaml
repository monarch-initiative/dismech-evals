              in early childhood and is followed by extrapyramidal involvement, sensorimotor neuropathy,
              variable combined immunodeficiency, pulmonary disease, and early malignancy risk. ATM kinase
              activity is usually absent or extremely low, but clinical severity should not be inferred
              from variant class alone.
            genes:
            - preferred_term: ATM
              term:
                id: hgnc:795
                label: ATM
          role: subtype
