        - pathophysiology#Oxidative stress and microglial neuroinflammation
        - pathophysiology#Progressive cerebellar and peripheral neurodegeneration
        prompt: Which ATM-dependent failure is necessary and sufficient for selective Purkinje and granule
          neuron degeneration in human A-T, and how much is driven by neuronal DNA-damage responses versus
          oxidative, mitochondrial, epigenetic, or microglial pathways?
        rationale: Human cerebellar single-nucleus data and patient-derived co-cultures support microglial
          involvement, but the ATM-to-selective-neuron causal chain remains unresolved and multiple hypotheses
          may coexist. The graph therefore marks the microglial branch provisional and the root-to-neurodegeneration
          edge as indirect with unknown intermediates.
      selected_evidence:
        snippet: While ATM loss of function has long been identified as the genetic cause of ataxia-telangiectasia
          (A-T), how it leads to selective and progressive degeneration of cerebellar Purkinje and granule
          neurons remains unclear.
        supports: SUPPORT
