            id: hgnc:795
            label: ATM
      selected_evidence:
        snippet: While cerebellar ataxia can be absent, extrapyramidal movement disorders are common (typically
          dystonia and dystonic tremor) and most individuals have manifestations of axonal sensorimotor
          polyneuropathy.
        supports: SUPPORT
