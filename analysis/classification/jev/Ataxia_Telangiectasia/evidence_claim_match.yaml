      assertion:
        name: Clinical and laboratory evaluation for suspected A-T
        description: Progressive ataxia and abnormal eye movements raise suspicion. Supporting clues include
          telangiectasia, recurrent sinopulmonary infection, elevated AFP after age two, immunoglobulin
          deficiency, and lymphopenia. No single supporting clue substitutes for molecular confirmation.
        results: A convergent neurologic, immunologic, and laboratory pattern supports targeted ATM testing.
      selected_evidence:
        snippet: 'The diagnosis of A-T is usually suspected by the combination of neurologic clinical
          features (ataxia, abnormal control of eye movement, and postural instability) with one or more
          of the following which may vary in their appearance: telangiectasia, frequent sinopulmonary
          infections and specific laboratory abnormalities (e.g. IgA deficiency, lymphopenia especially
          affecting T lymphocytes and increased alpha-fetoprotein levels).'
        supports: SUPPORT
