        subtype: Classic ataxia-telangiectasia
        age_range: Childhood through adulthood
        notes: Cancer, chronic lung disease, and infection drive premature mortality. Improved supportive
          care has extended survival, so adult pulmonary, metabolic, hepatic, and solid-tumor complications
          are increasingly encountered.
      selected_evidence:
        snippet: Cancer (hazard ratio, 2.7; 95% CI, 1.6-4.5) and respiratory tract infections (hazard
          ratio, 2.3; 95% CI, 1.4-3.8) were independently associated with mortality.
