        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: A-T results from biallelic pathogenic ATM variants. When both parents are heterozygous,
          each pregnancy has a 25% probability of an affected child, a 50% probability of a heterozygous
          child, and a 25% probability of a child who inherited neither familial variant.
      selected_evidence:
        snippet: 'Ataxia-telangiectasia (A-T) is a rare autosomal recessive neurodegenerative

          disorder characterized by progressive cerebellar ataxia, ocular apraxia,

          immunodeficiency, telangiectasia, elevated serum α-fetoprotein concentration,

          radiosensitivity and cancer predisposition. Classical A-T is caused by biallelic

          variants on ATM (ataxia telangiectasia mutated) gene, leading to a loss of

          function of the protein kinase ATM, involved in DNA damage repair.'
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
