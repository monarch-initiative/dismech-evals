        subtype: Variant ataxia-telangiectasia
        age_range: Childhood to adulthood
        notes: Neurologic decline is generally slower and life expectancy longer than in classic A-T.
          Immunodeficiency and pulmonary disease may be absent, whereas cancer risk persists and malignancy
          can precede recognition of A-T.
      selected_evidence:
        snippet: Overall, the phenotypic manifestations in A-T show a continuous spectrum from severe
          classical childhood-onset A-T to a relatively mild adult-onset disorder, depending on the presence
