              label: Autosomal recessive inheritance
        notes: 'Biallelic germline pathogenic variants in ATM cause A-T. Truncating alleles are commonly
          associated with absent kinase activity and classic disease; hypomorphic missense or splice variants
          can preserve activity and produce variant A-T. These are probabilistic genotype-phenotype correlations:
          residual kinase activity is more informative than variant class alone, and cancer risk remains
          increased across the spectrum. The genotype also stratifies mortality: null genotypes carry
          shorter life expectancy driven by earlier (mainly hematologic) cancer, whereas respiratory infection
          is the leading cause of death with hypomorphic genotypes.'
      selected_evidence:
        snippet: Life expectancy was lower among patients with mutations in ATM that caused total loss
          of expression or function of the gene product (null mutations) compared with that seen in patients
          with hypomorphic mutations because of earlier onset of cancer (mainly hematologic malignancies).
        supports: SUPPORT
