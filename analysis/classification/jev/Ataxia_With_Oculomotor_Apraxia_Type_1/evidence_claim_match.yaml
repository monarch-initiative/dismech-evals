        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_coenzyme_q10_deficiency_not_supported
        kind: INTERPRETATION
        status: OPEN
        prompt: Should AOA1 be curated as a secondary coenzyme Q10 deficiency, and does coenzyme Q10 supplementation
          have a mechanistic rationale in this disease?
        attaches_to:
        - pathophysiology#Accumulation of Unrepaired Single-Strand Breaks in Post-Mitotic Neurons
        rationale: 'AOA1 has been discussed alongside the secondary coenzyme Q10 deficiencies, which would
          give it a mitochondrial arm and a supplement with a rationale. The one series in this entry''s
          reference set that actually measured it found normal coenzyme Q10 in muscle, fibroblasts and
          plasma in five of six mutation-positive subjects.

          That is a small number and a negative result, so it does not close the question. It is enough,
          though, to keep a mitochondrial node out of this pathograph: there is no measured coenzyme Q10
          deficit to build one on, and inventing the node would create a therapeutic rationale the data
          do not support.'
      selected_evidence:
        snippet: Analyses of coenzyme Q10 in muscle, fibroblasts, and plasma demonstrated normal levels
          of coenzyme in five of six mutated subjects.
        supports: REFUTE
