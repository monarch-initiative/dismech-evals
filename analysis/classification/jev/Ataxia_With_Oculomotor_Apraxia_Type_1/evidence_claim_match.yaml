  e61bfc4ccdb90a74a0b679e0a55b7da85f7a6d549b393f2ba3907fa7cb44958d:
    claim:
      about:
        disease:
          name: Ataxia With Oculomotor Apraxia Type 1
          disease_term:
            preferred_term: ataxia with oculomotor apraxia type 1
            term:
              id: MONDO:0008842
              label: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_age_of_onset_discrepancy
        kind: INTERPRETATION
        status: OPEN
        prompt: Why do the two natural-history sources report different mean ages of onset for AOA1, and
          which should a clinician use?
        attaches_to:
        - pathophysiology#Progressive Cerebellar Ataxia and Oculomotor Apraxia
        rationale: 'The GeneReviews chapter gives a mean onset of 4.3 years with a range of 2 to 10. The
          French series gives 6.8 plus or minus 4.8 years with a range of 2 to 18. The lower bound agrees;
          the upper bound differs by eight years.

          The likely explanation is ascertainment rather than disagreement. The French figure comes from
          screening a referred series of 158 non-Friedreich recessive ataxia families, which will include
          patients who presented late enough to be mistaken for something else; the GeneReviews figure
          describes the disease as characterised in dedicated AOA1 series. A referral-based denominator
          shifts a mean onset upward and widens the range in exactly this way.

          Both are recorded rather than averaged. For counselling, the wider range is the safer one: a
          first presentation at fifteen does not exclude AOA1.'
      selected_evidence:
        snippet: 'The first manifestation is progressive gait imbalance (mean age of onset: 4.3 years;
          range: 2-10 years), followed by dysarthria, then upper-limb dysmetria with mild intention tremor.'
        supports: SUPPORT
