  9db7347cf932a96279e8fd3df9335083142f54b660e1216f563a26ee4e92140c:
    claim:
      about:
        disease:
          name: Ataxia With Oculomotor Apraxia Type 1
          disease_term:
            preferred_term: ataxia with oculomotor apraxia type 1
            term:
              id: MONDO:0008842
              label: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Persistence of Abortive DNA Ligation Intermediates
        role: central_effector
        biological_scale: MOLECULAR
        description: 'The rate-limiting lesion, and the reason this disease is mechanistically specific
          rather than a generic repair failure. DNA ligase works through an adenylated intermediate; when
          the reaction aborts, the adenylate is left covalently attached to the 5''-phosphate of the nick.
          That terminus is now chemically blocked - ligase cannot re-attack it, so the break is not merely
          unrepaired but unrepairable by the pathway that created it.

          Aprataxin''s contribution is to release the adenylate and restore a 5''-phosphate that ligase
          can use. So the enzyme does not repair DNA; it repairs the repair machinery''s own mistakes.
          That distinction matters for the disease, because it predicts damage proportional to ligation
          activity rather than to exogenous genotoxic exposure - which is consistent with a phenotype
          restricted to long-lived post-mitotic neurons and with the absence of the organism-level radiosensitivity
          seen in ataxia-telangiectasia.'
        biological_processes:
        - preferred_term: single-strand break repair
          term:
            id: GO:0000012
            label: single strand break repair
          modifier: DECREASED
      selected_evidence:
        snippet: Specifically, aprataxin catalyses the nucleophilic release of adenylate groups covalently
          linked to 5'-phosphate termini at single-strand nicks and gaps, resulting in the production
          of 5'-phosphate termini that can be efficiently rejoined.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
