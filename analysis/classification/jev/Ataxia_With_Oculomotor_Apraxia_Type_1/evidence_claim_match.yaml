        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_genotype_phenotype_correlation
        kind: CONTROVERSY
        status: OPEN
        prompt: Does the AOA1 phenotype vary with the APTX allele, or is it homogeneous regardless of
          mutation type and position?
        attaches_to:
        - pathophysiology#Biallelic APTX Loss-of-Function Variant
        rationale: 'Two large series disagree. The 2003 French series singles out A198V as producing a
          remarkably severe and persistent chorea, against the usual pattern in which chorea fades. The
          2011 Italian series states flatly that the phenotype was homogeneous irrespective of mutation
          type and location.

          The disagreement may be smaller than it looks: A198V does not appear among the alleles reported
          in the Italian cohort, which found W279X, W279R and P206L homozygotes plus three novel truncating
          variants. A series that never observed the allele cannot contradict a claim about it. Recorded
          as a controversy rather than resolved in either direction, because settling it needs a cohort
          carrying A198V and scored for chorea persistence, which neither series is.'
      selected_evidence:
        snippet: However, a remarkably severe and persistent choreic phenotype was associated with one
          of the mutations (A198V).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
