  80aa880ac6305876846f77af0a492c6a1e1e6e92af410d4637131d866d1ff90a:
    claim:
      about:
        disease:
          name: Ataxia With Oculomotor Apraxia Type 1
          disease_term:
            preferred_term: ataxia with oculomotor apraxia type 1
            term:
              id: MONDO:0008842
              label: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_cognitive_impairment_universality
        kind: CONTROVERSY
        status: OPEN
        prompt: Is cognitive impairment universal in AOA1, or does intellect remain normal in a subset
          of patients?
        attaches_to:
        - pathophysiology#Cerebellar Degeneration
        rationale: 'Two sources make incompatible universal claims. The 14-patient French series states
          that cognitive impairment was always present. The GeneReviews chapter states that intellect
          remains normal in some individuals, with varying degrees of impairment in others.

          Both cannot be right as stated, and the disagreement is not resolvable from the abstracts curated
          here because neither reports the instrument used. "Cognitive impairment" assessed by formal
          neuropsychological battery and "intellect remains normal" assessed clinically can coexist in
          the same population: a patient with normal measured IQ and impaired executive or processing-speed
          performance would be counted in both categories by the two sources. Cerebellar cognitive-affective
          changes are exactly the kind that a global intellect judgement misses.

          The phenotype band was lowered from OBLIGATE to FREQUENT rather than picking a winner, because
          a band should not assert more than the weaker of two conflicting sources allows.

          A caveat on weighting: the GeneReviews chapter is formally retired and its own header warns
          the information may be out of date, so it is not automatically the better source. It is, however,
          the only one of the two that reports the observation prospectively across the disease''s described
          natural history rather than in one ascertained cohort.'
        proposed_experiments:
        - experiment_id: aoa1_neuropsychological_battery_stratified
          name: Formal neuropsychological profiling in a mutation-confirmed AOA1 cohort
          description: Administer a battery separating global intellectual ability from executive function,
            processing speed and the cerebellar cognitive-affective domains, in mutation-confirmed patients
            stratified by disease duration, to establish whether the disagreement is about prevalence
            or about which construct is being measured.
      selected_evidence:
        snippet: Cognitive impairment was always present.
        supports: SUPPORT
