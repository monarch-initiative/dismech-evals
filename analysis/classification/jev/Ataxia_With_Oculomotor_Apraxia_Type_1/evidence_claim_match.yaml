              label: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic APTX Loss-of-Function Variant
        role: trigger
        biological_scale: MOLECULAR
        description: 'Aprataxin is built from three modules - an N-terminal region homologous to polynucleotide
          kinase phosphatase, a histidine-triad (HIT) nucleotide-hydrolase domain, and a C2H2 zinc finger.
          Inactivating mutations are largely confined to the HIT domain, which is the catalytic one, and
          patient lymphocytes show greatly decreased protein.

          The recurrent alleles are population-specific (W279X, W279R and P206L recur across European
          series), which is why AOA1 is the commonest recessive ataxia in Japan and second only to Friedreich
          ataxia in Portugal while accounting for around 5-6% of non-Friedreich recessive ataxia in mixed
          European cohorts.'
        molecular_functions:
        - preferred_term: aprataxin DNA 5'-adenylate hydrolase activity
          term:
            id: GO:0033699
            label: DNA 5'-adenosine monophosphate hydrolase activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: We narrowed the candidate region and have identified a new gene encoding a member of
          the histidine triad (HIT) superfamily as the 'causative' gene. We have called its product aprataxin;
          the gene symbol is APTX.
        supports: SUPPORT
