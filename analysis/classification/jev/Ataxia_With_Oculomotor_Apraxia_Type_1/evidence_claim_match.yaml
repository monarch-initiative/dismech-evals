  cdb89ece830904182e90c3955b78b6ed722833fcda891a67594461348a607898:
    claim:
      about:
        disease:
          name: Ataxia With Oculomotor Apraxia Type 1
          disease_term:
            preferred_term: ataxia with oculomotor apraxia type 1
            term:
              id: MONDO:0008842
              label: ataxia, early-onset, with oculomotor apraxia and hypoalbuminemia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_hypoalbuminaemia_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does loss of a nuclear DNA-repair enzyme lower serum albumin and raise
          total cholesterol, and why do these markers appear only late?
        attaches_to:
        - pathophysiology#Persistence of Abortive DNA Ligation Intermediates
        rationale: 'Hypoalbuminaemia is written into the disease''s own MONDO and OMIM labels, yet none
          of the references read for this entry offers a mechanism. Every source treats it as an association:
          the 2001 gene papers report it as a clinical characteristic, the 2003 French series and the
          2011 Italian series quantify it, and the 2008 report places it in the adult stage. The searches
          run for this entry found nothing addressing the causal step, so the pathograph deliberately
          does not connect it to the APTX lesion by an edge.

          The gap is worth stating rather than papering over, because dismech now also holds an entry
          in which hypoalbuminaemia *is* mechanistically explained - hypercatabolic hypoproteinaemia,
          where FcRn salvage failure raises the catabolic rate of albumin. A protein-turnover study in
          AOA1 of the kind Waldmann and Terry performed in 1968 would settle in one experiment whether
          the albumin here is under-synthesised or over-catabolised, and nothing in the literature curated
          here reports one.

          Management practice has quietly taken a side. The published recommendation is a high-protein
          diet to prevent oedema by restoring serum albumin - which only makes sense if the albumin is
          substrate-limited, that is, a synthesis or intake problem. If AOA1 hypoalbuminaemia were catabolic
          in the way hypercatabolic hypoproteinaemia''s is, eating more protein would raise the flux through
          a leak rather than fix it, and the FcRn disease is the demonstration: those patients synthesise
          albumin at a normal rate and are still hypoalbuminaemic.

          So the assumption is testable and, so far as the literature read here goes, untested. It is
          also not idle: it is the stated rationale of a dietary recommendation given to patients.'
        proposed_experiments:
        - experiment_id: aoa1_albumin_turnover_study
          name: Radiolabelled albumin turnover study in AOA1
          description: Measure albumin synthetic rate and fractional catabolic rate in mutation-confirmed
            AOA1 patients with hypoalbuminaemia, with urinary and faecal protein loss excluded, to distinguish
            reduced hepatic synthesis from accelerated catabolism.
        - experiment_id: aoa1_high_protein_diet_albumin_response
          name: Serum albumin response to protein intake in AOA1
          description: Measure serum albumin before and during a defined high-protein intake in AOA1 patients,
            to test the assumption embedded in the current dietary recommendation. A response supports
            a substrate-limited mechanism; no response, with normal renal and enteric protein handling,
            points at catabolism and would make the diet advice mechanistically wrong even if harmless.
      selected_evidence:
        snippet: AOA1 is also characterized by axonal motor neuropathy and the later decrease of serum
          albumin levels and elevation of total cholesterol.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
