        context: []
      assertion_type: AnimalModel
      assertion:
        name: Setx knockout mouse
        species: Mouse
        genotype: Setx knockout (Setx-/-, Cre-LoxP deletion of exon 4)
        publication: PMID:23593030
        description: 'The only published constitutive Setx-null mouse. It is a good model of the meiotic
          arm of senataxin function and not a model of the disease: the animals are male-infertile with
          a pachytene-stage block, and they have no ataxia, no cerebellar degeneration and no Purkinje
          cell loss.'
        modeled_mechanisms:
        - target: Failure of Meiotic Recombination and Sex Chromosome Inactivation
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Reproduces the meiotic phenotype in full, and it is where the mechanism was originally
            worked out; the human testicular histology was subsequently matched to it.
        - target: Purkinje Cell Degeneration in the Cerebellar Cortex
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: Complete loss of Setx in the mouse produces no cerebellar degeneration and no ataxia,
            so the model cannot be used to study the neurodegenerative arm of AOA2.
          limitations: 'The negative result is not a matter of degree or of age at assessment: neither
            structural cerebellar change nor Purkinje cell loss was detectable, and behavioural scoring
            found no difference from wild type. Any inference about AOA2 neurodegeneration made in this
            model is therefore unsupported, which is why patient-derived iPSC neural progenitors were
            developed instead.'
        - target: Defective R-Loop Resolution at Transcription Pause Sites
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: R-loops accumulate in Setx-null tissue, but only where cells are proliferating.
            The brain of the same animals shows none.
          limitations: 'The tissue restriction is the whole point: R-loop accumulation was demonstrated
            in testis and in proliferating cells in vitro and in vivo, and was absent from the brains
            of Setx-null mice. A model of R-loop accumulation in this system is a model of a proliferating-cell
            phenomenon, and cannot be transferred to post-mitotic neurons.'
      selected_evidence:
        snippet: Senataxin, mutated in the human genetic disorder ataxia with oculomotor apraxia type
          2 (AOA2), plays an important role in maintaining genome integrity by coordination of transcription,
          DNA replication, and the DNA damage response.
        supports: SUPPORT
