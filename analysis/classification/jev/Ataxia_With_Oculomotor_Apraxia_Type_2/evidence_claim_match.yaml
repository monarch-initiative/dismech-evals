        biological_scale: MOLECULAR
        description: 'Senataxin is a nucleoplasmic superfamily-I DNA/RNA helicase homologous to yeast
          Sen1p, with a C-terminal helicase domain and an N-terminal protein-interaction domain. With
          the protein truncated or inactive, the cell loses a single enzyme that is used in several places
          at once: unwinding R-loops behind paused polymerase, unwinding them again where transcription
          meets replication, and docking the transcription machinery to RNA-processing and damage-response
          partners.'
        molecular_functions:
        - preferred_term: senataxin RNA/DNA helicase activity
          modifier: DECREASED
          term:
            id: GO:0004386
            label: helicase activity
        cellular_components:
