  3aabdca71e030e1be5b3804329c0b3f5f8cb3e2e820cae812ecd778370072bfa:
    claim:
      about:
        disease:
          name: Ataxia With Oculomotor Apraxia Type 2
          disease_term:
            preferred_term: ataxia with oculomotor apraxia type 2
            term:
              id: MONDO:0018996
              label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 2
        context: []
      assertion_type: Biochemical
      assertion:
        name: Serum alpha-fetoprotein
        notes: 'The diagnostic biomarker of AOA2 and the reason most patients reach a SETX test. It is
          elevated in 92-100% of patients, is established at or before symptom onset, and stays flat thereafter,
          so it discriminates but does not monitor. Threshold work matters here: selecting non-Friedreich,
          non-ataxia-telangiectasia ataxic patients with AFP at or above 7 microg/l for sequencing gives
          a 46% yield of AOA2 while missing about 0.2% of cases, and video-oculography adds nothing to
          the discrimination that AFP does not already provide. Why senataxin loss raises AFP is not known;
          it is not explained by liver disease, which is absent in AOA2 patients even where present in
          ataxia-telangiectasia.'
        biomarker_term:
          preferred_term: alpha-fetoprotein
          term:
            id: NCIT:C16278
            label: Alpha-Fetoprotein
        specificity: Shared with ataxia-telangiectasia and, at lower levels, AOA1; the concentration bands
          differ between the three.
        readouts:
        - target: Biallelic SETX Loss-of-Function Variant
          relationship: CORRELATES_WITH
          direction: THRESHOLD_DEPENDENT
          endpoint_context: DIAGNOSTIC
          interpretation: 'An AFP above the 7 microg/l threshold in an ataxic patient is what selects
            SETX for sequencing. The link is empirical: no mechanism connecting senataxin loss to AFP
            production has been established, so this is recorded as a correlation with the genetic lesion
            rather than as a readout of any modelled mechanism node.'
      selected_evidence:
        snippet: The probability of missing AOA2 diagnosis, in case of sequencing senataxin gene only
          in non-Friedreich ataxia non-ataxia-telangiectasia ataxic patients with AFP level > or =7 microg/l,
          is 0.23% and the probability for a non-Friedreich ataxia non-ataxia-telangiectasia ataxic patient
          to be affected with AOA2 with AFP levels > or =7 microg/l is 46%.
        supports: SUPPORT
    origin:
