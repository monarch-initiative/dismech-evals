  24e660cf58a959250c5aadc51dabaffded4146d9176f168503e0c623893cc756:
    claim:
      about:
        disease:
          name: Ataxia With Oculomotor Apraxia Type 2
          disease_term:
            preferred_term: ataxia with oculomotor apraxia type 2
            term:
              id: MONDO:0018996
              label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: setx_null_mouse_lacks_the_neurodegeneration
        kind: HUMAN_MODEL_MISMATCH
        prompt: Can a Setx knockout mouse be used to study AOA2 neurodegeneration, when complete loss
          of Setx in the mouse produces no ataxia, no cerebellar degeneration and no Purkinje cell loss?
        attaches_to:
        - pathophysiology#Purkinje Cell Degeneration in the Cerebellar Cortex
        - pathophysiology#Chronic Genomic and Proteostatic Stress in Post-Mitotic Neurons
        - animal_models#Setx knockout mouse
        rationale: 'This is the central translational problem of the disease. The mouse reproduces the
          meiotic and fertility phenotype cleanly and the neurological phenotype not at all, and the failure
          is complete rather than partial: no structural cerebellar change, no Purkinje cell loss, no
          behavioural difference. Two facts make the mismatch mechanistic rather than incidental. First,
          R-loops accumulate in Setx-null proliferating tissue but are undetectable in Setx-null brain,
          and the same is true for Atm-, Tdp1- and Aptx-null brains — so the R-loop mechanism, which is
          the best-supported molecular account of AOA2, has never been demonstrated in the tissue that
          degenerates. Second, the AOA2 transcriptional signature is preserved in the cerebellum of the
          same knockout mice, so the molecular consequence of losing senataxin does reach the mouse cerebellum
          without producing degeneration there.

          Taken together these constrain what the mouse can be used for. It is the right system for the
          meiotic arm and for asking what senataxin does to transcription in vivo. It is not a system
          in which a candidate neuroprotective intervention can be tested, and a negative neurological
          result in it says nothing about the human disease. Patient iPSC-derived neural progenitors were
          built for exactly this reason, and they are proliferating cells, so the post-mitotic question
          remains open in every available model.'
      selected_evidence:
        snippet: These modules were disease-specific and preserved in patient fibroblasts and in the cerebellum
          of Setx knockout mice demonstrating conservation across species and cell types, including neurons.
        supports: SUPPORT
