          term:
            id: GO:0005654
            label: nucleoplasm
      selected_evidence:
        snippet: We report that senataxin, defective in ataxia oculomotor apraxia (AOA) type 2, is a nuclear
          protein involved in the DNA damage response.
        supports: SUPPORT
