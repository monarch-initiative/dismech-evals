          missense, deletion and nonsense alleles.

          SETX is allelic with autosomal dominant juvenile ALS (ALS4, OMIM 602433). That is a separate
          dismech entry; the recessive loss-of-function alleles here and the dominant ALS4 alleles are
          not interchangeable, and the p.K992R change is a population polymorphism at 1-2% rather than
          a disease allele.'
        gene_term:
          preferred_term: SETX
          term:
            id: hgnc:445
            label: SETX
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Pyramidal signs and dystonia were more frequent and disease was less severe with missense
          mutations in the helicase domain of senataxin gene than with missense mutations out of helicase
          domain and deletion and nonsense mutations (P = 0.001, P = 0.008 and P = 0.01, respectively).
        supports: SUPPORT
