  38d39ed3e6cdb76345d67f02f9542e7be2ce84137b339479a8d82054c34e067a:
    claim:
      about:
        disease:
          name: Ataxia With Oculomotor Apraxia Type 2
          disease_term:
            preferred_term: ataxia with oculomotor apraxia type 2
            term:
              id: MONDO:0018996
              label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 2
        context: []
      assertion_type: Genetic
      assertion:
        name: SETX
        notes: 'SETX at 9q34 encodes senataxin, a 2,677-residue DNA/RNA helicase with a C-terminal superfamily-I
          helicase domain and an N-terminal protein-interaction domain. Reported AOA2 alleles are missense,
          frameshift and nonsense changes distributed across the gene, with whole-exon deletions and duplications
          making up an under-recognised minority. L1976R is a founder allele in the French-Canadian population,
          carried on 85% of Quebec-cluster chromosomes. Missense alleles inside the helicase domain are
          associated with a milder course and with more pyramidal signs and dystonia than out-of-domain
          missense, deletion and nonsense alleles.

          SETX is allelic with autosomal dominant juvenile ALS (ALS4, OMIM 602433). That is a separate
          dismech entry; the recessive loss-of-function alleles here and the dominant ALS4 alleles are
          not interchangeable, and the p.K992R change is a population polymorphism at 1-2% rather than
          a disease allele.'
        gene_term:
          preferred_term: SETX
          term:
            id: hgnc:445
            label: SETX
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Ten of the fifteen mutations cause premature termination of a large DEAxQ-box helicase,
          the human ortholog of yeast Sen1p, involved in RNA maturation and termination.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
