            biological_scale: MOLECULAR
            description: R-loops form behind elongating RNA polymerase II, especially over G-rich pause
              sites downstream of poly(A) signals, and must be unwound for the transcript to be degraded
              and the polymerase released. Without senataxin the hybrids persist at these sites and at
              transcription-replication collision points. Note that the direction of the R-loop change
              in senataxin-depleted human cells is not uniform across studies, which is recorded as a
              discussion on this entry rather than smoothed over here.
            biological_processes:
            - preferred_term: R-loop resolution
              modifier: DECREASED
              term:
                id: GO:0062176
                label: R-loop processing
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Defective RNA Polymerase II Transcription Termination
        causal_link_type: DIRECT
      selected_evidence:
        snippet: In effect, R-loops formed over G-rich pause sites, followed by their resolution by senataxin,
          are key steps in the termination process.
        supports: SUPPORT
