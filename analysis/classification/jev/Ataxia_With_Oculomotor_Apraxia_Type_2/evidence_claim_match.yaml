            term:
              id: MONDO:0018996
              label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 2
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Progression to disability
        notes: Steady progression over one to two decades, driven jointly by the cerebellar syndrome and
          the accumulating axonal neuropathy, ending in wheelchair dependence roughly fifteen years after
          onset. Rate of progression is not predicted by sex or by juvenile versus adult onset in pooled
          review; within the largest single cohort, later onset and the presence of oculomotor apraxia
          were associated with slower progression, and strabismus with faster.
      selected_evidence:
        snippet: 'Ataxia with oculomotor apraxia type 2 (AOA2), a rare autosomal recessive neurodegenerative
          disorder, exhibits marked clinical heterogeneity, thereby presenting substantial diagnostic
          challenges. This study conducts an investigation of two pedigrees with SETX gene mutation-associated
          AOA2, coupled with a review of the clinical manifestations and genetic characteristics documented
          in previously reported study. ... Both pedigrees exhibited progressive gait instability, dysarthria,
          peripheral neuropathy, cerebellar atrophy, and elevated α-fetoprotein (AFP). ... Literature
          review of 216 patients revealed median onset age of 15 years old (interquartile range: 13-18),
          with 77.1% developing symptoms between 10 and 20 years. Key clinical features included ataxia
          (100%), dysarthria (99.2%), cerebellar atrophy (99.4%), and elevated AFP (97.6%). Oculomotor
          apraxia was observed in 34.2% of cases. Disease progression to wheelchair dependence averaged
          15.9 ± 8.6 years, with no significant differences observed in gender or adult onset and juvenile
          onset.'
        supports: SUPPORT
