            term:
              id: MONDO:0018996
              label: spinocerebellar ataxia, autosomal recessive, with axonal neuropathy 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: unexplained_alpha_fetoprotein_elevation
        kind: KNOWLEDGE_GAP
        prompt: Why does loss of senataxin raise serum alpha-fetoprotein, when AOA2 patients have no liver
          disease and AFP does not track disease activity?
        attaches_to:
        - biochemical#Serum alpha-fetoprotein
        - pathophysiology#Loss of Senataxin RNA/DNA Helicase Activity
        rationale: 'AFP is the most useful test in the disease and the least understood finding in it.
          Nothing in the curated literature connects senataxin loss to AFP production. The obvious hepatic
          explanation has been examined and does not hold: liver enzymes and liver imaging were normal
          in every AOA2 patient in a series where the majority of ataxia-telangiectasia patients had abnormalities
          of both. The behaviour of the marker is also unusual for a disease biomarker — it is set at
          or before symptom onset and then stays flat while the patient deteriorates over two decades,
          which is why it is a diagnostic and not a monitoring test.

          The gap matters practically as well as mechanistically. Three genetically distinct ataxias raise
          AFP into three different concentration bands, which suggests the level is reporting something
          quantitative about the underlying defect rather than being an incidental association; nobody
          has explained what. Until that is known, the readout link in this entry is deliberately recorded
          as a correlation with the genetic lesion rather than as a readout of any modelled mechanism
          node.'
      selected_evidence:
        snippet: However, the source and clinical implications of this increase, as well as its relationship
          with liver diseases are unknown.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40255955
