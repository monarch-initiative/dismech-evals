          the accumulating axonal neuropathy, ending in wheelchair dependence roughly fifteen years after
          onset. Rate of progression is not predicted by sex or by juvenile versus adult onset in pooled
          review; within the largest single cohort, later onset and the presence of oculomotor apraxia
          were associated with slower progression, and strabismus with faster.
      selected_evidence:
