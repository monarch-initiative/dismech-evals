        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Monoallelic FLNB gain-of-function and abnormal actin binding
        description: 'FLNB-AO1 is caused by heterozygous gain-of-function FLNB variants, commonly clustered
          in the CH2 actin-binding domain or repeats 14-15. Biochemical work on the actin-binding-domain
          substitutions W148R and M202V showed increased F-actin affinity, and cellular work on W148R
          showed F-actin clustering, focal-adhesion rearrangement, and delayed directional migration.
          These experiments establish a plausible cytoskeletal mechanism for an important variant subset;
          they do not demonstrate that every AO1 variant has the same biochemical effect or fully resolve
          the bridge from altered FLNB to fetal cartilage pathology.

          '
        genes:
        - preferred_term: FLNB
          term:
            id: hgnc:3755
            label: FLNB
        molecular_functions:
        - preferred_term: actin filament binding
          term:
            id: GO:0051015
            label: actin filament binding
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: Actin filament organization
          term:
            id: GO:0007015
            label: actin filament organization
          modifier: ABNORMAL
        - preferred_term: Cytoskeleton organization
          term:
            id: GO:0007010
            label: cytoskeleton organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Monoallelic gain-of-function pathogenic variants in FLNB cause a spectrum of phenotypic
          severity ranging from apparently isolated clubfoot to Larsen syndrome (FLNB-LS), atelosteogenesis
          type 3 (FLNB-AO3), and atelosteogenesis type 1 (FLNB-AO1), which is perinatal lethal.
        supports: SUPPORT
