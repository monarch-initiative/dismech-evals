      assertion_type: DifferentialDiagnosis
      assertion:
        name: Achondrogenesis Type IB
        description: ACG1B and AOII are both lethal autosomal-recessive SLC26A2 chondrodysplasias. ACG1B
          generally lies at the more severe end of the continuum and is more often associated with two
          alleles having minimal transport function, but overlap and imperfect genotype-phenotype prediction
          require integrated radiologic and pathologic classification.
        distinguishing_features:
        - ACG1B is generally more severe than AOII within the same SLC26A2 continuum.
        - Two near-null alleles favor ACG1B, whereas AOII often retains more transporter function; this
          is a tendency, not an absolute rule.
        - Radiographic and histopathologic severity should accompany genotype when assigning the subtype.
      selected_evidence:
        snippet: However, in the X.laevis oocyte expression system, the correlation between residual transport
          function and the severity of phenotype was not absolute, suggesting that factors in addition
          to the intrinsic sulfate transport properties of the DTDST protein may influence the phenotype
          in individuals with DTDST mutations.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/1
