      assertion:
        name: Collagen Retention, ATF6-UPR, and FGFR3 Overactivation
        description: In Slc26a2-null mouse chondrocytes, impaired type II/type IX collagen secretion causes
          intracellular collagen retention, preferential ATF6 unfolded-protein-response activation, and
          excessive FGFR3 signaling. This is a provisional preclinical branch and is not yet established
          as a human AOII biomarker or treatment target.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: Unexpectedly, slc26a2-/- chondrocytes are defective for collagen secretion, exhibiting
          intracellular retention and compromised extracellular deposition of ColII and ColIX. As a consequence,
          the ATF6 arm of the unfolded protein response (UPR) is preferentially triggered to overactivate
          FGFR3 signaling by inducing excessive FGFR3 in slc26a2-/- chondrocytes.
        supports: SUPPORT
