      assertion_type: DifferentialDiagnosis
      assertion:
        name: Diastrophic Dysplasia
        disease_term:
          preferred_term: diastrophic dysplasia
          term:
            id: MONDO:0009107
            label: diastrophic dysplasia
        description: Diastrophic dysplasia shares biallelic SLC26A2 variants, hitchhiker thumbs, clubfoot,
          cleft palate, and abnormal cartilage sulfation with AOII, but is usually much less severe and
          compatible with survival. Intermediate phenotypes reinforce that this is a continuum rather
          than a perfectly sharp molecular boundary.
        distinguishing_features:
        - Survival with chronic skeletal morbidity favors diastrophic dysplasia over classic perinatal-lethal
          AOII.
        - AOII has more profound micromelia, thoracic restriction, pulmonary hypoplasia, and airway malacia.
        - Genotype contributes to severity but does not replace clinicoradiologic classification.
      selected_evidence:
        snippet: Analysis suggests that, while the DTDST family of disorders contains at least seven different
          conditions, mutations in the DTDST gene, in fact, appear to cause a phenotypic continuum. Furthermore,
          DTDST genotype alone is an imperfect predictor of clinical severity along this continuum.
        supports: SUPPORT
