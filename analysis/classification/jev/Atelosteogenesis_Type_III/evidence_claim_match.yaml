      assertion:
        name: FLNB-AO3 spectrum definition
        definition_type: OTHER
        description: 'A severe monoallelic FLNB gain-of-function disorder within a continuous phenotypic
          spectrum that also includes FLNB-related Larsen syndrome and FLNB-AO1. AO3 shares severe short-limb
          dwarfism, large-joint dislocations, and clubfeet with AO1, while postneonatal and adult survival
          distinguishes the possible AO3 course from perinatal-lethal AO1.

          '
      selected_evidence:
        snippet: This is the first documentation of survival to adulthood of an individual with this disorder,
          of prenatal diagnostic assessment of an affected individual, and of vertical transmission suggestive
          of autosomal dominant inheritance.
        supports: SUPPORT
