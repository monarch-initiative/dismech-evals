        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Atelosteogenesis type I
        description: 'The perinatal-lethal FLNB-AO1 end of the same gain-of-function spectrum can overlap
          AO3 in skeletal and joint findings. Persistent postneonatal or adult survival supports AO3,
          whereas AO1 is defined as perinatal lethal in current GeneReviews scope; molecular results still
          require phenotype-level spectrum interpretation.

          '
        disease_term:
          preferred_term: atelosteogenesis type I
          term:
            id: MONDO:0007167
            label: atelosteogenesis type I
        distinguishing_features:
        - FLNB-AO1 is defined as perinatal lethal in the current spectrum
        - Survival beyond the neonatal period is possible in FLNB-AO3
      selected_evidence:
        snippet: FLNB-AO1 is lethal in the perinatal period. At its most severe, the spectrum of phenotypes
          assigned FLNB-AO1 can present with perinatal-lethal micromelic dwarfism characterized by flipper-like
          limbs (polysyndactyly with complete syndactyly of all fingers and toes, hypoplastic or absent
          first digits, and duplicated intermediate and distal phalanges); macrobrachycephaly; prominent
          forehead; hypertelorism; and proptosis.
        supports: SUPPORT
