    evidence_metadata:
      reference: PMID:26994362
      reference_title: 'Prevalence and odds of Staphylococcus aureus carriage in atopic dermatitis: a
        systematic review and meta-analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Meta-analysis of 95 observational studies. Establishes the lesional colonization prevalence.
        The same abstract reports the odds of colonization versus healthy controls and that prevalence
        in lesional skin increased with disease severity; those figures are given in brackets in the source
        and so are described here rather than quoted.
