              label: atopic eczema
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: openq_ad_oral_health_caries_comorbidity
        prompt: Atopic dermatitis is associated with impaired oral health (higher plaque, poorer oral
          hygiene, oral dysbiosis) in adults, and in a Singaporean birth cohort (GUSTO) atopic dermatitis
          with allergen sensitization in the first year of life was associated with an increased risk
          of early childhood caries by age 3 (adjusted OR ~3.1 for the AD-SPT-positive group). Is this
          AD-caries comorbidity causal - e.g., via shared structural-gene defects in skin and tooth/enamel,
          oral dysbiosis, dietary/behavioral mediators, or AD-related sleep disturbance and medication
          use - or is it confounded by shared socioeconomic and dietary risk factors?
        kind: OPEN_QUESTION
        status: OPEN
        rationale: 'The GUSTO cohort proposed a "structural defect hypothesis": because both dental caries
          susceptibility and atopic dermatitis are linked to defects in structural genes (e.g., epidermal
          barrier mutations in AD; keratin/enamel structural defects increasing caries risk), the two
          may share a predisposing structural-gene basis (Kalhan et al, PMID:28122670; this JACI letter
          has no structured PubMed abstract). Independently, an adult case-control study found AD associated
          with poorer oral health and oral dysbiosis, offering a microbiome-mediated alternative or complementary
          mechanism. The association in GUSTO was specific to the allergen-sensitized (AD-SPT-positive)
          subgroup and adjusted for several confounders, but causation versus residual confounding (shared
          diet, socioeconomic status, and care behaviors) remains unresolved.'
      selected_evidence:
        snippet: AD appears to be associated with poor oral health and oral dysbiosis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39523189
      reference_title: 'Association of Adult Atopic Dermatitis with Impaired Oral Health and Oral Dysbiosis:
        A Case-Control Study.'
      evidence_source: HUMAN_CLINICAL
      explanation: Case-control evidence that atopic dermatitis is associated with impaired oral health
        and oral dysbiosis, supporting an AD-oral-disease comorbidity relevant to the early-childhood-caries
        association.
