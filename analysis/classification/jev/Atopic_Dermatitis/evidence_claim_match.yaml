      evidence_source: MODEL_ORGANISM
      explanation: Interventional evidence in Adam17-deficient mice that removing the dysbiotic community
        removes the inflammation, which is the strongest available support for an edge running from dysbiosis
        to inflammation rather than the reverse. Model organism only, and the same abstract states the
        causal relationship in human disease is unclarified.
