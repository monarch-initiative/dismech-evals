        context: []
      assertion_type: Environmental
      assertion:
        name: Microbial Dysbiosis
        description: Staphylococcus aureus colonizes lesional skin in roughly 70 percent of patients -
          far more often than healthy controls - and its abundance tracks disease activity, rising during
          flares and with severity.
        effect: WORSENS
        notes: 'This entry stands for the dysbiotic skin community as a whole, of which S. aureus is the
          dominant but not the sole member. The distinction matters when reading the influences_mechanisms
          edges: PMID:25902485 attributes eczema formation to S. aureus but the T helper 2 arm to C. bovis,
          so the edge into the type 2 node is evidenced for the community rather than for S. aureus specifically.
          The description above quantifies only the S. aureus component because that is what the cited
          human studies measure.'
      selected_evidence:
        snippet: The pooled prevalence of S. aureus colonization among patients was 70% for lesional skin,
          39% for nonlesional skin and 62% for the nose
        supports: SUPPORT
    origin:
      assertion_path: /environmental/2
      evidence_path: /environmental/2/evidence/0
