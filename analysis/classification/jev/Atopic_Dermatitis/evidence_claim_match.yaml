      about:
        disease:
          name: Atopic Dermatitis
          disease_term:
            preferred_term: atopic dermatitis
            term:
              id: MONDO:0004980
              label: atopic eczema
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ad_topk_stat3_axis
        prompt: TOPK (PBK) is upregulated in atopic dermatitis and its inhibition attenuates AD-like inflammation
          via STAT3 Ser727 phosphorylation in keratinocytes and mast cells, but is TOPK-STAT3 signaling
          a primary causal driver of AD pathogenesis or a downstream amplifier of the established type
          2 / barrier circuit, what is its dominant in vivo cellular source, and does the axis translate
          from cell and mouse models to human disease?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Type 2 Immune Response
        - pathophysiology#Epidermal Barrier Dysfunction
        - pathophysiology#Secondary Inflammatory Amplification
        rationale: 'Atopic dermatitis pathogenesis is well characterized at the level of epidermal barrier
          dysfunction and the IL-4/IL-13/IL-31 type 2 immune program signaling through JAK1/STAT6, which
          underpins approved biologic and JAK-inhibitor therapies. Recent work identifies T-LAK-cell-originated
          protein kinase (TOPK) as upregulated in AD lesions, where it directly interacts with and phosphorylates
          STAT3 at Ser727 in HaCaT keratinocytes and mast cells, and where genetic or pharmacologic TOPK
          inhibition reduces IgE, IL-6, IL-8, and IL-33 and attenuates AD-like features. What remains
          unresolved is the causal placement of this TOPK-STAT3 axis: whether it initiates inflammation
          upstream of, runs in parallel to, or is induced by the canonical type 2 and barrier pathways,
          and whether STAT3 Ser727 signaling acts mainly in keratinocytes, mast cells, or other resident/infiltrating
          cells in intact skin. The current evidence rests largely on cell lines, bioinformatic (GEO)
          profiling, and a disease model, so the human translational relevance and therapeutic window
          of TOPK inhibition relative to existing STAT6/JAK-directed therapies is unknown.'
        proposed_experiments:
        - experiment_id: exp_ad_topk_stat3_epistasis
          name: Cell-type-resolved epistasis of the TOPK-STAT3 axis versus the type 2 barrier circuit
          description: Use cell-type-conditional TOPK loss- and gain-of-function in barrier and immune
            compartments of AD models, combined with epistasis against IL-4/ IL-13 (type 2) and barrier
            perturbations and STAT3 Ser727 phospho-readouts, to place TOPK-STAT3 in the causal hierarchy
            and identify the dominant in vivo cellular source. Cross-validate against human AD skin to
            test translational relevance.
          experiment_type:
            preferred_term: cell-type-conditional perturbation and epistasis study
          readouts:
          - name: STAT3 Ser727 phosphorylation by compartment
            target: pathophysiology#Secondary Inflammatory Amplification
            description: Quantify STAT3 Ser727 phosphorylation in keratinocytes versus mast cells and
              other skin-resident cells under TOPK perturbation to localize the active signaling compartment.
            assays:
            - preferred_term: phospho-specific immunostaining
            - preferred_term: phosphoproteomic profiling
            direction: POSITIVE
          - name: Type 2 cytokine and barrier dependence
            target: pathophysiology#Type 2 Immune Response
            description: Test whether TOPK-driven inflammation persists when IL-4/IL-13 signaling is blocked,
              distinguishing an upstream/parallel driver from a type 2-dependent amplifier.
            assays:
            - preferred_term: cytokine quantification
            direction: NEGATIVE
          - name: Barrier integrity response to TOPK modulation
            target: pathophysiology#Epidermal Barrier Dysfunction
            description: Measure transepidermal water loss and barrier protein expression after TOPK inhibition
              to determine whether the axis modifies barrier function directly or only via inflammation.
            assays:
            - preferred_term: transepidermal water loss measurement
            direction: NEGATIVE
          decision_criterion: TOPK-STAT3 is supported as a primary driver if compartment-conditional TOPK
            loss reduces AD-like inflammation independently of (and upstream of) intact IL-4/IL-13 signaling,
            with the dominant active STAT3 Ser727 compartment reproducibly identified and the axis detectable
            in human AD skin; it is a downstream amplifier if its effects require an intact type 2 circuit.
          would_support:
          - pathophysiology#Type 2 Immune Response
          - pathophysiology#Secondary Inflammatory Amplification
          - pathophysiology#Epidermal Barrier Dysfunction
      selected_evidence:
        snippet: T-Lymphokine-Activated Killer Cell-Originated Protein Kinase (TOPK) is known to promote
          inflammation, its specific role in AD remains unclear.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42237026
      reference_title: Targeting the TOPK-STAT3 pathway in keratinocytes and mast cells mediates the therapeutic
        attenuation of Atopic dermatitis.
      evidence_source: IN_VITRO
      explanation: Establishes that TOPK is implicated in inflammation but its specific mechanistic role
        in atopic dermatitis is unresolved, motivating the gap.
