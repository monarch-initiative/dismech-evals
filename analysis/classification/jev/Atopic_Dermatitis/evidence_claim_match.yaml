      reference: PMID:22310478
      reference_title: Temporal shifts in the skin microbiome associated with disease flares and treatment
        in children with atopic dermatitis.
      evidence_source: HUMAN_CLINICAL
      explanation: Longitudinal 16S rRNA gene sequencing of the skin microbiome across the flare cycle
        in children, evidencing that abundance tracks disease activity rather than merely co-occurring
        with it. Note the assay is 16S amplicon rather than shotgun metagenomics, so the species-level
        attribution to S. aureus in the quoted sentence carries the resolution limits of amplicon sequencing.
