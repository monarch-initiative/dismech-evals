      assertion_type: Pathophysiology
      assertion:
        name: Epidermal Barrier Dysfunction
        conforms_to: epithelial_barrier_dysfunction#Epithelial Barrier Insult and Junctional Disruption
        description: Loss-of-function mutations in filaggrin (FLG) and other barrier proteins lead to
          impaired skin barrier integrity, increased transepidermal water loss, and enhanced allergen
          penetration. This is the primary initiating event in many patients.
        genes:
        - preferred_term: FLG
          term:
            id: hgnc:3748
            label: FLG
        biological_processes:
        - preferred_term: Keratinization
          term:
            id: GO:0031424
            label: keratinization
        cell_types:
        - preferred_term: Keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
      selected_evidence:
        snippet: Filaggrin is a key protein that facilitates terminal differentiation of the epidermis
          and formation of the skin barrier. Here we show that two independent loss-of-function genetic
          variants (R510X [sic, correct designation is R501X] and 2282del4) in the gene encoding filaggrin
          (FLG) are very strong predisposing factors for atopic dermatitis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16550169
      reference_title: Common loss-of-function variants of the epidermal barrier protein filaggrin are
