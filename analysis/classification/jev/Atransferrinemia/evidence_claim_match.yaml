              label: atransferrinemia
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Zebrafish
        genotype: gavi transferrin-a splice alleles and transferrin-a morphants
        description: Two recessive gavi splice alleles predict truncated transferrin-a and produce hypochromic
          anemia with early lethality. Morpholino knockdown reproduced reduced hemoglobin and tissue-iron
          staining; transferrin-a cRNA partially restored them. TfR2 knockdown reduced hepcidin without
          anemia, whereas anemia induced outside the transferrin pathway did not lower basal embryonic
          hepcidin. The complete main body, methods and captions were reviewed; separate supplementary
          objects were not assessed.
        genes:
        - preferred_term: TF
          term:
            id: hgnc:11740
            label: TF
        modeled_mechanisms:
        - target: Reduced Erythroid Iron Delivery
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
