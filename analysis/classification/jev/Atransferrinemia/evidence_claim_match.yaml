        context: []
      assertion_type: Treatment
      assertion:
        name: Cardiac and endocrine complication management
        description: Cardiac failure and diabetes require specialist management alongside iron-directed
          treatment. The review discusses conventional heart-failure therapy but explicitly lacks atransferrinemia-specific
          evidence for newer adult HFrEF agents; their adult efficacy is not a pediatric disease-specific
          recommendation.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Therapeutic Procedure
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
      selected_evidence:
        snippet: A 13-year-old girl born of second-degree consanguinity presented with heart failure,
          severe anemia, and diabetes mellitus. Her clinical course included heart failure at six months,
          diabetes at age seven, and progressive LV systolic dysfunction. Iron studies revealed low TIBC,
          elevated ferritin, low transferrin saturation, and undetectable transferrin levels (<75 mg/dL).
          Echocardiography showed severe biventricular systolic dysfunction. There was an incidentally
          detected 4 mm PDA (Fig. 4). As the age advanced, heart failure worsened disproportionately.
          Cardiac MRI confirmed myocardial iron overload, and genetic testing identified a novel mutation,
          confirming the diagnosis. This highlights the importance of early recognition and genetic analysis
          in hereditary atransferrinemia.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/5
      evidence_path: /treatments/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41220266
      reference_title: 'Revisiting Congenital Atransferrinemia: A Rare but Treatable Cause of Pediatric
        Heart Failure.'
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: Primary clinical case embedded in a review. Its intronic TF variant is later classified
        as a VUS, so the phenotype is clinically consistent but the allele is not functionally confirmed.
