          mutations, because one was found in each of her parents. In addition to these mutations, which
          we regard to be causative in the patient's atransferrinemia, a silent polymorphism at cDNA 1572
          G-->C was found in exon 13 as well as 2 previously unreported polymorphisms at IVS8 + 62 c-->t
          and IVS14-4 c-->a. The mutation in nt 1572 and that in intron 8 were common in the general population;
          the intron 14 mutation is rare.
