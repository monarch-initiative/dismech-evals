          variant to be present in the heterozygous state. This variant was not observed in population
          databases and in-house whole-exome sequencing (WES) data of 1246 individuals of Indian origin
          (Fig 7). This variant has been classified as a variant of uncertain significance according to
          the American College of Medical Genetics and Genomics (ACMG) guidelines.
