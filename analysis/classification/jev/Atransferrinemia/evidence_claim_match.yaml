  626d5433d6a464e9df41a7b235929e2d3023ef0d7ca619253a7e6a46deaa98d6:
    claim:
      about:
        disease:
          name: Atransferrinemia
          disease_term:
            preferred_term: congenital atransferrinemia
            term:
              id: MONDO:0008846
              label: atransferrinemia
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mouse
        genotype: Trf hpx/hpx on a BALB/cJ background in the mechanistic study
        description: The spontaneous splice-donor allele produces severe transferrin deficiency, anemia
          and nonhematopoietic iron loading. The 2011 study compared replacement, washed wild-type red-cell
          transfusion and myeloablation followed by transferrin. Replacement improved hematologic and
          hepcidin readouts; withdrawal allowed recurrence. Suppression of erythropoiesis and restoration
          of transferrin make separable contributions. The study does not establish apoptosis of immature
          erythrocytes, a complete human signaling chain or universal clinical rescue.
        genes:
        - preferred_term: TF
          term:
            id: hgnc:11740
            label: TF
        modeled_mechanisms:
        - target: Reduced Circulating Transferrin
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: The hpx splice allele reduces the normal circulating carrier.
          limitations: This postnatal mouse splice defect models severe deficiency, not every human missense
            allele or the nonanemic adult spectrum. Early survival support, strain-dependent drug responses,
            myelotoxic and iron-chelating effects of doxorubicin, and different transferrin doses constrain
            causal interpretation. No specific human receptor or erythroid mediator is isolated.
          readouts:
          - name: Abnormal Trf splicing
            target: Reduced Circulating Transferrin
            direction: ALTERED
            interpretation: The hpx splice allele reduces the normal circulating carrier.
        - target: Reduced Hemoglobin Synthesis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Replacement improves hematologic readouts of iron-restricted erythropoiesis.
          limitations: This postnatal mouse splice defect models severe deficiency, not every human missense
            allele or the nonanemic adult spectrum. Early survival support, strain-dependent drug responses,
            myelotoxic and iron-chelating effects of doxorubicin, and different transferrin doses constrain
            causal interpretation. No specific human receptor or erythroid mediator is isolated.
          readouts:
          - name: Hematocrit response
            target: Reduced Hemoglobin Synthesis
            direction: ALTERED
            interpretation: Replacement improves hematologic readouts of iron-restricted erythropoiesis.
        - target: Reduced Transferrin-Dependent Hepcidin Stimulation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Transferrin stimulates hepatic hepcidin after myeloablation.
          limitations: This postnatal mouse splice defect models severe deficiency, not every human missense
            allele or the nonanemic adult spectrum. Early survival support, strain-dependent drug responses,
            myelotoxic and iron-chelating effects of doxorubicin, and different transferrin doses constrain
            causal interpretation. No specific human receptor or erythroid mediator is isolated.
          readouts:
          - name: Hepatic hepcidin RNA after transferrin
            target: Reduced Transferrin-Dependent Hepcidin Stimulation
            direction: ALTERED
            interpretation: Transferrin stimulates hepatic hepcidin after myeloablation.
      selected_evidence:
        snippet: By the third day of treatment, spleen masses had decreased and hematocrits had normalized;
          by the sixth day of treatment, hepcidin levels were elevated from baseline to levels similar
          to those observed in wild-type mice (data not shown). Six weeks after cessation of treatment,
          hematocrits, spleen masses, and hepcidin levels reverted to pretreatment or near-pretreatment
          levels (data not shown).
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/1
