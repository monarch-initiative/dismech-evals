  237eaa0c768b888a7e6ee5dada383d20d89679606e41c8dee9da8ce206bd18ce:
    claim:
      about:
        disease:
          name: Atransferrinemia
          disease_term:
            preferred_term: congenital atransferrinemia
            term:
              id: MONDO:0008846
              label: atransferrinemia
        context: []
      assertion_type: Genetic
      assertion:
        name: TF
        gene_term:
          preferred_term: TF
          term:
            id: hgnc:11740
            label: TF
        relationship_type: CAUSATIVE
        notes: TF encodes the major plasma iron carrier. Recessive defects can markedly lower circulating
          protein, but individual missense alleles should not all be assigned the same folding, secretion
          or iron-binding mechanism without functional evidence. The US compound-heterozygous p.Ala477Pro
          and deletion-insertion case and Turkish p.Cys137Tyr case are reported primary examples. The
          adult p.Glu370Lys family broadens the clinical spectrum. A newly reported intronic deletion
          remains a VUS despite a compatible phenotype. A broader hereditary hypotransferrinemia series
          also described HFE/HAMP or acquired cofactors; those selected cases do not establish that every
          carrier develops overload.
        variants:
        - name: TF p.Ala477Pro with a second deletion-insertion allele
          description: 'The first molecularly characterized US case had two different alleles: p.Ala477Pro
            and a 10-bp deletion with 9-bp insertion. Segregation and conservation supported causality;
            the accessible abstract does not report a secretion assay.'
        - name: TF p.Cys137Tyr
          description: Exon-4 c.410G>A was reported in the Turkish case subsequently followed under plasma
            plus iron treatment; these publications concern one patient.
        - name: TF p.Glu370Lys
          description: Homozygous c.1108G>A in two adult sisters with severe hypotransferrinemia and iron
            overload; classified as likely pathogenic by the 2025 authors using prediction and segregation,
            without a reported functional assay.
        - name: TF c.2063-11_2063-10del
          description: A homozygous intronic variant in a 13-year-old with anemia, cardiac/hepatic iron
            and diabetes. The source explicitly classifies it as a variant of uncertain significance;
            rarity and segregation do not establish a splice defect.
      selected_evidence:
        snippet: Genetic analysis revealed homozygous TF variant NM_001063.3:c.1108G>A , p.(Glu370Lys).
          No other variants were found in the gene panel.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
      context_paths:
