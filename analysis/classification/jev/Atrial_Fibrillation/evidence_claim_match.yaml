      assertion:
        name: Atrial Flutter
        disease_term:
          preferred_term: atrial flutter
          term:
            id: MONDO:0005310
            label: atrial flutter
        description: A macroreentrant atrial arrhythmia that may have a regular or variably conducted
          ventricular response and can be mistaken for AF on a surface ECG.
        distinguishing_features:
        - Organized flutter-wave activity and a repeating atrial cycle favor flutter.
        - Prominent atrial activity can make AF appear flutter-like; review multiple leads and longer
          recordings.
      selected_evidence:
        snippet: In conclusion, atrial fibrillation is frequently misdiagnosed as atrial flutter. Misdiagnosis
          of atrial fibrillation occurs more often when atrial activity is prominent on an ECG in more
          than one lead.
        supports: SUPPORT
