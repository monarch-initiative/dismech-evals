      assertion:
        hypothesis_group_id: tmao_autonomic_af
        hypothesis_label: Gut microbial TMAO promotes AF via M2 muscarinic receptor autonomic dysfunction
        status: EMERGING
        description: 'Gut-microbiome-derived TMAO promotes AF onset and persistence, at least in part
          by inhibiting the cardiac M2 muscarinic receptor (TMAO mimics acetylcholine), producing autonomic
          dysfunction with atrial APD/wavelength shortening. Supported by a human association (adjusted
          OR 1.7), two mouse AF models, and pharmacologic reversal with the gut-restricted CutC/D inhibitor
          IMC.

          '
      selected_evidence:
        snippet: TMAO levels were quantified in plasma from serial subjects undergoing elective cardiac
          catheterizations (N=5090) and shown to independently associate with prevalent AF following adjustment
          for risk factors (TMAO adjusted odds ratio 1.7 [95% confidence interval 1.3-2.1]
        supports: SUPPORT
