      assertion_type: Definition
      assertion:
        name: Electrocardiographic clinical definition of atrial fibrillation
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: A supraventricular tachyarrhythmia confirmed on 12-lead ECG by irregular atrial activity
          (fibrillatory waves) without discrete P waves, or on a rhythm strip lasting longer than 30 seconds.
          A wearable-device alert alone is a screening signal and requires ECG correlation or additional
          testing.
        scope: This entry represents common clinical atrial fibrillation across paroxysmal, persistent,
          long-standing persistent, and permanent temporal patterns. Rare Mendelian familial atrial fibrillation
          is modeled separately in Familial_Atrial_Fibrillation.
      selected_evidence:
        snippet: The diagnosis of AF is confirmed by identifying irregular atrial activity (fibrillatory
          waves) without discrete P waves on 12-lead ECG4or lasting for longer than 30 seconds on rhythm
          strip.
        supports: SUPPORT
