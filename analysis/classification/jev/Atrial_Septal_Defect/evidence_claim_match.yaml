          MYH6-associated disease and inform counseling and family testing.
      selected_evidence:
        snippet: Although atrial septal defects (ASD) can be subdivided based on their anatomical location,
          an essential aspect of human genetics and genetic counseling is distinguishing between isolated
          and familiar cases without extracardiac features and syndromic cases with the co-occurrence
          of extracardiac abnormalities, such as developmental delay.
        supports: SUPPORT
