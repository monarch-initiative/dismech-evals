        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: VARIABLE
        rationale: Small, hemodynamically insignificant defects may impose little functional burden, whereas
          persistent significant shunts can require catheter or surgical repair and lifelong congenital-cardiology
          follow-up and can lead to arrhythmia, thromboembolism, right-heart failure, or pulmonary arterial
          hypertension. The broad ASD/interatrial-communication umbrella therefore cannot be represented
          honestly by one low, moderate, or high tier.
      selected_evidence:
        snippet: Although considered a simple defect, challenges in optimal diagnostic and treatment options
          still exist due to great heterogeneity in terms of anatomy and time-related complications primarily
          arrhythmias, thromboembolism, right heart failure and, in a subset of patients, pulmonary arterial
          hypertension (PAH).
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
