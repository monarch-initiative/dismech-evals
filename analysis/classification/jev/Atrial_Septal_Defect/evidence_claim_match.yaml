        description: Genetic evaluation is most relevant when ASD is familial, accompanied by conduction
          disease, or associated with extracardiac or syndromic features. A negative panel does not exclude
          ASD because most cases are not explained by a single established Mendelian gene.
        diagnosis_term:
          preferred_term: genetic testing
