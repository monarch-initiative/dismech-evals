      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: scn5a_atrial_excitability_failure
        hypothesis_label: SCN5A-Related Atrial Excitability Failure
        status: CANONICAL
        description: Pathogenic SCN5A loss-of-function reduces sodium-current availability and suppresses
          atrial action-potential initiation or propagation. This is the best-supported electrical route
          to primary atrial standstill, with human segregation, functional channel studies, a multicenter
          pediatric cohort, and a systematic review of biallelic SCN5A disease.
      selected_evidence:
        snippet: 'CONCLUSIONS: A homozygous loss-of-function SCN5A mutation likely results in atrial standstill
          and sudden death due to suppression of initiation of action potential.'
        supports: SUPPORT
