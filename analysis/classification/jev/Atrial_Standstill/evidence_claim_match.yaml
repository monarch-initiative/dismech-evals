      assertion_type: DifferentialDiagnosis
      assertion:
        name: Broader inherited atrial or ventricular cardiomyopathy
        description: EMD/LMNA nuclear-envelope disease, NPPA atrial dilated cardiomyopathy, RYR2 exon-3
          deletion disease, and rare TAF1A or HCN4 reports can include atrial standstill as one manifestation.
          They should be represented under their broader gene-specific disease identities unless evidence
          establishes a primary isolated-standstill relationship.
        distinguishing_features:
        - Left ventricular noncompaction, ventricular dilation or fibrosis, skeletal myopathy, contractures,
          or a broad conduction/ventricular-arrhythmia phenotype favors a wider cardiomyopathy syndrome.
        - A gene-specific diagnosis outside SCN5A or MYL4 should not be promoted to primary isolated atrial
          standstill from a single case alone.
      selected_evidence:
        snippet: Cardiac emerinopathy is a novel nonsyndromic X-linked progressive atrial standstill associated
          with LVNC and increased risk of thromboembolism.
