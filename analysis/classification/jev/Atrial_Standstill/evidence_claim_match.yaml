      assertion_type: DifferentialDiagnosis
      assertion:
        name: Secondary or acquired atrial standstill
        description: Atrial electrical and mechanical silence can be induced by hypoxia, myocardial infarction,
          amyloidosis, muscular dystrophy, inflammatory atrial disease, and quinidine or digitalis toxicity.
          These cases share the final phenotype but do not establish the primary isolated disease modeled
          here.
        distinguishing_features:
        - A temporally related systemic, infiltrative, inflammatory, ischemic, metabolic, or drug exposure
          favors secondary standstill.
        - Reversibility after correction of the cause favors a transient secondary form.
        - Family history and pathogenic SCN5A or MYL4 variation favor primary inherited disease.
      selected_evidence:
        snippet: Previous reports showed that AS could be induced by various conditions, including hypoxia,
          muscular dystrophia, amyloidosis, myocardial infarction, and toxicity from quinidine or digitalis.
        supports: SUPPORT
