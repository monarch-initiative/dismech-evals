        - treatments#Coronary sinus atrial lead placement for partial atrial standstill
        - treatments#Anticoagulant therapy for thromboembolic risk
        - pathophysiology#Thromboembolic Risk from Atrial Stasis
        rationale: Management evidence is a retrospective 20-patient pediatric cohort plus case reports.
