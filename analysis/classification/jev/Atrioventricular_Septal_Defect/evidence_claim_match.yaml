      assertion_type: ExperimentalModel
      assertion:
        name: COS-7 NFATC1 variant localization and reporter assays
        experimental_model_type: CELL_LINE
        cell_source: Transfected COS-7 monkey cells
        publication: url:https://www.hubrecht.eu/app/uploads/2017/11/Den-Hertog-publicatie-Human-Mutation-2018.pdf
        description: Wild-type and three variant human NFATC1 constructs were compared using microscopy,
          nuclear/cytoplasmic immunoblots and an NPPB luciferase reporter. Ionomycin stimulation, separate
          exogenous-NLS constructs and equal wild-type/mutant cotransfection tested localization and interference.
          Val210Met had the clearest dominant-negative behavior.
        notes: Heterologous transient overexpression and one promoter are not patient cardiac-tissue measurements.
          Baseline and added-NLS constructs are distinct. Reduced import and reporter output are associated
          but not proven to form an exclusive mediator chain; a milder Ala367Val effect and unresolved
          actions of the other variants are retained.
        modeled_mechanisms:
        - target: Reduced NFATC1 Nuclear Availability
          relationship: MEASURES
          description: Variant proteins show impaired nuclear localization.
          readouts:
          - name: Nuclear NFATC1 localization
            target: Reduced NFATC1 Nuclear Availability
            direction: DECREASED
            interpretation: Variant proteins show impaired nuclear localization.
        - target: Reduced NFATC1 Transcriptional Output
          relationship: MEASURES
          description: The NPPB reporter is less activated by variant constructs.
          readouts:
          - name: NPPB reporter activation
            target: Reduced NFATC1 Transcriptional Output
            direction: DECREASED
            interpretation: The NPPB reporter is less activated by variant constructs.
      selected_evidence:
        snippet: all mutants showed a variably reduced activation of theNPPB promoter, in all conditions.
        supports: SUPPORT
