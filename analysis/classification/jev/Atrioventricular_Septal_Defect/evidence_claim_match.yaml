      assertion_type: Discussion
      assertion:
        discussion_id: gap_developmental_heterogeneity
        kind: KNOWLEDGE_GAP
        prompt: Which developmental route accounts for each AVSD genotype and anatomical subtype?
        rationale: Human AVSD is etiologically heterogeneous. Endocardial growth, distinct mesenchymal
          components, myocardial identity and laterality can contribute in different models. Modifier
          crosses that produce VSD or secundum ASD cannot be assumed to reproduce the human common-junction
          defect. No single obligatory EndoMT or two-hit pathway is established.
        attaches_to:
        - pathophysiology#Deficient Atrioventricular Septation
      selected_evidence:
        snippet: The role of the dorsal mesenchymal protrusion (DMP) in AVSD pathogenesis has been well-documented
          in studies using animal models for AVSDs
        supports: SUPPORT
    origin:
