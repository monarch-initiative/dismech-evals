      assertion_type: AnimalModel
      assertion:
        name: Dp1Tyb Hmgn1 dosage correction
        species: Mouse
        genotype: Dp1Tyb with one Hmgn1 allele removed
        publication: PMID:41125893
        description: E11.5 single-cell profiling tests AVC myocardial state after Hmgn1 dose correction;
          E15.5 micro-CT measures ventricular and outflow septal defects. The trisomic group had such
          defects in eight of 33 embryos. Correction attenuated these structural defects and neonatal
          lethality.
        notes: The structural endpoint is not a validated count of human-type common-junction AVSD. Small
          atrial defects were difficult to distinguish from patent foramen ovale. Transcriptomic sample
          counts were small, and corrected AVC cell proportions did not establish lineage replacement.
          Survival benefit is not shown to be mediated exclusively by cardiac rescue; HMGN1-alone anatomical
          sufficiency remains untested.
        modeled_mechanisms:
        - target: Altered Atrioventricular Myocardial Identity
          relationship: RESCUES
          description: Dose correction restores part of the abnormal AVC myocardial program.
          readouts:
          - name: AVC transcriptional-state abnormality
            target: Altered Atrioventricular Myocardial Identity
            direction: DECREASED
            interpretation: Dose correction restores part of the abnormal AVC myocardial program.
        - target: Deficient Atrioventricular Septation
          relationship: PARTIALLY_RECAPITULATES
          description: Ventricular/outflow septal defects are reduced; exact human AVSD anatomy is not
            the demonstrated endpoint.
          limitations: Anatomical transfer to AVSD remains partial.
          readouts:
          - name: Ventricular and outflow septal-defect incidence
            target: Deficient Atrioventricular Septation
            direction: DECREASED
            interpretation: Ventricular/outflow septal defects are reduced; exact human AVSD anatomy is
              not the demonstrated endpoint.
      selected_evidence:
        snippet: Removal of one allele of Hmgn1 in the Dp1Tyb (Tg) trisomic mouse rescued the increased
          incidence of VSDs and outflow tract defects
        supports: SUPPORT
