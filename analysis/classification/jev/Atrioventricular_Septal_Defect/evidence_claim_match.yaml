              label: atrioventricular septal defect
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_diet_specificity
        kind: KNOWLEDGE_GAP
        prompt: Do maternal dietary associations in pooled congenital heart disease apply specifically
          to AVSD?
        rationale: The Baby Hearts Study pooled 242 non-genetic CHD cases and 966 controls; only 11 cases
          were in the broad AV-junction/valve category, and no subtype-specific effect estimates were
          published. Frequent intake of the listed folate-rich fruits was associated with lower pooled
          CHD odds, but no causal dietary constituent was established. Its diabetes estimate was crude;
          the four exposed cases were VSD, transposition or double-inlet left ventricle, not AVSD. Do
          not use this source for an AVSD-specific protective diet, a diabetes mechanism, or a fruit/folate-to-septation
          edge.
      selected_evidence:
        snippet: This type of study cannot identify which dietary components are causally associated,
          and the possibility of unmeasured confounding cannot be excluded
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
