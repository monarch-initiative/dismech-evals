        phase: Repair and long-term residual lesions
        notes: Repair improves hemodynamics but does not ensure normal valve function or abolish all residual
          shunts, outflow obstruction or rhythm risk. Lifelong review is needed. In the 248-patient biventricular
          single-center cohort spanning 1995–2022, survival was 88.3% at 10 and 79.6% at 25 years; these
          estimates mix eras and selected operable anatomy, with few patients beyond 20 years. Patients
          dying after palliation before definitive repair were excluded.
