          allele; not every variant is equivalently pathogenic or fully penetrant. Reporter effects depend
          on promoter and cell context, rather than universal loss of function. The source contains inconsistent
          HGVS/protein nomenclature, so detailed allele coordinates are not reproduced. The author-hosted
          full PDF is PMID:24702954; the 2016 correction concerns an author surname.
