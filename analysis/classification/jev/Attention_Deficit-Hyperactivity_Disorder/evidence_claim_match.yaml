        hypothesis_label: Genetically distinct sustained-attention and executive-function pathways
        status: EMERGING
        description: 'Genomic Structural Equation Modeling identified two partially distinct latent genetic
          factors: one influencing sustained attention (SA: vigilance, lapse recovery cost, lapse propensity)
          and one influencing executive function (EF: processing speed, response selection, working memory).
          Both factors show unique genetic correlations with ADHD liability and other psychiatric outcomes,
          suggesting that ADHD genetic heterogeneity may partly reflect differential loading on SA versus
          EF genetic architectures. This is an emerging hypothesis pending replication in more diverse
          populations.'
      selected_evidence:
        snippet: They suggest that genetic influences on sustained attention are generally distinct from
          those that influence executive function. The EF and SA factors show distinct patterns of genetic
          overlap with multiple cognitive and psychiatric outcomes, underscoring the need for more granular
          cognitive phenotyping to generate new insights into the genetic architecture of cognition and
          the etiology of psychopathology.
