  22f14a32918c61b9a351dcf57610c6f2d9e23bd439df6844917aa097888ed67e:
    claim:
      about:
        disease:
          name: Attenuated Mucopolysaccharidosis Type I
        context: []
      assertion_type: Biochemical
      assertion:
        name: Alpha-L-iduronidase activity
        presence: Reduced
        context: Deficient activity in leukocytes or cultured fibroblasts supports MPS I. Routine assays
          do not reliably separate severe from attenuated disease, and activity can be undetectable in
          either. Artificial-substrate pseudodeficiency requires interpretation with GAG metabolism and
          molecular findings. Specialized residual-activity assays show overlapping ranges and remain
          insufficient to establish a universal CNS-protection threshold.
      selected_evidence:
        snippet: Mean residual IDUA activity was 0.18% (range 0-0.6) of the control value in MPS IH fibroblasts
          (n=5); against 0.27% (range 0.2-0.3) in MPS IH/S cells (n=3); and 0.79% (range 0.3-1.8) in MPS
          IS fibroblasts (n=5).
        supports: SUPPORT
