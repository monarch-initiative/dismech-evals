        disease:
          name: Attenuated Mucopolysaccharidosis Type I
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: residual_activity_genotype_and_evidence_boundaries
        rationale: The enzyme-activity study uses a small number of cultured-cell lines and overlapping
          residual ranges, while the genotype registry uses clinician-assigned severity and incomplete
          phase information. Neither establishes a universal enzyme threshold that protects the human
          brain. The French treatment cohort has inconsistent mortality-by-treatment-age statements between
          narrative and Table 2; no claim that all attenuated deaths followed adult treatment initiation
          is adopted. Its growth, antibody and organ outcomes are uncontrolled observations, and follow-up
          denominators vary by measurement.
        prompt: How well do residual-activity assays and genotype predict individual outcomes?
        kind: INTERPRETATION
        status: OPEN
      selected_evidence:
        snippet: A total of 24 patients were homozygous for P533R; seven classified as severe and 17 classified
          as attenuated.
        supports: SUPPORT
    origin:
