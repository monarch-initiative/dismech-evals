        disease:
          name: Attenuated Mucopolysaccharidosis Type I
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cardiac_natural_history_and_source_limitations
        rationale: The cardiac registry uses echocardiograms obtained before ERT or HSCT. It therefore
          does not demonstrate treatment-related stabilization. Valve findings are ever-observed during
          irregular follow-up, not graded incident events. Among attenuated patients, posterior-wall hypertrophy
          occurred in 27 of 87 with measurements, septal hypertrophy in 14 of 86 and low shortening fraction
          in seven of 104. Normal group averages and stable modeled trajectories do not exclude individual
          myocardial involvement; histology, cardiac MRI, strain and diastolic measurements were unavailable.
        prompt: What can untreated echocardiographic registry findings establish about myocardial disease
          and treatment effects?
        kind: INTERPRETATION
        status: OPEN
      selected_evidence:
        snippet: All available echocardiography assessments completed prior to treatment initiation were
          used.
        supports: SUPPORT
