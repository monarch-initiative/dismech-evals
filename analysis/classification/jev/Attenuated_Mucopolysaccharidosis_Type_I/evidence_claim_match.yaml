        name: Multisystem baseline evaluation and surveillance
        description: Arrange coordinated neurologic, ophthalmologic, auditory, cardiac, respiratory, gastrointestinal
          and musculoskeletal assessment. The management guideline recommends follow-up every six to twelve
          months with individualized intervals. Include echocardiography, pulmonary and sleep assessment,
          nerve-conduction studies, spinal examination and developmental or educational review; symptoms
          alone may miss carpal-tunnel or cord disease.
      selected_evidence:
        snippet: All patients with mucopolysaccharidosis I should receive a comprehensive baseline evaluation,
          including neurologic, ophthalmologic, auditory, cardiac, respiratory, gastrointestinal, and
          musculoskeletal assessments, and should be monitored every 6 to 12 months with individualized
          specialty assessments, to monitor disease progression and effects of intervention.
