          four per group. Existing intravenous ERT continued. No significant between-group cognitive benefit
          was demonstrated; stable controls, small sample size and limited controlled duration constrain
          inference.
        target_phenotypes:
        - preferred_term: Cognitive impairment
          term:
            id: HP:0100543
            label: Cognitive impairment
      selected_evidence:
        snippet: This is a 24-month study of the use of laronidase administered into the spinal fluid
          to treat cognitive decline in mucopolysaccharidosis I (MPS I). MPS I is a rare genetic condition
          due to deficiency of the enzyme alpha-l-iduronidase. Laronidase is the manufactured form of
          the enzyme alpha-l-iduronidase.
        supports: SUPPORT
