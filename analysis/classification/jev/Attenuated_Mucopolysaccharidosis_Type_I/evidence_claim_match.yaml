  b221c75c45ccfac25834f6c29a9c9713ccafcd5bfc76fc076a9a6efa22fc28f5:
    claim:
      about:
        disease:
          name: Attenuated Mucopolysaccharidosis Type I
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Biochemical and molecular confirmation
        description: Assess urinary dermatan/heparan sulfate and IDUA enzyme activity, then interpret
          biallelic pathogenic or likely pathogenic IDUA variants with the biochemical findings. Urinary
          screening is neither subtype-specific nor perfectly sensitive; a reassuring screen alone should
          not terminate evaluation when clinical suspicion persists. Enzyme pseudodeficiency and variants
          of uncertain significance are important pitfalls. Parent testing can clarify phase.
      selected_evidence:
        snippet: Due to the presence of IDUA pseudodeficiency, the establishment of the diagnosis of MPS
          I requires the demonstration of BOTH deficiency of IDUA enzyme activity AND elevation of urine
          GAGs.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
