          name: Attenuated Mucopolysaccharidosis Type I
        context: []
      assertion_type: Biochemical
      assertion:
        name: Urinary dermatan and heparan sulfate
        presence: Elevated
        context: Quantitative or qualitative urinary GAG analysis supports the diagnosis, but reduced
          sensitivity, especially in dilute urine, can complicate screening. Urinary GAG reduction after
          laronidase is a pharmacodynamic response and does not establish correction of all tissue storage
          or clinical endpoints. In the long-term French attenuated cohort, 11 of 17 patients with relevant
          measurements reached age-adjusted normal levels, rather than 65% of all 25 attenuated participants.
      selected_evidence:
        snippet: Analysis of urine glycosaminoglycans (GAG) (i.e., heparan and dermatan sulfate) may be
          quantitative (measurement of total urinary GAGs or specific GAG disaccharides) or qualitative
          (GAG electrophoresis to analyze the specific GAGs excreted).
        supports: SUPPORT
