  da944bc5da9579987bcaaddb68e8450119f994903f3b8faaee5c0b59d2c21fe5:
    claim:
      about:
        disease:
          name: Attenuated Mucopolysaccharidosis Type I
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: inflammatory_therapy_evidence_is_not_attenuated_specific
        rationale: A small adalimumab crossover pilot in the tissue review enrolled one post-transplant
          Hurler patient and one patient with attenuated MPS II. It did not demonstrate treatment efficacy
          in attenuated MPS I. Parent-reported pain and some range-of-motion findings favored active treatment,
          but another pain measure, walking distance and handgrip did not improve, one family was effectively
          unblinded and safety follow-up was short. This supports further research rather than routine
          anti-TNF care or a proven human TLR4-to-TNF causal cascade.
        prompt: Does anti-inflammatory treatment benefit attenuated MPS I beyond existing care?
        kind: INTERPRETATION
        status: OPEN
      selected_evidence:
        snippet: 'We found comparable changes of 13° and 28° in the participant with MPS type IH (Subject  #
          1), who had been previously treated with hematopoietic stem cell transplantation, over just
          16 weeks of treatment with adalimumab.'
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:28119823
      reference_title: Pilot study of the safety and effect of adalimumab on pain, physical function,
        and musculoskeletal disease in mucopolysaccharidosis types I and II.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: The MPS I participant had severe Hurler disease, not attenuated MPS I.
