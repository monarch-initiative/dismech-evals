  83b8c123144483a566c42f1196a40a8963ef6eaeab05872dcccddf4b71a63d35:
    claim:
      about:
        disease:
          name: Attenuated Mucopolysaccharidosis Type I
        context: []
      assertion_type: Treatment
      assertion:
        name: Intravenous laronidase enzyme replacement
        description: Weekly intravenous laronidase supplies recombinant IDUA for somatic disease. The
          current US label covers Hurler and Hurler-Scheie forms and Scheie disease with moderate-to-severe
          symptoms; efficacy and safety for mildly affected Scheie patients are not established. In the
          pivotal 26-week trial, 44 of 45 participants had attenuated disease. FVC improved; the walking-distance
          result was significant in a prespecified adjusted analysis but not the unadjusted comparison.
          Long-term observational data suggest some somatic benefit, but skeletal, corneal, valvular and
          spinal disease can persist or progress. CNS effects have not been established. Earlier treatment
          may help, but no validated age-nine cutoff follows from the uncontrolled growth cohorts.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: laronidase
            term:
              id: NCIT:C83864
              label: Laronidase
        notes: Infusion reactions can be severe, including anaphylaxis and cardiorespiratory decompensation;
          label-directed monitoring and individualized premedication are required. Anti-drug antibodies
          are common. Cell-uptake neutralization and associations with reduced urinary-GAG response have
          been reported, so the absence of an FVC/6MWT correlation in trials does not establish that antibodies
          are always clinically irrelevant.
      selected_evidence:
        snippet: The safety and effectiveness of treating mildly affected patients with the Scheie form
          have not been established.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/1
      context_paths:
      - /name
