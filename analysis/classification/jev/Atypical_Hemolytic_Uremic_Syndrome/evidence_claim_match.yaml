        context: []
      assertion_type: Subtype
      assertion:
        name: CFH-aHUS
        display_name: CFH-Associated aHUS
        description: Mutations in complement factor H (CFH), the main soluble regulator of the alternative
          pathway. Most common genetic form, accounting for ~25-30% of genetic aHUS. Often severe with
          high relapse rate and poor renal prognosis without complement inhibition.
      selected_evidence:
        snippet: Patients with a Complement Factor H mutation had reduced ESRD-free survival, whereas
          Membrane Cofactor Protein mutation was associated with longer ESRD-free survival.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29907460
      reference_title: Clinical and genetic predictors of atypical hemolytic uremic syndrome phenotype
        and outcome.
      evidence_source: HUMAN_CLINICAL
      explanation: Global aHUS Registry data confirm that CFH mutations carry the worst renal prognosis
        (reduced ESRD-free survival), matching the severe course of this subtype.
