  f20feb34adf136fe14e26405ab202fdd423be1ce63e944a7e8a9234cc746e1ef:
    claim:
      about:
        disease:
          name: Atypical Hemolytic Uremic Syndrome
          disease_term:
            preferred_term: Atypical Hemolytic-Uremic Syndrome
            term:
              id: MONDO:0016244
              label: atypical hemolytic-uremic syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Alternative Complement Pathway Dysregulation
        conforms_to: complement_dysregulation#Loss of Complement Regulatory Control
        description: The central mechanism of aHUS is loss of regulation of the alternative complement
          pathway on endothelial cell surfaces. Normally, complement factor H (CFH), membrane cofactor
          protein (MCP/CD46), and factor I (CFI) cooperate to inactivate C3b deposited on host cell surfaces.
          In aHUS, genetic mutations in these regulators or gain-of-function mutations in complement effectors
          (CFB, C3) lead to unchecked C3 convertase (C3bBb) activity and amplification loop activation
          on endothelial surfaces.
        cell_types:
        - preferred_term: Glomerular Endothelial Cell
          term:
            id: CL:0002188
            label: glomerular endothelial cell
        biological_processes:
        - preferred_term: Complement Activation, Alternative Pathway
          term:
            id: GO:0006957
            label: complement activation, alternative pathway
          modifier: INCREASED
        - preferred_term: Regulation of Complement Activation
          term:
            id: GO:0030449
            label: regulation of complement activation
          modifier: DECREASED
      selected_evidence:
        snippet: Atypical hemolytic uremic syndrome (aHUS) is a rare cause of thrombotic microangiopathy
          (TMA) caused by the dysregulation of the alternative complement pathway.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39918340
      reference_title: 'Recommendations for diagnosis and treatment of Atypical Hemolytic Uremic Syndrome
        (aHUS): an expert consensus statement from the Rare Diseases Committee of the Brazilian Society
        of Nephrology (COMDORA-SBN).'
      evidence_source: HUMAN_CLINICAL
      explanation: This 2025 consensus statement confirms that aHUS is fundamentally caused by alternative
        complement pathway dysregulation.
