          and systemic infections such as severe leptospirosis), pregnancy (especially postpartum), organ
          transplantation, certain medications (calcineurin inhibitors, oral contraceptives), and autoimmune
          conditions. Severe infections provoke systemic inflammation and endothelial injury that can
          activate the alternative complement pathway in susceptible carriers, precipitating secondary
          aHUS manifestations.
      selected_evidence:
        snippet: This review aims to provide an assessment of the nature and extent of complement involvement
          in TMA associated with autoimmune diseases such as systemic lupus erythematosus, antiphospholipid
          syndrome, and scleroderma renal crisis.
        supports: SUPPORT
