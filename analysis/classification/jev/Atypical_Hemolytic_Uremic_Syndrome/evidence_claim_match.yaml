              on endothelial cells, causing direct cell injury. Sublytic MAC deposition induces endothelial
              activation with upregulation of adhesion molecules, tissue factor expression, and loss of
              thrombomodulin. Injured endothelium releases von Willebrand factor (vWF) multimers and exposes
              subendothelial collagen.
            cell_types:
