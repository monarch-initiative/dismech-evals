      reference_title: The Role of Complement in Autoimmune Disease-Associated Thrombotic Microangiopathy
        and the Potential for Therapeutics.
      evidence_source: HUMAN_CLINICAL
      explanation: Autoimmune diseases (notably systemic lupus erythematosus) are recognized complement-activating
        settings that can precipitate or coexist with complement-mediated aHUS-type TMA, supporting autoimmune
