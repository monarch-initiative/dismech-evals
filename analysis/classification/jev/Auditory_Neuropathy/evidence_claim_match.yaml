      assertion_type: DifferentialDiagnosis
      assertion:
        name: Syndromic peripheral neuropathies
        description: Charcot-Marie-Tooth disease, Friedreich ataxia, OPA1-related dominant optic atrophy
          plus, CAPOS syndrome, and riboflavin-transporter deficiency can include auditory neuropathy;
          neurologic, ophthalmologic, metabolic, and molecular findings distinguish the underlying syndrome.
        distinguishing_features:
        - Peripheral sensory findings, optic or vestibular abnormalities, motor features, and systemic
          findings favor a syndromic neuropathy.
        - Gene-directed testing distinguishes AIFM1, OPA1, ATP1A3, and other syndromic causes.
      selected_evidence:
        snippet: The phenotype associated with the AUNX1-causing AIFM1 p.R451Q mutation is characterised
          by childhood-onset ANSD and delayed peripheral sensory neuropathy presenting as extremity numbness,
          unsteadiness and areflexia.
        supports: SUPPORT
