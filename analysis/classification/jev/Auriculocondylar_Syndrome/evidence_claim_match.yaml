        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: GNAI3-variant signaling in HEK293T cells
        experimental_model_type: CELL_LINE
        description: Five ACS-associated GNAI3 variants were studied in transfected HEK293T cells using
          protease protection, receptor co-immunoprecipitation and BRET. ET-1-induced Gq activation was
          reduced at an 8:1 Gq-to-Gi3 expression ratio; the weak Gi3 response was not comparably inhibited.
        notes: Expression was adjusted between constructs. Co-immunoprecipitation supports increased association,
          while irreversible trapping, binding kinetics and human embryonic cell specificity remain inferred.
        publication: PMID:27072656
        cell_source: Transfected human embryonic kidney 293T cell line
        modeled_mechanisms:
        - target: Increased Mutant GNAI3 Receptor Association
          relationship: MEASURES
          limitations: Association abundance is not an equilibrium-affinity or residence-time measurement.
          description: Co-immunoprecipitation shows greater mutant association with EDNRA.
          model_scale: CELLULAR
        - target: Reduced EDNRA-Gq Signaling
          relationship: MEASURES
          limitations: Heterologous expression does not establish the exact signaling stoichiometry in
            human arch cells.
          readouts:
          - name: ET-1-induced Gq BRET response
            description: Mutants reduce the response by about 65–85% under the tested condition.
            target: Reduced EDNRA-Gq Signaling
          description: BRET measures reduced Gq activation after ET-1 stimulation.
          model_scale: CELLULAR
      selected_evidence:
        snippet: We found that all 5 ACS-associated Gαi3 mutants displayed increased binding (3- to 5-fold)
          to myc-tagged ETAR compared to Gαi3 WT (Fig. 5D).
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/1
      evidence_path: /experimental_models/1/evidence/0
      context_paths:
