  7d9323bcf2c81c7eaf20e283a87d92ff0aab3a12b44e8308a5b2a60ccbfe36eb:
    claim:
      about:
        disease:
          name: Auriculocondylar Syndrome
          disease_term:
            preferred_term: auriculocondylar syndrome
            term:
              id: MONDO:0000107
              label: auriculocondylar syndrome
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: ACS patient mandibular osteoblast cultures
        experimental_model_type: PRIMARY_CELL_CULTURE
        description: Mandibular osteoblasts from four ACS probands, including two GNAI3 Gly40Arg cases,
          one PLCB4 Tyr623Cys case and one unresolved case, were compared with 17 control calvarial osteoblast
          samples. DLX5 and DLX6 steady-state transcripts were lower.
        notes: The control and patient cells come from different cranial bones. Postnatal culture, small
          sample size and the unresolved genotype preclude treating the mean expression difference as
          a direct measurement of fetal neural-crest signaling. No correction or rescue was performed.
        publication: PMID:22560091
        cell_source: Patient mandibular and control calvarial osteoblasts
        modeled_mechanisms:
        - target: Reduced DLX5 and DLX6 Expression
          relationship: MEASURES
          limitations: Anatomical source and developmental-stage differences remain potential confounders.
          readouts:
          - name: DLX5 and DLX6 transcripts
            description: Mean DLX5 and DLX6 expression was sixfold and eightfold lower, respectively.
            target: Reduced DLX5 and DLX6 Expression
          description: RT-qPCR detects lower DLX transcript abundance in the patient cultures.
          model_scale: CELLULAR
      selected_evidence:
        snippet: Using quantitative, real-time RT-PCR of steady-state mRNA, we identified a 6-fold reduction
          of DLX5 (p < 0.005; probands versus controls) and an 8-fold reduction of DLX6 expression (p
          < 0.001) in mandibular osteoblasts from selective probands relative to 17 randomly selected
          calvarial osteoblasts from controls.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/3
      evidence_path: /experimental_models/3/evidence/0
      context_paths:
