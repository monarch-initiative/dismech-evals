      assertion_type: ExperimentalModel
      assertion:
        name: Regulatory-duplication neural-crest mesenchymal derivatives
        experimental_model_type: IPSC_DERIVED_MODEL
        description: Mesenchymal-like cells differentiated from the same iPSC neural-crest cultures show
          reduced day-9 ALP activity and a modest reduction in mineralization after osteogenic induction.
          TWIST1 and RUNX2 expression did not significantly differ during the tested osteogenic interval.
        notes: There is no isogenic rescue or demonstrated chain from TWIST1 upregulation to altered dimerization,
          RUNX2 inhibition or bone loss. Figure-caption timing of the representative mineralization micrograph
          is inconsistent; the quantitative mineralization caption specifies 21 days.
        publication: PMID:34750192
        cell_source: Patient and control iPSC-derived neural-crest mesenchymal-like cells
        modeled_mechanisms:
        - target: Impaired Osteogenic Differentiation in Patient-Derived Cells
          relationship: MEASURES
          limitations: These cellular outcomes do not prove mediation of patient mandibular hypoplasia.
          readouts:
          - name: Alkaline-phosphatase activity
            description: ALP activity is lower after nine days of osteoinduction.
            target: Impaired Osteogenic Differentiation in Patient-Derived Cells
          description: ALP and mineralization provide osteogenic differentiation readouts.
          model_scale: CELLULAR
      selected_evidence:
        snippet: Our data showed that during osteogenic differentiation, ALP enzymatic activity was significantly
          diminished in ARCND-nMSCs after 9 days of osteoinduction (decrease of 20.3-fold, paired t-test
          p=0.029; figure 3A, B).
        supports: SUPPORT
        directness: INDIRECT
