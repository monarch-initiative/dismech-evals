        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#HDAC9-TWIST1 Regulatory Duplication
        - pathophysiology#Increased Neural Crest TWIST1 Expression
        prompt: Which regulatory and cellular changes mediate the HDAC9-region duplication phenotype?
        rationale: Segregation, nonpatient Capture-C and patient-cell expression findings support a regulatory
          locus. They do not isolate TWIST1 from HDAC9 or establish that the scratch and osteogenic readouts
          cause the human jaw phenotype. No serial TWIST1-to-migration-to-osteogenesis causal chain is
