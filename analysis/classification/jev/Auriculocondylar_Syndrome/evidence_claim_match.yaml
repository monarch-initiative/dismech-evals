      assertion_type: ExperimentalModel
      assertion:
        name: Purified GNAI3 S47R nucleotide-binding assays
        experimental_model_type: OTHER
        description: Recombinant wild-type and S47R GNAI3 were compared by nucleotide-binding, GTPase,
          HPLC and limited-proteolysis assays. S47R retains GDP but has profoundly impaired GTP binding
          and activation.
        notes: The other four variants could not be purified in sufficient soluble quantity; their activation
          defects were tested after mammalian expression. Poor recovery is not a direct protein half-life
          measurement.
        publication: PMID:27072656
        cell_source: Recombinant proteins expressed in Escherichia coli
        modeled_mechanisms:
        - target: Impaired GNAI3 GTP Binding
          relationship: MEASURES
          limitations: Direct purified-protein evidence is limited to S47R.
          readouts:
          - name: GDP and GTP binding
            description: GDP is retained while GTP binding is impaired.
            target: Impaired GNAI3 GTP Binding
          description: Biochemical assays distinguish GDP retention from defective GTP binding.
          model_scale: MOLECULAR
      selected_evidence:
        snippet: Together, these results demonstrate that Gαi3 S47R retains the capability to bind GDP
          but fails to bind GTP, rendering the G protein unable to switch into an active conformation.
        supports: SUPPORT
