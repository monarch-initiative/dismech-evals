              id: MONDO:0000107
              label: auriculocondylar syndrome
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Regulatory-duplication patient iPSC neural-crest cultures
        experimental_model_type: IPSC_DERIVED_MODEL
        description: iPSCs from three affected members of one family and three controls were differentiated
          toward neural crest. Patient cultures showed increased TWIST1 and HDAC9 mRNA and reduced 24-hour
          scratch closure without a detected cell-cycle distribution difference.
        notes: Controls were not isogenic; one control was reprogrammed by a different method. Capture-C
          was performed in separate nonpatient embryonic calvarial mesenchyme and does not demonstrate
          altered contacts in these patient cells. No TWIST1-specific correction, rescue or necessity
          experiment was performed. EDN-pathway transcripts were unchanged or too low to assess, not proof
          of normal signaling.
        publication: PMID:34750192
        cell_source: Three patient-derived and three unrelated control iPSC lines
        modeled_mechanisms:
        - target: Increased Neural Crest TWIST1 Expression
          relationship: MEASURES
          limitations: The causal contribution of this expression difference is unisolated.
          description: Patient-derived iNCCs show increased TWIST1 mRNA.
          model_scale: CELLULAR
        - target: Increased Neural Crest HDAC9 Expression
          relationship: MEASURES
          limitations: Transcript abundance does not establish catalytic isoform activity.
          description: Patient-derived iNCCs also show increased HDAC9 mRNA.
          model_scale: CELLULAR
        - target: Reduced Migration of Patient-Derived Neural Crest Cells
          relationship: MEASURES
          limitations: This does not demonstrate migration into human pharyngeal arches.
          readouts:
          - name: Scratch wound closure
            description: Patient cultures close less of the scratch area after 24 hours.
            target: Reduced Migration of Patient-Derived Neural Crest Cells
          description: Scratch closure is reduced over 24 hours.
          model_scale: CELLULAR
      selected_evidence:
        snippet: However, an increase in HDAC9 (3.15-fold, unpaired t-test p=0.009) and TWIST1 (2.03-fold,
          unpaired t-test p=0.03) mRNA was observed in the ARCND-iNCC (figure 2A, B) compared with controls
          (unpaired t-test).
        supports: SUPPORT
        directness: INDIRECT
    origin:
