      assertion_type: DifferentialDiagnosis
      assertion:
        name: Pierre Robin sequence-plus
        description: Pierre Robin sequence and related craniofacial disorders overlap through micrognathia,
          glossoptosis and palatal abnormalities. The ear pattern, condylar anatomy, other findings and
          molecular testing distinguish the spectrum; absence of question-mark ears alone does not exclude
          ACS.
        distinguishing_features:
        - Question mark ears
        - Mandibular condyle hypoplasia
      selected_evidence:
        snippet: In order to address these questions, we searched for alterations in PLCB4, GNAI3, and
          EDN1 in patients with typical Auriculocondylar syndrome (n = 3), Pierre Robin sequence-plus
          (n = 3), micrognathia with additional craniofacial malformations (n = 4), or non-specific auricular
          dysplasia (n = 1), which could represent subtypes of Auriculocondylar syndrome.
        supports: SUPPORT
