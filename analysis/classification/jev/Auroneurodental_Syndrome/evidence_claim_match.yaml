          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: The reported p.Leu130Pro allele retains acetylation activity when expressed strongly
            in knockout HAP1 cells. This is functional evidence for a partial loss of function, without
            a validated human residual-activity or viability threshold.
