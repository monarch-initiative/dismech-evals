            name: Purified acetylated and nonacetylated beta/gamma-actin
            experimental_model_type: OTHER
            publication: PMID:29581253
            description: Actin purified from control and NAA80-knockout HAP1 cells was tested in bulk
              pyrene assays, seeded elongation/depolymerization and assays with Arp2/3, mDia1/mDia2 and
              profilins. The effect depends on the reaction and actin-binding proteins.
          role: ancestor
        - path: /experimental_models/3/modeled_mechanisms/0
          value:
            target: Slower Actin Filament Elongation
            relationship: MEASURES
            fidelity: MODERATE
            description: Nonacetylated beta/gamma-actin purified from HAP1 knockout cells elongates more
              slowly in seeded barbed-end assays. Total unseeded polymerization, Arp2/3-driven assembly
              and mDia2-mediated assembly did not show the same difference; mDia1 and PFN1/PFN2 context
              matter. This is an in-vitro biochemical result, not a measured patient-tissue growth rate.
            limitations: Cell-free preparations; unseeded polymerization and several nucleation conditions
              were unchanged.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Seeded barbed-end elongation rate
        target: Slower Actin Filament Elongation
        direction: DECREASED
        interpretation: Nonacetylated beta/gamma-actin purified from HAP1 knockout cells elongates more
          slowly in seeded barbed-end assays. Total unseeded polymerization, Arp2/3-driven assembly and
          mDia2-mediated assembly did not show the same difference; mDia1 and PFN1/PFN2 context matter.
          This is an in-vitro biochemical result, not a measured patient-tissue growth rate.
      selected_evidence:
        snippet: The barbed-end elongation rate of β/γ-actin filament seeds is ∼2.2-fold faster for Ac-actin
