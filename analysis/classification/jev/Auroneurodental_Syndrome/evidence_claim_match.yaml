        description: Muscle and heart samples show little to no detectable N-terminally acetylated actin
          in homozygotes.
        limitations: Different tissues and species from patient fibroblasts; the method cannot estimate
          site occupancy. Gross behavior does not exclude stress-dependent or human muscle dysfunction.
        readouts:
        - name: Acetylated actin peptide signal
          target: Reduced Actin N-Terminal Acetylation
          direction: DECREASED
          interpretation: Muscle and heart samples show little to no detectable N-terminally acetylated
            actin in homozygotes.
      selected_evidence:
        snippet: In contrast, in the naa80 −/− samples from both knockout lines, we found little to no
          detectable Nt-acetylated actin
        supports: SUPPORT
        directness: DIRECT
