        - path: /animal_models/1
          value:
            species: Zebrafish
            genotype: Transient F0 naa80 CRISPR targeting with two sgRNAs
            category: Genetic
            publication: PMID:39384430
            description: Five-day larvae generated by injection of Cas9 protein and two sgRNAs were compared
              with Cas9-injected controls. Reduced naa80 transcript, ear structural abnormalities and
              reduced acoustic startle were observed. These experiments do not directly quantify acetylation
              in F0 hair cells or provide Naa80 rescue.
            notes: The acoustic endpoint used 48 larvae per group and is a sensory-motor response, not
              a frequency-specific audiogram. Yo-Pro-1-positive cells were counted in lateral-line neuromasts
              (12 control/13 targeted larvae), not used as an inner-ear apoptosis assay. Stereocilia measurements
              are nested within three larvae per group.
          role: ancestor
        - path: /animal_models/1/modeled_mechanisms/0
          value:
            target: Reduced Inner-Ear Hair-Cell Bundles
            relationship: MEASURES
            fidelity: MODERATE
            description: Transient naa80-targeted F0 zebrafish larvae have fewer lateral-crista hair-cell
              bundles. This model-derived lesion is distinct from the lateral-line Yo-Pro-1 uptake readout
              and is not a demonstrated human cochlear cell-loss mechanism.
            limitations: F0 perturbation with no rescue or direct hair-cell acetylation/dynamics assay;
              relevance to human cochlear pathology is inferred.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Lateral-crista hair-cell bundle count
        target: Reduced Inner-Ear Hair-Cell Bundles
        direction: DECREASED
        interpretation: Transient naa80-targeted F0 zebrafish larvae have fewer lateral-crista hair-cell
          bundles. This model-derived lesion is distinct from the lateral-line Yo-Pro-1 uptake readout
