      assertion_type: Discussion
      assertion:
        discussion_id: slc35a3_neuronal_glycoprotein_targets_unknown
        prompt: Which specific neuronal glycoproteins, hypoglycosylated as a consequence of SLC35A3 deficiency,
          drive the autism / epilepsy / intellectual-disability phenotype?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Neurodevelopmental Dysfunction
        rationale: The neurodevelopmental phenotype is attributed to impaired glycosylation of central-nervous-system
          proteins, but the specific responsible glycoproteins remain unidentified and the causal link
          is stated only as a possibility. This is why Neurodevelopmental Dysfunction is deliberately
          modeled as a single coarse node rather than a resolved molecular cascade.
        proposed_experiments:
        - experiment_id: exp_slc35a3_neural_glycoproteomics
          name: Glycoproteomics of SLC35A3-deficient patient-derived neural cells
          description: Perform site-specific N-glycoproteomics (lectin/HILIC enrichment with mass spectrometry)
            on SLC35A3-patient-derived or iPSC-derived neurons versus isogenic controls to identify the
            neuronal glycoproteins whose branched N-glycans are selectively lost, prioritizing candidates
            in neurodevelopmental and synaptic pathways.
          decision_criterion: Reproducible loss of highly branched N-glycans on a defined set of CNS-expressed
            glycoproteins, enriched for neurodevelopmental function, would nominate specific molecular
            effectors of the phenotype; a diffuse, non-selective glycosylation shift would instead support
            a global, non-target-specific mechanism.
      selected_evidence:
        snippet: "Neurological symptoms and skeletal abnormalities might result from impaired \nglycosylation\
          \ of proteins involved in normal development and function of the \ncentral nervous system"
        supports: SUPPORT
