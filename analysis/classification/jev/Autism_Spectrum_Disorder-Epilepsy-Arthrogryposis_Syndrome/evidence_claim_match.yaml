              label: autism spectrum disorder - epilepsy - arthrogryposis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Golgi UDP-GlcNAc Transport
        biological_scale: MOLECULAR
        description: 'Biallelic pathogenic variants in SLC35A3 reduce transport of UDP-N-acetylglucosamine
          (UDP-GlcNAc), the nucleotide-sugar donor for N-acetylglucosaminylation, from the cytosol into
          the lumen of the Golgi apparatus. SLC35A3 is regarded as the major Golgi UDP-GlcNAc transporter
          in mammals, so loss of its activity is the primary biochemical lesion; in Golgi vesicles from
          patient fibroblasts, transport of the nucleotide sugar is significantly reduced. Depletion of
          the lumenal UDP-GlcNAc pool is the shared upstream defect that feeds three parallel GlcNAc-dependent
          pathways: complex N-glycan antenna branching (via the MGAT GnTs), LFNG-mediated O-fucose elongation
          on Notch EGF repeats (segmentation clock), and glycosaminoglycan chain synthesis — so those
          three consequences are siblings of one another, not sequential.

          '
        genes:
        - preferred_term: SLC35A3
          term:
            id: hgnc:11023
            label: SLC35A3
        biological_processes:
        - preferred_term: UDP-N-acetylglucosamine transmembrane transport
          term:
            id: GO:1990569
            label: UDP-N-acetylglucosamine transmembrane transport
          modifier: DECREASED
        molecular_functions:
        - preferred_term: UDP-N-acetylglucosamine transmembrane transporter activity
          term:
            id: GO:0005462
            label: UDP-N-acetylglucosamine transmembrane transporter activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: Golgi membrane
          term:
            id: GO:0000139
            label: Golgi membrane
        chemical_entities:
        - preferred_term: UDP-N-acetylglucosamine
          term:
            id: CHEBI:16264
            label: UDP-N-acetyl-alpha-D-glucosamine
      selected_evidence:
        snippet: "SLC35A3 encodes the major \nGolgi uridine diphosphate N-acetylglucosamine (UDP-GlcNAc)\
          \ transporter. In Golgi \nvesicles isolated from patient fibroblasts the transport of the respective\
          \ \nnucleotide sugar was significantly reduced"
        supports: SUPPORT
