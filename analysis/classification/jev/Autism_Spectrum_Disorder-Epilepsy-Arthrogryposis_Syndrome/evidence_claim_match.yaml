              label: autism spectrum disorder - epilepsy - arthrogryposis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced N-Glycan Branching
        biological_scale: MOLECULAR
        description: 'Reduced lumenal UDP-GlcNAc limits the N-acetylglucosaminyltransferases (e.g., MGAT4/MGAT5)
          that add the GlcNAc branch points of complex N-glycans, causing a massive decrease in highly
          branched tri- and tetraantennary N-glycans at the cell surface and a reciprocal accumulation
          of lower-branched (mono- and diantennary) glycoforms. Follow-up biochemical testing in patients
          confirms abnormal protein glycosylation consistent with a defective Golgi UDP-GlcNAc transporter.
          This altered branching signature has been associated with growth arrest and induction of differentiation.
          As a Golgi N-glycan maturation defect producing a type II CDG transferrin/glycoform signature,
          this node conforms to the conserved congenital-disorder-of-glycosylation module.

          '
        conforms_to: congenital_disorder_of_glycosylation#Golgi N-Glycan Processing and Trafficking Defect
        biological_processes:
        - preferred_term: N-glycan processing
          term:
            id: GO:0006491
            label: N-glycan processing
          modifier: DECREASED
        chemical_entities:
        - preferred_term: UDP-N-acetylglucosamine
          term:
            id: CHEBI:16264
            label: UDP-N-acetyl-alpha-D-glucosamine
          modifier: DECREASED
      selected_evidence:
        snippet: "a massive decrease in the \ncontent of cell surface expressed highly branched N-glycans\
          \ and a concomitant \nsharp increase of lower branched glycoforms."
        supports: SUPPORT
