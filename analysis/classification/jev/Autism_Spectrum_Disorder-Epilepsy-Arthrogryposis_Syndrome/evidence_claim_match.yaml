              label: autism spectrum disorder - epilepsy - arthrogryposis syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: slc35a3_sole_transporter_model_mismatch
        prompt: Is SLC35A3 truly the sole/primary Golgi UDP-GlcNAc transporter in humans, or do redundant
          transport routes compensate in a cell-type-dependent manner?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Golgi UDP-GlcNAc Transport
        rationale: 'Patient fibroblasts show reduced Golgi UDP-GlcNAc transport and loss of highly branched
          N-glycans, supporting SLC35A3 as the major transporter. However, CRISPR knockout of SLC35A3
          in CHO, HEK293T, and HepG2 cell lines gives cell-context-dependent results: in CHO cells N-glycan
          branching was impaired even though vesicular UDP-GlcNAc transport was not decreased, and in
          HepG2 cells no qualitative N-glycan change was seen — implying redundant or alternative UDP-GlcNAc
          transport routes. Whether this redundancy operates in the human neural and skeletal tissues
          that drive the disease phenotype is unresolved, so a negative cell-line transport result should
          not be treated as disproof of the human patient-fibroblast lesion.'
      selected_evidence:
        snippet: "in SLC35A3-knockout CHO cells, only limited \nchanges were observed; GlcNAc was still\
          \ incorporated into N-glycans, but complex \ntype N-glycan branching was impaired, although\
          \ UDP-GlcNAc transport into Golgi \nvesicles was not decreased."
        supports: SUPPORT
    origin:
