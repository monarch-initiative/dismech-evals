        attaches_to:
        - phenotypes#Micrognathia
        - phenotypes#Cleft palate
        - phenotypes#Facial dysmorphism
        - phenotypes#Patent ductus arteriosus
        - phenotypes#Patent foramen ovale
        - phenotypes#Posterior embryotoxon
        rationale: These anomalies are documented in a single patient (the SLC35A3-related skeletal-dysplasia
          case) and no study has traced them to a specific glycosylation-dependent developmental pathway.
          Craniofacial anomalies could plausibly share the cartilage/skeletal glycosylation mechanism,
          and cardiac anomalies also occur in the bovine Complex Vertebral Malformation phenotype, but
          neither link has been demonstrated for the human disease, so these phenotypes are deliberately
          left without causal edges rather than wired to the skeletal or neurodevelopmental nodes on conjecture.
      selected_evidence:
        snippet: "Congenital \ndisorders of glycosylation, including SLC35A3-CDG, can present as a wide\
          \ \nphenotypic spectrum, including skeletal dysplasia."
        supports: SUPPORT
