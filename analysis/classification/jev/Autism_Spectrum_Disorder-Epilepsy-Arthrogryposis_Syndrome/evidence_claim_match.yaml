            term:
              id: MONDO:0014248
              label: autism spectrum disorder - epilepsy - arthrogryposis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Somite Segmentation
        biological_scale: CELLULAR
        description: 'SLC35A3 supplies UDP-GlcNAc to the Golgi GlcNAc-transferases — notably LFNG (Lunatic
          fringe), a beta-1,3-N-acetylglucosaminyltransferase that elongates O-fucose glycans on the Notch
          receptor EGF repeats with GlcNAc (the O-fucose itself is added by POFUT1). Fringe-mediated GlcNAc
          elongation tunes Notch activity in the segmentation clock of the presomitic mesoderm, so a UDP-GlcNAc
          supply defect is proposed to impair this GlcNAc-transferring step and the sugar modification
          essential for somite formation. Slc35a3 mRNA is expressed in the presomitic mesoderm of wild-type
          mice, and Slc35a3-null mice develop CVM-like vertebral malsegmentation, which supports — but
          does not yet directly prove — the SLC35A3→LFNG substrate-supply model: the originating study
          frames it as a hypothesis still requiring test (see knowledge gap). This node conforms to the
          conserved axial-segmentation serial-homology module.

          '
        conforms_to: axial_segmentation_serial_homology#Disrupted Somite Boundary Formation
        biological_processes:
        - preferred_term: Segmentation
          term:
            id: GO:0035282
            label: segmentation
          modifier: ABNORMAL
        - preferred_term: somitogenesis
          term:
            id: GO:0001756
            label: somitogenesis
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Presomitic (Paraxial) Mesoderm Cell
          term:
            id: CL:0011007
            label: paraxial cell
      selected_evidence:
        snippet: SLC35A3 transports UDP-GlcNAc used for the sugar modification that is essential for somite
          formation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
