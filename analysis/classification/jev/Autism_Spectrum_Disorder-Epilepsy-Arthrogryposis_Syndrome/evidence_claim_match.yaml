        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: slc35a3_lfng_notch_segmentation_untested
        prompt: Does SLC35A3 loss disrupt somite formation specifically by starving LFNG of UDP-GlcNAc
          and thereby dysregulating Notch segmentation-clock signaling in the presomitic mesoderm, or
          through another route?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Somite Segmentation
        rationale: 'The SLC35A3→LFNG→Notch segmentation-clock mechanism is currently inferred from Slc35a3
          presomitic-mesoderm expression and the CVM-like vertebral phenotype of Slc35a3-null mice, not
          from direct measurement of Notch signaling. The originating study explicitly frames it as a
          hypothesis still requiring test: the expression of segmentation-clock Notch molecules in Slc35a3-null
          embryos has not yet been examined.'
        proposed_experiments:
        - experiment_id: exp_slc35a3_notch_clock_psm
          name: Segmentation-clock Notch profiling in Slc35a3-null presomitic mesoderm
          description: Examine the expression and cyclic oscillation of Notch segmentation-clock molecules
            (e.g., Lfng, Hes7, and cyclic Notch target genes) in the presomitic mesoderm of Slc35a3-null
            embryos during somite formation, compared with wild-type littermates.
          decision_criterion: Disrupted or dampened cyclic Notch/Lfng expression in the Slc35a3-null PSM
            would support the LFNG-substrate-supply model; preserved oscillation would point to a Notch-independent
            route to malsegmentation.
      selected_evidence:
        snippet: To investigate this hypothesis, the expression of Notch signaling molecules involved
          in the segmentation clock should be examined in detail during somite formation
        supports: SUPPORT
