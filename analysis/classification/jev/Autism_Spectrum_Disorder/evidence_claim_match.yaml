      assertion_type: ProgressionInfo
      assertion:
        phase: Childhood and adolescence
        age_range: Childhood through adolescence
        notes: Preschool diagnoses are often stable, but symptom severity, adaptive function, language,
          learning, and co-occurring sleep, attention, anxiety, gastrointestinal, or seizure problems
          can change. Diagnosis may occur only in later childhood or adolescence when social demands exceed
          capacity; late recognition does not imply late biological onset.
      selected_evidence:
        snippet: Primary care providers should be familiar with the diagnostic criteria for ASD, appropriate
          etiologic evaluation, and co-occurring medical and behavioral conditions (such as disorders
          of sleep and feeding, gastrointestinal tract symptoms, obesity, seizures, attention-deficit/hyperactivity
          disorder, anxiety, and wandering) that affect the child's function and quality of life.
        supports: SUPPORT
