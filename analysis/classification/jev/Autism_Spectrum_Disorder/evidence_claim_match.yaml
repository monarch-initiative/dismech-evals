        context: []
      assertion_type: Definition
      assertion:
        name: Contemporary clinical ASD case definition
        definition_type: CASE_DEFINITION
        derivation_basis: ESTABLISHED_CRITERIA
        description: A clinical diagnosis requires persistent social-communication and social-interaction
          differences or impairments plus restricted or repetitive behavior, interests, or activities.
          Features begin in the early developmental period, may become fully apparent only when demands
          exceed capacities, cause clinically meaningful functional impact, and are not better explained
          by intellectual disability or global developmental delay alone. Sensory hyperreactivity, hyporeactivity,
          or unusual sensory interests are included within the restricted/repetitive domain. Support needs
          and language and intellectual-function specifiers do not define etiologic subtypes.
      selected_evidence:
        snippet: Autism spectrum disorder is a construct used to describe individuals with a specific
          combination of impairments in social communication and repetitive behaviours, highly restricted
          interests and/or sensory behaviours beginning early in life.
        supports: SUPPORT
