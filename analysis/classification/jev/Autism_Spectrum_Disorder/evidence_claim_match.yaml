  ac8b2ebe40de550859420138ee81d09e78633776099cb2452ce229fd2db2610c:
    claim:
      about:
        disease:
          name: Autism Spectrum Disorder
          disease_term:
            preferred_term: autism spectrum disorder
            term:
              id: MONDO:0005258
              label: autism spectrum disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_asd_ibs_hpa_gri_brain_gut_coupling
        prompt: Does hypothalamic-pituitary-adrenal (HPA) axis dysregulation with impaired glucocorticoid-responsive
          immune (GRI) signaling in peripheral immune cells (monocytes, natural killer cells, B cells;
          reported core genes LRFN1, NUAK2, TMEM154, GAPT) causally couple the immune and microbiome associations
          reported in autism spectrum disorder to those reported in the frequently co-occurring irritable
          bowel syndrome, or is the shared GRI signature a common downstream stress response in both conditions?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Immune and neuroinflammatory associations in studied groups
        - pathophysiology#Gut microbiome associations in studied groups
        - Irritable_Bowel_Syndrome:pathophysiology#Gut-Brain Axis Dysfunction
        - Irritable_Bowel_Syndrome:pathophysiology#Immune Activation and Mast Cell Degranulation
        rationale: 'Functional gastrointestinal symptoms co-occur with ASD, and a shared glucocorticoid-responsive
          immune transcriptional signature in peripheral blood mononuclear cells has been proposed as
          a molecular link between ASD and IBS. The available evidence, however, is an integrative computational
          reanalysis of existing transcriptomes (ssGSEA, WGCNA, machine-learning feature selection, deconvolution,
          Connectivity Map inference). It identifies candidate regulators and a correlated signature but
          establishes neither causal ordering nor a mechanism coupling peripheral GRI dysregulation to
          the group-level immune and microbiome associations recorded in this entry. This gap is narrower
          than gap_asd_causal_status_of_immune_and_microbiome_associations, which asks whether those associations
          are causal at all: it asks specifically whether HPA/GRI signaling is the substrate of the ASD-IBS
          co-occurrence rather than a bystander stress response shared by both. It deliberately makes
          no claim about an enteric-nervous-system causal chain, which the 2026-08-05 publication-readiness
          review removed from this entry as unsupported.'
        proposed_experiments:
        - experiment_id: exp_asd_ibs_gri_stress_challenge_multiomics
          name: Stress-challenge PBMC GRI multi-omics cohort in ASD with and without IBS
          description: Enroll ASD participants stratified by presence or absence of IBS-type gastrointestinal
            symptoms plus matched non-autistic and IBS-only controls; apply a standardized HPA-axis challenge
            (for example dexamethasone suppression or an acute psychosocial stressor with serial cortisol);
            and measure, before and after challenge, single-cell PBMC transcriptomes (monocytes, NK cells,
            B cells) for the reported GRI core genes LRFN1, NUAK2, TMEM154, and GAPT, circulating cytokines,
            intestinal-permeability biomarkers, and stool microbiome composition, relating each to prespecified
            social-communication and gastrointestinal symptom measures.
          experiment_type:
            preferred_term: longitudinal stress-challenge multi-omics cohort
          model_systems:
          - name: Human ASD/IBS stress-challenge cohort
            description: Patient cohort designed to temporally order HPA activation, peripheral GRI gene
              dysregulation, systemic immune signaling, gut-barrier and microbiome change, and behavioral
              readouts across the ASD-IBS co-occurrence.
            experimental_model_type: OTHER
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
          decision_criterion: HPA/GRI signaling is supported as an upstream driver of the ASD-IBS co-occurrence
            if post-challenge GRI dysregulation in monocytes, NK cells, and B cells precedes and quantitatively
            mediates gut-barrier, microbiome, and immune change and tracks with gastrointestinal symptom
            severity; a shared-bystander interpretation is favored if GRI changes neither precede nor
            mediate those organ-level readouts.
          would_support:
          - pathophysiology#Immune and neuroinflammatory associations in studied groups
          - pathophysiology#Gut microbiome associations in studied groups
      selected_evidence:
        snippet: While dysregulation of the hypothalamic-pituitary-adrenal (HPA) axis and impaired glucocorticoid-responsive
          immune (GRI) signaling are proposed links between these disorders, the precise molecular mechanisms
          remain poorly understood.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42424309
      reference_title: Dysregulated glucocorticoid-responsive immune genes in peripheral blood mononuclear
        cells as a shared molecular signature of autism spectrum disorder and irritable bowel syndrome.
      evidence_source: COMPUTATIONAL
      explanation: The source study explicitly frames the HPA/GRI brain-gut link between ASD and IBS as
        proposed but mechanistically unresolved, defining the gap.
