  aec167f3f70b9b8cd1e4c015a6de580afb5f440637c079ac5225a43b9120a075:
    claim:
      about:
        disease:
          name: Autism Spectrum Disorder
          disease_term:
            preferred_term: autism spectrum disorder
            term:
              id: MONDO:0005258
              label: autism spectrum disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_asd_heavy_metal_exposure_causal_status
        prompt: Are the reported associations between prenatal or early-childhood lead and mercury exposure
          and ASD causal, or do they reflect residual confounding, reverse causation, and heterogeneous
          exposure-assessment methods that also explain why arsenic and cadmium findings are inconsistent?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - environmental#Prenatal and early-childhood heavy metal exposure
        rationale: Existing studies differ in biomarker matrix (blood, hair, urine), exposure window,
          timing relative to diagnosis, ascertainment, and confounder adjustment, and most measure a single
          metal rather than the correlated mixtures children are actually exposed to. Lead and mercury
          show the most consistent signal and arsenic and cadmium the least, but the source review declines
          to conclude that heavy metals cause ASD and calls for large prospective cohorts. This item concerns
          whether the human association is real and causal at all; the separate question of whether animal-model
          mechanisms apply to human neurodevelopment is recorded in mismatch_asd_heavy_metal_model_mechanism.
        proposed_experiments:
        - experiment_id: exp_asd_prospective_metal_mixture_birth_cohort
          name: Prospective mother-child cohort with repeated metal biomarkers and mediation analysis
          description: Follow a large, diverse pregnancy cohort with repeated maternal and child metal
            biomarkers across defined prenatal and early postnatal windows, prespecified mixture models
            that separate correlated metals from each other and from co-exposures, blinded standardized
            ASD ascertainment, and genetic and socioeconomic confounder control. Sibling or negative-control-exposure
            comparisons and biomarker path analysis through oxidative-stress and inflammatory intermediates
            test whether any exposure-to-outcome association survives and is mediated.
          experiment_type:
            preferred_term: prospective pregnancy and birth cohort with mixture and mediation analysis
          model_systems:
          - name: Diverse prospective pregnancy and birth cohort
            description: Human mother-child cohort with repeated exposure biomarkers, blinded diagnostic
              ascertainment, and sibling comparisons for unmeasured familial confounding.
            experimental_model_type: OTHER
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
          perturbations:
          - name: Measured prenatal and early-childhood metal exposure
            target: environmental#Prenatal and early-childhood heavy metal exposure
            exposure_term:
              preferred_term: exposure to heavy metal
              term:
                id: ECTO:9002163
                label: exposure to heavy metal
            effect: Observed rather than assigned exposure, measured repeatedly by window and modeled
              as a correlated mixture rather than one metal at a time.
          readouts:
          - name: Blinded ASD ascertainment and exposure-response gradient
            target: environmental#Prenatal and early-childhood heavy metal exposure
            interpretation: A window-specific exposure-response gradient that survives mixture, sibling,
              and negative-control analyses is the minimum needed to move this exposure beyond an observational
              association.
          decision_criterion: A causal contribution is supported if window-specific lead or mercury biomarkers
            predict ASD outcomes with exposure-response gradients that persist in mixture models, sibling
            comparisons, and negative-control analyses; a confounding interpretation is favored if associations
            attenuate to the null once familial and socioeconomic factors and correlated co-exposures
            are accounted for.
          would_support:
          - environmental#Prenatal and early-childhood heavy metal exposure
      selected_evidence:
        snippet: The findings are inconsistent across metals and studies, and should be interpreted with
          caution due to potential residual confounding and heterogeneity in exposure assessment methods.
          Large prospective cohort studies are needed to clarify causal relationships.
        supports: SUPPORT
