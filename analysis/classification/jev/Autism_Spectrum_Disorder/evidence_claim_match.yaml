        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Adulthood and later life
        age_range: Adulthood
        notes: Autism is generally lifelong, but adult independence, health, employment, relationships,
          and quality of life are highly heterogeneous and depend on communication, intellectual and adaptive
          function, co-occurring conditions, opportunity, accommodations, and support. Adult intervention
          evidence is much thinner than pediatric evidence. Population studies show excess mortality,
          but risks are not uniform and should not be interpreted as an individual prognosis.
      selected_evidence:
        snippet: 'The results showed that all-cause mortality was higher for the autistic patients (RR=2.32,
          95%CI: 1.98-2.72, I2=87.1%, P < 0.001).'
        supports: SUPPORT
    origin:
