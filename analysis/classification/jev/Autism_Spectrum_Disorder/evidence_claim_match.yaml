      assertion:
        phase: Early developmental emergence
        age_range: Infancy through early childhood
        notes: Features begin in early development, commonly become apparent during the second or third
          year, and may accumulate gradually. Some children show frank loss of previously acquired skills,
          whereas others plateau or show gradually widening social-communication and language differences.
          Neither a neonatal movement pattern nor an imaging, gaze, EEG, molecular, or blood measure is
          a validated presymptomatic diagnostic biomarker.
      selected_evidence:
        snippet: Autism spectrum disorder is a construct used to describe individuals with a specific
          combination of impairments in social communication and repetitive behaviours, highly restricted
          interests and/or sensory behaviours beginning early in life.
        supports: SUPPORT
