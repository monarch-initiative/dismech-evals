  7cd7f658774757b53337796d4be57a208d9384e79a7a47564c52643dc4cc387f:
    claim:
      about:
        disease:
          name: Autism Spectrum Disorder
          disease_term:
            preferred_term: autism spectrum disorder
            term:
              id: MONDO:0005258
              label: autism spectrum disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_asd_heavy_metal_model_mechanism
        prompt: Do the oxidative-stress, synaptic, and glial-activation mechanisms characterized for lead
          and mercury in rodent, zebrafish, and cell models operate at human-relevant developmental exposure
          levels, and do they mediate autistic traits in people, or are they model-system toxicology that
          does not transfer to human ASD?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - environmental#Prenatal and early-childhood heavy metal exposure
        - pathophysiology#Immune and neuroinflammatory associations in studied groups
        rationale: 'Metal neurotoxicity mechanisms are described in detail in experimental animals, including
          reactive oxygen species generation, impaired synaptic plasticity, microglial and astrocytic
          activation, and lipid and steroid metabolic disruption, and a zebrafish arm of one birth-cohort
          study nominates a PPAR-linked pathway. None of this has been demonstrated in human neurodevelopment,
          at the cord-blood concentrations measured in cohorts, or as a mediator of autistic traits, and
          reviews of developmental mercury toxicity state that no single process explains the observed
          effects. That is why this entry records the exposure as an environmental association and adds
          no heavy-metal pathophysiology node: promoting these model findings to a human ASD mechanism
          node would repeat the animal-only maternal-immune-activation claim that the 2026-08-05 publication-readiness
          review removed. The prior question of whether the human epidemiological association is causal
          at all is recorded in gap_asd_heavy_metal_exposure_causal_status.'
        proposed_experiments:
        - experiment_id: exp_asd_human_cortical_organoid_metal_exposure
          name: Human cortical organoid and microglia-containing assembloid exposure at cohort-relevant
            metal concentrations
          description: Expose human iPSC-derived cortical organoids and microglia-containing assembloids,
            including lines carrying defined ASD-associated variants and isogenic controls, to lead and
            methylmercury across a dose range anchored to measured human cord-blood concentrations. Read
            out oxidative stress, microglial activation state, synaptic density and network activity,
            and transcriptomic and lipidomic changes including the PPAR pathway nominated by the zebrafish
            work, and test whether effects appear at human-relevant rather than only supraphysiological
            doses.
          experiment_type:
            preferred_term: dose-anchored human organoid exposure experiment
          model_systems:
          - name: Human iPSC-derived cortical organoid and microglia-containing assembloid panel
            description: Human cortical organoids with and without integrated microglia, spanning ASD-associated
              genotypes and isogenic controls, used to test whether animal-model metal neurotoxicity mechanisms
              are reproduced in human neural tissue at cohort-relevant exposure levels.
            experimental_model_type: ORGANOID
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_types:
            - preferred_term: neural progenitor cell
              term:
                id: CL:0011020
                label: neural progenitor cell
            - preferred_term: microglial cell
              term:
                id: CL:0000129
                label: microglial cell
          perturbations:
          - name: Cohort-anchored lead exposure
            target: environmental#Prenatal and early-childhood heavy metal exposure
            exposure_term:
              preferred_term: exposure to lead
              term:
