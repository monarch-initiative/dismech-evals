      assertion_type: ExperimentalModel
      assertion:
        name: Genotype-defined patient iPSC-derived neuronal networks
        experimental_model_type: IPSC_DERIVED_MODEL
        cell_source: Patient-derived induced pluripotent stem cells
        description: Neuronal networks derived from autistic participants with defined variants can test
          cellular excitability, synchrony, connectivity, and rescue. They retain donor/genotype relevance
          but lack whole-brain development, behavior, immune and environmental context, and population
          representativeness. The TSC2 result is a genotype-specific mechanistic model, not a model of
          all ASD.
      selected_evidence:
        snippet: We find that ASD patient-derived neurons with a functional loss of TSC2, in addition
          to possessing neuronal hyperactivity, develop a dysfunctional neuronal network with reduced
          synchronisation of neuronal bursting and lower spatial connectivity.
        supports: SUPPORT
