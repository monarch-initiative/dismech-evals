  76ab973b054c3804958945791e2eb60d036618459e4aafc87550d19e231a3a1c:
    claim:
      about:
        disease:
          name: Autism Spectrum Disorder
          disease_term:
            preferred_term: autism spectrum disorder
            term:
              id: MONDO:0005258
              label: autism spectrum disorder
        context: []
      assertion_type: Environmental
      assertion:
        name: Prenatal and early-childhood heavy metal exposure
        description: 'Prenatal and early-childhood exposure to lead, mercury, cadmium, and arsenic has
          been examined as a possible contributor to ASD risk. The reported associations are metal specific
          and inconsistent: reviews of human epidemiological studies report a more consistent association
          for lead and mercury than for arsenic and cadmium, while acknowledging residual confounding
          and heterogeneous exposure-assessment methods. This is a contested population-level exposure
          association, not an established cause of an individual diagnosis, and the reviewed evidence
          does not support a blanket claim that heavy metals cause ASD.'
        notes: 'Candidate mechanisms, recorded as candidates only. Three routes are repeatedly proposed
          for lead and mercury developmental neurotoxicity: oxidative stress with mitochondrial dysfunction
          and lipid peroxidation; impaired synaptic plasticity, including altered NMDA receptor subunit
          composition and reduced synaptic protein expression; and microglial and astrocytic activation
          with neuroinflammatory signaling. A zebrafish arm of one birth-cohort study additionally nominates
          PPAR-linked lipid and steroid metabolic disruption. Every one of these is characterized in rodent,
          zebrafish, or cell models; none has been demonstrated in human neurodevelopment, at the cord-blood
          concentrations measured in human cohorts, or as a mediator of autistic traits. They are therefore
          documented here rather than curated as pathophysiology nodes, and the open translational question
          is tracked in the discussion mismatch_asd_heavy_metal_model_mechanism.'
        chemicals:
        - lead
        - mercury
        - cadmium
        - arsenic
        exposure_term:
          preferred_term: exposure to heavy metal
          term:
            id: ECTO:9002163
            label: exposure to heavy metal
      selected_evidence:
        snippet: In contrast, elevated prenatal and early childhood Pb and Hg concentrations in blood
          and hair samples showed a significant consistent association with both increased ASD risk and
          symptom severity, even after adjustment for key demographic and environmental confounders.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/2
      evidence_path: /environmental/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42540380
      reference_title: 'Association Between Heavy Metal Exposure and Autism Spectrum Disorders: Discrepancies,
        Research Gaps, and Future Priorities of Human Epidemiological Studies.'
      evidence_source: OTHER
      explanation: A critical review of 36 human epidemiological studies reports a comparatively consistent
        adjusted association for lead and mercury. It is a narrative synthesis rather than a pooled estimate,
        so it supports a population-level association only.
