        discussion_id: gap_autsx3_evidence_robustness
        prompt: Which MECP2 coding or regulatory variants reproducibly increase autism risk, with what
          penetrance and sex-specific effect?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Function-Altering MECP2 Coding or Cis-Regulatory Variation
        - pathophysiology#Reduced or Altered MeCP2 Activity
        rationale: 'Historical association studies were small and pre-GWAS. Modern results are informative
          but do not collapse into one claim: the 2025 XWAS did not nominate MECP2 as a common-variant
          locus; the 2026 trio analysis supports a female-specific coding de novo burden; the 2025 functional
          screen shows that only some ASD-catalogued missense variants lose function; and the 2026 cis-regulatory
          study is a preprint with two functional candidates. Large independent cohorts with allele-level
          segregation, penetrance, and phenotype data remain necessary. Reduced MeCP2 expression in a
          small postmortem autism cohort is relevant context but is non-specific across several neurodevelopmental
          disorders and does not establish an AUTSX3 causal node. Intellectual disability and absent speech
          therefore remain deliberately disconnected from the pathograph: both derive from one p.Gly206Ala
          carrier whose variant causality was not established.'
        posed_by: codex
        posed_date: '2026-08-05T00:00:00Z'
      selected_evidence:
        snippet: I analyzed DNVs in > 41,000 parent–child sequenced trios from three ASD family-based
          cohorts
