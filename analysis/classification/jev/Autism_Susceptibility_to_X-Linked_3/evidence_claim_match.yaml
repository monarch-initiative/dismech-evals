      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hypomorphic_mecp2_autism_susceptibility
        hypothesis_label: Hypomorphic MECP2 coding or cis-regulatory variation as an autism susceptibility
          mechanism
        status: EMERGING
        description: Some coding or cis-regulatory MECP2 variants may produce a partial change in MeCP2
          abundance or function that is milder than classic Rett-causing loss of function and contributes
          to autism. Historical support came from small candidate-gene cohorts and a family transmission
          study. A 2026 preprint provides direct human-neuron reporter-assay evidence for two noncoding
          variants, but a 2025 X-chromosome-wide common-variant study did not nominate MECP2 among its
          associated loci, and a 2026 analysis of more than 41,000 trios found MECP2 coding de novo burden
          to be female-specific. The model is therefore plausible and newly testable, but neither canonical
          nor a basis for assuming that all reported variants are causal.
      selected_evidence:
        snippet: has provided evidence for significant association (P = 0.009) for a three-marker SNP
          haplotype of MECP2 with autism/autism spectrum disorders
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
