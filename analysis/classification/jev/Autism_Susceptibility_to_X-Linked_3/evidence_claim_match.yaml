      assertion_type: Inheritance
      assertion:
        name: X-linked susceptibility locus
        description: 'MECP2 lies on Xq28, so individual alleles at this locus are transmitted on the X
          chromosome. AUTSX3 itself is a susceptibility label rather than a proven, fully penetrant Mendelian
          disorder: penetrance, recurrence risk, and sex-specific expressivity have not been established
          for the heterogeneous coding and regulatory variants grouped under this name. GeneReviews''
          X-linked inheritance statement applies to established pathogenic MECP2 disorders and is therefore
          only partial support for this broader historical label.'
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
      selected_evidence:
        snippet: MECP2 disorders are inherited in an X-linked manner.
        supports: SUPPORT
    origin:
