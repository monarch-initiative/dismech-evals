      assertion_type: DifferentialDiagnosis
      assertion:
        name: Exogenous Alcohol Ingestion or Alcohol Use Disorder
        description: Surreptitious or unrecognized exogenous alcohol exposure is the most important alternative
          explanation for intoxication and an elevated ethanol measurement. Confirmation of ABS requires
          strict supervision during challenge testing and exclusion of access to alcohol; symptoms and
          denial of use alone are not diagnostic.
        distinguishing_features:
        - In ABS, ethanol rises under supervised alcohol-free conditions after a carbohydrate challenge.
        - Exogenous intake is not explained by reproducible carbohydrate-triggered ethanol production
          under observation.
      selected_evidence:
        snippet: It is important that the patients are strictly monitored during the test for any consumption
          of alcoholic beverages, which would otherwise severely bias the test.
        supports: SUPPORT
    origin:
