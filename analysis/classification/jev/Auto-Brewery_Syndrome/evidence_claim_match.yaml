      assertion_type: ProgressionInfo
      assertion:
        phase: Carbohydrate-triggered intoxication flares and remission
        notes: ABS commonly follows an episodic course. Carbohydrate exposure can precede a rise in ethanol,
          while microbiome composition, stool ethanol-production capacity, and symptoms differ between
          flare and remission samples. Duration and recurrence vary, and standardized longitudinal natural-history
          data are not yet available.
      selected_evidence:
        snippet: Faecal samples from individuals with ABS during a flare produced more ethanol in vitro,
          which could be reduced by antibiotic treatment.
        supports: SUPPORT
