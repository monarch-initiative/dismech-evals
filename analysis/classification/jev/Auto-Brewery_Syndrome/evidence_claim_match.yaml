        environmental_effect: PREDISPOSES
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Antibiotics clear the bacteria that hold fungal populations in check, and the fungi
          expand into the space left behind. The intervening loss of colonization resistance is understood
          but is not measured here, and the exposure preceded disease in only some reported cases, which
          is why the link is graded predisposing and partial.
