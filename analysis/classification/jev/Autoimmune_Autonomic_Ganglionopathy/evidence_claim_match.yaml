        context: []
      assertion_type: Definition
      assertion:
        name: Ontology-linked acute pandysautonomia definition
        definition_type: OTHER
        description: Orphanet defines acute pandysautonomia as a rare Guillain-Barré syndrome variant
          characterized by acute post-ganglionic sympathetic and parasympathetic failure presenting several
          weeks after acute infection with gastrointestinal symptoms (abdominal pain, vomiting, constipation,
          diarrhea, gastroparesis, ileus), orthostatic hypotension, erectile dysfunction, urinary frequency,
          urgency or retention, vasomotor instability with acrocyanosis and reduced salivation, lacrimation
          and sweating. This is retained to document the MONDO/Orphanet mapping, not as a claim that all
          contemporary AAG has an acute postinfectious course.
      selected_evidence:
        snippet: A rare variant of Guillain-Barré syndrome characterized by acute post-ganglionic sympathetic
          and parasympathetic failure
        supports: SUPPORT
