        rationale: Contemporary reviews recognize acute and chronic AAG and emphasize antibody-defined
          autonomic ganglionopathy, while ORPHA:231457 describes a postinfectious acute Guillain-Barre
          variant. Cohorts and ontology resources should distinguish overlap from equivalence so chronic
          AAG is not excluded and every AAG case is not mislabeled as Guillain-Barre syndrome.
      selected_evidence:
        snippet: The first step in diagnosing AAG is careful history taking, which should reveal whether
          the mode of onset is acute or chronic
        supports: SUPPORT
