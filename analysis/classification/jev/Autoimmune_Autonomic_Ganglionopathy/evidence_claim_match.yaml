      assertion_type: ClinicalBurden
      assertion:
        burden_level: VARIABLE
        rationale: AAG ranges from disabling generalized autonomic failure requiring anti-hypotensive
          medication, urinary catheterization, nutritional or bowel support, and prolonged immunotherapy
          to partial recovery with persistent deficits. Severity, treatment response, and relapse are
          heterogeneous, but cardiovascular and gastrointestinal complications can be dangerous.
      selected_evidence:
        snippet: Autoimmune autonomic ganglionopathy (AAG) is a rare but potentially treatable cause of
          severe autonomic failure.
        supports: SUPPORT
