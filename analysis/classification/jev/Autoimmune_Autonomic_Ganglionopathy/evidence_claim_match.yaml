          acetylcholine receptor autoantibodies establish a biologically defined subset, while clinical
          course and exclusion of competing autonomic neuropathies remain essential to diagnosis.
      selected_evidence:
        snippet: Autoimmune autonomic ganglionopathy (AAG) is a disease of autonomic failure caused by
          ganglionic acetylcholine receptor (gAChR) autoantibodies.
        supports: SUPPORT
