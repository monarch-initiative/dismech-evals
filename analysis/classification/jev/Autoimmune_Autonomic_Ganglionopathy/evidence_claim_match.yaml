      assertion_type: Subtype
      assertion:
        name: Ganglionic AChR antibody-positive AAG
        display_name: gAChR-antibody-positive AAG
        description: Biologically anchored AAG in which an appropriately interpreted assay detects antibodies
          against extracellular alpha3-containing ganglionic nicotinic acetylcholine receptors. Low-level
          radioimmunoprecipitation results have lower disease specificity and require clinical correlation.
      selected_evidence:
        snippet: This study showed that in contrast to the established RIPA for α3-nAChR antibodies, which
          at low levels is of moderate disease specificity, our CBA seems AAG specific
        supports: SUPPORT
