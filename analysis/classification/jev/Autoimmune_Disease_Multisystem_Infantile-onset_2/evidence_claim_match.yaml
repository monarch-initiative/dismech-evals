      assertion_type: Discussion
      assertion:
        discussion_id: admio2_no_patient_t_cells
        prompt: What does the two-allele genotype do to a patient's own T cells, given that no patient
          T cells were ever studied?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Unopposed Hyperactive ZAP70 Signalling
        - pathophysiology#Loss of Peripheral T Cell Tolerance to Self Antigens
        rationale: 'Both affected children were transplanted before the gene defect was found, so every
          functional measurement in this disease comes from somewhere other than the patients: transfected
          293T and ZAP70-null Jurkat lines, blood from heterozygous relatives, and a knock-in mouse carrying
          one of the two alleles. The signalling claims in this entry inherit that limitation. A patient-derived
          system carrying both alleles in trans would test the central assertion directly, and iPSC-derived
          or gene-edited primary T cells are the obvious route now that both variants are known.'
        proposed_experiments:
        - experiment_id: admio2_trans_allele_pair_in_primary_t_cells
          name: Reconstruct R192W/R360P in trans in a human T-cell system and measure self-ligand responsiveness
          description: Edit both alleles into primary human T cells or an iPSC-derived T-cell system to
            produce the compound heterozygous state, alongside each allele singly, each allele opposite
            wild type, and homozygous controls. Measure receptor-proximal phosphorylation, calcium flux,
            CD69 induction, and the response to a graded panel of agonist and self-peptide ligands. The
            prediction under this entry's mechanism is that only the R192W/R360P pair shows enhanced responsiveness
            to weak ligands, and that adding a wild-type allele abolishes it.
          perturbations:
          - name: ZAP70 R192W and R360P introduced in trans
            target: pathophysiology#Unopposed Hyperactive ZAP70 Signalling
            gene:
              preferred_term: ZAP70
              term:
                id: hgnc:12858
                label: ZAP70
          readouts:
          - name: CD69 induction and receptor-proximal phosphorylation across a graded ligand panel
            target: pathophysiology#Unopposed Hyperactive ZAP70 Signalling
            direction: INCREASED
            interpretation: Enhanced responses confined to the compound heterozygous configuration would
              support the unmasking model in human cells.
          would_support:
          - pathophysiology#Unopposed Hyperactive ZAP70 Signalling
          decision_criterion: Enhanced weak-ligand responses in the compound heterozygous state but not
            in either allele paired with wild type.
      selected_evidence:
        snippet: Although pre-HCT patient T cells were not available, mutation effects were determined
          using transfected cell lines and peripheral blood from carriers and controls.
        supports: SUPPORT
