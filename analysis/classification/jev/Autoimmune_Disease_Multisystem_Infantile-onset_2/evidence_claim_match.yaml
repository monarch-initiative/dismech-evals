              label: autoimmune disease, multisystem, infantile-onset, 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: admio2_central_versus_peripheral_tolerance
        prompt: Does this disease break central tolerance as well as peripheral tolerance, and if so which
          allele does it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hypomorphic ZAP70 SH2 Docking Allele
        - pathophysiology#Loss of Peripheral T Cell Tolerance to Self Antigens
        rationale: 'This entry''s chain runs through peripheral tolerance, because that is what the knock-in
          mouse measures and what the activating allele is shown to do. The thymic arm is unresolved,
          and the literature points in two directions at once. The primary report proposes that altered
          signalling lets autoreactive thymocytes escape deletion, which is the mechanism established
          for hypomorphic ZAP70 alleles in mice: the SKG strain''s hypomorph raises selection thresholds
          so that self-reactive thymocytes are positively rather than negatively selected, and attenuated
          signalling also hampers regulatory T-cell generation. But the same group''s review states that
          a hyperactive kinase, which is what this genotype produces in the periphery, enhances thymic
          negative selection rather than weakening it. Which effect dominates in a thymus expressing one
          allele of each class is not known, and the patients'' thymic output was never studied: both
          were transplanted before the genotype was found, and their newborn excision-circle screens were
          normal. The question matters for whether this disease belongs on the graded-signal-strength
          spectrum that connects ZAP70 immunodeficiency to ZAP70 autoimmunity, or beside it.'
      selected_evidence:
        snippet: In mice, defects in both central and peripheral tolerance have been associated with hypomorphic
          Zap-70 defects and autoimmune features
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
