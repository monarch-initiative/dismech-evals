  4032db8585c081137be0d49fa3d86e5bee66e882e5aeb662da0aa984f4901a88:
    claim:
      about:
        disease:
          name: Autoimmune Disease, Multisystem, Infantile-Onset, 2
          disease_term:
            preferred_term: autoimmune disease, multisystem, infantile-onset, 2
            term:
              id: MONDO:0014861
              label: autoimmune disease, multisystem, infantile-onset, 2
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: Disease requires one hypomorphic and one activating ZAP70 allele in trans. The affected
          siblings inherited p.R192W from their mother and p.R360P from their father; the parents and
          an unaffected sister carrying p.R360P alone are well. The pattern is recessive in that each
          allele is silent beside a wild-type allele, but it is not the biallelic loss of function of
          ZAP70 deficiency. Homozygosity for the hypomorphic allele alone has since been reported in two
          siblings, who had combined immunodeficiency with CD8 lymphopenia and autoimmunity but not this
          antibody-defined constellation, so it is the pairing rather than either allele that produces
          this disease.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: ZAP-70 combined hypomorphic and activating mutations | ZAP70 | AR (LOF/GOF) | 617006
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41608114
      reference_title: 'Human inborn errors of immunity: 2024 update on the classification from the International
        Union of Immunological Societies Expert Committee.'
      evidence_source: OTHER
      explanation: IUIS annotates the inheritance as autosomal recessive with one loss-of-function and
