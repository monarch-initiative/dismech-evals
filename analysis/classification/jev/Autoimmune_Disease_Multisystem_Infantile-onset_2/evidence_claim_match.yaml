          the oral mucosa, with a biopsy showing subepidermal clefting, eosinophil and neutrophil infiltration
          and linear basement-membrane IgG above a 1:160 titre; in the sister from one month of age. Bullous
          pemphigoid in young children is normally steroid-responsive, which this was not.'
        phenotype_term:
          preferred_term: bullous pemphigoid
