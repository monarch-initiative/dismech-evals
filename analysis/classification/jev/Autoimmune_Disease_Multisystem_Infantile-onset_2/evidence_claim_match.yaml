            max_age_years: 1.7
            notes: One month in the sister and 20 months in the brother. The category records the sister's
              onset, which is the infantile onset the disease is named for; the brother's falls in the
              second year, and the range carries both rather than averaging them. The category is single-valued,
              so it cannot say CHILDHOOD for one sibling and INFANTILE for the other, and with two patients
              a per-subtype split would be two subtypes of one.
      selected_evidence:
        snippet: a biopsy showed bullous pemphigoid, with characteristic subepidermal clefting, infiltration
          with eosinophils and neutrophils, and linear basement membrane and intercellular deposition
