  d24f7e4896cf78ed952485de19070f0cedcdab7fbdf489814f767522aa4127b8:
    claim:
      about:
        disease:
          name: Autoimmune Disease, Multisystem, Infantile-Onset, 2
          disease_term:
            preferred_term: autoimmune disease, multisystem, infantile-onset, 2
            term:
              id: MONDO:0014861
              label: autoimmune disease, multisystem, infantile-onset, 2
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Homozygous ZAP70 R192W combined immunodeficiency
        description: 'The sharpest contrast available, because it isolates the allele rather than the
          gene. Two siblings homozygous for the same hypomorphic C-SH2 allele that this disease carries
          on one chromosome presented with combined immunodeficiency and CD8 lymphopenia, not with the
          antibody-defined constellation seen here: no bullous pemphigoid, no factor VIII inhibitor, no
          nephrotic syndrome.

          Read the comparison carefully, because it is weaker than it first looks. Those patients were
          not free of autoimmunity, and the report says so explicitly in the same sentence that notes
          the absence of an activating mutation; one of the four patients in that series had inflammatory
          polyarthritis. So the two-allele configuration explains why this disease looks the way it does,
          and the activating allele is not established as the precondition for autoimmunity in ZAP70 disease
          generally. That paper''s own framing of the open question is the reverse of the one this entry
          answers: how hypomorphic alleles, which reduce signalling, produce autoimmunity at all.'
      selected_evidence:
        snippet: Notably, both R170C and R192W mutations negatively impacted the binding of ZAP-70 to
          the TCR ζ-chain, resulting in a complete absence in TCR-induced proliferation (this study and
          (42)) and all patients presented with immunodeficiency and autoimmunity, in the absence of activating
          mutations.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37313400
      reference_title: Combined immunodeficiency caused by pathogenic variants in the ZAP70 C-terminal
