      assertion:
        name: ZAP70 deficiency (combined immunodeficiency, biallelic loss of function)
        description: 'The same gene, and the obvious confusion. ZAP70 deficiency is a combined immunodeficiency
          from biallelic loss of function: CD8 T cells are effectively absent, CD4 cells are present but
          unresponsive to receptor stimulation, and patients present with life-threatening and opportunistic
          infection in infancy. Autoimmunity occurs there too, in roughly a fifth of patients, which is
          what makes the two entities easy to conflate. The discriminators are the infectious history,
          which is absent here, and the degree of the CD8 deficit, which is partial here and near-total
          there. Mechanistically they are opposites: too little kinase activity in one, too much in the
          other.'
        disease_term:
          preferred_term: ZAP70 deficiency
          term:
            id: MONDO:0010023
            label: combined immunodeficiency due to ZAP70 deficiency
        distinguishing_features:
        - No clinical immunodeficiency and no opportunistic infection in this disease
        - CD8 reduction is partial rather than near-absent, and the CD4:CD8 ratio is less extreme
        - Autoimmunity is the presenting problem rather than a complication in a minority
        - One allele is activating, so the kinase is hyperactive rather than absent
      selected_evidence:
        snippet: In marked contrast, our patients had a distinct phenotype with early onset, severe to
          life-threatening autoimmune disease and only minor lymphocyte abnormalities and no evidence
          of immune deficiency
        supports: SUPPORT
