            term:
              id: MONDO:0014861
              label: autoimmune disease, multisystem, infantile-onset, 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Peripheral T Cell Tolerance to Self Antigens
        description: 'Mature T cells that react to self peptide-MHC are normally held below the activation
          threshold. When the threshold is lowered, such cells can be driven by self ligands in a permissive
          cytokine environment, which the authors propose as the route from the kinase defect to organ-directed
          autoimmunity. Unlike the hypomorphic ZAP70 alleles studied in mice, where forbidden clones escape
          thymic deletion, the activating allele acts mainly on mature cells: thymic negative selection
          is if anything strengthened, and knock-in mice accumulate regulatory and anergic T cells rather
          than autoimmunity.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: peripheral tolerance induction
          modifier: DECREASED
          term:
            id: GO:0002465
            label: peripheral tolerance induction
      selected_evidence:
        snippet: Hyperactive ZAP70 enhances thymic negative selection but some thymocytes will, nonetheless,
          escape negative selection and have greater sensitivity to weak and self-ligands.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
