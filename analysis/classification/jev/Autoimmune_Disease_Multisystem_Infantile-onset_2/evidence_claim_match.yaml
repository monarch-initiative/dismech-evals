      assertion:
        discussion_id: admio2_mouse_tolerance_mismatch
        prompt: Why do Zap70 R360P mice not develop autoimmunity, and does that limit the inference from
          the mouse to these patients?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Mouse
        - pathophysiology#Loss of Peripheral T Cell Tolerance to Self Antigens
        rationale: 'The knock-in mouse reproduces the signalling phenotype and the follicular helper expansion
          but not the disease: no spontaneous autoimmunity, no autoantibodies, no organ pathology. The
          authors attribute this to the autoimmunity-resistant C57BL/6 background, to unknown modifiers,
          or to environment, and note that aged knock-in mice accumulate regulatory and anergic T cells,
          which may be actively holding the enhanced signalling in check. The mouse is also homozygous
          for the activating allele rather than compound heterozygous, so it does not model the configuration
          the human disease requires. Both facts matter for how far the tolerance-breaking step can be
          said to be demonstrated rather than inferred.'
      selected_evidence:
        snippet: In contrast to humans, R360P mice did not spontaneously develop a detectable autoimmune
          phenotype, which may be due to their genetic background.
        supports: SUPPORT
