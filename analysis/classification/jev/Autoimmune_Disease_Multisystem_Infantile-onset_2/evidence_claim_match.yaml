          report itself draws. Activating STAT3 variants cause early-onset multisystem autoimmunity, while
          dominant-negative variants in the same gene cause hyper-IgE syndrome; that mirror-image pairing
          is the pattern this ZAP70 disease follows. Distinguishing them is a sequencing question rather
          than a clinical one.
      selected_evidence:
        snippet: The latter category is typified by STAT3-activating mutations (Flanagan et al., 2014),
          which lead to early onset autoimmunity, in contrast to the dominant-negative defects in the
          same gene that cause hyper-IgE syndrome with boils and necrotizing pneumonias.
        supports: SUPPORT
