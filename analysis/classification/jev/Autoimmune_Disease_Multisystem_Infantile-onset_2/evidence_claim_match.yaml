            term:
              id: MONDO:0014861
              label: autoimmune disease, multisystem, infantile-onset, 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autoantibody Production Against Tissue and Plasma Protein Antigens
        description: 'The diseases that defined this syndrome are antibody-defined: bullous pemphigoid
          with linear basement-membrane IgG at a titre above 1:160, and an inhibitory autoantibody to
          coagulation factor VIII causing bleeding. Both point at autoreactive B-cell help as the effector
          arm rather than at direct T-cell cytotoxicity. The node is scaled CELLULAR because its substrate
          is the antibody-secreting cell; the organ-level consequences are the phenotypes downstream of
          it. Tolerance is recorded as broken rather than as an intrinsic B-cell defect: ZAP-70 is expressed
          predominantly in T and NK cells, and the proposed cause is excess T-cell help.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: plasma cell
          term:
            id: CL:0000786
            label: plasma cell
        biological_processes:
        - preferred_term: autoantibody secretion
          modifier: INCREASED
          term:
            id: GO:0002377
            label: immunoglobulin production
        - preferred_term: B cell tolerance induction
          modifier: DECREASED
          term:
            id: GO:0002514
            label: B cell tolerance induction
      selected_evidence:
        snippet: Altered signaling could allow autoreactive T cells to escape thymic deletion and emigrate
          into the periphery, where they could activate potentially autoreactive B cells, thereby leading
          to production of autoantibodies to antigens such as skin proteins (bullous pemphigoid) and clotting
          factors (autoimmune hemophilia).
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26783323
      reference_title: A novel human autoimmune syndrome caused by combined hypomorphic and activating
        mutations in ZAP-70.
      evidence_source: HUMAN_CLINICAL
      explanation: The proposed route from the signalling defect to the two antibody-mediated diseases
        in these children, stated conditionally by the authors. It is quoted for its second half, the
        activation of autoreactive B cells; the thymic-escape premise in its first half is the question
        the central-versus-peripheral-tolerance discussion records as open, and this node does not rest
        on it.
