  f1ea9ba4a5608aa358804bcd346969a28f2a024245206808663d975fd834f059:
    claim:
      about:
        disease:
          name: Autoimmune Disease, Multisystem, Infantile-Onset, 2
          disease_term:
            preferred_term: autoimmune disease, multisystem, infantile-onset, 2
            term:
              id: MONDO:0014861
              label: autoimmune disease, multisystem, infantile-onset, 2
        context: []
      assertion_type: Genetic
      assertion:
        name: ZAP70 (hypomorphic plus activating alleles in trans)
        notes: 'ZAP70 at 2q11.2 encodes the 70 kDa zeta-chain-associated protein kinase, a Syk-family
          cytoplasmic tyrosine kinase coupling the engaged T-cell receptor to LAT and SLP-76. What is
          distinctive about this disease is not a new region of the gene but the pairing: a docking-defective
          C-SH2 allele with an autoinhibition-weakening kinase-domain allele. Both residues were novel
          when reported and neither lies near the previously reported loss-of-function alleles.

          No gene_disease_validity assertion is recorded. ClinGen''s SCID-CID Gene Curation Expert Panel
          classifies ZAP70 as Definitive, but for MONDO:0010023, the loss-of-function combined immunodeficiency,
          which is a different gene-disease pair from this one. Copying that tier here would assert a
          classification nobody has made for this entity.'
        gene_term:
          preferred_term: ZAP70
          term:
            id: hgnc:12858
            label: ZAP70
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        variants:
        - name: ZAP70 c.574C>T p.R192W
          description: C-terminal SH2 domain allele, inherited from the mother. The tryptophan occupies
            the phosphotyrosine-binding pocket formed by arginines 170, 190 and 192, so the kinase docks
            poorly on the doubly phosphorylated zeta chain. Reported at an allele frequency of 0.00003
            in ExAC at the time of publication.
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: binding to the phosphorylated T-cell receptor zeta chain
            description: Reduced association with, and reduced phosphorylation on, the zeta chain in transfected
              cells.
            type: hypomorphic
        - name: ZAP70 c.1079G>C p.R360P
          description: Kinase-domain N-lobe allele, inherited from the father, lying in a loop close to
            Tyr315 and Tyr319. It weakens the autoinhibited conformation, producing a weakly hyperactive
            kinase. Neighbouring substitutions in the same region (D327P, K362E) are more strongly activating,
            which is the basis for calling this one weak.
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: T-cell receptor-proximal tyrosine kinase activity
            description: Partial constitutive activation through loss of autoinhibition, with increased
              phosphorylation of ZAP-70 Y319 and Y493 and of LAT and SLP-76 on receptor engagement.
            type: hypermorphic
      selected_evidence:
        snippet: Analysis of whole-exome sequencing (WES) revealed no consanguinity and only one gene,
          ZAP70, with nonsynonymous coding variants potentially causing homozygous recessive immunological
          disease.
        supports: SUPPORT
    origin:
