  461dffd68051fd21c2bf282a2a2422ece4c7d50d48cd2dcfa8f8e51e4ab99be2:
    claim:
      about:
        disease:
          name: Autoimmune Disease, Multisystem, Infantile-Onset, 2
          disease_term:
            preferred_term: autoimmune disease, multisystem, infantile-onset, 2
            term:
              id: MONDO:0014861
              label: autoimmune disease, multisystem, infantile-onset, 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypomorphic ZAP70 SH2 Docking Allele
        description: p.R192W substitutes a bulky tryptophan into the phosphotyrosine-binding pocket of
          the C-terminal SH2 domain. The mutant kinase associates poorly with the phosphorylated TCR zeta
          chain and is itself poorly phosphorylated there. Homozygous R192W has since been reported in
          siblings with combined immunodeficiency, so the allele is pathogenic on its own; in this genotype
          its contribution is different, because it cannot supply the restraint on the partner allele
          that a wild-type copy would.
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: ZAP70
            term:
              id: hgnc:12858
              label: ZAP70
          allele_type: missense, c.574C>T p.R192W
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Maternally inherited hypomorphic allele, in trans with the activating p.R360P allele.
        genes:
        - preferred_term: ZAP70
          term:
            id: hgnc:12858
            label: ZAP70
        molecular_functions:
        - preferred_term: phosphotyrosine residue binding
          modifier: DECREASED
          term:
            id: GO:0001784
            label: phosphotyrosine residue binding
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
      selected_evidence:
        snippet: Thus, the data suggest that the R192W ZAP-70 mutant is a hypomorph with reduced ζ-chain
          association and phosphorylation compared with WT.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26783323
      reference_title: A novel human autoimmune syndrome caused by combined hypomorphic and activating
        mutations in ZAP-70.
      evidence_source: IN_VITRO
      explanation: Immunoprecipitation from transfected cells gives the reduced zeta-chain association
        and phosphorylation that define this allele as hypomorphic.
