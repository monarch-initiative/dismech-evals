  a0e3b92d7322cec6731e8c14e1e63da24a7581d48c8463e66698f41cc763c8a3:
    claim:
      about:
        disease:
          name: Autoimmune Disease, Multisystem, Infantile-Onset, 2
          disease_term:
            preferred_term: autoimmune disease, multisystem, infantile-onset, 2
            term:
              id: MONDO:0014861
              label: autoimmune disease, multisystem, infantile-onset, 2
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Zap70 R360P knock-in mouse
        species: Mouse
        genotype: Zap70 R360P homozygous knock-in
        background: C57BL/6
        publication: PMID:33531381
        description: 'CRISPR-generated knock-in carrying the activating allele in the homozygous state.
          The mice are healthy, fertile and normal-lived, and they do not develop autoimmunity: histology
          of multiple organs at 8 to 10 months was unremarkable and ANA and anti-dsDNA screening was negative.
          What they do show is the signalling phenotype. Thymocyte and peripheral T-cell development is
          grossly normal, but central memory CD8 cells increase, ZAP70 Y319 phosphorylation and calcium
          mobilisation are enhanced, follicular helper T cells expand after LCMV infection, and aged animals
          have more IgG and IgG1. Crossing in the OTI transgenic TCR removes repertoire compensation and
          reveals selectively enhanced responses to weak agonist and self peptides.'
        modeled_mechanisms:
        - target: Unopposed Hyperactive ZAP70 Signalling
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Reproduces the enhanced TCR signalling and the altered sensitivity to weak and
            self ligands that the human genotype is proposed to produce.
          limitations: The genotype is not the patients'. The mice are homozygous for the activating allele,
            whereas the patients carry it opposite a hypomorphic allele, and in the human cell-line experiments
            the hypomorphic partner is what unmasks the activating allele. So the model tests the activating
            allele's effect rather than the two-allele configuration.
          divergences:
          - divergence_type: POPULATION_MISMATCH
            materiality: QUALIFYING
            description: R360P homozygosity in the mouse stands in for R192W/R360P compound heterozygosity
              in the patients. The claim about enhanced signalling holds; the claim that this particular
              allele pairing is required does not come from the model.
          readouts:
          - name: ZAP70 Y319 phosphorylation and calcium mobilisation after anti-CD3 stimulation
            target: Unopposed Hyperactive ZAP70 Signalling
            direction: INCREASED
            interpretation: Biochemical confirmation that the allele raises receptor-proximal signalling
              in primary T cells.
        - target: T Follicular Helper Cell Expansion
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Antigen-specific follicular helper T cells expand more in knock-in mice than in
            wild-type after acute LCMV infection, with higher IgG and IgG1 in aged animals.
          limitations: The expansion needed an acute viral infection to appear and, on a polyclonal repertoire,
            did not produce more germinal-centre B cells or higher anti-LCMV titres. No autoantibody arose
            in these mice, so the step from expanded help to pathogenic autoantibody is not modelled.
          readouts:
          - name: Antigen-specific Tfh percentage among GP66+ effector CD4 T cells at day 8 after LCMV
            target: T Follicular Helper Cell Expansion
            direction: INCREASED
        - target: Loss of Peripheral T Cell Tolerance to Self Antigens
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: 'The knock-in mice do not break tolerance in any observable way: no spontaneous
            autoimmune disease on organ histology, no lymphadenopathy or splenomegaly, and no ANA or anti-dsDNA
            antibodies.'
          limitations: C57BL/6 is relatively resistant to autoimmunity, and the authors attribute the
            negative result to background, modifiers or environment rather than to the allele being harmless.
            Aged knock-in mice also accumulate regulatory and anergic T cells, which may be actively containing
            the enhanced signalling. A negative result here therefore does not refute the human mechanism,
            but it does mean the tolerance-breaking step rests on the patients and on inference.
      selected_evidence:
        snippet: Mice with a ZAP70 R360P mutation and polyclonal TCR repertoires exhibited relatively
          normal T cell development but showed evidence of increased signaling.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33531381
      reference_title: A disease-associated mutation that weakens ZAP70 autoinhibition enhances responses
