          paper calls it diminished but not absent, while its Table 1 gives 2.4 per cent against a stated
          floor of 49.9 per cent, with the brother at 1 per cent. The clinical point is that neither child
          had infections suggesting immunodeficiency despite this.'
        phenotype_term:
          preferred_term: diminished PHA proliferative response
          term:
            id: HP:0025834
            label: Impaired phytohemagglutinin-induced T lymphocyte transformation
      selected_evidence:
        snippet: His proliferative responses were diminished to phytohemagglutinin (PHA) and absent of
          candida or tetanus antigens; however, he was receiving immunosuppressive medications when the
          immune studies were done.
        supports: SUPPORT
