  8b71b482bef144d321b9fa730c242f0abe9ddd90d0adb930b4f4447ae8da71af:
    claim:
      about:
        disease:
          name: Autoimmune Disease Multisystem Infantile-onset 3
          disease_term:
            preferred_term: autoimmune disease, multisystem, infantile-onset, 3
            term:
              id: MONDO:0957388
              label: autoimmune disease, multisystem, infantile-onset, 3
        context: []
      assertion_type: Genetic
      assertion:
        name: CBLB
        notes: 'CBLB at 3q13.11 encodes CBL-B, a RING-type E3 ubiquitin ligase of the Cbl family expressed
          in immune cells, which ubiquitinates proteins recruited to activated antigen and Fc receptors
          so that they are degraded. The three reported disease alleles hit three different parts of the
          protein: the SH2 binding subdomain of the substrate-binding tyrosine kinase binding domain,
          a truncation before the C-terminus, and the segment between the RING domain and the proline-rich
          region. Only the first two were characterised functionally.

          The gene also carries common susceptibility alleles for polygenic autoimmune disease, which
          is context rather than content for this entry: a Sardinian multiple sclerosis GWAS hit, rs9657904
          (PMID:20453840), replicated in Italy (PMID:21037273); rs12487066, associated with lower CBL-B
          expression (PMID:25261476); and a type 1 diabetes association in Danish families (PMID:15629882).
          Those are associations with other diseases, not with this one, so they are recorded here and
          not as a susceptibility row.

          No gene_disease_validity assertion is recorded. ClinGen has not published a gene-disease validity
          classification for CBLB with this or any disease, so there is no external tier to copy; IUIS''s
          inclusion of the gene as a new recessive loss-of-function entity in its 2024 update is a classification
          of the disease, not a validity tier for the pair.'
        gene_term:
          preferred_term: CBLB
          term:
            id: hgnc:1542
            label: CBLB
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        variants:
        - name: CBLB c.854A>T p.H285L
          description: Homozygous in the first patient, with both parents heterozygous. The residue sits
            in the SH2 binding subdomain of the tyrosine kinase binding domain, the part of CBL-B that
            engages substrates; structural modelling suggested the substitution distorts a water-binding
            pocket. The mutant is expressed at about half the normal level in the patient's EBV-transformed
            B cells. This is the only allele modelled in a mouse, as the corresponding Cblb p.H257L knock-in.
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: substrate engagement by the tyrosine kinase binding domain
            description: Partial loss of protein abundance, with the substitution falling in the substrate-binding
              subdomain. Ligase activity itself was not assayed.
            type: hypomorphic
        - name: CBLB c.1486C>T p.R496X
          description: 'Homozygous in the second patient, with both parents heterozygous. A 57 kDa truncated
            product was expected, and an antibody against the CBL-B N-terminus detected none in the patient''s
            EBV-transformed B cells. This is the allele that establishes the mechanism as loss of function:
            no protein, and the same T-cell hyperproliferation as the other patients.'
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: CBL-B protein expression
            description: No protein detectable with an N-terminal antibody, so the expected truncated
              product is absent rather than merely non-functional.
            type: loss of function
        - name: CBLB c.1392C>G p.C464W
          description: Homozygous in the third patient, with both parents heterozygous. The residue lies
            between the RING domain and the proline-rich region. Protein expression is intact and no further
            patient sample was available, so no functional consequence was measured; the region containing
            this residue is not in the Protein Data Bank, so it could not be modelled either. Its pathogenicity
            rests on homozygosity in an affected child, absence from population and in-house databases,
            and the T-cell phenotype shared with the other two patients.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: The variants were not present in gnomAD (v.2.1.1) nor our bio/databank of 60,234 individuals.
        supports: SUPPORT
