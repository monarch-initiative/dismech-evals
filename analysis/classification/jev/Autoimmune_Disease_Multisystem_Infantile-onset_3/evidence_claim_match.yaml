  2c8d811479fd15a1cfa0f4cefafc7cfa998e986e0ad788ceca809227b1381a2f:
    claim:
      about:
        disease:
          name: Autoimmune Disease Multisystem Infantile-onset 3
          disease_term:
            preferred_term: autoimmune disease, multisystem, infantile-onset, 3
            term:
              id: MONDO:0957388
              label: autoimmune disease, multisystem, infantile-onset, 3
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Cblb H257L knock-in mouse
        species: Mouse
        genotype: Cblb c.770A>T p.H257L homozygous knock-in
        publication: PMID:36006710
        description: 'CRISPR/Cas9 knock-in of the mouse residue corresponding to the first patient''s
          p.H285L, generated to test whether that allele predisposes to immune dysregulation. It reproduces
          the expression defect, at about half wild-type protein, and the cellular phenotype: effector
          T cell hyperproliferation with increased interleukin-2 and no further gain from anti-CD28, resistance
          of those effector cells to wild-type regulatory T cells, increased and prolonged B-cell SYK
          phosphorylation with hyperproliferation after IgM cross-linking, hyperactivated bone-marrow-derived
          mast cells, and exaggerated IgE-mediated passive anaphylaxis. What it does not reproduce is
          the disease. At one year the mice were healthy, without lymphadenopathy or organomegaly, with
          no cellular infiltrate in salivary gland, liver or kidney and HEp-2-reactive autoantibody titres
          no different from wild type. Two findings also run against the patient: splenic regulatory T
          cells are increased where the patient''s were decreased, and the B-cell signalling gain produced
          no increase in germinal-centre B cells or antibody.'
        genes:
        - preferred_term: CBLB
          term:
            id: hgnc:1542
            label: CBLB
        modeled_mechanisms:
        - target: T Cell Hyperproliferation Uncoupled from CD28 Costimulation
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Reproduces the patients' T-cell phenotype on the matched allele, and adds the interleukin-2
            and costimulation-independence measurements that patient material could not supply.
          limitations: 'The mouse uncoupling is more complete than the patients'': anti-CD28 added nothing
            to its effector cells'' proliferation, whereas patient cells still responded further to it.'
        - target: Effector T Cell Resistance to Regulatory T Cell Suppression
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: 'Reproduces the patient finding and dissects it: the model''s own regulatory T
            cells suppress wild-type effector cells normally, while its effector cells resist wild-type
            regulatory T cells, which localises the lesion to the effector cell.'
          limitations: 'The regulatory T cell compartment behaves oppositely in the two: increased in
            the mouse spleen, decreased in the patient''s blood. The suppression result is unaffected
            by that, but it means the model does not predict the patient''s Treg percentage.'
        - target: Mast Cell Hyperactivation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: 'The only arm where the model goes all the way to a whole-animal outcome: Fc-epsilon-receptor-proximal
            hyperphosphorylation and LAMP-1 mobilisation in cultured mast cells, and exaggerated IgE-mediated
            passive anaphylaxis with raised mast cell protease 1 in the animal.'
          limitations: 'The human counterpart is chronic urticaria with a basophil-activating plasma factor,
            not IgE-mediated anaphylaxis: the patient had no atopy and no detectable IgE to environmental
            allergens. The model therefore demonstrates the cell''s hyperreactivity through a trigger
            the patient''s disease does not use.'
        - target: Breakdown of Peripheral T Cell Tolerance
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: ORGANISM
          description: The step at which the model stops. It carries the cellular abnormalities that this
            entry proposes break tolerance, and does not break tolerance.
          limitations: 'Housing is the authors'' own candidate explanation: the mice were kept under specific-pathogen-free
            conditions, and the two independently generated Cblb-null lines also differ from each other
            in whether they develop autoimmunity. So the negative result may reflect the absence of an
            environmental trigger rather than the absence of the mechanism, and the planned test, cohousing
            with pet-store mice, had not been done.'
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: INVALIDATING
            description: Whatever second requirement turns the cellular phenotype into autoimmunity, microbial
              exposure or modifier alleles or both, is outside this model as housed. The authors name
              cohousing with pet-store mice as the experiment that would bring it inside.
      selected_evidence:
        snippet: Mice homozygous for the CBL-B p.H257L mutation, which corresponds to the patient's p.H285L
          mutation, had T and B cell hyperproliferation in response to antigen receptor cross-linking.
        supports: SUPPORT
