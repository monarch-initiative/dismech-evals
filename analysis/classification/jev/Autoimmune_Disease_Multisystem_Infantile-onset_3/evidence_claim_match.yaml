      assertion_type: Discussion
      assertion:
        discussion_id: cblb_c464w_mechanism_unmeasured
        prompt: How does p.C464W cause disease, given that CBL-B protein expression in that patient's
          cells is intact?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Biallelic CBLB Loss of Function
        rationale: 'Two of the three alleles have a measured consequence: no protein for p.R496X, half-normal
          protein for p.H285L. The third, p.C464W, leaves protein expression intact, no further patient
          sample was available for functional work, and the region of the protein containing the residue
          is absent from the Protein Data Bank so it could not be modelled either. Its position between
          the RING domain and the proline-rich region is suggestive of an effect on ligase activity rather
          than on abundance, but nothing was assayed, and this entry''s gene-level mechanism is described
          as loss of function partly on the strength of the other two alleles. A ligase activity or substrate-ubiquitination
          assay on the C464W protein would say whether the third family''s disease has the same molecular
          basis as the first two.'
        proposed_experiments:
        - experiment_id: cblb_c464w_ligase_activity
          name: Measure ubiquitin ligase activity of the C464W CBL-B protein
          description: Express wild-type, C464W and H285L CBL-B in a CBLB-null cell background and compare
            autoubiquitination and substrate ubiquitination, alongside antigen-receptor-induced proliferation
            and interleukin-2 production. The prediction is that C464W is catalytically defective despite
            normal abundance.
          perturbations:
          - name: C464W CBL-B expressed in a CBLB-null background
            target: pathophysiology#Biallelic CBLB Loss of Function
            gene:
              preferred_term: CBLB
              term:
                id: hgnc:1542
                label: CBLB
          readouts:
          - name: Substrate ubiquitination by the reconstituted ligase
            target: pathophysiology#Biallelic CBLB Loss of Function
            direction: DECREASED
            interpretation: Reduced ubiquitination with preserved protein would place this allele's defect
              in catalysis and confirm the loss-of-function mechanism for the third family.
          would_support:
          - pathophysiology#Biallelic CBLB Loss of Function
          supporting_outcome:
          - Reduced substrate ubiquitination by the C464W protein relative to wild type, at comparable
            protein abundance.
          decision_criterion: Reduced substrate ubiquitination by C464W relative to wild type, with comparable
            protein abundance.
      selected_evidence:
        snippet: Immunoblotting of the patient's EBV-B cells demonstrated intact CBL-B protein expression
          (Figure 1J). Additional patient samples were not available for functional studies.
        supports: SUPPORT
