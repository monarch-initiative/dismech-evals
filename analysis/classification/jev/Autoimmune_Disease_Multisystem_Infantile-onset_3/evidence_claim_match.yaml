        biological_processes:
        - preferred_term: regulatory T cell-mediated suppression of effector T cell proliferation
          modifier: DECREASED
          term:
            id: GO:0042130
            label: negative regulation of T cell proliferation
      selected_evidence:
        snippet: In addition, the proliferation of CD4+CD25– Teffs from P1 was resistant to suppression
          by Tregs from HCs (Figure 1G).
        supports: SUPPORT
