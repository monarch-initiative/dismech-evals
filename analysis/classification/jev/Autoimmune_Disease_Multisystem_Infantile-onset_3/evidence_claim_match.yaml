  e444a1a67eb73a0a635f954f2c54ad146c7704a0278a5529621e9dffd3af4274:
    claim:
      about:
        disease:
          name: Autoimmune Disease Multisystem Infantile-onset 3
          disease_term:
            preferred_term: autoimmune disease, multisystem, infantile-onset, 3
            term:
              id: MONDO:0957388
              label: autoimmune disease, multisystem, infantile-onset, 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of CBL-B Restraint on Antigen Receptor Signalling
        description: 'CBL-B is a negative regulator of antigen receptor signalling, and its expression
          in T cells is itself controlled by signals downstream of the T-cell receptor and CD28. Without
          it, receptor-proximal signalling proteins escape ubiquitin-dependent degradation. The affected
          step is selective rather than global: in Cbl-b-null T cells the main T-cell receptor pathways,
          Zap-70 and Lck, the Ras/MAP kinase cascade, phospholipase C-gamma-1 and calcium mobilisation,
          are unaffected, while Vav activation is enhanced; and in the knock-in mouse carrying the patient
          allele, LAT and PLC-gamma-1 phosphorylation, calcium flux, and ERK1/2 and AKT phosphorylation
          after anti-CD3 stimulation are all normal despite the hyperproliferation. In B cells the picture
          is the opposite: BCR ligation produces increased and prolonged SYK phosphorylation.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        biological_processes:
        - preferred_term: negative regulation of T cell receptor signaling by CBL-B
          modifier: DECREASED
          term:
            id: GO:0050860
            label: negative regulation of T cell receptor signaling pathway
      selected_evidence:
        snippet: The main TCR signalling pathways, such as tyrosine kinases Zap-70 and Lck, Ras/mitogen-activated
          kinases, phospholipase Cgamma-1 and Ca2+ mobilization, were not affected in Cbl-b(-/-) T cells.
          In contrast, the activation of Vav, a guanine nucleotide exchange factor for Rac1/Rho/CDC42,
          was significantly enhanced.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10646609
      reference_title: Cbl-b regulates the CD28 dependence of T-cell activation.
      evidence_source: MODEL_ORGANISM
      explanation: Identifies which arm of receptor signalling is released when Cbl-b is absent, and which
        arms are not, which is what this node asserts about the selectivity of the defect.
