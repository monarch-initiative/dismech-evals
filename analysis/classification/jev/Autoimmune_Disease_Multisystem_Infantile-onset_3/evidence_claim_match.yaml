  d69931542abb41244b48e6f98dfce01767087b286cf01a443d586bb71c3dc07d:
    claim:
      about:
        disease:
          name: Autoimmune Disease Multisystem Infantile-onset 3
          disease_term:
            preferred_term: autoimmune disease, multisystem, infantile-onset, 3
            term:
              id: MONDO:0957388
              label: autoimmune disease, multisystem, infantile-onset, 3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CBLB Loss of Function
        description: Three distinct homozygous CBLB variants were found, one per family, and they damage
          the protein in three different ways. p.R496X truncates it and no product is detectable with
          an N-terminal antibody. p.H285L sits in the SH2 binding subdomain of the tyrosine kinase binding
          domain, the part of CBL-B that engages its substrates, and is expressed at about half the normal
          level. p.C464W, between the RING domain and the proline-rich region, leaves protein expression
          intact; no functional study of that allele was possible, so for it the loss of function is inferred
          from the clinical and genetic evidence rather than measured. None of the three variants is present
          in gnomAD v2.1.1 or in the sequencing laboratory's own 60,234-individual databank.
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: CBLB
            term:
              id: hgnc:1542
              label: CBLB
          allele_type: 'nonsense and missense: c.1486C>T p.R496X, c.854A>T p.H285L, c.1392C>G p.C464W'
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: One homozygous variant per family. The truncating allele abolishes protein; the
            SH2-subdomain allele halves it; the third preserves expression and was not functionally tested.
        genes:
        - preferred_term: CBLB
          term:
            id: hgnc:1542
            label: CBLB
        molecular_functions:
        - preferred_term: CBL-B ubiquitin protein ligase activity
          modifier: DECREASED
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
      selected_evidence:
        snippet: Exome sequencing did not identify any relevant variants in known disease-causing genes
          in the patients. Three different homozygous variants in CBLB were identified.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36006710
      reference_title: Immune dysregulation caused by homozygous mutations in CBLB.
      evidence_source: HUMAN_CLINICAL
      explanation: The gene-finding result that assigns the disease to CBLB, and the absence of a competing
        candidate in each exome.
