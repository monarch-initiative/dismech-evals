            term:
              id: MONDO:0957388
              label: autoimmune disease, multisystem, infantile-onset, 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cblb_second_requirement_for_autoimmunity
        prompt: What does a CBL-B-deficient mouse need, beyond the genotype, before it develops the autoimmune
          disease its human counterparts have?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Breakdown of Peripheral T Cell Tolerance
        - pathophysiology#Multi-organ Autoantibody Production and Autoimmune Tissue Injury
        rationale: 'The knock-in mouse built on the patient allele has the full cellular phenotype and
          no disease: healthy at one year, no organ infiltrate, no autoantibody excess. The complete null
          does develop multi-organ autoimmunity, but only in one of the two independently generated lines.
          So the step this entry draws from unrestrained effector T cells to autoimmune disease is demonstrated
          in one animal, absent in another with the patient''s own allele, and inconsistent between two
          nulls. The authors propose environment, microbiome and modifier genes, and name the experiment,
          cohousing with pet-store mice to supply common murine pathogens, without having done it. Until
          that is settled, the human disease''s dependence on a non-genetic second requirement is a hypothesis.'
        proposed_experiments:
        - experiment_id: cblb_knockin_pathogen_exposure
          experiment_design: TARGETED_PERTURBATION
          name: Expose Cblb H257L knock-in mice to common murine pathogens and follow for autoimmunity
          description: Cohouse knock-in mice with pet-store mice, alongside specific-pathogen-free knock-in
            and wild-type controls, and follow autoantibody titres, organ histology and endocrine function.
            The prediction under this entry's mechanism is that microbial exposure converts the cellular
            phenotype into autoimmune disease in the knock-in and not in the wild type.
          perturbations:
          - name: Microbial exposure by cohousing with pet-store mice
            target: pathophysiology#Breakdown of Peripheral T Cell Tolerance
          readouts:
          - name: Autoantibody titre and multi-organ histology after exposure
            target: pathophysiology#Multi-organ Autoantibody Production and Autoimmune Tissue Injury
            direction: INCREASED
            interpretation: Autoantibody and organ infiltration appearing in exposed knock-in mice but
              not in exposed wild-type mice would support the environmental second requirement.
          would_support:
          - pathophysiology#Breakdown of Peripheral T Cell Tolerance
          supporting_outcome:
          - Exposed knock-in mice develop autoantibodies and organ infiltration that specific-pathogen-free
            knock-ins and exposed wild-type mice do not.
          refuting_outcome:
          - Exposed knock-in mice remain disease-free, which would mean the allele's cellular phenotype
            does not reach autoimmunity in the mouse at all and that the human chain needs a different
            account.
          decision_criterion: Autoimmune disease in exposed knock-in mice, absent in both control arms.
      selected_evidence:
        snippet: Additional experiments, including cohousing with pet-store mice, will be utilized to
          explore the development of autoimmunity in CblbH257L mice.
        supports: SUPPORT
