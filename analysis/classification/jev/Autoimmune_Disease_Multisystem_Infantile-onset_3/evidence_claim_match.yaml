              label: autoimmune disease, multisystem, infantile-onset, 3
        context:
        - path: /genetic/0
          value:
            name: CBLB
            notes: 'CBLB at 3q13.11 encodes CBL-B, a RING-type E3 ubiquitin ligase of the Cbl family expressed
              in immune cells, which ubiquitinates proteins recruited to activated antigen and Fc receptors
              so that they are degraded. The three reported disease alleles hit three different parts
              of the protein: the SH2 binding subdomain of the substrate-binding tyrosine kinase binding
              domain, a truncation before the C-terminus, and the segment between the RING domain and
              the proline-rich region. Only the first two were characterised functionally.

              The gene also carries common susceptibility alleles for polygenic autoimmune disease, which
              is context rather than content for this entry: a Sardinian multiple sclerosis GWAS hit,
              rs9657904 (PMID:20453840), replicated in Italy (PMID:21037273); rs12487066, associated with
              lower CBL-B expression (PMID:25261476); and a type 1 diabetes association in Danish families
              (PMID:15629882). Those are associations with other diseases, not with this one, so they
              are recorded here and not as a susceptibility row.

              No gene_disease_validity assertion is recorded. ClinGen has not published a gene-disease
              validity classification for CBLB with this or any disease, so there is no external tier
              to copy; IUIS''s inclusion of the gene as a new recessive loss-of-function entity in its
              2024 update is a classification of the disease, not a validity tier for the pair.'
            gene_term:
              preferred_term: CBLB
              term:
                id: hgnc:1542
                label: CBLB
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
          role: ancestor
      assertion_type: Variant
      assertion:
        name: CBLB c.1392C>G p.C464W
        description: Homozygous in the third patient, with both parents heterozygous. The residue lies
          between the RING domain and the proline-rich region. Protein expression is intact and no further
          patient sample was available, so no functional consequence was measured; the region containing
          this residue is not in the Protein Data Bank, so it could not be modelled either. Its pathogenicity
          rests on homozygosity in an affected child, absence from population and in-house databases,
          and the T-cell phenotype shared with the other two patients.
        clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: The C464 residue is situated between the RING and PRR (Figure 1B). The region containing
          human CBL-B C464 is not available in the RCSB Protein Data Bank for modeling.
        supports: SUPPORT
