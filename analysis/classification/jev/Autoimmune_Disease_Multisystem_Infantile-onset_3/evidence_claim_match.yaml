        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autoimmune disease, multisystem, infantile-onset, 2
        description: 'The serially numbered sibling concept, and a different gene: ZAP70, with one hypomorphic
          and one activating allele in trans rather than biallelic loss of function. The numbering is
          a nosological accident and says nothing about shared mechanism, but the two sit at opposite
          ends of the same signalling axis — too little receptor-proximal kinase restraint here, too much
          kinase activity there — and both present as infantile autoimmunity without infectious susceptibility.
          The presentations differ: that disease is antibody-defined, with bullous pemphigoid and an acquired
          factor VIII inhibitor, reduced CD8 T cells, and it required transplantation, where this one
          is endocrine and cytopenic with normal lymphocyte counts. The genotype separates them.'
        disease_term:
          preferred_term: autoimmune disease, multisystem, infantile-onset, 2
          term:
            id: MONDO:0014861
            label: autoimmune disease, multisystem, infantile-onset, 2
      selected_evidence:
