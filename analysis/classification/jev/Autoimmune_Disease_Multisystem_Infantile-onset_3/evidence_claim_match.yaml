        description: 'Effector T cells that regulatory T cells cannot suppress. In the patient with p.H285L,
          CD4+CD25- effector cells resisted suppression by regulatory T cells from healthy controls, and
          her own circulating Treg percentage was below the control range. The knock-in mouse shows the
          complementary dissection: its Tregs suppress wild-type effector cells normally, while its effector
          cells resist suppression by wild-type Tregs, so the lesion is in the effector cell and not in
          the regulatory population. The same property has been produced by knocking CBLB out of primary
          human CD4+ T cells, and in Cbl-b-null mice it holds in vivo and in cells that are genuinely
          naive.'
        biological_scale: CELLULAR
        cell_types:
