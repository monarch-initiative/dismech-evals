            term:
              id: MONDO:0957388
              label: autoimmune disease, multisystem, infantile-onset, 3
        context: []
      assertion_type: Treatment
      assertion:
        name: Abatacept
        description: 'Tried in the first patient and ineffective. Abatacept is CTLA4-Ig and acts by blocking
          CD80/CD86-dependent costimulation, so its failure here is mechanistically coherent rather than
          merely disappointing: a T cell without CBL-B proliferates on receptor cross-linking alone, with
          the costimulation requirement already relaxed, so removing costimulation should not help. The
          source reports the trial and its outcome without offering that reading, and the inference is
          recorded in this description rather than as evidence.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
