            name: Biallelic CBLB Loss of Function
            description: Three distinct homozygous CBLB variants were found, one per family, and they
              damage the protein in three different ways. p.R496X truncates it and no product is detectable
              with an N-terminal antibody. p.H285L sits in the SH2 binding subdomain of the tyrosine kinase
              binding domain, the part of CBL-B that engages its substrates, and is expressed at about
              half the normal level. p.C464W, between the RING domain and the proline-rich region, leaves
              protein expression intact; no functional study of that allele was possible, so for it the
              loss of function is inferred from the clinical and genetic evidence rather than measured.
              None of the three variants is present in gnomAD v2.1.1 or in the sequencing laboratory's
              own 60,234-individual databank.
