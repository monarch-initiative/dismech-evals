      assertion_type: Definition
      assertion:
        name: Possible Autoimmune Encephalitis (Graus 2016)
        definition_type: CASE_DEFINITION
        description: Adult possible AE requires subacute progression in less than three months of working-memory
          deficit, altered mental status, or psychiatric symptoms; at least one new focal CNS finding,
          unexplained seizure, CSF pleocytosis, or MRI feature suggestive of encephalitis; and reasonable
          exclusion of other causes.
        criteria_sets:
        - name: Entry clinical syndrome
          core_clinical_characteristics:
          - preferred_term: Memory impairment
            term:
              id: HP:0002354
              label: Memory impairment
          - preferred_term: Altered mental status
            term:
              id: HP:0011446
              label: Abnormal mental status
          - preferred_term: Psychosis
            term:
              id: HP:0000709
              label: Psychosis
      selected_evidence:
        snippet: Because autoantibody test results and response to therapy are not available at disease
          onset, we based the initial diagnostic approach on neurological assessment and conventional
          tests that are accessible to most clinicians.
        supports: SUPPORT
    origin:
