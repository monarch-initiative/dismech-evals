        description: 'Achlorhydria removes the acid-mediated negative feedback on antral G cells, producing
          marked hypergastrinemia. Chronically elevated gastrin is trophic for enterochromaffin-like (ECL)
          cells in the corpus, driving ECL cell hyperplasia that can progress through dysplasia to type
          1 gastric neuroendocrine tumors.

          '
        cell_types:
        - preferred_term: antral G cell
          term:
            id: CL:0000508
            label: type G enteroendocrine cell
          modifier: INCREASED
        - preferred_term: enterochromaffin-like cell
          term:
            id: CL:0000504
            label: enterochromaffin-like cell
          modifier: INCREASED
      selected_evidence:
        snippet: tumorigenesis is mediated by gastrin's effects on the CCK2R-receptor on ECL-cells that
          in turn leads to hyperplasia, dysplasia, and finally neoplasia
        supports: SUPPORT
