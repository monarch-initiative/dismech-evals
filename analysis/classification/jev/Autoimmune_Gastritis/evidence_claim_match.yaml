  61baed4bcfdb57ace80ef87c3a9e5aabdf61ca98aa781d09834cb9b6923fec77:
    claim:
      about:
        disease:
          name: Autoimmune Gastritis
          disease_term:
            preferred_term: autoimmune gastritis
            term:
              id: MONDO:0031014
              label: autoimmune gastritis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: emerging_th17_effector_polarization
        hypothesis_label: Emerging Th17/IL-17 Effector Contribution
        status: EMERGING
        description: Human data show a gastric H+/K+ ATPase-specific Th17/IL-17 signature, and effector-transfer
          models show that Th1, Th2, and Th17 cells can each induce autoimmune gastritis with distinct
          pathology and differing susceptibility to regulatory T-cell suppression. Which effector arm
          dominates human disease, and whether it shifts over the disease course, is unresolved and carries
          therapeutic implications (e.g., anti-IL-17 blockade).
        notes: 'Two independent hypothesis-search runs concur on PARTIALLY SUPPORTED / retain EMERGING:
          a claude_code report (kb/hypotheses/Autoimmune_Gastritis/emerging_th17_effector_polarization/claude_code.md)
          and an openscientist report (same directory, openscientist.md). Both confirm a genuine Th17/IL-17
          contribution (H+/K+ ATPase-specific gastric IL-17A/F production in all eight AIG patients tested;
          94% of intrinsic-factor-reactive clones in a combined "Th17 or Th1" category; Th17 transfer
          gives the most severe, Treg-resistant gastritis in the TxA23 model). The openscientist run went
          on to propose a wholesale reframing of the effector mechanism - epithelial IL-17RA signaling
          as protective, IL-21 as the real pathogenic Th17-derived mediator, and anti-IL-17 blockade as
          contraindicated - and the codex assessment sidecar in the hypothesis directory rejects that
          reframing on its sources. The IL-17RA results come from gastrointestinal epithelial Il17ra deletion
          during H. pylori infection, not sterile autoimmune gastritis and not parietal-cell-specific
          deletion or apoptosis; the "increased autoantibody production" in Il17ra-deficient mice was
          in fact enhanced H. pylori-specific antibody, not anti-H+/K+ ATPase or anti-intrinsic-factor
          autoantibody; and no IL-21 perturbation has been carried out in AIG at all, so the IL-21 bridge
          remains an untested hypothesis. There is no human anti-IL-17 AIG study and no AIG animal experiment
          comparing IL-17 blockade with control, so protective IL-17 signaling in H. pylori infection
          and gastric carcinogenesis raises a real, unresolved safety question about anti-IL-17 therapy
          in AIG rather than establishing a contraindication. What survives: a Th17 contribution is real
          but its terminal tissue-damage mechanism is undetermined, direct IL-17A/F epithelial cytotoxicity
          is not established, STAT3 perturbation is a promising but pleiotropic and model-specific lead
          (PMID:40471463), Th1 remains the more extensively validated axis, and which arm dominates by
          disease stage is unresolved because all human evidence here is small and cross-sectional. The
          report''s candidate ontology block was not curated: CL:0000163 is endocrine cell (parietal cell
          is CL:0000162, already used above), GO:0032623 is interleukin-2 production rather than interleukin-21
          production, and its proposed MONDO identifiers resolve to unrelated disorders.'
      selected_evidence:
        snippet: Gastric LPMCs from all AIG patients, but not those from HCs, were activated by H+/K+-ATPase
          and were able to proliferate and produce high levels of IL-17A and IL-17F.
        supports: SUPPORT
