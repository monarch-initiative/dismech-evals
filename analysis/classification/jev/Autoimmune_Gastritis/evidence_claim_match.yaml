  2a5fb16ed5982dce191edeb06c730e1ef3a9e63916aae1dab56db1d8ddc1d992:
    claim:
      about:
        disease:
          name: Autoimmune Gastritis
          disease_term:
            preferred_term: autoimmune gastritis
            term:
              id: MONDO:0031014
              label: autoimmune gastritis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: alternative_hpylori_molecular_mimicry_origin
        hypothesis_label: Alternative H. pylori Molecular-Mimicry ("Hit-and-Run") Origin
        status: ALTERNATIVE
        description: Autoimmune gastritis is initiated by Helicobacter pylori infection via molecular
          mimicry between H. pylori antigens and the gastric H+/K+ ATPase, generating cross-reactive T-
          and B-cell responses that, through epitope spreading and bystander activation in a genetically
          susceptible host, become self-perpetuating autoimmunity and persist after the organism is cleared
          (established AIG is frequently H. pylori-negative). A corollary is that a subset of cases are
          reversible with early eradication. Causation in humans remains unproven and is the basis of
          a knowledge-gap discussion.
        notes: 'Two independent hypothesis-search runs concur on PARTIALLY SUPPORTED / UNRESOLVED: a claude_code
          report (kb/hypotheses/Autoimmune_Gastritis/alternative_hpylori_molecular_mimicry_origin/claude_code.md)
          and a deeper openscientist report (same directory, openscientist.md). H. pylori- to-H+/K+ ATPase
          cross-reactivity is documented at the T-cell level (cross-reactive gastric CD4 Th1 clones; urease
          beta-subunit homology; LPS Lewis-antigen mimicry; PMID:14568977), and active, not-yet-atrophic
          autoimmune corpus gastritis resolved after eradication in 64 of 80 patients in a retrospective,
          uncontrolled series (PMID:11549834). Neither result reaches the distinctive part of the hypothesis:
          reversibility achieved while the organism is being cleared is not evidence of a later self-perpetuating
          "hit-and-run" phase, and epitope spreading and persistence after clearance have no direct human
          evidence. The model is also refuted at the autoantibody level (antigastric autoantibodies do
          not absorb to H. pylori; PMID:10738313, PMID:11815766) and is non-general: H. pylori-naive AIG
          forms a distinct familial/autoimmune-enriched entity (ARIOSO n=1,598; PMID:38976374), and 29.3%
          of 75 atrophic autoimmune gastritis cases had no reactivity to any of 13 H. pylori antigens
          on multiplex serology (PMID:41484031). The wider "29-79% H. pylori-naive" range asserted by
          the openscientist report is not supported - its 21.1% figure was the proportion meeting a stringent
          multi-antigen positive cutoff, whose complement is not "no evidence of exposure", and its second
          source is not traceable in the report. Treg-depletion mouse models produce AIG with no infection,
          and some H. pylori-AIG associations may be inflated by diagnostic misclassification (urease-positive
          non-H. pylori bacteria overgrowing the achlorhydric stomach, shown in a referral series selected
          for repeated eradication failure, which cannot quantify bias in the wider literature). Retained
          ALTERNATIVE, best read as a subset-initiation mechanism whose full initiation-to-persistence
          sequence is unproven in humans. See the codex assessment sidecar in the hypothesis directory.'
      selected_evidence:
        snippet: a role for Helicobacter pylori as an infective trigger through molecular mimicry
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
