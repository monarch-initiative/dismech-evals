  1dbd483d41d20fb7a82a7ab2f2a84bb3c227fd32ce18fd23d63932249dbcb2db:
    claim:
      about:
        disease:
          name: Autoimmune Gastritis
          disease_term:
            preferred_term: autoimmune gastritis
            term:
              id: MONDO:0031014
              label: autoimmune gastritis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_th1_effector_polarization
        hypothesis_label: Canonical Th1/IFN-gamma Effector Polarization
        status: CANONICAL
        description: The effector arm driving parietal-cell destruction has classically been modeled as
          Th1/IFN-gamma-polarized, based on murine neonatal-thymectomy and TCR-transgenic effector-transfer
          systems specific for the H+/K+ ATPase.
        notes: 'Two independent hypothesis-search runs concur on PARTIALLY SUPPORTED: a claude_code report
          (kb/hypotheses/Autoimmune_Gastritis/canonical_th1_effector_polarization/claude_code.md) and
          an openscientist report (same directory, openscientist.md). Both retain Th1/IFN-gamma as foundational
          and real: human gastric H+/K+ ATPase-reactive CD4 clones are predominantly Th1 and cytotoxic
          via perforin/Fas-FasL (PMID:11159878, PMID:15763992), and IFN-gamma directly kills murine gastric
          epithelium in organoids and is required for atrophy and metaplasia in TxA23 mice (PMID:30511397).
          The causal perturbations are model-specific and are weaker than the openscientist report states:
          anti-IFN-gamma treatment in the neonatal-thymectomy model cut gastritis incidence from 69% to
          16% rather than abolishing disease (PMID:8766575), and in a transfer setting IFN-gamma-deficient
          T cells could still initiate mild disease (PMID:22777705). Neither run supports a Th1-exclusive
          model - it is one arm of a cooperative multi-cytokine / multi-cell-type program: CD8 T cells
          were the dominant IFN-gamma source in that polyclonal mouse model, IFN-gamma plus IL-17 are
          co-required for severe disease (PMID:22777705), and IL-13 acting through IL-4R-alpha is a separable
          required arm of the metaplastic transformation - though metaplasia was absent altogether in
          TxA23 x Ifng-/- mice, so IL-13 independence from IFN-gamma-associated atrophy across the whole
          trajectory is not established. The codex assessment sidecar in the hypothesis directory rejects
          two further readings carried by the report: that the PTPN22 pernicious-anemia risk variant wires
          patients toward Th1 over Th17 (this joins a PA GWAS locus association with Th1/Th17 phenotyping
          in genotyped healthy donors, and is a hypothesis rather than evidence about gastric polarization;
          the report also misstates the GWAS p value as 1.91e-10 rather than 1.91e-24), and that a null
          NK-depletion result rules out innate IFN-gamma sources. The intrinsic-factor-reactive pernicious-anemia
          compartment is mixed rather than Th17-dominant: the cited 94% is a combined "Th17 or Th1" figure
          (see emerging_th17_effector_polarization). Caveat: Th1 dominance is demonstrated most robustly
          in TCR-transgenic / monoclonal systems, which may overrepresent it relative to polyclonal disease,
          and all human immune data here are cross-sectional, so which effector population dominates over
          the human disease course is unresolved.'
      selected_evidence:
        snippet: The majority of the autoreactive T cell clones secreted IFN-gamma and showed a T helper
          1 (Th1) profile.
        supports: SUPPORT
    origin:
