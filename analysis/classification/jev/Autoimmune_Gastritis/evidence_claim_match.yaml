  2e2e256c3e42a5cc47715698b7c072d021c5bfddd85ac7607c9a698f01595fa0:
    claim:
      about:
        disease:
          name: Autoimmune Gastritis
          disease_term:
            preferred_term: autoimmune gastritis
            term:
              id: MONDO:0031014
              label: autoimmune gastritis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_primary_autoimmune_hk_atpase_origin
        hypothesis_label: Canonical Primary Autoimmunity Against the Gastric H+/K+ ATPase
        status: CANONICAL
        description: 'Autoimmune gastritis is a primary organ-specific autoimmune disease driven by a
          breakdown of self-tolerance to the parietal-cell H+/K+ ATPase (ATP4A/ATP4B), with CD4 T-cell-mediated
          parietal cell destruction that clinically tends to progress rather than remit. The tolerance
          defect implicates the beta subunit: although H/K-ATPase alpha-subunit (ATP4A) mRNA is expressed
          in the thymus, thymic expression alone does not tolerize the pathogenic T-cell repertoire, and
          in the murine neonatal-thymectomy system it is the beta subunit (ATP4B), absent from the thymus,
          whose transgenic thymic expression prevents disease - so ATP4B behaves as the dominant autoantigen
          in mice. Whether ATP4B-specific T cells likewise dominate the surviving human repertoire, or
          precede ATP4A reactivity, has not been demonstrated. The murine disease induced by neonatal
          thymectomy is T-cell-mediated, and monogenic tolerance defects (AIRE/APECED, FOXP3/IPEX) produce
          autoimmune gastritis as part of polyautoimmunity. Two independent hypothesis-search runs (see
          notes) concur that this primary/central-tolerance account is best treated as one of several
          candidate initiating pathways feeding a shared effector cascade, rather than as an infection-independent
          sole origin.'
        notes: 'Two independent hypothesis-search runs concur on PARTIALLY SUPPORTED: a claude_code report
          (kb/hypotheses/Autoimmune_Gastritis/canonical_primary_autoimmune_hk_atpase_origin/claude_code.md)
          and a deeper openscientist report (same directory, openscientist.md; 127 papers, 17 findings
          over 5 iterations). Both retain the CD4 T-cell / H+/K+ ATPase effector mechanism as CANONICAL
          but judge the etiological claim of a purely primary, infection-independent origin overstated.
          Each candidate initiating route is retained only at the evidence level it was actually demonstrated
          at: primary central-tolerance defect (murine neonatal thymectomy and transgenic thymic ATP4B;
          PMID:8393475), H. pylori molecular mimicry (human gastric T-cell cross-reactivity only; see
          alternative_hpylori_molecular_mimicry_origin), neonatal roseolovirus thymic disruption (experimental
          murine infection; not shown for human roseoloviruses), and peripheral checkpoint failure (anti-PD-1/anti-CTLA-4
          gastritis, supported by deeply phenotyped single cases, which cannot establish absence of host
          predisposition or identity with sporadic AIG). The codex assessment sidecar in the hypothesis
          directory rejects three of the openscientist run''s stronger readings: that one ATP4A-specific
          TCR is "necessary and sufficient" (the TxA23 experiment establishes sufficiency only; PMID:11449363),
          that a prospective progression cohort proves the autoimmune process is mechanistically self-sustaining
          regardless of trigger (clinical progression is not an immune-mechanism endpoint), and that PTPN22,
          HLA, ABO and IFIH1 form one confirmed AIG genetic architecture - PTPN22/HLA-DQB1/IL2RA/AIRE
          come from the pernicious-anemia GWAS (PMID:34145262) while ABO and IFIH1 come from a parietal-cell-antibody
          GWAS in a type 1 diabetes cohort, a different phenotype and sampling frame. The ATP4A/ATP4B
          tolerance correction flagged by both runs (alpha thymic expression does not tolerize; ATP4B
          is the thymus-absent dominant murine autoantigen) has been folded into the description above
          (PMID:16237067). The report''s candidate GO identifiers were not curated: GO:0006968 is cellular
          defense response, not central tolerance, and GO:0002513 is tolerance induction to self antigen,
          not a generic peripheral-tolerance term. Follow-up recommended by openscientist: split into
          separate CANONICAL effector and qualified etiological-trigger hypotheses, and add an upstream
          "incomplete central tolerance to ATP4B" node.'
      selected_evidence:
        snippet: We show that transgenic expression of the gastric H/K ATPase beta subunit specifically
          prevents the onset of autoimmune gastritis after neonatal thymectomy.
        supports: SUPPORT
