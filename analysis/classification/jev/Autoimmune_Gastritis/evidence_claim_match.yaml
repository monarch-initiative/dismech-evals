      reference_title: An autoimmune disease with multiple molecular targets abrogated by the transgenic
        expression of a single autoantigen in the thymus.
      evidence_source: MODEL_ORGANISM
      explanation: 'The loss-of-function experiment behind the beta-subunit tolerance claim: forcing thymic
        expression of ATP4B, which is normally absent from the thymus, prevents neonatal-thymectomy gastritis
        in mice. This establishes ATP4B as a major T-cell target and a central-tolerance target in the
        murine system; it says nothing about the relative size of the ATP4B- and ATP4A-reactive repertoires
        in humans.'
