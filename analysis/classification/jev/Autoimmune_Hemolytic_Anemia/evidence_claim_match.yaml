      reference_title: 'Inhibition of complement C1s improves severe hemolytic anemia in cold agglutinin
        disease: a first-in-human trial.'
      explanation: This first-in-human trial of C1s inhibition confirms the central role of classical
        complement pathway activation in cold agglutinin disease, where IgM binding triggers complement
        fixation leading to C3b opsonization and extravascular hemolysis.
