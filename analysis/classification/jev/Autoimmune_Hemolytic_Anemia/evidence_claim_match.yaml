              label: autoimmune hemolytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Warm Autoantibody-Mediated Hemolysis
        description: IgG autoantibodies coat red blood cells and are recognized by Fc receptors on splenic
          macrophages, leading to extravascular hemolysis through phagocytosis. Partial phagocytosis creates
          spherocytes with reduced membrane.
        cell_types:
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
        - preferred_term: Red Blood Cell
          term:
            id: CL:0000232
            label: erythrocyte
        biological_processes:
        - preferred_term: Phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
      selected_evidence:
        snippet: Tissue-resident macrophages in the spleen play a major role in the clearance of immunoglobulin
          G (IgG)-opsonized blood cells, as occurs in immune thrombocytopenia (ITP) and autoimmune hemolytic
          anemia (AIHA). Blood cells are phagocytosed via the Fc-γ receptors (FcγRs)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29692344
      reference_title: Red pulp macrophages in the human spleen are a distinct cell population with a
        unique expression of Fc-γ receptors.
      explanation: This study demonstrates that splenic red pulp macrophages express FcγRIIa and FcγRIIIa
        receptors and are responsible for phagocytosis of IgG-opsonized RBCs in AIHA, directly supporting
        the mechanism of extravascular hemolysis in warm AIHA.
