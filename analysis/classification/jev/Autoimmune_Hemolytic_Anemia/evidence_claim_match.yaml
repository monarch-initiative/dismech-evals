          term:
            id: CL:0002038
            label: T follicular helper cell
        notes: The cached CD4 T-cell review (DOI:10.5633/amm.2024.0108) was cross-checked against the
          primary murine study. The ratio change is not modeled as proven Tfr depletion or a universal
          human initiating lesion.
