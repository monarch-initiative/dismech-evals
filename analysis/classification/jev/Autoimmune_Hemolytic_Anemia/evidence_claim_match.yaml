      assertion_type: DifferentialDiagnosis
      assertion:
        name: Passenger lymphocyte syndrome
        description: Post-transplant alloimmune hemolysis can mimic AIHA.
        distinguishing_features:
        - Donor lymphocytes produce antibodies against recipient red-cell antigens absent from the donor.
          The transplant history and antibody specificity distinguish this alloimmune process.
      selected_evidence:
        snippet: It is feasible for donor lymphocytes that have been transferred to produce antibodies
          that are specific to RBC antigens in the recipient’s body but not present on the donor’s own
          red cells
        supports: SUPPORT
