  95faae231f25b8f29b8b11e5f52e67c6f20d75eda139515beda4c8867c079fdc:
    claim:
      about:
        disease:
          name: Autoimmune Hemolytic Anemia
          disease_term:
            preferred_term: Autoimmune Hemolytic Anemia
            term:
              id: MONDO:0020108
              label: autoimmune hemolytic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cold Agglutinin-Mediated Hemolysis
        description: IgM autoantibodies bind RBCs at low temperatures and activate complement. C3b-coated
          cells undergo extravascular hemolysis in the liver, or MAC formation causes intravascular hemolysis.
        biological_processes:
        - preferred_term: Complement Activation
          term:
            id: GO:0006956
            label: complement activation
      selected_evidence:
        snippet: Cold-antibody AIHA due to IgMs range from cold agglutinin syndrome (CAS) to cold agglutin
          disease (CAD). These are typically specific to the Ii blood group system, with the former (CAS)
          being polyclonal and the latter (CAD) being a more severe and monoclonal entity. The DAT in
          either case is positive only with C3d.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38673882
      reference_title: 'Autoimmune Hemolytic Anemias: Classifications, Pathophysiology, Diagnoses and
        Management.'
      explanation: This comprehensive review confirms that cold AIHA is mediated by IgM autoantibodies
        that activate the complement cascade, resulting in C3d deposition on RBCs and complement-mediated
        hemolysis.
