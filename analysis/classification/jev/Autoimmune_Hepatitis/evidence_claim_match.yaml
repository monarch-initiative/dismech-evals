      assertion_type: Pathophysiology
      assertion:
        name: Polygenic HLA-linked susceptibility
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Common germline variation creates a polygenic susceptibility rather than a Mendelian
          cause. HLA-DRB1*03:01 and *04:01 are major signals in European type-1-serology cohorts, while
          HLA-B*35:01 is the strongest signal in a Han Chinese cohort; these ancestry-dependent associations
          implicate antigen presentation. SH2B3 adds a non-HLA immune-signaling susceptibility signal.
        genes:
        - preferred_term: HLA-DRB1
          term:
            id: hgnc:4948
            label: HLA-DRB1
        - preferred_term: HLA-B
          term:
            id: hgnc:4932
            label: HLA-B
        - preferred_term: SH2B3
          term:
            id: hgnc:29605
            label: SH2B3
      selected_evidence:
        snippet: Analysis of this variant in the discovery cohort identified HLA-DRB1*0301 (P = 5.3 ×
          10(-49)) as a primary susceptibility genotype and HLA-DRB1*0401 (P = 2.8 × 10(-18)) as a secondary
          susceptibility genotype.
        supports: SUPPORT
    origin:
