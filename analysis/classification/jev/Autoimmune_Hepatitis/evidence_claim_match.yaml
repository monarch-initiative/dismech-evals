      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_budesonide_guideline_reversal
        prompt: Should budesonide remain represented as a current first-line corticosteroid option for
          AIH?
        kind: INTERPRETATION
        status: RESOLVED
        attaches_to:
        - treatments#Prednisone or prednisolone-based corticosteroid induction
        rationale: A 2010 randomized trial favored budesonide plus azathioprine in patients explicitly
          selected to have no cirrhosis, but the official 2025 EASL update no longer endorses budesonide
          because of safety and effectiveness concerns. Current representation must follow the newer guidance
          while preserving the historical trial boundary.
        resolved_date: '2026-07-21T00:00:00Z'
        resolution_note: Budesonide was removed from the current first-line treatment description; prednisone/prednisolone
          remain represented, and the older noncirrhotic trial is retained here for provenance.
      selected_evidence:
        snippet: We performed a 6-month, prospective, double-blind, randomized, active-controlled, multicenter,
          phase IIb trial of patients with AIH without evidence of cirrhosis who were given budesonide
          (3 mg, three times daily or twice daily) or prednisone (40 mg/d, tapered to 10 mg/d); patients
          also received azathioprine (1-2 mg/kg/d).
        supports: SUPPORT
