      assertion_type: Discussion
      assertion:
        discussion_id: gap_paired_liver_blood_single_cell_resolution
        prompt: Which immune states are reproducibly enriched in AIH liver tissue, and how do they relate
          to matched blood, disease activity, ancestry, and treatment response at donor level?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Liver-autoantigen-specific adaptive immune activation
        - pathophysiology#T-cell-mediated hepatocyte injury
        rationale: The public AIH single-cell dataset pools four donors per condition into two PBMC libraries.
          It cannot estimate donor heterogeneity and samples blood, not the injured liver. A multi-ancestry
          longitudinal study with paired liver and blood single-cell/spatial profiling is needed before
          peripheral monocyte or NK signatures are promoted to causal liver mechanisms.
      selected_evidence:
        snippet: We generated 3690 and 3511 single-cell transcriptomes of PBMCs pooled from 4 healthy
          controls (HCs) and 4 AIH patients, respectively, by scRNA-seq.
