      assertion_type: Treatment
      assertion:
        name: Mycophenolate mofetil immunosuppression
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        description: Mycophenolate mofetil (MMF) is a current first-line alternative to azathioprine and
          remains an option for intolerance or inadequate response. It is teratogenic and requires reproductive-risk
          counseling. The strongest direct comparison is a small 24-week, open-label adult trial, so long-term
          and broader-population comparative effectiveness remains less certain.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mycophenolate mofetil
            term:
              id: CHEBI:8764
              label: mycophenolate mofetil
      selected_evidence:
        snippet: Therapeutically, the updated guidelines introduce Mycophenolate mofetil as a viable and
          safe first-line alternative to azathioprine. It is now recognised for its comparable or even
          superior efficacy and reduced rate of adverse events. However, clinicians are cautioned about
          its teratogenic risks, particularly in patients of reproductive age.
        supports: SUPPORT
