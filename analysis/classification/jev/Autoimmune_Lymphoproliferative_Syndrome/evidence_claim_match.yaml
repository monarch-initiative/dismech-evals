  67071fae1ba0ab47721f914c5986627575fdd6ff8b373f4380a35b28dfe5e596:
    claim:
      about:
        disease:
          name: Autoimmune Lymphoproliferative Syndrome
          disease_term:
            preferred_term: autoimmune lymphoproliferative syndrome
            term:
              id: MONDO:0017979
              label: autoimmune lymphoproliferative syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Fas-Mediated Lymphocyte Apoptosis
        biological_scale: MOLECULAR
        role: trigger
        description: The initiating lesion in every genetically defined form of ALPS is loss of function
          somewhere in the FAS death receptor pathway — the receptor itself (FAS), its ligand (FASLG),
          or the downstream initiator caspase (CASP10). Engagement of Fas by FasL normally assembles a
          death-inducing signalling complex and triggers extrinsic apoptosis; in ALPS that signal fails.
          Most germline FAS variants act in a dominant-negative fashion, which is why heterozygosity suffices
          for FAS while FASLG generally requires biallelic loss.
        notes: 'CASP10 is bound on this node because the ALPS-CASP10 subtype places its lesion here, at
          the initiator-caspase step of the same pathway. That placement is contested: a 2024 functional
          study found FAS-mediated apoptosis intact in carriers with no detectable CASP10 protein. See
          the DISPUTED grading and the REFUTE evidence on the `CASP10` record in `genetic:`; the FAS and
          FASLG arms of this node are not affected by that dispute.'
        genes:
        - preferred_term: FAS
          term:
            id: hgnc:11920
            label: FAS
          modifier: LOSS_OF_FUNCTION
        - preferred_term: FASLG
          term:
            id: hgnc:11936
            label: FASLG
          modifier: LOSS_OF_FUNCTION
        - preferred_term: CASP10
          term:
            id: hgnc:1500
            label: CASP10
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: extrinsic apoptotic signaling pathway via death domain receptors
          term:
            id: GO:0008625
            label: extrinsic apoptotic signaling pathway via death domain receptors
          modifier: DECREASED
      selected_evidence:
        snippet: Loss-of-function FAS or FASLG mutations cause autoimmune-lymphoproliferative syndrome
          (ALPS) characterized by expanded double-negative T cells (DNT) and elevated serum biomarkers.
        supports: SUPPORT
