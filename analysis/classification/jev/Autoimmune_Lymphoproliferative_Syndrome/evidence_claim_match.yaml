      assertion:
        name: Failure of Lymphocyte Homeostasis and Accumulation of Autoreactive Cells
        biological_scale: CELLULAR
        role: central_effector
        description: Lymphocytes that should have been deleted persist. Two consequences follow and together
          define the syndrome. First, the surviving pool includes autoreactive clones, producing autoimmunity
          that is directed predominantly at blood cells rather than at solid organs. Second, a normally
          rare population of alpha-beta T cells that have lost both CD4 and CD8 expands markedly, because
          Fas-mediated deletion is precisely the route by which these cells are normally removed. That
          expansion is the diagnostic hallmark of ALPS rather than an incidental finding.
        biological_processes:
        - preferred_term: lymphocyte homeostasis
          term:
            id: GO:0002260
            label: lymphocyte homeostasis
          modifier: LOSS_OF_FUNCTION
        - preferred_term: activation-induced cell death of T cells
          term:
            id: GO:0006924
            label: activation-induced cell death of T cells
          modifier: DECREASED
      selected_evidence:
        snippet: The autoimmune lymphoproliferative syndrome (ALPS) is a non-malignant and non-infectious
          uncontrolled proliferation of lymphocytes accompanied by autoimmune cytopenia.
        supports: SUPPORT
