              label: autoimmune lymphoproliferative syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant (germline FAS, incomplete penetrance)
        description: 'Most ALPS is caused by a heterozygous germline FAS variant acting through a dominant-negative
          mechanism on the trimeric death receptor. Penetrance is markedly incomplete: healthy relatives
          frequently carry the same variant, which is why a second, somatic hit in the double-negative
          T-cell compartment is thought to be required for overt disease in many families.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: The ALPS-FAS was the first description of a monogenic cause of autoimmunity, but its
          non-Mendelian expression remained elusive until the description of somatic and germline mutations
          in ALPS patients.
        supports: SUPPORT
    origin:
