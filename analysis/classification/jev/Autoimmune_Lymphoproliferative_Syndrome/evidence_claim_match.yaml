        context: []
      assertion_type: Subtype
      assertion:
        name: ALPS-FASLG
        display_name: ALPS-FASLG (FAS ligand defect)
        classification: genetic
        description: Rare, and usually biallelic. Homozygous FASLG variants abolish FasL cytotoxicity
          and produce early-onset severe ALPS; heterozygous variants impair FasL function biochemically
          but generally do not produce the ALPS biomarker profile, so heterozygous loss of function is
          better tolerated for FASLG than for FAS. Bound to MONDO:0700306, whose label names an immunodeficiency
          rather than ALPS but which carries "ALPS-FASLG" as a synonym; see `notes:`.
        subtype_term:
          preferred_term: ALPS-FASLG
          term:
            id: MONDO:0700306
            label: FASLG-related immunodeficiency
        genes:
        - preferred_term: FASLG
          term:
            id: hgnc:11936
            label: FASLG
      selected_evidence:
        snippet: Heterozygous loss-of-function mutations are better tolerated for FASLG than for FAS,
          which may explain the low frequency of ALPS-FASLG.
        supports: SUPPORT
    origin:
