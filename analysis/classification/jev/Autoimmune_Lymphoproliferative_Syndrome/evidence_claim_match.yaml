      assertion_type: IUISAssignment
      assertion:
        classification_value: immune dysregulation
        notes: IUIS phenotypic classification, diseases of immune dysregulation (Table 4) — the group
          that contains ALPS and the ALPS-like disorders. Matches the classification already recorded
          on `FAS-related_Autoimmune_Lymphoproliferative_Syndrome.yaml`. ALPS presents as lymphoproliferation
          and autoimmunity from failed apoptotic control of the adaptive response, not as susceptibility
          to infection, which is what separates Table 4 from the deficiency tables. The somatic-FAS subtype
          (ALPS-sFAS) is listed by IUIS 2022 as a Table 10 phenocopy of inborn errors of immunity, so
          this Table 4 assignment rests on the germline forms.
      selected_evidence:
        snippet: The autoimmune lymphoproliferative syndrome (ALPS) is a non-malignant and non-infectious
          uncontrolled proliferation of lymphocytes accompanied by autoimmune cytopenia.
        supports: SUPPORT
