  30ca93c26dc816c43c0bfd77f4ce5c861839b7d4578318506a9887219a18b317:
    claim:
      about:
        disease:
          name: Autoimmune Lymphoproliferative Syndrome
          disease_term:
            preferred_term: autoimmune lymphoproliferative syndrome
            term:
              id: MONDO:0017979
              label: autoimmune lymphoproliferative syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: alps_scope_after_2009_reclassification
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Defective Fas-Mediated Lymphocyte Apoptosis
        prompt: Which ALPS-like disorders belong inside the ALPS concept, and which are separate diseases
          that merely share its phenotype?
        rationale: The 2009 NIH revision narrowed ALPS to defects of the Fas apoptosis pathway and moved
          several conditions that had carried ALPS type numbers out of the syndrome — caspase-8 deficiency
          (historically ALPS type IIb) and RAS-associated autoimmune leukoproliferative disease (historically
          ALPS type IV) are the clearest cases, PRKCD-related type 3 disease is a third, and CTLA4 haploinsufficiency
          and CD27 deficiency reach an ALPS-like phenotype without a Fas-pathway lesion at all. MONDO
          still carries several of these as descendants of `MONDO:0017979`, so the ontology and the clinical
          classification disagree. This entry follows the narrow Fas-pathway definition and binds only
          Fas-pathway subtypes, but the boundary is a curation decision rather than a settled fact, and
          it determines whether the KB's ALPS-like entries should be members here or siblings.
      selected_evidence:
        snippet: The related apoptosis defect accounts for the accumulation of autoreactive lymphocytes
          as well as for specific clinical and biological features that distinguish the ALPS-FAS from
          other monogenic defects of this apoptosis pathway, such as FADD and CASPASE 8 deficiencies.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29911256
      reference_title: The Autoimmune Lymphoproliferative Syndrome with Defective FAS or FAS-Ligand Functions.
      evidence_source: HUMAN_CLINICAL
      explanation: Explicitly distinguishes ALPS-FAS from other monogenic defects of the same apoptosis
