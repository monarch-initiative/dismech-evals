      assertion_type: Pathophysiology
      assertion:
        name: AIRE Deficiency and Thymic Tolerance Failure
        description: 'AIRE (autoimmune regulator) is a transcription factor expressed in medullary thymic
          epithelial cells (mTECs). It drives ectopic expression of tissue-restricted self-antigens (TRAs)
          in the thymus, enabling negative selection of autoreactive T cells. Loss-of-function mutations
          in AIRE abolish this promiscuous gene expression, allowing autoreactive T cells to escape thymic
          deletion and enter the periphery.

          '
        cell_types:
        - preferred_term: medullary thymic epithelial cell
          term:
            id: CL:0002365
            label: medullary thymic epithelial cell
        locations:
        - preferred_term: medulla of thymus
          term:
            id: UBERON:0002124
            label: medulla of thymus
        biological_processes:
        - preferred_term: T cell negative selection
          term:
            id: GO:0043383
            label: negative T cell selection
        - preferred_term: thymic T cell selection
          term:
            id: GO:0045061
            label: thymic T cell selection
        genes:
        - preferred_term: AIRE
          term:
            id: hgnc:360
            label: AIRE
      selected_evidence:
        snippet: Aire-deficient thymic medullary epithelial cells showed a specific reduction in ectopic
          transcription of genes encoding peripheral antigens.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
