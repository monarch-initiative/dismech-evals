        display_name: Type 2 (Schmidt syndrome)
        description: Adult/polygenic syndrome centered on primary adrenal insufficiency with autoimmune
          thyroid disease and/or type 1 diabetes. HLA and immune-regulatory alleles modify risk but are
          not sufficient causes.
        subtype_term:
          preferred_term: autoimmune polyendocrinopathy type 2
          term:
            id: MONDO:0010012
            label: autoimmune polyendocrinopathy type 2
      selected_evidence:
        snippet: SPA type 2 presents with Addison's disease, type 1 diabetes, or autoimmune thyroid disease.
          Multiple genes have been implicated, including those of the class II major histocompatibility
          complex.
        supports: SUPPORT
