        prompt: For each component endocrinopathy, which autoantibodies are predictive or diagnostic biomarkers,
          and which—if any—directly mediate tissue injury rather than marking a T-cell-driven response?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - biochemical#Organ-specific endocrine autoantibodies
        - pathophysiology#Organ-Specific Autoreactive T-Cell Effector Injury
        rationale: Collapsing all autoantibodies into one destructive mechanism overstates evidence and
          obscures the functionally distinct APS-1 anti-cytokine antibodies. Antigen-, organ-, and stage-specific
          longitudinal studies are needed to separate prediction from effector causality.
        proposed_experiments:
        - experiment_id: exp_aps_component_antibody_tcell_longitudinal
          name: Prospective paired autoantibody and autoreactive T-cell study
          description: Enroll antibody-positive patients before gland failure and repeatedly measure antibody
            titer/function, antigen-specific CD4/CD8 repertoires, gland-function tests, and clinical conversion.
            Test whether antibody changes add causal or predictive information beyond T-cell responses.
          experiment_type:
            preferred_term: prospective longitudinal immune-phenotyping study
          decision_criterion: Distinguish biomarkers that only correlate with conversion from antibodies
            whose functional activity independently precedes and predicts tissue injury.
      selected_evidence:
        snippet: Autoantibodies to the various endocrine and non-endocrine tissues not only offer a diagnostic
          clue to the autoimmune nature of diseases but also can be used to identify asymptomatic individuals
          who are at risk
        supports: SUPPORT
