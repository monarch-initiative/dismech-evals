        context: []
      assertion_type: Subtype
      assertion:
        name: Type 1
        display_name: Type 1 (APS-1/APECED)
        description: Monogenic, usually childhood-onset autoimmune polyendocrinopathy caused by biallelic
          AIRE deficiency. Chronic mucocutaneous candidiasis, hypoparathyroidism, and adrenal insufficiency
          form the classic triad. A separate disease entry contains the detailed APECED phenotype and
          management model; here APS-1 is retained to connect it to the broader umbrella.
        subtype_term:
          preferred_term: autoimmune polyendocrine syndrome type 1
          term:
            id: MONDO:0009411
            label: autoimmune polyendocrine syndrome type 1
      selected_evidence:
        snippet: APS type 1 presents with hypoparathyroidism, mucocutaneous candidiasis and Addison's
          disease. It is caused by AutoImmune Regulator (AIRE) gene mutation.
        supports: SUPPORT
