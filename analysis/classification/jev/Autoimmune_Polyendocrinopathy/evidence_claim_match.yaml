      assertion_type: Pathophysiology
      assertion:
        name: AIRE-Dependent Central Tolerance Failure
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: In APS-1, biallelic AIRE deficiency reduces thymic display of tissue-restricted self-antigens
          by medullary thymic epithelial cells. Failed negative selection permits self-reactive T cells
          to leave the thymus and seed a lifelong multiorgan autoimmune repertoire. This initiating lesion
          is specific to type 1 and is not generalized to adult polygenic types 2-4.
        genes:
        - preferred_term: AIRE
          term:
            id: hgnc:360
            label: AIRE
        cell_types:
        - preferred_term: medullary thymic epithelial cell
          term:
            id: CL:0002365
            label: medullary thymic epithelial cell
        biological_processes:
        - preferred_term: central T cell tolerance induction
          term:
            id: GO:0002512
            label: central T cell tolerance induction
          modifier: DECREASED
        - preferred_term: negative T cell selection
          term:
            id: GO:0043383
            label: negative T cell selection
          modifier: DECREASED
      selected_evidence:
        snippet: Aire-deficient thymic medullary epithelial cells showed a specific reduction in ectopic
          transcription of genes encoding peripheral antigens.
        supports: SUPPORT
    origin:
