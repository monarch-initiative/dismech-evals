        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: phenocopy of IEI
        notes: IUIS 2022 phenotypic classification of inborn errors of immunity (Tangye et al., PMID:35748970),
          Table 10 "Phenocopies of inborn errors of immunity", second section, "Associated with autoantibodies".
          The row is entered under the bare name "Pulmonary alveolar proteinosis" with the presumed pathogenesis
          given as autoantibody to GM-CSF, and its similar-PID column names CSF2RA deficiency. The bare
          row name is the trap here. IUIS is describing the anti-GM-CSF autoantibody disease, which is
          this entry, and not the hereditary receptor disease, which dismech curates separately as Hereditary_Pulmonary_Alveolar_Proteinosis
          and which sits in IUIS Table 5 (congenital defects of phagocyte number or function) as CSF2RA
          and CSF2RB deficiency. The two are the phenocopy and its germline counterpart, so only this
          entry takes the phenocopy value. The row's opportunistic-infection column (cryptococcal meningitis,
          disseminated nocardiosis) is the clinical reason IUIS treats the acquired form as an immunodeficiency
          at all, rather than as a purely respiratory disease.
      selected_evidence:
        snippet: Pulmonary alveolar proteinosis AutoAb to GM-CSF Normal Normal Normal
        supports: SUPPORT
