              id: MONDO:0012579
              label: autoimmune pulmonary alveolar proteinosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_apap_hla_association_replication
        prompt: Is the HLA-DRB1*08:03 association with aPAP generalizable beyond the Japanese population,
          or is the MHC contribution to aPAP risk ancestry-specific?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Immune Tolerance to GM-CSF
        rationale: The only genome-wide significant genetic signal reported for aPAP comes from a single-ancestry
          Japanese study of 198 cases and 395 controls. Because aPAP occurs in individuals of all races
          and geographic regions at a similar prevalence, an ancestry-restricted MHC risk allele would
          imply either population-specific genetic architecture or a modest effect that smaller non-Japanese
          cohorts are underpowered to detect. The distinction matters for whether MHC class II presentation
          of GM-CSF is a general mechanism of tolerance loss in this disease or one of several routes
          to the same autoantibody endpoint.
        proposed_experiments:
        - experiment_id: exp_apap_multiancestry_hla_finemapping
          name: Multi-ancestry HLA fine-mapping in non-Japanese aPAP cohorts
          description: Assemble non-Japanese aPAP cohorts of sufficient size to detect an odds ratio near
            5 at HLA-DRB1*08:03 and perform HLA imputation and fine-mapping to test whether the MHC class
            II signal replicates outside Japan.
        - experiment_id: exp_apap_hla_autoantibody_titre_correlation
          name: HLA-DRB1*08:03 carriage versus anti-GM-CSF autoantibody concentration
          description: In non-Japanese patients, test whether HLA-DRB1*08:03 carriage predicts anti-GM-CSF
            autoantibody concentration, which would support the allele acting through the magnitude of
            the autoantibody response independently of ancestry.
      selected_evidence:
        snippet: Here, we conducted a genome-wide association study of aPAP in 198 patients and 395 control
          participants of Japanese ancestry.
        supports: SUPPORT
