  eeca195f5d931e1fd006e32675e0723540f8f69e91329e8b3cf74a1ed58bbb21:
    claim:
      about:
        disease:
          name: Autoimmune Pulmonary Alveolar Proteinosis
          disease_term:
            preferred_term: autoimmune pulmonary alveolar proteinosis
            term:
              id: MONDO:0012579
              label: autoimmune pulmonary alveolar proteinosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_apap_autoantibody_mediated_animal_model
        prompt: Does any available animal model reproduce the autoimmune arm of aPAP - the breakdown of
          tolerance to GM-CSF and sustained endogenous autoantibody production - rather than only the
          downstream GM-CSF-signaling loss modelled by Csf2 and Csf2rb knockouts?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Immune Tolerance to GM-CSF
        - pathophysiology#GM-CSF Neutralization and Functional GM-CSF Deficiency
        rationale: 'The standard model systems for PAP are germline knockouts of GM-CSF or its receptor,
          which faithfully reproduce the surfactant-clearance and foamy-macrophage phenotype but begin
          downstream of the autoimmune lesion: they model hereditary, not autoimmune, PAP. The one experiment
          that does reproduce the autoimmune arm - passive transfer of purified patient-derived GM-CSF
          autoantibody into macaques - is a passive-transfer challenge in a non-human primate, not a self-sustaining
          model of tolerance breakdown, and it does not recapitulate the HLA-DRB1*08:03-associated origin
          of the autoantibody response. Consequently, therapies aimed at the upstream autoimmune trigger
          (B-cell depletion, tolerance induction) cannot be evaluated preclinically in the way that surfactant-clearance
          therapies can, which is a concrete translational limitation rather than merely an unexplored
          question.'
        proposed_experiments:
        - experiment_id: exp_apap_induced_autoimmunity_model
          name: Active-immunization or humanized-HLA model of endogenous anti-GM-CSF autoimmunity
          description: Develop a model in which endogenous anti-GM-CSF autoantibody production is induced
            and sustained rather than passively transferred, so that tolerance-directed therapies can
            be evaluated preclinically. Confirm that autoantibody rises above the reported critical threshold
            and that alveolar surfactant accumulation and foamy alveolar macrophages follow.
        - experiment_id: exp_apap_hla_drb1_0803_transgenic_challenge
          name: HLA-DRB1*08:03 transgenic GM-CSF immunization challenge
          description: Immunize HLA-DRB1*08:03 transgenic mice with GM-CSF and determine whether the risk
            allele permits breakdown of tolerance and development of alveolar surfactant accumulation,
            directly testing the MHC class II presentation hypothesis implied by the human GWAS.
      selected_evidence:
        snippet: Together, these results show that GM-CSF autoantibodies reproduce the pathologic manifestations
          of idiopathic pulmonary alveolar proteinosis and provide strong evidence of causality in human
          idiopathic pulmonary alveolar proteinosis
        supports: SUPPORT
    origin:
