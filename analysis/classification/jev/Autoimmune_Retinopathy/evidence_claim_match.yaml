  bbe704f6c57372fdcd4b4fba924ecc4ca375ea09a6d272468e3c3f839311b8b7:
    claim:
      about:
        disease:
          name: Autoimmune Retinopathy
          disease_term:
            preferred_term: Autoimmune Retinopathy
            term:
              id: MONDO:0100014
              label: autoimmune retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Anti-Retinal Antibody Production via Molecular Mimicry
        description: In CAR, tumor cells aberrantly express retinal proteins (most prominently recoverin/
          RCVRN) or proteins sharing epitopes with retinal antigens, and the resulting immune response
          drives B-cell production of anti-retinal IgG autoantibodies (molecular mimicry). The exact mechanisms
          by which ocular immune privilege breaks down and self-tolerance is lost remain unknown. In MAR,
          melanoma cells express TRPM1 (transient receptor potential cation channel subfamily M member
          1), which is also expressed in retinal ON-bipolar cells; the resulting anti-TRPM1 antibodies
          disrupt bipolar-cell signaling. In nonparaneoplastic AIR (npAIR), the inciting trigger is unknown
          but similar anti-retinal autoantibodies arise without detectable malignancy, possibly in association
          with concurrent systemic autoimmune disease.
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: CD4-positive T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: humoral immune response
          term:
            id: GO:0006959
            label: humoral immune response
          modifier: INCREASED
        - preferred_term: humoral immune response mediated by circulating immunoglobulin
          term:
            id: GO:0002455
            label: humoral immune response mediated by circulating immunoglobulin
          modifier: INCREASED
      selected_evidence:
        snippet: AIR comprises a group of rare autoimmune disorders causing retinal degeneration, characterized
          by rapid vision deterioration linked to circulating anti-retinal autoantibodies (ARAs).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40824502
      reference_title: 'Diagnosis and treatment of autoimmune retinopathy: review of current approaches.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes circulating anti-retinal autoantibodies as the defining pathogenic feature
        common to all AIR subtypes.
