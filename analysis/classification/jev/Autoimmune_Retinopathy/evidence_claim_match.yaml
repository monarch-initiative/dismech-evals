          lung cancer, gynecological tumors, or breast cancer) in which tumor antigens that share epitopes
          with retinal proteins elicit anti-retinal antibodies, leading to photoreceptor degeneration.
      selected_evidence:
        snippet: The aberrant expression of recoverin in cancer cells and the presence of autoantibodies
          against recoverin are essential for the occurrence of cancer-associated retinopathy, which finally
          results in the apoptosis of photoreceptor cells.
        supports: SUPPORT
