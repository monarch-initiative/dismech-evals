          disease_term:
            preferred_term: Autoimmune Retinopathy
            term:
              id: MONDO:0100014
              label: autoimmune retinopathy
        context:
        - path: /pathophysiology/1
          value:
            name: Photoreceptor and Bipolar Cell Injury by Autoantibodies
            description: Anti-retinal autoantibodies penetrate the outer retina and cause cell-type-specific
              injury. In CAR, anti-recoverin antibodies target recoverin, the calcium-binding protein
              that normally controls rhodopsin phosphorylation by inhibiting rhodopsin kinase, and their
              presence culminates in photoreceptor apoptosis. Anti-alpha-enolase antibodies are also among
              the most commonly detected autoantibodies in CAR. In MAR, anti-TRPM1 antibodies enter ON-bipolar
              cells and block TRPM1 channel function, producing a characteristic electronegative ERG.
              The result is progressive, largely irreversible photoreceptor and inner retinal neuronal
              loss that clinically mimics inherited retinal dystrophies.
            locations:
            - preferred_term: retina
              term:
                id: UBERON:0000966
                label: retina
            cell_types:
            - preferred_term: retinal rod cell
              term:
                id: CL:0000604
                label: retinal rod cell
            - preferred_term: retinal cone cell
              term:
                id: CL:0000573
                label: retinal cone cell
            - preferred_term: retinal ON bipolar cell
              term:
                id: CL:0000749
                label: ON-bipolar cell
            biological_processes:
            - preferred_term: photoreceptor apoptosis
              term:
                id: GO:0051402
                label: neuron apoptotic process
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Nyctalopia
        causal_link_type: DIRECT
        description: Preferential rod photoreceptor or ON-bipolar cell injury causes night blindness.
      selected_evidence:
        snippet: Cancer-associated retinal ON bipolar cell dysfunction (CARBD), which includes melanoma-associated
          retinopathy (MAR), has been reported to be caused by autoantibodies against the molecules expressed
          in ON bipolar cells, including TRPM1.
        supports: SUPPORT
