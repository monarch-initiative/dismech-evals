              label: autoimmune retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Photoreceptor and Bipolar Cell Injury by Autoantibodies
        description: Anti-retinal autoantibodies penetrate the outer retina and cause cell-type-specific
          injury. In CAR, anti-recoverin antibodies target recoverin, the calcium-binding protein that
          normally controls rhodopsin phosphorylation by inhibiting rhodopsin kinase, and their presence
          culminates in photoreceptor apoptosis. Anti-alpha-enolase antibodies are also among the most
          commonly detected autoantibodies in CAR. In MAR, anti-TRPM1 antibodies enter ON-bipolar cells
          and block TRPM1 channel function, producing a characteristic electronegative ERG. The result
          is progressive, largely irreversible photoreceptor and inner retinal neuronal loss that clinically
          mimics inherited retinal dystrophies.
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        - preferred_term: retinal ON bipolar cell
          term:
            id: CL:0000749
            label: ON-bipolar cell
        biological_processes:
        - preferred_term: photoreceptor apoptosis
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: AIRs are a group of inflammatory conditions affecting the retina characterized by progressive
          unexplained visual loss, abnormalities and contraction in visual fields, photoreceptor and electroretinographic
          dysfunction, and the presence of circulating anti-retinal antibodies.
        supports: SUPPORT
