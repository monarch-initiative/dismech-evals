          value:
            name: Anti-Retinal Antibody Production via Molecular Mimicry
            description: In CAR, tumor cells aberrantly express retinal proteins (most prominently recoverin/
              RCVRN) or proteins sharing epitopes with retinal antigens, and the resulting immune response
              drives B-cell production of anti-retinal IgG autoantibodies (molecular mimicry). The exact
              mechanisms by which ocular immune privilege breaks down and self-tolerance is lost remain
              unknown. In MAR, melanoma cells express TRPM1 (transient receptor potential cation channel
              subfamily M member 1), which is also expressed in retinal ON-bipolar cells; the resulting
              anti-TRPM1 antibodies disrupt bipolar-cell signaling. In nonparaneoplastic AIR (npAIR),
              the inciting trigger is unknown but similar anti-retinal autoantibodies arise without detectable
              malignancy, possibly in association with concurrent systemic autoimmune disease.
            locations:
            - preferred_term: retina
              term:
                id: UBERON:0000966
                label: retina
