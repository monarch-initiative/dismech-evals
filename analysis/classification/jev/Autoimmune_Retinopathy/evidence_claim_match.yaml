        name: Abnormal Electroretinogram
        description: Electroretinography (ERG) characteristically shows reduced or extinguished responses.
          In CAR, both scotopic (rod) and photopic (cone) responses are diminished. In MAR, there is a
          distinctive electronegative ERG with reduced b-wave amplitude at preserved a-wave, reflecting
          selective ON-bipolar cell dysfunction. ERG and anti-retinal antibody testing are reported in
          over 80% of npAIR publications, making ERG the most widely used diagnostic tool.
        phenotype_term:
          preferred_term: Abnormal electroretinogram
          term:
            id: HP:0000512
            label: Abnormal electroretinogram
        reports_on:
        - target: Photoreceptor and Bipolar Cell Injury by Autoantibodies
          relationship: READOUT_OF
          endpoint_context: DIAGNOSTIC
          interpretation: Loss of photoreceptor and bipolar cell function reduces ERG amplitudes; MAR
            produces a distinctive electronegative waveform.
      selected_evidence:
        snippet: Functional changes were detected in 14 of 16 (87.5%) eyes on GVF, 15 of 16 (93.7%) eyes
          on MP, and 11 of 16 (68.7%) eyes on full-field electroretinogram (ff-ERG). Multifocal electroretinogram
          (mf-ERG) and visual evoked potential (VEP) tests were performed in 14 eyes, of which 12 (85.7%)
          and 14 (100%) of the eyes demonstrated functional abnormalities, respectively, at baseline.
        supports: SUPPORT
