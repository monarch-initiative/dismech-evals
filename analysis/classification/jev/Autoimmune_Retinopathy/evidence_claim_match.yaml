          preferred_term: Melanoma-Associated Retinopathy
          term:
            id: MONDO:0023868
            label: melanoma associated retinopathy
        description: Autoimmune retinopathy arising in patients with cutaneous or uveal melanoma. Melanoma
          cells express antigens cross-reactive with bipolar cell antigens (principally TRPM1), leading
          to autoantibodies that impair retinal ON-bipolar cell signaling and cause night-blindness and
          shimmering photopsias.
      selected_evidence:
        snippet: Cancer-associated retinal ON bipolar cell dysfunction (CARBD), which includes melanoma-associated
          retinopathy (MAR), has been reported to be caused by autoantibodies against the molecules expressed
          in ON bipolar cells, including TRPM1.
        supports: SUPPORT
