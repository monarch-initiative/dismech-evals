        description: Autoimmune retinopathy occurring without an identifiable underlying malignancy. Similar
          anti-retinal autoantibodies arise spontaneously, possibly in association with concurrent systemic
          autoimmune disease. npAIR tends to affect younger patients and females more often than the paraneoplastic
          variants. Diagnosis requires exclusion of occult malignancy and inherited retinal dystrophy.
      selected_evidence:
        snippet: Non-paraneoplastic AIR patients may be younger on average than paraneoplastic AIR patients
          and may have a higher likelihood of being female and having a history of autoimmune disease.
        supports: SUPPORT
