      assertion_type: EpidemiologyInfo
      assertion:
        name: Reported-case frequency
        description: Population prevalence has not been established. The literature began with one three-member
          p.A634D family and one patient with mosaic p.S703I. A later forward- and reverse-genetics study
          described 59 heterozygous variant carriers, but ascertainment included genotype-first biobank
          participants and does not mean that all 59 had clinically penetrant AIIDE.
        notes: The disorder is best treated as ultra-rare; no incidence or population prevalence estimate
          is available.
      selected_evidence:
        snippet: Here, we use forward and reverse genetics to identify 59 individuals harboring one of
          four heterozygous JAK1 variants.
        supports: SUPPORT
