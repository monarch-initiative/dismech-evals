            mechanism_confidence: ESTABLISHED
            description: Hyperactive JAK1 increases phosphorylation of STAT1 and STAT3 both at baseline
              and after cytokine stimulation. Patient-derived B cells show increased IFN-alpha-induced
              STAT1 phosphorylation, and primary CD3+ T cells show enhanced IL-6-induced STAT3 phosphorylation
              in a time- and dose-dependent manner. Across the broader JAK1-variant cohort, the variants
              confer hyperactive baseline and cytokine-induced STAT phosphorylation and elevated baseline
              interferon-stimulated gene (ISG) expression, acting predominantly through cis-activation;
              the mosaic S703I variant is in addition neomorphic, transactivating partner JAKs independent
              of its own catalytic domain. Transcriptomic analysis converges on IL-4, IL-13, and interferon
              signaling as the dysregulated core, driving a Th2-skewed immune phenotype. Pharmacologic
              JAK inhibition reduces this excess STAT phosphorylation.
