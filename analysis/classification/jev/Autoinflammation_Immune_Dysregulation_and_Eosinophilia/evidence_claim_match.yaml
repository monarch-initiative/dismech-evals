      assertion_type: Pathophysiology
      assertion:
        name: Constitutive JAK-STAT pathway activation
        conforms_to: jak_stat_pathway_activation#Constitutive STAT Activation and Nuclear Translocation
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Hyperactive JAK1 increases phosphorylation of STAT1 and STAT3 both at baseline and
          after cytokine stimulation. Patient-derived B cells show increased IFN-alpha-induced STAT1 phosphorylation,
          and primary CD3+ T cells show enhanced IL-6-induced STAT3 phosphorylation in a time- and dose-dependent
          manner. Across the broader JAK1-variant cohort, the variants confer hyperactive baseline and
          cytokine-induced STAT phosphorylation and elevated baseline interferon-stimulated gene (ISG)
          expression, acting predominantly through cis-activation; the mosaic S703I variant is in addition
          neomorphic, transactivating partner JAKs independent of its own catalytic domain. Transcriptomic
          analysis converges on IL-4, IL-13, and interferon signaling as the dysregulated core, driving
          a Th2-skewed immune phenotype. Pharmacologic JAK inhibition reduces this excess STAT phosphorylation.
        genes:
        - preferred_term: JAK1
          term:
            id: hgnc:6190
            label: JAK1
        cell_types:
        - preferred_term: T cell
          term:
            id: CL:0000084
            label: T cell
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: T-helper 2 cell
          term:
            id: CL:0000546
            label: T-helper 2 cell
        biological_processes:
        - preferred_term: JAK-STAT signaling
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
          modifier: INCREASED
        - preferred_term: tyrosine phosphorylation of STAT protein
          term:
            id: GO:0007260
            label: tyrosine phosphorylation of STAT protein
          modifier: INCREASED
        - preferred_term: type I interferon-mediated signaling
          term:
            id: GO:0060337
            label: type I interferon-mediated signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Genetic mutations and polymorphisms are functionally relevant to a variety of human diseases,
          especially cancer and immune-related conditions.
        supports: SUPPORT
