          with the row''s hyperactive-JAK1 functional defect and eosinophilia/eosinophilic enteritis features
          matching this entry''s phenotypes. Distinct from autosomal recessive JAK1 loss-of-function deficiency,
          which the same IUIS update places in Table 6; the gene alone does not determine the table.'
