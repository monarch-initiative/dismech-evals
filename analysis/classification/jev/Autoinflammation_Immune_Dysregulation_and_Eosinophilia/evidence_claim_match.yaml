      assertion_type: Pathophysiology
      assertion:
        name: JAK1 gain-of-function and loss of autoinhibition
        conforms_to: jak_stat_pathway_activation#Constitutive JAK Kinase Activation
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'The prototypic JAK1 p.A634D substitution lies in the inhibitory pseudokinase (JH2)
          domain, at a residue highly conserved across species and within the aC helix. In the resting
          state the JH2 domain restrains the adjacent kinase (JH1) domain; the A634D change relieves this
          autoinhibition and yields constitutively active JAK1 without altering JAK1 mRNA or protein expression.
          The same residue is recurrently mutated as a somatic gain-of-function event in lymphoid malignancy,
          independently establishing its activating nature. Activating germline variants are not confined
          to the pseudokinase domain: a post-zygotic mosaic pseudokinase variant (S703I) and germline
          variants spanning all four JAK1 domains (FERM E139K, SH2 R506C, pseudokinase S700N, kinase V985I)
          are also gain-of-function, indicating multiple routes to constitutive JAK1 activation.'
        genes:
        - preferred_term: JAK1
          term:
            id: hgnc:6190
            label: JAK1
        biological_processes:
        - preferred_term: positive regulation of JAK-STAT signaling
          term:
            id: GO:0046427
            label: positive regulation of receptor signaling pathway via JAK-STAT
          modifier: INCREASED
      selected_evidence:
        snippet: We describe a patient with early-onset multi-organ immune dysregulation resulting from
          a mosaic, gain-of-function mutation (S703I) in JAK1, encoding a kinase essential for signaling
          downstream of >25 cytokines.
        supports: SUPPORT
