      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Classic and mosaic severe JAK1 gain-of-function disease causes congenital or early-childhood
          multisystem inflammation, growth failure, severe dermatitis, tissue eosinophilia, and potentially
          organ failure. The p.S703I case developed refractory membranous nephropathy requiring transplantation
          and later hemodialysis. Burden is more variable in the broader JAACD spectrum.
      selected_evidence:
        snippet: Kidney transplantation was performed at age 11, but MN recurred within 1 year, followed
          by antibody-mediated rejection, requiring subsequent hemodialysis.
        supports: SUPPORT
    origin:
