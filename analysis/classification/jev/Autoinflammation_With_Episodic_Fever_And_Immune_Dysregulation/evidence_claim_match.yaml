      assertion:
        discussion_id: sharpin_mouse_human_skin_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does the Sharpin-deficient cpdm mouse develop severe chronic proliferative dermatitis
          while human SHARPIN-deficient patients have no dermatological disease?
        attaches_to:
        - animal_models#Sharpin-deficient (cpdm) mouse
        - pathophysiology#Sensitization to TNF-Induced Cell Death
        rationale: The cpdm mouse is defined by its skin phenotype, driven by TNF-dependent keratinocyte
          death, and decades of LUBAC cell-death biology rest on it. The two reported human SHARPIN-deficient
          patients, by contrast, had autoinflammation and immunodeficiency with no skin involvement, and
          the patient skin biopsy showed no inflammation. The TNF-driven cell-death mechanism appears
          conserved, so the mismatch is in which tissues manifest it, which bears on how far the mouse
          skin literature can be read onto the human disease.
      selected_evidence:
        snippet: In mice, the loss of Sharpin leads to severe dermatitis due to excessive keratinocyte
          cell death. Here, we report two individuals with SHARPIN deficiency who manifest autoinflammatory
          symptoms but unexpectedly no dermatological problems.
        supports: SUPPORT
