          D324V; also neighbouring L321 and D324 substitutions) prevent caspase-8 from cleaving RIPK1
          at this site, which separates the kinase domain from the intermediate and death domains.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: GAIN_OF_FUNCTION
          allele_type: SNV
          zygosity: HETEROZYGOUS
        genes:
        - preferred_term: RIPK1
          term:
            id: hgnc:10019
            label: RIPK1
      selected_evidence:
        snippet: the heterozygous missense mutations D324N, D324H and D324Y prevent caspase cleavage of
          RIPK1 in humans and result in an early-onset periodic fever syndrome and severe intermittent
          lymphadenopathy
        supports: SUPPORT
