    evidence_metadata:
      reference: PMID:40922878
      reference_title: 'A 14-Year-Old Male Patient With Bone Marrow Failure Syndrome, Without Deafness,
        Caused by a Novel SRP72 Mutation Inherited From His Father: A Case Report.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Evidences the non-constancy asserted in this phenotype''s description: a genetically
        confirmed patient tested with normal hearing. Graded SUPPORT, not REFUTE. `supports` is claim-relative
        in principle, but it is consumed - `hpoa_export` maps REFUTE to the HPOA `NOT` qualifier, which
        asserts the phenotype is excluded from the disease, and that is false here and contradicts the
        positive row from the IUIS classification. Incomplete penetrance belongs in the frequency column,
        and genuine absence would be `frequency: EXCLUDED` instead.'
