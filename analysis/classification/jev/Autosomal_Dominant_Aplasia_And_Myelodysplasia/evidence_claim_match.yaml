        prompt: The Srp72+/- mouse has no haematological disorder, while heterozygous SRP72 variants cause
          marrow failure in humans. Is the mouse a poor model of the human lesion, or is reduced SRP72
          dosage genuinely not the human mechanism?
        attaches_to:
        - animal_models#Srp72 heterozygous null mouse
        - pathophysiology#SRP72 Deficiency
        rationale: Evidence exists in the model and its translational validity is the open question, which
          is what distinguishes this from a plain KNOWLEDGE_GAP. The two readings have different consequences.
          If the mouse is simply the wrong construct - a null allele where the human alleles make a misassembling
          protein - then the human lesion is allele-specific and a knock-in of a human variant should
          reproduce it. If instead dosage really is insufficient in both species, the human phenotype
          needs a second factor, which would also help explain the unaffected carriers. The decisive experiment
          is a knock-in of a human SRP72 allele rather than a null.
      selected_evidence:
        snippet: The Srp72+/- mouse model only partially recapitulates the phenotype observed in families
          with inherited SRP72 lesions.
        supports: SUPPORT
        directness: DIRECT
