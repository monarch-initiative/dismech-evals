  4902ddf35aa8849a13583df228baf7065471f739190aefe9e3f1118cd157ad8d:
    claim:
      about:
        disease:
          name: Autosomal Dominant Aplasia and Myelodysplasia
          disease_term:
            preferred_term: autosomal dominant aplasia and myelodysplasia
            term:
              id: MONDO:0013851
              label: autosomal dominant aplasia and myelodysplasia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: srp72-molecular-lesion
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the molecular lesion in SRP72 bone marrow failure differ by allele class - the missense
          variants acting through a misassembling subunit that interferes with the particle, and the frameshift
          and splice variants through simple loss of function - or does one mechanism explain them all?
        attaches_to:
        - pathophysiology#SRP72 Deficiency
        - genetic#SRP72
        rationale: 'The evidence pulls both ways, and the likeliest reconciliation is that the answer
          is allele-dependent.

          Against simple haploinsufficiency, for the founding missense alleles: the mutant proteins mislocalize
          and one fails to associate with 7SL RNA, which is an assembly defect rather than a reduced dose.
          The dosage-only mouse points the same way - halving Srp72 produces no haematological disorder
          at all, so if dose alone were the lesion the model should be sick and is not.

          For loss of function, in a different allele class: the later reported variants are a frameshift
          whose in-vitro study is reported as loss of function, and a splice variant producing a premature
          termination codon. Those are the alleles a haploinsufficiency model fits.

          So the question is no longer "which single mechanism", but whether the missense and truncating
          alleles reach the same phenotype by different routes. Deciding it needs the missense subunit
          tested against particles containing wild-type SRP72 - the experiment nobody has reported. This
          is exactly why `functional_impact_category` is left unset on `genetic#SRP72`: the slot takes
          one value per variant context, and this entry curates the gene rather than the individual alleles,
          so any single value would erase the split the evidence suggests.'
      selected_evidence:
        snippet: This is predicted to result in a frameshift variant (p.Leu502ValfsTer14), which alters
          the amino acids and derives a premature termination codon.
        supports: SUPPORT
        directness: DIRECT
