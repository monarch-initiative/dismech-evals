            preferred_term: autosomal dominant aplasia and myelodysplasia
            term:
              id: MONDO:0013851
              label: autosomal dominant aplasia and myelodysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SRP72 Deficiency
        biological_scale: MOLECULAR
        description: 'A heterozygous germline SRP72 variant leaves the signal recognition particle without
          normal SRP72 function. The IUIS classification names the entity "SRP72-deficiency", which is
          the name used for this node.

          The node is deliberately NOT named haploinsufficiency. "Deficiency" in a classification table
          says a functional deficit exists; it does not say the deficit is a halved dose of an otherwise
          normal subunit, and the primary data argue against that reading: transfected mutant SRP72 mislocalizes
          within the cell, and one of the two variants fails to associate normally with the particle''s
          essential 7SL RNA. Both point at a defect in incorporating SRP72 into an assembled particle
          rather than at reduced gene dosage, and a variant that misassembles could act on the particle
          rather than merely be absent from it. The `Srp72+/-` mouse is the complementary argument: halving
          the dose in mice produces no haematological disorder (see `animal_models`). Which lesion operates
          is still open - see the `srp72-molecular-lesion` discussion - so `functional_impact_category`
          is left unset on the `genetic` block, because every value it could take would assert a distinction
          the evidence does not yet settle.'
        genes:
        - preferred_term: SRP72
          term:
            id: hgnc:11303
            label: SRP72
      selected_evidence:
        snippet: Transfection of these sequences into mammalian cells suggested that these proteins localize
          incorrectly within the cell.
        supports: SUPPORT
        directness: DIRECT
    origin:
