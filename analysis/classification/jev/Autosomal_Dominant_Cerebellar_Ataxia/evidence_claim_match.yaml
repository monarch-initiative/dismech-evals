        context: []
      assertion_type: AnimalModel
      assertion:
        name: BAC-ATXN2-Q72 transgenic mouse
        species: Mouse
        background: FVB;B6 hybrid background
        genotype: Human ATXN2 BAC with 72 CAG repeats
        publication: PMID:28405024
        description: The BAC model expresses expanded ATXN2 across multiple neuronal tissues and has slower
          disease progression than the Purkinje-directed Q127 model. ASO7 reduces ATXN2 and improves motor
          behavior; a separate delayed-treatment cohort shows firing recovery when injected more than
          12 weeks after motor onset.
        notes: The late-treatment result is physiological recovery, not direct evidence that established
          neuron loss or all behavioral deficits were reversed at that late stage. Normalized Purkinje
          protein levels and mRNA changes do not establish one serial transcription-to-firing mechanism.
          The Methods and extended weight caption differ in stated BAC dosing; no unique dosing regimen
          is inferred here.
        modeled_mechanisms:
        - target: Expanded Polyglutamine Protein
          relationship: RECAPITULATES
          limitations: Transgene context is more extensive but does not reproduce every aspect of human
            disease.
          description: Models expanded human ATXN2 in a BAC genomic context.
          model_scale: MOLECULAR
        - target: Reduced Purkinje Cell Firing
          relationship: RECAPITULATES
          limitations: No isolated manipulation of firing or neuronal replacement was performed.
          readouts:
          - name: Late-treatment firing recovery
            description: Purkinje physiology was assessed 10 weeks after treatment at 30 weeks.
            target: Reduced Purkinje Cell Firing
          description: Firing frequency is restored in acute slices after delayed treatment.
          model_scale: CELLULAR
        - target: Cerebellar Network Dysfunction
          relationship: RECAPITULATES
          limitations: Motor and delayed physiological experiments have different treatment schedules;
            their results must not be pooled into a late-onset motor-rescue claim.
          description: ASO-treated mice have improved but incomplete motor recovery.
          model_scale: ORGANISM
      selected_evidence:
        snippet: BAC-ATXN2-Q72 (BAC-Q72) mice were created using a contiguous 169 kb human ATXN2 gene
          sequence including 16 kb upstream ATXN2 sequence, the entire ATXN2-[CAG]72 coding region (with
          introns) and 3 kb of ATXN2 3’-UTR and downstream sequence.
        supports: SUPPORT
