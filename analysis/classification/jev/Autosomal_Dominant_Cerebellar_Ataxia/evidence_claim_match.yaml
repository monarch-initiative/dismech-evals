      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        description: 'Autosomal dominant transmission is characteristic. Each child of a heterozygous
          affected parent has a 50% probability of inheriting the disease allele, with clinical risk modified
          by penetrance and repeat structure. An apparently negative family history can reflect late onset,
          reduced penetrance, an unrecognized affected relative, de novo variation or parental mosaicism.
          Anticipation occurs in several unstable-repeat disorders but is not universal: SCA6 generally
          lacks anticipation and it is infrequent in SCA17.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: hereditary ataxia has a 50% chance of inheriting the
        supports: SUPPORT
