      - /treatments/0
    evidence_metadata:
      reference: PMID:40906249
      reference_title: 'Long-Term Effects of Annual Intensive Rehabilitation in Patients with Hereditary
        Pure Cerebellar Ataxia: A 7-year Follow-up Study.'
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: The seven-person retrospective cohort cannot establish a causal effect on long-term
        disease progression.
