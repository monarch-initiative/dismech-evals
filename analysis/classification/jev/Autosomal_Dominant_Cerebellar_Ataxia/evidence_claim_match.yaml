              label: autosomal dominant cerebellar ataxia
        context: []
      assertion_type: Treatment
      assertion:
        name: Physical rehabilitation and mobility support
        description: Individualized balance, gait and strength training, mobility aids and fall-prevention
          adaptations support function. Goals and intensity depend on impairment and safety; rehabilitation
          is not established as a cure or proof of slowed molecular degeneration. A 62-person assessor-masked
          trial found greater SARA improvement with aerobic than dose-matched balance training; 43 participants
          had genetically confirmed SCA and the remainder had idiopathic ataxia or MSA-C. Selection required
          ambulatory function and safe cycling. This supports functional rehabilitation, not subtype-specific
          neuroprotection. In a separate uncontrolled seven-person SCA6/SCA31 cohort, annual intensive
          rehabilitation accompanied relative pre-session SARA stability through year six, while balance
          declined earlier; six-month follow-up SARA worsened from year three. Absence of a concurrent
          control prevents attributing long-term disease slowing to that regimen.
        action_category: THERAPEUTIC
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Physical Therapy
          term:
            id: NCIT:C15302
            label: Physical Therapy
      selected_evidence:
        snippet: PT (balance exercises, gait training, muscle strengthening) to maintain mobility &#x00026;
          function
        supports: SUPPORT
