        description: Specialist-directed 4-aminopyridine may provide symptomatic benefit in selected FGF14-associated
          downbeat-nystagmus or ataxia presentations. Evidence includes retrospective open-label responses
          and a four-person post hoc genotype subgroup from an earlier crossover trial. All four received
          active drug first, and phase baselines differed; larger randomized trials are needed. Disease
          modification and family-wide benefit are not established.
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: 4-aminopyridine
            term:
              id: CHEBI:34385
              label: 4-aminopyridine
      selected_evidence:
        snippet: the benefits reported herein need validation in a larger randomised placebo-controlled
          trial.
        supports: SUPPORT
