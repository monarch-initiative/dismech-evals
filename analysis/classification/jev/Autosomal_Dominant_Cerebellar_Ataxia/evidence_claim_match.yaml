      assertion_type: ClinicalTrial
      assertion:
        name: NCT05002218
        status: COMPLETED
        description: Single-center assessor-masked randomized comparison of home aerobic versus balance
          training in 62 selected ambulatory adults with mixed cerebellar ataxias, including 43 genetically
          confirmed SCAs. At six months, the between-group SARA effect favored aerobic training by 1.53
          points (95% CI 0.61–2.44 in the direction of improvement). Training support stopped after six
          months; 11/62 participants had dropped out by one year. Adherence subgroup comparisons were
          not randomized, missing-at-random assumptions limit inference, and structural MRI results were
          not reported in this paper.
        phase: NOT_APPLICABLE
      selected_evidence:
        snippet: The inferences from analyses with missing data are valid under the missing-at-random
          assumption (ie, the missing mechanism does not depend on the value of the unobserved outcome),
          which is not testable in this study.
        supports: SUPPORT
