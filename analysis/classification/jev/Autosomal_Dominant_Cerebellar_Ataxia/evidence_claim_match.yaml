        context:
        - path: /treatments/0
          value:
            name: Physical rehabilitation and mobility support
            description: Individualized balance, gait and strength training, mobility aids and fall-prevention
              adaptations support function. Goals and intensity depend on impairment and safety; rehabilitation
              is not established as a cure or proof of slowed molecular degeneration. A 62-person assessor-masked
              trial found greater SARA improvement with aerobic than dose-matched balance training; 43
              participants had genetically confirmed SCA and the remainder had idiopathic ataxia or MSA-C.
              Selection required ambulatory function and safe cycling. This supports functional rehabilitation,
              not subtype-specific neuroprotection. In a separate uncontrolled seven-person SCA6/SCA31
              cohort, annual intensive rehabilitation accompanied relative pre-session SARA stability
              through year six, while balance declined earlier; six-month follow-up SARA worsened from
              year three. Absence of a concurrent control prevents attributing long-term disease slowing
              to that regimen.
            action_category: THERAPEUTIC
            therapeutic_modality: BEHAVIORAL
            treatment_term:
              preferred_term: Physical Therapy
              term:
                id: NCIT:C15302
                label: Physical Therapy
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Progressive cerebellar ataxia
        treatment_effect: MODULATES
        description: Symptomatic intervention addresses the functional manifestation; it is not evidence
          of reversal of the underlying genetic lesion.
      selected_evidence:
        snippet: Additionally, the absence of a control group prevents direct comparison with the natural
          history of the condition
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0/target_mechanisms/0
      evidence_path: /treatments/0/target_mechanisms/0/evidence/3
      context_paths:
      - /name
