      assertion_type: AnimalModel
      assertion:
        name: Purkinje-directed ATXN2-Q127 transgenic mouse
        species: Mouse
        background: B6;D2 hybrid background
        genotype: Pcp 2-driven full-length human ATXN2 with 127 CAG repeats
        publication: PMID:28405024
        description: The SCA2 model develops motor impairment and reduced Purkinje-cell firing. Intracerebroventricular
          ASO7 begun around motor-phenotype onset lowers human ATXN2 and partly lowers endogenous mouse
          Atxn2, improving rotarod performance. Subsequent acute-slice recordings show restoration of
          firing.
        notes: Cell-restricted transgene expression and a very long repeat differ from typical human heterozygosity.
          The study demonstrates preclinical target engagement and functional rescue, not human efficacy,
          a cure, lifespan extension in these SCA2 cohorts or recovery of lost neurons. Electrophysiological
          cell counts are nested within only one to four mice per genotype.
        modeled_mechanisms:
        - target: Expanded Polyglutamine Protein
          relationship: RECAPITULATES
          limitations: Overexpression, promoter and repeat length constrain generalization to other polyglutamine
            disorders.
          description: Expresses expanded human ATXN2 in Purkinje cells.
          model_scale: MOLECULAR
        - target: Reduced Purkinje Cell Firing
          relationship: RECAPITULATES
          limitations: The assay is ex vivo; ASO lowers multiple downstream abnormalities and does not
            isolate firing as the necessary mediator of behavioral rescue.
          readouts:
          - name: Purkinje firing frequency
            description: Reduced baseline firing approaches wild-type values after ASO7.
            target: Reduced Purkinje Cell Firing
          description: Mutant physiology is measured in acute slices after animal treatment.
          model_scale: CELLULAR
        - target: Cerebellar Network Dysfunction
          relationship: RECAPITULATES
          limitations: Rotarod is a functional surrogate rather than a complete measure of human ataxia.
          description: Motor performance improves after ATXN2 lowering.
          model_scale: ORGANISM
      selected_evidence:
        snippet: Pcp2-ATXN2-Q127 (ATXN2-Q127) transgenic mice express the full-length human ATXN2-[CAG]127
          cDNA under the control of the mouse Purkinje cell protein 2 (L7) promoter (Pcp2).
        supports: SUPPORT
