      assertion_type: Diagnosis
      assertion:
        name: Molecular testing that detects repeat expansions
        description: Testing must detect the relevant expansion classes as well as sequence and copy-number
          variants. The 2025 recommendations favor comprehensive testing, ideally genome sequencing with
          validated short-tandem-repeat sizing, sometimes complemented by repeat-primed PCR or long-read
          sequencing. A dedicated expansion panel followed by genome testing is an alternative. Standard
          sequence-only panels or exomes may miss expansions; familial targeted testing can be appropriate.
      selected_evidence:
        snippet: The initial genetic test ordered should be as comprehensive as possible, include the
          most ataxia‐relevant genes, and reliably detect pathogenic repeat expansions.
        supports: SUPPORT
