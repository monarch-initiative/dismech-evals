              with torticollis caused by TGM6 variants encoding transglutaminase 6. The gene-disease relationship
              is disputed: reported pathogenic TGM6 variants are far more frequent in population databases
              than the prevalence of all dominant SCAs combined, and in a large sequencing series the
              allele frequency of deleterious TGM6 variants did not differ between SCA patients and controls.
              This row records the MONDO concept and its nominal gene while carrying the refuting evidence;
              the binding should not be read as settled.'
