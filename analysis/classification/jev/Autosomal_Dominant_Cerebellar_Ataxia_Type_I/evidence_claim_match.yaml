      assertion_type: Pathophysiology
      assertion:
        name: Transcriptional Dysregulation
        description: 'Several ADCA-I proteins act in the nucleus: TBP is a core general transcription
          factor and expanded ataxin-1 reorganizes native transcriptional regulator complexes (e.g., with
          CIC and RBM17), skewing gene-expression programs required for Purkinje-cell homeostasis. Transcriptional
          dysregulation is a shared nuclear mechanism among the polyglutamine ADCA-I subtypes; subtype-specific
          molecular detail is left for follow-up curation of the individual subtype entries. One non-polyglutamine
          subtype also belongs here: CAMTA1, mutated in the nonprogressive congenital ataxia that Orphanet
          classifies under ADCA-I, encodes a calmodulin-binding transcription activator.'
        genes:
        - preferred_term: CAMTA1
          term:
            id: hgnc:18806
            label: CAMTA1
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        biological_processes:
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
        locations:
        - preferred_term: cerebellar cortex
          term:
            id: UBERON:0002129
            label: cerebellar cortex
      selected_evidence:
        snippet: neurodegenerative disease caused by a CAG repeat expansion in the TATA-box binding protein
          gene (TBP)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
