        association: SCA35 TGM6 variants (gene-disease relationship disputed)
        presence: Positive
        subtype: SCA35
        notes: Two independent population-genetic studies argue against TGM6 causation of SCA35, and the
          ClinGen gene-disease validity download (read 2026-09-23) contains no TGM6 record at all. The
