      assertion_type: Definition
      assertion:
        name: Harding type I clinical definition
        definition_type: CASE_DEFINITION
        description: A dominantly inherited cerebellar ataxia in which ataxia occurs with one or more
          additional neurologic signs. The class is defined clinically and spans multiple molecularly
          distinct spinocerebellar ataxias.
      selected_evidence:
        snippet: Type I autosomal dominant cerebellar ataxia (ADCA) is a type of spinocerebellar ataxia
          (SCA) characterized by ataxia with other neurological signs, including oculomotor disturbances,
          cognitive deficits, pyramidal and extrapyramidal dysfunction, bulbar, spinal and peripheral
          nervous system involvement.
        supports: SUPPORT
