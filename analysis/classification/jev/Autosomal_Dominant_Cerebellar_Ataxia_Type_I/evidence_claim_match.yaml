    evidence_metadata:
      reference: PMID:30532692
      reference_title: Complexity of the Genetics and Clinical Presentation of Spinocerebellar Ataxia
        17.
      evidence_source: HUMAN_CLINICAL
      explanation: In the representative ADCA-I subtype SCA17 the causative gene is TBP, the TATA-box
        binding protein — the general RNA polymerase II transcription initiation factor. A polyglutamine-encoding
        CAG expansion in TBP places the disease lesion directly within the core transcription machinery,
        mechanistically grounding transcriptional dysregulation as a shared nuclear ADCA-I mechanism.
