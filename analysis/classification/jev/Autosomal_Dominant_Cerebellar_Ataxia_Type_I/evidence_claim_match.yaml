  be19ced5b0f37b4e98ffd1df2e0d35a01dc0c9508c248e5854aa06af4dd4ae7c:
    claim:
      about:
        disease:
          name: Autosomal Dominant Cerebellar Ataxia Type I
          disease_term:
            preferred_term: Autosomal dominant cerebellar ataxia type I
            term:
              id: MONDO:0019792
              label: autosomal dominant cerebellar ataxia type I
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Molecularly heterogeneous dominant lesions
        description: ADCA-I is unified by a dominant ataxia-plus phenotype, not by one proximal lesion.
          Coding polyglutamine expansions, other coding or noncoding repeat expansions, and conventional
          sequence or copy-number variants initiate distinct molecular cascades that converge on cerebellar
          and variably extracerebellar neurodegeneration.
      selected_evidence:
        snippet: 'Type I ADCA can be further divided based on the proposed pathogenetic mechanism into
          3 subclasses: subclass 1 includes type I ADCA caused by CAG repeat expansions such as SCA1-SCA3,
          SCA17, and DRPLA, subclass 2 includes trinucleotide repeat expansions that fall outside of the
