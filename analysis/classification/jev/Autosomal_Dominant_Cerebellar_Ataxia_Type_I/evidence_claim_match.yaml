        name: Misfolded Protein Aggregation and Proteostatic Stress
        description: Expanded polyglutamine ataxin-1, ataxin-2, and TBP adopt aberrant conformations and
          form nuclear and cytoplasmic inclusions. Sequestration of chaperones, ubiquitin-proteasome and
          autophagy components, and interacting partners progressively impairs neuronal proteostasis,
          contributing to Purkinje-cell and brainstem-neuron dysfunction. This proteostatic stress is
          a convergent downstream consequence of the polyglutamine subtypes and is described mechanistically
          here without an independent ADCA-I-specific quantitative claim.
        cell_types:
