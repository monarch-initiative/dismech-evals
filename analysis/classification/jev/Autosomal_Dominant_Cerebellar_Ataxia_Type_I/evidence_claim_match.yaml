        description: 'This branch includes noncoding repeat expansions with RNA-mediated or repeat-associated
          mechanisms and coding repeats that yield non-polyglutamine proteins. SCA4 is now known to arise
          from a coding GGC expansion in ZFHX3; the resulting polyglycine protein aggregates and abnormal
          autophagy provide a concrete example. The branch does not imply that all noncoding repeat diseases
          share the SCA4 mechanism. Two further ADCA-I subtypes belong here: SCA12 arises from a CAG expansion
          outside the PPP2R2B coding sequence, and SCA37 from an (ATTTC)n pentanucleotide insertion in
          a noncoding region of DAB1.'
