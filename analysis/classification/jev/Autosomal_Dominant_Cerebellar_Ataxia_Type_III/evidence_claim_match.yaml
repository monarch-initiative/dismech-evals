        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sca6_channel_function_versus_proteotoxicity
        prompt: How much of SCA6 pathogenesis is caused by altered intrinsic Cav2.1 channel function versus
          polyglutamine proteotoxicity, ER-stress decompensation, and secondary membrane hyperexcitability?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#CACNA1A Polyglutamine Proteotoxicity and ER-Stress Decompensation
        rationale: Xenopus-oocyte work suggested beta4-dependent enhanced channel activation and excessive
          calcium entry. Knock-in Purkinje-neuron recordings instead found unchanged current density and
          voltage dependence, and the 2026 age-series study attributed abnormal spiking to ER-stress-induced
          store-operated calcium current rather than Cav2.1 ion flux. The entry therefore represents proteotoxicity
          and ER-stress evidence without assigning a directional CACNA1A transport defect.
      selected_evidence:
        snippet: These findings suggest the possibility that SCA6 is a channelopathy, and that the underlying
          mutation in SCA6 causes Purkinje cell degeneration through excessive entry of calcium ions.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
