          name: Autosomal dominant Charcot-Marie-Tooth disease type 2K
          disease_term:
            preferred_term: Autosomal dominant Charcot-Marie-Tooth disease type 2K
            term:
              id: MONDO:0020558
              label: autosomal dominant Charcot-Marie-Tooth disease type 2K
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt2k_atypical_respiratory_case
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How often does objectively confirmed respiratory or laryngeal nerve dysfunction occur
          in dominant GDAP1 neuropathy?
        attaches_to:
        - phenotypes#Respiratory Failure
        - phenotypes#Dysphonia
        rationale: One severe R120W report describes hypercapnic respiratory failure and dysphonia, but
          lists a single allele while calling it compound heterozygous. Vocal-cord involvement was probable
          without documented laryngoscopy, and phrenic injury was inferred. The international dominant-family
          series reported hoarseness without laryngoscopic confirmation. These observations justify symptom-directed
          assessment but do not establish a common phenotype or a distinct molecular branch.
      selected_evidence:
        snippet: We did not observe vocal fold involvement in this study; patient CMT-1124.03 presented
