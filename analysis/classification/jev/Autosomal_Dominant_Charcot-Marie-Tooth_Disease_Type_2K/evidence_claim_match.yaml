              label: autosomal dominant Charcot-Marie-Tooth disease type 2K
        context:
        - path: /experimental_models/3
          value:
            name: Dominant GDAP1 patient fibroblast redox and respiration study
            experimental_model_type: PRIMARY_CELL_CULTURE
            publication: PMID:31655048
            description: 'Six patient lines came from two unrelated families: three C240Y and three R120W.
              Available lines and controls varied by assay. Complex-I-substrate respiration and ATP synthesis
              were lower in both groups, but direct complex I enzyme and oxidative-stress abnormalities
              were clearest in C240Y. Complex I assembly and NDUFB8 abundance were preserved; SIRT1/NRF1
              abundance decreased without a mediation experiment. Resveratrol treatment for 48 hours improved
              pooled complex I activity at 25 micromolar; 10 micromolar had no significant effect and
              50 micromolar was antiproliferative. No clinical benefit or universal GST-domain severity
              rule was demonstrated.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced Mitochondrial Complex I Activity
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: C240Y fibroblasts had reduced complex I enzyme activity.
        limitations: Only two families; R120W enzyme-activity reduction was nonsignificant. No isogenic
          correction.
        readouts:
        - name: Complex I enzymatic activity
          target: Reduced Mitochondrial Complex I Activity
          direction: DECREASED
          interpretation: C240Y fibroblasts had reduced complex I enzyme activity.
      selected_evidence:
        snippet: CI enzymatic activity was about 50% lower in the p. C240Y fibroblasts compared to controls
          (Fig. 1a, p=0.01), while only reduced by 30% in the p.R120W fi broblasts (Fig. 1a, p=0.09).
        supports: SUPPORT
        directness: DIRECT
