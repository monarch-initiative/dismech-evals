          relatives can carry a dominant allele. Exclude acquired neuropathies and other hereditary neuropathies,
          particularly when progression is unusually rapid.
      selected_evidence:
        snippet: Disease onset varied widely, ranging from childhood to late adulthood. Walking difficulties
          were the most common initial symptoms. Disease progression was slow and as a rule patients remained
          ambulatory. Four patients (CMT-129.03, CMT-129.07, CMT-1060.01, and CMT-1130.03) required an
          ankle foot orthosis; patient CMT-1058.01 became wheelchair-dependent at the age of 61 years.
