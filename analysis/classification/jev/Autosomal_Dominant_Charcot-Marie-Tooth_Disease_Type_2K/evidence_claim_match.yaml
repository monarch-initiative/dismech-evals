            experimental_model_type: IPSC_DERIVED_MODEL
            publication: PMID:34440148
            description: Motor neurons from one homozygous Ser194Ter CMT2H patient were compared with
              two unrelated controls. Lower GDAP1 mRNA/protein, perturbed cristae and increased MitoSOX
              signal were observed; significance for MitoSOX was reached versus one control only. ATP
              content was not significantly different, which does not establish normal respiratory flux.
              Lower DAPI cell yield occurred during differentiation, and electron-dense structures were
              suspected rather than confirmed lipid droplets. Nonsense-mediated decay and apoptosis were
              proposed without direct demonstration. This is a recessive comparison model with no isogenic
              rescue.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Increased Mitochondrial Reactive Oxygen Species
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: CELLULAR
        description: The recessive patient culture shares a ROS-related endpoint with some dominant cell
          models.
        limitations: One recessive donor and two unrelated controls; not a model of dominant fusion interference.
          Significance depends on the control comparison.
        readouts:
        - name: Motor-neuron MitoSOX signal
          target: Increased Mitochondrial Reactive Oxygen Species
          direction: INCREASED
          interpretation: The recessive patient culture shares a ROS-related endpoint with some dominant
            cell models.
      selected_evidence:
        snippet: As expected, and shown in Figure 12, in patient’s MNs, superoxide anion levels were significantly
          higher than in Ctrl-1 (Ctrl-1 MN 0.92 ± 0.17 vs. patient MN 1.37 ± 0.15; p < 0.05).
        supports: SUPPORT
        directness: DIRECT
