        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is JPH1 p.Arg213Pro a reproducible clinical modifier of GDAP1 p.Arg120Trp neuropathy?
        attaches_to:
        - genetic#JPH1
        - pathophysiology#Reduced Store-Operated Calcium Entry
        rationale: A single double-carrier proband had more marked disease than GDAP1-only paternal relatives,
          while JPH1-only maternal relatives were unaffected. Functional support comes from transformed-cell
          knockdown and overexpression, not endogenous patient-neuron rescue. Neither colocalization nor
          negative co-immunoprecipitation resolves the physical interaction. SOCE restoration by WT JPH1
          persisted despite mitochondrial blockers, so a mandatory mitochondrial-recovery route is unsupported.
          Replicated human association and the link between calcium handling and axonal degeneration remain
          open.
      selected_evidence:
        snippet: The proband from the fCMT-408 family is a carrier of the GDAP1 p.R120W mutation inherited
          from her father, who is a CMT patient, and of the JPH1 p.R213P mutation transmitted from her
          mother, who is a healthy woman.
        supports: SUPPORT
        directness: DIRECT
