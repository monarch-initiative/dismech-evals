              label: autosomal dominant Charcot-Marie-Tooth disease type 2K
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt2k_variable_expression_and_ascertainment
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which allele, familial and ascertainment factors explain the broad dominant GDAP1 phenotype?
        attaches_to:
        - genetic#GDAP1
        rationale: Most reported dominant families have milder and slower disease than typical recessive
          cohorts, but the distributions overlap. A four-patient Chinese comparison with two AD and two
          AR cases cannot demonstrate equivalence, and the 2025 Iranian series contains only two AD individuals.
          Systematic evaluation of relatives is necessary to distinguish clinical nonpenetrance from very
          mild electrophysiological expression. The Korean paper contains abstract-versus-table discrepancies
          in patient/family and allele counts; the table-supported seven AD people in five families is
          used here. The 2022 sensory series includes one VUS and internal case1/2 and reflex-summary
          inconsistencies, so no precise pooled feature rate is used.
      selected_evidence:
        snippet: In 8 Charcot-Marie-Tooth disease (CMT) families we identified 4 pathogenic heterozygous
          GDAP1 mutations, 3 of which are novel. Three of the mutations displayed reduced disease penetrance.
          Disease onset in the affected individuals was variable, ranging from early childhood to adulthood.
          Disease progression was slow in most patients and overall severity milder than typically seen
          in autosomal recessive GDAP1 mutations.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21753178
      reference_title: Dominant GDAP1 mutations cause predominantly mild CMT phenotypes.
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: Eight ascertained families establish dominant inheritance and variable expression;
