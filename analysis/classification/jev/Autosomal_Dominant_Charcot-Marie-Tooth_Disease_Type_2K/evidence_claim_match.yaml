          value:
            name: Soluble GDAP1 variant proteins
            experimental_model_type: OTHER
            publication: PMID:35509130
            description: Purified recombinant GDAP1 fragments were studied by crystallography, solution
              scattering and thermal assays in 2022 and 2023. R120W/H123R and several other core substitutions
              reduce apparent melting temperature while retaining overall folding; R310Q/W in longer fragments
              instead slightly increase it. None of these constructs includes the transmembrane anchor.
              These experiments measure protein biophysics, not cellular half-life, mitochondrial fusion
              or clinical severity.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced GDAP1 Thermal Stability
        relationship: MEASURES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: Apparent thermal stability is reduced for the tested R120W/H123R fragments.
        limitations: Other alleles need not have the same direction; full-length membrane-embedded behavior
          and causal translation remain unresolved.
        readouts:
        - name: Apparent melting temperature
          target: Reduced GDAP1 Thermal Stability
          direction: DECREASED
          interpretation: Apparent thermal stability is reduced for the tested R120W/H123R fragments.
      selected_evidence:
        snippet: The apparent Tm value for wtGDAP1, ~62°C, was >5°C higher than for both mutants, suggesting
          that the effect of the mutations may be linked to an overall destabilization of the fold.
        supports: SUPPORT
        directness: DIRECT
    origin:
