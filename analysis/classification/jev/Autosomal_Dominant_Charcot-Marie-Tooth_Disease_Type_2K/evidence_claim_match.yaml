        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt2k_mitochondrial_mechanism_translation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How do allele-specific GDAP1 biochemical changes produce peripheral nerve dysfunction
          in humans?
        attaches_to:
        - pathophysiology#Heterozygous GDAP1 Pathogenic Variant
        rationale: Fusion inhibition, purified-fragment thermal stability, ROS and complex-I-linked bioenergetic
          measurements arise from distinct experimental systems. No tested chain establishes thermal instability
          as the necessary cause of fusion failure or ROS as the necessary mediator of human axonal injury.
          Patient fibroblast R120W results lack the oxidative-stress signal seen in C240Y, despite overexpression
          findings. The redox manuscript measures SIRT1/NRF1 abundance, not mediation by their activity.
          Resveratrol improved pooled complex I activity in cultured cells; it remains experimental and
          is not established treatment. The source uses older GST-domain boundaries and does not validate
          a domain-wide clinical severity rule.
      selected_evidence:
        snippet: It should, however, be noted that the exact linkage of the observed decrease in protein
          stability caused by CMT mutations in vitro and in silico to actual alterations in GDAP1 protein
          function in vivo remains currently unclear.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
