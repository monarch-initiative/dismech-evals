          nerve has a preserved velocity; intermediate or mixed findings occur. The molecular steps connecting
          specific mitochondrial readouts to human motor nerve injury remain unresolved.
      selected_evidence:
        snippet: We observed considerable phenotypic variability among these individuals even though many
          carried the same mutation. Based on electrophysiologic data, the majority of our autosomal dominant
          GDAP1 patients can be diagnosed as axonal CMT; patients CMT-1060.01 and CMT-1058.01 had nerve
          conduction velocities (NCVs) in the intermediate range. Examination of a sural nerve biopsy
          in the same patient showed mixed axonal and demyelinating features.
