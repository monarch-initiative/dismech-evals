        name: Reduced GDAP1 Thermal Stability
        biological_scale: MOLECULAR
        description: Purified soluble R120W and H123R GDAP1 fragments retain a broadly similar fold but
          have lower apparent thermal stability. The transmembrane anchor is absent from these constructs.
          This is an allele-scoped molecular readout, without a demonstrated causal bridge to fusion or
          neuronal loss. Other tested substitutions, including R310Q/W, need not destabilize the protein.
      selected_evidence:
        snippet: The apparent Tm value for wtGDAP1, ~62°C, was >5°C higher than for both mutants, suggesting
          that the effect of the mutations may be linked to an overall destabilization of the fold.
