              and reduced CMAP at five months. Fewer healthy anterior-horn motor neurons and later reduced
              neuromuscular-junction occupancy were reported, but five-month sciatic axon number, size
              distribution and myelin g-ratio were preserved. Rotarod differences became nonsignificant
              after nine months. Protein-abundance panels suggest altered metabolism but do not directly
              measure ATP flux. Complete loss models recessive GDAP1 deficiency and cannot establish the
              mechanism of a heterozygous dominant allele.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Motor Axonal Dysfunction
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: ORGANISM
        description: The model shares motor nerve dysfunction and late neuromuscular-junction abnormalities.
        limitations: Complete loss rather than a dominant allele; reduced CMAP does not prove sciatic
          axon loss, which was not detected at five months.
        readouts:
        - name: Sciatic-nerve compound muscle action potential
          target: Motor Axonal Dysfunction
          direction: DECREASED
          interpretation: The model shares motor nerve dysfunction and late neuromuscular-junction abnormalities.
      selected_evidence:
        snippet: Surprisingly, we did not detect any significant reduction in the axonal number correlating
          with the observed reduction in CMAP amplitude in 5 months-old mice (S1A and S1B Fig).
        supports: SUPPORT
        directness: DIRECT
