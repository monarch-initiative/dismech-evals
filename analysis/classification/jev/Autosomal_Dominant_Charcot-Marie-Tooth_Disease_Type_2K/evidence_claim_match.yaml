      assertion:
        name: Orthoses and Mobility Aids
        description: Consider ankle-foot orthoses, supportive footwear and walking aids according to gait
          impairment. Four people in the 2011 dominant-family series used an ankle-foot orthosis. Orthoses
          assist walking and do not restore nerve or mitochondrial function.
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
        therapeutic_modality: DEVICE
      selected_evidence:
        snippet: Disease onset varied widely, ranging from childhood to late adulthood. Walking difficulties
          were the most common initial symptoms. Disease progression was slow and as a rule patients remained
          ambulatory. Four patients (CMT-129.03, CMT-129.07, CMT-1060.01, and CMT-1130.03) required an
          ankle foot orthosis; patient CMT-1058.01 became wheelchair-dependent at the age of 61 years.
          Weakness and atrophy was mainly restricted to distal muscles of the lower and upper limbs except
          for patients CMT-129.03, CMT-129.07, CMT-1058.01, and CMT-1130.03, who had mild signs of proximal
          weakness.
        supports: SUPPORT
        directness: DIRECT
