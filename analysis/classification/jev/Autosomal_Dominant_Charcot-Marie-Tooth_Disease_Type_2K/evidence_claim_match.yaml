        snippet: We found six GDAP1 mutations in five AD CMT2K families (p.R120W in three families, and
          p.Q218E and p.R226K in each of the other two families) and three AR CMTRIA families (p.P111H
          and p.V219G in one family, and p.H256R and p.H256R in two families) (Fig. 1A).
        supports: SUPPORT
        directness: DIRECT
