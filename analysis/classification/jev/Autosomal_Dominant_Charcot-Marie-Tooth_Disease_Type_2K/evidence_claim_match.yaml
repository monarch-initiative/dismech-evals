            term:
              id: MONDO:0020558
              label: autosomal dominant Charcot-Marie-Tooth disease type 2K
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt2k_mitochondrial_mechanism_translation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How do allele-specific GDAP1 biochemical changes produce peripheral nerve dysfunction
          in humans?
        attaches_to:
        - pathophysiology#Heterozygous GDAP1 Pathogenic Variant
        rationale: Fusion inhibition, purified-fragment thermal stability, ROS and complex-I-linked bioenergetic
          measurements arise from distinct experimental systems. No tested chain establishes thermal instability
          as the necessary cause of fusion failure or ROS as the necessary mediator of human axonal injury.
          Patient fibroblast R120W results lack the oxidative-stress signal seen in C240Y, despite overexpression
          findings. The redox manuscript measures SIRT1/NRF1 abundance, not mediation by their activity.
          Resveratrol improved pooled complex I activity in cultured cells; it remains experimental and
          is not established treatment. The source uses older GST-domain boundaries and does not validate
          a domain-wide clinical severity rule.
      selected_evidence:
        snippet: Using a fluorescent probe specific for superoxide a nions (MitoSOX TM ), we identified
          a 40% enhancement of fluorescence intensity in p.C240Y fi broblasts compared to controls (Fig.
          4a and 4b, p=0.020). In addition, we observed a 50% decrease in thiol group level, which are
          the ROS targets, further supporting ROS overproduction (Fig. 4c, p=0.015). Moreover, the expression
          of manganese superoxide dismutase (MnSOD), a major mitochondrial antioxidant, was 53% higher
          in p.C240Y fibroblasts compared to c ontrols (Fig. 4d, p=0.045). In contrast, in the p.R120W
          fibroblasts, no evidence of oxidative stress was observed (Fig. 4).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: url:https://univ-angers.hal.science/hal-02388209v1/document
      reference_title: https://univ-angers.hal.science/hal-02388209v1/document
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: MitoSOX, thiol and antioxidant readouts support oxidative stress in C240Y-family fibroblasts,
        whereas R120W-family cells did not show the same response.
