        description: A heterozygous GDAP1 variant with established dominant pathogenicity can be inherited
          or arise de novo. Reduced penetrance and marked intrafamilial variability occur. Each child
          has a 50% chance of inheriting the variant; severity is not predicted by that transmission probability.
          Recessive GDAP1 alleles and variants of uncertain significance require separate interpretation.
      selected_evidence:
        snippet: We traced segregation of the GDAP1 mutations in all available family members and all
          clinically affected individuals carried a mutant allele. This analysis further identified 4
          unaffected carriers of the His123Arg mutation in the first generation of the Finnish family
          (CMT-129).
        supports: SUPPORT
        directness: DIRECT
