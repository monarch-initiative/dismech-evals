      assertion_type: Pathophysiology
      assertion:
        name: Increased Mitochondrial Reactive Oxygen Species
        biological_scale: CELLULAR
        description: Dominant-variant expression can increase mitochondrial ROS, and patient C240Y fibroblasts
          show increased MitoSOX signal with supporting oxidative-stress readouts. R120W patient fibroblasts
          in the same study did not show increased oxidative stress. Cell context and allele therefore
          matter.
      selected_evidence:
        snippet: Using a fluorescent probe specific for superoxide a nions (MitoSOX TM ), we identified
          a 40% enhancement of fluorescence intensity in p.C240Y fi broblasts compared to controls (Fig.
          4a and 4b, p=0.020). In addition, we observed a 50% decrease in thiol group level, which are
          the ROS targets, further supporting ROS overproduction (Fig. 4c, p=0.015). Moreover, the expression
          of manganese superoxide dismutase (MnSOD), a major mitochondrial antioxidant, was 53% higher
          in p.C240Y fibroblasts compared to c ontrols (Fig. 4d, p=0.045). In contrast, in the p.R120W
          fibroblasts, no evidence of oxidative stress was observed (Fig. 4).
        supports: SUPPORT
        directness: DIRECT
