      assertion_type: Genetic
      assertion:
        name: GDAP1
        gene_term:
          preferred_term: GDAP1
          term:
            id: hgnc:15968
            label: GDAP1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: Dominant disease has been reported with alleles including p.Arg120Trp, p.His123Arg, p.Ala156Gly,
          p.Pro274Leu, p.Gln218Glu, p.Arg226Lys and p.Gly271Arg. The 2022 sensory-predominant series classified
          p.Gly271Arg as pathogenic, whereas its p.Ala336Ser observation remained a VUS and does not establish
          a causal dominant allele. Earlier reports summarized by the 2011 cohort also include a de novo
          p.Thr157Pro observation. An in-frame p.Arg226del and a historically reported early truncating
