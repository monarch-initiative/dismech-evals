          increased apoptosis or death of human peripheral neurons.
      selected_evidence:
        snippet: Furthermore, impaired fusion process resulted in fragmented mitochondria in cells expressing
          the Ala156Gly mutant (figure e-1A on the Neurology® Web site at www.neurology.org) and increased
          sensitivity to proapoptotic agents, as quantified by a cytochrome c release assay, which was
          also in line with our previous findings for other dominant GDAP1 mutations (figure e-1, B and
          C).15
        supports: SUPPORT
