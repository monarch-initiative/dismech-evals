            term:
              id: MONDO:0014711
              label: autosomal dominant Charcot-Marie-Tooth disease type 2W
        context: []
      assertion_type: Genetic
      assertion:
        name: HARS1
        gene_term:
          preferred_term: HARS1
          term:
            id: hgnc:4816
            label: HARS1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'HARS1 (5q31.3) encodes cytoplasmic histidyl-tRNA synthetase. Domain location predicts
          both the disease and its inheritance mode: catalytic-domain missense alleles cause dominant
          CMT2W, while the tRNA-binding domain allele Y454S causes recessive Usher syndrome type IIIB.
          The reported CMT2W alleles span at least V133F, V155G, Y330C, S356N and, from a four-family
          linkage-plus-exome study, p.Thr132Ile, p.Pro134His, p.Asp175Glu and p.Asp364Tyr. Note that p.Asp364Tyr
          — the allele whose aggregation behaviour was later characterised in neuronal cells — is a patient
          allele from that series, not a laboratory construct, and it was separately shown to be dominantly
          neurotoxic in C. elegans. Allele-specific biochemistry differs within CMT2W itself — some alleles
          mistranslate, others reduce protein abundance — which is why treatment inferences must be made
          per allele rather than per gene.'
      selected_evidence:
        snippet: In histidyl-tRNA synthetase (HARS), autosomal dominant mutations V133F, V155G, Y330C
          and S356N in the HARS catalytic domain cause Charcot-Marie-Tooth disease type 2 W (CMT2W), while
          tRNA-binding domain mutation Y454S causes recessive Usher syndrome type IIIB.
        supports: SUPPORT
