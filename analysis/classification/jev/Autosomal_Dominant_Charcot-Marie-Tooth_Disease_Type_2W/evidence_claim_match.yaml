      assertion_type: Pathophysiology
      assertion:
        name: HARS1 Catalytic Domain Dysfunction
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'HARS1 is the cytoplasmic aminoacyl-tRNA synthetase that ligates histidine to its
          cognate tRNA. The CMT2W alleles — V133F, V155G, Y330C and S356N — all sit in the catalytic domain.
          Their consequences at the protein level are not uniform: V133F and Y330C reduce HARS1 abundance
          in cells and V133F is thermally destabilized in vitro (rescued by tRNA), while V155G and S356N
          retain enough activity to mischarge. This heterogeneity is the reason the downstream mechanism
          is curated as competing hypotheses rather than a single chain.'
        genes:
        - preferred_term: HARS1
          term:
            id: hgnc:4816
            label: HARS1
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Heterozygous germline missense variants in the HARS1 catalytic domain. Modelling
            in neurons supports a dominant-negative rather than simple loss-of-function action; note that
            individual alleles also show reduced abundance, so the two are not mutually exclusive.
        molecular_functions:
        - preferred_term: aminoacyl-tRNA ligase activity
          modifier: DECREASED
          term:
            id: GO:0004812
            label: aminoacyl-tRNA ligase activity
        biological_processes:
        - preferred_term: tRNA aminoacylation for protein translation
          modifier: DECREASED
          term:
            id: GO:0006418
            label: tRNA aminoacylation for protein translation
      selected_evidence:
        snippet: Mutants V133F and Y330C showed the most significant growth defect and decreased HARS
          abundance in cells.
        supports: SUPPORT
    origin:
