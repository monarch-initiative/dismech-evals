      assertion:
        name: Neuronal Proteostatic and Translational Stress
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: PROVISIONAL
        description: The step between a partly defective synthetase and a dying axon is the least settled
          part of this disease, and the evidence supports more than one route. Neuronal models of dominant
          HARS1 alleles show increased eIF2-alpha phosphorylation with decreased protein translation,
          the integrated stress response signature. Separately, mischarging alleles produce insoluble
          protein accumulation, and at least one severe allele forms HARS1 protein aggregates directly.
          These are curated as competing hypotheses below; the node is marked PROVISIONAL because which
          route dominates in human peripheral nerve is unknown.
        biological_processes:
        - preferred_term: protein folding
          modifier: ABNORMAL
          term:
            id: GO:0006457
            label: protein folding
        cell_types:
        - preferred_term: Motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        - preferred_term: Sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
      selected_evidence:
        snippet: Mullen et al. generate new models of pathogenic, dominant HARS1 mutations and show that
          they increase eIF2α phosphorylation and decrease protein translation in neurons.
        supports: SUPPORT
