          does not fit easily, and modelling work in neurons supports a dominant-negative action of the
          mutant protein on the wild-type allele''s function. Note that HARS1 also causes a recessive
          disease through a different domain, so inheritance mode and domain track together in this gene.'
      selected_evidence:
        snippet: In histidyl-tRNA synthetase (HARS), autosomal dominant mutations V133F, V155G, Y330C
