      assertion:
        hypothesis_group_id: hars1_mistranslation_proteotoxicity
        hypothesis_label: Amino Acid Mistranslation and Proteotoxicity Model
        status: ALTERNATIVE
        description: Some CMT2W alleles do not simply lose activity — they mischarge. V155G and S356N
          mistranslate histidine to glutamine and threonine, and the resulting aberrant proteins accumulate
          as an insoluble fraction. On this model the proximate injury is proteotoxic rather than a translation-rate
          deficit, and the two are distinguishable experimentally because mistranslation-driven aggregation
          is rescued by histidine while abundance-limited alleles are made worse by it. Notably Y330C,
          also a CMT2W allele, did not mistranslate, so this model cannot be the whole story for the gene.
      selected_evidence:
        snippet: We show mistranslation of histidine to glutamine and threonine in V155G and S356N but
          not Y330C mutants in yeast.
        supports: SUPPORT
