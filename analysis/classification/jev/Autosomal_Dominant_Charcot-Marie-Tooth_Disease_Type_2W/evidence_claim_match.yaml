      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neurite Outgrowth and Distal Axonal Degeneration
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        conforms_to: peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination
        description: The cellular readout is failure of neuronal process formation and, in patients, degeneration
          of the longest peripheral axons. In neuronal cells the D364Y patient allele forms small HARS1
          aggregates and inhibits process formation, whereas wild-type protein distributes through the
          cell body and supports normal differentiation. In patients this manifests as an axonal neuropathy;
