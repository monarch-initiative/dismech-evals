  595e75af87f4ebbc815175d0970f1ce1228c7ab92c2cc9465a8db0f2b7e00206:
    claim:
      about:
        disease:
          name: Autosomal Dominant Cutis Laxa 1
          disease_term:
            preferred_term: Autosomal Dominant Cutis Laxa 1
            term:
              id: MONDO:0007411
              label: cutis laxa, autosomal dominant 1
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Human ELN cutis-laxa cDNA minigene mouse
        species: Mouse
        genotype: CMV enhancer/chicken beta-actin-driven human ELN c.2114_2138del cDNA with exon 32 skipped,
          on intact endogenous Eln background
        background: C57BL/6J; three founder lines, detailed functional work principally line 60
        publication: PMID:20600892
        description: Human mutant or wild-type elastin cDNA minigenes were introduced by pronuclear injection.
          All three mutant founders had enlarged pulmonary airspaces; severe line 2 could not be maintained
          and its early mortality is not the outcome of the line 60 functional experiments. Lung-strip
          stiffness and elastic recoil were reduced in line 60. Crosslinked elastin measured by desmosine
          increased in both wild-type and mutant transgenic lungs. Human and mouse elastin colocalized
          in a shared network; that does not resolve covalent copolymer composition molecule by molecule.
        notes: This is added cDNA expression, not a BAC or endogenous heterozygous knock-in. Genomic copy
          number and insertion-site matching were not reported. No consistent skin or cardiovascular pathology
          was observed. Elevated pSMAD2, phospho-eIF2alpha and TUNEL are parallel observations; no selective
          pathway blockade, active-TGF-beta release assay or therapeutic rescue establishes mediation.
          Histology/signaling used four mice per group and fields are nested within mice.
        modeled_mechanisms:
        - target: Alveolar Airspace Enlargement
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Airspace enlargement occurred in all three founder lines, with variable severity.
          limitations: Detailed mechanical results principally concern line 60, not the severely affected
            line 2.
          readouts:
          - name: Pulmonary airspace enlargement
            target: Alveolar Airspace Enlargement
            direction: INCREASED
            interpretation: Airspace enlargement occurred in all three founder lines, with variable severity.
        - target: Reduced Tissue Elastic Recoil
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: The functional model reproduces reduced lung recoil and stiffness.
          limitations: This does not demonstrate the same mechanical phenotype in skin or aorta.
          readouts:
          - name: Lung elastic recoil
            target: Reduced Tissue Elastic Recoil
            direction: DECREASED
            interpretation: The functional model reproduces reduced lung recoil and stiffness.
        - target: Increased SMAD2 Phosphorylation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: The stated molecular or histological readout was elevated in mutant lung.
          limitations: No selective rescue establishes that this readout causes airspace enlargement;
            TUNEL remained low in absolute fraction.
          readouts:
          - name: pSMAD2-positive lung nuclei
            target: Increased SMAD2 Phosphorylation
            direction: INCREASED
            interpretation: The stated molecular or histological readout was elevated in mutant lung.
        - target: Endoplasmic Reticulum Stress Response
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: The stated molecular or histological readout was elevated in mutant lung.
          limitations: No selective rescue establishes that this readout causes airspace enlargement;
            TUNEL remained low in absolute fraction.
          readouts:
          - name: Phospho-eIF2alpha staining with mutant elastin
            target: Endoplasmic Reticulum Stress Response
            direction: INCREASED
            interpretation: The stated molecular or histological readout was elevated in mutant lung.
        - target: Increased Apoptotic Readouts
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: The stated molecular or histological readout was elevated in mutant lung.
          limitations: No selective rescue establishes that this readout causes airspace enlargement;
            TUNEL remained low in absolute fraction.
          readouts:
          - name: Lung TUNEL index
            target: Increased Apoptotic Readouts
            direction: INCREASED
            interpretation: The stated molecular or histological readout was elevated in mutant lung.
      selected_evidence:
        snippet: Transgenic mice were generated using pronuclear injection of minigenes containing either
          a human elastin cDNA with a cutis laxa mutation 2114_2138del (CL) or a wild-type human elastin
          cDNA (WT).
        supports: SUPPORT
        directness: DIRECT
