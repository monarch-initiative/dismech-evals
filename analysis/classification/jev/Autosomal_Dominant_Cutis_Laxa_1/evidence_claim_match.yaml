        description: Beta blockers or angiotensin-receptor blockers may be considered by the treating
          specialist by extrapolation from other connective-tissue aortopathies. Their effectiveness in
          ELN-related cutis laxa has not been evaluated. Do not interpret pSMAD2 findings as a demonstrated
          human losartan rescue. Reversible airway obstruction influences beta-blocker choice, and pregnancy
          requires medication review.
