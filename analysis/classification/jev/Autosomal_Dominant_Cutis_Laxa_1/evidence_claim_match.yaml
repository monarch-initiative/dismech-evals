              id: NCIT:C66930
              label: Angiotensin II Receptor Antagonist
      selected_evidence:
        snippet: Effectiveness of beta-blocking agents or angiotensin receptor antagonists in slowing
          aortic root dilatation has not been evaluated, but (as w/other connective tissue disorders)
          these are likely beneficial.
        supports: SUPPORT
        directness: DIRECT
