  ce06d04e1c683ac8536e10b0ba6b2daf758c7571f7ad651516fed5554cc6632c:
    claim:
      about:
        disease:
          name: Autosomal Dominant Cutis Laxa 1
          disease_term:
            preferred_term: Autosomal Dominant Cutis Laxa 1
            term:
              id: MONDO:0007411
              label: cutis laxa, autosomal dominant 1
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Human ELN BAC frameshift transgenic mouse
        species: Mouse
        genotype: Human ELN BAC carrying the paper’s 2012deltaG exon 30 deletion, tested on Eln+/+, Eln+/-
          and human-WT-BAC rescue backgrounds
        publication: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3381164/
        description: A human genomic BAC preserves introns and alternative splicing; three founders were
          identified and line 1 was used subsequently. Mutant elastin incorporated into skin and lung,
          with little aortic matrix incorporation despite aortic protein production. Skin required about
          half the displacement force of controls. Aortic desmosine and mechanics were unchanged; skin
          desmosine increased. Mutant-BAC-only lung compliance trends on Eln+/+ and Eln+/- were not statistically
          significant; adverse effects were clearer in the human-WT-BAC rescue background. The mutant
          BAC did not rescue Eln-null viability and impaired rescue by the wild-type human BAC.
        notes: An added BAC is not the endogenous heterozygous patient genotype. Human and mouse elastin
          backgrounds alter expression and tissue responses. Translation-inhibitor RNA experiments were
          performed in cultured mouse fibroblasts, not measured as an in-vivo RNA-decay rate. Exon32 inclusion
          promotes partial decay, not universal elimination; adult splice ratios alone did not explain
          tissue-specific matrix incorporation. The article contains inconsistent printed significance
          thresholds, so no repaired numeric threshold is asserted here.
        modeled_mechanisms:
        - target: Reduced Tissue Elastic Recoil
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Skin suction testing found reduced force required for displacement.
          limitations: Pulmonary effects depend on the combined human/mouse elastin background, and no
            comparable aortic mechanical deficit was demonstrated.
          readouts:
          - name: Skin displacement resistance
            target: Reduced Tissue Elastic Recoil
            direction: DECREASED
            interpretation: Skin suction testing found reduced force required for displacement.
        - target: Abnormal Elastic Fiber Architecture
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Mutant elastin entered skin and lung fibers with tissue-specific functional abnormalities.
          limitations: Aortic protein production did not translate into substantial matrix incorporation;
            the model does not reproduce human aortopathy consistently.
      selected_evidence:
        snippet: To investigate the pathophysiology underlying a class of elastin gene mutations leading
          to autosomal dominant cutis laxa, we engineered a cutis laxa mutation (single base deletion)
          into the human elastin gene contained in a bacterial artificial chromosome.
        supports: SUPPORT
        directness: DIRECT
