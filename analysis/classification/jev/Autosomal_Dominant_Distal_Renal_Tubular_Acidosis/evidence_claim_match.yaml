              label: autosomal dominant distal renal tubular acidosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mistrafficking of kAE1 with Dominant-Negative Retention of Wild-Type kAE1
        biological_scale: CELLULAR
        description: The mutant kAE1 is retained intracellularly (in the endoplasmic reticulum for Arg589His
          and Ser613Phe) or mis-sorted to the apical membrane (for the Arg901X truncation and Met909Thr,
          which lose a C-terminal basolateral targeting motif). Because kAE1 assembles as a dimer, the
          mutant forms heterodimers with the wild-type protein and holds it intracellularly too - the
          dominant-negative step that explains why one mutant allele impairs the product of the normal
          allele.
        cell_types:
        - preferred_term: alpha-intercalated cell
          term:
            id: CL:0005011
            label: renal alpha-intercalated cell
        biological_processes:
        - preferred_term: kAE1 localization to the basolateral plasma membrane
          modifier: DECREASED
          term:
            id: GO:1903361
            label: protein localization to basolateral plasma membrane
      selected_evidence:
        snippet: When coexpressed, the dominant mutants retained kAE1 WT intracellularly, while the recessive
          mutants did not.
        supports: SUPPORT
