      assertion_type: Treatment
      assertion:
        name: Oral alkali replacement
        therapeutic_modality: SMALL_MOLECULE
        action_category: THERAPEUTIC
        description: Lifelong oral alkali - sodium bicarbonate and/or potassium citrate, with additional
          potassium chloride as needed - corrects the systemic acidosis and hypokalemia. Potassium citrate
          does double duty, since urinary citrate is the inhibitor of calcium precipitation depleted in
          this disease. It replaces the buffer the kidney cannot regenerate; it does not repair the kAE1
          defect, and the urine stays inappropriately alkaline.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: potassium citrate
            term:
