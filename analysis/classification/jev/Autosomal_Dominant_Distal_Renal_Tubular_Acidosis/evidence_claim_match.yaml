            term:
              id: CHEBI:32139
              label: sodium hydrogencarbonate
          - preferred_term: potassium chloride
            term:
              id: CHEBI:32588
              label: potassium chloride
      selected_evidence:
        snippet: substantial catch-up growth occurred during 5 years of follow-up, with the height standard
          deviation score improving from - 4.1 to - 2.3
        supports: SUPPORT
