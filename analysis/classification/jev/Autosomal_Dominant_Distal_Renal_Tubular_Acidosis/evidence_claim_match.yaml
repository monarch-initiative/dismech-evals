              id: MONDO:0008368
              label: autosomal dominant distal renal tubular acidosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Acidosis-Driven Calciopenic Mineralization Defect
        biological_scale: ORGANISM
        conforms_to: defective_skeletal_mineralization#Calciopenic Substrate Deficiency
        description: 'Chronic uncorrected metabolic acidosis places dRTA on the calciopenic arm of the
          defective skeletal mineralization module. Urinary calcium loss reduces the calcium reaching
          the mineralization front, and net renal generation of 1,25-dihydroxyvitamin D falls even though
          25-hydroxyvitamin D supply is intact. That the limiting step is the acidosis is what alkali
          therapy demonstrates: correcting the acidosis alone raises serum calcitriol and heals the bone
          disease.'
        biological_processes:
        - preferred_term: impaired skeletal mineralization
          modifier: DECREASED
          term:
            id: GO:0030282
            label: bone mineralization
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        locations:
        - preferred_term: bone element
          term:
            id: UBERON:0001474
            label: bone element
        notes: 'Arm assignment is calciopenic rather than phosphopenic, following the SLC4A1-dRTA and
          CKD-MBD conformers: the distal RTA skeletal lesion is driven by hypercalciuric calcium loss
          and secondary reductions in calcitriol, not by tubular phosphate wasting. The calcitriol evidence
          (PMID:16110243) is n=2 adults with osteomalacia.'
      selected_evidence:
        snippet: In 2 women with distal renal tubular acidosis and osteomalacia, alkali treatment cured
          the bone disease and was accompanied by marked increases in the serum 1,25 dihydroxyvitamin
          D concentration, without a significant change in the 25-hydroxyvitamin D concentration.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16110243
      reference_title: 'Distal renal tubular acidosis: alkali heals osteomalacia and increases net production
        of 1,25-dihydroxyvitamin D.'
      evidence_source: HUMAN_CLINICAL
      explanation: Alkali alone raised calcitriol while 25-hydroxyvitamin D was unchanged, locating the
        defect at calcitriol generation rather than vitamin D substrate supply - the calciopenic arm.
        This is an n=2 adult osteomalacia study, not a paediatric rickets cohort, so the arm assignment
        rests on the demonstrated mechanism rather than on cohort size.
