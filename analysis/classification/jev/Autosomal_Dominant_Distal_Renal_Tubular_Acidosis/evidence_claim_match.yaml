          term:
            id: UBERON:0001232
            label: collecting duct of renal tubule
        notes: 'Conforms to the nephrolithiasis module at the supersaturation trigger: the module''s stated
          calcium-phosphate route is alkaline urine plus hypercalciuria, which is exactly the dRTA solute
          profile. The substituted lithogenic combination is alkaline urine, hypercalciuria and hypocitraturia
          rather than a single transporter defect.'
      selected_evidence:
