  8f55fc61c9e34245a6ad46e28b25bedaf9859fb00fd064b53678070b9f6dced6:
    claim:
      about:
        disease:
          name: Autosomal Dominant Distal Renal Tubular Acidosis
          disease_term:
            preferred_term: autosomal dominant distal renal tubular acidosis
            term:
              id: MONDO:0008368
              label: autosomal dominant distal renal tubular acidosis
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC4A1
        gene_term:
          preferred_term: SLC4A1
          term:
            id: hgnc:11027
            label: SLC4A1
        association: Heterozygous dominant-negative pathogenic variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal dominant
        features: Heterozygous SLC4A1 variants cause autosomal dominant dRTA by a dominant-negative trafficking
          mechanism. The Arg589 residue is a mutational hotspot (p.Arg589His, p.Arg589Cys, p.Arg589Ser);
          other recurrent alleles include p.Ser613Phe, p.Gly609Arg, the p.Arg901X C-terminal truncation,
          p.Met909Thr and p.Arg388Cys. Both de novo and familial cases are described; the dominant alleles
          usually spare the red cell.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_6b158156-1985-4647-9e0e-01e7fb4a6739-2021-06-02T040000.000Z
        variants:
        - name: p.Arg589His
          clinical_significance: PATHOGENIC
          description: The prototype and most common dominant allele; an ER-retained, dominant-negative
            missense change in the intracellular loop between transmembrane segments 6 and 7.
        - name: p.Arg589Cys
          clinical_significance: PATHOGENIC
          description: A hotspot substitution at the same residue; reported de novo and shown to impair
            cell-surface targeting of kAE1.
        - name: p.Ser613Phe
          clinical_significance: PATHOGENIC
          description: An ER-retained dominant missense allele reported in the founding AD-dRTA families.
        - name: p.Gly609Arg
          clinical_significance: PATHOGENIC
          description: A worldwide hotspot in the seventh transmembrane domain; the mutant retains anion
            transport but is mistargeted, with a dominant-negative effect on basolateral AE1 expression.
        - name: p.Arg901Ter
          clinical_significance: PATHOGENIC
          description: A C-terminal truncation removing the basolateral targeting motif; the most common
            truncating dominant allele, mis-sorted apically and endocytosed faster than wild type.
        - name: p.Met909Thr
          clinical_significance: PATHOGENIC
          description: A C-terminal missense allele that gains an apical-targeting (PDZ-ligand) motif,
            so the exchanger is mislocalised to both apical and basolateral membranes.
        - name: p.Arg388Cys
          clinical_significance: PATHOGENIC
          description: An N-terminal amphipathic-helix allele presenting with an atypical, late/mild adult
            phenotype; the mutant is impaired in trafficking to the cell surface.
      selected_evidence:
        snippet: The mutation Arg589--> His was present in two families, while Arg589--> Cys and Ser613-->
          Phe changes were found in the other families.
        supports: SUPPORT
