          the lithogenic combination is persistently alkaline urine (which favours calcium phosphate)
          together with hypercalciuria and the loss of citrate, the normal inhibitor of calcium crystallisation.
          This raises urinary supersaturation with respect to calcium phosphate and drives crystal nucleation,
          producing nephrocalcinosis and nephrolithiasis - the latter disproportionately frequent in SLC4A1
          disease.'
        cell_types:
        - preferred_term: kidney epithelial cell
          term:
