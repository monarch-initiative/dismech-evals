          inhibitor, bypasses the upstream BH4/tyrosine-hydroxylase bottleneck and usually produces rapid,
          near-complete, sustained motor benefit in classic GCH1-related disease. Dose changes should
          be gradual, chronic adverse motor fluctuations are uncommon, and abrupt discontinuation should
          be avoided. Evidence for the rare branches is much thinner: NR4A2 cases were reported as dopa
          responsive, whereas response was only hypothesized for the published IMPDH2 family.'
