        prompt: How should IMPDH2 and NR4A2 be represented when Orphanet includes them in an autosomal
          dominant DRD concept dominated by classic GCH1 disease?
        kind: INTERPRETATION
        status: RESOLVED
        attaches_to:
        - genetic#IMPDH2 heterozygous truncating variant
        - genetic#NR4A2 loss-of-function variants
        rationale: Treating all three genes as one mechanism would incorrectly transfer the classic BH4
          deficiency, phenotype frequencies, and proven levodopa response to two very small and biologically
          distinct reports.
        resolved_date: '2026-07-21T00:00:00Z'
        resolution_note: Retain the ontology's aggregate boundary but use explicit molecular subtypes.
          GCH1 is canonical; IMPDH2 and NR4A2 are provisional branches with branch-specific mechanisms,
          phenotypes, and evidence limitations.
