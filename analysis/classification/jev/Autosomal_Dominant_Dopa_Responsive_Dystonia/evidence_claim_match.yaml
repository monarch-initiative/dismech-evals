        snippet: '| GCH1 | GTP cyclohydrolase 1 | hgnc:4193 | Disease-causing germline mutation(s) in
          | | IMPDH2 | inosine monophosphate dehydrogenase 2 | hgnc:6053 | Disease-causing germline mutation(s)
          (loss of function) in | | NR4A2 | nuclear receptor subfamily 4 group A member 2 | hgnc:7981
          | Disease-causing germline mutation(s) (loss of function) in |'
        supports: SUPPORT
