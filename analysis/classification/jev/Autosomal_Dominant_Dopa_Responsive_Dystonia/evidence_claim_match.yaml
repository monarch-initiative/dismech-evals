      assertion_type: Subtype
      assertion:
        name: IMPDH2-associated dystonia-tremor
        display_name: IMPDH2-associated dominant juvenile-onset dystonia-tremor
        classification: molecular_provisional
        description: A provisional branch based on one large Finnish family with a segregating heterozygous
          truncating IMPDH2 variant and reduced IMPDH2 protein in patient cells. The phenotype was juvenile-onset
          dystonia and tremor; impaired guanine-dependent dopamine synthesis and levodopa responsiveness
          remain proposed rather than clinically demonstrated.
      selected_evidence:
        snippet: Here we report a deleterious heterozygous truncating variant in the inosine monophosphate
          dehydrogenase gene (IMPDH2) by whole-exome sequencing, co-segregating with a dominantly inherited
          dystonia-tremor disease in a large Finnish family.
        supports: SUPPORT
