          relationship: FAILS_TO_RECAPITULATE
          description: The baseline intrinsic properties sampled in this intact preparation were not different.
          fidelity: UNKNOWN
          limitations: This is not equivalent to every evoked-current test and differs from organotypic
            culture; absence of a baseline difference does not negate network abnormalities.
          readouts:
