        category: Neurologic
        description: Brief stereotyped simple sounds, altered sound perception or complex auditory experiences
          are characteristic focal ictal symptoms. They are seizures themselves and may be overlooked
          before a convulsion. In one selected cohort, auditory symptoms were documented in 17/24 RELN
          and 29/51 LGI1 cases; these are ascertainment-dependent observations.
        phenotype_term:
          preferred_term: Focal sensory seizure with auditory features
          term:
            id: HP:0011158
            label: Focal sensory seizure with auditory features
      selected_evidence:
        snippet: The most common auditory symptoms are simple unformed sounds including humming, buzzing,
          or ringing; less common forms are distortions (e.g., volume changes) or complex sounds (e.g.,
          specific songs or voices).
        supports: SUPPORT
        directness: DIRECT
