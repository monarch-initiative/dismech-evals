              label: autosomal dominant epilepsy with auditory features
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: MICAL1 transfected-cell activity and morphology assays
        experimental_model_type: CELL_LINE
        description: HEK293T cell-lysate Amplex assays measured NADPH-dependent H2O2 generation for selected
          MICAL1 variants, with separate COS7 contraction assays in the original study. G150S and the
          C-terminal extension increased activity, whereas R646Q was a VUS without increased activity.
          A later R915C assay increased the human and homologous mouse activity proxies. No neuronal actin
          oxidation, synapse measurement, human rescue or clinical treatment was tested.
        modeled_mechanisms:
        - target: Increased MICAL1 Oxidoreductase Activity
          relationship: MEASURES
          description: Selected variant constructs increase an indirect oxidoreductase-activity readout.
          fidelity: UNKNOWN
          readouts:
          - name: Cell-lysate H2O2 production
            target: Increased MICAL1 Oxidoreductase Activity
            direction: INCREASED
            interpretation: Selected variant constructs increase an indirect oxidoreductase-activity readout.
        notes: The original C-terminal extension changes the final three residues and adds a novel tail;
          it is not deletion of the entire coiled-coil domain. One familial variant co-segregated with
          an unexcluded GRIN2A variant. Cell contraction is a morphology proxy, not a direct neuronal
          actin measurement.
      selected_evidence:
        snippet: To determine the effects of the p.Arg915Cys variant on MICAL‐1 redox activity, we used
          an indirect enzyme‐linked assay that measures H2O2 production.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /experimental_models/5
      evidence_path: /experimental_models/5/evidence/0
