        snippet: A chemical corrector, 4-phenylbutyrate (4PBA), restored LGI1(E383A) folding and binding
          to ADAM22 and ameliorated the increased seizure susceptibility of the LGI1(E383A) model mice.
        supports: SUPPORT
        directness: DIRECT
