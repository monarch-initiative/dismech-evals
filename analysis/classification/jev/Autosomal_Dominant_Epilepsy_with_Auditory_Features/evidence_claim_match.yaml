      assertion:
        phase: Variable seizure control and remission
        notes: Many affected individuals respond to standard medication, but drug resistance and relapse
          after withdrawal occur. A broader EAF cohort of 123 patients (68.3% sporadic), followed a median
          11 years, reported 42/123 with terminal remission. Its definition was at least five consecutive
          seizure-free years at last follow-up, not necessarily off medication; this is not an ADEAF-specific
          prognosis estimate.
      selected_evidence:
        snippet: At last assessment, 42 patients had achieved TR (34.1%).
