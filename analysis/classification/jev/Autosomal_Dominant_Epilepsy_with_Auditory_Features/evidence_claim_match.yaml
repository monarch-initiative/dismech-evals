  39548e731547a8448f7babd13322dc59df95836081911cb3daef55899f47e747:
    claim:
      about:
        disease:
          name: Autosomal Dominant Epilepsy with Auditory Features
          disease_term:
            preferred_term: autosomal dominant epilepsy with auditory features
            term:
              id: MONDO:0010898
              label: autosomal dominant epilepsy with auditory features
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Local LGI1 restoration in organotypic hippocampal culture
        experimental_model_type: OTHER
        description: Organotypic slices from P7–10 homozygous-null mice of both sexes underwent single-cell
          electroporation of 8–10 selected neurons per slice. Inducible LGI1 expression was assessed with
          CA3 recordings after three days; extracellular tagged-protein visualization used a separate
          six-day interval. Intrinsic recordings blocked ionotropic glutamate and GABA receptors. Current,
          firing and AIS Kv1.1 rescue were measured in expressing cells; nearby rheobase improved, but
          nearby Kv1.1 staining was not significantly increased.
        modeled_mechanisms:
        - target: Reduced Kv1-Mediated D-Type Current
          relationship: RESCUES
          description: Local LGI1 expression restores the DTx-K-sensitive conductance; toxin reapplication
            supports a channel contribution to intrinsic rescue.
          fidelity: UNKNOWN
          readouts:
          - name: DTx-K-sensitive conductance
            target: Reduced Kv1-Mediated D-Type Current
            direction: RESTORED
            interpretation: Local LGI1 expression restores the DTx-K-sensitive conductance; toxin reapplication
              supports a channel contribution to intrinsic rescue.
        - target: Reduced Axon Initial Segment Kv1.1 Density
          relationship: RESCUES
          description: AIS Kv1.1 immunostaining recovers in expressing neurons; significant density rescue
            was not demonstrated in neighboring neurons.
          fidelity: UNKNOWN
          readouts:
          - name: AIS Kv1.1 staining
            target: Reduced Axon Initial Segment Kv1.1 Density
            direction: RESTORED
            interpretation: AIS Kv1.1 immunostaining recovers in expressing neurons; significant density
              rescue was not demonstrated in neighboring neurons.
        - target: Increased Intrinsic Neuronal Excitability
          relationship: RESCUES
          description: Current-evoked excitability decreases after local expression in deficient CA3 cells.
          fidelity: UNKNOWN
          readouts:
          - name: Intrinsic neuronal firing
            target: Increased Intrinsic Neuronal Excitability
            direction: DECREASED
            interpretation: Current-evoked excitability decreases after local expression in deficient
              CA3 cells.
        - target: Shortened Axon Initial Segment
          relationship: RESCUES
          description: AIS length recovers partially, without evidence that shortening causes the firing
            phenotype.
          fidelity: UNKNOWN
          readouts:
          - name: AIS length
            target: Shortened Axon Initial Segment
            direction: INCREASED
            interpretation: AIS length recovers partially, without evidence that shortening causes the
              firing phenotype.
        notes: Counts generally represent neurons or AIS objects; animal/slice hierarchy is not explicit
          for each comparison. No human allele, patient-derived cell, selective secretion blockade, ADAM22
          mediation experiment, living-animal seizure reduction or clinical efficacy was tested. Paracrine
          spread is supported but autocrine versus intracellular contributions remain unresolved.
      selected_evidence:
        snippet: Here, we show that the selective expression of LGI1 in KO-Lgi1 neurons from mice of both
          sexes, using single-cell electroporation, reduces intrinsic excitability and restores both the
          Kv1.1-mediated D-type current and Kv1.1 channels at the AIS.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /experimental_models/1
      evidence_path: /experimental_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37863654
      reference_title: Rescue of Normal Excitability in LGI1-Deficient Epileptic Neurons.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: Restoration in organotypic mouse hippocampal neurons supports a Kv1-related excitability
        mechanism; this is not a human treatment.
