          stable RELN-left/LGI1-other rule or imply that EEG is the only informative investigation.
        diagnosis_term:
          preferred_term: Electroencephalography
          term:
            id: NCIT:C38054
            label: Electroencephalography
        results: Temporal epileptiform discharges, focal slowing or a normal recording.
      selected_evidence:
        snippet: The interictal EEG recordings showed epileptiform abnormalities or focal slow waves in
          80% of patients, localized over the temporal regions, with marked left predominance and conventional
          1,5T MRI scans were not contributory.
