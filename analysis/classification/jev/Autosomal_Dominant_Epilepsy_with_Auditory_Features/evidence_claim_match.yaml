          currents and baseline intrinsic properties were similar. Enhanced spontaneous bursts were recorded
          in magnesium-free, low-calcium, high-potassium ACSF, which is a proconvulsant condition.
        modeled_mechanisms:
        - target: Increased Excitatory Synaptic Transmission
          relationship: MEASURES
          description: mEPSC frequency increases without a significant amplitude change; this is not a
            direct glutamate-concentration assay.
          fidelity: UNKNOWN
          readouts:
          - name: mEPSC frequency
            target: Increased Excitatory Synaptic Transmission
            direction: INCREASED
            interpretation: mEPSC frequency increases without a significant amplitude change; this is
              not a direct glutamate-concentration assay.
        - target: Epileptic Network Activity
          relationship: MEASURES
          description: Burst frequency increases under modified proconvulsant ACSF.
          fidelity: UNKNOWN
          readouts:
          - name: Epileptiform burst frequency
            target: Epileptic Network Activity
            direction: INCREASED
            interpretation: Burst frequency increases under modified proconvulsant ACSF.
        - target: Increased Intrinsic Neuronal Excitability
          relationship: FAILS_TO_RECAPITULATE
          description: Measured CA1 intrinsic properties are unchanged in this preparation.
          fidelity: UNKNOWN
          limitations: Cell region, developmental stage and preparation differ from cultured CA3 restoration
            experiments.
          readouts:
          - name: Baseline intrinsic firing properties
            target: Increased Intrinsic Neuronal Excitability
            direction: UNCHANGED
            interpretation: Measured CA1 intrinsic properties are unchanged in this preparation.
      selected_evidence:
        snippet: the spontaneous burst discharge frequency was significantly increased in the Lgi1-mutant
          mice
        supports: SUPPORT
        directness: DIRECT
