            term:
              id: MONDO:0010898
              label: autosomal dominant epilepsy with auditory features
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Anti-LGI1 Autoimmune Encephalitis
        description: Acquired LGI1-antibody limbic encephalitis is distinct from inherited ADEAF. Prominent
          subacute memory impairment, faciobrachial dystonic seizures, hyponatremia and antibodies support
          this differential; the usual response to immunotherapy does not justify immunotherapy for inherited
          ADEAF.
        distinguishing_features:
        - Acquired, usually subacute presentation rather than a Mendelian syndrome; absent family history
          alone is not discriminating.
        - Serum or CSF antibodies against LGI1.
        - Prominent amnesia and faciobrachial dystonic seizures rather than auditory auras.
        - Responds to immunotherapy.
      selected_evidence:
        snippet: Human autoantibodies against LGI1 associate with a form of autoimmune limbic encephalitis
          characterized by severe but treatable memory impairment and frequent faciobrachial dystonic
          seizures.
        supports: SUPPORT
        directness: DIRECT
    origin:
