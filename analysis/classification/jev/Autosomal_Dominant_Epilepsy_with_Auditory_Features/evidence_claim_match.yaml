        prompt: How do distinct LGI1 physiological effects produce the human focal epilepsy phenotype?
        kind: INTERPRETATION
        status: OPEN
        rationale: AMPA-mediated responses decrease in one null preparation and increase in another; baseline
          intrinsic properties can be unchanged in acute or intact hippocampus while cultured CA3 neurons
          show a Kv1-related deficit. Regional, developmental, allele and preparation differences matter.
          A compensatory AMPA-loss-to-hyperexcitability cascade is a hypothesis rather than a demonstrated
          common sequence. The cultured restoration study explicitly did not test synaptic rescue.
      selected_evidence:
        snippet: A lack of LGI1 disrupts this synaptic protein connection and selectively reduces AMPA
          receptor-mediated synaptic transmission in the hippocampus.
        supports: SUPPORT
