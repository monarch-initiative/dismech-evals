  02ce5d86e90bd11dd9d319a2bbe173a23ee2d265776d9a59a0596d9eaa7b58c9:
    claim:
      about:
        disease:
          name: Autosomal Dominant Epilepsy with Auditory Features
          disease_term:
            preferred_term: autosomal dominant epilepsy with auditory features
            term:
              id: MONDO:0010898
              label: autosomal dominant epilepsy with auditory features
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: LGI1 variant secretion and receptor-binding cell assays
        experimental_model_type: CELL_LINE
        description: 'Transfected-cell assays distinguish secretion-defective E383A from secretion-competent
          S473L with altered ADAM22 interaction. Later HEK293T secretion and COS7 binding assays studied
          biallelic-encephalopathy variants: C48F, S524P and a terminal extension. All had reduced net
          binding, while inferred relative binding differed; these assays did not determine an equilibrium
          affinity constant. Four-phenylbutyrate responses were allele dependent and were not human treatment
          outcomes.'
        modeled_mechanisms:
        - target: Reduced LGI1 Secretion
          relationship: MEASURES
          description: Cell-medium protein assays quantify reduced secretion for selected constructs.
          fidelity: UNKNOWN
          readouts:
          - name: Secreted LGI1
            target: Reduced LGI1 Secretion
            direction: DECREASED
            interpretation: Cell-medium protein assays quantify reduced secretion for selected constructs.
        - target: Reduced LGI1-ADAM22 Binding
          relationship: MEASURES
          description: The S473L construct shows an interaction defect distinct from secretion failure.
          fidelity: UNKNOWN
          readouts:
          - name: LGI1-ADAM22 interaction
            target: Reduced LGI1-ADAM22 Binding
            direction: DECREASED
            interpretation: The S473L construct shows an interaction defect distinct from secretion failure.
        notes: Heterologous overexpression and distinct dominant versus biallelic alleles limit direct
          translation. Five mM 4PBA for 72 hours increased C48F and wild-type secretion but reduced S524P
          and terminal-extension secretion in the later study.
      selected_evidence:
        snippet: The secretion-defective LGI1(E383A) protein was recognized by the ER quality-control
          machinery and prematurely degraded, whereas the secretable LGI1(S473L) protein abnormally dimerized
          and was selectively defective in binding to one of its receptors, ADAM22.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /experimental_models/2
      evidence_path: /experimental_models/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25485908
      reference_title: Chemical corrector treatment ameliorates increased seizure susceptibility in a
        mouse model of familial epilepsy.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: The abstract reports distinct cellular defects for two variants; neither mechanism
        is assumed universal.
