        prompt: How much does developmental circuit maturation contribute relative to continuing LGI1
          function?
        kind: KNOWLEDGE_GAP
        status: OPEN
        rationale: The 835delC transgene supports altered postnatal dendritic maturation, while conditional
          deletion at later postnatal stages still produces seizures and culture restoration changes intrinsic
          physiology. These studies do not establish a single irreversible developmental lesion or a requirement
          for a second hit. The dog LGI2 epilepsy and a proposed LGI2-to-LGI1 developmental handover concern
          a paralog and cannot establish a human ADEAF mechanism.
      selected_evidence:
        snippet: Concurrently, mutant LGI1 inhibited dendritic pruning and increased the spine density
          to markedly increase excitatory synaptic transmission.
        supports: SUPPORT
        directness: DIRECT
