      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing
        description: Use a phenotype-informed epilepsy panel including LGI1, RELN and MICAL1, with deletion/duplication
          or exome/genome testing as appropriate. A heterozygous pathogenic or likely pathogenic variant
          concordant with the phenotype can establish the molecular diagnosis. A VUS is not diagnostic;
          a negative result does not exclude a clinically defined syndrome. Absent family history can
          reflect reduced penetrance or a de novo variant.
        diagnosis_term:
          preferred_term: Molecular Analysis
          term:
            id: NCIT:C19770
            label: Molecular Analysis
        results: A phenotype-concordant pathogenic or likely pathogenic variant; negative or uncertain
          results require clinical interpretation.
      selected_evidence:
        snippet: The molecular diagnosis is established in a proband with characteristic clinical features
          and a heterozygous pathogenic variant in LGI1, MICAL1, or RELN identified by molecular genetic
          testing.
        supports: SUPPORT
        directness: DIRECT
