              S473L with altered ADAM22 interaction. Later HEK293T secretion and COS7 binding assays studied
              biallelic-encephalopathy variants: C48F, S524P and a terminal extension. All had reduced
              net binding, while inferred relative binding differed; these assays did not determine an
              equilibrium affinity constant. Four-phenylbutyrate responses were allele dependent and were
              not human treatment outcomes.'
            notes: Heterologous overexpression and distinct dominant versus biallelic alleles limit direct
              translation. Five mM 4PBA for 72 hours increased C48F and wild-type secretion but reduced
              S524P and terminal-extension secretion in the later study.
