              label: autosomal dominant epilepsy with auditory features
        context:
        - path: /experimental_models/1
          value:
            name: Local LGI1 restoration in organotypic hippocampal culture
            experimental_model_type: OTHER
            description: Organotypic slices from P7–10 homozygous-null mice of both sexes underwent single-cell
              electroporation of 8–10 selected neurons per slice. Inducible LGI1 expression was assessed
              with CA3 recordings after three days; extracellular tagged-protein visualization used a
              separate six-day interval. Intrinsic recordings blocked ionotropic glutamate and GABA receptors.
              Current, firing and AIS Kv1.1 rescue were measured in expressing cells; nearby rheobase
              improved, but nearby Kv1.1 staining was not significantly increased.
            notes: Counts generally represent neurons or AIS objects; animal/slice hierarchy is not explicit
              for each comparison. No human allele, patient-derived cell, selective secretion blockade,
              ADAM22 mediation experiment, living-animal seizure reduction or clinical efficacy was tested.
              Paracrine spread is supported but autocrine versus intracellular contributions remain unresolved.
          role: ancestor
        - path: /experimental_models/1/modeled_mechanisms/3
          value:
            target: Shortened Axon Initial Segment
            relationship: RESCUES
            description: AIS length recovers partially, without evidence that shortening causes the firing
              phenotype.
