        name: 4-Phenylbutyrate (Investigational Chemical Chaperone)
        description: Preclinical, allele-specific chemical-corrector research, not established clinical
          care. Earlier experiments reported 4PBA rescue of LGI1 E383A folding/binding and mouse seizure
          susceptibility. In a later biallelic-LGI1 study, 5 mM/72 h 4PBA increased secretion of C48F
          and wild type but reduced secretion of S524P and a terminal-extension variant in HEK293T cells.
          No human treatment or seizure-rescue outcome was measured in that later study; a secretion-defective
          label alone does not predict benefit.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
