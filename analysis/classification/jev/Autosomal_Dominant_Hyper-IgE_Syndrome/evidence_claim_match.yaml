              label: hyper-IgE recurrent infection syndrome 1, autosomal dominant
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: stat3_negative_dominance
        hypothesis_label: STAT3 negative dominance (dominant-negative), not haploinsufficiency
        status: CANONICAL
        description: 'The unifying molecular mechanism of AD-HIES is negative dominance: the mutant STAT3
          allele encodes a full-length (or reinitiated) non-functional protein that dimerizes with and
          inactivates wild-type STAT3, reducing activity below the level expected from simple loss of
          one allele. This is distinct from, and contrasted with, the older haploinsufficiency hypothesis.'
      selected_evidence:
        snippet: through negative dominance rather than haploinsufficiency.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
