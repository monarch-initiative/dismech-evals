            term:
              id: MONDO:0007818
              label: hyper-IgE recurrent infection syndrome 1, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: STAT3-dependent connective-tissue and skeletal program failure
        description: Because STAT3 transduces IL-11, leptin, and growth-factor signals in bone, vasculature,
          and craniofacial tissue, dominant-negative STAT3 disrupts non-immune programs. STAT3 normally
          restrains osteoclastogenesis; its loss increases osteoclast activity, producing osteopenia and
          fractures. Impaired IL-11/STAT3 signaling links to craniosynostosis and delayed exfoliation
          of deciduous teeth, and vascular STAT3 deficiency contributes to arterial tortuosity, ectasia,
          and aneurysm.
        cell_types:
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: osteoclast differentiation
          term:
            id: GO:0030316
            label: osteoclast differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: STAT3 mutant mice exhibit decreased bone density, bone volume, and increased numbers
          of TRAP-positive OC.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
