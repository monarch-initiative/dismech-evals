        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Th17 differentiation and IL-17/IL-22 immunity
        description: STAT3 is required downstream of IL-6 and IL-23 for RORgammat-driven Th17 development.
          Loss of IL-17A/F and IL-22 removes the signals that drive epithelial antimicrobial-peptide production
          and neutrophil recruitment to skin and lung, producing the characteristic susceptibility to
          Staphylococcus aureus and Candida albicans.
        cell_types:
        - preferred_term: T-helper 17 cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        - preferred_term: CD4-positive alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: T-helper 17 cell differentiation
          term:
            id: GO:0072539
            label: T-helper 17 cell differentiation
          modifier: DECREASED
        - preferred_term: interleukin-17 production
          term:
            id: GO:0032620
            label: interleukin-17 production
          modifier: DECREASED
        - preferred_term: defense response to bacterium
          term:
            id: GO:0042742
            label: defense response to bacterium
          modifier: DECREASED
        - preferred_term: defense response to fungus
          term:
            id: GO:0050832
            label: defense response to fungus
          modifier: DECREASED
      selected_evidence:
        snippet: Purified naive T cells were unable to differentiate into IL-17-producing (T(H)17) T helper
          cells in vitro and had lower expression of retinoid-related orphan receptor (ROR)-gammat, which
          is consistent with a crucial role for STAT3 signalling in the generation of T(H)17 cells.
        supports: SUPPORT
    origin:
