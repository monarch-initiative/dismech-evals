      assertion_type: Pathophysiology
      assertion:
        name: Blunted IL-6 acute-phase signaling
        description: Impaired IL-6-to-STAT3 signaling produces a reduced systemic inflammatory response
          despite deep infection, which is the basis for the characteristic "cold," under-inflamed staphylococcal
          abscesses, and contributes to defective antibody responses.
        biological_processes:
        - preferred_term: interleukin-6-mediated signaling pathway
          term:
            id: GO:0070102
            label: interleukin-6-mediated signaling pathway
          modifier: DECREASED
        - preferred_term: acute-phase response
          term:
            id: GO:0006953
            label: acute-phase response
          modifier: DECREASED
      selected_evidence:
        snippet: the cells from patients with the hyper-IgE syndrome generated lower levels of monocyte
          chemoattractant protein 1 in response to the presence of interleukin-6 (P=0.03), suggesting
          a defect in interleukin-6 signaling through its downstream mediators, one of which is STAT3.
        supports: SUPPORT
