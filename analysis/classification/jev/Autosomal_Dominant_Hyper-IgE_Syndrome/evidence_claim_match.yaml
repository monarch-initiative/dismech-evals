  4ff5224a7986613b8fd50a38bad56f40662b7b1b7df2e4bf7a6af549734a7149:
    claim:
      about:
        disease:
          name: Autosomal Dominant Hyper-IgE Syndrome
          disease_term:
            preferred_term: Autosomal Dominant Hyper-IgE Syndrome
            term:
              id: MONDO:0007818
              label: hyper-IgE recurrent infection syndrome 1, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: STAT3 dominant-negative dysfunction
        description: Heterozygous variants (predominantly missense and small in-frame deletions clustering
          in the DNA-binding and SH2 domains, but also out-of-frame variants acting through reinitiated
          neoproteins) produce a STAT3 protein that dimerizes with wild-type STAT3 and abolishes DNA binding
          and transactivation. STAT3 tyrosine phosphorylation is often preserved; the functional defect
          is downstream DNA binding/transcription across the entire STAT3 cytokine network (IL-6, IL-10,
          IL-11, IL-21, IL-22, IL-23).
        genes:
        - preferred_term: STAT3
          term:
            id: hgnc:11364
            label: STAT3
        biological_processes:
        - preferred_term: STAT3-dependent transcriptional output (DNA binding/transactivation)
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
        - preferred_term: JAK-STAT signaling
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
          modifier: DECREASED
      selected_evidence:
        snippet: dominant-negative mutations in the human signal transducer and activator of transcription
          3 (STAT3) gene result in the classical multisystem HIES.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
