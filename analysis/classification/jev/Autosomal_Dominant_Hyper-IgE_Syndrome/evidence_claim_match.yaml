        context: []
      assertion_type: Genetic
      assertion:
        name: STAT3
        association: Causative
        gene_term:
          preferred_term: STAT3
          term:
            id: hgnc:11364
            label: STAT3
        notes: Heterozygous dominant-negative variants in STAT3 (17q21.2) cause AD-HIES, predominantly
          missense substitutions and small in-frame deletions clustering in the DNA-binding and SH2 domains,
          but also out-of-frame variants that act through reinitiated truncated neoproteins. The unifying
          mechanism is negative dominance rather than haploinsufficiency. Variants are essentially absent
          from population databases and are most often de novo. STAT3 dominant-negative loss-of-function
          is mechanistically opposite to STAT3 gain-of-function, which causes a distinct early-onset autoimmunity/lymphoproliferation
          syndrome.
      selected_evidence:
        snippet: We identified missense mutations and single-codon in-frame deletions in STAT3 in 50 familial
          and sporadic cases of the hyper-IgE syndrome.
        supports: SUPPORT
