      assertion:
        discussion_id: adh1_in_vitro_activation_does_not_predict_response
        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#CASR
        - treatments#Calcilytic (Negative Allosteric Modulator of the CaSR)
        prompt: How well can cellular variant assays predict individual calcilytic response?
        rationale: The five-adult NPSP795 study found no significant correlation between its cellular
          assay readouts and clinical PTH response. Small sample size, brief exposure and within-allele
          variability limit this negative result. Leu723Arg demonstrates G11-biased signaling in HEK293
          cells, while other tested ADH1 variants activate multiple pathways. This establishes possible
          assay dependence but does not prove that signaling bias caused clinical nonresponse or short
          stature. Proposed residue contacts and genotype-guided drug selection require further validation.
      selected_evidence:
        snippet: Albeit all mutations appear to be activating at the CaR, in vitro observations were not
          predictive of the in vivo phenotype or the response to calcilytics, suggesting that other parameters
          impact the response to the drug.
        supports: SUPPORT
        directness: DIRECT
