        context: []
      assertion_type: Subtype
      assertion:
        name: Bartter type V
        display_name: ADH1 with Bartter syndrome type V
        description: Some activating CASR variants additionally cause a Bartter-like salt-wasting tubulopathy
          with hypokalemic metabolic alkalosis, hyperreninemia and hyperaldosteronism. CaSR-mediated inhibition
          of renal potassium recycling is a proposed route to impaired thick ascending limb salt transport.
          The historical label Bartter type V here denotes CASR-related disease; MAGED2-related transient
          antenatal Bartter syndrome is a different entity.
      selected_evidence:
        snippet: We describe two hypocalcaemic patients with deficient parathyroid hormone secretion who
          also showed characteristics of Bartter's syndrome. We found activating mutations of the gene
          for the calcium-sensing receptor (CASR) in both patients.
        supports: SUPPORT
        directness: DIRECT
    origin:
