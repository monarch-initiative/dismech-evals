      assertion:
        discussion_id: adh1_vs_adh2_and_hypoparathyroidism
        kind: INTERPRETATION
        attaches_to:
        - diagnosis#CASR Sequencing
        prompt: What does ADH1 need to be distinguished from, and why does the distinction change management?
        rationale: Low calcium with insufficient PTH occurs in ADH1, other genetic hypoparathyroidism
          and acquired parathyroid disorders. All may have renal treatment complications; urine calcium
          alone is not a definitive discriminator. Pathogenic activating CASR variants distinguish ADH1
          from GNA11-related ADH2 and from other molecular causes. Activating CaSR autoantibodies are
          an acquired phenocopy, but a negative CASR test also warrants assessment of other genetic causes,
          surgery, autoimmunity and magnesium disturbances.
      selected_evidence:
        snippet: Heterozygous germline gain-of-function mutations of G-protein subunit α11 (Gα11), a signaling
          partner for the calcium-sensing receptor (CaSR), result in autosomal dominant hypocalcemia type
          2 (ADH2).
        supports: SUPPORT
        directness: INDIRECT
