      assertion_type: Treatment
      assertion:
        name: Calcilytic (Negative Allosteric Modulator of the CaSR)
        therapeutic_modality: SMALL_MOLECULE
        description: 'Investigational negative allosteric modulators reduce CaSR signaling. A three-day
          NPSP795 study in five adults increased PTH without significant improvement in ionized calcium
          or fractional calcium excretion. An uncontrolled encaleret phase 2b study in 13 adults improved
          serum calcium and hypercalciuria over 24 outpatient weeks. The 2026 CALIBRATE conference report
          adds randomized phase 3 evidence: at week 24, 75.6% of encaleret participants achieved both
          blood and urine calcium targets, compared with 19% in the concurrent standard-care group. The
          primary comparison was separately within the encaleret arm against its own pretreatment standard-care
          period (75.6% versus 4.4%). These are biochemical endpoints reported in a conference abstract;
          long-term kidney protection is not established. FDA accepted the encaleret application in July
          2026, with approval still pending at review. AXT914 and related quinazolinones have preclinical
          evidence, not established clinical ADH1 efficacy.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: encaleret
            term:
              id: CHEBI:749959
              label: encaleret
      selected_evidence:
        snippet: More participants randomized to encaleret (75.6%) had cCa and UCa within the target ranges
          compared to those randomized to SoC
        supports: SUPPORT
        directness: DIRECT
