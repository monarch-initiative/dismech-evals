        - treatments#Calcitriol and Calcium Supplementation
        prompt: Why are symptoms and urinary calcium assessed together when titrating conventional treatment?
        rationale: PTH deficiency and direct renal CaSR effects can both impair calcium conservation.
          Baseline renal activation is allele- and calcium-dependent rather than obligatorily maximal
          in every patient. Raising serum calcium may recruit or worsen renal calcium losses, so symptom
          relief must be balanced against urine calcium and renal outcomes. This supports individualized
          targets, not withholding acute calcium treatment or assuming every patient has the same threshold.
      selected_evidence:
        snippet: treatment with vitamin D resulted in increased hypercalciuria, nephrocalcinosis, and
          renal impairment
        supports: SUPPORT
        directness: DIRECT
