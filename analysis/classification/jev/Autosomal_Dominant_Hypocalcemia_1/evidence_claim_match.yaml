      assertion_type: AnimalModel
      assertion:
        name: Nuf mouse (Casr Leu723Gln)
        species: Mouse
        genotype: Casr Leu723Gln (Nuf), heterozygous and homozygous
        publication: PMID:33103030
        description: The Nuf Leu723Gln allele arose in an isopropyl methane sulfonate mutagenesis screen
          for lens abnormalities. Heterozygotes and homozygotes develop low calcium and PTH; homozygotes
          have more severe manifestations. Baseline hypercalciuria is not reproduced reliably. It is one
          allele-specific model, not the complete human spectrum. The original pathology study found ectopic
          mineralization mainly in homozygotes; lens opacities reflected fiber damage without substantial
          lens mineralization. Cataracts are therefore not treated as a readout of renal calcium deposition.
        modeled_mechanisms:
        - target: Suppressed Parathyroid Hormone Secretion
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Low baseline PTH and an acute PTH rise after calcilytic treatment support suppressed
            secretion downstream of mutant CaSR.
          limitations: One allele, acute dosing and different drug exposures limit comparison with the
            human NPSP795 study. Mouse blood calcium improved without reaching untreated wild-type levels;
            neither this endpoint nor PTH directly measures receptor EC50.
          readouts:
          - name: Plasma PTH response to calcilytic
            target: Suppressed Parathyroid Hormone Secretion
            direction: RESTORED
            interpretation: PTH increased acutely after CaSR antagonism, providing a hormonal output readout
              rather than a direct receptor sensitivity assay.
        - target: Reduced Circulating Calcium
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Hypocalcemia and its partial pharmacological correction are observed in the Nuf
            model.
          limitations: Short-term single-dose mouse results do not establish equivalent human dosing,
            complete correction or durable renal benefit.
          readouts:
          - name: Plasma adjusted-calcium response to calcilytic
            target: Reduced Circulating Calcium
            direction: INCREASED
            interpretation: Calcium rose after a single dose but remained below untreated wild-type values.
              This integrated endpoint does not resolve direct renal and PTH-mediated contributions.
      selected_evidence:
        snippet: Nuf mice, which have hypocalcemia in association with a gain-of-function CaSR mutation,
          Leu723Gln
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /animal_models/0
