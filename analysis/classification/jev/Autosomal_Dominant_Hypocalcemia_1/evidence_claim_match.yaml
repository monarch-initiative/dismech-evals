        context: []
      assertion_type: Treatment
      assertion:
        name: Palopegteriparatide
        therapeutic_modality: PEPTIDE
        description: 'A long-acting PTH(1-34) prodrug approved by the FDA for adult hypoparathyroidism.
          ADH1-specific evidence remains limited: a broader pivotal trial included very few ADH1 patients,
          and a 2026 report described off-label treatment of one 16-year-old. Tetany resolved, calcium
          and phosphate balance improved, and active vitamin D and calcium were stopped while low-dose
          hydrochlorothiazide, magnesium and potassium continued. Urinary calcium improved in the reported
          follow-up, but persistent hypocalcemia and hyperphosphatemia and the uncontrolled design limit
          claims of complete correction or renal protection. Pediatric efficacy and long-term safety are
          not established.'
        treatment_term:
          preferred_term: Pharmacotherapy
