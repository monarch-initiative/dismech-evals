              label: autosomal dominant hypocalcemia 1
        context: []
      assertion_type: Genetic
      assertion:
        name: CASR
        gene_term:
          preferred_term: CASR
          term:
            id: hgnc:1514
            label: CASR
        relationship_type: CAUSATIVE
        notes: Most reported pathogenic variants are heterozygous missense changes, distributed across
          extracellular, transmembrane and intracellular domains. Deletions, a nonsense variant, parental
          mosaicism and a rare homozygous case have also been reported. Variant-specific expression and
          signaling effects matter; a five-person NPSP795 study did not establish a reliable relationship
          between cellular assays and clinical drug response. Loss-of-function CASR variants usually cause
          the opposite calcium phenotype and should not be interpreted as ADH1 merely because the gene
          matches.
      selected_evidence:
        snippet: Heterozygous loss-of-function mutations cause familial (benign) hypocalciuric hypercalcemia
          (FHH) in which the lifelong mild hypercalcemia is generally asymptomatic. Homozygous inactivating
          mutations give rise to neonatal severe hyperparathyroidism (NSHPT) with extreme hypercalcemia
          and marked skeletal changes. Heterozygous activating mutations of the CASR cause autosomal dominant
          hypocalcemia (ADH) that may be asymptomatic or present with seizures in the neonatal period
          or childhood or later in life.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
