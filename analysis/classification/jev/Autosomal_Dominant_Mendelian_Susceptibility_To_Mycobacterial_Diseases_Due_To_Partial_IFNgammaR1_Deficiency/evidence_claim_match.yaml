        features: IFNGR1 encodes the ligand-binding chain of the IFN-gamma receptor. Established dominant
          partial alleles truncate the intracellular domain in exon 6. They include small frameshift deletions
          (legacy 818del4, 811del4 and 774del4), the reported insertion 817insA, and the nonsense substitution
          E278X. Impaired receptor turnover and dominant-negative signaling distinguish these alleles
          from simple haploinsufficiency. These legacy names are retained without assigning an unreported
          transcript or converting coordinates.
