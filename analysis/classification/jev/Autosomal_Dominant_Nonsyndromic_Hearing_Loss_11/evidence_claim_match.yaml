      assertion_type: Diagnosis
      assertion:
        name: Distortion-product otoacoustic emissions as an early marker
        description: 'Outer hair cell function measured by distortion-product otoacoustic emissions can
          be abnormal before pure-tone thresholds move. This matters for a progressive disorder in which
          the mechanism is a maintenance failure at the stereocilia: the cellular lesion precedes the
          audiometric one, so a normal audiogram in an at-risk family member does not establish that the
          cochlea is unaffected.'
      selected_evidence:
        snippet: Some subjects showed partly abnormal results in the distortion products of otoacoustic
          emissions before the elevation of hearing thresholds.
        supports: SUPPORT
