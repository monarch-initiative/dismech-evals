  b80cf29052fb8ed93d5852263910848b7b7b8f96480ca46d0f1fee9f742029b8:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 11
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 11
            term:
              id: MONDO:0011032
              label: autosomal dominant nonsyndromic hearing loss 11
        context: []
      assertion_type: Genetic
      assertion:
        name: MYO7A
        notes: 'MYO7A is on 11q13.5, has 49 exons, and encodes the unconventional motor myosin VIIa, expressed
          in retina, lung, testis, kidney and inner and outer hair cells. It is an allelic series: DFNA11
          (dominant, hearing only), DFNB2 (recessive, hearing only) and USH1B (recessive, deaf-blind).
          Of 882 reported MYO7A variants only 35 cause dominant nonsyndromic hearing loss. The allele
          classes segregate by disease - dominant cases carry exclusively missense or in-frame deletion
          variants, recessive nonsyndromic cases carry at least one missense, and nearly half of Usher
          patients carry biallelic nulls.

          Within the dominant alleles there is a further, prognostic correlation by protein domain. Dominant
          variants cluster in the motor and MyTH4 domains; motor-domain missense variants give later onset
          with an ascending audiogram, while tail-domain variants give a severe audiological phenotype.
          This is the finer-grained form of the entry''s own allele-type thesis: allele class separates
          the three diseases, and within DFNA11 the affected domain modulates severity and onset.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MYO7A
          term:
            id: hgnc:7606
            label: MYO7A
        variants:
        - name: p.R206C
          description: A recurrent dominant allele reported in unrelated Taiwanese and mainland Chinese
            families, likely a mutation hot spot or founder allele. Its pathogenicity was initially ambiguous
            and was resolved by the second, clearly dominant family.
        - name: p.R853C
          description: An IQ5 allele at an evolutionarily invariant residue that abolishes calmodulin
            binding to the fifth IQ motif.
        - name: p.R668H
          description: 'A motor-domain allele that segregates dominantly in a family with the typical
            ascending DFNA11 audiogram, at a residue conserved across species and modelled as linking
            the lobes of the motor domain. Its measured effect is the one that does not fit the activation
            account: actin-activated ATPase activity is reduced, not raised. Curated because a dominant
            allele with diminished motor enzymology is the counterexample the allele-class discussion
            identifies as untested.'
      selected_evidence:
        snippet: The MYO7A gene is known to be responsible for both syndromic hearing loss (Usher syndrome
          type1B:USH1B) and non-syndromic hearing loss including autosomal dominant and autosomal recessive
          inheritance (DFNA11, DFNB2).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
