  fca5d2c86c7cc6a4b523720753db42883eb562680550f83516b45d09194dfa20:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 11
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 11
            term:
              id: MONDO:0011032
              label: autosomal dominant nonsyndromic hearing loss 11
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: myo7a_allele_type_determines_disease
        kind: KNOWLEDGE_GAP
        prompt: Do all DFNA11 alleles act by activating myosin VIIa, and can allele class be used prospectively
          to predict which of the three MYO7A diseases a newly found variant will cause?
        attaches_to:
        - pathophysiology#Constitutive Myosin VIIa Motor Activation
        - genetic#MYO7A
        rationale: 'The correlation is unusually clean for an allelic series. Dominant cases carry only
          missense and in-frame deletion variants; nearly half of Usher patients carry biallelic nulls;
          recessive nonsyndromic cases sit between, retaining at least one missense. And a mechanism now
          exists that would explain it, since many DFNA11 alleles activate Myo7A targeting in cultured
          cells.

          What is not established is whether the rule runs prospectively. Only a subset of DFNA11 alleles
          has been tested in the activation assay, and "many" is the word used, not all - so it is unknown
          whether the untested dominant alleles activate, whether some act by a dominant-negative route
          instead, and critically whether a *recessive* missense allele would fail to activate in the
          same assay. That last comparison is the one that would turn a correlation into a usable predictor,
          and it does not appear to have been run. Until it is, a novel MYO7A missense variant in an isolated
          case cannot be assigned to DFNA11 rather than DFNB2 on allele class alone. The assay exists
          and the alleles are published, so this is tractable now.

          One published dominant allele already points the other way. p.R668H segregates in a family with
          the typical DFNA11 audiogram, and its actin-activated ATPase activity was measured as reduced
          rather than raised. The two results are not strictly contradictory - ATPase turnover in a recombinant
          enzyme assay and motor-dependent targeting in a cell are different quantities, and a variant
          could plausibly lower one while de-repressing the other - but nobody has run both assays on
          the same allele, so that reconciliation is a hypothesis rather than a finding. It is the concrete
          reason this entry treats activation as the leading explanation and not as the established mechanism
          of the allele class.'
      selected_evidence:
        snippet: we demonstrate that many of the DFNA11 deafness mutations reported in patients activate
          Myo7A targeting, providing a potential explanation for the autosomal dominant genetics of this
          form of deafness
        supports: SUPPORT
