  17f5500d84e5508fbe3525ba64279f3aec67b1e5e256d2be81b38494e1220420:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 11
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 11
            term:
              id: MONDO:0011032
              label: autosomal dominant nonsyndromic hearing loss 11
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Ophthalmologic assessment to exclude Usher syndrome type 1B
        description: The step that makes the DFNA11 diagnosis rather than the MYO7A diagnosis. Finding
          a MYO7A variant does not distinguish DFNA11 from USH1B, and USH1B is the far commoner outcome
          at this locus, so retinal assessment - electroretinography plus ophthalmoscopy, with visual
          acuity, tonometry and slit-lamp examination - is what establishes the nonsyndromic label. It
          is the procedural basis of the entry's "Absence of Retinitis Pigmentosa" claim, and it is a
          longitudinal commitment rather than a one-off test in a child, since retinitis pigmentosa in
          Usher syndrome declares itself over years.
      selected_evidence:
        snippet: Selected subjects underwent additional examinations including speech discrimination scoring,
          acoustic reflex measurements, Békésy audiometry, evoked and distortion-product otoacoustic emissions,
          auditory brainstem responses, and bithermal caloric testing; visual acuity, ocular tonometry,
          slit-lamp examination, ophthalmoscopy, and electroretinography; and computed tomography of the
          temporal bone.
        supports: SUPPORT
