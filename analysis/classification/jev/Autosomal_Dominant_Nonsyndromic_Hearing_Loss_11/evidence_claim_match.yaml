  30fc9cbda5764fc72ec9a74d029b51e690c435d01da644f584e8305f31f4f9ac:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 11
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 11
            term:
              id: MONDO:0011032
              label: autosomal dominant nonsyndromic hearing loss 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of IQ-Motif Autoregulation
        description: 'Myosin VIIa''s motor activity is held in check by specific IQ motifs within its
          lever arm, and this regulation can operate at least partly independently of the tail. A DFNA11
          mutation at an invariant residue of IQ5 abolishes constitutive calmodulin binding to that motif
          across all physiologically relevant calcium concentrations.

          Reading the two lines together, the most economical account is that calmodulin occupancy of
          the IQ motifs is the brake, and DFNA11 alleles release it. State the caveat plainly though:
          the calmodulin study interpreted its own finding as impaired adaptation to environmental stimuli,
          not as de-repression of the motor. The reconciliation is an interpretation across two papers,
          not a claim either makes.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: calmodulin binding
          modifier: DECREASED
          term:
            id: GO:0005516
            label: calmodulin binding
      selected_evidence:
        snippet: Our findings reveal that Myo7A is regulated by specific IQ motifs within its lever arm,
          and that this regulation can function at least partially independent of its tail sequence.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
