          consequential thing to tell a newly diagnosed family.

          Curated as a REFUTED phenotype, and deliberately carrying NO phenotype_term and NO frequency.
          The schema has no negation slot and FrequencyEnum has no EXCLUDED value, so binding HP:0000510
          with a frequency here would export as the assertion that 80-99% of DFNA11 patients HAVE rod-cone
          dystrophy - the exact opposite of the point, and the most harmful edge this entry could emit
          given the MYO7A-Usher relationship. The REFUTE grading on the evidence item is claim-relative
          and never reaches the phenotype assertion, so it cannot substitute. This follows the pattern
          in Amyotrophic_Lateral_Sclerosis_27_Juvenile ("Absence of Sensory Neuropathy").'
        notes: The absence is not a guarantee for every MYO7A carrier - it is a statement about the DFNA11
          phenotype. The same gene causes Usher syndrome type 1B, where retinitis pigmentosa is a defining
          feature, so a patient carrying a MYO7A variant needs the allele type established, not the gene
          alone. See the diagnosis section for the ophthalmologic assessment that establishes it.
      selected_evidence:
        snippet: Showing moderate hearing loss with asymptomatic variable vestibular dysfunction and no
          retinal degeneration, the DFNA11 phenotype is mildest among phenotypes caused by MYO7A mutations.
        supports: SUPPORT
