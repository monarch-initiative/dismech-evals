            preferred_term: autosomal dominant nonsyndromic hearing loss 11
            term:
              id: MONDO:0011032
              label: autosomal dominant nonsyndromic hearing loss 11
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Usher syndrome type 1B
        description: 'The differential that matters at this locus, because it is the same gene. USH1B
          is caused by biallelic MYO7A variants and presents with congenital profound sensorineural hearing
          loss, vestibular areflexia, and retinitis pigmentosa. DFNA11 is heterozygous, postlingual and
          progressive, has at most subclinical vestibular involvement, and no retinopathy.

          The timing is what makes this a real diagnostic problem rather than a textbook distinction.
          Retinitis pigmentosa in USH1 develops in early adolescence, so a normal retinal examination
          in a young child does not distinguish the two - which is why the ophthalmologic assessment in
          this entry''s diagnosis section is a longitudinal commitment and not a one-off test.'
        distinguishing_features:
        - 'Zygosity and allele class: heterozygous missense or in-frame deletion in DFNA11, against biallelic
          variants often including nulls in USH1B.'
        - 'Onset and course: postlingual and progressive in DFNA11, against congenital and profound in
          USH1B.'
        - 'Vestibular function: normal to subclinically abnormal on caloric testing in DFNA11, against
          areflexia in USH1B.'
        - Retinal status on longitudinal electroretinography and ophthalmoscopy - longitudinal because
          a normal childhood examination does not distinguish the two.
      selected_evidence:
        snippet: RP, a progressive bilateral symmetric degeneration of photoreceptors in the retina, develops
          in early adolescence, resulting in progressively constricted visual fields first, due to rod
          photoreceptor cell loss, followed by impaired visual acuity due to cone photoreceptor cell loss.
        supports: SUPPORT
