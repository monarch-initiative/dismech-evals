        discussion_id: dfna11_audiometric_modifier
        kind: KNOWLEDGE_GAP
        prompt: What modifies DFNA11 severity and audiometric configuration within a single family carrying
          one MYO7A allele?
        attaches_to:
        - phenotypes#High-Frequency Hearing Impairment
        - pathophysiology#Progressive Stereocilia Dysfunction
        rationale: 'In one large American pedigree segregating a single MYO7A allele, low- and mid-frequency
          hearing loss ranges from mild to severe with roughly equal numbers at each end, and severity
          varies between generations. Vestibular function appears to track auditory severity in at least
          two individuals, which points to a modifier acting inside the inner ear rather than to measurement
          noise or environmental exposure. Two obvious candidates were tested and excluded: SNPs in ATP2B2
          and WFS1 did not segregate with the mild versus severe phenotype. The authors infer a common
          polymorphism not tightly linked to the MYO7A allele, which is a hypothesis about a genome-wide-mappable
          modifier that has not since been mapped. The unusual low- and mid-frequency configuration of
          this pedigree, against the high-frequency pattern typical elsewhere, may itself be the modifier''s
          signature rather than an allele effect.'
      selected_evidence:
        snippet: The degree of low- and mid-frequency hearing loss in HL2 family members segregating the
          MYO7A mutation varies from mild to more severe, with approximately the same number of HL2 family
          members falling at each end of the severity spectrum.
        supports: SUPPORT
