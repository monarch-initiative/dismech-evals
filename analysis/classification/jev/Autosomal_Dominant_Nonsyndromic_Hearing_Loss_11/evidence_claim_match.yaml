  858b04d24ef79c7d28b207129a7519619bf40d0e5e9fbf40e6785954f17bef9b:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 11
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 11
            term:
              id: MONDO:0011032
              label: autosomal dominant nonsyndromic hearing loss 11
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna11_no_in_vivo_model_of_activation
        kind: HUMAN_MODEL_MISMATCH
        prompt: Every in vivo model of MYO7A disease is a loss-of-function model, while DFNA11 is proposed
          to work by activating the motor. Does any animal reproduce the dominant activating mechanism,
          and until one does, what can the existing models actually be used to test?
        attaches_to:
        - pathophysiology#Constitutive Myosin VIIa Motor Activation
        - pathophysiology#Progressive Stereocilia Dysfunction
        rationale: 'This entry''s central claim is that DFNA11 alleles activate myosin VIIa rather than
          removing it, and that this is why they are dominant while nulls are recessive. The direct evidence
          for activation is a cultured kidney epithelial cell assay - a heterologous system chosen because
          it makes motor-dependent targeting visible, not because it resembles a hair cell.

          The in vivo literature does not currently test that claim. The mouse models are deletions, which
          by construction model the recessive and Usher end of the allelic series; the tensioning study
          curated on the stereocilia node is an isoform deletion. A deletion model can tell you what myosin
          VIIa normally does, and this entry uses it for exactly that, but it cannot tell you what a constitutively
          activated motor does to a stereocilium over decades - which is the specific claim DFNA11 rests
          on.

          The consequence is concrete rather than academic. The proposed mechanism predicts that a therapy
          restoring autoinhibition would help in DFNA11 and be useless or harmful in DFNB2 and USH1B,
          and there is currently no in vivo system in which that prediction could be tested. A knock-in
          of a human activating allele is the missing experiment.'
      selected_evidence:
        snippet: In mice with a specific deletion of the canonical isoform (Myo7a-ΔC mouse), MYO7A is
          severely diminished in inner hair cells (IHCs), while expression in outer hair cells is affected
          tonotopically.
        supports: SUPPORT
        directness: INDIRECT
