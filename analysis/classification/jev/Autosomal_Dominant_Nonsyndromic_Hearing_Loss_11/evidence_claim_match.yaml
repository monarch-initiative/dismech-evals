            term:
              id: MONDO:0011032
              label: autosomal dominant nonsyndromic hearing loss 11
        context: []
      assertion_type: Treatment
      assertion:
        name: Hearing Amplification
        description: 'Hearing aids, the first-line intervention. There is no disease-modifying therapy.
          What is specific to this disorder is the timing question rather than the modality: the loss
          is postlingual and progressive, so the clinically useful commitment is long-term audiological
          follow-up that catches deterioration early rather than a single fitting decision.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: hearing aid fitting
        target_phenotypes:
        - preferred_term: Postlingual sensorineural hearing impairment
          term:
            id: HP:0008596
            label: Postlingual sensorineural hearing impairment
        notes: 'treatment_term carries no NCIT binding, and the gap is specific to amplification. NCIT:C183182
          Hearing Aid is a device concept, not reachable from NCIT:C25218 Clinical Intervention or Procedure,
          and NCIT has no clinical-action term for hearing-aid fitting, so a free-text preferred_term
          is what the ontology contract asks for. Do not generalise this to cochlear implantation, curated
          separately below: that is a surgical procedure and does bind.'
      selected_evidence:
        snippet: A long audiological follow-up is of paramount importance to identify hearing threshold
          deteriorations early and ensure prompt treatment with hearing aids or cochlear implants.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
