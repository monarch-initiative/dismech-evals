  8cf66ae4217b1b6d7d119849aa34199934380fdad084488f2315101626debdf9:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 11
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 11
            term:
              id: MONDO:0011032
              label: autosomal dominant nonsyndromic hearing loss 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Constitutive Myosin VIIa Motor Activation
        description: 'Many reported DFNA11 mutations activate the motor-dependent targeting of Myo7A to
          the tips of apical microvilli in cultured epithelial cells. The authors present this as a potential
          explanation for the dominant inheritance of DFNA11 - an activated motor would poison the normal
          one in trans or mislocalise cargo, whereas simply having half the normal amount would not.

          The genetic evidence corroborates this independently: dominant cases carry only missense and
          in-frame deletion alleles, while nulls appear in the recessive and Usher populations. Two lines
          of evidence of different kinds converging is what raises this above a cell-culture observation.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: microfilament motor activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0000146
            label: microfilament motor activity
        notes: 'The GO binding is `microfilament motor activity` (GO:0000146) with modifier GAIN_OF_FUNCTION.
          The claim is qualitative - the motor escapes its normal regulatory constraint - not that motor
          activity is merely quantitatively higher, which is why GAIN_OF_FUNCTION rather than INCREASED.

          The term names activity rather than binding on purpose. A binding term would describe where
          the motor sits; the claim here is about what it does once autoinhibition is lost.'
      selected_evidence:
        snippet: we demonstrate that many of the DFNA11 deafness mutations reported in patients activate
          Myo7A targeting, providing a potential explanation for the autosomal dominant genetics of this
          form of deafness
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
