              label: autosomal dominant nonsyndromic hearing loss 12
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: DFNB21, recessive TECTA deafness
        description: Biallelic TECTA variants cause DFNB21. Loss-of-function alleles often underlie recessive
          disease, but missense alleles can also be recessive, and sequence consequence alone cannot assign
          inheritance. The 2011 report noted a truncating allele in two members of a dominant pedigree
          but could not exclude incidental carrier status or a missed second allele. Assess zygosity,
          phase, segregation and variant-specific evidence.
      selected_evidence:
        snippet: Sequence analysis of the TECTA gene in the DFNB21-affected family revealed a G to A transition
          in the donor splice site (GT) of intron 9, predicted to lead to a truncated protein of 971 amino
          acids.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9949200
      reference_title: An alpha-tectorin gene defect causes a newly identified autosomal recessive form
        of sensorineural pre-lingual non-syndromic deafness, DFNB21.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the truncating allele class that produces the recessive disease.
