      assertion_type: Discussion
      assertion:
        discussion_id: audiogenic_seizure_in_tecta_mice
        kind: OPEN_QUESTION
        prompt: Do Tecta mutations confer any central auditory phenotype in humans, given that all three
          allele-matched mouse models develop audiogenic seizures?
        attaches_to:
        - animal_models#Tecta L1820F,G1824D/+ mouse (ZP domain)
        - animal_models#Tecta C1619S/+ mouse (ZA domain)
        - animal_models#Tecta C1837G/+ mouse (ZP domain)
        rationale: C1619S, C1837G and L1820F/G1824D mice exhibited wild running predictive of seizures
          at low sound levels. The authors stopped stimulation early and could not complete the planned
          high-noise experiments. Central adaptation and other mechanisms remain hypotheses; a corresponding
          human phenotype was not established. This result cannot be assigned to the separate C1509G experiment.
      selected_evidence:
        snippet: Despite elevated auditory thresholds, the Tecta mutant mice all exhibit an enhanced tendency
          to have audiogenic seizures in response to white noise stimuli at low sound pressure levels
          (≤84 dB SPL), revealing a previously unrecognised consequence of Tecta mutations.
        supports: SUPPORT
