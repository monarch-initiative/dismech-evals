      assertion_type: Genetic
      assertion:
        name: TECTA
        notes: TECTA encodes the modular extracellular glycoprotein alpha-tectorin. Dominant and recessive
          disease must be distinguished using variant interpretation, zygosity, segregation and clinical
          findings; sequence consequence alone is insufficient. The 2011 study increased the then-known
          dominant alleles from 13 to 33, a historical count rather than a current total. Most variants
          in that series were private. Founder evidence differed between recurrent alleles and populations.
          Penetrance is not quantified here. Unchanged total RNA for c.5999G>A does not demonstrate normal
          protein abundance or secretion.
        gene_term:
          preferred_term: TECTA
          term:
            id: hgnc:11720
            label: TECTA
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: In aggregate, we identified 23 TECTA mutations in this process. Remarkably, 20 of these
          mutations are novel, more than doubling the number of reported TECTA ADNSHL mutations from 13
          to 33.
        supports: SUPPORT
