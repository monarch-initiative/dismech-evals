      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous Pathogenic TECTA Variant
        biological_scale: MOLECULAR
        description: 'Heterozygous pathogenic variants occur across the entactin/NIDO, zonadhesin-like
          and zona pellucida domains of TECTA. The 2011 study screened a Spanish cohort without audiogram
          preselection and an American subset selected by audiogram. Dominant alleles include missense
          changes and coding variants that alter splicing: c.5999G>A produces two in-frame exon-20 deletions.
          A sequence-level missense annotation alone therefore does not identify the molecular consequence.'
        genes:
        - preferred_term: TECTA
          term:
            id: hgnc:11720
            label: TECTA
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          gene:
            preferred_term: TECTA
            term:
              id: hgnc:11720
              label: TECTA
          notes: Includes missense and splice-altering alleles. Dominant-negative action is the prevailing
            model; variant-specific protein consequences require functional evidence.
      selected_evidence:
        snippet: Mutations lie in all domains of the α-tectorin protein, including those for the first
          time identified in the entactin domain, as well as the vWFD1, vWFD2, and vWFD3 repeats, and
          the D1-D2 and TIL2 connectors.
        supports: SUPPORT
