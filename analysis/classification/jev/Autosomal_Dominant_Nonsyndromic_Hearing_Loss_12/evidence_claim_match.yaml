        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mouse_does_not_progress
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why do allele-matched Tecta mice not show the progression seen in the patients carrying
          the same substitution, and can any mouse be used to study progression in this disease?
        attaches_to:
        - animal_models#Tecta C1619S/+ mouse (ZA domain)
        - animal_models#Tecta C1509G/+ mouse
        - pathophysiology#Secondary Outer Hair Cell Vulnerability
        - animal_models#Tecta C1837G/+ mouse (ZP domain)
        rationale: C1619S and C1837G mice lacked progressive threshold deterioration over the studied
          intervals despite progression in corresponding human families. C1509G emission thresholds were
          stable in quiet through six months; after noise, recovery and cell-loss distribution differed
          from wild type without greater total loss in the sampled region. Lifespan, genetic background
          and cumulative exposure are candidate explanations, not established causes of the mismatch.
          The studied conditions lack a spontaneous progression endpoint.
      selected_evidence:
        snippet: The present study reports linkage to DFNA12 in a new family with autosomal dominant high
          frequency hearing loss progressing from mild to moderate severity.
        supports: SUPPORT
    origin:
