        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: dominant_negative_tectorin_incorporation
        hypothesis_label: Dominant-negative disruption of tectorial membrane organization
        status: CANONICAL
        description: The contrast between unaffected heterozygous carriers of a recessive TECTA allele
          and dominant missense families supports a dominant-negative model. Allele-matched mice show
          matrix defects distinct from simple heterozygous null states. These findings do not prove normal
          secretion, abundance or physical incorporation for every dominant mutant protein. For c.5999G>A,
          patient RNA shows abnormal in-frame splicing without reduced total transcript abundance; the
          protein-level mechanism remains inferred.
      selected_evidence:
        snippet: Comparison of the phenotype of the DFNB21 heterozygous carriers with that of DFNA8/12-affected
          individuals supports the hypothesis that the TECTA mutations which cause the dominant form of
          deafness have a dominant-negative effect.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
