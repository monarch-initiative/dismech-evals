          left out of rate_per_100000; it also counts all MYH9-associated hearing loss (MYH9-RD and DFNA17
          together) rather than DFNA17 alone. Filling the numeric slot with it would have put ~1 in 650
          in a structured field alongside a `prevalence_class` of ULTRA_RARE (<1 in 1,000,000) - a three-order-of-magnitude
          contradiction inside one record, which any consumer reading the numeric slot would get wrong.
          The counts survive in this note and in the two evidence items below. No population prevalence
          for DFNA17 has been published.
      selected_evidence:
        snippet: In this study, we identified 24 patients from 18 families with MYH9-associated hearing
          loss.
        supports: SUPPORT
