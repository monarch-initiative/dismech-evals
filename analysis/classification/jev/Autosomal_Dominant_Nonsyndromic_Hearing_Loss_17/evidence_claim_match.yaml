            preferred_term: DFNA17
            term:
              id: MONDO:0011350
              label: autosomal dominant nonsyndromic hearing loss 17
        context: []
      assertion_type: Treatment
      assertion:
        name: Cochlear Implantation
        description: 'Direct electrical stimulation of the cochlear nerve for severe-to-profound loss,
          the endpoint most DFNA17/MYH9 patients reach. Outcome is reported as discordant between the
          only two DFNA17 kindreds published at the time: excellent in the Australian family, "poor" in
          the original American family, despite the identical p.Arg705His allele. The authors nevertheless
          concluded that implantation should be strongly considered. That discordance is curated rather
          than averaged away - with n=2 families it is as likely to reflect implantation era, duration
          of deafness, or measurement differences as anything biological.

          '
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: cochlear implantation
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        target_phenotypes:
        - preferred_term: Progressive sensorineural hearing impairment
          term:
            id: HP:0000408
            label: Progressive sensorineural hearing impairment
      selected_evidence:
        snippet: Thus, cochlear implants should be strongly considered for clinical management of patients
          with DFNA17 deafness.
        supports: SUPPORT
