        - path: /animal_models/0
          value:
            name: Heterozygous gene-trap Myh9 mouse (BayGenomics ES cell line)
            species: Mouse
            genotype: Myh9 gene-trap, heterozygous (homozygotes embryonic lethal)
            publication: PMID:16630581
            description: 'A gene-trap knockout allele, so this models *loss* of Myh9 rather than the human
              missense change. Its negative result is exactly what makes it informative: half-normal inner-ear
              Myh9 mRNA produced no hearing loss and no cochleosaccular degeneration even in aged animals.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Cochleosaccular Degeneration
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: Heterozygous Myh9 loss does not reproduce the human inner-ear lesion, which argues
          that DFNA17 is not caused by simple haploinsufficiency and that the p.Arg705His protein must
          do something a missing protein does not.
