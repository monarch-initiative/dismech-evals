        biological_scale: MOLECULAR
        description: A heterozygous c.2114G>A missense change converting an invariant arginine at codon
          705 to histidine, within the highly conserved SH1 linker of non-muscle myosin heavy chain IIA.
          The SH1 helix is the joint connecting the converter subdomain to the rest of the motor domain,
          which is why a substitution here was expected to affect motor function rather than expression
          level.
        genetic_context:
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
      selected_evidence:
        snippet: This missense mutation changes codon 705 from an invariant arginine (R) to histidine
          (H), R705H, within a highly conserved SH1 linker region.
        supports: SUPPORT
