      assertion_type: Treatment
      assertion:
        name: AAV-mediated VGLUT3 Gene Replacement
        therapeutic_modality: GENE_THERAPY
        description: Preclinical gene replacement has restored auditory responses in homozygous null mice
          after neonatal cochlear AAV1 delivery, adult intracisternal delivery through the cochlear aqueduct,
          and AAV8 injection at five weeks with assessment 27 weeks later. The latter does not demonstrate
          reversal after treatment of already aged animals. These interventions have not established efficacy
          in dominant A211V disease; augmentation, suppression or combined strategies require variant-specific
          testing. No human SLC17A8 interventional study was identified in the reviewed research; the
          registered NCT01802190 study is observational.
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: These findings represent a successful restoration of hearing by gene replacement in mice,
          which is a significant advance toward gene therapy of human deafness.
        supports: SUPPORT
