  4a821f90cc7c690ddd0a9056eaf676e8c79c9dab3cb8f4c36c531f89f74c5c2e:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 25
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 25
            term:
              id: MONDO:0011568
              label: autosomal dominant nonsyndromic hearing loss 25
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Slc17a8 null mouse
        species: Mouse
        genotype: Slc17a8 (Vglut3) exon 2 targeted deletion, homozygous null
        publication: PMID:18674745
        description: Homozygous Slc17a8 null mice model complete loss of vesicular glutamate transmission
          with profound hearing loss and extra-cochlear effects including seizures. The published vestibular
          study found strongly reduced quantal transmission but relatively preserved spontaneous vestibular
          nerve activity and most balance tests, with some assay differences. Nonquantal compensation
          is proposed; this is not proof of normal human vestibular function.
        modeled_mechanisms:
        - target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The release failure and its localisation to vesicle content rather than fusion,
            both measured directly in the correct cell type.
          limitations: Homozygous null mice model complete VGLUT3 loss, not the heterozygous human genotypes.
            Congenital profound deafness and mouse epilepsy do not reproduce the typical progressive nonsyndromic
            presentation.
          readouts:
          - name: Calcium-triggered synaptic vesicle turnover in inner hair cells
            target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
            direction: UNCHANGED
            interpretation: Exocytosis itself is normal. A deliberate negative result, and the one that
              makes the defect a cargo defect rather than a release-machinery defect.
          - name: Ribbon synapse ultrastructure at three months
            target: Impaired Glutamate Release at the Inner Hair Cell Ribbon Synapse
            direction: UNCHANGED
            interpretation: Surviving ribbons appeared normal in this line at three months despite reduced
              synapse numbers. Other null-model studies reported altered ribbon shape; this result is
              specific to this study.
        - target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The three-way dissociation - no acoustic neural response, intact emissions, intact
            electrically evoked brainstem response - measured in one animal.
          limitations: Detailed human OAE/ABR testing in the 2003 report concerns one proband. The mouse
            dissociation cannot establish the physiology of all carriers or clinical implant outcomes.
          readouts:
          - name: Otoacoustic emissions
            target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
            direction: UNCHANGED
            interpretation: Outer hair cell amplification is preserved, placing the lesion downstream
              of the cochlear amplifier. A negative result, and the load-bearing one.
          - name: Electrically evoked auditory brainstem response
            target: Failure of Auditory Nerve Activation with Preserved Cochlear Amplification
            direction: UNCHANGED
            interpretation: The ascending auditory pathway can still be driven when the defective synapse
              is bypassed, which is the observation that makes cochlear implantation biologically plausible
              in this disease.
        - target: Secondary Deafferentation of the Inner Hair Cell
          relationship: RECAPITULATES
          fidelity: LOW
          description: The afferent synapses, spiral ganglion neurons and lateral efferent endings decline
            after the functional deficit is established.
          limitations: The null model has complete congenital loss of signaling and developmental neuronal
            effects. Human onset is variable and usually later; human synapse-count evidence is lacking
            in the reviewed sources.
          readouts:
          - name: Afferent synapse and spiral ganglion neuron counts
            target: Secondary Deafferentation of the Inner Hair Cell
            direction: DECREASED
            interpretation: The afferent population beneath the inner hair cell falls over time in the
              null animal.
      selected_evidence:
        snippet: We propose that non-quantal transmission is sufficient to support vestibular nerve physiology
          and behavioral function in Vglut3 −/− mice.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1038/s41598-026-43836-7
      reference_title: Persistence of vestibular function in the absence of glutamatergic transmission
        from hair cells
      evidence_source: MODEL_ORGANISM
      explanation: The published study proposes a compensatory explanation from mouse physiology and behavioral
        tests; some assay differences and limited sampling preclude universal normality.
      quote_role: PRIMARY_RESULT
