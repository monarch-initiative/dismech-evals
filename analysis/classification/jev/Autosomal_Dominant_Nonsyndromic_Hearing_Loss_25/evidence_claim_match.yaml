              id: MONDO:0011568
              label: autosomal dominant nonsyndromic hearing loss 25
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous SLC17A8 Variant
        role: trigger
        biological_scale: MOLECULAR
        description: The founding c.632C>T (p.A211V) variant segregated in two families with evidence
          of distant shared ancestry and was absent from 267 controls. Later reports include c.616dupA
          (p.M206Nfs*4) and c.763+1G>T. The 2016 frameshift report sequenced one proband from an affected
          pedigree; it did not demonstrate segregation across all eight affected relatives. Predicted
          truncation and splice disruption do not establish a shared dominant mechanism.
        genetic_context:
          gene:
            preferred_term: SLC17A8
            term:
              id: hgnc:20151
              label: SLC17A8
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: 'Reported disease-associated alleles are heterozygous. The entry does not assign
            one functional-impact category across missense, frameshift and splice variants: human dominance
            and normal heterozygous-null mouse hearing do not by themselves distinguish dosage loss, dominant-negative
            effects or other mechanisms.'
      selected_evidence:
        snippet: The A211 residue is conserved in VGLUT3 across species and in all human VGLUT subtypes
          (VGLUT1-3), suggesting an important functional role.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18674745
      reference_title: Impairment of SLC17A8 encoding vesicular glutamate transporter-3, VGLUT3, underlies
        nonsyndromic deafness DFNA25 and inner hair cell dysfunction in null mice.
      evidence_source: HUMAN_CLINICAL
      explanation: The conservation argument the founding paper rests the missense call on.
