        description: OTOF-related hearing loss is a presynaptic disorder with recessive inheritance, contrasting
          with dominant SLC17A8 disease. Typical clinical patterns can guide testing, but overlapping
          and atypical presentations require molecular interpretation. Null-mouse physiology and sparse
          human emission data do not reliably distinguish every patient.
      selected_evidence:
        snippet: Null mice with a targeted deletion of Slc17a8 exon 2 lacked auditory-nerve responses
          to acoustic stimuli, although auditory brainstem responses could be elicited by electrical stimuli,
          and robust otoacoustic emissions were recorded.
        supports: SUPPORT
