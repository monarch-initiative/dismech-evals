              label: autosomal dominant nonsyndromic hearing loss 25
        context:
        - path: /animal_models/1
          value:
            name: VGLUT3 A224V knock-in mouse
            species: Mouse
            genotype: Slc17a8 p.A224V knock-in (mouse equivalent of human p.A211V), homozygous
            publication: PMID:34783032
            description: The allele-matched model, and the reason this entry carries two hypothesis groups.
              A single point mutation was introduced into exon 5 of mouse Slc17a8, exchanging the codon
              for the alanine that corresponds to human A211. It reproduces the progressive course the
              null mouse does not, and it reaches a different conclusion about where the disease starts.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Inner Hair Cell Stereocilia Bundle Disruption
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Collapse and fusion of the inner hair cell stereocilia bundles, with outer hair cell
          bundles spared - the model's primary structural finding.
        limitations: Homozygosity differs from human dominant inheritance. The C57BL/6J Cdh23 background
          may modify the bundle phenotype; this has not been separated experimentally. No corresponding
          human cochlear morphology was demonstrated.
        readouts:
        - name: Inner hair cell stereocilia bundle morphology by scanning electron microscopy
          target: Inner Hair Cell Stereocilia Bundle Disruption
          direction: ALTERED
          interpretation: Inner hair cell bundles collapse; outer hair cell bundles do not. The contrast
            within the same cochlea is what makes this a cell-type-specific lesion rather than general
            degeneration.
      selected_evidence:
        snippet: These results suggest that DFNA25 stems from a failure in the mechano-transduction followed
          by a change in synaptic transfer.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1/modeled_mechanisms/0
      evidence_path: /animal_models/1/modeled_mechanisms/0/evidence/0
