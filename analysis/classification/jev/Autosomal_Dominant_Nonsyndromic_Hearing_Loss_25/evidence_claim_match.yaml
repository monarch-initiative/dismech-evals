      assertion_type: Pathophysiology
      assertion:
        name: Altered VGLUT3 Function in the Inner Hair Cell
        role: central_effector
        biological_scale: MOLECULAR
        description: 'VGLUT3 supports glutamate loading into inner hair cell synaptic vesicles. Null mice
          lack functional auditory afferent transmission, but human A211V does not abolish uptake or quantal
          signaling in tested heterologous/autaptic preparations. Central-terminal protein reduction in
          the knock-in cannot be assumed in cochlear cells: the 2021 study found comparable inner hair
          cell VGLUT3 immunofluorescence and distribution between genotypes. Variant-specific effects
          therefore remain important.'
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        molecular_functions:
        - preferred_term: vesicular L-glutamate transport by VGLUT3
          term:
            id: GO:0005313
            label: L-glutamate transmembrane transporter activity
        biological_processes:
        - preferred_term: glutamate loading into inner hair cell synaptic vesicles
          term:
            id: GO:0098700
            label: neurotransmitter loading into synaptic vesicle
        cellular_components:
        - preferred_term: inner hair cell synaptic vesicle
          term:
            id: GO:0008021
            label: synaptic vesicle
      selected_evidence:
        snippet: This variation does not impair the glutamate vesicular accumulation, neither the quantal
          release nor the quantal content in hippocampal autaptic neurons
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34783032
      reference_title: VGLUT3-p.A211V variant fuses stereocilia bundles and elongates synaptic ribbons.
      evidence_source: IN_VITRO
      explanation: A negative result at the level of transport itself, which is why this entry does not
        assert that the human missense allele simply stops glutamate loading. Graded IN_VITRO because
        the measurement is in cultured autaptic neurons.
      quote_role: BACKGROUND
