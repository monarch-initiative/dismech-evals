  862d7dfade9499a900cb1cf84238af8d5da0add1cc397910d754334ce19ae5cb:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 2A
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 2A
            term:
              id: MONDO:0010817
              label: autosomal dominant nonsyndromic hearing loss 2A
        context: []
      assertion_type: Treatment
      assertion:
        name: Allele-Preferential Antisense Oligonucleotide Knockdown
        description: 'ASO-123 is a 2′-MOE-wing/DNA-gap RNase H gapmer with a phosphorothioate backbone
          and 5-methylcytosine. In W277S heterozygous mice, a 15-μg round-window injection at P1–P3 preferentially
          reduced mutant transcript and partially improved hearing, outer hair cell survival and physiology
          through seven weeks. Preference is dose dependent: 30 μg also reduced wild-type transcripts
          and reduced pup survival. Benefit was incomplete and declined with time; neonatal mouse delivery
          does not establish efficacy, dosing or a treatment window in people. Human W276S selectivity
          was tested separately in transfected cells.'
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        oligonucleotide_details:
          oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
          target_gene:
            preferred_term: KCNQ4
            term:
              id: hgnc:6298
              label: KCNQ4
          target_transcript: mutant KCNQ4 mRNA (p.W276S allele)
          oligonucleotide_chemistry: TWO_PRIME_O_METHOXYETHYL
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: In a Kcnq4 p.W277S knockin mouse model mimicking DFNA2, ASO-123 preferentially suppressed
          mutant transcripts, attenuated progressive hearing loss, and improved outer hair cell survival
          while enhancing their electrophysiologic function.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40898620
      reference_title: Antisense oligonucleotide therapy mitigates autosomal dominant progressive hearing
