      assertion_type: Pathophysiology
      assertion:
        name: KCNQ4 Dominant-Negative Subunit Incorporation
        description: Several pathogenic pore-region variants suppress wild-type Kv7.4 current when coexpressed,
          consistent with dominant-negative interference in tetrameric channels. The strength of suppression
          and the effect of subunit stoichiometry vary by allele. A universal rule that any single mutant
          subunit completely disables every channel is not established for all KCNQ4 variants. Gating
          defects and dominant-negative behavior need not be mutually exclusive.
        biological_scale: MOLECULAR
        genetic_context:
          functional_impact_category: DOMINANT_NEGATIVE
        molecular_functions:
        - preferred_term: voltage-gated potassium channel activity
          term:
            id: GO:0005249
            label: voltage-gated potassium channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: Co-expression of wt and KCNQ4 pore mutants suppressed currents to barely detectable levels.
        supports: SUPPORT
