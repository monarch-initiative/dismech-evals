            term:
              id: MONDO:0010817
              label: autosomal dominant nonsyndromic hearing loss 2A
        context: []
      assertion_type: Treatment
      assertion:
        name: Adenine Base Editing of the Pathogenic Allele
        description: Dual AAV-ie split-ABE8e was delivered through the posterior semicircular canal at
          P2–P3 to mice carrying Kcnq4 G322S, equivalent to human G321S. The often-quoted 21.4–28.9% DNA
          correction was measured in bulk organ of Corti from homozygotes at three weeks; heterozygous
          baseline-adjusted DNA values were 7.9–16.7%. These are not percentages of corrected outer hair
          cells. In heterozygotes, the lower dose sustained partial hearing benefit to 32 weeks, with
          maximal 49.09-dB threshold improvement at 32 kHz at 20 weeks. Higher dose gave faster early
          improvement but earlier later deterioration. Cochlear inflammation, increased RNA A-to-I editing
          and systemic editor exposure limit a blanket safety claim. Human G321S correction was demonstrated
          in cells; clinical efficacy remains unestablished.
        therapeutic_modality: GENE_EDITING
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: 'A dose-dependent therapeutic window emerged: higher doses promoted rapid recovery, whereas
          optimized lower doses minimized long-term toxicity and sustained functional benefit for at least
          32 weeks.'
        supports: SUPPORT
