        gene_term:
          preferred_term: KCNQ4
          term:
            id: hgnc:6298
            label: KCNQ4
        notes: KCNQ4 encodes Kv7.4. Dominant-negative pore defects, altered voltage sensing, and proposed
          dosage effects are overlapping mechanistic categories, not an exhaustive partition. W276S is
          a recurrent pathogenic hotspot. Functional gain of current has also been observed, notably for
          forced WT-G319D channels, but the 2021 study classified G319D and R331Q as VUS; cell effects
          do not establish pathogenicity. The 9.5% estimate comes from six KCNQ4 diagnoses among 63 autosomal
          dominant diagnoses in a 1,119-person referred testing cohort, not a worldwide prevalence. Human
          G321S corresponds to mouse G322S in the 2026 base-editing study.
      selected_evidence:
        snippet: Pathogenic variants in KCNQ4 account for ~9.5% of autosomal dominant nonsyndromic cases.
        supports: SUPPORT
