        hypothesis_group_id: variant_specific_channel_gating
        hypothesis_label: Variant-specific gating and phosphoinositide dependence modify KCNQ4 channel
          function
        status: EMERGING
        description: R216H shifts channel activation toward more positive potentials. In a separate heterologous
          study, WT-R331Q forced heteromers respond to PIP2 augmentation or openers, whereas WT-G319D
          forced heteromers are hyperactive and can be downregulated. G319D and R331Q were VUS in that
          study, so these findings describe experimental channel mechanisms rather than established human
          mechanistic subtypes. Linopirdine reduced the hyperactive forced WT-G319D current to the WT-WT
          level; intracellular poly-L-lysine also reduced current. These are in-vitro pharmacology results
          without demonstrated human benefit.
      selected_evidence:
        snippet: Our analysis revealed that R216H impaired the voltage dependence of channel opening and
          both VSD activation components
        supports: SUPPORT
        directness: DIRECT
