            term:
              id: MONDO:0010817
              label: autosomal dominant nonsyndromic hearing loss 2A
        context: []
      assertion_type: Treatment
      assertion:
        name: KCNQ Channel Openers
        description: Experimental retigabine and zinc pyrithione potentiate KCNQ4 current. Homomeric pore
          mutants and forced mutant-containing concatemers can remain unresponsive, while WT-plus-pore-mutant
          coexpression permits restoration of total current, probably through residual wild-type homomers.
          Failure to repair a mutant channel therefore does not prove that a pore-variant carrier cannot
          benefit. Clinical efficacy is not established by these cell experiments. R331Q response is a
          separate forced-heteromer finding in a variant classified as VUS by the source.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: retigabine
            term:
              id: CHEBI:68584
              label: ezogabine
          - preferred_term: zinc pyrithione
            term:
              id: CHEBI:32076
              label: zinc pyrithione
      selected_evidence:
        snippet: DFNA2 mutations located in the channel's pore region abolished channel function and these
          mutant channels were completely unresponsive to channel openers.
        supports: REFUTE
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21951272
      reference_title: Restoration of ion channel function in deafness-causing KCNQ4 mutants by synthetic
        channel openers.
      evidence_source: IN_VITRO
      explanation: Nonresponse of mutant channels limits direct repair of those channels. It does not
        refute total-current rescue in WT-plus-mutant coexpression or establish a patient exclusion rule.
