        description: 'ASO-123 is a 2′-MOE-wing/DNA-gap RNase H gapmer with a phosphorothioate backbone
          and 5-methylcytosine. In W277S heterozygous mice, a 15-μg round-window injection at P1–P3 preferentially
          reduced mutant transcript and partially improved hearing, outer hair cell survival and physiology
          through seven weeks. Preference is dose dependent: 30 μg also reduced wild-type transcripts
          and reduced pup survival. Benefit was incomplete and declined with time; neonatal mouse delivery
          does not establish efficacy, dosing or a treatment window in people. Human W276S selectivity
          was tested separately in transfected cells.'
