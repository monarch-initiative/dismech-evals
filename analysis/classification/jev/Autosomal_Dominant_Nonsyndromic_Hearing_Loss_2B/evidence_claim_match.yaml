        description: 'The ClinGen Hearing Loss Gene Curation Expert Panel classifies the autosomal dominant
          GJB3-nonsyndromic hearing loss relationship as Disputed, approved 2018-02-27. Its evidence summary
          is unusually explicit about why: the association rested on case-level data only, many reported
          variants are present at high frequency in population databases or have no evidence for pathogenicity,
          and only three variants had enough evidence to score.'
        notes: 'The same expert panel classifies GJB3-erythrokeratodermia variabilis as Definitive. One
          gene, two curations by the same group, opposite verdicts - which is the cleanest possible demonstration
          that a gene''s disease relationships have to be assessed one at a time.

          The assertion''s evidence summary cites PMID 12759707 among the publications in which the association
          was seen. Looked up at PubMed, that identifier is a 2003 Spanish-language editorial on smoking
          prevention in Anales del Sistema Sanitario de Navarra, so it is evidently a transcription error
          in the ClinGen record rather than a hearing-loss report. It is cited nowhere in this entry,
          and no attempt was made to guess which publication was intended.'
      selected_evidence:
        snippet: GJB3 | HGNC:4285 | nonsyndromic genetic hearing loss | MONDO:0019497 | AD | Disputed
        supports: REFUTE
