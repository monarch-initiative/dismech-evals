        description: 'Autosomal dominant inheritance is the proposed historical model, not a confirmed
          recurrence-risk model for a GJB3 finding. Absence of reported family history in all 23 p.Arg180*
          carriers in one cohort supplies no segregation support, but does not logically exclude dominant
          inheritance: family ascertainment, age-dependent penetrance or de novo occurrence can affect
          pedigrees. A 50% chance of transmitting a heterozygous allele must not be presented as a 50%
          chance of GJB3-related hearing loss while pathogenicity is unresolved.'
