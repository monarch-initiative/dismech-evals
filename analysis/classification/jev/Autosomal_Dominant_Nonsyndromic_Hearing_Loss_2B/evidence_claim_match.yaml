      assertion:
        name: GJB3
        gene_term:
          preferred_term: GJB3
          term:
            id: hgnc:4285
            label: GJB3
        relationship_type: DISPUTED
        notes: ClinGen classifies the dominant nonsyndromic hearing-loss relationship as DISPUTED, distinct
          from the definitive EKV relationship. A GJB3 variant alone is not a confirmed molecular diagnosis
          of hearing loss. Missense and truncating alleles have been reported, but variant-specific functional
          effects do not resolve the gene-disease dispute. The common screening allele p.Arg180* was classified
          VUS in the 2023 case-control paper. GJB2/SLC26A4 co-occurrence requires independent assessment
          of pathogenicity, zygosity and phase. A 2018 family report proposed digenic GJB2/GJB3 inheritance
          after testing 127 hearing-loss genes; this is a proposed multigenic explanation, not confirmation
          of monogenic DFNA2B. A 2022 R98H family had diverse skin and auditory phenotypes; the son with
          hearing loss received limited hotspot testing, whereas exome sequencing was performed only in
          the mother and daughter. Alternative causes in the son were not comprehensively excluded.
      selected_evidence:
        snippet: In summary, there is convincing evidence disputing the association between GJB3 and autosomal
          dominant nonsyndromic hearing loss.
        supports: REFUTE
