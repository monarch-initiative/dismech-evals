      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cx31_gap_junction_deafness
        hypothesis_label: Trafficking-defective connexin 31 disrupts cochlear gap-junction coupling and
          causes dominant high-frequency hearing loss
        status: ALTERNATIVE
        description: Selected GJB3 variants alter connexin 31 localization, induce cellular stress or
          reduce coupling in transfected cells. These effects provide a candidate molecular basis for
          the disputed auditory association, but neither expression in auditory tissue nor abnormal heterozygous
          coexpression proves clinical pathogenicity or a dominant-negative mechanism. Dominant disease
          could involve dosage reduction, dominant interference or toxic gain of function. The normal
          hearing of surviving Gjb3-null mice challenges a simple loss-of-function model but does not
          test a heterozygous toxic missense allele. The cited evidence does not establish the proposed
          cellular-to-human auditory chain.
      selected_evidence:
        snippet: No morphological or functional defects of skin or inner ear were observed in surviving
          adult Gjb3(-/-) mice.
        supports: REFUTE
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
