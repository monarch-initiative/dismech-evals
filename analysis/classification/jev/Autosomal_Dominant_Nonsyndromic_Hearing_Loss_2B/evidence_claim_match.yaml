      assertion_type: Prevalence
      assertion:
        population: Chinese hearing-loss cohorts
        measure_type: CARRIER_FREQUENCY
        prevalence_class: UNKNOWN
        notes: Disease prevalence is unknown. In a Chinese series, p.Arg180* heterozygotes occurred in
          23/5,700 hearing-loss cases (0.40%) and 11/4,600 normal-hearing controls (0.24%), without a
          significant difference. Eleven case carriers had additional GJB2 or SLC26A4 variants, which
          require their own genotype and pathogenicity assessment. No family history was reported, but
          this alone does not exclude dominant inheritance. A second study of 689 hearing-loss and 1,489
          control subjects found p.Arg180* allele frequencies of 0.29% and 0.30%. Most participants were
          infants, limiting assessment of adult-onset effects. These are allele or carrier frequencies,
          not DFNA2B prevalence. A separate 284-patient survey sequenced GJB3 in 188 remaining patients
          and found V84I in two heterozygous cases and a homozygous normal-hearing control. A selected
          cohort of 100 GJB2 heterozygotes reported one putative GJB3 contribution; rarity alone neither
          confirms nor refutes causality.
      selected_evidence:
        snippet: Of the 5700 patients, 23 (0.40%) carried a GJB3 c.538C>T heterozygous variant; of these,
          11 patients had other gene (GJB2/SLC26A4) mutations simultaneously.
        supports: SUPPORT
