    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 37
          disease_term:
            preferred_term: hearing loss, autosomal dominant 37
            term:
              id: MONDO:0032802
              label: hearing loss, autosomal dominant 37
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Proposed Alteration of Cochlear Collagen XI Organization
        description: Altered collagen XI structure or interactions could disturb tectorial-membrane organization
          and cochlear mechanics. Patient matrix deficiency, fibril disorganization and impaired mechanotransduction
          have not been demonstrated. The exon-5 deletion is predicted to remove residues 218–260; the
          heparan-sulfate binding motif discussed in the original paper lies at 147–152 and is not literally
          within that deleted interval. Altered binding is a hypothesis. Normal hearing in heterozygous
          functional-null mice argues against treating reduced gene dosage as an established explanation.
        biological_scale: TISSUE
        cellular_components:
        - preferred_term: collagen type XI trimer
          term:
            id: GO:0005592
            label: collagen type XI trimer
        molecular_functions:
        - preferred_term: Extracellular matrix structural constituent
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
