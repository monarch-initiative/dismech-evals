              label: hearing loss, autosomal dominant 37
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COL11A1 Canonical Splice-Site Disruption
        description: The heterozygous intronic substitutions c.652-2A>C and c.652-1G>C alter the intron
          4 acceptor; c.4338+2T>C alters a donor site (NM_080629.2 notation). The donor variant is c.4302+2T>C
          on NM_001854.4 in ClinGen. Their splice effects were tested in minigenes. The two acceptor substitutions
          produce different transcript products. These are the splice-site cases, not the complete DFNA37
          variant spectrum. A coding missense annotation alone neither proves nor excludes an effect on
          splicing.
        biological_scale: MOLECULAR
        role: genetic_trigger
        genes:
        - preferred_term: COL11A1
          term:
            id: hgnc:2186
            label: COL11A1
        genetic_context:
          gene:
            preferred_term: COL11A1
            term:
              id: hgnc:2186
              label: COL11A1
          variant_type: single nucleotide variant
          genomic_contexts:
          - intron
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact: Variant-specific altered splicing demonstrated in minigene assays; protein
            mechanism unresolved.
          notes: Canonical splice-signal substitutions. No gain-of-function, dominant-negative or haploinsufficiency
            category is inferred from this RNA result.
      selected_evidence:
        snippet: two German families presenting prelingual autosomal dominant nonsyndromic hearing loss
          with novel COL11A1 heterozygous splice-altering variants (c.652-1G>C and c.4338+2T>C) that were
          molecularly characterized
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33169910
      reference_title: Aberrant COL11A1 splicing causes prelingual autosomal dominant nonsyndromic hearing
        loss in the DFNA37 locus.
      evidence_source: HUMAN_CLINICAL
      explanation: Two additional families carry different splice-site variants; only c.652-1G>C affects
        the same acceptor as the original family.
