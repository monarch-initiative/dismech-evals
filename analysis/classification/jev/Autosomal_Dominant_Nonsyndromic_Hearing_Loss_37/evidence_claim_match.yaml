        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Collagen XI Alpha-1 Transcript Processing
        description: The c.652-2A>C minigene produced both normal exon-5-containing RNA and an exon-5-skipped
          product, predicting an in-frame loss of residues 218–260 in the N-terminal propeptide. The neighboring
          c.652-1G>C variant instead activated cryptic acceptors with predicted four- or five-residue
          deletions. The donor c.4338+2T>C predominantly skipped exon 57 in-frame and also yielded minor
          intron-retention products in the later minigene study. These assays establish RNA processing
          defects in expression systems. Transcript proportions in patient cochlea, protein abundance,
          secretion and assembly were not measured.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: In contrast, cells transfected with the mutant vector yielded two bands; one at 372 bp
          corresponding to the wild-type allele and the second at 234 bp lacking exon 5.
        supports: SUPPORT
        directness: DIRECT
