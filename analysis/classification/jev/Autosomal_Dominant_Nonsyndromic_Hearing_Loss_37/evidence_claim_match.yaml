          the relationship to syndromic COL11A1 disease. A heterozygous parent has a 50% probability of
          transmitting the allele; recurrence counseling for siblings depends on parental results and
          possible mosaicism. Do not assign a fixed hearing-loss risk from a VUS or presume that all relatives
          will have the same clinical course.
        therapeutic_modality: OTHER
