      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: collagen_xi_matrix_mechanism
        hypothesis_label: Altered collagen XI organization may connect variant-specific RNA defects to
          hearing loss
        status: EMERGING
        description: Splicing assays demonstrate RNA changes, but protein quantity and fibril assembly
          remain untested. Altered folding, extracellular interactions or residual function may contribute.
          The normal auditory responses of cho/+ mice limit a simple haploinsufficiency explanation; they
          do not prove dominant negativity for human DFNA37 alleles. Domain position and transcript outcome
          may influence the nonsyndromic presentation. Splice-site class alone cannot explain it, because
          syndromic COL11A1 disease also commonly involves splice alterations. Missense family segregation
          and screening frameshifts require variant-level evaluation rather than automatic mechanistic
          unification.
      selected_evidence:
        snippet: Because the N-propeptide domain plays a role in the establishment of molecular interactions
          with several extracellular matrix molecules and cellular proteins such as heparan sulfate proteoglycans
          and calcium, its alteration might impair its binding affinity for these molecules.
        supports: SUPPORT
        directness: INDIRECT
