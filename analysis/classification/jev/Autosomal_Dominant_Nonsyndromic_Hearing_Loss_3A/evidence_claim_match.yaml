  c882a2aec76f2f35cc49c25b2c0df90cfc810cbc9438e87d46a68327a7f7dddb:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 3A
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 3A
            term:
              id: MONDO:0011103
              label: autosomal dominant nonsyndromic hearing loss 3A
        context: []
      assertion_type: Treatment
      assertion:
        name: Experimental GJB2 Transcript Silencing
        therapeutic_modality: SIRNA
        description: An early proof-of-concept co-delivered human GJB2 p.Arg75Trp plasmid and siRNA to
          adult mouse round windows, reduced transgene RNA by more than 70% and attenuated the acute ABR
          threshold shift at 72 hours. Selectivity exploited two human–mouse sequence mismatches; the
          siRNA also silenced endogenous human GJB2 in cultured cells. This was transient prevention of
          experimentally induced hearing loss, not reversal of an established inherited lesion or demonstrated
          mutant-versus-wild-type discrimination in humans. Separately, p.Asp50Asn-selective siRNA improved
          channel phenotypes in patient-derived KID keratinocytes; that is a different allele and tissue.
          Durable cochlear delivery, human allele selectivity and safety require further study.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        oligonucleotide_details:
          oligonucleotide_mechanism: RNAI_KNOCKDOWN
          target_gene:
            preferred_term: GJB2
            term:
              id: hgnc:4284
              label: GJB2
          target_transcript: human GJB2 mRNA, including the p.Arg75Trp transcript in the acute mouse transfection
            model
      selected_evidence:
        snippet: In a mouse model, this siRNA duplex selectively suppressed GJB2(R75W) expression by >70%
          of control levels, thereby preventing hearing loss.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15857852
      reference_title: In vitro and in vivo suppression of GJB2 expression by RNA interference.
      evidence_source: MODEL_ORGANISM
      explanation: Full-paper methods and discussion show acute co-delivery and human–mouse sequence discrimination.
