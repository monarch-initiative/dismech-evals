            term:
              id: MONDO:0011103
              label: autosomal dominant nonsyndromic hearing loss 3A
        context: []
      assertion_type: Treatment
      assertion:
        name: AAV-Delivered Adenine Base Editing
        therapeutic_modality: GENE_EDITING
        description: 'Preclinical adenine base editing of p.Arg75Trp restored neurobiotin transfer in
          an engineered HeLa model and improved gap-junction plaque morphology in mouse cochlear supporting
          cells. The study used P0 cochlear explants and intracochlear delivery to adult transgenic mice
          aged 9–30 weeks, with morphology assessed two weeks later. In HeLa cells, 46.8% on-target editing
          included bystander changes; 28.03% reads were corrected without bystanders. Adult plaque improvement
          does not establish auditory rescue: baseline ABR characterized the model, but no post-treatment
          hearing-rescue result was reported. Functional treatment windows, durability, delivery and editing
          safety remain unresolved.'
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: In a transgenic mouse model with the GJB2 R75W mutation, AAV-mediated base editing also
          restored the fragmented GJPs to orderly outlines in cochlear supporting cells.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40059830
      reference_title: AAV-mediated base editing restores cochlear gap junction in GJB2 dominant-negative
        mutation-associated syndromic hearing loss model.
      evidence_source: MODEL_ORGANISM
      explanation: Plaque morphology is structural evidence; channel function was tested in HeLa cells,
        not directly in the treated cochlea.
      quote_role: PRIMARY_RESULT
