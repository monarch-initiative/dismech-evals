      assertion_type: Genetic
      assertion:
        name: GJB2
        gene_term:
          preferred_term: GJB2
          term:
            id: hgnc:4284
            label: GJB2
        relationship_type: CAUSATIVE
        notes: Interpret GJB2 at the allele level. Dominant nonsyndromic cases include p.Trp44Cys, p.Arg75Trp
          and p.Asp46Asn; the latter families share a founder haplotype and are not independent variant
          observations. p.Arg75Trp and p.Arg75Gln can present with or without cutaneous manifestations.
          p.Met34Thr is pathogenic for recessive hearing loss with variable expressivity and incomplete
          penetrance, not an established DFNA3A allele. A historical dominant-family report of c.299_300delAT
          does not by itself establish dominant causation or haploinsufficiency for a truncating allele.
      selected_evidence:
        snippet: In this study, we present two families with autosomal dominant nonsyndromic hearing loss
          caused by a novel mutation in GJB2 (p.Asp46Asn).
        supports: SUPPORT
        directness: DIRECT
