        name: Dominant-Negative Impairment of Connexin 26 Channels
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: p.Trp44Cys co-expressed with wild-type connexin 26 at an equal ratio in Xenopus oocytes
          strongly reduces intercellular conductance and alters residual gating. The recessive p.Trp77Arg
          comparator does not inhibit wild-type channel formation or gating in the same assay. p.Arg75Trp
          forms hemichannels with altered voltage dependence and reduced permeability but fails to form
          functional intercellular channels; its dominant effect is at the gap-junction channel level.
          These results establish functional interference, not degradation of wild-type protein or exclusive
          proof of a docking defect. Dominant inheritance and clinical scope still require human evidence;
          an in-vitro inhibition assay alone is insufficient.
        molecular_functions:
