            label: potassium ion transmembrane transport
      selected_evidence:
        snippet: These results suggest that the GJB2 mutation disturbs homeostasis of cortilymph, an extracellular
          space surrounding the sensory hair cells, due to impaired K(+) transport by supporting cells,
          resulting in degradation of the organ of Corti, rather than affecting endolymph homeostasis
          in mice and probably in humans.
        supports: SUPPORT
        directness: INDIRECT
