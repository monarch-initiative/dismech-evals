  45240c544a4a9bf37202c2ab40e8a3a7e70c1e3fc49d0a0ecf132c5e56f10c1c:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 3A
          disease_term:
