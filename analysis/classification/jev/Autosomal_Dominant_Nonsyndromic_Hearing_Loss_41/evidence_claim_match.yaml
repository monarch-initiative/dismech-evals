            term:
              id: MONDO:0011994
              label: autosomal dominant nonsyndromic hearing loss 41
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna41_carrier_noise_dose_response
        kind: KNOWLEDGE_GAP
        prompt: How much noise is too much for a P2RX2 carrier? Is there a dose below which a carrier
          is no worse off than a non-carrier, and does hearing conservation started before onset change
          the trajectory?
        attaches_to:
        - environmental#Occupational and recreational noise exposure
        - treatments#Hearing Conservation and Noise Avoidance
        - phenotypes#Noise-Exacerbated High-Frequency Hearing Impairment
        rationale: Human evidence relates recalled occupational exposure to hearing thresholds. Mouse
          experiments establish protocol-specific susceptibility but do not define a safe human carrier
          dose or show the benefit of a conservation program. A longitudinal cohort with dosimetry, audiometry
          and genotype-negative relatives could quantify the interaction.
        proposed_experiments:
        - experiment_id: exp_dfna41_carrier_noise_dosimetry_cohort
          name: Longitudinal noise dosimetry in P2RX2 carriers and non-carrier relatives
          description: Enrol carriers and genotype-negative relatives from known DFNA41 kindreds, measure
            cumulative noise exposure by personal dosimetry rather than by questionnaire, and follow pure
            tone and extended high-frequency audiometry annually. Model threshold change against cumulative
            dose separately by genotype to estimate whether the exposure-response curve is shifted and
            by how much.
          would_support:
          - phenotypes#Noise-Exacerbated High-Frequency Hearing Impairment
          supporting_outcome:
          - Carriers show a steeper threshold-versus-dose slope than non-carrier relatives, with separation
            beginning at exposures within current occupational limits, which would justify genotype-specific
            exposure advice and give a number to give patients.
          would_refute:
          - phenotypes#Noise-Exacerbated High-Frequency Hearing Impairment
          refuting_outcome:
          - No association between measured exposure and excess carrier decline would weaken a genotype-specific
            exposure-response claim; general hearing-conservation advice would still apply.
      selected_evidence:
        snippet: Similarly, among family members heterozygous for P2RX2 p.V60L, noise exposure exacerbated
          high-frequency hearing loss in young adulthood.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
