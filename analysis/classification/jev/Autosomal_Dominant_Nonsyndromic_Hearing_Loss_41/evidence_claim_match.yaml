          currents and cochlear partition conductance.
        limitations: Homozygous deletion differs from heterozygous human missense disease. Heterozygous
          null mice retained temporary-threshold adaptation. Background strain and noise protocol also
          limit extrapolation; constitutive and altered-gating effects of missense variants are not modeled
          by a null.
