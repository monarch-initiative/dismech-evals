        description: Heterozygous disease-causing P2RX2 variants segregate with dominant hearing loss.
          Full penetrance was reported in the original p.Val60Leu index pedigree; it is not established
          for every P2RX2 variant. A heterozygous affected parent has a 50% probability of transmitting
          the variant per pregnancy, independently of the severity or timing of expression.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Genomic analysis of dominantly inherited, progressive sensorineural hearing loss DFNA41
          in a six-generation kindred revealed a rare heterozygous allele, P2RX2 c.178G > T (p.V60L),
          at chr12:133,196,029, which cosegregated with fully penetrant hearing loss in the index family,
          and also appeared in a second family with the same phenotype.
        supports: SUPPORT
        directness: DIRECT
