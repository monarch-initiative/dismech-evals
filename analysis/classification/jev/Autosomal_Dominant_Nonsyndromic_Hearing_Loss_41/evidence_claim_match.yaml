              label: autosomal dominant nonsyndromic hearing loss 41
        context: []
      assertion_type: AnimalModel
      assertion:
        name: P2rx2 V61L knock-in mouse treated with AAV-delivered SaCas9
        species: Mouse
        genotype: P2rx2 V61L/+ knock-in treated with AAV2 SaCas9-sgRNA targeting the mutant allele
        publication: PMID:41090360
        description: Local AAV2–SaCas9 editing of heterozygous p.Val61Leu mice preserved hearing at selected
          frequencies and attenuated noise-induced loss. Four-week treatment preserved low/mid-frequency
          responses for nine months; juvenile treatment broadened benefit. Cell survival and vestibular
          readouts also improved. Assays found no detectable cochlear target-site AAV integration at the
          tested dose, but cultured cells showed dose-dependent integration.
        genes:
        - preferred_term: P2RX2
          term:
            id: hgnc:15459
            label: P2RX2
        modeled_mechanisms:
        - target: Noise-Exacerbated High-Frequency Hearing Impairment
          relationship: RESCUES
          fidelity: MODERATE
          description: Editing rescues the noise-susceptibility endpoint in mice. It does not directly
            measure restoration of ATP-dependent conductance or temporary-threshold adaptation.
          limitations: The noise challenge and treatment ages are mouse-specific. Auditory preservation
            was frequency-limited, not complete normalization. Human guide testing was confined to cultured
            cells. No detected off-target or integration event in specified assays does not establish
            comprehensive safety.
          readouts:
          - name: Resistance to noise-induced hearing loss after editing
            target: Noise-Exacerbated High-Frequency Hearing Impairment
            direction: RESTORED
            interpretation: Attenuation of additional ABR threshold loss after the specified noise challenge;
              not proof of restoration of purinergic adaptation.
        - target: Progressive Sensorineural Hearing Impairment
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Editing preserves auditory responses at selected frequencies, separately from the
            noise-susceptibility rescue.
          limitations: Auditory preservation was frequency-limited, not complete normalization, and treatment
            ages are mouse-specific.
          readouts:
          - name: Auditory function after editing
            target: Progressive Sensorineural Hearing Impairment
            direction: INCREASED
            interpretation: Preservation of selected-frequency auditory responses relative to untreated
              ears; vestibular testing was a separate endpoint.
      selected_evidence:
        snippet: Intervention in mice at a juvenile stage broadens the frequency range rescued, highlighting
          the importance of early intervention.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /animal_models/2
      evidence_path: /animal_models/2/evidence/0
      context_paths:
      - /name
