              label: autosomal dominant nonsyndromic hearing loss 41
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inner Hair Cell and Ribbon Synapse Disorganisation
        description: 'Heterozygous p.Val61Leu mice show shortened inner hair cells and abnormal perinuclear
          positioning of ribbon synapses. Early abnormalities occurred without overt hair-cell loss; ribbon
          counts were increased at four months rather than simply depleted. Later degeneration was documented
          in the genome-editing study. These model findings are not established human temporal-bone pathology.

          The knockout noise experiments independently measured loss of ribbon-synapse puncta and afferent
          terminals after intense exposure. Noise-induced synapse attrition and spontaneous knock-in ribbon
          mislocalization are distinct findings. Their molecular connection to altered P2X2 gating remains
          uncertain.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: Abnormal morphology of the inner hair cells and ribbon synapses was progressively observed
          in KI animals suggesting that P2rx2 plays a role in the membrane spatial location of the ribbon
          synapses.
        supports: SUPPORT
        directness: DIRECT
