      assertion_type: Diagnosis
      assertion:
        name: Audiologic and Molecular Diagnosis
        description: Assess onset, progression, bilateral thresholds, speech understanding, family history
          and noise exposure. Use a multigene hearing-loss panel or genomic testing with variant interpretation;
          targeted family testing is appropriate once a causal variant is known. Normal childhood hearing
          does not exclude later loss, but childhood presentations also occur. A P2RX2 VUS, including
          an allele with conflicting population evidence, does not confirm DFNA41. Consider coexisting
          mitochondrial or other causes when clinically indicated.
      selected_evidence:
        snippet: All affected subjects had bilateral sensorineural hearing loss involving all frequencies
          with some significant gender differences.
        supports: SUPPORT
        directness: DIRECT
