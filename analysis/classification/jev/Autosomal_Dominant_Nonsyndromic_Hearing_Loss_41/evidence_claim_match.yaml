              id: MONDO:0011994
              label: autosomal dominant nonsyndromic hearing loss 41
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Variant-Specific P2X2 Channel Dysfunction
        description: 'P2RX2 p.Val60Leu and p.Gly353Arg alter P2X2 channel function. Early p.Val60Leu experiments
          found absent ATP-evoked current and reduced ATP-stimulated dye uptake. Subsequent studies found
          constitutive ATP-insensitive conductance for p.Val60Leu and ATP-responsive p.Gly353Arg channels
          with altered sensitivity, rectification and ion selectivity. In 2025, p.Val60Leu showed fluorescent-ATP
          binding, small ATP-evoked currents and reduced cell viability; constitutive activity was not
          reproduced under those conditions. These findings support abnormal gating and coupling rather
          than universally absent channels or ATP binding.

          Wild-type/mutant coexpression reduced permeability in the original study, but a later coexpression
          study retained robust ATP responses and argued against poisoning of wild-type P2X2. The dominant
          clinical inheritance is established for these alleles; its precise molecular basis remains disputed.
          P2X2/P2X3 heteromer experiments are distinct from mutant/wild-type P2X2 coexpression. Functional
          abnormalities of the uncertain p.Asp201Tyr/p.Asp273Tyr variant do not independently prove human
          disease causality.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: P2RX2
          term:
            id: hgnc:15459
            label: P2RX2
        genetic_context:
          gene:
            preferred_term: P2RX2
            term:
              id: hgnc:15459
              label: P2RX2
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Heterozygous germline P2RX2 missense variants with allele-specific channel abnormalities;
            dominant-negative interference is proposed but contested. The Iranian variant is missense
            on the matched reference transcript, despite its original stop-loss annotation on an alternate
            transcript.
        molecular_functions:
        - preferred_term: extracellularly ATP-gated monoatomic cation channel activity
          term:
            id: GO:0004931
            label: extracellularly ATP-gated monoatomic cation channel activity
          modifier: ABNORMAL
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Both P2X2 V60L and P2X2/3 V60L cell lines with an induction of expression showed a decrease
          in the luminescence signal 48 h after induction.
        supports: SUPPORT
        directness: INDIRECT
