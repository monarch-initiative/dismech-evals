          name: Autosomal Dominant Nonsyndromic Hearing Loss 41
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 41
            term:
              id: MONDO:0011994
              label: autosomal dominant nonsyndromic hearing loss 41
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna41_null_versus_heterozygous_mechanism
        kind: HUMAN_MODEL_MISMATCH
        prompt: How do allele-specific channel changes in heterozygous carriers affect purinergic adaptation,
          and which mechanisms explain progressive loss?
        attaches_to:
        - pathophysiology#Loss of Purinergic Adaptation to Elevated Sound Levels
        - animal_models#P2rx2 null mouse
        rationale: 'Null-mouse physiology establishes an adaptive P2X2 pathway. Dominant missense disease
          is not equivalent to partial gene deletion: heterozygous null mice retained adaptation, p.Val60Leu
          shows assay-dependent gating abnormalities, and dominant-negative effects on wild-type P2X2
          are contested. Editing improves noise-susceptibility endpoints without directly testing temporary-threshold
          adaptation.'
        proposed_experiments:
        - experiment_id: exp_dfna41_tts_in_heterozygous_knockin
          name: Temporary threshold adaptation in P2rx2 V61L heterozygous mice
          description: Compare genotype-matched and background-matched knock-in, null, heterozygous-null
            and wild-type mice using baseline-adjusted ABR/DPOAE noise protocols and ATP-evoked cochlear
            measurements. Include edited knock-in ears to test whether endpoint rescue accompanies restoration
            of purinergic adaptation.
          would_support:
          - pathophysiology#Loss of Purinergic Adaptation to Elevated Sound Levels
          supporting_outcome:
          - Reduced adaptation in knock-in mice, accompanied by correction after editing, would support
            the proposed link between allele dysfunction and loss of noise protection.
          would_refute:
          - pathophysiology#Loss of Purinergic Adaptation to Elevated Sound Levels
          refuting_outcome:
          - Normal adaptation despite progressive knock-in hearing loss would argue against this being
            the sole disease mechanism.
      selected_evidence:
        snippet: These data indicate haplosufficiency in the development of P2X ... receptor-dependent
          TTS.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/1
