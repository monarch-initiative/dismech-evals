        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Purinergic Adaptation to Elevated Sound Levels
        description: 'P2rx2-null mice lack the purinergic component of adaptation to sustained sound.
          Under the studied 85 dB SPL noise protocols, wild-type mice developed temporary ABR threshold
          shifts and reduced cochlear gain, whereas null mice showed greatly reduced adaptation. At higher
          levels, other processes contributed to temporary threshold shifts and null mice were more susceptible
          to permanent loss. These protocols do not establish a human safe-exposure threshold or imply
          that all temporary hearing changes are noninjurious.

          ATP-induced cochlear partition conductance and endocochlear-potential changes were absent in
          null mice. The acute cation shunt alone does not explain the prolonged threshold recovery; downstream
          processes remain incompletely defined. Heterozygous null littermates retained adaptation, supporting
          haplosufficiency in this assay. Extrapolation to heterozygous human missense disease therefore
          requires allele-specific testing.'
        biological_scale: TISSUE
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        - preferred_term: supporting cell
          term:
            id: CL:0000630
            label: supporting cell
        biological_processes:
        - preferred_term: purinergic nucleotide receptor signaling pathway
          term:
            id: GO:0035590
            label: purinergic nucleotide receptor signaling pathway
          modifier: DECREASED
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: In mice null for the P2RX2 gene (encoding the P2X2 receptor subunit), sustained 85-dB
          noise failed to elicit the TTS that wild-type (WT) mice developed.
        supports: SUPPORT
        directness: DIRECT
