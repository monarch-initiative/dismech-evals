            term:
              id: MONDO:0012090
              label: autosomal dominant nonsyndromic hearing loss 47
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive Cochlear Dysfunction at an Unidentified Molecular Target
        description: 'No causal gene, transcript, or protein has been identified for DFNA47 despite the
          locus having been mapped by linkage analysis in 2003, so no molecular pathway, cellular process,
          or protein-level mechanism can be attributed to it. The only mechanistic inference available
          is drawn from the clinical audioprofile itself: hearing loss in the founding family began after
          the teenage years and progressed gradually to a moderate-to-severe loss, a pattern generally
          associated in other, better-characterized dominant progressive sensorineural hearing loss genes
          with basal (high-frequency-encoding) cochlear injury spreading apically over time. This is pattern-matching
          drawn from the phenotype alone, not a demonstrated cochlear-cell-biology finding specific to
          this locus, and no histopathological or model-organism data exist to test it.'
        biological_scale: TISSUE
        locations:
        - preferred_term: cochlea
          term:
            id: UBERON:0001844
            label: cochlea
        biological_processes:
        - preferred_term: sensory perception of sound
          term:
            id: GO:0007605
            label: sensory perception of sound
          modifier: DECREASED
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: Most affected individuals noticed hearing impairment after their teens with subsequent
          gradual progression to a moderate-severe loss. There were no obvious vestibular dysfunction
          and other associated abnormalities.
        supports: SUPPORT
        directness: DIRECT
