      assertion_type: Diagnosis
      assertion:
        name: Audiometric and Exclusion-Based Genetic Diagnosis
        description: Because no causal gene is known, there is no positive molecular test for "DFNA47."
          Diagnosis rests on the clinical/audiometric pattern (autosomal dominant, postlingual, progressive,
          high-frequency-first bilateral sensorineural hearing loss with no syndromic features), combined
          with a comprehensive hearing-loss gene panel or exome/genome sequencing to exclude the more
          than 100 known nonsyndromic deafness genes, and, where a sufficiently large and informative
          pedigree exists, linkage/segregation analysis to the 9p21-22 interval. A diagnosis of DFNA47
          in an isolated case or small family is not currently possible on genetic grounds alone.
      selected_evidence:
        snippet: The most effective strategy for the diagnosis of non-syndromic genetic HL is to perform
          a multi-step approach based on next-generation sequencing technologies and copy number variations
          assays and a thorough clinical evaluation, including physical examination and audiometric tests.
        supports: SUPPORT
        directness: INDIRECT
