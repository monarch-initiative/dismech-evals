  9bf0a6257203c2fe5efab3f4d85fe130bcbccab848d925c7d778edd4b3023781:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 47
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 47
            term:
              id: MONDO:0012090
              label: autosomal dominant nonsyndromic hearing loss 47
        context: []
      assertion_type: Genetic
      assertion:
        name: DFNA47 locus (9p21-22) -- causal gene not identified
        notes: 'No causal gene has been cloned for DFNA47 despite the locus having been mapped by linkage
          analysis in 2003 (multipoint LOD 4.26; a critical interval of approximately 9 cM flanked by
          markers D9S268 and D9S942, with peak two-point LOD 3.67 at marker D9S162). MYO1A, a cochlear-expressed
          unconventional myosin gene reported in 2003 to carry multiple mutations in Italian hearing-loss
          patients, is NOT the DFNA47 gene: MYO1A maps to the separate DFNA48 locus (15q22-q25), and its
          proposed association with nonsyndromic deafness has itself since been refuted by an independent
          genotypic-ascertainment study that found no bilateral moderate-or-greater sensorineural hearing
          loss among carriers of the implicated MYO1A variants. This entry should not be bound to MYO1A.
          A separate recessive locus, DFNB83, was mapped to 9p23-p21.2 in a consanguineous Palestinian
          family and overlaps the DFNA47 cytogenetic band; whether the two represent allelic disorders
          of one still-uncloned gene is an unconfirmed hypothesis based only on the two loci''s proximity,
          not a demonstrated fact -- no shared causal variant has been published for either locus.'
        relationship_type: CAUSATIVE
      selected_evidence:
        snippet: A maximum lod score of 3.14 was obtained with marker D9S157 (at theta=0) after a genome
          wide search. The study of additional markers allowed us to confirm this region with positive
          lod scores of 3.58 (at theta=0 from D9S285) and of 3.67 (at theta=0 from D9S162). Recombinants
          define a region of approximately 9 cM flanked by markers D9S268 and D9S942. Multipoint linkage
          analysis showed a Lod score of 4.26.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
