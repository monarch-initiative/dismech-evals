            limitations: Young beta-galactosidase-null mice have nearly normal thresholds, and age-related
              matrix loss is biased toward the low-frequency apex. This differs from common high-frequency-first
              human onset. Aged heterozygous null mice also develop frequent spontaneous emissions despite
              thresholds resembling wild type, so they are not physiologically normal in every respect.
          role: ancestor
