        context:
        - path: /animal_models/0
          value:
            name: Ceacam16-null mutant mouse
            species: Mouse
            genotype: Ceacam16 null (beta-galactosidase knock-in allele, homozygous)
            publication: PMID:25080593
            description: Ceacam16 beta-galactosidase-null mice on a C57BL/6J background show matrix disorganization
              and early emission abnormalities, followed by age-related loss of sensitivity. The perturbation
              is biallelic absence of protein, not the heterozygous missense state in DFNA4B.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Destabilized Cochlear Amplification
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: 'Reproduces the functional signature directly: enlarged stimulus-frequency and transiently
          evoked emissions, and spontaneous emissions in most homozygotes.'
        limitations: Young beta-galactosidase-null mice have nearly normal thresholds, and age-related
          matrix loss is biased toward the low-frequency apex. This differs from common high-frequency-first
          human onset. Aged heterozygous null mice also develop frequent spontaneous emissions despite
          thresholds resembling wild type, so they are not physiologically normal in every respect.
        readouts:
        - name: Spontaneous otoacoustic emission incidence
          target: Destabilized Cochlear Amplification
          direction: INCREASED
          interpretation: Spontaneous emissions are the direct physiological readout of an under-damped
            cochlear amplifier, which is what this node asserts.
        - name: Auditory brainstem response threshold
          target: Destabilized Cochlear Amplification
          direction: UNCHANGED
          interpretation: 'A real negative result, and an informative one: thresholds are largely normal
            in young nulls while the emission measures are already abnormal, which is what identifies
            the early defect as instability rather than loss of sensitivity.'
        - name: Auditory brainstem response threshold at 12 months
          target: Destabilized Cochlear Amplification
          direction: INCREASED
          interpretation: The measured quantity is ABR threshold, which increases as sensitivity worsens.
            Hair-cell counts were similar between genotypes, although both had age-related hair-cell loss.
            The additional null-associated deficit was strongest at low frequencies; high-frequency genotype
            differences were limited by shared background degeneration.
      selected_evidence:
        snippet: Results from mice lacking CEACAM16 are consistent with the idea that the organ of Corti
          evolved to maximize the gain of the cochlear amplifier while preventing large oscillations.
        supports: SUPPORT
        directness: DIRECT
