        name: Auditory brainstem response threshold at 12 months
        target: Destabilized Cochlear Amplification
        direction: INCREASED
        interpretation: The measured quantity is ABR threshold, which increases as sensitivity worsens.
          Hair-cell counts were similar between genotypes, although both had age-related hair-cell loss.
          The additional null-associated deficit was strongest at low frequencies; high-frequency genotype
          differences were limited by shared background degeneration.
      selected_evidence:
        snippet: SOAEs and DPOAEs are not detected in Ceacam16βgal/βgal mice and ABR thresholds are increased
          by up to ∼40 dB across frequency, despite a complement of hair cells similar to that present
          in Ceacam16+/+ mice
        supports: SUPPORT
        directness: DIRECT
