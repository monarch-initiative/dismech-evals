  cc56edf3e6c031d9990118b8fb0be0602a4877b9957f3303621e929b32a5da2c:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 4B
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 4B
            term:
              id: MONDO:0013823
              label: autosomal dominant nonsyndromic hearing loss 4B
        context: []
      assertion_type: Genetic
      assertion:
        name: CEACAM16
        gene_term:
          preferred_term: CEACAM16
          term:
            id: hgnc:31948
            label: CEACAM16
        relationship_type: CAUSATIVE
        notes: Reported dominant missense alleles include c.418A>C (p.Thr140Pro), c.418A>G (p.Thr140Ala),
          c.419C>T (p.Thr140Ile), c.505G>A (p.Gly169Arg), c.763A>G (p.Arg255Gly), and de novo c.1094T>G
          (p.Leu365Arg). The Chinese p.Thr140Ala family adds onset in the twenties. These reports do not
          establish equal pathogenic certainty or a shared molecular mechanism for every allele. ClinGen
          retained Moderate gene-disease validity in September 2022. Its evidence table gave a heterozygous
          frameshift case with onset at 50 years zero points, so this entry does not treat all heterozygous
          truncating variants as causal. Hearing-normal human carriers in recessive splice-variant families
          argue against simple haploinsufficiency, without proving dominant-negative action. Penetrance
          cannot be quantified from the small, variably ascertained families; the Russian report is internally
          inconsistent about the genotype of hearing-normal child V-11. A meningitis/aminoglycoside-associated
          noncarrier in the p.Gly169Arg family and age-related hearing loss in the noncarrier father of
          the p.Thr140Ala family illustrate phenocopies.
      selected_evidence:
        snippet: we show that mutation of CEACAM16 leads to autosomal dominant nonsyndromic deafness (ADNSHL)
          at the autosomal dominant hearing loss (DFNA4) locus
        supports: SUPPORT
        directness: DIRECT
