            term:
              id: MONDO:0013114
              label: autosomal dominant nonsyndromic hearing loss 50
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulation of the Hair Cell Maturation Gene Programme
        biological_scale: CELLULAR
        description: Altered miRNA targeting changes a broad hair-cell gene program. In the original P4
          diminuendo organ-of-Corti experiment, Slc26a5, Ocm, Gfi1, Ptprq and Pitpnm1 were strongly downregulated.
          Only Ocm and prestin staining was compared with nine other deaf mutants. The original prediction
          analysis did not identify miR-96 sites in these five genes, but later work identified a potential
          diminuendo-specific site in Ptprq. Their regulation therefore cannot all be assigned to one
          proven indirect route. P1 sorted hair-cell RNA-seq and human-seed knock-in transcriptomes support
          widespread, allele-dependent changes.
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        locations:
        - preferred_term: organ of Corti
          term:
            id: UBERON:0002227
            label: spiral organ of cochlea
        genes:
        - preferred_term: SLC26A5
          term:
            id: hgnc:9359
            label: SLC26A5
        - preferred_term: OCM
          term:
            id: hgnc:8105
            label: OCM
        - preferred_term: GFI1
          term:
            id: hgnc:4237
            label: GFI1
        - preferred_term: PTPRQ
          term:
            id: hgnc:9679
            label: PTPRQ
        - preferred_term: PITPNM1
          term:
            id: hgnc:9003
            label: PITPNM1
        notes: HGNC bindings denote human orthologues of genes measured in mice. Ptprq reduction is a
          candidate contributor to bundle abnormalities; comparing Ptprq-null and diminuendo mice supports
          partial phenotypic overlap, not proof that Ptprq alone mediates DFNA50. Sorted P1 RNA-seq mixed
          cochlear and vestibular hair cells. Supporting-cell gene repression is a proposed explanation,
          not demonstrated conversion of hair cells to supporting cells.
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: Microarray analysis revealed 96 transcripts with significantly altered expression in
          homozygotes; notably, Slc26a5, Ocm, Gfi1, Ptprq and Pitpnm1 were downregulated.
        supports: SUPPORT
        directness: DIRECT
