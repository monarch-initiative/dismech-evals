        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MIR96 Precursor Processing Defect
        biological_scale: MOLECULAR
        description: The Italian +57T>C substitution lies in the precursor hairpin and the companion miR-96*
          (miR-96-3p) seed, while preserving the mature miR-96-5p sequence. In HeLa cells, mature miR-96
          and miR-96* fell by approximately 85% and 77%, respectively, without reduced precursor abundance.
          A compensatory +23A>G change restored pairing, mature levels and MYRIP reporter repression.
          These results support defective processing, with impaired Dicer cleavage proposed rather than
          directly assayed. Altered targeting by the changed companion seed remains possible; it was not
          established by the tested reporters.
        biological_processes:
        - preferred_term: miRNA processing
          modifier: DECREASED
          term:
            id: GO:0035196
            label: miRNA processing
        genes:
        - preferred_term: MIR96
          term:
            id: hgnc:31648
            label: MIR96
        genetic_context:
          genes:
          - preferred_term: MIR96
            term:
              id: hgnc:31648
              label: MIR96
          allele_type: single-nucleotide substitution in the pre-miR-96 hairpin, within the miR-96* strand
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Historical +57T>C allele changes precursor pairing and the miR-96-3p seed, while
            the miR-96-5p sequence is unchanged.
          variant_type: single nucleotide variant
          genomic_contexts:
          - noncoding exon
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: We found that both miR-96 and miR-96* levels were significantly reduced in the mutant,
          whereas the precursor levels were unaffected.
        supports: SUPPORT
        directness: DIRECT
