      assertion_type: Discussion
      assertion:
        discussion_id: mir96_clic5_direction
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Repression of Normal miR-96 Targets
        prompt: Does altered CLIC5 regulation contribute to human seed-variant DFNA50, and does its direction
          match the loss-of-function models?
        rationale: HEI-OC1 mimic/reporter assays support direct miR-96/miR-182 repression of CLIC5. Whole-cluster
          knockout raises Clic5 in P1 cochlea, and the 2025 single-Mir96-knockout study reports Clic5
          among upregulated genes in P28 whole cochlea. Neither observation establishes a causal CLIC5
          pathway in human seed-variant disease. The expected effect of losing normal repression is increased
          CLIC5, distinct from biallelic CLIC5 loss in DFNB103, but acquired targets and tissue composition
          can alter the net result. GSE255796 provides sorted mixed cochlear/vestibular hair-cell data
          for further analysis; its main text does not give a Clic5-specific result. No new gene-level
          analysis was performed in this review.
      selected_evidence:
        snippet: 11 upregulated (Ceacam16, Cldn9, Clic5, Col9a1, Col9a2, Fgfr3, Marveld2, Myh14, P2rx2,
          Pex26, and Slc26a4)
        supports: SUPPORT
        directness: DIRECT
