      assertion_type: Discussion
      assertion:
        discussion_id: mir96_13ga_human_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Progressive Sensorineural Hearing Loss
        prompt: Why does a mouse carrying the human MIR96 +13G>A allele in heterozygosis hear normally
          for a year, when the same heterozygous allele causes progressive hearing loss in the Spanish
          family it was taken from?
        rationale: The human +14C>A and +13G>A alleles produce distinct mouse phenotypes and transcriptomes.
          +13G>A heterozygotes retained normal thresholds through one year, while the corresponding human
          allele segregated with progressive hearing loss. The authors proposed species-specific acquired
          targets, including predicted +13G>A sites in human RAB11A that are absent from mouse Rab11a.
          This candidate has not been validated as the cause of the mismatch. Neither identical seed sequence
          nor a human-matched substitution guarantees conserved target repertoires. The discrepancy constrains
          transfer of mechanism and therapy between alleles.
      selected_evidence:
        snippet: While the Mir96+14C>A heterozygotes mimic the phenotype observed in the family with the
          equivalent mutation, the Mir96+13G>A heterozygotes escape deafness while the same mutation causes
          progressive hearing loss in humans
        supports: SUPPORT
        directness: DIRECT
