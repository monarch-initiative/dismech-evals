          argues against simple dosage insufficiency in this model but does not resolve the mechanism
          of every human precursor allele.
        limitations: The deletion removes Mir183 as well as Mir96, so a comparison against a seed mutant
          confounds the two microRNAs; and the transcriptomes were compared across studies rather than
          in one experiment. The conclusion is an inference from a phenotype and transcriptome contrast,
