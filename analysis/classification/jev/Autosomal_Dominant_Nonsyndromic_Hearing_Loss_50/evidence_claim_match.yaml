          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Progressive Sensorineural Hearing Loss
        relationship: RESCUES
        fidelity: MODERATE
        description: Two independent preclinical rescue arms have been run in this line. AAV delivery
          of SaCas9-KKH with a guide RNA against the mutant allele into the cochleae of presymptomatic
          and symptomatic adult mice improved hearing long term, with better results from earlier injection.
          Separately, amitriptyline - selected by matching the mutant transcriptome against anti-correlated
          drug expression profiles - delayed progression at high frequencies.
        limitations: Both interventions remain preclinical. Editing disrupts the mutant allele, preserves
          surviving cells and is ineffective when delivered at sixteen weeks. Low standard-dose vector
          integration and assay-limited off-target results do not establish human safety. Amitriptyline
          exposure began with breeding parents and continued in offspring, delayed progression only temporarily,
          did not improve homozygotes and showed no additional benefit at double dose; the authors did
          not recommend it for human treatment.
        readouts:
        - name: Hearing preservation after adult cochlear AAV-SaCas9-KKH editing
          target: Progressive Sensorineural Hearing Loss
          direction: DECREASED
          interpretation: ABR and DPOAE thresholds were lower than untreated contralateral ears after
            early treatment, representing partial hearing preservation rather than normalization.
        - name: High-frequency threshold progression under oral amitriptyline
          target: Progressive Sensorineural Hearing Loss
          direction: ALTERED
          interpretation: Progression is delayed rather than halted or reversed, which is why the direction
            is ALTERED and not RESTORED.
      selected_evidence:
        snippet: This is a proof of concept rather than a suggestion that amitriptyline be used as a treatment
          for humans carrying the MIR96+14C>A mutation, for several reasons.
        supports: SUPPORT
        directness: DIRECT
