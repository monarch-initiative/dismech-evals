        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Experimental AAV2 Mutant-Allele Editing
        - treatments#Experimental Amitriptyline
        prompt: Can allele-specific editing or transcriptome-guided drugs provide durable clinical benefit
          in DFNA50?
        rationale: The studies establish mouse proof of concept, not human efficacy. Editing benefit depends
          on the treatment window and surviving cells; safety is bounded by the assays and doses used.
          The amitriptyline effect was temporary at high experimental exposure. The multiplex guide construct
          targeted +13G>A, +14C>A and the mouse-derived +15A>T sequence in engineered cells; it did not
          demonstrate rescue of all human MIR96 alleles and did not include the Italian +57T>C allele.
          General hearing and communication care remains appropriate while these approaches are investigated.
      selected_evidence:
        snippet: This is a proof of concept rather than a suggestion that amitriptyline be used as a treatment
          for humans carrying the MIR96+14C>A mutation, for several reasons.
        supports: SUPPORT
        directness: DIRECT
