        notes: CLIC5 is a direct target in HEI-OC1 mimic/reporter experiments. Clic5 increases in the
          P1 cochlea of whole-cluster knockout mice and is among the upregulated transcripts in P28 single-Mir96-knockout
          cochlea. These results do not establish its direction or causal contribution in human seed-variant
          DFNA50; cellular composition, allele and developmental stage differ. Biallelic CLIC5 loss in
          DFNB103 is a distinct lesion.
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: Hypergeometric P-value analysis showed that hundreds of genes were upregulated in mutants.
