      assertion_type: Pathophysiology
      assertion:
        name: MIR96 Seed-Region Point Mutation
        biological_scale: MOLECULAR
        description: Heterozygous germline substitutions historically designated +13G>A and +14C>A segregated
          with hearing loss in two Spanish families. They affect the seed of mature miR-96-5p, altering
          target recognition; transfected HeLa cells also showed reduced mature miRNA accumulation. The
          mouse diminuendo +15A>T seed allele is distinct from these human variants.
        genes:
        - preferred_term: MIR96
          term:
            id: hgnc:31648
            label: MIR96
        genetic_context:
          genes:
          - preferred_term: MIR96
            term:
              id: hgnc:31648
              label: MIR96
          allele_type: single-nucleotide substitution within the seed region of the mature miR-96 strand
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Carriers are heterozygous. The two reported human seed alleles are +13G>A and +14C>A
            in the historical precursor-relative numbering used by the founding papers.
          notes: Historical precursor-relative allele notation is retained. Altered target specificity
            and reduced miRNA abundance are separate consequences; a single loss-of-function category
            would not capture both.
          variant_type: single nucleotide variant
          genomic_contexts:
          - noncoding exon
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: The identified mutations have a strong impact on miR-96 biogenesis and result in a significant
          reduction of mRNA targeting.
        supports: SUPPORT
        directness: DIRECT
