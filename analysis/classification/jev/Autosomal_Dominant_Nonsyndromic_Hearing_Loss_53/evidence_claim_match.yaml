      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        description: Hearing loss segregated as an autosomal dominant trait in three testable generations
          of a six-generation pedigree. The linkage analysis assumed 90% penetrance in heterozygotes;
          this was not a measured penetrance estimate. Under a heterozygous dominant model, each child
          has a 50% chance of inheriting the allele, which is distinct from the age-dependent chance of
          manifesting hearing loss. No causal variant has been established for variant-specific predictive
          testing.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: The clinical history and audiological finding of the hearing loss in family members clearly
          revealed an autosomal dominant form of post‐lingual, bilateral sensorineural hearing loss.
        supports: SUPPORT
