            term:
              id: MONDO:0012380
              label: autosomal dominant nonsyndromic hearing loss 53
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unidentified Dominant Allele in the 14q11.2-q12 Interval
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: Linkage and recombinant haplotype analysis mapped DFNA53 between D14S581 and D14S1021,
          a 9.6 cM interval at 14q11.2-q12. The original assembly placed approximately 6.4 Mb and 60 known
          genes in this interval. A maximum multipoint LOD score of 5.4 supports linkage in the reported
          pedigree, but the causal gene, variant and molecular mechanism remain unresolved.
        notes: The original study sequenced coding regions and adjacent splice boundaries of COCH, SLC22A17
          (BOCT), EFS and HSPC156 (STXBP6) without identifying a segregating cause. This screen did not
          comprehensively assess structural or noncoding variation; the authors explicitly noted unscreened
          COCH promoter and untranslated regions and the limitations for large deletions or duplications.
      selected_evidence:
        snippet: This interval spans a physical distance of about 6.4 Mb, and includes ∼60 known genes
          and a series of predicted or poorly characterised genes
        supports: SUPPORT
    origin:
