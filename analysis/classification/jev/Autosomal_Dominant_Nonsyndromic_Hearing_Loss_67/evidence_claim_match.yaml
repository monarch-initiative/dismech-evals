  4bc4a6461f5bcce903d373146e790a600525b24a9e10f00686a8141017521a0b:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 67
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 67
            term:
              id: MONDO:0014594
              label: autosomal dominant nonsyndromic hearing loss 67
        context: []
      assertion_type: Treatment
      assertion:
        name: Cochlear Implantation
        description: 'The intervention actually used in advanced DFNA67, and the mechanism supports it:
          the nodes this entry models are in the hair cell and the stria, upstream of the spiral ganglion
          an implant stimulates, and no cochlear malformation is described. That premise needs one hedge.
          Spiral ganglion neurons are lost in the frameshift transgenic mouse and preserved by rapamycin
          there, so ganglion involvement is not excluded; it is not modelled as a pathophysiology node
          because the only evidence for it is an overexpression transgenic on two intact endogenous alleles
          - a genotype no patient has - and nothing in the human literature reports it. The clinical case
          for implantation does not rest on the premise anyway: it rests on the measured outcomes below.
          Four affected members of one Korean family and two of another received implants, and in the
          German pedigree several affected individuals were implanted between the ages of 27 and 50. Reported
          outcomes at three months were open-set hearing with sentence comprehension between 80 and 100
          percent, which the authors read as the pathology being favourable for implantation.

          The ages are the informative part for counselling. Because onset is postlingual and progression
          takes decades, candidacy is reached in adulthood rather than in childhood, so the decision arrives
          after speech and language are established.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: cochlear device implantation
          term:
            id: NCIT:C15329
            label: Surgical Procedure
          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: cochlear implant
              term:
                id: NCIT:C157820
                label: Cochlear Implant
        notes: 'Outcomes are reported at three months in six implanted individuals from two families,
          with no longer follow-up and no comparison group, so nothing beyond a favourable short-term
          result is claimed here.

          The treatment term is the generic surgical action, which is what implantation is. NCIT:C157820
          Cochlear Implant names the device rather than a clinical action and is not reachable from NCIT:C25218,
          so it cannot be the term of a TreatmentTerm; the device is attached as a qualifier so it stays
          queryable, following the convention established elsewhere in the KB.'
      selected_evidence:
        snippet: The affected individuals in YUHL3 (II-5, III-4, III-13, and IV-11) and YUHL457 (III-4
          and III-6) families had cochlear implantation.
        supports: SUPPORT
