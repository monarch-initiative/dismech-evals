  b1246d56a26c959ca26efd22fce145e73ce01718781dc4da069bf770f789d0cb:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 67
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 67
            term:
              id: MONDO:0014594
              label: autosomal dominant nonsyndromic hearing loss 67
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: osbpl2_knockout_versus_frameshift_transgene
        kind: HUMAN_MODEL_MISMATCH
        prompt: Two independently generated Osbpl2-null mouse lines disagree about whether deleting the
          gene causes hearing loss, and the human allele is neither a deletion nor an overexpressed transgene.
          Which of the two mouse manipulations is informative for DFNA67?
        attaches_to:
        - animal_models#Osbpl2 knockout mouse (ciliary and strial phenotype)
        - animal_models#Yonsei osbpl2-null mouse (no hearing phenotype)
        - animal_models#HsQ53R frameshift transgenic mouse
        - pathophysiology#Accumulation of Truncated OSBPL2 and Autophagy Blockade
        rationale: 'This is the central unresolved question in DFNA67 and it decides whether the disease
          has a drug. One laboratory''s Osbpl2 knockout has progressive hearing loss with ciliary defects
          and, at ten months, a leaking blood-labyrinth barrier. Another laboratory''s osbpl2 null has
          normal ABR thresholds at all frequencies at four months, in heterozygotes and homozygotes alike,
          while a transgene carrying the human frameshift protein deafens mice by P60 and a wild-type
          transgene does not. Same gene, same species, opposite conclusions about the consequence of deletion,
          and no published attempt to reconcile allele design, strain background, age at testing or acoustic
          environment.

          Neither manipulation is the human genotype. Patients are heterozygous for an N-terminal frameshift
