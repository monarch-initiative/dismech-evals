  a3ffdb8f30153c54332683f4bfc3230aed0b3d7a05d047f4b1c442abbfbe7f64:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 67
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 67
            term:
              id: MONDO:0014594
              label: autosomal dominant nonsyndromic hearing loss 67
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: OSBPL2 N-terminal Frameshift Variant
        description: 'The shared trigger. Every reported DFNA67 allele but one is a heterozygous frameshift
          in the first sixty codons: c.153_154delCT (p.Gln53Argfs*100) in the founding Chinese family,
          c.141_142delTG (p.Arg50Alafs*103) in the German family that named the locus, and c.158_159delAA
          (p.Gln53Argfs*100) in both a Mongolian family and the Korean YUHL3 family, whose sister family
          YUHL457 carries c.180_181delCA (p.His60Glnfs*93). A c.583C>A (p.Leu195Met) missense allele was
          reported in one sporadic case and is the exception.

          Two nomenclature warnings for anyone reusing these. p.Gln53Argfs*100 is reported with two different
          cDNA descriptions, c.153_154delCT and c.158_159delAA, because the publications number against
          different transcripts; they should be normalised to a stated MANE transcript before reuse. And
          the Korean paper writes its two alleles as c.158_159AAdel and c.180_181CAdel; the HGVS-ordered
          forms are used above and denote the same variants.

          The clustering is itself a mechanistic datum. A gene that caused disease by haploinsufficiency
          would be expected to accumulate nonsense, splice-site and whole-gene deletion alleles across
          its length; this one has a codon-53 hotspot instead. Which of the two downstream models the
          frameshift feeds is the disagreement this entry curates.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: OSBPL2
          term:
            id: hgnc:15761
            label: OSBPL2
      selected_evidence:
        snippet: predominantly frameshift variations, and can occur de novo, with p.Gln53 as a mutation
          hotspot
        supports: SUPPORT
