          an implant stimulates, and no cochlear malformation is described. That premise needs one hedge.
          Spiral ganglion neurons are lost in the frameshift transgenic mouse and preserved by rapamycin
          there, so ganglion involvement is not excluded; it is not modelled as a pathophysiology node
