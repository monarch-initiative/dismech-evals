        name: Yonsei osbpl2-null mouse (no hearing phenotype)
        species: Mouse
        genotype: osbpl2-/-, CRISPR-Cas9 knockout
        publication: PMID:35253614
        description: 'A second, independently generated Osbpl2 null. Homozygotes are viable, fertile,
          born at the expected Mendelian ratio, and hear normally: ABR thresholds for click and pure tones
          at all frequencies are comparable to wild type at four months, as are heterozygotes. This is
          the negative result on which the toxic-proteinopathy argument turns, and it is a direct contradiction
          of the knockout phenotype above.'
        genes:
        - preferred_term: OSBPL2
          term:
            id: hgnc:15761
            label: OSBPL2
        modeled_mechanisms:
        - target: Progressive Elevation of Auditory Thresholds
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Deleting the gene does not reproduce the human hearing phenotype in this line.
            If DFNA67 were straightforward haploinsufficiency, a null should be at least as affected as
            a heterozygous frameshift carrier, and it is not.
          limitations: A negative result carries the usual burdens and they are not resolved in the literature.
            Thresholds were measured at four months, and the human disease takes decades, so a late phenotype
            could have been missed; the allele design, strain background and the acoustic environment
            differ from the other laboratory's null, and no published work compares them. The finding
            therefore constrains the loss-of-function model rather than refuting it, and the entry keeps
            both hypotheses for that reason.
          readouts:
          - name: ABR threshold at four months
            target: Progressive Elevation of Auditory Thresholds
            direction: UNCHANGED
            interpretation: 'A real negative: hearing was measured and was normal, in both heterozygotes
              and homozygous nulls.'
      selected_evidence:
        snippet: Transgenic mice expressing mutant OSBPL2 exhibited hearing loss, but osbpl2 knockout
          mice or transgenic mice expressing wild-type OSBPL2 did not.
        supports: SUPPORT
