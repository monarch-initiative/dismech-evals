      assertion_type: Prevalence
      assertion:
        population: Worldwide, published families
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'Roughly seven published families plus a sporadic case as of 2025. No population prevalence
          estimate exists, so no numeric band is asserted. The only quantitative figure available is a
          diagnostic yield, which is not a prevalence: one OSBPL2 family among 607 deafness families at
          a Chinese referral centre, and two among 202 exome-sequenced families in a Korean cohort after
          GJB2 and SLC26A4 were excluded. The two figures differ by roughly sixfold and are not comparable
          - the Korean denominator is a pre-screened, exome-sequenced subset - so neither is converted
          into a rate here.'
