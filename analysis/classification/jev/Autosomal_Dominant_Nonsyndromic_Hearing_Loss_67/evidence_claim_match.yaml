              label: autosomal dominant nonsyndromic hearing loss 67
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: osbpl2_loss_of_function
        hypothesis_label: Loss of OSBPL2 lipid-transfer function in cochlear cells
        status: CANONICAL
        description: 'The majority model. OSBPL2/ORP2 is a sterol and phosphoinositide transfer protein,
          and the frameshift is read as abolishing that function, so the cochlear phenotype follows from
          what happens to a hair cell without it. Four mechanistic arms have been developed independently,
          all of them in systems where the gene has been deleted rather than mutated: cholesterol biosynthesis
          and reactive oxygen species rise when AMPK restraint is lost; PI(4,5)P2 accumulates on the ciliary
          membrane and Hedgehog signalling falls; Rho/ROCK2 and phospho-ERM fall and hair bundle actin
          is disorganised; and tight junctions in the stria vascularis fail with blood-labyrinth barrier
          leakage.

          The consistent weakness across all four is the same: every one of them models the disease as
          absence of the protein, whereas patients carry one wild-type and one frameshift allele.'
      selected_evidence:
        snippet: Therefore, these studies link dysregulated lipid metabolism resulting from the loss of
          OSBPL2, to hearing impairment.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35253614
      reference_title: OSBPL2 mutations impair autophagy and lead to hearing loss, potentially remedied
