  80f41f04d98e637026931499de6032b38a60a15c32112cebf77ca281c058a38a:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 67
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 67
            term:
              id: MONDO:0014594
              label: autosomal dominant nonsyndromic hearing loss 67
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Excess Cholesterol Biosynthesis and Oxidative Stress in Auditory Cells
        description: 'The first loss-of-function arm. Deleting Osbpl2 in OC1 auditory cells and osbpl2b
          in zebrafish reduces AMPK activity and derepresses Srebp2, Hmgcr and Hmgcs1, so total cholesterol
          rises; reactive oxygen species rise with it and mitochondria are damaged. OSBPL2 was found to
          interact with ATIC, an AMPK activator, which is the proposed link between the transfer protein
          and the kinase.

          This is a cell-intrinsic lipid dysregulation, not the hair-bundle cholesterol distribution defect
          described for other deafness genes. Nobody has measured cholesterol in a mammalian hair bundle
          in an OSBPL2 model, so this entry claims a change in biosynthesis and total cellular content,
          and does not claim a change in where cholesterol sits within the bundle.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: cholesterol biosynthetic process
          term:
            id: GO:0006695
            label: cholesterol biosynthetic process
          modifier: INCREASED
      selected_evidence:
        snippet: Osbpl2/osbpl2b-KO resulted in a reduction of AMPK activity and up-regulation of Srebp2/srebp2,
          Hmgcr/hmgcr and Hmgcs1/hmgcs1, key genes in the sterol biosynthetic pathway and associated with
          AMPK signaling.
        supports: SUPPORT
