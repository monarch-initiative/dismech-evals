      assertion:
        name: Serial pure-tone audiometry with otoacoustic emissions
        description: 'The audiological half of the workup, and the half that has to be repeated. Diagnosis
          rests on pure-tone audiometry showing bilateral, symmetric, high-frequency-first sensorineural
          loss, with otoacoustic emissions to characterise outer hair cell function where a response remains.
          Because progression over decades is the defining feature and is what makes the pattern recognisable,
          a single audiogram in a young adult is a snapshot rather than a diagnosis - it is the trajectory
          across serial audiograms that separates DFNA67 from a static loss, and that also sets the timing
          of amplification and implant candidacy.

          In practice this is how affected status is established within a pedigree before anyone is sequenced:
          the large multigeneration families were assembled by audiological testing of relatives, not
          by molecular screening. This row names two distinct assessments; the measurements below are
          LOINC-coded for the pure-tone audiometric component only, not for otoacoustic emissions also
          described here.'
