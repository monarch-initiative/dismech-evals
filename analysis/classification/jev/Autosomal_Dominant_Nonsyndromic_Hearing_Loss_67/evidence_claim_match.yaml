      assertion_type: Pathophysiology
      assertion:
        name: Rho/ROCK2-ERM Actin Disorganisation in the Hair Bundle
        description: 'The third loss-of-function arm, and the one that connects the molecular lesion to
          the structure the hair cell needs most. OSBPL2 deficiency inhibits Rho/ROCK2 signalling and
          lowers phosphorylated ezrin-radixin-moesin, the linkers that tie the plasma membrane to cortical
          actin; F-actin morphology in HEI-OC1 cells becomes abnormal and mouse hair cells show stereociliary
          defects. ORP2 was already known to bind F-actin regulators including DIAPH1 - itself the DFNA1
          deafness gene - which is a suggestive but separate line.

          The edge from the transfer node is drawn as indirect with unknown intermediates: how a sterol
          and phosphoinositide transfer protein sets Rho/ROCK2 tone has not been worked out, though PI(4,5)P2
          is a plausible bridge given that both ERM activation and Rho signalling depend on it.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        biological_processes:
        - preferred_term: actin cytoskeleton organization
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
          modifier: DECREASED
      selected_evidence:
        snippet: we found that OSBPL2 deficiency inhibited the Rho/ROCK2 signaling pathway and downregulated
          phosphorylated Ezrin-Radixin-Moesin (p-ERM), resulting in abnormal F-actin morphology in HEI-OC1
          cells and stereociliary defects in mouse HCs
        supports: SUPPORT
