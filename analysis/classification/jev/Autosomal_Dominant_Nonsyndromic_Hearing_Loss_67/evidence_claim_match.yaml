      assertion:
        name: Stria Vascularis Tight Junction Loss and Blood-Labyrinth Barrier Leakage
        description: 'The fourth loss-of-function arm, and the only one that is not a hair cell lesion.
          OSBPL2 is highly expressed in the stria vascularis, where the blood-labyrinth barrier sits.
          Ten-month-old Osbpl2-knockout mice leak FITC-dextran into the stria, OSBPL2-deficient human
          endothelial cells are correspondingly more permeable, tight junctions are disrupted and NF-kappaB-driven
          inflammatory apoptosis follows.

          Age is the important qualifier. This was measured at ten months, long after the knockout thresholds
          are already abnormal, so it reads as a late contributor to a progressive course rather than
          as the initiating lesion. It is curated as a separate node because a barrier failure is a different
          kind of injury from a hair bundle defect and would call for different treatment.'
        biological_scale: TISSUE
        locations:
        - preferred_term: stria vascularis
          term:
            id: UBERON:0002282
            label: stria vascularis of cochlear duct
        biological_processes:
