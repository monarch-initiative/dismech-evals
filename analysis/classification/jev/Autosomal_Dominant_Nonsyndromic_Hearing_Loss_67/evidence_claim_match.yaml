          term:
            id: GO:0070830
            label: bicellular tight junction assembly
          modifier: DECREASED
      selected_evidence:
        snippet: significant SV leakage was detected in cochleae of 10-month-old Osbpl2-KO mice, which
          was consistent with the increased endothelial permeability in OSBPL2-deficient HUVECs
        supports: SUPPORT
