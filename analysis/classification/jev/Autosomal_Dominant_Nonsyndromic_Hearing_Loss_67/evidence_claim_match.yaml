  3b7b14a55188316f8c6e6f2827c21a906ea19199a7dc16051de782df9ce132ed:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 67
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 67
            term:
              id: MONDO:0014594
              label: autosomal dominant nonsyndromic hearing loss 67
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: osbpl2_nmd_escape_unmeasured
        kind: KNOWLEDGE_GAP
        prompt: Does the endogenous OSBPL2 frameshift transcript escape nonsense-mediated decay in human
          cochlear tissue, and is a truncated protein actually present in patients?
        attaches_to:
        - pathophysiology#OSBPL2 N-terminal Frameshift Variant
        - pathophysiology#Accumulation of Truncated OSBPL2 and Autophagy Blockade
        rationale: 'Everything downstream of the frameshift depends on an unmeasured fact. If the mutant
          transcript is degraded, there is no truncated protein, the disease is haploinsufficiency and
          the toxic model collapses; if it escapes decay, the toxic model has its substrate and the loss-of-function
          arms are modelling the wrong genotype. The frameshifts sit at codons 50 to 60 with a long downstream
          coding sequence and multiple exon junctions after them, which is the canonical configuration
          for efficient decay - so the default expectation runs against the toxic model, and the toxic
          model has not addressed it.

          No published work measures either the transcript or the protein from a patient allele. The accumulation
          was shown from a construct, and the human families were characterised by sequencing and audiometry
          with no molecular material beyond DNA. Patient-derived cells would settle at least the transcript
          question cheaply, and the answer would decide which of this entry''s two hypotheses is describing
          the disease.'
        proposed_experiments:
        - experiment_id: exp_dfna67_nmd_in_patient_cells
          name: Allele-specific transcript and protein quantification in patient-derived cells
          description: Obtain lymphoblastoid lines or dermal fibroblasts from carriers of p.Gln53Argfs*100
            and p.His60Glnfs*93, quantify the mutant and wild-type transcripts allele-specifically with
            and without a translation-inhibitor block of nonsense-mediated decay, and probe for truncated
            protein with an N-terminal antibody. Repeat in iPSC-derived otic organoids from the same donors
            so the measurement is made in a cell type that expresses the gene at cochlear levels.
          would_support:
          - pathophysiology#Accumulation of Truncated OSBPL2 and Autophagy Blockade
          supporting_outcome:
          - Mutant transcript is present at a level comparable to wild type and is not stabilised further
            by blocking decay, and truncated protein is detectable - establishing the substrate the toxic
            model requires.
          would_refute:
          - pathophysiology#Accumulation of Truncated OSBPL2 and Autophagy Blockade
          refuting_outcome:
          - Mutant transcript is depleted relative to wild type and rises when decay is blocked, with
            no detectable truncated protein - which would make DFNA67 a haploinsufficiency disease and
            confine the accumulation node to overexpression systems.
      selected_evidence:
        snippet: Mutant OSBPL2 accumulated intracellularly and bound to macroautophagy/autophagy proteins.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
