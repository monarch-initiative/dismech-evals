            label: Severe sensorineural hearing impairment
          onset:
            onset_category: ADULT
        notes: 'FREQUENT rather than a higher band because no series reports a denominator: implantation
          counts are known for two Korean and one German family, but the reported literature does not
          say how many of all affected individuals reach severe-to-profound loss, and the German report
          explicitly notes considerable intrafamilial variability. The band is a floor set by the counted
          implantations, not a measured proportion.'
      selected_evidence:
        snippet: The severity of hearing loss reached severe-profound hearing loss, whereby patients eventually
          needed cochlear implantation.
