  0e869c00d8e1ca13f4ddd7ef8a9ca60fb45435f3804bb888f52aa955816ef666:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 67
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 67
            term:
              id: MONDO:0014594
              label: autosomal dominant nonsyndromic hearing loss 67
        context: []
      assertion_type: Treatment
      assertion:
        name: Rapamycin (Sirolimus)
        description: 'The only mechanism-directed therapy attempted in DFNA67, and it is directed at the
          alternative hypothesis rather than the canonical one: rapamycin induces autophagy, which should
          clear the accumulated truncated protein if that accumulation is what causes the disease.

          What was actually done was an open-label proof-of-concept series in adults from two Korean families,
          2 mg daily for three months, with pure-tone audiometry at three and six months. The reported
          result is a roughly 5 dB improvement at 500 Hz with no change at 250 Hz, an increased DPOAE
          signal-to-noise ratio in the one patient who had a measurable emission, and improved Tinnitus
          Handicap Inventory scores in the two patients with tinnitus. No critical side effects at three
          months.

          This is not a trial result in any usual sense. There was no control arm, no randomisation and
          no registration identifier, so the paper itself is the evidence; a 5 dB shift at a single frequency
          in a handful of patients is within the range of audiometric test-retest variation; and the paper''s
          own patient count is internally inconsistent - the results text says five enrolled, the methods
          say three, and a figure legend says three of six. The authors'' concluding recommendation to
          use rapamycin for DFNA67 goes well beyond what this supports and is not echoed here.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: rapamycin
            term:
              id: CHEBI:9168
              label: sirolimus
        notes: No ClinicalTrials.gov or WHO ICTRP registration identifier appears in the publication;
          the paper reports IRB approval at Severance Hospital and a Ministry of Food and Drug Safety
          number instead. Because there is no registry record to cite, nothing is curated in clinical_trials
          and the publication itself carries the evidence.
      selected_evidence:
        snippet: Three enrolled adult patients with residual hearing function at low frequencies took
          2 mg of rapamycin daily
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/1
