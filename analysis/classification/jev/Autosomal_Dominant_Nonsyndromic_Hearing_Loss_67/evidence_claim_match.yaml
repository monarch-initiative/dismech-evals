            for a frameshift and retain a wild-type allele. More seriously, an independently generated
            osbpl2-null mouse from another laboratory has normal ABR and DPOAE thresholds at four months,
            so the hearing phenotype of this genotype is not reproduced between groups and the discrepancy
            is unexplained.
