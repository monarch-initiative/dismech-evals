            transgenic phenotype as an overexpression artefact, and remove the rationale for rapamycin.
      selected_evidence:
        snippet: This implies that OSBPL2 mutations may exert a dominant-negative effect rather than haploinsufficiency,
          but this has not been proven.
        supports: SUPPORT
