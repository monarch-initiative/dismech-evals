              label: autosomal dominant nonsyndromic hearing loss 67
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Accumulation of Truncated OSBPL2 and Autophagy Blockade
        description: 'The alternative model in one node. The frameshift protein accumulates inside the
          cell, binds autophagy proteins and leaves endolysosomal homeostasis defective, so autophagic
          turnover fails. On this reading DFNA67 belongs with the proteinopathies rather than with the
          lipid-transport deafnesses, and the therapeutic target is clearance of the mutant protein rather
          than replacement of a lost function.

          The claim rests on a transgene. The truncated protein was expressed from a construct, not from
          the patient allele in its own locus, so whether the endogenous frameshift transcript escapes
          nonsense-mediated decay in human cochlea is unmeasured - the gap recorded in the discussion
          below.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: DECREASED
      selected_evidence:
        snippet: Mutant OSBPL2 accumulated intracellularly and bound to macroautophagy/autophagy proteins.
          Consequently, its accumulation led to defective endolysosomal homeostasis and impaired autophagy.
        supports: SUPPORT
