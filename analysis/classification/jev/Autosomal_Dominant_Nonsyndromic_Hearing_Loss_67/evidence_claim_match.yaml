  37fd1266dbcbb0c7b6d4e25346a540d2b8256d4699fea0b3ac3395a2b0c85153:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 67
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 67
            term:
              id: MONDO:0014594
              label: autosomal dominant nonsyndromic hearing loss 67
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: osbpl2_toxic_proteinopathy
        hypothesis_label: Toxic accumulation of the truncated OSBPL2 protein
        status: ALTERNATIVE
        description: 'The competing model. The N-terminal frameshift produces a stable truncated protein
          that accumulates intracellularly, binds autophagy machinery and blocks endolysosomal turnover,
          so the disease is a gain of toxic function rather than a loss of transfer activity. The decisive
          experiment is a negative one: the same group''s osbpl2-null mice hear normally at four months
          while transgenic mice expressing the human frameshift protein are deaf by P60.

          Two observations from human genetics point the same way. Pathogenic alleles are almost all N-terminal
          frameshifts clustered at a hotspot rather than the spread of nonsense, splice and whole-gene
          deletion alleles a haploinsufficiency gene accumulates; and the one reported missense allele,
          p.Leu195Met, is hard to fit to a pure null mechanism. Neither observation is decisive on its
          own, which is why this is ALTERNATIVE and not CANONICAL.'
        notes: 'ClinGen''s Dosage Sensitivity curation for OSBPL2 was cited in issue discussion as scoring
          haploinsufficiency 1 ("Little Evidence"), which would be a third independent argument for this
          hypothesis. It is not cited here: `just clingen-dosage-refresh` aborts on a drifted upstream
          checksum after downloading only the first of its two bulk files, so `clingen-dosage-rebuild`
          cannot produce the CGDS cache record and there is nothing to quote. The claim is left out rather
          than asserted from memory.'
      selected_evidence:
        snippet: Transgenic mice expressing mutant OSBPL2 exhibited hearing loss, but osbpl2 knockout
          mice or transgenic mice expressing wild-type OSBPL2 did not.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35253614
      reference_title: OSBPL2 mutations impair autophagy and lead to hearing loss, potentially remedied
