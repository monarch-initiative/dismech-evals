        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counselling and Cascade Testing
        description: 'Counselling for a dominant condition with a 50 percent transmission risk. Two things
          are specific to DFNA68 and worth saying to a family. The first is that a normal audiogram in
          a young carrier does not mean much: onset is postlingual and in one reported family did not
          begin until the late teens or twenties, so an unaffected-looking child may simply not have reached
          onset. The second is that the finding predicts a trajectory rather than a state - a known rate
          of decline is the main thing a molecular diagnosis adds here, because there is no treatment
          it selects.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: The ages at onset of the affected individuals ranged from 17 to 24 years.
        supports: SUPPORT
