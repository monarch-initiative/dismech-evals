      assertion_type: Treatment
      assertion:
        name: Cochlear Implantation
        description: 'Implantation once amplification no longer delivers useful speech understanding.
          This disorder, unusually for one described in so few families, has a published outcome: a patient
          in her sixties with profound down-sloping loss and 8 percent bilateral speech discrimination
          was implanted, and speech recognition improved significantly at three and six months across
          syllable and sentence conditions.

          The mechanism supports the intervention in principle as well. The lesion is in the hair cell,
          upstream of the spiral ganglion neurons an implant stimulates, and the animal data show hair-cell
          dysfunction without hair-cell death, so there is no reason to expect the neural substrate an
          implant depends on to be compromised. That reasoning is the entry''s, not a published claim;
          the outcome datapoint is published.'
