      assertion:
        name: Disrupted HOMER2-CDC42 Coupling at the Hair Bundle
        biological_scale: MOLECULAR
        description: 'The first of the two proposed downstream lesions, and the better supported one.
          HOMER2 binds activated CDC42 through the CDC42-binding domain, and CDC42 is the Rho-family GTPase
          that tunes actin turnover. In hair cells CDC42 is present and active at the stereociliary membrane,
          so the interaction has somewhere to happen.

          The argument that this is the disease-relevant partnership is comparative rather than direct:
          deleting Cdc42 from murine hair cells produces a hearing phenotype of the same shape as the
          human one. None of the six primary DFNA68 reports measures binding for any disease allele, and
          none demonstrates a HOMER2-CDC42 complex in a cochlear hair cell; the interaction was mapped
          in neurons, and the cochlear evidence is colocalisation plus the CDC42 knockout.'
        mechanism_confidence: PROVISIONAL
        molecular_functions:
