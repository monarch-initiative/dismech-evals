      assertion_type: Phenotype
      assertion:
        name: Absence of Vestibular Dysfunction
        category: Vestibular
        diagnostic: true
        description: 'No vertigo, imbalance or vestibular involvement has been reported in any DFNA68
          family, and in the most recently reported family it was actively looked for: tandem gait and
          Romberg testing were performed in all family members and were normal. That is a substantive
          negative rather than an omission - it is the result of a test, not the silence of a report -
          and it is one of the things that separates a DFNA68 presentation from the vestibulocochlear
          differential a clinician would otherwise be working through.

          Curated as a REFUTED phenotype with no phenotype_term and no frequency, following the pattern
          used for "Absence of Retinitis Pigmentosa" in Autosomal_Dominant_Nonsyndromic_Hearing_Loss_11.
          The schema has no negation slot and FrequencyEnum has no EXCLUDED value, so binding a vestibular
          HP term with a frequency here would export as the assertion that DFNA68 patients have vestibular
          dysfunction, which is the opposite of the finding.'
      selected_evidence:
        snippet: Symptoms of vertigo, balance disorders, and vestibular system involvement were not reported.
        supports: REFUTE
