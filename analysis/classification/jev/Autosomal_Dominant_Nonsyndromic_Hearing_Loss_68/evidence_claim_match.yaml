        - path: /animal_models/0
          value:
            name: Homer2 constitutive knockout mouse
            species: Mouse
            genotype: Homer2 targeted deletion, homozygous and heterozygous
            publication: PMID:25816005
            genes:
            - preferred_term: HOMER2
              term:
                id: hgnc:17513
                label: HOMER2
            description: 'The only mammalian model of the gene''s role in hearing among the nine PubMed
              records swept for this entry, and the one that supplied both the strongest and the most
              awkward result. Homozygous nulls have progressively rising auditory brainstem response thresholds
              from two weeks of age and are profoundly deaf by eight weeks, with the loss starting at
              high frequencies and spreading. At that point the organ of Corti still has its full complement
              of inner and outer hair cells.

              The awkward result is the heterozygote. It hears normally, which means the mouse models
              absence of the protein while every human allele is something other than absence. The model
              therefore supports the claim that HOMER2 is required for hearing, and does not model the
              human genotype.'
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: Hair Cell Functional Failure Without Hair Cell Loss
            relationship: PARTIALLY_RECAPITULATES
            fidelity: MODERATE
            model_scale: CELLULAR
            description: 'The model''s distinctive contribution: profound deafness in the presence of
              an intact hair-cell population, which is what separates this disease from the hair-cell-death
              mechanisms the module it conforms to normally describes.'
            limitations: The genotype is a homozygous null and the human disease is heterozygous for non-null
              alleles; the heterozygous mouse, the genotype that corresponds to a human carrier, has no
              phenotype at all. The hair-cell count was made at eight weeks in an animal with a very compressed
              disease course, so it does not exclude hair-cell loss over the decades a human cochlea is
              exposed to the lesion. No knock-in mouse carrying a human DFNA68 allele appears among the
              nine PubMed records returned by the search recorded in the entry notes.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Inner and outer hair cell counts in whole-mount organ of Corti
        target: Hair Cell Functional Failure Without Hair Cell Loss
        direction: UNCHANGED
        interpretation: An unchanged hair-cell population alongside profound threshold elevation is what
          makes the lesion functional rather than degenerative in this model.
      selected_evidence:
        snippet: No differences in IHCs and OHCs were observed in any animals regardless of genotype indicating
          the absence of Homer2 does not impair hair cell formation and development
        supports: SUPPORT
