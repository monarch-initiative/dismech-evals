      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No prevalence estimate exists and none of the reporting groups offers one; each describes
          the disorder qualitatively as rare or extremely rare. What can be counted is families: the founding
          European pedigree in 2015, then Chinese, Spanish, Sicilian and Italian families, then an isolated
          patient and a further Chinese family, with the two most recent reports describing their alleles
          as the seventh and the sixth HOMER2 variant on record. Fewer than ten unrelated families is
          therefore the honest statement of the literature''s size.

          prevalence_class is the qualitative ULTRA_RARE tier and no rate_per_100000 is given, because
          no numerator and no denominator have been published and a band beside this note would be an
          invention. The tier is compatible with measure_type CASES_IN_LITERATURE, which is what is actually
          being reported.

          The two published counts disagree by one. They were written months apart and enumerate the variant
          list differently, and neither group reconciles its count with the other''s. Both are quoted
          below rather than reconciled here.'
      selected_evidence:
        snippet: Hearing loss caused by HOMER2 mutations is an extremely rare disorder.
        supports: SUPPORT
