  2be77c7055de91d1e59762b79d0f08d44ff7783012308223666529f58c34815d:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 68
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 68
            term:
              id: MONDO:0014740
              label: autosomal dominant nonsyndromic hearing loss 68
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HOMER2 Coiled-Coil Missense Variant
        biological_scale: MOLECULAR
        description: 'The founding allele, p.Arg185Pro numbered against HOMER2 isoform 1 and p.Arg196Pro
          against the longer isoform 2, is a single amino acid substitution inside the coiled-coil domain.
          Arginine is replaced by proline, which the reporting authors predict will alter the domain''s
          conformation or its ability to multimerise and to bind partner proteins, and the residue sits
          in the stretch that both drives multimerisation and carries the CDC42-binding site.

          Its classification as dominant negative rests on a positive experiment rather than on inference
          from the pedigree: injecting mutant mRNA into zebrafish embryos, which retain their own wild-type
          homer2, reduced ear size and kinocilium number, while knocking the fish gene down did not change
          ear size or morphology. An allele that damages a process only when it is present, and not when
          the gene is simply absent, is acting on the wild-type product.'
        genes:
        - preferred_term: HOMER2
          term:
            id: hgnc:17513
            label: HOMER2
        genetic_context:
          genes:
          - preferred_term: HOMER2
            term:
              id: hgnc:17513
              label: HOMER2
          allele_type: missense substitution in the coiled-coil domain
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          notes: DOMINANT_NEGATIVE is the authors' own conclusion and is supported by the contrast between
            mutant-mRNA overexpression, which produced a phenotype, and morpholino knockdown, which did
            not. The two published protein numberings for this variant differ because HOMER2 has two transcripts
            of 343 and 354 residues; both appear in the literature for the same change and neither is
            wrong.
        molecular_functions:
        - preferred_term: scaffold protein binding
          modifier: DECREASED
          term:
            id: GO:0097110
            label: scaffold protein binding
      selected_evidence:
        snippet: Only a single variant, p.Arg185Pro in HOMER2, segregated with the hearing-loss phenotype
          in the extended family.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25816005
      reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in
        humans and mice.
      evidence_source: HUMAN_CLINICAL
      explanation: The allele, and the genetic evidence that it is the cause in the founding family.
