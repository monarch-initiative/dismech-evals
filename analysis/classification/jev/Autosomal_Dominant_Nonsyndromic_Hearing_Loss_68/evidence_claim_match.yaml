            term:
              id: MONDO:0014740
              label: autosomal dominant nonsyndromic hearing loss 68
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Comprehensive hearing-loss gene panel or exome sequencing
        description: 'DFNA68 is reached by sequencing, not by any distinguishing clinical sign. Every
          reported family was found the same way - a targeted deafness gene panel or whole exome sequencing
          in a pedigree with dominant, postlingual, progressive sensorineural hearing loss, followed by
          Sanger segregation across the family. There is no biochemical marker and no audiometric pattern
          specific enough to point at HOMER2 rather than at any of the fifty-odd genes associated with
          autosomal dominant nonsyndromic hearing loss, and the one temporal bone CT reported in a DFNA68
          proband was normal.

          The practical point the reporting groups make is about panel content rather than about technique:
          HOMER2 is a low-prevalence deafness gene, so whether it is found depends on whether it is on
          the panel that was ordered.'
      selected_evidence:
        snippet: Our study also highlights the importance of using NGS-based diagnostic methods to identify
          mutations in low-prevalence deafness genes like HOMER2
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
