        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Stereocilia Actin Maintenance
        biological_scale: CELLULAR
        conforms_to: sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult
        description: 'The hair bundle is a stable actin structure that has to be actively maintained rather
          than simply built once, and the maintenance is CDC42-dependent. When Cdc42 is deleted from murine
          hair cells the bundles form normally and then come apart after maturation: stereocilia fuse
          and are depleted, the circumferential actin belt at the apical junctions thins, and hearing
          declines progressively and first at high frequencies.

          That "normal, then lost" shape is what makes the node the right substitution for this disease.
          DFNA68 patients hear normally through infancy, acquire speech, and then deteriorate over decades.
          No stereocilia morphology has been reported for any HOMER2 patient or animal - the mouse null
          cochlea was assessed by phalloidin staining read for hair-cell death rather than for bundle
          structure - so the cellular lesion here is inferred from the CDC42 experiment and from where
          the protein sits, not observed.'
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        biological_processes:
        - preferred_term: auditory receptor cell stereocilium organization
          modifier: ABNORMAL
          term:
            id: GO:0060088
            label: auditory receptor cell stereocilium organization
        - preferred_term: actin cytoskeleton organization
          modifier: DYSREGULATED
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
        notes: 'Conformance is asserted at the module''s sensory-epithelium-insult node and not at "Hair
          Cell Mechanotransduction Failure and Death". The module''s middle nodes run through ionic disruption,
          oxidative stress and apoptotic hair-cell death, and hair-cell death is specifically what the
          HOMER2 models do not show: the homozygous null mouse is deaf with a normal complement of inner
          and outer hair cells, and the zebrafish allele models lose hair-cell function with unchanged
          hair-cell counts. Substituting the module''s chain here would assert a mechanism this disease
          has been shown not to have.'
      selected_evidence:
        snippet: Cochlear hair cell degeneration was more robust in inner hair cells than in outer hair
          cells, and began as stereocilia fusion and depletion, accompanied by a thinning and waving circumferential
          actin belt at apical junctional complexes (AJCs).
        supports: SUPPORT
        directness: INDIRECT
