      assertion:
        name: Hair Cell Functional Failure Without Hair Cell Loss
        biological_scale: CELLULAR
        description: 'The cellular endpoint that the animal data actually establish, and it is a functional
          one. In the homozygous Homer2-null mouse, thresholds rise progressively while the organ of Corti
          keeps its full complement of inner and outer hair cells at eight weeks, so the deafness is not
          a consequence of cells dying. In zebrafish injected with mutant HOMER2 mRNA, neuromast hair-cell
          numbers are unchanged but the cells take up far less FM1-43, which the reporting group uses
          as a marker for active mechanosensory hair cells - a readout of function, not of survival.

          This is the mechanistically distinctive claim of the entry. The module this disease conforms
          to has apoptotic hair-cell death as its central effector; the HOMER2 evidence says instead that
          the cells are there and are not working. Whether that remains true in an older human cochlea
          over five decades is not known: none of the six primary DFNA68 reports describes human cochlear
          histopathology, and the mouse count was made at eight weeks.'
        cell_types:
