            term:
              id: MONDO:0014740
              label: autosomal dominant nonsyndromic hearing loss 68
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        description: 'Heterozygous HOMER2 variants segregate with hearing loss across multi-generation
          pedigrees - five generations in the founding European family, four in the most recent Chinese
          one - and none of the six primary reports describes a homozygote or a compound heterozygote.

          Dominance here is a statement about the allele, not only about the pedigree. The heterozygous
          mouse null hears normally and the gene is tolerant of loss-of-function variation in population
          data, so a simple halving of HOMER2 dose does not produce the phenotype. The human alleles are
          dominant because they interfere with the wild-type protein they are co-expressed with, by one
          of the three routes set out in the pathophysiology nodes below.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Pure tone audiometric evaluation of affected members showed bilateral post-lingual progressive
          hearing loss that segregated as an autosomal dominant trait; bone conduction thresholds excluded
          conductive hearing impairment.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25816005
      reference_title: HOMER2, a stereociliary scaffolding protein, is essential for normal hearing in
        humans and mice.
      evidence_source: HUMAN_CLINICAL
      explanation: The segregation pattern in the founding family, together with the exclusion of a conductive
        component that would have pointed at a different lesion.
