      assertion:
        name: Pure tone audiometry with serial follow-up
        description: 'Pure tone audiometry establishes the sensorineural character, the configuration
          and, over repeated visits, the rate. Bone conduction thresholds are what exclude a conductive
          component. Serial audiometry matters more here than in a static hearing loss: the audiogram''s
          shape changes as the disease advances, so a single audiogram describes a stage rather than the
          disorder, and the rate of deterioration is only obtainable by regressing thresholds on age across
          visits.'
      selected_evidence:
        snippet: Linear regression analyses of threshold on age were used to evaluate progression of hearing
          impairment at individual frequencies.
