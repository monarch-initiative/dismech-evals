  f5aabd54c453b25ae99e4befb1ea97a917fc74b731ff53ab729c75fdae517e06:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 68
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 68
            term:
              id: MONDO:0014740
              label: autosomal dominant nonsyndromic hearing loss 68
        context: []
      assertion_type: Treatment
      assertion:
        name: Hearing Amplification
        description: 'Hearing aids are the first-line intervention while thresholds remain within the
          range amplification can address. None of the six primary DFNA68 reports names a disease-modifying
          therapy or a trial, and no HOMER2-directed agent appears among them. What is specific to this
          disorder is the commitment rather than the modality: the loss is progressive at a measurable
          rate, so the useful clinical act is repeated audiological review that catches deterioration
          and re-fits, not a single fitting decision.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: hearing aid fitting
        target_phenotypes:
        - preferred_term: Progressive sensorineural hearing impairment
          term:
            id: HP:0000408
            label: Progressive sensorineural hearing impairment
        notes: 'treatment_term carries no NCIT binding. NCIT:C183182 Hearing Aid is a device concept and
          is not reachable from NCIT:C25218 Clinical Intervention or Procedure, the root of the TreatmentTerm
          enum, and NCIT has no clinical-action term for hearing-aid fitting - searched with `runoak -i
          ols:ncit search "l^Hearing Aid"`, which returns NCIT:C183182 Hearing Aid, NCIT:C205713 Hearing
          Aid Fitter Audiologist, and two questionnaire items, none of which is a clinical action. A free-text
          preferred_term is what the ontology contract asks for here. This does not generalise to cochlear
          implantation below, which is a surgical procedure and does bind.

          No DFNA68-specific amplification outcome has been published, so the evidence is cited at the
          level of the disease class this disorder belongs to.'
      selected_evidence:
        snippet: A long audiological follow-up is of paramount importance to identify hearing threshold
          deteriorations early and ensure prompt treatment with hearing aids or cochlear implants.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
