          preferred_term: Low-frequency sensorineural hearing impairment
          term:
            id: HP:0008573
            label: Low-frequency sensorineural hearing impairment
        notes: VERY_RARE reflects that this is a single reported proband against a literature in which
          every other described family starts at the high frequencies. It is not a measured frequency;
          no denominator exists.
      selected_evidence:
        snippet: The older patients (43 years old) displayed flatter audiograms, indicating hearing loss
          across all frequencies. Accordingly, the different forms of auditory configuration may present
          different stages of the disease.
        supports: SUPPORT
