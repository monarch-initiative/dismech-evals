  706001d558154d712e369f4e9c6f0b78d647ab81d8e281cbf7bc909741685543:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 68
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 68
            term:
              id: MONDO:0014740
              label: autosomal dominant nonsyndromic hearing loss 68
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HOMER2 C-Terminal Extension Variant
        biological_scale: MOLECULAR
        description: 'A third allele class leaves the reading frame running past the point where it should
          stop. It includes a nonstop substitution that converts the termination codon to a tryptophan
          codon and adds ten residues, a frameshift that alters the last ten residues and adds fifty-three
          more, and a seven-nucleotide deletion producing an extended incorrect C terminus.

          These alleles are not simply weaker truncations. Transcripts carrying the nonstop variant escape
