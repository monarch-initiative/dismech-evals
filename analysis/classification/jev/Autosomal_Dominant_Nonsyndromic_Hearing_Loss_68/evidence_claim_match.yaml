        variant_origin: GERMLINE
        gene_term:
          preferred_term: HOMER2
          term:
            id: hgnc:17513
            label: HOMER2
        notes: 'HOMER2 maps to chromosome 15q24.3 and has nine exons. Two transcripts are described, encoding
          a 343-residue and a 354-residue isoform, and both numbering systems appear in the DFNA68 literature
          for the same variants - the founding missense allele is p.Arg185Pro against the shorter isoform
          and p.Arg196Pro against the longer one. A reader comparing two DFNA68 papers will meet both
          spellings and they are not two alleles.

          Every reported allele is heterozygous, and the allele classes are curated as three separate
          pathophysiology nodes because their proposed mechanisms differ: a coiled-coil missense change
          acting as a dominant negative, frameshift truncations inside the CDC42-binding domain that destabilise
          the product and reduce its multimerisation, and extension variants that run past the stop codon
          and have been argued to act by gain of function. What unites them is a negative: none of them
          is haploinsufficiency.

          The mouse null phenotype led the founding authors to nominate HOMER2 as a candidate for autosomal
          recessive hearing loss in humans as well. No recessive HOMER2 patient appears among the nine
          PubMed records returned by the search recorded in the notes below, so that prediction is still
          open a decade later.'
      selected_evidence:
        snippet: HOMER2 belongs to the homer family of post-synaptic density scaffolding proteins and
          is expressed as two isoforms, HOMER2 isoform 1 (NM_004839, 343 aa) and isoform 2 (NM_199330.2,
          354 aa), which differ by 11 amino acids.
