      assertion_type: ClinicalBurden
      assertion:
        burden_level: MODERATE
        rationale: 'DFNA68 is not life-threatening and involves no organ system other than the ear, but
          it is lifelong, progressive and ends in severe or profound deafness in an adult who acquired
          speech normally and then lost access to it. The functional cost is documented at the severe
          end: one patient reached 8 percent bilateral speech discrimination and required cochlear implantation.
          Management is amplification, then implantation, then ongoing audiological follow-up; none of
          the six primary reports names a disease-modifying option.

          MODERATE rather than HIGH because the burden is confined to one sensory modality, is substantially
          correctable by devices whose benefit in this disease has been demonstrated, and carries no reported
          mortality or systemic morbidity. MODERATE rather than LOW because the deficit is progressive
          and permanent, and the endpoint is profound deafness.'
      selected_evidence:
        snippet: age-matched patients in both families display quite similar hearing loss phenotypes consisting
          of early-onset, moderate-to-profound progressive hearing loss
        supports: SUPPORT
