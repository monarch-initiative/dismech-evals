          family had normal intelligence and speech. The one caveat worth carrying is that a zebrafish
          study of the longest extension allele found an increase in cardiac anomalies and raised the
          possibility of a broader effect in humans, while noting that its own patient had no cardiac
          abnormality. That is curated as an open question below rather than as a phenotype.

          Curated as a REFUTED phenotype, with no phenotype_term and no frequency, for the same reason
          as the vestibular entry above.'
      selected_evidence:
        snippet: Clinical examination was negative for any findings consistent with syndromic hearing
          loss and also ruled out autoimmune phenotypes.
