  79b35e00853e434500b7264c07557859c63a96a78c1a418a76397c3489e329ca:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 7
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 7
            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: Phenotype
      assertion:
        name: Asymmetric Sensorineural Hearing Loss
        category: Auditory
        description: Hearing thresholds differ appreciably between the two ears. This was found in all
          probands and most affected individuals of a five-family DFNA7 series, and is unusual enough
          for a dominant nonsyndromic form that the authors proposed LMX1A as a candidate gene to consider
          specifically when asymmetric dominant hearing loss is encountered.
        frequency: FREQUENT
        phenotype_term:
          preferred_term: Asymmetric sensorineural hearing impairment
          term:
            id: HP:0000407
            label: Sensorineural hearing impairment
        notes: 'HPO has no term for asymmetric hearing impairment, so phenotype_term is bound to the accurate
          parent HP:0000407 and the asymmetry is carried by preferred_term. Binding a narrower but wrong
          term would be worse than this.

          Frequency is FREQUENT rather than VERY_FREQUENT, and the spread across sources is why. Asymmetry
          was universal among probands in the Korean five-family series but the founding Dutch families
          were mostly symmetric, two individuals in the Chinese family are described as symmetric, and
          the two-centre Korean series that counted with an explicit threshold found it in five of nine
          patients. The Korean cohort is the one that looked for asymmetry deliberately, which makes it
          the most sensitive series and also the most likely to be ascertainment dependent; grading to
          it alone would overstate the phenotype in the disease as a whole.'
      selected_evidence:
        snippet: For the first time, we suggest that LMX1A is one of the candidate genes which, if altered,
          could be associated with dominantly inherited asymmetric hearing loss.
        supports: SUPPORT
