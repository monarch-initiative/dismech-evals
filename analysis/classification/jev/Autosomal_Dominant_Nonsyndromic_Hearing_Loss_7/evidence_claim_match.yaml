      assertion:
        name: Cochlear Hair Cell Apoptosis
        description: A candidate cellular endpoint, supported only in a cell line so far. In HEI-OC1 auditory
          cells, the C-terminal domain of LMX1A was shown to be important for mediating apoptosis, and
          cells carrying the heterozygous frameshift variant upregulated several hearing-loss-associated
          genes at the transcript level. This is included because it is the only cellular death mechanism
          yet proposed for DFNA7, and flagged as in vitro because no human or mouse cochlear histology
          exists for a heterozygous LMX1A allele.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlea auditory hair cell
          term:
            id: CL:4023120
            label: cochlea auditory hair cell
      selected_evidence:
        snippet: Furthermore, apoptosis assays suggested that the C-terminal domain of the LMX1A was important
          for mediating apoptosis in the cochlear hair cells.
        supports: SUPPORT
