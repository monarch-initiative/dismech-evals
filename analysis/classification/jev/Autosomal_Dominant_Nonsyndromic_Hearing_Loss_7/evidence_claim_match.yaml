            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Lmx1a mutanlallemand and Belly Spot and Deafness mice
        species: Mouse
        genotype: Lmx1a mtl splice-site or bsd exon-3 deletion alleles; homozygotes, heterozygotes and
          controls
        publication: PMID:23226461
        description: Spontaneous functional-null alleles produce severe congenital cochleovestibular malformations
          and deafness in homozygotes. ABR comparisons include approximately six-week-old mice and sixteen-week-old
          complementation offspring. Whole-embryo E10.5 RNA for Hmx2/3 and Pax2 was reduced, but early
          otic Hmx3/Pax2 protein patterns were similar; the authors caution that RNA changes may arise
          outside the ear or secondarily to malformed structures. These are not demonstrated direct auditory
          transcriptional targets.
        genes:
        - preferred_term: LMX1A
          term:
            id: hgnc:6653
            label: LMX1A
        modeled_mechanisms:
        - target: Cochleovestibular Dysfunction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Models loss of cochleovestibular function after biallelic disruption; does not
            reproduce the patient heterozygous genotype.
          limitations: The severe prenatal malformation and gene dosage differ from most human presentations.
            Normal young heterozygotes do not exclude later or allele-specific effects, and human disease
            is not exclusively postdevelopmental.
          readouts:
          - name: ABR in homozygous mtl/bsd mutants
            target: Cochleovestibular Dysfunction
            direction: DECREASED
            interpretation: No evoked response at the maximum tested stimulus of 95 dB SPL.
          - name: ABR thresholds in heterozygous controls
            target: Cochleovestibular Dysfunction
            direction: UNCHANGED
            interpretation: Normal thresholds at the tested young ages.
      selected_evidence:
        snippet: The characterization of these two new Lmx1a alleles highlights the critical role of this
          gene in the development of the cochlea and vestibular system.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
