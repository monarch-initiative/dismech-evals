      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: lmx1a_cellular_stress
        hypothesis_label: LMX1A dysfunction may impair auditory cellular homeostasis
        status: EMERGING
        description: RNA sequencing and exploratory DIA proteomics compared mutant and wild-type Lmx1a
          overexpression in HEI-OC1 cells. Enrichment implicated immune signaling, ER stress, ionic/metabolic
          regulation and synaptic programs. These are cell-line signatures, not demonstrated inflammation,
          excitotoxicity, infection or necroptosis in DFNA7 patients. The authors explicitly acknowledge
          nonspecific responses to artificial overexpression. Earlier C-terminal-domain apoptosis assays
          indicate a role in survival regulation but, in the accessible abstract, do not establish increased
          patient hair-cell death. Native-cell perturbation and rescue are needed to assign downstream
          causal steps.
      selected_evidence:
        snippet: This dual‐validation approach revealed synchronized enrichment in proteostasis and ER
          stress networks
        supports: SUPPORT
