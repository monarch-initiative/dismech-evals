  515e563bd5f53e6d1c0148d943d1121137b4581084af33ca95bae05b044867de:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 7
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 7
            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfna7_locus_to_gene_assignment
        kind: KNOWLEDGE_GAP
        prompt: Does the founding Norwegian DFNA7 family actually carry an LMX1A variant? The locus and
          the gene were established 22 years apart in different populations, and no report connects them
          in the original pedigree.
        attaches_to:
        - disease#Autosomal Dominant Nonsyndromic Hearing Loss 7
        - genetic#LMX1A
        rationale: 'DFNA7 is a locus name, not a gene name. It was defined in 1996 by linkage in a large
          Norwegian family with progressive high-tone hearing loss to a 22 cM interval between D1S104
          and D1S466 on 1q21-q23, and the paper noted that the region contained several attractive candidate
          genes. MONDO''s definition of MONDO:0011074 still describes the material basis as variation
          in that chromosome region rather than as a gene.

          LMX1A lies at 1q23.3, inside the interval, and heterozygous LMX1A variants were shown to cause
          dominant progressive hearing impairment in 2018 in two unrelated Dutch families. Every subsequent
          family in the literature is an independent LMX1A family. But no published report identifies
          an LMX1A variant in the Norwegian pedigree, so the equation of the locus with the gene rests
          on positional plausibility plus replication in other families rather than on solving the founding
          one.

          Two things follow. First, the phenotype MONDO attributes to DFNA7 is the Norwegian family''s
          progressive high-tone loss, whereas the phenotype the LMX1A literature describes is progressive
          asymmetric loss across frequencies with vestibular involvement in about half of cases. Those
          are not obviously the same description, and if they are not the same disease the label is doing
          two jobs. Second, the interval is large and gene-dense, so an alternative gene in 1q21-q23 accounting
          for the Norwegian family is not excluded by anything published.

          This is recorded rather than resolved because it does not change how the entry is curated: everything
          in the pathograph below comes from molecularly confirmed LMX1A families. It changes what the
          entry''s name should be taken to guarantee.'
      selected_evidence:
        snippet: The region contains several attractive candidate genes.
        supports: SUPPORT
