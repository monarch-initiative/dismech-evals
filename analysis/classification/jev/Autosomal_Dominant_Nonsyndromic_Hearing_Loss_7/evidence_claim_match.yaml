      assertion_type: Discussion
      assertion:
        discussion_id: lmx1a_dominant_model_gap
        kind: HUMAN_MODEL_MISMATCH
        prompt: Every Lmx1a animal model of hearing loss is a homozygous null with a malformed inner ear,
          while DFNA7 is a heterozygous, anatomically normal ear that deteriorates. Does mouse Lmx1a heterozygosity
          really produce no auditory phenotype, or has it never been looked for with sufficiently sensitive
          or sufficiently aged measurements?
        attaches_to:
        - pathophysiology#Impaired Maintenance of Cochleovestibular Function
        - animal_models#Mouse
        rationale: 'This is the central translational problem for DFNA7 and it is a mismatch rather than
          an absence of evidence. Three independent Lmx1a alleles have been characterised in mice and
          all report that heterozygotes hear normally, so the negative result is reproducible. But the
          reported ABR comparisons are made in young animals in studies designed around the homozygous
          phenotype, whereas the human disease is late-onset and progressive and in some individuals does
          not declare itself until mid-adulthood. A mouse tested at a few weeks old is not the right test
          of a phenotype whose human equivalent takes decades.

          The consequence is that the mechanistic claim this entry rests on, that one LMX1A copy builds
          an ear but cannot maintain it, has never been tested in an animal. So the competing developmental
          explanation offered in the original human description, that imaging-invisible developmental
          abnormalities set up later decline, remains equally live. Aged heterozygous Lmx1a mice with
          serial ABR and DPOAE, and cochlear histology at the end of that series, would separate the two,
          and a knock-in of a human homeodomain allele would be a stronger test than heterozygous null
          because human alleles include missense substitutions with residual activity rather than clean
          deletions.'
