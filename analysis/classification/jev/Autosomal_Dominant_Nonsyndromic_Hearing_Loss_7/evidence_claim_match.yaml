            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lmx1a_asymmetry_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Why is DFNA7 hearing loss asymmetric? What makes a cell-autonomous transcription factor
          dosage deficit, present equally in both ears, produce different thresholds on the two sides?
        attaches_to:
        - phenotypes#Asymmetric Sensorineural Hearing Loss
        - pathophysiology#Impaired Maintenance of Cochleovestibular Function
        rationale: 'Asymmetry is the most distinctive clinical feature of DFNA7 and nothing in the curated
          mechanism explains it. A germline heterozygous variant is present in both cochleae at the same
          dosage, so a purely dose-dependent maintenance failure predicts symmetric decline. Asymmetry
          implies that the deficit is permissive rather than deterministic, with something stochastic
          or environmental deciding how fast each ear declines, but what that something is has not been
          investigated.

          This is not idle. If a second, modifiable factor determines which ear declines first, it is
          a therapeutic target that the transcription factor itself is not; and if asymmetry is instead
          stochastic clonal drift in a maintenance process, that argues the window for intervention is
          set per ear rather than per patient. Nobody has reported longitudinal audiometry designed to
          distinguish these, nor tested whether the more-affected ear is predicted by noise history, otologic
          history or side dominance.'
      selected_evidence:
        snippet: It is important to note that asymmetric hearing loss was identified in all probands and
          most affected individuals, although the extent of asymmetry varied.
        supports: SUPPORT
