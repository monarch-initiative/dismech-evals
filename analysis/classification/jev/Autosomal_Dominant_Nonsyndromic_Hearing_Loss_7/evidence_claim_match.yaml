            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Maintenance of Cochleovestibular Function
        description: 'The proposed human mechanism: reduced LMX1A dosage is compatible with building an
          anatomically normal inner ear but not with sustaining its function. The clinical observations
          behind this are that onset is typically late, the course is progressive, and computed tomography
          shows no cochleovestibular malformation in affected individuals.

          Two readings of this were offered in the original description and neither has been resolved.
          Either LMX1A has an ongoing postdevelopmental requirement in the cochleovestibular epithelium,
          or subtle developmental abnormalities below the resolution of clinical imaging set up a structure
          that degrades over time. The distinction is not academic: only the first predicts that raising
          LMX1A expression in an adult ear could help.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        - preferred_term: vestibular hair cell
          term:
            id: CL:0000609
            label: vestibular hair cell
        biological_processes:
        - preferred_term: detection of mechanical stimulus involved in sensory perception of sound
          term:
            id: GO:0050910
            label: detection of mechanical stimulus involved in sensory perception of sound
          modifier: DECREASED
        - preferred_term: detection of mechanical stimulus involved in equilibrioception
          term:
            id: GO:0050973
            label: detection of mechanical stimulus involved in equilibrioception
          modifier: DECREASED
      selected_evidence:
        snippet: We propose that a single LMX1A wild-type copy is sufficient for normal development but
          insufficient for maintenance of cochleovestibular function.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
