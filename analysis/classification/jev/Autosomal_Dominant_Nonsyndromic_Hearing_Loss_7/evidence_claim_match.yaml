          - pathophysiology#Impaired Maintenance of Cochleovestibular Function
          refuting_outcome:
          - Heterozygotes remain audiometrically and histologically indistinguishable from wild-type littermates
            into old age, which would place the human mechanism outside simple mouse gene dosage and favour
            either the subtle-developmental explanation or a human-specific requirement.
