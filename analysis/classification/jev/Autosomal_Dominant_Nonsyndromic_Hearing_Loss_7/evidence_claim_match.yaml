      reference_title: Mutanlallemand (mtl) and Belly Spot and Deafness (bsd) are two new mutations of
        Lmx1a causing severe cochlear and vestibular defects.
      evidence_source: MODEL_ORGANISM
      explanation: The authors' own summary of what these alleles establish.
