        prompt: Has the molecular cause of the original Norwegian DFNA7 linkage family been identified?
        attaches_to:
        - disease#Autosomal Dominant Nonsyndromic Hearing Loss 7
        - genetic#LMX1A
        rationale: The 1996 study mapped a 22-cM interval on 1q21-q23 without identifying a causal variant.
          The retrieved later LMX1A reports establish the dominant gene–disease relationship in other
          families, and ClinGen classified it as definitive in 2025. They do not solve the original Norwegian
          pedigree. High-frequency hearing loss in that family is compatible with later LMX1A presentations
          and is not evidence for a different disease.
        status: OPEN
      selected_evidence:
        snippet: Analysis of recombinant individuals maps the deafness gene (DFNA7) to a 22 cM region
          between D1S104 and D1S466.
