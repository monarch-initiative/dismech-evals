  db1dedc353029b6ebb64afe3a99c6636f12b6b73cfee1abe53c48544a2d5fa95:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 7
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 7
            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: LMX1A Haploinsufficiency
        description: 'A single functional LMX1A allele remains. The reported alleles are heterogeneous
          in kind, including homeodomain missense substitutions that weaken DNA binding, nonsense alleles
          that remove the homeodomain entirely, and C-terminal frameshifts that delete the helix mediating
          LIM2-domain interaction. What unites them is the direction of the effect on protein dosage rather
          than any shared structural lesion.

          That this is dosage insufficiency and not interference by the mutant protein has been tested
          directly. Plasmid titration and Actinomycin D transcript-chase experiments corroborated haploinsufficiency
          and excluded a dominant-negative effect, and an earlier study reached the same conclusion for
          a de novo homeodomain allele. The distinction matters therapeutically: a haploinsufficiency
          mechanism is in principle addressable by raising expression of the remaining allele, whereas
          a dominant-negative one is not.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: LMX1A
          term:
            id: hgnc:6653
            label: LMX1A
      selected_evidence:
        snippet: Furthermore, plasmid titration experiments and Actinomycin D chase assays functionally
          corroborated the haploinsufficiency mechanism and excluded the dominant-negative effect.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42253511
      reference_title: A Novel LMX1A Frameshift Variant Underlies Familial Phenotypic Heterogeneity in
        DFNA7.
      evidence_source: IN_VITRO
      explanation: The direct experimental test that separates haploinsufficiency from a dominant-negative
