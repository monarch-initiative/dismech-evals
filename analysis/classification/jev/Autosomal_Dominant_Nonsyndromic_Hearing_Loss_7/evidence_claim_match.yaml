  2a55cd0249ce597ae105d94c5142e355550d3edf231b2eb87e28291d7cd90235:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 7
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 7
            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Transactivation of LMX1A Target Genes
        description: 'LMX1A is a DNA-binding transcription factor, and every disease allele assayed so
          far reduces its ability to drive transcription of downstream targets in reporter systems. The
          structural routes differ. Homeodomain missense substitutions attenuate the protein-DNA interaction;
          a premature stop destroys the protein including the homeodomain; a C-terminal frameshift removes
          a helix required for LIM2-domain interaction and for protein-DNA binding, without triggering
          nonsense-mediated decay.

          The quantitative version of this node is what gives DFNA7 its genotype-phenotype correlation:
          the allele with the largest measured loss of transcriptional activity is the one found in congenital
          severe-to-profound deafness, while alleles with only moderately reduced activity are associated
          with later-onset progressive loss.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: DECREASED
      selected_evidence:
        snippet: Compared with the wild-type protein, all mutant LMX1A proteins had significantly reduced
          transactivation efficiency, indicating that the ability to elicit transcription of the downstream
          target genes of LMX1A was severely compromised.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
