      assertion_type: Diagnosis
      assertion:
        name: Molecular diagnosis with clinical and vestibular assessment
        description: Consider LMX1A within hearing-loss multigene panels or genomic testing for dominant
          sensorineural loss, whether symmetric or asymmetric. Interpret sequence variants using segregation,
          phenotype and variant-specific evidence; a VUS is not diagnostic. Audiology defines each ear’s
          severity and progression, and vestibular evaluation can identify deficits even without reported
          vertigo. Normal imaging is compatible with the diagnosis; bilateral cochlear-aperture stenosis
          was reported in one severely affected proband, with imaging unavailable for other affected relatives.
          This does not establish a universal malformation or proven structural mediator.
      selected_evidence:
        snippet: For the first time, we suggest that LMX1A is one of the candidate genes which, if altered,
          could be associated with dominantly inherited asymmetric hearing loss.
        supports: SUPPORT
