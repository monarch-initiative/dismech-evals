              term:
                id: hgnc:6653
                label: LMX1A
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Maintenance of Cochleovestibular Function
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: The mouse does not reproduce the human maintenance failure. Instead of an anatomically
          normal ear that deteriorates, homozygotes have an ear that was never built correctly, and heterozygotes
          have no phenotype at all.
        limitations: 'Recessive lethality of the phenotype for modelling purposes: there is no mouse genotype
          corresponding to a human DFNA7 patient. The homozygous lesion is morphogenetic and prenatal,
          evident on paint-filled inner ears at E16.5, whereas human DFNA7 hearing loss frequently begins
          in adolescence or adulthood on an ear that imaging calls normal. Any inference from these mice
          about whether adult LMX1A restoration could help is therefore unsupported.'
      selected_evidence:
        snippet: Paint-filled inner ears at E16.5 revealed that mtl and bsd homozygotes lack endolymphatic
          ducts and semicircular canals and have short cochlear ducts.
        supports: REFUTE
