  efa13a3297e45f862d979790f0b45b98a30ab251d0594fc91c23b638d2d21d73:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 7
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 7
            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Lmx1a mutanlallemand and Belly Spot and Deafness mice
        species: Mouse
        genotype: Lmx1a mtl and Lmx1a bsd, homozygous
        publication: PMID:23226461
        description: 'Two spontaneous Lmx1a alleles: mtl, a 3'' splice-site point mutation in exon 4 producing
          a truncated protein affecting the homeodomain, and bsd, a genomic deletion removing exon 3 and
          truncating within the LIM2 domain. Both reduce Lmx1a transcript levels. Homozygotes are deaf
          by auditory brainstem response, circle and toss their heads, and lack endolymphatic ducts and
          semicircular canals with short cochlear ducts. Hmx2/3 and Pax2 expression are down-regulated,
          placing Lmx1a upstream of those factors in early inner ear morphogenesis.'
        genes:
        - preferred_term: LMX1A
          term:
            id: hgnc:6653
            label: LMX1A
        modeled_mechanisms:
        - target: Reduced Transactivation of LMX1A Target Genes
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'These alleles establish in vivo what the human reporter assays measure in vitro:
            truncating Lmx1a lesions reduce transcript levels and reduce expression of downstream targets.
            That is the node being modelled, and it is modelled well.'
          limitations: The relationship to DFNA7 stops there. Both alleles are recessive in the mouse.
            Heterozygous and wild-type littermates have normal hearing, so this system contains no animal
            in the genetic state that causes human DFNA7. The homozygous phenotype is a gross developmental
            malformation of the membranous labyrinth, which is precisely what human heterozygotes do not
            have on imaging. Reading these mice as a model of DFNA7 would invert the disease mechanism
            from maintenance failure to failed morphogenesis.
          readouts:
          - name: Hmx2/Hmx3 and Pax2 expression in the developing otocyst
            target: Reduced Transactivation of LMX1A Target Genes
            direction: DECREASED
            interpretation: Downstream transcriptional targets fall when Lmx1a is truncated, the in vivo
              counterpart of the reduced transactivation measured for human alleles.
          - name: Auditory brainstem response by genotype
            target: Reduced Transactivation of LMX1A Target Genes
            direction: UNCHANGED
            interpretation: 'Deliberately recorded as unchanged, because the informative result here is
              the negative one: heterozygotes hear normally, so mouse Lmx1a dosage does not reproduce
              the human dominant phenotype.'
        - target: Impaired Maintenance of Cochleovestibular Function
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The mouse does not reproduce the human maintenance failure. Instead of an anatomically
            normal ear that deteriorates, homozygotes have an ear that was never built correctly, and
            heterozygotes have no phenotype at all.
          limitations: 'Recessive lethality of the phenotype for modelling purposes: there is no mouse
            genotype corresponding to a human DFNA7 patient. The homozygous lesion is morphogenetic and
            prenatal, evident on paint-filled inner ears at E16.5, whereas human DFNA7 hearing loss frequently
            begins in adolescence or adulthood on an ear that imaging calls normal. Any inference from
            these mice about whether adult LMX1A restoration could help is therefore unsupported.'
      selected_evidence:
        snippet: The characterization of these two new Lmx1a alleles highlights the critical role of this
          gene in the development of the cochlea and vestibular system.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
