            publication: PMID:23226461
            description: 'Two spontaneous Lmx1a alleles: mtl, a 3'' splice-site point mutation in exon
              4 producing a truncated protein affecting the homeodomain, and bsd, a genomic deletion removing
              exon 3 and truncating within the LIM2 domain. Both reduce Lmx1a transcript levels. Homozygotes
              are deaf by auditory brainstem response, circle and toss their heads, and lack endolymphatic
              ducts and semicircular canals with short cochlear ducts. Hmx2/3 and Pax2 expression are
              down-regulated, placing Lmx1a upstream of those factors in early inner ear morphogenesis.'
            genes:
