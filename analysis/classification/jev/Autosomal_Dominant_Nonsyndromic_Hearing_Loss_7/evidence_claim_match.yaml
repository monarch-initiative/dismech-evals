      assertion_type: Phenotype
      assertion:
        name: Asymmetric Sensorineural Hearing Loss
        category: Auditory
        description: Hearing thresholds differ appreciably between the two ears. This was found in all
          probands and most affected individuals of a five-family DFNA7 series, and is unusual enough
          for a dominant nonsyndromic form that the authors proposed LMX1A as a candidate gene to consider
          specifically when asymmetric dominant hearing loss is encountered.
        phenotype_term:
          preferred_term: Asymmetric sensorineural hearing impairment
          term:
            id: HP:0000407
            label: Sensorineural hearing impairment
        notes: 'Asymmetry is represented using the sensorineural hearing-impairment term with the interaural
          pattern specified in prose. Frequencies differ across small, partially overlapping cohorts:
          two of seven founding-family subjects were asymmetric, and a later Korean series reported five
          of nine. That paper uses >10 dB in methods and >15 dB in results. A uniform population frequency
          or universal asymmetry is therefore not asserted.'
      selected_evidence:
        snippet: It is important to note that asymmetric hearing loss was identified in all probands and
          most affected individuals, although the extent of asymmetry varied.
        supports: SUPPORT
