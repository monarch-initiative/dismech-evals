            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: Genetic
      assertion:
        name: LMX1A
        notes: LMX1A encodes a LIM-homeodomain transcription factor with two N-terminal LIM domains that
          mediate protein-protein interactions, a central homeodomain that binds DNA, and a C-terminal
          region required for the protein-DNA interaction and for interaction with the LIM2 domain. Disease
          alleles are distributed across all three regions. Val241 in the homeodomain has now been hit
          by at least two different substitutions in unrelated families, which has been suggested as a
          possible mutational hotspot.
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: LMX1A
          term:
            id: hgnc:6653
            label: LMX1A
        case_fractions:
        - population: Korean hearing loss probands undergoing exome sequencing
          case_fraction_percent: 0.7
          cohort_size: 728
          notes: Five DFNA7 families among 728 probands sequenced regardless of audiological phenotype.
            This is a share of an ascertained hearing loss cohort, not a population prevalence, and it
            is the only quantitative figure available for how often LMX1A explains hereditary hearing
            loss.
      selected_evidence:
        snippet: Pathogenic variants in the LIM-homeodomain transcription factor LMX1A represent a rare
          yet critical etiology for autosomal dominant nonsyndromic hearing loss 7 (DFNA7) and less frequently,
          its autosomal recessive counterpart (ARNSHL).
        supports: SUPPORT
