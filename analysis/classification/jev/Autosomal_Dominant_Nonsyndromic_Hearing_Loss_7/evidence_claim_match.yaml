      assertion_type: Pathophysiology
      assertion:
        name: Impaired Maintenance of Cochleovestibular Function
        description: 'The proposed human mechanism: reduced LMX1A dosage is compatible with building an
          anatomically normal inner ear but not with sustaining its function. The clinical observations
          behind this are that onset is typically late, the course is progressive, and computed tomography
          shows no cochleovestibular malformation in affected individuals.

          Two readings of this were offered in the original description and neither has been resolved.
          Either LMX1A has an ongoing postdevelopmental requirement in the cochleovestibular epithelium,
          or subtle developmental abnormalities below the resolution of clinical imaging set up a structure
          that degrades over time. The distinction is not academic: only the first predicts that raising
          LMX1A expression in an adult ear could help.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
