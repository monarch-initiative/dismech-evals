  abeaf7b293a6c52b75f0634981b5da9448b359335b8c6872a63960af23c88df4:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 7
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 7
            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Lmx1a dreher null mouse
        species: Mouse
        genotype: Lmx1a dreher, homozygous functional null
        publication: PMID:19540218
        description: 'The classical Lmx1a functional null. Homozygotes lack the endolymphatic duct and
          have a poorly developed membranous labyrinth. The more informative finding is that the three
          primary otic fates are still specified but their boundaries are violated, with an expanded neurogenic
          domain and ectopic vestibular-like hair cells in the cochlear duct, which is what makes Lmx1a
          a selector gene rather than a differentiation factor. Later work on the same allele showed the
          stria vascularis fails to form: marginal and intermediate cell markers are absent, prospective
          intermediate cells migrate and then disappear, and no endocochlear potential is generated.'
        genes:
        - preferred_term: LMX1A
          term:
            id: hgnc:6653
            label: LMX1A
        modeled_mechanisms:
        - target: LMX1A Haploinsufficiency
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Included because it is the model most often cited when LMX1A is discussed, and
            because being explicit about what it does not show is more useful than omitting it. The dreher
            null defines the gene's developmental job comprehensively. It does not model a heterozygous
            dosage reduction.
          limitations: 'Complete homozygous loss of function, against a human disease of one remaining
            functional allele. The phenotypes are of a kind absent from human DFNA7: no endocochlear potential,
            absent stria vascularis marker expression, ectopic vestibular-like hair cells in the cochlear
            duct. Quantitatively and qualitatively this is a different lesion, and citing it as the DFNA7
            mechanism would overstate what heterozygous human alleles do.'
          readouts:
          - name: Endocochlear potential
            target: LMX1A Haploinsufficiency
            direction: ABOLISHED
            interpretation: Complete Lmx1a loss abolishes the endocochlear potential. No comparable measurement
              exists for a heterozygous allele in any species.
          - name: Stria vascularis marker expression
            target: LMX1A Haploinsufficiency
            direction: DECREASED
            interpretation: Marginal and intermediate cell identity markers are absent, showing that Lmx1a
              is required for strial cell differentiation and not only for gross morphogenesis.
      selected_evidence:
        snippet: The transcription factor Lmx1a is widely expressed during early inner ear development,
          and mice lacking Lmx1a expression exhibit fusion of cochlear and vestibular hair cells and fail
          to form the ductus reuniens and the endolymphatic sac.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/1
