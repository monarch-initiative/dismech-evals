              label: autosomal dominant nonsyndromic hearing loss 7
        context:
        - path: /animal_models/1
          value:
            name: Lmx1a dreher null mouse
            species: Mouse
            genotype: Lmx1a dreher, homozygous functional null
            publication: PMID:19540218
            description: 'The classical Lmx1a functional null. Homozygotes lack the endolymphatic duct
              and have a poorly developed membranous labyrinth. The more informative finding is that the
              three primary otic fates are still specified but their boundaries are violated, with an
              expanded neurogenic domain and ectopic vestibular-like hair cells in the cochlear duct,
              which is what makes Lmx1a a selector gene rather than a differentiation factor. Later work
              on the same allele showed the stria vascularis fails to form: marginal and intermediate
              cell markers are absent, prospective intermediate cells migrate and then disappear, and
              no endocochlear potential is generated.'
            genes:
            - preferred_term: LMX1A
              term:
                id: hgnc:6653
                label: LMX1A
          role: ancestor
        - path: /animal_models/1/modeled_mechanisms/0
          value:
            target: LMX1A Haploinsufficiency
            relationship: FAILS_TO_RECAPITULATE
            fidelity: LOW
            description: Included because it is the model most often cited when LMX1A is discussed, and
              because being explicit about what it does not show is more useful than omitting it. The
              dreher null defines the gene's developmental job comprehensively. It does not model a heterozygous
              dosage reduction.
            limitations: 'Complete homozygous loss of function, against a human disease of one remaining
              functional allele. The phenotypes are of a kind absent from human DFNA7: no endocochlear
              potential, absent stria vascularis marker expression, ectopic vestibular-like hair cells
              in the cochlear duct. Quantitatively and qualitatively this is a different lesion, and citing
              it as the DFNA7 mechanism would overstate what heterozygous human alleles do.'
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Stria vascularis marker expression
        target: LMX1A Haploinsufficiency
        direction: DECREASED
        interpretation: Marginal and intermediate cell identity markers are absent, showing that Lmx1a
          is required for strial cell differentiation and not only for gross morphogenesis.
      selected_evidence:
        snippet: In the absence of Lmx1a, we observe a lack of proteins specific to the stria vascularis,
          such as BSND and KCNQ1 in marginal cells and CD44 in intermediate cells.
        supports: SUPPORT
