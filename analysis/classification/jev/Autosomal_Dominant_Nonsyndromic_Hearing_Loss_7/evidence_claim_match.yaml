  6c159bb7f613ceba00ba12013403fafb3234cfced1f7536cb23eed0d9d257920:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 7
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 7
            term:
              id: MONDO:0011074
              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: Treatment
      assertion:
        name: Cochlear Implantation
        description: 'Cochlear implantation for an ear that has progressed to profound loss. The reported
          DFNA7 experience is one patient: her left ear deteriorated to profound loss while the asymmetry
          between the ears persisted, she underwent unilateral implantation, and her speech perception
          improved significantly at three and six months. Follow-up beyond six months is not reported
          for her.

          Asymmetry is what makes implantation a live question earlier in DFNA7 than in a symmetric dominant
          loss: one ear can reach implantable thresholds while the other is still aidable, so the decision
          is per-ear rather than per-patient.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: cochlear implantation
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        notes: 'treatment_term is bound to NCIT:C15329 Surgical Procedure. NCIT''s cochlear implant concepts
          (for example NCIT:C157820 Cochlear Implant) are device terms and are not reachable from NCIT:C25218
          Clinical Intervention or Procedure, so they fail TreatmentActionTerm validation; the accurate
          broader action term is used rather than a forced narrower binding. therapeutic_modality is DEVICE
          rather than SURGERY because the therapeutic platform is the implant, with surgery as the route
          of delivery.

          A caution for anyone mining PMID:36140227 further: it reports four transcription-factor genes
          side by side, and its implantation results are not all LMX1A. The three implantees with favourable
          one-year K-CID, PB and spondee scores are POU4F3 patients, the middle-ear-implantation case
          is POU4F3, and the patient implanted at 80 whose K-CID rose from 18 to 60 percent at two years
          carries an EYA4 variant. Only patient SB727 is LMX1A, and only her results are curated here.'
      selected_evidence:
        snippet: The patient eventually underwent unilateral CI, with significant improvement in her speech
          perception scores 3 and 6 months postoperatively (Figure 2c).
        supports: SUPPORT
    origin:
