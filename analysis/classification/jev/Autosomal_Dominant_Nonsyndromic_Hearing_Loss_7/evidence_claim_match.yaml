              label: autosomal dominant nonsyndromic hearing loss 7
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Lmx1a drJ functional-null mouse
        species: Mouse
        genotype: Lmx1a drJ/drJ with heterozygous and wild-type controls
        publication: PMID:19540218
        description: The drJ functional-null allele disrupts sensory/nonsensory boundaries and formation
          of the membranous labyrinth. Later work documents defective strial differentiation and endocochlear
          potential below 6 mV in homozygotes. The 2025 study explicitly measured wild-type, heterozygous
          and homozygous animals at P12 and P21, six per age/genotype. Loss of cochlear melanoblast labeling
          does not establish whether the cells died or changed location.
        genes:
        - preferred_term: LMX1A
          term:
            id: hgnc:6653
            label: LMX1A
        modeled_mechanisms:
        - target: Impaired Strial Differentiation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Establishes the null-model strial phenotype underlying the candidate human mechanism.
          limitations: The strong phenotype is biallelic and developmental. Human heterozygous strial
            physiology and a late-life heterozygote time course are not established by this experiment.
          readouts:
          - name: Strial differentiation markers
            target: Impaired Strial Differentiation
            direction: DECREASED
            interpretation: Loss of marginal/intermediate markers in the homozygous mutant.
        - target: Reduced Endocochlear Potential
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Measures endocochlear-potential failure in the homozygous functional-null model.
          limitations: The strong phenotype is biallelic and developmental. Human heterozygous strial
            physiology and a late-life heterozygote time course are not established by this experiment.
          readouts:
          - name: Homozygous endocochlear potential at P12 and P21
            target: Reduced Endocochlear Potential
            direction: DECREASED
            interpretation: Below 6 mV; wild-type and heterozygous groups were measured in the same study.
      selected_evidence:
        snippet: Furthermore, aberrant and ectopic sensory organs are observed; most striking among these
          is vestibular-like hair cells located in the cochlear duct.
        supports: SUPPORT
