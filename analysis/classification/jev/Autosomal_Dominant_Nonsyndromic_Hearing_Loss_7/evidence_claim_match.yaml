      assertion_type: Diagnosis
      assertion:
        name: Consider LMX1A when dominant hearing loss is asymmetric
        description: DFNA7 is reached by gene-panel or exome sequencing rather than by any specific audiological
          test, but asymmetry is a usable prompt. Asymmetric thresholds in a dominant pedigree would ordinarily
          suggest an acquired or structural cause; in this disorder they are the rule. Imaging is typically
          normal, so a normal CT does not argue against the diagnosis, and in one severely affected proband
          high-resolution imaging showed bilateral cochlear aperture stenosis, so an abnormal scan does
          not argue against it either.
      selected_evidence:
        snippet: For the first time, we suggest that LMX1A is one of the candidate genes which, if altered,
          could be associated with dominantly inherited asymmetric hearing loss.
        supports: SUPPORT
