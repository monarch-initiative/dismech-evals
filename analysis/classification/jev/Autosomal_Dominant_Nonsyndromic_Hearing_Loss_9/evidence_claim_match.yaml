      assertion:
        name: Autosomal recessive nonsyndromic hearing loss 110 (DFNB110)
        description: Biallelic inactivating COCH variants usually cause prelingual DFNB110; vestibular
          involvement is variable. Some coding variants alter splicing. Heterozygous loss-of-function
          carriers may hear normally, whereas dominant DFNA9 often involves an abnormal protein product.
          Early onset can occur in either disorder, and a terminal frameshift associated with DFNA9 should
          not be equated with simple loss of function.
        distinguishing_features:
        - Biallelic loss-of-function or splice-altering COCH variants versus a heterozygous disease-associated
          abnormal-protein allele.
        - Usually congenital or prelingual onset in DFNB110, but age of onset alone is insufficient.
      selected_evidence:
        snippet: Here, we describe two brothers with congenital prelingual deafness and a homozygous nonsense
          c.292C>T(p.Arg98*) COCH variant, suggesting a loss-of-function effect.
        supports: SUPPORT
