  964db6b874bd98b1e7762c20eebb48850e3130de4b28a18543cfec413b929366:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 9
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 9
            term:
              id: MONDO:0011058
              label: autosomal dominant nonsyndromic hearing loss 9
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous COCH Variant
        description: 'The initiating lesion is a heterozygous germline COCH variant, usually missense
          or in-frame. The terminal p.Asp544Valfs*3 variant also segregated with hearing loss and produced
          abnormal multimers in cells despite preserved overall secretion and cell viability. Dominant
          DFNA9 is not explained by simple haploinsufficiency: heterozygous null mice retained hearing
          and a human p.Cys50Leufs*8 carrier parent had normal hearing. This auditory dosage evidence
          does not establish the safety of reducing cochlin for all vestibular functions. Dominant interference
          and toxic effects have experimental support for selected variants; a universal functional-impact
          category is not assigned.'
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
        genes:
        - preferred_term: COCH
          term:
            id: hgnc:2180
            label: COCH
        molecular_functions:
        - preferred_term: collagen binding (cochlin vWFA2 domain)
          term:
            id: GO:0005518
            label: collagen binding
      selected_evidence:
        snippet: Here we report three missense mutations in human COCH (previously described as Coch5b2),
          a novel cochlear gene, in three unrelated kindreds with DFNA9.
        supports: SUPPORT
