      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant
        description: Heterozygous COCH variants segregate with progressive hearing loss and variable vestibular
          dysfunction in multigenerational pedigrees. Most are missense or in-frame variants; a terminal
          frameshift with experimental multimer formation has also been reported. Penetrance is age dependent
          and onset varies between and within alleles. A homozygous p.Pro51Ser carrier had earlier onset
          than most heterozygous relatives. Biallelic inactivating variants usually cause prelingual recessive
          DFNB110.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: DFNA9 is an autosomal dominant, nonsyndromic, progressive sensorineural hearing loss
          with vestibular pathology.
        supports: SUPPORT
