              label: autosomal dominant nonsyndromic hearing loss 9
        context:
        - path: /pathophysiology/9
          value:
            name: Degeneration of Spiral Ganglion Dendrites in the Osseous Spiral Lamina
            description: Bilateral temporal bones from one 42-year-old p.Leu114Pro carrier with residual
              hearing showed marked degeneration of spiral-ganglion dendrites in the osseous spiral lamina.
              The left spiral-ganglion cell count was 53% of age-matched normal values, but distal dendritic
              loss was more extensive than loss of neuronal somata or sensory hair cells. This single-patient
              histological correlation supports a peripheral neural contribution to hearing loss. Postmortem
              artifact and previous lymphoma treatment limit attribution of every finding to DFNA9.
            biological_scale: TISSUE
            cell_types:
            - preferred_term: spiral ganglion neuron
              term:
                id: CL:0011113
                label: spiral ganglion neuron
            locations:
            - preferred_term: osseous spiral lamina
              term:
                id: UBERON:0006724
                label: osseus spiral lamina
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Adult-onset progressive sensorineural hearing loss
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Dendrite degeneration is the histological correlate of the measured hearing loss
          in the examined bone.
      selected_evidence:
        snippet: A quantitative cytologic analysis of atrophy in this specimen and immunostaining using
          anti-neurofilament and anti-myelin protein zero antibodies confirmed that the principal histopathologic
          correlate of hearing loss was degeneration of the dendritic fibers of spiral ganglion cells
          in the osseous spiral lamina.
        supports: SUPPORT
        directness: INDIRECT
