      assertion:
        name: Degeneration of Spiral Ganglion Dendrites in the Osseous Spiral Lamina
        description: Bilateral temporal bones from one 42-year-old p.Leu114Pro carrier with residual hearing
          showed marked degeneration of spiral-ganglion dendrites in the osseous spiral lamina. The left
          spiral-ganglion cell count was 53% of age-matched normal values, but distal dendritic loss was
          more extensive than loss of neuronal somata or sensory hair cells. This single-patient histological
          correlation supports a peripheral neural contribution to hearing loss. Postmortem artifact and
          previous lymphoma treatment limit attribution of every finding to DFNA9.
        biological_scale: TISSUE
        cell_types:
        - preferred_term: spiral ganglion neuron
          term:
            id: CL:0011113
            label: spiral ganglion neuron
