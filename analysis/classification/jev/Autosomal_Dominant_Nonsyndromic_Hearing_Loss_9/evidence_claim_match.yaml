        snippet: DFNA9 is an inner ear disorder with a unique histopathology showing loss of cellularity
          and aggregation of abundant homogeneous acellular eosinophilic deposits in the cochlear and
          vestibular labyrinths, similar to protein aggregation in well-known neurodegenerative disorders.
        supports: SUPPORT
