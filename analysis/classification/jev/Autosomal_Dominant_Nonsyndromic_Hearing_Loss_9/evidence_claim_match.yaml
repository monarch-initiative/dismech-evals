      assertion_type: Treatment
      assertion:
        name: Allele-specific antisense oligonucleotide knockdown of p.Pro51Ser COCH
        description: Experimental RNase H1 gapmer antisense oligonucleotides reduced mutant COCH transcripts
          in inducible Flp-In T-REx293 minigene cell lines. At 25 nM the lead mutation-targeting AON reduced
          mutant transcript by 60% without a significant wild-type reduction; specificity decreased at
          higher doses. Intronic haplotype markers were alternative allele-selective targets, not pathogenic
          regulatory variants. No hearing rescue was measured. Inner-ear delivery, durability and safety
          remain unresolved; preserved hearing in heterozygous null animals does not guarantee preserved
          vestibular function after knockdown.
        therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
        oligonucleotide_details:
          oligonucleotide_mechanism: RNASE_H_KNOCKDOWN
          target_gene:
