            label: COCH
        notes: 'COCH (14q12-q13) encodes cochlin: signal peptide, LCCL domain, two short intervening domains
          and two vWFA domains. Most dominant variants are LCCL-domain missense changes; p.Pro51Ser (c.151C>T)
          is a Dutch/Belgian founder allele. vWFA-domain variants include p.Phe527Cys (Korean family)
          and p.Ile541Phe (single case with external canal aggregates). Biallelic loss-of-function variants
          cause the separate recessive DFNB110. A terminal frameshift can encode an abnormal multimerizing
          product; variant class alone cannot distinguish dominant from recessive disease. No validated
          clinical modifier or universal domain-based prognostic rule is established.'
        variants:
        - name: COCH p.Pro51Ser
          gene:
            preferred_term: COCH
            term:
              id: hgnc:2180
              label: COCH
          description: Dutch/Belgian founder allele, currently described as c.151C>T; the original report
            used older nucleotide numbering. It is associated with age-dependent hearing and vestibular
            impairment. Sequence-specific antisense experiments use this allele.
        - name: COCH p.Gly88Glu
          gene:
            preferred_term: COCH
            term:
              id: hgnc:2180
              label: COCH
          description: LCCL variant associated with progressive hearing and vestibular impairment. Complete
            vestibular areflexia in midlife was less frequent than in the compared p.Pro51Ser group. G88E
            knock-in mice reproduce late functional deficits incompletely.
        - name: COCH p.Phe121Ser
          gene:
