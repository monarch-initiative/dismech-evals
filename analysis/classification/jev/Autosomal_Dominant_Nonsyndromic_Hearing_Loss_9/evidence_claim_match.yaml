  ce5fce83cb602e4af4c29cb2731a3b00e37e70f233b32507f8503af2d2a9d823:
    claim:
      about:
        disease:
          name: Autosomal Dominant Nonsyndromic Hearing Loss 9
          disease_term:
            preferred_term: autosomal dominant nonsyndromic hearing loss 9
            term:
              id: MONDO:0011058
              label: autosomal dominant nonsyndromic hearing loss 9
        context: []
      assertion_type: Genetic
      assertion:
        name: COCH
        association: Causal
        gene_term:
          preferred_term: COCH
          term:
            id: hgnc:2180
            label: COCH
        notes: 'COCH (14q12-q13) encodes cochlin: signal peptide, LCCL domain, two short intervening domains
          and two vWFA domains. Most dominant variants are LCCL-domain missense changes; p.Pro51Ser (c.151C>T)
          is a Dutch/Belgian founder allele. vWFA-domain variants include p.Phe527Cys (Korean family)
          and p.Ile541Phe (single case with external canal aggregates). Biallelic loss-of-function variants
          cause the separate recessive DFNB110. A terminal frameshift can encode an abnormal multimerizing
          product; variant class alone cannot distinguish dominant from recessive disease. No validated
          clinical modifier or universal domain-based prognostic rule is established.'
        variants:
        - name: COCH p.Pro51Ser
          gene:
            preferred_term: COCH
            term:
              id: hgnc:2180
              label: COCH
          description: Dutch/Belgian founder allele, currently described as c.151C>T; the original report
            used older nucleotide numbering. It is associated with age-dependent hearing and vestibular
            impairment. Sequence-specific antisense experiments use this allele.
        - name: COCH p.Gly88Glu
          gene:
            preferred_term: COCH
            term:
              id: hgnc:2180
              label: COCH
          description: LCCL variant associated with progressive hearing and vestibular impairment. Complete
            vestibular areflexia in midlife was less frequent than in the compared p.Pro51Ser group. G88E
            knock-in mice reproduce late functional deficits incompletely.
        - name: COCH p.Phe121Ser
          gene:
            preferred_term: COCH
            term:
              id: hgnc:2180
              label: COCH
          description: 'An LCCL variant retained intracellularly in overexpression assays. Onset varies
            between families: second or third decade in an American pedigree, with childhood and two prelingual
            cases in a French pedigree.'
        - name: COCH p.Phe230Leu
          gene:
            preferred_term: COCH
            term:
              id: hgnc:2180
              label: COCH
          description: A vWFA1 variant whose secretion and cleavage were comparable to wild type. Secreted
            conditioned medium reduced NIH3T3 viability; retention and dimerization were not observed
            in this study.
        - name: COCH p.Phe527Cys
          gene:
            preferred_term: COCH
            term:
              id: hgnc:2180
              label: COCH
          description: A vWFA2 variant destabilizing the domain and promoting covalent complexes. Large
            complexes were retained while monomeric protein was secreted. Collagen II binding persisted;
            another assay found reduced C-terminal cleavage.
        - name: COCH p.Asp544Valfs*3
          gene:
            preferred_term: COCH
            term:
              id: hgnc:2180
              label: COCH
          description: A terminal frameshift reported in a Chinese family with hearing loss and limited
            vestibular findings. The mutant protein formed multimers in HEK293T cells without significant
            loss of overall secretion or cell viability. Predicted effects on cleavage were not measured;
            a general loss-of-function mechanism is not established.
      selected_evidence:
        snippet: Here we report three missense mutations in human COCH (previously described as Coch5b2),
          a novel cochlear gene, in three unrelated kindreds with DFNA9.
        supports: SUPPORT
