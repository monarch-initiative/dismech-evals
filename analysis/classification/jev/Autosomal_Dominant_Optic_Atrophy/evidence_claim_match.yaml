  9f8620d076a0759a833d9c5f4df21cea4ff5b5dad3a8cf7076720efed3c71768:
    claim:
      about:
        disease:
          name: Autosomal Dominant Optic Atrophy
          disease_term:
            preferred_term: autosomal dominant optic atrophy, classic form
            term:
              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rgc_selectivity_of_a_ubiquitous_gene
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does halving the dose of OPA1 — a gene expressed ubiquitously, and expressed highly
          in brain and auditory neurons — produce a disease that is essentially confined to retinal ganglion
          cells, and within that population to the smallest-calibre papillomacular fibres?
        attaches_to:
        - pathophysiology#Energetic Vulnerability of the Unmyelinated Prelaminar Axon
        - pathophysiology#Selective Loss of Small-Calibre Papillomacular Bundle Fibres
        rationale: 'The leading explanation is curated here as mechanism rather than omitted: the unmyelinated
          prelaminar axon segment has a high per-unit-length conduction cost, mitochondria are distributed
          asymmetrically across the lamina cribrosa accordingly, and the earliest mitochondrial changes
          in pre-symptomatic Opa1+/- mice are found in exactly that segment. But the argument is not closed,
          and the gap is specific rather than a general plea for more research. First, the explanation
          is an energy-budget argument about a segment of axon, whereas the clinical selectivity is a
          claim about a fibre subpopulation — nothing yet connects smallest calibre to earliest failure
          quantitatively. Second, the same reasoning ought to predict disease in other high-demand unmyelinated
          neural compartments, and does not obviously do so. Third, the argument cannot be the whole story,
          because the identical anatomical substrate is shared with Leber hereditary optic neuropathy,
          which has a completely different natural history (subacute, sequentially bilateral, partial
          spontaneous recovery) from the same fibre population. Fourth, it does not explain the reduced
          penetrance: an anatomical vulnerability that every carrier shares cannot by itself account for
          43-62% penetrance within a single family carrying one allele. A review of the human iPSC-RGC
          work states the gap plainly.'
        notes: 'Not tagged HUMAN_MODEL_MISMATCH. The distinction matters: the mouse data do not conflict
          with the human disease, they simply do not reach the level of the claim. The open question is
          the mechanism itself, not the translational validity of a model that addresses it.'
      selected_evidence:
        snippet: the specific sensitivity of RGCs to OPA1 mutations, especially given the high levels
          of gene expression within other neuronal tissues, such as the brain and auditory neurons (10),
          remains unclear
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35652445
      reference_title: Modelling autosomal dominant optic atrophy associated with OPA1 variants in iPSC-derived
        retinal ganglion cells.
      evidence_source: OTHER
      explanation: States that the retinal ganglion cell selectivity of OPA1 disease is unexplained despite
        high expression elsewhere, which is the gap recorded here. Evidence source is OTHER because this
        is an expert statement of what the field does not know rather than data.
