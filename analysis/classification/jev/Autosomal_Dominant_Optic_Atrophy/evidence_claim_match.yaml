        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: Pre-symptomatic Opa1+/- mice show mitochondrial fragmentation and increased mitophagy
          concentrated in the unmyelinated portion of retinal ganglion cell axons, before any neuronal
          loss.
        limitations: The readout is mitochondrial ultrastructure and mitophagy in a segment of axon, observed
          at the cellular scale, while the node it is cited for is a tissue-scale claim about the differential
          vulnerability of a fibre population. The inference from "mitochondria change here first" to
          "this is why these fibres die" is not made by the experiment. The mouse optic nerve also differs
          from the human in the extent of the unmyelinated prelaminar segment and in lacking a true collagenous
          lamina cribrosa.
        readouts:
