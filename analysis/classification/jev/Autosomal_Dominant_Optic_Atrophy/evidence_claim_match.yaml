        snippet: These pre-symptomatic mitochondrial changes were mainly observed in the unmyelinated
          portion of the retinal ganglion cell axons, where the transmission of the visual information
          requires high energy expenditure, constituting the specific point of vulnerability in hereditary
          optic neuropathies.
        supports: SUPPORT
