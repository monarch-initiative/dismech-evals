  11cc9328ffd9d80f579d38dbb84733fd5cf50aff3a6445a50ec61473d959ead5:
    claim:
      about:
        disease:
          name: Autosomal Dominant Optic Atrophy
          disease_term:
            preferred_term: autosomal dominant optic atrophy, classic form
            term:
              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Patient-derived primary skin fibroblasts with heterozygous OPA1 mutations
        description: 'Four primary skin fibroblast lines carrying different heterozygous OPA1 mutations
          — nonsense and missense, in the GTPase and the C-terminal coiled-coil domains — analysed in
          parallel and quantitatively, which was the point of the study: earlier fibroblast reports had
          been mutually inconsistent. The panel shows defective fusion on pharmacological challenge, abnormal
          fragmentation under glycolysis shortage or oxidative stress, reduced complex IV activity, and
          distorted cristae, with a physical OPA1-oxidative-phosphorylation interaction on reciprocal
          immunoprecipitation. It is the human in vitro counterweight to the study of isolated patient
          mitochondria that found electron transport unaltered.'
        experimental_model_type: PRIMARY_CELL_CULTURE
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        publication: PMID:22800932
        modeled_mechanisms:
        - target: Cristae Disorganization
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Altered cristae structure is present in patient fibroblasts carrying heterozygous
            OPA1 mutations.
          limitations: 'Skin fibroblasts are not the affected cell type, and the paper says so itself:
            whether these alterations are present in retinal ganglion cells, and which of them drives
            degeneration, is left as an open goal. The fusion defect also required pharmacological challenge
            to become apparent, so the unstressed phenotype is mild.'
        - target: Impaired Mitochondrial Inner-Membrane Fusion
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Fusion was defective during pharmacological challenge with the protonophore CCCP,
            and fragmentation appeared under glycolysis shortage or exogenous oxidative stress.
          limitations: The fusion defect is conditional on a stressor rather than constitutive, and baseline
            mitochondria were significantly elongated rather than fragmented, so the phenotype is not
            a simple loss of fusion.
        notes: 'The paper''s closing sentence is the caveat that should travel with every use of it: "Identifying
          whether the observed alterations are also present in ganglion retinal cells, and which of them
          underlies their degeneration process remains however an essential goal for therapeutic strategy."'
      selected_evidence:
        snippet: Skin fibroblasts with heterozygous OPA1 mutations thus share significant mitochondrial
          remodeling, and may therefore be useful for analyzing disease pathophysiology.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/1
