              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: reduced_penetrance_modifiers
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines whether a heterozygous OPA1 null allele carrier develops optic atrophy
          at all, given family-level penetrance as low as 43%?
        attaches_to:
        - inheritance#Autosomal dominant
        - pathophysiology#OPA1 Haploinsufficiency
        rationale: 'Penetrance recalculated within two families carrying the recurrent c.2708_2711delTTAG
          allele was 43% and 62%, against a previously reported 98%. Because the allele is identical within
          each family, allele identity cannot explain the difference, and the original authors argued
          that if haploinsufficiency is the mechanism then reduced penetrance should not be allele-specific
          at all. The corollary is that something other than the OPA1 genotype sets the threshold — a
          modifier locus, mtDNA background, or an environmental or stochastic contribution to the bioenergetic
          margin — and this entry records no candidate because none was sourced. The practical consequence
          is already visible in ascertainment: OPA1 variants were found in 40% of apparently sporadic
          optic atrophy cases in a large referral series, so unaffected transmitting carriers are common.'
        notes: One lead was checked and downgraded rather than adopted. A deep-research report offered
          mitochondrial haplogroup J as a penetrance modifier in this disease, citing PMID:16617242. Reading
          the source, the three-fold over-representation of haplogroup J is reported in OPA1-NEGATIVE
          patients, so it is evidence about the genetic architecture of OPA1-negative dominant optic atrophy
          and not about whether an OPA1 carrier manifests. The same paper's broader conclusion — that
          mtDNA background may influence expression in a subset of cases — is what is cited above, and
          it is a suggestion in a 29-patient haplotype comparison, not a demonstrated modifier effect.
          No cybrid or segregation experiment establishing causality was located.
      selected_evidence:
        snippet: The mutation screening in this study also identified a number of asymptomatic individuals
          with OPA1 mutations.
        supports: SUPPORT
