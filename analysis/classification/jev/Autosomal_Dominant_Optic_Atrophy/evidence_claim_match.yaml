  902431e88a8a65eb4af0e8f2319e42cc3fb9a16cd765b96cff9e232492714a3e:
    claim:
      about:
        disease:
          name: Autosomal Dominant Optic Atrophy
          disease_term:
            preferred_term: autosomal dominant optic atrophy, classic form
            term:
              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: Genetic
      assertion:
        name: OPA1
        gene_term:
          preferred_term: OPA1
          term:
            id: hgnc:8140
            label: OPA1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal dominant
        notes: OPA1 is the only gene established for the classic non-syndromic form; more than 60% of
          genetically confirmed DOA carries an OPA1 variant, and OPA1 accounted for 67% of all molecular
          diagnoses in a 980-patient hereditary optic neuropathy screen. The allele spectrum is dominated
          by null variants, which is the basis of the haploinsufficiency mechanism and of the split from
          the DOA plus entry. Detection rate is strongly family-history dependent — 57.6% in probands
          with a positive family history versus 14.0% in singletons — yet OPA1 variants were still found
          in 40% of apparently sporadic optic atrophy in a large referral series, so a negative family
          history does not exclude the gene. Within OPA1-positive patients, missense alleles predict a
          worse visual outcome than other mutational subtypes.
        case_fractions:
        - population: Genetically confirmed DOA (review estimate)
          case_fraction_percent: 60.0
          notes: Stated as "more than 60%" and recorded as the lower bound; a review's summary figure,
            not a single-cohort measurement.
        - population: Molecular diagnoses among 980 patients screened for suspected hereditary optic neuropathy
          case_fraction_percent: 67.0
          cohort_size: 980
          notes: 295 of the 440 patients in whom any molecular defect was identified had an OPA1 mutation.
            The denominator is solved cases within a mixed LHON/ADOA referral cohort, not DOA cases, so
            this is not directly comparable with the review figure above.
      selected_evidence:
        snippet: We describe here a nuclear gene, OPA1, that maps within the candidate region and encodes
          a dynamin-related protein localized to mitochondria.
        supports: SUPPORT
