  3ef5f256b1fe78e23c691a50ba15538d4d1e93ef1004063f155cd9106117ef4e:
    claim:
      about:
        disease:
          name: Autosomal Dominant Optic Atrophy
          disease_term:
            preferred_term: autosomal dominant optic atrophy, classic form
            term:
              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: oma1_stress_processing_switch_untested_in_doa
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does stress-activated OMA1 cleavage of long OPA1 act as the amplifier that converts a
          tolerable 50% OPA1 dosage reduction into retinal ganglion cell loss, and does it explain why
          the same allele manifests in one carrier and not another?
        attaches_to:
        - pathophysiology#Impaired Mitochondrial Inner-Membrane Fusion
        - pathophysiology#OPA1 Haploinsufficiency
        rationale: 'Long OPA1 is constitutively cleaved by YME1L and OMA1 at two sites, and the balanced
          accumulation of long and short forms maintains fusion; under mitochondrial stress OMA1 converts
          OPA1 entirely to short isoforms, inhibiting fusion and triggering fragmentation. That is a switch,
          and a switch is the kind of thing that could turn a graded dosage deficit into a threshold event
          — which is what reduced penetrance and the decades-long latency of this disease both look like.
          It is recorded as a gap rather than as a pathophysiology node because nothing located here tests
          it in OPA1 haploinsufficient retinal ganglion cells, in patient tissue, or in an ADOA model:
          the supporting work is mouse embryonic fibroblast genetics on OPA1 processing generally, and
          it is unconnected to the disease. The experiment implied is OMA1 loss or inhibition in an Opa1+/-
          retina. Note the same source complicates the picture, since deleting Oma1 restored tubulation,
          cristae morphogenesis and apoptotic resistance in YME1L-null cells and long OPA1 alone sufficed
          for fusion — so processing is not required for fusion, and the switch is about quality control
          rather than about fusion capacity per se.'
        notes: Sourced from a deep-research report lead and checked against the primary paper before recording.
          No claim is made that this mechanism operates in autosomal dominant optic atrophy; the gap exists
          because it has not been asked.
      selected_evidence:
        snippet: deletion of Oma1 restored mitochondrial tubulation, cristae morphogenesis, and apoptotic
          resistance in cells lacking YME1L
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24616225
      reference_title: The i-AAA protease YME1L and OMA1 cleave OPA1 to balance mitochondrial fusion and
        fission.
      evidence_source: IN_VITRO
      explanation: The experimental result showing that removing OMA1 rescues cristae and apoptotic phenotypes,
        which is what makes OMA1 a candidate target — and also what shows the switch is not simply a fusion-capacity
        mechanism.
