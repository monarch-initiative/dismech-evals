    evidence_metadata:
      reference: PMID:18783614
      reference_title: Mitochondrial oxidative phosphorylation in autosomal dominant optic atrophy.
      evidence_source: IN_VITRO
      explanation: 'Direct contradiction of this node, and curated as such rather than smoothed over.
        Mitochondria isolated from six ADOA patients with OPA1 mutations showed no alteration of electron
        transport, and the authors conclude against an oxidative phosphorylation mechanism. Read alongside
        the supporting items: the measurements were made on isolated mitochondria from non-neuronal patient
        tissue with n=6, which is exactly the setting in which a deficit confined to an energetically
        marginal axon segment would be invisible. The honest reading is that a global respiratory block
        is not established, while a local one remains the working model.'
