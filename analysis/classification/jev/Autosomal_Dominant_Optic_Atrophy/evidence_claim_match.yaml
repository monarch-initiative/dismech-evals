            publication: PMID:23250881
            description: A mouse carrying the recurrent human OPA1 c.2708_2711delTTAG allele, which is
              found in roughly 30% of DOA patients. It reproduces the selective retinal ganglion cell
              vulnerability and, in a pre-symptomatic analysis, localizes the earliest mitochondrial abnormality
              to the unmyelinated prelaminar axon segment. Its limitation for this entry is that it is
