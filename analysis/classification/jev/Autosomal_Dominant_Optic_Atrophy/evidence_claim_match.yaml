      reference_title: 'Longitudinal Visual Biomarkers in Dominant Optic Atrophy: A Systematic Review
        and Meta-Analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Pooling the longitudinal literature, visual acuity decline in DOA is not statistically
        distinguishable from no decline. This cuts against progression as a measurable property of visual
        acuity rather than against progression of the disease, and the distinction matters for trial design
        — the same review reports visual acuity as the only biomarker with any longitudinal data at all.
        It is recorded as REFUTE because it contradicts the claim this phenotype makes as stated, not
        because the disease is thought to be static.
