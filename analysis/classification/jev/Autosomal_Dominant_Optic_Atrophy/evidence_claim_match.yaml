          with the human disease, they simply do not reach the level of the claim. The open question is
          the mechanism itself, not the translational validity of a model that addresses it.'
      selected_evidence:
        snippet: While OPA1 is critical for optic nerve function, the mechanism by which OPA1 mutations
          lead to blindness is unknown
        supports: SUPPORT
