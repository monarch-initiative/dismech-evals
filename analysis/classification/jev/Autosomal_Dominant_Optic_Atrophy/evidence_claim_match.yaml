        penetrance: INCOMPLETE
        penetrance_percentage: '43'
        expressivity: VARIABLE
        description: Heterozygous OPA1 variants are transmitted in an autosomal dominant manner with incomplete
          penetrance. Penetrance recalculated within families segregating the recurrent c.2708_2711delTTAG
          allele was as low as 43% and 62%, far below the ~98% previously reported, and the authors argue
          that if haploinsufficiency is the mechanism then reduced penetrance should not be allele-specific.
          The penetrance_percentage slot records the lower of the two family-level figures; it is a single-study
          family estimate, not a population penetrance.
      selected_evidence:
        snippet: If haploinsufficiency is the mechanism underlying DOA it is unlikely that this figure
          will be mutation-specific, indicating that the penetrance in DOA is much lower than the 98%
          reported previously.
        supports: SUPPORT
