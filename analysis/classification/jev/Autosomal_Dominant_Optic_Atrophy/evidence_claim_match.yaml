              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: Diagnosis
      assertion:
        name: OPA1 Molecular Genetic Testing
        description: 'The diagnosis rests on a combination of clinical findings, electrophysiologic studies
          and family history, and/or on identifying a heterozygous pathogenic OPA1 variant by molecular
          genetic testing. Two practical points follow from the cohort data curated in the genetic block:
          the detection rate depends strongly on family history (57.6% in probands with an affected relative
          versus 14.0% in singletons), and sequencing alone misses large-scale rearrangements, so an OPA1-negative
          result after coding sequencing is not a negative OPA1 result.'
        diagnosis_term:
          preferred_term: OPA1 molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: Heterozygous pathogenic OPA1 variant
        notes: Bound to the general NCIT Genetic Testing action. NCIT:C153598 DNA Sequencing would name
          the technique but not the clinical act, and there is no NCIT clinical-action term for OPA1 testing
          specifically, so the specificity is carried in preferred_term per the Ontology Term Contract.
      selected_evidence:
        snippet: "The diagnosis of OPA1 is made based on a combination of clinical \nfindings, electrophysiologic\
          \ studies, and family history and/or by the \nidentification of a heterozygous pathogenic variant\
          \ in OPA1, the only gene known \nto be associated with OPA1, by molecular genetic testing."
        supports: SUPPORT
