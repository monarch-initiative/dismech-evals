  c14c5c3cea60bbab1666e20b63dcddb24e2f0d7b3d31fa77ee783dafe5781bad:
    claim:
      about:
        disease:
          name: Autosomal Dominant Optic Atrophy
          disease_term:
            preferred_term: autosomal dominant optic atrophy, classic form
            term:
              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: developmental_versus_degenerative_rgc_loss
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How much of the retinal ganglion cell deficit in classic autosomal dominant optic atrophy
          is a developmental failure that has already happened by the time vision is first measured, and
          how much is ongoing degeneration that a therapy started in adulthood could still prevent?
        attaches_to:
        - pathophysiology#Retinal Ganglion Cell Degeneration and Optic Nerve Atrophy
        - pathophysiology#Selective Loss of Small-Calibre Papillomacular Bundle Fibres
        - clinical_trials#NCT06970106
        rationale: 'The entry models the disease as degeneration, because that is how the phenotype reads
          — insidious loss from the first decade, slow progression over decades. But OPA1 is required
          for mitochondrial fusion and cristae organization during development too, and a recent review
          states that the disease also involves a developmental component and draws the therapeutic consequence
          explicitly. The two accounts predict the same cross-sectional picture and different things about
          treatment: if a substantial share of the deficit is developmental, a therapy that restores OPA1
          dosage in an adult retina cannot recover it, and the trials now recruiting — NCT06970106 doses
          adults intravitreally — would be testing prevention of future loss in patients who have already
          sustained most of theirs. Nothing located here partitions the deficit between the two. The experiment
          implied is conditional or inducible Opa1 knockdown at defined postnatal ages, which would separate
          a developmental from an adult-onset contribution; in humans the nearest approach is longitudinal
          structural imaging from the earliest age at which it can be obtained, and the same review notes
          early diagnosis is itself difficult.'
        notes: Tagged KNOWLEDGE_GAP rather than HUMAN_MODEL_MISMATCH. The reviewer offered either. HUMAN_MODEL_MISMATCH
          would fit if a model system showed something whose translation to human biology were the open
          question, but here the open question is the timing of the deficit in the human disease itself,
          and no model result is in conflict with a human observation — the relevant human observation
          has not been made. The distinction CLAUDE.md draws is that KNOWLEDGE_GAP means the evidence
          is absent, which is the case.
      selected_evidence:
        snippet: ADOA also involves a developmental component consistent with OPA1's essential role in
          mitochondrial fusion, cristae organization, and quality control.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
