      assertion_type: Pathophysiology
      assertion:
        name: Selective Loss of Small-Calibre Papillomacular Bundle Fibres
        biological_scale: TISSUE
        description: 'Degeneration is not uniform across the retinal ganglion cell population. The smallest-calibre
