      assertion_type: DifferentialDiagnosis
      assertion:
        name: ACO2-related dominant optic atrophy
        description: Heterozygous variants in ACO2, encoding mitochondrial aconitase, are reported as
          one of the most frequent causes of dominant optic atrophy, so this is a first-tier alternative
          rather than a rarity once OPA1 is excluded. It keeps the disease inside mitochondrial metabolism
          but moves the lesion from inner-membrane dynamics to the tricarboxylic acid cycle, which is
          a different mechanism reaching the same retinal ganglion cell population. The relative frequency
          of ACO2 and OPA1 is not settled here — the source is a 2026 retrospective series assembled from
          13 referral centres, and referral series overstate what their centres test for.
      selected_evidence:
        snippet: Aconitase 2 (ACO2) gene variants are one of the most frequent causes of dominant optic
          atrophy (DOA).
