  b9cb7b4e1f9d1c2c180375230a6261673b9e2cc4d609a6f212391923121e55f9:
    claim:
      about:
        disease:
          name: Autosomal Dominant Optic Atrophy
          disease_term:
            preferred_term: autosomal dominant optic atrophy, classic form
            term:
              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Opa1 delTTAG knock-in mouse
        species: Mouse
        genotype: Opa1 c.2708_2711delTTAG heterozygous (Opa1+/delTTAG)
        background: C57BL/6
        publication: PMID:23250881
        description: A mouse carrying the recurrent human OPA1 c.2708_2711delTTAG allele, which is found
          in roughly 30% of DOA patients. It reproduces the selective retinal ganglion cell vulnerability
          and, in a pre-symptomatic analysis, localizes the earliest mitochondrial abnormality to the
          unmyelinated prelaminar axon segment. Its limitation for this entry is that it is multi-systemic
          — the published phenotype includes deafness, encephalomyopathy, peripheral neuropathy, ataxia
          and cardiomyopathy — so it models the DOA plus spectrum at least as well as the non-syndromic
          form it was derived from.
        modeled_mechanisms:
        - target: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Pre-symptomatic Opa1+/- mice show mitochondrial fragmentation and increased mitophagy
            concentrated in the unmyelinated portion of retinal ganglion cell axons, before any neuronal
            loss.
          limitations: The readout is mitochondrial ultrastructure and mitophagy in a segment of axon,
            observed at the cellular scale, while the node it is cited for is a tissue-scale claim about
            the differential vulnerability of a fibre population. The inference from "mitochondria change
            here first" to "this is why these fibres die" is not made by the experiment. The mouse optic
            nerve also differs from the human in the extent of the unmyelinated prelaminar segment and
            in lacking a true collagenous lamina cribrosa.
          readouts:
          - name: Mitochondrial density, area and circularity by electron microscopy across retina, prelaminar,
              laminar and retrolaminar zones
            target: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
            direction: ALTERED
            interpretation: Regional mitochondrial fragmentation identifies the unmyelinated prelaminar
              segment as the site of earliest change.
        - target: OPA1 Haploinsufficiency
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: The knock-in allele reduces Opa1 transcript by more than 40% in cochlea, confirming
            that the recurrent human delTTAG allele acts by dosage reduction rather than by a dominant-negative
            product.
          limitations: The transcript measurement was made in cochlea rather than in retina or optic nerve,
            so the dosage reduction is inferred to hold in the tissue this entry is about rather than
            measured there.
        notes: The same paper reports a multi-systemic poly-degenerative phenotype including deafness,
          encephalomyopathy, peripheral neuropathy, ataxia and cardiomyopathy. Those features belong to
          the DOA plus entry, not here; they are the reason fidelity for the non-syndromic disease is
          recorded as MODERATE rather than HIGH and the reason no FAILS_TO_RECAPITULATE link is asserted
          in either direction without a study designed to test it.
      selected_evidence:
        snippet: We generated an Opa1 mouse model carrying the recurrent Opa1(delTTAG) mutation, which
          is found in 30% of all patients with dominant optic atrophy.
        supports: SUPPORT
