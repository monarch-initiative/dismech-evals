  ffd0dfa3654c82150ad137f42ed25274c8266b41b7ed1d0db24a205f6266b45c:
    claim:
      about:
        disease:
          name: Autosomal Dominant Optic Atrophy
          disease_term:
            preferred_term: autosomal dominant optic atrophy, classic form
            term:
              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: Phenotype
      assertion:
        category: Phenotypic abnormality
        name: Progressive visual loss
        description: Slow progression over decades rather than a subacute event. In a population-based
          cohort, visual function worsened in 67.4% of patients during follow-up, at a mean rate of 0.032
          logMAR per year, though some declined up to five times faster.
        phenotype_term:
          preferred_term: Progressive visual loss
          term:
            id: HP:0000529
            label: Progressive visual loss
          clinical_course: PROGRESSIVE
        notes: The two evidence items here disagree and are both kept. A single population-based cohort
          found visual function worsening in 67.4% of patients at 0.032 logMAR/year (PMID:20417570); a
          later meta-analysis pooling seven studies found 0.022 logMAR/year with a confidence interval
          crossing zero (PMID:40329928). The point estimates are close, so the disagreement is about statistical
          power and the insensitivity of Snellen acuity over short follow-up, not about the direction
          of change. Structural measures (peripapillary retinal nerve fibre layer, macular ganglion cell-inner
          plexiform layer) are the candidates for a sensitive endpoint, but the meta-analysis found no
          longitudinal data for them to pool.
      selected_evidence:
        snippet: visual function worsened in 67.4% of patients during follow-up
        supports: SUPPORT
