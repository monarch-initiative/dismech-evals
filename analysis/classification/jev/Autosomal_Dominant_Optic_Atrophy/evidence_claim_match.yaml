      assertion_type: Treatment
      assertion:
        name: Idebenone
        description: Off-label idebenone, a short-chain quinone used as an alternative electron carrier,
          has been given to OPA1-DOA patients on the rationale shared with Leber hereditary optic neuropathy.
          In a cohort study comparing treated with untreated patients, treatment was associated with stabilization
          or recovery of visual acuity, and the association survived adjustment for confounders. This
          is observational, not a randomized result, and it is the strongest pharmacological evidence
          located for this disease.
