        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Energetic Vulnerability of the Unmyelinated Prelaminar Axon
        biological_scale: TISSUE
        description: This node carries the selectivity argument, and it is a claim about the target tissue
          rather than about the lesion. Retinal ganglion cell axons are unmyelinated from the cell body
          until they cross the lamina cribrosa, so conduction there is non-saltatory and costly; after
          the lamina they are myelinated and propagate saltatorily at much lower cost. Mitochondria are
          distributed accordingly, densely in the prelaminar nerve and sparsely behind it. In pre-symptomatic
          Opa1+/- mice, mitochondrial fragmentation and increased mitophagy are found mainly in that unmyelinated
          segment, before any neuronal loss — identifying it as the specific point of vulnerability. The
          asymmetric myelination pattern and an associated impairment of mitochondrial axonal transport
          were proposed as the common explanation for this pattern across the mitochondrial optic neuropathies
          well before the mouse data.
        locations:
        - preferred_term: optic nerve
          term:
            id: UBERON:0000941
            label: cranial nerve II
        cell_types:
        - preferred_term: Retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        biological_processes:
        - preferred_term: Axonal transport of mitochondrion
          term:
            id: GO:0019896
            label: axonal transport of mitochondrion
          modifier: ABNORMAL
      selected_evidence:
        snippet: since RGC axons are not myelinated in the eye, high energy expenditure is required to
          ensure optimal non-saltatory transduction of action potentials
        supports: SUPPORT
    origin:
