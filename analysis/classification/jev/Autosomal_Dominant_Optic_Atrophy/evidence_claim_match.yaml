  c11e44ad43606343c0c5e99a631850449e0702a42702e470ca9d678513af03bc:
    claim:
      about:
        disease:
          name: Autosomal Dominant Optic Atrophy
          disease_term:
            preferred_term: autosomal dominant optic atrophy, classic form
            term:
              id: MONDO:0008134
              label: autosomal dominant optic atrophy, classic form
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: OPA1 Haploinsufficiency
        biological_scale: MOLECULAR
        role: trigger
        description: 'A heterozygous OPA1 null allele — premature termination codon, frameshift, splice-site
          defect, or large-scale rearrangement — halves the dose of functional OPA1 protein. This, rather
          than a poisoned oligomer, is the predominant mechanism of the classic non-syndromic form: the
          mutation spectrum is weighted towards truncating alleles, and a mouse carrying the recurrent
          human c.2708_2711delTTAG allele shows a greater than 40% reduction in Opa1 mRNA, which the authors
          read as supporting haploinsufficiency. Missense alleles in the GTPase domain, which act dominant-negatively,
          are instead enriched in the syndromic DOA plus form curated separately.'
        gene:
          preferred_term: OPA1
          term:
            id: hgnc:8140
            label: OPA1
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous germline loss-of-function OPA1 alleles. Null alleles (nonsense, frameshift,
            splice, whole-gene deletion) predominate in the classic form.
      selected_evidence:
        snippet: These are predominantly null mutations generating truncated proteins, strongly suggesting
          that the mechanism underlying DOA is haploinsufficiency.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11440989
      reference_title: Spectrum, frequency and penetrance of OPA1 mutations in dominant optic atrophy.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes haploinsufficiency from null alleles as the mechanism of the classic form,
        the basis of this node.
