      assertion:
        name: Impaired Mitochondrial DNA Maintenance
        biological_scale: MOLECULAR
        description: OPA1 is a direct actor in maintenance of the mitochondrial genome, not only a shaper
          of membranes. Silencing the OPA1 variants that include the alternately spliced exon 4b depletes
          mtDNA by inhibiting replication and disorganizes the distribution of nucleoids through the network;
          a small hydrophobic peptide cleaved from the exon 4b isoform is embedded in the inner membrane
          and co-immunoprecipitates with nucleoid components. The consequence in classic DOA is reduced
          mtDNA copy number and mislocalized nucleoids — which is a different claim from the secondary
          multiple mtDNA deletions and COX-negative muscle fibres that characterize DOA plus, where a
          dominant-negative allele destabilizes the genome more severely.
        biological_processes:
        - preferred_term: Mitochondrial DNA replication
          term:
            id: GO:0006264
            label: mitochondrial DNA replication
          modifier: DECREASED
        - preferred_term: Mitochondrial DNA maintenance
          term:
            id: GO:0032042
            label: mitochondrial DNA metabolic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: silencing of the OPA1 variants including exon 4b leads to mtDNA depletion, secondary
          to inhibition of mtDNA replication, and to marked alteration of mtDNA distribution in nucleoid
          and nucleoid distribution throughout the mitochondrial network
        supports: SUPPORT
