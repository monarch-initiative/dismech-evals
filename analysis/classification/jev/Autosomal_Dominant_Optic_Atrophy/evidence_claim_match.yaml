        context:
        - path: /experimental_models/1
          value:
            name: Patient-derived primary skin fibroblasts with heterozygous OPA1 mutations
            description: 'Four primary skin fibroblast lines carrying different heterozygous OPA1 mutations
              — nonsense and missense, in the GTPase and the C-terminal coiled-coil domains — analysed
              in parallel and quantitatively, which was the point of the study: earlier fibroblast reports
              had been mutually inconsistent. The panel shows defective fusion on pharmacological challenge,
              abnormal fragmentation under glycolysis shortage or oxidative stress, reduced complex IV
              activity, and distorted cristae, with a physical OPA1-oxidative-phosphorylation interaction
              on reciprocal immunoprecipitation. It is the human in vitro counterweight to the study of
              isolated patient mitochondria that found electron transport unaltered.'
            experimental_model_type: PRIMARY_CELL_CULTURE
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            publication: PMID:22800932
            notes: 'The paper''s closing sentence is the caveat that should travel with every use of it:
              "Identifying whether the observed alterations are also present in ganglion retinal cells,
              and which of them underlies their degeneration process remains however an essential goal
              for therapeutic strategy."'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Mitochondrial Inner-Membrane Fusion
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: Fusion was defective during pharmacological challenge with the protonophore CCCP,
          and fragmentation appeared under glycolysis shortage or exogenous oxidative stress.
        limitations: The fusion defect is conditional on a stressor rather than constitutive, and baseline
          mitochondria were significantly elongated rather than fragmented, so the phenotype is not a
          simple loss of fusion.
      selected_evidence:
        snippet: defective mitochondrial fusion during pharmacological challenge with the protonophore
          carbonyl cyanide m-chlorophenyl hydrazone, significant mitochondrial elongation with decreased
          OPA1 and DRP1 proteins, and abnormal mitochondrial fragmentation during glycolysis shortage
          or exogenous oxidative stress
        supports: SUPPORT
