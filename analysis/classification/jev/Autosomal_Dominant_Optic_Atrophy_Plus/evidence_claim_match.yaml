        description: 'Certain OPA1 (and MFN2) missense mutations exert a dominant-negative effect that
          destabilizes the mitochondrial genome, revealing an unrecognized role of OPA1 in mtDNA stability.
          Affected patients accumulate multiple deletions of mtDNA in skeletal muscle, closely related
          to classical mitochondrial cytopathies. Impaired mitochondrial fusion limits the ability to
          repair stress-induced mtDNA damage.

          '
        genes:
