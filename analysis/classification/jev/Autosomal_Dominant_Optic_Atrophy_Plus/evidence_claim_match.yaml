      assertion:
        name: OPA1 Loss of Function and Impaired Mitochondrial Fusion
        description: 'OPA1 encodes a dynamin-related GTPase imported into mitochondria and located to
          the inner membrane and intermembrane space, where its isoforms form homopolymers that structure
          cristae and mediate inner-membrane fusion. Dominant OPA1 mutations — in DOA plus most often
          dominant-negative missense alleles affecting the conserved GTPase domain rather than haploinsufficiency
          truncating alleles — impair this fusion GTPase, disrupting mitochondrial fusion and cristae
          organization.

          '
