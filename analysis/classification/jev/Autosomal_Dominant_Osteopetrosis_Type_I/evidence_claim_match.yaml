              label: autosomal dominant osteopetrosis 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Bone turnover and circulating Wnt-inhibitor measurements
        description: Normal turnover markers do not exclude high bone mass. In 16 G171V/N198S carriers,
          13 unaffected relatives and 24 unrelated controls, mean affected Z-score was 6.4 but CTX and
          P1NP did not differ significantly across groups. Sclerostin and DKK1 did not distinguish carriers
          from relatives. SFRP-4 was higher in both affected and unaffected relatives than unrelated controls,
          so it did not discriminate mutation status within those kindreds. These measurements are not
          validated confirmatory tests. A prior T253I study had different biomarker findings, limiting
          generalization across alleles.
      selected_evidence:
        snippet: There were no differences in CTX or P1NP values among the three groups.
        supports: SUPPORT
