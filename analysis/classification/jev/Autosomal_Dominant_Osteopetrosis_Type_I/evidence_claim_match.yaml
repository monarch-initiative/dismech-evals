        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ado1_osteoclast_link_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Which signals explain reduced resorptive responses in T253I disease, and how far does
          this mechanism generalize to other LRP5 HBM alleles?
        attaches_to:
        - pathophysiology#Reduced Osteoclast Number and Resorptive Response
        rationale: Normal tested osteoclast endpoints under supplied RANKL/M-CSF favor environmental dependence
          but do not prove that the entire intrinsic program is unaffected. The T253I authors proposed
          altered osteoblastic support without demonstrating a mediator. A later study actually measured
          circulating RANKL/OPG in 16 affected G171V/N198S carriers, 13 unaffected relatives and unrelated
          controls; the ratio difference was nonsignificant (p=0.09). This neither proves nor excludes
          altered local signaling at remodeling surfaces, and does not directly resolve T253I biology.
          Allele-specific co-culture or in vivo perturbation studies are needed.
      selected_evidence:
        snippet: It is also of interest that the RANKL/OPG ratio was higher in the affected individuals
          than in the other two groups, although this too was not significant.
        supports: SUPPORT
