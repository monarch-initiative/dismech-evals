      assertion_type: Pathophysiology
      assertion:
        name: Enhanced Canonical Wnt Signaling in Bone-Forming Cells
        biological_scale: CELLULAR
        description: LRP5 HBM variants can enhance canonical Wnt signaling by reducing inhibition by sclerostin
          and, variably, DKK1. This does not imply complete loss of feedback or constitutive ligand-independent
          signaling. Homozygous G171V and A214V mice resisted many skeletal effects of SOST overexpression,
          but some architectural responses remained; A214V was more responsive to DKK1 than G171V. In
          conditional mice, neither allele rescued severe osteopenia caused by Wls deletion in late osteoblasts/osteocytes,
          limiting a proposed autonomous intracellular-signaling explanation.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: canonical Wnt signaling pathway
          modifier: INCREASED
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
      selected_evidence:
        snippet: Other less common recessive or dominant sclerosing disorders, such as endosteal hyperostosis,
          sclerostosis, van Buchen disease and high bone mass syndrome, are due to mutations in two genes
          (LRP5 and SOST) of the Wnt pathway that induce increased osteoblast activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
