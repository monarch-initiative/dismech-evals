      assertion:
        name: Increased Osteoblastic Bone Formation
        biological_scale: TISSUE
        description: Increased bone-forming activity contributes to high bone mass, with genotype-, surface-
          and age-dependent effects. Prior T253I histomorphometry reported increased mineralizing surface,
          while the later T3 study found normal baseline formation markers and a normal stimulated formation
          response. Dynamic labeling in HBM knock-in mice demonstrates increased formation on selected
          surfaces. A normal T3 response alone is not evidence of elevated formation, and mature patient
          bone does not necessarily continue accumulating rapidly throughout adulthood.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: bone mineralization
          modifier: INCREASED
          term:
            id: GO:0030282
            label: bone mineralization
      selected_evidence:
        snippet: On the endocortical surface, mineralizing surface and bone formation rates were increased
          in all 3 HBM genotypes compared to controls, at both time points, with the exception of BFR/BS
          in heterozygous G171V/A214V mice at the later time point.
        supports: SUPPORT
