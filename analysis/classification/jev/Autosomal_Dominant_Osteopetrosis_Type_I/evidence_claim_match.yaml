        kind: KNOWLEDGE_GAP
        prompt: How does G171V enhance bone accrual despite reduced surface localization in some experimental
          systems?
        attaches_to:
        - pathophysiology#Enhanced Canonical Wnt Signaling in Bone-Forming Cells
        rationale: Earlier cellular work proposed preserved autocrine signaling with reduced extracellular
          inhibitor access. The 2026 Wls-deletion experiments did not support preferential rescue by intracellularly
          retained G171V, but altered resorption and intracellular ligand positioning limit exclusion
          of every trafficking mechanism. Relative contributions of antagonist resistance, receptor localization
          and ligand availability remain unresolved.
