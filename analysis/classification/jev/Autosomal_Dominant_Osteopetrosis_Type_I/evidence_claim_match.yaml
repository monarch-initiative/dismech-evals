        limitations: Wls deletion can change resorption and intracellular ligand positioning; these confound
          a simple inference about receptor localization. This is an engineered compound genotype, not
          isolated human LRP5 disease.
      selected_evidence:
        snippet: Wls-deleted mice exhibited a severe low bone mass phenotype whether G171V or A214V was
          present or not.
        supports: SUPPORT
