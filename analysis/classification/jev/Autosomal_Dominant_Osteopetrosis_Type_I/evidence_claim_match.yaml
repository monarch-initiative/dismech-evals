      reference_title: Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene
        in different conditions with an increased bone density.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the LRP5 missense alleles found in patients ascertained with increased bone
