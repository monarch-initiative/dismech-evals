      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: Heterozygous LRP5 activating variants segregate as an autosomal dominant trait. Clinical
          severity varies within families; absence of symptoms is not equivalent to absence of skeletal
          changes. Historical untyped osteopetrosis cohorts do not provide LRP5-specific penetrance estimates.
          Recessive loss-of-function LRP5 variants cause the distinct osteoporosis-pseudoglioma syndrome.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Linkage analysis in two families with ADOI from Danish origin enabled us to assign the
          disease-causing gene to chromosome 11q12-13.
        supports: SUPPORT
