              label: autosomal dominant osteopetrosis 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CLCN7 Dominant Negative Chloride Channel Dysfunction
        description: 'CLCN7 encodes a chloride channel that functions as a homodimer. Heterozygous missense
          mutations exert a dominant negative effect by incorporating mutant subunits into the dimer,
          impairing chloride transport. Loss-of-function (null) mutations in heterozygous state do not
          cause disease, confirming that the pathogenic mechanism is dominant negative rather than haploinsufficiency.

          '
        cell_types:
        - preferred_term: Osteoclast
          term:
            id: CL:0000092
            label: osteoclast
      selected_evidence:
        snippet: ADO II reflects a dominant negative effect, whereas loss-of-function mutations in ClCN7
          do not cause abnormalities in heterozygous individuals
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
