      - /disease_term
    evidence_metadata:
      reference: PMID:11741829
      reference_title: Albers-Schönberg disease (autosomal dominant osteopetrosis, type II) results from
        mutations in the ClCN7 chloride channel gene.
      explanation: Establishes the dominant negative mechanism for CLCN7 missense mutations in ADO2.
