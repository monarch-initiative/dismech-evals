        prompt: How should clinically defined Worth cases be compared with molecularly established LRP5
          high bone mass?
        attaches_to:
        - disease#Autosomal Dominant Osteosclerosis Worth Type
        - genetic#LRP5
        rationale: Historical names overlap substantially, but some dental case reports remained presumptive
          diagnoses without genetic or family confirmation. The 155-case review includes only 64 genetically
          tested patients and variable feature denominators. Molecular stratification is needed to estimate
          carrier risks without assuming that every historical mandibular case has the same cause.
        status: OPEN
      selected_evidence:
        snippet: These results indicate that, despite the different diagnoses that can be made, conditions
          with an increased bone density affecting mainly the cortices of the long bones and the skull
          are often caused by mutations in the LRP5 gene.
        supports: SUPPORT
