        modeled_mechanisms:
        - target: Enhanced Canonical Wnt Signaling in Bone
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Perturbation tests the dependence of HBM behavior on the ligand-secretion environment.
          limitations: Wls deletion can change resorption and intracellular ligand positioning; these
            confound a simple inference about receptor localization. This is an engineered compound genotype,
            not isolated human LRP5 disease.
      selected_evidence:
        snippet: Wls-deleted mice exhibited a severe low bone mass phenotype whether G171V or A214V was
          present or not.
        supports: SUPPORT
