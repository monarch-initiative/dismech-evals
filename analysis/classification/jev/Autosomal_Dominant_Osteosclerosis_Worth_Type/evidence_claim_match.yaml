      assertion_type: Pathophysiology
      assertion:
        name: Reduced Osteoclast Number and Resorptive Response
        biological_scale: CELLULAR
        description: In studied T253I patients, historical histology showed fewer small osteoclasts and
          an in vivo T3 challenge produced an attenuated resorption response despite a normal formation
          response. Patient CD14-derived osteoclasts supplied with RANKL and M-CSF were normal for the
          tested culture endpoints. These results favor a context-dependent defect but do not exclude
          every cell-intrinsic contribution. The clinical response and osteoclast-number phenotype should
          not be generalized to every LRP5 HBM allele.
        cell_types:
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        biological_processes:
        - preferred_term: bone resorption
          modifier: DECREASED
          term:
            id: GO:0045453
            label: bone resorption
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: We found normal osteoclastogenesis, expression of osteoclast markers, morphology, and
          localization of proteins involved in bone resorption, such as ClC-7 and cathepsin K.
        supports: SUPPORT
    origin:
