      assertion_type: Genetic
      assertion:
        name: LRP5
        gene_term:
          preferred_term: LRP5
          term:
            id: hgnc:6697
            label: LRP5
        presence: PRESENT
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: LRP5 encodes a Wnt co-receptor. Established high-bone-mass alleles include D111Y, G171R,
          G171V, A214T, A214V, A242T and T253I, concentrated in the first extracellular beta-propeller.
          The variant spectrum also includes a two-amino-acid insertion. A 2023 report associated cytoplasmic
          R1414S with radiographic cortical thickening in a father and son whose DXA measurements were
          normal; that study used segregation and computational predictions without a functional assay.
          R1414S should not be assumed to share the experimentally demonstrated inhibitor-resistance mechanism
          of canonical extracellular alleles. Effects on sclerostin, DKK1 and trafficking differ by allele.
          Recessive loss-of-function disease has the opposite skeletal phenotype. The M282V case report
          describes a de novo variant returned as a VUS; parental testing details and a functional assay
          are not provided. Its occurrence supports a reported association without independently establishing
          pathogenicity.
        variants:
        - name: p.Met282Val
          description: Reported de novo M282V in an 18-year-old with marked high bone mass. The diagnostic
            panel classified it as uncertain significance; neither the reported de novo status nor domain
            position substitutes for a functional demonstration in this paper.
          gene:
            preferred_term: LRP5
            term:
              id: hgnc:6697
              label: LRP5
        - name: p.Gly171Val
          description: The founding kindred's variant, in the conserved propeller motif.
      selected_evidence:
        snippet: Thirteen of these were confirmed as polymorphisms, but six novel missense mutations (D111Y,
          G171R, A214T, A214V, A242T, and T253I) are most likely disease causing.
        supports: SUPPORT
