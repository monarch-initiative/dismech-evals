              label: autosomal dominant osteosclerosis, Worth type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: LRP5 Activating Variation
        biological_scale: MOLECULAR
        description: Heterozygous LRP5 activating variants cause inherited high bone mass. Many established
          missense variants cluster in the first extracellular beta-propeller; in-frame insertion alleles
          also occur. Tested HBM receptor variants have reduced binding or sensitivity to extracellular
          antagonists. This region participates in a receptor whose ligand binding, trafficking and inhibition
          are interdependent; it is not simply an isolated non-Wnt-binding brake. The reported cytoplasmic
          R1414S association has not been functionally shown to use the same mechanism.
        genes:
        - preferred_term: LRP5
          term:
            id: hgnc:6697
            label: LRP5
        genetic_context:
          gene:
            preferred_term: LRP5
            term:
              id: hgnc:6697
              label: LRP5
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: Heterozygous germline variants with activating effects include experimentally characterized
            extracellular substitutions and an associated in-frame insertion. Functional interpretation
            remains uncertain for some reported alleles.
      selected_evidence:
        snippet: Like the previously reported mutation (G171V) that causes the high-bone-mass phenotype,
          all mutations are located in the aminoterminal part of the gene, before the first epidermal
          growth factor-like domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12579474
      reference_title: Six novel missense mutations in the LDL receptor-related protein 5 (LRP5) gene
