              label: autosomal dominant osteosclerosis, Worth type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Increased Osteoblastic Bone Formation
        biological_scale: TISSUE
        description: Increased bone-forming activity contributes to high bone mass, with genotype-, surface-
          and age-dependent effects. Prior T253I histomorphometry reported increased mineralizing surface,
          while the later T3 study found normal baseline formation markers and a normal stimulated formation
          response. Dynamic labeling in HBM knock-in mice demonstrates increased formation on selected
          surfaces. A normal T3 response alone is not evidence of elevated formation, and mature patient
          bone does not necessarily continue accumulating rapidly throughout adulthood. Increased mineralizing
          surface and formation rate describe the amount and activity of bone-forming surfaces; they do
          not imply abnormally high mineral concentration within each unit of bone matrix.
        biological_processes:
        - preferred_term: ossification
          modifier: INCREASED
          term:
            id: GO:0001503
            label: ossification
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
      selected_evidence:
        snippet: On the endocortical surface, mineralizing surface and bone formation rates were increased
          in all 3 HBM genotypes compared to controls, at both time points, with the exception of BFR/BS
          in heterozygous G171V/A214V mice at the later time point.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42113468
      reference_title: Different Lrp5-HBM mutations induce magnitude- and surface-selective effects that
        are not explained by receptor trafficking.
      evidence_source: MODEL_ORGANISM
      explanation: Global homozygous or compound-mutant mice; dynamic histomorphometry is surface- and
        time-dependent and differs from the heterozygous human genotype.
