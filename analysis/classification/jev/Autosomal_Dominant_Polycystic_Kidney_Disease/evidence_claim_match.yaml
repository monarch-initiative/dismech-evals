      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_pkd1_pkd2_cilia_signaling_cystogenesis_model
        hypothesis_label: Canonical PKD1/PKD2 / Primary Cilium / Cystogenesis Model
        status: CANONICAL
        description: Autosomal dominant polycystic kidney disease (ADPKD) is caused by heterozygous loss-of-function
          variants in PKD1 (~78%) or PKD2 (~15%) encoding polycystin-1 and polycystin-2, transmembrane
          proteins that localize to the primary cilium of renal tubular epithelial cells and form a mechanosensitive
          calcium channel complex. Loss of polycystin function disrupts ciliary calcium signaling, elevates
          cAMP, activates B-Raf/MEK/ERK proliferative signaling, and triggers progressive cyst formation,
          expansion, and tubular dilation throughout the kidney (and liver/pancreas). The 'two-hit' model
          — germline heterozygosity followed by somatic second-hit events in individual tubular epithelial
          cells — explains the focal nature of cyst initiation. Tolvaptan (V2-vasopressin receptor antagonist,
          lowering renal cAMP) is the first disease-modifying therapy and slows GFR decline, corroborating
          the cAMP-driven cystogenesis axis of the canonical model.
        notes: 'Retained as CANONICAL with mechanistic qualifications. The 2026 falcon hypothesis-search
          report (kb/hypotheses/Autosomal_Dominant_Polycystic_Kidney_Disease/canonical_pkd1_pkd2_cilia_signaling_cystogenesis_model;
          openscientist timed out at 3600s) finds PARTIALLY SUPPORTED. Three pillars are strongly supported:
          (1) overwhelming human genetic evidence that PKD1 and PKD2 are the principal causal genes for
          typical ADPKD; (2) cAMP/PKA-driven proliferation and fluid secretion as central to cyst expansion;
          (3) clinical efficacy of tolvaptan (V2R antagonism) targeting the vasopressin → cAMP axis. Quantitatively,
          somatic second-hits are detected in up to 93% of cysts, supporting the focal ''two-hit'' component.
          Three qualifications: (1) the ''cilia mechanosensation → Ca²⁺ decrease → cAMP increase'' linear
          narrative is contested — flow-induced ciliary Ca²⁺ signals show controversy over directionality
          and magnitude; data consistent with ER-to-cilium Ca²⁺ rather than cilium-to-ER signaling exist;
          (2) haploinsufficiency/ threshold and developmental-timing (''third hit''/injury) models complicate
          an exclusively biallelic-loss initiation step; (3) genetic epistasis supports a cilia-dependent
          signaling switch — cilia removal can reduce Pkd1-null cystic disease severity, implying that
          intact cilia can be pro-cystic when polycystin signaling is absent. Tolvaptan remains the only
          approved disease-modifying therapy.'
      selected_evidence:
        snippet: Most persons with ADPKD have an affected parent, but de novo disease is suggested in
          10% to 25% of families.
        supports: SUPPORT
