      assertion_type: Diagnosis
      assertion:
        name: CT or MRI liver volume assessment
        description: CT or MRI defines cyst distribution, vascular compression, residual parenchyma and
          height-adjusted liver volume for treatment planning. Volume and symptom burden are separate
          measures. Age-adjusted progression estimates are promising but the 80-patient tertiary-center
          derivation cohort was retrospective, often relied on single imaging, included VUS in some analyses
          and requires external validation.
        diagnosis_term:
          preferred_term: magnetic resonance imaging procedure
          term:
            id: NCIT:C16809
            label: Magnetic Resonance Imaging
        results: Total liver and kidney volumes can be measured and correlated with clinical endpoints.
      selected_evidence:
        snippet: Identified genotypes were correlated with total liver and kidney volume (assessed by
          CT or MRI), organ function, co-morbidities, and clinical endpoints.
        supports: SUPPORT
