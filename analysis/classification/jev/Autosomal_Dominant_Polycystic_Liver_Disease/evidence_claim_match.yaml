      assertion_type: ClinicalTrial
      assertion:
        name: NCT05281328
        status: ACTIVE_NOT_RECRUITING
        description: POSITANO phase 2/3 trial compares weekly or fortnightly CAM2029 octreotide depot
          with placebo in symptomatic PLD. The 53-week randomized period is complete and registry results
          were posted June 2026; the open-label extension remains active, with estimated study completion
          in August 2027. Seventy-one participants were randomized, and the posted primary volume analysis
          includes 67 with baseline MRI. Registry-reported mean changes were -0.7% for combined CAM2029
          arms and +3.9% for placebo, with estimated relative difference -4.3% (95% CI -8.4 to -0.1; P=0.0443).
          These mixed-etiology registry results do not establish an ADPLD-specific effect or a licensed
          indication.
        target_phenotypes:
        - preferred_term: Hepatomegaly
          term:
            id: HP:0002240
            label: Hepatomegaly
      selected_evidence:
        snippet: The purpose of the trial is to compare the effectiveness and safety of 2 treatment regimens
          of CAM2029 (given weekly or every 2 weeks) to placebo in participants with symptomatic PLD,
          either isolated as in autosomal dominant PLD (ADPLD) or associated with autosomal dominant polycystic
          kidney disease (ADPKD).
        supports: SUPPORT
