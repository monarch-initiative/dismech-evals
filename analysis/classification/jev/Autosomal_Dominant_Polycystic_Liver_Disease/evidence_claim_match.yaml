              label: autosomal dominant polycystic liver disease
        context: []
      assertion_type: Treatment
      assertion:
        name: Cyst fenestration or selected hepatic resection
        description: Fenestration is considered for accessible superficial large cysts; segmental resection
          can help severe disease clustered in selected segments with sufficient spared parenchyma and
          patent vasculature. These procedures carry morbidity, recurrence and possible difficulty at
          later transplantation. In the 186-patient combined resection/fenestration series, 170 had ADPKD
          and only 16 ADPLD; major complications occurred in 21% and 90-day mortality was 2.7%. Its durable
          median 61% volume reduction comes from selected patients at a single expert center, not a randomized
          comparison with transplantation.
        treatment_term:
          preferred_term: Cyst fenestration or selected hepatic resection
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        therapeutic_modality: SURGERY
      selected_evidence:
        snippet: Since surgical resection in PLD is associated with high morbidity, especially in the
          presence of vascular abnormalities and biliary dilatation
        supports: SUPPORT
