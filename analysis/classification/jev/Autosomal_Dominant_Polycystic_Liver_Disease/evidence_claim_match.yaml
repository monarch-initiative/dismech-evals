      assertion:
        name: Abdominal ultrasonography
        description: Ultrasound establishes cyst distribution in liver and kidneys. EASL uses more than
          ten hepatic cysts as a general PLD criterion; family-based criteria may recognize younger at-risk
          relatives with fewer cysts. Liver cysts alone do not distinguish ADPLD from liver-predominant
          ADPKD. Cyst morphology and communication with the biliary tree guide alternative diagnoses.
        diagnosis_term:
          preferred_term: ultrasonography procedure
          term:
            id: NCIT:C19337
            label: Diagnostic Ultrasound
      selected_evidence:
        snippet: Ultrasonography is very useful for achieving a correct diagnosis of a polycystic liver
          and to differentiate between ADPKD and PCLD.
