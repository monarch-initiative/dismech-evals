        name: Somatostatin analogue therapy
        description: Long-acting octreotide or lanreotide can modestly reduce or stabilize liver volume
          in symptomatic diffuse PLD. These uses remain off-label as described in the 2026 ERN statement.
          Assess symptoms and consistent volumetry over 6–12 months; response can include symptom relief
          with volume stabilization. Benefit can persist during ongoing treatment for several years, while
          withdrawal can cause rebound. Monitor gastrointestinal intolerance, glucose disturbance, gallstones,
          injection reactions and cyst infection. Advanced kidney disease requires individualized dosing
          and caution; avoid during pregnancy or breastfeeding. Pasireotide has more glucose toxicity
          and is not first-line. Volume reduction does not establish prevention of transplantation or
          renal functional decline.
        treatment_term:
          preferred_term: Somatostatin analogue therapy
