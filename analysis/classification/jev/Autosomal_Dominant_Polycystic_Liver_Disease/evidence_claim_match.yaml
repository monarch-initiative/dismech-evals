              label: autosomal dominant polycystic liver disease
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing
        description: Use genetic counseling and an appropriate cystic kidney/liver panel when the phenotype,
          family history or reproductive question warrants clarification. Include deletion/duplication
          assessment and consider splice-region or other variants missed by routine coding analysis. A
          negative panel does not exclude ADPLD, and a VUS does not confirm it. Genetic testing is not
          routine screening for asymptomatic relatives solely to find liver cysts.
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Ambiguous imaging or screening may be assisted by genetic counseling and molecular diagnostics.
        supports: SUPPORT
