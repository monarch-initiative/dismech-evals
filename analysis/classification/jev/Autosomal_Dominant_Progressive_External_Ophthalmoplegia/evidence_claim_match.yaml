              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Multiple Large-Scale mtDNA Rearrangements in Muscle
        description: 'Molecular analysis of the biopsy by long-range PCR, Southern blot or deep sequencing
          demonstrates multiple heterogeneous large-scale mtDNA deletions. This is the finding that redirects
          the diagnostic workup from the mitochondrial to the nuclear genome and is the discriminator
          against the single clonal deletion of sporadic CPEO and Kearns-Sayre syndrome. In the 89-case
          mitochondrial PEO series, multiple mtDNA deletions accounted for 26% of cases and were attributable
          to TWNK, POLG, TK2 or RRM2B.

          '
        diagnostic: true
      selected_evidence:
        snippet: Single large-scale mitochondrial DNA (mtDNA) deletion was the most frequent finding (63%),
          followed by multiple mtDNA deletions (26%) due to mutations in TWNK (n=8), POLG (n=7), TK2 (n=6)
          or RRM2B (n=2) genes, and point mtDNA mutations (7%).
        supports: SUPPORT
