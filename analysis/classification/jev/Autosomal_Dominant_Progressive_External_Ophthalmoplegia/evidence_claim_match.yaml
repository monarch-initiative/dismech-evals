        context: []
      assertion_type: Subtype
      assertion:
        name: PEOA1
        display_name: PEOA1 (POLG, polymerase gamma catalytic subunit)
        subtype_term:
          preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
            dominant 1
          term:
            id: MONDO:0024528
            label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant
              1
        description: adPEO caused by a heterozygous pathogenic variant in POLG, the catalytic A subunit
          of mitochondrial DNA polymerase gamma. The dominant alleles cluster in the polymerase domain
          (classically p.Y955C in motif B, plus p.G923D, p.R943H and p.A957S) and reduce both catalytic
          efficiency and nucleotide selectivity. PEOA1 is the single commonest identified cause of familial
          PEO with multiple mtDNA deletions and carries the heaviest burden of multisystem extension,
          including parkinsonism and premature ovarian insufficiency. It must not be conflated with its
          recessive sibling PEOB1, which requires two POLG alleles.
        genes:
        - preferred_term: POLG
          term:
            id: hgnc:9179
            label: POLG
      selected_evidence:
        snippet: We mapped a new locus for dominant PEO at 15q22-q26 in a Belgian pedigree and identified
          a heterozygous mutation (Y955C) in the polymerase motif B of the mtDNA polymerase gamma (POLG).
        supports: SUPPORT
