          name: Autosomal Dominant Progressive External Ophthalmoplegia
          disease_term:
            preferred_term: autosomal dominant progressive external ophthalmoplegia
            term:
              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: adpeo_genotype_phenotype_breadth_gap
        prompt: What determines whether an adPEO genotype produces ocular-restricted disease or a broad
          PEO-plus phenotype with neuropathy, ataxia, parkinsonism and premature ovarian insufficiency?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Multisystem PEO-Plus Extension
        rationale: The gene identity clearly matters - TWNK-related adPEO shows rare CNS involvement while
          POLG-related adPEO carries a heavy neurological burden - but gene identity alone does not predict
          the phenotype within a locus, and the reviewers of the largest mixed cohort concluded that phenotype-genotype
          correlations cannot be drawn in mitochondrial PEO. No modifier gene, deletion-burden threshold
          or epigenetic signature has been shown to explain the residual variance. This is the single
          largest obstacle to prognostic counselling at the time of molecular diagnosis.
        proposed_experiments:
        - experiment_id: adpeo_multilocus_deep_phenotyping
          name: Cross-locus deep-phenotyping cohort with matched tissue deletion burden
          description: Assemble a multi-centre adPEO cohort spanning all six loci with standardised neurological,
            cardiac, audiological and endocrine phenotyping plus quantified muscle deletion burden, and
            test whether burden, gene, allele class or age explains the breadth of extra-ocular involvement.
        - experiment_id: adpeo_modifier_gwas
          name: Modifier screen in genotype-matched discordant relatives
          description: Within families segregating a single adPEO allele, compare relatives who are ocular-restricted
            with those who have PEO-plus disease, to search for nuclear or mtDNA-haplogroup modifiers
            of phenotypic breadth.
      selected_evidence:
        snippet: Our data suggest a shared clinical phenotype with variable mild multiorgan involvement,
          and that the contribution of PEO1 mutations as a cause of adPEO may well be underestimated.
        supports: SUPPORT
    origin:
