        biological_scale: MOLECULAR
        description: 'Replication-fork stalling is directly demonstrated for catalytic Twinkle and POLG
          mutants in human cells and is a plausible proximal route for POLG2 and DNA2 defects. For RRM2B
          and especially SLC25A4, the connection is less direct and may involve nucleotide insufficiency,
          energy imbalance, or intermediates not yet identified. The node is therefore a convergent mechanistic
          model with gene-specific evidence, not a claim that fork arrest has been measured in every adPEO
          genotype.

          '
