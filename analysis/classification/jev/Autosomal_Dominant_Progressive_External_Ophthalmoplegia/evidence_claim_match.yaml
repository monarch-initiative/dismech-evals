  b255fbabb1bd90d0d786cd0fc4d4a1b548ca9170990bcd4a2ad00053a315185e:
    claim:
      about:
        disease:
          name: Autosomal Dominant Progressive External Ophthalmoplegia
          disease_term:
            preferred_term: autosomal dominant progressive external ophthalmoplegia
            term:
              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Treatment
      assertion:
        name: Elamipretide (Investigational, Not Approved)
        description: 'Elamipretide is a mitochondria-targeted tetrapeptide investigated for primary mitochondrial
          myopathy. It is NOT approved for adPEO or for any mitochondrial myopathy indication, and the
          Phase 3 MMPOWER-3 trial was NEGATIVE in its genotypically diverse primary mitochondrial myopathy
          population. A POST HOC genotype-stratified analysis found that participants carrying mtDNA replisome
          variants who also had CPEO - broadly the adPEO population - improved on the six-minute walk
          test by 37.3 +/- 9.5 m versus -8.0 +/- 10.7 m on placebo at week 24 (p=0.0024), with the replisome
          cohort as a whole only trending toward benefit (p=0.06). This is a hypothesis-generating exploratory
          subgroup finding from a trial that failed its primary endpoints; it is NOT evidence of efficacy.
          It motivated the dedicated Phase 3 NuPOWER trial (NCT05162768) in nuclear-DNA primary mitochondrial
          disease, and no efficacy conclusion can be drawn until those results are published. This treatment
          is curated so that the negative parent-trial result is on the record alongside the subgroup
          signal.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: elamipretide
            term:
              id: NCIT:C171874
              label: Elamipretide
        therapeutic_modality: PEPTIDE
        target_phenotypes:
        - preferred_term: Exercise intolerance
          term:
            id: HP:0003546
            label: Exercise intolerance
        notes: 'Not approved for adPEO or any mitochondrial myopathy indication at the time of curation.
          Do not present the post-hoc 6MWT figure as a treatment effect estimate.

          '
      selected_evidence:
        snippet: The 6MWT results at week 24 in subjects with replisome variants showed a significant
          change in the elamipretide group subjects who had chronic progressive external ophthalmoplegia
          (CPEO) (37.3 ± 9.5 m versus - 8.0 ± 10.7 m for the placebo group; p = 0.0024).
        supports: SUPPORT
