  c18aa2ba3bc38dba9f48c1a9bbb844125ca45ffc130733db9b5d15e85bec99fa:
    claim:
      about:
        disease:
          name: Autosomal Dominant Progressive External Ophthalmoplegia
          disease_term:
            preferred_term: autosomal dominant progressive external ophthalmoplegia
            term:
              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'adPEO is inherited in an autosomal dominant manner at all six loci: a single heterozygous
          pathogenic variant in POLG, SLC25A4, TWNK, POLG2, RRM2B or DNA2 is sufficient. Each child of
          an affected individual has a 50% risk of inheriting the variant. Family history was positive
          in 22 of 25 patients in the genotyped TWNK cohort. Two caveats are important. First, germline
          mosaicism has been documented at the SLC25A4 locus in a parent who did not carry the variant
          in blood, so an apparently de novo case does not guarantee a negligible sibling recurrence risk.
          Second, both POLG and RRM2B also cause distinct autosomal RECESSIVE disorders, so the number
          of pathogenic alleles, not merely the gene, determines the inheritance mode and the counselling.'
      selected_evidence:
        snippet: Late-onset PEO may be caused by a heterozygous POLG pathogenic variant and inherited
          in an autosomal dominant manner.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
