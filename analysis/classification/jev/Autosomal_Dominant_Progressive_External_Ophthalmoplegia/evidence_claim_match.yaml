      assertion_type: Pathophysiology
      assertion:
        name: Clonal Expansion of Deleted mtDNA in Post-Mitotic Cells
        role: amplifier
        biological_scale: CELLULAR
        description: 'A newly formed deletion is initially a small fraction of the mtDNA in a cell and
          is phenotypically silent. In post-mitotic cells, deleted genomes can expand clonally within
          individual cells or fibre segments as mtDNA turns over. The relative roles of replicative advantage,
          random intracellular drift, selection, and quality-control failure remain unresolved, so the
          entry does not assign one expansion mechanism. Age-dependent accumulation is consistent with
          adult onset, but onset age is not treated as direct proof of clonal expansion.

          '
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: The data also suggest that tissue-specific mechanisms are involved in the clonal expansion
          and expression of secondary mtDNA deletions in CPEO patients with nuclear genetic defects.
        supports: SUPPORT
