      assertion_type: Pathophysiology
      assertion:
        name: Skeletal and Bulbar Mitochondrial Myopathy
        role: consequence
        biological_scale: TISSUE
        description: 'Limb, neck, facial and bulbar muscles accumulate COX-negative fibre segments by
          the same threshold mechanism but more slowly than extraocular muscle, producing the "PEO-plus"
          myopathic phenotype. In the largest genotyped adPEO cohort (25 TWNK patients), weakness affecting
          proximal limbs, neck and bulbar muscles was present in 48% and exercise intolerance in 28%.
          Deficient oxidative phosphorylation limits sustained aerobic work, so fatigue and exercise intolerance
          often precede fixed weakness. Bulbar involvement produces dysphagia and dysphonia and is the
          main driver of aspiration risk.

          '
