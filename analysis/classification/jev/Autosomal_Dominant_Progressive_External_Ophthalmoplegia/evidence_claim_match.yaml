            term:
              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Functional mtDNA-Maintenance Capacity
        role: effector
        biological_scale: MOLECULAR
        description: 'Heterozygous pathogenic variants reduce the effective capacity of the mtDNA maintenance
          system, but the molecular basis of dominance differs by locus and is not settled uniformly.
          POLG dominant alleles reduce catalytic efficiency and nucleotide selectivity; POLG2 p.G451E
          fails to stimulate the catalytic subunit; and the RRM2B p.R327X transcript escapes nonsense-mediated
          decay and produces a truncated protein unable to engage the R1 subunit. Dominant-negative assembly
          is a plausible model for multimeric proteins such as Twinkle, but it must not be treated as
          universal: heterozygous TWNK nonsense alleles are now also reported. The atomic event represented
          here is reduced functional maintenance capacity; the competing dominance mechanisms remain an
          explicit knowledge gap.

          '
        molecular_functions:
        - preferred_term: DNA-directed DNA polymerase activity
          term:
            id: GO:0003887
            label: DNA-directed DNA polymerase activity
          modifier: DECREASED
        - preferred_term: DNA helicase activity
          term:
            id: GO:0003678
            label: DNA helicase activity
          modifier: DECREASED
        locations:
        - preferred_term: mitochondrial nucleoid
          term:
            id: GO:0042645
            label: mitochondrial nucleoid
      selected_evidence:
        snippet: Although G451E p55 retains a wild-type ability to bind DNA, it fails to enhance the DNA-binding
          strength of the p140-p55 complex.
        supports: SUPPORT
