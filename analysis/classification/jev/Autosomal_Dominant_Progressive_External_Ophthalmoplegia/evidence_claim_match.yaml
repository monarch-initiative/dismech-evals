              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: adpeo_extraocular_selectivity_gap
        prompt: Is the selective vulnerability of extraocular muscle in adPEO driven by a lower biochemical
          threshold, a faster rate of deletion generation, more permissive clonal expansion, or reduced
          mitochondrial quality control?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Extraocular Muscle Selective Vulnerability
        rationale: Extraocular muscle carries three times the COX-deficient fibre burden of limb muscle
          in CPEO and crosses into COX deficiency at a lower mutational load, and the authors of that
          study explicitly attribute the pattern to unspecified tissue-specific mechanisms in clonal expansion
          and expression. The candidate explanations have not been discriminated. This matters because
          tissue selectivity, not enzymology, is what makes PEO a distinct clinical entity from the other
          phenotypes produced by the same alleles.
        proposed_experiments:
        - experiment_id: adpeo_eom_single_fibre_threshold
          name: Single-fibre deletion load and threshold mapping across muscle allotypes
          description: Measure single-fibre mtDNA deletion load and the heteroplasmy threshold for COX
            negativity in extraocular, levator palpebrae and limb muscle from the same adPEO donor, to
            separate a lower threshold from a faster accumulation rate.
        - experiment_id: adpeo_eom_mitophagy_flux
          name: Allotype-resolved mitophagy and mitochondrial dynamics measurement
          description: Compare mitophagy flux and fusion/fission dynamics between human extraocular and
            limb muscle to test the quality-control-capacity explanation for selective vulnerability.
      selected_evidence:
        snippet: The data also suggest that tissue-specific mechanisms are involved in the clonal expansion
          and expression of secondary mtDNA deletions in CPEO patients with nuclear genetic defects.
        supports: SUPPORT
