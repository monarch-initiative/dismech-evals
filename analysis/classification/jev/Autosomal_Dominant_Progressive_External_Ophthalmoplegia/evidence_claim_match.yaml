      assertion_type: Discussion
      assertion:
        discussion_id: adpeo_model_fidelity_mismatch
        prompt: Do the available mouse, cell and yeast models of adPEO genes actually reproduce the defining
          human disease features, given that no model organism has the human extraocular muscle allotype
          and that cultured cells cannot reproduce decades-long age-dependent clonal expansion?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Clonal Expansion of Deleted mtDNA in Post-Mitotic Cells
        - pathophysiology#Extraocular Muscle Selective Vulnerability
        rationale: Model evidence for adPEO is substantial and mechanistically informative - Twinkle and
          POLG catalytic mutants stall replication in human cells, and transgenic mice establish Twinkle
          as rate-limiting for mtDNA copy number - but the two features that define the human disease
          are precisely the ones the models cannot supply. The ocular phenotype depends on the extraocular
          muscle allotype, which no standard model recapitulates, and the adult onset depends on somatic
          clonal expansion over four decades, which no cell culture or short-lived rodent can span. Evidence
          therefore exists but its translational validity to the defining human features is the open question,
          which is why this is recorded as a human-model mismatch rather than a knowledge gap.
        proposed_experiments:
        - experiment_id: adpeo_long_lived_model_aging
          name: Long-duration ageing study in a knock-in adPEO model with ocular phenotyping
          description: Follow a heterozygous knock-in model carrying a human dominant allele across the
            full lifespan with serial extraocular and limb muscle single-fibre COX/SDH and deletion-burden
            quantification, to test whether age-dependent ocular-predominant pathology emerges at all.
        - experiment_id: adpeo_human_eom_organoid
          name: Human extraocular-allotype myotube model of clonal expansion
          description: Derive extraocular-allotype myotubes from patient iPSCs and apply an accelerated
            mtDNA turnover protocol, to test whether the lower COX threshold of extraocular muscle is
            cell-autonomous and reproducible outside the orbit.
      selected_evidence:
        snippet: Both groups of mutants reduced mitochondrial DNA copy number by severe replication stalling.
        supports: SUPPORT
