        role: consequence
        biological_scale: TISSUE
        description: 'Extraocular muscle and the levator palpebrae superioris are prominently affected
          in mtDNA-deletion disorders. The best-supported explanation is quantitative: in CPEO patients
          with mtDNA deletions, 41.6% of extraocular muscle fibres are COX-deficient compared with 13.7%
          of limb (quadriceps) fibres, and single-fibre analysis shows that extraocular muscle crosses
          into COX deficiency at a LOWER mutational load than skeletal muscle. The additional cellular
          properties that set this lower threshold are unresolved; mitochondrial content and activity
          pattern remain hypotheses rather than findings demonstrated by the cited patient study.

          '
