          term:
            id: MONDO:0012241
            label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant
              3
        description: adPEO caused by a heterozygous variant in TWNK (formerly C10orf2/PEO1), encoding
          Twinkle, the hexameric replicative 5'-3' DNA helicase that unwinds mtDNA ahead of polymerase
          gamma and colocalises with mtDNA in mitochondrial nucleoids. The dominant variants are often
          missense and cluster in functionally important regions, but pathogenic heterozygous nonsense
          and de novo alleles are also now documented. PEOA3 commonly presents as ocular-predominant mitochondrial
          myopathy, while longitudinal data show that CNS and multiorgan involvement can emerge over time.
        genes:
        - preferred_term: TWNK
          term:
            id: hgnc:1160
            label: TWNK
      selected_evidence:
        snippet: The study included a total of 189 patients (116 female), with a mean age at symptom onset
          of 40.3 years.
        supports: SUPPORT
