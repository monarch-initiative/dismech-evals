            term:
              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Threshold-Dependent Mosaic Respiratory Chain Deficiency
        role: central_effector
        biological_scale: CELLULAR
        description: 'Because mtDNA is multicopy, deleted genomes are functionally recessive until they
          cross a critical fraction of the cellular mtDNA population. Above this biochemical threshold
          the affected cell can no longer synthesise the thirteen mtDNA-encoded oxidative phosphorylation
          subunits and the tRNAs needed to translate them, and oxidative phosphorylation fails. Because
          expansion is independent in each cell, the resulting deficiency is mosaic: individual COX-negative
          fibre segments sit alongside normally respiring neighbours. Complex IV is the histochemical
          readout because three of its catalytic subunits are mtDNA-encoded, whereas complex II (SDH)
          is entirely nuclear-encoded and is preserved or increased, giving a COX-negative/SDH-hyperreactive
          signature of impaired mtDNA expression, including secondary mtDNA defects caused by nuclear
          maintenance genes; it does not imply that the initiating variant lies in mtDNA.

          '
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
        molecular_functions:
        - preferred_term: cytochrome-c oxidase activity
          term:
            id: GO:0004129
            label: cytochrome-c oxidase activity
          modifier: DECREASED
      selected_evidence:
        snippet: single-fiber analysis revealed a lower mutational threshold for COX deficiency in EOM
        supports: SUPPORT
