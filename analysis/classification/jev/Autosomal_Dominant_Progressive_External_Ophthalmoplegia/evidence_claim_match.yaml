      assertion_type: Diagnosis
      assertion:
        name: Molecular Diagnosis by a Single Heterozygous Nuclear Variant
        description: 'Diagnosis rests on the clinical picture of adult-onset progressive ptosis and external
          ophthalmoplegia, usually with a dominant family history, plus identification of a SINGLE heterozygous
          pathogenic variant in POLG, SLC25A4, TWNK, POLG2, RRM2B or DNA2. The monoallelic requirement
          is what distinguishes adPEO from its recessive counterparts at the shared POLG and RRM2B loci,
          and GeneReviews states it explicitly for POLG. Practice has shifted toward panel or exome-first
          testing: in TWNK-related adPEO, direct sequencing is recommended before muscle biopsy. Where
          genetics is inconclusive, muscle biopsy with COX/SDH histochemistry and mtDNA rearrangement
          analysis remains the most accurate single test, and analysis of a clinically affected tissue
          is required because the secondary deletions can be tissue-restricted.

          '
      selected_evidence:
        snippet: Direct sequencing of the PEO1 gene should be considered in adPEO patients prior to muscle
          biopsy.
