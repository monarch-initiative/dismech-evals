  c5d3e4f2578ff5b236e54d43f02e981503be1a0b47f67ef4d2937dac5c3d9093:
    claim:
      about:
        disease:
          name: Autosomal Dominant Progressive External Ophthalmoplegia
          disease_term:
            preferred_term: autosomal dominant progressive external ophthalmoplegia
            term:
              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of Valproic Acid (Contraindicated)
        description: 'Valproic acid and sodium divalproate must be avoided in POLG-related disease, including
          PEOA1, because they can precipitate or accelerate liver disease and fatal hepatic failure; POLG
          genotype prospectively identifies individuals at high risk. GeneReviews extends an equivalent
          caution to RRM2B-related disease, where valproate should be used only in exceptional circumstances.
          Because epilepsy can occur in POLG-related disease and valproate is a common anticonvulsant
          choice, this is the single most actionable prescribing fact in adPEO. This record is curated
          with negative valence: the intervention is withholding the drug, not administering it. SCOPE
          LIMIT: the caution is GENOTYPE-DIRECTED, not adPEO-wide. It is established for POLG (PEOA1)
          and extended by GeneReviews to RRM2B (PEOA5); no equivalent evidence exists for the SLC25A4
          (PEOA2), TWNK (PEOA3), POLG2 (PEOA4) or DNA2 (PEOA6) subtypes, and this entry does not assert
          one for them. Note also that the underlying hepatotoxicity literature is dominated by BIALLELIC
          POLG disease, so its transfer to heterozygous dominant adPEO is an extrapolation of prescribing
          caution rather than a directly demonstrated dominant-genotype risk.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: valproic acid
            term:
              id: CHEBI:39867
              label: valproic acid
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: because of the risk of precipitating and/or accelerating liver disease
        supports: SUPPORT
