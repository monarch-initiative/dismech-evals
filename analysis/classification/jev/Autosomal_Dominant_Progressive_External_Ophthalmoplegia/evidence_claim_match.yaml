          informative: this is a primary bioenergetic nigrostriatal degeneration rather than an alpha-synucleinopathy,
          which is why conformance is declared at the nigrostriatal-neurodegeneration node of the parkinsonism
          module and NOT at its alpha-synuclein aggregation node.

