          analysis is the decisive step and completely changes the genetic counselling.

          '
        distinguishing_features:
        - Single clonal large-scale mtDNA deletion versus multiple heterogeneous deletions
        - Sporadic occurrence with negligible recurrence risk versus 50% dominant transmission
        - Kearns-Sayre adds retinopathy, cardiac conduction block and onset before age 20
        - No causative nuclear gene variant identified
