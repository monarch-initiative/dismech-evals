  265a806ff3342ad9eb7c75876a5ab7a6c4feca794412ca67123fd9bd9570fb11:
    claim:
      about:
        disease:
          name: Autosomal Dominant Progressive External Ophthalmoplegia
          disease_term:
            preferred_term: autosomal dominant progressive external ophthalmoplegia
            term:
              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: adpeo_dominance_mechanism_gap
        prompt: Why is a single heterozygous variant sufficient to destabilise the mitochondrial genome
          at six mechanistically different nuclear loci, when the recessive counterparts at two of those
          same loci (POLG, RRM2B) require two alleles?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Functional mtDNA-Maintenance Capacity
        rationale: 'Three distinct explanations are invoked in the literature and have never been discriminated
          head to head: dominant-negative poisoning of a multimer (Twinkle hexamer), haploinsufficiency
          or heterodimerisation within an obligate heterodimer (POLG2 p.G451E), and dominant-negative
          truncation of an interaction surface (RRM2B p.R327X). It is not established whether the SLC25A4/ANT1
          alleles act by any of these routes or by a fourth, transport-based mechanism. This matters because
          the mechanism determines whether allele-specific silencing would be therapeutic (dominant-negative)
          or counterproductive (haploinsufficiency), and it is the axis on which any future gene-directed
          therapy would be designed.'
        proposed_experiments:
        - experiment_id: adpeo_allelic_titration_replisome
          name: Allelic titration of mutant versus wild-type replisome subunits
          description: In an isogenic human cell system, titrate the mutant:wild-type ratio of Twinkle,
            POLG, POLG2 and RRM2B and measure mtDNA copy number, deletion burden and fork progression,
            to distinguish a haploinsufficiency dose-response (linear from 50%) from dominant-negative
            poisoning (worse than 50% function at 50% mutant).
        - experiment_id: adpeo_allele_specific_knockdown
          name: Allele-specific knockdown of the mutant transcript in patient cells
          description: Selectively silence the mutant allele in patient-derived myoblasts for each of
            the six genes and ask whether mtDNA deletion burden falls (supporting dominant-negative action)
            or worsens (supporting haploinsufficiency).
      selected_evidence:
        snippet: In vivo, the disease most likely arises through haplotype insufficiency or heterodimerization
          of the mutated and wild-type proteins, which promote mtDNA deletions by stalling the DNA replication
          fork.
        supports: SUPPORT
    origin:
