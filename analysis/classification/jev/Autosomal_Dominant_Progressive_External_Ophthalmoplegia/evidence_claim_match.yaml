      assertion:
        name: Oculopharyngeal Muscular Dystrophy
        disease_term:
          preferred_term: oculopharyngeal muscular dystrophy
          term:
            id: MONDO:0008116
            label: oculopharyngeal muscular dystrophy
        description: 'An autosomal dominant late-onset myopathy caused by a short GCN trinucleotide repeat
          expansion in PABPN1, presenting with ptosis and dysphagia. It shares the dominant pedigree,
          the late onset and the ptosis-plus-bulbar phenotype with adPEO and accounted for 20% of prior
          misdiagnoses in the genotyped TWNK cohort. Extraocular motility is relatively spared in OPMD
          relative to the severity of the ptosis, and muscle biopsy shows rimmed vacuoles and intranuclear
          filamentous inclusions rather than ragged-red and COX-negative fibres.

          '
        distinguishing_features:
        - PABPN1 GCN repeat expansion rather than a nuclear mtDNA maintenance gene variant
        - Rimmed vacuoles and intranuclear inclusions rather than ragged-red and COX-negative fibres
        - Ophthalmoparesis relatively mild for the degree of ptosis
        - No multiple mtDNA deletions in muscle
      selected_evidence:
        snippet: 36% with myasthenia, 20% with oculopharyngeal muscle dystrophy
        supports: SUPPORT
