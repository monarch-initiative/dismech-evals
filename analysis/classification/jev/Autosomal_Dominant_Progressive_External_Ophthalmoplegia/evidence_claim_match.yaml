            display_name: PEOA2 (SLC25A4/ANT1, adenine nucleotide translocator 1)
            subtype_term:
              preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
                dominant 2
              term:
                id: MONDO:0012238
                label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
                  dominant 2
            description: adPEO caused by a heterozygous missense variant in SLC25A4, encoding the heart/skeletal-muscle
              isoform of the adenine nucleotide translocator (ANT1), the inner-membrane ADP/ATP carrier.
              ANT1 is not part of the replisome; the dominant variants are thought to perturb the mitochondrial
              nucleotide and energy homeostasis on which faithful mtDNA replication depends. PEOA2 was
              the first demonstration that a mitochondrial disease could be produced by a dominant mechanism.
              The phenotype is usually myopathic, and germline mosaicism has been documented in at least
              one pedigree.
            genes:
            - preferred_term: SLC25A4
              term:
                id: hgnc:10990
                label: SLC25A4
          role: subtype
      assertion_type: Genetic
      assertion:
        name: SLC25A4
        gene_term:
          preferred_term: SLC25A4
          term:
            id: hgnc:10990
            label: SLC25A4
        relationship_type: CAUSATIVE
        subtype: PEOA2
        variant_origin: GERMLINE
        association: A single heterozygous missense variant in SLC25A4, encoding the heart and skeletal-muscle
          isoform of the adenine nucleotide translocator (ANT1), causes PEOA2. The prototype familial
          allele substitutes proline for a highly conserved alanine at position 114; the analogous substitution
          in yeast produces a respiratory defect. A second reported allele converts a conserved alanine
          at codon 90 to aspartic acid. Germline mosaicism has been documented, which has direct implications
          for recurrence-risk counselling in apparently sporadic cases.
      selected_evidence:
        snippet: The familial mutation substitutes a proline for a highly conserved alanine at position
          114 in the ANT1 protein. The analogous mutation in yeast caused a respiratory defect.
        supports: SUPPORT
