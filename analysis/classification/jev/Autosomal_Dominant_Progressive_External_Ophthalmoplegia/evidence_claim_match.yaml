  b7926787e095646e81044ec40dc65603406344cf0615bbb9cb6fe19627daf4e0:
    claim:
      about:
        disease:
          name: Autosomal Dominant Progressive External Ophthalmoplegia
          disease_term:
            preferred_term: autosomal dominant progressive external ophthalmoplegia
            term:
              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Nucleotide and Energy Homeostasis Disruption
        role: effector
        biological_scale: MOLECULAR
        description: 'RRM2B supplies deoxyribonucleotides for mtDNA synthesis in non-dividing cells, whereas
          SLC25A4/ANT1 exchanges ADP and ATP across the inner mitochondrial membrane. Both influence mtDNA
          maintenance, but they do not license the same proximal claim: RRM2B variants directly perturb
          dNTP supply, while the route from defective ADP/ATP exchange to multiple mtDNA deletions remains
          incompletely defined. This node therefore records the shared disruption of nucleotide and energy
          homeostasis, with an indirect edge to replication-fork dysfunction rather than asserting that
          ANT1 itself transports dNTPs.

          '
        locations:
        - preferred_term: mitochondrial inner membrane
          term:
            id: GO:0005743
            label: mitochondrial inner membrane
        molecular_functions:
        - preferred_term: ATP:ADP antiporter activity
          term:
            id: GO:0005471
            label: ATP:ADP antiporter activity
          modifier: DECREASED
        - preferred_term: ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor
          term:
            id: GO:0004748
            label: ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor
          modifier: DECREASED
        biological_processes:
        - preferred_term: 2'-deoxyribonucleotide metabolic process
          term:
            id: GO:0009394
            label: 2'-deoxyribonucleotide metabolic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: These results indicate that ANT has a role in mtDNA maintenance and that a mitochondrial
          disease can be caused by a dominant mechanism.
        supports: SUPPORT
