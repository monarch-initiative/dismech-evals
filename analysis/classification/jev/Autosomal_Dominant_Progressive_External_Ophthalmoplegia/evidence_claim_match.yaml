        context: []
      assertion_type: Subtype
      assertion:
        name: PEOA5
        display_name: PEOA5 (RRM2B/p53R2, ribonucleotide reductase small subunit)
        subtype_term:
          preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
            dominant 5
          term:
            id: MONDO:0013117
            label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant
              5
        description: adPEO caused by a heterozygous variant in RRM2B, encoding p53R2, the small subunit
          of the ribonucleotide reductase that supplies deoxyribonucleotides for mtDNA synthesis in non-dividing
          cells. The prototype allele is the C-terminal nonsense variant p.R327X, whose transcript escapes
          nonsense-mediated decay and yields a truncated protein that can no longer engage the R1 subunit,
          acting dominant-negatively. RRM2B is unusual in that biallelic variants in the same gene cause
          a much more severe, early-onset recessive encephalomyopathic mtDNA depletion syndrome, so the
          mode of inheritance must be established explicitly.
        genes:
        - preferred_term: RRM2B
          term:
            id: hgnc:17296
            label: RRM2B
      selected_evidence:
        snippet: Autosomal dominant progressive external ophthalmoplegia (adPEO), typically adult onset;
          other manifestations can include ptosis, bulbar dysfunction, fatigue, and muscle weakness.
        supports: SUPPORT
