        description: 'A single heterozygous germline variant in one of at least six nuclear genes initiates
          adPEO. The genes belong to two functional classes that converge on the same molecular lesion.
          The replisome class comprises POLG (catalytic polymerase gamma A subunit), POLG2 (p55 accessory
          subunit), TWNK (Twinkle replicative helicase) and DNA2 (helicase/nuclease of mtDNA replication
          and long-patch base-excision repair). The nucleotide-supply class comprises SLC25A4/ANT1 (the
          heart and skeletal-muscle ADP/ATP carrier) and RRM2B/p53R2 (the ribonucleotide reductase small
          subunit that provides dNTPs to non-dividing cells). Because mtDNA is replicated by a small,
          dedicated protein set with no redundant backup polymerase, loss of function in any one of these
          components is not buffered.

          '
