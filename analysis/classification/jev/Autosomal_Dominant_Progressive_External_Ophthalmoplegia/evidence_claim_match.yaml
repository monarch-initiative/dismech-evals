        context: []
      assertion_type: Diagnosis
      assertion:
        name: Serum FGF21 and GDF15 as Non-Invasive Adjuncts
        description: 'FGF21 and GDF15 are circulating markers of the mitochondrial integrated stress response
          and outperform muscle histology as a screening test in mitochondrial disease: in a 194-sample
          study only 39% of genetically verified patients had mitochondrial pathology on muscle histology,
          whereas biomarkers were elevated in 62%. In a myopathic patient with at least one elevated biomarker,
          an mtDNA-expression disorder - the class that includes adPEO - was the cause with 94% probability.
          They are best positioned as non-invasive first-line tests preceding genetic sequencing. Normal
          values do not exclude disease, and neither marker is specific for the dominant nuclear form
          or for adPEO in particular.

          '
      selected_evidence:
        snippet: Only 39% of patients with genetically verified mitochondrial disease had mitochondrial
          pathology in their muscle histology. In contrast, biomarkers were elevated in 62% of patients
          with genetically verified mitochondrial disease.
        supports: SUPPORT
