              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Demonstration of Multiple (Not Single) mtDNA Deletions in Muscle
        description: 'The decisive molecular discriminator between adPEO and sporadic CPEO or Kearns-Sayre
          syndrome is whether muscle carries MULTIPLE heterogeneous deletions (nuclear-gene disease, dominant
          recurrence risk) or a SINGLE clonal large-scale deletion (sporadic, negligible recurrence risk).
          In an 89-case mitochondrial PEO series, a single deletion accounted for 63% and multiple deletions
          for 26%. Detection method matters: in some patients the multiple deletions are visible only
          on PCR-based assays and not on Southern blotting.

          '
      selected_evidence:
        snippet: If no mtDNA deletions are identified, whole mtDNA sequencing should be performed.
        supports: SUPPORT
