  d9e86f1db47bea58856c42b75f5f3f3035ad6b3cd1c6f9adfa8e5ed92daf502d:
    claim:
      about:
        disease:
          name: Autosomal Dominant Progressive External Ophthalmoplegia
          disease_term:
