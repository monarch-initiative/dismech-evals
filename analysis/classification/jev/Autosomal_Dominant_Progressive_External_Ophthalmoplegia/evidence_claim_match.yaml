      assertion_type: Pathophysiology
      assertion:
        name: Multisystem PEO-Plus Extension
        role: consequence
        biological_scale: ORGANISM
        description: 'Because the nuclear variant is constitutional, multiple post-mitotic tissues can
          accumulate secondary mtDNA defects, but involvement is neither uniform nor shown in every tissue.
          Clinical expression depends on tissue context and genotype. TWNK-related adPEO is comparatively
          ocular-restricted, with CNS features rarely described but cardiac abnormalities in around a
          quarter of patients, whereas POLG-related adPEO carries the greatest burden of neurological
          extension. Reported extensions include peripheral neuropathy, ataxia, sensorineural hearing
          loss, cataract, cardiac conduction disease and cardiomyopathy, respiratory muscle involvement,
          gastrointestinal dysmotility, depression and other psychiatric features.

          '
      selected_evidence:
        snippet: Less frequent manifestations were cardiac (24%) and respiratory (4%) involvement, neuropathy
          (8%), ataxia (4%), and parkinsonism (4%).
        supports: SUPPORT
