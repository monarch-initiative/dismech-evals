              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Treatment
      assertion:
        name: Ptosis Surgery (Levator Advancement or Frontalis Suspension)
        description: 'Surgical correction is the mainstay of symptomatic treatment for the ptosis of adPEO,
          chosen according to levator excursion: levator advancement or resection where levator function
          is preserved, frontalis suspension (sling) where it is not. Myogenic ptosis is a particularly
          difficult surgical target because the ptosis continues to worsen and because the same mitochondrial
          myopathy impairs protective corneal mechanisms (Bell phenomenon, orbicularis closure). Deliberate
          under-correction is therefore standard, at the cost of a high recurrence rate.

          '
        treatment_term:
          preferred_term: Ophthalmologic Surgical Procedure
          term:
            id: NCIT:C15331
            label: Ophthalmologic Surgical Procedure
        therapeutic_modality: SURGERY
        target_phenotypes:
        - preferred_term: Ptosis
          term:
            id: HP:0000508
            label: Ptosis
      selected_evidence:
        snippet: Surgical techniques predominantly involved levator advancement, levator resection, frontalis
          sling, blepharoplasty, and Fasanella-Servat.
        supports: SUPPORT
