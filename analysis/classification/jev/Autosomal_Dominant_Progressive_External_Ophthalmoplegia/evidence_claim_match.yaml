          Because three complex IV catalytic subunits are mtDNA-encoded while complex II is entirely nuclear-encoded,
          this COX-negative/SDH-positive pattern indicates impaired mtDNA expression, including secondary
          mtDNA defects caused by nuclear maintenance-gene variants.

          '
