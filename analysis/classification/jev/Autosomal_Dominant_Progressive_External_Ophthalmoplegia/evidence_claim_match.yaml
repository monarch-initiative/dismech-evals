            label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal dominant
              4
        description: adPEO caused by a heterozygous variant in POLG2, encoding the p55 accessory subunit
          that confers processivity on the polymerase gamma holoenzyme. The prototype allele p.G451E binds
          DNA normally but fails to stimulate the catalytic p140 subunit or to enhance the DNA-binding
          strength of the p140-p55 complex, so disease arises through haploinsufficiency or heterodimerisation
          of mutant with wild-type protein. PEOA4 is a rare subtype.
        genes:
        - preferred_term: POLG2
          term:
            id: hgnc:9180
            label: POLG2
      selected_evidence:
        snippet: that causes progressive external ophthalmoplegia with multiple mtDNA deletions and cytochrome
          c oxidase (COX)-deficient muscle fibers
