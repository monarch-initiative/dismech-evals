            term:
              id: MONDO:0008003
              label: autosomal dominant progressive external ophthalmoplegia
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counseling and Cascade Testing
        description: 'Because adPEO is dominantly transmitted, each child of an affected individual has
          a 50% risk. Counselling should cover the transmission risk, the variable expressivity and late
          onset that make the phenotype easy to miss in relatives, the availability of prenatal and preimplantation
          genetic testing once the familial variant is known, and the germline-mosaicism caveat that an
          apparently de novo case does not guarantee negligible sibling recurrence risk. For POLG and
          RRM2B, counselling must establish whether the family carries a dominant (monoallelic) or a recessive
          (biallelic) genotype, since the recurrence risks differ fundamentally.

          '
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: Once the RRM2B pathogenic variant(s) have been identified in an affected family member,
          prenatal and preimplantation genetic testing for RRM2B-MDMD are possible.
        supports: SUPPORT
