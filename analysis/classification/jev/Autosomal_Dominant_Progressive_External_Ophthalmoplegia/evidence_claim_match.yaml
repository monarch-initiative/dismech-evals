          nonsense-mediated decay and yields a truncated protein that can no longer engage the R1 subunit,
          acting dominant-negatively. RRM2B is unusual in that biallelic variants in the same gene cause
          a much more severe, early-onset recessive encephalomyopathic mtDNA depletion syndrome, so the
