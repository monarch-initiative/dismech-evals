          fibre segments on sequential COX/SDH histochemistry. Mitochondrial change was present in all
          19 available biopsies in the genotyped TWNK adPEO cohort and in 95% of a mixed-aetiology 89-case
          mitochondrial PEO series. The burden of change varies remarkably between patients, so a sparse
          or equivocal biopsy does not exclude the diagnosis.

          '
