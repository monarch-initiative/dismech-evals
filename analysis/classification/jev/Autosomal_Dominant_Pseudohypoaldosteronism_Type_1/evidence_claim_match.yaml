              label: autosomal dominant pseudohypoaldosteronism type 1
        context: []
      assertion_type: Genetic
      assertion:
        name: NR3C2
        association: Causative (heterozygous loss of function)
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: NR3C2
          term:
            id: hgnc:7979
            label: NR3C2
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_8c78e824-d77d-4635-a181-6139b8e9c028-2021-07-15T023000.000Z
        notes: Variants occur throughout the gene with no hot spot; nonsense and frameshift alleles are
          the most common, with fewer missense alleles in the DNA-binding and ligand-binding domains.
          Intragenic and larger deletions account for a minority and are missed by sequencing, so deletion
          or duplication testing is needed when sequencing is negative. A gain-of-function NR3C2 allele
