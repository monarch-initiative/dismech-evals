      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: Clinical recognition of Robinow syndrome should be followed by molecular testing
          that distinguishes WNT5A-related disease from overlapping forms. A heterozygous pathogenic or
          likely pathogenic WNT5A variant supports this specific diagnosis; a VUS neither establishes
          nor excludes it. A multigene skeletal-dysplasia/Robinow panel or exome/genome analysis can assess
          WNT5A, DVL1/DVL3, FZD2 and recessive ROR2/NXN disease, with gene content updated by the laboratory.
          Ensure adequate coverage and small-indel detection; a negative result does not settle a different
          molecular etiology.
      selected_evidence:
        snippet: Identification of a heterozygous DVL1, DVL3, or WNT5A variant of uncertain significance
          does not establish or rule out the diagnosis.
        supports: SUPPORT
