        context: []
      assertion_type: Genetic
      assertion:
        name: WNT5A
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: WNT5A
          term:
            id: hgnc:12784
            label: WNT5A
        notes: WNT5A variants include missense substitutions, often involving cysteines, and selected
          in-frame variants. Inherited, de novo and mosaic presentations occur. In the 2018 cohort a de
          novo c.487_492dup (NM_003392.4; p.Gly163_Cys164dup) was found in 16/70 mapped reads (23%), consistent
          with blood mosaicism. This is not a germline transmission probability. Biallelic loss-of-function
          disease is a distinct, more severe allelic presentation. Protein folding, secretion and signaling
          can all be affected; a uniformly secreted but merely less active ligand is not established.
      selected_evidence:
        snippet: by the identification of a heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through
          molecular genetic testing
        supports: SUPPORT
