    evidence_metadata:
      reference: PMID:25817014
      reference_title: Mutations in DVL1 cause an osteosclerotic form of Robinow syndrome.
      evidence_source: IN_VITRO
      explanation: This paper's proposed mechanistic contrast with WNT5A disease. The mutant allele alone
        is less active than wild type, but together they raise canonical Wnt signalling in this study's
        co-expression assay - a candidate driver of osteosclerosis, contrasting with WNT5A's hypomorphic
        ligand decreasing the non-canonical branch. A different group's co-expression assay of the DVL1-1519ΔT
        frameshift, recounted in PMID:42424595, found the opposite result (dominant-negative decrease
        rather than increase; see the `coexpression_canonical_wnt_gain_model` hypothesis in Autosomal_Dominant_Robinow_Syndrome_2),
        so this specific claim - what the heterozygous combination does to canonical signalling - is not
        settled. The disagreement is between two laboratories using different constructs and cell systems,
        not one group reversing its own result.
