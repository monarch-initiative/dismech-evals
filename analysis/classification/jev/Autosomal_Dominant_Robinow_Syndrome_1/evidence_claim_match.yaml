  f99d6304adc4dbc8fbd33969aaa880cf8d4616e93005a1146739b461fd2b39bb:
    claim:
      about:
        disease:
          name: Autosomal Dominant Robinow Syndrome 1
          disease_term:
            preferred_term: autosomal dominant Robinow syndrome 1
            term:
              id: MONDO:0024455
              label: autosomal dominant Robinow syndrome 1
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Omodysplasia
        description: A further gene in the WNT5A-ROR2-FZD2-DVL interactome, curated as its own entry rather
          than a Robinow subtype. Its dominant (OMOD2) form is caused by heterozygous variants in FZD2,
          the Wnt receptor that binds WNT5A itself, and produces a Robinow-like phenotype - shortened
          humeri, short first metacarpal, craniofacial dysmorphism, and genitourinary anomalies. The limb
          shortening is predominantly humeral rather than generalized mesomelic, which is the contrast
          against the WNT5A form; stature is not preserved in absolute terms - the molecularly confirmed
          FZD2 proband had rhizomelic short stature with elbow restriction - so this separates on the
          pattern of shortening rather than on height. FZD2 surfaced only from genomic studies of families
          left molecularly unsolved for ROR2, WNT5A, DVL1 and DVL3, since about 70% of autosomal-dominant
          Robinow syndrome cases are not explained by those four genes alone.
        disease_term:
          preferred_term: omodysplasia
          term:
            id: MONDO:0017136
            label: omodysplasia
        distinguishing_features:
        - Predominantly humeral shortening rather than generalized mesomelic shortening
        - Short first metacarpal
        - Elbow restriction from hypoplastic, dislocated proximal radii
        - Caused by heterozygous FZD2 variants, curated as a separate entry rather than a Robinow subtype
      selected_evidence:
        snippet: skeletal dysplasia characterized by shortened humeri, short first metacarpal, craniofacial
          dysmorphism (frontal bossing, depressed nasal bridge, bifid nasal tip, and long philtrum), and
          variable degrees of genitourinary anomalies
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
