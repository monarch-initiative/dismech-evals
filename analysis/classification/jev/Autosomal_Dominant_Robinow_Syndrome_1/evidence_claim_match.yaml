  22561b666b78c8cc569d990038cedfffcdd1d632f7e3bcd1333390b75fda7e11:
    claim:
      about:
        disease:
          name: Autosomal Dominant Robinow Syndrome 1
          disease_term:
            preferred_term: autosomal dominant Robinow syndrome 1
            term:
              id: MONDO:0024455
              label: autosomal dominant Robinow syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Non-Canonical WNT5A Signalling Through ROR2
        role: central_effector
        biological_scale: CELLULAR
        description: 'The WNT5A/ROR2 axis transmits a beta-catenin-independent signal through Disheveled
          to Rho-family GTPases and JNK. This is the planar-cell-polarity branch of Wnt signalling - it
          tells cells which way to face and which way to move, rather than whether to divide or what to
          become.

          The functional evidence for reduced signalling is developmental-assay based: the patient variants
          decreased WNT5A activity in zebrafish and Xenopus systems. That is the measurement available,
          and it is made in embryos of other species rather than in human tissue.'
        biological_processes:
        - preferred_term: non-canonical Wnt signaling pathway
          term:
            id: GO:0035567
            label: non-canonical Wnt signaling pathway
          modifier: DECREASED
        - preferred_term: Wnt signaling pathway, planar cell polarity pathway
          term:
            id: GO:0060071
            label: Wnt signaling pathway, planar cell polarity pathway
          modifier: DECREASED
      selected_evidence:
        snippet: This work suggests that a WNT5A/ROR2 signal transduction pathway is important in human
          craniofacial and skeletal development and that proper formation and growth of these structures
          is sensitive to variations in WNT5A function.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19918918
      reference_title: WNT5A mutations in patients with autosomal dominant Robinow syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' own framing of the pathway and of the dose sensitivity that makes a partial
        loss of function sufficient to cause disease.
