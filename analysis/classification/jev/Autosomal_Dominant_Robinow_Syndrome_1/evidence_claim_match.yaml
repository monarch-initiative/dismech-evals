  56aac9f927258000dd57e52fb4194458a1ecd9dfc9db320a024eb1e8f261ec87:
    claim:
      about:
        disease:
          name: Autosomal Dominant Robinow Syndrome 1
          disease_term:
            preferred_term: autosomal dominant Robinow syndrome 1
            term:
              id: MONDO:0024455
              label: autosomal dominant Robinow syndrome 1
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: DVL1-related autosomal dominant Robinow syndrome
        description: 'The osteosclerotic form. Same pathway, different lesion - a DVL1 adaptor whose frameshifted
          C-terminus interferes with the protein made from the normal allele, rather than a hypomorphic
          ligand. The direction of effect on each branch is contested: in facial mesenchyme assays the
          variant signals below wild type on both the canonical and the JNK-PCP branch, while co-expression
          of mutant and wild-type alleles raises canonical activity two-fold - a result a different group''s
          comparable assay contradicts, so the allele interaction the primary report ties to the osteosclerosis
          is not settled (see Autosomal_Dominant_Robinow_Syndrome_2 for the mechanistic detail). Either
          way the phenotype separates on features that are easy to check: normal stature, persistent macrocephaly,
          increased bone mineral density with skull osteosclerosis, and hearing loss. A patient with Robinow
          features and normal height is more likely DVL1 than WNT5A.'
        distinguishing_features:
        - Normal stature rather than short stature
        - Increased bone mineral density with skull osteosclerosis
        - Hearing loss
        - Persistent macrocephaly
