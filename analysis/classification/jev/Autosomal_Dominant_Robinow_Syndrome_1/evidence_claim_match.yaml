      assertion_type: DifferentialDiagnosis
      assertion:
        name: Omodysplasia
        description: FZD2-related omodysplasia/Robinow-spectrum disease overlaps substantially with WNT5A-related
          disease. Predominantly humeral shortening, a short first metacarpal and elbow restriction can
          be informative, but height and facial appearance do not reliably exclude either diagnosis. The
          2018 discovery cohort and 2022 phenotypic analysis support a shared spectrum; molecular testing
          is decisive.
        disease_term:
          preferred_term: omodysplasia
          term:
            id: MONDO:0017136
            label: omodysplasia
        distinguishing_features:
        - Predominantly humeral shortening rather than generalized mesomelic shortening
        - Short first metacarpal
        - Elbow restriction from hypoplastic, dislocated proximal radii
        - Heterozygous FZD2 variants; clinical overlap with the Robinow spectrum requires molecular differentiation
      selected_evidence:
        snippet: ∼70% of autosomal-dominant Robinow syndrome cases remain molecularly unsolved
        supports: SUPPORT
