          preferred_term: WNT5A
          term:
            id: hgnc:12784
            label: WNT5A
        notes: 'The secreted non-canonical Wnt ligand. Disease variants are missense and cluster on a
          modelled surface implicated in receptor or co-receptor engagement, which is consistent with
          altered protein-protein interaction rather than misfolding or failure of secretion - the protein
          is made and released, but signals poorly.

          Dose sensitivity is the reason a heterozygous partial loss of function suffices: the discovery
          study concluded that formation and growth of craniofacial and skeletal structures is sensitive
          to variation in WNT5A function.'
