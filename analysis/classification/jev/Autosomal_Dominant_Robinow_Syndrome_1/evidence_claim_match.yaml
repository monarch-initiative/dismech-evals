        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: DVL1-related autosomal dominant Robinow syndrome
        description: DVL1-related Robinow syndrome can include persistent macrocephaly, skull osteosclerosis
          and hearing loss, with low-normal stature in a subset. C-terminal frameshift variants alter
          the intracellular adaptor. Canonical co-expression assays have reported both increased and decreased
          activity; JNK-PCP readouts also depend on cellular and species context. These differences remain
          unresolved and do not establish the direction of WNT5A signaling.
        distinguishing_features:
        - Low-normal stature in a subset; short stature also occurs
        - Increased bone mineral density with skull osteosclerosis
        - Hearing loss
        - Persistent macrocephaly
        disease_term:
          preferred_term: autosomal dominant Robinow syndrome 2
          term:
            id: MONDO:0014591
            label: autosomal dominant Robinow syndrome 2
      selected_evidence:
        snippet: A variant of Robinow syndrome, associated with osteosclerosis and caused by a heterozygous
          pathogenic variant in DVL1, is characterized by normal stature, persistent macrocephaly, increased
          bone mineral density with skull osteosclerosis, and hearing loss
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25577943
      reference_title: Autosomal Dominant Robinow Syndrome.
      evidence_source: OTHER
      explanation: Osteosclerotic DVL1 subgroup described by GeneReviews; normal stature is not universal
        across DVL1-related disease.
      quote_role: REVIEW_SYNTHESIS
