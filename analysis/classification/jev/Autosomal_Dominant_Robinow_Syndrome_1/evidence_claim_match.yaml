    evidence_metadata:
      reference: PMID:10417975
      reference_title: 'Robinow syndrome with growth hormone deficiency: treatment with growth hormone.'
      evidence_source: HUMAN_CLINICAL
      explanation: INDIRECT on gene attribution. This 1999 series predates the 2010 WNT5A discovery by
        a decade, so the patients were diagnosed clinically and their genotype is unknown - they may carry
        DVL1, DVL3, or the recessive ROR2 form rather than WNT5A. It reports a growth-rate response to
        recombinant GH in Robinow syndrome; it does not establish that response for the WNT5A form specifically.
        This is the same caveat the prevalence record carries, and for the same reason.
