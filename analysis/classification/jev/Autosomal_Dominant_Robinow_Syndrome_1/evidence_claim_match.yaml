      assertion_type: Pathophysiology
      assertion:
        name: Loss of Planar Cell Polarity in Developing Tissues
        role: central_effector
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'Cells that should adopt a coordinated orientation within the plane of a tissue fail
          to do so. In growth-plate cartilage this is directly observable - chondrocytes that should stack
          into ordered columns are randomly oriented - and it is the most concrete cellular readout available
          for this disease.

          PROVISIONAL because the chondrocyte polarity evidence comes from experimental systems expressing
          a disease variant rather than from patient growth plates, and because the step from disordered
          chondrocyte columns to the specifically mesomelic pattern of limb shortening is inferred rather
          than demonstrated.'
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        locations:
        - preferred_term: cartilage tissue
          term:
            id: UBERON:0002418
            label: cartilage tissue
      selected_evidence:
        snippet: A non-canonical, β-catenin independent signal transduction pathway that controls cell
          polarity or movement has also been identified
        supports: SUPPORT
