          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: 'Partial loss of function rather than null: the functional assays show decreased
            activity, not abolished activity, and heterozygotes are affected while the corresponding mouse
            null is perinatally lethal with a more severe phenotype than any human patient.'
      selected_evidence:
        snippet: we show that two different missense mutations in WNT5A, which result in amino acid substitutions
          of highly conserved cysteines, are associated with autosomal dominant Robinow syndrome
        supports: SUPPORT
