            term:
              id: MONDO:0014591
              label: autosomal dominant Robinow syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Planar Cell Polarity in Developing Skeleton and Face
        role: central_effector
        biological_scale: TISSUE
        description: 'The shared endpoint of every Robinow genotype: loss of the polarized, directional
          cell behaviour that PCP signalling governs, in the growth plate, the frontonasal midline and
          the genital tubercle. The developmental decomposition — reduced presomitic mesoderm, perturbed
          chondrocyte differentiation, midline outgrowth failure, genital tubercle reduction — comes from
          the Ror2-null mouse and is inherited here by pathway membership rather than demonstrated for
          DVL1.'
        biological_processes:
        - preferred_term: Wnt signaling pathway, planar cell polarity pathway
          modifier: DECREASED
          term:
            id: GO:0060071
            label: Wnt signaling pathway, planar cell polarity pathway
        - preferred_term: chondrocyte differentiation
          modifier: DECREASED
          term:
            id: GO:0002062
            label: chondrocyte differentiation
      selected_evidence:
        snippet: Robinow syndrome (RS) is a genetically heterogeneous disorder with six genes that converge
          on the WNT/planar cell polarity (PCP) signaling pathway implicated (DVL1, DVL3, FZD2, NXN, ROR2,
          and WNT5A).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35047859
      reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome:
        WNT signaling perturbation and phenotypic variability.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that DVL1 disease shares a final common pathway with the other Robinow
        genes, which is what licenses the shared developmental model.
