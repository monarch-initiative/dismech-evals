      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: nuclear_mislocalization_transcription_model
        hypothesis_label: Neomorphic Nuclear Mislocalization Model
        status: EMERGING
        description: Nuclear enrichment of altered DVL1 could change transcription or interactions with
          transcription factors, contributing to developmental abnormalities. This is a proposed consequence
          of the cellular localization result; no causal transcriptional target or direct connection to
          cranial osteosclerosis has been established. The model can coexist with altered cytoplasmic
          signaling.
      selected_evidence:
        snippet: Further studies are needed to precisely determine whether nuclear DVL1 plays a transcriptional
          role in eliciting phenotypes in RS.
        supports: SUPPORT
