      assertion_type: Pathophysiology
      assertion:
        name: DVL1 Penultimate-Exon Frameshift Escaping Nonsense-Mediated Decay
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: DVL1
          term:
            id: hgnc:3084
            label: DVL1
        genetic_context:
          gene:
            preferred_term: DVL1
            term:
              id: hgnc:3084
              label: DVL1
          allele_type: penultimate-exon -1 frameshift escaping nonsense-mediated decay
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          notes: DOMINANT_NEGATIVE is a mechanistic reading of an NMD-escaping altered-C-terminus allele
            expressed alongside wild type. The 2026 functional work supports a mixed picture — reduced
            signalling shared with a plain truncation, plus a nuclear mislocalization unique to the frameshift
            — which no single enum value captures cleanly. See the ``dvl1_frameshift_mode_of_action``
            discussion.
        description: The variants are confined to the penultimate exon, so the premature termination codon
          falls in the last exon and the transcript escapes nonsense-mediated decay. Both wild-type and
          variant transcripts are detectable in patient leukocytes, so the altered protein is genuinely
          made.
      selected_evidence:
        snippet: All variant alleles are predicted to result in a premature termination codon within the
          last exon, escape nonsense-mediated decay (NMD), and most likely generate a C-terminally truncated
          protein with a distinct -1 reading-frame terminus.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
