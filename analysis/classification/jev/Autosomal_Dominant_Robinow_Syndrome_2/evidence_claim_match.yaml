      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing
        description: Typical findings warrant molecular testing to identify a heterozygous pathogenic
          or likely pathogenic DVL1 variant with an appropriate terminal-sequence effect. A variant of
          uncertain significance neither establishes nor excludes the diagnosis. Testing should cover
          relevant coding and splice regions and detect small indels, rather than assume every truncating
          allele is causal. A Robinow/skeletal-dysplasia panel or exome/genome analysis can assess overlapping
          dominant and recessive etiologies, with laboratory-specific gene content and coverage.
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: The diagnosis of autosomal dominant Robinow syndrome is established in a proband with
          typical suggestive findings and/or by the identification of a heterozygous pathogenic variant
          in DVL1, DVL3, or WNT5A through molecular genetic testing.
        supports: SUPPORT
