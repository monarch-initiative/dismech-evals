        context: []
      assertion_type: Genetic
      assertion:
        name: DVL1
        gene_term:
          preferred_term: DVL1
          term:
            id: hgnc:3084
            label: DVL1
        relationship_type: CAUSATIVE
        notes: Pathogenic DVL1 alleles characteristically alter the terminal reading frame and C-terminal
          sequence. The discovery series found penultimate-exon minus-one frameshifts; a 2022 report additionally
          classified c.1640-1C>T as likely pathogenic, with a cryptic acceptor and the same minus-one
          frame predicted computationally. The splice effect was not demonstrated in patient RNA. Neither
          an arbitrary DVL1 truncation nor every variant near the gene end establishes this diagnosis.
      selected_evidence:
        snippet: In total, six distinct frameshift mutations were found in eight subjects, and all were
          heterozygous truncating variants within the penultimate exon of DVL1.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25817016
      reference_title: DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant
        Robinow syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Discovery cohort establishes the initial coding-frameshift series; it does not exclude
        later splice-associated alleles.
