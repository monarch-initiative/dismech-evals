      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: coexpression_canonical_wnt_gain_model
        hypothesis_label: Dominant-Increase Canonical Wnt Co-Expression Model
        status: ALTERNATIVE
        description: The 2015 C2C12 assay found increased canonical WNT reporter output when mutant and
          wild-type DVL1 were co-expressed. This could contribute to osteosclerosis, but the human bone
          link is untested. The 2023 HEK293 co-expression experiment instead found reduced output. Cell
          type, expression dose and experimental design differ, so neither assay is a universal physiological
          heterozygous state and the results remain unreconciled. Nuclear effects are not excluded by
          this model.
      selected_evidence:
        snippet: When plasmids expressing the variants were added in equimolar concentration with the
          wtDVL1 plasmid, all three had significant dominant-negative effects on wtDVL1
        supports: REFUTE
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
