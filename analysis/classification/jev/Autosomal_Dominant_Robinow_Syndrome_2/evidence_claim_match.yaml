          name: Autosomal Dominant Robinow Syndrome 2
          disease_term:
            preferred_term: autosomal dominant Robinow syndrome 2
            term:
              id: MONDO:0014591
              label: autosomal dominant Robinow syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nuclear Mislocalization of Altered Dishevelled
        role: central_effector
        biological_scale: CELLULAR
        description: Dishevelled is a cytoplasmic signal transducer. The protein made from the frameshift
          allele is found in the nucleus instead, while both wild-type DVL1 and the stop-codon construct
          stay cytoplasmic. In Drosophila, only the frameshift allele perturbs morphogenesis and signalling.
          This is the component of the allele's effect that a simple loss of the C-terminus does not reproduce,
          and the authors raise altered nuclear transcription as the candidate consequence.
      selected_evidence:
        snippet: We also determined that there is mislocalization of the protein expressed from DVL11519ΔT
          in the nucleus while the other two constructs were expressed in the cytoplasm.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42424595
      reference_title: The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes.
      evidence_source: IN_VITRO
      explanation: Establishes that the mislocalization is specific to the frameshift product.
