        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: coexpression_canonical_wnt_gain_model
        hypothesis_label: Dominant-Increase Canonical Wnt Co-Expression Model
        status: ALTERNATIVE
        description: 'An earlier, distinct proposal for the same osteosclerosis: rather than a gained
          nuclear property, a DVL1 frameshift allele co-expressed with the wild-type allele — the physiological
          heterozygous state — raises canonical Wnt signalling above wild-type alone, and it is this elevation,
          not a transcriptional effect of nuclear mislocalization, that drives excess bone formation.
          Both models agree the mutant protein signals less than wild type when tested alone; they disagree
          on what the co-expressed, patient-relevant combination does, and the two have not been reconciled
          against each other''s specific variant or assay. No causal edge opts into this group: that is
          deliberate, not an oversight. The pathograph follows the nuclear-mislocalization model, and
          asserting a co-expression-gain edge would commit the entry to a mechanism the contradicting
          assay leaves unsettled. The group is recorded so the competing model is queryable without being
          modelled.'
      selected_evidence:
        snippet: However, when the mutant and wild-type alleles were co-expressed, canonical Wnt activity
          was 2-fold higher than that in the wild-type construct alone.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
