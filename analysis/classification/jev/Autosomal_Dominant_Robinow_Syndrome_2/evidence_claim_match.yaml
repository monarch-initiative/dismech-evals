      reference_title: The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes.
      evidence_source: IN_VITRO
      explanation: A different group's co-expression assay of a DVL1 frameshift allele found the opposite
        result — a dominant-negative decrease, not an increase, in canonical signalling — leaving this
        model's central claim unconfirmed for the variant studied here. Note the quoted sentence is PMID:42424595
        (Tophkhane, Verheyen, Richman) recounting an experiment from its own earlier paper, cited there
        as reference [9], rather than reporting a new assay; that earlier paper is not identifiable from
        the cached record, so this is a secondary citation. The two results come from separate laboratories
        using different constructs and cell systems, so this is two groups disagreeing, not one group
        reversing itself.
