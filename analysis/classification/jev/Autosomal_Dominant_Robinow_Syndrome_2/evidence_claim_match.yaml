          position both signal significantly less. The loss-of-signalling component is therefore attributable
          to the missing wild-type C-terminus and is shared with an ordinary truncation.
        biological_processes:
        - preferred_term: non-canonical Wnt signaling pathway
          modifier: DECREASED
          term:
            id: GO:0035567
            label: non-canonical Wnt signaling pathway
        - preferred_term: Wnt signaling pathway, planar cell polarity pathway
          modifier: DECREASED
          term:
            id: GO:0060071
            label: Wnt signaling pathway, planar cell polarity pathway
      selected_evidence:
        snippet: In luciferase assays carried out in facial mesenchyme, wtDVL1 activated canonical and
          JNK-PCP WNT signalling whereas the DVL11519* and the DVL11519ΔT variant had significantly lower
          signaling activity.
        supports: SUPPORT
