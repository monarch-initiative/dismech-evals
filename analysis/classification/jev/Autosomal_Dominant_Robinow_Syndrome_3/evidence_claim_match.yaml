      assertion_type: Genetic
      assertion:
        name: DVL3
        gene_term:
          preferred_term: DVL3
          term:
            id: hgnc:3087
            label: DVL3
        relationship_type: CAUSATIVE
        notes: DVL3 encodes a Dishevelled paralog. Disease-associated variants include selected one-base
          and four-base coding deletions in the final exons and splice-acceptor substitutions/deletions
          that converge on the terminal minus-one frame. Patient RNA confirmed a four-nucleotide exon-15
          deletion for c.1715-2A>C, whereas other splice effects remain predicted. De novo cases and familial
          clinical observations occur; the population de novo fraction and penetrance are not established.
          A variant requires appropriate classification and sequence-context interpretation rather than
          gene membership alone.
      selected_evidence:
        snippet: including two splice acceptor mutations and three 1 bp deletions.
        supports: SUPPORT
