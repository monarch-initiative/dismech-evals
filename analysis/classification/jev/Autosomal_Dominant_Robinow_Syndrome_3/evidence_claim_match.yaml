        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic and reproductive counseling
        description: Each child of an affected heterozygote has a 50% chance of inheriting the variant;
          severity cannot be predicted reliably. Offer family-specific counseling, parental assessment/testing
          and prenatal or preimplantation testing once the familial pathogenic variant is identified.
          The overall de novo fraction is unknown. If the variant is absent from both parents' blood,
          sibling recurrence remains low but nonzero because germline mosaicism cannot be excluded; GeneReviews
          quotes less than 1% for this circumstance across ADRS.
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        action_category: COUNSELING_INFORMATIONAL
      selected_evidence:
        snippet: Once the DVL1, DVL3, or WNT5A pathogenic variant has been identified in an affected family
          member, prenatal and preimplantation genetic testing are possible.
        supports: SUPPORT
