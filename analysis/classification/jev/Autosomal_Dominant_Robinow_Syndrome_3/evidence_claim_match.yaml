        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dvl3_frameshift_mode_of_action
        kind: KNOWLEDGE_GAP
        prompt: Which effects of the altered DVL3 C terminus account for developmental abnormalities,
          especially the cardiac phenotype?
        attaches_to:
        - pathophysiology#Abnormal Dishevelled-mediated WNT transduction
        - pathophysiology#Cardiac morphogenetic disruption
        rationale: Terminal phosphorylation, polymerization and receptor interactions are plausible mechanisms,
          but the cited DVL3 patient studies measure RNA and clinical findings rather than these functional
          outcomes. DVL1 canonical reporter direction depends on cell system and expression context, and
          its nuclear enrichment is observed in HEK cells but not fly follicle cells. No equivalent DVL3
          variant-versus-stop experiment in the reviewed sources resolves a universal gain or loss. Dvl3-null
          mouse heart defects support a developmental role without proving the effect of human terminal
          alleles. The comparison uses the DVL1 studies PMID:36916233 and PMID:42424595; their constructs
          and model-specific outcomes are not DVL3 functional measurements.
      selected_evidence:
        snippet: Further work is necessary to elucidate the mechanism by which these speciﬁc mutations
          in DVL1 and DVL3 result in DRS and their interactions within the global Wnt signalosome.
        supports: SUPPORT
