  7609e613ceb941200df7f5873c95f187c0bf113b742c007735fa0032a6d77367:
    claim:
      about:
        disease:
          name: Autosomal Dominant Sensory Ataxia 1
          disease_term:
            preferred_term: autosomal dominant sensory ataxia 1
            term:
              id: MONDO:0012166
              label: autosomal dominant sensory ataxia 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: adsa_selective_vulnerability_of_dorsal_root_ganglion_neurons
        prompt: Why does a ubiquitously expressed ER ubiquitin ligase, when mutated, damage large dorsal
          root ganglion sensory neurons and the posterior columns specifically, while sparing the cerebellum
          and cortex?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Dysregulated ER Calcium Release in Sensory Neurons
        - pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy
        rationale: 'RNF170 is broadly expressed and the erlin1/2-RNF170-IP3 receptor module operates in
          all cells, yet the human disease is remarkably restricted. The only mechanistic hint is regional:
          in Rnf170-null mice Itpr1 protein accumulates in cerebellum and spinal cord but not cerebral
          cortex, showing that the consequences of losing this pathway are already region-dependent at
          the biochemical level. That does not explain why large sensory neurons in the dorsal root ganglia
          are the cells that die in humans, and it sits awkwardly with the clinical sparing of the cerebellum.
          Nor does it explain why the closely related recessive disease targets upper motor neurons instead.
          No neuropathological study of dorsal root ganglia in ADSA has been reported, so the ganglionopathy
          is inferred entirely from electrophysiology and imaging, and selective vulnerability is the
          central unexplained feature of the disorder.'
        proposed_experiments:
        - experiment_id: exp_adsa_cell_type_pathway_comparison
          name: Cross-cell-type comparison of the erlin1/2-RNF170-IP3 receptor module
          description: Compare RNF170, ERLIN1/2 and ITPR1 expression levels and IP3-receptor turnover
            kinetics across dorsal root ganglion sensory neurons, corticospinal motor neurons and cerebellar
            Purkinje cells, to test whether pathway dependency tracks the disease-vulnerable cell type.
          would_support:
          - pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy
        - experiment_id: exp_adsa_ipsc_sensory_neuron_calcium
          name: Calcium handling in patient-derived iPSC sensory neurons
          description: Measure agonist-evoked ER calcium release in patient-derived iPSC sensory neurons
            carrying p.Arg199Cys alongside isogenic controls and RNF170-null lines, to test whether the
            sensory-neuron lineage is disproportionately sensitive.
          would_support:
          - pathophysiology#Dysregulated ER Calcium Release in Sensory Neurons
        - experiment_id: exp_adsa_human_drg_neuropathology
          name: Neuropathological examination of ADSA dorsal root ganglia
          description: Perform neuropathological examination of dorsal root ganglia and spinal cord from
            an affected individual. No such study has been reported, so the ganglionopathy is currently
            inferred entirely from electrophysiology and imaging.
          would_support:
          - pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy
      selected_evidence:
        snippet: Protein blot analysis revealed that the amount of Itpr1 protein was significantly elevated
          in the cerebellum and spinal cord but intact in the cerebral cortex in Rnf170(-/-) mice.
        supports: SUPPORT
