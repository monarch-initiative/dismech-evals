            term:
              id: MONDO:0012166
              label: autosomal dominant sensory ataxia 1
        context: []
      assertion_type: Phenotype
      assertion:
        category: Neurologic
        name: Pseudoathetosis
        description: 'Slow, writhing, involuntary drift of the outstretched unmonitored limbs, seen in
          the arms of affected patients. Despite the name it is not athetosis: it is a deafferentation
          sign caused by loss of proprioceptive feedback rather than by basal-ganglia dysfunction, and
          it disappears under visual guidance. It is curated because it is direct clinical evidence of
          the prominent UPPER-limb involvement that makes this a non-length-dependent ganglionopathy,
          which is the basis for the deliberate non-conformance recorded in note (4).'
        phenotype_term:
          preferred_term: Pseudoathetosis
        notes: Deliberately left without an ontology `term:` binding. HPO has no term for pseudoathetosis.
          The term suggested in review, HP:0011443, resolves to "Abnormality of coordination" - a very
          high-level parent that would be far broader than, and would not convey, this specific deafferentation
          sign, and HP:0002305 Athetosis would be positively misleading because pseudoathetosis is mechanistically
          distinct from athetosis. Per the CLAUDE.md guidance that `preferred_term` may stand alone when
          no suitable ontology term exists, the free-text preferred term is used rather than a misleading
          binding.
      selected_evidence:
        snippet: Pseudo-athetotic arm movements could also be observed.
        supports: SUPPORT
