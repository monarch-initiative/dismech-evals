      assertion:
        hypothesis_group_id: non_ip3r_substrate_dysregulation
        hypothesis_label: Non-IP3-Receptor Substrate Dysregulation Model
        status: EMERGING
        description: 'Patient lymphoblasts show a genuine functional defect in agonist-evoked Ca2+ mobilisation,
          yet this defect cannot be attributed to aberrant IP3 receptor ubiquitination: mutant RNF170
          attaches the full normal complement of ubiquitin conjugates to activated IP3 receptors, and
          receptor levels, store content and IP3 production are all unchanged. The authors of that work
          therefore proposed that the pathogenic consequence lies with other, still unidentified RNF170
          substrates, or is an adaptive response to chronically reduced RNF170. Under this model the IP3
          receptor is a marker of the pathway rather than the critical substrate, and identifying the
          true substrate is the central open problem.'
      selected_evidence:
        snippet: Rather, the defect likely reflects abnormal ubiquitination of other substrates, or adaptation
          to the chronic reduction in RNF170 levels.
        supports: SUPPORT
