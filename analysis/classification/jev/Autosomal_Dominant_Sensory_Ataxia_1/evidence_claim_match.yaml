        description: 'A minor and inconstant arm of the disease. Some affected individuals show corticospinal
          signs (spasticity, hyperreflexia, extensor plantar responses) alongside the dominant sensory
          picture, while others have none and Babinski is explicitly absent. This node is deliberately
          kept small and PROVISIONAL: the entire human evidence base is a single "variable findings" clause,
          and no imaging or neuropathological demonstration of corticospinal degeneration in ADSA exists.
          It is modelled rather than omitted because it is the point of clinical contact with the recessive
          RNF170 disease (SPG85), in which upper-motor-neuron involvement is the primary lesion, and because
          it is what the curated Pyramidal Signs phenotype rests on.'
        locations:
