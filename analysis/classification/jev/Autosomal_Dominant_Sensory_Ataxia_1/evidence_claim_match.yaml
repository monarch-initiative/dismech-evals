        context: []
      assertion_type: Genetic
      assertion:
        name: RNF170
        gene_term:
          preferred_term: RNF170
          term:
            id: hgnc:25358
            label: RNF170
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: RNF170 encodes an endoplasmic reticulum membrane RING-finger E3 ubiquitin ligase with three
          predicted membrane-spanning helices. The ADSA locus was originally mapped to chromosome 8p12-8q12
          in the two Maritime Canadian families before the gene was identified by direct sequencing of
          the shared haplotype interval. Only one RNF170 allele, the missense p.Arg199Cys, has ever been
          associated with sensory ataxia; all other reported pathogenic RNF170 alleles are biallelic loss-of-function
          variants causing a different disease (autosomal recessive spastic paraplegia 85). A different
          RNF170 variant found in a patient with sensory ataxia should therefore not be assumed causal
          by analogy.
      selected_evidence:
        snippet: We have identified a putative pathogenic mutation in the gene encoding ring-finger protein
          RNF170, a potential ubiquitin ligase.
        supports: SUPPORT
    origin:
