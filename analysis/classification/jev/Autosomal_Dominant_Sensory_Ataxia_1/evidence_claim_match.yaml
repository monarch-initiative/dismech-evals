              label: autosomal dominant sensory ataxia 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dorsal Root Ganglion Sensory Neuronopathy
        biological_scale: CELLULAR
        conforms_to: peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells
        description: 'Degeneration of large sensory neurons whose cell bodies lie in the dorsal root ganglia
          and whose centrally projecting branches form the posterior columns. That the insult originates
          at the cell body (a neuronopathy or ganglionopathy) rather than at the distal axon is an inference,
          drawn from combined electrophysiology and imaging and best evidenced in the Ecuadorian kindred,
          where both the central and the peripheral branch degenerate; that non-length-dependent pattern
          explains prominent upper- as well as lower-limb sensory involvement in that family. The inference
          must not be generalized to every ADSA1 kindred: the original Canadian families had normal sensory
          nerve conduction despite posterior-column disease, so the peripheral branch is not always involved.
          The node is marked PROVISIONAL for that reason. It is not frequency-banded, because it is the
          sole modelled route to the universal defining lesion; the genuinely variable peripheral arm
          is banded separately on "Peripheral Sensory Axon Degeneration".'
        cell_types:
        - preferred_term: sensory neuron of dorsal root ganglion
          term:
            id: CL:1001451
            label: sensory neuron of dorsal root ganglion
        locations:
        - preferred_term: dorsal root ganglion
          term:
            id: UBERON:0000044
            label: dorsal root ganglion
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: This finding, together with the MRI evidence of degeneration of posterior column, point
          to a primary involvement of sensory dorsal root ganglia, leading to degeneration of both central
          and peripheral branches of sensory neurons.
        supports: SUPPORT
