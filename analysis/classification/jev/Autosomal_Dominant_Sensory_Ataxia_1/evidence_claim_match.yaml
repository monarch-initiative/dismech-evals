      assertion_type: DifferentialDiagnosis
      assertion:
        name: CANVAS (RFC1-related cerebellar ataxia, neuropathy, vestibular areflexia syndrome)
        description: The most important differential. Both cause a late-onset sensory ganglionopathy with
          vestibular impairment. CANVAS is autosomal recessive, caused by a biallelic RFC1 AAGGG repeat
          expansion, and characteristically has cerebellar involvement, chronic cough and retained or
          brisk reflexes. ADSA is dominant, has no cerebellar involvement and no cough, and reflexes are
          reduced or absent; vestibular areflexia appears only in advanced disease.
        distinguishing_features:
        - Autosomal dominant inheritance in ADSA versus autosomal recessive in CANVAS
        - Absent cerebellar involvement and normal cerebellar imaging in ADSA
        - Absence of the chronic cough that is characteristic of CANVAS
        - Reduced or absent reflexes in ADSA versus retained or brisk reflexes in CANVAS
        - Vestibular areflexia only in advanced ADSA, whereas it is a defining early feature of CANVAS
      selected_evidence:
        snippet: As opposed to autosomal recessive RFC1 CANVAS, cerebellar involvement, cough and retained/brisk
          reflexes are absent RNF170 related syndrome, mode of inheritance is autosomal dominant, and
          the vestibular areflexia may be observed only in more advanced disease stages.
        supports: SUPPORT
