      assertion_type: AnimalModel
      assertion:
        species: Mouse
        genotype: Rnf170 knockout (Rnf170-/-)
        category: Knockout
        description: Constitutive Rnf170 knockout mice develop age-dependent gait abnormalities from about
          12 months, with asynchronous stepping between diagonal limb pairs and a fixed step sequence,
          together with reduced proprioceptive and thermal nociceptive sensitivity, and accumulate Itpr1
          protein in cerebellum and spinal cord but not cerebral cortex. The model therefore reproduces
          ADSA-like sensory and gait phenotypes and demonstrates regionally selective IP3 receptor dysregulation.
          Its relationship to the human dominant disease is nonetheless problematic — see the HUMAN_MODEL_MISMATCH
          discussion — because it models complete loss of function, a state that in humans is either clinically
          silent (heterozygous carriers) or causes spastic paraplegia (biallelic).
        genes:
        - preferred_term: RNF170
          term:
            id: hgnc:25358
            label: RNF170
        associated_phenotypes:
        - Impaired proprioception
        - Progressive gait ataxia
        - Reduced thermal nociception
      selected_evidence:
        snippet: Remarkably, Rnf170(-/-) mice began to develop gait abnormalities in old age (12 months)
          in the form of asynchronous stepping between diagonal limb pairs with a fixed step sequence
          during locomotion, while age-matched wild-type mice showed stable gait patterns using several
          step sequence repertoires.
        supports: SUPPORT
