      assertion:
        hypothesis_group_id: rnf170_haploinsufficiency
        hypothesis_label: RNF170 Haploinsufficiency Model
        status: ALTERNATIVE
        description: 'The straightforward reading of the biochemistry: p.Arg199Cys destabilises RNF170,
          lowering its steady-state level, and reduced RNF170 dosage impairs IP3 receptor ERAD in vulnerable
          sensory neurons. It is retained here because the loss-of-expression biochemistry is solid in
          patient-derived cells and because Rnf170-null mice reproduce proprioceptive and gait deficits.
          It is nevertheless disfavoured as the primary disease mechanism: heterozygous carriers of RNF170
          nonsense alleles, who are unambiguously haploinsufficient, are clinically unaffected, and their
          biallelic relatives develop spastic paraplegia rather than sensory ataxia.'
      selected_evidence:
        snippet: Inhibited expression of mutant RNF170 was seen in cells expressing exogenous RNF170 constructs
          and in ADSA lymphoblasts, and appears to result from enhanced RNF170 autoubiquitination and
          proteasomal degradation.
        supports: SUPPORT
