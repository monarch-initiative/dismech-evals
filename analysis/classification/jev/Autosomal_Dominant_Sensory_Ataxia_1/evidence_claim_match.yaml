  6e86d22b641bb3710f2eae502b6fa054e32dc88d7488c1183d191aa06074c128:
    claim:
      about:
        disease:
          name: Autosomal Dominant Sensory Ataxia 1
          disease_term:
            preferred_term: autosomal dominant sensory ataxia 1
            term:
              id: MONDO:0012166
              label: autosomal dominant sensory ataxia 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: adsa_null_mouse_models_recessive_not_dominant_disease
        prompt: Does the Rnf170-null mouse model autosomal dominant sensory ataxia, or does it actually
          model the recessive RNF170 spastic paraplegia, given that human heterozygous RNF170 null carriers
          are unaffected?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#RNF170 Protein Destabilization by Enhanced Autoubiquitination
        - pathophysiology#Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD
        rationale: 'Evidence exists in the model but its translational validity is the open question,
          which is why this is a HUMAN_MODEL_MISMATCH rather than a plain knowledge gap. Rnf170-/- mice
          do develop ADSA-like proprioceptive loss and age-dependent gait abnormality, which is superficially
          strong support for a loss-of-function mechanism. But the human genetics point the other way:
          heterozygous carriers of RNF170 nonsense alleles are clinically unaffected, and individuals
          homozygous for such alleles develop hereditary spastic paraplegia with upper-motor-neuron involvement
          rather than sensory ataxia. A complete-null mouse therefore corresponds genotypically to the
          recessive human disease, not to the heterozygous missense state that causes ADSA. The naturally
          occurring canine RNF170 frameshift model has the same problem: it segregates recessively and
          its authors propose it as a model of SPG85. Consequently the null-mouse phenotype cannot be
          used as evidence that ADSA is caused by loss of RNF170 function, and the concordance of its
          sensory phenotype with ADSA may reflect convergence on a shared vulnerable pathway rather than
          mechanistic identity. A further internal inconsistency: the null mouse accumulates Itpr1 most
          in cerebellum and spinal cord, yet the cerebellum is precisely the structure spared in the human
          disease. No p.Arg199Cys knock-in animal exists, so the dominant allele has never been modelled
          in its native heterozygous state.'
        proposed_experiments:
        - experiment_id: exp_adsa_r199c_knockin_mouse
          name: Heterozygous Rnf170 p.Arg199Cys knock-in mouse versus null littermates
          description: Generate a knock-in mouse carrying the orthologous Rnf170 p.Arg199Cys allele and
            phenotype it in the heterozygous state alongside heterozygous and homozygous null littermates,
            scoring dorsal root ganglion neuronopathy, posterior column degeneration, proprioception and
            gait. If the heterozygous knock-in is affected while the heterozygous null is not, the allele
            acts by a mechanism other than haploinsufficiency.
          would_support:
          - pathophysiology#RNF170 Protein Destabilization by Enhanced Autoubiquitination
        - experiment_id: exp_adsa_dominant_negative_complex_assay
          name: Test for dominant-negative poisoning of the erlin1/2-RNF170 complex
          description: Determine whether mutant RNF170 co-assembles with the erlin1/2 complex and impairs
            wild-type RNF170 function in a heterozygous setting, which would distinguish a dominant-negative
            from a purely toxic misfolding mechanism.
          would_support:
          - pathophysiology#Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD
        - experiment_id: exp_adsa_drg_specific_phenotyping
          name: Dorsal-root-ganglion-specific phenotyping in null and knock-in animals
          description: Phenotype dorsal root ganglion neurons specifically, rather than whole cerebellum
            or cord homogenates, in both null and knock-in animals, since the human lesion is a ganglionopathy
            and bulk-tissue readouts may have obscured the relevant cell population.
          would_support:
          - pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy
      selected_evidence:
        snippet: RNF170 variants were previously identified in human patients with autosomal recessive
          spastic paraplegia-85 (SPG85); this clinical phenotype shows similarities to the dogs described
          herein.
        supports: SUPPORT
