          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        genes:
        - preferred_term: RNF170
          term:
            id: hgnc:25358
            label: RNF170
        - preferred_term: ITPR1
          term:
            id: hgnc:6180
