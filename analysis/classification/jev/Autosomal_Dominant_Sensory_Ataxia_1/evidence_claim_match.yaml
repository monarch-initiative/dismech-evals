        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular confirmation of RNF170 p.Arg199Cys
        description: Diagnosis rests on identifying the heterozygous RNF170 c.595C>T p.Arg199Cys variant,
          in practice by exome or targeted panel sequencing, in a patient with an adult-onset predominantly
          sensory ataxia. Because p.Arg199Cys is the only RNF170 allele reported in sensory ataxia, a
          different RNF170 variant in this clinical setting should not be assumed causal. In a patient
          with sensory ataxia plus vestibular areflexia, RFC1 expansion testing is usually performed first;
          RNF170 should be tested when RFC1 is negative, particularly if the family history is dominant.
      selected_evidence:
        snippet: Therefore, we recommend considering RNF170 in the diagnostic work-up of patients affected
          by sensory ataxic neuropathies and RFC1 negative CANVAS-like patients, particularly if there
          is a dominant family history.
        supports: SUPPORT
