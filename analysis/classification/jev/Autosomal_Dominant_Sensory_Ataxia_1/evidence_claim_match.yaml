  568cabb49384246e14aa5fb8e4245f83f3ae7e169fc199fa688633be33f9e924:
    claim:
      about:
        disease:
          name: Autosomal Dominant Sensory Ataxia 1
          disease_term:
            preferred_term: autosomal dominant sensory ataxia 1
            term:
              id: MONDO:0012166
              label: autosomal dominant sensory ataxia 1
        context: []
      assertion_type: Variant
      assertion:
        name: RNF170 c.595C>T p.Arg199Cys
        gene:
          preferred_term: RNF170
          term:
            id: hgnc:25358
            label: RNF170
        description: The single recurrent ADSA allele. A rare non-synonymous substitution at a well-conserved
          residue, predicted deleterious by multiple in silico tools. Found on a shared founder haplotype
          in the two Maritime Canadian families and independently in a Belgian and an Ecuadorian family,
          showing it is not confined to the founder population. Arg199 is a charged residue in a transmembrane
          region, and functional work shows that ionic interactions between charged transmembrane residues
          are what maintain RNF170 stability, so the arginine-to-cysteine change destabilises the protein
          rather than abolishing its catalytic activity.
        clinical_significance: PATHOGENIC
        type: missense variant
        functional_effects:
        - function: RNF170 protein stability
          description: Reduced steady-state RNF170 protein level through enhanced autoubiquitination and
            proteasomal degradation, demonstrated both in transfected cells and in ADSA patient lymphoblasts.
        - function: IP3 receptor-mediated cytosolic calcium mobilisation
          description: Impaired agonist-evoked (platelet-activating-factor-stimulated) calcium mobilisation
            in patient lymphoblasts, with normal store content, receptor level and IP3 production.
        - function: ubiquitin ligase activity toward IP3 receptors
          description: Preserved rather than abolished. Mutant RNF170 attaches the full normal complement
            of mono-, K48- and K63-linked ubiquitin conjugates to activated IP3 receptors, so the calcium
            defect is not explained by defective IP3 receptor ubiquitination.
        - function: dominant developmental toxicity in zebrafish
          description: Dose-dependent dominant disruption of embryonic development on microinjection of
            mutant orthologous mRNA, the principal evidence for an allele-specific toxic property.
      selected_evidence:
        snippet: RNF170 is an endoplasmic reticulum membrane ubiquitin ligase that contributes to the
          ubiquitination of activated inositol 1,4,5-trisphosphate (IP3) receptors, and also, when point
          mutated (arginine to cysteine at position 199), causes autosomal dominant sensory ataxia (ADSA),
          a disease characterized by neurodegeneration in the posterior columns of the spinal cord.
        supports: SUPPORT
    origin:
      assertion_path: /variants/0
      evidence_path: /variants/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25882839
      reference_title: A Point Mutation in the Ubiquitin Ligase RNF170 That Causes Autosomal Dominant
        Sensory Ataxia Destabilizes the Protein and Impairs Inositol 1,4,5-Trisphosphate Receptor-mediated
        Ca2+ Signaling.
      evidence_source: IN_VITRO
      explanation: Names the exact variant and ties it to the posterior-column neurodegeneration phenotype.
