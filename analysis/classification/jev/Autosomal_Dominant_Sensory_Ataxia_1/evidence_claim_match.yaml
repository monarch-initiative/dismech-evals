  fa24f83633a743d0edcb38f7d52db6e2095b8cbae0da75127a9cd9bd25c01d85:
    claim:
      about:
        disease:
          name: Autosomal Dominant Sensory Ataxia 1
          disease_term:
            preferred_term: autosomal dominant sensory ataxia 1
            term:
              id: MONDO:0012166
              label: autosomal dominant sensory ataxia 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: adsa_true_pathogenic_substrate_of_rnf170
        prompt: If mutant RNF170 ubiquitinates IP3 receptors normally, what substrate actually mediates
          the calcium-signalling defect and the neurodegeneration?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD
        - pathophysiology#Dysregulated ER Calcium Release in Sensory Neurons
        rationale: The assumption that ADSA is a disease of IP3 receptor ERAD is inherited from RNF170's
          known biochemistry, not demonstrated in patient cells. In ADSA lymphoblasts the calcium defect
          is real, yet mutant RNF170 attaches the full normal set of ubiquitin conjugates to activated
          IP3 receptors, and receptor level, store content and IP3 production are unchanged. The original
          investigators therefore concluded that the defect reflects abnormal ubiquitination of other,
          unidentified substrates or an adaptive response to chronically low RNF170. Identifying the operative
          substrate would determine whether ADSA is genuinely an IP3-receptor-turnover disease or a distinct
          ER quality-control disease that merely shares a gene with one.
        proposed_experiments:
        - experiment_id: exp_adsa_ubiquitinome_profiling
          name: Comparative ubiquitinome profiling of ADSA patient cells
          description: Perform comparative ubiquitinome or diGly proteomics on ADSA patient cells and
            isogenic controls to identify substrates whose ubiquitination is altered by p.Arg199Cys.
