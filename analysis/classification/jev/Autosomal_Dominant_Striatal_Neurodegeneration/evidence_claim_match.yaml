  c0354c8782a3289798249ec8c621c315120f85f40c3850048e78b65f97e75b5d:
    claim:
      about:
        disease:
          name: Autosomal dominant striatal neurodegeneration
          disease_term:
            preferred_term: striatal degeneration, autosomal dominant
            term:
              id: MONDO:0000211
              label: striatal degeneration, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PDE8B Cyclic Nucleotide Phosphodiesterase Loss
        description: ADSN-associated heterozygous PDE8B frameshift or nonsense variants abolish or are
          predicted to abolish phosphodiesterase activity. PDE8B normally degrades cyclic AMP, a second
          messenger involved in dopamine signaling and movement control. Altered striatal cAMP/dopamine
          signaling is therefore a plausible bridge to disease, but it has not been demonstrated directly
          in patient-derived striatal neurons.
        genes:
        - preferred_term: PDE8B
          term:
            id: hgnc:8794
            label: PDE8B
        molecular_functions:
        - preferred_term: 3',5'-cyclic-nucleotide phosphodiesterase activity
          term:
            id: GO:0004114
            label: 3',5'-cyclic-nucleotide phosphodiesterase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: cAMP catabolic process
          term:
            id: GO:0006198
            label: cAMP catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: Here we show that ADSD is caused by a complex frameshift mutation (c.94G>C+c.95delT)
          in the phosphodiesterase 8B (PDE8B) gene, which results in a loss of enzymatic phosphodiesterase
          activity.
        supports: SUPPORT
