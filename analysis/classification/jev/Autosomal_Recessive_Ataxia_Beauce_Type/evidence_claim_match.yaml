      reference: PMID:17503513
      reference_title: Clinical and genetic study of autosomal recessive cerebellar ataxia type 1.
      evidence_source: HUMAN_CLINICAL
      explanation: The original ARCA1 study links SYNE1 to maintenance of cerebellar structure, supporting
        loss-of-function cerebellar degeneration.
