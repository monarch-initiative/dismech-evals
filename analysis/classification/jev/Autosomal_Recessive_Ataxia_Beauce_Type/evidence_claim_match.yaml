        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_syne1_loss_linc_model
        hypothesis_label: Canonical SYNE1/Nesprin-1 Loss-of-Function LINC Model
        status: CANONICAL
        description: The best-supported model is biallelic SYNE1 loss of function producing absent or
          truncated nesprin-1, impairing the LINC complex that couples the nucleus to the cytoskeleton.
          Because most disease-associated SYNE1 alleles are truncating, a loss-of-function mechanism is
          favored, with cerebellar neurons (particularly Purkinje cells) being especially vulnerable,
          leading to cerebellar degeneration.
      selected_evidence:
        snippet: The function of SYNE1 is thus critical in the maintenance of cerebellar structure in
          humans.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
