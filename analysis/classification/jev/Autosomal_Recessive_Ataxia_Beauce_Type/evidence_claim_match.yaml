              label: autosomal recessive ataxia, Beauce type
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cerebellar_synaptic_nesprin_isoform_model
        hypothesis_label: Cerebellar Synaptic Nesprin-1 Isoform Model
        status: EMERGING
        description: A cerebellum-enriched nesprin-1 isoform lacking the KASH domain localizes to synapses
          rather than the nuclear envelope, suggesting a synaptic, LINC-complex-independent contribution
          to cerebellar vulnerability. This extends rather than replaces the canonical nuclear-envelope
          loss-of-function model and remains to be causally established.
        notes: Classified as emerging because the synaptic-isoform mechanism rests on expression, splicing,
          and subcellular-localization data in mouse cerebellum rather than direct causal demonstration
          in SCAR8 patients. Note that this model relocates the primary lesion away from the Purkinje
          nuclear envelope and toward mossy-fibre/granule-cell synaptic compartments; the two models make
          different predictions about which cerebellar cell population is the proximal target.
      selected_evidence:
        snippet: We also identified a CNS-specific splicing event that leads to the abundant expression
          of a KASH-LESS variant of Nesprin1 giant (KLNes1g) in the cerebellum.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25843669
      reference_title: A variant of Nesprin1 giant devoid of KASH domain underlies the molecular etiology
        of autosomal recessive cerebellar ataxia type I.
      evidence_source: MODEL_ORGANISM
      explanation: Identifies the cerebellum-enriched KASH-less nesprin-1 isoform that this hypothesis
        is built on. Evidence source is MODEL_ORGANISM because the splicing, localization, and immunoprecipitation
        data are from mouse cerebellum.
