        hypothesis_label: GBA2 Loss and Glucosylceramide-Dysregulation Model
        status: CANONICAL
        description: Biallelic disease-associated GBA2 variants cause severe loss of nonlysosomal glucosylceramidase
          activity. Reduced hydrolysis of glucosylceramide raises glucosylceramide in patient material
          and establishes the primary biochemical lesion. This does not by itself establish which lipid
          species, membrane compartment, or neural cell population drives the clinical syndrome.
      selected_evidence:
        snippet: none of the GBA2 mutant cDNAs raised the enzyme activity in transfected cells, in contrast
          to the wild-type enzyme.
        supports: SUPPORT
