  084498d73874d0170d3e0984bb8c1e7c67970018845cd9dace05859aca732beb:
    claim:
      about:
        disease:
          name: Autosomal Recessive Congenital Ichthyosis
          disease_term:
            preferred_term: autosomal recessive congenital ichthyosis
            term:
              id: MONDO:0017265
              label: autosomal recessive congenital ichthyosis
        context: []
      assertion_type: Subtype
      assertion:
        name: Harlequin Ichthyosis
        display_name: Harlequin Ichthyosis
        subtype_term:
          preferred_term: harlequin ichthyosis
          term:
            id: MONDO:0009443
            label: autosomal recessive congenital ichthyosis 4B
        description: 'Severe ARCI phenotype, most often linked to ABCA12 loss-of-function, with profound
          neonatal hyperkeratosis and barrier compromise. The neonate is encased in thick plate-like armour
          separated by deep fissures, with ectropion, eclabium and flattened ears. It is no longer invariably
          fatal: with modern neonatal care, reported survival is around half, and deaths concentrate in
          the first three months from sepsis and respiratory failure - the direct consequences of a stratum
          corneum that cannot function as a barrier. Survivors carry a chronic severe scaling erythroderma.
          Genotype tracks outcome, with homozygous loss-of-function alleles reported in all deaths in
          the largest series and compound heterozygosity over-represented among survivors. The reported
          association between early oral retinoid treatment and survival in that series is deliberately
          not curated here as a treatment effect: it is a retrospective, questionnaire-based comparison
          with no randomisation and obvious scope for confounding by indication and by era of neonatal
          care, and the source itself claims only that early retinoids may improve survival.'
        subtype_frequency: 2.7% in a 74-patient Italian ARCI cohort
      selected_evidence:
        snippet: The most severe form of ARCI, harlequin ichthyosis, is caused by mutations in ABCA12.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/2
      evidence_path: /has_subtypes/2/evidence/0
      context_paths:
