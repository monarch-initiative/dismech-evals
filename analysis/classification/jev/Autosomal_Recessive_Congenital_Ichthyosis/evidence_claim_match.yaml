      assertion:
        name: Ultrastructural skin analysis
        description: Transmission electron microscopy can provide genotype-informative clues, including
          cholesterol clefts in TGM1-mutated disease and abnormal lamellar bodies in SDR9C7- or CERS3-associated
          disease.
        results: Genotype-informative ultrastructural features can support ARCI classification.
      selected_evidence:
        snippet: Ultrastructural data available for 56 patients showed a 100% specificity of cholesterol
          clefts for TGM1-mutated cases and revealed abnormal lamellar bodies in SDR9C7 and CERS3 patients.
        supports: SUPPORT
