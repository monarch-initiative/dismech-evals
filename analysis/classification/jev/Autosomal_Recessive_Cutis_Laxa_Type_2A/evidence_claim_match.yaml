      assertion_type: Phenotype
      assertion:
        category: Neurological
        name: Neurologic Regression
        frequency: VERY_FREQUENT
        description: 'Loss of previously acquired skills, in nearly all affected individuals.

          This matters out of proportion to its one line, because it cuts against the entry''s own framing
          elsewhere. The skin findings decrease with age, which makes the disease sound as though it attenuates;
          the neurology does the opposite. An adult ascertained with a phenotype "restricted to skin"
          is the attenuated end of the spectrum, not the same patient later - and a curator or clinician
          should not generalise the cutaneous trajectory to the brain.'
        phenotype_term:
          preferred_term: Developmental regression
          term:
            id: HP:0002376
            label: Developmental regression
          clinical_course: PROGRESSIVE
        notes: 'An earlier revision carried the GeneReviews sentence "The skin findings decrease with
          age..." as a second evidence item here, on the argument that the contrast with the skin is what
          makes the regression point. That was wrong: the sentence is about the skin and does not support
          a regression phenotype, whatever it illuminates. It now sits on the cutis laxa phenotype where
          it is evidence, and the contrast is made in this description instead - which is prose''s job,
          not an evidence item''s.'
      selected_evidence:
        snippet: Nearly all affected individuals have developmental delays, seizures, and neurologic regression.
        supports: SUPPORT
