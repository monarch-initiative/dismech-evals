  a77bab18aba6e28e6c0b6ff3e9981690da7658473b819ba8507e2c1843249220:
    claim:
      about:
        disease:
          name: Autosomal Recessive Cutis Laxa Type 2A
          disease_term:
            preferred_term: ATP6V0A2-related cutis laxa
            term:
              id: MONDO:0018163
              label: autosomal recessive cutis laxa type 2A
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: arcl2a_severity_axis_is_not_genotype
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a disease with a 78% null-allele spectrum show no genotype-phenotype correlation,
          and what variable is severity actually tracking?
        attaches_to:
        - genetic#ATP6V0A2
        - pathophysiology#Elevated Trans-Golgi Luminal pH
        rationale: 'The systematic review of 70 individuals found age at ascertainment to be the unique
          phenotypic discriminator and identified no genotype-phenotype correlation. That is an unusual
          negative result and it is easy to read as simply a failure of power, but the mouse data suggest
          a more interesting reading.

          In mice, phenotype severity correlates with trans-Golgi pH - 5.80 wild type, 6.25 in the transport-dead
          knock-in, 6.52 in the null - and the pH is what varies continuously. Genotype class is only
          a proxy for it, and a poor one: two null alleles can differ in residual transcript, in tissue-specific
          compensation by other V-ATPase a-subunit isoforms, and in developmental timing. If the disease
          variable is a continuous pH shift and the measured variable is a categorical allele class, a
          null correlation is what you would expect even with adequate power.

          Age at ascertainment is not an alternative explanation so much as a confounder that has not
          been separated from severity: severe patients present early by definition, so the association
          may be partly circular. Nobody has published a cohort with severity scored at a fixed age.

          The practical consequence is a counselling one. In this disease, variant class does not support
          a severity prediction, and the entry says so rather than quietly implying otherwise by curating
          a genotype-severity gradient it cannot evidence.'
        proposed_experiments:
        - experiment_id: exp_arcl2a_patient_fibroblast_golgi_ph
          name: Golgi pH in patient fibroblasts against phenotype severity
          description: Measure trans-Golgi luminal pH in dermal fibroblasts from a genotypically diverse
            ARCL2A cohort, using the same ratiometric method as the mouse work, and correlate it with
            a severity score assessed at a fixed age rather than at ascertainment. This tests directly
            whether the mouse's pH-severity relationship holds in patients and whether pH explains variance
            that genotype class does not.
          would_support:
          - pathophysiology#Elevated Trans-Golgi Luminal pH
          supporting_outcome:
          - Patient fibroblast Golgi pH correlates with age-adjusted severity where genotype class does
            not.
          would_refute:
          - pathophysiology#Elevated Trans-Golgi Luminal pH
          refuting_outcome:
          - Golgi pH is uniform across patients of markedly different severity, placing the severity variable
            elsewhere.
      selected_evidence:
        snippet: No specific genotype-phenotype correlations were identified.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
