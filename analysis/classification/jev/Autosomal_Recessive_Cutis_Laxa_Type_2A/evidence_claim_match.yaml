          recommendation. In a prospectively and uniformly examined cutis laxa cohort, reduced corrected
          visual acuity was found only in the ATP6V0A2 patients, and all four had corneal tomographic
          abnormalities - so corneal imaging, not just acuity, is the informative examination.'
