            term:
              id: MONDO:0018163
              label: autosomal recessive cutis laxa type 2A
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Elevated Trans-Golgi Luminal pH
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'The single physical abnormality from which the rest of the disease follows. Direct
          measurement in mouse models puts trans-Golgi pH at 5.80 in wild type, 6.25 in a knock-in that
          abolishes only V0a2-mediated proton transport, and 6.52 in the null - and phenotype severity
          tracks that gradient rather than tracking whether the protein is present.

          The knock-in is what makes this node an established mechanism rather than an inference. It carries
          an R755Q missense change that selectively removes proton transport while leaving the protein
          in place, so the pH shift can be attributed to the pumping activity and not to loss of some
          structural or membrane-fusion role of the subunit.'
        biological_processes:
        - preferred_term: Golgi lumen acidification
          modifier: DECREASED
          term:
            id: GO:0061795
            label: Golgi lumen acidification
        cellular_components:
        - preferred_term: trans-Golgi network
          term:
            id: GO:0005802
            label: trans-Golgi network
      selected_evidence:
        snippet: Measurement of the pH in the trans Golgi compartment revealed a shift from 5.80 in wildtype
          to 6.52 in Atp6v0a2-/- and 6.25 in Atp6v0a2RQ/RQ.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39680136
      reference_title: Golgi pH elevation due to loss of V-ATPase subunit V0a2 function correlates with
        tissue-specific glycosylation changes and globozoospermia.
      evidence_source: MODEL_ORGANISM
      explanation: The direct measurement, with the two mutant genotypes giving different pH values -
        which is what turns the pH into a graded variable rather than a binary defect.
