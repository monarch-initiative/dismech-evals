          term:
            id: UBERON:0002067
            label: dermis
      selected_evidence:
        snippet: Immunostaining of ARCL2 cells showed the accumulation of tropoelastin (TE) in the Golgi
          and in large, abnormal intracellular and extracellular aggregates.
