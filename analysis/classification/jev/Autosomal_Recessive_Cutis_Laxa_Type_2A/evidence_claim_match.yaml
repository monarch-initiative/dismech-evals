      assertion_type: Genetic
      assertion:
        name: ATP6V0A2
        gene_term:
          preferred_term: ATP6V0A2
          term:
            id: hgnc:18481
            label: ATP6V0A2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        features: ATP6V0A2 encodes the a2 subunit of the V-type H+-ATPase, the isoform that localises
          to the trans-Golgi membrane and acidifies the Golgi lumen. Most reported disease alleles are
          predicted null.
        notes: 'The genotype-phenotype expectation this disease sets up, and does not meet.

          With about 78% predicted-null alleles and a minority of missense, the obvious hypothesis is
          that residual protein function grades severity - and there is a single suggestive data point
          for it, the p.P87L missense allele reported with unusually mild disease. But the systematic
          review of 70 individuals looked for genotype-phenotype correlations and identified none. The
          only discriminator it found was age at ascertainment.

          That is worth stating plainly because it cuts against how a rare-disease report is usually written.
          A curator or clinician should not counsel severity from variant class in this disease, and should
          be sceptical of a case report that attributes a mild phenotype to a missense allele without
          a cohort behind it.

          Note also that the mouse data suggest what the human data would need in order to find the correlation:
          severity tracks trans-Golgi pH, which no clinical study measures. A genotype class is a poor
          proxy for a pH shift.'
      selected_evidence:
        snippet: No specific genotype-phenotype correlations were identified.
        supports: SUPPORT
