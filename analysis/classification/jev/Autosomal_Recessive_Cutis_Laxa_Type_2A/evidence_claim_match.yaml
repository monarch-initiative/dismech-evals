  e9b4ba63760232c3fa38d4bd2fd54a965360bc57a57b9559ced7f5f38fc19882:
    claim:
      about:
        disease:
          name: Autosomal Recessive Cutis Laxa Type 2A
          disease_term:
            preferred_term: ATP6V0A2-related cutis laxa
            term:
              id: MONDO:0018163
              label: autosomal recessive cutis laxa type 2A
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: arcl2a_globozoospermia_untested_in_humans
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do men with ARCL2A have globozoospermia and infertility, as both mouse models do?
        attaches_to:
        - pathophysiology#Combined N- and O-Glycosylation Defect
        rationale: 'Both the null and the knock-in mouse are male-infertile from globozoospermia, with
          impaired Golgi-derived acrosome formation and abolished mucin-type O-glycosylation in spermatids.
          The mechanism is the same one that produces the rest of the disease - the acrosome is a Golgi-derived
          organelle - so there is no obvious reason it would be mouse-specific.

          No corresponding human observation exists. The paper describes the finding as hitherto unrecognised,
          and the clinical literature on ARCL2A does not report fertility outcomes at all - which is unsurprising
          given that the severe phenotype presents in infancy, but conspicuous now that an attenuated
          adult phenotype is established and those men reach reproductive age.

          This is a HUMAN_MODEL_MISMATCH in the weaker of the two possible senses: not a model finding
          contradicted in humans, but a model finding never looked for in humans, where the mechanism
          predicts it should be present. It is curated because the actionable step is small - a semen
          analysis in an adult male patient - and because the absence of any human data is easy to mistake
          for absence of the phenotype.

          Nothing in this entry asserts that human patients are infertile, and a counselling conversation
          should not use this discussion as though it did.'
        proposed_experiments:
        - experiment_id: exp_arcl2a_semen_analysis
          name: Semen analysis in adult males with ATP6V0A2 variants
          description: Offer semen analysis with acrosome morphology assessment to adult men with biallelic
            ATP6V0A2 variants identified through the attenuated-phenotype route, and report the results
            whether positive or negative.
          would_support:
          - pathophysiology#Combined N- and O-Glycosylation Defect
          supporting_outcome:
          - Round-headed, acrosome-deficient spermatozoa in men with biallelic ATP6V0A2 variants, matching
            the mouse acrosome phenotype.
          would_refute:
          - pathophysiology#Combined N- and O-Glycosylation Defect
          refuting_outcome:
          - Normal sperm morphology and acrosome formation in affected men, making the mouse globozoospermia
            species-specific.
      selected_evidence:
        snippet: A hitherto unrecognized male infertility due to globozoospermia was evident in both mouse
          lines with impaired Golgi-derived acrosome formation and abolished mucin-type O-glycosylation
          in spermatids.
        supports: SUPPORT
