        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'Biallelic ATP6V0A2 variants, homozygous or compound heterozygous, ascertained largely
          through consanguineous families. About 78% of reported alleles are predicted null - nonsense,
          frameshift or canonical splice - with a minority of missense and non-canonical splice variants.

          Counselling numbers are the standard recessive ones: for a sib of an affected individual with
          two carrier parents, 25% affected, 50% asymptomatic carrier, 25% unaffected non-carrier. Once
          the family''s variants are known, carrier testing for at-risk relatives, prenatal testing and
          preimplantation genetic testing are all available.'
      selected_evidence:
        snippet: About 78.3% of known variants were predicted null alleles, while 11 were missense and
          2 affected noncanonical splice sites.
        supports: SUPPORT
