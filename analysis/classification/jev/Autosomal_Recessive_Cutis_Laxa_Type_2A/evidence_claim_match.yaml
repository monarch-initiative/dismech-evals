        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other autosomal recessive cutis laxa syndromes
        description: ARCL is genetically heterogeneous - PYCR1, ALDH18A1, GORAB, RIN2, LTBP4, FBLN5 and
          ELN all produce overlapping skin phenotypes, and in early infancy the progeroid appearance,
          dysmorphism, hypotonia and psychomotor delay look much the same across them. This is the differential
          the disease actually sits in.
        distinguishing_features:
        - Abnormal serum glycosylation is present in every ATP6V0A2 patient and is the most useful single
          discriminator within the group.
        - Epilepsy is commonest in ATP6V0A2 disease; corpus callosum dysgenesis points instead to PYCR1
          or ALDH18A1, and dystonic posturing discriminates for those two.
        - The brefeldin-A-induced retrograde transport delay is present in ATP6V0A2-deficient cells and
          absent in GORAB- and PYCR1-deficient cells.
      selected_evidence:
        snippet: Corpus callosum dysgenesis was associated with PYCR1 and ALDH18A1 mutations. Dystonic
          posturing was discriminatory for PYCR1 and ALDH18A1 defects.
        supports: SUPPORT
