            id: GO:0006890
            label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
        - preferred_term: TGF-beta receptor signaling
          modifier: INCREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
        cell_types:
        - preferred_term: dermal fibroblast
          term:
            id: CL:0002551
            label: fibroblast of dermis
      selected_evidence:
        snippet: Investigation of brefeldin A-induced Golgi collapse in dermal fibroblasts as well as
          in HeLa cells deficient for ATP6V0A2 revealed a delay, which was absent in cells deficient for
          the ARCL-associated proteins GORAB or PYCR1.
        supports: SUPPORT
