      assertion_type: Diagnosis
      assertion:
        name: Combined transferrin and apolipoprotein C-III isoelectric focusing
        presence: PRESENT
        description: 'The first-line screen, and the step that selects ATP6V0A2 out of the genetically
          heterogeneous cutis laxa group before sequencing. Transferrin focusing detects the N-linked
          limb and apolipoprotein C-III focusing the O-linked one; it is the combination that points at
          a Golgi-homeostasis defect rather than an endoplasmic-reticulum one or a single-enzyme CDG.

          Every ATP6V0A2 patient in the prospective neurometabolic cutis laxa cohort had abnormal glycosylation,
          so a normal result argues against the gene more strongly than an abnormal one argues for it.'
        markers: Type II transferrin isoform profile on serum transferrin isoelectric focusing, together
          with an abnormal apolipoprotein C-III isoform profile detecting the mucin-type O-linked limb.
        results: 'A combined N- and O-linked abnormality. Either limb alone points elsewhere: an isolated
          transferrin abnormality is compatible with many CDGs, and it is the pairing that localises the
          defect to Golgi homeostasis.'
        notes: '`Diagnosis.markers` is a single free-text string with no ontology binding, so a two-analyte
          test cannot be represented as two grounded markers here - both are named in one sentence instead.
          The HP term for the transferrin finding, HP:0012301, is carried on the corresponding `phenotypes`
          and `biochemical` entries, which is where it can be validated.'
      selected_evidence:
        snippet: All patients with ATP6V0A2 defects had abnormal glycosylation.
        supports: SUPPORT
