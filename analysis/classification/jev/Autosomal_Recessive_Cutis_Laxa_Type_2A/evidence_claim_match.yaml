              label: autosomal recessive cutis laxa type 2A
        context: []
      assertion_type: Subtype
      assertion:
        name: Wrinkly skin syndrome
        display_name: Wrinkly skin syndrome (attenuated ATP6V0A2 phenotype)
        description: 'Historically a separate diagnosis, and now understood as the milder end of the same
          disorder: the same ATP6V0A2 mutations are found in patients labelled wrinkly skin syndrome and
          in patients labelled cutis laxa, and the distinction is one of degree of elastic-fibre involvement
          rather than of mechanism.

          Curated as a subtype rather than as a separate entry precisely because it has no separate mechanism.
          A curator meeting a patient labelled wrinkly skin syndrome should look for the same variants
          and expect the same glycosylation abnormality.'
      selected_evidence:
        snippet: Interestingly, similar mutations have been found in patients with wrinkly skin syndrome,
          without the presence of severe skin symptoms of elastin deficiency. These findings suggest that
          the cutis laxa and wrinkly skin syndromes are phenotypic variants of the same disorder.
        supports: SUPPORT
