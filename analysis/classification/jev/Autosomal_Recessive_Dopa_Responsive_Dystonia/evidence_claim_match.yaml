          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        cell_source: Patient-derived induced pluripotent stem cells differentiated into dopaminergic neurons,
          with healthy and gene-corrected isogenic controls
        cell_types:
        - preferred_term: dopaminergic neuron
          term:
            id: CL:0000700
            label: dopaminergic neuron
        conditions:
        - Mild levodopa-responsive THD-A genotypes
        - Severe THD-B genotypes with poor post-differentiation levodopa response
        - Healthy and gene-corrected isogenic controls
        publication: PMID:36740977
        description: Patient-derived neurons reproduce reduced TH and dopamine metabolites, shortened
          neurites, and reduced arborization. Levodopa rescued mature THD-A neurons, while precursor-stage
          treatment prevented defects in THD-B, suggesting phenotype-specific response and a possible
          developmental window.
        modeled_mechanisms:
        - target: Biallelic TH Loss of Function
          description: Patient neurons model reduced TH abundance caused by biallelic disease alleles.
        - target: Cerebral Catecholamine Deficiency
          description: Reduced dopamine metabolites model the central biochemical defect.
        findings:
        - statement: THD neurons have reduced neurite length and arborization.
          supporting_text: THD iPSC-DAn showed abnormal morphology, including reduced total neurite length
            and neurite arborization defects.
        - statement: Levodopa response depends on phenotype and treatment timing in this model.
          supporting_text: L-Dopa treatment at the stage of neuronal precursors could prevent the alterations
            in THDB-iPSC-DAn.
      selected_evidence:
        snippet: Our iPSC-based model recapitulates THD disease phenotypes and response to treatment,
          representing a promising tool for investigating pathogenic mechanisms, drug screening, and personalized
          management.
