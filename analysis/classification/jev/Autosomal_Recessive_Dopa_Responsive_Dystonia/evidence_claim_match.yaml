        - experimental_models#Patient-derived THD iPSC dopaminergic neurons
        - clinical_trials#NCT03655223
        - clinical_trials#NCT05687474
        rationale: Patient-derived neurons suggest that precursor-stage levodopa can prevent severe-cell
          defects even when mature neurons respond poorly, and clinical consensus favors early diagnosis.
          The two registry studies screen newborns, but no disease-specific prospective early-treatment
          trial was identified.
      selected_evidence:
        snippet: Interestingly, L-Dopa treatment at the stage of neuronal precursors could prevent the
          alterations in THDB-iPSC-DAn, thus suggesting the existence of a critical developmental window
          in THD.
