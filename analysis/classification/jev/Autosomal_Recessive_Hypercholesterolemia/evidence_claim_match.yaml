      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing of LDLRAP1
        description: Identify two pathogenic or likely pathogenic LDLRAP1 variants in trans, using segregation
          testing when needed. An FH or broader dyslipidemia panel should include sequence and deletion/duplication
          analysis. A variant of uncertain significance cannot establish or exclude the diagnosis. Founder
          testing may be useful in Sardinian families, but a negative founder test does not exclude other
          alleles; one detected allele or apparent homozygosity may require copy-number analysis. Normal
          fibroblast LDL uptake does not exclude ARH.
      selected_evidence:
        snippet: The molecular diagnosis of FH can be established by identification of heterozygous or
          biallelic pathogenic variants in APOB (variants that impair binding of LDL-C to the LDL receptor),
          LDLR, or PCSK9 (gain of function); or rarely, identification of biallelic pathogenic variants
          in LDLRAP1.
        supports: SUPPORT
