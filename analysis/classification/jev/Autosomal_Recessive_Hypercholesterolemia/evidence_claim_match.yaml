      assertion_type: Inheritance
      assertion:
        name: Autosomal Recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Biallelic pathogenic LDLRAP1 variants cause autosomal recessive disease; both homozygous
          and compound-heterozygous genotypes occur. Carriers are usually asymptomatic and may have normal
          lipid profiles. After confirming that both parents carry a familial pathogenic variant, each
          pregnancy has a 25% affected, 50% carrier and 25% noncarrier probability. A disease-wide penetrance
          estimate is not established by the cited cohorts.
      selected_evidence:
        snippet: If both parents are known to be heterozygous for an LDLRAP1 pathogenic variant, each
          sib of an affected individual has at conception a 25% chance of being affected, a 50% chance
          of being a carrier, and a 25% chance of inheriting neither of the familial pathogenic variants.
        supports: SUPPORT
