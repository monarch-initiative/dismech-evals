  5c60089e74f2d3788ac3d086a58ab4b48a17b6a1a3fda27b34c3e149ab41802c:
    claim:
      about:
        disease:
          name: Autosomal Recessive Hypercholesterolemia
          disease_term:
            preferred_term: autosomal recessive hypercholesterolemia (ARH)
            term:
              id: MONDO:0011374
              label: hypercholesterolemia, familial, 4
        context: []
      assertion_type: Treatment
      assertion:
        name: Lomitapide
        description: Microsomal triglyceride transfer protein inhibition reduces hepatic VLDL production
          and therefore LDL formation independently of LDLR function. In nine ARH patients receiving background
          statin/ezetimibe, with apheresis in three and PCSK9 inhibition in one, median LDL-C fell from
          257.0 to 101.7 mg/dL (60.4%). Four patients overlapped the earlier 52-patient cohort. This uncontrolled
          subanalysis does not isolate comparative efficacy or prove cardiovascular-event prevention.
          Gastrointestinal intolerance, liver-fat accumulation and transaminase elevations require dietary
          support and liver monitoring; one patient stopped because of gastrointestinal effects and poor
          adherence. Normal stiffness in six assessed patients does not establish long-term hepatic safety.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: lomitapide
            term:
              id: CHEBI:72297
              label: lomitapide
      selected_evidence:
        snippet: The addition of lomitapide (mean dose, 10 mg) resulted in the achievement of a median
          on-treatment LDL-C of 101.7 mg/dL (IQR, 71.3-138.3; 60.4% reduction from baseline)
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
