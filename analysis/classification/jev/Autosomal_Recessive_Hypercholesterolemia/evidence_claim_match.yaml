        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What permits fibroblast LDL uptake when LDLRAP1 is absent?
        attaches_to:
        - pathophysiology#Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
        - experimental_models#Patient skin fibroblasts with DAB2 depletion
        rationale: DAB2 abundance differs between fibroblasts and lymphocytes. However, DAB2 depletion
          in patient fibroblasts reduced receptor protein itself, so the experiment cannot isolate redundant
          endocytosis. A translation-related role was proposed; altered degradation outside the tested
          pathways remains possible. HeLa double-depletion results cannot substitute for patient-fibroblast
          behavior.
      selected_evidence:
        snippet: Clearly, our original intention to determine whether or not Dab2 facilitates LDL-receptor
          internalization in ARH fibroblasts was not possible from our data.
        supports: SUPPORT
