        description: PCSK9 monoclonal antibodies preserve LDLR abundance and can lower LDL-C in some ARH
          patients, but response varies with residual function. Patient lymphocyte experiments with alirocumab
          showed attenuated effects compared with controls; these are not clinical trials. In one patient
          homozygous for c.1A>G, evolocumab added to atorvastatin/ezetimibe lowered LDL-C a further 39%.
          A monitored trial of therapy should be judged by the individual biochemical response; poor response
          in one genotype does not imply universal inefficacy.
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
