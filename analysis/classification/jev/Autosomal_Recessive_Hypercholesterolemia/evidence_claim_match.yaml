              label: hypercholesterolemia, familial, 4
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Arh(-/-) mouse
        species: Mouse
        genotype: Arh(-/-) (LDLRAP1 knockout)
        publication: PMID:16179341
        description: Arh-knockout mice and hepatic rescue constructs test LDLR internalization. Comparison
          with Ldlr-knockout and wild-type mice distinguishes impaired LDL clearance from preserved VLDL-remnant
          clearance. Similar VLDL secretion but markedly different diet-induced hypercholesterolemia argues
          against secretion alone explaining the phenotype.
        modeled_mechanisms:
        - target: Impaired Clathrin-Mediated Endocytosis of the Hepatocyte LDL Receptor
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Loss of ARH in mouse liver reproduces the hepatocyte LDL-receptor endocytosis defect
            that defines this node, generalizing the WIF-B cell-culture result to an intact liver.
          limitations: Murine lipoprotein metabolism is apoB48- and HDL-dominated rather than LDL-dominated,
            so the model captures the molecular/cellular endocytic defect more faithfully than the human
            plasma-LDL and arterial-disease phenotype; the abstract reports in-vivo confirmation of the
            cell-culture findings without a separately quantified endocytosis readout.
        - target: Preserved Hepatic VLDL Remnant Uptake
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: VLDL clearance is greater in Arh-knockout than Ldlr-knockout mice despite impaired
            LDL clearance.
          limitations: Mouse lipoprotein composition and diet differ from human physiology; the result
            does not establish the magnitude of human clinical protection.
          readouts:
          - name: VLDL clearance relative to Ldlr knockout
            target: Preserved Hepatic VLDL Remnant Uptake
            direction: INCREASED
            description: VLDL clearance is greater in Arh-knockout than Ldlr-knockout mice despite impaired
              LDL clearance.
      selected_evidence:
        snippet: The rate of VLDL clearance was significantly higher in Arh(-/-) mice than in Ldlr(-/-)
          mice, suggesting that LDLR-dependent uptake of VLDL is maintained in the absence of ARH.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
