              label: hypercholesterolemia, familial, 4
        context:
        - path: /treatments/1
          value:
            name: Lomitapide
            description: Microsomal triglyceride transfer protein inhibition reduces hepatic VLDL production
              and therefore LDL formation independently of LDLR function. In nine ARH patients receiving
              background statin/ezetimibe, with apheresis in three and PCSK9 inhibition in one, median
              LDL-C fell from 257.0 to 101.7 mg/dL (60.4%). Four patients overlapped the earlier 52-patient
              cohort. This uncontrolled subanalysis does not isolate comparative efficacy or prove cardiovascular-event
              prevention. Gastrointestinal intolerance, liver-fat accumulation and transaminase elevations
              require dietary support and liver monitoring; one patient stopped because of gastrointestinal
              effects and poor adherence. Normal stiffness in six assessed patients does not establish
              long-term hepatic safety.
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: lomitapide
                term:
                  id: CHEBI:72297
                  label: lomitapide
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Lifelong Elevation of Plasma LDL Cholesterol
        treatment_effect: INHIBITS
        description: 'Lowers LDL production upstream of the receptor, bypassing the defective hepatic
          LDL-receptor internalization.

          '
      selected_evidence:
        snippet: lomitapide acts using an LDLR-independent mechanism, therefore potentially extending
          its efficacy in patients with an absent LDLR function, like those with ARH
        supports: SUPPORT
