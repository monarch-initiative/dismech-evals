  d270653aa7058d8621550c5732a2fb91275c52aff62bc5b4603e2797a7497266:
    claim:
      about:
        disease:
          name: Autosomal Recessive Hypercholesterolemia
          disease_term:
            preferred_term: autosomal recessive hypercholesterolemia (ARH)
            term:
              id: MONDO:0011374
              label: hypercholesterolemia, familial, 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of ARH Adaptor Bridging of the LDL Receptor to Clathrin
        biological_scale: MOLECULAR
        description: The ARH phosphotyrosine-binding domain interacts with the LDLR cytoplasmic tail,
          while clathrin- and AP-2-binding regions connect it to coated-pit machinery. Domain-rescue experiments
          require the PTB domain plus either clathrin or AP-2 binding for effective clustering and LDL
          uptake. LDLRAP1 disease primarily affects this adaptor function rather than the LDLR coding
          sequence; receptor abundance and residual activity nevertheless depend on cell and allele context.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        molecular_functions:
        - preferred_term: clathrin-cargo adaptor activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0035615
            label: clathrin-cargo adaptor activity
        - preferred_term: low-density lipoprotein particle receptor binding
          modifier: DECREASED
          term:
            id: GO:0050750
            label: low-density lipoprotein particle receptor binding
      selected_evidence:
        snippet: The disease is caused by mutations in ARH, which encodes a putative adaptor protein that
          interacts with the cytoplasmic tail of the LDLR, phospholipids, and two components of the clathrin
          endocytic machinery, clathrin and adaptor protein-2 (AP-2) in vitro.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16179341
      reference_title: The modular adaptor protein autosomal recessive hypercholesterolemia (ARH) promotes
        low density lipoprotein receptor clustering into clathrin-coated pits.
      evidence_source: IN_VITRO
      explanation: Establishes the adaptor's three binding partners - the receptor tail, clathrin, and
        AP-2 - whose bridging is lost in ARH.
