        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which machinery supports ARH-independent VLDL-remnant uptake and how much does it modify
          human disease?
        attaches_to:
        - pathophysiology#Preserved Hepatic VLDL Remnant Uptake
        rationale: Mouse and isolated-hepatocyte experiments establish retained LDLR-dependent remnant
          uptake. Simple ligand affinity or clustering and the tested LRP/heparan-sulfate alternatives
          do not explain it. One human kinetic study supports increased direct remnant removal, but cannot
          establish its contribution across LDLRAP1 genotypes or treatment responses.
      selected_evidence:
        snippet: In contrast, the direct removal of very-low-density lipoprotein remnant was significantly
          greater in ARH than those in control subjects (47.5 versus 2±2%).
        supports: SUPPORT
