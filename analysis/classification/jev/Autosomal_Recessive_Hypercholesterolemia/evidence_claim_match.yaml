              label: hypercholesterolemia, familial, 4
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Cardiovascular Imaging Surveillance
        description: Monitor lipids and cardiovascular risk throughout life. For severe ARH overlapping
          clinical HoFH, consensus supports baseline and annual echocardiography of the heart and aorta,
          and specialist-directed coronary CT angiography. Repeat CT depends on baseline burden, LDL-C
          lowering, radiation risk and clinical indication. Invasive coronary angiography is reserved
          for suspected ischemia or valve dysfunction. This is severity-based clinical guidance, not a
          requirement for routine catheterization in every LDLRAP1 patient.
      selected_evidence:
        snippet: Invasive coronary angiography is indicated in patients with symptoms and/or signs suggestive
          of ischaemia or valve malfunction.
        supports: SUPPORT
