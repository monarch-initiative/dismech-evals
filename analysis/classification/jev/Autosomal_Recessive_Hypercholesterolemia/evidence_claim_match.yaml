        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic LDLRAP1 Loss-of-Function
        role: trigger
        biological_scale: MOLECULAR
        description: Homozygous or compound-heterozygous pathogenic LDLRAP1 variants impair the ARH adaptor.
          The current locus is 1p36.11; 1p35 was the historical discovery mapping. Truncating, splice,
          initiation-codon and larger rearrangement alleles are described. Some alleles retain detectable
          shorter protein and residual uptake, so loss of function does not mean every genotype is a complete
          null. The two Sardinian founder alleles are enriched in that population rather than defining
          all worldwide disease.
        genes:
        - preferred_term: LDLRAP1
          term:
            id: hgnc:18640
            label: LDLRAP1
        genetic_context:
          gene:
            preferred_term: LDLRAP1
            term:
              id: hgnc:18640
              label: LDLRAP1
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic germline pathogenic variants, either homozygous or compound heterozygous.
            Heterozygous carriers typically have normal lipid profiles.
      selected_evidence:
        snippet: Here we map the ARH locus to an approximately 1-centimorgan interval on chromosome 1p35
          and identify six mutations in a gene encoding a putative adaptor protein (ARH).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
