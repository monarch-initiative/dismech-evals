      assertion_type: Pathophysiology
      assertion:
        name: Preserved Hepatic VLDL Remnant Uptake
        role: retained function modifying disease expression
        biological_scale: CELLULAR
        description: LDLR-dependent uptake of VLDL remnants is largely preserved in Arh-knockout mice
          despite impaired LDL uptake. Hepatocyte LDLR deletion abolishes this uptake, whereas additional
          LRP deletion does not. A human kinetic study in one patient found increased direct remnant removal.
          This retained pathway may limit LDL-precursor availability and contribute to statin responsiveness,
          but the precise ARH-independent internalization machinery is unresolved.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
      selected_evidence:
        snippet: The rate of VLDL clearance was significantly higher in Arh(-/-) mice than in Ldlr(-/-)
          mice, suggesting that LDLR-dependent uptake of VLDL is maintained in the absence of ARH.
        supports: SUPPORT
    origin:
