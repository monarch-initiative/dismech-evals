            term:
              id: MONDO:0011374
              label: hypercholesterolemia, familial, 4
        context: []
      assertion_type: Genetic
      assertion:
        name: LDLRAP1
        gene_term:
          preferred_term: LDLRAP1
          term:
            id: hgnc:18640
            label: LDLRAP1
        association: Pathogenic Mutations
        presence: Positive
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal Recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'LDLRAP1 at 1p36.11 encodes the cytosolic ARH adaptor. Pathogenic alleles include truncating
          variants, splice alterations, large rearrangements and initiation-codon variants. Disease requires
          biallelic variants, either homozygous or compound heterozygous. Loss of normal function need
          not mean complete absence of residual uptake: c.1A>G was associated with a shorter protein and
          residual lymphocyte LDLR activity. Sardinian founder alleles include NM_015627.3:c.431dupA (historically
          c.432_433insA), p.His144GlnfsTer27, and c.65G>A, p.Trp22Ter. Their prominence in Sardinian-enriched
          cohorts is not worldwide allele predominance.'
      selected_evidence:
        snippet: Here we map the ARH locus to an approximately 1-centimorgan interval on chromosome 1p35
          and identify six mutations in a gene encoding a putative adaptor protein (ARH).
        supports: SUPPORT
