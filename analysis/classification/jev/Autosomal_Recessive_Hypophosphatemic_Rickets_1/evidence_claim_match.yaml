        biological_scale: CELLULAR
        description: 'Osteocytes in DMP1-deficient bone, newly embedded or deep, keep expressing osteoblast
          and osteoid-osteocyte markers, have an abnormal lacunocanalicular network, and sit in matrix
          whose mineral-to-matrix ratio is reduced. This is a cell-autonomous defect: DMP1-deficient osteoprogenitors
          mineralize poorly in vitro at normal phosphate and in the absence of FGF23, and heterozygous
          carriers with normal serum phosphate show dysmorphic osteocytes and a mild histomorphometric
          mineralization defect. The node feeds both arms of the disease, the endocrine arm through FGF23
          and the local arm through matrix mineralization.'
