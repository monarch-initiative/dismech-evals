        name: Burosumab
        action_category: THERAPEUTIC
        therapeutic_modality: MONOCLONAL_ANTIBODY
        description: 'A fully human anti-FGF23 monoclonal antibody approved for X-linked hypophosphatemia
          and tumour-induced osteomalacia. It is not approved for ARHR1: the evidence is case reports,
          two brothers treated monthly with normalization of phosphate, pseudofracture healing, less pain
          and fatigue and improved function, and an adult treated after conventional therapy. Use is off-label,
          through a metabolic bone specialist, with fasting phosphate and TmP/GFR rather than FGF23 assays
          for monitoring. The Dmp1-null mouse supplies a caution: removing osteocytic FGF23 normalizes
          phosphate but only partly corrects the bone, because the DMP1-intrinsic matrix defect remains.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
