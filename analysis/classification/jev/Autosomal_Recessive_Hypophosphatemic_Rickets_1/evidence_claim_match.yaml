        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: UNKNOWN
        expressivity: VARIABLE
        description: 'Affected individuals are homozygous, typically in consanguineous or endogamous families,
          or rarely compound heterozygous. Heterozygous parents are clinically unaffected but are not
          biochemically inert: carriers in one family showed mild hypophosphatemia and focal osteomalacia
          on biopsy, and carriers in two further kindreds had normal phosphate with an intermediate bone
          density and a mild histomorphometric mineralization defect. Numerical penetrance of biallelic
          genotypes is not established; expressivity between families is wide.'
      selected_evidence:
        snippet: Here, we mapped an autosomal recessive form (designated ARHP) to chromosome 4q21 and
          identified homozygous mutations in DMP1 (dentin matrix protein 1), which encodes a non-collagenous
          bone matrix protein expressed in osteoblasts and osteocytes.
        supports: SUPPORT
