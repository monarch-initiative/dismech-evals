        - pathophysiology#Defective Osteocyte Maturation and Pericellular Mineralization
        - pathophysiology#Increased Osteocytic FGF23 Production
        prompt: By what molecular route does loss of an extracellular matrix phosphoprotein in the osteocyte
          de-repress Fgf23 transcription, and is the FGFR-dependent mechanism shown in mouse bone cells
          the one operating in human ARHR1?
        rationale: 'The two edges into the FGF23 node are typed unknown-intermediates for a reason: the
          discovery papers proposed that DMP1 regulates FGF23, the mouse genetics show FGFR signalling
          is required for the induction and that PHEX and DMP1 share the pathway, and the set-point studies
          show the induction is phosphate-responsive, but none of this says what DMP1 in the matrix does
          to the cell to keep Fgf23 off. Candidate explanations include a loss of matrix-derived signalling
          through integrins or the ASARM peptide, abnormal local phosphate sensing by immature osteocytes
          through FGFR, and a maturation-stage effect in which osteoid osteocytes are simply FGF23-competent.
          Until it is known, the upstream target for a disease-modifying therapy other than FGF23 neutralization
          cannot be named.'
        proposed_experiments:
        - experiment_id: arhr1_human_osteocyte_fgfr_dependence
          name: FGFR dependence of FGF23 induction in human DMP1-deficient osteocytes
          description: Differentiate osteocytes from patient-derived or DMP1-edited human iPSCs and test
            whether FGF23 induction is abolished by FGFR1 inhibition, and whether it is restored by exogenous
            57-kDa C-terminal DMP1 added to the matrix, to establish that the mouse pathway operates in
            human cells and that the extracellular fragment is sufficient.
      selected_evidence:
        snippet: The mechanisms whereby PHEX and DMP1 regulate Fgf23 expression are unknown.
        supports: SUPPORT
