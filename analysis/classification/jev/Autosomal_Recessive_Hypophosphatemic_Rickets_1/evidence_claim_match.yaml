              label: hypophosphatemic rickets, autosomal recessive, 1
        context: []
      assertion_type: Genetic
      assertion:
        name: Biallelic DMP1 Pathogenic Variants
        gene_term:
          preferred_term: DMP1
          term:
            id: hgnc:2932
            label: DMP1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'Mutation spectrum: start-codon substitutions (c.1A>G p.Met1Val in the Canadian and Lebanese
          families, c.1A>T p.Met1Leu), nonsense variants (c.98G>A p.Trp33Ter, c.94C>A p.Glu32Ter, c.556G>T
          p.Glu186Ter, c.730G>T p.Glu244Ter), a frameshift (c.485delT p.Glu163ArgfsTer53), splice-site
          variants (IVS5-1G>A, c.184-1G>A, c.54+1G>C), the 7-bp deletion c.1484-1490del that replaces
          the C-terminal 18 residues, a 49-kb deletion from exon 3 into the intergenic region towards
          IBSP, and a large deletion spanning DSPP, DMP1, IBSP and MEPE in trans with p.Met1Leu. Every
          allele is loss of function; there is no gain-of-function or dominant-negative DMP1 disease.
          Alleles that affect the 57-kDa C-terminal fragment are associated with shorter stature and lower
          phosphate than those confined to the N-terminal fragment. Heterozygotes are clinically unaffected
          but can show mild hypophosphatemia, intermediate bone density and a subclinical mineralization
          defect.'
      selected_evidence:
        snippet: Here, we mapped an autosomal recessive form (designated ARHP) to chromosome 4q21 and
          identified homozygous mutations in DMP1 (dentin matrix protein 1), which encodes a non-collagenous
          bone matrix protein expressed in osteoblasts and osteocytes.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
