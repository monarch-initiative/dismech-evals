        prompt: Is the DMP1 heterozygous carrier state a subclinical bone disorder that warrants surveillance,
          and does it explain the carriers with mild hypophosphatemia?
        rationale: Carriers in the Finnish family had mild hypophosphatemia and focal osteomalacia on
          biopsy with increased bone FGF23 expression; carriers in two later kindreds had normal biochemistry
          but intermediate bone density and, on one biopsy, a mild mineralization defect with dysmorphic
          osteocytes. Heterozygous mice mineralize normally on FTIR. The finding matters for the inheritance
          label, which is recessive at the clinical level but not at the histological one, and for whether
          carrier relatives should have phosphate and bone density checked.
      selected_evidence:
        snippet: Two heterozygous carriers of the mutation also showed mild hypophosphatemia, and bone
          biopsy in one of these individuals showed focal areas of osteomalacia.
        supports: SUPPORT
