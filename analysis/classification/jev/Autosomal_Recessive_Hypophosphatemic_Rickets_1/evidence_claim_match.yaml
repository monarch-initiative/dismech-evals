            term:
              id: MONDO:0009430
              label: hypophosphatemic rickets, autosomal recessive, 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: arhr1_hyperostosis_osteosclerosis_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Osteosclerosis with Increased Axial Bone Density
        - phenotypes#Cranial Hyperostosis
        - phenotypes#Enthesopathy and Paraspinal Ligament Calcification
        prompt: Why do adults with a mineralization-failure disease develop cranial hyperostosis, a high
          axial bone density and ossifying enthesopathy severe enough to immobilize the spine, and are
          these one process or several?
        rationale: These features are curated as phenotypes without a causal edge because no source explains
          them and their reporters call the density increase unaccountable. Osteosclerosis coexisting
          with osteomalacia is radiographically established, but areal density on DXA can be inflated
          by accumulated unmineralized osteoid volume, ligamentous ossification and cortical thickening,
          and one HR-pQCT study found damaged peripheral microstructure despite high axial density, so
          it is not clear that bone is genuinely stronger. Candidate mechanisms include the reduced osteoclast
          number and RANKL/OPG ratio seen in the null mouse, decades of conventional phosphate and calcitriol
          treatment, direct FGF23 or sclerostin effects on bone formation, and loss of a SIBLING-protein
          brake on ectopic mineralization at entheses; the Indian family carried an additional SPP1 variant,
          which confounds attribution to DMP1 alone. Whether FGF23 neutralization slows the enthesopathy
          is untested.
        proposed_experiments:
        - experiment_id: arhr1_bone_quality_hrpqct_histology
          name: Volumetric density, microstructure and histology of sclerotic ARHR1 bone
          description: HR-pQCT and, where biopsy is obtainable, quantitative histomorphometry with osteoclast
            counts in adults with radiographic osteosclerosis, to test whether the sclerosis is mineralized
            bone with reduced resorption or accumulated osteoid, and whether enthesopathy correlates with
            FGF23, treatment exposure or genotype.
      selected_evidence:
        snippet: Our cases show that some ARHR cases may develop with age an unaccountable increase in
          bone density and bone overgrowth.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
