            term:
              id: MONDO:0009430
              label: hypophosphatemic rickets, autosomal recessive, 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Increased Osteocytic FGF23 Production
        biological_scale: CELLULAR
        description: 'Fgf23 transcription in osteocytes rises more than a hundredfold in DMP1-deficient
          bone, with little of the protein cleaved, so intact hormone is released. Compound Phex/Dmp1
          mutant mice show no additive increase, and an FGFR inhibitor blocks the induction in both, so
          DMP1 and PHEX appear to restrain FGF23 through a common pathway that involves FGF receptor signalling
          in the osteocyte. In human bone, FGF23 expression is increased in the homozygote and, less so,
          in the heterozygous carrier. The set point is also shifted: when serum phosphate is raised,
          DMP1-deficient bone responds by producing still more FGF23.'
        cell_types:
        - preferred_term: osteocyte
          term:
            id: CL:0000137
            label: osteocyte
        genes:
        - preferred_term: FGF23
          term:
            id: hgnc:3680
            label: FGF23
        biological_processes:
        - preferred_term: FGF receptor signalling in osteocytes
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Furthermore, inhibiting FGFR signaling using SU5402 in Hyp- and Dmp1(-/-)-derived bone
          marrow stromal cells prevented the increase in Fgf23 mRNA expression (129- and 124-fold increase
          in Hyp and Dmp1(-/-) vs. 1.3-fold in Hyp+SU5402 and 2.5-fold in Dmp1(-/-)+SU5402, P<0.05).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
