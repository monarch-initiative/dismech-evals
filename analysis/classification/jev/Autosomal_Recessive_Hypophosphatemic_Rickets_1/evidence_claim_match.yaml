          calcitriol or alfacalcidol, titrated to healing of rickets, alkaline phosphatase and parathyroid
          hormone rather than to serum phosphate. Efficacy in ARHR1 is described as modest, and adult
          null mice given phosphate alone develop more FGF23, hyperparathyroidism and worse osteomalacia,
          which is the mechanistic argument for never giving phosphate without active vitamin D. Side
          effects are gastrointestinal intolerance, hypercalciuria, nephrocalcinosis and secondary hyperparathyroidism.'
