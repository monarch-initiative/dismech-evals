            term:
              id: MONDO:0009430
              label: hypophosphatemic rickets, autosomal recessive, 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: arhr1_fgf23_blockade_versus_matrix_defect
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Skeletal Mineralization Failure
        - treatments#Burosumab
        prompt: In the Dmp1-null mouse, removing osteocytic Fgf23 normalizes serum phosphate but leaves
          part of the bone phenotype uncorrected; does the same residual, DMP1-intrinsic mineralization
          defect limit what burosumab can achieve in patients with ARHR1?
        rationale: 'The model result is unambiguous and is the basis for the local mineralization edge
          in this entry. The human evidence points the other way but is thin: two brothers and one further
          adult improved biochemically and clinically on burosumab, with pseudofracture healing, but no
          histology, no bone density trajectory and no growth data in a child exist. If the mouse is right,
          ARHR1 patients on burosumab should show slower or incomplete healing of osteomalacia than XLH
          patients at matched phosphate, and a DMP1-replacement or matrix-directed therapy would be needed
          in addition. If the mouse overstates the local defect, because the complete null exaggerates
          what hypomorphic human alleles do, FGF23 neutralization alone may suffice. The two carrier biopsies
          showing a mild mineralization defect at normal phosphate favour the mouse.'
        proposed_experiments:
        - experiment_id: arhr1_burosumab_histomorphometry
          name: Paired bone histomorphometry before and after burosumab in ARHR1
          description: Tetracycline-labelled trans-iliac biopsies before and after twelve months of burosumab
            in adults with ARHR1, compared with the published XLH response at matched serum phosphate,
            with osteoid thickness, mineralization lag time and osteocyte morphology as endpoints. Residual
            osteoid at normal phosphate would confirm the DMP1-intrinsic defect in humans.
      selected_evidence:
        snippet: Our data suggest that combined DMP1 repletion and FGF23 blockade could effectively correct
          ARHR-associated mineral and bone disorders.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
