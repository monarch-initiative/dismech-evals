  6b7c0e540a7cee8423b5ed04027d208fd4f6e0a1187236d44cb4fe6e3345c97c:
    claim:
      about:
        disease:
          name: Autosomal Recessive Hypophosphatemic Rickets 1
          disease_term:
            preferred_term: Autosomal Recessive Hypophosphatemic Rickets 1
            term:
              id: MONDO:0009430
              label: hypophosphatemic rickets, autosomal recessive, 1
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Dmp1-null mouse
        species: Mouse
        genotype: Dmp1 homozygous null
        publication: PMID:17033621
        genes:
        - preferred_term: Dmp1
          term:
            id: hgnc:2932
            label: DMP1
        description: 'The reference model, from which the human disease was recognized: the hypomineralized
          bone of the null mouse was known before DMP1 patients were found, and the discovery paper characterized
          both together. The mouse reproduces defective osteocyte maturation with an abnormal lacunocanalicular
          system, more than hundredfold osteocytic Fgf23 induction, elevated serum FGF23, hypophosphatemia
          with a lowered phosphate set point, expanded disorganized growth plates, rickets and osteomalacia,
          short stature, and cortical porosity. Rescue by bone-cell expression of DMP1 or its 57-kDa fragment,
          exacerbation by phosphate loading in adults, and partial correction by osteocyte-specific Fgf23
          deletion are its main experimental results.'
        modeled_mechanisms:
        - target: Defective Osteocyte Maturation and Pericellular Mineralization
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: The osteocyte maturation arrest and lacunocanalicular defect were defined in this
            model and are DMP1-dependent, since bone-cell DMP1 expression rescues them.
          limitations: A complete null on an inbred background; human alleles include hypomorphic and
            C-terminal-altering variants, and human carrier osteocyte dysmorphology has no direct counterpart
            in heterozygous mice, which mineralize normally.
          readouts:
          - name: Tibial mineral-to-matrix ratio by FTIR imaging
            target: Defective Osteocyte Maturation and Pericellular Mineralization
            direction: DECREASED
            interpretation: Relative mineral content of bone matrix in the null mouse at 4 and 16 weeks.
        - target: Increased Osteocytic FGF23 Production
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Osteocytic Fgf23 induction, its FGFR dependence and its non-additivity with Phex
            loss were all established in this model.
          limitations: The magnitude of induction in the null mouse exceeds what is inferred from human
            bone, where FGF23 expression is increased but has not been quantified; whether FGFR signalling
            drives human osteocytic FGF23 is not demonstrated.
          readouts:
          - name: Fgf23 mRNA in bone marrow stromal cells
            target: Increased Osteocytic FGF23 Production
            direction: INCREASED
            interpretation: 124-fold induction, abolished by the FGFR inhibitor SU5402.
        - target: Chronic Hypophosphatemia
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: Hypophosphatemia with a lowered set point that is maintained through Fgf23 expression
            and cleavage; raising phosphate provokes more FGF23.
          limitations: Adult null mice also develop hyperparathyroidism, which most patients do not; the
            mouse therefore overstates the calciopenic component.
          readouts:
          - name: Serum phosphate
            target: Chronic Hypophosphatemia
            direction: DECREASED
            interpretation: Hypophosphatemia at 12 weeks with elevated serum FGF23 and PTH.
        - target: Skeletal Mineralization Failure
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: TISSUE
          description: Osteomalacia with accumulated osteoid, only partly corrected when phosphate is
            normalized by osteocytic Fgf23 deletion, which is the experiment that separates the endocrine
            from the local route into this node.
          limitations: The model has not been followed long enough to show whether the adult human hyperostosis,
            osteosclerosis and enthesopathy have a murine counterpart; those features are not modelled.
        - target: Growth Plate Hypertrophic Zone Expansion
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: TISSUE
          description: Expanded, disorganized growth plates with rickets, rescued by bone-cell expression
            of DMP1 or its 57-kDa fragment, and shown to be phosphate-dependent in metatarsal organ culture.
          limitations: Murine growth plates remain open through adult life, so the model does not reproduce
            the human transition from rickets to osteomalacia at skeletal maturity.
        notes: Related models. The Dmp1/Galnt3 double knockout (PMID:28005411) raises serum phosphate
          by increasing Fgf23 cleavage and normalizes bone density while Fgf23 expression climbs further,
          the experiment that defines the lowered set point. Compound Hyp/Dmp1 mutants (PMID:21507898)
          show non-additive FGF23 and rickets, placing PHEX and DMP1 on one pathway. A DMP1-deficient
          rabbit with elevated FGF23 and hypophosphatemic rickets is described in the osteocyte review
          (PMID:36246908) but its primary report was not curated here. No naturally occurring animal disease
          equivalent to human ARHR1 is known.
      selected_evidence:
        snippet: Dentin matrix protein 1 (encoded by DMP1) is highly expressed in osteocytes and, when
          deleted in mice, results in a hypomineralized bone phenotype.
        supports: SUPPORT
