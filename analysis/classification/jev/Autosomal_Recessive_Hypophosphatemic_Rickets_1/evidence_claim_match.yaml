              label: Burosumab
      selected_evidence:
        snippet: The advent of burosumab (Crysvita), a fully humanized monoclonal antibody to FGF23 for
          the treatment of X-linked hypophosphatemia and tumor-induced osteomalacia, offers a unique opportunity
          to evaluate its safety and efficacy in patients with ARHR1.
        supports: SUPPORT
