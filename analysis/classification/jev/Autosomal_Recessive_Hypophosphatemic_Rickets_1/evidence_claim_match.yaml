          modifier: DECREASED
      selected_evidence:
        snippet: Mechanistic studies using Dmp1-null mice demonstrated that absence of DMP1 results in
          defective osteocyte maturation and increased FGF23 expression, leading to pathological changes
          in bone mineralization.
        supports: SUPPORT
