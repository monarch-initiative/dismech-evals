            label: muscle cell apoptotic process
          modifier: INCREASED
        - preferred_term: calcium ion transport
          term:
            id: GO:0006816
            label: calcium ion transport
          modifier: ABNORMAL
        - preferred_term: autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: ABNORMAL
      selected_evidence:
        snippet: These are characterized by the centralization of skeletal muscle syncytial nuclei, the
          replacement of muscle fibers with fibrotic tissue, the release of inflammatory cytokines, and
          the disruption of muscle protein homeostasis, ultimately leading to necrosis and loss of muscle
          functionality.
        supports: SUPPORT
