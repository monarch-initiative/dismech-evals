          risk.
      selected_evidence:
        snippet: Dysferlinopathy is inherited in an autosomal recessive manner. If both parents are known
          to be heterozygous for a DYSF pathogenic variant, each sib of an affected individual has at
          conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and
          a 25% chance of being unaffected and not a carrier.
        supports: SUPPORT
