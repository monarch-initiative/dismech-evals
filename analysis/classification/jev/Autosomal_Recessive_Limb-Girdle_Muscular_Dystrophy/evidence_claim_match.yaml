        description: TRAPPC11 is a subunit of the multiprotein TRAPP membrane-trafficking complex. Both
          reported LGMD R18 alleles weaken TRAPPC11 binding to other TRAPP components and disrupt Golgi
          architecture. Endoplasmic-reticulum-to-Golgi transport remains normal while exit from the Golgi
          to the cell surface is dramatically delayed, and the lysosomal membrane glycoproteins LAMP1
          and LAMP2 are altered as a consequence, so the defect is in secretory-pathway transit rather
