      assertion_type: Pathophysiology
      assertion:
        name: Satellite Cell Pool Depletion
        biological_scale: CELLULAR
        description: Skeletal muscle regeneration depends on satellite cells, whose quiescence and self-renewal
          are controlled by Notch signalling. POGLUT1 patients' muscle holds a dramatically reduced satellite
          cell pool, and their primary myoblasts proliferate slowly, differentiate too readily, and hold
          a smaller pool of quiescent PAX7-positive cells. The authors name Notch-dependent loss of satellite
          cells as the pathomechanism, which is why this node sits downstream of the pathway node rather
          than beside it.
        cell_types:
        - preferred_term: skeletal muscle satellite cell
          term:
            id: CL:0000594
            label: skeletal muscle satellite cell
      selected_evidence:
        snippet: These data suggest that a key pathomechanism for this novel form of muscular dystrophy
          is Notch-dependent loss of satellite cells.
        supports: SUPPORT
    origin:
