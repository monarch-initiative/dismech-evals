  c5355dd43b2f854447220b9961d620369299348d12bbfae8a9400dec5a3f42cc:
    claim:
      about:
        disease:
          name: Autosomal Recessive Limb-Girdle Muscular Dystrophy
          disease_term:
            preferred_term: autosomal recessive limb-girdle muscular dystrophy
            term:
              id: MONDO:0015152
              label: autosomal recessive limb-girdle muscular dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sarcolemmal Instability and Failed Membrane Repair
        description: Across LGMD-R subtypes the proximate defect destabilizes the myofiber plasma membrane
          (sarcolemma). Sarcoglycanopathies (SGCA-D) and dystroglycanopathies (FKRP) disrupt the dystrophin-glycoprotein
          complex that links the cytoskeleton to the extracellular matrix, while dysferlin (DYSF) deficiency
          impairs calcium-triggered resealing of membrane microtears. The result is a fragile sarcolemma
          that cannot withstand or repair contraction-induced injury.
        genes:
        - preferred_term: DYSF
          term:
            id: hgnc:3097
            label: DYSF
        - preferred_term: FKRP
          term:
            id: hgnc:17997
            label: FKRP
        - preferred_term: SGCA
          term:
            id: hgnc:10805
            label: SGCA
        - preferred_term: SGCB
