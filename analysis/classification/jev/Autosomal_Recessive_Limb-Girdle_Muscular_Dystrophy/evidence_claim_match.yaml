      assertion:
        name: POMK (POMK-deficiency LGMD)
        subtype: POMK-LGMD
        relationship_type: CAUSATIVE
        notes: POMK phosphorylates the O-mannosyl glycan of alpha-dystroglycan, the step that LARGE-dependent
          extension and therefore laminin binding depends on. Truncating alleles removing the kinase domain
          span Walker-Warburg syndrome to limb-girdle weakness with cognitive defects, so the limb-girdle
          presentation is the mild end of a dystroglycanopathy spectrum rather than a separate mechanism.
          A search of the approved symbol POMK in the ClinGen Gene-Disease Validity CSV (snapshot 2026-08-13)
          returns no row.
        gene_term:
          preferred_term: POMK
          term:
            id: hgnc:26267
            label: POMK
      selected_evidence:
        snippet: Here, we describe two families carrying different truncating alleles, both removing the
          kinase domain in POMK, with different clinical manifestations ranging from Walker-Warburg syndrome,
          the most severe form of dystroglycanopathy, to limb-girdle muscular dystrophy with cognitive
          defects.
        supports: SUPPORT
