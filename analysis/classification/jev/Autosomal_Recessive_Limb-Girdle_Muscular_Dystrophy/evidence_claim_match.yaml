              label: autosomal recessive limb-girdle muscular dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sarcolemmal Instability and Failed Membrane Repair
        description: Across LGMD-R subtypes the proximate defect destabilizes the myofiber plasma membrane
          (sarcolemma). Sarcoglycanopathies (SGCA-D) and dystroglycanopathies (FKRP) disrupt the dystrophin-glycoprotein
          complex that links the cytoskeleton to the extracellular matrix, while dysferlin (DYSF) deficiency
          impairs calcium-triggered resealing of membrane microtears. The result is a fragile sarcolemma
          that cannot withstand or repair contraction-induced injury.
        genes:
        - preferred_term: DYSF
          term:
            id: hgnc:3097
            label: DYSF
        - preferred_term: FKRP
          term:
            id: hgnc:17997
            label: FKRP
        - preferred_term: SGCA
          term:
            id: hgnc:10805
            label: SGCA
        - preferred_term: SGCB
          term:
            id: hgnc:10806
            label: SGCB
        - preferred_term: SGCG
          term:
            id: hgnc:10809
            label: SGCG
        - preferred_term: SGCD
          term:
            id: hgnc:10807
            label: SGCD
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: plasma membrane repair
          term:
            id: GO:0001778
            label: plasma membrane repair
          modifier: DECREASED
      selected_evidence:
        snippet: They are caused by mutations in the DYSF gene, which encodes the dysferlin protein that
          is crucial for repairing muscle membranes.
        supports: SUPPORT
