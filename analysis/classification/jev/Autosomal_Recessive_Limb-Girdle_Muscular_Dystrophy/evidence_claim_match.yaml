  682850ef9fa889973782d80906e745ab269265288a1b81ede15af8cb0129a610:
    claim:
      about:
        disease:
          name: Autosomal Recessive Limb-Girdle Muscular Dystrophy
          disease_term:
            preferred_term: autosomal recessive limb-girdle muscular dystrophy
            term:
              id: MONDO:0015152
              label: autosomal recessive limb-girdle muscular dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Alpha-Dystroglycan Hypoglycosylation and Loss of Laminin Binding
        biological_scale: MOLECULAR
        description: 'Alpha-dystroglycan reaches the extracellular matrix only after an O-mannosyl glycan
          is phosphorylated and then extended by LARGE; the mature glycan is what binds laminin with high
          affinity. Two of the LGMD-R genes act inside this pathway rather than on the sarcolemmal complex
          itself. DAG1 is the substrate: the Thr192Met variant blocks LARGE-dependent maturation of the
          phosphorylated O-mannosyl glycan, so the receptor loses laminin binding despite being present.
          POMK is the kinase that performs the phosphorylation step, and truncating alleles that remove
          its kinase domain produce dystroglycanopathy ranging from Walker-Warburg syndrome to limb-girdle
          weakness with cognitive defects. This node is the primary-dystroglycanopathy counterpart of
          the FKRP-driven secondary dystroglycanopathy recorded on the sarcolemmal node below.'
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        molecular_functions:
        - preferred_term: laminin binding
          term:
            id: GO:0043236
            label: laminin binding
          modifier: DECREASED
        genes:
        - preferred_term: DAG1
          term:
            id: hgnc:2666
            label: DAG1
        - preferred_term: POMK
          term:
            id: hgnc:26267
            label: POMK
      selected_evidence:
        snippet: In vitro and in vivo studies showed that the mutation impairs the receptor function of
          dystroglycan in skeletal muscle and brain by inhibiting the post-translational modification,
          mediated by the glycosyltransferase LARGE, of the phosphorylated O-mannosyl glycans on α-dystroglycan
          that is required for high-affinity binding to laminin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21388311
      reference_title: A dystroglycan mutation associated with limb-girdle muscular dystrophy.
      evidence_source: MODEL_ORGANISM
      explanation: Supports loss of high-affinity laminin binding by alpha-dystroglycan as the molecular
        lesion in the DAG1 form. Graded MODEL_ORGANISM because the "in vivo" half of this sentence is
        the T190M knock-in mouse described earlier in the same paper, which is where the laminin-overlay
        and histology results come from; the human proband contributes the genotype and phenotype, covered
        by the other evidence on this record.
