        name: Myofiber Degeneration and Necrosis
        description: Sarcolemmal instability permits pathological calcium influx and uncontrolled activation
          of degradative pathways (calpain proteolysis, the ubiquitin-proteasome system, and dysregulated
          autophagy), driving cycles of myofiber degeneration, necrosis, and regeneration. Centralized
          nuclei, necrotic fibers, and inflammatory cytokine release are characteristic histological features.
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: muscle cell apoptotic process
          term:
