        subtype: LGMDR18
        relationship_type: CAUSATIVE
        notes: Recessive TRAPPC11 variants produce a spectrum whose severe end adds infantile hyperkinetic
          movements, ataxia and intellectual disability to the limb-girdle weakness. ClinGen classifies
          TRAPPC11 as Definitive for autosomal recessive limb-girdle muscular dystrophy.
        gene_term:
          preferred_term: TRAPPC11
          term:
            id: hgnc:25751
            label: TRAPPC11
      selected_evidence:
        snippet: By using a combination of whole-exome or genome sequencing with homozygosity mapping,
          we identified the homozygous c.2938G>A (p.Gly980Arg) missense mutation within the gryzun domain
          of TRAPPC11 in the Syrian LGMD family and the homozygous c.1287+5G>A splice-site mutation resulting
          in a 58 amino acid in-frame deletion (p.Ala372_Ser429del) in the foie gras domain of TRAPPC11
          in the Hutterite families.
        supports: SUPPORT
