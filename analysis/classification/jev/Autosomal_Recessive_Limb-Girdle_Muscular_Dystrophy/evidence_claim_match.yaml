        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Calpain-3 Deficiency and Impaired Sarcomere Remodelling
        biological_scale: MOLECULAR
        description: Calpain-3 is the muscle-specific calcium-dependent protease, held at the N2A region
          of titin in the sarcomere and activated by sustained modest rises in cytoplasmic calcium such
          as those following eccentric contraction. Loss of calpain-3 expression causes LGMDR1, and its
          pathogenic mechanism is understood as impaired sarcomere remodelling rather than as sarcolemmal
          fragility, which is why this subtype is wired to a separate node from the sarcoglycanopathies
          and dysferlinopathy.
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: sarcomere organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
        genes:
        - preferred_term: CAPN3
          term:
            id: hgnc:1480
            label: CAPN3
      selected_evidence:
        snippet: The physiological roles of the calpains are not well understood, although ubiquitous
          calpains have been associated with apoptosis and myogenesis and calpain-3 is likely involved
          in sarcomeric remodelling. A defect in the expression of calpain-3 results in limb-girdle muscular
          dystrophy Type 2A.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
