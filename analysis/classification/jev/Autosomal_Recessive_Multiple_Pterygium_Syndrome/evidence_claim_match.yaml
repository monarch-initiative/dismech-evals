      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: GENETICS_ENVIRONMENT_DISEASE
        notes: A Mendelian multiple-congenital-anomaly syndrome caused by biallelic variants in a single
          fetal neuromuscular junction gene. Harrison's places monogenic malformation syndromes of this
          kind under genetics rather than under a single organ-system part, which suits a disorder whose
          burden spans musculoskeletal, craniofacial, and prenatal domains.
      selected_evidence:
        snippet: MPS can be separated into the lethal pterygium syndromes (LMPS, MIM253290) and the non-lethal
          syndromes; the latter conditions are categorically referred to as Escobar syndrome (or Escobar
          variant MPS, MIM265000) and most are autosomal recessive.
        supports: SUPPORT
