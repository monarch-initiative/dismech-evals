              label: autosomal recessive multiple pterygium syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Fetal acetylcholine receptor gamma-subunit dysfunction
        biological_scale: MOLECULAR
        description: Pathogenic CHRNG variants impair the fetal gamma subunit of the muscle nicotinic
          acetylcholine receptor. Because this receptor subunit is required during embryonic and fetal
          neuromuscular junction development, disruption reduces fetal neuromuscular transmission before
          the adult receptor subunit replaces it later in gestation.
        gene:
          preferred_term: CHRNG
          description: Encodes the fetal gamma subunit of the muscle nicotinic acetylcholine receptor
            required for prenatal neuromuscular junction function.
          modifier: DECREASED
          term:
            id: hgnc:1967
            label: CHRNG
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: neuromuscular synaptic transmission
          modifier: DECREASED
          term:
            id: GO:0007274
            label: neuromuscular synaptic transmission
      selected_evidence:
        snippet: Mutations in the CHRNG encoding the embryonal acetylcholine receptor may cause the non-lethal
          Escobar variant (EVMPS) and lethal form (LMPS) of multiple pterygium syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27245440
      reference_title: Truncating CHRNG mutations associated with interfamilial variability of the severity
        of the Escobar variant of multiple pterygium syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: This directly links CHRNG disruption of the embryonal acetylcholine receptor to Escobar
