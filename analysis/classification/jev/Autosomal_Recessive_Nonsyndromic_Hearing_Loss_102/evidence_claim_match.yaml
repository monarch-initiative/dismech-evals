        description: EPS8 does not act alone at the tip. It is delivered there as cargo of the motor protein
          MYO15A, it is in turn required for BAIAP2L2 to localize at the tips of the transducing stereocilia,
          and reconstituted Whirlin-MYO15-EPS8 assemblies form phase-separated condensates that promote
          actin bundling. Several partners in that complex are themselves deafness genes, so DFNB102 is
          best read as removing one component of a shared machine rather than as an isolated gene defect.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        cellular_components:
