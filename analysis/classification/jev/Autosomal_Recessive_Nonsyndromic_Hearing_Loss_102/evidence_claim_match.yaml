  2a56bdc82edae3bf6b6f18b5b16293f804cdc4a2030290c3cfab91959e81138f:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 102
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 102
            term:
              id: MONDO:0014428
              label: autosomal recessive nonsyndromic hearing loss 102
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the C-Terminal Effector Domain
        description: 'The structural specification of what the disease alleles take away. EPS8''s barbed-end
          capping activity resides in its conserved carboxy-terminal effector domain, and within that
          domain capping and bundling are separable: capping by an amphipathic helix inserting into the
          hydrophobic pocket at the filament barbed end, bundling by a compact four-helix bundle contacting
          the filament. A nonsense codon at residue 30 of an 822-residue protein removes both.

          This node exists because the separability matters for interpretation rather than for these patients:
          a hypothetical missense allele sparing one activity would be a different disease state, and
          none has been reported.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: barbed-end actin filament capping
          modifier: DECREASED
          term:
            id: GO:0051016
            label: barbed-end actin filament capping
      selected_evidence:
        snippet: proteins of another family, the Eps8 family, also show barbed-end capping activity, which
          resides in their conserved carboxy-terminal effector domain
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15558031
      reference_title: Eps8 controls actin-based motility by capping the barbed ends of actin filaments.
