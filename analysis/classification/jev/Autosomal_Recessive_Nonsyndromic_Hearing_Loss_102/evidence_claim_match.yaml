      assertion_type: Diagnosis
      assertion:
        name: Copy-number analysis alongside sequencing
        description: The distinctive diagnostic point for this gene, and the reason it belongs in `diagnosis:`
          rather than only in `variants:`. A trio exome first read one patient as HOMOZYGOUS for an EPS8
          splice variant; copy-number analysis then found a 65.9 kb intragenic deletion covering the same
          intron on the maternal allele. An intragenic deletion in trans with a sequence variant masquerades
          as homozygosity, so a sequencing-only workflow does not merely miss the second allele - it reports
          the wrong genotype, with the wrong recurrence risk for the parents.
      selected_evidence:
        snippet: The deletion is covering intron 14 that could account for the apparent homozygosity of
          the patient.
        supports: SUPPORT
