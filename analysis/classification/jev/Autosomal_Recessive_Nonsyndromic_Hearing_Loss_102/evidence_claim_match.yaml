      assertion_type: Variant
      assertion:
        name: EPS8 c.1435-2A>T in trans with a 65.9 kb intragenic deletion
        description: 'A compound-heterozygous genotype in a non-consanguineous Chinese infant that trio
          exome sequencing first read as homozygous for the splice variant. Copy-number analysis found
          a 65.9 kb intragenic deletion covering intron 14 on the maternal allele, which explained the
          apparent homozygosity.

          Recorded because of what it implies for diagnosis rather than for mechanism: a DFNB102 genotype
          can be missed, or mis-assigned as homozygous, by sequencing alone.'
        variant_type: deletion
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: The deletion is covering intron 14 that could account for the apparent homozygosity of
          the patient.
        supports: SUPPORT
