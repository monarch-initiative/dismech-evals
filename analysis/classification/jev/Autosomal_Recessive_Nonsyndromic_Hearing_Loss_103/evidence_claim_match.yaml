        name: Progressive Hair Cell Degeneration
        description: Clic5-deficient mice show progressive cochlear and vestibular hair-cell loss after
          bundle abnormalities. In jitterbug mice, stereocilia were abnormal at P40 without missing hair
          cells in the imaged preparations, while older animals had severe organ-of-Corti and vestibular
          degeneration. In the nmf318 AAV study, outer-hair-cell loss was greatest basally, whereas inner-hair-cell
          survival was largely retained except at the cochlear base. Hearing dysfunction therefore cannot
          be attributed solely to cell death. P0 gene delivery preceded bundle damage and did not test
          rescue during the interval between bundle failure and cell loss.
        biological_scale: TISSUE
        cell_types:
