        name: Progressive Sensorineural Hearing Impairment
        category: Auditory
        description: Progressive bilateral sensorineural hearing loss is documented in the reported families.
          The Turkish siblings progressed from mild loss in early childhood to severe or profound loss
          before the second decade. Three Cameroonian siblings reported prelingual onset and progression
          and had profound loss when assessed as adults; earlier audiograms were unavailable. The Siberian
          cohort ranged from moderate to profound loss and reported highly variable decline, with a mean
          annual speech-frequency PTA change of 7.4 ± 13.65 dB. This cohort average does not predict an
          individual trajectory.
        phenotype_term:
