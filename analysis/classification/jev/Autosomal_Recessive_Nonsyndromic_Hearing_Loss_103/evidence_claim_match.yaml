  4b3e4b62558236d07c4426ebdab4166cbebab078bedf33fbafeba3c91462cea5:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 103
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 103
            term:
              id: MONDO:0014469
              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Clic5 nmf318 missense mouse treated with inner ear AAV
        species: Mouse
        genotype: C57BL/6J-Clic5nmf318/J homozygote; ENU-induced missense allele; P0 AAV2/9-PHP.B Clic5
          delivery
        publication: PMID:40859056
        description: 'The gene-replacement study used the ENU-induced nmf318 missense line (JAX 005329),
          not an engineered knockout. The MGI allele record specifies c.680T>C, p.Phe227Ser; the paper
          uses Clic5−/− as shorthand for the protein-deficient phenotype. Untreated animals had approximately
          40-dB ABR threshold shifts at four weeks and no detected responses at eight weeks.

          Left-utricle injection at P0 restored CLIC5, prevented bundle fusion, improved hair-cell survival
          and auditory/vestibular outcomes. Radixin localization returned toward normal but taperin remained
          distributed along stereocilia at eight weeks. The self-complementary vector achieved comparable
          measured benefit at approximately eleven-fold lower titer than the single-stranded construct;
          this was not a formal equivalence trial, the constructs differed in reporter content and some
          untreated controls were shared. Auditory benefit declined, especially at high frequencies, whereas
          vestibular behavioral benefit persisted through the 12-week follow-up. No delayed-treatment
          arm tested reversal of established damage.'
        genes:
        - preferred_term: CLIC5
          term:
            id: hgnc:13517
            label: CLIC5
        modeled_mechanisms:
        - target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
          relationship: RESCUES
          fidelity: MODERATE
          description: CLIC5 replacement restores radixin localization and reduces structural abnormalities,
            supporting the proposed attachment function. Taperin remains mislocalized, so the experiment
            does not demonstrate reconstitution of every proposed complex component.
          limitations: P0 treatment precedes the observed lesion and tests prevention rather than reversal.
            No post-onset delivery arm defines when efficacy is lost. Auditory thresholds worsened by
            12 weeks, especially at high frequencies; C57BL/6 background, expression dynamics and immune
            effects remain possible contributors.
          readouts:
          - name: Radixin localisation after CLIC5 restoration
            target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
            direction: RESTORED
            interpretation: Radixin returns toward the stereociliary base after CLIC5 replacement; this
              supports a functional dependency without proving the complete native binding architecture.
        - target: Progressive Stereocilia Fusion and Bundle Distortion
          relationship: RESCUES
          fidelity: MODERATE
          description: P0 gene replacement prevents much of the later stereociliary fusion and elongation.
          limitations: A prevention experiment; no delayed-treatment arm.
          readouts:
          - name: Stereocilia morphology after treatment
            target: Progressive Stereocilia Fusion and Bundle Distortion
            direction: RESTORED
            interpretation: Neonatal treatment preserves largely normal bundle morphology at later endpoints;
              it does not test repair of an already fused bundle.
        - target: Progressive Hair Cell Degeneration
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Untreated homozygotes develop progressive hair-cell loss, predominantly outer hair
            cells at the basal cochlea. Neonatal gene replacement improves subsequent survival.
          limitations: The phenotype and age dependence are model specific. An ABR threshold is a functional
            endpoint and cannot distinguish bundle dysfunction from cell loss.
          readouts:
          - name: Cochlear outer-hair-cell survival
            target: Progressive Hair Cell Degeneration
            direction: DECREASED
            interpretation: Counts at 12 weeks show greatest outer-hair-cell loss basally in untreated
              mice, with improved survival after gene delivery.
      selected_evidence:
        snippet: in exon 6 is predicted to change a highly conserved phenylalanine residue at amino acid
          227 to serine (NP_766209).
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/0
      context_paths:
