              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Membrane-Actin Tethering at the Stereocilia Taper
        description: 'CLIC5 concentrates near the stereociliary base and adjacent apical membrane. In
          jitterbug mice, radixin and PTPRQ localization is perturbed before fusion; taperin mislocalization
          is detected later. Membrane lifting and fusion support impaired attachment to the underlying
          cytoskeleton, but temporal precedence alone does not prove which interaction initiates the lesion.

          Co-immunoprecipitation in epithelial cells and pull-down from mouse lung support association
          with ERM proteins and taperin, with more tentative evidence for myosin VI. Direct CLIC5-actin
          binding and the composition of a single native hair-cell complex are not established by these
          assays. Approximately equimolar CLIC5 and radixin abundance in bulk chicken hair bundles does
          not establish complex stoichiometry. Myosin VI mutants also mislocalize CLIC5 and radixin, indicating
          localization dependencies without resolving a unique assembly hierarchy.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlea auditory hair cell
          term:
            id: CL:4023120
            label: cochlea auditory hair cell
        - preferred_term: vestibular hair cell
          term:
            id: CL:0000609
            label: vestibular hair cell
        biological_processes:
        - preferred_term: inner ear receptor cell stereocilium organization
          term:
            id: GO:0060122
            label: inner ear receptor cell stereocilium organization
          modifier: DECREASED
      selected_evidence:
        snippet: These results suggest that CLIC5 associates with radixin in hair cell stereocilia and
          may help form or stabilize connections between the plasma membrane and the filamentous actin
          core.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
