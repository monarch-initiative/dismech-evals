        - experiment_id: exp_dfnb103_delayed_aav_after_fusion_onset
          name: Delayed AAV delivery after stereocilia fusion has begun
          description: Compare P0 with P21 and P42 delivery in the nmf318 line, using age-matched untreated
            and vector controls, verified cell-specific transduction, expression and dose. Measure auditory
            and vestibular function, partner localization, hair-cell counts and bundle ultrastructure;
            use matched cohorts where destructive imaging prevents within-cell follow-up. Include strain-background
            controls to assess high-frequency susceptibility.
          would_support:
          - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
          supporting_outcome:
          - Delayed delivery improves or stabilizes function and morphology with verified expression,
            supporting residual reversibility or prevention of further damage under that regimen.
          would_refute:
          - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
          refuting_outcome:
          - Verified delayed delivery fails to improve the measured endpoints, arguing against efficacy
            of that regimen at that stage; this would not prove universal irreversibility or restrict
            all human strategies to infancy.
      selected_evidence:
        snippet: Despite the deterioration of ABR thresholds over time, transgene expression remained
          robust at 12 weeks, and no significant morphological changes in hair cells were observed.
