        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counselling with Audiologic and Vestibular Surveillance
        description: 'Counselling for a recessive condition with a 25 percent sibling recurrence risk,
          and scheduled follow-up rather than a single assessment. Surveillance is the substantive part
          here: hearing is not congenitally impaired, newborn screening can be passed, and the loss then
          declines by several decibels per year, so a normal early audiogram is not a discharge. Vestibular
          testing is worth including because areflexia develops later than the hearing loss and is often
          asymptomatic.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'No DFNB103-specific report of hearing amplification, cochlear implantation or vestibular
          rehabilitation was found in the reviewed literature, so none is curated here even though all
          three are standard in progressive severe-to-profound sensorineural hearing loss with vestibular
          failure. This is a deliberate scoping decision rather than a judgement that they are inappropriate.
          Gene replacement is likewise not curated as a treatment: the AAV work is preclinical and is
          recorded under animal_models, where its limitations can be stated alongside it.'
      selected_evidence:
        snippet: In average the patients with DFNB103 lost 7.4 ± 13.65 dB on the speech frequency range
          in pure tone averages (PTA0.5,1.0,2.0,4.0 kHz) per year until reaching profound deafness in
          the second or third decade of the life.
        supports: SUPPORT
