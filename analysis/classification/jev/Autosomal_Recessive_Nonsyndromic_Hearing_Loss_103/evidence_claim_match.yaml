  123d5f37381d21772e15e1822ac4cd81580fed6dc2a1ad589207e87c9288a727:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 103
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 103
            term:
              id: MONDO:0014469
              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Clic5 jitterbug mouse
        species: Mouse
        genotype: Clic5 jbg/jbg, 97 bp intragenic deletion causing exon 5 skipping
        publication: PMID:17021174
        description: The spontaneous C3H/HeJ jitterbug allele deletes 97 genomic bases, causing exon 5
          skipping, frameshift and premature termination. Protein is undetectable by the reported assays.
          Mutants develop hearing and vestibular dysfunction, abnormal stereocilia and later hair-cell
          degeneration. The 2014 follow-up defines membrane lifting, fusion and altered partner localization.
          Cochlear supporting structures such as Reissner's membrane and stria vascularis were preserved
          in the original histology, arguing against a primary endolymph-volume phenotype.
        genes:
        - preferred_term: CLIC5
          term:
            id: hgnc:13517
            label: CLIC5
        modeled_mechanisms:
        - target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Jitterbug mice support a role for CLIC5 in membrane-cytoskeletal attachment through
            membrane lifting, altered radixin/PTPRQ localization and subsequent bundle fusion. The exact
            direct molecular contacts remain unresolved.
          limitations: A functionally protein-null deletion does not reproduce every human allele. Biochemical
            interactions were measured partly in epithelial-cell constructs and mouse lung, while protein
            abundance and localization also used rat and chicken hair bundles; these are not a purified
            native human hair-cell complex.
          readouts:
          - name: Radixin immunostaining in hair bundles
            target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
            direction: DECREASED
            interpretation: Reduced radixin immunostaining supports a localization or stability dependence
              on CLIC5; it does not prove total loss of radixin or direct binding.
          - name: Taper-region localisation of radixin, taperin and PTPRQ
            target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
            direction: ALTERED
            interpretation: Radixin and PTPRQ dispersal precedes visible fusion, whereas taperin mislocalization
              occurs later. Temporal ordering does not identify a single initiating interaction.
        - target: Progressive Stereocilia Fusion and Bundle Distortion
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Fusion from postnatal day 10 with progressive worsening, which is the structural
            lesion this node describes and which no human material shows.
          limitations: Human cochlear fusion has not been directly demonstrated by the cited studies.
            Mouse developmental timing cannot be mapped to a specific age or closed therapeutic window
            in patients.
          readouts:
          - name: Stereocilia fusion by scanning electron microscopy
            target: Progressive Stereocilia Fusion and Bundle Distortion
            direction: INCREASED
            interpretation: Adjacent stereocilia progressively fuse from postnatal day 10 onwards.
      selected_evidence:
        snippet: The jbg mutation is a 97 bp intragenic deletion that causes skipping of exon 5, which
          creates a translational frame shift and premature stop codon.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17021174
      reference_title: The chloride intracellular channel protein CLIC5 is expressed at high levels in
        hair cell stereocilia and is essential for normal inner ear function.
      evidence_source: MODEL_ORGANISM
      explanation: The molecular lesion, of the same truncating class as the human founder and founding
        alleles, which is what makes this model genetically comparable.
      quote_role: PRIMARY_RESULT
