          pair in the Cameroonian family consisting of a missense p.L75P and a canonical donor splice-site
          variant, and a founder nonsense variant p.Trp215Ter in Eastern Siberia. Even the one missense
          allele behaves as a loss of function in cells: expressed CLIC5A p.L75P forms perinuclear aggregates
          instead of distributing evenly in the cytoplasm, and fails to produce the thin filopodia-like
          membrane protrusions the wild-type protein induces.'
