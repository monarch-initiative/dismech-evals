  368d4342289afa39bd7c97c6f2c8697e77fffe0b399b391dbf1e64c9b7ad5a7f:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 103
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 103
            term:
              id: MONDO:0014469
              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Clic5 jitterbug mouse
        species: Mouse
        genotype: Clic5 jbg/jbg, 97 bp intragenic deletion causing exon 5 skipping
        publication: PMID:17021174
        description: The founding model and the reason CLIC5 was a candidate gene at all. jitterbug is
          a spontaneous recessive mutation, a 97 base pair intragenic deletion that causes exon 5 skipping
          with a frameshift and premature stop; western blot and immunohistochemistry confirm the protein
          is absent. Homozygotes have impaired hearing and vestibular dysfunction, dysmorphic stereocilia
          and progressive hair cell degeneration, and reduced radixin staining in the hair bundle. The
          2014 follow-up on the same line established the fusion phenotype and the mislocalisation of
          radixin, taperin and PTPRQ.
        genes:
        - preferred_term: CLIC5
          term:
            id: hgnc:13517
            label: CLIC5
        modeled_mechanisms:
        - target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
          relationship: RECAPITULATES
          fidelity: HIGH
          description: This is where the mechanism was established. Stereocilia taper composition cannot
            be examined in living patients, so the jitterbug mouse is not corroborating a human observation;
            it is where the tethering claim was tested in the first place, and tested in both directions,
            since CLIC5 and radixin also fail to localise in myosin VI mutants. It is not the only mouse
            bearing on the claim - the independent Clic5-null line used in the 2025 gene-therapy study
            shows the same radixin dependence, and is curated separately below.
          limitations: A protein-null allele produced by exon skipping, against a human spectrum of nonsense,
            splice and missense alleles; the human missense allele in particular has residual protein
            that mislocalises rather than being absent, so it is not biochemically equivalent. The molecular
            partners were characterised partly in chicken and rat vestibular tissue rather than in mouse
            cochlea, so the complex is assembled from evidence across three species.
          readouts:
          - name: Radixin immunostaining in hair bundles
            target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
            direction: DECREASED
            interpretation: The partner protein is lost from the bundle when CLIC5 is absent, which is
              the direct evidence that CLIC5 holds the complex in place.
          - name: Taper-region localisation of radixin, taperin and PTPRQ
            target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
            direction: ALTERED
            interpretation: Three partners disperse out of the taper region, two of them before fusion
              is visible, so the complex disassembles first and the structure fails afterwards.
        - target: Progressive Stereocilia Fusion and Bundle Distortion
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Fusion from postnatal day 10 with progressive worsening, which is the structural
            lesion this node describes and which no human material shows.
          limitations: The mouse time course is compressed relative to the human one - days to weeks against
            years - so the model reproduces the sequence of events but not their tempo. Whether the human
            loss reflects fusion at all is inference from the shared gene and shared progressive phenotype,
            since no human cochlear histology exists.
          readouts:
          - name: Stereocilia fusion by scanning electron microscopy
            target: Progressive Stereocilia Fusion and Bundle Distortion
            direction: INCREASED
            interpretation: Adjacent stereocilia progressively fuse from postnatal day 10 onwards.
      selected_evidence:
        snippet: The jbg mutation is a 97 bp intragenic deletion that causes skipping of exon 5, which
          creates a translational frame shift and premature stop codon.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17021174
      reference_title: The chloride intracellular channel protein CLIC5 is expressed at high levels in
        hair cell stereocilia and is essential for normal inner ear function.
      evidence_source: MODEL_ORGANISM
      explanation: The molecular lesion, of the same truncating class as the human founder and founding
        alleles, which is what makes this model genetically comparable.
