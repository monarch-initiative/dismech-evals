              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive Stereocilia Fusion and Bundle Distortion
        description: 'The structural failure. Without the taper tether, adjacent stereocilia fuse. In
          the cochlea the fusion affects inner hair cells across all regions and outer hair cells most
          severely at the apex.

          The reported onset differs between the two mouse lines and they should not be read as one time
          course. In the jitterbug line, which carries an exon-skipping frameshift, fusion is described
          from postnatal day 10 onwards. In the Clic5-null line used for the gene therapy work, no cochlear
          abnormality is detectable at day 14 and the defects are established by day 17, with the vestibular
          change running slightly ahead - elongated utricular bundles from day 15, thickened by day 17.
          Both agree that the lesion has a defined postnatal onset rather than being present from birth,
          which is the structural counterpart of the postlingual, progressive human course; the P14-to-P17
          window used by the therapeutic-window discussion and by the AAV model limitations is the null
          line''s, not the jitterbug line''s.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        - preferred_term: vestibular hair cell
          term:
            id: CL:0000609
            label: vestibular hair cell
        biological_processes:
        - preferred_term: auditory receptor cell stereocilium organization
          term:
            id: GO:0060088
            label: auditory receptor cell stereocilium organization
          modifier: DECREASED
        - preferred_term: vestibular receptor cell stereocilium organization
          term:
            id: GO:0060121
            label: vestibular receptor cell stereocilium organization
          modifier: DECREASED
      selected_evidence:
        snippet: Confocal and scanning electron microscopy of CLIC5-deficient jitterbug (jbg) mice revealed
          progressive fusion of stereocilia as early as postnatal day 10.
        supports: SUPPORT
