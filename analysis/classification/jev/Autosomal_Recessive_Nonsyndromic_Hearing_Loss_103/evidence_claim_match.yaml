        context: []
      assertion_type: Prevalence
      assertion:
        population: GJB2-negative hearing loss patients, Sakha Republic, Eastern Siberia
        measure_type: UNKNOWN
        notes: 'The founder variant p.Trp215Ter was found homozygous in 9.9 percent of GJB2-negative hearing
          loss patients in the Sakha Republic. This is a diagnostic yield within an ascertained, GJB2-excluded
          patient group, not a population prevalence, and it does not generalise: the same variant was
          not detected in GJB2-negative patients of predominantly Russian descent. No rate_per_100000
          or prevalence_class is recorded, because putting 9.9 percent in a population-rate slot would
          assert that a tenth of the Sakha population has DFNB103; the population figure is the separate
          Yakutia record above, roughly 3,700 times smaller. measure_type is UNKNOWN rather than CARRIER_FREQUENCY:
          the schema defines carrier frequency as the heterozygote rate, and these are homozygous affected
          patients, so no PrevalenceMeasureEnum value fits.'
      selected_evidence:
        snippet: The high frequency of c.644 G > A p.(Trp215*) was found among Siberian GJB2-negative
          patients (9.9%) and this variant was not detected in GJB2-negative patients of Caucasian descent
          (predominantly Russians).
        supports: SUPPORT
