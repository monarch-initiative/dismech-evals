  85cec27458bf3541e8f77a0a0fe94b2df377462e443152ed60f192490e19ad07:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 103
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 103
            term:
              id: MONDO:0014469
              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: Genetic
      assertion:
        name: CLIC5
        notes: 'Biallelic CLIC5 nonsense, missense and canonical splice-donor variants are reported. p.Cys32Ter
          predicts early truncation, but patient lymphoblastoid-cell assays did not confirm nonsense-mediated
          decay. p.Leu75Pro is retained and mislocalized in a heterologous cell assay; c.63+1G>A has a
          computationally predicted splicing effect affecting the short isoforms rather than every CLIC5
          transcript. Neither assay establishes a uniform dosage-null mechanism.

          The Siberian founder allele has equivalent transcript descriptions: NM_016929.5:c.644G>A (NP_058625.2:p.Trp215Ter)
          and NM_001114086.2:c.1121G>A (NP_001107558.1:p.Trp374Ter), mapped by ClinVar to GRCh38 chr6:45903200C>T.
          The 2019 and 2026 reports must not be added as independent case counts. The later genome-wide
          haplotype analysis supports common origin, with an estimated founder age of approximately 2,500
          years. Direct human modifiers and population-wide penetrance estimates are not established.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: CLIC5
          term:
            id: hgnc:13517
            label: CLIC5
      selected_evidence:
        snippet: In conclusion, our results show that CLIC5 is a novel arNSHI gene involved in progressive
          hearing impairment, vestibular and possibly mild renal dysfunction in a family of Turkish origin.
        supports: SUPPORT
