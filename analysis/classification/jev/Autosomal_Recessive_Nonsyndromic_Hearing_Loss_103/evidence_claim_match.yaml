  2ebcb9848acc8f9307b89f975eaec1bf37d71ea97061c952cd7e4896377d9ac9:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 103
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 103
            term:
              id: MONDO:0014469
              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Clic5 knockout mouse treated with inner ear AAV
        species: Mouse
        genotype: Clic5 null, homozygous, treated at postnatal day 0 with AAV2/9-PHP.B carrying wild-type
          Clic5
        publication: PMID:40859056
        description: 'A gene-replacement experiment in a Clic5-null line with a well-characterised baseline:
          untreated homozygotes have auditory brainstem response thresholds shifted by about 40 dB at
          4 weeks and no response at 8 weeks, circling behaviour from 4 weeks, and cochlear hair cell
          changes beginning between postnatal days 14 and 17. Utricle injection at postnatal day 0 of
          either a single-stranded or a self-complementary vector restored CLIC5 to the base of the stereocilia,
          normalised radixin localisation, prevented fusion and elongation, improved hair cell survival,
          and rescued auditory and vestibular function. The self-complementary vector achieved equivalent
          rescue at a titre an order of magnitude lower.'
        genes:
        - preferred_term: CLIC5
          term:
            id: hgnc:13517
            label: CLIC5
        modeled_mechanisms:
        - target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
          relationship: RESCUES
          fidelity: MODERATE
          description: 'The strongest available test of the tethering mechanism, because it runs the experiment
            forwards: restoring the protein restores its partner''s localisation and prevents the structural
            failure. That is a stronger claim than any correlation between absence and phenotype.'
          limitations: 'Treatment was given at postnatal day 0, before the mouse lesion begins between
            postnatal days 14 and 17, so this establishes prevention rather than reversal. Human DFNB103
            is diagnosed after hearing loss has begun, typically around age 8, which is the equivalent
            of treating well after the mouse window has closed - the experiment does not address that
            situation. The rescue was also incomplete and unstable in the auditory system: treated thresholds
            remained significantly worse than controls at 12 weeks and deteriorated over time, particularly
            at high frequencies.'
          readouts:
          - name: Radixin localisation after CLIC5 restoration
            target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
            direction: RESTORED
            interpretation: Restoring CLIC5 restores its partner to the taper region, closing the causal
              loop between the adaptor and the complex.
          - name: Stereocilia morphology after treatment
            target: Loss of Membrane-Actin Tethering at the Stereocilia Taper
            direction: RESTORED
            interpretation: 'Bundle morphology is held at normal rather than merely deteriorating more
