        attaches_to:
        - genetic#CLIC5
        rationale: miR-96 and miR-182 mimics reduce CLIC5 RNA/protein and a CLIC5 3-prime-UTR reporter
          in HEI-OC1 cells. GRXCR2 interaction experiments also show functional importance despite largely
          preserved bundle morphology. Neither study establishes a modifier allele or prognostic marker
          in people with biallelic CLIC5 variants.
      selected_evidence:
        snippet: Interestingly, mice harboring this in-frame deletion in Grxcr2 exhibit moderate hearing
          loss at lower frequencies and severe hearing loss at higher frequencies although the morphogenesis
          of stereocilia is minimally affected.
        supports: SUPPORT
