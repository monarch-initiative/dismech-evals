          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 103
            term:
              id: MONDO:0014469
              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: clic5_renal_involvement
        kind: KNOWLEDGE_GAP
        prompt: Is DFNB103 truly nonsyndromic, or does biallelic CLIC5 loss carry a low-grade renal phenotype
          that has not been looked for systematically?
        attaches_to:
        - genetic#CLIC5
        - disease#Autosomal Recessive Nonsyndromic Hearing Loss 103
        rationale: 'One patient in the founding Turkish family had mild renal dysfunction, and the authors
          were careful to describe the gene as involved in hearing, vestibular and possibly mild renal
          dysfunction rather than asserting the last. That hedge has largely dropped out of subsequent
          descriptions, which now call the disease nonsyndromic without qualification.

          The observation deserves better than to be forgotten, because CLIC5 has an established role
          outside the ear in glomerular podocyte and endothelial cell maintenance. A podocyte adaptor
          protein whose loss produces a membrane-cytoskeletal failure in one specialised cell type has
          an obvious reason to do something similar in another. A single patient with mild dysfunction
          is weak evidence, but it is evidence pointing at a mechanism rather than a chance finding.

          What is missing is measurement. Neither the Cameroonian family nor the 22 Siberian patients
          have reported renal assessment, and the Siberian founder cohort is now large enough and genotypically
          homogeneous enough that urinalysis and estimated glomerular filtration rate against matched
          heterozygous relatives would settle the question cheaply. If a subclinical renal phenotype exists,
          DFNB103 patients need monitoring that nobody currently offers them; if it does not, the founding
          hedge can be retired on evidence rather than by attrition.'
      selected_evidence:
        snippet: In conclusion, our results show that CLIC5 is a novel arNSHI gene involved in progressive
          hearing impairment, vestibular and possibly mild renal dysfunction in a family of Turkish origin.
        supports: SUPPORT
    origin:
