  d27db83edbd74d946ad5c2ad42def5c8d58ff2099fb4e624916c8f1661d5bb0e:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 103
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 103
            term:
              id: MONDO:0014469
              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: clic5_therapeutic_window_timing
        kind: HUMAN_MODEL_MISMATCH
        prompt: Gene replacement prevents the CLIC5 phenotype when given at birth in mice, before the
          lesion starts. Human DFNB103 is diagnosed on an audiogram at around age 8, after stereocilia
          fusion would already have occurred. Can restoring CLIC5 rescue a bundle that has already fused,
          or only protect one that has not?
        attaches_to:
        - animal_models#Clic5 knockout mouse treated with inner ear AAV
        - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
        - treatments#Genetic Counselling with Audiologic and Vestibular Surveillance
        rationale: 'The rescue experiment is genuinely encouraging and it does not answer the question
          a patient would ask. Injections were given at postnatal day 0. The cochlear lesion begins between
          postnatal days 14 and 17. So what was demonstrated is that a hair cell which has never lost
          its taper complex can be kept intact, which is a prevention result. Nobody has injected a mouse
          after fusion has begun.

          The human timing makes this the central question rather than a detail. DFNB103 is not congenital,
          hearing is normal or near-normal at birth, and detection is at a mean of about 8 years - by
          which time the equivalent mouse would be long past the treatment window used. Any clinical translation
          therefore depends on an experiment that has not been done, and the founder cohort in the Sakha
          Republic, where the genotype is known and the population is identifiable, is exactly the setting
          where presymptomatic genetic diagnosis in infancy would be feasible if the answer turned out
          to be that only prevention works.

          There is a second, more specific worry inside the same result. Vestibular rescue was stable
          to 12 weeks while auditory thresholds deteriorated over the same period even though transgene
          expression remained robust and hair cell morphology looked unchanged. Something is failing in
          the treated cochlea that is neither loss of transgene nor visible loss of cells, and until that
          is understood the durability of any human auditory benefit is unpredictable.'
        proposed_experiments:
        - experiment_id: exp_dfnb103_delayed_aav_after_fusion_onset
          name: Delayed AAV delivery after stereocilia fusion has begun
          description: Deliver the same self-complementary Clic5 vector to Clic5-null mice at postnatal
            days 21 and 42, after fusion is established, with auditory brainstem response, distortion
            product otoacoustic emission, open-field circling and scanning electron microscopy at matched
            endpoints against the postnatal day 0 arm and untreated controls. Include a group in which
            transgene expression is confirmed but bundles are imaged before and after to distinguish arrest
            of progression from structural repair.
          would_support:
          - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
          supporting_outcome:
          - Delayed treatment arrests further threshold loss and stabilises bundle morphology relative
            to untreated nulls, which would mean the tethering defect is continuously required and a post-diagnosis
            human intervention is coherent.
          would_refute:
          - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
          refuting_outcome:
          - Delayed treatment restores CLIC5 protein and partner localisation but changes neither thresholds
            nor bundle morphology, which would mean fusion is irreversible once formed and would confine
            any therapeutic strategy to presymptomatic infants identified by genotype.
      selected_evidence:
        snippet: In this study, we performed utricle injections into P0 mice, prior to the morphological
          changes in hair cells that begin between P14 and P17, at the time of hearing onset
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40859056
      reference_title: AAV gene therapy rescues hearing and balance in a model of CLIC5 deafness.
      evidence_source: MODEL_ORGANISM
      explanation: The authors state plainly that treatment preceded the lesion. That is the mismatch
        with human diagnostic timing.
