      assertion_type: Discussion
      assertion:
        discussion_id: clic5_therapeutic_window_timing
        kind: KNOWLEDGE_GAP
        prompt: Can CLIC5 replacement improve function after hearing loss or bundle damage begins, and
          what limits durable auditory rescue?
        attaches_to:
        - animal_models#Clic5 nmf318 missense mouse treated with inner ear AAV
        - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
        rationale: 'P0 delivery preceded morphological changes in the nmf318 model. The experiment does
          not define a closed window, prove irreversibility of fusion or establish an equivalent human
          treatment age. Human onset is variable, and cochlear histology is unavailable. Delayed delivery
          with adequate transduction and dose controls is needed.

          Vestibular rescue persisted through 12 weeks while auditory thresholds worsened despite persistent
          expression and no major gross morphological change. These endpoints do not exclude subtle bundle
          defects, cell-specific expression loss, inflammation or background susceptibility; the C57BL/6
          Cdh23 allele is one potential confound. Radixin rescue with persistent taperin mislocalization
          also limits claims of complete complex restoration.'
        proposed_experiments:
        - experiment_id: exp_dfnb103_delayed_aav_after_fusion_onset
          name: Delayed AAV delivery after stereocilia fusion has begun
          description: Compare P0 with P21 and P42 delivery in the nmf318 line, using age-matched untreated
            and vector controls, verified cell-specific transduction, expression and dose. Measure auditory
            and vestibular function, partner localization, hair-cell counts and bundle ultrastructure;
            use matched cohorts where destructive imaging prevents within-cell follow-up. Include strain-background
            controls to assess high-frequency susceptibility.
          would_support:
          - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
          supporting_outcome:
          - Delayed delivery improves or stabilizes function and morphology with verified expression,
            supporting residual reversibility or prevention of further damage under that regimen.
          would_refute:
          - pathophysiology#Progressive Stereocilia Fusion and Bundle Distortion
          refuting_outcome:
          - Verified delayed delivery fails to improve the measured endpoints, arguing against efficacy
            of that regimen at that stage; this would not prove universal irreversibility or restrict
            all human strategies to infancy.
      selected_evidence:
        snippet: In this study, we performed utricle injections into P0 mice, prior to the morphological
          changes in hair cells that begin between P14 and P17, at the time of hearing onset
        supports: SUPPORT
