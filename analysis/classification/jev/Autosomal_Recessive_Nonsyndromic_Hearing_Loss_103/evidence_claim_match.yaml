  f58e794e26ed432185828d89d8df2d91304e161a96fd4fb318c79a0c2a175303:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 103
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 103
            term:
              id: MONDO:0014469
              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Membrane-Actin Tethering at the Stereocilia Taper
        description: 'CLIC5 concentrates at the base of hair cell stereocilia, in the taper region, and
          not at the tips. Mass spectrometry of chicken utricle stereocilia puts it there at roughly a
          one-to-one molar ratio with radixin, and biochemical assays show it interacts with ezrin-radixin-moesin
          proteins, with taperin and possibly with myosin VI. The proposed job of the complex is to hold
          the plasma membrane against the underlying actin core at the point where the stereocilium narrows.

          In CLIC5-deficient mice, radixin immunostaining at the bundle is reduced, and radixin, taperin
          and PTPRQ are all mislocalised in fused stereocilia. The timing is what makes this the primary
          lesion rather than a byproduct: PTPRQ and radixin are already dispersed before any fusion is
          visible. The dependency also runs the other way, since CLIC5 and radixin fail to localise properly
          in myosin VI mutant mice, so the complex is mutually stabilising rather than hierarchical.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlea auditory hair cell
          term:
            id: CL:4023120
            label: cochlea auditory hair cell
        - preferred_term: vestibular hair cell
          term:
            id: CL:0000609
            label: vestibular hair cell
        biological_processes:
        - preferred_term: inner ear receptor cell stereocilium organization
          term:
            id: GO:0060122
            label: inner ear receptor cell stereocilium organization
          modifier: DECREASED
        molecular_functions:
        - preferred_term: actin filament binding
          term:
            id: GO:0051015
            label: actin filament binding
          modifier: DECREASED
      selected_evidence:
        snippet: These results suggest that CLIC5 associates with radixin in hair cell stereocilia and
          may help form or stabilize connections between the plasma membrane and the filamentous actin
          core.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17021174
      reference_title: The chloride intracellular channel protein CLIC5 is expressed at high levels in
        hair cell stereocilia and is essential for normal inner ear function.
      evidence_source: MODEL_ORGANISM
      explanation: The original statement of the tethering hypothesis, from the paper that found the protein
        there.
