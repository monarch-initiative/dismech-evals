  8dbb71055380b30a529b822cf798604c3ba3ca18735e46cefbad5f6e49695a1d:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 103
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 103
            term:
              id: MONDO:0014469
              label: autosomal recessive nonsyndromic hearing loss 103
        context: []
      assertion_type: Genetic
      assertion:
        name: CLIC5
        notes: 'CLIC5 on 6p21.1 encodes chloride intracellular channel 5, originally isolated from microvilli
          in complex with actin-binding proteins including ezrin. Despite the family name, its role in
          the ear is as a membrane-cytoskeletal adaptor at the stereocilia taper rather than as an ion
          channel. It is expressed elsewhere - in glomerular podocytes and endothelium, and in myoblasts
          - which is the background to the isolated report of mild renal dysfunction in one patient. In
          hair cells its expression is directly regulated by miR-96 and miR-182 of the miR-183 family,
          through a conserved binding site in its 3-prime untranslated region.

          The Siberian founder allele p.Trp215Ter is the only CLIC5 variant so far shown to reach appreciable
          population frequency anywhere; haplotype analysis over 730,000 genome-wide SNP markers places
          its origin around 78 generations ago.

          That allele appears in the literature under two names and they are the same variant: Pshennikova
          2019 calls it c.1121G>A p.(Trp374*) and the 2026 Siberian cohort paper calls it c.644G>A p.(Trp215*).
          The offsets differ by exactly 477 nucleotides and 159 codons, which is the shift between the
          two CLIC5 transcripts, not a second Siberian allele.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: CLIC5
          term:
            id: hgnc:13517
            label: CLIC5
      selected_evidence:
        snippet: In conclusion, our results show that CLIC5 is a novel arNSHI gene involved in progressive
          hearing impairment, vestibular and possibly mild renal dysfunction in a family of Turkish origin.
        supports: SUPPORT
    origin:
