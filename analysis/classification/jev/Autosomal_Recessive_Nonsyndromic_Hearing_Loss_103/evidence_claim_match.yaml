      assertion:
        discussion_id: clic5_renal_involvement
        kind: KNOWLEDGE_GAP
        prompt: Is DFNB103 truly nonsyndromic, or does biallelic CLIC5 loss carry a low-grade renal phenotype
          that has not been looked for systematically?
        attaches_to:
        - genetic#CLIC5
        - disease#Autosomal Recessive Nonsyndromic Hearing Loss 103
        rationale: 'The Turkish discovery-family boy had repeatedly elevated urine albumin/creatinine
          ratios (9.2 and 3.8 mg/mmol) and mildly elevated blood pressure at age 11, with preserved estimated
          GFR (114 ml/min/1.73 m2). No renal biopsy established a lesion. The authors recommended follow-up
          for both siblings. Cameroonian participants lacked clinical renal signs, but biochemical kidney
          assessment was explicitly proposed for future work. The available Siberian abstract does not
          report renal evaluation.

          CLIC5-associated podocyte abnormalities in mice motivate systematic human assessment but do
          not establish a syndromic human nephropathy. Longitudinal albuminuria, blood pressure and kidney-function
          measurements with appropriate controls could clarify penetrance and alternative causes.'
      selected_evidence:
        snippet: Impaired hearing is accompanied by vestibular areflexia and in one of the patients with
          mild renal dysfunction.
        supports: SUPPORT
