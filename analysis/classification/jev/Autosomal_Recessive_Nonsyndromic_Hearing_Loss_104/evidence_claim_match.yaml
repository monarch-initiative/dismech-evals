          the difference is allele-specific, background-dependent, or an artefact of how carefully vestibular
          function was assessed in the earlier family. The mouse cannot arbitrate: it is deaf with normal
          vestibular function, which is curated as a model mismatch rather than as evidence against the
          human finding.'
