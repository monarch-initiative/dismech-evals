      assertion_type: Pathophysiology
      assertion:
        name: Biallelic RIPOR2 Loss-of-Function Variant
        role: trigger
        biological_scale: MOLECULAR
        description: 'Two reported alleles, in two consanguineous families, both loss of function and
          both homozygous.

          The Turkish allele c.102-1G>A destroys a splice acceptor site, causing exon skipping and an
          in-frame deletion of 52 residues from the PX membrane-localization domain. It is not a null:
          protein is made, but it is the wrong protein, and where it goes is the point of the next node.

          The Tunisian allele c.1561C>T (p.Arg521*) is a nonsense variant. It is the allele that comes
          with a vestibular phenotype, which the splice allele does not.'
        genetic_context:
          gene:
            preferred_term: RIPOR2
            term:
              id: hgnc:13872
              label: RIPOR2
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Homozygous in both reported families, each of which is consanguineous. Typed LOSS_OF_FUNCTION
            for both alleles: the splice allele''s product fails to reach its compartment and the nonsense
            allele truncates the protein.'
      selected_evidence:
        snippet: The mutation leads to exon skipping and deletion of 52-amino acid residues of a PX membrane
          localization domain.
        supports: SUPPORT
