      assertion_type: Pathophysiology
      assertion:
        name: Loss of RIPOR2 from the Stereociliary Taper
        role: central_effector
        biological_scale: MOLECULAR
        description: 'RIPOR2 works at the plasma membrane of stereocilia, and specifically at their base.
          In the mouse cochlea the wild-type protein localises to the stereociliary plasma membrane of
          inner and outer hair cells, and super-resolution imaging places it as a circumferential ring
          of oligomers around the basal taper - the narrow hinge where a stereocilium pivots when the
          bundle is deflected.

          The splice allele''s product does not get there. Wild-type protein targets the plasma membrane
          while the mutant accumulates in cytoplasmic inclusion bodies, so this is a mislocalisation disease
          at the protein level rather than simple absence, even though the functional outcome is the same.'
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        cellular_components:
        - preferred_term: stereocilium
          term:
            id: GO:0032420
            label: stereocilium
        locations:
        - preferred_term: cochlea
          term:
            id: UBERON:0001844
            label: cochlea
      selected_evidence:
        snippet: The wild-type protein targets the plasma membrane, whereas the mutant protein accumulates
          in cytoplasmic inclusion bodies and does not reach the membrane.
        supports: SUPPORT
