  00485493da41d618cb8ebab9119b1aecbc721f6337990f50d93a9a81c62883cb:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 104
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 104
            term:
              id: MONDO:0014675
              label: autosomal recessive nonsyndromic hearing loss 104
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: RIPOR2-related autosomal dominant hearing loss (DFNA21)
        description: The allelic dominant disorder, and the entity most likely to be confused with this
          one because it is the same gene. A heterozygous 12-nucleotide in-frame deletion causes adult-onset
          progressive hearing loss, segregating dominantly in twelve Dutch families and highly penetrant.
          It is common enough in the southeast Netherlands to be found in people not selected for hearing
          loss at all, which is the opposite epidemiological situation from the private recessive alleles
          of DFNB104.
        distinguishing_features:
        - Heterozygous in-frame deletion rather than biallelic loss of function
        - Adult onset, with a mean around the fourth decade, rather than congenital
        - Progressive rather than stable
        - A frequent founder allele in one population rather than a family-private variant
      selected_evidence:
        snippet: Our study expands the phenotypic spectrum associated with RIPOR2 defects which had so
          far only been described to underlie early-onset recessively inherited HL.
        supports: SUPPORT
