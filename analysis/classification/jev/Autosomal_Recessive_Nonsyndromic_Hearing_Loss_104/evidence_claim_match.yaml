        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hair Bundle Malformation and Misorientation
        role: effector
        biological_scale: CELLULAR
        description: 'Two distinct bundle defects follow, and they occur at different stages.

          During morphogenesis, the absence of Ripor2 affects the orientation of the hair bundle. The
          route runs through Myh9, the non-muscle myosin heavy chain encoded by a known deafness gene:
          Ripor2 interacts with Myh9, and in its absence Myh9 protein is low in the cochlea despite increased
          Myh9 transcript, while the kinocilium - which sets the bundle''s axis - is aberrantly placed
          and its phosphorylated Myh9 content reduced. The transcript-protein discordance is the informative
          detail, because it makes this a protein-stability effect rather than a transcriptional one.

          After development, the bundle does not hold. Stereocilia of Fam65b-deficient hair cells start
          to develop but then deteriorate - so this is a maintenance failure on top of a morphogenetic
          one, and neither alone accounts for the phenotype.'
        cell_types:
        - preferred_term: sensory hair cell
          term:
            id: CL:0000855
            label: sensory hair cell
        cellular_components:
        - preferred_term: stereocilium bundle
          term:
