          allele. Each allele is private to its family. No prevalence estimate exists, and none is meaningful
          at this evidence base.'
      selected_evidence:
        snippet: In a large consanguineous Turkish kindred with recessive nonsyndromic, prelingual, profound
          hearing loss, we identified in the gene FAM65B (MIM611410) a splice site mutation (c.102-1G>A)
          that perfectly cosegregates with the phenotype in the family.
        supports: SUPPORT
