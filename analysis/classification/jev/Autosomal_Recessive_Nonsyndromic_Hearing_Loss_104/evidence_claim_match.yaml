            label: stereocilium bundle
        - preferred_term: kinocilium
          term:
            id: GO:0060091
            label: kinocilium
      selected_evidence:
        snippet: Absence of Ripor2 is associated with low Myh9 abundance in the mouse cochlea despite
          increased amount of Myh9 transcripts.
