            term:
              id: MONDO:0014675
              label: autosomal recessive nonsyndromic hearing loss 104
        context:
        - path: /animal_models/0
          value:
            name: Fam65b/Ripor2 knockout mouse
            species: Mouse
            genotype: Fam65b (Ripor2) constitutive knockout, homozygous
            publication: PMID:27269051
            description: 'The homozygous null mouse, which matches the biallelic human genotype in kind.
              It is the source of essentially everything known about how RIPOR2 works: the taper ring,
              the taperin dependency, the RhoC interaction, and the observation that stereocilia develop
              before they deteriorate.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Loss of RIPOR2 from the Stereociliary Taper
        relationship: RESCUES
        fidelity: HIGH
        description: 'Putting Fam65b back into deficient hair cells after birth restores the bundle, which
          is the closest thing this disease has to a proof that the protein''s absence is what causes
          the structural defect rather than something downstream of a developmental programme that has
          already gone wrong.

          The rescue is also RhoC-dependent: a Fam65b construct that cannot bind RhoC fails to rescue,
          which is what ties the taper mechanism to the GTPase rather than leaving the interaction as
          a correlation.'
        limitations: Re-expression by injectoporation into cochlear explants prepared at postnatal day
          2 and cultured for two days, scored on bundle morphology. That is an ex vivo preparation, which
          is why this link's evidence is typed IN_VITRO rather than MODEL_ORGANISM even though it sits
          under `animal_models`. It says nothing about whether an equivalent intervention is deliverable
          in a human cochlea, or about a timepoint after which the bundle can no longer be restored.
        readouts:
        - name: Stereocilia morphology after Fam65b re-expression
          target: Loss of RIPOR2 from the Stereociliary Taper
          direction: RESTORED
          interpretation: Bundle defects are rescued by wild-type Fam65b but not by the RhoC-binding-deficient
            construct, separating the structural requirement from the protein's mere presence.
      selected_evidence:
        snippet: The acute rescue of hair cell morphology by re-expression of Fam65b at postnatal ages
          also suggests that defects in hair bundle morphology are likely not a secondary consequence
          of perturbations in an overall developmental program but are more specifically linked to a role
          of Fam65b in stereocilia.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0/modeled_mechanisms/2
      evidence_path: /animal_models/0/modeled_mechanisms/2/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /animal_models/0
    evidence_metadata:
