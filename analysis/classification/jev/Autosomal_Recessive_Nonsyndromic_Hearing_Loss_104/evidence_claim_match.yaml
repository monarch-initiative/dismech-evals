  b4512f7db8e9964c15ba12529f06fbe9673cf74a7b90f0bed5334ccf7f751545:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 104
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 104
            term:
              id: MONDO:0014675
              label: autosomal recessive nonsyndromic hearing loss 104
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disorganisation of the Taper Compartment
        role: central_effector
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'The taper is a distinct subcellular compartment with its own protein complement,
          and RIPOR2 organises it. Two dependencies are documented in mouse.

          Taperin, a second taper protein, forms a dense-core-like structure that is disrupted when Fam65b
          is absent - so the compartment loses its architecture, not just one of its components. And RIPOR2
          is not self-organising: RhoC binds it, co-localises with it in stereocilia and regulates its
          oligomerisation, and both the RhoC interaction and the oligomerisation are required for function.
          That places the lesion in a small GTPase module rather than in a structural protein acting alone.

          All of this is mouse work. The claim curated here is about the mechanism, and the human evidence
          for it is the phenotype plus the mislocalisation of the patient allele.'
        cell_types:
        - preferred_term: sensory hair cell
          term:
            id: CL:0000855
            label: sensory hair cell
        cellular_components:
        - preferred_term: stereocilium
          term:
            id: GO:0032420
            label: stereocilium
        biological_processes:
        - preferred_term: Rho protein signal transduction
          term:
            id: GO:0007266
            label: Rho protein signal transduction
        - preferred_term: auditory receptor cell stereocilium organization
          term:
            id: GO:0060088
            label: auditory receptor cell stereocilium organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Taperin, a second protein near the taper, forms a dense-core-like structure that is disrupted
          in the absence of Fam65b.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27269051
      reference_title: Murine Fam65b forms ring-like structures at the base of stereocilia critical for
        mechanosensory hair cell function.
      evidence_source: MODEL_ORGANISM
      explanation: The dependency that makes this a compartment-organisation defect rather than the loss
        of one protein.
