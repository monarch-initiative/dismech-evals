      reference_title: Murine Fam65b forms ring-like structures at the base of stereocilia critical for
        mechanosensory hair cell function.
      evidence_source: IN_VITRO
      explanation: 'The authors'' own reading of what the rescue establishes: a direct structural role
        rather than a developmental knock-on. That is what makes the model a rescue system for this node.'
