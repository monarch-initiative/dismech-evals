      assertion_type: Discussion
      assertion:
        discussion_id: gap_ripor2_domain_and_causal_intermediates
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Biallelic RIPOR2 Loss-of-Function Variant
        - pathophysiology#Reduced Cochlear MYH9 Abundance
        - pathophysiology#Disorganisation of the Taper Compartment
        prompt: Which structural and molecular dependencies directly mediate RIPOR2-related hearing loss?
        rationale: The PX–BAR assignment was challenged by sequence/structure analysis, and the authors
          agreed that experimental confirmation was needed. MYH9 abundance, tubulin acetylation and taperin
          localization change in null mice, but their relative causal contributions are unresolved. The
          RL/AA construct alters both RhoC binding and basal self-association. Selective rescue and structural
          studies are needed to distinguish these possibilities.
      selected_evidence:
        snippet: Secondary structure predictions of FAM65 do not reveal any similarity to the PX–BAR family
          of molecules.
        supports: SUPPORT
