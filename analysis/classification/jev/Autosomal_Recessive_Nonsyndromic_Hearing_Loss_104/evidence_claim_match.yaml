        description: DFNA21 is associated with the heterozygous RIPOR2 c.1696_1707del (p.Gln566_Lys569del)
          founder allele. Onset was highly variable, from congenital to age 70, although typically later
          than recessive DFNB104. The dominant molecular mechanism remains uncertain.
        distinguishing_features:
        - Specific heterozygous p.Gln566_Lys569del allele and dominant segregation
        - Variable onset and progressive course; onset alone is not diagnostic
        - The recessive splice allele also produces an in-frame deletion, so broad variant class is insufficient
      selected_evidence:
        snippet: Hearing loss associated with the deletion in 63 subjects displayed variable audiometric
          characteristics and an average (SD) age of onset of 30.6 (14.9) years (range 0-70 years).
