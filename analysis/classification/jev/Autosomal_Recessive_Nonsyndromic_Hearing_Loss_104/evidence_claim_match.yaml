            label: RIPOR2
        association: 'Biallelic loss-of-function variants in RIPOR2 cause DFNB104. The gene-disease claim
          rests on perfect cosegregation in a large consanguineous Turkish kindred, functional demonstration
          that the mutant protein fails to reach the plasma membrane, expression of the wild-type protein
          in the right cells at the right developmental stages, and loss of hair cells on knockdown in
          zebrafish - all in the founding report - with an unrelated Tunisian family and a second allele
          added later.

          RIPOR2 is also a dominant deafness gene, and that is a separate disease. A heterozygous 12-nucleotide
          in-frame deletion causes adult-onset progressive hearing loss and is a frequent, highly penetrant
          founder allele in the Netherlands. Variant class and zygosity, not the gene, decide which disease
          a patient has.'
      selected_evidence:
        snippet: We conclude that FAM65B is a plasma membrane-associated protein of hair cell stereocilia
          that is essential for hearing.
        supports: SUPPORT
