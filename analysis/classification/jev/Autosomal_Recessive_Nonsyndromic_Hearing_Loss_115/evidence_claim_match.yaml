        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Sphingosine-1-Phosphate Export
        biological_scale: MOLECULAR
        description: Sphingosine-1-phosphate is made inside the cell by the sphingosine kinases and has
          to be exported to reach its G-protein-coupled receptors on the outside. SPNS2 is one of a small
          set of plasma-membrane exporters that perform that step and is the principal one in several
          tissues. Losing it leaves S1P stranded intracellularly, so downstream S1P receptor signalling
          in the tissues that depend on SPNS2 for their local supply is lost without S1P synthesis being
          touched.
        molecular_functions:
        - preferred_term: sphingosine-1-phosphate export across the plasma membrane
          modifier: DECREASED
          term:
            id: GO:0046624
            label: sphingolipid intramembrane carrier activity
        biological_processes:
        - preferred_term: sphingosine-1-phosphate receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0003376
            label: sphingosine-1-phosphate receptor signaling pathway
        - preferred_term: lipid transport
          modifier: DECREASED
          term:
            id: GO:0006869
            label: lipid transport
      selected_evidence:
        snippet: Sphingosine-1-phosphate (S1P) is a signaling lysolipid critical to heart development,
          immunity, and hearing.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39820269
      reference_title: Transport and inhibition of the sphingosine-1-phosphate exporter SPNS2.
      evidence_source: IN_VITRO
      explanation: That the exported lipid is itself the signalling molecule, and that hearing is one
        of the processes it is required for.
