  830cb6113df4b23ea1c6db8d0520f957bc833fbe88cb81b71be00fc45605b964:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 115
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 115
            term:
              id: MONDO:0032762
              label: hearing loss, autosomal recessive 115
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SPNS2 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: 'Two damaged copies of SPNS2, which encodes a major facilitator superfamily transporter
          that exports sphingosine-1-phosphate across the plasma membrane. The four reported human alleles
          span two mutation classes: truncating changes that should abolish the protein (a frameshift,
          p.Pro356Cysfs, and a nonsense allele, p.Trp302Ter) and in-frame changes that leave a full-length
          protein (a single-codon deletion, p.Ser319del, and a missense substitution, p.Asp163Asn). No
          patient allele has been assayed for transport activity; what exists is a structural study of
          the transporter showing how pathogenic substitutions abolish export, which is an argument about
          the mechanism class rather than about these four alleles.'
        genes:
        - preferred_term: SPNS2
          term:
            id: hgnc:26992
            label: SPNS2
        genetic_context:
          genes:
          - preferred_term: SPNS2
            term:
              id: hgnc:26992
              label: SPNS2
          allele_type: frameshift, nonsense, in-frame single-codon deletion and missense variants
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Both published probands are compound heterozygous; no homozygous family has been
            reported, which is unusual for a DFNB entity and is why the zygosity slot carries a single
            unambiguous value.
          notes: 'LOSS_OF_FUNCTION is used for the block because FunctionalImpactEnum defines it as a
            complete or partial reduction of normal gene product function, which covers the truncating
            and the in-frame alleles alike. How much of that is measured differs by allele and should
            not be flattened: for the truncating alleles loss is predicted, not demonstrated, and for
            p.Ser319del and p.Asp163Asn the published support is in silico prediction plus absence from
            population databases. The transport-ablating effect of pathogenic SPNS2 substitutions has
            been shown structurally and in export assays, but for other residues.'
      selected_evidence:
        snippet: we identified two novel damaging variants of c.906G>A; p.(Trp302*) and c.487G>A; p.(Asp163Asn)
          in the SPNS2 gene in an eight-year-old female with bilateral sensorineural hearing loss
        supports: SUPPORT
