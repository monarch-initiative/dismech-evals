  fd05ed6281051b5a45aa69c95249101a6f8bd4dd9d2a30e10c0e160c5afa69a1:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 115
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 115
            term:
              id: MONDO:0032762
              label: hearing loss, autosomal recessive 115
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive Sensory Hair Cell Degeneration
        biological_scale: CELLULAR
        description: 'Sensory hair cells in the organ of Corti degenerate progressively in Spns2 mutants.
          The evidence that this is secondary rather than primary is twofold: it is not the earliest defect,
          and restoring Spns2 expression early enough protects the hair cells, which a cell-autonomous
          hair cell lesion would not permit.'
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        biological_processes:
        - preferred_term: death of cochlear hair cells
          modifier: INCREASED
          term:
            id: GO:0008219
            label: cell death
        notes: The process was originally bound to GO:1905584 outer hair cell apoptotic process, which
          asserted more than the source does in two directions at once. The only evidence here is that
          hair cells degenerate; neither cited paper measures apoptosis, and the cached text of PMID:25356849
          contains no mention of apoptosis, TUNEL or caspase. The node also covers inner as well as outer
          hair cells, so an outer-hair-cell-specific term was narrower than the claim on the cell-type
          axis too. GO:0008219 cell death says what is observed - hair cells are lost - without naming
          a death programme nobody has established.
      selected_evidence:
        snippet: Early activation of Spns2 not only led to improvement in auditory function but also to
          protection of sensory hair cells from secondary degeneration.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37552762
      reference_title: Reversal of an existing hearing loss by gene activation in Spns2 mutant mice.
