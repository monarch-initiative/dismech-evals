              label: hearing loss, autosomal recessive 115
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counselling and Cascade Testing
        description: Counselling for a recessive condition with a 25 percent sibling recurrence risk.
          Both probands are compound heterozygous rather than homozygous, and in the first the two alleles
          were shown to come one from each parent, so carrier testing of parents and siblings is informative
          in a way that a homozygous consanguineous pedigree does not require. Counselling does not act
          on the mechanism; it is curated because it is the only intervention the genotype itself indicates.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: No treatment of any kind is reported for either published proband - not a hearing aid,
          not a cochlear implant, not audiological follow-up beyond the diagnostic assessment. This entry
          therefore curates no amplification or implantation treatment. Both are standard care for childhood
          sensorineural hearing loss and would look right here, and one proband reaches the severe-to-profound
          range in one ear where implantation is normally considered; but attributing either to these
          patients would be importing an indication recorded only in other people. Spns2 gene reactivation,
          which does act on the mechanism, is curated under animal_models rather than here, because it
          has been done only in mice.
      selected_evidence:
        snippet: Sanger sequencing confirmed that the variants are compound heterozygote.
        supports: SUPPORT
