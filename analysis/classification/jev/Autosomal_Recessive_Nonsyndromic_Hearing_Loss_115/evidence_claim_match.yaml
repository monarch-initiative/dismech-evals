      assertion_type: Pathophysiology
      assertion:
        name: Stria Vascularis Disorganization
        biological_scale: TISSUE
        description: 'The stria vascularis is the vascularised epithelium of the cochlear lateral wall
          that generates the endocochlear potential. In Spns2 mutant mice the lateral wall shows structural
          change at the marginal cell boundaries and in the strial capillaries. The barrier itself is
          not leaky: permeability of the strial boundaries and capillaries was normal, so this is a structural
          and functional derangement of the epithelium rather than a breakdown of the blood-labyrinth
          barrier.

          Nothing equivalent has been examined in a person with DFNB115. This node is model-organism inference.'
        locations:
