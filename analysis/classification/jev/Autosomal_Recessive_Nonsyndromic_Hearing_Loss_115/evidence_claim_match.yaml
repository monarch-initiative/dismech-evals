          African and Cameroonian study screened 25 patients with nonsyndromic hearing impairment, plus
          40 exomes, specifically for the two SPNS2 alleles reported in the first proband, and found neither.
          That is evidence those particular alleles are not a recurring cause in those populations, not
          evidence about SPNS2 overall; the same study found one novel heterozygous SPNS2 missense variant
          in a Cameroonian patient.'
