            description: A genetic null fish made for the cardiac phenotype, which also has otic vesicle
              dysgenesis and touch insensitivity. It is included here because it is the only genetic (as
              opposed to morpholino) loss-of-function animal in which ear phenotypes have been looked
              at.
            notes: The cardiac phenotype of this model - linearized hearts, bradycardia, reduced vesicle
