      assertion_type: Treatment
      assertion:
        name: Genetic Counselling and Cascade Testing
        description: Counselling for a recessive condition in a consanguineous family with eight affected
          members, where the sibling recurrence risk is 25 percent and carrier frequency within the kindred
          is high. Counselling does not act on the mechanism; it is curated because it is the only intervention
          the genotype itself indicates.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'No treatment is reported for any member of the DFNB123 family - no hearing aid, no cochlear
          implant, no audiological follow-up beyond the diagnostic assessment. Cochlear implantation is
          standard care for bilateral severe-to-profound loss and would look right here, but attributing
          it to these patients would import an indication recorded only in other people. The one thing
          the source does say about intervention is general: that prompt recognition and intervention
          are crucial to optimize outcomes in congenital hearing impairment, which is quoted under diagnosis
          rather than as a treatment.

          The deep-research sweep committed with this entry reached the same position independently and
          sharpened the reason. It found no DFNB123-specific drug, gene, RNA or cell therapy and no relevant
          clinical trial, and it located exactly one cochlear-implant datapoint in the STX4 literature:
          the homozygous p.Arg240Trp patient, implanted at age six with improved communication. That patient
          has the syndromic presentation, not DFNB123, so the one implantation outcome on record belongs
          to the other end of the allelic spectrum. Curating implantation here on the strength of it would
          attach a different genotype''s outcome to this entity.'
      selected_evidence:
        snippet: This identified a homozygous splice region variant in STX4 (c.232 + 6T>C), which causes
          exon skipping and a frameshift, that segregated with HI (two-point logarithm of odds (LOD) score
          = 5.9).
        supports: SUPPORT
