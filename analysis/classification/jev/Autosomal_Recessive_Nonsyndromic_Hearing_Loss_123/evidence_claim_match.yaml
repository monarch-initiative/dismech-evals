          term:
            id: UBERON:0002227
            label: spiral organ of cochlea
      selected_evidence:
        snippet: In silico analysis showed that murine orthologue Stx4a is highly and widespread expressed
          in the developing and adult inner ear.
        supports: SUPPORT
