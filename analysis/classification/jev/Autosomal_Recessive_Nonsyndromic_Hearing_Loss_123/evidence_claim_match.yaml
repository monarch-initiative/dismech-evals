        description: FM1-43 uptake in neuromast hair cells is a direct cellular measurement of mechanotransduction,
          at the scale of the node.
        limitations: Three separate gaps sit between this model and the human disease. Neuromast hair
          cells belong to the lateral line, not the cochlea, and a fish has no cochlea at all. The knockdown
