        target: Disturbed Inner Ear Development
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: TISSUE
        description: Otic vesicle dysgenesis is a direct tissue-level observation of disturbed ear development.
        limitations: The otic vesicle is the embryonic precursor of the whole inner ear in a fish and
          is not a cochlea; no human DFNB123 patient has had inner ear imaging, so there is no human counterpart
          to compare with. The model was also made and characterised for a cardiac phenotype that DFNB123
          patients do not have, which is itself the open question this entry files as a discussion.
      selected_evidence:
        snippet: CRISPR/Cas9-generated stx4 mutant zebrafish exhibited defects reminiscent of these patients'
          clinical presentations, including linearized hearts, bradycardia, otic vesicle dysgenesis, neuronal
          atrophy, and touch insensitivity by 3 days post fertilization.
        supports: SUPPORT
