      assertion:
        name: Bilateral Severe-to-Profound Hearing Impairment
        category: Ear
        description: The only feature reported in the DFNB123 family, in all eight affected individuals.
          The source describes it as bilateral and severe-to-profound. It does not say sensorineural,
          which is why the bound term is a severity term rather than a sensorineural one; the sensorineural
          character of STX4-related hearing loss is documented in the separately reported syndromic patient
          rather than in this family.
        frequency: OBLIGATE
        phenotype_term:
          preferred_term: Bilateral severe-to-profound hearing impairment
          term:
            id: HP:0012714
            label: Severe hearing impairment
        notes: 'OBLIGATE with a denominator of eight affected individuals in one family. A nonsyndromic
          deafness entity is ascertained through its hearing loss, so the band carries no information
          about penetrance.

          On the binding being narrower than the claim: HPO splits the severity axis into HP:0012714 Severe
          hearing impairment and HP:0012715 Profound hearing impairment, with no combined severe-to-profound
          term and no bilateral term that leaves the sensorineural question open. Checked against the
          live ontology on 2026-09-17. The entry therefore binds the lower bound of the reported range
          and carries the full range in preferred_term. A second phenotype for the profound end is not
          curated because no per-individual audiogram is reported, so it would have no denominator and
          could not be given a frequency band. The deep-research report committed with this entry independently
          suggests HP:0000407, HP:0008619, HP:0012714 and HP:0012715 for this phenotype, which corroborates
          the choice without resolving the range problem.

          Two details are deliberately absent because the source does not supply them. Age of onset is
          not stated in the abstract, so no onset phenotype is curated even though OMIM summarises the
          entity as beginning within the first decade - and the deep-research report reaches the same
          conclusion from the full text, noting that the publication describes congenital hearing impairment
          at study level while the individual data do not establish onset in every relative. Audiometric
          configuration and laterality asymmetry are likewise not reported in the abstract.'
      selected_evidence:
        snippet: we used exome sequencing to investigate a large consanguineous Pakistani family with
          eight affected individuals showing bilateral severe-to-profound HI
        supports: SUPPORT
