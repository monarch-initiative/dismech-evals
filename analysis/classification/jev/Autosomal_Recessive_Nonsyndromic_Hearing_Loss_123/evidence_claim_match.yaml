      assertion_type: Pathophysiology
      assertion:
        name: Loss of Syntaxin-4 from the Hair Cell Membrane and Stereocilia
        biological_scale: CELLULAR
        description: 'The reason a general trafficking protein produces isolated deafness is where it
          is. The murine orthologue Stx4a is highly and widely expressed through the developing and adult
          inner ear, and immunofluorescence puts STX4A in three places in both inner and outer hair cells:
          the cell body, the plasma membrane, and the stereocilia. Stereocilial localisation is the finding
          that connects a fusion protein to mechanotransduction, because that is where the transduction
          machinery sits.

          Which of the three pools carries the disease-relevant function is not known, and no patient
          hair cell has been examined.'
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
