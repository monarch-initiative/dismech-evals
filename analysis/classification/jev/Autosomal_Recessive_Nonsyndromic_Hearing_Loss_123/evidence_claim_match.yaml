              label: hearing loss, autosomal recessive 123
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of SNARE-Mediated Membrane Fusion
        biological_scale: MOLECULAR
        description: 'Syntaxin-4 is a target-SNARE: it sits in the plasma membrane and pairs with vesicle
          SNAREs to drive the fusion step of vesicle delivery and recycling. Losing it removes one half
          of that pairing, so vesicles reach the membrane but do not dock and fuse normally. The direct
          demonstration of that failure is in zebrafish heart, where Vamp2-positive vesicles show reduced
          docking at the cardiomyocyte sarcolemma in stx4 mutants. Nothing equivalent has been imaged
          in a hair cell, so the fusion defect is established for the protein and assumed for the ear.'
        molecular_functions:
        - preferred_term: SNARE binding
          modifier: DECREASED
          term:
            id: GO:0000149
            label: SNARE binding
        biological_processes:
        - preferred_term: vesicle fusion at the plasma membrane
          modifier: DECREASED
          term:
            id: GO:0006906
            label: vesicle fusion
        - preferred_term: vesicle-mediated transport
          modifier: DECREASED
          term:
            id: GO:0016192
            label: vesicle-mediated transport
        cellular_components:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
      selected_evidence:
        snippet: STX4, a member of the syntaxin family, is a component of the SNARE machinery involved
          in several vesicle transport and recycling pathways.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36355422
      reference_title: Syntaxin 4 is essential for hearing in human and zebrafish.
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      explanation: The molecular identity of the gene product. BACKGROUND because it restates established
        cell biology rather than reporting this paper's own result.
