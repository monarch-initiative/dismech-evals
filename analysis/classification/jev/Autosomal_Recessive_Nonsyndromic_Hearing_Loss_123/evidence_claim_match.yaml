          and a consequent frameshift. A frameshift early in the transcript predicts a truncated product
          or nonsense-mediated decay, so this is treated as a loss-of-function allele; that prediction
          has not been confirmed by measuring STX4 protein in patient cells.

          The missense allele p.Arg240Trp reported in the syndromic STX4 patients is a different kind
          of change, and its zebrafish equivalent was shown to be hypomorphic rather than null. The two
          alleles are noted together because the contrast is the most likely explanation for the two different
          clinical pictures, but they are not pooled: only the splice allele belongs to DFNB123.'
        genes:
