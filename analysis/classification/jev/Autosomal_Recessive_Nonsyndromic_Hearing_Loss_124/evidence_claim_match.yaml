                label: PKHD1L1
            description: The model that carries nearly all of the mechanism in this entry. Deleting Pkhd1l1
              in hair cells removes the stereocilia surface coat at the tips while leaving development,
              mechanotransduction and tectorial-membrane attachment intact, and produces progressive hearing
              loss beginning at high frequencies. The same line, followed for longer in a second study,
              gives the bundle-maintenance and noise-susceptibility results; a constitutive knockout made
              subsequently reproduces the hearing phenotype, which addresses the possibility that the
              Atoh1-Cre transgene rather than the deletion drives it.
          role: ancestor
