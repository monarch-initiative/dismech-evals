            label: PKHD1L1
        notes: 'PKHD1L1, also called fibrocystin-L, is at 8q23.1 and encodes a 4243-amino-acid type-I
          transmembrane protein: a very large ectodomain built from about fourteen predicted IPT repeats,
          a 20-residue transmembrane segment, and a cytoplasmic tail of roughly eight residues. The proportions
          matter mechanistically - a protein this lopsided is a surface structure, not a signalling receptor,
          and the disease is correspondingly a defect of the stereocilia exterior. It is the paralogue
          of PKHD1, in which biallelic variants cause autosomal recessive polycystic kidney disease; no
          kidney or liver phenotype has been reported in DFNB124.

          The gene has substantial non-cochlear biology that does not belong in this entry. Knockdown
          in the mouse dentate gyrus raises seizure susceptibility through loss of KCC2, it marks a lung
          lymphatic endothelial population, it appears as a candidate prognostic marker in lung adenocarcinoma,
          and it turns up in female-infertility association loci. None of that has a human DFNB124 counterpart,
          and the defining paper says as much about the seizure work specifically. That a gene with this
          much pleiotropy in model systems nevertheless produces a strictly nonsyndromic human phenotype
          is a real observation about the entity, not an omission.'
      selected_evidence:
        snippet: we identify Polycystic Kidney and Hepatic Disease 1-Like 1 (PKHD1L1), a large, mostly
          extracellular protein of 4249 amino acids with a single transmembrane domain
        supports: SUPPORT
        directness: INDIRECT
