          interpretation: Tannic-acid staining intensity across the stereocilia membrane falls at the
            tips in mutants and is unchanged at the bases.
      selected_evidence:
        snippet: PKHD1L1-deficient mice lack the surface coat at the upper but not lower regions of stereocilia,
          and they develop progressive hearing loss.
        supports: SUPPORT
