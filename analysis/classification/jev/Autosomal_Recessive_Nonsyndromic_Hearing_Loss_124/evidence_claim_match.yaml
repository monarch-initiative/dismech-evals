  7dbb55d0e7c7d9ac28c6defa8091a25bc4b9a3dc9b36aafb5ce787eb98a26eb3:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 124
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 124
            term:
              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Stereocilia Bundle Maintenance After Normal Development
        biological_scale: CELLULAR
        description: 'The ordering claim of the entry, and a negative result carries most of it. In PKHD1L1-deficient
          mice the bundle develops normally: cohesion is undisturbed, tectorial-membrane attachment crowns
          form, stereocilin localises correctly to the tips of the tall row, the imprints of the bundle
          in the tectorial membrane are still present at six months, and planar cell polarity is normal.
          Mechanotransduction is intact too - FM1-43, which enters hair cells through open transduction
          channels, loads normally. Only afterwards, from about six weeks of age, does the bundle begin
          to fail. The disease is therefore a failure to maintain a correctly built bundle, not a failure
          to build one.

          The expression time course sharpens what "maintain" can mean here, and it is worth being precise.
          PKHD1L1 protein is present on the bundle only in the first ten postnatal days, is largely gone
          by day 10 and is completely cleared from mature hair cells by day 21 - three weeks before the
          bundle starts to fail. The protein is therefore not present to perform ongoing maintenance.
          What its presence during development must be setting is the durability of the finished bundle,
          which is how the authors themselves put it: expression during development establishes bundles
          robust enough to last.'
        biological_processes:
        - preferred_term: auditory receptor cell stereocilium organization
          modifier: ABNORMAL
          term:
            id: GO:0060088
            label: auditory receptor cell stereocilium organization
        cellular_components:
        - preferred_term: stereocilium bundle
          term:
            id: GO:0032421
            label: stereocilium bundle
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
      selected_evidence:
        snippet: Our findings reveal that PKHD1L1-deficient mice display no disruption to bundle cohesion
          or tectorial membrane attachment-crown formation during development.
        supports: SUPPORT
        directness: INDIRECT
    origin:
