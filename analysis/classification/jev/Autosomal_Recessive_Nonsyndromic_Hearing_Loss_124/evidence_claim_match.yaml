              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb124_onset_species_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Stereocilia Bundle Maintenance
        - pathophysiology#Cochlear Hearing Loss
        prompt: How do developmental timing and allele-specific effects contribute to differences in observed
          auditory onset among humans, mice and zebrafish?
        rationale: Human hearing loss was congenital or presumed congenital; the best-followed proband
          had slow childhood progression. Mouse high-frequency deficits were detected at three or six
          weeks in different studies, and later stereocilia pathology supports a maintenance defect after
          grossly preserved early development. Zebrafish double mutants show larval auditory impairment.
          These observations use different developmental stages, alleles and measurements. Developmental
          timing, residual allele function and species-specific biology are plausible explanations, but
          none is established. Undetectable adult antibody labeling does not prove absence of all PKHD1L1
          protein, and the neonatal FM1-43 assay does not establish normal lifetime transduction.
        proposed_experiments:
        - experiment_id: exp_dfnb124_developmental_timing
          name: Establish when the human lesion appears
          description: Two complementary approaches. First, examine the surface coat and bundle morphology
            in PKHD1L1-deficient mouse cochlea at prenatal and early postnatal ages with the sensitive
            methods used later, to test whether a subtle developmental deficit precedes the six-week onset.
            Second, differentiate hair-cell-like cells from patient-derived induced pluripotent stem cells
            carrying the human alleles and ask whether the coat forms at all, which would separate a construction
            defect from a maintenance defect without needing patient cochlea.
      selected_evidence:
        snippet: in contrast to Pkhd1l1 mutant mice, which develop progressive hearing loss, the double
          mutant zebrafish exhibited statistically significant hearing loss even from the larval stage
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
