          direction: INCREASED
          interpretation: Stereocilia are lost from the shortest row first and from taller rows with age,
            most in the high-frequency base.
        - name: Stereocilin localisation at tectorial-membrane attachment crowns
          target: Failure of Stereocilia Bundle Maintenance After Normal Development
          direction: UNCHANGED
          interpretation: 'A real negative: the attachment-crown protein is where it should be in mutant
            bundles, so crown formation is not the failing step.'
      selected_evidence:
        snippet: These results suggest a role for PKHD1L1 in establishing robust sensory hair bundles
          during development, necessary for maintaining bundle cohesion and function in response to acoustic
          trauma and aging.
