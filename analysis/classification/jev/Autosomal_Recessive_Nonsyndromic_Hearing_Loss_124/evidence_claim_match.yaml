            term:
              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Environmental
      assertion:
        name: Moderate acoustic overexposure
        description: A noise dose in the temporary-threshold-shift range. In PKHD1L1-deficient mice a
          two-hour exposure to 94 dB SPL bandpass noise at six weeks of age produces a permanent threshold
          shift, where genotype-matched controls given the same exposure recover to baseline within two
          weeks. This is the one modifiable factor identified for this disease, and it has been tested
          only in mice.
        exposure_term:
          preferred_term: exposure to sound radiation
          term:
            id: ECTO:8000044
            label: exposure to sound radiation
        notes: No human data. Nobody has measured noise susceptibility, occupational or recreational noise
          history, or threshold trajectory after noise in a person with DFNB124, and the human paper names
          this as an open question. The exposure is curated because the structural claim - that this genotype
          converts a survivable noise dose into a destructive one - is a real one with an obvious clinical
          implication if it holds in people, not because it has been shown in people.
      selected_evidence:
        snippet: Furthermore, PKHD1L1-deficient mice are susceptible to permanent hearing loss following
          moderate acoustic overexposure, which induces only temporary hearing threshold shifts in wild-type
          mice.
        supports: SUPPORT
        directness: INDIRECT
