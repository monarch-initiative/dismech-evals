  344927aaf648833902705e68bc931fd9aabc0a05700b82409940546616d2d1b9:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 124
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 124
            term:
              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb124_family3_myo7a_confound
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - phenotypes#Severe Hearing Impairment
        - genetic#PKHD1L1
        prompt: Is the severe end of the DFNB124 range real, or does it belong to a second gene?
        rationale: 'Family 3 supplies the severe pole of this disease''s reported severity range and is
          the weakest of the four families.

          Its proband is homozygous for PKHD1L1 p.(His2479Gln) and also homozygous for MYO7A p.(Leu375Val).
          MYO7A is a well-established deafness gene; PKHD1L1 was not one when this family was studied.
          Both variants were covered by more than 150 high-quality reads, so this is not a calling artefact.
          The MYO7A variant was deprioritised because in silico predictions were neutral and the affected
          residue is not conserved - which is reasonable triage and is not functional evidence. No functional
          assay was done on either variant in this family, and no further follow-up of the individual
          was possible.

          The authors are explicit that three readings remain open: the PKHD1L1 variant is causal, the
          PKHD1L1 variant is incidental and MYO7A is causal, or both contribute to a loss more severe
          than PKHD1L1 alone would give. The third would explain why this is the most severely affected
          proband in the series.

          Two consequences for how the entry reads. The severe phenotype is curated as OCCASIONAL with
          the confound recorded on it, not as an established part of the range. And the p.(His2479Gln)
          allele is the one PKHD1L1 missense variant with no direct functional data - the nanoDSF work
          was done on the Family 1 alleles, and this one rests on an AlphaFold2 model placing it in a
          conserved site.'
        proposed_experiments:
        - experiment_id: exp_dfnb124_his2479gln_function
          name: Functional test of PKHD1L1 p.(His2479Gln) and MYO7A p.(Leu375Val)
          description: Apply to p.(His2479Gln) the same nanoDSF thermal-stability assay used on the Family
            1 alleles, on a recombinant fragment spanning the predicted nickel-binding site, and test
            the MYO7A variant in a motor-function or trafficking assay. A destabilising result for the
            PKHD1L1 allele and a neutral one for MYO7A would settle which gene the severe phenotype belongs
            to.
      selected_evidence:
        snippet: The homozygous variant in MYO7A, with a coverage of 198 high quality reads, was deprioritized
          given uncertain and neutral in silico predictions with respect to impact on protein structure
          and function
        supports: SUPPORT
