              floxed littermates recover to baseline by two weeks. Post-noise mutant bundles show missing
              or shortened tall-row stereocilia and disorganization. This genotype-dependent vulnerability
              is demonstrated in mice; increased susceptibility in humans remains untested.
            exposure_term:
              preferred_term: exposure to sound radiation
              term:
                id: ECTO:8000044
                label: exposure to sound radiation
            notes: This is a mouse modifier experiment in a genetic hearing disorder. Human DFNB124 noise
              susceptibility and prevention efficacy have not been established in the cited studies.
          role: ancestor
