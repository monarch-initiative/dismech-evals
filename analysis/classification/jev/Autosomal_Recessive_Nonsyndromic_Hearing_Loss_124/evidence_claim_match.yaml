        environmental_effect: EXACERBATES
        causal_link_type: DIRECT
        description: The exposure is what converts the latent bundle fragility into permanent damage.
          It does not cause the disease - the mutant bundle deteriorates with age without any noise challenge
          - so the effect is EXACERBATES rather than TRIGGERS.
      selected_evidence:
        snippet: These data therefore show the noise exposure, normally only sufficient to cause TTS in
