      assertion_type: Discussion
      assertion:
        discussion_id: dfnb124_family3_myo7a_confound
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - phenotypes#Severe Hearing Impairment
        - genetic#PKHD1L1
        prompt: Is the severe end of the DFNB124 range real, or does it belong to a second gene?
        rationale: Family 3 carries homozygous PKHD1L1 p.His2479Gln and MYO7A p.Leu375Val. Both calls
          had high read coverage, but parental segregation and functional testing were unavailable. MYO7A
          was deprioritized using prediction and conservation, which does not exclude pathogenicity. The
          source explicitly allows PKHD1L1 causation, incidental PKHD1L1 variation, or contributions from
          both genes. Audiometry was performed in ambient noise without a soundproof environment. Severe
          loss is retained as a reported observation with attribution uncertainty and without a frequency
          estimate.
        proposed_experiments:
        - experiment_id: exp_dfnb124_his2479gln_function
          name: Functional test of PKHD1L1 p.(His2479Gln) and MYO7A p.(Leu375Val)
          description: Assess both variants in appropriately validated functional systems, alongside segregation
            and additional unrelated cases when available. Fragment stability and MYO7A motor/trafficking
            assays could add evidence, but neither a positive nor a negative isolated assay would by itself
            settle clinical causation.
      selected_evidence:
        snippet: The homozygous variant in MYO7A, with a coverage of 198 high quality reads, was deprioritized
          given uncertain and neutral in silico predictions with respect to impact on protein structure
          and function
        supports: SUPPORT
