      assertion_type: Genetic
      assertion:
        name: PKHD1L1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: PKHD1L1
          term:
            id: hgnc:20313
            label: PKHD1L1
        notes: 'Reported genotypes, using NM_177531.6 and NP_803875.2, were c.385G>A/p.Gly129Ser in trans
          with c.3941G>T/p.Gly1314Val; homozygous c.10141C>T/p.Arg3381Ter; homozygous c.7437C>A/p.His2479Gln;
          and c.1813G>A/p.Gly605Arg in trans with c.8452_8468del/p.Leu2818TyrfsTer5. Functional evidence
          differs among alleles: recombinant mouse-fragment stability assays support the first pair, and
          minigene splicing supports c.1813G>A. Truncation/decay effects are predicted; p.His2479Gln remains
          particularly uncertain because of the competing MYO7A variant and absent parental segregation.
          These are reported disease-associated alleles, not a blanket clinical classification of pathogenicity.
          The human paper describes a 4243-residue protein; the mouse papers use a 4249-residue sequence.
          PKHD1L1 is distinct from PKHD1, the polycystic-kidney-disease gene.'
      selected_evidence:
        snippet: Here we provide data to support that mutations in PKHD1L1 cause human nonsyndromic autosomal
          recessive congenital, mild–moderate to severe SNHL.
        supports: SUPPORT
