    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 124
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 124
            term:
              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PKHD1L1 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: 'Two damaged copies of PKHD1L1, which encodes a 4243-amino-acid protein that is almost
          entirely extracellular - a large ectodomain of IPT repeats, a single transmembrane helix, and
          a cytoplasmic tail of only a handful of residues. The reported human alleles span the mutation
          classes: a nonsense variant p.(Arg3381Ter) predicted to trigger nonsense-mediated decay, a frameshift
          p.(Leu2818TyrfsTer5), a variant annotated as missense, p.(Gly605Arg), that a minigene assay
          shows is really a splice allele causing exon 17 skipping, and two missense alleles whose recombinant
          protein fragments are measurably destabilised.'
        genes:
        - preferred_term: PKHD1L1
          term:
            id: hgnc:20313
            label: PKHD1L1
        genetic_context:
          genes:
          - preferred_term: PKHD1L1
            term:
              id: hgnc:20313
              label: PKHD1L1
          allele_type: nonsense, frameshift, splice-disrupting and destabilising missense variants
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Two families are homozygous and two compound heterozygous. The zygosity slot records
            COMPOUND_HETEROZYGOUS because that is the configuration in the family with the fullest functional
            workup; the homozygous families are described here rather than by a second value, since the
            slot is single-valued.
          notes: LOSS_OF_FUNCTION is used for the block because FunctionalImpactEnum defines it as "complete
            or partial reduction of normal gene product function", which covers both the nonsense allele
            and the destabilising missense ones. It is worth being explicit about how much of that is
            measured. For p.(Arg3381Ter) the loss is predicted from nonsense-mediated decay, not demonstrated.
            For the two missense alleles what was measured is a fall in the thermal-folding stability
            of recombinant protein fragments - about 6 degrees of onset temperature for p.(Gly129Ser)
            and about 9 degrees of melting temperature for p.(Gly1314Val) - which is a strong argument
            that the folded protein is less stable, and an inference rather than a demonstration that
            PKHD1L1 function in a hair bundle is reduced. No patient hair cell has been examined.
      selected_evidence:
        snippet: The proband was compound heterozygous for missense variants, c.385G>A, p.(Gly129Ser)
          and c.3941G>T, p.(Gly1314Val)
        supports: SUPPORT
