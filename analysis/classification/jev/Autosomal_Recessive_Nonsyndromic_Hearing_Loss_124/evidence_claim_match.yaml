  33f5a06ad353b170d389eeccb630ace515c6dbaf2d127b6267c3bd2f1e0ed6f5:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 124
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 124
            term:
              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb124_onset_species_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of Stereocilia Bundle Maintenance After Normal Development
        - pathophysiology#Progressive Cochlear Hearing Loss
        prompt: Why does the mouse hear normally and then deteriorate, when the humans and the zebrafish
          are impaired from the start?
        rationale: 'Filed as a mismatch rather than a knowledge gap because the experiments were done
          and the answers disagree.

          The mouse is unambiguous. Bundles develop normally, cohesion and tectorial-membrane attachment
          are intact, mechanotransduction works, and only from six weeks do stereocilia start to disappear.
          The whole mechanistic account in this entry - a coat that is needed for maintenance rather than
          for construction - rests on that ordering.

          The humans do not fit it. All four probands presented congenitally or within the first months,
          and the best-followed of them changed by 5 to 8 dB over nine years. That is a disease that is
          already established at birth and then barely moves, which is close to the inverse of the mouse.
          The zebrafish double mutant sits on the human side: impaired as a larva.

          Several explanations are available and none has been tested. Human cochlear development is largely
          complete before birth while the mouse cochlea matures postnatally, so a mouse deficit that appears
          at six weeks may correspond to a human deficit that appears in utero - in which case the two
          are the same lesion on different clocks and there is no real mismatch, and it is the explanation
          the expression data most favour: PKHD1L1 protein is on the bundle only for the first ten postnatal
          days in the mouse and is completely cleared by day 21, three weeks before the bundle begins
          to fail, so whatever it does it does during development and the later failure is a delayed consequence.
          Shift that developmental window to its human equivalent, which closes before birth, and a congenital
          human phenotype is what the same mechanism predicts. Alternatively the human alleles are hypomorphic
          rather than null, which would predict a milder and different course from a conditional knockout;
          the two missense alleles are destabilising rather than abolishing. Or the coat may simply do
          more in the developing human bundle than in the mouse.

          Why it matters for how this entry should be read: the maintenance-not-construction claim, which
          is the most interesting thing about the disease, is a mouse claim. If the human lesion turns
          out to be developmental, most of the pathograph would need re-reading - although the coat''s
          identity and its compartmental restriction would survive intact.'
        proposed_experiments:
        - experiment_id: exp_dfnb124_developmental_timing
          name: Establish when the human lesion appears
          description: Two complementary approaches. First, examine the surface coat and bundle morphology
            in PKHD1L1-deficient mouse cochlea at prenatal and early postnatal ages with the sensitive
            methods used later, to test whether a subtle developmental deficit precedes the six-week onset.
            Second, differentiate hair-cell-like cells from patient-derived induced pluripotent stem cells
            carrying the human alleles and ask whether the coat forms at all, which would separate a construction
            defect from a maintenance defect without needing patient cochlea.
      selected_evidence:
        snippet: Anti-PKHD1L1 labeling intensity gradually decreased with development, was largely gone
          by P10, and completely cleared in mature hair cells at P21.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39482437
      reference_title: PKHD1L1 is required for stereocilia bundle maintenance, durable hearing function
        and resilience to noise exposure.
      evidence_source: MODEL_ORGANISM
      explanation: 'The observation that makes the developmental-timing explanation the leading one: the
        protein is absent from the bundle for three weeks before the phenotype appears, so the mouse lesion
        is set during development even though it is read out in adulthood.'
