          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 124
            term:
              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb124_noise_untested_in_humans
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Resilience to Acoustic Overexposure
        - treatments#
        prompt: Are people with DFNB124 more vulnerable to noise, and should they be counselled to avoid
          it?
        rationale: 'This is the gap with the most direct clinical consequence in the entry, and it is
          completely open.

          The mouse result is clean: a dose that gives wild-type mice a temporary threshold shift gives
          PKHD1L1-deficient mice a permanent one, with tall-row stereocilia damage to match. If that transferred,
          it would mean that a child with DFNB124 has a modifiable risk factor - noise avoidance and hearing
          protection - on top of an otherwise untreatable condition.

          Nothing about it has been tested in a person. The human paper names age and noise trauma as
          open questions rather than reporting on them. No noise history is recorded for any of the four
          probands, no threshold trajectory around a noise exposure exists, and the oldest patient is
          thirteen, so the cumulative-exposure years where it would matter most have not happened yet.

          The entry therefore curates the exposure structurally, as an environmental entry with an EXACERBATES
          link and a PROVISIONAL node, and does not curate noise avoidance as a treatment. The distinction
          is not pedantry: a treatments entry would read as a recommendation for these patients, and no
          such recommendation has been made by anyone who has seen one.

          Closing the gap needs no new technology - a noise history and serial audiometry in the existing
          patients, or a targeted question in the next cohort report, would start it.'
      selected_evidence:
        snippet: Further research will be needed to determine the effect of age or noise trauma on the
          potential progression of PKHD1L1-linked hearing loss.
        supports: NO_EVIDENCE
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
