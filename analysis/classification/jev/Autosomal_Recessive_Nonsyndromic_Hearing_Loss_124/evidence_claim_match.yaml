        name: PKHD1L1 sequencing in unexplained bilateral congenital sensorineural hearing loss
        description: Exome sequencing identified the four reported biallelic genotypes, including Family
          4 through reanalysis. General genetic-hearing-loss guidance supports a multigene panel or genomic
          testing, with explicit confirmation that PKHD1L1 is covered. Interpret variants with segregation,
          phase, current pathogenicity assessment and the phenotype; a pair of uncertain variants does
          not by itself establish causation. Family 3 illustrates the need to investigate competing genes.
      selected_evidence:
        snippet: can often identify the cause of genetic hearing loss while limiting identification of
          pathogenic variants and variants of uncertain significance in genes that are irrelevant to the
          underlying phenotype.
