        description: 'In all four families the diagnosis came from exome sequencing performed for undiagnosed
          recessive hearing loss, not from a targeted test - PKHD1L1 was not on hearing-loss gene panels
          when these families were studied. The practical consequence the authors draw is that PKHD1L1
          should now be included, and specifically that it should be looked for in the mild-to-moderate
          range, where testing is less often pursued. The one interpretive trap in the series is worth
          carrying into practice: in the family with the most severe loss, a homozygous MYO7A variant
          was found alongside the homozygous PKHD1L1 variant, and which one is causal was not resolved.'
