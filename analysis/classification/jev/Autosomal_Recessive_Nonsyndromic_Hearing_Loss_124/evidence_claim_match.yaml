        rationale: Conditional knockout mice retain hearing deficits after a noise exposure from which
          control littermates recover. The human series did not establish genotype-specific noise susceptibility.
          General hearing-conservation counseling is appropriate under genetic-hearing-loss guidance,
          independently of this unresolved mouse-to-human extrapolation. Longitudinal audiometry and exposure
          histories could test whether an additional DFNB124-specific vulnerability exists.
