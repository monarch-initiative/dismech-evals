            term:
              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the Stereocilia Surface Coat at Stereocilia Tips
        biological_scale: MOLECULAR
        description: PKHD1L1 is the first identified molecular component of the electron-dense surface
          coat on hair-cell stereocilia. Immunogold electron microscopy puts it towards the stereocilia
          tips, at highest density in the top 300 nanometres, in all three rows and preferentially in
          the high-frequency base of the cochlea. Mice lacking it in hair cells lose the coat at the upper
          part of the stereocilia while the coat at the bases is unaffected - so the coat is not one substance,
          and PKHD1L1 accounts for the upper portion of it.
        cellular_components:
        - preferred_term: stereocilium coat
          modifier: ABSENT
          term:
            id: GO:0120234
            label: stereocilium coat
        - preferred_term: stereocilium tip
          term:
            id: GO:0032426
            label: stereocilium tip
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        locations:
        - preferred_term: organ of Corti
          term:
            id: UBERON:0002227
            label: spiral organ of cochlea
      selected_evidence:
        snippet: PKHD1L1-deficient mice lack the surface coat at the upper but not lower regions of stereocilia,
          and they develop progressive hearing loss.
        supports: SUPPORT
        directness: INDIRECT
    origin:
