              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No prevalence estimate exists. Four unrelated families - from the United States, Iran,
          Pakistan and China - have been reported, in one 2024 paper. The geographic spread is worth noting
          because it argues against a founder effect and for the gene being genuinely, if rarely, mutated
          worldwide. The defining paper argues the true frequency is probably higher than the case count
          suggests, on the grounds that mild-to-moderate hearing loss is under-tested; that is an argument
          about ascertainment rather than a measurement, and no rate_per_100000 is given because none
          has been reported.

          One real denominator does exist and is worth recording even though it cannot be turned into
          a rate: the fourth proband was found in a Henan cohort of 1450 hearing loss probands, and only
          on reanalysis of an exome that had first been read as negative. One family in 1450 ascertained
          hearing-loss probands is a ceiling on how common this is among people already referred for deafness
          genetics, not a population figure.'
      selected_evidence:
        snippet: Exome sequencing was performed on DNA of four families segregating autosomal recessive
          nonsyndromic sensorineural hearing loss.
        supports: SUPPORT
