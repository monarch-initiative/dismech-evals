            term:
              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive Cochlear Hearing Loss
        biological_scale: ORGANISM
        conforms_to: sensorineural_hair_cell_loss#Progressive Sensorineural Hearing Loss
        description: 'The clinical endpoint: bilateral sensorineural hearing loss of cochlear origin,
          ranging from mild-moderate to severe. In the mouse it begins at high frequencies and spreads
          to lower ones with age, in both the conditional and the constitutive knockout. In humans it
          is present from early childhood and worsens slowly rather than steeply.'
        biological_processes:
        - preferred_term: sensory perception of sound
          modifier: DECREASED
          term:
            id: GO:0007605
            label: sensory perception of sound
        notes: 'Only this node declares conformance to sensorineural_hair_cell_loss, and the omissions
          are deliberate rather than incomplete curation. The module''s chain runs insult to "Cochlear
          Ionic Homeostasis Disruption and Oxidative Stress" to "Hair Cell Mechanotransduction Failure
          and Death". Neither middle node can be conformed here. There is no evidence of any ionic or
          oxidative disturbance in PKHD1L1 deficiency - it has not been looked for - and conforming to
          the mechanotransduction node would assert something the data contradict: FM1-43 loads normally
          in PKHD1L1-deficient hair cells, so transduction is not the failing step. The module''s own
          notes invite hereditary nonsyndromic deafness to substitute a stereocilia gene at the insult
          node, and that would be defensible for the PKHD1L1 node, but a conformance that then skips two
          of the module''s three intermediate steps says less than it appears to. The terminal node is
          where the two accounts genuinely meet.'
      selected_evidence:
        snippet: Both conditional and constitutive PKHD1L1 knockout mice develop high-frequency hearing
          loss progressing to lower frequencies with age.
        supports: SUPPORT
        directness: INDIRECT
