              Two further limits belong on the result itself. Threshold shifts were measured against an
              80 dB SPL ceiling, and the mutants'' baseline high-frequency thresholds already sit near
              that ceiling, so the measured shift understates the damage at exactly the frequencies where
              the disease is worst. And the exposure paradigm is a single laboratory dose, not the chronic,
              variable noise history a person accumulates.'
