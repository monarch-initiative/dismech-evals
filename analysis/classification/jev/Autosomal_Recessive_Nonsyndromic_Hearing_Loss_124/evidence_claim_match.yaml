        biological_scale: TISSUE
        description: Distortion product otoacoustic emissions are the direct readout of outer hair cell
          function, and they fail. In the mouse, DPOAE thresholds are elevated from three weeks in the
          high-frequency region and progress with age. In humans, the proband of the Chinese family had
          absent DPOAEs with normal tympanograms, which the authors read as outer hair cell dysfunction.
          Because mechanotransduction is intact in the mutant, this is a failure of the amplifier through
          a degrading bundle rather than a failure of the transduction apparatus.
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
