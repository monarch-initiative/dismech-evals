            name: Moderate acoustic overexposure
            description: A noise dose in the temporary-threshold-shift range. In PKHD1L1-deficient mice
              a two-hour exposure to 94 dB SPL bandpass noise at six weeks of age produces a permanent
              threshold shift, where genotype-matched controls given the same exposure recover to baseline
              within two weeks. This is the one modifiable factor identified for this disease, and it
              has been tested only in mice.
            exposure_term:
              preferred_term: exposure to sound radiation
              term:
                id: ECTO:8000044
                label: exposure to sound radiation
            notes: No human data. Nobody has measured noise susceptibility, occupational or recreational
              noise history, or threshold trajectory after noise in a person with DFNB124, and the human
              paper names this as an open question. The exposure is curated because the structural claim
              - that this genotype converts a survivable noise dose into a destructive one - is a real
              one with an obvious clinical implication if it holds in people, not because it has been
              shown in people.
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Reduced Resilience to Acoustic Overexposure
        environmental_effect: EXACERBATES
        causal_link_type: DIRECT
        description: The exposure is what converts the latent bundle fragility into permanent damage.
          It does not cause the disease - the mutant bundle deteriorates with age without any noise challenge
          - so the effect is EXACERBATES rather than TRIGGERS.
      selected_evidence:
        snippet: These data therefore show the noise exposure, normally only sufficient to cause TTS in
          normal mice, leads to PTS in PKHD1L1-deficient mice.
        supports: SUPPORT
        directness: INDIRECT
