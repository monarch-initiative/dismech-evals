      assertion:
        target: Loss of the Stereocilia Surface Coat at Stereocilia Tips
        relationship: RECAPITULATES
        fidelity: HIGH
        description: 'This model is how the coat was identified as a PKHD1L1 structure at all: the coat
          at the tips is absent in the mutant and present in littermate controls, on tannic-acid stained
          transmission electron microscopy.'
        limitations: 'The coat has never been examined in human hair cells, in a patient or otherwise,
          so the identity of the human structure with the mouse one is assumed from protein orthology.
          The loss is also partial in a specific sense that should not be lost: only the upper coat goes,
          and the paper suggests the lower coat is made of different proteins.'
        readouts:
