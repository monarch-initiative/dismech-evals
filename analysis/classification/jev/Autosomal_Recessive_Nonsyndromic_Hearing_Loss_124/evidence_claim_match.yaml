            term:
              id: MONDO:0968981
              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counselling and Cascade Testing
        description: Counselling for a recessive condition with a 25 percent sibling recurrence risk,
          in a setting where family history is usually absent because heterozygous carriers hear normally
          - the parents in every reported family had normal hearing. Two of the four families are consanguineous,
          which is where cascade testing and recurrence counselling have the most to offer. Counselling
          does not act on the mechanism; it is included because it is the one intervention the genotype
          itself indicates.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'Cochlear implantation is deliberately not curated. It is standard for severe-to-profound
          sensorineural hearing loss and would look right here, but no DFNB124 patient has been reported
          to have received one, the loss in this series does not reach the profound range, and importing
          the indication would attribute to these four patients an intervention recorded only in other
          people. Avoidance of noise exposure is likewise not curated as a treatment: it follows from
          the mouse result rather than from any human study, and it is recorded where that provenance
          is visible, as an environmental entry and an open discussion.'
      selected_evidence:
        snippet: The proband is a 9-year-old Iranian male of Lur ethnicity born to healthy consanguineous
          (first cousin) parents with subjectively normal hearing.
        supports: SUPPORT
