              label: autosomal recessive nonsyndromic hearing loss 124
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Resilience to Acoustic Overexposure
        biological_scale: CELLULAR
        description: A noise dose calibrated to cause only a temporary threshold shift in wild-type mice
          causes a permanent one in PKHD1L1-deficient mice. Control thresholds recover to baseline by
          two weeks; mutant thresholds do not, at two weeks or at eight. Morphologically the difference
          shows as tall-row stereocilia loss and disorganisation after noise, on top of the short-row
          loss that ageing alone produces. The bundle that develops without a coat is therefore not just
          slower to fail with age - it is less able to absorb an acoustic insult.
        cellular_components:
        - preferred_term: stereocilium bundle
          term:
            id: GO:0032421
            label: stereocilium bundle
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        mechanism_confidence: PROVISIONAL
        notes: This node has no human evidence at all. It is entirely a mouse finding, and the human paper
          explicitly names it as an open question rather than a described feature of DFNB124. It is curated
          as a node, rather than left out or buried in prose, because it is a structural gene-environment
          interaction with an environmental entry pointing at it, and because leaving it out would hide
          the one place where this disease might be modifiable. mechanism_confidence is PROVISIONAL to
          mark the species gap, and the corresponding discussion states it.
      selected_evidence:
        snippet: These findings demonstrate that deficiency in PKHD1L1 increases susceptibility to bundle
          disruption during moderate acoustic overexposure, leading to permanent threshold shifts.
        supports: SUPPORT
        directness: INDIRECT
