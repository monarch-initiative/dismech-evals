          name: Autosomal Recessive Nonsyndromic Hearing Loss 15
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 15
            term:
              id: MONDO:0011160
              label: autosomal recessive nonsyndromic hearing loss 15
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of GIPC3 Adaptor Function in Cochlear Hair Cells
        role: central_effector
        biological_scale: MOLECULAR
        description: GIPC3 is expressed in cochlear inner and outer hair cells and spiral ganglion neurons.
          In hair cells it starts out cytoplasmic and becomes concentrated in the cuticular plate and
          at apical cell junctions during postnatal development. It binds myosin VI (MYO6) directly, depends
          on MYO6 for its junctional localisation, and binds PDZ-binding motifs of cytoskeletal and junctional
          proteins including MYO18A. The proposed role is as an adaptor coupling MYO6 to the actin structures
          of the hair cell apex; the older hypothesis, from its punctate cytoplasmic staining, was a role
          in vesicle trafficking. All of this is mouse and chicken data.
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        - preferred_term: spiral ganglion neuron
          term:
            id: CL:0011113
            label: spiral ganglion neuron
        cellular_components:
        - preferred_term: cuticular plate
          term:
            id: GO:0032437
            label: cuticular plate
        - preferred_term: cell-cell junction
          term:
            id: GO:0005911
            label: cell-cell junction
        locations:
        - preferred_term: cochlea
          term:
            id: UBERON:0001844
            label: cochlea
      selected_evidence:
        snippet: GIPC3 bound directly to MYO6, and the loss of MYO6 led to altered distribution of GIPC3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37096733
      reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical
        region.
      evidence_source: IN_VITRO
      explanation: Direct binding to MYO6. The sentence also reports an in vivo result (GIPC3 mislocalisation
        in Myo6-null hair cells); it is graded IN_VITRO for the binding claim it is cited for.
