        role: trigger
        biological_scale: MOLECULAR
        description: Biallelic germline GIPC3 variants cause recessive hearing loss. Reported homozygous
          alleles include missense changes across GH1, PDZ and GH2 regions, c.685dupG, p.Trp301* and c.226-1G>T.
          Loss of normal adaptor function is inferred from segregation, the splice assay and animal models;
          individual human alleles need not abolish protein expression. In particular, p.Trp301* removes
          only the last 12 amino acids, and the family reports do not directly measure the function of
          their patient missense proteins.
        genes:
        - preferred_term: GIPC3
          term:
            id: hgnc:18183
            label: GIPC3
        genetic_context:
          gene:
            preferred_term: GIPC3
            term:
              id: hgnc:18183
              label: GIPC3
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Loss of function is an allele-class interpretation supported by truncating/splice
            alleles and models, not a demonstration that every human variant eliminates protein. The reported
            family genotypes here are homozygous.
      selected_evidence:
        snippet: Here, we describe one frameshift and six missense mutations in GIPC3 cosegregating with
          DFNB72 hearing loss in six large families that support statistically significant evidence for
          genetic linkage.
        supports: SUPPORT
