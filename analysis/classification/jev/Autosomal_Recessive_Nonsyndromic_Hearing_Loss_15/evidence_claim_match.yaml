      explanation: 'Bears on this edge rather than on the node: in the full knockout, early transduction
        is largely preserved while hearing is absent, so reduced transduction cannot be the general route
        from GIPC3 loss to deafness. It does not exclude a later decline in transduction, which was not
        measured at one month.'
