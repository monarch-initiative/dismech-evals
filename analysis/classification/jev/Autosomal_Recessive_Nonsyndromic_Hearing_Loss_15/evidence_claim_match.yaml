        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic GIPC3 Pathogenic Variants
        role: trigger
        biological_scale: MOLECULAR
        description: Homozygous germline GIPC3 variants in consanguineous families. The reported spectrum
          is mostly missense, spread across the N-terminal GH1 region, the PDZ domain and the C-terminal
          GH2 region, together with a frameshift (c.685dupG), a nonsense variant (c.903G>A, p.Trp301*)
          and a canonical splice-site variant (c.226-1G>T) that causes use of an alternative acceptor,
          a frameshift and a premature stop codon. The truncating alleles make loss of function the most
          direct reading of the missense alleles too, but no study has measured the activity of a patient
          missense protein.
        genes:
        - preferred_term: GIPC3
          term:
            id: hgnc:18183
            label: GIPC3
        genetic_context:
          gene:
            preferred_term: GIPC3
            term:
              id: hgnc:18183
              label: GIPC3
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Typed LOSS_OF_FUNCTION on the strength of the frameshift, nonsense and splice-site
            alleles; the missense alleles have no functional assay in patient material.
      selected_evidence:
        snippet: Here, we describe one frameshift and six missense mutations in GIPC3 cosegregating with
          DFNB72 hearing loss in six large families that support statistically significant evidence for
          genetic linkage.
        supports: SUPPORT
    origin:
