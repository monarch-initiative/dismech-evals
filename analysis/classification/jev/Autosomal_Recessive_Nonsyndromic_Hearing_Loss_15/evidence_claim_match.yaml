      assertion_type: Diagnosis
      assertion:
        name: Hearing Loss Gene Panel or Exome Sequencing
        description: Clinically indistinguishable from other recessive nonsyndromic hearing losses, so
          the diagnosis is molecular. Reported families were solved by homozygosity mapping followed by
          GIPC3 sequencing, or by targeted deafness-gene panels after exclusion of the common genes. Because
          DFNB81 lies next to GIPC3 on 19p, linkage to the region is not enough; a GIPC3 variant must
          be found.
      selected_evidence:
        snippet: Targeted NGS allows easier detection of mutations in relatively uncommon deafness genes
          in families with ARNSHL.
        supports: SUPPORT
