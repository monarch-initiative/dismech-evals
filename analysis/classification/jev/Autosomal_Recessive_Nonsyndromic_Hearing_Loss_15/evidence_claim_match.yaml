          its normal rounded-rectangular shape, and junctions between inner hair cells and adjacent inner
          phalangeal cells are severely disrupted. How this produces the profound deafness of the knockout
          is not shown; it is left without a downstream edge rather than wired to the hearing-loss phenotype
          on inference.
