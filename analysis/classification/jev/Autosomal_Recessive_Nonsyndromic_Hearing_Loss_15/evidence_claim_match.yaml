        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        description: Gipc3 siRNA in HEI-OC1 cells and neonatal mouse cochlear explants reduces LC3B puncta
          or LC3B-II and increases p62, especially with tert-butyl hydroperoxide exposure. The authors
          interpret these changes as impaired mitophagy, but static LC3B/p62 measurements do not establish
          mitochondrial-selective autophagic flux. APPL1 abundance and colocalization change, without
          direct binding or a causal APPL1 rescue experiment in these auditory preparations. No patient
          allele or in vivo hearing rescue was tested.
