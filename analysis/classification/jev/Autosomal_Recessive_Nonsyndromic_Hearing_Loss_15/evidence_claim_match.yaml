      assertion_type: Genetic
      assertion:
        name: GIPC3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: GIPC3
          term:
            id: hgnc:18183
            label: GIPC3
        association: 'Biallelic pathogenic variants in GIPC3 cause DFNB15/DFNB72/DFNB95. GIPC3 was first
          implicated in two small families (Indian DFNB15, Dutch DFNB95) alongside the ahl5 mouse, and
          statistically significant linkage came from six large Pakistani DFNB72 families. An adjacent
          19p locus, DFNB81, is genetically distinct and not caused by GIPC3. Across populations GIPC3
          is a rare cause of recessive deafness, with one exception: a founder missense allele, c.245A>G
          (p.Asn82Ser), in the Chuvash population of Russia.'
        case_fractions:
        - population: Chuvash patients with hereditary sensorineural hearing loss (Russia)
          case_fraction_percent: 23.0
          notes: 26 patients from 21 unrelated families; the 23% refers to patients homozygous for the
            c.245A>G founder allele.
        - population: South Indian prelingual hearing-impaired probands negative for GJB2, GJB6 and A1555G
          case_fraction_percent: 0.56
          cohort_size: 177
        - population: Saudi families with congenital nonsyndromic hearing loss
          case_fraction_percent: 1.0
          cohort_size: 100
      selected_evidence:
        snippet: Here, we identify mutations in Gipc3 underlying progressive sensorineural hearing loss
          (age-related hearing loss 5, ahl5) and audiogenic seizures (juvenile audiogenic monogenic seizure
          1, jams1) in mice and autosomal recessive deafness DFNB15 and DFNB95 in humans.
        supports: SUPPORT
