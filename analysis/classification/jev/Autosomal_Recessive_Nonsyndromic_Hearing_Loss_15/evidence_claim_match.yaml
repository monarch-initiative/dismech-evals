      assertion_type: Pathophysiology
      assertion:
        name: Failure of Inner Hair Cell Potassium Current Maturation
        role: effector
        biological_scale: CELLULAR
        description: Around postnatal day 12, control inner hair cells acquire a large, rapidly activating
          potassium current; ahl5 inner hair cells keep the small currents typical of postnatal day 6.
          The authors link the immature currents to the enlarged ABR wave I amplitude and audiogenic seizure
          susceptibility of young ahl5 mice, which have no reported human counterpart. No source connects
          this defect to the human hearing loss, so the node has no downstream edge.
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
