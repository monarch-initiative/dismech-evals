            term:
              id: MONDO:0011762
              label: autosomal recessive nonsyndromic hearing loss 22
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Copy-Number-Aware Genetic Testing
        description: Use genetic testing that evaluates OTOA sequence variants and deletions/duplications
          and has appropriate coverage of the homologous OTOA/OTOAP1 region. Short-read panel or exome
          data can detect CNVs when analyzed appropriately, but assay-specific limitations matter. In
          the conversion study, exome CNV analysis flagged an apparent exon-22 deletion; MLPA confirmed
          a larger deletion but lacked probes in the paralogous region. Long-range PCR with Sanger and
          nanopore sequencing resolved the converted allele. Thus conversion may be flagged or misclassified
          rather than uniformly invisible. Confirm candidate variants, phase and familial segregation
          and assess current pathogenicity; a single heterozygous deletion or an uncertain missense genotype
          is not a complete recessive diagnosis.
      selected_evidence:
        snippet: Eight of these patients have a large homozygous deletion involving STRC, OTOA or USH2A,
          which could only be identified by copy number variation detection.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
