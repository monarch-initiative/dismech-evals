          DPOAE thresholds, and relatively preserved basal basilar-membrane responses. It does not predict
          universally normal human emissions. One conversion proband repeatedly failed neonatal OAE screening,
          but screening results do not localize the lesion or directly test the proposed hydrodynamic
          mechanism. Human physiological characterization across confirmed genotypes remains limited.
        attaches_to:
        - pathophysiology#Failure of Inner Hair Cell Stimulation
        - pathophysiology#Relatively Preserved Cochlear Amplification in Mice
      selected_evidence:
        snippet: The proband’s neonatal auditory screening (otoacoustic emissions) failed for both ears.
