          reached genetics through newborn screening, which selects for early-onset disease, while the
          Chinese series came from sporadic deafness pedigrees. Pooling them raises the congenital share
          for a reason that is partly about how the patients were found. The count is reported because
          it is what the literature contains, not as an unbiased frequency.'
