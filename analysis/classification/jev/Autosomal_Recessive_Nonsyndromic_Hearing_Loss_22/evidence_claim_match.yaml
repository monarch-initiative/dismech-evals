        name: STRC-related hearing loss (DFNB16)
        description: The closest differential, and for a structural reason rather than a clinical one.
          STRC also sits in a segmental duplication, is also lost predominantly by recurrent deletion,
          and also produces a mild-to-moderate recessive sensorineural loss. The two genes turn up together
          in the same copy-number analyses of the same cohorts, so a pipeline that finds one is the pipeline
          that finds the other.
      selected_evidence:
        snippet: Eight of these patients have a large homozygous deletion involving STRC, OTOA or USH2A,
          which could only be identified by copy number variation detection.
