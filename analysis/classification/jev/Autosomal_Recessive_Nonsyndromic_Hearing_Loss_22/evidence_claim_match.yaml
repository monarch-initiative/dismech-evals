              label: autosomal recessive nonsyndromic hearing loss 22
        context: []
      assertion_type: Prevalence
      assertion:
        population: Israeli chromosomal-microarray referral cohort (19,189 consecutive CMA tests, Rabin
          Medical Center)
        measure_type: CARRIER_FREQUENCY
        prevalence_class: ABOVE_1_IN_1000
        rate_per_100000: 200.0
        rate_denominator: POPULATION
        notes: 'Heterozygous OTOA microdeletions in 39 of 19,189 individuals, 0.2%. Two cautions before
          this number is reused. It counts *deletions only* - point variants are not included, so it is
          a floor on carrier frequency rather than an estimate of it. And the denominator is a clinical
          microarray referral population, not a population sample, so it is not a general-population carrier
          rate.

          The same study estimates the hearing-loss risk for an individual found to carry such a deletion
          at 0.016-0.13%, which is the figure that matters when one turns up as an incidental finding.'
      selected_evidence:
        snippet: Of the 19,189 CMA tests were performed in our laboratory, 107 STRC microdeletions were
          found (0.56%), followed in frequency by OTOA deletions (39, 0.2%), and DFNB1 locus deletions
          (10, 0.05%).
        supports: SUPPORT
