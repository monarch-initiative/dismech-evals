  c4df6c6caf4252d4103c86636d1cd16c7810d46730e2a8974f75a7b40d2b1dbb:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 22
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 22
            term:
              id: MONDO:0011762
              label: autosomal recessive nonsyndromic hearing loss 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic OTOA Loss-of-Function
        role: trigger
        biological_scale: MOLECULAR
        description: 'The initiating lesion. Reported alleles span splice-site changes, frameshifts, a
          missense variant, and - most often - whole or partial gene deletions.

          The founding DFNB22 allele is the splice variant IVS12+2T>C, found homozygous in a consanguineous
          Palestinian family. Later series are dominated by copy-number variants, which is a consequence
          of where the gene sits rather than of any special mutability of its coding sequence.

          A third allele class is worth separating out because it is neither a point variant nor a deletion,
          and neither a sequencing pipeline nor a copy-number pipeline is built to find it: **gene conversion
          from the OTOAP1 pseudogene**. Pseudogene sequence is copied into the functional gene, carrying
          a premature stop at p.Glu787* in exon 22. The converted tracts reported span roughly 900 bp
          to over 9 kbp, and the two probands described were compound heterozygous for a converted allele
          and a deletion - so the conversion is doing half the work in a genotype that a deletion assay
          would report as a single heterozygous finding.

          Deletions also extend beyond the gene. A homozygous 250 kb deletion at 16p12.2 spanning METTL9,
          IGSF6 and OTOA segregated with non-syndromic hearing loss in a South Indian consanguineous family,
          which is worth knowing because a contiguous-gene deletion invites the question of whether the
          neighbours contribute - and here the phenotype was non-syndromic, so on the available evidence
          they do not.'
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The pathogenic variations of OTOA gene are mainly copy number variations followed by
          deletion variations and missense variations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37114731
      reference_title: '[Phenotype-genotype analysis of the autosomal recessive hereditary hearing loss
        caused by OTOA variations].'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that copy-number loss, not point mutation, is the predominant allele class
        in a six-pedigree series.
