        relationship_type: CAUSATIVE
        notes: OTOA encodes otoancorin, localized to nonsensory epithelial surfaces at acellular-gel attachment
          zones in the mouse inner ear. The founding paper's 1088-residue abstract refers to murine sequence
          and must not be treated as a human protein length. OTOA and OTOAP1 share greater than 99% identity
          in the paralogous region, complicating mapping, copy-number calls and primer/probe placement.
          Alleles include whole or partial deletions, splice and truncating variants, selected missense
          variants and pseudogene-mediated conversions. A conversion can resemble an exon deletion in
          read-depth output; locus-specific amplification and sequencing are required to distinguish the
          physical alterations. Proposed recombination mechanisms generating a conversion are distinct
          from the observed converted sequence. Neither isolated heterozygosity nor a pair of uncertain
          variants alone establishes recessive OTOA disease.
      selected_evidence:
        snippet: A 3,673-bp murine cDNA predicted to encode a glycosylphosphatidylinositol-anchored protein
          of 1,088 amino acids was isolated during a study aimed at identifying transcripts specifically
          expressed in the inner ear.
