  e2621d9a22a706f4b792086fe006fe10a8242d7af891eb3f8753f299a5b12e0e:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 22
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 22
            term:
              id: MONDO:0011762
              label: autosomal recessive nonsyndromic hearing loss 22
        context: []
      assertion_type: Prevalence
      assertion:
        population: Israeli chromosomal-microarray referral cohort (19,189 consecutive CMA tests, Rabin
          Medical Center)
        measure_type: CARRIER_FREQUENCY
        notes: Thirty-nine heterozygous OTOA deletions were found in 19,189 prenatal and postnatal CMA
          tests (reported as 0.2%). Patients with hearing loss and duplicate relatives carrying the same
          deletion were excluded. This is a deletion-carrier observation in a clinical testing cohort,
          not disease prevalence or total carrier frequency. The paper estimated a 0.016-0.13% chance
          of a second disease-associated sequence allele in an individual with a deletion from database
          frequencies and Mendelian assumptions. This was a model-based estimate, not observed penetrance
          or a prospectively measured hearing-loss rate; it depends on the database, ancestry and variant
          classifications.
      selected_evidence:
        snippet: Of the 19,189 CMA tests were performed in our laboratory, 107 STRC microdeletions were
          found (0.56%), followed in frequency by OTOA deletions (39, 0.2%), and DFNB1 locus deletions
          (10, 0.05%).
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/0
