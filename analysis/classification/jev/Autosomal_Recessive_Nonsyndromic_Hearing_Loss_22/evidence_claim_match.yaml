  0d401ec6801ab649098b06362b14819be3b1d9d5da17fdbd22b9f32f27266e54:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 22
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 22
            term:
              id: MONDO:0011762
              label: autosomal recessive nonsyndromic hearing loss 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Inner Hair Cell Stimulation
        role: mechanism
        biological_scale: CELLULAR
        description: 'The functional lesion. Inner hair cell tuning stays sharp - the cells are being
          driven at the right frequency - but the drive itself is too weak, so compound action potential
          thresholds rise while masker tuning curves remain narrow. That dissociation is what identifies
          the defect as one of stimulation rather than of transduction or of frequency selectivity.

          A binding caveat. GO:0050910 covers detection of the mechanical stimulus, which includes transduction
          inside the hair cell, so it is broader than the claim made here: the stimulus never arrives,
          the cell itself being intact. GO has no term for delivery of a mechanical stimulus to a hair
          bundle as distinct from its detection, so the narrower reading is carried in preferred_term.'
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        biological_processes:
        - preferred_term: mechanical stimulation of the inner hair cell bundle
          term:
            id: GO:0050910
            label: detection of mechanical stimulus involved in sensory perception of sound
          modifier: DECREASED
      selected_evidence:
        snippet: The compound action potential masker tuning curves, a measure of the tuning of the sensory
          inner hair cells, are also sharply tuned, but the thresholds of the compound action potentials,
          a measure of inner hair cell sensitivity, are significantly elevated.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
