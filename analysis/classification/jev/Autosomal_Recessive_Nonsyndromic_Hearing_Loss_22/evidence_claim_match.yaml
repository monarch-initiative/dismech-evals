              label: autosomal recessive nonsyndromic hearing loss 22
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Additional genetic diagnoses in a complex phenotype
        description: Extra-auditory findings warrant evaluation for additional causes. Two siblings with
          OTOA deletion and mid-frequency hearing loss also had a homozygous ERCC4 missense variant and
          an NER-disorder-like phenotype. The ERCC4 allele was classified as uncertain and lacked functional
          confirmation; this report supports considering blended diagnoses, not assigning photosensitivity
          or intellectual disability to DFNB22.
      selected_evidence:
        snippet: While the homozygous deletion in OTOA is a well-established cause of deafness, the pathogenicity
          of the ERCC4 variant identified in our patients is currently supported only by allele frequency
          data, in silico predictions, and clinical concordance.
        supports: SUPPORT
