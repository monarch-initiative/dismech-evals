      assertion_type: Genetic
      assertion:
        name: OTOA
        gene_term:
          preferred_term: OTOA
          term:
            id: hgnc:16378
            label: OTOA
        relationship_type: CAUSATIVE
        notes: 'OTOA encodes otoancorin, a GPI-anchored inner-ear-specific protein of 1,088 amino acids
          with weak homology to the megakaryocyte potentiating factor/mesothelin precursor. Expression
          is restricted to the inner ear, which is why loss of it produces an isolated, non-syndromic
          phenotype with nothing outside the ear to find.

          The gene lies within a segmental duplication on 16p12.2, sharing high homology with the pseudogene
          OTOAP1, and that architecture generates two distinct classes of pathogenic allele. Non-allelic
          homologous recombination between the repeats produces recurrent copy-number deletions, which
          are the commonest cause. Gene conversion copies OTOAP1 sequence into OTOA, importing a premature
          stop at p.Glu787*.

          The diagnostic consequence differs for each. A deletion is missed by short-read sequencing without
          copy-number analysis. A conversion is missed by both: it is not a copy-number change, and the
          converted sequence aligns to the pseudogene, so it surfaces as a sequencing-depth anomaly rather
          than as a variant call and needs long-read or long-range PCR confirmation.'
      selected_evidence:
        snippet: A 3,673-bp murine cDNA predicted to encode a glycosylphosphatidylinositol-anchored protein
          of 1,088 amino acids was isolated during a study aimed at identifying transcripts specifically
          expressed in the inner ear.
        supports: SUPPORT
