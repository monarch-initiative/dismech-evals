            term:
              id: MONDO:0011762
              label: autosomal recessive nonsyndromic hearing loss 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Preserved Outer Hair Cell Amplification
        role: modifier
        biological_scale: CELLULAR
        description: 'Not a pathological step. It is recorded because it is the part of the cochlea this
          disease spares, and because sparing it has a clinical consequence: otoacoustic emissions, which
          report outer hair cell function, can be present in an ear that is nonetheless substantially
          deaf.

          The entry stops short of claiming that OAEs are preserved in DFNB22 patients. The only human
          measurement on record is a failed newborn screen in one confirmed proband, curated below as
          REFUTE, and a pass/fail neonatal screen cannot settle what a distortion-product study would.
          What is asserted in humans is only that the mechanism predicts preserved emissions, and the
          HUMAN_MODEL_MISMATCH discussion says so.'
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
      selected_evidence:
        snippet: Measurements of cochlear microphonic potentials, distortion product otoacoustic emissions,
          and basilar membrane motion indicate that the TM remains functionally attached to the electromotile,
          sensorimotor outer hair cells of the organ of Corti, and that the amplification and frequency
          tuning of the basilar membrane responses to sounds are almost normal.
        supports: SUPPORT
