      assertion_type: Pathophysiology
      assertion:
        name: Tectorial Membrane Detachment from the Spiral Limbus
        role: mechanism
        biological_scale: TISSUE
        description: 'In Otoa-null mice, the tectorial membrane loses attachment to the spiral limbus
          while retaining its gross form near the organ of Corti and outer hair-cell bundle imprints.
          It is not otherwise structurally normal: the lateral region is thinned and fenestrated, a distinct
          marginal band is absent, and Hensen''s stripe is not visible. These full-text morphological
          observations limit interpretation of the mutant as an isolated detachment experiment. Human
          temporal-bone confirmation is unavailable in the reviewed studies.'
        locations:
        - preferred_term: tectorial membrane of the cochlea
          term:
            id: UBERON:0002233
            label: tectorial membrane of cochlea
      selected_evidence:
        snippet: the tectorial membrane (TM), a ribbon-like strip of ECM that is normally anchored by
          one edge to the spiral limbus and lies over the organ of Corti, retains its general form, and
          remains in close proximity to the organ of Corti, but is detached from the limbal surface.
        supports: SUPPORT
