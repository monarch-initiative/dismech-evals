        description: 'The diagnostic point specific to this disease, and it has two halves because the
          locus generates two kinds of structural allele.

          Most pathogenic OTOA alleles are deletions in a segmentally duplicated region, so a sequencing-only
          panel returns negative in a proband who has the disease. Copy-number analysis - MLPA in the
          reported case series, or read-depth CNV calling on exome data - is what makes that diagnosis.

          Gene conversions need something further again. They are not copy-number changes, so a CNV pipeline
          does not see them either; they were found by noticing sequencing-depth anomalies at the locus
          and then confirmed by long-range PCR and nanopore sequencing. A proband compound heterozygous
          for a deletion and a conversion will look like a heterozygous carrier on a deletion assay alone.'
      selected_evidence:
        snippet: the copy number variations were validated by multiplex ligation-dependent probe amplification
          (MLPA) in the family members.
