  2f988baa6ddf5e96e344819830f19f14c3451b306d83d39e37c9c4f0611c7642:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 22
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 22
            term:
              id: MONDO:0011762
              label: autosomal recessive nonsyndromic hearing loss 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Otoancorin from the Limbal Attachment Zone
        role: mechanism
        biological_scale: CELLULAR
        description: 'Otoancorin is GPI-anchored to the apical surface of non-sensory epithelial cells
          and is restricted to the zones where those surfaces contact an acellular gel. In the cochlea
          that means the permanent attachment along the top of the spiral limbus, and a transient one
          over the developing greater epithelial ridge.

          The GPI anchorage is not an inference from sequence. It was tested directly: wild-type otoancorin
          is released from the cell surface by phosphatidylinositol-specific phospholipase C, whereas
          a truncating variant is shed into the medium uncontrolled. So a C-terminal truncation does not
          merely shorten the protein, it stops it being held at the surface at all.'
        cell_types:
        - preferred_term: interdental cell of the spiral limbus
          term:
            id: CL:0002172
            label: interdental cell of cochlea
        biological_processes:
        - preferred_term: attachment of the tectorial membrane to the limbal epithelium
          term:
            id: GO:0007160
            label: cell-matrix adhesion
          modifier: ABSENT
      selected_evidence:
        snippet: The mutant OTOA with p.Gln589ArgfsX55 resulted in an uncontrolled release of OTOA into
          the medium in contrast with phosphatidylinositol-specific phospholipase C-induced controlled
          release of WT OTOA from the cell surface.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30740825
      reference_title: Clarification of glycosylphosphatidylinositol anchorage of OTOANCORIN and human
