            term:
              id: MONDO:0011762
              label: autosomal recessive nonsyndromic hearing loss 22
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Inner Hair Cell Stimulation
        role: mechanism
        biological_scale: CELLULAR
        description: In Otoa-null mice, compound action potential thresholds were elevated by 35-55 dB
          over 8-70 kHz while neural masker tuning remained sharp and was sharper than wild type under
          the tested conditions. Basilar-membrane sensitivity and tuning were largely preserved in the
          measured basal region. This dissociation supports inefficient transmission of cochlear motion
          to inner hair cells. Compound action potentials measure synchronized auditory-nerve activity
          and are an indirect assay of inner hair-cell stimulation, not direct recordings of inner hair-cell
          mechanotransduction currents. The exact hydrodynamic intermediate and applicability to every
          human allele remain unresolved.
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        biological_processes:
        - preferred_term: mechanical stimulation of the inner hair-cell bundle
          modifier: DECREASED
      selected_evidence:
        snippet: The compound action potential masker tuning curves, a measure of the tuning of the sensory
          inner hair cells, are also sharply tuned, but the thresholds of the compound action potentials,
          a measure of inner hair cell sensitivity, are significantly elevated.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23129639
      reference_title: A mouse model for human deafness DFNB22 reveals that hearing impairment is due
