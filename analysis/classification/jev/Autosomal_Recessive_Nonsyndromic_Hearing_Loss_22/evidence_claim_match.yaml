        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic OTOA Loss-of-Function
        role: trigger
        biological_scale: MOLECULAR
        description: Biallelic OTOA loss of function is supported by homozygous deletions and splice variants
          and by compound heterozygous genotypes. Reported missense alleles have varying levels of support
          and are not all established pathogenic variants. The founding Palestinian family carried homozygous
          IVS12+2T>C (c.1320+2T>C); aberrant splicing was predicted in that study. A later Korean proband
          carried c.1320+5G>C in trans with c.1765delC (p.Gln589ArgfsX55). COS7 minigenes demonstrated
          abnormal splicing for c.1320+5G>C, while HEK293T assays showed impaired surface retention of
          the truncated protein. Patient cochlear RNA and protein were not tested. In two other probands,
          OTOAP1 sequence replaced part of OTOA and introduced p.Glu787* in trans with an OTOA deletion.
          The conversion tract was at least 9 kb in one case and less than 900 bp in the other. Different
          recombination or repair mechanisms for generating these tracts were proposed, not experimentally
          established. A South Indian family carried a homozygous 250.285-kb deletion encompassing METTL9,
          IGSF6, OTOA and part of NPIPB4. Its nonsyndromic presentation does not exclude effects of neighboring
          genes in other deletions or backgrounds.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Both homozygous and compound heterozygous pathogenic genotypes occur; one zygosity
            does not represent the disorder.
        genes:
        - preferred_term: OTOA
          term:
            id: hgnc:16378
            label: OTOA
      selected_evidence:
        snippet: The identification of the mutation (IVS12+2T>C) in the corresponding gene OTOA in one
          consanguineous Palestinian family affected by nonsyndromic recessive deafness DFNB22 assigns
          an essential function to otoancorin.
        supports: SUPPORT
