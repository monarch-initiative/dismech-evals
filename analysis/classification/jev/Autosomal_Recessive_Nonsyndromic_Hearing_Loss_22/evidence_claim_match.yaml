        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Relatively Preserved Cochlear Amplification in Mice
        role: modifier
        biological_scale: CELLULAR
        description: Basilar-membrane sensitivity and sharpness of tuning at the high-frequency cochlear
          base were not significantly different between null and wild-type mice. This relative preservation
          constrains the proposed hearing-loss mechanism. It is a parallel physiological observation,
          not a consequence that detachment causes normal function. DPOAE thresholds were nevertheless
          elevated by 10-35 dB over 8-65 kHz; the authors proposed altered reverse transmission as an
          explanation for the difference from basilar-membrane responses. Normal otoacoustic emissions
          or universally intact outer hair cells cannot be inferred in human DFNB22.
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
      selected_evidence:
        snippet: Measurements of cochlear microphonic potentials, distortion product otoacoustic emissions,
          and basilar membrane motion indicate that the TM remains functionally attached to the electromotile,
          sensorimotor outer hair cells of the organ of Corti, and that the amplification and frequency
          tuning of the basilar membrane responses to sounds are almost normal.
        supports: SUPPORT
