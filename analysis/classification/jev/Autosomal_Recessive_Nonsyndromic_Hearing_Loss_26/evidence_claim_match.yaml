  0e6d502acbad48944510adf6340616dbaae6e0061e75b4bdb696d1b902faf084:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 26
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 26
            term:
              id: MONDO:0011553
              label: autosomal recessive nonsyndromic hearing loss 26
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GAB1 p.Gly116Glu Hypomorphic PH-Domain Variant
        description: 'GAB1 c.347G>A in constitutive exon 2 substitutes glutamate for a conserved glycine
          at residue 116, inside the pleckstrin homology domain of the adapter. The allele is absent from
          Pakistani and Indian control chromosomes and from 1000 Genomes, NHLBI-ESP and ExAC, and eight
          in silico tools call it deleterious.

          The important qualifier is that it is hypomorphic rather than null. Homozygous deletion of the
          sequence encoding the GAB1 PH domain is embryonic lethal in mice, and gab1 knockdown produces
          severe developmental defects and lethality in zebrafish, so a complete loss of function could
          not present as isolated deafness. Residual GAB1 activity is what restricts the phenotype to
          the ear.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: GAB1
          term:
            id: hgnc:4066
            label: GAB1
      selected_evidence:
        snippet: Here, we report that DFNB26 is associated with a substitution (p.Gly116Glu) in the pleckstrin
          homology domain of GRB2-associated binding protein 1 (GAB1), an essential scaffold in the MET
          proto-oncogene, receptor tyrosine kinase/HGF (MET/HGF) pathway.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
