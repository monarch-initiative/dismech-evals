      assertion:
        name: Exclusion of intrafamilial genetic heterogeneity
        description: 'A large consanguineous pedigree in which some haplotype homozygotes hear normally
          has two readings: a modifier, or two different deafness genes segregating in different sibships.
          The second was tested directly by exome sequencing six deaf individuals from six sibships plus
          a non-penetrant individual, and only the GAB1 allele was shared. Any future family proposed
          as DFNB26 should be held to the same test.'
      selected_evidence:
        snippet: WES data did not reveal any potential pathogenic variants shared among affected individuals,
          except for the c.347G>A allele in GAB1 at the DFNB26 locus
