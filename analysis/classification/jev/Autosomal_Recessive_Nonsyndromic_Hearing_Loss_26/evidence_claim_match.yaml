        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb26_suppressor_as_therapeutic_strategy
        kind: KNOWLEDGE_GAP
        prompt: Could a METTL13-based intervention suppress hearing loss caused by other MET/HGF pathway
          genes - SPRY2, MET, HGF - and not only the GAB1 allele it was found with?
        attaches_to:
        - pathophysiology#Dysregulated MET/HGF Signaling
        - treatments#
        rationale: 'This is the reason a single-family disease is worth a full entry. A naturally occurring
          human allele that completely abolishes a monogenic deafness phenotype is a therapeutic lead
          in a way that a disease gene is not, and the pathway it acts on already contains several established
          deafness genes: HGF variants cause DFNB39, a MET variant is associated with DFNB97, and SPRY2
          loss causes hearing loss in mice. If the suppressor acts on the pathway rather than on GAB1
          specifically, its reach is much wider than DFNB26.

          The evidence does not yet distinguish those. In the zebrafish assay the suppressor was only
          ever tested against the GAB1-mutant background, so pathway-level versus allele-specific action
          is untested. The authors state the wider possibility as speculation, and it is recorded here
          at that strength. The tractable next step is the one they imply: run the same rescue assay against
          knockdowns of spry2, met and hgf.'
      selected_evidence:
        snippet: Identification of METTL13-based modification of MET signaling offers a potential therapeutic
          strategy for a wide range of associated hearing disorders.
        supports: SUPPORT
