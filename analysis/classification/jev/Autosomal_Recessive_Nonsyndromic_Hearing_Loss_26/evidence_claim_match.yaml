  3fd8fab599e28241efe7800a3ee3afb0f43da9b2d11cb4232f7c8f0708344fca:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 26
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 26
            term:
              id: MONDO:0011553
              label: autosomal recessive nonsyndromic hearing loss 26
        context: []
      assertion_type: Inheritance
      assertion:
        name: Dominant suppression by an unlinked modifier locus
        description: 'The penetrance of the recessive genotype is controlled by a second, unlinked locus.
          Seven family members homozygous for the DFNB26 haplotype hear normally; each carries one copy
          of METTL13 p.Arg544Gln at DFNM1 on 1q24, and every deaf family member is homozygous for wild-type
          METTL13.

          This is a modifier relationship, not digenic inheritance, and is deliberately not bound to HP:0010984.
          Digenic inheritance means variants at two loci are jointly required to produce the disease;
          here the GAB1 genotype alone is sufficient, and the second locus subtracts the phenotype rather
          than contributing to it. Modelling it as digenic would invert the direction of the second allele''s
          effect.'
        penetrance: INCOMPLETE
      selected_evidence:
        snippet: A dominant modifier, DFNM1, that suppresses deafness in the 7 nonpenetrant individuals
          was mapped to a 5.6-cM region on chromosome 1q24 with a lod score of 4.31 at theta=0 for D1S2815.
        supports: SUPPORT
    origin:
