      assertion:
        target: GAB1 p.Gly116Glu Hypomorphic PH-Domain Variant
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        description: Establishes in a whole animal that p.Gly116Glu retains partial function and that
          the METTL13 suppressor allele acts on the GAB1 lesion allele-specifically.
        limitations: The scored phenotype is early embryonic development - eye formation, budding-stage
          arrest, epiboly delay - not hearing, so the model tests allele function rather than the disease.
          Morpholino knockdown is transient and not equivalent to the human homozygous missense state,
          and the rescue is of a knockdown by exogenous human mRNA rather than of an engineered mutant
          fish. No auditory or lateral-line readout was reported.
        readouts:
        - name: Morphant developmental phenotype class at the 10- to 12-somite stage
          target: GAB1 p.Gly116Glu Hypomorphic PH-Domain Variant
          direction: RESTORED
          interpretation: Restored by wild-type human GAB1 mRNA and only partially by p.Gly116Glu mRNA;
            separately attenuated by co-injecting suppressor-allele METTL13 mRNA but not wild-type METTL13
            mRNA.
      selected_evidence:
        snippet: MO resulted in significant rescue at the 10- to 12-somite stage, whereas mRNA encoding
          the hypomorphic p.Gly116Glu variant resulted in partial rescue.
        supports: SUPPORT
