    evidence_metadata:
      reference: PMID:29408807
      reference_title: Modifier variant of METTL13 suppresses human GAB1-associated profound deafness.
      evidence_source: IN_VITRO
      explanation: Establishes the allele as hypomorphic and links that directly to why the phenotype
        is confined to hearing. The quote opens at "assay" because the words before it, "our biochemical
        lipid-binding", are split across a hyphenated line break in the PDF-derived cache. Note that this
        one sentence is the authors' synthesis across two study arms and names both; it is graded on the
        biochemical assay, which is the arm that measures the allele's residual function directly. Both
        arms are also carried separately and with their own grades elsewhere in this entry - the quantified
        PIP-array result as IN_VITRO in this same node, and the zebrafish morphant rescue as MODEL_ORGANISM
        under the METTL13 modifier - so no evidence is lost by leaving this summary sentence unsplit,
        and there is no contiguous substring of it that carries the hypomorphic conclusion without the
        cross-arm attribution.
