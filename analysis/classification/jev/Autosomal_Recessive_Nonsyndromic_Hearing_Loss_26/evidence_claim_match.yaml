              label: autosomal recessive nonsyndromic hearing loss 26
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Spiral Ganglion Neuron and Cochlear Supporting Cell Dysfunction
        description: 'Where GAB1 is expressed in the inner ear constrains what kind of disease DFNB26
          can be. All of the expression data below are from mouse. A Gab1 LacZ reporter in mouse cochlea
          at P0 labels supporting cells of the organ of Corti, spiral ganglion neurons, stria vascularis,
          spiral prominence, internal and external sulcus cells, spiral limbus and Reissner''s membrane
          - and explicitly not the inner or outer hair cells. GAB1 and METTL13 colocalise with a neurofilament
          marker in mouse cochlear whole mounts, in spiral ganglion neuronal cell bodies and in the fibres
          innervating the hair cells.

          So the lesion is placed in the neural and supporting-cell compartment rather than in the mechanotransduction
          apparatus. This is an expression-based inference: no cochlear histology or physiology from a
          GAB1 p.Gly116Glu model has been reported, and the node should be read as localising the pathway
          rather than as a demonstrated cellular pathology.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: spiral ganglion neuron
          term:
            id: CL:0011113
            label: spiral ganglion neuron
        - preferred_term: organ of Corti supporting cell
          term:
            id: CL:0002490
            label: organ of Corti supporting cell
      selected_evidence:
        snippet: activity in the supporting cells of the organ of Corti (OC), spiral ganglion neurons
          (SG), internal (ISC) and external (ESC) sulcus cells, and spiral limbus region.
        supports: SUPPORT
