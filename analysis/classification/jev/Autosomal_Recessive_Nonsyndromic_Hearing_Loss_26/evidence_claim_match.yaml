      assertion_type: Diagnosis
      assertion:
        name: Genotyping of the DFNM1 modifier alongside the GAB1 genotype
        description: In a family segregating the GAB1 allele, the GAB1 genotype alone does not predict
          hearing status. A homozygote who also carries METTL13 p.Arg544Gln hears normally, so a prediction
          of profound congenital deafness made from the GAB1 result by itself would be wrong for all seven
          non-penetrant homozygotes of the only reported kindred. This is the practical consequence of
          the modifier and the reason it belongs in the diagnostic workup rather than only in the mechanism.
      selected_evidence:
        snippet: A modifier variant can abrogate the risk of a monogenic disorder.
        supports: SUPPORT
