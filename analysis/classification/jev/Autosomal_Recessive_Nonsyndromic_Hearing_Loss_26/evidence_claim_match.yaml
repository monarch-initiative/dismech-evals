  9a0f880180e16e1485f0cf8f8b49f53bfdfa4e8ca8982ed92742ec8ab29afb52:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 26
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 26
            term:
              id: MONDO:0011553
              label: autosomal recessive nonsyndromic hearing loss 26
        context: []
      assertion_type: Genetic
      assertion:
        name: METTL13
        notes: 'METTL13 (1q24) sits at the DFNM1 locus. The disease-relevant allele is a heterozygous
          dominant suppressor, not a cause: p.Arg544Gln, conserved across a wide range of species and
          absent from Pakistani, Indian, Human Diversity Panel and 1000 Genomes controls.

          The 2018 JCI paper that identified this allele describes METTL13''s methyltransferase and spermidine/spermine
          synthase activities as predicted only, and places p.Arg544Gln in the "spermine/spermidine synthase
          domain". That was accurate when written and is no longer the state of knowledge. METTL13 is
          a dual protein methyltransferase for eukaryotic elongation factor 1A: its N-terminal domain
          (MT13-N) dimethylates eEF1A Lys55, and its C-terminal domain (MT13-C) - the one that lacks close
          paralogs and is distantly related to spermidine synthase, which is why the earlier annotation
          called it an SpdS domain - trimethylates the eEF1A N terminus. The crystallised core of MT13-C
          spans residues 470-699, so Arg544 falls inside it.

          Two consequences for this entry. First, the suppressor allele now has a candidate biochemical
          activity to act through, where in 2018 it had none. Second, the assignment is specifically to
          the eEF1A N-terminal methyltransferase activity and not to the Lys55 activity: Liu et al. independently
          show that residues 1-401 suffice for Lys55 methylation and that the C-terminal domain is dispensable
          for it. What remains unknown is whether the suppressor works through eEF1A methylation at all,
          and how any such change would reach SPROUTY2 - see the knowledge gap below.'
        gene_term:
          preferred_term: METTL13
          term:
            id: hgnc:24248
            label: METTL13
        relationship_type: MODIFIER
        variants:
        - name: c.1631G>A (p.Arg544Gln)
          description: 'Heterozygous dominant suppressor allele at DFNM1. Present in every non-penetrant
            homozygote of family PK-2 and absent from every deaf member.

            Nomenclature caution. PMID:29408807 is internally inconsistent about this variant. It prints
            c.1631G>A eight times - in the Sanger sequencing results, in the Table 2 variant summary against
            NM_015935, and in the Figure 1E legend placing the change in exon 6 - and c.1634G>A twice,
            in the zebrafish rescue narrative and once in the discussion. This entry uses c.1631G>A throughout
            because that is the form the sequence-level results and the variant table carry. A curator
            reading the paper will hit the same fork; it is recorded here so it does not have to be re-derived.'
      selected_evidence:
        snippet: In a screen of 107 potential KMTs, we identified METTL13 as an active enzyme that specifically
          di-methylates the elongation factor eEF1A at lysine 55.
        supports: SUPPORT
