  51d0700a748d5979b8e20beaa46950a08c93a1fc3aeec18fb765123624a8e2ef:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 26
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 26
            term:
              id: MONDO:0011553
              label: autosomal recessive nonsyndromic hearing loss 26
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SPRY2 Upregulation
        description: 'Of the 37 MET/HGF pathway transcripts profiled, SPRY2 was the only one that differed
          between deaf and non-penetrant homozygotes: significantly upregulated in the deaf, and not upregulated
          in normal-hearing individuals carrying both the GAB1 variant and the METTL13 suppressor. SPROUTY2
          is a negative regulator within this pathway and its loss causes hearing loss in mice, so a change
          in its level is a plausible effector rather than a bystander.

          The suppression acts here. METTL13 coimmunoprecipitates with both GAB1 and SPROUTY2 and the
          three form a tripartite complex, so the modifier protein is physically positioned where the
          one discriminating transcript is controlled. The authors describe this as a plausible mechanism
          of suppression; whether normalising SPRY2 is what rescues hearing, or is a marker of something
          else the complex does, is not established.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SPRY2
          term:
            id: hgnc:11270
            label: SPRY2
        - preferred_term: METTL13
          term:
            id: hgnc:24248
            label: METTL13
      selected_evidence:
        snippet: Intriguingly, SPRY2 was significantly (P < 0.001) upregulated only in the lymphoblastoid
          cell lines from the 3 deaf individuals of family PK-2.
        supports: SUPPORT
    origin:
