          activity to act through, where in 2018 it had none. Second, the assignment is specifically to
          the eEF1A N-terminal methyltransferase activity and not to the Lys55 activity: Liu et al. independently
          show that residues 1-401 suffice for Lys55 methylation and that the C-terminal domain is dispensable
          for it. What remains unknown is whether the suppressor works through eEF1A methylation at all,
          and how any such change would reach SPROUTY2 - see the knowledge gap below.'
