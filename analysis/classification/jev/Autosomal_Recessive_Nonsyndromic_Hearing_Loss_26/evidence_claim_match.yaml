        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated MET/HGF Signaling
        description: 'GAB1 is the adapter for MET, the hepatocyte growth factor receptor, and this pathway
          is already established in human deafness from the other direction: noncoding HGF variants cause
          DFNB39, a MET variant is associated with DFNB97, and SHP2 and SPRY2 deficits cause hearing loss
          in humans and mice respectively.

          In lymphoblastoid lines from family PK-2, 37 HGF-signaling genes were profiled. MET, AKT3, hRAS,
          STAT1, FAS-R, RAC1, C3G, RAP-1a, GRB2, SHC, EGR1, JAK1 and ELK1 were all down more than two-fold
          and PI3K was up - but in deaf and non-penetrant homozygotes alike. That is the signature of
          the GAB1 genotype, and by construction it cannot be what distinguishes the two clinical outcomes.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: hepatocyte growth factor receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0048012
            label: hepatocyte growth factor receptor signaling pathway
        genes:
        - preferred_term: MET
          term:
            id: hgnc:7029
            label: MET
        - preferred_term: HGF
          term:
            id: hgnc:4893
            label: HGF
      selected_evidence:
        snippet: Among these genes, MET, AKT3, hRAS, STAT1, FAS-R, RAC1, C3G, RAP-1a, GRB2, SHC, EGR1,
          JAK1, and ELK1 were downregulated by more than 2-fold (P < 0.05) in both DFNB26 deaf and nonpenetrant
          individuals
        supports: SUPPORT
