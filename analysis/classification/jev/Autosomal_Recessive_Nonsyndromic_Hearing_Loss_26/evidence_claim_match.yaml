  782399f3cb660e16aa50a7ef5eb00a11013a4107495666650c709c50aa720107:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 26
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 26
            term:
              id: MONDO:0011553
              label: autosomal recessive nonsyndromic hearing loss 26
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb26_mettl13_suppression_mechanism
        kind: KNOWLEDGE_GAP
        prompt: Does normalising SPRY2 expression cause the suppression of DFNB26 deafness by METTL13
          p.Arg544Gln, or is SPRY2 only a marker of it?
        attaches_to:
        - pathophysiology#SPRY2 Upregulation
        - pathophysiology#Dysregulated MET/HGF Signaling
        rationale: 'The correlative evidence is strong and unusually clean. Thirty-seven MET/HGF pathway
          transcripts were measured in lymphoblastoid lines from the same family; fourteen are dysregulated
          in deaf and non-penetrant homozygotes alike - thirteen down and PI3K up - and only SPRY2 tracks
          hearing status. METTL13 is in a complex with GAB1 and SPROUTY2, so it is positioned to act there.

          But nothing in the reported work shows that changing SPRY2 changes hearing. The measurement
          is in lymphoblastoid cells, not cochlea, and the zebrafish rescue scores an early developmental
          phenotype, not an auditory one.

          The biochemical half of the gap has narrowed since the disease paper was written, and the question
          should be posed against what is now known rather than against the 2018 annotation. METTL13 is
          not an enzyme of unknown activity: it is a dual methyltransferase for eEF1A, and p.Arg544Gln
          falls in MT13-C, the domain that trimethylates the eEF1A N terminus. So the modifier now has
          a candidate reaction to act through. What is still entirely open is whether it acts through
          eEF1A methylation at all - a PubMed sweep of METTL13 crossed with eEF1A and with deafness returns
          no report of an eEF1A methylation measurement in any DFNB26 sample or model, and none of the
          eEF1A methylation literature touches hearing - and by what route a change in translation elongation
          would reach SPROUTY2 levels specifically. The authors say "plausible mechanism" of the SPRY2
          correlation, and that is still the right strength.

          What would settle it is a manipulation rather than a correlation: lower SPRY2 in a GAB1-hypomorphic
          cochlear context and ask whether hearing is preserved. No mouse model of the human GAB1 allele
          exists to do that in, which is the practical bottleneck - the Gab1 null is embryonic lethal,
          so a knock-in of p.Gly116Glu is the required reagent. A cheaper intermediate step is now available
          too: assay eEF1A N-terminal and Lys55 methylation in the existing lymphoblastoid lines from
          this family, which would say whether the suppressor allele changes METTL13 output at all.'
      selected_evidence:
        snippet: Among the genes examined, only SPRY2 was regulated differently when affected and nonpenetrant
          individuals
        supports: SUPPORT
