            term:
              id: MONDO:0012355
              label: autosomal recessive nonsyndromic hearing loss 28
        context: []
      assertion_type: Genetic
      assertion:
        name: TRIOBP
        relationship_type: CAUSATIVE
        notes: TRIOBP isoform classes have distinct promoters and coding sequences. TRIOBP-4 and TRIOBP-1
          share no coding sequence; the long TRIOBP-5 isoform includes regions represented in both. The
          established truncating alleles discussed here affect TRIOBP-4/5 or TRIOBP-5 while sparing TRIOBP-1.
          The original expression study detected the long human transcript in cochlea, retina and fetal
          brain, so expression should not be described as exclusively inner ear and retina. Nonsense-mediated
          decay and protein-level consequences of individual patient alleles remain partly predicted.
          Transcript accession and version are needed when comparing variant coordinates across older
          studies. On NM_001039141.2, homozygous c.1342C>T (p.Arg448*) was reported in two Chinese siblings,
          separately from the Afghan implant family. A second Chinese report identified c.1170delC (p.Ser391Profs*488)
          and c.3764C>G (p.Ser1255*) in a woman with familial reports of bilateral prelingual deafness;
          detailed audiometry was unavailable, so that report cannot establish a quantified severity or
          course. The South African TS005 family supports two segregating frameshift alleles, although
          the deceased father was not genotyped. Lack of segregation for particular missense variants
          in TS005/TS067 does not establish that every TRIOBP missense variant is benign.
        gene_term:
          preferred_term: TRIOBP
          term:
            id: hgnc:17009
            label: TRIOBP
      selected_evidence:
        snippet: The novel long isoform of TRIOBP has a restricted expression profile, including cochlea,
          retina, and fetal brain, whereas the original short isoform is widely expressed.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
