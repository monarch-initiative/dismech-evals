  303fb0cb716aacb82a1cbacd09700395162d4ca0988d2cb1d8ffad4eba84717f:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 28
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 28
            term:
              id: MONDO:0012355
              label: autosomal recessive nonsyndromic hearing loss 28
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: triobp5_only_alleles_and_milder_phenotype
        kind: KNOWLEDGE_GAP
        prompt: Do alleles that truncate TRIOBP-5 but leave TRIOBP-4 intact cause a milder, later-onset
          or stable hearing loss, and if so, why does the TRIOBP-5-null mouse become profoundly deaf?
        attaches_to:
        - phenotypes#Moderate to Severe Sensorineural Hearing Impairment
        - genetic#TRIOBP
        - animal_models#Triobp delta-exon9-10 TRIOBP-5-deficient mouse
        rationale: A TRIOBP-5-only p.Gly1672* allele occurred in one Dutch patient and the Polish siblings,
          in trans with an allele affecting TRIOBP-4/5. The Dutch study also described another patient
          with moderate loss, and its authors stated that variant location might contribute in only one
          of their two cases. Preserving one TRIOBP-4-encoding copy therefore cannot explain the entire
          milder spectrum. The small number of families cannot separate isoform, allele-specific and background
          effects. The mouse lacking TRIOBP-5 on both alleles progresses to severe-to-profound loss within
          two months, which is a different genotype from those compound heterozygous patients. A published
          TriobpΔEx8/YHB226 compound heterozygote already expresses one wild-type TRIOBP-4 copy and has
          slower degeneration than the exon9-10-null mouse, but exon-skipping transcripts and TRIOBP-5
          rootlet immunoreactivity suggest a residual shortened protein. A cleaner comparison must distinguish
          TRIOBP-4 dosage from residual TRIOBP-5 function and preserve comparable TRIOBP-1 expression.
        proposed_experiments:
        - experiment_id: exp_dfnb28_triobp5_only_compound_heterozygous_mouse
          name: Separate TRIOBP-4 dosage from residual TRIOBP-5 activity
          description: Compare a verified TRIOBP-5-specific null/TRIOBP-4/5-null compound heterozygote
            with the published TriobpΔEx8/YHB226 and exon9-10-null models. Measure transcripts and proteins
            to exclude residual TRIOBP-5 and control TRIOBP-1 expression before comparing longitudinal
            ABR, DPOAE and rootlet ultrastructure. This tests a dosage hypothesis without claiming the
            existing gene-trap model is a clean null.
          would_support:
          - phenotypes#Moderate to Severe Sensorineural Hearing Impairment
          supporting_outcome:
          - Thresholds plateau at a moderate level with rootlets present but dysmorphic, matching the
            stable moderate human course.
          would_refute:
          - phenotypes#Moderate to Severe Sensorineural Hearing Impairment
          refuting_outcome:
          - Hearing declines to profound on the same timescale as the TRIOBP-5-null mouse, which would
            point to a background or allele-specific explanation for the milder human cases.
      selected_evidence:
        snippet: This suggests that a single TRIOBP copy to encode wildtype TRIOBP-4 is insufficient for
          normal hearing, and that at least one TRIOBP copy to encode TRIOBP-5 is indispensable for normal
          inner ear function.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28089734
      reference_title: 'Broadening the phenotype of DFNB28: Mutations in TRIOBP are associated with moderate,
        stable hereditary hearing impairment.'
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' isoform hypothesis, which this discussion records as open.
