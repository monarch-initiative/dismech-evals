        description: Offer nondirective genetic counseling and confirm parental genotypes. If both parents
          are heterozygous carriers of the familial pathogenic TRIOBP variants, each pregnancy has a 25%
          chance of biallelic hearing loss, a 50% chance of carrier status and a 25% chance of inheriting
          neither familial variant. Other parental genotype combinations require a separate recurrence
          assessment. Onset, severity and progression cannot be reliably predicted from the small reported
          isoform-specific series. Discuss reproductive testing options according to individual preferences.
      selected_evidence:
        snippet: If both parents are known to be heterozygous for an autosomal recessive hearing loss-related
          pathogenic variant, each sib of the proband has at conception a 25% chance of having hearing
          loss, a 50% chance of having no hearing loss and being a carrier, and a 25% chance of having
          no hearing loss and not being a carrier.
        supports: SUPPORT
        directness: DIRECT
