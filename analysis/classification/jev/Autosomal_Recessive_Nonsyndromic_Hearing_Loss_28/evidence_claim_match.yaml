        description: Combined loss of TRIOBP-4/5 in mice prevents mature stereocilia rootlet formation,
          whereas selective TRIOBP-5 deficiency permits malformed rootlets that are thin or fragmented
          in the cuticular plate and expanded within stereocilia cores. These are distinct assembly defects,
          not a universal absence of rootlets across all human genotypes. ANKRD24 and TRIOBP-5 have reciprocal
          localization dependencies in mouse hair cells; re-expression of TRIOBP-5 in mutant cochlear
          explants restores ANKRD24 localization. TPRN-deficient mice also lose TRIOBP-5 and ANKRD24 from
          shorter-row rootlets during early development, illustrating a related molecular compartment
          rather than a second established cause or human modifier of DFNB28.
        biological_scale: CELLULAR
