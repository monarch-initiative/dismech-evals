      assertion:
        name: Reduced Stereocilia Pivot Stiffness
        description: In early postnatal mouse cochlear explants lacking TRIOBP-4/5, inner-hair-cell bundles
          are more compliant to calibrated fluid-jet stimulation and can lose further stiffness after
          a large deflection. The magnitude depends on stimulus order and the presence of extracellular
          links. Mechanotransduction responses were preserved in P4-P9 hair-cell recordings before hearing
          onset, so the initial experimental defect concerns bundle mechanics rather than demonstrated
          failure of MET-channel assembly. These early ex vivo results do not show preserved transduction
          after bundle degeneration or directly measure patient hair cells.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
      selected_evidence:
        snippet: We found that TriobpΔex8/Δex8 stereocilia are about twice more flexible as compared to
          TriobpΔex8/+ stereocilia, when deflected by fluid-jet stimuli of progressively increasing intensity.
        supports: SUPPORT
