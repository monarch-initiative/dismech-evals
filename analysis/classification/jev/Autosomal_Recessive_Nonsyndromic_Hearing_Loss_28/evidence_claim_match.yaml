              label: autosomal recessive nonsyndromic hearing loss 28
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: triobp_supporting_cell_contribution
        kind: HUMAN_MODEL_MISMATCH
        prompt: How much of DFNB28 hearing loss comes from softened supporting cells rather than from
          the hair bundle lesion, and does the supporting-cell defect exist in human cochleae?
        attaches_to:
        - pathophysiology#Reduced Apical Stiffness of Organ of Corti Supporting Cells
        rationale: The supporting-cell stiffness change was measured with atomic force microscopy in freshly
          dissected early postnatal mouse cochleae. Both TRIOBP-deficient mouse lines also lose their
          hair bundles, so the two lesions are confounded in every animal studied, and no method used
          in patients reads out reticular lamina mechanics. Improved aided thresholds after cochlear implantation
          in three siblings from one family are compatible with enough auditory neural function to benefit
          from electrical stimulation. The short follow-up and differing speech-perception outcomes do
          not establish universal neural preservation, and implantation does not measure supporting-cell
          mechanics. The edge from this node to hearing loss is therefore recorded with unknown intermediates.
      selected_evidence:
        snippet: Thus, in addition to hair cell stereocilia rootlets, TRIOBP-5 provides mechanical resilience
          to Deiters’ and pillar supporting cells of the organ of Corti that are also crucial for normal
          sound transduction.
        supports: SUPPORT
