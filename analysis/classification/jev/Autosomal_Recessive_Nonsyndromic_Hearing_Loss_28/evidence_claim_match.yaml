      assertion_type: Diagnosis
      assertion:
        name: TRIOBP sequencing on recessive hearing loss panels or exome
        description: Molecular confirmation requires biallelic pathogenic or likely pathogenic TRIOBP
          variants consistent with the phenotype and recessive inheritance, with parental testing to establish
          phase where needed. A hearing-loss panel or exome can identify such variants. Later-onset and
          less severe hearing loss can warrant TRIOBP analysis as well as congenital profound loss; two
