        description: Cochlear implantation can be considered for severe-to-profound hearing loss according
          to individual audiologic and anatomic candidacy. It electrically stimulates the auditory nerve
          downstream of hair-cell transduction. Three Afghan siblings homozygous for p.Arg448* received
          unilateral implants and reached aided pure-tone averages of 23 to 30 dB HL one month after activation.
          At ten months the two younger recipients achieved up to 77% correct phonemes, while the oldest
          could not yet perform open-set speech audiometry. This single-family, short-term series does
          not establish uniform benefit or localize every human lesion exclusively to the hair bundle.
