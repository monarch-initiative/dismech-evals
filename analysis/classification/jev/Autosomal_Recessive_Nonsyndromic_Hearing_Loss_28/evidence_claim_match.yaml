          is lost the course is slower: stereocilia, mainly of the tallest outer hair cell row, are lost
          by about postnatal day 40, plausibly by detachment at fragile pivot points. These mouse timelines
          cannot predict the human trajectory: the milder reported human genotypes are not equivalent
          to homozygous TRIOBP-5 deletion, and the reviewed studies do not directly measure patient rootlet
