              label: autosomal recessive nonsyndromic hearing loss 28
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Dense F-Actin Bundling by TRIOBP-4/5
        description: TRIOBP-4 and TRIOBP-5 share an N-terminal region carrying two repeat motifs, R1 and
          R2, of which R1 is the principal actin-binding domain. Purified TRIOBP-4 packs actin filaments
          into bundles that are denser than those made by espin, the cross-linker of the stereocilium
          shaft, and that resemble the rootlet. In the hair cell, the upper rootlet inside the stereocilium
          is bundled mainly by TRIOBP-4, while the lower rootlet inside the cuticular plate is bundled
          by both TRIOBP-4 and TRIOBP-5. TRIOBP-5 thickens the rootlet to its mature dimensions. Loss
          of the relevant isoforms is expected to impair this activity in hair cells and supporting cells;
          residual bundling by individual truncated human proteins has not been established for every
          allele.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TRIOBP
          term:
            id: hgnc:17009
            label: TRIOBP
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        molecular_functions:
        - preferred_term: actin filament binding
          term:
            id: GO:0051015
            label: actin filament binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: actin filament bundle assembly
          term:
            id: GO:0051017
            label: actin filament bundle assembly
          modifier: DECREASED
      selected_evidence:
        snippet: In vitro, purified TRIOBP isoform 4 protein organizes actin filaments into uniquely dense
          bundles reminiscent of rootlets but distinct from bundles formed by espin, an actin crosslinker
          in stereocilia.
        supports: SUPPORT
