  61f5ffbaf699a53bea339f8bb2c874d52dfa449fc0b171f02e7021f6cbeba9ad:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 30
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 30
            term:
              id: MONDO:0011774
              label: autosomal recessive nonsyndromic hearing loss 30
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disordered Stereocilia and Hair Bundle Architecture
        description: 'The hair bundle is an array of actin-cored stereocilia held at fixed, graded heights.
          Without class III myosin function the bundle is built wrongly: mice lacking both myosin IIIa
          and IIIb show abnormally tall and numerous microvilli or stereocilia, ungraded bundles, and
          bundle rounding and closure. The direction of that result is the opposite of what the espin-1
          transport model predicts on its own - the motors act to limit elongation and to shape the bundle,
          not simply to lengthen it.

          A single-gene Myo3a knock-in carrying a kinase-domain missense allele also shows structural
          abnormality of cochlear hair cell stereocilia, which is the closer model of the human recessive
          disease. Mechanoelectrical transduction currents themselves were robust with normal kinetics
          in the double mutants, so this is a bundle-architecture defect rather than a transduction-channel
          defect.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: auditory hair cell
          term:
            id: CL:0000202
            label: auditory hair cell
        cellular_components:
        - preferred_term: stereocilium
          term:
            id: GO:0032420
            label: stereocilium
        biological_processes:
        - preferred_term: auditory receptor cell stereocilium organization
          modifier: ABNORMAL
          term:
            id: GO:0060088
            label: auditory receptor cell stereocilium organization
      selected_evidence:
        snippet: These include abnormally tall and numerous microvilli or stereocilia, ungraded stereocilia
          bundles, and bundle rounding and closure.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26754646
      reference_title: Class III myosins shape the auditory hair bundles by limiting microvilli and stereocilia
        growth.
      evidence_source: MODEL_ORGANISM
      explanation: The bundle-architecture phenotype of the class III myosin double mutant; INDIRECT because
        it is a mouse double knockout, whereas DFNB30 is a single-gene human disease.
