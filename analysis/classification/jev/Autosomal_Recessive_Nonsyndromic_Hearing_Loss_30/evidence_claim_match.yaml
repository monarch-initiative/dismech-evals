      assertion_type: Pathophysiology
      assertion:
        name: MYO3A Loss of Function
        description: 'Biallelic pathogenic MYO3A variants impair myosin IIIa function. The founding family
          carried a nonsense allele and two splice-acceptor alleles. Lymphoblast RNA showed exon 18 skipping
          for one splice allele and loss of stable message from the other; these are measured RNA effects
          outside the cochlea. Missense variants also occur in motor and kinase domains, but reduced kinase
          activity is not equivalent to loss of motor activity: experimentally engineered K50R retains
          motor activity and increases tip localization in COS-7 cells. The clinical K50R report combined
          family segregation with structural modelling and earlier in-vitro evidence. Its proposed distinction
          between kinase-specific impairment and whole-protein dysfunction is not a validated general
          predictor of onset or severity.'
        role: trigger
        biological_scale: MOLECULAR
