  5571b8ea925d451bcf1dbeeeb24b47cfc30b7e13873a26fec36a215ff324771c:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 30
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 30
            term:
              id: MONDO:0011774
              label: autosomal recessive nonsyndromic hearing loss 30
        context: []
      assertion_type: Phenotype
      assertion:
        name: Congenital Profound Sensorineural Hearing Loss
        category: Auditory
        description: 'The severe end of the spectrum: hearing loss present from birth and profound in
          degree, reported with a kinase-domain ATP-binding-site allele and in a consanguineous family
          with congenital onset. Whether this tracks a distinct allele class is proposed but not established.'
        phenotype_term:
          preferred_term: Congenital profound sensorineural hearing impairment
          term:
            id: HP:0011476
            label: Profound sensorineural hearing impairment
          onset:
            onset_category: CONGENITAL
        notes: 'No frequency band is given. The evidence is two families rather than a cohort, so any
          band would be manufactured from a denominator that does not exist.

          Term choice: HPO has no single post-coordinated term for *congenital* *profound* sensorineural
          hearing impairment, so the degree is bound (`HP:0011476`) and congenital onset is carried in
          the `onset` slot. `severity: SEVERE` was removed rather than kept alongside: severe (71-90 dB
          HL) and profound (>90 dB HL) are distinct audiometric bands and `SeverityEnum` has no `PROFOUND`
          value, so the qualifier asserted a milder degree than the phenotype and its source.

          The two cited sources do not support the same thing, and the split matters. PMID:34423747 reports
          congenital *profound* hearing impairment segregating with the kinase-domain Lys50Arg allele
          - that sentence is where "profound" comes from. PMID:27063751 reports *congenital* hearing loss
          in the Kazakh family and does not grade it, so it supports the onset half of this phenotype
          and not the degree.'
      selected_evidence:
        snippet: This Lys50Arg mutation segregated with congenital profound non-syndromic HI.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/2
      evidence_path: /phenotypes/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34423747
      reference_title: Molecular insights into MYO3A kinase domain variants explain variability in both
        severity and progression of DFNB30 hearing impairment.
      evidence_source: HUMAN_CLINICAL
      explanation: The segregation observation in the reported family; graded HUMAN_CLINICAL because this
        sentence reports patients, unlike the same paper's modelling results.
