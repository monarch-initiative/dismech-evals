            term:
              id: MONDO:0011774
              label: autosomal recessive nonsyndromic hearing loss 30
        context: []
      assertion_type: Genetic
      assertion:
        name: MYO3A
        notes: 'Encodes myosin IIIa, a class III unconventional myosin: an N-terminal kinase domain that
          autophosphorylates, a motor head and neck, and a class-III-specific tail that binds actin. Expression
          in mammals is highly restricted, strongest in retina and cochlea, and the protein localises
          to the tips of the stereocilia of both cochlear and vestibular hair cells.

          Allelic spectrum. The founding family carried a nonsense allele plus two splice alleles; later
          reports add motor-domain and kinase-domain missense alleles. The Japanese series found eight
          possibly disease-causing variants, six of them novel, distributed across kinase, motor and tail
          domains, and looked for but did not find a genotype-phenotype correlation.

          Separately, a motor-domain missense allele has been reported to cause autosomal *dominant* nonsyndromic
          hearing loss, segregating in a family with post-lingual progressive deafness. That is an allelic
          disease with a different inheritance pattern, not part of DFNB30, and is recorded here so a
          MYO3A variant report is not automatically read as recessive.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MYO3A
          term:
            id: hgnc:7601
            label: MYO3A
      selected_evidence:
        snippet: Here, we show that normal hearing in humans requires myosin IIIA, the human homolog of
          NINAC.
        supports: SUPPORT
