            term:
              id: MONDO:0011774
              label: autosomal recessive nonsyndromic hearing loss 30
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MYO3A Loss of Function
        description: 'Biallelic loss-of-function variants remove or disable myosin IIIa. The founding
          family carried a nonsense allele truncating the C terminus of the motor head plus two splice
          alleles, and later families carry missense alleles in the motor and kinase domains. Myosin IIIa
          is a hybrid motor-signalling molecule: an N-terminal kinase domain that autophosphorylates and
          down-regulates the motor, a conserved head and neck, and a class-III-specific tail that binds
          actin and is required for tip targeting.

          The allele class matters for what follows. A computational study of kinase-domain variants proposes
          that abolishing kinase activity and autophosphorylation produces the congenital profound phenotype,
          while partial or complete inactivation of the protein produces the late-onset progressive one.
          That is a structural-modelling proposal rather than an established rule, and the largest patient
          series looked for a genotype-phenotype correlation and did not observe one.'
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MYO3A
          term:
            id: hgnc:7601
            label: MYO3A
        molecular_functions:
        - preferred_term: myosin IIIa actin-based motor activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0000146
            label: microfilament motor activity
        - preferred_term: myosin IIIa N-terminal kinase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0004672
            label: protein kinase activity
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          description: Nonsense, splice-site and missense alleles; the founding family's alleles are loss-of-function,
            and later missense alleles affect conserved motor- and kinase-domain residues.
      selected_evidence:
        snippet: In an extended Israeli family, nonsyndromic progressive hearing loss is caused by three
          different recessive, loss-of-function mutations in myosin IIIA.
        supports: SUPPORT
