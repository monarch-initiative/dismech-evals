        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Age-related hearing loss (presbycusis)
        description: The main differential in practice, and the reason DFNB30 is underdiagnosed. A down-sloping,
          progressive, post-lingual sensorineural loss beginning in the second or third decade is the
          audiometric shape of presbycusis arriving early; the distinguishing features are the age of
          onset and a family history, not the audiogram.
        distinguishing_features:
        - Onset in the second or third decade rather than in late middle age
        - Biallelic MYO3A variants on panel or exome testing
      selected_evidence:
        snippet: However, the elucidation of HL causation becomes more challenging when related to late-onset
          HL, as multiple factors, such as presbycusis, idiopathic sudden SNHL, environmental risk factors,
          etc., can be involved.
        supports: SUPPORT
