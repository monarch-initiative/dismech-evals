  22aee7d5def110ccbb1c65d4bc50dba09d1a901ccba393769f1cf9e7f92bc322:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 30
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 30
            term:
              id: MONDO:0011774
              label: autosomal recessive nonsyndromic hearing loss 30
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MYO3A Loss of Function
        description: 'Biallelic pathogenic MYO3A variants impair myosin IIIa function. The founding family
          carried a nonsense allele and two splice-acceptor alleles. Lymphoblast RNA showed exon 18 skipping
          for one splice allele and loss of stable message from the other; these are measured RNA effects
          outside the cochlea. Missense variants also occur in motor and kinase domains, but reduced kinase
          activity is not equivalent to loss of motor activity: experimentally engineered K50R retains
          motor activity and increases tip localization in COS-7 cells. The clinical K50R report combined
          family segregation with structural modelling and earlier in-vitro evidence. Its proposed distinction
          between kinase-specific impairment and whole-protein dysfunction is not a validated general
          predictor of onset or severity.'
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MYO3A
          term:
            id: hgnc:7601
            label: MYO3A
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          description: Established truncating and splice alleles support loss of function; individual
            missense variants require allele-specific evidence and cannot all be assumed to abolish both
            kinase and motor activities.
      selected_evidence:
        snippet: In an extended Israeli family, nonsyndromic progressive hearing loss is caused by three
          different recessive, loss-of-function mutations in myosin IIIA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
