      assertion_type: Diagnosis
      assertion:
        name: Massively parallel sequencing of a hearing-loss gene panel
        description: A hearing-loss multigene panel or genomic testing can assess MYO3A alongside other
          hearing-loss genes. The Japanese study used a 158-gene panel and read-depth copy-number analysis.
          Interpretation requires pathogenicity assessment and, where possible, confirmation that two
          variants are in trans. MYO3A need not be tested only after excluding each more common gene.
        diagnosis_term:
          preferred_term: massively parallel sequencing of a targeted hearing-loss gene panel
          term:
            id: NCIT:C101293
            label: Next Generation Sequencing
        results: Biallelic pathogenic or likely pathogenic MYO3A variants consistent with recessive inheritance
          support DFNB30; unresolved variants or phase require further assessment.
      selected_evidence:
        snippet: Among these subjects, we selected patients with biallelic MYO3A variants through MPS
          of 158 target genes.
        supports: SUPPORT
