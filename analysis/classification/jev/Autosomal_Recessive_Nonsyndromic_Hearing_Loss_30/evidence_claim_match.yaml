  3cd3b499584f88bd52e24297ac4f0f39309bb40939afd6d78a4af9ceacb774dc:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 30
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 30
            term:
              id: MONDO:0011774
              label: autosomal recessive nonsyndromic hearing loss 30
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Myosin IIIa Delivery to Stereocilia Tips
        description: 'Myosin IIIa is a plus-end-directed motor that accumulates at the tips of stereocilia,
          which is where the actin core is polymerised, and it carries cargo there - most clearly espin-1,
          an ankyrin-repeat espin isoform that binds actin monomers through a WH2 motif. Co-expressing
          myosin IIIa with espin-1 elongates filopodia about tenfold in COS-7 cells, and that elongation
          requires the transport step and the espin-1 WH2 activity, not merely the presence of both proteins.

          Loss of the motor therefore removes a tip-localised regulator of actin dynamics. The cargo-delivery
          account is incomplete on its own: in mice lacking both class III myosins, espin-1 was still
          properly targeted to stereocilia tips, so myosin IIIa is not the only route for espin-1 and
          the phenotype cannot be reduced to failed espin-1 delivery.'
        biological_scale: MOLECULAR
        cellular_components:
        - preferred_term: stereocilium tip
          term:
            id: GO:0032426
            label: stereocilium tip
      selected_evidence:
        snippet: This extraordinary filopodia elongation results from the transport of espin 1 to the
          plus ends of F-actin by myosin IIIa and depends on espin 1 WH2 activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19287378
      reference_title: Myosin IIIa boosts elongation of stereocilia by transporting espin 1 to the plus
        ends of actin filaments.
      evidence_source: IN_VITRO
      explanation: Establishes tip-directed cargo transport as a function of myosin IIIa, in heterologous
        cells and organotypic hair-cell culture.
