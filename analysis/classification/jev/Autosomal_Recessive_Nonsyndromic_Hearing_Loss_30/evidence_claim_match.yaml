        biological_processes:
        - preferred_term: auditory receptor cell stereocilium organization
          modifier: ABNORMAL
          term:
            id: GO:0060088
            label: auditory receptor cell stereocilium organization
      selected_evidence:
        snippet: These include abnormally tall and numerous microvilli or stereocilia, ungraded stereocilia
