      assertion_type: Diagnosis
      assertion:
        name: Age-appropriate audiometry
        description: Establishing that the loss is sensorineural and characterising its configuration.
          Because onset is usually in the second or third decade, most patients are testable by pure-tone
          audiometry; the paediatric presentations need behavioural or evoked-response methods instead.
          The configuration is diagnostically useful in itself - down-sloping in most patients, flat in
          a minority.
        diagnosis_term:
          preferred_term: audiometric assessment
          term:
            id: NCIT:C38036
            label: Audiometric Test
        results: Sensorineural loss, mild to profound, usually down-sloping.
        notes: The cited source does not report otoacoustic emissions or auditory brainstem response as
          part of its protocol beyond ASSR, so neither is claimed here even though both are standard in
          hearing-loss workups generally. The bound action term is the general Audiometric Test term rather
          than a method-specific one, because the cited protocol mixes pure-tone, behavioural and evoked-response
          methods by age; `preferred_term` carries the specificity.
      selected_evidence:
        snippet: 'Pure-tone audiometry was used to assess hearing thresholds for patients aged 5 years
          and above, whereas auditory steady state response (ASSR), conditioned orientation response audiometry
          (COR: one type of the behavioral audiometry), or play audiometry were used for individuals under
          5 years old.'
        supports: SUPPORT
