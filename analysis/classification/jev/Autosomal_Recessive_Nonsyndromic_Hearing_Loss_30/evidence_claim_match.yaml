      assertion:
        name: Variant interpretation under the ClinGen hearing-loss specification
        description: Variant classification, segregation and phase distinguish a molecular diagnosis from
          an uncertain candidate genotype. The Japanese series used ACMG/AMP criteria with hearing-loss
          specifications, but p.Glu770Lys and p.Ala238Thr remained uncertain and family segregation was
          unavailable. A VUS does not establish or exclude DFNB30; dominant MYO3A-associated hearing loss
          must also be considered for appropriate alleles and pedigrees.
        diagnosis_term:
          preferred_term: variant classification
          term:
            id: NCIT:C19770
            label: Molecular Analysis
        results: Allele-specific classification and inheritance assessment; uncertain genotypes remain
          unresolved.
      selected_evidence:
        snippet: As we were not able to conduct segregation analyses on the families of the probands due
          to a lack of peripheral blood samples, it is possible that the HL was due to other causes
        supports: SUPPORT
