        context: []
      assertion_type: Diagnosis
      assertion:
        name: Serial audiometry to establish progression
        description: The feature that distinguishes DFNB30 from most autosomal recessive nonsyndromic
          hearing loss is that it gets worse, so a single audiogram is not enough - the diagnosis rests
          on a trajectory. Every clinically characterised patient in the largest series was aware of progression,
          and the correlation of threshold with age was visible across the cohort even though serial audiograms
          on individual patients were not available.
        diagnosis_term:
          preferred_term: serial audiometric follow-up
          term:
            id: NCIT:C38036
            label: Audiometric Test
        results: Documented deterioration of thresholds over time, eventually to severe-to-profound loss.
      selected_evidence:
        snippet: A further prospective study will be useful in evaluating hearing deterioration through
          the use of the serial audiometric testing results from the same patient.
        supports: SUPPORT
