  c901ff7b36f1e86cc607cd651584bad9d6001cc803eabae110eef009cd800ecd:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 30
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 30
            term:
              id: MONDO:0011774
              label: autosomal recessive nonsyndromic hearing loss 30
        context: []
      assertion_type: Genetic
      assertion:
        name: MYO3A
        notes: MYO3A encodes a class III myosin with kinase, motor and tail domains. In the founding family,
          a nonsense allele and two splice alleles segregated as recessive disease; lymphoblast transcript
          assays supported exon skipping or unstable message for the splice variants. Between ages 25
          and 50, nonsense homozygotes had poorer hearing than nonsense/splice compound heterozygotes,
          with similarly severe loss later in life. This is a within-family association, not a universal
          prediction for all alleles. The Japanese series identified eight candidate variants, two classified
          as uncertain (p.Glu770Lys and p.Ala238Thr), and lacked familial segregation. Its failure to
          find a correlation does not negate the earlier family-specific observation. Dominant MYO3A alleles
          require separate assessment; simple heterozygosity for an established recessive allele is not
          itself diagnostic of dominant hearing loss.
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MYO3A
          term:
            id: hgnc:7601
            label: MYO3A
      selected_evidence:
        snippet: Here, we show that normal hearing in humans requires myosin IIIA, the human homolog of
          NINAC.
        supports: SUPPORT
