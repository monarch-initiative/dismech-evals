            label: Genetic Counseling
        description: Provide nondirective counseling after molecular confirmation. Recurrence risk is
          conditional on established parental pathogenic genotypes, and testing relatives requires identification
          of the familial variants. Distinguish recessive DFNB30 from allele-specific dominant MYO3A-associated
          hearing loss.
      selected_evidence:
        snippet: If both parents are known to be heterozygous for an autosomal recessive hearing loss-related
          pathogenic variant, each sib of the proband has at conception a 25% chance of having hearing
          loss, a 50% chance of having no hearing loss and being a carrier, and a 25% chance of having
          no hearing loss and not being a carrier.
