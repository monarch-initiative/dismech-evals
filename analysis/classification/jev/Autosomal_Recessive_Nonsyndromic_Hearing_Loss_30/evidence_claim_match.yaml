        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Age-related hearing loss (presbycusis)
        description: Age-related hearing loss can overlap with later-recognized progressive sensorineural
          impairment. Age at onset, family history and molecular findings help distinguish inherited disease;
          the cited paper does not establish presbycusis as the main cause of DFNB30 underdiagnosis.
        distinguishing_features:
        - Onset in the second or third decade rather than in late middle age
