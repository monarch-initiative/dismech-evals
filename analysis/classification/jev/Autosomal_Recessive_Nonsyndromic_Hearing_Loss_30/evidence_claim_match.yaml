          or exome. In the largest series it came from a 158-gene panel covering nonsyndromic and syndromic
          hearing loss, with copy-number analysis run over the same read-depth data. Biallelic variants
          are required, and the phase matters.
        diagnosis_term:
          preferred_term: massively parallel sequencing of a targeted hearing-loss gene panel
          term:
            id: NCIT:C101293
            label: Next Generation Sequencing
        results: Biallelic MYO3A variants - homozygous or compound heterozygous.
