        description: 'The genes that account for most autosomal recessive nonsyndromic hearing loss and
          that a panel will solve first. They are separated from DFNB30 by the panel result rather than
          clinically, which is the point: MYO3A is roughly 0.06% of an ascertained hearing-loss cohort
          against GJB2''s 16%, so it is a diagnosis of exclusion within the panel.'
