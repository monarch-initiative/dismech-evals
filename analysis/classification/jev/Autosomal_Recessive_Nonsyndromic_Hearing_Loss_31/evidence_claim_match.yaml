            term:
              id: MONDO:0011767
              label: autosomal recessive nonsyndromic hearing loss 31
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb31_vestibular_mouse_human_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Whirlin-null mice have overt vestibular dysfunction and no published WHRN patient reports
          a vestibular deficit. Is human DFNB31 genuinely vestibular-sparing, or has vestibular function
          never been tested?
        attaches_to:
        - pathophysiology#Failure of Stereocilia Elongation and Bundle Organization
        rationale: 'Whirlin is expressed in vestibular hair cells as well as cochlear ones, and the same
          stereocilia machinery builds both bundles, so a vestibular phenotype is what the mechanism predicts.
          The whirler mouse circles and head-bobs, and the mouse lacking both isoforms has profound deafness
          with vestibular dysfunction. Against that, the review summarising the published WHRN patients
          records that none of them self-reported a vestibular deficit - which is a statement about what
          patients volunteered, not about what testing showed. Whether DFNB31 spares the human vestibular
          system, or whether the deficit is present and compensated or simply unmeasured, changes what
          should be offered clinically: vestibular assessment and balance habilitation in a deaf child
          are not routine unless a deficit is suspected.'
        proposed_experiments:
        - experiment_id: exp_dfnb31_formal_vestibular_testing
          name: Formal vestibular testing of a DFNB31 cohort
          description: Vestibular-evoked myogenic potentials, caloric testing and video head impulse testing
            in genotyped DFNB31 patients, with age-matched controls, rather than symptom questionnaires.
          would_support:
          - pathophysiology#Failure of Stereocilia Elongation and Bundle Organization
          supporting_outcome:
          - Measurable vestibular hypofunction in DFNB31 patients would show that the murine phenotype
            translates and that the absence of self-reported symptoms reflects compensation rather than
            sparing.
          would_refute:
          - pathophysiology#Failure of Stereocilia Elongation and Bundle Organization
          refuting_outcome:
          - Normal vestibular function on formal testing would establish a real cochlear-restricted phenotype
            in humans and make the mouse a poor model for this aspect of the disease.
      selected_evidence:
        snippet: None of these aforementioned patients self-reported any vestibular deficits.
        supports: SUPPORT
        directness: DIRECT
