            term:
              id: MONDO:0011767
              label: autosomal recessive nonsyndromic hearing loss 31
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Stereocilia Elongation and Bundle Organization
        description: 'Hair bundles in whirlin-null mice are built from abnormally short stereocilia, in
          both inner and outer hair cells. The defect is in elongation and maintenance of the actin core
          and in the organization of the bundle, not in the presence of the stereocilia themselves. The
          isoforms divide the work: a mouse expressing the short isoform but not the long one keeps inner
          hair cell bundles close to normal and loses outer hair cell bundle morphology, organization
          and function, so the long isoform is doing something the short one does not - its localization
          midway along the shorter stereocilia coincides with the inter-stereociliary links.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear hair cell
          term:
            id: CL:0000202
            label: auditory hair cell
        cellular_components:
        - preferred_term: stereocilium bundle
          term:
            id: GO:0032421
            label: stereocilium bundle
        biological_processes:
        - preferred_term: stereocilia elongation by actin polymerization
          modifier: DECREASED
          term:
            id: GO:0030041
            label: actin filament polymerization
        - preferred_term: auditory hair cell stereocilium organization
          modifier: ABNORMAL
          term:
            id: GO:0060088
            label: auditory receptor cell stereocilium organization
        - preferred_term: stereocilium maintenance
          modifier: DECREASED
          term:
            id: GO:0120045
            label: stereocilium maintenance
      selected_evidence:
        snippet: detailed ultrastructural analysis of sensory hair cells in the organ of Corti of the
          inner ear indicates that the whirler gene encodes a protein involved in the elongation and maintenance
          of stereocilia in both inner hair cells (IHCs) and outer hair cells (OHCs)
        supports: SUPPORT
        directness: DIRECT
