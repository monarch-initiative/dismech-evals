              label: autosomal recessive nonsyndromic hearing loss 31
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Whirlin from the Stereocilia Tip Complex
        description: 'Whirlin localizes to the tips of stereocilia, and its expression there is dynamic
          rather than static: it appears and fades out in an ordered sequence across the rows of the growing
          bundle, fading from inner hair cells before outer hair cells. At the tip the short isoform binds
          EPS8, and the pair are required together for normal length regulation. Losing whirlin therefore
          removes the scaffold that assembles the actin-regulatory machinery at the one place in the stereocilium
          where the actin core grows.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: cochlear hair cell
          term:
            id: CL:0000202
            label: auditory hair cell
        cellular_components:
        - preferred_term: stereocilium tip
          term:
            id: GO:0032426
            label: stereocilium tip
      selected_evidence:
        snippet: We show that whirlin localizes at the tips of stereocilia.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
