      assertion_type: Genetic
      assertion:
        name: WHRN variants
        gene_term:
          preferred_term: WHRN
          term:
            id: hgnc:16361
            label: WHRN
        association: Causative
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        features: 'WHRN lies at 9q32 and encodes whirlin. The DFNB31 alleles reported so far are truncating
          and lie in the C-terminal half of the protein - R778X in exon 10 and the exon 11 frameshift
          G808DfsX11 - while the alleles reported in Usher syndrome type 2D lie in the long-isoform-specific
          N terminus. That positional split is the proposed explanation for why one gene produces a syndromic
          and a non-syndromic disease, and it is a proposal from a handful of clinical reports rather
          than a validated rule. One reported nonsyndromic case complicates it: a homozygous missense
          change at residue 207, inside the long-isoform-specific region, in a consanguineous Moroccan
          patient with severe hearing loss. Whether that patient''s retina was assessed is not stated
          in the source read here.'
      selected_evidence:
        snippet: While mutations in the C-terminal half of whirlin have previously been reported in non-syndromic
          deafness (DFNB31), both alterations identified in our USH2 family affect the long protein isoform.
        supports: SUPPORT
        directness: DIRECT
