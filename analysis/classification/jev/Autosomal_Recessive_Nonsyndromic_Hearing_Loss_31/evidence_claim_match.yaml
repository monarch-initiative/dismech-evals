            term:
              id: MONDO:0011767
              label: autosomal recessive nonsyndromic hearing loss 31
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic WHRN Loss of Function
        description: Biallelic WHRN variants remove or truncate whirlin, a PDZ-domain scaffold with two
          N-terminal PDZ domains, a proline-rich region and a C-terminal PDZ. The gene has two major isoforms
          - a long form encoded by exons 1-13 and a short form from exons 6-13 lacking PDZ1 and PDZ2 -
          and the alleles reported in DFNB31 sit in the C-terminal half, so both isoforms lose their C-terminal
          PDZ. The first DFNB31 allele described is the exon 10 nonsense change R778X; a frameshift in
          exon 11, G808DfsX11, was reported next.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: WHRN
          term:
            id: hgnc:16361
            label: WHRN
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: Nonsense and frameshift alleles in the C-terminal half of the protein, reported
            homozygously in consanguineous families.
      selected_evidence:
        snippet: The gene encoding whirlin also underlies the human autosomal recessive deafness locus
          DFNB31.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
