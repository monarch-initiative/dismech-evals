    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 31
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 31
            term:
              id: MONDO:0011767
              label: autosomal recessive nonsyndromic hearing loss 31
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb31_isoform_position_genotype_phenotype_rule
        kind: KNOWLEDGE_GAP
        prompt: Is the 5' / 3' positional rule - long-isoform-specific N-terminal alleles give Usher syndrome
          type 2D, C-terminal alleles give non-syndromic DFNB31 - actually a rule, or a pattern in a handful
          of families?
        attaches_to:
        - genetic#WHRN variants
        rationale: 'The rule is the entry''s mechanistic account of why one gene gives two diseases, and
          it is doing real clinical work: it is what would decide whether a WHRN-positive deaf child is
          put under retinal surveillance. But it rests on two alleles in one German USH2 family set against
          the DFNB31 alleles known in 2007, and its authors stated it as a proposal. One later nonsyndromic
          report carries a homozygous missense change at residue 207, inside the long-isoform-specific
          region, without a reported retinal assessment. Until a genotype-stratified cohort with ophthalmological
          follow-up exists, the rule should not be used to withhold retinal surveillance.'
        proposed_experiments:
        - experiment_id: exp_dfnb31_genotype_stratified_retinal_followup
          name: Genotype-stratified retinal follow-up of WHRN-positive hearing loss
          description: Assemble WHRN biallelic cases from hearing loss cohorts, classify alleles by whether
            they affect the long-isoform-specific exons, and follow retinal function longitudinally into
            the third decade.
          would_support:
          - genetic#WHRN variants
          supporting_outcome:
          - Retinitis pigmentosa confined to carriers of long-isoform-specific alleles would turn the
            proposal into a usable clinical rule.
          would_refute:
          - genetic#WHRN variants
          refuting_outcome:
          - Retinal degeneration in carriers of C-terminal alleles, or its absence in carriers of N-terminal
            ones, would show that isoform position does not determine the syndromic boundary.
      selected_evidence:
        snippet: We propose that mutations causing Usher syndrome are probably restricted to exons 1-6
          that are specific for the long isoform and probably crucial for retinal function.
        supports: SUPPORT
        directness: INDIRECT
