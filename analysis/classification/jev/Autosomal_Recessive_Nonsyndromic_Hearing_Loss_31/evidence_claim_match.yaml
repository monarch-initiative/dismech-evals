        context: []
      assertion_type: AnimalModel
      assertion:
        name: AAV8-whirlin gene transfer in whirler mice
        species: Mouse
        genotype: Whrn wi/wi treated with AAV8 carrying wild-type whirlin cDNA by neonatal round-window
          injection
        publication: PMID:26307667
        description: 'A rescue experiment rather than a disease model: delivering wild-type whirlin cDNA
          to neonatal whirler cochleas restored normal stereocilia length and bundle architecture in infected
          hair cells and increased inner hair cell survival relative to the untreated contralateral ear.'
        modeled_mechanisms:
        - target: Failure of Stereocilia Elongation and Bundle Organization
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Restoring whirlin restores the bundle, which is the strongest available evidence
            that the bundle phenotype is a direct consequence of whirlin loss rather than a downstream
            or developmental side effect.
          limitations: 'Neonatal delivery in a mouse with a double-isoform-null allele. Round-window delivery
            partially lengthened inner but not outer hair cell stereocilia and did not restore hearing,
            so this experiment is a structural rescue without a functional one. That negative result is
            specific to the route: a later study delivering the same construct through the posterior semicircular
            canal reached more cochlear hair cells and partially improved both auditory and vestibular
            function. The claim that treating adult mice did not restore stereocilia comes from the deep-research
            report''s reading of full text that could not be fetched and is not asserted here.'
          readouts:
          - name: Stereocilia length and bundle architecture after transduction
            target: Failure of Stereocilia Elongation and Bundle Organization
            direction: RESTORED
            interpretation: Structural rescue in transduced hair cells.
          - name: Hearing after round-window delivery
            target: Failure of Stereocilia Elongation and Bundle Organization
            direction: UNCHANGED
            interpretation: Hearing loss was not restored despite partial stereocilia lengthening in inner
              hair cells, so the structural rescue did not carry through to function by this route.
      selected_evidence:
        snippet: Wild-type whirlin cDNA was delivered via adeno-associated virus (AAV8) by injection through
          the round window of the cochleas in neonatal whirler mice.
        supports: SUPPORT
