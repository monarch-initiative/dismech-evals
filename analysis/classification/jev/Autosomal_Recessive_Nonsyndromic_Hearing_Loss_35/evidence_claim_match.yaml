      assertion_type: Treatment
      assertion:
        name: Cochlear Implantation
        description: 'The standard intervention for severe-to-profound sensorineural hearing loss, and
          the only one with any DFNB35-relevant outcome data. That data is thin and should not be overstated:
          in a study designed to find genetic causes of *poor* implant outcome, an ESRRB variant appeared
          among the matched controls with good outcomes rather than among the cases, alongside five other
          genes. A single ESRRB child also appears in a series of genetically characterised implant candidates
          undergoing vestibular testing. Neither study reports ESRRB-specific implant performance, and
          neither has a DFNB35 denominator.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: cochlear device implantation
          term:
            id: NCIT:C15329
            label: Surgical Procedure
          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: cochlear implant
              term:
                id: NCIT:C157820
                label: Cochlear Implant
        notes: No TreatmentEffectEnum value is asserted at the entry level and no efficacy claim is made,
          because none of the cited sources reports a DFNB35 implant outcome. The mechanism link is graded
          BYPASSES on anatomical grounds - the implant does not act on the stria at all - rather than
          on measured benefit in this disease.
      selected_evidence:
        snippet: Mutations in the WFS1, GJB3, ESRRB, LRTOMT, MYO3A, and POU3F4 genes were detected in
          7 (23%) of the 30 matched controls.
        supports: SUPPORT
        directness: INDIRECT
