          Korean proband''s temporal bone CT and internal acoustic canal MRI were both normal - so the
          diagnosis is molecular. In practice ESRRB is reached through a multigene deafness panel or exome
          sequencing after GJB2 has been excluded, and the diagnostic difficulty is variant interpretation
          rather than variant detection: several reported ESRRB coding variants found homozygous in deaf
          patients were subsequently judged polymorphisms, and the recurrent p.Arg382Cys allele is frequent
          enough in East Asians to trip a stand-alone benign criterion.'
