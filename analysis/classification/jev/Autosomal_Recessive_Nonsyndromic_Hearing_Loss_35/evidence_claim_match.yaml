            term:
              id: MONDO:0012060
              label: autosomal recessive nonsyndromic hearing loss 35
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ESRRB Loss of Function
        biological_scale: MOLECULAR
        role: initiator
        mechanism_confidence: ESTABLISHED
        description: 'Biallelic ESRRB alleles that reduce or abolish the transcriptional output of ERR-beta.
          The reported spectrum is dominated by missense substitutions: of the coding variants described
          to date, all but one lie in the DNA-binding domain or the ligand-binding domain, split roughly
          evenly between them. Truncating alleles exist but are the minority - the seven base pair exon
          8 duplication that defined the gene in the Turkish family, and a canonical donor splice variant
          that skips exon 4 and triggers nonsense-mediated decay. Because most alleles are missense, DFNB35
          is better read as a graded loss of transcription factor activity than as a clean null.'
        genes:
        - preferred_term: ESRRB
          term:
            id: hgnc:3473
            label: ESRRB
        molecular_functions:
        - preferred_term: ERR-beta nuclear receptor transcription factor activity
          term:
            id: GO:0004879
            label: nuclear receptor activity
          modifier: DECREASED
        notes: 'No ESRRB genotype-phenotype correlation has been established: the 2024 review of the full
          reported spectrum found no significant difference in onset, severity or symmetry between DNA-binding-domain
          and ligand-binding-domain alleles.'
      selected_evidence:
        snippet: Of the 19 coding variants, all were located in functional domains except for one variant
          (c.16A>G:p.Arg6Gly). Nine were resided in the LBD while the remaining 9 were positioned in the
          DNA binding domain (DBD).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
