  c43a408d5f2e5b5dbaa511f0df253f1d5421c8a996f76c68e3ec262a983e8336:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 35
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 35
            term:
              id: MONDO:0012060
              label: autosomal recessive nonsyndromic hearing loss 35
        context: []
      assertion_type: Genetic
      assertion:
        name: ESRRB
        notes: Estrogen-related receptor beta, an orphan nuclear receptor at 14q24.3. Biallelic variants
          cause DFNB35. The reported alleles concentrate in the two functional domains - the DNA-binding
          domain and the ligand-binding domain - and are predominantly missense. The gene has a second,
          unrelated life as a core pluripotency transcription factor in embryonic stem cells, which is
          why searching the gene name returns mostly stem-cell and breast-cancer literature rather than
          deafness literature.
        gene_term:
          preferred_term: ESRRB
          term:
            id: hgnc:3473
            label: ESRRB
        relationship_type: CAUSATIVE
        variants:
        - name: c.1018_1024dup (7 bp duplication in exon 8)
          description: The allele that identified the gene, homozygous in a large consanguineous Turkish
            family. Frameshift with a premature stop codon.
          type: frameshift_variant
        - name: p.A110V, p.L320P, p.V342L, p.L347P
          description: The four missense alleles found in the original DFNB35 family and in three DFNB35-linked
            consanguineous Pakistani families. p.A110V is in the DNA-binding domain; the other three are
            in the ligand-binding domain.
          type: missense_variant
        - name: p.Arg382Cys (c.1144C>T)
          description: A recurrent ligand-binding-domain missense allele, notable because it is common
            enough in East Asian populations (gnomAD East Asian allele frequency 0.007) to trigger the
            ACMG stand-alone benign criterion BA1, and was therefore classified as a variant of uncertain
            significance despite deleterious in silico predictions. Direct functional work later showed
            reduced protein stability, abolished reporter activity and lowered target gene expression,
            supporting reclassification.
          clinical_significance: UNCERTAIN_SIGNIFICANCE
          type: missense_variant
        - name: c.397+2T>G
          description: Canonical donor splice-site variant found in trans with p.Arg382Cys in a Korean
            family. A minigene assay showed it skips exon 4, producing a premature stop codon and nonsense-mediated
            decay, confirmed by cycloheximide stabilisation of the transcript in patient cells.
          clinical_significance: PATHOGENIC
          type: splice_donor_variant
        - name: p.R291L
          description: Homozygous missense allele in a consanguineous Czech family, and one of the two
            DFNB35 families in which dental caries was assessed.
          type: missense_variant
        - name: p.Y305H
          description: Novel missense ligand-binding-domain allele in a Tunisian ARNSHL family.
          type: missense_variant
        - name: p.G167R (c.499G>A)
          description: Novel homozygous missense allele in exon 5, in the DNA-binding domain, segregating
            with hearing loss in a consanguineous Iranian family of Azeri Turkish ethnicity. Classified
            by ACMG/AMP criteria and in silico prediction rather than by a functional assay.
          clinical_significance: PATHOGENIC
          type: missense_variant
        - name: p.Tyr295Cys
          description: Novel missense allele reported in a Tunisian hearing-impairment panel study, independent
            of the earlier Tunisian p.Y305H family.
          clinical_significance: PATHOGENIC
          type: missense_variant
        - name: c.787+1G>A
          description: Novel homozygous splicing donor-site variant in a consanguineous Pakistani family
            with prelingual nonsyndromic hearing loss.
          type: splice_donor_variant
      selected_evidence:
        snippet: In a large consanguineous family of Turkish origin, genome-wide homozygosity mapping
          revealed a locus for recessive nonsyndromic hearing impairment on chromosome 14q24.3-q34.12.
        supports: SUPPORT
        directness: DIRECT
