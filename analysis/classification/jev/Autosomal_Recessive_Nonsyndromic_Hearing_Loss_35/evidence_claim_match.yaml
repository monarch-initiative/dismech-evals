              id: MONDO:0012060
              label: autosomal recessive nonsyndromic hearing loss 35
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of the Strial Marginal Cell Secretory Programme
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'ERR-beta is expressed specifically in the endolymph-producing cells of the inner
          ear - strial marginal cells in the cochlea, vestibular dark cells in the ampulla and utricle
          - and controls their development. Without it, these cells fail to express the panel of ion channel
          and transporter genes that makes them secretory, and they partially convert toward the identity
          of the adjacent Pendrin-expressing epithelium. This is a cell-fate defect, which is a different
          lesion from the transport defects that Jervell and Lange-Nielsen syndrome (KCNQ1, KCNE1) or
          Delpire-McNeill syndrome (SLC12A2) produce in the same cells: there the machinery is installed
          and broken, here it is not installed.'
        cell_types:
        - preferred_term: strial marginal cell
          term:
            id: CL:0002492
            label: strial marginal cell
        - preferred_term: vestibular dark cell
          term:
            id: CL:0000846
            label: vestibular dark cell
        biological_processes:
        - preferred_term: potassium ion transport into endolymph
          term:
            id: GO:0006813
            label: potassium ion transport
          modifier: DECREASED
        - preferred_term: inner ear development
          term:
            id: GO:0048839
            label: inner ear development
          modifier: DECREASED
        locations:
        - preferred_term: stria vascularis of the cochlear duct
          term:
            id: UBERON:0002282
            label: stria vascularis of cochlear duct
        notes: The Nr3b2 knockout characterisation is a mouse study and its cached abstract reports cell-fate,
          gene-expression and vascular findings but no audiometry, so the strial phenotype is what is
          measured here and the hearing consequence is inferred.
      selected_evidence:
        snippet: 'We show here that estrogen-related receptor beta (ERR-beta; NR3B2), an orphan nuclear
          receptor, is specifically expressed in and controls the development of the endolymph-producing
          cells of the inner ear: the strial marginal cells in the cochlea and the vestibular dark cells
          in the ampulla and utricle.'
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17765677
      reference_title: Estrogen-related receptor beta/NR3B2 controls epithelial cell fate and endolymph
        production by the stria vascularis.
      evidence_source: MODEL_ORGANISM
      explanation: Localises ERR-beta function to exactly these two cell types, which is what puts the
        DFNB35 lesion in the lateral wall rather than in the hair cell.
