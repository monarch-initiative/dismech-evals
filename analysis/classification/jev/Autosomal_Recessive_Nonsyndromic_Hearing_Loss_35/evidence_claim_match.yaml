        context: []
      assertion_type: Phenotype
      assertion:
        name: Progressive Hearing Impairment
        category: Auditory
        description: 'Progression is documented in the one DFNB35 patient followed long enough to show
          it: the Korean proband''s better ear deteriorated over seventeen years of serial audiograms.
          This matters clinically, because it means a moderate audiogram at presentation does not predict
          a stable one, and it distinguishes DFNB35 from the stereotype of a fixed congenital deafness.
          It is not the majority pattern - most reported patients are already severe-to-profound and symmetric
          when first tested, which leaves no room to observe progression - so the frequency is a floor,
          not a rate.'
        frequency: OCCASIONAL
        phenotype_term:
          preferred_term: Progressive hearing impairment
          term:
            id: HP:0001730
            label: Progressive hearing impairment
        notes: No longitudinal audiometry has been published for any other DFNB35 patient, so this is
          a denominator of one. It is recorded because a single well-documented seventeen-year series
          is a real observation about the disease's course, not because a frequency can be estimated from
          it.
      selected_evidence:
        snippet: Over the course of a 17-year monitoring period, audiograms exhibited a progressive nature
          of hearing loss in the right ear (Fig. 1b).
        supports: SUPPORT
        directness: DIRECT
