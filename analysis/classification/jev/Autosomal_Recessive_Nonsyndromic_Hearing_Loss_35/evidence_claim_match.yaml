            term:
              id: MONDO:0012060
              label: autosomal recessive nonsyndromic hearing loss 35
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Endolymph Production and Cochlear Lateral Wall Failure
        biological_scale: TISSUE
        role: amplifier
        mechanism_confidence: PROVISIONAL
        description: 'The tissue-level consequence: an endolymph-secreting epithelium that cannot secrete.
          In the mosaic mouse the defect is not confined to the marginal cell layer - null marginal cells
          alter gene expression in the intermediate cells beneath them and the local strial capillary
          bed is lost, so the stria fails as a three-layer unit rather than as one cell type. Both the
          endocochlear potential and the endolymphatic potassium concentration depend on this epithelium,
          and lesions elsewhere in the same compartment are established causes of profound deafness. Graded
          PROVISIONAL because the endolymph and endocochlear potential consequences of ESRRB loss specifically
          have not been measured; what is measured is the loss of the machinery that produces them.'
        cell_types:
        - preferred_term: strial marginal cell
          term:
            id: CL:0002492
            label: strial marginal cell
        biological_processes:
        - preferred_term: potassium ion homeostasis of endolymph
          term:
            id: GO:0055075
            label: potassium ion homeostasis
          modifier: DYSREGULATED
        locations:
        - preferred_term: stria vascularis of the cochlear duct
          term:
            id: UBERON:0002282
            label: stria vascularis of cochlear duct
        - preferred_term: endolymph
          term:
            id: UBERON:0001852
            label: endolymph
        notes: 'This node sits where the `sensorineural_hair_cell_loss` module places `Cochlear Ionic
          Homeostasis Disruption and Oxidative Stress`, and the same compartment is curated in `Jervell_and_Lange-Nielsen_Syndrome_1`
          and `Delpire-McNeill_Syndrome`, which are the natural comparison entries. `conforms_to` is deliberately
          not declared. Two reasons, both content rather than bookkeeping: the module node bundles potassium
          homeostasis with oxidative stress, and no oxidative-stress claim has been made for ESRRB; and
          the module node''s expected downstream edge is hair cell death, which is exactly the step this
          entry declines to assert because no ESRRB study has measured it. Declaring conformance would
          import both claims by reference. If an ESRRB mouse is ever shown to lose hair cells, this node
          should gain the module chain below it and the conformance declaration with it.'
      selected_evidence:
        snippet: In genetically mosaic mice, Nr3b2(-/-) strial marginal cells produce secondary alterations
          in gene expression in the underlying intermediate cells and a local loss of strial capillaries.
        supports: SUPPORT
        directness: DIRECT
