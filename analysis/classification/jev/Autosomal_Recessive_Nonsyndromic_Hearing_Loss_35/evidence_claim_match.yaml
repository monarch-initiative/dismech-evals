          hearing impairment, which is the narrower of the two. That direction is deliberate: HPO has
          no combined severe-to-profound term, and binding to the profound term instead would over-state
          severity for the patients at the severe end. The broader range is carried by `preferred_term`
          and by the description, which the term contract permits.'
      selected_evidence:
        snippet: The majority of hearing loss phenotypes exhibited symmetry, prelingual onset, and severe-to-profound
