              and `Delpire-McNeill_Syndrome`, which are the natural comparison entries. `conforms_to`
              is deliberately not declared. Two reasons, both content rather than bookkeeping: the module
              node bundles potassium homeostasis with oxidative stress, and no oxidative-stress claim
              has been made for ESRRB; and the module node''s expected downstream edge is hair cell death,
              which is exactly the step this entry declines to assert because no ESRRB study has measured
              it. Declaring conformance would import both claims by reference. If an ESRRB mouse is ever
              shown to lose hair cells, this node should gain the module chain below it and the conformance
              declaration with it.'
