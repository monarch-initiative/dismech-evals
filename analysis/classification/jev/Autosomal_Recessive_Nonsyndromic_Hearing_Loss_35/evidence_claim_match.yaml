          value:
            name: Nr3b2 (Esrrb) null mouse, including genetically mosaic animals
            species: Mouse
            genotype: Nr3b2(-/-); mosaic Nr3b2(-/-) inner ear epithelium
            publication: PMID:17765677
            description: The model that established what ERR-beta does in the inner ear. Because germline
              Nr3b2 loss is not compatible with normal development, the informative experiments are on
              the inner ear epithelium and on genetically mosaic animals in which null marginal cells
              sit beside wild-type ones - which is what makes the non-cell-autonomous effects on intermediate
              cells and capillaries interpretable.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Failure of the Strial Marginal Cell Secretory Programme
        relationship: RECAPITULATES
        fidelity: HIGH
        description: 'The mouse defines this node rather than merely supporting it: loss of the secretory
          gene programme and partial fate conversion of strial marginal cells are the mouse results the
          human mechanism is read from.'
        limitations: A null allele, whereas most human DFNB35 alleles are missense and hypomorphic, so
          the mouse is the severe end of the human spectrum. The cached record reports cell fate, gene
          expression and vascular findings only; no quantitative auditory measurement - ABR threshold,
          DPOAE or endocochlear potential - is available from it, so this model cannot close the loop
          to hearing loss. A behavioural hearing and balance phenotype has been described for rescued
          and conditional-null Esrrb animals elsewhere in the literature; it is not quotable from the
          caches available here and is not what this link claims.
        readouts:
        - name: Expression of strial marginal cell ion channel and transporter genes
          target: Failure of the Strial Marginal Cell Secretory Programme
          direction: DECREASED
          interpretation: The secretory gene programme is not switched on, which is the definition of
            this node.
        - name: Marginal cell identity relative to adjacent Pendrin-expressing epithelium
          target: Failure of the Strial Marginal Cell Secretory Programme
          direction: ALTERED
          interpretation: Fate conversion rather than simple loss of function. ALTERED rather than DECREASED
            because the cells acquire a different identity rather than losing one along an axis.
      selected_evidence:
        snippet: an orphan nuclear receptor, is specifically expressed in and controls the development
          of the endolymph-producing cells of the inner ear
        supports: SUPPORT
        directness: DIRECT
