  b4442b15b72f18c583b669b40444b6e83c3d28d31f9d668f74bc547b540c3c4d:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 35
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 35
            term:
              id: MONDO:0012060
              label: autosomal recessive nonsyndromic hearing loss 35
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced ERR-beta Transcriptional Output at Target Promoters
        biological_scale: MOLECULAR
        role: amplifier
        mechanism_confidence: ESTABLISHED
        description: 'The molecular consequence measured directly in patient material and in inner-ear
          derived cells. The recurrent p.Arg382Cys ligand-binding-domain substitution does not stop ERR-beta
          reaching the nucleus - subcellular fractionation and immunocytochemistry show wild-type-like
          nuclear localisation - but it destabilises the protein and abolishes its activity on a reporter
          promoter. Downstream, transcripts of ESRRB target genes fall by roughly half in patient-derived
          lymphoblastoid lines, including ATP1B1, which encodes the Na+/K+-ATPase beta-1 subunit that
          inner ear ion gradients depend on. The distinction matters mechanistically: this is a transcriptional
          output failure, not a trafficking failure.'
        biological_processes:
        - preferred_term: regulation of transcription by ERR-beta at target promoters
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: DECREASED
        notes: 'Graded IN_VITRO throughout even though the cells came from patients: these are reporter,
          cycloheximide-chase and qRT-PCR experiments in cultured lines, not clinical observations. The
          lymphoblastoid lines are also not inner ear tissue, which is the main reason this node is separated
          from the strial node below rather than merged into it.'
      selected_evidence:
        snippet: Transient overexpression of the ESRRB wild-type significantly increased luciferase activity,
          demonstrating a 2.09-fold increase relative to the internal control in HEI-OC1 cells (p < 0.01)
          and 2.21-fold in HEK293T cells (p < 0.01). However, the luciferase activity of ESRRB mutant
          did not exhibit a significant deviation from the internal control
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39261511
      reference_title: Functional pathogenicity of ESRRB variant of uncertain significance contributes
        to hearing loss (DFNB35).
      evidence_source: IN_VITRO
      explanation: 'The reporter assay: wild-type ERR-beta drives the promoter about two-fold, the p.Arg382Cys
        protein does not drive it at all.'
