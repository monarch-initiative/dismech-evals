  44bb38f5355f756e024bd05f0df4f809a5db17d2a2bb17d059c08500adf9cd3c:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 48
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 48
            term:
              id: MONDO:0012273
              label: autosomal recessive nonsyndromic hearing loss 48
        context: []
      assertion_type: Treatment
      assertion:
        name: Experimental AAV-CIB2 Gene Augmentation
        description: Preclinical gene augmentation with AAV2.Anc80L65 carrying mouse Cib2 partially restored
          cochlear architecture and hearing in Cib2-null mice treated at P0-P4. P6 treatment did not improve
          hearing with this construct. In P0-P1-treated null mice, benefit persisted to 24 weeks and was
          strongest at lower frequencies; high-frequency recovery was limited. P0-treated F91S knock-in
          mice retained partial low-frequency benefit to P60, the last tested time. These mouse studies
          do not establish human efficacy, safety or a prenatal treatment window.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: We observed sustained, but partial, recovery of hearing function and restoration of stereocilia
          architecture in the apical to middle cochlear turns in mice having received AAV-Cib2 between
          postnatal day 0 (P0) and P4.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42427029
      reference_title: Rescue of stereocilia architecture and hearing function by AAV-CIB2 and AAV-CIB3
        in a mouse model of recessive deafness DFNB48.
      evidence_source: MODEL_ORGANISM
      explanation: 'Reports the rescue with its two important limits stated by the authors themselves:
        the recovery is partial and restricted to apical-to-middle turns, and it depends on treating within
        a narrow postnatal window.'
