  d2733d19c85f482ec851eb6a5f10123e86b6f5f22ae709a4845183b152f7cfe3:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 48
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 48
            term:
              id: MONDO:0012273
              label: autosomal recessive nonsyndromic hearing loss 48
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CIB3 Paralogue Redundancy in Vestibular Hair Cells
        description: 'Vestibular hair cells co-express CIB2 and CIB3; cochlear hair cells express CIB2
          alone. CIB3 can functionally substitute for CIB2 - expressed in Cib2-null outer hair cells it
          rescues MET currents, whereas CIB1 does not. This is the mechanistic explanation for why the
          disease is non-syndromic: the vestibular system has a backup and the cochlea does not. It is
          a protective mechanism, so it has no downstream disease edge; it is the reason an expected edge
          to vestibular dysfunction is absent.'
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: vestibular hair cell
          term:
            id: CL:0000609
            label: vestibular hair cell
        notes: Deliberately carries no downstream edge. This node explains an absence - vestibular dysfunction
          - rather than causing a phenotype, and the pathograph has no representation for a protective
          mechanism inside a disease entry.
      selected_evidence:
        snippet: CIB2 is a Ca2+- and Mg2+-binding protein essential for mechanoelectrical transduction
          (MET) by cochlear hair cells, but not by vestibular hair cells that co-express CIB2 and CIB3.
          Here, we show that in cochlear hair cells, CIB3 can functionally substitute for CIB2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34089643
      reference_title: CIB2 and CIB3 are auxiliary subunits of the mechanotransduction channel of hair
        cells.
      evidence_source: MODEL_ORGANISM
      explanation: States both the differential expression and the functional substitution, which together
        account for the cochlea-restricted phenotype.
