      assertion:
        name: CIB3 Paralogue Redundancy in Vestibular Hair Cells
        description: CIB2 and CIB3 have overlapping roles in vestibular hair-cell MET in mouse models.
          Cib2/Cib3 double knockout disrupts vestibular MET and balance, whereas either single knockout
          preserves substantial vestibular function. Region-specific structural and dye-uptake abnormalities
          can still occur in single mutants. CIB3 can rescue MET when introduced into Cib2-null cochlear
          hair cells, while CIB1 cannot. Endogenous cochlear CIB3 expression is low rather than absolutely
          absent. Vestibular compensation is not evidence of retinal compensation or a proven human modifier
          effect.
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: vestibular hair cell
          term:
            id: CL:0000609
            label: vestibular hair cell
