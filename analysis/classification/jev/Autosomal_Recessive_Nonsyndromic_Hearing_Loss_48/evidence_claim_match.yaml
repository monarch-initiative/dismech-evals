  5f12694b1d4a46c05ed1b39f9de97c625deb1ede45dec2fef6df4e0a4fe7f73b:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 48
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 48
            term:
              id: MONDO:0012273
              label: autosomal recessive nonsyndromic hearing loss 48
        context: []
      assertion_type: Genetic
      assertion:
        name: CIB2
        gene_term:
          preferred_term: CIB2
          term:
            id: hgnc:24579
            label: CIB2
        relationship_type: CAUSATIVE
        notes: CIB2-related hearing loss includes homozygous and compound heterozygous genotypes. Reported
          variant classes include missense, nonsense, frameshift, splice-site and exon-deletion alleles.
          Founder effects were reported for p.Phe91Ser and p.Cys99Trp in Pakistani families. Hearing severity
          can differ among families with the same p.Phe91Ser genotype; these studies do not identify a
          proven human modifier or provide a population penetrance estimate. Splice and truncation consequences
          below distinguish prediction from directly measured functional results.
        variants:
        - name: c.272T>C (p.Phe91Ser)
          description: Recurrent Pakistani founder allele, homozygous in 54 DFNB48 families in the founding
            study. Moderate-to-severe and profound hearing loss have both been reported in families carrying
            this allele. The corresponding mouse knock-in loses cochlear MET despite preserved localization
            of mutant CIB2.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.297C>G (p.Cys99Trp)
          description: Missense variant segregating with deafness in two Pakistani families; linked haplotypes
            supported a founder effect.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.368T>C (p.Ile123Thr)
          description: Missense allele segregating with nonsyndromic hearing loss in a Turkish family.
            The corresponding knock-in mouse has abolished early cochlear MET currents.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.196C>T (p.Arg66Trp)
          description: Reported in homozygous and compound heterozygous genotypes, including in trans
            with c.300_309del in Trio-B.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.198+1G>A
          description: Homozygous canonical splice-site variant in family 51550. Exon-3 donor loss was
            predicted computationally, rather than established by a patient RNA assay. The proband underwent
            bilateral cochlear implantation.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.300_309del (p.Glu100fs*28)
          description: Frameshift allele found in trans with p.Arg66Trp in Trio-B. The predicted truncation
            affects the coding sequence of all four transcripts described in the study.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: CIB2 exon-2 deletion (p.Asp18Alafs*7)
          description: A homozygous 3113-bp deletion in Iranian family L-3156 removes coding exon 2 from
            transcripts 1 and 4. Read-depth inspection, PCR and breakpoint analysis identified the deletion;
            a frameshift and premature stop were predicted for these transcripts.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.344A>G (p.Tyr115Cys)
          description: Homozygous missense variant segregating with nonsyndromic hearing loss in Iranian
            family L-1644.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.330T>A (p.Tyr110Ter)
          description: Nonsense allele associated with nonsyndromic hearing loss. It affects the coding
            sequences of all four CIB2 transcripts described in the study.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.34C>T (p.Gln12Ter)
          description: Homozygous nonsense allele reported in Iranian family L-700 with nonsyndromic hearing
            loss. This early stop affects a subset of CIB2 isoforms; it is not automatically an experimentally
            confirmed absence of every isoform.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.97C>T (p.Arg33Ter)
          description: Nonsense allele found in trans with p.Arg66Trp in two Dutch siblings with congenital
            profound hearing loss. It affects some CIB2 isoforms; nonsense-mediated decay was predicted
            rather than directly measured.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
        - name: c.223G>A (p.Val75Met)
          description: Homozygous missense allele identified in the proband of Trio-C with nonsyndromic
            hearing loss.
          gene:
            preferred_term: CIB2
            term:
              id: hgnc:24579
              label: CIB2
      selected_evidence:
        snippet: We expand the mutational spectrum of CIB2 to include copy number variations (CNVs), splice-site
          variants and indels
        supports: SUPPORT
