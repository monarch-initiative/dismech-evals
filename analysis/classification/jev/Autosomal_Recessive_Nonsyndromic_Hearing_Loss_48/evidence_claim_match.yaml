      assertion_type: Pathophysiology
      assertion:
        name: CIB3 Paralogue Redundancy in Vestibular Hair Cells
        description: 'Vestibular hair cells co-express CIB2 and CIB3; cochlear hair cells express CIB2
          alone. CIB3 can functionally substitute for CIB2 - expressed in Cib2-null outer hair cells it
          rescues MET currents, whereas CIB1 does not. This is the mechanistic explanation for why the
          disease is non-syndromic: the vestibular system has a backup and the cochlea does not. It is
          a protective mechanism, so it has no downstream disease edge; it is the reason an expected edge
          to vestibular dysfunction is absent.'
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: vestibular hair cell
          term:
            id: CL:0000609
            label: vestibular hair cell
        notes: Deliberately carries no downstream edge. This node explains an absence - vestibular dysfunction
          - rather than causing a phenotype, and the pathograph has no representation for a protective
          mechanism inside a disease entry.
      selected_evidence:
        snippet: Both CIB2 and CIB3, but not CIB1, rescued MET defects in OHCs from Cib2
        supports: SUPPORT
