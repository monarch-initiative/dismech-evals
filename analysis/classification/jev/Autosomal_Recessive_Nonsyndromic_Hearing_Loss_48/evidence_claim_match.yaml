  586487f058d245f5da014e138795542d6cc92b549d23dd33082bf6de8cb432d2:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 48
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 48
            term:
              id: MONDO:0012273
              label: autosomal recessive nonsyndromic hearing loss 48
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure to Restrict Transducing Stereocilia Growth
        description: 'Beyond its channel role, CIB2 limits the length of the shorter, transducing rows
          of stereocilia: these overgrow in the hair bundles of Cib2 mutants, degrading the graded "staircase"
          architecture the bundle needs. This is a structural arm distinct from the channel arm.

          CIB2 does bind whirlin (WHRN) - the EF2 domain of CIB2 to the HHD2 region of WHRN - but the
          stereocilia role is not exercised *through* whirlin, which is the natural assumption and is
          wrong. Cib2/Whrn double homozygous mutants show the bundle phenotype of the Whrn single mutant
          rather than an additive one, overexpressing WHRN does not rescue Cib2-null stereocilia, and
          double heterozygotes hear normally, so there is no digenic interaction. What does change in
          Cib2-null hair cells is MYO15A, which over-accumulates at the tips of the first-row stereocilia.
          Whirlin itself, along with myosin XVa, Eps8 and Eps8L2, still reaches the stereocilia tips in
          Cib2 mutants, so CIB2 is not required to deliver them.

          The positive mechanism is not settled, and three candidates have been raised across this literature.
          PMID:28663585 offers two in its discussion: that CIB2 is part of the myosin XVa/whirlin elongation
          complex, and that it buffers free calcium near the MET channels at the stereocilia tips, where
          a local calcium change would alter actin remodelling. PMID:40083274 offers a third, that CIB2
          acts in the GPSM2-GNAI elongation complex.

          Two of the three are disfavoured on evidence this entry already carries, and are recorded here
          as retired rather than dropped. The myosin XVa/whirlin route is what the WHRN independence results
          above argue against. The calcium-buffering route is undercut by PMID:26173970: the p.F91S and
          p.R66W deafness substitutions do not alter the calcium buffering ability of CIB2, so a buffering
          deficit cannot be the mechanism by which those alleles cause disease. Neither is refuted outright
          - the buffering result covers two alleles, and p.I123T and p.R186W are reported to impair buffering
          - so the retirement is on the balance of the evidence, not a disproof.

          That leaves GPSM2-GNAI as the live candidate, and it is worth being precise about what it would
          and would not mean. It is not a whirlin route reintroduced under another name, but neither is
          it a claim that WHRN is uninvolved in elongation: GPSM2-GNAI itself binds WHRN and is carried
          to the stereocilia tips by MYO15A. The open question is which complex CIB2 acts in, not whether
          WHRN participates at all. The authors put it no higher than speculation and this entry does
          not adopt it as a mechanism arm.

          The same paper separates this arm from the channel arm on the phenotype itself: rows 2 and 3
          elongate in Cib2 mutants, whereas loss of mechanotransduction current makes transducing stereocilia
          retract. The overgrowth therefore cannot simply be downstream of the channel defect, which is
          the reason this node sits parallel to the transduction node rather than beneath it.'
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
