        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted CIB2-TMC1/TMC2 Association at the MET Channel
        description: CIB2 interacts with both the N-terminal cytoplasmic domain and the first intracellular
          loop of TMC1. Purified-protein NMR supports simultaneous binding to the two regions; crystallography
          and biochemical assays resolve distinct interfaces. Deafness-associated substitutions have allele-
          and assay-dependent effects on these interactions. Calcium-dependent fragment-binding results
          support a calcium-sensing role, but do not by themselves establish channel adaptation kinetics
          in hair cells. In 2025 fragment-binding assays, F91S strongly impaired binding to the N-terminal
          site, while I123T predominantly impaired binding to the intracellular-loop site under calcium-containing
          conditions. These specific effects do not imply that other interfaces or full-length protein
          interactions are normal.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        cellular_components:
        - preferred_term: hair cell stereocilium
          term:
            id: GO:0032420
            label: stereocilium
      selected_evidence:
        snippet: we report that calcium and integrin-binding protein 2 binds to the components of the
          hair cell mechanotransduction complex, TMC1 and TMC2, and these interactions are disrupted by
          deafness-causing Cib2 mutations.
        supports: SUPPORT
