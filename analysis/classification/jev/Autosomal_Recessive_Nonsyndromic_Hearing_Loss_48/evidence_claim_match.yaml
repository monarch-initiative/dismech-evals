              label: autosomal recessive nonsyndromic hearing loss 48
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cib2_ush1j_reassignment
        kind: CONTROVERSY
        prompt: Does CIB2 cause Usher syndrome type 1J, or only non-syndromic deafness DFNB48?
        rationale: 'CIB2 was originally reported as the gene for both DFNB48 and USH1J, and it is still
          listed among the six genes linked to the USH1 phenotype. A later multi-ethnic cohort of six
          ARNSHL families found non-syndromic deafness for every pathogenic genotype it examined, loss-of-function
          alleles included, and stated an intent to disqualify CIB2 as an Usher-causing gene. The mouse
          work supplies a mechanism for the reassignment: CIB3 compensates for CIB2 in vestibular hair
          cells and CIB2 mutations spare vestibular function, so the vestibular arm of the Usher phenotype
          has a positive reason to be absent rather than merely being unobserved. This entry curates the
          disease as non-syndromic on that basis, and both claims are recorded with their evidence because
          the difference is clinically consequential - whether a deaf child is counselled to expect progressive
          retinal degeneration turns on it. Note the reassignment rests on the absence of a finding in
          a modest cohort, and retinitis pigmentosa in Usher type 1 has onset in the first decade, so
          ascertainment age is a live limitation on the negative claim.'
        attaches_to:
        - disease#Autosomal Recessive Nonsyndromic Hearing Loss 48
        - pathophysiology#CIB3 Paralogue Redundancy in Vestibular Hair Cells
      selected_evidence:
        snippet: we report that mutations in CIB2, which encodes a calcium- and integrin-binding protein,
          are associated with nonsyndromic deafness (DFNB48) and Usher syndrome type 1J (USH1J)
        supports: SUPPORT
    origin:
