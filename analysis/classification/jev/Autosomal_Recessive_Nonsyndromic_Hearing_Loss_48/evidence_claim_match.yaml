        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cib2_ush1j_reassignment
        kind: CONTROVERSY
        prompt: Does CIB2 cause Usher syndrome type 1J, or only non-syndromic deafness DFNB48?
        rationale: The founding report assigned p.Glu64Asp in one Pakistani family to USH1J. Later CIB2
          cohorts, including truncating and exon-deletion genotypes, had nonsyndromic hearing loss; normal
          funduscopy in adults strengthens that counterevidence, while young children cannot exclude every
          later-onset manifestation. Minor vestibular findings in the Dutch series included slight hyperreflexia
          in one adult and unilateral weakness measured after cochlear implantation in one child; these
          do not establish the congenital vestibular areflexia of Usher type 1. Mouse CIB3 redundancy
          explains preserved vestibular function but does not establish retinal redundancy. A later retinal
          study reported RPE defects and reduced retinal responses in Cib2-deficient mice, so absence
          of mouse retinal involvement is not uniform across studies. Those experimental findings do not
          establish retinitis pigmentosa as a human DFNB48 phenotype.
        attaches_to:
        - disease#Autosomal Recessive Nonsyndromic Hearing Loss 48
        - pathophysiology#CIB3 Paralogue Redundancy in Vestibular Hair Cells
      selected_evidence:
        snippet: This was examined after cochlear implantation at the left ear.
        supports: NO_EVIDENCE
