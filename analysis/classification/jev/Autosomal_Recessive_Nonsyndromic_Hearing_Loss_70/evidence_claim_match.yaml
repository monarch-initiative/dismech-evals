            term:
              id: MONDO:0013978
              label: autosomal recessive nonsyndromic hearing loss 70
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counselling and Cascade Testing
        description: 'Counselling for an autosomal recessive condition, most often in a consanguineous
          family: a 25 percent sibling recurrence risk once one affected child is born, carrier testing
          for at-risk relatives, and a discussion of the uncertain long-term neurological prognosis raised
          by the adult siblings reported with late multisystem disease. Counselling does not act on the
          mechanism; it is curated because it is the intervention the genotype itself indicates.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'No audiological or surgical management is reported for any DFNB70 patient. Cochlear implantation
          is standard care for bilateral prelingual severe-to-profound sensorineural hearing loss and
          would be expected here, but no published DFNB70 family records an implant, a hearing aid, or
          an audiological outcome, so nothing is curated for it: attributing implantation to these patients
          would import an indication recorded only in other people. There is no disease-modifying therapy,
          no trial and no gene-directed approach for PNPT1 of any kind.'
      selected_evidence:
        snippet: The PNPT1-Glu475Gly variant identified in (Family.7_P7) segregated in 5 siblings born
          from consanguineous parents with ARNSHI
        supports: SUPPORT
