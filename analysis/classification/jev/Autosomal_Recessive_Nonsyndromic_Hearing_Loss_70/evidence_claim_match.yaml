        name: Vestibular Dysfunction
        category: Ear
        description: 'Reported in the South Indian family alongside the hearing loss. The vestibular and
          auditory end organs share hair cell biology and a common mitochondrial demand, so a shared lesion
          is the obvious reading, but no vestibular testing is reported for the other DFNB70 families
          and no vestibular tissue has been examined.

          Read the incoming edge with that in mind. It comes from the cochlear node, and vestibular hair
          cells are not cochlear: no published work places PNPase in the utricle, saccule or crista, and
          the mouse knockout that produces hearing loss was not assessed for balance. The edge is marked
          INDIRECT_UNKNOWN_INTERMEDIATES because it asserts a shared hair cell vulnerability and nothing
          more.'
        frequency: OCCASIONAL
        phenotype_term:
          preferred_term: Vestibular dysfunction
          term:
            id: HP:0001751
            label: Abnormal vestibular function
        notes: Reported in one of the four published families. As a family-level fraction that is 25 percent,
          which falls in the OCCASIONAL band (5-29 percent). The denominator is four families, not four
          patients, and no other family had vestibular testing reported at all, so the band is a floor
          rather than an estimate.
      selected_evidence:
        snippet: Compound heterozygous PNPT1 variants were associated with DFNB70 causing prelingual profound
          sensorineural hearing loss (SNHL), vestibular dysfunction, and unilateral progressive vision
          loss in one family.
        supports: SUPPORT
