        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Combined oxidative phosphorylation defect type 13 (COXPD13)
        description: The allelic recessive multisystem disease, OMIM 614932, curated separately as Combined_Oxidative_Phosphorylation_Defect_Type_13.
          Biallelic hypomorphic PNPT1 missense alleles cause an infantile encephalomyopathy with hypotonia,
          a hyperkinetic movement disorder, developmental delay or regression, seizures, sensorineural
          hearing loss and visual impairment, usually with basal ganglia lesions in a Leigh pattern. The
          hearing loss is shared; everything else is not.
        distinguishing_features:
        - Neurological and developmental involvement from infancy, against isolated hearing loss with
          normal development in DFNB70.
        - Bilateral basal ganglia lesions or other abnormal neuroimaging, against no reported imaging
          abnormality in DFNB70.
        - A different set of PNPT1 missense alleles, although both entities are biallelic missense and
          neither allele class is diagnostic on its own.
        - The separation may be a matter of age at assessment rather than of entity - see the discussion
          attached to this entry.
      selected_evidence:
        snippet: PNPT1 is a mitochondrial RNA transport protein that has been linked to two discrete phenotypes,
          namely isolated sensorineural hearing loss (OMIM 614934) and combined oxidative phosphorylation
          deficiency (OMIM 614932).
        supports: SUPPORT
