        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cochlear Hair Cell and Spiral Ganglion Neuron Dysfunction
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'The site of the lesion. PNPase stains strongly in the murine cochlea, in the sensory
          hair cells and the auditory ganglion neurons, and the original report concludes that the mitochondrial
          RNA-import machinery is specifically required for auditory function. The strongest evidence
          that this is causal rather than correlative is a mouse in which PNPase was knocked out in inner
          ear hair cells and which developed progressive hearing loss, an experiment its authors relate
          directly to the human PNPT1 hearing phenotype.

          Two gaps keep this node at PROVISIONAL rather than ESTABLISHED. That mouse carries a complete
          hair-cell knockout, where DFNB70 patients carry a hypomorphic allele expressed in every tissue,
          so it isolates the cochlear contribution without showing that the human disease is hair-cell
          autonomous. And the spiral ganglion arm of this node rests on expression alone: no ganglion-restricted
          deletion has been reported and no patient temporal bone has been examined.'
        cell_types:
        - preferred_term: auditory hair cell
          term:
            id: CL:0000202
            label: auditory hair cell
        - preferred_term: spiral ganglion neuron
          term:
            id: CL:0011113
            label: spiral ganglion neuron
        biological_processes:
        - preferred_term: sensory perception of sound
          modifier: DECREASED
          term:
            id: GO:0007605
            label: sensory perception of sound
      selected_evidence:
        snippet: In summary, we show that a component of the mitochondrial RNA-import machinery is specifically
          required for auditory function.
        supports: SUPPORT
        directness: INDIRECT
