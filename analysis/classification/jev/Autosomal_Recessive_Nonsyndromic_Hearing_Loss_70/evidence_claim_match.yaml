  9aa8cab4fe249c51198fd0e17cc960f924fefec4312baa293cf64e68d47da402:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 70
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 70
            term:
              id: MONDO:0013978
              label: autosomal recessive nonsyndromic hearing loss 70
        context: []
      assertion_type: Genetic
      assertion:
        name: PNPT1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: PNPT1
          term:
            id: hgnc:23166
            label: PNPT1
        features: 'PNPT1 encodes the mitochondrial polynucleotide phosphorylase, PNPase: a homotrimeric
          3''-5'' phosphorolytic exoribonuclease with two RNase-PH domains, an all-alpha-helical domain
          and KH and S1 RNA-binding domains. DFNB70 alleles are missense: homozygous c.1424A>G p.(Glu475Gly)
          in the second RNase-PH domain in two North African families, and compound heterozygous p.(Ala46Gly)
          with p.(Asn540Ser) in a South Indian family.'
        variants:
        - name: PNPT1 c.1424A>G (p.Glu475Gly)
          description: The founding DFNB70 allele, homozygous in a consanguineous Moroccan family and
            again in a consanguineous Tunisian family with five affected siblings. It was absent from
            dbSNP and gnomAD at the time of the Tunisian report and absent from over 400 controls from
            Germany, Morocco and Turkey in the original study. It disturbs PNPase trimerization and impairs
            mitochondrial RNA import, and in later in vitro work it is also strongly impaired at RNA degradation.
          clinical_significance: PATHOGENIC
        - name: PNPT1 p.(Ala46Gly) and p.(Asn540Ser)
          description: The compound heterozygous pair reported in a South Indian assortative mating family
            with DFNB70. No functional assay of either allele has been published.
          clinical_significance: PATHOGENIC
        notes: 'The gene-disease relationship for the hearing phenotype is weakly supported and has been
          graded as such. The ClinGen Hearing Loss Working Group classified PNPT1 for autosomal recessive
          nonsyndromic hearing impairment as Limited, as reported in the Tunisian study; the ClinGen Gene-Disease
          Validity download retrieved on 2026-09-25 contains exactly one PNPT1 row, PNPT1 - Leigh syndrome
          (MONDO:0009723), autosomal recessive, Moderate, Mitochondrial Diseases Gene Curation Expert
          Panel, so no separate hearing-loss assertion is currently published and none is cited here.

          The same gene carries two other inherited phenotypes on different allele classes: biallelic
          hypomorphic missense alleles cause combined oxidative phosphorylation defect type 13 (OMIM 614932,
          curated separately), and heterozygous truncating and splice alleles in the S1 domain cause spinocerebellar
          ataxia type 25. Zygosity and allele class therefore have to be established before a PNPT1 genotype
          is called DFNB70.'
      selected_evidence:
        snippet: Even though the genetic data reported the functional importance of this residue (Glu475)
          suggesting the implication of this missense variation in HI, the PNPT1-ARNSHI relationship was
          classified as limited, when reviewed by the ClinGen Hearing Loss Working Group.
        supports: SUPPORT
