            term:
              id: MONDO:0013978
              label: autosomal recessive nonsyndromic hearing loss 70
        context: []
      assertion_type: Phenotype
      assertion:
        name: Prelingual Severe-to-Profound Sensorineural Hearing Impairment
        category: Ear
        description: The defining and, in three of the four reported families, the only feature. The South
          Indian family's hearing loss is described as prelingual and profound; the adult siblings reported
          separately had severe congenital hearing loss; the Tunisian and Moroccan families are described
          as autosomal recessive nonsyndromic hearing impairment, severe in the Moroccan kindred. Bilaterality
          is stated for the fourth family and implied by the recessive nonsyndromic designation elsewhere.
        frequency: OBLIGATE
        phenotype_term:
          preferred_term: Prelingual profound sensorineural hearing impairment
          term:
            id: HP:0000399
            label: Prelingual sensorineural hearing impairment
        notes: 'OBLIGATE because the entity is ascertained through its hearing loss, so the band carries
          no information about penetrance.

          The binding takes the onset axis rather than the severity axis, because onset is the feature
          reported consistently across families while the severity wording is not - profound in the South
          Indian family, severe in the other reports - and HPO has no combined severe-to-profound term.
          HP:0000399 Prelingual sensorineural hearing impairment carries onset, sensorineural character
          and hearing impairment together; the full severity range is carried in preferred_term and in
          the description. Checked against the live ontology on 2026-09-25: a query of the HPO for "Prelingual
          sensorineural hearing impairment" returns HP:0000399 and nothing more specific, and a query
          for "Bilateral sensorineural hearing impairment" returns HP:0008619, HP:0011474, HP:0000408
          and HP:0008527, none of which combines prelingual onset with profound severity.

          No audiogram configuration, no serial audiometry and no per-individual threshold data are published
          for any DFNB70 family, so no configuration or progression phenotype is curated.'
      selected_evidence:
        snippet: Compound heterozygous PNPT1 variants were associated with DFNB70 causing prelingual profound
          sensorineural hearing loss (SNHL), vestibular dysfunction, and unilateral progressive vision
          loss in one family.
        supports: SUPPORT
