          Indian family reached exome sequencing only after heterozygous CDH23 variants failed to explain
          the phenotype; the Tunisian family was found on a custom hearing-impairment panel in which PNPT1
          was one of the targeted genes. The practical point is that PNPT1 is a mitochondrial-disease
          gene that also sits on hearing-loss panels, and a laboratory filtering a deafness exome by a
          nonsyndromic gene list may not carry it.
