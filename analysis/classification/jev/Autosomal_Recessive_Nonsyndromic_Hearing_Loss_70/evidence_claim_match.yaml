              label: PNPT1
          allele_type: missense
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          notes: HOMOZYGOUS describes the two consanguineous families carrying p.(Glu475Gly); the South
            Indian family is compound heterozygous for a different pair of missense alleles, and the schema
            slot is single-valued. PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION because p.(Glu475Gly)
            was shown to be hypofunctional rather than absent, and because PNPase is essential in human
            cells.
      selected_evidence:
        snippet: By positional cloning, we identified a homozygous PNPT1 missense mutation (c.1424A>G
