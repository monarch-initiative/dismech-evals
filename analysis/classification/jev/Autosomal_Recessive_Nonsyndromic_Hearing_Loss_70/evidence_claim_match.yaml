      assertion:
        name: PNPT1 Biallelic Hypomorphic Missense Variants
        biological_scale: MOLECULAR
        role: initiator
        mechanism_confidence: ESTABLISHED
        description: 'Two PNPT1 missense alleles, inherited from unaffected carrier parents. The founding
          and best-characterised allele is c.1424A>G p.(Glu475Gly), which changes a highly conserved residue
          in the second RNase-PH domain and was found homozygous in the Moroccan family and, independently,
          in a Tunisian family. A South Indian family carries a different pair, p.(Ala46Gly) with p.(Asn540Ser),
          in compound heterozygosity.

          These are hypomorphic rather than null alleles. PNPase is essential in mice and in human cells,
          so a complete absence of the protein is not what DFNB70 patients have; what they have is an
          enzyme that assembles and works badly.'
        genes:
        - preferred_term: PNPT1
          term:
            id: hgnc:23166
            label: PNPT1
        genetic_context:
          genes:
          - preferred_term: PNPT1
