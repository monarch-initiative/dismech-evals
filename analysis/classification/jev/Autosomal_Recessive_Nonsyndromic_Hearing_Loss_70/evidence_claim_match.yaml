        phase: Late multisystem neurodegeneration in at least one family
        notes: Two adult siblings ascertained as isolated severe congenital sensorineural hearing loss
          developed ataxia, dystonia and cognitive decline in their forties, then optic nerve atrophy,
          spasticity and incontinence in their fifties and sixties. Whether this is the natural history
          of DFNB70 or the natural history of one genotype is unknown; it is the single most important
          open question about this entity, and it is what the surveillance recommendation under diagnosis
          rests on.
