              id: MONDO:0013119
              label: autosomal recessive nonsyndromic hearing loss 77
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Hearing Loss Gene Panel or Exome Sequencing
        description: 'DFNB77 is nonsyndromic, so there is no clinical feature that points at LOXHD1 specifically;
          diagnosis is by sequencing. LOXHD1 is on contemporary hearing-loss panels and is a routine contributor
          to yield, so panel testing rather than exome is usually sufficient. Yield in an unselected cohort
          is strongly phenotype-dependent, which is worth knowing before ordering: early onset with a
          recessive family history and higher-grade loss reached 60%, while late onset and lower-grade
          loss yielded significantly fewer diagnoses.'
      selected_evidence:
        snippet: Targeted hearing loss gene panel analysis proved to be an effective tool for ensuring
          an appropriate diagnostic yield in a routine clinical setting including the identification of
          novel variants and medically significant reclassifications.
        supports: SUPPORT
