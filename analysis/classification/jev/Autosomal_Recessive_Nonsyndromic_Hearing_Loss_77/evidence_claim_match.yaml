    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 77
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 77
            term:
              id: MONDO:0013119
              label: autosomal recessive nonsyndromic hearing loss 77
        context: []
      assertion_type: Treatment
      assertion:
        name: Hearing Aid Amplification
        description: 'First-line intervention and, for a disease whose reported severity runs from mild
          to profound, the one most patients receive. In the reported LOXHD1 auditory-neuropathy family
          all three children were fitted early - at 9 months, at 7 weeks, and at 6 months - and the outcomes
          diverged in a way worth recording: the cousin''s aided thresholds were in the mild range at
          three and a half years, while the two sisters showed discomfort with amplification and limited
          aided response and went on to implantation.

          That divergence is the practical content of this entry''s progression section. Amplification
          is the right starting point, and progression means it may stop being sufficient, so aided testing
          has to be repeated rather than treated as a settled result.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: hearing aid amplification
          term:
            id: NCIT:C15315
            label: Rehabilitation
          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: hearing aid
              term:
                id: NCIT:C183182
                label: Hearing Aid
        notes: 'On the action term: this binds NCIT:C15315 Rehabilitation where the closest existing analogue,
          `Otofacial_Neurodevelopmental_Syndrome`, binds NCIT:C49236 Therapeutic Procedure. The divergence
          is deliberate. Fitting and adjusting amplification, with repeated aided testing as the loss
          progresses, is auditory rehabilitation rather than a generic therapeutic procedure, and Rehabilitation
          is the more specific of the two available C25218 descendants. The device itself is carried in
          the qualifier either way.'
      selected_evidence:
        snippet: The cousin proband was fitted with hearing aids at 6 months of age.
        supports: SUPPORT
