  7c81c12901fc820855b8712c06695c26cdcbf99a40825b1da4bf9c7c4684eee4:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 77
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 77
            term:
              id: MONDO:0013119
              label: autosomal recessive nonsyndromic hearing loss 77
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb77_how_loxhd1_gates_transduction
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: The mechanotransduction machinery is present and correctly localised in LOXHD1-mutant
          hair cells but does not conduct. What does LOXHD1 do that the assembled machinery needs?
        attaches_to:
        - pathophysiology#LOXHD1 Loss of Function in Stereocilia
        - pathophysiology#Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
        rationale: 'This is a well-posed gap rather than a general absence of knowledge, because the obvious
          answers have been tested and excluded.

          Established: LOXHD1 is fifteen PLAT repeats distributed along the stereociliary membrane; it
          arrives late in postnatal bundle development; mechanotransduction currents are normal in the
          first postnatal week and severely reduced by day 11, tracking that arrival; the hair bundle
          is morphologically normal; tip-link number is not reduced; Harmonin and LHFPL5 are correctly
          localised.

          Excluded by those measurements: a developmental bundle malformation, a tip-link deficiency,
          and a failure to assemble the tip-link protein complexes.

          Not established: the actual function. The generic positional evidence is weak - PLAT repeats
          bind lipids and proteins *in other proteins*, an inference from domain class rather than a demonstrated
          activity of LOXHD1, and the mechanism paper says so in those words.

          There is, however, one piece of LOXHD1-specific evidence pointing the same way, and it should
          be named rather than glossed as "untested": molecular modelling of the p.V1892F mutant predicts
          a distorted PLAT domain with decreased affinity for the lipid membrane, which would cause hair-cell
          dysfunction. That is a computational prediction on a single variant, not a measurement, so the
          membrane-lipid-organising hypothesis has a specific form and no experimental test - which is
          a different and more tractable state than having no hypothesis at all. A role in delivering
          or retaining a component not assayed in the mechanism study remains a competing candidate with
          nothing behind it either way.

          The clinical reason this matters: if LOXHD1 maintains an activatable state rather than building
          the machinery, the machinery is intact in a patient''s hair cells until they degenerate - which
          would define a window in which a small-molecule or gene-replacement approach has something left
          to act on. If instead LOXHD1 is needed to build something not yet measured, that window is narrower
          or absent.'
        proposed_experiments:
        - experiment_id: exp_dfnb77_loxhd1_interactome_and_lipid_binding
          name: What LOXHD1 binds at the stereociliary membrane
          description: Determine the lipid- and protein-binding partners of the LOXHD1 PLAT repeats at
            the stereociliary membrane - by proximity labelling in hair cells and by direct lipid-binding
            assays on the tenth repeat, the one both mouse alleles disrupt - and test whether the identified
            partners are mislocalised or lost in mutant bundles at postnatal day 11.
          would_support:
          - pathophysiology#Hair-Cell Mechanotransduction Failure with Intact Bundle Architecture
          supporting_outcome:
          - LOXHD1 is shown to organise a specific membrane lipid environment or retain a specific partner
            at the transduction site, and that environment or partner is disrupted in mutants - naming
            the LOXHD1-dependent step and identifying a target.
          refuting_outcome:
          - No consistent binding partner or lipid dependency is found and mutant bundles are indistinguishable
            from wild type on every measured axis, indicating the defect lies somewhere the current assays
            do not reach and that the mechanism curated here stops one step short of the lesion.
      selected_evidence:
        snippet: This work identified a novel LOXHD1-dependent step in hair bundle development that is
          critical for mechanotransduction in mature hair cells as well as for normal hearing function
          in mice and humans.
        supports: SUPPORT
