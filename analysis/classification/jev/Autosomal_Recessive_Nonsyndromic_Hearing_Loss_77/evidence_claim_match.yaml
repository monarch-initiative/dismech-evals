  25abfa55a373d5f458b28403e2a55ca483c67e038b98e032a6ff8cfbf3d5f7d5:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 77
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 77
            term:
              id: MONDO:0013119
              label: autosomal recessive nonsyndromic hearing loss 77
        context: []
      assertion_type: Phenotype
      assertion:
        name: Auditory Neuropathy Spectrum Disorder Presentation
        category: Auditory
        description: 'A presentation that a "sensorineural hearing loss" label would not predict. Three
          related children with LOXHD1 variants had auditory neuropathy spectrum disorder, with a cochlear
          microphonic and/or partial otoacoustic emissions present early in life - meaning some cochlear
          hair-cell function survived while the auditory response was disordered. Two were successfully
          managed with cochlear implants.

          This is consistent with the mechanism rather than in tension with it: LOXHD1 mutant hair cells
          are present and structurally normal but not transducing, which is exactly the substrate for
          a preserved cochlear microphonic with a disordered response.

          Frequency is VERY_RARE rather than OCCASIONAL: the basis is three related children from one
          family, and the 28-patient Japanese cohort reported no such presentation. The report''s own
          authors note that no previous DFNB77 study measured outer-hair-cell function, so ANSD may simply
          not have been looked for elsewhere - which argues for leaving the band low rather than raising
          it on an untested suspicion that it is commoner.'
        frequency: VERY_RARE
        phenotype_term:
          preferred_term: Auditory Neuropathy Pattern
          term:
            id: HP:0006958
            label: Abnormal auditory evoked potentials
      selected_evidence:
        snippet: To our knowledge, this is the first association between LOXHD1 mutations and ANSD in
          two patients who have been successfully managed with cochlear implants.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/2
      evidence_path: /phenotypes/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35875410
      reference_title: Mutations in LOXHD1 gene can cause auditory neuropathy spectrum disorder.
