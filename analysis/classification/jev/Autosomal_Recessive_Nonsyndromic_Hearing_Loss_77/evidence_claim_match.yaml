  aa522e85e912385c0d703ec909678577c19ad465451797b01301579a5474fbde:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 77
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 77
            term:
              id: MONDO:0013119
              label: autosomal recessive nonsyndromic hearing loss 77
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb77_no_genotype_phenotype_correlation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Severity and rate of progression in DFNB77 vary widely within families carrying the same
          variants. If the LOXHD1 genotype does not predict them, what does?
        attaches_to:
        - genetic#LOXHD1
        - phenotypes#Progressive Sensorineural Hearing Impairment
        - progression#Onset
        rationale: 'Two independent groups looked for a genotype-phenotype correlation and neither found
          one.

          Established: the hearing phenotype varies in severity and progression both between and within
          families; fifteen pathogenic variants across nine Dutch families gave no relationship between
          variant type or position and severity or progression; a Japanese cohort of 28 individuals, 18
          of them sharing one recurrent splice variant, likewise showed different progression rates. The
          intrafamilial part is the sharp end - siblings with identical genotypes diverge, so ancestry
          and allele are both controlled and the variation survives.

          Not established: the cause. Both groups reach for the same pair of candidates and neither tests
          them - the Dutch series hypothesises environmental factors or genetic modifiers, and the Japanese
          cohort speculates the same. No modifier locus has been proposed, and no environmental exposure
          has been examined. Noise exposure is the obvious candidate for a disease of progressive hair-cell
          degeneration and, as far as the sources cited here go, nobody has asked.

          This matters for counselling more than for mechanism. A family given a molecular diagnosis wants
          to know how bad it will get, and the honest answer is that the genotype does not say.'
        proposed_experiments:
        - experiment_id: exp_dfnb77_modifier_and_exposure_study
          name: Modifier and noise-exposure study in the Japanese c.4212+1G>A cohort
          description: 'The 18 individuals homozygous or compound heterozygous for the same recurrent
            splice variant are an unusually clean natural experiment: allele held constant, ancestry largely
            held constant, phenotype varying. Genotype them for known hearing-loss modifier loci and collect
            lifetime noise-exposure and ototoxic-drug history, then test both against audiometric slope.'
          would_support:
          - genetic#LOXHD1
          supporting_outcome:
          - Progression rate tracks a modifier locus or a measured exposure, converting an unexplained
            variance into a counselling-relevant and potentially modifiable factor.
          refuting_outcome:
          - Neither modifiers nor exposure explain the variance in a cohort sharing one allele, indicating
            the variability is stochastic at the level of hair-cell survival and that no prognostic statement
            is available at diagnosis.
      selected_evidence:
        snippet: Patients with LOXHD1 variations mostly showed early onset hearing loss and presented
          different progression rates. We speculated that the varying severities and progression rates
          of hearing loss are the result of environmental and/or other genetic factors.
        supports: SUPPORT
