      assertion_type: Pathophysiology
      assertion:
        name: LOXHD1 Loss of Function in Stereocilia
        description: 'Biallelic LOXHD1 variants remove or disable a protein consisting entirely of PLAT
          (polycystin/lipoxygenase/alpha-toxin) repeats - fifteen of them - which in other proteins bind
          lipids and proteins. LOXHD1 is distributed along the length of the stereocilia rather than concentrated
          at the tip-link ends, and it is evolutionarily conserved.

          Its arrival in the hair bundle is late. Both published mouse models carry mutations in the tenth
          PLAT repeat, and the functional consequence appears only as postnatal LOXHD1 expression and
          localisation in the bundle reach their normal level - which is what makes this a maintenance
          protein rather than a developmental one.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: LOXHD1
          term:
            id: hgnc:26521
            label: LOXHD1
