  30b8a5974a336c1f83ae32a04b7ef291b16e37ec224d9baf13710003f33d5f6d:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 77
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 77
            term:
              id: MONDO:0013119
              label: autosomal recessive nonsyndromic hearing loss 77
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vestibular Hair-Cell Sparing
        description: 'Vestibular hair cells are spared, and there is a mechanistic reason rather than
          a coincidence. LOXHD1 is expressed in the hair cells of the vestibule as well as the cochlea,
          so the null expectation is vestibular involvement - but vestibular hair cells express only reduced
          amounts of LOXHD1 and are not affected by the mutation in samba mice. The dose difference is
          what makes the disease non-syndromic.

          The clinical correlate is replicated across every series that looked: normal and symmetrical
          vestibular evoked myogenic potentials in a reported proband, no vestibular involvement in a
          nine-family Dutch series, and no accompanying symptoms including vestibular dysfunction in a
          screen of 8,074 Japanese hearing-loss patients.

          This is modelled as a pathophysiology node rather than as a phenotype because the schema has
          no way to record a phenotype as explicitly absent - `FrequencyEnum` has no EXCLUDED value (HP:0040285)
          and `Phenotype` has no negation slot. An earlier revision of this entry did record it as a phenotype
          bound to `HP:0001751` "Abnormal vestibular function", which is the opposite of the finding and
          would have exported as a claim that DFNB77 causes vestibular dysfunction. That was wrong and
          is the reason the rule "no term beats a bad one" exists. See issue #10190. Following the pattern
          of "Preserved Zona Glomerulosa Mineralocorticoid Production" in `kb/disorders/Familial_Glucocorticoid_Deficiency.yaml`.

          This node is deliberately isolated - nothing points to it and it points nowhere. That is what
          a sparing claim is: the LOXHD1 lesion does not cause the sparing, it fails to reach the tissue,
          so an incoming `downstream` edge would assert a causal relation that runs the wrong way. The
          node exists to record that the vestibular arm was looked at and found intact, which is what
          makes the disease non-syndromic.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: vestibular hair cell
          term:
            id: CL:0000609
            label: vestibular hair cell
      selected_evidence:
        snippet: vestibular hair cells only expressed reduced amounts of LOXHD1 and are not affected by
          the mutation in the samba mice, which corroborate the lack of vestibular and balance issues
          in the developing siblings and presence of normal VEMP in the proband
        supports: SUPPORT
        directness: INDIRECT
