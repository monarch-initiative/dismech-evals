      assertion_type: Diagnosis
      assertion:
        name: TPRN sequencing on recessive nonsyndromic hearing loss panels
        description: DFNB79 is reached by exome sequencing or a deafness panel containing TPRN, after
          GJB2 has been excluded. Because every reported allele lies in exon 1, sequencing that exon alone
          was proposed as a cheap first pass in recessive nonsyndromic hearing loss, particularly where
          there are signs of progression. Vestibular testing does not discriminate - it is normal in DFNB79
          - so a progressive recessive loss with normal balance is the clinical shape that should prompt
          the test, and vestibular involvement argues for a different taper-region gene.
      selected_evidence:
        snippet: Sequencing of this exon may be considered in recessively inherited cases of nonsyndromic
          hearing loss, especially if signs of progression are present
