        relationship: RECAPITULATES
        fidelity: HIGH
        description: The structural lesion, from a normal starting point. Bundles are unremarkable at
          postnatal day 3 and then deteriorate, which is the sequence the human progressive phenotype
          implies but which no patient material shows.
        limitations: The mouse course runs over weeks where the human one runs over years, and this line
          reports inner hair cell stereocilia leading with outer hair cells much less severely affected,
          which is the opposite emphasis to the CRISPR null line. The disagreement is unresolved, so neither
