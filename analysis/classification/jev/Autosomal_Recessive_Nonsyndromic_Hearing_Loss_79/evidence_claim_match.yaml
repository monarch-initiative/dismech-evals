          loss
        measure_type: UNKNOWN
        notes: A targeted screen of 50 consanguineous multiplex families and 57 sporadic cases from Pakistan
          found no further DFNB79-linked family and no case homozygous for markers spanning TPRN. That
          is a negative diagnostic yield in an ascertained cohort, not a population rate, so no prevalence_class
          or rate_per_100000 is recorded; putting a numeric band here would assert an occurrence estimate
          the study does not make. The ascertainment also selected for moderate-to-severe rather than
          progressive loss, which the authors identify as the limitation on what the negative result means.
