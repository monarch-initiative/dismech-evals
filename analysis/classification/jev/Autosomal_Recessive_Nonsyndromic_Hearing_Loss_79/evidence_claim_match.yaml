              label: autosomal recessive nonsyndromic hearing loss 79
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Stereociliary Rootlet Destabilization
        description: 'The rootlet is the dense actin extension that anchors a stereocilium through its
          taper into the cuticular plate. Without taperin it is built but not held. Transmission electron
          microscopy of Tprn-null mice shows rootlets with curved shafts, hollow cores surrounded by loose
          peripheral dense rings, fragmentation and breakage at the insertion point, and rootlets splayed
          within the cuticular plate. Two rootlet proteins, TRIOBP-5 and ANKRD24, are progressively lost
          from the shortest mechanosensory row starting postnatally, and radixin - normally concentrated
          at the taper - disperses along the stereocilia shafts.

          The order matters for reading the disease. These are maintenance failures in structures that
          formed normally, which is why DFNB79 is not a congenital malformation of the bundle.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear inner hair cell
