  d8940842ef05051074a54db400c1bd8b66d66339e36cb3bdf1dd44db3ede4daa:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 79
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 79
            term:
              id: MONDO:0013215
              label: autosomal recessive nonsyndromic hearing loss 79
        context: []
      assertion_type: Genetic
      assertion:
        name: TPRN
        notes: 'TPRN, previously C9orf75, lies at 9q34.3 and encodes taperin, a vertebrate-specific protein
          named for where it sits rather than for what it does. Its N-terminal region cross-links F-actin;
          a C-terminal region carries a nuclear localisation signal, and the protein docks the alpha isoform
          of protein phosphatase 1 through a classic RVxF motif, suppressing the phosphatase''s general
          activity. Steady-state localisation in non-sensory cells is predominantly nuclear, and taperin
          is recruited to sites of DNA damage in complex with Ku70, Ku80, PARP and topoisomerases. None
          of that nuclear biology has been connected to deafness, and it is recorded here because it is
          the reason a taperin-directed therapy cannot be assumed to be inner-ear-specific.

          Taperin shares an ancestral relationship with phostensin, a cytosolic actin-binding PP1 partner,
          which was the basis for the original guess - made when the gene was found and before any activity
          was measured - that it would turn out to have a role in actin dynamics.

          Penetrance has not been formally estimated. Every reported homozygote in every family is affected
          and no unaffected homozygote has been described - but the pedigrees were ascertained through
          deafness, which is the ascertainment that makes complete penetrance look inevitable whether
          or not it is. Heterozygotes are consistently unaffected, in families and in mice.

          Dosage runs in both directions. Overexpressing taperin in wild-type hair cells causes excessive
          actin bundling, extra stereocilia rows, over-elongation and degeneration, and reducing taperin
          expression rescues the stereocilia defects and partially restores hearing in Grxcr2-null mice,
          whose primary lesion is failure to keep taperin restricted to the stereocilia base. Taperin
          is therefore a protein whose level, not merely whose presence, is the phenotype-determining
          variable.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: TPRN
          term:
            id: hgnc:26894
            label: TPRN
      selected_evidence:
        snippet: Although TPRN is expressed in many tissues, immunolocalization of the protein product
          in the mouse cochlea shows prominent expression in the taper region of hair cell stereocilia.
          Consequently, we named the protein taperin.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
