              label: autosomal recessive nonsyndromic hearing loss 79
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inner Hair Cell Synaptic and Vesicular Abnormality
        description: 'A late change at the opposite pole of the cell from the lesion. Tprn-null inner
          hair cells accumulate clustered endosome-like vesicles below the nucleus and at postsynaptic
          sites, and acquire efferent contacts directly on the cell body - axosomatic endings that are
          normally present only transiently in immature inner hair cells and, in adults, only after cochlear
          damage or in mutants with no transduction current.

          Whether this is downstream of the bundle failure or a second job taperin does is not settled.
          The authors set out both possibilities: progressive loss of transduction current is known to
          produce exactly these synaptic changes, and taperin separately carries an NPF motif, three predicted
          YXXphi motifs and a PP1 docking site, all of which point at endocytosis and vesicular trafficking.
          The edge into this node is therefore curated as indirect, and the alternative is recorded as
          a knowledge gap rather than being resolved here.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
      selected_evidence:
        snippet: TEM analyses of P30 Tprn−/− IHCs show numerous membranous vesicles clustered mostly in
          the cytoplasm below nuclei
        supports: SUPPORT
