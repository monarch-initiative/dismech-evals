      assertion_type: Pathophysiology
      assertion:
        name: TPRN Loss of Function
        description: Biallelic truncating TPRN alleles. The reported human spectrum is narrow and unusually
          uniform. The four DFNB79-linked Pakistani families carry one nonsense allele and three frameshifts;
          an 11 bp deletion c.42_52del (p.Gly15AlafsX150) accounts for the Moroccan family and, independently,
          for two Pakistani families; a single-base deletion c.1347delG was found in a Dutch family. Every
          reported allele lies in exon 1. No missense allele has been reported as causal, so nothing in
          the human data distinguishes complete absence of taperin from partial function, and the disease
          is modelled throughout by protein-null alleles.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TPRN
          term:
            id: hgnc:26894
            label: TPRN
      selected_evidence:
        snippet: The remaining variant was a nonsense mutation in a predicted gene, C9orf75, renamed TPRN.
        supports: SUPPORT
