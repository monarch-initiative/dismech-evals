        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counselling with Serial Audiometry
        description: 'Counselling for a recessive condition with a 25 percent sibling recurrence risk,
          and repeated rather than single audiometric assessment. Serial testing is the substantive part:
          the same TPRN allele produces a stable loss in one family and a progressive one in another,
          so a single audiogram establishes the current threshold and nothing about the trajectory. Where
          progression occurs it is faster at high frequencies, which is where the follow-up should be
          looking.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        notes: 'No target_mechanisms link is recorded on this treatment. Counselling and surveillance
          do not act on a pathograph node at all, and no TreatmentEffectEnum value describes them - INHIBITS,
          ACTIVATES, MODULATES, BYPASSES and RESTORES are all claims about changing a mechanism, and measuring
          one is none of those. Asserting the least-wrong value would put a false mechanistic claim in
          a machine-readable slot; the two device treatments below carry the section''s join points into
          the graph instead.

          AAV gene replacement is not curated as a treatment: the work is preclinical and is recorded
          under animal_models, where the dosage constraint can be stated beside it.'
      selected_evidence:
        snippet: Thus the same mutation of TPRN can be associated with different thresholds of hearing
          as well as differences in the stability of the phenotype.
        supports: SUPPORT
