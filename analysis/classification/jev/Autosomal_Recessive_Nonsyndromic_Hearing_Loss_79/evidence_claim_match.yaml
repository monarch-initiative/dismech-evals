  bd0e0d441f473dc76a5b81e1d95b1cc65322cde4e02229cdf07a26b31a81ee23:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 79
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 79
            term:
              id: MONDO:0013215
              label: autosomal recessive nonsyndromic hearing loss 79
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tprn_dosage_window_for_gene_replacement
        kind: HUMAN_MODEL_MISMATCH
        prompt: AAV delivery of Tprn repairs hearing in taperin-null mice, but taperin overexpression
          is itself used as a tool to destroy the stereocilia rings and causes deafness. Is there a dose
          of taperin that is therapeutic in a human cochlea, and how would anyone know they were inside
          it?
        attaches_to:
        - animal_models#Tprn knockout mouse treated with AAV-Tprn
        - pathophysiology#Loss of F-Actin Bundling at the Stereocilia Taper
        - genetic#TPRN
        rationale: 'Most recessive loss-of-function diseases have a one-sided dosage problem: more protein
          is better up to normal, and the engineering question is how to deliver enough. Taperin is not
          like that. In the same study that reports the AAV rescue, exogenous taperin overexpression is
          one of the two deliberate methods used to disrupt the rings, and it produces stereocilia degeneration
          and severe hearing loss. An independent group reports the same in wild-type hair cells: excessive
          F-actin bundling, extra rows, over-elongated and degenerating stereocilia. And from the opposite
          direction, lowering taperin rescues a different mutant - Grxcr2-null mice, whose lesion is failure
          to keep taperin confined to the base - which is only coherent if the pathogenic quantity is
          taperin activity in the wrong place or the wrong amount rather than its absence.

          The rescue was reported as expression "at an appropriate level", which is the honest description
          of an experiment in which the level was achievable and not of one in which the window was measured.
          No dose-response curve bounding it has been published, and AAV transduction of a cochlea is
          not uniform: the same injection gives different copy numbers in different cells along the cochlear
          duct, so a dose that is therapeutic at the apex may be toxic at the base. In a disease where
          too much protein is a known cause of the same lesion, that heterogeneity is not a delivery inconvenience,
          it is the safety question.

          Two further mismatches sit underneath. Human onset is prelingual or by about age 2 in every
          reported family, so a patient''s bundles have already deteriorated before a diagnosis exists,
          while the mouse experiments target a cochlea that is still developing. And taperin is expressed
          in many tissues and is a nuclear PP1-docking protein recruited to sites of DNA damage; a systemically
