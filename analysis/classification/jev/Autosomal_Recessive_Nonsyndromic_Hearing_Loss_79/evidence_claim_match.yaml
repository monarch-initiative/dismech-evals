      - /disease_term
    evidence_metadata:
      reference: PMID:30380417
      reference_title: GRXCR2 Regulates Taperin Localization Critical for Stereocilia Morphology and Hearing.
      evidence_source: MODEL_ORGANISM
      explanation: 'Why GRXCR2 is a named candidate modifier rather than a generic suggestion: it already
        determines where taperin is. Indirect because no human DFNB79 family has been genotyped at GRXCR2.'
