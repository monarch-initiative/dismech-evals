        description: 'Taperin is an actin cross-linker with a specific address. It encircles the F-actin
          core at the stereocilium taper, where the rod narrows and pivots, forming concentric rings together
          with its binding partners CLIC5 and PTPRQ. Purified full-length taperin cross-links F-actin
          into bundles that are bendable rather than stiff, and this activity maps to the N-terminal region
          of the protein. Taperin also binds PTPRQ directly, which is how the actin core is tied to the
          overlying plasma membrane at the taper.

          The claim that this bundling is what matters for hearing rests on the two directions being tested
          separately. Deleting taperin removes the rings; competitively blocking the taperin-CLIC5 interaction
          disrupts them without deleting anything, and produces the same consequence.

          Two measurements that did not come out as the pivot-point model predicts belong in this node
          rather than after it. Pivot stiffness of Tprn-null stereocilia was not detectably changed in
          young postnatal outer hair cells, and those stereocilia were not excessively fragile - they
          withstood repeated intensive deflections. Mechanotransduction currents in Tprn-null outer hair
          cells were also largely unaffected. The authors'' own reading is that the effect in young postnatal
          cells may be too subtle for a fluid-jet measurement to resolve, and that the optimisation matters
          after the onset of hearing and into adulthood; that is a reasonable interpretation, but it means
          the pivot-flexibility claim in this node''s title rests on the bundling biochemistry and the
          structural phenotype, not on a measured stiffness change.

          The taper is a compartment rather than a list of proteins, and the dependencies run in every
          direction between its members. Taperin disperses in CLIC5-null mice; radixin disperses in taperin-null
          mice; taperin''s own dense-core structure is disrupted in RIPOR2-deficient mice, in which it
          is no longer concentrated at the stereociliary base. Three dismech entries now describe the
          same compartment from three genes - this one, DFNB103 (CLIC5) and DFNB104 (RIPOR2) - and they
          should be read as one reciprocal dependency network rather than three separate claims about
          protein localisation.'
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        molecular_functions:
        - preferred_term: actin filament binding
          term:
            id: GO:0051015
            label: actin filament binding
          modifier: DECREASED
        biological_processes:
        - preferred_term: actin crosslink formation
          term:
            id: GO:0051764
            label: actin crosslink formation
          modifier: DECREASED
      selected_evidence:
        snippet: Interestingly, mice harboring this in-frame deletion in Grxcr2 exhibit moderate hearing
          loss at lower frequencies and severe hearing loss at higher frequencies although the morphogenesis
          of stereocilia is minimally affected.
        supports: SUPPORT
        directness: INDIRECT
