          target: Progressive Stereocilia Retraction and Fusion
          direction: INCREASED
          interpretation: Thresholds rise across postnatal days 15, 30 and 60 - hearing gets worse, so
            the threshold value goes up.
      selected_evidence:
        snippet: Heterozygous TPRN+/- mice showed apparently normal auditory phenotypes to their wide-type
          (WT) littermates.
