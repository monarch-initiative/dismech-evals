  aa18bf7a681274a6b6ad6dcb70ed75c75f101bc3a8769138c173d6eb3c43baa6:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 79
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 79
            term:
              id: MONDO:0013215
              label: autosomal recessive nonsyndromic hearing loss 79
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tprn_identical_allele_discordant_progression
        kind: KNOWLEDGE_GAP
        prompt: The same c.42_52del11 null allele produces stable severe hearing loss into the third decade
          in one family and progressive loss in another. What determines whether DFNB79 progresses?
        attaches_to:
        - phenotypes#Progressive Sensorineural Hearing Impairment
        - phenotypes#Prelingual Severe to Profound Hearing Impairment
        - genetic#TPRN
        rationale: 'This is not the ordinary observation that a rare disease is clinically variable. The
          allele is the same 11 bp deletion in exon 1, it is homozygous in both settings, and it is almost
          certainly a complete null - so the usual explanation for variable expressivity in a recessive
          disease, residual protein differing between genotypes, is unavailable here. The authors who
          found the discordance said so plainly and proposed a genetic modifier.

          Nobody has looked for it. In the fifteen years since, DFNB79 has been reported in only a handful
          of families, and no study has assembled enough homozygotes for the same allele to run a modifier
          search. That is a real obstacle rather than an oversight: modifier mapping needs numbers this
          disease does not have in any single population.

          The question is worth keeping open because the answer would be actionable in a way the diagnosis
          currently is not. A family told that their child is homozygous for c.42_52del11 cannot be told
          whether the loss will stay where it is or progress to profound, which is exactly the information
          that determines when to consider implantation and how often to re-test. It also bears on the
          mechanism: something that modifies the rate of a rootlet-maintenance failure is a candidate
          for the same protective role in commoner acquired progressive hearing loss.

          The obvious first candidates are the other taper-region proteins the pathophysiology section
          already names - CLIC5, PTPRQ, TRIOBP, ANKRD24, GRXCR2 - since taperin''s function is defined
          by that complex and GRXCR2 dosage is already known to change what taperin does. Testing them
          requires only sequencing existing DFNB79 families, not new recruitment.'
        proposed_experiments:
        - experiment_id: exp_dfnb79_taper_complex_modifier_screen
          name: Targeted sequencing of taper-complex genes in discordant DFNB79 homozygotes
          description: Sequence CLIC5, PTPRQ, TRIOBP, ANKRD24, GRXCR2, RDX and MYO6 in all available individuals
            homozygous for TPRN c.42_52del11 from the Moroccan and both Pakistani families, together with
            serial audiograms defining each individual as progressive or stable, and test whether any
            variant or haplotype in these genes segregates with the progressive course across families
            rather than within one of them.
          would_support:
          - phenotypes#Progressive Sensorineural Hearing Impairment
          supporting_outcome:
          - A variant in one of the taper-complex genes tracks with progression across families carrying
            the same TPRN null, which would give the counselling answer and would identify the complex
            as the site of the rate-limiting step.
          would_refute:
          - phenotypes#Progressive Sensorineural Hearing Impairment
          refuting_outcome:
          - No taper-complex variant distinguishes progressive from stable individuals, which would move
            the search to genome-wide modifiers or to non-genetic determinants such as noise exposure
            history, and would mean the complex hypothesis had been tested rather than left as a plausible
            guess.
      selected_evidence:
        snippet: We show that taperin and GRXCR2 form a complex and that taperin is diffused throughout
          the stereocilia length in Grxcr2-deficient hair cells.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/2
      context_paths:
