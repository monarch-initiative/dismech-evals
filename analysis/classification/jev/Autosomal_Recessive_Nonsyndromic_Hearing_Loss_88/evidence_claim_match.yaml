        prompt: Why is hearing impairment prelingual in PKDF468, whereas the Elmod3-null mouse has normal
          measured thresholds at one month and elevated thresholds from two months?
        rationale: The human missense allele and mouse constitutive null are different perturbations studied
          in different species. The mouse has early postnatal F-actin and bundle-development abnormalities,
          broadly normal day-14 scanning electron microscopy, and subsequent bundle degeneration. The
          evidence therefore does not establish a purely adult maintenance defect. A p.Leu265Ser knock-in
          and developmental functional measurements could distinguish allele-specific effects from species
          or background effects. No conversion of mouse age to human prenatal timing is established, and
          dominant human p.His171Arg results should not be used as a direct explanation of recessive DFNB88.
      selected_evidence:
        snippet: The affected individuals of this family exhibited pre-lingual, severe-to-profound degrees
          of mixed hearing loss.
        supports: SUPPORT
