        target: Reduced Primary Cilium Formation
        relationship: MEASURES
        fidelity: LOW
        description: CRISPR disruption of Elmod3 in immortalized mouse embryonic fibroblasts reduces the
          fraction of ciliated cells after serum starvation. Normal CEP164 recruitment and CP110 removal
          place the observed defect after early ciliogenesis licensing. This is a candidate ELMOD3 function
          relevant to developing hair-cell kinocilia, not a demonstrated DFNB88 cochlear lesion.
        limitations: Fibroblasts with predicted-null alleles, not hair cells carrying p.Leu265Ser. The
          relation of these findings to human hearing loss is provisional.
      selected_evidence:
        snippet: We found that ciliation was strongly decreased in Elmod1 and Elmod3 single KO MEFs, with
          <10% of cells on average having a cilium after 24 hr of serum starvation, compared with >60%
          in WT controls
        supports: SUPPORT
