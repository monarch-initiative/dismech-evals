          as a group and of V:5 specifically, but the size of the gap is described for only one of the
          two published audiograms, so the numerator that can be defended is 2 of 2 individuals with audiograms
          within a single family. Deliberately unwired from the pathograph - see the open discussion dfnb88_conductive_component_unexplained.
