        category: Ear
        description: An air-bone gap accompanies the sensorineural loss in the affected individuals, and
          in individual V:5 it is described as large in both ears. No middle-ear pathology, tympanometry
          or imaging is reported, and nothing in the ELMOD3 mechanism as currently understood predicts
          a conductive component.
        frequency: FREQUENT
        phenotype_term:
          preferred_term: Conductive hearing impairment
          term:
            id: HP:0000405
            label: Conductive hearing impairment
        notes: 'FREQUENT rather than OBLIGATE: the audiometric statement is made of the affected individuals
          as a group and of V:5 specifically, but the size of the gap is described for only one of the
          two published audiograms, so the numerator that can be defended is 2 of 2 individuals with audiograms
          within a single family. Deliberately unwired from the pathograph - see the open discussion dfnb88_conductive_component_unexplained.
          Wiring it to the cochlear chain would assert a mechanism nobody has proposed, and temporal-bone
          CT in two affected members found a normally aerated middle ear, so there is no structural lesion
          to wire it to either.'
      selected_evidence:
        snippet: The audiograms of individual V:5 revealed bilateral severe-to-profound mixed hearing
          loss, with a large conductive component in both ears.
