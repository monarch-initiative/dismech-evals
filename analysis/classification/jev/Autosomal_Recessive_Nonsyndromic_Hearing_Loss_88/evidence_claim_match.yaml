        status: OPEN
        attaches_to:
        - phenotypes#Conductive Hearing Impairment
        prompt: What produces the conductive component of the DFNB88 audiogram, and is it part of the
          disease at all?
        rationale: Mixed audiograms are reported in PKDF468, including a large bilateral conductive component
          in V:5. CT in V:2 and V:11 showed preserved middle-ear/mastoid aeration, but V:5 was not scanned
          and functional middle-ear testing was not reported. These findings leave the cause of the air-bone
          gap unresolved. Neither cochlear localization nor ABR/DPOAE measurements in mice establish the
          absence of a conductive mechanism. Replication in unrelated families with comprehensive audiological
          assessment is needed before attributing the gap specifically to ELMOD3.
        proposed_experiments:
        - experiment_id: dfnb88_middle_ear_assessment
          name: Middle-ear assessment in a new DFNB88 family
          description: In molecularly established DFNB88, repeat masked air- and bone-conduction audiometry
            with documented output limits, tympanometry, acoustic reflexes and other indicated assessments.
            Compare affected and unaffected relatives and, where possible, unrelated families; interpret
            imaging and functional measurements together.
          would_support:
          - phenotypes#Conductive Hearing Impairment
          supporting_outcome:
          - A reproducible conductive deficit that segregates with biallelic ELMOD3 variants across independent
            families would support a disease association, while requiring exclusion of other causes.
          refuting_outcome:
          - Disappearance of the air-bone gap with technically adequate repeat testing would argue against
            the initial conductive finding. Normal tympanometry or reflexes alone would not prove a measurement
            artefact.
      selected_evidence:
        snippet: The middle ear and mastoid appeared well-aerated bilaterally.
        supports: SUPPORT
