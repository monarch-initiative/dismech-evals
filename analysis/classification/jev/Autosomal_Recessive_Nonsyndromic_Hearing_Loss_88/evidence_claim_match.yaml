  68465bb9618f1170ae3bfe20ef98f789b35719f1a46fd6bdc858b93f9b844b83:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 88
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 88
            term:
              id: MONDO:0014182
              label: autosomal recessive nonsyndromic hearing loss 88
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb88_onset_species_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cochlear Sensory Transduction Failure
        - animal_models#Mouse
        prompt: Why is the Elmod3 knockout mouse a normal-hearing animal for two months and then a progressively
          deaf one, when the affected members of family PKDF468 are deaf before they speak?
        rationale: 'Filed as a mismatch rather than a knowledge gap because both observations were made
          and they disagree.

          The mouse is unambiguous. Auditory brainstem response thresholds are indistinguishable from
          wild type at one month, shift at two months, and worsen through five. Bundle morphology at postnatal
          day 14 is indistinguishable from wild type by scanning electron microscopy. The whole mouse
          account is one of a bundle that is built and then fails.

          The humans do not fit it. The onset is prelingual by family history and the loss is severe-to-profound,
          which is a disease established before speech acquisition rather than one that arrives in adulthood.

          Three explanations are available and none has been tested. The human allele is a missense change
          in the ELMO domain while the mouse is a frameshift null, so the two are not the same lesion
          and a dead-but-present protein could be worse than an absent one if ELMOD3 also localises other
          components. Cochlear maturation timing differs - the mouse cochlea matures postnatally and the
          human cochlea before birth - so a mouse deficit appearing at two months could correspond to
          a human deficit appearing in utero, which would make the two the same lesion on different clocks.
          Or gene dosage genuinely differs between the species, which is what the knockout authors propose,
          pointing out that ELMOD3 heterozygotes are affected in one human family while heterozygous mice
          are not.

          Why it matters for reading this entry: everything between the GAP defect and the audiogram is
          mouse. If the human lesion turns out to be developmental rather than a maintenance failure,
          the bundle findings would survive but their placement in time would not.'
      selected_evidence:
        snippet: Although mutations in ELMOD3 genes have been associated with progressive HL in humans
          and mice, the pattern of inheritance difference between the two species may suggest that ELMOD3
          gene dosage may have a more significant effect in humans compared with mice.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
