      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        description: The defining family is consanguineous, and the affected individuals are homozygous
          for c.794T>C (p.Leu265Ser); linkage under a fully penetrant recessive model with a disease allele
          frequency of 0.001 gave a maximum two-point LOD score of 4.74 at marker D2S2333. Heterozygous
          relatives hear normally. A separate homozygous 2p11.2 deletion removing ELMOD3 together with
          CAPG and SH2D6 has since been reported in a boy with hearing impairment alongside autism and
          intellectual disability, which supports biallelic ELMOD3 loss as a cause of hearing impairment
          but is a contiguous-gene deletion rather than a DFNB88 family.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: haplotype analysis revealed a 0.91 Mb linkage interval that was delimited by the markers
          D2S1387 and D2S2232
        supports: SUPPORT
