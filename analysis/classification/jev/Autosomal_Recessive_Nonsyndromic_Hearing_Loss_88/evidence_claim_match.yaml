  423eb0f5bd269502eaef51673b4db92f91317ca9eab9d4e40d72fdd36a77a38d:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 88
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 88
            term:
              id: MONDO:0014182
              label: autosomal recessive nonsyndromic hearing loss 88
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dfnb88_conductive_component_unexplained
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Conductive Hearing Impairment
        prompt: What produces the conductive component of the DFNB88 audiogram, and is it part of the
          disease at all?
        rationale: 'The audiograms in family PKDF468 are of mixed loss, and in individual V:5 the conductive
          component is described as large in both ears. Nothing in the ELMOD3 mechanism predicts it: the
          protein localises to hair cell stereocilia, kinocilia and cuticular plate, the knockout mouse
          phenotype is entirely cochlear, and neither paper proposes a middle-ear role.

          Imaging has been done and it does not account for the gap. The defining paper performed temporal-bone
          computed tomography on two affected individuals and a normal-hearing sibling: the middle ear
          and mastoid were well aerated bilaterally in both patients, the external auditory canals were
          normal, and the only asymmetry was a slightly narrow right internal auditory canal in one of
          them - which is medial to the conductive mechanism and would not produce an air-bone gap. So
          a gross middle-ear or ossicular malformation is excluded for these two patients.

          What has not been done is the functional middle-ear assessment. No tympanometry, acoustic reflex,
          or wideband immittance result is reported for anyone in the family. That leaves three live possibilities
          that the published data cannot separate: a functional middle-ear abnormality with normal CT
          anatomy, such as effusion or ossicular fixation too subtle to image; an independently segregating
          or acquired middle-ear disease in a large consanguineous family in a setting where chronic otitis
          media is common; or a masking or bone-conduction calibration artefact, which is a known hazard
          when measuring bone thresholds in severe-to-profound loss, where the transducer''s output ceiling
          is reached.

          It matters for two reasons. If the conductive component is real and part of DFNB88, the entity
          is not purely a hair-bundle disease and the pathograph here is incomplete. And if it is not,
          then the MONDO and OMIM descriptions of DFNB88 as nonsyndromic sensorineural deafness are right
          and the audiometric type recorded in this entry overstates the cochlear claim. The phenotype
          is therefore curated and deliberately left unwired.'
        proposed_experiments:
        - experiment_id: dfnb88_middle_ear_assessment
          name: Middle-ear assessment in a new DFNB88 family
          description: Tympanometry, acoustic reflexes and wideband immittance in homozygous ELMOD3 individuals,
            with bone-conduction masking and transducer output limits documented, in any newly ascertained
            family. Temporal-bone CT has already been done in the defining family and was normal, so the
            missing measurement is functional rather than anatomical.
          would_support:
          - phenotypes#Conductive Hearing Impairment
          supporting_outcome:
          - Abnormal tympanometry or acoustic reflexes in homozygotes, absent in heterozygous relatives,
            would establish the conductive component as part of the disease.
          refuting_outcome:
          - Normal tympanometry and normal acoustic reflexes in homozygotes with a persistent air-bone
            gap, alongside the already-normal CT, would point to a masking or bone-conduction calibration
            artefact rather than to middle-ear disease.
      selected_evidence:
        snippet: The middle ear and mastoid appeared well-aerated bilaterally.
        supports: REFUTE
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24039609
      reference_title: An alteration in ELMOD3, an Arl2 GTPase-activating protein, is associated with
        hearing impairment in humans.
      evidence_source: HUMAN_CLINICAL
      explanation: Refutes a gross middle-ear malformation as the source of the air-bone gap in the individual
        with the more complete scan, which is what narrows the open question to the functional and artefactual
        explanations.
