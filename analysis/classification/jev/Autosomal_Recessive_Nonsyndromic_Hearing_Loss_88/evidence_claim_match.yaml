  f357127da6a079335c97d99fe1a5f910ac56a32ce78ece0bd83c37cfb7fffa74:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 88
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 88
            term:
              id: MONDO:0014182
              label: autosomal recessive nonsyndromic hearing loss 88
        context: []
      assertion_type: Genetic
      assertion:
        name: ELMOD3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: ELMOD3
          term:
            id: hgnc:26158
            label: ELMOD3
        notes: 'ELMOD3 (HGNC:26158, "ELMO domain containing 3") is at 2p11.2. The HGNC record lists DFNB88
          among its previous symbols, alongside RBM29 and RBED1, which is worth knowing when reading older
          literature. Human ELMOD3 has seven alternatively spliced isoforms; isoform A encodes 391 residues,
          and exons 7 to 11 encode the 164-residue ELMO/CED12 domain that carries the p.Leu265Ser substitution.

          ELMOD3 also causes autosomal dominant nonsyndromic hearing loss. A five-generation Chinese family
          with late-onset progressive deafness segregates a heterozygous c.512A>G (p.His171Arg) allele,
          which destabilises the protein and mislocalises it. That is a different entity with a different
          MONDO term and is not curated here; it is relevant because it means a heterozygous ELMOD3 variant
          in a patient is not automatically a carrier finding, and because the two inheritance modes are
          one of the things the knockout mouse does not reproduce.'
      selected_evidence:
        snippet: To further confirm that the p.Leu265Ser allele of ELMOD3 is the only mutation that was
          associated with hearing loss at the DFNB88 locus, we sequenced the coding, non-coding, and approximately
          75 bp flanking sequences of the exon-intron boundaries of all the known candidate genes present
          within the linkage region in two affected individuals of family PKDF468.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
