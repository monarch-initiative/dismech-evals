        notes: 'ELMOD3 (HGNC:26158, "ELMO domain containing 3") is at 2p11.2. The HGNC record lists DFNB88
          among its previous symbols, alongside RBM29 and RBED1, which is worth knowing when reading older
          literature. Human ELMOD3 has seven alternatively spliced isoforms; isoform A encodes 391 residues,
          and exons 7 to 11 encode the 164-residue ELMO/CED12 domain that carries the p.Leu265Ser substitution.

          ELMOD3 also causes autosomal dominant nonsyndromic hearing loss. A five-generation Chinese family
          with late-onset progressive deafness segregates a heterozygous c.512A>G (p.His171Arg) allele,
          which destabilises the protein and mislocalises it. That is a different entity with a different
          MONDO term and is not curated here; it is relevant because it means a heterozygous ELMOD3 variant
          in a patient is not automatically a carrier finding, and because the two inheritance modes are
          one of the things the knockout mouse does not reproduce.'
      selected_evidence:
        snippet: novel missense variant, c.512A>G (p.His171Arg) in exon 8 of the ELMO domain-containing
          3 (ELMOD3) gene, was identified as a causative variant in this family affected by late-onset
          and progressive ADNSHL.
        supports: SUPPORT
        directness: INDIRECT
