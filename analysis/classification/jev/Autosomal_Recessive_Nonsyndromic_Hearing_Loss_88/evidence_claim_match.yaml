        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of ARL2 GTPase-Activating Activity
        biological_scale: MOLECULAR
        role: mediator
        mechanism_confidence: ESTABLISHED
        description: ELMOD3 is a GTPase-activating protein for ARL2, an ARF-family GTPase. The p.Leu265Ser
          protein retains no or almost no activity in vitro. In the mouse cochlea ARL2 protein itself
          is less abundant when Elmod3 is absent, from postnatal day 7 onwards, so the consequence in
          tissue is not only a slower GTP-hydrolysis cycle but a smaller ARL2 pool.
        molecular_functions:
        - preferred_term: ARL2 GTPase-activating protein activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005096
            label: GTPase activator activity
        notes: ELMOD3 is described as a comparatively weak ARL2 GAP, and the knockout paper raises that
          as a possible reason its mouse phenotype is moderate. This entry does not adopt that as a mechanism
          - it is an explanation offered for an inter-species discrepancy, not a measured property of
          the human disease.
      selected_evidence:
        snippet: Our in vitro experiment revealed that ELMOD3 harboring the p.Leu265Ser mutation, unlike
          ELMOD3, has no or few GAP activity against Arl2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
