        notes: The recessive p.Leu265Ser allele affects the ELMO domain. A separate heterozygous p.His171Arg
          allele was reported with late-onset progressive dominant hearing loss; interpretation of a heterozygous
          ELMOD3 finding must therefore be variant-specific. The homozygous deletion of ELMOD3 together
