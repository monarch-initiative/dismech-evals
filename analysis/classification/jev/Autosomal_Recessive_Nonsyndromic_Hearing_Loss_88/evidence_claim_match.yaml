          description: Homozygous missense allele segregating with prelingual hearing impairment in PKDF468.
            The numbering uses the transcript in the original report. Functional assays show markedly
            reduced ARL2 GAP activity and impaired subcellular targeting, while weak F-actin co-sedimentation
            is preserved. The fully penetrant recessive linkage model was an analytical assumption, not
            a measured penetrance estimate.
      selected_evidence:
