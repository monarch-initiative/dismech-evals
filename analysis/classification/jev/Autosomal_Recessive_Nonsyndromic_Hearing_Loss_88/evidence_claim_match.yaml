            term:
              id: MONDO:0014182
              label: autosomal recessive nonsyndromic hearing loss 88
        context: []
      assertion_type: Diagnosis
      assertion:
        name: ELMOD3 sequencing in unexplained prelingual recessive hearing loss
        description: DFNB88 was solved by exome sequencing after linkage, at a time when ELMOD3 was on
          no hearing-loss panel; the family had already been excluded against short tandem repeat markers
          for 74 known recessive deafness loci. The practical point for a clinical laboratory is that
          a heterozygous ELMOD3 variant cannot be dismissed as a carrier finding, because the gene also
          has a dominant entity, and that the DFNB88 locus interval overlaps the dominant locus DFNA43
          - so the two are easily conflated in older records even though ELMOD3 lies outside the reported
          DFNA43 interval and was excluded in the original DFNA43 family.
      selected_evidence:
        snippet: We initially observed that deafness in family PKDF468 did not co-segregate with short
          tandem repeat (STR) markers for 74 of the reported recessive nonsyndromic deafness loci
        supports: SUPPORT
    origin:
