      assertion:
        name: Enhanced CaV1.3 Calcium-Channel Inactivation
        role: central_effector
        biological_scale: MOLECULAR
        description: Cabp2-deficient mouse inner hair cells show increased CaV1.3 inactivation despite
          preserved peak calcium-current amplitude and voltage dependence of activation under the tested
          conditions. At room temperature, the single knockout primarily increases voltage-dependent inactivation;
          its increase in calcium-dependent inactivation did not reach significance. Removing both CaBP1
          and CaBP2 markedly enhances both components. Normal peak current does not directly measure channel
          number, and double-knockout effects do not establish the magnitude of a CABP2-only human defect.
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        molecular_functions:
        - preferred_term: available presynaptic CaV1.3 current
          term:
            id: GO:0005245
            label: voltage-gated calcium channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: We propose that CaBP2 inhibits CaV1.3 Ca2+-channel inactivation, and thus sustains the
          availability of CaV1.3 Ca2+ channels for synaptic sound encoding.
        supports: SUPPORT
