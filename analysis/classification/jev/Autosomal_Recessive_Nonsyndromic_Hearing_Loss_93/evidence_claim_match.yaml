          because the partially redundant CaBP1 is removed as well, even mild activation reduces the channel
          pool enough that synapses may be effectively silenced.
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        biological_processes:
        - preferred_term: sustained synaptic vesicle exocytosis at the hair cell ribbon synapse
          term:
            id: GO:0016079
            label: synaptic vesicle exocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: In Cabp1/2 double-knockout mice, we find strongly enhanced CaV1.3 inactivation, slowed
          recovery from inactivation and impaired sustained exocytosis.
        supports: SUPPORT
