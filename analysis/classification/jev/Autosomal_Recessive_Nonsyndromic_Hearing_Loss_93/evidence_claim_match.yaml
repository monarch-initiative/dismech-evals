      assertion_type: Pathophysiology
      assertion:
        name: Enhanced CaV1.3 Calcium-Channel Inactivation
        role: central_effector
        biological_scale: MOLECULAR
        description: In inner hair cells lacking CaBP2 the CaV1.3 current inactivates more than it should.
          The channels are not fewer and they do not open at the wrong voltage - channel number and the
          voltage dependence of activation are normal, and so is the ribbon synapse count. What changes
          is availability over time. A hair cell responding to a continuing sound is held depolarised,
          and under that condition an inactivating channel population steadily withdraws from service.
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        molecular_functions:
        - preferred_term: available presynaptic CaV1.3 current
          term:
            id: GO:0005245
            label: voltage-gated calcium channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: Patch-clamp recordings from Cabp2LacZ/LacZ IHCs revealed enhanced Ca2+-channel inactivation.
        supports: SUPPORT
