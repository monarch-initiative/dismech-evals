            channel regulator in the genotype that matches the human disease, recovering the non-inactivating
            CaV1.3 current and improving hearing.
          limitations: Delivery preceded hearing onset in mice, and efficacy after adult-onset treatment
            was not tested. PHP.eB produced contralateral transduction, so that ear is not an independent
            untreated control. The eGFP marker does not directly quantify CaBP2 protein. Some injected
            wild-type animals had impaired hearing or otoacoustic emissions; the contributions of surgery,
            vector, eGFP and CaBP2 expression were not resolved.
          readouts:
          - name: Restored CaBP2 function, read out as inner hair cell CaV1.3 current inactivation
            target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
            direction: RESTORED
            interpretation: Restoration of the calcium-current inactivation phenotype is a functional
              measure of channel regulation after Cabp2 delivery; it does not directly quantify protein
              expression.
      selected_evidence:
        snippet: In 67% of the AAV2/1-Cabp2-injected animals (16 out of 24 animals), the improvement reached
          20 dB SPL or more at least for one of the tested frequencies
        supports: SUPPORT
