        name: Genetic testing for biallelic CABP2 variants
        description: 'The diagnosis is molecular. CABP2 is small and is on comprehensive hearing-loss
          gene panels and exome pipelines; in every reported case the finding was a homozygous variant,
          most often c.637+1G>T. Ancestry matters to the pretest probability: the allele is a founder
          in Iranian, Turkish and Pakistani families and is enriched in Finland.'
