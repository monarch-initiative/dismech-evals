          allele c.637+1G>T recurs across most of them and is a founder allele in both the Middle Eastern
          and the Northern European families, where a shared haplotype was demonstrated rather than assumed.'
      selected_evidence:
        snippet: In both Finnish families, we identified a homozygous pathogenic splice site variant c.637+1G>T
          in CAPB2 that is known to cause autosomal recessive nonsyndromic hearing impairment.
        supports: SUPPORT
