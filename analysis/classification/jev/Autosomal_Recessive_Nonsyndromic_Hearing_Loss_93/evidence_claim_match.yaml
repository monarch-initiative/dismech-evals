        context: []
      assertion_type: Genetic
      assertion:
        name: CABP2
        gene_term:
          preferred_term: CABP2
          term:
            id: hgnc:1385
            label: CABP2
        relationship_type: CAUSATIVE
        notes: 'The single causal gene. It encodes calcium-binding protein 2, a calmodulin-related EF-hand
          protein of the CaBP family expressed in the cochlea and retina, whose relevant effector here
          is the CaV1.3 channel of the inner hair cell.

          Four variants across eight families were on record at the last published count; the splice-donor
          allele c.637+1G>T recurs across most of them and is a founder allele in both the Middle Eastern
          and the Northern European families, where a shared haplotype was demonstrated rather than assumed.'
      selected_evidence:
        snippet: In both Finnish families, we identified a homozygous pathogenic splice site variant c.637+1G>T
          in CAPB2 that is known to cause autosomal recessive nonsyndromic hearing impairment.
        supports: SUPPORT
