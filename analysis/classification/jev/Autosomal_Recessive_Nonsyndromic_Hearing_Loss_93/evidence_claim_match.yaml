            publication: PMID:28183797
            description: 'The single-gene knockout, matching the human genotype in kind. It is the source
              of the mechanism: the localisation of CaBP2 to inner hair cells, the enhanced channel inactivation,
              the normal channel number and ribbon count, and the reduced afferent firing. Crucially it
              also reproduces the human dissociation - intact cochlear amplification with abnormal brainstem
              responses - which is what licenses reading the mouse mechanism across to the patients.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Enhanced CaV1.3 Calcium-Channel Inactivation
        relationship: RECAPITULATES
        fidelity: HIGH
        description: The defining channel defect, measured directly by patch clamp in the correct cell
          type.
        limitations: A constitutive null, whereas the commonest human allele produces a truncated protein
          with residual, weakened CaV1.3 regulation rather than none. The mouse therefore models the severe
          end of the allelic range. The cochlear apex is also mildly affected relative to more basal positions,
          so a whole-cochlea statement flattens a tonotopic gradient.
        readouts:
        - name: CaV1.3 calcium-current inactivation in inner hair cells
          target: Enhanced CaV1.3 Calcium-Channel Inactivation
          direction: INCREASED
          interpretation: Inactivation of the presynaptic calcium current is increased in the absence
            of CaBP2, which is the primary channel-level defect of this disease.
      selected_evidence:
        snippet: We propose that CaBP2 inhibits CaV1.3 Ca2+-channel inactivation, and thus sustains the
          availability of CaV1.3 Ca2+ channels for synaptic sound encoding.
        supports: SUPPORT
