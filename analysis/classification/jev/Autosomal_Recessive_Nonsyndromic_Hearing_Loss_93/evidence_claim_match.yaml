      assertion:
        name: Audiological testing including otoacoustic emissions
        description: Because the outer hair cells are spared, emissions testing is the discriminating
          study. Emissions present alongside an abnormal auditory brainstem response places the patient
          in the synaptopathy group and changes what to expect from amplification. Recording emissions
          is not optional in a suspected DFNB93 case; it is the finding that distinguishes it.
      selected_evidence:
        snippet: Otoacoustic emissions have been observed in an Italian family with a homozygous CABP2
          variant, indicating preservation of outer hair cell-mediated cochlear amplification.
