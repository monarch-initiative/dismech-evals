          in neonatal Cabp2-null mice, and partially restored synaptic function in Cabp1/Cabp2 double-knockout
          mice. These are preclinical experiments. Early treatment, incomplete rescue, contralateral vector
          spread and adverse auditory findings in some treated wild-type mice limit extrapolation to human
          efficacy, durability and safety.
