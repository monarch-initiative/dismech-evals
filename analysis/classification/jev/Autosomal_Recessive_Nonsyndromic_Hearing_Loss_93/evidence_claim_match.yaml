        fidelity: MODERATE
        limitations: The engineered p.Phe164Ter construct approximates the predicted frameshift truncation
          and is not patient-derived protein. Initial mutant expression exceeded wild type; expression
          levels were adjusted for the comparison. Heterologous voltage-activation and current-density
          effects should not be imported directly into the hair-cell mechanism.
      selected_evidence:
        snippet: Compared with wild-type CaBP2, the truncated CaBP2 showed altered Ca(2+) binding in isothermal
          titration calorimetry and less potent regulation of Ca(v)1.3 Ca(2+) channels.
