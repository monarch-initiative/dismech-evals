            term:
              id: MONDO:0013963
              label: autosomal recessive nonsyndromic hearing loss 93
        context: []
      assertion_type: Treatment
      assertion:
        name: Hearing Aids
        therapeutic_modality: DEVICE
        description: 'Amplification is what patients receive in practice, and the reported outcomes are
          good - the North American case describes a positive prognosis with hearing aids and multidisciplinary
          follow-up.

          It is worth stating the tension rather than smoothing it. As a class, auditory synaptopathy
          patients are described as gaining little from amplification, because the problem is neural encoding
          rather than sensitivity. DFNB93 sits at the mild end of that class - moderate thresholds and
          a partial rather than abolished synaptic function - and the individual reports are of benefit.
          Both statements are cited below; neither is dropped.'
        treatment_term:
          preferred_term: hearing aid usage
      selected_evidence:
        snippet: Patients with auditory synaptopathy and auditory neuropathy typically gain little benefit
          from using hearing aids, as the functional problem is not hearing sensitivity but neural sound
          processing.
        supports: SUPPORT
    origin:
