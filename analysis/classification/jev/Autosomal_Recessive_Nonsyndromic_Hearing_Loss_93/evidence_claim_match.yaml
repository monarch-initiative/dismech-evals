      assertion_type: DifferentialDiagnosis
      assertion:
        name: OTOF-related auditory neuropathy (DFNB9)
        description: The other genetic auditory synaptopathy, and the one DFNB93 is repeatedly compared
          to. Both present with preserved otoacoustic emissions and abnormal brainstem responses, and
          both are presynaptic inner hair cell disorders. OTOF is usually profound and congenital where
          DFNB93 is moderate, and OTOF is the one with an approved gene therapy. Separation is by sequencing,
          not by audiology.
      selected_evidence:
        snippet: As growing evidence from OTOF clinical trials confirms synaptopathies as promising therapeutic
          targets for hearing restoration, CABP2 ranks highly among the candidate genes for virus-mediated
          gene therapy to restore hearing.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
