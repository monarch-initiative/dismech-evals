  7b5b102f6beb71c8b5223a902fb5d8f29c363efbb22c1a8ed985f45a73629c5f:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 93
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 93
            term:
              id: MONDO:0013963
              label: autosomal recessive nonsyndromic hearing loss 93
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Cabp1/Cabp2 double-knockout mouse with AAV CaBP2 rescue
        species: Mouse
        genotype: Cabp1-/-; Cabp2-/- double knockout, with and without AAV-PHP.eB-mediated Cabp2 transgene
          delivery
        publication: PMID:39718549
        description: Combined deletion of Cabp1 and Cabp2 produces much greater calcium-channel inactivation
          and sustained-release impairment than Cabp2 deletion alone. At depolarized holding potentials,
          sustained exocytosis can be abolished. Recovery after prolonged sinusoidal stimulation is delayed,
          whereas recovery after a shorter strong depolarization behaves differently. Ribbon-synapse abundance
          is retained at the examined early age, but BK-channel clusters are smaller. Neonatal Cabp2 delivery
          partially rescues channel function, synaptic release and hearing.
        modeled_mechanisms:
        - target: Reduced Effective Transmission at the Inner Hair Cell Ribbon Synapse
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The sustained component of exocytosis fails, and afferent responses become strongly
            rate-dependent.
          limitations: The model removes two genes and is more severe than the Cabp2-only mouse. Its effect
            sizes cannot be assigned to human DFNB93. Capacitance changes depend strongly on holding potential
            and stimulus waveform; the single knockout does not show the same whole-cell exocytosis deficit
            under the published recording conditions.
          readouts:
          - name: Sustained exocytosis in inner hair cells
            target: Reduced Effective Transmission at the Inner Hair Cell Ribbon Synapse
            direction: DECREASED
            interpretation: Sustained vesicle release is reduced when CaV1.3 inactivation is unopposed.
        - target: Impaired Synaptic Sound Encoding
          relationship: RESCUES
          fidelity: MODERATE
          description: Cabp2 delivery at postnatal day six improves channel regulation, exocytosis and
            auditory responses. This demonstrates rescue after neonatal treatment, not reversal of established
            adult human deafness.
          limitations: Rescue is partial and restores CaBP2 in an animal still lacking CaBP1. Treatment
            precedes mouse hearing onset; a human therapeutic window and long-term durability are not
            established. Contralateral transgene expression occurs, limiting the use of the opposite ear
            as an untreated control.
          readouts:
          - name: Hearing sensitivity and inner hair cell synaptic function after Cabp2 delivery
            target: Impaired Synaptic Sound Encoding
            direction: RESTORED
            interpretation: Both synaptic function and hearing sensitivity improve after gene delivery,
              which is the preclinical basis for treating DFNB93 as a gene replacement target.
      selected_evidence:
        snippet: In these conditions, however, the recovery from inactivation was slowest in the DKO IHCs
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/0
      context_paths:
