      reference_title: Is CABP2-Associated Hearing Loss (DFNB93) a Gene Therapy Target? Preclinical Progress
        and Patient Registry.
      evidence_source: HUMAN_CLINICAL
      explanation: Places the two diseases in the same mechanistic class, which is why OTOF is the differential
