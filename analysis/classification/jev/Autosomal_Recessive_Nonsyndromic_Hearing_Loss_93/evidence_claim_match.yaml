      assertion:
        name: CABP2 Exon 6 Skipping
        role: central_effector
        biological_scale: MOLECULAR
        description: The recurrent c.637+1G>T allele disrupts splicing in a COS-7 exon-trapping assay.
          Skipping exon 6 predicts a frameshift, p.Phe164Serfs*4, and loss of the last two EF hands if
          the RNA escapes degradation. This assay establishes a splice defect, not the abundance or stability
          of the transcript in human inner hair cells.
      selected_evidence:
        snippet: Skipping of exon 6, if RNA is not degraded by nonsense-mediated mRNA decay, is predicted
          to lead to a shifted reading frame, a premature truncation of the protein
        supports: SUPPORT
