  245f4ddf737f921097973bf509619f798147aa3aa5c21a31df3072a68219d63d:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 93
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 93
            term:
              id: MONDO:0013963
              label: autosomal recessive nonsyndromic hearing loss 93
        context:
        - path: /animal_models/1
          value:
            name: Cabp1/Cabp2 double-knockout mouse with AAV CaBP2 rescue
            species: Mouse
            genotype: Cabp1-/-; Cabp2-/- double knockout, with and without AAV-PHP.eB-mediated Cabp2 transgene
              delivery
            publication: PMID:39718549
            description: 'Removing the partially redundant paralogue CaBP1 as well produces a much more
              severe synaptic phenotype than the single knockout, and that severity is the point: it makes
              the exocytosis deficit and the afferent-firing deficit large enough to measure cleanly,
              and it provides a window in which a rescue can be seen. Delivering Cabp2 into the inner
              ear substantially recovers both synaptic function and hearing sensitivity, which is the
              experiment underlying the claim that DFNB93 is a gene-therapy candidate.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Sustained Exocytosis at the Inner Hair Cell Ribbon Synapse
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: The sustained component of exocytosis fails, and afferent responses become strongly
          rate-dependent.
        limitations: Two genes are removed, not one. Human DFNB93 patients are CABP2-biallelic with intact
          CABP1, so this animal is more severely affected than the disease it stands for and its quantitative
          deficits should not be read as DFNB93 magnitudes. It earns its place by isolating the mechanism,
          not by matching the genotype.
        readouts:
        - name: Sustained exocytosis in inner hair cells
          target: Impaired Sustained Exocytosis at the Inner Hair Cell Ribbon Synapse
          direction: DECREASED
          interpretation: Sustained vesicle release is reduced when CaV1.3 inactivation is unopposed.
      selected_evidence:
        snippet: To encode continuous sound stimuli, the inner hair cell (IHC) ribbon synapses utilize
          calcium-binding proteins (CaBPs), which reduce the inactivation of their CaV1.3 calcium channels.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1/modeled_mechanisms/0
