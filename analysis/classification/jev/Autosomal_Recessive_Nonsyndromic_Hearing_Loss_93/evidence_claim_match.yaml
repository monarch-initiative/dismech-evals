  b801fd02b3735ab88beb3c562f2e6ec15aa1090f57786bfc9e78d470c829d73f:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 93
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 93
            term:
              id: MONDO:0013963
              label: autosomal recessive nonsyndromic hearing loss 93
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CABP2 Loss-of-Function Variant
        role: trigger
        biological_scale: MOLECULAR
        description: 'The recurrent allele, and the one that accounts for most reported families, is the
          splice-donor variant c.637+1G>T. It causes skipping of exon 6 and a frameshift, p.Phe164Serfs*4,
          truncating the protein. Nonsense and missense alleles have also been reported.

          The truncated product is not simply absent from the cell: it was made and tested, and it binds
          calcium abnormally and regulates CaV1.3 less effectively than wild type. The functional claim
          of this entry therefore rests on a measured hypomorph, not only on an inferred null.'
        genetic_context:
          gene:
            preferred_term: CABP2
            term:
              id: hgnc:1385
              label: CABP2
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Homozygous in every reported family. The founding families were consanguineous;
            the Danish and Finnish cases were not, and reflect a shared founder haplotype instead.
      selected_evidence:
        snippet: we identified a splice-site mutation (c.637+1G>T) in Ca(2+)-binding protein 2 (CABP2)
          in three consanguineous Iranian families affected by moderate-to-severe hearing loss.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
