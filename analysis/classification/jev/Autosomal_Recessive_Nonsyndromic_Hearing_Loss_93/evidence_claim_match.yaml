        context: []
      assertion_type: Genetic
      assertion:
        name: CABP2
        gene_term:
          preferred_term: CABP2
          term:
            id: hgnc:1385
            label: CABP2
        relationship_type: CAUSATIVE
        notes: Reported CABP2 alleles include splice-site, nonsense, missense and frameshift variants.
          The recurrent splice allele NM_016366.3:c.637+1G>T is enriched in Finland; the 2022 study reports
          allele frequencies of 3.3 × 10−3 in Finnish gnomAD participants and 4.2 × 10−3 in FinnGen. These
          are allele frequencies, not carrier or disease frequencies. A shared haplotype was demonstrated
          in the founding Iranian families, whereas the Danish case had a run of homozygosity suggesting
          shared ancestry. These observations do not establish one shared founder haplotype across all
          populations. CABP1 compensation is supported in mice but is not an established human genetic
          modifier.
        variants:
        - name: NM_016366.3:c.637+1G>T
          gene:
            preferred_term: CABP2
            term:
              id: hgnc:1385
              label: CABP2
          type: splice donor variant
          description: Recurrent splice-donor allele found homozygously in multiple families. Exon skipping
            predicts p.Phe164Serfs*4 if the transcript escapes decay; patient protein abundance is unresolved.
          clinical_significance: PATHOGENIC
        - name: CABP2 c.466G>T (p.Glu156Ter)
          gene:
            preferred_term: CABP2
            term:
              id: hgnc:1385
              label: CABP2
          type: nonsense variant
          description: Homozygous nonsense allele in two Italian siblings. Nonsense-mediated decay was
            predicted, not measured in patient hair cells.
        - name: CABP2 c.311G>A (p.Gly104Asp)
          gene:
            preferred_term: CABP2
            term:
              id: hgnc:1385
              label: CABP2
          type: missense variant
          description: The Iranian severe-hearing-loss report classified this missense allele as pathogenic.
            No allele-specific CaV1.3 assay is reported in the cached abstract.
          clinical_significance: PATHOGENIC
        - name: NM_001318496.1:c.250G>A (p.Glu84Lys)
          gene:
            preferred_term: CABP2
            term:
              id: hgnc:1385
              label: CABP2
          type: missense variant
          description: Reported as pathogenic in Israeli family DF326. The 2025 synthesis lists the family
            as compound heterozygous with a splice-site allele. Numbering of this missense allele differs
            on the shorter transcript, where the protein change is p.Glu78Lys.
          clinical_significance: PATHOGENIC
        - name: NM_016366.3:c.590T>C (p.Ile197Thr)
          gene:
            preferred_term: CABP2
            term:
              id: hgnc:1385
              label: CABP2
          type: missense variant
          description: Reported with hearing loss in several populations. The Egyptian study attributes
            hearing impairment to this allele while describing it as presumably benign under its ACMG
            analysis, creating an unresolved interpretation conflict. Its skeletal and dental findings
            were attributed separately to LTBP3. This report is not sufficient to assign an unqualified
            pathogenic classification or a CABP2 skeletal syndrome.
      selected_evidence:
        snippet: In both Finnish families, we identified a homozygous pathogenic splice site variant c.637+1G>T
          in CAPB2 that is known to cause autosomal recessive nonsyndromic hearing impairment.
        supports: SUPPORT
