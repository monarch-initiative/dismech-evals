          injection at postnatal day 5-7
        publication: PMID:34489639
        description: AAV2/1 or AAV-PHP.eB delivery of the Cabp2 long isoform through the round window
          at postnatal days 5–7 partially improved hearing in Cabp2-null mice assessed at 5–8 weeks. With
          AAV2/1, 16 of 24 animals improved by at least 20 dB SPL at one or more tested frequencies. PHP.eB
          transduced both injected and contralateral cochleae. The experiments establish preclinical feasibility,
          with incomplete rescue and a need to control vector spread and expression.
        modeled_mechanisms:
        - target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
          relationship: RESCUES
          fidelity: MODERATE
