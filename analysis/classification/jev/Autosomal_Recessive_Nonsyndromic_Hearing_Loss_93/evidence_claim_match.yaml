        description: Amplification raises the stimulus reaching an inner hair cell whose transmitter release
          is reduced. It compensates for the consequence and does nothing to the channel defect that produces
          it.
      selected_evidence:
        snippet: Hearing aids and multidisciplinary follow-up have led to a positive prognosis.
