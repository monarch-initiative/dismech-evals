    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 93
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 93
            term:
              id: MONDO:0013963
              label: autosomal recessive nonsyndromic hearing loss 93
        context:
        - path: /animal_models/2
          value:
            name: Cabp2 knockout mouse with AAV-mediated Cabp2 gene replacement
            species: Mouse
            genotype: Cabp2-/- (constitutive knockout) with AAV2/1 or AAV-PHP.eB Cabp2 delivered by round-window
              injection at postnatal day 5-7
            publication: PMID:34489639
            description: 'The gene therapy experiment done in the right genotype. Unlike the double knockout,
              this is the single Cabp2 null - the animal that matches the human disease - and the intervention
              is a cochlear delivery route that could plausibly be used in a patient: a round-window injection
              of AAV carrying the Cabp2 coding sequence, given in the first week of life.

              It is the strongest preclinical result this entity has, and it is why the disease is named
              as a gene therapy candidate rather than merely speculated about. The paper also states the
              property that makes the window wide: hair cells in these mice develop normally and do not
              degenerate early, so there is intact cochlea left to rescue.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
        relationship: RESCUES
        fidelity: MODERATE
        description: Delivering the Cabp2 coding sequence into inner hair cells restores the missing channel
          regulator in the genotype that matches the human disease, recovering the non-inactivating CaV1.3
          current and improving hearing.
        limitations: The rescue is partial rather than complete, and it was given at postnatal day 5 to
          7 - before hearing onset in the mouse, and therefore earlier in auditory development than a
          human infant diagnosed on newborn screening would be treated. Hearing was assessed at 5 to 8
          weeks, so durability beyond that is not addressed. Transduction was unilateral, with the contralateral
          ear as the internal control.
        readouts:
        - name: Restored CaBP2 function, read out as inner hair cell CaV1.3 current inactivation
          target: Loss of CaBP2 Function at the Inner Hair Cell Ribbon Synapse
          direction: RESTORED
          interpretation: CaBP2 function is not measured directly; it is measured by its only known effect,
            the non-inactivating character of the CaV1.3 current, which is restored after delivery. That
            is the molecular defect of this disease being reversed rather than compensated for. The readout
            repeats the link's target because restoring the protein is what the intervention does; the
            channel is the instrument.
      selected_evidence:
        snippet: These preclinical results prove the feasibility of DFNB93 gene therapy.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/2/modeled_mechanisms/0
