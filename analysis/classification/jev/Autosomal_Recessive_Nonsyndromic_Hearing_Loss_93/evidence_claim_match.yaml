      assertion_type: Pathophysiology
      assertion:
        name: Reduced Effective Transmission at the Inner Hair Cell Ribbon Synapse
        role: central_effector
        biological_scale: CELLULAR
        description: Reduced availability of presynaptic CaV1.3 channels is proposed to decrease effective
          transmitter delivery to auditory afferents. Whole-cell capacitance assays did not show reduced
          exocytosis in Cabp2-only knockout hair cells; some sustained responses were increased, possibly
          through extrasynaptic release. In contrast, combined Cabp1/Cabp2 deletion directly reduces sustained
          exocytosis, especially at depolarized holding potentials. The double-knockout result supports
          the mechanism but cannot be assigned unchanged to human DFNB93.
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        biological_processes:
        - preferred_term: sustained synaptic vesicle exocytosis at the hair cell ribbon synapse
          term:
            id: GO:0016079
            label: synaptic vesicle exocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: In Cabp1/2 double-knockout mice, we find strongly enhanced CaV1.3 inactivation, slowed
          recovery from inactivation and impaired sustained exocytosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39718549
      reference_title: CaBP1 and 2 enable sustained Ca(V)1.3 calcium currents and synaptic transmission
        in inner hair cells.
      evidence_source: MODEL_ORGANISM
      explanation: Links the channel defect to the exocytosis defect in the same preparation. Note this
