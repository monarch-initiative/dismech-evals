        category: Otologic
        name: Preserved Otoacoustic Emissions
        frequency: OCCASIONAL
        description: 'Emissions are present because the outer hair cells are not part of the mechanism.
          This is the finding that separates DFNB93 from a cochlear hair-cell deafness at the audiology
          bench, and it is why the entry classifies the disease as a synaptopathy.

          Frequency is OCCASIONAL because it reflects what has been measured, not what is believed. Emissions
          have been reported in one Italian family, and the review that reports them says in the same
          table that emissions testing has rarely been done in DFNB93 at all. The mechanism predicts they
          should usually be present; the evidence base does not yet say so.'
        phenotype_term:
          preferred_term: Preserved otoacoustic emissions
        notes: No phenotype_term binding. HPO codes the negation - HP:6000182 Absent otoacoustic emissions
          - and has no term for emissions being present, so binding this finding to any existing HP term
          would assert the opposite of what the node claims. Left as a free-text preferred_term rather
          than mis-bound; an NTR for a preserved-emissions term would be the right upstream fix.
      selected_evidence:
        snippet: Otoacoustic emissions have been observed in an Italian family with a homozygous CABP2
          variant, indicating preservation of outer hair cell-mediated cochlear amplification.
        supports: SUPPORT
