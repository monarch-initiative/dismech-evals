            term:
              id: MONDO:0014739
              label: autosomal recessive nonsyndromic hearing loss 97
        context: []
      assertion_type: Genetic
      assertion:
        name: MET
        gene_term:
          preferred_term: MET
          term:
            id: hgnc:7029
            label: MET
        relationship_type: CAUSATIVE
        notes: 'Typed CAUSATIVE rather than DISPUTED, matching ClinGen''s Limited classification - the
          panel found no contradicting evidence, only insufficient supporting evidence. The knowledge
          gap recorded in the discussions section carries the uncertainty; the relationship type should
          not double-count it.

          MET encodes the receptor tyrosine kinase for hepatocyte growth factor. Its dominant identity
          in the literature is oncological - somatic amplification, exon 14 skipping and kinase-domain
          activation across lung, gastric and renal cancers, and a germline relationship with hereditary
          papillary renal cell carcinoma that ClinGen separately rates Definitive. None of that is this
          disease. DFNB97 is caused by recessive germline missense alleles producing a developmental deficit
          in one nonsensory cochlear structure, in families without cancer.

          Three missense variants have been reported across three publications. Only one was scored by
          the ClinGen review; of the others, one proband had a phenotype inconsistent with nonsyndromic
          hearing loss and one variant was too common in the population to be pathogenic.'
      selected_evidence:
        snippet: Mutations in the mesenchymal epithelial transition factor (MET) gene are frequently associated
          with multiple human cancers but can also lead to human non-syndromic autosomal recessive deafness
          (DFNB97).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
