      assertion_type: DifferentialDiagnosis
      assertion:
        name: HGF-related nonsyndromic hearing loss (DFNB39)
        description: DFNB39 is associated with HGF variants affecting noncoding sequence or splicing,
          whereas DFNB97 is associated with candidate missense variation in the MET receptor. The two
          genes participate in a shared signaling pathway and can produce overlapping hearing phenotypes.
          Hgf mouse data support pathway-level inference but are not direct evidence for the human MET
          variants. Reported family counts from differently ascertained studies do not establish comparative
          population frequencies.
      selected_evidence:
        snippet: We sequenced the noncoding sequences of genes, as well as noncoding genes, and found
          three mutations clustered in intron 4 and exon 5 in the hepatocyte growth factor gene (HGF).
        supports: SUPPORT
