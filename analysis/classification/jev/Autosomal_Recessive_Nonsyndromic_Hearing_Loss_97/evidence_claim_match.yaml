            term:
              id: MONDO:0014739
              label: autosomal recessive nonsyndromic hearing loss 97
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Endolymphatic Potassium Homeostasis
        role: central_effector
        biological_scale: TISSUE
        description: 'The stria vascularis is a nonsensory structure whose function is to maintain the
          potassium concentration of the scala media and, with it, the endocochlear potential - the standing
          voltage across the endolymph that supplies the driving force for hair cell transduction.

          Two clinical observations in the founding family fit a lesion confined to this structure and
          are recorded here rather than as phenotypes. Vestibular function was spared: the affected individuals
          walked independently at 12 to 13 months and had normal tandem gait and Romberg testing, which
          is what a defect of the stria vascularis of the cochlear duct predicts and a general inner-ear
          defect would not. The testing was clinical rather than VEMP or video head-impulse, so mild dysfunction
          would not have been detected, and the authors hedge to "intact, or at least residual".

          A caveat about provenance. The endocochlear potential itself has been measured in the HGF arm
          of this pathway, not the MET arm: a mouse carrying a noncoding Hgf deletion has neural crest
          cells failing to enter the strial intermediate layer and a significantly reduced endocochlear
          potential. That animal models DFNB39, the paired locus, not DFNB97. It is cited here because
          it measures the step, and the reader should know the measurement comes from the ligand side.'
        locations:
        - preferred_term: stria vascularis of the cochlear duct
          term:
            id: UBERON:0002282
            label: stria vascularis of cochlear duct
        biological_processes:
        - preferred_term: endolymphatic potassium homeostasis maintained by the stria vascularis
          term:
            id: GO:0006813
            label: potassium ion transport
          modifier: DECREASED
      selected_evidence:
        snippet: The stria vascularis is a nonsensory structure that is essential for auditory hair cell
          function by maintaining potassium concentration of the scala media.
        supports: SUPPORT
