            term:
              id: MONDO:0014739
              label: autosomal recessive nonsyndromic hearing loss 97
        context: []
      assertion_type: Genetic
      assertion:
        name: MET
        gene_term:
          preferred_term: MET
          term:
            id: hgnc:7029
            label: MET
        notes: 'The gene-disease association remains Limited. The strongest human evidence is segregation
          of p.Phe841Val with hearing loss in the founding family, but a linked regulatory cause was not
          excluded. The p.Ile316Met case should be distinguished from that pedigree: the 2019 paper called
          the allele pathogenic, whereas ClinVar RCV002490458.8 records a likely benign germline classification
          from a single submitter, evaluated May 31, 2022, for multiple conditions including DFNB97. The
          p.Phe841Val DFNB97 record RCV000202585.7 records pathogenic from a literature-only OMIM submission
          without assertion criteria, evaluated May 4, 2015; this variant assertion is not an expert-panel
          upgrade of gene-disease validity. The exon-trap experiment was inconclusive and did not measure
          receptor activation. Neither general MET oncogenic mechanisms nor another MET-related phenotype
          establishes the effect of these hearing-loss candidates. A separate p.Phe1186Cys report involved
          deafness with arthrogryposis in two siblings, as summarized by Naz and Friedman; those syndromic
          findings are not added to the DFNB97 phenotype spectrum. The older review considered this supportive
          of an auditory role for MET, whereas the later ClinGen assessment excluded phenotype-inconsistent
          evidence when scoring nonsyndromic hearing loss.'
        association: Candidate recessive hearing loss association; ClinGen Limited
      selected_evidence:
        snippet: 'One missense variant in this gene segregated with disease in 8 additional family members
          (PMID: 25941349).'
        supports: SUPPORT
