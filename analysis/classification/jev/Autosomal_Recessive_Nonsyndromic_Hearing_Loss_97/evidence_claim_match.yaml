              label: autosomal recessive nonsyndromic hearing loss 97
        context: []
      assertion_type: ExternalAssertion
      assertion:
        name: ClinGen MET-nonsyndromic hearing loss gene-disease validity assertion
        source: ClinGen
        assertion_type: gene_disease_validity
        external_id: CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
        url: https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_f0e6f9ac-f807-48fd-a5b6-bf67c4607e14-2021-03-26T160000.000Z
        description: The ClinGen Hearing Loss Gene Curation Expert Panel classified the autosomal recessive
          MET–nonsyndromic hearing loss relationship as Limited on March 26, 2021. Only one of three reported
          missense variants was scored; the others had an inconsistent phenotype or an allele frequency
          incompatible with pathogenicity. Expression, biochemical and mouse evidence support biological
          plausibility, but the panel considered the evidence insufficient to establish causality.
        notes: 'The panel''s evidence summary explains why only one of the three reported variants scored:
          "Only one missense variant was scored as the probands with the other variant had inconsistent
          phenotypes with nonsyndromic hearing loss and the minor allele frequency of the other variant
          was too high to be considered pathogenic." That is the specific reason the classification did
