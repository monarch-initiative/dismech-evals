        name: Biallelic MET Missense Variant
        role: trigger
        biological_scale: MOLECULAR
        description: 'Both published alleles are homozygous missense variants and both are private to
          their family.

          The Pakistani allele c.2521T>G, p.Phe841Val, was found after homozygosity mapping placed the
          locus on 7q31.2 with a LOD of 4.8. It cosegregated with hearing loss in the family and was absent
          from 800 ethnically matched control chromosomes and from 136,602 chromosomes in public variant
          databases.

          The Moroccan allele c.948A>G, p.Ile316Met, lies in the SEMA domain - the ligand-binding region
          of the receptor - and molecular dynamics simulation predicted that it costs the domain flexibility.

          Neither allele has been characterised functionally at the bench. That absence is what the ClinGen
          review means by case-level evidence only, and it is why the receptor-signalling node below is
          inferred rather than measured in a patient allele.'
        genetic_context:
          gene:
            preferred_term: MET
            term:
              id: hgnc:7029
              label: MET
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: 'Homozygous in both consanguineous families. functional_impact_category is deliberately
            omitted: the alleles are missense, no functional assay has been performed on either, and the
            only mechanistic prediction available is an in silico structural one. Asserting LOSS_OF_FUNCTION
            here would be inferring the very thing the evidence base does not supply.'
      selected_evidence:
        snippet: The results of the MDS approach show that an Ile316Met mutation in the SEMA domain leads
          to protein flexibility loss.
        supports: SUPPORT
