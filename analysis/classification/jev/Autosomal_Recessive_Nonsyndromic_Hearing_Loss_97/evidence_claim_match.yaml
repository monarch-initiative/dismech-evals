        description: 'The ClinGen Hearing Loss Gene Curation Expert Panel classifies the autosomal recessive
          MET-nonsyndromic hearing loss relationship as Limited. This sits above Disputed and below Definitive:
          the panel found no contradicting evidence, but the supporting evidence is case-level, and of
          the three reported missense variants only one scored - the other probands had phenotypes inconsistent
          with nonsyndromic hearing loss or an allele frequency too high to be pathogenic. The mouse work
          is what the panel credits as experimental support.'
        notes: 'The panel''s evidence summary explains why only one of the three reported variants scored:
          "Only one missense variant was scored as the probands with the other variant had inconsistent
          phenotypes with nonsyndromic hearing loss and the minor allele frequency of the other variant
          was too high to be considered pathogenic." That is the specific reason the classification did
          not rise above Limited.'
      selected_evidence:
        snippet: MET | HGNC:7029 | nonsyndromic genetic hearing loss | MONDO:0019497 | AR | Limited
        supports: SUPPORT
