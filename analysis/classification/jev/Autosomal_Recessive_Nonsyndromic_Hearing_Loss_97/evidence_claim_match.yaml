              melanocytes entering the strial intermediate layer.
            limitations: This is a conditional inactivation, not a knock-in of either human missense allele.
              Whether p.Phe841Val or p.Ile316Met reduces signalling enough to reproduce the developmental
              failure is exactly what has not been tested, and it is the reason ClinGen rates the human
              relationship Limited. Human cochlear histology in DFNB97 does not exist and will not, so
              the strial defect in patients is inferred from the mouse rather than observed.
