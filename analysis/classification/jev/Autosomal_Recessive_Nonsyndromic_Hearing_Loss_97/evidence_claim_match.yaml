            relationship: RECAPITULATES
            fidelity: MODERATE
            description: Developmental inactivation of the receptor produces profound hearing loss in
              young adult mice, matching the severity and the developmental timing of the human phenotype.
            limitations: The mouse loss is described as profound and the human families are severe, and
              the mouse is a conditional null where the patients carry missense alleles - so the model
              probably sits at a more severe point on the allelic range than the disease does. Onset is
              "young adult" in mouse against prelingual in humans, which are not directly comparable developmental
              stages.
