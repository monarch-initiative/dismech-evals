      assertion_type: Diagnosis
      assertion:
        name: Exome or comprehensive panel sequencing after excluding common causes
        description: DFNB97 has no distinguishing clinical feature; severe prelingual nonsyndromic hearing
          loss looks the same whatever causes it. Both published families reached the diagnosis the same
          way - by excluding GJB2 and the other established recessive deafness genes first, then sequencing.
          Given a Limited gene-disease classification and two families worldwide, a MET finding should
          be treated as a candidate that requires the common causes to have been ruled out, not as a first-line
          result.
      selected_evidence:
        snippet: Mutations of GJB2 and all other genes reported to underlie recessive deafness were ruled
          out as the cause of the phenotype in the affected members of the participating family.
        supports: SUPPORT
