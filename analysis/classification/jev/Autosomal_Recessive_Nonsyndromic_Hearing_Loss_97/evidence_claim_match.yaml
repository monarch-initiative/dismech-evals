              label: autosomal recessive nonsyndromic hearing loss 97
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic MET Missense Variant
        role: trigger
        biological_scale: MOLECULAR
        description: 'Homozygous NM_000245.2:c.2521T>G (p.Phe841Val) segregated with severe early hearing
          loss in nine members of Pakistani family HLGM17 after linkage to 7q31.2. The variant lies in
          the extracellular IPT4 domain and was absent from the study controls and public databases examined
          in 2015. A linked regulatory variant remains an alternative explanation. Structural predictions
          suggest reduced protein stability, but receptor binding and signaling were not measured. An
          exon-trap assay was performed: 63 of 65 mutant-derived clones matched wild type, and the two
          aberrant products could reflect a small splice effect or artifacts. The separately reported
          p.Ile316Met variant is not treated as a confirmed pathogenic trigger.'
        genetic_context:
          gene:
            preferred_term: MET
            term:
              id: hgnc:7029
              label: MET
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: Homozygous p.Phe841Val in the founding family. The variant has segregation evidence,
            mixed computational predictions and an inconclusive exon-trap result; a loss-of-function category
            is not assigned without a demonstrated receptor defect.
      selected_evidence:
        snippet: The variant co-segregated with the phenotype, being homozygous in all 9 affected individuals,
          and was absent from DNA of 400 ethnically matched individuals (800 chromosomes).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
