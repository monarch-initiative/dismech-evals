            term:
              id: MONDO:0014739
              label: autosomal recessive nonsyndromic hearing loss 97
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: HGF-related nonsyndromic hearing loss (DFNB39)
        description: 'The paired locus, and a genuinely different disease. DFNB39 is caused by noncoding
          variants in HGF - two deletions in a conserved part of the 3'' untranslated region of a short
          HGF isoform, and a silent substitution that alters splicing - rather than by coding variants
          in the receptor. It is common in Pakistani families where DFNB97 is not: 40 consanguineous families
          mapped to the locus, against the single family that defines DFNB97 after 100 more were screened.

          The two converge downstream. Both disable HGF/MET signalling at the developing stria vascularis,
          and the mouse modelling the DFNB39 noncoding deletion is the animal in which the endocochlear
          potential reduction was actually measured. They are curated as separate entities because the
          gene, the variant class and the population frequency all differ, and evidence from the HGF side
          is graded PARTIAL wherever it appears in this entry.'
      selected_evidence:
        snippet: We sequenced the noncoding sequences of genes, as well as noncoding genes, and found
          three mutations clustered in intron 4 and exon 5 in the hepatocyte growth factor gene (HGF).
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
