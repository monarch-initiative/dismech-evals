        context: []
      assertion_type: Variant
      assertion:
        name: MET NM_000245.2:c.2521T>G (p.Phe841Val)
        gene:
          preferred_term: MET
          term:
            id: hgnc:7029
            label: MET
        type: missense variant
        description: IPT4-domain candidate segregating in family HLGM17. SIFT predicted tolerated whereas
          several other programs predicted damaging. Exon trapping was largely normal and inconclusive.
          ClinVar reports pathogenic for DFNB97 through a literature-only submission, but human causality
          remains limited and a linked regulatory variant was not excluded.
      selected_evidence:
        snippet: However, since we only analyzed exonic regions, it is possible that a mutation in a regulatory
          region of MET or in a cis-acting element of any of the other 16 genes in the critical DFNB97
          interval may be responsible for the hearing loss in family HLGM17 and the p.F841V variant is
          in linkage disequilibrium with the pathogenic allele.
        supports: SUPPORT
