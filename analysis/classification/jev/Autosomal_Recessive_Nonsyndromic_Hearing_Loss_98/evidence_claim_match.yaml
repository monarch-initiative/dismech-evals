        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: TSPEAR-related autosomal recessive ectodermal dysplasia 14 (ARED14/ECTD14)
        description: 'The established TSPEAR disease, and the entity a biallelic TSPEAR result most likely
          belongs to. It is primarily dental - conical tooth cusps and hypodontia - and it is supported
          by replicated cohorts, founder-variant epidemiology, and functional work placing Tspear expression
          in the enamel knot with a zebrafish double knockout that reproduces the dental phenotype.

          It is also common. The non-Finnish European carrier rate for TSPEAR loss-of-function alleles
          is about 1 in 140, which makes ARED14 one of the commonest autosomal recessive ectodermal dysplasias.
          That number belongs to this entity and not to DFNB98; it is quoted here so it is not mistaken
          for a DFNB98 prevalence.

          This is a differential rather than a subtype relationship. ECTD14 has its own OMIM entry and
          its own MONDO term, and dismech does not currently curate it.'
      selected_evidence:
        snippet: Combining data from new and previously published individuals established that ARED14
          is primarily characterized by dental anomalies such as conical tooth cusps and hypodontia, like
          those seen in individuals with WNT10A-related odontoonychodermal dysplasia.
        supports: SUPPORT
