        context:
        - path: /animal_models/0
          value:
            name: Tspear S475TfsX79 CRISPR mouse
            species: Mouse
            genotype: Tspear S475TfsX79 frameshift, generated by CRISPR/Cas9 genome editing
            publication: PMID:40716589
            description: 'The only mouse model of a TSPEAR frameshift, and the experiment that was needed.
              It is negative on every axis TSPEAR has been claimed to matter for: stereociliary morphology,
              auditory function, tooth morphology and hair development are all normal.

              It is not entirely a null result. The mutation does perturb Notch and Wnt signalling - Notch1
              and downstream targets are down, Heyl is up in skin, and Wnt4 is elevated in both skin and
              inner ear - so TSPEAR is doing something molecularly in the ear without that something producing
              a hearing phenotype in this animal.'
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: Loss of TSPEAR from the Hair Bundle Surface
            relationship: FAILS_TO_RECAPITULATE
            fidelity: MODERATE
            description: A mouse carrying a TSPEAR frameshift has normal stereocilia and normal hearing.
              The proposed hair-bundle mechanism of DFNB98 predicts neither.
            limitations: 'The mouse allele S475TfsX79 is not the human founding allele p.V576LfsX37; both
              are frameshifts but they truncate at different points, so a residual-function argument for
              the mouse allele has not been formally excluded. The founding human variant has never been
              knocked in. Mouse and human cochleae also differ, and a family of six EAR-domain proteins
              offers scope for compensation that has not been tested. Fidelity is therefore MODERATE rather
              than HIGH: the negative result is real and directly relevant, and it is not the same allele
              in the same species as the patients.'
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Stereociliary morphology
        target: Loss of TSPEAR from the Hair Bundle Surface
        direction: UNCHANGED
        interpretation: Hair bundle structure is normal in the absence of functional TSPEAR, which is
          the opposite of what a surface-of-the-bundle structural role predicts. A deliberate negative
          result, not a missing measurement.
      selected_evidence:
        snippet: Intriguingly, stereociliary morphology and auditory function remain unaffected in TSPEAR
