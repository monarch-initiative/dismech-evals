        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No prevalence estimate exists and none can be constructed, because the numerator is exactly
          the set of cases whose causal attribution is in dispute. Five unique variants in four probands
          across four publications were counted by the ClinGen review, of which the isolated-deafness
          cases are a subset.

          Carrier rates for TSPEAR loss-of-function alleles have been published - roughly 1 in 140 in
          non-Finnish Europeans - but those are ectodermal dysplasia 14 carrier rates and must not be
          read across to DFNB98. They are recorded in the differential diagnosis section where they belong.'
      selected_evidence:
        snippet: At least 5 unique variants (3 frameshift, 1 nonsense, 1 silent variant in splice consensus
          sequence) have been reported in at least 4 probands in 4 publications
        supports: SUPPORT
