            term:
              id: MONDO:0013929
              label: autosomal recessive nonsyndromic hearing loss 98
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Genetic testing, interpreted against the disputed gene-disease relationship
        description: 'There is no clinical or audiological finding that identifies DFNB98; the label follows
          from a genotype. The consequence of the Disputed classification is that finding biallelic TSPEAR
          variants in a deaf patient is the beginning of the analysis rather than the end of it.

          Two things follow concretely. Established hearing-loss genes must be excluded before the TSPEAR
          finding is accepted, because the cohort that tested this found competing variants in TMPRSS3,
          GJB2 and GJB6 in every deaf biallelic-TSPEAR individual. And the patient should be examined
          for dental and ectodermal features, because the established TSPEAR disease is a dental one and
          its recognition changes the counselling.'
      selected_evidence:
        snippet: Of the individuals displaying hearing loss, all have additional variants in other hearing-loss-associated
          genes, specifically TMPRSS3, GJB2, and GJB6, that present competing candidates for their hearing
          loss phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
