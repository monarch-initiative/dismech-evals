        name: Examination for dental and ectodermal features
        description: 'Absence of ectodermal findings is what makes a case a DFNB98 case rather than an
          ectodermal dysplasia 14 case with deafness alongside, so it has to be looked for deliberately
          rather than assumed from a referral for hearing loss. In the 2026 report the teeth, skin, hair
          and nails were each examined and found normal, and the authors note that a purely auditory presentation
          is uncommon among published TSPEAR cases.

          The schema has no way to record an examined-and-absent phenotype, so this is curated here as
          the examination it is rather than as an absent phenotype in the phenotype list.'
