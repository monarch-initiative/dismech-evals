            term:
              id: MONDO:0013929
              label: autosomal recessive nonsyndromic hearing loss 98
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tspear_hair_bundle_deafness
        hypothesis_label: Loss of secreted TSPEAR from the hair bundle surface causes isolated sensorineural
          deafness
        status: ALTERNATIVE
        description: 'The proposed mechanism of DFNB98, and the reason it is a hypothesis group rather
          than the entry''s canonical model. TSPEAR is a secreted protein built from a thrombospondin-type
          laminin G domain followed by seven epilepsy-associated repeats that fold into a beta-propeller.
          In the founding study the transcript was found in mouse cochlea and the protein was localised
          by immunofluorescence to the surface of the hair bundles of sensory cells, while the human truncating
          allele blocked secretion of the protein from transfected cells. From those two observations
          the argument runs: no secretion, no TSPEAR at the bundle surface, no functioning bundle, deafness.

          Every causal edge in the pathophysiology section below opts into this group, because every one
          of them is part of that argument rather than an independently established step. Nothing has
          connected the missing protein to a measured auditory deficit in any organism. The one animal
          that has been made and tested - a mouse carrying a TSPEAR frameshift - hears normally and has
          normal stereocilia.'
      selected_evidence:
        snippet: Only the larger Tspear transcript was found in the cochlea, and the protein was detected
          by immunofluorescence at the surface of the hair bundles of sensory cells.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
