  8d9cfabc7b5f88a621d7a01f866e4d6ba4bc94597db123fa6904286cc8337250:
    claim:
      about:
        disease:
          name: Autosomal Recessive Nonsyndromic Hearing Loss 98
          disease_term:
            preferred_term: autosomal recessive nonsyndromic hearing loss 98
            term:
              id: MONDO:0013929
              label: autosomal recessive nonsyndromic hearing loss 98
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic TSPEAR Loss-of-Function Variant
        role: trigger
        biological_scale: MOLECULAR
        description: 'The founding allele is a homozygous frameshift, c.1726G>T+c.1728delC, predicting
          p.V576LfsX37, found in three affected siblings of a consanguineous Iranian family with congenital
          profound deafness. TSPEAR is alternatively spliced into 522- and 669-residue isoforms and the
          frameshift affects both.

          Later isolated-deafness reports carry different alleles: a homozygous missense c.668C>T p.Ser223Leu
          in a 2026 Iranian case, and compound heterozygous variants in a 2024 Chinese family. Nothing
          links the allele class to whether hearing loss appears, which is part of why the relationship
          remains contested.'
        genetic_context:
          gene:
            preferred_term: TSPEAR
            term:
              id: hgnc:1268
              label: TSPEAR
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Homozygous in the founding family and in the isolated-deafness case reports, all
            of which are consanguineous. Typed LOSS_OF_FUNCTION for the frameshift alleles on the strength
            of the measured secretion failure; the missense alleles are not functionally characterised.
      selected_evidence:
        snippet: Whole exome sequencing allowed us to identify a homozygous frame-shifting mutation (c.1726G>T+c.1728delC)
          in the gene TSPEAR (thrombospondin-type laminin G domain and EAR repeats).
        supports: SUPPORT
