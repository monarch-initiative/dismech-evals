          2024 Chinese proband with compound heterozygous TSPEAR variants and congenital sensorineural
          hearing loss also had dental caries, ankyloglossia and a heart-shaped tongue.

          This is recorded rather than filtered out, because it is precisely the observation that keeps
          the two TSPEAR entities entangled: a case with both hearing loss and oral findings can be read
          as DFNB98 with incidental dental disease or as ectodermal dysplasia 14 with hearing loss, and
          the published report does not settle which.'
