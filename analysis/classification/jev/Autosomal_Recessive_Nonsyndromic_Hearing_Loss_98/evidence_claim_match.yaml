        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: tspear_hair_bundle_deafness
        hypothesis_label: Loss of secreted TSPEAR from the hair bundle surface causes isolated sensorineural
          deafness
        status: ALTERNATIVE
        description: The proposed auditory mechanism links defective secretion of the founding truncating
          allele to reduced TSPEAR availability at the hair-bundle surface and impaired cochlear function.
          Secretion impairment was measured in transfected cells, whereas localization was examined in
          mouse sensory cells. These separate observations do not demonstrate loss of bundle-localized
          protein or a causal auditory defect in the human variant carriers. Preserved hearing and stereociliary
          morphology in S475TfsX79 mice challenge a general frameshift mechanism, with allele and species
          limitations.
      selected_evidence:
        snippet: Only the larger Tspear transcript was found in the cochlea, and the protein was detected
          by immunofluorescence at the surface of the hair bundles of sensory cells.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
