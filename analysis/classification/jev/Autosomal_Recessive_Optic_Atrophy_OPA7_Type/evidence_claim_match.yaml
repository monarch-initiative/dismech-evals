      assertion_type: Pathophysiology
      assertion:
        name: iAAA-Dependent OXA1L Turnover
        description: OXA1L undergoes partial proteolytic cleavage after TMEM126A loss. Depletion of YME1L,
          PARL or SLP2 suppresses this cleavage, whereas AFG3L2 depletion does not. The observed turnover
          is interpreted as mitochondrial inner-membrane quality control acting on insertion complexes;
          it is not evidence of complete OXA1L depletion in every knockout condition.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Loss of the iAAA protease complex constituents PARL, SLP2, and YME1L, but not the loss
          of AFG3L2, blocked the observed OXA1L cleavage
        supports: SUPPORT
