      assertion_type: Discussion
      assertion:
        discussion_id: opa7_nd4_and_oxa1l_models
        kind: OPEN_QUESTION
        prompt: How do ND4-associated early assembly and OXA1L-dependent quality control contribute to
          the same disease?
        attaches_to:
        - pathophysiology#Impaired Complex I Assembly
        - pathophysiology#Loss of Nascent Mitochondrial Polypeptides
        rationale: The 2021 study found selective slower ND4 labeling without increased turnover of the
          labeled pool. The 2024 study found broader YME1L-dependent loss of nascent products and secondary
          TMEM126B depletion. Differences in cell background, perturbation and assay timing may contribute,
          but have not been resolved by a direct comparison. The 2024 untagged rescue specifically qualifies
          the earlier negative result obtained with tagged TMEM126B.
      selected_evidence:
        snippet: The expression of the untagged TMEM126B in TMEM126A−/− cells fully rescued the complex
          I defect as assessed by activity measurement and BN-PAGE
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38199007
      reference_title: Identification of TMEM126A as OXA1L-interacting protein reveals cotranslational
        quality control in mitochondria.
      evidence_source: IN_VITRO
      explanation: Untagged TMEM126B restores the complex I phenotype in this model; tagged TMEM126B failed,
        and neither form restored nascent mitochondrial translation products.
