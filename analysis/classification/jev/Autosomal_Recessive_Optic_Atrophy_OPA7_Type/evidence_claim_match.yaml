      assertion:
        name: Loss of Nascent Mitochondrial Polypeptides
        description: Newly synthesized mitochondrial proteins are depleted after TMEM126A knockdown or
          knockout in the 2024 HEK293 study. YME1L codepletion restores labeled products, while mtDNA,
          mitochondrial RNA and tested ribosomal protein levels are preserved. Untagged TMEM126B rescues
          complex I but not this nascent-protein defect, distinguishing the two biochemical outcomes.
          The contribution of this broader proteostasis defect to human optic neuropathy remains unresolved.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: translation products were fully recovered to WT levels upon additional depletion of YME1L
        supports: SUPPORT
