    claim:
      about:
        disease:
          name: Autosomal Recessive Optic Atrophy OPA7 Type
          disease_term:
            preferred_term: autosomal recessive optic atrophy, OPA7 type
            term:
              id: MONDO:0013069
              label: autosomal recessive optic atrophy, OPA7 type
        context: []
      assertion_type: Genetic
      assertion:
        name: TMEM126A
        gene_term:
          preferred_term: TMEM126A
          term:
            id: hgnc:25382
            label: TMEM126A
        relationship_type: CAUSATIVE
        notes: Biallelic TMEM126A variants cause OPA7, including homozygous and compound-heterozygous
          genotypes. The North African p.Arg55Ter founder allele is recurrent, while later Turkish, Iraqi,
          Italian, Chinese and Korean reports broaden the spectrum. RNA assays establish exon 2 skipping
          for c.86+2T>C, but complete loss of every protein isoform was not measured. Reports disagree
          on the classification of p.Ser36Leu; its segregation evidence and computational predictions
          should be distinguished from a direct functional assay.
        variants:
        - name: c.163C>T (p.Arg55Ter)
          gene:
            preferred_term: TMEM126A
            term:
              id: hgnc:25382
              label: TMEM126A
          description: Recurrent North African founder nonsense allele; homozygous in multiple families
            and in trans with c.28del in the Korean case. Phenotypic severity and extraocular findings
            vary within shared genotypes. The early stop lies upstream of an alternative translation start,
            so a complete null effect should not be presumed solely from its position.
        - name: c.86+2T>C
          gene:
            preferred_term: TMEM126A
            term:
              id: hgnc:25382
              label: TMEM126A
          description: Homozygous canonical splice-donor variant in a Turkish woman with childhood-onset
            optic atrophy. Blood cDNA showed loss of exon 2 from the major transcript, leaving the shorter
            isoform that can use an exon 3 initiation codon.
        - name: c.107C>T (p.Ser36Leu)
          gene:
            preferred_term: TMEM126A
            term:
              id: hgnc:25382
              label: TMEM126A
          description: Homozygous in Iraqi siblings in 2019 and in affected members of Chinese family
            F98 in 2020. The first report explicitly classified it as VUS; the later report argued for
            pathogenic or likely pathogenic status from segregation, conservation and modeling. These
            are differing published interpretations without a direct allele-specific functional assay.
            The Chinese narrative calls the affected pair brothers, whereas its demographic table records
            one male and one female; sex-specific conclusions are not drawn.
        - name: c.497A>G (p.Gln166Arg)
          gene:
            preferred_term: TMEM126A
            term:
              id: hgnc:25382
              label: TMEM126A
          description: Homozygous missense variant in an Italian proband with childhood optic atrophy,
            mild bilateral sensorineural deafness and intermittent limb myoclonus. Likely parental consanguinity
            was reconstructed from ancestry rather than established as a documented relationship.
        - name: c.28del (p.Glu10LysfsTer3)
          gene:
            preferred_term: TMEM126A
            term:
              id: hgnc:25382
              label: TMEM126A
          description: Paternally inherited early frameshift in trans with maternal p.Arg55Ter in a Korean
            boy with optic atrophy and latent nystagmus. The 2022 report classified both variants as likely
            pathogenic on NM_032273.3.
      selected_evidence:
        snippet: To date, all reports of pathogenic TMEM126A variants are from affected individuals of
          Maghrebian origin, who all carry an identical nonsense variant. Here we report two novel variants
          in the TMEM126A gene from non-Maghreb individuals, both found in affected individuals with an
          arOA phenotype.
        supports: SUPPORT
