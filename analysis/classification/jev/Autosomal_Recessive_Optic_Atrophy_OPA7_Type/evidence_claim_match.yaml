            term:
              id: MONDO:0013069
              label: autosomal recessive optic atrophy, OPA7 type
        context: []
      assertion_type: Genetic
      assertion:
        name: TMEM126A
        gene_term:
          preferred_term: TMEM126A
          term:
            id: hgnc:25382
            label: TMEM126A
        relationship_type: CAUSATIVE
        notes: Encodes a mitochondrial inner membrane protein, later shown to be a complex I assembly
          factor for the ND4 distal membrane module. The recurrent founder allele is the nonsense variant
          c.163C>T p.Arg55*, shared by all early Maghrebian families on a single ancestral haplotype.
          Two later non-Maghreb alleles are a homozygous splice-donor variant c.86+2T>C in a Turkish patient
          and a homozygous missense p.Ser36Leu in Iraqi siblings. TMEM126A is among the top ten nuclear
          genes accounting for hereditary optic neuropathy diagnoses.
      selected_evidence:
        snippet: To date, all reports of pathogenic TMEM126A variants are from affected individuals of
          Maghrebian origin, who all carry an identical nonsense variant. Here we report two novel variants
          in the TMEM126A gene from non-Maghreb individuals, both found in affected individuals with an
          arOA phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30961538
      reference_title: 'Novel likely pathogenic variants in TMEM126A identified in non-syndromic autosomal
        recessive optic atrophy: two case reports.'
      evidence_source: HUMAN_CLINICAL
      explanation: States both the founder-allele dominance of the earlier literature and the two alleles
        that broke it, which is the shape of the reported mutation spectrum.
