      assertion_type: Diagnosis
      assertion:
        name: Molecular diagnosis on a hereditary optic neuropathy gene panel
        description: Combine ophthalmological assessment with genetic testing and variant interpretation.
          Testing should cover the whole TMEM126A gene rather than only the recurrent North African allele,
          within an appropriate hereditary optic-neuropathy panel or broader sequencing approach. OCT
          can demonstrate retinal nerve-fiber-layer thinning, and pattern VEP and ERG can document ganglion-cell/optic-nerve
          dysfunction. Normal full-field ERG in reported patients argues against generalized retinal dysfunction;
          it does not exclude every retinal process.
