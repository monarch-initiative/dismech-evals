            id: hgnc:25382
            label: TMEM126A
      selected_evidence:
        snippet: TMEM126A mRNAs are strongly enriched in the vicinity of mitochondria and encode an inner
          mitochondrial membrane associated cristae protein.
        supports: SUPPORT
