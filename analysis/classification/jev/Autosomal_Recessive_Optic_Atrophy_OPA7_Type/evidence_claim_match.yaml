      assertion_type: Pathophysiology
      assertion:
        name: Failure of ND4 Module Assembly into Complex I
        description: TMEM126A associates with the newly synthesised mtDNA-encoded ND4 subunit and is needed
          to build the ND4 distal membrane module of complex I. Its paralogue TMEM126B does the same job
          for the ND2 module, and the two are not interchangeable, which is why losing one produces a
          specific assembly failure rather than a general one.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex I assembly
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Pulse-labeling interaction studies reveal that TMEM126A associates with the newly synthesized
          mitochondrial DNA (mtDNA)-encoded ND4 subunit of complex I. Our findings indicate that TMEM126A
          is involved in the assembly of the ND4 distal membrane module of complex I.
        supports: SUPPORT
