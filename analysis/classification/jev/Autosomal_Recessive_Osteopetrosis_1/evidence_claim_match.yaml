          disease_term:
            preferred_term: autosomal recessive osteopetrosis 1
            term:
              id: MONDO:0009815
              label: autosomal recessive osteopetrosis 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Skeletal Calcium Mobilization
        biological_scale: ORGANISM
        notes: 'This node reaches the same endpoint as defective_skeletal_mineralization#Impaired Hydroxyapatite
          Deposition at the Mineralization Front, but conforms_to is deliberately not declared. That module
          enumerates three routes to the endpoint, and its calciopenic node is scoped to reduced intestinal
          calcium absorption from insufficient calcitriol signalling or dietary calcium. Neither applies
          here: absorption and vitamin D signalling are intact, and the deficit is that the skeleton itself
          is unavailable as a calcium reservoir because osteoclasts cannot dissolve mineral. That is a
          fourth route the module does not cover, so declaring conformance would assert a mechanism this
          disease does not have. Worth raising with the module rather than papering over here.'
        description: 'Because osteoclasts cannot dissolve hydroxyapatite, the skeleton is unavailable
          as a calcium reservoir. Serum calcium falls, parathyroid hormone rises in compensation, and
          mineralization of newly laid osteoid fails. The result is rickets superimposed on a densely
          sclerotic skeleton, a combination easy to miss radiographically because the diffuse increase
          in bone density masks the impaired mineralization.

          '
      selected_evidence:
        snippet: secondary hyperparathyroidism from hypocalcemia, resulting in a paradoxical condition
          known as “osteopetrosis-rickets”
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
