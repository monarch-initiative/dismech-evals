              label: autosomal recessive osteopetrosis 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Stem Cell Transplantation
        description: 'The only curative treatment. The osteoclast lineage is haematopoietic, so donor-derived
          monocyte precursors give rise to osteoclasts carrying a functional a3 subunit and bone resorption
          is restored. Transplantation corrects the mechanism but does not reverse damage already inflicted,
          so vision and hearing lost to cranial nerve compression before transplant do not recover; this
          is what makes early molecular diagnosis the main determinant of outcome rather than transplant
          technique.

          '
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: allogeneic haematopoietic stem cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: The survival figure quoted here is from a 10-patient single-centre cohort that was not
          restricted to TCIRG1 and included one RANK case, so it should not be read as a TCIRG1-specific
          outcome.
      selected_evidence:
        snippet: Hematopoietic stem cell therapy (HSCT) for those with hematologic failure with imminent
          vision loss, severe osteopetrosis with bone marrow failure, or severe osteopetrosis in children
          younger than age one year, ideally prior to age ten months.
        supports: SUPPORT
