  4d2bfcce636303f0d6f4995ac75e2f2f1a723246b5a50a5aa07f4590b9fc459a:
    claim:
      about:
        disease:
          name: Autosomal Recessive Osteopetrosis 1
          disease_term:
            preferred_term: autosomal recessive osteopetrosis 1
            term:
              id: MONDO:0009815
              label: autosomal recessive osteopetrosis 1
        context: []
      assertion_type: Genetic
      assertion:
        name: TCIRG1
        gene_term:
          preferred_term: TCIRG1
          term:
            id: hgnc:11647
            label: TCIRG1
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Biallelic (homozygous or compound heterozygous) loss-of-function variants in TCIRG1 on
          chromosome 11q13.2, encoding the osteoclast-specific a3 subunit of the vacuolar H+-ATPase. The
          variant spectrum is dominated by nonsense, frameshift and splice-site alleles predicted to be
          null; missense alleles are a minority and at least one, p.Arg444Leu, is a loss of function by
          mistrafficking rather than by loss of catalytic residues. Splice-region substitutions are a
          large share of the total, which is why variants of uncertain significance in TCIRG1 often need
          a functional splicing assay rather than sequence-based prediction alone. Severity tracks residual
          a3 function: hypomorphic splice alleles have been reported in adults with radiographic osteopetrosis
          and no neurological or haematological disease.

          '
      selected_evidence:
        snippet: The remaining one, a 24-year-old male from a consanguineous family, was diagnosed based
          on radiological findings but presented no neurological or hematological defects. He was homozygous
          for c.2236+6T>G in intron 18; this mutation influenced the splicing process.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/4
      context_paths:
