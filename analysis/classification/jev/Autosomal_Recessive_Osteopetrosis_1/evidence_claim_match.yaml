              label: autosomal recessive osteopetrosis 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Recombinant Human Interferon Gamma-1b
        description: 'Adjunctive, non-curative therapy used as a bridge to transplantation. It increases
          osteoclastic bone resorption and corrects the reduced leukocyte superoxide generation that accompanies
          the osteoclast defect, improving marrow space, haemoglobin and infection frequency without addressing
          the underlying V-ATPase lesion.

          '
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: interferon gamma-1b
            term:
              id: NCIT:C100089
              label: Interferon Gamma-1b
        dosing_interval: three times per week
        notes: This trial predates routine molecular diagnosis and enrolled "severe osteopetrosis" rather
          than genotyped TCIRG1 patients, so the response cannot be attributed to the TCIRG1 form specifically.
          Note also that the trial reports increased osteoclastic resorption in cells that, in ARO1, cannot
          acidify at all; how much benefit is achievable through a null a3 subunit is not resolved by
          this study.
      selected_evidence:
        snippet: After 6 months of therapy, all 14 patients had decreases in trabecular-bone area (determined
          by histomorphometric analysis of bone-biopsy specimens) and increases in bone marrow space (determined
          by marrow imaging), and the improvement was sustained in the 11 patients treated for 18 months.
        supports: SUPPORT
