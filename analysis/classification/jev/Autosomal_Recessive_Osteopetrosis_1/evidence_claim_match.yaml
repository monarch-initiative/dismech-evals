      assertion:
        name: Autosomal Recessive
        description: 'Autosomal recessive inheritance. Biallelic (homozygous or compound heterozygous)
          TCIRG1 variants.

          Typically, but not exclusively. GeneReviews records rare exceptions: one family with heterozygous
          variants and autosomal dominant osteopetrosis, and one individual with a heterozygous de novo
          variant. Those are quoted in the evidence below rather than smoothed away, because this entry
          is bound to MONDO:0009815 on the basis of gene identity and the exceptions bear on how firmly
          that identity is drawn.

          '
      selected_evidence:
        snippet: TCIRG1, encoding the osteoclast-specific 116-kD subunit of the vacuolar proton pump,
          is mutated in five of nine patients with a diagnosis of infantile malignant osteopetrosis
        supports: SUPPORT
