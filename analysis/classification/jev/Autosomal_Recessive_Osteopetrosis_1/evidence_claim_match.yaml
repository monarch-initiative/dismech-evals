      - /disease_term
    evidence_metadata:
      reference: PMID:28816234
      reference_title: Novel mutations of TCIRG1 cause a malignant and mild phenotype of autosomal recessive
        osteopetrosis (ARO) in four Chinese families.
      evidence_source: HUMAN_CLINICAL
      explanation: A hypomorphic splice allele giving survival to adulthood without neurological or haematological
        disease. This is the clearest published demonstration that residual a3 function, rather than the
        presence of biallelic TCIRG1 variants as such, sets the severity of this disease.
