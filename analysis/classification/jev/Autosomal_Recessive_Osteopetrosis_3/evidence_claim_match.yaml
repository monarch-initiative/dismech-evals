      assertion_type: Discussion
      assertion:
        discussion_id: ca2_residual_renal_carbonic_anhydrase
        prompt: If CA II is the only soluble carbonic anhydrase isoenzyme in the kidney, why do CA II-deficient
          patients still respond to intravenous acetazolamide with a rise in urinary pH and bicarbonate
          excretion?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
        rationale: 'Patients with undetectable erythrocyte CA II nevertheless show a normal renal response
          to acetazolamide. The original authors set out three explanations - that the deficiency is not
          expressed in kidney, that another acetazolamide-sensitive soluble isoenzyme is expressed there
          in these patients, or that the response reflects the membrane-bound luminal carbonic anhydrase,
          a different gene product unaffected by the CA2 mutation - and favoured the third. This is recorded
          as an open question rather than settled because the entry''s renal node depends on it: if luminal
          membrane-bound activity is intact, the human renal defect is a partial loss of tubular carbonic
          anhydrase function, not a total one, and the residual activity is a potential target. It also
          bears on the interpretation of acetazolamide challenge as a diagnostic test, which would be
          uninformative here.'
      selected_evidence:
        snippet: Following acetazolamide infusion, the CA II-deficient patients exhibited a prompt rise
          in urinary pH and HCO3- excretion similar to the response seen in control subjects.
        supports: SUPPORT
    origin:
