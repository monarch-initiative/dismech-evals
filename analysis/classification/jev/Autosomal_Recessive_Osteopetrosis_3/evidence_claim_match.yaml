              id: MONDO:0009818
              label: autosomal recessive osteopetrosis 3
        context: []
      assertion_type: Treatment
      assertion:
        name: Ophthalmologic surveillance for compressive optic neuropathy
        description: 'Serial ophthalmologic assessment to detect optic nerve compression before vision
          is lost. The indication is specific to this disease rather than generic good practice: roughly
          half of eyes in the largest cohort had optic nerve involvement, the globes and retinae were
          normal so the lesion is compressive and in the bony canal, and involvement was random in occurrence
          - meaning it cannot be predicted from the rest of the phenotype and has to be looked for. Detected
          progressive visual loss is also what has driven the decision to escalate to transplantation.'
        treatment_term:
          preferred_term: serial ophthalmologic examination and optic canal assessment
          term:
            id: NCIT:C38060
            label: Eye Examination
        target_phenotypes:
        - preferred_term: Optic atrophy
          term:
            id: HP:0000648
            label: Optic atrophy
        notes: 'Two slots are deliberately left off. `therapeutic_modality` has no value for a surveillance
          action - the enum lists therapeutic platforms, and an examination is not one - so omitting it
          is more accurate than stretching DEVICE or BEHAVIORAL to cover it. `target_mechanisms` is also
          omitted: `TreatmentEffectEnum` offers INHIBITS, ACTIVATES, MODULATES, BYPASSES and RESTORES,
          and surveillance does none of those to the optic canal narrowing node. The honest join point
          is `target_phenotypes`, which is what is used.

          The evidence below establishes the indication and its frequency. No CA2-specific surveillance
          interval or protocol has been published, so none is asserted here.'
      selected_evidence:
        snippet: Globes and retinae were normal, but optic nerve involvement was present in 23/46 eyes
          and was variable in severity, random in occurrence and statistically correlated with degree
          of optic canal narrowing
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/0
