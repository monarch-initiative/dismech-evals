      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:6410391
      reference_title: 'Polymorphic gene for human carbonic anhydrase II: a molecular disease marker located
        on chromosome 8.'
      evidence_source: IN_VITRO
      explanation: Somatic cell hybrid mapping of CA2 to chromosome 8, the step that made molecular diagnosis
        possible.
