        context: []
      assertion_type: Treatment
      assertion:
        name: Oral alkali therapy
        description: 'Oral bicarbonate or citrate to correct the hyperchloremic metabolic acidosis. This
          is the mainstay for the renal arm and the only arm-directed therapy that is not a transplant.
          It is worth being precise about its standing: there is no standardised pharmacologic regimen
          for this disease, and the strongest statement available is an inference from a cohort whose
          overall phenotype was milder than historical series, whose authors raised the possibility that
          early bicarbonate treatment was responsible. Alkali therapy does not affect the skeletal or
          cerebral arms.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: sodium bicarbonate
            term:
              id: CHEBI:32139
              label: sodium hydrogencarbonate
      selected_evidence:
        snippet: Several mouse models of CA II deficiency have shown growth hormone deficiency, yet currently
          there is no standard pharmacologic therapy for patients.
        supports: SUPPORT
