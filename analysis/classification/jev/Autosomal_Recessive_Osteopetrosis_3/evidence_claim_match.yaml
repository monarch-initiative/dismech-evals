            term:
              id: MONDO:0009818
              label: autosomal recessive osteopetrosis 3
        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic hematopoietic stem cell transplantation
        description: 'Transplantation supplies CA II-competent osteoclast precursors, which are hematopoietic
          in origin, and can resolve the osteopetrosis histologically and radiologically. It is an arm-specific
          therapy by construction: the renal tubule and the brain are not hematopoietic, keep their own
          enzyme defect, and are unaffected. Reported indications have been severe progressive visual
          and hearing loss rather than marrow failure. This is emphatically not the default management
          of CA2 deficiency the way it is for TCIRG1 malignant infantile osteopetrosis: this is an intermediate
          osteopetrosis whose skeletal phenotype often improves with age and which is compatible with
          a normal lifespan, so transplantation is reserved.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: allogeneic hematopoietic stem cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: The general osteopetrosis literature calls transplantation "the treatment of choice for
          most forms of osteopetrosis" (PMID:42096006). That statement is about osteopetrosis as a group,
          dominated by the malignant infantile forms, and is not a recommendation for CA II deficiency
          - which is why it is cited here as context in `notes` rather than as evidence for this treatment.
      selected_evidence:
        snippet: Post-transplantation evaluation at 2 and 3 years demonstrates histologic and radiologic
          resolution of their osteopetrosis with stabilization of hearing and vision.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
