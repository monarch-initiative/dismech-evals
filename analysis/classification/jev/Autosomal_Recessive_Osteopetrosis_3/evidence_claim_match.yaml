  d0b75780176dc15f2bdae04a86d9216593eaca838bc80e337aa3d0ce647c11dc:
    claim:
      about:
        disease:
          name: Autosomal Recessive Osteopetrosis 3
          disease_term:
            preferred_term: autosomal recessive osteopetrosis 3
            term:
              id: MONDO:0009818
              label: autosomal recessive osteopetrosis 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ca2_cerebral_calcification_mechanism
        prompt: By what route does loss of cytosolic carbonic anhydrase II produce parenchymal calcium
          deposition in basal ganglia and thalami, and why does the calcium burden not track neurodevelopmental
          outcome?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Intracranial Parenchymal Calcium Deposition
        - phenotypes#Cerebral calcification
        - phenotypes#Intellectual disability
        rationale: 'The bone and kidney arms of this disease are mechanistically closed: the enzyme supplies
          protons, the pump secretes them, the mineral dissolves or the urine acidifies. The cerebral
          arm is not. Nothing demonstrated connects CA II loss to mineral deposition at these specific
          sites, the authoritative review states outright that the pathogenesis of the cerebral calcification
          and the cognitive impairment is less well understood, and the one study to quantify the calcium
          burden found it unrelated to developmental quotient, neurodevelopmental symptoms, neuropsychiatric
          symptoms or optic canal diameter. Two further observations keep the question open rather than
          narrowing it. Calcification is age-dependent and was absent at 9 years in one confirmed patient,
          so it is accrued rather than congenital. And cognitive outcome varies markedly between siblings
          sharing the intron 2 founder allele, which the cohort''s authors read as implying additional
          genetic or epigenetic influences. Practically, this means imaging calcium burden should not
          be used as a prognostic surrogate, and a curated edge from the enzyme defect to cognition would
          be an invention.'
      selected_evidence:
        snippet: Although this enzymopathy reveals how CA II is important for the skeleton and kidney
          tubule, the pathogenesis of the mental subnormality and cerebral calcification is less well
          understood.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
