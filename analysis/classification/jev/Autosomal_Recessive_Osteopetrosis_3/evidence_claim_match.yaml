  d726f3f025a39e98b432006af5eefb28fc949bf68d24fb1f2fa1c3a536c86cac:
    claim:
      about:
        disease:
          name: Autosomal Recessive Osteopetrosis 3
          disease_term:
            preferred_term: autosomal recessive osteopetrosis 3
            term:
              id: MONDO:0009818
              label: autosomal recessive osteopetrosis 3
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Car-2 null mouse (ENU-induced)
        species: Mouse
        genotype: Car-2 null (ENU-induced, homozygous)
        background: (C57BL/6J x DBA/2J)F1-derived
        publication: PMID:3126501
        description: 'An N-ethyl-N-nitrosourea-induced null allele at the mouse Car-2 locus on chromosome
          3, with no detectable CA II protein in any tissue. This is the reference model for the disease
          and it splits the human phenotype cleanly in two: it reproduces the renal tubular acidosis and
          the growth failure, and it does not reproduce the osteopetrosis at any age. That dissociation
          is the single most important thing to know before using the model for the bone arm.'
        modeled_mechanisms:
        - target: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: Homozygous null mice develop renal tubular acidosis, as humans with the same enzyme
            defect do.
          limitations: The mouse renal defect has not been segment-resolved against the mixed proximal-and-distal
            pattern typical of human disease, and the mouse shows an additional intercalated-cell population
            phenotype whose human counterpart is unknown.
          readouts:
          - name: Renal tubular acidosis in homozygous null mice
            target: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
            direction: ALTERED
            interpretation: The acid-base phenotype of the model matches the human renal arm.
          - name: Collecting-duct intercalated cell depletion
            target: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
            direction: DECREASED
            interpretation: Beyond loss of enzyme activity, the acid-secreting cell population itself
              is depleted and replaced by principal cells - a cell-population phenotype, not only an enzymatic
              one.
          - name: Collecting-duct bicarbonate transporter expression
            target: Impaired Renal Tubular Proton Secretion and Bicarbonate Reclamation
