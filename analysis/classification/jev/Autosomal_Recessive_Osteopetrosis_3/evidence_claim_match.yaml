      assertion_type: Discussion
      assertion:
        discussion_id: ca2_growth_failure_attribution
        prompt: Is the short stature of carbonic anhydrase II deficiency caused by chronic metabolic acidosis,
          by the skeletal disease, or by growth hormone deficiency?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Short stature
        - pathophysiology#Systemic Hyperchloremic Metabolic Acidosis
        rationale: 'Short stature is near-universal - 23 of 23 patients in the largest cohort - but its
          mechanism is not assigned, which is why no pathograph edge points at it in this entry. Three
          candidates are live and none is excluded. Chronic metabolic acidosis impairs growth generally,
          and the null mouse is both acidotic and runted, which is suggestive but is co-occurrence in
          a single genotype rather than a demonstrated causal chain. The sclerosing skeletal disease is
          an obvious alternative. And growth hormone deficiency has been reported in several mouse models
          of CA II deficiency, which would place the lesion in a third, endocrine compartment that nothing
          in this entry currently models. Resolving this matters clinically: it determines whether correcting
          acidosis early is expected to protect growth, which is the implicit justification for treating
          the acidosis in childhood.'
      selected_evidence:
        snippet: Several mouse models of CA II deficiency have shown growth hormone deficiency, yet currently
          there is no standard pharmacologic therapy for patients.
        supports: SUPPORT
