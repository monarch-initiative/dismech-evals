              label: autosomal recessive osteopetrosis 3
        context: []
      assertion_type: Phenotype
      assertion:
        category: Renal
        name: Renal tubular acidosis
        frequency: VERY_FREQUENT
        phenotype_term:
          preferred_term: Renal tubular acidosis, most often of mixed proximal and distal type
          term:
            id: HP:0001947
            label: Renal tubular acidosis
        description: Bound to the parent HP term deliberately. The literature most often describes a mixed
          proximal and distal defect, with kindreds in which either predominates, so neither HP:0002049
          (proximal) nor HP:0008341 (distal) is the correct single binding for the disease as a whole.
          Individual reports have described purely distal disease, type 2 (proximal) disease, and one
          proband with osteopetrosis and cerebral calcification but no detectable RTA at all.
        diagnostic: true
        notes: 'VERY_FREQUENT, not OBLIGATE. The supporting case for near-universality is strong - 23
          of 23 patients in the largest cohort, and no exception had been found to the rule that coexistent
          osteopetrosis and RTA means CA II deficiency - but it is not 100%, and the counterexample is
          recorded in the REFUTE item below: a genetically confirmed CA II deficient proband had osteopetrosis,
          developmental delay and cerebral calcification with no detectable renal tubular acidosis (PMID:8128957).

          The distinction is queryable rather than cosmetic. OBLIGATE asserts that every affected individual
          has the feature, which licenses a downstream consumer to treat absent RTA as excluding the diagnosis.
          That inference is wrong here, and acting on it would have missed the Puerto Rican proband. VERY_FREQUENT
          says what the literature actually supports: present in the large majority, and its absence does
          not rule the disease out. Note that Osteopetrosis on this entry stays OBLIGATE, because no counterexample
          to that feature is recorded.'
      selected_evidence:
        snippet: Most often, the RTA is of mixed proximal and distal type, but kindreds are reported in
          which either distal or proximal RTA predominates.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/1
