      assertion:
        category: Audiologic
        name: Hearing impairment
        phenotype_term:
          preferred_term: Hearing impairment
          term:
            id: HP:0000365
            label: Hearing impairment
        description: Genuinely inconsistent across cohorts, and recorded here with evidence on both sides
          rather than as a settled feature. Conductive hearing impairment appears in descriptions of the
          Guibaud-Vainsel phenotype, progressive hearing loss was a stated indication for transplantation
          in two Irish families, and deafness is reported in an individual case; but in the largest single
          cohort all internal auditory canals were of normal size and no patient had clinically significant
          hearing loss.
        notes: 'No `frequency` is recorded: the cohort data are directly discordant, so any enum value
          here would be an invention. Bound to the parent HP:0000365 rather than to HP:0000405 (conductive)
          because the mechanism is not established across reports.'
      selected_evidence:
        snippet: Clinical manifestations of this autosomal recessive syndrome comprise increased bone
          density, growth failure, intracerebral calcification, facial dysmorphism, mental retardation,
          and conductive hearing impairment.
        supports: SUPPORT
