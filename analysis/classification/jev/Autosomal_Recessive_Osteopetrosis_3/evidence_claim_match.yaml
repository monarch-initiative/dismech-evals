            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            presence: Biallelic loss-of-function variants in all reported patients
            notes: 'CA2 (carbonic anhydrase 2, HGNC:1373, chromosome 8q21.2) encodes the cytosolic zinc
              metalloenzyme carbonic anhydrase II. The gene-disease relationship is near-absolute in both
              directions: patients with coexistent osteopetrosis and renal tubular acidosis have proven
              CA II deficient with one documented exception, and every CA II-deficient patient analysed
              has had a CA2 mutation. The gene was localised to chromosome 8 by somatic cell hybrid segregation
              analysis in 1983, the same year the enzyme defect was identified. Reported variant classes
              are splice-junction, nonsense, frameshift and missense, all acting by loss of function.
              The recurring alleles are the intron 2 5'' splice-site "Arabic" founder variant (c.232+1G>T),
              the exon 7 single-base deletion homozygous in Caribbean Hispanic families, and His107Tyr
              (found in the index American and a Belgian family), which retains greatly reduced but detectable
              activity.

              The gene CURIE was verified in both directions against the HGNC REST API before binding:
              symbol CA2 resolves to HGNC:1373, and HGNC:1373 resolves to symbol CA2 ("carbonic anhydrase
              2", 8q21.2). This check was done because hgnc:1373 is easily confused with hgnc:13733, which
              is CDH23 - a different gene entirely. The stub''s pre-filled `genes` value (hgnc:1373 /
              CA2) is correct.

              Variant-class caveat for interpretation. The splice, nonsense and frameshift alleles below
              are null by inspection. The missense class is the one where computational assessment is
              unreliable in this gene: consensus free-energy methods predicted only half of known disease-causing
              CA2 missense variants as destabilizing, because the perturbation is residue-local rather
              than global. A benign in silico stability prediction therefore carries little weight against
              a CA2 missense variant, and functional or biophysical corroboration is what separates the
              classes - His107Tyr is the worked case, where recombinant expression showed greatly reduced
              but detectable activity.'
