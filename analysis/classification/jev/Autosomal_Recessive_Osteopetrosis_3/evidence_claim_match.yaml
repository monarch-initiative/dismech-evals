          term:
            id: UBERON:0001474
            label: bone element
      selected_evidence:
        snippet: Although CA II deficiency is an "osteoclast-rich" OPT, and therefore transplantation
          of healthy osteoclasts can improve the skeletal disease, the RTA and central nervous system
          difficulties persist.
        supports: SUPPORT
