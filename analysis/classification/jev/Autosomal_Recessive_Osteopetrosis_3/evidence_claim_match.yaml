            term:
              id: MONDO:0009818
              label: autosomal recessive osteopetrosis 3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ca2_osteopetrosis_rta_phenocopy
        prompt: Does the combination of osteopetrosis and renal tubular acidosis always mean CA II deficiency,
          given that coinherited TCIRG1 and ATP6V1B1 defects can reproduce it?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - phenotypes#Osteopetrosis
        - phenotypes#Renal tubular acidosis
        - genetic#CA2
        rationale: The clinical triad is a very strong pointer to CA2 and is often treated as diagnostic,
          but it is not pathognomonic, and the documented exception is instructive rather than merely
          pedantic. One kindred with osteopetrosis and distal renal tubular acidosis had normal CA II
          levels and no CA2 defect; instead two separate recessive disorders were segregating, a TCIRG1
          deletion producing the osteopetrosis and an ATP6V1B1 mutation producing the distal RTA. Both
          genes encode subunits of the same proton pump, in tissue-specific isoforms. The practical consequence
          is that the triad justifies CA2 testing and the enzyme assay, but a negative CA2 result in a
          patient with the full phenotype should prompt a search for coinherited pump subunit defects
          rather than a presumption of a cryptic CA2 variant.
      selected_evidence:
        snippet: In this kindred, two separate recessive disorders are penetrant, each affecting a different,
          tissue specific subunit of the vacuolar proton pump (H(+)-ATPase), providing a highly unusual,
          novel genetic explanation for the coexistence of osteopetrosis and dRTA.
        supports: SUPPORT
