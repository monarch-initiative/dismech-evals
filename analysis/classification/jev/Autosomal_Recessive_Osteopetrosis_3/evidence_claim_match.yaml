              label: autosomal recessive osteopetrosis 3
        context: []
      assertion_type: Definition
      assertion:
        name: Clinical triad of carbonic anhydrase II deficiency
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'The historical clinical definition: osteopetrosis plus renal tubular acidosis plus
          cerebral calcification. Confirmation is by absent erythrocyte carbonic anhydrase II activity
          and by CA2 sequencing of all seven exons; prenatal diagnosis is molecular.'
        scope: Clinical diagnosis of carbonic anhydrase II deficiency in a child with osteopetrosis
        attaches_to:
        - phenotypes#Osteopetrosis
        - phenotypes#Renal tubular acidosis
        - phenotypes#Cerebral calcification
        inclusion_criteria:
        - preferred_term: Osteopetrosis
          term:
            id: HP:0011002
            label: Osteopetrosis
          description: Radiographically increased, generalised bone density.
        - preferred_term: Renal tubular acidosis
          term:
            id: HP:0001947
            label: Renal tubular acidosis
          description: Hyperchloremic, normal-anion-gap metabolic acidosis of renal tubular origin; proximal,
            distal or mixed.
        - preferred_term: Intracranial parenchymal calcification
          term:
            id: HP:0002514
            label: Cerebral calcification
          description: Calcification on CT, typically basal ganglia and thalami. Age-dependent, so absence
            in a young child does not exclude the diagnosis.
        - preferred_term: Absent erythrocyte carbonic anhydrase II activity
          description: Biochemical confirmation; carbonic anhydrase I is unaffected, and obligate heterozygotes
            sit at about half-normal.
        - preferred_term: Biallelic pathogenic CA2 variants
          description: Molecular confirmation by sequencing of all seven CA2 exons. This is the criterion
            that settles the diagnosis.
        notes: Two caveats for applying the triad in a young child. Cerebral calcification is age-dependent
          and has been absent at 9 years in a genetically confirmed patient, and at least one confirmed
          patient had no detectable renal tubular acidosis. The triad is a strong clinical trigger, not
          a set of necessary conditions - which is why the molecular criterion is the one that settles
          the diagnosis.
      selected_evidence:
        snippet: The deficiency of carbonic anhydrase II causes a moderate form, presenting classically
          as a triad of osteopetrosis, renal tubular acidosis (RTA), and cerebral calcification.
        supports: SUPPORT
    origin:
