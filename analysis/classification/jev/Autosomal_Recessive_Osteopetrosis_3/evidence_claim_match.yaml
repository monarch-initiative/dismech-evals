          supplying the counter-ion chloride. Carbonic anhydrase II generates those protons in the cytosol.
          Without it the osteoclast is present, multinucleated and attached but cannot lower the pH of
          the compartment it has sealed. This is the defining contrast with TCIRG1 and CLCN7 disease,
          where the pump and the counter-ion conductance themselves fail: the lesion here is upstream
          of the transport machinery, in the substrate it transports.'
