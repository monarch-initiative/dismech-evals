  d01f7b6172fe81005f2f098b5c44c5689725249e20b8a78e340118997f8781d9:
    claim:
      about:
        disease:
          name: Autosomal Recessive Osteopetrosis 3
          disease_term:
            preferred_term: autosomal recessive osteopetrosis 3
            term:
              id: MONDO:0009818
              label: autosomal recessive osteopetrosis 3
        context: []
      assertion_type: Genetic
      assertion:
        name: CA2
        gene_term:
          preferred_term: CA2
          term:
            id: hgnc:1373
            label: CA2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Biallelic loss-of-function variants in all reported patients
        notes: 'CA2 (carbonic anhydrase 2, HGNC:1373, chromosome 8q21.2) encodes the cytosolic zinc metalloenzyme
          carbonic anhydrase II. The gene-disease relationship is near-absolute in both directions: patients
          with coexistent osteopetrosis and renal tubular acidosis have proven CA II deficient with one
          documented exception, and every CA II-deficient patient analysed has had a CA2 mutation. The
          gene was localised to chromosome 8 by somatic cell hybrid segregation analysis in 1983, the
          same year the enzyme defect was identified. Reported variant classes are splice-junction, nonsense,
          frameshift and missense, all acting by loss of function. The recurring alleles are the intron
          2 5'' splice-site "Arabic" founder variant (c.232+1G>T), the exon 7 single-base deletion homozygous
          in Caribbean Hispanic families, and His107Tyr (found in the index American and a Belgian family),
          which retains greatly reduced but detectable activity.

          The gene CURIE was verified in both directions against the HGNC REST API before binding: symbol
          CA2 resolves to HGNC:1373, and HGNC:1373 resolves to symbol CA2 ("carbonic anhydrase 2", 8q21.2).
          This check was done because hgnc:1373 is easily confused with hgnc:13733, which is CDH23 - a
          different gene entirely. The stub''s pre-filled `genes` value (hgnc:1373 / CA2) is correct.

          Variant-class caveat for interpretation. The splice, nonsense and frameshift alleles below are
          null by inspection. The missense class is the one where computational assessment is unreliable
          in this gene: consensus free-energy methods predicted only half of known disease-causing CA2
          missense variants as destabilizing, because the perturbation is residue-local rather than global.
          A benign in silico stability prediction therefore carries little weight against a CA2 missense
          variant, and functional or biophysical corroboration is what separates the classes - His107Tyr
          is the worked case, where recombinant expression showed greatly reduced but detectable activity.'
        variants:
        - name: c.232+1G>T (intron 2 5' splice site; the "Arabic" founder allele)
          type: splice site
          clinical_significance: PATHOGENIC
          description: Splice donor-site variant at the 5' end of intron 2. The predominant cause of CA
            II deficiency in North African and Middle Eastern patients, found homozygously in all ten
            Tunisian patients of one series and in the Iranian patient who underwent transplantation.
            Associated with cognitive impairment and with relatively infrequent fractures.
        - name: His107Tyr (p.H107Y)
          type: missense
          clinical_significance: PATHOGENIC
          description: C-to-T transition substituting tyrosine for the invariant histidine at position
            107, disrupting hydrogen bonding to Glu-117 and Tyr-194 and destabilising the protein. Unusually
            among CA2 alleles it leaves detectable residual activity, which has been proposed as the explanation
            for the milder phenotype and absent cognitive impairment in the families that carry it.
        - name: Exon 7 single-base deletion (frameshift)
          type: frameshift
          clinical_significance: PATHOGENIC
          description: Single-base deletion in exon 7 producing a frameshift and premature termination,
            homozygous in seven unrelated Hispanic families of Caribbean ancestry. The truncated 27-kD
            product is inactive, aggregates, and is rapidly degraded.
        - name: c.368G>A p.W123X (nonsense)
          type: nonsense
          clinical_significance: PATHOGENIC
          description: Homozygous nonsense variant in exon 4 identified in a five-generation Chinese family;
            minigene and structural work attributed the effect to altered protein modification, impaired
            zinc binding, and reduced CA2 protein expression.
      selected_evidence:
        snippet: Segregation analysis of the molecular marker and chromosomes in cell hybrids indicated
          a clear correlation between the presence of chromosome 8 and the human CA II gene (CA2).
        supports: SUPPORT
