      assertion:
        name: Accumulation of Unresorbed Sclerotic Bone with Preserved Osteoclast Number
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: Resorption fails while formation continues, so dense, poorly remodelled, mechanically
          brittle bone accumulates. Osteoclasts remain present and are not reduced in number - this is
          an osteoclast-rich osteopetrosis, the category shared with TCIRG1, CLCN7, OSTM1 and SNX10 disease
          and distinct from the osteoclast-poor RANKL/RANK forms, in which osteoclasts fail to be generated
          at all. The practical consequence is that supplying normal osteoclast precursors can rescue
          this arm, which is why transplantation works on the bone and on nothing else.
        biological_processes:
        - preferred_term: ossification continuing without matched resorption
          modifier: INCREASED
          term:
            id: GO:0001503
            label: ossification
        locations:
