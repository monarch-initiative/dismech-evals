        discussion_id: ca2_mouse_null_lacks_osteopetrosis
        prompt: Why does the Car-2 null mouse reproduce the renal and growth arms of carbonic anhydrase
          II deficiency but not the osteopetrosis, and what model is therefore valid for studying the
          human bone arm?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Osteoclast Resorption Lacuna Acidification Failure
        - pathophysiology#Failure of Hydroxyapatite Dissolution and Bone Matrix Degradation
        - animal_models#Mouse
        rationale: 'This is a mismatch rather than a knowledge gap: the evidence exists, in a true protein-null
          mouse, and it is negative for the defining human phenotype. Homozygous Car-2 null mice are runted
          and acidotic like patients, but osteopetrosis could not be detected even in very old animals.
          The usual explanation offered is redundancy among carbonic anhydrase isoenzymes in mouse osteoclasts
          that human osteoclasts lack, which is plausible and undemonstrated. Two consequences follow
          for curation and for experimental design. First, the negative mouse skeletal result must not
          be read as evidence against the human osteoclast mechanism, which rests on human genetics, human
          enzyme assays, and the pharmacological phenocopy produced by carbonic anhydrase inhibitors.
          Second, no validated model exists for the human bone arm, so preclinical testing of bone-directed
          therapy has no substrate - patient-derived or CA2-knockout human osteoclast systems would be
          the way to close this, and none is reported.'
      selected_evidence:
        snippet: However, the prominent osteopetrosis found in humans with CA II deficiency could not
          be detected even in very old homozygous null mice.
        supports: SUPPORT
