        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: Cytosolic carbonic anhydrase II supplies protons for secretion and bicarbonate for
          basolateral exit in the proximal tubule, and the same activity in collecting-duct alpha-intercalated
          cells supports distal proton secretion. Its loss impairs both bicarbonate reclamation and distal
          acidification, which is why the renal phenotype is most often mixed rather than purely distal.
          Two observations qualify the cellular picture. First, CA II-deficient patients still respond
          to intravenous acetazolamide with a rise in urinary pH and bicarbonate excretion, so a separate
          acetazolamide-sensitive carbonic anhydrase - most plausibly the membrane-bound luminal isoenzyme,
          which is a different gene product - remains active in their kidneys. Second, in the mouse null
          the intercalated cell population itself is depleted, so part of the renal defect may be a cell-population
          phenotype rather than a purely enzymatic one.
        cell_types:
