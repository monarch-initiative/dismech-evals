        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CA2 Loss of Function
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'Both CA2 alleles carry loss-of-function variants - splice-junction, nonsense, frameshift
          or missense - and carbonic anhydrase II protein is absent or catalytically dead in every tissue
          that normally expresses it. The erythrocyte is the accessible readout: the isoenzyme II peak,
          its esterase and CO2 hydratase activities, and immunoprecipitable enzyme are all essentially
          absent, while CA I is spared. Reported mechanisms of loss include abolished splicing (the intron
          2 founder allele), premature termination with accelerated degradation and insoluble aggregation
          (the exon 7 frameshift), and destabilisation or disrupted zinc coordination of an otherwise
          full-length protein (His107Tyr, p.W123X).'
        genetic_context:
          gene:
            preferred_term: CA2
            term:
              id: hgnc:1373
              label: CA2
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Homozygous in most reported families, including all patients carrying the intron
            2 founder allele; compound heterozygosity is reported in the index American family.
        molecular_functions:
        - preferred_term: carbonic anhydrase II (cytosolic CO2 hydratase) activity
          modifier: ABSENT
          term:
            id: GO:0004089
            label: carbonate dehydratase activity
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        chemical_entities:
        - preferred_term: zinc(2+) (catalytic metal of carbonic anhydrase II)
          term:
            id: CHEBI:29105
            label: zinc(2+)
      selected_evidence:
        snippet: Virtual absence of the carbonic anhydrase II peak on high-performance liquid chromatography,
          of the esterase and carbon dioxide hydratase activities of carbonic anhydrase II, and of immunoprecipitable
          isozyme II was demonstrated on extracts of erythrocyte hemolysates from all patients studied.
        supports: SUPPORT
    origin:
