      assertion:
        name: Secondary or acquired microcephaly
        description: Postnatal brain-growth deceleration or atrophy can follow infection, hypoxic-ischemic
          injury, teratogenic exposure, metabolic disease, or neurodegeneration and requires an exposure,
          imaging, and temporal workup.
        distinguishing_features:
        - Normal head size at birth followed by deceleration favors secondary microcephaly.
        - Brain atrophy, destructive lesions, or a documented acquired insult weighs against classic MCPH.
      selected_evidence:
        snippet: Microcephaly or reduced head circumference results from a multitude of abnormal developmental
          processes affecting brain growth and/or leading to brain atrophy.
