          knockout cerebral-organoid work. Deliberately left without a `subtype_term`: five OLS searches
          of MONDO run for this pass — `runoak -i ols:mondo search "l~CETN3"`, `"l~centrin"`, `"l~microcephaly
          32"`, and the synonym-inclusive `"CETN3"` and `"centrin"` — each returned no terms, so MONDO
          carries nothing this row could be bound to. The synonym-inclusive pair matters: on this same
          branch a sibling claim that MONDO had no ALPS-FASLG term turned out to be false, because MONDO
          names that concept after its gene and carries the disease name only as a synonym. This row previously
          carried MONDO:0980991; see `notes:` for why that binding was wrong.'
        genes:
        - preferred_term: CETN3
          term:
            id: hgnc:1868
            label: CETN3
      selected_evidence:
        snippet: Through whole-exome sequencing, we identified compound heterozygous loss-of-function
          mutations in CENTRIN 3 (CETN3) in a 5-year-old patient with primary microcephaly.
        supports: SUPPORT
