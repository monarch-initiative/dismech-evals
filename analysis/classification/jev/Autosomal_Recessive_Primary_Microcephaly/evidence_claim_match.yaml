        prompt: How should future MCPH loci be incorporated while preserving the boundary between classic
          isolated MCPH, syndromic microcephaly, primordial dwarfism, and broader cortical-malformation
          disorders?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Heterogeneous Biallelic MCPH Gene Dysfunction
        rationale: 'The numbered series is actively evolving: a 2021 review listed MCPH1-28, a 2023 mechanism
          review referred to MCPH1-30, the highest MONDO number this pass could find is MCPH31 (CDK4,
          OMIM:621507) — label searches for microcephaly 32 through 35 each returned nothing — and CETN3-associated
          disease was reported in 2025 with no number assigned to it at all. Historical numbering alone
          cannot determine current ontology ancestry or whether a phenotype should be lumped into this
          umbrella, and a newly reported gene may sit outside the numbering for some time — which is a
          trap, because the next free number is an easy thing to assume. This entry previously asserted
          exactly that, binding the CETN3 row to MONDO:0980991.'
      selected_evidence:
        snippet: twenty-eight MCPH-related genes
        supports: SUPPORT
