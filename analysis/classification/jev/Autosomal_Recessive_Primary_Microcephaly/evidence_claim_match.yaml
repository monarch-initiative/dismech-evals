        context: []
      assertion_type: Subtype
      assertion:
        name: MCPH31
        display_name: MCPH31 (CDK4)
        description: 'Biallelic loss-of-function CDK4 variants. Reported in two families brought together
          through GeneMatcher, in whom the phenotype is microcephaly with short stature rather than isolated
          microcephaly — so this subtype sits at the microcephalic-dwarfism end of the umbrella, and the
          MONDO record''s phenotype annotations (short stature, intrauterine growth retardation, delayed
          skeletal maturation) reflect that. The mechanism is also not the centrosomal one that most of
          this series shares: patient fibroblasts have no detectable full-length CDK4, impaired retinoblastoma
          phosphorylation and a G1/S transition defect, with normal mitotic index, normal spindles and
          no supernumerary centrosomes.'
        subtype_term:
          preferred_term: microcephaly 31, primary, autosomal recessive
          term:
            id: MONDO:0980991
            label: microcephaly 31, primary, autosomal recessive
        genes:
        - preferred_term: CDK4
          term:
            id: hgnc:1773
            label: CDK4
      selected_evidence:
        snippet: Here we identified biallelic mutations in CDK4 as a cause of microcephaly and short stature.
        supports: SUPPORT
