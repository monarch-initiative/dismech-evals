        context:
        - path: /has_subtypes/27
          value:
            name: MCPH31
            display_name: MCPH31 (CDK4)
            description: 'Biallelic loss-of-function CDK4 variants. Reported in two families brought together
              through GeneMatcher, in whom the phenotype is microcephaly with short stature rather than
              isolated microcephaly — so this subtype sits at the microcephalic-dwarfism end of the umbrella,
              and the MONDO record''s phenotype annotations (short stature, intrauterine growth retardation,
              delayed skeletal maturation) reflect that. The mechanism is also not the centrosomal one
              that most of this series shares: patient fibroblasts have no detectable full-length CDK4,
              impaired retinoblastoma phosphorylation and a G1/S transition defect, with normal mitotic
              index, normal spindles and no supernumerary centrosomes.'
            subtype_term:
              preferred_term: microcephaly 31, primary, autosomal recessive
              term:
                id: MONDO:0980991
                label: microcephaly 31, primary, autosomal recessive
            genes:
            - preferred_term: CDK4
              term:
                id: hgnc:1773
                label: CDK4
          role: subtype
      assertion_type: Genetic
      assertion:
        name: CDK4
        association: Biallelic Pathogenic Variant
        relationship_type: CAUSATIVE
        subtype: MCPH31
        gene_term:
          preferred_term: CDK4
          term:
            id: hgnc:1773
            label: CDK4
        notes: Causes MCPH31 (MONDO:0980991, OMIM:621507). CDK4 is a G1 cell-cycle kinase, not a centrosomal
          protein, so this subtype does not run through the centrosome/spindle convergence that most of
          the series shares — the authors found normal mitotic index, normal spindles and no supernumerary
          centrosomes in patient fibroblasts, and state explicitly that the extreme microcephaly of CDK4
          and of CDK6 (MCPH12) do not share a common mechanism. Heterozygous germline CDK4 R24C/R24H gain-of-function
          alleles cause familial melanoma and are a different disease; only biallelic loss of function
          is relevant here.
      selected_evidence:
        snippet: The presence of homozygous CDK4 variants was confirmed by Sanger sequencing of blood
          genomic DNA in all affected individuals. Parents were heterozygous carriers
        supports: SUPPORT
