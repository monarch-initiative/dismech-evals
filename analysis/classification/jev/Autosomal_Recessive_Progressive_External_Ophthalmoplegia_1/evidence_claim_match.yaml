              recessive 1
            term:
              id: MONDO:0009783
              label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
                recessive 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular Diagnosis by Biallelic POLG Variants
        description: 'Diagnosis rests on the clinical picture of progressive ptosis and external ophthalmoplegia
          (usually with a mitochondrial myopathy and neuropathy) plus identification of biallelic pathogenic
          POLG variants. Muscle biopsy showing ragged-red and COX-negative fibres with multiple large-scale
          mtDNA deletions supports the diagnosis and, historically, was the finding that redirected testing
          to the nuclear genome; with modern panels or exome sequencing, POLG sequencing often precedes
          biopsy. Critically, the requirement for BIALLELIC variants is what distinguishes PEOB1 from
          the autosomal dominant PEOA1, where a single heterozygous variant is diagnostic.

          '
      selected_evidence:
        snippet: Establishing the diagnosis of a POLG-related disorder relies on clinical findings and
          the identification of biallelic POLG pathogenic variants on molecular genetic testing for all
          phenotypes except autosomal dominant progressive external ophthalmoplegia (adPEO), for which
          identification of a heterozygous POLG pathogenic variant on molecular genetic testing is diagnostic.
        supports: SUPPORT
    origin:
