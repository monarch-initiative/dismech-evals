      assertion_type: Discussion
      assertion:
        discussion_id: peob1_extraocular_selectivity_gap
        prompt: Why are the extraocular muscles and levator palpebrae superioris the earliest and most
          severely affected tissue in POLG-related recessive PEO, when the POLG defect is present in every
          cell?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Selective Extraocular and Levator Muscle Vulnerability
        rationale: Extraocular muscle carries a threefold higher burden of COX-deficient fibres than limb
          muscle in CPEO patients, and accumulates somatic mtDNA deletions faster during normal ageing.
          Candidate explanations - a lower heteroplasmy threshold, a faster deletion generation rate,
          more permissive clonal expansion, lower mitophagy efficiency, or fibre-type-specific mitochondrial
          fusion dynamics - have not been discriminated. This matters because the tissue-selectivity,
          not the enzymology, is what makes PEO a distinct clinical entity from the other POLG phenotypes
          carrying the same alleles.
        proposed_experiments:
        - experiment_id: peob1_single_fibre_threshold_mapping
          name: Single-fibre heteroplasmy threshold mapping across muscle groups
          description: Measure single-fibre mtDNA deletion load and the heteroplasmy threshold for COX
            negativity in extraocular, levator palpebrae and limb muscle from the same POLG-mutant donor,
            to test whether extraocular selectivity reflects a lower threshold or a faster accumulation
            rate.
        - experiment_id: peob1_fibre_type_mitophagy_imaging
          name: Fibre-type-resolved mitophagy and mitochondrial dynamics imaging
          description: Compare mitophagy flux and mitochondrial fusion/fission dynamics across fibre types
            in human extraocular versus limb muscle, to test the quality-control-capacity explanation
            for selective vulnerability.
      selected_evidence:
        snippet: Therefore, our results showing that type IIB fibers in EOMs are affected earlier and
          more extensively (see Figs. 3A, 3B, 3E), suggest that these fibers might either have a faster
          rate of mitochondrial DNA deletion accumulation, clonal expansion, or a lower threshold compared
          to the other fiber types.
        supports: SUPPORT
