        biological_scale: MOLECULAR
        description: 'Reduced polymerase gamma activity slows and destabilises mtDNA replication. Stalled
          or aborted replication forks are resolved by illegitimate recombination or slipped-strand mispairing
          between the direct repeats that flank the mitochondrial major arc, generating large-scale deletions;
          the simultaneous shortfall in completed replication events lowers mtDNA copy number (depletion)
          in the most replication-demanding tissues.

          '
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
