            id: GO:0032042
            label: mitochondrial DNA metabolic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: The reduction in polymerase activity explains the presence of multiple pathogenic large-scale
          deletions in the patient's mtDNA.
        supports: SUPPORT
