      assertion_type: Pathophysiology
      assertion:
        name: Selective Extraocular and Levator Muscle Vulnerability
        biological_scale: TISSUE
        description: 'Extraocular muscles are the earliest and most severely affected tissue in all forms
          of PEO. They are tonically active with the fastest shortening velocities and highest firing
          rates of any skeletal muscle, they carry a mitochondrial content several-fold higher than limb
          muscle, and - critically - they show a lower mtDNA mutational threshold for COX deficiency together
          with a higher rate of somatic mtDNA deletion accumulation than limb muscle. The levator palpebrae
          superioris shares this vulnerability, which is why ptosis is typically the first sign. The reason
          this selective vulnerability exists is still only partly explained.

          '
        locations:
        - preferred_term: extra-ocular muscle
          term:
            id: UBERON:0001601
            label: extra-ocular muscle
