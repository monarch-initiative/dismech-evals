                recessive 1
        context:
        - path: /pathophysiology/2
          value:
            name: Multiple Large-Scale mtDNA Deletions and Depletion
            biological_scale: MOLECULAR
            description: 'The molecular hallmark of PEOB1 is the accumulation, in post-mitotic tissue
              (especially skeletal and extraocular muscle), of multiple different large-scale mtDNA deletions,
              frequently accompanied by a variable degree of mtDNA depletion. Unlike the single, clonal,
              sporadic deletion of Kearns-Sayre syndrome, these deletions are heterogeneous in breakpoint
              and are generated continuously throughout life because the nuclear replication defect persists.
              Deep sequencing of muscle mtDNA in arPEO allows the rearrangements to be mapped and their
              load quantified.

              '
            locations:
            - preferred_term: skeletal muscle tissue
              term:
                id: UBERON:0001134
                label: skeletal muscle tissue
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Valproate-Precipitated Hepatic Decompensation
        description: 'Reduced hepatic mtDNA maintenance capacity is the susceptible background on which
          valproate exposure precipitates hepatotoxicity: the liver''s regenerative response to the drug
          requires mtDNA replication that a POLG-deficient hepatocyte cannot deliver. The edge is conditional
          on drug exposure, so it is indirect rather than an obligate consequence of the genotype.'
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - Therapeutic valproic acid or sodium divalproate exposure (usually prescribed for POLG-related
          epilepsy before the genetic diagnosis is known)
        - Valproate-induced inhibition of hepatocyte proliferation and regeneration
      selected_evidence:
        snippet: AHS is a neurometabolic disorder associated with an increased risk of developing fatal
          VPA hepatotoxicity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2/downstream/2
      evidence_path: /pathophysiology/2/downstream/2/evidence/0
      context_paths:
