      assertion_type: Pathophysiology
      assertion:
        name: Valproate-Precipitated Hepatic Decompensation
        biological_scale: ORGANISM
        description: 'Exposure to valproic acid on a POLG-deficient background can precipitate or accelerate
          hepatotoxicity and fulminant liver failure. This is a gene-drug interaction rather than a spontaneous
          feature of PEOB1: valproate impairs hepatocyte proliferation and regeneration, which a liver
          already limited by defective mtDNA maintenance cannot compensate for. It is the single most
          important actionable contraindication in the POLG-related disorders and is most often encountered
          when valproate is chosen to treat POLG-related epilepsy before the genetic diagnosis is known.

          '
        triggers:
        - preferred_term: valproic acid exposure
          term:
            id: CHEBI:39867
            label: valproic acid
      selected_evidence:
        snippet: Heterozygous genetic variation in POLG was strongly associated with VPA-induced liver
          toxicity
        supports: SUPPORT
