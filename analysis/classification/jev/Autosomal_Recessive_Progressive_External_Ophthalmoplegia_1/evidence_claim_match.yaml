      assertion_type: Discussion
      assertion:
        discussion_id: peob1_compound_heterozygote_dominant_negative
        prompt: Is the excess severity of p.A467T/p.W748S compound heterozygotes a true dominant-negative
          interaction between the two mutant Pol-gamma-A subunits, or simply the additive effect of two
          partially-overlapping catalytic defects?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#POLG Catalytic and Proofreading Deficiency
        rationale: Compound heterozygotes have significantly shorter survival than homozygotes for either
          allele, which is not what a simple additive loss-of-function model predicts. A dominant-negative
          mechanism was proposed but has not been tested biochemically - Pol gamma functions as a heterotrimer,
          so a poisoned-complex model is plausible but unproven. Resolving this would change how compound-heterozygote
          prognosis is counselled.
        proposed_experiments:
        - experiment_id: peob1_mixed_subunit_polgamma_reconstitution
          name: Mixed-subunit Pol gamma reconstitution assay
          description: Reconstitute heterotrimeric Pol gamma with mixed A467T and W748S catalytic subunits
            in vitro and compare polymerase activity and processivity against each homomeric mutant, to
            test for a poisoned-complex (dominant-negative) effect.
        - experiment_id: peob1_genotype_stratified_deletion_load
          name: Genotype-stratified muscle mtDNA deletion load comparison
          description: Compare mtDNA deletion load and copy number in matched skeletal muscle from compound-heterozygote
            versus homozygote patients.
      selected_evidence:
        snippet: Compound heterozygotes have a significantly more severe phenotype raising the possibility
          of a dominant negative effect.
        supports: SUPPORT
