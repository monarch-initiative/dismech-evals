        context: []
      assertion_type: Treatment
      assertion:
        name: Ptosis Surgery (Levator Advancement or Frontalis Suspension)
        description: 'Surgical correction is the mainstay of symptomatic treatment for the ptosis of PEOB1,
          chosen according to levator excursion: levator advancement or resection where levator function
          is preserved, frontalis suspension (sling) where it is not. Myogenic ptosis is a particularly
          difficult surgical target because the ptosis continues to worsen and because the same mitochondrial
          myopathy impairs protective corneal mechanisms (Bell''s phenomenon, orbicularis closure). Deliberate
          under-correction is therefore standard - enough to clear the visual axis without producing exposure
          keratopathy - at the cost of a high recurrence rate.

          '
        treatment_term:
          preferred_term: Ophthalmologic Surgical Procedure
          term:
            id: NCIT:C15331
            label: Ophthalmologic Surgical Procedure
