              recessive 1
            term:
              id: MONDO:0009783
              label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
                recessive 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: peob1_genotype_phenotype_modifier_gap
        prompt: What determines whether a given recessive POLG genotype - most starkly, p.A467T homozygosity
          - presents as late-onset PEO rather than as Alpers-Huttenlocher syndrome or MIRAS?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#POLG Catalytic and Proofreading Deficiency
        rationale: 68 p.A467T homozygotes across eight centres span essentially the entire POLG phenotypic
          spectrum, and clinical presentation clusters within sibships, implying heritable modifiers.
          Yet a genome-directed search within POLG and its flanking regulatory regions, and in POLG2,
          TWNK/PEO1 and ANT1, found no correlating nuclear variant. The only signal identified was mitochondrial
          DNA haplogroup U, which was protective against epilepsy. So the modifiers that decide a PEO
          versus an Alpers presentation remain unidentified, and this is the central unsolved problem
          of POLG nosology - it is also why PEOB1 cannot be predicted from genotype alone.
        proposed_experiments:
        - experiment_id: peob1_genome_wide_modifier_scan
          name: Genome-wide modifier scan in phenotype-discordant POLG homozygotes
          description: Run an unbiased genome-wide (rather than candidate-gene) modifier scan in large
            sibship-matched cohorts of p.A467T homozygotes stratified by presentation (PEO versus Alpers
            versus ataxia-neuropathy).
        - experiment_id: peob1_tissue_mtdna_copy_number_profiling
          name: Tissue-resolved mtDNA copy number and deletion-load profiling
          description: Profile tissue-specific mtDNA copy number and deletion load across presentations
            to test whether the phenotype tracks a quantitative replication-capacity threshold rather
            than a discrete modifier allele.
      selected_evidence:
        snippet: Interestingly, the clinical presentation was similar in siblings, implying a genetic
          basis for the phenotypic variability amongst homozygotes. However, the p.Ala467Thr allele was
          present on a shared haplotype in each affected individual, and there was no correlation between
          the clinical presentation and genetic variants in any of the analysed nuclear genes.
        supports: SUPPORT
