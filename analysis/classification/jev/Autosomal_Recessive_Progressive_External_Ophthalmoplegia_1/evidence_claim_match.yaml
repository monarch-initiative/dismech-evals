            label: mitochondrion
        molecular_functions:
        - preferred_term: DNA-directed DNA polymerase activity
          term:
            id: GO:0003887
            label: DNA-directed DNA polymerase activity
          modifier: DECREASED
        - preferred_term: 3'-5' exonuclease (proofreading) activity
          term:
            id: GO:0008408
            label: 3'-5' exonuclease activity
          modifier: DECREASED
      selected_evidence:
        snippet: Biochemical characterization revealed that the novel F197S mutant protein had reduced
          exonuclease and DNA polymerase activities and confirmed that T914P was inactive.
        supports: SUPPORT
