      assertion:
        name: Deoxynucleoside (dC/dT) Substrate Supplementation
        description: 'Investigational, not standard of care. Enteral deoxycytidine plus deoxythymidine
          (dC/dT) aims to replenish the mitochondrial dNTP pool and so partially compensate for the reduced
          replication capacity of mutant polymerase gamma - the only curated treatment here that targets
          the causal mechanism rather than the consequences. An open-label single-arm phase 2 trial (NCT04802707)
          in POLG-related disorders reported improvement in the Newcastle Mitochondrial Disease Scale
          and stable-or-falling GDF-15 at 6 months. Important scope caveat for PEOB1: the interim cohort
          was children, six of ten with Alpers-Huttenlocher syndrome and two with ataxia-neuropathy spectrum,
          so efficacy in adult-onset recessive PEO specifically is untested.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
