  59059a34717a248db9a1f0ef2d78337ed4ac88a93c85386352d0f95ce5a1a47f:
    claim:
      about:
        disease:
          name: Autosomal Recessive Progressive External Ophthalmoplegia 1
          disease_term:
            preferred_term: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
              recessive 1
            term:
              id: MONDO:0009783
              label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
                recessive 1
        context: []
      assertion_type: Genetic
      assertion:
        name: POLG
        gene_term:
          preferred_term: POLG
          term:
            id: hgnc:9179
            label: POLG
        relationship_type: CAUSATIVE
        association: Biallelic pathogenic variants in POLG, encoding the catalytic A subunit of mitochondrial
          DNA polymerase gamma, cause autosomal recessive progressive external ophthalmoplegia 1 by impairing
          mtDNA replication and producing multiple large-scale mtDNA deletions with variable mtDNA depletion.
          POLG is also the commonest identified nuclear cause of the multiple-mtDNA-deletion molecular
          phenotype irrespective of clinical presentation.
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
          description: PEOB1 requires two pathogenic POLG alleles - most often compound heterozygosity
            for one of the common European founder alleles (p.A467T, p.W748S) plus a second, frequently
            polymerase-domain, variant. Heterozygous carriers are typically asymptomatic for PEO, although
            carrier status is itself a risk factor for valproate hepatotoxicity. This recessive requirement
            is what separates PEOB1 from its autosomal dominant sibling PEOA1, in which a single heterozygous
            POLG variant (classically p.Y955C in polymerase motif B) suffices.
        variants:
        - name: p.Ala467Thr (c.1399G>A)
          description: 'The most frequent recessive POLG allele in populations of European descent. It
            lies in the linker domain and acts through two distinct defects: the purified enzyme retains
            only ~4% of wild-type polymerase activity (a ~6-fold fall in kcat with essentially intact
            exonuclease function), and it fails entirely to bind and be stimulated by the POLG2 accessory
            subunit, so processivity collapses. It is carried by essentially all patients in the original
            Belgian recessive PEO cohort and occurs at a frequency of 0.6% in the Belgian population.
            Homozygotes span the entire POLG phenotypic continuum from Alpers-Huttenlocher to adult sensory
            ataxic neuropathy with ophthalmoparesis, so genotype alone does not predict presentation.

            '
          clinical_significance: PATHOGENIC
        - name: p.Trp748Ser (c.2243G>C)
          description: 'The second common recessive European founder allele, almost always carried in
            cis with p.Glu1143Gly. It is the commonest cause of mitochondrial recessive ataxia syndrome
            (MIRAS) and, in compound heterozygosity with p.A467T or a polymerase-domain variant, contributes
            to the recessive PEO/ataxia-neuropathy end of the spectrum. Haplotype analysis shows a single
            ancient European founder chromosome shared across Finland, Norway, the UK and Belgium; the
            carrier frequency reaches 1 in 125 in Finland.

            '
          clinical_significance: PATHOGENIC
        - name: Compound heterozygosity for p.Ala467Thr and p.Trp748Ser
          description: 'Trans-compound heterozygosity for the two common founder alleles is a recurrent
            recessive genotype. In a 26-patient series, compound heterozygotes had significantly shorter
            survival than homozygotes for either allele, raising the possibility of a dominant-negative
            interaction between the two mutant subunits rather than simple additive loss of function.

            '
          clinical_significance: PATHOGENIC
        - name: Exonuclease-domain and polymerase-domain variants in trans (p.Phe197Ser / p.Thr914Pro)
          description: 'A worked late-onset arPEO genotype illustrating the general recessive architecture:
            one allele carries a novel exonuclease-domain variant (c.590T>C; p.F197S) with reduced exonuclease
            AND polymerase activity, while the other carries a catalytically inactive polymerase-domain
            null (c.2740A>C; p.T914P). Residual activity is supplied entirely by the hypomorphic allele,
            and the resulting replication deficit produces the multiple large-scale mtDNA deletions found
            in the patient''s muscle.

            '
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Progressive external ophthalmoplegias (PEO) characterized by accumulation of large-scale
          mitochondrial DNA (mtDNA) deletions are rare human diseases.
        supports: SUPPORT
