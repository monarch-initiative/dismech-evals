                recessive 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Clonal Expansion Above the Biochemical Threshold
        biological_scale: CELLULAR
        description: 'Deleted mtDNA genomes are shorter and are amplified preferentially within individual
          long-lived post-mitotic cells (muscle fibre segments, neurons). Because mtDNA is polyploid,
          a cell remains biochemically normal until the mutant fraction crosses a threshold, after which
          mtDNA-encoded respiratory chain subunits become limiting. This threshold effect explains the
          characteristic mosaic (fibre-to-fibre) pattern of the defect rather than a uniform tissue-wide
          deficiency.

          '
        cell_types:
        - preferred_term: skeletal muscle fiber
