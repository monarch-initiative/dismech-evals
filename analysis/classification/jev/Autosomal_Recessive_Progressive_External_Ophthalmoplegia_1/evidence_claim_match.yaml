              label: progressive external ophthalmoplegia with mitochondrial DNA deletions, autosomal
                recessive 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Avoidance of Valproic Acid (Contraindicated)
        description: 'Valproic acid (Depakene) and sodium divalproate/divalproex (Depakote) must be avoided
          in all POLG-related disorders, including PEOB1, because they can precipitate or accelerate liver
          disease and fatal hepatic failure. This is not a theoretical caution: in a 26-patient recessive
          POLG cohort, liver failure caused or contributed to death in eight patients, all but one of
          whom were on valproate. The risk is genotype-driven and detectable prospectively, so POLG genotyping
          should precede valproate in anyone with a suspected mitochondrial or unexplained epilepsy phenotype.
          This record is curated with negative valence - the intervention is withholding the drug, not
          administering it.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: valproic acid
            term:
              id: CHEBI:39867
              label: valproic acid
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: because of the risk of precipitating and/or accelerating liver disease
        supports: SUPPORT
