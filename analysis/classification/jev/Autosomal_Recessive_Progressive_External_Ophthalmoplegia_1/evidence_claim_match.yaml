      assertion:
        name: Mosaic Respiratory-Chain (OXPHOS) Deficiency
        biological_scale: CELLULAR
        description: 'Loss of intact mtDNA templates reduces the supply of the thirteen mtDNA-encoded
          respiratory-chain polypeptides. Complex IV (cytochrome c oxidase) is the most sensitive readout
          because three of its catalytic subunits are mtDNA-encoded and none are supplied by the nuclear
          genome, so affected cells become COX-negative on histochemistry while succinate dehydrogenase
          (entirely nuclear-encoded, complex II) is preserved or upregulated. The bioenergetic deficit
          affects the most oxidative, highest-demand post-mitotic cells first.

          '
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
