              label: autosomal recessive Robinow syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Prenatal Recognition
        description: Recognizable on second-trimester ultrasound, where macrocephaly, a flat face with
          frontal bossing, mesomelic shortening, hemivertebrae and micropenis cluster; molecular confirmation
          is then possible on amniocytes. This matters because the recessive form is the severe one and
          recurrence risk in an affected family is 25%.
        diagnosis_term:
          preferred_term: prenatal ultrasonography
          term:
            id: NCIT:C17369
            label: Imaging Procedure
      selected_evidence:
        snippet: Fetal trio whole exome sequencing done on amniocytes showed two pathogenic compound heterozygous
          variants in the ROR2 gene
        supports: SUPPORT
