        context: []
      assertion_type: Genetic
      assertion:
        name: ROR2
        gene_term:
          preferred_term: ROR2
          term:
            id: hgnc:10257
            label: ROR2
        relationship_type: CAUSATIVE
        notes: ROR2 encodes a noncanonical WNT5A coreceptor. Homozygous and compound-heterozygous genotypes
          occur, including missense, nonsense, frameshift, splice, initiation-codon and deletion alleles.
          The 2022 study included variants classified as uncertain significance by its automated ACMG
          assessment, so its putative disease-associated set should not be equated with uniformly established
          pathogenicity. Protein trafficking and stability, rather than position alone, help distinguish
          Robinow and brachydactyly phenotypes.
      selected_evidence:
        snippet: We identified 25 putatively pathogenic ROR2 variants, 16 novel, including single nucleotide
          variants and exonic deletions.
        supports: SUPPORT
