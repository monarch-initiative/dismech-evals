        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of WNT5A/ROR2 Planar Cell Polarity Signalling
        role: central_effector
        biological_scale: CELLULAR
        description: WNT5A is the soluble ligand of ROR2; together with the FZD2 transmembrane receptor
          they trigger the Dishevelled proteins to transduce the beta-catenin-independent signal. Losing
          the receptor removes the input to that cascade. PCP signalling orients cells within the plane
          of a tissue and drives the polarized behaviour on which axial elongation, limb outgrowth, midline
          fusion and genital tubercle formation depend.
        biological_processes:
        - preferred_term: non-canonical Wnt signaling pathway
          modifier: DECREASED
          term:
            id: GO:0035567
            label: non-canonical Wnt signaling pathway
        - preferred_term: Wnt signaling pathway, planar cell polarity pathway
          modifier: DECREASED
          term:
            id: GO:0060071
            label: Wnt signaling pathway, planar cell polarity pathway
      selected_evidence:
        snippet: WNT5A acts as a soluble extracellular ligand of ROR2; and together with FZD2 transmembrane
          receptor they trigger the DVL homologs to transduce the β-catenin independent pathway.
        supports: SUPPORT
