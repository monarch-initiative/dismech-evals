        biological_scale: CELLULAR
        description: ROR2 promotes Frizzled-dependent noncanonical WNT5A signaling. In an immortalized
          Ror1/Ror2-deficient mouse-fibroblast rescue system, Robinow-associated variants reduced GFP-Pdzrn3
          reporter degradation and DVL2 phosphorylation to different degrees. The cysteine-rich domain
