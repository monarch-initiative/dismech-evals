      assertion_type: Pathophysiology
      assertion:
        name: Biallelic ROR2 Loss of Function
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: ROR2
          term:
            id: hgnc:10257
            label: ROR2
        genetic_context:
          gene:
            preferred_term: ROR2
            term:
              id: hgnc:10257
              label: ROR2
          allele_type: missense, nonsense, frameshift, or whole-exon deletion
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        description: Two routes to one endpoint. Truncating alleles predict nonfunctional protein and
          their transcripts are degraded by nonsense-mediated decay; missense alleles produce protein
          retained in the endoplasmic reticulum that never reaches the surface. Both converge on absence
          of the ROR2 receptor. Exonic deletions, which have no gain-of-function reading available to
          them, corroborate loss of function.
        molecular_functions:
        - preferred_term: ROR2 co-receptor engagement of WNT5A
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005109
            label: frizzled binding
      selected_evidence:
        snippet: While truncating variant mRNAs are degraded by nonsense-mediated decay (Ben-Shachar et
          al. 2009), mutant protein caused by missense variants are retained in the endoplasmic reticulum
          and ultimately lead to the absence of the ROR2 receptor
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
