        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Presomitic Mesoderm and Defective Somitogenesis
        role: consequence
        biological_scale: TISSUE
        description: In the Ror2-null mouse, vertebral malformations trace to a reduced presomitic mesoderm
          and consequent defects in somitogenesis — not to a secondary effect of limb shortening. Because
          the vertebral column and ribs are segmented from that mesoderm, this is the developmental origin
          of the hemivertebrae and rib fusions that mark the recessive form.
        biological_processes:
        - preferred_term: somitogenesis
          modifier: DECREASED
          term:
            id: GO:0001756
            label: somitogenesis
      selected_evidence:
        snippet: Our results demonstrate that vertebral malformations in Ror2(-/-) mice are due to reductions
          in the presomitic mesoderm and defects in somitogenesis.
        supports: SUPPORT
