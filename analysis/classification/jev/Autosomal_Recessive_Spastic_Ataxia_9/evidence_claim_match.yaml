        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CHP1 Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        description: 'Biallelic hypomorphic variants in CHP1 (15q15.1) reduce the pool of functional calcineurin-like
          EF-hand protein 1. Two human alleles are known: an in-frame 3-bp deletion p.Lys19del in the
          index family and a missense p.Arg91Cys in the second family. Neither lies within an EF-hand
          calcium-binding motif, so the primary defect is protein destabilization and depletion rather
          than loss of calcium binding per se. The mouse vacillator allele is a splice-affecting point
          mutation that likewise reduces CHP1 protein.

          '
        genes:
        - preferred_term: CHP1
          term:
            id: hgnc:17433
            label: CHP1
        molecular_functions:
        - preferred_term: calcium ion binding
          term:
            id: GO:0005509
            label: calcium ion binding
      selected_evidence:
        snippet: Among them, we focused on a homozygous missense variant, p.Arg91Cys (c.271C > T), in
          CHP1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
