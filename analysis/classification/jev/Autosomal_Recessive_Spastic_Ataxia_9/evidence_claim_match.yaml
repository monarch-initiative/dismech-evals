            term:
              id: MONDO:0032753
              label: spastic ataxia 9, autosomal recessive
        context: []
      assertion_type: Genetic
      assertion:
        name: CHP1
        notes: 'CHP1 (calcineurin like EF-hand protein 1) at 15q15.1 encodes an EF-hand calcium-binding
          protein that is an obligate cofactor of the Na+/H+ exchanger NHE1. Only two disease-causing
          alleles are known, both homozygous in consanguineous families: an in-frame single-codon deletion
          (p.Lys19del) and a missense change (p.Arg91Cys). Neither lies within an EF-hand motif. Focused
          screening of 319 ARCA and 657 NeurOmics exomes plus GeneMatcher yielded no further variants,
          establishing how rare CHP1 disease alleles are.

          '
        gene_term:
          preferred_term: CHP1
          term:
            id: hgnc:17433
            label: CHP1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: CHP1 c.52_54del (p.Lys19del)
          description: 'Homozygous in-frame 3-bp deletion identified in two affected siblings of a consanguineous
            Moroccan family; absent from public databases and affecting a residue highly conserved across
            CHP1 orthologs. In cells the mutant protein fails to enter functional complexes, aggregates,
            and reduces NHE1 membrane targeting.

            '
          type: inframe_deletion
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
        - name: CHP1 c.271C>T (p.Arg91Cys)
          description: 'Homozygous missense variant in two Japanese siblings with middle-age-onset ataxia
            and cognitive decline; absent from public databases, CADD 32.0, classified likely pathogenic
            by ACMG criteria. Associated with incomplete (not complete) CHP1 depletion in brain, the leading
            explanation for the milder, later-onset phenotype.

            '
          type: missense
          clinical_significance: LIKELY_PATHOGENIC
          regulatory_category: LOF
      selected_evidence:
        snippet: 'Neither focused screening for CHP1 variants in 2 cohorts (ARCA: N = 319 and NeurOmics:
          N = 657) nor interrogating GeneMatcher yielded additional variants, thus revealing the scarcity
          of CHP1 mutations.'
        supports: SUPPORT
