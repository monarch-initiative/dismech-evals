              label: spastic ataxia 9, autosomal recessive
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chp1_pyramidal_substrate
        kind: KNOWLEDGE_GAP
        prompt: 'What is the anatomical substrate of the pyramidal signs in SPAX9, given that the only
          autopsied patients had pyramidal signs but no demonstrated corticospinal pathology?

          '
        rationale: 'Pyramidal involvement is what makes SPAX9 a spastic rather than a pure cerebellar
          ataxia: spastic paraparesis in the childhood-onset family, and Babinski signs tabulated in all
          four reported patients. Yet the neuropathological study of the two p.Arg91Cys siblings — who
          had pyramidal signs themselves — localized the degeneration to the cerebellum and the dorsal
          column pathway, described only gracile fasciculus fiber loss in the spinal cord, and explicitly
          found no neuronal loss or gliosis anywhere in the brainstem or cerebrum outside layers II-III
          of the frontal cortex. No corticospinal tract degeneration and no motor cortex involvement is
          reported anywhere in either paper, and the family with the most prominent pyramidal phenotype
          has never come to autopsy. The pyramidal phenotypes are therefore left unconnected in the pathograph
          on purpose: the entry has no CHP1-dependent corticospinal lesion to attach them to, and inferring
          one from the bedside signs would assert a mechanism neither source contains.

          '
        attaches_to:
        - phenotypes#Spastic paraparesis
        - phenotypes#Babinski sign
        - phenotypes#Abnormal pyramidal sign
        - phenotypes#Hyperreflexia
        proposed_experiments:
        - experiment_id: chp1_corticospinal_assessment
          name: Targeted corticospinal assessment in CHP1 patients and models
          description: 'Examine the lateral corticospinal tracts at every spinal level and Betz cells
            in primary motor cortex in any future CHP1 autopsy; in living patients pair motor evoked potentials
            with diffusion imaging of the corticospinal tract; and trace the corticospinal projection
            in a CHP1 knock-in mouse, to establish whether the pyramidal signs reflect a corticospinal
            lesion or a cerebellar contribution to tone and reflexes.

            '
      selected_evidence:
        snippet: The histopathologic features of the nervous system in patients 1 and 2 were quite similar,
          being characterized by marked degeneration of the cerebellum and dorsal column pathway.
        supports: SUPPORT
