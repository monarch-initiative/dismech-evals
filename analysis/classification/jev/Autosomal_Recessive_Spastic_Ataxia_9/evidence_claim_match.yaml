      assertion_type: Discussion
      assertion:
        discussion_id: chp1_unautopsied_extracerebellar_features
        kind: KNOWLEDGE_GAP
        prompt: 'What accounts for the slow ocular saccades, intellectual disability, and growth retardation
          of the childhood-onset family, none of which has an established substrate in SPAX9?

          '
        rationale: 'All three features are reported only in the p.Lys19del family, which has never come
          to autopsy. In the family that was autopsied, the brainstem — which contains the burst-neuron
          circuitry that generates saccades — was explicitly free of neuronal loss and gliosis, so the
          usual brainstem explanation for slow saccades cannot simply be carried over to SPAX9. The childhood
          intellectual disability is equally unaccounted for: the frontal cortical neuronal loss found
          at autopsy was an acquired lesion in adults with cognitive decline, not a developmental one,
          and whether the vermian hypoplasia imaged in the childhood-onset family contributes to cognition
          has not been tested. No mechanism at all has been proposed for the growth retardation, and the
          Chp1 mouse and chp1 zebrafish were phenotyped on motor and cerebellar endpoints only. These
          phenotypes are left unconnected rather than attached to a plausible-sounding node.

          '
        attaches_to:
        - phenotypes#Slow saccadic eye movements
        - phenotypes#Intellectual disability
        - phenotypes#Growth delay
        proposed_experiments:
        - experiment_id: chp1_developmental_phenotyping
          name: Developmental and oculomotor phenotyping of a CHP1 knock-in model
          description: 'Phenotype a p.Lys19del knock-in mouse for growth curves, cognitive performance,
            and brainstem oculomotor structures, with quantitative oculography in any living CHP1 patient,
            to establish whether these features are CHP1-dependent and where they arise.

            '
      selected_evidence:
        snippet: No neuronal loss or focal gliosis was observed in the other regions of the brainstem
          and cerebrum, except for moderate neuronal loss (Fig. 1g) and gliosis (Fig. 1h) in layers II
          and III of the frontal cortex.
        supports: SUPPORT
