            term:
              id: MONDO:0032753
              label: spastic ataxia 9, autosomal recessive
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chp1_calcium_vs_stability
        kind: KNOWLEDGE_GAP
        prompt: 'Do the human CHP1 disease alleles act purely by destabilizing the protein, or do they
          also perturb the calcium-dependent CHP1-NHE1 interaction?

          '
        rationale: 'Neither p.Lys19del nor p.Arg91Cys lies in an EF-hand calcium-binding motif, which
          argues against a direct effect on calcium-dependent binding — but this reasoning is inferential.
          Biophysical work shows that calcium modulates CHP1 conformation and its interaction with the
          NHE1 CHP-binding domain, so a calcium-independent destabilization mechanism cannot be assumed
          without measuring the mutant proteins directly. Which mechanism applies matters for whether
