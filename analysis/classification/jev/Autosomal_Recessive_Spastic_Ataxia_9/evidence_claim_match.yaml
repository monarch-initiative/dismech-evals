            term:
              id: MONDO:0032753
              label: spastic ataxia 9, autosomal recessive
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chp1_hearing_loss_mechanism
        kind: KNOWLEDGE_GAP
        prompt: 'Is the hearing loss of the p.Arg91Cys siblings a CHP1-dependent feature, given that the
          discovery authors predicted CHP1 patients would be protected from deafness?

          '
        rationale: 'Biallelic SLC9A1/NHE1 loss of function causes ataxia with sensorineural hearing loss
          (Lichtenstein-Knorr syndrome), which makes auditory involvement look mechanistically plausible
          on the CHP1-NHE1 axis. The CHP1 discovery authors predicted the opposite: that the residual
          NHE1 left by a hypomorphic CHP1 allele is enough to protect patients from the deafness and epilepsy
          of NHE1 disease, noting that neither the Chp1 nor the Nhe1 mouse is deaf. The later-onset family
          then reported hearing loss in both siblings, contradicting that prediction — while the childhood-onset
          family, which carries the more severely destabilizing allele, had no hearing loss, which is
          the wrong way round for a simple NHE1-dose model. Neither report characterizes the hearing loss
          audiometrically or distinguishes sensorineural from conductive, no CHP1 model has an auditory
          endpoint, and both affected siblings were in their late sixties or seventies at death (onset
          at 30 and 56 with disease durations of 36 and 20 years), so age-related hearing loss is not
          excluded. No causal edge is drawn to this phenotype for those reasons.

          '
        attaches_to:
        - phenotypes#Hearing impairment
        proposed_experiments:
        - experiment_id: chp1_auditory_phenotyping
          name: Auditory phenotyping across the CHP1 allelic series
          description: 'Measure auditory brainstem responses and cochlear NHE1 expression in Chp1 hypomorphic
            and Nhe1-deficient mice, and obtain age-matched audiometry in any newly ascertained CHP1 patient,
            to test whether hearing loss tracks residual NHE1 rather than age.

            '
      selected_evidence:
        snippet: In contrast to the CHP1-deficient associated phenotype, NHE1 deficiency was presumptively
          associated with hearing loss, despite that neither Nhe1 nor Chp1 models presented deafness.
        supports: SUPPORT
