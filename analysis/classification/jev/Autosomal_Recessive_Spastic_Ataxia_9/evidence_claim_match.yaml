      assertion_type: Pathophysiology
      assertion:
        name: Impaired NHE1 Biosynthetic Maturation and Membrane Targeting
        biological_scale: MOLECULAR
        role: central_effector
        description: 'CHP1 is an obligate binding partner of the Na+/H+ exchanger NHE1 (SLC9A1) that promotes
          its biosynthetic maturation, full glycosylation, cell-surface expression, and pH sensitivity.
          With CHP1 depleted, NHE1 fails to mature and its delivery to the plasma membrane — including
          to presynaptic axon terminals — falls. Cryo-EM structures of the human NHE1-CHP1 complex show
          NHE1 as a symmetrical homodimer with CHP1 associating differentially with the inward- and outward-facing
          states, providing the structural basis for CHP1-dependent regulation.

          '
        genes:
        - preferred_term: SLC9A1
          term:
            id: hgnc:11071
            label: SLC9A1
        molecular_functions:
        - preferred_term: sodium:proton antiporter activity
          term:
            id: GO:0015385
            label: sodium:proton antiporter activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: protein maturation
          term:
            id: GO:0051604
            label: protein maturation
          modifier: DECREASED
        - preferred_term: protein N-linked glycosylation
          term:
            id: GO:0006487
            label: protein N-linked glycosylation
          modifier: DECREASED
        - preferred_term: protein localization to plasma membrane
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
          modifier: DECREASED
        pdb_structures:
        - pdb_id: 7DSW
          target_protein: Human NHE1-CHP1 complex
          method: cryo-EM
          description: Inward-facing human NHE1-CHP1 complex determined at pH 7.5 in sodium.
          publication: PMID:34108458
        - pdb_id: 7DSX
          target_protein: Human NHE1-CHP1 complex
          method: cryo-EM
          ligand: cariporide
          description: Outward-facing human NHE1-CHP1 complex bound to the NHE1 inhibitor cariporide.
          publication: PMID:34108458
      selected_evidence:
        snippet: Calcineurin B-homologous protein 1 (CHP1) is an obligate binding partner that promotes
          NHE1 biosynthetic maturation, cell surface expression and pH-sensitivity.
        supports: SUPPORT
