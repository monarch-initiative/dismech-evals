  d278dcc37ad8b368bb8e057e0ea007b4322b1228de49b0a788460e6a692608e5:
    claim:
      about:
        disease:
          name: Autosomal Recessive Spastic Ataxia 9
          disease_term:
            preferred_term: spastic ataxia 9, autosomal recessive
            term:
              id: MONDO:0032753
              label: spastic ataxia 9, autosomal recessive
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of CHP1 Complex Assembly and Protein Aggregation
        biological_scale: MOLECULAR
        description: 'Mutant CHP1 fails to incorporate into functional protein complexes and is prone
          to aggregation, so the soluble CHP1 pool falls. In patient brain carrying p.Arg91Cys, CHP1 immunoreactivity
          was lost from Purkinje cells and frontal cortical neurons and CHP1 protein was reduced by 80%
          in cerebellum and 60% in frontal cortex.

          '
        biological_processes:
        - preferred_term: protein-containing complex assembly
          term:
            id: GO:0065003
            label: protein-containing complex assembly
          modifier: DECREASED
        notes: 'Aggregates of mutant CHP1 colocalize with ubiquitin and p62, indicating recognition by
          neuronal protein quality-control systems. The authors explicitly caution that this aggregation
          is a readout of misfolding rather than a proteotoxic disease mechanism, so this node is modeled
          as loss of functional soluble CHP1, not as a proteinopathy.

          '
      selected_evidence:
        snippet: Indeed, immunoblot analysis revealed that expression of CHP1 protein in the patients
          was reduced in the cerebellum by 80% and in the frontal cortex by 60% relative to the controls.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32787936
      reference_title: 'Novel CHP1 mutation in autosomal-recessive cerebellar ataxia: autopsy features
        of two siblings.'
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies CHP1 depletion in autopsied human brain carrying the p.Arg91Cys allele.
