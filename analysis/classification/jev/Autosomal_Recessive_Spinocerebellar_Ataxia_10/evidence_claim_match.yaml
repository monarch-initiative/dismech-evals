          term:
            id: hgnc:25519
            label: ANO10
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Over 40 SCAR10-associated variants are reported (NM_018075.5), more than 80% loss-of-function.
          Recurrent alleles: c.1150_1151del (p.Leu384fs), a Romani founder allele found homozygous in
          all Romani patients and associated with earlier onset and intellectual decline; c.132dupA (p.Asp45Argfs*9),
          the most frequent allele in the French series and described there as never homozygous, though
          a later sibship was homozygous for it. Missense and splice-altering alleles include p.Leu510Arg
          (the original Dutch family), c.1163-9A>G and p.Met622Val. No ClinGen gene-disease validity record
          for this pair was found in the local cache.'
      selected_evidence:
        snippet: This variant was a leucine-to-arginine substitution in the DUF 590 domain of a 16K transmembrane
          protein, a putative calcium-activated chloride channel encoded by anoctamin 10 (ANO10).
        supports: SUPPORT
