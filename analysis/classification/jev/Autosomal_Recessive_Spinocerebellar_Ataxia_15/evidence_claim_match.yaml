            term:
              id: MONDO:0014311
              label: autosomal recessive spinocerebellar ataxia 15
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RUBCN (Rubicon) Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic truncating variants in RUBCN abolish or truncate Rubicon (rundataxin),
          a protein with an N-terminal RUN domain and a C-terminal diacylglycerol-binding-like / Rubicon
          Homology (RH) domain that assembles with the Beclin-1 / class III PI3K (VPS34) complex. Rubicon''s
          principal function is to negatively regulate macroautophagy (and LC3-associated phagocytosis).
          The recurrent founder allele is an exon 18/19 single-base deletion (c.2624delC / historically
          2927delC; p.Ala875ValfsX146 / p.Ala943ValfsX146) that frameshifts and deletes the C-terminal
          domain.

          '
        biological_processes:
        - preferred_term: negative regulation of macroautophagy
          term:
            id: GO:0010507
            label: negative regulation of autophagy
          modifier: DECREASED
      selected_evidence:
        snippet: The RUBCN gene encodes a widely expressed protein called Rubicon, the main function of
          which is to negatively regulate macroautophagy.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39520129
      reference_title: A second RUBCN variant associated with epileptic encephalopathy and neurodevelopmental
        delay.
      evidence_source: OTHER
      explanation: Background statement of Rubicon's principal molecular function (review/background prose,
