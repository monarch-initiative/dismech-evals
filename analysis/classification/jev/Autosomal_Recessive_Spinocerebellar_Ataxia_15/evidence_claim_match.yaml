        name: Impaired Rubicon Endolysosomal Localization
        biological_scale: CELLULAR
        description: 'Wild-type Rubicon colocalizes with the late-endosome GTPase Rab7 and with the lysosomal
          marker LAMP1. The Salih-ataxia truncation, which removes the diacylglycerol-binding-like / RH
          domain, causes a diffuse cytosolic redistribution and loss of late-endosomal localization, establishing
          pathogenicity and linking the disorder to endosomal/lysosomal machinery rather than to the mitochondrial
          or nuclear pathways of other recessive ataxias.

          '
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: late endosome to lysosome transport
          term:
            id: GO:1902774
            label: late endosome to lysosome transport
          modifier: ABNORMAL
      selected_evidence:
        snippet: We confirm that Rubicon colocalizes with the late endosome marker Rab7 and demonstrate
          that it also colocalizes with LampI at lysosomes.
        supports: SUPPORT
