      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'SCAR15 is inherited in an autosomal recessive manner. It was originally mapped by
          linkage / homozygosity mapping in a consanguineous Saudi Arabian pedigree, with affected individuals
          homozygous for a truncating RUBCN (KIAA0226) frameshift variant that cosegregated with disease;
          unaffected parents are heterozygous carriers. A shared ancient founder haplotype underlies the
          recurrent mutation in the Arabian Peninsula.

          '
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Autozygome and exome analysis showed both affected have previously reported homoallelic
          mutation in RUBCN (NM_014687:exon18:c.2624delC:p.A875fs), whereas the parents are carriers.
        supports: SUPPORT
