              label: autosomal recessive spinocerebellar ataxia 16
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CHIP Destabilization and Aggregation
        description: 'Most SCAR16 variants lower the thermodynamic stability of CHIP. The destabilized
          protein forms soluble oligomers, is turned over faster by the proteasome, and is present at
          reduced steady-state levels in patient cells, so the functional deficit reflects loss of protein
          as well as loss of catalysis. Frank aggregation is not a general property of the allele set:
          of six variants characterized biophysically only p.Thr246Met showed a strong aggregation tendency,
          alongside structural disorganization of its U-box, while the others showed structural defects
          without it.'
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: This destabilization caused mutation-specific defects in CHIP activity, including increased
          formation of soluble oligomers, decreased interactions with chaperones, diminished substrate
          ubiquitination, and reduced steady-state levels in cells.
        supports: SUPPORT
