        modeled_mechanisms:
        - target: Loss of CHIP E3 Ubiquitin Ligase Activity
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: Carries the actual patient allele at the endogenous locus, and the encoded protein
            has no ligase activity while retaining chaperone interactions, matching the biochemistry measured
            for the human variant.
        - target: Progressive Cerebellar Ataxia
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Homozygous animals show motor cerebellar dysfunction together with cognitive and
            learning deficits, matching the ataxia-plus-cognition profile of patients.
          limitations: The paper reports cerebellar motor dysfunction and learning deficits as behavioural
            phenotypes; it does not establish that the progressive cerebellar atrophy or the hypogonadism
            of human SCAR16 is reproduced, and the phenotype is explicitly distinct from the CHIP-null
            animal, so conclusions do not transfer between the two models.
      selected_evidence:
        snippet: To establish preclinical models of SCAR16, we engineered T246M at the endogenous locus
          in both mice and rats.
        supports: SUPPORT
