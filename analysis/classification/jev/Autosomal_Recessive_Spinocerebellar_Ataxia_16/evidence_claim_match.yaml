    claim:
      about:
        disease:
          name: Autosomal Recessive Spinocerebellar Ataxia 16
          disease_term:
            preferred_term: Autosomal recessive spinocerebellar ataxia 16
            term:
              id: MONDO:0014339
              label: autosomal recessive spinocerebellar ataxia 16
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: scar16_heat_shock_response_translational_validity
        kind: HUMAN_MODEL_MISMATCH
        prompt: Is the impaired heat-shock response seen in SCAR16 patient fibroblasts relevant to the
          neurodegeneration, given that patient iPSC-derived cortical neurons do not show it?
        attaches_to:
        - pathophysiology#Failure of Chaperone-Assisted Protein Quality Control
        rationale: Evidence exists in a model system and its translational validity is the open question,
          which is the HUMAN_MODEL_MISMATCH case rather than a plain absence of evidence. Patient fibroblasts
          show impaired heat-shock response induction and recovery, but patient cortical neurons were
          resistant to heat stress with high basal HSP70, and an isogenic CRISPR STUB1 knockout neuron
          line behaved like the patient lines, so the neuronal readout does not separate mutant from null
          from control. The authors themselves question whether impaired heat-shock response has any role
          in SCAR16 neuropathology. Since the disease target tissue is neuronal, the fibroblast finding
          cannot stand as the disease mechanism, and the proteostasis node here rests on the ubiquitination
          and mitophagy evidence rather than on the heat-shock arm.
      selected_evidence:
        snippet: Furthermore, STUB1(-/-) neurons generated by CRISPR/Cas9-mediated genome editing from
          an isogenic healthy control line showed a similar HSR to patients.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
