      assertion_type: Diagnosis
      assertion:
        name: Biallelic STUB1 sequencing with supportive MRI
        description: 'Diagnosis rests on finding two pathogenic STUB1 alleles in a patient with a compatible
          progressive ataxia and cerebellar atrophy on MRI. STUB1 is a conventional non-repeat gene, so
          it is missed by the repeat-expansion panels used first-line in ataxia and must be covered by
          a sequencing panel or exome test; phasing a compound heterozygote can require long-range PCR.
          Because many STUB1 missense alleles are variants of uncertain significance, functional demonstration
          of lost ubiquitin ligase activity is used to establish pathogenicity. Zygosity does not settle
          the diagnosis on its own: a single heterozygous allele indicates the dominant disorder SCA48,
          and one reported patient reached homozygosity through maternal uniparental isodisomy of chromosome
          16 rather than through two carrier parents.'
      selected_evidence:
        snippet: The whole-exome sequencing combined with long-range flanking polymerase chain reaction
          (PCR) were performed in a Chinese SCAR16 patient.
        supports: SUPPORT
