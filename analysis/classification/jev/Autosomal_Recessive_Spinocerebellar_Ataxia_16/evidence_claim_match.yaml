        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: scar16_hypogonadism_mechanism
        kind: KNOWLEDGE_GAP
        prompt: By what cellular mechanism does loss of CHIP function produce hypogonadotropic hypogonadism,
          and why does it occur in only a subset of patients with biallelic STUB1 variants?
        attaches_to:
        - pathophysiology#Hypothalamic-Pituitary Gonadotropin Deficiency
        rationale: 'Hypogonadism is the feature that gave SCAR16 its Gordon Holmes label and it is reproduced
          by loss of CHIP function in mice, yet no study localizes the defect within the hypothalamic-pituitary-gonadal
          axis or identifies the CHIP client involved. It is also strikingly inconsistent between cohorts:
          absent in all three patients of an unbiased ataxia screening cohort, and present across the
          Gordon-Holmes-ascertained literature. Whether that reflects genotype, ascertainment, or an unrecognized
          modifier is unknown, and the node is consequently the least mechanistically specified in this
          entry.'
      selected_evidence:
        snippet: Cognitive impairment was present only in one and hypogonadism in none of them.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
