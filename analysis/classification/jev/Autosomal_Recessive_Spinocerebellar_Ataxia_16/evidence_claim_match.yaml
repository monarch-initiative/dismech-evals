        prevalence_class: RARE
        notes: Diagnostic yield within a referral population, not a population prevalence. Three of 167
          degenerative ataxia subjects carried biallelic STUB1 variants; none of 133 spastic paraplegia
          subjects did. Recorded as UNKNOWN measure type because a diagnostic-yield fraction is neither
          a prevalence nor an incidence, and no population-level estimate for SCAR16 exists in the literature
          reviewed.
      selected_evidence:
        snippet: Mutations in the gene STUB1, encoding the protein CHIP (C-terminus of HSC70-interacting
          protein), have recently been suggested as a cause of recessive ataxia based on the findings
          in few Chinese families. ... 300 subjects with degenerative ataxia (n = 167) or spastic paraplegia
          (n = 133) were screened for STUB1 variants by whole-exome-sequencing (n = 204) or shotgun-fragment-library-sequencing
          (n = 96). ... We identified 3 ataxia patients (3/167 = 1.8%) with 4 novel missense mutations
          in STUB1, including 3 mutations in its tetratricopeptide-repeat domain. ... However, STUB1 is
          rare in subjects with predominant spastic paraplegia (0/133).
        supports: SUPPORT
