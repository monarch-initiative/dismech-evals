      reference: PMID:33097556
      reference_title: CHIP mutations affect the heat shock response differently in human fibroblasts
        and iPSC-derived neurons.
      evidence_source: IN_VITRO
      explanation: The isogenic knockout behaving like the patient lines is what removes the neuronal
        heat-shock readout's ability to discriminate, and is the specific result the mismatch turns on.
