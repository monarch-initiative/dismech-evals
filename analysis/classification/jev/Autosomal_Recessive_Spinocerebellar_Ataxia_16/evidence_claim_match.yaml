        title: Transcriptomic analysis of STUB1 knockdown in HEK293 cells under normal and heat-shock
          conditions
        description: RNA-seq of HEK293 cells carrying shRNA against STUB1 versus non-targeting control,
          under basal conditions and after acute heat shock. This is a knockdown cell-line experiment,
          not SCAR16 patient material, and the submitters generated it for a study of the dominant allelic
          disorder SCA48. It is included because it is the only public transcriptomic dataset that directly
          interrogates STUB1 loss of function against the heat-shock response, which is the axis the HUMAN_MODEL_MISMATCH
          discussion in this entry turns on.
        data_type: BULK_RNA_SEQ
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        notes: Dataset relevance triage. `just discover-datasets` returned twelve candidates and eleven
          were rejected. The three scored DIRECT are mouse studies of TDP2 and SNX14, matched only on
          the words "autosomal recessive spinocerebellar ataxia" in their summaries; they are different
          recessive ataxias and are the Named Entity Confusion case the curation guide warns about. The
          GENE_ONLY hits are STUB1 in tumour immunology, prostate cancer and epithelial NF-kB signalling,
          none of which bear on cerebellar degeneration. No SCAR16 patient-derived omics dataset was found
