      assertion_type: Pathophysiology
      assertion:
        name: CWF19L1 Loss of Function
        description: Biallelic loss-of-function variants in CWF19L1 (splice-site, frameshift, and nonsense
          alleles, as well as damaging missense alleles) abolish or reduce the protein. The normal biological
          function of the evolutionarily highly conserved CWF19L1 protein is unknown; its name reflects
          homology to the yeast Cwf19 spliceosome-associated protein (complexed with cdc5), but a specific
          molecular function has not been established, so none is asserted here.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CWF19L1
          term:
            id: hgnc:25613
            label: CWF19L1
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: We identified a homozygous mutation at the invariant +1 position (c.964+1G>A) in intron
          9 of the CWF19L1 (complexed with cdc5 protein 19-like 1) gene.
        supports: SUPPORT
