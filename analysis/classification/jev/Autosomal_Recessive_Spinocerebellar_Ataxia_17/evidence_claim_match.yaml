            term:
              id: MONDO:0014503
              label: autosomal recessive spinocerebellar ataxia 17
        context: []
      assertion_type: Genetic
      assertion:
        name: CWF19L1
        gene_term:
          preferred_term: CWF19L1
          term:
            id: hgnc:25613
            label: CWF19L1
        relationship_type: CAUSATIVE
        notes: Biallelic CWF19L1 variants cause SCAR17. Reported alleles include splice-site (c.964+1G>A),
          frameshift (c.467delC, p.P156Hfs*33), nonsense (p.K316*) and damaging missense (p.D13H, p.Asp132Gly)
          variants, all consistent with loss of function. The disorder is rare (a few dozen cases). ClinGen's
          Cerebellar Ataxia Gene Curation Expert Panel classifies CWF19L1 as Definitive, but for the broader
          class "autosomal recessive cerebellar ataxia" (MONDO:0015244; CGGV:assertion_6ebc1a4b-1a41-40df-832f-904cd4bb88f9-2025-05-14T160000.000Z),
          not for the SCAR17 term (MONDO:0014503) specifically, so it is not recorded here as a gene_disease_validity
          assertion on this entry; the relationship rests on multiple unrelated biallelic families plus
          a zebrafish model.
        variants:
        - name: c.964+1G>A
          description: Homozygous invariant +1 splice-donor variant in intron 9 causing exon skipping
            and protein loss; the founding allele in a consanguineous Turkish family.
        - name: p.D13H / p.K316*
          description: Compound-heterozygous missense (c.37G>C, p.D13H) and nonsense (c.946A>T, p.K316*)
            variants in a non-consanguineous Dutch patient.
        - name: c.467delC (p.P156Hfs*33)
          description: Homozygous frameshift variant with absent protein in patient lymphoblastoid cell
            lines.
        - name: p.Asp132Gly
          description: Homozygous missense variant (c.395A>G) in two sisters with late-onset cerebellar
            ataxia and epilepsy, widening the reported onset age.
      selected_evidence:
        snippet: Our data confirm CWF19L1 as a novel but rare gene causing ARCA.
        supports: SUPPORT
    origin:
