              label: autosomal recessive spinocerebellar ataxia 20
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'SCAR20 is inherited in an autosomal recessive manner. It was first defined in consanguineous
          families with affected individuals homozygous for loss-of-function SNX14 variants; a non-consanguineous
          family with compound heterozygous variants has since been reported. Unaffected parents are heterozygous
          carriers.

          '
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Here we report the identification of causal mutations in Sorting Nexin 14 (SNX14) found
          in seven affected individuals from three unrelated consanguineous families who presented with
          recessively inherited moderate-severe intellectual disability, cerebellar ataxia, early-onset
          cerebellar atrophy, sensorineural hearing loss, and the distinctive association of progressively
          coarsening facial features, relative macrocephaly, and the absence of seizures.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25439728
      reference_title: Mutations in SNX14 cause a distinctive autosomal-recessive cerebellar ataxia and
        intellectual disability syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes autosomal recessive inheritance across three unrelated consanguineous families
        with biallelic SNX14 mutations.
