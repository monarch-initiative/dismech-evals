          description: 'Recurrent Omani founder frameshift deletion; the most common allele in a 17-patient
            single-center Omani cohort (seven patients).

            '
          type: frameshift
          clinical_significance: PATHOGENIC
          regulatory_category: LOF
        - name: SNX14 compound heterozygous complex rearrangement (p.Arg399X + genomic rearrangement)
          description: 'Compound heterozygous nonsense variant (c.1195C>T, p.Arg399X) combined with a
            novel complex genomic rearrangement in the first non-consanguineous SCAR20 family; associated
            with a dystonia/stereotypy phenotype expansion.

            '
