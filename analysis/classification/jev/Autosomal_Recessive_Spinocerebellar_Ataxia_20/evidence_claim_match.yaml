          cerebellar vulnerability, recapitulating the human SCAR20 degeneration node.
        limitations: Mouse model; the valproate rescue is preclinical and has not been established as
          a human therapy. Captures the cerebellar-motor phenotype but not the full human syndromic spectrum.
