          limitations: A dog breed (species divergence), and the canine phenotype is a comparatively pure
            cerebellar cortical degeneration lacking the syndromic intellectual disability, coarse facies,
            and relative macrocephaly of human SCAR20. Rapid clinical course led to early euthanasia.
