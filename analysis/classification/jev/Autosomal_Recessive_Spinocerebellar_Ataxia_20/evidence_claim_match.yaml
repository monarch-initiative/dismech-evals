      assertion_type: Pathophysiology
      assertion:
        name: Autophagosome-Lysosome Dysfunction
        biological_scale: CELLULAR
        description: 'SNX14 localizes to lysosomes and associates with phosphatidylinositol (3,5)-bisphosphate,
          a key phosphoinositide of late endosomes/lysosomes. Patient-derived cells show engorged lysosomes
          and slower autophagosome clearance on autophagy induction, and cultured fibroblasts accumulate
          cytoplasmic vacuoles — establishing SCAR20 as a lysosome-autophagy (congenital autophagy) disorder.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: autophagosome maturation
          term:
            id: GO:0097352
            label: autophagosome maturation
          modifier: ABNORMAL
        - preferred_term: lysosomal transport
          term:
            id: GO:0007041
            label: lysosomal transport
          modifier: ABNORMAL
      selected_evidence:
        snippet: Patient-derived cells showed engorged lysosomes and a slower autophagosome clearance
          rate upon autophagy induction by starvation.
        supports: SUPPORT
