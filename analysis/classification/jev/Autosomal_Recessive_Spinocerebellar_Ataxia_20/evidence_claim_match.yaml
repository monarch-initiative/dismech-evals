          in-frame multiexon deletions and, more recently, deep-intronic pseudoexon-activating and compound-heterozygous
          complex rearrangements have also been reported. Founder/recurrent alleles occur in consanguineous
          populations (e.g. the Omani c.647_648del founder allele).

          '
