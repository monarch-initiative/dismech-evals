  b9b411b38736cfe5a7e0b8ad7e454cf2c3be2d67a985c7ea442bc1ff22ecd0ba:
    claim:
      about:
        disease:
          name: Autosomal Recessive Spinocerebellar Ataxia 20
          disease_term:
            preferred_term: autosomal recessive spinocerebellar ataxia 20
            term:
              id: MONDO:0014601
              label: autosomal recessive spinocerebellar ataxia 20
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SNX14 Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function variants in SNX14 abolish or truncate sorting nexin 14,
          a membrane-associated protein containing Phox homology (PX) and regulator of G-protein signaling
          (RGS) domains. Most disease-causing alleles are nonsense, frameshift, or splice variants that
          reduce or eliminate SNX14 protein; several in-frame coding-region deletions have also been reported.
          All characterized mutations either directly affect the PX domain or diminish SNX14 levels, implicating
          loss of normal cellular function.

          '
        biological_processes:
        - preferred_term: autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: DECREASED
      selected_evidence:
        snippet: Here we describe a new clinically distinguishable recessive syndrome in 12 families with
          cerebellar atrophy together with ataxia, coarsened facial features and intellectual disability,
          due to truncating mutations in the sorting nexin gene SNX14, encoding a ubiquitously expressed
          modular PX domain-containing sorting factor.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25848753
      reference_title: Biallelic mutations in SNX14 cause a syndromic form of cerebellar atrophy and lysosome-autophagosome
        dysfunction.
      evidence_source: HUMAN_CLINICAL
      explanation: Independently establishes biallelic truncating SNX14 mutations as the cause across
        12 families.
