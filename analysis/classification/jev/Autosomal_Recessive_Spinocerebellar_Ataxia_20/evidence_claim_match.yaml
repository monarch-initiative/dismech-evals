      assertion:
        name: Axonal Mitochondrial Transport Failure
        biological_scale: CELLULAR
        description: 'In Snx14-deficient mouse models, SNX14 loss destabilizes the microtubule-severing
          enzyme spastin, disrupting microtubule organization and mitochondrial transport in axons and
          compromising mitochondrial function in high-energy-demanding Purkinje cells. This is a model-organism
          mechanism; the antiepileptic drug valproate ameliorated motor deficits and cerebellar degeneration
          in these mice by restoring mitochondrial transport, a preclinical finding not yet established
          as a human therapy.

          '
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
