      assertion_type: Pathophysiology
      assertion:
        name: ER-Associated Neutral Lipid Dyshomeostasis
        biological_scale: CELLULAR
        description: 'Beyond the endolysosome, SNX14 is an endoplasmic-reticulum-associated protein that
          localizes to ER-lipid-droplet contact sites following fatty-acid loading, where it promotes
          lipid-droplet maturation and maintains membrane lipid-saturation balance. SNX14-deficient cells
          accumulate lysosomal cholesterol, are hypersensitive to saturated-fatty-acid-mediated lipotoxic
          cell death, and show defective neutral-lipid metabolism, implicating lipotoxicity in the neurodegeneration
          of SCAR20.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: lipid homeostasis
          term:
            id: GO:0055088
            label: lipid homeostasis
          modifier: ABNORMAL
        - preferred_term: lipid droplet formation
          term:
            id: GO:0140042
            label: lipid droplet formation
          modifier: ABNORMAL
        - preferred_term: cholesterol homeostasis
          term:
            id: GO:0042632
            label: cholesterol homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: In addition, we find that SNX14 is an ER-associated protein that functions in neutral
          lipid homeostasis and inter-organelle crosstalk.
        supports: SUPPORT
