      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing of PAM16
        description: The diagnosis is molecular. The radiographic pattern narrows the differential to
          the severe spondylodysplastic dysplasias but does not identify the gene, and the biochemical
          consequence of the defect has not been shown to produce a clinically usable metabolite or enzyme
          marker in patients. In a family of Lebanese ancestry a targeted test for the c.226A>G founder
          allele is the efficient first step; otherwise a skeletal dysplasia gene panel or exome sequencing
          is required, which is how both the original families and the milder patient were solved.
      selected_evidence:
        snippet: the mutation was homozygous in the patients, heterozygous in the parents and in the unaffected
          sibs in both families.
        supports: SUPPORT
