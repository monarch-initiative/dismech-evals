  1c6aaa50ef678af341c7d8b675bff4db07f28879248f2429e2cc331579cf0e84:
    claim:
      about:
        disease:
          name: Autosomal Recessive Spondylometaphyseal Dysplasia, Megarbane Type
          disease_term:
            preferred_term: autosomal recessive spondylometaphyseal dysplasia, Megarbane type
            term:
              id: MONDO:0013223
              label: autosomal recessive spondylometaphyseal dysplasia, Megarbane type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PAM16 Dysfunction
        biological_scale: MOLECULAR
        description: Biallelic PAM16 missense variants cause SMDMDM. For the founder p.Asn76Asp allele,
          yeast complementation demonstrates conditional loss of MAGMAS stability, matrix-protein import
          and viability. The p.Gln74Pro allele is associated with a milder clinical course and has structural
          predictions, but equivalent allele-specific functional measurements are not reported in the
          reviewed sources. The yeast permissive-temperature phenotype supports residual function in that
          assay, without defining a human physiological threshold.
        genetic_context:
          gene:
            preferred_term: PAM16
            term:
              id: hgnc:29679
              label: PAM16
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
          allele_type: MISSENSE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Homozygous germline NM_016069:c.226A>G (p.Asn76Asp). Graded as a partial rather
            than a complete loss of function because the allele complements a pam16-null yeast strain
            at permissive temperature and only fails as temperature rises.
        biological_processes:
        - preferred_term: J-like negative regulation of the mtHsp70 import-motor ATPase
          modifier: DECREASED
          description: PAM16/MAGMAS is not itself an ATP-dependent chaperone; it lacks the HPD motif and
            the chaperone is mtHsp70/HSPA9. What it does is restrain the J-domain of DNAJC19 so that the
            motor's ATPase is regulated rather than constitutive, which is why GO annotates the human
            protein with negative regulation of ATP-dependent activity by direct assay and assigns it
            no molecular-function term at all.
          term:
            id: GO:0032780
            label: negative regulation of ATP-dependent activity
        locations:
        - preferred_term: trabecular bone tissue
          description: The tissue in which MAGMAS is expressed at the relevant developmental stage. The
            subcellular site of the protein is the matrix face of the mitochondrial inner membrane; that
            is recorded as a GO cellular component on the import node rather than here, because this slot
            is bound to the anatomical-entity enum.
          term:
            id: UBERON:0002483
            label: trabecular bone tissue
        gene:
          preferred_term: PAM16
          term:
            id: hgnc:29679
            label: PAM16
      selected_evidence:
        snippet: Importantly, the p.Asn76Asp mutation lies in the helix II of MAGMAS J-like domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24786642
      reference_title: The impairment of MAGMAS function in human is responsible for a severe skeletal
        dysplasia.
      evidence_source: OTHER
      explanation: Locates the disease allele in the domain through which MAGMAS regulates the import
        motor. Graded OTHER rather than HUMAN_CLINICAL because the statement is a domain-architecture
        assignment carried over from prior structural work, not an observation in patients.
