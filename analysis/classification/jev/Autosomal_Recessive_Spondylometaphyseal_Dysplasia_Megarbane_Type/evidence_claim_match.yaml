      assertion_type: DifferentialDiagnosis
      assertion:
        name: EVEN-PLUS syndrome (HSPA9-related)
        description: The other skeletal dysplasia of the same import machine. HSPA9 encodes mortalin,
          the mitochondrial Hsp70 that the PAM motor drives and that MAGMAS regulates, so EVEN-PLUS is
          a defect one component downstream of this disease. Both are severe spondylo-type dysplasias,
          and the pairing is the main reason this entity is best understood as a mitochondrial import
          disease rather than as a chondrodysplasia.
        distinguishing_features:
        - EVEN-PLUS is caused by HSPA9 variants; this disease by PAM16 variants.
        - EVEN-PLUS carries epiphyseal, vertebral, ear and nose anomalies with congenital heart disease;
          this entity is dominated by severe platyspondyly with metaphyseal change.
        - The two are separated by sequencing, not by radiographic pattern alone.
      selected_evidence:
        snippet: a few other disease genes encoding mitochondrial proteins have been linked to genetic
          skeletal disorders, where they have been classified as spondyloepimetaphyseal or severe spondysplastic
          dysplasias [8]
        supports: SUPPORT
