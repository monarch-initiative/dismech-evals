            label: 3-methylglutaconic aciduria type 5
        description: The allelic-partner disease. DNAJC19 encodes the J-protein that heterodimerises with
          MAGMAS through the very domain the founder allele damages, so DCMA and this disease are two
          failures of the same import motor read out in different tissues. The discovery paper explicitly
          asked why its patients did not have DCMA and proposed tissue redundancy in the MAGMAS/DNAJC19
          subcomplex as the explanation.
        distinguishing_features:
        - DCMA is caused by DNAJC19 variants and this disease by PAM16 variants; both disrupt the same
          heterodimer from opposite sides.
        - DCMA presents with dilated cardiomyopathy, ataxia and 3-methylglutaconic aciduria and has no
          spondylometaphyseal dysplasia.
        - Ataxia was explicitly absent in the four originally reported PAM16 patients, and cardiomyopathy
          occurred in only one of the two families.
        - The severe congenital platyspondyly and delayed epiphyseal ossification that define this entity
          have no counterpart in DCMA.
      selected_evidence:
        snippet: Cardiomyopathy was observed exclusively in patients of the second family and ataxia was
          not present but all 4 cases died early before 2 years of age.
        supports: SUPPORT
