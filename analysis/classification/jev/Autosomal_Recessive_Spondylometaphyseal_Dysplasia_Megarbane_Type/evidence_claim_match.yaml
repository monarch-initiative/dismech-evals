          value:
            name: pam16-null yeast complemented with human wild-type or p.Asn76Asp MAGMAS
            description: Saccharomyces cerevisiae pam16-delta strains were complemented with wild-type
              or p.Asn76Asp human MAGMAS. Mutant growth was preserved at 28 degrees, slowed at 34 and
              absent at 36, particularly on non-fermentable medium. Nonpermissive conditions revealed
              Hsp60 precursor accumulation, reduced mutant protein, fragmented mitochondria and pexophagy.
              This establishes a conditional allele effect in yeast, without explaining human survival
              or predicting clinical responses to temperature.
            experimental_model_type: OTHER
            organism:
              preferred_term: Saccharomyces cerevisiae
              term:
                id: NCBITaxon:4932
                label: Saccharomyces cerevisiae
            publication: PMID:24786642
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: The human disease allele, expressed in place of the yeast ortholog, reproduces the
          import block that this node asserts.
        limitations: Yeast has no growth plate, no cardiomyocyte and no vertebral column, so the model
          speaks only to the conserved import chemistry and can say nothing about how that chemistry becomes
          a skeletal disease. The defect is also only expressed at non-physiological temperatures, so
          the assay reports a conditional phenotype rather than the constitutive one patients carry at
          37 degrees.
        readouts:
        - name: Unprocessed Hsp60 precursor accumulation
          target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
          direction: INCREASED
          interpretation: Precursor that fails to reach the matrix is not proteolytically matured, so
            its accumulation is a direct readout of the import block.
        - name: Steady-state mutant MAGMAS protein level
          target: Impaired TIM23/PAM-Dependent Import of Matrix Preproteins
          direction: DECREASED
          interpretation: Confirms that the allele acts by destabilising the protein rather than by altering
            its activity alone.
      selected_evidence:
        snippet: We further demonstrate that the mutation described here confers to yeast strains a temperature-sensitive
          phenotype, impairs the import of mitochondrial matrix pre-proteins and induces cell death.
        supports: SUPPORT
