      assertion_type: Pathophysiology
      assertion:
        name: Bioenergetic Failure and Cell Death
        biological_scale: CELLULAR
        description: The p.Asn76Asp allele induces cell death in yeast. In separate experiments, loss
          of the fly ortholog Blp impairs respiration, lowers ATP and increases reactive oxygen species
          in Schneider cells, with antioxidant rescue also observed in hypomorphic larvae. These experiments
          support conserved roles in cell integrity and viability, but do not measure patient growth-plate
          or myocardial bioenergetics. Yeast temperature dependence does not explain the age at death
          in children.
        biological_processes:
        - preferred_term: apoptotic process
          modifier: INCREASED
          term:
            id: GO:0006915
            label: apoptotic process
      selected_evidence:
        snippet: Proliferation-defective, Blp-deficient Drosophila Schneider cells exhibited mitochondrial
          membrane depolarization, a 60% decrease in ATP levels, increased amounts of ROS (3.5-fold),
          cell cycle arrest, and activation of autophagy that were associated with a selective 65% reduction
          of cytochrome c oxidase activity.
        supports: SUPPORT
