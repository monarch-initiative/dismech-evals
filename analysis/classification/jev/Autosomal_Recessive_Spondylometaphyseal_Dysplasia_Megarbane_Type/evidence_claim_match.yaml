  59eb6ed8f5803fcdb2a4c28ee30df8e960523618666559e8d547b042f6baf62f:
    claim:
      about:
        disease:
          name: Autosomal Recessive Spondylometaphyseal Dysplasia, Megarbane Type
          disease_term:
            preferred_term: autosomal recessive spondylometaphyseal dysplasia, Megarbane type
            term:
              id: MONDO:0013223
              label: autosomal recessive spondylometaphyseal dysplasia, Megarbane type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: growth_and_neuromotor_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What explains fetal growth failure and developmental delay, and how much of hypotonia
          and spasticity is attributable to cervical myelopathy?
        attaches_to:
        - phenotypes#Intrauterine growth retardation
        - phenotypes#Global developmental delay
        - phenotypes#Axial hypotonia
        - phenotypes#Spastic diplegia
        rationale: Skeletal growth explains disproportionate linear stature, but the contributions of
          systemic growth, CNS dysfunction, muscle disease and severe illness to fetal growth failure,
          developmental delay and the original families’ hypotonia remain unresolved. In the surgical
          case, the authors identify myelopathy and central hypotonia without a more specific central
          localization. Central does not mean exclusively cerebral and does not exclude a spinal route.
          Motor improvement and reduced hypotonia despite increasing spasticity occurred before cervical
          surgery. The six-year-ten-month MRI showed no compression or instability, whereas spastic diparesis
          with hypotonia was still documented at thirteen years. These observations constrain a continuously
          reversible compression explanation. They do not distinguish residual injury from prior cord
          compromise from other central or developmental contributors, and do not refute an earlier myelopathic
          contribution. No detailed motor examination is separately reported at the six-year-ten-month
          scan, so that scan and the later examination are not treated as a simultaneous assessment.
      selected_evidence:
        snippet: However, clinical follow-up revealed progressive motor improvement and reduced hypotonia,
          despite increased spasticity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/6
      evidence_path: /discussions/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: url:https://link.springer.com/article/10.1007/s00586-025-09671-6
      reference_title: Spine surgery in a rare case of Mégarbané-Dagher-Melki type spondylometaphyseal
        dysplasia. A Case Report | European Spine Journal | Springer Nature Link
      evidence_source: HUMAN_CLINICAL
      explanation: This sentence follows the early MRI and precedes the indication for cervical fusion
        at three years two months. It is not evidence of postoperative improvement; hypotonia and spasticity
        followed different trajectories.
