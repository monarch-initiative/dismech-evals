        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide, published cases
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: Four children from two consanguineous Lebanese families carried p.Asn76Asp, and the 2020
          review describes one later p.Gln74Pro patient. The 2026 surgical report describes a survivor
          aged 13, and cites the 2016 report at molecular diagnosis; neither an explicit allele nor independent
          case identity is established. No population prevalence or carrier-frequency estimate is available;
          the literature counts are historical case descriptions, not a current exhaustive denominator.
      selected_evidence:
        snippet: More recently, a slightly milder phenotype of SMDMDM was also reported in another patient
          harboring a nearby variant in PAM16 (Q74P) [59].
        supports: SUPPORT
    origin:
