      assertion_type: AnimalModel
      assertion:
        name: Drosophila black-pearl (blp) hypomorph and RNAi knockdown
        species: Drosophila melanogaster
        genotype: blp hypomorphic allele; blp RNAi knockdown in Schneider cells
        genes:
        - preferred_term: black-pearl (blp)
          description: 'The Drosophila ortholog of PAM16/MAGMAS and the gene actually manipulated in this
            model. Left unbound: it is a fly gene with no HGNC identifier, and binding the human PAM16
            CURIE here would assert that the model mutates a gene it does not.'
        description: 'The only in vivo animal work on this gene family that bears on the disease mechanism.
          Black-pearl is the Drosophila ortholog of MAGMAS/Pam16. Depleting it depolarises mitochondria,
          drops ATP by 60 per cent, raises reactive oxygen species 3.5-fold and selectively cuts cytochrome
          c oxidase activity by 65 per cent; in hypomorphic larvae, plasmatocyte number and mitochondrial
          staining fall and N-acetylcysteine doubles viability, which is the strongest evidence that ROS
          is a causal effector rather than a bystander. It is not a model of the disease: the allele is
          a knockdown or hypomorph rather than the human missense change, and flies have no endochondral
          skeleton.'
        publication: PMID:22700875
        modeled_mechanisms:
        - target: Bioenergetic Failure and Cell Death
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Loss of the ortholog reproduces the bioenergetic and viability collapse this node
            describes, and quantifies it with the ATP, ROS and cytochrome c oxidase measurements the yeast
            work does not provide.
          limitations: The perturbation is a knockdown or hypomorphic allele of the fly ortholog, not
            the human p.Asn76Asp missense allele, so it models loss of the gene rather than the disease
            genotype, and it cannot address dosage. The readouts are in haemocytes and cultured Schneider
            cells, tissues with no relationship to the growth plate. Fidelity is graded LOW for those
            reasons rather than because any result is in doubt.
          readouts:
          - name: Cellular ATP level
            target: Bioenergetic Failure and Cell Death
            direction: DECREASED
            interpretation: A 60 per cent fall in ATP is the bioenergetic consequence of losing the import-motor
              subunit.
          - name: Reactive oxygen species
            target: Bioenergetic Failure and Cell Death
            direction: INCREASED
            interpretation: ROS rose 3.5-fold in Blp-deficient Schneider cells; antioxidant rescue in
              the study supports a pathogenic oxidative component.
      selected_evidence:
        snippet: blp hypomorph larvae had a 35% decreased number of plasmatocytes with a 45% reduced active
          mitochondrial staining and their viability was increased 2-fold by administration of NAC
        supports: SUPPORT
