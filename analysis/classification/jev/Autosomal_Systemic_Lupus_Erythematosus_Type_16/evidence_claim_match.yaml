        context: []
      assertion_type: Genetic
      assertion:
        name: DNASE1L3
        gene_term:
          preferred_term: DNASE1L3
          term:
            id: hgnc:2959
            label: DNASE1L3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Biallelic loss-of-function DNASE1L3 variants cause the disease, inherited autosomal-recessively.
          Recurrent alleles include the frameshifts c.289_290delAC (p.Thr97Ilefs*2) and c.643delT, a splice-region
          deletion c.320+4delAGTA, and secretion/activity-impairing missense variants such as p.Asn191Ser;
          the same variants are found across the SLE and HUVS ends of the spectrum.
        variants:
        - name: p.Thr97Ilefs*2 (c.289_290delAC)
          description: A recurrent homozygous frameshift leading to loss of function, reported in both
            HUVS and SLE-spectrum families.
        - name: c.643delT
          description: A recurrent homozygous loss-of-function frameshift enriched in a large Omani/UAE
            cohort.
        - name: p.Asn191Ser (c.572A>G)
          description: A missense variant that impairs DNASE1L3 secretion and enzymatic activity in affected
            families with SLE and HUV.
      selected_evidence:
        snippet: We identified a rare autosomal recessive form of SLE, in which autozygome analysis revealed
          a null mutation in the DNASE1L3 gene.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
