        description: Biallelic loss-of-function DNASE1L3 variants (frameshift, nonsense, splice-region
          and secretion/activity-impairing missense alleles) abolish or markedly reduce the activity of
          the secreted endonuclease. DNASE1L3 normally carries a CC-end-motif-preferring endodeoxyribonuclease
          activity, so its loss is detectable as reduced serum DNase activity and an abnormal plasma cell-free
          DNA fragmentation pattern (altered fragment lengths and loss of CC end motifs).
        genes:
