      reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of
        the femoral head.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes microvascular thrombosis as a recognized feature of non-traumatic osteonecrosis
        pathogenesis generally, which this TRPV4-driven case is proposed to share.
