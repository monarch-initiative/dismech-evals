      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: trpv4_endothelial_vasoconstriction_hypothesis
        hypothesis_label: TRPV4 gain-of-function drives osteonecrosis via endothelial calcium overload
          and vasoconstriction
        status: EMERGING
        description: 'The discovery paper''s own proposed mechanism: constitutive gain-of-function TRPV4
          activity, combined with the femoral head''s constant mechanical loading, causes endothelial
          calcium overload, vasoconstriction (potentially via COX-dependent thromboxane receptor signaling),
          and consequent microthrombosis in a joint with no collateral blood supply. The authors explicitly
          describe this as a proposed synthesis rather than a directly demonstrated in vivo mechanism;
          no animal model or direct measurement of femoral head blood flow supports it yet.'
      selected_evidence:
        snippet: Together, this could cause Ca2+ overload, leading to endothelial dysfunction and vasoconstriction,
          resulting in bone loss at the hip.
        supports: SUPPORT
        directness: INDIRECT
