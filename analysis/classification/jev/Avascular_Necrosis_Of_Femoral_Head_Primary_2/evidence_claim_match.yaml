            term:
              id: MONDO:0054551
              label: avascular necrosis of femoral head, primary, 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TRPV4 Calmodulin-Binding-Domain Truncating Gain-of-Function Variant
        biological_scale: MOLECULAR
        description: 'A c.2480_2483delCCCG frameshift deletion followed by a c.2486T>A substitution in
          the last exon of TRPV4 truncates the 871-amino-acid channel protein (p.V829Wfs*3), eliminating
          a highly conserved C-terminal region that includes residues within a calmodulin-binding domain.
          Unlike previously characterized TRPV4 C-terminal truncations, which cause loss of channel activity,
          this variant produces a gain of function: functional measurements in patient-derived dermal
          fibroblasts and stably transduced HEK293 cells show markedly increased TRPV4 activity, caused
          specifically by longer channel open times rather than an increase in the number of channels
          per site.'
        genes:
        - preferred_term: TRPV4
          term:
            id: hgnc:18083
            label: TRPV4
        molecular_functions:
        - preferred_term: calcium channel activity
          term:
            id: GO:0005262
            label: calcium channel activity
          modifier: GAIN_OF_FUNCTION
        genetic_context:
          functional_impact_category: GAIN_OF_FUNCTION
          allele_type: frameshift deletion (c.2480_2483delCCCG) with adjacent c.2486T>A substitution,
            C-terminal truncating
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
      selected_evidence:
        snippet: It truncates the 871 amino acid protein (V829WfsX3), eliminating a highly conserved region
          including residues within a calmodulin-binding domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27330106
      reference_title: Gain-of-function mutation in TRPV4 identified in patients with osteonecrosis of
