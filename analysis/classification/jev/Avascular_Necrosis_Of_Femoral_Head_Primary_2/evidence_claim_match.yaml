      assertion_type: Variant
      assertion:
        name: TRPV4 c.2480_2483delCCCG with c.2486T>A (p.V829Wfs*3)
        gene:
          preferred_term: TRPV4
          term:
            id: hgnc:18083
            label: TRPV4
        type: Complex deletion and adjacent substitution on one allele
        genomic_contexts:
        - coding sequence
        description: Reported on NM_021625.4 in the last exon. The deletion and adjacent substitution
          are in cis and were reported together as V829WfsX3. Four affected siblings carried the allele,
          one tested unaffected sibling was wild type, and the transmitting parent was not established.
          Mutant transcript persisted in patient cDNA; truncated protein was measured in tagged HEK293
          constructs, not demonstrated in patient fibroblasts. The paper provides segregation and channel-function
          evidence without a formal ACMG classification.
        functional_effects:
        - function: Increased TRPV4 channel activity
          description: Proband fibroblasts and mutant-transduced HEK293 cells showed increased optical
            calcium sparklet activity and longer bursts. Altered calmodulin binding remains a hypothesis.
      selected_evidence:
        snippet: The TRPV4 mutation is located in the last exon and was confirmed in proband cDNA
        supports: SUPPORT
