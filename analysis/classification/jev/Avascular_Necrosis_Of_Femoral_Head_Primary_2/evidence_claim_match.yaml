      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: trpv4_osteoclast_resorption_hypothesis
        hypothesis_label: TRPV4 gain-of-function drives femoral head bone loss via excess osteoclast resorptive
          activity
        status: EMERGING
        description: Excess osteoclast resorption is a candidate route from TRPV4 gain of function to
          bone loss. Knockout and osteoclast-lineage R616Q/V620I gain-of-function experiments support
          a role for channel activity in resorption. However, the ANFH2 frameshift has not been tested
          in osteoclasts. In the 2012 gain-of-function model, removal of the calmodulin-binding domain
          abolished the bone-loss effect, so a C-terminal frameshift cannot simply be assumed to reproduce
          other alleles.
      selected_evidence:
        snippet: genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the transient receptor
          potential (TRP) family, increases bone mass by impairing bone resorption
        supports: SUPPORT
        directness: INDIRECT
    origin:
