          a sporadic (non-TRPV4) osteonecrosis comparison cohort, and had already reached Steinberg Stage
          III-V (subchondral fracture through end-stage secondary arthritic change) by the time of diagnosis.
          The other two clinically recognized TRPV4-opathy phenotype categories (skeletal dysplasia, peripheral
          neuropathy) and a primary coagulopathy were each specifically examined for and excluded in this
          family, supporting ANFH2 as a distinct TRPV4-related entity rather than an atypical presentation
          of one of those.
