  bdaf35c169ba6eac5ee3d18c99b7baa8548ee3b7d6f5c20697167080f1e4e02c:
    claim:
      about:
        disease:
          name: Avascular Necrosis of Femoral Head, Primary, 2
          disease_term:
            preferred_term: avascular necrosis of femoral head, primary, 2
            term:
              id: MONDO:0054551
              label: avascular necrosis of femoral head, primary, 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Osteoclast Calcium Signaling Dysregulation
        biological_scale: CELLULAR
        description: 'TRPV4 mediates basolateral Ca2+ influx specifically in large osteoclasts once RANKL-evoked
          Ca2+ oscillations decline, sustaining the NFATc1-dependent gene transcription required for terminal
          differentiation and resorptive activity. Genetic ablation of Trpv4 in mice increases bone mass
          by impairing bone resorption, indicating that TRPV4 signaling normally promotes osteoclast differentiation
          and resorption. This evidence is from the opposite (loss-of-function) direction: no study has
          directly measured osteoclast activity in cells carrying the ANFH2 gain-of-function variant,
          so the inference that excess TRPV4 activity would drive excess resorption is proposed by analogy
          rather than demonstrated.'
        cell_types:
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
        biological_processes:
        - preferred_term: osteoclast differentiation
          term:
            id: GO:0030316
            label: osteoclast differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the transient receptor
          potential (TRP) family, increases bone mass by impairing bone resorption
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
