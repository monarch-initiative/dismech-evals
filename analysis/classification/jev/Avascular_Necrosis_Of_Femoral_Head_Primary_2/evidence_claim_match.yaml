      reference_title: TRPV4-mediated calcium influx regulates terminal differentiation of osteoclasts.
      evidence_source: MODEL_ORGANISM
      explanation: 'Establishes that TRPV4 loss of function reduces osteoclast-mediated bone resorption
        in mice - the inverse experiment to the human gain-of-function variant, so it is graded INDIRECT:
        it supports a role for TRPV4 in osteoclast resorption without directly showing that the ANFH2
        gain-of-function allele increases resorption.'
