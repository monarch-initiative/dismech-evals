      assertion_type: Discussion
      assertion:
        discussion_id: anfh2_no_gain_of_function_animal_model
        prompt: Does any animal or cellular model directly recapitulate femoral head osteonecrosis driven
          by a TRPV4 gain-of-function allele, rather than modeling TRPV4's general roles in bone or vascular
          biology?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Endothelial Calcium Overload
        - pathophysiology#Increased Osteoclast Bone Resorption
        rationale: The isolated ANFH2 family has segregation and non-disease-site cellular functional
          evidence. Other TRPV4 gain-of-function alleles do increase osteoclast resorption and bone loss,
          but that does not demonstrate femoral-head osteonecrosis from the ANFH2 frameshift. Disease-site
          endothelial, vascular and osteoclast measurements remain missing, and the specific role of calmodulin
          regulation in the frameshift channel remains unresolved.
      selected_evidence:
        snippet: Limitations of the study include the availability of a single family, which adds difficulty
          to eliminating all variant candidates in an autosomal-dominant model of inheritance and a lack
          of available phenotype-relevant cell types for functional measurements or an animal model to
          provide additional evidence of causation.
        supports: SUPPORT
