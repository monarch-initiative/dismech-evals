  a55e9f469194470439dcf4be7b035e098cbb38ffae36b996e0687b68893f946a:
    claim:
      about:
        disease:
          name: Avascular Necrosis of Femoral Head, Primary, 2
          disease_term:
            preferred_term: avascular necrosis of femoral head, primary, 2
            term:
              id: MONDO:0054551
              label: avascular necrosis of femoral head, primary, 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: anfh2_no_gain_of_function_animal_model
        prompt: Does any animal or cellular model directly recapitulate femoral head osteonecrosis driven
          by a TRPV4 gain-of-function allele, rather than modeling TRPV4's general roles in bone or vascular
          biology?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Vascular Endothelial Dysfunction and Vasoconstriction
        - pathophysiology#Osteoclast Calcium Signaling Dysregulation
        rationale: The causal evidence for ANFH2 is a single human pedigree plus in vitro channel electrophysiology
          (patient fibroblasts and transduced HEK293 cells) - there is no whole-organism model. The existing
          Trpv4 mouse literature establishes the channel's general roles in osteoclast resorption and
          vascular tone, but by loss-of-function (knockout) or skeletal-dysplasia gain-of-function alleles
          distinct from the ANFH2 variant, and none reproduces femoral head osteonecrosis specifically.
          The vasoconstriction/microthrombosis step and the osteoclast-resorption step are therefore both
          extrapolated from tissue-general TRPV4 biology rather than demonstrated for this disease.
      selected_evidence:
        snippet: Limitations of the study include the availability of a single family, which adds difficulty
          to eliminating all variant candidates in an autosomal-dominant model of inheritance and a lack
          of available phenotype-relevant cell types for functional measurements or an animal model to
          provide additional evidence of causation.
        supports: SUPPORT
