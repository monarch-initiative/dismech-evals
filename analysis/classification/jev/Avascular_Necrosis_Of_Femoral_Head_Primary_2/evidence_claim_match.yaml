  aff685c77dfeb1a69f36ca2421d31a8bc0fff3674712b7d6b2d6b1a574f8c2a8:
    claim:
      about:
        disease:
          name: Avascular Necrosis of Femoral Head, Primary, 2
          disease_term:
            preferred_term: avascular necrosis of femoral head, primary, 2
            term:
              id: MONDO:0054551
              label: avascular necrosis of femoral head, primary, 2
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Global Trpv4-knockout mouse
        species: Mouse
        genotype: Trpv4-null (global knockout)
        publication: PMID:18762026
        description: Global genetic ablation of Trpv4, used to establish the channel's normal role in
          osteoclast terminal differentiation and bone resorption. This is a loss-of-function model of
          a gene whose ANFH2 disease allele is gain-of-function, so it informs the pathway rather than
          modeling the disease genotype itself.
        modeled_mechanisms:
        - target: Osteoclast Calcium Signaling Dysregulation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: CELLULAR
          description: 'Confirms TRPV4-mediated calcium influx is required for normal osteoclast terminal
            differentiation and resorptive activity, but does not model the ANFH2 disease direction: the
            knockout produces the opposite phenotype (reduced resorption, increased bone mass) to what
            the gain-of-function hypothesis for ANFH2 predicts (excess resorption, bone loss). No gain-of-function
            knock-in model exists for this variant or an equivalent one.'
          limitations: 'Opposite-direction genetic perturbation: a null allele cannot demonstrate that
            a constitutively active channel drives excess resorption, only that channel activity is required
            for normal resorption. The inference to ANFH2''s gain-of-function direction is by analogy,
            not direct evidence.'
          divergences:
          - divergence_type: OTHER
            materiality: INVALIDATING
            description: The model's genetic perturbation is loss-of-function (null allele); the ANFH2
              disease allele is gain-of-function. No divergence type in the current taxonomy captures
              a functional-direction reversal (loss vs gain of function) of the same gene, so this is
              recorded as OTHER.
          readouts:
          - name: Bone mass and resorption
            target: Osteoclast Calcium Signaling Dysregulation
            direction: DECREASED
            interpretation: Bone resorption is decreased (bone mass increased) upon TRPV4 loss of function,
              the inverse of the direction hypothesized for the ANFH2 gain-of-function allele.
      selected_evidence:
        snippet: TRPV4-mediated Ca(2+) influx hereby secures intracellular Ca(2+) concentrations, ensures
          NFATc1-regulated gene transcription, and regulates the terminal differentiation and activity
          of osteoclasts.
        supports: SUPPORT
        directness: INDIRECT
