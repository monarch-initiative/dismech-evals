      assertion_type: Pathophysiology
      assertion:
        name: Femoral Head Microvascular Thrombosis and Ischemia
        biological_scale: TISSUE
        description: Osteonecrosis of the femoral head is characterized by compromised blood flow to the
          femoral head, with microvascular thrombosis a common finding across non-traumatic osteonecrosis
          generally. The femoral head is anatomically vulnerable because it lacks collateral blood vessels
          and is a constantly weight-bearing, mechanically stressed joint - features the authors propose
          synergize with systemic TRPV4 gain-of-function activation to produce localized ischemia.
      selected_evidence:
        snippet: microvascular thrombosis is a common finding in non-traumatic osteonecrosis, indicating
          a vascular role in disease pathogenesis
        supports: SUPPORT
