        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: trpv4_osteoclast_resorption_hypothesis
        hypothesis_label: TRPV4 gain-of-function drives femoral head bone loss via excess osteoclast resorptive
          activity
        status: EMERGING
        description: 'A candidate parallel (non-vascular) route from the same calcium-overload step: TRPV4
          normally sustains NFATc1-dependent osteoclast terminal differentiation and resorptive activity,
          and Trpv4-knockout mice show reduced resorption and increased bone mass. By analogy, a constitutively
          gain-of-function channel would be expected to drive excess resorption and bone loss at the femoral
          head. No study has tested this directly in cells or animals carrying an ANFH2-equivalent gain-of-function
          allele; the supporting evidence is entirely from the opposite-direction knockout experiment.'
      selected_evidence:
        snippet: genetic ablation in mice of Trpv4, a Ca(2+)-permeable channel of the transient receptor
          potential (TRP) family, increases bone mass by impairing bone resorption
        supports: SUPPORT
        directness: INDIRECT
