        name: Low Appetite and Lack of Interest in Eating
        description: 'The low-interest/inappetence presentation: blunted hunger and interoceptive drive
          with an apparent lack of interest in eating, easy satiety, and forgetting to eat. Greater lack-of-interest
          severity tracks with lower hypothalamic activation to food cues, and reduced anticipatory food
          reward (diminished anticipatory pleasure) is specifically associated with the lack-of-interest
          profile rather than with generalized anhedonia.'
        biological_scale: ORGANISM
        cell_types:
