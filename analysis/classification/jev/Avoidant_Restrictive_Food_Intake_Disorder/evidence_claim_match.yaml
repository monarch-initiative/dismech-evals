  68c7fe371fd5c7b7ce50292eec00a2b6faf197495bf9f215519acf297d7e601e:
    claim:
      about:
        disease:
          name: Avoidant Restrictive Food Intake Disorder
          disease_term:
            preferred_term: avoidant/restrictive food intake disorder
            term:
              id: MONDO:7770002
              label: avoidant/restrictive food intake disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Restriction and Avoidance of Food Intake
        description: 'The convergent core behavior: persistent avoidance or restriction of food intake
          reached by any of the three drivers, critically without the drive for thinness, fear of weight
          gain, or body-image disturbance that defines anorexia nervosa. This absence of weight/shape
          motivation is the defining contrast with anorexia nervosa. The three drivers are dimensional
          and frequently co-occur rather than being mutually exclusive subtypes: an empirical latent-class
          analysis of 319 children/adolescents found a mixed (combined) presentation to be the single
          most common class.'
        biological_scale: ORGANISM
        notes: The latent-class study used clinician-reported secondary-care cases in the UK and Republic
          of Ireland, without independent PARDI confirmation. Its combined class chiefly mixed sensory
          sensitivity and lack of interest; the observed proportions are not population-wide subtype prevalence.
      selected_evidence:
        snippet: with fear of weight gain as an exclusion
