            term:
              id: MONDO:7770002
              label: avoidant/restrictive food intake disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Low Appetite and Lack of Interest in Eating
        description: Low interest in eating, low hunger and early satiation can limit intake. Within the
          lack-of-interest phenotype group, greater symptom severity correlated with lower right hypothalamus
          activation during a fasting visual-food-cue task. The group did not show lower hypothalamus
          activation than healthy controls overall. This cross-sectional association does not establish
          hypothalamic dysfunction as the cause of restriction or identify the responsible endocrine cell
          type. In a separate self-report study, ARFID severity correlated with lower anticipatory pleasure
          even after food items were removed. This broader reward association and the contribution of
          depressive symptoms do not establish a food-specific reward defect or its causal direction.
        biological_scale: ORGANISM
        notes: Appetite-hormone studies provide a possible biological correlate, summarized under biochemical
          findings. They measure circulating hormones, not pathology of enteroendocrine cells, and do
          not establish hormone dysregulation as an initiating cause. Several neuroimaging, pleasure,
          endocrine and course papers draw from the same NIMH-funded ARFID cohort and should not be treated
          as independent replications.
      selected_evidence:
        snippet: including sensory sensitivity, lack of interest in eating or food, and fear of aversive
          consequences.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
