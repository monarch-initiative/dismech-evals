      assertion_type: Treatment
      assertion:
        name: Family-Based Treatment (FBT-ARFID)
        description: Family-based treatment adapted for ARFID trains caregivers to change restrictive
          eating, followed by return to age-appropriate self-management. A randomized trial of 98 medically
          stable, underweight children aged 6-12 compared 14 telehealth sessions over four months with
          individual psychoeducational motivational therapy. FBT-ARFID produced greater weight gain, but
          overall ARFID symptom severity improved similarly in both groups. This trial does not establish
          efficacy across adult or non-underweight populations.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Family Therapy
          term:
            id: NCIT:C93347
            label: Family Therapy
      selected_evidence:
        snippet: FBT-ARFID was superior to PMT at EOT in promoting increased %EBW. There were no differences
          between groups regarding improvements in overall severity of ARFID symptoms or other related
          ARFID symptoms
        supports: SUPPORT
