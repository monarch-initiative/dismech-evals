      assertion_type: DifferentialDiagnosis
      assertion:
        name: Anorexia Nervosa
        description: Anorexia nervosa also involves restricted intake and low weight, but is driven by
          fear of weight gain and body-image disturbance — the motivation that ARFID lacks. A minority
          of ARFID cases cross over to anorexia nervosa.
        distinguishing_features:
        - ARFID restriction occurs without drive for thinness, fear of weight gain, or body-image disturbance;
          anorexia nervosa is defined by exactly this weight/shape motivation.
        disease_term:
