      assertion_type: ImagingFinding
      assertion:
        name: Greater frontal cortical thickness in children with ARFID-like symptoms
        modality: MRI
        diagnostic: false
        located_in:
          preferred_term: frontal cortex
          term:
            id: UBERON:0001870
            label: frontal cortex
        description: Cross-sectional Generation R analysis found greater frontal and superior frontal
          cortical thickness in children with ARFID-like symptoms; the differences persisted after BMI
          adjustment. Classification used an index rather than a diagnostic interview. No significant
          regional volume or surface-area differences were found in the prespecified regions, and exploratory
          findings did not survive multiple-comparison correction.
        notes: Research association, not an individual diagnostic marker. The study does not establish
          impaired synaptic pruning or causal executive dysfunction. Full-text results and Table 1 report
          121 children with symptoms and 1,856 without; the abstract has an inconsistent comparator count.
      selected_evidence:
        snippet: Neuroanatomical findings identified significantly greater frontal (p = .00743; d = 0.21)
          and superior frontal (p = 6.56E-04; d = 0.28) cortical thickness among children with ARFID symptoms.
