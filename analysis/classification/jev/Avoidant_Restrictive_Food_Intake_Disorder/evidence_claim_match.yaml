      assertion:
        name: Fear of Aversive Consequences of Eating
        description: 'The fear-driven presentation: conditioned avoidance following (or in anticipation
          of) an aversive eating event such as choking, vomiting, or pain, often emerging later than the
          other presentations. Documented precipitants include gastrointestinal disease and symptoms (a
          major antecedent in adults with GI disorders, where food-symptom associations drive restriction)
          and food allergy (fear of an allergic reaction). Youth with this phenotype show heightened amygdala
          (fear-circuit) activation to food cues.'
