        notes: Research association, not a diagnostic test. A case-control study found higher fasting
          CCK in full/subthreshold ARFID after adjustment for age, sex and BMI percentile, but no within-ARFID
          association with subjective appetite or symptom severity. A later two-year observational study
          linked decreases in CCK to improvement in lack-of-interest severity, not overall ARFID severity.
          Higher CCK in the lack-of-interest group was significant at year 1 only, with no significant
          difference at baseline or year 2. Causality and the contribution of nutritional state remain
          unresolved.
      selected_evidence:
        snippet: Fasting CCK was higher in those with full/subthreshold ARFID versus HCs with a large
          effect
