        causal_link_type: DIRECT
        description: 'The same transcription factors act outside the eye, which is why Axenfeld-Rieger
          syndrome carries a recurring extraocular bundle. This edge is drawn from the transcription-factor
          node rather than from the periocular mesenchyme node because not every systemic feature - the
          umbilical defect in particular - is a periocular mesenchyme derivative.

          '
      selected_evidence:
        snippet: 'The most commonly observed systemic anomalies include: umbilical defects; craniofacial
          dysmorphism; dentofacial abnormalities, such as Class III malocclusion due to maxillary hypoplasia,
          oligodontia, dental malformations (taurodontism, root dysplasia), microdontia, hypodontia, and
          anodontia; hearing impairment (partial or complete sensorineural hearing loss); and cardiac
          anomalies, including non-congenital heart disease and mitral valve insufficiency.'
        supports: SUPPORT
