              id: MONDO:0011211
              label: axial spondylometaphyseal dysplasia
        context: []
      assertion_type: Treatment
      assertion:
        name: Respiratory surveillance and supportive care
        description: The thoracic constriction is what threatens life in the skeletal dysplasias of this
          class, so respiratory function is followed rather than treated. No disease-specific respiratory
          intervention has been reported for axial SMD.
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: The evidence above establishes the respiratory risk, not the management of it. No treatment
          study exists for this disease and no source recommends a specific respiratory intervention,
          so the surveillance recommendation still rests on the mechanism in the pathograph rather than
          on a trial. An earlier version of this entry said nothing quotable existed at all; that was
          only true because PMID:21910225 had not been cited.
      selected_evidence:
        snippet: The main clinical findings are postnatal growth failure, rhizomelic short stature in
          early childhood evolving into short trunk in late childhood, and thoracic hypoplasia that may
          cause mild to moderate respiratory problems in the neonatal period and later susceptibility
          to airway infection.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
