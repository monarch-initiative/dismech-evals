    evidence_metadata:
      reference: PMID:21910225
      reference_title: 'Axial spondylometaphyseal dysplasia: additional reports.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes that there is something to survey for - neonatal respiratory problems
        and later airway-infection susceptibility - which is what makes respiratory surveillance indicated.
        It does not evaluate an intervention. Graded INDIRECT because the claim follows from the quoted
        risk by an inference step rather than being asserted: the sentence states the hazard, not that
        surveillance for it is beneficial.'
