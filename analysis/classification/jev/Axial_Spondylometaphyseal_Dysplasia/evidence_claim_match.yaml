        association: Causative
        relationship_type: CAUSATIVE
        notes: Formerly C21orf2, also LRRC76; 21q22.3. Five biallelic alleles in the original series (three
          missense, two splicing, with the splicing effects confirmed at RNA level). The gene also causes
          isolated retinal dystrophy with macular staphyloma, Jeune syndrome, and has been associated
          with amyotrophic lateral sclerosis, so the genotype does not predict this entity. In the largest
          CFAP410 series only 22.4 per cent of patients had skeletal features consistent with axial SMD.
      selected_evidence:
        snippet: We conducted whole exome sequencing and identified C21orf2 (chromosome 21 open reading
          frame 2) as a disease gene for axial SMD.
