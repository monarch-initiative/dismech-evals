  a1666d52679f4d2e56d98c393b2ef5cfb80aaf8dbf00b98c76e9b08aad6c48cb:
    claim:
      about:
        disease:
          name: Axial Spondylometaphyseal Dysplasia
          disease_term:
            preferred_term: axial spondylometaphyseal dysplasia
            term:
              id: MONDO:0011211
              label: axial spondylometaphyseal dysplasia
        context: []
      assertion_type: Genetic
      assertion:
        name: NEK1
        gene_term:
          preferred_term: NEK1
          term:
            id: hgnc:7744
            label: NEK1
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'The second locus, and the CFAP410 binding partner. Reported as compound heterozygous c.3107C>G
          (p.S1036*) and c.3830A>C (p.D1277A). NEK1 variants also cause short-rib thoracic dystrophy,
          which lacks the retinal dystrophy, so the presence or absence of retinal involvement is what
          separates the NEK1 disorders clinically. Genetic heterogeneity beyond these two genes is likely:
          patients without a CFAP410 variant remained unexplained in the original series.'
      selected_evidence:
        snippet: NEK1 mutations have previously been found in three types of short rib thoracic dystrophy,
          which have no retinal dystrophy.
        supports: SUPPORT
    origin:
