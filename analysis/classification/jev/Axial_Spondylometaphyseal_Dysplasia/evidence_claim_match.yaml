      assertion:
        name: Progressive Photoreceptor Degeneration
        biological_scale: TISSUE
        description: 'The retinal phenotype is progressive, unlike the skeletal one, and visual function
          deteriorates rapidly once it comes to attention.

          Read the cone-rod and rod-cone labels carefully here, because they are not two populations.
          In the clinically defined axial SMD series the SAME patients are called retinitis pigmentosa
          or pigmentary retinal degeneration on fundoscopy and cone-rod dystrophy on electroretinogram
          - the two names are two instruments looking at one retina. The roughly two-to-one cone-rod majority
          reported in the large CFAP410 ophthalmic cohort is a different observation, in a population
          ascertained through eye clinics rather than through the skeletal phenotype.'
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
      selected_evidence:
        snippet: A cone-rod dystrophy pattern was observed roughly two times more commonly than rod-cone
          dystrophy.
