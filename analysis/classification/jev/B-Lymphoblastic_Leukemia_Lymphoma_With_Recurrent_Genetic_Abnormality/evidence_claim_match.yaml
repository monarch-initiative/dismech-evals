      assertion_type: Subtype
      assertion:
        name: Ph-like
        display_name: BCR::ABL1-like / Philadelphia chromosome-like B-ALL/LBL
        classification: kinase-activated expression subtype
        description: 'B-ALL/LBL with a gene-expression signature resembling BCR::ABL1-positive disease
          but lacking the BCR::ABL1 fusion. Lesions commonly activate cytokine-receptor, ABL-class, or
          JAK-STAT signaling and may guide targeted kinase-inhibitor trials. The 2022 ICC further subdivides
          this subtype into two therapeutically relevant arms by activated pathway: an ABL-class (ABL1/ABL2/CSF1R/PDGFRB)
          rearranged arm amenable to ABL-directed TKIs and a JAK-STAT-activated arm (CRLF2/EPOR rearrangement,
          JAK2 or IL7R lesions) amenable to JAK inhibition.'
        subtype_term:
          preferred_term: BCR::ABL1-like B-ALL/LBL
          term:
            id: NCIT:C129787
            label: B Lymphoblastic Leukemia/Lymphoma, BCR-ABL1-Like
      selected_evidence:
        snippet: This is particularly true in the case of Philadelphia-like (Ph-like) ALL, a major subset
          which has the same gene expression signature as Philadelphia chromosome-positive ALL but lacks
          BCR-ABL1 translocation.
        supports: SUPPORT
