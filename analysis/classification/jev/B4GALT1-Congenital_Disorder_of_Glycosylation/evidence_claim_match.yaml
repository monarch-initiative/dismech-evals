      assertion_type: ICIMDAssignment
      assertion:
        classification_value: n_linked_protein_glycosylation
        notes: 'B4GALT1-CDG presents with a type 2 serum transferrin isoform pattern, which is by definition
          a defect in the processing of N-linked glycans, and the disease''s original designation was
          CDG-IId. Recorded with one caveat that the single-category assignment cannot express: beta-1,4-galactosyltransferase
          1 transfers galactose onto terminal N-acetylglucosamine wherever it occurs, so O-linked glycans
          and glycolipids are substrates too. The N-linked assignment names where the defect is diagnosed
          and best characterised, not the full extent of the enzyme''s reach.'
      selected_evidence:
        snippet: All patients had shared clinical features including hypotonia, coagulopathy, elevated
          serum transaminases, and a biochemical type 2 pattern on serum transferrin isoform analysis
        supports: SUPPORT
