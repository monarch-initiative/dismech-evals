      assertion_type: Pathophysiology
      assertion:
        name: B4GALT1 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: The initiating lesion. Biallelic B4GALT1 variants abolish functional beta-1,4-galactosyltransferase
          1. In the index patient a single-nucleotide insertion caused premature termination and loss
          of the C-terminal 50 amino acids, and the resulting truncated polypeptide was mislocalised -
          it stayed in the endoplasmic reticulum instead of reaching the Golgi, so the enzyme was absent
          from the compartment where it works as well as being catalytically dead.
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
        - preferred_term: B4GALT1
          term:
            id: hgnc:924
            label: B4GALT1
        cellular_components:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
      selected_evidence:
        snippet: Sequencing of the beta4GalT I cDNA and gene revealed an insertion of a single nucleotide
          (1031-1032insC) leading to premature translation stop and loss of the C-terminal 50 amino acids
          of the enzyme.
        supports: SUPPORT
