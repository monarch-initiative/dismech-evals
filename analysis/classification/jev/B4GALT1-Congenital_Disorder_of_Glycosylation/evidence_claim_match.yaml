      assertion:
        name: B4GALT1
        gene_term:
          preferred_term: B4GALT1
          term:
            id: hgnc:924
            label: B4GALT1
        relationship_type: CAUSATIVE
        notes: 'Biallelic. Three variants are published: c.1031dupC p.(Arg345fs), the frameshift in the
          index patient; c.579C>G p.(Tyr193Ter), a nonsense allele; and a third within the transmembrane
          domain, reported in 2020. The transmembrane variant is notable because the two earlier alleles
          both truncate the catalytic region, whereas this one implicates the membrane anchor that holds
          the enzyme in the Golgi.'
      selected_evidence:
        snippet: The novel mutation is the third disease-causing variant described in B4GALT1, and the
          first one within its transmembrane domain.
        supports: SUPPORT
