        name: Germline BARD1 Loss of Function
        description: Heterozygous germline nonsense, frameshift, copy-number and selected missense variants
          reduce functional BARD1. BARD1 is required for the ubiquitin ligase activity of the BRCA1-BARD1
          RING heterodimer; individually, BRCA1 and BARD1 have very low ligase activity in vitro. ClinGen
          describes the pathogenic mechanism as loss of function with disrupted BRCA1 binding and loss
          of DNA damage response. In isogenic neuroblastoma and RPE1 cells, single-allele truncating variants
          were sufficient to reduce repair efficiency (haploinsufficiency).
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        gene:
          preferred_term: BARD1
