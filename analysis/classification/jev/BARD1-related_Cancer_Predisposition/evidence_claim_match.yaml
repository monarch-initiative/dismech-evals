        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic BARD1 Second-Hit Inactivation
        description: Loss of the wild-type BARD1 allele is documented in a subset of carrier tumors but
          has not been shown to be universal. In a French case-control study, two of seven interpretable
          carrier breast tumors (both triple-negative primaries) showed loss of heterozygosity with an
          HRD phenotype, a metastasis showed LOH without HRD, and non-triple-negative primaries had neither.
          In a child with a germline BARD1 frameshift and refractory neuroblastoma, mono-allelic expression
          of the variant and loss of BARD1 protein on immunohistochemistry indicated biallelic loss in
          the tumor.
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        conforms_to: germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type
          Allele
        genetic_context:
          gene:
            preferred_term: BARD1
            term:
              id: hgnc:952
              label: BARD1
          variant_origin: SOMATIC
          functional_impact_category: LOSS_OF_FUNCTION
          description: Loss of heterozygosity or other inactivation of the remaining allele in a subset
            of carrier-associated tumors.
      selected_evidence:
        snippet: Among these, two triple-negative (TN) primary tumors exhibited both biallelic BARD1 inactivation
          via loss of heterozygosity (LOH) and an HRD phenotype; one metastasis displayed LOH without
          HRD. All non-TN primary tumors lacked both biallelic inactivation and HRD.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
