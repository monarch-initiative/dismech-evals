        kind: CONTROVERSY
        attaches_to:
        - disease#
        prompt: Do germline BARD1 loss-of-function variants increase ovarian cancer risk?
        rationale: Most case-control data do not support an ovarian association, and ClinGen curated BARD1
          and familial ovarian cancer (MONDO:0016248) as a separate gene-disease pair classified Disputed.
          One study (Norquist 2016) reported BARD1 variants as more common in ovarian carcinoma than in
          population databases, cautioning that two of its BARD1 carriers also carried BRCA1 variants.
          Ovarian cancer is therefore not recorded as a phenotype of this entry.
      selected_evidence:
        snippet: These results are interpreted with some caution as two of the BARD1 mutation carriers
          also had mutations in BRCA1 (eTable1).
        supports: REFUTE
