        prompt: Is there a constitutional biallelic BARD1 phenotype in humans?
        rationale: Bard1-null mice die between E7.5 and E8.5, and a 2022 review states that BARD1 is not
          a classic Fanconi anemia gene. A PubMed search, BARD1[ti] AND (biallelic[tiab] OR homozygous[tiab]
          OR compound heterozygous[tiab]), returned six records, none of which describes a person with
          constitutional biallelic BARD1 variants. Whether biallelic loss is compatible with human development,
          and with what phenotype, is unknown.
      selected_evidence:
        snippet: These mice become developmentally retarded and die between embryonic day 7.5 (E7.5) and
          E8.5.
        supports: SUPPORT
