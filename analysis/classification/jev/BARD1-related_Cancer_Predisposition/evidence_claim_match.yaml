        description: BRCA1-BARD1 binds DNA and RAD51 and stimulates RAD51-mediated synaptic-complex assembly
          during homologous recombination. BARD1 variants that are non-functional in homology-directed-repair
          reporter assays sensitize cells to ionizing radiation and cisplatin, and this assay separates
          known pathogenic from known benign BARD1 variants.
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        conforms_to: dna_repair_synthetic_lethality#HRR or FA/BRCA Repair Deficiency
        biological_processes:
        - preferred_term: double-strand break repair via homologous recombination
          term:
            id: GO:0000724
            label: double-strand break repair via homologous recombination
          modifier: DECREASED
      selected_evidence:
        snippet: Two known benign variants were found to be functional in HDR, and three known pathogenic
          variants were non-functional, supporting the notion that the HDR assay can be used to predict
          the clinical risk of BARD1 variants.
        supports: SUPPORT
