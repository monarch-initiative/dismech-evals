      assertion_type: Discussion
      assertion:
        discussion_id: bard1_neuroblastoma_common_vs_rare
        kind: KNOWLEDGE_GAP
        attaches_to:
        - phenotypes#Neuroblastoma
        prompt: How large is the neuroblastoma risk for a heterozygous BARD1 loss-of-function carrier,
          and should carriers be surveilled in childhood?
        rationale: Two signals must be kept apart. Common BARD1 polymorphisms at 2q35 are associated with
          high-risk neuroblastoma in GWAS; this is polygenic susceptibility, not this Mendelian entity.
          Separately, rare germline pathogenic or likely pathogenic BARD1 variants and BARD1-disrupting
          copy-number variants are enriched in neuroblastoma patients, and ClinGen lumps neuroblastoma
          into this entity on that case-control evidence. The case-control odds ratios are wide (OR 32.30,
          95% CI 6.44 to 310.35 in 786 patients; OR 6.3, 95% CI 2.4 to 13.9 in a pediatric pan-cancer
          analysis whose cohort overlap with the first study was not assessed here). Absolute childhood
          penetrance is not reported in these sources, and no source used here gives a neuroblastoma surveillance
          recommendation for carrier children.
      selected_evidence:
        snippet: These data show that common variation in BARD1 contributes to the etiology of the aggressive
          and most clinically relevant subset of human neuroblastoma.
        supports: SUPPORT
