  ab6f5298df8be67b45c15758421b8c1d0dd2b86cecd6d995698524c990afb544:
    claim:
      about:
        disease:
          name: BBOX1-Related Carnitine Biosynthesis Deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: BBOX1
        gene_term:
          preferred_term: BBOX1
          term:
            id: hgnc:964
            label: BBOX1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        frequency: All three reported patients
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: BBOX1 maps to 11p14.2 and encodes a 387-amino-acid cytosolic dioxygenase. Note that the
          2025 report states the gene is on the short arm of chromosome 14; that is an error in the paper,
          and both HGNC and the earlier deletion case place BBOX1 at 11p14.2. The p.Gly263Arg allele reaches
          about 1% frequency in the Indigenous Background Variant Library and may be a founder variant,
          so its interpretation in First Nations patients requires population-matched frequency data rather
          than gnomAD alone.
        variants:
        - name: NM_003986.3:c.176A>G (p.Asp59Gly)
          description: Paternally inherited missense allele in family 1, predicted damaging by SIFT, PolyPhen-2
            and CADD. The equivalent C. elegans allele retained normal function, so this allele is best
            regarded as hypomorphic.
        - name: NM_003986.3:c.675delA (p.Gly227Valfs*6)
          description: Maternally inherited frameshift allele in family 1, predicted to truncate the protein
            at 231 residues.
        - name: NM_003986.3:c.787G>A (p.Gly263Arg)
          description: Homozygous missense allele in the family 2 proband; present at about 1% in the
            Indigenous Background Variant Library and possibly a founder variant.
      selected_evidence:
        snippet: revealed a homozygous variant of uncertain significance in BBOX1 NM_003986.3:c.787G>A
          (p.Gly263Arg)
        supports: SUPPORT
