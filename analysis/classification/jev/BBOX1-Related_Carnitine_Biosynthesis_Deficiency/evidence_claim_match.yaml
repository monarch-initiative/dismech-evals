            genes:
            - preferred_term: BBOX1
              term:
                id: hgnc:964
                label: BBOX1
            description: 'CRISPR/Cas9 knockout of gbh-1, the C. elegans orthologue of BBOX1 (33% sequence
              identity, with the residues altered in the patients invariant across species). The strain
              has no L-carnitine, more than 50-fold elevated gamma-butyrobetaine and an absent acylcarnitine
              spectrum, and shows nutrition-dependent embryonic lethality that is fully rescued by exogenous
              L-carnitine. Its value is that the worm''s exogenous carnitine supply can be controlled
              - an E. coli caiA mutant that cannot make carnitine was used to remove it - which is the
              manipulation that separates the biosynthetic defect from dietary compensation. Its limits
              are the obvious ones: an invertebrate, a null rather than a patient allele, and an embryonic-lethality
              readout that has no counterpart in the human phenotype.'
            publication: PMID:41022783
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Blocked Final Step of Endogenous L-Carnitine Biosynthesis
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: 'Complete loss of the orthologous enzyme reproduces the selective terminal block:
          no L-carnitine, accumulated gamma-butyrobetaine, unchanged upstream precursors.'
        limitations: Invertebrate system with a null allele; the corresponding human patients are hypomorphic
          compound heterozygotes or homozygotes for a missense allele, and no human tissue measurement
          of the biosynthetic block exists.
        readouts:
        - name: L-carnitine level by HPLC-MS
          target: Blocked Final Step of Endogenous L-Carnitine Biosynthesis
          direction: ABOLISHED
          interpretation: Undetectable L-carnitine is the direct product-side readout of the terminal
            block.
        - name: Gamma-butyrobetaine level by HPLC-MS
          target: Blocked Final Step of Endogenous L-Carnitine Biosynthesis
          direction: INCREASED
          interpretation: Substrate accumulation above 50-fold is the substrate-side readout of the same
            block.
      selected_evidence:
        snippet: we observed a lethal embryonic phenotype for the gbh-1 loss-of-function strains, which
          was rescued upon L-carnitine supplementation
        supports: SUPPORT
