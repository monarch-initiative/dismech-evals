        notes: 'Left unbound deliberately. HPO has no term for fasting intolerance: a search of the HP
          label cache for "fasting" returns only HP:0003162 "Fasting hypoglycemia", and binding that would
          assert hypoglycemia, which is the one thing this report contradicts itself about. The prose
          states "Hypoglycemia was not documented" for this patient while Table 1 marks hypoglycemia "+"
          in his column. The prose side is carried as a REFUTE evidence item above; the Table 1 side is
          recorded here rather than as a snippet, because that table''s columns are separated by em spaces
          and a single cell is not a quotable propositional sentence. Either way the disagreement stays
          visible instead of being settled by the choice of ontology term.'
      selected_evidence:
        snippet: Hypoglycemia was not documented, and symptoms improved as he reached childhood.
        supports: REFUTE
        directness: DIRECT
