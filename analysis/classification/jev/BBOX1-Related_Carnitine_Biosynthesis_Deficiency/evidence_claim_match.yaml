  d31cab19278f61c750364724e5240b0a5ea8d12253657c6e0bf0bd8e6b80c3d8:
    claim:
      about:
        disease:
          name: BBOX1-Related Carnitine Biosynthesis Deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
        biological_scale: CELLULAR
        description: 'With less carnitine available, the carnitine shuttle carries fewer activated long-chain
