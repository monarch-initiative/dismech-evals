    claim:
      about:
        disease:
          name: BBOX1-Related Carnitine Biosynthesis Deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Carnitine Transport Inhibition by Gamma-Butyrobetaine
        biological_scale: CELLULAR
        description: Hypothesised second pathogenic arm in which accumulated gamma-butyrobetaine is itself
          harmful rather than merely a marker of the block. In C. elegans, exposure of gbh-1 loss-of-function
          strains to millimolar gamma-butyrobetaine caused complete embryonic lethality even on carnitine-producing
          bacteria, which is the observation the toxicity proposal rests on. The suggested mechanism -
          competitive inhibition of the carnitine transporter, which would deepen the intracellular carnitine
          deficit - has not been demonstrated directly in either system.
        biological_processes:
        - preferred_term: carnitine transmembrane transport
          term:
            id: GO:1902603
            label: carnitine transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: Presumed mechanisms of toxicity could be chemical or by competitive inhibition of the
          carnitine transporter, which would further aggravate the intracellular carnitine deficiency.
        supports: SUPPORT
        directness: INDIRECT
