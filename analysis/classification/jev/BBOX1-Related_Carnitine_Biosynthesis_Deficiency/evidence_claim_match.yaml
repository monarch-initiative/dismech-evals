  cf5ae45944bedd10942a6b3c3f96112b41f98d017b20d4bccbff9470c30ef771:
    claim:
      about:
        disease:
          name: BBOX1-Related Carnitine Biosynthesis Deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bbox1_worm_model_translational_validity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Can the C. elegans gbh-1 model support causal claims about human BBOX1 disease when the
          worm equivalent of the patients' compound-heterozygous genotype is phenotypically normal?
        attaches_to:
        - animal_models#gbh-1 patient-allele knock-in C. elegans
        - pathophysiology#Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
        rationale: 'The worm model carries most of the causal weight in this first report: it is where
          the biosynthetic block, the substrate accumulation and the carnitine rescue are demonstrated.
          Yet the strain modelling p.Asp59Gly behaves as wild type on every assay, and the trans-heterozygote
          reproducing the family 1 genotype shows no lethality even under starvation, so the model does
          not reproduce the disease state of the two most fully characterised patients. The human data
          are also partly discordant with a downstream fatty-acid-oxidation block: patient 1''s palmitate-loaded
          fibroblasts had a normal acylcarnitine profile, whereas the worm strains lose the acylcarnitine
          pool entirely. This is a mismatch of translational validity rather than an absence of evidence
          - the experiments were done, and they do not line up - so it is curated as HUMAN_MODEL_MISMATCH.
          Resolving it needs a mammalian model or a human tissue-level measurement of carnitine-dependent
          fatty acid oxidation.'
        proposed_experiments:
        - experiment_id: exp_bbox1_muscle_fao_flux
          name: Human muscle carnitine and fatty-acid-oxidation flux in a BBOX1 patient
          description: Measure muscle total and free carnitine plus long-chain fatty acid oxidation flux
            in a biopsy from a molecularly confirmed patient sampled before starting or after a supervised
            washout of L-carnitine, against matched controls. This is the measurement that would put the
            human arm of the shuttle step on direct evidence rather than on inference from carnitine's
            known role, and it would also address the discordance with the normal fibroblast acylcarnitine
            profile, since fibroblasts are not the tissue in which the phenotype manifests.
          would_support:
          - pathophysiology#Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
          supporting_outcome:
          - Reduced muscle carnitine content with reduced long-chain fatty acid oxidation flux relative
            to controls, correcting on resupplementation, would establish the shuttle step in human tissue.
          would_refute:
          - pathophysiology#Reduced Carnitine Shuttle Flux and Impaired Fatty Acid Beta-Oxidation
          refuting_outcome:
          - Normal muscle carnitine content and normal oxidation flux despite low plasma carnitine would
            locate the myopathy outside the carnitine shuttle and force a different account of the muscle
            phenotype.
      selected_evidence:
        snippet: By contrast, gbh-1(D72G) mutants displayed wild-type embryonic viability under all conditions
          tested
        supports: SUPPORT
