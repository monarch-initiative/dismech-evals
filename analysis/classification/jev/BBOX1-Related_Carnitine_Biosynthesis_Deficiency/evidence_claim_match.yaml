      assertion:
        name: Systemic L-Carnitine Deficiency
        biological_scale: ORGANISM
        description: Free and total L-carnitine are persistently low in serum and dried blood spots. Critically,
          the renal fractional excretion of carnitine is normal, so the deficiency is one of failed production
          rather than of renal wasting; this was used clinically to exclude SLC22A5 transporter deficiency
          in the index patients. Loss of the biosynthetic arm alone is sufficient to lower circulating
          carnitine because dietary intake and tubular reabsorption do not fully compensate in these individuals.
        biological_processes:
        - preferred_term: carnitine metabolic process
          term:
            id: GO:0009437
            label: carnitine metabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: L-carnitine transporter and fatty acid oxidation-related L-carnitine deficiency were
          ruled out by normal renal excretion fraction of L-carnitine
        supports: SUPPORT
