  5bdfe07a32cf9b93a3389e8bfc2e0361babd01ce0ddae8a9e1920a2a8225b7e9:
    claim:
      about:
        disease:
          name: BBOX1-Related Carnitine Biosynthesis Deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Blocked Final Step of Endogenous L-Carnitine Biosynthesis
        biological_scale: MOLECULAR
        description: 'Endogenous L-carnitine synthesis proceeds in four enzymatic steps from 6-N-trimethyllysine
          and takes place mainly in liver, brain and kidney. With BBOX1 inactive the pathway is blocked
          at the final step: metabolites upstream of gamma-butyrobetaine are essentially unchanged while
          the immediate substrate accumulates and the product is not made. This selective, single-step
          blockade is what the C. elegans metabolomics demonstrates directly.'
        biological_processes:
        - preferred_term: carnitine biosynthetic process
          term:
            id: GO:0045329
            label: carnitine biosynthetic process
          modifier: DECREASED
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Endogenous synthesis of L-carnitine occurs mainly in the liver, brain, and kidneys in
          a four-step enzymatic pathway, with 6-N-trimethyllysine (TML) as the initial substrate.
        supports: SUPPORT
    origin:
