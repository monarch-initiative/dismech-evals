  9a70b07b0b062f4123b1f5e65af893f5a26c28e1c3559de8ed7f56c68b06c91b:
    claim:
      about:
        disease:
          name: BBOX1-Related Carnitine Biosynthesis Deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bbox1_neuropsychiatric_attribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Are the neurodevelopmental and psychiatric features mechanistically caused by BBOX1 deficiency,
          and if so through what route - brain carnitine depletion, gamma-butyrobetaine toxicity, or neither?
        attaches_to:
        - phenotypes#Autism Spectrum Disorder
        - phenotypes#Psychosis
        - pathophysiology#Gamma-Butyrobetaine Accumulation
        rationale: 'The report singles out neurodevelopmental and psychiatric manifestations as specific
          to BBOX1 deficiency, in contrast to the myopathic features it shares with SLC22A5 disease. But
          no mechanistic route is curated here because none has been demonstrated: the supporting arguments
          offered are an association of BBOX1 polymorphisms with schizophrenia susceptibility and downregulation
          of BBOX1 in a mouse schizophrenia model, neither of which establishes that carnitine depletion
          or substrate accumulation in the brain produces these features. The cohort is three patients
          from two families with heterogeneous presentations - autism and learning difficulty in one,
          psychosis in another, anxiety in two - which is not enough to separate a causal effect from
          coincidence. TMLHE deficiency at the first step of the same pathway carries a comparable and
          similarly unresolved autism association, so this is a pathway-level question rather than a BBOX1-specific
          one.'
      selected_evidence:
        snippet: additional neurodevelopmental and psychiatric manifestations seem to be specifically
          related to BBOX1 deficiency
        supports: SUPPORT
        directness: INDIRECT
