  446c7022ea79d0605e6dae9eef642bb5c1707541d0cb1789e140ae72677864c9:
    claim:
      about:
        disease:
          name: BBOX1-Related Carnitine Biosynthesis Deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bbox1_genotype_phenotype_penetrance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does biallelic loss of BBOX1 reliably cause clinical disease, or is the myopathic and
          neuropsychiatric phenotype dependent on modifiers, dietary carnitine intake, or ascertainment?
        attaches_to:
        - pathophysiology#BBOX1 Loss of Function
        - pathophysiology#Systemic L-Carnitine Deficiency
        rationale: 'Three lines of evidence pull against a simple fully-penetrant model. An individual
          homozygous for a 221 kb 11p14.2 deletion removing BBOX1 outright had only a borderline-low free
          carnitine, a normal acylcarnitine-to-free-carnitine ratio and none of the classic carnitine-deficiency
          manifestations, and the authors of that report concluded that dietary intake and renal reabsorption
          suffice for carnitine homeostasis. Homozygous predicted-truncating BBOX1 alleles are present
          in gnomAD. And the family 1 patients are compound heterozygous for an allele that retains function
          in the orthologous worm assay. Since the biosynthetic arm is only one of three inputs to carnitine
          homeostasis, dietary carnitine intake is a plausible modifier that no reported case controls
          for. Resolving this matters for whether BBOX1 should be added to metabolic gene panels and for
          how a homozygous truncating variant found incidentally should be reported.

          A fourth line, and the one most specific to this cohort: two of the three patients carry additional
          variants in fatty-acid-oxidation genes, and the causal chain proposed here runs through carnitine-dependent
          fatty acid oxidation, so those variants are candidate confounders rather than incidental findings.
          Patient 3 is homozygous for CPT1A NM_001876.4:c.1436C>T (p.Pro479Leu), which the authors state
          is associated with a mild form of carnitine palmitoyl transferase I deficiency and puts homozygotes
          at risk of fasting hypoglycemia; the same authors note that patient 3''s symptoms have not been
          associated with that variant, so this is a confound they considered and argued against rather
          than one they overlooked. The variant is common in the Indigenous Background Variant Library
          at roughly 11% allele frequency, which matters for how much weight a rarity-based pathogenicity
          argument can carry in this population. Patient 1 additionally carries a heterozygous ACADL frameshift
          (NM_001608.4:c.1018_1019del, p.His340Tyrfs*16) and an RYR1 variant of uncertain significance
          (NM_000540.3:c.10171G>A, p.Glu3391Lys) - the first in long-chain acyl-CoA dehydrogenase, immediately
          downstream of the carnitine shuttle, and the second in a gene whose phenotypes include exercise
          intolerance and myopathy, which are this entry''s most consistent features. Neither is called
          causal by the authors, and a single heterozygous ACADL allele is not expected to be, but in
          a three-patient cohort they bound how confidently any individual feature can be attributed to
          BBOX1 alone.'
      selected_evidence:
        snippet: This condition results in mildly decreased free carnitine level, but not in clinical
          manifestations characteristic of carnitine deficiency disorders, suggesting that dietary carnitine
          intake and renal reabsorption are sufficient to carnitine homeostasis.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:24986124
      reference_title: The effect of homozygous deletion of the BBOX1 and Fibin genes on carnitine level
