  92b826a820b32b5df77ad106062bc6e3e920344ee478194e13e6e474a56bdb90:
    claim:
      about:
        disease:
          name: BBOX1-Related Carnitine Biosynthesis Deficiency
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: gamma_butyrobetaine_toxicity
        hypothesis_label: Gamma-butyrobetaine is independently toxic, not merely a marker
        status: EMERGING
        description: 'Under this model the accumulated substrate contributes to disease in its own right,
          in parallel with the carnitine deficit, plausibly by competing with carnitine for cellular uptake
          and so deepening the intracellular deficiency. The evidence is a C. elegans exposure experiment
          in which millimolar gamma-butyrobetaine killed gbh-1 null and functionally null embryos even
          on carnitine-producing bacteria, plus the clinical observation that gamma-butyrobetaine stays
          elevated on L-carnitine treatment. It is curated as EMERGING rather than canonical because the
          transporter-competition step is labelled presumed by the authors, the lethality data are invertebrate,
          and no human outcome has been shown to track gamma-butyrobetaine level. It matters therapeutically:
          if true, normalising carnitine alone would leave part of the disease untreated.'
      selected_evidence:
        snippet: Translating results from the nematode model to human disease further allows the assumption
          that both L-carnitine deficiency and accumulation of γ-BB play an independent but synergistic
          role in the pathogenesis of human BBOX1 deficiency.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:41022783
      reference_title: Biallelic variants in BBOX1 cause L-Carnitine deficiency and elevated γ-butyrobetaine.
      evidence_source: MODEL_ORGANISM
      explanation: States the two-arm hypothesis and, in the authors' own hedging, its status as an assumption
