          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Proteomics and lipidomics on isolated outer segments show BBSome destabilisation,
            membrane-protein accumulation and raised cholesterol after Bbs1 loss, the cargo and lipid
            disturbance this node describes.
          limitations: Complete Bbs1 null in a cone-dominant zebrafish retina; the human non-syndromic
            alleles are hypomorphic, and outer-segment lipid handling may differ between fish and human
            photoreceptors.
          readouts:
          - name: Outer-segment membrane-protein accumulation
            target: Photoreceptor outer-segment cargo and lipid dysregulation
            direction: INCREASED
            interpretation: Membrane-associated proteins, enriched for lipid-homeostasis factors, accumulate
              in outer segments lacking a stable BBSome.
          - name: Outer-segment cholesterol content
            target: Photoreceptor outer-segment cargo and lipid dysregulation
            direction: INCREASED
            interpretation: Outer-segment lipid composition is disrupted with excess cholesterol.
