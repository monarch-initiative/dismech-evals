          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: TISSUE
          description: Early visual deficits precede progressive outer-segment morphological anomalies,
            reproducing the degenerative sequence but not its rod-first order.
          limitations: Zebrafish retina is cone-dominant and regenerates, so the rod-first progression
            and irreversibility that define the human node are not modelled; the abstract reports morphological
            anomalies rather than photoreceptor loss.
          readouts:
          - name: Visual function
            target: Progressive rod-first photoreceptor degeneration
            direction: DECREASED
            interpretation: Functional visual deficits appear early, before structural change.
      selected_evidence:
        snippet: Using a bbs1 zebrafish mutant, we show that retinal development and photoreceptor differentiation
          are unaffected by Bbs1-loss, supported by an initially unaffected transcriptome.
        supports: SUPPORT
