        prompt: When should a retina-dominant BBS-gene presentation remain in an isolated-RP class rather
          than be classified as mild Bardet-Biedl syndrome?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - definitions#BBSome-related isolated-RP scope
        - differential_diagnoses#Bardet-Biedl syndrome
        rationale: Published cohorts span apparently nonsyndromic RP, very mild extra-ocular disease,
          and full BBS. Age at assessment and the intensity of systemic phenotyping can change the label.
          This entry therefore uses a mechanism-based lump while retaining the clinical boundary as uncertain.
      selected_evidence:
        snippet: The patients exhibited clinical heterogeneity, from patients with all six primary clinical
          components to patients suffering from non-syndromic RP.
        supports: SUPPORT
