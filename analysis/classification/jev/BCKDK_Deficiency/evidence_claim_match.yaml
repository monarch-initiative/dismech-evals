              label: branched-chain keto acid dehydrogenase kinase deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: BCKDK pathogenic variants
        gene_term:
          preferred_term: BCKDK
          term:
            id: hgnc:16902
            label: BCKDK
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: p.Arg156* and p.M74fs (null variants)
          description: 'The original report identified a nonsense variant (C466T; premature stop at position
            156, p.Arg156*) in family 558 and a single-base deletion (c.G222del) causing a frameshift
            terminating the protein at position 74 (p.M74fs) in family 18. Both are null, homozygous,
            loss-of-function variants segregating recessively.

            '
        - name: p.Arg224Pro (missense)
          description: 'A missense variant (c.G671C) substituting a highly conserved arginine with proline
            at position 224 was identified in a third family; structural modeling predicted disruption
            of the kinase domain. Missense variants caused less severe plasma BCAA reductions than null
            variants.

            '
        - name: c.999_1001delCAC (p.Thr334del)
          description: 'A homozygous in-frame deletion (c.999_1001delCAC; p.Thr334del) was identified
            in three siblings; functional tests in transfected cells demonstrated BCKDH hyperactivity
            and BCAA over-consumption.

            '
        features: 'BCKDK deficiency is caused by biallelic loss-of-function variants in BCKDK (chromosome
          16p11.2), encoding the mitochondrial branched-chain ketoacid dehydrogenase kinase. Reported
          variants include null (nonsense, frameshift), missense, and in-frame deletion alleles; null
          variants produce more profound plasma BCAA reductions than missense alleles. Early families
          were consanguineous, consistent with recessive segregation.

          '
      selected_evidence:
        snippet: In each of these families, we identified a distinct, null, homozygous mutation in the
          gene Branched Chain Ketoacid Dehydrogenase Kinase (BCKDK).
        supports: SUPPORT
