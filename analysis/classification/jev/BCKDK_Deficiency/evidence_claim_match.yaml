          catabolic flux?'
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced BCAA-derived nitrogen delivery and brain nutrient-stress response
        - pathophysiology#Aberrant catabolic flux beyond simple BCAA insufficiency
        rationale: New mouse results bridge systemic depletion to brain metabolism, while genetic rescue
          indicates that excess pathway flux matters independently of the measured BCAA concentration.
          Human tissue-level evidence remains absent, and patient-derived neurons did not reproduce a
          major cell-autonomous phenotype.
      selected_evidence:
        snippet: Thus, in the non-growing adult constitutive BCKDH activation limits BCAA-derived nitrogen
          delivery to brain and alters AA transporters as part of an adaptive ISR during nutrient scarcity.
        supports: SUPPORT
