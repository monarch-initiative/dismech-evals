          relationship: READOUT_OF
          direction: NEGATIVE
          endpoint_context: DIAGNOSTIC
          interpretation: 'Low plasma BCAA reports the increased BCKDH-mediated catabolic flux resulting
            from loss of BCKDK inhibitory phosphorylation.

            '
      selected_evidence:
        snippet: a retrospective review of the newborn screening results allowed the identification of
          a strong decrease in BCAA concentrations on dried blood spots, suggesting that BCKDK is a new
          treatable metabolic disorder probably amenable to newborn screening programs.
        supports: SUPPORT
