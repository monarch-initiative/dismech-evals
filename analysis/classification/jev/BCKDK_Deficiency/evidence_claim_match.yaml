        context: []
      assertion_type: Treatment
      assertion:
        name: BCAA-enriched high-protein dietary supplementation
        description: The principal reported disease-directed intervention is a dietitian-directed high-protein
          diet plus oral leucine, isoleucine, and valine. In the largest human cohort, reported intake
          was at least 2 g protein/kg/day with total BCAA supplementation of 100–250 mg/kg/day; plasma
          BCAAs rose and motor function and head growth commonly stabilized or improved. Earlier reports
          found strong seizure control with less complete developmental response. These uncontrolled human
          observations should be interpreted separately from a 2024 mouse study in which enteral BCAAs
          raised systemic concentrations but worsened neurodevelopmental deficits and failed to correct
          the modeled pathway abnormality.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: amino acid supplementation
          term:
            id: NCIT:C15425
            label: Nutritional Supplementation
          therapeutic_agent:
          - preferred_term: leucine
            term:
              id: CHEBI:25017
              label: leucine
          - preferred_term: isoleucine
            term:
              id: CHEBI:24898
              label: isoleucine
          - preferred_term: valine
            term:
              id: CHEBI:27266
              label: valine
        target_phenotypes:
        - preferred_term: Motor delay
          term:
            id: HP:0001270
            label: Motor delay
        - preferred_term: Microcephaly
          term:
            id: HP:0000252
            label: Microcephaly
        - preferred_term: Seizure
          term:
            id: HP:0001250
            label: Seizure
        - preferred_term: Language impairment
          term:
            id: HP:0002463
            label: Language impairment
      selected_evidence:
        snippet: Behavioral and developmental skills of the patients improved to a lesser extent.
        supports: SUPPORT
