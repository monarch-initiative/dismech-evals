              id: MONDO:0013970
              label: branched-chain keto acid dehydrogenase kinase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant catabolic flux beyond simple BCAA insufficiency
        description: 'Recent mouse-model evidence challenges a purely "BCAA-insufficiency" model. In a
          Bckdk-deficient mouse, enteral BCAA supplementation raised systemic BCAA levels but exacerbated
          neurodevelopmental deficits and failed to correct biochemical abnormalities, suggesting that
          aberrant flux through the BCAA catabolic pathway (not just low BCAAs) contributes to disease.
          Genetic re-regulation of catabolism via Dbt haploinsufficiency partially rescued biochemical
          and behavioral phenotypes.

          '
        biological_processes:
        - preferred_term: branched-chain amino acid catabolic process
          term:
            id: GO:0009083
            label: branched-chain amino acid catabolic process
          modifier: INCREASED
      selected_evidence:
        snippet: These data suggest that aberrant flux through the BCAA catabolic pathway, not just BCAA
          insufficiency, may contribute to disease pathology.
        supports: SUPPORT
