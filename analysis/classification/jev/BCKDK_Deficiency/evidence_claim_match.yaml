  b9541bd49b90ccaac20900390a2100ab6ab3b8b6a08b9a88742f33b3177b7a3a:
    claim:
      about:
        disease:
          name: BCKDK Deficiency
          disease_term:
            preferred_term: BCKDK deficiency
            term:
              id: MONDO:0013970
              label: branched-chain keto acid dehydrogenase kinase deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced BCAA-derived nitrogen delivery and brain nutrient-stress response
        description: Constitutive peripheral BCAA oxidation limits the circulating precursor pool and
          reduces incorporation of BCAA-derived nitrogen into brain glutamate. During fasting, Bckdk-null
          brain activates the integrated stress response, increases Atf4 targets including Slc7a5, and
          reduces protein synthesis, whereas skeletal muscle is comparatively resilient. This supplies
          a mechanistic bridge between systemic amino-acid depletion and neurologic vulnerability but
          does not yet explain every human developmental feature.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: In contrast, Bckdk KO brains exhibited ISR activation during fasting, and up-regulation
          of Atf4 and its target genes, including Slc7a5 mRNA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
