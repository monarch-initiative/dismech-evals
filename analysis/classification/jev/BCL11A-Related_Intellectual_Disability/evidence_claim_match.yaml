            description: Heterozygous frameshift, stop-gain and splice variants, deletions of the gene,
              and a small number of missense variants. Missense variants clustered in the N-terminal region
              disrupt nuclear localization, dimerization and transcriptional regulatory activity of BCL11A;
              N-terminal C2HC zinc-finger variants increase proteasomal degradation, and a C-terminal
              zinc-finger variant abolishes DNA binding. All of these are loss-of-function alleles, and
              ClinGen and the founding report treat haploinsufficiency as the mechanism. BCL11A is a dedicated
              subunit of the BAF (SWI/SNF) chromatin-remodeling complex, which places the disorder among
              the BAFopathies.
