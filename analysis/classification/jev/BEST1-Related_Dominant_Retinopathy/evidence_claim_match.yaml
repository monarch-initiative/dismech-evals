      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autosomal recessive bestrophinopathy
        description: ARB shares RPE dysfunction, abnormal EOG, subretinal fluid, and vitelliform material
          with dominant BEST1 disease. Demonstration of biallelic pathogenic BEST1 variants rather than
          a single heterozygous variant is the defining molecular discriminator.
        distinguishing_features:
        - Biallelic pathogenic BEST1 variants support ARB; one heterozygous pathogenic variant supports
          dominant BEST1 disease.
        - ARB is often a more diffuse retinal disease than the BVMD-centered macular pattern modeled here.
        disease_term:
          preferred_term: autosomal recessive bestrophinopathy
          term:
            id: MONDO:0012733
            label: autosomal recessive bestrophinopathy
      selected_evidence:
        snippet: The diagnosis of autosomal recessive bestrophinopathy is established in a proband with
          suggestive findings and biallelic BEST1 pathogenic variants.
