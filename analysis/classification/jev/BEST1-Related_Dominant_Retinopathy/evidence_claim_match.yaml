          luminance response reminiscent of BVMD patients, together with fluid- and debris-filled retinal
          detachments and enhanced RPE lipofuscin accumulation, yet retain normal chloride conductances
          — indicating that the dominant disease is not simply loss of bestrophin-1 chloride-channel function.
          The knock-in phenotype is distinct from that of Best1 knockout mice (with respect to lipofuscin
          accumulation and ATP-stimulated calcium responses), and the W93C knock-in is regarded as a valid
          model of BVMD. Overall, mouse models incompletely recapitulate human BVMD, limiting their translational
          utility relative to canine models and iPSC-RPE systems.
      selected_evidence:
        snippet: Both Best1(+/W93C)and Best1(W93C/W93C) mice had normal ERG a- and b-waves, but exhibited
          an altered LP luminance response reminiscent of that observed in BVMD patients
