            preferred_term: BEST1-related dominant retinopathy
            term:
              id: MONDO:0700238
              label: BEST1-related dominant retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RPE Dysfunction and Impaired Phagocytosis
        description: 'Bestrophin-1 CaCC dysfunction impairs multiple interdependent RPE functions: calcium
          homeostasis, transepithelial fluid transport, and phagocytic uptake of daily-shed photoreceptor
          outer segments (POS). Failure of RPE phagocytosis allows undigested POS to accumulate in the
          subretinal space. The pathognomonic reduction of the EOG Arden ratio (light-rise) is the electrophysiological
          readout of this RPE-level dysfunction, present even in asymptomatic BEST1 carriers.'
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        biological_processes:
        - preferred_term: phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
          modifier: DECREASED
        - preferred_term: retina homeostasis
          term:
            id: GO:0001895
            label: retina homeostasis
          modifier: DECREASED
      selected_evidence:
        snippet: mutations in this gene induce functional problems in the RPE cell layer with an accumulation
          of lipofucsin that evolves into cell death and loss of sight
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
