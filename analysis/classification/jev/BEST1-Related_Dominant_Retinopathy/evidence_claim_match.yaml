            term:
              id: MONDO:0700238
              label: BEST1-related dominant retinopathy
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Dog
        genotype: Best1 loss-of-function (CMR1/2/3 — canine multifocal retinopathy)
        description: 'Canine multifocal retinopathy (CMR) is a naturally occurring bestrophinopathy in
          multiple dog breeds caused by autosomal-recessive BEST1 mutations (cmr1: p.Arg25Ter in Great
          Pyrenees/mastiff; cmr2: p.Gly161Asp in Coton de Tulear; cmr3: two variants in Swedish Lapponian
          Herder). Although CMR inheritance is recessive (unlike human BVMD), it recapitulates key features:
          multifocal retinal microdetachments, lipofuscin accumulation, and RPE microvilli loss. Subretinal
          AAV2-mediated BEST1 gene augmentation therapy in CMR dogs reversed both clinically detectable
          subretinal lesions and the diffuse RPE-photoreceptor microdetachment and corrected the RPE-photoreceptor
          interface across three canine BEST1 genotypes, providing the key preclinical proof-of-concept
          for the OPGx-BEST1 gene therapy approach. A 2026 dose-ranging study in 12 mutant dogs reported
          improved rod- and cone-mediated responses and retinal structure without systemic or ocular toxicity.'
      selected_evidence:
        snippet: Subretinal BEST1 gene augmentation therapy using adeno-associated virus 2 reversed not
          only clinically detectable subretinal lesions but also the diffuse microdetachments
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
