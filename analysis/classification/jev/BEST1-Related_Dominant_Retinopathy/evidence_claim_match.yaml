        name: Vitelliform Material Accumulation
        description: 'Impaired RPE phagocytosis of shed photoreceptor outer segments and disrupted subretinal
          fluid homeostasis lead to progressive subretinal accumulation of lipofuscin-rich, hyperautofluorescent
          material beneath the macula. Quantitative autofluorescence studies indicate that lipofuscin
          accumulation is not a primary consequence of the genetic defect, but reflects secondary failure
          of RPE-photoreceptor apposition and POS clearance. The hallmark "egg-yolk" vitelliform lesion
          evolves through five classical stages over years to decades: previtelliform, vitelliform, pseudohypopyon,
          vitelliruptive ("scrambled-egg"), and atrophic/fibroatrophic.'
        locations:
        - preferred_term: macula lutea
          term:
