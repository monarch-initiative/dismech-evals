          full-length human BEST1 cDNA under an RPE-specific VMD2 promoter, administered by subretinal
          injection. The Phase 1b/2a BIRD-1 trial (NCT07185256) opened for enrollment in 2025, exploring
          two doses (1.5E9 and 4.5E9 vg/eye) with 5-year follow-up. Both LOF and DN mutations are potentially
          amenable to gene augmentation alone; GOF variants would require concurrent gene silencing.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
