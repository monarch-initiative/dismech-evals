      assertion_type: ProgressionInfo
      assertion:
        phase: Five-stage macular evolution (BVMD)
        notes: 'BVMD evolves through five classical stages: (1) Previtelliform — subtle RPE irregularity
          or normal fundus, relatively normal VA; (2) Vitelliform — classic dome-shaped "egg-yolk" subfoveal
          yellow lesion, often preserved VA; (3) Pseudohypopyon — vitelliform material layers inferiorly
          within the lesion, variable VA; (4) Vitelliruptive/"scrambled-egg" — fragmented lesion with
          outer-nuclear-layer thinning and ellipsoid-zone disruption, declining VA; (5) Atrophic/fibroatrophic
          — macular atrophy or fibrosis with severe and often irreversible central vision loss. Visual
          acuity is characteristically preserved longer than structural appearance suggests, consistent
          with the slow disease progression.'
      selected_evidence:
        snippet: categorization of 52 eyes as Best vitelliform macular dystrophy (BVMD) with stages 1
          to 5
        supports: SUPPORT
