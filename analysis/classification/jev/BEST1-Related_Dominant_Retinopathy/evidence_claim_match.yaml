        features: 'Dominant BEST1-related retinopathy is caused by heterozygous pathogenic variants in
          BEST1 (bestrophin-1, HGNC:12703). Over 250 pathogenic BEST1 variants are known; the vast majority
          are missense mutations, with a minority nonsense, frameshift, or splice-site variants. Three
          molecular mechanisms operate: dominant-negative (DN, most common), loss-of-function (LOF), and
          gain-of-function (GOF, minority). Both LOF and DN mutations may respond to gene augmentation
          therapy, while GOF mutations require gene silencing plus augmentation.'
