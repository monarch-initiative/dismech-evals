      assertion_type: Pathophysiology
      assertion:
        name: BEST1 Calcium-Activated Chloride Channel Dysfunction
        description: Heterozygous pathogenic BEST1 variants produce mutant bestrophin-1 subunits that
          co-assemble with wild-type subunits in the homopentameric CaCC complex in the RPE basolateral
          membrane. The large majority of dominant BEST1 pathogenic variants cause loss-of-function (LOF)
          or dominant-negative (DN) impairment of calcium-activated chloride conductance; a minority cause
          toxic gain-of-function (GOF) with excess channel activity. The resulting abnormal chloride transport
          disrupts RPE transepithelial ion flux and calcium homeostasis.
        genes:
        - preferred_term: BEST1
          term:
            id: hgnc:12703
            label: BEST1
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        biological_processes:
        - preferred_term: chloride transport
          term:
            id: GO:0006821
            label: chloride transport
          modifier: DECREASED
      selected_evidence:
        snippet: This spectrum of disorders is caused by mutations in bestrophin1
        supports: SUPPORT
