      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: advirc_channel_gain_of_function
        hypothesis_label: ADVIRC alleles increase BEST1 anion permeability
        status: EMERGING
        description: Patient-derived iPSC-RPE carrying p.Val86Met conduct more anion than controls, the
          opposite of the loss of conductance seen with Best vitelliform macular dystrophy and recessive
          bestrophinopathy alleles, and the variants cluster near the channel neck and its flexible gating
          helices. Shown for one allele in patient cells; the link to the peripheral and developmental
          phenotype is inferred.
      selected_evidence:
        snippet: Both BD and ARB hiPSC-RPEs display a strong reduction of BEST1-mediated anion transport
          function compared to control, while ADVIRC mutations trigger an increased anion permeability
          suggesting a stabilized open state condition of channel gating.
        supports: SUPPORT
    origin:
