        hypothesis_label: ADVIRC alleles cause BEST1 exon skipping
        status: ALTERNATIVE
        description: 'The original explanation: the missense changes sit in exonic splicing regulatory
          elements and cause skipping of the exon, producing an internally deleted bestrophin alongside
          the missense protein. Supported by minigene and ex vivo splicing assays, and by one canonical
          splice-site allele, but not reproduced in patient iPSC-RPE carrying exon 6 or p.Val86Met alleles,
          nor for the first proband''s allele in vitro.'
      selected_evidence:
        snippet: In the present study, we found no evidence for alternative splicing in the ADVIRC-associated
          hiPSC-RPE cell lines well in agreement with earlier findings from Carter et al.
        supports: REFUTE
