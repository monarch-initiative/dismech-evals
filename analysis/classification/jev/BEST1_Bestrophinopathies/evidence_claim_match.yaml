          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
      selected_evidence:
        snippet: Mutations in the BEST1 gene cause detachment of the retina and degeneration of photoreceptor
          (PR) cells due to a primary channelopathy in the neighboring retinal pigment epithelium (RPE)
          cells.
        supports: SUPPORT
