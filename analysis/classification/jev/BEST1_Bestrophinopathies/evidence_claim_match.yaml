  21f066b15534698c75f4688739a133bb7883f6170cd92f7719603f6adf38ea70:
    claim:
      about:
        disease:
          name: BEST1 Bestrophinopathies
          disease_term:
            preferred_term: BEST1 bestrophinopathy spectrum
            term:
              id: MONDO:0000390
              label: vitelliform macular dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BEST1 Channel Dysfunction
        description: 'Pathogenic variants in BEST1 disrupt the calcium-activated chloride channel function
          of bestrophin-1. The channel normally forms a stable homopentamer in the RPE basolateral membrane,
          mediating transepithelial ion transport, regulation of intracellular calcium signaling, and
          RPE cell volume. Dominant mutations cause a dominant-negative effect while recessive mutations
          result in loss of function.

          '
        genes:
        - preferred_term: BEST1
          term:
            id: hgnc:12703
            label: BEST1
        molecular_functions:
        - preferred_term: calcium-activated chloride channel activity
          term:
            id: GO:0005229
            label: intracellularly calcium-gated chloride channel activity
        cell_types:
        - preferred_term: Retinal Pigment Epithelial Cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        biological_processes:
        - preferred_term: Chloride Transport
          term:
            id: GO:0006821
            label: chloride transport
          modifier: DECREASED
      selected_evidence:
        snippet: BEST1 acts as a multifunctional channel protein responsible for mediating transepithelial
          ion transport, regulation of intracellular calcium signaling and RPE cell volume, and modulation
          of the homeostatic milieu in the subretinal space
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29507198
      reference_title: BEST1 gene therapy corrects a diffuse retina-wide microdetachment modulated by
        light exposure.
      explanation: Describes the multifunctional role of BEST1 in RPE physiology.
