      assertion:
        name: ARB
        display_name: Autosomal Recessive Bestrophinopathy (ARB)
        subtype_term:
          preferred_term: autosomal recessive bestrophinopathy
          term:
            id: MONDO:0012733
            label: autosomal recessive bestrophinopathy
        mappings:
          mondo_mappings:
          - term:
              id: MONDO:0700239
              label: BEST1-related recessive retinopathy
            mapping_predicate: skos:broadMatch
            mapping_source: MONDO
            mapping_justification: MONDO:0700239 is the gene-level "any retinopathy caused by bi-allelic
              BEST1 variants" grouping term; ARB (MONDO:0012733) is its specific clinical presentation
              curated here.
        description: 'Caused by biallelic (homozygous or compound heterozygous) BEST1 mutations resulting
          in absent functional bestrophin-1. Presents with central visual loss in the first two decades.
          Features include macular changes resembling BVMD vitelliruptive/atrophic stages, extramacular
          punctate deposits, subretinal and intraretinal fluid, hyperopia, short axial length, severely
          reduced EOG Arden ratio (1.0 or less), and reduced full-field ERG. Angle-closure glaucoma and
          amblyopia may co-occur.

          '
      selected_evidence:
        snippet: Autosomal recessive bestrophinopathy (ARB) results from a total absence of functional
          bestrophin-1 protein owing to two BEST1 mutations, one on each of the chromosomes.
        supports: SUPPORT
