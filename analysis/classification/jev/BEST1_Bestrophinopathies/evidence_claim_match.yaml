        description: 'BEST1 dysfunction leads to loss of the native extracellular compartmentalization
          of photoreceptor outer segments. RPE apical microvillar ensheathment of cone outer segments
          is lost, and the insoluble interphotoreceptor matrix is compromised. This results in retina-wide
          microdetachments between RPE and photoreceptors that are modulated by light exposure.

          '
        cell_types:
