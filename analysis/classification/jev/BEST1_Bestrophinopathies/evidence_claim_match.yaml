        description: On NM_004183.4, c.1101-491A>G activates a cryptic donor and yields a 204-nucleotide
          pseudoexon. c.867+97G>A and c.867+97G>T increase use of an alternative intron-7 donor, producing
          a 203-nucleotide intron-retaining transcript. Both the canonical and longer transcripts occur
          in normal tissues; the variants shift their relative abundance. Minigene and patient PBMC RNA
          assays support splice alteration, while the predicted premature termination products and nonsense-mediated
          decay were not directly demonstrated at the protein or RNA-decay level. Patient RPE splice proportions
          remain uncertain.
