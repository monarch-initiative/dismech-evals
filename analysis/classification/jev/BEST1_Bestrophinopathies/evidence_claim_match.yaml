          ARB line and two dominant lines, but not p.Ala146Lys. Mutant-allele-selective CRISPR-Cas9 disruption
          restored currents in all three dominant lines. Transcriptomic testing found no adverse RPE program
          changes, but targeted sequencing detected an off-target noncoding chromosome 7 alteration with
          the p.Arg218Cys guide.
        publication: PMID:32707085
        modeled_mechanisms:
        - target: BEST1 Channel Dysfunction
          relationship: PERTURBS
          limitations: Lentiviral gene delivery in cultured RPE, not the AAV clinical-trial construct;
            rescue is allele- and assay-specific. Off-target screening was limited, and a noncoding edit
            cannot be assumed harmless from location alone.
        - target: Delayed Photoreceptor Outer-Segment Protein Degradation
          relationship: PARTIALLY_RECAPITULATES
          limitations: Bovine outer-segment feeding and rhodopsin immunoblots measure protein clearance
            in culture, not vision or human retinal anatomy.
