      assertion_type: Pathophysiology
      assertion:
        name: BEST1 Channel Dysfunction
        description: 'BEST1 encodes a pentameric calcium-activated anion channel of the RPE basolateral
          membrane. Variant effects differ: selected dominant patient-derived RPE lines have greatly reduced
          calcium-activated chloride currents, whereas p.Pro77Ser RPE shows increased halide permeability
          in a fluorescent biosensor assay. Reduced protein abundance, altered localization and channel-gating
          defects are allele-dependent. Dominant inheritance does not imply a uniform dominant-negative
          loss of channel activity.'
