        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Subretinal Fluid Accumulation and Vitelliform Lesions
        description: 'Impaired RPE fluid transport and disrupted photoreceptor outer segment phagocytosis
          lead to subretinal fluid accumulation and deposits of lipofuscin and unphagocytosed outer segment
          material. These form the characteristic vitelliform (egg-yolk) lesions. In BVMD, lesions are
          typically central macular; in ARB, they are more extensive with extramacular involvement.

          '
        cell_types:
        - preferred_term: Retinal Pigment Epithelial Cell
          term:
            id: CL:0002586
