        association: Causative
        features: 'Over 250 pathogenic variants described. Dominant mutations (missense) cause dominant-negative
          channel dysfunction in BVMD, ADVIRC, MRCS, and RP. Recessive mutations (missense, nonsense,
          frameshift) cause loss of function in ARB. Most mutations cluster in the transmembrane domains
          and cytoplasmic N-terminus. The p.Ala243Val mutation is the most common BVMD-associated variant.

          '
        variants:
        - name: Dominant missense variants
          description: 'Cause BVMD, ADVIRC, MRCS, or RP through dominant-negative mechanism. Heterozygous
            pathogenic variants sufficient for disease.

            '
        - name: Biallelic loss-of-function variants
          description: 'Homozygous or compound heterozygous variants causing ARB through complete loss
            of functional bestrophin-1 protein.

            '
      selected_evidence:
        snippet: 'mutations in the BEST1 protein lead to a collection of retinopathies: Best vitelliform
          macular dystrophy (VMD) (OMIM-153700), autosomal dominant vitreoretinochoroidopathy (ADVIRC)
          and microcornea, rod-cone dystrophy, cataract, and posterior staphyloma syndrome (MRCS) (OMIM-193220),
          retinitis pigmentosa (RP) (OMIM-613914), and autosomal recessive bestrophinopathy (ARB) (OMIM-611809).'
        supports: SUPPORT
