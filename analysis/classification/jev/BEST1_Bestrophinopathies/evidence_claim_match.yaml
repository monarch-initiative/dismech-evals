      assertion_type: Treatment
      assertion:
        name: Anti-VEGF Therapy
        description: Intravitreal anti-VEGF is used for active secondary choroidal neovascularization.
          A retrospective BVMD cohort found better final acuity in treated eyes, but untreated eyes included
          advanced fibrosis and inactive lesions, introducing selection bias. Subretinal fluid intrinsic
          to bestrophinopathy does not itself establish active neovascularization. Bevacizumab is one
          reported agent; mild subretinal-fluid reduction with stable vision in a treated proband is an
          individual observation.
        treatment_term:
          preferred_term: anti-VEGF pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: bevacizumab
            term:
              id: CHEBI:749495
              label: bevacizumab
      selected_evidence:
        snippet: selection bias in the present cohort has to be considered, with some patients not receiving
          anti-VEGF treatment despite diagnosis of CNV because of, for example, severe atrophic or fibrotic
          changes, or both.
        supports: SUPPORT
