        name: Reduced BEST1 Membrane Localization
        description: Selected BEST1 mutants fail to accumulate normally at the membrane. This can reduce
          anion-channel activity, but other pathogenic alleles retain basolateral localization; preserved
          localization alone does not establish normal function.
        mechanism_confidence: PROVISIONAL
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Mutant bestrophin-1 proteins p.P346H and p.P233L undergo ubiquitination and degradation,
          preventing their localization to the cell membrane of MDCK II cells and the RPE of zebrafish,
          thereby reducing chloride channel activity.
        supports: SUPPORT
