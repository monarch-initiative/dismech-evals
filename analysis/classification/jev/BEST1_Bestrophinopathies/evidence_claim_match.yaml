          disease_term:
            preferred_term: BEST1 bestrophinopathy spectrum
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Light-Modulated RPE-Photoreceptor Microdetachment
        description: Canine recessive BEST1 retinas show diffuse separation between RPE and photoreceptors
          that expands with light and contracts after dark adaptation. Early affected regions retain photoreceptor
          nuclear numbers, with increased internuclear spacing proposed to explain outer nuclear layer
          thickening. Advanced gross detachments can show outer nuclear layer loss. The canine light-dependent
          response is not established as a universal human phenotype.
        mechanism_confidence: PROVISIONAL
        biological_scale: TISSUE
      selected_evidence:
        snippet: The microdetachments did not result in thinning of the ONL that would be expected from
          photoreceptor degeneration.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29507198
      reference_title: BEST1 gene therapy corrects a diffuse retina-wide microdetachment modulated by
        light exposure.
      evidence_source: MODEL_ORGANISM
      explanation: Early microdetachment regions had normal photoreceptor nuclear counts and often thicker
        outer nuclear layers; photoreceptor loss was associated with advanced gross lesions rather than
        established for every microdetachment.
