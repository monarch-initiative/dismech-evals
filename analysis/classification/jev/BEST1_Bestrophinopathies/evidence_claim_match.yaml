        context: []
      assertion_type: Subtype
      assertion:
        name: ARB
        display_name: Autosomal Recessive Bestrophinopathy (ARB)
        subtype_term:
          preferred_term: autosomal recessive bestrophinopathy
          term:
            id: MONDO:0012733
            label: autosomal recessive bestrophinopathy
        mappings:
          mondo_mappings:
          - term:
              id: MONDO:0700239
              label: BEST1-related recessive retinopathy
            mapping_predicate: skos:broadMatch
            mapping_source: MONDO
            mapping_justification: MONDO:0700239 is the gene-level "any retinopathy caused by bi-allelic
              BEST1 variants" grouping term; ARB (MONDO:0012733) is its specific clinical presentation
              curated here.
        description: Biallelic BEST1-associated retinopathy with variable age at presentation, multifocal
          deposits often extending beyond the macula, subretinal/intraretinal fluid, hyperopia, short
          axial length and angle-closure risk. EOG is usually markedly abnormal and ERG may show generalized
          dysfunction, but neither test has an invariant pattern. Reduced protein abundance, channel dysfunction
          and altered splicing occur in different alleles; complete absence of BEST1 and nonsense-mediated
          decay are not universal mechanisms. Disease extent ranges from isolated macular to panretinal
          involvement; different cohorts and follow-up periods yield different progression estimates.
      selected_evidence:
        snippet: ARB displays macular changes resembling the vitelliruptive, atrophic, and cicatricial
          stages of VMD. The phenotype additionally encompasses extramacular punctate deposits, intraretinal
          and subretinal fluid (SRF) accumulation, punctate or diffuse fundus hyperautofluorescence, hyperopia,
          short axial-length, central visual field loss, severely decreased Arden ratio
        supports: SUPPORT
