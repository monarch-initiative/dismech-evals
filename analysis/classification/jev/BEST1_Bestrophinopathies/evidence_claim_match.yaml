        name: Reduced RPE Transepithelial Fluid Transport
        description: Patient-derived ARB iPSC-RPE monolayers showed reduced apical-to-basal fluid transport
          despite preserved epithelial morphology and no significant change in transepithelial electrical
          resistance. In a study of one ARB donor, one dominant Best disease donor and two controls, fluid
          flow was 0.12, 0.29 and 0.35 microliters/hour/cm2, respectively. This cellular transport defect
          provides a candidate explanation for fluid accumulation; the small donor sample does not establish
          its magnitude across BEST1 genotypes or demonstrate that epithelial barrier breakdown is required.
        cell_types:
        - preferred_term: Retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        mechanism_confidence: PROVISIONAL
        biological_scale: CELLULAR
      selected_evidence:
        snippet: Fluid transport from apical to basal was significantly decreased in ARB iPSC-RPE compared
          with BD iPSC-RPE or control iPSC-RPE.
        supports: SUPPORT
