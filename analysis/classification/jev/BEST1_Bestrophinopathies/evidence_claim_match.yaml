      assertion_type: Subtype
      assertion:
        name: BVMD
        display_name: Best Vitelliform Macular Dystrophy (BVMD)
        subtype_term:
          preferred_term: Best vitelliform macular dystrophy
          term:
            id: MONDO:0007931
            label: vitelliform macular dystrophy 2
        description: 'Most common bestrophinopathy. Autosomal dominant with incomplete penetrance and
          variable expression. Typically presents in childhood with a central macular vitelliform (egg-yolk)
          lesion that progresses through six stages: previtelliform, vitelliform, vitelliruptive, pseudohypopion,
          atrophic, and cicatricial. Visual acuity is initially preserved but declines in later stages.
          Full-field ERG is normal; EOG shows reduced Arden ratio (less than 1.5). Mild hyperopia is common.

          '
      selected_evidence:
        snippet: 'The VMD phenotype consists of a prominent raised central macular lesion that undergoes
          morphological changes classified into six stages: previtelliform, vitelliform, vitelliruptive,
          pseudohypopion, atrophic, and cicatricial.'
        supports: SUPPORT
