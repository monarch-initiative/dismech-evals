  036934a8e834e47183efc04e312dc05fad383904ef449d64db5d8bfa96c61fd0:
    claim:
      about:
        disease:
          name: BEST1 Bestrophinopathies
          disease_term:
            preferred_term: BEST1 bestrophinopathy spectrum
        context: []
      assertion_type: Genetic
      assertion:
        name: BEST1
        gene_term:
          preferred_term: BEST1
          term:
            id: hgnc:12703
            label: BEST1
        association: Causative
        features: BEST1-associated disease includes dominant and recessive inheritance with substantial
          allelic and phenotypic overlap. Protein abundance, channel activity, splicing and response to
          experimental gene augmentation depend on the allele. Biallelic disease does not invariably represent
          complete protein absence.
        variants:
        - name: Dominant missense variants
          description: Dominant BEST1 variants can impair channel function or localization, and some increase
            measured anion permeability. Molecular effects and clinical expressivity require allele-specific
            assessment.
        - name: Biallelic loss-of-function variants
          description: Biallelic BEST1 variants causing recessive disease can reduce expression or impair
            function. Residual transcript and protein expression are documented in some genotypes; a null-protein
            mechanism must not be assumed for every ARB allele.
        - name: BEST1 p.Arg218Cys
          description: NM_004183.4:c.652C>T, a heterozygous dominant Best disease allele studied in patient-derived
            RPE. Reduced chloride currents normalized after lentiviral augmentation or mutant-allele disruption;
            an isogenic correction control supported the causal channel effect.
        - name: BEST1 p.Asn296His
          description: NM_004183.4:c.886A>C, a heterozygous dominant Best disease allele in the calcium-clasp
            region. Patient-derived RPE chloride currents and rhodopsin degradation improved with augmentation;
            mutant-allele disruption also restored currents.
        - name: BEST1 p.Ala146Lys
          description: NM_004183.4:c.436_437delinsAA, a dominant Best disease allele in a putative structural
            region. Patient-derived RPE did not respond to the tested augmentation regimen despite increased
            BEST1 abundance; mutant-allele-selective disruption restored chloride currents. This experimental
            nonresponse does not establish failure of every possible dose or delivery system.
        - name: BEST1 c.1101-491A>G
          description: Deep-intronic NM_004183.4 variant found in recessive disease; 204-nucleotide pseudoexon
            inclusion was observed in a HEK293T minigene and RNA from a patient also carrying p.Leu40Pro.
            Predicted p.Ser367ArgfsTer59 and NMD are inferred consequences, not measured protein or decay
            outcomes.
        - name: BEST1 c.867+97G>A
          description: 'Deep-intronic NM_004183.4 founder allele in the studied Chinese ARB cohort: 20/125
            disease alleles (16%), not a general-population allele frequency. Minigene and patient PBMC
            assays showed increased 203-nucleotide intron retention against a nonzero normal background.
            The same genomic site has different consequences under alternative transcript annotations.'
        - name: BEST1 c.867+97G>T
          description: Deep-intronic NM_004183.4 allele increasing the intron-retaining transcript fraction
            in a HEK293T minigene (50.0% versus 37.5% for wild type). Patient PBMC corroboration in the
            paper was obtained for the G>A allele, not this G>T allele; neither result quantifies splicing
            in patient RPE.
        - name: BEST1 p.Pro77Ser
          description: Heterozygous c.229C>T reported de novo in a patient with BVMD. Patient-derived
            RPE showed increased iodide-sensitive YFP quenching, with preserved BEST1 expression and basolateral
            localization. This supports a possible gain-of-function mechanism; no isogenic rescue or patch-clamp
            chloride measurement was performed in that study.
        - name: BEST1 p.Pro233Leu
          description: c.698C>T segregated with BVMD in the reported pedigree. Experimental Hsp70/CHIP-dependent
            ubiquitination, degradation and mislocalization support a functional defect; family size and
            penetrance were not available in the retrieved abstract.
        - name: BEST1 p.Pro346His
          description: c.1037C>A segregated with RP50 in the reported pedigree. Experimental Hsp70/CHIP-dependent
            ubiquitination, degradation and mislocalization support a functional defect; family size and
            penetrance were not available in the retrieved abstract.
      selected_evidence:
        snippet: 'mutations in the BEST1 protein lead to a collection of retinopathies: Best vitelliform
          macular dystrophy (VMD) (OMIM-153700), autosomal dominant vitreoretinochoroidopathy (ADVIRC)
          and microcornea, rod-cone dystrophy, cataract, and posterior staphyloma syndrome (MRCS) (OMIM-193220),
          retinitis pigmentosa (RP) (OMIM-613914), and autosomal recessive bestrophinopathy (ARB) (OMIM-611809).'
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34015078
      reference_title: Phenotypic and Genetic Spectrum of Autosomal Recessive Bestrophinopathy and Best
        Vitelliform Macular Dystrophy.
      explanation: Enumerates the full spectrum of BEST1-related retinopathies.
