          gene:
            preferred_term: BLOC1S1
            term:
              id: hgnc:4200
              label: BLOC1S1
          type: splice_site_frameshift
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: loss_of_function
            description: Predicted exon skipping and frameshift would likely trigger nonsense-mediated
