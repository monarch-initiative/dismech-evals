              label: BLOC1S1
          type: missense
          clinical_significance: PATHOGENIC
          functional_effects:
          - function: loss_of_function
            description: Missense variants show reduced expression, impaired BORC/BLOC-1 assembly, or
              impaired rescue of lysosome transport and autophagy.
        - name: BLOC1S1 splice-altering frameshift variant
          description: A splice-altering intronic variant is predicted to skip an exon, create a frameshift,
