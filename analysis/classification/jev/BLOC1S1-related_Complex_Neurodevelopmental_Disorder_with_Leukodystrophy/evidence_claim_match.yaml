          disorder rather than the full canonical BLOC-1/Hermansky-Pudlak syndrome phenotype. Mild pigmentary
          findings can occur, but bleeding diathesis, pulmonary fibrosis, granulomatous colitis, and immunodeficiency
          should not be generalized to BLOC1S1-related disease from other BLOC-1 subunit disorders.
        genes:
