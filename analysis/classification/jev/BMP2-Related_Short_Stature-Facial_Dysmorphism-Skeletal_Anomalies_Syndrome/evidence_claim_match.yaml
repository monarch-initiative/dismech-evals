        context: []
      assertion_type: Phenotype
      assertion:
        category: Cardiovascular
        name: Congenital heart disease
        phenotype_term:
          preferred_term: Congenital heart disease
          term:
            id: HP:0001627
            label: Abnormal heart morphology
        description: 'Structural cardiac anomalies, principally septal. Penetrance is clearly incomplete:
          several well-characterised patients have entirely normal echocardiography, which is what the
          "with or without cardiac anomalies" clause of the disease name records. No frequency band is
          given because no cited source supplies a denominator; the defining series reports congenital
          heart disease as a shared group-level feature of its 12 patients without stating how many had
          it.

          On arrhythmia: the 2025 review lists arrhythmias in the BMP2 haploinsufficiency spectrum, and
          Wolff-Parkinson-White is curated separately as its own phenotype rather than folded in here.
          An earlier revision of this entry attributed WPW to the wider 20p13p12 deletion interval and
          declined to curate it; that was correct on the evidence then cited, and is superseded. PMID:33247540
          reports WPW in a patient with an intragenic BMP2 nonsense variant and no deletion, so the neighbouring-gene
          explanation no longer covers it. Structural and rhythm phenotypes are kept as separate entries
          because they arise from different developmental steps - cushion transformation for the septal
          defects, conduction-axis patterning for pre-excitation - and the evidence for each is separate.'
      selected_evidence:
        snippet: Additional clinical evaluations, including echocardiography and metabolic studies, were
          unremarkable.
        supports: REFUTE
