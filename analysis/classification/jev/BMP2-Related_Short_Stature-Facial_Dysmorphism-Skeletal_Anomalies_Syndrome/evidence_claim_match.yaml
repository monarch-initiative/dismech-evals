        reduced BMP2 signalling follows by inference rather than being measured here. Note the quoted
        phrase "the human disorder" means SSFSC2 (MONDO:0030953, the recessive SCUBE3 disorder), not the
        SSFSC1 curated here - this is exactly the label collision this entry guards against, and the sentence
        is quoted with that reading made explicit.'
