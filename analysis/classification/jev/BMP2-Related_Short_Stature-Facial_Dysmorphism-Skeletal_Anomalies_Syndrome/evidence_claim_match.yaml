      - /disease_term
    evidence_metadata:
      reference: PMID:17099713
      reference_title: BMP2 activity, although dispensable for bone formation, is required for the initiation
        of fracture healing.
      evidence_source: MODEL_ORGANISM
      explanation: Separates a postnatal bone-maintenance requirement for BMP2 from its developmental
        one. Note this is the homozygous limb-conditional null, not the heterozygote, so it establishes
        that the requirement exists rather than that a halved dose is enough to breach it.
