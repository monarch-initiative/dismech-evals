          a bicuspid aortic valve and aortic root and ascending aortic aneurysm. That is a different morphogenetic
          field from the atrioventricular cushions the mechanism above runs through, and the mouse literature
          is explicit that BMP2''s role in semilunar valvulogenesis is less well established than its
          role in the AV cushions. It is curated as part of the cardiac spectrum on the strength of the
          human observation, not on a mechanism this entry can trace.'
        biological_scale: TISSUE
      selected_evidence:
        snippet: These findings demonstrate the important role of BMP2 in human craniofacial, skeletal,
          and cardiac development and confirm that individuals heterozygous for BMP2 truncating sequence
          variants or deletions display a consistent distinct phenotype characterized by short stature
