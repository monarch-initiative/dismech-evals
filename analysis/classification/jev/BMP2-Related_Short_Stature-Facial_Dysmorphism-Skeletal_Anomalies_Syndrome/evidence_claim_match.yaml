      assertion:
        name: Heterozygous Bmp2 knockout mouse
        species: Mouse
        genotype: Bmp2 heterozygous null
        publication: PMID:29198724
        description: 'The direct genetic counterpart of the human disorder. Its value is that it tests
          the dose hypothesis rather than the gene''s necessity: the homozygote is embryonic lethal and
          says nothing about haploinsufficiency.'
        modeled_mechanisms:
        - target: BMP2 Haploinsufficiency
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: ORGANISM
          description: Halved Bmp2 dose in the mouse reproduces the human short stature and skeletal anomalies.
          limitations: The report describes phenotypic similarity for growth and skeletal features; it
            does not claim the craniofacial gestalt or the cardiac anomalies are reproduced, so the model
            is not established as covering those arms.
          readouts:
          - name: Axial skeletal defects in Bmp2 heterozygous adults
            target: BMP2 Haploinsufficiency
            direction: INCREASED
            interpretation: 'Quantified penetrance of axial patterning defects at halved Bmp2 dose: 13th
              rib formation defects in 77 per cent and cervical vertebral fusion in 33 per cent of heterozygous
              skeletons. This is the entry''s only dose-specific skeletal measurement in a simple heterozygote
              - every other skeletal result cited here comes from a compound Bmp2/Bmp4 conditional knockout
              - so it is what grounds the haploinsufficiency link quantitatively rather than by resemblance.'
      selected_evidence:
        snippet: Additionally, we observed similarity to the human phenotype of short stature and skeletal
          anomalies in a heterozygous Bmp2-knockout mouse model, suggesting that haploinsufficiency of
          BMP2 could be the primary phenotypic determinant in individuals with predicted truncating variants
          and deletions encompassing BMP2.
        supports: SUPPORT
