      assertion_type: Discussion
      assertion:
        discussion_id: bmp2_cardiac_laterality
        kind: KNOWLEDGE_GAP
        prompt: Does BMP2 contribute to determination of the cardiac axis in humans, beyond its established
          role in septal and valvuloseptal morphogenesis?
        status: OPEN
        attaches_to:
        - pathophysiology#Failed Endocardial Cushion Mesenchymal Transition
        - phenotypes#Congenital heart disease
        rationale: One family with a BMP2 frameshift variant included a proband with isolated dextrocardia
          and situs solitus, with no other viscus displaced and no structural cardiac defect. Laterality
          is a distinct developmental question from cushion transformation, and a single proband cannot
          separate a real BMP2 laterality role from coincidence. The reporting authors say so themselves.
          It is recorded here so that dextrocardia is not silently folded into the cardiac-anomaly phenotype,
          where it would imply a mechanism the evidence does not support.
      selected_evidence:
        snippet: In addition to short stature, impaired hearing ability and minor skeletal deformities,
          the proband exhibited isolated dextrocardia situs solitus without cardiac anomalies and abnormal
          locations of other visceral organs.
        supports: SUPPORT
