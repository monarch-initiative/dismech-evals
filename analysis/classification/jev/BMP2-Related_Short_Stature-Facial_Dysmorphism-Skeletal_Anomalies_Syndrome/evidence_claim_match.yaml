      assertion_type: Pathophysiology
      assertion:
        name: BMP2 Haploinsufficiency
        description: A heterozygous truncating variant or a whole-gene deletion halves the functional
          BMP2 gene dose, so the amount of secreted BMP2 ligand available to the tissues that depend on
          it falls below the level those tissues require. The mouse heterozygote reproduces the human
          growth and skeletal phenotype, which is what identifies dose rather than a dominant-negative
          protein as the lesion.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: BMP2
          term:
            id: hgnc:1069
            label: BMP2
        molecular_functions:
        - preferred_term: BMP2 growth factor activity
          modifier: DECREASED
          term:
            id: GO:0008083
            label: growth factor activity
      selected_evidence:
        snippet: Additionally, we observed similarity to the human phenotype of short stature and skeletal
          anomalies in a heterozygous Bmp2-knockout mouse model, suggesting that haploinsufficiency of
          BMP2 could be the primary phenotypic determinant in individuals with predicted truncating variants
          and deletions encompassing BMP2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
