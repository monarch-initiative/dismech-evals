              label: short stature, facial dysmorphism, and skeletal anomalies with or without cardiac
                anomalies 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Osteogenic Output of Skeletal Progenitors
        description: 'In the limb and axial skeleton the sensitive step is osteogenesis from cartilage
          templates, not chondrocyte differentiation. Two negative results in the mouse limb genetics
          constrain this node and are worth stating plainly, because they are easy to overread in the
          opposite direction: once a condensation has formed, chondrogenic differentiation proceeds normally
          even without BMP2, and severe osteogenic impairment appears only when BMP4 is removed as well.
          BMP4 and BMP7 are therefore substantially redundant with BMP2 in the limb, which is the most
          likely reason the human heterozygote has hypoplastic and dysmorphic bones rather than absent
          skeletal elements, and the reason this node is annotated for osteogenesis alone.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: osteoblast differentiation
          modifier: DECREASED
          term:
            id: GO:0001649
            label: osteoblast differentiation
      selected_evidence:
        snippet: In contrast, we find that the loss of both BMP2 and BMP4 results in a severe impairment
          of osteogenesis.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
