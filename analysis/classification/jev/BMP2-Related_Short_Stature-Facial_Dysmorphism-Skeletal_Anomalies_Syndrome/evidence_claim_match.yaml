      assertion:
        name: Impaired Cranial Neural Crest Osteogenic Differentiation
        description: 'Cranial neural crest cells populate the pharyngeal arches and give rise, by intramembranous
          ossification, to most of the facial skeleton. With less BMP2 they proliferate and differentiate
          into osteoblasts less well, so the mandible, maxilla and zygoma are built undersized.

          On the cell-type binding: CL:0000008 is narrower than this claim. The node concerns osteogenic
          differentiation of cranial-neural-crest-derived mesenchyme, which is post-migratory, and CL
          has no post-migratory cranial neural crest term. The migratory term is the closest accurate
          ancestor of that population, so read the binding as naming the lineage rather than the developmental
          stage.'
        biological_scale: CELLULAR
        conforms_to: pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch
          Program Perturbation
        cell_types:
        - preferred_term: cranial neural crest cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: neural crest cell development
          modifier: ABNORMAL
          term:
            id: GO:0014032
            label: neural crest cell development
        - preferred_term: osteoblast differentiation
          modifier: DECREASED
          term:
            id: GO:0001649
            label: osteoblast differentiation
        notes: 'On the module conformance declared here and on the consequence node: this entry conforms
          to the trigger and consequence nodes of pharyngeal_arch_patterning_serial_homology but deliberately
          not to its central effector, "Disrupted Pharyngeal-Arch Patterning and Neural-Crest Skeletogenesis".
          That node is written around mis-specification of arch identity, whose clearest demonstration
          is homeotic transformation of mandibular toward maxillary fate under a disrupted EDN1-DLX code.
          Nothing of that kind is reported for BMP2: the cranial-neural-crest conditional mutant shows
          reduced proliferation and osteogenic differentiation of progenitors with arch identity intact,
          so the lesion here is quantitative skeletogenesis, not patterning. Claiming that node would
          assert a mis-specification the literature does not support.'
      selected_evidence:
        snippet: In this study, we generate mice carrying Bmp2-specific deletion in cranial neural crest
          cells using floxed Bmp2 and Wnt1-Cre alleles to mimic PRS in humans.
        supports: SUPPORT
