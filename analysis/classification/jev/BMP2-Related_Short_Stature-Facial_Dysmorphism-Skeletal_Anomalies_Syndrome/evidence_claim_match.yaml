  cbf717abc7bf985cf80c8cedca78f96cbe34df8fb533859b9316ff50331d3b98:
    claim:
      about:
        disease:
          name: BMP2-Related Short Stature-Facial Dysmorphism-Skeletal Anomalies Syndrome
          disease_term:
            preferred_term: short stature, facial dysmorphism, and skeletal anomalies with or without
              cardiac anomalies 1
            term:
              id: MONDO:0100297
              label: short stature, facial dysmorphism, and skeletal anomalies with or without cardiac
                anomalies 1
        context: []
      assertion_type: Genetic
      assertion:
        name: BMP2
        gene_term:
          preferred_term: BMP2
          term:
            id: hgnc:1069
            label: BMP2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'BMP2 (20p12.3) encodes bone morphogenetic protein 2, a secreted homodimeric ligand of
          the TGF-beta superfamily. The disease alleles are of two kinds that converge on the same endpoint:
          intragenic truncating, frameshift and canonical splice-site variants, and heterozygous microdeletions
          spanning roughly 0.6 Mb to several Mb that remove the whole gene. Both predict haploinsufficiency,
          and the shared phenotype across those allele classes is the main argument that BMP2 dose, rather
          than any neighbouring gene, is the determinant.

          Missense variants are a third class and were added later. An international 18-patient cohort
          found monoallelic missense alleles producing the same syndrome, and tested them functionally
          in zebrafish, where they failed to support bmp2b-driven embryonic ventralization. So a missense
          allele here is a loss-of-function allele rather than a separate mechanism, and a negative deletion
          screen does not exclude the diagnosis.

          Deletion size is the practical variable to record. A deletion confined to BMP2 gives this syndrome;
          a larger 20p12 deletion adds the phenotypes of whatever else it removes, and those must not
          be attributed to BMP2 (see notes on contiguous-gene effects).'
      selected_evidence:
        snippet: Here, we report a cranioskeletal phenotype due to monoallelic truncating and frameshift
          BMP2 variants and deletions in 12 individuals from eight unrelated families that share features
          of short stature, a recognizable craniofacial gestalt, skeletal anomalies, and congenital heart
          disease.
        supports: SUPPORT
