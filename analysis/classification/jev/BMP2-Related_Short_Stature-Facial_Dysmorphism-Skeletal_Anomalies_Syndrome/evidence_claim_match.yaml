                anomalies 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deficient Skeletal Repair and Bone Homeostasis
        description: BMP2 is not required to build the skeleton once other BMPs are present, but it is
          required to initiate repair of it. Limb-conditional Bmp2 null mice accumulate spontaneous fractures
          that never heal, so the postnatal role is maintenance rather than morphogenesis. This is the
          most plausible frame for the phalangeal osteolysis reported in one patient, and it is the reason
          skeletal surveillance in this disorder is longitudinal rather than a single baseline survey.
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: bone remodeling
          modifier: ABNORMAL
          term:
            id: GO:0046849
            label: bone remodeling
        notes: The link from this node to human phalangeal osteolysis is the weakest chain in this entry
          and is labelled as such deliberately. Osteolysis has been reported once, in a single 10-year-old;
          the mouse evidence for a repair requirement comes from complete limb-conditional loss rather
          than heterozygosity. Both halves are real and they point the same way, but this is a hypothesis
          about a single case rather than an established mechanism.
      selected_evidence:
        snippet: Mice lacking the ability to produce BMP2 in their limb bones have spontaneous fractures
          that do not resolve with time.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
