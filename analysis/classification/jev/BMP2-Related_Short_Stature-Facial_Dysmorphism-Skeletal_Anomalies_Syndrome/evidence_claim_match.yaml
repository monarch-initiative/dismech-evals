  0617c80274326bb06a601837b0b538337c3c1c022d20748523043551ef2649fd:
    claim:
      about:
        disease:
          name: BMP2-Related Short Stature-Facial Dysmorphism-Skeletal Anomalies Syndrome
          disease_term:
            preferred_term: short stature, facial dysmorphism, and skeletal anomalies with or without
              cardiac anomalies 1
            term:
              id: MONDO:0100297
              label: short stature, facial dysmorphism, and skeletal anomalies with or without cardiac
                anomalies 1
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Larger 20p12 contiguous gene deletion syndromes
        description: 'Deletions extending beyond BMP2 add the phenotypes of the genes they also remove,
          and those phenotypes have repeatedly been misattributed to BMP2. Deletions reaching JAG1 produce
          Alagille syndrome; deletions including PROKR2 have been reported with congenital hypopituitarism
          and growth hormone deficiency.

          Wolff-Parkinson-White syndrome does not belong on that list any more, and the correction is
          worth stating because the older literature invites the error in both directions. WPW was first
          described for the wider 20p13p12 interval, which made it look like a neighbouring-gene effect.
          It has since been reported in a patient carrying an intragenic BMP2 nonsense variant with no
          deletion at all, so it is curated here as a rare cardiac phenotype of this disorder rather than
          excluded.'
        distinguishing_features:
        - Deletion breakpoints and size on chromosomal microarray
        - A phenotype seen only in patients with large deletions, and never in patients with an intragenic
          BMP2 variant, is evidence against attributing it to BMP2 dose
      selected_evidence:
        snippet: Microdeletion 20p13p12 involving BMP2 is rare and has been implicated in Wolff-Parkinson-White
          (WPW) syndrome with neurocognitive deficits and with Alagille syndrome when the deletion includes
          the neighboring JAG1 gene in addition to BMP2.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
