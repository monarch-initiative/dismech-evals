        description: 'The reason gene-level literature searches on BMP2 return material that does not
          apply here. BDA2 is most often caused by variants in BMPR1B or GDF5, and only a minority of
          families carry the BMP2-linked lesion: duplication of a conserved limb enhancer roughly 110
          kb downstream of BMP2, which increases local BMP2 expression in the limb. Either way it is confined
          to hypoplastic middle phalanges of the second and fifth digits, without short stature, facial
          dysmorphism or cardiac disease.'
        distinguishing_features:
        - Where BMP2-linked at all, a non-coding regulatory duplication increasing limb BMP2 expression,
          rather than a coding loss-of-function variant or whole-gene deletion; more often a BMPR1B or
          GDF5 variant and so not a BMP2 disorder in the first place
        - An isolated digital malformation of the second and fifth middle phalanges, without short stature,
          facial dysmorphism or cardiac disease
      selected_evidence:
        snippet: Our results reveal an additional functional mechanism for the pathogenesis of BDA2, which
          is duplication of a regulatory element that affects the expression of BMP2 in the developing
          limb.
        supports: SUPPORT
