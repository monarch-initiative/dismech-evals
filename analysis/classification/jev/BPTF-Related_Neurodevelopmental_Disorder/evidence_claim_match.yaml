            label: histone H3K4me3 reader activity
          modifier: DECREASED
        - preferred_term: NURF nucleosome sliding
          term:
            id: GO:0140750
            label: nucleosome array spacer activity
          modifier: DECREASED
      selected_evidence:
        snippet: Here we show that a plant homeodomain (PHD) finger of nucleosome remodelling factor (NURF),
          an ISWI-containing ATP-dependent chromatin-remodelling complex, mediates a direct preferential
          association with H3K4me3 tails.
