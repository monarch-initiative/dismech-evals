              label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Craniofacial and Limb Patterning
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: Loss of BPTF-dependent spatial control of homeobox gene expression perturbs morphogenesis
          of the craniofacial skeleton and the distal limb. In zebrafish bptf F0 mutants the ceratohyal
          angle of the craniofacial skeleton is substantially increased, an established readout of abnormal
          craniofacial patterning. In humans the corresponding findings are the mild dysmorphic facial
          gestalt and the distal limb anomalies (cutaneous toe syndactyly, sandal gap, fifth-finger clinodactyly)
          that name the syndrome. The mechanism connecting BPTF dosage to the specific human limb findings
          has not been directly demonstrated and is inferred from the patterning role of NURF, so this
          node is marked PROVISIONAL.
        biological_processes:
        - preferred_term: embryonic skeletal system morphogenesis
          term:
            id: GO:0048704
            label: embryonic skeletal system morphogenesis
          modifier: ABNORMAL
        - preferred_term: embryonic limb morphogenesis
          term:
            id: GO:0030326
            label: embryonic limb morphogenesis
          modifier: ABNORMAL
        cell_types:
        - preferred_term: migratory cranial neural crest cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
        notes: No causal edge is drawn from this node to Neurodevelopmental Impairment. The dysmorphic
          and distal limb findings co-segregate with the neurodevelopmental phenotype as parallel outputs
          of one upstream lesion; they do not cause it. Both branches are already reachable from Dysregulated
          Developmental Gene Transcription, so the pathograph loses no connectivity by omitting an edge
          that the evidence does not support.
      selected_evidence:
        snippet: we observed a substantial increase of the ceratohyal angle of the craniofacial skeleton
          in bptf F0 mutants, indicating abnormal craniofacial patterning
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
