              label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Bptf forebrain-conditional knockout mouse
        species: Mus musculus
        genotype: Emx1-Cre forebrain-conditional Bptf knockout (Bptf cKO)
        category: Conditional knockout mouse model of NEDDFL
        description: Forebrain-specific Bptf knockout mice, generated explicitly to model NEDDFL (PMID:35604347).
          They are born at normal Mendelian ratios and survive to adulthood but are smaller, with severe
          cortical hypoplasia, prolonged progenitor cell cycle length, increased cell death, disrupted
          cortical lamination with reduced deep-layer neurons, and impaired acquisition of distinct neuronal
          fates.
        notes: 'Interpretive caveat beyond the per-link limitations: ablation of Smarca1 (the SNF2L ATPase
          partner of BPTF within NURF) produces mice with ENLARGED brains, the direct contrast of the
          NEDDFL microcephaly, so the two NURF subunits cannot be treated as interchangeable when modelling
          this disorder. That discordance is the basis of the `bptf_vs_smarca1_dosage_paradox` knowledge
          gap.'
        modeled_mechanisms:
        - target: Neural Progenitor Cell-Cycle Prolongation and Apoptosis
          relationship: RECAPITULATES
          description: 'The model directly demonstrates the cellular mechanism this node asserts: prolonged
            progenitor cell cycle length and increased programmed cell death reducing neuronal output
            from the progenitor pool.'
          readouts:
          - name: Progenitor cell cycle length
            target: Neural Progenitor Cell-Cycle Prolongation and Apoptosis
            direction: INCREASED
            description: Cell cycle length of cortical neural progenitors in Bptf cKO versus littermate
              control forebrain.
            interpretation: Lengthened cycle time is the measured basis for the reduced neuronal output
              asserted by this node.
          - name: Progenitor cell death incidence
            target: Neural Progenitor Cell-Cycle Prolongation and Apoptosis
            direction: INCREASED
            biological_processes:
            - preferred_term: apoptotic process
              term:
                id: GO:0006915
                label: apoptotic process
            description: Incidence of programmed cell death among cortical progenitors in Bptf cKO versus
              control.
            interpretation: Raised cell death compounds the cycle-length effect in depleting the progenitor
              pool.
        - target: Cortical Hypoplasia and Disrupted Lamination
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: 'Reproduces both facets of the node: severe cortical hypoplasia, and disrupted
            lamination with reduced deep-layer neurons and impaired acquisition of distinct cortical cell
            fates.'
          readouts:
          - name: Deep-layer neuron proportion
            target: Cortical Hypoplasia and Disrupted Lamination
            direction: DECREASED
            description: Proportion of deep-layer neurons within the cortical plate of Bptf cKO versus
              control.
            interpretation: A reduced deep-layer fraction is the quantitative signature of the disrupted
              lamination this node asserts.
          - name: Ctip2-positive neuronal fate acquisition
            target: Cortical Hypoplasia and Disrupted Lamination
            direction: DECREASED
            biological_processes:
            - preferred_term: cerebral cortex neuron differentiation
              term:
                id: GO:0021895
                label: cerebral cortex neuron differentiation
            description: Acquisition of distinct cortical identities, indexed by Ctip2-positive neurons,
              in Bptf cKO versus control.
            interpretation: Impaired fate acquisition distinguishes a maturation defect from simple cell
              loss.
          limitations: The model is a homozygous conditional null restricted to the forebrain, not a heterozygous
            haploinsufficiency model, and heterozygous animals were reported to have little to no phenotype.
            Its severe cortical hypoplasia is therefore a complete-loss phenotype whose quantitative relationship
            to the human half-dosage disease is unresolved. This is the substance of the `bptf_mouse_homozygous_vs_human_haploinsufficiency`
            HUMAN_MODEL_MISMATCH discussion, which attaches to this same node.
      selected_evidence:
        snippet: To model the NEDDFL syndrome, we generated forebrain-specific Bptf knockout (Bptf conditional
          Knockout (cKO)) mice.
