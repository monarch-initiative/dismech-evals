          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
        - preferred_term: cell cycle
          term:
            id: GO:0007049
            label: cell cycle
          modifier: ABNORMAL
      selected_evidence:
        snippet: Prolonged progenitor cell cycle length and a high incidence of cell death reduced the
          neuronal output.
        supports: SUPPORT
