          a wide severity range from severe impairment to mild learning difficulty compatible with independent
          adult life. In a minority, cortical excitability is sufficiently disturbed to produce early-childhood-onset
          epilepsy or isolated interictal epileptiform discharges; developmental delay precedes seizure
          onset, indicating that the epilepsy is a consequence of the abnormal cortex rather than its
          cause.'
        notes: 'Phenotypes deliberately left unwired. Cyclical Vomiting Syndrome, the ophthalmologic group
          (Ophthalmologic Abnormalities, Exotropia, Myopia), and the axial/maturational skeletal findings
          (Scoliosis, Delayed Bone Age) are recorded clinically but have no established mechanistic route
          from any node in this pathograph, so no causal edge is asserted for them. The source literature
          is explicit that the skeletal mechanism "is less clear", and nothing connects BPTF dosage to
          cyclical vomiting or to the ocular findings beyond co-occurrence in the same individuals. Wiring
          them would manufacture causal claims the evidence does not carry; the same reasoning applied
          to the craniofacial/limb-to-neurodevelopment edge removed earlier in this entry.

          The remaining unwired phenotypes are unwired because they roll up under a parent that is wired,
          not because they lack a mechanism. Bulbous Nasal Tip, Prominent Nasal Bridge and Pointed Chin
          are sub-features of the wired Dysmorphic Facial Features; Sandal Gap and Fifth-Finger Clinodactyly
          are sub-features of the wired Distal Limb Anomalies; and Feeding Difficulties is already attributed
          to hypotonia in the Hypotonia edge description above. Between this paragraph and the previous
          one, every phenotype in this entry that carries no incoming causal edge is accounted for.'
      selected_evidence:
        snippet: Common features included DD and/or ID (23/26, 88%), speech delay (22/26, 85%), head circumference
          less than the third percentile for age (11/26, 42%), motor delay (18/26, 69%), hypotonia (10/26,
          38%), and dysmorphic features (20/26, 77%).
        supports: SUPPORT
