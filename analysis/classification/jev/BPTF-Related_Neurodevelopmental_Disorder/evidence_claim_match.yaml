  c3dde9ad57f0640a183dd295d6bc1a52792ad42f7a66a552e0012c90f71c43c1:
    claim:
      about:
        disease:
          name: BPTF-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: NEDDFL
            term:
              id: MONDO:0060596
              label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bptf_mouse_homozygous_vs_human_haploinsufficiency
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the homozygous forebrain-conditional Bptf knockout mouse faithfully model human BPTF
          haploinsufficiency, given that heterozygous animals show little to no phenotype?
        attaches_to:
        - pathophysiology#Cortical Hypoplasia and Disrupted Lamination
        rationale: 'Human NEDDFL is a heterozygous, dosage-sensitivity disorder: one null allele produces
          microcephaly, intellectual disability, and speech delay. The principal mouse model is a homozygous
          conditional null restricted to the forebrain, and heterozygous mice were reported to have little
          to no phenotype. The mouse''s severe cortical hypoplasia is therefore a complete-loss phenotype,
          not a half-dosage phenotype, and the cellular mechanism it reveals (prolonged progenitor cell
          cycle, increased apoptosis, lamination failure) may be quantitatively or qualitatively different
          from what a 50% reduction produces in a human cortex. The species difference in dosage sensitivity
          is itself the open question. This is a translational validity problem, not an absence of evidence,
          hence HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP.'
        proposed_experiments:
        - experiment_id: bptf_het_mouse_deep_phenotyping
          name: Deep cortical phenotyping of Bptf heterozygous mice
          description: Phenotype Bptf heterozygous mice quantitatively for cortical volume, laminar composition,
            and progenitor kinetics rather than by gross inspection, to establish whether a subtle half-dosage
            phenotype exists.
        - experiment_id: bptf_het_ipsc_cortical_organoid
          name: Isogenic heterozygous BPTF-null human cortical organoids
          description: Derive isogenic human iPSC lines carrying patient BPTF null alleles in the heterozygous
            state and assay cortical organoid size, progenitor cell cycle length, and deep-layer neuron
            output against isogenic controls.
        - experiment_id: bptf_dosage_response_cross_species
          name: Cross-species BPTF dosage-response comparison
          description: Compare BPTF dosage-response curves for NURF assembly and target-gene expression
            between mouse and human cortical progenitors, to test whether the human system is simply steeper.
      selected_evidence:
        snippet: To model the NEDDFL syndrome, we generated forebrain-specific Bptf knockout (Bptf conditional
          Knockout (cKO)) mice.
        supports: SUPPORT
