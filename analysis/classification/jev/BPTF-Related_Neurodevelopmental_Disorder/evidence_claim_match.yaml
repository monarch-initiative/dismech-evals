        description: 'A heterozygous loss-of-function allele of BPTF at 17q24.2 (frameshift, nonsense,
          splice-site, exonic or whole-gene deletion, or gene-disrupting translocation) halves functional
          BPTF protein dosage. BPTF is dosage-sensitive: unlike many chromatin genes, one null allele
          produces overt human disease, and BPTF is the NURF-exclusive subunit, so its loss cannot be
          compensated by the other ISWI complexes that share the SNF2L/SNF2H ATPases.'
