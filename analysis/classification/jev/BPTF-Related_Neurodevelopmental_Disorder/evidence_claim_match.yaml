      assertion:
        name: Impaired NURF Chromatin-Remodeling Activity
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: BPTF is the largest subunit of NURF, an ISWI-family ATP-dependent chromatin-remodeling
          complex containing the SNF2L/SMARCA1 ATPase. BPTF reads active-chromatin marks - H3K4me3 through
          its PHD finger and H4K16ac through its bromodomain - and this reading is what tethers NURF to
          active promoters and delivers the SNF2L ATPase there for nucleosome sliding. When BPTF is reduced,
          NURF occupancy at H3K4me3-marked promoters falls and ATP-dependent nucleosome repositioning
          at those promoters is impaired.
        biological_processes:
        - preferred_term: ATP-dependent chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: DECREASED
        molecular_functions:
        - preferred_term: BPTF PHD finger reading of H3K4me3
          term:
