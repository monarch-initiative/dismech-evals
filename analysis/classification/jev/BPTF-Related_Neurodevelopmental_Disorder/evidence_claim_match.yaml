        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: OTUD6B-related intellectual developmental disorder with dysmorphic facies, seizures and
          distal limb anomalies
        disease_term:
          preferred_term: IDDFSDA
          term:
            id: MONDO:0044319
            label: intellectual developmental disorder with dysmorphic facies, seizures, and distal limb
              anomalies
        description: An ultra-rare autosomal recessive multisystem disorder caused by biallelic OTUD6B
          variants (OMIM:617452), a ubiquitin-proteasome-system disorder of development. It shares the
          "dysmorphic facies ... and distal limb anomalies" phrasing with NEDDFL and overlaps clinically
          (developmental delay, microcephaly, dysmorphism, distal limb findings), but is mechanistically
          and genetically distinct.
        distinguishing_features:
        - 'Inheritance: biallelic and autosomal recessive (OTUD6B) versus heterozygous and autosomal dominant,
          typically de novo (BPTF). The inheritance mode alone separates them in almost every family.'
        - 'Mechanism: impaired 26S proteasome assembly and reduced chymotrypsin-like proteasome activity
          (OTUD6B) versus impaired NURF ATP-dependent chromatin remodeling (BPTF).'
        - Seizures are a defining, near-universal feature of the OTUD6B disorder and are named in its
          label, whereas in NEDDFL epilepsy occurs in a minority (about 19%) and was absent from the original
          clinical description.
        notes: 'The dismech OTUD6B entry carries the reciprocal NEC guardrail and deliberately excludes
          PMID:33522091 from all of its claims because that paper describes NEDDFL. The exclusion is honoured
          in the opposite direction here: no OTUD6B-specific citation is used anywhere in this BPTF entry.'
      selected_evidence:
        snippet: Epilepsy was not included in the initial descriptions of NEDDFL, but emerging evidence
          indicates that epileptic seizures occur in some affected individuals.
        supports: SUPPORT
