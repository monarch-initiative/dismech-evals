  3d88a4fdc269a0628f6a12f5ae94f04dfaaec48d7f07c5eeb10ecb01803164b5:
    claim:
      about:
        disease:
          name: BPTF-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: NEDDFL
            term:
              id: MONDO:0060596
              label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bptf_vs_smarca1_dosage_paradox
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does BPTF haploinsufficiency cause microcephaly when loss of its NURF ATPase partner
          SMARCA1/SNF2L causes brain overgrowth?
        attaches_to:
        - pathophysiology#Impaired NURF Chromatin-Remodeling Activity
        rationale: 'The simplest model of NEDDFL is that reduced BPTF impairs NURF, and impaired NURF
          impairs cortical neurogenesis. That model predicts that removing the NURF catalytic ATPase should
          phenocopy BPTF loss. It does not: Smarca1-null mice have enlarged brains, the direct opposite
          of the NEDDFL phenotype. This means either that BPTF has NURF-independent functions in the developing
          cortex, or that the two subunits have opposing dosage effects on the same complex, or that SNF2H-containing
          complexes compensate for Smarca1 loss but not for Bptf loss. Which of these is true determines
          whether NURF is actually the right therapeutic target concept for NEDDFL.'
        proposed_experiments:
        - experiment_id: bptf_smarca1_side_by_side_cortex
          name: Side-by-side cortical comparison of Bptf and Smarca1 conditional knockouts
          description: Compare cortical transcriptomes and progenitor kinetics side by side in forebrain-conditional
            Bptf and Smarca1 knockouts on the same genetic background, to determine whether the dysregulated
            gene sets overlap or diverge.
        - experiment_id: bptf_snf2l_cooccupancy_map
          name: BPTF and SNF2L chromatin co-occupancy mapping in cortical progenitors
          description: Map BPTF chromatin occupancy in cortical progenitors and ask what fraction of BPTF-bound
            sites are also SNF2L-bound, to quantify the size of the NURF-independent BPTF binding compartment.
        - experiment_id: bptf_myc_axis_microcephaly_test
          name: Test whether the BPTF-MYC axis accounts for the Bptf-specific microcephaly
          description: Test whether the NURF-independent BPTF interactome, including the MYC cofactor
            axis identified by RNA-seq binding-site enrichment, accounts for the microcephaly that Smarca1
            loss fails to reproduce.
      selected_evidence:
        snippet: Surprisingly, ablation of Smarca1 resulted in mice with enlarged brains, a direct contrast
          to the phenotype of NEDDFL patients.
        supports: SUPPORT
