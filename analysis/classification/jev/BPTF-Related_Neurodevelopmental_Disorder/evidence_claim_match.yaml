  437633414b2208c7457de369906e9bc7ac83129b40847972484d04bf884c521e:
    claim:
      about:
        disease:
          name: BPTF-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: NEDDFL
            term:
              id: MONDO:0060596
              label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
        context: []
      assertion_type: Diagnosis
      assertion:
        name: ACMG/AMP Variant Interpretation with Parental Testing
        description: 'Diagnosis requires a compatible phenotype plus a BPTF variant classified under ACMG/AMP
          criteria, supported by parental testing, phenotype match, population frequency, and predicted
          loss of function. In the expansion cohort, 20 variants were classified as 11 pathogenic, 7 likely
          pathogenic, and 2 VUS. Truncating and copy-number alleles are straightforward because loss of
          function is the established mechanism; missense alleles are the hard case and a missense VUS
          alone does not establish the diagnosis. That caution is not merely theoretical: severely affected
          missense carriers have since been reported (PMID:40415676), so a missense VUS can be neither
          dismissed nor accepted on phenotype severity alone.'
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        notes: Explicit negatives, recorded so their absence is not mistaken for a curation gap. (1) There
          are no formal consensus diagnostic criteria for NEDDFL; diagnosis is a compatible phenotype
          plus molecular confirmation. (2) There is no diagnostic biochemical, enzymatic, imaging, or
          circulating biomarker - a normal brain MRI in particular does not exclude the diagnosis, since
          most imaged individuals in the expansion cohort had normal studies. (3) No validated functional
          assay and no DNA-methylation episignature has been established for BPTF, despite NEDDFL being
          a chromatinopathy where an episignature might be expected; RNA sequencing and proteomics for
          resolving difficult variants remain investigational. (4) No newborn or general population screening
          exists; cascade testing is appropriate once a familial pathogenic variant is known.
      selected_evidence:
        snippet: it is anticipated that the finding of missense variants in BPTF may present a diagnostic
          challenge for practitioners, particularly in individuals with mild phenotypes
        supports: SUPPORT
