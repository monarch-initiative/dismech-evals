        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BPTF Haploinsufficiency
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'A heterozygous loss-of-function allele of BPTF at 17q24.2 (frameshift, nonsense,
          splice-site, exonic or whole-gene deletion, or gene-disrupting translocation) halves functional
          BPTF protein dosage. BPTF is dosage-sensitive: unlike many chromatin genes, one null allele
          produces overt human disease, and BPTF is the NURF-exclusive subunit, so its loss cannot be
          compensated by the other ISWI complexes that share the SNF2L/SNF2H ATPases.'
        gene:
          preferred_term: BPTF
          term:
            id: hgnc:3581
            label: BPTF
      selected_evidence:
        snippet: our data demonstrate the pathogenic role of BPTF haploinsufficiency in syndromic neurodevelopmental
          anomalies and extend the clinical spectrum of human disorders caused by ablation of chromatin
          remodeling complexes
        supports: SUPPORT
