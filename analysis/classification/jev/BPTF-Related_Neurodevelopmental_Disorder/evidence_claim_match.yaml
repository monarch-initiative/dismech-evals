      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: NEDDFL results from a heterozygous loss-of-function allele of BPTF; the gene is dosage-sensitive
          and a single null allele is sufficient to cause disease. Most reported variants arose de novo,
          but transmission from a mildly affected parent has been documented in four families, establishing
          autosomal dominant inheritance with variable expressivity rather than exclusively de novo occurrence.
          Transmitting parents range from isolated microcephaly without reported developmental delay,
          through learning disability with independent adult function, to a phenotype comparable to that
          of the proband. Penetrance has not been quantified.
        expressivity: VARIABLE
      selected_evidence:
        snippet: we report eight loss-of-function and two missense variants (eight de novo and two of
          unknown origin) in BPTF on 17q24.2
        supports: SUPPORT
