          and raises the incidence of programmed cell death, so fewer neurons are produced from the progenitor
          pool. Independently, CRISPR knockout of bptf in zebrafish increases apoptosis (TUNEL) in the
          developing head. Reduced neuronal output from a depleted and slow-cycling progenitor pool is
          the proximate cellular cause of the reduced brain size.
