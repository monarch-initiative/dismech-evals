            term:
              id: MONDO:0060596
              label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
        context: []
      assertion_type: Genetic
      assertion:
        name: BPTF
        gene_term:
          preferred_term: BPTF
          term:
            id: hgnc:3581
            label: BPTF
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Heterozygous loss-of-function variants in BPTF (17q24.2) are the sole known cause
          of NEDDFL, acting through an autosomal dominant, haploinsufficiency mechanism. The reported
          allelic spectrum is dominated by truncating/null alleles (frameshift, nonsense, splice-site,
          whole-gene and single-exon copy-number deletions, and a translocation disrupting the gene);
          a minority of missense alleles has been reported, historically associated with milder phenotypes
          although recent reports include severely affected missense carriers.
        notes: '`variant_origin: GERMLINE` is deliberate and covers both arms of the reported allelic
          spectrum. The majority of variants are de novo, but four families with transmission from a non-mosaic
          affected parent are documented (PMID:33522091 reports 14 de novo and four inherited among 20
          variants), so tagging the gene entry `DE_NOVO` would contradict the inherited arm recorded in
          `association`, in the disease-level `inheritance` block, and in the Genetic Counseling treatment.
          GERMLINE is true of every constitutional variant in both arms; the de novo/inherited split is
          quantified with its own cited evidence rather than compressed into this enum.

          Variant nomenclature in the literature uses the NM_004459.6 transcript (some later reports use
          NM_182641.4). No recurrent hotspot variant has been described; reported variants are distributed
          throughout the gene. Somatic BPTF alterations reported in cancer biology are a distinct literature
          and must not be conflated with the constitutional disorder.'
      selected_evidence:
        snippet: we report eight loss-of-function and two missense variants (eight de novo and two of
          unknown origin) in BPTF on 17q24.2
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
