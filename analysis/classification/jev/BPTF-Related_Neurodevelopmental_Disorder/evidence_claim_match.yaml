  6dc5122d0a433f53ad4e78b11e23cf83a50297906dbd9b3da4f28b4ea25e7e8c:
    claim:
      about:
        disease:
          name: BPTF-Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: NEDDFL
            term:
              id: MONDO:0060596
              label: neurodevelopmental disorder with dysmorphic facies and distal limb anomalies
        context: []
      assertion_type: AnimalModel
      assertion:
        name: bptf CRISPR F0 crispant zebrafish
        species: Danio rerio
        genotype: CRISPR-Cas9 bptf F0 crispant
        category: CRISPR F0 knockout zebrafish model
        description: CRISPR-Cas9 knockout of zebrafish bptf produces F0 mutant larvae with significantly
          reduced head size, increased apoptosis by TUNEL staining, and a substantially increased ceratohyal
          angle indicating abnormal craniofacial patterning (PMID:28942966). This model recapitulates
          both the microcephaly and the craniofacial dimensions of NEDDFL.
        modeled_mechanisms:
        - target: Postnatal Microcephaly and Growth Restriction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reduced head size in bptf F0 larvae is the cross-species correlate of the human
            microcephaly.
          readouts:
          - name: Larval head size
            target: Postnatal Microcephaly and Growth Restriction
            direction: DECREASED
            description: Head size of bptf F0 crispant larvae versus control larvae.
            interpretation: Significantly reduced head size is the model's microcephaly readout; it indexes
              reduced brain growth but not the postnatal timing of the human phenotype.
          limitations: Only partially recapitulates the human node. The zebrafish readout is larval head
            size in a complete loss-of-function crispant, so it captures reduced brain growth but not
            the defining postnatal (secondary) timing of the human microcephaly, and it says nothing about
            the accompanying somatic growth restriction, short stature, or growth hormone deficiency.
        - target: Disrupted Craniofacial and Limb Patterning
          relationship: RECAPITULATES
          description: Increased ceratohyal angle is an established quantitative readout of disrupted
            craniofacial patterning, and is the direct experimental support for the craniofacial arm of
            this node.
          readouts:
          - name: Ceratohyal angle
            target: Disrupted Craniofacial and Limb Patterning
            direction: INCREASED
            description: Angle of the ceratohyal cartilage of the craniofacial skeleton in bptf F0 crispants
              versus controls.
            interpretation: A substantially widened ceratohyal angle is the established quantitative index
              of abnormal craniofacial patterning in zebrafish.
          limitations: Supports the craniofacial arm only. No model has yet demonstrated the distal limb
            arm of this node, which is why the node is marked PROVISIONAL.
      selected_evidence:
        snippet: Using CRISPR-Cas9 genome editing of bptf in zebrafish to induce a loss of gene function,
          we observed a significant reduction in head size of F0 mutants compared to control larvae.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
