          modifier: INCREASED
          term:
            id: GO:0000165
            label: MAPK cascade
      selected_evidence:
        snippet: BRAF mutations confers a poor prognosis in Western CRC patients, particularly in metastatic
          CRC (mCRC) and its mutations occur in approximately 4-20% CRC, with the vast majority being
          the V600E hotspot mutation.
        supports: SUPPORT
