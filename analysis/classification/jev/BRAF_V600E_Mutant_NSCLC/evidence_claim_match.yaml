      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: acquired_braf_meck_resistance_model
        hypothesis_label: Acquired BRAF/MEK-Inhibitor Resistance Model
        status: CANONICAL
        description: Dual BRAF/MEK inhibition imposes treatment selection on heterogeneous tumor clones.
          Progression can arise through renewed MAPK output, PI3K-pathway signaling, receptor-kinase copy-number
          changes, or lineage-state changes. The class structure is established, but no single alteration
          explains every resistant tumor.
      selected_evidence:
        snippet: Potential drivers of resistance to either BRAF-TT monotherapy or BRAF/MEK combination
          were identified in 46% of patients and these included activating mutations in effectors of the
          MAPK and PI3K pathways, as well as alterations in U2AF1, IDH1, and CTNNB1.
        supports: SUPPORT
    origin:
