              label: non-small cell lung carcinoma
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_braf_v600e_lung_tumor_model
        hypothesis_label: Canonical BRAF V600E Lung-Tumor Model
        status: CANONICAL
        description: Somatic BRAF V600E produces RAS-independent monomeric RAF activity and sustained
          MEK-ERK signaling. In a permissive lung epithelial context, cooperating loss of tumor-suppressor
          or lineage-control programs permits MAPK-driven proliferation and survival to progress to invasive
          NSCLC. BRAF V600E alone can initiate proliferation yet also provoke a senescence-like arrest,
          so the mutation is a driver but not a complete mechanistic explanation for malignant progression.
      selected_evidence:
        snippet: BRaf(VE) expression initially induced proliferation that was followed by growth arrest
          bearing certain hallmarks of senescence. Consistent with Ink4a/Arf and TP53 tumor suppressor
          function, BRaf(VE) expression combined with mutation of either locus led to cancer progression.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17299132
      reference_title: A new mouse model to explore the initiation, progression, and therapy of BRAFV600E-induced
        lung tumors.
      evidence_source: MODEL_ORGANISM
      explanation: The lung-specific model separates oncogene-driven initiation from cooperating malignant
        progression.
