      assertion_type: DifferentialDiagnosis
      assertion:
        name: Non-V600 BRAF-Mutant NSCLC
        description: Class-II and class-III BRAF-mutant lung cancers share the NSCLC presentation but
          differ in RAS dependence, dimerization, kinase activity, and expected response to RAF monomer
          inhibitors.
        distinguishing_features:
        - Demonstrate the exact BRAF allele and assign its functional class rather than treating any BRAF
          mutation as V600E.
        - Class II signals as a RAS-independent dimer; class III has low or absent kinase activity and
          depends on activated RAS.
      selected_evidence:
        snippet: Class 1 BRAF mutations (BRAF V600 mutations) are RAS-independent, signal as monomers
          and are sensitive to current RAF ‘monomer’ inhibitors. Class 2 BRAF mutants are RAS-independent,
          signal as constitutive dimers and are resistant to vemurafenib.
        supports: SUPPORT
