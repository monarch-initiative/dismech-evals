              label: cutaneous melanoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Non-V600 BRAF-Mutant Cutaneous Melanoma
        description: These tumors can share the same cutaneous histology but carry class-II or class-III
          BRAF alleles with different dimerization, RAS dependence, kinase activity, and expected sensitivity
          to RAF monomer inhibitors.
        distinguishing_features:
        - Resolve the exact BRAF protein change rather than treating any BRAF mutation as V600 disease.
        - Class-I V600 mutants signal as RAS-independent monomers; class-II mutants signal as dimers and
          class-III mutants depend on activated RAS.
      selected_evidence:
        snippet: We have thus defined three distinct functional classes of BRAF mutants in human tumours.
        supports: SUPPORT
