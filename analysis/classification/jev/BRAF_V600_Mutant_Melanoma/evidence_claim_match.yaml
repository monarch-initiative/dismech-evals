      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_first_line_systemic_sequence
        prompt: Which patients with treatment-naive metastatic BRAF V600 melanoma should begin with checkpoint
          immunotherapy, targeted therapy, or a short planned targeted induction?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - treatments#Immune Checkpoint Blockade
        - treatments#Dabrafenib Plus Trametinib for Unresectable or Metastatic Disease
        - treatments#Encorafenib Plus Binimetinib
        rationale: DREAMseq and SECOMBIT support immunotherapy first for most enrolled patients, while
          current guidance still allows BRAF/MEK inhibition first in selected cases. Rapidly progressive
          symptomatic disease, brain metastases, prior adjuvant therapy, contraindications, and the limited
          feasibility of crossover make individual sequencing more nuanced than a universal rule.
      selected_evidence:
        snippet: In stage IV melanoma with a BRAFV600 mutation, first-line therapy with BRAF/MEK inhibitors
          can be offered as an alternative to immunotherapy, in selected cases.
        supports: SUPPORT
