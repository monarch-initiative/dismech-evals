      assertion:
        name: Cohort-dependent BRAF mutation frequency
        description: In a series of 106 primary cutaneous melanomas from western Turkey, 42.5% carried
          a BRAF mutation. This is a cohort proportion, not a population prevalence estimate; frequency
          varies with ancestry, melanoma subtype, anatomic site, age distribution, and testing strategy.
      selected_evidence:
        snippet: BRAF (42.5%), NRAS (15.1%), and CDKN2A (13.2%) were the 3 most common mutations.
        supports: SUPPORT
