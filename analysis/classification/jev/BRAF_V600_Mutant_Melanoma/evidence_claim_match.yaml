      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_braf_v600_melanoma_model
        hypothesis_label: Canonical BRAF V600 Melanoma Model
        status: CANONICAL
        description: A somatic class-I BRAF codon-600 mutant drives RAS-independent MEK-ERK signaling
          and melanocyte proliferation. BRAF V600E alone can generate benign melanocytic hyperplasia or
          oncogene-induced arrest, so malignant progression requires additional permissive changes. PTEN
          loss is a experimentally established cooperating route that activates PI3K-AKT-mTOR survival
          signaling and permits invasive, metastatic melanoma.
      selected_evidence:
        snippet: Mutated BRAF proteins have elevated kinase activity and are transforming in NIH3T3 cells.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
