        association: Causative
        presence: Positive
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'BRPF1 lies at 3p25.3 (GRCh38 chr3:9731735-9748015, per the ClinGen dosage record cited
          below). Reported pathogenic alleles are heterozygous and predominantly loss-of-function - nonsense,
          frameshift, and whole- or partial-gene deletions - with a minority of missense and stop-loss
          variants whose pathogenicity requires variant-specific functional support. Both de novo and
          inherited alleles are common, and one sibship is explained by parental gonadal mosaicism. A
          contiguous 3p25 deletion may remove BRPF1 with the neighbouring SETD5; in that setting both
          genes contribute to severity, but ptosis and blepharophimosis track with BRPF1 loss specifically.
          No robust genotype-phenotype correlation by variant position has been established. The authoritative
          dosage-mechanism assertion is ClinGen''s: haploinsufficiency score 3 (Sufficient Evidence),
          triplosensitivity score 0 (No Evidence), curated 2023-08-23 against MONDO:0015022. gnomAD constraint
          (pLI/LOEUF) is deliberately not asserted: no cached, quotable source for the exact values was
          available, and per the project evidence SOP an unsourceable number is dropped rather than approximated.'
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: Heterozygous BRPF1 variants segregate in an autosomal dominant pattern with variable
            expressivity; in one multiplex family the variant segregated fully with disease across two
            generations.
      selected_evidence:
        snippet: BRPF1 | HGNC:14255 | 7862 | 3p25.3 | chr3:9731735-9748015 | 3 - Sufficient Evidence for
          Haploinsufficiency | 0 - No Evidence for Triplosensitivity | 2023-08-23
        supports: SUPPORT
