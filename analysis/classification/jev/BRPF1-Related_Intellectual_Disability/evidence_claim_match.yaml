      assertion_type: Phenotype
      assertion:
        category: Neurologic
        name: Microcephaly
        description: Microcephaly is part of the wider 3p25 deletion phenotype and was significantly enriched
          in individuals with BRPF1 disruption relative to SETD5-only deletions, but it is uncommon in
          BRPF1 point-variant cohorts.
        phenotype_term:
          preferred_term: Microcephaly
          term:
            id: HP:0000252
            label: Microcephaly
        frequency: OCCASIONAL
        notes: 'Frequency derivation: two of 29 patients in Colson et al. 2025 had congenital microcephaly
          and none acquired it. 2/29 = 7%, which falls in the OCCASIONAL band (5-29%). Earlier reports
          give higher rates, which is consistent with the historical over-representation of contiguous
          3p25 deletions.'
      selected_evidence:
        snippet: Their data demonstrated that microcephaly and ptosis (either unilateral or bilateral)
          and/or blepharophimosis were significantly more common in those with BRPF1 disruptions
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/39
      evidence_path: /phenotypes/39/evidence/1
