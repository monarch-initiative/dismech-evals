            term:
              id: MONDO:0015022
              label: intellectual developmental disorder with dysmorphic facies and ptosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: brpf1_zygosity_and_species_model_mismatch
        prompt: Do the mouse Brpf1 models, which are homozygous or conditional nulls with lethal phenotypes,
          validly model human heterozygous BRPF1 haploinsufficiency, in which life expectancy appears
          normal and some carriers have normal IQ?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Aberrant Cortical Neurogenesis and Callosal Development
        - pathophysiology#Impaired Hematopoietic Stem and Progenitor Cell Maintenance
        - pathophysiology#Impaired Learning and Memory
        rationale: 'Most of the mechanistic BRPF1 literature uses complete loss of function: constitutive
          knockout is lethal around embryonic day 9.5, forebrain-specific inactivation causes early postnatal
          lethality with partial callosal agenesis, and blood-specific deletion causes fatal bone marrow
          failure. Human disease is heterozygous, non-lethal, and often mild - one reported carrier has
          normal intellectual development. Only the Brpf1 heterozygous mouse (PMID:31213987) matches human
          zygosity, and it is the model that yields the subtlest phenotype. Treating null-allele findings
          as the human mechanism risks systematically overstating severity, particularly for the callosal
          and hematopoietic arms where human evidence is a minority finding and a single family respectively.'
        proposed_experiments:
        - experiment_id: exp_brpf1_human_allelic_series_organoid
          name: BRPF1 zygosity-matched allelic series in human iPSC-derived cortical neurons and organoids
          description: In an isogenic human iPSC background, build a BRPF1 allelic series (heterozygous
            null, heterozygous patient truncating and missense alleles, homozygous null) and differentiate
            to cortical neurons and forebrain organoids. Read out H3K23 acetylation and propionylation,
            chromatin accessibility, intermediate-progenitor (TBR2) abundance, dendritic arborization,
            and excitatory and inhibitory synaptic physiology. This directly tests whether the heterozygous
            human state reproduces the null-allele mouse phenotypes and, if so, at what magnitude.
          experiment_type:
            preferred_term: isogenic allelic-series loss-of-function experiment
        - experiment_id: exp_brpf1_episignature
          name: Test for a BRPF1 DNA methylation episignature in patient blood
          description: Episignatures are established for KAT6A and for the KAT6B disorders but not for
            BRPF1. Profile genome-wide DNA methylation in blood from a variant-confirmed BRPF1 cohort
            against matched controls and against KAT6A and KAT6B cases. A positive result would give the
            first human-tissue molecular readout of heterozygous BRPF1 dosage, would resolve BRPF1 variants
            of uncertain significance, and would show whether the three complex members converge on one
            signature or separate.
          experiment_type:
            preferred_term: DNA methylation episignature study
      selected_evidence:
        snippet: Here, we report that forebrain-specific inactivation of the mouse Brpf1 gene caused early
          postnatal lethality, neocortical abnormalities, and partial callosal agenesis.
        supports: SUPPORT
