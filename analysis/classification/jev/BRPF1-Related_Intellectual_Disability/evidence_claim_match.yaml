      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous BRPF1 Loss-of-Function Variation
        description: The initiating lesion is a heterozygous BRPF1 variant, either de novo or inherited.
          Reported alleles are predominantly protein-truncating (nonsense, frameshift) or whole-gene/partial
          deletions, with a smaller number of missense and stop-loss alleles; a single 3p25 contiguous
          deletion can remove BRPF1 together with SETD5.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        genes:
        - preferred_term: BRPF1
          term:
            id: hgnc:14255
            label: BRPF1
        genetic_context:
          gene:
            preferred_term: BRPF1
            term:
              id: hgnc:14255
              label: BRPF1
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous BRPF1 truncating, splice, deletion and missense alleles. Recorded
            as LOSS_OF_FUNCTION (haploinsufficiency).
      selected_evidence:
        snippet: We performed exome sequencing in a large family affected by an autosomal-dominant form
          of mild syndromic ID with ptosis, growth retardation, and hypotonia, and we identified an inherited
          2 bp deletion causing a frameshift in BRPF1 (c.1052_1053del) in five affected family members.
        supports: SUPPORT
