  28ae45f7ccf226dea10a27876633c5954a39f5d15b58635c896de583fed3c4d1:
    claim:
      about:
        disease:
          name: BRPF1-Related Intellectual Disability
          disease_term:
            preferred_term: intellectual developmental disorder with dysmorphic facies and ptosis
            term:
              id: MONDO:0015022
              label: intellectual developmental disorder with dysmorphic facies and ptosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deregulated Ocular and Periocular Developmental Transcription Factor Programs
        description: 'The ocular and periocular arm of the phenotype - ptosis, blepharophimosis and strabismus,
          the features that discriminate BRPF1 from co-deleted SETD5 - has until now had no mechanistic
          route in this graph. The proposed route is that BRPF1 loss deregulates transcription of the
          ocular developmental transcription factors Pitx2, Hmx1 and Pax6, each independently implicated
          in ocular developmental malformation, and that the resulting disruption of periocular morphogenesis
          produces the eyelid and ocular-alignment phenotypes. This is an inference drawn by the authors
          of the largest cohort from the animal and cell-based BRPF1 literature, not a demonstration in
          human periocular tissue: no BRPF1 model reproduces ptosis or blepharophimosis, so the node is
          marked HYPOTHETICAL and is the subject of an open HUMAN_MODEL_MISMATCH discussion.'
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        biological_processes:
