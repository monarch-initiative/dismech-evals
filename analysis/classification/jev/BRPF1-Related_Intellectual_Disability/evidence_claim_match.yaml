      assertion_type: Phenotype
      assertion:
        category: Ophthalmologic
        name: Subclinical Optic Neuropathy
        description: Bilateral subclinical optic neuropathy detected only by optical coherence tomography
          was found in two unrelated BRPF1 patients. Because it is asymptomatic it is easily missed on
          routine examination; the finding is the basis for recommending OCT-inclusive ophthalmological
          evaluation. Evidence rests on two cases.
        phenotype_term:
          preferred_term: Optic neuropathy
          term:
            id: HP:0001138
            label: Optic neuropathy
        notes: Frequency deliberately omitted. The only source is a two-patient OCT series with no cohort
          denominator, and because detection requires OCT the observed rate in any cohort not systematically
          imaged is uninformative. Colson et al. 2025 note only that two patients with frameshift variants
          have been described with optic neuropathy.
      selected_evidence:
        snippet: Having detected a peculiar ocular phenotype in P1, we suggested optical coherence tomography
          (OCT) for P2; such an exam also detected bilateral subclinical optic neuropathy in this case.
        supports: SUPPORT
