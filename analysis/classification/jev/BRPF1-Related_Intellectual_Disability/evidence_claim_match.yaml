            term:
              id: MONDO:0015022
              label: intellectual developmental disorder with dysmorphic facies and ptosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Cortical Neurogenesis and Callosal Development
        description: Forebrain-specific Brpf1 inactivation in mouse produces neocortical abnormalities
          and partial callosal agenesis, with a reduced pool of Tbr2-positive intermediate neuronal progenitors
          and aberrant neurogenesis. Transcriptionally, Brpf1 loss both decreases neocortical developmental
          genes (Robo3, Otx1) and de-represses Hox and other transcription factors, so BRPF1 acts as both
          activator and silencer. This node supplies the developmental mechanism for the human corpus
          callosum anomalies, but the mouse model is a conditional homozygous null and is far more severe
          (early postnatal lethality) than human heterozygous disease.
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: forebrain development
          term:
            id: GO:0030900
            label: forebrain development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Here, we report that forebrain-specific inactivation of the mouse Brpf1 gene caused early
          postnatal lethality, neocortical abnormalities, and partial callosal agenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
