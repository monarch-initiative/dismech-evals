      assertion:
        name: Impaired BRPF1-KAT6 Acetyltransferase Complex Function
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        description: 'BRPF1 is the scaffold subunit of tetrameric MYST acetyltransferase complexes built
          around KAT6A (MOZ), KAT6B (MORF), or KAT7 (HBO1) plus ING4/ING5 and MEAF6. Reduced BRPF1 dose
          destabilizes assembly and activation of these complexes. This node is the mechanistic point
          at which BRPF1 disease converges with, but is not identical to, KAT6A- and KAT6B-related disorders:
          the enzymes have BRPF1-independent activities and BRPF1 has partners beyond KAT6A/KAT6B, which
          is the accepted explanation for the partial rather than complete clinical overlap.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        molecular_functions:
        - preferred_term: histone acetyltransferase activity
          term:
            id: GO:0004402
            label: histone acetyltransferase activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: MOZ/MORF histone acetyltransferase complex
          term:
            id: GO:0070776
            label: MOZ/MORF histone acetyltransferase complex
          modifier: ABNORMAL
      selected_evidence:
        snippet: Within these complexes, BRPF1 serves as a scaffold for bridging subunit interaction,
          stimulating acetyltransferase activity, governing substrate specificity and stimulating gene
          expression.
        supports: SUPPORT
