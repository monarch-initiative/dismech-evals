      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: h3k23_acetylation_loss
        hypothesis_label: H3K23 Acetylation Deficiency Branch
        status: CANONICAL
        description: The canonical molecular lesion is loss of BRPF1-dependent acetylation of histone
          H3 at lysine 23. Patient-derived BRPF1 variants impair H3K23 acetylation in functional assays,
          and the same deficiency is reproduced in Brpf1-knockout mice, making this the best-supported
          route from gene to chromatin defect.
      selected_evidence:
        snippet: Functional assays showed that the resulting BRPF1 variants are pathogenic and impair
          acetylation of histone H3 at lysine 23, an abundant but poorly characterized epigenetic mark.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
