  ac3006287a99443d66f5a8a7fe9812ccb63369f8a14273951608efd76919b279:
    claim:
      about:
        disease:
          name: BRPF1-Related Intellectual Disability
          disease_term:
            preferred_term: intellectual developmental disorder with dysmorphic facies and ptosis
            term:
              id: MONDO:0015022
              label: intellectual developmental disorder with dysmorphic facies and ptosis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Chromosomal microarray or exome-based copy-number analysis
        description: 'Sequence-level analysis alone misses a real fraction of cases. Whole-gene BRPF1
          deletions and contiguous 3p25.3 deletions spanning BRPF1 and the neighbouring SETD5 are an established
          route to the phenotype: two of the 17 unique alleles in the largest cohort were complete gene
          deletions, detected by array CGH rather than by sequencing, and the founding series identified
          BRPF1 deletions alongside point mutations. Copy-number analysis is therefore required in parallel
          with sequencing - either as read-depth CNV calling on the exome or genome data, or as a chromosomal
          microarray when the sequencing pipeline does not call CNVs. Segregation of a detected deletion
          can be confirmed by qPCR.'
        diagnosis_term:
          preferred_term: chromosomal microarray analysis
          term:
            id: NCIT:C18477
            label: Microarray Analysis
        results: A heterozygous whole-gene BRPF1 deletion, or a contiguous 3p25.3 deletion encompassing
          BRPF1 with or without SETD5, establishes the diagnosis; a deletion spanning SETD5 as well predicts
          a more severe intellectual phenotype than BRPF1 loss alone.
      selected_evidence:
        snippet: Apart from the variant in BRPF1, no additional genomic changes were detected by WES and
          chromosomal microarray analysis (CMA).
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
