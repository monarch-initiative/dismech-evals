          data (55%), of whom six were mild and 10 moderate. 16/29 = 55%, which falls in the FREQUENT
          band (30-79%). The band is not OBLIGATE: a speech-ascertained cohort found FSIQ >= 70 in all
          four formally tested participants (PMID:38346666) and at least one carrier has normal intellect
          (PMID:35243762).'
      selected_evidence:
        snippet: 'Of the 29 patients with available data, 16 (55%) presented with ID of varying severity:
          six patients had mild ID, while 10 patients had moderate ID.'
