          term:
            id: HP:0000750
            label: Delayed speech and language development
        frequency: VERY_FREQUENT
        notes: 'Frequency derivation: the dedicated speech-pathology cohort found language disorder in
          11/12 assessed (92%), which falls in the VERY_FREQUENT band (80-99%), and describes involvement
          as universal. The band is retained against a lower figure in Colson et al. 2025, where "delayed
          speech and language development" was recorded as a reported developmental-milestone item in
          13/29 (46%, FREQUENT band) rather than by formal speech-language assessment; the two numbers
          measure different things and only the former is a direct measurement of the phenotype.'
