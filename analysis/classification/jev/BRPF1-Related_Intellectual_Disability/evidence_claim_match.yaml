      assertion_type: Treatment
      assertion:
        name: Experimental Pharmacologic Restoration of H3K23 Acylation
        description: Preclinical only. Because the molecular lesion is a deficit of H3K23 acetylation
          and propionylation, agents that raise histone acylation - propionate and butyrate as acyl-CoA
          precursors, and the histone deacetylase inhibitors valproate and vorinostat - were shown to
          promote H3K23 acylation in cell systems, and the authors proposed mutation-based therapy on
          that basis. There is no clinical trial, no in vivo efficacy data, and no evidence of benefit
          in BRPF1 patients; valproate in particular is a known human teratogen and neurodevelopmental
          risk and must not be inferred as a treatment for this disorder from these data.
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: butyrate
            term:
              id: CHEBI:17968
              label: butyrate
          - preferred_term: propionate
            term:
              id: CHEBI:17272
              label: propionate
          - preferred_term: vorinostat
            term:
              id: CHEBI:45716
              label: vorinostat
        therapeutic_modality: SMALL_MOLECULE
        notes: Listed for mechanistic completeness and to document the rationale, not as a recommended
          intervention. Valproate is contraindicated in pregnancy and carries neurodevelopmental risk;
          nothing in the cited work supports its clinical use in BRPF1-related disorder.
      selected_evidence:
        snippet: suggest mutation-based therapy for medical conditions with deficient histone acylation
        supports: SUPPORT
