        description: A separate organ arm. In mice, blood-specific Brpf1 deletion causes acute bone marrow
          failure and aplastic anemia with severe loss of hematopoietic stem cells and progenitors, raised
          reactive oxygen species, senescence and apoptosis, and reduced multipotency-gene expression
          - and BRPF1 is required for H3K23 acetylation in this compartment too. In humans only one family
          with anemia and thrombocytopenia has been reported, and the mouse data are homozygous conditional
          nulls, so this arm is biologically plausible but clinically unproven.
        biological_scale: CELLULAR
