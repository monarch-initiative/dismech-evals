      - /disease_term
    evidence_metadata:
      reference: PMID:31020800
      reference_title: BRPF1-associated intellectual disability, ptosis, and facial dysmorphism in a multiplex
        family.
      evidence_source: HUMAN_CLINICAL
      explanation: Attributes microcephaly within the 3p25 deletion region specifically to BRPF1 dosage
        rather than to SETD5.
