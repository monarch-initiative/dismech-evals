      assertion:
        name: Arboleda-Tham syndrome (KAT6A)
        description: 'The closest mechanistic neighbour: KAT6A is one of the acetyltransferases BRPF1
          scaffolds, and much of the "BRPF1-KAT6A complex" literature reports KAT6A patients rather than
          BRPF1 patients. Clinically the two are separable. Arboleda-Tham syndrome is almost always de
          novo, features near-universal intellectual disability with profound expressive speech delay,
          microcephaly, congenital cardiac septal defects, and gastrointestinal dysmotility. BRPF1-related
          disorder is frequently inherited, intellectual disability is milder and sometimes absent, and
          ptosis with blepharophimosis dominates the facial gestalt. The founding BRPF1 paper states the
          overlap is partial rather than identical.'
        disease_term:
