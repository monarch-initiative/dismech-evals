            term:
              id: MONDO:0015022
              label: intellectual developmental disorder with dysmorphic facies and ptosis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: h3k23_propionylation_loss
        hypothesis_label: H3K23 Propionylation Deficiency Branch
        status: EMERGING
        description: 'A later-recognized, non-redundant arm: the same BRPF1-KAT6 complexes also catalyze
          H3K23 propionylation, and patient BRPF1 variants impair this acylation as well. Whether the
          propionylation deficit contributes to the clinical phenotype independently of the acetylation
          deficit is not established; the two marks are currently inseparable in patient material. This
          branch nonetheless motivates the pharmacologic acylation-restoration strategy (propionate, butyrate,
          valproate, vorinostat) that has so far been demonstrated only in cell systems.'
      selected_evidence:
        snippet: Moreover, we identify BRPF1 variants in 12 previously unidentified cases of syndromic
          intellectual disability and demonstrate that these cases and known BRPF1 variants impair H3K23
          propionylation.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
