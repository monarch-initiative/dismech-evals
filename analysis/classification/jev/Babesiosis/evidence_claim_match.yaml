  bca1337f0b4429e299de44123d989b39dc624f0d74ea995409ae8ccd0fa8724b:
    claim:
      about:
        disease:
          name: Babesiosis
          disease_term:
            preferred_term: babesiosis
            term:
              id: MONDO:0005661
              label: babesiosis
        context: []
      assertion_type: Phenotype
      assertion:
        category: Hematologic
        name: Hemophagocytic lymphohistiocytosis
        description: An extremely rare but potentially fatal complication of babesiosis, assessed against
          the HLH-2004 criteria. Reported cases span both immunocompetent hosts and patients with an immunosuppressive
          context (an asplenic renal transplant recipient on immunosuppressive therapy; a patient on rituximab
          for amyopathic dermatomyositis with interstitial lung disease), and the tabulated parasitemias
          range from under 1% to 13%. Neither immunosuppression nor high-grade parasitemia is therefore
          a prerequisite, consistent with the caveat this entry already curates that not all subjects
          with end-organ dysfunction had high-grade parasitemia.
        phenotype_term:
          preferred_term: Hemophagocytic lymphohistiocytosis
          term:
            id: HP:0012156
            label: Hemophagocytosis
        notes: 'HP:0012156 Hemophagocytosis is the closest available binding: HPO has no hemophagocytic
          lymphohistiocytosis class, and HP:0012156''s own definition names "hemophagocytic syndrome (also
          known as hemophagocytic lymphohistiocytosis)" as a condition in which the feature is observed.
          The binding is nonetheless broader than the phenotype curated here in one direction and narrower
          in another: hemophagocytosis is one of the eight HLH-2004 criteria rather than a superclass
          of HLH, and the cited paper''s index case showed dyserythropoiesis rather than hemophagocytosis
          on bone marrow biopsy, while a later reported case showed hemophagocytosis. preferred_term carries
          the intended concept. Compare Immunodeficiency_69, where the binding was omitted because that
          source stated positively that no hemophagocytosis was found.'
      selected_evidence:
        snippet: Hematologic manifestations of the disease are common. They can range from mild anemia,
          to severe pancytopenia, splenic rupture, disseminated intravascular coagulopathy (DIC), or even
          hemophagocytic lymphohistiocytosis (HLH).
        supports: SUPPORT
    origin:
