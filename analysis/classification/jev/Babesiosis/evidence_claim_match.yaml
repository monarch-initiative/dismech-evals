        prompt: Can tafenoquine be used safely and effectively as an adjunct to standard care for human
          babesiosis, and which regimen prevents relapse without unacceptable hemolytic risk?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - clinical_trials#NCT06207370
        - pathophysiology#Impaired host clearance and persistent parasitemia
        rationale: Tafenoquine plus atovaquone cures B. microti and B. duncani mouse models, and a small
          human relapsing-babesiosis series suggests adjunctive activity, but tafenoquine monotherapy
          failed in one case. A recruiting randomized Phase II add-on trial is testing hospitalized patients
          at low relapse risk; efficacy, optimal combinations, immunocompromised-host use, resistance,
          and G6PD-related safety remain unresolved.
      selected_evidence:
        snippet: We further show that a combination of tafenoquine and atovaquone achieves cure with no
          recrudescence in both models of human babesiosis.
        supports: SUPPORT
