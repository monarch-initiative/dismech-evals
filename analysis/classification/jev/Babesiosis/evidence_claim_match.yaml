      assertion_type: DifferentialDiagnosis
      assertion:
        name: Human granulocytic anaplasmosis
        description: Anaplasmosis shares Ixodes scapularis exposure, fever, headache, myalgia, leukopenia,
          and thrombocytopenia with babesiosis, and coinfection can occur.
        distinguishing_features:
        - Hemolytic anemia and intraerythrocytic parasites favor babesiosis.
        - Species-specific blood PCR distinguishes Babesia from Anaplasma phagocytophilum.
        - Detection of granulocytic morulae supports anaplasmosis rather than babesiosis.
      selected_evidence:
        snippet: B. microti, Borrelia burgdorferi and Anaplasma phagocytophilum are all transmitted by
          black-legged ticks ( Ixodes scapularis) and therefore co-infection is likely and has been reported.
        supports: SUPPORT
