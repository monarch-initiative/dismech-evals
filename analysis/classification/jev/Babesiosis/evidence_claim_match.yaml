      assertion_type: DifferentialDiagnosis
      assertion:
        name: Malaria
        description: Malaria can cause a febrile intraerythrocytic parasitemia with anemia and may resemble
          babesiosis on thin blood smear, particularly when ring forms are sparse.
        disease_term:
          preferred_term: malaria
          term:
            id: MONDO:0005136
            label: malaria
        distinguishing_features:
        - Travel or residence in a malaria-endemic area shifts the pretest probability.
        - Expert morphology, species-specific PCR, and appropriate rapid antigen tests distinguish Plasmodium
          from Babesia.
        - Babesia can show tetrads, while Plasmodium has species-specific pigment and developmental forms.
      selected_evidence:
        snippet: Distinguishing <em>Babesia</em> and <em>Plasmodium</em> parasites (especially <em>P.
          falciparum</em>) and artifacts like stain or platelet debris can be challenging.
        supports: SUPPORT
