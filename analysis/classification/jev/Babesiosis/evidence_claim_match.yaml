      assertion:
        name: Impaired host clearance and persistent parasitemia
        role: MODIFIER
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
        description: 'Asplenia, advanced age, and immunosuppressive disease or therapy impair parasite
          clearance, enabling persistent or relapsing infection and raising the risk of high parasite
          burden. The specific risk set is informative about which defenses matter: asplenia removes the
          filtration site for parasitized erythrocytes, while B-cell lymphoma and rituximab — singled
          out by CDC — implicate humoral immunity alongside the CD4/IFN-gamma cellular arm demonstrated
          in mouse models. Congestive heart failure appears on the severe-disease risk list as a host
          vulnerability, not as a manifestation.'
      selected_evidence:
        snippet: follows a persistent, relapsing, and/or life threatening course with multi-organ failure,
          mainly in the splenectomized or immunosuppressed patients.
        supports: SUPPORT
