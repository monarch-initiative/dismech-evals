      assertion:
        phase: Persistent or relapsing infection
        duration: Weeks to months or longer in highly immunocompromised patients.
        notes: Impaired splenic or immune clearance can require prolonged therapy and close smear monitoring.
      selected_evidence:
        snippet: Babesiosis, a zoonotic parasitic infection transmitted by the Ixodes tick, has become
          an emerging health problem in humans that is attracting attention worldwide. Most cases of human
          babesiosis are reported in the United States and Europe. The disease is caused by the protozoa
          of the genus Babesia, which invade human erythrocytes and lyse them causing a febrile hemolytic
          anemia. The infection is usually asymptomatic or self-limited in the immunocompetent host, or
          follows a persistent, relapsing, and/or life threatening course with multi-organ failure, mainly
          in the splenectomized or immunosuppressed patients.
        supports: SUPPORT
