        prompt: Which host, parasite, inflammatory, and organ-specific factors explain severe end-organ
          dysfunction when peripheral parasitemia is not high?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Parasitemia-associated multisystem dysfunction
        rationale: Peak parasitemia correlates strongly with severity and informs exchange transfusion
          decisions, but some patients with organ dysfunction lack high-grade parasitemia. A parasite-percentage
          threshold therefore cannot fully represent tissue injury, host vulnerability, or timing.
      selected_evidence:
        snippet: Babesia microti parasitemia is closely associated with disease severity, though not all
          subjects with end-organ dysfunction had high-grade parasitemia.
        supports: SUPPORT
