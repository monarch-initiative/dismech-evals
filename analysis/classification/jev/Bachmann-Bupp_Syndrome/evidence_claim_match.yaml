              label: neurodevelopmental disorder with alopecia and brain abnormalities
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: K6/ODC transgenic
        category: Transgenic
        description: The K6/ODC mouse expresses a mouse ODC cDNA carrying a premature stop codon at position
          427, driven by a bovine keratin 6 promoter, in outer root sheath keratinocytes of the hair follicle.
          The lesion is the same class as the human BABS allele - carboxyl truncation producing a stabilised,
          catalytically active enzyme - which is why this 1995-1996 model predicted the human syndrome.
          Mice have a normal first hair cycle, lose their hair completely from 2-3 weeks of age, and develop
          dermal follicular cysts. DFMO both prevents the hair loss and reactivates hair growth after
          complete loss. The model is skin-restricted, so it does not model the neurodevelopmental, growth
          or sensory features of BABS, and it also develops skin tumours, which has no established human
          BABS counterpart.
      selected_evidence:
        snippet: The ODC inhibitor 2-difluoromethylornithine could prevent hair loss and partially normalize
          skin histology if administered before the onset of ODC overexpression.
        supports: SUPPORT
