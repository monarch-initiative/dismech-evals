        prompt: The K6/ODC mouse reproduces the alopecia and follicular cysts of BABS and predicted the
          DFMO response, but it also develops skin tumours and is skin-restricted. Does whole-body expression
          of stabilised ODC in BABS patients carry a tumour risk, and does the absence of a whole-body
