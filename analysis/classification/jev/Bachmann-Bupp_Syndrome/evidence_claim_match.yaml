  17356da8153f4a714beb61a36a8b1e1e8e291f37470bfad72284b5e2069205b3:
    claim:
      about:
        disease:
          name: Bachmann-Bupp Syndrome
          disease_term:
            preferred_term: Bachmann-Bupp syndrome
            term:
              id: MONDO:0033642
              label: neurodevelopmental disorder with alopecia and brain abnormalities
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: ODC1 loss-of-function neurological phenotype
        description: 'The single most dangerous confusion for this entry, because it involves the same
          gene. Hypomorphic and loss-of-function ODC1 alleles, exemplified by the G84R missense variant
          present in roughly 1 percent of South Asian individuals and reducing enzyme function 2.5-fold,
          have been connected to intellectual disability and seizures. This is NOT Bachmann-Bupp syndrome:
          the direction of effect is opposite, the predicted consequence for neural progenitors is depletion
          rather than over-proliferation, the ODC-activity and putrescine elevations that define BABS
          are absent, and inhibiting ODC with eflornithine would be expected to aggravate rather than
          treat it. Importing ODC1 knockout or loss-of-function findings into a BABS mechanism graph is
          the specific error this differential exists to prevent.'
        distinguishing_features:
        - Same gene as BABS, so gene-level literature searches return both
        - Loss of function or hypomorphic missense (for example G84R) rather than C-terminal truncation
        - Reduced ODC enzyme activity, so the 12-17-fold fibroblast and 125-137-fold red cell activity
          elevations of BABS are absent
        - Predicted neural progenitor depletion rather than over-proliferation
        - Not associated with the BABS alopecia, macrocephaly or macrosomia
        - Eflornithine, the BABS therapy, would be mechanistically contraindicated
        notes: Deliberately left UNBOUND. This phenotype has no OMIM entry and no MONDO term of its own;
          the only ODC1-anchored MONDO term is MONDO:0033642, which is this entry's own disease_term and
          denotes the gain-of-function disorder. Binding this differential to any existing MONDO term
          would be a fabrication, so the entry is recorded with distinguishing features only.
      selected_evidence:
        snippet: An analysis of variants from ClinVar, Geno2MP, TOPMed, gnomAD, and COSMIC revealed an
          intellectual disability and seizure connected loss-of-function variant, ODC G84R (rs138359527,
          NC_000002.12:g.10444500C > T).
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/5
      evidence_path: /differential_diagnoses/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33806076
      reference_title: Emerging Role of ODC1 in Neurodevelopmental Disorders and Brain Development.
      evidence_source: COMPUTATIONAL
      explanation: Identifies the loss-of-function allele and the neurological phenotype connected to
