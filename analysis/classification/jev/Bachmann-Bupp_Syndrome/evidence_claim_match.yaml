              label: neurodevelopmental disorder with alopecia and brain abnormalities
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Alopecia-intellectual disability syndrome 4 (LSS-related)
        description: 'The closest clinical mimic outside the polyamine pathway, and the one that matters
          most at the bedside: a recessive neuroectodermal syndrome caused by biallelic LSS (lanosterol
          synthase) variants that pairs alopecia with intellectual disability or developmental delay,
          exactly the pairing that defines the BABS gestalt. The discriminator is the timing of the hair
          loss. In LSS-related disease the alopecia is CONGENITAL - total alopecia with sparse eyelashes
          and eyebrows is present at birth - whereas in BABS hair is typically present at birth and is
          then shed in large clumps within the first weeks of life. LSS disease is also autosomal recessive,
          frequently epileptic, and often accompanied by ichthyosis or erythroderma, and it sits in cholesterol
          rather than polyamine biosynthesis, so the BABS biochemical signature of raised N-acetylputrescine
          is absent and eflornithine is not rational therapy.'
        distinguishing_features:
        - Caused by biallelic LSS (lanosterol synthase) variants, not by ODC1
        - Autosomal recessive, not de novo autosomal dominant
        - Alopecia is CONGENITAL and total at birth, whereas BABS hair is present at birth and shed in
          clumps within weeks - this is the single most useful discriminator
        - Early-onset epilepsy is frequent, whereas seizures are a rare and typically late-onset finding
          in BABS
        - Ichthyosis and erythroderma are common; the BABS skin phenotype is recurrent follicular cysts
        - Cholesterol-biosynthesis rather than polyamine-pathway disorder, so ODC activity, putrescine
          and N-acetylputrescine are not elevated
        - Microcephaly is reported rather than the macrocephaly and macrosomia of BABS
        disease_term:
          preferred_term: Alopecia with intellectual disability syndrome 4
          term:
            id: MONDO:0030009
            label: alopecia-intellectual disability syndrome 4
      selected_evidence:
        snippet: It is a rare autosomal recessive condition characterized by hypotrichosis and intellectual
          disability (ID) or developmental delay (DD), frequently associated with early-onset epilepsy
          and other dermatological features.
        supports: SUPPORT
