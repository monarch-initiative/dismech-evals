  d4c55d123d6f2b207e2fc906ad05e03459232698cfae540f94a12823a8db2228:
    claim:
      about:
        disease:
          name: Bachmann-Bupp Syndrome
          disease_term:
            preferred_term: Bachmann-Bupp syndrome
            term:
              id: MONDO:0033642
              label: neurodevelopmental disorder with alopecia and brain abnormalities
        context: []
      assertion_type: Genetic
      assertion:
        name: ODC1
        gene_term:
          preferred_term: ODC1
          term:
            id: hgnc:8109
            label: ODC1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        inheritance:
        - name: Autosomal dominant
        features: 'Heterozygous de novo variants at the 3-prime end of ODC1 produce a C-terminally truncated
          ornithine decarboxylase. The index allele is c.1342A>T, a nonsense variant removing the last
          14 amino acids (p.Lys448Ter). Reported variants cluster in the last exon. Critically, the mechanism
          is GAIN of function through protein stabilisation, not loss of function: the truncated enzyme
          retains full catalytic activity and simply escapes degradation. Separate, rarer ODC1 loss-of-function
          alleles exist (for example the hypomorphic G84R missense variant, present in roughly 1 percent
          of South Asian individuals and reducing enzyme function 2.5-fold) and are associated with a
          different, non-BABS neurological picture; those must not be conflated with the BABS allele class.'
      selected_evidence:
        snippet: The ODC1 gene mutation (c.1342 A>T) was identified by whole-exome sequencing and confirmed
          by Sanger sequencing.
        supports: SUPPORT
