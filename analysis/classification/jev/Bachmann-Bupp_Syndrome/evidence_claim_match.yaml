  9f773ca1e6546bc9c40fedd1bd318b11788980fc59c1adf6fac3a16ffe49c0f3:
    claim:
      about:
        disease:
          name: Bachmann-Bupp Syndrome
          disease_term:
            preferred_term: Bachmann-Bupp syndrome
            term:
              id: MONDO:0033642
              label: neurodevelopmental disorder with alopecia and brain abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ODC1 C-Terminal Truncating Variant
        biological_scale: MOLECULAR
        description: A de novo heterozygous variant at the 3-prime end of ODC1 introduces a premature
          stop codon in the last exon, removing the carboxy-terminal residues of ornithine decarboxylase.
          The variants cluster in this region across reported patients, and the index allele c.1342A>T
          removes the last 14 amino acids.
        genes:
        - preferred_term: ODC1
          term:
            id: hgnc:8109
            label: ODC1
          modifier: ABNORMAL
        genetic_context:
          gene:
            preferred_term: ODC1
            term:
              id: hgnc:8109
              label: ODC1
          allele_type: nonsense
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: 'De novo heterozygous nonsense variants in the last exon of ODC1. Recorded as GAIN_OF_FUNCTION:
            the C-terminally truncated enzyme remains catalytically active and escapes antizyme-mediated
            proteasomal turnover, so the lesion increases ODC protein and activity rather than removing
            it.'
      selected_evidence:
        snippet: The condition is caused by 3'-end mutations of the ornithine decarboxylase 1 (ODC1) gene,
          which produce carboxy (C)-terminally truncated variants of ODC, a pyridoxal 5'-phosphate-dependent
          enzyme.
        supports: SUPPORT
