      assertion_type: DifferentialDiagnosis
      assertion:
        name: Snyder-Robinson syndrome
        description: The first-described and best-known polyaminopathy, and the disorder whose prior research
          the BABS team explicitly credits with accelerating BABS from discovery to treatment. It shares
          intellectual disability and hypotonia with BABS, and its literature uses the same polyamine-pathway
          vocabulary, so mechanism sentences are easily misattributed between the two. It is separated
          from BABS by the affected enzyme (spermine synthase, several steps downstream of ODC), by the
          direction of effect (loss of function, not gain), and by X-linked hemizygous rather than autosomal
          dominant transmission. Alopecia is not its presenting feature.
        distinguishing_features:
        - Caused by SMS (spermine synthase), not ODC1
        - Loss-of-function with decreased or absent enzyme activity, the opposite direction of effect
          to the ODC1 gain of function in BABS
        - X-linked, affecting hemizygous males, rather than de novo autosomal dominant
        - Osteoporosis, kyphoscoliosis, unsteady gait and facial asymmetry dominate; the non-congenital
          clump alopecia and macrocephaly/macrosomia of BABS are not its core
        - No ODC inhibitor therapy - inhibiting ODC would worsen an already spermine-deficient pathway
        disease_term:
          preferred_term: Snyder-Robinson syndrome
          term:
            id: MONDO:0010664
            label: syndromic X-linked intellectual disability Snyder type
      selected_evidence:
        snippet: Snyder-Robinson syndrome results from hemizygous loss-of-function variants in the spermine
          synthase (SMS) gene, resulting in decreased or complete loss of spermine synthase enzyme activity.
        supports: SUPPORT
    origin:
