  242833f041b24943b5446592d8c61fc071f789af671a11a95bd8fc437c4864bc:
    claim:
      about:
        disease:
          name: Bachmann-Bupp Syndrome
          disease_term:
            preferred_term: Bachmann-Bupp syndrome
            term:
              id: MONDO:0033642
              label: neurodevelopmental disorder with alopecia and brain abnormalities
        context: []
      assertion_type: Treatment
      assertion:
        name: Eflornithine (difluoromethylornithine, DFMO)
        description: Eflornithine is an irreversible ODC inhibitor and the mechanism-matched targeted
          therapy for BABS. It was repurposed from its existing indications (West African trypanosomiasis,
          paediatric neuroblastoma maintenance, and hirsutism) and first given to a BABS patient under
          a single-patient FDA Investigational New Drug application, 16 months after the syndrome was
          first published. The index regimen was an oral solution given by gastrostomy tube at 500 mg/m2
          twice daily, escalated to 750 and then 1000 mg/m2 twice daily, alongside a low-polyamine diet.
          Reported outcomes include hair regrowth beginning with the eyebrows at one month, immediate
          cessation of follicular cyst formation, increased muscle bulk and tone, acquisition of head
          control, unsupported sitting and self-feeding, and normalisation of cerebral white matter signal
          with resolution of subependymal cysts on MRI. Eflornithine is not an FDA-approved treatment
          for BABS and remains a compassionate-use therapy. Paediatric dosing and safety were taken from
          the neuroblastoma maintenance literature rather than from any BABS trial.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: eflornithine
            term:
              id: CHEBI:41948
              label: eflornithine
        notes: The published treated-patient outcomes are uncontrolled single-arm observations in a handful
          of children, with the index report explicitly noting that COVID-19 restrictions interrupted
          standardised neurological assessment. Hair regrowth and cyst cessation are unambiguous and were
          directly observed; the developmental and imaging gains are harder to attribute with certainty
          and should be read as promising rather than proven.
      selected_evidence:
        snippet: Eflornithine normalized polyamine levels without disrupting other pathways. She demonstrated
          remarkable improvement in both neurological symptoms and cortical architecture. She gained fine
          motor skills with the capacity to feed herself and sit with support.
        supports: SUPPORT
    origin:
