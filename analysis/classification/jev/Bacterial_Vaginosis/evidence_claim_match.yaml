              label: bacterial vaginosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bv_no_animal_model_vaginolysin_human_specific
        prompt: How much of BV pathogenesis can any animal model address, given that vaginolysin requires
          human CD59 and no animal has a lactobacillus-dominant acidic vagina?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Vaginolysin-Mediated Epithelial Pore Formation and Signalling
        - pathophysiology#Loss of Lactobacillus Dominance and Vaginal Acidification
        rationale: 'The species restriction here is not incidental, it is receptor-level: vaginolysin
          lyses cells only where human CD59 is present, and transfecting human CD59 into hamster cells
          is what makes them susceptible. Separately, the healthy state this disease departs from - a
          lactobacillus-dominant, lactic-acid-acidified vagina - is close to unique to humans, so there
          is no normal community for a model organism to lose. The consequence is that the murine work
          curated above can test one downstream arm (T-cell activation) and nothing else, and that essentially
          all mechanism in this entry rests on human samples and human cell lines. Reviews of BV have
          named the absence of a suitable animal model as a limiting factor for two decades.

          '
        proposed_experiments:
        - experiment_id: bv_humanised_cd59_and_hydrogel_models
          name: Human-relevant model systems for the two blocked arms
          description: 'For the toxin arm, a human-CD59 transgenic mouse or a human vaginal epithelial
            organ-chip perfused with defined consortia. For the community arm, a cervicovaginal-mucus
            hydrogel or organ-chip supporting stable L. crispatus dominance into which BV taxa can be
            introduced, giving a system in which the transition itself is observable.

            '
          decision_criterion: 'Whether either system reproduces vaginolysin-dependent epithelial responses
            and sialidase-mediated glycocalyx loss with human-like kinetics.

            '
      selected_evidence:
        snippet: Mechanistic studies of BV and its adverse consequences have been limited by the absence
          of definitive diagnostic testing and a suitable animal model
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
