              label: bacterial vaginosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Increased Susceptibility to HIV and Other Genital Tract Infections
        biological_scale: ORGANISM
        description: 'The consequence that dominates BV''s public-health importance. Meta-analysis of
          incidence studies puts the relative risk of HIV acquisition at 1.6, and a prospective South
          African cohort found over four-fold higher risk for the most diverse lactobacillus-deficient
          communities. Two distinct mechanisms feed this node and are curated separately upstream: loss
          of mucus trapping (a physical barrier failure) and recruitment of activated mucosal CD4+ T cells
          (target-cell supply). The evidence is not uniform across every downstream infection, and the
          PID arm in particular is a documented disagreement between two prospective cohorts rather than
          a settled result. Both are retained below. The Longitudinal Study of Vaginal Flora (N = 2956)
          found both Nugent-BV (aHR 1.53) and symptomatic Amsel-BV (aHR 2.15) associated with incident
          PID at the subsequent visit; the two intervals overlap and the study does not test the difference
          between them, so the figures do not establish a gradient by exposure definition. A community-based
          cohort found no association between a Gardnerella-dominated microbiome and subsequent PID. The
          two differ in ascertainment on both sides - Nugent and Amsel criteria against microbiome sequencing
          for the exposure, and clinic-based tenderness criteria against community follow-up for the outcome
          - and the negative study reports few PID cases, so this node records the association as contested
          rather than resolving it in either direction.

          '
        biological_processes:
        - preferred_term: response to bacterium
          term:
            id: GO:0009617
            label: response to bacterium
          modifier: DYSREGULATED
      selected_evidence:
        snippet: 'Bacterial vaginosis was associated with an increased risk of HIV acquisition in HIV-incidence
          studies (relative risk = 1.6, 95% confidence interval: 1.2, 2.1).'
        supports: SUPPORT
