      assertion:
        name: Epithelial Adhesion and Gardnerella-Dominated Adherent Biofilm
        biological_scale: TISSUE
        description: 'Gardnerella adheres to the vaginal epithelium and forms a confluent, structured
          biofilm into which other consortium members are incorporated. This is the one structural feature
          that FISH on vaginal biopsies found specific to BV rather than merely more abundant in it, and
          it is the physical object that makes BV a persistent rather than an episodic condition: a sessile,
          matrix-embedded community tolerates antimicrobial exposure that clears planktonic organisms.
          Prevotella (Hoylesella) timonensis adheres comparably well, so adhesion is not a Gardnerella
          monopoly even though biofilm architecture appears to be.

          '
        cell_types:
        - preferred_term: vaginal squamous epithelial cell
          term:
