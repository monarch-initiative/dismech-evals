  fcb23be4c80c78895aa4d1bfd920ad623fd4be412d06b46122b0c0efa7dde1f9:
    claim:
      about:
        disease:
          name: Bacterial Vaginosis
          disease_term:
            preferred_term: bacterial vaginosis
            term:
              id: MONDO:0005316
              label: bacterial vaginosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ascending Infection and Adverse Pregnancy Outcomes
        biological_scale: ORGANISM
        description: 'In pregnancy the same barrier failure permits organisms to reach the choriodecidual
          space, and BV detected early in pregnancy is associated with late miscarriage and preterm delivery
          independent of prior preterm birth. The enzyme measurement makes this more than an association:
          among women already in preterm labour with BV or intermediate flora, those with detectable vaginal
          sialidase had a higher rate of early preterm birth, which links the outcome to the specific
          molecular activity curated upstream rather than to the Nugent score alone. Screening-and-treatment
          trials have nonetheless been inconsistent, so this node records a mechanism and a risk association,
          not a demonstrated preventable fraction.

          '
        locations:
        - preferred_term: uterine cervix
          term:
            id: UBERON:0000002
            label: uterine cervix
      selected_evidence:
        snippet: A further logistic analysis of data from women recruited before 16 weeks' gestation showed
          that preterm deliveries or late miscarriages occurred more often in women with bacterial vaginosis
          (12/77; 5.5; 2.3 to 13.3; P < 0.001).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/0
