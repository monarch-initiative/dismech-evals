        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bacterial Sialidase and Glycosidase Degradation of the Mucus Barrier
        biological_scale: MOLECULAR
        description: 'The consortium secretes sialidases, fucosidases, beta-galactosidase and beta-N-acetylhexosaminidase
          that strip terminal sugars from cervicovaginal mucins and from the epithelial glycocalyx. This
          is the arm of BV pathogenesis with the clearest line to hard clinical outcomes, and it has been
          misattributed for two decades: biochemical work focused on Gardnerella, but vaginal Prevotella
          species are now shown to be a major and globally conserved source of vaginal sialidase, with
          P. (Hoylesella) timonensis carrying both sialidases and an unusual complement of fucosidases.
          Notably, the same 1999 study that found sialidase, beta-galactosidase and beta-N-acetylhexosaminidase
          elevated in BV found no increase in O-glycanase, proteinase, sulphatase or whole-mucinase activity
          - the degradation is glycosidic and selective, not general proteolysis, and that distinction
          is preserved here rather than flattened into "mucinase activity".

          '
        molecular_functions:
        - preferred_term: exo-alpha-sialidase activity
          term:
            id: GO:0004308
            label: exo-alpha-sialidase activity
          modifier: INCREASED
        chemical_entities:
        - preferred_term: sialic acid
          term:
            id: CHEBI:26667
            label: sialic acid
          modifier: DECREASED
        locations:
        - preferred_term: mucus
          term:
            id: UBERON:0000912
            label: mucus
      selected_evidence:
        snippet: The P. timonensis genome uniquely encodes a large set of mucus-degrading enzymes, including
          four putative fucosidases and two putative sialidases, PtNanH1 and PtNanH2.
        supports: SUPPORT
