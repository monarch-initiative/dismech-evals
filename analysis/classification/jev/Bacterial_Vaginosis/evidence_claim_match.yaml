  b4ac84cf57f627b0c10c270029739579f67a5495cb7be3f900863f424de63625:
    claim:
      about:
        disease:
          name: Bacterial Vaginosis
          disease_term:
            preferred_term: bacterial vaginosis
            term:
              id: MONDO:0005316
              label: bacterial vaginosis
        context: []
      assertion_type: Treatment
      assertion:
        name: Concurrent male-partner antimicrobial treatment
        description: 'Treating the woman''s regular male partner with 7 days of oral metronidazole plus
          2% clindamycin cream applied to penile skin, alongside her own first-line therapy. This is the
          only intervention here aimed at the reinfection route rather than at the woman''s own vaginal
          community, and it is a reversal: six trials in the 1980s-90s were negative and guidelines do
          not recommend it, but the 2025 StepUp trial was stopped early because withholding it was inferior.
          Curated as a treatment because the trial result is randomised and positive, with the guideline
          lag recorded in the notes.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Antibiotic Therapy
          term:
            id: NCIT:C15620
            label: Antibiotic Therapy
          therapeutic_agent:
          - preferred_term: metronidazole
            term:
              id: CHEBI:6909
              label: metronidazole
          - preferred_term: clindamycin
            term:
              id: CHEBI:3745
              label: clindamycin
        notes: Partner treatment was not recommended in guidelines at the time of the source review (PMID:34470644),
          which predates the StepUp result. The applicability of the trial is also bounded by its enrolment
          criterion - women in a monogamous relationship with a regular male partner - and should not
          be extended to other partnership contexts without evidence.
      selected_evidence:
        snippet: Adverse events in treated men included nausea, headache, and metallic taste.
        supports: SUPPORT
