            term:
              id: MONDO:0005316
              label: bacterial vaginosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Polymicrobial Anaerobic Overgrowth
        biological_scale: TISSUE
        description: 'Expansion of a dense, diverse consortium - Gardnerella spp., Prevotella (Hoylesella)
          spp., Fannyhessea (Atopobium) vaginae, Mobiluncus, Megasphaera, Sneathia and others - to concentrations
          orders of magnitude above baseline. This node is deliberately named for the community rather
          than for an organism: no single member reproduces the syndrome on inoculation, and each is recoverable
          from women without disease. Treating the consortium as the unit is what makes the broad anaerobic
          coverage of metronidazole and clindamycin the rational therapy, and it is why an organism-specific
          agent has never been developed.

          '
        biological_processes:
        - preferred_term: response to bacterium
          term:
            id: GO:0009617
            label: response to bacterium
          modifier: INCREASED
        locations:
        - preferred_term: vagina
          term:
            id: UBERON:0000996
            label: vagina
      selected_evidence:
        snippet: This non-optimal microbiological state involves a reduction in protective lactobacilli,
          and an increase in bacterial diversity and facultative and strict anaerobes, including Gardnerella
          spp., Atopobium vaginae, Prevotella spp., and others, referred to as BV-associated bacteria
          (BVAB)
        supports: SUPPORT
