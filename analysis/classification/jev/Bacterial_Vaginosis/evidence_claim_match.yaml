              label: bacterial vaginosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biofilm Persistence After Antimicrobial Therapy
        biological_scale: TISSUE
        role: resistance_mechanism
        description: 'The first of two competing accounts of why BV comes back. Metronidazole and clindamycin
          cure 70-85% of episodes within a month, yet more than half of women relapse within six months.
          On this account the adherent Gardnerella biofilm survives the antibiotic course and the BV-associated
          bacteria re-emerge from it - a relapse of the same community rather than a new acquisition.
          Note what this node does not claim: no assay currently distinguishes a surviving biofilm from
          a reacquired one in an individual woman, so this is an inference from the biofilm''s demonstrated
          existence and known antimicrobial tolerance, not a measured event.

          '
        biological_processes:
        - preferred_term: biofilm formation
          term:
            id: GO:0042710
            label: biofilm formation
          modifier: INCREASED
      selected_evidence:
        snippet: The low rate of sustained cure highlights our limited understanding of the pathogenesis
          of BV recurrence, which has been attributed to possible persistence and re-emergence of BV-associated
          bacteria (BVAB) or a BV-associated biofilm following antimicrobials and/or reinfection occurring
          from sexual partners.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/11
      evidence_path: /pathophysiology/11/evidence/0
      context_paths:
