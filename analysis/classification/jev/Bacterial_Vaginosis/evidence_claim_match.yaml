      assertion_type: Discussion
      assertion:
        discussion_id: bv_recurrence_route_indistinguishable
        prompt: In a woman whose BV recurs after treatment, can relapse from a surviving biofilm be distinguished
          from reinfection by an untreated partner?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Recurrent Bacterial Vaginosis
        - pathophysiology#Biofilm Persistence After Antimicrobial Therapy
        - pathophysiology#Reinfection from an Untreated Sexual Partner
        rationale: 'Two curated hypothesis groups converge on the recurrence node and there is currently
          no assay that resolves which operated. The clinical presentation is identical, point-of-care
          tests cannot separate them, and next-generation sequencing has not identified a signature that
          distinguishes relapse from reacquisition. This is why the entry retains both routes rather than
          promoting one: the StepUp trial shows the reinfection route is real at a population level, which
          is a different claim from it being the route in any given woman.

          '
        proposed_experiments:
        - experiment_id: bv_strain_resolved_recurrence_tracking
          name: Strain-resolved tracking of BV-associated bacteria across a treated episode
          description: 'Deep metagenomic strain typing of the woman''s pre-treatment community, her partner''s
            penile and urethral community, and her post-treatment recurrent community. Relapse predicts
            recovery of the woman''s own pre-treatment strains; reinfection predicts strains matching
            the partner''s and not present in her pre-treatment sample.

            '
          decision_criterion: 'Whether recurrent-episode strains are shared with the woman''s own pre-treatment
            community, with the partner''s community, or with both.

            '
      selected_evidence:
        snippet: Frustratingly for both clinicians and patients, the contribution of reinfection and vaginal
          relapse cannot be separated, as the clinical presentation of both mechanisms of recurrence is
          identical.
        supports: SUPPORT
    origin:
