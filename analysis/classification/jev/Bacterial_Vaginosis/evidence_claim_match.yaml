        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Cervicovaginal Mucus Adhesive Barrier Function
        biological_scale: TISSUE
        description: 'Cervicovaginal mucus normally traps virions and particles. In BV that trapping fails:
          fluorescently labelled HIV virions move significantly faster through mucus from women with BV
          than through mucus from L. crispatus-dominant women, whether or not the woman has symptoms.
          The mechanistically important finding is *how* it fails - electron microscopy and nanoparticle
          work localise the defect to reduced adhesive interactions, with the physical pore structure
          of the gel intact. The barrier is not torn open; it stops being sticky. The same loss of trapping
          is seen with L. iners-dominant mucus, which is why treating BV to a Nugent-normal endpoint does
          not necessarily restore the barrier.

          '
        locations:
        - preferred_term: mucus
          term:
            id: UBERON:0000912
            label: mucus
        - preferred_term: uterine cervix
          term:
            id: UBERON:0000002
            label: uterine cervix
      selected_evidence:
        snippet: we found that HIV virions had significantly increased mobility in CVM from women with
          BV compared to CVM from women with Lactobacillus crispatus-dominant microbiota, regardless of
          whether symptoms were present
        supports: SUPPORT
