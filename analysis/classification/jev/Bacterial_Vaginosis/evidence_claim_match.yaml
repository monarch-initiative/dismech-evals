      assertion_type: Treatment
      assertion:
        name: Metronidazole
        description: 'First-line therapy, oral or as 0.75% intravaginal gel. A nitroimidazole prodrug
          reductively activated inside anaerobes, so its selectivity is for the metabolic environment
          of the consortium rather than for any BV organism specifically - which is exactly the property
          a polymicrobial dysbiosis needs. It cures most episodes and prevents few recurrences, and this
          entry attaches it to the overgrowth node only, not to the biofilm node, because clearing planktonic
          anaerobes is what it is shown to do.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Antibiotic Therapy
          term:
            id: NCIT:C15620
