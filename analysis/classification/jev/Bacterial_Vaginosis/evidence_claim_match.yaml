      assertion_type: Definition
      assertion:
        name: Amsel clinical criteria
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        scope: Office diagnosis of bacterial vaginosis in symptomatic and asymptomatic reproductive-aged
          women.
        description: 'Three of four bedside findings: thin white-to-yellow homogeneous discharge, more
          than 20% clue cells on microscopy, vaginal fluid pH above 4.5, and a fishy odour on adding 10%
          potassium hydroxide. The set is worth reading mechanistically rather than as a checklist - each
          item reports a different node of this entry: the discharge and clue cells report epithelial
          adhesion, the pH reports loss of lactic acid, and the whiff test reports biogenic amine production.
          It remains the entry criterion for contemporary randomised trials.

          '
        attaches_to:
        - pathophysiology#Loss of Lactobacillus Dominance and Vaginal Acidification
        - pathophysiology#Exfoliation of Bacteria-Coated Epithelial Cells (Clue Cells)
        - pathophysiology#Biogenic Amine Production and Amplified Lactobacillus Suppression
        inclusion_criteria:
        - preferred_term: Thin, white or yellow, homogeneous vaginal discharge
        - preferred_term: More than 20% clue cells on microscopic examination
        - preferred_term: Vaginal fluid pH greater than 4.5
        - preferred_term: Fishy odour on addition of 10% potassium hydroxide (whiff test)
      selected_evidence:
        snippet: Practical diagnostic criteria for standard clinical use are proposed. Application of
          such criteria should assist in clinical management of nonspecific vaginitis and in further study
          of the microbiologic and biochemical correlates and the pathogenesis of this mild but quite
          prevalent disease.
        supports: SUPPORT
