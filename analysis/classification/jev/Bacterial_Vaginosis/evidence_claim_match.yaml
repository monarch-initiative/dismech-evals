            label: Hoylesella timonensis
      selected_evidence:
        snippet: We demonstrate that P. timonensis, but not P. bivia, strongly adheres to vaginal and
          endocervical cells to a similar level as G. vaginalis but did not elicit a comparable proinflammatory
          epithelial response.
        supports: SUPPORT
