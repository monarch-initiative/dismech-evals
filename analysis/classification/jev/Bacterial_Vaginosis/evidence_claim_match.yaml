          Gardnerella monopoly. The `term:` binds the current NCBI taxonomy name, Hoylesella timonensis;
          the literature cited here, including the 2024 papers, still writes Prevotella timonensis, which
          is retained as the preferred term.
        infectious_agent_term:
          preferred_term: Prevotella timonensis
          term:
