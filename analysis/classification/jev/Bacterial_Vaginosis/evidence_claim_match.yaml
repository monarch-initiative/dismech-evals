  946e2ca6d35206b18ad18aaa4f3531037c89297f397ef15c1c47aff00389e24d:
    claim:
      about:
        disease:
          name: Bacterial Vaginosis
          disease_term:
            preferred_term: bacterial vaginosis
            term:
              id: MONDO:0005316
              label: bacterial vaginosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Lactobacillus Dominance and Vaginal Acidification
        biological_scale: TISSUE
        role: trigger
        description: 'The initiating state change. A healthy premenopausal vagina is dominated by Lactobacillus
          species whose copious lactic acid holds the lumen below pH 4.5; in BV that community is replaced,
          lactic acid production falls and pH rises. Two points matter for everything downstream. The
          species identity is not interchangeable - L. crispatus-dominated communities are the most protective,
          whereas L. iners, which makes only the L-isomer of lactic acid, sits at an intermediate and
          unstable position and is the species most associated with transition into and relapse after
          BV. And the trigger itself is unexplained: what precipitates the shift in an individual woman
          is the central unanswered question of the field, curated as a knowledge gap below. `GO:0006885
          regulation of pH` is deliberately not bound here: the pH claim this node makes is about the
          chemistry of the vaginal lumen, not about a cellular homeostatic process, and GO annotates the
          latter. The mechanism that produces the pH change is carried by the lactate term below, and
          the luminal measurement itself is curated as an Amsel criterion under `definitions`.

          '
        biological_processes:
        - preferred_term: lactate biosynthetic process
          term:
            id: GO:0019249
            label: lactate biosynthetic process
          modifier: DECREASED
        locations:
        - preferred_term: vagina
          term:
            id: UBERON:0000996
            label: vagina
      selected_evidence:
        snippet: Under normal conditions, 70-90% of the vaginal bacterial species in healthy premenopausal
          women are Lactobacilli
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35118003
      reference_title: 'Bacterial Vaginosis: What Do We Currently Know?'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the baseline lactobacillus dominance whose loss defines this node.
