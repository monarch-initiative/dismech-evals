      assertion_type: Pathophysiology
      assertion:
        name: Epithelial Barrier Disruption and Mucosal Immune Activation
        biological_scale: TISSUE
        description: 'Despite the "-osis" in its name, BV is not immunologically silent. Vaginal IL-1alpha
          and soluble E-cadherin - a biomarker of epithelial barrier disruption - are elevated, and a
          lactobacillus-deficient community is accompanied by increased numbers of activated mucosal CD4+
          T cells. The causal reading is supported by intervention: repleting L. crispatus with a live
          biotherapeutic lowered both IL-1alpha and soluble E-cadherin, so the inflammatory state tracks
          the community rather than merely co-occurring with it. This node is what converts a microbiological
          state into an HIV-relevant one, because activated mucosal CD4+ T cells are the target cell.

          '
        cell_types:
        - preferred_term: CD4-positive T cell
          term:
            id: CL:0000492
            label: CD4-positive helper T cell
        - preferred_term: vaginal squamous epithelial cell
          term:
            id: CL:1001578
            label: vagina squamous cell
        biological_processes:
        - preferred_term: inflammatory response
          term:
            id: GO:0006954
            label: inflammatory response
          modifier: INCREASED
        - preferred_term: T cell activation
          term:
            id: GO:0042110
            label: T cell activation
          modifier: INCREASED
      selected_evidence:
        snippet: we found that individuals with diverse genital bacterial communities dominated by anaerobes
          other than Gardnerella were at over 4-fold higher risk of acquiring HIV and had increased numbers
          of activated mucosal CD4+ T cells compared to those with Lactobacillus crispatus-dominant communities
        supports: SUPPORT
