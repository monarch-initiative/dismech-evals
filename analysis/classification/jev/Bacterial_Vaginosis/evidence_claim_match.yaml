      assertion:
        discussion_id: bv_asymptomatic_majority_and_screening
        prompt: If more than half of women meeting the case definition have no symptoms, and the barrier
          defect is present in asymptomatic disease, what is the right target population for treatment?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Cervicovaginal Mucus Adhesive Barrier Function
        rationale: 'Two curated findings sit awkwardly together. Asymptomatic BV is the majority of BV,
          and the HIV-relevant mucus barrier defect is present regardless of symptoms - which argues for
          screening. But the entry''s own obstetric node records that screening-and-treatment has not
          reliably prevented preterm birth, and treatment does not durably restore an L. crispatus community.
          This is recorded as an open question rather than a knowledge gap because the missing item is
          a policy-relevant trial result, not a mechanism.

          '
      selected_evidence:
        snippet: HIV virions had significantly increased mobility in CVM from women with BV compared to
          CVM from women with Lactobacillus crispatus-dominant microbiota, regardless of whether symptoms
          were present
        supports: SUPPORT
