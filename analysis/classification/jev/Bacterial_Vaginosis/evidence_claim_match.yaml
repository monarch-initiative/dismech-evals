              label: bacterial vaginosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reinfection from an Untreated Sexual Partner
        biological_scale: ORGANISM
        description: 'The second account. BV-associated bacteria are exchanged between partners during
          sex, and on this reading a woman cured by antibiotics is reinoculated by an untreated regular
          partner. Six partner-treatment trials in the 1980s and 1990s were negative and the hypothesis
          fell out of favour; guidelines do not recommend partner treatment. The 2025 StepUp randomised
          trial reopened it decisively - it was stopped early by its data and safety monitoring board
