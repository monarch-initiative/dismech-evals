  6975c26165423c0df0a0f7972f358c3ceafdeb41b9e99fe7d26481b97b525ec6:
    claim:
      about:
        disease:
          name: Bacterial Vaginosis
          disease_term:
            preferred_term: bacterial vaginosis
            term:
              id: MONDO:0005316
              label: bacterial vaginosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bv_initiating_event_unknown
        prompt: What precipitates the shift from a lactobacillus-dominant to a lactobacillus-deficient
          vaginal community in an individual woman?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of Lactobacillus Dominance and Vaginal Acidification
        rationale: 'This entry curates a detailed chain downstream of the community shift and nothing
          upstream of it, because there is nothing to curate: the trigger node has no evidenced incoming
          edge other than two epidemiological exposures. Risk factors are known (sexual activity and intrauterine
          device use are the two cited here), but no sequence of events from a normal community to a BV
          community has been demonstrated. This matters practically, not just theoretically - every intervention
          in this entry acts after the shift has happened, and none prevents it.

          '
        proposed_experiments:
        - experiment_id: bv_incident_transition_cohort
          name: Densely sampled prospective cohort through incident BV
          description: 'Daily or near-daily self-sampling in a cohort of women with a stable L. crispatus-dominant
            community, with metagenomics, metabolomics (lactic acid isomers, biogenic amines), pH and
            behavioural diaries, powered on incident transitions rather than prevalent BV. The measurement
            that is missing is not another cross-sectional comparison of BV versus not-BV; it is the order
            of events across the transition.

            '
          decision_criterion: 'Whether a consistent temporal ordering (for example, amine rise preceding
            lactobacillus loss, or the reverse) is observed across incident transitions.

            '
      selected_evidence:
        snippet: The etiology of this dysbiosis remains unknown, but its health consequences are significant,
          including obstetrical complications, increased risk of sexually transmitted infections and urogenital
          infections.
        supports: SUPPORT
