        context: []
      assertion_type: Treatment
      assertion:
        name: LACTIN-V (Lactobacillus crispatus CTV-05 live biotherapeutic)
        description: 'A vaginally applied live biotherapeutic containing a naturally occurring human vaginal
          strain of L. crispatus, given after a course of metronidazole. It is the only intervention curated
          here that acts on the trigger node rather than on the consortium: it does not kill anaerobes,
          it repopulates the niche. Recurrence at 12 weeks fell from 45% to 30%, and a randomised immunology
          substudy showed lower vaginal IL-1alpha and soluble E-cadherin, so the effect reaches the epithelial-activation
          node as well as the community-state node.

          '
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: vaginal live biotherapeutic (Lactobacillus crispatus) administration
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        notes: '`treatment_term` is bound to the generic NCIT Pharmacotherapy action because NCIT has
          no clinical-action term for administration of a live biotherapeutic product; the more specific
          intent is carried by `preferred_term`. No CHEBI or NCIT agent term exists for L. crispatus CTV-05,
          so `therapeutic_agent` is deliberately omitted rather than bound to something broader.'
      selected_evidence:
        snippet: The use of Lactin-V after treatment with vaginal metronidazole resulted in a significantly
          lower incidence of recurrence of bacterial vaginosis than placebo at 12 weeks.
        supports: SUPPORT
