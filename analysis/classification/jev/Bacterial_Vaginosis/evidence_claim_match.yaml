  4985cc6421bfd4a2c378862ba5a197693e2580f8be9a3082be2f5f6a2c849362:
    claim:
      about:
        disease:
          name: Bacterial Vaginosis
          disease_term:
            preferred_term: bacterial vaginosis
            term:
              id: MONDO:0005316
              label: bacterial vaginosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vaginolysin-Mediated Epithelial Pore Formation and Signalling
        biological_scale: MOLECULAR
        description: 'Gardnerella secretes vaginolysin, a cholesterol-dependent cytolysin whose receptor
          is human CD59. Two consequences matter and they are different in kind. At lytic concentrations
          the toxin kills; at sublytic concentrations - which is the physiological situation - it triggers
          rapid membrane blebbing, activates epithelial p38 MAPK and induces IL-8. The receptor dependence
