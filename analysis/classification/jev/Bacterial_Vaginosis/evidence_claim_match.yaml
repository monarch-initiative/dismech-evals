          it shares metronidazole''s reductive-activation mechanism and is attached to the overgrowth
          node only. It is curated here partly because its pivotal trial used the strict five-criterion
          FDA cure definition, which is why its reported cure rates (27-37%) look far worse than the 70-85%
          quoted for first-line regimens elsewhere in this entry - the difference is the endpoint, not
          the drug, and that discrepancy is itself worth recording in a disease whose literature mixes
          Amsel, Nugent and molecular definitions.

          '
