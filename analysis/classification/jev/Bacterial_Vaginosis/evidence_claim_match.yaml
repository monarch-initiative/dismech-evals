      assertion_type: Definition
      assertion:
        name: Nugent score (Gram stain)
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        scope: Standardised laboratory diagnosis of bacterial vaginosis from a Gram-stained vaginal smear;
          the reference standard for research and the comparator for molecular assays.
        description: 'A 0-10 weighted count of three morphotypes on Gram stain - lactobacilli, small gram-variable
          or gram-negative rods (Gardnerella/Bacteroides), and curved gram-variable rods - with 7 or above
          read as BV. Its design principle is not diagnostic accuracy but reproducibility: morphotypes
          with poor intercentre agreement (gram-positive cocci) were deliberately dropped and the most
          reliable one (curved rods) weighted most heavily, raising intercentre correlation from 0.61
          to 0.82. That is why it, rather than Amsel, became the research standard, and why the intermediate
          band 4-6 exists as a graded state rather than a diagnostic failure.

          '
        attaches_to:
        - pathophysiology#Loss of Lactobacillus Dominance and Vaginal Acidification
        - pathophysiology#Polymicrobial Anaerobic Overgrowth
        notes: A contemporary review still describes the Nugent score as the gold-standard diagnostic
          tool despite its known limitations, which is why both it and the Amsel criteria are curated
          here rather than only one.
      selected_evidence:
        snippet: 'The scoring system (0 to 10) was described as a weighted combination of the following
          morphotypes: lactobacilli, Gardnerella vaginalis or bacteroides (small gram-variable rods or
          gram-negative rods), and curved gram-variable rods.'
        supports: SUPPORT
    origin:
      assertion_path: /definitions/1
      evidence_path: /definitions/1/evidence/0
