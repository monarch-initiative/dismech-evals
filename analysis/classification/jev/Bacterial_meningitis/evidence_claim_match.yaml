      assertion_type: ProgressionInfo
      assertion:
        phase: CNS Barrier Penetration
        notes: Bacteria cross the blood-brain barrier or blood-CSF barrier through transcellular or paracellular
          routes. Entry mechanisms include receptor-mediated endocytosis (PAFR, PIGR, PECAM1), paracellular
          disruption via inflammatory signaling (NF-kB, HIF-1a/VEGFA, IL-22/STAT3), or transcytosis across
          choroid plexus epithelium.
      selected_evidence:
        snippet: Microbial penetration of the blood-brain barrier, a prerequisite for the development
          of bacterial meningitis, exploits specific host and bacterial factors as well as host cell signaling
          molecules.
        supports: SUPPORT
