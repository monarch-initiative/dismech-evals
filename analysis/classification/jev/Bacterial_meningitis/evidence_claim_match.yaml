        snippet: Dexamethasone has been used in a number of clinical trials to moderate the host response
          and to improve neurologic outcome of meningitis. Results of six randomized, placebo controlled
          trials are summarized in this review. Dexamethasone treatment did not lower mortality. Only
          a moderate, but not a significant reduction in the neurologic and audiologic sequelae was seen
          in dexamethasone recipients when Haemophilus influenzae type b (Hib) was the causative agent
          of meningitis. ... Presently, there is little or no evidence showing a benefit of dexamethasone
          therapy in meningitis caused by S. pneumoniae or N. meningitidis.
        supports: SUPPORT
