      assertion:
        name: Bacterial Lipid II Synthesis (Glycopeptide Target)
        description: Empiric meningitis therapy adds vancomycin to cover beta-lactam-resistant pneumococci.
          Vancomycin binds the D-Ala-D-Ala terminus of the membrane lipid II peptidoglycan precursor,
          sequestering the substrate so cross-linking cannot proceed — a different step of the same cell-wall
          pathway than the cephalosporin target, which is why the two are combined empirically.
        role: therapeutic_vulnerability
        conforms_to: bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Precursor and Lipid II Synthesis
        biological_processes:
        - preferred_term: Peptidoglycan Biosynthetic Process
          term:
            id: GO:0009252
            label: peptidoglycan biosynthetic process
      selected_evidence:
        snippet: the antimicrobial activity of other vancosamine-modified glycopeptides depends upon both
          d-Ala-d-Ala stem-terminus recognition (primary binding site) and stem-bridge recognition (secondary
          binding site).
        supports: SUPPORT
