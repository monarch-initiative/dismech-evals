      assertion_type: Pathophysiology
      assertion:
        name: Bacterial Peptidoglycan Cross-Linking (Beta-Lactam Target)
        description: The major bacterial causes of meningitis (Streptococcus pneumoniae, Neisseria meningitidis,
          Haemophilus influenzae, group B Streptococcus, Listeria) build their peptidoglycan cell wall
          by penicillin-binding protein (PBP) transpeptidase cross-linking. This essential, bacteria-specific
          reaction is the target of the third-generation cephalosporin (ceftriaxone/cefotaxime) backbone
          of empiric therapy; CNS-penetrant beta-lactams acylate the PBP active site, halt cross-linking,
          and are bactericidal in the CSF.
        role: therapeutic_vulnerability
        conforms_to: bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding
          Proteins
        biological_processes:
        - preferred_term: Peptidoglycan-Based Cell Wall Biogenesis
          term:
            id: GO:0009273
            label: peptidoglycan-based cell wall biogenesis
