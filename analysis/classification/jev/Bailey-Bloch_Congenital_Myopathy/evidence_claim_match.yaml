        snippet: The spread of this variant worldwide and the allele frequency higher in the African/African-American
          ancestry than the Admixed Americans, strongly indicates that the STAC3 c.851 G > C variant has
          an African origin which may be due to an ancient mutation with migration and population bottlenecks.
        supports: SUPPORT
