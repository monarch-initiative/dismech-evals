  c1f5fcc7bea88256de6a80ec64ed505234e6c84c2bf8ed4ee7e0e62cfd8d7ab6:
    claim:
      about:
        disease:
          name: Bailey-Bloch Congenital Myopathy
          disease_term:
            preferred_term: Bailey-Bloch Congenital Myopathy
            term:
              id: MONDO:0009722
              label: Bailey-Bloch congenital myopathy
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Non-Specific Myopathic Muscle Biopsy
        frequency: FREQUENT
        description: 'Muscle biopsy is abnormal in most patients who undergo it, but the findings are
          non-specific: type 1 fibre predominance is the commonest single pattern, followed by generic
          myopathic features, mild atrophic fibres, and type 2 fibre predominance. There is no defining
          structural lesion of the kind that names other congenital myopathies (no cores, no rods, no
          central nuclei as a defining feature), which is precisely why biopsy cannot make this diagnosis
          and molecular testing must. Increased lipid droplets and subsarcolemmal mitochondrial accumulation
          have also been described on electron microscopy and are the human counterpart of the lipid finding
          modelled in zebrafish.'
      selected_evidence:
        snippet: Abnormal muscle biopsy histology results were reported in 11/16 patients (69%). and included
          documented type 1 muscle fibre predominance (5/11 (45%)), features of non-specific myopathy
          (3/11 (27%)), mild atrophic fibres (2/11 (18%)), and type 2 muscle fibre predominance (1/11
          (9%)).
        supports: SUPPORT
    origin:
