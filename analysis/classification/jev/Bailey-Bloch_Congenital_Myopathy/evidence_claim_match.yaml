  f8efe3364c5abcdb70342261151c30dbbfce5afc6d7d219e4d97aaef843bf898:
    claim:
      about:
        disease:
          name: Bailey-Bloch Congenital Myopathy
          disease_term:
            preferred_term: Bailey-Bloch Congenital Myopathy
            term:
              id: MONDO:0009722
              label: Bailey-Bloch congenital myopathy
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Genetics-Before-Biopsy Testing Strategy
        description: 'A sequencing decision that is specific to this disorder rather than generic good
          practice: because muscle biopsy requires anaesthesia and this disorder carries malignant hyperthermia
          risk, the biopsy is itself a hazard, and its yield is non-specific anyway. Genetic testing should
          therefore come first. The same logic applies to the diagnostic yield of targeted testing: 25
          of 127 (20%) samples referred for congenital hypotonia in one Southern African laboratory cohort
          were homozygous for the founder allele, so in that setting a single targeted test resolves a
          fifth of the referral population without any procedure.'
      selected_evidence:
        snippet: In a patient with suspected STAC3 disorder, genetic testing should be performed as the
          first line investigation, instead of a muscle biopsy which could pose a risk for MH.
        supports: SUPPORT
