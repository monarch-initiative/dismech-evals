        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: 'Exposure to halogenated volatile anaesthetics or succinylcholine can precipitate
          a hypermetabolic malignant hyperthermia crisis. This is a genuinely separate consequence of
          the triad lesion rather than a severity marker of the myopathy: it is incompletely penetrant,
          patients may have had several uneventful anaesthetics before a crisis, and in reported STAC3
          patients it occurs without pathogenic RYR1 or CACNA1S variants. The mechanistic route from STAC3
          loss to triggered uncontrolled calcium release is not established, and this entry does not assert
          one.'
