              label: Bailey-Bloch congenital myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic STAC3 Loss of Function
        biological_scale: MOLECULAR
        description: STAC3 encodes a muscle-specific adaptor protein with an N-terminal C1 (cysteine-rich)
          domain, a linker region, and two tandem SH3 domains. Nearly all reported disease alleles are
          biallelic loss-of-function changes, and the overwhelming majority of patients worldwide are
          homozygous for the recurrent missense change c.851G>C (p.Trp284Ser), which substitutes a conserved
          tryptophan in the first SH3 domain. Nonsense, frameshift and splice-site alleles have also been
          reported, and a patient has been described carrying a deletion of the SH3 domains entirely.
        genes:
        - preferred_term: STAC3
          term:
            id: hgnc:28423
            label: STAC3
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: This mutation resulted in a tryptophan (W) to serine (S) substitution at amino acid 284
          in the first SH3 domain
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
