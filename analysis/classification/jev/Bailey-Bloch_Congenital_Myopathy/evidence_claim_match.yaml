              label: Bailey-Bloch congenital myopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: stac3_cav11_interaction_paradox
        kind: OPEN_QUESTION
        prompt: If excitation-contraction coupling is clearly impaired in STAC3-patient muscle, but the
          STAC3-CaV1.1 interaction and CaV1.1 sarcolemmal localization are not measurably disrupted in
          that same tissue, what is the proximate lesion?
        attaches_to:
        - pathophysiology#Failure of STAC3-Dependent CaV1.1 Assembly at the Triad
        rationale: The intuitive model — patient variant disrupts STAC3 binding to CaV1.1, therefore coupling
          fails — is supported by biophysical work on the isolated W284S SH3 domain and by reduced DHPR
          levels in zebrafish, but the study that looked in human patient muscle found the interaction
          preserved. Compounding this, the SH3/II-III loop contact that W284S disrupts has since been
          shown to be facilitating rather than strictly required for coupling, while the essential contact
          is the one made by the N-terminal region. Curating a single clean chain here would paper over
          a genuine discrepancy between model systems and patient tissue.
        proposed_experiments:
        - experiment_id: stac3_patient_myotube_charge_movement
          name: Quantify CaV1.1 charge movement and STAC3 occupancy in patient-derived myotubes
          description: Measure gating charge, calcium release and STAC3-CaV1.1 stoichiometry side by side
            in myotubes carrying p.Trp284Ser, to determine whether the deficit lies in channel voltage
            sensing, in coupling efficiency, or in a step downstream of a normally assembled complex.
      selected_evidence:
        snippet: Co-immunoprecipitation of STAC3 with CaV 1.1 in patients and control muscle samples showed
          that the protein interaction between STAC3 and CaV 1.1 was not significantly affected by the
          STAC3 variants.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
