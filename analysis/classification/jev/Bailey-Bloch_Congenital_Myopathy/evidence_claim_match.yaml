      assertion_type: Pathophysiology
      assertion:
        name: Reduced Fetal Movement and Congenital Joint Contracture
        biological_scale: ORGANISM
        description: The fetal-akinesia arm. Weak intrauterine movement leaves joints fixed in position,
          producing the contracture spectrum seen at birth — isolated talipes equinovarus at the mild
          end through arthrogryposis multiplex congenita at the severe end. Decreased fetal movement is
          directly documented in the majority of STAC3 patients in a cohort that recorded it, which is
          what makes this a separate mechanistic step rather than a restatement of weakness.
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: Notably, cleft palate (40%), talipes equinovarus (50%), and cryptorchidism (16%) were
          frequently observed, with a higher incidence than in some other cohorts, reinforcing the unique
          phenotypic characteristics of KDS-like presentations in African patients.
        supports: SUPPORT
