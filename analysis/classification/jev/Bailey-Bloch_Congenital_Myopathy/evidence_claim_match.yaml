              label: Bailey-Bloch congenital myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Skeletal Muscle Excitation-Contraction Coupling
        biological_scale: CELLULAR
        description: The functional core of the disease. Depolarization of the T-tubule membrane no longer
          efficiently triggers release of calcium from the sarcoplasmic reticulum, so the myofibre generates
          less force for a given electrical stimulus. The contractile machinery itself and gross triad
          architecture are comparatively preserved, which is why this is a coupling failure rather than
          a structural myopathy in the usual sense. In patient muscle, KCl-induced depolarization produced
          significantly reduced sarcoplasmic-reticulum calcium release.
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
          term:
            id: GO:0014808
            label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
          modifier: DECREASED
        - preferred_term: skeletal muscle contraction
          term:
            id: GO:0003009
            label: skeletal muscle contraction
          modifier: DECREASED
      selected_evidence:
        snippet: In particular, KCl-induced membrane depolarization resulted in significantly reduced
          sarcoplasmic reticulum Ca2+ release.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
