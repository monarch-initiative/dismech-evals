        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: stac3_mh_trigger_mechanism
        kind: KNOWLEDGE_GAP
        prompt: By what mechanism does loss of STAC3 confer susceptibility to anaesthetic-triggered malignant
          hyperthermia, given that affected patients do not carry pathogenic RYR1 or CACNA1S variants?
        attaches_to:
        - pathophysiology#Anesthetic-Triggered Malignant Hyperthermia Susceptibility
        rationale: 'Malignant hyperthermia susceptibility is one of the clinically decisive features of
          this disorder, yet the causal chain from an adaptor-protein loss to triggered uncontrolled calcium
          release is not worked out. It is not simply a more severe version of the coupling defect: the
          coupling defect reduces calcium release, while the crisis is an excess of it. The zebrafish
          knock-in does show increased caffeine-induced release and elevated store calcium, which is suggestive,
          but that has not been connected to volatile-anaesthetic triggering in patients.'
        proposed_experiments:
        - experiment_id: stac3_halothane_contracture_myotubes
          name: Halothane and caffeine response in STAC3-null and W284S myotubes
          description: Compare halothane- and caffeine-evoked contracture and calcium release in myotubes
            reconstituted with wild-type STAC3, W284S STAC3, and no STAC3, on an otherwise wild-type RYR1
            background, to test whether STAC3 loss is sufficient to produce a trigger-sensitive phenotype.
      selected_evidence:
        snippet: Furthermore, stac3NAM myofibers exhibited increased caffeine-induced Ca2+ release across
          a wide range of concentrations in the absence of altered caffeine sensitivity as well as increased
          Ca2+ in internal stores, which is consistent with increased SR luminal Ca2+
        supports: SUPPORT
