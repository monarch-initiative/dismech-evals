      assertion_type: Diagnosis
      assertion:
        name: Molecular Genetic Testing of STAC3
        description: Diagnosis rests on biallelic pathogenic STAC3 variants in a proband with a compatible
          phenotype. Targeted testing for c.851G>C is a reasonable first step in populations where the
          allele is common; otherwise a congenital myopathy panel or exome sequencing is used. The key
          practice point is that ancestry must not gate the test.
      selected_evidence:
        snippet: The diagnosis of STAC3 disorder is established in a proband with suggestive clinical
          findings and biallelic pathogenic variants in STAC3 identified by molecular genetic testing.
        supports: SUPPORT
