  de4ad64da8737e81809a80559ee2e28e5c47ed42ff2867ada4209d8c3382a139:
    claim:
      about:
        disease:
          name: Bailey-Bloch Congenital Myopathy
          disease_term:
            preferred_term: Bailey-Bloch Congenital Myopathy
            term:
              id: MONDO:0009722
              label: Bailey-Bloch congenital myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of STAC3-Dependent CaV1.1 Assembly at the Triad
        biological_scale: MOLECULAR
        description: 'STAC3 is required for the functional expression of CaV1.1 (the dihydropyridine receptor,
          the skeletal-muscle L-type calcium channel that acts as the T-tubule voltage sensor) and for
          its conformational coupling to RyR1. Two distinct STAC3-CaV1.1 contacts have been resolved:
          the C1/linker region binds the proximal C-terminus of CaV1.1 and is necessary and sufficient
          for functional channel expression, while the SH3-1 domain binds the CaV1.1 II-III loop and,
          contrary to the long-standing assumption, is not strictly required for coupling but enhances
          calcium release. In zebrafish stac3 mutants, DHPR levels, functionality and stability are all
          reduced.'
        genes:
        - preferred_term: CACNA1S
          term:
            id: hgnc:1397
            label: CACNA1S
        - preferred_term: RYR1
          term:
            id: hgnc:10483
            label: RYR1
        molecular_functions:
        - preferred_term: voltage-gated calcium channel activity
          term:
            id: GO:0005245
            label: voltage-gated calcium channel activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: sarcoplasmic reticulum
          term:
            id: GO:0016529
            label: sarcoplasmic reticulum
      selected_evidence:
        snippet: we demonstrated that the interaction between STAC3 and the proximal C-terminus is necessary
          and sufficient for CaV1.1 functional expression and minimal EC coupling
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40779452
      reference_title: STAC3 binding to CaV1.1 II-III loop is nonessential but critically supports skeletal
        muscle excitation-contraction coupling.
      evidence_source: IN_VITRO
      explanation: Assigns the essential channel-expression role to the N-terminal contact rather than
        to the SH3/II-III loop contact.
