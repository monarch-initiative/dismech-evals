        context: []
      assertion_type: Phenotype
      assertion:
        category: Anesthetic
        name: Malignant Hyperthermia Susceptibility
        frequency: OCCASIONAL
        diagnostic: true
        description: 'Susceptibility to a hypermetabolic malignant hyperthermia crisis triggered by halogenated
          volatile anaesthetics or succinylcholine. The frequency band here is set by the figures that
          are directly quotable from cited cohorts — a suggestive history in 22% of the Southern African
          clinical cohort, and an observed crisis in 18% of a South African King-Denborough cohort — and
          should be read as a floor rather than an estimate of true susceptibility. Reported rates across
          series span roughly 13% to 56%, and the reason for that spread is structural, not statistical:
          the trait only declares itself on exposure to a triggering agent, so a cohort''s rate partly
          measures how many of its patients happened to have surgery without precautions. Penetrance is
          incomplete even among the exposed.'
        phenotype_term:
          preferred_term: Malignant hyperthermia
          term:
            id: HP:0002047
            label: Malignant hyperthermia
      selected_evidence:
        snippet: Reliable data on MH are challenging to collect since this is only expected to develop
          upon administration of volatile anaesthetic gasses (isoflurane) or succinylcholine
        supports: SUPPORT
