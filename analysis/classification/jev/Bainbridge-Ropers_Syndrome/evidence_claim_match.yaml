                syndrome
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Later childhood and adulthood - gradual functional gains on a static substrate
        age_range: Later childhood through adulthood
        notes: The underlying developmental lesion is static, not degenerative. Deep phenotyping shows
          measurable improvement over time in feeding, tone, verbalisation and motor skills, and many
          children wean off tube feeding, though near-universal intellectual disability and communication
          impairment persist and most individuals require lifelong support. Poor postnatal growth may
          give way to obesity later in childhood.
      selected_evidence:
        snippet: We report significant phenotypic variability, but improvement trends in feeding, hypotonia,
          verbalisation, and motor skills over time.
        supports: SUPPORT
