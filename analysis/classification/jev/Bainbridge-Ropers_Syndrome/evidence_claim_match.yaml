              label: severe feeding difficulties-failure to thrive-microcephaly due to ASXL3 deficiency
                syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Bohring-Opitz syndrome
        description: THE critical differential and the origin of this entry's named-entity confusion risk.
          Bohring-Opitz syndrome is caused by de novo truncating variants in ASXL1, the closest paralog
          of ASXL3, and Bainbridge-Ropers syndrome was originally described in 2013 as a phenotype "with
          similarities to Bohring-Opitz syndrome". The two are now established as clinically and molecularly
          distinct entities and are curated separately in dismech. Any paper describing ASXL1 patients
          must not be used as evidence for ASXL3-related phenotypes.
        disease_term:
          preferred_term: Bohring-Opitz syndrome
          term:
            id: MONDO:0011510
            label: Bohring-Opitz syndrome
        distinguishing_features:
        - BOS is caused by ASXL1 (hgnc:18318); BRPS is caused by ASXL3 (hgnc:29357).
        - The BOS-defining features - characteristic arm posture, intrauterine growth retardation, microcephaly,
          trigonocephaly, facial nevus flammeus, exophthalmos - are largely absent in ASXL3 patients.
        - BOS has a validated blood DNA methylation episignature and epigenetic age acceleration; ASXL3
          patients are control-like on both measures.
        - BRPS is dominated by profound speech impairment and severe muscular hypotonia with a long face
          and poor facial expressivity.
      selected_evidence:
        snippet: The majority of key features characteristic for Bohring-Opitz syndrome were absent in
          our patients (eg, the typical posture of arms, intrauterine growth retardation, microcephaly,
          trigonocephaly, typical facial gestalt with nevus flammeus of the forehead and exophthalmos).
          Therefore we emphasize that BRPS syndrome, caused by ASXL3 loss-of-function variants, is a clinically
          distinct intellectual disability syndrome with a recognizable phenotype distinguishable from
          that of Bohring-Opitz syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
