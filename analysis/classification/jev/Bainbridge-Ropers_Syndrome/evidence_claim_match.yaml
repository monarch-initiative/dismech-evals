      assertion:
        name: ASXL3 molecular genetic testing
        description: The diagnosis is molecular. There are no consensus clinical diagnostic criteria,
          no biochemical marker, and no validated methylation episignature, so identification of a heterozygous
          pathogenic ASXL3 variant is required. In practice trio exome or genome sequencing is the workhorse;
          an intellectual disability multigene panel is an alternative, and chromosomal microarray remains
          standard first-line for undiagnosed developmental delay although it rarely identifies ASXL3
          variants.
        presence: Identification of a heterozygous pathogenic or likely pathogenic ASXL3 variant in a
          proband with suggestive clinical features establishes the diagnosis.
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Trio-based exome sequencing was performed on all 12 patients included in this study,
          which found a de novo truncating mutation in ASXL3.
        supports: SUPPORT
