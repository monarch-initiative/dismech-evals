        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: brps_penetrance_expressivity
        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#ASXL3
        status: OPEN
        prompt: Is ASXL3-related disorder fully penetrant, and if not, is the apparent nonpenetrance in
          inherited-variant families genuine reduced penetrance or misclassification of variant pathogenicity?
        rationale: Almost the entire published cohort consists of de novo protein-truncating variants
          ascertained through severely affected probands, so penetrance has never been estimated against
          an unbiased denominator and a reader would reasonably but wrongly infer complete penetrance.
          The inherited-variant series reports substantial intrafamilial and possible interfamilial variability,
          with transmitting parents who are mildly affected or apparently unaffected. Critically, the
          authors decline to attribute this to reduced penetrance, offering instead the competing explanation
          that the inherited variants may not be pathogenic - an ambiguity that cannot be resolved without
          a functional assay, which is precisely what the absent episignature denies. Systematic review
          lists penetrance among the explicit unresolved gaps. This matters directly for counselling families
          in whom an ASXL3 variant is inherited rather than de novo.
        proposed_experiments:
        - experiment_id: brps_exp_biobank_penetrance
          name: Unselected-cohort penetrance estimation for ASXL3 truncating variants
          description: Ascertain ASXL3 protein-truncating variants in large unselected population biobanks
            with linked phenotype data, rather than through clinically referred probands, and measure
            the proportion of carriers meeting neurodevelopmental diagnostic criteria.
          decision_criterion: A carrier frequency substantially exceeding the expected disease prevalence,
            with a meaningful fraction of carriers lacking a neurodevelopmental diagnosis, would establish
            reduced penetrance for at least some variant classes.
        - experiment_id: brps_exp_family_deep_phenotyping
          name: Deep phenotyping and mosaicism testing of transmitting parents
          description: Systematically deep-phenotype apparently unaffected transmitting parents in inherited
            ASXL3 families and apply ultra-deep sequencing of multiple tissues to distinguish true germline
            heterozygosity with reduced penetrance from low-level parental mosaicism.
          decision_criterion: Demonstration of constitutional heterozygosity in a rigorously phenotyped
            unaffected parent would establish genuine nonpenetrance; detection of mosaicism would instead
            explain the mild parental phenotype without invoking reduced penetrance.
      selected_evidence:
        snippet: substantial intrafamilial phenotypic variability, as well as the possibility of interfamilial
          phenotypic variability
        supports: SUPPORT
