        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other Mendelian chromatinopathies with syndromic intellectual disability
        description: Because the developmental delay and dysmorphism of BRPS are nonspecific, the practical
          differential is broad and includes the other Mendelian disorders of the epigenetic machinery
          presenting with intellectual disability, limited speech, and behavioural difficulty. Discrimination
          is molecular rather than clinical.
        disease_term:
          preferred_term: syndromic intellectual disability
          term:
            id: MONDO:0000508
            label: syndromic intellectual disability
        distinguishing_features:
        - Each chromatinopathy is separated by its causal gene; only ASXL3 variants establish BRPS.
        - Several other chromatinopathies have validated blood DNA methylation episignatures that can
          classify variants, whereas ASXL3 currently does not.
      selected_evidence:
        snippet: Our previous work has shown that syndromic conditions caused by pathogenic variants in
          epigenetic regulatory genes show consistent patterns of genome-wide DNA methylation (DNAm) alterations,
          i.e., DNAm signatures in peripheral blood.
        supports: SUPPORT
