            label: fibroblast
        genetic_context:
          gene:
            preferred_term: ASXL3
            term:
              id: hgnc:29357
              label: ASXL3
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: UNKNOWN
