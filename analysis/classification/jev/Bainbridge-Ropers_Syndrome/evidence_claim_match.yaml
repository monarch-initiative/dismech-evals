            term:
              id: MONDO:0014205
              label: severe feeding difficulties-failure to thrive-microcephaly due to ASXL3 deficiency
                syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: asxl3_nmd_escaping_truncated_protein
        hypothesis_label: NMD-escaping truncated ASXL3 protein with dominant or neomorphic activity
        status: ALTERNATIVE
        description: 'Truncating alleles that escape nonsense-mediated decay yield a stable C-terminally
          truncated ASXL3, and cohorts stratified by predicted decay differ in phenotype, which a pure
          dosage model does not predict. The original ASXL3 report already raised a dominant-negative
          reading of the truncated product. Whether the truncated protein is inert, dominant-negative,
          or gain of function has not been tested directly in patient material. The phenotype difference
          does not run uniformly in this hypothesis''s favour: autistic features are enriched in the decay-escaping
          class, but the core severity measures are worse in the decay-subject null class, which is the
          opposite of what a straightforwardly more toxic truncated protein would predict. The mechanism
          is best read as a candidate modifier rather than as a symmetric competitor to the dosage model.'
      selected_evidence:
        snippet: Although autistic features were observed across all groups, the no-NMD and MCR2 cohorts
          had a higher proportion of individuals with formal autism diagnoses.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
