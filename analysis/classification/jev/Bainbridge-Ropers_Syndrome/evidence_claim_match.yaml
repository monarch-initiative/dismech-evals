        biological_scale: MOLECULAR
        description: A heterozygous nonsense, frameshift, or canonical splice-site variant, almost always
          falling in the two large coding exons 11 and 12, is the initiating lesion. For variants predicted
          to trigger nonsense-mediated decay the mutant transcript is degraded and total ASXL3 message
          and protein fall, producing true haploinsufficiency. A second class of truncating variants escapes
          decay and yields a truncated protein, and the two classes are associated with measurably different
