      assertion:
        name: Autosomal dominant, typically de novo
        description: BRPS is inherited in an autosomal dominant manner and is typically caused by a de
          novo heterozygous protein-truncating ASXL3 variant. Transmission from a mildly affected or mosaic
          parent is documented but uncommon, and sibling recurrence attributable to parental gonadal or
          gonosomal mosaicism has been reported, so recurrence risk after an apparently de novo event
          is low but not negligible.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: ASXL3-related disorder is an autosomal dominant disorder typically caused by a de novo
          pathogenic variant.
