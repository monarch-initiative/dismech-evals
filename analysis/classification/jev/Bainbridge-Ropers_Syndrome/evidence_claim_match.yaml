        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: asxl3_nmd_haploinsufficiency
        hypothesis_label: NMD-driven ASXL3 haploinsufficiency
        status: CANONICAL
        description: Truncating ASXL3 alleles that trigger nonsense-mediated decay reduce ASXL3 message
          and protein, and the syndrome is described as caused by loss-of-function variants. This is the
