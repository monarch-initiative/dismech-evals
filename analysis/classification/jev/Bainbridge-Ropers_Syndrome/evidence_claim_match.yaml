  f325a08c2587dcbdb0b80745f396114fea3ca0ccf4bafbbe09d20328f3b5627f:
    claim:
      about:
        disease:
          name: Bainbridge-Ropers syndrome
          disease_term:
            preferred_term: Bainbridge-Ropers syndrome
            term:
              id: MONDO:0014205
              label: severe feeding difficulties-failure to thrive-microcephaly due to ASXL3 deficiency
                syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absence of an ASXL3 DNA Methylation Episignature
        biological_scale: MOLECULAR
        description: A negative but mechanistically informative finding. Blood DNA methylation signatures
          are established for many chromatinopathies, and ASXL1-related Bohring-Opitz syndrome has a robust
          one. When that classifier was applied to ASXL3 patients their methylation profiles were control-like,
          and unlike ASXL1 and ASXL2 patients they showed no epigenetic age acceleration. This means (a)
          there is currently no validated episignature available to help classify ASXL3 variants of uncertain
          significance, and (b) ASXL3 dysfunction diverges mechanistically from ASXL1 despite paralogy
          - which is a molecular argument for keeping BRPS and BOS as separate entities.
        mechanism_confidence: PROVISIONAL
        role: BIOMARKER
        notes: Based on only three ASXL3 individuals; an adequately powered BRPS-specific episignature
          study has not been done. Do not read the negative result as proof that no ASXL3 signature exists.
      selected_evidence:
        snippet: which showed acceleration in DNAm age in individuals with pathogenic ASXL1 variants,
          and the individual with the pathogenic ASXL2 variant, but not in individuals with ASXL3 variants.
        supports: SUPPORT
    origin:
