        context: []
      assertion_type: Genetic
      assertion:
        name: ASXL3
        gene_term:
          preferred_term: ASXL3
          term:
            id: hgnc:29357
            label: ASXL3
        association: Heterozygous protein-truncating (nonsense, frameshift, canonical splice-site) variants,
          clustered in the two large coding exons 11 and 12
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: 'ASXL3 (18q12.1) is the sole established cause of Bainbridge-Ropers syndrome and is severely
          constrained against loss of function. Two mutational cluster regions are recognized, MCR1 in
          exon 11 and MCR2 in exon 12, and they are associated with different phenotypic profiles. Missense
          variants are not established as a cause of the autosomal dominant disorder. PENETRANCE AND EXPRESSIVITY:
          penetrance is not established. The de novo truncating variants that define the classical phenotype
          are treated as fully penetrant in practice, but the inherited-variant series documents substantial
          intrafamilial and possible interfamilial variability and describes mildly affected or apparently
          unaffected transmitting parents. The authors themselves decline to separate genuinely reduced
          penetrance from uncertainty about the pathogenicity of those inherited variants, so no penetrance
          figure is asserted here; see the brps_penetrance_expressivity discussion. Systematic review
          lists penetrance data as an explicit knowledge gap. GENE-IDENTITY GUARD: this entry''s causal
          gene is ASXL3 (hgnc:29357), NOT the paralogs ASXL1 (Bohring-Opitz syndrome) or ASXL2 (Shashi-Pena
          syndrome); every citation below was checked to name ASXL3.'
      selected_evidence:
        snippet: Using genome-wide sequencing, we identified heterozygous, de novo truncating mutations
          in ASXL3, a transcriptional repressor related to ASXL1, in four unrelated probands.
        supports: SUPPORT
