          with reduced expression of hindbrain, primary neuron, and neural crest markers, while spinal-cord
          identity is relatively spared. This positions ASXL3 as a chromatin regulator required during
          the earliest steps of nervous system induction and anteroposterior patterning, which is when
          the human phenotype is determined.
        mechanism_confidence: PROVISIONAL
