  690bd29e518bcc1fa04c76ce2359185cadbae00790df3500da13f212d82d2584:
    claim:
      about:
        disease:
          name: Bainbridge-Ropers syndrome
          disease_term:
            preferred_term: Bainbridge-Ropers syndrome
            term:
              id: MONDO:0014205
              label: severe feeding difficulties-failure to thrive-microcephaly due to ASXL3 deficiency
                syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: brps_missense_contribution
        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#ASXL3
        status: OPEN
        prompt: Do ASXL3 missense variants contribute to disease, and if so to which phenotype - autism
          spectrum disorder without syndromic features, a recessive congenital heart phenotype, or nothing
          at all?
        rationale: Every established BRPS variant is protein-truncating. Missense ASXL3 variants have
          been reported in autism cohorts without the severe syndromic features, and biallelic missense
          variants have been reported in a small number of individuals with congenital heart defects,
          but neither association is established. Systematic reviews list the disease contribution of
          missense variants as an explicit unresolved gap. Without an episignature or another functional
          assay there is currently no way to resolve individual missense variants of uncertain significance.
        proposed_experiments:
        - experiment_id: brps_exp_deubad_deep_mutational_scan
          name: Deep mutational scanning of the ASXL3 DEUBAD domain
          description: Perform saturation mutagenesis of the ASXL3 DEUBAD (BAP1-binding) domain and measure
            BAP1 binding and PR-DUB H2A deubiquitinase activity for each substitution, generating a functional
            score for every possible missense change in the domain.
          decision_criterion: A bimodal functional score distribution separating known pathogenic truncating-equivalent
            losses from tolerated substitutions would provide a calibrated assay for missense variant
            interpretation.
        - experiment_id: brps_exp_missense_burden
          name: Rare ASXL3 missense burden analysis in neurodevelopmental cohorts
          description: Conduct a case-control burden analysis of rare ASXL3 missense variants in large
            autism and neurodevelopmental-disorder cohorts against population reference data.
          decision_criterion: Significant excess of rare missense variants in cases after correction would
            support a genuine, phenotypically milder missense contribution distinct from the truncating
            BRPS phenotype.
        - experiment_id: brps_exp_biallelic_missense_chd
          name: Segregation and functional follow-up of biallelic missense congenital heart defect families
          description: Re-examine segregation and perform functional assays in the reported families with
            biallelic ASXL3 missense variants and congenital heart defects, to determine whether this
            represents a genuinely distinct recessive allelic disorder or an incidental finding.
          decision_criterion: Consistent biallelic segregation with a shared functional deficit across
            independent families would support a distinct recessive ASXL3-related cardiac phenotype.
      selected_evidence:
        snippet: Several gaps in our knowledge of this disorder were identified, namely, underlying pathophysiology
          and disease mechanism, disease contribution of missense variants, relevance of variant location,
          prevalence and penetrance data.
        supports: SUPPORT
