  f53d5f6f3d2c277660f90ac063839e28e94aadf85bfea2c41f29f8bd625a4d25:
    claim:
      about:
        disease:
          name: Bainbridge-Ropers syndrome
          disease_term:
            preferred_term: Bainbridge-Ropers syndrome
            term:
              id: MONDO:0014205
              label: severe feeding difficulties-failure to thrive-microcephaly due to ASXL3 deficiency
                syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Shashi-Pena syndrome
        description: The third member of the ASXL disorder triad, caused by de novo truncating variants
          in ASXL2. It shares developmental delay, feeding difficulty, hypotonia and arched eyebrows with
          BRPS but is separated by macrocephaly and absence of growth retardation. Because all three ASXL
          disorders are routinely discussed together, papers on ASXL2 must not be cited as evidence for
          ASXL3 phenotypes.
        disease_term:
          preferred_term: Shashi-Pena syndrome
          term:
            id: MONDO:0014963
            label: Shashi-Pena syndrome
        distinguishing_features:
        - Shashi-Pena syndrome is caused by ASXL2; BRPS by ASXL3.
        - Macrocephaly and absence of growth retardation distinguish the ASXL2 condition from ASXL1- and
          ASXL3-related disorders.
        - ASXL2 truncating transcripts escape nonsense-mediated decay and are thought to act dominant-negatively,
          whereas ASXL3 NMD-class variants act by haploinsufficiency.
        - Glabellar nevus flammeus and prominent eyes are characteristic of Shashi-Pena syndrome and are
          not features of BRPS.
      selected_evidence:
        snippet: Although overlapping features with Bohring-Opitz and Bainbridge-Ropers syndromes exist,
          features that distinguish the ASXL2-associated condition from ASXL1- and ASXL3-related disorders
          are macrocephaly, absence of growth retardation, and more variability in the degree of intellectual
          disabilities.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
