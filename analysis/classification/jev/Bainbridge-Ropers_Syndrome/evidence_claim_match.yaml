  0464201731e63678b5d4f21b15e4128eda6cb93d45b2da8ab85c477b2bff023f:
    claim:
      about:
        disease:
          name: Bainbridge-Ropers syndrome
          disease_term:
            preferred_term: Bainbridge-Ropers syndrome
            term:
              id: MONDO:0014205
              label: severe feeding difficulties-failure to thrive-microcephaly due to ASXL3 deficiency
                syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: brps_human_model_mismatch_neural_fate
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Disrupted Neural Cell Fate Specification
        status: OPEN
        prompt: Does the severe early neural cell-fate specification defect seen on ASXL3 knockdown in
          Xenopus laevis embryos actually occur in human ASXL3 haploinsufficiency, given that most affected
          individuals have structurally normal brain MRI?
        rationale: 'The strongest mechanistic link between the ASXL3 chromatin lesion and the neurodevelopmental
          phenotype comes from a morpholino knockdown in a frog embryo, which produces open neural plates
          and loss of hindbrain, primary neuron and neural crest markers - a far more dramatic patterning
          failure than anything seen in human patients, in whom GeneReviews notes that most individuals
          with seizures still have normal brain MRI. Two features of the model may explain the gap and
          limit translation: morpholino knockdown approaches a near-null state whereas human disease is
          heterozygous haploinsufficiency, and the human transcriptomic evidence comes from dermal fibroblasts
          rather than neural tissue. The translational validity of the cell-fate mechanism, not its existence
          in the model, is the open question.'
        proposed_experiments:
        - experiment_id: brps_exp_ipsc_cortical_patterning
          name: Cortical differentiation of ASXL3 heterozygous iPSC and organoid models
          description: Differentiate ASXL3 patient-derived and isogenic heterozygous-null iPSC lines into
            cortical neurons and cerebral organoids, then assay regional patterning, cortical layer identity,
            and genome-wide H2AK119Ub1 distribution. This tests whether a human heterozygous gene dose
            is sufficient to produce a measurable neural cell-fate defect, which the near-null frog knockdown
            cannot address.
          decision_criterion: A reproducible shift in layer-marker proportions or regional identity in
            heterozygous versus isogenic control lines, accompanied by redistributed H2AK119Ub1 at developmental
            loci, would support translation of the frog cell-fate mechanism to human heterozygous dosage.
        - experiment_id: brps_exp_quantitative_mri
          name: Quantitative volumetric and cortical-thickness MRI in an ASXL3 cohort
          description: Perform quantitative volumetric and cortical-thickness MRI in a phenotyped ASXL3
            cohort against matched controls, to test whether subtle structural differences exist below
            the threshold at which routine clinical radiology reports an abnormality.
          decision_criterion: Statistically significant reduction in cortical thickness or upper-layer-associated
            volume relative to matched controls would reconcile the model finding with the clinical observation
            of "normal" MRI.
        - experiment_id: brps_exp_heterozygous_vertebrate_model
          name: Dose-controlled heterozygous vertebrate model of Asxl3 loss
          description: Generate and phenotype a heterozygous (rather than morpholino knockdown-null) vertebrate
            model to test whether the early neural patterning defect is dose-dependent and whether it
            attenuates at a gene dosage comparable to human disease.
          decision_criterion: Persistence of a measurable patterning phenotype at heterozygous dosage
            would support translational relevance; complete rescue at heterozygous dosage would indicate
            the knockdown phenotype is a null-specific artefact.
      selected_evidence:
        snippet: In this study, we utilize the frog, Xenopus laevis as a simpler and more accessible vertebrate
          neurodevelopmental model system to understand the embryological cause of Bainbridge-Ropers syndrome.
        supports: SUPPORT
