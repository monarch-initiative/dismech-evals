  8ed64d6725b58265679a703b57d8e9ab2916e0cd95e6923a41c5396b28ea5503:
    claim:
      about:
        disease:
          name: Bainbridge-Ropers syndrome
          disease_term:
            preferred_term: Bainbridge-Ropers syndrome
            term:
              id: MONDO:0014205
              label: severe feeding difficulties-failure to thrive-microcephaly due to ASXL3 deficiency
                syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: brps_missing_episignature
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Absence of an ASXL3 DNA Methylation Episignature
        status: OPEN
        prompt: Is there a genuine ASXL3-specific DNA methylation episignature that a dedicated, adequately
          powered study would detect, or does ASXL3 haploinsufficiency truly leave no peripheral blood
          methylation footprint?
        rationale: The only relevant data come from applying an ASXL1/Bohring-Opitz classifier to three
          ASXL3 individuals, whose profiles were control-like. That is a negative result from a classifier
          built for a different gene on a very small sample, not evidence of absence. The question matters
          clinically because without an episignature there is no functional assay to reclassify ASXL3
          variants of uncertain significance, which is precisely where the missense-variant question is
          unresolved.
        proposed_experiments:
        - experiment_id: brps_exp_dedicated_episignature
          name: Adequately powered ASXL3-specific blood DNA methylation study
          description: Profile genome-wide blood DNA methylation in a cohort of 25 or more individuals
            with confirmed pathogenic ASXL3 variants against sex- and age-matched controls, powered to
            derive a signature de novo rather than by cross-classification with an ASXL1-derived model.
          decision_criterion: Identification of a reproducible set of differentially methylated positions
            that classifies held-out ASXL3 cases would establish an ASXL3 episignature; failure at this
            sample size would substantially strengthen the negative result.
        - experiment_id: brps_exp_episignature_by_variant_class
          name: Episignature stratification by NMD class and mutational cluster region
          description: Stratify any candidate methylation signature by nonsense-mediated-decay versus
            no-NMD variant class and by MCR1 (exon 11) versus MCR2 (exon 12) location, to test whether
            the two proposed mechanistic classes leave different epigenomic footprints.
          decision_criterion: Divergent methylation profiles between the NMD and no-NMD groups would provide
            molecular support for two distinct disease mechanisms rather than a single haploinsufficiency
            mechanism.
        - experiment_id: brps_exp_episignature_vus_classification
          name: Clinical validation of an ASXL3 episignature for variant classification
          description: Test any derived signature against ASXL3 missense variants and variants of uncertain
            significance to establish whether it has clinical utility for reclassification.
          decision_criterion: Concordant classification of known pathogenic and known benign control variants
            would qualify the assay for clinical variant interpretation.
      selected_evidence:
        snippet: the DNAm profiles of three individuals with ASXL3 variants were control-like
        supports: SUPPORT
