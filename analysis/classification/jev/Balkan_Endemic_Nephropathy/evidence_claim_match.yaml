      assertion_type: Pathophysiology
      assertion:
        name: Proximal Tubular Epithelial Cell Death
        description: Loss of proximal tubular epithelium, the step the conforming module shares.
        role: central_effector
        biological_scale: TISSUE
        conforms_to: drug_induced_nephrotoxicity#Proximal Tubular Epithelial Cell Death
        cell_types:
        - preferred_term: kidney proximal tubule epithelial cell
          term:
            id: CL:0002306
            label: epithelial cell of proximal tubule
        notes: 'PARTIAL CONFORMANCE, deliberately. The drug_induced_nephrotoxicity module models a dose-dependent
          ACUTE tubular necrosis arc ending in acute kidney injury. This disease shares the proximal tubular
          target and the cell-death step but not the time course: exposure is chronic and low-level over
          years, and the outcome is progressive fibrosis and end-stage renal disease rather than acute
          injury with a recovery phase. The entry therefore conforms at the uptake and cell-death nodes
          and deliberately does NOT declare conformance to the module''s Acute Kidney Injury effector,
          because that would assert a time course this disease does not have.'
      selected_evidence:
        snippet: Balkan endemic nephropathy is a chronic tubulointerstitial disease with insidious onset,
          slowly progressing to end-stage renal disease and frequently associated with urothelial carcinoma
          of the upper urinary tract (UTUC).
        supports: SUPPORT
    origin:
