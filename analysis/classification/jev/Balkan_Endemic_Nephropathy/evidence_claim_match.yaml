            term:
              id: MONDO:0007416
              label: Balkan nephropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: A:T to T:A Transversion Mutational Signature
        description: Aristolactam adducts mispair during replication to produce a highly characteristic
          A:T to T:A transversion signature, concentrated in TP53. The signature is specific enough to
          serve as a molecular fingerprint of prior aristolochic acid exposure, which is how the same
          exposure was later recognised in tumours worldwide. Split from the carcinoma it drives, since
          one is a molecular lesion and the other a tissue-level outcome.
        role: mechanism
        biological_scale: MOLECULAR
        gene:
          preferred_term: TP53
          term:
            id: hgnc:11998
            label: TP53
        locations:
        - preferred_term: ureter
          term:
            id: UBERON:0000056
            label: ureter
      selected_evidence:
        snippet: These adducts are not only biomarkers of prior exposure to AA, but they also trigger
          urothelial malignancy by inducing specific mutations (A:T to T:A transversion) in critical genes
          of carcinogenesis, including the tumor-suppressor TP53.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31054628
      reference_title: Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid.
      evidence_source: OTHER
      explanation: Links the adducts to the transversion signature and to TP53 specifically, which is
        the basis for modelling carcinogenesis as its own arm rather than a complication of the fibrosis.
