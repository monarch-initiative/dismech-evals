  45c971b2d2607d508b29eadb372be1555a9702295936c29f35c8b6500ae176cb:
    claim:
      about:
        disease:
          name: Balkan Endemic Nephropathy
          disease_term:
            preferred_term: Balkan endemic nephropathy
            term:
              id: MONDO:0007416
              label: Balkan nephropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dietary Aristolochic Acid Exposure and Proximal Tubular Uptake
        description: Aristolochic acid enters the diet when Aristolochia clematitis growing in wheat fields
          is harvested and milled with the grain and baked into household bread. Ingested aristolochic
          acid is taken up by proximal tubular epithelium, which is the same transport-dependent concentration
          step that makes the proximal tubule the target of nephrotoxic drugs.
        role: trigger
        biological_scale: CELLULAR
        conforms_to: drug_induced_nephrotoxicity#Nephrotoxic Drug Exposure and Tubular Uptake
        cell_types:
        - preferred_term: kidney proximal tubule epithelial cell
          term:
            id: CL:0002306
            label: epithelial cell of proximal tubule
        locations:
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
        notes: This node conforms to a module whose trigger is a nephrotoxic DRUG. The agent here is a
          dietary phytotoxin rather than a prescribed drug, and the conformance is asserted on the shared
          mechanism - proximal tubular uptake concentrating a nephrotoxin in the epithelium - rather than
          on the agent being pharmaceutical. The Belgian outbreak, where the same toxin arrived as a herbal
          slimming preparation, sits between the two framings and is why the mechanism travels.
      selected_evidence:
        snippet: the causative factor was identified as the environmental phytotoxin aristolochic acid
          (AA) contained in Aristolochia clematitis, a common plant growing in wheat fields that was ingested
          through home-baked bread.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31054628
      reference_title: Balkan Endemic Nephropathy and the Causative Role of Aristolochic Acid.
      evidence_source: OTHER
      explanation: Establishes the causative agent and the dietary route, which together define the exposure
        this node models.
