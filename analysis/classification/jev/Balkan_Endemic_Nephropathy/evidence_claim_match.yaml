        context: []
      assertion_type: Treatment
      assertion:
        name: Prophylactic bilateral nephroureterectomy before transplantation
        description: The management step specific to this disease. Because the urothelium carries the
          same adduct burden as the kidney, a transplant recipient placed on immunosuppression is at high
          risk of urothelial cancer in the retained native tract. Removing it before transplantation is
          therefore prophylaxis against a tumour that has not yet appeared, which is not how transplant
          workup proceeds in other causes of end-stage renal disease.
        treatment_term:
          preferred_term: Surgical Procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        therapeutic_modality: SURGERY
      selected_evidence:
        snippet: Bilateral nephroureterectomy should be performed in all BEN recipients younger than 65
          years
        supports: SUPPORT
