  bab08fb4887de15cd3b1568516c5ca3e02378fe038d34129ac954c487bd945fa:
    claim:
      about:
        disease:
          name: Balkan Endemic Nephropathy
          disease_term:
            preferred_term: Balkan endemic nephropathy
            term:
              id: MONDO:0007416
              label: Balkan nephropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aristolactam-DNA Adduct Formation
        description: 'Activated aristolochic acid binds covalently to DNA, producing dA-aristolactam and
          dG-aristolactam adducts that persist in renal cortex for decades. These adducts do two distinct
          jobs in this disease: they are the biomarker that established causation, having been found in
          the renal cortex of patients with this nephropathy and not in other chronic renal disease; and
          they are themselves the mutagenic lesion that drives the associated urothelial cancer. That
          dual role is what separates this entry from a generic toxic tubulopathy.'
        role: mechanism
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: DNA damage response
          term:
            id: GO:0006974
            label: DNA damage response
          modifier: INCREASED
      selected_evidence:
        snippet: we identified dA-aristolactam (AL) and dG-AL DNA adducts in the renal cortex of patients
          with EN but not in patients with other chronic renal diseases.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17620607
      reference_title: Aristolochic acid and the etiology of endemic (Balkan) nephropathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Human tissue evidence that the adducts are specific to this nephropathy rather than
        a general feature of chronic kidney disease, which is what makes them causally informative rather
        than merely present.
