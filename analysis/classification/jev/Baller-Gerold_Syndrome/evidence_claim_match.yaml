  5d8f41d189dfb6bf3f86fa4361621be1668927d2bb8a6dc85bb9f2b46cdf3001:
    claim:
      about:
        disease:
          name: Baller-Gerold Syndrome
          disease_term:
            preferred_term: Baller-Gerold syndrome
            term:
              id: MONDO:0009039
              label: Baller-Gerold syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: RECQL4
        gene_term:
          preferred_term: RECQL4
          term:
            id: hgnc:9949
            label: RECQL4
        association: Causative
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: RECQL4 encodes a RecQ-family DNA helicase. Reported BGS genotypes include compound heterozygosity
          for a missense and a frameshift allele, homozygosity for a splice acceptor variant, and compound
          heterozygosity for a splice acceptor variant with a frameshift. The same gene causes Rothmund-Thomson
          syndrome type 2 and RAPADILINO syndrome; genotype does not map cleanly onto which of the three
          clinical phenotypes a patient manifests. RECQL4 variants are found in BGS with poikiloderma
          and are not found in BGS without it.
      selected_evidence:
        snippet: The two heterozygous mutations (c.2059-1G>C and c.2141_2142delAG) were detected in the
          RECQL4 (NM_004260) gene in the fetus; therefore, the fetus was predicted to have Baller-Gerold
          syndrome.
        supports: SUPPORT
    origin:
