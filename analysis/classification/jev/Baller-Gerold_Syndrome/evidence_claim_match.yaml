    evidence_metadata:
      reference: PMID:34869606
      reference_title: Molecular Mechanisms of the RECQ4 Pathogenic Mutations.
      evidence_source: OTHER
      explanation: States that craniosynostosis is the discriminating feature between the two allelic
        syndromes, which is precisely what the mechanism does not account for.
