          modifier: DECREASED
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: Acute deletion of Recql4 in primary osteoblasts or shRNA knockdown in an osteoblastic
          cell line caused failed proliferation, accompanied by cell cycle arrest, induction of apoptosis
