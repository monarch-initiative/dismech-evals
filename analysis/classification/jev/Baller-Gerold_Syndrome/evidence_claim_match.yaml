              or splice-site variant, or a homozygous splice-site variant - remove functional RECQL4,
              an ATP-dependent RecQ-family DNA helicase. Over 100 clinically relevant RECQL4 variants
              are distributed across the gene, and the specific allele combination is what apportions
              patients between Baller-Gerold, Rothmund-Thomson type 2, and RAPADILINO syndromes.
            genes:
