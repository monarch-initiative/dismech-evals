      assertion_type: Pathophysiology
      assertion:
        name: Defective Ossification and Skeletal Patterning
        biological_scale: TISSUE
        description: Loss of osteoblast-progenitor expansion reduces mineral apposition and bone formation,
          giving shorter bones and reduced bone volume in the mouse. In BGS the same lesion is expressed
          during embryonic and early postnatal skeletal patterning, producing both a preaxial upper-limb
          reduction defect and premature fusion of cranial sutures. Why the cranial suture is affected
          in BGS and spared in the allelic Rothmund-Thomson syndrome is not explained by any established
          mechanism.
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        biological_processes:
        - preferred_term: ossification
          term:
            id: GO:0001503
            label: ossification
          modifier: DECREASED
        - preferred_term: osteoblast differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
          modifier: DECREASED
        - preferred_term: cranial suture morphogenesis
          term:
            id: GO:0060363
            label: cranial suture morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Extensive agenesis of the frontal and parietal bones, resulting in a very large fontanelle,
          in addition to coronal bilateral craniosynostosis was observed at necropsy.
        supports: SUPPORT
