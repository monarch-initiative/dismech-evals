        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bgs_craniosynostosis_mechanism_gap
        prompt: Why does biallelic RECQL4 loss cause premature cranial suture fusion in Baller-Gerold
          syndrome but not in the allelic Rothmund-Thomson syndrome?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Defective Ossification and Skeletal Patterning
        rationale: Craniosynostosis is the single feature that keeps BGS separate from RTS, yet the same
          gene and overlapping allele types are involved. The published cellular mechanism for RECQL4
          skeletal disease is progenitor proliferation failure, which predicts hypo-ossification rather
          than premature suture fusion, and no genotype-phenotype rule or modifier has been identified
          that explains why the suture is affected in one syndrome and spared in the other.
      selected_evidence:
        snippet: Nonetheless, RTS and BGS remain as two separate syndromes, since BGS also displays craniosynostosis
          during embryonic development, which is not shared with RTS.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
