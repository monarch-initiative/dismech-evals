        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Synaptic and Circuit Development Dysregulation
        biological_scale: CELLULAR
        description: The functional arm of PTEN loss in the nervous system, distinct from and not reducible
          to brain size. Disrupted synaptic and circuit development manifests as hypotonia, delayed motor
          milestones, global developmental delay, intellectual disability, and autism spectrum characteristics.
          Neonatal or infantile onset and delayed motor development are among the features that historically
          distinguished BRRS from adult-presenting Cowden syndrome. Candidate cellular intermediates include
          microglial activation with excessive synaptic pruning, demonstrated in the cytoplasmic-predominant
          Pten mouse but not yet confirmed in human tissue.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: neuron differentiation
          term:
            id: GO:0030182
            label: neuron differentiation
          modifier: ABNORMAL
      selected_evidence:
        snippet: Pigmented macules of the glans penis, delayed motor development and neonatal or infant
          onset are noted only in BRR.
        supports: SUPPORT
