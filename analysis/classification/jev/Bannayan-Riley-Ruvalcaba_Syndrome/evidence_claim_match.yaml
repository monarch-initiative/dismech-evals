              label: Bannayan-Riley-Ruvalcaba syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_brrs_mutation_negative_cases
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What explains the roughly 40% of clinically diagnosed BRRS cases with no detectable germline
          PTEN variant, and do those individuals carry the same cancer risk?
        attaches_to:
        - pathophysiology#Germline PTEN Loss of Function
        rationale: 'Only about 60% of classically ascertained BRRS cases have an identifiable germline
          PTEN variant, a lower yield than in Cowden syndrome. Several established explanations account
          for part of the residue and should be excluded before invoking locus heterogeneity: large deletions
          missed by sequencing (recoverable by MLPA or microarray, as in the 10q23 contiguous-deletion
          subtype), promoter and deep-intronic variants, somatic mosaicism detectable only in lesional
          tissue, and germline KLLN promoter hypermethylation, which silences KILLIN from the promoter
          PTEN and KLLN share while leaving PTEN transcription intact. What remains after all of those
          is unresolved. Germline TTN missense variants are the leading candidate explanation for part
          of this residue, but remain a candidate association rather than an established disease-gene
          relationship. This directly affects management, because the argument for Cowden-equivalent surveillance
          is anchored on PTEN positivity and does not automatically extend to mutation-negative individuals.'
        proposed_experiments:
        - experiment_id: brrs-mutation-negative-genomics
          name: Genomic reanalysis of PTEN-mutation-negative BRRS
          description: Genome sequencing with deep-intronic, promoter, structural-variant, and somatic-mosaicism
            analysis on a cohort of PTEN-mutation-negative clinical BRRS cases, paired with long-term
            cancer outcome follow-up.
      selected_evidence:
        snippet: Mutations were identified in 26 of 43 (60%) BRR cases.
        supports: SUPPORT
    origin:
