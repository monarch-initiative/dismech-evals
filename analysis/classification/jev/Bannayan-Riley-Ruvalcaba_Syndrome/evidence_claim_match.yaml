        category: Dermatologic
        name: Penile freckling
        description: 'Pigmented macules of the glans penis (genital lentiginosis) are the single most
          specific sign of BRRS. Unlike macrocephaly or lipomas, which are shared across the PHTS spectrum,
          this finding is reported only in BRRS and is therefore of high diagnostic value in a male child
          with macrocephaly and polyposis. Important timing caveat: the macules typically appear peripubertally
          rather than in infancy, so their ABSENCE in a young child does not argue against the diagnosis,
          and the sign is sex-limited. The `diagnostic: true` flag therefore means high specificity when
          present, not screening sensitivity.'
        phenotype_term:
          preferred_term: Pigmented macules of the glans penis
          term:
            id: HP:0031447
            label: Penile freckling
        diagnostic: true
      selected_evidence:
        snippet: Pigmented macules of the glans penis, delayed motor development and neonatal or infant
          onset are noted only in BRR.
        supports: SUPPORT
