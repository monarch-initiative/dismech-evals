  cbfdd40a8033eb3ca437d778fe7590966ca481a08a66eefb2cad43ba8292ba12:
    claim:
      about:
        disease:
          name: Bannayan-Riley-Ruvalcaba Syndrome
          disease_term:
            preferred_term: Bannayan-Riley-Ruvalcaba syndrome
            term:
              id: MONDO:0007924
              label: Bannayan-Riley-Ruvalcaba syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: PTEN Molecular Genetic Testing
        description: 'Definitive diagnosis rests on identifying a heterozygous germline PTEN pathogenic
          variant. Because a substantial minority of clinically diagnosed BRRS cases have no detectable
          PTEN variant, a negative result does not overturn a clinical diagnosis, and such individuals
          are still generally managed with surveillance.

          Testing is tiered, and sequencing alone is not sufficient. Coding-region sequencing is the first
          step, but contiguous-gene and whole/multi-exon deletions at 10q23 are invisible to it and require
          deletion/duplication analysis (MLPA) or chromosomal microarray — the 10q23 PTEN-plus-BMPR1A
          deletion subtype curated in this entry is found only that way. Assay design must also contend
          with the processed pseudogene PTENP1 on chromosome 9, which cross-amplifies with PTEN.'
      selected_evidence:
        snippet: Other mechanisms of loss of function such as hypermethylation, which should result in
          underexpression of PTEN or of KILLIN, a novel tumor suppressor transcribed in the opposite direction,
          may account for the remainder of Cowden syndrome and Cowden-like syndro
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21177507
      reference_title: Germline epigenetic regulation of KILLIN in Cowden and Cowden-like syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports germline promoter hypermethylation as a testable non-sequence mechanism in
        mutation-negative cases, which is why the workup does not stop at sequencing.
