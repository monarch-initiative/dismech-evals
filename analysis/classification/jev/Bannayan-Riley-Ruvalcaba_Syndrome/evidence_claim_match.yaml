              label: Bannayan-Riley-Ruvalcaba syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PTEN
        notes: 'Heterozygous germline loss-of-function variants in PTEN (10q23) cause BRRS. The mutation
          spectrum includes nonsense, frameshift, missense, and splice variants as well as large deletions,
          and is indistinguishable from that seen in Cowden syndrome. Detection rate is ascertainment-dependent
          and must be read with that caveat: the classic clinically ascertained BRRS series found variants
          in 60% of cases, whereas a 2024 systematic review of published pediatric cases found 75/83 (90%)
          — the latter reflects modern practice in which patients are increasingly defined by having the
          variant. The lower classic figure is the relevant one when asking whether a clinically diagnosed
          child without a detectable variant still has BRRS, and on that reading a negative PTEN result
          does not exclude the clinical diagnosis.'
        gene_term:
          preferred_term: PTEN
          term:
            id: hgnc:9588
            label: PTEN
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Bannayan-Riley-Ruvalcaba syndrome (BRRS) is a rare genetic disorder caused by germline
          mutations in the phosphatase and tensin homolog (PTEN) gene.
        supports: SUPPORT
