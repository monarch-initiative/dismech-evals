      assertion_type: Treatment
      assertion:
        name: mTOR Inhibitor Therapy
        description: Everolimus targets the mTOR overactivity that follows PTEN loss, giving a direct
          mechanistic rationale. A 6-month phase II randomized placebo-controlled trial in 46 individuals
          with PHTS aged 5 to 45 found the drug tolerable but did not meet its primary neurocognitive
          endpoint, with gastrointestinal adverse events more common on treatment. mTOR inhibition therefore
          remains investigational for the neurodevelopmental features of BRRS and is not routine care.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: mTOR inhibitor pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: everolimus
            term:
              id: CHEBI:68478
              label: everolimus
      selected_evidence:
        snippet: PTEN hamartoma tumor syndrome (PHTS) is a complex neurodevelopmental disorder characterized
          by mechanistic target of rapamycin (mTOR) overactivity.
        supports: SUPPORT
