        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pten_nuclear_localization_split
        hypothesis_label: Subcellular localization determines the autism-versus-cancer divergence
        status: EMERGING
        description: Proposes that WHERE PTEN is, not only how much of it there is, decides which arm
          of the phenotype a carrier expresses. PTEN shuttles to the nucleus, and variants that deplete
          nuclear PTEN while sparing total protein are proposed to segregate with the ASD/macrocephaly
          presentation rather than the cancer presentation. If correct, this would explain why some PTEN
          carriers present as neurodevelopmental BRRS and others as adult-onset Cowden cancer risk despite
          comparable PTEN dosage, and it predicts that localization, not dosage, should stratify surveillance.
          Evidence is currently confined to the cytoplasmic-predominant Pten mouse; no human genotype-localization-phenotype
          series exists, which is why this is EMERGING rather than ALTERNATIVE.
      selected_evidence:
        snippet: PTEN Hamartoma Tumor Syndrome (PHTS) is an autosomal-dominant genetic condition underlying
          a subset of autism spectrum disorder (ASD) with macrocephaly.
        supports: SUPPORT
    origin:
