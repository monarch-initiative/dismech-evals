      assertion_type: Treatment
      assertion:
        name: Lifelong Cancer Surveillance
        description: 'The central management intervention. Because PTEN-positive BRRS carries the same
          cancer burden as Cowden syndrome, surveillance is identical and lifelong: annual thyroid ultrasound
          and skin examination from the time of diagnosis in childhood; in adults, annual thyroid ultrasound
          and dermatologic evaluation; from age 30 in women, breast screening with consideration of endometrial
          assessment from age 35; colonoscopy from age 35 with intervals set by polyp burden; and biennial
          renal imaging from age 40. Family history of early-onset cancer should pull screening earlier
          by 5 to 10 years.'
        treatment_term:
          preferred_term: cancer surveillance
          term:
            id: NCIT:C15406
            label: Cancer Screening
      selected_evidence:
        snippet: Thus, PTEN mutation-positive CS and BRR may be different presentations of a single syndrome
          and, hence, both should receive equal attention with respect to cancer surveillance.
        supports: SUPPORT
