              label: Bannayan-Riley-Ruvalcaba syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: 10q23 deletion
        display_name: 10q23 contiguous-gene deletion (PTEN + BMPR1A)
        description: 'A contiguous-gene deletion at 10q23 removing both PTEN and BMPR1A, combining BRRS
          features with juvenile polyposis. It was originally described in infantile juvenile polyposis
          with a severe course, and was hypothesized to reflect a synergistic effect of losing both tumor
          suppressors. Subsequent series found the phenotype is variable rather than uniformly severe,
          and severity does not track deletion size. Recognizing this subtype matters practically: it
          is missed by sequencing alone and requires deletion/duplication testing or chromosomal microarray,
          and it explains the otherwise puzzling overlap with juvenile polyposis in the differential.'
      selected_evidence:
        snippet: Recently, 10q23 microdeletions involving the PTEN and BMPR1A genes were found in four
          patients with infantile juvenile polyposis. It was hypothesized that a combined and synergistic
          effect of the deletion of both genes would explain the condition.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18510548
      reference_title: Variable phenotypes associated with 10q23 microdeletions involving the PTEN and
        BMPR1A genes.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the contiguous-deletion entity and the original two-gene synergy hypothesis.
