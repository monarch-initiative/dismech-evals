      assertion_type: Discussion
      assertion:
        discussion_id: gap_brrs_pediatric_ascertained_cancer_risk
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the actual, prospectively measured cancer risk in individuals ascertained as BRRS
          in childhood, as opposed to risk inferred from adult, cancer-ascertained Cowden syndrome cohorts?
        attaches_to:
        - pathophysiology#Lifelong Multiorgan Cancer Predisposition
        rationale: The cancer surveillance imposed on children diagnosed with BRRS rests on allelism with
          Cowden syndrome rather than on direct BRRS-cohort incidence data. The original BRRS delineation
          explicitly noted that malignancy had not been formally documented in BRRS, and contemporary
          reviews flag that existing PHTS risk estimates come from strongly ascertained, mostly adult
          cohorts with an acknowledged absence of pediatric research. If BRRS-ascertained carriers have
          materially different risk, current pediatric surveillance may be either over- or under-calibrated.
        proposed_experiments:
        - experiment_id: brrs-prospective-pediatric-cohort
          name: Prospective pediatric BRRS cancer-incidence cohort
          description: A prospective, multicenter cohort of individuals ascertained in childhood by BRRS
            clinical criteria and followed into adulthood, reporting age- and site-specific cancer incidence
            separately for PTEN-positive and PTEN-negative participants.
      selected_evidence:
        snippet: Although these estimates provide guidance for clinical care, discrepancies between studies,
          sample sizes, retrospective designs, strongly ascertained cases, and lack of pediatric research
          emphasizes that data should be interpreted with great caution.
        supports: SUPPORT
