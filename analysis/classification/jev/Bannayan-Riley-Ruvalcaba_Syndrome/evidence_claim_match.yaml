      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pi3k_independent_overgrowth
        hypothesis_label: PI3K-independent overgrowth via focal adhesion signaling
        status: EMERGING
        description: Proposes a route to the same overgrowth output that does not pass through PIP3/AKT.
          In PTEN-wildtype classic BRRS, germline TTN variants are enriched, and an edited I-band variant
          produced loss of contact inhibition associated with focal adhesion kinase changes rather than
          increased AKT signaling. If real, this would mean mutation-negative BRRS is not simply undetected
          PTEN disease and may not respond to mTOR-directed therapy the way PTEN-positive disease is presumed
          to.
      selected_evidence:
        snippet: suggested lack of contact inhibition in mutant cells
        supports: SUPPORT
