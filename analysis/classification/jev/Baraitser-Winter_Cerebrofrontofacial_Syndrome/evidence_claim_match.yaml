              label: Baraitser-Winter cerebrofrontofacial syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ACTB/ACTG1 Gain-of-Function Variants Alter Actin Dynamics
        description: 'Heterozygous de novo gain-of-function missense variants in ACTB (beta-actin) or
          ACTG1 (gamma-actin) alter the actin monomer conformation in a dominant manner, disrupting the
          G-actin to F-actin treadmilling equilibrium. The recurrent mutations shift the balance toward
          increased filamentous actin (F-actin) stability and impaired dynamic turnover, producing defective
          lamellipodia and filopodia formation in migrating cells throughout embryogenesis.

          '
        biological_processes:
        - preferred_term: actin cytoskeleton organization
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
        - preferred_term: actin filament polymerization
          term:
            id: GO:0030041
            label: actin filament polymerization
      selected_evidence:
        snippet: Using whole-exome sequencing of three proband-parent trios, we identified de novo missense
          changes in the cytoplasmic actin-encoding genes ACTB and ACTG1 in one and two probands, respectively.
        supports: SUPPORT
    origin:
