  4224f4e8041f88e7d096b29a709d02bb24d374511de74084e21e4e55ad03ced9:
    claim:
      about:
        disease:
          name: Baraitser-Winter Cerebrofrontofacial Syndrome
          disease_term:
            preferred_term: Baraitser-Winter cerebrofrontofacial syndrome
            term:
              id: MONDO:0017579
              label: Baraitser-Winter cerebrofrontofacial syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bwcff_organoid_to_human_cortical_malformation_fidelity
        prompt: How faithfully do human iPSC-derived ACTB/ACTG1 cerebral organoids explain the full in
          vivo Baraitser-Winter cortical malformation spectrum, including pachygyria/lissencephaly, anterior-predominant
          gradients and genotype-specific ACTB versus ACTG1 severity?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#ACTB/ACTG1 Gain-of-Function Variants Alter Actin Dynamics
        - pathophysiology#Impaired Neuronal Radial Migration
        - pathophysiology#Actin-Dependent Apical Progenitor Cleavage-Plane Defect
        - pathophysiology#Cortical Dyslamination Leading to Intellectual Disability and Epilepsy
        rationale: The existing human cohort evidence establishes ACTB/ACTG1 actinopathy with pachygyria,
          rare lissencephaly and neuronal heterotopia, while the newer human cerebral organoid evidence
          directly models ventricular-zone progenitor depletion and cleavage-plane defects. The open translatability
          question is whether the organoid progenitor phenotype is sufficient to explain the human cortical
          migration/lamination pattern, or whether later fetal tissue architecture, regional patterning,
          radial glial scaffold organization or variant-specific actin-binding effects are required to
          reproduce the in vivo malformation skeleton.
        proposed_experiments:
        - experiment_id: exp_bwcff_isogenic_organoid_variant_gradient_panel
          name: ACTB/ACTG1 isogenic cerebral organoid cortical-gradient panel
          description: Generate matched patient-derived, CRISPR-corrected and knock-in human cerebral
            organoids for recurrent ACTB and ACTG1 Baraitser-Winter variants. Quantify apical progenitor
            architecture, spindle/cleavage orientation, radial glial scaffold organization, neuronal migration,
            cortical-plate-like layering and anterior/posterior patterning marker differences, then compare
            variant-specific outputs with human MRI and fetal cortical tissue when available.
          experiment_type:
            preferred_term: isogenic cerebral organoid actinopathy assay
          model_systems:
          - name: Human iPSC-derived Baraitser-Winter cerebral organoid
            description: Patient-derived or genome-edited human cerebral organoids carrying ACTB or ACTG1
              missense variants with isogenic corrected controls.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: neural progenitor cell
              term:
                id: CL:0011020
                label: neural progenitor cell
            - preferred_term: radial glial cell
              term:
                id: CL:0000681
                label: radial glial cell
            cell_source: Patient-derived or isogenic engineered human induced pluripotent stem cells
            culture_system: Three-dimensional cerebral organoid with imaging and single-cell readouts
          perturbations:
          - name: ACTB/ACTG1 variant correction and knock-in
            target: pathophysiology#ACTB/ACTG1 Gain-of-Function Variants Alter Actin Dynamics
            description: Correct patient variants and introduce matched variants into control iPSCs to
              distinguish causal actinopathy effects from donor background.
          readouts:
          - name: Progenitor orientation and cortical organization fidelity
            target: pathophysiology#Actin-Dependent Apical Progenitor Cleavage-Plane Defect
            description: Quantify VZ thickness, apical cytoskeletal architecture, cleavage-plane orientation,
              radial glial scaffolding, neuronal migration distance, cortical-plate-like organization
              and region-patterning markers.
            assays:
            - preferred_term: immunostaining
            - preferred_term: live imaging
            - preferred_term: single-cell transcriptomic profiling
            direction: NEGATIVE
          controls:
          - name: Isogenic corrected organoids
            description: Matched organoids in which the ACTB or ACTG1 variant is corrected.
          - name: Isogenic knock-in organoids
            description: Wild-type-background organoids carrying introduced ACTB or ACTG1 variants.
          decision_criterion: The organoid model supports the human cortical-malformation skeleton if
            variant correction rescues progenitor orientation and neuronal organization, and if ACTB/ACTG1-specific
            organoid outputs match human genotype-severity patterns and regional MRI gradients. Persistent
            discordance would support an additional human fetal tissue or long-range migration branch
            not captured by current organoids.
          would_support:
          - pathophysiology#Actin-Dependent Apical Progenitor Cleavage-Plane Defect
          - pathophysiology#Impaired Neuronal Radial Migration
          - pathophysiology#Cortical Dyslamination Leading to Intellectual Disability and Epilepsy
      selected_evidence:
        snippet: Nearly all patients with ACTG1 mutations, and around 60% of those with ACTB mutations
          have some degree of pachygyria with anteroposterior severity gradient, rarely lissencephaly
          or neuronal heterotopia.
        supports: SUPPORT
