              label: Baraitser-Winter cerebrofrontofacial syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neuronal Radial Migration
        description: 'Proper radial migration of post-mitotic cortical neurons from the ventricular zone
          to their laminar destinations requires actin-driven lamellipodia protrusion guided by radial
          glial scaffolding. Gain-of-function actin mutations impair this motility, causing neurons to
          arrest at intermediate positions and producing pachygyria (the predominant brain malformation)
          or in severe cases lissencephaly. The characteristic anteroposterior severity gradient in BRWS
          reflects regional differences in the temporal window of actin-dependent migration.

          '
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        biological_processes:
        - preferred_term: neuron migration
          term:
            id: GO:0001764
            label: neuron migration
        - preferred_term: cytoskeleton organization
          term:
            id: GO:0007010
            label: cytoskeleton organization
      selected_evidence:
        snippet: we report a study of Baraitser-Winter syndrome, a well-defined disorder characterized
          by distinct craniofacial features, ocular colobomata and neuronal migration defect.
        supports: SUPPORT
