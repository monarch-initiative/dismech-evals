      assertion_type: Pathophysiology
      assertion:
        name: Cortical Dyslamination Leading to Intellectual Disability and Epilepsy
        description: 'Failure of neurons to reach their correct laminar positions produces a disorganised
          cortex with abnormally broad gyri (pachygyria) or absent gyri (lissencephaly). The resulting
          cortical dyslamination disrupts thalamocortical and cortico-cortical connectivity, manifesting
          as intellectual disability of variable severity and epileptogenesis with refractory seizures.

          '
      selected_evidence:
        snippet: Intellectual disability and epilepsy are variable in severity and largely correlate with
          CNS anomalies.
        supports: SUPPORT
    origin:
