          - name: Human iPSC-derived Baraitser-Winter cerebral organoid
            description: Patient-derived or genome-edited human cerebral organoids carrying ACTB or ACTG1
              missense variants with isogenic corrected controls.
            experimental_model_type: ORGANOID
            namo_type: namo:Organoid
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: cerebral cortex
              term:
                id: UBERON:0000956
                label: cerebral cortex
            cell_types:
            - preferred_term: neural progenitor cell
              term:
                id: CL:0011020
                label: neural progenitor cell
            - preferred_term: radial glial cell
              term:
                id: CL:0000681
                label: radial glial cell
            cell_source: Patient-derived or isogenic engineered human induced pluripotent stem cells
            culture_system: Three-dimensional cerebral organoid with imaging and single-cell readouts
          perturbations:
          - name: ACTB/ACTG1 variant correction and knock-in
            target: pathophysiology#ACTB/ACTG1 Gain-of-Function Variants Alter Actin Dynamics
            description: Correct patient variants and introduce matched variants into control iPSCs to
              distinguish causal actinopathy effects from donor background.
          readouts:
          - name: Progenitor orientation and cortical organization fidelity
            target: pathophysiology#Actin-Dependent Apical Progenitor Cleavage-Plane Defect
            description: Quantify VZ thickness, apical cytoskeletal architecture, cleavage-plane orientation,
              radial glial scaffolding, neuronal migration distance, cortical-plate-like organization
              and region-patterning markers.
            assays:
            - preferred_term: immunostaining
            - preferred_term: live imaging
            - preferred_term: single-cell transcriptomic profiling
            direction: NEGATIVE
          controls:
          - name: Isogenic corrected organoids
            description: Matched organoids in which the ACTB or ACTG1 variant is corrected.
          - name: Isogenic knock-in organoids
            description: Wild-type-background organoids carrying introduced ACTB or ACTG1 variants.
          decision_criterion: The organoid model supports the human cortical-malformation skeleton if
            variant correction rescues progenitor orientation and neuronal organization, and if ACTB/ACTG1-specific
            organoid outputs match human genotype-severity patterns and regional MRI gradients. Persistent
            discordance would support an additional human fetal tissue or long-range migration branch
            not captured by current organoids.
          would_support:
          - pathophysiology#Actin-Dependent Apical Progenitor Cleavage-Plane Defect
          - pathophysiology#Impaired Neuronal Radial Migration
          - pathophysiology#Cortical Dyslamination Leading to Intellectual Disability and Epilepsy
      selected_evidence:
        snippet: Various cytoskeletal and morphological irregularities of BWCFF-S VZ progenitors, notably
          in the apical region of these cells, seemingly contribute to their predominantly horizontal
          cleavage plane orientation.
        supports: SUPPORT
