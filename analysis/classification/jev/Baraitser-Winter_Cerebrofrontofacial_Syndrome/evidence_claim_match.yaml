      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Optic Fissure Closure Causing Coloboma
        description: 'Closure of the choroidal fissure during embryonic weeks 5-7 requires coordinated
          actin-dependent cell migration in the optic cup. Gain-of-function actin mutations impair this
          process, preventing complete fissure closure and resulting in iris or retinal coloboma. This
          is a direct mechanistic consequence of disrupted actin dynamics, not an incidental feature.

          '
        biological_processes:
        - preferred_term: cytoskeleton organization
          term:
            id: GO:0007010
            label: cytoskeleton organization
      selected_evidence:
        snippet: Iris or retinal coloboma is present in many cases, as is sensorineural deafness.
        supports: SUPPORT
