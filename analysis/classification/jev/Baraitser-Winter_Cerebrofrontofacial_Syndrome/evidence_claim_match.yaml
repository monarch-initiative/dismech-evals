        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Neural Crest Cell Migration Producing Craniofacial Features
        description: 'Cranial neural crest cells that populate the craniofacial mesenchyme use actin-driven
          lamellipodia for directed migration. Gain-of-function actin mutations impair this process, producing
          the characteristic craniofacial gestalt: hypertelorism, metopic ridge, bilateral ptosis, arched
          eyebrows, and broad nasal bridge. These features reflect defective neural crest morphogenetic
          movements during craniofacial development.

          '
        cell_types:
        - preferred_term: migratory cranial neural crest cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
        biological_processes:
        - preferred_term: neural crest cell migration
          term:
            id: GO:0001755
            label: neural crest cell migration
      selected_evidence:
        snippet: characterised by intellectual disability (mild to severe) and distinctive facial appearance
          (metopic ridging/trigonocephaly, bilateral ptosis, hypertelorism).
        supports: SUPPORT
