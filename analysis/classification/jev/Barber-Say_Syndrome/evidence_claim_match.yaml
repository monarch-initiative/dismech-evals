        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Congenital Generalized Hypertrichosis
        - mechanistic_hypotheses#twist2_glu75_neomorphic_binding
        rationale: Hypertrichosis is the clinical feature that separates Barber-Say from ablepharon-macrostomia
          syndrome, yet no study among the references cited here has examined hair follicles or follicular
          mesenchyme in either. The hypertrichosis phenotype is therefore left without an upstream mechanism
          node in this entry. A residue-specific difference in off-target binding would be one explanation,
          but the ChIP-seq was done in HeLa cells.
      selected_evidence:
        snippet: Scalp hair is sparse in AMS only, but sparse eyebrows and eyelashes occur in both entities,
          and general hypertrichosis occurs in BSS.
