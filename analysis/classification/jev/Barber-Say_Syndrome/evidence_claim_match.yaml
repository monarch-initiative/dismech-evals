      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: twist2_glu75_dominant_negative
        hypothesis_label: Glu75 substitutions interfere with the wild-type TWIST2 pool
        status: EMERGING
        description: Under this model the mutant subunit still enters TWIST2 homodimers and bHLH heterodimers
          but those complexes fail to bind the normal E-box targets, so the wild-type protein is inactivated
          along with it. Support comes from the ChIP-seq loss of wild-type peaks, from the C. elegans
          hlh-8 allelic series, which favours a predominantly dominant-negative mechanism for the TWIST1/TWIST2
          residue substitutions, and from phenotypic overlap with Setleis syndrome, which is caused by
          biallelic loss of TWIST2 function. Not mutually exclusive with the neomorphic model.
      selected_evidence:
        snippet: The genetic analysis favors a predominantly dominant-negative mechanism for the action
          of amino acid substitutions at this highly conserved glutamic acid residue
        supports: SUPPORT
