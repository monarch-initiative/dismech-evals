          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: Heterozygous TWIST2 variants cause the disorder. Most probands carry a de novo variant.
          Vertical transmission is documented mother-to-son and father-to-daughter, and in the gene-discovery
          series three transmitting fathers with milder features were somatic mosaics for the variant
          their children carried. A clinically unaffected or mildly affected parent can therefore carry
          the variant in mosaic form, which is why parental testing is recommended.
      selected_evidence:
        snippet: We report on a mother-to-son transmission of the Barber-Say syndrome, a finding that
          strongly supports dominant inheritance of this rare disorder.
        supports: SUPPORT
