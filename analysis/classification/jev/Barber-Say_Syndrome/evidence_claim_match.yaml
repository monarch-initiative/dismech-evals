      assertion:
        hypothesis_group_id: twist2_glu75_neomorphic_binding
        hypothesis_label: Glu75 substitutions give TWIST2 new genomic targets
        status: EMERGING
        description: Under this model the disease-relevant effect is the binding of mutant TWIST2 to sites
          the wild-type protein does not occupy, changing expression of genes TWIST2 does not normally
          regulate. The observation behind it is the large set of mutant-only ChIP-seq peaks. It would
          also offer an explanation for why lysine at the same residue (AMS) and glutamine or alanine
          (BSS) give different syndromes, but no study has tested that target-set difference in a relevant
          tissue.
      selected_evidence:
        snippet: A significant number of binding peaks detected for the mutant TWIST2 proteins were not
          detected for the wild-type protein
        supports: SUPPORT
