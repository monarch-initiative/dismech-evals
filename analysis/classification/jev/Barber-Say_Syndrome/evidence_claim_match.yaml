        limitations: Global overexpression of human mRNA from the one-cell stage, not a heterozygous allele
          expressed in mesenchyme; wild-type TWIST2 overexpression alone produced a phenotype, so the
          comparison is between two gain-of-dose conditions. Fish have no eyelids or hair, so the defining
          features cannot be assessed.
      selected_evidence:
        snippet: Simple overexpression of the wild-type protein in zebrafish caused a mild developmental
          phenotype.
        supports: SUPPORT
