  5684f841ebdea3e04cad798d144708061a76b1eea1ae40726fbf5ae243f8881a:
    claim:
      about:
        disease:
          name: Barber-Say Syndrome
          disease_term:
            preferred_term: Barber-Say syndrome
            term:
              id: MONDO:0008853
              label: Barber-Say syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: TWIST2
        gene_term:
          preferred_term: TWIST2
          term:
            id: hgnc:20670
            label: TWIST2
        association: CAUSATIVE
        variant_origin: DE_NOVO
        features: 'Heterozygous variants in the basic domain: p.Glu75Gln (NM_057179.2 c.223G>C; 9 of the
          11 Glu75 BSS individuals in the discovery series), p.Glu75Ala (c.224A>C; 2 of 11) and, in one
          proband, the in-frame duplication p.Gln77_Arg78dup (c.229_234dupCAGCGC). Mostly de novo; transmitted
          in several families, including from mosaic fathers. p.Glu75Lys at the same residue causes ablepharon-macrostomia
          syndrome, and biallelic nonsense alleles cause Setleis syndrome.'
        notes: 'No ClinGen gene-disease validity assertion exists for TWIST2 and Barber-Say syndrome (ClinGen
          gene-validity download, retrieved 2026-09-23, has no TWIST2 row). The mosaic father-to-child
          transmission in an Indian family (PMID:27092433) is not cited: PubMed holds no abstract for
