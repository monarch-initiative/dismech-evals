          finding across the TWIST2 Glu75 disorders. In Barber-Say syndrome it presents mainly as ectropion,
          and less often as microblepharon; the severe end, ablepharon, characterises the allelic ablepharon-macrostomia
          syndrome. Surgical exploration in one patient found abnormal external and internal eyelid anatomy.

          PROVISIONAL because no study has traced a Glu75 allele through eyelid morphogenesis; the link
          from TWIST2 to the eyelid is inferred from the phenotype and from where TWIST2 is expressed.'
