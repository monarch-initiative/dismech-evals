  1bf2aa69addf56c3812b5b4e908f660be9ac0c74229d9c8e0414914f274901a8:
    claim:
      about:
        disease:
          name: Barber-Say Syndrome
          disease_term:
            preferred_term: Barber-Say syndrome
            term:
              id: MONDO:0008853
              label: Barber-Say syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TWIST2 Glu75 Basic-Domain Substitution
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: A heterozygous substitution of the conserved glutamic acid at codon 75 of TWIST2,
          in the basic region of the bHLH domain that contacts DNA. Glutamine (p.Glu75Gln) is the recurrent
          Barber-Say allele and alanine (p.Glu75Ala) the second; one proband carried an in-frame duplication
          of codons 77-78 (p.Gln77_Arg78dup) in the same domain. Lysine at the same residue (p.Glu75Lys)
          gives ablepharon-macrostomia syndrome instead, so the substituting amino acid, not only the
          position, sets the phenotype. In silico modelling places Glu75 facing the DNA major groove next
          to the first two nucleotides of the E-box, and predicts no change in global protein structure.
        gene:
          preferred_term: TWIST2
          term:
            id: hgnc:20670
            label: TWIST2
        genetic_context:
          gene:
            preferred_term: TWIST2
            term:
              id: hgnc:20670
              label: TWIST2
          allele_type: SNV
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          description: 'Heterozygous missense substitutions at Glu75 (p.Glu75Gln, p.Glu75Ala; NM_057179.2
            c.223G>C and c.224A>C), mostly de novo and occasionally inherited from a mosaic parent. functional_impact_category
            is left unset deliberately: the primary functional study reports both lost wild-type binding
            and gained off-target binding and names a dominant-negative and a neomorphic mechanism as
            alternatives, while the C. elegans allelic series favours a predominantly dominant-negative
            mechanism. Picking one enum value would assert more than either source does; see mechanistic_hypotheses.'
        locations:
        - preferred_term: periocular mesenchyme
          term:
            id: UBERON:0004017
            label: periocular mesenchyme
      selected_evidence:
        snippet: a lysine at TWIST2 residue 75 resulted in AMS, whereas a glutamine or alanine yielded
          BSS
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
