      assertion:
        name: Oligogenic inheritance
        inheritance_term:
          preferred_term: Oligogenic inheritance
          term:
            id: HP:0010983
            label: Oligogenic inheritance
        description: 'A subset of BBS families show evidence of oligogenic (triallelic) inheritance, where
          variants at a second BBS locus are required to manifest the phenotype. This block is retained
          because Orphanet still lists oligogenic transmission and the 2001 proposal is the origin of
          the triallelic model, but the claim is contested rather than settled: a comprehensive analysis
          of all 14 BBS genes plus the CCDC28B modifier in 29 mostly multiplex families found no instance
          supporting the model, and argued for straightforward autosomal recessive BBS in most cases.
          Read the two evidence items below together - the REFUTE item is not an oversight. BBS is therefore
          the weakest of the multi-locus assertions grouped in Digenic and Oligogenic Disorders, and is
          the member most likely to be retired if a large modern cohort replicates the negative result.'
      selected_evidence:
        snippet: Oligogenic
        supports: SUPPORT
