              label: Barth syndrome
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: phagocyte defect
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 5 "Congenital
          defects of phagocyte number or function", section 1 (Congenital Neutropenias): row "Barth Syndrome
          (3-Methylglutaconic aciduria type II) TAZ XL 300394", affected cells N+L Mel, affected function
          mitochondrial function, associated features cardiomyopathy, myopathy, growth retardation and
          neutropenia.

          The paper prints the legacy gene symbol TAZ. The current HGNC symbol is TAFAZZIN (hgnc:11577),
          which is what this entry binds — the same gene, not a mismatch, and the quoted snippet keeps
          the published symbol because it belongs to the source.

          Scope: iuis_category is single-valued, so this tag records that Barth syndrome occupies a Table
          5 row, not that the disorder is primarily an inborn error of immunity. Neutropenia is one feature
          of a cardiolipin-remodeling mitochondrial disorder whose leading problems are cardiomyopathy
          and skeletal myopathy; the IUIS affected-function cell is correspondingly "mitochondrial function"
          rather than any phagocyte-specific lesion.'
      selected_evidence:
        snippet: Barth Syndrome (3-Methylglutaconic aciduria type II) TAZ XL 300394
        supports: SUPPORT
