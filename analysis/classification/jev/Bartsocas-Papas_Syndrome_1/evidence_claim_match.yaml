              label: Bartsocas-Papas syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Periderm Defect and Epithelial Fusion
        biological_scale: TISSUE
        description: The periderm is a transient superficial epithelial layer that forms early in embryogenesis
          and keeps apposed, adhesion-competent embryonic epithelia from sticking together. In Ripk4-deficient
          mice periderm development is abnormal, E-cadherin is mislocalized to the apical membrane of
          the outer peridermal cells, and all external orifices fuse; deleting E-cadherin in keratinocytes
          rescues the oral and tail-to-body fusions. Failure of periderm formation is the proposed common
          mechanism of the popliteal pterygium, cocoon and Bartsocas-Papas syndromes. In patients this
          produces the popliteal and other pterygia, ankyloblepharon, the fibrous bands between the jaws
          and the fused lips.
        cell_types:
        - preferred_term: peridermal cell
          term:
            id: CL:0000078
            label: peridermal cell
        biological_processes:
        - preferred_term: eyelid development in camera-type eye
          term:
            id: GO:0061029
            label: eyelid development in camera-type eye
          modifier: ABNORMAL
        notes: The mouse data are from Ripk4-null animals; the human periderm has not been examined in
          Bartsocas-Papas syndrome 1. ABNORMAL is used for the eyelid process because the defect is a
          failure of lid-margin separation rather than a change in the amount of a process.
      selected_evidence:
        snippet: Here we describe that RIPK4 deficiency in mice causes epithelial fusions associated with
          abnormal periderm development and aberrant ectopic localization of E-cadherin on the apical
          membrane of the outer peridermal cell layers.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
