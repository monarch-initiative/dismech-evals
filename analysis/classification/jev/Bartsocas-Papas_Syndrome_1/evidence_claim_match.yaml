        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ripk4_allelic_spectrum
        kind: KNOWLEDGE_GAP
        attaches_to:
        - disease#
        prompt: Do RIPK4 variants form a single severity spectrum from CHAND syndrome through attenuated
          forms to lethal Bartsocas-Papas syndrome, and does residual kinase activity predict severity?
        rationale: RIPK4 variants have been reported in an AEC-like presentation without pterygia, in
          patients diagnosed with the milder popliteal pterygium syndrome, in CHAND syndrome and in the
          lethal phenotype, and severity can differ within a family. The kinase-domain variants tested
          so far abolish activity, but no study has compared residual activity across the clinical range.
        proposed_experiments:
        - experiment_id: ripk4_allele_activity_panel
          name: RIPK4 allele kinase and IRF6 activation panel
          description: Measure kinase activity and IRF6 activation in keratinocytes for RIPK4 alleles
            from lethal, attenuated and CHAND cases side by side, to test whether residual activity tracks
            clinical severity.
      selected_evidence:
        snippet: We also demonstrate that mutations in RIPK4 can cause features with a range of severity
          along the PPS-BPS spectrum
        supports: SUPPORT
