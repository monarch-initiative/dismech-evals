          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Affected individuals are homozygous for RIPK4 variants, usually in consanguineous
          families, with heterozygous unaffected parents and recurrence in siblings. In one child, with
          a milder presentation diagnosed clinically as popliteal pterygium syndrome, an apparently homozygous
          RIPK4 variant carried only by the mother was explained by maternal isodisomy of chromosome 21;
          the authors count this child within the RIPK4 disease.
      selected_evidence:
        snippet: Using exome sequencing in a consanguineous family, we identified the homozygous mutation
          c.1127C>A in exon 7 of RIPK4
        supports: SUPPORT
