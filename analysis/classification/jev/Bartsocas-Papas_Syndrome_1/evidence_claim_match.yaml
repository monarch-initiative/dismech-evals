      assertion:
        name: Disrupted Craniofacial, Limb and Genital Morphogenesis
        biological_scale: TISSUE
        description: RIPK4 is required for craniofacial and limb development, and RIPK4, IRF6 and IKK-alpha
          mutant mice share a thickened epidermis with cleft palate or a fused oral cavity. The resulting
          malformations in patients are orofacial clefts, a hypoplastic nose, eyelid coloboma, reduction
          of the digits with absent thumbs and hypoplastic distal phalanges, synostosis of carpal, tarsal
          and phalangeal bones, clubfeet and hypoplastic or ambiguous external genitalia. How RIPK4 loss
          produces the skeletal and genital defects is not established.
        biological_processes:
        - preferred_term: limb development
          term:
            id: GO:0060173
            label: limb development
          modifier: ABNORMAL
        notes: This node collects malformations whose mechanism is known only to start from the loss of
          RIPK4-IRF6 signaling; the intermediate steps are a knowledge gap (see discussions).
      selected_evidence:
        snippet: Ikka, Irf6, and Ripk4 mutant mice share a thick, tightened epidermis and cleft palate
          or fused oral cavity.
        supports: SUPPORT
