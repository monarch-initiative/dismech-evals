        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ripk4_malformation_route
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Disrupted Craniofacial, Limb and Genital Morphogenesis
        prompt: How does loss of RIPK4 kinase signaling produce the limb reduction, bony synostosis, orofacial
          clefts and genital hypoplasia of Bartsocas-Papas syndrome 1?
        rationale: The epithelial fusions are explained by periderm failure in Ripk4-null mice, but digit
          loss, carpal and tarsal synostosis and genital hypoplasia are not part of the knockout phenotype
          as described in the cited abstracts. Whether RIPK4 acts on these structures through epidermal-mesenchymal
          signaling, as IKK-alpha does in the related cocoon syndrome, or through a direct role outside
          the epidermis, is not known.
      selected_evidence:
        snippet: The present study's findings point out that RIPK4 and CHUK might function in closely
          related pathways to promote keratinocyte differentiation and epithelial growth.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
