              label: Bartsocas-Papas syndrome 1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical Recognition and Molecular Genetic Testing
        description: The diagnosis is suspected in a fetus or newborn with popliteal webs, ankyloblepharon,
          oral synechiae, orofacial clefting, syndactyly and genital hypoplasia, and is confirmed by biallelic
          pathogenic RIPK4 variants. IRF6 (dominant popliteal pterygium syndrome), CHUK and TP63 (AEC
          syndrome) are the main genes to consider; an attenuated RIPK4 case resembling AEC was first
          tested for TP63 and then solved by exome sequencing. Correct genotyping changes the recurrence
          risk from that of a dominant disorder to 25 percent.
      selected_evidence:
        snippet: In contrast to the autosomal dominant Hay-Wells syndrome, Bartsocas-Papas syndrome is
          autosomal recessive, implying a 25% recurrence risk.
        supports: SUPPORT
