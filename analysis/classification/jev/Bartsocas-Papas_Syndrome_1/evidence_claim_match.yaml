      assertion:
        name: RIPK4
        gene_term:
          preferred_term: RIPK4
          term:
            id: hgnc:496
            label: RIPK4
        relationship_type: CAUSATIVE
        variants:
        - name: c.1127C>A (p.Ser376Ter)
          description: Homozygous nonsense variant in exon 7, found in the consanguineous family in which
            RIPK4 was identified by exome sequencing. In cell-based assays the truncated protein fails
            to induce IRF6 transactivator function.
          type: NONSENSE
        - name: c.242T>A (p.Ile81Asn)
          description: Missense variant in the kinase domain.
          type: MISSENSE
        - name: c.362T>A (p.Ile121Asn)
          description: Homozygous kinase-domain missense variant in a consanguineous Turkish family; it
            abolished catalytic activity in reporter assays.
          type: MISSENSE
        - name: c.551C>T (p.Thr184Ile)
          description: Kinase-domain missense variant; both parents heterozygous.
          type: MISSENSE
        - name: c.777_778insA (p.Arg260ThrfsTer14)
          description: Homozygous frameshift in exon 5 predicted to truncate the protein within the kinase
            domain, in an Egyptian infant with multiple pterygia.
          type: FRAMESHIFT
        - name: c.481G>C (p.Asp161His)
          description: Homozygous kinase-domain missense variant in a Turkish family with two severely
            affected pregnancies; Asp161 is required for kinase activity.
          type: MISSENSE
        - name: c.488G>A (p.Gly163Asp)
          description: Homozygous kinase-domain missense variant in a girl with an attenuated, non-lethal
            presentation without pterygia that resembled AEC (Hay-Wells) syndrome.
          type: MISSENSE
        - name: c.566C>T (p.Pro189Leu)
          description: Homozygous kinase-domain missense variant in a family with typical BPS.
          type: MISSENSE
        notes: Reported variants are kinase-domain missense, nonsense and frameshift alleles; the kinase-domain
          missense variants tested abolish catalytic activity. RIPK4 variants have also been reported
          in patients diagnosed clinically with the milder popliteal pterygium syndrome, so RIPK4 genotype
          does not map one-to-one onto the clinical label.
      selected_evidence:
        snippet: The present study's findings show that recessive mutations in RIPK4 cause Bartsocas-Papas
          syndrome and its variant, the autosomal-recessive form of multiple pterygium syndrome (Aslan
          type).
        supports: SUPPORT
