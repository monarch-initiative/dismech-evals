      assertion:
        name: Epidermal Barrier Failure
        biological_scale: TISSUE
        description: In mice, RIPK4 and IRF6 in the epidermis are needed to build the inside-out barrier.
          Epidermis-specific Ripk4 knockout mice stratify their epidermis but die shortly after birth
          from excessive water loss, because claudin-1 is not localized to the membrane and tight junctions
          leak. Whether barrier failure contributes to neonatal death in Bartsocas-Papas syndrome 1, where
          newborns also have severe facial, oral and limb malformations, has not been studied.
        biological_processes:
        - preferred_term: establishment of skin barrier
          term:
            id: GO:0061436
            label: establishment of skin barrier
          modifier: DECREASED
      selected_evidence:
        snippet: However, RIPK4EKO mice die shortly after birth due to excessive water loss because of
          loss of tight junction protein claudin-1 localization at the cell membrane, which results in
          tight junction leakiness.
        supports: SUPPORT
