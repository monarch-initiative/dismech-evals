            term:
              id: MONDO:0009901
              label: Bartsocas-Papas syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired RIPK4 Wnt and Hippo Branch Signaling
        biological_scale: MOLECULAR
        description: Besides IRF6, RIPK4 phosphorylates other substrates. It phosphorylates the Wnt adaptor
          DVL2 to promote canonical Wnt/beta-catenin signaling, and Bartsocas-Papas RIPK4 mutants fail
          to induce beta-catenin accumulation. It also phosphorylates LATS1/2 in liquid condensates, acting
          as an upstream kinase of a noncanonical Hippo pathway; in Ripk4 knockout epidermis Yap/Taz are
          activated in the granular layer and repress cholesterol biosynthesis, and removing Yap/Taz partly
          rescues the barrier defect. Disease-derived RIPK4 mutants fail to activate LATS1/2. How much
          these branches contribute to the human malformations is not known.
        genes:
        - preferred_term: RIPK4
          term:
            id: hgnc:496
            label: RIPK4
        biological_processes:
        - preferred_term: canonical Wnt signaling pathway
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
          modifier: DECREASED
        - preferred_term: hippo signaling
          term:
            id: GO:0035329
            label: hippo signaling
          modifier: DECREASED
        notes: hippo signaling is DECREASED because RIPK4 loss removes LATS1/2 activation, which leaves
          the downstream effectors Yap/Taz more active.
      selected_evidence:
        snippet: Ectopic RIPK4, but not catalytically inactive or Bartsocas-Papas RIPK4 mutants, induced
          accumulation of cytosolic β-catenin and a transcriptional program similar to that caused by
          Wnt3a.
        supports: SUPPORT
    origin:
