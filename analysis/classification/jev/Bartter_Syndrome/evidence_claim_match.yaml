  7d075655151b0a1d034714391f6dbf65aaadb74f0a4bebb0ef40bc33455331ca:
    claim:
      about:
        disease:
          name: Bartter syndrome
          disease_term:
            preferred_term: Bartter syndrome
            term:
              id: MONDO:0015231
              label: Bartter syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MAGED2-Dependent Cotransporter Trafficking Failure (Type 5)
        biological_scale: MOLECULAR
        role: trigger
        description: 'MAGED2 is not itself a transporter. It raises the cell-surface expression of NKCC2
          in the thick ascending limb and of NCC in the distal convoluted tubule, so X-linked loss of
          function removes transporters from the membrane rather than disabling them in place. That is
          a distinct mechanism from the type I-IV channel and cotransporter lesions, and it matches the
          distinct clinical course: severe antenatal polyhydramnios followed by spontaneous resolution
          after birth.'
        cell_types:
        - preferred_term: Thick ascending limb epithelial cell
          term:
            id: CL:1001106
            label: kidney loop of Henle thick ascending limb epithelial cell
        genes:
        - preferred_term: MAGED2
          term:
            id: hgnc:16353
            label: MAGED2
          modifier: LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: Cotransporter delivery to the apical membrane
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
          modifier: DECREASED
      selected_evidence:
        snippet: MAGE-D2 encodes melanoma-associated antigen D2, which interacts with NKCC2 and increases
          their cell-surface expression and activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30519073
      reference_title: 'Bartter syndrome: causes, diagnosis, and treatment.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the trafficking role that distinguishes this lesion from the transporter lesions
