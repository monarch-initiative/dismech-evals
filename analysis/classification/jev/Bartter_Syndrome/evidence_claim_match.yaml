      assertion:
        name: ROMK Potassium Recycling Failure (Type 2)
        biological_scale: MOLECULAR
        role: trigger
        description: KCNJ1 encodes ROMK (Kir1.1), the apical channel that returns K+ to the tubular lumen.
          That recycling is what keeps luminal K+ available for NKCC2, so losing ROMK stalls the cotransporter
          indirectly rather than by disabling it. ROMK is also expressed in the cortical collecting duct,
          where it secretes K+ — which is why type II disease can show transient neonatal hyperkalaemia
          despite the salt-wasting phenotype.
        cell_types:
        - preferred_term: Thick ascending limb epithelial cell
          term:
            id: CL:1001106
            label: kidney loop of Henle thick ascending limb epithelial cell
        genes:
        - preferred_term: KCNJ1
          term:
            id: hgnc:6255
            label: KCNJ1
          modifier: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: ROMK inward-rectifier potassium channel activity
          term:
            id: GO:0005242
            label: inward rectifier potassium channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: K+ is recycled to the tubular lumen by the renal outer medullary K+ (ROMK) channel, also
          known as inwardly rectifying Kir1.1, encoded by KCNJ1 gene and which is located at the luminal
          surface of the epithelial cell.
        supports: SUPPORT
