              label: Bartter syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Digenic (Type 4B)
        inheritance_term:
          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
        description: 'Type 4B is digenic: it requires simultaneous loss-of-function mutations in both
          CLCNKA and CLCNKB. Each locus behaves recessively, so this block does not displace the autosomal
          recessive block above - it records the additional requirement that two distinct chloride-channel
          loci be hit before the antenatal, deafness-associated phenotype appears. Mutation of CLCNKB
          alone gives classic type 3 Bartter syndrome without deafness, which is why the second locus
          is a causal requirement rather than a modifier. Contributing genes: CLCNKA and CLCNKB.'
      selected_evidence:
        snippet: type IVb is a digenic disorder with mutations in both CLCNKA and CLCNKB genes, which
          can lead to impairment in the functioning of two chloride channels and as a result, severe salt
          wasting and deafness.
        supports: SUPPORT
