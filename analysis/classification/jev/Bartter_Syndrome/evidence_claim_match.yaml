        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired NaCl Reabsorption in Thick Ascending Limb
        description: The primary defect in Bartter syndrome is impaired sodium chloride reabsorption in
          the thick ascending limb (TAL) of the loop of Henle. NKCC2 (apical) mediates electroneutral
          entry of Na+, K+, and 2Cl-; ROMK recycles K+ back to the lumen to sustain NKCC2 activity; and
          ClC-Kb (with barttin) provides basolateral Cl- exit. Loss of any component disrupts the entire
          transcellular NaCl transport pathway.
        cell_types:
        - preferred_term: Thick ascending limb epithelial cell
          term:
            id: CL:1001106
            label: kidney loop of Henle thick ascending limb epithelial cell
        biological_processes:
        - preferred_term: Sodium ion transport
          term:
            id: GO:0006814
            label: sodium ion transport
          modifier: DECREASED
        - preferred_term: Renal sodium ion transport
          term:
            id: GO:0003096
            label: renal sodium ion transport
          modifier: DECREASED
        - preferred_term: Chloride transmembrane transport
          term:
            id: GO:1902476
            label: chloride transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: The main ion channel at the luminal membrane is NKCC2 (furosemide-sensitive sodium–potassium–chloride
          cotransporter), which belongs to a family of sodium-coupled electrolyte transporters, encoded
          by the solute carrier family of SLC12A genes. NKCC2 is responsible for carrying sodium from
          the tubular lumen into the cell coupled with potassium and chloride.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30519073
