            id: hgnc:10910
            label: SLC12A1
        description: Caused by loss-of-function mutations in SLC12A1, encoding the sodium-potassium-chloride
          cotransporter NKCC2 in the thick ascending limb. Presents antenatally with polyhydramnios, premature
          birth, and severe salt wasting. Nephrocalcinosis is common.
      selected_evidence:
        snippet: In type I BS, symptoms are usually present at birth with severe salt wasting, hyposthenuria,
          increased production of PGE2, and failure to thrive. Some of these symptoms already occur in
          utero and can cause polyhydramnios and premature delivery. A common feature is marked hypercalciuria,
          which may lead to nephrocalcinosis and/or osteopenia.
        supports: SUPPORT
