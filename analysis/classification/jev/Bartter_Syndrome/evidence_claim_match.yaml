        snippet: Transepithelial salt movement into the medullary inter-stitium, together with the low
          permeability of the luminal membrane of the TAL to water, is important to allow the kidneys
          to develop interstitial hypertonicity and support the urinary concentrating ability.
        supports: SUPPORT
