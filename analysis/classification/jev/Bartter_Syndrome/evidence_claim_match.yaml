          term:
            id: GO:0005242
            label: inward rectifier potassium channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: More than 40 KCNJ1 mutations, causing loss of function of ROMK channel, have been described
        supports: SUPPORT
