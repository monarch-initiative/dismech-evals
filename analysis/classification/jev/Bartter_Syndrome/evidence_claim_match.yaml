        - preferred_term: Chloride transmembrane transport
          term:
            id: GO:1902476
            label: chloride transmembrane transport
          modifier: DECREASED
      selected_evidence:
        snippet: Mutations in the BSND gene cause type IVa BS and result in impairment of barttin insertion
          in the plasma membrane of CLC-Kb and CLC-Ka channels in the Henle’s loop as well as in the inner
          ear, which interfere with epithelial salt transport.
        supports: SUPPORT
