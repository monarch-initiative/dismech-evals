                syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MED25 Mediator incorporation failure
        description: 'MED25 is a subunit of the tail module of the Mediator complex. The disease-causing
          missense variants sit in the von Willebrand factor type A (VWA) domain responsible for MED25
          recruitment into Mediator; co-immunoprecipitation shows the founder allele dramatically impairs
          MED25 interaction with the complex, disrupting Mediator-dependent transcription of developmental
          gene-expression programs.

          '
        genes:
        - preferred_term: MED25
          term:
            id: hgnc:28845
            label: MED25
        biological_processes:
        - preferred_term: transcription by RNA polymerase II
          term:
            id: GO:0006366
            label: transcription by RNA polymerase II
        - preferred_term: regulation of gene expression
          term:
            id: GO:0010468
            label: regulation of gene expression
          modifier: DYSREGULATED
      selected_evidence:
        snippet: co-immunoprecipitation experiment demonstrated that this mutation dramatically impairs
          MED25 interaction with the Mediator complex in mammalian cells.
        supports: SUPPORT
