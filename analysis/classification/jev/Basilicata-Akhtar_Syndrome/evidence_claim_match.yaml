          samples; the remaining one was transmitted from a phenotypically normal mother carrying the
          variant at about 8% in blood. All causative variants reported to date (n = 41, excluding multigene
          deletions) lie in exons 6-13 of NM_078629.4, which encode the MRG domain.
        gene_disease_validity:
