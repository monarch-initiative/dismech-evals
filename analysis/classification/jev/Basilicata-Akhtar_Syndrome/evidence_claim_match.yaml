      assertion_type: Pathophysiology
      assertion:
        name: MSL3 Loss of Function
        description: Pathogenic MSL3 alleles are predominantly loss-of-function (nonsense, frameshift,
          splice-site and multi-exon deletion), with a minority of missense and in-frame variants at conserved
          MRG-domain residues. All reported causative variants lie in exons 6-13, which encode the MRG
          domain; the cohort authors suggest that a shorter transcript may compensate for truncating variants
          in the first exons, a hypothesis that has not been tested experimentally.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MSL3
          term:
            id: hgnc:7370
            label: MSL3
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: We identified multiple variant types in MSL3 (ten nonsense, six frameshift, four splice
          site, three missense, one in-frame-deletion, one multi-exon deletion), most proven to be de
          novo, and clustering in the terminal eight exons suggesting that truncating variants in the
          first five exons might be compensated by an alternative MSL3 transcript.
        supports: SUPPORT
    origin:
