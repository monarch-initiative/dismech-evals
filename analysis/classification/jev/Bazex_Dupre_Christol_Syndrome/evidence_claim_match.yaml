            label: ARHGAP36
        association: Noncoding tandem duplications at Xq26.1 most likely dysregulate ARHGAP36
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Earlier reports proposed ACTRT1 or ACTRT1 enhancer RNA defects, but the larger eight-family
          copy-number study concluded that Xq26.1 intergenic duplications most likely dysregulate ARHGAP36
          and that ACTRT1 loss-of-function is unlikely to be the primary BDCS cause.
      selected_evidence:
        snippet: In eight families with BDCS, we identified overlapping 18-135-kb duplications (six inherited
          and two de novo) at Xq26.1, flanked by ARHGAP36 and IGSF1.
        supports: SUPPORT
