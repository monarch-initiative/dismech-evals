        biological_scale: TISSUE
        description: 'A continuous cartilaginous tube replacing the normal segmented tracheal rings. It
          is reported in BSS and in other FGFR2-related craniosynostosis syndromes, and it is the leading
          candidate explanation for the syndrome''s excess sudden unexplained death. It is almost impossible
          to diagnose without direct visualization of the airway, so it is frequently discovered only
          at autopsy — which means its true frequency in BSS is unknown and is likely underestimated.
          This node records an association with an identified structural lesion and a management consequence,
          not a demonstrated causal chain from the FGFR2 allele: no experiment cited here shows that the
          variant produces the sleeve.

          '
      selected_evidence:
        snippet: One of our patients was noted to have a tracheal cartilaginous sleeve, which if present
          could explain sudden death.
        supports: SUPPORT
