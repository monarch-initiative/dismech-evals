      assertion_type: Genetic
      assertion:
        name: FGFR2 cysteine-creating gain-of-function variants
        gene_term:
          preferred_term: FGFR2
          term:
            id: hgnc:3689
            label: FGFR2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Heterozygous de novo missense variants introducing an unpaired cysteine. The two recurrent
          alleles, p.Tyr375Cys (transmembrane) and p.Ser372Cys (Ig-III/transmembrane linker), account
          for most molecularly confirmed cases; p.Ser372Tyr and p.Phe276Cys have each been reported once.
          A subset of clinically typical patients carry neither recurrent allele.
        variants:
        - name: c.1124A>G (p.Tyr375Cys)
          description: The commonest allele, in the transmembrane domain. Reported repeatedly across independent
            series and populations, and the allele modeled in the Fgfr2 Y394C mouse.
        - name: p.Ser372Cys
          description: The second recurrent allele, at the carboxyl-terminal end of the Ig-III to transmembrane
            linker.
      selected_evidence:
        snippet: We now describe the detection of FGFR2 mutations in the Beare-Stevenson cutis gyrata
          syndrome.
        supports: SUPPORT
