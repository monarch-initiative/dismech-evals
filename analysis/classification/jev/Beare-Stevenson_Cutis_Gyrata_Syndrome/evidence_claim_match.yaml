            term:
              id: MONDO:0007412
              label: Beare-Stevenson cutis gyrata syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ligand-Independent Disulfide-Mediated Receptor Dimerization
        biological_scale: MOLECULAR
        description: 'The mechanistic step that makes BSS a cysteine-allele disorder rather than simply
          another FGFR2 craniosynostosis. A free, unpaired cysteine residue introduced by the variant
          forms an intermolecular disulfide bond between two receptor monomers, locking them into a covalent
          dimer and activating the kinase without any FGF ligand present. This is the same activation
          route used by the extracellular-cysteine alleles of thanatophoric dysplasia type 1 on FGFR3,
          and it is mechanistically distinct from the Ig-II/III linker alleles of Apert and Muenke syndrome,
          which instead increase FGF-ligand affinity and alter specificity while leaving the receptor
          ligand-dependent.

          '
        molecular_functions:
        - preferred_term: protein homodimerization activity
          term:
            id: GO:0042803
            label: protein homodimerization activity
          modifier: INCREASED
      selected_evidence:
        snippet: Many of these mutations create a free cysteine residue that potentially leads to abnormal
          disulfide bond formation and receptor activation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9539778
      reference_title: Activating mutations in the extracellular domain of the fibroblast growth factor
