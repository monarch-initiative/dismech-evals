      assertion_type: Treatment
      assertion:
        name: Midface advancement (Le Fort III distraction)
        action_category: THERAPEUTIC
        therapeutic_modality: SURGERY
        description: 'Halo-type external distraction osteogenesis to advance the severely hypoplastic
          midface, correcting proptosis and occlusion. The first successful Le Fort III distraction in
          BSS was reported in 2026 in a 5-year-old, achieving roughly 25 mm of distraction without major
          complications and sustained improvement at two years. Reported experience with the alternative
          monobloc advancement is more cautionary: in one BSS patient the temporal fossa was too narrow
          for the procedure to work well, and unrecognized micrognathia meant decannulation remained impossible
          despite the advancement. Prior shunt tubing and skull defects constrain the operative approach.

          '
        treatment_term:
          preferred_term: Midface advancement
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        notes: treatment_term is left at the generic Surgical Procedure deliberately. NCIT was searched
          for a midface-advancement, Le Fort or distraction-osteogenesis clinical action and has none;
          NCIT:C51903 Osteotomy names the bone cut but not the staged advancement, and NCIT:C15214 Craniotomy
          is the wrong compartment. Pfeiffer_Syndrome carries NCIT:C15329 for the same procedure, so this
          is also the consistent choice.
        target_phenotypes:
        - preferred_term: Midface retrusion
          term:
            id: HP:0011800
            label: Midface retrusion
        - preferred_term: Proptosis
          term:
            id: HP:0000520
            label: Proptosis
      selected_evidence:
        snippet: Two uneventful years after surgery, the patient showed significant improvements in proptosis,
          occlusion, and facial profile, with an excellent clinical course.
        supports: SUPPORT
