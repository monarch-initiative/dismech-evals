            term:
              id: MONDO:0007412
              label: Beare-Stevenson cutis gyrata syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bss_versus_crouzon_prenatal_discrimination
        prompt: Can Beare-Stevenson syndrome be distinguished from Crouzon syndrome prenatally, given
          that the two overlap in appearance but differ sharply in prognosis?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Premature Cranial Suture Fusion and Cloverleaf Skull
        rationale: This is a diagnostic gap with immediate consequences for counselling and delivery planning.
          Cloverleaf skull identified prenatally in a BSS patient led to an initial concern for Crouzon
          syndrome, and in that case 3D ultrasound was performed but the cutis gyrata — the feature that
          separates the two — was visible only on retrospective review after the postnatal diagnosis.
          Since BSS carries markedly higher mortality than Crouzon syndrome, a prenatal misassignment
          is not a naming error but a prognostic one. The authors' proposed answer is to add molecular
          testing to suspected prenatal Crouzon cases rather than to rely on imaging, but no study has
          tested whether that changes outcomes, and the 2026 prenatal report identified BSS through a
          presentation — hydrops fetalis with increased nuchal translucency — that a craniofacial-led
          pathway would not have been triggered by.
        proposed_experiments:
        - experiment_id: exp_bss_prenatal_fgfr2_panel_yield
          name: Diagnostic yield of FGFR2 testing in prenatally suspected Crouzon syndrome
          description: Apply FGFR2 sequencing to a consecutive series of fetuses with prenatally suspected
            syndromic craniosynostosis and report how often the result reassigns the diagnosis to BSS,
            which is the measurement the recommendation currently lacks.
      selected_evidence:
        snippet: Cloverleaf skull was identified prenatally in one patient, with initial concern for Crouzon
          syndrome.
        supports: SUPPORT
