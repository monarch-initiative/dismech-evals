        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Autosomal dominant. Every molecularly confirmed case reported to date has been sporadic,
          arising as a de novo variant in an unaffected family, and advanced paternal age has been noted
          repeatedly — the pattern expected of a paternal-age-effect FGFR allele, as also seen in Apert
          and Crouzon syndrome. The practical consequence is that recurrence risk for the parents is low,
          while the affected individual''s own transmission risk would be 50%; survival to reproductive
          age is rare enough that this has not been observed.

          '
      selected_evidence:
        snippet: Beare-Stevenson cutis gyrata syndrome (MIM 123790) is an autosomal dominant condition
          characterized by the furrowed skin disorder of cutis gyrata, acanthosis nigricans, craniosynostosis,
          craniofacial dysmorphism, digital anomalies, umbilical and anogenital abnormalities and early
          death.
        supports: SUPPORT
