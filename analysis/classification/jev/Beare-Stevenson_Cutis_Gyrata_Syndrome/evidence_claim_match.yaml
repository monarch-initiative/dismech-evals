        rationale: 'The Fgfr2 p.Tyr394Cys mouse is an unusually faithful model: it carries the murine
          equivalent of the commonest human allele and reproduces both arms of the syndrome, epidermal
          hyperplasia and craniosynostosis. Treating those mice with a p38 kinase inhibitor attenuated
          the skin abnormalities by returning proliferation and differentiation toward normal, which the
          authors advance as a therapeutic direction for BSS and for acanthosis nigricans and craniosynostosis
          generally. Three things stand between that and a human therapy, and they differ in kind rather
          than degree. First, the demonstrated reversal is of skin; craniosynostosis in a human is established
          at birth rather than progressive in the way a mouse suture phenotype is, so the window the mouse
          result occupies may not exist postnatally. Second, systemic p38 inhibition is a broad intervention
          with no defined dose, route or developmental window for a neonate. Third, and most consequential
          for how this entry should be read: the cause of death in BSS is airway and cardiorespiratory,
          and nothing links p38 activity to the tracheal cartilaginous sleeve. A therapy that normalized
          the skin would leave the survival problem untouched. This should not be curated anywhere as
          an emerging BSS treatment.'
        proposed_experiments:
        - experiment_id: exp_bss_p38_airway_phenotype
          name: Airway phenotype of the Fgfr2 Y394C mouse under p38 inhibition
          description: Determine whether the BSS mouse develops a tracheal cartilage abnormality at all,
            and if so whether p38 inhibition alters it. This is the measurement that would tell whether
            the p38 axis touches the arm of the syndrome that kills, or only the arm that is visible.
        - experiment_id: exp_bss_p38_developmental_window
          name: Developmental window for suture rescue
          description: Establish the latest gestational or postnatal point at which p38 inhibition still
            prevents suture fusion in the model, since a window that closes before birth would rule out
            postnatal human treatment regardless of efficacy.
      selected_evidence:
        snippet: Treating Fgfr2+/Y394C mice with a p38 kinase inhibitor attenuated skin abnormalities
          by reversing cell proliferation and differentiation to near normal levels.
        supports: SUPPORT
