        description: 'A de novo heterozygous missense variant in FGFR2 that substitutes a cysteine for
          the wild-type residue. Two recurrent alleles account for nearly all molecularly confirmed cases:
          p.Tyr375Cys in the transmembrane domain and p.Ser372Cys at the carboxyl-terminal end of the
          linker between the third immunoglobulin-like (Ig-III) domain and the transmembrane segment.
          A p.Ser372Tyr variant and, in a 2026 prenatal case, a p.Phe276Cys variant have also been reported,
          and the original series noted two clinically typical patients in whom neither recurrent allele
          was found — so genetic heterogeneity within the clinical syndrome is documented rather than
          excluded.

          '
        gene:
          preferred_term: FGFR2
          description: Fibroblast growth factor receptor 2, constitutively activated by cysteine-creating
            substitutions in Beare-Stevenson cutis gyrata syndrome.
          modifier: GAIN_OF_FUNCTION
          term:
            id: hgnc:3689
            label: FGFR2
        molecular_functions:
        - preferred_term: transmembrane receptor protein tyrosine kinase activity
          term:
            id: GO:0004714
            label: transmembrane receptor protein tyrosine kinase activity
          modifier: INCREASED
      selected_evidence:
        snippet: In two patients, neither of these mutations were found suggesting further genetic heterogeneity.
        supports: SUPPORT
