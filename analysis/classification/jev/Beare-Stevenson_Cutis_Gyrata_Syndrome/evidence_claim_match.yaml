        name: Epidermal Hyperplasia and Cutis Gyrata
        biological_scale: TISSUE
        description: 'The skin arm, and the feature that names the syndrome. Sustained FGFR2-p38 signaling
          in the epidermis produces keratinocyte hyperplasia, expressed clinically as cutis gyrata — thickened
          skin thrown into convoluted, cerebriform folds and furrows — along with acanthosis nigricans
          and skin tags. The distribution is characteristically wide, involving scalp, forehead, face,
          preauricular area, neck, trunk, palms and soles. This node is deliberately not given a module
          `conforms_to` anchor: the FGFR module''s consequence nodes cover growth plate and cranial suture,
          and an epidermal hyperproliferation arm is not among them. Curating it as conforming would assert
          membership in a node that does not describe it.

          '
        cell_types:
        - preferred_term: Keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
