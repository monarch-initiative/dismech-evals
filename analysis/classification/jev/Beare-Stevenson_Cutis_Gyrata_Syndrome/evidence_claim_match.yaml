            term:
              id: MONDO:0007412
              label: Beare-Stevenson cutis gyrata syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bss_tracheal_sleeve_frequency_and_causation
        prompt: How often does a tracheal cartilaginous sleeve actually occur in Beare-Stevenson syndrome,
          and is it caused by the FGFR2 variant or merely co-occurring with it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Tracheal Cartilaginous Sleeve and Airway Compromise
        rationale: 'Both halves of this question are open, and the entry deliberately stops short of answering
          either. On frequency: the sleeve is described as often found only incidentally at autopsy because
          it cannot be diagnosed without direct visualization of the trachea, so every published frequency
          is a lower bound drawn from a case literature of fewer than thirty patients, most of whom died
          before any airway endoscopy would have been considered. On causation: the sleeve is reported
          across FGFR2-related craniosynostosis syndromes, which is consistent with an FGFR2-driven cartilage
          phenotype but equally consistent with shared ascertainment in severely affected, tracheostomized
          infants. No model system in the cited literature reproduces it, and the BSS mouse work characterizes
          skin and calvaria only. This matters practically rather than academically: if the sleeve is
          FGFR2-driven it should be sought in every patient with a cysteine-class allele, whereas if it
          tracks severity it should be sought in every severely affected infant regardless of genotype.
          The surveillance recommendation is the same either way, which is why the entry curates the recommendation
          as established and the mechanism as open.'
        proposed_experiments:
        - experiment_id: exp_bss_prospective_airway_endoscopy
          name: Prospective airway endoscopy in FGFR2 craniosynostosis
          description: Direct airway visualization in every infant with a molecularly confirmed FGFR2
            craniosynostosis syndrome, reported by genotype, to replace an autopsy-ascertained lower bound
            with a real frequency and to test whether cysteine-class alleles carry excess risk.
        - experiment_id: exp_fgfr2_tracheal_cartilage_model
          name: Tracheal cartilage phenotyping in the BSS mouse
          description: Characterize tracheal ring segmentation in the Fgfr2 Y394C mouse, which would establish
            whether the lesion is a direct consequence of the allele.
      selected_evidence:
        snippet: Tracheal cartilaginous sleeves are often only found incidentally at autopsy as they are
          difficult to diagnose without direct visualization of the trachea.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25706251
      evidence_source: HUMAN_CLINICAL
      explanation: The ascertainment problem underlying the frequency half of the gap.
