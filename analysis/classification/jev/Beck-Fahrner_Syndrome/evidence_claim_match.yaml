            term:
              id: MONDO:0032922
              label: Beck-Fahrner syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TET3 Dioxygenase Deficiency
        description: Loss-of-function variation reduces the dosage of TET3, a member of the TET family
          of 5-methylcytosine oxidases. This places Beck-Fahrner syndrome in the eraser class of the epigenetic
          machinery, acting on DNA methylation rather than on histone marks.
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component
          Haploinsufficiency
        molecular_functions:
        - preferred_term: DNA 5-methylcytosine dioxygenase activity (TET3)
          term:
            id: GO:0070579
            label: DNA 5-methylcytosine dioxygenase activity
          modifier: DECREASED
      selected_evidence:
        snippet: the TET (Ten- Eleven Translocation) family of 5-methylcytosine oxidases, which use reduced
          iron, molecular oxygen and the tricarboxylic acid cycle metabolite 2-oxoglutarate (also known
          as a-ketoglutarate) to oxidise the methyl group of 5mC to 5-hydroxymethylcytosine (5hmC) and
          beyond
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31965999
      reference_title: 'TET methylcytosine oxidases: new insights from a decade of research.'
      evidence_source: OTHER
      explanation: Defines the enzymatic activity lost at this node. Source is a review by the laboratory
        that discovered the enzyme family.
