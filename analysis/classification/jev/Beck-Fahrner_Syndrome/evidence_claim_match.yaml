  295a0913ae3d6735b21be4b39cb67b638b76dbe5013c6f5bc07cd2b81f9b39ef:
    claim:
      about:
        disease:
          name: Beck-Fahrner Syndrome
          disease_term:
            preferred_term: Beck-Fahrner syndrome
            term:
              id: MONDO:0032922
              label: Beck-Fahrner syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired 5-Methylcytosine Oxidation and DNA Demethylation
        conforms_to: epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin
          State Imbalance
        description: Reduced TET3 activity impairs oxidation of 5-methylcytosine to 5-hydroxymethylcytosine,
          the committed first step of both replication-dependent and replication-independent DNA demethylation.
          Methylated cytosine that should be cleared at TET3 target loci is retained, shifting the local
          chromatin state toward repression. This is the DNA-methylation counterpart of the histone-mark
          imbalance seen in the writer-class chromatinopathies.
        role: amplifier
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: TET-generated oxidised methylcytosines are intermediates in at least two pathways of
          DNA demethylation, which differ in their dependence on DNA replication.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31965999
      reference_title: 'TET methylcytosine oxidases: new insights from a decade of research.'
      evidence_source: OTHER
      explanation: Establishes that the oxidation step lost upstream is required for DNA demethylation
        by either route, which is what makes reduced TET3 activity a demethylation defect rather than
        only a missing oxidation product.
