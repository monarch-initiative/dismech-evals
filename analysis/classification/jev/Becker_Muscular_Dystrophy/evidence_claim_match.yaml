  97006d5e9c5ce483a8408ca46ff9ee74727ab7b7494d0785729726c8a4fbf732:
    claim:
      about:
        disease:
          name: Becker Muscular Dystrophy
          disease_term:
            preferred_term: Becker muscular dystrophy
            term:
              id: MONDO:0010311
              label: Becker muscular dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Internally Deleted but Semifunctional Dystrophin
        role: central_effector
        biological_scale: MOLECULAR
        description: 'The rate-limiting state of the whole entry, and the single node on which the Becker/Duchenne
          distinction rests. A shorter, lower-molecular-weight dystrophin is produced and it is semifunctional
          - not normal, not absent.

          This is why the disease is a spectrum rather than a category. Duchenne has essentially no functional
          protein and a stereotyped course; Becker has a variable amount of partly working protein, and
          the residual function tracks which internal domains the deletion removed. The entry therefore
          does not curate a single severity, and the natural-history data below are reported as distributions
          rather than as a description of a typical patient.'
        cellular_components:
        - preferred_term: dystrophin-glycoprotein complex at the sarcolemma
          term:
            id: GO:0016010
            label: dystrophin-associated glycoprotein complex
          modifier: DECREASED
      selected_evidence:
        snippet: For cases with a deletion mutation, the "reading frame" hypothesis predicts that BMD
          patients produce a semifunctional, internally deleted dystrophin protein, whereas DMD patients
          produce a severely truncated protein that would be unstable.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
