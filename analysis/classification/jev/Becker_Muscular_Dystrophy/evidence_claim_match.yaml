  f68e732b8393b9e378c4c49e0570f25ba9956eae6e5e1a0da1b1c65406e11671:
    claim:
      about:
        disease:
          name: Becker Muscular Dystrophy
          disease_term:
            preferred_term: Becker muscular dystrophy
            term:
              id: MONDO:0010311
              label: Becker muscular dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Left Ventricular Impairment and Dilated Cardiomyopathy
        role: outcome
        biological_scale: ORGANISM
        conforms_to: cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure
        description: 'Around 30% of patients have left ventricular impairment, an order of magnitude more
          than the 2.7% with respiratory involvement. It is also under genotypic control within the in-frame
          class: del45-55 and del48 are associated with significantly lower odds of a pathological left
          ventricular ejection fraction than del45-47.

          The clinically important consequence is that cardiac surveillance in Becker cannot be triggered
          by skeletal-muscle severity. A patient walking normally at fifty can have a failing ventricle,
          and the deletion that predicts a good ambulatory course is not always the one that predicts
          a good cardiac course.

          It is also what kills. Heart failure from dilated cardiomyopathy is the most common cause of
          death in Becker muscular dystrophy, with a mean age of death in the mid-forties - against a
          median age at loss of ambulation estimated at sixty-nine. Those two numbers together are the
          whole prognostic shape of this disease: most patients are still walking when the heart fails,
