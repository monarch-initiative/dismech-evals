        name: Attenuated Sarcolemmal Fragility in Skeletal Muscle
        role: effector
        biological_scale: CELLULAR
        description: Dystrophin mechanically couples the actin cytoskeleton to the extracellular matrix
          through the sarcolemma; without it, contraction tears the membrane. A semifunctional internally
          deleted dystrophin still performs some of that coupling, so injury per contraction is reduced
          rather than abolished, and muscle is lost slowly instead of rapidly.
        cell_types:
        - preferred_term: skeletal muscle fibre
          term:
            id: CL:0008002
            label: skeletal muscle fiber
      selected_evidence:
        snippet: This gene codes for dystrophin, a protein important for maintaining the stability of
          muscle-fiber membranes.
        supports: SUPPORT
