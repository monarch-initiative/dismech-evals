        role: trigger
        biological_scale: MOLECULAR
        description: 'The defining lesion class. In the largest Becker cohort assembled, 86% of patients
          carried in-frame deletions or duplications of DMD. Deletions clustering around exons 45-55 dominate,
          and the specific deletion carries prognostic information: within the same in-frame class, del45-49
          is associated with earlier loss of ambulation than del45-47, while del45-55, del48 and del48-49
          are associated with later loss of ambulation. So "in-frame" sets the disease and the particular
          exons set the severity.'
