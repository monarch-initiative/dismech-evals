  806e7c3b7caddac2c0ef6299727d78a5a9f4460b6ce11721034971d631f727c1:
    claim:
      about:
        disease:
          name: Becker Muscular Dystrophy
          disease_term:
            preferred_term: Becker muscular dystrophy
            term:
              id: MONDO:0010311
              label: Becker muscular dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Slowly Progressive Proximal Myopathy
        role: outcome
        biological_scale: ORGANISM
        description: 'The skeletal-muscle endpoint, and it is strikingly indolent. In a 943-patient cohort
          followed at 17 centres, only 13.5% had lost ambulation by last assessment, with a Kaplan-Meier
          median age at loss of ambulation estimated at 69 years. Diagnosis is frequently incidental:
          55% were prompted by a chance finding of raised creatine kinase, at a median age of 7.5 years
          - decades before weakness would have brought them in.

          Respiratory involvement is uncommon and mild, but not absent, and its rate changes with ambulatory
          status: forced vital capacity falls about 1% of predicted per year overall, and significantly
          faster after loss of ambulation. That is the argument for following respiratory function in
          the non-ambulant subgroup specifically rather than in everyone equally.'
      selected_evidence:
        snippet: We analysed 190 pulmonary function measurements with a median interval of one year (1-17y)
          and measured a 1.00% decline of Forced Vital Capacity percent predicted (FVC%pred) per year
          (p = 0.004).
        supports: SUPPORT
