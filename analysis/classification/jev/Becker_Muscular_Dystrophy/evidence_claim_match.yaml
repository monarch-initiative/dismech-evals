        disease:
          name: Becker Muscular Dystrophy
          disease_term:
            preferred_term: Becker muscular dystrophy
            term:
              id: MONDO:0010311
              label: Becker muscular dystrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_becker_is_the_target_state_of_dmd_exon_skipping
        kind: INTERPRETATION
        status: OPEN
        prompt: Should Becker muscular dystrophy be curated as the therapeutic target state of exon-skipping
          antisense therapy in Duchenne muscular dystrophy, and does that make it a conformer of the antisense-oligonucleotide
          module?
        attaches_to:
        - pathophysiology#Internally Deleted but Semifunctional Dystrophin
        rationale: 'The reading-frame rule is what makes exon-skipping therapy in Duchenne conceivable
          at all. Skipping an exon adjacent to an out-of-frame deletion restores the frame, and the protein
          it produces is an internally deleted, semifunctional dystrophin - which is to say the Becker
          protein. The therapeutic aim in Duchenne is to convert a Duchenne lesion into a Becker one.

          This entry therefore does *not* declare conformance to `antisense_oligonucleotide_therapy`.
          That module''s nodes are intervention-conditioned: they model an RNA vulnerability, an ASO acting
          on it, and a restored transcript. Becker muscular dystrophy has no such intervention - the in-frame
          transcript is what the patient is born with. Conforming would assert an ASO in the causal path
          of an untreated disease.

          The relationship is real and worth recording, but it runs the other way: this entry describes
          the state that `antisense_oligonucleotide_therapy#Restored Productive Transcript and Protein
          Expression` aims at in Duchenne. Curated as an interpretation so a reader of either entry can
          find the other.'
      selected_evidence:
        snippet: In Becker patients, in-frame mutations allow the synthesis of internally deleted, but
          largely functional dystrophins.
        supports: SUPPORT
