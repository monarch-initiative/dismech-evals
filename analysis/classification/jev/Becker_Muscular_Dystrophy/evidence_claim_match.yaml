  b0aa1ac659fc120e935cf0dfc763104850120423eff703037413514befd61252:
    claim:
      about:
        disease:
          name: Becker Muscular Dystrophy
          disease_term:
            preferred_term: Becker muscular dystrophy
            term:
              id: MONDO:0010311
              label: Becker muscular dystrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_reading_frame_rule_is_statistical
        kind: INTERPRETATION
        status: OPEN
        prompt: How should exceptions to the reading-frame rule be curated, given that a substantial minority
          of clinically definite Becker patients carry out-of-frame mutations?
        attaches_to:
        - pathophysiology#In-Frame DMD Lesion
        rationale: 'The rule is a strong statistical generalisation, not a law, and three independent
          numbers agree on roughly the same figure: 92% concordance across 258 deletions in 1989, 91%
          across more than 4700 database entries in 2006, and 10% out-of-frame plus 4% nonsense mutations
          in a 943-patient Becker cohort in 2025. About one Becker patient in seven has a lesion the rule
          says should have produced Duchenne.

          Recognised escape routes exist - alternative splicing that removes the frameshift, ribosomal
          reinitiation, revertant fibres - but none is evidenced in the references read for this entry,
          so the pathograph models only the in-frame route and this discussion carries the exception explicitly
          rather than the trigger node implying a rule without exceptions.

          There is a selection point in the 1989 data worth preserving: the authors note that many in-frame
          deletions are probably never ascertained, because the people carrying them are asymptomatic
          or have something that looks like neither disease. The observed genotype-phenotype correlation
          is therefore measured on an ascertained population, and the mild tail of Becker is systematically
          under-counted.'
      selected_evidence:
        snippet: The correlation between phenotype and type of deletion mutation is in agreement with
          the "reading frame" theory in 92% of cases and is of diagnostic and prognostic significance.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
