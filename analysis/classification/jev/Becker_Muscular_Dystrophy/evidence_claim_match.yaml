  813f5c01a63abda47b642187cb4b0229718b451dcd3012fe54fed6ce1c9193c1:
    claim:
      about:
        disease:
          name: Becker Muscular Dystrophy
          disease_term:
            preferred_term: Becker muscular dystrophy
            term:
              id: MONDO:0010311
              label: Becker muscular dystrophy
        context: []
      assertion_type: Treatment
      assertion:
        name: ACE Inhibition for Established Cardiomyopathy
        description: 'Angiotensin-converting enzyme inhibitors, with or without beta blockers, are the
          first-line treatment for the dilated cardiomyopathy - which matters because the cardiomyopathy
          is what kills in this disease.

          The Becker-specific point is where the indication stops. In Duchenne, prophylactic ACE inhibition
          is given regardless of ejection fraction; in Becker it is not, because no trial has tested it
          in patients with a normal LVEF. The French guidelines say plainly that there is no indication
          to treat every Becker patient regardless of cardiac phenotype the way one would in Duchenne.
          Treatment is instead triggered by LVEF below 50% or myocardial fibrosis on MRI, and considered
          case by case in that group.

          Reading this as "ACE inhibitors are used in BMD" and stopping there would import a Duchenne
          practice into a disease where it has never been tested.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ACE inhibitor
            term:
              id: NCIT:C247
              label: ACE Inhibitor
      selected_evidence:
        snippet: Thus, there is no indication to use ACE inhibitors for systematic treatment of BMD patients
          regardless of cardiac phenotype, such as in Duchenne MD.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
