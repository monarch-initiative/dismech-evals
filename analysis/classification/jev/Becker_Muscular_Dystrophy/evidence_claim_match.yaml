      - /disease_term
    evidence_metadata:
      reference: PMID:37422773
      reference_title: 'Diagnosis and management of Becker muscular dystrophy: the French guidelines.'
      evidence_source: HUMAN_CLINICAL
      explanation: The boundary of the indication, and the explicit contrast with Duchenne practice. This
        is the most Becker-specific therapeutic statement in the reference set.
