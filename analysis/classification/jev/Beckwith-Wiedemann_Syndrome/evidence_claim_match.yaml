        display_name: Paternal uniparental disomy of chromosome 11p15
        classification: molecular
        subtype_frequency: ~20%
        description: Paternalization of both 11p15 imprinting domains causes IGF2 overexpression with
          reduced expression of H19 and CDKN1C. Usually mosaic, with an intermediate-to-high tumor risk
          (~16%) including both Wilms tumor and hepatoblastoma.
      selected_evidence:
        snippet: Tumor risks were highest in the IC1 (H19/IGF2:IG-DMR) hypermethylation subgroup (28%)
          and pUPD subgroup (16%) and were lower in the KCNQ1OT1:TSS-DMR (IC2) subgroup (2.6%), CDKN1C
          (6.9%) subgroup, and the group in whom no molecular defect was detectable (6.7%).
        supports: SUPPORT
