        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical scoring plus 11p15.5 molecular testing
        description: BWSp uses a consensus clinical scoring system (2 points for cardinal features, 1
          point for suggestive features); a clinical diagnosis is made at >=4 points and molecular testing
          is recommended at >=2 points. First-line molecular testing assesses IC1/IC2 methylation and
          copy number (e.g., MS-MLPA), with UPD assessment and CDKN1C sequencing as indicated. Because
          BWS is frequently mosaic, negative blood testing does not exclude the diagnosis and testing
          of additional tissues may be required.
      selected_evidence:
        snippet: The molecular diagnosis of BWSp can be challenging for several reasons, including the
          range of causative molecular mechanisms which are frequently mosaic.
        supports: SUPPORT
