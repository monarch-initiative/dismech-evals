  7500ff72ccedbed38f2e439c26ea20df8d0d8f379ae0125ef99251229f93b452:
    claim:
      about:
        disease:
          name: Beckwith-Wiedemann Syndrome
          disease_term:
            preferred_term: Beckwith-Wiedemann syndrome
            term:
              id: MONDO:0007534
              label: Beckwith-Wiedemann syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Predominantly sporadic with parent-of-origin mechanisms
        parent_of_origin_effect: 'Because 11p15.5 genes are imprinted, the disease consequence of an alteration
          depends on the parental origin: maternal IC2 loss of methylation, paternal uniparental disomy,
          IC1 gain of methylation, and maternally inherited CDKN1C loss-of-function variants each act
          through parent-of-origin dosage imbalance.'
        description: Most BWS arises sporadically through epimutations or mosaic uniparental disomy. Heritable
          cases occur most often with maternal CDKN1C pathogenic variants and certain 11p15 structural
          rearrangements, so recurrence-risk counseling requires identifying the underlying molecular
          mechanism.
      selected_evidence:
        snippet: The molecular diagnosis of BWSp can be challenging for several reasons, including the
          range of causative molecular mechanisms which are frequently mosaic.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35804856
      reference_title: Molecular Basis of Beckwith-Wiedemann Syndrome Spectrum with Associated Tumors
        and Consequences for Clinical Practice.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the mosaic, molecularly heterogeneous nature of BWS that underlies its largely
        sporadic occurrence.
