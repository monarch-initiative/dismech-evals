        context: []
      assertion_type: Subtype
      assertion:
        name: IC2 LoM
        display_name: IC2 loss of methylation (KCNQ1OT1:TSS-DMR hypomethylation)
        classification: molecular
        subtype_frequency: ~50%
        description: The most common molecular subtype. Loss of methylation at the maternal IC2 (KCNQ1OT1:TSS-DMR)
          permits biallelic KCNQ1OT1 expression and reduced CDKN1C expression. Associated with classic
          BWSp features and the lowest overall tumor risk (~2.6%), with hepatoblastoma being the predominant
          tumor.
      selected_evidence:
        snippet: Tumor risks were highest in the IC1 (H19/IGF2:IG-DMR) hypermethylation subgroup (28%)
          and pUPD subgroup (16%) and were lower in the KCNQ1OT1:TSS-DMR (IC2) subgroup (2.6%), CDKN1C
          (6.9%) subgroup, and the group in whom no molecular defect was detectable (6.7%).
        supports: SUPPORT
