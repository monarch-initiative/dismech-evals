      assertion:
        name: Tumor surveillance (abdominal ultrasound and serum AFP)
        description: For most BWS molecular subtypes, tumor screening consists of abdominal ultrasound
          (liver, adrenal glands, kidneys) every three months until age four years, followed by kidney
          ultrasound every three months from age four to seven years. Serum alpha-fetoprotein (AFP) is
          measured every three months until age four years to screen for hepatoblastoma. The CDKN1C subgroup
          is an exception in updated harmonized recommendations given its lower Wilms tumor/hepatoblastoma
          burden.
        treatment_term:
          preferred_term: surveillance for malignancies
          term:
            id: NCIT:C15406
