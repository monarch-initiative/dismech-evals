      assertion_type: Subtype
      assertion:
        name: CDKN1C
        display_name: Maternal CDKN1C loss-of-function variant
        classification: molecular
        subtype_frequency: ~5-10%
        description: Loss-of-function variants in the maternally expressed cell-cycle inhibitor CDKN1C.
          Because the paternal allele is normally silenced, pathogenicity depends on maternal transmission.
          This subtype is the most common cause of familial BWS and carries a lower Wilms tumor/hepatoblastoma
          burden, with an increased neuroblastoma risk.
      selected_evidence:
        snippet: In the CDKN1C subgroup 2.8% of patients developed neuroblastoma.
        supports: SUPPORT
    origin:
