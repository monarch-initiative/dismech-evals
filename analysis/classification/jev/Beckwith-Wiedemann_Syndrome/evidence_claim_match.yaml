        snippet: For most BWS molecular subtypes, tumor screening consists of abdominal ultrasound with
          views of the liver, adrenal glands, and kidneys every three months until age four years followed
          by kidney ultrasound only every three months from age four to seven years. Serum alpha-fetoprotein
          (AFP) levels are performed every three months until age four years.
