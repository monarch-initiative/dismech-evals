  19f992feafd8366c5da067e99ea24b7236285575f64ee7d04587a4910115a46e:
    claim:
      about:
        disease:
          name: Behr Syndrome
          disease_term:
            preferred_term: Behr syndrome
            term:
              id: MONDO:0008858
              label: Behr syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: OPA1
        notes: Biallelic OPA1 disease involves missense, truncating, canonical splice-site and deep-intronic
          alleles. The recurrent p.Ile437Met/p.Ile382Met substitution is an intragenic modifier in trans
          with a more severe allele; it is not a second-gene modifier. Single-allele expression varies
          between families. Neither penetrance nor the proportion of each variant class can be estimated
          from these small selected series.
        gene_term:
          preferred_term: OPA1
          term:
            id: hgnc:8140
            label: OPA1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        variants:
        - name: c.610+364G>A
          variant_type: single nucleotide variant
          genomic_contexts:
          - intron
          description: Deep-intronic allele on NM_130837.2 in OAK587, in trans with c.1311A>G. Patient
            transcript analysis demonstrated cryptic exon inclusion, premature termination and nonsense-mediated
            decay. The same splice allele alone was associated with milder or clinically unapparent disease.
        - name: c.1311A>G (p.Ile437Met)
          variant_type: single nucleotide variant
          description: NM_130837.2 notation; equivalent to c.1146A>G (p.Ile382Met) on NM_015560.2. Recurrent
            hypomorphic/intralocus modifier in severe compound-heterozygous disease. Clinical expression
            in isolation is variable; a healthy homozygous elderly father was documented. Yeast showed
            a mild functional defect, not a direct measurement of human GTPase catalysis.
        - name: c.1180G>A (p.Ala394Thr)
          variant_type: single nucleotide variant
          description: Homozygous missense variant on NM_130837.2, associated with spastic ataxia and
            neuropathy; optic involvement may be subtle or delayed. Patient fibroblasts and a yeast complementation
            model showed functional abnormalities.
        - name: c.2287del (p.Ser763Valfs*15)
          variant_type: deletion
          description: Maternal NM_130837.2 frameshift in trans with paternal c.1311A>G in the child described
            in both Othman2022 and Jagadish2024. Also reported as c.2122del/p.Ser708Valfs*15 on NM_015560.2.
            Functional protein analysis was not performed for this allele in the case report.
        - name: p.Leu620fs*13 and p.Arg905Gln
          description: Compound-heterozygous paternal frameshift and maternal missense variants, reported
            as c.1857-1858delinsT and c.G2714A in Lee2016. Associated with severe optic atrophy, sensorimotor
            neuropathy and congenital cataract. The missense effect was predicted computationally; the
            report did not demonstrate its biochemical mechanism.
        - name: c.2779-2A>C and c.2809C>T (p.Arg937Cys)
          description: Compound-heterozygous splice-site and missense variants reported in one child with
            Leigh-like imaging; reduced OPA1 muscle protein and altered fibroblast morphology were measured
            at the genotype level.
      selected_evidence:
        snippet: we identified the homozygous c.1180G>A/p.Ala394Thr mutation in Pt1 and the c.2779-2A>C
          mutation in compound heterozygosity with the c.2809C>T/p.Arg937Cys mutation in Pt2.
        supports: SUPPORT
        directness: DIRECT
