        prompt: Does SARM1-dependent axon death drive retinal ganglion cell degeneration in human biallelic-OPA1
          Behr syndrome, as it does in the Opa1 mouse model — and would SARM1 inhibition be neuroprotective
          in patients?
        rationale: The SARM1 rescue is demonstrated only in a mouse model of dominant (monoallelic) OPA1
          optic atrophy. Its relevance to human recessive/biallelic OPA1 Behr syndrome — a more severe,
          multisystem, developmental disease — is unproven, so the model result cannot yet be assumed
          to translate.
        proposed_experiments:
        - experiment_id: exp_sarm1_human_biallelic_opa1
          name: Test SARM1-dependent axon death in human biallelic-OPA1 models
          description: Assess SARM1-pathway activation in patient-derived (biallelic-OPA1) neurons/iPSC-derived
            retinal ganglion cells, test whether SARM1 inhibition is neuroprotective in those models,
            and evaluate SARM1 axon-death biomarkers in patient samples.
      selected_evidence:
