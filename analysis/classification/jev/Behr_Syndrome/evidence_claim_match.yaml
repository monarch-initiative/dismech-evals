        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic OPA1 Loss of Function
        biological_scale: MOLECULAR
        description: 'OPA1 encodes a dynamin-related GTPase imported into mitochondria and located to
          the inner membrane and intermembrane space. In the recessive, syndromic Behr form, patients
          carry biallelic OPA1 variants — typically a dominant-optic-atrophy allele in trans with a second,
          hypomorphic/missense allele — reducing OPA1 function below the threshold tolerated in the dominant
          disease and producing a severe multisystem phenotype.

          '
        gene:
          preferred_term: OPA1
          term:
            id: hgnc:8140
            label: OPA1
        molecular_functions:
        - preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Recently, some cases were reported to be caused by biallelic mutations in OPA1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
