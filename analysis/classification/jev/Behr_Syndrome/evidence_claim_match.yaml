      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial DNA Instability and Multiple mtDNA Deletions
        biological_scale: MOLECULAR
        description: 'Impaired OPA1-dependent fusion destabilizes the mitochondrial genome, producing
          accumulation of multiple mtDNA deletions, particularly in post-mitotic tissues such as skeletal
          muscle.

          '
        biological_processes:
        - preferred_term: Mitochondrial DNA maintenance
          term:
            id: GO:0032042
            label: mitochondrial DNA metabolic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: "we \ndemonstrate that these patients all harboured multiple deletions of \nmitochondrial\
          \ DNA (mtDNA) in their skeletal muscle, thus revealing an \nunrecognized role of the OPA1 protein\
          \ in mtDNA stability."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18158317
      reference_title: OPA1 mutations induce mitochondrial DNA instability and optic atrophy 'plus' phenotypes.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Directly documents multiple mtDNA deletions and establishes OPA1''s role in mitochondrial
        genome stability. Provenance caveat: this cohort carried heterozygous dominant-negative OPA1 alleles
        (DOA-plus) rather than the biallelic Behr genotype, so the claim is scoped to OPA1 gene function,
        which is shared across the allelic spectrum.

        '
