      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sarm1_axon_death
        hypothesis_label: SARM1-dependent axon death executes retinal ganglion cell degeneration downstream
          of the OPA1 mitochondrial defect
        status: EMERGING
        description: Sarm1 loss protects RGC bodies, optic-nerve axons and visual electrophysiology in
          heterozygous Opa1R290Q/+ mice without correcting fragmentation. The study found little change
          in respiration or mtDNA copy number, and proposed oxidative-stress signaling upstream of SARM1
          without proving the intermediate route. Extrapolation to human biallelic OPA1 disease remains
          untested; the result does not establish ATP depletion as the trigger.
      selected_evidence:
        snippet: Sarm1 KO nearly completely suppressed all the degeneration phenotypes without reversing
          mitochondrial fragmentation.
        supports: SUPPORT
        directness: INDIRECT
