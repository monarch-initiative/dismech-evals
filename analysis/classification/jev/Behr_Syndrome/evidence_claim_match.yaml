        name: Patient Fibroblasts With Biallelic OPA1 Variants
        experimental_model_type: PRIMARY_CELL_CULTURE
        organism:
          preferred_term: Homo sapiens
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        description: Patient fibroblasts support allele-specific RNA/protein studies, network imaging
          and bioenergetics. Deep-intronic-family cells demonstrated transcript decay and fragmentation;
          Ala394Thr cells showed stress-dependent ATP loss. Skin fibroblasts do not establish selective
          neuronal vulnerability.
        modeled_mechanisms:
        - target: Mitochondrial Network Fragmentation
          relationship: RECAPITULATES
          limitations: Skin fibroblasts from selected genotypes do not reproduce neuronal selectivity.
        - target: Oxidative Phosphorylation Deficiency
          relationship: MEASURES
          limitations: ATP content is culture-condition-dependent and one genotype is not representative
            of the entire disease.
      selected_evidence:
        snippet: To suppress nonsense-mediated messenger RNA decay-dependent allelic decay we used puromycin
          treatment in patient derived fibroblasts. After this treatment, allelic balance on RNA level
          could be nearly restored back to normal, as proven by pyrosequencing.
        supports: SUPPORT
        directness: DIRECT
