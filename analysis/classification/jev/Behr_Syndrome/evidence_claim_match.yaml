      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sarm1_axon_death
        hypothesis_label: SARM1-dependent axon death executes retinal ganglion cell degeneration downstream
          of the OPA1 mitochondrial defect
        status: EMERGING
        description: 'In an OPA1 mouse model of dominant optic atrophy, SARM1 (a central executioner of
          programmed axon degeneration) is activated downstream of the mitochondrial defect and drives
          retinal ganglion cell/axon loss; SARM1 knockout nearly completely suppresses degeneration without
          correcting mitochondrial fragmentation. This nominates SARM1 inhibition as a candidate neuroprotective
          strategy for OPA1-related disease. The evidence is model-organism (mouse ADOA); translational
          validity to human biallelic-OPA1 Behr syndrome is not yet established.

          '
      selected_evidence:
        snippet: SARM1 was activated downstream of mitochondrial dysfunction in ADOA
        supports: SUPPORT
