  3d9044cf0fb5e41209722da97dca03e554fd377a6d9c70e9948ded3654e6d4f0:
    claim:
      about:
        disease:
          name: Bejel
          disease_term:
            term:
              id: MONDO:0001714
              label: bejel
            preferred_term: Bejel
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Treponemal Peptidoglycan Cross-Linking (Beta-Lactam Target)
        description: 'Treponema pallidum subsp. endemicum maintains its peptidoglycan cell wall by penicillin-binding
          protein (PBP) transpeptidase cross-linking. This essential, bacteria-specific reaction is the
          target of the penicillin used to treat bejel: beta-lactam acylation of the PBP active site halts
          cross-linking and is treponemicidal, which is why penicillin remains curative with no documented
          penicillin resistance in the endemic treponematoses.'
        role: therapeutic_vulnerability
        conforms_to: bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding
          Proteins
        biological_processes:
        - preferred_term: Peptidoglycan-Based Cell Wall Biogenesis
          term:
            id: GO:0009273
