      assertion_type: Definition
      assertion:
        name: Self-limited familial infantile epilepsy clinical definition
        definition_type: CASE_DEFINITION
        scope: Infants and families with a self-limited focal epilepsy beginning after the neonatal period
        description: A clinical syndrome of unprovoked focal seizures or focal-to-bilateral tonic-clonic
          seizures beginning in infancy, commonly in clusters, in a usually normally developing child
          with a compatible autosomal dominant family history and remission in early childhood. Molecular
          confirmation refines the subtype but is not required to recognize the electroclinical syndrome.
      selected_evidence:
        snippet: Self-limited (familial) infantile epilepsy (S(F)IE), formerly known as benign (familial)
          infantile convulsions (B(F)IC), is an infantile cluster epilepsy with in rule a complete recovery.
        supports: SUPPORT
