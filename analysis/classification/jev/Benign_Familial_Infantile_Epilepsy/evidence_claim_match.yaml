        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bfie_spontaneous_remission_developmental_window
        prompt: Why do PRRT2-related infantile seizures remit spontaneously by the second year while the
          same haploinsufficient allele can produce persistent paroxysmal kinesigenic dyskinesia later
          in the same individuals?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
        rationale: The self-limiting course of the seizure phenotype is a defining and clinically reassuring
          feature of BFIE, yet its mechanistic basis is unexplained. Because PRRT2 haploinsufficiency
          persists lifelong, remission implies a developmental-window process (maturation of inhibitory
          circuits, compensatory presynaptic release proteins, or age-dependent PRRT2 requirement) that
          resolves cortical hyperexcitability without correcting the genetic lesion, in contrast to the
          later-emerging and persistent movement disorder in the same carriers.
        proposed_experiments:
        - experiment_id: exp_bfie_developmental_excitability_timecourse
          name: BFIE developmental excitability time-course experiment
          description: In a PRRT2-haploinsufficient model, quantify cortical network excitability, inhibitory-circuit
            maturation, and expression of candidate compensatory presynaptic release proteins across the
            infantile seizure-prone window and after the expected remission age to test whether remission
            tracks with maturation-driven normalization of synchronous release rather than with any change
            in PRRT2 dosage.
          experiment_type:
            preferred_term: longitudinal developmental profiling experiment
          perturbations:
          - name: PRRT2 haploinsufficiency
            target: pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
            genes:
            - preferred_term: PRRT2
              term:
                id: hgnc:30500
                label: PRRT2
            description: PRRT2 loss-of-function background profiled longitudinally against wild-type controls.
          readouts:
          - name: Excitability normalization over development
            target: pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
            biological_processes:
            - preferred_term: synaptic vesicle exocytosis
              term:
                id: GO:0016079
                label: synaptic vesicle exocytosis
              modifier: DECREASED
            - preferred_term: trans-synaptic signaling
              term:
                id: GO:0099537
                label: trans-synaptic signaling
              modifier: DYSREGULATED
            assays:
            - preferred_term: multielectrode array recording
            direction: NEGATIVE
          controls:
          - name: Wild-type developmental controls
            description: Matched wild-type samples profiled at the same ages.
          decision_criterion: A developmental-window model of remission is supported if network hyperexcitability
            and synchronous-release deficits normalize by the post-remission age despite unchanged PRRT2
            dosage.
          would_support:
          - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
      selected_evidence:
        snippet: Benign familial infantile epilepsy (BFIE) is a self-limited seizure disorder that occurs
          in infancy and has autosomal-dominant inheritance.
        supports: SUPPORT
