  e69e8af2dfa8743f8e76ca9a62799d717aef02d5f9c4612868e6dd4b312c662a:
    claim:
      about:
        disease:
          name: Benign Familial Infantile Epilepsy
          disease_term:
            preferred_term: benign familial infantile epilepsy
            term:
              id: MONDO:0017615
              label: benign familial infantile epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bfie_synaptic_vs_channel_convergence
        prompt: Do the presynaptic-release route (PRRT2), the voltage-gated sodium-channel routes (SCN2A
          and SCN8A), and the unresolved ANKH route to self-limited familial infantile epilepsy converge
          on a single infantile hyperexcitability mechanism, or represent distinct pathways with a common
          clinical endpoint?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
        - pathophysiology#SCN2A Nav1.2 Variant-Specific Excitability
        - pathophysiology#SCN8A Nav1.6 Familial Epilepsy Association
        - pathophysiology#ANKH Start-Region Variant With Unresolved Epilepsy Mechanism
        rationale: BFIE is genetically heterogeneous, arising from a presynaptic release-machinery protein
          (PRRT2) and from ion-channel subunits (SCN2A, SCN8A), with a rare ANKH association whose neuronal
          mechanism remains unknown. Whether these lesions converge on a common infantile cortical hyperexcitability
          node, or produce the same self-limited phenotype by parallel routes, is unresolved and bears
          on whether the syndrome should be modeled as one mechanism with substitutable drivers or several
          convergent mechanisms.
        proposed_experiments:
        - experiment_id: exp_bfie_multigene_convergence_screen
          name: BFIE multi-gene convergence electrophysiology screen
          description: In a shared infantile cortical-network assay, compare PRRT2 loss, familial SCN2A
