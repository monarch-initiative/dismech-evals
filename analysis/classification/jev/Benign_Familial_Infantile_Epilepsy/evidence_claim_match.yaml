      assertion_type: Discussion
      assertion:
        discussion_id: gap_prrt2_pleiotropy_phenotype_determinant
        prompt: What determines whether a single PRRT2 loss-of-function allele (classically c.649dupC)
          manifests as infantile epilepsy (BFIE), later paroxysmal kinesigenic dyskinesia (PKD), the combined
          ICCA phenotype, or hemiplegic migraine, sometimes varying even among carriers within one family?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Pleiotropic PRRT2 Effects Across Cortex and Basal Ganglia
        - pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
        rationale: The same recurrent truncating PRRT2 allele predicted to cause haploinsufficiency produces
          phenotypes that differ in age of expression (infancy versus later childhood) and anatomical
          substrate (cortex versus basal ganglia). Because the primary lesion is shared, the factors selecting
          among BFIE, PKD, ICCA, and migraine (genetic modifiers, developmental timing of PRRT2-dependent
          release in different circuits, environmental triggers) remain a genuine mechanistic gap that
          curation cannot resolve from the single-gene defect alone.
        proposed_experiments:
        - experiment_id: exp_prrt2_knockin_allelic_circuit_timing
          name: PRRT2 knock-in allelic-series circuit-timing experiment
          description: Introduce the recurrent c.649dupC and other truncating PRRT2 alleles on defined
            genetic backgrounds and profile, across postnatal development, calcium-dependent synchronous
            release and network excitability separately in cortical and striatal circuits to test whether
            region-specific and age-specific release deficits predict the cortical-seizure versus basal-ganglia-dyskinesia
            phenotype.
          experiment_type:
            preferred_term: developmental circuit electrophysiology experiment
          perturbations:
          - name: PRRT2 truncating allele knock-in
            target: pathophysiology#PRRT2 Loss-of-Function and Impaired Synaptic Vesicle Release
            genes:
            - preferred_term: PRRT2
              term:
                id: hgnc:30500
                label: PRRT2
            description: Knock-in of c.649dupC and additional truncating alleles compared against matched
              wild-type controls.
          readouts:
          - name: Region-specific synchronous release and excitability
            target: pathophysiology#Pleiotropic PRRT2 Effects Across Cortex and Basal Ganglia
            biological_processes:
            - preferred_term: neurotransmitter secretion
              term:
                id: GO:0007269
                label: neurotransmitter secretion
              modifier: DECREASED
            - preferred_term: synaptic vesicle exocytosis
              term:
                id: GO:0016079
                label: synaptic vesicle exocytosis
              modifier: DECREASED
            assays:
            - preferred_term: multielectrode array recording
            - preferred_term: patch-clamp electrophysiology
            direction: NEGATIVE
          controls:
          - name: Wild-type littermates
            description: Matched wild-type animals profiled at the same developmental ages.
          decision_criterion: A circuit-timing model of pleiotropy is supported if release and excitability
            deficits are cortex-predominant during infancy and shift toward the basal ganglia at ages
            matching PKD onset.
          would_support:
          - pathophysiology#Pleiotropic PRRT2 Effects Across Cortex and Basal Ganglia
      selected_evidence:
        snippet: PRRT2 mutations elicit pleiotropy in terms of both age of expression (infancy versus
          later childhood) and anatomical substrate (cortex versus basal ganglia).
        supports: SUPPORT
