      assertion:
        discussion_id: gap_bfns_mouse_model_self_limiting_fidelity
        prompt: Why do earlier homozygous Kcnq2/Kcnq3 knock-in models show seizures persisting into adulthood
          while a newer Kcnq2-SeLNE model shows timely excitability recovery, and which allele, dosage,
          and developmental context best models the self-limited human course?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Kv7.2/Kv7.3 M-Channel Dysfunction
        - pathophysiology#Loss of M-Current Control of Neuronal Excitability
        - pathophysiology#Neonatal Neuronal Hyperexcitability
        rationale: Earlier knock-in mice carrying human BFNC variants reproduce reduced M-current and
          lower seizure thresholds, but homozygous animals have recurrent seizures into adulthood. A newer
          phenotypic Kcnq2-SeLNE model instead shows timely recovery of neuronal excitability. This discrepancy
          may reflect allele, zygosity, background, brain region, or outcome definition and prevents treating
          either mouse time course as a direct surrogate for human remission.
        proposed_experiments:
        - experiment_id: exp_bfns_human_ipsc_remission_readout
          name: Human iPSC cortical-organoid remission-window experiment
          description: Generate patient-derived and isogenic-corrected human cortical organoids carrying
            benign-familial-neonatal-seizure KCNQ2/KCNQ3 variants and track M-current, network excitability,
            and its maturational normalization over extended culture, comparing the trajectory against
            the persistent-seizure mouse phenotype.
          experiment_type:
            preferred_term: isogenic cortical organoid network-maturation experiment
          model_systems:
          - name: BFNS human iPSC-derived cortical organoid
            description: Human cortical organoid carrying benign-familial-neonatal-seizure KCNQ2/KCNQ3
              variants, used for M-current and network-maturation readouts.
