  b621a5c7ca9e915b9e375f283465044c1d4882e024a1fd93c6562aa8070ce366:
    claim:
      about:
        disease:
          name: Benign Neonatal Seizures
          disease_term:
            preferred_term: benign neonatal seizures
            term:
              id: MONDO:0016027
              label: benign neonatal seizures
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bfns_self_limiting_developmental_basis
        prompt: What developmental changes drive the spontaneous remission of benign familial neonatal
          seizures within the first months of life, given that the mutant KCNQ2/KCNQ3 channel continues
          to be expressed throughout adulthood?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Neonatal Neuronal Hyperexcitability
        rationale: Seizures remit despite lifelong expression of the causal variant, so remission cannot
          be explained by loss of the mutant channel. A 2026 paired mouse-model study found timely excitability
          recovery and activation of neurodevelopmental signaling in the SeLNE model, whereas recovery
          was delayed in the DEE model. The responsible cell programs and their fidelity to human remission
          remain unresolved, as do the possible contributions of compensatory potassium conductances,
          chloride homeostasis, and inhibitory circuit maturation.
        proposed_experiments:
        - experiment_id: exp_bfns_developmental_timecourse
          name: Developmental time-course of excitability and chloride homeostasis
          description: In patient-derived iPSC cortical neurons and in Kcnq2/Kcnq3 knock-in mice, map
            M-current density, KCC2 expression, GABA reversal potential, and network excitability across
            the equivalent postnatal maturation window to identify which change coincides with seizure
            remission.
          experiment_type:
            preferred_term: developmental time-course electrophysiology experiment
          readouts:
          - name: Maturation of excitability and inhibition
            target: pathophysiology#Neonatal Neuronal Hyperexcitability
            biological_processes:
            - preferred_term: membrane repolarization
              term:
                id: GO:0086009
                label: membrane repolarization
              modifier: DECREASED
            - preferred_term: trans-synaptic signaling
              term:
                id: GO:0099537
                label: trans-synaptic signaling
              modifier: DYSREGULATED
            assays:
            - preferred_term: patch-clamp electrophysiology assay
            - preferred_term: multielectrode array recording
            direction: POSITIVE
          controls:
          - name: Isogenic corrected neurons
            description: Neurons in which the KCNQ2/KCNQ3 variant is corrected.
          - name: Wild-type littermate mice
            description: Age-matched wild-type mice for the developmental time-course.
          decision_criterion: A developmental driver of remission is supported if a specific maturational
            change (compensatory K+ conductance, KCC2/chloride switch, or inhibitory maturation) reproducibly
            coincides with the normalization of network excitability despite continued mutant-channel
            expression.
          would_support:
          - pathophysiology#Neonatal Neuronal Hyperexcitability
      selected_evidence:
        snippet: exhibits the remarkable feature of clinical remission within a few weeks of onset and
          a favourable prognosis, sparing cognitive abilities despite persistent expression of the mutant
          KCNQ2 or KCNQ3 potassium channels throughout adulthood.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18483067
      reference_title: Mouse models of human KCNQ2 and KCNQ3 mutations for benign familial neonatal convulsions
        show seizures and neuronal plasticity without synaptic reorganization.
      evidence_source: MODEL_ORGANISM
      explanation: 'Singh et al. frame the paradox directly: remission occurs despite persistent expression
        of the mutant channel, motivating a developmental rather than channel-loss explanation.'
