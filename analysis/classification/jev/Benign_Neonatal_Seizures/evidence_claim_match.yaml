      assertion_type: Definition
      assertion:
        name: Clinical boundary of self-limited familial neonatal epilepsy
        definition_type: CASE_DEFINITION
        description: Focal motor seizures begin after a seizure-free interval, typically at age two to
          eight days in an otherwise healthy term infant, and remit by six to 12 months with generally
          normal development. Tonic limb stiffening, migration during an event, apnea, and cyanosis are
          characteristic semiologies. Acute symptomatic neonatal seizures and KCNQ2-DEE must be excluded
          before assigning the self-limited syndrome.
        scope: Applies to the neonatal-onset self-limited syndrome, whether familial or de novo. Infantile-onset
          self-limited epilepsy and neonatal-onset developmental and epileptic encephalopathy are separate
          disease boundaries.
      selected_evidence:
        snippet: KCNQ2-SLFNE is characterized by seizures that start in otherwise healthy infants between
          two and eight days after term birth and spontaneously disappear between the first and the sixth
          to 12th month of life.
        supports: SUPPORT
    origin:
