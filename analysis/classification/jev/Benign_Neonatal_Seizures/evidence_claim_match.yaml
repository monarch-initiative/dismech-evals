              term:
                id: CL:0000540
                label: neuron
            - preferred_term: neural progenitor cell
              term:
                id: CL:0011020
                label: neural progenitor cell
            conditions:
            - benign familial neonatal seizures
            - neonatal neuronal hyperexcitability
            cell_source: Patient-derived or CRISPR-engineered human induced pluripotent stem cells
            culture_system: Three-dimensional cortical organoid with longitudinal network-activity assays
          perturbations:
          - name: KCNQ2/KCNQ3 variant correction or knock-in
            target: pathophysiology#Kv7.2/Kv7.3 M-Channel Dysfunction
            genes:
            - preferred_term: KCNQ2
              term:
                id: hgnc:6296
                label: KCNQ2
            - preferred_term: KCNQ3
              term:
                id: hgnc:6297
                label: KCNQ3
            description: Correct or introduce benign-familial-neonatal-seizure variants in an isogenic
              human iPSC background to compare M-current and network maturation.
          readouts:
          - name: M-current and network-maturation trajectory
            target: pathophysiology#Neonatal Neuronal Hyperexcitability
            biological_processes:
            - preferred_term: membrane repolarization
              term:
                id: GO:0086009
                label: membrane repolarization
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology assay
            - preferred_term: multielectrode array recording
            direction: POSITIVE
          controls:
          - name: Isogenic corrected organoids
            description: Matched organoids in which the variant is corrected.
          - name: Persistent-seizure mouse comparison
            description: Kcnq2/Kcnq3 knock-in mouse phenotype as the divergent model reference.
          decision_criterion: Human fidelity of the self-limiting course is supported if human organoid
            network hyperexcitability normalizes over maturation despite persistent mutant-channel expression,
            diverging from the persistent-seizure mouse trajectory.
          would_support:
          - pathophysiology#Kv7.2/Kv7.3 M-Channel Dysfunction
          - pathophysiology#Loss of M-Current Control of Neuronal Excitability
          - pathophysiology#Neonatal Neuronal Hyperexcitability
      selected_evidence:
        snippet: Both Kcnq2(A306T/A306T) and Kcnq3(G311V/G311V) homozygous mutant mice exhibited early
          onset spontaneous generalized tonic-clonic seizures concurrent with a significant reduction
          in amplitude and increased deactivation kinetics of the neuronal M-current.
        supports: SUPPORT
