    claim:
      about:
        disease:
          name: Benign Neonatal Seizures
          disease_term:
            preferred_term: benign neonatal seizures
            term:
              id: MONDO:0016027
              label: benign neonatal seizures
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bfns_variant_class_severity_determinants
        prompt: Which molecular properties of a KCNQ2 or KCNQ3 variant (mild haploinsufficiency versus
          dominant-negative strong loss-of-function versus gain-of-function) determine whether it produces
          self-limiting benign familial neonatal seizures rather than the severe KCNQ2 developmental and
          epileptic encephalopathy, and can M-current openers be matched to variant class?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#KCNQ2 Pathogenic Variant
        - pathophysiology#KCNQ3 Pathogenic Variant
        - pathophysiology#Kv7.2/Kv7.3 M-Channel Dysfunction
        rationale: The same gene produces strikingly different severity. Recent cohorts associate single-allele
          truncating/NMD and nontransmembrane variants with SeL(F)NE, and transmembrane or pore-region
          missense variants with DEE, but the evidence is retrospective and not deterministic for an individual
          variant. Functional mechanism, allelic context, and KCNQ3-specific evidence remain incomplete.
          This gap has therapeutic stakes because M-current openers and sodium-channel blockers may behave
          differently across loss-of-function, dominant-negative, and gain-of-function variants.
        proposed_experiments:
        - experiment_id: exp_bfns_variant_class_functional_panel
          name: KCNQ2/KCNQ3 variant-class functional and pharmacology panel
          description: Express matched benign-familial-neonatal-seizure and developmental and epileptic
            encephalopathy variants of KCNQ2 and KCNQ3 in a shared heterologous background, with and without
            co-expressed wild-type subunit, and measure M-current density, activation and deactivation
            kinetics, dominant-negative suppression, and pharmacological rescue by retigabine.
          experiment_type:
            preferred_term: heterologous channel electrophysiology and pharmacology experiment
          perturbations:
          - name: KCNQ2/KCNQ3 variant expression
            target: pathophysiology#Kv7.2/Kv7.3 M-Channel Dysfunction
            genes:
            - preferred_term: KCNQ2
              term:
                id: hgnc:6296
                label: KCNQ2
            - preferred_term: KCNQ3
              term:
                id: hgnc:6297
                label: KCNQ3
            description: Introduce individual benign and encephalopathy-associated variants, alone and
              co-expressed with wild-type subunit, to quantify variant-class effects on channel function.
          readouts:
          - name: M-current density and pharmacological rescue
            target: pathophysiology#Loss of M-Current Control of Neuronal Excitability
            biological_processes:
            - preferred_term: membrane repolarization
              term:
                id: GO:0086009
                label: membrane repolarization
              modifier: DECREASED
            assays:
            - preferred_term: patch-clamp electrophysiology assay
            direction: POSITIVE
          controls:
          - name: Wild-type channel
            description: Wild-type KCNQ2/KCNQ3 heteromeric channels.
          - name: Benign versus encephalopathy variant comparison
            description: Matched benign and encephalopathy variants assayed in the same background.
