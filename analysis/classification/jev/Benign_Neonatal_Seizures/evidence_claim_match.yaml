        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: KCNQ2 developmental and epileptic encephalopathy
        description: KCNQ2-DEE can begin in the same first postnatal week and share focal tonic seizures,
          but it represents the severe end of the KCNQ2 spectrum rather than the self-limited syndrome.
        disease_term:
          preferred_term: KCNQ2 developmental and epileptic encephalopathy
          term:
            id: MONDO:0013387
            label: developmental and epileptic encephalopathy, 7
        distinguishing_features:
        - Multiple daily or drug-resistant neonatal seizures
        - Burst-suppression, profound discontinuity, or multifocal epileptiform EEG background
        - Abnormal neurologic examination and moderate-to-profound developmental impairment
        - Transmembrane or pore-region missense variants are enriched but do not determine outcome alone
      selected_evidence:
        snippet: At onset, EEG shows a burst-suppression pattern or multifocal epileptiform activity;
          early brain MRI can show basal ganglia hyperdensities and later MRIs may show white matter or
          general volume loss. Moderate-to-profound developmental impairment is present.
        supports: SUPPORT
