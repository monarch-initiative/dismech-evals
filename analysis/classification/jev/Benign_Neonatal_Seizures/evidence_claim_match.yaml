      assertion_type: Definition
      assertion:
        name: Molecular confirmation of KCNQ2-related self-limited familial neonatal epilepsy
        definition_type: DIAGNOSTIC_CRITERIA
        description: In a proband with the compatible self-limited neonatal phenotype, a heterozygous
          pathogenic KCNQ2 variant establishes a KCNQ2-related diagnosis. KCNQ3 is an independently established
          but less common cause; variant interpretation must incorporate phenotype and segregation rather
          than assume that every KCNQ2 or KCNQ3 variant predicts a benign course.
        scope: The quoted diagnostic statement is specific to KCNQ2-related disease. KCNQ3-related cases
          require the same phenotype-first distinction from other neonatal epilepsies.
      selected_evidence:
        snippet: The diagnosis of a KCNQ2-related disorder is established in a proband with suggestive
          findings and a heterozygous pathogenic variant in KCNQ2 identified by molecular genetic testing.
        supports: SUPPORT
