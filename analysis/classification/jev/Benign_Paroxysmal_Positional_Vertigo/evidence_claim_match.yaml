          preferred_term: PCDHGA10
          term:
            id: hgnc:8697
            label: PCDHGA10
        association: Candidate susceptibility in familial recurrent BPPV; not established as a necessary
          or sufficient cause.
        relationship_type: SUSCEPTIBILITY
        features: rs113784532 is an insertion predicted to truncate a short PCDHGA10 isoform; it is not
          a demonstrated loss of all PCDHGA10 isoforms. The reported earlier-onset trend had P = 0.054;
          it is not a confirmed onset modifier. The family-ascertained penetrance estimate should not
          be generalized to unselected carriers.
