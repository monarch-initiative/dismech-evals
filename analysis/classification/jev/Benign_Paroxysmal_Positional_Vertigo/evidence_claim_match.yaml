      assertion_type: Inheritance
      assertion:
        name: Multifactorial with familial aggregation
        description: Familial aggregation occurs in a subset of BPPV. A case-control survey found that
          BPPV patients were five times as likely as dizzy controls to report relatives with BPPV; it
          did not distinguish inherited from shared environmental effects. Family sequencing and common-variant
          association studies have identified candidate susceptibility alleles, but these findings do
          not define a single Mendelian inheritance pattern or a routine diagnostic genetic test for typical
          BPPV.
      selected_evidence:
        snippet: Patients in our group with BPPV were 5 times as likely to have relatives with BPPV compared
          to the dizzy control group (chi2=5.95, DF=1, p=0.015).
        supports: SUPPORT
        directness: DIRECT
