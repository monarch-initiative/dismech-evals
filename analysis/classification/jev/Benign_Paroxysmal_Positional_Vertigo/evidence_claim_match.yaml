      assertion_type: Pathophysiology
      assertion:
        name: Vestibulo-Ocular Reflex Driven Positional Nystagmus
        description: The vestibulo-ocular reflex is intact and behaving correctly; it is simply being
          fed a false input. Because each canal is yoked to a specific pair of extraocular muscles, the
          plane of the nystagmus identifies which canal holds the debris. Posterior canal stimulation
          activates the ipsilateral inferior oblique and contralateral superior rectus, producing torsional
          upbeating nystagmus; the horizontal canal produces horizontal nystagmus; the anterior canal
          adds a down-beating component. Nystagmus reverses when the head is returned upright, because
          the particle moves back down the canal.
        role: consequence
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Activation of the ipsilateral inferior oblique and contralateral superior rectus during
          the Dix‐Hallpike leads to a torsional nystagmus (the top pole of the eye beats towards the lowermost
          ear) along with an up‐beating component.
        supports: SUPPORT
        directness: DIRECT
