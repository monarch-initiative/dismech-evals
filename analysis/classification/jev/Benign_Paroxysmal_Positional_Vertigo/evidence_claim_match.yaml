            term:
              id: MONDO:8000018
              label: benign paroxysmal positional vertigo
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Canalithiasis
        description: Free-floating particles within the canal lumen are pulled through the endolymph by
          gravity when the head changes position. Acting as a plunger, they drag endolymph and displace
          the cupula in the same direction. Because the particles must first overcome inertia and then
          settle, the resulting signal has a latency of a few seconds, builds and decays, lasts under
          a minute, and fatigues on repeated testing as the particles disperse. This is the predominant
          subtype.
        role: mechanism
        biological_scale: TISSUE
      selected_evidence:
        snippet: With repeated testing, the nystagmus should fatigue due to the dispersion of the canaliths
          which reduces their mass effect.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30828628
      reference_title: Benign paroxysmal positional vertigo.
      evidence_source: HUMAN_CLINICAL
      explanation: Fatigability is a prediction that follows specifically from a free particle mass, so
        it discriminates this node from cupulolithiasis.
