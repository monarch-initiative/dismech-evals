      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Cupular Deflection and False Angular Velocity Signal
        description: However it is produced, cupular deflection is the physiological common path. Deflection
          bends the stereocilia of the vestibular hair cells embedded in the crista, modulating their
          transduction current and hence the firing rate of the primary vestibular afferents. The canal
          therefore reports an angular velocity that the head is not undergoing. This is the point at
          which a mechanical fault becomes a neural signal, and it is the node every effective treatment
          is ultimately trying to silence.
        role: mechanism
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: vestibular hair cell
          term:
            id: CL:0000609
            label: vestibular hair cell
        locations:
        - preferred_term: crista ampullaris
          term:
            id: UBERON:0004721
            label: crista ampullaris
        - preferred_term: vestibular ganglion
          term:
            id: UBERON:0002824
            label: vestibular ganglion
      selected_evidence:
        snippet: In the case of BPPV, aberrant signals from semicircular canals create an illusion of
          motion which results in vertigo.
        supports: SUPPORT
        directness: DIRECT
    origin:
