                term:
                  id: CHEBI:28940
                  label: calciol
              - preferred_term: calcium carbonate
                term:
                  id: CHEBI:3311
                  label: calcium carbonate
            notes: The trial abstract carries its own formal grade, stating that it provides Class III
              evidence. dismech has no slot for a source-assigned evidence grade, so it is recorded here
              rather than lost.
          role: ancestor
      assertion_type: TreatmentMechanismTarget
