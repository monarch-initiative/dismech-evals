        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Otoconial Degeneration and Detachment from the Utricular Macula
        description: 'The initiating lesion is loss of otoconia from the otolithic membrane of the utricle.
          Otoconia fracture, fragment and lose mass with age, and the same detachment can be produced
          abruptly by head trauma, ear surgery, or inner-ear disease that degrades the gelatinous substrate
          anchoring them. Most cases are idiopathic and are attributed to degeneration of the macula.
          This node is where the mechanism starts: everything downstream is a consequence of particles
          being in the wrong compartment.'
        role: trigger
        biological_scale: TISSUE
        locations:
        - preferred_term: macula of the utricle
          term:
            id: UBERON:0002214
            label: macula of utricle of membranous labyrinth
        - preferred_term: otoconia
          term:
            id: UBERON:0002280
            label: otolith
      selected_evidence:
        snippet: The otoconia contained in the utricle and saccule have also been shown to undergo morphological
          changes and degeneration during a human’s lifespan as observed in postmortem analyses
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
