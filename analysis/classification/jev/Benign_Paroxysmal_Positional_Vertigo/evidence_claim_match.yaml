      assertion_type: Treatment
      assertion:
        name: Semont-plus maneuver
        description: An extended Semont maneuver tested in posterior canalithiasis. In a per-protocol
          analysis of 195 of 214 randomized patients, an initial clinician treatment followed by nine
          home maneuvers daily shortened mean time to sustained symptom resolution to 2.0 versus 3.3 days
          with Epley. Single clinician-maneuver success did not differ significantly. Results concern
          this supervised-plus-home protocol, with patient-reported outcomes and uncertain home execution.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Semont-plus maneuver
          term:
            id: NCIT:C15302
            label: Physical Therapy
      selected_evidence:
        snippet: For the secondary end point (effect of a single maneuver), no significant difference
          was detected (67 of 98 [68.4%] vs 61 of 97 [62.9%]; P = .42; α = .05).
        supports: SUPPORT
        directness: DIRECT
