        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vestibular-Visual-Somatosensory Mismatch
        description: The vestibular nuclei receive a canal signal reporting rotation while vision and
          proprioception report a stationary head. The brain resolves the conflict in favour of the vestibular
          input, so the patient perceives self or environment as spinning. The same conflict drives the
          autonomic response through vestibulo-autonomic projections, which is why nausea and vomiting
          accompany severe attacks. Perception ceases when the particle stops moving, which is why episodes
          are brief.
        role: consequence
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Vertigo is defined as the subjective perception of rotational or translational movement
          in the absence of an external stimulus.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
