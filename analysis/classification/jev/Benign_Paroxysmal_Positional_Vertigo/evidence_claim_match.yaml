        description: Detached otoconia can only enter or leave a semicircular canal through its non-ampullated
          end, because the cupula partitions the ampulla. The posterior canal receives the great majority
          of debris because it is the most gravity-dependent part of the labyrinth; the horizontal and
          anterior canals account for the remainder. Scanning electron microscopy of canal contents surgically
          removed from patients with intractable disease shows free-floating otoconia still carrying linking
          filaments and gelatinous matrix, which is the direct evidence that the particles are of utricular
          origin.
        role: mechanism
        biological_scale: TISSUE
        locations:
        - preferred_term: semicircular canal
          term:
            id: UBERON:0001840
            label: semicircular canal
        - preferred_term: posterior semicircular canal
          term:
            id: UBERON:0001842
            label: posterior semicircular canal
      selected_evidence:
        snippet: Scanning electron micrographs of posterior semicircular canal contents extracted from
          patients with intractable BPPV show free‐floating otoconia with linking filaments attached to
          what appears to be a gelatinous matrix
        supports: SUPPORT
        directness: DIRECT
