        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vestibulo-Ocular Reflex Driven Positional Nystagmus
        description: Abnormal canal input drives a compensatory slow eye movement and an oppositely directed
          fast phase through vestibulo-ocular pathways. The nystagmus axis helps identify the stimulated
          canal; posterior canalithiasis typically gives torsional upbeating nystagmus. Atypical patterns
          require consideration of peripheral variants and central mimics.
        role: consequence
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Activation of the ipsilateral inferior oblique and contralateral superior rectus during
          the Dix‐Hallpike leads to a torsional nystagmus (the top pole of the eye beats towards the lowermost
          ear) along with an up‐beating component.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
