      assertion_type: Treatment
      assertion:
        name: Vitamin D and Calcium Supplementation
        description: A multicentre trial randomized 1,050 successfully repositioned patients to a vitamin
          D assessment-and-supplementation strategy or observation. Intervention participants with serum
          vitamin D below 20 ng/mL received vitamin D 400 IU and calcium carbonate 500 mg twice daily
          for one year. Event rates were 0.83 versus 1.10 recurrences per person-year; the proportion
          of patients who relapsed was 37.8% versus 46.7%. The reported NNT of 3.70 is based on the event-rate
          difference, not the patient-level relapse proportion. The trial did not isolate vitamin D from
          calcium or use a placebo control.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: vitamin D and calcium supplementation
          term:
            id: NCIT:C15433
            label: Nutritional Support
          therapeutic_agent:
          - preferred_term: cholecalciferol (vitamin D3)
            term:
              id: CHEBI:28940
              label: calciol
          - preferred_term: calcium carbonate
            term:
              id: CHEBI:3311
              label: calcium carbonate
        notes: The publication classifies the trial as Class III evidence. Clinical benefit does not by
          itself demonstrate an effect on otoconial structure.
      selected_evidence:
        snippet: The intervention group showed a reduction in the ARR (0.83 [95% confidence interval (CI),
          0.74-0.92] vs 1.10 [95% CI, 1.00-1.19] recurrences per 1 person-year) with an incidence rate
          ratio of 0.76 (95% CI, 0.66-0.87, p < 0.001)
        supports: SUPPORT
        directness: DIRECT
