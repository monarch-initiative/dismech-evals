    evidence_metadata:
      reference: PMID:30828628
      reference_title: Benign paroxysmal positional vertigo.
      evidence_source: HUMAN_CLINICAL
      explanation: Traces the specific reflex pathway from the stimulated canal to the observed eye movement,
        which is what makes nystagmus direction a readout of canal identity.
      quote_role: REVIEW_SYNTHESIS
