      assertion:
        name: Anterior Canal
        display_name: Anterior (superior) semicircular canal BPPV
        description: Rare (roughly 3% of cases), because the orientation of the superior canal lets debris
          return to the utricle under ordinary head movement. Shares the Dix-Hallpike test with the posterior
          canal but is distinguished by a down-beating vertical nystagmus component.
      selected_evidence:
        snippet: In a positive Dix‐Hallpike exam of the superior canal BPPV, the torsional component remains
          the same as for the posterior canal of the undermost ear with the main differentiating element
          being a down‐beating vertical component.
        supports: SUPPORT
        directness: DIRECT
