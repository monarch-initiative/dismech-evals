        context: []
      assertion_type: Inheritance
      assertion:
        name: Multifactorial with familial aggregation
        description: BPPV is multifactorial rather than Mendelian and no causal gene is established. A
          case-control family survey found relatives of affected patients five times more likely to have
          BPPV than relatives of dizzy controls, which the authors were explicit could reflect shared
          environment rather than heredity. This entry therefore records familial aggregation as an observed
          pattern, not as an inheritance mode, and binds no HPO mode-of-inheritance term.
      selected_evidence:
        snippet: There is nothing in our data that would distinguish between a hereditary or environmental
          influence in the development of the disease, however.
        supports: SUPPORT
        directness: DIRECT
