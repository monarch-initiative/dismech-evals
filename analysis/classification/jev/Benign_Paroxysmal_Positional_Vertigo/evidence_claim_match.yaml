          the cupula is described in prose rather than bound. Do not substitute UBERON:0009716.
      selected_evidence:
        snippet: In the cupulolithiasis model, the particulate matter becomes adherent to the cupula itself.
          This cupular loading renders the system sensitive to gravitational forces, and the resulting
          alterations in cupular deflection lead to pathological perceptions of motion.
        supports: SUPPORT
        directness: DIRECT
