      assertion_type: Treatment
      assertion:
        name: Vitamin D supplementation without calcium
        description: Placebo-controlled trials support recurrence prevention in vitamin D-deficient or
          insufficient patients, with important differences in population and endpoint. A 2024 trial of
          38 patients using 7,000 IU weekly found fewer recurrence events but no significant difference
          in the proportion of patients relapsing. A small older-adult trial found fewer episodes with
          a six-month daily replacement course, and a 2026 trial of 160 deficient adults reported 27.5%
          versus 55.0% recurrence over 24 months with 10,000 IU weekly. These regimens do not establish
          an optimal dose or universal benefit in vitamin D-replete patients.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: vitamin D replacement
          term:
            id: NCIT:C15433
            label: Nutritional Support
          therapeutic_agent:
          - preferred_term: cholecalciferol
            term:
              id: CHEBI:28940
              label: calciol
        notes: The older-adult trial and its 2025 falls analysis are the same cohort. Reduced BPPV recurrence
          did not establish a reduction in falls in that small post hoc analysis.
      selected_evidence:
        snippet: vitamin D supplementation, in the absence of calcium, for treating vitamin D deficiency
          did not exhibit a significant difference in the recurrence rate of BPPV among the participants.
        supports: SUPPORT
        directness: DIRECT
