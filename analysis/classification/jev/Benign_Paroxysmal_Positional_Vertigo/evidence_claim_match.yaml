        name: Posterior Canal
        display_name: Posterior semicircular canal BPPV
        description: By far the commonest variant (80-90% of cases), because the posterior canal is the
          most gravity-dependent part of the vestibular labyrinth, so debris leaving the utricle tends
          to settle there. Diagnosed by the Dix-Hallpike manoeuvre, which provokes torsional upbeating
          nystagmus after a latency of 2-5 seconds.
      selected_evidence:
        snippet: The posterior canal variant is by far the most common (80–90%)18 because it is the most
          gravity‐dependent part of the vestibular labyrinth.
        supports: SUPPORT
