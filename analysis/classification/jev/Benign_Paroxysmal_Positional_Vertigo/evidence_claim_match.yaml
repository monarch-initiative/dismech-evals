      assertion:
        name: Positional nystagmus
        category: Neurological
        description: Positionally elicited nystagmus with direction and timing dependent on the involved
          canal and mechanism. Typical posterior canalithiasis produces transient torsional upbeating
          nystagmus; persistent responses occur in other variants. Subjective BPPV describes compatible
          positional vertigo without observable nystagmus.
        phenotype_term:
          preferred_term: Positional nystagmus
          term:
            id: HP:0000639
            label: Nystagmus
        notes: Bound to the general HP term for nystagmus because HPO has no term for positional nystagmus
          as such; the positional qualifier is carried in preferred_term and in the description. HP:0000666
          (Horizontal nystagmus) and HP:0010545 (Downbeat nystagmus) describe individual canal variants
          and are narrower than the phenotype as a whole.
      selected_evidence:
        snippet: Characteristic nystagmus features include latency of onset, limited duration, torsional
          and upbeat directionality, reversibility, and fatigability.
        supports: SUPPORT
        directness: DIRECT
