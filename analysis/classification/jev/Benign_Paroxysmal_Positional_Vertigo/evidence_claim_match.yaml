      assertion_type: Diagnosis
      assertion:
        name: Dix-Hallpike maneuver
        description: The definitive positional test for posterior and anterior canal BPPV. The seated
          patient's head is turned 45 degrees toward the tested side to align that posterior canal vertically,
          then the patient is laid supine with the tested ear down. A positive test in a compatible history
          is diagnostic; no imaging or ancillary vestibular testing is normally required.
      selected_evidence:
        snippet: When performed in the office, the sensitivity and specificity are 79% to 82% and 71%
          to 75%, respectively.
        supports: SUPPORT
        directness: DIRECT
    origin:
