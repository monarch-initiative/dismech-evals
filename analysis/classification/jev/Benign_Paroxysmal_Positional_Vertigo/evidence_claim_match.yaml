        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Canalithiasis
        description: Free-floating particles within the canal lumen are pulled through the endolymph by
          gravity when the head changes position. Acting as a plunger, they drag endolymph and displace
          the cupula in the same direction. Because the particles must first overcome inertia and then
          settle, the resulting signal has a latency of a few seconds, builds and decays, lasts under
          a minute, and fatigues on repeated testing as the particles disperse. This is the predominant
          subtype.
        role: mechanism
        biological_scale: TISSUE
      selected_evidence:
        snippet: The aberrant signal results when gravity pulls the particles through the endolymph canal
          creating a plunger‐like effect which in turn causes ipsidirectional cupular displacement
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
