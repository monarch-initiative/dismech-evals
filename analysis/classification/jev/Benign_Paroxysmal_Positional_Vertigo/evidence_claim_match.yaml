        context: []
      assertion_type: Treatment
      assertion:
        name: Canalith Repositioning Maneuver
        description: Canalith repositioning, usually an Epley or modified particle repositioning maneuver,
          is recommended for posterior canal BPPV. It moves canaliths toward the utricle. Repeat treatment
          may be needed, and successful treatment does not eliminate future recurrence. Mobility and cervical
          limitations affect maneuver selection.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: canalith repositioning maneuver
          term:
            id: NCIT:C15302
            label: Physical Therapy
        notes: The intervention is represented by Physical Therapy with a more specific preferred term.
          Postprocedural head-position restrictions are not routinely recommended after posterior-canal
          repositioning.
      selected_evidence:
        snippet: More recently, a Cochrane review of 11 relevant studies representing 745 participants,
          concluded that the Epley maneuver and its modifications are safe and effective.
        supports: SUPPORT
        directness: DIRECT
