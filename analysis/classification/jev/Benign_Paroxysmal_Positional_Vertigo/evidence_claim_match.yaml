        context:
        - path: /environmental/0
          value:
            name: Head trauma
            description: Mechanical force reaching the inner ear can shear otoconia from the utricular
              macula abruptly, rather than through the gradual degeneration that accounts for idiopathic
              disease. Post-traumatic BPPV is well recognised clinically and is the commonest cause of
              vertigo after head injury in younger people, in whom the age-related degenerative route
              is not yet available.
            effect: Increases risk of otoconial detachment and therefore of BPPV
            notes: No ECTO term was bound. ECTO models chemical, dietary and infectious exposures; a mechanical
              head injury is not represented there, and the plausible-looking NCIT head-trauma concepts
              are disease and injury terms rather than exposure terms, so binding one would misuse the
              slot.
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Otoconial Degeneration and Detachment from the Utricular Macula
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: Trauma acts at the initiating node, detaching otoconia mechanically rather than through
          degeneration of the otolithic membrane.
      selected_evidence:
        snippet: Secondary causes of BPPV refer to identifiable causes of otoconial dislodgement. These
          include otologic and nonotologic surgery, head trauma, or any means by which a sufficient mechanical
          force reaches the inner ear.
        supports: SUPPORT
        directness: DIRECT
