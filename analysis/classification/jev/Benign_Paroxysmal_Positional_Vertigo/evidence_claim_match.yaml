      assertion:
        name: Supine roll test
        description: Also called the Pagnini-McClure manoeuvre. Used when the history fits BPPV but Dix-Hallpike
          shows horizontal nystagmus or none. Unlike Dix-Hallpike it stimulates both horizontal canals
          at once, so the affected side is inferred by comparing nystagmus intensity and direction between
          the two head turns.
      selected_evidence:
        snippet: Unlike the Dix‐Hallpike maneuver, which isolates one posterior canal during testing,
          the supine roll test provokes both horizontal canals simultaneously.
        supports: SUPPORT
        directness: DIRECT
