      - /disease_term
    evidence_metadata:
      reference: PMID:30828628
      reference_title: Benign paroxysmal positional vertigo.
      evidence_source: HUMAN_CLINICAL
      explanation: 'States the biomechanical coupling this node asserts: particle motion drives endolymph,
        which deflects the cupula.'
