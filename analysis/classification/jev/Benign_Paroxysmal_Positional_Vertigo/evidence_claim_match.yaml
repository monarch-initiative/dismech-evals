            description: Secondary prevention after successful repositioning, for patients whose serum
              vitamin D is below 20 ng/mL. In a multicentre randomised trial, vitamin D 400 IU plus calcium
              carbonate 500 mg twice daily for a year reduced the annual recurrence rate, with a number
              needed to treat of about four. This is the only intervention here shown to change the recurrence
              rate rather than terminate an attack.
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: vitamin D and calcium supplementation
