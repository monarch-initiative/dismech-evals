      assertion:
        discussion_id: bss_gp5_never_implicated
        kind: OPEN_QUESTION
        prompt: Why has no Bernard-Soulier-causing variant ever been found in GP5, the fourth subunit
          of the complex?
        attaches_to:
        - pathophysiology#Biallelic Loss of Function in GP1BA, GP1BB, or GP9
        rationale: GP5 encodes GPV, the fourth subunit, and it maps to a known locus like the other three,
          yet across 211 genotyped families and two decades of review no disease-causing GP5 variant has
          been reported. The straightforward reading is that GPV is dispensable for complex assembly and
          surface expression, so losing it does not produce the phenotype. This is a real curatable negative
          rather than an artifact of ascertainment, and it constrains any model of how the complex assembles.
      selected_evidence:
        snippet: To date, no BSS mutations in the GP5 gene have been reported.
        supports: SUPPORT
