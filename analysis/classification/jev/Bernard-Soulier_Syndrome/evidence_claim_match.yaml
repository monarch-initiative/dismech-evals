        discussion_id: bss_qol_decoupled_from_bleeding_score
        kind: OPEN_QUESTION
        prompt: Why is quality of life only weakly related to bleeding-assessment score in inherited platelet
          function disorders, and what should be measured instead?
        attaches_to:
        - phenotypes#Iron Deficiency Anemia
        rationale: A recent multi-instrument study using EQ-5D, SF-36, and FACIT alongside annual bleed
          rate and the ISTH bleeding assessment tool found the relationship between quality-of-life scores
          and bleeding score was weak. If event count does not predict lived burden, then trials and clinical
          follow-up anchored on bleed rate are measuring the wrong thing. The plausible drivers are chronic
          anemia and fatigue, treatment access, and disruption to schooling and work, none of which a
          bleeding score captures, but this has not been formally decomposed.
      selected_evidence:
        snippet: The relationship between quality of life (QoL) scores and ISTH-BAT score was weak.
        supports: SUPPORT
