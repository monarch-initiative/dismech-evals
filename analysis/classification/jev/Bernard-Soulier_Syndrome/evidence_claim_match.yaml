      assertion_type: Diagnosis
      assertion:
        name: Diagnostic Triad and Confirmatory Testing
        description: Diagnosis rests on prolonged skin bleeding time, a small number of very large platelets,
          defective ristocetin-induced agglutination, and low or absent GPIb-IX-V expression. Flow cytometry
          for surface complex expression is the modern confirmatory test in biallelic disease. Prothrombin
          consumption is markedly reduced, a finding that reports on the coagulation-support arm rather
          than the adhesion arm.
      selected_evidence:
        snippet: Diagnosis is based on a prolonged skin bleeding time, the presence of a small number
          of very large platelets (macrothrombocytopenia), defective ristocetin-induced platelet agglutination
          and low or absent expression of the GPIb-V-IX complex.
        supports: SUPPORT
