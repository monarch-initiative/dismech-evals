      assertion_type: Treatment
      assertion:
        name: Eltrombopag
        description: A thrombopoietin-receptor agonist trialed in a mixed cohort of inherited thrombocytopenias
          that included monoallelic Bernard-Soulier syndrome. Response rates were substantial, but two
          caveats govern how far this generalizes. The trial included only monoallelic disease and only
          as part of a mixed cohort, so it is not evidence for biallelic disease. And mechanistically,
          raising the count of platelets that still cannot bind von Willebrand factor addresses only the
          thrombopoietic branch, leaving the adhesion defect untouched.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: eltrombopag
            term:
              id: CHEBI:85010
              label: eltrombopag
      selected_evidence:
        snippet: Of 23 patients evaluable for response, 11 (47.8%) achieved a major response (platelet
          count >100 ×109/L), ten (43.5%) had a minor response (platelet count at least twice the baseline
          value), and two patients (8.7%) did not respond.
        supports: SUPPORT
