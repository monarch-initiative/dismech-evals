            term:
              id: MONDO:0009276
              label: Bernard-Soulier syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Genetic Testing, Essential in Monoallelic Disease
        description: 'In biallelic disease the laboratory phenotype is unambiguous. In monoallelic disease
          it is not: platelets are large rather than giant, the ristocetin response may be decreased or
          normal, and complex expression may be only partially reduced or normal, so genetic testing is
          what makes the diagnosis and separates it from immune thrombocytopenic purpura.'
      selected_evidence:
        snippet: In biallelic BSS, giant platelets in the peripheral blood smear, absence of ristocetin-induced
          platelet aggregation (RIPA) using light transmission aggregometry (LTA), and complete loss of
          GPIbIX complex in flow cytometry are observed, whereas in monoallelic forms, genetic diagnosis
          is recommended due to the presence of large platelets in the peripheral blood smear, decreased
          or normal RIPA response in LTA, and partial loss or normal GPIbIX complex in flow cytometry.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
