        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of von Willebrand Factor Capture Under Shear
        biological_scale: CELLULAR
        conforms_to: primary_hemostatic_plug_failure#Impaired Platelet Adhesion to the Injured Vessel
          Wall
        description: 'Under arterial shear, von Willebrand factor unfurls on exposed subendothelium and
          its A1 domain is the only thing fast enough to catch a platelet moving at that velocity. GPIbalpha
          is the catcher''s mitt. Without it there is no capture step, so nothing downstream ever starts:
          no rolling, no outside-in signaling, no inside-out activation of the integrin alphaIIb-beta3,
          no firm adhesion. The laboratory expression of this node is the absent ristocetin-induced agglutination
          that is not corrected by adding normal plasma, which is the entire diagnostic logic of the disease
          in one sentence.'
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: primary hemostasis
          term:
            id: GO:0007599
            label: hemostasis
          modifier: DECREASED
      selected_evidence:
        snippet: As a consequence, platelets are unable to adhere to the vascular subendothelium and agglutinate
          in response to ristocetin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
