      assertion_type: Discussion
      assertion:
        discussion_id: bss_gene_therapy_no_clinical_trial
        kind: KNOWLEDGE_GAP
        prompt: Lentiviral gene therapy corrects the phenotype across all three causal genes and now works
          in patient-derived cells, so why has no clinical trial been conducted?
        attaches_to:
        - pathophysiology#Failure of GPIb-IX-V Complex Assembly and Surface Expression
        rationale: 'The preclinical package is unusually complete for a disease this rare: correction
          in GPIbalpha-null and GPIbbeta-null mice with sustained expression through serial transplant,
          and ex vivo correction of hematopoietic stem cells from two unrelated type C patients. What
          is missing is any clinical trial. The plausible obstacles are the conditioning regimen required
          for stem cell gene therapy against a disease whose prognosis is generally good with supportive
          care, the very small and geographically scattered patient population, and the absence of an
          agreed clinical endpoint given that bleeding score correlates only weakly with lived burden.
          None of these has been formally addressed in the literature, so the gap between a solved preclinical
          problem and an untried clinical one is recorded here rather than explained.'
      selected_evidence:
        snippet: These results demonstrate the potential of lentiviral-based gene therapy to rescue BSS
          type C.
        supports: SUPPORT
    origin:
