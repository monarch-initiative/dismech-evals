              label: Bernard-Soulier syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Lentiviral Gene Therapy (Investigational)
        description: 'The most active research front, and the reason the transplantation entry above should
          not be read as the only conceivable cure. Lentiviral delivery of the missing subunit under a
          platelet-specific promoter has corrected the phenotype across all three genes: in GPIbalpha-null
          mice it corrected the tail bleeding time and improved the macrothrombocytopenia with sustained
          expression through serial transplant; in GPIbbeta-null mice it restored GPIb-IX in 97% of circulating
          platelets with normal bleeding times; and for type C it has reached patient material, correcting
          GPIX expression and platelet size in hematopoietic stem cells from two unrelated patients. No
          clinical trial of gene therapy in this disease has been conducted, so this is preclinical throughout
          and is curated as investigational.'
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: Therapeutic levels of hGPIbα expression were achieved that corrected the tail bleeding
          time and improved the macrothrombocytopenia.
        supports: SUPPORT
