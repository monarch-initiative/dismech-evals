              label: Bernard-Soulier syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: A2
        display_name: BSS type A2 (monoallelic, autosomal dominant)
        subtype_term:
          preferred_term: Bernard-Soulier syndrome, type A2, autosomal dominant
          term:
            id: MONDO:0007930
            label: Bernard-Soulier syndrome, type A2, autosomal dominant
        description: The dominant monoallelic form, caused by heterozygous GP1BA or GP1BB variants. Milder,
          later-presenting, and frequently mistaken for immune thrombocytopenic purpura. The best-characterized
          allele is the southern Italian Bolzano founder variant GP1BA c.515C>T, which accounted for 20%
          of inherited thrombocytopenia patients at two Italian referral centers over a decade. Platelet
          aggregation is often normal here, so genetic testing rather than aggregometry is what makes
          the diagnosis.
        genes:
        - preferred_term: GP1BA
          term:
            id: hgnc:4439
            label: GP1BA
      selected_evidence:
        snippet: Although the clinical expression was variable, patients with this mutation typically
          had a mild form of Bernard-Soulier syndrome with mild thrombocytopenia and bleeding tendency.
        supports: SUPPORT
    origin:
