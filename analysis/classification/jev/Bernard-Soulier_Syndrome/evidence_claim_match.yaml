      assertion_type: Discussion
      assertion:
        discussion_id: bss_no_genotype_phenotype_correlation
        kind: KNOWLEDGE_GAP
        prompt: What determines bleeding severity in Bernard-Soulier syndrome, given that it does not
          track genotype, platelet count, or receptor expression level?
        attaches_to:
        - pathophysiology#Failure of Primary Hemostatic Plug Formation
        rationale: In the largest systematically evaluated single-center series, bleeding severity varied
          widely between individuals while thrombocytopenia was uniformly moderate and GPIbalpha expression
          uniformly under 10% of control. The authors were explicit that they could define no correlations.
          That combination, a variable output with the measured inputs pinned, is the shape you would
          expect if unidentified modifiers were doing the work. No modifier allele has been established.
          This is a genuine gap in the literature rather than a gap in searching, and it has direct clinical
          consequence because there is currently no way to predict which patient will bleed badly.
      selected_evidence:
        snippet: Aware of the limitations of our cohort, we cannot define any correlations.
        supports: SUPPORT
