              label: Bernard-Soulier syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Platelet-Surface Coagulation Factor Binding
        biological_scale: MOLECULAR
        description: GPIbalpha is not only a von Willebrand factor receptor. It also binds thrombin, factor
          XI, factor XII, high-molecular-weight kininogen, P-selectin, and the leukocyte integrin Mac-1.
          Losing this hub degrades platelet-supported coagulation and platelet-leukocyte crosstalk on
          top of the adhesion defect, and the clinical fingerprint of that second loss is the markedly
          reduced prothrombin consumption seen in these patients. This is the arm that gets dropped from
          modern write-ups, and it is part of why bleeding is worse than a pure adhesion defect would
          predict.
        cellular_components:
        - preferred_term: glycoprotein Ib-IX-V complex
          term:
            id: GO:1990779
            label: glycoprotein Ib-IX-V complex
          modifier: ABSENT
        biological_processes:
        - preferred_term: blood coagulation
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: DECREASED
      selected_evidence:
        snippet: Prothrombin consumption is markedly reduced.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
