      assertion_type: ClinicalBurden
      assertion:
        burden_level: MODERATE
        rationale: 'Prognosis is generally good with adequate supportive care, and the disease is non-progressive,
          but the burden is real and chronic: near-universal menorrhagia in reproductive-age women, recurrent
          mucocutaneous bleeding, iron deficiency, and dependence on platelet transfusion with its alloimmunization
          risk. A recent multi-instrument quality-of-life study found the relationship between quality-of-life
          scores and bleeding-assessment score was weak, which is worth taking seriously: event count
          is not the same thing as lived burden, and the drivers appear to be chronic anemia, fatigue,
          treatment access, and disruption to school and work.'
      selected_evidence:
        snippet: The prognosis is usually good with adequate supportive care but severe bleeding episodes
          can occur with menses, trauma and surgical procedures.
        supports: SUPPORT
