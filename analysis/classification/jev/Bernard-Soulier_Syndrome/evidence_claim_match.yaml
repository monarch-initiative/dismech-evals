        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: von Willebrand Disease
        description: 'The other disease of the von Willebrand factor to GPIbalpha axis, approached from
          the opposite side. In von Willebrand disease the plasma ligand is deficient or defective; here
          the platelet receptor is. The discriminating test is whether adding normal plasma corrects the
          ristocetin response: it does in von Willebrand disease and it cannot here, because the receptor
          is simply not there.'
        distinguishing_features:
        - Ristocetin response corrected by normal plasma in von Willebrand disease, not in Bernard-Soulier
          syndrome
        - Platelet count and size normal in most von Willebrand disease
        - Plasma von Willebrand factor antigen and activity abnormal in von Willebrand disease
      selected_evidence:
        snippet: As a consequence, platelets are unable to adhere to the vascular subendothelium and agglutinate
          in response to ristocetin.
        supports: SUPPORT
