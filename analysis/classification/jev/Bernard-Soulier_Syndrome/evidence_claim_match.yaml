        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        features: 'GP1BB lies inside the commonly deleted 22q11.2 interval, so every patient with 22q11.2
          deletion syndrome is an obligate carrier of Bernard-Soulier syndrome. A second-hit pathogenic
          variant on the retained allele then produces full disease. Recorded as a predisposing structural
          context rather than as a differential diagnosis, because it is not a phenotypic mimic: it is
          a contiguous-gene deletion that halves gene dosage and unmasks a monoallelic GP1BB variant.
          Worth testing in any 22q11.2 deletion patient with unexplained macrothrombocytopenia.'
      selected_evidence:
        snippet: Patients with 22q11.2 deletion syndrome (22q11.2DS) are obligate carriers of BSS because
          GP1BB resides on chromosome 22q11.2.
        supports: SUPPORT
