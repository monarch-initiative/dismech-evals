          GP9 44%, GP1BA 28%, GP1BB 28%, with 112 distinct variants spanning missense, nonsense, frameshift,
          splice-site, and larger deletions. Eighty-five percent of probands are homozygous, with founder
          effects in several regions and consanguinity the dominant population-level risk multiplier.
          GP5, the fourth subunit gene, has never been implicated. Monoallelic GP1BA and GP1BB variants
          cause the milder dominant type A2, including the southern Italian Bolzano founder allele GP1BA
          c.515C>T.
