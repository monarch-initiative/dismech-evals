      assertion_type: DifferentialDiagnosis
      assertion:
        name: Acquired (Autoantibody-Mediated) Bernard-Soulier Phenotype
        description: Anti-GPIb/IX autoantibodies can produce a phenocopy in a person with normal genes.
          It presents later, without a family history, and it is a different disease requiring immunomodulation
          rather than supportive hemostatic care. A recent Moroccan series of seven patients included
          one such case, which is a useful reminder that the laboratory phenotype alone does not establish
          the genetic diagnosis.
        distinguishing_features:
        - Acquired later-life onset without family history
        - Anti-GPIb/IX autoantibodies detectable
        - No pathogenic GP1BA, GP1BB, or GP9 variant
      selected_evidence:
        snippet: the diagnosis of constitutional BSS was established in six patients, while only one case
          was idiopathic acquired BSS.
        supports: SUPPORT
