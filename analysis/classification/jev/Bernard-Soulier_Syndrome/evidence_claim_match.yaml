          phenotype, and rescue by transgenic human GPIbalpha demonstrates the dependency directly.
        limitations: Mouse platelets differ from human in size and count baselines, and the model addresses
          the GP1BA route only, so it says nothing about how GP1BB or GP9 variants produce the same phenotype.
          Murine bleeding assays (tail bleeding time) correspond only loosely to human mucocutaneous bleeding.
      selected_evidence:
        snippet: We have disrupted the gene encoding the alpha-subunit of mouse GP Ib-IX-V (GP Ibalpha)
