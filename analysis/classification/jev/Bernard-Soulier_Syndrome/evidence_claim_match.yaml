  b0e83fd2ac6d7c0ad93d077fc8d6b89520e14a722a28de2b37b78dc69e22d5ff:
    claim:
      about:
        disease:
          name: Bernard-Soulier Syndrome
          disease_term:
            preferred_term: Bernard-Soulier Syndrome
            term:
              id: MONDO:0009276
              label: Bernard-Soulier syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of GPIb-IX-V Complex Assembly and Surface Expression
        biological_scale: CELLULAR
        description: The dominant molecular consequence is failure of the complex to reach the platelet
          surface at all, because assembly is obligately stoichiometric and a single null subunit sinks
          the whole receptor. A minority of variants instead permit surface expression but abolish von
          Willebrand factor binding, a genuinely separate mechanism with the same clinical result. Surface
          GPIbalpha in biallelic disease is consistently under 10% of control values.
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
        cellular_components:
        - preferred_term: glycoprotein Ib-IX-V complex
          term:
            id: GO:1990779
            label: glycoprotein Ib-IX-V complex
          modifier: ABSENT
      selected_evidence:
        snippet: Consistent with expression levels of GPIbα always lower than 10% of control values, platelet
          aggregation was absent or severely reduced.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
