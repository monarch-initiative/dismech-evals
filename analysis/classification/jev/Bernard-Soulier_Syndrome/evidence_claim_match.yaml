      assertion_type: DifferentialDiagnosis
      assertion:
        name: Immune Thrombocytopenic Purpura
        description: The most consequential misdiagnosis, and the one monoallelic disease routinely receives.
          The two are managed completely differently, so getting it wrong means immunosuppression and
          sometimes splenectomy for a structural receptor defect that will not respond. Chronic persistent
          thrombocytopenia, a positive family history, unresponsive immune thrombocytopenic purpura treatment,
          macrothrombocytopenia, and an absent ristocetin response should all prompt reconsideration.
        distinguishing_features:
        - Lifelong and familial rather than acquired
        - Large or giant platelets rather than normal-sized
        - Absent or reduced ristocetin-induced aggregation
        - Failure to respond to immune thrombocytopenic purpura therapy
      selected_evidence:
        snippet: Thus, BSS should be kept in mind in the presence of individuals with chronic persistent
          thrombocytopenia, positive family history, unresponsive ITP treatment, macrothrombocytopenia,
          and absence of RIPA response.
        supports: SUPPORT
