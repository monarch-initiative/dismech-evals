        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Uncoupling of the Membrane Skeleton from the Megakaryocyte Cytoskeleton
        biological_scale: CELLULAR
        description: The second job. The GPIbalpha cytoplasmic tail binds filamin A and 14-3-3 zeta, anchoring
          the membrane skeleton to the underlying cytoskeleton while a megakaryocyte extrudes proplatelets.
          Without it, megakaryocyte progenitor numbers, differentiation, and endoreplication are all normal,
          but the mature cells have a thickened peripheral zone and a poorly developed demarcation membrane
          system, proplatelet extension falls by about 41%, and the marginal microtubular ring contains
          twice as many tubulin fibers. The same defect is demonstrable in cultured human megakaryocytes
          from patients, with proplatelet formation reduced about 50%, enlarged proplatelet tips, and
          severely deranged alpha-tubulin distribution. Human and mouse converge here unusually well for
          a rare disease.
        cell_types:
        - preferred_term: megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
        biological_processes:
        - preferred_term: platelet formation
          term:
            id: GO:0030220
            label: platelet formation
          modifier: DECREASED
      selected_evidence:
        snippet: The number of megakaryocyte progenitors, their differentiation and progressive maturation
          into distinct classes and their level of endoreplication were normal in GPIbbeta(-/-) bone marrow.
          However, the more mature cells exhibited ultrastructural anomalies with a thicker peripheral
          zone and a less well developed demarcation membrane system.
        supports: SUPPORT
