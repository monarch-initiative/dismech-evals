  cf238f6c41b023b2e8936f15a8dc4148016d46aef11cef3a812ee11e540c38f7:
    claim:
      about:
        disease:
          name: Beta-Ketothiolase Deficiency
          disease_term:
            preferred_term: beta-ketothiolase deficiency
            term:
              id: MONDO:0008760
              label: beta-ketothiolase deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: ACAT1 pathogenic variants
        gene_term:
          preferred_term: ACAT1
          term:
            id: hgnc:93
            label: ACAT1
        features: 'BKD is caused by biallelic pathogenic variants in the ACAT1 gene, which encodes mitochondrial
          acetoacetyl-CoA thiolase (T2). To date, 105 ACAT1 variants have been reported in 149 T2-deficient
          patients. The 56 disease-associated missense variants map to buried residues in the T2 crystal
          structure, likely causing deficiency through lower folding efficiency or stability. Residual
          T2 activity in vivo determines the severity of the biochemical phenotype, while clinical phenotype
          does not correlate well with genotype.

          '
        inheritance:
        - name: Autosomal recessive
          description: 'BKD follows autosomal recessive inheritance. All affected individuals carry biallelic
            (homozygous or compound heterozygous) pathogenic variants in ACAT1.

            '
        variants:
        - name: Compound heterozygous ACAT1 variants
          description: 'Compound heterozygosity for two different ACAT1 pathogenic variants is a common
            genotype. For example, ACAT1 c.481T>C, p.(Tyr161His) was identified in compound heterozygosity
            in an adult patient presenting with diabetic ketoacidosis.

            '
        - name: Founder mutations in consanguineous populations
          description: 'Founder mutations have been identified in specific populations. In a Palestinian
            cohort, a founder mutation was found in six patients from three families. All affected patients
            were offspring of consanguineous marriages, increasing the likelihood of homozygous pathogenic
            variants.

            '
        - name: Missense variants affecting buried residues
          description: 'Almost all of the 56 disease-associated missense ACAT1 variants affect residues
            that are completely or partially buried in the T2 structure, causing deficiency through lower
            in vivo T2 activity due to reduced folding efficiency or stability.

            '
      selected_evidence:
        snippet: ACAT1 | HGNC:93 | beta-ketothiolase deficiency | MONDO:0008760 | AR | Definitive
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
