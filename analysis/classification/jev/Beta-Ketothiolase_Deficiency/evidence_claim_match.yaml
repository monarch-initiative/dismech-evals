          acute decompensation. Adding 3-hydroxybutyrylcarnitine (C4OH) as a co-primary marker is proposed
          to reduce these false negatives, and second-tier genetic testing using NGS panels reduces false
          positive rates.

          '
        treatment_term:
          preferred_term: disease screening
          term:
            id: NCIT:C15419
            label: Disease Screening
      selected_evidence:
        snippet: The performance of BKTD NBS may be improved by adding C4OH to the C5OH and C5:1 combination
          in NBS.
        supports: SUPPORT
