      reference: PMID:34001203
      reference_title: C4OH is a potential newborn screening marker-a multicenter retrospective study
        of patients with beta-ketothiolase deficiency in China.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the false-negative pattern on the conventional two-marker panel that C4OH
        rescues.
