  f928b3348f8b41e988fb0e4a9bb32736450316b7f15eaa2720d7b3f23179a16c:
    claim:
      about:
        disease:
          name: Beta-Ketothiolase Deficiency
          disease_term:
            preferred_term: beta-ketothiolase deficiency
            term:
              id: MONDO:0008760
              label: beta-ketothiolase deficiency
        context: []
      assertion_type: Biochemical
      assertion:
        name: 3-Hydroxybutyrylcarnitine (C4OH)
        presence: INCREASED
        context: 'C4OH is a proposed co-primary newborn-screening marker for BKD. Because T2 also catalyses
          the thiolytic cleavage of acetoacetyl-CoA in extrahepatic ketolysis, D-3-hydroxybutyrate accumulates
          and is conjugated to C4OH. It was raised in 94% of a Chinese cohort with available values, and
          critically it can be elevated in patients whose C5-OH and C5:1 are normal — the false-negative
          pattern that causes BKD to be missed on the conventional two-marker panel. Like the other markers
          it is state-dependent and may normalise between crises.

          '
        biomarker_term:
          preferred_term: 3-hydroxybutyrylcarnitine
          term:
            id: CHEBI:72995
            label: 3-hydroxybutyrylcarnitine
        reference_ranges:
        - lower_bound: 0.02
          upper_bound: 0.3
          unit: umol/L
          population: newborn screening reference interval used in the Chinese BKD cohort
          notes: 'No loinc_term is bound: LOINC has no code for 3-hydroxybutyrylcarnitine specifically.
            Affected patients in this cohort had a median C4OH of 1.38 umol/L (range 0.26-3.58), i.e.
            roughly 4-fold above the upper reference limit, but the value is state-dependent and can fall
            back into range between crises.

            '
        readouts:
        - target: Impaired ketone body metabolism
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Elevated C4OH reports carnitine conjugation of D-3-hydroxybutyrate accumulating
            behind the blocked extrahepatic ketolysis step.
      selected_evidence:
        snippet: Notably, patients No. 4 and 11 had increased C4OH levels only, while C5OH and C5:1 levels
          were normal, even during the course of metabolic decompensations.
        supports: SUPPORT
    origin:
