              label: beta-ketothiolase deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Newborn screening
        description: 'BKD can be detected through expanded newborn screening using tandem mass spectrometry
          (MS/MS) via elevated C5:1 and C5-OH acylcarnitines. However, screening sensitivity is not 100
          percent, and some affected patients may be missed: C5-OH and C5:1 can both be normal even during
          acute decompensation. Adding 3-hydroxybutyrylcarnitine (C4OH) as a co-primary marker is proposed
          to reduce these false negatives, and second-tier genetic testing using NGS panels reduces false
          positive rates.

          '
        treatment_term:
          preferred_term: disease screening
          term:
            id: NCIT:C15419
            label: Disease Screening
      selected_evidence:
        snippet: The false positive rate for these six conditions after the NGS second-tier test was only
          0.017%, and two cases of citrullinemia type II would have been missed as false negatives if
          only biochemical first-tier testing was performed.
        supports: SUPPORT
