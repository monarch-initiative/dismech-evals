        biological_scale: ORGANISM
        description: 'Under catabolic triggers such as infection, diarrhoea, prolonged fasting, ketogenic
          diet, or the inflammatory response to vaccination, increased reliance on ketone body flux and
          amino acid catabolism overwhelms the blocked T2 pathway. Accumulated organic acids produce high
          anion gap metabolic acidosis with ketosis and variable glycemia. Between crises, biochemical
          profiles may normalize, complicating detection. Episodes decrease in frequency with age, and
          are rare after age 10 in most patients.

          '
        biological_processes:
        - preferred_term: response to starvation
          term:
