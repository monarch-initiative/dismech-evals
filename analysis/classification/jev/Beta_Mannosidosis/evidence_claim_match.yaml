        - target: MANBA lysosomal beta-mannosidase deficiency
          relationship: RECAPITULATES
          model_scale: MOLECULAR
          description: Measures impaired enzyme function of selected missense alleles.
          limitations: Heterologous overexpression; no detectable increment above mock does not mean absence
            of all endogenous activity.
      selected_evidence:
        snippet: Cells transfected with the wild-type construct showed a 33-fold increase in beta-mannosidase
          activity compared to mock-transfected cells, whereas cells transfected with the mutant constructs
          showed no detectable increase in activity.
        supports: SUPPORT
        directness: DIRECT
