          density was about one quarter of the control value; oligodendrocyte proportions were reduced.
          This does not distinguish altered proliferation from cell death or establish oligodendrocyte
          death in humans. Neonatal regional substrate measurements did not track the severity of myelin
          loss.
        modeled_mechanisms:
        - target: Glycoprotein-derived oligosaccharide storage
          relationship: PARTIALLY_RECAPITULATES
          model_scale: TISSUE
          limitations: Goats accumulate both disaccharide and trisaccharide; human substrate processing
            differs.
        - target: Impaired CNS myelination
          relationship: PARTIALLY_RECAPITULATES
          model_scale: TISSUE
          limitations: Severe fetal optic-nerve pathology in one affected goat is not equivalent to the
            heterogeneous human MRI phenotype.
      selected_evidence:
        snippet: Ultrastructural analysis revealed a decreased proportion of oligodendrocytes and an increased
          proportion of astrocytes in the affected fetus.
        supports: SUPPORT
        directness: DIRECT
