  ef6c1b79b5bd9f44a0c0ffced75611733d7ac0899128bcd9351720395b6dac43:
    claim:
      about:
        disease:
          name: Beta Mannosidosis
          disease_term:
            preferred_term: beta-mannosidosis
            term:
              id: MONDO:0009562
              label: beta-mannosidosis
        context: []
      assertion_type: Genetic
      assertion:
        name: MANBA
        association: Causative
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: MANBA
          term:
            id: hgnc:6831
            label: MANBA
        variant_origin: GERMLINE
        notes: Biallelic pathogenic variants are causal. The 2025 review lists missense, nonsense, frameshift,
          splice-site and an intragenic inverted-duplication allele. Some observed variants remain uncertain;
          p.Arg500His and the co-occurring p.Gln145Pro should not be treated as definitively pathogenic
          merely because they were found in affected individuals. Clinical severity is not reliably predicted
          by residual activity or broad variant class.
        inheritance:
        - name: Autosomal recessive
          description: When both parents carry a pathogenic MANBA allele, each pregnancy has a 25% affected,
            50% carrier and 25% noncarrier probability. Severity can differ among affected relatives.
        features: The c.2158-2A>G allele was found in 13 heterozygotes among 345 sampled normal-hearing
          Czech and Slovak Roma controls (3.77% carrier frequency). This selected-cohort estimate is not
          a global population prevalence or penetrance estimate. Hearing-loss ascertainment and one dual
          GJB2/MANBA diagnosis limit phenotype attribution.
        variants:
        - name: NM_005908.4:c.2158-2A>G
          variant_type: single nucleotide variant
          genomic_contexts:
          - intron
          type: Splice acceptor variant
          clinical_significance: PATHOGENIC
          description: An intronic acceptor-site SNV associated with cryptic splice-site activation and
            exon skipping. Two abnormal RNA products were observed in differently affected siblings. Presence
            of abnormal RNA does not itself demonstrate residual catalytic activity.
          identifiers:
          - dbSNP:rs772852668
        - name: MANBA c.375A>G
          variant_type: single nucleotide variant
          genomic_contexts:
          - coding sequence
          type: Synonymous variant with splice disruption
          description: The reported DNA substitution is synonymous but alters splicing, removing four
            nucleotides from RNA and predicting premature termination. It was found in trans with p.Ser505Pro.
            The physical DNA alteration is a single-nucleotide substitution; the four-base deletion occurs
            in the transcript.
        - name: MANBA c.1513T>C (p.Ser505Pro)
          type: Functionally tested missense allele
          description: The mutant construct failed to increase beta-mannosidase activity above mock in
            COS-7 cells. Ser505Pro was reported in a more severe presentation than Arg182Trp or Gly392Glu;
            the common in vitro activity result does not predict individual clinical severity.
          variant_type: single nucleotide variant
          genomic_contexts:
          - coding sequence
        - name: MANBA c.544C>T (p.Arg182Trp)
          type: Functionally tested missense allele
          description: The mutant construct failed to increase beta-mannosidase activity above mock in
            COS-7 cells. Ser505Pro was reported in a more severe presentation than Arg182Trp or Gly392Glu;
            the common in vitro activity result does not predict individual clinical severity.
          variant_type: single nucleotide variant
          genomic_contexts:
          - coding sequence
        - name: MANBA c.1175G>A (p.Gly392Glu)
          type: Functionally tested missense allele
          description: The mutant construct failed to increase beta-mannosidase activity above mock in
            COS-7 cells. Ser505Pro was reported in a more severe presentation than Arg182Trp or Gly392Glu;
            the common in vitro activity result does not predict individual clinical severity.
          variant_type: single nucleotide variant
          genomic_contexts:
          - coding sequence
      selected_evidence:
        snippet: MANBA | HGNC:6831 | beta-mannosidosis | MONDO:0009562 | AR | Definitive
        supports: SUPPORT
