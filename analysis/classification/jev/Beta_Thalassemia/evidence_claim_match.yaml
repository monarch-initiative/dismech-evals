      assertion_type: Pathophysiology
      assertion:
        name: Defective Beta-Globin Synthesis
        description: 'Mutations in the HBB gene reduce or abolish beta-globin chain production. Beta-zero
          (beta0) mutations produce no beta-globin; beta-plus (beta+) mutations produce reduced amounts.
          Over 300 mutations have been identified, including point mutations, small deletions, and rarely
          large deletions.

          '
        genes:
        - preferred_term: HBB
          term:
            id: hgnc:4827
            label: HBB
        biological_processes:
        - preferred_term: hemoglobin biosynthetic process
          modifier: DECREASED
          term:
            id: GO:0042541
            label: hemoglobin biosynthetic process
        cell_types:
        - preferred_term: erythroblast
          term:
            id: CL:0000765
            label: erythroblast
      selected_evidence:
        snippet: Beta-thalassemias are caused by point mutations or, more rarely, deletions in the beta
          globin gene on chromosome 11, leading to reduced (beta+) or absent (beta0) synthesis of the
          beta chains of hemoglobin (Hb).
        supports: SUPPORT
    origin:
