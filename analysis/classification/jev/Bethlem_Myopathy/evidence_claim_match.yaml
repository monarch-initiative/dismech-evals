          in rectus femoris (the central cloud or central shadow), which helps distinguish collagen VI
          disease from LMNA-related Emery-Dreifuss muscular dystrophy and from limb-girdle muscular dystrophy.

          '
        results: A concentric outer-to-inner pattern with a rectus femoris central cloud supports collagen
          VI-related myopathy.
