          of COL6A1 exon 14, or glycine substitutions that disrupt the Gly-X-Y repeat of the N-terminal
          triple-helical domain. Mutant chains are still competent to enter the monomer, so the defect
          is transmitted into the assembled protein rather than simply reducing dosage.

          '
