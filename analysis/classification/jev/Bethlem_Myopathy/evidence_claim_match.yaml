  de3e5e2eaf66c3e07c2c00e8a5108a53ce0ab5fdea372e692d6c4d038804d35e:
    claim:
      about:
        disease:
          name: Bethlem myopathy
          disease_term:
            preferred_term: Bethlem myopathy
            term:
              id: MONDO:0008029
              label: Bethlem myopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_bethlem_col6a1_null_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Does the Col6a1-null mouse, which lacks collagen VI entirely, faithfully model dominant-negative
          Bethlem myopathy, in which an abnormal collagen VI network is still present in the matrix?

          '
        attaches_to:
        - pathophysiology#Myofibre mitochondrial dysfunction and permeability transition pore dysregulation
        - pathophysiology#Defective autophagic clearance of damaged organelles
        rationale: 'Nearly all of the mitochondrial permeability-transition and autophagy mechanism is
          derived from the Col6a1-null mouse, a complete-null model whose muscle phenotype is milder than
          the human disease. Most Bethlem myopathy is caused by dominant-negative variants in which collagen
          VI immunoreactivity is preserved but mislocalized away from the basement membrane, a molecularly
          different state from complete absence. Whether a mislocalized network produces the same degree
          of mitochondrial and autophagic failure as no network at all is not established, and it bears
          directly on how much of the cyclophilin D therapeutic rationale transfers to dominant Bethlem
          myopathy.

          '
        proposed_experiments:
        - experiment_id: exp_bethlem_dominant_negative_ptp_flux
          name: Permeability transition and autophagic flux by COL6 genotype class
          description: 'Measure permeability transition pore sensitivity and autophagic flux in myofibres
            or myoblasts from genotyped patients carrying dominant-negative COL6A1 exon 14 skipping, and
            compare against recessive collagen VI null patients and unaffected controls.

            '
        - experiment_id: exp_bethlem_knockin_mouse
          name: Bethlem dominant-negative knock-in mouse
          description: 'Generate a knock-in mouse carrying a Bethlem dominant-negative Col6a1 in-frame
            exon deletion and compare its mitochondrial, autophagic, and contracture phenotype with the
            existing Col6a1-null mouse.

            '
        posed_date: '2026-07-31T00:00:00Z'
      selected_evidence:
        snippet: In contrast to the human disease, these mice only show a mild neuromuscular disorder
          without much overt weakness.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21691338
      reference_title: 'The collagen VI-related myopathies: muscle meets its matrix.'
      evidence_source: OTHER
      explanation: 'The review states directly that the Col6a1-null mouse phenotype is milder than human
        disease, which is the translational mismatch at issue.

        '
