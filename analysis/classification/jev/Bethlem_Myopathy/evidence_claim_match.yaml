              label: Bethlem myopathy
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Muscle collagen VI immunohistochemistry
        diagnosis_term:
          preferred_term: diagnostic procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        description: 'In dominant collagen VI disease, muscle immunohistochemistry retains considerable
          collagen VI signal in the extracellular matrix but loses the normal collagen VI localization
          at the basement membrane, which is best revealed by double staining with a basement membrane
          marker. A normal overall collagen VI stain therefore does not exclude Bethlem myopathy, unlike
          the frankly absent collagen VI of recessive Ullrich disease.

          '
        results: Retained but mislocalized collagen VI, away from the basement membrane, supports dominant
          collagen VI disease.
      selected_evidence:
        snippet: In patients with dominant mutations in particular, muscle immunohistochemistry will show
          a considerable amount of collagen VI immunoreactivity in the extracellular matrix, but the normal
          localization of collagen VI in the basement membrane is lost.
        supports: SUPPORT
