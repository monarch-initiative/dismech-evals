        context: []
      assertion_type: Treatment
      assertion:
        name: Cyclophilin D and permeability transition pore modulation
        description: 'Cyclosporin A desensitizes the mitochondrial permeability transition pore independently
          of calcineurin inhibition, and in an open pilot trial in five patients with collagen VI myopathies
          it normalized muscle-biopsy mitochondrial dysfunction and apoptosis and increased muscle regeneration.
          Genetic ablation of cyclophilin D reproduces the rescue in Col6a1-null mice, validating the
          target. This remains investigational rather than established care, and long-term immunosuppression
          carries infection risk.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: cyclosporin A
            term:
              id: CHEBI:4031
              label: cyclosporin A
      selected_evidence:
        snippet: Both of these pathologic signs were largely normalized after 1 month of oral cyclosporin
          A administration, which also increased muscle regeneration.
        supports: SUPPORT
