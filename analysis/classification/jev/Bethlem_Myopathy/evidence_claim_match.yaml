        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective collagen VI microfibril assembly and secretion
        biological_scale: MOLECULAR
        description: 'Collagen VI is assembled intracellularly from one each of the alpha 1, alpha 2,
          and alpha 3 chains into a triple-helical monomer, then into antiparallel dimers and staggered
          tetramers, which are secreted and associate end to end into the characteristic beaded microfibrils.
          Because a mutant chain can be incorporated at the monomer step, only a minority of tetramers
          are normal, giving a strong dominant-negative effect. Milder lesions such as COL6A1 exon 14
          skipping have a more limited dominant-negative effect and therefore shift the phenotype toward
          the Bethlem end of the spectrum.

          '
        biological_processes:
        - preferred_term: protein secretion
          modifier: ABNORMAL
          term:
            id: GO:0009306
            label: protein secretion
        locations:
        - preferred_term: extracellular matrix
          term:
            id: GO:0031012
            label: extracellular matrix
      selected_evidence:
        snippet: These tetramers are secreted into the extracellular space, where they associate in an
          end-to-end fashion to form characteristic
        supports: SUPPORT
