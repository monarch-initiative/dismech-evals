      assertion:
        name: Myofibre mitochondrial dysfunction and permeability transition pore dysregulation
        biological_scale: CELLULAR
        description: 'Collagen VI-deficient muscle shows ultrastructural alterations of mitochondria and
          sarcoplasmic reticulum and a latent mitochondrial dysfunction that is unmasked by oligomycin,
          producing mitochondrial depolarization, calcium deregulation, and apoptosis through inappropriate
          opening of the cyclophilin D-dependent permeability transition pore. The defect is reversible:
          it is corrected by replating myofibres on collagen VI, by cyclosporin A, and by genetic ablation
          of cyclophilin D. The same mitochondrial dysfunction and increased apoptosis are demonstrable
          in muscle biopsies from patients with collagen VI myopathies.

          '
        cell_types:
