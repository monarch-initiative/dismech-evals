  8f53054d83f2ffab7f7b29d5f4463e9ecf6a7fc0fbeddc4627ec2aaa2f32e0d1:
    claim:
      about:
        disease:
          name: Bethlem myopathy
          disease_term:
            preferred_term: Bethlem myopathy
            term:
              id: MONDO:0008029
              label: Bethlem myopathy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: disc_bethlem_matrix_sarcolemma_receptor
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Which molecular partner mediates the interaction of collagen VI with the muscle basement
          membrane and links the microfibrillar network to the sarcolemma?

          '
        attaches_to:
        - pathophysiology#Impaired matrix-to-sarcolemma anchoring of the myofibre
        rationale: 'The anchoring step is the mechanistic bridge between the extracellular collagen VI
          defect and the intracellular mitochondrial and apoptotic phenotype, yet the receptor or matrix
          partner that transmits the signal is unidentified. Collagen IV and an indirect biglycan to dystrophin-associated-protein-complex
          route have been proposed but not established. Without it, the causal chain from matrix to mitochondrion
          rests mainly on the reversibility of the defect when collagen VI-deficient myofibres are replated
          onto collagen VI.

          '
        proposed_experiments:
        - experiment_id: exp_bethlem_basement_membrane_interactome
          name: Muscle basement membrane collagen VI interactome
          description: 'Perform proximity labeling or crosslinking mass spectrometry on the muscle basement
            membrane to identify the collagen VI binding partners present at the myofibre surface.

            '
        - experiment_id: exp_bethlem_biglycan_dgc_phenocopy
          name: Biglycan and dystroglycan complex phenocopy test
          description: 'Test whether disruption of biglycan or of the dystrophin-associated protein complex
            phenocopies the collagen VI mitochondrial defect in otherwise wild-type myofibres.

            '
        posed_date: '2026-07-31T00:00:00Z'
      selected_evidence:
        snippet: The identity of the molecular partner (or partners) mediating the interaction of collagen
          VI in the muscle basement membrane is not yet known.
        supports: SUPPORT
