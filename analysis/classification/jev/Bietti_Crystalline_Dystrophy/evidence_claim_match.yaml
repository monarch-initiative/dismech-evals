              label: Bietti crystalline corneoretinal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Iron-Dependent Lipid Peroxidation and Ferroptosis
        description: 'The second demonstrated route, and the one that most directly explains why a PUFA-handling
          defect is lethal to the cell: polyunsaturated fatty acids are the preferred substrate of the
          lipid peroxidation that executes ferroptosis. Cyp4v3-null RPE shows lipid peroxidation, reactive
          oxygen species accumulation, mitochondrial defects and upregulation of ferroptosis genes, together
          with upregulation of NCOA4 - the ferritinophagy receptor - and abnormal accumulation of ferrous
          iron. Iron chelation with deferiprone suppresses the phenotype in vitro and restores retinal
          function and morphology in the knockout mouse, which makes this arm both causal and druggable.

          '
        role: effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        biological_processes:
        - preferred_term: Ferroptosis
          term:
            id: GO:0097707
            label: ferroptosis
          modifier: INCREASED
        - preferred_term: Intracellular iron ion homeostasis
          term:
            id: GO:0006879
            label: intracellular iron ion homeostasis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Ferroptosis-related characteristics, including mitochondrial defects, lipid peroxidation,
          ROS accumulation, and upregulation of related genes, were detected in the RPE both in vitro
          and in vivo.
        supports: SUPPORT
