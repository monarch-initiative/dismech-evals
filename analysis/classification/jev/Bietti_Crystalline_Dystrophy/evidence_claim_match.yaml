  9a1be6f6d32ddf66712d98c02fa742e234419e56119891084d3264428d4d4c44:
    claim:
      about:
        disease:
          name: Bietti Crystalline Dystrophy
          disease_term:
            preferred_term: Bietti crystalline corneoretinal dystrophy
            term:
              id: MONDO:0008865
              label: Bietti crystalline corneoretinal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive RPE and Chorioretinal Atrophy
        description: 'Both arms converge on death of the retinal pigment epithelium, followed by loss
          of the choriocapillaris it supports and of the photoreceptors that depend on it. Atrophy spreads
          through the posterior pole and, as it does, the crystalline deposits that gave the disease its
          name progressively disappear - which is why crystal count is a poor progression marker and RPE
          atrophy area is the meaningful one. Two clinical distributions are recognized: a peripheral
          type and a central type, the latter with worse central acuity but better preserved overall retinal
          function.

          '
