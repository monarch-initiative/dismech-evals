            preferred_term: Bietti crystalline corneoretinal dystrophy
            term:
              id: MONDO:0008865
              label: Bietti crystalline corneoretinal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Polyunsaturated Fatty Acid Overload in the Retinal Pigment Epithelium
        description: 'Without CYP4V2 the retinal pigment epithelium cannot dispose of fatty acids through
          the omega-oxidation route, and polyunsaturated species accumulate. This is measurable rather
          than inferred: lipid profiling of RPE from Cyp4v3-null mice - the murine orthologue - shows
          increased eicosapentaenoic and arachidonic acid. The RPE is the cell that suffers because it
          phagocytoses a daily load of PUFA-rich photoreceptor outer-segment membrane, so it carries by
          far the highest flux through this pathway of any cell in the body. Dietary fat load worsens
          the phenotype in the model, which is consistent with substrate supply driving the disease.

          '
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        biological_processes:
        - preferred_term: Lipid homeostasis
          term:
            id: GO:0055088
            label: lipid homeostasis
          modifier: ABNORMAL
        locations:
        - preferred_term: pigmented layer of retina
          term:
            id: UBERON:0001782
            label: pigmented layer of retina
      selected_evidence:
        snippet: Increased levels of PUFAs, such as EPA (C22:5) and AA (C20:4), were observed in the RPE
          of Cyp4v3 KO mice.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
