            preferred_term: Bietti crystalline corneoretinal dystrophy
            term:
              id: MONDO:0008865
              label: Bietti crystalline corneoretinal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ER Stress and Mitochondrial Dysfunction
        description: 'One of two demonstrated routes from lipid overload to RPE death. Proteomic profiling
          of CYP4V2-knockdown RPE identifies endoplasmic reticulum stress as the most enriched pathway;
          IRE1-alpha signalling drives up the ER oxidoreductase ERO1-L-alpha, generating ER-associated
          oxidative stress, and mitochondrial transmembrane potential and ATP production fall. That IRE1-alpha
          inhibition reverses both the ERO1-L-alpha induction and the mitochondrial deficits establishes
          the arm as causal rather than correlative.

          '
        role: effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        biological_processes:
        - preferred_term: Response to endoplasmic reticulum stress
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
          modifier: INCREASED
        - preferred_term: Response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: Inositol-requiring enzyme 1 α (IRE1α) inhibitors suppressed upregulation of endoplasmic
          reticulum oxidoreductase 1 alpha (ERO1-Lα) protein expression, which contributed to ER-associated
          oxidative stress.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40466971
      reference_title: IRE1α-mediated endoplasmic reticulum stress response regulates oxidative damage
