          modifier: ABNORMAL
          term:
            id: GO:0009952
            label: anterior/posterior pattern specification
      selected_evidence:
        snippet: Exome sequencing of affected family members detected only seven shared, rare, heterozygous,
          nonsynonymous variants, including one protein truncating variant, a HOXA2 nonsense change (c.703C>T,
          p.Q235*).
        supports: SUPPORT
