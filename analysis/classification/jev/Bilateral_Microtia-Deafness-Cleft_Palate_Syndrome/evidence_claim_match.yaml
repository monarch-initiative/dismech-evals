      assertion:
        name: HOXA2 Loss of Function
        biological_scale: MOLECULAR
        description: Two allele classes have been reported. Heterozygous nonsense alleles (p.Lys213*,
          p.Glu224*, p.Gln235*) truncate the protein and act by haploinsufficiency. The recessive allele
          is instead a homeodomain missense, p.Q186K, at a highly conserved residue; homology modelling
          predicts the mutant lysine side chain sits further from a nearby phosphate group, losing a hydrogen
          bond and impairing DNA binding.
        genes:
        - preferred_term: HOXA2
          term:
            id: hgnc:5103
            label: HOXA2
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        biological_processes:
