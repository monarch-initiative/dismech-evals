        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hoxa2_sensorineural_component_unexplained
        kind: KNOWLEDGE_GAP
        prompt: What accounts for the sensorineural component of the mixed hearing impairment in the recessive
          HOXA2 family?
        attaches_to:
        - phenotypes#Mixed Hearing Impairment
        rationale: The arch-patterning mechanism accounts naturally for a conductive loss, since the middle-ear
          ossicles are arch derivatives and are duplicated or absent in the mouse null. The recessive
          family's loss is explicitly mixed and severe to profound, so a cochlear or neural component
          is present that the second-arch skeletal lesion does not explain. Neither the human reports
          nor the mouse studies cited here characterise inner-ear structure or function in HOXA2 loss
          of function, and the dominant families' hearing impairment is not audiologically subtyped in
          the published abstracts, so it is not known whether a sensorineural component is general to
          the disorder or specific to the p.Q186K family.
      selected_evidence:
        snippet: We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral
          microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
