      assertion_type: Genetic
      assertion:
        name: HOXA2 pathogenic variants
        association: Causal
        relationship_type: CAUSATIVE
        presence: Pathogenic
        gene_term:
          preferred_term: HOXA2
          term:
            id: hgnc:5103
            label: HOXA2
        notes: HOXA2 lies in the HOXA cluster at 7p15.2 and was reached by genome-wide linkage in the
          original recessive family before exome sequencing found the dominant nonsense alleles. Four
          HOXA2 alleles had been reported before the Chinese families added a fifth.
        variants:
        - name: p.Q186K homeodomain missense (recessive)
          description: A homozygous missense change at a highly conserved homeodomain residue, absent
            from 231 Iranian and 109 Belgian controls. Homology modelling predicts impaired DNA binding;
            the variant has not been assayed functionally.
          clinical_significance: PATHOGENIC
        - name: p.Q235* nonsense (dominant)
          description: A recurrent heterozygous nonsense allele, found independently in a three-generation
            US family and in one of the two Chinese families.
          clinical_significance: PATHOGENIC
