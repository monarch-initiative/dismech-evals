      assertion_type: Subtype
      assertion:
        name: AR-MHIC
        display_name: Autosomal recessive microtia, hearing impairment and cleft palate (HOXA2 p.Q186K)
        description: The presentation for which the MONDO/OMIM concept is named, described in one consanguineous
          Iranian family homozygous for the HOXA2 homeodomain missense p.Q186K. Bilateral microtia occurs
          together with severe to profound mixed hearing impairment and partial cleft palate. Cleft palate
          has not been reported in any of the dominant nonsense families.
        genes:
        - preferred_term: HOXA2
          term:
            id: hgnc:5103
            label: HOXA2
      selected_evidence:
        snippet: We ascertained a consanguineous Iranian family segregating with autosomal-recessive bilateral
          microtia, mixed symmetrical severe to profound hearing impairment, and partial cleft palate.
        supports: SUPPORT
