          value:
            name: Hoxa1/Hoxa2 double mutant mouse (Barrow 1999)
            species: Mouse
            genotype: Compound targeted allele disrupting both of the linked genes Hoxa1 and Hoxa2
            publication: PMID:10529419
            description: 'A single allele disrupting both linked genes, analysed against the single mutants.
              Some double-mutant craniofacial defects are additive combinations of the single-mutant ones
              and others appear only in the double mutant. The result that matters here is a rescue: compensatory
              defects associated with loss of Hoxa1 restore the hyoglossus attachment that is blocked
              in Hoxa2 mutants, and the penetrance of cleft palate falls sharply.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Mis-Attachment of the Extrinsic Tongue and Hyoid Muscles
        relationship: RESCUES
        fidelity: MODERATE
        description: Loss of Hoxa1 on the Hoxa2-mutant background restores normal attachment of the hyoglossus
          to the greater horn of the hyoid.
        limitations: The rescue is by a second mutation rather than by restoring Hoxa2 or by any treatment,
          so it establishes that the palate depends on the attachment without showing how the attachment
          is normally specified. It is also a mouse result with no human counterpart.
        readouts:
        - name: Hyoglossus attachment to the greater horn of the hyoid
          target: Mis-Attachment of the Extrinsic Tongue and Hyoid Muscles
          direction: RESTORED
          interpretation: The attachment blocked in Hoxa2 single mutants is made again in the double mutants.
      selected_evidence:
        snippet: To understand how these two genes function together in craniofacial development, an allele
          was generated that disrupts both of these linked genes.
        supports: SUPPORT
