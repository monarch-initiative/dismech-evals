            term:
              id: MONDO:0012854
              label: bilateral microtia-deafness-cleft palate syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hoxa2_mouse_null_lethality_vs_human_viability
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why does complete Hoxa2 loss kill mice at birth with a full second-to-first arch homeotic
          transformation, while human HOXA2 loss-of-function alleles produce a viable, largely isolated
          ear malformation?
        attaches_to:
        - pathophysiology#Homeotic Transformation of Second-Arch Skeletal Derivatives
        - animal_models#Hoxa2 null mouse (Rijli 1993)
        - animal_models#Hoxa-2 null mouse (Gendron-Maguire 1993)
        rationale: 'The two 1993 mouse nulls die within 24 hours with cleft palate, absent second-arch
          skeletal elements, and duplicated middle-ear ossification centres. No reported human patient
          has anything approaching this: the recessive family has bilateral microtia, mixed hearing loss
          and a partial cleft palate with normal survival, and the four dominant families have largely
          isolated microtia. Part of the gap is dose - human dominant disease is heterozygous and the
          human recessive allele is a missense with residual protein rather than a null - and the conditional
          study shows that the timing of Hoxa2 removal alone spans absent to merely hypoplastic auricle.
          But no human biallelic null has been reported, so whether a human HOXA2 null would be lethal
          is unknown, and the relative contribution of dose, timing, and species difference in arch patterning
          has not been separated. This matters for interpreting the mouse skeletal phenotype as a model
          of the human ossicular defect.'
      selected_evidence:
        snippet: Mice homozygous for a targeted mutation of the Hoxa-2 (Hox 1.11) gene are born with cleft
          palates and die within 24 hr of birth.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7903600
      reference_title: Hoxa-2 mutant mice exhibit homeotic transformation of skeletal elements derived
