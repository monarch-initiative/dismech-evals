              label: bilateral parasagittal parieto-occipital polymicrogyria
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FIG4 Loss of Function
        description: Biallelic pathogenic variants in FIG4 impair the polyphosphoinositide 5-phosphatase
          it encodes. FIG4 is a catalytic subunit of the PI(3,5)P2 biosynthetic complex (with the kinase
          PIKFYVE and the scaffold VAC14). Loss of FIG4 removes both its catalytic activity and a non-catalytic,
          complex-stabilizing role, and because FIG4 is also required for normal PIKFYVE activity, its
          loss reduces rather than raises PI(3,5)P2. A catalytically inactive FIG4 transgene still prevents
          the early vacuolization and neurodegeneration, indicating that much of the early defect reflects
          loss of the structural role rather than catalysis.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: FIG4
          term:
            id: hgnc:16873
            label: FIG4
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity
          term:
            id: GO:0043813
            label: phosphatidylinositol-3,5-bisphosphate 5-phosphatase activity
          modifier: DECREASED
      selected_evidence:
        snippet: A homozygous missense mutation (p.Asp783Val) in the phosphoinositide phosphatase gene
          FIG4 was identified.
        supports: SUPPORT
