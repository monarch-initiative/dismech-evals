      reference_title: 'Primary brain calcification: an international study reporting novel variants and
        associated phenotypes.'
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies primary familial brain calcification and variable onset, retaining the distinction
        between pathogenic/likely pathogenic variants and variants of uncertain significance.
