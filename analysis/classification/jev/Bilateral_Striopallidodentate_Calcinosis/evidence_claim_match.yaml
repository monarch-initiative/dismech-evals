            term:
              id: MONDO:0008947
              label: bilateral striopallidodentate calcinosis
        context: []
      assertion_type: Genetic
      assertion:
        name: RRP12
        gene_term:
          preferred_term: RRP12
          term:
            id: hgnc:29100
            label: RRP12
        association: Candidate
        relationship_type: UNKNOWN
        features: Biallelic RRP12 missense variants were reported in four families with brain calcification,
          with reduced RRP12 protein and abnormal nucleolar morphology in patient fibroblasts. The founding
          report describes RRP12 as having an essential role in RNA metabolism, which places the gene
          on the nucleic-acid-metabolism axis of brain calcification rather than on the phosphate-transport
          or neurovascular-unit axes the other eight genes occupy. No pathophysiology node is curated
          for it here, because the reported functional work establishes that the variants reduce RRP12
          protein and disturb the nucleolus, not how either step reaches calcium-phosphate deposition;
          the zebrafish knockdown in that report gave developmental delay, crimping and early lethality
          rather than a calcification phenotype.
        inheritance:
        - name: Autosomal Recessive
        notes: '`relationship_type: UNKNOWN` with `association: Candidate` follows the founding report''s
          own conclusion, which calls RRP12 "a novel candidate gene" rather than an established cause.
          Four families with biallelic variants and a protein-level readout is real support, but the two
          large screening cohorts it drew on (France n = 111, China n = 543) yielded three further individuals
          between them, its own zebrafish knockdown produced developmental delay and lethality rather
          than calcification, and the current ClinGen Gene-Disease Validity table (file created 2026-09-25,
          downloaded from the unversioned URL pinned in data/clingen/MANIFEST.yaml) contains no RRP12
          assertion - nor any assertion for the other eight genes on this entry, so that silence is about
          the panel''s coverage of this disease rather than about RRP12 specifically.'
      selected_evidence:
        snippet: Screening of two large cohorts of patients with unresolved brain calcifications revealed
          two affected French siblings and one unrelated Chinese individual, each carrying rare, biallelic,
          missense variants in the RRP12 gene
        supports: SUPPORT
    origin:
      assertion_path: /genetic/8
      evidence_path: /genetic/8/evidence/0
