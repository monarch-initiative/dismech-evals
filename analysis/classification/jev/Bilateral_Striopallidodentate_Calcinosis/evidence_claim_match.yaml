      assertion_type: ProgressionInfo
      assertion:
        phase: Variable onset and age-dependent expressivity
        notes: Symptoms may begin in childhood or late adulthood, and some genetically affected individuals
          remain asymptomatic despite calcifications on imaging.
      selected_evidence:
        snippet: Primary familial brain calcification (PFBC) is a rare cerebral microvascular calcifying
          disorder with a wide spectrum of motor, cognitive, and neuropsychiatric symptoms. ... Our study
          aimed at screening the coding regions of these genes in a series of 177 unrelated probands that
          fulfilled the diagnostic criteria for primary brain calcification regardless of their family
          history. ... We identified 45 probands (25.4%) carrying either pathogenic or likely pathogenic
          variants (n = 34, 19.2%) or VUS (n = 11, 6.2%). ... A total of 81.5% of carriers were symptomatic
          and the most recurrent symptoms were parkinsonism, cognitive impairment, and psychiatric disturbances
          (52.3%, 40.9%, and 38.6% of symptomatic individuals, respectively), with a wide range of age
          at onset (from childhood to 81 years).
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/0
      context_paths:
