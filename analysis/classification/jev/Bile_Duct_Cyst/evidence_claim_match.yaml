        hypothesis_label: Pancreaticobiliary Maljunction (Reflux) Theory
        status: CANONICAL
        description: The pathograph in this entry follows this theory. An anomalous junction of the pancreatic
          and common bile ducts outside the duodenal wall creates a long common channel beyond sphincter
          control, activated pancreatic enzymes reflux persistently into the biliary tree, and the resulting
          chronic epithelial injury produces both the dilatation and, over decades, the hyperplasia-dysplasia-carcinoma
          sequence.
        notes: The two theories are not mutually exclusive, and different Todani types may arise by different
          mechanisms. Type V is separate again - see the entry notes.
