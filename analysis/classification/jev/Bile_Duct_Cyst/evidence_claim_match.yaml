      assertion_type: AnimalModel
      assertion:
        name: Surgical APBDU mongrel puppy
        species: Dog
        publication: PMID:17021737
        description: A surgical model in which the pancreatic duct is anastomosed to the bile duct, reproducing
          the anomalous union without any congenital lesion. It is the most direct available test of the
          reflux theory, because the maljunction is the only variable introduced.
        modeled_mechanisms:
        - target: Cystic Dilatation of the Bile Duct
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Surgically created maljunction alone is sufficient to produce bile duct dilatation
            and wall thickening in a previously normal duct.
          limitations: Three months of follow-up against a human course measured in decades, so it speaks
            to the dilatation and early mucosal change but not to carcinoma. The surgical junction is
            also an acute construction rather than a duct that formed abnormally in embryogenesis.
          readouts:
          - name: Bile duct dilatation and wall thickening
            target: Cystic Dilatation of the Bile Duct
            direction: INCREASED
            interpretation: The structural lesion appears in the control animals, which carry the maljunction
              without sphincteroplasty.
        - target: Chronic Biliary Epithelial Injury
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The mucosal response to the surgically created maljunction is epithelial hyperplasia,
            the same proliferative change that begins the human sequence.
          limitations: Hyperplasia only; the model does not run long enough to show dysplasia or carcinoma.
      selected_evidence:
        snippet: A well-established model of APBDU was produced in both groups.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
