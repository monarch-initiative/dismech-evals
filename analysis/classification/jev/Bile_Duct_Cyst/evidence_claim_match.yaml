      assertion_type: Pathophysiology
      assertion:
        name: Cystic Dilatation of the Bile Duct
        description: 'The defining anatomical lesion and the reason the condition is named as it is. The
          pressure relationship is counterintuitive and worth stating explicitly: intracystic pressure
          correlates inversely with cyst volume and inversely with common channel length, and high-pressure
          cysts were those with a normal pancreaticobiliary junction. The maljunction cysts modelled here
          are therefore the low-pressure, high-volume, high-amylase ones, in which enzyme exposure rather
          than raised pressure damages the wall; raised pressure instead tracks with hepatic parenchymal
          injury.'
        locations:
        - preferred_term: extrahepatic bile duct
          term:
            id: UBERON:0003703
            label: extrahepatic bile duct
      selected_evidence:
        snippet: High pressure cysts had normal pancreaticobiliary junction.
        supports: SUPPORT
