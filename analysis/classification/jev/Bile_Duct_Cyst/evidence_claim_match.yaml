        hypothesis_label: Congenital Distal Obstruction Theory
        status: ALTERNATIVE
        description: The competing account, in which antenatal obstruction of the distal bile duct (or
          unequal epithelial proliferation during embryonic duct development) produces proximal dilatation,
          with the maljunction being an associated anomaly rather than the cause. It is recorded here
          because it is unresolved, not because this entry adopts it. It has more purchase in the cases
          without a demonstrable long common channel.
      selected_evidence:
        snippet: The exact etiology of CCs is currently unknown. The two leading theories involve either
          the presence of an anomalous pancreatico-biliary junction with associated reflux of pancreatic
          juice into the biliary system or, more recently, some form of antenatal biliary obstruction
          with resulting proximal bile duct dilation.
