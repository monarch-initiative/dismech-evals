        - path: /animal_models/1
          value:
            name: Dibutyltin dichloride (DBTC) rat
            species: Rat
            publication: PMID:26176076
            description: A chemically induced rat model of choledochal cyst used to time the molecular
              events. It is the source of the proposal that HDAC1 acts upstream of COX-2 in this carcinogenic
              sequence.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Hyperplasia-Dysplasia-Carcinoma Sequence
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        description: Reproduces duct dilatation followed by papillary epithelial proliferation with a
          rising proliferative index, and orders HDAC1 induction before the other markers.
        limitations: Chemically induced rather than anatomic - there is no maljunction and no pancreatic
          enzyme reflux - so it models the epithelial proliferative response rather than its human cause.
          It also stops at proliferation markers over fourteen days and does not reach carcinoma.
        readouts:
        - name: HDAC1 expression
          target: Hyperplasia-Dysplasia-Carcinoma Sequence
          direction: INCREASED
          interpretation: HDAC1 rises before the other markers, which is the basis for placing it upstream
            in the proposed sequence.
      selected_evidence:
        snippet: These findings suggested that HDAC1 played an important role in carcinogenesis of PBM
          through the regulation of COX-2.
        supports: SUPPORT
