          of Oddi. The sphincter therefore cannot regulate the junction, and the two duct systems communicate
          freely.
        locations:
        - preferred_term: common bile duct
          term:
            id: UBERON:0001174
            label: common bile duct
        - preferred_term: pancreatic duct
          term:
            id: UBERON:0007329
            label: pancreatic duct
      selected_evidence:
        snippet: They are thought to arise from an anomalous pancreaticobiliary junction, which are congenital
          anomalies between pancreatic and bile ducts.
        supports: SUPPORT
