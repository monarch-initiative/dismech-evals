      assertion_type: Pathophysiology
      assertion:
        name: Cholestasis and Progression to Biliary Cirrhosis
        conforms_to: cholestatic_liver_injury#Biliary Fibrosis Progressing to Biliary Cirrhosis
        biological_scale: ORGANISM
        description: Obliteration of the biliary tree blocks bile flow, causing cholestasis with accumulation
          of conjugated bilirubin and bile acids. Retained bile constituents are hepatotoxic and, together
          with ongoing portal fibrosis, drive progression to biliary cirrhosis, portal hypertension, and
          ultimately end-stage liver disease. Even after a technically successful Kasai procedure, intrahepatic
          disease frequently progresses, which is why most patients eventually require liver transplantation.
        biological_processes:
        - preferred_term: bile acid secretion
          modifier: DECREASED
          term:
            id: GO:0032782
            label: bile acid secretion
      selected_evidence:
        snippet: Biliary atresia is a progressive fibrosing obstructive cholangiopathy of the intrahepatic
          and extrahepatic biliary system, resulting in obstruction of bile flow and neonatal jaundice.
        supports: SUPPORT
