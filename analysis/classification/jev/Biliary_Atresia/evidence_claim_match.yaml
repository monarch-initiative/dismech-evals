        context: []
      assertion_type: Inheritance
      assertion:
        name: Non-Mendelian / multifactorial
        description: 'Biliary atresia is overwhelmingly sporadic and non-Mendelian: twin studies show
          very high discordance (including monozygotic pairs) and familial recurrence is rare, implicating
          gene-environment, epigenetic, or stochastic contributions on top of genetic susceptibility.
          The syndromic BASM subtype with biallelic PKD1L1 variants is the exception, suggesting an autosomal
          recessive contribution in that specific form.'
        inheritance_term:
          preferred_term: Non-Mendelian inheritance
          term:
            id: HP:0001426
            label: Non-Mendelian inheritance
      selected_evidence:
        snippet: 97.1% twins were discordant, among 55.9% of which were monozygotic twin sets, indicating
          that BA may be related to genetic phenotype or penetrance.
        supports: SUPPORT
    origin:
