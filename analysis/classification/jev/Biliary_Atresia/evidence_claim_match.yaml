        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cholangiocyte Injury of the Bile Duct Epithelium
        biological_scale: CELLULAR
        description: The initiating lesion is injury to the cholangiocytes lining the extrahepatic (and
          later intrahepatic) bile ducts. Candidate insults include perinatal hepatotropic viral infection
          (cytomegalovirus, reovirus, rotavirus), exposure to a plant/environmental toxin (the isoflavonoid
          biliatresone, which causes an analogous extrahepatic cholangiopathy in livestock and zebrafish),
          and defective bile duct morphogenesis. Cholangiocyte apoptosis and loss of epithelial integrity
          expose ductal antigens and initiate the downstream inflammatory cascade.
        cell_types:
        - preferred_term: extrahepatic cholangiocyte
          term:
            id: CL:0019020
            label: extrahepatic cholangiocyte
        - preferred_term: intrahepatic cholangiocyte
          term:
            id: CL:0002538
            label: intrahepatic cholangiocyte
        biological_processes:
        - preferred_term: cholangiocyte apoptotic process
          modifier: INCREASED
          term:
            id: GO:1902488
            label: cholangiocyte apoptotic process
      selected_evidence:
        snippet: Biliatresone has selective toxicity for extrahepatic cholangiocytes (EHCs) in zebrafish
          larvae.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
