      assertion_type: Pathophysiology
      assertion:
        name: Fibro-obliteration of the Biliary Tree
        biological_scale: TISSUE
        conforms_to: fibrotic_response#Excessive ECM Deposition
        description: Activated portal myofibroblasts deposit excess extracellular matrix around and within
          the injured ducts, producing a fibro-obliterative process that progressively narrows and obliterates
          the extrahepatic biliary tree and damages the intrahepatic ducts, forming the characteristic
          fibrous remnant at the porta hepatis. This obliteration is the anatomic substrate that the Kasai
          portoenterostomy attempts to bypass.
        biological_processes:
        - preferred_term: collagen fibril organization
          modifier: INCREASED
          term:
            id: GO:0030199
            label: collagen fibril organization
      selected_evidence:
        snippet: Histopathological findings in liver biopsies include the expansion of the portal tracts,
          with edematous fibroplasia and bile ductular proliferation, with bile plugs in duct lumen.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
