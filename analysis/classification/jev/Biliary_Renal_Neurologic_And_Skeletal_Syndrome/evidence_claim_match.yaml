              label: biliary, renal, neurologic, and skeletal syndrome
        context:
        - path: /animal_models/0
          value:
            name: Ift56hop homozygous mouse
            species: Mouse
            genotype: Ift56hop (Ttc26) homozygous loss-of-function
            publication: PMID:41352382
            description: 'The same Ift56hop loss-of-function allele produces radically different disease
              depending on mouse strain background: on Balb/cByJ, homozygotes survive to adulthood with
              male sterility and a hopping gait; on C57BL/6J they are perinatal lethal with multiple skeletal
              and organ defects including tracheoesophageal fistula. A modifier of the phenotype maps
              to chromosome 4. This is the most useful thing the mouse says about the human disease, and
              it is a caution rather than a mechanism.

              '
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Multisystem Ciliopathy Organ Involvement
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: Reproduces multisystem congenital anomaly from the same gene, and demonstrates that
          the severity of that anomaly is set by unlinked modifier loci rather than by the causal allele
          alone.
        limitations: 'Severity is background-dependent to the point of changing the verdict: viable adult
          on one strain, perinatal lethal on another, from one allele. The mouse therefore cannot be used
          to predict severity for a human genotype, and the specific phenotypes differ from the human
          ones - male sterility and hopping gait on one background, tracheoesophageal fistula on the other,
          neither reported in patients, and neonatal cholestasis, the defining human feature, not reported
          in either.'
        divergences:
        - divergence_type: POPULATION_MISMATCH
          materiality: QUALIFYING
          description: The two strains are isogenic populations differing at a mapped chromosome 4 modifier.
            Human patients are outbred and each carries an unknown modifier background, so the model demonstrates
            that modifiers dominate without identifying which ones apply to any patient.
        - divergence_type: OTHER
          materiality: QUALIFYING
          description: 'Incomplete phenotype: severe neonatal cholestasis, the defining and most consequential
            human phenotype, is not among the reported mouse phenotypes on either background. Recorded
            as OTHER because ModelDivergenceTypeEnum has no value for a model that simply does not express
            part of the disease - see dismech#11743.'
      selected_evidence:
        snippet: we demonstrate that in the C57BL/6J background, Ift56hop homozygotes are perinatal lethal,
          and have multiple skeletal and organ defects, including the formation of tracheoesophageal fistulas
        supports: SUPPORT
