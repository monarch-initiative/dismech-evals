              label: biliary, renal, neurologic, and skeletal syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Motile Cilia Beat Dysfunction
        description: 'The second arm of the disease, and the one the Hedgehog account does not reach.
          The cargo this IFT-B component carries is specifically enriched for motility-related proteins,
          so losing it produces short cilia that beat abnormally while IFT particle assembly and speed
          stay normal. In the brain, ependymal motile cilia drive cerebrospinal fluid flow, and failure
          of that beat is the accepted route from a ciliopathy gene to hydrocephalus - which in this disease
          presents with aqueductal stenosis and needed shunting.

          '
        biological_scale: CELLULAR
        conforms_to: ciliopathy_dysfunction#Motile Cilia Beat Dysfunction
        biological_processes:
        - preferred_term: cilium movement
          modifier: DECREASED
          term:
            id: GO:0003341
            label: cilium movement
        - preferred_term: cerebrospinal fluid circulation
          modifier: DECREASED
          term:
            id: GO:0090660
            label: cerebrospinal fluid circulation
      selected_evidence:
        snippet: Proteomic and biochemical analyses indicated a particular set of proteins involved in
          motility was specifically depleted in the dyf13 mutant.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
