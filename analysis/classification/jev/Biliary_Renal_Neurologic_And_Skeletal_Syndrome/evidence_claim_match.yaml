              and ciliary beating. The direction of beat-frequency change depends on the tissue: zebrafish
              Kupffer vesicle cilia beat more slowly, whereas pronephric cilia show faster but poorly
              coordinated beating. A contribution to human hydrocephalus is plausible but unproven; aqueductal
              obstruction is also documented clinically.'
            biological_scale: CELLULAR
            mechanism_confidence: HYPOTHETICAL
