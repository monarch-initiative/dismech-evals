      assertion_type: Discussion
      assertion:
        discussion_id: brns_prmt7_candidate_mechanism
        kind: EMERGING_HYPOTHESIS
        prompt: Does altered ciliary PRMT7 localization contribute to Hedgehog dysfunction in biallelic
          TTC26 disease?
        attaches_to:
        - pathophysiology#Dysregulated Sonic Hedgehog Signalling
        rationale: An adolescent idiopathic scoliosis study identified TTC26-dependent ciliary PRMT7 localization
          and GLI2 methylation in nucleus-pulposus cell experiments. Its mouse model combined heterozygous
          Flnb and Ttc26 mutations, rather than biallelic TTC26 disease. Artificially targeting PRMT7
          to cilia restored cellular signaling, and local Ptch1/Sufu knockdown improved tail-disc matrix
          endpoints. Transfer to BRENS organs remains untested; FLNB is not an established BRENS modifier,
          and these experiments do not establish a clinical therapy.
      selected_evidence:
        snippet: We find that TTC26 is required for the localization of protein arginine methyltransferase
          7 (PRMT7) to the primary cilium, enabling methylation of GLI2, while FLNB binds methylated GLI2
          to promote its nuclear import.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
