              label: biliary, renal, neurologic, and skeletal syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abnormal ciliary IFT-B protein localization
        description: Patient cells have abnormal IFT-B staining. In hop mouse cells, IFT81 and IFT27 are
          reduced in cilia, whereas IFT88 distribution changes with tissue and compartment. Other IFT
          components and ciliary proteins can remain normally localized. These selective defects do not
          imply that all IFT movement ceases; algal particle velocities were similar after controlling
          for flagellar length.
        biological_scale: CELLULAR
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        biological_processes:
        - preferred_term: intraciliary transport
          term:
            id: GO:0042073
            label: intraciliary transport
          modifier: ABNORMAL
      selected_evidence:
        snippet: We show that cilia in TTC26-mutated patient cells display variable length and impaired
          function, as indicated by dysregulated sonic hedgehog signaling, abnormal staining for IFT-B
          components, and transcriptomic clustering with cells derived from individuals with closely related
          ciliopathies.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
