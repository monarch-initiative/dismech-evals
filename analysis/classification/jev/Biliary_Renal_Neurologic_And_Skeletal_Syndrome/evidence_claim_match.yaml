        description: Ciliary Hedgehog signaling is altered in patient cells. Mouse studies demonstrate
          impaired GLI activator and repressor functions, with residual pathway activity. One study found
          preserved stimulated GLI tip accumulation with impaired GLI-SUFU dissociation; another found
          reduced GLI tip accumulation in culture and embryonic tissues. Stimulation conditions may contribute
          to this difference. Reduced GLI repressor activity offers a model-based explanation for polydactyly;
          the evidence does not establish Hedgehog failure as the mechanism of every hepatic, renal, ocular
          or endocrine feature.
        biological_scale: CELLULAR
        conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
