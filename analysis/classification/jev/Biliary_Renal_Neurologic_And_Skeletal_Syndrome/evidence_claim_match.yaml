            term:
              id: MONDO:0859191
              label: biliary, renal, neurologic, and skeletal syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: TTC26
        gene_term:
          preferred_term: TTC26
          term:
            id: hgnc:21882
            label: TTC26
        relationship_type: CAUSATIVE
        notes: 'TTC26, renamed IFT56 by HGNC, encodes a component of the IFT-B complex, also known as
          DYF13 after its Chlamydomonas ortholog. An earlier version of this note said it is "not one
          of the IFT-B core subunits"; that is wrong, and a paper cited here refutes it - TTC26/IFT56
          is an integral component of the IFT-B **core** subcomplex, and loss of it prevents other core
          IFT-B proteins accumulating normally in cilia.

          What "atypical" in the index report actually refers to is cargo selectivity, not subcomplex
          position, and that is the more interesting fact. Unlike other IFT-B mutants, dyf13 mutant flagella
          assemble IFT particles at normal speed; what is lost is a particular subset of cargo, specifically
          motility-related proteins. So this is a core component whose loss removes some cargo classes
          and not others - which is why the disease has both a primary-cilium (Hedgehog) and a motile-cilium
          arm, and why the cilium is built rather than absent.

          Reported human alleles are homozygous missense, splice and loss-of-function changes; the recurrent
          c.695A>G p.Asn232Ser allele accounts for the four patients in the pituitary series, and a homozygous
          intronic c.1006-5T>C variant is reported in a further patient.

          '
      selected_evidence:
        snippet: TTC26 (intraflagellar transport [IFT] 56/DYF13) is an atypical component of IFT-B complex,
          and deficiency of its highly conserved orthologs has been consistently shown to cause defective
          ciliary function in several model organisms.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
