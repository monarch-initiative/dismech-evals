      selected_evidence:
        snippet: The proper movement of cilia helps in the flow of cerebrospinal fluid, and the disruption
          of proper movement (beating) by irregular planar cell polarity causes the accumulation of cerebrospinal
          fluid resulting in hydrocephalus
