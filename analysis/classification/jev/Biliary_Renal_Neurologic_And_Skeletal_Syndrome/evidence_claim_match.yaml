  faaad5b6b9e5e1ac4adaf2d34b97357801368dbc8708fa356b425a0d5f9e3905:
    claim:
      about:
        disease:
          name: Biliary, Renal, Neurologic, and Skeletal Syndrome
          disease_term:
            preferred_term: biliary, renal, neurologic, and skeletal syndrome
            term:
              id: MONDO:0859191
              label: biliary, renal, neurologic, and skeletal syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: brns_modifier_loci_explain_variability
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the chromosome 4 modifier effect seen in Ift56hop mice have a human counterpart that
          explains why one TTC26 patient dies in the neonatal period and another reaches liver transplantation
          and survives?
        attaches_to:
        - animal_models#Mouse
        - genetic#TTC26
        rationale: Human TTC26 disease is strikingly variable in severity for a recessive disorder in
          which patients are homozygous - one death, two transplants and four survivors among the first
          seven, and a later group of four sharing one allele who present with pituitary rather than hepatic
          disease as their distinguishing feature. The mouse work shows that for this exact gene, one
          loss-of-function allele can be compatible with adult life or perinatally lethal depending only
          on unlinked background, with a modifier mapped to chromosome 4. That is a mechanism for the
          human variability that does not require invoking allele severity, and the human cohorts are
          far too small to test it. Recorded as HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP because
          the evidence exists and is strong; what is unknown is whether the modifier architecture transfers,
          and the mouse experiment - fixing genotype and varying background - cannot be run in people.
      selected_evidence:
        snippet: This could lead to the same mutation causing distinct effects in different individuals.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
