        context: []
      assertion_type: Genetic
      assertion:
        name: TTC26
        gene_term:
          preferred_term: TTC26
          term:
            id: hgnc:21882
            label: TTC26
        relationship_type: CAUSATIVE
        notes: TTC26/IFT56 is an IFT-B core protein. Reported disease-associated genotypes include homozygous
          missense, splice-site and truncating alleles, and a compound-heterozygous genotype. The c.695A>G
          (p.Asn232Ser) allele recurs in the pituitary series. For c.4-1G>C (NM_024926.3), prior transcript
          work showed exon skipping, and a subsequent patient study measured reduced TTC26 RNA. The intronic
          c.1006-5T>C allele affects splicing. A later compound genotype contains a maternal c.1069+5G>A
          allele and a paternal cis pair, p.Ile171Val and p.Ser367Pro; the contribution of each change
          cannot be separated from that report. These observations do not imply identical molecular effects
          or severity for every allele.
        variants:
        - name: c.4-1G>C (NM_024926.3)
          variant_type: single nucleotide variant
          genomic_contexts:
          - intron
          description: Homozygous splice-acceptor variant reported in the defining study and a subsequent
            Saudi patient. Exon skipping was demonstrated in the earlier study; the later study supports
            reduced transcript abundance.
        - name: c.695A>G (p.Asn232Ser), as reported
          variant_type: single nucleotide variant
          description: Homozygous missense allele in the four-patient pituitary series. The published
            amino-acid numbering is retained without assuming interchangeability with other isoforms.
        - name: c.1006-5T>C
          variant_type: single nucleotide variant
          genomic_contexts:
          - intron
          description: Homozygous intronic splice-region variant reported in a patient with pituitary,
            hepatic, renal, cardiac and craniofacial involvement. Splicing disruption, rather than a demonstrated
            enhancer effect, is implicated.
        - name: Maternal c.1069+5G>A / paternal [c.511A>G; c.1099T>C]
          description: Compound-heterozygous genotype in a biliary-sparing patient. The two paternal missense
            changes occur in cis; the maternal splice-region change is on the other allele. Individual
            effects remain unresolved.
      selected_evidence:
        snippet: Positional mapping revealed a single critical locus on chromosome 7. Whole-exome sequencing
          revealed three different homozygous variants in Tetratricopeptide Repeat Domain 26 (TTC26) that
          fully segregated with the phenotype.
        supports: SUPPORT
        directness: DIRECT
