        context: []
      assertion_type: AnimalModel
      assertion:
        name: Ift56hop homozygous mouse
        species: Mouse
        genotype: Ift56hop (Ttc26) homozygous loss-of-function
        publication: PMID:41352382
        description: The homozygous Ift56hop premature-stop allele produces markedly different phenotypes
          on BALB/cByJ and C57BL/6J backgrounds. Adult survivors with sterility and a hopping gait occur
          on BALB/cByJ, while C57BL/6J homozygotes are perinatally lethal with multiple malformations.
          A chromosome 4 modifier locus was mapped; the causal modifier gene and its relevance to human
          patients are unresolved.
        modeled_mechanisms:
        - target: TTC26 functional impairment
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Models reduced IFT56 function and background-dependent developmental outcomes.
            These experiments establish modifier effects in mice without identifying a human modifier
            architecture.
          limitations: Severity and organ involvement depend on allele and strain. The 2014 study found
            normal kidney and retinal histology in examined adult hop mice, whereas human patients can
            have renal and ocular abnormalities. Severe neonatal cholestasis is not established as a recapitulated
            endpoint in the cited model reports. Mouse background effects cannot predict individual human
            severity.
          divergences:
          - divergence_type: POPULATION_MISMATCH
            materiality: QUALIFYING
            description: Inbred strain backgrounds differ at many loci. Mapping identifies a chromosome
              4 modifier interval but does not show that this is the sole difference between strains or
              that the same locus modifies human BRENS.
          - divergence_type: OTHER
            materiality: QUALIFYING
            description: The cited mouse reports do not establish the severe neonatal cholestatic phenotype
              that is prominent in human BRENS.
      selected_evidence:
        snippet: Using Single Nucleotide Polymorphisms (SNPs) that differ between these mouse strains,
          we show that a modifier of the Ift56hop phenotype maps to Chromosome 4.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41352382
      reference_title: Genetic background influences the extent and severity of cilia-related congenital
