  e8e9528aac4abeba354f3bb8278b0360848be8acb47ec3b60283775be17692bb:
    claim:
      about:
        disease:
          name: Biliary, Renal, Neurologic, and Skeletal Syndrome
          disease_term:
            preferred_term: biliary, renal, neurologic, and skeletal syndrome
            term:
              id: MONDO:0859191
              label: biliary, renal, neurologic, and skeletal syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Sonic Hedgehog Signalling
        description: 'Sonic hedgehog signalling is dysregulated in patient cells. Because Hedgehog transduction
          is obligately ciliary in vertebrates, this is the shared downstream step through which a transport
          defect becomes a developmental one, and it is the node that links the limb, brain and pituitary
          phenotypes to the same lesion as the liver and kidney phenotypes.

          Where in Hedgehog transduction the failure sits is **contested**, and this entry does not settle
          it. Two studies of the same Ift56hop allele disagree. One reports that Gli still accumulates
          at the ciliary tip on Hedgehog stimulation and that what fails is the subsequent dissociation
          of Gli from Sufu, explicitly distinguishing Ttc26 from other IFT-B mutants - cargo arrives and
          is not released. The other reports that Ift56hop cilia are unable to accumulate Gli proteins
          efficiently, and that core IFT-B proteins themselves fail to accumulate - cargo does not arrive.
          The disagreement is recorded in a knowledge gap attached to this node.

          What both agree on, and what the downstream nodes rest on, is that Hedgehog transduction fails
          and that the patterning consequences follow from it.

          '
        biological_scale: CELLULAR
        conforms_to: ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction
        biological_processes:
        - preferred_term: smoothened signaling pathway
          modifier: DECREASED
          term:
            id: GO:0007224
            label: smoothened signaling pathway
      selected_evidence:
        snippet: Strikingly, core IFTB proteins are unable to accumulate normally within Ift56hop cilia,
          including IFT88, IFT81 and IFT27, which are crucial for key processes such as tubulin transport
          and Shh signaling.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/4
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28264835
      reference_title: IFT56 regulates vertebrate developmental patterning by maintaining IFTB complex
        integrity and ciliary microtubule architecture.
      evidence_source: MODEL_ORGANISM
      explanation: Supports the upstream claim that the IFT-B complex itself is destabilised, which is
        the mechanism by which this account explains the Hedgehog failure.
