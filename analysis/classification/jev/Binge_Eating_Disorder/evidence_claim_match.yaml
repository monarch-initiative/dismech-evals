      assertion_type: Definition
      assertion:
        name: DSM-5-TR and ICD-11 clinical diagnostic boundary
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: Clinical diagnosis requires recurrent binge-eating episodes with loss of control
          and marked distress. Episodes occur at least weekly for at least three months. DSM-5-TR additionally
          requires at least three associated features. Recurrent inappropriate compensatory behavior is
          absent, and the episode pattern must not be better explained by bulimia nervosa or the binge-eating/purging
          presentation of anorexia nervosa. Specific wording differs between the two manuals; body size
          and overvaluation of shape or weight are not required criteria.
        scope: Clinical diagnosis under current DSM-5-TR and ICD-11 criteria
      selected_evidence:
        snippet: According to the criteria in both diagnostic manuals, these episodes must occur at least
          once a week for a minimum of three months and be accompanied by distress regarding the binge
          eating.
        supports: SUPPORT
