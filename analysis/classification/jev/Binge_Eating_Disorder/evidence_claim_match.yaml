    evidence_metadata:
      reference: PPR:PPR1274137
      reference_title: A randomized controlled trial (RCT) of Juniver, a new digital intervention for
        eating disorder symptoms
      evidence_source: HUMAN_CLINICAL
      explanation: 'The trial''s headline efficacy result. Read with two limits that keep it from being
        direct support for a BED-specific claim. First, the sample is transdiagnostic, not BED: inclusion
        was self-identified eating disorder of any kind with no diagnostic assessment, and 37% (n=131)
        reported purging, which is exclusionary for BED under DSM-5. Second, the primary outcome is global
        eating-disorder symptomatology (EDE-Q), not binge frequency. In the prespecified binge-only subgroup
        (n=193) - the BED analogue - the objective binge-eating difference was largest during the randomized
        period but had attenuated by week 12, the primary endpoint (-1.97 [95% CI, -5.51 to 1.57]; P =
        .272), although EDE-Q global, clinical impairment, and anxiety did hold at week 12 in that subgroup.
        So this supports benefit for eating-disorder symptoms in a mixed sample, and reaches BED only
        by generalizing from it.'
