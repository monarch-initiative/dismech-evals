              label: binge eating disorder
        context: []
      assertion_type: Treatment
      assertion:
        name: Juniver (App-Based Digital Intervention)
        description: Juniver is a smartphone app-based program combining neuroscience-informed CBT, an
          AI support tool configured for eating disorder symptoms, and moderated peer groups to provide
          just-in-time interventions during moments of eating disorder urges. The intervention is tailored
          to individual context and motivation, aiming to support self-management and recovery.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: cognitive behavior therapy
          term:
            id: NCIT:C64345
            label: Cognitive Behavior Therapy
        target_phenotypes:
        - preferred_term: Recurrent binge eating episodes
          term:
            id: HP:0100738
            label: Abnormal eating behavior
        notes: 'Evidence from a preprint publication (not yet peer-reviewed). The trial enrolled participants
          aged >=16 years with eating disorder symptoms; results may not generalize to younger individuals
          or severe eating disorders requiring higher levels of care.


          Sample is not BED. Inclusion was self-identified eating disorder of any diagnosis, including
          unspecified eating disorders, with no diagnostic assessment; 37% (n=131) reported at least one
          purging episode, which is exclusionary for BED under DSM-5. The BED analogue is the prespecified
          binge-only subgroup (n=193), where the objective binge-eating advantage had attenuated by the
          week-12 primary endpoint (-1.97 [95% CI, -5.51 to 1.57]; P = .272), while EDE-Q global, clinical
          impairment, and anxiety remained significantly better at week 12.


          Attrition is severe and differential. Only 38.1% (n=136/357) of participants provided week-12
          primary outcome data, falling to 17.9% (n=64) at week 24, and the control group had lower odds
          of missing data than the Juniver group at every randomized timepoint (week 12 OR 0.26 [95% CI,
          0.16 to 0.42]; p < .001) - so the arm that did better is also the arm that was observed less
          completely.


          Commercial interest declared by the source: "EF is the founder and CEO of Juniver and holds
          equity in the company." Taken with the fact that this is a single non-peer-reviewed preprint,
          this evidence is weaker than the randomized design alone would suggest, and it is currently
          the only support for this treatment entry - the situation issue #6353 cautioned against.


          Quoting limitation: the preprint''s full-text results section carries ti-ligature corruption
          in the cached copy (for example "aƩenuated", "eīects", "parƟcipants"). The subgroup, retention,
          and competing-interest figures above are therefore recorded here as notes rather than as evidence
          snippets. Only the abstract is cleanly quotable.'
      selected_evidence:
        snippet: Adverse events were n=18 for Juniver and n=32 for control, including 1x control participant
          emergency hospitalization. Results support the efficacy and safety of Juniver for eating disorder
          symptoms.
        supports: SUPPORT
