    claim:
      about:
        disease:
          name: Biotin-Thiamine-Responsive Basal Ganglia Disease
          disease_term:
            preferred_term: biotin-thiamine-responsive basal ganglia disease
            term:
              id: MONDO:0011841
              label: biotin-responsive basal ganglia disease
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: Homozygous total-body Slc19a3tm1Said knockout, with a Slc19a3-null intestine-specific
          human SLC19A3 transgenic rescue group (SLC19A3int) as a comparator
        background: JAX stock 017343 knockout embryos were crossed with B6D2F1 females to generate the
          transgenic line; wild-type, knockout, and transgenic littermates were compared.
        category: Knockout and tissue-specific rescue
        alleles:
        - Slc19a3tm1Said (The Jackson Laboratory stock 017343)
        - SLC19A3int (study designation for the intestinal epithelial VIL1-promoter human SLC19A3 transgene;
          integration site and registered allele symbol were not reported)
        description: Total-body loss of Slc19a3 lowered circulating and brain thiamine despite an 85 mg/kg
          thiamine diet and altered the brain metabolome. Intestinal human SLC19A3 expression produced
