      assertion_type: ProgressionInfo
      assertion:
        phase: Untreated symptomatic disease and residual injury
        age_range: Infancy through adulthood
        notes: Untreated profound deficiency can present from infancy through childhood; adolescents and
          adults may present with myelopathy and optic neuropathy. Metabolic, feeding, skin, and respiratory
          findings often respond promptly, whereas established hearing loss, optic atrophy, and developmental
          impairment may not fully reverse.
      selected_evidence:
        snippet: Some symptoms, such as feeding issues, cutaneous manifestations, and respiratory issues,
          usually resolve with biotin therapy, whereas other manifestations presenting prior to biotin
          treatment, such as optic atrophy, hearing loss, and developmental delay, may improve but are
          usually not completely reversible with the initiation of biotin therapy.
        supports: SUPPORT
