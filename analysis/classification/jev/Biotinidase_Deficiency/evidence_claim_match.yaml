          name: Biotinidase Deficiency
          disease_term:
            preferred_term: biotinidase deficiency
            term:
              id: MONDO:0009665
              label: biotinidase deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: BTD gene variants causing biotinidase deficiency
        gene_term:
          preferred_term: BTD
          term:
            id: hgnc:1122
            label: BTD
        variants:
        - name: c.1270G>C (p.Asp424His)
          description: This was the most frequent BTD variant in two Turkish cohorts. In one cohort, 97.3%
            of homozygotes had enzyme activity above 30%, so this genotype should not be equated automatically
            with biochemical partial deficiency without an activity assay. The cited studies use p.Asp424His;
            cross-cohort comparison requires normalization to a specified reference transcript and protein
            sequence. Regional frequency should not be generalized worldwide.
        - name: c.410G>A (p.Arg137His)
          description: This variant was among those associated with the largest enzyme-activity decreases
            and was enriched among neurologically symptomatic individuals in regional cohorts. Those associations
            are not deterministic for an individual patient.
        - name: c.38_44delGCGCTGinsTCC (p.Cys13Phefs*36)
          description: This frameshift was associated with marked enzyme-activity reduction, neurologic
            manifestations, hearing loss, and optic atrophy in regional cohorts. The small numbers and
            inclusion of both homozygous and heterozygous observations limit individual prognostic prediction.
        features: 'Biallelic pathogenic BTD variants reduce biotinidase enzyme activity. Clinical classification
          is anchored to measured residual enzyme activity: profound deficiency is below 10% and partial
          deficiency is 10%-30% of mean normal activity. Regional genotype-phenotype associations can
          support interpretation but do not replace biochemical confirmation.'
      selected_evidence:
        snippet: Two hundred forty-seven cases were included in the study who were admitted to the Department
          of Pediatric Metabolism
        supports: SUPPORT
