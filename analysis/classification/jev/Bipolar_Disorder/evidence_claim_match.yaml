  b6f5cc3dc48b97494598ea64c43f2554c9d7b9f3566591a3535cb47398fad78e:
    claim:
      about:
        disease:
          name: Bipolar Disorder
          disease_term:
            preferred_term: bipolar disorder
            term:
              id: MONDO:0004985
              label: bipolar disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bipolar_episodic_switching_trigger
        prompt: What determines the switch between manic and depressive states in bipolar disorder, and
          in what temporal order do the components of the canonical model change around a switch - does
          calcium dysregulation precede circadian disruption, the reverse, or do both follow an upstream
          trigger not yet in the model?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#canonical_polygenic_synaptic_circadian_dysregulation_model
        - pathophysiology#Intracellular Calcium Dysregulation
        - pathophysiology#Circadian Rhythm Disruption
        rationale: 'Episodic cycling is the defining clinical feature of bipolar disorder and is the part
          of the canonical model with the weakest evidential support. Every pillar curated in this entry
          is a vulnerability or trait finding rather than a transition mechanism, and this shows up consistently
          in the primary sources rather than only in the abstract. The replicated peripheral-cell calcium
          abnormality showed little correlation with mood-rating severity in the series that established
          it (PMID:10418700), so the most reproducible cellular finding in the field is not obviously
          state-coupled. The patient-derived neuron work characterizes hyperexcitability as an early endophenotype
          in young neurons (PMID:26524527), not as a state marker. The strongest causal circadian manipulation
          available produces a single mixed state rather than alternation between separable poles (PMID:20591414).
          The phasic mitochondrial account that does address state (PMID:28093238) is explicitly a proposed
          explanatory model synthesizing cross-sectional comparisons, not a study of transition dynamics:
          comparing manic to euthymic subjects establishes that states differ, which is a different claim
          from establishing what moves a patient between them. This gap is the substantive content of
          the PARTIALLY_SUPPORTED verdict returned by the 2026 OpenScientist assessment of this hypothesis
          - the framework organizes vulnerability well and does not currently explain episodicity - and
          it is why the entry retains CANONICAL status for the vulnerability model without asserting a
          switching mechanism.'
        proposed_experiments:
        - experiment_id: exp_bipolar_peri_switch_longitudinal_multiomics
          name: Densely sampled longitudinal multi-omics through a mood switch
          description: 'Follow rapid-cycling bipolar patients through spontaneous mood transitions with
            dense temporal sampling - weekly peripheral blood for intracellular calcium, transcriptomics,
            cytokines and cortisol, continuous actigraphy and sleep timing for circadian phase, and periodic
            imaging - so that the order in which calcium, circadian and inflammatory measures change relative
            to clinical switch can be established within individuals. Within-subject design is essential:
            cross-sectional comparison of manic and euthymic groups cannot recover temporal ordering.'
          experiment_type:
            preferred_term: longitudinal within-subject observational study
          would_support:
          - pathophysiology#Intracellular Calcium Dysregulation
          - pathophysiology#Circadian Rhythm Disruption
          - mechanistic_hypotheses#canonical_polygenic_synaptic_circadian_dysregulation_model
          would_refute:
          - mechanistic_hypotheses#canonical_polygenic_synaptic_circadian_dysregulation_model
          supporting_outcome:
          - Calcium or circadian measures change reproducibly in a consistent direction and in a consistent
            order in the days preceding clinical switch, across multiple patients and multiple switches,
            which would promote the corresponding node from a trait association to a step in the switching
            mechanism.
          - Circadian phase shift consistently precedes the calcium change, which would order the two
            pillars and identify circadian destabilization as the proximal trigger rather than a parallel
            correlate.
          refuting_outcome:
          - Calcium and circadian measures remain flat across switches, or change only after clinical
            state has already changed, which would establish them as trait vulnerability markers and consequences
            respectively and force the switching trigger to be sought outside the components this model
            names.
          decision_criterion: The model gains a switching mechanism only if a measured change in a curated
            node reliably precedes clinical switch within individuals. Change that follows the switch,
            or that does not replicate across patients, leaves the gap open regardless of effect size.
      selected_evidence:
        snippet: We also found little correlation between calcium measures and the severity of mood rating.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10418700
      reference_title: Elevated basal and thapsigargin-stimulated intracellular calcium of platelets and
        lymphocytes from bipolar affective disorder patients measured by a fluorometric microassay.
      evidence_source: HUMAN_CLINICAL
      explanation: The null result that opens this gap. The same study that established the elevated-calcium
        finding found it did not track mood severity, so the field's most replicated cellular abnormality
        is not demonstrably state-coupled.
