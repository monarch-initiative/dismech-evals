      assertion_type: Pathophysiology
      assertion:
        name: Neuronal Hyperexcitability
        biological_scale: CELLULAR
        description: 'Patient-derived neurons show intrinsic hyperexcitability, offering a cellular endophenotype
          that sits between the ion-channel genetics and the circuit-level findings. iPSC-derived hippocampal
          dentate-gyrus-like granule neurons from bipolar patients fire action potentials hyperactively
          and carry mitochondrial abnormalities relative to control-derived neurons. The finding is also
          a treatment-response stratifier: lithium reverses the hyperexcitability only in neurons from
          donors who were themselves clinical lithium responders. Scope limits -- six manic bipolar I
          donors and four unaffected individuals, one differentiated neuron type, and no demonstration
          that hyperexcitability causes episode switching rather than marking trait vulnerability.

          '
        cell_types:
        - preferred_term: iPSC-derived hippocampal dentate gyrus-like granule neuron
