  68fbbe6df1ece5a3c9aab2103300a610a38a7261d761830650bd26232293b69b:
    claim:
      about:
        disease:
          name: Bipolar Disorder
          disease_term:
            preferred_term: bipolar disorder
            term:
              id: MONDO:0004985
              label: bipolar disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bipolar_calcium_channel_psychiatric_cardiovascular_pleiotropy
        prompt: Do the calcium-channel susceptibility loci shared between bipolar disorder and cardiovascular
          disease (the established CACNA1C locus plus the pleiotropic genes TPCN1, CACNA2D2, CACNA1D,
          and ATP2B1) reflect a single causal calcium-signaling axis acting in both brain and cardiovascular
          tissue, and what is the direction of causation - does psychiatric-risk calcium-channel genotype
          drive cardiac electrophysiological change (e.g., QTc prolongation), or the converse?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#CACNA1C
        rationale: 'A genome-wide pairwise pleiotropy study in East Asians (Zhu et al., 2026; PMID:42436150)
          found shared genetic architecture across psychiatric and cardiovascular disease pairs converging
          on voltage-dependent calcium-channel activity, with novel pleiotropic genes (TPCN1, CACNA2D2,
          CACNA1D, ATP2B1) enriched in the calcium-signaling pathway alongside the established bipolar/schizophrenia
