  67300792e9c4469504b60799398d3a5df918d32e548d3d42c7772f0a5e42550d:
    claim:
      about:
        disease:
          name: Bipolar Disorder
          disease_term:
            preferred_term: bipolar disorder
            term:
              id: MONDO:0004985
              label: bipolar disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bip_ocd_3p21_1_effector_gene_and_h3k27ac
        prompt: Which gene at the 3p21.1 locus carries the risk signal shared between bipolar disorder
          and obsessive-compulsive disorder, and is prefrontal-cortex H3K27ac histone acetylation the
          regulatory mechanism through which it acts - or is the ITIH3/ITIH4 prioritization an artifact
          of the long-range linkage disequilibrium that also spans GLT8D1, SFMBT1, NEK4 and NISCH?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#ITIH3
        rationale: '3p21.1 is genome-wide significant in the largest GWAS of both disorders, and a 2026
          cross-trait analysis (conjFDR, SMR, multi-omic colocalization) prioritizes ITIH3/ITIH4 as the
          shared pleiotropic signal, with SNPs colocalizing with H3K27ac haQTLs in prefrontal cortex.
          That result is preprint-level, statistical, and directly contradicted in its gene assignment
          by the only functional dissection of the region published to date: CRISPR-Cas9 editing of rs2535629,
          which lies inside an ITIH3 intron, changed expression of the distal genes GLT8D1, SFMBT1 and
          NEK4 rather than of ITIH3, and the authors attributed schizophrenia risk to SFMBT1. So an intronic
          ITIH3 variant is a bona fide chromatin-regulatory variant at this locus while ITIH3 is not its
          target - which is precisely the confound a colocalization-only analysis cannot resolve. Resolving
          this matters because the two candidate effectors imply different biology: ITIH3/ITIH4 are hyaluronan-binding
          extracellular-matrix cross-linkers (the theme already represented by the bipolar NCAN locus),
          whereas SFMBT1 is a polycomb-family chromatin regulator of dendritic spine density. The clinical
          stake is real rather than hypothetical: OCD comorbidity in bipolar disorder is associated with
          a measurably worse course, so a shared causal mechanism would be a tractable target.'
      selected_evidence:
        snippet: where multiple SNPs (e.g., rs3774364) colocalized with H3K27ac histone acetylation QTLs
          in the prefrontal cortex (PP_H4 > 0.5)
        supports: SUPPORT
