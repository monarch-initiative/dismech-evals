  5080d5f465142bcf25bf286d40cd01c152cba775896a38f0e99bae6c532a9834:
    claim:
      about:
        disease:
          name: Bipolar Disorder
          disease_term:
            preferred_term: bipolar disorder
            term:
              id: MONDO:0004985
              label: bipolar disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: AKAP11
        association: Risk Factor
        relationship_type: RISK_FACTOR
        notes: The one rare-variant risk gene curated for this entry, and the only one reaching exome-wide
          significance in bipolar disorder to date. Ultra-rare protein-truncating variants in AKAP11 are
          enriched in bipolar cases in the BipEx collaboration, but the headline gene-level result is
          reached only after meta-analysis with the schizophrenia SCHEMA exome data, so the risk is shared
          with schizophrenia rather than bipolar-specific. AKAP-11 is a PKA-anchoring scaffold that binds
          GSK3B, which is why the gene is read as rare-variant convergence on the pathway lithium is thought
          to act through; that inference rests on a protein-protein interaction, not on any demonstration
          that the truncating variants act via GSK3B or that GSK3B inhibition is lithium's necessary therapeutic
          mechanism. The same study found that common-variant GWAS loci are not enriched for ultra-rare
          truncating variants, so common and rare risk in bipolar disorder are at least partly distinct
          in their gene sets.
      selected_evidence:
        snippet: Combining gene-level results with SCHEMA, AKAP11 emerges as a definitive risk gene
        supports: SUPPORT
    origin:
      assertion_path: /genetic/6
      evidence_path: /genetic/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35410376
      reference_title: Exome sequencing in bipolar disorder identifies AKAP11 as a risk gene shared with
        schizophrenia.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Whole-exome sequencing of 13,933 bipolar cases and 14,422 controls establishes AKAP11
        as a bipolar risk gene. The qualification is in the sentence itself: the definitive gene-level
        result requires combining BipEx with the schizophrenia SCHEMA analysis, so this is a cross-disorder
        rather than bipolar-specific finding.'
