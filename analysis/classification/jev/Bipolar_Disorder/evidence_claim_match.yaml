              label: bipolar disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intracellular Calcium Dysregulation
        biological_scale: CELLULAR
        description: 'Altered intracellular calcium handling is among the oldest and most replicated cellular
          findings in bipolar disorder: basal and stimulated cytosolic calcium are elevated in patient
          platelets and lymphocytes, and endoplasmic-reticulum calcium release through the IP3 receptor
          is enhanced in patient lymphoblasts carrying the low-expressing BCL2 rs956572 AA genotype. This
          is the cellular counterpart of the calcium-channel genetics curated under CACNA1C. Two scope
          limits are load-bearing and should not be read past: the replicated measurements are in peripheral
          blood cells rather than neurons, and they have not been shown to track mood state over time
          -- the original series found little correlation between calcium measures and mood-rating severity.
          The node therefore records a trait-associated calcium abnormality, not a demonstrated driver
          of episode switching (see the attached knowledge gap).

          '
        biological_processes:
        - preferred_term: Intracellular Calcium Homeostasis
          term:
            id: GO:0006874
            label: intracellular calcium ion homeostasis
          modifier: ABNORMAL
        - preferred_term: IP3 Receptor-Mediated ER Calcium Release
          term:
            id: GO:0051209
            label: release of sequestered calcium ion into cytosol
          modifier: INCREASED
      selected_evidence:
        snippet: We observed significantly elevated basal calcium concentrations in bipolar patient platelets
          and lymphocytes compared to control subjects.
        supports: SUPPORT
