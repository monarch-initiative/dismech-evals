      assertion:
        name: Phosphoinositide Signaling Dysregulation
        description: 'Overactivity of the phosphatidylinositol (PIP2 / IP3) second-messenger cycle is
          implicated in bipolar mood instability (the "inositol depletion hypothesis"). The cycle regenerates
          free myo-inositol through inositol monophosphatase (IMPase) and inositol polyphosphate 1-phosphatase;
          lithium uncompetitively inhibits these Mg2+-dependent phosphatases, depleting free inositol
          and dampening the overactive signaling — a therapeutic target shared with valproate and carbamazepine.
          (The disease-state direction shown here is the overactive baseline; lithium''s opposing, inhibitory
          action is captured on the Lithium treatment''s target_mechanisms edge.)

          '
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Inositol Phosphate Metabolism
          term:
            id: GO:0043647
            label: inositol phosphate metabolic process
          modifier: INCREASED
        - preferred_term: Phosphatidylinositol-Mediated Signaling
          term:
            id: GO:0048015
            label: phosphatidylinositol-mediated signaling
          modifier: INCREASED
      selected_evidence:
        snippet: Inositol, however, reverses the effects of the drugs on growth cones, thus implicating
          inositol depletion in their action.
        supports: SUPPORT
