            id: GO:0042391
            label: regulation of membrane potential
          modifier: ABNORMAL
      selected_evidence:
        snippet: This hyperexcitability phenotype of young neurons in bipolar disorder was selectively
          reversed by lithium treatment only in neurons derived from patients who also responded to lithium
          treatment.
        supports: SUPPORT
