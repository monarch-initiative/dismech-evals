    evidence_metadata:
      reference: PMID:34002096
      reference_title: Genome-wide association study of more than 40,000 bipolar disorder cases provides
        new insights into the underlying biology.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Table 1 row from the PGC bipolar disorder GWAS (41,917 cases): locus 9, index SNP
        rs2336147 at chr3:52,626,443 (GRCh37; 3p21.1), P = 3.6 x 10^-13, OR 1.070, named by the authors
        for ITIH1 and previously reported for schizophrenia and by the Cross-Disorder Group. This is the
        peer-reviewed genome-wide-significant bipolar association at the ITIH-cluster locus; the index
        SNP itself sits proximal to the ITIH genes rather than within them.'
