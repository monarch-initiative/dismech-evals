              id: MONDO:0004985
              label: bipolar disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_bipolar_setd1a_p596l_replication
        prompt: Does the SETD1A p.Pro596Leu association with bipolar disorder replicate outside the Lancaster
          Old Order Amish founder population, and is SETD1A a bipolar-disorder risk gene in its own right
          or only a schizophrenia and neurodevelopmental-disorder risk gene whose carriers are sometimes
          given a mood-disorder diagnosis?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#SETD1A
        rationale: SETD1A is one of the most robustly established schizophrenia risk genes (genome-wide
          significant for rare loss-of-function variants in Singh et al. 2016, and one of ten exome-wide-significant
          genes in SCHEMA). Its relationship to bipolar disorder is not established. The only direct evidence
          is a founder-population missense allele associated with a 1.8-fold relative risk at P = 0.027
          - nominal, uncorrected, single-population, and reported in a non-peer-reviewed preprint. Three
          things make this hard to resolve rather than merely under-powered. (1) The allele is 55-fold
          enriched in the Old Order Amish and rare elsewhere (0.09% in gnomAD), so direct replication
          in an unrelated cohort is not feasible for this variant; any replication has to be at gene level,
          on a different allelic series. (2) The schizophrenia association is driven by loss-of-function
          alleles, whereas P596L behaves as a hypomorph in patient-derived iPSCs, so a gene-level bipolar
          test is not testing the same perturbation. (3) Bipolar and schizophrenia diagnoses are not cleanly
          separable in carriers of large-effect chromatin-regulator variants, so a positive gene-level
          result would still need to distinguish a bipolar-specific effect from diagnostic assignment
          within a shared psychosis-spectrum liability. Until then the entry records the allele as a lead,
          not as a susceptibility locus comparable to CACNA1C or ANK3.
        proposed_experiments:
        - experiment_id: exp_bipolar_setd1a_gene_burden
          name: Gene-level SETD1A rare-variant burden test in large bipolar cohorts
          description: Test rare damaging SETD1A variation for association with bipolar disorder in the
            largest available bipolar exome or genome collections, stratified by variant class (protein-truncating
            versus damaging missense), and conditioning on schizoaffective and psychotic-feature status
            to separate a bipolar-specific signal from shared psychosis-spectrum liability.
          experiment_type:
            preferred_term: rare-variant burden association study
          decision_criterion: A bipolar-specific role would be supported by exome-wide-significant SETD1A
            burden in bipolar cases that survives conditioning on psychotic features; a signal that disappears
            under that conditioning, or that is carried entirely by protein-truncating alleles with no
            missense contribution, would instead argue that the P596L finding reflects the known schizophrenia
            and neurodevelopmental association rather than a distinct bipolar mechanism.
      selected_evidence:
        snippet: was associated with a 1.8-fold relative risk for BD in our sample (P = 0.027; Fig. 1A).
        supports: SUPPORT
