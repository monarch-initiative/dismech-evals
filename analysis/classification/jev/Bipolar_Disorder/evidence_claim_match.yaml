      assertion_type: Genetic
      assertion:
        name: ITIH3
        gene_term:
          preferred_term: ITIH3
          term:
            id: hgnc:6168
            label: ITIH3
        association: Risk Factor
        relationship_type: SUSCEPTIBILITY
        notes: 'ITIH3 lies in the extended 3p21.1 psychiatric risk region (GRCh38 chr3:52.79-52.81 Mb),
          immediately adjacent to ITIH1 and ITIH4 and within the same long-range LD block as GNL3, NEK4,
          GLT8D1, SFMBT1 and NISCH. Scope caveat: the index SNPs reported by the largest bipolar disorder
          GWAS are inside this region but not inside ITIH3 itself (rs2336147 is ~185 kb proximal to the
          ITIH cluster), so this entry records a locus-level susceptibility signal, not a demonstrated
          ITIH3 coding or regulatory effect. ITIH3/ITIH4 were specifically prioritized as the shared bipolar-disorder/OCD
          pleiotropic signal by a 2026 cross-trait conjFDR plus SMR/colocalization analysis, which remains
          a non-peer-reviewed preprint; the effector gene at 3p21.1 is still contested (see the attached
          knowledge gap). ITIH heavy chains covalently cross-link hyaluronan in the extracellular matrix,
          which would place this locus in the same ECM-remodelling theme as the established bipolar NCAN
          (neurocan) locus.'
      selected_evidence:
        snippet: 9c 3 52626443 rs2336147 3.6 × 10−13 1.070 0.009 T/C 0.498 ITIH1 (PGC2) SCZ, CDG
        supports: SUPPORT
    origin:
