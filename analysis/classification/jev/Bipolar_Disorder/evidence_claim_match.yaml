    evidence_metadata:
      reference: PMID:8710892
      reference_title: A molecular mechanism for the effect of lithium on development.
      evidence_source: MODEL_ORGANISM
      explanation: Klein and Melton identified GSK-3β as a direct molecular target of lithium in developmental
        model organisms — the foundational evidence for the GSK-3β hypothesis of lithium's action in bipolar
