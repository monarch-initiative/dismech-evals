      explanation: 'Substantiates the pharmacogenomic qualification asserted in this entry''s mechanistic-hypothesis
        notes. In 2,039 ConLiGen patients, the genetic signal for who responds to lithium falls in focal-adhesion
        and PI3K-Akt networks. Read precisely: the reported negative is for the ECM pathway, and the study
        did not test GSK3B or inositol pathways head to head, so it shows where the inter-individual response
        signal is rather than refuting the GSK-3β account of lithium''s action.'
