  dba43539a95578fbe0cd675160245395e62479a7b9ad9f66362a457d1631d614:
    claim:
      about:
        disease:
          name: Bipolar Disorder
          disease_term:
            preferred_term: bipolar disorder
            term:
              id: MONDO:0004985
              label: bipolar disorder
        context: []
      assertion_type: Genetic
      assertion:
        name: SETD1A
        gene_term:
          preferred_term: SETD1A
          term:
            id: hgnc:29010
            label: SETD1A
        association: Candidate risk factor (founder-population missense allele; nominal association, not
          yet replicated)
        relationship_type: SUSCEPTIBILITY
        notes: SETD1A encodes a histone H3K4 methyltransferase and is an established large-effect schizophrenia
          risk gene; its status as a bipolar-disorder risk gene is far weaker and rests, at present, on
          a single founder-population study. A missense allele enriched 55-fold in the Lancaster Old Order
          Amish (p.Pro596Leu, rs139187973) was associated with a 1.8-fold relative risk for bipolar disorder
          at nominal significance only (P = 0.027), in a non-peer-reviewed preprint. The allele-dose-dependent
          cognitive effect and the patient-derived iPSC phenotypes are the stronger part of that report;
          the diagnostic association itself is the weaker part, and is recorded here as a lead rather
          than an established locus. See the linked KNOWLEDGE_GAP discussion for what replication would
          require.
        variants:
        - name: SETD1A p.Pro596Leu (rs139187973)
          description: A missense substitution outside the catalytic SET domain, at 5.2% allele frequency
            in the Lancaster Old Order Amish versus 0.09% in gnomAD exomes. Patient-derived iPSCs homozygous
            for the allele show signatures of SETD1A hypofunction rather than a clean null, so the allele
            is best read as a hypomorph rather than as equivalent to the loss-of-function alleles that
            drive the schizophrenia association.
          type: missense variant
          functional_effects:
          - function: histone H3K4 methyltransferase activity
            description: Homozygous carrier iPSCs proliferate more slowly and are markedly more susceptible
              to hydroxyurea-induced DNA double-strand breaks; the proliferation deficit is rescued by
              overexpression of reference-sequence SETD1A, and neurite and senescence phenotypes are partially
              rescued by inhibiting the opposing H3K4 demethylase KDM5.
            type: loss-of-function
      selected_evidence:
        snippet: homozygotes performing worse than heterozygotes, especially on the Verbal Memory subtest.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/4
      evidence_path: /genetic/4/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PPR:PPR1277941
      reference_title: Clinical, cellular, and genomic consequences of a population-enriched SETD1A missense
