              label: bipolar disorder
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_polygenic_synaptic_circadian_dysregulation_model
        hypothesis_label: Canonical Polygenic / Synaptic / Circadian Dysregulation Model
        status: CANONICAL
        description: Bipolar disorder is a highly heritable polygenic mood disorder in which common variants
          in CACNA1C, ANK3, ODZ4, and other ion-channel and synaptic genes combine with circadian/clock
          gene variants (CLOCK, BMAL1, NR1D1) to produce episodic mood instability. Mitochondrial dysfunction,
          calcium-signaling dysregulation, and altered neuroplasticity in fronto-limbic circuits (anterior
          cingulate, amygdala, ventral striatum) drive cycling between depressive and manic states. Lithium's
          mood-stabilizing efficacy (targeting GSK-3β / inositol monophosphatase / circadian amplitude),
          valproate's modulation of histone deacetylases, and the recurrent involvement of the dopaminergic
          reward system during manic episodes corroborate the polygenic-synaptic-circadian framework as
          the canonical model.
        notes: 'Retained as CANONICAL with six explicit qualifications, independently re-verified against
          the cited primary sources rather than the 2026 openscientist hypothesis-search report''s framing
          (kb/hypotheses/Bipolar_Disorder/canonical_polygenic_synaptic_circadian_dysregulation_model),
          which finds PARTIALLY SUPPORTED. Each major pillar — common ion-channel / synaptic gene variants
          (CACNA1C, ANK3, ODZ4), circadian/clock variants, mitochondrial dysfunction, calcium signaling,
          and fronto-limbic neuroplasticity — has substantial GWAS, iPSC, animal-model, and pharmacological
          support, with lithium and valproate efficacy and dopaminergic mania consistent with the model.
          The 2025 multi-ancestry PGC4 GWAS (298 genome-wide-significant loci across 158,036 cases and
          2.8 million controls, PMID:39843750) is the current largest genetic-architecture study of BD
          and supersedes the smaller PGC3 scan the report''s genetics framing was based on. Six qualifications,
          each rescoped to what its cited study actually shows: (1) postmortem cortical transcriptome
          data (PMID:33442739) show a less-pronounced, psychosis-concentrated similarity between schizophrenia
          and BD gene-expression alterations — the study never tested the canonical calcium/circadian/synaptic
          model and did not restrict its BD sample to BD-I, so it qualifies rather than establishes that
          the model "best explains psychotic BD-I"; (2) the calcium-channel-blocker translational picture
          is a small, unresolved lead rather than a demonstrated dihydropyridine-vs-verapamil subclass
          effect — the decisive verapamil-to-dihydropyridine (nimodipine, then isradipine) response switch
          involved only two bipolar patients embedded in a 30-person mixed unipolar/bipolar refractory-affective-illness
          cohort (PMID:9790159), and a broader review of calcium-channel antagonist trials in BD found
          only limited support for efficacy (PMID:11252650); (3) lithium response pharmacogenomics implicates
          PI3K-Akt / focal-adhesion pathways rather than direct GSK-3β (partially reconcilable via the
          PI3K→Akt→GSK-3β cascade); (4) TIMELESS and RORA are circadian-gene leads from a single 2014
          candidate-gene association study (353 SNPs across 21 circadian genes, meta-analysed across two
          internal BD cohorts, PMID:24716566), not an update established across the modern GWAS literature,
          so they supplement rather than displace CLOCK/BMAL1 as canonical circadian candidates; (5) the
          claim that BD-risk-gene-attributed structural abnormalities are shared across the psychosis
          spectrum conflates two weaker, separate findings — a candidate-SNP imaging study of CACNA1C/ANK3/ODZ4/SYNE1
          found no risk-variant-structural association surviving multiple-testing correction (PMID:23820096),
          so there is no confirmed gene-attributed structural finding to generalize from, and a separate
          ENIGMA mega-/meta-analysis found shared cortical/subcortical abnormalities across BD, schizophrenia,
          major depressive disorder, and OCD generally (PMID:32646651) — a transdiagnostic pattern, not
          one specific to a psychosis spectrum or tied to risk-gene status; (6) critical experiments remain
          largely unperformed — no GSK-3β-selective inhibitor trial and no chronotherapy prevention trial
          from euthymia exist as of 2026, and while a modern dihydropyridine CCB trial was registered
          (adjunctive isradipine for bipolar depression, NCT01784666), it was terminated early for lack
          of enrollment (2 participants), so an adequately powered modern DHP-CCB trial remains a real
          gap rather than one that was never attempted.'
      selected_evidence:
        snippet: The finding for CACNG5, taken together with the earlier implication of CACNA1C and CACNA1B,
          strongly suggests a key role for voltage-dependent calcium channel genes in the susceptibility
          to bipolar disorder and/or schizophrenia.
        supports: SUPPORT
