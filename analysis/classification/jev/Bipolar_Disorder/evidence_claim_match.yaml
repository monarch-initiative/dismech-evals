      assertion_type: Pathophysiology
      assertion:
        name: GSK-3β Signaling Dysregulation
        description: 'Glycogen synthase kinase-3β (GSK-3β) is a constitutively active serine/threonine
          kinase that phosphorylates β-catenin, tau, and numerous circadian and pro-apoptotic substrates.
          Excess GSK-3β activity is implicated in bipolar mood instability, and GSK-3β is the principal
          molecular target through which lithium is thought to exert its mood-stabilizing and neuroprotective
          effects. Lithium inhibits GSK-3β both directly (Mg2+-competitive) and indirectly (via the Akt
          / β-arrestin-2 / PP2A axis), stabilizing β-catenin and mimicking canonical Wnt signaling.

          '
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Canonical Wnt Signaling
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Our results suggest that lithium acts through inhibition of glycogen synthase kinase-3
          beta (GSK-3 beta), which regulates cell fate determination in diverse organisms including Dictyostelium,
          Drosophila, and Xenopus.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
