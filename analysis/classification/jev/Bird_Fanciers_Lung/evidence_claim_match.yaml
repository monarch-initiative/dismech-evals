      assertion_type: Discussion
      assertion:
        discussion_id: interpretation_bfl_serology_exposure_not_causation
        prompt: How should positive bird-specific IgG or IgA be interpreted when other diagnostic domains
          are discordant?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - diagnosis#Bird antigen-specific IgG serology as exposure support
        rationale: Bird-specific antibodies document sensitization and likely exposure. They do not establish
          that the exposure caused the ILD, and test panels and thresholds are not standardized internationally.
          The entry therefore does not model positive serology as an independently diagnostic biomarker.
      selected_evidence:
        snippet: It was emphasized that a positive serum IgG result does not mean that the exposure is
          the cause of the lung condition; it only indicates that the patient has likely been exposed
          to a potential cause of HP at some point in his or her life
        supports: SUPPORT
