      assertion_type: HistopathologyFinding
      assertion:
        name: Bronchiolocentric Interstitial Pneumonia with Granulomatous Inflammation
        description: Typical nonfibrotic HP histology combines bronchiolocentric cellular interstitial
          pneumonia, chronic bronchiolitis, and poorly formed nonnecrotizing granulomatous inflammation.
          These findings support BFL only when integrated with avian exposure and the other diagnostic
          domains.
      selected_evidence:
        snippet: A confident histopathological diagnosis of nonfibrotic HP requires the presence of typical
          histopathological features. These include 1) a cellular interstitial pneumonia accentuated around
          small airways (“bronchiolocentric”) accompanied by 2) a cellular chronic bronchiolitis, 3) a
          distinctive pattern of granulomatous inflammation, and 4) no histopathological features to suggest
          a more likely alternative
        supports: SUPPORT
