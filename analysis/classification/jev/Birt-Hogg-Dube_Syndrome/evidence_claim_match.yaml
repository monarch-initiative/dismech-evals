      assertion_type: Pathophysiology
      assertion:
        name: Somatic FLCN Second-Hit Inactivation
        conforms_to: germline_two_hit_tumor_predisposition#Somatic Second-Hit Inactivation of the Wild-Type
          Allele
        description: 'A somatic event inactivates the retained wild-type FLCN allele. In BHD renal tumors
          the dominant route is not loss of heterozygosity but an independent intragenic mutation: sequencing
          77 renal tumors from 12 carriers found somatic sequence alterations in 53% and loss of heterozygosity
          in a further 17%, with most somatic changes producing frameshifts predicted to truncate the
          protein. That distribution matters for interpretation, because a BHD renal tumor without loss
          of heterozygosity has usually still completed its second hit, by mutation rather than allele
          loss.'
        role: amplifier
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: FLCN
            term:
              id: hgnc:27310
              label: FLCN
          variant_origin: SOMATIC
          allelic_hit_role: SECOND_HIT
          allelic_events:
          - FRAMESHIFT_VARIANT
          - LOSS_OF_HETEROZYGOSITY
          functional_impact_category: LOSS_OF_FUNCTION
          description: Acquired inactivation of the retained wild-type FLCN allele in renal tumor tissue,
            predominantly by somatic frameshift mutation and less often by loss of heterozygosity.
      selected_evidence:
        snippet: Sequence alterations were detected in the majority of renal tumors (41 of 77, 53%), with
          loss of heterozygosity at the BHD locus in a minority of additional tumors (14 of 77, 17%).
        supports: SUPPORT
