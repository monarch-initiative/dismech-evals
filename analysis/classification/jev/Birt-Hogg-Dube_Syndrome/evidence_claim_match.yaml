              label: Birt-Hogg-Dube syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Folliculin Loss and FNIP1-AMPK-mTOR Nutrient Sensing Dysregulation
        conforms_to: germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in
          a Susceptible Cell
        description: Folliculin is a tumor-suppressor protein without an assigned catalytic family; its
          identified partner FNIP1 binds AMP-activated protein kinase, the central energy sensor that
          negatively regulates mTOR. FNIP1 is phosphorylated by AMPK, and folliculin phosphorylation is
          reduced by AMPK inhibitors, diminished by rapamycin and by amino-acid starvation, and increased
          by FNIP1 overexpression — placing folliculin inside the AMPK and mTOR signalling network rather
          than upstream or downstream of it. Loss of folliculin in a cell that has inactivated both alleles
          therefore dysregulates nutrient and energy sensing, which is the mechanistic link between Birt-Hogg-Dube
          and the other hamartoma syndromes caused by LKB1, TSC1/2 and PTEN.
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: TOR signaling
          term:
            id: GO:0031929
            label: TOR signaling
          modifier: ABNORMAL
      selected_evidence:
        snippet: These results support a role for BHD as a tumor suppressor gene that predisposes to the
          development of renal tumors when both copies are inactivated.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15956655
      reference_title: High frequency of somatic frameshift BHD gene mutations in Birt-Hogg-Dubé-associated
        renal tumors.
      evidence_source: HUMAN_CLINICAL
      explanation: Direct evidence that BHD tumorigenesis requires inactivation of both FLCN copies, which
