              label: Birt-Hogg-Dube syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Renal Surveillance and Nephron-Sparing Surgery
        notes: 'Curated under `treatments:` as a management intervention, not as a claim that imaging
          or biochemistry is itself therapeutic. In a two-hit predisposition syndrome the second hit cannot
          be prevented, so the only available lever is stage at detection: surveillance is the intervention
          that converts an unavoidable tumor into a resectable one. Where a `target_mechanisms` link is
          present it points at the clinical-outcome node for that reason, and never at an upstream mechanistic
          node.'
        description: The renal arm dominates management. Tumors under 3 cm are watched rather than resected,
          and larger ones are removed nephron-sparingly where possible — a deliberately conservative approach
          that only makes sense because the tumors are typically indolent oncocytic lesions and because
          bilateral, multifocal disease means renal tissue must be preserved for future operations. This
          is the opposite of the wide-margin policy used in HLRCC, where the renal tumor metastasizes
          while small.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Nephrectomy
          term:
            id: NCIT:C15284
            label: Nephrectomy
      selected_evidence:
        snippet: Renal tumors less than 3.0 cm in diameter can be monitored with imaging; when possible,
          nephron-sparing surgery is the treatment of choice for larger renal tumors, depending on their
          size and location.
        supports: SUPPORT
