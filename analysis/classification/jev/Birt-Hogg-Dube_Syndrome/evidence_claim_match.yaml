      assertion_type: Pathophysiology
      assertion:
        name: Germline FLCN First-Hit Inactivation
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        description: A heterozygous loss-of-function variant in FLCN at 17p11.2 is present constitutionally.
          Most alleles are protein-truncating, and a striking proportion are insertions or deletions within
          a hypermutable mononucleotide C(8) tract, which is why that tract is the first target of diagnostic
          sequencing. FLCN transcript is widely expressed — including in kidney, lung and skin, the three
          affected organs — so the tissue restriction of the phenotype is not explained by where the gene
          is expressed.
        role: trigger
        biological_scale: MOLECULAR
        gene:
          preferred_term: FLCN
          modifier: DECREASED
          term:
            id: hgnc:27310
            label: FLCN
