              label: FLCN
          variant_origin: GERMLINE
          allelic_hit_role: FIRST_HIT
          allelic_events:
          - PATHOGENIC_VARIANT
          - FRAMESHIFT_VARIANT
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Constitutional heterozygous FLCN loss of function, predominantly protein-truncating,
            with a hotspot in a hypermutable C(8) tract.
      selected_evidence:
        snippet: Tissue expression of the 3.8 kb transcript was widespread, including kidney, lung, and
