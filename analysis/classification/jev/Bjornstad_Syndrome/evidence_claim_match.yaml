  4d3868a4728caf700c8ebe8ea1eb828608a77a0e355fc664dbdf82a07fea399d:
    claim:
      about:
        disease:
          name: Bjornstad Syndrome
          disease_term:
            preferred_term: Bjornstad syndrome
            term:
              id: MONDO:0009872
              label: Bjornstad syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BCS1L Rieske Protein Insertion Failure
        biological_scale: MOLECULAR
        description: 'BCS1L is a AAA-family ATPase of the inner mitochondrial membrane whose job is to
          insert the catalytic Rieske iron-sulfur protein (UQCRFS1) into the nearly complete pre-complex
          III. The missense variants found in Bjornstad syndrome change residues that mediate protein-protein
          contact rather than residues that bind ATP, which is the structural distinction between this
          mild phenotype and the severe complex III deficiency alleles. Reported Bjornstad alleles include
          p.Tyr301Asn in the AAA domain and the compound heterozygous pair p.Ser78Gly / p.Arg265Gln. The
          impaired step is therefore substrate engagement and insertion, not ATP turnover: the chaperone
          activity is recorded here without a modifier because no published study measures an ATPase or
          chaperone rate for a Bjornstad allele, and the direction is carried instead by the insertion
          process, which the mutant proteins demonstrably fail to complete.'
        genes:
        - preferred_term: BCS1L
          term:
            id: hgnc:1020
            label: BCS1L
        genetic_context:
          gene:
            preferred_term: BCS1L
            term:
              id: hgnc:1020
              label: BCS1L
          allele_type: MISSENSE
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Biallelic missense alleles affecting protein-protein interaction surfaces of the
            BCS1L AAA-ATPase. Reported Bjornstad genotypes are homozygous in consanguineous families and
            compound heterozygous elsewhere; complete loss of function produces the severe allelic disorders
            instead.
        molecular_functions:
        - preferred_term: BCS1L ATP-driven chaperone activity toward the Rieske protein
          term:
            id: GO:0140662
            label: ATP-dependent protein folding chaperone
        biological_processes:
        - preferred_term: insertion of the Rieske iron-sulfur protein into the inner membrane
          modifier: DECREASED
          term:
            id: GO:0045039
            label: protein insertion into mitochondrial inner membrane
      selected_evidence:
        snippet: Mutations in BCS1L, an assembly factor that facilitates the insertion of the catalytic
          Rieske Iron-Sulfur subunit into respiratory chain complex III, result in a wide variety of clinical
          phenotypes that range from the relatively mild Björnstad syndrome to the severe GRACILE syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20518024
      reference_title: Cellular pathophysiological consequences of BCS1L mutations in mitochondrial complex
        III enzyme deficiency.
      evidence_source: IN_VITRO
      explanation: States the molecular function of BCS1L that is lost, and places Bjornstad syndrome
        at the mild end of the resulting phenotypic range.
