        description: Reported in a single 7-year-old girl with genetically confirmed disease. Ketogenic
          diets stimulate mitochondrial biogenesis and reduce oxidative stress, which is the rationale
          for trying one here. Hair growth improved over four months on the diet and was lost again six
          months after it was stopped. Hearing did not improve. This is an n-of-1 observation without
          a control, and should be read as a hypothesis-generating report rather than as established therapy.
        therapeutic_modality: BEHAVIORAL
