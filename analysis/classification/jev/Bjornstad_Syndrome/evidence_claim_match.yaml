  4c1aa1ba7e642be98c61d7f062011894ee03f9eecc5f7d18e2922db89eb4a84d:
    claim:
      about:
        disease:
          name: Bjornstad Syndrome
          disease_term:
            preferred_term: Bjornstad syndrome
            term:
              id: MONDO:0009872
              label: Bjornstad syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Complex III Assembly Defect
        biological_scale: MOLECULAR
        description: 'Without correctly inserted Rieske protein, complex III cannot mature into a functional
          ubiquinol-cytochrome c oxidoreductase and cannot be incorporated into respirasomes, so electron
          transport through the respiratory chain is reduced. In Bjornstad syndrome the defect is partial:
          muscle respiratory chain enzyme activities may measure normal while assembled complex III is
          reduced on native gels, which is one reason the diagnosis is missed by routine biochemical testing.'
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex III assembly
          modifier: DECREASED
          term:
            id: GO:0034551
            label: mitochondrial respiratory chain complex III assembly
        - preferred_term: respiratory electron transport chain
          modifier: DECREASED
          term:
            id: GO:0022904
            label: respiratory electron transport chain
      selected_evidence:
        snippet: All mutant BCS1L proteins disrupted the assembly of complex III, reduced the activity
          of the mitochondrial electron-transport chain, and increased the production of reactive oxygen
          species.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
