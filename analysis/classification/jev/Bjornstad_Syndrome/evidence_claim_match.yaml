  aee4a75f9b6621355830b3b239ded42a2c84eb8c471ace2a62ed9211a29cdf0d:
    claim:
      about:
        disease:
          name: Bjornstad Syndrome
          disease_term:
            preferred_term: Bjornstad syndrome
            term:
              id: MONDO:0009872
              label: Bjornstad syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cochlear Oxidative Injury
        biological_scale: TISSUE
        conforms_to: sensorineural_hair_cell_loss#Cochlear Ionic Homeostasis Disruption and Oxidative
          Stress
        description: 'The cochlea is one of two tissues in which the BCS1L defect becomes clinically visible.
          Cochlear hair cells are post-mitotic, non-regenerating and sustain a high aerobic workload to
          maintain the endocochlear potential and mechanotransduction, so a chronic increase in reactive
          oxygen species is proposed as the mechanism by which a partial complex III defect produces hearing
          loss without systemic disease. This node substitutes the module''s generic oxidative insult
          with a nuclear-gene complex III assembly defect. The module''s other branch, potassium recycling
          through cochlear gap junctions, is deliberately not carried over: that branch describes connexin
          disease, and nothing in the BCS1L literature implicates endocochlear potassium handling. The
          module then routes through a hair-cell death node before the hearing-loss phenotype; this entry
          goes straight to the phenotype because no cochlear histopathology has been published for Bjornstad
          syndrome, so hair-cell loss here would be an assumption rather than an observation.'
        cell_types:
        - preferred_term: cochlear inner hair cell
          term:
            id: CL:0000589
            label: cochlear inner hair cell
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        biological_processes:
        - preferred_term: response to reactive oxygen species
          modifier: INCREASED
          term:
            id: GO:0000302
            label: response to reactive oxygen species
        - preferred_term: response to oxidative stress
          modifier: INCREASED
          term:
            id: GO:0006979
            label: response to oxidative stress
      selected_evidence:
        snippet: Mutations that cause the Björnstad syndrome illustrate the exquisite sensitivity of ear
          and hair tissues to mitochondrial function, particularly to the production of reactive oxygen
          species.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
