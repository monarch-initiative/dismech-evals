  26312a75a55fd8e6fd7d728890cbbfda4101c58d458fb5e3ed2f10712d64099f:
    claim:
      about:
        disease:
          name: Bjornstad Syndrome
          disease_term:
            preferred_term: Bjornstad syndrome
            term:
              id: MONDO:0009872
              label: Bjornstad syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bjornstad_tissue_restriction
        kind: KNOWLEDGE_GAP
        prompt: Why do many BCS1L genotypes preferentially affect hearing and hair, while other genotypes
          cause broader organ disease?
        attaches_to:
        - pathophysiology#Excess Reactive Oxygen Species Production
        - pathophysiology#Cochlear Oxidative Injury
        rationale: Increased cellular ROS and a mitochondrial-content difference were observed in the
          original mutant comparison, but neither establishes why particular tissues are affected. The
          reviewed sources do not provide allele-matched cochlear and follicular measurements. Additional
          clinical manifestations can occur, so tissue restriction is relative. Comparable oxidative burden
          can have different consequences because tissues differ in repair, antioxidant capacity and energy
          demand.
        proposed_experiments:
        - experiment_id: bjornstad_allele_matched_tissue_ros
          name: Allele-matched tissue comparison of oxidative burden
          description: Compare matched biallelic Bjornstad and severe BCS1L genotypes in isogenic human
            iPSC-derived inner-ear, hair-follicle and hepatic models. Measure complex III assembly, respiration,
            ROS, cell survival and follicular organization, and add genetic correction plus independently
            verified ROS-lowering interventions.
          would_support:
          - pathophysiology#Cochlear Oxidative Injury
          supporting_outcome:
          - Cochlear and follicular dysfunction tracks with oxidative injury and improves when ROS is
            normalized, with effects distinguished from restoration of respiration.
          would_refute:
          - pathophysiology#Cochlear Oxidative Injury
          refuting_outcome:
