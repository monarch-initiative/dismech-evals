          localized the abnormalities below the infundibulum and proposed abnormal disulfide bonding;
          they did not directly measure a disulfide-bond defect or establish ROS as its cause. Ex vivo
          hair testing found reduced mechanical strength, consistent with the fragile, twisted shaft phenotype.
        cell_types:
        - preferred_term: hair follicular keratinocyte
          term:
            id: CL:2000092
            label: hair follicular keratinocyte
      selected_evidence:
        snippet: Our results suggested that these abnormalities in pili torti had already occurred below
