          name: Bjornstad Syndrome
          disease_term:
            preferred_term: Bjornstad syndrome
            term:
              id: MONDO:0009872
              label: Bjornstad syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hair Shaft Keratin Assembly Failure
        biological_scale: TISSUE
        description: In the hair follicle the defect manifests as abnormal cortical keratinization. Transmission
          electron microscopy of Bjornstad pili torti shows cuticle layers of uneven thickness and loosely
          packed keratin intermediate filaments in the cortex, changes that are already present below
          the infundibulum — that is, they arise during keratinization inside the follicle rather than
          from later weathering of the emerged shaft. The resulting shaft is flattened, twisted, thin,
          and mechanically weak, with a tensile strength about half that of normal hair, which is why
          it breaks and the hair appears sparse.
        cell_types:
        - preferred_term: hair follicular keratinocyte
          term:
            id: CL:2000092
            label: hair follicular keratinocyte
      selected_evidence:
        snippet: Additionally, the cortex in the samples showed loose keratin intermediate filaments (IF).
        supports: SUPPORT
