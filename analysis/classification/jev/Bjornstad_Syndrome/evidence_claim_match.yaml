      assertion_type: Pathophysiology
      assertion:
        name: Excess Reactive Oxygen Species Production
        biological_scale: CELLULAR
        description: Every BCS1L mutant tested increases reactive oxygen species production, and the severity
          of the clinical phenotype tracks with how much. The severe complex III deficiency alleles additionally
          raise mitochondrial content, compounding the ROS burden; the Bjornstad alleles do not, which
          is the proposed reason their consequences stay confined to the two most oxidatively vulnerable
          tissues rather than causing multisystem failure.
        biological_processes:
        - preferred_term: reactive oxygen species metabolic process
          modifier: INCREASED
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
        - preferred_term: response to oxidative stress
          modifier: INCREASED
          term:
            id: GO:0006979
            label: response to oxidative stress
      selected_evidence:
        snippet: However, only mutations associated with complex III deficiency increased mitochondrial
          content, which further increased the production of reactive oxygen species.
        supports: SUPPORT
    origin:
