          matched BCS1L genotypes?
        attaches_to:
        - pathophysiology#Complex III Assembly Defect
        rationale: The reviewed patient-cell, yeast, HeLa and purified-protein systems resolve assembly
          or substrate interactions but do not reproduce a cochlea and hair follicle together. Severe
          BCS1L animal models cannot automatically validate a predominantly hair-and-hearing mechanism.
          A disease-matched tissue model remains a gap in this evidence set; this is not an exhaustive
          claim that no relevant model exists.
