  1af7d24e2a115789b624aee2c1f5a0b288ab56acc6b9b6d1d7bad91ad782745d:
    claim:
      about:
        disease:
          name: Bjornstad Syndrome
          disease_term:
            preferred_term: Bjornstad syndrome
            term:
              id: MONDO:0009872
              label: Bjornstad syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: BCS1L
        gene_term:
          preferred_term: BCS1L
          term:
            id: hgnc:1020
            label: BCS1L
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Reported genotypes include homozygous missense variants, compound missense variants, and
          a missense/nonsense pair. The 2007 structural model distinguished the variants then studied,
          but it does not establish one residue class, unaffected ATP turnover, or a deterministic severity
          rule for every Bjornstad genotype. Variant names below follow their source transcripts; segregation
          and functional findings are distinguished from computational predictions.
        variants:
        - name: NM_001079866.1:c.901T>A (p.Tyr301Asn)
          type: MISSENSE
          description: Homozygous AAA-domain missense allele segregating with Bjornstad syndrome in a
            large consanguineous Pakistani family with five affected individuals.
        - name: p.Arg306Cys / p.Arg186Ter, as reported
          description: Compound missense/nonsense genotype reported in two siblings diagnosed with Bjornstad
            syndrome; this disproves restriction to pairs of missense variants.
        - name: c.232A>G (p.Ser78Gly) / c.794G>A (p.Arg265Gln), NM_001079866.2
          description: Compound genotype in the diet case report. The Ser78Gly allele is also associated
            with severe disease in other genotypic contexts; its presence alone does not determine the
            phenotype.
        - name: c.649G>C (p.Asp217His) / c.671G>A (p.Arg224His), as reported
          description: Two missense variants segregated from opposite unaffected parents in the 2021 case.
            Their specific biochemical effects were hypothesized rather than measured.
      selected_evidence:
        snippet: This mutation results in the amino acid change p.Tyr301Asn and was predicted to be pathogenic
          by bioinformatics tools.
        supports: SUPPORT
        directness: DIRECT
