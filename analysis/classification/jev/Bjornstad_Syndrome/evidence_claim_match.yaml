      assertion_type: Genetic
      assertion:
        name: BCS1L
        gene_term:
          preferred_term: BCS1L
          term:
            id: hgnc:1020
            label: BCS1L
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: BCS1L, on chromosome 2q35, encodes the mitochondrial AAA-ATPase chaperone that inserts
          the Rieske iron-sulfur protein into complex III. Bjornstad syndrome is caused by biallelic missense
          variants affecting protein-protein interaction surfaces; reported alleles include c.901T>A (p.Tyr301Asn)
          in the AAA domain, and the compound heterozygous pair c.232A>G (p.Ser78Gly) with c.794G>A (p.Arg265Gln).
          The locus was mapped to 2q34-36 before the gene was identified.
        variants:
        - name: NM_001079866.1:c.901T>A (p.Tyr301Asn)
          type: MISSENSE
          description: Homozygous AAA-domain missense allele segregating with Bjornstad syndrome in a
            large consanguineous Pakistani family with five affected individuals.
      selected_evidence:
        snippet: Refined genetic mapping and DNA sequencing of 44 genes between D2S2210 and D2S2244 revealed
          BCS1L mutations.
        supports: SUPPORT
