  3398cf8ff23d60612616134311956f58af4919ba527351f8fc034228d30f8d80:
    claim:
      about:
        disease:
          name: Bjornstad Syndrome
          disease_term:
            preferred_term: Bjornstad syndrome
            term:
              id: MONDO:0009872
              label: Bjornstad syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        name: Incomplete partition of the cochlea type I
        category: Auditory
        description: Bilateral cochlear malformation of the incomplete partition type I pattern — a cystic
          cochlea lacking the interscalar septa and the modiolus — found on preoperative imaging in both
          siblings of the only published Bjornstad cochlear implantation series. It is recorded because
          it changes surgical planning and counselling, not because a developmental cochlear malformation
          follows from anything in this entry's proposed mechanism.
        phenotype_term:
          preferred_term: Incomplete partition of the cochlea type I
          term:
            id: HP:0011374
            label: Incomplete partition of the cochlea type I
        notes: 'No frequency band is assigned: 2 of 2 siblings in one family is the entire denominator,
          and those two were ascertained because they had profound hearing loss that had failed hearing
          aids, which is exactly the selection that enriches for a malformed cochlea. Earlier Bjornstad
          reports predate routine preoperative CT/MRI or do not report inner-ear imaging at all, so the
          finding may be commoner than one family suggests or may be private to it. This phenotype is
          deliberately left out of the causal graph: incomplete partition is a malformation of cochlear
          morphogenesis, and nothing published connects it to the complex III assembly defect or the oxidative
          injury this entry models, so an edge from either would be invented.'
      selected_evidence:
        snippet: Cochlear implant surgeries of two siblings (four ears) with profound SNHL and bilateral
          inner ear anomaly (incomplete partition type 1) were performed without complications.
        supports: SUPPORT
    origin:
