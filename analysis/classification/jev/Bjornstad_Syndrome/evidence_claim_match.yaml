  e1ea0c092789c4eb8744c2efb95c697c8a72cad1fe54a098208d68b80fc36129:
    claim:
      about:
        disease:
          name: Bjornstad Syndrome
          disease_term:
            preferred_term: Bjornstad syndrome
            term:
              id: MONDO:0009872
              label: Bjornstad syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Hearing amplification and cochlear implantation
        description: There is no treatment for the underlying assembly defect, so management of the hearing
          loss is the intervention that determines outcome. Early amplification, and cochlear implantation
          where amplification is insufficient, follows standard practice for bilateral childhood sensorineural
          loss; the disorder itself imposes no specific contraindication. Bilateral simultaneous implantation
          has now been reported in two Bjornstad siblings with profound loss unresponsive to hearing aids,
          performed without complication and with improved pure-tone thresholds and word recognition afterwards,
          despite an incomplete-partition-type-I cochlea on both sides in both children.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: hearing rehabilitation for sensorineural hearing loss
          term:
            id: NCIT:C15315
            label: Rehabilitation
          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: cochlear implant
              term:
                id: NCIT:C157820
                label: Cochlear Implant
        notes: Bound to the generic rehabilitation action because NCIT's cochlear implant term names the
          device and is not reachable from NCIT:C25218; the device concept is preserved as a qualifier.
          The disorder-specific implantation evidence is a single retrospective report of two siblings
          (four ears), which itself states that no earlier implanted case had been reported, so this is
          still standard care for the hearing phenotype rather than a comparative outcome claim.
      selected_evidence:
        snippet: Cochlear implantation is an effective, safe, and ultimate treatment option for Bjornstad
          syndrome with profound SNHL not responding to hearing aids.
        supports: SUPPORT
