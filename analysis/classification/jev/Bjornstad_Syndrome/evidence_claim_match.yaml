        name: BCS1L-related complex III deficiency
        description: Isolated mitochondrial complex III deficiency due to BCS1L variants that affect ATP-binding
          residues, presenting with neonatal tubulopathy, encephalopathy and liver failure. Reported patients
          also include adults with aminoaciduria, seizures and learning difficulties, and a family with
          a hypomanic-to-psychotic neuropsychiatric course, so the boundary with Bjornstad syndrome is
          set by the presence of systemic and neurological involvement rather than by the gene.
      selected_evidence:
        snippet: All affected members of the families have an identical mutation in this gene, mutations
          of which are recognized causes of Björnstad syndrome, GRACILE syndrome and a syndrome of neonatal
          tubulopathy, encephalopathy, and liver failure (MIM 606104) leading to isolated mitochondrial
          respiratory chain complex III deficiency.
