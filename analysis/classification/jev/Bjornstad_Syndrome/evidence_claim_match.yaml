          preferred_term: mild ketogenic (modified Atkins) diet
          term:
            id: NCIT:C15447
            label: Dietary Intervention
        notes: One patient, no control, and the family stopped the diet after four months because the
          child craved carbohydrate. Hearing was unchanged throughout. Do not read the VERY_FREQUENT-style
          confidence of a trial into this record.
      selected_evidence:
        snippet: There was improved hair growth during MAD in this individual with BCS1l related mitochondrial
          disease
        supports: SUPPORT
