        name: Latrophilin Receptor Signalling at the Nerve Terminal
        biological_scale: MOLECULAR
        description: The alternative arm, and no longer a black box. Engagement of latrophilin-1 couples
          to Gaq and phospholipase C, generating IP3 that releases calcium from intracellular stores through
          IP3 receptors; the resulting store depletion opens store-operated calcium entry, which supplies
          the sustained calcium that exocytosis needs. The cascade was delineated at the mouse neuromuscular
          junction using a pore-deficient toxin mutant, so the pore is excluded by construction rather
          than by argument. What this does not establish is how much of a human envenomation runs through
          it.
        biological_processes:
        - preferred_term: G protein-coupled receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007186
            label: G protein-coupled receptor signaling pathway
      selected_evidence:
        snippet: An analysis of CIRL-1 mutants indicated that channel formation in HEK293 cells is unlikely
          to be transduced by a G-protein-dependent mechanism.
        supports: REFUTE
