              id: MONDO:0800176
              label: black widow spider envenomation
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: receptor_mediated_secretion
        hypothesis_label: A receptor-signalling arm acts independently of the pore
        status: ALTERNATIVE
        description: 'A second route in which the toxin''s receptors do more than tether it: engagement
          of latrophilin/CIRL, a G-protein-coupled receptor, stimulates secretion without requiring calcium
          entry through a pore. It began as an inference from a negative observation - exocytosis happens
          in the complete absence of extracellular calcium, which the pore account cannot explain - and
          has since been given a full cascade, demonstrated with a pore-deficient toxin mutant so that
          the pore cannot be doing the work. Recorded as ALTERNATIVE rather than CANONICAL because what
          has been demonstrated is spontaneous quantal release at the mouse neuromuscular junction; no
          work apportions the two arms in a human envenomation.'
      selected_evidence:
        snippet: In addition to channel formation, alpha-latrotoxin enhances secretion in permeabilized
          cells through interaction with the plasma membrane receptor CIRL/latrophilin.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/1
      context_paths:
