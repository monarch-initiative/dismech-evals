        context: []
      assertion_type: Discussion
      assertion:
        kind: KNOWLEDGE_GAP
        discussion_id: which_receptor_arm_carries_the_effect
        prompt: Does alpha-latrotoxin drive exocytosis through the pore it forms, through receptor signalling,
          or through both - and in what proportion in a human envenomation?
        rationale: Both arms are supported, and the evidence for each is of a different kind. Both arms
          are now mechanistically described, which is a change from how this was framed until recently.
          The pore's prepore and pore states are resolved by cryo-EM to 3.1 and 3.7 Angstrom respectively,
          and the channel's conductance is measured. The receptor arm has its own delineated cascade -
          latrophilin-1 to Gaq-phospholipase C to IP3 to store release to store-operated calcium entry
          - established with a pore-deficient toxin mutant in latrophilin-1 knockout mice, which is the
          cleanest available way to isolate it from the pore. What remains open is not whether either
          arm exists but what each contributes in a human envenomation. The receptor cascade was characterised
          for spontaneous quantal release at the mouse neuromuscular junction, not for the massive discharge
          of latrodectism; all of the discriminating work is in cultured cells, synaptosomes and mice;
          and nothing in the clinical picture distinguishes the two.
        attaches_to:
        - pathophysiology#Latrophilin Receptor Signalling at the Nerve Terminal
        - mechanistic_hypotheses#receptor_mediated_secretion
      selected_evidence:
        snippet: The molecular details of how alpha-latrotoxin binding is transduced eventually to exocytosis
          remain to be elucidated.
        supports: SUPPORT
