      assertion_type: Discussion
      assertion:
        kind: KNOWLEDGE_GAP
        discussion_id: antivenom_efficacy_is_unsettled
        prompt: Does equine antivenom add anything to adequate analgesia in latrodectism, and if the two
          placebo-controlled trials really disagree, why?
        rationale: 'RAVE-II randomised 224 patients against placebo on top of standardised analgesia and
          found no significant benefit. Dart and colleagues randomised 60 patients against placebo and
          met their primary endpoint. Four candidate explanations remain, and the entry cannot choose
          between them: a different spider and a different antivenom product (Latrodectus hasselti in
          Australia versus L. mactans in the United States - the products'' antibody formats are not described
          in either trial abstract, so no comparison of them is asserted here); a different primary endpoint
          (pain improvement at 2 hours versus sustained reduction over 48 hours); a fourfold difference
          in size, with RAVE-II''s confidence interval only just crossing zero; and the fact that RAVE-II
          gave both arms standardised analgesia first, which is a harder comparator to beat. The species
          explanation is the weakest of the four: redback antivenom neutralises L. mactans venom in a
          mouse model, so the two products are not obviously aimed at incomparable targets. The practical
          question - whether to give a product that causes systemic hypersensitivity in about 1 in 28
          recipients, and that killed a patient in the largest published series - turns on the answer.'
        attaches_to:
        - treatments#Equine antivenom
      selected_evidence:
        snippet: Redback spider antivenom is effective in neutralizing the lethal effects of L. hesperus
          and L. mactans venoms in a mouse envenomation model.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11407496
      reference_title: Neutralization of Latrodectus mactans and L. hesperus venom by redback spider (L.
        hasseltii) antivenom.
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      explanation: 'Bears directly on the species explanation, and against it: the Australian antivenom
        neutralises both American species'' venom in a mouse model, so species difference alone is a weak
        account of why the two trials disagree. The species names are the point of the quote, which is
        why the whole sentence is given.'
