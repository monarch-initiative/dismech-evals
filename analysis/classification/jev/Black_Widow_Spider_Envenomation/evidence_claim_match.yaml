            term:
              id: MONDO:0800176
              label: black widow spider envenomation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Alpha-Latrotoxin Binding to Presynaptic Receptors
        biological_scale: MOLECULAR
        description: 'Alpha-latrotoxin binds two structurally unrelated families of presynaptic receptor
          - neurexin-1alpha, which binds calcium-dependently, and latrophilin/CIRL, a G-protein-coupled
          receptor that binds without calcium. Their shared and best-evidenced function is tethering:
          holding the toxin at the membrane so that it can insert. The evidence for that is unusually
          clean, because a chimera carrying only the extracellular domain of CIRL-1 on an unrelated viral
          transmembrane anchor produced the same channels as the wild-type receptor.'
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        - preferred_term: autonomic and neurosecretory neuron
          term:
            id: CL:0000540
