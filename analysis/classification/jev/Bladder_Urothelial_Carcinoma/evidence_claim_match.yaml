      assertion_type: Pathophysiology
      assertion:
        name: Adaptive Immune Resistance and PD-L1-Mediated Immune Evasion
        conforms_to: immune_checkpoint_blockade#Adaptive Immune Resistance
        description: Bladder urothelial carcinoma is an immunogenic tumor in which tumor cells and the
          immunosuppressive tumor microenvironment co-opt the PD-1/PD-L1 homeostatic axis. Interferon-gamma
          from infiltrating effector T cells drives adaptive PD-L1 upregulation, and PD-1 engagement on
          CD8+ T cells suppresses cytotoxic anti-tumor activity, enabling immune escape. This actively
          suppressed but pre-existing anti-tumor immunity is the mechanistic rationale for PD-1/PD-L1
          checkpoint blockade across non-muscle-invasive and advanced urothelial carcinoma.
        cell_types:
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: Negative Regulation of T Cell Mediated Immunity
          term:
            id: GO:0002710
            label: negative regulation of T cell mediated immunity
          modifier: INCREASED
      selected_evidence:
        snippet: The interaction of PD-1 and PD-L1 negatively regulates adaptive immune response mainly
          by inhibiting the activity of effector T cells while enhancing the function of immunosuppressive
          regulatory T cells (Tregs), largely contributing to the maintenance of immune homeostasis that
          prevents dysregulated immunity and harmful immune responses. However, cancer cells exploit the
          PD-1/PD-L1 axis to cause immune escape in cancer development and progression.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38762484
      reference_title: Regulatory mechanisms of PD-1/PD-L1 in cancers.
      evidence_source: OTHER
      explanation: Review describing how tumors co-opt PD-1/PD-L1 signaling to suppress anti-tumor T cell
