      assertion:
        name: Clonal Hematopoiesis of the Mutant Progenitor
        description: The mutant progenitor expands as a premalignant clone in the bone marrow, still capable
          of normal differentiation. This is the state shared with the antecedent myeloid neoplasms that
          a fifth of BPDCN patients also carry, and it is the substrate the later lesions act on rather
          than the disease itself.
        biological_scale: CELLULAR
      selected_evidence:
        snippet: we find that BPDCN arises from clonal (premalignant) haematopoietic precursors in the
          bone marrow
        supports: SUPPORT
