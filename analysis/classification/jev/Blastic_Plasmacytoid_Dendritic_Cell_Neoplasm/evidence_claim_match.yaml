      reference: PMID:36819168
      reference_title: 'Biallelic TET2 mutations and canonical ASXL1 mutations are frequent and cooccur
        in Blastic Plasmacytoid Dendritic Cell Neoplasm (BPDCN): An institutional experience and review
        of literature.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes biallelic TET2 and canonical ASXL1 loss as the recurrent lesion pair in
        this node.
