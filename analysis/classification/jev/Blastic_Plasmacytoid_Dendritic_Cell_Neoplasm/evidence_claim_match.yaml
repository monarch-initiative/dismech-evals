  a1581a47004a728d009cc6f3bd24fa140101c1a1ef376f1f8b04c45a6ff57392:
    claim:
      about:
        disease:
          name: Blastic Plasmacytoid Dendritic Cell Neoplasm
          disease_term:
            preferred_term: blastic plasmacytoid dendritic cell neoplasm
            term:
              id: MONDO:0019467
              label: CD4+/CD56+ hematodermic neoplasm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Diphthamide Pathway Silencing
        description: Acquired resistance to tagraxofusp does not run through loss of the target. CD123
          is retained; what the cell loses is the diphthamide biosynthesis pathway, silenced by DNA methylation,
          and diphthamide is the modified histidine residue the diphtheria-toxin moiety needs in order
          to ADP-ribosylate elongation factor 2. The drug still binds and still enters - it simply has
          nothing to act on. This is why a hypomethylating agent, which restores the pathway, is a rational
          partner rather than merely an additive cytotoxic.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Resistance in cancer cells does not stem from CD123 loss but rather from their ability
          to resist the diphtheria toxin, facilitated by the DNA methylation-induced silencing of genes
          in the diphthamide synthesis pathway
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/22
      evidence_path: /pathophysiology/22/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38338733
      reference_title: Breakthrough in Blastic Plasmacytoid Dendritic Cell Neoplasm Cancer Therapy Owing
        to Precision Targeting of CD123.
      evidence_source: OTHER
      explanation: 'States both halves of this node: that resistance is not target loss, and that it is
        methylation-driven silencing of the diphthamide pathway.'
