      assertion:
        name: Glucocorticoid Resistance
        description: Reduced glucocorticoid-receptor dosage renders the clone corticoresistant. This is
          the functional consequence the NR3C1 deletion was characterized by, and it matters clinically
          because corticosteroids are otherwise a standard component of the lymphoma- and ALL-type regimens
          used here.
        biological_scale: CELLULAR
      selected_evidence:
        snippet: functional analyses coupled with gene expression profiling identified corticoresistance
          and loss-of-EZH2 function as major downstream consequences of NR3C1 deletion in BPDCN
        supports: SUPPORT
