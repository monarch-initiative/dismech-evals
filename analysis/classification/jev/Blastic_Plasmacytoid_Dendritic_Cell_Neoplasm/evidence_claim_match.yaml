      assertion_type: Pathophysiology
      assertion:
        name: Central Nervous System Infiltration
        description: 'Leptomeningeal involvement is characteristically occult: patients are usually neurologically
          asymptomatic, so it is missed unless cerebrospinal fluid is examined deliberately, and it most
          often becomes apparent at relapse. That combination - clinically silent, and therefore not ruled
          out by a normal neurological examination - is why CNS assessment and treatment are handled as
          a mandatory part of first-line management rather than as a reaction to symptoms. A frequently
          quoted figure of roughly 30% occult involvement at diagnosis is not curated here: it traces
          to a source this session did not fetch.'
        biological_scale: TISSUE
        locations:
        - preferred_term: central nervous system
          term:
            id: UBERON:0001017
            label: central nervous system
      selected_evidence:
        snippet: This presents challenges in diagnosis and treatment, with CNS involvement often overlooked
          in standard diagnostic workups due to BPDCN's rarity and patients often being neurologically
          asymptomatic at diagnosis.
        supports: SUPPORT
