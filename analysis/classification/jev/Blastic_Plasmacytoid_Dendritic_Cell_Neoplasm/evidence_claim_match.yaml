    claim:
      about:
        disease:
          name: Blastic Plasmacytoid Dendritic Cell Neoplasm
          disease_term:
            preferred_term: blastic plasmacytoid dendritic cell neoplasm
            term:
              id: MONDO:0019467
              label: CD4+/CD56+ hematodermic neoplasm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Epigenetic Regulator Loss in a Hematopoietic Progenitor
        description: Loss-of-function mutations in DNA- and chromatin-modifying genes — most consistently
          TET2, often biallelic, together with the canonical ASXL1 c.1934dupG frameshift — arise in a
          hematopoietic progenitor and behave as founder events. The same variants are recoverable from
          a preceding or concurrent myeloid neoplasm in the same patient, which places the lesion upstream
          of pDC commitment rather than inside the pDC compartment.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TET2
          term:
            id: hgnc:25941
            label: TET2
        - preferred_term: ASXL1
          term:
            id: hgnc:18318
            label: ASXL1
      selected_evidence:
        snippet: We studied the myeloid-related genetic mutations in a cohort of five patients with BPDCN
          and one paired relapse case at our institution and identified a high frequency of biallelic
          TET2 and canonical ASXL1 (c.1934dupG) mutations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
