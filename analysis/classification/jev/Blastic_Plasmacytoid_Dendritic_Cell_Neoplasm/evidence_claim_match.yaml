      assertion:
        name: UV-Selected Survival of TET2-Mutant pDC Precursors in Sun-Exposed Skin
        description: 'Phylogenomic reconstruction places ultraviolet damage *before* the alterations associated
          with malignant transformation in at least some tumours - the source says UV damage "can precede"
          them, and BPDCN skin tumours appear first at sun-exposed anatomical sites carrying clonally
          expanded UV mutational signatures. The selection mechanism is lineage-specific: Tet2 loss of
          function confers resistance to UV-induced cell death in plasmacytoid but not conventional dendritic
          cells. The founder lesion therefore does more than permit transformation — it determines *where*
          the premalignant clone survives, which is why the disease presents in skin.'
        biological_scale: CELLULAR
        genes:
        - preferred_term: TET2
          term:
            id: hgnc:25941
            label: TET2
        triggers:
