          term:
            id: ECTO:0000006
            label: exposure to ultraviolet radiation
      selected_evidence:
        snippet: we find that loss-of-function mutations in Tet2, the most common premalignant alteration
          in BPDCN, confer resistance to UV-induced cell death in plasmacytoid, but not conventional,
          dendritic cells
        supports: SUPPORT
