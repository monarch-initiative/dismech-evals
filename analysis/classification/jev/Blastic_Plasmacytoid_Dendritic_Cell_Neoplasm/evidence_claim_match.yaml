            term:
              id: MONDO:0019467
              label: CD4+/CD56+ hematodermic neoplasm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CDKN2A and CDKN2B Deletion at 9p21.3
        description: Recurrent copy-number loss at 9p21.3 removes the CDKN2A/CDKN2B cell-cycle inhibitors,
          and the same broad deletions take out neighbouring tumour suppressors including CDKN1B and RB1.
          Unlike most of the recurrent lesions here it is a deletion rather than a point mutation.
        notes: An adverse prognostic effect of biallelic loss is asserted at review level in the deep-research
          report used for this entry, but no source cited here establishes it, so this entry does not
          claim it. Recorded as curation provenance rather than in `description`, which renders as disease
          biology.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CDKN2A
          term:
            id: hgnc:1787
            label: CDKN2A
        - preferred_term: CDKN2B
          term:
            id: hgnc:1788
            label: CDKN2B
      selected_evidence:
        snippet: Recurrent copy number alterations (CNAs) in BPDCN include broad deletions within chromosomes
          7, 9, 12, 13, and 15, particularly the regions containing tumor suppressors CDKN2A/B, CDKN1B,
          and RB1.
        supports: SUPPORT
    origin:
