              label: CD4+/CD56+ hematodermic neoplasm
        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Cell Transplantation
        description: 'Consolidation of eligible patients in remission is the recommended standard. What
          the EBMT registry actually resolves is narrower than a transplant-versus-no-transplant comparison,
          which it did not make: among transplanted patients, myeloablative conditioning - ideally total-body-irradiation
          based - outperformed reduced-intensity conditioning, and did so *independently of* being in
          first complete remission, age and performance score. So the conditioning intensity, not merely
          the graft-versus-tumour effect, carries that difference. The same analysis found one-year outcomes
          comparable between allogeneic and autologous transplant, and offers autologous transplant for
          patients ineligible for myeloablative allografting.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
      selected_evidence:
        snippet: Among alloHCT recipients, MAC with TBI significantly improved OS and PFS, independently
          of CR1, age, Karnofsky index and TCD.
        supports: SUPPORT
