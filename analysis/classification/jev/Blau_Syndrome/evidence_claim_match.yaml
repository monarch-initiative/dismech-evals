  3d0af235998ed0affd3d55ba4496ad19bbf68a537cc3f2f238c67c8aa13d9fcb:
    claim:
      about:
        disease:
          name: Blau Syndrome
          disease_term:
            preferred_term: Blau syndrome
            term:
              id: MONDO:0008523
              label: Blau syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: NOD2
        association: Heterozygous pathogenic variants
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: NOD2
          term:
            id: hgnc:5331
            label: NOD2
        inheritance:
        - name: Autosomal dominant
        features: Blau syndrome is caused by heterozygous pathogenic NOD2 (CARD15) variants, usually missense
          variants in or near the central nucleotide-binding/NACHT domain. p.Arg334Trp and p.Arg334Gln
          are recurrent hotspots. Variants may be inherited or de novo, and penetrance and phenotype can
          vary; a NOD2 variant of uncertain significance is not sufficient for diagnosis.
        variants:
        - name: p.Arg334Trp (R334W)
          description: Recurrent pathogenic missense variant c.1000C>T in the NOD/NACHT domain. It was
            the most frequent single variant in the international prospective cohort.
        - name: p.Arg334Gln (R334Q)
          description: Recurrent pathogenic missense variant c.1001G>A affecting the same NACHT-domain
            residue as p.Arg334Trp.
      selected_evidence:
        snippet: We have identified three missense mutations in the nucleotide-binding domain (NBD) of
          CARD15/NOD2 in four French and German families with Blau syndrome
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
