        snippet: Heterozygous alterations in FLI1 and RUNX1, encoding Friend leukemia integration 1 and
          RUNT-related transcription factor 1, respectively, which have a fundamental role in megakaryocytopoeisis,
          were identified in 6 patients, 4 of whom had mild thrombocytopenia.
        supports: SUPPORT
