      assertion_type: Pathophysiology
      assertion:
        name: Loss of FLI1 Target Gene Transactivation
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: FLI1 directly transactivates the promoters of platelet genes required for adhesion,
          aggregation and granule biology — GP6 (the collagen receptor glycoprotein VI), GP9 (part of
          the von Willebrand factor receptor complex) and ITGA2B (integrin alpha-IIb). The recessive allele
          was shown to cause a transcription defect at all three promoters by luciferase assay, and, more
          tellingly, to reduce the corresponding proteins in platelets taken from affected family members.
          The promoter assay and the patient Western blot are what make this a demonstrated mechanism
          rather than an inferred one.
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          modifier: DECREASED
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        cell_types:
        - preferred_term: Megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
      selected_evidence:
        snippet: This mutation caused a transcription defect at the promoter of known FLI1 target genes
          GP6, GP9, and ITGA2B, as measured by luciferase assay in HEK293 cells, and decreased the expression
          of these target proteins in affected members of the family as measured by Western blotting of
          platelet lysates.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26316623
