        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'FLI1 (11q24.3) encodes an ETS-family transcription factor central to megakaryopoiesis.
          Reported disease alleles are concentrated in the ETS DNA-binding domain — p.Arg337Trp and p.Tyr343Cys
          heterozygously, p.Arg324Trp homozygously — with a frameshift deletion representing the haploinsufficiency
          route. FLI1 dosage matters in both directions: hemizygous loss within the 11q23 deletion produces
          Paris-Trousseau thrombocytopenia, while FLI1 overexpression in induced megakaryocytes improved
          platelet yield, half-life and function.'
