            id: GO:0030220
            label: platelet formation
        cell_types:
        - preferred_term: Megakaryocyte
          term:
            id: CL:0000556
            label: megakaryocyte
      selected_evidence:
        snippet: PTSx and FLI1+/- iMegs replicate many of the described megakaryocyte/platelet features,
          including a decrease in iMeg yield and fewer platelets released per iMeg.
        supports: SUPPORT
