        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'With the terminal transcriptional programme disabled, megakaryocyte output falls
          at two points: fewer megakaryocytes are produced, and each releases fewer platelets. This was
          shown directly in induced pluripotent stem cell-derived megakaryocytes from a Paris-Trousseau
          patient and from a targeted heterozygous FLI1 knockout line, which reproduced the described
          megakaryocyte and platelet features. It is the quantitative arm of the disorder, producing the
          mild-to-moderate thrombocytopenia.'
        biological_processes:
        - preferred_term: megakaryocyte differentiation
          modifier: DECREASED
