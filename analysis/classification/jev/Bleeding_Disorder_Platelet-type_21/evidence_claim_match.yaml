        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: The dominant presentation arises from heterozygous FLI1 alterations, identified in
          patients ascertained for excessive bleeding with reduced dense granule secretion and impaired
          aggregation. Two of these, p.Arg337Trp and p.Tyr343Cys, sit in the DNA-binding domain and were
          shown to abolish FLI1 transcriptional activity; a four-base-pair deletion predicted haploinsufficiency
          instead. Both routes are consistent with a dosage-sensitive transcription factor, which is also
          why hemizygous FLI1 loss in the 11q23 deletion produces a platelet phenotype.
      selected_evidence:
        snippet: Recently, heterozygote human FLI1 mutations have been ascribed to cause thrombocytopenia.
        supports: SUPPORT
