      reference_title: 'Evaluation of thromboelastometry, thrombin generation and plasma clot lysis time
        in patients with bleeding of unknown cause: A prospective cohort study.'
      evidence_source: HUMAN_CLINICAL
      explanation: An independent Rotterdam cohort that reproduces only the prolonged lag time and finds
