      assertion:
        name: Altered Fibrin Clot Architecture
        biological_scale: MOLECULAR
        description: 'A structural rather than quantitative model: the fibrin network in BDUC forms at
          a lower rate and with altered fiber morphology, and it is that architecture, not the concentration
          of any single component, that determines mechanical stability and susceptibility to lysis. Confocal
          microscopy shows a tendency to thicker fibers that correlates inversely with peak plasmin, and
          turbidimetric studies show a reduced rate of fibrin formation. The evidence here is mixed: the
          largest dedicated clot-properties study found the reduced formation rate but no difference in
          the remaining clot parameters.

          '
        biological_processes:
