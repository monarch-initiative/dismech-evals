  a634a4cdd440160aed03280fa3649664d98934ad9f0761f3f1703d826aeb2b0a:
    claim:
      about:
        disease:
          name: Bleeding Disorder of Unknown Cause
          disease_term:
            preferred_term: bleeding disorder of unknown cause
            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bduc_fibrinolysis_direction_conflict
        kind: CONTROVERSY
        status: OPEN
        prompt: Is the fibrinolytic abnormality in BDUC accelerated clot lysis or reduced lysis potential?
          Published cohorts report both directions, so the two cannot both be the mechanism.
        attaches_to:
        - pathophysiology#Altered Fibrinolytic Balance
        - pathophysiology#Altered Fibrin Clot Architecture
        rationale: The Vienna cohort reported a shorter clot lysis time, consistent with accelerated lysis,
          and a tPA-modified thromboelastometry study classified 21% of BDUC patients as hyperfibrinolytic.
          In the opposite direction, an independent Rotterdam cohort found a significantly prolonged clot
          lysis time, direct plasmin generation measurement found reduced rather than increased peak plasmin,
          and whole-blood viscoelastometry in 464 patients found reduced maximal lysis and a larger area
          under the curve. This is not a difference of magnitude but of sign, and it is why this entry
          names the arm "altered fibrinolytic balance" rather than "hyperfibrinolysis" and refuses to
          give it CANONICAL status. A plausible reconciliation is that the cohorts differ in the assay's
          dependence on clot structure rather than on plasmin activity, but this has not been tested directly.
        proposed_experiments:
        - experiment_id: exp_bduc_head_to_head_fibrinolysis_assays
          name: Head-to-head fibrinolytic assay panel in a single BDUC cohort
          description: Apply plasmin generation, turbidimetric clot formation and lysis, tPA-modified
            ROTEM, and non-activated whole-blood viscoelastometry to the same BDUC patients in a single
            study, to establish whether the reported direction of effect is a property of the patients
            or of the assays.
        - experiment_id: exp_bduc_hyperfibrinolytic_stratified_txa
          name: tPA-ROTEM-stratified tranexamic acid response study
          description: Stratify BDUC patients by tPA-ROTEM hyperfibrinolytic status and test prospectively
            whether that subgroup, and only that subgroup, derives benefit from tranexamic acid.
      selected_evidence:
        snippet: Overall, we observed a delayed clot formation process with reduced lysis potential resulting
          in a larger ROTEM-AUC in patients with BDUC.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42004172
      reference_title: Abnormal whole-blood viscoelastic test results in patients with bleeding disorder
        of unknown cause.
      evidence_source: HUMAN_CLINICAL
      explanation: Largest cohort, reporting reduced rather than enhanced lysis potential.
