      assertion_type: DifferentialDiagnosis
      assertion:
        name: Inherited platelet function disorder
        description: 'Excluded by repeated light transmission aggregometry, supplemented by flow cytometric
          mepacrine fluorescence and glycoprotein expression analysis. The exclusion is imperfect: aggregometry
          alterations are frequently unspecific and poorly reproducible, which is exactly the gap the
          occult platelet defect hypothesis occupies.

          '
        distinguishing_features:
        - Reproducible abnormalities on light transmission aggregometry define a platelet function defect;
          BDUC requires that aggregometry be normal.
      selected_evidence:
        snippet: PFDs are identified through repeated abnormalities in light transmission aggregometry
          (LTA), flow cytometric mepacrine fluorescence, and glycoprotein expression analysis.
        supports: SUPPORT
