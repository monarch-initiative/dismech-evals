  cc1f05734e7c2fbfbccbc1104363b3bd61014ba25ea05bb7be0b2ab7592cc20d:
    claim:
      about:
        disease:
          name: Bleeding Disorder of Unknown Cause
          disease_term:
            preferred_term: bleeding disorder of unknown cause
            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bduc_platelet_evidence_cohort_mismatch
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: The strongest mechanistic data for an occult platelet defect come from patients selected
          for ABNORMAL light transmission aggregometry. Do those findings transfer to BDUC, which by definition
          requires aggregometry to be normal?
        attaches_to:
        - pathophysiology#Occult Platelet Function and Secretion Defect
        rationale: The immature-platelet receptor profiling and platelet lipidomics studies both recruited
          patients with aggregometry alterations, that is, suspected platelet function defects. These
          patients sit immediately adjacent to BDUC and are plausibly the same biology sampled at a more
          detectable point on a continuum, but that is an assumption, not a result. Both evidence items
          are therefore graded INDIRECT on the platelet node. Until the same assays are applied to a formally
          BDUC-defined cohort, the platelet arm rests on transfer rather than on direct observation.
        proposed_experiments:
        - experiment_id: exp_bduc_platelet_profiling_in_normal_lta_cohort
          name: Immature-platelet profiling and lipidomics in a normal-aggregometry BDUC cohort
          description: Repeat immature-platelet surface receptor profiling and platelet lipidomics in
            patients meeting the ISTH SSC BDUC definition with normal light transmission aggregometry,
            retaining the abnormal-aggregometry group as a positive comparator, to test whether the reported
            platelet abnormalities transfer to BDUC proper.
      selected_evidence:
        snippet: In patients with a mild to moderate bleeding disorder (MBD) and abnormal light transmission
          aggregometry (LTA), a platelet function defect (PFD) is suspected. However, in many patients
          with PFD, the underlying mechanism remains elusive.
        supports: SUPPORT
    origin:
