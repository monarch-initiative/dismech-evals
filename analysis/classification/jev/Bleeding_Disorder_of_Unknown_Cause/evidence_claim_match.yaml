  3024da6d18026d83d29e2779e8d14e2f9785af39cf9e74b0e6c70f4a6ebdc74f:
    claim:
      about:
        disease:
          name: Bleeding Disorder of Unknown Cause
          disease_term:
            preferred_term: bleeding disorder of unknown cause
            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bduc_entity_versus_residual_category
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is BDUC a disease entity with a shared pathophysiology, or a residual administrative category
          that will dissolve into several distinct mechanisms and a group of patients without a bleeding
          disorder at all?
        attaches_to:
        - pathophysiology#Hemostatic Defect Below the Detection Threshold of Routine Testing
        rationale: dismech models BDUC as a single entry with parallel candidate arms, which is a modeling
          decision and not a settled fact. The case for an entity is that the phenotype is reproducible,
          severe, persistent over years, and indistinguishable in severity from named bleeding disorders.
          The case against is that reviews describe it explicitly as a heterogeneous group that mixes
          undiagnosed monogenic disease, polygenic contributions, and patients with a past bleeding event
          but no disorder — and that bleeding assessment tools cannot discriminate BDUC from named disorders,
          which is equally consistent with the label capturing several different things. If the heterogeneous
          view prevails, the correct dismech representation would eventually be a Grouping over several
          mechanism-defined entries rather than this single entry, and the hypothesis arms curated here
          are the natural seeds for those entries.
      selected_evidence:
        snippet: The bleeding scores were similar in patients with an established diagnosis of a bleeding
          disorder compared to patients with BUC.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32317240
      reference_title: The discriminatory power of bleeding assessment tools in adult patients with a
        mild to moderate bleeding tendency.
      evidence_source: HUMAN_CLINICAL
      explanation: Phenotypic indistinguishability, which cuts both ways in this argument.
