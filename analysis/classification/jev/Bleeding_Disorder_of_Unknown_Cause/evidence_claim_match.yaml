              label: hemorrhagic disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Fibrinolytic Balance
        biological_scale: MOLECULAR
        description: 'Dysregulation of the plasminogen activation system, classically framed as accelerated
          clot breakdown. Support is real but internally inconsistent: tissue plasminogen activator activity
          is detectable far more often in patients than controls, a tPA-modified thromboelastometry assay
          classifies roughly a fifth of BDUC patients as hyperfibrinolytic, and adding fibrinolytic assays
          to the work-up raises diagnostic yield. Against that, direct plasmin generation measurement
          found reduced, not increased, peak plasmin, and whole-blood viscoelastometry in the largest
          cohort found reduced rather than enhanced lysis potential. The entry keeps this arm deliberately
          named for the balance rather than for hyperfibrinolysis, and the direction conflict is recorded
          as an explicit controversy.

          '
        biological_processes:
        - preferred_term: fibrinolysis
          term:
            id: GO:0042730
            label: fibrinolysis
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: We conclude that the fibrinolytic system can play an etiological role for bleeding in
          patients with BUC.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
