        hypothesis_label: Excess of natural anticoagulants (free TFPI-alpha, activated protein C)
        status: EMERGING
        description: 'Bleeding is caused by an excess of physiological anticoagulants rather than by any
          procoagulant deficiency. Free TFPI-alpha above the 95th percentile is over-represented specifically
          in the unexplained-bleeding subgroup, TFPI activity is raised in a subset of an independent
          unclassified-bleeding cohort, and activated protein C antigen is highest in BDUC. Attractive
          because it reconciles a normal factor panel with a damped thrombin burst, and because it is
          the only candidate arm whose authors have proposed a concrete therapeutic target.

          '
      selected_evidence:
        snippet: For patients with BDUC, further evaluation may include non-routine testing to look for
          rare bleeding disorders not detected by routine hemostasis tests, such as thrombomodulin-associated
          coagulopathy, tissue factor pathway inhibitor-related bleeding disorder, hyperfibrinolytic-bleeding
          disorders or impaired tissue factor production.
        supports: SUPPORT
