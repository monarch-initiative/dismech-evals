  52946c6e02b3be033682e8a01fbe75077f97f4170b5c442a6310e65e882c3596:
    claim:
      about:
        disease:
          name: Bleeding Disorder of Unknown Cause
          disease_term:
            preferred_term: bleeding disorder of unknown cause
            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: Biochemical
      assertion:
        name: Thrombin Generation (Endogenous Thrombin Potential)
        presence: 'Impaired: prolonged lag time and time to peak with reduced peak, velocity index and
          area under the curve, on a normal routine coagulation panel'
        context: 'The most frequently replicated laboratory abnormality in BDUC, and the marker on which
          the leading mechanistic arm rests. Reproducibility is genuinely contested rather than merely
          unreplicated: two Vienna-linked cohorts find the full pattern, an independent Rotterdam cohort
          reproduces only the prolonged lag time, and a third cohort finds abnormalities in a minority
          with no diagnostic pattern.'
        specificity: Not diagnostic. Group-level separation from controls does not translate into a per-patient
          discriminator, and the degree of impairment does not track bleeding severity in any cohort.
        biomarker_term:
          preferred_term: Thrombin generation (endogenous thrombin potential)
          term:
            id: NCIT:C102266
            label: Endogenous Thrombin Potential Measurement
        readouts:
        - target: Impaired Thrombin Generation
          relationship: READOUT_OF
          direction: NEGATIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Calibrated thrombin generation is the direct assay readout of this mechanism
            node; lower thrombin-generating capacity corresponds to the hypothesized defect.
        notes: Global assay, not part of the ISTH minimum exclusion panel; see the Non-Routine and Global
          Hemostatic Testing diagnosis entry.
      selected_evidence:
        snippet: Thrombin generation was significantly impaired in BUC patients compared to healthy controls,
          exhibiting a prolonged lag time and time to peak and decreased maximum thrombin generation,
          velocity index, and area under the curve (AUC).
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/0
      context_paths:
