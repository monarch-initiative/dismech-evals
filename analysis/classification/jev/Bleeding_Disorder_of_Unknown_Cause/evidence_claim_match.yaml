      assertion_type: Pathophysiology
      assertion:
        name: Impaired Thrombin Generation
        biological_scale: MOLECULAR
        description: 'Reduced thrombin-generating capacity on calibrated global assays despite normal
          individual coagulation factor activities. This is the most frequently replicated laboratory
          abnormality in BDUC: the Vienna Bleeding Biobank reported prolonged lag time and time to peak
          with reduced peak and velocity in 382 patients, and an independent automated assay reproduced
          the same pattern. It is nonetheless curated as HYPOTHETICAL rather than established, because
          an independent Rotterdam cohort found no meaningful thrombin generation difference, and because
          in every cohort the degree of impairment fails to track bleeding severity.

          '
        biological_processes:
        - preferred_term: blood coagulation
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: DECREASED
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: TG revealed 26% patients with a long lag time and 19% with a decreased endogenous thrombin
          potential but no diagnostic pattern was seen.
        supports: SUPPORT
