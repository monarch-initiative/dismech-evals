        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: undetected_monogenic_cause
        hypothesis_label: Undetected monogenic hemostatic defect
        status: ALTERNATIVE
        description: 'BDUC is a temporary label that sequencing will progressively dissolve into named
          monogenic disorders. Retained as a genuine ALTERNATIVE because it is the implicit expectation
          behind most genetic work in this field, but the yield data argue strongly against it as a general
          explanation: a targeted high-throughput panel across 2396 patients achieved 49.2% diagnostic
          yield overall and only 3.2% in patients with unexplained bleeding and normal hemostasis testing,
          and an independent unclassified-bleeding cohort had entirely normal panel results in all 45
          patients tested.

          '
      selected_evidence:
        snippet: The molecular diagnostic rate was determined by the clinical phenotype, with an overall
          rate of 49.2% for all thrombotic, coagulation, platelet count, and function disorder patients
          and a rate of 3.2% for patients with unexplained bleeding disorders characterized by normal
          hemostasis test results.
        supports: SUPPORT
    origin:
