              label: hemorrhagic disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Thrombin Generation
        biological_scale: MOLECULAR
        description: 'Reduced thrombin-generating capacity on calibrated global assays despite normal
          individual coagulation factor activities. This is the most frequently replicated laboratory
          abnormality in BDUC: the Vienna Bleeding Biobank reported prolonged lag time and time to peak
          with reduced peak and velocity in 382 patients, and an independent automated assay reproduced
          the same pattern. It is nonetheless curated as HYPOTHETICAL rather than established, because
          an independent Rotterdam cohort found no meaningful thrombin generation difference, and because
          in every cohort the degree of impairment fails to track bleeding severity.

          '
        biological_processes:
        - preferred_term: blood coagulation
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: DECREASED
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: Thrombin generation was significantly impaired in BUC patients compared to healthy controls,
          exhibiting a prolonged lag time and time to peak and decreased maximum thrombin generation,
          velocity index, and area under the curve (AUC).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31177606
      reference_title: Thrombin-generating potential, plasma clot formation, and clot lysis are impaired
        in patients with bleeding of unknown cause.
      evidence_source: HUMAN_CLINICAL
      explanation: Primary case-control evidence in 382 BUC patients versus 100 controls.
