  ff93b1f5864b1e6a11cc0a02e61a562f44189d3c7281d7c3052d156afc495291:
    claim:
      about:
        disease:
          name: Bleeding Disorder of Unknown Cause
          disease_term:
            preferred_term: bleeding disorder of unknown cause
            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bduc_no_mondo_term
        kind: CURATION_TODO
        status: OPEN
        prompt: BDUC has a formal ISTH SSC definition but no MONDO term. Should a MONDO new term request
          be filed, and what should this entry's `disease_term` be until then?
        attaches_to:
        - pathophysiology#Hemostatic Defect Below the Detection Threshold of Routine Testing
        rationale: 'Searches of MONDO for "bleeding disorder", "bleeding diathesis", "hemorrhagic diathesis",
          "unclassified bleeding" and "unknown cause" return only mechanism-specific and gene-specific
          entities plus broad umbrella terms; there is no residual or unexplained category. HPO and NCIT
          likewise have no equivalent. This entry therefore anchors `disease_term` to MONDO:0002243 hemorrhagic
          disease, which is a strict superclass that also subsumes every entity BDUC is defined by excluding,
          and records the inexactness as a `skos:broadMatch` mapping. Since BDUC now has a published consensus
          definition and a preferred term endorsed by the ISTH SSC, it meets the usual bar for a MONDO
          new term request. This is the same class of upstream ontology gap recorded for postpartum haemorrhage
          and preterm birth in issue #7837 and should be folded into a single consolidated request rather
          than filed separately.'
      selected_evidence:
        snippet: We recommend that patients with a significant bleeding phenotype but normal laboratory
          investigations should be registered with a diagnosis of BDUC in preference to other terminology.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38518896
      reference_title: 'Standardization of definition and management for bleeding disorder of unknown
        cause: communication from the SSC of the ISTH.'
      evidence_source: OTHER
      explanation: The consensus definition and preferred term that make this a well-formed new term request
        rather than a curator coinage.
