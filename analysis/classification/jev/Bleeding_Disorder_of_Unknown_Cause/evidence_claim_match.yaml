        - preferred_term: fibrinolysis
          term:
            id: GO:0042730
            label: fibrinolysis
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: Overall, patients with BDUC counterintuitively exhibited reduced peak plasmin levels,
          potentially related to altered clot structure.
        supports: REFUTE
