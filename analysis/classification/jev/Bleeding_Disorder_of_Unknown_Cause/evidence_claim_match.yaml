          too early at sites of vascular injury, particularly at mucosal surfaces and surgical wounds
          where the hemostatic challenge is sustained. Whole-blood viscoelastometry in the largest BDUC
          cohort captures this as a globally altered clot formation and lysis profile that discriminates
          patients from controls.

          '
