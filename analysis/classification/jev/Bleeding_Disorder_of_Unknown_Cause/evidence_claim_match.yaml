  2068ef37de5638ca2f4d98c71f52bc2fd7e0441ac72e2291c1835453011e0a91:
    claim:
      about:
        disease:
          name: Bleeding Disorder of Unknown Cause
          disease_term:
            preferred_term: bleeding disorder of unknown cause
            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Occult Platelet Function and Secretion Defect
        biological_scale: CELLULAR
        description: 'A platelet-intrinsic defect that routine light transmission aggregometry fails to
          resolve, or that it resolves only as an unspecific and poorly reproducible alteration. Two orthogonal
          lines of evidence point here: surface-receptor profiling shows that the immature (RNA-rich)
          platelet subpopulation carries a distinct and abnormal receptor phenotype while mature platelets
          appear normal, and platelet lipidomics shows intrinsic lipid shifts that track with impaired
          aggregation. Both are curated as leads rather than as established BDUC mechanisms: each was
          measured in patients selected for abnormal aggregometry, which is adjacent to, but formally
          outside, the BDUC definition.

          '
        cell_types:
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: platelet activation
          term:
            id: GO:0030168
            label: platelet activation
          modifier: DECREASED
        - preferred_term: platelet degranulation
          term:
            id: GO:0002576
            label: platelet degranulation
          modifier: DECREASED
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: In patients, immature platelets expressed lower levels of CD62P, CD36, CD31, TLR2, and
          TLR4 but increased TLR9 expression, while mature platelets showed no differences.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40403972
      reference_title: Impaired surface receptor expression on immature platelets in bleeding patients
        with abnormal light transmission aggregometry.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Identifies an abnormality confined to immature platelets that whole-platelet assays
        would average away. Graded INDIRECT because the cohort was selected for abnormal aggregometry
        (suspected platelet function defect), not for BDUC, so reaching this node takes a transfer step:
        it is a mechanistic lead for this arm rather than a direct BDUC finding.'
