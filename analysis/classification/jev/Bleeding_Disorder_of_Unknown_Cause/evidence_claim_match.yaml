      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: impaired_thrombin_generation
        hypothesis_label: Reduced thrombin-generating capacity on global assays
        status: EMERGING
        description: 'Bleeding is caused by a globally reduced thrombin burst despite normal individual
          factor activities. This is the most replicated of the candidate mechanisms — demonstrated in
          382 patients in Vienna and independently reproduced on an automated platform — which is why
          it is the strongest arm in this entry. It is nonetheless EMERGING rather than CANONICAL for
          two reasons: an independent Rotterdam cohort found no meaningful thrombin generation difference,
          and in every cohort including the replication study, thrombin generation parameters fail to
          correlate with bleeding score.

          '
      selected_evidence:
        snippet: Bleeding severity did not correlate with parameters of thrombin generation, clot formation,
          or clot lysis.
        supports: SUPPORT
