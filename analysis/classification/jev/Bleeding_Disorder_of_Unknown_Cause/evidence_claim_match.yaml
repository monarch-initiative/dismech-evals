  31b825f44d1e86d0e62077558390d5fef5557d374f3234c54a7129d2f990281c:
    claim:
      about:
        disease:
          name: Bleeding Disorder of Unknown Cause
          disease_term:
            preferred_term: bleeding disorder of unknown cause
            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Low von Willebrand factor
        description: 'The nearest neighbour and the hardest boundary. Patients with von Willebrand factor
          in the 30-50 IU/dL range often lack a pathogenic VWF variant and show poor correlation between
          level and bleeding phenotype, so the entity is argued to sit between type 1 von Willebrand disease
          and BDUC rather than cleanly on either side.

          '
        distinguishing_features:
        - Von Willebrand factor antigen or activity of 30-50 IU/dL places a patient in the low VWF category
          rather than BDUC, which requires normal levels.
        - The ISTH SSC panel uses repeat VWF testing below 80 IU/dL to avoid misassigning a patient with
          fluctuating levels to BDUC.
      selected_evidence:
        snippet: low VWF represents an entity that appears to fall between type 1 VWD on the one hand
          and bleeding disorders of unknown cause on the other.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
