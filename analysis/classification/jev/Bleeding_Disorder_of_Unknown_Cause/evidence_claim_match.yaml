          by bleeding assessment tools, is indistinguishable from that of patients who do carry a named
          diagnosis such as von Willebrand disease or a platelet function defect — which is the central
          clinical argument that BDUC is a real bleeding phenotype rather than a labeling artifact of
          over-referral.

