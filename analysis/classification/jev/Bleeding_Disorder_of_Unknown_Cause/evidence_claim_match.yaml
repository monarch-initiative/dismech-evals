  feee8b09229398b2dd6af4ac0c61d8a8706d7f7645a65ef4ae97a58e28b1cd45:
    claim:
      about:
        disease:
          name: Bleeding Disorder of Unknown Cause
          disease_term:
            preferred_term: bleeding disorder of unknown cause
            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: Biochemical
      assertion:
        name: Plasma Clot Lysis Time
        presence: Prolonged relative to controls in the Rotterdam cohort, which is the opposite direction
          to the accelerated-lysis model
        context: The clearest example in BDUC of a biomarker whose measured direction contradicts the
          mechanism it is usually invoked for. Curated so the conflict is visible rather than resolved
          by selective citation.
        specificity: Direction-conflicted. A prolonged lysis time indicates slower, not faster, clot breakdown,
          so this result argues against hyperfibrinolysis as the general BDUC mechanism even though fibrinolytic
          testing improves diagnostic yield in other cohorts.
        readouts:
        - target: Altered Fibrinolytic Balance
          relationship: READOUT_OF
          endpoint_context: DIAGNOSTIC
          interpretation: Reports on the fibrinolytic arm, but in the direction opposite to the accelerated-lysis
            reading of that node. Direction is deliberately left unset because the cohorts disagree on
            sign.
        notes: 'biomarker_term deliberately omitted: the cited study uses a turbidimetric plasma clot
          lysis assay, and the only NCIT clot-lysis-time term (NCIT:C187805) is specific to the euglobulin
          method, which is a different assay.'
      selected_evidence:
        snippet: BUC patients demonstrated a significantly prolonged lag time in TG (median 7.7 minutes,
          IQR 6.7-8.7) and a significantly prolonged CLT (median 60.5 minutes, IQR 54.7-66.1) compared
          to controls. No differences in ROTEM variables were found.
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/3
      evidence_path: /biochemical/3/evidence/0
      context_paths:
      - /name
      - /disease_term
