      assertion:
        name: Free Tissue Factor Pathway Inhibitor Alpha
        presence: Elevated above the 95th percentile, disproportionately in the subgroup with no identifiable
          bleeding disorder
        context: The best-localized biomarker in BDUC, because the excess is reported specifically in
          the unexplained-bleeding subgroup rather than across mild bleeding disorders generally, and
          because it is mechanistically tied to the thrombin generation defect in the same study.
        specificity: Subset marker. Raised TFPI activity is reported in a subset of patients, not the
          whole population, so it partitions BDUC rather than defining it.
        biomarker_term:
          preferred_term: Free tissue factor pathway inhibitor alpha antigen
          term:
            id: NCIT:C202391
            label: Free Tissue Factor Pathway Inhibitor Antigen Measurement
        readouts:
        - target: Natural Anticoagulant Excess
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Free TFPI-alpha is the primary measured quantity behind the natural anticoagulant
            excess arm.
        - target: Impaired Thrombin Generation
          relationship: CORRELATES_WITH
          direction: NEGATIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Higher free TFPI-alpha is associated with a delayed thrombin burst while routine
            global clotting tests stay normal, which is the observational link between the two mechanism
            nodes.
      selected_evidence:
        snippet: This was pronounced in the subgroup of patients in whom no bleeding disorder could be
          identified (bleeding of unknown cause [BUC; n = 420]
        supports: SUPPORT
