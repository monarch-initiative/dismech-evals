  4dea8f75b450ff7596f5b991201ecf8e922e5dfd3f3dd4fa0de5d8d42d899728:
    claim:
      about:
        disease:
          name: Bleeding Disorder of Unknown Cause
          disease_term:
            preferred_term: bleeding disorder of unknown cause
            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bduc_treatment_evidence_extrapolated
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Every hemostatic agent used in BDUC is prescribed on the basis of extrapolation from other
          bleeding disorders. Do tranexamic acid, desmopressin and platelet transfusion actually work
          in BDUC?
        attaches_to:
        - pathophysiology#Mucocutaneous and Post-Challenge Bleeding
        rationale: 'No randomized trial has been performed in a BDUC-defined population. The treatment
          recommendations are explicitly derived from phenotypically similar disorders, and the observational
          data are ambiguous: two cohorts show lower bleeding rates with periprocedural prophylaxis, while
          a third reports frequent bleeding complications irrespective of treatment, and postpartum hemorrhage
          occurs in a quarter to a third of deliveries despite prophylaxis. This is the most clinically
          consequential gap in the entry, because the affected population is largely young women facing
          surgery and childbirth.'
        proposed_experiments:
        - experiment_id: exp_bduc_txa_randomized_periprocedural_trial
          name: Randomized trial of tranexamic acid for periprocedural prophylaxis in BDUC
          description: A randomized trial of tranexamic acid versus placebo for periprocedural hemostatic
            prophylaxis, restricted to patients meeting the ISTH SSC BDUC definition and powered on adjudicated
            bleeding after a standardized procedure.
        - experiment_id: exp_bduc_mechanism_stratified_antifibrinolytic_trial
          name: Mechanism-stratified antifibrinolytic trial in BDUC
          description: A trial stratified by fibrinolytic phenotype, testing whether the hyperfibrinolytic
            subgroup derives greater benefit from antifibrinolytic therapy than the rest of the BDUC population.
      selected_evidence:
        snippet: Primary research in BDUC remains limited; future multisite observational and therapeutic
          clinical trials in BDUC may help us better understand multifactorial bleeding risk and further
          define the role of hemostatic therapies.
        supports: SUPPORT
