            term:
              id: MONDO:0002243
              label: hemorrhagic disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bduc_assay_severity_dissociation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does no laboratory abnormality identified in BDUC correlate with bleeding severity,
          and can any candidate mechanism be causal if it shows no dose-response relationship with the
          phenotype?
        attaches_to:
        - pathophysiology#Impaired Thrombin Generation
        - pathophysiology#Altered Fibrinolytic Balance
        - pathophysiology#Altered Fibrin Clot Architecture
        - pathophysiology#Impaired Hemostatic Plug Formation and Clot Stability
        rationale: 'This is the central unresolved problem of the field and the reason no hypothesis in
          this entry is CANONICAL. Every major study reports the same dissociation: thrombin generation,
          clot formation and clot lysis parameters do not correlate with bleeding severity; plasma clot
          properties show no clear association with clinical severity; thromboelastometry parameters do
          not correlate with bleeding scores; and peak plasmin does not correlate with bleeding severity.
          A group-level difference from controls without any within-group dose-response is compatible
          with the abnormality being a correlate or an epiphenomenon rather than the cause, and the possibility
          that the true determinant has not yet been measured cannot be excluded.'
        proposed_experiments:
        - experiment_id: exp_bduc_composite_assay_dose_response
          name: Composite multi-assay model versus prospective bleeding events
          description: Test whether composite models combining thrombin generation, clot structure, and
            fibrinolytic parameters, rather than single parameters, recover a dose-response relationship
            with prospectively collected bleeding events rather than with retrospective bleeding scores.
        - experiment_id: exp_bduc_standardized_challenge_outcome
          name: Standardized hemostatic challenge as the bleeding outcome
          description: Use prospectively adjudicated bleeding after a standardized hemostatic challenge
            such as dental extraction as the outcome measure, to reduce the recall and scoring noise that
            a retrospective bleeding assessment tool introduces into any dose-response analysis.
      selected_evidence:
        snippet: Bleeding severity did not correlate with parameters of thrombin generation, clot formation,
          or clot lysis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31177606
      reference_title: Thrombin-generating potential, plasma clot formation, and clot lysis are impaired
        in patients with bleeding of unknown cause.
      evidence_source: HUMAN_CLINICAL
      explanation: The dissociation in the largest thrombin generation study.
