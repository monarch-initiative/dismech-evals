              label: hemorrhagic disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hemostatic Defect Below the Detection Threshold of Routine Testing
        biological_scale: MOLECULAR
        role: trigger
        description: 'The definitional starting point of BDUC. The patient bleeds, but every assay in
          the recommended panel is normal. This node asserts only what the evidence supports: that a hemostatic
          abnormality exists which the available assays do not resolve, without committing to which limb
          of hemostasis is at fault. It is deliberately modeled as a trigger with several parallel, non-exclusive
          downstream arms rather than as a placeholder for one hidden defect, because the cohort data
          are most consistent with a multifactorial and heterogeneous origin.

          '
        biological_processes:
        - preferred_term: hemostasis
          term:
            id: GO:0007599
            label: hemostasis
          modifier: DECREASED
      selected_evidence:
        snippet: To diagnose bleeding disorder of unknown cause (BDUC), normal complete blood count, prothrombin
          time, activated partial thromboplastin time, thrombin time, von Willebrand factor antigen, von
          Willebrand factor function, coagulation factors VIII, IX, and XI, and platelet light transmission
          aggregometry should be the minimum laboratory assessment.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38518896
      reference_title: 'Standardization of definition and management for bleeding disorder of unknown
        cause: communication from the SSC of the ISTH.'
      evidence_source: OTHER
      explanation: ISTH SSC consensus specifying the exact panel that must be normal, which is what makes
