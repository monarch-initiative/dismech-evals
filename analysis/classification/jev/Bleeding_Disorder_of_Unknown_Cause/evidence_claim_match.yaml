      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: soluble_thrombomodulin_excess
        hypothesis_label: Soluble thrombomodulin excess as a cause of unexplained bleeding
        status: DEPRECATED
        description: 'A specific and testable proposal, derived from families with THBD variants causing
          massively raised soluble thrombomodulin, that the same mechanism underlies unexplained mild
          bleeding more broadly. It is curated here precisely because it was tested and failed: in 507
          patients with mild bleeding disorders including BUC, soluble thrombomodulin levels, their distribution,
          their relationship to bleeding severity, and THBD sequencing were all unremarkable. Retained
          as DEPRECATED rather than deleted so that the negative result is visible and the hypothesis
          is not silently re-proposed.

          '
      selected_evidence:
        snippet: TM-associated coagulopathy appears to be rare, as it was not identified in our large
          cohort of patients with MBD. Soluble TM did not arise as a risk factor for bleeding or altered
          haemostasis in these patients.
        supports: REFUTE
