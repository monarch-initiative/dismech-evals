      assertion:
        name: Objective Bleeding Phenotype Quantification (ISTH-BAT)
        description: 'A standardized bleeding assessment tool score is the mandated first step, because
          in a diagnosis of exclusion the phenotype is the only positive finding. Its limitation must
          be stated alongside it: bleeding assessment tools quantify severity well but discriminate poorly
          between BDUC and named bleeding disorders, so a high score establishes that bleeding is real,
          not what is causing it.

          '
      selected_evidence:
        snippet: We recommend that bleeding history in these patients should be objectively assessed using
          the International Society on Thrombosis and Haemostasis (ISTH) bleeding assessment tool.
        supports: SUPPORT
