        presence: Reduced peak plasmin, counter to the hyperfibrinolysis model
        context: Direct measurement of plasmin generation, as opposed to inference from lysis assays.
          Its authors redirect the explanation towards clot architecture rather than accelerated lysis,
          which is why the entry carries a separate Altered Fibrin Clot Architecture node.
        specificity: Mechanistically informative rather than diagnostic; no threshold or per-patient discrimination
          has been reported.
        readouts:
        - target: Altered Fibrinolytic Balance
          relationship: READOUT_OF
          direction: NEGATIVE
          endpoint_context: DIAGNOSTIC
          interpretation: Directly measures the plasminogen activation output of this node and finds it
            reduced, which is the principal evidence against naming the node hyperfibrinolysis.
        - target: Altered Fibrin Clot Architecture
          relationship: CORRELATES_WITH
          endpoint_context: DIAGNOSTIC
          interpretation: The authors attribute the reduced peak plasmin to altered clot structure, linking
            this marker to the clot architecture arm.
        notes: 'biomarker_term deliberately omitted: NCIT has plasminogen and plasmin/alpha-2-antiplasmin
          complex measurement terms but none for peak plasmin from a plasmin generation assay.'
      selected_evidence:
        snippet: Overall, patients with BDUC counterintuitively exhibited reduced peak plasmin levels,
          potentially related to altered clot structure.
        supports: SUPPORT
