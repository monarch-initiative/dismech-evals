        snippet: CFD evaluation should extend beyond routine assays (prothrombin time, activated thromboplastin
          time, thrombin time), as clinically relevant mild reductions in factors VIII, IX, and XI may
          occur despite normal screening tests; and factor XIII deficiency is not detected by global assays.
        supports: SUPPORT
