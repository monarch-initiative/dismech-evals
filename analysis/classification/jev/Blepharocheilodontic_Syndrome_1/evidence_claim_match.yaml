          E-cadherin, the variant dimerized with the wild-type protein and interfered with adherens junction
          formation, whereas hereditary diffuse gastric cancer variants tested for comparison did not,
          which led the authors to define BCDS variants as a distinct, dominant-negative class.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CDH1
          term:
