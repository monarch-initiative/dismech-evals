      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous CDH1 Extracellular Domain Variant
        description: 'A heterozygous germline CDH1 variant alters the extracellular cadherin repeats of
          E-cadherin: missense changes at the conserved calcium-binding linker between EC1 and EC2 or
          at other conserved EC residues, the in-frame deletion p.Val454del in EC3, or exon 9 splice-donor
          variants that skip exon 9 and remove much of EC3. Each such change is expected to perturb calcium
          binding or ectodomain conformation and so the ability of E-cadherin to form adhesive dimers.'
        biological_scale: MOLECULAR
        genetic_context:
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
          functional_impact_category: DOMINANT_NEGATIVE
          description: Germline, de novo or inherited. DOMINANT_NEGATIVE follows the Kievit cell assays
            in which BCDS variants dimerized with wild-type E-cadherin and suppressed junction formation.
            Ghoumid et al instead reported accelerated degradation of the variant protein, which would
            reduce the amount of E-cadherin; the two observations are not mutually exclusive (see the
            discussion cdh1_bcds_allele_mechanism).
        genes:
        - preferred_term: CDH1
          term:
            id: hgnc:1748
            label: CDH1
      selected_evidence:
        snippet: both studies detected missense mutations at the conserved Asp254-Gln255-Asn-256-Asp257
          'linker' region that comprises a calcium ion-binding site between extracellular domains 1 and
          2
        supports: SUPPORT
