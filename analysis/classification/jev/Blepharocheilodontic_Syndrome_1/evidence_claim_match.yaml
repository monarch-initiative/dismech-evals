  640f8192dbef0b0afa73a043bb3bd9b2b872ca906e53a706efa47e08a00c7d6b:
    claim:
      about:
        disease:
          name: Blepharocheilodontic Syndrome 1
          disease_term:
            preferred_term: blepharocheilodontic syndrome 1
            term:
              id: MONDO:0054740
              label: blepharocheilodontic syndrome 1
        context: []
      assertion_type: Genetic
      assertion:
        name: CDH1
        gene_term:
          preferred_term: CDH1
          term:
            id: hgnc:1748
            label: CDH1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Heterozygous missense, in-frame deletion or exon 9 splice-donor variant altering the
          extracellular cadherin repeats
        notes: 'BCDS-associated CDH1 variants reported in the two founding cohorts all affect the extracellular
          domain: missense changes at the EC1-EC2 calcium-binding linker (Asp254, Asn256, Asp257) and
          elsewhere in EC2 and EC3, the in-frame deletion p.Val454del, and splice variants at the exon
          9 donor, which cause exon 9 skipping and loss of much of EC3. This contrasts with hereditary
          diffuse gastric cancer, in which almost all truncating variants act by complete loss of function.
          relationship_type CAUSATIVE is set because two independent cohorts identified CDH1 variants
          in most BCDS index patients and the variants were shown to be deleterious in functional assays;
          no ClinGen record exists to copy a validity tier from. CTNND1, which causes BCDS2, is not part
          of this entry.'
        variants:
        - name: c.760G>A (p.Asp254Asn)
          description: A recurrent missense variant at the first residue of the conserved Asp254-Gln255-Asn256-Asp257
            calcium-binding linker between EC1 and EC2, reported in seven BCDS cases in the Kievit cohort
            and also segregating in families with nonsyndromic cleft lip with or without cleft palate.
            In a review of 27 heterozygous carriers from seven families, an orofacial cleft was present
            in all 16 males and 5 of 11 females, and no carrier had a gastrointestinal tumour, including
            three carriers aged 68 to 77 years. The nonsyndromic cleft study that first reported it concluded
            that CDH1 haploinsufficiency was the likely mechanism, which differs from the dominant-negative
            interpretation of the BCDS functional work.
          type: missense variant
          gene:
            preferred_term: CDH1
            term:
              id: hgnc:1748
              label: CDH1
        - name: c.1198G>A (p.Asp400Asn)
          description: A missense variant in the extracellular cadherin repeats that co-segregated with
            BCD syndrome in a Chinese mother and son who had eyelid and dental anomalies, sparse hair
            and no orofacial cleft.
          type: missense variant
          gene:
            preferred_term: CDH1
            term:
              id: hgnc:1748
              label: CDH1
        - name: c.1320+1G>C
          description: A splice-donor variant at intron 9 that induces exon 9 skipping and removes a large
            part of EC3; one of several BCDS variants at this donor site.
          type: splice donor variant
          gene:
            preferred_term: CDH1
            term:
              id: hgnc:1748
              label: CDH1
      selected_evidence:
        snippet: We identified five CDH1 heterozygous missense mutations and three CTNND1 heterozygous
          truncating mutations leading to loss-of-function or haploinsufficiency.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
