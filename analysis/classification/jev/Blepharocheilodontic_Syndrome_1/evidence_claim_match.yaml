            label: cadherin binding involved in cell-cell adhesion
          modifier: ABNORMAL
      selected_evidence:
        snippet: Functional experiments in zebrafish and human cells showed that the CDH1 variants impair
          the cell adhesion function of the cadherin-catenin complex in a dominant-negative manner.
