      assertion_type: Phenotype
      assertion:
        name: Narrow palpebral fissure
        description: 'Narrowing of the palpebral fissures is the craniofacial feature that BIS shares
          with class II Helsmoortel-Van der Aa syndrome, and it is this shared feature that motivated
          the search for (and discovery of) a common phenotype-specific episignature.

          '
        notes: 'Near-duplicate relationship with the Blepharophimosis entry above, recorded explicitly
          so downstream consumers do not double-count. HP:0000581 Blepharophimosis and HP:0045025 Narrow
          palpebral fissure are siblings under HP:0200007 Abnormal size of the palpebral fissures, and
          their definitions differ only in scope: HP:0045025 is reduction in the vertical eyelid distance
          alone, whereas HP:0000581 adds the short (horizontally reduced) fissure and the "fixed" qualifier.
          Both are retained here deliberately, for two reasons. First, the HPO annotation of OMIM:619293
          itself carries both terms at different counts, blepharophimosis 14/14 and narrow palpebral fissure
          10/14, both sourced to PMID:32694869 (checked against the HPO annotation API on 2026-08-01),
          so collapsing them would discard a distinction the source annotation makes. Second, HP:0045025
          is the term that carries the BIS-versus-HVDAS shared-craniofacial-feature evidence from PMID:38884529,
          which is the observation that motivated the shared-episignature study; that argument is about
          the shared narrowing specifically, not about the full BIS facial gestalt. A consumer computing
          feature counts should treat HP:0045025 here as subsumed by HP:0000581 rather than as an additional
          independent feature.

          '
        phenotype_term:
          preferred_term: Narrow palpebral fissure
          term:
            id: HP:0045025
            label: Narrow palpebral fissure
      selected_evidence:
        snippet: an overlapping craniofacial phenotype with narrowing of the palpebral fissures in a subset
          of patients with HVDAS and BIS
