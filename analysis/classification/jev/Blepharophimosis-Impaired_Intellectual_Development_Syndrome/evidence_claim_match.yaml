            term:
              id: MONDO:0859139
              label: blepharophimosis-impaired intellectual development syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Nicolaides-Baraitser syndrome
        disease_term:
          preferred_term: Nicolaides-Baraitser syndrome
          term:
            id: MONDO:0011053
            label: intellectual disability-sparse hair-brachydactyly syndrome
        description: 'NCBRS is the other, far better known, SMARCA2-related disorder (OMIM 601358). It
          is allelic to BIS but is a separate clinical and molecular entity. This is the single most important
          named-entity distinction for this file: the large majority of published SMARCA2 clinical literature
          describes NCBRS, and NCBRS cohort data must NOT be attributed to BIS.

          '
        distinguishing_features:
        - Variant position - NCBRS variants lie predominantly INSIDE the SMARCA2 helicase (ATPase) domains,
          whereas all reported BIS variants lie OUTSIDE them. Position within the gene is the primary
          molecular discriminator.
        - Ascertainment - the BIS cohort was deliberately assembled from individuals with a syndromic
          neurodevelopmental disorder judged NOT consistent with NCBRS, so the two entities were separated
          clinically before they were separated molecularly.
        - Facial gestalt - BIS is defined by blepharophimosis, epicanthal folds, and a downturned nasal
          tip; NCBRS is defined by sparse scalp hair and prominent interphalangeal joints.
        - Functional assay - yeast growth-phenotype assays differentiate NCBRS-causing from non-NCBRS
          SMARCA2 variants.
        - Episignature and transcriptome - blood-leukocyte transcriptomic and DNA methylation signatures
          differentiate NCBRS from BIS.
        - Seizure burden - epilepsy is a prominent feature of NCBRS but is not part of the BIS definition;
          no seizure frequency is curated in this entry because importing the NCBRS epilepsy burden would
          materially misstate the BIS phenotype.
        - Proposed molecular lesion differs in kind, not degree - the NCBRS variants sit in ultra-conserved
          catalytic ATPase motifs and are proposed to disrupt ATPase activity while leaving SWI/SNF assembly
          intact; the BIS variants sit outside those motifs, so the two allele classes are not a severity
          gradient of one lesion.
      selected_evidence:
        snippet: phenotypically and molecularly distinct from NCBRS
        supports: SUPPORT
