      assertion:
        name: DNA methylation episignature testing
        description: 'Genome-wide DNA methylation profiling of blood leukocytes yields a reproducible
          BIS episignature that separates BIS from Nicolaides-Baraitser syndrome and from SMARCA2-variant
          carriers with nonspecific phenotypes, and can therefore be used to resolve SMARCA2 variants
          of uncertain significance. Note an important interpretive caveat: the BIS episignature is NOT
          unique to SMARCA2 — it is shared with class II Helsmoortel-Van der Aa syndrome caused by truncating
          ADNP variants, so a positive episignature must be read together with the sequencing result.

          '
      selected_evidence:
        snippet: Transcriptomic and DNA methylation signatures differentiated NCBRS from BIS and those
          with nonspecific phenotype.
        supports: SUPPORT
