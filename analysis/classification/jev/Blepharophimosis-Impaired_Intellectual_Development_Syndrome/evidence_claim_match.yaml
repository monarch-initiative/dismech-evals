        biological_scale: MOLECULAR
        description: 'SMARCA2 (BRM) encodes a catalytic ATPase subunit of the BAF (SWI/SNF) chromatin
          remodeling complex, which uses ATP hydrolysis to reposition nucleosomes and thereby control
          transcription. BIS-causing variants cluster outside the helicase (ATPase) domains, a positionally
          distinct class from the helicase-domain variants that cause Nicolaides-Baraitser syndrome. Yeast
          growth-phenotype assays separate the two variant classes functionally, indicating that BIS variants
          do not simply reproduce the NCBRS lesion. The precise biochemical consequence of the BIS variant
          class (for example, altered subunit assembly, altered targeting, or altered non-catalytic regulatory
          function rather than loss of ATPase activity) has not been resolved.

          '
        biological_processes:
        - preferred_term: chromatin remodeling
          term:
            id: GO:0006338
