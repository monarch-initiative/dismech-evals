  d85d896db8b219a9b4c993372c70a5a4c389f35ae6e436c9984b8b672e2d8186:
    claim:
      about:
        disease:
          name: Blepharophimosis-Impaired Intellectual Development Syndrome
          disease_term:
            preferred_term: blepharophimosis-impaired intellectual development syndrome
            term:
              id: MONDO:0859139
              label: blepharophimosis-impaired intellectual development syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SMARCA2
        notes: 'De novo SMARCA2 variants that cluster OUTSIDE the helicase (ATPase) domains cause BIS.
          Variant location within SMARCA2 is the discriminating genotype feature: most Nicolaides-Baraitser
          syndrome variants fall INSIDE the helicase domains, whereas all BIS variants reported in the
          founding cohort fall outside them.

          Deliberate under-assertion: the specific variant consequence class for BIS (missense versus
          in-frame versus truncating) is NOT asserted here. The quotable abstract applies the word "nontruncating"
          to the NCBRS variant class, not explicitly to the BIS variant class, and the per-variant table
          lives in the paywalled full text. Positional clustering outside the helicase domains is the
          only variant property this entry claims, because it is the only one directly stated for BIS.

          Domain-boundary nuance (important for anyone auditing this entry for internal consistency):
          "outside the helicase domains" is the founding paper''s FUNCTIONAL partition — the ultra-conserved
          catalytic ATPase motifs — and not UniProt''s annotation boundary. UniProt P51531 annotates a
          Helicase ATP-binding domain spanning residues 736-901 (feature table checked 2026-08-01), and
          two reported BIS alleles, p.(Met856Val) and p.(Leu766Val), fall INSIDE that span; p.(Leu766Val)
          is in fact the allele Sarli et al. label "BIS_atypical". This entry therefore reports the positional
          claim as the authors frame it and does NOT assert that every BIS residue lies outside UniProt''s
          annotated DExx domain. This matters concretely here because the PMID:38751117 evidence item
          cited on the episignature pathophysiology node is about SMARCA2 M856V. The per-variant residue
          list comes from the Sarli et al. 2024 Table 1, which lives in full text that is not in this
          repository''s reference cache, so it is recorded as provenance rather than quoted as a snippet.

          '
        gene_term:
          preferred_term: SMARCA2
          term:
            id: hgnc:11098
            label: SMARCA2
      selected_evidence:
        snippet: By next-generation sequencing, we identified candidate variants in SMARCA2 in 20 individuals
          from 18 families with a syndromic neurodevelopmental disorder not consistent with NCBRS.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
