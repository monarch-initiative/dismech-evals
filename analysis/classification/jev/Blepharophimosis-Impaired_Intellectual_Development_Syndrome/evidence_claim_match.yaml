        discussion_id: gap_bis_natural_history_and_management
        kind: KNOWLEDGE_GAP
        prompt: What is the natural history of BIS, and are there condition-specific surveillance or management
          recommendations?
        rationale: 'BIS was delineated only in 2020 and has no GeneReviews chapter (searched: no GeneReviews
          article exists for BIS or for a SMARCA2 disorder other than the NCBRS chapter, PMID:26468571).
          Published data are cross-sectional dysmorphology and molecular analyses; there are no longitudinal
          outcome data, no reported adult outcomes, and no BIS-specific management or surveillance guideline.
          Management is therefore currently generic developmental-disability care, and this entry deliberately
          curates only genetic counseling rather than importing the NCBRS management plan.

          '
        proposed_experiments:
        - experiment_id: exp_bis_natural_history_registry
          name: Prospective BIS natural-history registry
          description: Establish a prospective natural-history study or patient registry across the international
            BIS referral network, collecting uniform developmental, neurologic, ophthalmologic, and adult-outcome
            data.
        - experiment_id: exp_bis_ophthalmologic_assessment
          name: Systematic ophthalmologic assessment of BIS blepharophimosis
          description: Systematically assess visual axis obstruction, amblyopia risk, and surgical need
            in the blepharophimosis of BIS, to determine whether the eyelid surgery pathway used in other
            blepharophimosis syndromes applies here.
      selected_evidence:
        snippet: Blepharophimosis with intellectual disability (BIS) is a recently recognized disorder
        supports: SUPPORT
