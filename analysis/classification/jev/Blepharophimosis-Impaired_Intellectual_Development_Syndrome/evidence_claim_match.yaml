      assertion_type: DifferentialDiagnosis
      assertion:
        name: Helsmoortel-Van der Aa syndrome (ADNP syndrome), class II
        disease_term:
          preferred_term: ADNP-related multiple congenital anomalies - intellectual disability - autism
            spectrum disorder
          term:
            id: MONDO:0014379
            label: ADNP-related multiple congenital anomalies - intellectual disability - autism spectrum
              disorder
        description: 'HVDAS is caused by variants in ADNP; the class II subgroup is caused by truncating
          ADNP variants. A subset of individuals with HVDAS shares the narrow-palpebral-fissure craniofacial
          phenotype with BIS, and class II HVDAS shares the BIS DNA methylation episignature. HVDAS is
          therefore both a clinical and an epigenetic mimic of BIS. MONDO additionally carries a dedicated
          entity for this overlap, MONDO:0979360 (ADNP-related blepharophimosis-intellectual disability
          syndrome).

          '
        distinguishing_features:
        - Causal gene - HVDAS is caused by ADNP variants (specifically truncating variants for class II),
          not SMARCA2; sequencing resolves the two unambiguously.
        - Episignature does NOT discriminate - the shared episignature is phenotype-specific rather than
          gene-specific, so methylation testing alone cannot separate BIS from class II HVDAS and must
          be interpreted with the sequencing result.
        - Mechanistic basis of the overlap - ADNP interacts molecularly with the BAF complex of which
          SMARCA2 is the catalytic subunit, which is the proposed explanation for the convergent methylation
          profile.
      selected_evidence:
        snippet: Individuals bearing variants within the bipartite nuclear localization (BNL) signal domain
          of ADNP present with the neurodevelopmental disorder known as Helsmoortel-Van Der Aa Syndrome
          (HVDAS).
        supports: SUPPORT
