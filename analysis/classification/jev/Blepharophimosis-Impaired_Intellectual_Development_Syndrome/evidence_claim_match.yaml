      assertion_type: Discussion
      assertion:
        discussion_id: gap_bis_smarca2_variant_mechanism
        kind: KNOWLEDGE_GAP
        prompt: What is the biochemical consequence of the BIS-class (non-helicase-domain) SMARCA2 variants,
          and is BIS a loss-of-function, gain-of-function, or dominant-negative disorder?
        rationale: 'The BIS variant class is defined positionally (outside the helicase domains) and is
          known only to behave differently from NCBRS variants in a yeast growth assay. Whether these
          variants reduce ATPase-dependent remodeling, alter BAF complex assembly or genomic targeting,
          or perturb a non-catalytic regulatory function of SMARCA2 has not been established. Without
          this, the mechanism node in this entry can only be annotated as ABNORMAL rather than INCREASED/DECREASED,
          and no rational therapeutic target can be nominated.

          '
        attaches_to:
        - pathophysiology#Non-Helicase-Domain SMARCA2 Variants Perturb the BAF Chromatin Remodeling Complex
        proposed_experiments:
        - experiment_id: exp_bis_baf_reconstitution
          name: Biochemical reconstitution of BIS-variant BAF complexes
          description: Reconstitute BAF complexes carrying BIS-class SMARCA2 variants and measure nucleosome
            remodeling and ATPase activity directly, in parallel with NCBRS-class variants and wild type.
        - experiment_id: exp_bis_baf_occupancy_chip
          name: Comparative BAF genomic occupancy in isogenic lines
          description: Perform ChIP-seq/CUT&RUN for BAF subunits in isogenic cell lines carrying BIS-class
            versus NCBRS-class SMARCA2 variants to test whether the BIS lesion alters genomic targeting
            rather than catalytic activity.
        - experiment_id: exp_bis_allele_series_organoid
          name: SMARCA2 allele-series modeling in human neural systems
          description: Model a SMARCA2 allele series (BIS variants, NCBRS variants, null) in human neural
            progenitors and cerebral organoids to test whether BIS variants phenocopy SMARCA2 knockout.
      selected_evidence:
        snippet: Yeast phenotype assays differentiated NCBRS from non-NCBRS SMARCA2 variants.
        supports: SUPPORT
