      assertion_type: AnimalModel
      assertion:
        species: mouse (Mus musculus)
        genotype: Germline Brm (Smarca2) knockout
        category: Germline loss-of-function model
        genes:
        - preferred_term: SMARCA2
          term:
            id: hgnc:11098
            label: SMARCA2
        description: 'The only long-established Smarca2 mouse model is a germline Brm knockout. It is
          explicitly NOT a model of BIS: homozygous null mice develop normally, apparently because BRG1
          (SMARCA4) is upregulated and functionally substitutes for BRM. This is doubly informative —
          it argues against simple SMARCA2 haploinsufficiency as the BIS mechanism, and it means a knockout
          cannot test the actual BIS lesion: deleting the gene removes the protein entirely, so a null
          model cannot report on a heterozygous de novo allele whose defining, directly evidenced property
          is WHERE in SMARCA2 it sits (clustered outside the helicase domains as the founding paper partitions
          them). No BIS hotspot knock-in mouse has been reported.

          '
        associated_phenotypes:
        - Normal development in homozygous null mice
        - Increased adult body weight (approximately 15 percent over littermates)
        - Impaired G0/G1 cell-cycle arrest in mutant embryonic fibroblasts
      selected_evidence:
        snippet: "mutant embryonic fibroblasts were significantly deficient in their ability to arrest\
          \ in \nthe G0/G1 phase of the cell cycle in response to cell confluency or DNA damage."
        supports: SUPPORT
