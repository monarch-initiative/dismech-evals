        hypothesis_label: BIS alleles perturb BAF inter-subunit interfaces, whereas NCBRS alleles impair
          ATPase catalysis
        status: EMERGING
        description: 'The leading explanatory model for why two allelic SMARCA2 disorders exist is that
          the two variant classes damage different properties of the same protein. NCBRS variants localize
          to ultra-conserved catalytic ATPase motifs and are proposed to impair ATPase activity while
          leaving complex assembly intact. BIS variants localize outside those motifs, and non-truncating
          mSWI/SNF neurodevelopmental variants in general concentrate at inter-subunit and nucleosome-engagement
          interfaces — suggesting that BIS is an assembly/engagement lesion rather than a catalytic one.
          Both classes act dominantly from heterozygous de novo variants. The argument against simple
          SMARCA2 haploinsufficiency deliberately does NOT rest on the BIS variant consequence class,
          which this entry does not assert (see genetic[].notes). It rests on two other observations:
          complete germline loss of mouse Brm yields a phenotypically normal animal through BRG1 compensation,
          so pure loss of SMARCA2 is buffered rather than pathogenic; and BIS individuals nevertheless
          carry a reproducible DNA methylation episignature — a positive, directional change in the chromatin
          output of the complex, not a silent dosage reduction.

          '
        notes: 'Status is EMERGING, not CANONICAL, deliberately. The NCBRS arm rests on the founding paper''s
          own stated inference ("likely do not impair SWI/SNF complex assembly but may be associated with
          disrupted ATPase activity"), not on a direct assembly assay. The BIS arm rests on variant position
          plus a pan-mSWI/SNF structural analysis that did not assay BIS alleles, plus a yeast growth
          assay that shows only that the two classes differ. No biochemical measurement of BAF assembly,
          subunit engagement, or nucleosome remodeling has been published for any BIS allele.

