      assertion_type: Pathophysiology
      assertion:
        name: BAF Subunit Switching in Neural Development
        biological_scale: CELLULAR
        description: 'The route from a BAF-complex lesion to a neurodevelopmental phenotype runs through
          the developmentally regulated subunit composition of neural BAF complexes. SMARCA2 (Brm) is
          one of the two ATPases found in the neural-progenitor BAF (npBAF) complex, and an obligatory
          switch in the accessory subunits of these complexes accompanies — and is required for — the
          transition from proliferating neural progenitors to postmitotic neurons. A SMARCA2 lesion therefore
          acts on a complex whose correct composition and activity are rate-limiting for neuronal differentiation.

          '
        notes: 'Scope caveat: this node is general BAF neurobiology, not BIS-specific. The cited work
          characterizes the npBAF-to-nBAF subunit switch in mouse neural stem/progenitor cells; no study
          has tested a BIS-class SMARCA2 allele in this system. It is included because it supplies the
          only published mechanistic bridge between BAF perturbation and a neurodevelopmental outcome,
          and its evidence items are marked PARTIAL accordingly.

          '
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: neuron differentiation
          term:
            id: GO:0030182
            label: neuron differentiation
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: npBAF complex
          term:
            id: GO:0071564
            label: npBAF complex
      selected_evidence:
        snippet: "are quantitatively associated with the \nSWI2/SNF2-like ATPases, Brg and Brm."
        supports: SUPPORT
    origin:
