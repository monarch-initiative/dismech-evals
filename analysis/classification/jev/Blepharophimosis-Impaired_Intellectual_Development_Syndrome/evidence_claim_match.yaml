            term:
              id: MONDO:0859139
              label: blepharophimosis-impaired intellectual development syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_bis_smarca2_mouse_null
        kind: HUMAN_MODEL_MISMATCH
        prompt: Can any existing Smarca2 mouse model represent BIS, given that the germline Brm-null mouse
          develops normally through BRG1 compensation while BIS is caused by a heterozygous de novo allele
          clustered outside the helicase domains?
        rationale: 'The available Smarca2 animal model is a germline knockout, and it does not reproduce
          a disease phenotype: Brm-null mice develop normally, apparently because BRG1 (SMARCA4) is upregulated
          and substitutes functionally. This is a genuine model/human mismatch rather than merely absent
          evidence. It matters in two directions. First, it is one of the strongest arguments that BIS
          is not caused by SMARCA2 haploinsufficiency, since removing the gene entirely in mouse produces
          nothing resembling the human disorder. Second, it means no existing in vivo system can test
          the actual BIS lesion, because a null allele cannot model a dominant, position-specific allele:
          complete deletion cannot report on a lesion whose only directly evidenced property is its location
          within SMARCA2. Nor does the null mouse produce the positive human readout of the BIS lesion,
          the DNA methylation episignature; whether a null allele could generate that signature has never
          been tested, which is itself part of the mismatch. (This entry does not assert the BIS variant
          consequence class; see genetic[].notes.) Any mouse-derived negative result about SMARCA2 loss
          must therefore not be read as evidence about BIS.

          '
        attaches_to:
        - pathophysiology#Non-Helicase-Domain SMARCA2 Variants Perturb the BAF Chromatin Remodeling Complex
        proposed_experiments:
        - experiment_id: exp_bis_hotspot_knockin_mouse
          name: BIS hotspot knock-in mouse
          description: Generate heterozygous knock-in mice carrying a recurrent BIS hotspot allele (for
            example the Arg525 or Arg937 substitutions) rather than a null allele, and assess craniofacial
            morphogenesis, neurodevelopmental behaviour, and the blood methylation profile against the
            human episignature.
        - experiment_id: exp_bis_brg1_compensation_test
          name: Test BRG1 compensation in the presence of a BIS allele
          description: Determine whether SMARCA4/BRG1 upregulation can compensate for a BIS-class SMARCA2
            allele as it does for a null allele, or whether the mutant BRM protein blocks compensation
            by occupying the complex.
      selected_evidence:
        snippet: "BRM-/- mice develop normally, suggesting that an \nobserved up-regulation of the BRG1\
          \ protein can functionally replace BRM in the \nSWI-SNF complexes of mutant cells."
        supports: SUPPORT
