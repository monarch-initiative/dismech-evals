  86433f9d1cca0d2fdadde5bbdf0fb0559c8cc1f0f0a543f1e145efb6bc8f130b:
    claim:
      about:
        disease:
          name: Blepharophimosis-Intellectual Disability Syndrome, MKB Type
          disease_term:
            preferred_term: blepharophimosis-intellectual disability syndrome, Maat-Kievit-Brunner type
            term:
              id: MONDO:0010477
              label: blepharophimosis - intellectual disability syndrome, MKB type
        context: []
      assertion_type: Genetic
      assertion:
        name: MED12
        notes: 'Hemizygous missense variants in MED12 (mediator complex subunit 12, Xq13.1) cause the
          MKB/X-linked type. Reported variants include p.Arg1148His, p.Ser1165Pro, the de novo p.His1729Asn,
          and the recurrent p.Arg296Gln (c.887G>A, exon 7), which has been observed hemizygously in affected
          boys with heterozygous carrier mothers and demonstrates marked phenotypic variability despite
          an identical genotype. MED12 is also mutated in the allelic FG (Opitz-Kaveggia) and Lujan-Fryns
          syndromes and in non-syndromic X-linked intellectual disability.

          '
        gene_term:
          preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
      selected_evidence:
        snippet: We performed exome sequencing in two families, each with two affected males with Ohdo
          syndrome MKB type.
        supports: SUPPORT
    origin:
