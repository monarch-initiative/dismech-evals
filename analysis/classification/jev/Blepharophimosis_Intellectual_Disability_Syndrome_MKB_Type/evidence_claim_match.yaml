        context:
        - path: /pathophysiology/0
          value:
            name: MED12 Missense Variant Disrupting the CDK8 Kinase Module
            biological_scale: MOLECULAR
            description: 'MED12 is a subunit of the CDK8 kinase module (MED12, MED13, Cyclin C, and CDK8),
              a dissociable regulatory module of the Mediator complex that modulates RNA polymerase II
              transcription. MED12 activates CDK8 kinase activity by wrapping around CDK8 via a conserved
              T-loop interaction. Disease-associated missense variants alter MED12 function within this
              module rather than abolishing the protein, consistent with the observation that only a small
              subset of MED12 variants produces the distinct MED12-related syndromes.

              '
            cell_types:
            - preferred_term: neuron
              term:
                id: CL:0000540
                label: neuron
            biological_processes:
            - preferred_term: regulation of RNA polymerase II transcription
              term:
                id: GO:0006357
                label: regulation of transcription by RNA polymerase II
              modifier: ABNORMAL
            cellular_components:
            - preferred_term: mediator complex
              term:
                id: GO:0016592
                label: mediator complex
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Dysregulated Immediate Early Gene and REST-Dependent Neuronal Transcription
        description: Altered MED12 function within the CDK8 kinase module changes recruitment of the MED12-containing
          complex to target promoters, producing variant-specific dysregulation of immediate early gene
          and REST-dependent neuronal transcriptional programs.
