        description: Ohdo syndrome (including the KAT6B-associated Say-Barber-Biesecker-Young-Simpson
          variant) presents with congenital blepharophimosis and ptosis that can mimic BPES, but is distinguished
          by global developmental delay, intellectual disability, hypotonia, and non-FOXL2 molecular etiology.
        distinguishing_features:
        - Intellectual disability and multisystem congenital anomalies favor Ohdo/SBBYS syndrome.
        - Isolated oculofacial complex (Type II) or co-occurring primary ovarian insufficiency with heterozygous
          FOXL2 pathogenic variants favors BPES.
      selected_evidence:
        snippet: 'Other congenital disorders may have similar features to BPES, especially two of the
          cardinal features, blepharophimosis and ptosis. These include hereditary congenital ptosis 1
          (OMIM #178300; autosomal dominant, one of three subtypes involving ptosis and blepharophimosis
          only); OHDO syndrome (OMIM #249620 autosomal dominant with cognitive impairment, congenital
          heart disease, ptosis, hypoplastic teeth, and blepharophimosis; OMIM #300895 x-linked with coarse
          facial features, cognitive impairment, and blepharophimosis; and OMIM #603736 autosomal dominant
          subtype, previously known as Say–Barber–Biesecker–Young–Simpson syndrome)'
        supports: SUPPORT
