          376 amino acids, which contains a 110 amino acid DNA-binding fork head domain (forkhead domain,
          FHD) and a polyalanine tract of 14 residues (poly-Ala), whose expansions would cause mislocation,
          aggregation, and intranuclear mobility of the protein
