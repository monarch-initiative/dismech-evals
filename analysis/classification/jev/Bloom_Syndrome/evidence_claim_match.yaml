    evidence_metadata:
      reference: PMID:38995367
      reference_title: Rare case of myelodysplastic syndrome with excess blasts 2 developing after adjuvant
        chemoradiotherapy for triple-negative breast cancer in a patient with Bloom syndrome.
      evidence_source: OTHER
      explanation: Records both the practice recommendation and, in the same sentence, that it rests on
        mechanism and clinical judgement rather than on comparative outcome data.
