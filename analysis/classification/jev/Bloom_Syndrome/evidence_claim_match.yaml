  971c3bbe7c47e4f6beb556a6c2cdfc171a38777f30be5ad85f84a46128735686:
    claim:
      about:
        disease:
          name: Bloom syndrome
          disease_term:
            preferred_term: Bloom syndrome
            term:
              id: MONDO:0008876
              label: Bloom syndrome
        context:
        - path: /environmental/2
          value:
            name: DNA-damaging antineoplastic agent exposure
            description: Cytotoxic chemotherapy, and alkylating agents in particular, are the iatrogenic
              exposure of greatest concern once a Bloom syndrome patient develops cancer. Clinicians report
              severe toxicity at conventional doses and recommend avoiding alkylators, topoisomerase inhibitors,
              and anthracyclines where the disease allows.
            exposure_term:
              preferred_term: exposure to antineoplastic agent
              term:
                id: ECTO:9001737
                label: exposure to antineoplastic agent
            exposure_classifications:
              hazard_agent_type:
              - classification_value: CHEMICAL
              exposure_route:
              - classification_value: PARENTERAL
              exposure_duration:
              - classification_value: INTERMITTENT
              exposome_domain:
              - classification_value: SPECIFIC_EXTERNAL
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Early-Onset Multicancer Predisposition
        environmental_effect: EXACERBATES
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: DNA-damaging cytotoxics are given against a first cancer and add genomic lesions
          to cells that already mis-resolve recombination intermediates, which is the stated reason for
          avoiding alkylating agents in this population. Registry acute myeloid leukaemias in Bloom syndrome
          followed chemotherapy for a prior tumour.
      selected_evidence:
        snippet: Although there are no evidence-based data linking specific chemotherapeutic agents to
          an increased risk of secondary malignancies, most treating clinicians recommend against the
          use of alkylating agents, particularly busulfan, cyclophosphamide, or melphalan, due to their
          direct interaction with DNA.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/2/influences_mechanisms/0
      evidence_path: /environmental/2/influences_mechanisms/0/evidence/0
      context_paths:
