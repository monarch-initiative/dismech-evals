        context: []
      assertion_type: Treatment
      assertion:
        name: Hematopoietic cell transplantation for hematologic malignancy
        description: Allogeneic transplantation is used for hematologic malignancy in Bloom syndrome,
          but the reported experience is small and toxicity is substantial, because conditioning regimens
          deliver exactly the DNA-damaging exposure these patients tolerate poorly. It is a specialist-directed
          option under active uncertainty rather than a standard-of-care recommendation.
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        target_phenotypes:
        - preferred_term: Neoplasm
          term:
            id: HP:0002664
            label: Neoplasm
      selected_evidence:
        snippet: In our experience, one patient underwent HSCT with a myeloablative conditioning regimen
          but died shortly after transplantation due to treatment-related toxicity, despite being in remission
          at the time.
        supports: REFUTE
    origin:
      assertion_path: /treatments/7
      evidence_path: /treatments/7/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40641635
      reference_title: Management of Paediatric Cancers Associated With Bloom Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: A myeloablative transplant in remission ended in treatment-related death, which cuts
        against transplantation with full-intensity conditioning as a safe option here. One patient, so
        it bounds enthusiasm rather than establishing a rule.
