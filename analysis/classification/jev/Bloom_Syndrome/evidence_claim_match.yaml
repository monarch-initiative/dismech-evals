      assertion:
        name: Genetic counseling and reproductive options
        description: Bloom syndrome is autosomal recessive, so each subsequent sibling has a one-in-four
          recurrence risk. Once both familial BLM variants are known, prenatal and preimplantation genetic
          testing are available, and carrier screening panels commonly include the condition. Evaluating
          at-risk siblings also allows sun avoidance and cancer surveillance to start early.
        action_category: COUNSELING_INFORMATIONAL
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: It is appropriate to evaluate sibs of a proband in order to identify as early as possible
          those who would benefit from avoidance of sun exposure and early surveillance for cancer.
        supports: SUPPORT
