      assertion:
        phase: Radiographic staging
        notes: 'Progression is graded by the Langenskiold classification, which describes six radiographic
          stages of change in the proximal medial tibial metaphysis. The staging matters clinically rather
          than descriptively: in a natural history series, limbs not in stages II to III resolved spontaneously
          without treatment, while a subset of those in stages II to III did not improve.'
      selected_evidence:
        snippet: In 22 limbs which were not in Langenskiöld stages II to III the condition resolved spontaneously
          without treatment. Of the remaining 24 which were in stages II to III, in 18 it resolved spontaneously
          by the age of six years, but six showed little or no improvement at the latest follow-up.
        supports: SUPPORT
