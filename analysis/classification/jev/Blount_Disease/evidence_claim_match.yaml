      assertion_type: EpidemiologyInfo
      assertion:
        name: Spontaneous resolution
        description: 'A large cross-sectional series found that most varus legs resolved over time, with
          severe bowing persisting in only a minority. This qualifies the description of the disease as
          relentlessly progressive, and it matters for treatment decisions: the natural history is not
          uniformly bad.'
      selected_evidence:
        snippet: In most of the cases (64%), the varus legs resolved over time. In 9%, severe bowing remained
          'just like the patient'.
        supports: SUPPORT
