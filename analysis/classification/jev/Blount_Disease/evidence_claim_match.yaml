        context: []
      assertion_type: EpidemiologyInfo
      assertion:
        name: Geographic variation in severity
        description: In the Americas and the Caribbean the disease chiefly affects Black obese children
          and often runs a severe course. Elsewhere both the associations and the severity are less pronounced,
          which is itself an argument that the condition is not a single uniform entity.
      selected_evidence:
        snippet: In the Americas and Caribbean, Blount disease chiefly affects black obese children. Without
          treatment, the prognosis is often severe, particularly in the infantile form due to the development
          of medial tibial epiphysiodesis at about 6 to 8 years of age. In other parts of the world, the
          associations with black ethnicity and obesity are less obvious and the prognosis is often less
          severe.
        supports: SUPPORT
