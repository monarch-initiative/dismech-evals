              concentrate compressive force on the medial side of the proximal tibial growth plate. This
              is where the evidence is weakest and the inference strongest: the association with obesity
              is epidemiological, and no study in these sources measures the load itself in affected children.'
            mechanism_confidence: HYPOTHETICAL
            locations:
            - preferred_term: proximal epiphysis of tibia
              term:
                id: UBERON:0008772
                label: proximal epiphysis of tibia
            biological_processes:
            - preferred_term: response to mechanical stimulus
              modifier: INCREASED
              term:
                id: GO:0009612
                label: response to mechanical stimulus
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Growth Suppression at the Compressed Physis
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Sustained compression across a growth plate slows longitudinal growth there, the
          Hueter-Volkmann growth-modulation principle.
      selected_evidence:
        snippet: A validated algorithm allowed simulating the growth (0.8-1.1 mm/yr/vertebra) and growth
          modulation process (Hueter-Volkmann principle) during a period of 2 years.
        supports: SUPPORT
    origin:
