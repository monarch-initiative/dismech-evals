        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mechanical_overload_hypothesis
        hypothesis_label: Mechanical Overload of the Medial Physis
        status: CANONICAL
        description: The account this entry's pathograph follows. Obesity and early walking raise compressive
          load on the medial proximal tibial physis; sustained compression suppresses growth there by
          the Hueter-Volkmann principle; asymmetric growth produces varus; and varus shifts the mechanical
          axis medially, reinforcing the load. It is the best-supported hypothesis and remains unproven.
        notes: Adopted here because it organises the observations and because the same principle is used
          deliberately in guided-growth surgery. Not because it has been demonstrated in this disease.
          The obesity-prevalence counterevidence is attached to this hypothesis rather than to the multifactorial
          one, because it is the body-mass premise specifically that it contradicts.
      selected_evidence:
        snippet: This condition develops due to excessive compressive forces on the medial aspect of the
          proximal tibial physis, leading to altered enchondral bone formation.
        supports: SUPPORT
