      reference_title: Biomechanical simulation and analysis of scoliosis correction using a fusionless
        intravertebral epiphyseal device.
      evidence_source: COMPUTATIONAL
      explanation: Establishes the growth-modulation principle this edge depends on. Note that this is
        a finite-element study of spinal deformity, not of the tibia, so it supports the general principle
