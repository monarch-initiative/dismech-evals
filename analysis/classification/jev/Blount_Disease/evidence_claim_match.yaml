  3b886695defb3919c3407bd1a3ff643b778790e9e2af6df658b84e6153a1fe15:
    claim:
      about:
        disease:
          name: Blount Disease
          disease_term:
            preferred_term: Blount disease
            term:
              id: MONDO:0017194
              label: Blount disease
        context:
        - path: /animal_models/0
          value:
            name: Lamb proximal tibial growth plate under asymmetric loading
            species: Sheep
            publication: PMID:17585254
            description: An ex vivo mechanical model, and the only source here that tests the biomechanical
              premise in the right bone. Ovine proximal tibiae were loaded asymmetrically on a servohydraulic
              frame while displacement was recorded across the physis. It gives the graph a model join
              point it otherwise lacks.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Excess Compressive Load on the Medial Proximal Tibial Physis
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Demonstrates that loading one edge of the tibial surface produces compression through
          the physis beneath it, with measurable tensile displacement on the opposite side. That is the
          physical premise the initiating node asserts.
        limitations: An ex vivo mechanical preparation, not a living animal, so it shows that the load
          reaches the physis and not that sustained loading produces the disease. It also cannot speak
          to the biological growth response, only to the mechanics.
      selected_evidence:
        snippet: we demonstrate that loading (cyclical or static) on 1 edge of the tibial surface results
          in compression through the physis under the site of pressure. In addition, we record statistically
          significant tensile displacement opposite the compressed side (P < 0.001)
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0/modeled_mechanisms/0
      evidence_path: /animal_models/0/modeled_mechanisms/0/evidence/0
      context_paths:
      - /name
