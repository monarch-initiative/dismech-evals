      - /animal_models/0
    evidence_metadata:
      reference: PMID:17585254
      reference_title: 'Mechanical behavior of the lamb growth plate in response to asymmetrical loading:
        a model for Blount disease.'
      evidence_source: IN_VITRO
      explanation: Measures both the compression under the load and the tension opposite it, which is
        the asymmetry the disease mechanism requires.
