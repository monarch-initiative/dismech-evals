      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: multifactorial_hypothesis
        hypothesis_label: Multifactorial Origin with Genetic and Nutritional Contributions
        status: ALTERNATIVE
        description: The conclusion of the only systematic review of the aetiology literature. Mechanical
          loading is one contributor among several, alongside genetic and racial predisposition and possibly
          nutrition, and no single hypothesis accounts for the disease. The review also grades the entire
          supporting literature as low level of evidence, which is the most important thing anyone curating
          this disease should know.
        notes: 'Recorded as ALTERNATIVE rather than CANONICAL only because it does not specify a causal
          chain that can be drawn as a graph. On the evidence it is probably the more accurate account.
          The obesity-prevalence contrast recorded against the mechanical hypothesis above is the sharpest
          single argument for preferring this one: obesity is roughly a third to a fifth as prevalent
          in sub-Saharan Africa as in the United States, yet Blount disease is common there. Large patient
          groups in Finland and Japan are a further argument against a purely ethnic explanation.'
      selected_evidence:
        snippet: Blount's disease most likely has a multifactorial origin with influence of genetic and
          racial predisposition, increased mechanical pressure on the growth plate as a consequence of
          obesity or early walking age and possibly also nutrition.
        supports: SUPPORT
