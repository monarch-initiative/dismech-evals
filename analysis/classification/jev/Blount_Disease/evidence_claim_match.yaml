      assertion_type: Genetic
      assertion:
        name: No identified Mendelian cause
        relationship_type: UNKNOWN
        variant_origin: UNKNOWN
        association: Familial Clustering Without an Identified Gene
        notes: Recorded as a negative result rather than omitted, because the absence is informative.
          Familial clustering is strong - 62% of families in a Ghanaian series had a positive family history,
          and two thirds of those in a first-degree relative - yet whole exome sequencing in that series
          found no genetic predisposition. Ethnic concentration was striking, with 90% of patients from
          a single tribe, which is consistent with either a shared environment or a polygenic background
          that exome sequencing would not resolve. No causal gene is recorded in this entry because none
          is known.
      selected_evidence:
        snippet: A positive family history was found in 63 families (62%), of which, almost two-third
          had a positive family history in a first-degree family member.
        supports: SUPPORT
