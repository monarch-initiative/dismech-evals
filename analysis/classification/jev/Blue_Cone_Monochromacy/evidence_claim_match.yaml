        notes: Recorded from a single patient in whom a GPR143 splicing variant co-occurred with OPN1LW/OPN1MW
          lesions and produced foveal hypoplasia — a feature otherwise characteristic of achromatopsia
          rather than this disorder. Curated as a modifier on one report, not as an established modifier
          gene.
      selected_evidence:
        snippet: To our knowledge, this is the first case of foveal hypoplasia in a BCM patient and of
          mild clinical affection in a female carrier caused by the concomitant effect of variants in
          OPN1LW/OPN1MW and GPR143 genes, thus as the result of the simultaneous action of two independent
          genetic defects.
        supports: SUPPORT
