        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vision Mediated by Preserved S Cones and Rods
        biological_scale: TISSUE
        description: 'What is left, and why the phenotype is what it is. S cones (OPN1SW, on chromosome
          7) and rods are genetically untouched, so daylight vision is carried by the S-cone population
          — only a few percent of all cones, sparse in the fovea — together with rods operating partially
          desensitized in photopic conditions. That residual system explains the clinical picture directly:
          acuity is reduced but far from absent, colour discrimination survives on the tritan axis while
          failing on protan and deutan axes, and night vision is typically healthy. It is also the finding
          that separates this disorder from complete achromatopsia, where all cone signal is extinguished.'
        cell_types:
        - preferred_term: S cone cell
          term:
            id: CL:0003050
            label: S cone cell
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        biological_processes:
        - preferred_term: visual perception
          term:
            id: GO:0007601
            label: visual perception
          modifier: ABNORMAL
      selected_evidence:
        snippet: BCM rods continue to signal vision under conditions normally associated with daylight
          vision.
        supports: SUPPORT
