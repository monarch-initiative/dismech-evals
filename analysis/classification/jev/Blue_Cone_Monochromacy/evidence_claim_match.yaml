  01d8939edd2e6ddfb5ff88047f24b396d532b7aadda6ce8bb8ba0d52e62f70d7:
    claim:
      about:
        disease:
          name: Blue Cone Monochromacy
          disease_term:
            preferred_term: Blue Cone Monochromacy
            term:
              id: MONDO:0010563
              label: blue cone monochromacy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Locus Control Region-Driven Opsin Expression
        biological_scale: MOLECULAR
        description: The regulatory arm, and the reason a single deletion suffices. A locus control region
          between 3.1 and 3.7 kb upstream of the L opsin transcription start site is essential for expression
          of the adjacent visual pigment genes, and the mutually exclusive choice of one opsin per cone
          is set by competition between the two pigment promoters for pairing with that single LCR. Deleting
          it therefore does not silence one gene, it silences the array — converting what would need to
          be two independent inactivating events into one.
        genes:
        - preferred_term: OPN1LW
          term:
            id: hgnc:9936
            label: OPN1LW
        biological_processes:
        - preferred_term: regulation of DNA-templated transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: ABSENT
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: a region between 3.1 kb and 3.7 kb 5' of the red pigment gene transcription initiation
          site is essential for expression
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
