        description: 'The therapeutic strategy in development: deliver a functional L-opsin gene to residual
          L/M cones by adeno-associated virus. It is investigational, not approved, and is recorded here
          as a research programme rather than a treatment option. Its central design problem follows directly
          from the pathophysiology above — the residual cones are largely non-waveguiding and decline
          with age, so the therapeutic window is bounded and strongly age-dependent. Genotype governs
          the rate of progression rather than the width of the window: the two mouse models compared so
          far showed similar windows despite different genotypes. Much of the recent clinical literature
          is accordingly about building outcome measures sensitive enough to detect an L-cone-specific
          gain. Route of delivery is itself a design constraint here: subretinal injection risks the very
          foveal structure that is the therapeutic target, which is why an intravitreal vector was developed.'
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: Gene Therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: A single IVT administration dose of ADVM-062 effectively transduced gerbil cone photoreceptors
