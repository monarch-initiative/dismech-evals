      assertion_type: Pathophysiology
      assertion:
        name: Carrier Female Cone Mosaic Disruption
        biological_scale: TISSUE
        description: Carrier females are described as unaffected, but they are not unaffected at the level
          of the retina. Random X-inactivation means roughly half of the cones fated to express L or M
          opsin instead express nothing, and imaging those retinas shows reduced cone density and disrupted
          mosaic organization relative to normal trichromats — evidence that opsin-null cones degenerate
          early rather than persisting silently. This is the cleanest natural experiment supporting the
          structural role of opsin asserted in the parent node, and it is the mechanism behind the rare
          manifesting female, in whom X-inactivation is completely skewed rather than random.
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: On average, they had cone mosaics with reduced density and disrupted organization compared
          to normal trichromats.
        supports: SUPPORT
