  09b29f6713b25394566ef4a0c870089d5b17b053389eb97b396aaa95b3425b6f:
    claim:
      about:
        disease:
          name: Blue Cone Monochromacy
          disease_term:
            preferred_term: Blue Cone Monochromacy
            term:
              id: MONDO:0010563
              label: blue cone monochromacy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bcm_stationary_versus_progressive
        kind: CONTROVERSY
        prompt: Is blue cone monochromacy a stationary cone dysfunction syndrome or a slowly progressive
          dystrophy, and how much of the disagreement is explained by genotype rather than by measurement
          sensitivity?
        attaches_to:
        - pathophysiology#Cone Outer Segment Disruption and Progressive Foveal Cone Loss
        - phenotypes#Progressive Loss of Cone Function
        rationale: The disorder is classified among the stationary cone dysfunction syndromes, and many
          families do appear stable. But progression has been demonstrated psychophysically in individual
          families, macular atrophy develops in a subset, OCT shows an age-related effect on foveal disease
          stage, and the rate differs between large-deletion and Cys203Arg genotypes. Curating this as
          simply "stationary" would be wrong, and curating it as simply "progressive" would overstate
          what is shown for most patients. The unresolved part is whether the apparently stable majority
          are genuinely stable or merely followed for too short a time with insufficiently sensitive measures
          — which matters directly, because a bounded therapeutic window is the main design constraint
          on the gene therapy programmes.
        proposed_experiments:
        - experiment_id: bcm_longitudinal_genotype_stratified_aoslo
          name: Longitudinal genotype-stratified AOSLO and microperimetry cohort
          description: Follow LCR-deletion and Cys203Arg cohorts prospectively with adaptive-optics cone
            density, OCT outer nuclear layer thickness, and dark-adapted red microperimetry, to establish
            whether the stable-appearing majority show measurable decline on sensitive endpoints and to
            quantify the window per genotype.
      selected_evidence:
        snippet: In two families, psychophysical testing demonstrated evidence for progression of disease.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15094734
