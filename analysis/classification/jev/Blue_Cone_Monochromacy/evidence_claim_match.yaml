      assertion_type: Genetic
      assertion:
        name: Cys203Arg recurrent inactivating substitution
        association: Genetic Mutation
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: OPN1LW
          term:
            id: hgnc:9936
            label: OPN1LW
        notes: 'The single most common inactivating point substitution. Its epidemiology is unusual and
          mechanistically informative: it is present at low frequency in control chromosomes, which means
          the population carries a standing reservoir of Cys203Arg alleles that unequal recombination
          or gene conversion can convert into a disease genotype in one further step. That is a recurrence
          mechanism, not a founder effect.'
      selected_evidence:
        snippet: This mutation was also found in at least one of the visual pigment genes in 1 subject
          whose array has multiple genes and in 2 of 321 control subjects, suggesting that preexisting
          Cys203-to-Arg mutations constitute a reservoir of chromosomes that are predisposed to generate
          blue-cone-monochromat genotypes by unequal homologous recombination and/or gene conversion.
        supports: SUPPORT
