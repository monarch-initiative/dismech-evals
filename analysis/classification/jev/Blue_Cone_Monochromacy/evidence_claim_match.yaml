        - path: /animal_models/0
          value:
            name: Opn1mw C198R knock-in mouse
            species: Mouse
            genotype: Opn1mw C198R knock-in (murine equivalent of human OPN1MW Cys203Arg)
            publication: PMID:41941983
            description: The mouse counterpart of the commonest human missense allele. Because murine
              M-opsin is five residues shorter at the amino terminus, the equivalent substitution is numbered
              C198R.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Cone Outer Segment Disruption and Progressive Foveal Cone Loss
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: 'Reproduces outer-segment loss but not cone death: mutant cones remained viable to
          six months in both hemizygous and homozygous animals, and the authors contrast this explicitly
          with the toxic-aggregate mechanism of rhodopsin mutants in retinitis pigmentosa.'
        limitations: Six months of mouse life cannot address decades of human disease, so a viable cone
          at six months does not establish that the human Cys203Arg cone survives — it establishes that
          a toxic-aggregate death mechanism is not operating early. This is why the entry treats slow
          Cys203Arg progression as observed rather than mechanistically explained.
      selected_evidence:
        snippet: Despite the loss of cone outer segments, cone photoreceptor cells remained viable, even
          up to 6 months of age in hemizygous and homozygous mutant mice.
        supports: SUPPORT
