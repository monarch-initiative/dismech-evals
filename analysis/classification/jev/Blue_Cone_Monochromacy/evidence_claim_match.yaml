      assertion:
        name: Full-Field Electroretinography
        description: The key functional test. Rod-specific and mixed rod-cone responses are normal or
          near-normal while the L/M-cone-driven photopic response is severely reduced or absent, and S-cone-isolating
          stimuli still elicit a response. It is that dissociation, not the absolute amplitudes, that
          makes the diagnosis.
      selected_evidence:
        snippet: Acuities were reduced in all affected males, and photopic b-wave was reduced by more
          than 90% in seven families.
        supports: SUPPORT
