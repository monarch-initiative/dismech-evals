      assertion:
        name: X-linked cone dystrophy
        description: Missense variants in the same L/M opsin genes can produce X-linked cone dystrophy
          or high myopia with abnormal cone function rather than this disorder, so the same locus spans
          a phenotypic range and genotype alone does not settle the diagnosis.
        distinguishing_features:
        - Progressive cone degeneration rather than a predominantly congenital deficit
        - A different pattern of L/M opsin missense alleles at the same locus
      selected_evidence:
        snippet: X-linked retinal diseases resulting from mutations in the L- (OPN1LW, OMIM *300822) and
          M- (OPN1MW, OMIM *300821) opsin gene cluster are associated with a wide range of visual defects,
          including red/green color vision deficiency, X-linked cone dystrophy/dysfunction, high myopia
          with abnormal cone function, and blue cone monochromacy (BCM)
        supports: SUPPORT
