  ebae5a7de071154654456b1076337b133e17e3527e40a7a87af24be919a5581d:
    claim:
      about:
        disease:
          name: Blue Cone Monochromacy
          disease_term:
            preferred_term: Blue Cone Monochromacy
            term:
              id: MONDO:0010563
              label: blue cone monochromacy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Function of the OPN1LW/OPN1MW Opsin Gene Array
        biological_scale: MOLECULAR
        description: The initiating lesion. Both the L and M opsin genes on Xq28 must lose function; loss
          of only one produces ordinary red-green colour blindness, not this disorder. Two mutational
          routes dominate. The first is deletion of the locus control region 3.1-3.7 kb upstream of the
          array, which silences every gene downstream of it. The second is unequal homologous recombination
          that collapses the array to a single gene or a 5'L-M-3' hybrid, which then carries an inactivating
          point substitution — most often Cys203Arg, and less often Arg247Ter or Pro307Leu. High-resolution
          X-chromosome microarray has since resolved more complex rearrangements, including a founder
          allele combining a 3-kb LCR deletion with insertion of an aberrant OPN1MW gene.
        genes:
        - preferred_term: OPN1LW
          term:
            id: hgnc:9936
            label: OPN1LW
        - preferred_term: OPN1MW
          term:
            id: hgnc:4206
            label: OPN1MW
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: As observed in an earlier study, the rearrangements involve either deletion of a locus
          control region adjacent to the gene array or loss of function via homologous recombination and
          point mutation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8213841
      reference_title: Genetic heterogeneity among blue-cone monochromats.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the two dominant mutational routes that this node represents.
