      assertion_type: Inheritance
      assertion:
        name: Somatic Mosaic
        description: The usual molecularly defined disorder is postzygotic somatic mosaicism. GeneReviews
          reports no confirmed vertical transmission or sibling recurrence and considers recurrence risk
          comparable to the general population; this does not establish a literally zero risk. An apparent
          dominant family history warrants reassessment for familial TEK-related cutaneomucosal malformations
          or other vascular disorders. Historical familial cases labeled BRBNS often lack molecular confirmation.
