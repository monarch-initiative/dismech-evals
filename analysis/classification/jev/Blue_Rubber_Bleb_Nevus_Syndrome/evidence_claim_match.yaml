        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: brbns_emerging_inhibition
        prompt: Can PI3K inhibition or combination therapy improve durable control of BRBNS?
        rationale: Alpelisib corrects cellular phenotypes in TEK- and PIK3CA-mutant HUVECs, and ponatinib
          plus rapamycin regresses established L914F xenografts. The 2026 rapamycin-alpelisib mouse experiment
          used cells pretreated for 48 hours before implantation, with a DMSO comparator; it demonstrates
          reduced lesion formation rather than systemic treatment of established lesions. Its in vivo
          comparison did not establish superiority over another drug combination. p53 changes are associated
          readouts, not a demonstrated necessary mediator. These results do not establish a BRBNS regimen
          or long-term clinical safety.
        kind: KNOWLEDGE_GAP
        attaches_to:
        - treatments#Systemic Sirolimus
      selected_evidence:
        snippet: The p110α-specific inhibitor BYL719 restores all abnormal phenotypes tested, in PIK3CA-
          as well as TEK-mutant HUVECs, demonstrating that they operate via the same pathogenic pathways.
        supports: SUPPORT
        directness: INDIRECT
