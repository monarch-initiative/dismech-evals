        relationship_type: CAUSATIVE
        variant_origin: SOMATIC
        association: Gain of Function
        variants:
        - name: T1105N-T1106P
          description: The recurrent BRBN-associated double allele p.Thr1105Asn-p.Thr1106Pro occurs in
            cis. Its enrichment differs from the p.Tyr897Cys-p.Arg915Cys allele recurrent in multifocal
            sporadic VM; genotype does not replace clinical assessment of the syndrome boundary.
        notes: TEK encodes TIE2. Lesional somatic gain-of-function variants, often paired in cis, are
          the principal established cause. Variant identity, mosaic burden and lesion distribution contribute
          to phenotypic diversity; a single recurrent allele does not define every clinical case.
      selected_evidence:
        snippet: We discovered somatic mutations in TEK, the gene encoding TIE2, in 15 of 17 individuals
          with blue rubber bleb nevus syndrome.
        supports: SUPPORT
        directness: DIRECT
