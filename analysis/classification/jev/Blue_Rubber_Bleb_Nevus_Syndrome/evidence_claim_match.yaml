      assertion_type: Pathophysiology
      assertion:
        name: PI3K-AKT-mTOR Pathway Activation
        description: 'Constitutive TIE2 signalling drives the PI3K-AKT-mTOR axis. This is the branch point
          of the disease: it both suppresses endothelial apoptosis and, through AKT-dependent regulation
          of FOXO1, reduces PDGFB expression. It is also the node that sirolimus acts on, which is why
          mTOR inhibition is effective across lesion types.'
        cell_types:
        - preferred_term: vein endothelial cell
          term:
            id: CL:0002543
            label: vein endothelial cell
        biological_processes:
        - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
          modifier: INCREASED
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
      selected_evidence:
        snippet: Dominant-negative Akt inhibited the pro-survival activity of mutant Tie2
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15526080
      reference_title: Functional analysis of a mutant form of the receptor tyrosine kinase Tie2 causing
        venous malformations.
      evidence_source: IN_VITRO
      explanation: Blocking AKT abolishes the pro-survival effect, establishing AKT as the required downstream
        mediator.
