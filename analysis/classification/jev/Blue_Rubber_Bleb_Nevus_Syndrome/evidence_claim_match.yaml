      assertion:
        name: Systemic Sirolimus
        description: Specialist-directed off-label mTOR inhibition can reduce bleeding and lesion burden
          in diffuse or difficult-to-treat BRBNS. The prospective eleven-patient study reported improvement
          over twelve months; longer-term response varies and relapse may follow withdrawal. Oral ulcers
          and other adverse effects require monitoring. No cure, uniform response or site-independent
          efficacy is established.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: sirolimus
            term:
              id: CHEBI:9168
              label: sirolimus
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: The average lesion size was reduced by 7.4% (P < 0.001), 9.3% (P < 0.001), and 13.0%
          (P < 0.05) at 3, 6, and 12 months of sirolimus treatment, respectively.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
