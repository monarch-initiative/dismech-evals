      assertion_type: Treatment
      assertion:
        name: Surgical Treatment of Gastrointestinal Lesions
        description: Resection or ligation can control bleeding from focal or extensive lesions in selected
          patients. Planning aims to preserve bowel length and account for transmural disease. A ten-patient
          series used extensive combined procedures with durable control in most patients; morbidity,
          incomplete removal and recurrence remain considerations. Obstruction or intussusception can
          require urgent surgery.
        treatment_term:
          preferred_term: Surgical Procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: Only 1 patient who had a less extensive procedure developed recurrent GI bleeding. The
          mean follow-up period was 5.0 years (range 2.9-10.3 years).
        supports: SUPPORT
        directness: DIRECT
