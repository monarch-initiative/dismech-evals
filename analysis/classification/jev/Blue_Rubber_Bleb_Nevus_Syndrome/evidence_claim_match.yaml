              label: blue rubber bleb nevus
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic TEK Double Mutation
        description: A post-zygotic somatic mutation of TEK arises in an endothelial-lineage cell. Multifocal
          disease, including BRBNS, is characteristically driven by double mutations in cis - two somatic
          changes on the same allele - which distinguishes it from the single somatic alleles typical
          of unifocal sporadic venous malformation.
        cell_types:
        - preferred_term: vein endothelial cell
          term:
            id: CL:0002543
            label: vein endothelial cell
      selected_evidence:
        snippet: multifocal forms are predominantly caused by double (cis) mutations
        supports: SUPPORT
