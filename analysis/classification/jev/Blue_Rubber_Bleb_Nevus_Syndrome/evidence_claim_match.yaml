        prompt: How should familial CNS-predominant cases labeled BRBNS be classified?
        rationale: A reported father-son pair had skin venous malformations, seizures and cerebral vascular
          lesions, but lacked genetic assessment; the son had no significant colonoscopic abnormality
          and the father had non-cavernomatous arteriovenous lesions at autopsy. Such reports warrant
          molecular differential diagnosis rather than establishing dominant transmission, a uniform cerebral
          phenotype or a KRIT1 modifier for molecularly defined BRBNS.
        kind: KNOWLEDGE_GAP
        attaches_to:
        - inheritance#Somatic Mosaic
      selected_evidence:
        snippet: Unfortunately, no genetic assessment was performed due to the lack of this specific testing
          in our hospital.
