  d0d31ab9003db79bc258f3b9a164fc0bd54e2096b60354de3d7a1ebe56d37624:
    claim:
      about:
        disease:
          name: Bohring-Opitz syndrome
          disease_term:
            preferred_term: Bohring-Opitz syndrome
            term:
              id: MONDO:0011510
              label: Bohring-Opitz syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bos_truncation_molecular_consequence
        prompt: Do late ASXL1 truncating variants cause BOS mainly through loss of full-length repressive
          function, a dominant-negative effect, gain of function by a truncated protein, or a combination
          of these mechanisms?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#ASXL1 truncation disrupts epigenetic regulation of developmental gene expression
        - mechanistic_hypotheses#asxl1_loss_of_full_length_function
        - mechanistic_hypotheses#asxl1_truncated_protein_dominant_or_gain
        rationale: 'The causal gene-disease relationship and the cross-tissue epigenomic disturbance are
          strong, but the variants should not be reduced to simple gene under-expression. The pathophysiology
          graph therefore records abnormal ASXL1 function and leaves the precise molecular consequence
          open. Evidence now exists on both sides without settling it: truncated ASXL1 is directly detectable
          as protein in myeloid cells and a truncated fragment is sufficient to drive a neural-crest defect,
          while constitutive Asxl1 deletion in mouse reproduces BOS-like malformations with no truncated
          protein present. No source demonstrates a stable endogenous truncated ASXL1 protein in germline
          BOS patient tissue, which is the first step of the experiment below.'
        proposed_experiments:
        - experiment_id: exp_bos_truncated_asxl1_isogenic_panel
          name: Truncated-ASXL1 protein detection and isogenic knock-in versus null comparison
          description: First establish whether BOS patient cells express truncated ASXL1 by targeted proteomics
            and N-terminal immunoblot on the existing BOS fibroblast and blood collections. Then derive
            isogenic human iPSC lines carrying a representative last-exon BOS truncation, a heterozygous
            ASXL1 null, and a corrected control; differentiate to neural crest and neural progenitors;
            and compare BAP1/PR-DUB complex composition, H2AK119ub1 and H3K27me3 distribution, chromatin
            accessibility, and the Wnt/VANGL2 transcriptional signature, with wild-type add-back and mutant-selective
            knockdown arms.
          experiment_type:
            preferred_term: Patient-cell proteomics plus isogenic iPSC allelic series
          decision_criterion: A dominant or gained mechanism is supported if truncated ASXL1 is detected
            in patient cells and the knock-in line diverges from the null on chromatin and transcriptional
            readouts in a way that mutant-selective knockdown, but not wild-type add-back, corrects; loss
            of function is supported if the knock-in matches the null and wild-type add-back rescues both.
          would_support:
          - mechanistic_hypotheses#asxl1_truncated_protein_dominant_or_gain
          - mechanistic_hypotheses#asxl1_loss_of_full_length_function
          would_refute:
          - mechanistic_hypotheses#asxl1_loss_of_full_length_function
          - mechanistic_hypotheses#asxl1_truncated_protein_dominant_or_gain
          supporting_outcome:
          - 'Truncated protein is present and the knock-in line exceeds the null with mutant-selective
            rescue: the category should become DOMINANT_NEGATIVE or NEOMORPHIC.'
          refuting_outcome:
          - 'No truncated protein, or knock-in and null are indistinguishable with wild-type rescue: the
            category should become LOSS_OF_FUNCTION.'
      selected_evidence:
        snippet: Our data show that regardless of cell type, ASXL1 mutations drive strong cross-tissue
          effects that disrupt multiple layers of the epigenome.
        supports: SUPPORT
