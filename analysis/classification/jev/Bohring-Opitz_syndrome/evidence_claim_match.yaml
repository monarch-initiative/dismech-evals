        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: asxl1_truncated_protein_dominant_or_gain
        hypothesis_label: NMD-escaping truncated ASXL1 with dominant-negative or gain-of-function activity
        status: ALTERNATIVE
        description: BOS alleles cluster in the last exons and are expected to escape nonsense-mediated
          decay, so patient cells may express a stable truncated ASXL1. By analogy with the truncated
          ASXL1 of clonal haematopoiesis and myeloid neoplasia, which gains activity, the BOS product
          may interfere with wild-type ASXL1 or acquire a new function rather than simply being absent.
          The cross-tissue epigenomic disturbance in patient cells is compatible with either reading.
      selected_evidence:
        snippet: Our data show that regardless of cell type, ASXL1 mutations drive strong cross-tissue
          effects that disrupt multiple layers of the epigenome.
        supports: SUPPORT
