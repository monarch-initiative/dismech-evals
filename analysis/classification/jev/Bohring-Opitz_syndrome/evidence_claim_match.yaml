    evidence_metadata:
      reference: PMID:24218140
      reference_title: Deletion of Asxl1 results in myelodysplasia and severe developmental defects in
        vivo.
      evidence_source: MODEL_ORGANISM
      explanation: Constitutive Asxl1 deletion reproduces a spectrum overlapping Bohring-Opitz syndrome
        with no truncated protein present, so the null route reaches the phenotype on its own. This is
        why detecting a truncated protein would not by itself establish that the truncated protein is
        what causes the disease.
