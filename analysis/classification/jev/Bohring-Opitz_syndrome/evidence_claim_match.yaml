      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: asxl1_loss_of_full_length_function
        hypothesis_label: Loss of full-length ASXL1 repressive function
        status: CANONICAL
        description: Truncating ASXL1 alleles remove the C-terminal PHD finger and disrupt the chromatin-regulatory
          function of the full-length protein, and the disorder is treated as a loss of that function.
          This is the reading the pathophysiology chain records as abnormal ASXL1 function.
      selected_evidence:
        snippet: Here, we show that constitutive loss of Asxl1 results in developmental abnormalities,
          including anophthalmia, microcephaly, cleft palates, and mandibular malformations.
        supports: SUPPORT
    origin:
