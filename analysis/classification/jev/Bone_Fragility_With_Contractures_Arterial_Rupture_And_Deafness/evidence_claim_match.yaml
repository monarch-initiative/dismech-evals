            term:
              id: MONDO:0012892
              label: bone fragility with contractures, arterial rupture, and deafness
        context: []
      assertion_type: Genetic
      assertion:
        name: PLOD3
        gene_term:
          preferred_term: PLOD3
          term:
            id: hgnc:9083
            label: PLOD3
        relationship_type: CAUSATIVE
        notes: 'Encodes lysyl hydroxylase 3 (LH3), an endoplasmic-reticulum-resident enzyme with two catalytic
          sites at opposite ends of an elongated homodimer: an N-terminal glycosyltransferase domain and
          a C-terminal lysyl hydroxylase domain, separated by an accessory domain. Reported disease variants
          map close to the catalytic sites and can selectively abolish one activity or the other. Reported
          alleles include the index compound heterozygote''s pair, homozygous c.809C>T p.(Pro270Leu),
          a homozygous missense in the blistering patient, and c.335A>G plus c.2158G>T in the 2025 expansion.'
      selected_evidence:
        snippet: Known disease-related mutations map in close proximity to the catalytic sites.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
