      reference: PMID:30089812
      reference_title: Molecular architecture of the multifunctional collagen lysyl hydroxylase and glycosyltransferase
        LH3.
      evidence_source: IN_VITRO
      explanation: Gives the structural interpretation of where pathogenic variants sit.
