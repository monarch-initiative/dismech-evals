      assertion:
        discussion_id: plod3_collagen_specificity
        kind: HUMAN_MODEL_MISMATCH
        prompt: How do collagen substrate, tissue and residual LH3 activity determine the human phenotype?
        attaches_to:
        - pathophysiology#Impaired Type IV and VI Collagen Secretion
        rationale: Complete knockout markedly impairs type IV secretion in PFHR9 cells, while comparator
          fibroblasts retain type I/III secretion and a patient skin biopsy retains type IV immunostaining.
          These different readouts and systems do not support universal collagen secretion failure. Specific
          causal routes to hearing loss, retinal disease, bone fragility, cortical malformations and visceral
          anomalies remain incompletely resolved; organ expression alone does not establish those routes.
      selected_evidence:
        snippet: only one-fourth of newly synthesized collagen α1α1α2(IV) was secreted even after 48 h
          in culture
        supports: SUPPORT
        directness: DIRECT
