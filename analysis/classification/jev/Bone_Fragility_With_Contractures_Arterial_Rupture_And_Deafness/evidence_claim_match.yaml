              label: bone fragility with contractures, arterial rupture, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Hydroxylysine-Linked Glycosylation
        description: 'Collagen hydroxylysines are left without their galactosyl and glucosylgalactosyl
          sugars. This is the step that matters: a mouse blocked only in the lysyl hydroxylase activity
          develops normally, while reducing the glucosyltransferase activity is embryonic-lethal in proportion
          to how much activity is lost. In patients the deficit is measurable, as markedly reduced glycosylated
          hydroxylysine in tissue.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: hydroxylysine-linked O-glycosylation of collagen
          term:
            id: GO:0180062
            label: protein O-linked glycosylation via galactose
          modifier: DECREASED
        - preferred_term: peptidyl-lysine hydroxylation
          term:
            id: GO:0017185
            label: peptidyl-lysine hydroxylation
          modifier: DECREASED
      selected_evidence:
        snippet: Mice with a mutation that blocked only the LH activity of LH3 developed normally, but
          showed defects in the structure of the basement membrane and in collagen fibril organization
          in newborn skin and lung.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
