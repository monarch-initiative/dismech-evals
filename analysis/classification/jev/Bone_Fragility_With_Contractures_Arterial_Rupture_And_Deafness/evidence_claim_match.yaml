        name: Reduced urinary glycosylated hydroxylysine
        presence: PRESENT
        notes: In the p.Leu627Pro child, urinary glycosylated hydroxylysine relative to hydroxylysine
          was markedly reduced, while total hydroxylysine relative to lysine and the disaccharide/monosaccharide
          ratio were preserved. The founding patient had absent urinary glucosyl-galactosyl pyridinoline
          and an altered hydroxylysine glycoside ratio. These assays support collagen-modification dysfunction;
          sensitivity, specificity and diagnostic cutoffs for BCARD have not been established.
        readouts:
        - target: Reduced Collagen Hydroxylysine Glucosylation
          relationship: READOUT_OF
          direction: NEGATIVE
          interpretation: Reduced glycosylated hydroxylysine products reflect defective collagen modification,
            but do not isolate every enzyme step or establish diagnostic specificity.
      selected_evidence:
        snippet: the ratio of (GGHL + GHL)/HL in the proband was reduced to about 17% of that measured
          in his parents
        supports: SUPPORT
        directness: DIRECT
