              id: MONDO:0012892
              label: bone fragility with contractures, arterial rupture, and deafness
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Type IV and VI Collagen Assembly and Secretion
        description: Type VI collagen fails to tetramerise inside the cell, and both type IV and type
          VI collagen are secreted poorly. The defect is therefore in getting the collagen out, not only
          in how it behaves once outside. Mice retaining glycosylation but lacking the lysyl hydroxylase
          activity make slightly underglycosylated type IV and VI collagens with abnormal distribution,
          and their muscle ultrastructure resembles collagen VI knockouts and some Ullrich congenital
          muscular dystrophy patients.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: protein secretion
          term:
            id: GO:0009306
            label: protein secretion
          modifier: DECREASED
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: The altered distribution and aggregation of type VI collagen led to similar ultrastructural
          alterations in muscle to those detected in collagen VI knockout and some Ullrich congenital
          muscular dystrophy patients.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
