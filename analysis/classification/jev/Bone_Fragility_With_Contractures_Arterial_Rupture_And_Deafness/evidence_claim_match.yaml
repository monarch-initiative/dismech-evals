        context: []
      assertion_type: AnimalModel
      assertion:
        name: mgtm635 plod3 Zebrafish
        species: Danio rerio
        genotype: Homozygous plod3 p.Gly245Glu (mgtm635)
        description: An ENU-derived missense model shows craniofacial, musculoskeletal, vascular, eye
          and ear abnormalities and early larval lethality. CRISPR exon-4 disruption phenocopies key defects.
          Human wild-type PLOD3 mRNA injected at the one-cell stage partially rescues the phenotype; tested
          clinical constructs have variable residual rescue. Autophagy-associated proteins and compartments
          increase, but these readouts do not by themselves quantify autophagic flux. Mitochondrial structural
          abnormalities and reduced metabolic transcripts do not establish a measured ATP deficit.
        publication: PMID:41827019
        modeled_mechanisms:
        - target: Altered Extracellular Collagen Fibril Organization
          relationship: PARTIALLY_RECAPITULATES
          limitations: Early developmental cartilage model with severe larval disease; human tissue specificity
            and natural history differ.
        - target: PERK Branch Unfolded Protein Response
          relationship: PARTIALLY_RECAPITULATES
          limitations: The stress response is measured; its role as harmful or adaptive is not resolved.
        notes: Succinate at 200 micromolar in egg water from 10 hours post-fertilization to four days
          improved body length and somite angle, with the angle reduced about 12%. Three metabolic transcripts
          approached wild-type levels; UPR transcript changes were not significant. This developmental
          experiment provides no human efficacy or safety evidence.
      selected_evidence:
        snippet: the PERK pathway was upregulated as shown by increased levels of its targets atf4 and
          ddit3 (Chop) in 4 dpf mgtm635 zebrafish
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41827019
      reference_title: Succinate supplementation ameliorates musculoskeletal defects caused by PLOD3 mutations
        in a BCARD syndrome model.
