        modeled_mechanisms:
        - target: Basement Membrane Disorganization
          relationship: PARTIALLY_RECAPITULATES
          limitations: Embryonic mouse matrix failure differs from the variable, survivable human syndrome.
        - target: Altered Extracellular Collagen Fibril Organization
          relationship: PARTIALLY_RECAPITULATES
          limitations: Selective hydroxylase loss remains pathogenic to matrix structure despite survival.
      selected_evidence:
        snippet: Mice with a mutation that blocked only the LH activity of LH3 developed normally, but
          showed defects in the structure of the basement membrane and in collagen fibril organization
          in newborn skin and lung.
        supports: SUPPORT
        directness: DIRECT
