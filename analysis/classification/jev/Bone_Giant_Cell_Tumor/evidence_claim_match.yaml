        mechanism_confidence: PROVISIONAL
        description: 'A minority of GCTBs produce lung nodules that are histologically identical to the
          primary tumor yet behave nothing like carcinomatous metastasis: survival remains near-normal,
          and spontaneous regression has been documented. Whether these represent true metastasis or mechanical
          embolization of tumor fragments during surgical manipulation is unresolved, which is why the
          curated confidence is PROVISIONAL and the node is named for implantation rather than metastasis.
          The observed risk factors - local recurrence, high Campanacci stage, and curettage over resection
          - are equally compatible with either reading.'
        biological_scale: ORGANISM
        role: outcome
      selected_evidence:
        snippet: The 5-year overall survival rate was 94.4%.
