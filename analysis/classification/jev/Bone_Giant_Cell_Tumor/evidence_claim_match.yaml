  56135587da7a3fcdc748a878d426b3e0d05cae87a167aa771398ccb48c2f8923:
    claim:
      about:
        disease:
          name: Bone Giant Cell Tumor
          disease_term:
            preferred_term: bone giant cell tumor
            term:
              id: MONDO:0005674
              label: bone giant cell tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Osteoclast-Derived SEMA4D Feedback onto the Mutant Stroma
        description: The stroma-to-osteoclast axis is not one-way. Osteoclasts in GCTB secrete unregulated
          amounts of SEMA4D, which enhances proliferation of the mutant osteoprogenitors while arresting
          their maturation - reinforcing the very differentiation block that generated the osteoclast
          pool. The loop makes the neoplastic stroma partly dependent on the reactive compartment it creates,
          and this dependency is what makes depleting osteoclasts a therapeutically meaningful intervention
