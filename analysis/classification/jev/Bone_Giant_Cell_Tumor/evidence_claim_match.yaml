              label: bone giant cell tumor
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Radiographic signature of giant cell tumor of bone
        description: 'The lesion is diagnosed largely on its radiographic pattern in a specific clinical
          context: a purely lytic, geographically destructive lesion with circumscribed non-sclerotic
          borders, centred in the epiphysis but reaching the metaphysis and extending to the adjacent
          articular cortex, with no mineralized tumor matrix, in a patient with closed physes. Skeletal
          maturity is doing real diagnostic work here - it is the main clinical discriminator from chondroblastoma,
          which is also epiphyseal but occurs before physeal closure.'
        notes: Imaging narrows the differential but does not close it. The definitive discriminator against
          giant-cell-rich mimics is H3.3 G34W mutant-protein immunohistochemistry or H3-3A sequencing,
          curated under histopathology.
      selected_evidence:
        snippet: On radiographs, GCT demonstrates a lytic lesion centered in the epiphysis but involving
          the metaphysis and extending at least in part to the adjacent articular cortex.
        supports: SUPPORT
