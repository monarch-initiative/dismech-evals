      assertion_type: Discussion
      assertion:
        discussion_id: gctb_denosumab_recurrence_after_withdrawal
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Stromal RANKL Overexpression
        - pathophysiology#Local Recurrence After Incomplete Removal
        prompt: Does neoadjuvant denosumab increase the risk of local recurrence after subsequent curettage,
          and if so, is that an artefact of indication bias or a real consequence of leaving mutant stroma
          in a drug-induced quiescent state?
        rationale: The mechanism predicts the problem. Denosumab acts on RANKL, depleting the reactive
          osteoclast compartment; in cell-line work it neither inhibits the growth of nor kills the neoplastic
          stromal cells, and it does not alter their RANKL or OPG expression. The compartment that carries
          the driver mutation is therefore untouched, and the new bone the drug induces may make residual
          tumor harder to identify and clear at surgery. Reported recurrence after denosumab-then-surgery
          ranges from 20% to 100% across a systematic review - a spread wide enough to be uninformative
          on its own, and one that could equally reflect indication bias, since the drug is given to the
          worst tumors. Resolving this needs a design that controls for baseline tumor severity, which
          no published study has.
      selected_evidence:
        snippet: Our findings provide new insights in the anti-tumor effect of denosumab on GCT stromal
          cells and raise a concern that tumor recurrence may occur after the withdrawal of the drug.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
      - /name
      - /disease_term
