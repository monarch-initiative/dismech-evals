        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gctb_canine_driver_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
        prompt: Is the only naturally occurring animal counterpart of this disease driven by the same
          oncohistone, or does the canine tumor reach the same histology by a different molecular route?
        rationale: The canine vertebral case reproduces the human tumor's architecture - osteoclastic
          giant cells evenly distributed among spindled mononuclear cells - and its destructive osteolysis,
          yet showed no nuclear reactivity with the H3.3 G34W mutation-specific antibody. Three readings
          are compatible with that result and they have different consequences. If the antibody, validated
          only in human tissue, simply fails to cross-react, the dog is a usable model of the human mechanism.
          If canine H3.3 differs in sequence context around codon 34, the species is uninformative about
          this driver. If canine giant cell tumors are genuinely driven by something else, then the shared
          histology is convergent, and the tumor's architecture is a general outcome of stromal-osteoclast
          cross-talk rather than a specific consequence of this oncohistone - which would be the most
          interesting result of the three, and would argue that the histology is not diagnostic of the
          mechanism. Nothing short of sequencing distinguishes them.
        proposed_experiments:
        - experiment_id: gctb_canine_h3f3a_sequencing
          name: Targeted sequencing of H3-3A codon 34 in canine giant cell tumors
          description: Sequence the H3-3A codon 34 region in a series of canine giant cell bone tumors,
            alongside alignment of the canine H3.3 epitope against the human sequence the antibody was
            raised to, to separate assay failure from true molecular divergence.
          readouts:
          - name: Presence of a codon 34 substitution in canine tumor stromal cells
            target: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
            direction: UNCHANGED
            interpretation: Absence of any codon 34 change with a conserved epitope would establish genuine
              divergence; presence with a negative stain would establish assay failure. Direction is recorded
              as UNCHANGED because the informative result is the wild-type one.
      selected_evidence:
        snippet: The final diagnosis was a primary lumbar extradural giant cell tumor of bone.
        supports: SUPPORT
    origin:
