        name: Local Recurrence After Incomplete Removal
        description: Because the neoplastic stromal cells are histologically inconspicuous and diffusely
          distributed through the cavity wall, intralesional curettage reliably leaves some behind, and
          the tumor regrows. Recurrence is the dominant clinical problem in GCTB and the reason for high-speed
          burring, chemical or physical adjuvants, and cementation. It also raises the risk of the two
          rarer downstream outcomes, pulmonary implantation and malignant transformation.
        biological_scale: TISSUE
        role: outcome
      selected_evidence:
        snippet: The median interval between initial surgery and the first recurrence of GCT was 16 months
          (2-180 months).
