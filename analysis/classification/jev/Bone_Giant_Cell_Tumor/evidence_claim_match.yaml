        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
        genetic_context:
          variant_origin: SOMATIC
        description: 'The initiating and, in conventional GCTB, essentially the only recurrent genetic
          lesion is a somatic missense mutation at codon 34 of histone H3.3, canonically H3-3A (H3F3A)
          c.103G>T p.Gly34Trp. Critically for everything downstream, the mutation is confined to the mononuclear
          mesenchymal stromal cell population and is absent from the osteoclast-like giant cells and their
          myelomonocytic precursors: the cells that give the tumor its name are not the tumor. Rarer substitutions
          at the same codon (G34L, G34V, G34R) account for a small remainder of cases.'
        biological_scale: MOLECULAR
        role: trigger
        cell_types:
        - preferred_term: Neoplastic mesenchymal stromal cell
          term:
            id: CL:0000134
            label: mesenchymal stem cell
      selected_evidence:
        snippet: in 92% (49/53) of giant cell tumors of bone, we found histone H3.3 alterations exclusively
          in H3F3A, leading to p.Gly34Trp or, in one case, p.Gly34Leu alterations
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
