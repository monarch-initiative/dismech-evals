      assertion:
        name: Locally Aggressive Osteolytic Tumor Mass
        description: 'The combined neoplastic and reactive compartments form an expanding epiphyseal-metaphyseal
          mass that erodes trabecular bone, thins and expands the cortex, and in advanced (Campanacci
          grade III) disease breaches it into the surrounding soft tissue. Subchondral extension threatens
          the adjacent joint. Secondary aneurysmal-bone-cyst-like change with blood-filled spaces is a
          common accompaniment. The mass, not any systemic effect, causes the disease''s clinical phenotype:
          pain, swelling, restricted joint motion, pathologic fracture, and - in axial lesions - neural
          compression.'
        biological_scale: TISSUE
        role: outcome
      selected_evidence:
        snippet: Giant cell tumors of bone (GCT-B) are rare, locally aggressive tumors characterized by
          an abundance of giant cells.
        supports: SUPPORT
