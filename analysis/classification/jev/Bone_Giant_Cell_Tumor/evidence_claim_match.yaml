      assertion_type: Treatment
      assertion:
        name: Extended Intralesional Curettage with Adjuvant and Cementation
        description: 'The standard operation for most Campanacci grade I and II lesions: curettage of
          the cavity, high-speed burring of its walls, a chemical or physical adjuvant, and filling with
          polymethylmethacrylate bone cement or bone graft. It preserves the joint at the cost of a substantial
          recurrence rate, because the neoplastic stroma is inconspicuous and diffuse. Meta-analytic evidence
          favours cement over graft for local control, though recurrence remains high either way, and
          a distal-radius meta-analysis found no cement advantage in that site - so the choice is not
          settled across all locations.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: curettage procedure
          term:
            id: NCIT:C15216
            label: Curettage Procedure
      selected_evidence:
        snippet: Intralesional curettage with BG had a recurrence risk ratio of 1.68 (95% confidence interval
          [CI], 1.22-2.31, p = 0.001) when compared with BC.
        supports: SUPPORT
