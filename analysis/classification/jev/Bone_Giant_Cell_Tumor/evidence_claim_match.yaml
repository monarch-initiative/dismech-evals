      assertion_type: Pathophysiology
      assertion:
        name: Enhancer-Level SCUBE3 Repression
        description: Among the transcriptional consequences of the oncohistone, one has been resolved
          to a specific paracrine mediator. Mutant H3.3 is enriched at the enhancer regions of SCUBE3,
          which encodes a secreted TGF-beta-like factor, and the accompanying histone-mark changes reduce
          its expression. Loss of stromal SCUBE3 removes a brake on osteoclast recruitment, so this node
          is a de-repression step rather than an activating one - the tumor recruits osteoclasts partly
          by ceasing to restrain them.
        biological_scale: MOLECULAR
        role: mediator
        biological_processes:
        - preferred_term: Positive regulation of osteoclast differentiation
          term:
            id: GO:0045672
            label: positive regulation of osteoclast differentiation
          modifier: INCREASED
      selected_evidence:
        snippet: We show that the changes in the transcriptome and epigenome in the mesenchymal cells
          caused by the H3.3-G34W mutation contribute to increase osteoclast recruitment in part via reduced
          expression of the TGFβ-like soluble factor, SCUBE3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
