          name: Bone Giant Cell Tumor
          disease_term:
            preferred_term: bone giant cell tumor
            term:
              id: MONDO:0005674
              label: bone giant cell tumor
        context: []
      assertion_type: Treatment
      assertion:
        name: Denosumab
        description: 'A fully human monoclonal antibody against RANKL, and the clearest example in this
          entry of a mechanism-directed therapy. By blocking RANKL it starves the reactive osteoclast
          compartment, eliminating the giant cells and halting resorption; the arrested stroma then differentiates
          and new bone forms in the lesion. It permits surgery to be downstaged or deferred in tumors
          that would otherwise require a morbid operation, and it is the principal option in unresectable
          axial disease. Two limits follow directly from the mechanism: it does not eliminate the mutant
          stroma, so tumors regrow when it stops; and tumors that have escaped osteoclast dependence through
          telomerase alterations are predicted not to respond.'
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: denosumab
            term:
              id: NCIT:C61313
              label: Denosumab
        notes: Approved for adults and skeletally mature adolescents with unresectable GCTB, or where
          surgery would cause severe morbidity. Whether neoadjuvant denosumab raises post-curettage recurrence
          is genuinely unsettled and is curated as an explicit discussion below rather than asserted here.
      selected_evidence:
        snippet: '30 of 35 (86%; 95% CI 70-95) of evaluable patients had a tumour response: 20 of 20 assessed
          by histology and 10 of 15 assessed by radiology.'
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
