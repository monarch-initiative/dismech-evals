        description: Not a mimic but a progression, and the distinction that changes management most.
          A high-grade sarcoma arising primarily alongside or secondarily at the site of a conventional
          tumor. It may retain or lose the H3.3 G34W stain, so a negative stain in a giant-cell-rich sarcoma
          does not exclude it.
        distinguishing_features:
        - High-grade sarcomatous histology, most often osteosarcoma
        - May carry TP53 mutation or loss of H3K27me3
        - The H3-3A G34W mutation is lost in a substantial fraction of malignant components
      selected_evidence:
        snippet: However, in the remaining five cases, in contrast to their associated H3F3A G34W-mutant
          giant cell tumor, the sarcoma lacked the H3F3A G34W mutation, either entirely or sub-clonally
          in the samples tested.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/3
      evidence_path: /differential_diagnoses/3/evidence/0
      context_paths:
