      assertion_type: DifferentialDiagnosis
      assertion:
        name: Chondroblastoma
        description: 'The other epiphyseal giant-cell-rich bone tumor, and the sharpest mechanistic contrast
          in this entry: it is driven by a p.Lys36Met substitution in H3-3B rather than p.Gly34Trp in
          H3-3A. The two oncohistone lesions are mutually exclusive and tumor-type specific, so the molecular
          test separates them definitively. Clinically, chondroblastoma occurs before physeal closure,
          whereas GCTB occurs after.'
        distinguishing_features:
        - Driven by H3-3B p.Lys36Met rather than H3-3A p.Gly34Trp
        - Occurs in the skeletally immature, before physeal closure
        - Negative for H3.3 G34W mutant-protein immunohistochemistry
      selected_evidence:
        snippet: In 73 of 77 cases of chondroblastoma (95%), we found p.Lys36Met alterations predominantly
          encoded in H3F3B, which is one of two genes for histone H3.3.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
