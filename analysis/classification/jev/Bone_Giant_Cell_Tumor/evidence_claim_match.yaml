            description: Incorporated H3.3-G34W acts in cis on its own tail - the bulky tryptophan at
              position 34 impairs H3K36 trimethylation of the mutant histone - and the consequences propagate
              genome-wide. The repressive H3K27me3 mark is redistributed from intergenic to genic regions,
              and DNA methylation, chromatin accessibility, and other histone modifications shift with
              it, most markedly over heterochromatic and bivalent domains. The result is aberrant transcription
              across a broad program rather than dysregulation of a single target gene.
            biological_scale: MOLECULAR
            role: mediator
