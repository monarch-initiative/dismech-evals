      assertion:
        discussion_id: gctb_paget_associated_familial_subset
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
        prompt: What inherited factor predisposes to giant cell tumor arising in Paget disease of bone,
          and does that subset share the H3-3A G34W driver curated for conventional sporadic GCTB?
        rationale: This entry models conventional sporadic GCTB and asserts no inheritance. A distinct
          subset contradicts that framing at the level of the disease name, and is recorded here rather
          than silently dropped. Giant cell tumor arising in Paget disease clusters strongly in families,
          is disproportionately multifocal, favours flat bones over the long-bone epiphyses this entry
          describes, and carries roughly 50 percent five-year mortality against 0 to 5 percent for GCT
          without Paget disease. The predisposition is most plausibly inherited through Paget disease
          genetics rather than through anything in the mechanism graph curated here, but the retrieved
          literature does not establish the germline basis of the GCT phenotype specifically, and does
          not report whether these tumors carry H3-3A G34W at all. Until that is known it is not possible
          to say whether PDB-associated GCT is the same disease arising on a permissive background, or
          a mechanistically separate entity sharing a histological name - which is why it is scoped out
          of this entry rather than merged into it, and why a separate entry would be the right home for
          it.
        proposed_experiments:
        - experiment_id: gctb_pdb_associated_driver_and_germline
          name: H3-3A genotyping and germline sequencing of PDB-associated giant cell tumors
          description: Genotype H3-3A codon 34 in a series of PDB-associated giant cell tumors and sequence
            germline DNA from affected kindreds, to determine whether the subset shares the sporadic driver
            and whether a segregating predisposition allele accounts for the familial clustering.
          readouts:
          - name: H3-3A codon 34 mutation status in PDB-associated giant cell tumors
            target: pathophysiology#Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
            direction: UNCHANGED
            interpretation: Wild-type codon 34 would establish PDB-associated GCT as a mechanistically
              distinct entity; G34W would place it on the same pathograph with an inherited permissive
              background. Direction is recorded as UNCHANGED because the entity-separating result is the
              wild-type one.
      selected_evidence:
        snippet: Patients with Paget's bone disease (PDB) have an increased risk of developing giant cell
          tumor (GCT).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25196811
      reference_title: Clinical characteristics and evolution of giant cell tumor occurring in Paget's
        disease of bone.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the existence of the subset this discussion scopes out.
