      assertion_type: ProgressionInfo
      assertion:
        phase: Local growth, treatment, and surveillance for recurrence
        notes: The usual course is a single episode of insidious local growth over months, surgical treatment,
          and then a surveillance period dominated by recurrence risk. Recurrence clusters early - median
          around 16 months - which sets the intensity of early follow-up, though the reported range extends
          to 15 years. Chest surveillance runs in parallel because pulmonary deposits appear later and
          are strongly associated with recurrence. Malignant transformation is a late and rare event.
      selected_evidence:
        snippet: The median interval between initial surgery and the first recurrence of GCT was 16 months
          (2-180 months).
        supports: SUPPORT
