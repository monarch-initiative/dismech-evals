      assertion_type: Treatment
      assertion:
        name: Zoledronic Acid
        description: 'A bisphosphonate used as a systemic or cement-loaded local adjuvant. Its mechanism
          in GCTB is not the same as denosumab''s: in cell-line work it directly inhibits growth of and
          induces apoptosis in the neoplastic stromal cells, whereas denosumab does neither. That difference
          makes it conceptually attractive as an adjuvant against the compartment denosumab leaves behind,
          but the clinical evidence is small-trial and meta-analytic rather than definitive, so it is
          curated as a supported adjunct and not as standard of care.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: zoledronic acid
            term:
              id: CHEBI:46557
              label: zoledronic acid
      selected_evidence:
        snippet: In a small RCT, bisphosphonates were successful in controlling tumour growth and a higher
          apoptotic index of tumour cells was seen after zoledronic acid versus controls.
        supports: SUPPORT
