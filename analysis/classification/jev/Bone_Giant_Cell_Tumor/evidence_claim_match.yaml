              label: bone giant cell tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Malignant Sarcomatous Transformation
        mechanism_confidence: PROVISIONAL
        description: 'Rarely, GCTB progresses to a high-grade sarcoma, either arising alongside a conventional
          component (primary malignant GCTB) or years after treatment of a conventional tumor (secondary
          malignant GCTB). Transformation requires genetic events beyond the oncohistone: TP53 mutation
          with p53 nuclear accumulation, and loss of H3K27me3, are each found in subsets and appear mutually
          exclusive. Telomerase alterations are a distinct route, and carry a specific therapeutic implication
          - they render the neoplastic cells independent of osteoclasts for proliferation, predicting
          denosumab unresponsiveness. In a substantial fraction of cases the malignant component has lost
          the H3-3A G34W mutation the benign component carried, so the transformed tumor is not simply
          a more aggressive version of its precursor.'
        biological_scale: CELLULAR
        role: outcome
      selected_evidence:
        snippet: NGS on four MGCTBs revealed pathogenic mutations in TP53 (n = 3), EZH2 (n = 1) and several
          other genes.
        supports: SUPPORT
