        name: Osteoclast-Like Multinucleated Giant Cells on a Mononuclear Background
        description: 'The diagnostic histology is a uniform distribution of very large multinucleated
          osteoclast-like giant cells, often with dozens of nuclei, scattered evenly through sheets of
          mononuclear cells. The mononuclear population is itself two populations that light microscopy
          does not separate: reactive monocyte-macrophage lineage cells, and the spindled neoplastic stromal
          cells that carry the mutation. Even distribution of the giant cells is a useful discriminator
          from other giant-cell-rich lesions, where they tend to cluster.'
        diagnostic: true
      selected_evidence:
        snippet: Giant cell tumor of bone (GCT-B) is a locally aggressive neoplasm composed of sheets
          of mononuclear cells admixed with uniformly distributed large osteoclast-like giant cells, primarily
          affecting the metaphysis of long bones
        supports: SUPPORT
