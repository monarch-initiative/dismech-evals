        context: []
      assertion_type: Stage
      assertion:
        name: Campanacci Grade III (aggressive)
        description: 'Ill-defined margins, cortical destruction, and soft-tissue extension. Grade III
          is the point at which the curettage-versus-resection calculation flips: intralesional treatment
          carries a markedly higher recurrence risk here, and grade III is independently a risk factor
          for pulmonary implantation. It is also the setting where neoadjuvant denosumab is used to downstage
          before surgery.'
        role: advanced
        notes: Campanacci grading is radiographic-surgical rather than an oncological stage; it describes
          local aggressiveness, not the benign/malignant distinction, which is captured separately by
          the Malignant Sarcomatous Transformation node.
      selected_evidence:
        snippet: intralesional excision appears to be more appropriate for the treatment of local lesions
          (e.g., grades 1 and 2) than grade 3 GCTs of the distal radius
        supports: SUPPORT
    origin:
