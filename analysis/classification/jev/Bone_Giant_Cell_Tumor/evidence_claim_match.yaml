            label: H3-3A
        variants:
        - name: H3-3A c.103G>T p.Gly34Trp
          type: MISSENSE
          description: The canonical oncohistone substitution. It does not raise the activity of a normal
            H3.3 function; it creates a chromatin behaviour wild-type H3.3 does not have - impaired H3K36
            trimethylation in cis and consequent genome-wide redistribution of H3K27me3 - so it is best
            read as neomorphic rather than as a simple gain of function.
        case_fractions:
        - population: Sequenced GCTB series, 180 cases
          case_fraction_percent: 90.56
          cohort_size: 180
          notes: G34W specifically; a further 4.4% carried G34L, G34V, or G34R, for 95.0% of cases mutated
            at codon 34 overall.
        notes: The somatic driver of conventional GCTB, confined to the neoplastic stromal cells. Because
          it is somatic and tumor-restricted it carries no recurrence risk for relatives and is not a
          germline testing target; its clinical role is diagnostic, through mutation-specific immunohistochemistry
          or sequencing.
      selected_evidence:
        snippet: The mutations were restricted to the stromal cell population and were not detected in
          osteoclasts or their precursors.
        supports: SUPPORT
