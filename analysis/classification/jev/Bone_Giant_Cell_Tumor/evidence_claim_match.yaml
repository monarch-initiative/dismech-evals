      assertion_type: Discussion
      assertion:
        discussion_id: gctb_no_in_vivo_g34w_model
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
        - pathophysiology#Enhancer-Level SCUBE3 Repression
        prompt: Does the H3.3-G34W oncohistone initiate a giant cell tumor in vivo, and does the stromal-to-osteoclast
          paracrine loop operate as modeled when both compartments are present in a living skeleton?
        rationale: 'Every mechanistic step curated in this entry between the mutation and the osteoclast
          compartment - the epigenetic reprogramming, the differentiation block, SCUBE3 de-repression,
          the SEMA4D return signal - rests on patient-derived cultures, edited tumor-derived cell lines,
          and monocyte co-cultures. No genetically engineered animal carrying a knock-in G34W allele was
          identified in this curation pass. That matters more here than in most diseases, because the
          central claim is specifically about cross-talk between two cell compartments: a monoculture
          cannot test it, and a co-culture reconstitutes it only in the absence of bone matrix, vasculature,
          and an intact recruitment step. The tumor-formation experiment that establishes necessity was
          performed in cells that were already tumor-derived, so initiation from a normal mesenchymal
          progenitor remains untested.'
        proposed_experiments:
        - experiment_id: gctb_conditional_g34w_knockin
          name: Conditional H3-3A G34W knock-in in the osteoblast lineage
          description: Generate a conditional knock-in of the G34W allele driven in mesenchymal or osteoprogenitor
            lineages and determine whether a giant-cell-rich osteolytic lesion arises, whether the recruited
            osteoclasts are genotypically wild type, and whether Scube3 is repressed in the mutant stroma
            in situ.
          readouts:
          - name: Formation of a giant-cell-rich osteolytic lesion
            target: pathophysiology#Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
            direction: INCREASED
            interpretation: Lesion formation from a normal progenitor would establish sufficiency, which
              the existing edited-cell experiment cannot.
          - name: Scube3 expression in mutant stroma in situ
            target: pathophysiology#Enhancer-Level SCUBE3 Repression
            direction: DECREASED
            interpretation: In vivo confirmation that the de-repression step operates outside culture.
      selected_evidence:
        snippet: By profiling the epigenome, transcriptome, and secreted proteome of patient samples and
          tumor-derived cells CRISPR-Cas9-edited for H3.3 G34W
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
