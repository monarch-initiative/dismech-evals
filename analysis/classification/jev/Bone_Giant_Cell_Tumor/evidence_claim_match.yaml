  a274660c115088f764016f53e34dc3a1dabb926ba24c4c50607e41f6d6013077:
    claim:
      about:
        disease:
          name: Bone Giant Cell Tumor
          disease_term:
            preferred_term: bone giant cell tumor
            term:
              id: MONDO:0005674
              label: bone giant cell tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Genome-Wide Epigenetic Reprogramming by Mutant Histone H3.3
        description: Incorporated H3.3-G34W acts in cis on its own tail - the bulky tryptophan at position
          34 impairs H3K36 trimethylation of the mutant histone - and the consequences propagate genome-wide.
          The repressive H3K27me3 mark is redistributed from intergenic to genic regions, and DNA methylation,
          chromatin accessibility, and other histone modifications shift with it, most markedly over heterochromatic
          and bivalent domains. The result is aberrant transcription across a broad program rather than
          dysregulation of a single target gene.
        biological_scale: MOLECULAR
        role: mediator
        biological_processes:
        - preferred_term: Chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: ABNORMAL
        - preferred_term: Heterochromatin organization
          term:
            id: GO:0070828
            label: heterochromatin organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: we show that H3.3K36me3 loss on mutant H3.3 alters the deposition of the repressive H3K27me3
          mark from intergenic to genic regions, beyond areas of H3.3 deposition
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32967858
      reference_title: H3.3 G34W Promotes Growth and Impedes Differentiation of Osteoblast-Like Mesenchymal
        Progenitors in Giant Cell Tumor of Bone.
      evidence_source: IN_VITRO
      explanation: States the specific chromatin-mark redistribution that defines this node, including
        its spread beyond sites of mutant H3.3 deposition.
