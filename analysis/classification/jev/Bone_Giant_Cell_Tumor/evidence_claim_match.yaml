          mature osteoblast identity, the formative arm of remodeling is simultaneously suppressed, so
          resorption is uncoupled in both directions at once. This is the shared effector step this entry
          has in common with metabolic bone disease, and the reason the tumor's radiographic signature
          is purely lytic.
