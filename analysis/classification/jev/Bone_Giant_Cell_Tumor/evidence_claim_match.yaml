  757d7a2ad1dd8d311935073d1ef80ab1c3a5bedb7f0d1eb3607dfbff844f3a07:
    claim:
      about:
        disease:
          name: Bone Giant Cell Tumor
          disease_term:
            preferred_term: bone giant cell tumor
            term:
              id: MONDO:0005674
              label: bone giant cell tumor
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Patient-derived GCTB stromal cell culture
        description: 'Primary mononuclear stromal cells outgrown from surgical GCTB specimens, carrying
          the endogenous H3.3-G34W mutation at physiological expression levels. This is the workhorse
          system of the field: essentially all mechanistic knowledge of the oncohistone''s chromatin effects,
          the osteogenic differentiation block, and the SCUBE3/SEMA4D paracrine axis derives from it.'
        experimental_model_type: PRIMARY_CELL_CULTURE
        cell_source: Surgical giant cell tumor of bone specimens
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        publication: PMID:33110075
        modeled_mechanisms:
        - target: Genome-Wide Epigenetic Reprogramming by Mutant Histone H3.3
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the chromatin incorporation of mutant H3.3 and the genome-wide DNA methylation,
            accessibility, and histone-mark changes in cells carrying the endogenous mutation.
          limitations: Cultured stromal cells are isolated from the osteoclast compartment and bone matrix
            that shape their behaviour in vivo, so the paracrine loop curated in this entry cannot operate
            in monoculture. Outgrowth also selects for proliferative cells, and the differentiation stage
            of the cultured population is itself a confounder the source study raises.
          readouts:
          - name: Genome-wide DNA methylation, chromatin accessibility, and histone modification profiles
            target: Genome-Wide Epigenetic Reprogramming by Mutant Histone H3.3
            direction: ALTERED
            interpretation: Multi-layer epigenomic profiling is the measurement that grounds this node.
        - target: Arrested Osteogenic Differentiation of the Neoplastic Stroma
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Mutant patient-derived cells show impaired osteogenic differentiation under differentiation
            conditions.
          limitations: Differentiation assays are driven by supraphysiological osteogenic media rather
            than the in vivo niche, and the source study frames the finding as a delay in differentiation
            stage, which is a weaker claim than a permanent block.
          readouts:
          - name: Osteogenic differentiation capacity of mutant versus wild-type stromal cells
            target: Arrested Osteogenic Differentiation of the Neoplastic Stroma
            direction: DECREASED
            interpretation: Reduced osteogenic differentiation is the direct cellular correlate of the
              differentiation-block node.
      selected_evidence:
        snippet: The neoplastic stromal cells of giant cell tumor of bone (GCTB) carry a mutation in H3F3A,
          leading to a mutant histone variant, H3.3-G34W, as a sole recurrent genetic alteration.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33110075
      reference_title: Globally altered epigenetic landscape and delayed osteogenic differentiation in
        H3.3-G34W-mutant giant cell tumor of bone.
      evidence_source: IN_VITRO
      explanation: Establishes that cells cultured from GCTB specimens carry the disease-defining lesion,
        which is what makes this culture system a valid model of the human disease.
