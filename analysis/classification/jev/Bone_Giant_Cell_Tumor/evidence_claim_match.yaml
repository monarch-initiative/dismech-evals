  1af294ba899193b22f9a6b1c47e8efd25de87efe7a3fde93f71889bfaf3e8e40:
    claim:
      about:
        disease:
          name: Bone Giant Cell Tumor
          disease_term:
            preferred_term: bone giant cell tumor
            term:
              id: MONDO:0005674
              label: bone giant cell tumor
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Naturally occurring canine vertebral giant cell tumor of bone
        description: A spontaneous primary lumbar extradural giant cell tumor in a 10-year-old Poodle,
          characterized by imaging, necropsy, histology, histochemistry, and immunohistochemistry. It
          reproduces the human tumor's cellular architecture - TRAP-positive osteoclastic giant cells
          evenly distributed among alpha-SMA-positive spindled mononuclear cells and IBA-1-positive histiocytic
          cells - and its destructive osteolysis. It is the only naturally occurring non-human example
          identified in this curation pass, and it is included for what it fails to show as much as for
          what it shows.
        species: Dog
        genotype: Not determined; spontaneous tumor in a wild-type animal
        publication: PMID:41908959
        modeled_mechanisms:
        - target: Recruitment and Fusion of Reactive Osteoclast-Like Giant Cells
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The canine tumor contains the same tripartite cellular composition as the human
            disease, with abundant osteoclast-type multinucleated giant cells distributed among mononuclear
            stromal and histiocytic populations.
          limitations: A single spontaneous case, characterized only at necropsy. Fidelity is capped at
            MODERATE rather than HIGH because the compositional match is morphological and immunophenotypic;
            no genotyping was performed, so the canine giant cells are not shown to be reactive to a mutant
            stromal population in the way that defines the human mechanism.
          readouts:
          - name: TRAP-positive multinucleated giant cells distributed among mononuclear cells
            target: Recruitment and Fusion of Reactive Osteoclast-Like Giant Cells
            direction: INCREASED
            interpretation: Histochemical confirmation of an osteoclast-type giant cell population in
              the canine tumor.
        - target: Somatic H3-3A G34W Oncohistone Mutation in Mesenchymal Stromal Cells
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Immunohistochemistry with the H3.3 G34W mutation-specific antibody showed no nuclear
            reactivity in the canine tumor. The animal reproduces the disease's cellular architecture
            without demonstrating the molecular driver that defines it in humans, so it cannot serve as
            a model of the oncohistone mechanism curated at this node.
          limitations: The negative result is not decisive about canine biology. The antibody is validated
            for human tissue only, so a species difference in the H3.3 sequence context or simple loss
            of cross-reactivity would produce the same absent stain as a genuinely different driver. No
            sequencing was performed, and this is a single case. The honest reading is that the driver
            is undetermined in the dog, not that it is absent - which is precisely why the link is FAILS_TO_RECAPITULATE
            at LOW fidelity rather than a species-divergence claim.
        notes: The G34W-negative immunohistochemistry is stated in the case report's results and discussion
          rather than its abstract, so it is not quoted as a snippet here - abstract-only reference validation
          would not verify it. The open question it raises is curated as a HUMAN_MODEL_MISMATCH discussion.
      selected_evidence:
        snippet: The final diagnosis was a primary lumbar extradural giant cell tumor of bone.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
