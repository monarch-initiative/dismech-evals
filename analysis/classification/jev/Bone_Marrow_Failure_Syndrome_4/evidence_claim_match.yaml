      assertion_type: Pathophysiology
      assertion:
        name: Reduced Ribosomal Protein Gene Expression and Protein Synthesis in HSCs
        biological_scale: CELLULAR
        description: In mice MYSM1 binds ribosomal-protein gene loci and maintains their expression in
          HSCs; its loss lowers protein synthesis. The ribosomal-protein defect persists when p53 is deleted,
          placing it upstream of p53 activation. Reduced protein synthesis and raised p53 were also measured
          in blood cells of a patient with a homozygous nonsense variant, which is why the authors place
          MYSM1 deficiency alongside the ribosomopathies such as Diamond-Blackfan anaemia.
        cell_types:
        - preferred_term: hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        biological_processes:
        - preferred_term: cytoplasmic translation
          modifier: DECREASED
          term:
            id: GO:0002181
            label: cytoplasmic translation
      selected_evidence:
        snippet: Loss of p53 in mice fully rescues Mysm1-/- anemia phenotype but not RP gene expression,
          indicating that RP gene dysregulation is a direct outcome of Mysm1 deficiency and an upstream
          mediator of Mysm1-/- phenotypes through p53 activation.
        supports: SUPPORT
    origin:
