        prompt: What is the cumulative risk of MDS/AML in MYSM1 deficiency, and what surveillance should
          a child who has improved spontaneously have?
        rationale: Four patients from two families progressed at 10 to 12 years after an interval of spontaneous
          improvement, while other reported children were transplanted early or had somatic rescue. With
          about a dozen patients in total and ascertainment through transplant centres, no risk estimate
          or surveillance schedule can be derived, yet the transplant-timing decision turns on it.
      selected_evidence:
