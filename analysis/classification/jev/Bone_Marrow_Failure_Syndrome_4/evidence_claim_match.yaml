        biological_scale: CELLULAR
        description: Mysm1-deficient HSCs leave quiescence, cycle rapidly and die, exhausting the stem
          cell pool, while multipotent progenitors undergo PUMA-dependent apoptosis. This is the cellular
          basis of the multilineage marrow failure. The human counterpart is inferred from the clinical
          picture (hypocellular marrow, multilineage cytopenia) and from the strong selective advantage
          a single revertant HSC had in one patient.
        cell_types:
        - preferred_term: hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        - preferred_term: hematopoietic multipotent progenitor cell
          term:
