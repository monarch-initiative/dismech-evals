  dc75f838c65726421bcb11640aecb2708e8675eda5fcb5c658b3b8463331f424:
    claim:
      about:
        disease:
          name: Bone Marrow Failure Syndrome 4
          disease_term:
            preferred_term: bone marrow failure syndrome 4
            term:
              id: MONDO:0020856
              label: bone marrow failure syndrome 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Histone H2A K119 Deubiquitinase Activity
        biological_scale: MOLECULAR
        description: 'MYSM1 (also called 2A-DUB) is a JAMM/MPN metalloprotease that removes monoubiquitin
          from histone H2A lysine 119, a mark associated with transcriptional silencing, and so de-represses
          its target genes. The catalytic activity itself is what matters: a knock-in mouse carrying a
          catalytically dead MYSM1 phenocopies the knockout, and the catalytic-domain fragment carrying
          the human p.His656Arg variant has no deubiquitinase activity in vitro.'
        molecular_functions:
        - preferred_term: histone H2A deubiquitinase activity
          modifier: DECREASED
          term:
            id: GO:0140950
