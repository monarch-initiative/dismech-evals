        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Clonal Evolution to Myelodysplasia and Leukemia
        biological_scale: TISSUE
        description: 'In a 2025 Saudi series, four patients from two consanguineous families progressed
          from infantile marrow failure to hypocellular MDS (three) or MDS/AML (one) at 10 to 12 years,
          with acquired lesions including a TP53 mutation, monosomy 7 (with trisomy 8 in one), a 5q (EGR1)
          deletion and a CALR variant. The TP53 lesion is recorded in prose only: the source gives no
          allele fraction and does not say whether it relieved p53 activation, so it is not modelled as
          a somatic rescue event. The authors read the progression as clonal evolution; the magnitude
          of the risk across all patients is unknown.'
      selected_evidence:
        snippet: We report four cases of MYSM1 mutations progressing from marrow failure to MDS or AML
          within 9-10 years.
        supports: SUPPORT
