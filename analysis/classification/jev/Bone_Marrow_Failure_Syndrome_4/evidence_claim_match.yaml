        description: Biallelic MYSM1 alleles include nonsense, frameshift, splice-altering and catalytic-site
          missense variants. The synonymous c.399G>A allele causes exon-6 skipping and a frameshift; c.1843-1G>A
          causes in-frame exon-16 skipping with deletion of 63 amino acids and near-absent protein. Functional
          evidence differs by allele and must not be assumed for every rare variant.
        genes:
        - preferred_term: MYSM1
          term:
            id: hgnc:29401
            label: MYSM1
          modifier: LOSS_OF_FUNCTION
        genetic_context:
          description: Germline biallelic loss-of-function MYSM1 alleles, homozygous (usually through
            consanguinity, once through paternal uniparental disomy) or compound heterozygous.
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Genetic analysis revealed that this novel disorder is caused by a homozygous MYSM1 missense
          mutation affecting the catalytic site within the deubiquitinase JAB1/MPN/Mov34 (JAMM)/MPN domain.
        supports: SUPPORT
