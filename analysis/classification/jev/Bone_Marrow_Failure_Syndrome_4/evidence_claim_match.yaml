      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Stem Cell Transplantation
        description: 'The only curative treatment reported: matched family-donor transplants in early
          childhood with fludarabine-based reduced-intensity conditioning, and haploidentical transplants
          in older children after myeloid transformation. Because patient cells are hypersensitive to
          genotoxic agents, the reporting groups favour low-genotoxicity conditioning and caution with
          busulfan, cyclophosphamide and irradiation, by analogy with Fanconi anaemia. Timing balances
          transplant toxicity against the risk of later clonal evolution; the published series is too
          small to define it. Chronic GVHD of the eyes and lungs has been reported after haploidentical
          transplant.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
