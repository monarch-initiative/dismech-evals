          disease. Conditioning and timing require individual assessment of marrow disease and toxicity.
          Cell-assay sensitivity and analogies with other marrow-failure syndromes do not establish a
          universal ban on alkylators, which were used in successful transplants. Correction of all developmental
          features is not demonstrated.
