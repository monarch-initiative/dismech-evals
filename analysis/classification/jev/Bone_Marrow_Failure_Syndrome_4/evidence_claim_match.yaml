        prompt: Why do Mysm1-deficient mice develop thrombocytosis while patients have normal or mildly
          low platelet counts?
        rationale: The mouse reproduces the anaemia, lymphopenia and HSC failure, but the megakaryocyte
          lineage moves the opposite way. Either MYSM1 has a species-specific role in megakaryopoiesis,
          or the mouse thrombocytosis is a compensatory response absent in humans. Until that is understood,
          the mouse cannot be used to predict platelet-lineage behaviour.
      selected_evidence:
        snippet: Here we characterized an H2A-DUB targeted mouse line Mysm1(tm1a/tm1a) and demonstrated
          defects in BM hematopoiesis, resulting in lymphopenia, anemia, and thrombocytosis.
        supports: SUPPORT
