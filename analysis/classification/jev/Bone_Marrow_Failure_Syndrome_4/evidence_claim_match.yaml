          description: Germline biallelic loss-of-function MYSM1 alleles, homozygous (usually through
            consanguinity, once through paternal uniparental disomy) or compound heterozygous.
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Whole-exome sequencing revealed a homozygous premature stop codon mutation in the gene
          encoding MYSM1.
