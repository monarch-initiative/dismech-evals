          foci are not equivalent to unrepaired breaks. The screened infant had constitutive gamma-H2AX
          in a B-cell subset. Separately, primary fibroblasts and EBV-transformed cells from the 2017
          siblings showed prolonged UV/genotoxic stress responses. These contexts do not justify a universal
          statement about DNA repair or a categorical prohibition of transplant-conditioning agents.
