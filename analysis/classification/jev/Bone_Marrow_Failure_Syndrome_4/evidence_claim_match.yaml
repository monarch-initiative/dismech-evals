          modifier: DECREASED
          term:
            id: GO:0061484
            label: hematopoietic stem cell homeostasis
        - preferred_term: intrinsic apoptotic signaling pathway by p53 class mediator
          modifier: INCREASED
          term:
            id: GO:0072332
            label: intrinsic apoptotic signaling pathway by p53 class mediator
      selected_evidence:
        snippet: Mysm1 deletion drives HSCs from quiescence into rapid cycling and increases their apoptotic
          rate, resulting in an exhaustion of the stem cell pool
        supports: SUPPORT
