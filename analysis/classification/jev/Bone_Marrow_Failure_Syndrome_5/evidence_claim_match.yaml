        name: Germline TP53 Testing in DBA-Like Anaemia Without a Ribosomal Protein Variant
        description: 'The practical diagnostic point. TP53 belongs on the gene list for infantile pure
          red cell aplasia once ribosomal protein genes are negative. The founding variants were found
          by whole-exome sequencing. A TP53 result must be read by allele class: a C-terminal truncation
          points here, while a DNA-binding-domain variant points to Li-Fraumeni syndrome, with entirely
          different surveillance consequences.

          '
      selected_evidence:
        snippet: We discovered germline TP53 activating mutations in IBMFS cases mimicking Diamond-Blackfan
          anemia using whole-exome sequencing.
