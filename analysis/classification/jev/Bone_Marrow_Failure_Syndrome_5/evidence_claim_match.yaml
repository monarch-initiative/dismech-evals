        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TP53 C-Terminal Domain Truncation
        biological_scale: MOLECULAR
        description: 'Heterozygous germline frameshift variants near the 3'' end of TP53 remove the C-terminal
          domain while leaving the core DNA-binding domain intact. In the defining report both variants
          produced the same truncation, deleting 32 residues, and the mutant protein showed augmented
          transcriptional activity. This is the opposite direction of effect from the DNA-binding-domain
          variants of Li-Fraumeni syndrome. Recorded as GAIN_OF_FUNCTION following the sources'' own wording
          ("activating", "gain-of-function"); the reported effect is increased transactivation by the
          truncated protein, not a novel activity.

          '
        genes:
        - preferred_term: TP53
          term:
            id: hgnc:11998
            label: TP53
          modifier: INCREASED
        genetic_context:
          description: Heterozygous germline C-terminal frameshift TP53 alleles, de novo where origin
            is reported.
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
          modifier: INCREASED
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
      selected_evidence:
        snippet: Unexpectedly, the p53 mutant had augmented transcriptional activities, an observation
          not previously described in humans.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30146126
      reference_title: De Novo Mutations Activating Germline TP53 in an Inherited Bone-Marrow-Failure
        Syndrome.
      evidence_source: IN_VITRO
      explanation: 'Establishes the direction of effect: the truncated p53 transactivates more, not less,
        which is what makes this a p53-activating rather than a p53-losing disorder.

