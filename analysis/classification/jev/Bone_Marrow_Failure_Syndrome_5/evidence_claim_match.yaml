        discussion_id: bmfs5_cancer_risk
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - disease#Bone Marrow Failure Syndrome 5
        - genetic#TP53
        prompt: Do carriers of C-terminal truncating, activating TP53 alleles have an increased cancer
          risk, and is any tumour surveillance warranted?
        rationale: Inherited bone marrow failure syndromes as a class carry an increased risk of malignancy,
          and germline TP53 is the Li-Fraumeni gene, so a TP53 result on a marrow-failure panel invites
          Li-Fraumeni-style surveillance. But the BMFS5 alleles act in the opposite direction from Li-Fraumeni
          alleles, and the developmental-syndrome literature attributes cancer risk to loss of p53 activity
          rather than to its increase. None of the four case-report abstracts (PMID:30146126, PMID:35084091,
          PMID:35362179, PMID:42104732) reports a malignancy; with seven patients and follow-up durations
          not stated in those abstracts, absence of reported cancer is not evidence of absent risk. Whether
          somatic loss of the activating allele, or clonal selection for p53-pathway escape under constitutive
          p53 pressure, creates a myeloid risk in these patients is untested.
        proposed_experiments:
        - experiment_id: bmfs5_longitudinal_followup
          name: Longitudinal follow-up of reported carriers for malignancy and clonal haematopoiesis
          description: Pool the reported patients through a bone marrow failure registry and follow them
            for malignancy, with serial marrow or blood sequencing for somatic TP53-pathway clones.
          would_support:
          - disease#Bone Marrow Failure Syndrome 5
          supporting_outcome:
          - Cancer-free follow-up into adulthood with no expanding p53-pathway escape clones would support
            managing carriers without Li-Fraumeni surveillance.
          refuting_outcome:
          - Malignancy, or clonal expansion of cells that have lost or inactivated the activating allele,
            would argue for marrow surveillance.
      selected_evidence:
        snippet: Inherited bone-marrow-failure syndromes (IBMFSs) include heterogeneous genetic disorders
          characterized by bone-marrow failure, congenital anomalies, and an increased risk of malignancy.
        supports: SUPPORT
