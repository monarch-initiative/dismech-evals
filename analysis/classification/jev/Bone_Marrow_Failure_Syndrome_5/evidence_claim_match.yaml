        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Mouse
        - pathophysiology#p53 Pathway Hyperactivation
        prompt: Why is a single C-terminal truncating TP53 allele sufficient for marrow failure in humans
          when heterozygous p53-delta-31 mice are only mildly affected?
        rationale: The mouse reproduces the direction of effect but needs two copies for the severe phenotype,
          while every reported patient is heterozygous. Candidate explanations - greater human sensitivity
          of erythroid progenitors to p53 dosage, species differences in p53 target programmes, or the
          one-residue difference between the 31- and 32-residue truncations - are untested. In the mouse,
          lowering Mdm4 converts the mild heterozygote into a severe one, so MDM4 or MDM2 dosage is a
          plausible human modifier, but no source here tests it in patients.
      selected_evidence:
        snippet: who had a germline heterozygous C-terminal frameshift variant in TP53 similar to others
          that activate the transcription factor
        supports: SUPPORT
    origin:
