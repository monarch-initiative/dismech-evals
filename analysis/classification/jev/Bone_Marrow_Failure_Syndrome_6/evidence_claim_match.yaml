        biological_scale: CELLULAR
        description: 'One patient who progressed to MDS acquired somatic loss-of-function TP53 mutations.
          The natural reading, and the one the source gives, is rescue: a clone that inactivates p53 escapes
          the growth disadvantage the germline MDM4 lesion imposes, and outcompetes its neighbours. It
          is maladaptive because the escape route runs through the loss of p53 tumour suppression, which
          is the classic substrate for progression to MDS and leukaemia. This is the inverse of the usual
          two-hit picture - the somatic event relieves the germline mechanism rather than compounding
          it.

