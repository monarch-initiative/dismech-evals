      assertion_type: Discussion
      assertion:
        discussion_id: bmfs6_telomere_penetrance
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Telomere Shortening
        prompt: Is telomere shortening a consistent feature of MDM4-related bone marrow failure, or specific
          to the p.T454M founding family?
        rationale: 'Short telomeres are documented in humans, but in one family carrying one allele. The
          2026 cohort of six further individuals reports no telomere measurements at all, so the six genotypes
          that most broadened the allelic spectrum - four of them truncating rather than missense - are
          silent on exactly the axis the founding family established. Whether telomere shortening tracks
          all loss-of-function MDM4 alleles or is p.T454M-specific is therefore untested, and it matters
          clinically: telomere length is a front-line diagnostic in the telomere biology disorders, and
          a negative result would not currently exclude BMFS6.'
        proposed_experiments:
        - experiment_id: bmfs6_telomere_length_across_alleles
          name: Telomere length measurement across the reported MDM4 allelic spectrum
          description: Measure leukocyte telomere length in carriers of the truncating MDM4 alleles from
            the 2026 cohort and compare against the p.T454M family and age-matched controls.
          would_support:
          - pathophysiology#Telomere Shortening
          supporting_outcome:
          - Telomere length below the first centile for age in truncating-allele carriers, comparable
            to the p.T454M family, would establish telomere shortening as a feature of MDM4 haploinsufficiency
            generally rather than of one missense allele.
          refuting_outcome:
          - Age-normal telomere length in truncating-allele carriers would confine the telomere phenotype
            to p.T454M and argue that this entry should not conform to telomere_attrition at the disease
            level.
      selected_evidence:
        snippet: a germline missense mutation of MDM4, a negative regulator of p53, was found in a family
          with features suggestive of dyskeratosis congenita, e.g., bone marrow hypocellularity, short
          telomeres, tongue squamous cell carcinoma, and acute myeloid leukemia
        supports: SUPPORT
