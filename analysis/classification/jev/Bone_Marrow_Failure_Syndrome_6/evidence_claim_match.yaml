  8c771e967b8cecf9a377be3713980ca352935c17c1c32bd5988d29c9daf413db:
    claim:
      about:
        disease:
          name: Bone Marrow Failure Syndrome 6
          disease_term:
            preferred_term: bone marrow failure syndrome 6
            term:
              id: MONDO:0030015
              label: bone marrow failure syndrome 6
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Mdm4 p.T454M knock-in mouse
        species: Mouse
        genotype: Mdm4 p.T454M knock-in (the founding-family patient allele)
        publication: PMID:32300648
        description: 'A knock-in of the actual patient allele, which is what makes it the best-matched
          model available for this disease. It resolves the limitation that caps the p53-delta-31 mouse
          below it: the lesion is in Mdm4, not in p53.

          '
        modeled_mechanisms:
        - target: Telomere Shortening
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Reproduces increased p53 activity, decreased telomere length and bone marrow failure
            in one animal carrying the human allele.

            '
          limitations: Mouse telomeres are far longer than human telomeres and mice express telomerase
            more widely in somatic tissue, so the absolute shortening is not comparable and a mouse can
            tolerate attrition that would be pathological in a person. The model also covers only the
            missense p.T454M allele; the four truncating alleles from the 2026 cohort are unmodelled.
          readouts:
          - name: Telomere length
            target: Telomere Shortening
            direction: DECREASED
            interpretation: Direct measurement of the telomere phenotype in the patient genotype.
        - target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'The patient allele raises p53 activity in vivo, confirming in a whole organism
            what the human cell systems show.

            '
          limitations: p53 target-gene programs and the tolerance of tissues to p53 activation differ
            between mouse and human, so the magnitude of activation does not transfer.
          readouts:
          - name: p53 activity
            target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
            direction: INCREASED
            interpretation: In vivo confirmation of the central mechanism.
      selected_evidence:
        snippet: Variations in p53 activity markedly altered the phenotype of Mdm4 mutant mice, suggesting
          an explanation for the variable expressivity of disease symptoms in the family.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32300648
      reference_title: Germline mutation of MDM4, a major p53 regulator, in a familial syndrome of defective
        telomere maintenance.
      evidence_source: MODEL_ORGANISM
      explanation: 'The model''s most useful contribution beyond recapitulation: it supplies a mechanism
        for the variable expressivity seen in human carriers, by making p53 activity itself the modifier.

        '
