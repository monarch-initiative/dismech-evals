      assertion:
        name: CRISPR/Cas9 MDM4-deleted healthy-donor HSPCs
        description: 'MDM4 deleted in hematopoietic stem and progenitor cells from healthy donors, producing
          MDM4-haploinsufficient cells on an otherwise normal genetic background. This is the cleanest
          available test of dosage, since it isolates MDM4 copy number from patient genetic background.

          '
        experimental_model_type: PRIMARY_CELL_CULTURE
        publication: PMID:41758987
        modeled_mechanisms:
        - target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Human primary HSPCs with engineered MDM4 haploinsufficiency reproduce the p53
            hyperactivity and the functional haematopoietic deficit.

            '
          limitations: 'Engineered deletion is not the patient allelic spectrum: four of the six patient
            alleles are truncating, but two are missense, and a missense allele may retain partial function
            or act differently from a clean deletion. Engraftment is scored in immunodeficient mice, so
            the readout is a xenograft niche rather than a human marrow.'
          readouts:
          - name: p53 transcriptional activity
            target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
            direction: INCREASED
            interpretation: Direct readout of the released p53 brake.
          - name: Colony-forming capacity
            target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
            direction: DECREASED
            interpretation: Functional cost of p53 hyperactivity to progenitor proliferation.
      selected_evidence:
        snippet: We used CRISPR/Cas9 to delete MDM4 in healthy donor hematopoietic stem and progenitor
          cells (HSPCs).
        supports: SUPPORT
