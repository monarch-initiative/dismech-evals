      assertion_type: Pathophysiology
      assertion:
        name: Impaired HSPC Self-Renewal and Multilineage Output
        biological_scale: CELLULAR
        description: 'The functional cost of p53 hyperactivity, measured three ways: impaired colony-forming
          capacity, reduced engraftment potential in immunodeficient mice, and significantly reduced erythroid
          and myeloid cell yield from MDM4-mutant iPSCs. The lesion is on proliferation and differentiation
          capacity rather than on a single lineage, which is what makes the clinical picture a trilineage
          marrow failure rather than a single cytopenia.

          '
        cell_types:
        - preferred_term: hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        biological_processes:
        - preferred_term: erythrocyte differentiation
