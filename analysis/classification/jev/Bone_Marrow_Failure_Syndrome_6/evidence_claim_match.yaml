    evidence_metadata:
      reference: PMID:23770245
      reference_title: Mutant mice lacking the p53 C-terminal domain model telomere syndromes.
      evidence_source: MODEL_ORGANISM
      explanation: 'This is what makes the model informative for BMFS6 specifically: Mdm4 dosage is the
        variable that converts a mild phenotype into a severe one.

