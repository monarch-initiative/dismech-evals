          rather than established. It matters clinically out of proportion to its frequency: if p53-pathway
          escape is the routine evolutionary path in this disease, then serial somatic TP53 screening
          would be surveillance for the specific mechanism of leukaemic progression rather than a generic
          MDS work-up. Nothing yet supports a recommendation either way, and this entry makes none.'
