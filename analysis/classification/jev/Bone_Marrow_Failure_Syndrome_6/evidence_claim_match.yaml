      assertion_type: Pathophysiology
      assertion:
        name: Loss of MDM4-Mediated p53 Restraint
        biological_scale: MOLECULAR
        description: 'MDM4''s normal job is to hold p53 down. Complementation studies establish that this
          function needs two distinct parts of the protein - the p53-binding domain and the RING-finger
          domain - so a variant disabling either one is sufficient, which is consistent with the mixed
          null and missense allelic spectrum.

          '
        biological_processes:
        - preferred_term: negative regulation of signal transduction by p53 class mediator
          modifier: DECREASED
          term:
            id: GO:1901797
            label: negative regulation of signal transduction by p53 class mediator
      selected_evidence:
        snippet: Complementation studies revealed both p53-binding and RING-finger domains as necessary
          for MDM4-mediated hematopoietic regulation.
        supports: SUPPORT
