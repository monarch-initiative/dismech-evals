            deficit attributable to p53 hyperactivity.

            '
          limitations: iPSC-derived haematopoiesis is developmentally distinct from adult bone-marrow
            haematopoiesis and is generally biased toward primitive or yolk-sac-like programmes, so a
            differentiation deficit measured here is not straightforwardly a statement about adult marrow.
            The system also cannot model the marrow niche or the decades-long clonal dynamics that the
            somatic TP53 arm of this disease turns on.
          readouts:
