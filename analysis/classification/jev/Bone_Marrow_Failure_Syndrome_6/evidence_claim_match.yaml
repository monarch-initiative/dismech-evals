  f921b7e90b5fad7580bee0a10e98f8e6433b24f6b2e5c6a403f344db419c0eb7:
    claim:
      about:
        disease:
          name: Bone Marrow Failure Syndrome 6
          disease_term:
            preferred_term: bone marrow failure syndrome 6
            term:
              id: MONDO:0030015
              label: bone marrow failure syndrome 6
        context: []
      assertion_type: AnimalModel
      assertion:
        name: p53 C-terminal truncation (p53 delta-31) mouse, Mdm4-dosage sensitized
        species: Mouse
        genotype: Trp53 delta-31 (C-terminal domain deletion), homozygous and heterozygous; Mdm4 dosage
          reduced
        publication: PMID:23770245
        description: 'Not an MDM4 model in the first instance - it is a p53-activation model that was
          independently sensitized by lowering Mdm4. That makes it evidence about the axis rather than
          about the gene, which is why its fidelity is recorded as moderate and why its telomere findings
          are held in a HUMAN_MODEL_MISMATCH discussion rather than curated as human edges.

          '
        modeled_mechanisms:
        - target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'Reproduces the causal direction - increased p53 activity produces aplastic anaemia,
            and reducing Mdm4 makes it dramatically worse - but arrives there by truncating p53 rather
            than by an MDM4 variant.

            '
          limitations: The primary lesion is in p53 itself, not MDM4; Mdm4 dosage enters as a modifier.
            The mouse also develops pulmonary fibrosis and short telomeres, neither of which has been
            reported in human BMFS6, so the model's phenotype is broader than the human disease as currently
            described.
          readouts:
          - name: Aplastic anemia
            target: p53 Pathway Hyperactivation in Hematopoietic Stem and Progenitor Cells
            direction: INCREASED
            interpretation: Marrow failure arising directly from increased p53 activity, the mouse counterpart
              of the human haematopoietic phenotype.
      selected_evidence:
        snippet: Heterozygous p53+/Δ31 mice were only mildly affected, but decreased levels of Mdm4, a
          negative regulator of p53, led to a dramatic aggravation of their symptoms.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/0
      context_paths:
