      - /disease_term
    evidence_metadata:
      reference: PMID:23770245
      reference_title: Mutant mice lacking the p53 C-terminal domain model telomere syndromes.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that Mdm4 dosage is the variable driving the mouse phenotype, which is
        what makes this model informative for BMFS6 specifically.
