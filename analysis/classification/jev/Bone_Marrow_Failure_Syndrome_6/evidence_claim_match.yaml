      assertion_type: Discussion
      assertion:
        discussion_id: bmfs6_mouse_telomere_gene_program
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Telomere Shortening
        prompt: Does the downregulation of telomere-maintenance genes seen when p53 is hyperactivated
          in mice occur in human MDM4-haploinsufficient cells?
        rationale: This is the narrower question that survives now that the human telomere phenotype is
          established. The p53-hyperactive mouse shows a specific molecular program - downregulation of
          Dkc1, Rtel1, Tinf2 and Terf1, all genes mutated in dyskeratosis congenita or implicated in aplastic
          anaemia - and that program is the mouse's proposed explanation for its short telomeres. No human
          MDM4 carrier has had telomere-maintenance gene expression measured, so the shortening is documented
          in humans while the mechanism producing it is not. The distinction matters because a different
          route to the same shortening would change what the telomere arm predicts about which tissues
          are affected.
      selected_evidence:
        snippet: Importantly, several genes involved in telomere metabolism were downregulated in p53Δ31/Δ31
          cells, including Dyskerin, Rtel1, and Tinf2, which are mutated in dyskeratosis congenita, and
          Terf1, which is implicated in aplastic anemia.
        supports: SUPPORT
