  458ff6ab37a81f1097e06d640808574333dac3d5d58bbdb2de359dd83b0291a9:
    claim:
      about:
        disease:
          name: Bone Marrow Failure Syndrome 6
          disease_term:
            preferred_term: bone marrow failure syndrome 6
            term:
              id: MONDO:0030015
              label: bone marrow failure syndrome 6
        context: []
      assertion_type: Treatment
      assertion:
        name: MDM2/MDMX inhibitors (nutlins and successors) - contraindicated on mechanistic grounds
        description: 'Recorded as a treatment to avoid, not one to give, and recorded because it is the
          direct clinical consequence of this entry''s organising claim.

          MDM2/MDMX inhibitors are developed for cancer precisely to raise p53 activity - that is their
          intended pharmacology, not a side effect. BMFS6 is a disease of p53 hyperactivity caused by
          losing half the dose of MDMX (MDM4). Giving a drug whose mechanism is inhibition of that same
          axis would be expected to deepen the causal lesion rather than treat it, and the haematopoietic
          compartment is the one already demonstrably intolerant of the p53 pressure.

          The strength of this claim needs stating precisely. No publication makes this recommendation
          about BMFS6; no MDM2/MDMX inhibitor has been given to an MDM4-haploinsufficient patient, and
          no adverse outcome has been reported. The cited evidence establishes only the pharmacological
          premise - that these agents work by raising p53 activity. The contraindication follows from
          that premise plus this entry''s own mechanism, in one inference step, which is why it is graded
          INDIRECT.

          It is nonetheless worth curating rather than leaving implicit. These agents are in clinical
          evaluation for haematological malignancy, BMFS6 patients present with hypocellular MDS and progress
          to leukaemia, and one reported patient acquired somatic TP53 loss - so an MDM4-haploinsufficient
          person reaching an oncology setting where an MDM2/MDMX inhibitor is on the menu is a foreseeable
          situation rather than a hypothetical one.

          '
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: The pharmacological targeting of these two P53-regulators in order to restore or increase
          P53 expression and activity represents therefore a strategy for cancer therapy.
        supports: SUPPORT
        directness: INDIRECT
    origin:
