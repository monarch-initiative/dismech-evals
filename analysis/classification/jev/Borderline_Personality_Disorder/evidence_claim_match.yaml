      assertion_type: ProgressionInfo
      assertion:
        phase: Persistent functional vulnerability and possible recurrence
        notes: Symptomatic remission does not guarantee durable social and vocational recovery. In one
          intensively assessed inpatient cohort followed for 24 years, sustained remission was more common
          than sustained recovery, and loss of recovery was more common than symptomatic recurrence; those
          cohort-specific percentages should not be generalized as population rates.
      selected_evidence:
        snippet: Taken together, the results of this study suggest that sustained symptomatic remission
          is substantially more common than sustained recovery from BPD.
        supports: SUPPORT
