      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: BPD can substantially disrupt relationships, education, employment, and housing and
          is associated with recurrent crises, nonsuicidal self-injury, suicide attempts, psychiatric
          comorbidity, and high health-care and social costs. Functional impairment can persist after
          symptomatic remission.
      selected_evidence:
        snippet: BPD is associated with substantial lifetime burdens and psychosocial impairments, including
          high rates of co-occurring psychiatric disorders; disruptions in interpersonal relationships,
          school, work, and housing; and suicide attempts and nonsuicidal self-injury.
        supports: SUPPORT
