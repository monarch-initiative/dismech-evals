      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: BFLS produces lifelong neurodevelopmental disability with variable speech limitation
          and behavior challenges, together with endocrine, visual, hearing, neurologic, skin, dental,
          and congenital complications that require multidisciplinary follow-up. Severity varies considerably,
          especially by sex and variant context, and the available cohorts are small; high burden does
          not imply uniformly severe expression in every affected person.
      selected_evidence:
        snippet: All the individuals had delayed motor milestones. Intellectual disability varied in severity
          from mild to severe. Limited or delayed speech was common (18/19). Behavioural problems were
          also frequent (13/19, 6 males and 7 females).
        supports: SUPPORT
