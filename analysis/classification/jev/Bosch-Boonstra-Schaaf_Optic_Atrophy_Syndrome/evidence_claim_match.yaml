              id: MONDO:0014320
              label: Bosch-Boonstra-Schaaf optic atrophy syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: NR2F1
        association: Pathogenic loss-of-function and variant-specific dominant-negative effects
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: NR2F1
          term:
            id: hgnc:7975
            label: NR2F1
        notes: 'BBSOAS is caused by heterozygous NR2F1 sequence variants or deletions. Whole-gene deletion
          and many truncating or loss-of-function alleles produce haploinsufficiency. DNA-binding-domain
          missense variants can exert an additional dominant-negative effect and are associated with more
          severe neurodevelopmental manifestations, but genotype-phenotype correlations remain preliminary
          and should not be treated as deterministic. Residue 110 lies within the DBD: the p.Phe110del
          indel at the same residue is characterized as a within-DBD variant, and only p.Ala155Thr has
          been described as falling outside it. The de novo p.Phe110Leu missense variant reported in early-onset
          developmental and epileptic encephalopathy is therefore a DBD allele, consistent with the severity
          correlation above rather than an exception to it.'
      selected_evidence:
        snippet: Bosch-Boonstra-Schaaf Optic Atrophy Syndrome (BBSOAS) is an autosomal dominant neurodevelopmental
          disorder caused by loss-of-function variants in NR2F1
        supports: SUPPORT
    origin:
