      assertion_type: Pathophysiology
      assertion:
        name: NR2F1 functional insufficiency and variant-specific dominant-negative effects
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Heterozygous whole-gene deletions and loss-of-function variants reduce functional
          NR2F1 dosage. Pathogenic missense variants in the zinc-finger DNA-binding domain or ligand-binding
          domain reduce transcriptional activity; DNA-binding-domain variants can also interfere with
          wild-type dimer function and are associated with a more severe clinical phenotype. The established
          shared consequence is reduced functional NR2F1 transcriptional output, while the precise contribution
          of dominant-negative activity varies by allele.
        genes:
        - preferred_term: NR2F1
          term:
            id: hgnc:7975
            label: NR2F1
        biological_processes:
        - preferred_term: NR2F1 nuclear receptor transcriptional regulation
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: NR2F1
            term:
              id: hgnc:7975
              label: NR2F1
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous whole-gene deletions, truncating alleles and missense variants. Recorded
            as LOSS_OF_FUNCTION because reduced NR2F1 transcriptional output is the shared consequence
            across the allelic spectrum; a subset of DNA-binding-domain missense alleles additionally
            interfere with wild-type protein (a dominant-negative component), which is described on the
            node rather than recorded as the category.
      selected_evidence:
        snippet: NR2F1 encodes a nuclear receptor protein that regulates transcription. A reporter assay
          showed that missense mutations in the zinc-finger DNA-binding domain and the putative ligand-binding
          domain decrease NR2F1 transcriptional activity.
        supports: SUPPORT
