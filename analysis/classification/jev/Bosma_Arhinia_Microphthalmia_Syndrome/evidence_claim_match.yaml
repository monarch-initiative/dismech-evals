        name: Arrhinencephaly and holoprosencephaly spectrum
        description: Severe midline facial malformations can suggest arrhinencephaly or a holoprosencephaly-spectrum
          disorder. The original BAMS patients instead retained the medial falx attachment and had normal
          intelligence, supporting a distinct developmental pattern with potential for normal cognition.
        distinguishing_features:
        - Preserved medial structure of attachment of the falx cerebri argues against arrhinencephaly
          in the original syndrome.
        - Normal forebrain anatomy and preserved intellectual development favor BAMS over severe holoprosencephaly-spectrum
          disease.
        - Heterozygous SMCHD1 ATPase-domain variation supports BAMS when the phenotype is compatible.
      selected_evidence:
        snippet: These patients do not fall within the spectrum of arrhinencephaly because of the presence
          of medial structure of attachment of the falx cerebri and because of their normal intelligence.
        supports: SUPPORT
