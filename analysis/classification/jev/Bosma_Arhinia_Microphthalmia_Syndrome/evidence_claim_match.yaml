        phase: Neonatal stabilization and feeding adaptation
        age_range: Birth and early infancy
        notes: Complete nasal obstruction can make airway stabilization the immediate priority. Feeding
          coordination may initially require enteral access, training, and adapted equipment. Need for
          intubation or tracheostomy varies, and early reconstructive surgery is not automatically indicated
          when breathing and growth are adequate.
      selected_evidence:
        snippet: An orogastric tube was placed, and drinking training and a special pacifier improved
          coordination and drinking performance.
        supports: SUPPORT
