      assertion_type: Genetic
      assertion:
        name: PNPLA6
        association: Loss of function mutation
        notes: Biallelic (homozygous or compound heterozygous) pathogenic variants in PNPLA6 (19p13.2),
          encoding neuropathy target esterase, cause BNS. Reported variants are predominantly missense,
          with frameshift, splice-altering, and nonsense variants also described; missense/in-frame variants
          are enriched in the catalytic phospholipase/esterase (patatin-like) domain. PNPLA6 is also the
          cause of allelic disorders on the same spectrum, including Gordon Holmes syndrome, Oliver-McFarlane
          syndrome, Laurence-Moon syndrome, and spastic paraplegia type 39.
        gene_term:
          preferred_term: PNPLA6
          term:
            id: hgnc:16268
            label: PNPLA6
      selected_evidence:
        snippet: both mutations (one novel and one known) fell in the phospholipase esterase domain, where
          most pathogenic mutations seem to cluster
        supports: SUPPORT
