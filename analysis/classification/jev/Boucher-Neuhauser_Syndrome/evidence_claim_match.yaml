              label: ataxia-hypogonadism-choroidal dystrophy syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NTE-activity-dependent neurodegeneration of vulnerable tissues
        description: 'Reduced NTE activity disrupts phospholipid remodeling at ER membranes, rendering
          specific neuronal and supporting cell populations vulnerable to age-dependent degeneration:
          cerebellar Purkinje-cell circuits (ataxia), retinal photoreceptors and retinal pigment epithelium
          (chorioretinal dystrophy), and hypothalamic-pituitary neurons (hypogonadotropic hypogonadism
          / anterior hypopituitarism). Overall NTE activity is inversely related to the presence of retinopathy
          and endocrinopathy, defining a genotype:activity:phenotype continuum across PNPLA6 disorders.
          An allelic mouse series recapitulates an NTE activity threshold for retinal degeneration, with
          complete loss being embryonic lethal.'
        cell_types:
        - preferred_term: cerebellar Purkinje cell
          term:
