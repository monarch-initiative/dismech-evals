        biological_scale: CELLULAR
        description: 'Patient lymphoblasts proliferate more slowly and accumulate in G2/M, while patient
          fibroblasts proliferate normally. Homozygous D86G knock-in mouse embryos show dramatically reduced
          cell proliferation, as do autopsy brain and bone marrow from patients, and embryo-derived fibroblasts
          contain many binucleated cells, pointing to a defect in mitotic progression. The defect does
          not appear to run through TP53: TP53 and p21 were not increased in patient lymphoblasts, and
          loss of p53 did not rescue Emg1-null mouse embryos.'
        genes:
        - preferred_term: EMG1
          term:
            id: hgnc:16912
            label: EMG1
        cell_types:
        - preferred_term: lymphoblast
          term:
