      assertion:
        name: Reduced Proliferation of Rapidly Dividing Cells
        biological_scale: CELLULAR
        description: 'Patient lymphoblasts proliferate more slowly and accumulate in G2/M, while patient
          fibroblasts proliferate normally. Homozygous D86G knock-in mouse embryos show dramatically reduced
          cell proliferation, as do autopsy brain and bone marrow from patients, and embryo-derived fibroblasts
          contain many binucleated cells, pointing to a defect in mitotic progression. The defect does
          not appear to run through TP53: TP53 and p21 were not increased in patient lymphoblasts, and
          loss of p53 did not rescue Emg1-null mouse embryos.'
        genes:
        - preferred_term: EMG1
          term:
            id: hgnc:16912
            label: EMG1
        cell_types:
        - preferred_term: lymphoblast
          term:
            id: CL:0017005
            label: lymphoblast
        biological_processes:
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: DECREASED
        - preferred_term: G2/M transition of mitotic cell cycle
          term:
            id: GO:0000086
            label: G2/M transition of mitotic cell cycle
          modifier: DECREASED
        notes: Because the proliferation defect appears not to depend on TP53, this node does not conform
          to the pol1_nucleolar_stress_neural_crest_apoptosis module, whose chain runs through RPL5/RPL11
          sequestration of MDM2 and p53-dependent apoptosis.
      selected_evidence:
        snippet: In BCS patient lymphoblasts, cells accumulated in G2/M, resulting in reduced proliferation
          rates; however, patient fibroblasts showed normal proliferation.
        supports: SUPPORT
