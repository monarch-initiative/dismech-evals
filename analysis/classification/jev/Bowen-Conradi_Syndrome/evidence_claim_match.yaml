        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: DECREASED
        - preferred_term: G2/M transition of mitotic cell cycle
          term:
            id: GO:0000086
            label: G2/M transition of mitotic cell cycle
          modifier: DECREASED
        notes: Because the proliferation defect appears not to depend on TP53, this node does not conform
          to the pol1_nucleolar_stress_neural_crest_apoptosis module, whose chain runs through RPL5/RPL11
          sequestration of MDM2 and p53-dependent apoptosis.
