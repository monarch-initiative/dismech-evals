  3a96fc3c6a2d06cbf52fb3d29926508478fe1ca13b7a218490c04584216d23c0:
    claim:
      about:
        disease:
          name: Bowen-Conradi Syndrome
          disease_term:
            preferred_term: Bowen-Conradi syndrome
            term:
              id: MONDO:0008879
              label: Bowen-Conradi syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: EMG1
        gene_term:
          preferred_term: EMG1
          term:
            id: hgnc:16912
            label: EMG1
        relationship_type: CAUSATIVE
        gene_disease_validity:
        - validity_classification: STRONG
          classified_by: CLINGEN
          external_id: CGGV:assertion_c60e824f-3e52-4e94-9181-d9f7290f6023-2025-05-16T160000.000Z
        variants:
        - name: p.Asp86Gly (D86G)
          description: The Hutterite founder missense variant, reported as NM_006331.6:c.400A>G in the
            gene discovery paper and as c.257A>G in later work from the same group, which uses a different
            reference transcript. It segregated with disease, was absent from 414 non-Hutterite alleles
            and replaces a highly conserved aspartate predicted to form a salt bridge with Arg84. EMG1
            mRNA is normal in patient fibroblasts but EMG1 protein is dramatically reduced.
          type: MISSENSE
        notes: Biallelic EMG1 p.Asp86Gly is the only known cause; ClinGen rates the gene-disease relationship
          Strong (autosomal recessive), noting that only this one founder variant has been scored. The
          ClinGen summary states that the mechanism appears to be gain of function, whereas the primary
          studies describe an unstable, aggregation-prone protein whose levels are severely reduced; functional_impact_category
          is left unset because the two readings have not been reconciled. A complete loss of Emg1 in
          mice is lethal before implantation, so p.Asp86Gly is at most a strongly hypomorphic allele in
          humans.
      selected_evidence:
        snippet: By linkage and haplotype analysis the BCS locus was mapped to a 3.5 cM segment (1.9 Mbp)
          in chromosome region 12p13.3 bounded by F8VWF and D12S397.
        supports: SUPPORT
    origin:
