        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#EMG1
        prompt: Does Bowen-Conradi syndrome occur outside the Hutterite population, and are there disease-causing
          EMG1 variants other than p.Asp86Gly?
        rationale: Several non-Hutterite infants, including an Indian boy, were reported as Bowen-Conradi
          syndrome on clinical grounds before the gene was known, but none was tested for EMG1, and the
          phenotype overlaps trisomy 18 and cerebro-oculo-facial-skeletal syndrome. The genotype-phenotype
          picture, the ClinGen classification and the protein-instability mechanism all rest on one founder
          allele, so a second EMG1 allele would test whether the disease is a general EMG1 deficiency
          or specific to the D86G protein.
      selected_evidence:
        snippet: This is the first case in the literature who is not from the Hutterite population.
        supports: SUPPORT
