            description: Constitutive Emg1 knockout. Homozygous null embryos arrest at the morula stage,
              fail to form a blastocyst, show defective nucleologenesis and early lineage specification
              and degenerate before implantation; no homozygotes are found from E8.5 onwards. Loss of
              p53 does not rescue the arrest.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced Proliferation of Rapidly Dividing Cells
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: CELLULAR
        description: Shows that EMG1 is essential for early embryonic cell growth in a mammal, and that
          the requirement is p53-independent.
        limitations: Complete loss of Emg1 is far more severe than the human hypomorphic genotype, so
          the model shows essentiality rather than the disease-relevant partial deficiency.
        divergences:
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: Embryos die before implantation, so brain growth, postnatal growth and the limb
            and facial features of the human disease cannot be observed.
      selected_evidence:
        snippet: Loss of EMG1 function in mice arrested embryonic development prior to the blastocyst
          stage.
        supports: SUPPORT
