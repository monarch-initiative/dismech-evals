        notes: The only published BDSD allele is a heterozygous 21 bp in-frame deletion in exon 1 that
          contracts the polyalanine tract by seven residues, found in one large Han Chinese family with
          significant linkage to the HOXD13 locus. No ClinGen gene-disease validity assertion exists for
          this pair. Allelic HOXD13 disorders curated separately are Brachydactyly_Type_D, Brachydactyly_Type_E1
          and Split_Hand_Foot_Malformation; HOXD13 polyalanine expansions cause synpolydactyly, and a
          homeodomain substitution reported alongside the BDSD family, p.Q317R, causes syndactyly type
          V.
