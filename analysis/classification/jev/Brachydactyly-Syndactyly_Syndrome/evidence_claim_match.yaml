        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HOXD13 Polyalanine Tract Contraction
        conforms_to: limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
        role: trigger
        biological_scale: MOLECULAR
        description: A heterozygous 21 bp deletion in the imperfect GCN triplet repeat of HOXD13 exon
          1 removes seven residues from the N-terminal polyalanine tract of the HOXD13 homeodomain transcription
          factor. This is the opposite change to the seven-or-more alanine expansions that cause synpolydactyly.
          In cultured cells a seven-alanine-contracted HOXD13 enters the nucleus like the wild type protein,
          whereas expanded forms are retained in cytoplasmic inclusions, so the cytoplasmic aggregation
          proposed for the expansion alleles does not explain this allele. Its effect on HOXD13 target-gene
          regulation has not been measured.
        genetic_context:
          variant_type: deletion
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: UNKNOWN
        gene:
          preferred_term: HOXD13
          term:
            id: hgnc:5136
            label: HOXD13
        molecular_functions:
        - preferred_term: DNA-binding Transcription Factor Activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
      selected_evidence:
        snippet: In the family with complex brachydactyly and syndactyly, we detected a deletion of 21
          bp in the imperfect GCN (where N denotes A, C, G, or T) triplet-containing exon 1 of HOXD13,
          which results in a polyalanine contraction of seven residues.
        supports: SUPPORT
