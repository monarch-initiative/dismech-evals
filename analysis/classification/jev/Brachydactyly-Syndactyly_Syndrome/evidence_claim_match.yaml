          and metatarsal, and leaving incomplete separation of the second and third toes. No study has
          examined limb buds carrying the contraction, so this node records the anatomical level at which
          the lesion acts rather than a measured molecular change.
        biological_processes:
        - preferred_term: Embryonic Digit Morphogenesis
          term:
            id: GO:0042733
            label: embryonic digit morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Our data established the link between HOXD13 and two additional limb phenotypes--syndactyly
          type V and brachydactyly type A4
        supports: SUPPORT
