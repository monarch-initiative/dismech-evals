        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#HOXD13 Polyalanine Tract Contraction
        - pathophysiology#Disturbed HOXD13-Directed Autopod Patterning
        prompt: How does a seven-residue contraction of the HOXD13 polyalanine tract alter autopod patterning,
          given that the contracted protein reaches the nucleus normally?
        rationale: The expansion alleles that cause synpolydactyly are explained by cytoplasmic aggregation
          and altered transcriptional condensates, but contracted HOXD13 shows wild type nuclear localization
          in cultured cells, so that explanation does not carry over. No study has measured target-gene
          binding or expression for the contracted protein, and the causal edge from the allele to the
          digit phenotype in this entry is therefore recorded with unknown intermediates.
      selected_evidence:
        snippet: There was no significant relationship between PAC mutations and the entering into the
          nucleus.
        supports: SUPPORT
