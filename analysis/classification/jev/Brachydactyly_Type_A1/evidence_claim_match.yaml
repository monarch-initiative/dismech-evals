  1795db2377000f9244238db48b299303f806fa479b57ec8bbeb3855c532f23a8:
    claim:
      about:
        disease:
          name: Brachydactyly Type A1
          disease_term:
            preferred_term: brachydactyly type A1
            term:
              id: MONDO:0007215
              label: brachydactyly type A1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failed Interphalangeal Joint Cavitation from Suppressed Interzone Apoptosis
        role: central_effector
        biological_scale: CELLULAR
        description: 'A 2024 mouse study reframes what the missing middle phalanx in BDA1 actually is.
          Using an Ihh E95K knock-in, it shows the bone is not simply too small: the developing interphalangeal
          joint fails to cavitate, so two segments stay fused as one and the middle phalanx never appears
          as a separate element. The proximate cause is loss of apoptosis in the joint interzone. The
          proposed mechanism inverts the usual reading of a hedgehog signalling defect - IHH is normally
          kept *low* at the centre of the interzone, which leaves its interacting partners CDON and GAS1
          ligand-free to act as dependence receptors and trigger the cell death that separates the segments.
          A BDA1 allele raises IHH there, the dependence receptors are occupied, apoptosis is suppressed,
          and cavitation fails.

          This is why BDA1 pairs shortening with symphalangism rather than producing one or the other,
          and it makes the node mechanistically continuous with the joint-formation failures of the other
          brachydactylies (NOG in type B2, GDF5 at the interzone in type C).

          '
        gene:
          preferred_term: IHH
          term:
            id: hgnc:5956
            label: IHH
        biological_processes:
        - preferred_term: Apoptotic Process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: DECREASED
        - preferred_term: Embryonic Skeletal Limb Joint Morphogenesis
          term:
            id: GO:0036023
            label: embryonic skeletal limb joint morphogenesis
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: Here, we use a mouse model of brachydactyly type A1 (BDA1) with an IhhE95K mutation,
          to show that a missing middle phalangeal bone is due to the failure of the developing joint
          to cavitate, associated with reduced apoptosis, and a joint is not formed.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
