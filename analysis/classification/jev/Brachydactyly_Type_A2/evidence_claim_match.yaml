      assertion:
        name: Reduced BMP/SMAD Output in the Digital Chondrogenic Condensation
        conforms_to: limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification
        role: central_effector
        biological_scale: CELLULAR
        description: 'Digital rays form from a continuous prechondrogenic mesenchymal condensation that
          segments into phalanges and metacarpals, with growth at the distal end. BMP/GDF5 signalling
          through BMPR1B controls both chondrocyte differentiation within the condensation and the position
          of the interphalangeal joints, which is why brachydactyly and abnormal interdigital joint formation
          travel together across types A-C. Lowering the signal shortens the segment that is forming when
          the deficit bites.

          '
        biological_processes:
        - preferred_term: Chondrocyte Differentiation
          term:
            id: GO:0002062
            label: chondrocyte differentiation
          modifier: DECREASED
        - preferred_term: Embryonic Digit Morphogenesis
          term:
            id: GO:0042733
            label: embryonic digit morphogenesis
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Prechondrogenic Mesenchymal Cell
          term:
            id: CL:0008019
            label: mesenchymal cell
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: Thus, BD types A-C have certain overlapping features including hypoplasia/aplasia of
          phalanges and abnormal interdigital joint formation, suggesting that the formation of joints
          and phalanges are linked on a developmental and molecular basis.
        supports: SUPPORT
