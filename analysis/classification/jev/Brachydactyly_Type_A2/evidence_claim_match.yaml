        affected_regions:
        - name: BMP2 downstream limb-enhancer region
          chromosomal_region: 20p12.3
          regulatory_element_type: ENHANCER
          description: Conserved noncoding region approximately 110 kb downstream of BMP2, encompassing
            the enhancer-bearing interval duplicated in the two reported families. The name denotes the
            regulatory region rather than one fixed patient-specific interval.
        notes: 'A regional regulatory association: overlapping microduplications were identified in two
          families without a BMPR1B or GDF5 coding variant. The homologous mouse sequence has limb enhancer
          activity, while the expression effect of the human duplications remains inferred.'
        variants:
        - name: Dathe 2009 family 1 BMP2 enhancer microduplication
          variant_type: duplication
          genomic_contexts:
          - intergenic region
          regulatory_target_gene:
            preferred_term: BMP2
            term:
              id: hgnc:1069
              label: BMP2
          affected_regions:
          - name: BMP2 downstream limb-enhancer region
            chromosomal_region: 20p12.3
            regulatory_element_type: ENHANCER
            description: Conserved enhancer-bearing noncoding interval approximately 110 kb downstream
              of BMP2.
          description: The first BDA2 family in Dathe et al. had a noncoding microduplication reported
            in the abstract as approximately 5.5 kb, downstream of BMP2. The linked 20p12.3 locus was
            investigated after coding analysis had failed to identify the cause. BMP2 is the proposed
            regulatory target, not a gene whose coding sequence is duplicated.
          functional_effects:
          - function: Proposed alteration of developmental BMP2 regulation
            regulatory_element_type: ENHANCER
            regulatory_mechanism: Copy-number gain of a limb enhancer
            affected_developmental_stage: Embryonic limb development
            description: The homologous mouse region drives limb reporter expression overlapping endogenous
              Bmp2. This does not measure the expression consequence of the human duplication, so no expression-pattern
              category or directional SMAD effect is assigned.
        - name: Dathe 2009 family 2 BMP2 enhancer microduplication
          variant_type: duplication
          genomic_contexts:
          - intergenic region
          regulatory_target_gene:
            preferred_term: BMP2
            term:
              id: hgnc:1069
              label: BMP2
          affected_regions:
          - name: BMP2 downstream limb-enhancer region
            chromosomal_region: 20p12.3
            regulatory_element_type: ENHANCER
            description: Enhancer-bearing region also overlapped by the independently detected second-family
              duplication.
          description: A similar downstream duplication was detected by qPCR in a second BDA2 family.
            It is represented separately from the first-family allele without assuming identical breakpoints
            or an experimentally established change in patient BMP2 expression.
      selected_evidence:
        snippet: A microduplication of approximately 5.5 kb in a noncoding sequence approximately 110
          kb downstream of BMP2 was detected.
        supports: SUPPORT
