            biological_scale: MOLECULAR
            description: 'BMPR1B is a type I transmembrane serine/threonine kinase that, with a type II
              receptor, transduces BMP and GDF5 signals to SMAD transcription factors. BDA2-associated
              missense variants fall either in the glycine/serine (GS) domain that must be transphosphorylated
              for receptor activation (I200K, kinase-deficient) or in a conserved region C-terminal to
              the kinase domain (R486W, kinase-competent). Both act on cartilage formation in a dominant-negative
              fashion rather than by simple haploinsufficiency, which is why two mechanistically different
              lesions produce the same digit phenotype.

              '
