      assertion:
        name: Defective proGDF5 Processing
        conforms_to: limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
        role: trigger
        biological_scale: MOLECULAR
        description: 'GDF5 is the preferred ligand of BMPR1B and is synthesised as a precursor that must
          be cleaved at a dibasic site to release the mature growth factor from its prodomain. The BDA2-associated
          R380Q substitution sits at that processing site. The mutant protein is still secreted but is
          not cleaved by chondrogenic cells, and unprocessed proGDF5 is virtually inactive — so the lesion
          reduces the amount of active ligand available to BMPR1B without abolishing the gene product.

          '
        gene:
          preferred_term: GDF5
          term:
            id: hgnc:4220
            label: GDF5
        biological_processes:
        - preferred_term: Protein Processing
          term:
            id: GO:0016485
            label: protein processing
          modifier: DECREASED
        - preferred_term: BMP Signaling Pathway
          term:
            id: GO:0030509
            label: BMP signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: We investigated a family with a brachydactyly type A2 and identified a heterozygous arginine
          to glutamine (R380Q) substitution in the growth/differentiation factor 5 (GDF5) in all affected
          individuals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
