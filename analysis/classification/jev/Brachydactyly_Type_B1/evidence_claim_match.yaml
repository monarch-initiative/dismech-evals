        role: consequence
        biological_scale: TISSUE
        description: 'The realised malformation. Distal phalanges and nails of digits II-V are hypoplastic
          or absent, with variable middle-phalanx hypoplasia and distal or proximal symphalangism; thumbs
          and halluces are spared but often broad or partially duplicated. The deficit is symmetric, worse
          on the ulnar than the radial side, and milder in the feet than the hands. Because nail and distal
          phalanx develop as one apical unit, anonychia accompanies the bony deficiency rather than being
          a separate ectodermal disease.

          '
        biological_processes:
        - preferred_term: Limb Morphogenesis
          term:
            id: GO:0035108
            label: limb morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: readily distinguished from other brachydactylies by the characteristic shortening/hypoplasia
          of the distal phalanges, the occurrences of nail dysplasia, hypoplasia of middle phalanges,
          and variable degrees of distal and proximal symphalangism.
        supports: SUPPORT
