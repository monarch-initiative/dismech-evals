      assertion_type: Pathophysiology
      assertion:
        name: Truncated ROR2 Receptor with a Specific Mutational Effect
        conforms_to: limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
        role: trigger
        biological_scale: MOLECULAR
        description: 'ROR2 is a 943-residue orphan receptor tyrosine kinase that acts as a co-receptor
          for WNT5A. BDB1 alleles are nonsense, frameshift, or splice variants confined to two narrow
          windows flanking the intracellular tyrosine kinase domain, removing part or all of the intracellular
          portion of the protein. Two lines of evidence show this is not haploinsufficiency: individuals
          heterozygous for 9q22 deletions that remove ROR2 entirely have no BDB, and Ror2 heterozygous
          null mice are normal. The truncated receptor is therefore doing something a missing receptor
          does not — the localised clustering of the alleles points to a specific gain of function or
          dominant-interfering effect. Position within the window grades severity: distal truncations
          produce a more severe phenotype than proximal ones.

          '
        gene:
          preferred_term: ROR2
          term:
            id: hgnc:10257
            label: ROR2
        biological_processes:
        - preferred_term: Non-canonical Wnt Signaling Pathway
          term:
            id: GO:0035567
            label: non-canonical Wnt signaling pathway
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Prechondrogenic Mesenchymal Cell
          term:
            id: CL:0008019
            label: mesenchymal cell
        genetic_context:
          gene:
            preferred_term: ROR2
            term:
              id: hgnc:10257
              label: ROR2
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: 'Heterozygous truncating ROR2 alleles clustered immediately proximal or distal
            to the tyrosine kinase domain. Recorded as GAIN_OF_FUNCTION: the truncated receptor is proposed
            to confer a specific new activity, and whole-gene ROR2 deletions do not produce brachydactyly,
            so simple haploinsufficiency is excluded.'
      selected_evidence:
        snippet: We identified distinct heterozygous mutations (2 nonsense, 1 frameshift) within a 7-amino-acid
          segment of the 943-amino-acid protein, all of which predict truncation of the intracellular
          portion of the protein immediately after the tyrosine kinase domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
