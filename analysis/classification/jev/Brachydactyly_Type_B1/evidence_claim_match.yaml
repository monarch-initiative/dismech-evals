  bd8d772f2193e3e7024746bf7ed8d44f6eb254af8e60f9e309120310d6ee7fcc:
    claim:
      about:
        disease:
          name: Brachydactyly Type B1
          disease_term:
            preferred_term: brachydactyly type B1
            term:
              id: MONDO:0007220
              label: brachydactyly type B1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical-radiographic and molecular diagnosis
        description: Recognised clinically by terminal deficiency of digits II-V with absent or dysplastic
          nails and spared but broad thumbs; hand and foot radiographs show distal (and variably middle)
          phalangeal hypoplasia with symphalangism. Confirmation is by ROR2 sequencing. Because BDB1 alleles
          cluster in two narrow windows, an ROR2 whole-gene deletion found on array is evidence against
          BDB rather than for it, and an ROR2-negative patient with proximal symphalangism and carpal
          synostosis should be tested for NOG (type B2).
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: Hypoplastic or absent distal phalanges and nails of digits II-V with spared thumbs, plus
          a truncating ROR2 variant flanking the tyrosine kinase domain.
      selected_evidence:
        snippet: In a subset of ROR2-negative patients with BDB, clinically defined by the additional
          occurrence of proximal symphalangism and carpal synostosis, we identified six different point
          mutations (P35A, P35S, A36P, E48K, R167G, and P187S) in the bone morphogenetic protein (BMP)
          antagonist NOGGIN (NOG).
        supports: SUPPORT
    origin:
