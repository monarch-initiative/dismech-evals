        conforms_to: limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification
        role: central_effector
        biological_scale: CELLULAR
        description: 'WNT5A/ROR2 can feed several non-canonical branches; mouse genetics implicates the
          planar cell polarity (PCP) branch in the limb. Mutation of the PCP gene Vangl2 produces digit
          defects that resemble BDB1, including loss of phalanges, and lowering Wnt5a dosage in Vangl2
          mutants worsens them. Mechanistically, PCP loss changes the shape of the early limb bud and
          of the digit pre-chondrogenic condensates — wider, thicker, shorter — and perturbs the FGF/BMP
          balance that regulates limb growth. That an aberrant increase in BMP signalling is the proximate
          cause of the brachydactyly is supported by the rescue: halving Bmp4 dosage partially suppresses
          the phalangeal loss. This is where the ROR2 and BMP-pathway brachydactylies converge.

          '
        biological_processes:
