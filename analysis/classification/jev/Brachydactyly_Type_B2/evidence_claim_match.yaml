          hits two things at once: segments fail to form distally (brachydactyly) and joints fail to cavitate
          proximally (symphalangism, carpal synostosis). The clinical combination in BDB2 — proximal joint
          fusion together with terminal digital deficiency — is the human read-out of that dual effect,
          and the authors read it as evidence that the ROR2 and BMP receptor pathways are functionally
          connected, plausibly via a heteromeric receptor complex at the cell surface.

          '
        biological_processes:
        - preferred_term: BMP Signaling Pathway
          term:
            id: GO:0030509
            label: BMP signaling pathway
          modifier: DYSREGULATED
        - preferred_term: Chondrocyte Differentiation
          term:
            id: GO:0002062
            label: chondrocyte differentiation
          modifier: ABNORMAL
        - preferred_term: Embryonic Digit Morphogenesis
          term:
            id: GO:0042733
            label: embryonic digit morphogenesis
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: Prechondrogenic Mesenchymal Cell
          term:
            id: CL:0008019
            label: mesenchymal cell
      selected_evidence:
        snippet: These studies have shown that the BMP pathway plays a pivotal role in the normal development
          of digits and joints and that the majority of brachydactyly disease genes are directly or indirectly
          linked to this pathway.
        supports: SUPPORT
