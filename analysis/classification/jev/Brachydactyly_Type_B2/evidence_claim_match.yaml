            role: trigger
            biological_scale: MOLECULAR
            description: 'NOGGIN is a secreted antagonist that sequesters BMPs and GDFs, setting the level
              of BMP signal a tissue receives. Loss-of-function NOG alleles cause joint-fusion phenotypes
              — proximal symphalangism, multiple synostoses, stapes ankylosis — but not brachydactyly.
              The BDB2 variants behave differently: free-binding-energy calculations for the modelled
              NOG-GDF5 complex and micromass functional assays do not indicate a major loss of function,
              so the interpretation is a subtle shift in which ligands NOG binds and how tightly, tilting
              the BMP balance rather than removing the brake. That distinction is what explains why these
              alleles add terminal digital deficiency to the familiar NOG joint phenotype.

              '
