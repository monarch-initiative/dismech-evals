              label: brachydactyly type C
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced GDF5-BMPR1B Signaling in the Digital Ray and Interzone
        conforms_to: limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification
        role: central_effector
        biological_scale: CELLULAR
        description: 'GDF5 is expressed in the joint interzone and controls both chondrocyte differentiation
          in the digital ray and the segmentation that separates phalanges. Lowering it disturbs the segmentation
          program in two directions at once, which is why BDC uniquely pairs missing middle-phalangeal
          length with supernumerary phalangeal segments: some interzones fail to make a normal segment,
          while others produce an extra, malformed one. GDF5 is also the BDA2 and (in semidominant families)
          the BDA1 gene, so the type of brachydactyly tracks the allele''s specific effect on ligand maturation
          and receptor affinity rather than the identity of the gene.

          '
        biological_processes:
        - preferred_term: Chondrocyte Differentiation
          term:
            id: GO:0002062
            label: chondrocyte differentiation
          modifier: DECREASED
        - preferred_term: Embryonic Digit Morphogenesis
          term:
            id: GO:0042733
            label: embryonic digit morphogenesis
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        - preferred_term: Prechondrogenic Mesenchymal Cell
          term:
            id: CL:0008019
            label: mesenchymal cell
      selected_evidence:
        snippet: BDC is characterized by brachymesophalangia of the second, third, and fifth fingers,
          sometimes together with hyperphalangia, usually of the second and third fingers.
        supports: SUPPORT
    origin:
