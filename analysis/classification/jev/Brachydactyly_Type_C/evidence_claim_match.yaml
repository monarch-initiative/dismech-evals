      assertion_type: Pathophysiology
      assertion:
        name: GDF5 Functional Haploinsufficiency
        conforms_to: limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
        role: trigger
        biological_scale: MOLECULAR
        description: 'GDF5 (CDMP1) is a secreted BMP-family ligand that acts through BMPR1B to drive chondrocyte
          differentiation and joint formation. BDC alleles are heterozygous frameshift, nonsense, and
          active-domain missense variants. Truncating alleles simply remove a functional copy; the missense
          alleles reach the same endpoint by a different route, failing to form the disulfide-linked dimers
          that the mature growth factor requires. Both converge on functional haploinsufficiency — roughly
          half the normal GDF5 activity — which distinguishes BDC from the dominant-negative BMPR1B alleles
          of type A2 and from the processing-site GDF5 allele that also causes A2.

          '
        gene:
          preferred_term: GDF5
          term:
            id: hgnc:4220
            label: GDF5
        biological_processes:
        - preferred_term: BMP Signaling Pathway
          term:
            id: GO:0030509
            label: BMP signaling pathway
          modifier: DECREASED
        - preferred_term: SMAD Protein Signal Transduction
          term:
            id: GO:0060395
            label: SMAD protein signal transduction
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: GDF5
            term:
              id: hgnc:4220
              label: GDF5
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Heterozygous GDF5 frameshift, nonsense and missense alleles. Recorded as LOSS_OF_FUNCTION:
            the mutational spectrum is dominated by truncating alleles and the disorder is attributed
            to functional haploinsufficiency for GDF5.'
      selected_evidence:
        snippet: Heterozygous mutations in GDF5, which maps to human chromosome 20, occur in individuals
          with autosomal dominant brachydactyly type C (BDC).
        supports: SUPPORT
