      assertion_type: Genetic
      assertion:
        name: 7p15 Susceptibility Locus
        association: Linkage to a combined BDD/BDE phenotype
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        notes: A variance-components genome scan of 1,722 genotyped members of a Nepali extended pedigree
          found significant linkage of the combined BDD/BDE trait to 7p21-7p14, peaking at 7p15 — away
          from the HOXD cluster on 2q31. Candidate genes in the interval include TWIST and the HOXA cluster.
          The causal variant has not been identified, so this is a mapped locus rather than a gene.
      selected_evidence:
        snippet: Possible positional candidate genes in the one-lod support interval of this QTL include
          TWIST and the HOXA1-A13 cluster.
        supports: SUPPORT
