      assertion_type: Pathophysiology
      assertion:
        name: Premature Closure of the Thumb Distal Phalangeal Epiphysis
        conforms_to: limb_digit_patterning_serial_homology#Disrupted Digit Number and Identity Specification
        role: central_effector
        biological_scale: TISSUE
        description: 'Unlike the type A-C brachydactylies, in which a phalangeal segment fails to form
          or to segment properly, the type D thumb has all its segments — the distal phalanx simply stops
          growing early. Investigations attribute the short distal phalanx to early closure of its epiphysis;
          the base of the shortened phalanx is broader than the proximal phalangeal surface it articulates
          with, and the distal end is often hyperplastic. The mechanism is therefore one of growth-plate
          timing in a single skeletal element rather than of segment specification.

          '
        biological_processes:
        - preferred_term: Endochondral Ossification
          term:
            id: GO:0001958
            label: endochondral ossification
          modifier: ABNORMAL
        - preferred_term: Chondrocyte Proliferation
          term:
            id: GO:0035988
            label: chondrocyte proliferation
          modifier: DECREASED
        cell_types:
        - preferred_term: Chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
      selected_evidence:
        snippet: Other investigations confirmed that the short distal pha- lanx of the thumb results from
          early closure of its epiphy- ses.
        supports: SUPPORT
