      assertion:
        name: Altered HOXD13 Homeodomain DNA Binding
        conforms_to: limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
        role: trigger
        biological_scale: MOLECULAR
        description: 'HOXD13 is the most 5'' gene of the HOXD cluster and encodes a homeodomain transcription
          factor that patterns the autopod. Most HOXD13 disease alleles are polyalanine expansions or
          frameshifts causing synpolydactyly; the two substitutions associated with type D and type E
          phenotypes instead sit inside the homeodomain itself. In vitro, Ile314Leu — at homeodomain position
          47 — does not simply lose DNA binding but rebalances it, gaining affinity for a TTAC core target
          while losing affinity for TTAT. A mixed gain and loss of target selectivity, rather than a dosage
          change, is what distinguishes this allele class from the synpolydactyly alleles of the same
          gene.

          '
        gene:
          preferred_term: HOXD13
          term:
            id: hgnc:5136
            label: HOXD13
        biological_processes:
        - preferred_term: Regulation of Transcription by RNA Polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DYSREGULATED
        molecular_functions:
        - preferred_term: DNA-binding Transcription Factor Activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: Here, we describe two mutations of HOXD13 (923C-->G encoding Ser308Cys and 940A-->C encoding
          Ile314Leu) that cause missense substitutions within the homeodomain.
        supports: SUPPORT
