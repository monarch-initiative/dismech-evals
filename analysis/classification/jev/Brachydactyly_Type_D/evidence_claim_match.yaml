        role: central_effector
        biological_scale: TISSUE
        description: 'Unlike the type A-C brachydactylies, in which a phalangeal segment fails to form
          or to segment properly, the type D thumb has all its segments — the distal phalanx simply stops
          growing early. Investigations attribute the short distal phalanx to early closure of its epiphysis;
          the base of the shortened phalanx is broader than the proximal phalangeal surface it articulates
          with, and the distal end is often hyperplastic. The mechanism is therefore one of growth-plate
          timing in a single skeletal element rather than of segment specification.

          '
        biological_processes:
