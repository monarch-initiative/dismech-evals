        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered HOXD13 Homeodomain Function
        conforms_to: limb_digit_patterning_serial_homology#Limb Patterning Signal Perturbation
        role: trigger
        biological_scale: MOLECULAR
        description: 'HOXD13, the most 5'' gene of the HOXD cluster, encodes a homeodomain transcription
          factor that patterns the autopod. The alleles associated with isolated BDE are of two kinds:
          homeodomain missense substitutions, of which Ile314Leu at homeodomain position 47 has been shown
          to shift DNA-binding preference between related target sequences rather than abolish it, and
          truncating nonsense alleles such as p.E181X and p.R274X. Both classes are distinct from the
          polyalanine expansions and frameshifts that dominate the HOXD13 mutation spectrum and cause
          synpolydactyly — the same gene reaches a different limb phenotype through a different kind of
          lesion.

          '
        gene:
          preferred_term: HOXD13
          term:
            id: hgnc:5136
            label: HOXD13
        biological_processes:
        - preferred_term: Regulation of Transcription by RNA Polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DYSREGULATED
        molecular_functions:
        - preferred_term: DNA-binding Transcription Factor Activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: ABNORMAL
      selected_evidence:
        snippet: So far, only two missense HOXD13 substitutions (p.S308C and p.I314L), localized within
          the homeodomain of the HOXD13 transcription factor, as well as a single nonsense mutation (p.E181X)
          were associated with BDE.
        supports: SUPPORT
