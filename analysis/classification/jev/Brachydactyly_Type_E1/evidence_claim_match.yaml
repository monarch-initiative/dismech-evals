      reference_title: Establishing an algorithm for molecular genetic diagnostics in Chinese children
        with brachydactyly type E.
      evidence_source: HUMAN_CLINICAL
      explanation: In an unselected radiographic BDE cohort the solved cases were mostly syndromic genes,
