            term:
              id: MONDO:0007223
              label: brachydactyly type E1
        context: []
      assertion_type: Prevalence
      assertion:
        population: Reported families worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: UNKNOWN
        notes: 'Isolated BDE is rare and the HOXD13-related form is rarer still: at the time of the fourth
          reported allele, only four HOXD13 mutations had been associated with typical isolated BDE.'
      selected_evidence:
        snippet: 'Brachydactyly type E (BDE; MIM#113300) is characterized by shortening of the metacarpal,
          metatarsal, and often phalangeal bones, and predominantly affects postaxial ray(s) of the limb.
          BDE may occur as an isolated trait or as part of a syndrome. Isolated BDE is rare and in the
          majority of cases the molecular pathogenesis has so far not been resolved. Originally, the molecular
          cause of isolated BDE has been unravelled in 2 families and shown to result from heterozygous
          missense mutations in the homeodomain of the HOXD13 gene. Since the initial manuscript, one
          further HOXD13 mutation has been reported only in a single family manifesting isolated BDE.
          CASE PRESENTATION: In this paper, we report on a Polish family exhibiting isolated BDE caused
          by a novel nonsense heterozygous HOXD13 mutation. ... The variant p.R274X identified in our
          proband is the fourth HOXD13 mutation, and the second truncating (nonsense) mutation, reported
          to result in typical isolated BDE.'
        supports: SUPPORT
    origin:
