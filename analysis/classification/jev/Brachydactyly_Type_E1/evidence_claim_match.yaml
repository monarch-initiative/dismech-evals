      evidence_source: HUMAN_CLINICAL
      explanation: 'Quantifies the payoff of sequencing by phenotype: isolated BDE is mostly unsolved,
        while any accompanying feature quadruples the yield - which is what makes "is this brachydactyly
        really isolated?" the decisive question.'
