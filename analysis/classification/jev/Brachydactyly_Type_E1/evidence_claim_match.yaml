  a824c1c311a446b0aadd92dff85e1ede3e2c0252823a80f4702c91d621d1381b:
    claim:
      about:
        disease:
          name: Brachydactyly Type E1
          disease_term:
            preferred_term: brachydactyly type E1
            term:
              id: MONDO:0007223
              label: brachydactyly type E1
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical-radiographic and molecular diagnosis
        description: 'Hand and foot radiographs show variably shortened metacarpals and metatarsals with
          near-normal phalanges; the metacarpal sign detects fourth-ray shortening at the bedside. The
          diagnostic work is mostly exclusion: the same hand occurs in Albright hereditary osteodystrophy,
          in Turner syndrome, in 2q37 deletion, and with PTHLH mutations, so isolated BDE is a diagnosis
          reached after those are excluded. HOXD13 sequencing confirms the type E1 form when positive,
          but is negative in most isolated BDE.'
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: Short metacarpals with preserved phalangeal length and a positive metacarpal sign, with
          a heterozygous HOXD13 variant when molecularly solved.
      selected_evidence:
        snippet: GNAS mutations were the leading cause (four cases), followed by EXT1 and ACAN defects.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/4
      context_paths:
