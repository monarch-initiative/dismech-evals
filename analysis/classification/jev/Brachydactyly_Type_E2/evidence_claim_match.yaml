          modifier: DYSREGULATED
      selected_evidence:
        snippet: We studied a family with autosomal-dominant Brachydactyly Type E (BDE) and identified
          a t(8;12)(q13;p11.2) translocation with breakpoints (BPs) upstream of PTHLH on chromosome 12p11.2
          and a disrupted KCNB2 on 8q13.
        supports: SUPPORT
