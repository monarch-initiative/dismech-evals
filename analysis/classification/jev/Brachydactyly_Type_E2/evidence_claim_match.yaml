        description: 'Two families carry balanced translocations, t(8;12)(q13;p11.2) and t(4;12)(q13.2-13.3;p11.2),
          with breakpoints outside PTHLH. Neither disrupts the coding sequence; both lower PTHLH expression
          by breaking its regulatory landscape, including a long-range element on 12q that contacts PTHLH
          in cis over 24.4 Mb and SOX9 in trans and carries a long noncoding RNA. Patient fibroblasts
          differentiated into chondrogenic cells show reduced PTHLH and impaired chondrogenic differentiation,
          so the regulatory lesion converges on the same dosage reduction as the coding alleles.

          '
        genes:
        - preferred_term: PTHLH
