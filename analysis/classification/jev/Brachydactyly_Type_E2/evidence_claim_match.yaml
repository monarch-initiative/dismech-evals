        context:
        - path: /pathophysiology/0
          value:
            name: PTHLH Loss of Function
            role: trigger
            biological_scale: MOLECULAR
            description: 'Heterozygous loss of PTHLH function. The allele spectrum is all loss-of-function:
              whole-gene and contiguous deletions, nonsense and frameshift variants, a nonstop extension,
              initiation-codon and signal-peptide variants (p.L15R impairs signal-peptide cleavage), and
              missense variants in the N-terminal PTH-like domain, of which L60P was shown to lose function
              in chicken micromass culture. That deletions and truncations give the same phenotype as
              the point mutations is the argument for haploinsufficiency. Duplications of PTHLH cause
              different disorders (enchondromatosis, acro-osteolysis, a combined type E/A1 osteochondroplasia)
              and are outside this entry.

              '
            genes:
            - preferred_term: PTHLH
              term:
                id: hgnc:9607
                label: PTHLH
            molecular_functions:
            - preferred_term: Hormone Activity
              term:
                id: GO:0005179
                label: hormone activity
              modifier: DECREASED
            - preferred_term: PTH1R Binding
              term:
                id: GO:0031857
                label: type 1 parathyroid hormone receptor binding
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failed Formation of the Tooth Eruption Pathway
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Loss of PTHrP from the enamel epithelium removes the signal that drives osteoclastic
          clearing of bone over the erupting tooth. Shown in mice lacking PTHrP outside cartilage; whether
          heterozygous loss in humans acts the same way is inferred from the shared phenotype.
      selected_evidence:
        snippet: The replacement of PTHrP expression in the enamel epithelium with a keratin 14-driven
          transgene corrects the defect in bone resorption and restores the normal program of tooth eruption.
        supports: SUPPORT
        directness: INDIRECT
