      assertion_type: Pathophysiology
      assertion:
        name: Reduced PTHrP Signaling to Growth-Plate Chondrocytes
        role: central_effector
        biological_scale: CELLULAR
        description: 'In the growth plate, prehypertrophic chondrocytes secrete Indian hedgehog, which
          induces PTHrP in the periarticular perichondrium and resting chondrocytes; PTHrP acts through
          PTH1R on prehypertrophic chondrocytes to keep them proliferating and to delay hypertrophy. This
          negative feedback loop sets how long a chondrocyte column keeps growing. Mice heterozygous for
          a Pthrp null allele show that the loop is dosage-sensitive: they are normal at birth but develop
          bone abnormalities postnatally, while circulating PTH and calcium stay normal, which matches
          the normal mineral biochemistry of affected people.

          '
        cell_types:
        - preferred_term: Prehypertrophic Chondrocyte
          term:
            id: CL:0020022
            label: prehypertrophic chondrocyte
        biological_processes:
        - preferred_term: PTH1R (Gs-coupled) Receptor Signaling
          term:
            id: GO:0007189
            label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Analysis of PTHrP (-/-) mutant mice indicated that the PTHrP protein signals to its receptor
          in the prehypertrophic chondrocytes, thereby blocking hypertrophic differentiation.
        supports: SUPPORT
