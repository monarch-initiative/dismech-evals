              label: brachydactyly type E2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PTHLH Loss of Function
        role: trigger
        biological_scale: MOLECULAR
        description: 'Heterozygous loss of PTHLH function. The allele spectrum is all loss-of-function:
          whole-gene and contiguous deletions, nonsense and frameshift variants, a nonstop extension,
          initiation-codon and signal-peptide variants (p.L15R impairs signal-peptide cleavage), and missense
          variants in the N-terminal PTH-like domain, of which L60P was shown to lose function in chicken
          micromass culture. That deletions and truncations give the same phenotype as the point mutations
          is the argument for haploinsufficiency. Duplications of PTHLH cause different disorders (enchondromatosis,
          acro-osteolysis, a combined type E/A1 osteochondroplasia) and are outside this entry.

          '
        genes:
        - preferred_term: PTHLH
          term:
            id: hgnc:9607
            label: PTHLH
        molecular_functions:
        - preferred_term: Hormone Activity
          term:
            id: GO:0005179
            label: hormone activity
          modifier: DECREASED
        - preferred_term: PTH1R Binding
          term:
            id: GO:0031857
            label: type 1 parathyroid hormone receptor binding
          modifier: DECREASED
      selected_evidence:
        snippet: In a large pedigree with BDE, short stature, and learning disabilities, we detected a
          microdeletion of approximately 900 kb encompassing PTHLH, the gene coding for parathyroid hormone
          related protein (PTHRP).
        supports: SUPPORT
