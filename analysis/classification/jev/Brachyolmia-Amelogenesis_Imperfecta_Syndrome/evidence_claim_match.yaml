  436a1adf1aa58f8ccd710ea0398bdb941bc5ed6350dcfac065cee0f52aec6699:
    claim:
      about:
        disease:
          name: Brachyolmia-Amelogenesis Imperfecta Syndrome
          disease_term:
            preferred_term: brachyolmia-amelogenesis imperfecta syndrome
            term:
              id: MONDO:0011018
              label: brachyolmia-amelogenesis imperfecta syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Secretory Ameloblast Function
        biological_scale: CELLULAR
        description: 'Ltbp3 is transcribed by differentiating ameloblasts and odontoblasts, with transcripts
          at the apical secretory pole of the ameloblast - the end of the cell that builds enamel. The
          ultrastructural phenotype in patients points at a specific step: the initial aprismatic layer
          at the dentine-enamel junction is absent, a thin irregular prismatic shell is laid down instead,
          and non-prismatic enamel then appears in patches on top. That pattern implicates the formation
          and modulation of Tomes'' process, the secretory specialisation that determines prism architecture,
          rather than a general failure to secrete matrix. Dentine was normal on ultrastructural examination
          in the founding family, which is what makes the defect ameloblast-specific rather than a mineralisation
          defect of the whole tooth - but abnormal dentine has since been reported in a later family,
          so that specificity is not absolute.

          '
        cell_types:
        - preferred_term: ameloblast
          term:
            id: CL:0000059
            label: ameloblast
        biological_processes:
        - preferred_term: amelogenesis
          modifier: DECREASED
