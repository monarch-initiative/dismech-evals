              label: brachyolmia-amelogenesis imperfecta syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Latent TGF-beta Matrix Targeting and Activation
        biological_scale: MOLECULAR
        description: 'LTBP3 is one of four LTBP/fibrillin-family proteins. Through its eight-cysteine
          TB domains it forms a large complex with latent TGF-beta 1, 2 and 3, and it is this complex
          that anchors the growth factor in the extracellular matrix where it can later be activated.
          The functional consequence of removing LTBP3 is therefore not loss of a structural fibre but
          loss of a reservoir: less TGF-beta is positioned for release, so less signalling reaches the
          cells that need it.

          '
        biological_processes:
        - preferred_term: extracellular matrix organization
          modifier: DECREASED
          term:
            id: GO:0030198
            label: extracellular matrix organization
        - preferred_term: transforming growth factor beta receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
      selected_evidence:
        snippet: LTBP3 codes for a protein of the extracellular matrix that is involved in regulation
          of TGF-beta secretion, trapping and activation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
