        - animal_models#Mouse
        prompt: Why do Ltbp3-null mice fail to develop the platyspondyly seen in human LTBP3 disease?
        rationale: The null mouse reproduces enamel and maxillary abnormalities but not vertebral flattening.
          Human bone density varies, so density does not supply a universal opposite-direction mismatch.
          Allele-specific residual function, developmental timing, biomechanics and functions beyond TGF-beta
          regulation remain plausible explanations.
        proposed_experiments:
        - experiment_id: ltbp3_allele_knockin_axial
          name: Compare patient-allele knock-ins with null mice
          description: Measure transcript and protein effects of selected patient alleles before comparing
            vertebral morphology, bone density and local signaling with null and wild-type mice across
            ages. This tests allele-dependent effects without assuming that every patient allele is hypomorphic.
      selected_evidence:
        snippet: Platyspondyly however was not observed in the Ltbp3−/− knockout mice.
        supports: SUPPORT
        directness: DIRECT
