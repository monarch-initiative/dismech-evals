        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ltbp3_mouse_axial_mismatch
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Disturbed Axial Growth Plate and Vertebral Body Formation
        - animal_models#Mouse
        prompt: The Ltbp3-null mouse reproduces the enamel and maxillary phenotypes of this disease but
          not platyspondyly, and its bone density moves in the opposite direction to patients'. Is the
          human axial phenotype caused by something other than reduced TGF-beta bioavailability, or is
          the mouse axial skeleton simply not a valid model for it?
        rationale: 'This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because the evidence exists
          and points the wrong way, which is a different epistemic situation from evidence being absent.
          The dental arm of the model is good enough that its failure on the skeletal arm cannot be waved
          away as a bad model overall.

          Three readings are live and the entry does not choose between them. The mouse null is complete
          loss where human alleles are hypomorphic, and partial loss can produce phenotypes a null does
          not. Mouse and human vertebral bodies develop and are loaded differently, so an axial phenotype
          may need a bipedal spine to appear. Or the human platyspondyly may involve an LTBP3 function
          not captured by TGF-beta bioavailability at all. The practical consequence is the same either
          way: no claim about the human vertebral phenotype in this entry rests on the mouse.

          '
        proposed_experiments:
        - experiment_id: ltbp3_hypomorph_knockin_axial
          name: Knock-in of human hypomorphic LTBP3 alleles versus null, with axial skeletal phenotyping
          description: Generate mice carrying the recurrent human frameshift alleles as knock-ins and
            compare them with the existing null, phenotyping vertebral body height and endplate morphology
            by microCT at several postnatal ages alongside bone-density measurement. This separates the
            dosage explanation from the species explanation.
          would_support:
          - pathophysiology#Disturbed Axial Growth Plate and Vertebral Body Formation
          supporting_outcome:
          - Hypomorphic knock-ins develop vertebral flattening that the null does not, showing that the
            mismatch is about allele dosage rather than about the mouse being the wrong organism, and
            restoring the mouse as a model for the axial phenotype.
          would_refute:
          - pathophysiology#Disturbed Axial Growth Plate and Vertebral Body Formation
          refuting_outcome:
          - Neither null nor hypomorphic mice show platyspondyly at any age, leaving the axial phenotype
            without in vivo support and making TGF-beta bioavailability an inference from expression data
            alone for that limb of the model.
      selected_evidence:
        snippet: underscoring the fact that the mouse phenotype is not always recapitulating the human
          phenotype
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
