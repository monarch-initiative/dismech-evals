      assertion:
        name: Restorative dental rehabilitation
        description: 'The mainstay of care, and the only thing that alters day-to-day life in this disease.
          Unprotected dentine is painful and hypersensitive and the teeth break down quickly, so restoration
          is done early and for symptom control as much as for appearance. Note the evidence base: it
          comes from non-syndromic amelogenesis imperfecta, because no series reports restorative outcomes
          in LTBP3-related disease specifically. The enamel phenotype is the same lesion, which is the
          argument for importing it, and every item here is graded INDIRECT to say that the argument is
          an inference and not a result in this disease.

          '
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Dental Procedure
          term:
