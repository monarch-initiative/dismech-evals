  5f981c6691c9221509b92d868aea48febac33bdbc1858ed10a7b6d32519861f6:
    claim:
      about:
        disease:
          name: Brachyolmia
          disease_term:
            preferred_term: brachyolmia
            term:
              id: MONDO:0015262
              label: brachyolmia
        context:
        - path: /has_subtypes/1
          value:
            name: AR-PAPSS2
            subtype_term:
              preferred_term: autosomal recessive PAPSS2-related brachyolmia
              term:
                id: MONDO:0019666
                label: spondyloepimetaphyseal dysplasia, PAPSS2 type
            mappings:
              mondo_mappings:
              - term:
                  id: MONDO:0018662
                  label: autosomal recessive brachyolmia
                mapping_predicate: skos:exactMatch
                mapping_source: manual curation
                mapping_justification: 'Orphanet-derived MONDO view of the same PAPSS2 entity as MONDO:0019666,
                  which MONDO has not merged: MONDO:0018662 sits under brachyolmia with the Hobaek and
                  Toledo terms as children and carries ORPHA:448242 but no OMIM xref, while MONDO:0019666
                  carries OMIM:612847. The 2023 ISDS Nosology folds recessive brachyolmia and the Hobaek
                  and Toledo types into PAPSS2-related SEMD (NOS 04-0050, MIM 612847), as reported in
                  PMID:38084048.

                  '
              - term:
                  id: MONDO:0010070
                  label: brachyolmia type 1, Hobaek type
                mapping_predicate: skos:narrowMatch
                mapping_source: manual curation
                mapping_justification: 'Historical radiographic type subsumed into PAPSS2-related SEMD
                  by the 2023 ISDS Nosology; retained here so the concept is not re-nominated as uncurated.

                  '
              - term:
                  id: MONDO:0010074
                  label: brachyolmia type 1, toledo type
                mapping_predicate: skos:narrowMatch
                mapping_source: manual curation
                mapping_justification: 'Historical radiographic type subsumed into PAPSS2-related SEMD
                  by the 2023 ISDS Nosology; retained here so the concept is not re-nominated as uncurated.

                  '
            display_name: Autosomal Recessive Brachyolmia (PAPSS2)
            genes:
            - preferred_term: PAPSS2
              term:
                id: hgnc:8604
                label: PAPSS2
            description: 'Caused by loss-of-function mutations in PAPSS2, encoding PAPS synthase 2. Features
              short-trunk short stature with onset in childhood, platyspondyly with rectangular vertebral
              bodies and irregular endplates, precocious rib cartilage calcification, short femoral neck,
              and low serum DHEAS. Includes the historical Hobaek and Toledo types. The bound MONDO term
              is broader than this subtype''s name: PAPSS2 deficiency produces a continuum from subclinical
              brachyolmia to full spondyloepimetaphyseal dysplasia, and the 2023 ISDS Nosology treats
              the whole continuum as one entity (formerly "SEMD Pakistani type"). The brachyolmia pole
              is what this subtype describes; the epiphyseal and metaphyseal changes are a variable feature
              of the same disease rather than a separate one.

              '
          role: subtype
      assertion_type: Biochemical
      assertion:
        name: Low serum DHEAS
        subtype: AR-PAPSS2
        biomarker_term:
          preferred_term: Decreased circulating DHEAS
          term:
            id: HP:0031215
            label: Decreased circulating dehydroepiandrosterone-sulfate concentration
        presence: DECREASED
        context: 'Serum dehydroepiandrosterone sulfate (DHEAS) is low in PAPSS2-related brachyolmia, reflecting
          impaired sulfotransferase activity due to deficient PAPS donor substrate. Low DHEAS is the constant
          biochemical finding; accompanying overt androgen excess is variable, reported in 10 of 79 published
          patients (12.6%) and not established as above the general-population background, so a normal
          androgen profile does not argue against the diagnosis.

          '
      selected_evidence:
        snippet: Disproportionate short stature and symptoms associated with spondylar skeletal dysplasia
          are the most common clinical features that require clinical attention. Androgen excess has been
          described much less commonly.
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/1
      context_paths:
      - /name
