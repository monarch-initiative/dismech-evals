        display_name: Autosomal Recessive Brachyolmia (PAPSS2)
        genes:
        - preferred_term: PAPSS2
          term:
            id: hgnc:8604
            label: PAPSS2
        description: 'Caused by loss-of-function mutations in PAPSS2, encoding PAPS synthase 2. Features
          short-trunk short stature with onset in childhood, platyspondyly with rectangular vertebral
          bodies and irregular endplates, precocious rib cartilage calcification, short femoral neck,
          and low serum DHEAS. Includes the historical Hobaek and Toledo types. The bound MONDO term is
          broader than this subtype''s name: PAPSS2 deficiency produces a continuum from subclinical brachyolmia
          to full spondyloepimetaphyseal dysplasia, and the 2023 ISDS Nosology treats the whole continuum
          as one entity (formerly "SEMD Pakistani type"). The brachyolmia pole is what this subtype describes;
          the epiphyseal and metaphyseal changes are a variable feature of the same disease rather than
          a separate one.

          '
      selected_evidence:
        snippet: We identified PAPSS2 as the disease gene for an AR brachyolmia.
        supports: SUPPORT
