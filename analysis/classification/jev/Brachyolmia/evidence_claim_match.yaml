      assertion:
        discussion_id: openq_ltbp3_aortic_tgfb_signaling
        prompt: Does biallelic LTBP3 deficiency measurably dysregulate TGF-beta signaling in the human
          aortic wall, and which vascular cell compartments mediate the resulting aneurysm and dissection
          risk?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Aortic TGF-beta signaling dysregulation
        rationale: The cited human study predicts defective TGF-beta-LAP-LTBP3 complex formation from
          variant sequence but does not measure signaling in aortic tissue. Human segregation and the
          Ltbp3-null mouse support aortic disease, leaving the tissue-level signaling direction and cellular
          intermediates unresolved.
        proposed_experiments:
        - experiment_id: exp_ltbp3_aortic_tgfb_signaling
          name: LTBP3 patient-derived aortic-cell signaling study
          description: Compare extracellular latent-complex assembly, active TGF-beta release, SMAD phosphorylation,
            matrix organization, and contractile phenotype in patient-derived vascular smooth-muscle and
            endothelial cells, with isogenic variant correction and matched controls.
      selected_evidence:
        snippet: The c.3107-2A > G and the p.Arg545ProfsTer22 variants are expected to result in abnormal
          LTPB3 protein, failure of TGFβ-LAP-LTBP3 complex formation, and subsequent disruption of TGFβ
          secretion and activation.
        supports: SUPPORT
