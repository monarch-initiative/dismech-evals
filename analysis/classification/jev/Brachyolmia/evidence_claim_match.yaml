      - /has_subtypes/1
    evidence_metadata:
      reference: PMID:38084048
      reference_title: Bone Phenotype is Always Present But Androgen Excess is Less Frequently Seen in
        PAPSS2 Deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Supports reading the accompanying androgen profile as variable rather than uniformly
        normal, so low DHEAS is the finding to rely on.

