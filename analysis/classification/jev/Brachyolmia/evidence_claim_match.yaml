              label: brachyolmia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired steroid sulfation
        description: 'PAPSS2 deficiency also disrupts sulfation of dehydroepiandrosterone (DHEA) to DHEAS,
          leading to low serum DHEAS. This is a biochemically distinct consequence of the same upstream
          PAPS deficiency. Unsulfated DHEA remains available for conversion to androstenedione and onward
          to more potent androgens, and that route is demonstrated at the individual-patient level. It
          is not established as a population-level feature of the disease: clinical androgen excess is
          reported in 10 of 79 published patients (12.6%), which the reviewing authors judge not clearly
          above the general-population background for hirsutism and PCOS, and cohorts such as the 18 cases
          in PMID:31313512 identified none. The mechanism is real; the epidemiology does not support calling
          androgen excess a disease feature.

          '
        notes: 'Androgen excess is deliberately not modelled as a phenotype node here. The source that
          reports it most fully (PMID:38084048) declines to treat its frequency as above background, so
          a phenotype entry would assert more than the literature supports. Revisit if a cohort establishes
          an excess over background.

          '
        biological_processes:
        - preferred_term: Sulfation
          term:
            id: GO:0051923
            label: sulfation
          modifier: DECREASED
      selected_evidence:
        snippet: Disproportionate short stature and symptoms associated with spondylar skeletal dysplasia
          are the most common clinical features that require clinical attention. Androgen excess has been
          described much less commonly.
        supports: SUPPORT
    origin:
