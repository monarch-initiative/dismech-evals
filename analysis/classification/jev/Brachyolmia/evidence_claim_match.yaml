      assertion_type: Pathophysiology
      assertion:
        name: TRPV4 constitutive channel activation
        description: 'Gain-of-function mutations in TRPV4 (R616Q, V620I) cause constitutive activation
          of a calcium-permeable mechanosensitive cation channel with cartilage-selective expression.
          The R616Q mutation disrupts a cholesterol-binding motif, leading to loss of lipid raft localization.
          Both mutations increase constitutive channel activity and elevate responses to mechanical stimulation
          and agonist stimulation.

          '
        genes:
        - preferred_term: TRPV4
          term:
            id: hgnc:18083
            label: TRPV4
        biological_processes:
        - preferred_term: Calcium ion transport
          term:
            id: GO:0006816
            label: calcium ion transport
          modifier: INCREASED
      selected_evidence:
        snippet: both mutations resulted in a dramatic gain of function characterized by increased constitutive
          activity
        supports: SUPPORT
