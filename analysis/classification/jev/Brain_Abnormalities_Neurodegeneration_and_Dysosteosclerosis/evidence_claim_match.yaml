        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Biallelic CSF1R Loss of Function
        prompt: 'Why does profound CSF1R deficiency spare peripheral immune function in BANDDOS patients?

          '
        rationale: 'CSF1R is the master regulator of the mononuclear phagocyte system, and the Csf1rko
          rat has a broad myeloid deficit with granulocytosis, B cell deficiency, and failure to thrive.
          Yet detailed immunological workup of a BANDDOS family found normal blood markers, monocytes,
          dendritic cell subsets, and T cell proliferation, and no clinical immunodeficiency has been
          reported. Whether this reflects the hypomorphic nature of human alleles, redundancy with CSF2/IL-34
          signalling in the periphery, or simply incomplete phenotyping across the small case population
          is unresolved, and it matters for how aggressively transplant conditioning would be justified.

          '
        proposed_experiments:
        - experiment_id: exp_banddos_systematic_immunophenotyping
          name: Systematic immunophenotyping across the BANDDOS case population
          description: 'Apply uniform deep immunophenotyping (tissue-resident macrophage compartments,
            monocyte subsets, circulating CSF1 concentration) across reported BANDDOS patients and their
            heterozygous relatives, correlated with allele-specific residual CSF1R signalling measured
            in vitro.

            '
      selected_evidence:
        snippet: Despite the role of CSF1R signaling in myeloid development, immune deficiency is absent.
        supports: SUPPORT
