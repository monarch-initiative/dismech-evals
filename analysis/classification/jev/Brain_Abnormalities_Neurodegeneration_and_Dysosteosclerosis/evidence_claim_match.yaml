      assertion:
        name: Osteoclast Deficiency and Impaired Bone Resorption
        biological_scale: CELLULAR
        description: 'Osteoclasts differentiate from the CSF1R-dependent monocyte/macrophage lineage,
          and CSF1-CSF1R signalling is required for their generation and survival. Reduced CSF1R signalling
          therefore reduces osteoclastic bone resorption, so bone formed during modelling is not removed.
          The result is increased bone mineral density with failure of metaphyseal remodelling - the mechanistic
          basis of the sclerosing bone dysplasia. In the Csf1rko rat, transfer of wild-type bone marrow
          restores osteoclasts and eliminates the osteopetrosis, demonstrating that the bone phenotype
          is cell-autonomous to the marrow-derived lineage.

          '
        cell_types:
        - preferred_term: osteoclast
          term:
            id: CL:0000092
            label: osteoclast
          modifier: DECREASED
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
        biological_processes:
        - preferred_term: osteoclast differentiation
          term:
            id: GO:0030316
            label: osteoclast differentiation
          modifier: DECREASED
        - preferred_term: bone resorption
          term:
            id: GO:0045453
            label: bone resorption
          modifier: DECREASED
        - preferred_term: bone remodeling
          term:
            id: GO:0046849
            label: bone remodeling
          modifier: DECREASED
      selected_evidence:
        snippet: Colony stimulating factor 1 receptor (CSF1R, MIM# 164770) encodes a tyrosine-kinase receptor
          playing an important role in development of osteoclasts and microglia.
