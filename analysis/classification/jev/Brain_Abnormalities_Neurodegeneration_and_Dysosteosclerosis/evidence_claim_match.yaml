          '
        rationale: 'Dysmorphic features occur in 41% of cases and are absent from adult-onset CSF1R-ALSP.
          Some reported elements (bony prominences of the parietal skull, coarse facies) are plausibly
          secondary to craniofacial osteosclerosis, but others (epicanthus, down-slanting palpebral fissures,
          depressed nasal bridge) are not obviously sclerotic in origin, and the literature records only
          an association between dysmorphism, skeletal deformity, and severe disease - not a mechanism.
          This entry therefore leaves the dysmorphism phenotype without a causal edge.

          '
        proposed_experiments:
