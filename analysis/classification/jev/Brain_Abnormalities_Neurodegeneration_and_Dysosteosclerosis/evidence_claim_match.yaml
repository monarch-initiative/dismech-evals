      assertion:
        discussion_id: banddos_optic_atrophy_mechanism_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Optic atrophy
        prompt: 'Is the optic atrophy of BANDDOS compressive (optic canal narrowing by craniofacial osteosclerosis)
          or a primary neurodegenerative process?

          '
        rationale: 'Optic nerve atrophy occurs in about 29% of BANDDOS cases and is not a feature of adult-onset
          CSF1R-ALSP, so it cannot simply be attributed to the shared leukoencephalopathy. Two candidate
          mechanisms exist and have opposite management implications: optic canal narrowing is a recognised
          element of the BANDDOS skeletal phenotype and, in other sclerosing bone dysplasias, compresses
          the nerve in a surgically decompressible way; alternatively the atrophy could be part of the
          congenital or degenerative CNS disease itself. No published BANDDOS case establishes which applies,
          so this entry deliberately draws no causal edge to this phenotype.

          '
        proposed_experiments:
        - experiment_id: exp_banddos_optic_canal_imaging_correlation
          name: Optic canal imaging correlated with optic nerve structure and function
          description: 'In reported and new BANDDOS patients, pair dedicated skull-base CT measurement
            of optic canal diameter with optical coherence tomography and visual evoked potentials, to
            test whether optic atrophy tracks canal narrowing (compressive mechanism) or occurs with patent
            canals (primary neurodegeneration).

            '
      selected_evidence:
        snippet: In addition, a minority of BANDDOS cases presented infantile hypotonia (27%) and atrophy
          of the optic nerve (29%), which were not reported in CSF1R-ALSP.
        supports: SUPPORT
