      assertion:
        name: Progressive Neurological Decline
        biological_scale: ORGANISM
        description: 'The clinical convergence point of the developmental and degenerative arms. Most
          patients present perinatally or in infancy with hypotonia, developmental delay, and seizures,
          then follow a course of cognitive regression, speech deterioration, spasticity and rigidity
          with pyramidal signs, and dysphagia. A minority with hypomorphic alleles are normal or near-normal
          through childhood and decline in the second or third decade, an ALSP-like trajectory. In the
          end stage, patients become bedridden with loss of speech and voluntary movement; several reported
          patients died in infancy or childhood.

          '
      selected_evidence:
        snippet: Neurological symptoms included speech disturbances (n = 13/15), cognitive decline (n
          = 12/14), spasticity/rigidity (n = 12/15), hyperactive tendon reflex (n = 11/14), pathological
          reflexes (n = 8/11), seizures (n = 9/16), dysphagia (n = 9/12), developmental delay (n = 7/14),
          infantile hypotonia (n = 3/11), and optic nerve atrophy (n = 2/7).
        supports: SUPPORT
