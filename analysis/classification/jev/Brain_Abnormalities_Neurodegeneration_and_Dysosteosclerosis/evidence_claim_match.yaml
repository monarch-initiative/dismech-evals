      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CSF1R Loss of Function
        biological_scale: MOLECULAR
        description: 'CSF1R encodes a transmembrane receptor tyrosine kinase activated by two ligands,
          CSF1 and IL-34. In BANDDOS both alleles carry pathogenic variants - most often splice, nonsense,
          or deep-intronic changes that disrupt the tyrosine kinase domain or trigger nonsense-mediated
          decay, less often hypomorphic missense changes that leave the protein expressed but unable to
          autophosphorylate on ligand binding. Because complete CSF1R nullity is lethal or far more severe
          than what is observed clinically, at least one allele in each reported individual is thought
          to retain partial function, and the residual level of CSF1R signalling grades disease severity
          across the CSF1R-related disorder continuum.

          '
        genes:
        - preferred_term: CSF1R
          term:
            id: hgnc:2433
            label: CSF1R
        molecular_functions:
        - preferred_term: macrophage colony-stimulating factor receptor activity
          term:
            id: GO:0005011
            label: macrophage colony-stimulating factor receptor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: cell surface receptor protein tyrosine kinase signaling pathway
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
          modifier: DECREASED
        - preferred_term: CSF1R autophosphorylation on ligand binding
          term:
            id: GO:0046777
            label: protein autophosphorylation
          modifier: DECREASED
      selected_evidence:
        snippet: All mutations disrupted the tyrosine kinase domain or resulted in nonsense-mediated mRNA
          decay.
        supports: SUPPORT
