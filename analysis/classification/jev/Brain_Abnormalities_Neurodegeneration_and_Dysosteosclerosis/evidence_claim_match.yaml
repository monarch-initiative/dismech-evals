      assertion_type: Genetic
      assertion:
        name: CSF1R
        gene_term:
          preferred_term: CSF1R
          term:
            id: hgnc:2433
            label: CSF1R
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
          description: 'BANDDOS is caused by biallelic CSF1R variants. Most reported patients are homozygous
            and born to consanguineous parents; heterozygous relatives are typically asymptomatic, at
            least until the age at which CSF1R-ALSP would declare itself.

            '
        notes: 'Reported BANDDOS variants cluster in or disrupt the tyrosine kinase domain (amino acids
          582-910). Splice, nonsense, and deep-intronic variants predominate; two of the originally described
          alleles were deep intronic and caused abnormal inclusion of intron sequence in the mRNA. No
          variant has yet been reported to occur in both BANDDOS and CSF1R-ALSP.

          '
      selected_evidence:
        snippet: Here, we report seven affected individuals from three unrelated families who had bi-allelic
          CSF1R mutations. In addition to early-onset HDLS-like neurological disorders, they had brain
          malformations and skeletal dysplasia compatible to dysosteosclerosis (DOS) or Pyle disease.
        supports: SUPPORT
