  7ad8b90d96af02d9e6dc58d4630782759c2b888362e20ec3d94d36892af5f98e:
    claim:
      about:
        disease:
          name: Brain Abnormalities, Neurodegeneration, and Dysosteosclerosis
          disease_term:
            preferred_term: Brain abnormalities, neurodegeneration, and dysosteosclerosis
            term:
              id: MONDO:0032772
              label: brain abnormalities, neurodegeneration, and dysosteosclerosis
        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Stem Cell Transplantation (investigational in BANDDOS)
        description: 'HSCT replaces the CSF1R-deficient myeloid compartment with donor-derived cells and
          has become a disease-modifying option in adult-onset CSF1R-ALSP. It has NOT been demonstrated
          to benefit BANDDOS: the rationale is extrapolation from the shared genetic and neuropathological
          basis of the two disorders. Preclinical support comes from the Csf1rko rat, where wild-type
          bone marrow transfer restores tissue macrophages, eliminates osteopetrosis, and permits normal
          growth and long-term survival - although in that model the brain was the one organ where donor-derived
          microglia-like cells did not fully match resident microglia, and congenital malformations already
          present at birth would not be expected to reverse.

          '
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: Hematopoietic Cell Transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: 'No published series reports HSCT outcomes in genetically confirmed BANDDOS. Any use is
          investigational and should be undertaken in a research setting.

          '
      selected_evidence:
        snippet: Therefore, both disorders are on the same continuum, albeit they differ in the severity
          of CSF1R mutations' consequences and phenotypes. This opens windows of opportunity for applying
          already available therapy in CSF1R-ALSP in BANDDOS.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
      - /name
      - /disease_term
