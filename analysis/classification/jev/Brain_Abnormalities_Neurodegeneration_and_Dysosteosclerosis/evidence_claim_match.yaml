              label: brain abnormalities, neurodegeneration, and dysosteosclerosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: banddos_hsct_efficacy_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Allogeneic Hematopoietic Stem Cell Transplantation (investigational in BANDDOS)
        prompt: 'Does hematopoietic stem cell transplantation modify the course of BANDDOS, and is there
          a therapeutic window before the degenerative phase begins?

          '
        rationale: 'HSCT is now offered in CSF1R-ALSP, and the review literature explicitly proposes translating
          it to BANDDOS on the basis of a shared pathomechanism. But no outcome data exist in genetically
          confirmed BANDDOS. Two features of BANDDOS complicate the extrapolation: the congenital malformations
          are already established at birth and cannot plausibly be reversed by any myeloid replacement,
          and in the Csf1rko rat the brain was the one organ where donor-derived cells did not transcriptionally
          match resident microglia. A meaningful trial would therefore have to specify which arm of the
          disease it expects to modify.

          '
        proposed_experiments:
