        context:
        - path: /pathophysiology/1
          value:
            name: Microglial Deficiency in the Developing Brain
            biological_scale: CELLULAR
            description: 'Loss of CSF1R signalling prevents the establishment and expansion of the microglial
              population, so the fetal and postnatal brain develops with few or no microglia. Post-mortem
              examination of a homozygous splice-variant case showed almost complete absence of microglia,
              with only rare abnormal perivascular cells remaining. This is a primary microgliopathy:
              the initiating cellular lesion is loss of the brain''s resident macrophage, not a primary
              defect of neurons or oligodendrocytes.

              '
            cell_types:
            - preferred_term: microglial cell
              term:
                id: CL:0000129
                label: microglial cell
              modifier: DECREASED
            - preferred_term: central nervous system macrophage
              term:
                id: CL:0000878
                label: central nervous system macrophage
              modifier: DECREASED
            biological_processes:
            - preferred_term: microglial cell proliferation
              term:
                id: GO:0061518
                label: microglial cell proliferation
              modifier: DECREASED
            - preferred_term: macrophage differentiation
              term:
                id: GO:0030225
                label: macrophage differentiation
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Disrupted Brain Development and Structural Malformation
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'In the absence of microglia the developing brain fails to form normal commissural,
          ventricular, and posterior-fossa structures. One proposed intermediate is a reduction in CUX1-positive
          upper-layer neurons, many of which project callosal axons.

          '
      selected_evidence:
        snippet: Since a large fraction of CUX1+ neurons project callosal axons, we speculate that microglia
          deficiency may contribute to agenesis of the corpus callosum via reduction in CUX1+ neurons.
        supports: SUPPORT
    origin:
