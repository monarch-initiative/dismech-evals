  1c4a2cfad44e8f6bdaf1b9d2c40e41d7aa7b40b05b0870d891c1cfefdb1d5ddf:
    claim:
      about:
        disease:
          name: Brain Abnormalities, Neurodegeneration, and Dysosteosclerosis
          disease_term:
            preferred_term: Brain abnormalities, neurodegeneration, and dysosteosclerosis
            term:
              id: MONDO:0032772
              label: brain abnormalities, neurodegeneration, and dysosteosclerosis
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Csf1r knockout rat (Csf1rko)
        species: Rat
        genotype: Csf1r homozygous knockout
        publication: PMID:33450391
        description: 'Homozygous Csf1r knockout rats lack essentially all tissue macrophage populations
          including microglia, develop osteopetrosis, and fail to thrive postnatally. The model reproduces
          the myeloid and skeletal arms of human biallelic CSF1R disease, and wild-type bone marrow transfer
          at weaning rescues the phenotype - but the brain phenotype is much milder than in humans, which
          is a substantive translational caveat.

          '
        modeled_mechanisms:
        - target: Microglial Deficiency in the Developing Brain
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Csf1rko rats lose the entire microglial transcriptomic signature across every
            brain region examined.

            '
          limitations: 'The rat models the cellular deficiency faithfully but not its human developmental
            consequences (see the FAILS_TO_RECAPITULATE link below).

            '
          readouts:
          - name: Microglial marker gene expression across brain regions
            target: Microglial Deficiency in the Developing Brain
            direction: DECREASED
            interpretation: 'Transcriptomic confirmation that the microglial population is absent throughout
              the Csf1rko brain.

              '
        - target: Disrupted Brain Development and Structural Malformation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: 'Unlike humans with biallelic CSF1R variants, Csf1rko rats do not develop the congenital
            brain malformations (callosal agenesis, Dandy-Walker complex, cortical malformation) that
            define BANDDOS; brain development is largely normal without microglia.

            '
          limitations: 'Species differences in the developmental role of microglia mean the rat cannot
            be used to model, or to test therapies against, the congenital malformation arm of BANDDOS.
            The authors go further and conclude that CSF1R haploinsufficiency alone is unlikely to cause
            leukoencephalopathy, which is at odds with the human monoallelic disorder.

            '
          readouts:
          - name: Region-specific neuronal and glial transcript clusters
            target: Disrupted Brain Development and Structural Malformation
            direction: UNCHANGED
            interpretation: 'Absence of microglia leaves neuronal, oligodendrocyte, and astrocyte expression
              programmes essentially intact in the rat.

              '
        - target: Osteoclast Deficiency and Impaired Bone Resorption
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Csf1rko rats develop osteopetrosis that is reversed by wild-type bone marrow transfer,
            establishing the osteoclast-deficiency mechanism.

            '
          limitations: 'The rat osteopetrosis is more severe than the dysosteosclerosis-Pyle spectrum
            seen in humans, consistent with the human alleles being hypomorphic rather than null.

            '
          readouts:
          - name: Osteoclast restoration and reversal of osteopetrosis after bone marrow transfer
            target: Osteoclast Deficiency and Impaired Bone Resorption
            direction: RESTORED
            interpretation: 'Restoring CSF1R-competent marrow-derived cells restores osteoclasts and eliminates
              the sclerotic bone phenotype.

              '
      selected_evidence:
        snippet: These studies provide a model for the pathology and treatment of CSF1R mutations in humans
          and the innate immune deficiency associated with prematurity.
        supports: SUPPORT
