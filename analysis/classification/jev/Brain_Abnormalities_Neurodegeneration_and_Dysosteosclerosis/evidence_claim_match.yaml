  1ed4f855f2993f4786324ebba9695613930731ce2352d9c36690c268684c547a:
    claim:
      about:
        disease:
          name: Brain Abnormalities, Neurodegeneration, and Dysosteosclerosis
          disease_term:
            preferred_term: Brain abnormalities, neurodegeneration, and dysosteosclerosis
            term:
              id: MONDO:0032772
              label: brain abnormalities, neurodegeneration, and dysosteosclerosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: banddos_rodent_brain_development_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Disrupted Brain Development and Structural Malformation
        - animal_models#Csf1r knockout rat (Csf1rko)
        prompt: 'Why do humans with biallelic CSF1R loss of function develop severe congenital brain malformations
          while Csf1r knockout rats, which lack microglia just as completely, undergo essentially normal
          brain development?

          '
        rationale: 'The rat Csf1rko removes the entire microglial population - the same cellular lesion
          documented at autopsy in BANDDOS - yet diffusion imaging and region-wise RNA-seq show only small
          fibre-tract reductions and no neuronal or regional transcriptomic change, and the authors conclude
          that most brain developmental processes occur normally without microglia. Human biallelic CSF1R
          brains instead show callosal agenesis, Dandy-Walker complex, heterotopia, and non-decussating
          pyramidal tracts. The same paper concludes that CSF1R haploinsufficiency is unlikely to cause
          leukoencephalopathy, which is directly at odds with the established human monoallelic CSF1R-ALSP
          disorder. Either microglia have human-specific developmental roles (the CUX1-positive upper-layer
          neuron route proposed from the zebrafish and human tissue work is one candidate), or the human
          phenotype depends on something other than microglial absence per se. Until this is resolved,
          rodent rescue data cannot be read as predicting that restoring myeloid cells will correct the
          malformation arm of BANDDOS.

          '
        proposed_experiments:
        - experiment_id: exp_banddos_human_organoid_cux1_requirement
          name: Human cerebral organoid or xenotransplant model with biallelic CSF1R loss
          description: 'Compare corpus callosum-relevant projection neuron specification (CUX1-positive
            upper-layer neurons) in human iPSC-derived cortical systems with and without CSF1R-competent
            microglia, using patient-derived biallelic CSF1R lines, to test whether the developmental
            requirement is human-specific.

            '
        - experiment_id: exp_banddos_microglial_colonisation_timing
          name: Developmental staging of the rodent versus human microglial requirement
          description: 'Determine whether the discrepancy reflects the timing of microglial colonisation
            relative to commissural axon guidance, by comparing microglial colonisation windows and callosal
            pathfinding in rat, zebrafish, and human fetal tissue.

            '
      selected_evidence:
        snippet: We conclude that most brain developmental processes occur normally in the absence of
          microglia and that CSF1R haploinsufficiency is unlikely to cause leukoencephalopathy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33450391
      reference_title: Analysis of homozygous and heterozygous Csf1r knockout in the rat as a model for
        understanding microglial function in brain development and the impacts of human CSF1R mutations.
      evidence_source: MODEL_ORGANISM
      explanation: 'The rat conclusion that brain development proceeds normally without microglia is the
        model side of the mismatch.

        '
