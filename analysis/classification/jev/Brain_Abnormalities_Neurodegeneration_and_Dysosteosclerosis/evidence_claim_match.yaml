            description: 'The Csf1r-null mouse is the original and most extensively characterised CSF1R-deficiency
              system, and is the model the human BANDDOS phenotype was first compared against. It loses
              most tissue macrophages and osteoclasts and is osteopetrotic. Its central caveat for BANDDOS
              is severity and background dependence: the human phenotype is milder and more variable than
              the mouse null, which is the observation that led to the inference that at least one BANDDOS
              allele is always hypomorphic.

              '
            notes: 'Cited via the dedicated review of Csf1r-deficiency models rather than a single primary
              mouse paper, because the relevant claim (what the mouse null does and does not capture about
              human CSF1R disease) is a synthesis across that literature.

              '
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Osteoclast Deficiency and Impaired Bone Resorption
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: 'Csf1r-null mice show the loss of osteoclasts and of bone remodelling that underlies
          the human skeletal phenotype.

          '
        limitations: 'The complete null is more severe than any reported human genotype, and phenotypic
          differences between Csf1-null and Csf1r-null mice are only revealed on defined inbred backgrounds,
          so strain background is a confounder when reading severity across studies.

          '
      selected_evidence:
        snippet: Studies in homozygous Csf1r- and Csf1- null mice have shown that the CSF-1/CSF-1R pathway
          regulates the differentiation and maintenance of most tissue macrophages and osteoclasts, contributing
          to the development and remodeling of bones and soft tissues
