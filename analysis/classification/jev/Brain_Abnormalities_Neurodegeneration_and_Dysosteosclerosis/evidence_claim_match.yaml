          name: Systematic craniofacial phenotyping against skeletal severity
          description: 'Score individual dysmorphic elements across reported BANDDOS cases and correlate
            each with radiographic craniofacial osteosclerosis severity, to separate bony-overgrowth features
            from those requiring a different developmental explanation.

            '
      selected_evidence:
        snippet: Skeletal deformities and dysmorphic features were often associated with complex brain
          abnormalities and a more ominous clinical course; however, they were also observed in one case
          with the adult onset of the disease.
