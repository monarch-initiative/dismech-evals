  d21642469edc1d4607fccff2da30c7649345d75bcc65cac172d03d7b171cade3:
    claim:
      about:
        disease:
          name: Brain Abnormalities, Neurodegeneration, and Dysosteosclerosis
          disease_term:
            preferred_term: Brain abnormalities, neurodegeneration, and dysosteosclerosis
            term:
              id: MONDO:0032772
              label: brain abnormalities, neurodegeneration, and dysosteosclerosis
        context: []
      assertion_type: Treatment
      assertion:
        name: iPSC-Derived Microglia Replacement (preclinical)
        description: 'A research-stage strategy that goes further than HSCT: transplanting human iPSC-derived
          microglial progenitors directly, rather than relying on marrow-derived cells to engraft the
          CNS. In a xenotolerant Csf1r-FIRE-enhancer mouse that develops nearly all the hallmark ALSP
          pathologies, transplanted iPSC-derived microglia restored a homeostatic microglial signature
          and prevented axonal spheroids, white matter abnormality, reactive astrocytosis, and brain calcification;
          CRISPR-corrected patient-derived microglia even reversed pre-existing spheroid, astrogliosis,
          and calcification pathology. This is preclinical and was done in an ALSP model, not a BANDDOS
          model, and it addresses the degenerative arm only - the congenital malformations of BANDDOS
          are established before birth.

          '
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: cellular therapy
          term:
            id: NCIT:C70601
            label: Cellular Therapy
        notes: 'Preclinical only. No microglia-replacement trial exists in any CSF1R disorder, let alone
          in BANDDOS.

          '
      selected_evidence:
        snippet: Furthermore, transplantation of CRISPR-corrected ALSP-patient-derived iMG reverses pre-existing
          spheroids, astrogliosis, and calcification pathologies.
        supports: SUPPORT
    origin:
