      - /disease_term
    evidence_metadata:
      reference: PMID:34145972
      reference_title: Modeling CSF-1 receptor deficiency diseases - how close are we?
      evidence_source: HUMAN_CLINICAL
      explanation: 'Offers a competing, allele-dose explanation for the discrepancy: the developmental
        malformations track residual CSF1R activity rather than microglial absence alone, which the rodent
        null cannot test.

