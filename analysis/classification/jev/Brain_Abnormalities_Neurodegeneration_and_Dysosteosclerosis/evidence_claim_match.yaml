          described BANDDOS alleles were deep intronic and acted by abnormal intron inclusion, an exome-only
          strategy can miss the second allele; genome sequencing or targeted intronic analysis should
          be considered when only one variant is found in a phenotypically convincing case. Parental segregation
          should be confirmed.

          '
        presence: Biallelic (homozygous or compound heterozygous) pathogenic CSF1R variants
      selected_evidence:
        snippet: The diagnosis of CSF1R-related disorder is established in a proband with suggestive findings
          and a heterozygous CSF1R pathogenic variant or biallelic CSF1R pathogenic variants identified
          by molecular genetic testing.
