            term:
              id: MONDO:0032772
              label: brain abnormalities, neurodegeneration, and dysosteosclerosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: banddos_cerebellar_atrophy_attribution_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Cerebellar atrophy
        prompt: 'Is the cerebellar atrophy of BANDDOS a progressive degenerative process, a developmental
          posterior fossa abnormality, or both?

          '
        rationale: 'Cerebellar atrophy was reported in seven of eight patients in whom the cerebellum
          was assessed, making it one of the most consistent structural findings, yet no publication attributes
          it to a mechanism. It could be developmental (the posterior fossa is malformed in the Dandy-Walker
          arm of the spectrum), degenerative (calcifications occur in cerebellar white matter), or both,
          and serial imaging distinguishing hypoplasia from progressive volume loss has not been reported.
          This entry deliberately draws no causal edge to this phenotype rather than guessing between
          the developmental and degenerative arms.

          '
        proposed_experiments:
        - experiment_id: exp_banddos_serial_cerebellar_volumetry
          name: Serial cerebellar volumetry across the BANDDOS disease course
          description: 'Quantify cerebellar volume longitudinally in BANDDOS patients from the earliest
            available scan, distinguishing static hypoplasia (developmental) from progressive volume loss
            (degenerative), and correlate with the presence of posterior fossa malformation and cerebellar
            calcification.

            '
      selected_evidence:
        snippet: Calcifications can also be found in the cerebellar white matter
        supports: SUPPORT
