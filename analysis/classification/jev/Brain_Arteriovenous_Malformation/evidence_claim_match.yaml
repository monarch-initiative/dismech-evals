          seizure. No ontology term is bound: HPO has no general "focal neurological deficit" concept,
          and the available evidence names the deficits collectively rather than identifying hemiparesis
          specifically, so binding to HP:0001269 Hemiparesis would assert a particular deficit the sources
          do not single out. ECTO-style substitution is not available here either; the broad alternative,
          HP:0012638 Abnormal nervous system physiology, is too coarse to carry meaning.'
