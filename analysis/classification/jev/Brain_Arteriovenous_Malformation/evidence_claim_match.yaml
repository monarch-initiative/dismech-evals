      assertion_type: Diagnosis
      assertion:
        name: Non-contrast-enhanced time-resolved MR angiography
        description: Non-contrast 4D MRA can detect and characterize shunting while avoiding gadolinium.
          In a retrospective study of 54 imaging pairs from 43 patients, reported sensitivity was 75%
          and specificity 95% against DSA. The mixture of treated and untreated lesions and widely varying
          intervals between MRA and DSA limit inference; it does not establish that MRA can replace DSA
          in every setting.
        diagnosis_term:
          preferred_term: magnetic resonance angiography
          term:
            id: NCIT:C190557
            label: Magnetic Resonance Angiography
        results: Detection of arteriovenous shunting and grading concordant with DSA, without gadolinium-based
          contrast.
      selected_evidence:
        snippet: Our results demonstrated that NCE-4D-MRA had a higher accuracy and specificity compared
          to CE-4D-MRA (0.85 vs. 0.83 and 95% vs. 85%, respectively) and similar agreement, with DSA detecting
          shunts in bAVMs or residuals.
        supports: SUPPORT
