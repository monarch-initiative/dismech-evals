              id: MONDO:0007154
              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Non-contrast-enhanced time-resolved MR angiography
        description: 'Non-contrast 4D MR angiography detects the shunt and characterises angioarchitecture
          with accuracy comparable to contrast-enhanced 4D-MRA, and grades concordantly with DSA on the
          Spetzler-Martin and Buffalo scales. Its value is specific to this disease: brain AVM is a lifelong
          lesion requiring repeated imaging, so avoiding cumulative gadolinium exposure over decades of
          follow-up matters more here than for a one-off diagnostic question.'
        diagnosis_term:
          preferred_term: magnetic resonance angiography
          term:
            id: NCIT:C190557
            label: Magnetic Resonance Angiography
        results: Detection of arteriovenous shunting and grading concordant with DSA, without gadolinium-based
          contrast.
      selected_evidence:
        snippet: Our results demonstrated that NCE-4D-MRA had a higher accuracy and specificity compared
          to CE-4D-MRA (0.85 vs. 0.83 and 95% vs. 85%, respectively) and similar agreement, with DSA detecting
          shunts in bAVMs or residuals.
        supports: SUPPORT
    origin:
