              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MAPK-ERK Pathway Inhibition as Therapeutic Vulnerability
        biological_scale: MOLECULAR
        role: therapeutic_vulnerability
        description: 'Because the disease runs through a single constitutively active kinase cascade,
          inhibiting that cascade is a candidate disease-modifying therapy - the first such prospect for
          a lesion otherwise treated only by destroying or removing it. Inhibition of MAPK-ERK reverses
          the angiogenic, Notch and migratory phenotype of mutant endothelium in vitro; MEK and BRAF inhibitors
          show promise in preclinical models; and combined glycolysis and MEK inhibition suppresses angiogenesis
          in patient-derived AVM endothelial cells. This is explicitly a preclinical vulnerability: no
          MEK inhibitor is established therapy for brain AVM, and the `bavm-mek-inhibition-translation`
          discussion records what stands between the model data and clinical use. The clinical motivation
          is the haemorrhage risk documented on the rupture node: absent a medical option, the only alternative
          is a destructive intervention on an often asymptomatic lesion. That is a rationale for pursuing
          the target, not a causal relationship, so it is recorded here rather than encoded as a pathograph
          edge.'
        biological_processes:
        - preferred_term: ERK1 and ERK2 cascade
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
      selected_evidence:
        snippet: These processes were reversed by inhibition of MAPK (mitogen-activated protein kinase)-ERK
          signaling.
        supports: SUPPORT
