      assertion_type: Treatment
      assertion:
        name: Endovascular embolization
        description: Catheter-delivered occlusion of the nidus or its feeding arteries, usually with a
          liquid embolic (EVOH/Onyx or n-BCA). In practice it is most often adjunctive - devascularising
          a lesion before resection or radiosurgery - rather than curative on its own, and it was one
          of the three interventional modalities randomised in ARUBA. Notably, in a 1,770-patient registry
          emulation only microsurgical resection carried a consistent haemorrhage benefit in sensitivity
          analyses, so embolization should not be assumed to inherit resection's result.
        treatment_term:
          preferred_term: Embolization Therapy
          term:
            id: NCIT:C15230
            label: Embolization Therapy
        therapeutic_modality: DEVICE
      selected_evidence:
        snippet: medical management with interventional therapy (ie, neurosurgery, embolisation, or stereotactic
          radiotherapy, alone or in combination)
        supports: SUPPORT
