  a1b0414f542ac109415967cf830c79a2e1ec56e2e2a0b18a732c69490a878d68:
    claim:
      about:
        disease:
          name: Brain arteriovenous malformation
          disease_term:
            preferred_term: arteriovenous malformations of the brain
            term:
              id: MONDO:0007154
              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endothelial Glycolytic Reprogramming via GLUT1 and Hexokinase-2
        biological_scale: MOLECULAR
        role: modifier
        description: 'Mutant KRAS raises endothelial glucose uptake and glycolytic flux by increasing
          membrane localisation of glucose transporters such as GLUT1 and inducing hexokinase-2. Notably,
          HK2 appears to be the only glycolytic enzyme elevated, so this is a targeted metabolic rewiring
          rather than a generalised upregulation, and HK2 is elevated in human as well as mouse AVM tissue.
          The reprogramming is required for the angiogenic phenotype: inhibiting glycolytic flux or knocking
          down HK2 suppresses sprouting angiogenesis in mutant endothelial cells, and glycolysis inhibition
          potentiates MEK inhibition.'
        biological_processes:
        - preferred_term: glycolytic process
          modifier: INCREASED
          term:
            id: GO:0006096
            label: glycolytic process
      selected_evidence:
        snippet: We found that KRASG12V expression in the endothelium increased angiogenesis, which was
          accompanied by enhanced glucose uptake and glycolytic flux.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41708990
      reference_title: KRAS-dependent glycolytic reprogramming of endothelial cells in sporadic arteriovenous
        malformations.
      evidence_source: IN_VITRO
      explanation: Establishes the metabolic shift downstream of mutant KRAS that this node represents.
