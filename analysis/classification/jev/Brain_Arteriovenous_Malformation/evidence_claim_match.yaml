          name: Brain arteriovenous malformation
          disease_term:
            preferred_term: arteriovenous malformations of the brain
            term:
              id: MONDO:0007154
              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bavm-unruptured-management-controversy
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Nidus Rupture and Intracranial Haemorrhage
        - pathophysiology#Nidus Formation with Direct Arteriovenous Shunting
        prompt: 'Should an unruptured brain AVM be treated or observed? The only randomised trial, ARUBA,
          was stopped early for superiority of medical management, with death or symptomatic stroke in
          10.1% on medical management versus 30.7% with intervention over 33 months. A 1,770-patient target-trial-emulation
          study of a national registry subsequently found the opposite over a longer horizon: 5-year haemorrhage-free
          survival of 96.2% with intervention versus 89.0% with conservative management. The two results
          are not obviously reconcilable, and the disagreement is not settled.'
        rationale: 'This is a mechanistically informative disagreement rather than a mere clinical dispute.
          The competing results are consistent with a lesion whose hazard is roughly constant and lifelong
          while the harm of intervention is front-loaded: a short-horizon trial then favours observation
          and a long-horizon analysis favours treatment, without either being wrong about what it measured.
          The registry analysis also found no benefit in high-grade or diffuse-nidus lesions, and only
          microsurgical resection carried a consistent benefit, which suggests the answer is conditional
          on lesion architecture rather than uniform. Curating a single management recommendation here
          would misrepresent the evidence, so the entry records both treatments with their own evidence
          and leaves the comparison open.'
        proposed_experiments:
        - experiment_id: bavm-long-horizon-randomisation
          name: Long-horizon randomised comparison stratified by nidus architecture
          description: A randomised comparison of intervention versus observation in unruptured brain
            AVM with follow-up of at least ten years, prospectively stratified by Spetzler-Martin grade,
            nidus diffuseness and venous drainage pattern, powered to detect a crossing of the survival
            curves rather than only an early difference.
          readouts:
          - name: Haemorrhage-free survival by lesion architecture stratum at 10 years
            target: pathophysiology#Nidus Rupture and Intracranial Haemorrhage
          would_support:
          - pathophysiology#Nidus Rupture and Intracranial Haemorrhage
      selected_evidence:
        snippet: The risk of death or stroke was significantly lower in the medical management group than
          in the interventional therapy group (hazard ratio 0.27, 95% CI 0.14-0.54).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24268105
