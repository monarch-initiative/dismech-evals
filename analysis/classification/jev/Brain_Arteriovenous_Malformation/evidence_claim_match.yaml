  6a028af59a461b47a34ef46d6bd27e46b93b1ad7e88a8a80071f04c97770ed36:
    claim:
      about:
        disease:
          name: Brain arteriovenous malformation
          disease_term:
            preferred_term: arteriovenous malformations of the brain
            term:
              id: MONDO:0007154
              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bavm-mek-inhibition-translation
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#MAPK-ERK Pathway Inhibition as Therapeutic Vulnerability
        - pathophysiology#Constitutive RAS-MAPK-ERK Signalling in Brain Endothelial Cells
        prompt: MEK and BRAF inhibition reverses the mutant endothelial phenotype in culture, suppresses
          arteriovenous shunting in zebrafish, and acts on patient-derived AVM endothelial cells, but
          no MEK inhibitor is established therapy for brain AVM. Does pathway inhibition modify an established
          human nidus, as opposed to preventing lesion formation or reversing it in a model organism?
        rationale: 'The distinction matters because the model systems test a different question from the
          clinical one. Animal and zebrafish models express mutant KRAS and then observe lesion formation,
          so they largely test prevention; a patient presents with a nidus that has existed for years
          and is structurally remodelled, and it is not established that switching off the driving signal
          reverses established architecture. Two further obstacles are specific to this disease: variant
          allele frequencies are low and lesional tissue is hard to obtain, so patients cannot easily
          be genotyped before treatment, and the natural-history haemorrhage rate of roughly 1.3% per
          year in unruptured lesions means any trial of a drug with systemic toxicity needs a long horizon
          and a large cohort to show benefit.'
        proposed_experiments:
        - experiment_id: bavm-mek-established-lesion-trial
          name: MEK inhibition in established, genotyped brain AVM
