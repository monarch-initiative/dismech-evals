          microsurgical risk. Supplementary grading adds patient age, hemorrhagic presentation and nidus
          diffuseness. Grading informs rather than determines treatment selection and is distinct from
          predicting untreated rupture risk.
        diagnosis_term:
          preferred_term: disease grading
