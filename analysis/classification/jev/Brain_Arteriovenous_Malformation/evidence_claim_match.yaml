      assertion_type: Treatment
      assertion:
        name: Microsurgical resection
        description: Microsurgery aims at complete nidus removal and can provide immediate obliteration,
          with outcome dependent on lesion anatomy and surgical risk. A selected 52-patient retrospective
          series found better outcomes for supplementary Spetzler-Martin scores ≤6. MATCH sensitivity
          analyses favored microsurgery for AVM hemorrhage or death, but this observational result does
          not establish superiority for all patients or all neurological outcomes.
        treatment_term:
          preferred_term: Neurosurgical Procedure
          term:
            id: NCIT:C15656
            label: Neurosurgical Procedure
        therapeutic_modality: SURGERY
      selected_evidence:
        snippet: In the low-risk group, there were no deaths, and poor outcomes were rare (6.8% at discharge;
          2.3% at 9 months). Conversely, the high-risk group demonstrated significantly worse outcomes
          (62.5% poor outcome at discharge, 28.6% at 9 months).
        supports: SUPPORT
