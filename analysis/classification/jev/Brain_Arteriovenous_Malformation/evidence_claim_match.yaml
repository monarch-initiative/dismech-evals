            term:
              id: MONDO:0007154
              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Genetic
      assertion:
        name: KRAS
        notes: Somatic activating KRAS mutations - most often the canonical hotspot substitutions at codon
          12 - are the predominant genetic cause of sporadic brain AVM. They are detectable in lesional
          tissue and endothelial-enriched cultures from that tissue but not in paired blood, establishing
          them as post-zygotic mosaic events confined to the lesion rather than inherited variants. This
          is the reason bAVM is focal and sporadic, and the reason genetic testing requires lesional tissue
          or ultra-sensitive cell-free DNA methods rather than a standard blood panel.
        gene_term:
          preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        association: Somatic activating mutation in lesional endothelium
        relationship_type: SOMATIC_DRIVER
        variant_origin: SOMATIC
      selected_evidence:
        snippet: We detected somatic activating KRAS mutations in tissue samples from 45 of the 72 patients
          and in none of the 21 paired blood samples.
        supports: SUPPORT
