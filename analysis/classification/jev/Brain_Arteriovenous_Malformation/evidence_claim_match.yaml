      assertion_type: Pathophysiology
      assertion:
        name: Vascular Inflammation and Blood-Brain Barrier Junction Loss
        biological_scale: CELLULAR
        role: central_effector
        description: Mutant endothelium is not merely misshapen, it is inflammatory. KRASG12V-expressing
          endothelial cells increase expression of pro-inflammatory mediators and reduce expression of
          blood-brain-barrier junction constituents, forming a leaky barrier in vitro. Their conditioned
          medium activates microglia, and medium from those primed microglia in turn degrades junction
          proteins in wild-type endothelial cells - a feed-forward loop in which the mutant clone recruits
          normal neighbouring tissue into the lesion. Blood-derived macrophages worsen the barrier defect
          further. This is the inflammatory arm of vascular instability, distinct from the haemodynamic
          arm.
        cell_types:
        - preferred_term: brain microvascular endothelial cell
          term:
            id: CL:2000044
            label: brain microvascular endothelial cell
        - preferred_term: microglial cell
          term:
            id: CL:0000129
            label: microglial cell
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
      selected_evidence:
        snippet: Here we demonstrate that KRASG12V expressing cultured ECs (KRAS-G12V-EC) have increased
          expression of pro-inflammatory mediators and reduced expression of blood-brain-barrier (BBB)
          junction constituents.
        supports: SUPPORT
