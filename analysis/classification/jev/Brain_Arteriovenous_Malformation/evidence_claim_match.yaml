      assertion_type: Pathophysiology
      assertion:
        name: Constitutive RAS-MAPK-ERK Signalling in Brain Endothelial Cells
        biological_scale: MOLECULAR
        role: central_effector
        description: 'Mutant KRAS raises ERK activity in brain endothelial cells and holds the MAPK-ERK
          cascade active independently of upstream growth-factor input. This is the rate-limiting node
          of the disease: it is common to the KRAS and BRAF genotypes, it is what endothelial-specific
          expression of either mutant reproduces in animal models, and pharmacological inhibition of MAPK-ERK
          reverses the downstream cellular phenotype. That reversibility is what makes the node causal
          rather than a bystander correlate, and it is the rationale for MEK-directed therapy.'
        biological_processes:
        - preferred_term: ERK1 and ERK2 cascade
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
        - preferred_term: MAPK cascade
          modifier: INCREASED
          term:
            id: GO:0000165
            label: MAPK cascade
        cell_types:
        - preferred_term: brain microvascular endothelial cell
          term:
            id: CL:2000044
            label: brain microvascular endothelial cell
      selected_evidence:
        snippet: expression of mutant KRAS (KRASG12V) in endothelial cells in vitro induced increased
          ERK (extracellular signal-regulated kinase) activity
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
