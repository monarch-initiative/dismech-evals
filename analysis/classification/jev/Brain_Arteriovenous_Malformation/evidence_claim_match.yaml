  fe243f4ea158f47bfba3debabcda3c4d00357bad409ee684ed6f45bb6cfef024:
    claim:
      about:
        disease:
          name: Brain arteriovenous malformation
          disease_term:
            preferred_term: arteriovenous malformations of the brain
            term:
              id: MONDO:0007154
              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deficient Mural Cell Coverage and Vessel Wall Instability
        biological_scale: TISSUE
        role: central_effector
        description: 'Nidus vessels are structurally defective, and a specific component of that defect
          is inadequate mural cell coverage. Pericytes and smooth muscle cells are what give a vessel
          wall its integrity, and changes in their number and coverage are implicated in bAVM; their recruitment
          during vascular remodelling is governed by PDGF-B/PDGFR-beta, EphrinB2/EphB4 and angiopoietin/Tie2
          signalling. This sits between the malformed nidus and rupture as the structural reason those
          vessels are fragile - complementing, not duplicating, the inflammatory arm, which degrades endothelial
          junctions rather than mural coverage. Human bulk RNA-seq of bAVM tissue is consistent with it:
          extracellular-matrix and angiopoietin-TIE genes are among the downregulated set.'
        cell_types:
        - preferred_term: pericyte
          term:
            id: CL:0000669
            label: pericyte
        - preferred_term: smooth muscle cell
          term:
            id: CL:0000192
            label: smooth muscle cell
      selected_evidence:
        snippet: The vessel walls in bAVMs have structural defects, which impair vascular integrity. Mural
          cells are essential structural and functional components of blood vessels and play a critical
          role in maintaining vascular integrity. Changes in mural cell number and coverage have been
          implicated in bAVMs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/10
      evidence_path: /pathophysiology/10/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34541474
      reference_title: The role of mural cells in hemorrhage of brain arteriovenous malformation.
      evidence_source: OTHER
      explanation: Establishes deficient mural cell coverage as a structural defect of bAVM vessels impairing
        vascular integrity. Evidence source is OTHER as this is a review article.
