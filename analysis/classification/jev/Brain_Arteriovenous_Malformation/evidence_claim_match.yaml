      assertion_type: Diagnosis
      assertion:
        name: VALE hemorrhage-risk assessment
        description: VALE estimates rupture risk from ventricular involvement (+2), venous aneurysm (−4),
          deep location (+1), and exclusively deep venous drainage (+2). The derivation and validation
          cohorts were predominantly Chinese; the conservative cohort included 235 prospectively followed
          and 793 retrospectively selected patients. Only 36 hemorrhages occurred, and the authors warn
          that hemorrhage-free survival may be overestimated. Venous aneurysm was protective in the fitted
          score, not a uniform risk-increasing feature. VALE is a prognostic adjunct, not a diagnostic
          test or proof of treatment benefit.
      selected_evidence:
        snippet: Venous aneurysm was a protective factor for AVM rupture in the study cohort
        supports: SUPPORT
        directness: DIRECT
