        context: []
      assertion_type: Pathophysiology
      assertion:
        name: High-Flow Shunt Haemodynamics and Venous Hypertension
        biological_scale: TISSUE
        role: consequence
        description: Arterial pressure delivered into the venous side produces venous hypertension, progressive
          dilation of draining veins, and mechanical loading of vessel walls that were never built to
          withstand it. The haemodynamic burden also perturbs perinidal cortex. This is the mechanical
          arm of rupture risk, and it is separable from - and additive to - the inflammatory arm. Deep
          venous drainage is among the anatomical features associated with higher haemorrhage risk in
          natural-history cohorts, which is consistent with an outflow-restriction mechanism.
      selected_evidence:
        snippet: Female sex (1.49, 95% CI 0.96-2.30) and exclusively deep venous drainage (1.60, 0.95-2.68,
          p = 0.02 in imputed dataset) may be additional predictors.
        supports: SUPPORT
