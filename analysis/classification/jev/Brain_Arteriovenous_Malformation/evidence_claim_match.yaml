              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic Activating KRAS or BRAF Mutation in Brain Endothelium
        biological_scale: MOLECULAR
        role: trigger
        description: A post-zygotic activating mutation in KRAS, or less often BRAF, arises in a brain
          endothelial progenitor during development and is confined to the descendants of that cell. Because
          the mutation is mosaic and lesion-restricted - detectable in AVM tissue and in endothelial-enriched
          cultures derived from it, undetectable in the same patient's blood - the disease is focal and
          sporadic rather than inherited, and the lesion has a definite clonal boundary. This is the initiating
          event of sporadic brain AVM.
        cell_types:
        - preferred_term: brain microvascular endothelial cell
          term:
            id: CL:2000044
            label: brain microvascular endothelial cell
      selected_evidence:
        snippet: We detected somatic activating KRAS mutations in tissue samples from 45 of the 72 patients
          and in none of the 21 paired blood samples.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29298116
      reference_title: Somatic Activating KRAS Mutations in Arteriovenous Malformations of the Brain.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the somatic, lesion-restricted mosaic mutation that initiates the disease,
        and the tissue-versus-blood contrast that defines it as post-zygotic.
