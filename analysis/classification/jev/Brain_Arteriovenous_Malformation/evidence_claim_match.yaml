        context: []
      assertion_type: Phenotype
      assertion:
        category: Clinical
        name: Focal neurological deficit
        description: 'Focal deficits - weakness, sensory disturbance, speech difficulty, visual field
          loss - arising from haemorrhage into eloquent territory, mass effect of the nidus, or perinidal
          ischaemia. In surgical series of unruptured lesions they are a less common presentation than
          seizure. No ontology term is bound: HPO has no general "focal neurological deficit" concept,
          and the available evidence names the deficits collectively rather than identifying hemiparesis
          specifically, so binding to HP:0001269 Hemiparesis would assert a particular deficit the sources
          do not single out. ECTO-style substitution is not available here either; the broad alternative,
          HP:0012638 Abnormal nervous system physiology, is too coarse to carry meaning.'
        phenotype_term:
          preferred_term: focal neurological deficit
      selected_evidence:
        snippet: In our cohort, epileptic seizures were the most frequent initial clinical manifestation,
          whereas headaches and focal neurological deficits were less commonly observed.
        supports: SUPPORT
