            publication: PMID:38700584
            description: A mouse model in which BrafV600E is expressed in brain endothelial cells, developed
              specifically because earlier models produced heterogeneous and atypical lesions. It reproduces
              the human lesion closely, across ages and brain regions, with dilated vessels, reduced vascular
              wall stability, spontaneous haemorrhage and neuroinflammation.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Somatic Activating KRAS or BRAF Mutation in Brain Endothelium
        relationship: RECAPITULATES
        fidelity: HIGH
        description: Endothelial-restricted expression of a BRAF activating mutation is the model's design
          and matches the human somatic mosaic lesion in cell type and gene.
        limitations: The mutation is engineered and lineage-wide within the targeted endothelium rather
          than arising as a spontaneous focal clone, so the model does not reproduce the mosaic clone-boundary
          architecture of human disease.
        readouts:
        - name: Formation of AVM lesions resembling human bAVM
          target: Somatic Activating KRAS or BRAF Mutation in Brain Endothelium
          direction: INCREASED
          interpretation: Lesion formation on introducing the mutation is the causal demonstration that
            the endothelial mutation is sufficient.
      selected_evidence:
        snippet: Here we developed a novel mouse model of sporadic BAVM that is consistent with clinical
          manifestations in humans.
        supports: SUPPORT
