      assertion_type: Discussion
      assertion:
        discussion_id: bavm-unruptured-management-controversy
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Nidus Rupture and Intracranial Haemorrhage
        - pathophysiology#Nidus Formation with Direct Arteriovenous Shunting
        prompt: Which patients with an unruptured brain AVM benefit from intervention when both hemorrhagic
          and nonhemorrhagic outcomes are considered?
        rationale: ARUBA randomized adults and measured death or any symptomatic stroke, including ischemic
          stroke. MATCH emulated a target trial in an observational registry that included younger patients
          and measured AVM-related hemorrhage or death; its primary outcome excluded ischemic stroke,
          radiation injury, seizures and cognitive effects. Longer follow-up alone cannot explain the
          different estimates, and weighting cannot eliminate unmeasured confounding. MATCH high-grade
          subgroup estimates were imprecise. Diffuse lesions showed benefit at five years but no significant
          advantage at ten years, rather than uniform absence of benefit.
        proposed_experiments:
        - experiment_id: bavm-long-horizon-randomisation
          name: Long-term randomized assessment of net clinical benefit
          description: Compare intervention and observation with long-term randomized follow-up, prospectively
            stratified by clinically relevant lesion anatomy. Measure death, hemorrhagic and ischemic
            stroke, disability, cognition, seizures and treatment-related injury rather than assuming
            hemorrhage-free survival captures net benefit.
          readouts:
          - name: Death, hemorrhagic and ischemic stroke, disability and treatment-related injury
            target: pathophysiology#Nidus Rupture and Intracranial Haemorrhage
          would_support:
          - pathophysiology#Nidus Rupture and Intracranial Haemorrhage
      selected_evidence:
        snippet: the estimated 5-year hemorrhage-free survival was 96.23% (95% CI, 93.95%-97.65%) for
          the interventional treatment group and 89.00% (95% CI, 86.37%-91.24%) for the conservative management
          group
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
