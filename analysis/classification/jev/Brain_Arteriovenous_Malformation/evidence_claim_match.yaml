            term:
              id: MONDO:0007154
              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Treatment
      assertion:
        name: Microsurgical resection
        description: 'Open surgical excision of the nidus, the only modality that removes the lesion immediately
          and completely and the only one consistently associated with reduced haemorrhage risk in sensitivity
          analyses of large registry data. Outcome depends steeply on lesion grade: in a 12-year single-centre
          series of unruptured lesions stratified by supplementary Spetzler-Martin grade, poor outcomes
          were rare in the low-risk group but common in the high-risk group.'
        treatment_term:
          preferred_term: Neurosurgical Procedure
          term:
            id: NCIT:C15656
            label: Neurosurgical Procedure
        therapeutic_modality: SURGERY
      selected_evidence:
        snippet: In the low-risk group, there were no deaths, and poor outcomes were rare (6.8% at discharge;
          2.3% at 9 months). Conversely, the high-risk group demonstrated significantly worse outcomes
          (62.5% poor outcome at discharge, 28.6% at 9 months).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
