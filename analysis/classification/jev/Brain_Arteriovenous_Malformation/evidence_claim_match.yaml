          AVMs. Neither had a measurable reduction in nidus volume at 26 or 52 weeks. No clinically important
          adverse events were identified in this small sample, which is insufficient to establish safety
          or hemorrhage prevention. NCT06264531 is evaluating symptomatic benefit. Improvement of post-radiosurgery
          edema in separate reports must not be equated with efficacy against the untreated nidus.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
