      assertion_type: Treatment
      assertion:
        name: Stereotactic radiosurgery
        description: Focused radiation produces progressive vascular injury and eventual nidus obliteration
          over a latency period. Hemorrhage remains possible before obliteration, and radiation-related
          injury is an additional risk. A 101-patient retrospective pediatric cohort reported 64% estimated
          obliteration at five years and 82% at ten years, with permanent symptomatic radiation changes
          in 8%. A separate prospective TOBAS SRS registry reported three-year occlusion in 51/79 patients
          with imaging, or 54% of all 94 analyzed patients.
        treatment_term:
          preferred_term: Stereotactic Radiosurgery
          term:
            id: NCIT:C15358
            label: Stereotactic Radiosurgery
        therapeutic_modality: RADIOTHERAPY
      selected_evidence:
        snippet: Estimated probabilities of AVM obliteration at 5 and 10 yr were 64% and 82%, respectively.
        supports: SUPPORT
