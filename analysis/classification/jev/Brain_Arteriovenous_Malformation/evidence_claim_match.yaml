          or subarachnoid haemorrhage - the presentation that makes brain AVM a leading cause of haemorrhagic
          stroke in the young. In an individual-patient meta-analysis of four untreated cohorts spanning
          6,074 patient-years, the annual haemorrhage rate was 2.3% overall, and this figure is strongly
          conditioned on presentation: 4.8% per year in lesions that had already ruptured versus 1.3%
          per year in those that had not. Prior haemorrhage and increasing age were the independent predictors.'
      selected_evidence:
        snippet: A total of 141 hemorrhage events occurred during 6,074 patient-years of follow-up (annual
          rate of 2.3%, 95% confidence interval [CI] 2.0%-2.7%), higher for ruptured (4.8%, 3.9%-5.9%)
          than unruptured (1.3%, 1.0%-1.7%) AVMs at presentation.
