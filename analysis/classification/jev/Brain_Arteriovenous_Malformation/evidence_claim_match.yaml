          on the same RAS/MAPK output as KRAS. Endothelial-specific expression of mutant BRAF produces
          AVM-like lesions in animal models, as does mutant KRAS, which is the strongest evidence that
          pathway activation rather than the specific gene is the driver.
        gene_term:
          preferred_term: BRAF
