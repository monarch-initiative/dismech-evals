  3a7743d3380f7d53c312298a8b56c207d07ad57a72d992c74f07083b4d6e4df0:
    claim:
      about:
        disease:
          name: Brain arteriovenous malformation
          disease_term:
            preferred_term: arteriovenous malformations of the brain
            term:
              id: MONDO:0007154
              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Angiogenic and Notch Programme with Loss of Arteriovenous Identity
        biological_scale: CELLULAR
        role: central_effector
        description: 'Mutant endothelium upregulates genes of angiogenesis and Notch signalling and becomes
          abnormally migratory. Single-cell transcriptomic profiling of human AVM endothelium additionally
          shows endothelial-to-mesenchymal-transition-like features and loss of the normal arterial-versus-venous
          identity programme. Losing arteriovenous identity is the specific cellular failure that matters
          here: it is why the malformed vessels cannot resolve into a properly specified arterial-capillary-venous
          sequence and instead form a direct shunt.'
        biological_processes:
        - preferred_term: angiogenesis
          modifier: INCREASED
          term:
            id: GO:0001525
            label: angiogenesis
        - preferred_term: Notch signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007219
            label: Notch signaling pathway
        - preferred_term: cell migration
          modifier: INCREASED
          term:
            id: GO:0016477
            label: cell migration
      selected_evidence:
        snippet: increased expression of genes related to angiogenesis and Notch signaling, and enhanced
          migratory behavior. These processes were reversed by inhibition of MAPK (mitogen-activated protein
