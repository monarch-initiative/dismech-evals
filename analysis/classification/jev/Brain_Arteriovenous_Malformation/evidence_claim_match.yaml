            term:
              id: MONDO:0007154
              label: arteriovenous malformations of the brain
        context: []
      assertion_type: Treatment
      assertion:
        name: Conservative medical management
        description: 'Observation with symptomatic treatment - antiepileptic drugs for seizures, analgesia
          - without attempting to eradicate the lesion. For unruptured lesions this is a genuinely competitive
          strategy rather than a default: the ARUBA randomised trial was halted early for superiority
          of medical management, with the composite of death or symptomatic stroke reached by 10.1% on
          medical management versus 30.7% with intervention. The advantage did not decay with longer observation:
          at a mean 50.4 months the incidence of death or symptomatic stroke remained lower with medical
          management alone (3.39 vs 12.32 per 100 patient-years; hazard ratio 0.31, 95% CI 0.17 to 0.56),
          with fewer adverse events. What remains contested is whether that generalises beyond the trial''s
          enrolled population - see the `bavm-unruptured-management-controversy` discussion.'
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
        therapeutic_modality: OTHER
      selected_evidence:
        snippet: The ARUBA trial showed that medical management alone is superior to medical management
          with interventional therapy for the prevention of death or stroke in patients with unruptured
          brain arteriovenous malformations followed up for 33 months.
        supports: SUPPORT
