        context: []
      assertion_type: Diagnosis
      assertion:
        name: Somatic genotyping from lesion tissue or cell-free DNA
        description: 'This is the diagnostic consequence of the entry''s central mechanistic claim, and
          it is counterintuitive enough to be worth stating plainly: because the causative KRAS or BRAF
          mutation is a post-zygotic mosaic event confined to lesional endothelium, it is undetectable
          in blood. A conventional germline blood panel will be negative in a patient whose disease is
          entirely genetically explained. Genotyping therefore requires resected or endovascularly biopsied
          lesion tissue, or ultra-sensitive cell-free DNA methods, and the low variant allele fraction
          is the main obstacle to genotype-guided therapy.'
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        results: Detection of a somatic activating KRAS or BRAF variant in lesional tissue; a negative
          blood test does not exclude the diagnosis.
      selected_evidence:
        snippet: We detected somatic activating KRAS mutations in tissue samples from 45 of the 72 patients
          and in none of the 21 paired blood samples.
        supports: SUPPORT
