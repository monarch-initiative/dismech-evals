      assertion:
        name: Nidus Formation with Direct Arteriovenous Shunting
        biological_scale: TISSUE
        role: central_effector
        description: 'The defining anatomical lesion: a focal tangle of dilated, tortuous vessels in which
          feeding arteries connect directly to draining veins with no intervening capillary bed. The absent
          capillary bed is the mechanistically important feature, because it is the capillary bed that
          normally drops arterial pressure before blood reaches the venous side. Without it, arterial
          pressure is transmitted directly into thin-walled venous structures, and the lesion behaves
          as a low-resistance high-flow shunt.'
        cell_types:
        - preferred_term: endothelial cell of artery
          term:
