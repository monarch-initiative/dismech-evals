        relationship_type: SOMATIC_DRIVER
        variant_origin: SOMATIC
      selected_evidence:
        snippet: The identification of somatic KRAS and BRAF mutations in sporadic bAVM endothelial cells
          (ECs) has fundamentally reshaped current understanding of bAVM biology, indicating that activation
          of the RAS/MAPK pathway drives aberrant angiogenic programs.
        supports: SUPPORT
