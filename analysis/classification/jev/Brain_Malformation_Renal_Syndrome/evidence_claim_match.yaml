      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No population prevalence study exists. The founding report described four affected individuals
          (three fetuses and one child) from two families; a further consanguineous family with recurrent
          affected pregnancies was reported from a fetal exome series, and a large ciliopathy cohort listed
          EXOC3L2 among its novel candidate genes, most of which carried homozygous loss-of-function variants.
          A separate molecular-autopsy series of lethal fetal cases also proposed EXOC3L2 as a novel candidate
          gene. Fewer than ten affected individuals are on record.
      selected_evidence:
        snippet: We report four subjects from two unrelated families with homozygous mutations in the
          Exocyst Complex Component 3-Like-2 gene (EXOC3L2).
        supports: SUPPORT
