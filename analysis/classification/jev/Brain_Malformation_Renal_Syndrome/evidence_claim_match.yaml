      assertion_type: Discussion
      assertion:
        discussion_id: exoc3l2_hindbrain_kidney_mechanism
        prompt: 'How does loss of EXOC3L2 cause the hindbrain and kidney malformations: via a ciliary
          trafficking defect, as the Meckel-Gruber-like phenotype suggests, or via an endothelial VEGFR2
          signaling defect, as the cell and mouse work suggests?'
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Post-Golgi Vesicle Trafficking
        - pathophysiology#Abnormal Hindbrain Development
        - pathophysiology#Abnormal Kidney Development
        rationale: The human phenotype resembles a ciliopathy, but no ciliary defect has been tested in
          EXOC3L2-deficient cells. Mouse brain anomalies map to the endothelial and hematopoietic lineages
          without loss of neural progenitors, and the mouse kidney has not been examined. Patient-derived
          cells and renal analysis of the knockout mouse would distinguish the two models.
      selected_evidence:
        snippet: There were no significant differences between apical and basal progenitor numbers in
          WT and Exoc3l2ΔHEC KO embryos, suggesting that endothelial Exoc3l2 regulates brain development
          through other pathways.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
