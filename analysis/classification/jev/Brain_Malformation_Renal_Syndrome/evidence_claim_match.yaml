      assertion:
        name: Biallelic EXOC3L2 Loss of Function
        description: Reported alleles are a conserved-residue missense change (p.Leu41Gln), a nonsense
          variant (p.Arg72*) with no detectable protein, and a homozygous deletion of exons 3-5 found
          by copy-number analysis of exome data. EXOC3L2 co-precipitates with the exocyst subunit EXOC4
          and partly colocalizes with EXOC4 and EXOC7. No molecular function has been assigned to it beyond
          this association, so no GO molecular-function term is bound here.
        role: root
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
