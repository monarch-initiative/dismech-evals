      assertion:
        name: Defective Endothelial VEGFR2 Signaling and Directional Migration
        description: EXOC3L2 is expressed in sprouting blood vessels and induced by VEGFA in human endothelial
          cells. Silencing it reduces VEGFA-induced VEGFR2 phosphorylation and VEGFA-directed endothelial
          migration. Whether this endothelial defect contributes to the human malformations is untested.
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: vascular endothelial growth factor receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0048010
            label: vascular endothelial growth factor receptor signaling pathway
        - preferred_term: endothelial cell migration
          modifier: DECREASED
          term:
            id: GO:0043542
            label: endothelial cell migration
      selected_evidence:
        snippet: Finally, we show that exoc3l2 silencing inhibits VEGF receptor 2 phosphorylation and
          VEGFA-directed migration of cultured endothelial cells.
        supports: SUPPORT
