      assertion_type: Genetic
      assertion:
        name: NFIA
        gene_term:
          preferred_term: NFIA
          term:
            id: hgnc:7784
            label: NFIA
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'NFIA (nuclear factor I/A) encodes a nuclear factor I family transcription factor on 1p31.3.
          The disorder results from NFIA haploinsufficiency (loss of function), reached by any of three
          lesion classes: a heterozygous intragenic pathogenic variant (nonsense, frameshift, or defective
          missense), a 1p31.3 deletion removing part or all of NFIA, or a balanced translocation/rearrangement
          with a 1p31.3 breakpoint that disrupts NFIA. NFIA is the gene whose loss reproduces the shared
          phenotype across these architectures. Recurrent missense alleles (p.Lys125Glu, p.Thr395Met)
          have been shown by cross-species rescue assays to be loss-of-function.'
      selected_evidence:
        snippet: the only common genetic defect is NFIA haploinsufficiency
        supports: SUPPORT
    origin:
