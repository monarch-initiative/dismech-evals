      assertion:
        hypothesis_group_id: extracellular_matrix_insufficiency
        hypothesis_label: Extracellular basement-membrane insufficiency (loss-of-function arm)
        status: ALTERNATIVE
        description: Impaired secretion of both mutant and co-assembled wild-type heterotrimers reduces
          the amount of functional collagen IV reaching the basement membrane, producing structurally
          defective, fragile vascular basement membranes. This extracellular-insufficiency arm operates
          alongside the intracellular gain-of-function arm; their relative contributions vary by tissue,
          and disentangling them remains an open mechanistic question with therapeutic implications.
      selected_evidence:
        snippet: a semidominant mutation in the procollagen type IV alpha 1 gene (Col4a1) in mice, which
          inhibits the secretion of mutant and normal type IV collagen.
        supports: SUPPORT
