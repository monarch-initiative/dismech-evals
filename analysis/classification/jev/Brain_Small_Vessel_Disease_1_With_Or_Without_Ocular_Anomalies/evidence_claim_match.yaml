      assertion_type: Pathophysiology
      assertion:
        name: COL4A1 Glycine Substitution and Triple-Helix Destabilization
        biological_scale: MOLECULAR
        description: A heterozygous COL4A1 variant — most often a glycine substitution within the Gly-X-Y
          repeat of the triple-helical domain — disrupts the obligate glycine at every third position
          that permits tight collagen triple-helix folding. Because COL4A1 and COL4A2 co-assemble into
          a single [alpha1(IV)]2-alpha2(IV) heterotrimer that is a major component of nearly all basement
          membranes, a single mutant chain compromises the whole trimer (a dominant-negative / antimorphic
          effect).
        genes:
        - preferred_term: COL4A1
          term:
            id: hgnc:2202
            label: COL4A1
        molecular_functions:
        - preferred_term: extracellular matrix structural constituent
          term:
            id: GO:0005201
            label: extracellular matrix structural constituent
      selected_evidence:
        snippet: Heterotrimers composed of collagen type IV alpha 1 (COL4A1) and alpha 2 (COL4A2) constitute
          one of the most abundant components of nearly all basement membranes.
        supports: SUPPORT
    origin:
