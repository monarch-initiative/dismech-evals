        context:
        - path: /pathophysiology/0
          value:
            name: COL4A1 Glycine Substitution and Triple-Helix Destabilization
            biological_scale: MOLECULAR
            description: A heterozygous COL4A1 variant — most often a glycine substitution within the
              Gly-X-Y repeat of the triple-helical domain — disrupts the obligate glycine at every third
              position that permits tight collagen triple-helix folding. Because COL4A1 and COL4A2 co-assemble
              into a single [alpha1(IV)]2-alpha2(IV) heterotrimer that is a major component of nearly
              all basement membranes, a single mutant chain compromises the whole trimer (a dominant-negative
              / antimorphic effect).
            genes:
            - preferred_term: COL4A1
              term:
                id: hgnc:2202
                label: COL4A1
            molecular_functions:
            - preferred_term: extracellular matrix structural constituent
              term:
                id: GO:0005201
                label: extracellular matrix structural constituent
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired Collagen IV Secretion and ER Stress
        description: The misfolded triple helix cannot be secreted efficiently, retaining mutant and co-assembled
          wild-type heterotrimers inside the cell.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: a semidominant mutation in the procollagen type IV alpha 1 gene (Col4a1) in mice, which
          inhibits the secretion of mutant and normal type IV collagen.
        supports: SUPPORT
    origin:
