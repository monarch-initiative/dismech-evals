      assertion_type: ImagingFinding
      assertion:
        name: Small-vessel disease on brain MRI
        description: Diffuse periventricular leukoencephalopathy, lacunar infarcts, microhemorrhage, dilated
          perivascular spaces, deep intracerebral hemorrhages, and porencephalic cavities are the characteristic
          MRI features. Extensive leukoaraiosis can be present in asymptomatic adult carriers.
      selected_evidence:
        snippet: 'The spectrum of COL4A1-related disorders includes: small-vessel brain disease of varying
          severity including porencephaly, variably associated with eye defects (retinal arterial tortuosity,
          Axenfeld-Rieger anomaly, cataract) and systemic findings (kidney involvement, muscle cramps,
          cerebral aneurysms, Raynaud phenomenon, cardiac arrhythmia, and hemolytic anemia). On imaging
          studies, small-vessel brain disease is manifest as diffuse periventricular leukoencephalopathy,
          lacunar infarcts, microhemorrhage, dilated perivascular spaces, and deep intracerebral hemorrhages.
          ... Porencephaly (fluid-filled cavities in the brain detected by CT or MRI) is typically manifest
          as infantile hemiparesis, seizures, and intellectual disability; however, on occasion it can
          be an incidental finding.'
        supports: SUPPORT
