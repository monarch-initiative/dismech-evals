        hypothesis_label: Intracellular collagen retention and ER stress (gain-of-function)
        status: CANONICAL
        description: Mutant heterotrimers are retained within the endoplasmic reticulum, triggering ER
          stress and the unfolded protein response with reduced proliferation, apoptosis, and cytotoxicity.
          In mouse models, intracellular accumulation of mutant collagen in vascular endothelial cells
          and pericytes is a key trigger of intracerebral hemorrhage, and an FDA-approved chemical chaperone
          reduces the accumulation — evidence that the intracellular toxicity arm is a driver, not a bystander.
      selected_evidence:
        snippet: two of the three putative mutations found in patients trigger ER stress and activate
          the unfolded protein response.
        supports: SUPPORT
