              label: brain small vessel disease 1 with or without ocular anomalies
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bsvd1_intracellular_vs_extracellular_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: To what extent is COL4A1-related disease driven by intracellular collagen retention with
          ER stress (gain of function) versus extracellular basement-membrane insufficiency (loss of function),
          and does the balance differ by tissue?
        attaches_to:
        - pathophysiology#Impaired Collagen IV Secretion and ER Stress
        rationale: 'Both arms are experimentally supported: pathogenic variants trigger ER stress and
          the unfolded protein response, and intracellular accumulation in vascular endothelial cells
          and pericytes is a key hemorrhage trigger in mice; yet the same variants also reduce secretion
          of functional collagen IV into the basement membrane. The relative contribution matters therapeutically
          — a predominantly intracellular mechanism favors chaperone/proteostasis strategies, whereas
          a predominantly extracellular mechanism favors matrix-restoration or gene-based approaches —
          and appears to vary by tissue. Resolving the balance per tissue is an open question.'
      selected_evidence:
        snippet: Our data suggest that COL4A2 mutations impair COL4A1 and COL4A2 secretion and can also
          result in cytotoxicity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
