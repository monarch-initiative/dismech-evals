      assertion_type: Genetic
      assertion:
        name: COL4A1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: COL4A1
          term:
            id: hgnc:2202
            label: COL4A1
        notes: 'COL4A1 encodes the alpha-1 chain of type IV collagen. Approximately 90% of pathogenic
          variants are missense substitutions of a glycine in the Gly-X-Y repeat of the triple-helical
          collagenous domain; nonsense, splice, indel, and start-codon variants also occur. Because the
          position of the substitution within the molecule influences which phenotypes predominate, a
          genotype-phenotype correlation exists: variants clustering in exons 24-25 are associated with
          the HANAC systemic (renal/muscular/aneurysmal) phenotype, while variants distributed more broadly
          are associated with severe porencephaly and cerebral small-vessel disease. The obligate partner
          gene COL4A2 causes a closely overlapping phenotype (brain small vessel disease 2), because the
          two chains obligately co-assemble into a shared heterotrimer.'
      selected_evidence:
        snippet: glycine (Gly) substitutions within the triple helical domain are the most common class
          of mutations.
        supports: SUPPORT
    origin:
