        description: Endothelin-1 is a potent vasoconstrictor. In mice lacking both cathepsin A and its
          homolog SCPEP1 activity, endothelin-1 is degraded more slowly, arteries constrict more to it
          and blood pressure rises on a high-salt diet; single deficiency is milder. Extending this to
          CARASAL hypertension and arteriopathy is an inference.
        biological_scale: TISSUE
