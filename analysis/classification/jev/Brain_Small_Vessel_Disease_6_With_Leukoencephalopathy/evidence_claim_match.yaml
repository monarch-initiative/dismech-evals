        description: Patients have smaller extraocular rectus muscles and less intraorbital fat than controls,
          and many report muscle cramps. The authors of the largest cohort propose that endothelin-1,
          which impairs muscle myogenesis and causes atrophy in mice and stimulates adipocyte lipolysis,
          links these features. No study has tested this in CARASAL.
