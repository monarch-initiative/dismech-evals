  72affc278d89cc1d1bdd87b2e4cb6c33a197c6d1f95b90f17a4732a7e280ff2f:
    claim:
      about:
        disease:
          name: Branchiooculofacial Syndrome
          disease_term:
            preferred_term: branchiooculofacial syndrome
            term:
              id: MONDO:0007235
              label: branchiooculofacial syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TFAP2A Dysfunction Disrupts Cranial Neural Crest Development
        description: 'BOFS is caused by heterozygous pathogenic variants affecting TFAP2A, encoding the
          transcription factor AP-2 alpha. TFAP2A is expressed in premigratory and migratory neural crest
          cells and regulates gene expression during embryogenesis of the eye, ear, face, and related
          structures. Most BOFS families carry missense variants clustered in the highly conserved exons
          4 and 5 (basic DNA-binding domain); deletions, nonsense, splice-altering, and regulatory (enhancer-disconnecting)
          variants also cause BOFS. Functional studies show these mutations reduce transcriptional activity,
          alter nuclear localization of AP-2 alpha, and can act as null, hypomorphic, or dominant-negative
          (antimorphic) alleles. The combination of cleft lip/palate, premature graying, coloboma, heterochromia
          irides, and ectopic thymus is cited as evidence that BOFS is a neurocristopathy.

          '
        cell_types:
        - preferred_term: cranial neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        biological_processes:
        - preferred_term: Neural crest cell development
          term:
            id: GO:0014032
            label: neural crest cell development
          modifier: DECREASED
        - preferred_term: Regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: Four additional BOFS patients were found to have de novo missense mutations in the highly
          conserved exons 4 and 5 (basic region of the DNA binding domain) of the TFAP2A gene in the candidate
          deleted region. We conclude BOFS is caused by mutations involving TFAP2A.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18423521
      reference_title: TFAP2A mutations result in branchio-oculo-facial syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Original identification of TFAP2A coding mutations and a deletion as the cause of BOFS.
