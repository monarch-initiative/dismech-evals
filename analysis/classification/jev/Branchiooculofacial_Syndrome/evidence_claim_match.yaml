        gene_term:
          preferred_term: TFAP2A
          term:
            id: hgnc:11742
            label: TFAP2A
        inheritance:
        - name: Autosomal dominant
        variants:
        - name: TFAP2A regulatory-domain inversion inv(6)(p24.3;q16.2) (Laugsch et al., 2019)
          variant_type: inversion
          regulatory_target_gene:
            preferred_term: TFAP2A
            term:
              id: hgnc:11742
              label: TFAP2A
          description: De novo heterozygous approximately 89 Mb inversion, with reported hg19 breakpoints
            chr6:10,355,280 and chr6:99,103,873. The 6p24.3 breakpoint is approximately 40 kb downstream
            of TFAP2A and disconnects its intact coding sequence from neural crest enhancers. This is
            patient Nr1 in POSTRE Table 1 and Table1_LongRange_SVs.tsv; no coordinate conversion or inferred
            nucleotide HGVS representation is applied.
          functional_effects:
          - function: TFAP2A gene expression in human neural crest cells
            type: Reduced gene expression
            regulatory_element_type: ENHANCER
            regulatory_mechanism: Enhancer disconnection by inversion
            description: Patient-derived hiPSC differentiation demonstrates monoallelic and haploinsufficient
              TFAP2A expression in human neural crest cells. No enhancer adoption by newly neighboring
              genes was detected. The evidence does not resolve LOE versus mLOE across other lineages.
        notes: 'Heterozygous pathogenic variants in TFAP2A (encoding transcription factor AP-2 alpha;
          gene OMIM 107580, locus 6p24.3) cause autosomal dominant BOFS. The mutational spectrum includes
          recurrent missense variants in the conserved DNA-binding domain (exons 4-5), nonsense and splice
          variants, small indels/frameshifts, whole- or multi-exon deletions (including a 3.2 Mb deletion
          in the original family), and mosaicism. A de novo inversion can also leave TFAP2A coding sequence
          intact while disconnecting neural crest enhancers and reducing TFAP2A expression. No genetic
          heterogeneity has been established.

          '
      selected_evidence:
        snippet: We detected a 3.2 Mb deletion by 500K SNP microarray in an affected mother and son with
          BOFS at chromosome 6p24.3.
        supports: SUPPORT
