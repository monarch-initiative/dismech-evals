      assertion_type: Pathophysiology
      assertion:
        name: Reduced and Dominant-Negative AP-2 alpha Transcriptional Activity
        description: 'Individual TFAP2A BOFS mutations within the DNA-binding region have different effects
          on DNA binding but all significantly reduce transcriptional activity. Mutant AP-2 alpha proteins
          show altered nuclear:cytoplasmic distribution compared with the predominantly nuclear wild-type
          protein, and several can exert dominant-negative activity on wild-type AP-2 alpha. These differences
          mean individual variants can generate null, hypomorphic, or antimorphic alleles, contributing
          to the marked phenotypic variability of BOFS.

          '
        gene:
          preferred_term: TFAP2A
          term:
            id: hgnc:11742
            label: TFAP2A
        biological_processes:
        - preferred_term: Regulation of DNA-templated transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: DECREASED
      selected_evidence:
        snippet: We show that although individual mutations have different effects on DNA binding, they
          all demonstrate significantly reduced transcriptional activities.
        supports: SUPPORT
