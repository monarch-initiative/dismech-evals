        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chromosome 6 Inversion Disconnecting the TFAP2A Regulatory Domain
        biological_scale: MOLECULAR
        genetic_context:
          variant_type: inversion
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
          description: De novo approximately 89 Mb inversion inv(6)(p24.3;q16.2), with reported hg19 breakpoints
            chr6:10,355,280 and chr6:99,103,873. The 6p24.3 breakpoint lies approximately 40 kb downstream
            of TFAP2A; the TFAP2A coding sequence remains intact. This is a large chromosomal rearrangement
            with a demonstrated regulatory effect, not a claim that its entire span consists of noncoding
            sequence.
        description: A BOFS-associated heterozygous inversion separates an intact TFAP2A allele from neural
          crest enhancers within its original topologically associating domain. The experimentally studied
          allele is POSTRE Table 1 patient Nr1. Its physical alteration is distinct from the resulting
          loss of enhancer contact and reduced expression.
      selected_evidence:
        snippet: Here, we present a BOFS patient carrying a heterozygous inversion with one breakpoint
          located within a topologically associating domain (TAD) containing enhancers essential for TFAP2A
          expression in human neural crest cells (hNCCs).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30982769
      reference_title: Modeling the Pathological Long-Range Regulatory Effects of Human Structural Variation
        with Patient-Specific hiPSCs.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the clinical inversion and the affected TFAP2A regulatory domain. The reported
        hg19 breakpoints also identify patient Nr1 in POSTRE's Table1_LongRange_SVs.tsv.
