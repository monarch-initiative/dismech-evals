      assertion_type: Pathophysiology
      assertion:
        name: TFAP2 Regulation of Midfacial Neural Crest Gene Networks (ALX axis)
        description: 'In mouse and zebrafish models, TFAP2 paralogs (Tfap2a and Tfap2b) regulate midfacial
          development of the cranial neural crest. Concerted inactivation in the neural crest produces
          a midfacial cleft and skeletal abnormalities, with dysregulation of midface gene regulatory
          network components. TFAP2 factors directly and positively regulate the ALX transcription factor
          genes (Alx1, Alx3, Alx4); loss of TFAP2 reduces ALX transcript levels. This provides a developmental
          mechanism linking TFAP2A dysfunction to the midfacial clefting characteristic of BOFS.

          '
        biological_processes:
        - preferred_term: Neural crest cell migration
          term:
            id: GO:0001755
            label: neural crest cell migration
      selected_evidence:
        snippet: Alx1, Alx3 and Alx4 (ALX) transcript levels are reduced, whereas ChIP-seq analyses suggest
          TFAP2 family members directly and positively regulate ALX gene expression.
        supports: SUPPORT
