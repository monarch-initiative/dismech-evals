      assertion_type: Pathophysiology
      assertion:
        name: EMT-Driven Dissemination
        conforms_to: invasion_and_metastasis#Epithelial-Mesenchymal Transition Activation
        description: Metastatic breast carcinoma acquires motile and invasive phenotypes through epithelial
          to mesenchymal transition and related plasticity programs. EMT reduces epithelial adhesion,
          increases migratory behavior, and facilitates escape from the primary tumor, intravasation,
          and colonization of distant tissue niches.
        biological_processes:
        - preferred_term: epithelial to mesenchymal transition
          modifier: INCREASED
          term:
            id: GO:0001837
            label: epithelial to mesenchymal transition
        - preferred_term: cell migration
          modifier: INCREASED
          term:
            id: GO:0016477
            label: cell migration
        - preferred_term: positive regulation of cell migration
          modifier: INCREASED
          term:
            id: GO:0030335
            label: positive regulation of cell migration
      selected_evidence:
        snippet: The metastasis of cancer cells from the primary tumor site to other organs in the body,
          notably the lungs, bones, brain, and liver, is what causes breast cancer to ultimately be fatal.
        supports: SUPPORT
