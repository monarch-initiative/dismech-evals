        name: ER and HER2 Receptor Heterogeneity
        description: Intratumoral spatial heterogeneity in estrogen receptor (ER), progesterone receptor
          (PR), and HER2 expression occurs in a meaningful subset of breast tumors, with biomarker status
          differing between sampled regions of the same tumor. This heterogeneity affects breast cancer
          classification accuracy from biopsy sampling and has clinical implications for selecting endocrine
          and HER2-targeted therapy.
        biological_processes:
        - preferred_term: estrogen receptor signaling pathway
          modifier: ABNORMAL
          term:
            id: GO:0030520
            label: estrogen receptor signaling pathway
        - preferred_term: cell surface receptor protein tyrosine kinase signaling pathway
          modifier: ABNORMAL
          term:
            id: GO:0007169
            label: cell surface receptor protein tyrosine kinase signaling pathway
      selected_evidence:
        snippet: Intratumoral biomarker heterogeneity may impact breast cancer classification accuracy,
          with implications for clinical management.
        supports: SUPPORT
