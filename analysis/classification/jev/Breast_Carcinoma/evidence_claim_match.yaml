      assertion_type: Stage
      assertion:
        name: Metastatic
        description: Advanced breast carcinoma disseminated to distant organs, with particular tropism
          for bone, lung, brain, and liver. Receptor status may differ between primary and metastatic
          lesions, and systemic therapy is selected by the receptor and genomic profile of the metastatic
          disease.
        notes: This stage carries the content of the former Metastatic_Breast_Carcinoma entry (cancer
          granularity ladder, design decisions §3a). Brain metastases occur in up to 30% of advanced breast
          cancer cases, and 5-year survival differs sharply by intrinsic subtype.
      selected_evidence:
        snippet: Brain metastases occur in as many as 30% of patients with advanced breast cancer, and
          the 1-year survival rate of these patients is around 20%.
        supports: SUPPORT
