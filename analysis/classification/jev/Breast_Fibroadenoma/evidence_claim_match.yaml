        name: Stromal MED12 Exon-2 Driver Mutation
        description: Recurrent somatic MED12 exon-2 mutations are the principal known driver of conventional
          breast fibroadenomas. They occur in approximately 59%-65% of tumors and are restricted to the
          neoplastic stromal rather than epithelial component, establishing fibroadenoma as a stromally
          driven biphasic lesion.
        genes:
        - preferred_term: MED12
          term:
            id: hgnc:11957
            label: MED12
      selected_evidence:
        snippet: Using laser capture microdissection, we show that MED12 fibroadenoma mutations are present
          in stromal but not epithelial mammary cells.
        supports: SUPPORT
