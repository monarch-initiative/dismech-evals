          activity in the developing nipple-areola epithelium perturbs cell-cell contact, peptide growth
          factor signaling or canonical Wnt signaling. This node records that hypothesis; which, if any,
          of these routes operates in nipple development has not been tested.
        biological_scale: CELLULAR
