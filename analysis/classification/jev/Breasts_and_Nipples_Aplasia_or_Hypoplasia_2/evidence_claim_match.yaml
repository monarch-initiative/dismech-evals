          at epithelial junctions. In the translocation case, one allele was disrupted and PTPRF RNA and
          protein were severely reduced in lymphoblastoid cells, which is consistent with near-complete
          loss of function, though the second hit was not identified.
        biological_scale: MOLECULAR
