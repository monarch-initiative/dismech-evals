        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of PRDM5 or ZNF469 Transcriptional Regulator Function
        biological_scale: MOLECULAR
        description: The initiating lesion is biallelic loss of function in one of two transcriptional
          regulators that act in a shared pathway. PRDM5 is a PR-domain zinc finger repressor; ZNF469
          is a zinc finger protein of previously undefined function identified as a quantitative trait
          locus for central corneal thickness. The demonstration that they participate in the same regulatory
          pathway is what licenses curating BCS as one disease with two genotypic subtypes rather than
          two sibling diseases.
        genes:
        - preferred_term: PRDM5
          term:
            id: hgnc:9349
            label: PRDM5
        - preferred_term: ZNF469
          term:
            id: hgnc:23216
            label: ZNF469
        biological_processes:
        - preferred_term: regulation of DNA-templated transcription
          term:
            id: GO:0006355
            label: regulation of DNA-templated transcription
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: We show that ZNF469 and PRDM5, two genes that when mutated cause BCS, participate in
          the same regulatory pathway.
        supports: SUPPORT
    origin:
