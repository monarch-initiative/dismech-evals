      assertion_type: Diagnosis
      assertion:
        name: Recognition against overlapping connective tissue disorders
        description: The hard part of diagnosis is not the test but reaching it. BCS overlaps phenotypically
          with other heritable connective tissue disorders, and corneal rupture as a presenting event
          in a child has been misattributed to non-accidental injury. Early recognition is what prevents
          avoidable blindness.
      selected_evidence:
        snippet: Effective management depends upon appropriate identification of affected individuals,
          which may be challenging given the phenotypic overlap of BCS with other connective tissue disorders.
        supports: SUPPORT
