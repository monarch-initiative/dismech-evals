      assertion_type: Pathophysiology
      assertion:
        name: Corneal Stromal Thinning and Biomechanical Failure
        biological_scale: TISSUE
        description: The cornea becomes extremely thin - central corneal thickness below 400 micrometres
          in the large majority of patients, against a normal range of 515 to 575, with a thinnest point
          of 151 and 157 micrometres in two reported cases - and loses the tensile strength needed to
          contain intraocular pressure. Thinning is most pronounced centrally, with the periphery relatively
          preserved. The same matrix deficiency produces protrusion (keratoglobus, keratoconus), scleral
          thinning visible as blue sclerae, and axial elongation manifesting as high myopia.
        locations:
        - preferred_term: cornea
          term:
            id: UBERON:0000964
            label: cornea
        cell_types:
        - preferred_term: corneal keratocyte
          term:
            id: CL:0002363
            label: keratocyte
      selected_evidence:
        snippet: Two siblings-a 28-year-old male and a 25-year-old female-presented with progressive visual
          deterioration and marked corneal thinning
        supports: SUPPORT
