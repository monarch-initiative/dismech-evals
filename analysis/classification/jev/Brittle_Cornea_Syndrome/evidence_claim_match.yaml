  5d80af738517eff9cc4b6cd34202d892dba593536f35844cbed103ddf413696a:
    claim:
      about:
        disease:
          name: Brittle Cornea Syndrome
          disease_term:
            preferred_term: Brittle Cornea Syndrome
            term:
              id: MONDO:0009242
              label: brittle cornea syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Repressive Chromatin Complex Recruitment at ECM Target Genes
        biological_scale: MOLECULAR
        description: PRDM5 acts by recruiting repressive complexes and depositing H3K9 di-methylation
          at target genes. The BCS2 missense allele p.Arg83Cys is mechanistically informative because
          it leaves the DNA-binding zinc fingers intact and instead diminishes interaction with the NuRD
          component CHD4 and with HP1BP3, showing that loss of the protein-protein interaction alone is
          sufficient to cause disease. Patient fibroblasts carrying truncating alleles show dysregulated
          H3K9me2, and ECM stability mediators are upregulated - the direction expected from loss of a
          repressor, and worth noting because the net downstream consequence is nonetheless a structurally
          deficient matrix.
        genes:
        - preferred_term: PRDM5
          term:
            id: hgnc:9349
            label: PRDM5
        biological_processes:
        - preferred_term: negative regulation of transcription by RNA polymerase II
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
          modifier: LOSS_OF_FUNCTION
        cell_types:
        - preferred_term: dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: demonstrate that the BCS2 mutation p.Arg83Cys diminishes interaction of PRDM5 with repressive
          complexes, including NuRD complex protein CHD4, and the repressive chromatin interactor HP1BP3,
          by co-immunoprecipitation combined with mass spectrometry.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26395458
      reference_title: A role for repressive complexes and H3K9 di-methylation in PRDM5-associated brittle
        cornea syndrome.
      evidence_source: IN_VITRO
      explanation: Identifies the specific protein-protein interactions lost, and shows a missense allele
        can be pathogenic without disrupting DNA binding.
