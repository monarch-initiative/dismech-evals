        subtype_term:
          preferred_term: brittle cornea syndrome 2
          term:
            id: MONDO:0013605
            label: brittle cornea syndrome 2
        description: Caused by biallelic PRDM5 variants. PRDM5 is a PR-domain transcriptional repressor
          that recruits chromatin-modifying complexes to extracellular matrix target genes. Both truncating
          alleles (p.Arg590*, p.Glu134*, p.Cys325LeufsX2, deletion of exons 9-14) and at least one missense
          allele (p.Arg83Cys) are pathogenic, and they fail in mechanistically different ways - the truncations
          remove zinc finger and PR domains outright, while p.Arg83Cys leaves DNA binding intact and instead
          disrupts recruitment of repressive complexes.
        genes:
        - preferred_term: PRDM5
          term:
            id: hgnc:9349
            label: PRDM5
      selected_evidence:
        snippet: Using autozygosity mapping, we identified mutations in PRDM5 in families with BCS.
