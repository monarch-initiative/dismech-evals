        context: []
      assertion_type: Treatment
      assertion:
        name: Corneal Collagen Cross-Linking
        description: Photochemical stiffening of the corneal stroma. It is the only reported intervention
          that acts on the biomechanical lesion itself rather than on the rupture event, but the evidence
          is two paediatric cases, not a series. The standard (Dresden) protocol is contraindicated below
          200 micrometres, which excludes most brittle corneas; both reported patients were treated with
          a transepithelial protocol and UV fluence scaled to their thickness. Curated as an emerging
          option, not a standard of care.
        treatment_term:
          preferred_term: corneal collagen cross-linking
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
        therapeutic_modality: DEVICE
      selected_evidence:
        snippet: In these two cases, conventional cross-linking was not considered due to contraindications
          for corneal thickness less than 200 µm.
        supports: SUPPORT
