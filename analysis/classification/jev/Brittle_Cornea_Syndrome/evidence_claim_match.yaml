      assertion_type: Diagnosis
      assertion:
        name: ZNF469 and PRDM5 molecular genetic testing
        presence: Positive
        description: Molecular diagnosis is available and effective, because the two known genes together
          account for the condition in nearly all ascertained patients. It also identifies heterozygous
          carriers, which matters in the consanguineous kindreds in which BCS is most often seen. Whole-exome
          sequencing is the route used in recent genetically confirmed cases.
      selected_evidence:
        snippet: Two genes, ZNF469 and PRDM5, have now been identified, in which causative pathogenic
          mutations collectively account for the condition in nearly all patients with BCS ascertained
          to date. Therefore, effective molecular diagnosis is now available for affected patients, and
          those at risk of being heterozygous carriers for BCS.
        supports: SUPPORT
