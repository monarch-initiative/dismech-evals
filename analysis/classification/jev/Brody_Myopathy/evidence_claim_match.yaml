        name: CFTR Correctors (Investigational)
        description: A repurposing strategy aimed at the folding defect rather than the symptoms. Small
          molecules developed to chaperone misfolded CFTR through quality control also rescue misfolded
          SERCA1, restoring pump abundance at the sarcoplasmic reticulum membrane. The corrector C17 was
          effective in vitro and in cattle, whereas the licensed cystic fibrosis correctors lumacaftor
          and tezacaftor were not efficient. This has not been tested in humans.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        notes: The allele restriction is the most important qualifier on this approach and is easy to
          lose. Correctors can only rescue a protein that exists and works; they offer nothing to patients
          whose alleles are nonsense, frameshift, splice, or deletion variants producing no protein at
          all. Any future clinical application requires genotype stratification.
      selected_evidence:
        snippet: may be a potential innovative pharmacological approach addressing Brody patients in which
          mutated SERCA1 retains its activity
        supports: SUPPORT
