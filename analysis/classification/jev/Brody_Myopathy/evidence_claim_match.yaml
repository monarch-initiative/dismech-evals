      assertion_type: Pathophysiology
      assertion:
        name: Selective Type II Fibre Involvement
        biological_scale: TISSUE
        description: 'SERCA1 is the fast-twitch isoform; slow fibres run SERCA2a from a different gene
          and are therefore spared. This single fact explains the distribution of the disease: the muscles
          that stiffen are fast-twitch-rich, which is why eyelid closure through orbicularis oculi is
          affected in roughly two thirds of patients while cardiac muscle, running SERCA2a, is entirely
          uninvolved. The biopsy correlate is selective type II fibre atrophy without myonecrosis.'
        cell_types:
        - preferred_term: type II skeletal muscle fibre
          term:
            id: CL:0002212
            label: type II muscle cell
      selected_evidence:
        snippet: encoding the sarco(endo)plasmic reticulum Ca(2+) ATPase type 1 (SERCA1), a calcium pump,
          expressed in fast-twitch muscles
        supports: SUPPORT
