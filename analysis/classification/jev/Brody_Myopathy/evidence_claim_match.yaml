      assertion_type: DifferentialDiagnosis
      assertion:
        name: Canine paradoxical pseudomyotonia
        description: Included as a cross-species comparator rather than a human differential. In English
          Cocker and Springer Spaniels an exercise-induced myotonic-like stiffness closely resembling
          bovine pseudomyotonia and human Brody disease is caused by an SLC7A10 nonsense variant, not
          by ATP2A1. It is a reminder that the clinical picture of exercise-induced failure of relaxation
          is reachable through more than one gene.
      selected_evidence:
        snippet: This disease is characterised by episodes of exercise-induced generalised myotonic-like
          muscle stiffness, phenotypically similar to congenital pseudomyotonia in cattle, and paramyotonia
          congenita and Brody disease in people.
        supports: SUPPORT
