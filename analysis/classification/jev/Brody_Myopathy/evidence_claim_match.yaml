      assertion_type: Treatment
      assertion:
        name: Symptomatic Pharmacotherapy
        description: Calcium channel blockers, dantrolene, mexiletine, carbamazepine, and others have
          been tried. The honest summary from the largest cohort is that symptomatic treatment was mostly
