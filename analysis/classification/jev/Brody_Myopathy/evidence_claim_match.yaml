      assertion_type: Pathophysiology
      assertion:
        name: Biallelic ATP2A1 Loss of Function
        biological_scale: MOLECULAR
        description: 'Recessive loss-of-function variants on both ATP2A1 alleles. Two mechanistic routes
          converge on the same deficit: truncating, splice, and deletion alleles yield little or no SERCA1
          protein, while a subset of missense alleles yield a protein that folds badly but retains catalytic
          activity. The distinction is not academic, because only the second group is addressable by strategies
          that stabilise the protein through quality control.'
        molecular_functions:
        - preferred_term: SERCA1 P-type calcium transporter activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005388
            label: P-type calcium transporter activity
      selected_evidence:
        snippet: how have these Brody patients partially compensated for the functional knockout
        supports: SUPPORT
