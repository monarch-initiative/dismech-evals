              label: Brody myopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Compensatory Calcium Extrusion and Handling
        biological_scale: CELLULAR
        description: 'Alternative calcium-removal mechanisms recruited in the face of SERCA1 deficiency,
          which appear to be why the human disease is mild rather than lethal. Candidate contributors
          include the sarcolemmal calcium extrusion pump (PMCA), the sodium-calcium exchanger, mitochondrial
          uptake, and upregulation of the SERCA2 isoform. Which of these actually carries the load in
          human muscle is unresolved, and the two leading candidates are recorded as competing hypotheses
          rather than as a settled chain. The branch is included in the pathograph because it is load-bearing
          for prognosis: without it, the expectation from the mouse null would be neonatal death.'
        biological_processes:
        - preferred_term: calcium ion transmembrane transport
          modifier: INCREASED
          term:
            id: GO:0070588
            label: calcium ion transmembrane transport
      selected_evidence:
        snippet: Calcium removal mechanisms, operating in muscle fibers as compensatory response aimed
          at lowering excessive cytoplasmic calcium concentration caused by SERCA1 deficiency, could explain
          the difference in severity of clinical signs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
