      assertion:
        name: Delayed muscle relaxation
        category: Neuromuscular
        description: The key examination finding, elicited by asking the patient to contract repeatedly
          and observing that each relaxation takes longer than the last. Deliberately left without an
          ontology binding. HPO has no term for delayed relaxation as a sign; the nearest candidates are
          Muscle stiffness, which duplicates the exertional stiffness phenotype already recorded here,
          and Myotonia, which is a curated exclusion in this disease. Binding this sign to a myotonia
          term would encode precisely the misdiagnosis that the electrically silent contracture exists
          to rule out, so the phenotype is carried as free text until a suitable term exists.
      selected_evidence:
        snippet: The key finding at physical examination was delayed relaxation after repetitive contractions.
        supports: SUPPORT
