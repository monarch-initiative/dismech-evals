              label: Brody myopathy
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Electromyography showing silent contractures without myotonic discharges
        description: 'The pivotal diagnostic observation, and the reason the disease is so often misdiagnosed.
          Needle EMG during the stiffness records nothing, because the fault lies downstream of the sarcolemma.
          The cohort turns this into an active manoeuvre rather than a passive finding: when a patient
          looks myotonic but shows no myotonic discharges, provoke contractures with rapid repeated contraction
          during the study instead of stopping at the negative result.'
      selected_evidence:
        snippet: Therefore, when EMG shows no myotonic discharges in patients clinically suspected of
          having a myotonic disorder, provocation of possible silent contractures is recommended by performing
          rapid contractions during EMG.
        supports: SUPPORT
