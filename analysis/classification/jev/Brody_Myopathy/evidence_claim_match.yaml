        hypothesis_label: Sarcolemmal calcium extrusion compensates for SERCA1 loss
        status: EMERGING
        description: Holds that the calcium load left by the missing sarcoplasmic reticulum pump is handled
          principally by exporting calcium across the sarcolemma, via the plasma-membrane calcium ATPase
          and related extrusion mechanisms, rather than by an alternative sarcoplasmic reticulum pump.
          The bovine work supports this directly, reporting increased sarcolemmal extrusion pump expression
          in the same muscle in which SERCA2 compensation was excluded.
        notes: EMERGING rather than CANONICAL because the direct evidence is bovine and from a single
          case, and because no human muscle study has measured extrusion-pump activity in Brody myopathy.
