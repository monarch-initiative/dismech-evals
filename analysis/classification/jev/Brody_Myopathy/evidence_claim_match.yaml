      assertion_type: Pathophysiology
      assertion:
        name: Proteasomal Degradation of Misfolded SERCA1
        biological_scale: MOLECULAR
        description: For missense alleles, the mutant pump is corrupted in folding but not in catalysis.
          The ubiquitin-proteasome system recognises the misfolded protein and strips it out before it
          reaches the sarcoplasmic reticulum membrane, so the fibre loses a pump that would have worked
          had it arrived. Proteasome inhibition restores both the expression level and the membrane localisation
          of the mutant, and the rescued protein handles calcium like wild type. This node is the therapeutic
          vulnerability behind the corrector strategy.
        biological_processes:
        - preferred_term: proteasome-mediated degradation of misfolded SERCA1
          modifier: INCREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
      selected_evidence:
        snippet: the mutation generates a protein most likely corrupted in proper folding but not in catalytic
          activity
        supports: SUPPORT
