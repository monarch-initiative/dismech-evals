      assertion_type: DifferentialDiagnosis
      assertion:
        name: Brody syndrome (gene-negative)
        description: 'Clinically and biochemically similar exercise-induced impairment of relaxation with
          reduced SERCA activity, but without identifiable ATP2A1 variants. It is genetically unsolved
          and reported to differ clinically: myalgia is more common and the impact on daily life greater
          than in gene-confirmed Brody disease. It is the most important boundary on this entry, since
          a patient can meet the clinical and biochemical description and still not belong here.'
      selected_evidence:
        snippet: Patients with Brody syndrome more often report myalgia
        supports: SUPPORT
