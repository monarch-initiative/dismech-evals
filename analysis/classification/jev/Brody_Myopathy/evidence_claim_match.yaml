      assertion_type: AnimalModel
      assertion:
        name: Atp2a1-null mouse
        species: Mouse
        genotype: Atp2a1 homozygous null
        publication: PMID:12556521
        description: Complete targeted disruption of Atp2a1. The mice die within hours of birth from respiratory
          failure attributed to diaphragm dysfunction, a course with no counterpart in human disease,
          where respiratory involvement is absent entirely. The model is included because its failure
          is informative rather than merely inconvenient.
        modeled_mechanisms:
        - target: Compensatory Calcium Extrusion and Handling
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The mouse does not reproduce the compensation that makes the human disease survivable.
            Humans with essentially absent SERCA1 have a mild, non-progressive myopathy with no respiratory
            involvement, whereas the null mouse dies at birth of diaphragm failure. Whatever carries the
            calcium load in human muscle is either absent in the mouse or cannot meet the acute respiratory
            demand of birth.
          limitations: A complete null is a poor genetic match for most human genotypes, which retain
            residual protein or residual activity, so some of the gap between species may be allele severity
            rather than species biology. The lethality also prevents the model from ever being used to
            study the exertional, adult-onset phenotype that defines the human disease.
      selected_evidence:
        snippet: No mouse model nor specific therapies exist for Brody myopathy, which is therefore considered
          an orphan disease
        supports: SUPPORT
