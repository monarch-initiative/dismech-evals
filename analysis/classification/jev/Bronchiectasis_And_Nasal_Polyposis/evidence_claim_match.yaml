            term:
              id: MONDO:0975835
              label: bronchiectasis and nasal polyposis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Preserved Mucociliary Clearance
        biological_scale: CELLULAR
        description: 'Recorded as an explicitly excluded step rather than omitted. Because WFDC2 is a
          secreted airway protein, impaired mucociliary clearance is the natural hypothesis, and it is
          the mechanism by which both diseases this disorder mimics - cystic fibrosis and primary ciliary
          dyskinesia - cause bronchiectasis. It was tested and did not hold. In patient-derived cultures
          at air-liquid interface, ciliary beat frequency was normal, ciliary length was unchanged, epithelial
          morphology and cilia and centrosome composition were comparable to controls, mucus viscosity
          was no different, and the cultures generated directed mucociliary transport. Transport speed
          was low relative to controls, but the authors'' own conclusion is that clearance is within the
          normal range.

          This node carries no downstream edge on purpose: the point is that the expected link to airway
          destruction is absent. The residual transport-speed observation is the loose end, and it is
          captured as a knowledge gap rather than promoted to a mechanism.'
        biological_processes:
        - preferred_term: mucociliary clearance
          term:
            id: GO:0120197
            label: mucociliary clearance
      selected_evidence:
        snippet: Taken together, our results suggest that WFDC2-deficient respiratory epithelia likely
          have a level of mucociliary clearance that is within the normal range.
        supports: SUPPORT
        directness: DIRECT
    origin:
