      assertion_type: Genetic
      assertion:
        name: WFDC2
        gene_term:
          preferred_term: WFDC2
          term:
            id: hgnc:15939
            label: WFDC2
        relationship_type: CAUSATIVE
        notes: 20q13.12; encodes the secreted WAP four-disulfide core domain protein 2 (HE4). The recurrent
          p.Cys49Arg founder variant acts by hampering glycosylation and hence secretion. Founder alleles
          have been proposed in East Asian populations, and independent patients have since been reported
          from Korea and Japan, so the gene warrants inclusion in sinopulmonary diagnostic panels rather
          than being treated as a single-cohort finding. A Vietnamese sinopulmonary cohort screened all
          three WFDC2 coding exons and found no variants, which bounds how common the disease can be in
          that population.
      selected_evidence:
        snippet: Considering the possibility of founder mutations, WFDC2 variants should be included in
          diagnostic panels for patients with sinopulmonary disease in Asian populations.
        supports: SUPPORT
        directness: DIRECT
