        biological_scale: TISSUE
        description: 'The structural endpoint: irreversible bronchial dilatation and nasal polyposis.
          The general route from repeated airway insult to bronchiectasis is the vicious cycle of infection,
          inflammation, damage and abnormal remodelling that is common to bronchiectasis of any cause;
          what is specific to this disorder is what initiates the cycle. Distribution is a useful discriminator
          - disease in all lobes, mimicking CF and inborn errors of immunity, rather than the middle and
          lower lobe predominance of PCD.'
      selected_evidence:
        snippet: Bronchiectasis in WFDC2 deficiency more closely mimics CF and IEI (all lobes) than PCD
          (predominantly middle and lower lobes).
        supports: SUPPORT
        directness: DIRECT
