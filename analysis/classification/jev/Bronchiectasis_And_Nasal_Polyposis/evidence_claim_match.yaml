        context: []
      assertion_type: Diagnosis
      assertion:
        name: Low nasal nitric oxide as a misleading result
        description: A diagnostic trap worth stating plainly. Nasal nitric oxide is low in these patients,
          and low nasal NO is the standard screening test for primary ciliary dyskinesia. Patients are
          therefore liable to be labelled probable PCD - explicitly what happened in the Japanese series,
          in a setting where CF is rare - and the label can stand for years because the airway phenotype
          is compatible with it. The founding cohort recommends considering WFDC2 deficiency precisely
          when nasal NO is very low.
      selected_evidence:
        snippet: We recommend including WFDC2 deficiency in the differential diagnosis with CRS, CF, and
          PCD when nasal nitric oxide measurements are very low.
        supports: SUPPORT
        directness: DIRECT
