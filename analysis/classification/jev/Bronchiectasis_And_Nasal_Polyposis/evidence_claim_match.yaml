      assertion_type: Discussion
      assertion:
        discussion_id: wfdc2_ascertainment_and_panel_coverage
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - prevalence#Worldwide
        - genetic#WFDC2
        prompt: How much WFDC2 deficiency is currently being counted as idiopathic bronchiectasis or probable
          PCD?
        rationale: 'Every reported patient was found by sequencing beyond the standard panels, and the
          disorder has a specific reason to be systematically missed rather than merely rare: low nasal
          nitric oxide gives these patients a positive result on the PCD screening test, so the workup
          terminates at a plausible wrong answer instead of continuing. Cases accumulated from Korea and
          Japan within two years of the founding report, and founder alleles have been proposed, which
          is not the pattern of a genuinely ultra-rare disease.

          The one targeted screen so far cuts the other way and is the reason this is recorded as an open
          question rather than a conclusion. A Vietnamese sinopulmonary study sequenced all three WFDC2
          coding exons in 31 patients with extensive bronchiectasis and found nothing. That is a real
          constraint: whatever is hiding inside idiopathic bronchiectasis, in that cohort it was not WFDC2.
          Whether the negative reflects genuine rarity, population-specific allele frequencies, or a cohort
          selected on bronchiectasis rather than on the polyposis that is the fully penetrant feature,
          is exactly what is unresolved.

          This is tractable without new discovery work: serum WFDC2 can be measured with an existing commercial
          assay, so an idiopathic-bronchiectasis or probable-PCD cohort could be screened biochemically
          before any sequencing. Until more cohorts are screened either way, the prevalence field here
          is a count of reports rather than an estimate.'
      selected_evidence:
        snippet: No abnormal WFDC2 variants were found in 31 patients with extensive BL/BE.
        supports: REFUTE
        directness: DIRECT
    origin:
