  a6f7191b134f2d7b9a3453225a91fa86e099569e3d48d88e2b631c376b8002b4:
    claim:
      about:
        disease:
          name: Bronchiectasis and Nasal Polyposis
          disease_term:
            preferred_term: bronchiectasis and nasal polyposis
            term:
              id: MONDO:0975835
              label: bronchiectasis and nasal polyposis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Airway Antiprotease Milieu
        biological_scale: TISSUE
        description: 'A candidate, partially supported consequence. WFDC family members are protease inhibitors,
          and comparative proteomics of saliva found the serine protease inhibitor SPINK5 significantly
          reduced in WFDC2-deficient individuals relative to both healthy controls and airway-disease
          controls. SLPI, the other WFDC protein highly expressed in airway epithelium, was not significantly
          altered.

          The claim carried here is deliberately narrow. The SPINK5 finding is real and controlled against
          disease as well as healthy comparators, but it is measured in saliva rather than in the airway,
          in three patients, and it establishes an association rather than a route to tissue destruction.
          It is modelled as a node because the protease-antiprotease balance is the mechanism the protein
          family''s known biology predicts, not because the pathway to bronchiectasis has been demonstrated.'
        molecular_functions:
        - preferred_term: serine-type endopeptidase inhibitor activity
          term:
            id: GO:0004867
            label: serine-type endopeptidase inhibitor activity
          modifier: DECREASED
      selected_evidence:
        snippet: We also analyzed SPINK5 by WB and observed reduced expression of a proteolytically cleaved
          species (28) in individuals with WFDC2 mutations compared with healthy control and respiratory
          disease control groups
        supports: SUPPORT
        directness: DIRECT
