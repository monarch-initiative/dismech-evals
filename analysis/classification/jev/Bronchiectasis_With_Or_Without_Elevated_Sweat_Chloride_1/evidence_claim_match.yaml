        description: Reported SCNN1B (ENaC beta) variants are heterozygous and behave as incompletely
          penetrant susceptibility alleles, sometimes in trans with a CFTR mutation or variant, rather
          than as classic dominant or recessive Mendelian cystic fibrosis alleles. No HPO mode-of-inheritance
          term cleanly represents a heterozygous susceptibility allele, so the descriptor is left ontology-unbound
          rather than asserting autosomal dominant transmission, which the heterozygous-susceptibility
          data do not support.
      selected_evidence:
