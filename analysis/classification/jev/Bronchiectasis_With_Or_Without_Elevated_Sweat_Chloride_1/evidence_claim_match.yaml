      assertion_type: Genetic
      assertion:
        name: SCNN1B
        gene_term:
          preferred_term: SCNN1B
          term:
            id: hgnc:10600
            label: SCNN1B
        association: ENaC beta-subunit variant conferring susceptibility to cystic fibrosis-like bronchiectasis
        relationship_type: RISK_FACTOR
        variant_origin: GERMLINE
        notes: SCNN1B encodes the beta subunit of the epithelial sodium channel (ENaC). Variants reported
          in BESC1 are heterozygous and are proposed to dysregulate ENaC toward increased sodium-channel
          activity (gain of function), the opposite of the ENaC loss-of-function seen in pseudohypoaldosteronism
          type 1 and distinct from the CFTR loss underlying cystic fibrosis. Variant-level functional
          characterization is incomplete; several were identified in trans with a CFTR mutation or variant.
          No variant-specific SCNN1B electrophysiology (e.g. dedicated oocyte/patch-clamp studies of individual
          BESC1 alleles) is cited here because none was verifiable from the fetched reference caches,
          and deep-research providers were unavailable in this curation environment; such claims are deliberately
          not asserted rather than sourced to an unverified citation.
      selected_evidence:
        snippet: We report two non-classic CF patients without CFTR mutations who have novel deleterious
          mutations in the beta-subunits of SCNN1 in the absence of overt renal disease.
        supports: SUPPORT
