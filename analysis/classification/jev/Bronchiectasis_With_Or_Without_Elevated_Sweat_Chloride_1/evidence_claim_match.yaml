      assertion_type: Diagnosis
      assertion:
        name: Functional sodium-transport testing (sweat chloride and nasal potential difference)
        presence: Abnormal sweat chloride concentration and/or abnormal nasal potential difference
        description: 'Sodium transport is assessed both in the sweat glands (pilocarpine-iontophoresis
          sweat chloride, the standard cystic fibrosis test) and in the airway epithelium (nasal potential
          difference). In BESC1 either can be normal or abnormal, so the pair characterizes the ENaC functional
          defect rather than confirming the diagnosis: an abnormally high basal nasal PD suggests a Liddle-like
          gain of function while a high sweat chloride with low basal PD resembles the PHA-I loss-of-function
          pattern.'
      selected_evidence:
        snippet: abnormal sweat chloride concentration or nasal potential difference measurement
        supports: SUPPORT
