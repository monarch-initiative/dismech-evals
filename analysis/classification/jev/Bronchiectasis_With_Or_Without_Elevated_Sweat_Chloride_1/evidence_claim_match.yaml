      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: enac_gain_of_function_asl_depletion_model
        hypothesis_label: ENaC Gain-of-Function Airway Surface Liquid Depletion Model
        status: EMERGING
        description: BESC1 is proposed to arise from SCNN1B variants that increase epithelial sodium channel
          activity in airway epithelium. Excess sodium (and osmotically obligated water) absorption depletes
          airway surface liquid, mirroring the CFTR-independent mechanism demonstrated in beta-ENaC-overexpressing
          mice, which develop cystic fibrosis-like lung disease. Direct functional proof that individual
          BESC1 SCNN1B variants are gain-of-function in human airway epithelium remains limited, and some
          carriers also harbor a CFTR variant, so the model is best regarded as emerging.
      selected_evidence:
        snippet: we generated mice with airway-specific overexpression of epithelial Na(+) channels (ENaC)
        supports: SUPPORT
        directness: INDIRECT
