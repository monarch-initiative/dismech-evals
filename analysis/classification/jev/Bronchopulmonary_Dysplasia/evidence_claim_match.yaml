      assertion_type: Pathophysiology
      assertion:
        name: Preterm Birth with Saccular-Stage Lung and Surfactant Deficiency
        role: trigger
        biological_scale: ORGANISM
        description: The initiating condition is very preterm birth, which interrupts lung development
          in the canalicular/saccular stage before alveolarization. A lack of surfactant from incompletely
          differentiated alveolar type 2 cells leaves the immature lung unable to sustain gas exchange,
          so the infant requires supplemental oxygen and mechanical ventilation - the exposures that drive
          the downstream injury.
        cell_types:
        - preferred_term: pulmonary alveolar type 2 cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
      selected_evidence:
        snippet: a lack of pulmonary surfactant as a result of incomplete differentiation of AT2 cells
          causes RDS in preterm infants
        supports: SUPPORT
        directness: DIRECT
    origin:
