      assertion_type: Pathophysiology
      assertion:
        name: Impaired Microvascular Growth
        role: effector
        biological_scale: TISSUE
        description: Disrupted VEGF signaling reduces and distorts the pulmonary microvasculature, leaving
          a sparse, dysmorphic capillary bed. By the vascular hypothesis of BPD, this early disruption
          of lung vascular growth also impairs growth of the distal airspace, coupling the vascular and
