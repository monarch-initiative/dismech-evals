      assertion_type: Pathophysiology
      assertion:
        name: Requirement for Cell-Penetrant Antimicrobials
        description: Efficacy against the intracellular Brucella reservoir tracks the intracellular concentration
          a drug achieves, not merely its in vitro MIC. Doxycycline, rifampicin, and aminoglycosides accumulate
          within (or otherwise reach) infected cells, whereas beta-lactams do not — so the mainstay regimens
          are built from cell-penetrant agents given in prolonged combination. This is the cell-penetrant-drug
          requirement that the brucellosis treatments target.
        role: therapeutic_vulnerability
        conforms_to: intracellular_pathogen_persistence#Requirement for Cell-Penetrant Antimicrobials
        biological_processes:
        - preferred_term: Response to Antibiotic
          term:
            id: GO:0046677
            label: response to antibiotic
      selected_evidence:
        snippet: Therapeutic efficacy against intracellular pathogens has been correlated mainly with
          the intracellular concentrations achieved by the different antimicrobial agents.
        supports: SUPPORT
