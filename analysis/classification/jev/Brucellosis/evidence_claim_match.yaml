      assertion_type: Discussion
      assertion:
        discussion_id: gap_brucellosis_mhc_evasion_human_relevance
        prompt: Does the IFN-gamma-induced MHC-I surface down-modulation by Brucella abortus RNA, shown
          in human epithelial, endothelial, and monocyte/macrophage cell lines in vitro, actually operate
          in vivo to sustain chronic human brucellosis, or is it a feature of the isolated-RNA cell-line
          system?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#MHC-I surface down-modulation
        - pathophysiology#Persistent multisystem infection
        rationale: The MHC-I down-modulation immune-evasion mechanism is supported entirely by in vitro
          experiments using human cell lines exposed to isolated B. abortus RNA. Whether this pathway
          meaningfully impairs CD8+ T-cell surveillance in infected patients — and thereby drives the
          persistence and relapse that define chronic brucellosis — has not been demonstrated in human
          tissue or in an in vivo model of chronic infection, so its translational weight is uncertain.
          Understanding Brucella pathogenic mechanisms remains an explicitly stated open challenge.
        proposed_experiments:
        - experiment_id: exp_brucellosis_mhc_invivo
          name: In vivo test of MHC-I down-modulation and CD8 surveillance in chronic brucellosis
          description: Assess surface MHC-I expression and CD8+ T-cell responses in cells from a chronic-infection
            animal model and in tissue or peripheral cells from patients with chronic or relapsing brucellosis,
            comparing infected versus uninfected states to test whether the in-vitro MHC-I down-modulation
            operates during genuine intracellular infection.
          experiment_type:
            preferred_term: controlled perturbation experiment
      selected_evidence:
        snippet: the understanding of pathogenic mechanisms of Brucella spp
        supports: SUPPORT
