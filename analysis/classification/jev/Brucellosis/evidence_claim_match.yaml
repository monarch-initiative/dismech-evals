        description: Rifampicin, a component of the classic WHO-recommended doxycycline-rifampicin regimen,
          binds the beta subunit of bacterial DNA-dependent RNA polymerase and blocks nascent-transcript
          elongation. Because rifamycins are cell- and tissue-penetrant, this target is reachable in the
          intracellular Brucella reservoir; single rpoB point mutations confer high-level resistance,
          which is part of why rifampicin is used in combination rather than alone.
