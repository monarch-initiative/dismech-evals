      assertion_type: Pathophysiology
      assertion:
        name: Facultative Intracellular Niche (Cell-Penetrant Drug Requirement)
        description: Brucella is a facultative intracellular pathogen that survives and replicates within
          host phagocytes (chiefly macrophages). This intracellular lifestyle shields the organism from
          antibodies and complement and, critically for therapy, from antibiotics that cannot accumulate
          inside eukaryotic cells — notably the beta-lactams. Effective treatment is therefore restricted
          to cell-penetrant agents (doxycycline, aminoglycosides that concentrate at the site, rifampicin),
          and cure requires prolonged combination therapy to reach and clear the protected intracellular
          reservoir. This is the lifestyle-gating principle that constrains drug choice beyond any single
          molecular target.
        role: intrinsic_resistance
        conforms_to: intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam Exclusion
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: Biological Process Involved in Interaction with Host
          term:
            id: GO:0051701
            label: biological process involved in interaction with host
      selected_evidence:
        snippet: Brucella abortus (Ba) is a pathogen that survives inside macrophages.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/14
      evidence_path: /pathophysiology/14/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1371/journal.pone.0306429
      reference_title: 'Beyond its preferential niche: Brucella abortus RNA down-modulates the IFN-γ-induced
        MHC-I expression in epithelial and endothelial cells'
