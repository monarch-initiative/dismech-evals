      assertion:
        name: Bacterial Ribosomal Translation (Tetracycline/Aminoglycoside Target)
        description: Brucella, like other bacteria, depends on 70S-ribosome translation of its mRNA. Doxycycline
          (a tetracycline) binds the 30S subunit and blocks aminoacyl-tRNA delivery, and the aminoglycosides
          streptomycin and gentamicin also target the 30S ribosome — the shared molecular target that
          anchors the doxycycline-plus-aminoglycoside brucellosis regimens. This is a bacterial target
          absent from the beta-lactam-inaccessible host cytoplasm, complementing the intracellular-niche
          gating node.
        role: therapeutic_vulnerability
        conforms_to: bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome
        biological_processes:
        - preferred_term: Translation
          term:
            id: GO:0006412
            label: translation
      selected_evidence:
        snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
        supports: SUPPORT
