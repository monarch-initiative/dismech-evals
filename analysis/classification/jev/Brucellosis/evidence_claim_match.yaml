      assertion_type: Discussion
      assertion:
        discussion_id: gap_brucellosis_regimen_focal_adult
        prompt: What is the optimal antibiotic regimen and duration for adult, focal, and complicated
          human brucellosis (spondylitis, sacroiliitis, endocarditis, neurobrucellosis), given that the
          strongest comparative-efficacy ranking (doxycycline + gentamicin) derives from a network meta-analysis
          restricted to children and adolescents that explicitly excluded focal disease and pregnancy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Persistent multisystem infection
        rationale: The 2024 network meta-analysis that ranked doxycycline + gentamicin highest for efficacy
          restricted inclusion to trials of children and adolescents and excluded spondylitis, endocarditis,
          neurobrucellosis, and pregnancy, so its ranking cannot be applied directly to the focal and
          complicated adult disease that drives most brucellosis morbidity. Regimen choice and duration
          for these presentations still rest on heterogeneous observational data, and improved treatment
          regimens remain an explicitly stated open challenge in the field.
        proposed_experiments:
        - experiment_id: exp_brucellosis_adult_focal_rct
          name: Multicenter randomized trial of doxycycline-gentamicin versus triple therapy in adult
            focal/complicated brucellosis
          description: Enroll adults with spondylitis, sacroiliitis, endocarditis, or neurobrucellosis
            and randomize to doxycycline + gentamicin versus a doxycycline-rifampicin-based triple regimen,
            with protocolized durations and long-term follow-up, using microbiologic cure, relapse, and
            treatment-failure as endpoints to define the best regimen for focal disease.
          experiment_type:
            preferred_term: randomized controlled trial
      selected_evidence:
        snippet: the development of improved treatment regimens
        supports: SUPPORT
