        prompt: Which biomarkers predict disease severity, progression to focal or chronic disease, relapse
          risk, and treatment response in human brucellosis?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Persistent multisystem infection
        rationale: Brucellosis is relapse-prone and can localize to bone, heart, and the nervous system,
          yet there is no validated marker to stratify which patients will progress, relapse, or fail
          therapy. The absence of severity/progression/ treatment-response markers is a long-standing,
          explicitly stated gap that limits risk-adapted treatment intensity and duration.
        proposed_experiments:
        - experiment_id: exp_brucellosis_biomarker_cohort
          name: Prospective biomarker cohort for relapse and focal-progression prediction
          description: Follow a prospective cohort of culture- or serology-confirmed cases with serial
            serologic titers, inflammatory markers, and host-immune profiling from diagnosis through completion
            of therapy and relapse surveillance, to identify candidate biomarkers that predict focal progression,
            relapse, and treatment failure.
          experiment_type:
            preferred_term: prospective cohort study
      selected_evidence:
        snippet: the identification of markers for disease severity, progression, and treatment response
        supports: SUPPORT
