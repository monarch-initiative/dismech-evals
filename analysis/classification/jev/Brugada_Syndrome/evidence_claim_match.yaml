      assertion_type: ComputationalModel
      assertion:
        name: Spatially heterogeneous sodium-channel myocardial ring model
        description: A one-dimensional ring of 600 human epicardial ventricular myocytes using the same
          modified O'Hara-Rudy ionic model, segmented cell membranes, gap junctions, and ephaptic coupling
          as the companion strand model. Two ring regions are assigned different, markedly reduced lateral-membrane
          sodium conductances to test whether spatial heterogeneity converts phase-2 reentry into intermittent
          or persistent circulating reentrant excitation.
        model_type: KINETIC
        repository_url: https://github.com/92tsumoto/BrS-P2R-ring-ORd2011model-withTNNP_INa-FT_IKr/tree/0a6aece22925ca48430d775589547bbfbf9e0ff0
        model_id: 1D_EFring_mORD2
        base_model: Modified O'Hara-Rudy dynamic 2011 human ventricular model with ten Tusscher-Panfilov
          fast INa and experimental IKr
        model_software: C/Autotools; Intel C Compiler, Intel MKL/PARDISO, and Intel OpenMP (original configuration)
        model_format: C source, Autotools build files, and positional text input
        publication: PMID:33203944
        variables:
        - name: Regional lateral-membrane sodium conductance fractions
          description: Separately imposed percentages of control lateral sodium conductance in the two
            ring regions.
        - name: Action-potential propagation pattern
          description: Spatiotemporal membrane-voltage propagation around the ring; block, phase-2 reentry,
            and circulating reentry are interpreted from the traces rather than classified directly by
            the code.
        modeled_mechanisms:
        - target: Malignant Ventricular Tachyarrhythmia
          relationship: PARTIALLY_RECAPITULATES
          description: The heterogeneous ring produces phase-2-reentry-mediated circulating excitation,
            representing a reduced tissue-scale mechanism for Brugada reentrant tachyarrhythmia.
          fidelity: LOW
          limitations: The 600-cell one-dimensional ring is not an RVOT or whole-heart geometry and cannot
            reproduce polymorphic VT, ventricular fibrillation, surface ECG, hemodynamics, or patient
            outcomes. Reentry depends on imposed and locally extreme sodium-conductance heterogeneity
            rather than measured patient tissue or a disease genotype.
          readouts:
          - name: Phase-2-reentry-mediated reentrant arrhythmia
            target: Malignant Ventricular Tachyarrhythmia
            description: Spatially heterogeneous lateral sodium-channel reduction produces intermittent
              or persistent unidirectional circulating excitation.
            direction: INCREASED
        findings:
        - statement: Reentry occurred mainly when region B lateral sodium conductance was below 5% of
            control and region A was between 5% and 10%, underscoring dependence on an extreme imposed
            spatial gradient.
        notes: The repository is pinned at commit 0a6aece22925ca48430d775589547bbfbf9e0ff0 and has no
          release, CI, container, dependency lock, or sample input. COPYING declares GPL-3.0, but src/pardiso_mat.c
          carries an Intel Confidential notice that restricts use, copying, and distribution; the effective
          reuse and redistribution status is therefore ambiguous. The checked-in build targets legacy
          Intel C Compiler, MKL/PARDISO, and OpenMP paths and flags and did not compile unmodified during
          curator testing on ARM macOS. The fixed-step explicit-Euler simulation uses a 1-microsecond
          step for 30 beats, nominally 30 million steps. The repository supplies no paper-figure parameter
          manifest, golden output, analysis script, or automated test. It emits voltage and current traces
          but does not directly label phase-2 reentry, reentrant arrhythmia, or the published phase diagram;
          an auxiliary cleft-potential output also omits the closing ring junction. The article is CC
          BY 4.0. This is a hypothesis-driven mechanism model, not an allele-specific, anatomically personalized,
          or clinically predictive ventricular simulation.
      selected_evidence:
        snippet: We constructed in silico human ventricular myocardial strand and ring models, and examined
          whether the Na+ channel expression changes in each myocyte cause the phase-2 reentry in BrS.
        supports: SUPPORT
