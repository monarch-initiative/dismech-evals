        - path: /computational_models/0
          value:
            name: Subcellular sodium-channel myocardial strand model
            description: A one-dimensional strand of 300 human epicardial ventricular myocytes for studying
              how subcellular sodium-channel distribution changes action-potential morphology and propagation.
              Each cell is divided into lateral and pre- and post-junctional membrane segments, represented
              by a modified O'Hara-Rudy dynamic model with ten Tusscher-Panfilov fast sodium current and
              an experimentally based rapid delayed-rectifier potassium current. Cells are coupled through
              gap junctions and ephaptic interactions. The disease-like manipulation reduces lateral-membrane
              sodium conductance while retaining junctional sodium conductance.
            model_type: KINETIC
            repository_url: https://github.com/92tsumoto/BrS-P2R-strand-ORd2011model-withTNNP_INa-FT_IKr/tree/90962d4c159d5b12133d99cb0818c84c6746a013
            model_id: 1D_EF_mORD2
            base_model: Modified O'Hara-Rudy dynamic 2011 human ventricular model with ten Tusscher-Panfilov
              fast INa and experimental IKr
            model_software: C/Autotools; Intel C Compiler, Intel MKL/PARDISO, and Intel OpenMP (original
              configuration)
            model_format: C source, Autotools build files, and positional text input
            publication: PMID:33203944
            variables:
            - name: Lateral-membrane sodium conductance fraction
              description: Fast and late lateral-membrane sodium conductance expressed as a percentage
                of control.
            - name: Action-potential membrane voltage
              description: Membrane-potential trajectory for each modeled cell and membrane segment.
            - name: Conduction velocity
              description: Propagation velocity along the myocardial strand in centimeters per second,
                derived in the publication from activation-time outputs rather than emitted directly by
                the code.
            notes: 'The repository is pinned at commit 90962d4c159d5b12133d99cb0818c84c6746a013 and has
              no release, CI, container, or dependency lock. COPYING declares GPL-3.0, but src/pardiso_mat.c
              carries an Intel Confidential notice that restricts use, copying, and distribution; the
              effective reuse and redistribution status is therefore ambiguous. The checked-in build targets
              legacy Intel C Compiler, MKL/PARDISO, and OpenMP paths and flags. It did not compile unmodified
              during curator testing on ARM macOS. The fixed-step explicit-Euler simulation uses a 1-microsecond
              step for 30 beats. Its only sample input is stale: for the supplied one-dataset, 43-state
              configuration, the parser reads 83 numeric fields whereas check_test/in supplies 82, shifting
              later values and preventing a faithful run. No paper-scenario manifest, expected outputs,
              or automated tests are supplied. The code emits voltage and ionic traces plus activation
              times but does not directly calculate CV; nai_data.out and ki_data.out are also mislabeled
              relative to their written state indices. The article is CC BY 4.0. The model was compared
              qualitatively with prior mouse and human electrophysiology, but it was not fitted to or
              independently validated in a Brugada patient cohort.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced Depolarization Reserve
        relationship: PERTURBS
        description: The model directly reduces lateral-membrane sodium conductance and measures the resulting
          action-potential changes, rather than reproducing the full genetically and structurally heterogeneous
          Brugada mechanism.
        fidelity: MODERATE
        limitations: Sodium-channel reduction is prescribed phenomenologically rather than generated by
          an SCN5A allele, trafficking defect, or patient-calibrated expression state. The model does
          not represent broader calcium- or potassium-channel causes of reduced depolarization reserve.
        readouts:
        - name: Action-potential dome morphology
          target: Reduced Depolarization Reserve
          description: Progressive lateral sodium-channel reduction produces notch-and-dome, delayed-dome,
            and loss-of-dome action potentials.
          direction: ALTERED
      selected_evidence:
        snippet: Reducing Na+ channel expression in the lateral membrane of each myocyte caused not only
          the notch-and-dome but also loss-of-dome type action potentials and slowed conduction, both
          of which are typically observed in BrS patients.
        supports: SUPPORT
