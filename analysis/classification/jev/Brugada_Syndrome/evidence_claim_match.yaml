  e91b4d2d8b2e03af578a1d32997a26b4de50a1b2ca86730d9470c115bcbdb1f2:
    claim:
      about:
        disease:
          name: Brugada syndrome
          disease_term:
            preferred_term: Brugada syndrome
            term:
              id: MONDO:0015263
              label: Brugada syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Depolarization Reserve
        conforms_to: cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant
        role: trigger
        description: Brugada syndrome converges on reduced depolarizing reserve in ventricular cardiomyocytes,
          most often through decreased inward sodium current but also through broader ion-current imbalance
          involving calcium and potassium channel pathways. At the disease level, the key mechanistic
          theme is not long-QT-like delayed repolarization alone but reduced inward current and impaired
          conduction reserve in the right ventricular substrate.
        genes:
        - preferred_term: SCN5A
          term:
            id: hgnc:10593
            label: SCN5A
          modifier: LOSS_OF_FUNCTION
        - preferred_term: SCN3B
          term:
            id: hgnc:20665
            label: SCN3B
          modifier: LOSS_OF_FUNCTION
        notes: 'The two genes on this node are not graded alike, and the difference is in `genetic:` rather
          than here. SCN5A is CAUSATIVE. SCN3B is DISPUTED: the ClinGen Brugada reappraisal rejected its
          reported alleles on population frequency and absent segregation, while the mechanism those alleles
          were reported to act through — reduced peak sodium current in ventricular myocytes — is the
          mechanism this node represents and is supported in the Scn3b-null mouse. SCN3B is bound here
          because the mechanism claim is the one a pathograph node makes; read the allele-level verdict
          off its `genetic:` record. Note that the KGX exporter reads neither `relationship_type` nor
          this note (dismech#12320), so a downstream consumer of the export will see the two genes undifferentiated.'
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        - preferred_term: right ventricular cardiomyocyte
          term:
            id: CL:2000046
            label: ventricular cardiac muscle cell
        molecular_functions:
        - preferred_term: monoatomic ion channel activity
          term:
            id: GO:0005216
            label: monoatomic ion channel activity
          modifier: ABNORMAL
        biological_processes:
        - preferred_term: membrane depolarization during cardiac muscle cell action potential
          term:
            id: GO:0086012
            label: membrane depolarization during cardiac muscle cell action potential
          modifier: DECREASED
        - preferred_term: cardiac conduction
          term:
            id: GO:0061337
            label: cardiac conduction
          modifier: DECREASED
        - preferred_term: sodium ion transport
          term:
            id: GO:0006814
            label: sodium ion transport
          modifier: DECREASED
        locations:
        - preferred_term: outflow tract of right ventricle
          term:
            id: UBERON:0005953
