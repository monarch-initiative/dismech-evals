            fidelity: MODERATE
            description: Complete loss of the beta-3 subunit reduces peak sodium current density measured
              directly in ventricular myocytes and slows cardiac conduction in vivo, matching the direction
              of the reduced sodium current that SCN3B variants produce in transfected cells.
            limitations: The model is a homozygous null, whereas the reported human variants are heterozygous
              missense or single-codon deletions, so it speaks to complete loss of beta-3 rather than
              to the alleles actually found in patients, and those alleles are what the disputed classification
              turns on. Murine ventricular repolarization also differs substantially from human, the standing
              caveat for any mouse model of a repolarization-dependent arrhythmia syndrome.
          role: ancestor
