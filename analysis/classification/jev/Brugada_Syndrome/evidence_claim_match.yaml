            term:
              id: MONDO:0015263
              label: Brugada syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: Oligogenic Brugada syndrome
        display_name: Genotype-negative or oligogenic Brugada syndrome
        description: Majority stratum of clinically diagnosed Brugada syndrome in which no single definitive
          monogenic cause is identified. Current evidence supports a heterogeneous architecture involving
          unresolved rare variation, common variant burden, and multiple non-SCN5A candidate genes that
          should not be promoted to standalone disease roots without stronger evidence. Despite the subtype
          name, no oligogenic inheritance term (HP:0010983) is bound and this entry is not a member of
          the Digenic and Oligogenic Disorders grouping. The cited evidence establishes that 70-85% of
          cases are genetically unresolved, which is an absence of a monogenic explanation rather than
          a demonstration of two or a few co-transmitted loci; a common-variant burden architecture would
          in any case be polygenic (HP:0010982), not oligogenic. The subtype is retained under its published
          name because that is how the stratum is labelled in the literature.
      selected_evidence:
        snippet: A molecular diagnosis can be established in an individual with characteristic features
          and identification of a heterozygous pathogenic variant in SCN5A or one of the additional 42
          genes associated with Brugada syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20301690
      reference_title: Brugada Syndrome.
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      explanation: The GeneReviews chapter still lists 42 non-SCN5A genes as diagnostic, which the ClinGen
        reappraisal cited on this entry's SCN3B record contradicts for 20 of the 21 it curated. Recorded
        here because the disagreement is between two standard sources rather than between a source and
        this entry, and it is what this subtype exists to hold.
