  81edee5fe4c5fa63c648ed76cc7a62a8b03b39b7ef8b629b8aa212c873707355:
    claim:
      about:
        disease:
          name: Brugada syndrome
          disease_term:
            preferred_term: Brugada syndrome
            term:
              id: MONDO:0015263
              label: Brugada syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SCN3B variants
        association: Disputed
        relationship_type: DISPUTED
        features: 'SCN3B encodes the auxiliary beta-3 subunit of the cardiac voltage-gated sodium channel
          and is the gene behind the numbered series term Brugada syndrome 7 (MONDO:0013146). The association
          rests principally on two variants: L10P, reported in a single American proband, and V110I, found
          in 3 of 178 SCN5A-negative Japanese patients. Both were reported to impair cytoplasmic trafficking
          of Nav1.5 and reduce sodium current in transfected cells, converging on the same depolarization-reserve
          node this entry already curates for SCN5A. A third variant, T138del, was reported in 2025 with
          preserved beta-3 surface expression and preserved Nav1.5 interaction but reduced peak current,
          so reduced sodium current rather than mistrafficking is the common thread. The gene-disease
          claim nonetheless failed reappraisal: no report provided informative segregation data, and both
          of the originally implicated variants were subsequently found at a heterozygosity frequency
          of about 1 in 2500 in public population databases, which the ClinGen Brugada gene-validity reappraisal
          judged to be at or above the population prevalence of Brugada syndrome and therefore incompatible
          with a highly penetrant monogenic causal role. That reappraisal reclassified SCN3B, with 19
          other curated Brugada genes, as disputed. Two further observations point the same way: L10P,
          the original Brugada allele, was independently reported in a lone atrial fibrillation cohort.
          The in vivo evidence, by contrast, cuts toward the mechanism rather than against it: the Scn3b-null
          mouse has reduced peak sodium current in ventricular myocytes and inducible ventricular tachycardia,
          which its authors describe as resembling Scn5a heterozygous hearts, alongside sinoatrial and
          atrioventricular conduction disease. What that model cannot settle is the human allele question,
          since it is a homozygous null while the reported patient variants are heterozygous. SCN3B is
          therefore curated as part of the disputed non-SCN5A heterogeneity rather than as a validated
          monogenic cause: the mechanism is plausible and supported in vivo, and the specific reported
          alleles are what fail.'
        gene_term:
          preferred_term: SCN3B
          term:
            id: hgnc:20665
            label: SCN3B
      selected_evidence:
        snippet: Coexpression of SCN5A/WT+SCN1B/WT+SCN3B/L10P resulted in an 82.6% decrease in peak sodium
          current density, accelerated inactivation, slowed reactivation, and a -9.6-mV shift of half-inactivation
          voltage compared with SCN5A/WT+SCN1B/WT+SCN3B/WT.
        supports: SUPPORT
        directness: DIRECT
