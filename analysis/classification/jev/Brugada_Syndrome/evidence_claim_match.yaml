        context: []
      assertion_type: Definition
      assertion:
        name: Fever-associated type-1 Brugada ECG case-finding query for latent SCN5A/Brugada carriers
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        validation_status:
          status: UNVALIDATED
          rationale: 'Fever-unmasking of the type-1 Brugada ECG is an established, clinically recognized
            phenomenon (guidelines advise recording an ECG during fever), so the query is well grounded
            — but this specific computable EHR phenotype has not been evaluated against a genotyped gold
            standard for PPV/yield. Validation substrate: a genotype-linked EHR biobank (eMERGE, All of
            Us, UK Biobank); MIMIC-IV-ECG can prototype the type-1 morphology detector but lacks the linked
            DNA needed to confirm SCN5A carriership.'
        attaches_to:
        - pathophysiology#Fever-induced accentuation of sodium-channel loss of function
        description: 'EHR/OMOP case-finding query: identify individuals in whom a type-1 coved Brugada
          ECG (or a fever-triggered ventricular arrhythmia) is documented during a febrile episode, as
          candidates for latent/undiagnosed Brugada syndrome warranting off-fever confirmation and SCN5A
          evaluation. Contrast with the Timothy fever query: here the fever→unmasking mechanism is established,
          so derivation_basis is ESTABLISHED_CRITERIA rather than MECHANISTIC_HYPOTHESIS.'
        scope: EHR/OMOP case-finding for latent Brugada carriers; grounded in established fever-unmasking
          biology but not yet validated as a computable phenotype.
        criteria_sets:
        - name: Fever-associated type-1 Brugada ECG
          description: A type-1 coved right-precordial ST-segment elevation, or a ventricular tachyarrhythmia,
            documented during a febrile episode in a patient without a prior Brugada diagnosis; confirm
            off-fever and refer for SCN5A testing.
          inclusion_criteria:
          - preferred_term: Documented febrile episode
            description: Elevated body temperature or a febrile-illness diagnosis code (index exposure).
          - preferred_term: Type-1 Brugada ECG or fever-triggered ventricular arrhythmia
            description: Coved type-1 right-precordial ST-segment elevation, or a ventricular tachyarrhythmia,
              recorded during the febrile episode.
          exclusion_criteria:
          - preferred_term: Pre-existing Brugada diagnosis
            description: Already-diagnosed Brugada syndrome (not a latent-case-finding hit).
        notes: 'Worked ESTABLISHED-basis counterpart to the Timothy fever_exacerbated_cav1.2 query: same
          trigger-provoked-latent-disease archetype, but the fever→Nav1.5 unmasking mechanism is settled,
          so derivation_basis is ESTABLISHED_CRITERIA (validation_status UNVALIDATED for the computable
          phenotype itself). See docs/hypothesis-based-phenotype-algorithms.md and docs/reports/hypothesis-driven-ehr-case-finding-2026-07-12.md.'
      selected_evidence:
        snippet: 26.4% (14 of 53) carried a pathogenic SCN5A mutation.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27033637
      reference_title: Prognostic significance of fever-induced Brugada syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: A substantial fraction of fever-induced type-1 patients carry a pathogenic SCN5A variant,
        supporting the case-finding rationale that fever-provoked type-1 ECG enriches for genotype-positive
        carriers.
