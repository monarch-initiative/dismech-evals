              label: Brugada syndrome
        context:
        - path: /animal_models/0
          value:
            name: Scn3b-null mouse (Scn3b-/-)
            species: Mouse
            genotype: Scn3b homozygous knockout
            publication: PMID:19796257
            genes:
            - preferred_term: SCN3B
              term:
                id: hgnc:20665
                label: SCN3B
            description: 'Germline Scn3b knockout mouse, the only in vivo model of the gene behind Brugada
              syndrome 7. Scn3b transcript is absent from the atria and the beta-3 protein from cardiac
              myocytes, while Scn1b and Scn5a transcript levels are unchanged, so the phenotype is attributable
              to loss of beta-3 specifically. The reported cardiac phenotype spans both chambers, in two
              papers from the same group: sinus bradycardia, P-wave and PR prolongation, prolonged sinus
              node recovery, atrioventricular dissociation and inducible atrial tachyarrhythmia, and separately
              reduced peak sodium current in ventricular myocytes with shortened ventricular effective
              refractory periods and inducible monomorphic or polymorphic ventricular tachycardia.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced Depolarization Reserve
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Complete loss of the beta-3 subunit reduces peak sodium current density measured
          directly in ventricular myocytes and slows cardiac conduction in vivo, matching the direction
          of the reduced sodium current that SCN3B variants produce in transfected cells.
        limitations: The model is a homozygous null, whereas the reported human variants are heterozygous
          missense or single-codon deletions, so it speaks to complete loss of beta-3 rather than to the
          alleles actually found in patients, and those alleles are what the disputed classification turns
          on. Murine ventricular repolarization also differs substantially from human, the standing caveat
          for any mouse model of a repolarization-dependent arrhythmia syndrome.
        readouts:
        - name: Atrioventricular conduction time (PR interval)
          target: Reduced Depolarization Reserve
          direction: INCREASED
          interpretation: PR prolongation is the in vivo correlate of reduced sodium-channel availability,
            the same direction of effect reported for SCN3B variants in heterologous expression.
        - name: Atrial arrhythmia inducibility on burst pacing
          target: Reduced Depolarization Reserve
          direction: INCREASED
          interpretation: Inducible atrial tachyarrhythmia is the arrhythmic counterpart of reduced sodium-channel
            availability in this chamber; the companion study reports the ventricular counterpart separately.
      selected_evidence:
        snippet: These findings demonstrate, for the first time, that a deficiency in Scn3b results in
          significant atrial electrophysiological and intracardiac conduction abnormalities, complementing
          the changes in ventricular electrophysiology reported on an earlier occasion.
        supports: SUPPORT
    origin:
