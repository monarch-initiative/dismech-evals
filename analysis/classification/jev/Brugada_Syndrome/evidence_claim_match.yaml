              id: MONDO:0015263
              label: Brugada syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_scn3b_null_mouse_atrial_phenotype
        prompt: The Scn3b-null mouse reproduces the sodium-current and ventricular arrhythmia phenotype,
          but does complete loss of beta-3 in mouse say anything about the heterozygous human alleles,
          which are commoner in the population than Brugada syndrome is?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - animal_models#Scn3b-null mouse (Scn3b-/-)
        - genetic#SCN3B variants
        rationale: 'The in vivo model and the human genetics point in opposite directions, and the mismatch
          is at the level of the allele rather than the mechanism. Scn3b-null mice have reduced peak sodium
          current in ventricular myocytes, shortened ventricular effective refractory periods, and inducible
          ventricular tachycardia that the authors read as resembling Scn5a heterozygous hearts, so loss
          of beta-3 plainly can produce a sodium-channel-dependent ventricular arrhythmic substrate. But
          the model is a homozygous null, while every reported human variant is heterozygous, and two
          of them occur in the general population at roughly the prevalence of Brugada syndrome itself.
          So a strong model phenotype coexists with human alleles that cannot carry the disease at the
          frequency observed. Either the reported missense alleles do not approach the functional severity
          of a null, or beta-3 loss contributes only as a modifier on other substrate. Which of those
          holds determines whether the disputed classification is a statement about SCN3B or only about
          the specific alleles so far reported, and a heterozygous knock-in of the human alleles is the
          experiment that would separate them. Note that this discussion_id predates the question it now
          asks: it was first written around an apparent atrial-versus-ventricular mismatch that the Hakim
          2008 ventricular data disproved. The id is retained as a stable key and should not be read as
          the claim.'
      selected_evidence:
        snippet: Together, these findings associate the lack of the Scn3b gene with arrhythmic tendencies
          in intact perfused hearts and electrophysiological features similar to those in Scn5a(+/-) hearts.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
