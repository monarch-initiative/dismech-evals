  56bcbbee969593693a646b73189c491489b557d2e55820563e01bd0d1da41ada:
    claim:
      about:
        disease:
          name: Brugada syndrome
          disease_term:
            preferred_term: Brugada syndrome
            term:
              id: MONDO:0015263
              label: Brugada syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_brs_nonscn5a_gene_validity
        prompt: Do any of the individual reported non-SCN5A Brugada genes, SCN3B among them, have enough
          segregation or case-excess evidence to move out of the disputed tier, or are they better understood
          as weak-effect contributors within the oligogenic stratum this entry already models, or as arrhythmia
          genes whose reported Brugada association does not hold at all?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Depolarization Reserve
        - genetic#SCN3B variants
        rationale: 'Twenty of the twenty-one genes curated by the reappraisal are classified as disputed,
          and the founding reports for most of them, SCN3B included, were sporadic cases without informative
          segregation data or demonstrated rare-variant excess. That leaves the numbered MONDO series
          (Brugada syndrome 2 through 9) naming gene-specific entities whose gene-disease claims the field
          does not currently support. This entry already models the majority stratum as genotype-negative
          or oligogenic; what remains open is the status of these specific reported genes within it, that
          is, whether any individual one is a weak-effect contributor or simply not a Brugada gene at
          all. SCN3B is the concrete test case: its null mouse does produce reduced ventricular sodium
          current and inducible ventricular tachycardia, yet the specific human alleles reported for it
          are commoner in the population than the disease is, and one of them was also reported in lone
          atrial fibrillation. Resolving this determines whether this entry should ever carry gene-specific
          subtypes beyond SCN5A.'
      selected_evidence:
        snippet: After comprehensive review by the clinical domain Expert panel, all 20 genes classified
          as limited evidence were reclassified as disputed with regard to any assertions of disease causality
          for BrS.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29959160
      reference_title: 'Reappraisal of Reported Genes for Sudden Arrhythmic Death: Evidence-Based Evaluation
        of Gene Validity for Brugada Syndrome.'
      evidence_source: OTHER
      explanation: Establishes that the disputed classification covers the whole non-SCN5A set rather
        than SCN3B alone, which is what makes this a stratum-level gap.
