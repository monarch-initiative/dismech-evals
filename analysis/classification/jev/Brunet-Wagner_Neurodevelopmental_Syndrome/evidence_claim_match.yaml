      assertion:
        name: Post-Mitotic Neuronal Dysfunction
        description: Neuronal dysfunction that persists after brain development. In Drosophila, the RBL2
          orthologue Rbf is required in differentiated post-mitotic neurons for normal locomotion, and
          re-expressing it in adult neurons rescues the locomotor defect of Rbf hypomorphs. Rbf mutants
          also have altered sleep timing and loss of evening anticipation. In cultured rodent neurons,
          depleting p130 causes neuron death. By analogy, loss of RBL2 in mature human neurons may contribute
          to the motor and sleep phenotypes and may be partly reversible; there are no human neuronal
          data.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        genes:
        - preferred_term: RBL2
          term:
            id: hgnc:9894
            label: RBL2
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Experimental suppression of such events blocks neuron death while interference with the
          synthesis of E2F4 or p130, or with the interaction of E2F4-p130 with chromatin modifiers, induces
          neuron death.
        supports: SUPPORT
