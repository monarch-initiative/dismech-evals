            term:
              id: MONDO:0030606
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: blbs1_genotype_phenotype_unexplained
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What accounts for the phenotypic variability that gene, protein domain and sex together
          fail to explain - including variability between individuals carrying the same H3-3A allele?
        attaches_to:
        - pathophysiology#De Novo H3-3A Variant Altering Histone H3.3
        - phenotypes#
        rationale: The 2024 cohort tested three candidate explanatory variables against the phenotype
          and found that variant location and affected gene contribute more than sex, but that none of
          them accounts for the observed variation. Four individuals sharing H3-3A p.Thr45Ile have substantially
          different presentations. The founding report had gone further, concluding that neither variant
          location nor which gene was involved affected the phenotype at all; the larger cohort softened
          that to statistical trends. Either way there is a determinant that has not been found, and the
          authors raise gene-environment interaction as a possibility precisely because histones sit at
          the genetics-epigenetics interface.
      selected_evidence:
        snippet: Since these variables do not account for all BLBS phenotypic variability, these findings
          suggest that additional factors may play a role in modifying the phenotypes of affected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38678163
      reference_title: Expanded phenotypic spectrum of neurodevelopmental and neurodegenerative disorder
        Bryant-Li-Bhoj syndrome with 38 additional individuals.
      evidence_source: HUMAN_CLINICAL
      explanation: States the residual, unexplained variability directly.
