      assertion_type: Pathophysiology
      assertion:
        name: De Novo H3-3A Variant Altering Histone H3.3
        biological_scale: MOLECULAR
        description: The disease begins with a de novo heterozygous variant in H3-3A. Unlike the tightly
          clustered oncohistone substitutions of paediatric glioma, BLBS alleles are largely private and
          spread across the whole 135-residue protein, tail and core alike. They are read as gain of function
          or dominant negative rather than haploinsufficiency, which is what makes a single altered allele
          of one of two redundant H3.3 genes sufficient to cause severe disease.
        genes:
        - preferred_term: H3-3A
          term:
            id: hgnc:4764
            label: H3-3A
        molecular_functions:
        - preferred_term: structural constituent of chromatin
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0030527
            label: structural constituent of chromatin
        genetic_context:
