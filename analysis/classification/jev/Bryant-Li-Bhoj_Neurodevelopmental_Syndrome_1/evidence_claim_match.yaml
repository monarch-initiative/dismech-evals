      assertion:
        name: Autosomal dominant inheritance
        description: 'BLBS1 is autosomal dominant and, for H3-3A specifically, every variant with available
          parental testing has been de novo, so recurrence risk to siblings is low. This is a point of
          difference from H3-3B, where a maternally inherited allele and more variant-type diversity have
          been described. A single altered allele of one of the two H3.3 genes is sufficient: 75% of H3.3
          alleles remain wild type, which is why the phenotype is read as gain of function or dominant
          negative rather than as loss of dosage.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: BRYLIB is expressed in an autosomal dominant manner and typically caused by a de novo
          H3-3A (H3F3A) or H3-3B (H3F3B) pathogenic variant.
