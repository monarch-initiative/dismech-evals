  c89bd5803fd11a651285b01647f6fac9c6a497fab5afbc825b22a20036971796:
    claim:
      about:
        disease:
          name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 1
          disease_term:
            preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 1
            term:
              id: MONDO:0030606
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 1
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Zebrafish h3f3a model
        species: Danio rerio
        genotype: h3f3a p.D123N dominant allele; h3f3a db1092 homozygous null
        publication: PMID:33268356
        description: A zebrafish model of the orthologous gene. A dominant p.D123N allele recovered from
          a forward genetic screen sits two residues from a patient variant (p.Q125R) and reproduces both
          the dominant inheritance and the craniofacial anomalies of the human disease. Homozygous db1092
          null larvae lose neural-crest-derived jaw cartilage completely and show reduced foxd3-positive
          cranial glia, melanocytes and xanthophores. Because the model targets the h3f3a paralog, it
          is the direct ortholog for BLBS1 rather than for BLBS2.
        modeled_mechanisms:
        - target: Neural Crest and Craniofacial Developmental Defect
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: The model reproduces the craniofacial and neural-crest-derived glial components
            of the human phenotype.
          limitations: The dominant allele is p.D123N, not a patient allele, and the strongest cartilage
            and pigment-cell phenotypes come from the homozygous null rather than from a heterozygous
            missense genotype - so the model is closer to loss of h3f3a function than to the gain-of-function
            or dominant-negative mechanism inferred in patients. Zebrafish craniofacial cartilage is not
            a direct counterpart of human facial dysmorphism, and the model says nothing about the neurodevelopmental
            or degenerative phenotypes that dominate the human disease.
          readouts:
          - name: Neural-crest-derived jaw cartilage
            target: Neural Crest and Craniofacial Developmental Defect
            direction: DECREASED
            interpretation: Complete loss of jaw cartilage in homozygous null larvae, the structural readout
              of the craniofacial node.
          - name: foxd3-positive cranial glia
            target: Neural Crest and Craniofacial Developmental Defect
            direction: DECREASED
            interpretation: Reduced cranial glia, the readout that connects the model to the human hypomyelination
              finding.
        associated_phenotypes:
        - Craniofacial anomalies
        - Loss of neural-crest-derived jaw cartilage
        - Reduced foxd3-positive neural-crest-derived glia
      selected_evidence:
        snippet: A zebrafish model showed craniofacial anomalies and a defect in Foxd3-derived glia.
        supports: SUPPORT
