      assertion:
        discussion_id: blbs1_cancer_predisposition
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do germline H3.3 variants confer cancer predisposition, given that the same residues are
          oncogenic when altered somatically?
        attaches_to:
        - pathophysiology#Deregulated Cell Proliferation
        rationale: Patient cells show up-regulated mitosis and division programs and increased proliferative
          capacity, and germline substitutions occur at residues whose somatic counterparts drive paediatric
          glioma - yet no malignancy occurred in the founding cohort. A 2025 survey of 192 individuals
          with germline histonopathies identified the second known individual with both a germline histonopathy
          and a cancer diagnosis, putting community-wide incidence at 1%, below the 5% threshold at which
          routine tumour surveillance is recommended. So the current answer is "no surveillance", reached
          on a denominator small enough that the question stays open, and the authors name it as outstanding.
      selected_evidence:
        snippet: Notably, the community-wide cancer incidence is currently 1%, which falls below the recommended
          5% cut off for routine surveillance.
        supports: REFUTE
    origin:
