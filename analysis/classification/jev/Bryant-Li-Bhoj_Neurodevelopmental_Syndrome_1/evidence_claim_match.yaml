      assertion_type: Pathophysiology
      assertion:
        name: Progressive Postnatal Neuronal H3.3 Dependence
        biological_scale: ORGANISM
        description: The degenerative arm, and the reason the disease has one at all. H3.3 progressively
          replaces the replication-dependent H3 variants in postnatal brain and comes to dominate the
          H3 pool in adulthood, so a defective H3.3 matters more to a neuron the older that neuron gets.
          The clinical correlates are cortical atrophy on imaging and, in adulthood, camptocormia and
          motor decline. The mechanism is an inference from the timing of the substrate rather than a
          demonstrated cause of the human degeneration, which is why it is provisional.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: A recent study showed that H3.3 begins to replace H3.1 and H3.2 in postnatal mouse and
          human brains in a time-dependent manner and displaces these canonical H3 variants almost completely
          in adulthood.
        supports: SUPPORT
