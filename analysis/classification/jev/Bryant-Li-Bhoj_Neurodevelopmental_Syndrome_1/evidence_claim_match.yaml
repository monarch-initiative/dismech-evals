    claim:
      about:
        disease:
          name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 1
          disease_term:
            preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 1
            term:
              id: MONDO:0030606
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Nucleosome Assembly and Chaperone Interaction
        biological_scale: MOLECULAR
        description: 'Molecular modelling of the founding cohort''s variants showed disrupted interactions
          with DNA, with the other core histones, and with the histone chaperones that deposit H3.3. The
          two structural classes fall out by domain: core-domain variants are modelled as destabilising
          the nucleosome itself, while tail-domain variants disrupt protein-protein interactions with
          chromatin readers and chaperones. The mutant histone is still incorporated into nucleosomes
          - this is not a failure to assemble chromatin but a failure to assemble it correctly.'
        molecular_functions:
        - preferred_term: nucleosomal DNA binding
          term:
            id: GO:0031492
            label: nucleosomal DNA binding
        biological_processes:
        - preferred_term: nucleosome assembly
