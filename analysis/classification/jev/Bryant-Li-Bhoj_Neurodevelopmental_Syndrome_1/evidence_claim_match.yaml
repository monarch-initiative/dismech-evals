      assertion_type: Genetic
      assertion:
        name: H3-3A
        gene_term:
          preferred_term: H3-3A
          term:
            id: hgnc:4764
            label: H3-3A
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: H3-3A (formerly H3F3A) encodes the replication-independent histone variant H3.3, identical
          in protein sequence to the product of H3-3B. The two genes differ in regulatory and coding sequence,
          giving different expression patterns and levels, and it is that paralog-level difference - not
          a difference in protein - that separates BLBS1 from BLBS2. Variants are private and distributed
          across the protein; the most recurrent reported allele is p.Thr45Ile.
        case_fractions:
        - population: Global BLBS cohort reported through 2024
          case_fraction_percent: 67.7
          cohort_size: 96
          notes: 65 of 96 reported individuals with BLBS carried an H3-3A variant, the remainder H3-3B.
            This is a discovery-cohort split rather than a population estimate.
      selected_evidence:
        snippet: In this work, we have identified a cohort of 46 unrelated patients bearing de novo heterozygous
          germline missense mutations in H3F3A or H3F3B with a core phenotype of progressive neurologic
          dysfunction and congenital anomalies.
        supports: SUPPORT
