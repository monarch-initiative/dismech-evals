            term:
              id: MONDO:0030606
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 1
        context: []
      assertion_type: AnimalModel
      assertion:
        name: H3.3 T45I knock-in mouse
        species: Mus musculus
        genotype: h3-3a p.T45I knock-in
        publication: DOI:10.64898/2026.06.16.732665
        description: 'A knock-in mouse carrying h3-3a p.T45I, the most recurrent BLBS1 allele and the
          one this entry curates under variants. It is genotype-matched to human disease rather than a
          null, which is what distinguishes it from the zebrafish model, and it reproduces the two-phase
          natural history: perinatal growth restriction and delayed developmental milestones early, progressive
          motor and gait impairment later. Adult animals additionally show craniofacial differences and
          behavioural changes. Reported so far only as a preprint.'
        modeled_mechanisms:
        - target: Progressive Postnatal Neuronal H3.3 Dependence
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces progressive motor and gait impairment on a congenital genotype, which
            is the phenomenon this node exists to explain.
          limitations: Progressive motor impairment in a mouse is not camptocormia, and the preprint reports
            no cortical atrophy or other neuropathological correlate, so the node's proposed mechanism
            - the postnatal shift of the neuronal H3 pool to H3.3 - is not itself tested by these endpoints.
            Peer review is pending.
          readouts:
          - name: Motor and gait performance
            target: Progressive Postnatal Neuronal H3.3 Dependence
            direction: DECREASED
            interpretation: Progressive decline in motor and gait measures with age, the behavioural correlate
              of the degenerative phase.
        - target: Abnormal Brain Development
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reproduces delayed developmental milestones and perinatal growth restriction.
          limitations: Mouse developmental milestones are not a counterpart of human developmental delay
            or intellectual disability, and the preprint reports no structural brain phenotype - no corpus
            callosum, posterior fossa or myelination finding - so the imaging component of this node is
            unmodelled. Seizures are not reported either.
          readouts:
          - name: Developmental milestone attainment
            target: Abnormal Brain Development
            direction: DECREASED
            interpretation: Delayed attainment of developmental milestones in mutant pups.
        - target: Neural Crest and Craniofacial Developmental Defect
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Adult mutant animals show craniofacial differences.
          limitations: The preprint reports craniofacial difference as a phenotype without linking it
            to neural crest biology, and the human dysmorphism has no recognisable gestalt to compare
            against, so the correspondence is at the level of "the face is different" and no further.
      selected_evidence:
        snippet: 'mice recapitulate the BLBS natural history: perinatal growth restriction, delayed developmental
          milestones, and progressive motor and gait impairments.'
        supports: SUPPORT
