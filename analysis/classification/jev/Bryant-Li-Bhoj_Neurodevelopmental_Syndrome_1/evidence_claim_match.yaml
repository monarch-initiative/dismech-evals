            preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 1
            term:
              id: MONDO:0030606
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 1
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Neurodegenerative phase
        age_range: adulthood
        notes: 'A distinct later component: about a fifth of the founding cohort showed clinical neurologic
          degeneration, and cortical atrophy is seen on imaging in roughly a quarter even without intractable
          epilepsy. Camptocormia, worsening gait, spasticity and loss of previously acquired milestones
          are the reported manifestations. This is the feature that put "neurodegenerative" in the name
          of the founding report.'
      selected_evidence:
        snippet: Mendelian histonopathies are rare neurodevelopmental disorders (NDDs) caused by germline
          variants in histone-encoding genes. Here, we perform a more expansive pan-histonopathy interrogation
          than previously possible. We analyze data from 192 individuals affected by histonopathies. This
          analysis includes representation of the 185 published individuals with HIST1H1E syndrome, Bryant-Li-Bhoj
          syndrome, and Tessadori-Bicknell-van Haaften NDD; as well as from seven unpublished individuals,
          five of whom harbor variants in genes not previously associated with disease (HIST1H2AL/H2AC16,
          H2AFZ/H2AZ1, HIST1H3D/H3C4, and HIST3H3/H3-4). ... Ultimately, this work highlights the ways
          in which histonopathy-associated phenotypes change throughout the lifespan, necessitating longitudinal
          re-evaluation; that every identified individual shapes our understanding of these syndromes
          in a way that improves care for this community; and the value of ongoing translational work
          to address the outstanding question of cancer predisposition for individuals living with germline
          histonopathies.
        supports: SUPPORT
    origin:
      assertion_path: /progression/1
      evidence_path: /progression/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40241305
      reference_title: Coupling deep phenotypic quantification with next-generation phenotyping for 192
        individuals with germline histonopathies.
      evidence_source: HUMAN_CLINICAL
      explanation: Retains the pan-histonopathy cohort including Bryant-Li-Bhoj syndrome. Lifespan-dependent
        phenotypic change does not itself establish BLB1-specific adult neurodegeneration or the founding
        cohort’s detailed frequencies.
