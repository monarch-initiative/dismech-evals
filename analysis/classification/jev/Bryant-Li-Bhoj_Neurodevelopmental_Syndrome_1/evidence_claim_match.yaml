      assertion_type: DifferentialDiagnosis
      assertion:
        name: Bryant-Li-Bhoj neurodevelopmental syndrome 2
        description: The H3-3B counterpart. The two genes encode an identical protein, so the entities
          are separated by gene rather than by protein product and are clinically overlapping. Only molecular
          testing distinguishes them. Cohort-level trends exist but are not diagnostic discriminators,
          and the H3-3A cohort differs in that every variant with parental data has been de novo and missense,
          whereas H3-3B has yielded synonymous, stop-loss and one inherited allele.
        disease_term:
          preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 2
          term:
            id: MONDO:0030607
            label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
        distinguishing_features:
        - 'Determined solely by molecular testing: a pathogenic variant in H3-3A rather than H3-3B'
        - Greater variant-type and inheritance diversity is reported for H3-3B, including a synonymous
          stop-gain, a stop-loss and one inherited allele
      selected_evidence:
        snippet: Conversely, while most variants in H3-3B are heterozygous de novo missense variants,
          more variability in variant type and modes of inheritance was observed.
        supports: SUPPORT
