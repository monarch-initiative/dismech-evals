            preferred_term: H3-3A
            term:
              id: hgnc:4764
              label: H3-3A
          allele_type: MISSENSE
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: Heterozygous de novo missense alleles distributed across the protein. Recorded
            as gain of function following the authors' own reading; a dominant-negative effect is the
            stated alternative for some alleles.
      selected_evidence:
        snippet: In this work, we have identified a cohort of 46 unrelated patients bearing de novo heterozygous
