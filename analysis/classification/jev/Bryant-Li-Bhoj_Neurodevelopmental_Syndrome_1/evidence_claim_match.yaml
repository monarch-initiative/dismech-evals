            term:
              id: MONDO:0030606
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 1
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Somatic H3.3 oncohistone disease
        description: 'Substitutions at the same H3.3 residues - K27M, G34R/V, K36M - occur somatically
          and drive paediatric diffuse midline glioma and giant cell tumour of bone. This is a molecular
          contrast rather than a clinical differential, but it matters when a germline result at one of
          those residues is reported: the germline and somatic diseases have different mechanisms, and
          germline carriers of G34R/V substitutions have not developed the corresponding tumours.'
        distinguishing_features:
        - Germline variants are private and scattered across the protein; oncohistone substitutions are
          recurrent hotspots
        - Germline variants deregulate histone modification locally and in cis; somatic lysine substitutions
          dysregulate it globally in trans
        - No malignancy occurred in the founding BLBS cohort
      selected_evidence:
        snippet: Patient histone posttranslational modifications (PTMs) analysis revealed notably aberrant
          local PTM patterns distinct from the somatic lysine mutations that cause global PTM dysregulation.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
