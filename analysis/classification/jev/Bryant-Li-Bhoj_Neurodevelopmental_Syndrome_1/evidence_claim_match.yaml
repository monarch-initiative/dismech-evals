  33a5b76b25e3b3c230e63f4acc760e9e74bc34cf145052fe5da281b14dac7e43:
    claim:
      about:
        disease:
          name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 1
          disease_term:
            preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 1
            term:
              id: MONDO:0030606
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: blbs1_no_neurodevelopmental_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the available in vivo models capture a disease caused by heterozygous gain-of-function
          or dominant-negative alleles, when one is a homozygous null and the other is scored on behavioural
          endpoints with no neuropathological correlate?
        attaches_to:
        - animal_models#Zebrafish h3f3a model
        - animal_models#H3.3 T45I knock-in mouse
        - pathophysiology#Progressive Postnatal Neuronal H3.3 Dependence
        rationale: The two models fail in opposite directions. The zebrafish h3f3a mutant has a dominant
          allele that reproduces the mode of inheritance, but its strong cartilage and pigment-cell phenotypes
          come from the homozygous null - a loss-of-function genotype, where the human disease is read
          as gain of function or dominant negative on a background of three wild-type H3.3 alleles - and
          it speaks only to craniofacial and glial development. The T45I knock-in mouse fixes the genotype
          problem exactly, carrying the most recurrent human allele in heterozygous form, and reproduces
          the two-phase natural history; but its endpoints are developmental milestones, gait and behaviour,
          with no reported structural brain phenotype and no neuropathology. So the entry's central claim
          - that the degenerative phase follows from the postnatal shift of the neuronal H3 pool to H3.3
          - is consistent with the mouse but not tested by it, and the structural findings that define
          the human neuroimaging phenotype have no in vivo counterpart in either model. The mouse is also
          so far a preprint.
      selected_evidence:
        snippet: Most of the causative variants are private and scattered throughout the protein, but
          all seem to have either a gain-of-function or dominant negative effect on protein function.
          This is highly unusual and not well understood.
        supports: SUPPORT
