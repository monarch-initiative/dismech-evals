      assertion_type: Pathophysiology
      assertion:
        name: Neural Crest and Craniofacial Developmental Defect
        biological_scale: TISSUE
        description: H3.3 is required for the neural crest program that builds the craniofacial skeleton.
          In zebrafish, a dominant h3f3a p.D123N allele — two residues from a patient variant — reproduces
          craniofacial anomalies, and homozygous h3f3a mutants lose neural-crest-derived jaw cartilage
          entirely and show reduced foxd3-positive neural-crest-derived glia along with melanocyte and
          xanthophore loss. The glial defect is proposed to underlie the hypomyelination seen on patient
          neuroimaging, making this node a shared origin for the facial dysmorphism and part of the white-matter
          phenotype.
        cell_types:
        - preferred_term: migratory neural crest cell
          term:
            id: CL:0000333
            label: migratory neural crest cell
        - preferred_term: glial cell
          term:
            id: CL:0000125
            label: glial cell
        biological_processes:
        - preferred_term: neural crest cell differentiation
          term:
            id: GO:0014033
            label: neural crest cell differentiation
          modifier: ABNORMAL
        - preferred_term: glial cell differentiation
          term:
            id: GO:0010001
            label: glial cell differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: A zebrafish model showed craniofacial anomalies and a defect in Foxd3-derived glia.
        supports: SUPPORT
