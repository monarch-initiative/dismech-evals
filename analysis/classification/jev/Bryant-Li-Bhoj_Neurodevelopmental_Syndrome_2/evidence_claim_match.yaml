        description: The H3-3A-related counterpart of this disorder. The two are clinically indistinguishable
          at the level of an individual patient — the protein product is identical — and are separated
          only by which paralog carries the variant. Cohort-level differences favour BLBS1 for delayed
          walking (85% vs 65%) and dysmorphism, and BLBS2 for seizures (59% vs 45%) and genital anomalies
          (28% vs 17%), but these are group trends, not diagnostic discriminators.
        disease_term:
          preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 1
          term:
            id: MONDO:0030606
            label: Bryant-Li-Bhoj neurodevelopmental syndrome 1
        distinguishing_features:
        - 'Determined solely by molecular testing: a pathogenic variant in H3-3A rather than H3-3B'
        - Cohort-level trend toward more frequent delayed walking and dysmorphism than in BLBS2
        - Cohort-level trend toward fewer seizures and fewer genital anomalies than in BLBS2
      selected_evidence:
        snippet: While specific genotype-phenotype correlations have not been conclusively delineated
        supports: SUPPORT
