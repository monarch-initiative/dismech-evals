              label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: blbs2_proliferation_no_cancer
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do germline H3-3B variant carriers show increased cellular proliferation yet no excess
          of malignancy, including at residues (p.G34) that are oncogenic when mutated somatically?
        attaches_to:
        - pathophysiology#Deregulated Cell Proliferation
        rationale: Patient fibroblasts, including H3F3B p.G34V lines, proliferate faster than controls
          and up-regulate mitosis genes, yet the founding 46-patient cohort had congenital anomalies without
          malignancies and the community-wide cancer incidence across germline histonopathies sits at
          1%. Somatic p.G34V is oncogenic only in combination with ATRX/DAXX and TP53 lesions, suggesting
          the germline context lacks the required cooperating hits, or that developmental timing and cell
          of origin gate transformation.
        proposed_experiments:
        - experiment_id: exp_blbs2_cancer_incidence_followup
          name: Longitudinal cancer-incidence follow-up of the international BLBS cohort
          description: Prospectively track tumour incidence in the registry cohort with standardised ascertainment,
            extending the community-wide incidence estimate and testing it against the 5% threshold used
            to justify routine surveillance.
          supporting_outcome:
          - An incidence rising above the surveillance threshold would establish BLBS2 as a cancer-predisposition
            syndrome.
          refuting_outcome:
          - A stable incidence at or below population background would confirm that no tumour surveillance
            is warranted.
        - experiment_id: exp_blbs2_cooperating_hit_transformation
          name: Cooperating-lesion transformation assay in germline H3.3-variant cells
          description: Test whether germline H3.3-variant cells acquire transformation potential when
            ATRX/DAXX or TP53 are additionally disrupted, and compare the chromatin state of germline-variant
            glial precursors with K27M/G34-mutant glioma cells.
          supporting_outcome:
          - Transformation only in the presence of cooperating lesions would explain the germline proliferation-without-malignancy
            paradox.
          refuting_outcome:
          - Failure to transform under any cooperating lesion would point instead to cell of origin or
            developmental timing as the gate.
      selected_evidence:
        snippet: the value of ongoing translational work to address the outstanding question of cancer
          predisposition for individuals living with germline histonopathies
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
