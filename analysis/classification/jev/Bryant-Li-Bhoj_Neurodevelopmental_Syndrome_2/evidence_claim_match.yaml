  ef87a785b9809e15b1fd1bcc143220d4ecbeeeb8887ca484626a9b35f8c1ad48:
    claim:
      about:
        disease:
          name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 2
          disease_term:
            preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 2
            term:
              id: MONDO:0030607
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Abnormal Brain Development and Progressive Neurologic Dysfunction
        biological_scale: ORGANISM
        description: The organism-level endpoint is a malformed, hypomyelinated brain with a characteristic
          imaging signature — small posterior fossa, dysgenesis of the corpus callosum (especially the
          splenium), cortical developmental abnormalities such as dysgyria and hypoplastic temporal poles,
          and deformity of the lateral ventricles — accompanied by developmental delay/intellectual disability,
          abnormal muscle tone, epilepsy and oculomotor dysfunction. Unlike a purely static encephalopathy,
          a subset of individuals show a progressive course with loss of milestones, worsening gait, spasticity
          and camptocormia, which is why BLBS was first described as a neurodegenerative disorder. Cortical
          atrophy is also reported, although longitudinal neuronal loss remains unproven.
      selected_evidence:
