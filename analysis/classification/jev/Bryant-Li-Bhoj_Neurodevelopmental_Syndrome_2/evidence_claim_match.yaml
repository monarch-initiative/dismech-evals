              label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: blbs2_systemic_features_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which of the following reported features are reproducibly associated with BLBS2, and what
          mechanisms link the established associations to germline H3-3B variants — congenital heart defects,
          genital anomalies and cryptorchidism, short stature, macrocephaly, craniosynostosis, dermatologic
          anomalies, joint hypermobility, scoliosis, failure to thrive and feeding difficulties, hypothyroidism,
          hearing impairment, constipation and astigmatism?
        attaches_to:
        - phenotypes#Congenital Heart Defects
        - phenotypes#Genital Anomalies
        - phenotypes#Cryptorchidism
        - phenotypes#Short Stature
        - phenotypes#Macrocephaly
        - phenotypes#Craniosynostosis
        - phenotypes#Dermatologic Anomalies
        - phenotypes#Joint Hypermobility
        - phenotypes#Scoliosis
        - phenotypes#Failure to Thrive and Feeding Difficulties
        - phenotypes#Hypothyroidism
        - phenotypes#Hearing Impairment
        - phenotypes#Constipation
        - phenotypes#Astigmatism
        rationale: 'All mechanistic work on BLBS to date concerns chromatin, neural differentiation, proliferation
          and the neural crest; no study has examined how the variant histone perturbs cardiac, genitourinary,
          skeletal-growth, endocrine, dermatologic or auditory development. Ubiquitous H3.3 expression
          — with relatively high levels in testes, ovaries and uterus as well as brain — makes multi-system
          involvement plausible, but plausibility is not a mechanism, and these phenotypes are deliberately
          left without causal edges in the pathograph rather than wired to the neurologic endpoint they
          do not belong to. Three of them are the ones most tempting to wire anyway, because a neurologic-secondary
          story is easy to tell: constipation may simply follow hypotonia and immobility, scoliosis may
          be neuromuscular, and the feeding difficulties and poor weight gain may follow oromotor dysfunction
          and abnormal tone. No source states any of the three for BLBS, so the same standard applies
          to them as to the rest — and scoliosis and joint hypermobility come from the same musculoskeletal
          table row of the same cohort at nearly the same frequency (21% and 22%), so treating them differently
          would be arbitrary. Craniosynostosis is the closest call in this list, since it is a skull-vault
          phenotype and the entry does model a neural-crest and craniofacial developmental defect; it
          is left here because no BLBS source links the two, and because the craniofacial evidence is
          a zebrafish h3f3a result rather than a human one. Association itself also needs evaluation before
          mechanism: the 2025 pan-histonopathy analysis emphasizes data gaps that confound phenotypic-pattern
          identification. Thus a recorded cardiac, auditory, genitourinary or endocrine finding should
          not automatically be treated as an established syndrome-defining association.'
      selected_evidence:
        snippet: they more strikingly highlight data gaps that confound the identification of phenotypic
          patterns at this time.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/5
      evidence_path: /discussions/5/evidence/0
      context_paths:
