      assertion:
        name: H3-3B
        gene_term:
          preferred_term: H3-3B
          term:
            id: hgnc:4765
            label: H3-3B
        association: De novo heterozygous pathogenic variants
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: H3-3B (formerly H3F3B) is the sole cause of BLBS2. It encodes the replication-independent
          histone variant H3.3, a protein identical to that encoded by H3-3A; the two genes differ in
          untranslated and coding sequence, giving different expression patterns and levels, and both
          are expressed ubiquitously with relatively high levels in brain, testes, ovaries and uterus.
          Both genes are strongly missense-constrained (gnomAD missense Z = 2.95 for H3F3B), and cohort
          variants were essentially absent from 138,632 gnomAD controls. Reported BLBS2 alleles include
          missense changes in both the histone tail and the histone core (for example p.A29P, p.G34V,
          p.L48R, p.M121I, p.P121R, p.R129H), a synonymous variant that alters an alternate-transcript
          stop codon (p.V117V/p.S146X), and stop-loss variants; p.P121R was recurrent in the founding
          cohort. Variant location within the protein — and the identity of the gene (H3-3A versus H3-3B)
          — contributes more to phenotypic severity than sex, but no definitive genotype-phenotype correlation
          has been established, and individuals with the same variant can differ markedly.
      selected_evidence:
        snippet: 'Bryant-Li-Bhoj syndrome (BLBS), which became OMIM-classified in 2022 (OMIM: 619720,
          619721), is caused by germline variants in the two genes that encode histone H3.3 (H3-3A/H3F3A
          and H3-3B/H3F3B)'
        supports: SUPPORT
