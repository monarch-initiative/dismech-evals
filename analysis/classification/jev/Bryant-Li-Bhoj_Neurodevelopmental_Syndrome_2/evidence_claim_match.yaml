  edeb569964991d516cc4c11aa7fa1ebb7108af7859d66eb4bcc4e9a609daace7:
    claim:
      about:
        disease:
          name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 2
          disease_term:
            preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 2
            term:
              id: MONDO:0030607
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Nucleosome Assembly and Chaperone Interaction
        biological_scale: MOLECULAR
        description: 'Molecular modelling of the full BLBS variant set shows that the substituted residues
          disrupt contacts with DNA, with the other core histones, and with histone chaperones. Residues
          essential for H3.3-specific recognition (for example p.G90, required for DAXX/UBN1 binding,
          and p.S31, required for ZMYND11 recognition) are mutated in patients, and some alleles change
          how much H3.3 protein is present or how tightly it binds its chaperone: several constructs reduce
          H3.3 protein levels, one (p.R41C) accumulates above wild-type, and p.R129H binds the chaperone
          DAXX more strongly than wild-type. The common consequence is that the formation, deposition
          and stability of H3.3-containing nucleosomes is altered.'
        molecular_functions:
        - preferred_term: histone binding
          term:
            id: GO:0042393
            label: histone binding
          modifier: ABNORMAL
        - preferred_term: DNA binding
          term:
            id: GO:0003677
            label: DNA binding
          modifier: ABNORMAL
        biological_processes:
        - preferred_term: nucleosome assembly
          term:
            id: GO:0006334
            label: nucleosome assembly
          modifier: ABNORMAL
      selected_evidence:
        snippet: Molecular modeling of all 37 variants demonstrated clear disruptions in interactions
          with DNA, other histones, and histone chaperone proteins.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33268356
      reference_title: 'Histone H3.3 beyond cancer: Germline mutations in Histone 3 Family 3A and 3B cause
        a previously unidentified neurodegenerative disorder in 46 patients'
      evidence_source: COMPUTATIONAL
      explanation: Structural modelling across the whole variant set establishes disrupted DNA/histone/chaperone
