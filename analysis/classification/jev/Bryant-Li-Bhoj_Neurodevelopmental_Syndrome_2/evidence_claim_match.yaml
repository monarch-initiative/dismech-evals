  a3a294b8f132d3c1c1e016ceb61046797c74dca6020412f3ff3aa003c0efd9bf:
    claim:
      about:
        disease:
          name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 2
          disease_term:
            preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 2
            term:
              id: MONDO:0030607
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: blbs2_human_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the available zebrafish evidence for BLBS reflect BLBS2 biology, given that it models
          the h3f3a paralog rather than h3f3b?
        attaches_to:
        - pathophysiology#Neural Crest and Craniofacial Developmental Defect
        rationale: The craniofacial and glial arms of the mechanism rest substantially on a zebrafish
          h3f3a model (dominant p.D123N and homozygous db1092 alleles). Since the whole basis for splitting
          BLBS1 from BLBS2 is a paralog-level difference in expression rather than protein sequence, a
          model built on the other paralog cannot by construction test paralog-specific effects, and zebrafish
          h3f3 gene-family structure differs from the human two-gene arrangement. The craniofacial phenotype
          may therefore be attributable to total H3.3 dosage rather than to anything specific to H3-3B.
        proposed_experiments:
        - experiment_id: exp_blbs2_h3f3b_orthologue_models
          name: Orthologous h3f3b animal models for the craniofacial and glial arms
          description: Generate zebrafish and mouse models of orthologous h3f3b alleles, compare craniofacial
            and glial phenotypes with the existing h3f3a models, and quantify paralog-specific expression
            in neural crest across species.
          supporting_outcome:
          - Reproduction of the craniofacial and foxd3-glia phenotypes by h3f3b alleles would license
            the existing model evidence for BLBS2.
          refuting_outcome:
          - Absence of the phenotype in h3f3b models would confine the current model evidence to total
            H3.3 dosage rather than to BLBS2.
        - experiment_id: exp_blbs2_ipsc_neural_crest
          name: Human iPSC-derived neural crest test of the foxd3-glia phenotype
          description: Differentiate BLBS2-allele iPSCs to neural crest and crest-derived glia to test
            whether the zebrafish foxd3-positive glial deficit reproduces in human cells.
          supporting_outcome:
          - A crest-derived glial deficit in human BLBS2 cells would bridge the cross-species gap.
          refuting_outcome:
          - Normal human crest-derived glia would leave the zebrafish glial phenotype unconfirmed for
            human disease.
      selected_evidence:
        snippet: A dominant zebrafish model (p.D123N) derived from a forward genetic screen has been previously
          reported with craniofacial abnormalities, which were replicated in our patient cohort
        supports: SUPPORT
