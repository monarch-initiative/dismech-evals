          form has been described; the disease alleles are missense, synonymous (transcript-dependent)
          and stop-loss changes acting through gain-of-function or dominant-negative effects rather than
          loss of one copy.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Therefore, the risk to other family members is presumed to be low.
        supports: SUPPORT
