              label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Diffuse midline glioma, H3 K27-altered
        description: The somatic counterpart of H3.3 disease. Recurrent somatic H3.3 substitutions (K27M,
          G34R/V) in glial precursors drive pediatric high-grade glioma with genome-wide collapse of histone
          post-translational modifications. Germline BLBS variants are private, scattered, cause only
          local PTM changes, and are not associated with malignancy — the 46-patient founding cohort had
          congenital anomalies without tumours.
        distinguishing_features:
        - Somatic and tumour-restricted rather than germline and constitutional
        - Recurrent hotspot substitutions (K27M, G34R/V) rather than private protein-wide variants
        - Global histone PTM dysregulation rather than local in-cis PTM change
        - Malignancy as the presenting problem rather than a congenital neurodevelopmental syndrome
      selected_evidence:
        snippet: Patient histone posttranslational modifications (PTMs) analysis revealed notably aberrant
          local PTM patterns distinct from the somatic lysine mutations that cause global PTM dysregulation.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
