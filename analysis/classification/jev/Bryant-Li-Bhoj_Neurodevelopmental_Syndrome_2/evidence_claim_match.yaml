        prompt: Is BLBS2 genuinely neurodegenerative, or is the apparent regression a developmental plateau
          with musculoskeletal decline?
        attaches_to:
        - pathophysiology#Abnormal Brain Development and Progressive Neurologic Dysfunction
        rationale: BLBS was first described as a progressive neurodegenerative syndrome, and GeneReviews
          lists loss of milestones, worsening gait, spasticity and camptocormia. But the expanded cohort
          reframed the disorder as primarily neurodevelopmental, and some individuals show resolving rather
          than progressive hypotonia. No longitudinal imaging or biomarker study has established whether
          neuronal loss actually occurs. The answer changes both prognostic counselling and trial endpoint
          selection.
        proposed_experiments:
        - experiment_id: exp_blbs2_longitudinal_imaging_biomarker
          name: Prospective longitudinal MRI volumetry with neuroaxonal injury biomarkers
          description: Follow a BLBS2 cohort with serial MRI volumetry, standardised developmental assessment
            and serial neurofilament light chain measurement to distinguish genuine neuronal loss from
            a developmental plateau.
          supporting_outcome:
          - Progressive volume loss with rising neurofilament light chain would confirm a true neurodegenerative
            component.
          refuting_outcome:
          - Stable volumes and biomarkers alongside a developmental plateau would reframe the apparent
            regression as non-degenerative.
      selected_evidence:
        snippet: histonopathy-associated phenotypes change throughout the lifespan, necessitating longitudinal
          re-evaluation
        supports: SUPPORT
