        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: blbs2_paralog_basis
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do variants in H3-3B produce a nosologically separate disorder (BLBS2) from variants
          in H3-3A (BLBS1) when the two genes encode an identical protein?
        attaches_to:
        - pathophysiology#De Novo H3-3B Variant Altering Histone H3.3
        rationale: The two BLBS entities exist because two genes are involved, not because two proteins
          are. The only known differences are in untranslated and coding sequence, which alter expression
          pattern and level. Cohort data show gene-dependent frequency differences (seizures 59% vs 45%;
          genital anomalies 28% vs 17%; delayed walking 65% vs 85%), so the paralogs are not interchangeable,
          but the mechanism converting a paralog-level expression difference into these phenotype shifts
          is unknown. Resolving it determines whether BLBS1 and BLBS2 should remain separate entities
          or be lumped.
        proposed_experiments:
        - experiment_id: exp_blbs2_paralog_expression_atlas
          name: Paralog-resolved H3-3A/H3-3B expression atlas across human brain development
          description: Quantify H3-3A and H3-3B transcript and protein abundance across human developmental
            brain stages and cell types to test whether the paralogs differ in the windows and lineages
            relevant to the divergent phenotypes.
          supporting_outcome:
          - Paralog-specific expression differences in neural lineages would explain why an identical
            protein product yields two clinical entities.
          refuting_outcome:
          - Indistinguishable paralog expression across all relevant stages and cell types would argue
            that the BLBS1/BLBS2 split is nosological rather than biological.
        - experiment_id: exp_blbs2_isogenic_paralog_swap
          name: Isogenic paralog-matched substitution series in iPSC-derived neurons
          description: Generate isogenic iPSC lines carrying the same amino-acid substitution introduced
            into H3-3A versus H3-3B, then compare chromatin accessibility, transcriptome and neuronal
            electrophysiology between the matched pairs.
          supporting_outcome:
          - Divergent chromatin or electrophysiological phenotypes from the same substitution in the two
            paralogs would establish a paralog-intrinsic effect.
          refuting_outcome:
          - Identical phenotypes from matched substitutions would locate the difference in mutational
            opportunity or ascertainment rather than paralog biology.
      selected_evidence:
        snippet: Since these variables do not account for all BLBS phenotypic variability, these findings
          suggest that additional factors may play a role in modifying the phenotypes of affected individuals.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
