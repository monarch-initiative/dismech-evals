      assertion_type: ExperimentalModel
      assertion:
        name: H3-3B p.Leu48Arg iPSC-derived neural model
        description: Induced pluripotent stem cells carrying the BLBS2 allele H3-3B p.Leu48Arg, differentiated
          into 2D neural progenitor cells, 2D forebrain neurons and 3D dorsal forebrain organoids, with
          paired transcriptomic and chromatin-accessibility profiling, immunofluorescence cell-identity
          mapping and whole-cell patch clamp. This is the first human-derived mechanistic model of BLBS
          and the principal BLBS2-specific model system available.
        experimental_model_type: IPSC_DERIVED_MODEL
        organism:
          preferred_term: human
          term:
            id: NCBITaxon:9606
            label: Homo sapiens
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        publication: PMID:41689096
        findings:
        - statement: Paired chromatin-accessibility and transcriptomic changes affect neuronal fate, cell
            adhesion, neurotransmission and excitatory/inhibitory balance.
          supporting_text: In the 2D systems, we found dysregulated gene expression and chromatin accessibility
            affecting neuronal fate, adhesion, neurotransmission, and excitatory/inhibitory balance.
        - statement: Organoids show altered proportions of radial glia and mature neurons, and the neurons
            that form are electrophysiologically immature.
          supporting_text: Patch clamp recordings revealed decreased electrical activity in neurons from
            L48R DFBOs compared to control DFBOs.
        - statement: The proposed proximal mechanism is increased H3-3B expression driving hyper-deposition
            of H3.3 into the nucleosome.
          supporting_text: H3.3 L48R increases H3-3B expression, resulting in the hyper-deposition of
            H3.3 into the nucleosome, which underlies changes in gene expression and chromatin accessibility
      selected_evidence:
        snippet: These data provide the first mechanistic insights into the pathogenesis of BLBS from
          a human-derived model of neurodevelopment
        supports: SUPPORT
