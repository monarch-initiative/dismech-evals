      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: h33_hyperdeposition_model
        hypothesis_label: H3.3 hyper-deposition model of BLBS2
        status: EMERGING
        description: Proposes that the H3-3B disease allele acts by increasing H3-3B expression and driving
          excess incorporation of H3.3 into nucleosomes, so that the primary lesion is too much variant
          histone in chromatin rather than a loss of histone function. Demonstrated so far for a single
          allele (p.Leu48Arg) in one isogenic iPSC series; whether it generalises to tail-domain, core-domain
          and stop-loss BLBS2 alleles is untested, and it sits alongside the alternative view that different
          variants act through heterogeneous local mechanisms (impaired chaperone binding, altered protein
          stability, disrupted DNA contact).
      selected_evidence:
        snippet: These data provide the first mechanistic insights into the pathogenesis of BLBS from
          a human-derived model of neurodevelopment
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
