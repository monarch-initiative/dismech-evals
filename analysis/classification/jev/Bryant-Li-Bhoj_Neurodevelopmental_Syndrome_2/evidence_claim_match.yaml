        description: A germline BLBS2 allele at a residue that is also mutated somatically in pediatric
          high-grade glioma. In the somatic setting p.G34V drives oncogenesis only in combination with
          ATRX/DAXX and TP53 lesions; in the germline setting carriers develop BLBS without malignancy,
          and patient fibroblasts show increased proliferation. This allele is the clearest illustration
          of the germline-versus-somatic mechanistic divergence in H3.3 disease.
        gene:
          preferred_term: H3-3B
          term:
            id: hgnc:4765
            label: H3-3B
      selected_evidence:
        snippet: The only other variant in our cohort that is similar to a cancer-linked variant is the
          p.G34V mutation in H3F3B.
        supports: SUPPORT
