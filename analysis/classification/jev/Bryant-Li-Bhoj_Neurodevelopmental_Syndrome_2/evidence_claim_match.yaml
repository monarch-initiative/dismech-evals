    evidence_metadata:
      reference: PMID:40241305
      reference_title: Coupling deep phenotypic quantification with next-generation phenotyping for 192
        individuals with germline histonopathies.
      evidence_source: HUMAN_CLINICAL
      explanation: The pan-histonopathy phenotyping analysis identifies uncertainty in the phenotypic
        patterns themselves, motivating association confirmation before assigning mechanisms to variably
        reported BLBS features.
