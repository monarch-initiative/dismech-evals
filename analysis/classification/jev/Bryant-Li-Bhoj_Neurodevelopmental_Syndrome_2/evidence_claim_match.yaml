        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: blbs2_variant_heterogeneity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do all BLBS2 alleles act through a single mechanism (H3.3 hyper-deposition), or do tail,
          core and stop-loss variants act through distinct local mechanisms?
        attaches_to:
        - pathophysiology#Disrupted Nucleosome Assembly and Chaperone Interaction
        rationale: 'Functional data point in different directions: some constructs reduce H3.3 protein
          levels while another accumulates above wild-type; one increases chaperone binding; and the one
          allele studied in a human neural model (p.L48R) increases H3-3B expression and nucleosomal H3.3.
          Whether these are variations on one theme or genuinely different mechanisms determines whether
          a single therapeutic strategy could serve the whole disorder.'
        proposed_experiments:
        - experiment_id: exp_blbs2_allelic_series_multiomic
          name: Multi-omic iPSC allelic series across tail, core and stop-loss BLBS2 variants
          description: Apply the p.L48R iPSC pipeline to a panel of BLBS2 alleles spanning the histone
            tail, the histone core and stop-loss classes, quantifying nucleosomal H3.3 occupancy genome-wide
            alongside transcriptome and chromatin accessibility.
          supporting_outcome:
          - Shared hyper-deposition across allele classes would establish a single unifying mechanism
            and a single therapeutic target.
          refuting_outcome:
          - Opposite-direction deposition changes across allele classes would confirm mechanistic heterogeneity
            and argue against a one-size-fits-all therapy.
      selected_evidence:
        snippet: Three variant constructs (p.R129H, p.M121I, and p.I52N) showed significant decrease in
          protein expression, while one variant (p.R41C) accumulated at greater levels than wild-type
          control.
        supports: SUPPORT
