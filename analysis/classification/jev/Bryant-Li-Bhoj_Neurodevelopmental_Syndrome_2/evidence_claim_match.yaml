  4662c14f568a53c38fdddb1ee376f6dc5b6b971087cb9c9f1f5b0765bb3e5e54:
    claim:
      about:
        disease:
          name: Bryant-Li-Bhoj Neurodevelopmental Syndrome 2
          disease_term:
            preferred_term: Bryant-Li-Bhoj neurodevelopmental syndrome 2
            term:
              id: MONDO:0030607
              label: Bryant-Li-Bhoj neurodevelopmental syndrome 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: De Novo H3-3B Variant Altering Histone H3.3
        biological_scale: MOLECULAR
        description: BLBS2 begins with a de novo heterozygous variant in H3-3B, one of the two genes encoding
          the replication-independent histone variant H3.3. H3-3A and H3-3B produce an identical 135-amino-acid
          protein but differ in their regulatory and coding sequences, giving different expression patterns
          and levels — the only basis on which the two BLBS entities are separated. Unlike the recurrent
          oncohistone substitutions of pediatric glioma, BLBS alleles are largely private and distributed
          across the whole protein (tail and core), and include missense, synonymous/transcript-dependent
          and stop-loss changes. They act through gain-of-function or dominant-negative mechanisms, not
          haploinsufficiency, which is why a single altered allele of a highly constrained histone gene
          produces disease.
        genes:
        - preferred_term: H3-3B
          term:
            id: hgnc:4765
            label: H3-3B
        molecular_functions:
        - preferred_term: structural constituent of chromatin
          term:
            id: GO:0030527
            label: structural constituent of chromatin
      selected_evidence:
        snippet: The histone H3 variant H3.3, encoded by two genes H3-3A and H3-3B, can replace canonical
          isoforms H3.1 and H3.2.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
