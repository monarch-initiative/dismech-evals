      assertion_type: Diagnosis
      assertion:
        name: Brain magnetic resonance imaging
        description: Brain MRI supports the diagnosis and characterises the structural phenotype. The
          recognisable pattern comprises a small posterior fossa, dysgenesis of the corpus callosum (especially
          the splenium), cortical developmental abnormalities (dysgyria, hypoplastic temporal poles),
          deformity of the lateral ventricles with reduced internally rotated caudate heads, and delayed
          myelination. MRI is abnormal in roughly 58% of imaged individuals, so a normal scan does not
          exclude the diagnosis.
