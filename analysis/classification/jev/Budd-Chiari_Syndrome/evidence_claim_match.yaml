        description: Portal hypertension in Budd-Chiari syndrome arises directly from the increased intrahepatic
          resistance produced by hepatic venous outflow obstruction and sinusoidal congestion. Sustained
          elevation of portal pressure underlies the ascites, splenomegaly, and varices that characterize
          the disorder and is a primary target for prophylaxis and shunting therapy.
        category: Hepatic
        frequency: VERY_FREQUENT
        phenotype_term:
          preferred_term: Portal hypertension
          term:
            id: HP:0001409
            label: Portal hypertension
      selected_evidence:
        snippet: A therapeutic strategy has been proposed where anticoagulation, correction of risk factors,
          diuretics and prophylaxis for portal hypertension are used first; then angioplasty for shortlength
          venous stenosis; then Transjugular Intrahepatic Portosystemic Shunt (TIPS); and ultimately liver
          transplantation.
        supports: SUPPORT
