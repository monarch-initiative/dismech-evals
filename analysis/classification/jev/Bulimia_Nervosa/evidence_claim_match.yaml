  8009d27817778991bf2d969bf36ba53f9d0fd87cce657eeb25b2710e12107718:
    claim:
      about:
        disease:
          name: Bulimia Nervosa
          disease_term:
            preferred_term: bulimia nervosa
            term:
              id: MONDO:0005452
              label: bulimia nervosa
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reward and Inhibitory-Control Dysregulation
        description: Functional neuroimaging in bulimia nervosa shows altered mesocorticolimbic reward
          processing to food (notably a hypo-responsive reward response to taste reward) together with
          impaired recruitment of the fronto-striatal inhibitory-control network during response-inhibition
          tasks — the "impulsivity model" of binge eating. This reward/impulse-control imbalance is modeled
          upstream of loss-of-control binge eating.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: Feeding behavior
          term:
            id: GO:0007631
            label: feeding behavior
          modifier: ABNORMAL
      selected_evidence:
        snippet: Results in patients with BN primarily suggest a hypo-responsive reward system to food
          stimuli, especially to taste reward. Additionally, patients with BN exhibit impaired brain activation
          in the inhibitory control network during the performance of general response-inhibition tasks.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23658085
      reference_title: Neurocircuit function in eating disorders.
      evidence_source: HUMAN_CLINICAL
      explanation: Neuroimaging review evidence supports altered reward processing plus impaired inhibitory
        control as the neurobiological substrate of binge eating in bulimia nervosa.
