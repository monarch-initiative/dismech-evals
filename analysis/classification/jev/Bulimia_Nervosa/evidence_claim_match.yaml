      assertion_type: Genetic
      assertion:
        name: Complex polygenic liability
        association: Risk Factor
        notes: The 1991 female twin study estimated liability heritability at 55%. A 2025 Danish/Swedish
          register study estimated BN heritability at 0.39 (95% CI 0.32–0.46). These estimates depend
          on study design and ascertainment; they are not penetrance or individual predictions. The register
          study did not account for shared environmental effects and did not identify causal genes. A
          2026 GWAS of broadly defined binge-eating behavior includes BN, BED and symptom-level cases;
          its six loci are not BN-specific Mendelian causes.
      selected_evidence:
        snippet: 'BN as 0.39 (95% CI: 0.32– 0.46)'
        supports: SUPPORT
