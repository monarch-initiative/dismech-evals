              label: fluoxetine
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: Several adverse events (ie, insomnia, nausea, asthenia, and tremor) occurred significantly
          more frequently with fluoxetine (60 or 20 mg/d) than with placebo.
