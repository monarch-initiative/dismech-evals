      assertion_type: ProgressionInfo
      assertion:
        phase: Mortality and suicide risk
        notes: A 2026 meta-analysis found higher all-cause mortality in BN versus the general population
          (17 studies; pooled RR 2.39, 95% CI 1.86–3.06; I-squared 55%) and higher suicide-related mortality
          (RR 6.15, 95% CI 2.52–15.04). These are relative associations from observational cohorts with
          varying follow-up and ascertainment, not an individual absolute risk or proof that BN alone
          causes death. The overall review was predominantly female and evidence outside Western countries
          remained limited. Physical complications and suicide risk require assessment alongside recovery
          and relapse.
      selected_evidence:
        snippet: 'RR=6.15, 95% CI: 2.52-15.04 in bulimia nervosa'
        supports: SUPPORT
