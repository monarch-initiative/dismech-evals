      assertion_type: Pathophysiology
      assertion:
        name: Post-Purging Sodium and Water Retention
        description: In pseudo-Bartter physiology, aldosterone remains elevated after purging stops. Continued
          renal sodium retention without ongoing fluid loss can produce rapid edema and distressing weight
          gain, especially with rapid saline administration. This is acquired physiology, not inherited
          Bartter syndrome.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: The reason is that the serum aldosterone levels remain high, causing salt and water retention
          even though the patient is no longer losing fluid, as the purging has ceased.
        supports: SUPPORT
