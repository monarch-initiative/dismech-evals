      assertion_type: Treatment
      assertion:
        name: Management of Post-Purging Edema
        description: Explain pseudo-Bartter fluid retention when purging stops and monitor fluid balance.
          The clinical review describes judicious fluid replacement and short-term spironolactone in selected
          patients to counter persistent aldosterone activity. This is supervised treatment of acquired
          physiology, not use of diuretics for weight control.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: spironolactone
            term:
              id: CHEBI:9241
              label: spironolactone
        therapeutic_modality: SMALL_MOLECULE
      selected_evidence:
        snippet: The reason is that the serum aldosterone levels remain high, causing salt and water retention
          even though the patient is no longer losing fluid, as the purging has ceased.
        supports: SUPPORT
