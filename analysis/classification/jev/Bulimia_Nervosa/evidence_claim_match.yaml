        description: Fluoxetine 60 mg/day has placebo-controlled evidence for reducing binge and vomiting
          frequency in adults. APA recommends a serotonin reuptake inhibitor with CBT initially or after
          minimal response to psychotherapy by six weeks. Treatment response does not demonstrate a primary
          serotonin deficiency. Insomnia, nausea, asthenia and tremor occurred more often than with placebo
          in the founding trial.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: fluoxetine
            term:
