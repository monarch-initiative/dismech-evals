      assertion_type: ProgressionInfo
      assertion:
        phase: Variable long-term course
        notes: Remission and relapse can occur over many years. In a historic female treatment-seeking
          cohort, imputed recovery at 22 years was 68.2% among surviving participants with BN. Recovery
          required minimal symptoms for a year; the study does not demonstrate uninterrupted recovery
          during the long assessment gap or attribute outcome to a particular treatment. Of 107 BN survivors,
          76 were re-interviewed and missing outcomes were imputed.
      selected_evidence:
        snippet: At 22-year follow-up, 62.8% of participants with anorexia nervosa and 68.2% of participants
          with bulimia nervosa recovered
        supports: SUPPORT
