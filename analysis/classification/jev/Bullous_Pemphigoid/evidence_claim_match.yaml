  3d3a743b2462da2dc1e2021e2d4e08e79fddeb8707e784e810195b4d123c0924:
    claim:
      about:
        disease:
          name: Bullous Pemphigoid
          disease_term:
            preferred_term: bullous pemphigoid
            term:
              id: MONDO:0019082
              label: bullous pemphigoid
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bp_neurological_association_direction
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Bullous pemphigoid is consistently associated with neurological disease (dementia, Parkinson
          disease, stroke). Is this association causal in either direction, and is it explained by shared
          BP180/BP230 (dystonin) expression in the central nervous system?
        rationale: BP180 (collagen XVII) and BP230 (dystonin) have neural isoforms expressed in the central
          nervous system, giving a plausible route by which neurodegeneration could expose cross-reactive
          epitopes and break tolerance. The association is robust epidemiologically, but the cited cohort
          cannot establish direction, and its per-condition results are not internally uniform - Alzheimer
          disease was actually more common in controls, discordant with several other reports. The association
          is recorded here as an open question rather than as a curated causal edge in the pathograph.
        proposed_experiments:
        - experiment_id: bp_neuro_temporal_sequence
          name: Temporal sequencing of neurological diagnosis relative to BP onset
          description: Longitudinal population cohort determining whether neurological diagnoses precede
            or follow first BP diagnosis, with time-to-event analysis in both directions.
          decision_criterion: Consistent precedence of neurological diagnosis over BP onset would favour
            neurodegeneration-driven epitope exposure over a shared-susceptibility or reverse-causation
            model.
          supporting_outcome:
          - Neurological disease precedes BP onset at a rate exceeding the reverse ordering.
          refuting_outcome:
          - No consistent temporal ordering, or BP predominantly precedes neurological diagnosis.
        - experiment_id: bp_neuro_crossreactive_serology
          name: Anti-BP180/BP230 serology in neurodegenerative disease without skin disease
          description: Serological screening for anti-BP180 NC16A and anti-BP230 reactivity in dementia,
            Parkinson disease and stroke cohorts with no cutaneous disease, against age-matched neurologically
            healthy controls.
          decision_criterion: Elevated subclinical autoantibody reactivity in neurodegenerative cohorts
            would support CNS epitope exposure as the tolerance-breaking event.
          supporting_outcome:
          - Significantly higher anti-BP180/BP230 reactivity in neurodegenerative cohorts than controls.
          refuting_outcome:
          - Equivalent reactivity across neurodegenerative and control groups.
      selected_evidence:
        snippet: Our cohort of bullous pemphigoid and neurological disorders demonstrates a significant
          association between bullous pemphigoid and neurological disorders, including dementia, Parkinson's
          disease and stroke.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30663128
