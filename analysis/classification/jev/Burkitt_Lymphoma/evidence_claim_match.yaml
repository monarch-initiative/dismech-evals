      assertion:
        name: MYC Translocation and Oncogene Activation
        genetic_context:
          variant_origin: SOMATIC
        description: The hallmark of Burkitt lymphoma is translocation of the MYC oncogene on chromosome
          8 to an immunoglobulin locus, most commonly t(8;14)(q24;q32) involving the IGH locus, or less
          commonly t(2;8) or t(8;22) involving light chain loci. This places MYC under control of immunoglobulin
          enhancers, resulting in constitutive MYC overexpression.
        genes:
        - preferred_term: MYC
          term:
            id: hgnc:7553
            label: MYC
        cell_types:
        - preferred_term: germinal center B cell
          term:
            id: CL:0000844
            label: germinal center B cell
        biological_processes:
        - preferred_term: positive regulation of transcription by RNA polymerase II
          modifier: INCREASED
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: Burkitt lymphoma (BL) is an aggressive B-cell malignancy characterized by rapid progression
          and MYC gene translocations.
        supports: SUPPORT
