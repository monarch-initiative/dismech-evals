      assertion_type: Phenotype
      assertion:
        category: Neoplastic
        name: B-Cell Lymphoma
        description: Burkitt lymphoma is an aggressive neoplasm of mature B lymphocytes and is classified
          as a B-cell non-Hodgkin lymphoma.
        phenotype_term:
          preferred_term: B-cell lymphoma
          term:
            id: HP:0012191
            label: B-cell lymphoma
        notes: 'HP:0030080 "Burkitt lymphoma" exists and looks like the more specific binding, but it
          is deliberately NOT used here. HPO places HP:0030080 under HP:0012539 Non-Hodgkin lymphoma,
          which is a sibling of HP:0012191 B-cell lymphoma rather than a descendant of it (verified with
          OAK: the ancestors of HP:0030080 are Neoplasm / Lymphoma / Hematological neoplasm / Non-Hodgkin
          lymphoma, and HP:0012191 is not among them). Because grouping criteria are evaluated over the
          ontology closure, swapping to HP:0030080 would pass every validator while silently turning this
          entry into a NOT_SATISFIED contradiction against a HAS_PHENOTYPE HP:0012191 criterion. This
          looks like a genuine HPO gap — Burkitt lymphoma is unambiguously a mature B-cell neoplasm —
          and warrants an upstream NTR to reparent HP:0030080 under HP:0012191.'
      selected_evidence:
        snippet: Burkitt lymphoma (BL) is an aggressive form of B cell lymphoma that can affect children
          and adults.
        supports: SUPPORT
