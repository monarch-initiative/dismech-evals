            label: Autosomal recessive inheritance
        description: BMKS is autosomal recessive. Most affected individuals are compound heterozygotes
          for a low-frequency 34-bp TXNL4A promoter deletion and a rare coding loss-of-function variant
          on the other allele; homozygosity for a promoter deletion also occurs. Sibs of a proband have
          a 25% recurrence risk, and prenatal and preimplantation testing are possible once the familial
          variants are known.
      selected_evidence:
        snippet: TXNL4A-related craniofacial disorders are inherited in an autosomal recessive manner.
          At conception, each sib of an affected individual has a 25% chance of being affected, a 50%
          chance of being an asymptomatic carrier, and a 25% chance inheriting neither of the familial
          TXNL4A pathogenic variants.
        supports: SUPPORT
