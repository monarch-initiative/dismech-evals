        conforms_to: pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning and
          Neural-Crest Skeletogenesis
        description: Cranial neural crest cells are the progenitors of the facial skeleton and are the
          cell type in which spliceosome dosage matters most. Txnl4a knockdown in Xenopus produces cranial
          neural crest formation defects, placing TXNL4A alongside Eftud2 and Snrpb in a common craniofacial
          spliceosomopathy aetiology. In patient-derived cells, BMKS iPSCs proliferate more slowly than
          control and show defective differentiation into induced neural crest cells, with a specific
          delay in undergoing the epithelial-to-mesenchymal transition that neural crest cells must complete
          in order to delaminate and migrate.
        cell_types:
        - preferred_term: migratory cranial neural crest cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
        biological_processes:
        - preferred_term: neural crest cell development
