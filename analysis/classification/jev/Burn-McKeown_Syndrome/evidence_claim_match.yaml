      reference_title: 'Hepatocellular Adenoma in an Infant With Burn-McKeown Syndrome: Report of a Case.'
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      explanation: One incidental hepatocellular adenoma is an association, not evidence of a syndrome-wide
