      assertion_type: Pathophysiology
      assertion:
        name: Impaired U5 snRNP and Tri-snRNP Spliceosome Function
        biological_scale: MOLECULAR
        conforms_to: pharyngeal_arch_patterning_serial_homology#Cranial Neural Crest and Pharyngeal Arch
          Program Perturbation
        description: 'TXNL4A (Dib1) is a core protein of the U5 small nuclear ribonucleoprotein, which
          sits at the centre of the catalytic spliceosome and is a component of the U4/U6.U5 tri-snRNP.
          Reduced TXNL4A dosage therefore degrades general pre-mRNA splicing capacity. Crucially the consequence
          is not uniform: only a subset of transcripts is affected, and the mis-spliced genes share sequence
          properties (transcript length, branch-point-to-3''-splice-site distance, splice-site strength)
          that make them unusually sensitive to reduced TXNL4A. This selectivity is the current explanation
          for how a ubiquitously expressed housekeeping protein produces a tissue-restricted craniofacial
          phenotype.'
        cell_types:
        - preferred_term: migratory cranial neural crest cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
        biological_processes:
        - preferred_term: mRNA splicing, via spliceosome
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: DECREASED
        - preferred_term: spliceosomal snRNP assembly
          term:
            id: GO:0000387
            label: spliceosomal snRNP assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Depletion of TXNL4A (Dib1) in yeast demonstrated reduced assembly of the tri-snRNP complex.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
