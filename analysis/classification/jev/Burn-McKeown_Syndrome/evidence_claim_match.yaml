            term:
              id: MONDO:0012064
              label: choanal atresia-hearing loss-cardiac defects-craniofacial dysmorphism syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bmks_spliceosome_tissue_specificity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does reduced dosage of TXNL4A, a ubiquitously expressed core spliceosome protein,
          produce a malformation restricted to craniofacial structures rather than a generalised phenotype?
        attaches_to:
        - pathophysiology#Impaired U5 snRNP and Tri-snRNP Spliceosome Function
        rationale: 'This is the central unsolved problem of the craniofacial spliceosomopathies as a class,
          and it is stated as open in the primary literature. Two partial answers exist and are curated
          as separate nodes here: transcript-intrinsic sensitivity (mis-spliced genes share length, branch-point-to-3''-splice-site
          distance and splice-site-strength properties) and a downstream pathway effect (dampened WNT
          responsiveness via TCF7L2 exon 4 mis-splicing). A third proposal in the field, not curated as
          a node here because it has not been demonstrated for TXNL4A specifically, is that neural crest
          cells have an elevated sensitivity to inefficient splicing that triggers a P53-associated stress
          response through mis-splicing of MDM2/MDM4. Distinguishing these matters because they imply
          different therapeutic entry points. A limitation applying to all three: the human cellular evidence
          comes from a single patient donor line.'
        proposed_experiments:
        - experiment_id: bmks_p53_axis_in_patient_incc
          name: Test the P53/MDM2-MDM4 stress axis in BMKS patient iNCCs
          description: Assay MDM2 and MDM4 regulatory-exon skipping, P53 stabilisation and apoptosis in
            BMKS patient-derived induced neural crest cells versus the maternal control, and test whether
            P53 inhibition rescues the differentiation and EMT delay.
          decision_criterion: Rescue by P53 inhibition would place BMKS in the same nucleolar/splicing
            stress-response mechanism proposed for the other craniofacial spliceosomopathies; absence
            of rescue would favour the transcript-selectivity and WNT explanations already curated.
        - experiment_id: bmks_tcf7l2_rescue
          name: TCF7L2 isoform rescue in BMKS neural crest
          description: Express the correctly spliced TCF7L2 isoform in BMKS patient iNCCs and test whether
            WNT responsiveness, EMT timing and differentiation are restored.
          decision_criterion: Restoration would upgrade the TCF7L2 node from PROVISIONAL to an established
            mechanism; failure would indicate TCF7L2 mis-splicing is a marker rather than a cause.
