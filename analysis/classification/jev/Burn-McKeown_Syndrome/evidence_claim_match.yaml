        snippet: RNA-Seq analysis of differentiated iNCCs revealed widespread gene expression changes
          and mis-splicing in genes relevant to craniofacial and embryonic development that highlight
          a dampened response to WNT signalling, the key pathway activated during iNCC differentiation.
        supports: SUPPORT
