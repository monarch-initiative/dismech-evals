            preferred_term: Burn-McKeown syndrome
            term:
              id: MONDO:0012064
              label: choanal atresia-hearing loss-cardiac defects-craniofacial dysmorphism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced TXNL4A Expression from Biallelic Promoter and Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: The characteristic BMKS genotype is a 34-bp deletion in the TXNL4A promoter (type
          1 or type 2) in trans with a coding or splice loss-of-function variant, or homozygosity for
          a promoter deletion. The deleted 56-bp promoter region contains a 22-bp repeated motif that
          is essential for TXNL4A expression, and the splice-site variants at the final intron cause skipping
          of the final exon. The net effect is a quantitative reduction in TXNL4A protein rather than
          its complete absence, which is why BMKS behaves as a hypomorphic dosage disorder.
        genes:
        - preferred_term: TXNL4A
          term:
            id: hgnc:30551
            label: TXNL4A
      selected_evidence:
        snippet: Our results indicate that BMKS is an autosomal-recessive condition, which is frequently
          caused by compound heterozygosity of low-frequency promoter deletions in combination with very
          rare loss-of-function mutations.
        supports: SUPPORT
    origin:
