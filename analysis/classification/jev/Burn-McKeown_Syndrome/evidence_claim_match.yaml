            id: hgnc:30551
            label: TXNL4A
        associated_phenotypes:
        - Reduced neural crest marker expression
        - Cranial cartilage defects
        description: Unilateral translation-blocking morpholino injection at the two-cell stage reduces
          neural crest markers, increases dorsal ectodermal apoptosis at neurula stage 15, and produces
          cranial cartilage defects in 38% of stage-45 tadpoles. A resistant Txnl4a construct partly rescues
          sox10 expression. This transient knockdown does not reproduce the human promoter-plus-loss-of-function
          genotype and does not establish dominant inheritance or p53 dependence.
        name: Xenopus Txnl4a morpholino model
        publication: PMID:35893124
        modeled_mechanisms:
        - target: Impaired Neural Crest Specification
          description: Knockdown reduces sox10 expression and resistant Txnl4a partly rescues it.
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
        - target: Increased Embryonic Ectodermal Apoptosis
          description: TUNEL-positive dorsal ectodermal cells increase; this contrasts with the patient-cell
            model.
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
      selected_evidence:
        snippet: Snrpb and Txnl4a knockdown produced cartilage defects at a lower frequency, in 29% and
          38% of morphant tadpoles, respectively
        supports: SUPPORT
        directness: DIRECT
