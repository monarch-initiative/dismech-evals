        kind: INTERPRETATION
        status: OPEN
        prompt: Does increased apoptosis mediate all BMKS developmental defects?
        rationale: The Xenopus study found increased ectodermal TUNEL staining but incorrectly described
          the earlier patient-iPSC study as showing increased apoptosis. The original patient-cell data
          found no significant apoptosis difference in either iPSCs or induced neural crest cells. The
          frog paper also describes TXNL4A haploinsufficiency, which should not replace the established
          recessive human inheritance model.
        attaches_to:
        - pathophysiology#Increased Embryonic Ectodermal Apoptosis
      selected_evidence:
        snippet: Annexin-V staining revealed no significant differences in apoptosis between the patient
          iNCCs and the mother and unrelated control iNCCs
        supports: SUPPORT
        directness: DIRECT
