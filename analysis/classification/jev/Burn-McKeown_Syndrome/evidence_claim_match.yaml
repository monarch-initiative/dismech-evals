  36546bc4e71206adc7224161c0318c28901e16bad7577ba779ed15cbf0522170:
    claim:
      about:
        disease:
          name: Burn-McKeown Syndrome
          disease_term:
            preferred_term: Burn-McKeown syndrome
            term:
              id: MONDO:0012064
              label: choanal atresia-hearing loss-cardiac defects-craniofacial dysmorphism syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: TXNL4A
        gene_term:
          preferred_term: TXNL4A
          term:
            id: hgnc:30551
            label: TXNL4A
        association: Causal - biallelic loss-of-function and promoter-deletion variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Positive
        notes: TXNL4A is at 18q23 and encodes the U5 snRNP core protein TXNL4A/Dib1. The BMKS genotype
          is biallelic and hypomorphic rather than null. Almost every reported proband carries at least
          one copy of one of two partially overlapping 34-bp deletions in the TXNL4A promoter (type 1
          or type 2), which remove part of a 22-bp repeated motif essential for TXNL4A expression. The
          second allele is usually a coding or splice loss-of-function variant (nonsense, frameshift,
          microdeletion, or an intronic variant at the final intron causing skipping of the final exon);
          homozygosity for a promoter deletion also occurs. Because copy-number loss is one of the second-allele
          classes, deletion/duplication analysis must be part of the testing strategy alongside promoter
          sequencing. The same gene causes a milder allelic spectrum - isolated choanal atresia and choanal
          atresia with minor anomalies - so BMKS is the severe end of a TXNL4A-related craniofacial spectrum
          rather than an isolated entity.
      selected_evidence:
        snippet: The diagnosis of a TXNL4A-related craniofacial disorder is established in a proband with
          suggestive findings and biallelic pathogenic variants in TXNL4A identified by molecular genetic
          testing. All probands described to date have had at least one copy of one of the two partially
          overlapping 34-bp deletions in the TXNL4A promoter.
        supports: SUPPORT
    origin:
