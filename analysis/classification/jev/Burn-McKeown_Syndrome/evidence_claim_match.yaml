      assertion_type: Pathophysiology
      assertion:
        name: Craniofacial Neural-Crest-Derived Malformation
        biological_scale: TISSUE
        description: 'The tissue-level outcome is a distinctive, recognisable craniofacial malformation
          pattern: bilateral choanal atresia or stenosis, short palpebral fissures with coloboma of the
          outer third of the lower eyelids, a prominent nasal bridge with widely spaced eyes, a short
          philtrum, a thin upper lip vermilion, and prominent ears, with cleft lip and/or palate and preauricular
          tags in a minority. Middle- and inner-ear involvement produces conductive and sensorineural
          hearing loss. The malar and mandibular hypoplasia that defines mandibulofacial dysostosis is
          not part of this pattern, and the choanal atresia arises from failure of the bucconasal membrane
          rather than from an arch derivative.'
        biological_processes:
        - preferred_term: face morphogenesis
          term:
            id: GO:0060325
