        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bmks-atypical-finding-attribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which uncommon findings belong to the TXNL4A phenotype?
        rationale: A reported infant with a dicentric X chromosome and homozygous TXNL4A promoter deletion
          had a blended diagnostic context. A separate autopsy case described an incidental hepatocellular
          adenoma in an infant with BMKS. These reports warrant careful phenotype attribution; they do
          not establish a recurrent cancer predisposition, justify tumor surveillance, or assign every
          additional finding to TXNL4A. Older TXNL4A-negative BMKS-like cases also should not define the
          molecularly confirmed phenotype.
      selected_evidence:
        snippet: Here we present an autopsy case of a 9-month-old girl with Burn-McKeown syndrome with
          an incidental liver nodule in the right lobe measuring 1.5 cm in greatest dimension.
        supports: SUPPORT
        directness: DIRECT
    origin:
