  52a099899e919995e71ffd5485a75f794208b0a01fe81c8c77d96121fffc52ed:
    claim:
      about:
        disease:
          name: Burn-McKeown Syndrome
          disease_term:
            preferred_term: Burn-McKeown syndrome
            term:
              id: MONDO:0012064
              label: choanal atresia-hearing loss-cardiac defects-craniofacial dysmorphism syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bmks_spliceosome_tissue_specificity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does reduced dosage of TXNL4A, a ubiquitously expressed core spliceosome protein,
          produce a malformation restricted to craniofacial structures rather than a generalised phenotype?
        attaches_to:
        - pathophysiology#Selective Pre-mRNA Mis-Splicing
        rationale: Selective splicing changes, a candidate TCF7L2/WNT route, and an experimental Mdm2-p53/metabolic
          route offer partial explanations for tissue specificity. Txnl4a-specific stress-response evidence
          now exists in mouse embryonic stem cells, but patient neural crest validation is lacking. Patient
          cells did not show increased apoptosis, unlike the frog knockdown model. Perturbation strength,
          cell state, genetic background and developmental stage may all affect the phenotype.
        proposed_experiments:
        - experiment_id: bmks_p53_axis_in_patient_incc
          name: Test the P53/MDM2-MDM4 stress axis in BMKS patient iNCCs
          description: Assay MDM2 and MDM4 regulatory-exon skipping, p53 stabilization and apoptosis in
            multiple BMKS patient-derived neural crest lines with isogenic and unaffected controls, and
            test whether controlled p53 perturbation changes differentiation and EMT. The unaffected mother
            is a carrier control, not an isogenic comparator.
          decision_criterion: Concordant molecular changes and rescue across multiple patient lines with
            isogenic controls would strengthen a causal role. Absent rescue would limit that intervention
            under the tested conditions, not by itself exclude all p53-dependent or independent contributions.
        - experiment_id: bmks_tcf7l2_rescue
          name: TCF7L2 isoform rescue in BMKS neural crest
          description: Express the correctly spliced TCF7L2 isoform in BMKS patient iNCCs and test whether
            WNT responsiveness, EMT timing and differentiation are restored.
          decision_criterion: Isoform-specific rescue with appropriate expression and timing controls
            would strengthen mediation of the WNT/EMT defect. Failure could reflect incomplete rescue,
            timing or parallel pathways and would not alone prove that TCF7L2 is only a marker.
      selected_evidence:
        snippet: However, it is unclear how reduced expression of this ubiquitously expressed spliceosome
          protein results in craniofacial defects during development.
        supports: SUPPORT
        directness: INDIRECT
