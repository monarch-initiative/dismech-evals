        description: 'The diagnosis is established by identifying biallelic pathogenic TXNL4A variants.
          Testing must explicitly interrogate the non-coding promoter region: because virtually every
          proband carries a 34-bp promoter deletion on at least one allele, standard exome or coding-only
          panel analysis will find only one variant and the diagnosis will be missed. When a single likely
          pathogenic coding TXNL4A variant is found in a clinically consistent individual, the promoter
          must be sequenced.'
