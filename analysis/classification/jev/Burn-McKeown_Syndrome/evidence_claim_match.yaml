        biological_scale: MOLECULAR
        description: 'RNA-Seq of BMKS patient-derived induced neural crest cells showed widespread mis-splicing
          in genes relevant to craniofacial and embryonic development, with the dominant signature being
          a dampened response to WNT signalling - the key pathway activated during induced neural crest
          differentiation. Mis-splicing of exon 4 of TCF7L2, which encodes a core WNT-pathway transcription
          factor, was identified as a candidate cause of that reduced WNT response. This node is curated
          at provisional confidence: the TCF7L2 link is proposed by the authors as a potential cause rather
          than demonstrated by rescue.'
        mechanism_confidence: PROVISIONAL
