      assertion_type: Pathophysiology
      assertion:
        name: Recurrent TXNL4A Promoter Deletion
        description: The recurrent type 1 and type 2 alleles are distinct, partially overlapping 34-bp
          deletions in the TXNL4A promoter. They disrupt a region containing two 22-bp repeats separated
          by a 12-bp spacer; there is no single 56-bp pathogenic deletion. These regulatory alterations
          are distinct from coding, splice-site and copy-number loss on the other allele. Most BMKS genotypes
          combine a type 1 deletion with a loss-of-function allele; homozygous promoter deletions also
          occur.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TXNL4A
          term:
            id: hgnc:30551
            label: TXNL4A
      selected_evidence:
        snippet: In 8 families, affected individuals carried a rare loss-of-function mutation (nonsense,
          frameshift, or microdeletion) on one allele and a low-frequency 34 bp deletion (allele frequency
          0.76%) in the core promoter region on the other allele.
        supports: SUPPORT
        directness: DIRECT
