          modifier: DECREASED
        - preferred_term: epithelial to mesenchymal transition
          term:
            id: GO:0001837
            label: epithelial to mesenchymal transition
          modifier: DECREASED
      selected_evidence:
        snippet: Our results point to defects in cranial neural crest cell formation as the likely culprit
          for MFD associated with EFTUD2, SNRPB and TXNL4A haploinsufficiency, and suggest a commonality
          in the etiology of these craniofacial spliceosomopathies.
        supports: SUPPORT
