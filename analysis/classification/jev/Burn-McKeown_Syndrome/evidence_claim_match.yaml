      assertion:
        name: TXNL4A
        gene_term:
          preferred_term: TXNL4A
          term:
            id: hgnc:30551
            label: TXNL4A
        association: Causal - biallelic loss-of-function and promoter-deletion variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: Positive
        notes: TXNL4A at 18q23 encodes a U5 snRNP component. The type 1 and type 2 promoter alleles delete
          34 bp at GRCh37 chr18:g.77748581_77748614del and chr18:g.77748604_77748637del, respectively.
          These are hypomorphic regulatory alleles; coding, splice and exon/whole-gene losses constitute
          distinct second-allele classes. The reported 0.76% German control allele frequency is neither
          carrier frequency nor disease prevalence; control craniofacial phenotypes were unavailable.
          Promoter alleles occurred on different haplotypes, supporting recurrence rather than a single
          founder. Homozygous promoter deletions can produce milder choanal-atresia phenotypes, but no
          deterministic genotype-phenotype correlation is established. Promoter deletions can be missed
          by coding-only assays and by default genome-analysis filters.
      selected_evidence:
        snippet: a rare loss-of-function mutation (nonsense, frameshift, or microdeletion) on one allele
        supports: SUPPORT
