        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: melorheostosis_attribution
        kind: CONTROVERSY
        status: OPEN
        prompt: Is melorheostosis a manifestation of LEMD3 loss of function, or a separate disease that
          happens to look similar and occasionally co-occurs?
        attaches_to:
        - pathophysiology#Segmental Cortical Hyperostosis
        - phenotypes#Melorheostosis
        - has_subtypes#BOS with Melorheostosis
        rationale: 'The 2004 gene-discovery paper put melorheostosis in its title alongside osteopoikilosis
          and BOS, and that framing persisted for years. It was wrong as a general claim, and the correction
          matters both nosologically and therapeutically.

          What is settled: (i) some individuals in LEMD3 kindreds do develop segmental cortical hyperostosis
          read as melorheostosis, and they carry the family''s germline LEMD3 allele; (ii) patients with
          sporadic isolated melorheostosis - no osteopoikilosis, no family history - repeatedly test negative
          for germline LEMD3 variants, and negative for LEMD3 somatic mosaicism in lesional bone and skin;
          and (iii) most such patients instead carry a post-zygotic activating MAP2K1 variant confined
          to the affected bone, with mutant allele fractions of 1-34% and absent from contralateral unaffected
          bone and from blood. So sporadic melorheostosis is a somatic MEK1 mosaic disorder and is not
          BOS.

          What is not settled is the LEMD3-associated form. Within a kindred the germline allele is shared
          by everyone, yet only one member develops the segmental lesion, so the genotype alone cannot
          be the explanation. The long-standing hypothesis is a somatic second hit at LEMD3 in the affected
          segment, but that has been looked for and not found. Whether the LEMD3-associated segmental
          lesion is mechanistically the same entity as MAP2K1 melorheostosis, or a distinct lesion that
          resembles it radiographically, is unresolved - the two are convergent at the level of "excess
          cortical bone in an asymmetric focal pattern" and have not been compared histologically within
          one study.

          Curation consequence: this entry models the segmental hyperostosis as a within-syndrome node
          of hypothetical mechanism, keeps sporadic melorheostosis in differential_diagnoses rather than
          in the pathograph, and does not assert that LEMD3 causes melorheostosis in general.'
      selected_evidence:
        snippet: The present study supports the general conclusion that LEMD3 mutations do not contribute
          to isolated sporadic melorheostosis.
        supports: REFUTE
