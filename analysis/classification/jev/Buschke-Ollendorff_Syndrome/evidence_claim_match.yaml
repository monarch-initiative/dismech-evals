        prompt: What causes Buschke-Ollendorff syndrome in families with an unambiguous osteocutaneous
          phenotype and no detectable LEMD3 coding variant?
        attaches_to:
        - genetic#LEMD3
        rationale: 'At least one family with textbook BOS - father and son with nevus elasticus plus radiographic
          osteopoikilosis - has been sequenced across all LEMD3 exons and splice sites with no variant
          found. Candidate explanations that have not been excluded include a deep intronic or regulatory
          variant, a copy-number change missed by sequencing (deletion/duplication analysis was not routine
          at the time), and locus heterogeneity involving another component of the nuclear-envelope SMAD-terminating
          machinery. The practical consequence is already established: a negative LEMD3 test does not
          overturn a convincing phenotype.'
