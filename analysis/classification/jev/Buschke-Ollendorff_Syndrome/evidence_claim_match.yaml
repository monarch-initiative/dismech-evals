          knockdown of endogenous XMAN1 reduces anterior neuroectoderm. Deletion analysis localises both
          the neuralising and BMP-antagonising activities to the C-terminal region that binds Smad1, Smad5
          and Smad8 - the region human truncating LEMD3 alleles delete.
