          but a substantial minority are collagenomas of dense hypocellular collagen with normal elastic
          tissue, some are mixed, and increased interstitial dermal mucin is common and easily missed.
          A biopsy read as unremarkable on routine haematoxylin and eosin therefore does not exclude BOS,
          and two lesions from the same patient at different body sites can look different.'
