              label: Buschke-Ollendorff syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: bos_cognitive_delay_association
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is cognitive delay part of Buschke-Ollendorff syndrome, or an artefact of ascertainment
          and of contiguous 12q14 deletions being counted as BOS?
        attaches_to:
        - phenotypes#Short Stature
        - genetic#LEMD3
        rationale: 'A 2016 systematic review reported cognitive delays in 50% of its own single-centre
          cohort and in 17% of literature cases published from 2007 onwards, with none reported before
          2007. That temporal pattern is the problem: it is exactly what reporting bias looks like, and
          2007 is also roughly when microarray testing became routine, so cases with a contiguous 12q14
          deletion - which removes HMGA2 and other neighbours and does cause developmental delay and short
          stature - would have begun entering the BOS literature. A single-child 2024 preprint describing
          intellectual disability adds nothing decisive. No cognitive phenotype is deliberately curated
          in this entry''s phenotypes block on this evidence. Resolving it needs neurodevelopmental assessment
          of a molecularly defined cohort with contiguous deletions excluded by array.'
      selected_evidence:
        snippet: However, 50% of the cohort from HSC had cognitive delays, and only cases from 2007 onwards
          reported cognitive delays (the prevalence was 17% among those cases).
        supports: SUPPORT
