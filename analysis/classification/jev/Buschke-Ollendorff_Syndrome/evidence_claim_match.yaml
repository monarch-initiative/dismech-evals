        description: 'Fibroblasts cultured from BOS skin produce two- to eight-fold more tropoelastin
          than normal dermal fibroblasts, and carry correspondingly elevated elastin mRNA - so the defect
          sits at or above the level of steady-state transcript abundance rather than in post-translational
          assembly. Notably the excess is not confined to clinically involved skin: apparently uninvolved
          skin from the same patient was elevated more than three-fold, which argues that the cellular
          defect is constitutive across the dermis and that something else localises the visible lesions.
          Collagen synthesis is altered in parallel, giving the collagen-rich lesions their character.'
        biological_scale: CELLULAR
