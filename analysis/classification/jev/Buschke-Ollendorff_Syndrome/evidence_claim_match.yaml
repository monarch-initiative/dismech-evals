        rationale: 'Human LEMD3 haploinsufficiency reliably produces osteopoikilosis. The heterozygous
          Lemd3 gene-trap mouse, examined by radiography, quantitative micro-CT histomorphometry across
          eight structural parameters, and conventional histology, showed nothing. The mismatch is not
          evidence-absent - the experiment was done and was negative - it is a translational validity
          problem, and it is the reason no animal model of the human bone phenotype exists. Alternatives
          that would discriminate: whether murine bone simply tolerates a halved dose (a real species
          difference in SMAD dose sensitivity), whether the murine lesion requires a longer lifespan or
          a mechanical challenge to appear, or whether the gene-trap allele is hypomorphic rather than
          null and the effective dose reduction was smaller than in patients. Until this is resolved,
          mechanistic and therapeutic hypotheses about the human lesion cannot be tested in vivo; a conditional
          or knock-in allele in the osteoblast lineage, or a patient-derived iPSC osteoblast system, is
          the obvious next step.'
        proposed_experiments:
        - experiment_id: conditional_lemd3_osteoblast_lineage
          name: Osteoblast-lineage conditional Lemd3 inactivation
          description: Inactivate Lemd3 conditionally in the osteoblast/bone-lining lineage and age the
            animals, testing whether tissue-restricted and more complete loss produces focal sclerotic
            nodules that the germline heterozygote does not.
          would_support:
          - pathophysiology#Bone Lining Cell Activation and Modeling-Based Bone Formation
          supporting_outcome:
          - Discrete lamellar sclerotic nodules appear within trabecular bone on micro-CT, with modeling-based
            apposition and normal remodelling rate on dynamic histomorphometry, mirroring the human lesion.
          refuting_outcome:
          - No focal sclerosis develops even with complete lineage-restricted loss and ageing, which would
            move the explanation away from osteoblast-autonomous SMAD dose and toward a systemic or developmental
            requirement.
      selected_evidence:
        snippet: To investigate whether the heterozygous gene-trapped mouse is a good model for osteopoikilosis
          in humans, we studied these mice radiologically with high-resolution micro-computed tomography
          (microCT) and histologically.
        supports: SUPPORT
