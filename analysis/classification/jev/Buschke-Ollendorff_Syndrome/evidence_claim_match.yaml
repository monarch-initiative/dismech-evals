        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Nuclear Envelope R-SMAD Antagonism
        description: 'MAN1''s C-terminal nucleoplasmic region binds the MAD homology 2 (MH2) domain of
          receptor-regulated SMADs at the inner nuclear membrane, in a ligand-independent manner and without
          binding the common mediator SMAD4. The interaction sequesters R-SMADs at the nuclear periphery
          and facilitates their dephosphorylation, so that the pathway is terminated rather than merely
          attenuated. Losing half of this capacity removes a brake, not a signal: nothing upstream of
          the receptor is altered, and the defect is in how quickly an activated SMAD is switched off.
          Recent work adds that the LEMD3-SMAD2/3 interaction is mechanosensitive, weakening as extracellular
          matrix stiffness rises, which offers one route by which a uniformly halved gene dose could produce
          focal rather than uniform lesions.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        molecular_functions:
        - preferred_term: R-SMAD binding
          term:
            id: GO:0070412
            label: R-SMAD binding
        biological_processes:
        - preferred_term: negative regulation of BMP signaling pathway
          modifier: DECREASED
          term:
            id: GO:0030514
            label: negative regulation of BMP signaling pathway
        - preferred_term: negative regulation of TGF-beta receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0030512
            label: negative regulation of transforming growth factor beta receptor signaling pathway
        - preferred_term: SMAD protein signal transduction
          term:
            id: GO:0060395
            label: SMAD protein signal transduction
        cellular_components:
        - preferred_term: inner nuclear membrane
          term:
            id: GO:0005637
            label: nuclear inner membrane
      selected_evidence:
        snippet: MAN1, through the RNA recognition motif, associates with R-Smads but not Smad4 at the
          inner nuclear membrane in a ligand-independent manner.
        supports: SUPPORT
