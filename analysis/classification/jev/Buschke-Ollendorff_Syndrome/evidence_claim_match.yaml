  dda9699aaccd0585a0f9b6da193660bbfc57febb05797450790f268dfaff4efa:
    claim:
      about:
        disease:
          name: Buschke-Ollendorff Syndrome
          disease_term:
            preferred_term: Buschke-Ollendorff syndrome
            term:
              id: MONDO:0008157
              label: Buschke-Ollendorff syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: lemd3_tissue_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: LEMD3 is expressed in essentially every nucleated cell and the loss-of-function allele
          is present in every cell. Why are the lesions confined to bone and dermis, and why are they
          focal within those tissues rather than uniform?
        attaches_to:
        - pathophysiology#Increased BMP-SMAD1/5/8 Transcriptional Output
        - pathophysiology#Dermal Fibroblast Elastin and Collagen Overproduction
        rationale: 'This is the central unexplained feature of the disease and it has two parts.

          Tissue selectivity: a ubiquitous 50% reduction produces disease only where BMP and TGF-beta
          signalling sets matrix output - osteoblast lineage and dermal fibroblast. A plausible reading
          is that these are simply the tissues whose phenotype is most sensitive to SMAD dose, but that
          has not been tested; no BOS-specific transcriptomic, proteomic or single-cell dataset exists
          in any tissue.

          Focality within a tissue: this is the harder half. Cultured fibroblasts from clinically uninvolved
          BOS skin already overproduce tropoelastin more than three-fold, so the cellular defect is present
          where there is no lesion, and something else decides where a nevus forms. The same puzzle applies
          in bone, where the sclerotic nodules occupy a small fraction of a uniformly haploinsufficient
          skeleton. Two candidate explanations are on the table and neither has been tested in BOS tissue:
          a somatic second event confined to the lesion (searched for in LEMD3 and not found), or a local
          modifier such as matrix stiffness - the LEMD3-SMAD2/3 interaction weakens as stiffness rises,
          which would make the haploinsufficient cell progressively less able to restrain TGF-beta in
          exactly the stiffening matrix it is building, a plausible focal positive-feedback loop.'
      selected_evidence:
        snippet: In a second patient, whose involvement was nearly complete, elastin production was high
          in involved areas and less so in completely involved skin.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:1629625
      reference_title: Buschke-Ollendorff syndrome associated with elevated elastin production by affected
        skin fibroblasts in culture.
      evidence_source: IN_VITRO
      explanation: Reports elastin production varying between skin sites within one patient, which is
        the observation the focality question rests on.
