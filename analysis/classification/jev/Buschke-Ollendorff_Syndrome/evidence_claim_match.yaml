      assertion_type: DifferentialDiagnosis
      assertion:
        name: 12q14 Microdeletion Syndrome
        description: A contiguous-gene deletion spanning LEMD3 and its neighbours (including HMGA2), producing
          osteopoikilosis together with primordial short stature and developmental delay. Suspect it when
          a patient with osteopoikilosis also has growth failure or cognitive impairment, and investigate
          with chromosomal microarray rather than LEMD3 sequencing alone.
        distinguishing_features:
        - Proportionate short stature and developmental delay accompanying the bone findings
        - Deletion detectable on chromosomal microarray, not on LEMD3 sequencing
        - Connective tissue nevi not a consistent feature
      selected_evidence:
        snippet: In their studies on the molecular basis of osteopoikilosis, Menten et al have identified
          three individuals with microdeletions on chromosome 12q14.4, which removed several genes including
          LEMD3, the osteopoikilosis gene. In addition to osteopoikilosis, affected individuals had growth
          retardation and developmental delay.
        supports: SUPPORT
