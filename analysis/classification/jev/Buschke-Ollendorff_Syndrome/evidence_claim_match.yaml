          to the affected bone, not a forme fruste of BOS. Repeated LEMD3 sequencing of such patients
          - including of lesional bone and skin - has been negative.
        distinguishing_features:
        - No connective tissue nevi and no osteopoikilotic foci elsewhere in the skeleton
        - Sporadic occurrence with no family history
        - Somatic mosaic MAP2K1 variant in affected but not unaffected bone
        - Germline LEMD3 sequencing negative
      selected_evidence:
        snippet: Using whole exome sequencing, we identify somatic mosaic MAP2K1 mutations in affected,
          but not unaffected, bone of eight unrelated patients with melorheostosis.
