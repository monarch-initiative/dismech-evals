          foci. What converts one segment is unknown: no somatic second hit in LEMD3 has ever been demonstrated
          in such lesions. Distinguish this from sporadic isolated melorheostosis, which is a different
          disease - see the discussion entry "melorheostosis_attribution".'
      selected_evidence:
        snippet: In some OPK and BOS families, an individual may have relatively large, asymmetric areas
          of dense cortical bone interpreted as melorheostosis (MEL).
