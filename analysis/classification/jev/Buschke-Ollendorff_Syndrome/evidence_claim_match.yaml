        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Causative; heterozygous germline loss of function
        frequency: Identified in the large majority of clinically diagnosed BOS families, but a minority
          of convincing families have no coding-region variant.
        notes: LEMD3 (also MAN1) lies at 12q14 and encodes an integral protein of the inner nuclear membrane.
          Reported pathogenic alleles are nonsense, frameshift, splice-disrupting or whole-gene deletions
          distributed across the coding sequence, all predicted to remove the C-terminal R-SMAD-interacting
          region. The CURIE is written in the lowercase form this repository uses. Contemporary testing
          should add deletion/duplication analysis to sequencing, and chromosomal microarray is warranted
          when short stature, developmental delay or dysmorphism raises the possibility of a contiguous
          12q14 deletion rather than an isolated LEMD3 lesion.
      selected_evidence:
        snippet: A genome-wide linkage analysis in these families, followed by the identification of a
          microdeletion in an unrelated individual with these diseases, allowed us to map the gene that
          is mutated in osteopoikilosis.
        supports: SUPPORT
