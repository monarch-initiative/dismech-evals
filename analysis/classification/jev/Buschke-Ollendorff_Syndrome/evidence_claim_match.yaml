      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: UNKNOWN
        prevalence_class: BAND_1_9_PER_100000
        rate_per_100000: 5.0
        notes: 'The frequently repeated figure is approximately 1 in 20,000, i.e. 5 per 100,000. It is
          recorded here as measure_type UNKNOWN rather than as an incidence or a point prevalence: the
          source states it as an "estimated incidence" but supplies neither a denominator population nor
          an observation period, and it traces back through the case-series literature rather than to
          a registry. Ascertainment is certainly incomplete in both directions - osteopoikilosis is asymptomatic
          and found incidentally, and the cutaneous nevi are easily dismissed as unremarkable papules
          - so the true figure could lie either side. No population-based BOS prevalence study was identified.'
      selected_evidence:
        snippet: initially described by Buschke and Ollendorff in 1928, is a rare autosomal dominant genetic
          disease with an estimated incidence of 1 in 20,000
        supports: SUPPORT
