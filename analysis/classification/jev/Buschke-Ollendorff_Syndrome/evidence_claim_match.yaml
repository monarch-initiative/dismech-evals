  6be6f365011d76d8c953e2d052e6d27f8283fb469dba689d6f814375647a3c77:
    claim:
      about:
        disease:
          name: Buschke-Ollendorff Syndrome
          disease_term:
            preferred_term: Buschke-Ollendorff syndrome
            term:
              id: MONDO:0008157
              label: Buschke-Ollendorff syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: 'A single heterozygous loss-of-function LEMD3 allele is sufficient. Transmission
          is vertical, family history is the rule, and each child of an affected person has a 50% risk
          of inheriting the variant. Penetrance of the *syndrome* is hard to call complete because the
          two components are ascertained differently: a carrier with radiographically silent skin and
          no reason for an x-ray may look unaffected. Expressivity within a family is emphatically variable
          - relatives carrying the identical variant may have nevi alone, osteopoikilosis alone, or both
          - and no genotype-phenotype correlation has been established.'
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
      selected_evidence:
        snippet: Our results further expand the LEMD3 mutation repertoire, corroborate the extreme interfamilial
          and intrafamilial clinical variability of LEMD3 mutations, and underline the lack of a clear
          phenotype-genotype correlation in BOS.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19438932
      reference_title: Novel and recurrent germline LEMD3 mutations causing Buschke-Ollendorff syndrome
        and osteopoikilosis but not isolated melorheostosis.
      evidence_source: HUMAN_CLINICAL
      explanation: Directly supports variable expressivity within and between families and the absence
        of a genotype-phenotype correlation.
