        - path: /animal_models/0
          value:
            name: Lemd3+/GT heterozygous gene-trap mouse
            species: Mouse
            genotype: Lemd3 heterozygous gene-trap (Lemd3+/GT)
            category: Genetically engineered
            description: 'A BayGenomics gene-trap allele, studied heterozygously as the direct genetic
              counterpart of human LEMD3 haploinsufficiency. Assessed by high-resolution micro-CT with
              full 3D cortical and trabecular histomorphometry, plain radiography read by a trained radiologist,
              and conventional histology. The result was negative on every measure. This is a substantive
              negative finding, not a failed experiment: the same allelic state that reliably produces
              osteopoikilosis in humans produces no skeletal lesion in the mouse, so the species is not
              dosage-equivalent at this locus and there is at present no animal model of the human bone
              phenotype.'
            genes:
            - preferred_term: Lemd3
              term:
                id: hgnc:28887
                label: LEMD3
            publication: PMID:19862465
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Focal Trabecular Osteosclerotic Nodule Formation
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        model_scale: TISSUE
        description: Heterozygous Lemd3 gene-trap mice form no osteopoikilosis-like sclerotic nodules
          on radiography, micro-CT or histology.
        limitations: The mouse does not reproduce the phenotype the model was built to study, so it cannot
          be used to test therapeutic or mechanistic hypotheses about the human lesion. It remains informative
          only as evidence that murine skeletal tissue tolerates a halved Lemd3 dose that humans do not.
          The study examined heterozygotes only, at the ages reported, and did not test whether an aged
          or challenged animal might eventually develop foci.
        divergences:
        - divergence_type: SPECIES_MISMATCH
          materiality: INVALIDATING
          description: 'Mouse skeletal tissue appears insensitive to the 50% reduction in Lemd3 dose that
            produces focal osteosclerosis in humans. The failure is at the level of the organism''s response
            to the genotype, not of the genotype itself: the allele is the correct one.'
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: The cutaneous arm of the syndrome - dermal connective tissue nevi - was not assessed
            at all in this study, so the model is silent on the skin phenotype rather than negative for
            it.
        readouts:
        - name: Cortical and trabecular bone histomorphometry by micro-CT
          target: Focal Trabecular Osteosclerotic Nodule Formation
          interpretation: Percent bone volume, bone surface/volume ratio, trabecular thickness, separation,
            number, pattern factor, structure model index and fractal dimension were all statistically
            indistinguishable from wild type. Direction is left unset because the measurement showed no
            change in either direction.
        - name: Radiographic and histological survey for osteopoikilotic lesions
          target: Focal Trabecular Osteosclerotic Nodule Formation
          interpretation: Neither radiography read by a trained radiologist nor conventional histology
            identified lesions typical of osteopoikilosis.
      selected_evidence:
        snippet: We conclude that the heterozygous Lemd3 gene-trapped mouse is not a good model to study
          osteopoikilosis and the Buschke-Ollendorff syndrome.
        supports: SUPPORT
