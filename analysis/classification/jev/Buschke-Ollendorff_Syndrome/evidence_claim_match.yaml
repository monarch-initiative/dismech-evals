      assertion_type: Diagnosis
      assertion:
        name: Clinical and Radiographic Diagnosis
        description: BOS is diagnosed from the combination of connective tissue nevi and radiographic
          osteopoikilosis, usually with a supporting family history. Plain radiographs of the pelvis,
          hands and wrists, knees and ankles are the highest-yield screen; CT adds little in typical disease
          and PET/MRI is unnecessary. Because expressivity is variable, a first-degree relative with only
          one component still warrants consideration, and a negative childhood radiograph does not exclude
          osteopoikilosis that appears later.
        diagnosis_term:
          preferred_term: plain radiography
          term:
            id: NCIT:C38101
            label: X-Ray Imaging
      selected_evidence:
        snippet: After a minor trauma, radiologic examination of the left ankle of a 39-year-old woman
          revealed features of osteopoikilosis.
        supports: SUPPORT
