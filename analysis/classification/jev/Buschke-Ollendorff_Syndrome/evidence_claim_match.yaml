        - target: Loss of Nuclear Envelope R-SMAD Antagonism
          relationship: PERTURBS
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Bidirectional manipulation of MAN1 dose in a whole embryo, reading out BMP target
            gene expression, which is the mechanism this node asserts is lost in patients.
          limitations: 'A developmental patterning assay in an amphibian embryo, not a disease model:
            neither bone nor dermal connective tissue is assayed, and the perturbations are overexpression
            and near-complete knockdown rather than the 50% reduction seen in patients.'
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Xenopus early embryogenesis. The Smad-binding function is conserved, but the
              tissue context (neuroectoderm patterning) has no counterpart in the human disease.
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The measured quantity is BMP target-gene expression (Xhox3, Msx1) and a Xvent2
              reporter, standing in for the human node's quantity, which is the amount of R-SMAD sequestered
              and dephosphorylated at the inner nuclear membrane.
      selected_evidence:
        snippet: Using a Xenopus expression screening approach with an anterior neuroectoderm cDNA library,
          we have identified an inner nuclear membrane protein, XMAN1, as a novel neuralizing factor that
          is encoded by the Xenopus ortholog of human MAN1.
