              id: MONDO:0008157
              label: Buschke-Ollendorff syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Genetic Counselling and Cascade Evaluation
        description: 'Autosomal dominant transmission with a 50% recurrence risk per pregnancy, but counselling
          must convey that the phenotype in an inheriting child cannot be predicted from the parent''s:
          the same allele produces skin-only, bone-only, full and clinically silent presentations within
          one family. Cascade radiographic and dermatological evaluation of relatives is useful mainly
          to spare them an oncological workup later. Because the causative gene is known, prenatal diagnosis
          and preimplantation genetic testing are technically available once a familial LEMD3 variant
          has been identified; counselling should say so while setting it against the condition''s generally
          benign course and the fact that the severity in an inheriting child cannot be predicted, so
          the decision is not the one it would be for a progressive or life-limiting disease.'
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: We investigated LEMD3 in a two-generation BOS family showing an extremely variable expression
          of the disease, in a sporadic patient with skin features of BOS, and in an additional subject
          with isolated melorheostosis.
        supports: SUPPORT
    origin:
