      assertion:
        name: Non-Endotoxin Dust Constituent Activity
        description: A constituent of cotton dust other than endotoxin contributes to the acute airway
          response. Bract-derived tannin is the usual candidate, though the complement assay below excludes
          it for that branch specifically. Cotton bract and cotton dust extracts with low measured endotoxin
          provoke large falls in expiratory flow and heighten methacholine responsiveness in healthy volunteers,
          and cotton dust activates complement without that activation tracking endotoxin content.
        role: driver
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: complement activation
          term:
            id: GO:0006956
            label: complement activation
          modifier: INCREASED
        notes: Curated as an EMERGING alternative rather than a replacement for the endotoxin model. The
          challenge study is in healthy volunteers, not byssinotic workers, and it does not identify the
          responsible constituent. Tannin is the literature's candidate rather than a demonstrated agent,
          and the complement study curated here excludes it for the complement branch, so the candidate
          space has narrowed without closing. The complement activation bound here is sourced to its primary
          in vitro assay, which also rules endotoxin out as the complement-activating component; what
          remains unknown is which constituent is responsible, tracked in the `non_endotoxin_agent_identity`
          discussion.
      selected_evidence:
        snippet: Extracts of cotton mill dust (CDE) were shown to activate complement by the classical
          and alternative pathways.
        supports: SUPPORT
