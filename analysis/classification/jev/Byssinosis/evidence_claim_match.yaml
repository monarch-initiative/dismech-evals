        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pulmonary Mast Cell Histamine Accumulation and Release
        description: Cotton and flax dust potentiate histamine formation or accumulation in the lung,
          possibly by recruiting mast cells and by inhibiting histamine-degrading enzyme activity. Histamine
          accumulated during an exposure-free interval is proposed to be released on re-exposure, which
          is the leading mechanistic account of why symptoms peak on the first working day after a break.
        role: driver
        biological_scale: TISSUE
        cell_types:
        - preferred_term: mast cell
          term:
            id: CL:0000097
            label: mast cell
        biological_processes:
        - preferred_term: mast cell degranulation
          term:
            id: GO:0043303
            label: mast cell degranulation
          modifier: INCREASED
        notes: 'Kept as one contributing pathway rather than the mechanism. The 1984 studies state the
          accumulate-then-release account as a proposal in their own words, and no modern replication
          of the lung-histamine measurement was retrieved; the later human study above pairs raised blood
          histamine with measured obstruction but is a small cross-sectional comparison (8 byssinotic,
          16 non-byssinotic exposed, 15 unexposed), not a test of the accumulation mechanism. The convergent
          modern evidence for the Monday pattern is the cross-shift physiology, not the histamine chemistry.

          The histamine item is DOI-keyed because the article has no PubMed record (checked via the PMC
          ID Converter). DOI: is in `skip_prefixes`, so the gating reference validator does not snippet-check
          it; it was verified separately with `just count-verified-snippets --unskip-prefix DOI`.'
      selected_evidence:
        snippet: Histamine accumulated in the lung over the weekend is released on exposure to dust causing
          the symptoms of byssinosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
