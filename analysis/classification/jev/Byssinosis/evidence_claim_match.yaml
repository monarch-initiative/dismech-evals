      assertion_type: Diagnosis
      assertion:
        name: Occupational history with work-related symptom timing and cross-shift spirometry
        description: Diagnosis rests on a compatible fibre-dust exposure history plus the characteristic
          symptom timing, optionally with spirometry demonstrating a cross-shift FEV1 fall. There is no
          confirmatory imaging or histologic test — unlike the mineral-dust pneumoconioses, byssinosis
          has no radiographic signature — so the temporal pattern carries the diagnosis.
        notes: Cross-shift spirometry is the one test that reflects the disease's defining physiology,
          but it requires measuring a worker before and after a shift following a break, which is why
          symptom-based criteria dominate field surveys.
      selected_evidence:
        snippet: Data collection involved questionnaire-based interviews, spirometry and measurements
          of personal exposure to inhalable dust.
        supports: SUPPORT
