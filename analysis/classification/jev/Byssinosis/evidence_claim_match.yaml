  06419e3f2108eb843877ddf094b4dc2c59919a371c61eff7b4bafaf6a0351fdf:
    claim:
      about:
        disease:
          name: Byssinosis
          disease_term:
            preferred_term: byssinosis
            term:
              id: MONDO:0006688
              label: byssinosis
        context: []
      assertion_type: Definition
      assertion:
        name: Schilling grading of byssinosis
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: The original and still-used symptom grading, from the 1960 Lancashire cotton industry
          study. Grade 0 is no Monday chest tightness or breathlessness; Grade 1/2 occasional Monday chest
          tightness or mild respiratory irritation; Grade 1 chest tightness and/or breathlessness on Mondays
          only; Grade 2 the same on Mondays and other days. The scale is built entirely on the temporal
          pattern — what day symptoms fall on — which is why it works for a disease with no distinctive
          radiographic or histologic finding. Contemporary use adds an FEV1 decrement to the symptom criterion.
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: In continuous use since 1960 and still the reference standard against which contemporary
            surveys report, but note that applying WHO symptom-only versus Schilling symptom-plus-FEV1
            criteria to the same 2,031-worker cohort gave 3% and 4% respectively, so the choice of criterion
            moves the answer.
        notes: The authors of the contemporary survey explicitly discuss the difficulty of applying the
          standard guidelines, so this definition is recorded as the established criterion while noting
          it is actively contested in practice.
      selected_evidence:
        snippet: 'The workers were graded by their histories as follows: Grade 0—No symptoms of chest
          tightness or breathlessness on Mondays Grade ½—Occasional chest tightness on Mondays, or mild
          symptoms such as irritation of the respiratory tract on Mondays Grade 1—Chest tightness and/or
          breathlessness on Mondays only Grade 2—Chest tightness and/or breathlessness on Mondays and
          other days'
        supports: SUPPORT
    origin:
