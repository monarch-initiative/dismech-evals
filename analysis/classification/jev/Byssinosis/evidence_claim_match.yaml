      assertion_type: Genetic
      assertion:
        name: TNF
        gene_term:
          preferred_term: TNF
          term:
            id: hgnc:11892
            label: TNF
        association: Host susceptibility modifier of the chronic arm rather than of disease onset. In
          a 20-year cohort of cotton and silk workers, TNF promoter genotypes associated with higher TNF
          expression showed a steeper endotoxin-related annual FEV1 decline — about -6.8 mL/year in G/A
          and A/A carriers against -2.9 mL/year in G/G. The effect was clearest in never-smokers, so it
          is not a smoking interaction.
        relationship_type: MODIFIER
        variant_origin: GERMLINE
        notes: Curated as MODIFIER rather than SUSCEPTIBILITY because the measured outcome is the rate
          of decline in exposed workers, not the odds of developing disease. The same locus is curated
          as SUSCEPTIBILITY on Coal Workers Pneumoconiosis, where the studies are case-control against
          exposed controls — the difference is in what was measured, not in the biology.
      selected_evidence:
        snippet: Endotoxin exposure was associated with faster lung function decline among genotypes associated
          with higher TNF expression levels, with estimates of annual FEV1 change in relation to endotoxin
          exposure of -2.9 ml and -6.8 ml in the G/G and G/A+AA genotypes, respectively, for the TNF polymorphism
        supports: SUPPORT
    origin:
