              id: MONDO:0006688
              label: byssinosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endotoxin Sensing by CD14 and TLR4
        description: 'Inhaled endotoxin is recognized by the CD14/TLR4/MD-2 receptor complex on airway
          macrophages and bronchial epithelium, activating NF-kappaB-driven pro-inflammatory transcription.
          Human evidence for this step in byssinosis specifically is genetic rather than histological:
          variants in CD14 and TLR4 shift the inflammatory-mediator response to organic dust endotoxin.'
        role: driver
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        - preferred_term: bronchial epithelial cell
          term:
            id: CL:0002328
            label: bronchial epithelial cell
        biological_processes:
        - preferred_term: response to lipopolysaccharide
          term:
            id: GO:0032496
            label: response to lipopolysaccharide
          modifier: INCREASED
        - preferred_term: toll-like receptor 4 signaling pathway
          term:
            id: GO:0034142
            label: toll-like receptor 4 signaling pathway
          modifier: INCREASED
        notes: The receptor step itself is inferred for byssinosis rather than demonstrated in byssinotic
          airway tissue. The cited study is of organic-dust-exposed workers generally, not a byssinosis
          cohort, and its readouts are blood cytokines rather than airway histology.
      selected_evidence:
        snippet: IL-6 and ECP values were lower among those with TLR-4 /+896 AG and GG polymorphisms as
          compared to AA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16142747
      reference_title: Organic dust induced inflammation--role of atopy and TLR-4 and CD14 gene polymorphisms.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The specific measured effect: TLR4 genotype changes the cytokine output of endotoxin-exposed
        workers, tying receptor to mediator quantitatively.'
