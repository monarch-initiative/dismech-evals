        context: []
      assertion_type: Environmental
      assertion:
        name: Occupational inhalation of cotton, flax, hemp or sisal dust
        description: Inhalation of dust from raw vegetable fibre during textile processing is the necessary
          cause. Risk concentrates in the dustiest upstream operations — opening, carding and spinning
          — and rises with duration of employment in the industry. Contemporary mills can show high symptom
          rates at low measured inhalable dust concentrations.
        exposure_term:
          preferred_term: exposure to cotton dust
          term:
            id: ECTO:7000148
            label: exposure to cotton dust
        exposure_classifications:
          hazard_agent_type:
          - classification_value: BIOLOGICAL
            notes: Classified biological rather than chemical because the operative agent on the canonical
              model is bacterial endotoxin of gram-negative origin, and the dust is plant material. This
              is the substantive difference from the mineral-dust exposures curated for silicosis and
              coal workers' pneumoconiosis, which are CHEMICAL.
          exposure_route:
          - classification_value: INHALATION
          exposure_duration:
          - classification_value: CHRONIC
            notes: ATSDR chronic duration. Note the acute cross-shift response occurs on the timescale
              of a single shift, but the disease as curated — including its chronic irreversible arm —
              requires years of repeated exposure.
          ghs_health_hazard_class:
          - classification_value: STOT_REPEATED_EXPOSURE
          exposome_domain:
          - classification_value: SPECIFIC_EXTERNAL
        notes: 'No IARC carcinogen group is recorded: IARC has not classified cotton dust in a group this
          entry would be entitled to assert, and byssinosis is not a neoplastic outcome.'
      selected_evidence:
        snippet: Cigarette smoking (≥3.5 pack-years), increasing duration of employment in the textile
          industry and work in the spinning section were important factors found to be associated with
          several respiratory outcomes.
        supports: SUPPORT
