          term:
            id: GO:0019865
            label: immunoglobulin binding
          modifier: DECREASED
      selected_evidence:
        snippet: Complement component C1q plays an important recognition role in adaptive, and innate,
          immunity through its ability to interact, via its six globular head regions, with both immunoglobulin
          and non-immunoglobulin activators of the complement system
        supports: SUPPORT
