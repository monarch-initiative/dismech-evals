      assertion_type: Pathophysiology
      assertion:
        name: Loss of Tolerance to Nuclear Autoantigens
        biological_scale: ORGANISM
        description: Sustained exposure to nuclear autoantigens from uncleared apoptotic material leads
          to antinuclear autoantibody production and immune-complex disease. C1q-deficient mice develop
          autoantibodies and immune-complex glomerulonephritis, though expression depends strongly on
          genetic background. In patients antinuclear antibodies are usual but anti-dsDNA antibodies are
          less frequent than in sporadic SLE.
      selected_evidence:
        snippet: These data demonstrate that the expression of autoimmunity in C1q-deficient mice is strongly
          influenced by other background genes.
        supports: SUPPORT
