      assertion:
        name: Defective Clearance of Apoptotic Cells
        biological_scale: CELLULAR
        description: C1q binds apoptotic cells and, with the early classical pathway components, promotes
          their removal by macrophages. In C1q-deficient mice apoptotic bodies accumulate in glomeruli
          and are cleared poorly from the peritoneum. This is the basis of the waste-disposal hypothesis,
          in which persisting apoptotic material supplies the nuclear autoantigens of SLE. The defect
          has been demonstrated in mice rather than measured directly in patients.
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: apoptotic cell clearance
          term:
            id: GO:0043277
            label: apoptotic cell clearance
          modifier: DECREASED
      selected_evidence:
        snippet: Among mice without glomerulonephritis, there were significantly greater numbers of glomerular
          apoptotic bodies in C1q-deficient mice compared with controls.
        supports: SUPPORT
