      reference: PMID:11390518
      reference_title: Molecular basis of a selective C1s deficiency associated with early onset multiple
        autoimmune diseases.
      evidence_source: HUMAN_CLINICAL
      explanation: A homozygous C1S nonsense variant in a patient with undetectable C1s.
