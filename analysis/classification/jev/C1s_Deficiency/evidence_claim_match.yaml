        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of C1s Cleavage of Apoptotic-Cell Autoantigens
        biological_scale: MOLECULAR
        description: In vitro, C1s (alone or within C1) cleaves intracellular proteins exposed during
          apoptosis, including the alarmin HMGB1, and the cleaved HMGB1 is less able to amplify cytokine
          production by monocytes, macrophages and dendritic cells. Loss of this activity is a C1s-specific
          candidate mechanism for the lupus association that does not depend on C4 and C2 cleavage. It
          has not been tested in C1s deficient patients.
        molecular_functions:
        - preferred_term: C1s cleavage of HMGB1 and other apoptotic-cell proteins
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
          modifier: DECREASED
      selected_evidence:
        snippet: This is verified experimentally with C1s, both in its purified and physiological form
          as C1 complex, cleaving HMGB1 into defined fragments of 19 and 12 kDa. This cleavage diminishes
          HMGB1 ability to enhance lipopolysaccharide mediated pro-inflammatory cytokines production from
          monocytes, macrophages and dendritic cells.
        supports: SUPPORT
