              label: complement component C1s deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absent C1s Protease
        biological_scale: MOLECULAR
        description: Biallelic nonsense, frameshift or missense variants in C1S abolish circulating C1s
          or leave a functionally inactive protein at very low level. Reported alleles include homozygous
          p.Arg534*, homozygous p.Tyr204* (c.938 in exon 6), homozygous exon 10 TTTG deletion, homozygous
          p.Phe110Leufs*23, and compound heterozygous combinations of the exon 10 deletion, p.Glu597*,
          p.Gly630Glu, p.Gly172* and p.Tyr250*.
        genes:
        - preferred_term: C1S
          term:
            id: hgnc:1247
            label: C1S
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: C1s serine protease activity
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Exon-specific amplification of genomic DNA by PCR followed by direct sequence analysis
          revealed a homozygous nonsense mutation in the C1s gene exon XII at codon 534, caused by a nucleotide
          substitution from C (CGA for arginine) to T (TGA for stop codon).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
