        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Reported biallelic loss-of-function alleles: homozygous c.1087_1090del (exon 10 TTTG deletion),
          homozygous p.Arg534*, homozygous truncating variant at c.938 in exon 6 (reported as Y204X),
          homozygous c.330del p.(Phe110Leufs*23); compound heterozygous exon 10 TTTG deletion with p.Glu597*,
          p.Glu597* with missense p.Gly630Glu, and p.Gly172* with p.Tyr250*. Heterozygous C1S missense
          and in-frame variants with a gain-of-function effect cause periodontal Ehlers-Danlos syndrome,
          a different disease. No ClinGen gene-disease validity record for C1S with this disease was found
          in the local cache.'
      selected_evidence:
        snippet: Exon-specific amplification of genomic DNA by PCR followed by direct sequence analysis
          revealed a homozygous nonsense mutation in the C1s gene exon XII at codon 534, caused by a nucleotide
          substitution from C (CGA for arginine) to T (TGA for stop codon).
