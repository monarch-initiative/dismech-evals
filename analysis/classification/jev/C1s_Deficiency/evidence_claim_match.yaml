          value:
            name: Loss of C1s Cleavage of Apoptotic-Cell Autoantigens
            biological_scale: MOLECULAR
            description: In vitro, C1s (alone or within C1) cleaves intracellular proteins exposed during
              apoptosis, including the alarmin HMGB1, and the cleaved HMGB1 is less able to amplify cytokine
              production by monocytes, macrophages and dendritic cells. Loss of this activity is a C1s-specific
              candidate mechanism for the lupus association that does not depend on C4 and C2 cleavage.
              It has not been tested in C1s deficient patients.
            molecular_functions:
            - preferred_term: C1s cleavage of HMGB1 and other apoptotic-cell proteins
              term:
                id: GO:0004252
                label: serine-type endopeptidase activity
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Loss of Tolerance to Nuclear Autoantigens
        description: Uncleaved alarmins and autoantigens from dying cells remain immunogenic.
      selected_evidence:
        snippet: Further mass spectrometric analysis of the C1 complex treated apoptotic cellular proteins
          demonstrated additional C1s substrates and revealed the complementary role of C1s in apoptotic
          cells clearance through the proteolytic cleavage of intracellular alarmins and autoantigens.
        supports: SUPPORT
        directness: INDIRECT
