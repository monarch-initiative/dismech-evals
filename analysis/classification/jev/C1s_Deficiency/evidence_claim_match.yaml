      assertion:
        name: Autosomal Recessive
        description: Disease requires biallelic C1S variants, homozygous in consanguineous families and
          compound heterozygous otherwise. Heterozygous parents and relatives have about half-normal serum
          C1s and are clinically unaffected.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: The levels of serum C1s seem to be correlated to the genotypes of the C1s gene in which
          no C1s was detected in the patient, and one-half of the normal level in the family members who
          are heterozygous for either mutation. The present study demonstrates that the disease is inherited
          in an autosomal recessive mode.
        supports: SUPPORT
