        name: CACNA1A Polyglutamine Expansion in SCA6
        description: SCA6 is caused by expansion of a CAG trinucleotide repeat in CACNA1A exon 47, encoding
          a polyglutamine tract in the cytoplasmic C-terminal domain of Cav2.1. Unlike other polyglutamine
          diseases, SCA6 expansions are relatively small (20-33 repeats). The cited evidence indicates
          that the expansion does not primarily alter P/Q-type calcium currents; this entry does not assert
          an aggregation or cell-death mechanism without direct supporting evidence.
        cell_types:
        - preferred_term: Purkinje cell
          term:
            id: CL:0000121
            label: Purkinje cell
        gene:
          preferred_term: CACNA1A
          term:
            id: hgnc:1388
            label: CACNA1A
      selected_evidence:
        snippet: SCA6 is underlined by an expanded polyglutamine tract in the C-terminal of the gene,
          a modification which does not primarily affect calcium currents
        supports: SUPPORT
