      assertion_type: Discussion
      assertion:
        discussion_id: gap_cacna1e_rtype_blocker_precision_therapy
        prompt: Can variant-specific Cav2.3 modulation improve seizures and developmental outcomes safely?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Increased R-Type Calcium Entry
        - pathophysiology#Facilitated Cav2.3 Activation
        rationale: Topiramate responses are heterogeneous and uncontrolled, with relapses and sedation;
          its multiple actions prevent attribution of benefit solely to Cav2.3 blockade. The CDKL5 study
          proposes inhibitor testing rather than demonstrating pharmacological rescue. Loss-of-function
          alleles in the broader spectrum further argue for functional assessment before assuming one
          therapeutic direction.
      selected_evidence:
        snippet: Two individuals (16 and 27) remain seizure free for 2 and 5 years, respectively. However,
          in individuals 15 and 21, seizures eventually recurred after seizure-free periods of 4 years
          and 18 months, respectively; individual 21 died following an episode of status epilepticus.
          Individual 1 reported a substantial reduction in seizure frequency with topiramate, but it was
          discontinued due to increased sedation. Topiramate had no effect on seizure control in 10/18
          (56%) individuals who were prescribed it; 3/18 (17%) individuals who were prescribed topiramate
          reported a reduction in seizures but were never seizure free.
        supports: SUPPORT
        directness: DIRECT
