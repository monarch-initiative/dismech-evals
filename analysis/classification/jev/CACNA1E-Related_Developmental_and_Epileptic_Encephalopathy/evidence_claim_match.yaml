        name: Autosomal Dominant (De Novo)
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: The disorder arises almost exclusively from de novo heterozygous CACNA1E missense
          variants; recurrent gain-of-function variants at the S6 activation gate act dominantly, so a
          single altered allele is sufficient to cause disease.
      selected_evidence:
        snippet: we identified de novo CACNA1E variants in 30 individuals with DEE, characterized by refractory
          infantile-onset seizures, severe hypotonia, and profound developmental impairment, often with
          congenital contractures, macrocephaly, hyperkinetic movement disorders, and early death.
        supports: SUPPORT
