      selected_evidence:
        snippet: The six individuals harboring the recurrent c.2104G>A (p.Ala702Thr) variant had a relatively
          homogeneous phenotype that was representative of the overall CACNA1E-encephalopathy phenotype.
          All individuals had refractory infantile-onset epilepsy, epileptic spasms, severe hypotonia,
          and profound developmental impairment. Five out of six individuals (83%) harboring the c.2104G>A
          (p.Ala702Thr) variant had congenital joint contractures and macrocephaly; hypsarrhythmia on
          EEG consistent with a diagnosis of West syndrome was observed in four of these individuals (67%).
