            label: neuron
      selected_evidence:
        snippet: The 30 patients with pathogenic CACNA1E variants presented with a variable DEE characterized
          by refractory epilepsy (87% of patients) with median seizure onset at 4.5 months, movement disorders
          (60%), spastic quadriplegia (53%), congenital joint contractures (43%), macrocephaly (43%),
          and profound developmental impairments (ie, nonverbal and nonambulatory) (88%).
        supports: SUPPORT
