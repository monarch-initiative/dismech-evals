          voltages, creating a broader window current at hyperpolarized potentials. This predicts increased
          channel availability at subthreshold voltages despite unchanged peak density and inactivation
          kinetics.
        biological_scale: MOLECULAR
        role: central_effector
        genes:
        - preferred_term: CACNA1E
          term:
            id: hgnc:1392
