              label: Autosomal dominant inheritance
        notes: The disease-defining lesions are recurrent de novo gain-of-function missense variants (e.g.,
          p.Gly352Arg in domain I S6 and p.Ala702Thr in domain II S6) clustering at the cytoplasmic ends
          of the S6 activation gate; variant_origin is set to DE_NOVO to reflect this dominant class.
          A distinct rare class of truncating variants is associated with a much milder phenotype and
          uncertain pathogenic role; notably these were not uniformly de novo germline events — one reported
          truncating case was somatic mosaic (present in 27% of cells) and another was inherited from
          an unaffected parent — so mosaic and inherited origins occur in the milder truncating subset.
      selected_evidence:
        snippet: Most of the 14, partially recurring, variants cluster within the cytoplasmic ends of
          all four S6 segments, which form the presumed CaV2.3 channel activation gate.
        supports: SUPPORT
