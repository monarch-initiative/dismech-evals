          term:
            id: CL:0000540
            label: neuron
        molecular_functions:
        - preferred_term: voltage-gated calcium channel activity
          modifier: INCREASED
          term:
            id: GO:0005245
            label: voltage-gated calcium channel activity
        - preferred_term: high voltage-gated (R-type) calcium channel activity
          modifier: INCREASED
          term:
            id: GO:0008331
            label: high voltage-gated calcium channel activity
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Most of the 14, partially recurring, variants cluster within the cytoplasmic ends of
          all four S6 segments, which form the presumed CaV2.3 channel activation gate.
        supports: SUPPORT
