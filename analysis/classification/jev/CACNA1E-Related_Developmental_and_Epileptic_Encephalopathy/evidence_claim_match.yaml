              id: MONDO:0032657
              label: developmental and epileptic encephalopathy, 69
        context: []
      assertion_type: Subtype
      assertion:
        name: DI-S6
        display_name: Domain I S6 (p.Gly352Arg hotspot)
        description: Missense variants clustering in the domain I S6 segment, most commonly the recurrent
          p.Gly352Arg variant. This subtype is defined by a strong genotype-phenotype correlation with
          hyperkinetic movement disorders, which were present in all affected individuals in this domain
          versus only a small minority of individuals with variants elsewhere.
        genes:
        - preferred_term: CACNA1E
          term:
            id: hgnc:1392
            label: CACNA1E
      selected_evidence:
        snippet: Ten individuals carried missense variants in the DI-S6 domain, including 9 individuals
          with the recurrent p.Gly352Arg variant; all 10 individuals presented with hyperkinetic movement
          disorders, compared with only (2/19) individuals with variants outside this domain.
        supports: SUPPORT
