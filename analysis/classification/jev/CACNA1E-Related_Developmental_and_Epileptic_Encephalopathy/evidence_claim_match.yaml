      assertion_type: Pathophysiology
      assertion:
        name: Increased Neuronal Calcium Influx
        description: The gain-of-function Cav2.3 channel conducts excess high-voltage-activated R-type
          calcium current. Because Cav2.3 is expressed at both presynaptic terminals and in the somatodendritic
          compartment, facilitated activation and slowed inactivation increase depolarization-evoked calcium
          entry, raising intracellular calcium beyond the physiological range.
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: calcium ion transmembrane transport
          modifier: INCREASED
          term:
            id: GO:0070588
            label: calcium ion transmembrane transport
      selected_evidence:
        snippet: Electrophysiological recordings showed a hyperpolarizing shift in voltage-dependent activation,
          slowed kinetics of inactivation, and increased current density.
        supports: SUPPORT
