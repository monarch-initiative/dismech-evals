          inactivation kinetics, or recovery from inactivation, but showed a significant shift towards
          hyperpolarized voltages in both voltage-dependent activation and steady-state inactivation.
          This resulted in a broader window current shifted towards more hyperpolarized potentials, which
          predicts increased channel availability and activity at subthreshold voltages relative to wild-type
          channels.
        supports: SUPPORT
        directness: DIRECT
