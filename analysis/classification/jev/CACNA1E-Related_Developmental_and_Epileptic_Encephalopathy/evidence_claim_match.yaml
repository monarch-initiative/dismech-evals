          modifier: INCREASED
          term:
            id: GO:0070588
            label: calcium ion transmembrane transport
      selected_evidence:
        snippet: which conducts high voltage-activated R-type calcium currents that initiate synaptic
          transmission.
        supports: SUPPORT
