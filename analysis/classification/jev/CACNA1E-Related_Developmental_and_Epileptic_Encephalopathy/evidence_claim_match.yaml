  6262d301c9057f0fb0512867d09717979043db0ebd4a34b985f52572cac5651a:
    claim:
      about:
        disease:
          name: CACNA1E-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: CACNA1E-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0032657
              label: developmental and epileptic encephalopathy, 69
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CACNA1E Variant and Gain-of-Function Cav2.3 Channel
        description: 'CACNA1E encodes the pore-forming alpha1 subunit of the high-voltage-activated Cav2.3
          R-type calcium channel. Recurrent de novo missense variants cluster at the cytoplasmic ends
          of the four S6 segments that form the presumed channel activation gate. Functional analysis
          of these variants in heterologous expression systems shows consistent gain-of-function effects:
          facilitated (hyperpolarized) voltage-dependent activation and slowed inactivation, with a domain
          II S4-S5 linker variant additionally increasing current density.'
        genes:
        - preferred_term: CACNA1E
          term:
            id: hgnc:1392
            label: CACNA1E
        role: trigger
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        molecular_functions:
        - preferred_term: voltage-gated calcium channel activity
          modifier: INCREASED
          term:
            id: GO:0005245
            label: voltage-gated calcium channel activity
        - preferred_term: high voltage-gated (R-type) calcium channel activity
          modifier: INCREASED
          term:
            id: GO:0008331
            label: high voltage-gated calcium channel activity
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Most of the 14, partially recurring, variants cluster within the cytoplasmic ends of
          all four S6 segments, which form the presumed CaV2.3 channel activation gate.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30343943
      reference_title: De Novo Pathogenic Variants in CACNA1E Cause Developmental and Epileptic Encephalopathy
        with Contractures, Macrocephaly, and Dyskinesias.
      evidence_source: HUMAN_CLINICAL
      explanation: Localizes the recurrent pathogenic variants to the S6 activation gate of the Cav2.3
        channel, the structural basis of the gain-of-function trigger.
