          architecture and dramatic resistance to limbic seizures in Ca(v)2.3(-/-) mice compared with
          controls, whereas no difference in hippocampal EEG seizure activity between both genotypes could
          be detected at this suprathreshold dosage.
        supports: SUPPORT
        directness: DIRECT
