          name: CACNA1E-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: CACNA1E-related developmental and epileptic encephalopathy
            term:
              id: MONDO:0032657
              label: developmental and epileptic encephalopathy, 69
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cacna1e_rtype_blocker_precision_therapy
        prompt: Given that CACNA1E-related DEE is predominantly a gain-of-function Cav2.3 channelopathy,
          are R-type calcium channel blockers a rational precision therapy, and can the partial success
          of topiramate be extended to selective Cav2.3 antagonists with acceptable CNS safety?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#CACNA1E Variant and Gain-of-Function Cav2.3 Channel
        - pathophysiology#Increased Neuronal Calcium Influx
        rationale: 'The disorder-defining study shows that most pathogenic variants are gain-of-function
          and that topiramate, which blocks R-type calcium channels, produced seizure freedom in five
          patients. This implies that reducing Cav2.3 current is mechanistically on-target, but topiramate
          is a broad-spectrum drug and no selective Cav2.3 antagonist is clinically available; whether
          a channel-selective blocker would be more effective or tolerable, and whether benefit generalizes
          beyond seizures to the developmental and movement phenotypes, is unresolved. The rare truncating
          (possible loss-of-function) variants further complicate a one-directional therapeutic model.
          More recent CDKL5-deficiency work reframes this question at the module level: it shows the Cav2.3
          gain-of-function state is shared between CACNA1E DEE69 and CDKL5 deficiency and explicitly proposes
          Cav2.3 inhibitors as a rational, cross-disease precision therapy, strengthening the case for
          developing a selective Cav2.3 antagonist.'
      selected_evidence:
        snippet: Five participants achieved seizure freedom on the anti-epileptic drug topiramate, which
          blocks R-type calcium channels.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
