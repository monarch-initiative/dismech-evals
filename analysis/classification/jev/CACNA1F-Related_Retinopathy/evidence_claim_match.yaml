      assertion:
        name: Cone Bipolar Cell Dendritic Sprouting and Cone Pathway Dysfunction
        description: In Cav1.4 gain-of-function (I756T) mice, cone photoreceptors retain the capacity
          to release glutamate, but most cone bipolar cells undergo dendritic sprouting and ganglion cell
          responses to photopic stimuli are lost in the majority of cells, indicating a postsynaptic cone
          bipolar cell defect downstream of the presynaptic channelopathy. Acute calcium-channel blockade
          did not rescue synaptic transmission deficits.
        cell_types:
        - preferred_term: Retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        - preferred_term: Cone retinal bipolar cell
          term:
            id: CL:0000752
            label: cone retinal bipolar cell
      selected_evidence:
        snippet: Though cone photoreceptors underwent morphological rearrangements, they retained their
          ability to release glutamate. Our functional data suggested a postsynaptic cone bipolar cell
          defect
        supports: SUPPORT
