          on the basis of suggestive ERG findings plus a heterozygous or biallelic variant. If the mother
          of an affected male is a carrier, each pregnancy carries a 50% chance of transmitting the pathogenic
          variant; affected males pass the variant to all daughters (obligate carriers) and no sons.
