      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33668843
      reference_title: Optic Atrophy and Inner Retinal Thinning in CACNA1F-related Congenital Stationary
        Night Blindness.
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies macular inner retinal (GCL-IPL) thinning independent of myopia in molecularly-confirmed
