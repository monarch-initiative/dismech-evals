            term:
              id: MONDO:0700243
              label: CACNA1F-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cav1.4 Channel Dysfunction at the Photoreceptor Ribbon Synapse
        description: CACNA1F pathogenic variants (missense, nonsense, frameshift, splice-site, and synonymous
          splice-altering variants) alter Cav1.4 L-type calcium channel abundance, gating, or biophysical
          properties at the presynaptic ribbon synapse of rod and cone photoreceptors. Most variants are
          loss-of-function; rare gain-of-function variants (e.g. I756T) also cause disease via a distinct
          mechanism.
        cell_types:
        - preferred_term: Photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        molecular_functions:
        - preferred_term: Voltage-gated calcium channel activity
          term:
            id: GO:0005245
            label: voltage-gated calcium channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: We further identified alterations in their biophysical properties, such as a hyperpolarizing
          shift of the activation threshold and an increase in slope factor of activation and inactivation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36943941
      reference_title: Characterization of two pathological gating-charge substitutions in Cav1.4 L-type
        calcium channels.
      evidence_source: IN_VITRO
      explanation: Heterologous-expression electrophysiology of two disease-causing Cav1.4 gating-charge
        substitutions found in CSNB2 patients, supporting altered channel biophysics as the proximal molecular
        lesion.
