        notes: Encodes the alpha-1F pore-forming subunit of the Cav1.4 L-type voltage-gated calcium channel.
          Located at Xp11.23, 48 exons; the pathogenic variant spectrum includes missense, nonsense, frameshift,
          splice-site, and intronic/synonymous splice-altering variants, with no clear genotype-phenotype
          correlation established.
      selected_evidence:
        snippet: Two-hundred and thirty variants were reported to be associated with CSNB2A, 19 were specific
          to AIED, and 14 were associated with both AIED and CSNB2A
