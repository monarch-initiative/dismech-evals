              label: CACNA1F-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inner Retinal Thinning and Optic Nerve Involvement
        description: Independent of myopia, CACNA1F-retinopathy patients show reduced macular ganglion
          cell layer-inner plexiform layer (GCL-IPL) thickness and optic disc pallor with reduced peripapillary
          retinal nerve fiber layer (RNFL) thickness, indicating that higher-order (inner retinal/optic
          nerve) structures are affected beyond the primary photoreceptor synaptic defect. Longitudinal
          peripapillary RNFL data in three patients showed stability over time; whether these inner retinal
          changes are stationary or progressive remains unresolved, and the authors of both cited cohorts
          call for larger, longer prospective follow-up.
        cell_types:
        - preferred_term: Retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
      selected_evidence:
        snippet: Mean GCL-IPL thickness was significantly lower
        supports: SUPPORT
    origin:
