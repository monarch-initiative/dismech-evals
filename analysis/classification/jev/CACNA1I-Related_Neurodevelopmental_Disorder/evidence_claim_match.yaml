        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cav33_sleep_spindle_disruption
        hypothesis_label: Distorted thalamic sleep spindles impair neurodevelopment
        status: EMERGING
        description: Cav3.3 is the pacemaker channel for sleep spindles in thalamic reticular neurons.
          Either increased or reduced Cav3.3 activity is proposed to distort spindle rhythmogenesis and
          the sleep-dependent thalamocortical plasticity it supports, contributing to developmental delay
          and intellectual disability. No sleep recordings of patients have been reported.
      selected_evidence:
        snippet: It is therefore well conceivable that distortion of these sleep spindles, due to either
          increased or reduced CaV3.3 activity, contributes to the neurodevelopmental delay and intellectual
          disability in the CACNA1I patients.
        supports: SUPPORT
