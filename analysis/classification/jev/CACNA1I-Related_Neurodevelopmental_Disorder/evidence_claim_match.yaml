      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cav33_trn_hyperexcitability
        hypothesis_label: Thalamic reticular neuron hyperexcitability drives seizures
        status: EMERGING
        description: Gain-of-function Cav3.3 lowers the firing threshold and prolongs bursts of thalamic
          reticular nucleus neurons in computer simulations, which is proposed to destabilize thalamocortical
          rhythms and cause seizures. Support comes from simulations and heterologous expression in chromaffin
          cells; the partial loss-of-function p.(Ala398Val) allele lacks both the simulated hyperexcitability
          and seizures.
      selected_evidence:
        snippet: Here the simulation of action potentials in TRN neurons demonstrates that, even when
          co-expressed with wild-type in a 1:1 ratio, corresponding to the heterozygous genotype in the
          patients, the gain-of-function CaV3.3 variants cause hyperexcitability.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
