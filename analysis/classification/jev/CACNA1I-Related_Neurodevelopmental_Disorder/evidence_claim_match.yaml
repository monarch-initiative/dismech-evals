      reference_title: Two pairs of CACNA1I (CaV3.3) variants with opposite effects on channel function
        cause neurodevelopmental disorders of varying severity.
      evidence_source: COMPUTATIONAL
      explanation: Simulated hyperexcitability of reticular neurons in the heterozygous state.
