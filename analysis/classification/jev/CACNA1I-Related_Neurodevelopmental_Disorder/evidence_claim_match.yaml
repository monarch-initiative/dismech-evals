        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: cav33_calcium_overload
        hypothesis_label: Calcium overload of developing neurons from gain-of-function Cav3.3 channels
        status: EMERGING
        description: Enlarged, hyperpolarized window currents and slowed channel closure raise calcium
          entry through mutant Cav3.3 at rest and during firing; chronic calcium load from early development
          is proposed to impair synapse formation and neuronal differentiation and cause neuronal loss,
          giving developmental delay and structural brain change. The calcium load has been inferred from
          recombinant-channel recordings; it has not been measured in patient neurons or a knock-in model.
      selected_evidence:
        snippet: Thus, calcium toxicity in neurons expressing the Cav3.3 variants is one likely cause
          of the neurodevelopmental phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
