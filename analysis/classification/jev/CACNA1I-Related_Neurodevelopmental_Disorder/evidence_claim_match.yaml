      assertion_type: DifferentialDiagnosis
      assertion:
        name: Schizophrenia
        description: CACNA1I is a schizophrenia risk gene through common variants; in a Swedish cohort,
          rare patient-derived alleles altered the voltage dependence of Cav3.3 while reduced current
          density was enriched in controls. One adult with a gain-of-function p.(Met1425Val) variant developed
          psychosis, but schizophrenia risk alleles are not reported to cause the developmental phenotype
          of this disorder.
      selected_evidence:
        snippet: Our analysis of this allelic series of coding CACNA1I variants revealed that reduced
          CaV3.3 channel current density was the dominant phenotype associated with rare CACNA1I coding
          alleles derived from control subjects, whereas rare CACNA1I alleles from schizophrenia patients
          encoded CaV3.3 channels with altered responses to voltages.
        supports: SUPPORT
