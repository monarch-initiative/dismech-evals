      assertion_type: Genetic
      assertion:
        name: CACNA1I
        association: Causative
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: CACNA1I
          term:
            id: hgnc:1396
            label: CACNA1I
        variant_origin: GERMLINE
        notes: 'Reported heterozygous missense variants (NM_021096.4): p.(Ile860Asn) c.2579T>A de novo
          (in two unrelated patients), p.(Ile860Met) c.2580C>G in a three-member family, p.(Ile1306Thr)
          c.3917T>C de novo, p.(Met1425Ile) c.4275G>A, p.(Met1425Val) c.4273A>G, p.(Ala398Glu) c.1193C>A
          de novo and possibly mosaic, and p.(Ala398Val) c.1193C>T de novo in two unrelated patients.
          All except p.(Ala398Val) are gain of function; p.(Ala398Val) is a partial loss of function.
          A de novo p.(Tyr1524Cys) in a Pakistani adult with generalized epilepsy, and p.(Phe1631Ile)
          in a child who also carried a homozygous LRP5 variant, have been reported without functional
          testing. No ClinGen gene-disease validity record for this pair is cached locally. The association
          of CACNA1I with schizophrenia is a separate relationship.'
      selected_evidence:
        snippet: Thus, our study implicates CACNA1I gain-of-function mutations in neurodevelopmental disorders,
          with a phenotypic spectrum ranging from borderline intellectual functioning to a severe neurodevelopmental
          disorder with epilepsy.
        supports: SUPPORT
