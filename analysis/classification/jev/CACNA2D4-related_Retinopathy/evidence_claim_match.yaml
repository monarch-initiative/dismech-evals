            term:
              id: MONDO:0700244
              label: CACNA2D4-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CACNA2D4 Loss of Function
        biological_scale: MOLECULAR
        description: Biallelic CACNA2D4 variants (nonsense, multi-exon deletions, a splice-altering deletion,
          and rare missense changes) remove or truncate the alpha2delta-4 auxiliary subunit. The recurrent
          p.Tyr802* nonsense variant truncates about one-third of the open reading frame and is predicted
          to cause nonsense-mediated decay or loss of the delta peptide that anchors the subunit at the
          membrane; the mouse frameshift allele sharply reduces Cacna2d4 transcript. alpha2delta-4 normally
          increases current through the L-type channel it partners.
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
        - preferred_term: CACNA2D4
          term:
            id: hgnc:20202
            label: CACNA2D4
        molecular_functions:
        - preferred_term: calcium channel regulator activity
          term:
            id: GO:0005246
            label: calcium channel regulator activity
          modifier: DECREASED
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
      selected_evidence:
        snippet: The mutation introduces a premature stop codon that truncates one-third of the corresponding
          open reading frame.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17033974
      reference_title: Mutation in the auxiliary calcium-channel subunit CACNA2D4 causes autosomal recessive
        cone dystrophy.
      evidence_source: HUMAN_CLINICAL
      explanation: The human index variant is a truncating nonsense variant, supporting loss of function.
