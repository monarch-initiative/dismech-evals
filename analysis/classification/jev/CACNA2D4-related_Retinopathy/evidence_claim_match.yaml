              label: CACNA2D4-related retinopathy
        context: []
      assertion_type: Treatment
      assertion:
        name: AAV CACNA2D4 Gene Supplementation (Preclinical)
        description: 'No disease-specific therapy is approved and no clinical trial has been reported.
          In alpha2delta-4 knockout mice, subretinal AAV delivery of alpha2delta-4 to photoreceptors restored
          synaptic localization of Cav1.4, ELFN proteins and mGluR6, retinal function and visual acuity,
          and prevented rod degeneration. The benefit depended on age: rod transmission was not restored
          when treatment started in middle age, while cone transmission was. Both studies are preprints.
          An exon-skipping antisense approach was tested and found unsuitable because the skipped alpha2delta-4
          proteins are nonfunctional (PMID:26218913).'
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: Gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: AAV-mediated α2δ4 expression restored synaptic localization of Cav1.4, ELFN proteins,
          and mGluR6 at all treatment ages.
        supports: SUPPORT
