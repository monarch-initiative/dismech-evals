      assertion:
        name: RCD4
        display_name: Retinal cone dystrophy 4 (RCD4)
        subtype_term:
          preferred_term: retinal cone dystrophy 4
          term:
            id: MONDO:0012507
            label: retinal cone dystrophy 4
        description: The originally described cone dystrophy, in two siblings homozygous for CACNA2D4
          p.Tyr802*, with mild late-noticed acuity loss, photophobia since childhood, abnormal colour
          discrimination and an absent single-flash cone ERG response. MONDO currently lists it as the
          only child of the spectrum term.
      selected_evidence:
        snippet: These findings represent the first report of a mutation in the human CACNA2D4 gene and
          define a novel gene defect that causes autosomal recessive cone dystrophy.
        supports: SUPPORT
