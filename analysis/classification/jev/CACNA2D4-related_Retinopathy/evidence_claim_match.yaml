      assertion:
        name: Ectopic Bipolar and Horizontal Cell Neurite Sprouting
        biological_scale: CELLULAR
        description: In alpha2delta-4 knockout retina, rod bipolar, cone bipolar and horizontal cell processes
          extend abnormally into the outer nuclear layer, a remodeling response to the loss of normal
          photoreceptor synaptic contacts. Neonatal gene supplementation in mice prevents it, whereas
          later treatment restores synaptic proteins without reversing the sprouting. Not documented in
          human patients, whose retinal imaging is usually normal.
        cell_types:
        - preferred_term: rod bipolar cell
          term:
            id: CL:0000751
            label: rod bipolar cell
        - preferred_term: cone retinal bipolar cell
          term:
            id: CL:0000752
            label: cone retinal bipolar cell
        - preferred_term: retina horizontal cell
          term:
            id: CL:0000745
            label: retina horizontal cell
        locations:
        - preferred_term: outer nuclear layer of retina
          term:
            id: UBERON:0001789
            label: outer nuclear layer of retina
      selected_evidence:
        snippet: Although the molecular organization of cone synapses is less affected than rod synapses,
          horizontal and cone bipolar processes extend abnormally in the outer nuclear layer in α2δ-4
          KO retina.
        supports: SUPPORT
