        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Photoreceptor Cell Loss
        - pathophysiology#Failure of Rod Ribbon Synapse Assembly
        prompt: Why do alpha2delta-4-deficient mice abolish rod synaptic transmission and lose photoreceptors,
          while patients with null CACNA2D4 variants keep relatively preserved rod function and mostly
          show no retinal degeneration over decades?
        rationale: The spontaneous and knockout mice lose rod synapses and photoreceptors and have a night-blindness-like
          phenotype, whereas human patients have a cone-dominant dysfunction that was stable for 17 years
          in one patient. The cone-dominant zebrafish double knockout matches the human phenotype more
          closely. The mismatch matters because the mouse is the model used for the gene therapy studies,
          and its rod degeneration is a main rescue endpoint.
        proposed_experiments:
        - experiment_id: cacna2d4_human_retinal_organoid
          name: CACNA2D4-null human retinal organoids
          description: Compare rod and cone ribbon synapse assembly, Cav1.4 localization and photoreceptor
            survival in CACNA2D4-null versus isogenic control human retinal organoids.
          would_support:
          - pathophysiology#Failure of Rod Ribbon Synapse Assembly
      selected_evidence:
        snippet: However, mouse phenotype does not recapitulate the human one and is closer to congenital
          stationary night blindness
        supports: SUPPORT
