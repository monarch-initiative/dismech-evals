      assertion_type: Genetic
      assertion:
        name: CACNA2D4
        gene_term:
          preferred_term: CACNA2D4
          term:
            id: hgnc:20202
            label: CACNA2D4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Reported causal variants are nonsense (p.Tyr802*, p.Arg628*), two large multi-exon deletions,
          a splice-altering deletion confirmed by minigene assay, and missense changes; most reported
          affected individuals are homozygous, and one retinitis pigmentosa proband was compound heterozygous.
          Expression differs between siblings carrying the same homozygous variant. p.Arg628* and the
          multi-exon deletion from the UK BioResource study (Ba-Abbad et al. 2016, PMID:26560832) are
          recorded here without evidence items because that letter has no PubMed abstract or cached full
          text.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_f413ef18-b8cf-44c3-abde-b7533e1dd54f-2023-03-02T170000.000Z
        variants:
        - name: p.Tyr802*
          description: NM_172364 c.2406C>A, p.(Tyr802*), in exon 25. Homozygous in the index German siblings
            and in a French sibship; predicted to undergo nonsense-mediated decay or to remove the C-terminal
            third of the protein.
        - name: c.2153-12_2155del
          description: A deletion spanning the intron 22 acceptor site, found in an inherited retinal
            dystrophy panel; in a minigene assay it caused skipping of exon 23, predicted to give p.(Cys718Trpfs*19).
        - name: p.Asp319Asn and p.Ile608Leu
          description: c.955G>A p.(Asp319Asn) and c.1822A>C p.(Ile608Leu), compound heterozygous in a
            single Chinese proband with retinitis pigmentosa; no functional study, and the authors call
            them possibly disease-causing.
      selected_evidence:
        snippet: Over eight probands reported four homozygous variants in this gene including one missense
          variant, and two large deletions covering multiple exons, as well as one stop gained.
        supports: SUPPORT
