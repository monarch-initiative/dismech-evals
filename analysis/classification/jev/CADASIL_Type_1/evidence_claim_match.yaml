  4afcfde6beec5451835d9d67aac016d7407f5790ae5f6a1aeeed5577a38602ce:
    claim:
      about:
        disease:
          name: CADASIL Type 1
          disease_term:
            preferred_term: CADASIL
            term:
              id: MONDO:0000914
              label: cerebral arteriopathy, autosomal dominant, with subcortical infarcts and leukoencephalopathy,
                type 1
        context: []
      assertion_type: Genetic
      assertion:
        name: NOTCH3
        association: Causative
        gene_term:
          preferred_term: NOTCH3
          term:
            id: hgnc:7883
            label: NOTCH3
        notes: 'Autosomal dominant mutations in NOTCH3 cause CADASIL. Over 95% are missense mutations
          affecting cysteine residues in the 34 EGF-like repeat domains, leading to an odd number of cysteines
          and abnormal protein folding. Cysteine-sparing variants can also cause CADASIL-like pathology.
          Variant location within EGFr (EGF-like repeat) domains stratifies into three risk tiers: high-risk
          (HR-EGFr) domains include 1-6 plus 8, 11, and 26; medium-risk (MR-EGFr) and low-risk (LR-EGFr)
          cover the remaining domains. HR-EGFr carriers have an ~10-fold higher odds of stroke than LR-EGFr
          carriers and a higher vascular NOTCH3 aggregation load, supporting an aggregation-driven genotype-phenotype
          severity gradient.'
      selected_evidence:
        snippet: It is caused by mutations in the NOTCH3 gene, which affects the amount of cysteine in
          the extracellular domain (ECD) of the receptor, leading to protein misfolding and receptor aggregation.
          Emerging evidence indicates that beyond classical missense mutations, other variants including
          cysteine-sparing missense mutations, homozygous mutations, small deletions, duplications, splice
          site mutations, a deletion/insertion and loss-of-function mutations may lead to distinct phenotypes
          with variable severity and disease penetrance.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
