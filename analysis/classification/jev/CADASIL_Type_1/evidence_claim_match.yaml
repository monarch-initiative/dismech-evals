  ef26577ba8988a5c835ef39b1f5d8b7f7e92592ad942c1e66b1cfe4136857ae7:
    claim:
      about:
        disease:
          name: CADASIL Type 1
          disease_term:
            preferred_term: CADASIL
            term:
              id: MONDO:0000914
              label: cerebral arteriopathy, autosomal dominant, with subcortical infarcts and leukoencephalopathy,
                type 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NOTCH3 Mutation and ECD Aggregation
        description: Mutations in NOTCH3, primarily missense mutations affecting cysteine residues in
          the extracellular EGF-like repeat domains, lead to abnormal NOTCH3 extracellular domain (ECD)
          multimerization and accumulation in small vessel walls. Wild-type and mutant NOTCH3 ECD co-aggregate,
          and this co-aggregation is a major driver of arterial pathology and vascular smooth muscle cell
          loss.
        gene:
          preferred_term: NOTCH3
          description: Receptor whose extracellular domain aggregates into granular osmiophilic material
            (GOM) deposits, driving vascular smooth muscle cell loss and arteriopathy.
          term:
            id: hgnc:7883
            label: NOTCH3
        cell_types:
        - preferred_term: vascular associated smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        - preferred_term: pericyte
          term:
            id: CL:0000669
            label: pericyte
        biological_processes:
        - preferred_term: Notch signaling pathway
          term:
            id: GO:0007219
            label: Notch signaling pathway
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: wild-type Notch3ECD coaggregated with mutant Notch3ECD and that elimination of 1 copy
          of wild-type Notch3 in TgNotch3R169C was sufficient to attenuate Notch3ECD accumulation and
          arterial pathology. These findings suggest that Notch3ECD accumulation, involving mutant and
          wild-type NOTCH3, is a major driver of arterial SMC loss in CADASIL, paving the way for NOTCH3-lowering
          therapeutic strategies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38386425
      reference_title: Protein aggregates containing wild-type and mutant NOTCH3 are major drivers of
        arterial pathology in CADASIL.
      evidence_source: MODEL_ORGANISM
      explanation: This study demonstrates that wild-type and mutant NOTCH3 ECD co-aggregate, and that
        reducing wild-type NOTCH3 attenuates both ECD accumulation and arterial pathology in a mouse model,
        supporting aggregation-driven toxicity as a major disease mechanism.
