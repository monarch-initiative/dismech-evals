        description: HTRA1 controls TGF-beta bioavailability, but the direction of the change in disease
          is contested. CARASIL mutant proteins fail to repress TGF-beta family signalling and TGF-beta1
          accumulates in the tunica media of patient arteries; HTRA1 cleaves proTGF-beta1 in the endoplasmic
          reticulum; and HTRA1-null smooth muscle cells and a transgenic CARASIL mouse show increased
          SMAD2/3 signalling. Against this, HTRA1 also processes LTBP-1, and its loss attenuates TGF-beta
          signalling in fibroblasts, while carrier fibroblasts show no change in phospho-SMAD2/3. The
          node is therefore annotated as dysregulated rather than increased.
        cell_types:
        - preferred_term: vascular associated smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        biological_processes:
