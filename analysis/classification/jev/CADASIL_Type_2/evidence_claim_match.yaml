          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
          modifier: DYSREGULATED
      selected_evidence:
        snippet: HTRA1 binds and cleaves the pro-domain of proTGF-β1 in the endoplasmic reticulum (ER),
          and cleaved proTGF-β1 is degraded by ER-associated degradation.
        supports: SUPPORT
