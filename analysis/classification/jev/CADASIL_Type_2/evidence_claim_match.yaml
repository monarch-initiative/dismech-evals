        context: []
      assertion_type: AnimalModel
      assertion:
        name: Htra1 knockout mouse
        species: Mouse
        genotype: Htra1-/- (homozygous null)
        publication: PMID:34779414
        description: Htra1-null mice develop CARASIL-like cerebral arteriopathy with intimal thickening,
          abnormal elastic lamina, vasodilation and accumulation of matrisome proteins, with reduced arterial
          distensibility and cortical blood flow. Their smooth muscle cells fail to mature to the contractile
          phenotype. One study found normal cerebral arteries and an aortic phenotype in the same knockout,
          and no leukoencephalopathy on myelin stain.
        modeled_mechanisms:
        - target: Vascular Matrisome Protein Accumulation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Matrisome substrates accumulate in the thickened intima.
          limitations: Models the biallelic null state, so it informs CARASIL more than heterozygous disease,
            and mice lack the decades of vascular risk exposure that modify human penetrance.
        - target: Intimal Thickening of Cerebral Small Arteries
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Intimal thickening and abnormal elastic lamina in cerebral arteries.
          limitations: An independent study of the same knockout reported normal cerebral arteries, so
            the cerebral phenotype may depend on background or age.
        - target: Impaired Vascular Smooth Muscle Contractile Differentiation
          relationship: RECAPITULATES
          fidelity: UNKNOWN
          model_scale: CELLULAR
          description: Smooth muscle cells remain immature with impaired vasoconstriction.
          limitations: Shown partly in aortic and umbilical-artery smooth muscle rather than cerebral
            small arteries.
        - target: Reduced Cerebral Arterial Distensibility
          relationship: RECAPITULATES
          fidelity: UNKNOWN
          model_scale: TISSUE
          description: Reduced cerebral arterial distensibility and cortical blood flow.
          limitations: Not yet measured in patients, so fidelity to human disease is unknown.
      selected_evidence:
        snippet: 'Here, we show that HTRA1-/- mice exhibited features of CARASIL-associated arteriopathy:
          intimal thickening, abnormal elastic lamina, and vasodilation.'
        supports: SUPPORT
