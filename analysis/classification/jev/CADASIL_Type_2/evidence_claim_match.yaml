                type 2
        context: []
      assertion_type: Genetic
      assertion:
        name: HTRA1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: HTRA1
          term:
            id: hgnc:9476
            label: HTRA1
        notes: Heterozygous disease alleles include missense variants such as p.R166L, p.G283E, p.P285L,
          p.R302Q and p.T319I, and nonsense or frameshift variants that undergo nonsense-mediated decay.
          Heterozygous missense variants cluster in the linker region and the loop 3/loop D activation
          domains, whereas CARASIL missense variants lie more often elsewhere in the protease domain.
          The same allele can cause CARASIL when homozygous and HTRA1-CSVD when heterozygous (p.P275L,
          p.A252T). Not every rare missense variant is pathogenic; protease activity, trimer formation
          and segregation are used to establish pathogenicity. The local ClinGen cache holds no gene-disease
          validity record for HTRA1, so no validity tier is recorded.
      selected_evidence:
        snippet: Sequence analysis revealed two nonsense mutations and two missense mutations in HTRA1.
        supports: SUPPORT
