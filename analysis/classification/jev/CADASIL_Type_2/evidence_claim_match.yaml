          variant, usually on a small vessel disease gene panel or exome after NOTCH3. Because not every
          rare missense variant is pathogenic, protease activity, trimer formation and segregation are
          assessed for novel missense variants, and mRNA analysis can confirm decay of truncating alleles.
        diagnosis_term:
