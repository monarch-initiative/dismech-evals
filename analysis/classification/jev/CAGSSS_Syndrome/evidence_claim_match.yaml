      assertion_type: Treatment
      assertion:
        name: Corneal Transplantation
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: corneal transplantation
          term:
            id: NCIT:C210959
            label: Corneal Transplantation
        description: 'Curated principally as a failure, because that is the informative part. One patient''s
          graft was rejected at 30, and the most fully described adult was referred with multiple failed
          grafts and severe eye dryness. That pattern is mechanistically coherent rather than bad luck:
          a cornea denervated by the syndrome''s sensory neuropathy does not heal, which is what neurotrophic
          keratitis means, and grafting into it repeats the problem. A CAGSSS patient facing corneal grafting
          should be counselled with that in front of them.'
        target_phenotypes:
        - preferred_term: Corneal opacity
          term:
            id: HP:0007957
            label: Corneal opacity
        notes: The link from sensory neuropathy to graft failure via corneal denervation is this entry's
          inference. Neither source states it; what they report is neurotrophic keratitis in one patient
          and repeated graft failure in two.
      selected_evidence:
        snippet: A 33-year-old woman known for infantile cataracts, growth hormone deficiency, sensory
          neuropathy, sensorineural hearing loss, and skeletal dysplasia was referred to us for multiple
          failed corneal grafts and severe eye dryness.
        supports: REFUTE
