        prompt: Is CAGSSS a distinct entity, or a named region of a continuous IARS2 phenotypic spectrum?
        attaches_to:
        - disease#CAGSSS Syndrome
        - genetic#IARS2
        rationale: 'The acronym was coined for a recognisable combination in one consanguineous family,
          and a second homozygous patient was published under the title "Confirmation of CAGSSS syndrome
          as a distinct entity". But the same gene, biallelically, gives Leigh and West syndrome at one
          end and non-syndromic cataract at the other, with cataract-plus-skeletal-dysplasia in between
          and no reported genotype rule separating them. Within CAGSSS itself the features accumulate
          over years and at least one named component - growth hormone deficiency - can be absent in a
          patient the literature counts as having the syndrome.

          This matters for curation rather than only for nosology. If CAGSSS is a region of a spectrum,
          then a future dismech entry for IARS2-related disease would supersede this one, and this entry''s
          MONDO term would become a subtype anchor. It is curated as its own entry because MONDO carries
          a term for it and the clinical combination is recognisable, and this discussion records that
          the boundary is not established.'
      selected_evidence:
        snippet: Our findings support that even though biallelic IARS2 pathogenic variants can result
          in a distinctive, clinically recognisable phenotype in humans, it can also show a wide range
          of clinical presentation from severe pediatric neurological disorders of Leigh and West syndrome
          to both non-syndromic cataract and cataract accompanied by skeletal dysplasia.
        supports: SUPPORT
