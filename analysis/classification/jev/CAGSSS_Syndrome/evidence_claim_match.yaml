      reference_title: Mutation in the nuclear-encoded mitochondrial isoleucyl-tRNA synthetase IARS2 in
        patients with cataracts, growth hormone deficiency with short stature, partial sensorineural deafness,
        and peripheral neuropathy or with Leigh syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: The founding variant and how it was identified.
