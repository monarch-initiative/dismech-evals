          term:
            id: HP:0004322
            label: Short stature
        notes: 'The bound term is HP:0004322 Short stature, which is the observation the sources report.
          HPO has no general "growth hormone deficiency" term: the two candidates, HP:0000824 (Decreased
          response to growth hormone stimulation test) and HP:0034323 (Reduced circulating growth hormone
          concentration), each assert a specific measurement that no cited source reports. The endocrine
          attribution is therefore carried in preferred_term and in this description rather than bound
          to a term that would over-claim.'
      selected_evidence:
        snippet: Here, we report a novel disorder in three adult patients with a phenotype including cataracts,
          short-stature secondary to growth hormone deficiency, sensorineural hearing deficit, peripheral
          sensory neuropathy, and skeletal dysplasia.
        supports: SUPPORT
