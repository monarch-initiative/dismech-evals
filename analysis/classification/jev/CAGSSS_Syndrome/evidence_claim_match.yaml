                dysplasia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Combined Oxidative Phosphorylation Deficiency
        biological_scale: CELLULAR
        description: 'The step that the intuitive model predicts, and that has been demonstrated - but
          at the severe end of the IARS2 spectrum rather than in CAGSSS. Lymphocytes from two children
          with biallelic IARS2 variants and Leigh syndrome showed impaired mitochondrial function from
          severe complex I and III deficiency, reproduced in IARS2-knockdown HEK293T cells, and re-expressing
          wild-type but not mutant IARS2 rescued the complex deficiency, oxygen consumption and ATP content.

          This node is included because it is the best available account of how an IARS2 defect damages
          a cell, and it is marked INDIRECT for this entry throughout because the alleles tested cause
          Leigh syndrome, not CAGSSS, and the one CAGSSS-range patient assayed the same way had normal
          respiratory chain activity.'
        biological_processes:
        - preferred_term: oxidative phosphorylation
          modifier: DECREASED
          term:
            id: GO:0006119
            label: oxidative phosphorylation
      selected_evidence:
        snippet: Mutations in genes encoding ARSs can produce highly diverse clinical phenotypes that
          affect tissues with particularly high metabolic needs
        supports: SUPPORT
        directness: INDIRECT
