        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: The core series comprises homozygous Pro909Leu (three relatives), Pro909Ser (one), His761Arg
          (two sisters) and Gly874Arg (one). Their position near the anticodon-binding region is a small-series
          association, with domain boundaries varying between annotations. Broader disease includes compound
          heterozygous missense, nonsense, frameshift and intragenic deletion alleles. A truncating allele
          can also occur with an isolated-cataract presentation; variant class alone is not a reliable
          severity rule.
      selected_evidence:
        snippet: 'the mutations c.2446C > T; p.(Arg816*) and c.2575 T > C; p.(Phe859Leu) were identified
          in two affected brothers in family #10, both of which had bilateral cataracts without other
          anomalies.'
        supports: SUPPORT
        directness: DIRECT
