        prompt: Which allele- and tissue-dependent consequences of IARS2 dysfunction produce core CAGSSS
          despite normal fibroblast respiratory and translation assays?
        attaches_to:
        - pathophysiology#Impaired Mitochondrial Isoleucyl-tRNA Charging
        - pathophysiology#Reduced Respiratory Complex Abundance
        rationale: Core Pro909Leu and Pro909Ser fibroblast results differ in protein abundance, while
          neither demonstrates the Leigh lymphocyte respiratory-complex phenotype. ClinGen also summarizes
          normal translation in the founding line. The 2024 study analyzed lymphocytes from only one of
          its two Leigh patients, and performed rescue in HEK293T knockdown cells. It measured complex
          content, oxygen consumption and ATP, without directly measuring charging or translation. Normal
          biochemical findings also occur in broader severe IARS2 presentations. Allele severity, cell
          context, compensation and tissue-specific vulnerability remain possible explanations; the available
          comparisons do not isolate them.
