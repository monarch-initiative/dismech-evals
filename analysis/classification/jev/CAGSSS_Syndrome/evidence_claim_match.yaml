              loss-skeletal dysplasia syndrome
            term:
              id: MONDO:0014455
              label: cataract-growth hormone deficiency-sensory neuropathy-sensorineural hearing loss-skeletal
                dysplasia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic IARS2 Variants
        biological_scale: MOLECULAR
        description: Biallelic variants in IARS2, a nuclear gene. The founding family carried a homozygous
          missense change at a conserved residue; the Danish patient a different homozygous missense allele,
          p.Gly874Arg; two Iranian probands further homozygous missense alleles, p.Pro909Ser and p.His761Arg.
          Compound heterozygous alleles in the same gene were found independently in a patient with a
          more severe phenotype diagnosed as Leigh syndrome.
        genes:
        - preferred_term: IARS2
          term:
            id: hgnc:29685
            label: IARS2
        genetic_context:
          allele_type: missense
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: UNKNOWN
          description: Recorded UNKNOWN rather than LOSS_OF_FUNCTION on purpose. The founding family's
            variant reduced IARS2 protein in cultured skin cells, which reads as loss of function, but
            a later patient's fibroblasts showed unchanged IARS2 levels and normal respiratory chain activity.
            No aminoacylation assay on any patient allele has been reported, so the functional consequence
            is inferred from the gene's job rather than measured.
      selected_evidence:
        snippet: Using SNP genotyping and whole-exome sequencing, we identified a single likely causal
          variant, a missense mutation in a conserved residue of the nuclear gene IARS2, encoding mitochondrial
          isoleucyl-tRNA synthetase.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
