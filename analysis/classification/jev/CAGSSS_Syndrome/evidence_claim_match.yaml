  545972f11e9b9e67ea40bee22737b5859039f44cf461b9e8c3e527aa2bdd53bc:
    claim:
      about:
        disease:
          name: CAGSSS Syndrome
          disease_term:
            preferred_term: cataract-growth hormone deficiency-sensory neuropathy-sensorineural hearing
              loss-skeletal dysplasia syndrome
            term:
              id: MONDO:0014455
              label: cataract-growth hormone deficiency-sensory neuropathy-sensorineural hearing loss-skeletal
                dysplasia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Combined Oxidative Phosphorylation Deficiency
        biological_scale: CELLULAR
        description: 'The step that the intuitive model predicts, and that has been demonstrated - but
          at the severe end of the IARS2 spectrum rather than in CAGSSS. Lymphocytes from two children
          with biallelic IARS2 variants and Leigh syndrome showed impaired mitochondrial function from
          severe complex I and III deficiency, reproduced in IARS2-knockdown HEK293T cells, and re-expressing
          wild-type but not mutant IARS2 rescued the complex deficiency, oxygen consumption and ATP content.

          This node is included because it is the best available account of how an IARS2 defect damages
          a cell, and it is marked INDIRECT for this entry throughout because the alleles tested cause
          Leigh syndrome, not CAGSSS, and the one CAGSSS-range patient assayed the same way had normal
          respiratory chain activity.'
        biological_processes:
        - preferred_term: oxidative phosphorylation
          modifier: DECREASED
          term:
            id: GO:0006119
            label: oxidative phosphorylation
      selected_evidence:
        snippet: Functional studies revealed that the patient-derived lymphocytes carrying c.1_390del
          and c.2450G > A variants exhibited impaired mitochondrial function due to severe mitochondrial
          complexes I and III deficiencies, which was also found in IARS2-knockdown HEK293T cells.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39169373
      reference_title: IARS2 mutations lead to Leigh syndrome with a combined oxidative phosphorylation
        deficiency.
      evidence_source: IN_VITRO
      explanation: The measured respiratory chain deficiency. Graded INDIRECT because the patients carry
        Leigh-syndrome alleles rather than CAGSSS alleles, so applying it to this entry is an inference
        across the allelic spectrum.
