  696e081799dd643d45986a0f1f2b684fc2b3ef74d2fc97ee9cac02a917a2daeb:
    claim:
      about:
        disease:
          name: CAGSSS Syndrome
          disease_term:
            preferred_term: cataract-growth hormone deficiency-sensory neuropathy-sensorineural hearing
              loss-skeletal dysplasia syndrome
            term:
              id: MONDO:0014455
              label: cataract-growth hormone deficiency-sensory neuropathy-sensorineural hearing loss-skeletal
                dysplasia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mitochondrial Isoleucyl-tRNA Charging
        biological_scale: MOLECULAR
        description: IARS2 is a nuclear-encoded, highly conserved enzyme that charges mitochondrial tRNA
          with its cognate amino acid for translation. A defect here degrades the supply of charged tRNA-Ile
          to the mitochondrial ribosome, so the affected process is mitochondrial protein synthesis as
          a whole rather than any one respiratory complex. Note that no patient allele has had its aminoacylation
          activity measured; this node states the enzyme's established role and the class of defect a
          pathogenic variant in it produces.
        molecular_functions:
        - preferred_term: isoleucine-tRNA ligase activity
          modifier: DECREASED
          term:
            id: GO:0004822
            label: isoleucine-tRNA ligase activity
        biological_processes:
        - preferred_term: mitochondrial translation
          modifier: DECREASED
          term:
            id: GO:0032543
            label: mitochondrial translation
        notes: 'The causal link out of this node is INDIRECT_KNOWN_INTERMEDIATES, not DIRECT: the route
          from a charging defect to a respiratory chain deficiency runs through mitochondrial translation
          and OXPHOS subunit synthesis, which are known steps that this entry does not curate as separate
          nodes. The tissue-selectivity problem is a separate matter and belongs to the edge out of the
          OXPHOS node, where it is recorded.'
      selected_evidence:
        snippet: IARS2 encodes a mitochondrial isoleucyl-tRNA synthetase, a highly conserved nuclear-encoded
          enzyme required for the charging of tRNAs with their cognate amino acid for translation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30419932
      reference_title: Expanding the clinical phenotype of IARS2-related mitochondrial disease.
      evidence_source: OTHER
      explanation: The enzyme's function, which is the whole basis for the mechanism claim in this node.
        Graded OTHER because it is a statement of established gene function rather than a result from
        the study's own patients.
