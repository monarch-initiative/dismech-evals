  61ac99731b13da044276ee10f824659a1100724f7857ec8cd356f0fbef4b396d:
    claim:
      about:
        disease:
          name: CAGSSS Syndrome
          disease_term:
            preferred_term: cataract-growth hormone deficiency-sensory neuropathy-sensorineural hearing
              loss-skeletal dysplasia syndrome
            term:
              id: MONDO:0014455
              label: cataract-growth hormone deficiency-sensory neuropathy-sensorineural hearing loss-skeletal
                dysplasia syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cagsss_mechanism_not_established
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does a defect in mitochondrial isoleucyl-tRNA charging produce cataract, growth hormone
          deficiency, sensory neuropathy, hearing loss and skeletal dysplasia, when patient fibroblasts
          show no respiratory chain deficiency?
        attaches_to:
        - pathophysiology#Impaired Mitochondrial Isoleucyl-tRNA Charging
        - pathophysiology#Multisystem Tissue Dysfunction
        rationale: 'The expected chain - impaired mitochondrial translation, fewer OXPHOS subunits, reduced
          respiratory chain activity, tissue dysfunction - has now been demonstrated, but not in this
          disease. Lymphocytes from two children with biallelic IARS2 variants and *Leigh syndrome* showed
          severe complex I and III deficiency, the same defect appeared in IARS2-knockdown cells, and
          re-expressing wild-type IARS2 rescued it while mutant IARS2 did not. That is a clean causal
          demonstration, and the alleles it used are the severe ones.

          The one CAGSSS-range patient assayed comparably gave the opposite result: fibroblasts with normal
          respiratory chain enzyme activity, unchanged oxidative phosphorylation subunits, and unchanged
          IARS2 levels. And the founding family gives a third answer again - reduced IARS2 protein in
          cultured skin cells.

          So the question is not whether IARS2 loss can cause OXPHOS deficiency; it is whether CAGSSS
          is the same mechanism running at lower amplitude, or something else. Three readings fit the
          published data and none is excluded: an allele-severity threshold, with CAGSSS alleles retaining
          enough activity that fibroblasts compensate; a cell-type effect, with fibroblasts being the
          wrong cell to look in and lymphocytes or an affected tissue being the right one; or a genuinely
          different mechanism at the milder end. The comparison is confounded on both axes at once - the
          two studies differ in allele *and* in cell type - so nothing published separates them.

          What would: an aminoacylation assay on the CAGSSS alleles specifically, which nobody has reported
          for any IARS2 allele; the same respiratory chain panel run on CAGSSS-patient lymphocytes, which
          would hold cell type constant across the severity range; and an account of tissue selectivity,
          since lens, pituitary, cochlea, sensory nerve and growth plate are an unusual set even granting
          that aminoacyl-tRNA synthetase disorders hit tissues with high metabolic demand.'
      selected_evidence:
        snippet: Functional studies revealed that the patient-derived lymphocytes carrying c.1_390del
          and c.2450G > A variants exhibited impaired mitochondrial function due to severe mitochondrial
          complexes I and III deficiencies, which was also found in IARS2-knockdown HEK293T cells.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39169373
      reference_title: IARS2 mutations lead to Leigh syndrome with a combined oxidative phosphorylation
        deficiency.
      evidence_source: IN_VITRO
      explanation: 'The opposite result, in different cells and from more severe alleles. Curated beside
        the refutation because the pair is the gap: same gene, two cellular verdicts, and the study design
        varies allele and cell type together so neither can be isolated.'
