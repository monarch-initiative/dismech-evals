                dysplasia syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cagsss_entity_boundary
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is CAGSSS a distinct entity, or a named region of a continuous IARS2 phenotypic spectrum?
        attaches_to:
        - disease#CAGSSS Syndrome
        - genetic#IARS2
        rationale: CAGSSS remains a useful named phenotype with its own MONDO anchor, and this entry focuses
          on that clinical presentation. ClinGen evaluated the broader gene-disease relationship as definitive
          in December 2024 and explicitly grouped CAGSSS and Leigh-spectrum presentations as IARS2-related
          primary mitochondrial disease. This classification supports a shared gene-level entity without
          establishing identical cellular defects, penetrance or management needs across presentations.
          The seven-person core series, Leigh/West overlap cases, anemia-predominant disease and isolated
          cataract should therefore retain explicit ascertainment and phenotype boundaries. Domain-based
          genotype associations remain provisional.
      selected_evidence:
        snippet: Our findings support that even though biallelic IARS2 pathogenic variants can result
          in a distinctive, clinically recognisable phenotype in humans, it can also show a wide range
          of clinical presentation from severe pediatric neurological disorders of Leigh and West syndrome
          to both non-syndromic cataract and cataract accompanied by skeletal dysplasia.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30419932
      reference_title: Expanding the clinical phenotype of IARS2-related mitochondrial disease.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Both halves of the question in one sentence: a distinctive recognisable phenotype,
        and a spectrum it sits inside.'
      quote_role: PRIMARY_RESULT
