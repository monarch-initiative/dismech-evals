        description: SCYL1 deficiency disrupts COPI-coated vesicle-mediated retrograde transport from
          the Golgi to the endoplasmic reticulum and alters Golgi organization. Mechanistic cell-biology
          work shows that the mTORC1-controlled phosphorylation status of SCYL1 (Ser754) regulates Golgi
          architecture, endolysosomal distribution, and extracellular vesicle secretion, and that loss-of-function
          of SCYL1 underlies CALFAN syndrome.
        role: INTERMEDIATE
