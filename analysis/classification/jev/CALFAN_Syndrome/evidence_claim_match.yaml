        gene_term:
          preferred_term: SCYL1
          term:
            id: hgnc:14372
            label: SCYL1
        association: Causal gene; biallelic loss-of-function variants cause CALFAN syndrome
        notes: SCYL1 (SCY1-like pseudokinase 1) on chromosome 11q13.1 encodes an N-terminal kinase-like
          protein that functions in COPI-mediated retrograde Golgi-to-ER vesicular trafficking. Reported
          pathogenic variants are predominantly truncating (nonsense/frameshift), consistent with a loss-of-function
          mechanism. Many reported cases occur in consanguineous families (homozygous), though compound
          heterozygosity also occurs.
      selected_evidence:
        snippet: Biallelic mutations in SCYL1 were recently identified as causing a syndromal disorder
          characterized by peripheral neuropathy, cerebellar atrophy, ataxia, and recurrent episodes of
          liver failure.
        supports: SUPPORT
