          name: CAMLG-CDG
          disease_term:
            preferred_term: CAMLG-CDG
            term:
              id: MONDO:0859357
              label: congenital disorder of glycosylation, type IIz
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: camlg_how_does_trc_failure_injure_the_brain
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What connects altered tail-anchored protein handling to neurological impairment in CAMLG-CDG,
          and is the glycosylation defect causal or a parallel consequence?
        attaches_to:
        - pathophysiology#Impaired TRC-Mediated Tail-Anchored Protein Insertion
        - pathophysiology#Core 1 O-Glycan Hyposialylation
        - pathophysiology#Altered Lysosomal Cargo Trafficking
        - pathophysiology#Lysosomal Membrane Damage
        - pathophysiology#Spinal Motor Neuron Loss
        rationale: The 2022 patient study measured splicing, protein abundance, SNARE localization and
          glycosylation, but did not connect them experimentally to neurological impairment. A 2025 study
          showed motor-neuron loss after neuron-specific Caml deletion, alongside trafficking and lysosomal
          abnormalities measured mainly in mouse fibroblasts. Partially depleted cortical cultures retained
          normal neurite growth. These results support a neuronal requirement for CAML while leaving the
          relevant substrates, cell types and causal order unresolved. Glycosylation, lysosomal damage
          and altered trafficking could be interacting or parallel consequences; rescue experiments are
          needed to distinguish them.
        proposed_experiments:
        - experiment_id: exp_camlg_neuronal_model
          name: TRC pathway failure in a human neuronal model
          description: Use isogenic patient-variant and corrected human neuronal cultures, including spinal
            motor neurons, to compare TA-protein localization, glycosylation, lysosomal cargo handling
            and survival. Independently restore CAML, selected SNAREs or glycosylation to test which abnormalities
            mediate neuronal injury.
          would_support:
          - pathophysiology#Spinal Motor Neuron Loss
          supporting_outcome:
          - Variant-dependent neuronal injury and molecular abnormalities are reversed by allele correction;
            selective downstream rescue identifies a necessary intermediate.
          refuting_outcome:
          - Adequate variant expression and assay sensitivity are confirmed, but neuronal phenotypes do
            not differ from corrected controls, or correction of the proposed intermediate fails to improve
            survival.
      selected_evidence:
        snippet: There were 8 times more cells with positive galectin-3 puncta in Caml null MEFs than
          in their wildtype counterpart
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
