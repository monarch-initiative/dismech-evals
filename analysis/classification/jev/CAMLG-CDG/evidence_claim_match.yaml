      assertion_type: Pathophysiology
      assertion:
        name: Defective Terminal Sialylation in the Late Golgi
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: 'The glycosylation abnormality in this disease is specifically one of terminal sialic
          acid addition, not of glycan initiation or of core processing. In fibroblasts, peanut agglutinin
          - which binds the Gal-beta(1-3)-GalNAc core 1 O-glycan only while it is unsialylated - gives
          a strong signal that is barely detectable in controls, while Vicia villosa lectin, which reports
          on the GalNAc initiation step, is unchanged. Established fibroblast markers of N-glycan hypoglycosylation
          (LAMP1, LAMP2, ICAM-1) were normal.

          Sialyltransferases act in the trans-Golgi, so a sialylation-restricted defect localises the
          lesion to the late Golgi.'
        biological_processes:
        - preferred_term: protein sialylation
          term:
            id: GO:1990743
            label: protein sialylation
          modifier: DECREASED
      selected_evidence:
        snippet: This demonstrates that the defect only affects the sialylation of core 1 O-glycans rather
          than the initiation process with the transfer of GalNAc and galactose.
        supports: SUPPORT
