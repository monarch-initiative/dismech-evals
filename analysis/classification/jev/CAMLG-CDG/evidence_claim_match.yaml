        notes: 'CAMLG encodes CAML, the ER membrane protein that pairs with GET1/WRB to form the receptor
          at the end of the TRC pathway; the protein is also called GET2 in the trafficking literature,
          and papers on the pathway may use either name. One allele is known in human disease: homozygous
          c.633 + 4A>G (NM_001745.4), causing exon 2 skipping. Nothing can be said about the mutational
          spectrum from one family.

          ClinGen''s Congenital Disorders of Glycosylation Gene Curation Expert Panel classified the CAMLG-CDG
          gene-disease relationship as Limited in September 2024, on one proband in one publication plus
          experimental and model-organism support. Limited is not a negative assertion - it is what a
          correct gene looks like when only one family has been published - but it does mean a CAMLG variant
          reported on a diagnostic panel should be interpreted against a gene-disease relationship that
          is not yet definitive.'
