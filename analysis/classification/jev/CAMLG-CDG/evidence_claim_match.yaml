            term:
              id: MONDO:0859357
              label: congenital disorder of glycosylation, type IIz
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neurodevelopmental Failure in TRC Pathway Deficiency
        biological_scale: ORGANISM
        mechanism_confidence: HYPOTHETICAL
        description: 'The clinical phenotype of CAMLG-CDG is neurological, progressive, and unexplained.
          Nothing published traces a route from the tail-anchored protein insertion defect, or from the
          hyposialylation it produces, to the developmental arrest, epilepsy, spasticity and brain atrophy
          that the child has. This node exists so that the clinical features hang off a mechanistic statement
          rather than floating free of the pathograph, and it is marked hypothetical because that is what
          it is.

          Two observations bound the speculation. The phenotype is shared almost feature for feature with
          GET4-CDG, a defect at a different point in the same pathway, which argues that it is a property
          of the pathway rather than of CAML specifically. And GET3-CDG, also in the same pathway, presents
          instead as fatal infantile cardiomyopathy, which argues that the tissue affected is not determined
          by the pathway alone.'
      selected_evidence:
        snippet: Clinical features were similar to those in one of the two other described TRC pathway
          disorder (GET4 deficiency; (9)) and were largely neurological, consisting of severe DD/ID, seizures,
          hypotonia, limb contractures and structural brain abnormalities.
        supports: SUPPORT
