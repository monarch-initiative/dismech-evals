          Human WRB and CAML together rescue targeting in yeast lacking Get1/Get2, supporting conserved
          receptor function. The CAMLG-CDG fibroblast localization findings support a selective insertion
          defect, but no direct insertion assay was performed for c.633+4A>G. Normal localization of emerin,
          VAMP7 and VAPB argues against failure of all substrates; residual receptor activity and alternative
          insertion pathways remain possible explanations.
