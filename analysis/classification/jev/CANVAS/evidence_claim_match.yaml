        - path: /discussions/0
          value:
            discussion_id: canvas_mechanism_unresolved
            kind: KNOWLEDGE_GAP
            status: OPEN
            prompt: How does a biallelic intronic repeat expansion cause selective degeneration of sensory
              ganglion and Purkinje neurons when it does not reduce RFC1 expression?
            attaches_to:
            - pathophysiology#Repeat-Intrinsic Nucleic Acid Structural Toxicity
            rationale: This is the central unresolved question of the disorder. The original patient-tissue
              work found RFC1 expression unaffected in peripheral and brain tissue, which removes the
              obvious loss-of-function explanation. In vitro structural work shows the pathogenic motif
              forms G-quadruplexes that stall replication, but it is not obvious why a replication-associated
              mechanism would selectively kill post-mitotic neurons, nor why it targets sensory ganglia
              and Purkinje cells specifically while sparing the adjacent auditory ganglion. The exquisite
              selectivity of the cell loss is itself the strongest constraint on any candidate mechanism.
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: canvas_replication_independent_toxicity
        name: Replication-independent repeat toxicity assay
        description: 'Determine whether the repeat produces R-loops in post-mitotic neurons, which would
          provide a route to toxicity that does not require DNA replication. The RNA-foci arm of this
          question is deliberately excluded: Cortese et al. already looked for sense and antisense repeat
          foci in patient brain and did not find them, which narrows the search rather than leaving it
          open.'
        decision_criterion: Detection of R-loops in non-dividing neurons would resolve the paradox of
          a replication-associated gene causing post-mitotic neuronal death; their absence would, together
          with the published negative foci result, argue against the whole class of RNA-mediated toxicity
          models.
      selected_evidence:
        snippet: We did not observe in patient brains the presence of RNA foci of either the sense or
          antisense repeated unit.
        supports: SUPPORT
