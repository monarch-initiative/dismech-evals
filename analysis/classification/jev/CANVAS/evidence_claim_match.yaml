        description: The clinically defining feature of CANVAS is that all three systems used to stabilise
          posture and gaze — proprioception, vestibular input, and cerebellar processing — fail together.
          Because each system normally compensates for loss of the others, their simultaneous failure
          produces imbalance disproportionate to any single deficit. This triple-deafferentation is why
          CANVAS causes greater disability than an isolated sensory neuronopathy, isolated vestibulopathy,
          or isolated cerebellar degeneration of comparable individual severity.
