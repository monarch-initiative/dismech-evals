              id: MONDO:0044720
              label: cerebellar ataxia with neuropathy and bilateral vestibular areflexia syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: RFC1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: RFC1
          term:
            id: hgnc:9969
            label: RFC1
        notes: 'RFC1 encodes the large subunit of the replication factor C clamp-loader complex, which
          loads PCNA onto DNA. The pathogenic lesion is predominantly not a coding mutation but a biallelic
          expansion of a pentanucleotide repeat in intron 2, within the poly(A) tail of an AluSx3 element;
          truncating RFC1 point variants in trans with an expanded allele have also been reported, so
          the allelic spectrum is not purely repeat-based. Multiple pathogenic motifs exist and are population-structured:
          (AAGGG)n predominates in European populations, (ACAGG)n in Asia-Pacific populations, and a compound
          (AAAGG)10-25(AAGGG)exp configuration is a founder allele in New Zealand Maori and Cook Island
          Maori individuals. This motif heterogeneity has direct diagnostic consequences, because a repeat-primed
          PCR assay designed only for AAGGG will miss the other configurations.'
      selected_evidence:
        snippet: We used non-parametric linkage analysis and genome sequencing to identify a biallelic
          intronic AAGGG repeat expansion in the replication factor C subunit 1 (RFC1) gene as the cause
          of familial CANVAS and a frequent cause of late-onset ataxia, particularly if sensory neuronopathy
          and bilateral vestibular areflexia coexist.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
