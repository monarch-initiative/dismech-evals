      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: repeat_structural_toxicity
        hypothesis_label: Repeat-intrinsic G-quadruplex structural toxicity
        status: EMERGING
        description: The pathogenic repeat motifs, but not the benign reference motif, fold into parallel
          G-quadruplex structures in both DNA and RNA. These structures stall DNA replication and impair
          gene expression in a repeat-length-dependent manner, offering a mechanism that is intrinsic
          to the expanded nucleic acid rather than dependent on loss of RFC1 protein. This would also
          explain why the disorder is not a classical misfolding or polyglutamine repeat disease.
      selected_evidence:
        snippet: The pathogenic AAGGG repeats, but not the nonpathogenic AAAAG repeats, form G4 structures
          to stall DNA replication and reduce gene expression via impairing the translation process in
          a repeat-length-dependent manner.
        supports: SUPPORT
    origin:
