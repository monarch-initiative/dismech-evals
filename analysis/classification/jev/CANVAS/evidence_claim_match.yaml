        proposed_experiments:
        - experiment_id: canvas_ganglion_resolved_rfc1_expression
          name: Ganglion-resolved RFC1 expression comparison
          description: Compare RFC1 transcript and protein levels directly in affected dorsal root and
            vestibular ganglion neurons versus the spared auditory ganglion from the same donors, to test
            whether a cell-type-restricted loss of function explains the selectivity that bulk-tissue
            measurement missed.
          decision_criterion: A reduction confined to affected ganglia would revive a loss-of-function
            model; equal levels across affected and spared ganglia would further favour a repeat-intrinsic
            mechanism.
        - experiment_id: canvas_g4_modulation_sensory_neurons
          name: G-quadruplex modulation in patient-derived sensory neurons
          description: Test whether G-quadruplex-stabilising or -resolving interventions modify neuronal
            phenotypes in patient-derived sensory neurons.
          decision_criterion: Phenotype rescue by G4 resolution would support the structural-toxicity
            hypothesis and nominate a druggable target.
