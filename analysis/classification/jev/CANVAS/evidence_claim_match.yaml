          reflex, with preserved audiometric function — a dissociation that reflects the sparing of the
          auditory ganglion. At the bedside the visually enhanced VOR (VVOR) is the most useful manoeuvre,
          because it tests vestibular, visual, and cerebellar contributions to gaze stabilisation together
          and is therefore abnormal in CANVAS when a single-system test might not be. Head-impulse testing
          and oculomotor examination for nystagmus complete the assessment.
      selected_evidence:
        snippet: cerebellar, somatosensory, and selective vestibular impairment with normal hearing
        supports: SUPPORT
