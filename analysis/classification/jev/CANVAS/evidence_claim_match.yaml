        context:
        - path: /pathophysiology/8
          value:
            name: Multisensory Balance Failure
            biological_scale: ORGANISM
            description: The clinically defining feature of CANVAS is that all three systems used to stabilise
              posture and gaze — proprioception, vestibular input, and cerebellar processing — fail together.
              Because each system normally compensates for loss of the others, their simultaneous failure
              produces imbalance disproportionate to any single deficit. This triple-deafferentation is
              why CANVAS causes greater disability than an isolated sensory neuronopathy, isolated vestibulopathy,
              or isolated cerebellar degeneration of comparable individual severity.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Progressive gait imbalance and falls
        description: Loss of all three balance channels produces progressive unsteadiness and a high falls
          risk, the dominant source of disability.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: an adult-onset recessively-inherited ataxia, characterized by progressive imbalance
        supports: SUPPORT
