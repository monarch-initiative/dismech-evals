      assertion_type: Diagnosis
      assertion:
        name: Targeted RFC1 repeat expansion testing
        description: 'Molecular diagnosis requires testing specifically targeted to the intronic repeat,
          such as repeat-primed and flanking PCR or long-read sequencing. This is the single most important
          diagnostic point in the disorder: the expansion is intronic and absent from the reference genome,
          so exome sequencing and sequence-based gene panels do not detect it, and a negative panel does
          not exclude the diagnosis. Assay design must also account for motif heterogeneity, because an
          assay built only for AAGGG will miss ACAGG and the Maori configuration.'
      selected_evidence:
        snippet: Note that pathogenic RFC1 AAGGG repeat expansions cannot be detected by sequence-based
          multigene panels or exome sequencing.
        supports: SUPPORT
