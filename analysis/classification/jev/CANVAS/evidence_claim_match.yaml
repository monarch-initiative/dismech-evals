        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: intron2_retention_rna_processing
        hypothesis_label: RFC1 intron 2 retention and aberrant pre-mRNA processing
        status: EMERGING
        description: qRT-PCR in patient tissue shows a consistent increase in retention of intron 2 —
          the repeat-hosting intron — in RFC1 pre-mRNA, without evidence of sense or antisense RNA foci.
          Intron retention at a GC-rich repeat-hosting intron is a mechanism shared with other disease-causing
          GC-rich intronic expansions (myotonic dystrophy type 2, C9orf72-ALS/FTD), distinct from both
          the loss-of-function and the G-quadruplex structural-toxicity hypotheses, and offers a route
          to a transcript-specific, tissue-variable effect that bulk mRNA/protein quantification would
          miss.
      selected_evidence:
        snippet: Retention of the repeat-hosting intron was recently identified as a common event associated
          with other disease-causing guanine-cytosine-rich intronic expansions, such as in myotonic dystrophy
          type 2 and C9orf72-amyotrophic lateral sclerosis/FTD but not AT-rich repeat expansions such
          as in FRDA
        supports: SUPPORT
    origin:
