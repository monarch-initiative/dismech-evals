        notes: 'ADNIV is extremely rare; the founding report described three kindreds, and fewer than
          a dozen distinct pathogenic-variant families have been published to date worldwide. No population-based
          prevalence or incidence study (Orphanet/GBD) was identified. The variants reported in the founding
          kindreds were absent from dbSNP and 1000 Genomes, but later-reported variants appear at low
          allele frequencies in population reference databases: G267S at 0.023% (European) and 0.047%
          (Finnish) in ExAC, and G376S at 0.017% (South Asian) in ExAC -- the latter equating to a carrier
          rate of about 1 in 6,000 in that population, most of whom would be expected to have subclinical
          or differently diagnosed disease.'
