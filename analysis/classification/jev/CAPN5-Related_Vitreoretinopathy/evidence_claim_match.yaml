              label: CAPN5-related vitreoretinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Photoreceptor Synaptic Proteolysis
        description: Hyperactive, mislocalized calpain-5 is hypothesized to aberrantly proteolyze substrates
          at the retinal ribbon synapse in the retina's naturally high-calcium phototransduction environment;
          the specific protein substrates of calpain-5 have not been identified. Vitreous proteomics of
          CAPN5-NIV patients shows early loss of synaptic proteins including neurexin-2, glutamate receptor
          4 (a receptor expressed in rod bipolar cells), and neurofascin. The proteomic analysis could
          not differentiate which retinal cells are affected by these losses, which may contribute to
          the synaptic signaling defect -- reduced ERG b-wave amplitude -- seen in early disease.
        role: central_effector
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        cell_types:
        - preferred_term: Photoreceptor Cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        biological_processes:
        - preferred_term: Proteolysis
          term:
            id: GO:0006508
            label: proteolysis
          modifier: INCREASED
      selected_evidence:
        snippet: However, our proteomic analysis could not differentiate which retinal cells are affected
          by loss of these proteins in CAPN5-NIV
        supports: NO_EVIDENCE
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31110225
      reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Explicit caveat from the same proteomic study: the retinal cell type(s) losing these
        synaptic proteins could not be determined, so a photoreceptor-specific attribution is not established.
        Recorded as NO_EVIDENCE because the sentence carries no evidence bearing on whether the proteolysis
        is photoreceptor-specific; it bounds the node''s photoreceptor cell-type binding rather than asserting
        the node''s proteolysis claim.'
