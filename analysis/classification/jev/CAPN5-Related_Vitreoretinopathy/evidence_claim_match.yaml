            term:
              id: MONDO:0100450
              label: CAPN5-related vitreoretinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CAPN5 Gain-of-Function Protease Hyperactivation
        description: Heterozygous missense mutations near the calcium-sensitive gating loop of the calpain-5
          catalytic core increase calcium sensitivity and catalytic activity of the enzyme; in transfected
          HEK293T cells the founding mutant proteins localize to the cytoplasm rather than near the cell
          surface, suggesting the mutations may alter a membrane-binding property of calpain-5. The regulatory
          domain-III variant G376S has not been functionally assayed and is only hypothesized to have
          a milder effect on protein function. Capn5 knockout mice show no retinal phenotype, indicating
          the disease mechanism is gain-of-function rather than haploinsufficiency.
        role: trigger
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        cell_types:
        - preferred_term: Photoreceptor Cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        molecular_functions:
        - preferred_term: Calcium-Dependent Cysteine-Type Endopeptidase Activity
          term:
            id: GO:0004198
            label: calcium-dependent cysteine-type endopeptidase activity
          modifier: INCREASED
        genetic_context:
          gene:
            preferred_term: CAPN5
            term:
              id: hgnc:1482
              label: CAPN5
          allele_type: missense
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: 'Heterozygous missense variants in the CAPN5 protease domain. Recorded as GAIN_OF_FUNCTION
            rather than haploinsufficiency: the variants hyperactivate the calpain-5 protease, and the
            inflammatory and neovascular phenotype is not seen with CAPN5 deletion.'
      selected_evidence:
        snippet: Both mutations cause mislocalization from the cell membrane to the cytosol, and structural
          modeling reveals that both mutations lie within a calcium-sensitive domain near the active site.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
