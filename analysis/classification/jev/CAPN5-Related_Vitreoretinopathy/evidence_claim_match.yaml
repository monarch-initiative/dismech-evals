  37c70304b3fc8c721ec403e1104cd7192b06deb2b325b0d4ba4e4a9c034531c0:
    claim:
      about:
        disease:
          name: CAPN5-Related Vitreoretinopathy
          disease_term:
            preferred_term: CAPN5-related vitreoretinopathy
            term:
              id: MONDO:0100450
              label: CAPN5-related vitreoretinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Photoreceptor Synaptic Proteolysis
        description: Hyperactive, mislocalized calpain-5 is hypothesized to aberrantly proteolyze substrates
          at the retinal ribbon synapse in the retina's naturally high-calcium phototransduction environment;
          the specific protein substrates of calpain-5 have not been identified. Vitreous proteomics of
          CAPN5-NIV patients shows early loss of synaptic proteins including neurexin-2, glutamate receptor
          4 (a receptor expressed in rod bipolar cells), and neurofascin. The proteomic analysis could
          not differentiate which retinal cells are affected by these losses, which may contribute to
          the synaptic signaling defect -- reduced ERG b-wave amplitude -- seen in early disease.
        role: central_effector
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
        cell_types:
        - preferred_term: Photoreceptor Cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        biological_processes:
        - preferred_term: Proteolysis
          term:
            id: GO:0006508
            label: proteolysis
          modifier: INCREASED
      selected_evidence:
        snippet: 'we observed a significant fraction of proteins localized to the synapse in controls
          that decreased in CAPN5-NIV vitreous. Among these proteins were: neurexin-2 (NRXN2), glutamate
          receptor 4 (GluR4), neurofascin (NFASC)'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31110225
      reference_title: Proteomic insight into the pathogenesis of CAPN5-vitreoretinopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Vitreous proteomics documents decreased synaptic proteins in CAPN5-NIV patients, consistent
        with aberrant calpain-mediated synaptic proteolysis, though the study could not attribute the
        losses to a specific retinal cell type.
