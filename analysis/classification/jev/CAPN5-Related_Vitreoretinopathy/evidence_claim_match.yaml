      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: refuted_haploinsufficiency_model
        hypothesis_label: Refuted Haploinsufficiency Model
        status: DEPRECATED
        description: An initially plausible alternative hypothesis was that ADNIV variants act through
          simple loss of calpain-5 function (haploinsufficiency), analogous to CAPN3 loss-of-function
          causing limb-girdle muscular dystrophy. The founding paper left the question open but judged
          gain of function more likely; the model is disfavored by the normal phenotype of Capn5-null
          mice and by subsequent in vitro data showing tested disease variants are catalytically hyperactive,
          not hypoactive.
      selected_evidence:
        snippet: Although these mutations could cause disease through haploinsufficiency, it seems more
          likely that they result in a gain of function of calpain-5 that causes harm to the photoreceptor
          cells.
        supports: REFUTE
    origin:
