  ae47861b89931b1887affb1eba575a1f88d9d71e4082da86e8b75ef34f9a7444:
    claim:
      about:
        disease:
          name: CAPN5-Related Vitreoretinopathy
          disease_term:
            preferred_term: CAPN5-related vitreoretinopathy
            term:
              id: MONDO:0100450
              label: CAPN5-related vitreoretinopathy
        context: []
      assertion_type: Genetic
      assertion:
        name: CAPN5
        gene_term:
          preferred_term: CAPN5
          term:
            id: hgnc:1482
            label: CAPN5
        relationship_type: CAUSATIVE
        notes: Encodes calpain-5, a 640-amino-acid calcium-activated cysteine protease expressed in retinal
          photoreceptor cells. All known pathogenic variants are heterozygous, germline, and missense
          -- clustering either in the catalytic protease core near the calcium-sensitive gating loop (R243L,
          L244P, K250N, G267S, R289W) or in regulatory domain-III (G376S); the functionally tested variants
          are gain-of-function. Capn5 knockout mice show no retinal phenotype, arguing against haploinsufficiency
          as the disease mechanism.
        variants:
        - name: p.Arg243Leu (c.728G>T)
          description: Catalytic core, gating loop. Classic ADNIV, onset ~20s; also reported with late-onset
            mild presentation at ages 45 and 69.
          type: missense
          clinical_significance: PATHOGENIC
        - name: p.Leu244Pro (c.731T>C)
          description: Catalytic core, gating loop. Classic ADNIV.
          type: missense
          clinical_significance: PATHOGENIC
        - name: p.Lys250Asn (c.750G>T)
          description: Catalytic core, gating loop. Severe uveitis, retinal neovascularization/detachment.
          type: missense
          clinical_significance: PATHOGENIC
        - name: p.Gly267Ser (c.799G>A)
          description: Catalytic domain (exon 6). Severe, congenital nystagmus, early vitreoretinopathy.
          type: missense
          clinical_significance: PATHOGENIC
        - name: p.Gly376Ser (c.1126G>A)
          description: Regulatory domain-III. Mild, incidental, near-normal vision at age 19.
          type: missense
          clinical_significance: PATHOGENIC
        - name: p.Arg289Trp (c.865C>T)
          description: Catalytic domain, de novo. Most severe/syndromic variant -- childhood blindness,
            hearing loss, developmental delay.
          type: missense
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: CAPN5 encodes calpain-5, a calcium-activated cysteine protease that is expressed in retinal
          photoreceptor cells. Both mutations cause mislocalization from the cell membrane to the cytosol,
          and structural modeling reveals that both mutations lie within a calcium-sensitive domain near
          the active site.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23055945
      reference_title: Calpain-5 mutations cause autoimmune uveitis, retinal neovascularization, and photoreceptor
        degeneration.
      evidence_source: IN_VITRO
      explanation: Establishes CAPN5 as the causal gene. The mislocalization was demonstrated in transfected
        HEK293T cells (with structural modeling of the calcium-sensitive domain), not in patient photoreceptors.
