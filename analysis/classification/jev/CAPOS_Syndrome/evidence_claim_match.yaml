  11c01fb18c7f5450f0bceb8bfbe27f9be2b2c6222e34bda0048526929db1057f:
    claim:
      about:
        disease:
          name: CAPOS Syndrome
          disease_term:
            preferred_term: CAPOS syndrome
            term:
              id: MONDO:0011038
              label: cerebellar ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: capos_invitro_febrile_translational_validity
        kind: HUMAN_MODEL_MISMATCH
        prompt: Do heterologous-expression measurements of E818K pump kinetics, made at standard assay
          temperature in oocytes and cell lines, predict alpha-3 pump behaviour in human neurons at febrile
          temperature?
        attaches_to:
        - pathophysiology#Febrile Illness Unmasking of Pump Reserve Failure
        rationale: 'The entire mechanistic case for CAPOS rests on heterologous-expression electrophysiology
          and biochemistry: reduced sodium affinity, accelerated E1P-to-E2P transition, weakened voltage
          dependence, and failure of pump activation under "physiological conditions". But those conditions
          are the assay''s physiological conditions, not a febrile human neuron''s. The fever-trigger
          phenomenon - the single most characteristic clinical fact about CAPOS - has never been reproduced
          in any model system, and no study has measured mutant pump function across the normothermic-to-febrile
          temperature range. This is not an absence of evidence but a translational validity gap: strong
          in-vitro evidence exists, and its applicability to the defining in-vivo phenomenon is the open
          question.'
        proposed_experiments:
        - experiment_id: capos_temperature_ramp_electrophysiology
          name: E818K pump characterisation across the febrile temperature range
          description: Repeat the E818K two-electrode voltage-clamp and biochemical characterisation across
            a 37 to 41 degrees Celsius range to test whether the mutant pump's deficit is disproportionately
            temperature-sensitive relative to wild type.
          supporting_outcome:
          - Disproportionate loss of mutant pump activity as temperature rises would support the fever-unmasking
            reserve-failure hypothesis.
          refuting_outcome:
          - Parallel temperature responses in mutant and wild type would argue the fever trigger acts
            through some other route, such as systemic metabolic or inflammatory demand.
        - experiment_id: capos_knockin_fever_challenge
          name: E818K knock-in animal model fever challenge
          description: Establish a knock-in animal model carrying the orthologous E818K allele and test
            whether experimentally induced fever provokes an acute ataxic episode with incomplete recovery,
            which would be the first in-vivo recapitulation of the CAPOS trigger.
          supporting_outcome:
          - Fever-provoked ataxia with incomplete recovery in the knock-in would establish in-vivo validity
            of the mechanism.
          refuting_outcome:
          - Absence of any fever-provoked phenotype despite the orthologous allele would indicate a human-specific
            determinant not captured by the model.
      selected_evidence:
        snippet: Here, using biochemical and electrophysiological approaches, we examined the functional
          characteristics of E818K, as well as of E818Q and E818A mutants.
        supports: SUPPORT
