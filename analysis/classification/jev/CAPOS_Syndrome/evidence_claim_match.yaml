        context: []
      assertion_type: Definition
      assertion:
        name: Fever-associated acute ataxia case-finding query for undiagnosed CAPOS
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: MECHANISTIC_HYPOTHESIS
        validation_status:
          status: PROPOSED
          rationale: 'No published computable phenotype exists for CAPOS and none has been evaluated against
            a genotyped gold standard. The query is proposed here on the basis of the fever-triggered
            pump-reserve-failure hypothesis: if fever is the mechanistically privileged trigger, then
            the EHR signature of an undiagnosed CAPOS carrier is an acute ataxia or acute encephalopathy
            encounter temporally locked to a documented febrile illness in a young child, with subsequent
            coded optic atrophy, sensorineural hearing loss or areflexia. Expected yield is very low in
            absolute terms given the disease''s rarity, so validation would need a genotype-linked biobank
            of substantial size (All of Us, UK Biobank, eMERGE) and would most usefully be run as an ATP1A3-spectrum
            query rather than a CAPOS-specific one.'
        attaches_to:
        - pathophysiology#Febrile Illness Unmasking of Pump Reserve Failure
        - pathophysiology#Incomplete Recovery and Stepwise Deficit Accrual
        description: 'EHR/OMOP case-finding query: identify children with an acute ataxia or acute encephalopathy
          encounter occurring during or immediately after a documented febrile illness, who subsequently
          acquire codes for optic atrophy, sensorineural hearing loss or areflexia, as candidates for
          undiagnosed ATP1A3 p.Glu818Lys CAPOS warranting targeted sequencing. The discriminating feature
          versus the far commoner acute post-infectious cerebellar ataxia is the later accrual of fixed
          sensory-organ deficits rather than full recovery. Directly analogous in structure to the Brugada_Syndrome
          fever-unmasking query, but with derivation_basis MECHANISTIC_HYPOTHESIS rather than ESTABLISHED_CRITERIA
          because the fever-to-decompensation mechanism in CAPOS is hypothesised (pump reserve failure)
          rather than demonstrated.'
        scope: EHR/OMOP case-finding for undiagnosed CAPOS/ATP1A3-spectrum carriers; predicated on the
          unvalidated fever_triggered_pump_reserve_failure hypothesis.
        criteria_sets:
        - name: Fever-locked acute ataxia with later fixed sensory-organ deficit
          description: An acute ataxia or acute encephalopathy encounter in a child aged roughly 6 months
            to 5 years, temporally coincident with a documented febrile illness, followed at any later
            time by a code for optic atrophy, sensorineural hearing loss or areflexia.
          inclusion_criteria:
          - preferred_term: Documented febrile illness
            description: Fever or febrile-illness diagnosis code serving as the index exposure.
          - preferred_term: Acute ataxia or acute encephalopathy encounter
            description: Acute-onset ataxia or encephalopathy coded during or within days of the febrile
              episode.
          - preferred_term: Later fixed sensory-organ or reflex deficit
            description: A subsequent code for optic atrophy, sensorineural hearing loss, or areflexia,
              marking incomplete recovery rather than the monophasic full recovery of post-infectious
              cerebellar ataxia.
          exclusion_criteria:
          - preferred_term: Established alternative cause of acute ataxia
            description: Posterior fossa tumour, stroke, acute disseminated encephalomyelitis, intoxication,
              or an already-established ATP1A3 or other genetic diagnosis.
        notes: 'Counterpart to the Brugada_Syndrome fever-unmasking query (ESTABLISHED_CRITERIA) and the
          Timothy_Syndrome fever_exacerbated_cav1.2 query (MECHANISTIC_HYPOTHESIS). CAPOS sits with Timothy:
          the fever association is clinically certain but the mechanism by which fever precipitates decompensation
          is hypothesised, and the computable phenotype itself is untested. See docs/hypothesis-based-phenotype-algorithms.md.'
      selected_evidence:
        snippet: Targeted sequencing of the ATP1A3 gene is recommended in children exhibiting paroxysmal,
          fever-induced ataxia and in adults with a more or less stationary or slowly progressive cerebellar
          syndrome since childhood accompanied by mixed combinations of areflexia, pes cavus, profound
          visual impairment, and/or sensorineural hearing loss.
        supports: SUPPORT
