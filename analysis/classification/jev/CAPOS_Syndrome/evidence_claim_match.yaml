        description: The best-known allelic ATP1A3 disorder and the most important entity to keep distinct
          from CAPOS. AHC is defined by recurrent paroxysmal hemiplegic episodes beginning before 18 months
          with remission during sleep, and it does not encompass the hearing or visual impairment that
          define CAPOS. AHC is also usually de novo and caused by a different, heterogeneous set of ATP1A3
          variants (D801N, E815K, G947R predominating), not by p.Glu818Lys. Note the E815K/E818K near-collision
          in residue numbering - a named-entity-confusion trap when reading the ATP1A3 literature.
