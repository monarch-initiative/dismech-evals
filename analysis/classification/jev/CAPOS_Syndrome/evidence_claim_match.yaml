      assertion_type: Pathophysiology
      assertion:
        name: Incomplete Recovery and Stepwise Deficit Accrual
        role: central_effector
        biological_scale: ORGANISM
        description: 'This is the node that makes CAPOS mechanistically distinctive. After each febrile
          episode the patient recovers considerably over days to weeks, but not completely: a residuum
          of ataxia and of the other cardinal deficits persists. Because episodes are few, the natural
          history is better described as stepwise than as a steady slope - though the cited sources establish
          incomplete recovery and slow subsequent progression rather than a formally quantified step function.
          Modelling this as its own node separates the reversible acute physiology (which antipyresis
          and trigger avoidance can address) from the irreversible accrued deficit (which they cannot).'
      selected_evidence:
        snippet: Usually, considerable recovery occurs within days to weeks; however, persistence of some
          degree of ataxia and other manifestations is typical.
        supports: SUPPORT
