        description: 'A resting 12-lead ECG at diagnosis, and on identification of an at-risk relative
          by cascade testing, is warranted because ATP1A3-related disorders carry cardiac conduction abnormalities
          alongside the neurological phenotype. GeneReviews explicitly frames clarification of the genetic
          status of at-risk relatives as the step that identifies who should be evaluated for cardiac
          conduction abnormalities, and the multicentre cardiac cohort found resting ECG abnormalities
          in two of its three CAPOS patients. This is an ATP1A3-spectrum recommendation: no CAPOS-specific
          surveillance interval has been published, so none is stated here.'
        presence: Resting ECG abnormalities, including conduction delay, in a majority of the small published
          CAPOS cardiac series.
