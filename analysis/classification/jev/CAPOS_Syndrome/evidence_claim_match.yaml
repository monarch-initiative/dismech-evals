      assertion_type: Treatment
      assertion:
        name: Aggressive fever management and febrile-trigger avoidance
        description: Because febrile illness is the near-obligate trigger for the episodes that accrue
          permanent deficit, early and aggressive antipyresis during intercurrent illness, prompt treatment
          of infections, and general avoidance of the physical, environmental and metabolic stressors
          known to provoke ATP1A3-related episodes are treated as preventive rather than merely symptomatic
          measures. This is the one intervention that is directly mechanism-linked in CAPOS. Its efficacy
          in reducing episode frequency has not been formally trialled - the rationale is mechanistic
          plus the consistency of the fever association.
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
      selected_evidence:
        snippet: The fact that both siblings were assessed before the first acute-onset episode contributes
          to the description of early symptoms and signs of the disease, which could aid early diagnosis
          and management before the onset of acute episodes.
        supports: SUPPORT
