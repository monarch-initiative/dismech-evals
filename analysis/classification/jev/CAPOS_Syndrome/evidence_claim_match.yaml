        description: 'Conventional hearing aids perform poorly in CAPOS because the lesion is neural dyssynchrony
          rather than loss of cochlear amplification. A cochlear implant is the rehabilitative option,
          but outcomes reported to date are inconsistent: one series reported preliminary speech-perception
          improvement and another reported a poor result in an implanted p.E818K patient. Counsel accordingly
          rather than promising benefit. therapeutic_modality is DEVICE because the therapy is an implanted
          prosthesis; the treatment_term records the surgical action by which it is delivered, since NCIT''s
          Cochlear Implant concept (NCIT:C157820) is a Medical Device and is therefore not reachable from
          the Clinical Intervention or Procedure root that treatment_term is bound to.'
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: cochlear device implantation
          term:
            id: NCIT:C15329
            label: Surgical Procedure
          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: cochlear implant
              term:
                id: NCIT:C157820
                label: Cochlear Implant
        target_phenotypes:
        - preferred_term: Sensorineural hearing impairment
          term:
            id: HP:0000407
            label: Sensorineural hearing impairment
      selected_evidence:
        snippet: Auditory neuropathy is difficult to treat with conventional hearing aids, but preliminary
          improvement in speech perception in some patients suggests that cochlear implantation may be
          effective in CAPOS patients.
        supports: SUPPORT
