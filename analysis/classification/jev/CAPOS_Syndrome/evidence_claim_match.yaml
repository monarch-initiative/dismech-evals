          root ganglion and peripheral sensory involvement that separates CAPOS from the purely central
          allelic ATP1A3 phenotypes. This node generates the persistent phenotypes curated below (Cerebellar
          ataxia, Areflexia, Pes cavus, Optic atrophy).'
      selected_evidence:
        snippet: The clinical presentation in the family described here differs categorically from these
          diseases in age of onset, clinical course, cerebellar over extrapyramidal movement disorder
          predominance, and peripheral nervous system involvement.
