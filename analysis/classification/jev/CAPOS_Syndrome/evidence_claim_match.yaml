  53280d31c14a3e245b6bb95861a7e115e15e199a0ca3d2afc2d261be767fe029:
    claim:
      about:
        disease:
          name: CAPOS Syndrome
          disease_term:
            preferred_term: CAPOS syndrome
            term:
              id: MONDO:0011038
              label: cerebellar ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: capos_allelic_lesion_selectivity
        kind: KNOWLEDGE_GAP
        prompt: Why does the single recurrent p.Glu818Lys allele produce the specific CAPOS lesion set
          (cerebellum, auditory nerve, optic nerve, dorsal root ganglion) while other ATP1A3 alleles in
          the same gene produce entirely different lesion sets?
        attaches_to:
        - pathophysiology#Impaired Neuronal Transmembrane Ion Gradient Restoration
        rationale: 'ATP1A3 is expressed broadly across neurons, yet allelic variants partition into strikingly
          discrete syndromes: p.Glu818Lys gives CAPOS with sensory organ and peripheral involvement, Arg756
          variants give RECA, and a different heterogeneous set gives AHC or rapid-onset dystonia-parkinsonism.
          The biophysical characterisation of E818K explains that the pump fails, but not why the failure
          selects cerebellar, auditory, optic and dorsal root ganglion neurons specifically. Candidate
          explanations - regional differences in alpha-3 dependence, in firing rate and metabolic load,
          in compensating alpha-1 expression, or in the specific kinetic parameter each variant perturbs
          - have not been tested against each other. Resolving this would turn ATP1A3 genotype-phenotype
          correlation from empirical pattern-matching into prediction.'
        proposed_experiments:
        - experiment_id: capos_celltype_pump_dependence
          name: Cell-type-resolved alpha-3 pump dependence profiling
          description: Cell-type-resolved measurement of alpha-3 versus alpha-1 pump dependence and firing-rate-dependent
            sodium load across cerebellar Purkinje, spiral ganglion, retinal ganglion and dorsal root
            ganglion neurons, correlated with each variant's specific kinetic defect.
          supporting_outcome:
          - A match between the CAPOS lesion set and the neurons with highest alpha-3 dependence and lowest
            alpha-1 compensation would support a dependence-based selectivity model.
        - experiment_id: capos_comparative_variant_electrophysiology
          name: Head-to-head electrophysiology of E818K, R756H and AHC variants
          description: Comparative electrophysiological profiling of E818K, R756H and the common AHC variants
            in a single common expression system, testing whether the distinct clinical lesion sets track
            distinct kinetic signatures rather than overall pump activity.
          supporting_outcome:
          - Variant-specific kinetic signatures that predict the clinical lesion set would support parameter-specific
            rather than dose-dependent selectivity.
      selected_evidence:
        snippet: The most common variants are associated with well-defined phenotypes, while more rare
          variants often result in very rare symptom correlations, such as are seen in our study.
        supports: SUPPORT
