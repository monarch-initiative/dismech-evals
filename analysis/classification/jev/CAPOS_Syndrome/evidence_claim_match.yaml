  b6472ea00ca1ecfe4ebae234c800c115d24646c31276f001b851ca0dea416b8a:
    claim:
      about:
        disease:
          name: CAPOS Syndrome
          disease_term:
            preferred_term: CAPOS syndrome
            term:
              id: MONDO:0011038
              label: cerebellar ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neuronal Transmembrane Ion Gradient Restoration
        role: amplifier
        biological_scale: CELLULAR
        description: 'Because the alpha-3 pump can no longer be properly activated, neurons that depend
          on it fail to restore the Na+ and K+ gradients that were spent during activity. The alpha-3
          isoform is the high-turnover, activity-recruited neuronal pump, so the deficit is expressed
          as an inability to reset the membrane after firing rather than as a resting-potential collapse.
          Neurons with high sustained firing rates and long, energetically expensive axons are disproportionately
          affected, which is the cell-biological basis of the otherwise puzzling CAPOS lesion distribution:
          cerebellar Purkinje and cerebellar circuit neurons, spiral ganglion neurons of the auditory
          nerve, retinal ganglion cells projecting through the optic nerve, and dorsal root ganglion sensory
          neurons.'
