            term:
              id: MONDO:0011038
              label: cerebellar ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: capos_degeneration_vs_dysfunction
        kind: KNOWLEDGE_GAP
        prompt: Does the persistent deficit in CAPOS reflect actual neuronal loss (degeneration) or persistent
          functional impairment of surviving neurons?
        attaches_to:
        - pathophysiology#Incomplete Recovery and Stepwise Deficit Accrual
        rationale: 'This is the central unresolved mechanistic question in CAPOS and it determines whether
          the disorder belongs with the neurodegenerations at all. The clinical picture - stepwise accrual
          of fixed deficit after discrete febrile events, with considerable interval recovery - is equally
          compatible with (a) each episode killing a tranche of vulnerable neurons, or (b) each episode
          leaving surviving neurons in a persistently deranged but living state. Neuroimaging does not
          settle it: MRI is frequently unremarkable and only mild cerebellar atrophy has been reported,
          in isolated cases. No neuropathological study of a CAPOS brain has been published, and no longitudinal
          quantitative imaging cohort exists. The answer has direct therapeutic consequences, because
          a functional lesion is in principle reversible while neuronal loss is not. This gap is also
          the reason CAPOS does not declare conformance to the cerebellar_purkinje_degeneration module.'
        proposed_experiments:
        - experiment_id: capos_longitudinal_structural_imaging
          name: Longitudinal cerebellar volumetry and retinal OCT around febrile episodes
          description: Longitudinal volumetric MRI of the cerebellum and quantitative optical coherence
            tomography of the retinal nerve fibre layer in genotyped CAPOS patients, timed around febrile
            episodes, to test whether fixed structural loss accrues stepwise at each episode.
          supporting_outcome:
          - Stepwise loss of cerebellar volume and retinal nerve fibre layer thickness time-locked to
            episodes would support true neuronal loss.
          refuting_outcome:
          - Stable structural measures despite accrued clinical deficit would support persistent functional
            impairment of surviving neurons.
        - experiment_id: capos_ipsc_febrile_challenge
          name: Patient-derived iPSC neuron febrile-temperature challenge
          description: Patient-derived iPSC neurons (cerebellar and sensory) carrying p.Glu818Lys, challenged
            at febrile temperature, assayed for both acute ion-gradient failure and subsequent cell death
            versus persistent functional derangement in survivors.
          supporting_outcome:
          - Measurable cell death after febrile-temperature challenge would support the degeneration model.
          refuting_outcome:
          - Survival with persistent electrophysiological derangement and no excess death would support
            the functional-impairment model.
      selected_evidence:
        snippet: the brain MRI indicated mild cerebellar atrophy
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
