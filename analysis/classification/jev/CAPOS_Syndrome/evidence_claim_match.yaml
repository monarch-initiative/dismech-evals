            term:
              id: MONDO:0011038
              label: cerebellar ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: fever_triggered_pump_reserve_failure
        hypothesis_label: Fever exhausts a marginal neuronal alpha-3 pump reserve
        status: EMERGING
        description: 'Hypothesis: in a heterozygous p.Glu818Lys carrier the residual wild-type alpha-3
          Na+/K+-ATPase provides just enough pumping capacity for baseline neuronal activity, and febrile
          illness raises metabolic and firing demand past that margin in the most pump-dependent neurons,
          producing acute failure of ion-gradient restoration and hence the stereotyped febrile ataxia/encephalopathy
          episode. This would explain why fever is a near-obligate trigger, why episodes are self-limited
          once the fever resolves, and why some deficit is nonetheless retained. It predicts that aggressive
          antipyresis should reduce episode frequency or severity, and that mutant pump function measured
          at febrile temperature should be disproportionately impaired relative to wild type.'
      selected_evidence:
        snippet: which together with the reduced Na+ affinity of the cytoplasmic-facing sites precluded
          proper pump activation under physiological conditions
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30409907
      reference_title: Functional consequences of the CAPOS mutation E818K of Na(+),K(+)-ATPase.
      evidence_source: IN_VITRO
      explanation: Establishes a marginal/failing pump at baseline physiological conditions, which is
        the premise of the reserve hypothesis; the study did not test febrile temperature, so this is
        PARTIAL support for the fever-specific claim.
