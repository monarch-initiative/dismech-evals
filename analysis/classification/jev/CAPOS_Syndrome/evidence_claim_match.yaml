  203b9cd1733ba7b30326bc494ae2c1489381846262f04082dde32fc7df11f964:
    claim:
      about:
        disease:
          name: CAPOS Syndrome
          disease_term:
            preferred_term: CAPOS syndrome
            term:
              id: MONDO:0011038
              label: cerebellar ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: ATP1A3
        gene_term:
          preferred_term: ATP1A3
          term:
            id: hgnc:801
            label: ATP1A3
        relationship_type: CAUSATIVE
        notes: 'ATP1A3 encodes the neuron-specific alpha-3 catalytic subunit of the Na+/K+-ATPase. CAPOS
          is genetically homogeneous to a degree that is unusual even among Mendelian disorders: essentially
          every reported patient carries the same heterozygous missense change, c.2452G>A (p.Glu818Lys).
          This is a striking genotype-phenotype restriction, because the same gene produces clinically
          distinct allelic disorders (alternating hemiplegia of childhood, rapid-onset dystonia-parkinsonism,
          RECA/FIPWE) through a large and heterogeneous set of other variants.'
        variants:
        - name: ATP1A3 c.2452G>A (p.Glu818Lys)
          type: MISSENSE
          clinical_significance: PATHOGENIC
          description: The recurrent, near-exclusive CAPOS allele. Glu818 lies in a hydrogen-bonding/salt-bridge
            network that positions residues coordinating sodium at the pump's third, sodium-specific ion-binding
            site; the glutamate-to-lysine charge reversal disrupts that network.
          gene:
            preferred_term: ATP1A3
            term:
              id: hgnc:801
              label: ATP1A3
      selected_evidence:
        snippet: This study shows that an allelic mutation in ATP1A3 produces CAPOS syndrome.
        supports: SUPPORT
