              label: cerebellar ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Auditory Neuropathy with Preserved Outer Hair Cell Function
        role: effector
        biological_scale: TISSUE
        description: The CAPOS hearing loss is mechanistically a neural, not a sensory, lesion. Cochlear
          outer hair cell activity is preserved, demonstrated by intact otoacoustic emissions and cochlear
          microphonic potentials, while auditory brainstem responses are grossly abnormal, indicating
          neural dyssynchrony in the cochlear nerve. Speech perception, especially in noise, is disproportionately
          poor relative to the pure-tone audiogram. This is the classic auditory neuropathy spectrum disorder
          profile and it is why conventional amplification performs badly and why cochlear implantation
          became the management question. This node generates the Sensorineural hearing impairment and
          Abnormal auditory evoked potentials phenotypes.
        cell_types:
        - preferred_term: spiral ganglion neuron
          term:
            id: CL:0011113
            label: spiral ganglion neuron
        notes: This node is the reason CAPOS does NOT declare conforms_to against kb/modules/sensorineural_hair_cell_loss.yaml.
          That module's central effector is "Hair Cell Mechanotransduction Failure and Death"; CAPOS demonstrably
          preserves outer hair cell function, so asserting conformance would invert the module's mechanism.
          See the top-level notes for the full lump/split and conformance reasoning.
      selected_evidence:
        snippet: we show for the first time that cochlear outer hair cell activity was preserved as shown
          by the presence of otoacoustic emissions and cochlear microphonic potentials, but the auditory
          brainstem responses were grossly abnormal, likely reflecting neural dyssynchrony.
        supports: SUPPORT
