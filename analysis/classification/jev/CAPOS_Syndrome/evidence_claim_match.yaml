  7e0684f6fcc045853d96d5e274414afe96d3904ae7ccf37f73901ae56761f00c:
    claim:
      about:
        disease:
          name: CAPOS Syndrome
          disease_term:
            preferred_term: CAPOS syndrome
            term:
              id: MONDO:0011038
              label: cerebellar ataxia-areflexia-pes cavus-optic atrophy-sensorineural hearing loss syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Febrile Illness Unmasking of Pump Reserve Failure
        role: trigger
        biological_scale: ORGANISM
        description: 'The mechanistic signature of CAPOS is that neurological decompensation is provoked,
          essentially without exception, by febrile illness; pregnancy and the immediate postpartum period
          are the one reported non-febrile trigger (see notes). The proposed mechanism is a reserve failure:
          a heterozygous carrier retains enough wild-type alpha-3 pump to meet baseline demand, but fever
          raises metabolic and firing demand on exactly the neurons whose pump reserve is already exhausted,
          tipping them into a state in which ion gradients cannot be maintained. This makes fever a mechanistically
          privileged trigger rather than a non-specific stressor, and it is the reason aggressive antipyresis
          is treated as disease-modifying rather than merely symptomatic. The trigger dependence also
          explains the episodic, punctuated natural history: patients typically have only one to three
          episodes in a lifetime, each aligned to a febrile illness.'
        notes: 'The reserve-failure interpretation of why fever specifically triggers CAPOS decompensation
          is a mechanistic hypothesis, not a demonstrated result; no study has measured alpha-3 pump function
          at febrile temperature in a patient-derived neuronal system. The clinical fever-episode association
          itself is well established. The hypothesis is registered under mechanistic_hypotheses as fever_triggered_pump_reserve_failure.
          This node is wired into the main pathograph (upstream: Impaired Neuronal Transmembrane Ion Gradient
          Restoration; downstream: Acute Febrile Encephalopathy and Cerebellar Decompensation) rather
          than left as a free-standing trigger. NON-FEBRILE TRIGGER. PMID:29090527 reports one p.Glu818Lys-confirmed
          individual whose ataxia, vision, and hearing worsened stepwise during all three pregnancies
          and the immediate postpartum period, with the authors recommending ATP1A3 testing be considered
          for cerebellar ataxia triggered by "febrile illness, or pregnancy and delivery". This is a single
          family, so it is curated as a caveat on this node (PARTIAL evidence above) rather than as a
          second trigger node - there is no independent pregnancy-cohort replication and no proposed mechanism
          distinguishing it from a physiological-stress variant of the same pump-reserve failure.'
      selected_evidence:
        snippet: The individuals presented here experienced one to three paroxysmal, short-lasting episodes
          in childhood with cerebellar symptoms and signs, hypotonia, ophthalmoparesis, motor weakness,
          areflexia, and/or lethargy that were consistently associated with febrile illness.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27091223
      reference_title: 'The Genetic Homogeneity of CAPOS Syndrome: Four New Patients With the c.2452G>A
        (p.Glu818Lys) Mutation in the ATP1A3 Gene.'
      evidence_source: HUMAN_CLINICAL
      explanation: Directly supports both the consistent febrile association and the characteristic low
