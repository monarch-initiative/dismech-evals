      evidence_source: IN_VITRO
      explanation: 'Independent functional corroboration of CAPRIN1 as an NDD gene, reached from a different
        direction: this study ascertained through stress-granule assembly regulators rather than through
        CAPRIN1, and shows that NDD variants in it disrupt stress-granule formation. Graded PARTIAL because
        that is a functional result about the gene, not a clinical cohort - it corroborates the gene-disease
        link without replicating the phenotype profile.

        An earlier revision quoted this paper''s opening sentence instead, which describes an NDD with
        language problems, intellectual disability and behavioural issues. That sentence is about UBAP2L,
        not CAPRIN1 - the quote stopped one word before the gene name that fixes its subject, and the
        resemblance to this entry''s three most frequent phenotypes was a coincidence between two different
        disorders. It verified as an exact substring throughout.'
