    claim:
      about:
        disease:
          name: CAPRIN1 Related Neurodevelopmental Disorder
          disease_term:
            preferred_term: neurodevelopmental disorder with language impairment, autism, and attention
              deficit-hyperactivity disorder
            term:
              id: MONDO:0968945
              label: neurodevelopmental disorder with language impairment, autism, and attention deficit-hyperactivity
                disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extraneural Consequences of Reduced Caprin-1
        biological_scale: ORGANISM
        description: 'The respiratory, skeletal, feeding and ophthalmologic features, which occur in a
          third to a half of patients and which a neuronal mechanism does not account for.

          CAPRIN1 is ubiquitously expressed and also regulates mRNAs encoding proteins important for cell
          proliferation and migration in multiple cell types, so there is a plausible route to non-neural
          tissue.

          An earlier revision of this node said no cited work showed Caprin-1 operating in any extraneural
          organ. That was wrong, and two mouse results already in this PR''s references show it: complete
          RNG105 knockout is neonatally lethal from respiratory failure, and targeted inner-ear deletion
          causes progressive hearing loss. Both are organ-specific requirements for Caprin-1 outside the
          brain, and the respiratory one lands on the same organ system as a phenotype reached from this
          node.

          What is genuinely absent is the dose. Both results are complete loss - homozygous null and targeted
          deletion - and this disease is haploinsufficiency. So the defensible claim, and the one the
          node now makes, is that Caprin-1 has non-neural organ requirements demonstrated at complete
          loss, and that nothing cited shows those requirements failing at half dosage. It remains a sibling
          of the neuronal arm rather than downstream of it, because routing a limb anomaly through cortical
          neuron development would be false.'
      selected_evidence:
        snippet: targeted inner ear-deletion of Caprin1 in mice leads to an early onset, progressive hearing
          loss
        supports: SUPPORT
    origin:
