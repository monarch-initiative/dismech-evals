        organ system as one of this node''s phenotypes. Note this is a secondary citation - the sentence
        is this paper''s introduction restating Shiina et al. 2010, which is the primary and is not cited
        here. Graded SUPPORT for the node''s existence, not for the respiratory phenotype: neonatal lethality
        in a homozygous null is not the respiratory morbidity of a surviving heterozygous patient, and
        the entry does not treat it as the same claim.'
