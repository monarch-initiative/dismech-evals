              is the mouse analogue of the social-communication and restricted-interest domains.
            limitations: PARTIALLY_RECAPITULATES rather than RECAPITULATES, and the reservation is about
              what a mouse can be said to have. Reduced sociality in a home cage is a behavioural analogue
              of one ASD domain, not the human diagnosis; the authors themselves write "ASD-like behavior".
              The battery is also behavioural throughout, so it connects the dose to a phenotype without
              connecting either to the mRNA-localisation mechanism this entry proposes. And ASD is reported
              in 67 percent of patients, so the model addresses a frequent feature rather than a defining
