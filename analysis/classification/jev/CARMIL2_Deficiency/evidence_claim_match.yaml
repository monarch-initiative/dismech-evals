  7d7c34216b529422e7d4b168ae54d808c6b5585dd612de7ae84729a25210f524:
    claim:
      about:
        disease:
          name: CARMIL2 Deficiency
          disease_term:
            preferred_term: CARMIL2 deficiency
            term:
              id: MONDO:0029134
              label: severe combined immunodeficiency due to CARMIL2 deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_carmil2_cytoskeletal_defect_contested
        prompt: Do CARMIL2-deficient human T cells actually have a migration defect, and does any such
          defect contribute to disease?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Perturbed T Cell Cytoskeletal Organization
        rationale: 'The original description of the human disease reported perturbed cytoskeletal organization
          with T cell polarity and migration disorders, and the cytoskeletal claim has been repeated as
          a defining feature ever since - it appears in the framing sentence of later case reports. But
          a prospective cohort that set out to test it with a three-dimensional collagen migration assay
          found normal morphology in migrating CARMIL2-deficient T cells, in the same patients whose CD28
          co-stimulation and cytokine production were clearly abnormal. The two results are not formally
          incompatible - different assays, different readouts, cell shape is not the same as migration
          velocity - but they have not been reconciled, and the disease narrative has continued to carry
          the cytoskeletal claim without acknowledging the negative result. The question matters beyond
          bookkeeping: the actin-uncapping activity is dispensable for CD28 co-stimulation, so if there
          is no migration defect either, then CARMIL2''s capping-protein biology may be irrelevant to
          this disease despite giving the protein its name.'
        proposed_experiments:
        - experiment_id: exp_carmil2_migration_assay_reconciliation
          name: Head-to-head migration assays in CARMIL2-deficient T cells
          description: Run the assays behind both results side by side on the same patient cells - interstitial
            and transendothelial migration, polarity and uropod formation, and the three-dimensional collagen
            assay - reporting velocity and directionality as well as morphology, to establish whether
            the discrepancy is assay-dependent or patient-dependent.
      selected_evidence:
        snippet: CARMIL2-deficient T cells exhibited reduced T-cell proliferation and cytokine production
          following CD28 co-stimulation and normal morphology when migrating in a high-density 3D collagen
          gel matrix.
        supports: SUPPORT
