  df0dd20c249f06939f50eb2914ab99a1e28cf5849668c885c818346a1cc9bca7:
    claim:
      about:
        disease:
          name: CARMIL2 Deficiency
          disease_term:
            preferred_term: CARMIL2 deficiency
            term:
              id: MONDO:0029134
              label: severe combined immunodeficiency due to CARMIL2 deficiency
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: CD28 deficiency
        description: 'The mechanistic near-twin and the informative differential: CD28 deficiency (immunodeficiency
          123, curated here as Immunodeficiency_123_With_HPV-related_Verrucosis) removes the receptor
          that CARMIL2 scaffolds, so the two share a broken co-stimulatory axis, recalcitrant warts and
          low memory T cell and regulatory T cell counts. They diverge everywhere else, and that divergence
          is the argument that CARMIL2 does more than serve CD28.'
        distinguishing_features:
        - CD28 deficiency is essentially restricted to skin papillomaviruses; CARMIL2 deficiency carries
          a broad bacterial, mycobacterial and fungal infection burden
        - NK cell and memory B cell counts are normal in CD28 deficiency and low in CARMIL2 deficiency
        - CD28-deficient patients make virus-specific antibody; CARMIL2-deficient patients have weak antibody
          responses
        - EBV-positive smooth muscle tumours and inflammatory bowel disease occur in CARMIL2 deficiency
          and not in CD28 deficiency
      selected_evidence:
        snippet: Like CD28-deficient patients, CARMIL2-deficient patients display recalcitrant warts and
          low blood counts of CD4+ and CD8+ memory T cells and CD4+ TREGs.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36515678
      reference_title: Human CARMIL2 deficiency underlies a broader immunological and clinical phenotype
        than CD28 deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: The shared features that make the two easy to confuse.
