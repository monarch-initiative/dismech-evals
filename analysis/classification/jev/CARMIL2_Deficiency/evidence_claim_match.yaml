          name: CARMIL2 Deficiency
          disease_term:
            preferred_term: CARMIL2 deficiency
            term:
              id: MONDO:0029134
              label: severe combined immunodeficiency due to CARMIL2 deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_carmil2_metabolic_rescue_translation
        prompt: Can bypassing the broken co-stimulatory signal downstream - with interleukin-2 or with
          glutamine - do anything useful for patients who cannot be transplanted?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of CD28-Dependent Canonical NF-kB Activation
        - treatments#Interleukin-2 Supplementation
        rationale: Two independent ex vivo rescues of CARMIL2-deficient T cells have been reported, and
          neither has been tested in a patient. Exogenous interleukin-2 restored CD25 expression and interferon-gamma
          production dose-dependently, and proliferation in one patient. Separately, CARMIL2-deficient
          CD4+ T cells were shown to fail activation-induced metabolic reprogramming, with glutamine metabolism
          among the depressed pathways, and glutamine supplementation restored NF-kB and mTOR activity
          and raised IL17A expression. Both act downstream of the broken scaffold rather than repairing
          it, and both were demonstrated in cultured cells from small numbers of patients. Whether either
          produces clinical benefit is untested; transplantation is curative and now recommended at diagnosis,
          which sets a high bar and also narrows the population in which a bypass strategy would be worth
          trialling - patients ineligible for transplant, or awaiting it.
        proposed_experiments:
        - experiment_id: exp_carmil2_bypass_agent_comparison
          name: Compare the two ex vivo rescues on common readouts
          description: Test interleukin-2 and glutamine supplementation, alone and together, on the same
            panel of patient cells with common readouts - NF-kB and mTOR activity, proliferation, Th1
            and Th17 cytokine output - to establish whether they act on the same bottleneck and whether
            either restores the Th17 arm that the mucosal fungal phenotype depends on.
      selected_evidence:
        snippet: In conclusion, we found that IL-2 rescued T cell activation and proliferation in CARMIL2-deficient
          patients. Thus, IL-2 should be further studied as a potential therapeutic modality for these
          patients.
        supports: SUPPORT
    origin:
