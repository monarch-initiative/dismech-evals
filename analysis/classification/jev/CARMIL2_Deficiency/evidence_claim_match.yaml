              cells in vitro, in a dose-dependent manner. The authors propose it should be studied further
              as a therapeutic modality; no clinical trial has tested it. No `therapeutic_agent` is bound,
              and the reason is a genuine gap rather than an oversight. The study used generic exogenous
              interleukin-2, not a named product. NCIT does carry a generic cytokine term (NCIT:C20507
              Interleukin-2), but that term is a protein rather than a chemical entity and is not a member
              of the ChemicalEntityTerm enum this slot binds to; it was tried and rejected by validation.
              The terms that would validate name specific recombinant products such as aldesleukin, and
              binding one would assert a specificity the study does not have. No term beats a wrong term,
              so the slot is left empty.
            therapeutic_modality: OTHER
