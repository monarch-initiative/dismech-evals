        description: A child presenting with refractory very early onset inflammatory bowel disease has
          a substantial prior probability of a monogenic immune defect, of which CARMIL2 deficiency is
          only one. The differential matters because identifying which one changes management, and because
          in CARMIL2 deficiency the gut disease can arrive before the immunodeficiency is recognised.
        distinguishing_features:
        - Failed T cell proliferation and activation specifically on CD3/CD28 co-stimulation points to
          the CD28 axis rather than to another monogenic IBD gene
        - Absent or reduced CARMIL2 protein on immunoblot or flow cytometry
        - Accompanying recalcitrant warts, molluscum contagiosum and dermatitis
      selected_evidence:
        snippet: The T cell proliferation and activation assays confirmed defective responses to CD28
          costimulation, consistent with CARMIL2 deficiency.
        supports: SUPPORT
