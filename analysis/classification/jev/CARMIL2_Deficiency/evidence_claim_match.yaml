  ae695d1e82652a6e24c27c065d2f18825578b9031d6acf0d69be36ae17e1ca2c:
    claim:
      about:
        disease:
          name: CARMIL2 Deficiency
          disease_term:
            preferred_term: CARMIL2 deficiency
            term:
              id: MONDO:0029134
              label: severe combined immunodeficiency due to CARMIL2 deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_carmil2_beyond_cd28
        prompt: Which of CARMIL2's non-CD28 functions accounts for the parts of the phenotype that CD28
          deficiency does not have - the low NK cell counts, the low memory B cells, the weak antibody
          responses, and the EBV-positive smooth muscle tumours?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#B Cell Receptor-Proximal NF-kB Signaling Failure
        - pathophysiology#Impaired Humoral Memory and Antibody Response
        - pathophysiology#Uncontrolled EBV Infection of Smooth Muscle
        - phenotypes#Reduced Natural Killer Cell Count
        - phenotypes#Decreased Memory B Cell Proportion
        rationale: 'The comparison with CD28 deficiency is the cleanest natural experiment available,
          and it says that CARMIL2 is doing something beyond scaffolding CD28. What that something is
          has been narrowed but not identified. One piece is in hand: patient B cells fail to activate
          NF-kB on B cell receptor stimulation, so at least part of the humoral defect is B-cell-intrinsic.
          The NK cell deficit has no proposed mechanism at all. The tumour susceptibility is the most
          consequential unknown, because it is the manifestation that has been refractory to treatment
          short of transplantation, and it is not obviously explained by the T cell deficits, which CD28-deficient
          patients share without developing tumours. A single unifying answer has been proposed - that
          CARMIL2 controls NF-kB downstream of several protein kinase C-dependent receptors rather than
          of CD28 alone - but it is a hypothesis, not a demonstrated mechanism for any of these three
          findings.'
        proposed_experiments:
        - experiment_id: exp_carmil2_nk_cell_intrinsic_requirement
          name: Cell-intrinsic requirement for CARMIL2 in NK cells
          description: Determine whether the NK cell deficit is NK-cell-intrinsic by testing CARMIL2-dependent
            receptor signalling in patient NK cells directly, and by comparing NK reconstitution kinetics
            after transplantation with those of the T cell compartment.
        - experiment_id: exp_carmil2_pkc_receptor_panel
          name: Which protein kinase C-coupled receptors need CARMIL2
          description: Test NF-kB activation in patient T, B and NK cells across a panel of receptors
            that signal through protein kinase C to CARD11, to establish whether CARMIL2 is a general
            requirement for that route or is specific to a subset of receptors.
      selected_evidence:
        snippet: Our study suggests that CARMIL2 governs immunological pathways beyond CD28.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
