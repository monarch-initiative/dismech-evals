      assertion:
        name: Exome Sequencing with CD28 Co-stimulation Functional Testing
        description: The diagnosis is made by exome sequencing, typically in a consanguineous kindred
          presenting with an unexplained combined immunodeficiency, and confirmed functionally by absent
          or reduced CARMIL2 protein and by a failed proliferative and NF-kB response to CD3/CD28 co-stimulation.
          Routine lymphocyte counts are unhelpful for the T cell compartment, whose total counts are normal;
          the informative subsets are memory T cells, regulatory T cells, memory B cells and NK cells.
        diagnosis_term:
          preferred_term: whole exome sequencing with confirmatory CD28 co-stimulation testing
          term:
            id: NCIT:C101295
            label: Whole Exome Sequencing
      selected_evidence:
        snippet: Through the use of whole exome sequencing and autozygome-guided analysis, we uncovered
          two mutations not previously reported (p.R50T and p.L846Sfs) in CARMIL2.
        supports: SUPPORT
