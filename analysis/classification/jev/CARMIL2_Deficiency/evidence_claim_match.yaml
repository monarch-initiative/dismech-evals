          CD28 and its two key effectors, protein kinase C-theta and CARD11/Carma1, is abrogated. It is
          the scaffolding role, not the actin-uncapping activity, that CD28 co-stimulation requires. This
          node captures the single concept of the lost molecular bridge.
        role: mediator
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: CD28-to-CARD11 scaffolding activity
          term:
            id: GO:0030674
            label: protein-macromolecule adaptor activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: However, the connection between CD28 and protein kinase C-θ and Carma1, two key effectors
          of CD28 costimulation, was abrogated in T cells expressing mutant Rltpr, and CD28 costimulation
          did not occur in those cells.
        supports: SUPPORT
