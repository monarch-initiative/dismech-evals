            description: The reciprocal experiment, and the strongest available test of the mechanism
              this entry asserts. A gain-of-function CARMIL2 allele produces preformed CARMIL2-CARD11
              complexes without CD28 engagement, and in CD28-deficient mice those ready-made complexes
              induce most of the functions CD28 engagement normally produces. If forcing the scaffold
              complex substitutes for the receptor, then the receptor's contribution runs through the
              scaffold - which is why loss of the scaffold reproduces so much of losing the receptor.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Loss of CARMIL2 Scaffolding of CD28 to CARD11
        relationship: PERTURBS
        fidelity: MODERATE
        description: A gain-of-function perturbation of the same node the disease loses. It does not model
          the disease state; it tests, in the opposite direction, whether the CARMIL2-CARD11 complex is
          the operative element of CD28 co-stimulation.
        limitations: This is a mouse gain-of-function allele derived from a somatic substitution found
          in human T cell malignancies, not a loss-of-function disease model, so it says nothing about
          the clinical phenotype, the B cell defect, or the tumour susceptibility. Most of the functions
          is also not all of them, and the paper does not resolve which CD28 outputs remain scaffold-independent.
      selected_evidence:
        snippet: In conclusion, we uncovered the overarching role played by CARMIL2-CARD11 signals among
          those triggered by CD28 and exploited them to induce potent solid tumor-specific T cell responses
          in the absence of CD28 ligands and immune checkpoint inhibitors.
        supports: SUPPORT
