              label: severe combined immunodeficiency due to CARMIL2 deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: CARMIL2
        gene_term:
          preferred_term: CARMIL2
          term:
            id: hgnc:27089
            label: CARMIL2
        relationship_type: CAUSATIVE
        notes: 'CARMIL2 (16q22.1), previously symbolised RLTPR and aliased LRRC16C, encodes the capping
          protein regulator and myosin 1 linker 2. Disease requires biallelic loss-of-function alleles.
          The largest published series identified 49 germline variants across 89 individuals from 52 families
          - missense, nonsense, frameshift, in-frame deletion, splice and synonymous variants that disrupt
          splicing - with founder effects for recurrent alleles in Norwegian, Saudi, Turkish and Mexican
          populations. Note that the isoform picture matters for variant interpretation: the predominant
          and functional leukocyte isoform is not the one annotated as canonical in Ensembl, so a variant''s
          predicted consequence depends on which transcript it is read against.'
      selected_evidence:
        snippet: Here, we show four human patients with EBV+ disseminated smooth muscle tumours that carry
          two homozygous loss-of-function mutations in the CARMIL2 (RLTPR) gene encoding the capping protein
          regulator and myosin 1 linker 2.
        supports: SUPPORT
    origin:
