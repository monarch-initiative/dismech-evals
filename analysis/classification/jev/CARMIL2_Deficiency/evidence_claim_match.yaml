  a977f2d47d8911700ede22c559220867497a1a90c42c8ba9b841eade1fcee032:
    claim:
      about:
        disease:
          name: CARMIL2 Deficiency
          disease_term:
            preferred_term: CARMIL2 deficiency
            term:
              id: MONDO:0029134
              label: severe combined immunodeficiency due to CARMIL2 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of CARMIL2 Scaffolding of CD28 to CARD11
        description: CARMIL2 acts as a scaffold that bridges CD28 to the CARD11/CARMA1 cytosolic adaptor
          and onward to the NF-kB pathway; in T cells expressing mutant CARMIL2 the connection between
          CD28 and its two key effectors, protein kinase C-theta and CARD11/Carma1, is abrogated. It is
          the scaffolding role, not the actin-uncapping activity, that CD28 co-stimulation requires. This
          node captures the single concept of the lost molecular bridge.
        role: mediator
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: CD28-to-CARD11 scaffolding activity
          term:
            id: GO:0030674
            label: protein-macromolecule adaptor activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Although RLTPR is thought to function as an actin-uncapping protein, this property was
          dispensable for CD28 co-stimulation in both mouse and human.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27647348
      reference_title: The scaffolding function of the RLTPR protein explains its essential role for CD28
        co-stimulation in mouse and human T cells.
      evidence_source: IN_VITRO
      explanation: The reason the pathograph routes co-stimulation failure through scaffolding rather
        than through the actin-uncapping activity, and the reason the cytoskeletal node is kept off this
        chain.
