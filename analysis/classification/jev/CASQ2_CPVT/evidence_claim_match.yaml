  c8ae9471e64be12bfd206ce5a05794575a0cc243d9911d7d7fa3faf8351bfa3f:
    claim:
      about:
        disease:
          name: CASQ2 CPVT
          disease_term:
            preferred_term: catecholaminergic polymorphic ventricular tachycardia 2
            term:
              id: MONDO:0012762
              label: catecholaminergic polymorphic ventricular tachycardia 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Sinoatrial Node Dysfunction
        role: amplifier
        biological_scale: TISSUE
        description: 'Calsequestrin deficiency also depresses sinoatrial pacemaker function, producing
          low resting sinus rates. This is not merely a coincidental finding: long diastolic intervals
          give spontaneous SR calcium release time to occur before the next beat empties the store, so
          sinus node dysfunction contributes mechanistically to ventricular arrhythmia risk. Selective
          re-expression of Casq2 in the sinoatrial node of adult Casq2-knockout mice accelerated sinus
          rates and prevented CPVT.'
        cell_types:
        - preferred_term: cardiac pacemaker cell of sinoatrial node
          term:
            id: CL:1000477
            label: cardiac pacemaker cell of sinoatrial node
        biological_processes:
        - preferred_term: cardiac conduction
          term:
            id: GO:0061337
            label: cardiac conduction
          modifier: DECREASED
        notes: Deliberately NOT declared as conforming to `cardiac_ion_channel_repolarization#Sinoatrial
          Node Pacemaker Dysfunction`. That module node models loss-of-function pacemaker-current channelopathy
          (HCN4, SCN5A), which is a different mechanism from the calsequestrin-dependent sinoatrial depression
          modelled here.
      selected_evidence:
        snippet: A likely explanation is that low sinus rates prolong the diastolic interval, allowing
          the spontaneous SR calcium release to occur before CICR during the next action potential can
          empty the SR and reset the SR calcium clock.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32115705
      reference_title: Molecular and tissue mechanisms of catecholaminergic polymorphic ventricular tachycardia.
      evidence_source: OTHER
      explanation: States the proposed mechanism linking bradycardia to increased spontaneous calcium
        release.
