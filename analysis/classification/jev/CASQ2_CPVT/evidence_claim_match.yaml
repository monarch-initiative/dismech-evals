        description: The upstream lesion of CPVT2 is a pathogenic variant in CASQ2, which encodes cardiac
          calsequestrin 2, the major luminal calcium-binding protein of the junctional sarcoplasmic reticulum
          and part of the RyR2 calcium release complex. Nonsense, frameshift and splice alleles abolish
