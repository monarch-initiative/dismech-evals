            term:
              id: MONDO:0012762
              label: catecholaminergic polymorphic ventricular tachycardia 2
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Dominant
        description: An emerging, variant-specific dominant arm. A subset of heterozygous CASQ2 missense
          variants localised to the dimer-dimer interface of the calsequestrin filament behave as dominant
          negatives and can manifest a CPVT phenotype; in the international multicenter cohort a third
          of clinically evaluated heterozygous relatives met diagnostic criteria for CPVT. This is a per-variant
          property rather than a property of CASQ2 as a whole, so CPVT2 should not be reclassified wholesale
          as a dominant disorder, but heterozygotes warrant clinical screening.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Fifty-one of 66 CASQ2 heterozygous family members had undergone clinical evaluation,
          and 17 of 51 (33.3%) met diagnostic criteria for CPVT.
        supports: SUPPORT
