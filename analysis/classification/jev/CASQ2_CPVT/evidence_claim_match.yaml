        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No population-based prevalence estimate exists for CPVT2 specifically. The largest assembled
          series to date is the international multicenter CASQ2-CPVT collaboration, which identified 112
          individuals (36 CPVT probands plus 76 genotype-positive family members) across contributing
          centres worldwide. Population prevalence of CPVT as a whole (all genes) is estimated at 1:5,000
          to 1:10,000 and is curated on the umbrella `RYR2_CPVT` entry; CASQ2 accounts for only a small
          minority of genetically confirmed CPVT.
      selected_evidence:
        snippet: A total of 112 individuals, including 36 CPVT probands (24 homozygotes/compound heterozygotes
          and 12 heterozygotes) and 76 family members possessing at least 1 presumed pathogenic CASQ2
          variant, were identified.
        supports: SUPPORT
