        biological_scale: ORGANISM
        description: Loss of effective cardiac output during the arrhythmia causes transient cerebral
          hypoperfusion (syncope, sometimes with convulsive features that are misdiagnosed as epilepsy)
          and, if the rhythm does not self-terminate, cardiac arrest and sudden death. In the international
          CASQ2 cohort a potentially fatal arrhythmic event occurred at a median age of 7 years in biallelic
          carriers, and homozygote/compound-heterozygote status conferred a markedly increased hazard
          relative to heterozygosity.
