            term:
              id: MONDO:0012762
              label: catecholaminergic polymorphic ventricular tachycardia 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_dominant_casq2_prevalence_mechanism
        prompt: How common are dominant-acting CASQ2 variants, and by what mechanism does a single defective
          allele impair calsequestrin filament function enough to cause CPVT?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#CASQ2 Loss of Function
        rationale: CPVT2 was defined for two decades as a recessive disease, and heterozygous relatives
          were routinely reassured. The demonstration that a third of clinically evaluated CASQ2 heterozygotes
          met CPVT criteria, and that specific missense alleles disrupt dimer-dimer filament contacts,
          inverts that counselling posture. But the population frequency of dominant-acting alleles is
          unknown, no in vivo model of the dominant-negative mechanism has been reported, and it is unclear
          which biochemical assay best predicts which heterozygous variants confer risk. This directly
          affects variant interpretation and cascade-screening policy.
        proposed_experiments:
        - experiment_id: exp_casq2_dominant_allele_penetrance
          name: Population-scale penetrance estimation for candidate dominant CASQ2 alleles
          description: Ascertain CASQ2 missense carriers at population scale and phenotype them by exercise
            stress testing, to estimate the penetrance of candidate dominant-acting alleles independently
            of clinically ascertained families.
          experiment_type:
            preferred_term: population-scale genotype-first penetrance study
        - experiment_id: exp_casq2_heterozygous_knockin_model
          name: Heterozygous filament-interface CASQ2 knock-in models
          description: Generate heterozygous knock-in mouse and human iPSC-cardiomyocyte models of filament-interface
            CASQ2 missense variants to test the dominant-negative mechanism in vivo and in a human cellular
            background.
          experiment_type:
            preferred_term: heterozygous knock-in disease model
      selected_evidence:
        snippet: More work is needed to understand the physiological role of calsequestrin in the EC coupling
          cycle, to determine the prevalence of autosomal-dominant calsequestrin mutations, and to understand
          how they cause CPVT.
        supports: SUPPORT
