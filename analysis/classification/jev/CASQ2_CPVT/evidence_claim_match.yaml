            term:
              id: MONDO:0012762
              label: catecholaminergic polymorphic ventricular tachycardia 2
        context: []
      assertion_type: Treatment
      assertion:
        name: Flecainide
        description: 'Add-on antiarrhythmic for breakthrough arrhythmia on maximally tolerated beta-blockade,
          and for primary prevention when beta-blockers alone do not suppress exercise-induced ectopy.
          Flecainide acts on the CPVT2 mechanism directly: it blocks RyR2 in the open state, reducing
          calcium spark mass and the probability that sparks propagate into arrhythmogenic calcium waves.
          Notably, the defining mechanistic experiments were performed in calsequestrin-null (Casq2-/-)
          myocytes, making this evidence directly relevant to CPVT2 rather than borrowed from RYR2-CPVT.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: flecainide
            term:
              id: CHEBI:75984
              label: flecainide
      selected_evidence:
        snippet: flecainide significantly reduced the amplitude, duration and spatial width of Ca2+ sparks
          in Casq2-/- myocytes
        supports: SUPPORT
