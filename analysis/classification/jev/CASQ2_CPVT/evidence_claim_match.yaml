              label: catecholaminergic polymorphic ventricular tachycardia 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_purkinje_casq2_tissue_origin
        prompt: Does the failure of Purkinje-restricted calsequestrin deletion to produce CPVT in mice
          mean that human CASQ2-CPVT arrhythmia originates in the working ventricular myocardium rather
          than the conduction system?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Delayed Afterdepolarizations and Triggered Activity
        rationale: 'Clinical mapping in CPVT patients localises most ventricular ectopy to the outflow
          tracts, and the bidirectional-VT pattern has classically been attributed to alternating activation
          of the His-Purkinje system. Yet tissue-targeted deletion of calsequestrin in the murine Purkinje
          network, where the molecular lesion of CPVT2 is exactly reproduced, failed to generate the phenotype.
          This is a model-fidelity question rather than a simple absence of evidence: the murine conduction
          system differs in size, source-sink relationships, and Purkinje distribution from the human
          heart, so a negative mouse result may not transfer. Resolving it matters because ablation strategies
          targeting Purkinje triggers presuppose the conduction system is the source.'
        proposed_experiments:
        - experiment_id: exp_casq2_purkinje_rescue_sufficiency
          name: Purkinje-restricted calsequestrin rescue in the Casq2-null mouse
          description: Perform tissue-targeted calsequestrin re-expression (rather than deletion) restricted
            to the murine Purkinje network in an otherwise Casq2-null background, testing sufficiency
            of the conduction system as well as necessity.
          experiment_type:
            preferred_term: conditional tissue-restricted gene rescue experiment
        - experiment_id: exp_casq2_human_endocardial_mapping
          name: High-density endocardial mapping in genotyped CASQ2-CPVT patients
          description: Map arrhythmia origin at high density in genotype-confirmed human CASQ2-CPVT patients
            during provoked ectopy, distinguishing Purkinje from working-myocardial trigger sites.
          experiment_type:
            preferred_term: high-density endocardial electroanatomic mapping study
        - experiment_id: exp_casq2_ipsc_conduction_vs_working
          name: CASQ2-mutant iPSC cardiomyocyte lineage comparison
          description: Compare triggered-activity thresholds in patient-derived CASQ2-mutant iPSC cardiomyocytes
            differentiated toward conduction-system versus working-myocardial identity, in a human cellular
            background.
          experiment_type:
            preferred_term: iPSC-derived cardiomyocyte lineage comparison experiment
      selected_evidence:
        snippet: the deletion of calsequestrin in the Purkinje network did not produce a CPVT phenotype
        supports: SUPPORT
