        context: []
      assertion_type: Phenotype
      assertion:
        category: Neurological
        name: Convulsive Syncope
        description: Convulsive movements during an arrhythmic syncopal episode. These are secondary to
          cerebral hypoperfusion rather than a primary epileptic disorder, but are a recognised cause
          of misdiagnosis as epilepsy and of delayed cardiac evaluation in CPVT.
        notes: 'Deliberately left unbound to an HPO term. HPO has no term for convulsive (anoxic) syncope:
          the nearest candidate, HP:0001250 (Seizure), denotes abnormal excessive or synchronous neuronal
          activity, whereas the mechanism here is arrhythmic cerebral hypoperfusion with a structurally
          and electrically normal brain. Binding HP:0001250 would over-claim a primary epileptic phenotype
          and would wrongly conflate this with the genuine neuronal phenotype reported in some RYR2 variant
          carriers in `RYR2_CPVT`, so no term is asserted rather than a misleading one.'
      selected_evidence:
        snippet: characterized by episodes of syncope, seizures, or sudden death, in response to physical
          activity or emotional stress
        supports: SUPPORT
