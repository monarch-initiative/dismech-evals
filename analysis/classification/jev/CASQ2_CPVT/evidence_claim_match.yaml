      assertion_type: Diagnosis
      assertion:
        name: Longitudinal cardiology surveillance
        description: Ongoing follow-up rather than a one-off diagnostic act. Review by a cardiologist
          every six to twelve months, with the interval set by disease severity, is important throughout
          growth because rapid weight gain in childhood and adolescence means beta-blocker dosing must
          be adjusted continually to stay protective. Serial exercise stress testing is the instrument
          that both monitors control and individualises permitted exercise intensity.
        results: Recurrence or worsening of exercise-induced ectopy on serial testing indicates loss of
          arrhythmia control and prompts dose escalation or escalation of therapy.
        diagnosis_term:
          preferred_term: exercise cardiac stress test
          term:
            id: NCIT:C168192
            label: Exercise Cardiac Stress Test
      selected_evidence:
        snippet: Follow-up visits with a cardiologist every six to 12 months (depending on disease severity)
          are very important, especially until puberty, since body weight increases rapidly and drug dosages
          must be continually adjusted.
        supports: SUPPORT
