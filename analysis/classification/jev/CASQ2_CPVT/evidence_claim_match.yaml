              age of 7 years" while the heterozygote''s began "from the age of 11 years". CHILDHOOD is
              retained because it reflects the earlier biallelic presentation, which is the severe end
              this entry is anchored on; the heterozygous onset is later and is described in the phenotype
              text rather than forced into one band.'
      selected_evidence:
        snippet: Two patients who experienced syncopes before the age of 7 years were homozygous carriers,
          suggesting a complete absence of calsequestrin 2.
