        name: CASQ2 Loss of Function
        conforms_to: cardiac_ion_channel_repolarization#Cardiac Ion-Channel or Calcium-Handling Variant
        role: trigger
        biological_scale: MOLECULAR
        description: The upstream lesion of CPVT2 is a pathogenic variant in CASQ2, which encodes cardiac
          calsequestrin 2, the major luminal calcium-binding protein of the junctional sarcoplasmic reticulum
          and part of the RyR2 calcium release complex. Nonsense, frameshift and splice alleles abolish
          the protein; missense alleles either destroy calcium binding (as for the founder p.D307H allele,
          which converts an aspartate to a histidine in a highly negatively charged calcium-binding domain)
          or impair the assembly of calsequestrin dimers into filaments.
        genes:
