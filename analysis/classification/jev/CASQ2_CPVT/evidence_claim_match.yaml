        subtype: Heterozygous CPVT2
        features: A subset of heterozygous CASQ2 missense variants produces a CPVT phenotype. Structural
          mapping onto the calsequestrin filament localised several of these to an electronegative pocket
          required for back-to-back binding of calsequestrin dimers, and turbidity assays showed filamentation
          defects, supporting a dominant-negative rather than haploinsufficiency mechanism. The recessive
          p.R33Q allele, by contrast, failed to dimerize at all.
