        relationship_type: CAUSATIVE
        notes: All three reported CATSHL alleles are missense substitutions in the FGFR3 tyrosine kinase
          domain. Two affect Arg621 in the catalytic loop and act dominantly; the third affects Thr546
          and has been seen only in the homozygous state.
        variants:
        - name: c.1862G>A (p.Arg621His)
          description: The founding allele, heterozygous in all 20 genotyped members of the Utah pedigree
            and absent from 500 ancestry-matched control chromosomes.
        - name: c.1861C>T (p.Arg621Cys)
          description: A second substitution at the same residue, reported in an Italian father and daughter.
        - name: c.1637C>A (p.Thr546Lys)
          description: A homozygous allele in two brothers of consanguineous parents, producing a more
            severe phenotype than either heterozygous Arg621 allele.
      selected_evidence:
        snippet: We mapped the locus causing a novel disorder characterized by camptodactyly, tall stature,
          scoliosis, and hearing loss (CATSHL syndrome) to chromosome 4p.
        supports: SUPPORT
