        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: catshl_bidirectional_cochlear_failure
        kind: KNOWLEDGE_GAP
        prompt: Why does either too little or too much FGFR3 signaling cause deafness?
        rationale: Loss of Fgfr3 abolishes pillar cell differentiation; the activating Y367C allele produces
          fully penetrant deafness with an increased number of pillar or modified supporting cells. The
          organ of Corti therefore fails in both directions from an intermediate optimum, which is unusual
          and is not explained by a simple dose-response model of the receptor. Whether the two deafnesses
          share a final common lesion or are distinct failures of the same patterning step is unknown,
          and the answer would constrain how the human hearing loss is expected to progress.
        attaches_to:
        - pathophysiology#Failure of Cochlear Pillar Cell Differentiation
      selected_evidence:
        snippet: The mutant Fgfr3(Y367C/+) mice exhibit fully penetrant deafness with a significantly
          elevated auditory brainstem response threshold for all frequencies tested.
        supports: SUPPORT
