  89a3cd012d3d8ce817168d9d4e0dc4ae57edb2215bd9213f7abc59c8dc2adb7b:
    claim:
      about:
        disease:
          name: CATSHL Syndrome
          disease_term:
            preferred_term: CATSHL syndrome
            term:
              id: MONDO:0012504
              label: camptodactyly-tall stature-scoliosis-hearing loss syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: FGFR3 Kinase-Domain Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: A germline missense substitution in the FGFR3 tyrosine kinase domain reduces receptor
          kinase activity. The recurrent dominant allele replaces Arg621 in the catalytic loop, the residue
          that positions the transferred phosphate and is invariant across the tyrosine kinase superfamily;
          the recessive allele replaces Thr546 elsewhere in the same domain. The dominant alleles are
          unlikely to act by haploinsufficiency - the original authors give three reasons, of which the
          strongest is that heterozygous Fgfr3-null mice are normal - and a dominant-negative heterodimer
          with the wild-type receptor is the proposed alternative. That proposal has not been tested biochemically
          in a CATSHL allele, so the entry treats the direction of effect as established and the dominant-negative
          mechanism as the working model rather than a finding.
        gene:
          preferred_term: FGFR3
          description: Fibroblast growth factor receptor 3, carrying a kinase-domain missense variant
            that reduces receptor activity.
          modifier: LOSS_OF_FUNCTION
          term:
            id: hgnc:3690
            label: FGFR3
        molecular_functions:
        - preferred_term: fibroblast growth factor receptor activity
          term:
            id: GO:0005007
            label: fibroblast growth factor receptor activity
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: FGFR3
            term:
              id: hgnc:3690
              label: FGFR3
          allele_type: MISSENSE
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          zygosity: HETEROZYGOUS
          notes: Describes the two dominant Arg621 alleles, which is the common genotype. PARTIAL_LOSS_OF_FUNCTION
            rather than LOSS_OF_FUNCTION because the founding report describes the substitution as causing
            partial loss of FGFR3 function, and DOMINANT_NEGATIVE is deliberately not used even though
            it is the proposed mechanism - it has never been demonstrated, which is what the catshl_dominant_negative_untested
            discussion is about. The p.Thr546Lys allele is homozygous and is not covered by this block;
            its zygosity is recorded on the variant and in the inheritance section.
      selected_evidence:
        snippet: These observations suggest that p.R621H might, instead, cause loss of FGFR3 function
          by a dominant negative mechanism.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17033969
      reference_title: A novel mutation in FGFR3 causes camptodactyly, tall stature, and hearing loss
        (CATSHL) syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' own proposal for how a heterozygous allele produces loss of function.
        Graded INDIRECT because the sentence is an inference from the arguments against haploinsufficiency,
        not a demonstration of heterodimer inhibition.
