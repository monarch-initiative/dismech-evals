        name: Autosomal recessive
        description: 'One consanguineous Egyptian family carries a different allele, p.Thr546Lys, in the
          homozygous state, with unaffected heterozygous relatives. So CATSHL is not a single inheritance
          mode: the two reported Arg621 substitutions act dominantly, and this one does not act at all
          in the heterozygous state. Whether that difference is a property of the residue or of the substitution
          has not been tested.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: We report the phenotype and underlying molecular abnormality in two brothers, born to
          first cousin parents.
        supports: SUPPORT
