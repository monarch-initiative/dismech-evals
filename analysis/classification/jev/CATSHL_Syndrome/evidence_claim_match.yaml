      assertion_type: Pathophysiology
      assertion:
        name: Reduced MAPK/ERK Output in Growth Plate Chondrocytes
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'In the proliferative and prehypertrophic growth plate, ligand-activated FGFR3 signals
          through MAPK/ERK to inhibit chondrocyte proliferation and hypertrophic differentiation. This
          is the step that makes FGFR3 a negative regulator of bone growth, and it is what a loss-of-function
          allele removes. The direction is the point: every other FGFR3 skeletal disorder in this knowledge
          base sits at the opposite end of the same axis.'
        cell_types:
        - preferred_term: Growth plate chondrocyte
          term:
            id: CL:1000217
            label: growth plate cartilage chondrocyte
        biological_processes:
        - preferred_term: fibroblast growth factor receptor signaling pathway
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
          modifier: DECREASED
        - preferred_term: ERK1 and ERK2 cascade
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
          modifier: DECREASED
      selected_evidence:
        snippet: Thus, FGFR-3 appears to regulate endochondral ossification by an essentially negative
          mechanism, limiting rather than promoting osteogenesis.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
