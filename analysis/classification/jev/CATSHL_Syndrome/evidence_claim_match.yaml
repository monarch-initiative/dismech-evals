  5f8f2de3d88c6eb9b5a82799970d2a6ffd5f304825165848ba71d856a6676cd3:
    claim:
      about:
        disease:
          name: CATSHL Syndrome
          disease_term:
            preferred_term: CATSHL syndrome
            term:
              id: MONDO:0012504
              label: camptodactyly-tall stature-scoliosis-hearing loss syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: catshl_dominant_negative_untested
        kind: KNOWLEDGE_GAP
        prompt: Do the Arg621 alleles act as dominant negatives, and if so does the mutant receptor actually
          inhibit its wild-type partner?
        rationale: 'The dominant-negative model is the only explanation on offer, and the arguments against
          haploinsufficiency are good ones. But the positive claim has never been tested: nobody has shown
          that mutant FGFR3 heterodimerises with the wild-type receptor and suppresses its kinase activity.
          The evidence offered is that mutant and wild-type transcripts are expressed at comparable levels
          and both proteins reach the membrane, which is consistent with a dominant negative and equally
          consistent with a simple hypomorph whose threshold effects differ between tissues. The distinction
          matters for whether the two Arg621 substitutions and the Thr546Lys allele share one mechanism.'
        attaches_to:
        - pathophysiology#FGFR3 Kinase-Domain Loss of Function
      selected_evidence:
        snippet: For several reasons, it is unlikely that the loss of function caused by p.R621H results
          from haploinsufficiency.
        supports: SUPPORT
