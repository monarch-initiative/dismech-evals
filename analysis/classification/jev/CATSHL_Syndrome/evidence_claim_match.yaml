      assertion_type: Pathophysiology
      assertion:
        name: Failure of Cochlear Pillar Cell Differentiation
        biological_scale: TISSUE
        role: consequence
        mechanism_confidence: ESTABLISHED
        description: 'FGFR3 is expressed in the cochlear supporting cells that become pillar cells, and
          losing it prevents pillar cell differentiation and tunnel of Corti formation, producing sensorineural
          deafness with a structurally normal middle and inner ear on imaging. This explains an otherwise
          puzzling feature of the clinical picture: the hearing loss is sensorineural and profound while
          CT and MRI are normal, because the defect is at the level of cell identity within the organ
          of Corti rather than of gross morphogenesis.'
        locations:
        - preferred_term: organ of Corti
          term:
            id: UBERON:0002227
            label: spiral organ of cochlea
        cell_types:
        - preferred_term: Cochlear pillar cell
          term:
            id: CL:1000191
            label: pillar cell
        biological_processes:
        - preferred_term: inner ear morphogenesis
          term:
            id: GO:0042472
            label: inner ear morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Inner ear defects include failure of pillar cell differentiation and tunnel of Corti
          formation and result in profound deafness.
        supports: SUPPORT
        directness: DIRECT
