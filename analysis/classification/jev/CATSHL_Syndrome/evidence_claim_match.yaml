              label: camptodactyly-tall stature-scoliosis-hearing loss syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chondroma-like Lesion Formation
        biological_scale: TISSUE
        role: consequence
        mechanism_confidence: PROVISIONAL
        description: 'Disordered growth plates lacking FGFR3 generate enchondroma- and osteochondroma-like
          cartilage lesions in mice. Several members of the Utah pedigree had a solitary osteochondroma
          of the femur, tibia or a phalanx, which is the human observation this node is anchored to. The
          link between the two is not established: the human lesions are solitary and were not examined
          for hedgehog activity, while the mouse lesions are multiple and mechanistically dissected, so
          the node records a plausible correspondence rather than a demonstrated one.'
      selected_evidence:
        snippet: we found that postnatal chondrocyte-specific Fgfr3 deletion induced multiple chondroma-like
          lesions, including enchondromas and osteochondromas, adjacent to disordered growth plates.
        supports: SUPPORT
        directness: DIRECT
