          bones formed by endochondral ossification are affected, which is why the radiographic signature
          is tall vertebral bodies and long tubular shafts rather than a generalized bone abnormality.
          Overlong vertebral bodies are also the mechanical origin of the scoliosis, so the spinal deformity
          is a consequence of the overgrowth rather than an independent feature.
        locations:
        - preferred_term: growth plate cartilage
