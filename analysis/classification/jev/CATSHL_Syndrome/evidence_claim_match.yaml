          term:
            id: GO:0003416
            label: endochondral bone growth
          modifier: INCREASED
      selected_evidence:
        snippet: We have identified a role for fibroblast growth factor receptor 3 (FGFR-3) in this process
          by disrupting the murine Fgfr-3 gene to produce severe and progressive bone dysplasia with enhanced
          and prolonged endochondral bone growth.
        supports: SUPPORT
        directness: DIRECT
