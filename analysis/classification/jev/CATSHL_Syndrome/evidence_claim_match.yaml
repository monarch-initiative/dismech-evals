  ed9dce29966fd8bde89f211373ffd62baf8d8ddc373d3e092275e1dd5719e288:
    claim:
      about:
        disease:
          name: CATSHL Syndrome
          disease_term:
            preferred_term: CATSHL syndrome
            term:
              id: MONDO:0012504
              label: camptodactyly-tall stature-scoliosis-hearing loss syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: catshl_craniofacial_model_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Why do CATSHL patients have craniofacial abnormalities and microcephaly when Fgfr3-deficient
          mice have no craniofacial phenotype at all?
        rationale: 'The mouse reproduces the two features that made it the candidate model - skeletal
          overgrowth and deafness - and reproduces them well. It does not reproduce microcephaly, high
          palate or wormian bones, which are recorded in the human families. This is not a gap in evidence
          but a discordance between species: the measurement has been made in the mouse and the answer
          is negative. The zebrafish does show microcephaly and delayed suture closure, which makes the
          mouse the outlier rather than the human, but zebrafish craniofacial development is far enough
          from human that it cannot settle the mechanism. Until it is resolved, the craniofacial and neurodevelopmental
          features of CATSHL have no model system that both shows them and is close enough to human to
          interpret.'
        attaches_to:
        - phenotypes#Microcephaly
        - phenotypes#High Palate
        - phenotypes#Wormian Bones
        - phenotypes#Developmental Delay and Intellectual Disability
      selected_evidence:
        snippet: The reason for the discrepant in the craniofacial phenotypes between mouse model and
          patients remains to be studied.
        supports: SUPPORT
