        description: The principal differential. CBL-related disorder presents with clinical features
          fitting or partially overlapping Noonan syndrome, the most common RASopathy, and is resolved
          by molecular testing. The JMML predisposition and the later vasculopathy are characteristic
          of the CBL phenotype, while cardiac defects — a Noonan hallmark — are comparatively uncommon.
        distinguishing_features:
        - A pathogenic CBL variant supports CBL-related disorder, whereas PTPN11, SOS1, RAF1, or RIT1
          variants favour classic Noonan syndrome.
        - Predisposition to often self-remitting JMML, and later vasculitis or moyamoya arteriopathy,
          is characteristic of CBL-related disorder.
        - Cardiac defects, reduced growth, and cryptorchidism are of comparatively low prevalence in the
          CBL phenotype.
