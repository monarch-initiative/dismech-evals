        snippet: Genotype-phenotype correlation analysis performed on available records indicated that
          germline CBL mutations cause a variable phenotype characterized by a relatively high frequency
          of neurological features, predisposition to juvenile myelomonocytic leukemia, and low prevalence
          of cardiac defects, reduced growth, and cryptorchidism.
        supports: SUPPORT
