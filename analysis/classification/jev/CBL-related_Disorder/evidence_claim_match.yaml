              phenotype with predisposition to juvenile myelomonocytic leukemia and vasculopathy.
            term:
              id: MONDO:0013308
              label: CBL-related disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cbl_tumor_risk_beyond_jmml
        prompt: Beyond juvenile myelomonocytic leukemia, what is the lifetime tumor risk in germline CBL-related
          disorder, and does the acquired 11q23 copy-neutral loss-of-heterozygosity mechanism predispose
          to germ cell tumors as a reproducible second tumor class?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Acquired 11q Isodisomy and Biallelic CBL Inactivation
        - pathophysiology#Juvenile Myelomonocytic Leukemia
        rationale: The same copy-neutral 11q23 LOH second hit that produces JMML has been documented in
          three teratomas from a single patient, which would imply a tumor-predisposition mechanism that
          is not tissue-restricted to the myeloid compartment. That observation rests on one case report,
          so the entry records the mechanism without asserting a quantified extra-hematologic tumor risk
          or recommending a surveillance protocol.
        proposed_experiments:
        - experiment_id: exp_cbl_extrahematologic_tumor_surveillance
          experiment_design: HUMAN_OBSERVATIONAL
          name: Prospective tumor surveillance with 11q23 LOH genotyping in a germline-CBL cohort
          description: Assemble an international registry of individuals with a confirmed germline CBL
            variant and follow them prospectively for any incident neoplasm. Genotype every available
            tumor specimen for copy-neutral loss of heterozygosity at 11q23 and for the germline allele,
            and compare observed tumor incidence against age- and sex-matched population rates.
          decision_criterion: Recurrent non-myeloid tumors carrying the 11q23 second hit at above-background
            incidence would establish a broader tumor-predisposition syndrome and justify a surveillance
            protocol; absence of such tumors across an adequately powered cohort would confine the predisposition
            to the myeloid compartment.
      selected_evidence:
        snippet: Copy neutral loss of heterozygosity for the CBL mutation due to acquired segmental uniparental
          disomy of 11q23 was observed in three teratomas, suggesting a specific association of CBL mutations
          in germ cell tumor predisposition.
        supports: SUPPORT
        directness: INDIRECT
