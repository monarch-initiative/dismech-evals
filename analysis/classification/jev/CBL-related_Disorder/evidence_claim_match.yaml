            term:
              id: MONDO:0013308
              label: CBL-related disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Receptor Tyrosine Kinase Down-Regulation
        description: CBL normally controls proliferative signalling by ubiquitinating and down-regulating
          growth-factor (receptor tyrosine kinase) signalling cascades. When CBL ligase function is lost,
          this negative feedback fails and receptor-driven signalling persists, feeding forward into the
          RAS-MAPK pathway.
      selected_evidence:
        snippet: CBL, an E3 ubiquitin ligase and a multi-adaptor protein, controls proliferative signalling
          networks by downregulating the growth factor receptor signalling cascades in various cell types.
        supports: SUPPORT
