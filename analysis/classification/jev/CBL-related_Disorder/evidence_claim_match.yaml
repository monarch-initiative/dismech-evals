        description: 'In children presenting with early-onset moyamoya angiopathy, CBL-related disorder
          is an important differential for apparently non-syndromic moyamoya disease, because CBL-mutated
          probands may show only subtle RASopathy signs and may never develop JMML. This is a diagnostically
          consequential differential rather than a phenotypic look-alike: it changes whether the child
          is entered into hematologic and RASopathy surveillance.'
        distinguishing_features:
        - Germline CBL testing is recommended in early-onset moyamoya even when RASopathy features are
          absent or subtle.
        - A germline CBL variant carries JMML and RASopathy surveillance implications that isolated moyamoya
          disease does not.
