          is the first hit, and somatic copy-neutral loss of heterozygosity of the 11q23 region (acquired
          isodisomy removing the normal CBL allele) is the positively selected second hit in the leukemic
          clone. The resulting JMML is frequently self-remitting, though vasculitis may emerge later.'
        cell_types:
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
      selected_evidence:
        snippet: JMML specimens from affected children show loss of the normal CBL allele through acquired
          isodisomy.
        supports: SUPPORT
