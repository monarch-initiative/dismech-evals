        description: 'Noonan syndrome is the principal differential: CBL-related disorder presents with
          clinical features fitting or partially overlapping Noonan syndrome, the most common RASopathy.
          Molecular testing identifying a CBL variant (versus PTPN11, SOS1, RAF1, RIT1, or other Noonan
          genes) resolves the distinction, and the JMML predisposition with later vasculopathy is characteristic
          of the CBL phenotype.'
        distinguishing_features:
        - A pathogenic CBL variant supports CBL-related disorder, whereas PTPN11/SOS1/RAF1/RIT1 variants
          favor classic Noonan syndrome.
        - Predisposition to (often self-remitting) JMML and later vasculitis/vasculopathy is characteristic
          of CBL-related disorder.
