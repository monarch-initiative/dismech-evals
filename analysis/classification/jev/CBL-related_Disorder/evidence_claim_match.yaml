  7a658bbc6bc6a3c467c614d39bde7ca116bc230824b17e37d04ac199c7dcccd3:
    claim:
      about:
        disease:
          name: CBL-related Disorder
          disease_term:
            preferred_term: CBL-related disorder
            description: An autosomal dominant RASopathy caused by germline CBL variants that impair E3-ubiquitin-ligase-mediated
              termination of receptor tyrosine kinase signaling, producing a Noonan-like developmental
              phenotype with predisposition to juvenile myelomonocytic leukemia and vasculopathy.
            term:
              id: MONDO:0013308
              label: CBL-related disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cbl_phenotype_determinants
        prompt: What determines which germline CBL carriers develop juvenile myelomonocytic leukemia,
          which develop isolated early-onset moyamoya angiopathy with only subtle RASopathy signs, and
          which regress spontaneously versus progressing to require transplantation?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Myeloid Progenitor Cytokine Hypersensitivity
        - pathophysiology#Cerebral and Systemic Vasculopathy
        - pathophysiology#Juvenile Myelomonocytic Leukemia
        rationale: Two probands carrying CBL variants that had previously been reported in JMML-predisposing
          Noonan-like disease instead presented with severe infancy-onset moyamoya and never developed
          leukemia, so allele identity alone does not predict which arm of the phenotype manifests. Because
          the management decision that matters most clinically — observe versus transplant — turns on
          this, the absence of a predictor is a substantive gap rather than a descriptive one.
        proposed_experiments:
        - experiment_id: exp_cbl_genotype_stratified_natural_history
          experiment_design: HUMAN_OBSERVATIONAL
          name: Genotype-stratified natural history with clonal-architecture sequencing
          description: Follow germline CBL carriers prospectively with serial blood counts and cerebrovascular
            imaging, stratified by germline allele. In parallel, use serial deep sequencing of hematopoietic
            samples to measure the timing and clone size of the acquired 11q23 second hit, and test whether
            second-hit kinetics rather than germline allele identity separate the leukemic, spontaneously
            regressing, and cerebrovascular-predominant courses.
          decision_criterion: A reproducible association between second-hit timing or clone size and subsequent
            course would support clonal-kinetics-based risk stratification; segregation by germline allele
            instead would support allele-based counselling; neither would indicate an unidentified modifier.
      selected_evidence:
        snippet: Notably, the two mutated girls never developed JMML and presented only subtle signs of
          RASopathy that did not lead to evoke this diagnosis during follow-up.
        supports: SUPPORT
    origin:
