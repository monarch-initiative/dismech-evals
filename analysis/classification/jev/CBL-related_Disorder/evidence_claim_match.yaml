      assertion_type: Genetic
      assertion:
        name: CBL
        gene_term:
          preferred_term: CBL
          term:
            id: hgnc:1541
            label: CBL
        association: Heterozygous germline pathogenic variants (autosomal dominant)
        notes: CBL encodes a multivalent adaptor protein with E3 ubiquitin ligase activity that acts as
          a tumor suppressor in myeloid malignancy. Germline pathogenic variants are typically missense
          changes in the RING finger domain or adjacent linker (recurrent p.Tyr371His), with splice-site,
          in-frame deletion, and v-Cbl-like nonsense alleles also reported. Leukemic and teratomatous
          tissue additionally shows acquired copy-neutral loss of heterozygosity at 11q23, converting
          the germline heterozygous allele to homozygosity.
      selected_evidence:
        snippet: Independent CBL mutations were identified in two sporadic cases and two families from
          among 365 unrelated subjects who had NS or suggestive features and were negative for mutations
          in previously identified disease genes.
        supports: SUPPORT
