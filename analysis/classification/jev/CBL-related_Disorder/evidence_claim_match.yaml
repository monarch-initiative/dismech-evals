    claim:
      about:
        disease:
          name: CBL-related Disorder
          disease_term:
            preferred_term: CBL-related disorder
            description: An autosomal dominant RASopathy caused by heterozygous germline missense variants
              in the CBL E3 ubiquitin ligase gene, presenting with a Noonan-syndrome-like developmental
              phenotype and a predisposition to juvenile myelomonocytic leukemia.
            term:
              id: MONDO:0013308
              label: CBL-related disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CBL Loss-of-Function and Impaired E3 Ubiquitin Ligase Activity
        description: Heterozygous germline missense variants cluster in the RING finger domain of CBL
          (and the linker connecting it to the N-terminal tyrosine-kinase-binding domain), the same mutational
          hot spot seen in myeloid malignancies. CBL is an E3 ubiquitin ligase, so these variants impair
          its ubiquitin-ligase function - the molecular starting point of the disorder.
        genes:
        - preferred_term: CBL
          term:
            id: hgnc:1541
            label: CBL
        biological_processes:
        - preferred_term: protein ubiquitination
          term:
            id: GO:0016567
            label: protein ubiquitination
          modifier: DECREASED
      selected_evidence:
        snippet: Mutations were missense changes altering evolutionarily conserved residues located in
          the RING finger domain or the linker connecting this domain to the N-terminal tyrosine kinase
          binding domain, a known mutational hot spot in myeloid malignancies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
