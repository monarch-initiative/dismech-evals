              label: CCDC115-CDG
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired V-ATPase Assembly and Organelle Acidification
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'The V-ATPase acidifies intracellular organelles, and that pH sets several downstream
          processes - glycosyltransferase activity in the Golgi, lysosomal acid lipase activity, and autophagy.
          Losing an assembly factor therefore produces a defect that is not confined to one enzyme.

          The evidence that the acidification step is genuinely impaired, rather than inferred from the
          yeast homology, comes from hepatocyte models: silencing CCDC115 in HepG2 cells produces impaired
          lysosomal acidification together with impaired autophagic capacity. That is a lysosomal readout
          rather than a Golgi one, which is worth noting - the Golgi pH defect itself has been argued
          from the glycosylation phenotype rather than measured directly in these patients'' cells.'
        biological_processes:
        - preferred_term: proton transmembrane transport
          term:
            id: GO:1902600
            label: proton transmembrane transport
          modifier: DECREASED
        - preferred_term: regulation of intracellular pH
          term:
            id: GO:0051453
            label: regulation of intracellular pH
          modifier: ABNORMAL
        - preferred_term: autophagy
          term:
            id: GO:0006914
            label: autophagy
          modifier: DECREASED
      selected_evidence:
        snippet: Further investigation of lysosomal function revealed impaired acidification combined
          with impaired autophagic capacity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
