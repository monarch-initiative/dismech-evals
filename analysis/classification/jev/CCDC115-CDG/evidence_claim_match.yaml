      assertion_type: Diagnosis
      assertion:
        name: Plasma glycosylation screening in unexplained liver disease
        description: 'The diagnostic route is transferrin glycosylation screening, which shows a type
          II (Golgi) pattern, followed by molecular confirmation. The practical recommendation from the
          case literature is to screen for CDG in any patient with unexplained and severe liver disease,
          because the presentation is otherwise indistinguishable from commoner diagnoses.

          A second route exists and has already yielded patients: exome sequencing in people with a Wilson-disease
          phenotype in whom biallelic ATP7B variants cannot be found. Two affected siblings were identified
          that way.'
      selected_evidence:
        snippet: Besides pointing to the importance of CDG screening in patients with unexplained and
          severe liver disease, these reports expand the clinical and molecular phenotypes of CCDC115-CDG.
        supports: SUPPORT
