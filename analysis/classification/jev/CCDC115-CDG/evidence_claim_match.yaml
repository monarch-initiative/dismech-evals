            term:
              id: MONDO:0014789
              label: CCDC115-CDG
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Lysosomal Lipid Accumulation and Failed Lipophagy
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'Silencing CCDC115 in HepG2 hepatocytes increases the number and size of lipid droplets,
          including abnormally large ones that colocalise with lysosomes, without excessive de novo lipogenesis,
          failing oxidative capacity or elevated lipid uptake. The proposed mechanism is therefore a failure
          of lipophagy - lipid that reaches the lysosome and is not degraded - rather than lipid overproduction.

          The hypercholesterolemia follows from this rather than being a separate lesion: apolipoprotein
          B secretion is markedly increased in the silenced cells, and the patients'' hyperlipidemia is
          in the very-low-density lipoprotein range, with no mutation in any familial-hypercholesterolemia
          gene or in LIPA.

          This node is deliberately cellular. The tissue-level steatosis it produces is the phenotype
          downstream of it, not part of it - keeping them separate means the cell-biology claim and the
          clinical finding can be graded and cited independently.'
        biological_processes:
        - preferred_term: lipophagy
          term:
            id: GO:0061724
            label: lipophagy
          modifier: DECREASED
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
      selected_evidence:
        snippet: Excessive de novo lipogenesis, failing oxidative capacity, and elevated lipid uptake
          were not observed.
        supports: SUPPORT
    origin:
