        context: []
      assertion_type: Genetic
      assertion:
        name: CCDC115
        gene_term:
          preferred_term: CCDC115
          term:
            id: hgnc:28178
            label: CCDC115
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'A naming point that will confuse anyone matching gene symbols, and a provenance disagreement
          worth recording rather than smoothing over. The live HGNC REST API returns VMA22, "vacuolar
          ATPase assembly factor VMA22", for HGNC:28178, with CCDC115 as a previous symbol. The OBO HGNC
          build that this repository''s term validator resolves against still returns CCDC115, and binding
          VMA22 fails validation here. The disease name, every paper, and the MONDO label say CCDC115.

          This entry binds CCDC115 because that is what the configured authority says and what the literature
          uses. The consequence to be aware of is that a query matching this entry against a current HGNC
          download will not match on symbol - it will need the HGNC ID. The right fix is a refresh of
          the OBO HGNC build, not a per-entry workaround, so nothing is worked around here.

          Two recurrent alleles carry most of the reported caseload: c.92T>C p.(Leu31Ser), homozygous
          in several unrelated families and also seen in trans with a whole-gene deletion, and c.31G>T
          p.(Asp11Tyr). Only thirteen patients had been reported as of the 2025 review, so any statement
          about allele frequency or genotype-phenotype correlation in this disease rests on a denominator
          small enough to name.'
      selected_evidence:
        snippet: An additional homozygous missense mutation, c.31G>T (p.Asp11Tyr), was found in a family
          with two affected siblings.
        supports: SUPPORT
