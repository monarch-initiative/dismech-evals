              label: CCDC115-CDG
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CCDC115 Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'CCDC115 is the human reciprocal homolog of Vma22p, the yeast V-ATPase assembly factor,
          identified by PSI-BLAST rather than by sequence similarity obvious at first inspection - the
          gene''s function was unknown when the disease was found. The protein localises mainly to the
          ER-Golgi intermediate compartment and to COPI vesicles, and notably not to the endoplasmic reticulum
          where its yeast homolog sits.

          Two alleles carry most of the reported caseload: c.92T>C p.(Leu31Ser), which recurs across unrelated
          families, and c.31G>T p.(Asp11Tyr). Homozygosity for p.(Leu31Ser) has been associated with higher
          serum transaminase levels in a review of all reported patients, which is the only genotype-phenotype
          correlation proposed so far and rests on thirteen individuals.'
        genes:
        - preferred_term: CCDC115
          term:
            id: hgnc:28178
            label: CCDC115
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: PSI-BLAST homology detection revealed reciprocal homology with Vma22p, the yeast V-ATPase
          assembly factor located in the endoplasmic reticulum (ER). Human CCDC115 mainly localized to
          the ERGIC and to COPI vesicles, but not to the ER.
        supports: SUPPORT
