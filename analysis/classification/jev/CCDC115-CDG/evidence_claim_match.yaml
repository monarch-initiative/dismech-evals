      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other congenital disorders of glycosylation with predominant liver involvement
        description: Liver involvement occurs in only about a fifth of CDG types, and a small number have
          it as the predominant or isolated feature - MPI-CDG, TMEM199-CDG, CCDC115-CDG and ATP6AP1-CDG.
          MPI-CDG is the one worth identifying first because it is treatable with oral mannose. The larger
          group, including PMM2-CDG, has liver disease as one feature among many.
      selected_evidence:
        snippet: 'We distinguish two main groups: on the one hand, the CDG types with predominant or isolated
          liver involvement including MPI-CDG, TMEM199-CDG, CCDC115-CDG, and ATP6AP1-CDG'
