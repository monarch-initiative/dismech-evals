        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Combined N- and O-Glycosylation Defect
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'Serum proteins show abnormal N-glycosylation and abnormal mucin-type O-glycosylation
          - the combined pattern that distinguishes Golgi-homeostasis defects from the earlier, ER-based
          congenital disorders of glycosylation. Fibroblasts show reduced metabolic labelling of sialic
          acids.

          The complementation result is what makes this causal rather than correlative: restoring wild-type
          CCDC115 in patient fibroblasts restores sialic acid labelling. It is also, in practice, the
          diagnostic handle - the disease is identifiable by screening plasma for abnormal glycosylation,
          which is why it turns up in patients being investigated for something else.'
        biological_processes:
        - preferred_term: protein N-linked glycosylation
          term:
            id: GO:0006487
            label: protein N-linked glycosylation
          modifier: DECREASED
        - preferred_term: mucin-type O-glycosylation
          term:
            id: GO:0016266
            label: protein O-linked glycosylation via N-acetylgalactosamine
          modifier: DECREASED
        - preferred_term: Golgi organization
          term:
            id: GO:0007030
            label: Golgi organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: Abnormal N- and mucin type O-glycosylation was found on serum proteins, and reduced metabolic
          labeling of sialic acids was found in fibroblasts, which was restored after complementation
          with wild-type CCDC115.
        supports: SUPPORT
