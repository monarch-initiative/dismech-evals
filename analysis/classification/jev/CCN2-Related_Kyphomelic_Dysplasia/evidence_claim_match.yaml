      assertion_type: DifferentialDiagnosis
      assertion:
        name: KIF5B-Related Kyphomelic Dysplasia
        description: The other molecularly defined form of kyphomelic dysplasia, and the primary differential.
          It is caused by de novo heterozygous KIF5B variants and is therefore dominant rather than recessive,
          arises in a kinesin motor protein rather than a matricellular protein, and characteristically
          adds postnatal osteoporosis with fractures and optic atrophy — none of which are features of
          the CCN2 form. Family structure alone is suggestive (consanguinity and sibling recurrence versus
          a sporadic de novo case), but the two are properly separated by sequencing.
      selected_evidence:
        snippet: Our findings suggest that heterozygous KIF5B deleterious variants cause a specific form
          of kyphomelic dysplasia.
        supports: SUPPORT
