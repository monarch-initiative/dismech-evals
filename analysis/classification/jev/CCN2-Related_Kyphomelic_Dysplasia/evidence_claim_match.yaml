  4d5d2e0c268b28dc8d8bceced1bfffaa11af9d55e0f37acb72c161a08db0d8fd:
    claim:
      about:
        disease:
          name: CCN2-Related Kyphomelic Dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Hypertrophic-Zone Matrix Remodeling and Growth-Plate Angiogenesis
        biological_scale: TISSUE
        role: central_effector
        mechanism_confidence: PROVISIONAL
        description: 'Mouse work on the Ctgf null defines the step between the chondrocyte defect and
          the malformed bone: matrix composition within the growth plate''s hypertrophic zone is disturbed,
          and VEGF expression in that zone falls, coupling the cartilage defect to failure of the vascular
          invasion that endochondral ossification depends on. CCN2 is on this account a coordinator of
          chondrogenesis and angiogenesis rather than a chondrocyte-autonomous factor. The node is PROVISIONAL
          because this entire intermediate chain is mouse-derived: the human evidence establishes that
          CCN2 causes the disease, not that these are the steps by which it does so.'
        biological_processes:
        - preferred_term: cartilage development
          modifier: ABNORMAL
          term:
            id: GO:0051216
            label: cartilage development
        cell_types:
        - preferred_term: Hypertrophic chondrocyte
          term:
            id: CL:0000743
            label: hypertrophic chondrocyte
      selected_evidence:
        snippet: Ctgf deficiency leads to skeletal dysmorphisms as a result of impaired chondrocyte proliferation
          and extracellular matrix composition within the hypertrophic zone.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:12736220
      reference_title: Connective tissue growth factor coordinates chondrogenesis and angiogenesis during
        skeletal development.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the hypertrophic-zone matrix defect as the route from CCN2 loss to skeletal
        dysmorphism in the mouse.
