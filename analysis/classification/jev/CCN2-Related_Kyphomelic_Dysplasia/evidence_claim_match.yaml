      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: Two unrelated consanguineous families with six affected offspring between them, each
          segregating a homozygous CCN2 variant with the phenotype. The consanguinity and the segregation
          together establish recessive inheritance, and distinguish this form from the dominant de novo
          KIF5B form.
      selected_evidence:
        snippet: 'We noted two novel homozygous variants in CCN2 as possible candidates that segregated
          with the phenotype in the families: a missense variant c.443G>A; p.(Cys148Tyr) in exon 3 and
          a frameshift variant, c.779_786del; p.(Pro260LeufsTer7) in exon 5.'
        supports: SUPPORT
