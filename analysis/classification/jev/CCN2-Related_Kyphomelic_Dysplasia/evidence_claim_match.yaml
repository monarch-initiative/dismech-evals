        name: CCN2
        gene_term:
          preferred_term: CCN2
          term:
            id: hgnc:2500
            label: CCN2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        frequency: Biallelic in all reported patients
        notes: 'CCN2 (formerly CTGF) encodes a matricellular protein of the CCN family required for chondrocyte
          proliferation and differentiation. The two reported pathogenic alleles are homozygous: a missense
          p.(Cys148Tyr) and a frameshift p.(Pro260LeufsTer7). Cross-species support is unusually good
          for a two-family gene-disease assertion — the Ccn2-null mouse and a CRISPR-Cas9 ccn2a zebrafish
          knockout both show concordant skeletal and craniofacial phenotypes.'
      selected_evidence:
        snippet: Our observations in humans and zebrafish combined with previously described skeletal
          phenotype of Ccn2 knock out mice, confirm that biallelic loss of function variants in CCN2 result
          in an autosomal recessive kyphomelic dysplasia.
        supports: SUPPORT
