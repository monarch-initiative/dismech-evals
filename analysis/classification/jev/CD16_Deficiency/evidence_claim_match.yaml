        description: 'Symptomatic individuals reported to date carry the FCGR3A L66H substitution in the
          homozygous state, and heterozygous relatives have not been described as affected, so inheritance
          is recorded as autosomal recessive. That recording should be read with the penetrance caveat:
          homozygosity is common in the general population and at least one homozygote is clinically well,
          so homozygosity is not by itself sufficient for disease. The common FCGR3A V158F polymorphism
          that modulates ADCC is a separate allele with a different functional consequence and should
          not be conflated with L66H.'
      selected_evidence:
        snippet: homozygous for a T to A substitution at position 230 of CD16-II cDNA, predicting a Leu(66)
          to His(66) change in the first immunoglobulin domain
        supports: SUPPORT
