      assertion_type: Pathophysiology
      assertion:
        name: Failure of CD16-CD2 Association
        biological_scale: MOLECULAR
        description: In healthy NK cells CD16 associates biochemically with CD2, a coactivation receptor,
          and the two co-cluster at the lytic immunological synapse, so that engaging CD2 elicits CD16
          signalling. The L66H receptor does not enter this association, and CD2 ligation no longer triggers
          CD16 signalling. Note that the synapse still forms; what fails is the CD16-CD2 partnership within
          it.
        cell_types:
        - preferred_term: CD16-positive, CD56-dim natural killer cell
          term:
            id: CL:0000939
            label: CD16-positive, CD56-dim natural killer cell, human
        molecular_functions:
        - preferred_term: cell adhesion molecule binding
          term:
            id: GO:0050839
            label: cell adhesion molecule binding
          modifier: DECREASED
      selected_evidence:
        snippet: An association between CD16 and CD2 was identified biochemically and at the immunological
          synapse, which elicited CD16 signaling after CD2 engagement.
        supports: SUPPORT
