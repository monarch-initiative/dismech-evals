              id: MONDO:0014313
              label: autosomal recessive primary immunodeficiency with defective spontaneous natural killer
                cell cytotoxicity
        context: []
      assertion_type: Diagnosis
      assertion:
        name: FCGR3A sequencing
        description: 'Sanger sequencing of FCGR3A demonstrates the homozygous L66H substitution. Finding
          it is necessary but not sufficient: the allele is common, roughly a hundred homozygotes appear
          in gnomAD, and at least one homozygote is clinically well, so the genotype does not establish
          the diagnosis on its own and must be read alongside the paired functional assays and the clinical
          picture. There is also a practical retrieval problem - a filtered exome or panel pipeline may
          discard the variant as too common to report. Interpretation must additionally keep this allele
          distinct from the common FCGR3A V158F functional polymorphism and from FCGR3B copy-number variation,
          neither of which causes this syndrome.'
      selected_evidence:
        snippet: NGS may not report the L66H variant because it is observed in 7.1% of alleles of European
          ancestry
        supports: SUPPORT
