        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Expressing the patient allele in a CD16-null human NK line reproduced the loss of
          CD16-CD2 association and the loss of CD16 signalling after CD2 ligation.
        limitations: NK-92 is a transformed, IL-2-dependent NK lymphoma line rather than a primary NK
          cell, and the reconstituted receptor is expressed from a transgene rather than at endogenous
