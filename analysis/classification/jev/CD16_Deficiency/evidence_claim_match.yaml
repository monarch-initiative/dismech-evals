  be6988148bd1653099cd4d5f1a8d3254144ba9132795218a6933dcee4e68016f:
    claim:
      about:
        disease:
          name: CD16 Deficiency
          disease_term:
            preferred_term: CD16 deficiency
            term:
              id: MONDO:0014313
              label: autosomal recessive primary immunodeficiency with defective spontaneous natural killer
                cell cytotoxicity
        context: []
      assertion_type: Genetic
      assertion:
        name: FCGR3A
        gene_term:
          preferred_term: FCGR3A
          term:
            id: hgnc:3619
            label: FCGR3A
        relationship_type: DISPUTED
        variant_origin: GERMLINE
        association: 'FCGR3A encodes CD16a (Fc-gamma receptor IIIA), the low-affinity IgG Fc receptor
          expressed on CD56-dim natural killer cells, where it is the triggering receptor for antibody-dependent
          cellular cytotoxicity. The candidate allele is a single germline missense substitution in the
          membrane-distal immunoglobulin domain, carried homozygously. Because the receptor is still expressed
          and still binds Fc, it is a function-specific partial loss rather than a null.

          The relationship is recorded as DISPUTED rather than CAUSATIVE. Two homozygotes have a measured
          spontaneous-cytotoxicity defect, but a third had normal cytotoxicity and normal ADCC, a fourth
          is asymptomatic with normal NK lytic function, and the allele reaches roughly 5% frequency with
          about a hundred homozygotes in gnomAD. The most recent report concludes the variant is unlikely
          to be a direct genetic cause and proposes it as a low-penetrance risk factor instead. Curators
          should not treat an L66H homozygous genotype as diagnostic on its own.'
        variants:
        - name: FCGR3A L66H (reported as c.230T>A, c.197T>A, or p.L48H)
          description: 'The single allele reported in every described case. It disrupts the B73.1 monoclonal
            antibody epitope while leaving the 3G8 epitope and Fc binding intact. Recorded as of uncertain
            significance rather than pathogenic: about a hundred homozygotes appear in gnomAD, which is
            incompatible with a fully penetrant recessive immunodeficiency allele.'
          clinical_significance: UNCERTAIN_SIGNIFICANCE
      selected_evidence:
        snippet: A homozygous missense mutation in CD16 (encoding a L66H substitution) is associated with
          severe herpesvirus infections in rare patients.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23006327
      reference_title: Human immunodeficiency-causing mutation defines CD16 in spontaneous NK cell cytotoxicity.
      evidence_source: HUMAN_CLINICAL
      explanation: Associates the homozygous FCGR3A L66H allele with the clinical immunodeficiency in
        the affected patients.
