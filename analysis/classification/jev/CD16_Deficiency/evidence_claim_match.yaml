      assertion_type: Pathophysiology
      assertion:
        name: FCGR3A L66H Substitution
        biological_scale: MOLECULAR
        description: A homozygous T-to-A transversion at position 230 of the FCGR3A coding sequence replaces
          leucine 66 with histidine in the first (membrane-distal) immunoglobulin-like domain of CD16.
          The receptor is still made and still reaches the NK cell surface; the lesion is confined to
          the local conformation of one surface loop.
        genetic_context:
          genes:
          - preferred_term: FCGR3A
            term:
              id: hgnc:3619
              label: FCGR3A
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: c.230T>A, p.Leu66His. Structural modelling of the mutant against the solved wild-type
            CD16 ectodomain predicts a shift in the B73.1 epitope loop with the overall fold otherwise
            preserved, consistent with selective loss of one function (spontaneous cytotoxicity) while
            Fc binding and ADCC are retained. It is therefore recorded as a partial, function-specific
            loss rather than a null allele.
        cell_types:
        - preferred_term: CD16-positive, CD56-dim natural killer cell
          term:
            id: CL:0000939
            label: CD16-positive, CD56-dim natural killer cell, human
      selected_evidence:
        snippet: homozygous for a T to A substitution at position 230 of CD16-II cDNA, predicting a Leu(66)
          to His(66) change in the first immunoglobulin domain
        supports: SUPPORT
