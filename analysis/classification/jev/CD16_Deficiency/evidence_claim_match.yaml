            term:
              id: MONDO:0014313
              label: autosomal recessive primary immunodeficiency with defective spontaneous natural killer
                cell cytotoxicity
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Flow cytometry with paired anti-CD16 clones
        description: 'The flow signature is a discordance between two anti-CD16 antibodies on the same
          cells: NK cells stain normally with clone 3G8 but are not recognised by clone B73.1. A panel
          using only one anti-CD16 clone will report CD16 as normally expressed and miss the finding entirely,
          which is the practical reason this entity is under-recognised.

          It is a screening signal, not a diagnostic one. Loss of the B73.1 epitope can occur independently
          of the L66H substitution, so the discordance has to be confirmed by sequencing rather than treated
          as sufficient.'
      selected_evidence:
        snippet: loss of B73.1 epitope detection should always be combined with Sanger sequencing to confirm
          the presence of the L66H allele if it is suspected.
        supports: SUPPORT
