              label: immunodeficiency due to CD25 deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: IL2RA
        gene_term:
          preferred_term: IL2RA
          term:
            id: hgnc:6008
            label: IL2RA
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: IL2RA encodes CD25, the alpha chain of the interleukin-2 receptor. Reported disease
          alleles are germline biallelic loss-of-function variants (frameshift, splice-site, multi-exon
          deletion and missense) that abolish or prevent surface expression of the chain, so the gene-disease
          relationship is causative with an autosomal recessive loss-of-function mechanism. Common non-coding
          IL2RA regulatory polymorphisms are susceptibility alleles for type 1 diabetes and multiple sclerosis;
          those are a separate, polygenic relationship and are deliberately not curated here.
        variants:
        - name: Biallelic loss-of-function IL2RA variants
          description: Germline biallelic variants abolishing functional CD25, carried homozygous or compound
            heterozygous.
          clinical_significance: PATHOGENIC
        - name: c.166delC (p.R56fs)
          description: Novel homozygous frameshift allele in two siblings from one family, both of whom
            were transplanted. Nomenclature follows the source.
          clinical_significance: PATHOGENIC
        - name: c.65-2A>G
          description: Homozygous splice-acceptor allele at the invariant acceptor site of intron 2, one
            of the two Moroccan alleles. Nomenclature follows the source.
          clinical_significance: LIKELY_PATHOGENIC
        - name: c.557_795-1625del
          description: Homozygous multi-exon deletion, reported as the first structural null allele of
            IL2RA. Nomenclature follows the source.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: We describe here a novel human immune aberration arising from a truncation mutation of
          the interleukin-2 receptor alpha chain (CD25), a subunit of the tripartite high-affinity receptor
          for interleukin 2.
        supports: SUPPORT
