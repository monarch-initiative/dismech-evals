      assertion:
        name: Raised IL-2 Signaling Threshold with Deficient STAT5 Activation
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'In patient T cells the IL-2 concentration required to phosphorylate STAT5 is raised
          across every subset. The hierarchy is preserved rather than abolished: CD4+FOXP3+ cells still
          respond first, but only at medium and high IL-2, and never to the level of healthy controls.
          Because Tregs normally depend on continuous low-concentration IL-2, they bear the brunt of the
          shift.'
        cell_types:
        - preferred_term: CD4-positive, alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: interleukin-2-mediated signaling pathway
          term:
            id: GO:0038110
            label: interleukin-2-mediated signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: This data indicates that in the absence of CD25 surface expression 1) the threshold required
          for IL-2 signaling in all T cell subsets is raised, 2) CD4+FOXP3+ are the first to respond to
          IL-2 despite the absence of CD25, and 3) unlike in healthy donors, CD8+ T cells from CD25 null
          patients preferentially respond to IL-2 compared to CD4+FOXP3−.
        supports: SUPPORT
    origin:
