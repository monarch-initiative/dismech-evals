          partly paradoxical here, since strategies that work by favouring IL-2-driven Treg expansion
          cannot act normally on Tregs that lack CD25.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: sirolimus
            term:
              id: CHEBI:9168
              label: sirolimus
      selected_evidence:
        snippet: The use of therapies like rapamycin (sirolimus) that expand regulatory T cells by exploiting
          IL-2 signaling could be considered, although paradoxically in CD25 deficiency the Tregs cannot
          respond normally to IL-2 (27).
        supports: SUPPORT
