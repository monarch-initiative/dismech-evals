        mechanism_confidence: ESTABLISHED
        description: IL-2 receptor signaling normally limits the lymphoid compartment by deleting activated
          T cells. In the founding human case CD25-deficient cortical thymocytes failed to downregulate
          bcl-2 and thymic apoptosis was markedly reduced, allowing autoreactive clones to expand into
          peripheral tissues; in the mouse knockout the same lesion presents as impaired activation-induced
          cell death with polyclonal lymphoid expansion.
        cell_types:
        - preferred_term: cortical thymocyte
          term:
            id: CL:0000893
            label: thymocyte
        biological_processes:
        - preferred_term: activation-induced cell death of T cells
          term:
