      about:
        disease:
          name: CD25 Deficiency
          disease_term:
            preferred_term: CD25 deficiency
            term:
              id: MONDO:0011664
              label: immunodeficiency due to CD25 deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tregs_present_but_inadequate
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why is the regulatory T cell compartment in CD25 deficiency inadequate to prevent autoimmunity
          when FOXP3+ Tregs are present, are bona fide by FOXP3 locus demethylation and surface phenotype,
          and remain the T cell subset most responsive to IL-2?
        attaches_to:
        - pathophysiology#Regulatory T Cell Deficiency and Dysfunction
        - pathophysiology#Loss of Peripheral Immune Tolerance
        rationale: 'In the most fully studied patient, FOXP3+ Tregs were present with a normal surface
          phenotype, retained the highest IL-2 responsiveness of any subset, and were still unable to
          prevent activated cytotoxic cells from infiltrating skin. Two candidate explanations are on
          the table and are not resolved: the Treg fraction is reduced relative to the whole lymphocyte
