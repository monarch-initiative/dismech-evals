          eczema, endocrine autoimmunity and infections the mouse is not reported to acquire. The cited
          work measures activation-induced death in the periphery, while the human thymic bcl-2 and apoptosis
          defect is documented separately in patient thymus, so the two lines of evidence are concordant
          rather than identical.
