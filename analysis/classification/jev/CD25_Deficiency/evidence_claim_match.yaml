      assertion_type: Discussion
      assertion:
        discussion_id: mouse_lymphoproliferation_vs_human_infection
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why does the Il2ra knockout mouse present as adult-onset lymphoproliferation with colitis
          and hemolytic anemia, while human CD25 deficiency presents in infancy with enteropathy, endocrine
          autoimmunity and infections the mouse is not reported to acquire?
        attaches_to:
        - pathophysiology#Defective Activation-Induced and Thymic T Cell Apoptosis
        - pathophysiology#Recurrent and Persistent Viral, Bacterial and Fungal Infection
        rationale: 'The knockout is genuinely informative for the apoptosis lesion, and the autoimmune
          and lymphoproliferative arms are concordant in kind. What the mouse does not reproduce is the
          timing or the infectious arm: the human disease declares itself in the first months of life
          and its most consistently reported complication is persistent cytomegalovirus infection, which
          has no counterpart in the published description of the knockout. Without a model of the infectious
          susceptibility, the relative contributions of failed antigen-specific expansion and of impaired
          NK cell maturation to it cannot be separated experimentally.'
      selected_evidence:
        snippet: Young mice that lack IL-2R alpha have phenotypically normal development of T and B cells.
        supports: SUPPORT
