      assertion_type: AnimalModel
      assertion:
        name: Il2ra knockout mouse
        species: Mouse
        genotype: Il2ra-null (IL-2R alpha-deficient)
        publication: PMID:7584142
        description: Mice lacking IL-2R alpha develop normal T and B cells when young, then as adults
          show massive peripheral lymphoid enlargement with polyclonal T and B expansion correlated with
          impaired activation-induced cell death, and later autoimmune disease including hemolytic anemia
          and inflammatory bowel disease. The model is the source of the interpretation that the chain
          regulates the size and content of the lymphoid compartment by setting the balance between clonal
          expansion and death after activation.
        modeled_mechanisms:
        - target: Defective Activation-Induced and Thymic T Cell Apoptosis
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The knockout reproduces the failure of activation-induced T cell death, with the
            polyclonal lymphoid expansion it predicts.
          limitations: The mouse phenotype is adult-onset and dominated by lymphoproliferation with colitis
            and hemolytic anemia, where the human disease presents in infancy and is dominated by enteropathy,
            eczema, endocrine autoimmunity and infections the mouse is not reported to acquire. The cited
            work measures activation-induced death in the periphery, while the human thymic bcl-2 and
            apoptosis defect is documented separately in patient thymus, so the two lines of evidence
            are concordant rather than identical.
      selected_evidence:
        snippet: Older IL-2R alpha-deficient mice also develop autoimmune disorders, including hemolytic
          anemia and inflammatory bowel disease.
        supports: SUPPORT
    origin:
