            label: activation-induced cell death of T cells
          modifier: DECREASED
        - preferred_term: thymocyte apoptotic process
          term:
            id: GO:0070242
            label: thymocyte apoptotic process
          modifier: DECREASED
      selected_evidence:
        snippet: Furthermore, they fail to down-regulate levels of bcl-2 and, subsequently, apoptosis
          in the thymus is markedly reduced, resulting in expansion of autoreactive clones in multiple
          tissues.
        supports: SUPPORT
