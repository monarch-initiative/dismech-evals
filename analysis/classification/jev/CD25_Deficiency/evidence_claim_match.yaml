              label: immunodeficiency due to CD25 deficiency
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: IPEX syndrome (FOXP3)
        description: IPEX is the phenotypic twin and the main differential. It is X-linked and caused
          by FOXP3 mutation, so Tregs are lineage-defective; in CD25 deficiency FOXP3 is intact and the
          lesion is in IL-2 signaling that sustains FOXP3 expression. IL-10 production by CD4 lymphocytes
