        gene_term:
          preferred_term: CD27
          term:
            id: hgnc:11922
            label: CD27
        notes: Disease is caused by biallelic TNFRSF7/CD27 loss-of-function variants that reduce or abolish
          receptor expression. TNFRSF7 is a historical alias for CD27. Flow-cytometric immunophenotyping
          for absent or markedly reduced CD27 expression on lymphoid cells is a practical screening test
          before confirmatory sequencing in severe EBV-associated disease.
      selected_evidence:
        snippet: We report the simultaneous confirmation of human CD27 deficiency in 3 independent families
          (8 patients) due to a homozygous mutation (p. Cys53Tyr) revealed by whole exome sequencing,
          leading to disruption of an evolutionarily conserved cystein knot motif of the transmembrane
          receptor.
        supports: SUPPORT
