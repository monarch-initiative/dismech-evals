      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'CD27 deficiency is potentially fatal: in the earliest case series 2 of 8 patients
          died, and the natural history is dominated by EBV-driven lymphoproliferation, lymphoma, and
          HLH requiring intensive hematology/oncology management and, in severe disease, allogeneic HSCT.
          Excellent transplant outcomes (95% survival without recurrence) mitigate but do not remove the
          burden of malignancy risk and transplantation itself.'
      selected_evidence:
        snippet: CD27 deficiency is potentially fatal and should be excluded in all cases of severe EBV
          infections to minimize diagnostic delay.
        supports: SUPPORT
