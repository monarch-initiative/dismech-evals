      assertion_type: Pathophysiology
      assertion:
        name: Failed Metaphase I to Anaphase I Transition in Oocytes
        biological_scale: CELLULAR
        description: Oocytes with too little CDC20 cannot complete the metaphase I to anaphase I transition
          and do not extrude the first polar body. Cdc20 knockdown in mouse oocytes gives metaphase-I
          arrest that wild-type human CDC20 cRNA rescues and patient-variant cRNAs rescue poorly. Hypomorphic
          Cdc20 mouse oocytes show markedly delayed anaphase I. The cited studies attribute the oocyte-restricted
          phenotype to a higher CDC20 threshold in female meiosis I than in mitosis.
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
        biological_processes:
        - preferred_term: metaphase/anaphase transition of meiosis I
          term:
            id: GO:1990949
            label: metaphase/anaphase transition of meiosis I
          modifier: DECREASED
      selected_evidence:
        snippet: Compared with wild-type, all mutations significantly reduced the ability of CDC20 to
          rescue PB1 extrusion (Fig. 2B).
        supports: SUPPORT
