              label: oocyte maturation defect 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CDC20 Variants Reducing APC/C Co-activator Function
        role: TRIGGER
        biological_scale: MOLECULAR
        description: Homozygous missense variants and compound-heterozygous combinations of a missense
          variant with a nonsense, frameshift, or splice allele reduce CDC20 mRNA or protein. Truncating
          alleles fail to localize to kinetochores, and every tested genotype rescued first-polar-body
          extrusion less well than wild-type CDC20. CDC20 normally binds the APC/C and activates its ubiquitin
          ligase activity toward cyclin B1 and securin. The genotypes are treated as partial rather than
          complete loss of function because Cdc20 knockout is embryonic lethal in mice, whereas affected
          women have no somatic phenotype.
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: Biallelic genotypes (homozygous missense, or a missense allele combined with a
            nonsense, frameshift, or canonical splice-site allele) that lower CDC20 dosage and activity;
            null alleles occur only in trans with a missense allele.
        genes:
        - preferred_term: CDC20
          term:
            id: hgnc:1723
            label: CDC20
        molecular_functions:
        - preferred_term: APC/C co-activator activity
          term:
            id: GO:0097027
            label: ubiquitin-protein transferase activator activity
          modifier: DECREASED
        cell_types:
        - preferred_term: oocyte
          term:
            id: CL:0000023
            label: oocyte
      selected_evidence:
        snippet: All these results indicate that mutations in CDC20 lead to unstable protein and degraded
          RNA per se.
        supports: SUPPORT
