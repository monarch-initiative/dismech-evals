            label: CDC20
        notes: About a dozen probands have been reported, nearly all from Chinese infertility cohorts.
          p.Arg322Gln recurs in trans with different truncating alleles, and p.Tyr228Cys homozygotes from
          two families share a haplotype, suggesting a founder allele. Phenotype varies between genotypes.
