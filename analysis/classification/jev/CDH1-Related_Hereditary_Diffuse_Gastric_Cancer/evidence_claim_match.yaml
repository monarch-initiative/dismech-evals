            term:
              id: MONDO:0100488
              label: CDH1-related diffuse gastric and lobular breast cancer syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Prophylactic Total Gastrectomy
        description: 'Removal of the entire at-risk gastric epithelium before a second hit can produce
          invasive disease. This is the recommended gastric-cancer risk management option for pathogenic
          CDH1 variant carriers, and it is the clearest example in this KB of an intervention whose rationale
          is read directly off the two-hit mechanism: because every gastric epithelial cell carries the
          first hit and early lesions are endoscopically occult, removing the organ is more reliable than
          detecting the lesion.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: Surgical Procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: Prophylactic gastrectomy for diffuse gastric cancer is an option from early adulthood
          in individuals with normal endoscopy / gastric biopsies and a DGLBCS-related CDH1 pathogenic
          variant regardless of family history
        supports: SUPPORT
    origin:
