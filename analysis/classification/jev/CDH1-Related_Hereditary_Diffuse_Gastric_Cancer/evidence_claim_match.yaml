      assertion_type: Pathophysiology
      assertion:
        name: Germline CDH1 First-Hit Inactivation
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        description: A heterozygous inactivating variant in CDH1 is present constitutionally. The founding
          New Zealand kindred carried a donor splice-site substitution in exon 7 producing a truncated
          protein, and inactivating frameshift and nonsense alleles were then found in further gastric
          cancer families. One functional E-cadherin allele is sufficient for normal epithelial adhesion,
          so the constitutional state is a susceptibility rather than a disease.
        role: trigger
        biological_scale: MOLECULAR
        gene:
          preferred_term: CDH1
          modifier: DECREASED
          term:
            id: hgnc:1748
            label: CDH1
        genetic_context:
          gene:
            preferred_term: CDH1
            term:
              id: hgnc:1748
              label: CDH1
          variant_origin: GERMLINE
          allelic_hit_role: FIRST_HIT
          allelic_events:
          - PATHOGENIC_VARIANT
          - SPLICE_SITE_VARIANT
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Constitutional heterozygous inactivating CDH1 variant; splice-site, frameshift
            and nonsense alleles were all identified in the original gastric cancer families.
      selected_evidence:
        snippet: Sequencing of the E-cadherin gene revealed a G --> T nucleotide substitution in the donor
          splice consensus sequence of exon 7, leading to a truncated gene product.
        supports: SUPPORT
