  68f7339bd415b7ee17344cc2d53829d94231af8cf834f5864c74d0882dfcf135:
    claim:
      about:
        disease:
          name: CDH1-Related Hereditary Diffuse Gastric Cancer
          disease_term:
            preferred_term: CDH1-related diffuse gastric and lobular breast cancer syndrome
            term:
              id: MONDO:0100488
              label: CDH1-related diffuse gastric and lobular breast cancer syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic E-Cadherin Loss in Gastric Epithelium
        conforms_to: germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in
          a Susceptible Cell
        description: 'In a gastric epithelial cell that has inactivated the retained CDH1 allele, E-cadherin
          is absent and the adherens junction cannot be assembled. The route to that second hit is distinctive
          and diagnostically important: HDGC cancers consistently show ABSENCE of loss of heterozygosity
          at the CDH1 locus, and the second hit is instead epigenetic — promoter hypermethylation silencing
          the wild-type allele. A carrier''s tumor with no detectable LOH has therefore not escaped the
          two-hit mechanism; it has completed it by the epigenetic route the germline_two_hit_tumor_predisposition
          module lists alongside deletion and intragenic mutation. Diminished E-cadherin expression is
          a general correlate of aggressive, poorly differentiated carcinoma across tumor types, and restoring
          it in tumor models suppresses the invasiveness of epithelial tumor cells — so the adhesion protein
          is not merely a marker of the phenotype but part of what restrains it.'
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: cell-cell adhesion
          term:
            id: GO:0098609
            label: cell-cell adhesion
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: These individuals harbour germline mutations in the gene encoding E-cadherin, CDH1, but
          their cancers have consistently demonstrated absence of loss of heterozygosity at the CDH1 locus.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10973239
      reference_title: Methylation of the CDH1 promoter as the second genetic hit in hereditary diffuse
        gastric cancer.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the second hit in HDGC is not loss of heterozygosity, which is the
        observation that sends the mechanism to the epigenetic route and is why this entry does not curate
        LOH.
    first_seen_at: '2026-09-25T15:17:31.420138+00:00'
