      reference_title: Diffuse Gastric and Lobular Breast Cancer Syndrome.
      evidence_source: OTHER
      explanation: GeneReviews Management section, giving the concrete surveillance protocol — duration,
        biopsy strategy, interval and starting age. The random-biopsy requirement exists precisely because
        the lesion forms no visible mass.
