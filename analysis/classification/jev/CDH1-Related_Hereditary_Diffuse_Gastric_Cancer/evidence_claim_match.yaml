  8694fa1c5114be5edebd670b4e9dcbbd6d14b20df7a96868b978b5b09e170e4a:
    claim:
      about:
        disease:
          name: CDH1-Related Hereditary Diffuse Gastric Cancer
          disease_term:
            preferred_term: CDH1-related diffuse gastric and lobular breast cancer syndrome
            term:
              id: MONDO:0100488
              label: CDH1-related diffuse gastric and lobular breast cancer syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Endoscopic Surveillance in Expert Centres
        notes: 'Curated under `treatments:` as a management intervention, not as a claim that imaging
          or biochemistry is itself therapeutic. In a two-hit predisposition syndrome the second hit cannot
          be prevented, so the only available lever is stage at detection: surveillance is the intervention
          that converts an unavoidable tumor into a resectable one. Where a `target_mechanisms` link is
          present it points at the clinical-outcome node for that reason, and never at an upstream mechanistic
          node.'
        description: The alternative for carriers who wish to postpone gastrectomy, or whose gastric cancer
          risk is not well defined. The guideline's confidence in this option has increased but it is
          explicitly conditioned on expert-centre delivery, reflecting the difficulty of detecting an
          endoscopically occult lesion.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Therapeutic Procedure
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
      selected_evidence:
        snippet: referral to a high-risk gastric screening program with a thorough ≥30-minute upper endoscopy
          with multiple targeted and random biopsies every six to 12 months beginning in early adulthood
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
