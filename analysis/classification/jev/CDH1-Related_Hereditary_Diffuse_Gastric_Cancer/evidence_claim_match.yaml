        conforms_to: germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation
        description: 'Clonal expansion of E-cadherin-null cells produces the characteristic lesion: poorly
          cohesive signet-ring cells spreading diffusely beneath an intact mucosal surface rather than
          a discrete tumor. The clinical consequence is that early disease is endoscopically occult, which
          is what forces the syndrome''s management toward prophylactic surgery rather than surveillance.'
        role: effector
