      assertion_type: Discussion
      assertion:
        discussion_id: acogs_organ_level_stochasticity
        prompt: What determines which organs are affected, and how severely, in an individual with a given
          CDH2 variant?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Structural Congenital Heart Disease
        - phenotypes#Hypoplastic left heart syndrome
        - phenotypes#Ventricular septal defect
        rationale: A likely monozygotic twin pair sharing one pathogenic CDH2 variant - and therefore
          essentially one genome and one intrauterine environment - had hypoplastic left heart syndrome
          in one twin and a ventricular septal defect with pulmonary hypertension in the other. That is
          close to a controlled experiment, and it rules out common genetic background as the sole explanation
          for the well-known variable expressivity of CDH2 variants. What remains as candidate explanations
          is stochastic variation in a threshold process (adhesive bond number crossing a critical value
          at a particular place and time), post-zygotic somatic variation, or twin-specific vascular factors.
          None has been tested. Until it is, prognostic counselling for a newly diagnosed ACOGS fetus
          or infant cannot be based on the phenotype of an affected relative.
        proposed_experiments:
        - experiment_id: exp_acogs_twin_somatic_sequencing
          name: Deep sequencing of discordant tissues in CDH2-variant twin pairs
          description: Deep sequence cardiac and blood tissue from discordant CDH2-variant twins to test
            whether post-zygotic somatic variation, mosaic variant allele fraction, or a second hit explains
            the organ-level divergence.
        - experiment_id: exp_acogs_registry_genotype_phenotype
          name: Prospective ACOGS registry with systematic organ-system phenotyping
          description: Build a registry that phenotypes every ascertained individual across all four defining
            organ systems with a fixed protocol (brain MRI, echocardiography, ophthalmology, genitourinary
            assessment), so that the current genotype-phenotype picture stops being an artefact of which
            specialist happened to see the patient.
      selected_evidence:
        snippet: have described such variable expressivity in twins with the same CDH2 variant.
        supports: SUPPORT
