        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'Growth cones navigating to and across the telencephalic midline advance by making
          and breaking adhesive contacts with each other and with the glial substrate; N-cadherin is one
          of the adhesion systems those contacts run on, and axon pathfinding is named among its essential
          roles in neural development. When adhesive competence is degraded, callosal axons reach the
          midline but fail to fasciculate and cross, and the tract is not formed - hence agenesis rather
          than degeneration of the corpus callosum, and hence a developmental rather than progressive
          course. The same logic covers the other two axon-pathfinding features of the syndrome: failure
          of the corticospinal projection to remain fully crossed produces mirror movements, and maldevelopment
          of the abducens projection to lateral rectus produces the Duane anomaly. This node is PROVISIONAL:
          the causal chain is inferred from N-cadherin''s established role plus the human imaging and
          examination phenotype, and no patient-derived neuron or CDH2-variant axon-guidance assay has
          been reported.'
        cell_types:
