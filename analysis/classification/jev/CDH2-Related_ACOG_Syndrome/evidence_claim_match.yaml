      assertion_type: Pathophysiology
      assertion:
        name: Failure of Trans Homophilic Adhesion with Dominant-Negative Interference
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'Adherens junctions are built from a trans strand-swap dimer formed between EC1 domains
          projecting from opposing cells, laterally clustered by a weaker cis interface. Cells expressing
          the ACOGS EC4-EC5 variants have a demonstrable cell-cell adhesion defect, and - critically -
          the defect includes impaired trans binding to wild-type N-cadherin displayed on the apposing
          cell. That last observation is what converts this from a quantitative dosage problem into an
          interference problem: in a heterozygote, a mutant molecule reaching the surface does not merely
          fail to contribute, it occupies a binding partner''s trans interface unproductively, so the
          fraction of competent adhesive bonds falls further than the 50% expected from allele dosage
          alone. Structural work on type I cadherins independently shows that trans-interface mutations
          ablate adhesion outright while cis-interface mutations instead destabilise junction assembly,
          which is the framework in which the ACOGS alleles should be read.'
