          and both involve epithelial and mesenchymal tissues in which N-cadherin is expressed - the optic
          cup and lens vesicle in the eye, the genital tubercle and gubernacular apparatus in genital
          and testicular descent. The reported ocular findings include Peters anomaly, an anterior-segment
          dysgenesis that arises from failed separation of the lens vesicle from surface ectoderm, which
          is at least mechanistically congenial to an adhesion defect. Expression evidence now places
          N-cadherin at exactly the tissue interface and developmental moment whose failure produces the
          lesion: immunostaining of mouse embryonic eyes localises it to the lens stalk at the time of
          separation from the future cornea, and to the developing lens and corneal endothelium afterwards
          (PMID:31650526). But this remains the weakest node in the entry, and the confidence is unchanged
          at HYPOTHETICAL, because every absence enumerated here survives that result: showing the protein
          is present where the lesion arises is not the same as showing its loss causes the lesion. No
          experiment has tested N-cadherin function in an ACOGS patient''s ocular or genital tissue, no
          animal model of the human alleles exists, the mouse immunostaining is wild-type localisation
          rather than a disease model, and the male-limited genital findings (cryptorchidism, micropenis)
          could equally reflect an endocrine rather than an adhesive lesion. It is kept as a terminal
          branch so that nothing downstream depends on it.'
