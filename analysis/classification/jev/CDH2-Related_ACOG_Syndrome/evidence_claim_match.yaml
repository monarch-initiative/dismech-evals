  0fb3119caa779e8c6b2a4e148111dd348389f57673d00d0a34cb897876d2fc94:
    claim:
      about:
        disease:
          name: CDH2-Related ACOG Syndrome
          disease_term:
            preferred_term: agenesis of corpus callosum, cardiac, ocular, and genital syndrome
            term:
              id: MONDO:0030065
              label: agenesis of corpus callosum, cardiac, ocular, and genital syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing with de novo CDH2 variant interpretation
        description: 'Molecular diagnosis rests on finding a heterozygous CDH2 variant, confirmed de novo
          by parental testing, in a child with developmental delay plus a midline brain malformation and/or
          structural congenital heart disease. Two interpretation points follow from the published allelic
          spectrum. First, missense changes should be weighted by domain: substitutions of conserved residues
          in EC4-EC5, and particularly at the EC4-EC5 interdomain calcium site, are where the reported
          pathogenic missense alleles sit, and a variant there deserves more weight than its in-silico
          score alone would give it. Second, a CDH2 variant found on a cardiomyopathy gene panel is a
          different claim entirely and does not diagnose ACOGS - the panel association is with adult arrhythmogenic
          and dilated cardiomyopathy, is classified by ClinGen as Limited, and carries no expectation
