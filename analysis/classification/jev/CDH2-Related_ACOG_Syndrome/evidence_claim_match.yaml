      assertion:
        classification_value: NEUROLOGIC
        notes: 'The dominant and most constant morbidity is neurodevelopmental: global developmental delay
          and/or intellectual disability in the majority of the founding cohort, with the structural brain
          lesions (corpus callosum agenesis or hypoplasia, periventricular heterotopia, interhypothalamic
          adhesion) that give the syndrome its name. The cardiac, ocular and genital anomalies are congenital
          malformations of other organs rather than a second chronic disease process, so a single NEUROLOGIC
          chapter is the correct primary assignment.'
      selected_evidence:
        snippet: syndromic neurodevelopmental disorder characterized by global developmental
        supports: SUPPORT
