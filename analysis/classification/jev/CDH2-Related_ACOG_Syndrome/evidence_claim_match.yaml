      assertion_type: DifferentialDiagnosis
      assertion:
        name: CDH2-associated dilated cardiomyopathy
        disease_term:
          preferred_term: dilated cardiomyopathy
          term:
            id: MONDO:0005021
            label: dilated cardiomyopathy
        description: The second CDH2 cardiomyopathy claim, likewise recorded only as contrast. The adult
          cardiac-specific Cdh2 knockout mouse develops exactly this phenotype, which gives the association
          biological plausibility, but ClinGen classifies the human gene-disease relationship as Limited.
          Nothing in the dilated cardiomyopathy literature should be imported into this entry, and nothing
          in this entry implies that ACOGS individuals develop dilated cardiomyopathy - no such progression
          has been reported.
        distinguishing_features:
        - Acquired ventricular dilation and systolic dysfunction in a structurally normally formed heart,
          versus congenital structural malformation.
        - No neurodevelopmental, ocular or genital involvement.
        - ClinGen gene-disease validity Limited (2025 reassessment by the Dilated Cardiomyopathy Gene
          Curation Expert Panel).
      selected_evidence:
        snippet: CDH2 | HGNC:1759 | dilated cardiomyopathy | MONDO:0005021 | AD | Limited
        supports: SUPPORT
