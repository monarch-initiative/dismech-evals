        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Calcium Coordination at the N-cadherin EC4-EC5 Interdomain Site
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: 'The N-cadherin ectodomain is a chain of five extracellular cadherin (EC) domains
          whose linkers each bind calcium ions. Calcium occupancy is not decorative: the crystallographic
          work on type I cadherin ectodomains attributes what stiffness the interdomain linkers have to
          bound calcium, while noting in the same sentence that the resulting curvature of the rod is
          still "likely to be somewhat variable" and citing unpublished data for the rigidification itself.
          The geometry that presents the distal EC1 tip to a partner molecule on the apposing membrane
          therefore depends on these calcium-loaded linkers. Four of the seven ACOGS missense substitutions
          replace conserved residues of the calcium-binding site at the EC4-EC5 interdomain, and six of
          the seven fall within EC4-EC5 overall. This node is the proximal molecular lesion for the missense
          class of ACOGS alleles: the substitutions are not predicted to abolish the protein, they are
          predicted to unhinge it.'
        molecular_functions:
        - preferred_term: interdomain calcium ion binding by the N-cadherin ectodomain
          term:
            id: GO:0005509
            label: calcium ion binding
          modifier: DECREASED
      selected_evidence:
        snippet: consists of extracellular cadherin (EC) domains, separated by calcium binding
        supports: SUPPORT
