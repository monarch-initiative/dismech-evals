      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: acogs_antimorphic_adhesion
        hypothesis_label: ACOGS ectodomain alleles act as antimorphs that poison wild-type N-cadherin
          adhesion
        status: EMERGING
        description: 'The proposal is that the EC4-EC5 missense alleles are not simple loss-of-function.
          A mutant molecule that reaches the cell surface with an unhinged ectodomain still occupies the
          trans-binding partner presented by the apposing cell, so it subtracts wild-type molecules from
          the pool of competent bonds rather than merely failing to add to it. The direct observation
          supporting this is that the variants impair binding in trans to wild-type N-cadherin, not only
          to each other. If correct, the effective adhesive deficit in a heterozygote exceeds 50%, which
          would explain why a single heterozygous missense change produces a severe malformation syndrome
          while heterozygous N-cadherin-null mice are not reported as abnormal. That last contrast is
          weak evidence: the cached mouse-null report (PMID:9015265) is an abstract that describes homozygous
          mutants only and says nothing about heterozygotes, so the heterozygous-null comparison rests
          on the absence of a reported phenotype rather than on a documented normal one.'
        notes: Not yet tested by the experiment that would settle it - a dosage series comparing wild-type,
          heterozygous-null and heterozygous-missense cells or animals for adhesion strength and for the
          ACOGS phenotypes.
      selected_evidence:
        snippet: defect includes impaired binding in trans with N-cadherin-WT expressed on
        supports: SUPPORT
