      reference: PMID:21300292
      reference_title: The extracellular architecture of adherens junctions revealed by crystal structures
        of type I cadherins.
      evidence_source: IN_VITRO
      explanation: Structural work on type I cadherin ectodomains (including N-cadherin) treats interdomain
        calcium binding as what rigidifies the ectodomain, which is the biophysical reason a calcium-site
        substitution is expected to be damaging even though it is a single conservative-looking amino
        acid change. Graded INDIRECT because the paper states the rigidification in passing, citing unpublished
        data, and in the same sentence says the resulting curvature is still somewhat variable - it does
        not demonstrate the point.
