      assertion:
        discussion_id: acogs_truncating_allele_mechanism
        prompt: Do the truncating CDH2 alleles (two frameshifts and a nonsense variant) cause ACOGS by
          the same dominant-negative route as the EC4-EC5 missense alleles, or by haploinsufficiency?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Truncation of the N-cadherin Cytoplasmic Catenin-Binding Tail
        - pathophysiology#Failure of Trans Homophilic Adhesion with Dominant-Negative Interference
        rationale: 'The founding cohort''s functional work was done exclusively on EC4-EC5 missense alleles,
          and the interference argument rests on those experiments. The frameshift alleles are described
          only as predicted to truncate the cytoplasmic domain; no protein was measured. A later patient
          carries a de novo nonsense allele, which - depending on its position relative to the last exon-exon
          junction - could instead trigger nonsense-mediated decay and give straightforward haploinsufficiency.
          Two mechanisms that produce the same clinical label is not a cosmetic distinction: it changes
          whether whole-gene deletions should be expected to cause ACOGS, whether the disorder is a candidate
          for allele-specific silencing, and how a novel truncating variant of uncertain significance
          should be interpreted. The entry deliberately keeps the truncating alleles in their own PROVISIONAL
          pathophysiology node rather than merging them into the antimorphic node.'
        proposed_experiments:
        - experiment_id: exp_acogs_truncating_allele_protein
          name: Measure N-cadherin protein and transcript in patient cells carrying truncating CDH2 alleles
          description: Quantify CDH2 transcript (with and without translation inhibition to unmask nonsense-mediated
            decay) and N-cadherin protein level and surface localisation in fibroblasts or reprogrammed
            cells from individuals with the frameshift and nonsense alleles, against EC4-EC5 missense
            carriers and controls. A reduced transcript that is restored by decay inhibition indicates
            haploinsufficiency; a stable truncated protein at the membrane indicates interference.
        - experiment_id: exp_acogs_cdh2_deletion_phenotype
          name: Phenotype ascertainment in carriers of whole-gene CDH2 deletions
          description: Systematically review copy-number databases for individuals with heterozygous deletions
            spanning CDH2 and determine whether any has the ACOGS phenotype. Absence of ACOGS among deletion
            carriers would argue strongly against haploinsufficiency as a sufficient mechanism.
      selected_evidence:
        snippet: reported the fifteenth patient with ACOGS, having a novel de novo nonsense
        supports: SUPPORT
