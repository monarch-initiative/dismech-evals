      assertion_type: Discussion
      assertion:
        discussion_id: acogs_no_model_of_the_human_allele
        prompt: Does any existing animal or cellular model recapitulate ACOGS, or is the causal chain
          from N-cadherin adhesion failure to the human malformations entirely inferential?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Failure of Midline Axon Pathfinding and Callosal Tract Formation
        - pathophysiology#Loss of Neuroepithelial Adherens Junction Integrity and Neuronal Migration Failure
        - pathophysiology#Adhesion Failure in Ocular and Genital Primordia
        rationale: 'None of the three Cdh2 mouse models curated in this entry models this disease. (Those
          three are not the whole Cdh2 mouse literature - a substantial body of brain-specific conditional-knockout
          work exists and is relevant to the neuroepithelial node, but none of it carries an ACOGS allele
          either.) The constitutive null is homozygous lethal by embryonic day 10, before the corpus callosum,
          cortex, eye or genitalia are built, and heterozygous nulls are not reported as abnormal - so
          the model that shows the cardiac requirement cannot show the neurodevelopmental one. The cardiac-specific
          inducible knockout addresses the adult working myocardium and produces dilated cardiomyopathy,
          a different disease. The p.H150Y knock-in models the allelic recessive ADHD disorder, has no
          anatomical brain abnormality, and is homozygous. No knock-in of an ACOGS EC4-EC5 allele has
          been made. The consequence for this entry is concrete: the pathophysiology nodes linking adhesion
          failure to callosal agenesis, periventricular heterotopia and ocular/genital malformation are
          tagged PROVISIONAL or HYPOTHETICAL, and should not be read as demonstrated causal chains.'
        proposed_experiments:
        - experiment_id: exp_acogs_knockin_mouse
          name: Heterozygous knock-in of an ACOGS EC4-EC5 allele in mouse
          description: Generate a mouse heterozygous for one of the recurrent ACOGS calcium-site substitutions
            and score corpus callosum formation, cortical lamination and periventricular heterotopia,
            cardiac septation, anterior-segment development and testicular descent. Compare directly against
            a heterozygous null littermate to separate interference from haploinsufficiency in vivo.
        - experiment_id: exp_acogs_patient_organoid_adhesion
          name: Patient-derived cortical organoid and cardiac organoid adhesion assay
          description: Derive iPSCs from ACOGS individuals and controls, and measure apical adherens-junction
            integrity, neuroepithelial rosette architecture and neuronal migration in cortical organoids,
            plus tissue cohesion in cardiac organoids, to test the two mechanistic nodes in human cells
            carrying the real allele.
      selected_evidence:
        snippet: caused by a missense mutation in CDH2, which encodes the adhesion protein
        supports: SUPPORT
