      assertion:
        name: CDH2-associated arrhythmogenic right ventricular cardiomyopathy
        disease_term:
          preferred_term: arrhythmogenic right ventricular cardiomyopathy
          term:
            id: MONDO:0016587
            label: arrhythmogenic right ventricular cardiomyopathy
        description: Not a differential for the ACOGS presentation, but recorded because CDH2 appears
          on arrhythmogenic cardiomyopathy gene panels and the two claims are routinely conflated. Arrhythmogenic
          right ventricular cardiomyopathy is an adult-onset disease of the desmosomal/adherens-junction
          complex of the working myocardium, presenting with ventricular arrhythmia and fibrofatty replacement;
          the biology is intercalated-disc maintenance, matching the adult cardiac-specific Cdh2 knockout.
          ClinGen classifies the CDH2-arrhythmogenic right ventricular cardiomyopathy relationship as
          Limited.
        distinguishing_features:
        - Adult-onset arrhythmia and myocardial replacement versus congenital structural malformation
          present at birth.
        - No callosal, ocular, genital or neurodevelopmental involvement.
        - ClinGen gene-disease validity for CDH2 in this disease is Limited, whereas the CDH2-ACOGS relationship
          rests on a nine-individual cohort with functional adhesion assays.
        - The relevant mouse model is the ADULT cardiac-specific conditional knockout, not the constitutive
          embryonic null.
      selected_evidence:
        snippet: disassembly of the intercalated disc structure, including adherens junctions and
        supports: SUPPORT
