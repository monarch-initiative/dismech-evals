          so the primary lesion is mechanical cohesion, not electrical coupling. In ACOGS the human phenotype
          is correspondingly structural - atrioventricular canal defect, coarctation, ventricular septal
          defect, hypoplastic left heart, dextrocardia - rather than a cardiomyopathy. This is the node
          that must not be conflated with N-cadherin''s separate, postnatal role at the intercalated disc
          of the working myocardium, where induced deletion in the adult mouse causes intercalated-disc
          dissolution, dilated cardiomyopathy and fatal ventricular arrhythmia.'
