            term:
              id: MONDO:0030065
              label: agenesis of corpus callosum, cardiac, ocular, and genital syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant, de novo
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'ACOGS-associated CDH2 variants are heterozygous, and in the ACOGS-ascertained reports
          every proband in whom parental testing was performed carried a de novo variant, which is expected
          for a disorder with this degree of neurodevelopmental and cardiac morbidity. De novo origin
          is not universal across the wider literature: in the Peters-anomaly-ascertained series one proband''s
          variant was inherited from an apparently unaffected mother (who had not had a formal eye exam),
          and a second proband had no parental samples available, so transmission from a non-penetrant
          or mildly affected carrier is documented and penetrance cannot be assumed complete at the milder,
          ocular-predominant end of the spectrum. The HPO annotation set for OMIM:618929 likewise records
          autosomal dominant inheritance as the only mode. Note that the CDH2 allelic disorder at the
          other end of the gene - familial attention-deficit hyperactivity disorder from a prodomain-cleavage-site
          missense variant - is autosomal recessive, so "CDH2 variant" alone does not imply a mode of
          inheritance.'
        expressivity: VARIABLE
      selected_evidence:
        snippet: neurodevelopmental disorder. Here, we report de novo heterozygous pathogenic
        supports: SUPPORT
