  0bdb6b6d402fd6dfc6abbd8d592444eb8e9360ca8dcdde9b79a3e09668a8372d:
    claim:
      about:
        disease:
          name: CDH2-Related ACOG Syndrome
          disease_term:
            preferred_term: agenesis of corpus callosum, cardiac, ocular, and genital syndrome
            term:
              id: MONDO:0030065
              label: agenesis of corpus callosum, cardiac, ocular, and genital syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: CDH2-related autosomal recessive attention-deficit hyperactivity disorder
        description: An allelic disorder rather than a phenocopy, and the sharpest illustration that "a
          CDH2 variant" is not one thing. Three siblings of a consanguineous kindred with severe childhood-onset
          ADHD were homozygous for c.355C>T (p.H150Y), a substitution in the prodomain furin-cleavage
          motif that impairs proteolytic maturation of N-cadherin rather than its adhesive interface.
          The resulting phenotype is behavioural and synaptic, with no malformation.
        distinguishing_features:
        - Autosomal recessive, homozygous, segregating in a consanguineous family - versus de novo heterozygous
          in ACOGS.
        - The variant lies in the prodomain cleavage motif and impairs furin-mediated protein maturation,
          not in the EC4-EC5 adhesive/calcium-binding region.
        - The phenotype is isolated ADHD with normal brain anatomy; there is no corpus callosum, cardiac,
          ocular or genital malformation.
        - The knock-in mouse for this allele has no anatomical or histological brain abnormality, in contrast
          to the malformative human ACOGS phenotype.
        notes: No MONDO term was found for this entity, so no disease_term is bound rather than binding
          an approximate one. OMIM does not list it as a separate phenotype series entry in the MONDO
          record for MONDO:0030065.
      selected_evidence:
        snippet: to segregate within the family as expected for autosomal recessive
        supports: SUPPORT
