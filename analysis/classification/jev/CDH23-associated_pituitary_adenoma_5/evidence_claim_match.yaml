          name: CDH23-associated pituitary adenoma 5
          disease_term:
            preferred_term: pituitary adenoma 5, multiple types
            term:
              id: MONDO:0054601
              label: pituitary adenoma 5, multiple types
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cdh23_pituitary_adenoma_mechanism
        prompt: What is the causal mechanism linking germline CDH23 variants to pituitary adenoma formation,
          and which pituitary cell lineage or signaling pathway is affected?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Germline CDH23 variant association
        - pathophysiology#Predicted impaired CDH23-mediated cell adhesion
        - pathophysiology#Pituitary adenoma susceptibility with unresolved mechanism
        rationale: 'The CDH23 literature supports a genetic association and a predicted cadherin-domain
          adhesion effect, but it does not yet establish a mechanistic chain from CDH23 function to pituitary
          endocrine-lineage proliferation, hormone excess, or adenoma initiation. This should remain a
          knowledge gap rather than being forced into the AIP/GPR101/GNAS cAMP module or the USP8 corticotroph
          EGFR/POMC module. An experimental observation relevant to the lineage question exists: iPSCs
          derived from a Cushing disease patient carrying a germline CDH23 mutation showed dysregulated
          cell lineage commitment. That is a single-donor in vitro observation without an isogenic control,
          so it narrows the gap toward a lineage-commitment hypothesis without closing it.'
      selected_evidence:
        snippet: Therefore, mutations in CDH23 are linked with familial and sporadic PA and could play
          important roles in the pathogenesis of PA.
        supports: SUPPORT
