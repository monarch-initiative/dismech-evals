        context: []
      assertion_type: Genetic
      assertion:
        name: CDK19
        association: Heterozygous de novo kinase-domain missense variants cause a variable neurodevelopmental
          disorder. Recurrent alleles cluster in the glycine-rich ATP-binding loop and activation segment.
          The direction of biochemical activity and the ability to substitute for fly Cdk8 depend on allele
          and assay. Neither a universal loss-of-function mechanism nor simple haploinsufficiency explains
          all reported variants.
        gene_term:
