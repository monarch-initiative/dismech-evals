        kind: INTERPRETATION
        status: OPEN
        prompt: How does the historical CDK19-disrupting inversion relate to the later kinase-domain missense
          syndrome?
        attaches_to:
        - genetic#CDK19
        rationale: The pericentric inversion was mapped to CDK19 intron 1 and reduced transcript levels
          in transformed lymphoblasts, supporting a dosage effect. Retinal folds, microcephaly and milder
          intellectual disability without reported epilepsy differ from many missense cases. Breakpoint
          mapping did not establish a nucleotide-resolved junction, and the isolated structural case does
          not establish pathogenicity of all CDK19 deletions or truncations.
      selected_evidence:
        snippet: The transcript level for CDK19 in the patient was found to be 54% (p = 0.022) when compared
          with the control mean
        supports: SUPPORT
