  da23aa2e5b95f5abeb8b52a75dc32c8bd82fe5682f6850e02a50c04c6b73486a:
    claim:
      about:
        disease:
          name: CDK8-Related Disorder
          disease_term:
            preferred_term: Intellectual developmental disorder with hypotonia and behavioral abnormalities
            term:
              id: MONDO:0032897
              label: intellectual developmental disorder with hypotonia and behavioral abnormalities
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CDK8 kinase module dysfunction
        description: 'CDK8 is the catalytic kinase of the CDK8 kinase module (CKM), the dissociable regulatory
          cap of the Mediator complex. Disease-causing de novo missense variants cluster in the ATP-binding
          pocket of the kinase domain and behave as hypomorphic alleles, reducing phosphorylation of CDK8
          substrates (e.g., STAT1-Ser727) and disrupting Mediator-dependent transcriptional regulation
          of developmental gene-expression programs. CDK8 belongs to the group of CDK8-kinase module-associated
          disease genes, alongside CDK19, MED12, MED12L, MED13, and MED13L.

          '
        genes:
        - preferred_term: CDK8
          term:
            id: hgnc:1779
            label: CDK8
        biological_processes:
        - preferred_term: transcription by RNA polymerase II
          term:
            id: GO:0006366
            label: transcription by RNA polymerase II
        - preferred_term: regulation of gene expression
          term:
            id: GO:0010468
            label: regulation of gene expression
          modifier: DYSREGULATED
      selected_evidence:
        snippet: All predicted substitutions localize to the ATP-binding pocket of the kinase domain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
