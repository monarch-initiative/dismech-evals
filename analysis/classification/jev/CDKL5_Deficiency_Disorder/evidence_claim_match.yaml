      assertion_type: Discussion
      assertion:
        discussion_id: gap_cdkl5_reversibility_treatment_window
        prompt: Can restoring CDKL5 after symptom onset reverse established disease, and what is the developmental
          window during which CDKL5 gene-replacement or reactivation is effective in humans?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Dendritic Spine and Synapse Development
        - pathophysiology#Early-Onset Intractable Epilepsy
        rationale: Preclinical AAV9-delivered CDKL5 gene replacement restores substrate phosphorylation
          and reduces pathology and aberrant behavior in mouse models, raising the prospect of a disease-modifying
          therapy. Whether reintroducing CDKL5 after the early-postnatal period reverses established circuit
          and developmental deficits in humans, and how wide the therapeutic window is, remains unknown.
          This is decisive for the design and timing of the gene- and protein-replacement therapies now
          in development.
        proposed_experiments:
        - experiment_id: exp_cdkl5_reactivation_timing
          name: Timed CDKL5 reactivation in a conditional model
          description: Using a conditional CDKL5 reactivation model, restore CDKL5 at a graded set of
            ages spanning before and after symptom onset, and measure reversal of seizure susceptibility,
            visual evoked responses, and behavioral and synaptic deficits as a function of restoration
            age.
          experiment_type:
            preferred_term: timed gene-reactivation experiment
          readouts:
          - name: Reversal of deficits by restoration age
            target: pathophysiology#Early-Onset Intractable Epilepsy
            assays:
            - preferred_term: electroencephalography
            - preferred_term: behavioral assay
            direction: POSITIVE
          controls:
          - name: Never-reactivated and wild-type
            description: Matched never-reactivated mutants and wild-type controls.
          decision_criterion: A treatment window is supported if reversal of deficits declines with later
            restoration age; broad reversibility is supported if late restoration still rescues deficits.
          would_support:
          - pathophysiology#Impaired Dendritic Spine and Synapse Development
      selected_evidence:
        snippet: CDKL5 is a serine/threonine kinase that is critical for axon outgrowth and dendritic
          morphogenesis as well as synapse formation, maturation, and maintenance.
        supports: SUPPORT
