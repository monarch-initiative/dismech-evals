      assertion_type: Discussion
      assertion:
        discussion_id: gap_cdkl5_mouse_model_epilepsy_fidelity
        prompt: Why do constitutive Cdkl5-knockout mice reproduce the motor, visual, and behavioral features
          of CDD but not its severe early-onset epilepsy, and what does this mismatch imply for preclinical
          antiseizure testing?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Neuronal Network Hyperexcitability
        - pathophysiology#Early-Onset Intractable Epilepsy
        rationale: 'Cdkl5-knockout mice recapitulate substantial parts of the human phenotype (limb clasping,
          hypoactivity, abnormal visual responses) and are the primary in vivo model, but their seizure
          phenotype is milder and less consistent than the intractable early-onset epilepsy that defines
          human CDD. This is a translational-validity gap rather than an absence of evidence: robust model-organism
          data exist, but the fidelity of the model to the disease-defining seizure feature is uncertain,
          which weakens its use as an antiseizure-therapy testbed and motivates human iPSC and alternative
          models.'
        proposed_experiments:
        - experiment_id: exp_cdkl5_seizure_provocation_cross_model
          name: Seizure-susceptibility comparison across CDKL5 models
          description: Compare seizure threshold and spontaneous epileptiform activity in Cdkl5-knockout
            mice, patient iPSC-derived neuronal networks, and alternative models under matched provocation,
            to identify which system reproduces the human early-onset intractable-epilepsy phenotype.
          experiment_type:
            preferred_term: cross-model seizure-susceptibility experiment
          readouts:
          - name: Spontaneous and provoked epileptiform activity
            target: pathophysiology#Neuronal Network Hyperexcitability
            assays:
            - preferred_term: electroencephalography
            - preferred_term: multielectrode array recording
            direction: POSITIVE
          controls:
          - name: Wild-type and isogenic-corrected systems
            description: Matched non-mutant references for each model system.
          decision_criterion: A model is validated for CDD epilepsy if it reproducibly shows the early-onset
            spontaneous epileptiform activity characteristic of human CDD; models lacking it are flagged
            as unsuitable for antiseizure efficacy testing.
          would_support:
          - pathophysiology#Early-Onset Intractable Epilepsy
      selected_evidence:
        snippet: mice revealed key features of the human disorder, including limb clasping, hypoactivity,
          and abnormal eye tracking.
        supports: SUPPORT
