      assertion_type: Discussion
      assertion:
        discussion_id: gap_cdkl5_substrate_to_phenotype_causality
        prompt: Which CDKL5 phosphorylation substrate(s) and downstream event(s) are causally responsible
          for the epilepsy versus the developmental, movement, and visual features of CDD, and are the
          disease-relevant events the microtubule substrates (MAP1S, EB2, ARHGEF2) or activity-dependent
          synaptic targets?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Loss of CDKL5 Kinase Activity in Neurons
        - pathophysiology#Impaired Dendritic Spine and Synapse Development
        rationale: CDKL5 phosphorylates a small set of neuronal substrates, with the best-established
          being the microtubule regulators MAP1S, EB2, and ARHGEF2, and additional evidence for activity-dependent
          (NMDAR-linked) synaptic roles. Which specific phospho-events drive which arm of the phenotype
          is unresolved. Because a substrate-replacement or downstream-target therapy would need to know
          which event to correct, mapping substrate to phenotype is a rate-limiting question for mechanism-based
          treatment, distinct from gene replacement of CDKL5 itself.
        proposed_experiments:
        - experiment_id: exp_cdkl5_substrate_phenotype_dissection
          name: Substrate-specific rescue in CDKL5-deficient human neurons
          description: In CDKL5-null patient iPSC-derived neurons and cortical organoids, selectively
            restore individual phospho-events (phosphomimetic substrates or substrate-targeted manipulation)
            and test which one normalizes network excitability versus dendritic and synaptic maturation
            readouts.
          experiment_type:
            preferred_term: substrate-specific rescue experiment
          readouts:
          - name: Network excitability versus maturation
            target: pathophysiology#Impaired Dendritic Spine and Synapse Development
            biological_processes:
            - preferred_term: Dendritic spine development
              term:
                id: GO:0060996
                label: dendritic spine development
              modifier: DECREASED
            assays:
            - preferred_term: multielectrode array recording
            direction: POSITIVE
          controls:
          - name: CDKL5-corrected isogenic neurons
            description: Isogenic CDKL5-restored neurons as the normalization reference.
          decision_criterion: A substrate is implicated in a given phenotype arm if restoring only its
            phosphorylation normalizes that readout (excitability vs maturation) in CDKL5-null human neurons.
          would_support:
          - pathophysiology#Impaired Dendritic Spine and Synapse Development
      selected_evidence:
        snippet: EB2 phosphorylation is reduced in patient-derived human neurons.
        supports: SUPPORT
