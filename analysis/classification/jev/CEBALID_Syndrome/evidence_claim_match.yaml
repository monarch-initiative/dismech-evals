  3b08784a34bf20db9507224ccbdc824e2bdb91e6bae4f51e6381734e56773e9d:
    claim:
      about:
        disease:
          name: CEBALID Syndrome
          disease_term:
            preferred_term: CEBALID syndrome
            term:
              id: MONDO:0032908
              label: CEBALID syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mn1_null_models_versus_truncation
        kind: HUMAN_MODEL_MISMATCH
        prompt: The available mouse models are Mn1 null alleles, which cause cleft palate and membranous
          bone defects, whereas the human syndrome is caused by a stable truncated protein and rarely
          includes cleft palate. Do the null models tell us anything about how truncated MN1 produces
          rhombencephalosynapsis and midface hypoplasia?
        attaches_to:
        - pathophysiology#Abnormal Craniofacial Skeletal Development
        - pathophysiology#Abnormal Brain Development
        rationale: Mn1 null mice show membranous cranial bone defects, cleft palate and, in a newer knockout,
          reduced hindbrain Cyp26 expression with altered retinoic acid patterning of rhombomere 1, from
          which the cerebellum develops. This is suggestive for rhombencephalosynapsis, but the direction
          of effect of a gain-of-function or dominant-negative truncated protein on the same pathway is
          unknown, and cleft palate, the hallmark of the null mouse, is rare in MCTT syndrome while it
          is the main finding in human decay-prone alleles. No knock-in of a C-terminal truncation has
          been reported.
      selected_evidence:
        snippet: Mn1 null mice, however, were found to die at birth or shortly thereafter as the result
          of a cleft palate.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
