  7e229b8e43b49903e4539191ce80cc5c013a57cc7b41920fcd216af45a445c7b:
    claim:
      about:
        disease:
          name: CEBALID Syndrome
          disease_term:
            preferred_term: CEBALID syndrome
            term:
              id: MONDO:0032908
              label: CEBALID syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: MN1
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        gene_term:
          preferred_term: MN1
          term:
            id: hgnc:7180
            label: MN1
        notes: 'All variants in the MCTT series are nonsense or frameshift variants that create a premature
          stop codon in exon 2 or in the final 37 nucleotides of exon 1, so that the transcript escapes
          nonsense-mediated decay. p.Arg1295* is recurrent. Truncating variants earlier in exon 1, which
          are expected to undergo nonsense-mediated decay, and whole-gene deletions have been reported
          with a milder and less specific phenotype (cleft palate, conductive hearing loss, speech delay
          without the MCTT facial gestalt or brain malformations); ClinGen scored some of these in its
          CEBALID curation while noting the milder presentation. They are recorded here as an allelic
          contrast rather than as part of the core entity. Expressivity also depends on mosaicism: a father
          mosaic for p.(Gln1273*) (wild-type to mutant read imbalance on exome sequencing) had only mildly
          dysplastic ears and a high palate, while his two heterozygous children had the full syndrome;
          he was excluded from the founding cohort''s frequency counts. This is a parental mosaic observation,
          so HP:0001442 is not bound.'
        variants:
        - name: MN1 p.Arg1295*
          description: Recurrent de novo nonsense variant (c.3883C>T) in the terminal exon, observed in
            8 of 21 probands in the largest series. Shown to escape nonsense-mediated decay in a patient
            lymphoblastoid cell line.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_77c20c19-bdbc-45ff-809a-7a0d6965c0c4-2025-04-02T160000.000Z
      selected_evidence:
        snippet: We identified a cluster of de novo truncating mutations in MN1 in a cohort of 23 individuals
          with strikingly similar dysmorphic facial features, especially midface hypoplasia, and intellectual
          disability with severe expressive language delay.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
