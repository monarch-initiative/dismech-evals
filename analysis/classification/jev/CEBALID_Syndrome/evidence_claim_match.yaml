      assertion_type: Pathophysiology
      assertion:
        name: Abnormal Craniofacial Skeletal Development
        description: Midface hypoplasia, skull shape anomalies with occasional craniosynostosis, abnormal
          posterior clinoid processes and ear anomalies point to disturbed development of the craniofacial
          skeleton. In mice, Mn1 is required for intramembranous ossification of the cranial vault and
          for palate closure, but that evidence comes from null alleles rather than from the truncated
          protein that causes this syndrome.
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: intramembranous ossification of the cranial skeleton
          modifier: ABNORMAL
          term:
            id: GO:0001957
            label: intramembranous ossification
      selected_evidence:
        snippet: Our data show that MN1 plays a critical role in human craniofacial and brain development,
          and opens the door to understanding the biological mechanisms underlying rhombencephalosynapsis.
        supports: SUPPORT
