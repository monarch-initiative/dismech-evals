            term:
              id: MONDO:0032908
              label: CEBALID syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mn1_gain_of_function_versus_dominant_negative
        kind: KNOWLEDGE_GAP
        prompt: Does truncated MN1 act through a new or increased activity, through interference with
          the wild-type protein, or both?
        attaches_to:
        - pathophysiology#MN1 C-terminal Truncating Variant
        rationale: The founding cohort ruled out haploinsufficiency on genetic grounds (allele position,
          decay escape, milder phenotype of decay-prone alleles) and left gain-of-function and dominant-negative
          action open. The gain-of-function label rests on overexpression of the truncated protein in
          HEK293T, HeLa and MG63 cells, which shows stability, condensation and anti-proliferative effects
          but was not designed to test whether the mutant protein disables the wild-type copy. Co-expression
          of wild-type and mutant protein at endogenous levels, or a knock-in allele, would separate the
          two.
      selected_evidence:
        snippet: We speculate that these differences are due to the stable expression of C-terminally
          truncated MN1 protein in the latter, which may act in a dominant negative or gain-of-function
          manner.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
