        target: Lamellar Granule Maturation Failure
        causal_link_type: DIRECT
        description: Reduced SNAP29 in patient skin is accompanied by abnormal maturation of the lamellar
          granules, the secretory organelles of the granular layer.
      selected_evidence:
        snippet: SNAP29 expression was decreased in the skin of the patients, resulting in abnormal maturation
          of lamellar granules and, as a consequence, in mislocation of epidermal lipids and proteases.
        supports: SUPPORT
