        relationship_type: CAUSATIVE
        notes: Biallelic loss of SNAP29 function causes a variable neurocutaneous disorder. Homozygous
          and compound heterozygous sequence variants, and sequence-variant/deletion combinations, are
          documented. Contiguous-gene deletions can add phenotypes attributable to other genes. Missense
          candidates proposed in the 2013 22q11.2 series were supported chiefly by prediction and should
          not be equated with its two truncating-variant CEDNIK cases.
        variants:
