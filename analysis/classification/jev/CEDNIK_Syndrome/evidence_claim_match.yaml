              term:
                id: CL:0000312
                label: keratinocyte
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Aberrant Epidermal Differentiation and Barrier Failure
        causal_link_type: DIRECT
        description: Mislocated lipids and proteases leave the cornified envelope improperly formed, and
          the barrier fails.
      selected_evidence:
        snippet: Markedly decreased deposition of lamellar body contents in mutant mice epidermis and
          the observation of malformed lamellar bodies indicate severe impairments in lamellar body function
          due to the Snap29 knockout.
        supports: SUPPORT
