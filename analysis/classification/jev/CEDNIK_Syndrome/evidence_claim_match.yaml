  6dc05b259def32bbad9fd1bdc990bbbb58bcee0e2cf1df8fa685f01d646ba977:
    claim:
      about:
        disease:
          name: CEDNIK Syndrome
          disease_term:
            preferred_term: CEDNIK syndrome
            term:
              id: MONDO:0012290
              label: CEDNIK syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SNAP29
        gene_term:
          preferred_term: SNAP29
          term:
            id: hgnc:11133
            label: SNAP29
        relationship_type: CAUSATIVE
        notes: 'Synaptosomal-associated protein 29, at 22q11.2. Biallelic loss-of-function variants cause
          CEDNIK. The locus is the clinically important part: SNAP29 is deleted in 90% of patients with
          22q11.2 deletion syndrome, so a 22q11.2 deletion carrier who also has a deleterious variant
          on the remaining allele has no functional SNAP29 and can present with CEDNIK features. Expressivity
          is variable and penetrance incomplete even within one genotype.'
        variants:
        - name: 1-bp deletion in SNAP29
          description: The founding allele, homozygous in all patients of two large consanguineous families
            identified by homozygosity mapping.
        - name: c.486insA
          description: A homozygous insertion reported in two sibs with ichthyosis and corpus callosum
            dysgenesis, shown by transfection to be loss of function. Reported elsewhere as c.486_487insA,
            where homozygotes may present with the full syndrome or with the neurological features alone.
      selected_evidence:
        snippet: Using homozygosity mapping in two large families, we localized the disease gene to 22q11.2
          and identified, in all patients, a 1-bp deletion in SNAP29, which codes for a SNARE protein
          involved in vesicle fusion.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
