      assertion_type: Pathophysiology
      assertion:
        name: Neuroectodermal Developmental Disruption
        biological_scale: TISSUE
        description: Epidermis and neural tissue share an embryonic origin, and the founding report framed
          CEDNIK as evidence that vesicle trafficking is required for proper neuroectodermal differentiation
          — which is the argument that the cutaneous and cerebral halves of this syndrome are one lesion
          rather than two. What the trafficking defect does in the developing brain is not resolved at
          the cellular level in any located source; the malformations are the observation, not the mechanism.
      selected_evidence:
        snippet: These data underscore the importance of vesicle trafficking regulatory mechanisms for
          proper neuroectodermal differentiation.
        supports: SUPPORT
