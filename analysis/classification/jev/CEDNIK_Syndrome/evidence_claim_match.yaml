      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'Two defective SNAP29 alleles are required. The founding families were homozygous
          for a 1-bp deletion and were identified by homozygosity mapping. A second homozygous insertion,
          c.486insA, was later reported in two sibs. Heterozygous parents are unaffected. The one route
          to the disease that is not a plain homozygous genotype is hemizygosity: because SNAP29 sits
          in the 22q11.2 deletion interval, a deletion carrier with a deleterious variant on the remaining
          allele has no functional copy either.'
      selected_evidence:
        snippet: Using homozygosity mapping in two large families, we localized the disease gene to 22q11.2
          and identified, in all patients, a 1-bp deletion in SNAP29, which codes for a SNARE protein
          involved in vesicle fusion.
        supports: SUPPORT
    origin:
