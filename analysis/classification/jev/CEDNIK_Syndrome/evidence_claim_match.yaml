            description: Lamellar granules are the keratinocyte organelles that deliver barrier lipids
              and processing proteases into the intercellular space at the granular-to-cornified transition.
              Without SNAP29 they do not mature, and their cargo is mislocated. This is the specific lesion
              that makes CEDNIK an ichthyosis rather than a generic trafficking disease.
            cellular_components:
            - preferred_term: epidermal lamellar body
              modifier: DECREASED
              term:
                id: GO:0097209
                label: epidermal lamellar body
            cell_types:
