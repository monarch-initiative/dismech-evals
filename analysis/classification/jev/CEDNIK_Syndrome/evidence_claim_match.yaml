          description: Founding frameshift, historically reported as c.220delG using a different numbering
            convention. Patient fibroblasts showed markedly reduced RNA and protein.
        - name: c.487dup (p.Ser163Lysfs*6)
          description: Historically described as c.486insA or c.486_487insA. Transfection and organotypic
            assays support loss of function; truncated protein can be expressed and mislocalized.
        - name: c.2T>C start-loss
          description: Homozygous in two siblings with relatively greater motor/language acquisition and
            compound heterozygous with c.354dupG in a skin-negative hypomyelinating presentation. Residual
            translation is hypothesized, not established.
        - name: c.622G>T (p.Glu208*)
          description: Last-exon stop variant in one patient; escape from nonsense-mediated decay is predicted
            rather than experimentally demonstrated.
        - name: c.85C>T (p.Arg29*)
          description: Homozygous in a molecularly confirmed patient; both parents were heterozygous.
            Nonsense-mediated decay or truncation was predicted.
        - name: Pathogenic sequence allele in trans with a SNAP29-containing deletion
          description: Recessive unmasking can occur within 22q11.2 deletion syndrome or with a smaller
            deletion; additional deleted genes complicate phenotype attribution.
      selected_evidence:
        snippet: The patient presents a combination of a loss-of-function SNAP29 mutation and a ∼370 kb
          22q11.2 deletion, each of these genetic variants inherited from one of the parents.
        supports: SUPPORT
        directness: DIRECT
