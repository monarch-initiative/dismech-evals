      assertion:
        name: CERKL Biallelic Loss-of-Function
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function variants (nonsense, frameshift, splice, or damaging missense)
          eliminate or severely reduce functional CERKL protein. CERKL is structurally related to ceramide
          kinase but has no demonstrated catalytic activity toward ceramide or any other identified substrate,
          so disease variants act through simple loss of the protein''s (non-catalytic) protective function
          rather than through a gain-of-function or dominant-negative mechanism.

          '
      selected_evidence:
        snippet: All of the patients from the RP26 family bear a homozygous mutation in exon 5, which
          generates a premature termination codon.
        supports: SUPPORT
