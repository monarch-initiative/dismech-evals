        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of CERKL-Mediated Protection Against Oxidative Stress
        biological_scale: MOLECULAR
        description: 'Wild-type CERKL protects cultured cells from apoptosis induced by oxidative stress;
          the RP-causing truncated R257X mutant does not. Loss of this protective function is proposed
          to tilt photoreceptors -- cells with high metabolic demand and chronic light-driven oxidative
          burden -- toward apoptosis.

          '
        biological_processes:
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: DECREASED
      selected_evidence:
        snippet: CERKL (but not the RP R257X mutant) exerts a protective role in cells against oxidative
          stress, consistent with RP mutations impairing the normal protein function in photoreceptors
          and thus tilting the balance toward apoptosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
