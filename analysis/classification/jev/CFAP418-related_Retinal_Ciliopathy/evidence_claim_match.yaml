      assertion:
        name: CFAP418
        association: Pathogenic biallelic loss-of-function and missense variants
        gene_term:
          preferred_term: CFAP418
          term:
            id: hgnc:27232
            label: CFAP418
        notes: CFAP418 (C8orf37, BBS21) encodes a cilium-associated protein that localizes at the base
          of the photoreceptor connecting cilium. Biallelic variants span a phenotypic continuum from
          isolated cone-rod dystrophy (CORD16) and retinitis pigmentosa (RP64) to full Bardet-Biedl syndrome
          (BBS21). ClinGen classifies the gene-disease relationship as Definitive for ciliopathy.
      selected_evidence:
        snippet: The same mutation has been described in unrelated patients with non-syndromic cone-rod
          dystrophy and other C8orf37 changes were found in individuals with retinitis pigmentosa.
        supports: SUPPORT
