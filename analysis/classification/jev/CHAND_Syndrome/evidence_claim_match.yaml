  513dea23c5a8d63c05b9d959a4bb382b8fc132517b02e2c8e7faa6e93cd6773e:
    claim:
      about:
        disease:
          name: CHAND Syndrome
          disease_term:
            preferred_term: CHAND syndrome
            term:
              id: MONDO:0008959
              label: CHAND syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Periderm Defect and Epithelial Fusion
        biological_scale: TISSUE
        description: The periderm is a transient superficial epithelial layer that keeps apposed embryonic
          epithelia, including the eyelid margins, from adhering. In Ripk4-deficient mice periderm development
          is abnormal and E-cadherin is mislocalized to the apical membrane of the outer peridermal cells,
          so epithelial surfaces fuse; all external orifices are fused in the knockout, and the fusions
          depend on E-cadherin. Ankyloblepharon in CHAND syndrome is the human manifestation of this defect
          at the eyelid margins; in the severe, kinase-domain RIPK4 disease the same failure also produces
          oral synechiae and pterygia.
        cell_types:
        - preferred_term: peridermal cell
          term:
            id: CL:0000078
            label: peridermal cell
        biological_processes:
        - preferred_term: eyelid development in camera-type eye
          term:
            id: GO:0061029
            label: eyelid development in camera-type eye
          modifier: ABNORMAL
        notes: The mouse data are from Ripk4 null animals, which model the severe end of the RIPK4 spectrum.
          That the hypomorphic CHAND allele confines this defect to the eyelid margins is an inference
          from the phenotype, not a measured result. ABNORMAL is used for the eyelid process because the
          defect is a failure of lid-margin separation rather than a change in the amount of a process.
      selected_evidence:
        snippet: Here we describe that RIPK4 deficiency in mice causes epithelial fusions associated with
          abnormal periderm development and aberrant ectopic localization of E-cadherin on the apical
          membrane of the outer peridermal cell layers.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
