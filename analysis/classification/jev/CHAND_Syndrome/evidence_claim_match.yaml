              id: MONDO:0008959
              label: CHAND syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired p63-RIPK4-IRF6 Differentiation Signaling
        biological_scale: MOLECULAR
        description: RIPK4 sits in a transcriptional and signaling axis of surface ectoderm. p63, the
          master regulator of stratified epithelia mutated in AEC syndrome, directly activates RIPK4 transcription.
          RIPK4 in turn phosphorylates IRF6, the transcription factor mutated in Van der Woude and popliteal
          pterygium syndromes, at Ser413 and Ser424, activating it and moving it into the nucleus, where
          it induces the differentiation regulators GRHL3 and OVOL1. Loss of RIPK4 therefore weakens the
          IRF6-dependent differentiation program. This shared axis is why CHAND syndrome overlaps clinically
          with AEC syndrome (ankyloblepharon, ectodermal dysplasia) and why the RIPK4 and IRF6 pterygium
          syndromes resemble each other.
        genes:
        - preferred_term: RIPK4
          term:
            id: hgnc:496
            label: RIPK4
        biological_processes:
        - preferred_term: keratinocyte differentiation
          term:
            id: GO:0030216
            label: keratinocyte differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: Gene promoter reporter and in vitro kinase assays, coimmunoprecipitation experiments,
          and confocal microscopy demonstrated that RIPK4 directly regulates IRF6 trans-activator activity
          and nuclear translocation.
        supports: SUPPORT
