      assertion_type: Pathophysiology
      assertion:
        name: RIPK4 Kinase Signaling Deficiency
        biological_scale: MOLECULAR
        description: RIPK4 is an ankyrin-repeat serine/threonine kinase expressed in keratinocytes and
          required for their differentiation. In CHAND syndrome both alleles carry p.Glu284Lys, just outside
          the kinase domain. The kinase-domain variants that cause Bartsocas-Papas syndrome abolish catalytic
          activity in reporter assays; the CHAND variant has not been tested, and the proposal that it
          is a partial loss of function explaining the milder phenotype is an inference from its position.
        genes:
        - preferred_term: RIPK4
          term:
            id: hgnc:496
            label: RIPK4
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: Homozygous germline RIPK4 p.Glu284Lys in both molecularly confirmed CHAND families.
        molecular_functions:
        - preferred_term: protein serine/threonine kinase activity
          term:
            id: GO:0004674
            label: protein serine/threonine kinase activity
          modifier: DECREASED
        notes: modifier DECREASED rather than LOSS_OF_FUNCTION because the variant is proposed to be hypomorphic
          and no assay of it exists. functional_impact_category is left unset on genetic_context for the
          same reason.
      selected_evidence:
        snippet: Alternatively, CHAND and Bartsocas-Papas syndrome might be allelic disorders or RIPK4
          mutations could confer varying degrees of phenotypic severity, depending on their localization
          within or outside functionally important domains.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
