        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chand_versus_ripk4_spectrum
        kind: KNOWLEDGE_GAP
        attaches_to:
        - disease#
        prompt: Is CHAND syndrome a distinct disease or the mild end of a single RIPK4 spectrum that runs
          through attenuated Bartsocas-Papas syndrome to the lethal pterygium phenotype?
        rationale: Molecular evidence for CHAND syndrome rests on two families with the same homozygous
          variant, p.Glu284Lys. Attenuated RIPK4 cases without pterygia have also been reported under
