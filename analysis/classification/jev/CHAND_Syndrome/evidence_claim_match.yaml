        gene_term:
          preferred_term: RIPK4
          term:
            id: hgnc:496
            label: RIPK4
        relationship_type: CAUSATIVE
        variants:
        - name: c.850G>A (p.Glu284Lys)
          description: Homozygous missense variant found in the three affected children of the Kuwaiti
            kindred and in the independent CHAND patient reported by Busa and colleagues. It lies just
            C-terminal to the serine/threonine kinase domain, whereas the Bartsocas-Papas syndrome missense
            variants cluster inside that domain; the original authors proposed this location as the reason
            for the milder phenotype. No functional assay of p.Glu284Lys has been reported.
          type: MISSENSE
        notes: Biallelic RIPK4 variants cause CHAND syndrome. The gene was identified by homozygosity
          mapping and exome sequencing in a consanguineous Kuwaiti kindred after TP63, the AEC syndrome
          gene, had been excluded, and was confirmed in an unrelated patient carrying the same homozygous
          variant. The disease-specific evidence is therefore two families sharing one variant. No ClinGen
          gene-disease validity assertion was found for RIPK4 and CHAND syndrome, so no gene_disease_validity
          tier is recorded.
      selected_evidence:
        snippet: After exclusion of pathogenic mutations in TP63 we performed homozygosity mapping, followed
          by exome sequencing of one affected individual.
        supports: SUPPORT
