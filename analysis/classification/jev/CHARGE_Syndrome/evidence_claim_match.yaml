      assertion_type: ProgressionInfo
      assertion:
        phase: Childhood through adulthood
        notes: 'Beyond infancy, decreased life expectancy reflects residual heart defects, infection,
          aspiration or choking, obstructive and central apnea, and possibly seizures. This is the phase
          in which the syndrome''s respiratory and infectious morbidity dominates rather than its structural
          cardiac lesions. Crucially, the outlook is not uniformly poor: many individuals have a normal
          life expectancy, and the entry should not be read as implying otherwise.'
      selected_evidence:
        snippet: In childhood, adolescence, and adulthood, decreased life expectancy is likely related
          to a combination of residual heart defects, infections, aspiration or choking, respiratory issues
          including obstructive and central apnea, and possibly seizures.
        supports: SUPPORT
