        description: CHD7 acts cell-autonomously in multipotent neural crest cells to fine-tune expression
          of gene networks critical for their development and migration. Conditional deletion of Chd7
          in neural crest cells in mice causes severe conotruncal heart defects and perinatal lethality,
          recapitulating the cardiac neural crest contribution to CHARGE-type malformations. Disrupted
          neural crest development provides a unifying explanation for the multisystem craniofacial, cardiac,
          and other anomalies of CHARGE syndrome.
        cell_types:
