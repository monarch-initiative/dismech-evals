      assertion_type: Pathophysiology
      assertion:
        name: Inappropriate p53 activation
        description: CHD7 binds the p53 promoter and negatively regulates p53 expression. Loss of CHD7
          in neural crest cells (and in samples from patients with CHARGE syndrome) results in inappropriate
          p53 activation, and p53 heterozygosity partially rescues Chd7-null mouse phenotypes, indicating
          that excessive p53 activity contributes to CHARGE-type developmental defects downstream of CHD7
          loss.
        biological_processes:
        - preferred_term: Signal transduction by p53 class mediator
          term:
            id: GO:0072331
            label: signal transduction by p53 class mediator
          modifier: INCREASED
      selected_evidence:
        snippet: we found that CHD7 can bind to the p53 promoter, thereby negatively regulating p53 expression,
          and that CHD7 loss in mouse neural crest cells or samples from patients with CHARGE syndrome
          results in p53 activation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25119037
      reference_title: Inappropriate p53 activation during development induces features of CHARGE syndrome.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that CHD7 normally represses p53 and that CHD7 loss causes inappropriate
        p53 activation, a contributing mechanism in CHARGE syndrome.
