      assertion_type: Pathophysiology
      assertion:
        name: CHD7 haploinsufficiency and impaired ATP-dependent chromatin remodeling
        description: CHD7 encodes a chromodomain helicase DNA-binding protein that functions as an ATP-dependent
          chromatin-remodeling enzyme. Heterozygous loss-of-function variants reduce CHD7 dosage (haploinsufficiency),
          impairing the chromatin-remodeling activity needed to fine-tune transcriptional programs during
          development. Most pathogenic variants are unique nonsense or frameshift variants scattered throughout
          the gene, consistent with a loss-of-function mechanism.
        gene:
          preferred_term: CHD7
          modifier: DECREASED
          term:
            id: hgnc:20626
            label: CHD7
        biological_processes:
        - preferred_term: ATP-dependent chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: DECREASED
      selected_evidence:
        snippet: Sequence analysis of genes located in this region detected mutations in the gene CHD7
          in 10 of 17 individuals with CHARGE syndrome without microdeletions, accounting for the disease
          in most affected individuals.
        supports: SUPPORT
    origin:
