  f64d1914fc075a702d30b84ee5c8bc3b761174249432afa20ebe6a4a605a0eff:
    claim:
      about:
        disease:
          name: CHARGE syndrome
          disease_term:
            preferred_term: CHARGE syndrome
            term:
              id: MONDO:0008965
              label: CHARGE syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired thymic development and T-cell output
        description: 'The immune arm of CHD7 disorder, and the reason CHARGE syndrome appears in the IUIS
          classification of inborn errors of immunity. A minority of patients have thymic aplasia or hypoplasia
          with consequent reduction in T-cell numbers, ranging from mild T-cell lymphopenia through combined
          T- and B-cell defects to, in rare patients, a T-B+NK+ severe combined immunodeficiency that
          is fatal without immune reconstitution. The phenotype overlaps that of 22q11.2 deletion syndrome,
          with which CHARGE syndrome shares several non-immune features.

          Two things about this node are deliberately understated. First, it is not a constitutive feature:
          the source that catalogues it calls immunological problems "a rare feature of CHARGE syndrome",
          and a prospective cohort of 21 CHD7-genotyped patients found no significant immune defect at
          the time of testing despite recurrent sinopulmonary infections. Second, the population frequency
          is genuinely unsettled rather than merely unmeasured here - see the charge_immunodeficiency_prevalence
          discussion. Nothing in this entry should be read as asserting that T-cell deficiency is expected
          in an individual with CHARGE syndrome.'
        biological_scale: TISSUE
        biological_processes:
        - preferred_term: Thymus development
          term:
            id: GO:0048538
            label: thymus development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Immunological problems are a rare feature of CHARGE syndrome, with a small number of
          CHARGE patients described as having thymic aplasia or hypoplasia,
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20186815
      reference_title: Molecular and phenotypic aspects of CHD7 mutation in CHARGE syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The review that defines this node, and the source of its central qualification: thymic
        aplasia/hypoplasia occurs in CHARGE syndrome but is a rare rather than a constitutive feature.'
