        description: 'Recurrent ear and sinopulmonary infections are common in children with CHARGE syndrome.
          Importantly, they are usually not attributable to a measurable immune defect: palatal, airway,
          eustachian-tube and aspiration factors contribute, and the prospective cohort cited here found
          an identifiable immune abnormality in only 2 of 21 patients. Recurrent infection in CHARGE syndrome
          should therefore prompt immune testing rather than be assumed to establish immunodeficiency.'
        phenotype_term:
