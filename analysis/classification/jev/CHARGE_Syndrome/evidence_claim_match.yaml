      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing for CHD7
        description: The diagnosis of CHD7 disorder/CHARGE syndrome is established in a proband with suggestive
          clinical and imaging findings and a heterozygous pathogenic variant in (or deletion of) CHD7
          identified by molecular genetic testing. Clinical diagnosis historically relied on the Blake
          and later Verloes major/minor criteria (e.g., coloboma, choanal atresia, characteristic ear
          anomalies, and semicircular canal hypoplasia as major features).
      selected_evidence:
        snippet: The diagnosis of CHD7 disorder is established in a proband with suggestive clinical and
          imaging findings and a heterozygous pathogenic variant in or deletion of CHD7 identified by
          molecular genetic testing.
        supports: SUPPORT
