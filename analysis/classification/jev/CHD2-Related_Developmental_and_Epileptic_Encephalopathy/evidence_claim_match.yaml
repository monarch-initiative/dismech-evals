            term:
              id: MONDO:0014150
              label: developmental and epileptic encephalopathy 94
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_chd2_dosage_window_chaserr_upregulation
        prompt: Given that CHD2 is dosage-sensitive in both directions - haploinsufficiency causes this
          disorder while increased CHD2 abundance (as in CHASERR lncRNA deletion) causes a distinct, more
          severe neurodevelopmental disorder - can a CHD2-upregulating precision therapy (for example
          an antisense oligonucleotide targeting the CHD2-repressing lncRNA CHASERR) safely raise CHD2
          toward normal without overshooting into the pathogenic overexpression range?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#CHD2 Haploinsufficiency
        rationale: The natural therapeutic hypothesis for a haploinsufficiency disorder is to increase
          expression of the remaining functional allele. CHD2 is repressed by the adjacent long noncoding
          RNA CHASERR, making CHASERR a plausible antisense-oligonucleotide target for raising CHD2. However,
          the discovery that CHASERR deletion increases CHD2 abundance and causes a distinct, more severe
          disorder shows that CHD2 overexpression is itself pathogenic. Any upregulation strategy therefore
          has to thread a narrow therapeutic window, and the safe dosing range, durability, and developmental
          timing of such an approach are unknown. This is a preclinical hypothesis and no such therapy
          is approved or in clinical use.
        proposed_experiments:
        - experiment_id: exp_chd2_chaserr_aso_dose_window
          name: CHASERR-targeting ASO dose-window study in human neurons and mouse
          description: In CHD2-haploinsufficient human iPSC-derived neurons and in Chd2 heterozygous mice,
            titrate CHASERR-targeting antisense oligonucleotides across a dose range, quantifying restoration
            of CHD2 protein toward the normal level, rescue of interneuron-maturation and network-excitability
            phenotypes, and any deleterious effects of overshoot into CHD2 overexpression.
      selected_evidence:
        snippet: Chaserr, a highly  conserved long noncoding RNA transcribed from a region near the transcription  start
          site of Chd2 and on the same strand, acts in concert with the CHD2 protein  to maintain proper
          Chd2 expression levels.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31704914
      reference_title: Regulation of CHD2 expression by the Chaserr long noncoding RNA gene is essential
        for viability.
      evidence_source: MODEL_ORGANISM
      explanation: CHASERR regulates CHD2 dosage, making it a candidate target for raising CHD2 in haploinsufficiency.
