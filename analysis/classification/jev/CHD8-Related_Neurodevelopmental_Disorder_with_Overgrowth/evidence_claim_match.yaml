        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: chd8_remodeling_independent_missense
        hypothesis_label: Remodelling-independent mechanism for a subset of missense alleles
        status: EMERGING
        description: 'A minority model with real support: not every CHD8 missense variant found in autism
          patients is causal, and among those that are, some act by a mechanism that does NOT involve
          loss of chromatin-remodelling function. Independently, one individual in the largest cohort
          showed a possible gain-of-function methylation signature rather than the expected haploinsufficiency
          signature. Together these imply that "haploinsufficiency" is an incomplete description of the
          molecular etiology and that the pathophysiology graph should not be read as forcing every pathogenic
          allele through the single remodelling node.'
      selected_evidence:
        snippet: Furthermore, we found that mutations with high scores cause ASD by mechanisms either
          dependent on or independent of loss of chromatin-remodeling function.
        supports: SUPPORT
    origin:
