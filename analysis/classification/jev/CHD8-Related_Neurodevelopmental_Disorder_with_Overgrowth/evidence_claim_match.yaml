          of vagal neural crest cells and enteric neural/glial progenitors emigrating from the neural
          tube and impairs their early migration, later yielding fewer serotonergic enteric neurons and
          enterochromaffin cells, a thinner intestinal epithelium and fewer goblet cells. In mice, Chd8L
          haploinsufficiency increases intestinal permeability and reduces tuft and goblet cell counts.
          This is the mechanistic basis of the gastrointestinal arm of the syndrome, which is not explained
          by the CNS phenotype.
