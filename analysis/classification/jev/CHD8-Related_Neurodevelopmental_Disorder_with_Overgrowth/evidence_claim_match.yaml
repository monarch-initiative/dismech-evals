      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autism Spectrum Disorder (multifactorial)
        disease_term:
          preferred_term: autism spectrum disorder
          term:
            id: MONDO:0005258
            label: autism spectrum disorder
        description: 'The single most important boundary for this entry. Broad, multifactorial autism
          spectrum disorder lists CHD8 among many risk genes recovered by large-scale exome sequencing,
          and dismech curates it as a separate, polygenic entity. This entry is NOT that entity: here
          CHD8 haploinsufficiency is the sufficient monogenic cause of a syndromic, highly penetrant phenotype
          with overgrowth, macrocephaly, dysmorphism, sleep and gastrointestinal involvement.'
        distinguishing_features:
        - Presence of a heterozygous pathogenic CHD8 variant; macrocephaly and tall stature; recognisable
          facies; prominent sleep and gastrointestinal involvement; autosomal dominant transmission with
          50% recurrence risk to offspring. Broad ASD has no single sufficient genetic cause and no consistent
          overgrowth phenotype.
      selected_evidence:
        snippet: Our findings indicate that CHD8 disruptions define a distinct ASD subtype and reveal
          unexpected comorbidities between brain development and enteric innervation.
        supports: SUPPORT
