      assertion_type: Discussion
      assertion:
        discussion_id: chd8_frequency_ascertainment_discrepancy
        kind: INTERPRETATION
        prompt: Which phenotype frequencies should this entry assert, given that CHD8 cohorts were ascertained
          in systematically different ways and report materially different numbers for the same features?
        rationale: 'The published cohorts disagree in a patterned, non-random way. Cohorts recruited through
          overgrowth clinics report near-universal overgrowth and intellectual disability; cohorts recruited
          through autism cohorts report high autism rates; the largest series is a literature aggregation
          across both and regresses toward lower values. Concretely: macrocephaly is 62.5% in the truncating-variant
          series and about 80% in GeneReviews; sleep disturbance is 50% versus 29%; hypotonia is 27%-29%
          across two cohorts versus "about 30%" in GeneReviews. The convention applied in this entry is
          to band on the figure defensible across sources rather than the highest available one, to cite
          the quantitative statement itself as evidence for each band per the project''s frequency-evidence
          guidelines, and to record the disagreeing figure alongside it rather than suppress it. Where
          the sources cannot be reconciled into a band at all, `frequency:` is omitted.'
      selected_evidence:
        snippet: 'a pattern of common features: macrocephaly (62.5%), tall stature (47%), developmental
          delay and/or intellectual disability (81%), ASDs (84%), sleep difficulties (50%), gastrointestinal
          problems (40%), and distinct facial features'
        supports: SUPPORT
