      assertion_type: Variant
      assertion:
        name: CHD8 missense variants of uncertain causality
        gene:
          preferred_term: CHD8
          term:
            id: hgnc:20153
            label: CHD8
        description: Missense variants are the most common non-truncating CHD8 change reported in autism,
          and they are the principal variant-interpretation problem in this disorder. Functional testing
          across biochemical activity, embryonic stem cell neural differentiation and mouse behaviour
          showed that only high-prediction-score missense alleles produce autism-like phenotypes, so a
          CHD8 missense variant must not be assumed pathogenic without in silico support and, ideally,
          functional or episignature data.
      selected_evidence:
        snippet: Only mutations with high prediction scores gave rise to ASD-like phenotypes in mice,
          suggesting that not all CHD8 missense mutations detected in ASD patients are directly responsible
          for the development of ASD.
        supports: SUPPORT
