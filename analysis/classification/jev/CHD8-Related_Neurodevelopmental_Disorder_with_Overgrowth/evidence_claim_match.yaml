              label: intellectual developmental disorder with autism and macrocephaly
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chd8_megalencephaly_rodent_vs_primate_mechanism
        kind: HUMAN_MODEL_MISMATCH
        prompt: Is CHD8-related brain overgrowth in humans driven mainly by excess glial production, as
          the non-human primate data indicate, or by excess neural progenitor/neuronal output, as the
          rodent models are usually read to show?
        attaches_to:
        - pathophysiology#Increased Gliogenesis and White Matter Expansion
        - pathophysiology#Brain Overgrowth and Megalencephaly
        rationale: 'Rodent models produced inconsistent accounts of the macrocephaly mechanism, and mouse
          cortex is enlarged without a proportionate increase in neuron number. In cynomolgus monkey,
          CHD8 disruption before the gliogenic switch increases glial number and enlarges the brain. Because
          primate brains have a far larger glial complement and a much more protracted gliogenic period
          than rodent brains, this is plausibly a real species difference rather than a technical discrepancy
          - so the question is not whether the mouse result is reproducible but whether it translates.
          That is a translational-validity question about existing model evidence, which is why this is
          a HUMAN_MODEL_MISMATCH rather than a plain knowledge gap. Practical consequence: the entry keeps
          both the progenitor-proliferation route and the gliogenesis route as parallel edges into brain
          overgrowth rather than committing to one.'
        proposed_experiments:
        - experiment_id: chd8_exp_human_postmortem_glia_neuron_ratio
          name: Cell-type-resolved quantification (single-nucleus RNA-seq or stereology) of glial versus
            neuronal number in post-mortem cortex from CHD8 variant carriers versus matched controls.
        - experiment_id: chd8_exp_human_white_matter_imaging
          name: Systematic volumetric and white-matter MRI characterisation of a CHD8-NDD cohort, testing
            whether white-matter expansion accounts for the increased head circumference as it does in
            the monkey.
      selected_evidence:
        snippet: However, studies of small animal models showed inconsistent findings about the mechanisms
          for CHD8 deficiency-mediated autism symptoms and macrocephaly.
        supports: SUPPORT
    origin:
