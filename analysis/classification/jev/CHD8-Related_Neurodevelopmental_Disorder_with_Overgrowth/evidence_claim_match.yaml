        biological_scale: TISSUE
        description: A mechanistically distinct arm accounting for the sleep phenotype. In Drosophila,
          the single CHD8/CHD7 ortholog kismet is required in glia - specifically the subperineurial glia
          that constitute the blood-brain barrier - for both developmental and adult sleep architecture,
          and the sleep disturbance is caused by elevated serotonin during development. Critically, despite
          this developmental origin the defect is reversible in adulthood by a behavioural regime resembling
          human sleep restriction therapy, which supplies a mechanistic rationale for the behavioural
          sleep interventions GeneReviews already recommends empirically.
