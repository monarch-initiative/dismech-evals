        discussion_id: chd8_genetic_background_modifier
        kind: OPEN_QUESTION
        prompt: Is the marked clinical variability of CHD8-NDD - which extends from severe intellectual
          disability with autism to an isolated adult focal dystonia in a cognitively intact individual
          - driven by genetic background rather than chance?
        rationale: Crossing a Chd8 mutation across a mouse genetic reference panel produced strain- and
          sex-dependent trait disruptions, including effects in opposite directions on different backgrounds
          and frank resilience on others. That is a designed experiment rather than a post-hoc observation,
          and it makes modifier-driven variability a serious hypothesis for the human disorder. No human
          modifier locus has been mapped, so no MODIFIER-typed gene record is asserted in the `genetic:`
          section. The practical implication for counselling is that intrafamilial variability should
          be expected, as the documented paternal-transmission case shows.
        proposed_experiments:
        - experiment_id: chd8_exp_human_polygenic_modifier_analysis
          name: Polygenic background and rare-variant modifier analysis within a molecularly confirmed
            CHD8-NDD cohort phenotyped on a common severity instrument.
      selected_evidence:
        snippet: Some strains exhibited large effect-size trait disruptions, sometimes in opposite directions,
          and-remarkably-others expressed resilience.
        supports: SUPPORT
