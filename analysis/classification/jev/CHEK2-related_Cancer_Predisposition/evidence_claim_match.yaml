        category: Neoplastic
        name: Male breast carcinoma
        description: 'Male breast cancer risk has been reported inconsistently, largely because studies
          have been small and often in populations where c.1100del is uncommon. Where the founder allele
          is prevalent the reported effect is substantial: c.1100delC carriers have roughly ten times
          the risk of non-carriers.

          This phenotype is asserted despite ACMG placing male breast cancer in the same insufficient-evidence
          list it uses for renal, thyroid and pancreatic cancer - the grading that keeps colorectal, thyroid
          and kidney out of this entry''s phenotypes and in a discussion instead. The asymmetry is deliberate
          and both sides are cited below. Male breast cancer is kept as a phenotype because the effect
          is allele-specific and quantified rather than merely proposed, and because the reported inconsistency
          has a stated cause - small studies in populations lacking the founder allele - rather than being
          unexplained conflict. A curator who weighs the ACMG grading more heavily should move it into
          discussions#chek2_wider_tumour_spectrum; the evidence for doing so is already here.'
        phenotype_term:
          preferred_term: Breast carcinoma
          term:
            id: HP:0003002
            label: Breast carcinoma
      selected_evidence:
        snippet: A recent meta-analysis showed an increased risk for MBC for CHEK2 heterozygotes (OR 3.13,
          95% CI 1.94–5.07).
        supports: SUPPORT
