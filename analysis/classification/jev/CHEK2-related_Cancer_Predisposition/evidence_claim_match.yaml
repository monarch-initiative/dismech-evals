      assertion_type: Genetic
      assertion:
        name: CHEK2 p.Ile157Thr (hypomorphic missense allele)
        variant_origin: GERMLINE
        gene_term:
          preferred_term: CHEK2
          term:
            id: hgnc:16627
            label: CHEK2
        relationship_type: RISK_FACTOR
        frequency: 2.5% in the gnomAD founder subpopulation
        notes: NM_007194.4:c.470T>C p.(Ile157Thr). Nearly three times commoner than the truncating founder
          allele and substantially lower risk. Recorded as RISK_FACTOR rather than CAUSATIVE because the
          ACMG resource states its penetrance is not, in isolation, at a level of clinical actionability
          - so treating it as a causative allele would misdirect management.
        variants:
        - name: NM_007194.4:c.470T>C p.(Ile157Thr)
          description: Missense allele that adversely affects protein function while retaining penetrance
            too low to be clinically actionable on its own.
          functional_effects:
          - function: reduced but not abolished CHK2 function
            description: Deleterious to protein function per ACMG, in contrast to the complete kinase
              abrogation demonstrated for c.1100delC.
      selected_evidence:
        snippet: there is evidence that the common variant p.(Ile157Thr) adversely affects protein function
          and is therefore “deleterious;” yet, its penetrance is low and in isolation not at a level of
          clinical actionability
        supports: SUPPORT
