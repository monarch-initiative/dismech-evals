          the most frequently returned results on hereditary cancer panels. Germline CHEK2 variants have
          been reported in about 1% of the population, but that figure should not be read as a single
          carrier frequency: it is dominated by a small number of founder alleles whose individual frequencies
          differ severalfold and which confer materially different risk. The two commonest are curated
          separately below.'
