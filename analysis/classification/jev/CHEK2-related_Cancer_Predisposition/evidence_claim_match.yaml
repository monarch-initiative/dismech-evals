      assertion:
        discussion_id: chek2_prognosis_by_context
        kind: KNOWLEDGE_GAP
        attaches_to:
        - disease#
        prompt: Does CHEK2 genotype independently worsen cancer outcome?
        rationale: Earlier c.1100del breast-cancer cohorts reported heterogeneous survival results. A
          2025 genome-first analysis found no significant all-cause survival difference between carriers
          with cancer and controls with cancer, while overall mortality differed only in UK Biobank, mainly
          after age 75. These endpoints and ascertainment schemes do not directly resolve variant-specific
          breast-cancer mortality. Prognosis should be interpreted by cancer type, stage, treatment and
          competing risks.
      selected_evidence:
        snippet: There was no significant effect on long-term outcome, compared with more than 3000 wild-type
          controls.
        supports: SUPPORT
        directness: DIRECT
