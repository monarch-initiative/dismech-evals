            term:
              id: MONDO:0700271
              label: CHEK2-related cancer predisposition
        context: []
      assertion_type: Genetic
      assertion:
        name: CHEK2
        variant_origin: GERMLINE
        gene_term:
          preferred_term: CHEK2
          term:
            id: hgnc:16627
            label: CHEK2
        relationship_type: CAUSATIVE
        notes: The gene-level association establishes an inherited predisposition, not uniform penetrance
          for every variant. Truncating alleles and some missense alleles confer moderate risk; p.Ile157Thr,
          p.Ser428Phe and p.Thr476Met have lower or uncertain actionable risk in isolation. Allele frequencies
          vary by ancestry and founder population. In a 2025 genome-first analysis, 3,153 of 167,050 MyCode
          adults and 3,232 of 469,765 UK Biobank participants met the study pathogenic/likely pathogenic
          variant definition, which included common lower-risk missense variants and excluded copy-number
          variants; these are cohort-specific carrier proportions, not disease prevalence.
        variants:
        - name: NM_007194.4:c.1100del p.(Thr367MetfsTer15)
          clinical_significance: PATHOGENIC
          description: Northern European founder frameshift that disrupts the kinase domain. ACMG cites
            an odds ratio of 2.66 (95% CI 2.27–3.11) for female breast cancer. This association does not
            imply that every carrier develops cancer.
          functional_effects:
          - function: loss of CHK2 kinase activity
            description: Truncation disrupts kinase function; functional dosage and residual protein can
              vary by tissue and assay.
        - name: NM_007194.4:c.470T>C p.(Ile157Thr)
          description: Common lower-penetrance FHA-domain missense allele. ACMG reports breast cancer
            OR 1.30 (95% CI 1.06–1.59), below actionability thresholds when considered alone. Laboratory
            classifications have varied; functional impairment and clinical actionability are distinct.
          functional_effects:
          - function: partial, assay-dependent impairment of CHK2 function
            description: Purified recombinant protein retained approximately 40–50% of wild-type kinase
              activity at saturating ATP in a CDC25-peptide assay. This result does not establish equivalent
              impairment of every substrate in vivo.
        - name: NM_007194.4:c.1283C>T p.(Ser428Phe)
          description: Common missense allele with lower or uncertain clinical impact in isolation. The
            ACMG review cites OR 1.26 (95% CI 0.76–2.12), which was not statistically significant in that
            study; surveillance should reflect the full risk assessment.
        - name: NM_007194.4:c.349A>G p.(Arg117Gly)
          description: 'A missense variant with breast cancer risk estimates closer to truncating alleles:
            OR 2.26 (95% CI 1.29–3.95) and 2.69 (95% CI 1.46–4.94) in studies summarized by ACMG. Not
            all missense alleles belong in a uniformly low-risk class.'
      selected_evidence:
        snippet: Overall, there were 3232 case participants ... in UKBB and 3153 case participants ...
          in MyCode
        supports: SUPPORT
        directness: DIRECT
