        rationale: There is no single correct figure. Risk for a CHEK2 heterozygote runs on a continuum
          from population level to high risk depending on the specific variant, family history and other
          modifiers, which is why the management sources direct clinicians to a personalised estimate
          rather than a genotype-based number.
      selected_evidence:
        snippet: Although CHEK2 is considered a moderate penetrance gene, cancer risks may be considered
          as a continuous variable, which are influenced by family history and other modifiers.
