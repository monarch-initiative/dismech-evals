              id: MONDO:0700271
              label: CHEK2-related cancer predisposition
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chek2_not_li_fraumeni
        kind: CONTROVERSY
        attaches_to:
        - disease#
        prompt: Is CHEK2 a Li-Fraumeni syndrome gene?
        rationale: No. An early case series proposed the association in individuals meeting Li-Fraumeni
          clinical criteria without a germline TP53 variant, and it has since been refuted, including
          by restudy of the original families. The claim persists in older literature and in clinical
          folklore, so the refutation is recorded here as evidence rather than left as an unstated absence.
          Getting this wrong would place the entry in the wrong nosological family and imply Li-Fraumeni
          surveillance for CHEK2 heterozygotes.
        status: RESOLVED
      selected_evidence:
        snippet: a large body of evidence has conclusively shown that variants in CHEK2 are not associated
          with Li-Fraumeni syndrome
        supports: REFUTE
    origin:
