        prompt: What are the penetrance and optimal surveillance of biallelic genotypes?
        rationale: The 2024 series included 294 individuals, 159 homozygous for p.Ile157Thr. Overall 157
          had at least one malignancy or premalignancy, and 55 of those 157 had multiple such tumors.
          Among affected women, biallelic loss-of-function variants were associated with earlier onset
          and more multiple tumors than homozygous p.Ile157Thr. Ascertainment and missing follow-up prevent
          lifetime penetrance estimates. These genotype strata do not establish a uniform recessive developmental
          syndrome.
