            preferred_term: CHEK2-related cancer predisposition
            term:
              id: MONDO:0700271
              label: CHEK2-related cancer predisposition
        context: []
      assertion_type: Phenotype
      assertion:
        category: Neoplastic
        name: Contralateral breast carcinoma
        description: After a first breast cancer, carriers of CHEK2 truncating pathogenic variants have
          an elevated risk of a metachronous contralateral primary. CARRIERS estimated ten-year cumulative
          incidence of 13% in premenopausal and 4% in postmenopausal carriers. The primary analysis excluded
          missense and low-penetrance variants; p.Ile157Thr alone was not significantly associated with
          contralateral risk. The cohort excluded synchronous bilateral disease and adjusted for endocrine
          therapy and other covariates.
        phenotype_term:
          preferred_term: Contralateral breast carcinoma
          term:
            id: HP:0003002
            label: Breast carcinoma
          laterality: BILATERAL
          description: Metachronous cancers in the two breasts; this is a second primary rather than metastasis.
        phenotype_contexts:
        - sex: FEMALE
          population: Premenopausal women with prior breast cancer and truncating CHEK2 pathogenic variants
            in CARRIERS
          notes: Estimated 13% ten-year cumulative incidence; subset uncertainty and treatment exposure
            matter.
        - sex: FEMALE
          population: Postmenopausal women with prior breast cancer and truncating CHEK2 pathogenic variants
            in CARRIERS
          notes: Estimated 4% ten-year cumulative incidence; this must not be compared with a five-year
