      assertion_type: Discussion
      assertion:
        discussion_id: chek2_wider_tumour_spectrum
        kind: KNOWLEDGE_GAP
        attaches_to:
        - disease#
        prompt: Which additional tumor associations warrant clinical action?
        rationale: A 2025 genome-first study replicated kidney, bladder and lymphoid leukemia associations
          in MyCode and UK Biobank. Thyroid association appeared only in MyCode; colorectal findings remain
          discordant across studies. Bonferroni correction was applied to organ-system groups, not individual
          cancer types, and absolute risks were not estimated. Association evidence therefore does not
          establish benefit from enhanced organ-specific screening. Testicular germ-cell tumor evidence
          is separately represented with its limits.
      selected_evidence:
        snippet: A significant excess of malignant neoplasm of thyroid and other endocrine tumors (C73-C75)
          was observed in MyCode but not UKBB
