        prompt: Which tumours beyond breast, prostate and testicular germ cell should be attributed to
          CHEK2?
        rationale: 'Colorectal, thyroid and kidney cancer are all proposed in the literature, and colorectal
          surveillance is offered in practice - but on the basis of family history rather than carrier
          status. GeneReviews grades associations outside breast and prostate as less well established
          or conflicting. These are therefore recorded here rather than as curated phenotypes: anything
          in the phenotypes section is exported as an asserted disease feature, so binding an ontology
          term to an association the sources decline to establish would publish the opposite of what the
          evidence supports. If a specific association later becomes established, it should be promoted
          to its own phenotype with its own term and evidence.'
      selected_evidence:
        snippet: Associations for other cancers are less well established or conflicting.
        supports: SUPPORT
