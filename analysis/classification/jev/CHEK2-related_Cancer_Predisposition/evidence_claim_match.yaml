      assertion_type: Treatment
      assertion:
        name: Olaparib under tumor-specific indications or trials
        description: CHEK2 alteration is not a reliable general predictor of PARP-inhibitor benefit. In
          TBCRC 048 metastatic breast cancer, no responses were observed with CHEK2 mutations alone. Separately,
          the US olaparib label includes qualifying CHEK2 alterations among HRR-gene-mutated metastatic
          castration-resistant prostate cancers after progression on enzalutamide or abiraterone, with
          approved companion-diagnostic selection. Regulatory eligibility for that specific indication
          does not establish CHEK2-specific efficacy or imply eligibility for breast cancer solely on
          CHEK2 status.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Olaparib treatment
          therapeutic_agent:
          - preferred_term: olaparib
            term:
              id: CHEBI:83766
              label: olaparib
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: No responses were observed with ATM or CHEK2 mutations alone.
        supports: REFUTE
        directness: DIRECT
