        name: Attenuated ATM-CHK2 Damage Response Signaling
        biological_scale: MOLECULAR
        description: CHK2 is activated by ATM after a double-strand break and phosphorylates BRCA1, BRCA2,
          p53 and CDC25 to initiate repair, apoptosis and cell-cycle arrest. Reduced CHK2 function attenuates
          that signal. The extent to which this translates into a failed p53 checkpoint is disputed -
          CHK2's contribution to activating p53-dependent arrest has been described as dispensable - so
          the node is curated as an attenuated signal rather than as checkpoint abolition.
        biological_processes:
        - preferred_term: DNA damage checkpoint signaling
