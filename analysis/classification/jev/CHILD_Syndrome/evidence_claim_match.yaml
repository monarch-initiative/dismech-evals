  235103e5f98c3579843d2a20684197e7a671782fa306219f8549a6677377da82:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NSDHL Loss of Function
        biological_scale: MOLECULAR
        description: 'Pathogenic NSDHL variants abolish or severely reduce the activity of the NAD(P)H
          steroid dehydrogenase-like protein. Missense alleles do not simply produce a catalytically dead
          but abundant enzyme: across a survey of thirteen disease-causing missense changes and one deletion,
          protein expression levels were uniformly low, and some mutants could be partially rescued by
          lowering the temperature or by adding a chemical chaperone, implicating a folding and stability
          defect rather than pure catalytic loss.'
        molecular_functions:
        - preferred_term: sterol-4-alpha-carboxylate 3-dehydrogenase (NSDHL) activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0000252
            label: 3-beta-hydroxysteroid dehydrogenase [NAD(P)+]/C4-decarboxylase activity
        genes:
        - preferred_term: NSDHL
          term:
            id: hgnc:13398
            label: NSDHL
      selected_evidence:
        snippet: Here we show that protein expression levels were low for all mutants, but some could
          be rescued by a lower temperature (30°C vs. 37°C) and/or the chemical chaperone glycerol.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40222685
      reference_title: 'Comprehensive survey of disease-causing missense mutations of the cholesterol
        synthesis enzyme NSDHL: Low temperature and a chemical chaperone rescue low protein expression
        of select mutants.'
      evidence_source: IN_VITRO
