  baca2d64916ff4f08fcf4411a4d9a9e7e948c3087d04ddaa9e0126dbfe8460da:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Bare patches and striated mice (Nsdhl mutant)
        species: Mouse
        genotype: Nsdhl mutant alleles Bpa and Str, X-linked dominant male-lethal
        publication: PMID:10369263
        description: Bare patches (Bpa) and striated (Str) are allelic X-linked dominant, male-lethal
          mouse mutations in Nsdhl, and were the first mammalian locus associated with such a phenotype.
          They reproduce the male lethality, the cholesterol biosynthetic defect, and the mosaic negative
          selection of mutant-expressing cells. They do not reproduce the lateralization of human CHILD
          syndrome, which is the single most distinctive human feature.
        genes:
        - preferred_term: NSDHL
          term:
            id: hgnc:13398
            label: NSDHL
        modeled_mechanisms:
        - target: NSDHL Loss of Function
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Independent Bpa and Str alleles are mutations in Nsdhl, and tissue sterol analysis
            confirms the biosynthetic role.
          limitations: The mouse skin phenotype is patterned as patches and stripes rather than the lateralized,
            midline-demarcated distribution seen in humans, so the model is informative for the enzymatic
            lesion but not for the lateralization.
          readouts:
          - name: Tissue sterol profile in affected Bpa mice
            target: NSDHL Loss of Function
            direction: ALTERED
            interpretation: Quantitative tissue sterol analysis is the biochemical correlate of the enzymatic
              block in this model.
        - target: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Heterozygous Bpa(1H) females are mosaic for NSDHL expression through normal random
            X inactivation, and their mutant clones are progressively depleted after birth, giving the
            human clearance model a longitudinal grounding it cannot get from single human biopsies.
          limitations: The clonal patterning is patches and stripes rather than a body-half boundary,
            so the model supports the selection process but not the geometry. The quantitative depletion
            was measured in liver and brain rather than skin.
          readouts:
          - name: Fraction of NSDHL-negative cells in liver over the first year
            target: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
            direction: DECREASED
            interpretation: A falling mutant fraction with age is the direct measurement of negative selection
              against NSDHL-deficient cells.
        - target: Placental Labyrinth Failure and Male Lethality
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Affected male embryos die in midgestation with a thin, poorly vascularized placental
            labyrinth and reduced trophoblast proliferation, and with loss of Hedgehog reporter activity
            in the affected placenta.
          limitations: Human male conceptuses are not available for study, so the placental mechanism
            of male lethality is inferred from mouse and has not been confirmed in human material. Rodent
            placental X inactivation is imprinted in most lineages rather than random, which is not the
            human arrangement, so the lineage logic behind the heterozygous female placental phenotype
            may not transfer.
          readouts:
          - name: Placental labyrinth thickness and fetal vessel density
            target: Placental Labyrinth Failure and Male Lethality
            direction: DECREASED
            interpretation: Structural correlate of the placental failure that accompanies male lethality.
      selected_evidence:
        snippet: They provide animal models for the study of CHILD syndrome, a further human condition
          due to mutations in a gene of the cholesterol synthesis pathway.
        supports: SUPPORT
