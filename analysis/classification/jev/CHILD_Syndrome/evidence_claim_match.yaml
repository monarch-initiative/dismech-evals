  19e2c3baac90b2922537cd418750e47c8cfbe278f62f298d7b1c1c9376696815:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: EBP
        gene_term:
          preferred_term: EBP
          term:
            id: hgnc:3133
            label: EBP
        relationship_type: CAUSATIVE
        notes: 'A minority route to a CHILD-syndrome phenotype runs through EBP, the delta8-delta7 sterol
          isomerase acting one step downstream of NSDHL and the gene of CDPX2. A patient with a clinical
          diagnosis of CHILD syndrome was found to have the CDPX2 plasma sterol signature (raised 8-dehydrocholesterol
          and 8(9)-cholestenol) and a nonsense variant in EBP. This is a genuine locus-heterogeneity finding,
          but it sits in unresolved tension with the NSDHL gene-discovery paper published alongside it,
          which found EBP unaffected in its own CHILD cohort and concluded the two disorders are not allelic.
          Both can be true if "CHILD syndrome" as clinically diagnosed spans two loci; which patients
          belong where is a nosological question this entry does not settle. See the corresponding discussion.
          EBP is deliberately left unwired to any pathophysiology node: it catalyses delta8-delta7 isomerization,
          a different step from the C4-demethylation that this pathograph models, so attaching it to the
          existing metabolic block node would misstate the enzymology. Wiring it properly would mean curating
          a second, EBP-specific block, which is not warranted by one hedged case report.'
      selected_evidence:
        snippet: Subsequently, we identified a nonsense mutation in exon 3 of the patient's 3beta-hydroxysteroid-delta8,delta7-isomerase
          gene. We speculate that at least some cases of CHILD syndrome are allelic with CDPX2 caused
          by 3beta-hydroxysteroid-delta8,delta7-isomerase deficiency.
        supports: SUPPORT
    origin:
