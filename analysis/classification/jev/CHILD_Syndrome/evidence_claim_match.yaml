      assertion_type: Pathophysiology
      assertion:
        name: Blocked C4-Demethylation with Cholesterol Deficiency and Methylsterol Accumulation
        biological_scale: MOLECULAR
        description: 'The enzymatic block has two simultaneous consequences that are usually described
          as one. Downstream, flux to cholesterol falls, so affected cells are deprived of the pathway
          end product. Upstream, methylsterol intermediates accumulate; these are not inert, but insert
          into membranes and perturb membrane function, oxysterol generation, Hedgehog signalling, and
          HMG-CoA reductase turnover. In cultured cerebellar granule cell precursors from a conditional
          Nsdhl mouse, the two arms are experimentally separable: exogenous cholesterol almost completely
          rescued the proliferation defect, while methylsterol accumulation above the block was associated
          instead with increased cell death.'
        biological_processes:
        - preferred_term: cholesterol biosynthetic process
          modifier: DECREASED
