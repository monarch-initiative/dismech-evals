              label: CHILD syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Functional mosaicism from random X inactivation
        inheritance_term:
          preferred_term: Typified by somatic mosaicism
          term:
            id: HP:0001442
            label: Typified by somatic mosaicism
        description: NSDHL lies at Xq28 and is therefore subject to X inactivation, so a heterozygous
          female is a functional mosaic of cells expressing either the mutant or the wild-type allele.
          This is not somatic mosaicism at the DNA level, which is why sequencing genomic DNA from lesional
          and non-lesional keratinocytes recovers both alleles equally; the mosaicism is only visible
          in expressed RNA. Lesional keratinocytes express the mutant allele exclusively, whereas clinically
          normal contralateral keratinocytes express only the wild-type allele. The X-inactivation pattern,
          rather than the particular allele, appears to set the distribution of skin involvement, which
          is why an exceptional patient can have an almost symmetric bilateral CHILD nevus.
      selected_evidence:
        snippet: Apparently, the effect of random X-inactivation is responsible for different patterns
          of cutaneous involvement in female carriers of NSDHL mutations.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/1
      evidence_path: /inheritance/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11907515
      reference_title: A novel missense mutation of NSDHL in an unusual case of CHILD syndrome showing
        bilateral, almost symmetric involvement.
      evidence_source: HUMAN_CLINICAL
      explanation: Attributes the variable cutaneous distribution, including the exceptional bilateral
        case, to the X-inactivation pattern rather than to allele identity.
