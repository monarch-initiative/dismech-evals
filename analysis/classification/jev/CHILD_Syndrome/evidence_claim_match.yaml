      assertion_type: Pathophysiology
      assertion:
        name: Placental Labyrinth Failure and Male Lethality
        biological_scale: ORGANISM
        description: The prenatal male lethality that shapes the inheritance pattern appears to be placental
          rather than embryonic. In Nsdhl mutant mice, affected male embryos die in midgestation with
          no consistent anomaly in the embryo itself, but with a labyrinth layer that is always thinner,
          with fewer fetal vessels and decreased trophoblast proliferation. Heterozygous female placentas
          show the defect non-cell-autonomously, and Hedgehog reporter activity is markedly reduced or
          absent in affected male placentas, with failure of Indian hedgehog-expressing cells to migrate
          into the developing placenta. The mechanism is inferred from mouse; it has not been demonstrated
          in human conceptuses.
        cell_types:
        - preferred_term: trophoblast cell
          term:
            id: CL:0000351
            label: trophoblast cell
        biological_processes:
        - preferred_term: placenta development
          modifier: ABNORMAL
          term:
            id: GO:0001890
            label: placenta development
      selected_evidence:
        snippet: Although no consistent anomalies were identified in affected male embryos themselves,
          the labyrinth layer of the fetal placenta was always thinner, with fewer fetal vessels and decreased
          proliferation of labyrinth trophoblast cells.
        supports: SUPPORT
