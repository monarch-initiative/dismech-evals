  b735dbbde0b99d4f2ae7fb67d0cc5671b6f898ba12b85cd91045c527560218e0:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: NSDHL molecular genetic testing
        description: 'The diagnosis is established in a female proband by identifying a heterozygous NSDHL
          pathogenic variant. This is the definitive test, and it is also what makes carrier identification
          and prenatal or preimplantation testing possible in the family. Sequence analysis alone is not
          a sufficient strategy, though: multi-exon deletions and microdeletions are described as not
          rare in CHILD syndrome and are invisible to classical Sanger sequencing, so gene-targeted deletion
          and duplication analysis belongs alongside it. A negative sequencing result therefore means
          "not detected by this assay" rather than "not CHILD syndrome". Reported cases include a deletion
          of NSDHL exons 3 and 4, and structural variants at Xq28 spanning exon-containing regions have
          been resolved by optical genome mapping in patients whose conventional genetic work-up was inconclusive.'
        diagnosis_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: Multiple exons deletions or microdeletion was not rare in CHILD syndrome. Classical Sanger
          sequencing may not be useful enough to find all kinds of mutations. Next-generation sequencing
          may be more effective.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29341259
      reference_title: CHILD syndrome mimicking verrucous nevus in a Chinese patient responded well to
        the topical therapy of compound of simvastatin and cholesterol.
      evidence_source: HUMAN_CLINICAL
      explanation: States the assay blind spot directly, and the same report supplies the worked example,
        a large deletion of NSDHL exons 3 and 4.
