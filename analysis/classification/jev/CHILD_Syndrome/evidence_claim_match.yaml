          An important negative is that this is a tissue rather than a plasma finding: serum sterol profiles
          in CHILD syndrome and in the mouse models are near-normal, with only minimal elevation of intermediates,
          because functional mosaicism and skewed X inactivation mean most of the body outside the lesions
