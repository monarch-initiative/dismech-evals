      assertion_type: DifferentialDiagnosis
      assertion:
        name: X-linked chondrodysplasia punctata 2 (Conradi-Hunermann-Happle syndrome)
        disease_term:
          preferred_term: X-linked chondrodysplasia punctata 2
          term:
            id: MONDO:0020603
            label: X-linked chondrodysplasia punctata 2
        description: 'The closest mechanistic neighbour and the most important differential. CDPX2 is
          caused by variants in EBP, a delta8-delta7 sterol isomerase acting downstream of NSDHL in the
          same post-squalene pathway, and it is likewise an X-linked dominant, male-lethal disorder with
          patterned ichthyotic skin and bone malformations. The relationship between the two entities
          is not fully settled: the NSDHL gene-discovery paper found EBP unaffected in its CHILD cohort
          and concluded they are not allelic, while a paper published alongside it identified an EBP nonsense
          variant in a patient carrying a clinical CHILD diagnosis.'
        distinguishing_features:
        - CDPX2 skin lesions and skeletal defects are bilateral and asymmetric, without the strict lateralization
          and midline demarcation of CHILD syndrome
        - CDPX2 is caused by EBP variants acting one step downstream of NSDHL in the same pathway
        - CDPX2 carries a plasma sterol signature of raised 8-dehydrocholesterol and 8(9)-cholestenol
          that NSDHL-related CHILD syndrome does not
      selected_evidence:
        snippet: EBP was unaffected in the patients analyzed by us demonstrating that CHILD syndrome and
          CDPX2 are not caused by allelic mutations.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
