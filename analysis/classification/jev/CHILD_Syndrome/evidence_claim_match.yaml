        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Hedgehog Signal Transduction
        biological_scale: MOLECULAR
        description: Cholesterol is required for Hedgehog signal transduction, so the distal biosynthetic
          block reaches developmental patterning as well as membrane lipid supply. The cleanest experimental
          demonstration is in cerebellar granule cell precursors from a conditional Nsdhl mouse, where
          the proliferation defect was shown to result from defective signalling by SHH and was rescued
          by exogenous cholesterol. The same dependency is invoked for the persistent failure of hair
          growth in treated CHILD skin, where the ichthyosis resolves but hair does not return.
        biological_processes:
        - preferred_term: smoothened signaling pathway
          modifier: DECREASED
          term:
            id: GO:0007224
            label: smoothened signaling pathway
        notes: This is a sterol-dependent Hedgehog defect and is deliberately NOT declared as conforming
          to the Hedgehog node of the ciliopathy_dysfunction module, whose chain runs from a basal body,
          transition zone, or intraflagellar transport lesion. CHILD syndrome has no primary ciliary assembly
          defect; the two routes converge on the same pathway from different upstream causes. Note also
          that the direct experimental evidence here is murine and comes from CNS tissue; the limb and
          hair consequences are inferences from the established cholesterol dependence of Hedgehog signalling
          rather than measurements made in CHILD syndrome tissue.
      selected_evidence:
        snippet: These data strongly implicate the hedgehog signaling pathway in the pathogenesis of the
          placental defects in NSDHL deficiency and provide evidence for a role for the hedgehog pathway
          in the development of a functional mammalian placenta.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17028112
      reference_title: Analysis of Nsdhl-deficient embryos reveals a role for Hedgehog signaling in early
        placental development.
      evidence_source: MODEL_ORGANISM
      explanation: Links the Hedgehog defect specifically to the placental arm of NSDHL deficiency.
