      assertion:
        name: Psoriasiform hyperkeratosis and acanthosis with loss of the granular layer
        description: 'Lesional skin shows marked hyperkeratosis and acanthosis with absence of the granular
          layer, together with foam cells in the dermis. This is the routine light-microscopic picture,
          and it reverses on effective pathogenesis-based therapy: after three months of topical cholesterol
          plus lovastatin the epidermis was largely normal with a prominent granular layer and orthokeratotic
          scale.'
