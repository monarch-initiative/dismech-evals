        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: nsdhl_versus_ebp_nosological_boundary
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#EBP
        prompt: Is "CHILD syndrome" one disease with two loci, or is the EBP-related case a CDPX2 variant
          that was clinically misassigned?
        rationale: 'Two papers published in the same journal issue in 2000 reach opposite-facing conclusions.
          One identified NSDHL variants in six CHILD patients and reported EBP unaffected in all of them,
          concluding the disorders are not allelic. The other measured plasma sterols in a CHILD patient,
          found the CDPX2 signature, identified an EBP nonsense variant, and speculated that at least
          some CHILD cases are allelic with CDPX2. Both observations can stand; what is unresolved is
          whether a CHILD phenotype arising from EBP should be curated as CHILD syndrome with locus heterogeneity
          or as an unusually lateralized CDPX2. This is a lump-versus-split decision affecting how the
          entity boundary is drawn, and it has not been settled by any subsequent cohort. The practical
          consequence is diagnostic: plasma sterol analysis separates the two routes even though it is
          uninformative within NSDHL-related disease.'
        proposed_experiments:
        - experiment_id: child_locus_reassessment_cohort
          name: Genotype and sterol reassessment of the assembled CHILD case literature
          description: Assemble the published CHILD syndrome cases with molecular data, and where material
            allows, determine NSDHL versus EBP genotype together with plasma sterol profile and lesion
            distribution, to establish whether EBP-related cases form a clinically separable subgroup
            or are distributed through the CHILD phenotype.
      selected_evidence:
        snippet: We speculate that at least some cases of CHILD syndrome are allelic with CDPX2 caused
          by 3beta-hydroxysteroid-delta8,delta7-isomerase deficiency.
        supports: SUPPORT
