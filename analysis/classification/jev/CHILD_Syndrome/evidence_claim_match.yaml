      assertion_type: Prevalence
      assertion:
        population: Worldwide, published case literature
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: No cohort, registry, or population study exists, so no rate can be given. The original
          1980 delineation assembled twenty observations in total, two new plus eighteen reviewed, and
          the published total has since grown into the low hundreds. The figure of one in 100,000 that
          circulates in review literature has no traceable denominator and is inconsistent with that case
          count, so it is deliberately not recorded here. The same series gives the female-to-male ratio
          as 19:1, which is a consequence of male lethality rather than an independent epidemiological
          finding.
      selected_evidence:
        snippet: 'Two further cases of this syndrome are reported, and a review of 18 previous observations
          is presented. The ratio of females to males is 19 : 1.'
        supports: SUPPORT
