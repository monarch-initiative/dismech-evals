  d43e413e96b2d1e28e7b227f69f77fb73ca6628c7b473205b3fd6eb4f79b70d4:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Sterol profiling of skin flakes and plasma
        description: 'Sterol analysis is the biochemical confirmatory test, and the tissue it is run on
          matters. In a reported case, analysis of skin flakes showed a mono 4-alpha methyl sterol also
          detectable in plasma, plus 4-alpha-carboxy-4-methyl-cholest-8(9)-en-3beta-ol and several keto-sterols
          normally below the limit of detection, a pattern consistent with a defective 4-alpha-methylsterol-4-demethylase
          complex. Its practical value is demonstrated by that same case: the pattern was what allowed
          an NSDHL variant of uncertain significance to be reclassified as likely pathogenic. Note the
          limits recorded in the biochemical section, though, since plasma sterols are frequently near-normal
          because functional mosaicism leaves most of the body expressing the wild-type allele.'
        diagnosis_term:
          preferred_term: Diagnostic Procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
      selected_evidence:
        snippet: Sterol analysis from skin flakes revealed increased levels of a mono 4-alpha methyl sterol
          also seen in plasma as well as the presence of 4-alpha-carboxy-4-methyl-cholest-8(9)-en-3beta-ol
          and several keto-sterols, which are usually below the limit of detection. This sterol pattern
          is consistent with abnormal function of the 4-alpha-methylsterol-4-demethylase complex.
        supports: SUPPORT
