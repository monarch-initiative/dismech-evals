        notes: Skin lesions tend to become less inflammatory over childhood. The mechanistic account for
          this is the progressive negative selection of mutant-expressing cells demonstrated in the heterozygous
          Bpa(1H) mouse, in which the mutant fraction in liver fell from roughly half at postnatal day
          6 to roughly a fifth by one year. The corresponding longitudinal measurement has not been made
          in human CHILD syndrome skin, so the human natural history is described clinically while the
          mechanism behind it is murine.
      selected_evidence:
        snippet: In the liver, the proportion of NSDHL negative cells dropped from approximately 50% at
          postnatal day 6 to approximately 20% at one year of age.
        supports: SUPPORT
