          and concluded they are not allelic, while a paper published alongside it identified an EBP nonsense
          variant in a patient carrying a clinical CHILD diagnosis.'
        distinguishing_features:
        - CDPX2 skin lesions and skeletal defects are bilateral and asymmetric, without the strict lateralization
          and midline demarcation of CHILD syndrome
        - CDPX2 is caused by EBP variants acting one step downstream of NSDHL in the same pathway
        - CDPX2 carries a plasma sterol signature of raised 8-dehydrocholesterol and 8(9)-cholestenol
          that NSDHL-related CHILD syndrome does not
      selected_evidence:
        snippet: although the skeletal defects and skin lesions in CDPX2 are bilateral and asymmetric
        supports: SUPPORT
