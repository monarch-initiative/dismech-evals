  c7466e1073ed2e5fa4b3fe112e3a803d27f997ab712de9debb503b3131cc636b:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        category: Cutaneous
        name: Strict midline demarcation of skin lesions
        description: 'The cutaneous lesions typically stop abruptly at the body midline, a lateralization
          far sharper than the Blaschko-line mosaicism seen in other X-linked genodermatoses, and it is
          the single most distinctive clinical sign of the syndrome. It is a strong tendency rather than
          a rule: an exceptional patient with a molecularly confirmed NSDHL variant had an almost symmetric
          bilateral CHILD nevus, and bilateral involvement should not be taken to exclude the diagnosis.'
        phenotype_term:
          preferred_term: strict midline demarcation of the cutaneous eruption
        notes: 'No ontology term is bound, deliberately. HPO has no term for strict midline demarcation
          of a cutaneous eruption. HP:0100555 (Asymmetric growth) was used here previously and has been
          removed: it describes asymmetry of body growth, not the distribution of a skin lesion, so it
          is a cross-category proxy rather than a merely broad parent, and no term is better than a misleading
          one. That term now sits on the separate `Ipsilateral body hypoplasia` phenotype, which it genuinely
          fits. HP:0025293 (Distributed along Blaschko lines) is explicitly not a substitute, since the
          whole point of this phenotype is that the demarcation is sharper than Blaschko mosaicism.'
      selected_evidence:
        snippet: an inflammatory nevus with striking lateralization and strict midline demarcation, as
          well as ipsilateral hypoplasia of the body
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/1
      evidence_path: /phenotypes/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10710235
      reference_title: Mutations in the NSDHL gene, encoding a 3beta-hydroxysteroid dehydrogenase, cause
        CHILD syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: States the midline demarcation of the nevus, which is the claim this phenotype makes.
