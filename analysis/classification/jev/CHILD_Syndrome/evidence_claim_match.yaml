            id: HP:0001423
            label: X-linked dominant inheritance
        description: CHILD syndrome is transmitted as an X-linked dominant trait. Hemizygous male conceptuses
          generally do not survive gestation, so the disorder is seen almost exclusively in heterozygous
          females. Because affected males abort or resorb, the expected live-born distribution from a
          heterozygous mother departs from the usual X-linked ratios, and recurrent male pregnancy loss
          is a family-history clue.
      selected_evidence:
        snippet: We report for the first time that CHILD syndrome (MIM 308050), an X-linked dominant,
          male-lethal trait characterized by an inflammatory nevus with striking lateralization and strict
          midline demarcation, as well as ipsilateral hypoplasia of the body is caused by mutations in
          the gene NSDHL located at Xq28
        supports: SUPPORT
