      reference_title: Placental defects are associated with male lethality in bare patches and striated
        embryos deficient in the NAD(P)H Steroid Dehydrogenase-like (NSDHL) Enzyme.
      evidence_source: MODEL_ORGANISM
      explanation: States the rodent-specific placental X-inactivation arrangement that the mouse inference
