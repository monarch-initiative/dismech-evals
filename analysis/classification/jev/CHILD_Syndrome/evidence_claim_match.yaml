            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Heterologous expression of NSDHL missense mutants
        experimental_model_type: CELL_LINE
        publication: PMID:40222685
        description: Thirteen disease-causing NSDHL missense mutations and one deletion mutation were
          expressed and assayed for protein level. All showed low expression; some were partially rescued
          by culture at 30°C rather than 37°C or by the chemical chaperone glycerol, and optimal expression
          required heat shock proteins 70 and 90. This reframes NSDHL missense disease as substantially
          a protein stability and folding problem, which is what makes chaperone-directed approaches conceivable.
        modeled_mechanisms:
        - target: NSDHL Loss of Function
          relationship: MEASURES
          fidelity: MODERATE
          description: Quantifies how disease alleles reduce NSDHL protein abundance and identifies a
            rescuable folding component.
          limitations: Heterologous overexpression in cultured cells does not report on endogenous expression
            in keratinocytes or on the mosaic tissue context, and a temperature or glycerol rescue in
            culture is not evidence that any clinically usable chaperone therapy exists.
          readouts:
          - name: NSDHL mutant protein expression level
            target: NSDHL Loss of Function
            direction: DECREASED
            interpretation: Low steady-state protein for every disease allele tested indicates loss of
              function operates substantially through protein instability.
      selected_evidence:
        snippet: We examined 13 missense mutations and one deletion mutation in the cholesterol synthesis
          enzyme NSDHL (NAD(P) Dependent Steroid Dehydrogenase-Like), known to cause the X-linked developmental
          disorders CHILD (congenital hemidysplasia with ichthyosiform erythroderma and limb defects)
          syndrome and CK syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
      context_paths:
