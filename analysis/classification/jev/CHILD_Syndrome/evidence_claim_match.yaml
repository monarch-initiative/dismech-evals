  d142741d723d04aab639c5e95064166955d507e3a8940770c961cec67ed1485b:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Conditional Nsdhl ablation in radial glia
        species: Mouse
        genotype: Nsdhl(tm1.1Hrm) conditional allele, GFAP-cre driver
        publication: PMID:25652406
        description: Because hemizygous Nsdhl mutant males die by midgestation, a conditional allele was
          needed to reach postnatal biology. Ablating Nsdhl in radial glia produced live-born males that
          developed ataxia by postnatal day 8 to 10, with loss of cortical and hippocampal neurons and
          defective proliferation and migration of cerebellar granule precursors followed by massive apoptosis.
          The proliferation defect was traced to defective SHH signalling and was almost completely rescued
          by exogenous cholesterol.
        genes:
        - preferred_term: NSDHL
          term:
            id: hgnc:13398
            label: NSDHL
        modeled_mechanisms:
        - target: Impaired Hedgehog Signal Transduction
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Establishes the causal chain from NSDHL loss to defective SHH signalling and shows
            that cholesterol supply is the limiting factor for it.
          limitations: The tissue is CNS rather than skin or limb, and the phenotype it produces is the
            CK syndrome-like neurological picture rather than the CHILD phenotype, so the Hedgehog result
            transfers as a mechanism while the phenotype does not. Conditional ablation in one lineage
            is also not equivalent to the mosaic heterozygous state of human CHILD syndrome.
          readouts:
          - name: Cerebellar granule cell precursor proliferation
            target: Impaired Hedgehog Signal Transduction
            direction: RESTORED
            interpretation: Rescue by exogenous cholesterol identifies cholesterol availability, rather
              than a separate consequence of the mutation, as the proximate cause of the Hedgehog signalling
              failure.
      selected_evidence:
        snippet: Since hemizygous male mice with Nsdhl mutations die by midgestation, we generated a conditional
          targeted Nsdhl mutation (Nsdhl(tm1.1Hrm)) to investigate the essential role of cholesterol in
          the early postnatal CNS.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25652406
      reference_title: Analysis of hedgehog signaling in cerebellar granule cell precursors in a conditional
        Nsdhl allele demonstrates an essential role for cholesterol in postnatal CNS development.
      evidence_source: MODEL_ORGANISM
      explanation: States why this conditional model exists and what it is a model of, which is the model-level
        claim.
