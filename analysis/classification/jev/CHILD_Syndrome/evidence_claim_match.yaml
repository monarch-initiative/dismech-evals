  ad968729dabfa3fd9770201cb228ec66472e0b382c971d9d237b2b833333e927:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Topical Cholesterol plus Statin (Pathogenesis-Based Therapy)
        description: 'Twice-daily topical application of a compounded lotion containing cholesterol together
          with an HMG-CoA reductase inhibitor (lovastatin or simvastatin) is the pathogenesis-directed
          treatment of the cutaneous disease. It addresses both arms of the biochemical lesion at once:
          cholesterol replaces the missing end product, and the statin shuts off flux into the pathway
          so the toxic methylsterol intermediates are not generated. The design is validated by the negative
          control within the same study, since topical cholesterol alone produced no improvement. Lesions
          clear over weeks to months, with histological and ultrastructural normalization, and the effect
          is maintained on reduced-frequency dosing. Hair growth and onychodystrophy do not recover. Note
          the evidence ceiling: every report is an uncontrolled case series of one or two patients, with
          the publication bias that implies, and there has been no trial. Systemic absorption and long-term
          safety of compounded topical statins applied to large body-surface areas in infants have not
          been studied.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: cholesterol
            term:
              id: CHEBI:16113
              label: cholesterol
          - preferred_term: lovastatin
            term:
              id: CHEBI:40303
              label: lovastatin
          - preferred_term: simvastatin
            term:
              id: CHEBI:9150
              label: simvastatin
      selected_evidence:
        snippet: Topical treatment with lovastatin/cholesterol (but not cholesterol alone) virtually cleared
          skin lesions by 3 months, accompanied by histological and ultrastructural normalization of epidermal
          structure and lipid secretion.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
