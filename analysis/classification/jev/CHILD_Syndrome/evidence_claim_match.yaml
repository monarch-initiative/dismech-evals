      assertion_type: Discussion
      assertion:
        discussion_id: lateralization_mechanism_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
        prompt: What mechanism converts random X inactivation into a body-half boundary in CHILD syndrome,
          rather than the finer Blaschko-line mosaicism seen in other X-linked genodermatoses?
        rationale: 'The observation that lesional keratinocytes express only the mutant allele and contralateral
          keratinocytes only the wild-type allele explains why affected skin is affected, but it does
          not explain the geometry. Negative selection of mutant-expressing cells accounts for their depletion,
          not for its confinement to one side of the midline. The authors who established the clearance
          model describe the lateralization as poorly understood, and no available animal system reproduces
          it: both mouse models pattern as patches or stripes, and the canine model follows Blaschko lines.
          This disease would be an unusually good subject for single-cell or spatial methods, which have
          not been applied to it, because the mosaic boundary is sharp and the selecting phenotype is
          cell-autonomous.'
        proposed_experiments:
        - experiment_id: lateralization_lineage_mapping
          name: Lineage and allele-expression mapping across the midline in CHILD skin
          description: Single-cell or spatial transcriptomic mapping of NSDHL allele expression across
            the midline boundary in affected individuals, paired with clonal lineage inference, to determine
            whether the boundary reflects an early embryonic left-right lineage restriction, a later selective
            clearance front, or an unrecognized signalling boundary.
      selected_evidence:
        snippet: We also evaluated the basis for the poorly understood, unique lateralization of the cutaneous
          and bone malformations of CHILD syndrome by analyzing gene activation in abnormal and unaffected
          skin.
        supports: SUPPORT
