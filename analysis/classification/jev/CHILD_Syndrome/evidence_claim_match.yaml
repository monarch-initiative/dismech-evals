  28880fdf52607caeb1bd328003ef6ea271e6f15f57fe220043a16f4efdd1a1ca:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: X-Inactivation Mosaicism and Negative Selection of Mutant-Expressing Cells
        biological_scale: CELLULAR
        description: 'Because NSDHL is X-linked, a heterozygous female is a functional mosaic of cells
          expressing either allele. Lesional and contralateral clinically normal skin carry equal amounts
          of mutant and wild-type DNA, but differ completely in what they express: cultured keratinocytes
          from lesional skin expressed only the mutant allele, and keratinocytes from the unaffected side
          expressed only the wild-type allele. Fibroblasts showed the same asymmetry less completely.
          Skewed X inactivation in peripheral blood is consistent with overall depletion of mutant-expressing
          cells. The mouse work adds the temporal dimension that makes this a process rather than a snapshot:
          NSDHL-negative cells survive and differentiate during embryogenesis but are progressively outcompeted
          afterwards, with the mutant fraction in liver falling from about half at postnatal day 6 to
          about a fifth by one year. That selection is the likely reason skin lesions tend to improve
          with age, and why the disease is fundamentally a developmental one, doing its damage in the
          window while mutant clones are still abundant. The model also predicts the clinical observation
          that a full-thickness graft taken from the unaffected side stays normal after transfer to the
          affected side. What it does not explain is why the boundary is a sharp body midline rather than
          the finer Blaschko striping typical of X-linked mosaic skin disease.'
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: random X inactivation
          term:
            id: GO:0060816
            label: random inactivation of X chromosome
      selected_evidence:
        snippet: The unusual lateralization of abnormalities in CHILD syndrome reflects selective clearance
          of keratinocytes and fibroblasts that express the mutant allele from the unaffected side.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21753784
      reference_title: Pathogenesis-based therapy reverses cutaneous abnormalities in an inherited disorder
        of distal cholesterol metabolism.
      evidence_source: HUMAN_CLINICAL
      explanation: States the cell-level result that clinically normal skin is normal because the mutant-expressing
        cells are gone from it.
