  447ab766929d6cabf946a7cbf38eef3c2ea876fe6ab4d355b7c5406057fca63a:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        category: Cutaneous
        name: Ichthyosiform nevus
        description: Unilateral inflammatory, erythematous plaques topped by waxy yellow scale, present
          at birth or in the first weeks of life. New lesions can appear later in life. More limited lesions
          may follow one or more lines of Blaschko.
        phenotype_term:
          preferred_term: Ichthyosiform nevus
          term:
            id: HP:0010816
            label: Epidermal nevus
        notes: Bound to HP:0010816 (Epidermal nevus) rather than HP:0008064 (Ichthyosis). The lesion is
          genuinely ichthyosiform, but it is a localized, mosaic, unilateral nevus, not a generalized
          disorder of cornification, and the nevoid character is what discriminates it; the classic delineation
          places the CHILD nevus among the epidermal nevus syndromes. HP:0034275 (Verrucous epidermal
          nevus) was considered and not used, since the verrucous quality is reported in some lesions
          rather than being a general property of the CHILD nevus. The ichthyosiform quality is carried
          by the preferred_term. Separately, no frequency band is asserted. The lesion is effectively
          definitional, and grading a defining feature as VERY_FREQUENT on the strength of the phrase
          "is characterized by" would be circular rather than evidenced. There is no published CHILD syndrome
          cohort with a denominator from which a real band could be derived.
      selected_evidence:
        snippet: CHILD syndrome is characterized by unilateral distribution of ichthyosiform skin lesions
          and ipsilateral limb defects that range from shortening of the metacarpals and phalanges to
          absence of the entire limb.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/0
      evidence_path: /phenotypes/0/evidence/0
