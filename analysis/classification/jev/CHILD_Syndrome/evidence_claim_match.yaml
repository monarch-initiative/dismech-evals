          modifier: DECREASED
          term:
            id: CHEBI:16113
            label: cholesterol
      selected_evidence:
        snippet: CHILD syndrome results from loss of function mutations in the NSDHL gene, which leads
          to inhibition of cholesterol synthesis and accumulation of toxic metabolic intermediates in
          affected tissues.
        supports: SUPPORT
