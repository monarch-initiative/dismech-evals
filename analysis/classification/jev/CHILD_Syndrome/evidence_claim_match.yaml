      assertion_type: Discussion
      assertion:
        discussion_id: male_lethality_placental_mechanism_human
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Placental Labyrinth Failure and Male Lethality
        prompt: Does the placental labyrinth mechanism established for male lethality in Nsdhl mutant
          mice hold for human male conceptuses with NSDHL loss of function?
        rationale: 'The placental account of male lethality rests entirely on mouse work, in which affected
          male embryos die in midgestation with a thin, poorly vascularized labyrinth while showing no
          consistent embryonic anomaly. Extrapolating to humans is not straightforward: X inactivation
          in most rodent placental lineages is imprinted with preferential paternal inactivation, which
          is not the human arrangement, and the reasoning that heterozygous females should phenocopy affected
          males in extraembryonic tissue depends on that difference. Human material is not wholly unavailable:
          a maternally inherited NSDHL variant has been identified by exome sequencing in a male conceptus
          lost at ten weeks, confirming that the lethality is real and NSDHL-linked in humans. What that
          report does not supply is any placental histology or Hedgehog readout, so it establishes the
          outcome while leaving the murine mechanism for it untested in humans.'
        proposed_experiments:
        - experiment_id: human_nsdhl_trophoblast_model
          name: NSDHL-null human trophoblast organoid vascularization assay
          description: Generate NSDHL loss-of-function human trophoblast stem cell or placental organoid
            models and assay Hedgehog pathway activity, trophoblast proliferation, and vascular network
            formation, to test whether the murine labyrinth phenotype has a human counterpart independent
            of rodent-specific placental X inactivation.
      selected_evidence:
        snippet: X-inactivation is non-random in females in most lineages of the rodent placenta with
          preferential inactivation of the paternal X chromosome.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
