        name: NSDHL
        gene_term:
          preferred_term: NSDHL
          term:
            id: hgnc:13398
            label: NSDHL
        relationship_type: CAUSATIVE
        notes: 'Loss-of-function variants in NSDHL, encoding NAD(P)H steroid dehydrogenase-like protein,
          cause CHILD syndrome. The gene maps to Xq28. The encoded enzyme is a 3-beta-hydroxysteroid dehydrogenase
          and C4-decarboxylase that removes C-4 methyl groups in the post-squalene segment of cholesterol
          biosynthesis. Reported alleles include missense changes such as p.Gly83Asp and premature termination
          changes such as p.Ser106X. CHILD syndrome and CK syndrome are allelic: CK syndrome arises from
          hypomorphic alleles retaining partial enzyme function and affects males.'
      selected_evidence:
        snippet: SSCA and genomic sequence analysis of NSDHL identified in 6 patients with CHILD syndrome,
          including one boy as well as a mother and her daughter, mutations potentially impairing protein
          function.
        supports: SUPPORT
