      assertion_type: Pathophysiology
      assertion:
        name: Impaired Epidermal Lamellar Body Secretion and Barrier Formation
        biological_scale: TISSUE
        description: In lesional epidermis the lipid secretory apparatus is structurally disorganized.
          Lamellar bodies contain few internal lamellae, fuse prematurely into multivesicular bodies,
          and are incompletely secreted, so organelle contents remain entombed within corneocytes and
          the stratum corneum extracellular space is left with sparse lamellar material interspersed with
          non-lamellar vesicles. Histologically this appears as marked hyperkeratosis and acanthosis with
          loss of the granular layer and dermal foam cells. The severity of this secretory disruption
          exceeds what topical statin-induced cholesterol deficiency alone produces in normal skin, which
          is the ultrastructural argument that toxic intermediates and not simply cholesterol depletion
          drive the ichthyosiform phenotype.
        cell_types:
        - preferred_term: keratinocyte
          term:
            id: CL:0000312
            label: keratinocyte
        biological_processes:
        - preferred_term: establishment of skin barrier
          modifier: DECREASED
          term:
            id: GO:0061436
            label: establishment of skin barrier
        - preferred_term: keratinocyte differentiation
          modifier: ABNORMAL
          term:
            id: GO:0030216
            label: keratinocyte differentiation
      selected_evidence:
        snippet: Ultrastructural analysis of affected skin showed evidence of both cholesterol depletion
          and toxic metabolic accumulation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
