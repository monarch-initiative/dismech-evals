        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Abnormal lamellar granules on electron microscopy
        description: Ultrastructurally the lesion is a lipid secretory failure. Vesicular structures appear
          in the intercellular spaces of the stratum corneum and vacuoles in the upper prickle cell layer,
          some recognizable as abnormal lamellar granules, with large vacuoles inside the foamy cells
          of the papillary dermis. This is the electron-microscopic counterpart of the lamellar body secretory
          defect modelled in the pathophysiology, observed in a separate patient and laboratory from the
          treatment study.
        finding_term:
          preferred_term: abnormal epidermal lamellar granules
        notes: No ontology term is bound. There is no NCIT ultrastructural-finding term for abnormal epidermal
          lamellar granules, and the available broader terms would lose the organelle-level specificity
          that is the entire content of the finding.
      selected_evidence:
        snippet: These findings suggested that abnormal lipid metabolism involving lamellar granules may
          be responsible to the skin lesion of CHILD syndrome.
        supports: SUPPORT
    origin:
