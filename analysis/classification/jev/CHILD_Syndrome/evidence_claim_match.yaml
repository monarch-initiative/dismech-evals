  f6123a239b298b045383aeb014c656a5861dfc6f890ab3ef7a0b30af11e31f98:
    claim:
      about:
        disease:
          name: CHILD Syndrome
          disease_term:
            preferred_term: CHILD syndrome
            term:
              id: MONDO:0010621
              label: CHILD syndrome
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Verruciform xanthoma-like change in the CHILD nevus
        description: 'The CHILD nevus is not histologically generic. Alongside the psoriasiform changes
          it shows the microscopic features of verruciform xanthoma, which together with the diffuse lateralization
          and ptychotropism (a predilection for body folds) is what distinguishes it from the other epidermal
          nevus syndromes. This is a lesion that can grow, not only a microscopic descriptor: one of the
          two patients in the topical therapy report developed a frank verruciform xanthoma of the vulva
          and inner thigh that required debulking.'
        diagnostic: true
        finding_term:
          preferred_term: verruciform xanthoma-like change
        notes: No ontology term is bound. HP:0000991 (Xanthomatosis) is not a member of the HistopathologyFindingTerm
          enum, and the nearest NCIT candidate, NCIT:C221710 Cutaneous Xanthomatous Alteration, is not
          reachable from NCIT:C83490 (Histopathology Result) either. Binding instead to the generic hyperkeratosis
          or acanthosis terms would attach the label to the least distinctive part of the finding, so
          the free-text preferred_term carries it.
      selected_evidence:
        snippet: The associated CHILD nevus shows unique features such as a diffuse form of lateralization,
          ptychotropism, and microscopic changes of verruciform xanthoma.
        supports: SUPPORT
    origin:
      assertion_path: /histopathology/1
      evidence_path: /histopathology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7640190
      reference_title: Epidermal nevus syndromes.
      evidence_source: HUMAN_CLINICAL
      explanation: Names the histological triad that identifies the CHILD nevus among the epidermal nevus
        syndromes, which is what makes this finding diagnostic.
