  899dbfb6070fd0ff5523f0ff5a8a0e3d0f9af5e7162395fb2093b970f582ef16:
    claim:
      about:
        disease:
          name: CHIME_syndrome
          disease_term:
            preferred_term: CHIME syndrome
            term:
              id: MONDO:0010221
              label: CHIME syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PIGL
        gene_term:
          preferred_term: PIGL
          term:
            id: hgnc:8966
            label: PIGL
        association: Causal
        notes: Autosomal recessive mutations in PIGL gene cause CHIME syndrome. Most cases show compound
          heterozygous mutations with c.500T>C (p.Leu167Pro) being frequently observed. Mutations include
          point mutations, insertions, deletions, and Alu-mediated intragenic deletions.
      selected_evidence:
        snippet: In CHIME syndrome, a recurrent missense mutation c.500T > C (p.Leu167Pro) is found in
          the majority of patients, associated with a null mutation in the other allele, including an
          overrepresentation of large deletions. The latter are not detected by the standard analysis
          in sequencing techniques, including next-generation sequencing. Thus, in individuals with a
          clinical diagnosis of CHIME syndrome in which only one mutation is found, an active search for
          a large deletion should be sought.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29473937
      reference_title: 'Large deletion in PIGL: a common mutational mechanism in CHIME syndrome?'
      explanation: Ceroni et al. 2018 establishes that large deletions are a common mutational mechanism
        in CHIME syndrome, often missed by standard sequencing, and recommends active screening for deletions
        in diagnostic workup.
