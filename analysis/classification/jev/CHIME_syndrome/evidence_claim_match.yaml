            term:
              id: MONDO:0010221
              label: CHIME syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PIGL Gene Mutations
        description: Mutations in PIGL gene disrupt glycosylphosphatidylinositol (GPI) anchor biosynthesis.
          PIGL encodes a de-N-acetylase required for GPI anchor formation, essential for anchoring various
          cell surface proteins including receptors, enzymes, and adhesion molecules.
        biological_processes:
        - preferred_term: glycosylphosphatidylinositol biosynthetic process
          term:
            id: GO:0006506
            label: GPI anchor biosynthetic process
      selected_evidence:
        snippet: CHIME syndrome is characterized by colobomas, heart defects, ichthyosiform dermatosis,
          mental retardation (intellectual disability), and ear anomalies, including conductive hearing
          loss. Whole-exome sequencing on five previously reported cases identified PIGL, the de-N-acetylase
          required for glycosylphosphatidylinositol (GPI) anchor formation, as a strong candidate.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
