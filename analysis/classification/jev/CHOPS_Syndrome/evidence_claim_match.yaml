              label: cognitive impairment - coarse facies - heart defects - obesity - pulmonary involvement
                - short stature - skeletal dysplasia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Attenuation of Enhancer Complexes and Enhancer-Promoter Looping
        biological_scale: MOLECULAR
        description: Chromosome-architecture analysis of CHOPS and CdLS patient cell lines found cohesin,
          the cohesin loader NIPBL, BRD4 and H3K27ac all reduced at most enhancers, with attenuation of
          enhancer-promoter loops, while topologically associating domains were preserved. The lesion
          is therefore at the level of enhancer complex maintenance and looping, not at the level of large-scale
          genome compartmentalisation - and it is shared with CdLS, which is the structural basis of the
          two disorders' phenotypic overlap.
        biological_processes:
        - preferred_term: chromatin looping
          term:
            id: GO:0140588
            label: chromatin looping
          modifier: DECREASED
        cellular_components:
        - preferred_term: cohesin complex
          term:
            id: GO:0008278
            label: cohesin complex
        cell_types:
        - preferred_term: patient-derived skin fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
      selected_evidence:
        snippet: In both patient cells, we found a decrease in cohesin, NIPBL, BRD4, and acetylation of
          lysine 27 on histone H3
        supports: SUPPORT
    origin:
