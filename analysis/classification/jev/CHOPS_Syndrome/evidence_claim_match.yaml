      assertion:
        name: Loss of SIAH1-Mediated Degradation of AFF4
        biological_scale: MOLECULAR
        description: Wild-type AFF4 is cleared by the SIAH1 ubiquitin E3 ligase through the proteasome.
          Co-expression experiments in HEK293T cells show that each CHOPS allele resists SIAH1-driven
          degradation, and proteasome inhibition with MG132 restores wild-type AFF4 levels - confirming
          the route being escaped is proteasomal. The same escape was demonstrated independently for the
          later alleles p.Ala255Thr and p.Pro253Arg. This is a protein-turnover defect, distinct from
          the abundance change it produces.
        molecular_functions:
        - preferred_term: SIAH1 ubiquitin ligase binding
          term:
            id: GO:0031625
            label: ubiquitin protein ligase binding
          modifier: DECREASED
        biological_processes:
