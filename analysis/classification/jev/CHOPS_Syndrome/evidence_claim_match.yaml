    claim:
      about:
        disease:
          name: CHOPS Syndrome
          disease_term:
            preferred_term: CHOPS syndrome
            term:
              id: MONDO:0014609
              label: cognitive impairment - coarse facies - heart defects - obesity - pulmonary involvement
                - short stature - skeletal dysplasia syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_shared_vs_specific_arm_partition
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which of the CHOPS phenotypes are driven by enhancer-complex loss shared with CdLS, and
          which by the CHOPS-specific elongation gain of function?
        attaches_to:
        - pathophysiology#Attenuation of Enhancer Complexes and Enhancer-Promoter Looping
        rationale: CHOPS and CdLS patient cells converge on the same enhancer and looping defect, which
          plausibly accounts for the shared features - synophrys, arched eyebrows, long eyelashes, developmental
          delay, heart defects, hearing loss. But obesity, pulmonary involvement and skeletal dysplasia
          are CHOPS-specific and would have to arise from something the shared mechanism does not explain,
          presumably the elongation-side gain of function. No study has yet partitioned the phenotype
          between the two arms, so the pathograph runs both into a single convergence node rather than
          assigning phenotypes to one arm or the other.
        proposed_experiments:
        - experiment_id: exp_isogenic_lineage_enhancer_comparison
          name: Allele-resolved comparison of CHOPS and CdLS transcriptomes by lineage
          description: Differentiate isogenic CHOPS-allele and NIPBL-haploinsufficient iPSC lines into
            lung, cartilage and hypothalamic lineages and compare enhancer occupancy and transcription,
            to identify which programmes diverge between the two disorders and therefore which phenotypes
            belong to the CHOPS-specific arm.
      selected_evidence:
        snippet: These findings reveal a shared molecular mechanism in these syndromes and highlight unexpected
          roles for cohesin, cohesin loaders, and the SEC in maintaining the enhancer complexes.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
