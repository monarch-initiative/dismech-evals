  04f3485023abeca06e3325357ef3b32a5651829c295e39f77216154961a0d0d2:
    claim:
      about:
        disease:
          name: CHOPS Syndrome
          disease_term:
            preferred_term: CHOPS syndrome
            term:
              id: MONDO:0014609
              label: cognitive impairment - coarse facies - heart defects - obesity - pulmonary involvement
                - short stature - skeletal dysplasia syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        category: Cardiovascular
        name: Pulmonary Hypertension
        description: 'Reported in two of the eleven individuals of the cohort, and clinically important
          because it compounds the chronic lung disease. The source reports "pulmonary hypertension" with
          no hemodynamic classification, so the phenotype is named and bound at that granularity. HP:0002092
          Pulmonary arterial hypertension was rejected: despite its "Primary pulmonary hypertension" synonym
          it is not HPO''s general term but a grandchild of HP:0004890 via HP:0033578 Pre-capillary pulmonary
          hypertension, and its operative definition requires a pulmonary capillary wedge pressure of
          15 mmHg or less - the pre-capillary criterion, which is exactly what no source measured here,
          and which would rule out the post-capillary contribution the left-to-right shunt lesions in
          this cohort make plausible. HP:0004890 Elevated pulmonary artery pressure is the common ancestor
          of the pre- and post-capillary branches and matches the unclassified finding.'
        frequency: OCCASIONAL
        phenotype_term:
          preferred_term: Pulmonary hypertension
          term:
            id: HP:0004890
            label: Elevated pulmonary artery pressure
      selected_evidence:
        snippet: Pulmonary hypertension was found in Case-1 and Case-6, and a dilated aortic root was
          noted in Case-6 and Case-7.
        supports: SUPPORT
