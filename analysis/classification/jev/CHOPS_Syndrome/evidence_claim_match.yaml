        name: Clinical Differentiation from Cornelia de Lange Syndrome
        description: CHOPS syndrome is most often mistaken for CdLS. The discriminating features are obesity
          (CdLS is growth-restricted in weight as well as height), pulmonary involvement, skeletal findings,
          and the coarse full round face that emerges with age - as against the shared synophrys, arched
          eyebrows, long eyelashes and upturned nose seen in both.
        presence: Discriminating clinical assessment
      selected_evidence:
        snippet: Pulmonary issues are not typically observed in CdLS and the pulmonary involvement for
          children with CHOPS syndrome can be significant with chronic lung disease present in the majority
          of patients
        supports: SUPPORT
