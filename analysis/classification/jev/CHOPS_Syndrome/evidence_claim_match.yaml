        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_appetite_mechanism_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does a transcriptional-elongation defect produce hyperphagia and impaired satiety?
        attaches_to:
        - pathophysiology#Food-Seeking Behaviour and Impaired Satiety
        rationale: 'The obesity of CHOPS syndrome is behaviourally driven: satiety items score highest
          on a Prader-Willi-derived questionnaire, and families lock food away. But no hypothalamic, leptin-melanocortin,
          or other appetite-pathway link to AFF4 has been demonstrated, and the phenotypic resemblance
          to Prader-Willi syndrome is not evidence of a shared mechanism. The causal edge into this node
          is therefore curated as INDIRECT and the node makes no anatomical claim.'
        proposed_experiments:
        - experiment_id: exp_hypothalamic_appetite_circuit_knockin
          name: Hypothalamic appetite-circuit assessment in a CHOPS knock-in model
          description: Measure food intake, satiety responses, and AFF4-dependent transcription in hypothalamic
            arcuate neurons of a mouse carrying a CHOPS AFF4 allele, to test whether the appetite phenotype
            has a central origin at all.
      selected_evidence:
        snippet: The group of questions pertaining to impairment of satiety category had the highest average
          scores ranging from 3 to 4.5.
        supports: SUPPORT
