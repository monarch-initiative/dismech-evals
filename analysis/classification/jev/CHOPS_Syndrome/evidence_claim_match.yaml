  8a4072d754187bf2ec1ed39f0a7a963d05247efa921bfe6f9cb85974b68941a8:
    claim:
      about:
        disease:
          name: CHOPS Syndrome
          disease_term:
            preferred_term: CHOPS syndrome
            term:
              id: MONDO:0014609
              label: cognitive impairment - coarse facies - heart defects - obesity - pulmonary involvement
                - short stature - skeletal dysplasia syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        category: Cardiovascular
        name: Dilated Aortic Root
        description: 'Aortic root dilatation in two of the eleven individuals of the cohort, in the same
          sentence that records the pulmonary hypertension. Bound to HP:0002616, whose label is "Aortic
          root aneurysm" but whose definition is "An abnormal localized widening (dilatation) of the aortic
          root". HPO is internally inconsistent on this term: the definition is about dilatation, but
          "Aortic root dilatation" is carried as a *broad* synonym, i.e. HPO is asserting that the source''s
          wording names a wider concept than the term does, so the aneurysm label makes a stronger claim
          than the source supports. HPO has no aortic-root dilatation term at any level - HP:0002616 is
          its only aortic-root term - and the KB binds aortic root dilatation to it throughout (Shprintzen-Goldberg,
          Larsen-like B3GAT3, hypermobile EDS, ALG3-CDG), so it is kept here for consistency with the
          definition and with the rest of the corpus, with the mismatch recorded rather than papered over;
          the previous binding to the broad parent Abnormal aortic morphology dropped the site entirely.
          No causal edge is drawn from the malformation node: unlike the septal defects and the patent
          ductus, aortic root dilatation is a progressive connective-tissue process rather than a congenital
          lesion, and no source offers a mechanistic account of it in CHOPS syndrome.'
        frequency: OCCASIONAL
        phenotype_term:
          preferred_term: Dilated aortic root
          term:
            id: HP:0002616
            label: Aortic root aneurysm
      selected_evidence:
        snippet: Pulmonary hypertension was found in Case-1 and Case-6, and a dilated aortic root was
          noted in Case-6 and Case-7.
        supports: SUPPORT
