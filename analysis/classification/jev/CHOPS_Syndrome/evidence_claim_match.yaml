        context: []
      assertion_type: Genetic
      assertion:
        name: AFF4
        association: De novo heterozygous missense variants in the ALF homology domain
        presence: Positive
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        notes: AFF4 (chromosome 5q31.1) encodes the scaffold subunit of the super elongation complex.
          Every CHOPS allele is a missense change within a highly conserved 14-amino-acid stretch of the
          ALF homology domain (approximately residues 251-263), which carries the SIAH1 degron. p.Arg258Trp
          is recurrent and accounted for 55% of cases in the largest published series; p.Pro253Arg, p.Pro253Leu,
          p.Thr254Ala, p.Thr254Ser, p.Ala255Thr, p.Ala255Val, p.Met260Thr and p.Met260Val are also reported.
          The mechanism is gain of function through escape from proteasomal degradation, not haploinsufficiency
          - no truncating allele has been implicated, and the restriction of pathogenic variation to this
          one small domain is what makes targeted AFF4 sequencing a viable diagnostic route.
        gene_term:
          preferred_term: AFF4
          term:
            id: hgnc:17869
            label: AFF4
      selected_evidence:
        snippet: The p. R258W mutation represents the most common recurrent mutation, and this mutation
          accounted for 55% of CHOPS syndrome cases.
        supports: SUPPORT
    origin:
