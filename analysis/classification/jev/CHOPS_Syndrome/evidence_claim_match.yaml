      - /disease_term
    evidence_metadata:
      reference: PMID:25730767
      reference_title: Germline gain-of-function mutations in AFF4 cause a developmental syndrome functionally
        linking the super elongation complex and cohesin.
      evidence_source: HUMAN_CLINICAL
      explanation: Localises the lesion to the ALF homology domain and notes the conservation of the affected
