        discussion_id: gap_vasculopathy_association_unconfirmed
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is systemic vasculopathy, including moyamoya, part of the CHOPS syndrome phenotype?
        attaches_to:
        - phenotypes#Moyamoya Phenomenon and Systemic Vasculopathy
        rationale: 'One individual with a p.Pro253Leu AFF4 variant developed moyamoya disease and diffuse
          narrowing of the renal arteries and infrarenal aorta. The observation is confounded: the same
          individual carried the RNF213 p.Arg4810Lys moyamoya susceptibility allele inherited from an
          unaffected mother. With n=1 and a competing explanation in the same genome, this cannot be curated
          as a CHOPS feature; the report''s own authors ask for more observation. The phenotype is therefore
          recorded with the confounder carried as its own REFUTE item and the authors'' hedge as NO_EVIDENCE,
          so that a second case would be recognised as confirmatory rather than novel.'
        proposed_experiments:
        - experiment_id: exp_cohort_vascular_imaging_rnf213
          name: Systematic vascular imaging in a CHOPS syndrome cohort
          description: Cerebral and abdominal vascular imaging across an unselected CHOPS syndrome cohort,
            with RNF213 genotyping, to establish whether vasculopathy occurs above background in AFF4
            variant carriers independently of known susceptibility alleles.
      selected_evidence:
        snippet: More clinical observations and functional studies are required to clarify this association.
        supports: NO_EVIDENCE
