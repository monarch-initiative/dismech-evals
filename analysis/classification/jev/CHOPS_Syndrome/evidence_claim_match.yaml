          disease_term:
            preferred_term: CHOPS syndrome
            term:
              id: MONDO:0014609
              label: cognitive impairment - coarse facies - heart defects - obesity - pulmonary involvement
                - short stature - skeletal dysplasia syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_pulmonary_mechanism_unknown
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does AFF4 gain of function produce chronic lung disease?
        attaches_to:
        - pathophysiology#Multisystem Developmental Malformation and Growth Dysregulation
        - phenotypes#Chronic Lung Disease
        - phenotypes#Pneumonia
        - phenotypes#Pulmonary Alveolar Haemorrhage
        - phenotypes#Pulmonary Hypertension
        - phenotypes#Sleep Apnea
        rationale: Pulmonary involvement is one of the two features that most reliably separate CHOPS
          syndrome from CdLS, and it carries much of the morbidity - a third of the largest cohort required
          tracheostomy. Yet the largest clinical series states plainly that the aetiology of the chronic
          lung disease is undetermined, and it is not attributed to the cardiac lesions, prematurity,
          or aspiration. Nothing in the published transcriptomic work identifies a lung-specific programme
          downstream of excess AFF4. The structural airway anomalies (laryngomalacia, subglottic stenosis)
          are wired into the pathograph as congenital malformations, but the parenchymal and functional
          pulmonary phenotypes named above are deliberately left without a causal edge rather than inventing
          a pulmonary mechanism.
        proposed_experiments:
        - experiment_id: exp_lung_lineage_aff4_transcriptomics
          name: Airway and alveolar transcriptomics in AFF4 gain-of-function models
          description: Profile AFF4 occupancy and transcription in lung epithelial and mesenchymal lineages
            carrying a knock-in CHOPS allele (for example p.Arg258Trp), to test whether excess chromatin-bound
            AFF4 dysregulates a lung developmental or airway-remodelling programme rather than acting
            through a systemic route.
      selected_evidence:
        snippet: Pulmonary issues most commonly manifested as chronic lung disease, of as yet undetermined
          etiology
        supports: SUPPORT
