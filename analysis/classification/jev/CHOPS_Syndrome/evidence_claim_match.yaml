          protein produces gain of function via escape from SIAH1-mediated degradation.
        limitations: The mutated gene is Aff1, not Aff4, and the phenotype is ataxia - not the craniofacial,
          cardiac, pulmonary, skeletal or obesity features of CHOPS syndrome. No mouse carrying a CHOPS
          Aff4 allele has been reported, so there is currently no animal model of the disorder itself;
          this model supports only the degradation-escape step.
