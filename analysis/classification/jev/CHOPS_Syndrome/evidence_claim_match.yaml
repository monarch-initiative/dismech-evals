            term:
              id: MONDO:0014609
              label: cognitive impairment - coarse facies - heart defects - obesity - pulmonary involvement
                - short stature - skeletal dysplasia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: De Novo AFF4 ALF-Homology-Domain Missense Variant
        biological_scale: MOLECULAR
        description: 'A single heterozygous de novo missense variant in AFF4 (chromosome 5q31.1). The
          reported alleles cluster in a 14-amino-acid stretch (residues ~251-263) of the ALF (AF4/LAF4/FMR2)
          homology domain: p.Pro253Arg, p.Pro253Leu, p.Thr254Ala, p.Thr254Ser, p.Ala255Thr, p.Ala255Val,
          p.Arg258Trp, p.Met260Thr and p.Met260Val. p.Arg258Trp is the recurrent allele. This node records
          the genomic lesion only; no truncating or whole-gene-deletion allele has been implicated, which
          is itself an argument against haploinsufficiency.'
        genes:
        - preferred_term: AFF4
          term:
            id: hgnc:17869
            label: AFF4
        genetic_context:
          gene:
            preferred_term: AFF4
            term:
              id: hgnc:17869
              label: AFF4
          allele_type: missense
          variant_origin: DE_NOVO
          allelic_events:
          - MISSENSE_VARIANT
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: A single de novo heterozygous missense allele in the AFF4 ALF homology domain.
            The consequence is gain of function - escape from SIAH1-mediated degradation - not haploinsufficiency;
            no truncating allele has been implicated.
      selected_evidence:
        snippet: All 3 missense mutations were located within the ALF (AF4/LAF4/FMR2) homology domain
          of AFF4, and these missense mutations altered highly evolutionarily conserved amino acids
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
