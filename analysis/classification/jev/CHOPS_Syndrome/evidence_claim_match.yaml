            label: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: the AFF4 constructs containing the missense mutations found in the three CHOPS syndrome
          probands hindered the degradation of AFF4 with SIAH1 overexpression
        supports: SUPPORT
