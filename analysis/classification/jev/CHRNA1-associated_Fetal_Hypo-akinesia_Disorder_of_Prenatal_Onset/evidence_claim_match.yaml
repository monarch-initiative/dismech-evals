      assertion_type: Diagnosis
      assertion:
        name: Prenatal Ultrasound Evaluation
        description: Prenatal ultrasound is the initial diagnostic modality for detecting CHRNA1-associated
          fetal hypo-akinesia disorder. Characteristic findings include increased nuchal translucency,
          fetal edema, cystic hygroma, reduced fetal movement, and joint contractures. The same constellation
          of ultrasound anomalies may recur across successive pregnancies in carrier families.
      selected_evidence:
        snippet: We herein report a Chinese case with a history of three adverse pregnancies demonstrating
          the same ultrasonic phenotypes, including increased nuchal translucency, edema, fetal neck cystoma,
          reduced movement, joint contractures, and other congenital features.
        supports: SUPPORT
