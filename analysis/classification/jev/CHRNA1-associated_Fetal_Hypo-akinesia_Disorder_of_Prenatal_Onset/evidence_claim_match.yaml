              id: MONDO:0009668
              label: lethal multiple pterygium syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Fetal acetylcholine receptor alpha-1 deficiency
        description: Biallelic null or functionally severe CHRNA1 variants disrupt the alpha-1 subunit
          of the fetal muscle nicotinic acetylcholine receptor, preventing normal postsynaptic receptor
          function at the neuromuscular junction. This produces profound impairment of fetal neuromuscular
          transmission and places CHRNA1-related disease on a spectrum with later-onset congenital myasthenic
          syndrome caused by milder alleles.
        gene:
          preferred_term: CHRNA1
          description: Encodes the alpha-1 subunit of the skeletal muscle nicotinic acetylcholine receptor
            required for fetal neuromuscular transmission.
          modifier: DECREASED
          term:
            id: hgnc:1955
            label: CHRNA1
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: neuromuscular synaptic transmission
          modifier: DECREASED
          term:
            id: GO:0007274
            label: neuromuscular synaptic transmission
      selected_evidence:
        snippet: We provide the first report to our knowledge of homozygous nonsense mutations in CHRNA1
          and CHRND and show that they were lethal, whereas novel recessive missense mutations in RAPSN
          caused a severe but not necessarily lethal phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
