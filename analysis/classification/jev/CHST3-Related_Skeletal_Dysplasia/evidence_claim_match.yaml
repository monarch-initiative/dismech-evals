        description: 'Dysplasia of the cardiac valve leaflets with mitral, tricuspid and/or aortic regurgitation
          occurs in a minority of patients. Reported valve involvement is clinically minor; lethal cardiac
          involvement has separately been reported in a CHST3 series without the responsible lesion being
          specified, and it is that unattributed lethality — not the valve dysplasia itself — that motivates
          echocardiographic surveillance. Valve leaflets are proteoglycan-rich connective tissue and the
          C6ST-1 substrate (chondroitin-bearing proteoglycan) is a general connective-tissue constituent,
          but CHST3-deficient valve tissue has never been examined directly, so the step from deficient
          6-O-sulfation to valve dysplasia is uncharacterized.

          '
        locations:
