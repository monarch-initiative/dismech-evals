  d0d8c9f7b5dbb81942aebc6d3b43d02465ec489afa2741d8e1763c0af13acd46:
    claim:
      about:
        disease:
          name: CHST3-Related Skeletal Dysplasia
          disease_term:
            preferred_term: CHST3-related skeletal dysplasia
            term:
              id: MONDO:0007738
              label: spondyloepiphyseal dysplasia with congenital joint dislocations
        context: []
      assertion_type: Genetic
      assertion:
        name: CHST3
        gene_term:
          preferred_term: CHST3
          term:
            id: hgnc:1971
            label: CHST3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: CHST3 (10q22.1, NM_004273.5) encodes carbohydrate sulfotransferase 3 / chondroitin 6-O-sulfotransferase-1,
          a Golgi type II membrane sulfotransferase. Reported pathogenic alleles span missense, nonsense,
          frameshift and splice-site classes and cluster in the sulfotransferase domain; missense alleles
          affecting the PAPS-binding site abolish activity, while some missense alleles are hypomorphic.
        variants:
        - name: CHST3 p.Arg304Gln (R304Q)
          description: Homozygous missense variant in the conserved 3'-phosphoadenosine 5'-phosphosulfate
            (PAPS) cosubstrate binding site, identified in two large consanguineous Omani families with
            spondyloepiphyseal dysplasia Omani type. Recombinant enzyme assays show complete loss of C6ST-1
            activity.
          gene:
            preferred_term: CHST3
            term:
              id: hgnc:1971
              label: CHST3
        - name: CHST3 p.Thr141Met (T141M)
          description: Homozygous missense variant in exon 3 identified in a Turkish family with Omani-type
            spondyloepiphyseal dysplasia and cardiac valve involvement. In contrast to R304Q this allele
            is hypomorphic, retaining roughly a quarter of wild-type sulfotransferase activity.
          gene:
            preferred_term: CHST3
            term:
              id: hgnc:1971
              label: CHST3
        - name: CHST3 c.776T>C
          description: Recurrent missense variant reported predominantly in Turkish patients, suggesting
            a population-specific recurrent or founder allele.
          gene:
            preferred_term: CHST3
            term:
              id: hgnc:1971
              label: CHST3
      selected_evidence:
        snippet: We report eight CHST3 mutations in six unrelated individuals who presented at birth with
          congenital joint dislocations.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18513679
      reference_title: Congenital joint dislocations caused by carbohydrate sulfotransferase 3 deficiency
        in recessive Larsen syndrome and humero-spinal dysostosis.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes CHST3 as the cause of the congenital-dislocation phenotype in unrelated
