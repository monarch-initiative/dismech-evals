      assertion:
        discussion_id: chst3_natural_history_epidemiology_gap
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Progressive Articular and Spinal Degeneration
        prompt: What is the natural history, prevalence and genotype-phenotype structure of CHST3-related
          skeletal dysplasia at population scale?
        rationale: Published evidence consists of small retrospective series. No prospective natural-history
          registry, validated phenotype frequency, prevalence or carrier-frequency estimate, standardized
          functional endpoint, or patient-reported outcome measure exists, and a systematic review of
          the published cases found no apparent genotype-phenotype correlation despite the coexistence
          of null and hypomorphic alleles.
        proposed_experiments:
        - experiment_id: chst3_natural_history_registry
          name: Prospective multicentre CHST3 natural-history registry
          description: Enroll molecularly confirmed patients with standardized radiographic, functional
            and patient-reported endpoints to derive phenotype frequencies, progression rates and genotype-phenotype
            relationships.
        - experiment_id: chst3_carrier_frequency_estimate
          name: Population carrier-frequency estimation for pathogenic CHST3 alleles
          description: Estimate cumulative pathogenic CHST3 allele frequency from large population sequencing
            datasets to derive an expected birth prevalence.
      selected_evidence:
        snippet: There is no apparent genotype-phenotype correlation in this disorder.
        supports: SUPPORT
