        context: []
      assertion_type: Biochemical
      assertion:
        name: Reduced 6-O-Sulfated Chondroitin Sulfate in Dermal Fibroblasts
        notes: 'Analysis of chondroitin sulfate proteoglycans from patient dermal fibroblasts shows markedly
          decreased 6-O-sulfation with a compensatory increase in 4-O-sulfation. This reciprocal shift
          is the functional signature of CHST3 deficiency and distinguishes it from SLC26A2/DTDST deficiency,
          where sulfation is globally reduced. It is mechanistically informative but is not an established,
          widely available clinical assay.

          '
        specificity: The 6-O-down / 4-O-up pattern is specific for CHST3 deficiency among the proteoglycan-sulfation
          skeletal dysplasias.
        cell_types:
        - preferred_term: dermal fibroblast
          term:
            id: CL:0002620
            label: skin fibroblast
      selected_evidence:
        snippet: Fibroblasts and urine obtained from affected patients demonstrated negligible levels
          of 6-O-sulfated GalNAc residue in CS.
        supports: SUPPORT
