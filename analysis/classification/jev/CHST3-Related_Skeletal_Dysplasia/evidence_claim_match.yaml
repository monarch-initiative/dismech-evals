        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chst3_facial_gestalt_mechanism_gap
        kind: KNOWLEDGE_GAP
        attaches_to:
        - phenotypes#Broad Forehead
        - phenotypes#Long Philtrum
        prompt: Does the recurrent CHST3 facial gestalt (broad forehead, broad nasal tip, long philtrum)
          arise from the same chondroitin 6-O-sulfation lesion that produces the skeletal dysplasia, and
          if so through which craniofacial structures?
        rationale: Broad forehead and long philtrum are reported only as components of a facial gestalt
          observed in a single 14-patient series, with no craniofacial imaging, cranial-base measurement,
          or developmental study relating them to the matrix-sulfation lesion. No mechanistic literature
          connects them to any curated pathophysiology node, so they are deliberately left unwired rather
          than attached by an inferred edge. Short neck, listed in the same gestalt sentence, is wired
          only because the short-trunk habitus supplies a plausible named intermediate; the facial features
          have no comparable anchor.
        proposed_experiments:
        - experiment_id: chst3_craniofacial_morphometry
          name: Craniofacial morphometry in a molecularly confirmed CHST3 cohort
          description: Standardized three-dimensional facial morphometry and cranial-base imaging across
            a molecularly confirmed cohort, tested against matched controls, to establish whether the
            reported gestalt is reproducible and whether it tracks with cranial-base or midface cartilage
            involvement.
      selected_evidence:
        snippet: They also shared peculiar facies with broad forehead, broad nasal tip, long philtrum
          and short neck.
        supports: SUPPORT
    origin:
