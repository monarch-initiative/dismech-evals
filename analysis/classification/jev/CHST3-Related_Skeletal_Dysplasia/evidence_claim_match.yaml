  e7286913fa621b5cc3d9563341c6c6e0aadb517dc42eac80f6b3ca8c6e106cfb:
    claim:
      about:
        disease:
          name: CHST3-Related Skeletal Dysplasia
          disease_term:
            preferred_term: CHST3-related skeletal dysplasia
            term:
              id: MONDO:0007738
              label: spondyloepiphyseal dysplasia with congenital joint dislocations
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CHST3 Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic pathogenic CHST3 variants abolish or severely reduce the activity of carbohydrate
          sulfotransferase 3 (chondroitin 6-O-sulfotransferase-1), a Golgi enzyme that transfers sulfate
          from PAPS to the C-6 position of N-acetylgalactosamine residues in chondroitin. Missense alleles
          in the PAPS-binding site abolish activity outright; other alleles are hypomorphic and retain
