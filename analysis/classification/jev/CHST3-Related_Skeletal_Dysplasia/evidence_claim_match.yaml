        prompt: What causes the mixed hearing loss in CHST3 deficiency — is the conductive component ossicular,
          and what is the substrate of the sensorineural component?
        rationale: The Pakistani kindred study that established hearing loss as part of the CHST3 spectrum
          explicitly leaves the mechanism open, and no temporal-bone imaging or inner-ear glycosaminoglycan
          study has been published, so the hearing phenotype is deliberately left without a causal pathograph
          edge.
        proposed_experiments:
        - experiment_id: chst3_temporal_bone_imaging
          name: Temporal-bone imaging and audiologic phenotyping of CHST3 patients
          description: High-resolution temporal-bone CT with air-bone-gap decomposition to test whether
            the conductive component tracks with ossicular chain malformation, plus inner-ear imaging
            for the sensorineural component.
      selected_evidence:
        snippet: The conductive portion of the hearing loss may be due to ossicular malformation; however,
          the sensorineural hearing loss requires further exploration.
        supports: SUPPORT
