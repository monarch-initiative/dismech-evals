            term:
              id: MONDO:0007738
              label: spondyloepiphyseal dysplasia with congenital joint dislocations
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Larsen syndrome (FLNB-associated, autosomal dominant)
        description: 'Dominant Larsen syndrome caused by heterozygous FLNB variants shares multiple congenital
          large-joint dislocations with CHST3 deficiency, and many CHST3 patients were initially given
          this label. The two are mechanistically unrelated: FLNB Larsen is an actin-crosslinking filamin
          defect, CHST3 deficiency is a proteoglycan-sulfation defect.

          '
        disease_term:
          preferred_term: Larsen syndrome
          term:
            id: MONDO:0007875
            label: Larsen syndrome
        distinguishing_features:
        - Autosomal dominant inheritance with FLNB variants, versus autosomal recessive CHST3 variants.
        - Characteristic vertebral changes, normal carpal bone age and absence of facial flattening favour
          CHST3 deficiency.
        - Fibroblast chondroitin sulfate analysis shows the 6-O-down / 4-O-up shift only in CHST3 deficiency.
      selected_evidence:
        snippet: The clinical and radiographic pattern (joint dislocations, vertebral changes, normal
          carpal age, lack of facial flattening, and recessive inheritance) is characteristic and distinguishes
          CHST3 deficiency from other disorders with congenital dislocations such as filamin B-associated
          dominant Larsen syndrome and Desbuquois syndrome.
        supports: SUPPORT
