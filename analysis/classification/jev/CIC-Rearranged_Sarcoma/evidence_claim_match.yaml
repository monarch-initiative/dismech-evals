      assertion_type: Pathophysiology
      assertion:
        name: Loss of CIC Transcriptional Repression
        description: Wild-type CIC is a transcriptional repressor whose effectors include the PEA3 subfamily
          ETS transcription factor ETV4. The fusion replaces that repressive output with activation at
          the same targets. The relief of repression is recorded here as a decrease in repressor activity;
          the resulting rise in PEA3 factor expression is the next node.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
          modifier: DECREASED
          term:
            id: GO:0001227
            label: DNA-binding transcription repressor activity, RNA polymerase II-specific
      selected_evidence:
        snippet: Inactivation of CIC relieves repression of its effector ETV4, driving ETV4-mediated upregulation
          of MMP24, which is necessary and sufficient for metastasis.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27869830
      reference_title: Inactivation of Capicua drives cancer metastasis.
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that CIC is a transcriptional repressor of ETV4 and that losing CIC relieves
        that repression. The work was done in a lung cancer metastasis model rather than in CIC-rearranged
        sarcoma, so it supports the repressor relationship rather than the sarcoma directly, which is
        why it is graded INDIRECT and MODEL_ORGANISM.
