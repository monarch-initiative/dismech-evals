        name: Variable CD99 with Nuclear WT1 Expression
        finding_term:
          preferred_term: patchy or absent CD99 staining with nuclear WT1 expression
        description: CD99, the stain that makes Ewing sarcoma a diagnostic consideration, is reactive
          in most CIC-rearranged sarcomas but usually patchily rather than diffusely, and nuclear WT1
          is positive in nearly all. Calretinin expression is also reported. NKX2.2 expression points
          the other way, towards Ewing sarcoma.
        notes: No finding term is bound. The immunoprofile is a combination of several marker results
          rather than a single histopathological finding, and NCIT's immunohistochemistry result terms
          are per-marker concepts such as NCIT:C141465 Estrogen Receptor Positive by Immunohistochemistry,
          with no equivalent for the markers used here.
      selected_evidence:
