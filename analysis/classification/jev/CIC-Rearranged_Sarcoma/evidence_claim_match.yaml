      assertion_type: Pathophysiology
      assertion:
        name: PEA3 Subfamily Transcription Factor Upregulation
        description: 'The fusion directly binds and upregulates PEA3 subfamily ETS genes. Gene-expression
          analysis of the fusion identified ETV5 and ETV1 as targets and showed direct binding to, and
          significant upregulation of, the ETV5 promoter. ETV4, the third PEA3 member, is the one used
          diagnostically: strong diffuse nuclear ETV4 staining is present in CIC-rearranged tumours and
          essentially absent from their mimics.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
          modifier: INCREASED
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
      selected_evidence:
        snippet: Gene expression analysis identified the ETS family genes, ERM/ETV5 and ETV1, as potential
          targets for the gene product of CIC-DUX4. Indeed, CIC-DUX4 directly binds the ERM promoter by
          recognizing a novel target sequence and significantly up-regulates its expression.
        supports: SUPPORT
        directness: DIRECT
    origin:
