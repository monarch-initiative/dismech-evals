            description: Mouse embryonic mesenchymal cells were transduced with human CIC-DUX4 cDNA and
              transplanted into recipient mice, which developed an aggressive undifferentiated sarcoma
              of small round to short spindle cells. The model reproduces the fusion's downstream programme,
              including the PEA3 family genes seen in human tumours and the cell cycle gene Ccnd2, and
              it was the source of CCND2 and MUC5AC as markers separating this tumour from Ewing sarcoma.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Aggressive Undifferentiated Round Cell Proliferation
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: CELLULAR
        description: The fusion alone generates the tumour in this system, which is what makes it evidence
          that the fusion causes the proliferative phenotype rather than accompanying it.
        limitations: 'The recipient cell is a mouse embryonic mesenchymal cell chosen for the experiment,
          not an identified human cell of origin, so the model shows the fusion is sufficient in a permissive
          mouse cell and says nothing about which human cell the tumour arises from. The fusion is introduced
          by transduction from a cDNA rather than arising as a translocation, so expression is not under
          the endogenous promoter. The tumours are mouse tumours, and the markers derived from them were
          validated separately on human cases. The recipient cell matters: the same fusion introduced
          into bone marrow-derived mesenchymal stromal cells produced neither the downstream expression
          changes nor growth, which the authors read as the fusion''s function being cell context-dependent
          at least in part.'
        readouts:
        - name: Ccnd2 expression in model tumours
          target: Aggressive Undifferentiated Round Cell Proliferation
          direction: INCREASED
          interpretation: Cyclin D2 upregulation links the fusion's transcriptional programme to cell
            cycle progression, and is the basis for testing a CDK4/6 inhibitor in this model.
      selected_evidence:
        snippet: Recipient mice transplanted with eMC-expressing CIC-DUX4 rapidly developed an aggressive,
          undifferentiated sarcoma composed of small round to short spindle cells.
        supports: SUPPORT
        directness: DIRECT
