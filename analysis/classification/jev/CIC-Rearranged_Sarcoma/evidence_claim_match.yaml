      - /disease_term
    evidence_metadata:
      reference: PMID:22072439
      reference_title: High prevalence of CIC fusion with double-homeobox (DUX4) transcription factors
        in EWSR1-negative undifferentiated small blue round cell sarcomas.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: A systematic screen of 22 small blue round cell sarcomas that were negative for EWSR1
        and for the other recurrent translocations of that age group. CIC was rearranged in 15, which
        is what made CIC rearrangement a candidate defining lesion rather than an isolated finding. The
        denominator is a selected set of otherwise unclassifiable tumours, so 68 per cent is not the share
        of round cell sarcomas overall.
