      assertion:
        name: Ewing Sarcoma
        disease_term:
          preferred_term: Ewing sarcoma
          term:
            id: MONDO:0012817
            label: Ewing sarcoma
        description: 'The main differential, and the reason the distinction matters: the two are treated
          differently and have different outcomes. They were grouped together as the Ewing sarcoma family
          of tumours, or Ewing-like sarcoma, until the 2020 World Health Organization classification separated
          them. CD99, the stain that suggests Ewing sarcoma, is reactive in most CIC-rearranged tumours,
          so it does not separate them on its own.'
        distinguishing_features:
        - CIC rearrangement rather than an EWSR1-ETS fusion
        - Strong diffuse nuclear ETV4 staining in all 17 CIC-rearranged cases of a 127-case study, against
          focal very weak staining in four of 43 Ewing sarcomas
        - Nuclear DUX4 staining, 98 per cent sensitive and 100 per cent specific for CIC::DUX4 across
          48 CIC-rearranged and 105 other cases
        - CD99 diffuse in only 23 per cent of CIC-rearranged cases, with nuclear WT1 in 92 per cent; NKX2.2
          favours Ewing sarcoma
        - Predominantly deep soft tissue rather than bone, with 3 per cent of CIC-rearranged tumours skeletal
          in one cohort and none in another, against 40 per cent of Ewing sarcomas
        - Worse survival, 43 per cent at five years against 77 per cent in matched Ewing sarcoma controls
      selected_evidence:
        snippet: Radiologic recognition of CIC-rearranged sarcomas enables oncologists to anticipate their
          aggressive nature and poor response to standard ES treatments, which may necessitate more intensive
          initial surgical interventions.
        supports: SUPPORT
        directness: DIRECT
    origin:
