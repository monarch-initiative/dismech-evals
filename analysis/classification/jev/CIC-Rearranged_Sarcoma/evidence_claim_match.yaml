        gene_term:
          preferred_term: CIC
          term:
            id: hgnc:14214
            label: CIC
        notes: The defining somatic lesion. CIC::DUX4 arises from t(4;19)(q35;q13) with DUX4 on 4q35,
          or t(10;19)(q26;q13) with DUX4 on 10q26.3. In the 115-patient cohort a CIC::DUX4 fusion was
          demonstrated in 57 per cent of cases, split between the two DUX4 loci; the rest were identified
          by CIC rearrangement without a demonstrated DUX4 partner, which reflects both variant partners
          and the difficulty of detecting a fusion into the repetitive D4Z4 region. Variant partners including
          FOXO4 and NUTM1 are reported. No gene-disease validity assertion is recorded here, because ClinGen
          has not curated CIC against this disease.
      selected_evidence:
        snippet: A CIC-DUX4 fusion was detected in 57% of cases, with either DUX4 on 4q35 (35%) or on
          10q26 in 25 (22%) cases.
