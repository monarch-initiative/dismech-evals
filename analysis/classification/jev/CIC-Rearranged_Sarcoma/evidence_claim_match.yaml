            label: Tumor Cell Necrosis
        description: Sheets of primitive small to medium round to oval cells with prominent nucleoli,
          a high mitotic count and areas of necrosis. Compared with Ewing sarcoma the cells are less monomorphic,
          and lobulation, nuclear pleomorphism, prominent nucleoli, spindle cell elements and myxoid change
          are all significantly more common.
        notes: Only the necrosis component is bound. A label search of NCIT through the OLS4 API on 30
          Oct 2026 for "Small Round Cell", "Round Cell Pattern" and "Myxoid" returned disease concepts
          such as NCIT:C8300 Desmoplastic Small Round Cell Tumor and NCIT:C27781 Myxoid Liposarcoma, not
          morphology findings, so no finding term was available for the round cell pattern or the myxoid
          change. NCIT:C53643 Spindle Cell Pattern exists and is not bound here, because spindling is
          a focal secondary feature of this tumour rather than the finding this item describes.
      selected_evidence:
        snippet: A histologic comparison of the CIC-rearranged sarcomas with 20 EWSR1-rearranged Ewing
          sarcomas showed significantly higher degrees of lobulation, nuclear pleomorphism, the prominence
          of the nucleoli, spindle cell elements, and myxoid changes in the CIC-rearranged sarcomas.
