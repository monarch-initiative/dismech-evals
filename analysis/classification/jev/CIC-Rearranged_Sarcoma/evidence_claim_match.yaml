            term:
              id: MONDO:0956989
              label: CIC-rearranged sarcoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CIC Gene Rearrangement
        description: 'A somatic rearrangement of CIC on 19q13, most often fusing it to a copy of the double
          homeobox gene DUX4 on 4q35 or 10q26.3, through a t(4;19)(q35;q13) or t(10;19)(q26;q13) translocation.
          CIC encodes the human homologue of Drosophila capicua, a high mobility group box transcription
          factor. In the fusion most of the CIC protein is retained, including its DNA-binding HMG box,
          and the C-terminal fragment of DUX4 supplies a transcriptional activation domain. This is a
          change in kind rather than in degree: the product is a chimeric transcription factor with an
          activity the wild-type repressor does not have, which is why the molecular function here is
          marked GAIN_OF_FUNCTION rather than INCREASED.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CIC
          term:
            id: hgnc:14214
            label: CIC
        - preferred_term: DUX4
          term:
            id: hgnc:50800
            label: DUX4
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
      selected_evidence:
        snippet: CIC rearrangements by FISH were detected in 15/22 (68%), while none showed FUS abnormalities.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
