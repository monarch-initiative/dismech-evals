        notes: 'No population incidence or prevalence figure was found for this entity. The qualitative
          tier records the description used by a national multicentre series, which identified 18 patients
          diagnosed across Australian centres between 2014 and 2019. The largest cohorts are referral-centre
          case series rather than population registries: 115 patients in one pathology consultation cohort
          assembled over many years, and 88 CIC-rearranged cases among 148 undifferentiated small round
          cell sarcomas collected from 21 worldwide sarcoma reference centres between 1983 and 2019. Those
          denominators are case series, so they support the ultra-rare tier without supplying a rate.'
