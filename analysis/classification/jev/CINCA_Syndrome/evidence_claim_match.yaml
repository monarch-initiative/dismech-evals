      assertion:
        discussion_id: gap_cinca_irreversible_neurosensory_damage
        prompt: Can established post-inflammatory neurosensory damage in CINCA/NOMID (retinal dystrophy,
          hearing loss, CNS injury) be reversed, or does IL-1 blockade only prevent further damage once
          fixed tissue injury has occurred?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Retinal dystrophy
        - pathophysiology#Central nervous system inflammation
        rationale: IL-1 blockade reliably controls active inflammation and can improve MRI-visible cochlear
          and leptomeningeal lesions, but fixed post-inflammatory damage such as retinal dystrophy can
          remain stationary despite treatment. Whether any established neurosensory injury is recoverable
          — versus only preventable by very early treatment — is unresolved and is central to the rationale
          for early diagnosis before genetic confirmation.
      selected_evidence:
        snippet: A state of severe retinal dystrophy of post-inflammatory origin became evident on funduscopy,
          optical coherence tomography and visual electrophysiology tests at the age of 10 years, which
          remained stationary after 1 year of anakinra treatment.
        supports: SUPPORT
