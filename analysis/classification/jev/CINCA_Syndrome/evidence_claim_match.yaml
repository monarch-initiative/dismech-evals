      assertion_type: HistopathologyFinding
      assertion:
        name: Neutrophilic urticarial dermatosis
        description: 'Skin biopsy of the characteristic rash reveals a perivascular and interstitial neutrophilic
          infiltrate in the dermis, with neutrophils surrounding eccrine sweat glands. Unlike true urticaria,
          there is no mast cell degranulation, dermal edema is minimal, and eosinophils are absent. This
          neutrophilic pattern is consistent across the CAPS spectrum and helps distinguish CINCA/NOMID
          rash from allergic urticaria and other neutrophilic dermatoses.

          '
        finding_term:
          preferred_term: Intramucosal Neutrophilic Infiltrate
          term:
