      assertion_type: Pathophysiology
      assertion:
        name: NLRP3 gain-of-function mutation
        description: 'Heterozygous gain-of-function mutations in the NLRP3 gene (encoding cryopyrin) lower
          the activation threshold for NLRP3 inflammasome assembly. Most CINCA/NOMID mutations are de
          novo, arising post-zygotically or in the germline. The NLRP3 protein contains a pyrin domain,
          a NACHT domain, and leucine-rich repeats; disease mutations cluster in the NACHT domain and
          disrupt autoinhibitory conformations.

          '
        gene:
          preferred_term: NLRP3
          term:
            id: hgnc:16400
            label: NLRP3
      selected_evidence:
        snippet: This gene, called CIAS1, is expressed in peripheral blood leukocytes and encodes a protein
          with a pyrin domain, a nucleotide-binding site (NBS, NACHT subfamily) domain and a leucine-rich
          repeat (LRR) motif region, suggesting a role in the regulation of inflammation and apoptosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11687797
      reference_title: Mutation of a new gene encoding a putative pyrin-like protein causes familial cold
        autoinflammatory syndrome and Muckle-Wells syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Original identification of CIAS1/NLRP3 mutations as the cause of FCAS and MWS, establishing
