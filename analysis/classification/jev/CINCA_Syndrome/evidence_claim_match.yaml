        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Necrotizing funisitis
        description: 'Histopathological examination of the umbilical cord in neonates with CINCA/NOMID
          reveals necrotizing funisitis, characterized by rings of karyorrhectic debris with neutrophilic
          infiltrate in Wharton''s jelly oriented toward the amniotic surface. This finding demonstrates
          intrauterine onset of IL-1beta-driven inflammation and may be the earliest histopathological
          manifestation of the disease.

          '
        finding_term:
          preferred_term: Necrotic Lesion
          term:
            id: NCIT:C36123
            label: Necrotic Lesion
        context: Umbilical cord and placenta at birth
      selected_evidence:
        snippet: Histopathologic examination of the placenta and umbilical cord can provide crucial insights
          into the intrauterine onset of inflammation, which is the first manifestation of CINCA syndrome/NOMID
          in newborns.
        supports: SUPPORT
