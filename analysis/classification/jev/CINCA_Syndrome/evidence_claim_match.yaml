        snippet: serum amyloid A (from a median of 174 mg to 8 mg per liter), C-reactive protein (from
          a median of 5.29 mg to 0.34 mg per deciliter), and the erythrocyte sedimentation rate decreased
          at month 3
        supports: SUPPORT
