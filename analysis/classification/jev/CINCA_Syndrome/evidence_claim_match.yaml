      assertion_type: Discussion
      assertion:
        discussion_id: gap_cinca_mutation_negative_after_deep_sequencing
        prompt: What drives autoinflammation in clinically definite CINCA/NOMID patients who remain NLRP3
          mutation-negative even after amplicon-based deep sequencing for somatic mosaicism?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#NLRP3
        - has_subtypes#Mutation-negative CINCA (somatic mosaicism)
        rationale: Deep/amplicon sequencing reclassifies many "mutation-negative" cases as low-level NLRP3
          mosaicism, but a substantial fraction still has no detectable NLRP3 variant even with the most
          sensitive methods, yet responds to IL-1 blockade exactly like genotype-positive patients. The
          genetic lesion in this residual group — deeper mosaicism below detection, a non-coding/regulatory
          NLRP3 change, or a variant in another inflammasome gene — is unresolved, leaving the first step
          of the causal chain unaccounted for in these patients.
        proposed_experiments:
        - experiment_id: exp_cinca_ultradeep_mosaicism_panel
          name: Ultra-deep multi-tissue sequencing and inflammasome gene panel in mutation-negative CINCA/NOMID
          description: Apply ultra-deep error-corrected sequencing across multiple tissues (sorted myeloid
            vs lymphoid fractions, buccal, and affected tissue) plus a broad inflammasome-pathway gene
            panel to clinically definite, IL-1-responsive CINCA/NOMID patients who are NLRP3-negative
            by standard amplicon deep sequencing, to detect sub-threshold NLRP3 mosaicism, non-coding
            NLRP3 variants, or alternative inflammasome-gene drivers.
          experiment_type:
            preferred_term: targeted deep sequencing
      selected_evidence:
        snippet: In 40% (4/10) of the cohort a post-zygotic NLRP3 mutation leading to somatic mosaicism
          was found by ADS.
        supports: SUPPORT
