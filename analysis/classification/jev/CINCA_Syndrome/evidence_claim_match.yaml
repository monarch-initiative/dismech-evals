        name: Constitutive NLRP3 inflammasome activation
        description: 'Mutant cryopyrin undergoes spontaneous oligomerization and constitutive assembly
          of the NLRP3 inflammasome complex, comprising NLRP3, ASC (PYCARD), and pro-caspase-1. NEK7 serves
          as a scaffold facilitating NLRP3 activation via microtubule organizing center trafficking. The
          resulting continuous activation of caspase-1 occurs without normal requirement for exogenous
          danger signals. ASC speck formation, the hallmark of inflammasome assembly, is enhanced in patient
          myeloid cells and suppressible by MCC950.

          '
        biological_processes:
        - preferred_term: NLRP3 inflammasome complex assembly
          term:
            id: GO:0044546
