            description: 'Hyperphosphatemia and elevated calcium-phosphate product promote osteogenic
              transdifferentiation of vascular smooth muscle cells (VSMCs) into osteoblast-like cells
              via RUNX2 and Pit-1/Pit-2 phosphate transporters. Loss of calcification inhibitors (fetuin-A,
              matrix Gla protein, pyrophosphate, osteoprotegerin) and Klotho deficiency further drive
              medial arterial calcification. Calciprotein particles (CPPs), colloidal mineral-protein
              nanoparticles, have emerged as key mediators of phosphate toxicity, linking mineral stress
              to vascular inflammation and calcification. This is the major cause of cardiovascular mortality
              in CKD-MBD.

              '
