  f8e6d6a03068ed88dc9c763b9125f614b1e8d94c87d3455e3ae2cbb499725030:
    claim:
      about:
        disease:
          name: CKD-Mineral Bone Disorder
          disease_term:
            preferred_term: CKD-mineral bone disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Bone-Vascular Paradox (Sclerostin/Wnt Axis)
        description: 'Calcified arteries in CKD produce sclerostin and other factors that inhibit bone
          remodeling, explaining the paradox of simultaneous vascular calcification and low-turnover (adynamic)
          bone disease. Vascular osteoblastic/osteocytic transdifferentiation produces sclerostin that
          brakes Wnt-driven calcification in the vasculature but also suppresses skeletal bone formation.
          Anti-sclerostin antibody therapy improves bone but can worsen vascular calcification, highlighting
          the therapeutic complexity.

          '
        cell_types:
        - preferred_term: Vascular Smooth Muscle Cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        - preferred_term: Osteocyte
          term:
            id: CL:0000137
            label: osteocyte
        biological_processes:
        - preferred_term: Wnt Signaling Pathway
          term:
            id: GO:0016055
            label: Wnt signaling pathway
        - preferred_term: Bone Remodeling
          term:
            id: GO:0046849
            label: bone remodeling
      selected_evidence:
        snippet: The discovery that calcified arteries in chronic kidney disease inhibit bone remodeling
          lead to the identification of factors produced by the vasculature that inhibit the skeleton,
          thus providing a potential explanation for the bone-vascular paradox.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36776982
      reference_title: Updates in the chronic kidney disease-mineral bone disorder show the role of osteocytic
        proteins, a potential mechanism of the bone-Vascular paradox, a therapeutic target, and a biomarker.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the mechanism of the bone-vascular paradox where calcified arteries produce
        factors that inhibit skeletal bone remodeling.
