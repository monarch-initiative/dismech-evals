        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RANKL/OPG Imbalance
        description: 'Elevated PTH increases RANKL expression by osteoblasts and osteocytes while suppressing
          osteoprotegerin (OPG), shifting the balance toward excessive osteoclastogenesis and bone resorption.
          Uremic toxins may independently alter RANKL/OPG signaling. Novel biologicals targeting RANKL
          (denosumab) and sclerostin are being explored in CKD-MBD but require careful consideration of
          the bone-vascular paradox.

          '
        biological_processes:
        - preferred_term: Osteoclast Differentiation
          term:
            id: GO:0030316
            label: osteoclast differentiation
      selected_evidence:
        snippet: Renal osteodystrophy (ROD), the histologic bone lesions of chronic kidney disease (CKD),
          is now included in a wider syndrome with laboratory abnormalities of mineral metabolism and
          extra-skeletal calcifications or CKD-mineral and bone disorders (CKD-MBD), to highlight the
          increased burden of mortality.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
