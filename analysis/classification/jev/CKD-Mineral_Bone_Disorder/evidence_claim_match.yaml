  fe09b41d91b7967d1b1ae7b523ab48ba7f897ce58a4cb4541c5bf0be15b1a4d0:
    claim:
      about:
        disease:
          name: CKD-Mineral Bone Disorder
          disease_term:
            preferred_term: CKD-mineral bone disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vascular Calcification
        description: 'Hyperphosphatemia and elevated calcium-phosphate product promote osteogenic transdifferentiation
          of vascular smooth muscle cells (VSMCs) into osteoblast-like cells via RUNX2 and Pit-1/Pit-2
          phosphate transporters. Loss of calcification inhibitors (fetuin-A, matrix Gla protein, pyrophosphate,
          osteoprotegerin) and Klotho deficiency further drive medial arterial calcification. Calciprotein
          particles (CPPs), colloidal mineral-protein nanoparticles, have emerged as key mediators of
          phosphate toxicity, linking mineral stress to vascular inflammation and calcification. This
          is the major cause of cardiovascular mortality in CKD-MBD.

          '
        cell_types:
        - preferred_term: Vascular Smooth Muscle Cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        biological_processes:
        - preferred_term: Osteogenic Transdifferentiation of Vascular Smooth Muscle Cells
          description: Acquisition of a RUNX2-driven osteoblast-like differentiation program by vascular
            smooth muscle cells, producing ectopic medial arterial calcification. Bound to the GO osteoblast-differentiation
            process — the cell-fate switch that the cited evidence describes as "osteochondrogenic differentiation
            of vascular cells" — rather than the broad parent term "ossification" (GO:0001503), which
            denotes physiologic skeletal bone formation; no GO term specific to ectopic vascular calcification
            exists.
          modifier: INCREASED
          term:
            id: GO:0001649
            label: osteoblast differentiation
        locations:
        - preferred_term: Arterial Blood Vessel
          term:
            id: UBERON:0003509
            label: arterial blood vessel
      selected_evidence:
        snippet: several pathophysiological processes contribute to vascular calcifications, including
          osteochondrogenic differentiation of vascular cells, hyperphosphatemia and hypercalcemia, and
          the loss of specific vascular calcification inhibitors including pyrophosphate, fetuin-A, osteoprotegerin,
          and matrix GLA protein
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39684805
      reference_title: 'Understanding Vascular Calcification in Chronic Kidney Disease: Pathogenesis and
