        description: 'Bone-biopsy pattern within the renal osteodystrophy component of CKD-MBD, driven
          by secondary hyperparathyroidism with excessive osteoclast-mediated bone resorption and disorganized
          new bone formation. The most common high-turnover pattern in dialysis patients.

          '
        context: Renal osteodystrophy histologic pattern within CKD-MBD
      selected_evidence:
        snippet: 42% had high turnover/hyperparathyroid bone disease and 23% had low turnover/adynamic
          bone disease
        supports: SUPPORT
