  bdaaf69f3c0eeec08db67b83d8edcb9c49ec410f34e778793cb40dd6f6ccfaa7:
    claim:
      about:
        disease:
          name: CKD-Mineral Bone Disorder
          disease_term:
            preferred_term: CKD-mineral bone disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Phosphate Retention and FGF23 Axis
        description: 'As nephron mass declines, phosphate excretion per nephron increases via FGF23 and
          PTH-mediated suppression of proximal tubular sodium-phosphate cotransporters (NaPi-2a/NaPi-2c).
          FGF23 rises early in CKD (stage 2) before serum phosphate becomes overtly elevated. FGF23 requires
          the co-receptor alpha-Klotho, which is predominantly expressed in the kidney and declines with
          CKD progression, creating a vicious cycle.

          '
        genes:
        - preferred_term: RGS14
          term:
            id: hgnc:9996
            label: RGS14
        cell_types:
        - preferred_term: Osteocyte
          term:
            id: CL:0000137
            label: osteocyte
        - preferred_term: Proximal Tubular Epithelial Cell
          term:
            id: CL:0002306
            label: epithelial cell of proximal tubule
        biological_processes:
        - preferred_term: Phosphate Ion Homeostasis
          term:
            id: GO:0055062
            label: phosphate ion homeostasis
        - preferred_term: Fibroblast Growth Factor Receptor Signaling
          term:
            id: GO:0008543
            label: fibroblast growth factor receptor signaling pathway
        locations:
        - preferred_term: Proximal Tubule
          term:
            id: UBERON:0004134
            label: proximal tubule
        - preferred_term: Bone Tissue
          term:
            id: UBERON:0002481
            label: bone tissue
      selected_evidence:
        snippet: CKD-MBD manifests as hypocalcemia and hyperphosphatemia in the later stages of CKD; however,
          it initially develops much earlier in disease course. The initial step in CKD-MBD involves decreased
          phosphate excretion in the urine, followed by increased circulating concentrations of fibroblast
          growth factor 23 (FGF23) and parathyroid hormone (PTH), which increase urinary phosphate excretion.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37258233
      reference_title: Role of Chronic Kidney Disease (CKD)-Mineral and Bone Disorder (MBD) in the Pathogenesis
        of Cardiovascular Disease in CKD.
      evidence_source: HUMAN_CLINICAL
      explanation: Confirms that FGF23 and PTH rise early in CKD as compensatory responses to decreased
        phosphate excretion, before overt hyperphosphatemia.
