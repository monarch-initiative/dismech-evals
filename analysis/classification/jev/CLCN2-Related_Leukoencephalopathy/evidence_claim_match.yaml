  1baf7b98316e46b519f6038950cf8fdc7064b66ebd4b54c736e89110ce172f7a:
    claim:
      about:
        disease:
          name: CLCN2-Related Leukoencephalopathy
          disease_term:
            preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired GlialCAM-MLC1-ClC-2 Glial Complex Function
        biological_scale: MOLECULAR
        description: 'ClC-2 does not act alone in glia. GlialCAM (HGNC-approved symbol HEPACAM) is its
          auxiliary subunit: it binds ClC-2, targets it to cell junctions, increases the currents it carries
          and changes its functional properties, and it does the same for MLC1, so the three proteins
          behave as one glial complex. This node matters for two reasons that pull in opposite directions.
          First, GlialCAM and MLC1 partially rescue disease-causing ClC-2 mutants - GlialCAM restores
          mutant function by modifying gating and restores surface levels by impeding turnover, and that
          rescue requires ClC-2 to be localised at cell-cell junctions - so the residual severity of a
          CLCN2 allele in vivo is set jointly by the allele and by how much the partners can compensate.
          Second, the same complex is the point of convergence with megalencephalic leukoencephalopathy
          with subcortical cysts: MLC1 and HEPACAM are the MLC genes, GlialCAM is important for modifying
          ClC-2''s biophysical properties specifically in oligodendrocytes, the cells chiefly affected
          by vacuolization, and mouse Glialcam and Mlc1 nulls vacuolate myelin much as Clcn2 nulls do.

          The compensation is nonetheless not the whole story of the MLC side of the axis. Crossing Glialcam-null
          mice to a knock-in carrying a constitutively open ClC-2 did not rescue their leukodystrophy,
          from which the authors conclude that GlialCAM-induced changes in the biophysical properties
          of ClC-2 are irrelevant for GLIALCAM-related leukodystrophy. That is a negative result about
