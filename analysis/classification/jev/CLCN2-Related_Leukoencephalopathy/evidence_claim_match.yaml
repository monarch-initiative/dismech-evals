        description: 'Male infertility is a recognised feature of the human disorder and is one of the
          two routes by which otherwise asymptomatic men have been ascertained. The mechanism is assigned
          to the Sertoli cell by conditional deletion in mice, and the untargeted mouse alleles agree:
          homozygotes for the early-stop Clcn2 allele are azoospermic and sterile. In humans the picture
          is genuinely inconsistent, and this entry does not smooth that over. Infertility and azoospermia
          are reported in individual men, while the Japanese series records a male patient who had two
          children, which the authors read as preserved fertility. Whether that reflects allele-specific
          residual function, an age effect, or simply that Sertoli-cell dependence is less absolute in
          humans than in mice is unresolved and is filed as a discussion below.'
