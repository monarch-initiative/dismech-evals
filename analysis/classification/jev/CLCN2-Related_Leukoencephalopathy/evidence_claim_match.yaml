              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of ClC-2 from the Panglial Syncytium
        biological_scale: CELLULAR
        description: 'The cellular substrate of the disease is the panglial syncytium - the coupled network
          of astrocytes, oligodendrocytes and ependymal cells that handles ion and water movement between
          the vasculature, the interstitium and the myelin. ClC-2 was detected in all components of that
          syncytium in normal human brain, enriched in astrocytic endfeet at the perivascular basal lamina,
          in the glia limitans and in ependymal cells. Removing it does not damage neurons: in the knockout
          mouse, neuronal morphology seemed normal while the white matter vacuolated. Conditional deletion
          resolves the requirement further, and the answer is that neither glial cell type alone is sufficient
          - leukodystrophy was fully developed only when ClC-2 was disrupted in both astrocytes and oligodendrocytes.
          That two-cell requirement is the strongest available argument that the lesion is a failure of
          the coupled syncytium rather than of a single cell type.'
        genes:
        - preferred_term: CLCN2
          term:
            id: hgnc:2020
            label: CLCN2
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        - preferred_term: ependymal cell
          term:
            id: CL:0000065
            label: ependymal cell
        cellular_components:
        - preferred_term: astrocyte end-foot
          term:
            id: GO:0097450
            label: astrocyte end-foot
        locations:
        - preferred_term: brain white matter
          term:
            id: UBERON:0003544
            label: brain white matter
      selected_evidence:
        snippet: We detected ClC-2 in all components of the panglial syncytium, enriched in astrocytic
          endfeet at the perivascular basal lamina, in the glia limitans, and in ependymal cells.
        supports: SUPPORT
