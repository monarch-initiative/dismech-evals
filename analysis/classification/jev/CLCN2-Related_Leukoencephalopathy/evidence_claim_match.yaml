        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intramyelinic Oedema and Myelin Vacuolation
        biological_scale: TISSUE
        description: 'The lesion that defines the disease is fluid accumulating within the myelin sheath
          itself. In the knockout mouse the white matter of brain and spinal cord developed widespread
          vacuolation that progressed with age, with fluid-filled spaces appearing between myelin sheaths
          of the central but not the peripheral nervous system. The peripheral sparing is diagnostically
          important and is not incidental: it says the lesion tracks the panglial syncytium, which is
          a CNS structure, rather than myelin as such.

          Naming this correctly matters clinically. This is oedema, not demyelination and not hypomyelination:
          the myelin is present and the water is between its lamellae. That is why the MRI shows restricted
          diffusion rather than the free-water signal of myelin loss, why the disease is compatible with
          decades of near-normal function, and why the imaging can look far worse than the patient.'
        cellular_components:
        - preferred_term: myelin sheath
          modifier: ABNORMAL
          term:
            id: GO:0043209
            label: myelin sheath
        biological_processes:
        - preferred_term: myelination
          modifier: ABNORMAL
          term:
            id: GO:0042552
            label: myelination
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        locations:
        - preferred_term: brain white matter
          term:
            id: UBERON:0003544
            label: brain white matter
        notes: '`myelination` is bound with modifier ABNORMAL, not DECREASED, and the distinction is deliberate.
          Nothing in the cited literature shows reduced myelin formation in this disorder; what is shown
          is that formed myelin separates and fills with fluid. A DECREASED binding here would assert
          hypomyelination, which is the wrong disease class.'
      selected_evidence:
        snippet: In mice, the disruption of the Cl(-) channel ClC-2 causes fluid accumulation leading
          to myelin vacuolation.
        supports: SUPPORT
