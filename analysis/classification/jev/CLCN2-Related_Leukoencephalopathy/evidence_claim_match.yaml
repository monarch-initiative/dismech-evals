          localises it unambiguously: retinal degeneration depends on loss of ClC-2 in retinal pigment
          epithelial cells. A second mouse line carrying an early stop codon in Clcn2 loses photoreceptors
          severely by 14 days of age, and that loss is preceded by elongation of the RPE apical microvilli
          - a structural change in the supporting epithelium before the sensory cells die, which is the
          order the RPE-primary model predicts. Human ophthalmological findings match the localisation:
          macular atrophy with pigment epithelium atrophy and choroidal capillary atrophy in one detailed
          case. Clinically the result is mild - visual field defects and mild visual impairment, with
          blindness rare.'
