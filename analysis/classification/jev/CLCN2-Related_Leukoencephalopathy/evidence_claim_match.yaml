  9dd9affd83af8d536548d0c48e07f79878f307c8c62a67c40058019179faba6a:
    claim:
      about:
        disease:
          name: CLCN2-Related Leukoencephalopathy
          disease_term:
            preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Megalencephalic leukoencephalopathy with subcortical cysts
        disease_term:
          preferred_term: megalencephalic leukoencephalopathy with subcortical cysts
          term:
            id: MONDO:0011391
            label: megalencephalic leukoencephalopathy with subcortical cysts
        description: 'The closest mechanistic relative, and the one differential where the overlap is
          molecular rather than merely radiological. MLC is caused by variants in MLC1 or in HEPACAM (GlialCAM)
          - the two proteins that form a complex with ClC-2 in glia. All three lesions produce vacuolating
          white matter disease with intramyelinic fluid, and GlialCAM is required for targeting both MLC1
          and ClC-2 to specialised glial domains and for modifying ClC-2''s properties in oligodendrocytes,
          the cells chiefly affected by vacuolization. The three diseases are best thought of as lesions
          at different points of one glial ion-and-water module.

          Clinically they separate cleanly, which is why this is a differential and not a subtype relationship.
          MLC begins with infantile macrocephaly and shows diffusely swollen white matter with anterior
          temporal and frontoparietal subcortical cysts; CLCN2-related leukoencephalopathy has normal
          head size and a tract-selective pattern without cysts.'
        distinguishing_features:
        - MLC presents with infantile-onset macrocephaly; macrocephaly is not a feature of CLCN2-related
          leukoencephalopathy.
        - Subcortical cysts in the anterior temporal and frontoparietal regions are characteristic of
          MLC and are not part of the CLCN2 imaging pattern.
        - MLC involves the cerebral white matter diffusely and swollen; the CLCN2 pattern is tract-selective,
          centred on the posterior limbs of the internal capsules, cerebral peduncles and middle cerebellar
          peduncles.
        - The causal genes differ - MLC1 or HEPACAM in MLC, CLCN2 here - even though the three proteins
          act as one complex; a remitting dominant form of MLC exists with HEPACAM variants, whereas CLCN2-related
          leukoencephalopathy is uniformly recessive.
        - MLC follows a progressive course with increasing seizures, spasticity and cognitive decline
          and loss of ambulation; CLCN2-related leukoencephalopathy characteristically preserves ambulation.
        notes: MONDO:0011391 was verified with OAK; its Orphanet xref is Orphanet:2478 and it carries
          "MLC" and "Van der Knaap syndrome" as exact synonyms. The clinical contrast in the distinguishing
          features is taken from that MONDO term's Orphanet-sourced definition text; it is presented as
          reasoned clinical context rather than as a quoted finding, which is why no evidence item carries
          it. The evidence items below support only the molecular convergence, which is the claim this
          differential is really making. There is no dismech entry for MLC at the time of writing.
      selected_evidence:
        snippet: Defects in the astrocytic membrane protein MLC1, the adhesion molecule GlialCAM or the
          chloride channel ClC-2 underlie human leukoencephalopathies.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/1
      evidence_path: /differential_diagnoses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24647135
      reference_title: Disrupting MLC1 and GlialCAM and ClC-2 interactions in leukodystrophy entails glial
        chloride channel dysfunction.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that the three genes cause one family of leukoencephalopathies, which is
        the basis for treating MLC as the mechanistic differential.
