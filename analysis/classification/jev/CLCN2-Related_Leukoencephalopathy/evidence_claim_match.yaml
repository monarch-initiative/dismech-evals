      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing for biallelic CLCN2 variants
        description: The diagnosis is established by identifying biallelic pathogenic CLCN2 variants.
          Two interpretation points follow from the published spectrum. First, both truncating and missense
          alleles are causal and a missense variant should not be discounted - the allele whose loss of
          function is best characterised experimentally, p.Ala500Val, is a missense change whose defect
          is in gating and turnover rather than in protein absence. Second, phase must be established,
          because heterozygotes are unaffected and because a heterozygous CLCN2 variant has an entirely
          different clinical meaning in the context of hypertension (see the differential on familial
          hyperaldosteronism type II). In populations where a founder allele exists - c.61dupC in Japan
          - it should be looked for specifically.
      selected_evidence:
        snippet: The diagnosis of CLCN2-related leukoencephalopathy is established in a proband by identification
          of biallelic pathogenic variants in CLCN2 on molecular genetic testing.
        supports: SUPPORT
