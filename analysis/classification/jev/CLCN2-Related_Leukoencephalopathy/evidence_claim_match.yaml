  befdc004c83d9eccace990594e37e1dc2800e0a787e1e87dad9a1232b9f33ed8:
    claim:
      about:
        disease:
          name: CLCN2-Related Leukoencephalopathy
          disease_term:
            preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: Clcn2 knockout (constitutive null)
        category: Knockout
        description: 'The constitutive Clcn2 knockout is the founding model and the reason the human disease
          was looked for at all: the 2013 human study opens by noting that mutant mouse models suggested
          ClC-2 has functions in ion and water homoeostasis but that this had not been confirmed in human
          beings. The model recapitulates the human lesion closely - widespread white matter vacuolation
          of brain and spinal cord progressing with age, with fluid-filled spaces between myelin sheaths
          of the central but not the peripheral nervous system - and it also reproduces the extra-neurological
          arms, since Clcn2 disruption in mice had already been shown to cause testicular and retinal
          degeneration.

          Its two most informative results are negative ones. Neuronal morphology seemed normal despite
          the vacuolation, which is what makes the disease glial. And neither heterozygous nor homozygous
          knockouts had lowered seizure thresholds, which - together with the finding that several ClC-2
          sequence abnormalities in epilepsy patients are probably innocuous polymorphisms - is the animal
          half of the case against the retracted CLCN2-epilepsy association.

          Fidelity limits worth stating. The mouse is a complete null while most human patients carry
          missense or compound-heterozygous genotypes with residual function; the model therefore represents
          the severe end of the molecular spectrum. Its neurological deficits were mild, so it does not
          model the ataxia and spasticity that dominate the human presentation, and the human tract selectivity
          - internal capsule, cerebral peduncle, middle cerebellar peduncle - is not reported as such
          in the mouse, whose vacuolation is described as widespread.'
        associated_phenotypes:
        - Widespread white matter vacuolation of brain and spinal cord, progressive with age
        - Fluid-filled spaces between central but not peripheral myelin sheaths
        - Blindness
        - Decreased conduction velocity in the central auditory pathway
        - Normal neuronal morphology
        - No lowered seizure threshold in heterozygotes or homozygotes
      selected_evidence:
        snippet: We now show that the white matter of the brain and spinal cord of ClC-2 knock-out mice
          developed widespread vacuolation that progressed with age.
        supports: SUPPORT
