  2c61679beac7992585f624bc753173f328cd5ff9352123113e93b012ca4854e4:
    claim:
      about:
        disease:
          name: CLCN2-Related Leukoencephalopathy
          disease_term:
            preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: NEUROLOGIC
        notes: The disorder is defined by a central white matter lesion and its clinical burden is overwhelmingly
          neurological - ataxia, spasticity, cognitive impairment, headache, seizures. The two extra-neurological
          features are chorioretinal degeneration and male infertility; neither redirects the chapter
          assignment, because the retinal lesion is a degeneration of the pigment epithelium driven by
          the same channel defect rather than an ophthalmological disease in its own right, and the infertility
          is a single-organ consequence of Sertoli-cell channel loss. No cardiac, renal, hepatic, skeletal
          or haematological involvement has been reported. The allelic adrenal disorder (familial hyperaldosteronism
          type II) would be ENDOCRINOLOGIC, but it is a different MONDO entity and is curated elsewhere.
      selected_evidence:
        snippet: CLCN2-related leukoencephalopathy is characterized by nonspecific neurologic findings,
          mild visual impairment from chorioretinopathy or optic atrophy, male infertility, and characteristic
          findings on brain MRI.
        supports: SUPPORT
    origin:
