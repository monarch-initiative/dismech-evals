            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: Prevalence
      assertion:
        population: Japanese population
        measure_type: UNKNOWN
        prevalence_class: UNKNOWN
        notes: A single recurrent allele, c.61dupC (p.Leu21Profs*27), was carried by all four patients
          in the 2025 Japanese series and by all four previously reported Japanese cases, and has not
          been reported outside Japan. Its reported allele frequency in the Japanese population is 0.002152.
          The authors raise the possibility of a relatively high prevalence of the disease in Japan; they
          do not compute one, and neither does this record. A homozygote frequency derived from that allele
          frequency under Hardy-Weinberg would ignore compound heterozygotes, unknown penetrance and the
          ascertainment route (patients were selected on middle cerebellar peduncle signs), so no `rate_per_100000`
          is asserted. This record exists to hold the founder-allele observation, not to state a rate.
      selected_evidence:
        snippet: The allele frequency of c.61dupC in the Japanese population is 0.002152, raising the
          possibility of a relatively high prevalence of CC2L in Japan.
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/1
