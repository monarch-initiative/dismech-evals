            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: ImagingFinding
      assertion:
        name: Restricted Diffusion in the Affected Tracts
        modality: MRI
        description: 'Diffusion restriction in the involved structures is the imaging signature that distinguishes
          intramyelinic oedema from myelin loss: water trapped between myelin lamellae is restricted,
          whereas the free water of a demyelinated tract is not. In adults the restriction is confined
          to the three named structures; in children the cerebral white matter is more diffusely involved.
          Practically, a leukodystrophy with persistent restricted diffusion in the middle cerebellar
          peduncles is a short differential.'
        phenotype_term:
          preferred_term: Abnormal diffusion weighted cerebral MRI morphology
          term:
            id: HP:0032615
            label: Abnormal diffusion weighted cerebral MRI morphology
        spatial_extent: MULTIFOCAL
        diagnostic: true
        notes: 'HPO has no "restricted diffusion" term (OAK search, 2026-08-01, returns only HP:0032615
          in the diffusion branch and it has no descendants), so the specific finding is carried in `preferred_term`
          and description. The `spatial_extent: MULTIFOCAL` reflects the adult pattern of several discrete
          involved tracts; in paediatric patients the same finding is DIFFUSE, which is stated in the
          description rather than modelled as a second record.'
      selected_evidence:
        snippet: In this observational analytical study, we recruited patients with leukoencephalopathies
          characterised by MRI signal abnormalities in the posterior limbs of the internal capsules, midbrain
          cerebral peduncles, and middle cerebellar peduncles from our databases of patients with leukoencephalopathies
          of unknown origin. ... Seven patients met our inclusion criteria, three with adult-onset disease
          and four with childhood-onset disease. We identified homozygous or compound-heterozygous mutations
          in CLCN2 in three adult and three paediatric patients. ... The remaining paediatric patient
          had an X-linked family history and a mutation in GJB1, encoding connexin 32. ... MRI showed
          restricted diffusion suggesting myelin vacuolation that was confined to the specified white
          matter structures in adult patients, and more diffusely involved the brain white matter in paediatric
          patients.
        supports: SUPPORT
    origin:
      assertion_path: /imaging_findings/1
      evidence_path: /imaging_findings/1/evidence/0
      context_paths:
