              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Loss-of-Function CLCN2 Variants
        biological_scale: MOLECULAR
        description: The primary lesion is biallelic damage to CLCN2 at 3q27, encoding the ClC-2 chloride
          channel. The reported allelic spectrum is broad and includes nonsense (p.Trp570*, p.Arg610*,
          p.Arg753*), frameshift (c.61dupC, p.Leu21Profs*27), canonical splice (c.983+2T>A) and missense
          (p.Ala500Val, p.Ala506Val, p.His590Pro) changes. No consistent genotype-phenotype correlation
          has been established across that spectrum - the same class of allele has been reported in a
          subclinical adult and in a child with severe spastic paraplegia - which is why this entry does
          not model severity as an allelic property the way an entry with a defined hypomorph would.
        genes:
        - preferred_term: CLCN2
          term:
            id: hgnc:2020
            label: CLCN2
        genetic_context:
          gene:
            preferred_term: CLCN2
            term:
              id: hgnc:2020
              label: CLCN2
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic CLCN2 alleles (homozygous or compound heterozygous). Recorded as LOSS_OF_FUNCTION
            on the basis of functional expression studies showing loss of ClC-2 channel function.
      selected_evidence:
        snippet: Biallelic loss-of-function variants in CLCN2 lead to CLCN2-related leukoencephalopathy
          (CC2L), also called leukoencephalopathy with ataxia (LKPAT).
        supports: SUPPORT
