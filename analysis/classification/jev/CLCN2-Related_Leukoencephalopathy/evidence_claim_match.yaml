  2393048b3b78138182ff8dfe0ae3b3a2cbd0ab0a041434fddaf902169a6b799d:
    claim:
      about:
        disease:
          name: CLCN2-Related Leukoencephalopathy
          disease_term:
            preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Familial hyperaldosteronism type II
        disease_term:
          preferred_term: familial hyperaldosteronism type II
          term:
            id: MONDO:0011576
            label: familial hyperaldosteronism type II
        description: 'The allelic disorder, and the most important entry in this list even though no clinician
          would ever confuse the two presentations. FH-II is caused by heterozygous GAIN-of-function variants
          in CLCN2 - the same gene, the opposite direction of effect, and a dominant rather than recessive
          dose. The mechanism is tissue-specific in a way that explains why one gene produces two unrelated
          diseases. In adrenal zona glomerulosa cells the chloride equilibrium potential sits depolarized
          relative to rest, so opening ClC-2 depolarizes the cell; the depolarization opens voltage-gated
          calcium channels and induces aldosterone synthase, producing autonomous aldosterone excess.
          In glia the same channel is doing homeostatic work - buffering the chloride, potassium and water
          fluxes of the panglial syncytium - and losing it produces intramyelinic oedema. The knock-in
          mouse carrying a constitutively open ClC-2 develops the adrenal disease; the knockout mouse
          develops the white matter disease. They are not points on one severity spectrum.

          The reason this belongs in a differential list at all is variant interpretation rather than
          clinical differentiation. A laboratory that reports "a CLCN2 variant" has said nothing until
          zygosity and direction of effect are established. dismech curates FH-II in kb/disorders/Familial_Hyperaldosteronism.yaml,
          which models its CLCN2 arm as a gain-of-function adrenal mechanism; that entry was read before
          this one was written and was not modified.'
        distinguishing_features:
        - FH-II is autosomal dominant and caused by heterozygous variants; this disorder requires two
          loss-of-function alleles and heterozygous carriers are unaffected.
        - The FH-II alleles increase ClC-2 open probability at the glomerulosa resting potential (gain
          of function); the LKPAT alleles reduce channel function and plasma membrane expression (loss
          of function).
        - FH-II presents as early-onset primary aldosteronism with hypertension, suppressed renin and
          variable hypokalaemia; no white matter, retinal or testicular involvement has been reported
          in it.
        - This disorder presents with a leukoencephalopathy on MRI, cerebellar ataxia, chorioretinopathy
          and male infertility; hyperaldosteronism has not been reported in it.
        - The recurrent FH-II allele p.Arg172Gln has been seen four times independently, one of those
          occurrences de novo (a second, different FH-II allele, p.Met22Lys, was also de novo); the LKPAT
          alleles are private or population-specific (c.61dupC in Japan) and are transmitted, not de novo.
        - 'The two mouse models differ accordingly: the constitutively open Clcn2op knock-in reproduces
          primary aldosteronism, while the Clcn2 knockout reproduces white matter vacuolation.'
        notes: MONDO:0011576 was verified with OAK (`runoak -i sqlite:obo:mondo relationships -p RO:0004003
          --direction down HGNC:2020`), which returns it, MONDO:0014292 and MONDO:0011875 as the only
          three CLCN2 disease terms; its xref is OMIM:605635. It is the same term already bound as the
          FH-II subtype in kb/disorders/Familial_Hyperaldosteronism.yaml.
      selected_evidence:
        snippet: Mutations that cause the loss of ClC-2 function lead to retinal and testicular degeneration
          and leukodystrophy, whereas gain-of-function mutations cause hyperaldosteronism.
        supports: SUPPORT
