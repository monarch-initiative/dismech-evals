  a346689e50e1413a505813483f39e022fdac2ed67fa57362995e409db15c00c7:
    claim:
      about:
        disease:
          name: CLCN2-Related Leukoencephalopathy
          disease_term:
            preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Charcot-Marie-Tooth disease X-linked dominant 1
        disease_term:
          preferred_term: Charcot-Marie-Tooth disease X-linked dominant 1
          term:
            id: MONDO:0010549
            label: Charcot-Marie-Tooth disease X-linked dominant 1
        description: 'The empirically demonstrated radiological mimic. When the founding study recruited
          seven patients on the basis of the CLCN2 imaging pattern, six turned out to have CLCN2 variants
          and the seventh had an X-linked family history and a mutation in GJB1, encoding connexin 32
          - that is, CMTX1. GJB1 is a gap-junction protein of myelinating glia, so the convergence is
          not accidental: a lesion of glial coupling produces the same intramyelinic fluid signature.
          Any patient whose MRI suggests CLCN2 and whose sequencing is negative should be assessed for
          GJB1, and the pedigree is the first discriminator.'
        distinguishing_features:
        - CMTX1 is X-linked with male predominance and no male-to-male transmission; CLCN2-related leukoencephalopathy
          is autosomal recessive and affects both sexes equally.
        - CMTX1's core phenotype is a peripheral neuropathy with distal weakness, wasting and areflexia;
          the CLCN2 mouse shows that its intramyelinic lesion spares the peripheral nervous system, and
          peripheral neuropathy is not a feature of the human disorder.
        - The CNS white matter changes in CMTX1 are classically transient and episodic, often provoked;
          the CLCN2 abnormality is persistent.
        - Chorioretinopathy and male infertility point to CLCN2 and have no counterpart in CMTX1.
        notes: MONDO:0010549 was verified with OAK, including its gene (`runoak relationships -p RO:0004003
          MONDO:0010549` returns HGNC:4283 GJB1), confirming that the "GJB1, encoding connexin 32" of
          the founding study maps to this MONDO term. CMTX1 is curated in dismech as the CMTX1 record
          in kb/disorders/Charcot-Marie-Tooth_Disease_Type_X.yaml (`has_subtypes#CMTX1`), where MONDO:0010549
          is bound as the subtype term; that record carries the connexin-32 reflexive gap-junction mechanism
          this differential turns on.
      selected_evidence:
        snippet: Fluid-filled spaces appeared between myelin sheaths of the central but not the peripheral
          nervous system.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17567819
      reference_title: Leukoencephalopathy upon disruption of the chloride channel ClC-2.
      evidence_source: MODEL_ORGANISM
      explanation: Supports the peripheral-nervous-system distinguishing feature - the CLCN2 lesion is
        CNS-restricted, whereas CMTX1 is fundamentally a peripheral neuropathy.
