  fcb32f7c999f8955f4cbad4c98f1cf0d9e68f2307efadfb33a5efe62e734694b:
    claim:
      about:
        disease:
          name: CLCN2-Related Leukoencephalopathy
          disease_term:
            preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: Cell-type-specific Clcn2 deletion (retinal pigment epithelium, Sertoli cells, astrocytes,
          oligodendrocytes)
        category: Conditional knockout
        description: 'The conditional series is the most informative model work on this disorder because
          it converts a multi-organ phenotype into cell-type attributions. Deleting ClC-2 from retinal
          pigment epithelial cells produces the retinal degeneration and deleting it from Sertoli cells
          produces the testicular degeneration, so each extra-neurological arm has a single responsible
          cell type. The white matter arm behaves differently: leukodystrophy was fully developed only
          when ClC-2 was disrupted in both astrocytes and oligodendrocytes. That is a statement about
          a coupled network rather than a cell, and it is the strongest available evidence for the panglial
          framing used throughout this entry.

          The same study carries a negative result that constrains how the GlialCAM-MLC1-ClC-2 complex
          should be read. Crossing Glialcam-null mice to a knock-in mimicking GlialCAM-induced opening
          of ClC-2 did not rescue their leukodystrophy, leading the authors to conclude that GlialCAM-induced
          changes in ClC-2''s biophysical properties are irrelevant for GLIALCAM-related leukodystrophy.
          That result concerns MLC pathogenesis, not this disorder, but it is the reason this entry does
          not claim that the three diseases share one mechanism outright.'
        associated_phenotypes:
        - Retinal degeneration on RPE-specific deletion
        - Testicular degeneration on Sertoli-cell-specific deletion
        - Full leukodystrophy only on combined astrocyte and oligodendrocyte deletion
      selected_evidence:
        snippet: We now used cell type-specific deletion of ClC-2 in mice to show that retinal and testicular
          degeneration depend on a loss of ClC-2 in retinal pigment epithelial cells and Sertoli cells,
          respectively, whereas leukodystrophy was fully developed only when ClC-2 was disrupted in both
          astrocytes and oligodendrocytes.
        supports: SUPPORT
