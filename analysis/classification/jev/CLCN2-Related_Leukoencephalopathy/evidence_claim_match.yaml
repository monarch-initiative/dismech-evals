            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'Two damaging CLCN2 alleles are required. Every molecularly solved patient reported
          has been homozygous or compound heterozygous, and heterozygous parents and relatives are not
          described as affected. The mouse data agree and are unusually explicit on this point: heterozygous
          loss of ClC-2 had no detectable functional or morphological consequence in the knockout line.

          Penetrance is recorded as UNKNOWN rather than complete, and the reason is specific rather than
          a generic hedge. Two published biallelic individuals were essentially asymptomatic at ascertainment
          - one man found through infertility with only subclinical leukodystrophy, and one homozygote
          for p.His590Pro reported as a subclinical form of LKPAT - while other biallelic individuals
          have severe spastic paraplegia and developmental delay. Because both series that define the
          disorder recruited on the MRI pattern, the denominator of biallelic carriers who never come
          to medical attention is unmeasured. A carrier frequency for the recurrent Japanese allele c.61dupC
          is known (allele frequency 0.002152) but the corresponding number of affected homozygotes has
          not been ascertained, so no penetrance estimate can be derived from it and none is asserted
          here.'
        penetrance: UNKNOWN
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: CLCN2-related leukoencephalopathy is inherited in an autosomal recessive manner.
        supports: SUPPORT
