        name: Evaluation and surveillance of at-risk relatives
        description: 'Clarifying the genetic status of older and younger sibs of a proband is recommended
          so that those who would benefit from early diagnosis and routine surveillance for motor, cognitive,
          visual and hearing impairment can be identified. The rationale is stronger here than for most
          leukodystrophies precisely because the disorder can be subclinical: a sib identified genetically
          may have imaging abnormalities and no symptoms.'
        treatment_term:
          preferred_term: evaluation of relatives at risk
          term:
            id: NCIT:C92803
            label: Genetic Screening
        notes: 'The recommended action is clarification of the genetic status of sibs, so the binding
          is to NCIT:C92803 (Genetic Screening, "Testing to determine if there is a predisposition or
          indication of a possible genetic or a chromosomal abnormality") rather than to the generic NCIT:C15747
          (Supportive Care) used by treatments[0]. Verified with OAK on 2026-08-01: NCIT:C92803 is_a NCIT:C15709
          (Genetic Testing) and its ancestors include both NCIT:C15419 (Disease Screening) and the NCIT:C25218
          root the TreatmentTerm enum requires, so it is the more specific valid term. The sibling NCIT:C62694
          (Mutation Carrier Screening) was considered and rejected: sibs here are at 25% risk of being
          affected, and the stated purpose is early diagnosis and surveillance, not carrier ascertainment.'
      selected_evidence:
        snippet: It is appropriate to clarify the genetic status of older and younger sibs of a proband
