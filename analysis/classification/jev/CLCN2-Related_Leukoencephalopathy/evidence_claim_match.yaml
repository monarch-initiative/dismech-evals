          dominant gain-of-function disease. In familial hyperaldosteronism type II, heterozygous CLCN2
          variants (recurrently p.Arg172Gln) increase the channel''s open probability at the adrenal glomerulosa
          resting potential; the resulting chloride efflux depolarizes the cell, opens voltage-gated calcium
          channels and induces aldosterone synthase. That is the opposite manipulation of the same gate
          that the ball-and-chain N-terminal hairpin controls. Three consequences follow for variant interpretation.
          A heterozygous CLCN2 missense variant in a hypertensive patient and a biallelic CLCN2 genotype
          in a patient with middle-cerebellar-peduncle signal change are not the same finding and are
          not on the same allelic series. Loss-of-function alleles are not expected to cause hyperaldosteronism,
          and none has been reported to. And carriers of a single loss-of-function allele are unaffected,
          which is why the recessive disease and the dominant one differ in dose as well as in direction.'
