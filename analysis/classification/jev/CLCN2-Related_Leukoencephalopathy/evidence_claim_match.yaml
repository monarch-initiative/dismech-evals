      assertion:
        name: Genetic counseling
        description: 'Counselling follows the standard autosomal recessive arithmetic: with two heterozygous
          parents, each sib has a 25% chance of being affected, a 50% chance of being an asymptomatic
          carrier and a 25% chance of being unaffected and not a carrier. Carrier testing, prenatal testing
          and preimplantation genetic testing are possible once the familial variants are known. Two disease-specific
          caveats belong in the conversation. Penetrance and expressivity are not established - biallelic
          individuals have been reported who were subclinical - so a prenatal genotype cannot be translated
          into a predicted severity. And male fertility should be discussed without being presented as
          uniformly lost.'
        treatment_term:
          preferred_term: genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
