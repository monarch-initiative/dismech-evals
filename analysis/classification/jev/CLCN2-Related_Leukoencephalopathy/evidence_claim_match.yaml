        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Glial Chloride and Extracellular Ion Homeostasis
        biological_scale: CELLULAR
        description: 'With the dominant resting chloride conductance of the glial network removed, the
          syncytium can no longer buffer the ion and water fluxes that accompany neuronal activity. The
          founding study framed the disorder in exactly these terms - it belongs to an emerging group
          of disorders affecting brain ion and water homoeostasis - and the mouse work reaches the same
          conclusion from the other direction, attributing the pathology of Clcn2 disruption to disturbed
          extracellular ion homeostasis. Chloride is the primary carrier, but the consequence is not chloride-specific:
          glial potassium clearance during high neuronal activity requires an accompanying anion flux,
          and water follows osmotically, so a chloride conductance defect presents as a volume and water
          problem. The channel''s own modulation by cell swelling closes that loop, making ClC-2 both
          an effector and a sensor of glial volume.'
        biological_processes:
        - preferred_term: chloride transmembrane transport
          modifier: DECREASED
          term:
            id: GO:1902476
            label: chloride transmembrane transport
        - preferred_term: chloride ion homeostasis
          modifier: DYSREGULATED
          term:
            id: GO:0055064
            label: chloride ion homeostasis
        - preferred_term: potassium ion homeostasis
          modifier: DYSREGULATED
          term:
            id: GO:0055075
            label: potassium ion homeostasis
        - preferred_term: cell volume homeostasis
          modifier: DYSREGULATED
          term:
            id: GO:0006884
            label: cell volume homeostasis
        - preferred_term: multicellular organismal-level water homeostasis
          modifier: DYSREGULATED
          term:
            id: GO:0050891
            label: multicellular organismal-level water homeostasis
        chemical_entities:
        - preferred_term: chloride
          term:
            id: CHEBI:17996
            label: chloride
        - preferred_term: potassium(1+)
          term:
            id: CHEBI:29103
            label: potassium(1+)
        - preferred_term: water
          term:
            id: CHEBI:15377
            label: water
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        notes: The potassium and water bindings are the weakest links in this node and are marked DYSREGULATED
          rather than given a direction for that reason. The cited sources assert disturbed ion and water
          homeostasis at the level of the tissue; no source quoted here measures extracellular potassium
          or water content in a CLCN2 patient or in a Clcn2-null mouse. The mechanistic coupling from
          a chloride conductance to potassium clearance and osmotic water movement is textbook glial physiology
          rather than a finding specific to this disease, and it is stated here as the reasoning that
