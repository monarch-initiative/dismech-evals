  76d4d9f3f4e75865fcd2f608b0fd9d1b153f7d93d90b2374855818be9b59ff6a:
    claim:
      about:
        disease:
          name: CLCN2-Related Leukoencephalopathy
          disease_term:
            preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Conduction in Affected White Matter Tracts
        biological_scale: TISSUE
        description: 'Fluid between myelin lamellae degrades saltatory conduction without destroying the
          axon. The direct measurement comes from the mouse, where despite widespread vacuolation the
          neurological deficits were mild and included a decreased conduction velocity in neurons of the
          central auditory pathway. That single observation is the mechanistic bridge from the imaging
          lesion to the clinical picture, and it also explains the shape of the clinical picture: slowed
          conduction in the affected tracts, not axonal loss, which is why the deficits are mild, why
          they are dominated by the tracts that happen to be involved, and why hearing loss and tinnitus
          appear in a disorder that does not otherwise look otological. Human tractography in one patient
          found reduced fibre number and increased radial diffusivity with unchanged axial diffusivity
          - the profile expected from a myelin-water lesion sparing axons.'
        locations:
        - preferred_term: middle cerebellar peduncle
          term:
            id: UBERON:0002152
            label: middle cerebellar peduncle
        - preferred_term: posterior limb of the internal capsule
          term:
            id: UBERON:0014527
            label: posterior limb of internal capsule
      selected_evidence:
        snippet: Diffusion tensor tractography (DTT) showed obviously thinner tracts of interest than
          in the controls, with a decreased fiber number (FN), increased radial diffusivity (RD) and unchanged
          axial diffusivity (AD).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31291907
      reference_title: 'CLCN2-related leukoencephalopathy: a case report and review of the literature.'
      evidence_source: HUMAN_CLINICAL
      explanation: Human in vivo microstructural correlate. Increased radial with unchanged axial diffusivity
        is the signature of a myelin-compartment lesion that spares the axon, which is what this node
        claims. It is a single patient.
