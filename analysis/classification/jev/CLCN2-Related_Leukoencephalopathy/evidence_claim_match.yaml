  966bae7d9b320c43e2e8063e1e28fdd00a528a293e8eba22e36395fd53d9bed8:
    claim:
      about:
        disease:
          name: CLCN2-Related Leukoencephalopathy
          disease_term:
            preferred_term: leukoencephalopathy with mild cerebellar ataxia and white matter edema
            term:
              id: MONDO:0014292
              label: leukoencephalopathy with mild cerebellar ataxia and white matter edema
        context: []
      assertion_type: Genetic
      assertion:
        name: CLCN2
        association: Biallelic loss-of-function variants are causal for CLCN2-related leukoencephalopathy.
          Heterozygous GAIN-of-function variants in the same gene cause a different, dominant disease
          (familial hyperaldosteronism type II); direction of effect, not merely the gene, determines
          the phenotype.
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: CLCN2
          term:
            id: hgnc:2020
            label: CLCN2
        notes: 'Gene record, verified with OAK on 2026-08-01. hgnc:2020, symbol CLCN2, name "chloride
          voltage-gated channel 2", MIM 600570, UniProt P51788, aliases CLC2, ClC-2 and EJM6. The EJM6
          alias is a fossil of the retracted juvenile-myoclonic-epilepsy association discussed in the
          entry `notes`.

          Allelic spectrum reported for this disorder. Truncating: c.1709G>A p.Trp570*, c.1828C>T p.Arg610*,
          c.61dupC p.Leu21Profs*27 (the allele carried by every reported Japanese patient) and c.2257C>T
          p.Arg753*. Splice: c.983+2T>A (novel in the 2025 Japanese series). Missense: p.Ala500Val (the
          allele dissected functionally), p.Ala506Val (reported in 2026 in a Chinese man) and p.His590Pro
          (subclinical). Patient ancestry is not stated in the cached text for the other alleles and is
          therefore not asserted. All are biallelic in the affected individuals. The list is not exhaustive
          - the 2024 series added three novel likely pathogenic missense variants that the abstract does
          not name.

          No genotype-phenotype correlation is asserted. The 2026 review states plainly that the prevalence
          and genotype-phenotype correlations of LKPAT remain unclear, and the published cases bear that
          out: a homozygous nonsense allele (p.Arg753*) was found in a woman with a mild adult-onset syndrome,
          while the severe spastic paraplegia and developmental delay of the 2024 series were not attributed
          to a distinct allele class. Anyone reading a CLCN2 report should not infer severity from allele
          type.

          Founder allele. c.61dupC (p.Leu21Profs*27) was present in all four patients of the 2025 Japanese
          series and in all four previously reported Japanese cases, and has not been reported outside
          Japan. Its Japanese allele frequency is 0.002152. That is an allele frequency, not a carrier
          frequency and not a disease prevalence; no derived rate is recorded anywhere in this entry.

          Direction-of-effect contrast, the point most likely to be got wrong. The same gene carries a
          dominant gain-of-function disease. In familial hyperaldosteronism type II, heterozygous CLCN2
          variants (recurrently p.Arg172Gln) increase the channel''s open probability at the adrenal glomerulosa
          resting potential; the resulting chloride efflux depolarizes the cell, opens voltage-gated calcium
          channels and induces aldosterone synthase. That is the opposite manipulation of the same gate
          that the ball-and-chain N-terminal hairpin controls. Three consequences follow for variant interpretation.
          A heterozygous CLCN2 missense variant in a hypertensive patient and a biallelic CLCN2 genotype
          in a patient with middle-cerebellar-peduncle signal change are not the same finding and are
          not on the same allelic series. Loss-of-function alleles are not expected to cause hyperaldosteronism,
          and none has been reported to. And carriers of a single loss-of-function allele are unaffected,
          which is why the recessive disease and the dominant one differ in dose as well as in direction.'
      selected_evidence:
        snippet: The prevalence and genotype-phenotype correlations of LKPAT remain unclear, as do the
          pathogenic mechanisms of CLCN2 variants.
        supports: SUPPORT
