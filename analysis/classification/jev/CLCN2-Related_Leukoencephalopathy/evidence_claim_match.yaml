      assertion_type: AnimalModel
      assertion:
        species: Mus musculus
        genotype: Clcn2 nmf240 (ENU-induced early stop, homozygous)
        category: Chemically induced loss-of-function allele
        description: 'An independent, chemically induced Clcn2 allele found in an ENU mutagenesis screen
          for abnormal retinal fundi, carrying a nucleotide 1063 C-to-T change that converts a glutamine
          to a stop codon. Its value is that it arose without targeting and nonetheless reproduces the
          same triad - photoreceptor degeneration, leukoencephalopathy in multiple brain areas and male
          sterility - which the authors themselves note closely resembles the knockout. That convergence
          from a different mutational origin is what makes the mouse phenotype attributable to Clcn2 rather
          than to a targeting artefact.

          The line also contributes the temporal ordering within the retinal arm: photoreceptor loss at
          14 days is preceded by elongation of the retinal pigment epithelium apical microvilli, placing
          the epithelium upstream of the sensory cells. A heterozygous finding is reported - a reduced
          electroretinogram light peak with normal retinal histology - which has no established human
          counterpart, since human heterozygotes are not described as affected; it is recorded here as
          a model observation, not as a subclinical human carrier phenotype.'
        associated_phenotypes:
        - Severe photoreceptor loss at 14 days of age
        - Elongation of RPE apical microvilli preceding photoreceptor loss
        - Leukoencephalopathy in multiple brain areas
        - Male sterility
        - Reduced ERG light peak in heterozygotes despite normal retinal histology
      selected_evidence:
        snippet: The nmf240 phenotype closely resembles that reported for Clcn2 knockout mice.
        supports: SUPPORT
