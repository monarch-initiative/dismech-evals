              label: CLOVES syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PIK3CA Somatic Mutations
        association: Causative
        gene_term:
          preferred_term: PIK3CA
          term:
            id: hgnc:8975
            label: PIK3CA
        notes: 'Somatic activating mutations in PIK3CA (encoding the p110alpha catalytic subunit of PI3K)
          are found in affected tissues. Common hotspot mutations include E542K, E545K, H1047R, H1047L,
          and C420R. The mutations are mosaic and often detectable only in affected tissue rather than
          blood. The specific mutation and its tissue distribution determine the clinical phenotype and
          severity.

          '
      selected_evidence:
        snippet: We identified mutations in PIK3CA in all six individuals, and mutant allele frequencies
          ranged from 3% to 30% in affected tissue from multiple embryonic lineages. Interestingly, these
          same mutations have been identified in cancer cells, in which they increase phosphoinositide-3-kinase
          activity. We conclude that CLOVES is caused by postzygotic activating mutations in PIK3CA.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
