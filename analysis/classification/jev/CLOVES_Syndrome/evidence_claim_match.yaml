        context: []
      assertion_type: Inheritance
      assertion:
        name: Somatic Mosaicism
        description: 'CLOVES syndrome is caused by post-zygotic somatic activating mutations in PIK3CA.
          The mutations arise de novo during embryonic development and are present in a mosaic pattern.
          The condition is not inherited in a traditional Mendelian fashion and recurrence risk for unaffected
          parents is negligible.

          '
      selected_evidence:
        snippet: We hypothesized that CLOVES syndrome would be caused by a somatic mutation arising during
          early embryonic development. Therefore, we employed massively parallel sequencing to search
          for somatic mosaic mutations in fresh, frozen, or fixed archival tissue from six affected individuals.
          We identified mutations in PIK3CA in all six individuals, and mutant allele frequencies ranged
          from 3% to 30% in affected tissue from multiple embryonic lineages.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22658544
