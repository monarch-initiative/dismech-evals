          term:
            id: GO:0001946
            label: lymphangiogenesis
      selected_evidence:
        snippet: These mutations are responsible for the clinical manifestations of the syndrome, which
          include low- and high-flow vascular malformations, thoracic lipomatous hyperplasia, asymmetric
          growth, and visceral and neurological disorders.
        supports: SUPPORT
