            id: hgnc:8975
            label: PIK3CA
        molecular_functions:
        - preferred_term: phosphatidylinositol 3-kinase activity
          term:
            id: GO:0046934
            label: 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity
        biological_processes:
        - preferred_term: PI3K Signaling
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
      selected_evidence:
        snippet: These conditions are caused by somatic gain-of-function mutations in PIK3CA, which encodes
          the 110-kD catalytic alpha subunit of PI3K (p110alpha). These PIK3CA mutations occur as post-zygotic
          events and lead to a gain of function of PI3K, with consequent constitutional activation of
          the downstream cascades (e.g., AKT/mTOR pathway), involved in cellular proliferation, survival
          and growth, as well as in vascular development in the embryonic stage.
        supports: SUPPORT
