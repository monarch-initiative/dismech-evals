      assertion_type: Discussion
      assertion:
        discussion_id: cnga1_cgmp_death_intermediates
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which intermediates link CNGA1 channel loss and cGMP accumulation to rod death?
        attaches_to:
        - pathophysiology#Rod cGMP Accumulation
        - pathophysiology#Progressive Rod Photoreceptor Degeneration
        rationale: In CNGA1-deficient mice, cGMP accumulates, microglia activate, oxidative damage appears
          and chaperone-mediated autophagy coincides with rod death, and gene augmentation reverses cGMP
          accumulation while preserving rods. None of these studies isolates which event is causal for
          death. A null channel removes the cGMP-gated calcium influx, so the route from cGMP accumulation
          to death may differ from degenerations in which the open channel overloads the rod with calcium.
      selected_evidence:
        snippet: In addition, the down-regulated PI3K-AKT-mTOR pathway indicated upregulation of autophagic
          process, and chaperone-mediated autophagy was further shown to coincide with the time course
          of photoreceptor death.
        supports: SUPPORT
        directness: DIRECT
