              id: MONDO:0800405
              label: CNGA1-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Rod CNG Channel Membrane Expression
        description: The native rod channel is a 3:1 CNGA1:CNGB1 heterotetramer in the outer-segment plasma
          membrane. Mutant CNGA1 proteins expressed in vitro are retained inside the cell or reach the
          membrane at reduced levels, and one C-terminal frameshift abolishes surface expression only
          when coexpressed with CNGB1. In a Cnga1 point-mutant mouse, CNGA1 protein is lost and the CNGB1
          partner protein is also undetectable despite normal transcript levels, so the outer segment
          lacks the channel complex.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        cellular_components:
        - preferred_term: photoreceptor outer segment
          term:
            id: GO:0001750
            label: photoreceptor outer segment
        molecular_functions:
        - preferred_term: cGMP-gated cation channel activity
          term:
            id: GO:0005223
            label: intracellularly cGMP-activated cation channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: As native retinal rod CNG channels comprise CNGA1 and CNGB1 subunits, we coexpressed
          CNGA1-RP and CNGB1. Surprisingly, this subunit combination did not produce detectable channels
          at the membrane surface.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11970862
      reference_title: An intersubunit interaction regulates trafficking of rod cyclic nucleotide-gated
        channels and is disrupted in an inherited form of blindness.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: In Xenopus oocytes the disease-associated CNGA1 truncation forms normal homomers but
        prevents surface expression of the native-type heteromer with CNGB1.
