      assertion_type: Pathophysiology
      assertion:
        name: Biallelic CNGA1 Loss of Function
        description: Biallelic pathogenic CNGA1 variants remove or disable the alpha subunit of the rod
          cGMP-gated channel. Early nonsense and frameshift alleles and whole-gene deletion are expected
          to encode no functional channel; missense and distal frameshift alleles that have been expressed
          in vitro reduce membrane targeting, abundance or channel function. Not every reported missense
          variant is pathogenic, and functional testing has reclassified many variants of uncertain significance.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        role: trigger
        gene:
          preferred_term: CNGA1
          term:
            id: hgnc:2148
            label: CNGA1
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: CNGA1
            term:
              id: hgnc:2148
              label: CNGA1
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic germline CNGA1 variants, homozygous or compound heterozygous; most are
            truncating, with a smaller set of missense alleles shown to impair channel expression or function.
        conforms_to: phototransduction_cascade_dysfunction#Phototransduction Cascade Component Defect
        molecular_functions:
        - preferred_term: cGMP-gated cation channel activity
          term:
            id: GO:0005223
            label: intracellularly cGMP-activated cation channel activity
          modifier: DECREASED
      selected_evidence:
        snippet: Two of these were nonsense mutations early in the reading frame (Glu76End and Lys139End)
          and one was a deletion encompassing most if not all of the transcriptional unit; these three
          alleles would not be expected to encode a functional channel.
        supports: SUPPORT
        directness: DIRECT
