        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Causative
        features: Reported causal alleles are mostly frameshift and nonsense variants, plus a whole-gene
          deletion and missense variants. In East Asian cohorts a single recurrent frameshift accounts
          for most alleles (72% of patient alleles in a Chinese cohort, 69% in a Chinese and Korean cohort);
          the Chinese study found a more severe phenotype in homozygotes, while the East Asian study found
          no significant genotype-phenotype association. A functional screen of 86 missense variants classified
          most as functionally abnormal and allowed reclassification of many variants of uncertain significance.
        case_fractions:
        - population: Japanese patients with autosomal recessive or sporadic retinitis pigmentosa
          case_fraction_percent: 5.1
          cohort_size: 99
          notes: Five of 99 unrelated patients carried biallelic CNGA1 frameshift variants.
        - population: Autosomal recessive retinitis pigmentosa patients screened in the gene-discovery
            study
          case_fraction_low: 1.7
          case_fraction_high: 2.3
          cohort_size: 173
          notes: Three or four of 173 unrelated arRP patients, as restated by a later study; the original
            paper described CNGA1 as an uncommon cause of RP.
        inheritance:
        - name: Autosomal recessive
      selected_evidence:
        snippet: Five mutant sequences cosegregated with disease among four unrelated families with autosomal
          recessive RP.
        supports: SUPPORT
        directness: DIRECT
