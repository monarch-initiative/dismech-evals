        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why do Cnga1-deficient mice lose photoreceptors within months while patients keep central
          acuity for decades, and which model predicts response to treatment at a human-relevant stage?
        attaches_to:
        - animal_models#Cnga1 knockout mouse (CRISPR/Cas9)
        - treatments#AAV-Mediated CNGA1 Gene Augmentation Therapy
        rationale: The CRISPR knockout loses most photoreceptors by 6 months and was treated at postnatal
          day 14, before major rod loss, whereas the Y509C mouse degenerates more slowly for unknown reasons.
          Patients present after years of rod loss but with preserved foveal photoreceptors. Rescue after
          treatment at a later stage has not been tested in a CNGA1 model.
      selected_evidence:
        snippet: In the current study, we treated Cnga1-/- mice at an early stage of the disease to assess
          the maximal potential of gene augmentation therapy; however, patients with RP are often diagnosed
          at a later stage of the disease.
        supports: SUPPORT
        directness: DIRECT
