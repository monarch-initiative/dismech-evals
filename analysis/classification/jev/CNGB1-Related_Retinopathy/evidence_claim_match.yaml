            label: CNGB1
        association: Causative
        features: '84 known disease-causing CNGB1 variants have been reported, spanning the entire gene
          with no known mutational hotspot: 24 missense, 21 nonsense, 19 splicing defects, 10 small deletions,
          1 small insertion, 1 small insertion-deletion, 7 small duplications, and 1 gross deletion. Variants
          are distributed across both the GARP (glutamic acid-rich protein) and channel domains, and no
          genotype-phenotype correlation has been established to date despite the large number of reported
          alleles.'
        case_fractions:
        - population: Autosomal recessive retinitis pigmentosa cohorts
          case_fraction_percent: 4.0
          notes: Consistently reported across independent cohorts as accounting for approximately 4% of
            autosomal recessive RP.
        inheritance:
        - name: Autosomal recessive
      selected_evidence:
        snippet: Here, we investigated the splicing of c.3444+1G>A by exon trapping experiments and could
          demonstrate that instead of the proposed truncation of the last 28 aa this mutation leads to
          replacement of the last 170 aa of CNGB1a by 68 unrelated amino acids.
        supports: SUPPORT
