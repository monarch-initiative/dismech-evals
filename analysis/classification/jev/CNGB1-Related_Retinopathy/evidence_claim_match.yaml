      assertion_type: Pathophysiology
      assertion:
        name: Loss of Rod CNG Channel Function and cGMP Dysregulation
        conforms_to: phototransduction_cascade_dysfunction#Loss of Outer-Segment cGMP and Calcium Set-Point
          Control
        biological_scale: CELLULAR
        description: 'With essentially no functional heterotetrameric CNG channel present at the outer
          segment, rods cannot generate a light response: the channel cannot open in response to cGMP
          regardless of light exposure. This produces both a functional silencing of rod phototransduction
          and an abnormal accumulation of cGMP within the rod outer segment, directly demonstrated by
          immunolabeling in CNGB1-deficient dog retina and shown to be reversible by restoring channel
          expression via gene therapy.'
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        biological_processes:
        - preferred_term: Phototransduction
          term:
            id: GO:0007602
            label: phototransduction
          modifier: DECREASED
      selected_evidence:
        snippet: the vast majority of isolated rod photoreceptors in mice lacking CNGB1 (CNGB1-/-) failed
          to respond to light. In electroretinograms (ERGs), CNGB1-/- mice showed no rod-mediated responses.
        supports: SUPPORT
