        context: []
      assertion_type: AnimalModel
      assertion:
        name: Conditional Cngb1 rescue mouse
        species: Mouse
        genotype: Cngb1neo/neo; UBC-cre/ERT2 (loxP-flanked neomycin cassette in intron 19)
        publication: PMID:38086857
        description: Tamoxifen-inducible restoration of endogenous Cngb1 used to isolate the effect of
          disease stage on rescue; distinct from X26 knockout and viral augmentation.
        modeled_mechanisms:
        - target: Impaired Retinal Ganglion Cell Signaling
          description: Tamoxifen activates Cre-mediated removal of the blocking cassette to restore endogenous
            Cngb1 at one, two or three months. Earlier rescue restores output closer to wild type; late
            rescue retains lower gain and greater variability.
          relationship: RESCUES
          model_scale: CELLULAR
          limitations: Conditional endogenous restoration is an artificial best-case experiment, not AAV
            delivery. Approximate 25%, 50% and 70% rod-loss groups are model-specific and are not human
            eligibility thresholds.
          fidelity: MODERATE
          readouts:
          - name: Ganglion-cell spike-response variability and information rate
            target: Impaired Retinal Ganglion Cell Signaling
            interpretation: Late rescue improves signaling above untreated levels but fails to normalize
              fidelity.
        - target: Reactive Retinal Gliosis
          description: GFAP labeling persists after late rescue.
          relationship: PARTIALLY_RECAPITULATES
          model_scale: CELLULAR
          limitations: Qualitative GFAP staining; no quantitative causal test of inflammation.
          fidelity: MODERATE
        - target: Photoreceptor Synaptic Ribbon Loss
          description: Late rescue leaves fewer intact CtBP2-labeled ribbon structures.
          relationship: PARTIALLY_RECAPITULATES
          model_scale: CELLULAR
          limitations: Anatomical association with advanced degeneration; not a selective synapse-restoration
            experiment.
          fidelity: MODERATE
      selected_evidence:
        snippet: By delivering tamoxifen, activated cre removes the neomycin insert to enable endogenous
          CNGB1 expression across all rods
        supports: SUPPORT
        directness: DIRECT
