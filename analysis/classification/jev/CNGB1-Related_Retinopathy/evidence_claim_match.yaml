        name: Rod Photoreceptor Apoptosis and Progressive Degeneration
        conforms_to: phototransduction_cascade_dysfunction#cGMP and Calcium Overload Handoff to Photoreceptor
          Degeneration
        biological_scale: CELLULAR
        description: Unlike the stationary phenotype seen with some phototransduction-cascade lesions,
          chronic loss of CNG channel function in CNGB1-deficient rods hands off to a slowly progressive
          photoreceptor cell-death programme. Rods undergo apoptotic death accompanied by retinal gliosis;
          this is notably slower than in many other RP mouse models, producing the characteristic dissociation
          between early functional loss and late structural loss that defines the clinical course.
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        biological_processes:
        - preferred_term: Neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: The rods also showed a slow-progressing degeneration caused by apoptotic death and concurred
          by retinal gliosis.
        supports: SUPPORT
