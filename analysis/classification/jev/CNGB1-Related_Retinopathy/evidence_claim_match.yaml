        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Which structural and functional features identify a rescuable human CNGB1 retina?
        attaches_to:
        - animal_models#Conditional Cngb1 rescue mouse
        - treatments#AAV-Mediated CNGB1 Gene Augmentation Therapy
        rationale: Conditional endogenous rescue bypasses vector transduction and expression variability.
          Late-treated mice retain some benefit but do not regain normal retinal output, and mice lack
          a macula. Human OCT preservation alone therefore does not establish an intervention window or
          justify transferring model-specific rod-loss thresholds into eligibility criteria.
      selected_evidence:
        snippet: Mouse retina lacks a cone-dense region and is (at best) more analogous to human peripheral
          retina
        supports: SUPPORT
        directness: DIRECT
