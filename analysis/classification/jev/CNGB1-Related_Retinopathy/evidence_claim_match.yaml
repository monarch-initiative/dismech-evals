      assertion_type: AnimalModel
      assertion:
        name: Cngb1-X26 knockout mouse
        species: Mouse
        genotype: Cngb1-/- (exon 26 deletion; Cngb1-X26)
        publication: PMID:15634774
        modeled_mechanisms:
        - target: Impaired Rod Light Responses
          description: The X26 knockout has absent rod-mediated ERGs and predominantly unresponsive isolated
            rods.
          relationship: PARTIALLY_RECAPITULATES
          model_scale: CELLULAR
          limitations: Mice lack a macula; the knockout is not representative of every missense or GARP-region
            allele.
          fidelity: MODERATE
          readouts:
          - name: Rod-mediated ERG
            target: Impaired Rod Light Responses
            direction: DECREASED
            interpretation: Rod-system functional impairment, not a direct assay of apoptosis.
        - target: Progressive Rod Photoreceptor Loss
          description: Progressive apoptotic rod loss occurs in the X26 mouse.
          relationship: PARTIALLY_RECAPITULATES
          model_scale: CELLULAR
          limitations: Mouse histology establishes apoptosis in this model; human structural imaging does
            not establish a shared death-effector pathway.
          fidelity: MODERATE
        - target: Impaired Rod Light Responses
          relationship: RESCUES
          fidelity: MODERATE
          description: Subretinal AAV8-mediated delivery of CNGB1a to Cngb1-/- mice restores full-length
            CNGB1a expression, rescues degraded CNGA1 to normal levels, and reconstitutes functional CNG
            channel complexes in rod outer segments.
          readouts:
          - name: Scotopic ERG rod-driven light response
            target: Impaired Rod Light Responses
            direction: RESTORED
            interpretation: Restoration of rod-driven ERG light responses after gene therapy confirms
              reconstitution of a functional rod CNG channel.
          model_scale: CELLULAR
          limitations: AAV rescue in mice; treatment at two weeks and rodent retinal anatomy limit inference
            about older human patients.
        - target: Impaired Rod Light Responses
          description: AAV5-hRHO194-human CNGB1 given at four weeks improves rod ERGs and dim-light behavior
            most strongly at the intermediate dose. The highest dose had no clear ERG benefit, and structural
            thinning was slowed rather than stopped.
          relationship: RESCUES
          model_scale: CELLULAR
          limitations: Human/mouse hybrid channels, ectopic human CNGB1 localization and a young knockout
            retina complicate dose translation. Doses are preclinical experimental values, not human recommendations.
          fidelity: MODERATE
        description: Exon-26 knockout abolishing the full-length channel subunit while preserving soluble
          GARP isoforms. It models channel deficiency, not all human alleles or GARP-null phenotypes.
      selected_evidence:
        snippet: To investigate the importance of the CNGB subunits in vivo, we deleted the CNGB1 gene
          in mice.
        supports: SUPPORT
        directness: DIRECT
