        description: Spectral-domain OCT ellipsoid zone (EZ) length and fundus autofluorescence (FAF)
          hyperautofluorescent ring area are used both diagnostically and as candidate clinical-trial
          endpoints, since visual acuity is not a sensitive progression metric in this slowly progressive
          disease.
