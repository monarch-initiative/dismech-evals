      assertion_type: Diagnosis
      assertion:
        name: Molecular genetic testing
        diagnosis_term:
          preferred_term: diagnostic procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        description: An inherited-retinal-disease panel or genomic test can identify candidate CNGB1 variants.
          A molecular diagnosis requires biallelic pathogenic or likely pathogenic variants, with phase,
          segregation and copy-number assessment where needed. VUS findings or in-silico predictions alone
          do not establish the diagnosis. Apparent homozygosity may require evaluation for a deletion
          on the other allele.
        results: Biallelic pathogenic or likely pathogenic CNGB1 variants consistent with recessive inheritance
          support molecular confirmation; uncertain variants require further assessment.
      selected_evidence:
        snippet: 10 patients from 9 families underwent full ophthalmologic examination. Molecular investigations
          included whole-exome analysis in 6 patients.
        supports: SUPPORT
        directness: DIRECT
