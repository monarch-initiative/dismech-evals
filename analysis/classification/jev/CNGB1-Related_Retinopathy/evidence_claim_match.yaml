      assertion_type: Discussion
      assertion:
        discussion_id: cngb1_cgmp_death_intermediates
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which intermediates link channel deficiency and cGMP accumulation to progressive rod death
          in CNGB1 disease?
        attaches_to:
        - pathophysiology#Rod cGMP Accumulation
        - pathophysiology#Progressive Rod Photoreceptor Loss
        rationale: Channel-deficient model rods accumulate cGMP, and CNGB1 restoration reduces the staining
          while improving function. Those rescue experiments correct multiple consequences simultaneously
          and do not isolate cGMP as the death effector. Calcium overload and a specific downstream death
          pathway should not be inferred from cGMP immunoreactivity alone.
      selected_evidence:
        snippet: A feature of lack of CNG channel function in rod outer segments is the abnormal accumulation
          of cGMP. IHC showed that this was reversed within the treated retinal regions
        supports: SUPPORT
        directness: DIRECT
