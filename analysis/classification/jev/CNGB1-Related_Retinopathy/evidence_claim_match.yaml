        publication: PMID:24015210
        modeled_mechanisms:
        - target: Progressive Rod Photoreceptor Loss
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Progressive rod loss and later cone decline provide a large-eye model of the rod-first
            disease course; the cited dog histology does not itself establish apoptosis.
          model_scale: CELLULAR
          limitations: Dogs have an area centralis but differ from humans in early central outer nuclear
            layer thinning and autofluorescence patterns. One breed-associated allele does not model all
            human variants.
        - target: Impaired Rod Light Responses
          relationship: RESCUES
          fidelity: MODERATE
          description: AAV5-hGRK1-canine CNGB1 in the 2018 proof-of-concept study yielded ERG rescue through
            18 months in the longest ERG follow-up; 23 months referred to protein expression/structural
            follow-up. The distinct 2023 AAV5-RHO-human CNGB1 study treated ten three-month-old dogs and
            assessed functional rescue through 12 months in animals retained that long.
          readouts:
          - name: Scotopic ERG b-wave and vision-guided behavior
            target: Impaired Rod Light Responses
            direction: RESTORED
            interpretation: Sustained improvement in rod-mediated ERG amplitude and scotopic vision-guided
              behavior over long-term follow-up confirms durable functional rescue.
          model_scale: CELLULAR
          limitations: Dogs have an area centralis but differ from humans in early central outer nuclear
            layer thinning and autofluorescence patterns. One breed-associated allele does not model all
            human variants.
        - target: Rod cGMP Accumulation
          description: Abnormal cGMP immunoreactivity is reduced within human-CNGB1-treated canine retina.
          relationship: RESCUES
          model_scale: MOLECULAR
          limitations: Immunoreactivity is not a direct ionic-current or intracellular-calcium measurement.
          fidelity: MODERATE
          readouts:
          - name: Photoreceptor outer segment cGMP accumulation
            target: Rod cGMP Accumulation
            direction: RESTORED
            interpretation: Reduced abnormal cGMP staining in treated regions is an indirect pharmacodynamic
              marker of restored channel function.
        description: Naturally occurring Papillon/Phalène channel-deficiency model. The 2013 discovery
          paper predicted NMD without affected retinal tissue. The 2018 follow-up demonstrated exon skipping,
          approximately 40% residual transcript and inner-segment truncated protein; it is not a complete
          transcript-null model.
      selected_evidence:
        snippet: This mutation causes a frameshift and premature stop codon leading to probable nonsense
          mediated decay (NMD) of the CNGB1 mRNA.
        supports: SUPPORT
        directness: DIRECT
