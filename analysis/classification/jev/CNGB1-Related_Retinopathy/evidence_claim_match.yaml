            preferred_term: CNGB1-related retinopathy
            term:
              id: MONDO:0800403
              label: CNGB1-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CNGA1 Subunit Degradation and CNG Channel Assembly Failure
        biological_scale: MOLECULAR
        description: CNGB1a is required for trafficking the heteromeric rod CNG channel to the outer segment
          plasma membrane. In its absence, the partner CNGA1 subunit is not stably retained at the outer
          segment and only trace amounts remain, so the functional heterotetrameric channel fails to assemble.
          Structural work shows this is mediated by a specific intersubunit interaction between CNGA1
          and CNGB1 that, when disrupted, exposes a trafficking-inhibitory region of CNGB1 and prevents
          membrane expression of the complex.
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        cellular_components:
        - preferred_term: photoreceptor outer segment
          term:
            id: GO:0001750
            label: photoreceptor outer segment
        molecular_functions:
        - preferred_term: intracellularly cyclic nucleotide-activated cation channel activity
          modifier: DECREASED
          term:
            id: GO:0005221
            label: intracellularly cyclic nucleotide-activated monoatomic cation channel activity
      selected_evidence:
        snippet: We show that the mechanism underlying this defect involves an intersubunit interaction
          between CNGA1 and CNGB1 that was not formed between CNGA1-RP and CNGB1 subunits. In the absence
          of this interaction, a short N-terminal region in CNGB1 prevented membrane expression.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11970862
      reference_title: An intersubunit interaction regulates trafficking of rod cyclic nucleotide-gated
        channels and is disrupted in an inherited form of blindness.
      evidence_source: IN_VITRO
      explanation: Heterologous expression evidence establishing the specific molecular mechanism by which
        loss of the CNGA1-CNGB1 intersubunit interaction blocks channel trafficking to the membrane.
