      assertion_type: Pathophysiology
      assertion:
        name: Secondary Cone Dysfunction and Degeneration
        conforms_to: photoreceptor_degeneration#Secondary Cone Degeneration and Outer Retinal Thinning
        biological_scale: TISSUE
        description: Cones do not express CNGB1a and are not cell-autonomously affected by the channel-trafficking
          defect, but they decline secondarily and later than rods once the surrounding rod population
          is lost, following the conserved non-cell-autonomous cone degeneration pattern of retinitis
          pigmentosa. This secondary, delayed cone decline underlies the retained good central vision
          that characterizes the disease for years after rod function is already lost.
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: Cones were primarily unaffected and showed normal ERG responses up to 6 months, but they
          started to degenerate in later stages.
        supports: SUPPORT
