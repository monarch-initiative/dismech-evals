      assertion_type: Diagnosis
      assertion:
        name: Multimodal retinal imaging
        diagnosis_term:
          preferred_term: diagnostic procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
        description: SD-OCT and fundus autofluorescence characterize preserved and diseased retinal regions.
          Ellipsoid-zone length and hyperautofluorescent ring area are candidate progression metrics for
          patients in whom those features can be measured. Their sensitivity, reproducibility and relationship
          to treatment benefit require prospective validation; neither is an established surrogate endpoint.
        results: In the 33-patient retrospective cohort, EZ length was measurable in 23 patients and constricted
          by a mean 178 ± 161 micrometers per year. Eight of 14 patients in a two-year simulation changed
          by more than 250 micrometers, the cited approximate interobserver variability. Hyperautofluorescent
          ring area was measurable in 17 patients; some had no ring and others had rings beyond the image.
          These selection limits prevent transferring the rates or sensitivity to every patient or disease
