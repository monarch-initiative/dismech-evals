  f3058dd9731032ee3f41d1e0728406e2f39a30b2bc4360c5c6938eebf47adb01:
    claim:
      about:
        disease:
          name: CNGB1-Related Retinopathy
          disease_term:
            preferred_term: CNGB1-related retinopathy
            term:
              id: MONDO:0800403
              label: CNGB1-related retinopathy
        context: []
      assertion_type: Treatment
      assertion:
        name: AAV-Mediated CNGB1 Gene Augmentation Therapy
        therapeutic_modality: GENE_THERAPY
        description: Subretinal delivery of an adeno-associated viral vector expressing CNGB1 cDNA under
          a short, rod-specific promoter (required because the large CNGB1 cDNA, ~3.76-4 kb, consumes
          most of the AAV packaging capacity). Preclinical proof-of-concept in the Cngb1-/- mouse and
          a subsequent translatable construct tested in CNGB1-mutant dogs and non-human primates both
          showed robust, durable (at least 12-23 month) restoration of rod-mediated function and preservation
          of retinal structure. As of curation, this program has not yet been reported in a human clinical
          trial, but the combination of a wide therapeutic window (early functional loss with late structural
          loss) and validated large-eye preclinical efficacy makes CNGB1-RP a leading translational candidate
          among inherited retinal degenerations.
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: this work provides a proof-of-concept for the treatment of rod channelopathy-associated
          RP by AAV-mediated gene replacement
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22802073
      reference_title: Gene therapy restores vision and delays degeneration in the CNGB1(-/-) mouse model
