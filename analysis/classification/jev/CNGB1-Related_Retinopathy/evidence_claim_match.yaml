      assertion:
        name: CNGB1
        gene_term:
          preferred_term: CNGB1
          term:
            id: hgnc:2151
            label: CNGB1
        association: Causative
        features: The 2021 mutation review catalogued 84 reported CNGB1 variants, of which 59 were classified
          pathogenic or likely pathogenic and 25 as uncertain significance. These are dated literature
          counts, not a current inventory of 84 proven causal alleles. Variants span GARP and channel
          regions; the review noted concentrations of reported channel-domain missense variants. Individual
          alleles can affect abundance, splicing, trafficking or gating differently. No reliable genotype-based
          prediction of retinal severity or olfactory involvement was established in the reviewed clinical
          cohorts.
        case_fractions:
        - population: Autosomal recessive retinitis pigmentosa cohorts summarized in the 2021 mutation
            review
          case_fraction_low: 1.0
          case_fraction_high: 4.0
          notes: The review summarizes approximately 1–4% of autosomal recessive RP across earlier cohorts.
            This is not a population prevalence estimate or a measured constant across ancestries. Its
            separately reported 0.42–0.78% estimates use all inherited retinal disease index cases as
            denominator.
        inheritance:
        - name: Autosomal recessive
      selected_evidence:
        snippet: Here, we investigated the splicing of c.3444+1G>A by exon trapping experiments and could
          demonstrate that instead of the proposed truncation of the last 28 aa this mutation leads to
          replacement of the last 170 aa of CNGB1a by 68 unrelated amino acids.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
