        context: []
      assertion_type: Subtype
      assertion:
        name: CNGB3 Progressive Cone Dystrophy
        display_name: Progressive cone dystrophy (CNGB3)
        description: Later-onset (childhood to second decade) autosomal recessive cone dystrophy from
          biallelic CNGB3 variants, without congenital nystagmus, with progressive loss of acuity, colour
          vision and photopic ERG and macular atrophy. It accounts for a small fraction of recessive cone
          dystrophy. It has been reported with two truncating alleles as well as with the Arg403Gln missense
          allele (in trans with c.1148delC, or homozygous in a proband who also carried two CNGA3 variants),
          so no single genotype defines it.
      selected_evidence:
        snippet: These probands did not have a congenital nystagmus, but had a progressive deterioration
          of visual acuity, color vision, and photopic electroretinogram, with onset in the second decade.
        supports: SUPPORT
