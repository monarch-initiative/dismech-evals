        therapeutic_modality: GENE_THERAPY
        description: Subretinal AAV delivery of human CNGB3 under a cone-directed promoter. It rescued
          cone function in the canine and mouse models. In humans, the first-in-human AAV8-hCARp.hCNGB3
          phase 1/2 trial (NCT03001310) was acceptably safe but showed no consistent efficacy change at
          24 weeks, and intraocular inflammation was dose-limiting at the highest dose; an AAV CNGB3 vector
          from a second sponsor (AGTC-401, NCT02599922) has also been trialled. High vector doses also
          caused inflammation in CNGB3-mutant dogs. There is no approved gene therapy.
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: Subretinal administration of rAAV5-hCNGB3 with a long version of the red cone opsin promoter
          in younger animals led to a stable therapeutic effect for at least 33 months.
