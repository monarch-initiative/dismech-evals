        variants:
        - name: c.1148delC (p.Thr383fs)
          description: Recurrent frameshift allele, the most frequent CNGB3 variant in European achromats.
        - name: p.Arg403Gln
          description: Missense allele reported in progressive cone dystrophy in trans with c.1148delC,
            and homozygous in a cone-dystrophy proband who also carried two CNGA3 variants; a compound
            heterozygote with an 8-bp deletion had achromatopsia with extinguished cone ERGs.
