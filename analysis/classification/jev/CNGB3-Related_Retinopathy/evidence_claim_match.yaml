          multi-exon copy-number deletions are found in patients otherwise carrying a single variant,
          and deep-intronic pseudoexon-activating variants explain further single-allele cases.
        case_fractions:
        - population: ACHM cohort (341 independent patients; Kohl et al. 2005)
          case_fraction_percent: 47.8
