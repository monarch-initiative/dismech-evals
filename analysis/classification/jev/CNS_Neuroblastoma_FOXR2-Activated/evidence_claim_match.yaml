  90eaaaa644fa4633e7db0ebf09f30d27a7e66deca8aba0543dc937b692f11157:
    claim:
      about:
        disease:
          name: CNS Neuroblastoma, FOXR2-Activated
          disease_term:
            preferred_term: CNS neuroblastoma with FOXR2 activation
            term:
              id: MONDO:0859597
              label: cns neuroblastoma with FOXR2 activation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Structural Rearrangement Upstream of FOXR2
        description: 'Somatic structural variants clustering within roughly 150 kb upstream of FOXR2 on
          Xp11.21: interchromosomal translocations, tandem duplications, inversions, deletions, a mitochondrial
          DNA insertion creating a novel promoter, and truncated LINE-1 retrotransposition. They are varied
          in kind and consistent in position. Crucially they spare the coding region, so there need be
          no chimeric protein and no fusion transcript, and routine testing can miss them.'
        biological_scale: MOLECULAR
        notes: This node carries no gene descriptor and no molecular function, which is deliberate. The
          lesion is a cis-regulatory rearrangement in intergenic DNA upstream of FOXR2; it is not an alteration
          of transcription factor activity, and the gene whose activity changes is annotated on the next
          node, where the change actually happens.
      selected_evidence:
        snippet: Genome-wide sequencing revealed complex inter- and intrachromosomal re-arrangements converging
          on forkhead box R2 (FOXR2) in 6/8 samples with available data, leading to increased FOXR2 gene
          expression levels in CNS NB-FOXR2 tumors compared with other CNS tumor entities
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26919435
      reference_title: New Brain Tumor Entities Emerge from Molecular Classification of CNS-PNETs.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: The study that defined the entity, showing varied rearrangements converging on FOXR2
        and raising its expression above other brain tumours. Six of eight samples with sequencing data,
        so the denominator is small.
