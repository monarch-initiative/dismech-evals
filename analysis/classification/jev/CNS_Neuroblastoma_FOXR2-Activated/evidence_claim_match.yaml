  aac1f06c0410f0814d3670f407770a1c594c075cd69f319e7569e6a192186650:
    claim:
      about:
        disease:
          name: CNS Neuroblastoma, FOXR2-Activated
          disease_term:
            preferred_term: CNS neuroblastoma with FOXR2 activation
            term:
              id: MONDO:0859597
              label: cns neuroblastoma with FOXR2 activation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chromosome 1q Gain
        description: 'Gain of chromosome arm 1q is present in nearly every tumour, 43 of 44 in the defining
          series and 94 to 100 per cent in later cohorts, alongside frequent 16q loss and 17q gain. It
          has been reported to converge on suppression of p53 signalling through MDM4 overexpression.
          It is not specific: 1q gain was found in 70.6 per cent of high-grade gliomas overexpressing
          FOXR2, so neither 1q gain nor FOXR2 overexpression identifies this entity on its own.'
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Chromosome arm 1q gain (1q+), a characteristic molecular alteration of CNS NB-FOXR2,
          was seen in 70.6% (12/17) of HGGs with FOXR2 overexpression tested, demonstrating that the combination
          of 1q+ and FOXR2 overexpression is not specific to CNS NB-FOXR2.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40237561
      reference_title: FOXR2 activation is not exclusive of CNS neuroblastoma.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: The bound on the previous item, and the reason this entry does not treat 1q gain plus
        FOXR2 expression as diagnostic. Seventeen gliomas tested, so a small denominator for a specificity
        claim.
