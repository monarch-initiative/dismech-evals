        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Neuroblastoma
        disease_term:
          preferred_term: neuroblastoma
          term:
            id: MONDO:0005072
            label: neuroblastoma
        description: Shares the word neuroblastoma and nothing structural. Neuroblastoma is a peripheral
          sympathetic nervous system tumour of neural crest origin, arising in the adrenal gland or sympathetic
          chain. This is a supratentorial embryonal brain tumour. The two are confused in naming and in
          ontologies rather than at the bedside, where the site settles it immediately. A further source
          of confusion is that about 9 per cent of peripheral neuroblastomas express FOXR2; that group
          is a subset of peripheral neuroblastoma with an unfavourable outcome, not this entity.
        distinguishing_features:
        - A supratentorial intracranial site rather than adrenal or paraspinal
        - FOXR2 activation by upstream structural rearrangement, which peripheral neuroblastoma is not
          defined by
        - A distinct DNA methylation class, which is what separated this entity from the tumours it was
          grouped with
        - Near-universal 1q gain, where peripheral neuroblastoma is characterised by MYCN amplification
          and segmental changes at other loci
      selected_evidence:
        snippet: In three combined neuroblastoma data sets, 9% of tumors show expression of FOXR2 but
          have low levels of MYCN mRNA.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34110923
      reference_title: FOXR2 Stabilizes MYCN Protein and Identifies Non-MYCN-Amplified Neuroblastoma Patients
