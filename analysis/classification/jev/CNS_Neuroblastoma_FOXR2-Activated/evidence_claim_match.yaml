        notes: 'The defining somatic event, and an unusual one: the activating rearrangements lie upstream
          of the gene and leave its coding sequence intact, so there is no variant in the protein to describe.
          Reported partners and events include JMJD1C, LOC550643 and JPX fusions, deletions reaching upstream
          of the gene, a mitochondrial DNA insertion forming a novel promoter, and truncated LINE-1 retrotransposition.
          No gene-disease validity assertion is recorded: these are somatic events and ClinGen has not
          curated the pair.'
      selected_evidence:
        snippet: Since FOXR2 is not expressed in other CNS tumor types (Figure 5C) or normal brain tissues,
          these events are suggestive of FOXR2 activation facilitated by promoters of active genes (Figure
          S5F), thus instigating oncogenic activity (Rahrmann et al., 2013).
        supports: SUPPORT
