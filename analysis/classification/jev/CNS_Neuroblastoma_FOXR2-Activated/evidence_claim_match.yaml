            term:
              id: MONDO:0859597
              label: cns neuroblastoma with FOXR2 activation
        context: []
      assertion_type: Treatment
      assertion:
        name: Craniospinal Irradiation with Chemotherapy
        description: The best-documented approach is upfront craniospinal irradiation with chemotherapy.
          In the largest cohort, 35 of 42 progression-free survivors had received it, five-year progression-free
          and overall survival were 63 and 85 per cent, and the authors attribute the favourable outcome
          to the use of craniospinal irradiation, noting a higher recurrence rate in patients who were
          not irradiated or were irradiated locally. They propose that a standard-risk craniospinal irradiation
          regimen be evaluated prospectively, which has not yet been done. Late relapses occur, the latest
          at 5.9 years, so follow-up has to be long.
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: radiation therapy
          term:
            id: NCIT:C15313
            label: Radiation Therapy
        notes: No therapeutic_agent is recorded for the chemotherapy half of this treatment, because no
          cited source names a standard regimen for this entity. The cohorts describe postoperative chemotherapy,
          induction chemotherapy and high-dose chemotherapy with stem cell rescue in varying combinations,
          and one review proposes that a medulloblastoma-like approach may be reasonable, which is a proposal
          rather than a protocol. Naming agents here would invent a standard that does not exist.
      selected_evidence:
        snippet: While the favorable survival for patients with CNS NB-FOXR2 is clearly confirmed in our
          series, our data show a higher rate of recurrences in nonirradiated and locally irradiated patients.
        supports: SUPPORT
        directness: INDIRECT
