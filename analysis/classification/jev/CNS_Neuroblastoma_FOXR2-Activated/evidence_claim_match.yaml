  ba798d638e0ee9c0ac4ae1eb1c5fe225c959bc6d33f88a05507da67c2e194129:
    claim:
      about:
        disease:
          name: CNS Neuroblastoma, FOXR2-Activated
          disease_term:
            preferred_term: CNS neuroblastoma with FOXR2 activation
            term:
              id: MONDO:0859597
              label: cns neuroblastoma with FOXR2 activation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant FOXR2 Expression Outside the Testis
        description: FOXR2 is a forkhead transcription factor on the X chromosome whose expression in
          normal postnatal human tissue is restricted to the testis. In this tumour it is expressed in
          brain. The parallel the literature draws is with cancer-testis antigen genes, which sit on the
          X chromosome, are normally confined to the testis, and escape silencing through hypomethylation;
          promoter hypomethylation is described as the predominant regulatory mechanism, with structural
          variation the other route.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: FOXR2
          term:
            id: hgnc:30469
            label: FOXR2
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        notes: 'GAIN_OF_FUNCTION rather than INCREASED because the change is qualitative, and this is
          the node where that argument belongs. FOXR2 is not a brain transcription factor running faster:
          it is not expressed in brain at all, and the upstream rearrangement puts a normally silent testis-restricted
          factor under active control in a tissue that never expresses it.'
      selected_evidence:
        snippet: This observation suggests that SVs result in enhancer hijacking to promote expression
          of full-length FOXR2.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35802025
      reference_title: FOXR2 Is an Epigenetically Regulated Pan-Cancer Oncogene That Activates ETS Transcriptional
        Circuits.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Names the mechanism connecting the structural variants to expression. The authors frame
        it as a suggestion from the position of the breakpoints relative to enhancer and promoter marks,
        not as a demonstrated causal chain.
