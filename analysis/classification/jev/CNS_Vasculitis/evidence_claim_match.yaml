      assertion_type: DifferentialDiagnosis
      assertion:
        name: Reversible cerebral vasoconstriction syndrome
        description: RCVS can resemble angiographic PACNS. Thunderclap headache and a compatible reversible
          vasoconstrictive course favor RCVS; an angiographic string-of-beads pattern alone does not distinguish
          the two.
        distinguishing_features:
        - Thunderclap headache is a useful RCVS clue in the appropriate clinical context.
        - Angiographic beading can occur without inflammatory vasculitis.
      selected_evidence:
        snippet: Thirteen patients had RCVS. Thunderclap headaches, the absence of a focal neurological
          deficit, a convexal subarachnoid hemorrhage and/or normal brain parenchyma on magnetic resonance
          imaging, and "string of beads" appearance on conventional angiography had high diagnostic value.
        supports: SUPPORT
        directness: DIRECT
