  a66acf86b74655044c31586b83d1588b010d117a0035486c066b4d5e04b4741c:
    claim:
      about:
        disease:
          name: CNS Vasculitis
          disease_term:
            preferred_term: CNS vasculitis
            term:
              id: MONDO:0015374
              label: primary central nervous system vasculitis
        context: []
      assertion_type: Definition
      assertion:
        name: Calabrese-Mallek diagnostic criteria
        definition_type: DIAGNOSTIC_CRITERIA
        description: Classic PACNS criteria require an unexplained neurologic deficit, CNS angiographic
          or tissue evidence of arteritis, and exclusion of systemic vasculitis or secondary mimics.
        criteria_sets:
        - name: Classic PACNS criteria
          description: Unexplained neurologic deficit plus angiographic or tissue evidence of CNS arteritis,
            with no systemic or secondary cause.
          minimum_required: 3
      selected_evidence:
        snippet: This study proposes to establish diagnostic criteria for PACNS which would include 1)
          the presence of an unexplained neurologic deficit after thorough clinical and laboratory evaluation;
          2) documentation by cerebral angiography and/or tissue examination of an arteritic process within
          the central nervous system; and 3) no evidence of a systemic vasculitide or any other condition
          to which the angiographic or pathologic features could be secondary.
        supports: SUPPORT
