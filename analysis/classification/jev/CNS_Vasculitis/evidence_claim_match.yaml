        notes: A small study including six PACNS patients found an increased fraction of IL-17-producing
          CSF-derived CD4 T cells after 2–4 weeks of expansion and stimulation. Soluble CSF IL-17 was
          generally undetectable. This assay is exploratory and does not establish constitutive in vivo
          IL-17 elevation or efficacy of IL-17 blockade in PACNS.
      selected_evidence:
        snippet: Interestingly, all samples with CSF cells analyzed of patients with PACNS and SACNS groups
          showed high levels of IL-17-producing CD4+ cells (average 8.8%, range 7.3%–10.5%, for PACNS;
          average 10.4%, range 8.9%–11.9%, for SACNS).
        supports: SUPPORT
        directness: DIRECT
