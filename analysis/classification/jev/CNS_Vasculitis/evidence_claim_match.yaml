      assertion_type: Diagnosis
      assertion:
        name: CNS biopsy
        description: Brain or leptomeningeal biopsy can establish transmural vascular inflammation and
          identify mimics, especially in suspected small-vessel disease. Sampling error can produce a
          nondiagnostic result; targeting an abnormal region and including leptomeninges may improve yield.
          The decision requires individualized assessment of procedural risk and diagnostic value.
      selected_evidence:
        snippet: In studies analyzing the precise site of the biopsy, the yield increased when the sample
          included leptomeninges, and/or when the biopsy was performed on a lesioned area.
        supports: SUPPORT
        directness: DIRECT
