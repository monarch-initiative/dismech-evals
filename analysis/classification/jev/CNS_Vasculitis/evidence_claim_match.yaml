      assertion:
        discussion_id: complement-activation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does localized complement activation contribute to primary CNS vascular injury?
        rationale: CSF proteomics in eight biopsy-confirmed cases found altered complement-protein abundance,
          but a subsequent 20-patient study found no increased CSF or serum complement activation products.
          Protein abundance and activation are different measurements. A local endothelial mechanism remains
          unresolved; these studies do not establish a complement-targeted treatment for PACNS.
      selected_evidence:
        snippet: Compared to noninflammatory controls, 283 proteins were differentially expressed in the
          CSF of patients with PACNS, with significant enrichment of the complement cascade pathway (C4-binding
          protein, CD55, CD59, properdin, complement C5, complement C8, and complement C9) and neural
          cell adhesion molecules.
        supports: SUPPORT
        directness: DIRECT
