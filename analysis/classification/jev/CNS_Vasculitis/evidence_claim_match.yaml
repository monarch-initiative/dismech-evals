        definition_type: DIAGNOSTIC_CRITERIA
        description: The 2009 framework, used in the ESO guideline, separates histologically definite
          disease from probable disease supported by a high-probability angiogram, abnormal brain MRI
          and compatible CSF. These categories do not eliminate the need to exclude mimics.
      selected_evidence:
        snippet: A “definite” diagnosis of PACNS requires histopathological confirmation of vasculitis
          on cerebral biopsy or autopsy. A “probable” diagnosis requires a high-probability angiogram
          with abnormal findings on magnetic resonance imaging (MRI) and cerebrospinal fluid (CSF) profile
          consistent with PACNS.
        supports: SUPPORT
