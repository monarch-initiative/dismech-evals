    evidence_metadata:
      reference: PMID:30254215
      reference_title: Novel calcineurin A (PPP3CA) variant associated with epilepsy, constitutive enzyme
        activation and downregulation of protein expression.
      evidence_source: IN_VITRO
      explanation: 'The p.Gln442Ter variant shows a paradoxical dual mechanism: recombinant protein studies
        reveal constitutive enzyme activation (truncation removes the auto-inhibitory domain), while patient-derived
        cells show strongly reduced protein expression from both mutant and wild-type alleles. The net
        effect in vivo is likely loss of function through protein instability despite the intrinsic hyperactivity
        of the truncated protein.'
