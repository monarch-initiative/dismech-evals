            term:
              id: MONDO:0020630
              label: developmental and epileptic encephalopathy 91
        context: []
      assertion_type: Genetic
      assertion:
        name: PPP3CA variants
        gene_term:
          preferred_term: PPP3CA
          term:
            id: hgnc:9314
            label: PPP3CA
        association: Pathogenic Mutations
        presence: Positive
        notes: De novo heterozygous variants in PPP3CA are the primary genetic cause of CN-related DEE
          (DEE 91). Variants include missense mutations in the catalytic domain, truncating variants (frameshift
          and nonsense) clustered in a 26-amino acid region of the regulatory domain, and rare variants
          in other domains. The pLI value of PPP3CA is 1, indicating extreme loss-of-function intolerance.
          Recurrent variants include p.His92Arg, p.Asp234Glu, p.Glu282Lys, and p.Ser419Asnfs*31.
        variants:
        - name: PPP3CA catalytic domain missense variants
          description: Loss-of-function missense variants in the catalytic domain (e.g., p.His92Arg, p.Asn150Ile,
            p.Asp234Glu, p.His281Gln) cause epileptic encephalopathy with refractory seizures and severe
            intellectual disability.
          clinical_significance: PATHOGENIC
        - name: PPP3CA regulatory domain truncating variants
          description: Truncating variants (frameshift and nonsense) clustered in the regulatory domain
            cause the most severe form with early-onset drug-resistant epilepsy. Expression studies show
            mRNA expression from the mutant allele but no detectable mutant protein, suggesting protein
            instability.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: the two frameshift variants in this study and the six truncating variants reported previously
          are all located within a 26-amino acid region in the regulatory domain (RD).
        supports: SUPPORT
