  c4636a49143415ee08db8be9ee3e5e559269381ae81a010d3b547d45da1fdd5d:
    claim:
      about:
        disease:
          name: COA3-Related COX Deficiency
          disease_term:
            preferred_term: COA3-related COX deficiency (MC4DN14)
            term:
              id: MONDO:0033649
              label: mitochondrial complex IV deficiency, nuclear type 14
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COA3 Assembly-Factor Loss and Failed Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic COA3 variants reduce the steady-state level of COA3, a small inner membrane
          Complex IV assembly factor. COA3 normally stabilizes the mtDNA-encoded core catalytic subunit
          COX1 and couples its synthesis with holoenzyme assembly. Loss of COA3 leaves COX1 destabilized
          and stalls an early COX assembly intermediate, so the mature enzyme fails to form and an isolated
          Complex IV biogenesis failure results. COA3 and COX14 are mutually interdependent — each is
          undetectable when the other is lost — situating this lesion within the COX1-coupling arm of
          the assembly pathway.

          '
        gene:
          preferred_term: COA3
          modifier: DECREASED
          term:
            id: hgnc:24990
            label: COA3
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Whole exome sequencing identified compound heterozygous mutations (c.199dupC, c.215A>G)
          in COA3, a small inner membrane COX assembly factor
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
