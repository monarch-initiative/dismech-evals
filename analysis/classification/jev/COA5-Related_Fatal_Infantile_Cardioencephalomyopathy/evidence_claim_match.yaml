  6b9c30ed92bc01c222200a8877846b7d8e5955b28a22e2242394e89e006c56cf:
    claim:
      about:
        disease:
          name: COA5-Related Fatal Infantile Cardioencephalomyopathy
          disease_term:
            preferred_term: COA5-related fatal infantile cardioencephalomyopathy (CEMCOX3/MC4DN9)
            term:
              id: MONDO:0014667
              label: cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency
                3
        context:
        - path: /experimental_models/1
          value:
            name: CRISPR/Cas9 COA5 knockout U2OS cell line
            experimental_model_type: CELL_LINE
            description: 'A homozygous COA5 knockout (7-bp deletion, c.287_290+3del) engineered in the
              human U2OS osteosarcoma line, with an isogenic wild-type control from the same nucleofected
              population. Built specifically because the patient fibroblasts grow too poorly for extended
              biochemistry, it is the system in which complexome profiling localized the COA5-dependent
              step.

              '
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_source: U2OS human osteosarcoma cell line, CRISPR/Cas9-edited, with isogenic control
            publication: PMID:39779219
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: COA5 Loss and Arrested Early Complex IV Assembly
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: 'The knockout reproduces the patients'' isolated Complex IV defect and resolves it
          further: MTCO1-containing subcomplexes accumulate, MTCO2 is absent, and the holoenzyme is lost,
          placing the COA5 step between MTCO1 maturation and MTCO2 incorporation.'
        limitations: A heterologous osteosarcoma line rather than a cardiac or neural cell, and a frameshift
          null rather than the patients' missense allele, so it reports the consequence of complete COA5
          absence rather than the consequence of p.Ala53Pro. Nothing about the cardiomyopathy or the lethal
          course can be observed in it.
        divergences:
        - divergence_type: CAUSE_UNREPRESENTED
          materiality: QUALIFYING
          description: The disease allele is a homozygous missense substitution, p.Ala53Pro, in the twin-CX9C
            domain. The model instead carries an engineered 7-bp frameshift deletion that removes the
            protein entirely, so it establishes what loss of COA5 does without establishing that p.Ala53Pro
            is a complete null. The complementation experiment in patient fibroblasts, not this model,
            is what ties the phenotype to the patients' allele.
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: Cardiomyocytes, the myocardium, and the whole organism lie outside the model boundary,
            so the hypertrophic remodeling and infantile lethality that define the clinical disorder cannot
            arise in it. Its claims are restricted to the molecular assembly step.
        readouts:
        - name: Steady-state MTCO2 subunit level
          target: COA5 Loss and Arrested Early Complex IV Assembly
          direction: DECREASED
          interpretation: Selective loss of MTCO2 with other complexes intact identifies the blocked assembly
            step.
        - name: Fully assembled complex IV holocomplex on complexome profiling
          target: COA5 Loss and Arrested Early Complex IV Assembly
          direction: ABOLISHED
          interpretation: Loss of the holocomplex with accumulation of early intermediates is the structural
            signature of an arrested assembly step.
      selected_evidence:
        snippet: Mitochondrial complexome profiling pinpointed a role of COA5 in early CIV assembly, more
          specifically, its involvement in the stage between MTCO1 maturation and the incorporation of
          MTCO2
        supports: SUPPORT
