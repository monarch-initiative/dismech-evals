        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'Three affected individuals in two unrelated families have been reported: two siblings
          with fatal neonatal cardiomyopathy (Huigsloot et al., 2011) and one further female neonate (Tang
          et al., 2025). Both families are of Turkish descent and all three patients are homozygous for
          the same c.157G>C (p.Ala53Pro) allele. No population prevalence estimate exists.'
      selected_evidence:
        snippet: the rare c.157G>C, p.Ala53Pro variant was found only in two incidences where both patients
          were of Turkish ethnicity
        supports: SUPPORT
    origin:
