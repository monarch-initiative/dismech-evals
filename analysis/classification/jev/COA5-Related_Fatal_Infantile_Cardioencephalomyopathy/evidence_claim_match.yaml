      assertion:
        discussion_id: coa5_encephalopathy_not_documented
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cardiomyocyte Bioenergetic Failure and Hypertrophic Remodeling
        - phenotypes#Hypertrophic Cardiomyopathy
        prompt: The disease is named a cardioencephalomyopathy, but is there any documented central nervous
          system involvement in COA5 deficiency?
        rationale: 'The MONDO and OMIM labels both carry "cardioencephalomyopathy", inherited from the
          SCO2-defined syndrome that the name was coined for. The published COA5 phenotype does not currently
          support the "encephalo-" half. The founding report describes fatal neonatal cardiomyopathy;
          the OMIM summary of the disorder describes neonatal hypertrophic cardiomyopathy resulting in
          death in early infancy; and in the only patient with imaging reported, neuroimaging of the brain
          was normal. This entry therefore records no encephalopathy phenotype. The gap is a genuine absence
          of evidence, not evidence of absence: with three patients, two of whom died as neonates, the
          disorder may simply not have had time or opportunity to express neurological features. It matters
          because importing encephalopathy from the SCO2 or Leigh-syndrome literature would be a Named
          Entity Confusion error, and because a future patient surviving beyond infancy would be the first
          real test.'
      selected_evidence:
        snippet: Neuroimaging of the brain was normal.
        supports: REFUTE
