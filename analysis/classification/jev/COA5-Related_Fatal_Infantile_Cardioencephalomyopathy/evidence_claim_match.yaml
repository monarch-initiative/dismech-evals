                3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coa5_submitochondrial_localisation_and_metallochaperone_role
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#COA5 Loss and Arrested Early Complex IV Assembly
        prompt: Where does human COA5 sit within the mitochondrion, and does it act purely as an assembly
          factor at the MTCO1-to-MTCO2 transition or also as a regulator of the copper and haem metallochaperone
          modules?
        rationale: 'Two lines of human work point in partly different directions. Complexome profiling
          of a COA5 knockout places the defect squarely at the transition between MTCO1 maturation and
          MTCO2 incorporation. Separately, a suppressor screen in COX11-knockout human cells identified
          PET191/COA5 as a contributor to copper-centre biogenesis and placed it among the twin-CX9C proteins
          that regulate dynamic metallochaperone modules. These are compatible - MTCO2 incorporation requires
          its CuA centre - but they are not the same claim, and no antibody robust enough for routine
          western blotting exists, so the protein''s submitochondrial localisation is still unresolved.
          The yeast orthologue Pet191 is a further complication rather than a resolution: its import is
          independent of the Mia40 pathway, unlike most twin-CX9C proteins, so yeast localisation data
          cannot be transferred to the human protein.'
      selected_evidence:
        snippet: The import of Pet191 differs from that of other twin-Cx(9)C motif class of proteins in
          being independent of the Mia40 pathway.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
