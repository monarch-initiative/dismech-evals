        prompt: Is COA5 c.157G>C (p.Ala53Pro) a Turkish founder allele, or has the same variant arisen
          independently?
        rationale: 'Every reported patient carries the same homozygous allele and both families are of
          Turkish descent, which is the pattern a founder variant makes. The authors who noticed it say
          so explicitly and equally explicitly say it is unverified: haplotype analysis would require
          samples from the 1990s-era founding family. The answer changes carrier-screening strategy in
          the Turkish population and would change how the ultra-rare occurrence estimate should be read,
          so this entry records the observation without asserting founder status.'
      selected_evidence:
        snippet: this could point towards the likelihood of the variant being a founder pathogenic variant
          within the Turkish population
        supports: SUPPORT
