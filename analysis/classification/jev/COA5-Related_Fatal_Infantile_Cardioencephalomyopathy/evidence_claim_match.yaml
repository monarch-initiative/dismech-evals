  6884a71d2b85018c06d1b00a6b1130209cea6bfb84f36e2536d91e928228b586:
    claim:
      about:
        disease:
          name: COA5-Related Fatal Infantile Cardioencephalomyopathy
          disease_term:
            preferred_term: COA5-related fatal infantile cardioencephalomyopathy (CEMCOX3/MC4DN9)
            term:
              id: MONDO:0014667
              label: cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency
                3
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: SCO2-Related Fatal Infantile Cardioencephalomyopathy
        disease_term:
          preferred_term: SCO2-related fatal infantile cardioencephalomyopathy
          term:
            id: MONDO:0011451
            label: cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency 1
        description: 'The closest mimic, and the one that matters most here: the same syndrome name, the
          same neonatal hypertrophic cardiomyopathy with isolated COX deficiency, and the same class of
          lesion (a nuclear COX assembly factor). Nothing in the clinical presentation reliably separates
          the two, so the distinction is molecular. Papers about SCO2 are not evidence about COA5 and
          must not be read across.'
        distinguishing_features:
        - SCO2 is thought to function as a copper chaperone in assembly of the CuA centre of MTCO2, so
          its lesion is in cofactor delivery. The hedge is the cited source's own wording and is kept
          rather than strengthened, even though the metallochaperone role is well established elsewhere.
          COA5 acts one step earlier, at the transition between MTCO1 maturation and MTCO2 incorporation,
          and has no established copper-delivery role in patient cells.
        - SCO2 disease has a large published cohort with a recurrent p.E140K allele and a genotype-graded
          spectrum that includes delayed-onset Leigh-like disease with SMA-like neurogenic atrophy. COA5
          disease has three reported patients, one allele, and no reported neurogenic atrophy or Leigh
          phenotype.
        - SCO2 is on chromosome 22, COA5 at 2q11.2. Nothing in the neonatal presentation separates the
          two, so only sequencing distinguishes them at the bedside.
      selected_evidence:
        snippet: The Sco2 protein is thought to function as a copper chaperone.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
