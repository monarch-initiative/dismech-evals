          description: The disease allele is a homozygous missense substitution, p.Ala53Pro, in the twin-CX9C
            domain. The model instead carries an engineered 7-bp frameshift deletion that removes the
            protein entirely, so it establishes what loss of COA5 does without establishing that p.Ala53Pro
            is a complete null. The complementation experiment in patient fibroblasts, not this model,
            is what ties the phenotype to the patients' allele.
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: Cardiomyocytes, the myocardium, and the whole organism lie outside the model boundary,
            so the hypertrophic remodeling and infantile lethality that define the clinical disorder cannot
            arise in it. Its claims are restricted to the molecular assembly step.
        readouts:
        - name: Steady-state MTCO2 subunit level
          target: COA5 Loss and Arrested Early Complex IV Assembly
          direction: DECREASED
          interpretation: Selective loss of MTCO2 with other complexes intact identifies the blocked assembly
            step.
        - name: Fully assembled complex IV holocomplex on complexome profiling
          target: COA5 Loss and Arrested Early Complex IV Assembly
          direction: ABOLISHED
          interpretation: Loss of the holocomplex with accumulation of early intermediates is the structural
            signature of an arrested assembly step.
      selected_evidence:
        snippet: Mitochondrial complexome profiling pinpointed a role of COA5 in early CIV assembly, more
