    evidence_metadata:
      reference: PMID:39779219
      reference_title: COA5 has an essential role in the early stage of mitochondrial complex IV assembly.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that as of 2025 the causal allele had been observed in only two independent
        instances, both in patients of Turkish ethnicity, which is the basis for the ultra-rare, case-count-only
        occurrence record.
