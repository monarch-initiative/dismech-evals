          value:
            name: COA5 Loss and Arrested Early Complex IV Assembly
            conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
            biological_scale: MOLECULAR
            description: 'Biallelic COA5 (C2orf64) variants remove a small twin-CX9C Complex IV assembly
              factor that acts between maturation of the mitochondrially encoded core subunit MTCO1 and
              the incorporation of MTCO2 into the nascent enzyme. Patient fibroblasts accumulate a small
              assembly intermediate containing COX1 but lacking COX2, COX4 and COX5b, and steady-state
              MTCO2 is selectively reduced in patient fibroblasts and skeletal muscle, so the holoenzyme
              is never completed. The lesion is confined to Complex IV biogenesis: the other oxidative-phosphorylation
              complexes are unaffected.

              '
            genes:
            - preferred_term: COA5
              term:
                id: hgnc:33848
                label: COA5
            cellular_components:
            - preferred_term: mitochondrial respiratory chain complex IV
              term:
                id: GO:0045277
                label: respiratory chain complex IV
            biological_processes:
            - preferred_term: mitochondrial respiratory chain complex IV assembly
              term:
                id: GO:0033617
                label: mitochondrial respiratory chain complex IV assembly
              modifier: DECREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Impaired Terminal Electron Transfer and ATP Synthesis
        causal_link_type: DIRECT
        description: An incompletely assembled, MTCO2-deficient Complex IV cannot accept electrons from
          cytochrome c, so terminal electron transfer and the coupled proton pumping fail.
      selected_evidence:
        snippet: Histochemical analysis of skeletal muscle cryosections from the patient indicated a moderate
          CIV deficiency in all fibres
        supports: SUPPORT
