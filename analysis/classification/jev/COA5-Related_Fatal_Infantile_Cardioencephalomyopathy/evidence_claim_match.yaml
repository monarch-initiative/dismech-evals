        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: UNKNOWN
        expressivity: UNKNOWN
        description: 'Both reported families are consanguineous or closely related and segregate a homozygous
          COA5 missense allele with heterozygous, unaffected parents. Penetrance and expressivity are
          recorded as UNKNOWN rather than complete and consistent: with three affected individuals from
          two families, all carrying the same genotype, there is no unaffected-homozygote observation
          that could establish complete penetrance and no genotype contrast that could establish consistent
          expressivity. Course was fatal in all three, but the age at death differed markedly - the two
          siblings in the founding report died as neonates, whereas the 2025 patient survived to 3 months
          - which is a hint of variability rather than evidence against it.'
      selected_evidence:
        snippet: A female neonate born to second cousins of Turkish descent presented with tachypnoeic
          episodes on the first day of life
        supports: SUPPORT
