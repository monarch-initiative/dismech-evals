  6ead20d8cb815dd24ad0116fc70be35d97a72e235fb4ebf9cab7231ee7736ad6:
    claim:
      about:
        disease:
          name: COA5-Related Fatal Infantile Cardioencephalomyopathy
          disease_term:
            preferred_term: COA5-related fatal infantile cardioencephalomyopathy (CEMCOX3/MC4DN9)
            term:
              id: MONDO:0014667
              label: cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency
                3
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COA5 Loss and Arrested Early Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        biological_scale: MOLECULAR
        description: 'Biallelic COA5 (C2orf64) variants remove a small twin-CX9C Complex IV assembly factor
          that acts between maturation of the mitochondrially encoded core subunit MTCO1 and the incorporation
          of MTCO2 into the nascent enzyme. Patient fibroblasts accumulate a small assembly intermediate
          containing COX1 but lacking COX2, COX4 and COX5b, and steady-state MTCO2 is selectively reduced
          in patient fibroblasts and skeletal muscle, so the holoenzyme is never completed. The lesion
          is confined to Complex IV biogenesis: the other oxidative-phosphorylation complexes are unaffected.

          '
        genes:
        - preferred_term: COA5
          term:
            id: hgnc:33848
            label: COA5
        cellular_components:
        - preferred_term: mitochondrial respiratory chain complex IV
          term:
            id: GO:0045277
            label: respiratory chain complex IV
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Detailed analysis of complex IV assembly intermediates in patient fibroblasts by 2D-BN
          PAGE revealed the accumulation of a small assembly intermediate containing subunit COX1 but
          not the COX2, COX4, or COX5b subunits, indicating that C2orf64 is involved in an early step
          of the complex IV assembly process.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21457908
      reference_title: A mutation in C2orf64 causes impaired cytochrome c oxidase assembly and mitochondrial
        cardiomyopathy.
      evidence_source: IN_VITRO
      explanation: Directly localizes the COA5/C2orf64 lesion to an early step of Complex IV assembly,
        with a COX1-containing intermediate that fails to acquire COX2.
