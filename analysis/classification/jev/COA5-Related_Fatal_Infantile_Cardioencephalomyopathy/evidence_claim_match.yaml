          diagnosis.
        - Maternal inheritance, heteroplasmy and a mosaic pattern of COX-negative fibres favour mtDNA
          disease, whereas uniform COX deficiency in all fibres with recessive segregation favours a nuclear
          assembly-factor defect.
      selected_evidence:
        snippet: Molecular genetic testing eliminated pathogenic mitochondrial DNA (mtDNA) variants after
          a complete analysis of the mitochondrial genome.
        supports: SUPPORT
