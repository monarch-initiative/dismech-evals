        prompt: What explains variation in complex I involvement across COA6 patient tissues and experimental
          cell lines?
        rationale: The original patient had combined complex I/IV deficiency in heart and normal fibroblast
          activities, whereas the W66R patient had isolated complex IV deficiency. Engineered human cell
          studies also differ in complex I involvement. These observations establish heterogeneity; they
          do not make combined deficiency incompatible with COA6 disease. Genotype, tissue and culture
          conditions are candidate explanations, but their contributions have not been resolved.
      selected_evidence:
        snippet: However, at this point, the question as to how a loss of COA6 affects complex I remain open
          as no link between copper chaperone activity and complex I biogenesis has been observed.
