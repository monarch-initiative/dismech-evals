              the alleles appeared in one summarising sentence with none of that detail - and that was
              wrong; the detail was in PMID:31851937, a source this entry already cites. Note that COA6
              has a substantial recent oncology literature as a prognostic and metabolic gene in several
              carcinomas; those papers are about the gene, not about this disease, and should not be read
              into this entry.'
          role: ancestor
