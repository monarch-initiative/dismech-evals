                4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COA6 Loss and Failure of Thiol-Disulfide Reduction
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function COA6 variants remove a small twin-CX9C intermembrane-space
          protein whose coiled-coil-helix-coiled-coil-helix fold is redox-active. COA6 reduces the copper-coordinating
          disulfides of its client proteins SCO1 and COX2, which is what permits copper binding in the
          oxidizing intermembrane space. On the best-supported reading this node is a failure to prepare
          the copper-accepting cysteines rather than a failure to deliver copper. That reading is not
          unanimous: COA6 binds copper in vitro, a crystal structure assigns one of its disulfides a likely
          copper-binding site, and a metallochaperone role has also been proposed. See the discussion
          attached to this node.

          '
        genes:
        - preferred_term: COA6
          term:
            id: hgnc:18025
            label: COA6
        cellular_components:
        - preferred_term: mitochondrial intermembrane space
          term:
            id: GO:0005758
            label: mitochondrial intermembrane space
        molecular_functions:
        - preferred_term: protein-disulfide reductase activity
          modifier: DECREASED
          term:
            id: GO:0015035
            label: protein-disulfide reductase activity
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
      selected_evidence:
        snippet: we have solved the solution structure of COA6, which reveals a coiled-coil-helix-coiled-coil-helix
          domain typical of redox-active proteins found in the mitochondrial inter-membrane space
        supports: SUPPORT
    origin:
