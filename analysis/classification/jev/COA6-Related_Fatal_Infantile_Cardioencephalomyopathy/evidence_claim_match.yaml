        description: Engineered COA6-null HEK293T lines test complete loss of the protein. The 2015 study
          reported a prominent complex IV defect; the 2020 line had combined I/IV deficiency, reduced
          membrane potential and impaired potential-dependent protein import. These lines should not be
          assumed to have identical downstream phenotypes.
        modeled_mechanisms:
        - target: Cytochrome c Oxidase Deficiency
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Engineered human cells demonstrate complex IV deficiency after COA6 loss. Additional
            complex I involvement and protein-import consequences depend on the model.
          limitations: The kidney-derived transformed line does not model cardiac tissue. Engineered null
            alleles differ from the reported missense/truncating combinations, and residual protein or
            function is allele-dependent.
          divergences:
          - divergence_type: CAUSE_UNREPRESENTED
            materiality: QUALIFYING
            description: Engineered gene deletion does not recreate the specific biallelic patient variants
              or their allele-dependent residual function.
      selected_evidence:
        snippet: In summary, in the absence of COA6, the import routes that depend on the inner membrane
          potential are affected. However, the membrane potential independent import into the intermembrane
          space via MIA40 was not reduced but rather stimulated.
        supports: SUPPORT
        directness: DIRECT
