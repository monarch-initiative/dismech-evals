        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#COA6 Loss and Failure of Thiol-Disulfide Reduction
        - pathophysiology#Impaired CuA Metallation of COX2
        prompt: Does COA6 act purely as a disulfide reductase on the copper relay, or does it also carry
          copper itself?
        rationale: This entry models the lesion as a failure of thiol-disulfide reduction, because that
          is the best-supported reading and the one the structural and functional work converges on. It
          is not unanimous, and the entry should not be read as settling it. The same papers that establish
          the reductase activity also report that COA6 binds copper in vitro; a crystal structure assigns
          one of its two disulfides a likely copper-binding site; and a critical review of the pathway
          states plainly that a discrepancy remains and that a metallochaperone role has also been proposed.
          The two are not mutually exclusive - a protein can reduce a client cysteine and hold a metal
          - and the disease model is unchanged either way, since both readings put the lesion at CuA-site
          formation on COX2. It matters for how the node is described and for anyone reasoning from this
          entry about why copper supplementation helps.
      selected_evidence:
        snippet: Its role as a copper metallochaperone has also been proposed.
        supports: SUPPORT
