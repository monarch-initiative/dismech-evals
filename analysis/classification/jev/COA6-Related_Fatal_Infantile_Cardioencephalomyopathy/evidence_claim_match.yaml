        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Cytochrome c Oxidase Deficiency
        - biochemical#Cytochrome c oxidase (Complex IV) activity
        prompt: Is the respiratory chain lesion in COA6 deficiency isolated to Complex IV, or does it
          also involve Complex I?
        rationale: 'The index patient was reported with isolated Complex IV deficiency, and the disorder
          is classified in the isolated-COX-deficiency family on that basis. A later COA6 knockout cell
          line instead showed combined Complex I and Complex IV deficiency together with impaired membrane-potential-driven
          protein transport across the inner membrane. The two are not necessarily contradictory - a complete
          knockout may expose consequences that a hypomorphic patient allele does not, and the systems
          differ - but they are different claims about the same gene, and the classification of the disease
          rests on the first. The literature itself flags the split. Resolving it matters for diagnosis:
          a clinician told to expect isolated COX deficiency may not pursue COA6 in a patient whose enzymology
          shows a combined defect.'
      selected_evidence:
        snippet: Loss of COA6 function is associated with hypertrophic cardiomyopathy and loss of either
          complex I and IV
        supports: SUPPORT
