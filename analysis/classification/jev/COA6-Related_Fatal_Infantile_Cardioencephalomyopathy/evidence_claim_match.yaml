  98119ef72d701936b2936bb43f3db3d28328c7f5f2e1c9b72edcf89df6a9406a:
    claim:
      about:
        disease:
          name: COA6-Related Fatal Infantile Cardioencephalomyopathy
          disease_term:
            preferred_term: COA6-related fatal infantile cardioencephalomyopathy (CEMCOX4/MC4DN13)
            term:
              id: MONDO:0014668
              label: cardioencephalomyopathy, fatal infantile, due to cytochrome c oxidase deficiency
                4
        context: []
      assertion_type: Genetic
      assertion:
        name: COA6
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: COA6
          term:
            id: hgnc:18025
            label: COA6
        notes: 'COA6 (formerly C1orf31) encodes a small twin-CX9C intermembrane-space thiol-disulfide
          oxidoreductase. Reported disease variants affect the conserved Cx9CxnCx10C cysteine motif; a
          patient missense variant was confirmed pathogenic by failure to complement in a yeast coa6-null
          strain. Three patient alleles from two unrelated families are recorded below as structured variant
          records: W59C and E87* in compound heterozygosity in one patient, and W66R in homozygosity in
          the other. Zygosity, per-allele phenotype and per-allele functional data are all available across
          the cached sources, which is why these are structured records rather than a prose mention. An
          earlier draft of this entry asserted the opposite - that the alleles appeared in one summarising
          sentence with none of that detail - and that was wrong; the detail was in PMID:31851937, a source
          this entry already cites. Note that COA6 has a substantial recent oncology literature as a prognostic
          and metabolic gene in several carcinomas; those papers are about the gene, not about this disease,
          and should not be read into this entry.'
        variants:
        - name: W59C
          description: 'Missense variant in the first helix of COA6, carried in compound heterozygosity
            with E87* by a patient with hypertrophic obstructive cardiomyopathy. Functionally the mildest
            of the three: it partially restores CcO activity and COX2 levels when expressed in patient
            fibroblasts, and it is the allele with a solved structure, where disulfide-mediated oligomerization
            explains the loss of function.'
          gene:
            preferred_term: COA6
            term:
              id: hgnc:18025
              label: COA6
          clinical_significance: PATHOGENIC
          type: missense_variant
        - name: E87*
          description: Nonsense variant carried in compound heterozygosity with W59C in the same patient.
            Written E87X in one of the cited sources; the entry uses each source's own notation inside
            the sentence it quotes.
          gene:
            preferred_term: COA6
            term:
              id: hgnc:18025
              label: COA6
          clinical_significance: PATHOGENIC
          type: nonsense_variant
        - name: W66R
          description: 'Homozygous missense variant in the first helix, carried by the patient with neonatal
            hypertrophic cardiomyopathy, muscular hypotonia and lactic acidosis. Functionally the most
            severe of the three: unlike W59C it fails to rescue CcO activity at all.'
          gene:
            preferred_term: COA6
            term:
              id: hgnc:18025
              label: COA6
          clinical_significance: PATHOGENIC
          type: missense_variant
      selected_evidence:
        snippet: Using yeast coa6Δ cells, we show that conserved residues in the motif, including the
          residue mutated in a patient with mitochondrial disease, are essential for COA6 function, thus
          confirming the pathogenicity of the patient mutation.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
