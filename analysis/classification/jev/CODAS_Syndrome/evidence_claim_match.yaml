      assertion_type: AnimalModel
      assertion:
        name: Lonp1 heterozygous knockout mouse
        species: Mouse
        genotype: Lonp1 wt/- (heterozygous null)
        publication: PMID:32521756
        description: Lonp1 was ablated in mice. Homozygous null animals are not viable; heterozygous animals
          grow normally but have swollen, enlarged mitochondria, reduced Tfam and mtDNA, and lower respiration
          in embryonic fibroblasts.
        modeled_mechanisms:
        - target: Abnormal Mitochondrial Ultrastructure
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: Heterozygous enterocytes and fibroblasts show swollen, enlarged mitochondria with
            simplified cristae.
          limitations: A heterozygous null halves Lon dosage, whereas CODAS results from biallelic hypomorphic
            missense variants; the mice have no skeletal, lens, dental or ear phenotype, and the findings
            are in enterocytes and embryonic fibroblasts rather than affected tissues.
        - target: Reduced Mitochondrial Respiratory Capacity
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: Heterozygous embryonic fibroblasts have lower basal oxygen consumption and fewer
            respiratory complexes.
          limitations: Measured in embryonic fibroblasts from a heterozygous null, not a CODAS missense
            allele; reduced mtDNA in the model contrasts with the absence of consistent mtDNA depletion
            in patient blood.
      selected_evidence:
        snippet: The homozygous Lonp-/- mouse was not vital, while the heterozygous Lonp1wt/- showed similar
          growth rate, weight, length, life-span and histologic features as wild type.
        supports: SUPPORT
