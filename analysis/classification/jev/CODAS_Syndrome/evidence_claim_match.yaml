        kind: KNOWLEDGE_GAP
        prompt: Why does a defect in a ubiquitous mitochondrial matrix protease produce lens, dental,
          middle-ear and skeletal malformations that are atypical of mitochondrial disease?
        attaches_to:
        - pathophysiology#Reduced Mitochondrial Respiratory Capacity
        - pathophysiology#Spondyloepimetaphyseal Dysplasia
        rationale: Patient cells show selective MT-CO2 aggregation and reduced spare respiratory capacity,
          but no mtDNA depletion, and the discovery paper notes that cataracts, skeletal and dental abnormalities
          and conductive hearing loss are atypical of mitochondrial disease. Other biallelic LONP1 genotypes
          give a classical mitochondrial encephalomyopathy without these features, and variant position
          appears to track phenotype. Which Lon substrates or non-proteolytic functions matter in chondrocytes,
          lens and tooth development is unknown, so every edge from the mitochondrial node to a developmental
          phenotype in this entry is recorded as having unknown intermediates.
      selected_evidence:
        snippet: several CODAS manifestations, including postnatal cataracts, skeletal and dental abnormalities,
          and conductive hearing loss, are atypical of mitochondrial disease
