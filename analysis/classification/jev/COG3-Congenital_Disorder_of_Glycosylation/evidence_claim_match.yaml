  d292d781306b3d89980df9631bffa500713ee7408bf41730f1907ccadfae5018:
    claim:
      about:
        disease:
          name: COG3-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: COG3-Congenital Disorder of Glycosylation
            term:
              id: MONDO:0957820
              label: congenital disorder of glycosylation, type IIbb
        context: []
      assertion_type: Genetic
      assertion:
        name: COG3
        notes: 'COG3 (13q14) encodes a lobe A subunit of the conserved oligomeric Golgi complex. Two homozygous
          missense alleles are reported, NM_031431.4 c.109G>C p.(Asp37His) (Pakistani family) and c.124T>C
          p.(Ser42Pro) (Egyptian family), adjacent residues in a conserved N-terminal alpha-helix that
          mediates lobe A subunit assembly. Fibroblast studies were possible only for p.Ser42Pro. In the
          Pakistani family a 33-year-old heterozygous brother had mild intellectual disability and seizures,
          and the proband was also homozygous for an SCN4A variant of uncertain significance; both observations
          are unexplained.

          '
        gene_term:
          preferred_term: COG3
          term:
            id: hgnc:18619
            label: COG3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: 'Family-based ES analysis and Sanger dideoxy DNA sequencing in these two families identified
          two different rare, homozygous COG3 missense variant alleles, NM_031431.4: c.124T>C, p.(Ser42Pro)
          and NM_031431.4: c.109G>C, p.(Asp37His), that co-segregated with the disease phenotypes in each
          family'
        supports: SUPPORT
    origin:
