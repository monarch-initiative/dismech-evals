      assertion_type: Genetic
      assertion:
        name: COG4
        notes: Reported recessive genotypes include p.Arg729Trp with a deletion in trans, p.Glu233Ter
          with p.Leu773Arg, p.Glu419Ter with p.Cys314Tyr, and homozygous c.1647+5G>A. The latter causes
          exon 12 skipping in blood RNA, with a frameshift predicted to introduce a premature stop; this
          assay does not establish complete loss of protein in every tissue. The p.Arg729Trp substitution
          affects a structurally important C-terminal region. Dominant p.Gly516Arg causes the separate
          Saul-Wilson syndrome.
        gene_term:
          preferred_term: COG4
          term:
            id: hgnc:18620
            label: COG4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Here we present data identifying a previously reported CDG-IIx case from Singapore as
          a new COG4 patient with 2 novel mutations leading to p.E233X and p.L773R; with p.E233X being
          a de novo mutation.
        supports: SUPPORT
