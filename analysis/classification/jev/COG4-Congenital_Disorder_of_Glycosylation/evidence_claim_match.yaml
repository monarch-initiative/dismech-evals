  0c4223aa2026c3b446408111d7fbef3278faae8b5c82d1fed9f677521a6958da:
    claim:
      about:
        disease:
          name: COG4-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: COG4-congenital disorder of glycosylation
            term:
              id: MONDO:0013281
              label: COG4-congenital disorder of glycosylation
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: COG4-knockout RPE1 and HEK293T cells complemented with p.Arg729Trp
        experimental_model_type: CELL_LINE
        description: CRISPR COG4 knockouts were complemented by lentiviral myc-tagged wild-type or mutant
          COG4 under a cloned COG4 promoter. The p.Arg729Trp constructs restored many knockout abnormalities
          while retaining an N-glycosylation defect. These are complemented knockout backgrounds, not
          endogenous-locus patient-genotype knock-ins.
        modeled_mechanisms:
        - target: Abnormal N-glycan processing
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: p.Arg729Trp cells show increased GNL binding consistent with abnormal N-glycosylation.
          limitations: Tagged constructs in engineered non-patient backgrounds; lectin binding is a glycan-class
            readout and does not reproduce every serum glycan or clinical phenotype.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: Cultured cells lack the neuronal, hepatic and systemic context required to explain
              the clinical disorder.
        - target: Altered Golgi ultrastructure
          relationship: FAILS_TO_RECAPITULATE
          model_scale: CELLULAR
          limitations: Normal Golgi stack morphology in these engineered point-mutant cells contrasts
            with patient-fibroblast disruption.
        findings:
        - statement: p.Arg729Trp restored B4GalT1 abundance and Lamp2/TMEM165 glycosylation in the tested
            knockout backgrounds.
        - statement: GS15 localization and abundance were not significantly altered in the rescued point-mutant
            lines.
        - statement: Heparan sulfate proteoglycan core-protein accumulation was increased in p.Arg729Trp
            and p.Gly516Arg lines; this alone did not explain the distinct Saul-Wilson phenotype.
      selected_evidence:
        snippet: Using a combination of CRISPR/Cas9 and lentiviral transduction technologies, both myc-tagged
          wild-type and mutant (G516R and R729W) COG4 proteins were expressed under the endogenous COG4
          promoter.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/1
      evidence_path: /experimental_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34603392
      reference_title: Development and Initial Characterization of Cellular Models for COG Complex-Related
        CDG-II Diseases.
      evidence_source: IN_VITRO
      explanation: Documents knockout plus lentiviral complementation with promoter-controlled constructs;
        it does not by itself exclude expression-system artifacts.
