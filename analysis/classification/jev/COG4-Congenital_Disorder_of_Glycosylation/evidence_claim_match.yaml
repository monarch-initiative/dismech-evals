            term:
              id: MONDO:0013281
              label: COG4-congenital disorder of glycosylation
        context: []
      assertion_type: Genetic
      assertion:
        name: COG4
        notes: 'COG4 (16q22.1) encodes a subunit of lobe A of the conserved oligomeric Golgi complex.
          Reported recessive alleles include p.R729W with a submicroscopic deletion in trans, the compound
          p.E233X and p.L773R pair, and a homozygous c.1647+5G>A founder splice variant that causes exon
          12 skipping and a frameshift. The same gene causes Saul-Wilson syndrome through an entirely
          different mechanism: a single recurrent heterozygous de novo p.Gly516Arg substitution that leaves
          COG4 mRNA and protein levels intact.

          '
        gene_term:
          preferred_term: COG4
          term:
            id: hgnc:18620
            label: COG4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: We report a new CDG-II patient harbouring a p.R729W missense mutation in COG4 combined
          with a submicroscopical deletion.
        supports: SUPPORT
    origin:
