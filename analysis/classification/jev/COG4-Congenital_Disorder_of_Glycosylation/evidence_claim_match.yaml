      assertion_type: DifferentialDiagnosis
      assertion:
        name: Saul-Wilson syndrome (COG4, dominant)
        description: 'The critical differential, because it is the same gene. Saul-Wilson is a primordial
          dwarfism with preserved-to-mildly-affected intellect, caused by a single recurrent heterozygous
          de novo p.Gly516Arg substitution. Its cells have normal COG4 mRNA and protein and show accelerated
          retrograde recycling, the opposite direction of transport change to the delay seen in COG4-CDG.
          The two are separate diseases sharing a locus, not two severities of one lesion, which is why
          they are curated as separate entries.

          '
      selected_evidence:
        snippet: All affected subjects harbored heterozygous de novo variants in COG4, giving rise to
          the same recurrent amino acid substitution (p.Gly516Arg).
