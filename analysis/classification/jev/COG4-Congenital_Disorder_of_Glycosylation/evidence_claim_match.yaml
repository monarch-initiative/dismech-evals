              label: COG4-congenital disorder of glycosylation
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: COG4-CDG patient fibroblasts
        experimental_model_type: PRIMARY_CELL_CULTURE
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        description: Primary fibroblasts from the founding compound-heterozygous patients model COG4 protein
          abundance, BFA-induced retrograde trafficking and glycan biosynthesis. Wild-type COG4 viral
          complementation did not restore a normal BFA response in the tested patient cells. Increasing
          COG4 expression also impaired the BFA response in control fibroblasts in the founding study.
        modeled_mechanisms:
        - target: Delayed Golgi retrograde transport
          relationship: RECAPITULATES
          model_scale: CELLULAR
          fidelity: MODERATE
          limitations: BFA redistributes Golgi proteins pharmacologically; the assay does not isolate
            every physiological tethering or fusion step, and fibroblasts do not establish organ-specific
            mechanisms.
          divergences:
          - divergence_type: BOUNDARY_OMISSION
            materiality: QUALIFYING
            description: Cultured cells lack the neuronal, hepatic and systemic context required to explain
              the clinical disorder.
        - target: Abnormal O-glycan processing
          relationship: PARTIALLY_RECAPITULATES
          model_scale: CELLULAR
          fidelity: MODERATE
          limitations: GAP is an artificial acceptor of glycan biosynthesis; products mimic glycan chains
            but do not enumerate native glycoprotein substrates.
      selected_evidence:
        snippet: To our surprise transduction of patient fibroblasts with the wild-type COG4 did not restore
          the normal BFA response even using various viral titers or infection times.
        supports: SUPPORT
        directness: DIRECT
    origin:
