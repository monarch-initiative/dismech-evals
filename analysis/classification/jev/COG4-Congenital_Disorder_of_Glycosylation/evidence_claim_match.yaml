        kind: KNOWLEDGE_GAP
        prompt: Does altered autophagy contribute to recessive COG4-CDG?
        attaches_to:
        - pathophysiology#Biallelic COG4 dysfunction
        rationale: A pooled all-COG-CDG phenotype study proposed an autophagy connection to episodic fever.
          It did not demonstrate reduced autophagic flux or a fever mechanism in COG4 patients. Pooled
          phenotype frequencies and specificity rankings cannot establish COG4-specific rates.
      selected_evidence:
        snippet: The links between episodic fever and autophagy, and autophagy and the COG complex suggest
          that episodic fever in COG‐CDG patients, unlike other COG‐CDG phenotypic features caused by
          the disrupted glycosylation process, might be caused by disruption of its function in the autophagy
          pathway. The veracity of this hypothesis remains to be further elucidated.
        supports: SUPPORT
        directness: INDIRECT
