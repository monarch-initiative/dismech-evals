            term:
              id: MONDO:0013281
              label: COG4-congenital disorder of glycosylation
        context: []
      assertion_type: Genetic
      assertion:
        name: COG4
        notes: Reported recessive genotypes include p.Arg729Trp with a deletion in trans, p.Glu233Ter
          with p.Leu773Arg, p.Glu419Ter with p.Cys314Tyr, and homozygous c.1647+5G>A. The latter causes
          exon 12 skipping in blood RNA, with a frameshift predicted to introduce a premature stop; this
          assay does not establish complete loss of protein in every tissue. The p.Arg729Trp substitution
          affects a structurally important C-terminal region. Dominant p.Gly516Arg causes the separate
          Saul-Wilson syndrome.
        gene_term:
          preferred_term: COG4
          term:
            id: hgnc:18620
            label: COG4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: Arg 729 is found to occupy a key position at the center of a salt bridge network, thereby
          stabilizing Cog4's small C-terminal domain.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/4
      context_paths:
      - /name
      - /disease_term
