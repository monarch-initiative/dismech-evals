            term:
              id: MONDO:0013281
              label: COG4-congenital disorder of glycosylation
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Recessive
        description: Biallelic COG4 variants cause the recessive disorder. Reported configurations include
          missense/deletion, nonsense/missense and homozygous splice-altering genotypes. A de novo allele
          can occur as one member of a recessive compound-heterozygous genotype; this differs from the
          dominant p.Gly516Arg mechanism of Saul-Wilson syndrome. When both parents carry a pathogenic
          recessive allele, standard Mendelian counseling gives each pregnancy a 25% affected, 50% carrier
          and 25% unaffected noncarrier probability. This assumes confirmed parental carrier status; the
          reported de novo compound-heterozygous configuration requires family-specific assessment.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: At conception, each sib of an affected individual has a 25% chance of being affected,
          a 50% chance of being an asymptomatic ... carrier ... and a 25% chance of being unaffected and
          not a carrier.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/2
      context_paths:
      - /name
      - /disease_term
