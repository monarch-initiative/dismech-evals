  3863086542ecef81dab4b4598e9741ef4be37da361c2c4b63ffbcea9cb018e35:
    claim:
      about:
        disease:
          name: COG4-Congenital Disorder of Glycosylation
          disease_term:
            preferred_term: COG4-congenital disorder of glycosylation
            term:
              id: MONDO:0013281
              label: COG4-congenital disorder of glycosylation
        context: []
      assertion_type: Genetic
      assertion:
        name: COG4
        notes: 'COG4 (16q22.1) encodes a subunit of lobe A of the conserved oligomeric Golgi complex.
          Reported recessive alleles include p.R729W with a submicroscopic deletion in trans, the compound
          p.E233X and p.L773R pair, and a homozygous c.1647+5G>A founder splice variant that causes exon
          12 skipping and a frameshift. The same gene causes Saul-Wilson syndrome through an entirely
          different mechanism: a single recurrent heterozygous de novo p.Gly516Arg substitution that leaves
          COG4 mRNA and protein levels intact.

          '
        gene_term:
          preferred_term: COG4
          term:
            id: hgnc:18620
            label: COG4
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: We report a new CDG-II patient harbouring a p.R729W missense mutation in COG4 combined
          with a submicroscopical deletion.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19494034
      reference_title: Golgi function and dysfunction in the first COG4-deficient CDG type II patient.
      evidence_source: HUMAN_CLINICAL
      explanation: The founding report identifying COG4 as the cause of this CDG subtype, and the genotype
