          disease_term:
            preferred_term: COG4-congenital disorder of glycosylation
            term:
              id: MONDO:0013281
              label: COG4-congenital disorder of glycosylation
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Saul-Wilson syndrome (COG4, dominant)
        description: 'The critical differential, because it is the same gene. Saul-Wilson is a primordial
          dwarfism with preserved-to-mildly-affected intellect, caused by a single recurrent heterozygous
          de novo p.Gly516Arg substitution. Its cells have normal COG4 mRNA and protein and show accelerated
          retrograde recycling, the opposite direction of transport change to the delay seen in COG4-CDG.
          The two are separate diseases sharing a locus, not two severities of one lesion, which is why
          they are curated as separate entries.

          '
      selected_evidence:
        snippet: Affected individuals' fibroblasts, whose COG4 mRNA and protein were not decreased, exhibited
          delayed anterograde vesicular trafficking from the ER to the Golgi and accelerated retrograde
          vesicular recycling from the Golgi to the ER.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30290151
      reference_title: A Recurrent De Novo Heterozygous COG4 Substitution Leads to Saul-Wilson Syndrome,
        Disrupted Vesicular Trafficking, and Altered Proteoglycan Glycosylation.
      evidence_source: IN_VITRO
      explanation: 'The mechanistic contrast that carries the lump/split argument: normal COG4 levels
        and accelerated rather than delayed retrograde transport.'
