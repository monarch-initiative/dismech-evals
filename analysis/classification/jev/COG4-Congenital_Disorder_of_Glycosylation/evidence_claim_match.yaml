      assertion_type: Pathophysiology
      assertion:
        name: Reduced COG4 Expression
        biological_scale: MOLECULAR
        description: 'Biallelic COG4 variants reduce COG4 protein. Full complex formation is still achieved
          but at a lower level, so the lesion is quantitative rather than an absolute failure to assemble.
          Whether the loss also propagates to the expression or stability of the other lobe A subunits
          is contested and is deliberately not asserted here: PMID:19494034 reports that it does and PMID:21185756
          reports that the other subunits are unaffected. The conflict is recorded in the cog4cdg_conflicting_subunit_effects
          discussion.

          '
        gene:
          preferred_term: COG4
          term:
            id: hgnc:18620
            label: COG4
      selected_evidence:
        snippet: The resulting downregulation of COG4 expression additionally affects expression or stability
          of other lobe A subunits.
        supports: SUPPORT
