      assertion_type: Pathophysiology
      assertion:
        name: Hyperinflammatory episodes and hemophagocytic lymphohistiocytosis
        biological_scale: ORGANISM
        description: COG6- and COG7-deficient patients experience recurrent, poorly tolerated febrile
          episodes with biological features of hemophagocytic lymphohistiocytosis. In the reported series
          these flares were followed in two of three patients by neurological deterioration and new-onset
          epilepsy, so the inflammatory arm is not merely intercurrent illness but a driver of the neurological
          course. A systematic review found unexplained recurrent fever in roughly 40% of published COG-deficiency
          patients, with only one further fully documented HLH case, so the syndrome is probably underdiagnosed
          rather than rare.
        role: consequence
        biological_processes:
        - preferred_term: inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
        - preferred_term: macrophage activation
          modifier: INCREASED
          term:
            id: GO:0042116
            label: macrophage activation
      selected_evidence:
        snippet: All three patients experienced recurrent febrile episodes associated with biological
          features of HLH.
        supports: SUPPORT
