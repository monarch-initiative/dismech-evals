              label: COG8-congenital disorder of glycosylation
        context: []
      assertion_type: Genetic
      assertion:
        name: COG8 pathogenic variants
        association: Causal
        relationship_type: CAUSATIVE
        presence: Pathogenic
        gene_term:
          preferred_term: COG8
          term:
            id: hgnc:18623
            label: COG8
        notes: COG8 encodes the lobe B subunit whose C-terminus binds Cog1 and bridges the two lobes of
          the COG complex. All reported disease alleles are truncating and cluster in or affect exon 5.
        variants:
        - name: Homozygous nonsense variant truncating the 76 C-terminal residues
          description: A homozygous nonsense change introducing a premature stop codon, leaving a Cog8
            subunit that lacks its 76 C-terminal amino acids and so cannot bind Cog1.
          clinical_significance: PATHOGENIC
        - name: Homozygous exon 5 variant creating a new splice site
          description: A homozygous variant that creates a novel splice site within exon 5, truncating
            the protein twelve residues downstream.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: We describe a new Type II congenital disorder of glycosylation (CDG-II) caused by mutations
          in the conserved oligomeric Golgi (COG) complex gene, COG8.
        supports: SUPPORT
