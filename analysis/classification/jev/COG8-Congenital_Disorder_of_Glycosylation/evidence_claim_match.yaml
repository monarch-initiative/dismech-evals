        biological_scale: CELLULAR
        conforms_to: congenital_disorder_of_glycosylation#Golgi N-Glycan Processing and Trafficking Defect
        description: The residual subcomplexes cannot tether retrograde intra-Golgi and endosome-to-Golgi
          vesicles, and cannot support assembly of the Stx5 and Stx6 Golgi SNARE complexes. COG8-deficient
          cells accumulate untethered vesicles beside dilated Golgi cisternae, and patient fibroblasts
          show slowed brefeldin A-induced Golgi-matrix redistribution, the standard functional readout
          of a retrograde trafficking block.
