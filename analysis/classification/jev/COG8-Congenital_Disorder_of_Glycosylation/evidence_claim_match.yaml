  61211886166d720ed22ce25c107fd02618271dc72de03db44a6306911cbdbfc6:
    claim:
      about:
        disease:
          name: COG8-congenital disorder of glycosylation
          disease_term:
            preferred_term: COG8-congenital disorder of glycosylation
            term:
              id: MONDO:0012635
              label: COG8-congenital disorder of glycosylation
        context: []
      assertion_type: Genetic
      assertion:
        name: COG8 pathogenic variants
        association: Causal
        relationship_type: CAUSATIVE
        presence: Pathogenic
        gene_term:
          preferred_term: COG8
          term:
            id: hgnc:18623
            label: COG8
        notes: 'Published genotypes include early and late frameshifts, a nonsense allele and splice-altering
          variants. The 2019 exon 5 hotspot suggestion does not imply that every causal allele lies there:
          an intron 3 splice donor allele is explicitly documented in the 2007 report.'
        variants:
        - name: c.1611C>G (p.Tyr537Ter)
          description: A homozygous nonsense change introducing a premature stop codon, leaving a Cog8
            subunit that lacks its 76 C-terminal amino acids and so cannot bind Cog1.
          clinical_significance: PATHOGENIC
          variant_type: single nucleotide variant
          genomic_contexts:
          - coding sequence
        - name: Homozygous exon 5 variant creating a new splice site
          description: The 2019 report describes a homozygous exon 5 splice-creating variant with a truncating
            consequence. The retrieved abstract does not establish the RNA assay or quantify residual
            protein.
          clinical_significance: PATHOGENIC
        - name: IVS3+1G>A
          variant_type: single nucleotide variant
          genomic_contexts:
          - intron
          description: Splice-donor allele reported in trans to a two-nucleotide deletion. The original
            report uses IVS3+1G>A nomenclature; this location is intron 3, not exon 5.
          clinical_significance: PATHOGENIC
        - name: c.171dupG and c.1656dupC compound-heterozygous genotype
          description: The 2017 patient carried p.Leu58Alafs*29 and p.Ala553Argfs*15, inherited from the
            respective heterozygous parents. These predicted truncations do not prove complete absence
            of COG8 protein in this patient.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: We describe a new Type II congenital disorder of glycosylation (CDG-II) caused by mutations
          in the conserved oligomeric Golgi (COG) complex gene, COG8.
        supports: SUPPORT
    origin:
