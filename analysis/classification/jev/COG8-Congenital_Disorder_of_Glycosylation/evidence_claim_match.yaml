      assertion_type: Discussion
      assertion:
        discussion_id: cog8_proteoglycan_gag_in_patient_tissue
        kind: KNOWLEDGE_GAP
        prompt: Does the reduced glycosaminoglycan modification of proteoglycans seen in COG-subunit knock-out
          cell lines occur in COG8-CDG patient tissue, and does it contribute to the skeletal and connective-tissue
          features?
        attaches_to:
        - pathophysiology#Reduced Proteoglycan Glycosaminoglycan Modification
        rationale: Proteoglycan synthesis has been characterised only in COG-knock-out HEK293T cells,
          where COG8 loss reduced glycosaminoglycan modification least among the subunits and preserved
          chain length on secreted proteoglycans. The authors propose this differential as an explanation
          for the variable severity of COG-associated CDG, which would make it directly relevant to the
          mild end of the COG8-CDG spectrum - but no patient-derived proteoglycan data exist to test it.
      selected_evidence:
        snippet: In light of the important roles PGs play in animal development, the effects KO of individual
          COG subunits have on GAG synthesis could explain the variable severity of COG associated CDGs.
        supports: SUPPORT
