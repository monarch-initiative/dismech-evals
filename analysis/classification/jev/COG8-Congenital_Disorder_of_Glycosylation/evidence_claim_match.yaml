            label: Golgi vesicle transport
        - preferred_term: SNARE complex assembly
          modifier: DECREASED
          term:
            id: GO:0035493
            label: SNARE complex assembly
        locations:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
      selected_evidence:
        snippet: Electron microscopy analysis further exposed a dilation of Golgi cisternae and accumulation
          of vesicles in the vicinity of the Golgi (Figure 1B), which possibly represent vesicles that
          failed to fuse with the Golgi membranes.
        supports: SUPPORT
