            label: fibroblast
        locations:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
      selected_evidence:
        snippet: As a result, Cog1 deficiency accompanies the Cog8 deficiency, preventing assembly of
          the intact, stable complex and resulting in the appearance of smaller subcomplexes.
        supports: SUPPORT
