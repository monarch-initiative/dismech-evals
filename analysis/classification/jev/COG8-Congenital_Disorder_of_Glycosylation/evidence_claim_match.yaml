        description: Reproduces the tethering and SNARE-assembly defect and permits the ultrastructural
          readout that patient cells were not used for.
        limitations: Acute knockdown in a transformed cell line, not the patient genotype; the authors
          note that chronic COG8 deficiency in patient cells destabilises additional subunits that acute
          knockdown does not.
