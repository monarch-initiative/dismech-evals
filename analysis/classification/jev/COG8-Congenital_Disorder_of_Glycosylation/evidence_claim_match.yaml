          reduced when any COG subunit is missing. COG8 is one of the two lobe-bridging subunits for which
          the reduction is least marked, and COG8-deficient cells retain normal glycosaminoglycan chain
          lengths on secreted proteoglycans, unlike cells lacking COG2-COG7. This is a knock-out cell-line
          result; proteoglycan synthesis has not been reported in COG8-CDG patient material.
        biological_processes:
