        description: 'Non-ocular Stickler syndrome caused by heterozygous COL11A2 mutations, typically
          splice-site mutations producing in-frame exon skipping with a dominant-negative effect. Features
          include mild spondyloepiphyseal dysplasia, sensorineural hearing loss, midface hypoplasia, and
          early-onset osteoarthritis. No ocular involvement.

          '
      selected_evidence:
        snippet: an autosomal dominant form of Stickler syndrome, characterized by mild spondyloepiphyseal
          dysplasia, osteoarthritis, and sensorineural hearing loss, but no eye involvement, is caused
          by a splice donor site mutation resulting in "in-frame" exon skipping within the COL11A2 gene
        supports: SUPPORT
