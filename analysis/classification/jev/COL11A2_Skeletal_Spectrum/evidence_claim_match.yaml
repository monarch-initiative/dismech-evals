      assertion_type: Subtype
      assertion:
        name: OSMED
        display_name: OSMED (Autosomal Recessive)
        description: 'Otospondylomegaepiphyseal dysplasia caused by biallelic COL11A2 loss-of-function
          mutations. A more severe phenotype with profound sensorineural hearing loss, disproportionate
          short limbs, enlarged epiphyses, platyspondyly, cleft palate, and severe midface hypoplasia.
          Also known as Weissenbacher-Zweymuller syndrome in neonatal presentation.

          '
      selected_evidence:
        snippet: We conclude that the OSMED phenotype is highly homogenous and results from homozygosity
          or compound heterozygosity for COL11A2 mutations, most of which are predicted to cause complete
          absence of alpha2(XI) chains.
        supports: SUPPORT
