          value:
            name: COL11A2 Dominant-Negative Disruption of Type XI Collagen
            description: 'In Stickler syndrome type III, heterozygous splice-site mutations in COL11A2
              cause in-frame exon skipping, producing shortened but partially functional alpha-2(XI) chains.
              These abnormal chains are incorporated into type XI collagen heterotrimers, exerting a dominant-negative
              effect that disrupts normal collagen fibril organization in cartilage, bone, and the inner
              ear. The structural compromise is sufficient to cause spondyloepiphyseal changes, progressive
              osteoarthritis, and sensorineural hearing loss, but is milder than complete loss of function.
              COL11A2 is not expressed in the vitreous, explaining the absence of ocular findings.

              '
            gene:
              preferred_term: COL11A2
              description: 'Collagen type XI alpha-2 chain. Dominant-negative mutations produce structurally
                abnormal chains that disrupt collagen XI assembly in cartilage and inner ear.

                '
