      assertion_type: Pathophysiology
      assertion:
        name: HAQ STING dominant suppression of STING signalling
        description: 'The common HAQ haplotype of STING1 (R71H/G230A/R293Q) dominantly dampens STING signalling.
          When co-inherited with a pathogenic COPA variant, HAQ STING fully prevents the constitutive
          STING activation that drives type I interferon signalling and provides complete clinical protection
          in carriers, accounting for much of the observed incomplete penetrance.

          '
        genes:
        - preferred_term: STING1
          term:
            id: hgnc:27962
            label: STING1
        biological_processes:
        - preferred_term: cGAS/STING signaling pathway
          term:
            id: GO:0140896
            label: cGAS/STING signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Expressing HAQ STING in patient cells rescued the molecular phenotype of COPA syndrome.
        supports: SUPPORT
