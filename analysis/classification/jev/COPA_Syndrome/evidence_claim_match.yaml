  1850726343b8e55859bca753b5661bae05d5d7955adcdd8792257b574abb1017:
    claim:
      about:
        disease:
          name: COPA Syndrome
          disease_term:
            preferred_term: COPA syndrome
            term:
              id: MONDO:0014629
              label: autoimmune interstitial lung disease-arthritis syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: COPA
        gene_term:
          preferred_term: COPA
          term:
            id: hgnc:2230
            label: COPA
        association: Causative
        relationship_type: CAUSATIVE
        presence: PRESENT
        inheritance:
        - name: Autosomal dominant
        notes: 'Heterozygous pathogenic COPA variants are the cause of COPA syndrome. Classical disease
          variants are missense changes in the N-terminal WD40 cargo-recognition domain (recurrent residues
          include Lys230, Arg233, Glu241, Asp243, and Val242), which impair binding of dilysine ER-retrieval
          cargo. A second variant class affects the C-terminal domain (e.g., p.Cys1013Ser, p.Arg1058Cys,
          p.Arg1142X) and disrupts COPI integrity, producing a clinically similar but mechanistically
          distinct phenotype.

          '
      selected_evidence:
        snippet: We identified four unique deleterious variants in the COPA gene (encoding coatomer subunit
          α) affecting the same functional domain.
        supports: SUPPORT
