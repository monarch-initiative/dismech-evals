            label: STING1
        association: Non-causal protective haplotype that prevents clinical penetrance
        relationship_type: PROTECTIVE
        presence: PRESENT
        notes: 'STING1 is not a causal COPA syndrome gene. The common HAQ STING haplotype (R71H/G230A/R293Q
          in STING1) is represented here only as a dominant protective modifier: when co-inherited with
          a pathogenic COPA variant, HAQ STING dampens STING signalling and provides complete clinical
          protection. It accounts for much of the ~15-20% nonpenetrance observed in COPA syndrome families
          and motivates STING-directed gene therapy strategies.

          '
      selected_evidence:
        snippet: We show that the common HAQ STING allele mediates complete clinical protection.
        supports: SUPPORT
