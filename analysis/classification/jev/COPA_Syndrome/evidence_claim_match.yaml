        context: []
      assertion_type: Genetic
      assertion:
        name: COPA
        gene_term:
          preferred_term: COPA
          term:
            id: hgnc:2230
            label: COPA
        association: Causative
        relationship_type: CAUSATIVE
        presence: PRESENT
        inheritance:
        - name: Autosomal dominant
        notes: 'Heterozygous pathogenic COPA variants are the cause of COPA syndrome. Classical disease
          variants are missense changes in the N-terminal WD40 cargo-recognition domain (recurrent residues
          include Lys230, Arg233, Glu241, Asp243, and Val242), which impair binding of dilysine ER-retrieval
          cargo. A second variant class affects the C-terminal domain (e.g., p.Cys1013Ser, p.Arg1058Cys,
          p.Arg1142X) and disrupts COPI integrity, producing a clinically similar but mechanistically
          distinct phenotype.

          '
      selected_evidence:
        snippet: We described 3 heterozygous mutations in the C-terminal domain (CTD) of COPA (p.C1013S,
          p.R1058C, and p.R1142X) in 6 children from 3 unrelated families with a similar syndrome of autoinflammation
          and autoimmunity.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
