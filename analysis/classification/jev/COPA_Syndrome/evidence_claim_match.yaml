        name: C-terminal domain
        display_name: COPA C-terminal domain (CTD) variants
        description: 'A clinically similar but mechanistically distinct subtype caused by heterozygous
          variants in the COPA C-terminal domain (e.g., p.Cys1013Ser, p.Arg1058Cys, p.Arg1142X). CTD mutations
          disrupt COPI integrity and cause both anterograde ER-to-Golgi and retrograde Golgi-to-ER trafficking
          defects, with cGAS/STING-dependent type I IFN upregulation accompanied by prominent ER stress
          and NF-kappaB activation.

          '
      selected_evidence:
        snippet: We described 3 heterozygous mutations in the C-terminal domain (CTD) of COPA (p.C1013S,
          p.R1058C, and p.R1142X) in 6 children from 3 unrelated families with a similar syndrome of autoinflammation
          and autoimmunity.
        supports: SUPPORT
