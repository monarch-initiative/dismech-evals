        context: []
      assertion_type: Subtype
      assertion:
        name: WD40 domain
        display_name: COPA WD40 domain (N-terminal) variants
        description: 'Classical COPA syndrome caused by heterozygous missense variants in the N-terminal
          WD40 cargo-recognition domain of coatomer subunit alpha (e.g., p.Glu241Lys, p.Arg233His, p.Val242Gly).
          These variants impair binding of dilysine ER-retrieval cargo and SURF4-mediated STING retrieval,
          causing ligand-independent STING activation at the Golgi and a constitutive type I interferon
          signature.

          '
      selected_evidence:
        snippet: We identified four unique deleterious variants in the COPA gene (encoding coatomer subunit
          α) affecting the same functional domain.
        supports: SUPPORT
