          mitochondria-rich and cannot be replaced, which is the standard explanation for why CoQ biosynthesis
          defects present as steroid-resistant nephrotic syndrome rather than as a tubulopathy. Kidney
          involvement is the hallmark manifestation of the nephropathic CoQ deficiencies, and in COQ2
          it is often the presenting problem.
