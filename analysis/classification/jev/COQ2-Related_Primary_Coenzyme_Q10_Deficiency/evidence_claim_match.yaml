      assertion:
        name: COQ2 Polyprenyltransferase Deficiency
        biological_scale: MOLECULAR
        description: 'Biallelic COQ2 variants reduce the activity of the mitochondrial polyprenyltransferase
          that condenses 4-hydroxybenzoate with the polyisoprenoid tail. The protein localises to mitochondria
          with its C-terminus facing the intermembrane space. Residual activity is not all-or-nothing:
          yeast complementation across the reported allelic series grades each mutant, and that grade
          predicts the patient''s phenotype.'
        molecular_functions:
        - preferred_term: prenyltransferase activity
          modifier: DECREASED
          term:
            id: GO:0004659
            label: prenyltransferase activity
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Our findings show that the main functional transcript of COQ2 is shorter than what was
          previously reported and that its protein product localizes to mitochondria with the C-terminus
          facing the intermembrane space.
        supports: SUPPORT
