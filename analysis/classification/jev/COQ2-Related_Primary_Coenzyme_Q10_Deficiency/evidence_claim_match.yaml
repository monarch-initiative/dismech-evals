        context: []
      assertion_type: Treatment
      assertion:
        name: 4-hydroxybenzoic acid substrate enhancement
        description: 'An experimental substrate-enhancement strategy. 4-HBA is the natural substrate of
          COQ2, and raising its availability is proposed to compensate for defective substrate delivery
          and drive residual enzyme activity, restoring endogenous rather than supplying exogenous CoQ.
          In a mouse carrying the Coq2A252V variant, lifelong 4-HBA prevented mitochondrial encephalopathy
          where conventional CoQ10 did not, and withdrawal caused progressive neurological decline.

          On the strength of that, a first-in-human individual therapeutic trial was started in a 3-year-old
          boy with biallelic COQ2 variants and a Leigh-like syndrome who had responded minimally to high-dose
          CoQ10. Over six months he had sustained remission of proteinuria, rising serum CoQ10, and gains
          in motor, language and cognitive development, with no adverse effects. This is one patient over
          six months and the authors say further clinical investigation is needed; it is curated because
          it is the first therapy directed at the arm of the disease CoQ10 cannot reach.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: 4-hydroxybenzoic acid
            term:
              id: CHEBI:30763
              label: 4-hydroxybenzoic acid
      selected_evidence:
        snippet: Here, we demonstrate that lifelong 4-HBA supplementation in a murine model carrying the
          pathogenic Coq2A252V variant is well tolerated and prevents the onset of mitochondrial encephalopathy.
        supports: SUPPORT
    origin:
