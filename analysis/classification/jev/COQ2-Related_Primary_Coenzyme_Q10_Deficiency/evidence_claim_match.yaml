              label: coenzyme Q10 deficiency, primary, 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinal and Optic Nerve Bioenergetic Failure
        biological_scale: TISSUE
        description: 'Photoreceptors and retinal ganglion cell axons are among the most energy-demanding
          tissues in the body, and they fail in COQ2 disease with a cone-greater-than-rod pattern on electroretinography
          plus optic nerve atrophy. This node matters out of proportion to its frequency because retinopathy
          in primary CoQ10 deficiency has been reported only with COQ2 variants, which makes it the most
          gene-discriminating feature of the entry.

          Unlike the podocyte and neuronal nodes, no retinal-tissue study exists. The mechanism here is
          inferred from the shared respiratory-chain lesion upstream and from the ophthalmological phenotyping
          of genotyped patients, not demonstrated in retina, so the node asserts the site of failure and
          not a retina-specific pathway.'
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        - preferred_term: retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        locations:
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: All cases of retinopathy in primary CoQ10 deficiency have been reported in the setting
          of mutations in the COQ2 gene
        supports: SUPPORT
