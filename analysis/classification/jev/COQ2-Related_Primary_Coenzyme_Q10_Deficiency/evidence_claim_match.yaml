              label: coenzyme Q10 deficiency, primary, 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Oral coenzyme Q10 supplementation
        description: 'High-dose oral CoQ10 is the standard treatment. In a 116-patient international series
          with a median two years of follow-up it reduced proteinuria by 88% at 12 months and improved
          five-year kidney failure-free survival from 19% to 62%, with uncommon and mild side effects.
          The authors conclude that every patient diagnosed with primary CoQ10 deficiency should receive
          early lifelong supplementation.

          The limitation is as well established as the benefit: it does not rescue established neurological
          disease, even when started on the first day of life.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: coenzyme Q10
            term:
              id: CHEBI:46245
              label: coenzyme Q10
      selected_evidence:
        snippet: CoQ10 supplementation led to significantly better preservation of kidney function (5-year
          kidney failure-free survival 62% vs. 19%) with an improvement in general condition and neurological
          manifestations.
        supports: SUPPORT
    origin:
