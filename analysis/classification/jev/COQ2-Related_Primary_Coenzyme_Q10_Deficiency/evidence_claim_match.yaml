      assertion_type: ExperimentalModel
      assertion:
        name: Yeast complementation assay for COQ2 allelic series
        experimental_model_type: OTHER
        description: A yeast model developed to score every COQ2 mutant allele reported at the time. Its
          purpose was not to model the disease but to measure residual activity per allele, and it is
          what established that COQ2 has a genotype-phenotype correlation where other CoQ genes do not.
        publication: PMID:27493029
        modeled_mechanisms:
        - target: COQ2 Polyprenyltransferase Deficiency
          relationship: MEASURES
          fidelity: MODERATE
          model_scale: MOLECULAR
          description: Reads out residual catalytic activity of a human allele in a null yeast background,
            as a quantitative surrogate for enzyme function.
          limitations: Yeast CoQ biosynthesis and membrane composition differ from human, and the readout
            is growth-based complementation rather than direct measurement of human tissue CoQ. It cannot
            capture tissue-specific residual activity, which is precisely what would explain why one organ
            is affected and another is spared in the same patient.
          readouts:
          - name: Residual activity of mutant COQ2 allele
            target: COQ2 Polyprenyltransferase Deficiency
            direction: DECREASED
            interpretation: Graded loss of function per allele, which correlated with the clinical severity
              of patients carrying it.
      selected_evidence:
        snippet: We have characterized the structure of human COQ2, defined its subcellular localization
          and developed a yeast model to validate all the mutant alleles reported so far.
        supports: SUPPORT
