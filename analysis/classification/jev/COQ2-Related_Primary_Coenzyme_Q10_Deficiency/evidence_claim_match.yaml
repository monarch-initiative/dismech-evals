          name: COQ2-Related Primary Coenzyme Q10 Deficiency
          disease_term:
            preferred_term: coenzyme Q10 deficiency, primary, 1
            term:
              id: MONDO:0011829
              label: coenzyme Q10 deficiency, primary, 1
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_coq2_organ_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do some biallelic COQ2 patients present with isolated kidney disease while others
          have multiorgan disease from birth, given the same enzymatic block in every tissue?
        attaches_to:
        - pathophysiology#COQ2 Polyprenyltransferase Deficiency
        - pathophysiology#Podocyte Energetic Failure
        rationale: 'A third of COQ2 patients have isolated kidney involvement at diagnosis and a fifth
          have classic infantile multiorgan disease, yet the deficient enzyme is the same one in every
          cell. Residual activity is the leading explanation and has real support — the yeast series grades
          alleles and the grades track severity. But the same registry analysis reports substantial intra-familial
          variability, which residual activity cannot explain, since siblings share both alleles. The
          authors invoke genetic and non-genetic modifiers without naming any. Resolving this would change
          what a family is told when a second child is found to carry the same genotype.

          The sharpest single observation is a COQ2 patient with fatal infantile multisystem disease in
          whom the kidney was spared outright, in a disease whose hallmark manifestation is nephrotic
          syndrome. Organ selectivity is therefore not a severity gradient with the kidney always first;
          the kidney can be absent from a lethal presentation. The ocular tissue poses the same question
          from the other direction, since retinopathy is reported only with this gene and only in a handful
          of its patients.'
        proposed_experiments:
        - experiment_id: exp_coq2_tissue_residual_activity
          name: Tissue-resolved CoQ measurement across affected and spared organs
          description: Measure CoQ9 and CoQ10 concentrations and respiratory chain function across kidney,
            brain, heart and muscle in a COQ2 model carrying an intermediate allele, testing whether organ
            involvement tracks tissue CoQ level or whether some tissues tolerate the same deficit better.
        - experiment_id: exp_coq2_sibling_modifier_search
          name: Modifier search in discordant sibling pairs
          description: Perform genome and transcriptome comparison on the reported sibling pairs with
            the same COQ2 genotype and discordant severity, looking for modifier variants in CoQ biosynthesis,
            transport or antioxidant pathways.
      selected_evidence:
        snippet: Interestingly, four of these patients showed a distinctive renal involvement (focal segmental
          glomerular sclerosis, crescentic glomerulonephritis, nephrotic syndrome), which is only very
          rarely seen in correlation with mitochondrial disorders.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23343605
      reference_title: A novel mutation in COQ2 leading to fatal infantile multisystem disease.
