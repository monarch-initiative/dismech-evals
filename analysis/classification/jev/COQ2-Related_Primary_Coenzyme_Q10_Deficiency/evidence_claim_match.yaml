        context: []
      assertion_type: Biochemical
      assertion:
        name: Coenzyme Q10 concentration in skeletal muscle
        biomarker_term:
          preferred_term: coenzyme Q10 concentration in skeletal muscle
          term:
            id: NCIT:C147321
            label: Ubiquinone 10 Measurement
        notes: 'Reduced tissue CoQ10 is the direct biochemical consequence of the biosynthetic block.
          The clinically important point is the contrast with the serum measurement: serum CoQ10 does
          not reflect intracellular concentration and a normal serum value does not exclude the diagnosis,
          which is why the assay has to be done on tissue. Sensitivity and specificity of the tissue assay
          are themselves described as uncertain, particularly in patients without systemic features of
          severe mitochondrial dysfunction, so a negative result does not exclude the diagnosis either.
          Genetic testing has largely displaced it.'
      selected_evidence:
        snippet: 'The diagnosis of primary CoQ10 deficiency was historically established by enzymatic
          assessment of tissue: a reduction in CoQ10 concentration and mitochondrial respiratory chain
          activity levels have been documented.'
        supports: SUPPORT
