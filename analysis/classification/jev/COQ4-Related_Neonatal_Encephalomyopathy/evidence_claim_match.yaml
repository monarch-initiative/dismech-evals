          disease_term:
            preferred_term: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
            term:
              id: MONDO:0014562
              label: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coq4_neonatal_coq10_nonresponse
        kind: KNOWLEDGE_GAP
        prompt: Why does exogenous CoQ10 supplementation fail to rescue the neonatal COQ4 phenotype when
          it can reverse renal disease in other primary CoQ10 deficiencies?
        rationale: Oral CoQ10 is the only disease-directed therapy available, yet the neonatal COQ4 form
          responds poorly and children have died in early childhood despite high-dose CoQ10 from birth.
          Candidate explanations include inadequate tissue and mitochondrial delivery of the highly lipophilic
          molecule, irreversible antenatal injury already established at birth, and CoQ10-independent
          consequences of losing the COQ4 scaffold. Distinguishing these determines whether better-delivered
          analogues could help or whether the therapeutic window closes before birth.
        attaches_to:
        - pathophysiology#Coenzyme Q10 Biosynthetic Failure
        proposed_experiments:
        - experiment_id: coq4_mito_delivery_rescue
          name: Mitochondrial CoQ10 repletion with alternative formulations
          description: Measure mitochondrial CoQ10 repletion and respiratory-chain rescue in COQ4-patient
            fibroblasts and cardiomyocytes treated with conventional CoQ10 versus mitochondria-targeted
            or solubilised formulations.
        - experiment_id: coq4_prenatal_treatment_window
          name: Prenatal treatment window in a COQ4 model
          description: Determine in a COQ4 model whether prenatal initiation of CoQ10 or a bypass analogue
            prevents the cerebellar hypoplasia that is already present at birth in human patients.
      selected_evidence:
        snippet: Due to the insufficient clinical response to oral CoQ10 supplementation, alternative
          treatment strategies are warranted.
        supports: SUPPORT
    origin:
