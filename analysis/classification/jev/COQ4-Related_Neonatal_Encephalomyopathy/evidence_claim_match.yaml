  47d19c3a3504716a9bf9d5014107ef2680c7888b3ada6b261926885f4d6fe685:
    claim:
      about:
        disease:
          name: COQ4-Related Neonatal Encephalomyopathy
          disease_term:
            preferred_term: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
            term:
              id: MONDO:0014562
              label: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COQ4 Loss of Function and CoQ Synthome Destabilization
        biological_scale: MOLECULAR
        description: 'Biallelic COQ4 variants reduce or abolish COQ4 protein. COQ4 has no demonstrated
          catalytic step of its own; the yeast orthologue acts as a structural scaffold stabilizing the
          multiheteromeric complex that assembles most of the CoQ biosynthetic enzymes, so loss of COQ4
          destabilizes the whole biosynthetic machine. Missense, nonsense, frameshift and in-frame deletion
          alleles have all been reported, and patient fibroblasts show markedly reduced COQ4 protein levels.
          Note that the molecular-function term below is a curator inference: the cited source states
          that the precise catalytic function of human COQ4 is unknown and describes it as playing a structural,
          complex-stabilizing role, for which the adaptor-activity term is the closest available GO proxy.

          '
        genes:
        - preferred_term: COQ4
          term:
            id: hgnc:19693
            label: COQ4
        molecular_functions:
        - preferred_term: protein-macromolecule adaptor activity
          term:
            id: GO:0030674
            label: protein-macromolecule adaptor activity
          modifier: DECREASED
      selected_evidence:
        snippet: The precise function of human COQ4 is not known, but it seems to play a structural role
          in stabilizing a multiheteromeric complex that contains most of the CoQ10 biosynthetic enzymes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
