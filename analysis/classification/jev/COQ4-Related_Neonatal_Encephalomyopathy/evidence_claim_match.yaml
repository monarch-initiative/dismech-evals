            term:
              id: MONDO:0014562
              label: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Coenzyme Q10 Biosynthetic Failure
        biological_scale: MOLECULAR
        description: 'Loss of COQ4 collapses de novo CoQ10 synthesis. Because dietary contribution to
          cellular CoQ10 is negligible, tissue CoQ10 falls steeply: muscle and fibroblast CoQ10 are severely
          reduced in affected neonates. The pathway intermediate 6-demethoxyubiquinone accumulates in
          patient cells, a metabolic signature of COQ4 deficiency that localises the block within the
          pathway.

          '
        biological_processes:
        - preferred_term: ubiquinone biosynthetic process
          term:
            id: GO:0006744
            label: ubiquinone biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: Experiments revealed significantly decreased COQ4 protein levels, reduced levels of cellular
          CoQ10 and elevated levels of the metabolic intermediate 6-demethoxyubiquinone.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34656997
      reference_title: 'Human COQ4 deficiency: delineating the clinical, metabolic and neuroimaging phenotypes.'
