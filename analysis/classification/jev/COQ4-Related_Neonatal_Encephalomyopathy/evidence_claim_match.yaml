      assertion_type: Discussion
      assertion:
        discussion_id: coq4_antenatal_developmental_lesion
        kind: KNOWLEDGE_GAP
        prompt: Is the antenatal cerebellar hypoplasia of COQ4 deficiency a developmental patterning failure,
          or simply prenatal bioenergetic degeneration of an already-formed cerebellum?
        rationale: The pathophysiology chain modelled in this entry is a postnatal bioenergetic cascade,
          but cerebellar malformation is detectable at the 20th week of gestation and autopsy shows olivopontocerebellar
          hypoplasia with microdysgenesis - findings suggesting disturbed development rather than degeneration
          alone. Whether CoQ10 has a developmental role in cerebellar morphogenesis beyond ATP supply
          is unresolved, and the answer bounds any therapeutic window, because a patterning failure completed
          in utero cannot be reversed by postnatal supplementation.
        attaches_to:
        - pathophysiology#Bioenergetic Failure of High-Energy-Demand Tissues
        - phenotypes#Antenatal Cerebellar Hypoplasia
        proposed_experiments:
        - experiment_id: coq4_cerebellar_development_timecourse
          name: Developmental time course of cerebellar CoQ4 loss
          description: Track cerebellar progenitor proliferation, migration and foliation in a conditional
            COQ4-loss model across gestation to distinguish failed morphogenesis from degeneration of
            formed structures.
      selected_evidence:
        snippet: An autopsy of the brain revealed severe olivopontocerebellar and thalamic hypoplasia
          and scattered cavitations in the white matter
        supports: SUPPORT
