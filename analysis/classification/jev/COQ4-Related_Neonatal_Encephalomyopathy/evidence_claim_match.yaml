  e83391eace464ef0d8bdc0b7607050b5f45cea31a3e3dd6155d817c30a1df72d:
    claim:
      about:
        disease:
          name: COQ4-Related Neonatal Encephalomyopathy
          disease_term:
            preferred_term: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
            term:
              id: MONDO:0014562
              label: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
        context: []
      assertion_type: Biochemical
      assertion:
        name: Reduced coupled complex I+III and II+III activities
        notes: 'Spectrophotometric assay of the respiratory chain shows selective reduction of the CoQ10-dependent
          coupled reactions (rotenone-sensitive NADH-cytochrome c reductase, complex I+III; succinate-cytochrome
          c reductase, complex II+III) with relatively preserved activities of the individual complexes.
          Findings are variable between tissues and can be normal in some specimens, so a normal result
          does not exclude the diagnosis. The bound term is the generic decreased-respiratory-chain-activity
          concept; no ontology term distinguishes the coupled CoQ10-dependent segments (I+III, II+III)
          from the individual complexes, which is the pattern that actually discriminates a CoQ10 biosynthesis
          defect.

          '
        biomarker_term:
          preferred_term: Decreased activity of mitochondrial respiratory chain
          term:
            id: HP:0008972
            label: Decreased activity of mitochondrial respiratory chain
        presence: DECREASED
      selected_evidence:
        snippet: Clinical heterogeneity was accompanied by an equally striking variability of the biochemical
          findings, which ranged from multiple (S1 and S5) to isolated (S2 and S3) ETC defects in muscle
          and fibroblasts to hardly any detectable defect at all (S4).
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/3
