        description: 'Oral CoQ10 (ubiquinone/ubiquinol) supplementation is the only disease-directed therapy
          and is the rationale for urgent diagnosis, since cofactor deficiencies are among the very few
          mitochondrial disorders with a pharmacological treatment. Its benefit in the neonatal COQ4 phenotype
          is limited: response was insufficient in the largest COQ4 cohort, and in the published neonatal
          series only nine of twenty-four patients received CoQ10, although all four survivors had done
          so. In a specialist CoQ10-biosynthesis cohort, oral doses up to 70 mg/kg/day were needed to
          ameliorate neurologic features and 30 mg/kg/day reversed or prevented renal disease, but three
          children with neonatal-onset neurologic disease still died in early childhood despite high-dose
          CoQ10 from birth. Exogenous CoQ10 cannot fully bypass the biosynthetic block in established
          neonatal CNS disease, and families of infants with neonatal neurologic presentations should
          be counselled about the poor prognosis.

          '
