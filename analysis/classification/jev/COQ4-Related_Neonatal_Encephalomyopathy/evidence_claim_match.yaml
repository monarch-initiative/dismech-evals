      assertion_type: Genetic
      assertion:
        name: Exon-dependent genotype-phenotype gradient
        notes: 'A proposed exon-dependent correlation stratifies COQ10D7: variants in exons 1-4 associate
          with later onset, CoQ10 responsiveness and longer survival, whereas variants in exons 5-7 associate
          with early onset, unresponsiveness to CoQ10 and early death - the genotype class that produces
          the neonatal phenotype curated here. This is an observational rule from a review rather than
          a validated predictor, and sex is not associated with severity.

          '
        gene_term:
          preferred_term: COQ4
          term:
            id: hgnc:19693
            label: COQ4
        relationship_type: CAUSATIVE
      selected_evidence:
        snippet: Pathogenic COQ4 variants in exons 1-4 are associated with less life-threating presentations,
          late onset, responsiveness to CoQ10 therapy, and a relatively long lifespan. In contrast, pathogenic
          COQ4 variants in exons 5-7 are associated with early onset, unresponsiveness to CoQ10 therapy,
          and early death and are more fatal.
        supports: SUPPORT
        directness: INDIRECT
