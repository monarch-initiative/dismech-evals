      assertion_type: Discussion
      assertion:
        discussion_id: coq4_unexplained_peripheral_features
        kind: KNOWLEDGE_GAP
        prompt: Which mechanisms produce the growth, dysmorphic and sensory manifestations of neonatal
          COQ4 deficiency - intrauterine growth restriction, dysmorphic features, hearing loss and nystagmus
          - that the modelled bioenergetic cascade does not obviously explain?
        rationale: 'These features are documented in affected infants but carry no delineated mechanism
          in the cited sources: the hearing loss is not characterised audiometrically (a sensorineural,
          cochlear-energy-failure basis is plausible but unproven), nystagmus could be cerebellar, brainstem
          or sensory in origin, and no source explains the dysmorphism or ties the growth restriction
          to a specific fetal energy deficit. CoQ10 also serves non-respiratory roles - antioxidant, membrane
          stabilizer, and obligatory electron acceptor for de novo pyrimidine biosynthesis - so some of
          these manifestations may not be bioenergetic at all. Rather than wiring these phenotypes to
          the bioenergetic cascade on plausibility alone, the gap is recorded here.'
        attaches_to:
        - phenotypes#Intrauterine Growth Retardation
        - phenotypes#Dysmorphic Features
        - phenotypes#Hearing Impairment
        - phenotypes#Nystagmus
      selected_evidence:
        snippet: plays an indispensable role in the de novo pyrimidine biosynthesis as the electron acceptor
          from dihydroorotate dehydrogenase
        supports: SUPPORT
