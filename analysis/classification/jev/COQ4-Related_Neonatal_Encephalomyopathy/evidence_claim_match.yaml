            term:
              id: MONDO:0014562
              label: neonatal encephalomyopathy-cardiomyopathy-respiratory distress syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired CoQ10-Dependent Respiratory Chain Electron Transfer
        biological_scale: CELLULAR
        description: 'CoQ10 is the lipophilic mobile carrier that shuttles electrons from complex I and
          complex II (and from other flavoprotein dehydrogenases) to complex III. Its depletion produces
          a combined, CoQ10-specific respiratory-chain lesion: the coupled complex I+III and complex II+III
          activities fall while the individual complexes are often preserved, which is the biochemical
          fingerprint that distinguishes a CoQ10 biosynthesis defect from an assembly defect of a single
          complex. Maximal respiratory rates are reduced in patient fibroblasts.

          '
        biological_processes:
        - preferred_term: electron transport chain
          term:
            id: GO:0022900
            label: electron transport chain
          modifier: DECREASED
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
      selected_evidence:
        snippet: CoQ10 is an essential component of the electron transport chain (ETC), where it shuttles
          electrons from complex I or II to complex III.
        supports: SUPPORT
    origin:
