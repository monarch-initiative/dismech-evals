  4d66c4dc00bf02b978a32802902312c7f554005aaaabda73ed3a3ed1f5ea0a61:
    claim:
      about:
        disease:
          name: COQ6-Related Steroid-Resistant Nephrotic Syndrome with Sensorineural Deafness
          disease_term:
            preferred_term: familial steroid-resistant nephrotic syndrome with sensorineural deafness
            term:
              id: MONDO:0013836
              label: familial steroid-resistant nephrotic syndrome with sensorineural deafness
        context: []
      assertion_type: Genetic
      assertion:
        name: COQ6
        gene_term:
          preferred_term: COQ6
          term:
            id: hgnc:20233
            label: COQ6
        relationship_type: CAUSATIVE
        variants:
        - name: c.249C>G (p.Tyr83Ter)
          description: Nonsense allele producing a truncated protein. Reported in trans with p.Gln461Ter
            in two Chinese siblings who presented with severe metabolic acidosis and died in early infancy.
          functional_effects:
          - function: ubiquinone biosynthesis monooxygenase activity
            type: loss-of-function
            description: A stop codon at residue 83 truncates the protein before the FAD-binding monooxygenase
              domain, so no residual hydroxylase activity is expected.
        - name: c.1381C>T (p.Gln461Ter)
          description: The second nonsense allele in the same family, in trans with p.Tyr83Ter.
          functional_effects:
          - function: ubiquinone biosynthesis monooxygenase activity
            type: loss-of-function
            description: The later of the two stop codons, and the reason the sibling pair is a compound-heterozygous
              null rather than a hypomorph. With no functional allele on either chromosome the phenotype
              was lethal in infancy, which is the extreme this entry's severity spectrum is anchored against.
        notes: Biallelic variants on chromosome 14q24.3. Missense alleles predominate in the classic oto-renal
          presentation; the two nonsense alleles above segregated with death in early infancy, consistent
          with residual activity setting position on the severity spectrum. Audiological response to CoQ10
          appears genotype-specific.
      selected_evidence:
        snippet: 'we identified two rare recessive nonsense mutations in the COQ6 gene segregating with
          disease in affected family members: c.249C > G (p.Tyr83Ter) and c.1381C > T (p.Gln461Ter), resulting
          in two truncated protein products'
        supports: SUPPORT
