        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Podocyte Injury and Apoptosis
        biological_scale: CELLULAR
        description: 'Podocyte apoptosis is the demonstrated cellular consequence, and it is partially
          reversible by coenzyme Q10 in both podocyte cell lines and zebrafish - which is the experiment
          that links the deficiency causally to the cell death rather than merely correlating them. Knockdown
          work fills in part of the route: loss of COQ6 raises reactive oxygen species and disorganizes
          the F-actin cytoskeleton before apoptosis, which matters because podocyte function depends on
          maintaining that cytoskeletal architecture at the filtration slit.'
        cell_types:
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
      selected_evidence:
        snippet: knockdown of Coq6 in podocyte cell lines and coq6 in zebrafish embryos caused apoptosis
          that was partially reversed by coenzyme Q10 treatment
        supports: SUPPORT
