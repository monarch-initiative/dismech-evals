          because it is what makes the timing of CoQ10 the single decisive variable in this disease -
          the drug can prevent glomerular scarring and cannot reverse it. The two arms come apart here:
          renal function can be rescued to normal if treatment starts early enough, while hearing responds
          in fewer than half of patients and not at all once lost.'
      selected_evidence:
        snippet: the cardinal phenotypes are steroid-resistant nephrotic syndrome (SRNS), which inevitably
          progresses to kidney failure, and sensorineural hearing loss (SNHL)
        supports: SUPPORT
