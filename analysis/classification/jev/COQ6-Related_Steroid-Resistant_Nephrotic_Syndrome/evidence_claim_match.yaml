        biological_scale: MOLECULAR
        description: Homozygous or compound heterozygous COQ6 variants. Missense alleles impair the enzyme's
          substrate access channel; nonsense alleles truncate the protein and are associated with the
          lethal infantile end of the spectrum.
      selected_evidence:
        snippet: Here we have identified 6 different mutations in coenzyme Q10 biosynthesis monooxygenase
          6 (COQ6) in 13 individuals from 7 families by homozygosity mapping.
        supports: SUPPORT
