      assertion_type: ComputationalModel
      assertion:
        name: COVID-19 Disease Map SBML-qual Boolean Models
        description: Executable Boolean networks generated from the COVID-19 Disease Map (C19DMap), the
          community-curated repository of SARS-CoV-2 virus-host mechanism diagrams. The CellDesigner diagrams
          were translated to SBML-qual with CaSQ, retaining the source diagrams' references, annotations
          and layout, and deposited on FAIRDOMHub as a reusable model collection. Because the translation
          is automated and layout-aware, each Boolean model remains traceable back to the curated diagram
          and the literature behind it — the property that makes the collection reviewable rather than
          opaque.
        model_type: BOOLEAN_NETWORK
        model_format: SBML-qual
        model_software: CaSQ, CellDesigner
        repository_url: https://fairdomhub.org/models/714
        publication: PMID:34664389
        modeled_mechanisms:
        - target: RNA Virus-Induced Interferon and PARP Activation
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: MOLECULAR
          divergences:
          - divergence_type: CALIBRATION_PROVENANCE
            materiality: QUALIFYING
            description: CaSQ infers update rules from the CellDesigner diagram's topology and semantic
              annotations. No kinetic parameterisation is performed and no fitting to interferon-response
              data is involved, so the model inherits whatever the curated diagram asserts.
          - divergence_type: TEMPORAL_SCOPE
            materiality: QUALIFYING
            description: The models establish qualitative reachability of the interferon response, not
              its magnitude or timing -- both of which are central to whether the response controls SARS-CoV-2
              or contributes to immunopathology.
          description: Interferon-signalling diagrams are among the C19DMap content translated into discrete
            models, making the host interferon response simulable rather than only browsable.
          limitations: CaSQ infers rules from diagram topology and semantics without kinetic parameterisation,
            so the models capture qualitative reachability of the interferon response rather than its
            magnitude or timing.
        findings:
        - statement: The generated SBML-qual files retain the references, annotations and layout of the
            source CellDesigner diagrams, so each Boolean model stays traceable to its curation.
        notes: Curated as part of the Boolean/logical modelling track; see docs/superpowers/plans/2026-08-28-boolean-modeling-and-pathographs.md.
          A collection rather than a single network — FAIRDOMHub model 714 holds SBML-qual translations
          of selected C19DMap diagrams. Literature-referenced, not runnable in-repo.
      selected_evidence:
        snippet: The C19DMap diagrams are available in several layout‐aware systems biology formats and
          integrated with external repositories, allowing a range of computational analyses, including
          network analysis and Boolean, kinetic or multiscale simulations
        supports: SUPPORT
