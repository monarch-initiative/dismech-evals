        treatment_effect: ACTIVATES
        description: Peginterferon lambda supplies exogenous type III interferon that reinforces the host
          interferon-stimulated antiviral program this node initiates, restricting viral replication;
          it conceptually counters the viral macrodomain countermeasure that degrades the downstream ADP-ribosylation
          output.
      selected_evidence:
        snippet: Among predominantly vaccinated outpatients with Covid-19, the incidence of hospitalization
          or an emergency department visit (observation for >6 hours) was significantly lower among those
          who received a single dose of pegylated interferon lambda than among those who received placebo.
        supports: SUPPORT
