      assertion_type: Discussion
      assertion:
        discussion_id: gap_covid_type1_vs_type2_divergence
        prompt: SARS-CoV-2 infection has been associated with both incident type 1 and type 2 diabetes,
          yet the mechanistic pathways and patient risk factors that predispose to one versus the other
          remain unclear. Do viral and/or host immune and metabolic pathways distinguish type 1 (autoimmune
          beta-cell destruction) from type 2 (insulin resistance + relative beta-cell inadequacy) post-COVID
          trajectories?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#SARS-CoV-2 Spike-Mediated Entry via ACE2 and TMPRSS2
        rationale: Meta-analyses and prospective cohorts report increased incidence of both type 1 diabetes
          (especially in children with new-onset DKA above baseline) and type 2 diabetes (particularly
          in hospitalized and older adults). The role of SARS-CoV-2 as a direct trigger of autoimmunity,
          a driver of insulin resistance through persistent inflammation, or an unmasker of pre-existing
          glucose intolerance is not yet resolved. Mechanistic and genetic factors that predict which
          type develops are largely unknown.
      selected_evidence:
        snippet: Soon, additional studies began to identify similar increases in new-onset type 2 diabetes
          [17].
        supports: SUPPORT
