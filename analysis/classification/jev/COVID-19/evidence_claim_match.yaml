      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mac1_allosteric_pivot_model
        hypothesis_label: Mac1 Allosteric Conformational Pivot Model
        status: EMERGING
        description: The conserved Mac1 fold across coronaviruses (SARS-CoV-2, SARS-CoV, MERS-CoV) supports
          treating Mac1 as a thermodynamic pivot point rather than only an active-site target. Allosteric
          stabilization of distinct Mac1 conformational states or PROTAC-based physical degradation would
          rebalance the host interactome toward antiviral ADP-ribosylation, with potential broad anti-coronavirus
          activity that active-site inhibition alone may not achieve. Active drug-discovery programs (including
          the third CACHE community challenge) have established Mac1 as a tractable structural target
          with hundreds of crystallographically characterized ligands, providing a strong starting point
          for conformational-pivot chemistry.
      selected_evidence:
        snippet: SARS-CoV-2, SARS-CoV, and Middle East respiratory syndrome coronavirus (MERS-CoV) Mac1
          domains exhibit similar structural folds, and all 3 proteins bound to ADP-ribose with affinities
          in the low micromolar range
        supports: SUPPORT
    origin:
