  481fc8505d5787c184d859bc1a748dc963eb4347e5afbc56ccdea092cad62ed5:
    claim:
      about:
        disease:
          name: COVID-19
          disease_term:
            preferred_term: COVID-19
            term:
              id: MONDO:0100096
              label: COVID-19
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_covid_mac1_therapy_interferon_competence
        prompt: Mac1-directed therapy works by lifting viral suppression of host ADP-ribosylation, so
          its benefit is predicted to depend on the patient's own interferon competence. Does a Mac1 inhibitor
          retain efficacy in the roughly one in five patients with critical COVID-19 who carry anti-type-I
          interferon autoantibodies or an inborn error of type I interferon immunity, and should interferon
          autoantibody status therefore be a companion diagnostic rather than an exclusion?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Nsp3 Macrodomain De-ADP-Ribosylation Countermeasure
        - pathophysiology#RNA Virus-Induced Interferon and PARP Activation
        rationale: 'Every published Mac1 inhibitor whose mechanism has been dissected acts through immune
          restoration rather than through direct antiviral blockade, and in both compound series the cellular
          antiviral effect is explicitly interferon dependent. That makes host interferon competence a
          gate on the entire therapeutic strategy, and the gate is not hypothetical: inborn errors of
          type I interferon immunity account for 1 to 5 percent of unvaccinated patients with critical
          pneumonia and anti-interferon autoantibodies for another 15 to 20 percent, so the patients most
          likely to need a novel antiviral are enriched for the defect that would blunt it.

          The gap is that this has never been tested. No Mac1 inhibitor has entered a clinical trial,
          so no cohort stratified by interferon autoantibody status or by interferon-stimulated gene score
          exists, and the preclinical interferon dependence has only been shown by adding or withholding
          interferon gamma in culture, not by comparing hosts that differ in endogenous type I interferon
          capacity. Resolving it needs either an animal model with defined type I interferon pathway loss
          treated with an active-site Mac1 inhibitor, or prospective collection of anti-interferon autoantibody
          status in any future trial. The answer bears directly on the Mac1 pivot hypothesis''s claim
          of broad activity, because the limitation applies equally to active-site, allosteric, and degradation-based
          approaches.'
      selected_evidence:
        snippet: identifying inborn errors of type I interferon (IFN) immunity in 1-5% of unvaccinated
          patients with critical pneumonia, and their autoimmune phenocopy, autoantibodies against type
          I IFN, in another 15-20% of cases
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37196358
      reference_title: 'Human Genomics of COVID-19 Pneumonia: Contributions of Rare and Common Variants.'
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the patient fraction in whom the host arm of the Mac1 therapeutic mechanism
        is already compromised, which is what makes the efficacy question a real stratification problem
        rather than a theoretical caveat.
