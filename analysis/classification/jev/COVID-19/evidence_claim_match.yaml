      explanation: 'Destabilizing the macrodomain routes the expressed macrodomain-PLP2 region of nsp3
        into proteasomal degradation, which is the closest published analogue of the degradation arm of
        this hypothesis. Two limits on how far it can be carried: the work is in mouse hepatitis virus,
