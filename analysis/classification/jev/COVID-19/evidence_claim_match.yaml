              id: MONDO:0100096
              label: COVID-19
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_covid_acute_vs_persistent_diabetes
        prompt: What distinguishes acute hyperglycemia during COVID-19 hospitalization (stress-hyperglycemia)
          from persistent de novo diabetes development post-COVID? Do the pathways driving acute metabolic
          decompensation during infection differ mechanistically from those driving long-term beta-cell
          loss or insulin resistance post-infection?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#SARS-CoV-2 Spike-Mediated Entry via ACE2 and TMPRSS2
        rationale: 'COVID-19 hospitalized patients frequently develop hyperglycemia (~50%), but the majority
          resolve it post-discharge. However, population cohort studies (OpenSAFELY, N3C) and registry
          data report incident diabetes cases years post-infection. The mechanism(s) linking acute infection-driven
          hyperglycemia to persistent diabetes risk is not clear: stress-hyperglycemia may unmask pre-existing
          insulin resistance that progresses to type 2 diabetes, acute direct infection of beta cells
          may cause lasting damage, or unresolved post-viral inflammation may sustain pathways months/years
          later. A prospective multi-timepoint mechanistic study is needed.'
      selected_evidence:
        snippet: stress- and treatment-induced hyperglycaemia is common in critical illness, occurring
          in approximately 50% of affected individuals. While often transient, these effects may unmask
          persistent metabolic dysfunction in individuals at risk of type 2 diabetes [36, 37].
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42362970
      reference_title: 'SARS-CoV-2 and diabetes: a post-pandemic reappraisal.'
      evidence_source: OTHER
      explanation: 'Identifies the unresolved distinction: acute hyperglycemia may be reversible stress-response
        versus a marker of persistent damage.'
