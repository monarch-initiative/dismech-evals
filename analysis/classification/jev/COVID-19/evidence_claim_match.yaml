        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: endotheliopathy_centred_pathophysiology_model
        hypothesis_label: Endotheliopathy-Centred Pathophysiology Model
        status: EMERGING
        description: 'Severe COVID-19 is increasingly framed as an endotheliopathy in which SARS-CoV-2-driven
          endothelial activation, thrombo-inflammation, and parenchymal injury — rather than direct cytopathic
          respiratory infection alone — define the lethal disease phenotype. Under the interactome-rebalancing
          framing, the lung endothelial interactome shifts toward a pro-thrombotic, hyper-inflammatory
          state that sits downstream of viral entry but upstream of multi-organ dysfunction. This hypothesis
          is parallel to (not subsumed by) the macrodomain countermeasure model: Mac1 explains immune
          evasion at the cellular level, while endotheliopathy explains organ-scale pathology and many
          of the distinctive thrombotic complications.'
      selected_evidence:
        snippet: evidence for many distinctive mechanistic features indicates that COVID-19 constitutes
          a new disease entity, with emerging data suggesting involvement of an endotheliopathy-centred
          pathophysiology
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33965003
      reference_title: 'The COVID-19 puzzle: deciphering pathophysiology and phenotypes of a new disease
        entity.'
      evidence_source: OTHER
      explanation: Osuchowski et al. Lancet Respir Med review positions endotheliopathy as the unifying
        pathophysiological framework for severe COVID-19, distinct from purely respiratory cytopathic
        injury.
