        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nsp3 Macrodomain De-ADP-Ribosylation Countermeasure
        conforms_to: parp_parg_macrodomain_viral_evasion#Viral Macrodomain De-ADP-Ribosylation Countermeasure
        description: SARS-CoV-2 encodes a conserved macrodomain (Mac1) within nonstructural protein 3
          (Nsp3) that binds and hydrolyzes mono-ADP-ribose marks on host proteins. Mac1 reverses the PARP9/DTX3L-dependent
          antiviral ADP-ribosylation that the host interferon response deposits, neutralizing this branch
          of innate immunity. The macrodomain is essential for coronavirus pathogenesis in animal models
          and is the prototypical viral pivot point for this mechanism module. Its conserved fold and
          druggable ADP-ribose pocket make it an attractive target for both small-molecule inhibitors
          and PROTAC-style degraders.
        biological_processes:
        - preferred_term: protein de-ADP-ribosylation
          term:
            id: GO:0051725
            label: protein de-ADP-ribosylation
          modifier: INCREASED
        - preferred_term: negative regulation of defense response to virus by host
          term:
            id: GO:0050689
            label: negative regulation of defense response to virus by host
          modifier: INCREASED
      selected_evidence:
        snippet: All coronaviruses encode a highly conserved macrodomain (Mac1) that binds to and removes
          ADP-ribose adducts from proteins
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33158944
      reference_title: The SARS-CoV-2 Conserved Macrodomain Is a Mono-ADP-Ribosylhydrolase.
