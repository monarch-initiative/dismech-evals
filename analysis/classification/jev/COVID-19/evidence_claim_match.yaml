      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: nsp3_mac1_essentiality_model
        hypothesis_label: Nsp3 Mac1 Macrodomain Essentiality Model
        status: CANONICAL
        description: The SARS-CoV-2 Nsp3 macrodomain (Mac1) is a conserved coronavirus mono-ADP-ribosylhydrolase
          that is essential for pathogenesis. By hydrolyzing PARP9/DTX3L-deposited mono-ADP-ribose marks
          on host proteins, Mac1 neutralizes the effector branch of the host interferon antiviral program
          and is required for productive replication in vivo. This is the disease-level instantiation
          of the parp_parg_macrodomain_viral_evasion module's canonical countermeasure hypothesis.
      selected_evidence:
        snippet: Mac1 is essential for pathogenesis in multiple animal models of CoV infection
        supports: SUPPORT
