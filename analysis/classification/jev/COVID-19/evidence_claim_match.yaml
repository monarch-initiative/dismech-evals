      evidence_source: IN_VITRO
      explanation: 'Affinity proteomics comparing wild-type Mac1 with the catalytically dead N40D mutant
        places candidate ADP-ribosylated clients outside interferon signaling, including TRiC chaperonin
        subunits in lung-derived A549 cells. Two limits: the experiment transfects an isolated Strep-tagged
        Mac1 domain rather than infecting cells, and the paper presents these as putative clients awaiting
        functional validation, so this widens the candidate substrate set without redefining the node''s
        established interferon-directed function.'
