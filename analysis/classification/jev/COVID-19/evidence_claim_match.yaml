            rationale: 'The Nsp3 Mac1 macrodomain is a conserved, structurally tractable viral enzyme
              that selectively hydrolyzes the end product of the host IFN-PARP antiviral program. Active-site
              inhibitors target the ADP-ribose pocket directly, but the broader interactome framing suggests
              an alternative: stabilize defined conformational states of Mac1 with allosteric binders
              to test how each conformation reshapes the host PARP-mediated antiviral response, or eliminate
              the protein outright with a viral-protein-directed PROTAC warhead. Because Mac1 folds are
              conserved across SARS-CoV-2, SARS-CoV, and MERS-CoV, conformational stabilizers or degraders
              may have broad anti-coronavirus activity — the kind of pivot-point control that distinguishes
              a thermodynamic interactome framing from single-enzyme inhibition.

              Both arms of the question are open at the level of chemical matter, not merely of biology.
              No allosteric site has been identified or characterized on any viral macrodomain; the only
              validated macrodomain allosteric ligand series remains GeA-69 against human PARP14 macrodomain
              2, whose selectivity derives from PARP14-specific features. No Mac1-directed PROTAC has
              been designed, synthesized, or tested, and every published SARS-CoV-2 degrader targets a
              standalone viral protein rather than a domain embedded in the membrane-associated nsp3 polyprotein.
              The third CACHE challenge screened 1739 candidate ligands from 23 groups and returned only
              canonical adenine-mimetic orthosteric chemotypes, so community hit-finding has not yet produced
              a non-orthosteric starting point either.

