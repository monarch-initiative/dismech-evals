  949d6132a984830ef2de2df1e857ff72ba75a653140d62a3b887a29c422ef76a:
    claim:
      about:
        disease:
          name: COVID-19
          disease_term:
            preferred_term: COVID-19
            term:
              id: MONDO:0100096
              label: COVID-19
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_covid_macrodomain_allosteric_pivot
        prompt: Can the SARS-CoV-2 Nsp3 Mac1 macrodomain be controlled as a thermodynamic pivot point
          — by allosteric stabilization of distinct conformational states or by PROTAC-based physical
          degradation — to restore host PARP9/DTX3L-dependent antiviral ADP-ribosylation and arrest viral
          replication, and is this strategy broadly active across coronaviruses?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Nsp3 Macrodomain De-ADP-Ribosylation Countermeasure
        - pathophysiology#Host PARP9/DTX3L Antiviral ADP-Ribosylation
        rationale: 'The Nsp3 Mac1 macrodomain is a conserved, structurally tractable viral enzyme that
          selectively hydrolyzes the end product of the host IFN-PARP antiviral program. Active-site inhibitors
          target the ADP-ribose pocket directly, but the broader interactome framing suggests an alternative:
          stabilize defined conformational states of Mac1 with allosteric binders to test how each conformation
          reshapes the host PARP-mediated antiviral response, or eliminate the protein outright with a
          viral-protein-directed PROTAC warhead. Because Mac1 folds are conserved across SARS-CoV-2, SARS-CoV,
          and MERS-CoV, conformational stabilizers or degraders may have broad anti-coronavirus activity
          — the kind of pivot-point control that distinguishes a thermodynamic interactome framing from
          single-enzyme inhibition.

          Both arms of the question are open at the level of chemical matter, not merely of biology. No
          allosteric site has been identified or characterized on any viral macrodomain; the only validated
          macrodomain allosteric ligand series remains GeA-69 against human PARP14 macrodomain 2, whose
          selectivity derives from PARP14-specific features. No Mac1-directed PROTAC has been designed,
          synthesized, or tested, and every published SARS-CoV-2 degrader targets a standalone viral protein
          rather than a domain embedded in the membrane-associated nsp3 polyprotein. The third CACHE challenge
          screened 1739 candidate ligands from 23 groups and returned only canonical adenine-mimetic orthosteric
          chemotypes, so community hit-finding has not yet produced a non-orthosteric starting point either.

          The comparator arm has meanwhile moved. Active-site inhibition now has in vivo pharmacological
          proof of concept (AVI-4206) and an independent chemotype that represses coronavirus replication,
          and serial passage under that second chemotype has already produced a resistant Mac1 double
          mutant that is itself attenuated in mice. Allosteric or degradation-based control therefore
          has to demonstrate specific added value in breadth, resistance profile, or efficacy, not merely
          that it works.'
        proposed_experiments:
        - experiment_id: exp_covid_mac1_allosteric_pivot
          name: Allosteric Mac1 conformational stabilization versus PROTAC degradation in SARS-CoV-2-infected
            airway organoids
          description: Infect human airway organoids and ACE2/TMPRSS2-positive lung epithelial lines with
            authentic SARS-CoV-2 and treat with (a) active-site Mac1 inhibitors, (b) allosteric Mac1 binders
            tuned to stabilize discrete conformational states, and (c) a viral-Mac1-directed PROTAC warhead.
            Read out viral genome replication, infectious virus production, host PARP9/DTX3L-mediated
            ADP-ribosylation marks on host substrates, interferon-stimulated gene induction, and downstream
            cytokine and tissue-damage signatures. Repeat across SARS-CoV-2, SARS-CoV, and MERS-CoV Mac1
            orthologs to test pan-coronavirus activity.
          experiment_type:
            preferred_term: controlled perturbation experiment
          model_systems:
          - name: Human airway organoid panel
            description: ACE2/TMPRSS2-positive bronchial and alveolar organoids derived from human donors,
              used to capture native cellular tropism and innate immune responses to SARS-CoV-2.
            experimental_model_type: ORGANOID
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            tissue_term:
              preferred_term: lung
              term:
                id: UBERON:0002048
                label: lung
            cell_types:
            - preferred_term: ciliated cell
              term:
                id: CL:0000064
                label: ciliated cell
            - preferred_term: pulmonary alveolar type 2 cell
              term:
                id: CL:0002063
                label: pulmonary alveolar type 2 cell
          perturbations:
          - name: Allosteric Mac1 conformational stabilization
            target: pathophysiology#Nsp3 Macrodomain De-ADP-Ribosylation Countermeasure
            description: Small-molecule binders that stabilize defined conformational states of Mac1 to
              test conformation-specific impact on host ADP-ribosylation and viral replication.
          - name: Mac1 PROTAC degradation
            target: pathophysiology#Nsp3 Macrodomain De-ADP-Ribosylation Countermeasure
            description: Viral-protein-directed PROTAC warhead recruiting host E3 ubiquitin ligase to
              physically degrade Nsp3 Mac1 in infected cells.
          - name: Active-site Mac1 inhibition (comparator)
            target: pathophysiology#Nsp3 Macrodomain De-ADP-Ribosylation Countermeasure
            description: Direct ADP-ribose-pocket inhibitor used as comparator to distinguish conformational
              and degradation modes of pivot control from canonical active-site blockade.
          readouts:
          - name: Viral genome replication and infectious virus output
            target: pathophysiology#Enhanced Viral Replication and Tissue Pathology
            biological_processes:
            - preferred_term: viral life cycle
              term:
                id: GO:0019058
                label: viral life cycle
            direction: NEGATIVE
          - name: Host PARP9/DTX3L-dependent ADP-ribosylation rescue
            target: pathophysiology#Host PARP9/DTX3L Antiviral ADP-Ribosylation
            biological_processes:
            - preferred_term: protein poly-ADP-ribosylation
              term:
                id: GO:0070212
                label: protein poly-ADP-ribosylation
            direction: POSITIVE
            interpretation: Restoration of host ADP-ribosylation marks alongside suppression of viral
              replication would support Mac1 inactivation (allosteric or PROTAC) as the causal link between
              interactome rebalancing and antiviral control.
          decision_criterion: The macrodomain pivot model is supported if either allosteric conformational
            stabilization or PROTAC degradation of Mac1 (a) restores host PARP9/DTX3L-dependent ADP-ribosylation,
            (b) suppresses SARS-CoV-2 replication in human airway organoids, and (c) shows comparable
            activity against SARS-CoV and MERS-CoV Mac1 orthologs, supporting a pan-CoV mechanism.
          would_support:
          - pathophysiology#Nsp3 Macrodomain De-ADP-Ribosylation Countermeasure
          - pathophysiology#Host PARP9/DTX3L Antiviral ADP-Ribosylation
      selected_evidence:
        snippet: Recombinant virus with these mutations had enhanced replication compared with the WT
          virus when treated with 5a, demonstrating the specificity of these compounds during infection.
          However, this virus is highly attenuated in vivo, indicating that drug resistance emerged at
          the expense of viral fitness.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40407321
      reference_title: Identification of a series of pyrrolo-pyrimidine-based SARS-CoV-2 Mac1 inhibitors
        that repress coronavirus replication.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the resistance baseline this gap must be measured against. Escape from
        an active-site Mac1 inhibitor is achievable by serial passage but costs viral fitness, so any
        claim that conformational or degradation-based control offers a resistance advantage now has a
        concrete comparator rather than an empty field.
