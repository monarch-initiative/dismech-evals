            description: Pegylated interferon lambda-1A is an innate-immunity-modulator (a type III interferon)
              that pharmacologically augments the host interferon-stimulated antiviral state. In the TOGETHER
              randomized trial, a single subcutaneous dose given early to outpatients significantly reduced
              COVID-19 hospitalization or emergency-department visits, with benefit consistent across
              SARS-CoV-2 variants — the broad-spectrum, host-directed signature of an interferon-based
              antiviral.
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: peginterferon lambda-1A
