        context:
        - path: /computational_models/1
          value:
            name: Type 1 Interferon Signalling Boolean Model
            description: An executable, dynamic Boolean model of type 1 interferon signalling derived
              from the COVID-19 Disease Map interferon diagram using CaSQ and the same map-to-model framework
              as the rheumatoid arthritis FLS model. Simulated in Cell Collective under virus infection,
              inflammatory conditions, and both combined, it yields 128 stable states and no oscillations,
              which are clustered by four output nodes — viral replication, antiviral response, inflammation,
              and IFNA1 secretion. Systematic single-node knockouts across this and companion apoptosis
              and macrophage models were used to nominate drug targets.
            model_type: BOOLEAN_NETWORK
            model_format: SBML-qual
            model_software: CaSQ, Cell Collective
            repository_url: https://git-r3lab.uni.lu/covid/models
            publication: PMID:38414974
            notes: Curated as part of the Boolean/logical modelling track; see docs/superpowers/plans/2026-08-28-boolean-modeling-and-pathographs.md.
              Two companion Boolean models from the same work — respiratory epithelium apoptosis and macrophage
              immune-cell recruitment — were embedded in a multiscale lung-infection simulator; they are
              not separately curated here. Literature-referenced, not runnable in-repo.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: RNA Virus-Induced Interferon and PARP Activation
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: MOLECULAR
        divergences:
        - divergence_type: TEMPORAL_SCOPE
          materiality: QUALIFYING
          description: 'Analysis is of stable states: 128 of them, with no oscillations. That characterises
            where the network settles, not the kinetics of interferon induction, which is what distinguishes
            an early controlling response from a late damaging one.'
        - divergence_type: CALIBRATION_PROVENANCE
          materiality: QUALIFYING
          description: Auto-generated by CaSQ from the disease-map interferon diagram; the sensitivity
            analysis varies input activity levels in Cell Collective rather than fitting the model to
            measured interferon responses.
        description: The model encodes the type 1 interferon cascade and the points at which SARS-CoV-2
          proteins interrupt it, with antiviral response and IFNA1 secretion as two of its four output
          nodes.
        readouts:
        - name: Antiviral response and IFNA1 secretion output nodes
          target: RNA Virus-Induced Interferon and PARP Activation
          direction: ALTERED
          interpretation: Stable states are clustered by the four output nodes; the antiviral-response
            and IFNA1 clusters distinguish an intact interferon response from a virus-blocked one.
      selected_evidence:
        snippet: We used the tool CaSQ and a previously described map-to-model translation framework (33)
          to obtain an executable, dynamic Boolean model of type 1 IFN signalling
        supports: SUPPORT
