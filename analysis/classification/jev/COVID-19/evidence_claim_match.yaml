    evidence_metadata:
      reference: PMID:38260573
      reference_title: Mutation of a highly conserved isoleucine residue in loop 2 of several β-coronavirus
        macrodomains indicates that enhanced ADP-ribose binding is detrimental to infection.
      evidence_source: MODEL_ORGANISM
      explanation: 'Kerr et al. provide the strongest direct support for the conformational-pivot framing:
        a GIF-motif I-A mutation that enhances substrate binding without impairing catalysis still attenuates
        the virus in vivo, demonstrating that Mac1''s conformational landscape (not just enzymatic output)
        is critical for viral fitness. Stabilizing an unproductive conformation could therefore achieve
        antiviral effects beyond what active-site inhibition alone provides.'
