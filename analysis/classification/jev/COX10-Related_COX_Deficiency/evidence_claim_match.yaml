      assertion:
        name: Human COX10 Alleles in Yeast
        experimental_model_type: OTHER
        publication: PMID:39152498
        description: Human reference COX10 and 25 variants were expressed in Saccharomyces cerevisiae
          lacking endogenous COX10. Eleven variants supported approximately half or more of reference
          COX activity and robust growth on a nonfermentable substrate; others had low activity and failed
          respiratory growth. Results inform variant function but do not by themselves classify human
          pathogenicity or prognosis.
        modeled_mechanisms:
        - target: Reduced Terminal Electron Transfer
          relationship: RECAPITULATES
          model_scale: MOLECULAR
          fidelity: MODERATE
          description: Variant-dependent COX enzyme activity and respiratory growth measure the consequences
            of COX10 dysfunction.
          limitations: Species context can alter activity. Asp336Val and Arg339Trp were nonfunctional
            in yeast despite the survival of a patient with that combination into adulthood.
      selected_evidence:
        snippet: Despite the strong evolutionary conservation in oxidative phosphorylation mechanisms,
          it is possible that these variants will have a different level of activity in humans compared
          to yeast cells.
        supports: SUPPORT
