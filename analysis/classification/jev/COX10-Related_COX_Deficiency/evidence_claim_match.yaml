        inheritance:
        - name: Autosomal recessive
        features: 'Established disease-associated alleles include missense variants, a homozygous initiation-codon
          alteration and a partial COX10 deletion in trans with p.Pro295Leu. The adult p.Asp336Val/p.Arg339Trp
          combination demonstrates that severe yeast respiratory defects do not imply inevitable infantile
          death. The 2024 p.Thr377Ile/p.Thr14Ile report remains uncertain: both substitutions were homozygous
          and classified as VUS, with functional studies proposed rather than performed. No specific modifier
          gene is established.'
      selected_evidence:
        snippet: Mutation analysis of COX10 identified four different missense alleles, predicting amino
          acid substitutions at evolutionarily conserved residues.
        supports: SUPPORT
