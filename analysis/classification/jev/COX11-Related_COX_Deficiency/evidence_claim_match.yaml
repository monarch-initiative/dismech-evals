              label: mitochondrial complex IV deficiency, nuclear type 23
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COX11 Loss and Defective Copper Delivery to the CuB Centre
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        biological_scale: MOLECULAR
        description: 'Biallelic COX11 variants impair the copper metallochaperone that delivers copper
          to the CuB centre of the core catalytic subunit COX1, preventing assembly of a functional Complex
          IV holoenzyme. This lesion is complementary to the SCO1/SCO2 defects, which disrupt CuA metallation
          of COX2; together they account for the two copper centres of the enzyme.

          '
        genes:
        - preferred_term: COX11
          term:
            id: hgnc:2261
            label: COX11
        molecular_functions:
        - preferred_term: COX11 copper metallochaperone activity
          term:
            id: GO:0016531
            label: copper chaperone activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: copper ion transport
          term:
            id: GO:0006825
            label: copper ion transport
          modifier: DECREASED
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: COX11 encodes a copper chaperone that participates in the assembly of complex IV and
          has not been previously linked to human disease.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
