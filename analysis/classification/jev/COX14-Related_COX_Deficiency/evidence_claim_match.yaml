      assertion_type: Pathophysiology
      assertion:
        name: COX14 Loss and Failed Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic COX14 (C12orf62) variants cause loss of a small mitochondrial inner-membrane
          Complex IV biogenesis factor that couples synthesis of the core mtDNA-encoded subunit COX I
          to holoenzyme assembly. In its absence COX I synthesis is decreased, COX assembly is impaired,
          and the nascent enzyme complex is unstable, yielding isolated Complex IV biogenesis failure.

          '
        genes:
        - preferred_term: COX14
          term:
            id: hgnc:28216
            label: COX14
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: (COX)-assembly defect and a specific decrease in the synthesis of COX
        supports: SUPPORT
