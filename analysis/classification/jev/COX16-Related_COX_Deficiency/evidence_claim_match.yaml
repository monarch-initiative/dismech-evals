        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COX16 Loss and Impaired COX2 Copper Delivery
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic loss-of-function of COX16 removes a Complex IV assembly factor that interacts
          with newly synthesized COX2 and its copper-center-forming metallochaperones (SCO1, SCO2, COA6)
          and participates in copper delivery to COX2 / CuA-site formation. Loss of COX16 blocks formation
          of the COX2 subassembly module and produces complete loss of the holo-complex IV, i.e. failed
          Complex IV biogenesis with isolated Complex IV deficiency.

          '
        genes:
        - preferred_term: COX16
          term:
            id: hgnc:20213
            label: COX16
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
        - preferred_term: copper ion delivery to COX2
          term:
            id: GO:0006825
            label: copper ion transport
          modifier: DECREASED
      selected_evidence:
        snippet: The absence of COX16 protein expression leads to a complete loss of the holo-complex
          IV, as detected by Western blot in patient fibroblasts
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
