        features: The founding report identifies homozygous NM_016468.6:c.244C>T (p.Arg82Ter), a premature
          stop in exon 4, in two unrelated families. Loss of detectable protein and cellular rescue support
          loss of function. The small clinical literature does not establish a general genotype-prognosis
          relationship or population prevalence.
        variants:
        - name: COX16 c.244C>T (p.Arg82Ter)
          gene:
            preferred_term: COX16
            term:
              id: hgnc:20213
              label: COX16
          description: Homozygous nonsense variant in the founding families. Patient fibroblasts lacked
            detectable COX16 and showed a severe assembly defect; wild-type complementation restored complex
            IV activity.
        notes: ClinGen assigned Moderate validity in August 2025 under the broader MONDO:0044970 primary
          mitochondrial disease concept. That source concept differs from the MC4DN22 binding MONDO:0859160
          used here. The classification is discussed as supporting context rather than copied into a formal
          gene_disease_validity assertion for this disease identifier.
