            term:
              id: MONDO:0033645
              label: mitochondrial complex IV deficiency, nuclear type 11
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COX20 Loss and Defective COX2 Maturation
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic COX20 variants cause loss of the inner-membrane COX2 chaperone. COX20
          binds newly synthesized COX2, stabilizes it, and presents it to the SCO1/SCO2 copper-metallation
          module; in its absence COX2 is unstable and Complex IV stalls at an early subassembly that contains
          COX1 (and COX4) but is depleted of COX2, yielding isolated Complex IV biogenesis failure.

          '
        genes:
        - preferred_term: COX20
          term:
            id: hgnc:26970
            label: COX20
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: These cell lines exhibit a severe, isolated CIV deficiency due to instability of COX2,
          a mitochondrion-encoded CIV subunit
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24403053
      reference_title: Human COX20 cooperates with SCO1 and SCO2 to mature COX2 and promote the assembly
        of cytochrome c oxidase.
      evidence_source: IN_VITRO
      explanation: COX20 knockout/knockdown human cell lines show isolated Complex IV deficiency caused
        by COX2 instability, establishing the molecular lesion.
