              label: mitochondrial complex IV deficiency, nuclear type 16
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COX4-1 Subunit Loss and Failed Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'COX4I1 encodes the common (ubiquitous) isoform of cytochrome c oxidase subunit 4,
          a nuclear-encoded structural and regulatory subunit of Complex IV. Biallelic COX4I1 variants
          reduce or abolish COX4-1 expression; in the index case the COX4I1 mRNA was decreased and the
          COX4 protein undetectable. Loss of this core subunit destabilizes the holoenzyme and yields
          an isolated Complex IV biogenesis defect.

          '
        genes:
        - preferred_term: COX4I1
          term:
            id: hgnc:2265
            label: COX4I1
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: This nuclear gene encodes the common isoform of cytochrome c oxidase (COX) subunit 4
          (COX 4-1), an integral regulatory part of COX (respiratory chain complex IV) the terminal electron
          acceptor of the mitochondrial respiratory chain.
        supports: SUPPORT
    origin:
