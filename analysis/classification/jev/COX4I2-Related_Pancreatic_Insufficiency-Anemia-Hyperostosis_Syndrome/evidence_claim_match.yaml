            label: COX4I2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        features: The founding c.412G>A (p.Glu138Lys) missense allele was homozygous in four index patients
          and an additional affected relative. It was absent from 180 screened controls. Glu138 is conserved
          at the subunit IV/VIIb interface, but interface disruption and assembly failure were not directly
          tested.
        variants:
        - name: c.412G>A (p.Glu138Lys)
          gene:
            preferred_term: COX4I2
            term:
              id: hgnc:16232
              label: COX4I2
          variant_type: single nucleotide variant
          description: Homozygous coding missense substitution, also described as E138K. The association
            is supported by segregation and altered transcript abundance/inducibility in patient cells.
            These assays do not establish a splicing mechanism or eliminate all alternative explanations.
        notes: A broader 2012 COX-deficiency variant screen is not an independently confirmed EPIDACH
          cohort. Computational predictions or a single heterozygous COX4I2 finding should not be equated
          with this recessive syndrome. ClinGen classified COX4I2 as Limited (AR) for the broader concept
          mitochondrial disease (MONDO:0044970, 2024-03-18); that is not this entry's MONDO:0012992, so
          it is not recorded as gene_disease_validity. The causative relationship rests on one consanguineous
          kindred.
      selected_evidence:
        snippet: changing glutamic acid at codon 138 to lysine (E138K)
        supports: SUPPORT
