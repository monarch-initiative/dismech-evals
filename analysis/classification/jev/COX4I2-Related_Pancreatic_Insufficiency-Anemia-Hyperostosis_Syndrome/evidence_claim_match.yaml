          Rather than the brainstem/Leigh-like pattern of most nuclear COX defects, COX4I2 disease presents
          as a non-neurological triad — congenital exocrine pancreatic insufficiency, dyserythropoietic
          anemia, and calvarial hyperostosis — reflecting the acinar-biased and hypoxia-responsive expression
          of the affected isoform.

          '
