              and calvarial hyperostosis (EPIDACH)
            term:
              id: MONDO:0012992
              label: pancreatic insufficiency-anemia-hyperostosis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COX4I2 Subunit Loss and Failed Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic COX4I2 variants markedly reduce expression of cytochrome c oxidase subunit
          4 isoform 2, an essential structural subunit of Complex IV. Because the COX4I2-to-COX4I1 mRNA
          ratio is relatively high in human pancreatic acinar cells and COX4I2 is the hypoxia-responsive
          isoform, loss of COX4I2 produces a tissue-biased Complex IV biogenesis failure, with the additional
          loss of the physiologic COX4I2 response to hypoxia. The lesion sits in the nuclear-encoded structural-subunit
          arm of the COX biogenesis pathway.

          '
        genes:
        - preferred_term: COX4I2
          term:
            id: hgnc:16232
            label: COX4I2
        cell_types:
        - preferred_term: pancreatic acinar cell
          term:
            id: CL:0002064
            label: pancreatic acinar cell
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
        - preferred_term: COX4I2 response to hypoxia
          term:
            id: GO:0001666
            label: response to hypoxia
          modifier: DECREASED
      selected_evidence:
        snippet: we excluded these disorders and identified, by using homozygosity mapping, a mutation
          in the COX4I2 gene
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
