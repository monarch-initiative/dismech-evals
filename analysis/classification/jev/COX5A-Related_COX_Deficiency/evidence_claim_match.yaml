      assertion_type: Pathophysiology
      assertion:
        name: COX5A Structural Subunit Loss and Failed Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic COX5A variants disrupt a nuclear-encoded structural subunit of Complex
          IV. The reported variant lies within the conserved COX5A/COX4 interface domain, altering the
          interaction between these subunits during holoenzyme biogenesis. As a result the monomeric COX1
          assembly intermediate accumulates and the mature enzyme fails to assemble, yielding isolated
          Complex IV biogenesis failure.

          '
        genes:
        - preferred_term: COX5A
          term:
            id: hgnc:2267
            label: COX5A
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: COX5A is a nuclear-encoded subunit of mitochondrial respiratory chain complex IV
        supports: SUPPORT
