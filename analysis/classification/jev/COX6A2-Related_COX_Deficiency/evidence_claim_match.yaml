    claim:
      about:
        disease:
          name: COX6A2-Related COX Deficiency
          disease_term:
            preferred_term: COX6A2-related COX deficiency (MC4DN18)
            term:
              id: MONDO:0033653
              label: mitochondrial complex IV deficiency, nuclear type 18
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COX6A2 Structural Subunit Loss and Failed Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic COX6A2 missense variants disrupt the heart/skeletal-muscle isoform of
          the nuclear-encoded structural subunit VIa of Complex IV. Because COX6A2 is expressed only in
          striated muscle, the consequence is a tissue-restricted failure of Complex IV biogenesis: assembly
          of the holoenzyme and its incorporation into respiratory supercomplexes is impaired in muscle,
          while other organs are spared.

          '
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: Whole exome sequencing identified biallelic missense variants in COX6A2, which is expressed
          only in the skeletal muscle and heart.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31155743
      reference_title: COX6A2 variants cause a muscle-specific cytochrome c oxidase deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes COX6A2 as a striated-muscle-restricted Complex IV subunit, the protein
        affected in this disorder.
