        context: []
      assertion_type: AnimalModel
      assertion:
        name: Global Cox6a2 knockout mouse
        species: Mouse
        genotype: Cox6a2-/-
        description: Global knockout mice reproduce complex IV biochemical impairment and mild workload-dependent
          diastolic dysfunction. Bulk heart and skeletal-muscle ATP remain preserved. Skeletal muscle
          shifts toward oxidative fibers with increased isolated fatigue resistance, while uphill exercise
          performance decreases. Cortical PV cells have oxidative damage, reduced nets and impaired dendritic
          and fast-spiking maturation, without loss of PV-cell density. Female behavioral cohorts show
          locomotor hyperactivity with preserved social preference and prepulse inhibition; these are
          not human psychiatric diagnoses.
        publication: PMID:11788423
        modeled_mechanisms:
        - target: Impaired Complex IV Assembly
          relationship: PARTIALLY_RECAPITULATES
          model_scale: ORGANISM
          limitations: Global null mice show substantial compensation and do not uniformly reproduce human
            myopathy or the ATP deficit of cultured cardiomyocytes.
        - target: Reduced Cytochrome c Oxidase Activity
          relationship: PARTIALLY_RECAPITULATES
          model_scale: ORGANISM
          limitations: Global null mice show substantial compensation and do not uniformly reproduce human
            myopathy or the ATP deficit of cultured cardiomyocytes.
        - target: Interneuron Oxidative DNA Damage
          relationship: PARTIALLY_RECAPITULATES
          model_scale: ORGANISM
          limitations: Global null mice show substantial compensation and do not uniformly reproduce human
            myopathy or the ATP deficit of cultured cardiomyocytes.
        - target: Reduced Perineuronal Nets
          relationship: PARTIALLY_RECAPITULATES
          model_scale: ORGANISM
          limitations: Global null mice show substantial compensation and do not uniformly reproduce human
            myopathy or the ATP deficit of cultured cardiomyocytes.
        - target: Impaired Fast-Spiking Maturation
          relationship: PARTIALLY_RECAPITULATES
          model_scale: ORGANISM
          limitations: Global null mice show substantial compensation and do not uniformly reproduce human
            myopathy or the ATP deficit of cultured cardiomyocytes.
        - target: Reduced Interneuron Dendritic Arborization
          relationship: PARTIALLY_RECAPITULATES
          model_scale: ORGANISM
          limitations: Global null mice show substantial compensation and do not uniformly reproduce human
            myopathy or the ATP deficit of cultured cardiomyocytes.
        - target: Reduced PV Interneuron Synaptic Contacts
          relationship: PARTIALLY_RECAPITULATES
          model_scale: CELLULAR
          limitations: Mouse synaptic anatomy does not establish a human psychiatric diagnosis.
        notes: 'Behavioral findings depend on protocol and cohort: the metabolic study reported reduced
          spontaneous activity, whereas the later female cohort showed increased locomotion in the open-field
          and social-interaction tests.'
      selected_evidence:
        snippet: Total COX activity was decreased in hearts from mutant mice, which appears to be a consequence
          of altered assembly of the holoenzyme COX.
        supports: SUPPORT
