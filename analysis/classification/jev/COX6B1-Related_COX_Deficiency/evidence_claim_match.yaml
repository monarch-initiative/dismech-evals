      assertion_type: Pathophysiology
      assertion:
        name: COX6B1 Loss and Defective Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic COX6B1 variants cause loss of a nuclear-encoded structural subunit of
          cytochrome c oxidase, destabilizing the holoenzyme and impairing assembly of a functional Complex
          IV. Unlike most nuclear COX defects, which affect assembly factors or metallochaperones, the
          lesion here is in a structural subunit itself.

          '
        genes:
        - preferred_term: COX6B1
          term:
            id: hgnc:2280
            label: COX6B1
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: We report a disease-associated mutation in one such subunit, COX6B1.
        supports: SUPPORT
    origin:
