        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Patient-derived COX8A-deficient fibroblasts
        experimental_model_type: CELL_LINE
        description: The original patient line shows abnormal splicing, reduced stable complex IV and
          enzyme activity. Wild-type lentiviral COX8A restores enzyme stability and activity. Later work
          reuses this line and finds residual complex IV in supercomplexes with no mtUPR/ISR transcriptional
          induction. Daria Rotko's doctoral thesis also reports lower mitochondrial BK-alpha protein without
          a statistically significant KCNMA1 RNA decrease; its clinical significance is unresolved.
        publication: PMID:26685157
        modeled_mechanisms:
        - target: Reduced stable free complex IV
          relationship: PARTIALLY_RECAPITULATES
          model_scale: CELLULAR
          limitations: Cellular biochemical findings do not reproduce the entire neurological or pulmonary
            phenotype.
        - target: Reduced complex IV activity
          relationship: PARTIALLY_RECAPITULATES
          model_scale: CELLULAR
          limitations: Cellular biochemical findings do not reproduce the entire neurological or pulmonary
            phenotype.
      selected_evidence:
        snippet: The mutation, affecting the last nucleotide of intron 1, leads to aberrant splicing,
          a frame-shift in the highly conserved exon 2, and decreased amount of the COX8A transcript.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26685157
      reference_title: Loss of the smallest subunit of cytochrome c oxidase, COX8A, causes Leigh-like
        syndrome and epilepsy.
      evidence_source: IN_VITRO
      explanation: Patient-cell RNA analysis links the intronic variant to abnormal splicing and reduced
        transcript abundance; it does not directly measure a decay pathway.
