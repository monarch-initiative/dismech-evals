      assertion_type: Pathophysiology
      assertion:
        name: COX8A Loss and Complex IV Destabilization
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'A homozygous COX8A splice-site variant abolishes the wild-type smallest structural
          subunit of Complex IV. Because COX8A is an integral structural subunit rather than a transient
          assembly factor, its loss severely impairs the stability of the entire cytochrome c oxidase
          holoenzyme, stalling biogenesis and yielding an isolated Complex IV deficiency in skeletal muscle
          and fibroblasts comparable to that caused by SURF1 mutations.

          '
        genes:
        - preferred_term: COX8A
          term:
            id: hgnc:2294
            label: COX8A
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: we identified a homozygous splice site mutation in COX8A, which codes for the ubiquitously
          expressed isoform of subunit VIII, the smallest nuclear-encoded subunit of complex IV
        supports: SUPPORT
    origin:
