            term:
              id: MONDO:0033656
              label: mitochondrial complex IV deficiency, nuclear type 21
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COXFA4/NDUFA4 Subunit Loss and Failed Complex IV Assembly
        conforms_to: complex_iv_assembly_deficiency#Complex IV Biogenesis Failure
        description: 'Biallelic loss-of-function variants in COXFA4 (formerly NDUFA4) abolish steady-state
          levels of the COXFA4/NDUFA4 polypeptide, a nuclear-encoded subunit of cytochrome c oxidase.
          Although the protein was long attributed to Complex I, it is a stoichiometric component of the
          individual COX complex, and its loss destabilizes the holoenzyme, producing an isolated Complex
          IV biogenesis defect rather than a Complex I deficiency.

          '
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex IV assembly
          term:
            id: GO:0033617
            label: mitochondrial respiratory chain complex IV assembly
          modifier: DECREASED
      selected_evidence:
        snippet: affected individuals harbored homozygous splice donor site mutations in NDUFA4, a gene
          previously assigned to encode a mitochondrial respiratory chain complex I (NADH:ubiquinone oxidoreductase)
          subunit.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
