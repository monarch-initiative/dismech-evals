      assertion:
        name: 'Cplx1 knockout mouse: brain anatomy'
        species: Mouse (Mus musculus)
        genotype: Homozygous Cplx1 knockout
        description: Cplx1 knockout mice show early ataxia, selective thalamic and cerebellar volume loss,
          molecular-layer atrophy and loss of granule cells in selected cerebellar lobules. The structural
          phenotype was nonprogressive across the sampled ages. Neuronal loss was not detected in the
          molecular layer. These anatomical findings are not uniform human disease features.
        modeled_mechanisms:
        - target: Complexin-1 Loss of Function
          relationship: PERTURBS
          description: Genetic deletion permits assessment of the neurological consequences of complexin-1
            loss.
          fidelity: UNKNOWN
          limitations: Whole-gene mouse knockout differs from human C-terminal and missense alleles; anatomy
            does not establish the human seizure mechanism.
      selected_evidence:
        snippet: This suggests that, as with the behavioural phenotype, the pathological phenotype is
          non-progressive.
        supports: SUPPORT
