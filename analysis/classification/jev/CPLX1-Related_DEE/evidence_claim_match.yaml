            term:
              id: hgnc:2309
              label: CPLX1
          variant_type: single nucleotide variant
        - name: NM_006651:c.322G>T (p.Glu108Ter)
          description: Homozygous nonsense allele reported in the original two siblings with migrating
            epilepsy and cortical atrophy.
          gene:
            preferred_term: CPLX1
            term:
              id: hgnc:2309
              label: CPLX1
          variant_type: single nucleotide variant
        - name: NM_006651.2:c.382C>A (p.Leu128Met)
          description: 'Homozygous in patient 3, born prematurely. ClinVar VCV000523650.12 has conflicting
            classifications: one likely pathogenic and three uncertain-significance submissions contributing
            to the aggregate. Functional loss has not been demonstrated.'
          gene:
            preferred_term: CPLX1
            term:
              id: hgnc:2309
              label: CPLX1
          variant_type: single nucleotide variant
        - name: NM_006651.4:c.4G>A (p.Glu2Lys)
          description: Homozygous variant in a patient labelled as having Dravet syndrome, with heterozygous
            SCN9A c.3332_3346del (p.Ser1111_Glu1115del). Attribution to CPLX1 alone and the functional
            effect remain unresolved.
          gene:
            preferred_term: CPLX1
            term:
              id: hgnc:2309
              label: CPLX1
          variant_type: single nucleotide variant
      selected_evidence:
        snippet: WES detected the homozygous nonsense variant chr4:g.786591G>T (GRCh38/hg38); NM_006651.2:c.315C>A;
          NP_006642.1:p.(Cys105Ter) in Exon 4 of CPLX1 in the affected sisters. The unaffected parents
