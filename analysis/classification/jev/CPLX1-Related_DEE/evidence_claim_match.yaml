      assertion_type: Discussion
      assertion:
        discussion_id: gap_cplx1_phenotype_boundary_dee_versus_neurodegeneration
        prompt: Is biallelic CPLX1 loss best defined as a developmental and epileptic encephalopathy,
          as a progressive neurodegenerative/movement disorder, or as a single spectrum encompassing both
          — and what determines which phenotype predominates in a given patient?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Complexin-1 Loss of Function
        - pathophysiology#Epileptiform Brain Activity
        rationale: The original p.Glu108Ter siblings had cortical atrophy, whereas the 2017 cases did
          not. One later case had a localized cerebellar cleft that may be coincidental. Mouse thalamic/cerebellar
          changes and granule-cell loss were nonprogressive across sampled ages; they do not establish
          human neurodegeneration. Small case numbers and uncertain missense attribution limit genotype-phenotype
          conclusions.
        proposed_experiments:
        - experiment_id: exp_cplx1_natural_history_genotype_phenotype_cohort
          experiment_design: HUMAN_OBSERVATIONAL
          name: CPLX1 natural-history and genotype-phenotype cohort
          description: Assemble an international cohort of biallelic CPLX1 cases with standardized longitudinal
            phenotyping (seizure semiology and course, motor/movement features, developmental trajectory,
            and serial neuroimaging) to test whether epileptic and neurodegenerative/movement features
            co-segregate or define distinct subgroups, and whether variant class predicts phenotype.
          experiment_type:
            preferred_term: natural-history cohort study
          readouts:
          - name: Longitudinal phenotype and course readouts
            target: pathophysiology#Epileptiform Brain Activity
            biological_processes:
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: ABNORMAL
            assays:
            - preferred_term: electroencephalography
            - preferred_term: magnetic resonance imaging
            direction: POSITIVE
          controls:
          - name: Other synaptic vesicle cycle disorders
            description: Comparison cohorts with STXBP1, SNAP25, STX1B, or SYT1 disorders to contextualize
              the CPLX1 phenotype spectrum.
          decision_criterion: A unified spectrum is supported if epileptic and movement/neurodegenerative
            features consistently co-occur across cases; a split is supported if distinct, variant-correlated
            subgroups emerge.
          would_support:
          - pathophysiology#Epileptiform Brain Activity
      selected_evidence:
        snippet: We identified a homozygous nonsense mutation (NM_006651:c.G322T:p.E108X) in the CPLX1
          gene in two female siblings, BAB6167 and BAB6168, who presented with malignant migrating epilepsy
          and cortical atrophy.
        supports: SUPPORT
