      assertion:
        name: Complexin-1 Loss of Function
        conforms_to: synaptic_vesicle_cycle#Synaptic Vesicle Cycle Protein Deficiency
        description: Biallelic loss-of-function variants in CPLX1 abolish complexin-1, a cytosolic protein
          crucially involved in neuronal synaptic regulation. Complexin-1 binds the assembled SNARE complex,
          acting as a fusion clamp and a facilitator of calcium-triggered release, so its loss removes
          a key regulator of the fusion machinery.
        role: trigger
        cell_types:
