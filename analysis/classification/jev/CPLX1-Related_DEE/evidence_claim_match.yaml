            was not measured.
      selected_evidence:
        snippet: Here we show that complexin's CTD is highly sensitive to membrane curvature, which it
          senses via tandem motifs, a C-terminal motif containing a mix of bulky hydrophobic and positively
          charged residues, and an adjacent amphipathic region that can bind membranes in either a disordered
          or a helical conformation.
        supports: SUPPORT
