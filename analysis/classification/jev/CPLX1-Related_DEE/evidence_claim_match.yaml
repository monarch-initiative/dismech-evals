  da2b880b657d0a3146163c4431a6ecf84ea08887250322810b728f1818e298d1:
    claim:
      about:
        disease:
          name: CPLX1-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: CPLX1 developmental and epileptic encephalopathy
            term:
              id: MONDO:0033372
              label: developmental and epileptic encephalopathy, 63
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cplx1_clamp_versus_facilitator_dominant_lesion
        prompt: Complexin-1 both clamps spontaneous vesicle fusion and facilitates fast calcium-evoked
          release; which arm of this dual function, when lost in CPLX1 disease, dominates the pathogenic
          synaptic defect — disinhibited spontaneous release, failed evoked release, or both?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Evoked Synaptic Vesicle Release
        rationale: Evoked-release impairment is shared across dual-knockdown cortical cultures and single-knockout
          calyces, whereas resting spontaneous release changes in opposite directions. Poststimulus asynchronous
          release is a separate defect. The dominant lesion in patient-variant human neurons and its contribution
          to epilepsy remain unresolved. Available p.Glu2Lys iPSCs also carry an SCN9A deletion and have
          not yet supplied neuronal functional data.
        proposed_experiments:
        - experiment_id: exp_cplx1_spontaneous_versus_evoked_release_dissection
          experiment_design: TARGETED_PERTURBATION
          name: CPLX1-null human neuron spontaneous-versus-evoked release dissection
          description: In CPLX1-null human iPSC-derived neurons, quantify spontaneous (miniature) release
            frequency and fast calcium-evoked release amplitude, then rescue with wild-type complexin-1
            versus separation-of-function mutants that selectively restore clamping or facilitation, to
            attribute the pathogenic defect to a specific arm.
          experiment_type:
            preferred_term: electrophysiological release-mode dissection experiment
          perturbations:
          - name: CPLX1 knockout and separation-of-function rescue
            target: pathophysiology#Reduced Evoked Synaptic Vesicle Release
            genes:
            - preferred_term: CPLX1
              term:
                id: hgnc:2309
                label: CPLX1
            description: Compare CPLX1-null neurons rescued with wild-type complexin-1 versus clamp-selective
              or facilitation-selective complexin-1 variants.
          readouts:
          - name: Spontaneous and evoked release readouts
            target: pathophysiology#Reduced Evoked Synaptic Vesicle Release
            biological_processes:
            - preferred_term: synaptic vesicle exocytosis
              term:
                id: GO:0016079
                label: synaptic vesicle exocytosis
              modifier: DYSREGULATED
            - preferred_term: calcium-dependent activation of synaptic vesicle fusion
              term:
                id: GO:0099502
                label: calcium-dependent activation of synaptic vesicle fusion
              modifier: DYSREGULATED
            assays:
            - preferred_term: patch-clamp electrophysiology
            direction: POSITIVE
          controls:
          - name: Wild-type complexin-1 rescue
            description: CPLX1-null neurons rescued with wild-type human complexin-1.
          - name: Isogenic wild-type neurons
            description: Isogenic CPLX1-intact neurons from the same iPSC background.
          decision_criterion: The clamp arm dominates if the pathogenic defect is a selective rise in
            spontaneous release rescued only by clamp-competent complexin-1; the facilitator arm dominates
            if the defect is a selective loss of evoked release rescued only by facilitation-competent
            complexin-1.
          would_support:
          - pathophysiology#Reduced Evoked Synaptic Vesicle Release
      selected_evidence:
        snippet: In contrast, the complexin knock-down decreased 3-4 fold the amplitude of excitatory
          postsynaptic currents (EPSCs) evoked by isolated action potentials
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19164751
      reference_title: Complexin controls the force transfer from SNARE complexes to membranes in fusion.
      evidence_source: IN_VITRO
      explanation: Evoked release was reduced in the dual-knockdown cortical culture.
