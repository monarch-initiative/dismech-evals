        name: KAIMRCi003A and KAIMRCi003B patient iPSCs
        experimental_model_type: OTHER
        cell_source: Patient peripheral blood erythroid progenitors reprogrammed to iPSCs
        description: Two integration-free iPSC clones were generated from one seven-year-old patient labelled
          with Dravet syndrome, developmental delay, infantile seizures and choreoathetotic movements.
          Both carry homozygous CPLX1 p.Glu2Lys and a heterozygous SCN9A in-frame deletion. Identity,
          normal female karyotype, pluripotency and trilineage differentiation were characterized. Disease-relevant
          neuronal physiology, isogenic correction and functional rescue were proposed future work, not
          reported results.
        notes: An undifferentiated patient-derived resource, not yet a validated neuronal disease model.
          The co-occurring SCN9A variant prevents assigning cellular findings to CPLX1 without further
          experiments.
      selected_evidence:
        snippet: Further analysis unraveled homozygous variant c.4G > A p.(Glu2Lys) in the CPLX1 gene.
          This variant leads to an amino acid exchange in exon 1 (NM_006651.4).
        supports: SUPPORT
