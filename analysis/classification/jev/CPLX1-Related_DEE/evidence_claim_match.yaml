          term:
            id: GO:0099504
            label: synaptic vesicle cycle
          modifier: ABNORMAL
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: The encoded protein, complexin 1, is crucially involved in neuronal synaptic regulation,
          and homozygous Cplx1 knockout mice have the earliest known onset of ataxia seen in a mouse model.
        supports: SUPPORT
