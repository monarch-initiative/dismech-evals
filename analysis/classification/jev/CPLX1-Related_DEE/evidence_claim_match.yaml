  4d39225881b1ebd293cfa465e84251c5231c83dadfc62e0505f9e2622fdaf991:
    claim:
      about:
        disease:
          name: CPLX1-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: CPLX1 developmental and epileptic encephalopathy
            term:
              id: MONDO:0033372
              label: developmental and epileptic encephalopathy, 63
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cplx1_mouse_model_fidelity_to_human_encephalopathy
        prompt: How faithfully does the Cplx1-knockout mouse — dominated by ataxia and a movement phenotype
          with variable seizures — model the human CPLX1 epileptic encephalopathy, versus mainly recapitulating
          the motor arm of the disease?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Cortical Hyperexcitability and Seizures
        rationale: 'The principal in vivo evidence for CPLX1 loss is the Cplx1-knockout mouse, whose most
          striking, earliest phenotype is ataxia (a cerebellar/motor feature) rather than the severe cortical
          epileptic encephalopathy that defines the human disorder. This is a translational-fidelity mismatch:
          the model clearly demonstrates that complexin-1 loss is neurologically catastrophic, but whether
          it reproduces the human seizure/cortical phenotype — as opposed to a predominantly movement
          phenotype — is the open question, so its evidence weight for the seizure node should be qualified.'
        proposed_experiments:
        - experiment_id: exp_cplx1_cross_species_network_excitability_comparison
          name: CPLX1 cross-species network-excitability comparison
          description: Directly compare cortical network excitability and seizure-like activity between
            Cplx1-knockout mouse cortical preparations and human CPLX1-null iPSC-derived cortical neurons/organoids,
            to test whether the human cortical hyperexcitability phenotype is reproduced by the mouse
            or is human-specific.
          experiment_type:
            preferred_term: cross-species network-excitability comparison
          perturbations:
          - name: CPLX1 loss of function across species
            target: pathophysiology#Cortical Hyperexcitability and Seizures
            genes:
            - preferred_term: CPLX1
              term:
                id: hgnc:2309
                label: CPLX1
            description: Cplx1-knockout mouse cortex versus isogenic human CPLX1-null cortical neurons/organoids.
          readouts:
          - name: Network hyperexcitability readouts
            target: pathophysiology#Cortical Hyperexcitability and Seizures
            biological_processes:
            - preferred_term: trans-synaptic signaling
              term:
                id: GO:0099537
                label: trans-synaptic signaling
              modifier: DYSREGULATED
            - preferred_term: chemical synaptic transmission
              term:
                id: GO:0007268
                label: chemical synaptic transmission
              modifier: ABNORMAL
            assays:
            - preferred_term: multielectrode array recording
            direction: POSITIVE
          controls:
          - name: Isogenic wild-type human neurons
            description: CPLX1-intact human neurons from the same iPSC background.
          - name: Wild-type mouse cortex
            description: Cplx1 wild-type littermate cortical preparations.
          decision_criterion: The mouse is a faithful model of the human seizure phenotype if Cplx1-null
            mouse cortex shows network hyperexcitability matching human CPLX1-null cortical neurons; a
            human-specific cortical phenotype is supported if hyperexcitability appears in human but not
            mouse preparations.
          would_support:
          - pathophysiology#Cortical Hyperexcitability and Seizures
      selected_evidence:
        snippet: homozygous Cplx1 knockout mice have the earliest known onset of ataxia seen in a mouse
          model.
        supports: SUPPORT
