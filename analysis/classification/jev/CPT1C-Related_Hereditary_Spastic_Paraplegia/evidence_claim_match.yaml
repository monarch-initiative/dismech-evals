      assertion_type: Pathophysiology
      assertion:
        name: CPT1C Dysfunction (Neuronal ER Isoform)
        conforms_to: corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect
        description: 'A heterozygous CPT1C variant (p.Arg37Cys) alters the neuronal, ER-localized isoform
          of carnitine palmitoyltransferase 1. CPT1C differs from the mitochondrial CPT1A/CPT1B isozymes:
          it localizes to the endoplasmic reticulum, is expressed mainly in neurons, and has little or
          no fatty-acid-oxidation activity, so the lesion is a neuronal ER-protein defect rather than
          a classic carnitine-cycle fatty-acid oxidation block.'
        gene:
          preferred_term: CPT1C
          term:
            id: hgnc:18540
            label: CPT1C
      selected_evidence:
        snippet: It localizes to the ER and not to the mitochondria11 and has little or no enzymatic activity
          in fatty acid oxidation.
        supports: SUPPORT
