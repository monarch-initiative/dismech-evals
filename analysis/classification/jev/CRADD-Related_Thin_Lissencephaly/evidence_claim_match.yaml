        context: []
      assertion_type: Genetic
      assertion:
        name: CRADD
        gene_term:
          preferred_term: CRADD
          term:
            id: hgnc:2340
            label: CRADD
        association: Causal
        notes: CRADD (RAIDD) encodes the caspase-recruitment-domain/death-domain adaptor of the PIDDosome.
          Biallelic missense variants clustered in the death domain cause autosomal recessive thin lissencephaly
          (MONDO:0013785 / OMIM:614499, "intellectual developmental disorder, autosomal recessive 34,
          with variant lissencephaly"). The variants act through loss of caspase-2 activation rather than
          disruption of complex assembly.
      selected_evidence:
        snippet: Trio-based whole-exome sequencing and targeted re-sequencing identified recessive mutations
          of CRADD in six individuals with TLIS from four unrelated families of diverse ethnic backgrounds.
        supports: SUPPORT
