              label: intellectual disability, autosomal recessive 34
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Cortical Sculpting with Megalencephaly and Thin Lissencephaly
        description: Deficient developmental apoptosis impairs the normal "sculpting" of the neocortex
          — the elimination of excess neurons and neuropil that shapes cortical size and gyration. The
          proposed consequence is megalencephaly with a thin lissencephaly pattern (anterior-predominant
          pachygyria, wide shallow sulci, mildly thickened cortex) together with intellectual disability,
          reflecting a failure to prune inappropriate neurons rather than a neuronal migration arrest.
        cell_types:
        - preferred_term: Cerebral cortex neuron
          term:
            id: CL:0010012
            label: cerebral cortex neuron
        biological_processes:
        - preferred_term: Cerebral cortex development
          term:
            id: GO:0021987
            label: cerebral cortex development
          modifier: ABNORMAL
        - preferred_term: Synapse pruning
          term:
            id: GO:0098883
            label: synapse pruning
          modifier: DECREASED
      selected_evidence:
        snippet: loss of CRADD function results in reduction of caspase-2-mediated apoptosis, resulting
          in megalencephaly and TLIS from failure to prune inappropriate neurons and/or neuropil.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
