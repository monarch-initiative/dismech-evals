      assertion_type: Pathophysiology
      assertion:
        name: Loss of CRADD Death-Domain Function and PIDDosome Signaling
        description: CRADD (RAIDD) is a death-domain adaptor that bridges PIDD1 and caspase-2 to assemble
          the apoptosis-promoting PIDDosome. The recessive TLIS-associated missense variants cluster within
          the CRADD death domain. In co-immunoprecipitation assays these variants still bind caspase-2
          and PIDD, so they do not disrupt complex partnering per se, but they abrogate the adaptor's
          ability to drive caspase-2 activation, producing a functional loss of pro-apoptotic signaling.
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Regulation of neuron apoptotic process
          term:
            id: GO:0043523
            label: regulation of neuron apoptotic process
          modifier: DECREASED
      selected_evidence:
        snippet: CRADD (also known as RAIDD) is a death-domain-containing adaptor protein that oligomerizes
          with PIDD and caspase-2 to initiate apoptosis.
        supports: SUPPORT
