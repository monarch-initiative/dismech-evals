  445e7e2d1951e0e7aa4c80ec62cc6a22f832fdf02f0ab47b813c78cace3b63d3:
    claim:
      about:
        disease:
          name: CRADD-Related Thin Lissencephaly
          disease_term:
            preferred_term: CRADD-related thin lissencephaly
            term:
              id: MONDO:0013785
              label: intellectual disability, autosomal recessive 34
        context: []
      assertion_type: Genetic
      assertion:
        name: CRADD
        gene_term:
          preferred_term: CRADD
          term:
            id: hgnc:2340
            label: CRADD
        association: Causative biallelic variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Missense, frameshift, start-loss and copy-number alleles are reported. Founder enrichment
          is documented in Finnish and Mennonite cohorts; published population frequencies are historical
          and are not disease-prevalence estimates. ClinGen classified the broader CRADD–syndromic intellectual
          disability relationship as definitive in 2021; that assertion uses MONDO:0000508 rather than
          the narrower identifier of this entry.
        variants:
        - name: p.Gly128Arg
          variant_type: single nucleotide variant
          type: missense
          description: NM_003805.3:c.382G>C; Homozygous Mennonite allele; patient fibroblast protein depletion
            and reduced PIDD interaction.
          gene:
            preferred_term: CRADD
            term:
              id: hgnc:2340
              label: CRADD
        - name: p.Phe164Cys
          variant_type: single nucleotide variant
          type: missense
          description: NM_003805.3:c.491T>G; In trans with a CRADD-containing 12q22 deletion; cellular
            abundance and PIDD co-IP retained, but purified protein is unstable.
          gene:
            preferred_term: CRADD
            term:
              id: hgnc:2340
              label: CRADD
        - name: p.Arg170Cys
          variant_type: single nucleotide variant
          type: missense
          description: NM_003805.3:c.508C>T; Homozygous in Turkish siblings; cellular co-IP retained but
            purified complex formation impaired.
          gene:
            preferred_term: CRADD
            term:
              id: hgnc:2340
              label: CRADD
        - name: p.Arg170His
          variant_type: single nucleotide variant
          type: missense
          description: NM_003805.3:c.509G>A; Homozygous Finnish founder allele; also reported in trans
            with a start-loss allele.
          gene:
            preferred_term: CRADD
            term:
              id: hgnc:2340
              label: CRADD
        - name: CRADD-containing 12q22 deletion
          variant_type: deletion
          type: deletion
          description: A 3.07 Mb deletion (hg38 chr12:92443579–95515465) in trans with p.Phe164Cys; additional
            genes are deleted, so not every feature can be assigned to CRADD alone.
          gene:
            preferred_term: CRADD
            term:
              id: hgnc:2340
              label: CRADD
        - name: p.Ala18IlefsTer47
          variant_type: deletion
          type: deletion
          description: NM_003805.5:c.52_59del, as recorded in the ClinGen case-level curation of the Harel
            family. The homozygous father and two fetuses illustrate variable expression.
          gene:
            preferred_term: CRADD
            term:
              id: hgnc:2340
              label: CRADD
        - name: p.Asp96ArgfsTer6
          variant_type: insertion
          type: frameshift insertion
          description: Reported as NM_003805.3:c.283_284insC in the 2018 MR123 family, with two mildly
            affected brothers. ClinGen represents the allele as NM_003805.5:c.285dup (p.Asp96fs). No focal
            functional assay was reported.
          gene:
            preferred_term: CRADD
            term:
              id: hgnc:2340
              label: CRADD
        - name: c.2T>C start loss
          variant_type: single nucleotide variant
          type: start loss
          description: NM_003805.5:c.2T>C p.Met1? in trans with p.Arg170His in FIN38; delayed speech,
            pachygyria and mild cognitive impairment. No patient protein assay was reported.
          gene:
            preferred_term: CRADD
            term:
              id: hgnc:2340
              label: CRADD
        - name: c.2T>G start loss
          variant_type: single nucleotide variant
          type: start loss
          description: Reported homozygously with a linked homozygous USP44 frameshift in Pakistani adults.
            The contribution of USP44 and the cause of additional skeletal features remain unresolved.
          gene:
            preferred_term: CRADD
            term:
              id: hgnc:2340
              label: CRADD
      selected_evidence:
        snippet: individuals with recessive CRADD mutations (n = 13) presented with TLIS, mild to moderate
          ID, epilepsy (3 of 13)
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27773430
      reference_title: Mutations in CRADD Result in Reduced Caspase-2-Mediated Neuronal Apoptosis and
