      assertion:
        name: Reduced Caspase-2-Mediated Developmental Neuronal Apoptosis
        conforms_to: neural_progenitor_centrosome_spindle_dysfunction#Programmed Cell Death Imbalance
          Branch
        description: Loss of CRADD-dependent caspase-2 activation reduces programmed cell death in the
          developing cortex. In vitro, wild-type CRADD drives apoptosis of PC12 cells and CRADD-null neurons,
          whereas the TLIS variants fail to do so, confirming that the variants reduce neuronal apoptosis.
          This places deficient developmental apoptosis — rather than the migration arrest of classical
          lissencephaly — at the center of the CRADD pathomechanism.
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: Cerebral cortex neuron
          term:
            id: CL:0010012
            label: cerebral cortex neuron
