      assertion_type: Discussion
      assertion:
        discussion_id: gap_cradd_mouse_model_lamination_mismatch
        prompt: Which developmental process connects impaired CRADD signaling to human cortical malformation,
          and which models can distinguish altered neuronal death from synaptic remodeling?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced Caspase-2-Dependent Neuronal Apoptosis
        - pathophysiology#Abnormal Cortical Gyration
        rationale: Cradd-null mice show brain enlargement and handling-induced seizures but normal cortical
          layering. Patient-variant experiments establish impaired caspase-2 activation and cell death
          in cultured cells. They do not directly distinguish altered neuronal death, synaptic remodeling
          or another developmental process in human cortex. Human cortical models and gyrencephalic organisms
          could test the proposed bridge without assuming it.
        proposed_experiments:
        - experiment_id: exp_cradd_human_organoid_apoptosis
          name: CRADD-null / CRADD-TLIS human cortical organoid apoptosis and lamination assay
          description: Generate CRADD-null and patient-variant (e.g., p.Gly128Arg) iPSC-derived cortical
            organoids and quantify caspase-2 activation, developmental neuronal apoptosis, neuron number,
            cortical-plate thickness, and lamination relative to isogenic controls, to test whether reduced
            caspase-2-mediated apoptosis produces a human cortical-architecture phenotype not seen in
            mouse.
          experiment_type:
            preferred_term: iPSC organoid perturbation assay
          model_systems:
          - name: Human iPSC-derived cortical organoid
            description: Cortical organoid differentiated from patient-derived or gene-edited human iPSCs
              carrying CRADD loss-of-function variants.
            experimental_model_type: ORGANOID
        - experiment_id: exp_cradd_gyrencephalic_model
          name: CRADD loss in a gyrencephalic model
          description: Evaluate cortical lamination, gyration, and brain size after CRADD loss-of-function
            in a gyrencephalic species (e.g., ferret) that, unlike the mouse, normally gyrifies, to test
            whether the human-like cortical phenotype emerges when a gyrencephalic developmental program
            is present.
          experiment_type:
            preferred_term: in vivo gene perturbation
          model_systems:
          - name: Gyrencephalic mammalian model
            description: A gyrencephalic species with an outer subventricular zone and cortical folding,
              contrasting with the lissencephalic mouse.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: Morphological analysis of Cradd−/− cortex revealed normal layering indistinguishable
          from WT mice
        supports: SUPPORT
