            term:
              id: MONDO:0013453
              label: Leber congenital amaurosis 8
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: crb1a_muller_glial_primacy
        hypothesis_label: Muller-glial CRB1-A loss is the necessary lesion in human disease
        status: CANONICAL
        description: Human disease requires the Muller-glial isoform to be hit. No patient has yet been
          reported whose variants affect CRB1-B alone, and a cohort reappraisal that scored predicted
          isoform dosage per patient concluded that severity tracks with the CRB1-A lesion. On this model
          the outer limiting membrane fails from the glial side, and the photoreceptor isoform modifies
          the picture rather than initiating it.
      selected_evidence:
        snippet: In humans, the retinal degeneration appears early, and the phenotype is mainly driven
          by the Müller cell isoform A impairment.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34884448
      reference_title: 'CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in
        the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms.'
      evidence_source: HUMAN_CLINICAL
      explanation: Independent cohort assigning the severity-determining role to the Muller-cell isoform
