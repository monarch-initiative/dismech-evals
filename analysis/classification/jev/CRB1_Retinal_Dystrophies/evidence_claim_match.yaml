              label: Leber congenital amaurosis 8
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: crb1_subtype_axis_under_review
        prompt: Should this entry keep the flat LCA8 / RP12 / macular dystrophy split, or move to the
          pan-retinopathy versus maculopathy axis used by the newer literature?
        kind: INTERPRETATION
        status: OPEN
        attaches_to:
        - has_subtypes#
        rationale: 'The three subtypes here follow the phenotypic diagnoses assigned in a single 104-patient
          cohort, and all three subtype frequencies come from one sentence in it. Two later series reorganise
          the same disease along a different axis: a 75-patient cohort treats pan-retinopathy and maculopathy
          as the two primary phenotypes and calls them distinct entities, which collapses LCA8 and RP12
          into severity poles of one branch while setting maculopathy apart on genetic grounds; a 389-patient
          reclassification under standardised criteria adds cone-rod dystrophy as a fourth phenotype.
          A counterweight is that in one p.(Pro836Thr) series, imaging that looked macula-confined sat
          on top of generalised photoreceptor dysfunction on electrophysiology, so a structurally-defined
          maculopathy category may not be as clean as it appears. Restructuring has_subtypes would also
          strand the LCA8 and RP12 MONDO groundings, which are the two mappings in this entry that are
          unambiguously correct. The decision, together with the entry-level disease_term question, is
          reserved for the maintainer in issue 8997 and is deliberately not taken here; this discussion
          records the evidence so the choice is not re-derived from scratch.'
      selected_evidence:
        snippet: This study establishes CRB1-associated pan-retinopathy and maculopathy as clinically
          and genetically distinct entities.
        supports: SUPPORT
