          no mouse carrying the equivalent in-frame deletion and, at the time of the largest series, no
          macular-dystrophy CRB1 induced pluripotent stem cell line was available. Structural prediction
          suggests the deletion destabilises two adjacent EGF-like modules, but that does not explain
          why the consequence is confined to the macula.'
