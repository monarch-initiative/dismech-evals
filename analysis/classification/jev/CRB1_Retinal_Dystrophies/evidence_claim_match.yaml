      assertion_type: Genetic
      assertion:
        name: CRB1
        features: 'CRB1 encodes Crumbs homolog 1, a transmembrane protein with 19 EGF-like domains, 3
          laminin A globular-like domains, and a cytoplasmic domain with FERM and PDZ binding motifs.
          Over 150 pathogenic variants have been reported, with missense mutations constituting 66% and
          exons 7 and 9 being most frequently mutated. The p.Cys948Tyr variant in exon 9 is the most common
          (24% of known CRB1 mutations). Null variants are enriched in EOSRD/LCA, but genotype-phenotype
          correlation is limited by modifier effects. Exon position matters because it determines which
          retinal isoforms a variant disrupts: exon 6, 7 and 9 variants affect both CRB1-A and CRB1-B
          and track with LCA/EOSRD and RP, whereas exon 2 variants - notably the in-frame deletion c.498_506del
          p.(Ile167_Gly169del) - affect CRB1-A only and track with macular dystrophy. The exon-7 missense
          c.2506C>A p.(Pro836Thr) is the common variant of Black African ancestry, at 0.329% allele frequency
          in African populations in gnomAD v4.1.0.'
        gene_term:
          preferred_term: CRB1
          term:
            id: hgnc:2343
            label: CRB1
        association: Causative
        relationship_type: CAUSATIVE
      selected_evidence:
        snippet: Mutations in the CRB1 gene are associated with variable phenotypes of severe retinal
          dystrophies, ranging from leber congenital amaurosis (LCA) to rod-cone dystrophy, also called
          retinitis pigmentosa (RP).
