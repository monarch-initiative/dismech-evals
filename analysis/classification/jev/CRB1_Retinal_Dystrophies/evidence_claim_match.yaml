  f9a3b0f8d973b2f7b719f01139555669af503d5451cf54951d323b02a9c53ec1:
    claim:
      about:
        disease:
          name: CRB1 Retinal Dystrophies
          disease_term:
            preferred_term: Leber congenital amaurosis 8
            term:
              id: MONDO:0013453
              label: Leber congenital amaurosis 8
        context:
        - path: /pathophysiology/0
          value:
            name: Isoform-partitioned loss of CRB1-A in Muller glia and CRB1-B in photoreceptors
            biological_scale: MOLECULAR
            description: 'CRB1 is transcribed in the retina as two major isoforms occupying different
              cells. The canonical 12-exon CRB1-A is expressed in Muller glia and is the predominant isoform
              during retinal development; the shorter CRB1-B is expressed in photoreceptors and is the
              more abundant isoform in the adult retina. Both reach the outer limiting membrane from opposite
              sides of the same junction. Because a variant''s exon position determines which transcripts
              it disrupts, one gene produces cell-type-partitioned lesions rather than a single uniform
              loss: exon 6, 7 and 9 variants hit both isoforms, whereas exon 2 variants such as c.498_506del
              p.(Ile167_Gly169del) affect CRB1-A only and leave CRB1-B intact. In the largest genotype
              series assembled to date every patient carried a variant affecting CRB1-A and none was CRB1-B-exclusive,
              so CRB1-A involvement appears necessary for disease.'
            gene:
              preferred_term: CRB1
              modifier: DECREASED
              term:
                id: hgnc:2343
                label: CRB1
            cell_types:
            - preferred_term: Mueller cell
              term:
                id: CL:0000636
                label: Mueller cell
            - preferred_term: photoreceptor cell
              term:
                id: CL:0000210
                label: photoreceptor cell
            notes: No biological-process term is bound here on purpose. The two isoforms arise from distinct
              promoters rather than from regulated alternative splicing, so the GO splicing-regulation
              terms would misdescribe the mechanism, and GO has no term for isoform-partitioned expression
              across two cell types.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Macular dystrophy
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        hypothesis_groups:
        - crb1b_sparing_attenuates
        description: 'Proposed route to the macular-limited end of the spectrum: when the variant combination
          leaves photoreceptor CRB1-B intact, the retained adult-retina isoform is held to limit the lesion
          to the macula. The intermediate steps between preserved CRB1-B and macular-restricted degeneration
          are not known, and this edge belongs to an emerging hypothesis that one cohort contradicts.'
      selected_evidence:
        snippet: The proportion of patients harboring biallelic variants expressing wild-type CRB1-B was
          significantly higher in the maculopathy group (30.8%) than in the pan-retinopathy group (8.1%).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0/downstream/1
      evidence_path: /pathophysiology/0/downstream/1/evidence/0
      context_paths:
      - /name
      - /disease_term
      - /pathophysiology/0
    evidence_metadata:
      reference: PMID:41358656
      reference_title: Detailed Comparison Between Two Main Phenotypes of CRB1-Related Retinal Dystrophy,
        Pan-retinopathy and Maculopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the enrichment of preserved CRB1-B in the macular-limited group relative
        to pan-retinopathy in a 75-patient cohort.
