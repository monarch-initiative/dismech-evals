            term:
              id: MONDO:0013453
              label: Leber congenital amaurosis 8
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: crb1_isoform_b_severity_conflict
        prompt: Does preserved photoreceptor CRB1-B actually attenuate CRB1 retinopathy, or is the association
          with macular-limited disease carried entirely by which CRB1-A variants happen to spare it?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#crb1b_sparing_attenuates
        - pathophysiology#Isoform-partitioned loss of CRB1-A in Muller glia and CRB1-B in photoreceptors
        rationale: 'Three cohorts have scored the same variable and disagree. Two recent series (n=75
          and n=389) find wild-type CRB1-B enriched in macular-limited disease and CRB1-A-only variants
          associated with macular dystrophy. An earlier series (n=50) scored predicted isoform dosage
          patient by patient and found the opposite: it reports patients with fully preserved isoform
          B who nonetheless had early-onset retinal dystrophy, and patients with the macular c.498_506del
          variant who developed macular dystrophy irrespective of isoform-B status. The disagreement is
          not merely one of cohort size, because the alternative reading is confounding rather than noise:
          the exon-2 variants that spare CRB1-B are also the mildest CRB1-A lesions, so isoform-B preservation
          may be a marker of a mild CRB1-A allele rather than a protective factor in its own right. All
          three cohorts report predicted, not measured, isoform dosage.'
        proposed_experiments:
        - experiment_id: crb1_isoform_dosage_organoid_series
          name: Measured isoform dosage in patient iPSC-derived retinal organoids stratified by phenotype
          description: Derive retinal organoids from patients matched for predicted CRB1-A lesion severity
            but differing in whether CRB1-B is spared, and quantify CRB1-A and CRB1-B transcript and protein
            directly instead of predicting them from exon position. Score outer limiting membrane integrity
            and photoreceptor lamination.
          would_support:
          - pathophysiology#Isoform-partitioned loss of CRB1-A in Muller glia and CRB1-B in photoreceptors
          supporting_outcome:
          - Among patients matched on CRB1-A lesion severity, those retaining measured CRB1-B protein
            show better preserved outer limiting membrane and lamination than those who do not.
          refuting_outcome:
          - Organoid phenotype tracks with measured CRB1-A dosage alone, with no residual effect of CRB1-B
            once CRB1-A severity is matched.
      selected_evidence:
        snippet: Furthermore, all patients with the specific c.498_506del macular variant developed a
          macular dystrophy regardless of the impact on isoform B.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34884448
      reference_title: 'CRB1-Related Retinal Dystrophies in a Cohort of 50 Patients: A Reappraisal in
        the Light of Specific Müller Cell and Photoreceptor CRB1 Isoforms.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'The observation on which the dissenting cohort rests: within carriers of the macular
        variant, isoform-B status made no difference.'
