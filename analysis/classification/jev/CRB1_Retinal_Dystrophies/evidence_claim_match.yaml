        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Isoform-partitioned loss of CRB1-A in Muller glia and CRB1-B in photoreceptors
        biological_scale: MOLECULAR
        description: 'CRB1 is transcribed in the retina as two major isoforms occupying different cells.
          The canonical 12-exon CRB1-A is expressed in Muller glia and is the predominant isoform during
          retinal development; the shorter CRB1-B is expressed in photoreceptors and is the more abundant
          isoform in the adult retina. Both reach the outer limiting membrane from opposite sides of the
          same junction. Because a variant''s exon position determines which transcripts it disrupts,
          one gene produces cell-type-partitioned lesions rather than a single uniform loss: exon 6, 7
          and 9 variants hit both isoforms, whereas exon 2 variants such as c.498_506del p.(Ile167_Gly169del)
          affect CRB1-A only and leave CRB1-B intact. In the largest genotype series assembled to date
          every patient carried a variant affecting CRB1-A and none was CRB1-B-exclusive, so CRB1-A involvement
          appears necessary for disease.'
        gene:
          preferred_term: CRB1
          modifier: DECREASED
          term:
            id: hgnc:2343
            label: CRB1
        cell_types:
        - preferred_term: Mueller cell
          term:
            id: CL:0000636
            label: Mueller cell
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        notes: No biological-process term is bound here on purpose. The two isoforms arise from distinct
          promoters rather than from regulated alternative splicing, so the GO splicing-regulation terms
          would misdescribe the mechanism, and GO has no term for isoform-partitioned expression across
          two cell types.
      selected_evidence:
        snippet: Crumbs homolog 1-A is primarily expressed in Müller cells and plays a vital role in retinal
          development, whereas CRB1-B, expressed in photoreceptors, helps maintain long-term retinal integrity
          in adult retinas.
        supports: SUPPORT
