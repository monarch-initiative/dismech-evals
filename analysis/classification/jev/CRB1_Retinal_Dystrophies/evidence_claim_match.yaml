      assertion:
        hypothesis_group_id: crb1b_sparing_attenuates
        hypothesis_label: Preserved photoreceptor CRB1-B attenuates disease to macular-limited dystrophy
        status: EMERGING
        description: 'A second, contested claim: beyond requiring CRB1-A to be hit, the phenotype is graded
          by whether CRB1-B survives. Two recent cohorts find preserved wild-type CRB1-B enriched in macular-limited
          disease and CRB1-A-only variants associated with macular dystrophy. An earlier cohort that scored
          the same variable reached the opposite conclusion, so this is curated as emerging rather than
          settled - see the crb1_isoform_b_severity_conflict discussion.'
      selected_evidence:
        snippet: Mutations specific to CRB1-A, sparing CRB1-B were associated with MD.
        supports: SUPPORT
