          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: Molecular studies in the E168d2/+ mouse retinas reveal an allelic-speciﬁc overexpression
          of the mutant transcripts and accumulation of the non-functional, truncated proteins, resulting
          in a signiﬁcantly elevated mutant-to-WT ratio (Figure 3D).
        supports: SUPPORT
