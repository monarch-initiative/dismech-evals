            preferred_term: CRX-related retinopathy
            term:
              id: MONDO:1040064
              label: CRX-related retinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: C-Terminal Truncation and Dominant-Negative Overexpression
        description: 'Frameshift and nonsense variants concentrated in the CRX C-terminal transcription-effector
          domain produce truncated proteins that retain intact DNA-binding activity but are defective
          in gene activation. Because the entire effector domain is encoded in the last exon of CRX, the
          truncating transcripts are proposed to escape nonsense-mediated decay, although competing models
          suggest that the long 3''-UTRs created by premature termination codons can instead trigger NMD,
          and the mRNA-level mechanism remains an open question. What is demonstrated, in the E168d2/+
          knock-in mouse, is an allele-specific overexpression of the mutant transcripts with accumulation
          of the non-functional truncated protein to a significantly elevated mutant-to-wild-type ratio,
          so that truncated CRX outcompetes wild-type CRX for binding at cognate regulatory sequences,
          producing a dominant-negative block of photoreceptor gene activation.

          '
        biological_processes:
        - preferred_term: Regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: The impaired photoreceptor diﬀerentiation in the E168d2/+ retinas can thus be explained
          by a dominant-negative mechanism where the signiﬁcantly higher concentrations of the mutant
          proteins outcompete WT proteins in binding to CRX cognate sites and interfere with downstream
          gene regulations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
