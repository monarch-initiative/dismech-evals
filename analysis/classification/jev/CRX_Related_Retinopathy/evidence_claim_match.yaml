        description: 'A distinct class of homeodomain missense variants (e.g., p.Glu80Ala, p.Lys88Asn)
          alters CRX''s DNA-binding sequence specificity rather than simply reducing affinity, causing
          the mutant protein to bind non-cognate sites and either drive ectopic/precocious gene activation
          or antagonize wild-type CRX function at its normal target genes. These antimorphic/gain-of-function
          variants produce more severe dominant phenotypes than simple affinity-reducing hypomorphic variants.

          '
        cell_types:
        - preferred_term: Retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: Retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
      selected_evidence:
        snippet: Biochemical evidence suggests that the E > A substitution, which changes a negatively
          charged residue to a small hydrophobic residue, likely results in a gain of entropy such that
          the mutant CRX E80A protein binds more promiscuously to non-consensus/sub-optimal CRX motifs
          and drives a higher level of gene expression (Figure 3C; Wilson et al., 1995; Chaney et al.,
          2005).
        supports: SUPPORT
