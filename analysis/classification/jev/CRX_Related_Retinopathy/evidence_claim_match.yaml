        description: 'A second, distinct class of C-terminal frameshift variants produces an elongated
          mutant CRX protein retaining a partial transcription effector domain with a non-homologous C-terminal
          extension, rather than a truncated one. Unlike truncating variants, these elongating variants
          are not overexpressed and do not act through simple dominant-negative competition; instead,
          loss of the OTX tail domain and altered amino-acid composition and residue patterning of the
          extended effector domain disrupt the selective recruitment of transcriptional co-factors, mediators,
          and histone-binding complexes -- including self-recruitment of wild-type CRX and OTX2 -- perturbing
          photoreceptor gene regulation during development.

          '
        biological_processes:
