        association: Pathogenic Mutations
        presence: Positive
        notes: 'Heterozygous de novo loss-of-function mutations (frameshift, nonsense, splice site) and
          missense variants (predominantly in zinc finger domains) cause this disorder. CTCF encodes an
          11-zinc finger transcription factor essential for chromatin organization. Approximately 80%-85%
          of informative cases are de novo, with rare familial cases showing variable expressivity. Recurrent
          variants include p.Arg339Gln, p.Arg368Cys, and p.Arg567Trp.

          '
