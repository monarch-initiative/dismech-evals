            term:
              id: MONDO:0014213
              label: CTCF-related neurodevelopmental disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Chromatin Architecture Disruption
        description: 'Reduced CTCF function leads to aberrant chromatin looping and disrupted TAD boundaries,
          causing inappropriate enhancer-promoter interactions. CTCF normally mediates formation of chromatin
          loops that define TADs, and its depletion causes blurred domain boundaries and altered three-dimensional
          genome structure. The R567W mutation specifically affects CTCF binding to peripheral motifs,
          causing local chromatin structure alterations particularly at the clustered protocadherin locus.

          '
        biological_processes:
        - preferred_term: chromosome organization
          term:
            id: GO:0051276
            label: chromosome organization
        - preferred_term: regulation of chromatin organization
          term:
            id: GO:1902275
            label: regulation of chromatin organization
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: it specifically hinders CTCF binding to peripheral motifs upstream to the core consensus
          site, causing alterations in local chromatin structure and gene expression, particularly at
          the clustered protocadherin locus
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38951485
      reference_title: CTCF mutation at R567 causes developmental disorders via 3D genome rearrangement
        and abnormal neurodevelopment.
      explanation: The R567W mutation causes specific chromatin structure alterations and dysregulation
