      assertion_type: Pathophysiology
      assertion:
        name: Abnormal Neural Progenitor Cell Development
        description: 'CTCF mutations induce premature depletion of stem-like neural progenitor cells and
          accelerate maturation of GABAergic neurons within the developing cortex. The R567W mutation
          causes reduced proportions of neural progenitors and radial glial cells, with increased postmitotic
          neuroblasts and inhibitory GABAergic neurons, disrupting the balanced development of excitatory
          and inhibitory neural circuits.

          '
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: cerebral cortex GABAergic interneuron
          term:
            id: CL:0010011
            label: cerebral cortex GABAergic interneuron
        locations:
        - preferred_term: cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: This mutation induces premature stem-like cell exhaustion, accelerates the maturation
          of GABAergic neurons, and disrupts neurodevelopmental and synaptic pathways.
        supports: SUPPORT
