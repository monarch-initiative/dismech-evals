            preferred_term: CTCF-related neurodevelopmental disorder
            term:
              id: MONDO:0014213
              label: CTCF-related neurodevelopmental disorder
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CTCF Haploinsufficiency
        description: 'Heterozygous loss-of-function mutations in CTCF lead to reduced functional CTCF
          protein levels, disrupting its role as a master regulator of chromatin architecture. CTCF is
          essential for establishing insulator elements that define topologically associating domain (TAD)
          boundaries. Both frameshift and missense variants (affecting zinc finger domains) result in
          functional haploinsufficiency through nonsense-mediated decay or impaired DNA binding.

          '
        cell_types:
        - preferred_term: neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
        - preferred_term: regulation of gene expression
          term:
            id: GO:0010468
            label: regulation of gene expression
        locations:
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Our findings indicate that haploinsufficiency of CTCF affects genomic interaction of
          enhancers and their regulated gene promoters that drive developmental processes and cognition.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23746550
      reference_title: De novo mutations in the genome organizer CTCF cause intellectual disability.
      explanation: Original discovery paper establishing that CTCF haploinsufficiency disrupts enhancer-promoter
        interactions critical for development and cognition.
