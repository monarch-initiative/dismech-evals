  aeafc9ca330382b9cd9a42076f18afe29fceee604bc172b68696eb6d4461619c:
    claim:
      about:
        disease:
          name: CTLA4 Haploinsufficiency
          disease_term:
            preferred_term: CTLA4 haploinsufficiency
            term:
              id: MONDO:0014493
              label: autoimmune lymphoproliferative syndrome due to CTLA4 haploinsufficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: CTLA4
        gene_term:
          preferred_term: CTLA4
          term:
            id: hgnc:2505
            label: CTLA4
        association: CAUSATIVE
        features: Heterozygous germline loss-of-function variants cause disease. Truncating and splice
          variants can reduce membrane CTLA4 abundance, whereas missense variants can impair dimerization
          or ligand capture. Variant location does not reliably predict clinical severity or penetrance.
          Large 2q33 deletions can include neighboring CD28 and ICOS and require separate interpretation.
        inheritance:
        - name: Autosomal Dominant
        variants:
        - name: p.Arg51Ter
          description: A nonsense allele associated with degradation of its transcript.
        - name: p.Cys35Ter
          description: An early truncating allele with no detectable protein in transfected CHO cells.
        - name: p.Arg70Trp
          description: An extracellular-domain missense allele with preserved expressed protein but reduced
            ligand uptake.
        - name: p.Thr124Pro
          description: An extracellular-domain missense allele with impaired soluble CD80 uptake; protein
            notation is retained because nucleotide coordinates differ between cited reports.
        - name: p.Pro137Arg
          description: A ligand-binding-motif allele that can retain near-normal antibody staining despite
            defective ligand uptake.
        - name: p.Tyr139Cys
          description: A de novo MYPPPY-motif variant reported in a child with autoimmune hepatitis and
            polyarthritis.
        - name: NM_005214.5:c.167T>G (p.Phe56Cys)
          description: An inherited allele with incomplete penetrance. HEK293T assays show reduced dimerization,
            surface expression and CD80/CD86 binding despite preserved total protein.
        - name: c.457+2T>C
          description: An inherited splice-site variant in a patient with refractory celiac-like enteropathy
            and reduced CTLA4 expression in memory Tregs.
        - name: c.71_72del (p.Leu24ProfsTer35)
          description: A de novo early frameshift in a second refractory celiac-like enteropathy case,
            with absent detectable CTLA4 in memory Tregs.
        - name: p.Phe179CysfsTer29
          description: A frameshift allele for which Treg CTLA4 expression was comparable to controls
            but CD80 uptake was impaired.
      selected_evidence:
        snippet: 'This variant lay within the highly conserved MYPPPY motif of CTLA-4: a critical structural
          determinant of ligand binding, which is also bound by the anti-CTLA-4 monoclonal antibody ipilimumab.'
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31396201
      reference_title: Preponderance of CTLA4 Variation Associated With Autosomal Dominant Immune Dysregulation
        in the MYPPPY Motif.
      evidence_source: HUMAN_CLINICAL
      explanation: The case identifies a variant in the conserved ligand-binding motif; direct functional
        assays of this patient’s allele were not performed in this report.
