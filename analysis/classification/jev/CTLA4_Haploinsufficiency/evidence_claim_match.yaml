        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CTLA-4 Checkpoint Failure in Regulatory T Cells
        description: CTLA-4 is a core inhibitory checkpoint used by regulatory T cells to restrain CD28-mediated
          activation of conventional T cells. Heterozygous CTLA4 mutations lower CTLA-4 abundance or disrupt
          ligand binding, impairing Treg suppressive function and CD80 transendocytosis. This creates
          a primary defect in peripheral tolerance that propagates downstream immune dysregulation.
        gene:
          preferred_term: CTLA4
          modifier: DECREASED
          term:
            id: hgnc:2505
            label: CTLA4
        cell_types:
        - preferred_term: regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
        biological_processes:
        - preferred_term: negative regulation of T cell activation
          term:
            id: GO:0050868
            label: negative regulation of T cell activation
          modifier: DECREASED
      selected_evidence:
        snippet: human CTLA4 haploinsufficiency caused dysregulation of FoxP3(+) regulatory T (Treg) cells,
          hyperactivation of effector T cells, and lymphocytic infiltration of target organs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
