            term:
              id: MONDO:0014493
              label: autoimmune lymphoproliferative syndrome due to CTLA4 haploinsufficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Abatacept
        description: CTLA4-Ig binds CD80/CD86 and limits CD28-dependent costimulation. Retrospective cohorts
          and small case series report benefit, especially for enteropathy and lymphoproliferation. The
          2026 ABACHAI single-arm trial enrolled 18 adults with CTLA4 insufficiency and two with LRBA
          deficiency; pooled results showed improvement in lymphoproliferation and immune activation,
          but insufficient control of cytopenias and renal involvement. Responses are organ dependent
          and the trial did not provide a randomized comparator.
        action_category: THERAPEUTIC
        treatment_term:
          preferred_term: Immunosuppressive Therapy
          term:
            id: NCIT:C15261
            label: Immunosuppressive Therapy
          therapeutic_agent:
          - preferred_term: Abatacept
            term:
              id: NCIT:C28898
              label: Abatacept
        therapeutic_modality: PROTEIN_REPLACEMENT
        notes: The trial reported five severe infections in three participants, with no EBV or CMV reactivation
          during the study. This does not eliminate infection risk or negate reactivation reported in
          earlier immunosuppressed cohorts.
      selected_evidence:
        snippet: Twenty patients were enrolled (18 with CTLA-4 insufficiency and 2 with LRBA deficiency).
        supports: SUPPORT
