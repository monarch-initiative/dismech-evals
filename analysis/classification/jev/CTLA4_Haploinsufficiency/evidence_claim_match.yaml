            id: GO:0050868
            label: negative regulation of T cell activation
          modifier: DECREASED
      selected_evidence:
        snippet: human CTLA4 haploinsufficiency caused dysregulation of FoxP3(+) regulatory T (Treg) cells,
          hyperactivation of effector T cells, and lymphocytic infiltration of target organs.
        supports: SUPPORT
