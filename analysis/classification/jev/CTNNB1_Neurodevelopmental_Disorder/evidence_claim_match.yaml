        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Canonical Wnt/Beta-Catenin Transcriptional Deficit
        biological_scale: MOLECULAR
        description: 'Beta-catenin is the obligate transcriptional co-activator of the canonical Wnt pathway:
          on Wnt/Norrin receptor engagement it escapes destruction-complex phosphorylation, accumulates,
          and enters the nucleus to partner TCF/LEF transcription factors. Reduced beta-catenin dosage
          lowers Wnt-responsive reporter output (TOPFlash/SuperTopFlash) and target-gene transcription
          in patient-derived and transfected systems. A subset of missense variants further suppresses
          signalling in a dominant-negative fashion, and one gain-of-function missense allele has been
          described as an outlier.'
        biological_processes:
        - preferred_term: canonical Wnt signaling pathway
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
          modifier: DECREASED
        - preferred_term: regulation of canonical Wnt signaling pathway
          term:
            id: GO:0060828
            label: regulation of canonical Wnt signaling pathway
      selected_evidence:
        snippet: Beta-catenin is a key downstream component of the canonical Wnt signaling pathway.
        supports: SUPPORT
