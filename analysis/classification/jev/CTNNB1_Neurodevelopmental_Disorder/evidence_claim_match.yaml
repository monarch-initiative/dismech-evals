      assertion:
        name: CTNNB1
        gene_term:
          preferred_term: CTNNB1
          term:
            id: hgnc:2514
            label: CTNNB1
        association: Causal - heterozygous germline loss-of-function variants
        relationship_type: CAUSATIVE
        variant_origin: DE_NOVO
        presence: Positive
        notes: Heterozygous, usually de novo, loss-of-function variants in CTNNB1 (3p22.1) cause CTNNB1-NDD.
          The spectrum includes nonsense, frameshift and splice-site variants, whole-gene deletions, and
          a minority of missense variants, some of which act as dominant negatives while one has been
          reported as gain-of-function. Missense variants and variants in the C-terminal region (exons
          13-15) are associated with a milder phenotype, including earlier independent walking and better
          communication. This is the mechanistic opposite of the SOMATIC exon-3 stabilising CTNNB1 variants
          that drive Wnt-activated tumours.
      selected_evidence:
        snippet: Germline loss-of-function variants in CTNNB1 cause neurodevelopmental disorder with spastic
          diplegia and visual defects (NEDSDV; OMIM 615075)
        supports: SUPPORT
