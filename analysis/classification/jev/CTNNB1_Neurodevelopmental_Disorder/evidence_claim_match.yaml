  dd8f02d986abd7d44fc3bbe9850482f3a87529c25e5280d0f0c8b40c7651f99c:
    claim:
      about:
        disease:
          name: CTNNB1 Neurodevelopmental Disorder
          disease_term:
            preferred_term: CTNNB1 syndrome
            term:
              id: MONDO:0014035
              label: severe intellectual disability-progressive spastic diplegia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CTNNB1 Loss-of-Function and Beta-Catenin Haploinsufficiency
        biological_scale: MOLECULAR
        description: Heterozygous nonsense, frameshift, splice-site and whole-gene deletion variants in
          CTNNB1, plus a minority of missense variants, truncate or destabilise beta-catenin and reduce
          the pool of functional protein. In the largest functionally characterised cohort, 87 of 88 distinct
          variants were predicted loss of function, and a subset of missense alleles act as dominant negatives
          that suppress signalling beyond simple haploinsufficiency. Complete deletion of the single gene
          CTNNB1 is sufficient to produce the syndrome, establishing dosage sensitivity as the core lesion.
        genes:
        - preferred_term: CTNNB1
          term:
            id: hgnc:2514
            label: CTNNB1
        genetic_context:
          gene:
            preferred_term: CTNNB1
            term:
              id: hgnc:2514
              label: CTNNB1
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: De novo heterozygous truncating CTNNB1 alleles predicted to undergo nonsense-mediated
            decay. Recorded as LOSS_OF_FUNCTION (beta-catenin haploinsufficiency).
      selected_evidence:
        snippet: Array CGH karyotyping showed a 333 kb de novo microdeletion on 3p22 covering the entire
          genomic sequence of a single gene, CTNNB1, which codes for β-catenin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24668549
      reference_title: A new intellectual disability syndrome caused by CTNNB1 haploinsufficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: A whole-gene deletion of CTNNB1 alone reproduces the syndrome, establishing haploinsufficiency
        rather than a variant-specific gain of function.
