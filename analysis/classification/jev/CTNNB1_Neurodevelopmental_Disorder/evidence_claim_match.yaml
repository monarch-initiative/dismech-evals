          bilateral intracerebroventricular infusion with prophylactic methylprednisolone and sirolimus,
          now in a first-in-human phase I/II trial (NCT07270549). It is the first candidate disease-modifying
          therapy and directly addresses the beta-catenin dosage deficit. No human safety or efficacy
          results are available. Because beta-catenin is dosage-sensitive and its stabilisation is oncogenic
