      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant, typically de novo
        expressivity: VARIABLE
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: CTNNB1-NDD is autosomal dominant and in the great majority of cases results from
          a de novo heterozygous loss-of-function variant. Inheritance from a mildly affected or apparently
          asymptomatic parent has been documented, so parental testing is indicated before counselling
          recurrence risk as negligible; germline mosaicism is an additional consideration. Penetrance
          for unambiguous loss-of-function variants appears high, while expressivity is markedly variable,
          ranging from a near-normal neurodevelopmental outcome with isolated eye disease to profound
          impairment.
      selected_evidence:
        snippet: Among the eight families with CTNNB1 mutations, seven were de novo mutations, and one
          proband inherited the mutation from his asymptomatic mother.
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
