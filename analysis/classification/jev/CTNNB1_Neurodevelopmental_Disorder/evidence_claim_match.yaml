  e3c8ec6e9f339e7b06c6b84662d20cf8bc435d47d5031d815b88e58be707223e:
    claim:
      about:
        disease:
          name: CTNNB1 Neurodevelopmental Disorder
          disease_term:
            preferred_term: CTNNB1 syndrome
            term:
              id: MONDO:0014035
              label: severe intellectual disability-progressive spastic diplegia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinal Vascular Norrin/Beta-Catenin Signalling Failure
        biological_scale: TISSUE
        description: Retinal vascular development and blood-retina barrier maturation depend on Norrin
          (NDP) signalling through FZD4/LRP5/TSPAN12 to beta-catenin in retinal microvascular endothelium.
          Truncating CTNNB1 variants reduce Norrin/beta-catenin signalling activity, and CTNNB1 knockdown
          in primary human retinal microvascular endothelial cells lowers Norrin target-gene transcription,
          reduces endothelial proliferation and compromises junctional integrity; endothelial-specific
