          cardiac phenotyping series found congenital heart anomalies (absent pulmonary valve with intact
          ventricular septum, atrioventricular canal with hypoplastic aortic arch, tetralogy of Fallot,
          mitral valve prolapse) at a higher rate than previously appreciated. This node is supported
