        prompt: Why does dopamine not accumulate despite impaired noradrenaline synthesis?
        attaches_to:
        - pathophysiology#Intravesicular Ascorbate Depletion
        - pathophysiology#Noradrenaline and Adrenaline Deficiency
        rationale: The 2020 authors propose that reduced vesicular antioxidant capacity permits DOPA and
          dopamine degradation. This explanation remains speculative and has not been demonstrated in
          patient vesicles.
