        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cyb561_expression_versus_phenotype
        kind: KNOWLEDGE_GAP
        prompt: How do broad CYB561 expression and shared vesicular ascorbate requirements relate to the
          observed clinical spectrum?
        attaches_to:
        - pathophysiology#Selective Sympathetic Noradrenergic Failure
        - genetic#CYB561
        rationale: Broad CYB561 expression and low CSF noradrenaline metabolites coexist with relatively
          preserved development in the reported families. Peptidylglycine alpha-amidating monooxygenase
          shares the intravesicular ascorbate requirement, yet a specific neuropeptide-amidation phenotype
          has not been demonstrated. Compensation by other proteins, different substrate requirements
          and incomplete clinical assessment remain possible explanations. Measuring amidated peptides
          and vesicular ascorbate would distinguish biochemical sparing from an unrecognized deficit.
          The 2020 authors argue that oral or parenteral ascorbate cannot directly replenish the vesicular
          compartment. This is a mechanistic argument, not a reported supplementation trial.
      selected_evidence:
        snippet: Restoration of ascorbic acid with oral or parenteral administration is not feasible because
          ascorbic acid is not taken up by catecholaminergic vesicles.
        supports: SUPPORT
