        context:
        - path: /biochemical/2
          value:
            name: CSF 3-methoxy-4-hydroxyphenylglycol
            presence: Decreased
            context: 'Extremely low against a reference of 26 to 64 nmol/L, while CSF homovanillic acid
              and 5-hydroxyindoleacetic acid were normal. This is the entry''s only direct evidence about
              the brain, and it is a three-part result rather than one: central noradrenaline is depleted,
              while the dopamine and serotonin pathways that share much of the same machinery are intact.
              The preserved dopamine metabolite is also the central counterpart of the preserved plasma
              dopamine that separates this disease from dopamine beta-hydroxylase deficiency. This one
              is left unbound. CHEBI carries only the glucuronide and sulfate conjugates, and NCIT''s
              only MHPG term is NCIT:C220216, a urine measurement - while this result is in cerebrospinal
              fluid, so that term would name the wrong specimen.'
            biomarker_term:
              preferred_term: 3-methoxy-4-hydroxyphenylglycol
          role: ancestor
      assertion_type: BiomarkerReadout
      assertion:
        target: Noradrenaline and Adrenaline Deficiency
        relationship: READOUT_OF
        direction: NEGATIVE
        endpoint_context: DIAGNOSTIC
        interpretation: Confirms the noradrenaline deficit extends to the central nervous system, and
          that it is selective for noradrenaline rather than a general monoamine failure.
      selected_evidence:
        snippet: The concentration of MHPG, the principal downstream metabolite of norepinephrine in the
          brain, was extremely low in CSF (<3 nmol/L; reference 26–64). The downstream metabolites of
          dopamine and serotonin, HVA and 5-HIAA respectively, had a normal concentration in CSF
        supports: SUPPORT
