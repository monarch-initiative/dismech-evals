      assertion_type: ModelMechanismLink
      assertion:
        target: Noradrenaline and Adrenaline Deficiency
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Six knockout mice showed the catecholamine deficit in both brain and adrenal gland,
          which the authors describe as recapitulating the clinical phenotype.
        limitations: Mice, unlike humans, synthesize ascorbate de novo, so a mouse retains a source of
          the cofactor a patient does not have. For a disease defined by failure to recycle ascorbate,
          that is the strongest reason to expect the knockout to under-represent human severity, and it
          is why fidelity here is MODERATE rather than HIGH. Beyond that, the reported measurements are
          tissue catecholamine concentrations rather than haemodynamic phenotyping, so the model is shown
          to reproduce the biochemistry rather than the orthostatic hypotension itself; and the cohort
          is six animals.
        readouts:
        - name: Whole-brain noradrenaline and normetanephrine
          target: Noradrenaline and Adrenaline Deficiency
          direction: DECREASED
          interpretation: Central catecholamine deficit matching the human biochemical profile.
      selected_evidence:
        snippet: An important consideration when using mice in ascorbic acid studies is that mice, unlike
          humans, can produce ascorbic acid de novo.
        supports: SUPPORT
