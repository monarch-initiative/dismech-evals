          findings support loss of function. The precise effects of the patient alleles on protein abundance,
          membrane localization and electron transfer remain inferred; structural modeling of Gly88Arg
          and conservation of His53Tyr do not substitute for functional assays.
        genes:
        - preferred_term: CYB561
          term:
            id: hgnc:2571
            label: CYB561
      selected_evidence:
        snippet: Homozygosity mapping and exome and Sanger sequencing revealed pathogenic homozygous mutations
          in the gene encoding cytochrome b561 (CYB561); a missense variant c.262G>A, p.Gly88Arg in exon
          3 in the Dutch family and a nonsense mutation (c.131G>A, p.Trp44*) in exon 2 in the American
          family.
        supports: SUPPORT
