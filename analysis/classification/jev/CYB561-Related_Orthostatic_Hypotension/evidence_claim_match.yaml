        name: Biallelic CYB561 Loss of Function
        biological_scale: MOLECULAR
        description: Homozygous or compound heterozygous CYB561 variants. Reported alleles include a missense
          change, a nonsense change and a whole-exon deletion, across two families and one further compound
          heterozygote.
      selected_evidence:
        snippet: Homozygosity mapping and exome and Sanger sequencing revealed pathogenic homozygous mutations
          in the gene encoding cytochrome b561 (CYB561); a missense variant c.262G>A, p.Gly88Arg in exon
          3 in the Dutch family and a nonsense mutation (c.131G>A, p.Trp44*) in exon 2 in the American
          family.
        supports: SUPPORT
