              label: orthostatic hypotension 2
        context:
        - path: /biochemical/1
          value:
            name: Plasma dihydroxyphenylglycol
            presence: Decreased
            context: Below the limit of detection. DHPG is the metabolite of noradrenaline formed inside
              the neuron before release, so it reports the size of the intraneuronal noradrenaline pool
              rather than what reaches the circulation. Undetectable DHPG therefore says the noradrenaline
              was never made, not that it was made and cleared - which is the distinction between a synthetic
              defect and a release or reuptake defect. CHEBI carries only the O-sulfate conjugate, which
              is a different analyte, so the binding here is the NCIT measurement term instead - the pattern
              this KB already uses for creatine kinase and lactic acid.
            biomarker_term:
              preferred_term: 3,4-dihydroxyphenylglycol
              term:
                id: NCIT:C101017
                label: 3,4-Dihydroxyphenylglycol Measurement
          role: ancestor
      assertion_type: BiomarkerReadout
      assertion:
        target: Noradrenaline and Adrenaline Deficiency
        relationship: READOUT_OF
        direction: NEGATIVE
        endpoint_context: DIAGNOSTIC
        interpretation: An undetectable intraneuronal metabolite localizes the deficit to synthesis rather
          than to handling of noradrenaline after it is made.
      selected_evidence:
        snippet: Plasma norepinephrine, epinephrine and the intraneuronal norepinephrine metabolite dihydroxyphenylglycol
          were below the limit of detection (<0.01 nmol/L)
        supports: SUPPORT
