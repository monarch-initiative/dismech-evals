            term:
              id: MONDO:0020751
              label: orthostatic hypotension 2
        context: []
      assertion_type: Treatment
      assertion:
        name: Droxidopa
        description: 'A synthetic noradrenaline precursor that is decarboxylated directly to noradrenaline
          by aromatic L-amino acid decarboxylase, so it does not require dopamine beta-hydroxylase or
          its cofactor. It therefore bypasses the entire lesion rather than correcting it.

          All four reported patients were treated, at 200 mg once to three times daily, and all four responded:
          supine blood pressure exceeded 100/70 in every case and the dizziness improved. The qualification
          is tolerability rather than efficacy - nausea, headache and lumbar pain - and that matters here
          more than it would for a symptomatic drug, because this is the only treatment that addresses
          the lesion at all. The point is made bluntly by the one fatal event in the series: D1''s prolonged
          circulatory arrest occurred while she was off droxidopa.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: droxidopa
            term:
              id: CHEBI:31524
              label: droxidopa
      selected_evidence:
        snippet: The four patients were treated with L-dihydroxyphenylserine (L-DOPS), a synthetic precursor
          of norepinephrine, with dosages ranging from 200 mg once to three times daily
        supports: SUPPORT
