        relationship_type: CAUSATIVE
        notes: Reported disease alleles include homozygous Gly88Arg and Trp44Ter, and His53Tyr in trans
          with an exon 2 deletion. Segregation supports recessive inheritance. Human missense effects
          remain predicted, and no quantitative penetrance estimate is established by these small families.
        variants:
        - name: NM_001915.3:c.262G>A (p.Gly88Arg)
          description: Homozygous in the Dutch sisters and heterozygous in unaffected parents and a sister.
            Homology modeling predicts altered membrane anchoring and possible heme-adjacent effects;
            patient protein localization and transport were not directly measured. The distinct c.262G>C
            allele encoding the same protein substitution is not the familial allele.
        - name: NM_001915.3:c.131G>A (p.Trp44Ter)
          description: Homozygous early stop variant in the American sisters, predicted to truncate the
            protein between the first two transmembrane segments. Endogenous RNA decay and residual protein
            were not measured.
        - name: c.157C>T (p.His53Tyr)
          description: Missense allele at a conserved site, found in trans with an exon 2 deletion in
            the additional male patient. Impaired function was predicted; no variant-specific functional
            measurement was reported.
        - name: Exon 2 deletion
          description: Deletion allele in trans with His53Tyr in the additional male patient, demonstrating
            that diagnostic testing must be able to detect exon-level deletions as well as sequence variants.
      selected_evidence:
        snippet: The CYB561 gene was found to be expressed in many human tissues, in particular the brain.
        supports: SUPPORT
