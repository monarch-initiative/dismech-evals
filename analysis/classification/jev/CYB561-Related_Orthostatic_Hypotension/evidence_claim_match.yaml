            term:
              id: MONDO:0020751
              label: orthostatic hypotension 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intravesicular Ascorbate Depletion
        biological_scale: MOLECULAR
        description: 'Ascorbate inside the catecholamine secretory vesicle is consumed and not replaced.
          This is the specific compartmental shortage that defines the disease.

          Two vesicular enzymes depend on that ascorbate, not one. Alongside dopamine beta-hydroxylase,
          peptidylglycine alpha-amidating monooxygenase uses it to amidate neuropeptides including alpha-MSH,
          oxytocin, vasopressin and gastrin - a modification that is required for those peptides to be
          active. So the lesion should in principle disable neuropeptide amidation as well as noradrenaline
          synthesis, and yet no neuropeptide phenotype has been reported in any of the four patients of
          the founding report. That asymmetry is curated as a knowledge gap rather than resolved: the
          possibilities include a lower ascorbate requirement for the amidating enzyme, redundancy from
          other cytochrome b561 family members in the tissues where the neuropeptides are made, or a deficit
          that exists and has never been looked for in the handful of patients described.'
      selected_evidence:
        snippet: The CYB561 protein defect leads to a shortage of ascorbate inside the catecholamine secretory
          vesicles leading to a functional dopamine β-hydroxylase deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29343526
      reference_title: Mutations in CYB561 Causing a Novel Orthostatic Hypotension Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: States the mechanism in one sentence, including the crucial word "functional" - the
        enzyme itself is intact.
