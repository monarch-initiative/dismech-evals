        - path: /animal_models/0
          value:
            name: CYB561 knockout mouse
            species: Mouse
            genotype: CYB561 -/- (reporter-tagged deletion allele, post-Cre, C57BL/6NTac)
            publication: PMID:29343526
            description: Reproduces the central biochemical lesion, with reduced noradrenaline and normetanephrine
              in brain and reduced normetanephrine and metanephrine in adrenal tissue.
          role: ancestor
        - path: /animal_models/0/modeled_mechanisms/0
          value:
            target: Noradrenaline and Adrenaline Deficiency
            relationship: RECAPITULATES
            fidelity: MODERATE
            description: Six knockout mice showed the catecholamine deficit in both brain and adrenal
              gland, which the authors describe as recapitulating the clinical phenotype.
            limitations: Mice, unlike humans, synthesize ascorbate de novo, so a mouse retains a source
              of the cofactor a patient does not have. For a disease defined by failure to recycle ascorbate,
              that is the strongest reason to expect the knockout to under-represent human severity, and
              it is why fidelity here is MODERATE rather than HIGH. Beyond that, the reported measurements
              are tissue catecholamine concentrations rather than haemodynamic phenotyping, so the model
              is shown to reproduce the biochemistry rather than the orthostatic hypotension itself; and
              the cohort is six animals.
          role: ancestor
