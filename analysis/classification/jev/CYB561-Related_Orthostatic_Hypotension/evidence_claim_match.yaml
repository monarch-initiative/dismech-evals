        biological_scale: ORGANISM
        description: Without adrenaline, the counter-regulatory response to falling glucose is lost, and
          patients experience recurrent symptomatic hypoglycaemia from infancy. In one reported patient
          it was severe enough to prompt a partial pancreatectomy at age three - which did not help, since
          the defect is in the counter-regulation rather than in insulin secretion.
