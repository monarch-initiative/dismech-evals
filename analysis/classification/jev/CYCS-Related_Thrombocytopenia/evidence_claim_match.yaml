      assertion:
        discussion_id: cycs_proplatelet_context
        kind: KNOWLEDGE_GAP
        prompt: Why is proplatelet formation preserved in one patient-derived culture study but defective
          in preliminary registry observations?
        attaches_to:
        - pathophysiology#Dysregulated Megakaryocyte Platelet Release
        rationale: The Cargeeg study found normal proplatelet formation in culture. NCT07026578 describes
          preliminary progenitor cultures with preserved megakaryocyte maturation but defective proplatelets,
          and reduced cytochrome c with resistance to induced apoptosis in patient platelets. These registry
          observations are not posted trial results or a peer-reviewed replication. Variant and culture
          differences remain unresolved.
      selected_evidence:
        snippet: Hematopoietic progenitors from 3 patients were differentiated in megakaryocytes. Maturation
          and differentiation were comparable between THC4 and healthy controls. Instead, their capability
          to form proplatelets was profoundly defective.
        supports: SUPPORT
