        description: Reported in the Italian family series. The strength and type of functional evidence
          differ among alleles.
      selected_evidence:
        snippet: 'In this study, we describe six Italian families with five different heterozygous missense
          CYCS variants: p.Gly42Ser and p.Tyr49His previously associated with THC4, and three novel variants
          (p.Ala52Thr, p.Arg92Gly, and p.Leu99Val), which have been classified as pathogenic by bioinformatics
          and segregation analyses.'
        supports: SUPPORT
