              and functional support vary among alleles; neither complete penetrance nor a single gain-
              or loss-of-function mechanism has been established across all families. Mature-protein G41S/Y48H/A51V
              in biochemical papers correspond to initiator-inclusive Gly42Ser/Tyr49His/Ala52Val. Additional
              reported substitutions include Tyr49His (mature Y48H), Ala52Val (mature A51V), Ala52Thr
              and Leu99Val.
          role: ancestor
      assertion_type: Variant
      assertion:
