      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: wrc_gain_of_function_model
        status: CANONICAL
        description: Hotspot variants destabilize the CYFIP2-WAVE1 interface, weakening sequestration
          of the VCA domain and releasing the complex to nucleate actin outside normal RAC1 control. On
          this account the disorder is a toxic gain of function at the level of actin regulation, which
          distinguishes it from the many developmental and epileptic encephalopathies that act by haploinsufficiency.
      selected_evidence:
        snippet: Our findings suggest that de novo Arg87 variants in CYFIP2 have gain-of-function effects
          on the WAVE signaling pathway
        supports: SUPPORT
