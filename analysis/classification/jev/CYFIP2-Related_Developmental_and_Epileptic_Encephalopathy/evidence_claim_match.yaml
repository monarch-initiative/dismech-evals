      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: protein_destabilization_model
        status: ALTERNATIVE
        description: 'p.Arg87Cys enhances ubiquitination and proteasomal degradation of CYFIP2, lowering
          steady-state protein levels in the brain. On this account the primary consequence is less CYFIP2,
          not a constitutively active complex. The two accounts are not trivially compatible: one says
          the complex is inappropriately switched on, the other that there is less of a required subunit.'
      selected_evidence:
        snippet: Beyond identifying a decrease in CYFIP2 protein levels in the Cyfip2+/R87C brains, we
          demonstrated that the p.Arg87Cys variant enhances ubiquitination and proteasomal degradation
          of CYFIP2
        supports: SUPPORT
