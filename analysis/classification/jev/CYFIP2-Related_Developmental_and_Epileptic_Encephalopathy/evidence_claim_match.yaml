        name: Disrupted Synaptic and Dendritic Spine Remodeling
        biological_scale: CELLULAR
        description: In neurons the WAVE complex drives actin remodeling at dendritic spines and growth
          cones, so dysregulated actin dynamics translate into abnormal synaptic architecture. The knock-in
          mouse shows age-progressive cytoarchitectural disorganization and gliosis in the hippocampus,
          and longitudinal work shows the synaptic remodeling is itself time-dependent rather than a fixed
          lesion.
