        - path: /animal_models/1
          value:
            name: Xenopus laevis cyfip2 gain-of-function tadpole
            species: Xenopus laevis
            genotype: transient ectopic expression of Arg87Cys or Tyr108Cys cyfip2 mRNA
            publication: DOI:10.1101/2022.12.07.519540
            description: A transient overexpression model rather than a knock-in, chosen because gain-of-function
              variants cannot be modelled by the knockdown and knockout techniques used for loss of function.
              It is the only in vivo demonstration that a pathogenic CYFIP2 variant alone is sufficient
              to produce epileptic brain activity, which is why it matters to the canonical hypothesis.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Drug-Resistant Epilepsy
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        limitations: 'Only one of the two variants tested produced the behavioural phenotype. Arg87Cys
          caused seizure-related darting and circling; Tyr108Cys did not alter behaviour at all, despite
          producing the same epileptic brain activity. So the model reproduces behavioural seizures for
          some pathogenic variants and not others, and a behavioural readout alone would have scored Tyr108Cys
          as unaffected. A second divergence matters specifically for anyone using this model as the pre-clinical
          drug-testing platform its authors propose: the tadpole hyperactivity was reduced by valproate,
          whereas the human phenotype curated in this entry is drug-resistant epilepsy in a patient who
          remained refractory despite valproic acid among four treatments. The model is valproate-responsive
          against a valproate-refractory human disorder, so a compound that suppresses activity here has
          not thereby been shown to work in patients.'
        description: Seizure-related behaviour, variant-dependent.
        readouts:
        - name: Seizure-related swimming behaviour
          target: Drug-Resistant Epilepsy
          direction: INCREASED
          interpretation: Increased for Arg87Cys; explicitly unchanged for Tyr108Cys.
      selected_evidence:
        snippet: resulted in increased seizure-related behaviours such as rapid darting and swimming in
          circles
        supports: SUPPORT
