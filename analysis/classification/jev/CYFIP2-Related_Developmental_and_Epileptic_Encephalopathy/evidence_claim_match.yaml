              label: developmental and epileptic encephalopathy, 65
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: De Novo CYFIP2 Missense Variant at a Structural Hotspot
        biological_scale: MOLECULAR
        description: The initiating lesion. Variants cluster at two hotspots, p.Arg87 and p.Asp724. Arg87
          is buried at the interface between CYFIP2 and WAVE1 inside the assembled complex, which is why
          substituting it destabilises the interface rather than simply removing a surface contact. Variants
          scattered elsewhere in the primary sequence converge on the same interface in three dimensions.
      selected_evidence:
        snippet: Structural analysis indicated that the Arg87 residue is buried at an interface between
          CYFIP2 and WAVE1, and the Arg87 variant may disrupt hydrogen bonding, leading to structural
          instability and aberrant activation of the WAVE regulatory complex
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
