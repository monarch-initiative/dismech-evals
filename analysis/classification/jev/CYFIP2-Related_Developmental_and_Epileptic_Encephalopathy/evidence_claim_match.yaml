      assertion_type: Discussion
      assertion:
        discussion_id: gap_variant_activity_and_abundance
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Aberrant WAVE Regulatory Complex Activation
        - pathophysiology#Reduced CYFIP2 Protein Abundance
        prompt: How do altered activity and reduced abundance jointly contribute to the effects of individual
          CYFIP2 variants?
        rationale: Cellular activating missense effects, reduced R87C protein abundance and loss of WRC
          incorporation by a late truncation are distinct observations. Severe adult phenotypes in R87C
          knock-in but not heterozygous-null mice argue against simple dosage loss as a complete account.
          Human heterozygous progenitors also have transcript changes. Variant-specific rescue experiments
          are needed before selecting a strategy to increase or suppress CYFIP2.
      selected_evidence:
        snippet: The absence of this phenotype in Cyfip2+/− mice further supports the notion that the
          hotspot p.Arg87 variant likely confers a toxic gain-of-function, rather than simply destabilizing
          CYFIP2 proteins
        supports: SUPPORT
    origin:
