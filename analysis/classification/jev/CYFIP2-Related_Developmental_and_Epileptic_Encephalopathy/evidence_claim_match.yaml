  24d23f5175dbf362ff9a84b80a37308453269b58116e533d0afadf29e8bc2d99:
    claim:
      about:
        disease:
          name: CYFIP2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 65
            term:
              id: MONDO:0033374
              label: developmental and epileptic encephalopathy, 65
        context: []
      assertion_type: Genetic
      assertion:
        name: CYFIP2
        gene_term:
          preferred_term: CYFIP2
          term:
            id: hgnc:13760
            label: CYFIP2
        relationship_type: CAUSATIVE
        association: Heterozygous CYFIP2 variants cause a neurodevelopmental spectrum, often through de
          novo missense changes. Arg87 substitutions tend toward severe DEE, while Asp724 and other substitutions
          are more variable. Specific late splice-altering, in-frame deletion and frameshift alleles are
          also reported.
        notes: Early truncating variants in the 2021 cohort remained of uncertain significance and had
          milder phenotypes with confounding family histories. They should not be conflated with the late
          splice variant escaping nonsense-mediated decay or the later Gln95ProfsTer15 case. CYFIP1 is
          a separate paralog; its 15q11.2 deletion phenotype is outside this entry.
        variants:
        - name: CYFIP2 p.Arg87 substitutions
          gene:
            preferred_term: CYFIP2
            term:
              id: hgnc:13760
              label: CYFIP2
          description: Recurrent de novo missense hotspot, including Arg87Cys, Arg87Leu and Arg87Pro in
            the founding cohort. Arg87Cys has the most extensively studied cellular and animal models.
        - name: CYFIP2 p.Asp724 substitutions
          gene:
            preferred_term: CYFIP2
            term:
              id: hgnc:13760
              label: CYFIP2
          description: A second recurrent site with variable severity, including individuals without epilepsy.
        - name: CYFIP2 p.Trp86_Ser88del
          gene:
            preferred_term: CYFIP2
            term:
              id: hgnc:13760
              label: CYFIP2
          description: De novo in-frame deletion removing codon87, reclassified as likely pathogenic in
            the reported infant. Phenotypic similarity does not demonstrate the same molecular consequence
            as an Arg87 substitution.
        - name: CYFIP2 c.3669+1G>T / p.Glu1174Aspfs*3
          gene:
            preferred_term: CYFIP2
            term:
              id: hgnc:13760
              label: CYFIP2
          description: Late splice-altering variant with exon skipping and predicted C-terminal truncation
            escaping nonsense-mediated decay; associated with profound ID and epilepsy. Functional work
            used a homologous CYFIP1 truncation.
        - name: CYFIP2 p.Val551Leu
          gene:
            preferred_term: CYFIP2
            term:
              id: hgnc:13760
              label: CYFIP2
          description: c.1651G>C, reported as likely pathogenic in a child with bilateral perisylvian
            polymicrogyria; absent from the maternal sample, with paternal sample unavailable.
        - name: CYFIP2 p.Gln95ProfsTer15
          gene:
            preferred_term: CYFIP2
            term:
              id: hgnc:13760
              label: CYFIP2
          description: c.281_282insA, associated with DEE, refractory seizures and dyskinetic crises.
            Patient-derived fibroblasts showed actin and motility abnormalities; inheritance and protein
            fate are not established by the available abstract.
      selected_evidence:
        snippet: We report a novel CYFIP2 frameshift variant (c.281_282insA/p.(Gln95ProfsTer15)) causing
          dyskinetic crises
        supports: SUPPORT
    origin:
