    claim:
      about:
        disease:
          name: CYFIP2-Related Developmental and Epileptic Encephalopathy
          disease_term:
            preferred_term: developmental and epileptic encephalopathy, 65
            term:
              id: MONDO:0033374
              label: developmental and epileptic encephalopathy, 65
        context: []
      assertion_type: Genetic
      assertion:
        name: CYFIP2
        gene_term:
          preferred_term: CYFIP2
          term:
            id: hgnc:13760
            label: CYFIP2
        relationship_type: CAUSATIVE
        association: 'Heterozygous de novo missense variants in CYFIP2 cause DEE65. Variants cluster at
          two hotspots, p.Arg87 and p.Asp724, and the hotspot identity predicts severity: Arg87 substitutions
          give a consistently severe phenotype while Asp724 and other substitutions give a more variable
          one.'
        notes: An in-frame deletion that removes codon 87 entirely, c.258_266del p.(Trp86_Ser88del), has
          been reported and produces the severe Arg87-hotspot phenotype - consistent with the interface
          account, since deleting the residue and substituting it have the same structural consequence.
          Rare truncating variants are reported with a milder phenotype and are of less certain significance;
          whether they act by haploinsufficiency is not settled, and this entry does not model them as
          a separate mechanism. The paralog CYFIP1 sits at the same cytogenetic band and lies within the
          15q11.2 microdeletion region, but causes a different disorder and is not to be conflated with
          CYFIP2.
      selected_evidence:
        snippet: Genotype-phenotype correlation confirms a consistently severe phenotype in p.Arg87 patients
          but a more variable phenotype in p.Asp724 and other substitutions
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
