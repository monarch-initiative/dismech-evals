          term:
            id: CL:0000679
            label: glutamatergic neuron
      selected_evidence:
        snippet: Age-progressive cytoarchitectural disorganization and gliosis were also identified in
          the hippocampus of Cyfip2+/R87C mice
        supports: SUPPORT
