          case_fraction_percent: 88
          cohort_size: 49
          notes: Germline CYLD variant detected by direct sequencing in 43 of 49 patients with classical
            BSS.
        - population: Multiple familial trichoepithelioma phenotype cohort
          case_fraction_percent: 44
          cohort_size: 18
          notes: Germline CYLD variant detected in 8 of 18 patients with the MFT phenotype.
