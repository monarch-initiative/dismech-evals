          and tumors accumulate through adulthood. In two large families the mean age at onset was 16
          years (range 8-30), 23% of surveyed patients had undergone total scalp removal, and tumors were
          on the scalp in 81%, the trunk in 69% and the pubic area in 42%. GeneReviews states that females
          often have more tumors than males; the same family study found roughly equal numbers of affected
          men and women but 5 of the 6 total scalp removals were in women.
