    claim:
      about:
        disease:
          name: CYLD Cutaneous Syndrome
          disease_term:
            preferred_term: Brooke-Spiegler syndrome
            term:
              id: MONDO:0011512
              label: Brooke-Spiegler syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Germline CYLD First-Hit Inactivation
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        description: A heterozygous CYLD loss-of-function variant is present constitutionally. Most germline
          alleles are frameshift or nonsense variants predicted to truncate the protein; missense and
          splice-site variants, large deletions and inversions account for a minority. Disease-associated
          truncations reduce the deubiquitinating activity of the encoded enzyme.
        role: trigger
        biological_scale: MOLECULAR
        genes:
        - preferred_term: CYLD
          term:
            id: hgnc:2584
            label: CYLD
        genetic_context:
          gene:
            preferred_term: CYLD
            term:
              id: hgnc:2584
              label: CYLD
          variant_origin: GERMLINE
          allelic_hit_role: FIRST_HIT
          allelic_events:
          - FRAMESHIFT_VARIANT
          - NONSENSE_VARIANT
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Constitutional heterozygous CYLD loss of function, predominantly protein-truncating.
        molecular_functions:
        - preferred_term: K63-linked deubiquitinase activity
          term:
            id: GO:0061578
            label: K63-linked deubiquitinase activity
          modifier: DECREASED
      selected_evidence:
        snippet: Here we have identified CYLD by detecting germline mutations in 21 cylindromatosis families
          and somatic mutations in 1 sporadic and 5 familial cylindromas. All mutations predict truncation
