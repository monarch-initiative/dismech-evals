        description: Each tumor inactivates the retained wild-type CYLD allele. Loss of heterozygosity
          of 16q is the commonest route (about two thirds of tumors with a detected second hit), and intragenic
          somatic mutation accounts for the rest; apart from 16q LOH, CYLD-mutant tumors carry few copy-number
          changes. The tumors are of hair-follicle lineage. Tumor mapping in two large families found
          tumors concentrated at sites of hormonally stimulated hair follicles, which the authors interpret
          as those follicles being particularly vulnerable to loss of heterozygosity; that is an inference
          from tumor distribution, not a measured mutation rate.
        role: amplifier
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: CYLD
            term:
              id: hgnc:2584
              label: CYLD
          variant_origin: SOMATIC
          allelic_hit_role: SECOND_HIT
          allelic_events:
          - LOSS_OF_HETEROZYGOSITY
          - PATHOGENIC_VARIANT
          functional_impact_category: LOSS_OF_FUNCTION
          description: Acquired inactivation of the wild-type CYLD allele in tumor tissue, mostly by 16q
            loss of heterozygosity and less often by an intragenic somatic mutation.
        cell_types:
        - preferred_term: hair follicle keratinocyte
          term:
            id: CL:2000092
            label: hair follicular keratinocyte
      selected_evidence:
        snippet: Somatic mutations were detected in 67 specimens of these 76 tumors (88%). Of the 67 somatic
          mutations, 21 (31%) represented a sequence alteration and 46 (69%) showed loss of heterozygosity.
