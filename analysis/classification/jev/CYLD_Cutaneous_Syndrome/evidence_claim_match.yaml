          carcinoma" returned no terms; "adnexal carcinoma" returned only HP:0031548 Follicular infundibulum
          tumor; and "skin carcinoma" returned squamous cell, basal cell, Merkel cell and sebaceous gland
          carcinoma terms among unrelated hits, none of which names these tumors. The binding is HP:0012842
          Skin appendage neoplasm, which HPO defines as "A benign or malignant neoplasm that arises from
          the hair follicles, sebaceous glands, or sweat glands" and which sits under HP:0008069 Neoplasm
          of the skin. It is the same term as the benign tumor phenotype, so the malignant state is carried
