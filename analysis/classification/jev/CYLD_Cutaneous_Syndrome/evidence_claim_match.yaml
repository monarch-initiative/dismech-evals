        name: NF-kappaB Pathway Derepression
        description: CYLD binds NEMO and TRAF2 and removes their activating non-K48 polyubiquitin, so
          its loss augments TNF-receptor-family (CD40, EDAR, XEDAR) activation of canonical NF-kappaB
          and increases resistance to apoptosis. In keratinocytes, CYLD also deubiquitinates Bcl-3 and
          keeps it out of the nucleus; Cyld-null keratinocytes accumulate nuclear Bcl-3 with p50 and p52,
          raise cyclin D1 and proliferate. EDAR and XEDAR are ectodysplasin receptors, which is one proposed
          reason the phenotype is restricted to skin appendages.
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: canonical NF-kappaB signal transduction
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
          modifier: INCREASED
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: DECREASED
      selected_evidence:
        snippet: In Cyld+/+ keratinocytes, TPA or UV light triggers the translocation of Cyld from the
          cytoplasm to the perinuclear region, where Cyld binds and deubiquitinates Bcl-3, thereby preventing
          nuclear accumulation of Bcl-3 and p50/Bcl-3- or p52/Bcl-3-dependent proliferation.
        supports: SUPPORT
