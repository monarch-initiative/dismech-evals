          or extracutaneous lesions. Germline variant detection rates are higher in classical Brooke-Spiegler
          syndrome than in the multiple familial trichoepithelioma presentation. ClinGen also rates CYLD
          for frontotemporal dementia and/or amyotrophic lateral sclerosis 8 (Limited), a separate gene-disease
          pair not curated here.
