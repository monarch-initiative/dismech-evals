      assertion:
        name: Clonal Expansion of CYLD-Null Adnexal Tumor Cells
        conforms_to: germline_two_hit_tumor_predisposition#Clonal Expansion and Tumor Initiation
        description: CYLD-null clones expand into benign adnexal tumors with follicular (trichoepithelioma)
          or sweat-gland-like (cylindroma, spiradenoma) differentiation, often several histologies in
          one patient and hybrid spiradenocylindromas in one lesion. Many arise independently, so tumor
          number rises with age. Benign tumors frequently carry further clonal mutations in the epigenetic
          modifiers DNMT3A and BCOR (29% of benign tumors in one series), with marked intra-tumor heterogeneity;
          the contribution of those mutations to growth or transformation is not established.
        role: consequence
        biological_scale: TISSUE
      selected_evidence:
        snippet: Here, we comprehensively profile the genomic landscape of 42 benign and malignant tumors
          across 13 individuals from four multigenerational families and discover recurrent mutations
          in epigenetic modifiers DNMT3A and BCOR in 29% of benign tumors.
        supports: SUPPORT
