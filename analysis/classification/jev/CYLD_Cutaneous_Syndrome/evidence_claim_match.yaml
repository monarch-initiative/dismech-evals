        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired DNA Damage-Induced p53 Stabilization
        description: CYLD binds and deubiquitinates p53, and is needed for p53 stabilization and activation
          after DNA damage. Ubiquitin chain-restriction analysis suggests CYLD removes K48 chains from
          p53 indirectly by cleaving K63 linkages in mixed chains. Loss of CYLD catalytic activity impairs
          this response in epithelial cells and sensitizes mice to chemical carcinogen-induced skin and
          intestinal tumors, and CYLD deficiency reduces CEP-1/p53-dependent germ cell apoptosis in C.
          elegans. This arm rests on model-system and biochemical evidence only; p53 stabilization has
          not been reported in tumors from CYLD cutaneous syndrome patients in the sources cited here,
          so its contribution to the human tumors is a hypothesis.
        role: central_effector
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: DNA damage-induced p53 signalling
          term:
            id: GO:0030330
            label: DNA damage response, signal transduction by p53 class mediator
          modifier: DECREASED
      selected_evidence:
        snippet: Mechanistically, CYLD interacts with and deubiquitinates p53 facilitating its stabilization
          in response to genotoxic stress.
        supports: SUPPORT
    origin:
