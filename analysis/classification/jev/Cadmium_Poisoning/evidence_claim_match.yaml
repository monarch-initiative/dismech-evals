      assertion_type: Pathophysiology
      assertion:
        name: Cadmium Absorption and Systemic Distribution
        description: Cadmium enters the body via inhalation of fumes/dust or gastrointestinal absorption
          from contaminated food and water. Inhaled cadmium is absorbed considerably more efficiently
          than ingested cadmium, and gastrointestinal uptake is enhanced by iron deficiency via the shared
          divalent metal transporter 1 (DMT1). Once absorbed, cadmium distributes via the bloodstream
          bound to albumin and accumulates in liver, kidney, and bone with a biological half-life of 10-30
          years.
        biological_processes:
        - preferred_term: cellular response to cadmium ion
          term:
            id: GO:0071276
            label: cellular response to cadmium ion
      selected_evidence:
        snippet: In both cases, multiple organ damage was observed, involving brain, lung, liver, kidney,
          red blood cells, and platelets
        supports: SUPPORT
