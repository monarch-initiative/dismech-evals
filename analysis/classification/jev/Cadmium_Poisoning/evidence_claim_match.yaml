        association: ZIP8, a zinc/bicarbonate symporter expressed in the S3 segment of the renal proximal
          tubule, is one of the apical transporters through which cadmium enters tubular cells. It is
          a toxicokinetic determinant of how much filtered cadmium is reabsorbed rather than excreted,
          not a cause of the disease.
        notes: Cadmium poisoning is an acquired toxic disorder with no causal gene, so every entry in
          this section is a modifier of toxicokinetics or of detoxification capacity. The common A391T
          (rs13107325) variant reduces ZIP8 transport activity; its consequence for human cadmium handling
          specifically has not been measured, so no directional susceptibility claim is curated for it
          here.
      selected_evidence:
        snippet: The knockdown of ZIP8, ZIP14 or DMT1 by siRNA transfection significantly reduced the
          uptake of Cd(2+) and Mn(2+) from the apical membrane.
