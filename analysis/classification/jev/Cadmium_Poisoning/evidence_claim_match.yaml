      assertion_type: HistopathologyFinding
      assertion:
        name: Diffuse Alveolar Damage
        description: Acute cadmium inhalation produces acute lung injury, and the lung is a confirmed
          target organ at autopsy in fatal poisoning. Diffuse alveolar damage is the expected histological
          correlate of the clinical acute respiratory distress syndrome, but the specific microscopic
          features often attributed to it here (hyaline membranes, alveolar edema, type II pneumocyte
          hyperplasia) are NOT documented in the sources curated for this entry; they are stated as the
          general ARDS pattern, not as an observed cadmium finding.
        context: Acute cadmium inhalation
        finding_term:
          preferred_term: Widespread Alveolar Pneumocyte Damage
          term:
            id: NCIT:C96237
            label: Widespread Alveolar Pneumocyte Damage Present
      selected_evidence:
        snippet: Heavy metal inhalation is a rare cause of acute lung injury. Among the various heavy
          metals, cadmium is more commonly known to cause acute lung injury.
        supports: SUPPORT
