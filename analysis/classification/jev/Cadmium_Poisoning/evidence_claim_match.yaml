      assertion_type: Pathophysiology
      assertion:
        name: Zinc-Finger Displacement and DNA Repair Inhibition
        description: Cadmium is a weak direct mutagen; its genotoxicity is largely indirect and runs through
          the zinc-finger fold. Cd(2+) substitutes for the structural Zn(II) held tetrahedrally by cysteine
          thiolates and histidine imidazoles in zinc-finger domains, and cadmium-driven oxidative stress
          independently oxidises those thiolate donors. Because several DNA-repair proteins (nucleotide-excision
          and mismatch-repair components) are zinc-finger proteins, the displacement inhibits repair without
          altering the underlying gene sequence - a loss-of-function-like lesion imposed on the proteome
          rather than encoded in the genome. This node is the mechanistic bridge from the systemic cadmium
          burden to the carcinogenic arm, and is why cadmium behaves as a co-mutagen and repair inhibitor
          rather than as a classical DNA-adduct-forming carcinogen.
        conforms_to: genome_instability_mutation#Failure of DNA Damage Surveillance and Repair
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: zinc ion binding
          modifier: ABNORMAL
          term:
            id: GO:0008270
            label: zinc ion binding
        biological_processes:
        - preferred_term: DNA repair
          modifier: DECREASED
          term:
            id: GO:0006281
            label: DNA repair
      selected_evidence:
        snippet: soluble compounds of definite carcinogenic metals and metalloids, such as arsenic, cadmium
          and nickel, and putative carcinogens, including cobalt and lead, inhibit zinc finger containing
          DNA repair proteins
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/14
      evidence_path: /pathophysiology/14/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16310985
      reference_title: Damage of zinc fingers in DNA repair proteins, a novel molecular mechanism in carcinogenesis.
      evidence_source: IN_VITRO
      explanation: Cell-culture and ex vivo work showing cadmium inhibits zinc-finger-containing DNA repair
        proteins, the molecular lesion this node models.
