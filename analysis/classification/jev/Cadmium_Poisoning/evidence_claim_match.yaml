        name: Acute
        display_name: Acute Cadmium Poisoning (Inhalation)
        description: Acute cadmium poisoning from inhalation of cadmium fumes or dust, typically occurring
          in occupational settings (welding, smelting, silver jewelry manufacturing). Presents with acute
          lung injury, chemical pneumonitis, pulmonary edema, and potentially fatal respiratory failure.
          Symptoms may be delayed 12-36 hours after exposure.
      selected_evidence:
        snippet: Heavy metal inhalation is a rare cause of acute lung injury. Among the various heavy
          metals, cadmium is more commonly known to cause acute lung injury.
        supports: SUPPORT
