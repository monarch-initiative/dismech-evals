          - classification_value: ACUTE
            notes: Recorded in parallel for the single high-dose fume exposures that produce chemical
              pneumonitis, a mechanistically distinct presentation from the chronic accumulation arm.
          iarc_carcinogen_group:
            classification_value: GROUP_1
            notes: IARC has classified cadmium and cadmium compounds as Group 1, carcinogenic to humans,
              since 1993, primarily on excess lung cancer in occupationally exposed cohorts. Recorded
              on the exposure because it is a property of the agent.
          ghs_health_hazard_class:
          - classification_value: CARCINOGENICITY
          - classification_value: STOT_REPEATED_EXPOSURE
            notes: The proximal tubular nephropathy and osteomalacia are target-organ toxicity from repeated
