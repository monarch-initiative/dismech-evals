      assertion_type: Pathophysiology
      assertion:
        name: Cadmium-Associated Carcinogenesis
        description: 'Cadmium and its compounds have been classified by IARC as carcinogenic to humans
          (Group 1) since 1993, on the strength of excess lung cancer in occupationally exposed cohorts
          together with animal tumour data. The contemporary evidence base, reviewed across biological-sample
          studies, supports a causal role at the lung, pancreas and bladder, with total cancer risk and
          mortality correlating with measured cadmium body burden. Site attribution is deliberately not
          curated uniformly: the prostate association was not confirmed on cohort update, and breast and
          prostate evidence remains weak or inconclusive. Latency is that of chemical carcinogenesis -
          years to decades - which is why this arm is a feature of chronic rather than acute cadmium poisoning.'
        biological_scale: ORGANISM
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
        - preferred_term: pancreas
          term:
            id: UBERON:0001264
            label: pancreas
        - preferred_term: urinary bladder
          term:
