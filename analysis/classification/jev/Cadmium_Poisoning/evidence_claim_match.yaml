      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other Causes of Acquired Fanconi Syndrome
        description: Acquired Fanconi syndrome can result from multiple causes beyond cadmium, including
          medications (tenofovir, ifosfamide, cisplatin, valproic acid), multiple myeloma with light chain
          deposition, and Wilson disease. The clinical presentation of proximal tubular dysfunction with
          LMW proteinuria, glucosuria, and aminoaciduria is identical regardless of cause.
        disease_term:
          preferred_term: acquired Fanconi syndrome
          term:
            id: MONDO:0060779
            label: acquired Fanconi syndrome
        distinguishing_features:
        - Medication history (tenofovir, cisplatin, ifosfamide) may explain tubular dysfunction
        - Multiple myeloma presents with monoclonal protein on serum/urine electrophoresis
        - Wilson disease shows low ceruloplasmin, elevated urine copper, and Kayser-Fleischer rings
        - Cadmium toxicity is distinguished by elevated blood/urine cadmium levels and occupational or
          environmental exposure history
      selected_evidence:
        snippet: He was finally diagnosed with chronic cadmium toxicity resulting from long-term occupational
          exposure.
        supports: SUPPORT
