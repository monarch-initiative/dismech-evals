      assertion_type: Pathophysiology
      assertion:
        name: Proposed Direct Bone-Cell Toxicity
        description: 'A direct skeletal arm of cadmium toxicity is proposed alongside the renal phosphate-wasting
          route: cadmium is held to act on bone cells themselves, reducing osteoblast function and favouring
          osteoclastic resorption. The evidence currently curated here does NOT establish that arm — the
          only human observation available is reduced bone density in an occupationally exposed patient
          who also had nephropathy, so the renal route is not excluded and the claim of independence from
          phosphate wasting is not supported. Cell-level (osteoblast culture or animal) evidence is needed
          before this node asserts a direct mechanism; see the attached knowledge gap.'
        cell_types:
        - preferred_term: osteoblast
          term:
            id: CL:0000062
            label: osteoblast
        locations:
        - preferred_term: bone
          term:
            id: UBERON:0002481
            label: bone tissue
      selected_evidence:
        snippet: We will present a case of cadmium induced peripheral neuropathy, nephropathy, and decreased
          bone density.
        supports: SUPPORT
