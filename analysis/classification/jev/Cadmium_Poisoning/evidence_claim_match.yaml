      assertion_type: Phenotype
      assertion:
        category: Oncologic
        name: Cadmium-Associated Lung Neoplasm
        description: 'Excess lung cancer incidence and mortality in populations with elevated cadmium
          body burden. This is the site on which the IARC Group 1 designation principally rests, evidenced
          most strongly in occupationally exposed cohorts. Site attribution is deliberately split across
          three entries rather than asserted as one undifferentiated malignancy phenotype, because the
          evidence is site-specific: lung, pancreas and bladder are supported while breast and prostate
          explicitly are not. Onset follows the years-to-decades latency of chemical carcinogenesis, so
          this is a manifestation of chronic rather than acute cadmium poisoning. `frequency:` is omitted
          throughout: the underlying evidence is exposure-response association across heterogeneous cohorts,
          not a per-patient manifestation rate, so no FrequencyEnum band is justified.'
        phenotype_term:
          preferred_term: Neoplasm of the lung
          term:
            id: HP:0100526
            label: Neoplasm of the lung
      selected_evidence:
        snippet: Current data consistently suggest a causal role of exposure to cadmium in pancreas, lung,
          and bladder carcinogenesis.
        supports: SUPPORT
