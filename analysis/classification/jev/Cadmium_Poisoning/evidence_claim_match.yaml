        notes: 'Conformance is to the phosphopenic and not the calciopenic arm because the lesion is a
          direct proximal tubular transport defect - the module names Fanconi syndrome among its phosphopenic
          substitutions. One caveat a curator should keep in view: the module distinguishes its two arms
          partly at the bedside on parathyroid hormone being normal in the phosphopenic arm, and that
          discriminator degrades in cadmium poisoning once tubular injury has progressed to chronic kidney
          disease, where secondary hyperparathyroidism may supervene. The conformance is asserted on the
          mechanism (tubular phosphate loss), not on the PTH profile.'
        description: Impaired proximal tubular phosphate reabsorption leads to chronic phosphaturia and
          hypophosphataemia. The sustained phosphate loss is the primary metabolic driver of cadmium-induced
          osteomalacia, as phosphate is essential for hydroxyapatite crystal formation in bone.
        locations:
        - preferred_term: proximal tubule
          term:
            id: UBERON:0004134
            label: proximal tubule
        biological_processes:
        - preferred_term: phosphate ion transport
          modifier: ABNORMAL
          term:
            id: GO:0006817
