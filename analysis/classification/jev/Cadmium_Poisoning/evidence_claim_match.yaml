        name: Hepatic Oxidative Stress
        description: 'Cadmium disrupts the hepatic redox balance: animal studies show reduced activity
          of the antioxidant enzymes SOD, GSH-Px, and CAT together with increased lipid peroxidation (elevated
          MDA). Note the evidence curated here measures antioxidant ENZYME activity rather than glutathione
          stores themselves, and one study reports cadmium triggering a hepatic antioxidant RESPONSE -
          so "depletion" is the interpretation placed on these readouts, not a directly measured finding.
          The claim that cadmium alters cytochrome P450 drug metabolism is not evidenced in this entry.'
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        locations:
        - preferred_term: liver
          term:
