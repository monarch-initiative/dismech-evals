            term:
              id: MONDO:0043523
              label: cadmium poisoning
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Lead Poisoning
        description: Lead poisoning shares features with cadmium toxicity including renal tubular dysfunction,
          peripheral neuropathy, and occupational exposure in metalworking industries. However, lead poisoning
          characteristically produces basophilic stippling of erythrocytes, a lead line on gingiva, wrist/foot
          drop, and abdominal colic, which are not features of cadmium toxicity.
        disease_term:
          preferred_term: lead poisoning
          term:
            id: MONDO:0018019
            label: lead poisoning
        distinguishing_features:
        - Basophilic stippling of erythrocytes on blood smear
        - Lead line on gingiva (Burton line)
        - Wrist drop and foot drop from motor neuropathy (cadmium causes sensory neuropathy)
        - Abdominal colic (lead colic) is characteristic
        - Elevated blood lead levels rather than blood cadmium
        - Osteomalacia and severe phosphate wasting are not typical of lead poisoning
      selected_evidence:
        snippet: Cadmium in sufficient cumulative dosage leads to the production of the Fanconi syndrome,
          a generalized proximal tubular reabsorptive defect thought to be related to inhibition of both
          ATP production and Na-K-ATPase activity. On the other hand, lead accumulation in the proximal
          tubule leads to hyperuricaemia and gout
        supports: SUPPORT
