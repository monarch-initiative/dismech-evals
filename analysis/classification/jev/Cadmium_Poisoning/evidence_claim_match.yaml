            id: GO:0006749
            label: glutathione metabolic process
      selected_evidence:
        snippet: liver SOD, GSH-Px, T-AOC and CAT levels were decreased, and MDA level was increased in
          Cd-treated goats, and 630 DEPs (up 326, down 304) in the livers of Cd-treated goats.
        supports: SUPPORT
