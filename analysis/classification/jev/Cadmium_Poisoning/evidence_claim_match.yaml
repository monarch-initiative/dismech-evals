  3e0a929e39cbfc472a9140f1d5de187986628d95e0c25c1bacb730c19e3de961:
    claim:
      about:
        disease:
          name: Cadmium Poisoning
          disease_term:
            preferred_term: cadmium poisoning
            term:
              id: MONDO:0043523
              label: cadmium poisoning
        context: []
      assertion_type: Treatment
      assertion:
        name: Chelation Therapy
        description: 'Chelating agents (CaNa2-EDTA, DMSA, DMPS) are used to bind and promote urinary excretion
          of cadmium. Effectiveness is limited due to cadmium''s tight binding to metallothionein and
          intracellular sequestration. BAL (dimercaprol) is generally avoided: in rat experiments BAL
          given shortly after cadmium exposure increased renal cadmium deposition, redistributing the
          metal toward the critical target organ. The same work shows the effect is timing-dependent —
          BAL given 24 hours after exposure, once metallothionein has been induced, mobilized hepatic
          cadmium into bile without raising renal cadmium — so this is an animal-derived caution about
          early administration rather than a demonstrated clinical contraindication in humans.'
        treatment_term:
          preferred_term: chelation therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: Edetic Acid
            term:
              id: NCIT:C61742
              label: Edetic Acid
          - preferred_term: succimer
            term:
              id: CHEBI:63623
              label: succimer
          - preferred_term: 2,3-disulfanylpropane-1-sulfonic acid
            term:
              id: CHEBI:888
              label: 2,3-disulfanylpropane-1-sulfonic acid
      selected_evidence:
        snippet: The treatment plan includes the use of chelating agents to reduce cadmium levels in the
          body and antibiotics to maintain the patient's condition.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
