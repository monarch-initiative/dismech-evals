      assertion_type: Pathophysiology
      assertion:
        name: Hepatic Metallothionein Binding
        description: The liver is the primary site of initial cadmium detoxification. Hepatocytes synthesize
          metallothionein (MT), a cysteine-rich protein that binds cadmium with high affinity. The cadmium-metallothionein
          (Cd-MT) complex is slowly released into the bloodstream over time. While MT binding initially
          protects against free cadmium toxicity, the Cd-MT complex is filtered at the glomerulus and
          taken up by renal tubular cells, effectively transferring the cadmium burden to the kidney.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
        biological_processes:
        - preferred_term: detoxification of inorganic compound
          term:
            id: GO:0061687
            label: detoxification of inorganic compound
      selected_evidence:
        snippet: The kidney is the main organ affected by chronic Cd exposure and toxicity. Cd accumulates
          in the kidney as a result of its preferential uptake by receptor-mediated endocytosis of freely
          filtered and metallothionein bound Cd (Cd-MT) in the renal proximal tubule.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20354761
      reference_title: 'Heavy metal poisoning: the effects of cadmium on the kidney.'
      evidence_source: OTHER
      explanation: Review confirms that hepatically-produced Cd-MT is filtered and taken up by the kidney,
