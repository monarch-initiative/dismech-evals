        description: An acquired phenocopy in neonates given prolonged prostaglandin E1 infusion to keep
          the ductus arteriosus open. It produces symmetric diaphyseal periosteal new bone, can be painful,
          and regresses when the infusion is withdrawn.
        distinguishing_features:
        - History of prolonged prostaglandin E1 infusion for duct-dependent congenital heart disease
        - Bilaterally symmetric diaphyseal periosteal new bone rather than asymmetric lesions with mandibular
          involvement
        - Rapid response to withdrawal of the drug
      selected_evidence:
        snippet: As a result of the long-term use of this drug, bilaterally symmetric marked diaphyseal
          periosteal new bone can be induced.
        supports: SUPPORT
