        variants:
        - name: COL1A1 c.3040C>T p.(Arg1014Cys)
          description: The recurrent Caffey allele in exon 41, historically numbered R836C within the
            triple helix. Found in families of diverse ancestry, consistent with a recurrent mutation
            rather than a founder allele.
          synonyms:
          - R836C
          - p.Arg836Cys
          - 3040C>T
          gene:
            preferred_term: COL1A1
            term:
              id: hgnc:2197
              label: COL1A1
          variant_type: single nucleotide variant
          type: missense
          clinical_significance: PATHOGENIC
        - name: COL1A1 c.2752C>T p.(Arg918Cys)
          description: Second Caffey allele, identified in five of 28 families in one series.
          gene:
            preferred_term: COL1A1
            term:
              id: hgnc:2197
              label: COL1A1
          variant_type: single nucleotide variant
          type: missense
          clinical_significance: PATHOGENIC
        notes: COL1A1 alleles that cause osteogenesis imperfecta and Ehlers-Danlos syndrome are curated
          by ClinGen as separate disease entities; this record covers only the Caffey alleles. A Japanese
          family with typical familial Caffey disease and no COL1A1 or COL1A2 variant indicates genetic
          heterogeneity, with the second locus unknown.
      selected_evidence:
        snippet: The same mutation was identified in affected members of 2 unrelated, smaller families
          with ADC, but not in 2 prenatal cases and not in more than 300 chromosomes from healthy individuals.
        supports: SUPPORT
