      assertion_type: Subtype
      assertion:
        name: Prenatal Form
        description: A much rarer presentation recognised before birth, with diffuse cortical hyperostosis
          of long bones and ribs, sometimes polyhydramnios and hydrops, and a high perinatal mortality
          when it begins early in gestation. The recurrent COL1A1 variant has been found in a lethal case,
          but whether all prenatal cases share the COL1A1 etiology is not established.
      selected_evidence:
        snippet: Our study indicates that a heterozygous 3040C --> T mutation can also be found in lethal
          prenatal cortical hyperostosis.
        supports: SUPPORT
