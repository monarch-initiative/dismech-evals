      assertion_type: Pathophysiology
      assertion:
        name: Disulfide-Bonded Alpha1(I) Chain Dimers
        description: The free thiol of the introduced cysteine allows abnormal disulfide bonds between
          alpha1(I) chains. Patient dermal fibroblasts produce disulfide-linked alpha1(I) dimers; with
          p.(Arg1014Cys) these molecules are secreted, with p.(Arg918Cys) they were not, and no intracellular
          accumulation of type I procollagen was seen.
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: dermal fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Fibroblast cultures from an affected individual produced abnormal disulfide-bonded dimeric
          alpha1(I) chains.
        supports: SUPPORT
