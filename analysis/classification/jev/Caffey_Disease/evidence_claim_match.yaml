      assertion_type: Discussion
      assertion:
        discussion_id: collagen_to_inflammation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does a constitutive arginine-to-cysteine change in type I collagen produce an inflammatory
          periosteal hyperostosis that is confined to particular bones, to the first months of life, and
          to a subset of carriers?
        attaches_to:
        - pathophysiology#Abnormal Type I Collagen Fibril Architecture
        - pathophysiology#Acute Periosteal and Soft-Tissue Inflammation
        - pathophysiology#COX-2 Prostaglandin E Signaling
        rationale: The variant is present in every cell and the fibril change is mild, yet the lesion
          is focal, transient and incompletely penetrant. The COX-2/PGE loop is proposed by analogy with
          the prostaglandin E1 phenocopy and the response to NSAIDs, but none of the sources cited here
          measured COX-2 or PGE in COL1A1-positive lesions, and none describes an animal model carrying
          the Caffey allele.
      selected_evidence:
        snippet: Importantly, it remains to be established as to how a point-mutation in type I collagen
          leads to a cascade of inflammatory events and spatio-temporally limited hyperostotic bone lesions
        supports: SUPPORT
