        name: Clinical and Radiographic Diagnosis with COL1A1 Testing
        description: The diagnosis rests on typical clinical and radiographic findings (cortical hyperostosis
          with periosteal new bone, sparing metaphyses and epiphyses) and can be confirmed by finding
          a heterozygous Caffey-associated COL1A1 variant. Because a minority of typical cases have no
          COL1A1 variant, a negative test does not exclude the diagnosis.
      selected_evidence:
        snippet: The diagnosis of Caffey disease is established in a proband with typical clinical and
          radiographic findings; identification of a heterozygous COL1A1 pathogenic variant associated
          with Caffey disease on molecular genetic testing can confirm the diagnosis.
