  f611fedef3e40b1c3834df0c47206d801b0ff58e044fccf41f2de59cc38b05c0:
    claim:
      about:
        disease:
          name: Caffey Disease
          disease_term:
            preferred_term: Caffey disease
            term:
              id: MONDO:0007244
              label: Caffey disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COL1A1 Arginine-to-Cysteine Substitution
        description: The initiating lesion is a heterozygous germline missense variant in COL1A1 that
          replaces an arginine with a cysteine in the triple-helical domain of the pro-alpha1(I) chain
          of type I collagen. The recurrent allele is c.3040C>T, p.(Arg1014Cys) (R836C in helical numbering);
          c.2752C>T, p.(Arg918Cys) is a second, less common allele. Neither is a glycine substitution
          of the kind that causes osteogenesis imperfecta. The structural-constituent function is marked
          ABNORMAL rather than DECREASED because the change is qualitative (aberrant disulfide-bonded
          chains, altered fibril diameter and packing and, per ClinGen, disrupted collagen-ligand interaction),
          not a loss of collagen quantity.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: COL1A1
          term:
            id: hgnc:2197
            label: COL1A1
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
        molecular_functions:
        - preferred_term: type I collagen structural constituent of the extracellular matrix
          modifier: ABNORMAL
          term:
            id: GO:0030020
            label: extracellular matrix structural constituent conferring tensile strength
      selected_evidence:
        snippet: Affected individuals and obligate carriers were heterozygous for a missense mutation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15864348
      reference_title: A novel COL1A1 mutation in infantile cortical hyperostosis (Caffey disease) expands
