      assertion_type: DifferentialDiagnosis
      assertion:
        name: Osteomyelitis, Scurvy, Hypervitaminosis A and Inflicted Injury
        description: Infantile periosteal new bone with soft-tissue swelling, fever and raised inflammatory
          markers is often first treated as osteomyelitis, and the radiological differential includes
          vitamin A intoxication, scurvy, congenital syphilis, malignancy and inflicted injury (child
          physical abuse). Misattribution to abuse has been reported.
        distinguishing_features:
        - Diaphyseal lesions sparing metaphyses and epiphyses
        - Mandibular involvement
        - Negative cultures
        - Spontaneous regression and family history of the same episode
      selected_evidence:
        snippet: The radiological differential diagnosis should include osteomyelitis, vitamin A intoxication,
          scurvy, syphilis, osteosarcoma and battered child syndrome.
        supports: SUPPORT
