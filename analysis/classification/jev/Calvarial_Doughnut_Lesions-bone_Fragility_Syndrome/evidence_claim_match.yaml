      assertion_type: Treatment
      assertion:
        name: Bisphosphonate Therapy
        description: 'Bisphosphonates are the treatment actually used - pamidronate and alendronate in
          the French-Canadian proband from childhood, pamidronate courses in several of the discovery
          families and in the Belarusian kindred, with reported improvement in back pain, quality of life,
          bone mineral density, and in some patients cessation of further long-bone fractures. There is
          a mechanistic tension worth stating: bisphosphonates are ANTIRESORPTIVE, and osteoclast function
          in this disease was measured and found normal. So the drug is not correcting the demonstrated
          lesion, which is defective matrix mineralization on a normal-turnover background. The reported
          benefits are real but come from uncontrolled clinical observation in small families, not from
          a trial.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
