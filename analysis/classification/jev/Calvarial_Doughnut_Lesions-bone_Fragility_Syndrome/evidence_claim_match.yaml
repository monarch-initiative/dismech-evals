            term:
              id: MONDO:0007470
              label: calvarial doughnut lesions-bone fragility syndrome
        context: []
      assertion_type: Biochemical
      assertion:
        name: Alkaline phosphatase and 25-hydroxyvitamin D
        notes: Calcium-phosphate metabolism is broadly unremarkable in CDL, which is itself diagnostically
          useful - it separates this disease from rickets and from hypophosphatasia, where the same panel
          is grossly abnormal. What has been reported is raised alkaline phosphatase activity with a low
          25-hydroxyvitamin D, in a child in whom ionised calcium and inorganic phosphorus were both within
          reference limits. Neither finding is specific, and low vitamin D is common enough in children
          generally that it should not be over-read as part of the disease.
      selected_evidence:
        snippet: The laboratory study of calcium phosphate metabolism revealed an increased level of alkaline
          phosphatase activity and decreased level of 25-hydroxyvitamin D (25(OH)D).
        supports: SUPPORT
