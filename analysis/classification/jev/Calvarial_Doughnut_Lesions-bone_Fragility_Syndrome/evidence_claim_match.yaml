          are what distinguishes CDL from other primary osteoporoses and from osteogenesis imperfecta,
          and the entity was originally defined radiologically in 1969. Two practical caveats follow from
          the natural history: the lesions are not fully penetrant, so their absence does not exclude
          the diagnosis in a fracturing child; and they can develop over time, so a normal skull film
          in infancy does not settle the question - one severely affected boy had normal skull radiographs
          at birth and later developed marked cranial sclerosis.'
