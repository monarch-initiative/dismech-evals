        description: 'Molecular confirmation. The recurrent nonsense allele c.148C>T (p.Arg50*) is a hot
          spot found in most reported families, so targeted analysis of that variant is a cheap first-line
          test before broader panels. The diagnostic-odyssey point is worth recording: because CDL is
          grouped with osteogenesis imperfecta among the bone fragility disorders and presents as childhood
          osteoporosis, patients are routinely worked up as OI first. One proband carried a working diagnosis
          of OI type I and was offered four sequential gene panels before SGMS2 was identified. Including
          SGMS2 in first-line early-onset-osteoporosis panels is the practical fix.'
