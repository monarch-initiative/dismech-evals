        fidelity: LOW
        description: Knockdown compromises notochord and craniofacial skeletal formation, and single-cell
          RNA sequencing localises sgms2a expression to osteogenic cells in juvenile calvaria, which supports
          a cell-autonomous skeletal role for the gene.
        limitations: The readout is embryonic craniofacial and notochord development, not adult bone matrix
          mineralization, so it does not model the human lesion. It is a transient knockdown rather than
          a stable genetic model, it is a loss-of-expression model while the severe human alleles are
          mislocalising rather than null, and the authors describe the models explicitly as preliminary
          platforms.
