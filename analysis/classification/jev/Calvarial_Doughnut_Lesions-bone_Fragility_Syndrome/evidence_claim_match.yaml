          with measured-normal osteoclast function, an agent that drives formation is better matched to
          the mechanism than one that suppresses resorption. No outcome is reported for it in CDL. The
          patient documented as receiving it had already sustained about 40 fractures by then, so this
          records what was tried, not what worked.
