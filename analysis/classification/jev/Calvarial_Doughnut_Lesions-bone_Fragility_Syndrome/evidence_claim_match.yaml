        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Calvarial Sclerotic Doughnut Lesions
        biological_scale: TISSUE
        description: 'The pathognomonic finding and the entry''s most conspicuous unexplained feature:
          discrete ring-shaped sclerotic lesions in the cranial bones, coexisting with generalised low
          bone mineral density elsewhere. A disease that under-mineralises the skeleton produces focal
          HYPER-sclerosis in the calvaria, and no mechanism has been proposed for that inversion. The
          lesions are what distinguish CDL from other primary osteoporoses, including osteogenesis imperfecta.'
        mechanism_confidence: PROVISIONAL
        notes: Modelled as a node with no incoming causal edge from the mineralization branch, because
          asserting one would claim a mechanism that does not exist in the literature. The lesions are
          also not fully penetrant and can appear over time - one severely affected boy had normal skull
          radiographs at birth and developed progressive severe cranial sclerosis - so they are a developing
          feature rather than a congenital one.
      selected_evidence:
        snippet: The cranial sclerotic, circular lesions differentiate this skeletal disorder from other
          types of primary osteoporosis.
        supports: SUPPORT
