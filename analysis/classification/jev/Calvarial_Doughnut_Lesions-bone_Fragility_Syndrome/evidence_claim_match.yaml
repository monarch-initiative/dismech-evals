            term:
              id: MONDO:0007470
              label: calvarial doughnut lesions-bone fragility syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous SGMS2 Variants
        biological_scale: MOLECULAR
        description: The primary lesion is a heterozygous variant in SGMS2 on chromosome 4, encoding sphingomyelin
          synthase 2. The published allelic series was for years only three variants - the recurrent nonsense
          c.148C>T (p.Arg50*) and two missense alleles at adjacent residues, c.185T>G (p.Ile62Ser) and
          c.191T>G (p.Met64Arg) - which is a remarkably tight series for a dominant skeletal disease and
          is what made the allele-class comparison below possible. A frameshift allele with a high-bone-mass
          presentation has since been reported. SGMS2 is prominently expressed in cortical bone.
        genes:
        - preferred_term: SGMS2
          term:
            id: hgnc:28395
            label: SGMS2
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Four unrelated families shared the same nonsense variant, c.148C>T (p.Arg50*), whereas
          the other families had a missense variant, c.185T>G (p.Ile62Ser) or c.191T>G (p.Met64Arg).
        supports: SUPPORT
    origin:
