          trochlear, oculomotor and abducens palsies, transient diplopia and ptosis in individual patients.
          Two candidate explanations exist and have not been separated: mechanical compression of nerves
          in sclerotic cranial foramina, or a primary effect of disordered sphingomyelin metabolism on
          nerve or myelin - sphingomyelin being a major myelin lipid. A transcriptomic study found the
          differentially expressed genes enriched for neurological as well as skeletal processes and suggested
          an effect on neuron-supporting cells, which favours but does not establish the second.'
        mechanism_confidence: PROVISIONAL
