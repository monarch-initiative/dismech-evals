      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Secretory-Pathway Lipid Landscape
        biological_scale: CELLULAR
        description: 'The step that converts a mislocalised enzyme into a cell-biological defect. Sphingomyelin
          made in the trans-Golgi normally traps ER-synthesised cholesterol and builds a sphingomyelin/sterol
          gradient along the secretory pathway - a gradient that marks the physical transition in membrane
          properties defining organelle identity. Pathogenic SMS2 makes sphingomyelin in the ER instead,
          and the consequence is not confined to sphingomyelin: cholesterol organisation, glycerophospholipid
          profiles and membrane lipid order are all disturbed, in patient-derived fibroblasts as well
          as in engineered cells. The authors'' proposal is that osteogenic cells cannot sustain the non-random
          lipid distributions their bone-forming activity requires.'
        biological_processes:
        - preferred_term: sphingomyelin biosynthetic process
          modifier: ABNORMAL
          term:
            id: GO:0006686
            label: sphingomyelin biosynthetic process
        mechanism_confidence: ESTABLISHED
        notes: The final inferential step - from disturbed lipid landscape to failed mineralization -
          is explicitly a postulate in the source, not a demonstration. The wording of the evidence explanation
          preserves that.
      selected_evidence:
        snippet: These aberrant sphingomyelin distributions also occur in patient-derived fibroblasts
          and are accompanied by imbalances in cholesterol organization, glycerophospholipid profiles,
          and lipid order in the secretory pathway.
        supports: SUPPORT
