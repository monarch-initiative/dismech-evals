            preferred_term: calvarial doughnut lesions with bone fragility, with or without spondylometaphyseal
              dysplasia (SGMS2-related)
            term:
              id: MONDO:0007470
              label: calvarial doughnut lesions-bone fragility syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SGMS2
        gene_term:
          preferred_term: SGMS2
          term:
            id: hgnc:28395
            label: SGMS2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'SGMS2 on chromosome 4 encodes sphingomyelin synthase 2. Inheritance is autosomal dominant
          through heterozygous variants. Three founding alleles dominate the literature: the recurrent
          nonsense c.148C>T (p.Arg50*), which is a hot spot found across most reported families and produces
          a catalytically inactive enzyme, and the missense c.185T>G (p.Ile62Ser) and c.191T>G (p.Met64Arg),
          which produce active enzyme trapped in the ER. A frameshift allele c.1052_1074dup has since
          been reported with a high-bone-mass presentation.

          Functional impact does not reduce to a single category, which is why it is described here rather
          than asserted in a slot: p.Arg50* is loss of function, while the missense alleles are better
          described as mislocalising - they retain and even increase catalytic output while acting dominantly
          and causing the more severe disease.'
      selected_evidence:
        snippet: Four unrelated families shared the same nonsense variant, c.148C>T (p.Arg50*), whereas
          the other families had a missense variant, c.185T>G (p.Ile62Ser) or c.191T>G (p.Met64Arg).
        supports: SUPPORT
    origin:
