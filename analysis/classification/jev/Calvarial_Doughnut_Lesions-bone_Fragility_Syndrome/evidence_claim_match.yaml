  754152a6e0b13079b57c318187405af20f0eba6ef4ddedc5080062204444bca0:
    claim:
      about:
        disease:
          name: Calvarial Doughnut Lesions-Bone Fragility Syndrome
          disease_term:
            preferred_term: calvarial doughnut lesions with bone fragility, with or without spondylometaphyseal
              dysplasia (SGMS2-related)
            term:
              id: MONDO:0007470
              label: calvarial doughnut lesions-bone fragility syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mislocalisation of SMS2 Away from the Plasma Membrane
        biological_scale: MOLECULAR
        description: The convergence point, and the reason two biochemically opposite allele classes cause
          one disease. Normal SMS2 is made in the ER and trafficked to the plasma membrane, where it synthesises
          sphingomyelin and maintains membrane lipid asymmetry. The missense alleles hold a catalytically
          competent SMS2 in the ER by blocking its export; the p.Arg50* product is reported to be dislocated
          into the cis/medial-Golgi. In both cases sphingomyelin synthesis is misdirected away from the
          plasma membrane. The striking corollary is that the missense alleles INCREASE total de novo
          sphingomyelin production while causing the more severe disease, which rules out a simple sphingomyelin-deficiency
          model.
        genes:
        - preferred_term: SGMS2
          term:
            id: hgnc:28395
            label: SGMS2
        molecular_functions:
        - preferred_term: sphingomyelin synthase activity
          modifier: ABNORMAL
          term:
            id: GO:0033188
            label: sphingomyelin synthase activity
        biological_processes:
        - preferred_term: protein localization to plasma membrane
          modifier: DECREASED
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: While the p.Arg50* mutation yielded a catalytically inactive enzyme, p.Ile62Ser and p.Met64Arg
          each enhanced the rate of de novo sphingomyelin production by blocking export of a functional
          enzyme from the endoplasmic reticulum.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
