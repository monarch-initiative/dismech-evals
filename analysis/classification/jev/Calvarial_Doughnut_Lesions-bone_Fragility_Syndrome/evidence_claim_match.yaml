        name: Osteocyte Lacunocanalicular Network Disruption
        biological_scale: CELLULAR
        description: A second, independent tissue lesion. Osteocyte lacunae are abnormally large and round,
          and the canalicular network is severely disturbed, with short canaliculi lacking orderliness
          or continuity. This matters because the lacunocanalicular network is how bone senses mechanical
          load and coordinates remodelling; a plasma-membrane lipid defect impairing the formation of
          these fine cell processes is a mechanistically coherent - though not directly demonstrated -
          explanation.
        cell_types:
        - preferred_term: osteocyte
          term:
            id: CL:0000137
            label: osteocyte
        mechanism_confidence: PROVISIONAL
        notes: Two limits on this node. It rests on transiliac biopsies from exactly two adult males,
          both carrying the same p.Arg50* allele, so it is not established for the missense class. And
          the link from plasma-membrane sphingomyelin to canalicular architecture is a proposal about
          membrane-shaping requirements, not a measured pathway.
      selected_evidence:
        snippet: Last, osteocyte lacunae appeared abnormally large and round in shape and the canalicular
          network severely disturbed with short-spanned canaliculi lacking any orderliness or continuity.
        supports: SUPPORT
