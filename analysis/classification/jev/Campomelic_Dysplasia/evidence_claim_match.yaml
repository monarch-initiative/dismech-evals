              id: MONDO:0007251
              label: campomelic dysplasia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SOX9 Dosage Insufficiency and Matrix Defects
        description: 'Reduced SOX9 dosage impairs chondrogenesis and downstream cartilage matrix output.
          A CRISPR-engineered human iPSC model of a campomelic dysplasia SOX9 splice-site mutation shows
          that SOX9-heterozygous chondrocytes have significant chondrogenic defects with altered BMP-SMAD
          signaling (noggin upregulation), and that raising SOX9 improves sulfated GAG accumulation and
          COL2A1 expression. A separate line of work on milder SOX9 transactivation middle (TAM) domain
          variants shows that reduced SOX9 protein stability is one route to lowered dosage; that work
          is drawn from a congenital vertebral malformation cohort with mild skeletal dysplasia and scoliosis
          rather than from campomelic dysplasia patients, so the stability route is reported here as a
          spectrum-level mechanism rather than an established CD-specific one.

          '
        biological_processes:
        - preferred_term: Extracellular Matrix Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
        - preferred_term: Cartilage Development
          term:
            id: GO:0051216
            label: cartilage development
          modifier: DECREASED
      selected_evidence:
        snippet: This hiPSCs-derived chondrocytes from heterozygotes (HT) and homozygotes (HM) SOX9 mutation
          carriers showed significant defects in chondrogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
