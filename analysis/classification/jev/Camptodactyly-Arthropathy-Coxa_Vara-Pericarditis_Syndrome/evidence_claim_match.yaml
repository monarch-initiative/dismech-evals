          chondrocytes into synovial fluid and onto the cartilage surface, and is also present on tendons
          and tendon sheaths and in the pericardial and pleural cavities. In CACP it is absent from these
          sites, removing boundary lubrication, an anti-adhesive surface coating, and a brake on synoviocyte
          growth.
