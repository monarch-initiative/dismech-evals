        inheritance:
        - name: Autosomal Dominant
        notes: Variants in fast skeletal troponin T cause distal arthrogryposis with camptodactyly.
      selected_evidence:
        snippet: we report a 4-generation Indian family with 18 affected members presenting variable features
          of camptodactyly, brachydactyly, syndactyly, decreased flexion palmar creases, ulnar deviation
          of the hands, sandal gaps and club feet. We undertook exome sequencing of 3 distantly related
          affected individuals. Bioinformatics filtering revealed a known pathogenic missense mutation
          c.188G>A (p.Arg63His) in TNNT3
        supports: SUPPORT
