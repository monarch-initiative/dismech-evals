        description: 'Mutations in TGFB1 affect the latency-associated peptide (LAP) region, disrupting
          the non-covalent association between LAP and mature TGF-beta 1. This leads to premature or excessive
          release of active TGF-beta 1 from its latent complex, resulting in increased osteoblast activity
          and cortical bone thickening in the diaphyses.

          '
        cell_types:
        - preferred_term: Osteoblast
