          term:
            id: GO:0046849
            label: bone remodeling
        - preferred_term: Osteoblast Differentiation
          term:
            id: GO:0001649
            label: osteoblast differentiation
      selected_evidence:
        snippet: disease-causing mutations are located within the TGFβ-1 gene and expected to or thought
          to disrupt the binding between TGFβ1 and its latency-associated peptide resulting in an increased
          signaling of the pathway and subsequently accelerated bone turnover.
        supports: SUPPORT
