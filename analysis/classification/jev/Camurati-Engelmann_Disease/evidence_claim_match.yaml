              label: Camurati-Engelmann disease
        context: []
      assertion_type: Genetic
      assertion:
        name: TGFB1 Mutations
        association: Causative
        notes: 'Heterozygous gain-of-function mutations in TGFB1 encoding TGF-beta 1. Most mutations cluster
          in the latency-associated peptide (LAP) domain and disrupt the non-covalent interaction that
          maintains TGF-beta 1 in its latent form.

          '
        variants:
        - name: R218H
          description: 'The most common mutation, located in the LAP domain.

            '
        - name: R218C
          description: 'LAP domain mutation disrupting beta1-LAP and TGF-beta1 association.

            '
        - name: C225R
          description: 'LAP domain mutation causing premature TGF-beta 1 activation.

            '
      selected_evidence:
        snippet: We screened the TGFB1 gene for mutations and identified a missense mutation resulting
          in an R218H substitution in the affected individuals
        supports: SUPPORT
