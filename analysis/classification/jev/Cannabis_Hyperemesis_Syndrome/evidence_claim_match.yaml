          term:
            id: UBERON:0000955
            label: brain
        - preferred_term: Stomach
          term:
            id: UBERON:0000945
            label: stomach
      selected_evidence:
        snippet: prolonged high doses of the main psychotropic compound in cannabis, Δ9-tetrahydrocannabinol
          (THC), result in changes to the endocannabinoid system by acting on the cannabinoid 1 (CB1)
          receptor. These endocannabinoid system changes can dysregulate stress and anxiety responses,
          thermoregulation, the transient receptor potential vanilloid system, and several neurotransmitters
          systems, and are thus potential candidates for mediating the pathophysiology of CHS.
        supports: SUPPORT
