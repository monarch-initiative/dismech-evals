  ad68b94ff4368cbeb3adca7cd25cba2850e0834cf1ea698aee3b8465d9d8b600:
    claim:
      about:
        disease:
          name: Cannabis Hyperemesis Syndrome
          disease_term:
            preferred_term: cannabinoid hyperemesis syndrome
            term:
              id: MONDO:0100094
              label: cannabinoid hyperemesis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TRPV1 Receptor Dysregulation
        description: 'The transient receptor potential vanilloid 1 (TRPV1) receptor system is dysregulated
          in CHS through its complex interrelation with the endocannabinoid system. The dramatic relief
          of CHS symptoms from hot water and topical capsaicin (both TRPV1 agonists) provides evidence
          for this mechanism. TRPV1 activation by heat or capsaicin modulates tachykinins, somatostatin,
          CGRP, and histaminergic, cholinergic, and serotonergic transmission, producing antiemetic effects.
          Cannabinoid receptor desensitization in the setting of chronic use disrupts this TRPV1-endocannabinoid
          interaction.

          '
        biological_processes:
        - preferred_term: Sensory perception of temperature stimulus
          term:
            id: GO:0050951
            label: sensory perception of temperature stimulus
        - preferred_term: Temperature homeostasis
          term:
            id: GO:0001659
            label: temperature homeostasis
        genes:
        - preferred_term: TRPV1
          term:
            id: hgnc:12716
            label: TRPV1
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Cannabinoid hyperemesis syndrome may result from a derangement in the endocannabinoid
          system secondary to chronic exogenous stimulation. The relief of cannabinoid hyperemesis syndrome
          symptoms from heat and use of transient receptor potential vanilloid 1 agonists suggests a complex
          interrelation between the endocannabinoid system and transient receptor potential vanilloid
          1.
        supports: SUPPORT
