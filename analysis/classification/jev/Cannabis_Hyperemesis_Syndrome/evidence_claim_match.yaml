  565e48b619dac24d1fa1b78ed71d0b7398e3a94c242961dbf144693a3896158e:
    claim:
      about:
        disease:
          name: Cannabis Hyperemesis Syndrome
          disease_term:
            preferred_term: cannabinoid hyperemesis syndrome
            term:
              id: MONDO:0100094
              label: cannabinoid hyperemesis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Gastrointestinal Dysmotility
        description: 'CB1 receptors in the gastrointestinal tract regulate gut motility. Chronic cannabis
          exposure leads to delayed gastric emptying and reduced intestinal motility. This is paradoxical
          because delayed gastric emptying would normally promote nausea and vomiting, but the antiemetic
          CNS properties of cannabinoids usually mask this effect. In CHS, the proemetic peripheral effects
          of cannabis on the gut override its antiemetic CNS properties. Delayed gastric emptying appears
          particularly resistant to tolerance development.

          '
        biological_processes:
        - preferred_term: Gastric emptying
          term:
            id: GO:0035483
            label: gastric emptying
          modifier: DECREASED
        - preferred_term: Intestinal motility
          term:
            id: GO:0120054
            label: intestinal motility
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Enteric neuron
          term:
            id: CL:0007011
            label: enteric neuron
        - preferred_term: Epithelial cell of stomach
          term:
            id: CL:0002178
            label: epithelial cell of stomach
        locations:
        - preferred_term: Stomach
          term:
            id: UBERON:0000945
            label: stomach
      selected_evidence:
        snippet: in susceptible individuals the pro-emetic effect of cannabis on the gut (e.g. delayed
          gastric emptying) overrides its anti-emetic CNS properties
        supports: SUPPORT
