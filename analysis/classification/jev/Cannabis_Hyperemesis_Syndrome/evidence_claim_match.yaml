        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endocannabinoid System Dysregulation
        description: 'Chronic high-dose cannabis use overwhelms the endocannabinoid system, which normally
          regulates stress response, allostasis, thermoregulation, and gastrointestinal motility via CB1
          receptors. Prolonged THC exposure at the CB1 receptor produces changes that can dysregulate
          stress and anxiety responses, thermoregulation, the TRPV1 system, and multiple neurotransmitter
          systems. THC accumulates in body fat and may produce a reintoxication effect during stress or
          fasting, precipitating acute episodes.

          '
        biological_processes:
        - preferred_term: Cannabinoid signaling pathway
          term:
            id: GO:0038171
            label: cannabinoid signaling pathway
          modifier: ABNORMAL
        - preferred_term: G protein-coupled receptor signaling pathway
