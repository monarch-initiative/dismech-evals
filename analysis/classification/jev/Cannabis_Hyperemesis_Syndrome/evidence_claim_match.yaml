  41823d31ef229755dbcaa4d00926360696da55f363b7477962a413d8ab553e2d:
    claim:
      about:
        disease:
          name: Cannabis Hyperemesis Syndrome
          disease_term:
            preferred_term: cannabinoid hyperemesis syndrome
            term:
              id: MONDO:0100094
              label: cannabinoid hyperemesis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HPA Axis Disruption
        description: 'The endocannabinoid system normally exerts negative feedback on the hypothalamic-pituitary-adrenal
          (HPA) axis. Chronic cannabis use disrupts this feedback mechanism. CB1 receptor activation in
          the hypothalamus and pituitary modulates all hypothalamic-pituitary axes. Acute episodes may
          be precipitated by stress or fasting in chronic users with abnormal HPA axis feedback and sympathetic
          nervous system response. Stress-induced lipolysis can mobilize THC stored in adipose tissue,
          creating a positive feedback loop.

          '
        biological_processes:
        - preferred_term: Regulation of hormone secretion
          term:
            id: GO:0046883
            label: regulation of hormone secretion
          modifier: ABNORMAL
        - preferred_term: Lipid catabolic process
          term:
            id: GO:0016042
            label: lipid catabolic process
        cell_types:
        - preferred_term: Adipocyte
          term:
            id: CL:0000136
            label: adipocyte
        locations:
        - preferred_term: Brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Acute episodes of CHS may be precipitated by stress or fasting in chronic cannabis users
          who may have pre-existing abnormal hypothalamic-pituitary-adrenal axis feedback and sympathetic
          nervous system response.
        supports: SUPPORT
