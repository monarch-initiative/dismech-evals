        name: RAS-MAPK/ERK-driven arteriovenous malformation formation
        description: Impaired Ras suppression and EPHB4-RASA1 vascular developmental signaling converge
          on abnormal ERK/MAPK signaling and blood vessel morphogenesis, promoting arteriovenous malformation
          and fistula formation.
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: ERK1 and ERK2 cascade
          modifier: INCREASED
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
        - preferred_term: blood vessel morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0048514
            label: blood vessel morphogenesis
      selected_evidence:
        snippet: Mice expressing a VOGM-specific EPHB4 kinase-domain missense variant (Phe867Leu) exhibited
          disrupted developmental angiogenesis and impaired hierarchical development of arterial-capillary-venous
          networks, but only in the presence of a "second-hit" allele.
        supports: SUPPORT
