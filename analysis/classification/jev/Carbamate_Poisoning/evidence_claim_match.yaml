      assertion_type: ProgressionInfo
      assertion:
        phase: Acute cholinergic crisis
        notes: Onset is within minutes to about two hours of exposure, and the course is usually self-limited
          over hours to a few days as acetylcholinesterase spontaneously reactivates. Because the carbamate
          adduct does not age, the delayed intermediate syndrome seen after organophosphate poisoning
          is largely absent.
