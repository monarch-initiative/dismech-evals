      assertion_type: Biochemical
      assertion:
        name: Red cell and plasma cholinesterase activity
        presence: DECREASED
        notes: Low red-cell acetylcholinesterase or plasma butyrylcholinesterase activity confirms anticholinesterase
          poisoning. In carbamate poisoning the result can read falsely normal, because the reversible
          carbamyl-enzyme bond can reactivate in the sample before it is assayed.
      selected_evidence:
        snippet: Confirmation of poisoning by anti-cholinesterase pesticides can be sought by measuring
          butyrylcholinesterase and/or red-cell acetylcholinesterase activity.
        supports: SUPPORT
