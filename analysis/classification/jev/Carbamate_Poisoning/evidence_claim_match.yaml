      assertion_type: Pathophysiology
      assertion:
        name: Acetylcholinesterase carbamylation
        conforms_to: acetylcholinesterase_inhibition#Acetylcholinesterase Inhibition
        biological_scale: MOLECULAR
        description: N-methyl carbamate insecticides (and carbamate drugs) carbamylate the serine hydroxyl
          in the catalytic site of acetylcholinesterase, inactivating the enzyme that hydrolyses acetylcholine.
          Unlike the organophosphate adduct, the carbamyl-enzyme bond hydrolyses spontaneously (decarbamylation)
          and does not "age", so inhibition is reversible and recovery does not require synthesis of new
          enzyme.
        molecular_functions:
        - preferred_term: acetylcholinesterase activity
          modifier: DECREASED
          term:
            id: GO:0003990
            label: acetylcholinesterase activity
        biological_processes:
        - preferred_term: acetylcholine catabolic process
          modifier: DECREASED
          term:
            id: GO:0006581
            label: acetylcholine catabolic process
      selected_evidence:
        snippet: Both classes inhibit acetylcholinesterase (AChE) enzymes, leading to excess acetylcholine
          accumulation at nerve terminals.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
