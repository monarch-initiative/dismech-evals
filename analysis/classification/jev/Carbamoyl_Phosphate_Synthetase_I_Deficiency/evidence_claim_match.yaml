        context: []
      assertion_type: Genetic
      assertion:
        name: CPS1 pathogenic variants
        gene_term:
          preferred_term: CPS1
          term:
            id: hgnc:2323
            label: CPS1
        features: 'CPS1D is caused by biallelic pathogenic variants in the CPS1 gene encoding carbamoyl
          phosphate synthetase 1, a mitochondrial urea-cycle enzyme. Extensive allelic heterogeneity exists,
          with many novel variants reported in 2023-2024 cohorts. Variant types include missense, frameshift,
          in-frame deletion, and splicing mutations. Compound heterozygosity is common. No hotspot variants
          have been observed. Complete loss of function typically causes severe neonatal-onset disease,
          while hypomorphic variants with residual enzyme activity are associated with late-onset presentations.

          '
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: Compound heterozygous CPS1 variants (Chinese cohort)
          description: 'Dong et al. identified 12 CPS1 variants in seven Chinese CPS1D patients, including
            seven missense, three frameshift, one in-frame deletion, and one splicing variant. Ten of
            12 variants were novel, and all patients exhibited compound heterozygosity.

            '
        - name: Homozygous c.2397G>A (p.Met799Ile) CPS1 variant
          description: 'A homozygous likely pathogenic CPS1 variant identified in a 59-year-old Japanese
            woman with late-onset CPS1D manifested during corticosteroid treatment for polymyositis.

            '
        - name: Compound heterozygous c.1145C>T and c.4080_c.4091del CPS1 variants
          description: 'Compound heterozygous CPS1 variants identified in an adolescent-onset case, including
            a missense mutation and a novel non-frameshift deletion.

            '
      selected_evidence:
        snippet: No hotspot variants were observed among the patients. Our data contribute to expanding
          the mutation spectrum of CPS1.
        supports: SUPPORT
