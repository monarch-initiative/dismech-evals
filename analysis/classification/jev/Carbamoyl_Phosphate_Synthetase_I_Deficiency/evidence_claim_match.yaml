              label: carbamoyl phosphate synthetase I deficiency disease
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Long-term outcome
        notes: 'Long-term neurodevelopmental outcome tracks peak ammonia, the duration of hyperammonemia,
          and the frequency of recurrent crises rather than genotype alone. Registry data show CPS1D mortality
          of 36.8%, the highest of any urea cycle disorder, and markedly higher ammonia levels among those
          who died. Newborn-screening detection improves both survival and neurological outcome relative
          to symptomatic diagnosis. Liver transplantation provides definitive metabolic correction but
          does not reverse established neurological injury.

          '
      selected_evidence:
        snippet: Global mortality was 14.9%, higher in carbamoylphosphate synthetase 1 deficiency (36.8%)
          and male OTCD patients (32.1%) compared to other defects
        supports: SUPPORT
