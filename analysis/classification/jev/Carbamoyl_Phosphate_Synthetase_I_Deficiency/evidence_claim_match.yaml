      assertion_type: ProgressionInfo
      assertion:
        phase: Late-onset presentation
        age_range: Infancy to adulthood
        notes: 'Residual CPS1 activity defers presentation, which may occur at any age and is typically
          unmasked by a catabolic trigger - intercurrent infection, dehydration, surgery, prolonged fasting,
          or corticosteroid exposure - that increases endogenous protein catabolism beyond residual urea-cycle
          capacity. Because the disorder is not suspected, late-onset crises are frequently misattributed
          at first presentation.

          '
      selected_evidence:
        snippet: a presentation outside the newborn period at any age with (sometimes) milder symptoms
          of hyperammonemia
        supports: SUPPORT
