    claim:
      about:
        disease:
          name: Carbon Monoxide Poisoning
          disease_term:
            preferred_term: carbon monoxide poisoning
            term:
              id: MONDO:0800373
              label: carbon monoxide poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_co_rodent_mbp_autoimmunity
        prompt: Does the rodent anti-myelin-basic-protein autoimmune mechanism of delayed neuropathology
          quantitatively explain human delayed neurological sequelae?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Immune-mediated neuroinflammation
        - pathophysiology#Delayed demyelination
        rationale: The adaptive-immune, anti-MBP mechanism of delayed CO neuropathology is established
          chiefly in rats, where immunological tolerance to MBP before poisoning abolishes the learning
          deficit, demonstrating causation. Its quantitative fidelity to human delayed neurological sequelae
          is not established; human delayed encephalopathy is heterogeneous and the contribution of MBP
          autoimmunity relative to hypoxic-ischemic injury in people remains an open translational question.
      selected_evidence:
        snippet: These results demonstrate that delayed CO-mediated neuropathology is linked to an adaptive
          immunological response to chemically modified MBP.
        supports: SUPPORT
    origin:
