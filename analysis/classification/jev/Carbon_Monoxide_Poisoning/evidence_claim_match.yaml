      assertion_type: Pathophysiology
      assertion:
        name: Leftward shift of the oxyhemoglobin dissociation curve
        description: Binding of CO to one or more heme sites increases the oxygen affinity of the remaining
          sites on the hemoglobin tetramer, shifting the oxyhemoglobin dissociation curve to the left
          so that bound oxygen is released less readily at the tissues, worsening tissue hypoxia beyond
          what the reduced oxygen-carrying capacity alone would cause.
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
      selected_evidence:
        snippet: decreased release of oxygen to tissues leading to tissue hypoxia
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26563790
      reference_title: Carbon monoxide intoxication.
      evidence_source: OTHER
      explanation: Supports impaired oxygen offloading (the functional consequence of the leftward shift)
        as a driver of tissue hypoxia.
