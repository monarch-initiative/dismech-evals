      assertion_type: Pathophysiology
      assertion:
        name: Cytochrome c oxidase inhibition
        description: Carbon monoxide binds the ferrous iron of mitochondrial cytochrome c oxidase (Complex
          IV of the electron transport chain), directly inhibiting oxidative phosphorylation. This produces
          histotoxic (cellular) hypoxia independent of oxygen delivery, impairing ATP generation even
          where oxygen is present, and helps explain the persistence of symptoms after carboxyhemoglobin
          normalizes.
        biological_processes:
        - preferred_term: oxidative phosphorylation
          modifier: DECREASED
          term:
            id: GO:0006119
            label: oxidative phosphorylation
        - preferred_term: mitochondrial electron transport, cytochrome c to oxygen
          modifier: DECREASED
          term:
            id: GO:0006123
            label: mitochondrial electron transport, cytochrome c to oxygen
      selected_evidence:
        snippet: Our results suggest that mitochondrial cytochrome c oxidase is also a target site in
          human acute CO poisoning, and its extended and generalized inhibition could explain the persistence
          of different symptoms after the normalization of HbCO levels.
        supports: SUPPORT
