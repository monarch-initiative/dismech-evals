      assertion_type: Discussion
      assertion:
        discussion_id: gap_co_hbo_patient_selection
        prompt: Which carbon monoxide poisoning patients derive a durable neurological benefit from hyperbaric
          oxygen therapy, and by what mechanism?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#Hyperbaric oxygen therapy
        - pathophysiology#Delayed neuronal injury
        rationale: Randomized trials conflict. Thom 1995 and Weaver 2002 found that hyperbaric oxygen
          reduced delayed/cognitive sequelae, whereas Scheinkestel 1999 found no benefit and even worse
          outcomes on some measures, using a different protocol and patient mix. The subset of patients
          who benefit, the optimal timing and pressure, and whether the benefit comes from faster CO clearance
          or from interrupting the immune-mediated demyelination cascade remain unresolved.
      selected_evidence:
        snippet: HBO patients had a worse outcome in the learning test at completion of treatment (P =
          0.01 for all patients; P = 0.005 for severely poisoned patients)
        supports: REFUTE
