        description: Inhaled carbon monoxide binds hemoglobin at the same heme iron sites used by oxygen,
          with an affinity roughly 200 times that of oxygen, forming carboxyhemoglobin (COHb). This reduces
          the oxygen-carrying capacity of blood.
        cell_types:
        - preferred_term: erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        biological_processes:
        - preferred_term: oxygen transport
          modifier: DECREASED
          term:
            id: GO:0015671
            label: oxygen transport
      selected_evidence:
        snippet: Once CO is inhaled it binds with hemoglobin to form carboxyhemoglobin (COHb) with an
          affinity 200 times greater than oxygen that leads to decreased oxygen-carrying capacity and
          decreased release of oxygen to tissues leading to tissue hypoxia.
        supports: SUPPORT
