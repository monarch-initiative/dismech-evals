        - path: /pathophysiology/1
          value:
            name: Impaired bicarbonate supply to mitochondrial carboxylases
            conforms_to: metabolic_intoxication_decompensation#Toxic Metabolite Accumulation and Energy
              Deficit
            description: 'Bicarbonate depletion simultaneously impairs four mitochondrial carboxylation
              reactions: carbamoyl phosphate synthetase 1 (the entry step of the urea cycle), pyruvate
              carboxylase (anaplerosis and gluconeogenesis), propionyl-CoA carboxylase, and 3-methylcrotonyl-CoA
              carboxylase (branched-chain amino acid catabolism). Reduced ureagenesis allows ammonia to
              accumulate, reduced gluconeogenesis and anaplerosis promote hypoglycemia and lactate accumulation,
              and impaired carboxylases lead to excretion of their substrates — the biochemical signature
              of the disorder unmasked by catabolic stress.

              '
            biological_processes:
            - preferred_term: urea cycle
              term:
                id: GO:0000050
                label: urea cycle
              modifier: DECREASED
            - preferred_term: gluconeogenesis
              term:
                id: GO:0006094
                label: gluconeogenesis
              modifier: DECREASED
            cell_types:
            - preferred_term: hepatocyte
              term:
                id: CL:0000182
                label: hepatocyte
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Acute hyperammonemic metabolic crisis
        description: Combined carboxylase impairment converts to an acute biochemical crisis under catabolic
          stress.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: 'Defective hepatic bicarbonate production leads to a unique combination of biochemical
          findings: hyperammonemia, elevated lactate and ketone bodies, metabolic acidosis, hypoglycemia,
          and excretion of carboxylase substrates.'
        supports: SUPPORT
