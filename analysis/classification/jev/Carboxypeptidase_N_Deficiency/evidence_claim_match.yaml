            term:
              id: MONDO:0008910
              label: carboxypeptidase N deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Antihistamine therapy
        description: Aimed at the mast-cell arm, and the evidence cuts both ways. The rationale is the
          elevated attack-time plasma histamine in the index patient and the antihistamine rescue in the
          Cpn1-null mouse. Against it, H1 antihistamines at maximal dose failed in the four reported families
          - which is what the bradykinin arm of the mechanism predicts, since nothing an H1 blocker does
          touches a B2-receptor ligand. Both results are recorded below.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: antihistamine pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: histamine H1 receptor antagonist
            term:
              id: NCIT:C29578
              label: Histamine-1 Receptor Antagonist
        notes: 'Retained rather than deleted because the two results answer different questions and both
          are worth a reader''s attention: the mouse shows histamine is a necessary mediator of acute
          anaphylatoxin-driven lethality, and the human series shows blocking H1 does not control the
          clinical syndrome. Read together they argue the bradykinin arm dominates the phenotype, which
          is why the B2-receptor antagonist below is the treatment with an actual response.'
      selected_evidence:
        snippet: This C5a-induced mortality was reduced to 20% when CPN1(-/-) mice were treated with an
          antihistamine before C5a challenge.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/0
      context_paths:
