      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24853572
      reference_title: Iatrogenic angioedema associated with ACEi, sitagliptin, and deficiency of 3 enzymes
        catabolizing bradykinin.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Quantifies the combined enzyme deficit in the reported case. Note the carboxypeptidase
