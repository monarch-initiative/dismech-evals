        association: Causative
        relationship_type: CAUSATIVE
        notes: CPN1 encodes the 55-kDa catalytic subunit. Reported alleles are a frameshift (385fsInsG)
          and missense substitutions including G178D in the index case, and c.533G>A, c.582A>G and c.734C>T
          across four later families. No homozygous null genotype has been described, and every reported
          patient retains partial enzyme activity, so the human phenotype is a hypomorphic one. CPN2,
          encoding the large subunit that protects the catalytic subunit from clearance, is a plausible
          second locus but no CPN2 disease allele has been reported.
