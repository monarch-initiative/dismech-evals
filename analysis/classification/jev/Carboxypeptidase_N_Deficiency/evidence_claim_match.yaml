      assertion:
        name: Angiotensin-converting-enzyme inhibitor and dipeptidyl-peptidase-4 inhibitor exposure
        description: Bradykinin is disposed of by more than one enzyme, and carboxypeptidase N is the
          one that dominates only at high local concentrations. A drug that blocks a parallel route therefore
          converts a latent partial deficiency into symptomatic angioedema. The reported case is instructive
          because the deficiency was present both before the drugs were started and a year after they
          were stopped, while the attacks were not.
        exposure_term:
          preferred_term: exposure to an angiotensin-converting-enzyme inhibitor or dipeptidyl-peptidase-4
            inhibitor
          term:
            id: ECTO:0000509
            label: exposure to drug
        effect: Unmasks a latent partial carboxypeptidase N deficiency
      selected_evidence:
        snippet: ACE, aminopeptidase P and carboxypeptidase N were decreased down to 17%, 42%, 64% of
          median references values
        supports: SUPPORT
