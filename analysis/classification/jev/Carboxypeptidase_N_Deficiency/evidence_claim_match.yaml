        association: Causative
        relationship_type: CAUSATIVE
        notes: CPN1 encodes the catalytic subunit. The original case carried a frameshift (historically
          385fsInsG) and p.Gly178Asp. The 2024 families include homozygous p.Gly178Asp and compound heterozygosity
          involving p.Thr245Met or synonymous p.Glu194=. The proposed splice effect of p.Glu194= is computational,
          without patient RNA confirmation. The 2024 authors report conflicting interpretation of p.Gly178Asp
          in ClinVar versus their segregation-based assessment; in-silico predictions are not equivalent
          to experimental proof. Heterozygous p.Thr245Met segregated with symptoms in one 2025 family.
          Variant-specific functional effects, penetrance and possible modifier contributions remain unresolved.
      selected_evidence:
        snippet: 'In the genomic DNA of the proband, we discovered three CPN1 variants: (1) 385fsInsG,
          a frameshift mutation in exon 1 due to a single G insertion at nucleotide 385'
