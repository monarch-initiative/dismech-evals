      reference: PMID:12560874
      reference_title: DNA polymorphism and mutations in CPN1, including the genomic basis of carboxypeptidase
        N deficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: The stated gap this paper closed; it is the study that first tied the biochemical deficiency
        to CPN1.
