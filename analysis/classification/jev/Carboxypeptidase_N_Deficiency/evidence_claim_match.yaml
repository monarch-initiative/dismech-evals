        snippet: A case is described of Angiotensin converting enzyme inhibitor (ACEi) and sitagliptin
          induced angioedema, where AO attacks decreased after the withdrawal of lisinopril but resolved
          only after the withdrawal of sitagliptin, an inhibitor of dipeptylpeptidase IV.
