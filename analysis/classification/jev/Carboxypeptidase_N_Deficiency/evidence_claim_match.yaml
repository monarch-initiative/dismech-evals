      assertion:
        name: Plasma carboxypeptidase N activity assay
        description: The diagnosis is biochemical first. Activity is reported against the laboratory's
          own median, and the reported patients fall between about a fifth and a half of it. Because the
          deficiency is partial and often latent, it is found by measuring it in someone with unexplained
          angioedema rather than by suspecting it up front.
        diagnosis_term:
          preferred_term: plasma carboxypeptidase N activity measurement
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
        notes: NCIT has no carboxypeptidase N measurement term reachable from Clinical Intervention or
          Procedure, so the binding is the laboratory-procedure ancestor and the specific assay is carried
          in preferred_term.
      selected_evidence:
        snippet: Of 172 sera from patients with chronic urticaria or angioedema, one had a remarkably
          depressed carboxypeptidase N level (21% of normal).
        supports: SUPPORT
