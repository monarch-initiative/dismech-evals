      assertion_type: AnimalModel
      assertion:
        name: Traf7 knockout mouse
        species: Mouse
        genotype: Traf7 germline and endothelial conditional knockout
        publication: PMID:37583551
        description: Traf7-deficient mouse embryos die around midgestation from loss of endothelial integrity,
          with reduced Klf2 expression, phenocopying Mekk3, Mek5 and Erk5 nulls. Endothelial deletion
          in postnatal mice causes severe cerebral haemorrhage.
        modeled_mechanisms:
        - target: Dominant-negative inhibition of wild-type TRAF7
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The null mouse establishes that TRAF7 is required for endothelial integrity through
            the MEKK3-MEK5-ERK5-KLF2 axis, but it does not model this disease's lesion.
          limitations: Complete loss of Traf7 is embryonic lethal in mouse, whereas humans heterozygous
            for a TRAF7 missense allele survive with a congenital-anomaly syndrome. The model therefore
            tests loss of function, which is the mechanism the human variant pattern argues against, and
            its severity is not comparable. No heterozygous knock-in of a recurrent human CAFDADD allele
            has been reported, so the dominant-negative mechanism modelled in this entry has no mouse
            model at all.
      selected_evidence:
        snippet: Targeted deletion of TRAF7 revealed that it is a crucial part of shear stress-responsive
          MEKK3-MEK5-ERK5 signaling pathway induced in endothelial cells by blood flow.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37583551
      reference_title: TRAF7 is an essential regulator of blood vessel integrity during mouse embryonic
