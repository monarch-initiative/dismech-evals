            term:
              id: MONDO:0032572
              label: cardiac, facial, and digital anomalies with developmental delay
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Germline TRAF7 WD40-repeat missense variant
        biological_scale: MOLECULAR
        description: A heterozygous germline missense substitution, most often in one of the seven C-terminal
          WD40 repeats. p.Arg655Gln, p.Arg524Trp and p.Phe617Leu are the recurrent alleles. The clustering
          and recurrence, and the near-absence of truncating alleles in this syndrome, are the reasons
          haploinsufficiency is not the favoured mechanism.
        genes:
        - preferred_term: TRAF7
          term:
            id: hgnc:20456
            label: TRAF7
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          allele_type: SNV
          functional_impact_category: DOMINANT_NEGATIVE
          description: DOMINANT_NEGATIVE is used because two independent sources state that the mutant
            protein interferes with the wild-type protein by heterodimerizing with it, and because the
            variant pattern argues against loss of function. Note this is the leading model rather than
            a settled fact, and the mechanism may differ by allele.
        molecular_functions:
        - preferred_term: ubiquitin protein ligase activity
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
      selected_evidence:
        snippet: Variants are predominantly within the WD40 repeats and recurrent, suggesting specific
          alterations to the protein as the pathomechanism, as opposed to haploinsufficiency.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38466850
      reference_title: The spectrum of heart defects in the TRAF7-related multiple congenital anomalies-intellectual
        disability syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: States the argument against haploinsufficiency directly. Notable because this letter
        disputes other claims by the group whose dominant-negative model is cited on the next node, so
        the two sides agree on this point.
