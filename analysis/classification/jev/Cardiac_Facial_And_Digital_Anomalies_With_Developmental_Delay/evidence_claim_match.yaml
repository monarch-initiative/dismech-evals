            term:
              id: MONDO:0032572
              label: cardiac, facial, and digital anomalies with developmental delay
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_traf7_germline_somatic_overlap_and_tumor_risk
        prompt: How do allele identity, mosaic distribution and tissue context distinguish developmental
          TRAF7 disease from tumor-associated TRAF7 alterations, and is tumor incidence increased in constitutional
          carriers?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Heterozygous TRAF7 missense variant
        - treatments#Supportive multidisciplinary care
        rationale: Germline and somatic variant spectra are largely distinct, but absolute mutual exclusivity
          is inaccurate. The 2020 cohort noted p.Arg524Trp in both syndrome patients and a meningioma
          carrying an activating SMO variant, leaving the TRAF7 contribution to that tumor uncertain.
          The 2024 p.Arg653Leu syndrome variant affects the same residue as other tumor substitutions.
          A mosaic p.Arg641Cys case combines developmental anomalies and meningiomatosis. These observations
          do not quantify tumor risk for constitutional heterozygotes. Proposed oncological follow-up
          is based on sparse observations; one reported endometrioid carcinoma occurred in a carrier of
          a coiled-coil variant of uncertain significance.
        proposed_experiments:
        - experiment_id: exp_traf7_allele_matched_interactome
          name: Side-by-side interactome comparison of germline-type and somatic-type TRAF7 alleles
          description: Express matched sets of recurrent germline (p.Arg655Gln, p.Arg524Trp, p.Phe617Leu)
            and somatic meningioma TRAF7 alleles in one cell background and compare their interactomes
            by affinity purification mass spectrometry, focusing on IFT57, CYLD, MEKK3 and NEMO, together
            with ubiquitin ligase activity and cilium assembly readouts.
          would_support:
          - discussions#gap_traf7_germline_somatic_overlap_and_tumor_risk
          supporting_outcome:
          - Reproducible allele-dependent differences would support distinct molecular effects in the
            tested system.
          refuting_outcome:
          - No detectable difference would weaken that particular assay-level hypothesis without establishing
            biological equivalence or predicting tumor risk.
          decision_criterion: Compare prespecified interaction and ciliary readouts across alleles, with
            expression matching and independent replication; interpret negative results within assay sensitivity.
        - experiment_id: exp_traf7_tumour_incidence_cohort
          name: Longitudinal tumour-incidence study in a germline TRAF7 cohort
          description: Follow an international registry cohort of individuals with confirmed germline
            TRAF7 variants with a defined imaging and clinical protocol, reporting age-specific incidence
            of meningioma, mesothelioma and other tumours against population expectation.
          supporting_outcome:
          - Excess age-specific incidence would support increased tumor susceptibility; surveillance benefit
            would still require separate assessment.
          refuting_outcome:
          - Sufficiently precise incidence estimates near population expectation would constrain the magnitude
            of possible excess risk.
          decision_criterion: Estimate age-specific risk with confidence intervals and adequate follow-up,
            separating constitutional and mosaic carriers; failure to detect an increase does not establish
            absence of risk.
      selected_evidence:
        snippet: To the best of our knowledge, there is only one syndromic variant, p.(Arg524Trp) (de
          novo or maternal mosaic in four unrelated cases here) that has also been reported in a tumor
          sample.
        supports: SUPPORT
