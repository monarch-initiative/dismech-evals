          - Indistinguishable interactomes and readouts would leave developmental timing and cell-of-origin,
            rather than allele identity, as the explanation, and would raise rather than lower the concern
            about tumour risk in germline carriers.
          decision_criterion: Allele-class-specific differences in binding partners or ciliary phenotype
            resolve the question towards distinct lesions; equivalence resolves it towards a context-dependent
            single lesion.
        - experiment_id: exp_traf7_tumour_incidence_cohort
          name: Longitudinal tumour-incidence study in a germline TRAF7 cohort
          description: Follow an international registry cohort of individuals with confirmed germline
            TRAF7 variants with a defined imaging and clinical protocol, reporting age-specific incidence
            of meningioma, mesothelioma and other tumours against population expectation.
          supporting_outcome:
          - An incidence above population expectation would convert the current expert suggestion into
            an evidence-based surveillance recommendation and would add a neoplasia phenotype to this
            entry.
          refuting_outcome:
          - Incidence indistinguishable from population expectation would support dropping routine tumour
            imaging, which currently has unknown benefit and known harms.
          decision_criterion: Age-specific incidence significantly above population expectation establishes
            excess risk; equivalence over adequate follow-up establishes its absence.
      selected_evidence:
        snippet: A novel missense variant, p.(Arg653Leu), further underscores the complex relationship
          between germline TRAF7 variants and somatic changes linked to meningiomas.
        supports: SUPPORT
