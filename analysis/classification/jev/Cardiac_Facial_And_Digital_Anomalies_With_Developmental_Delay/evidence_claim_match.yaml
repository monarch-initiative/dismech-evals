        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-negative inhibition of wild-type TRAF7
        biological_scale: MOLECULAR
        description: Mutant TRAF7 heterodimerizes with wild-type TRAF7 and inhibits its function. Independently,
          disease-causing substitutions in the coiled-coil region impair formation of the TRAF7 coiled-coil
          trimer, which gives a structural route to the same outcome for the subset of alleles that are
          not in the WD40 repeats.
      selected_evidence:
        snippet: We show that TRAF7 mutants operate in a dominant manner, inhibiting protein function
          via heterodimerization with wild-type protein.
        supports: SUPPORT
