          the intraflagellar transport protein IFT57, and cilia degrade. Knockdown of TRAF7 in Xenopus
          and zebrafish produces cardiac, craniofacial and ciliary defects, so the pathway is at least
          sufficient to generate the organ systems involved in this syndrome.
