    claim:
      about:
        disease:
          name: Cardiac, Facial, and Digital Anomalies with Developmental Delay
          disease_term:
            preferred_term: cardiac, facial, and digital anomalies with developmental delay
            term:
              id: MONDO:0032572
              label: cardiac, facial, and digital anomalies with developmental delay
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered ERK1/2 signalling in patient-derived cells
        biological_scale: MOLECULAR
        description: 'TRAF7 sits on MAP kinase signalling. In vitro, the mutations observed in the discovery
          series reduced ERK1/2 phosphorylation. Note this is not simply reduced TRAF7 activity read forward:
          wild-type TRAF7 inhibits MEK1/2, so naive loss of function would be expected to raise rather
          than lower ERK output. The direction of the measured effect is recorded here; its reconciliation
          with the pathway topology is not asserted.'
        biological_processes:
        - preferred_term: ERK1 and ERK2 cascade
          modifier: DECREASED
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
      selected_evidence:
        snippet: It is an E3 ubiquitin ligase that activates MEKK3 and KLF2/4 signaling, inhibits MEK1/2
          and c-Myb along with an NF-κβ-modulator, and stabilizes VE-cadherins in cell junctions.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41372821
      reference_title: 'TRAF7 in signaling and disease: emerging mechanisms and clinical implications.'
      evidence_source: OTHER
      explanation: Establishes the wild-type pathway topology, including that TRAF7 normally inhibits
        MEK1/2, which is the reason the description flags the direction of the ERK result as unresolved.
        Evidence source is OTHER because this is a review.
