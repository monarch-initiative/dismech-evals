      assertion_type: Pathophysiology
      assertion:
        name: Neural-crest-derived tissue maldevelopment
        biological_scale: TISSUE
        description: The craniofacial skeleton and the cardiac outflow tract both derive from neural crest,
          and TRAF7 is expressed there. This shared origin is the proposed reason a single gene produces
          a face, a heart and a skull-base tumour phenotype. It is an embryological argument supported
          by expression and by model-organism knockdown, not by lineage tracing in patient tissue.
        cell_types:
        - preferred_term: neural crest cell
          term:
            id: CL:0011012
            label: neural crest cell
        biological_processes:
        - preferred_term: neural crest cell development
          modifier: ABNORMAL
          term:
            id: GO:0014032
            label: neural crest cell development
      selected_evidence:
        snippet: Further, the shared genetics of the two disparate pathologies can be traced to the common
          origin of forebrain meninges and cardiac outflow tract from the TRAF7-expressing neural crest.
        supports: SUPPORT
