              label: cardiac, facial, and digital anomalies with developmental delay
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_traf7_inherited_variants_and_chd
        prompt: Do inherited TRAF7 variants transmitted from unaffected parents cause isolated congenital
          heart disease, or are the three reported alleles (p.Val142Met, p.Val442Met, c.1998+2T>G) not
          pathogenic?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Germline TRAF7 WD40-repeat missense variant
        - phenotypes#Congenital cardiovascular malformation
        rationale: This matters for the entry's inheritance claim. The 2023 PNAS paper reported three
          inherited TRAF7 variants in a congenital-heart-disease cohort and treated them as pathogenic,
          which would make TRAF7 disease incompletely penetrant and would extend it to isolated heart
          disease without the syndrome. A published letter disputes all three on population frequency,
          inheritance from healthy parents, the gene's tolerance of heterozygous loss of function, and
          the absence of the syndrome's typical features in those patients; the authors replied defending
          them on functional and in silico grounds. Both sides are in print and neither has withdrawn.
          This entry therefore describes the syndrome as arising predominantly de novo and does not assert
          incomplete penetrance. Note the disputed variants are also the only argument for haploinsufficiency
          in this gene, so the outcome affects the mechanism claim as well as the inheritance claim.
      selected_evidence:
        snippet: While somatic variants of TRAF7 (Tumor necrosis factor receptor-associated factor 7)
          underlie anterior skull-base meningiomas, here we report the inherited mutations of TRAF7 that
          cause congenital heart defects.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
