  09a8c86a5a1f26996b9c8f72ffebf0b0d23547421608dd18622a09a6eef2200a:
    claim:
      about:
        disease:
          name: Cardiac, Facial, and Digital Anomalies with Developmental Delay
          disease_term:
            preferred_term: cardiac, facial, and digital anomalies with developmental delay
            term:
              id: MONDO:0032572
              label: cardiac, facial, and digital anomalies with developmental delay
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_traf7_germline_somatic_mutual_exclusivity
        prompt: Why do germline TRAF7 syndrome mutations and somatic tumour mutations cluster in the same
          protein regions without ever being the same mutation, and does a germline carrier have any excess
          tumour risk?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Germline TRAF7 WD40-repeat missense variant
        - treatments#Supportive multidisciplinary care
        rationale: 'Two questions that are usually confused and should not be. The first is mechanistic:
          both mutation sets are recurrent missense changes in the C-terminal region, both are described
          as dominant-negative, and both disrupt the TRAF7-IFT57 interaction, yet reviews record that
          the two sets do not overlap and say the reason is unclear. The proposals on offer are untested:
          that the two classes drive different protein-protein interactions, or that somatic-type alleles
          are lethal in the embryo. The 2024 series reported a novel germline p.Arg653Leu adjacent to
          somatic hotspots, which sharpens rather than settles the question. The second is clinical: the
          same series calls for oncological evaluation of germline carriers, while a 2025 review keeps
          germline and somatic disease cleanly separated. No cohort study has estimated tumour incidence
          in this syndrome, so this entry records neither an excess risk nor its absence, and does not
          list tumour surveillance as an established treatment.'
        proposed_experiments:
        - experiment_id: exp_traf7_allele_matched_interactome
          name: Side-by-side interactome comparison of germline-type and somatic-type TRAF7 alleles
          description: Express matched sets of recurrent germline (p.Arg655Gln, p.Arg524Trp, p.Phe617Leu)
            and somatic meningioma TRAF7 alleles in one cell background and compare their interactomes
            by affinity purification mass spectrometry, focusing on IFT57, CYLD, MEKK3 and NEMO, together
            with ubiquitin ligase activity and cilium assembly readouts.
          would_support:
          - pathophysiology#Dominant-negative inhibition of wild-type TRAF7
          supporting_outcome:
          - A reproducible split in the interactome or in ciliary readout between the two allele classes
            would give a mechanistic reason for their mutual exclusivity and would justify treating them
            as distinct molecular lesions rather than as one lesion in two tissues.
          refuting_outcome:
          - Indistinguishable interactomes and readouts would leave developmental timing and cell-of-origin,
            rather than allele identity, as the explanation, and would raise rather than lower the concern
            about tumour risk in germline carriers.
          decision_criterion: Allele-class-specific differences in binding partners or ciliary phenotype
            resolve the question towards distinct lesions; equivalence resolves it towards a context-dependent
            single lesion.
        - experiment_id: exp_traf7_tumour_incidence_cohort
          name: Longitudinal tumour-incidence study in a germline TRAF7 cohort
          description: Follow an international registry cohort of individuals with confirmed germline
            TRAF7 variants with a defined imaging and clinical protocol, reporting age-specific incidence
            of meningioma, mesothelioma and other tumours against population expectation.
          supporting_outcome:
          - An incidence above population expectation would convert the current expert suggestion into
            an evidence-based surveillance recommendation and would add a neoplasia phenotype to this
            entry.
          refuting_outcome:
          - Incidence indistinguishable from population expectation would support dropping routine tumour
            imaging, which currently has unknown benefit and known harms.
          decision_criterion: Age-specific incidence significantly above population expectation establishes
            excess risk; equivalence over adequate follow-up establishes its absence.
      selected_evidence:
        snippet: Additionally, most reported germline and somatic mutations are recurrent across patients,
          either as germline or somatic, without overlap between mutations that occur in the germline
          versus those that are somatic. The reason somatic and germline mutations are mutually exclusive
          is unclear.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41372821
      reference_title: 'TRAF7 in signaling and disease: emerging mechanisms and clinical implications.'
      evidence_source: OTHER
      explanation: The statement of the gap in a 2025 review, including the explicit admission that the
        reason is unknown. Evidence source is OTHER because this is a review.
