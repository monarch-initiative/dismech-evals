  e2cde2f708be7ac3cb4b4d1b989b06bc154fe835b664a16e78c582522919e29a:
    claim:
      about:
        disease:
          name: Cardiac Sarcoidosis
          disease_term:
            preferred_term: cardiac sarcoidosis
            term:
              id: MONDO:0001707
              label: cardiac sarcoidosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cardiac_sarcoidosis_criteria_framework_discordance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which of the three competing cardiac sarcoidosis criteria frameworks (2014 HRS, 2016 JCS,
          WASOG) identifies the patients who actually have myocardial granulomas, given that they classify
          substantially different fractions of the same cohort?
        attaches_to:
        - pathophysiology#Myocardial Non-Caseating Granuloma Formation
        - pathophysiology#Active Granulomatous Myocardial Inflammation
        rationale: This entry curates three diagnostic frameworks because no one of them is authoritative,
          and they are not interchangeable. Applied to the same 324-patient cohort of histologically proven
          sarcoidosis with suspected cardiac involvement, the HRS consensus criteria classified 22.7%
          of women and 36.0% of men as having cardiac sarcoidosis, while the 2016 JCS criteria classified
          8.0% and 19.3% - roughly a two- to threefold difference in the same patients. Because definite
          diagnosis requires myocardial biopsy and biopsy sensitivity is low, there is no accessible gold
          standard against which to adjudicate, so the disagreement cannot currently be resolved by comparison
          to truth. This is not a curation gap in this entry; it is the defining clinical problem of the
          disease, and it propagates into every cohort-derived number curated here - prevalence, phenotype
          frequencies, and treatment-response rates all depend on which framework selected the cohort.
        proposed_experiments:
        - experiment_id: exp_cardiac_sarcoidosis_criteria_head_to_head_outcome_anchored
          name: Outcome-anchored head-to-head comparison of HRS, JCS and WASOG criteria
          description: Apply all three frameworks prospectively to a single multicentre cohort of patients
            with suspected cardiac sarcoidosis and adjudicate them not against each other but against
            hard downstream outcomes (device-detected ventricular arrhythmia, heart failure hospitalization,
            sudden cardiac death) and, where tissue becomes available through transplantation or autopsy,
            against myocardial histology. Report reclassification between frameworks and the outcome yield
            of the patients each framework uniquely captures or uniquely misses.
      selected_evidence:
        snippet: less often met criteria for a clinical diagnosis of cardiac sarcoidosis (Heart Rhythm
          Society consensus criteria, 22.7% versus 36.0%; P=0.012 and 2016 Japanese Circulation Society
          guideline criteria, 8.0% versus 19.3%; P=0.005), indicating lesser cardiac involvement
        supports: SUPPORT
    origin:
