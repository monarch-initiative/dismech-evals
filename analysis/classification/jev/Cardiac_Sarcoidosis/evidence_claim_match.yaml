          name: Cardiac Sarcoidosis
          disease_term:
            preferred_term: cardiac sarcoidosis
            term:
              id: MONDO:0001707
              label: cardiac sarcoidosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cardiac_sarcoidosis_sex_race_phenotype_modifiers
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do sex and race modify the presenting phenotype and arrhythmic risk of cardiac sarcoidosis,
          and does this reflect biology or differential ascertainment and treatment?
        attaches_to:
        - pathophysiology#Myocardial Non-Caseating Granuloma Formation
        - pathophysiology#Progressive Ventricular Dysfunction and Heart Failure
        rationale: A tertiary-center cohort of 252 patients found that women and Black patients more often
          presented with symptomatic heart failure, while male sex carried more than twice the adjusted
          hazard of ventricular arrhythmia - i.e. the same granulomatous lesion appears to distribute
          its downstream consequences differently by sex and race. Treatment also differed by group. Nothing
          in the curated mechanism explains this, and the study cannot separate a biological modifier
          of the granulomatous or fibrotic response from differences in referral, diagnosis, and management.
      selected_evidence:
        snippet: Male sex had an adjusted hazard ratio of 2.34 (95% CI 1.13, 4.80; P = 0.021) for ventricular
          arrhythmia.
        supports: SUPPORT
