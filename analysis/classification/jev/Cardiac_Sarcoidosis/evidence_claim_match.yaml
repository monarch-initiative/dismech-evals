        biological_scale: TISSUE
        description: Activated macrophages within the myocardium undergo the defining granulomatous transformations
          - differentiation into tightly packed epithelioid cells and fusion into multinucleated giant
          cells - producing compact non-caseating granulomas cuffed by lymphocytes. Distribution is characteristically
          patchy and multifocal, favouring the left ventricular free wall, the interventricular septum,
          and the right ventricle. This patchiness is directly responsible for the low sensitivity of
          endomyocardial biopsy.
        locations:
        - preferred_term: myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        - preferred_term: interventricular septum
          term:
            id: UBERON:0002094
            label: interventricular septum
