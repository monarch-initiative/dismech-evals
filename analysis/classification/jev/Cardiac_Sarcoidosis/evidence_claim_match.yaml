      assertion:
        name: WASOG Sarcoidosis Organ Assessment Instrument
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: The WASOG instrument is not a cardiac-specific guideline but an organ-involvement
          probability tool covering all sarcoidosis organs, grading each clinical manifestation as highly
          probable, probable, or possible evidence of sarcoidosis involvement in that organ. It requires
          histologic granulomatous inflammation in some other organ and exclusion of alternative causes,
          so it classifies cardiac involvement probabilistically rather than issuing a binary cardiac
          diagnosis.
        scope: Probability of sarcoidosis involvement of a given organ, including the heart
      selected_evidence:
        snippet: There are two other guideline documents, the World Association of Sarcoidosis and Other
          Granulomatous Disorders Sarcoidosis Organ (WASOG) Assessment Instrument created in 1999 and
          updated in 2014.
