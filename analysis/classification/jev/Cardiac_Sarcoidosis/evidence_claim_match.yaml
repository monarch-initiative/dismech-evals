        biological_scale: ORGANISM
        description: 'Fixed myocardial scar sustains multiple macro-re-entrant circuits. Both ventricles
          contribute: right ventricular scar is widespread and confluent (with epicardial extent exceeding
          the endocardial), while left ventricular scar is patchy. Because the substrate is structural
          rather than a primary channelopathy, arrhythmia can persist after inflammation has resolved
          on PET - which is why suppressing inflammation does not by itself abolish arrhythmic risk.'
        locations:
        - preferred_term: myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        biological_processes:
        - preferred_term: cardiac conduction
          modifier: ABNORMAL
          term:
            id: GO:0061337
            label: cardiac conduction
        - preferred_term: regulation of heart rate
          modifier: ABNORMAL
          term:
            id: GO:0002027
            label: regulation of heart rate
        notes: Deliberately NOT declared as conforming to cardiac_ion_channel_repolarization. That module
          models arrhythmia arising from an ion-channel or calcium-handling variant in a structurally
          normal heart; cardiac sarcoidosis arrhythmia is structural, arising from macro-re-entry around
          fixed granulomatous scar (PMID:25527825). Forcing conformance would misstate the mechanism.
      selected_evidence:
        snippet: Voltage maps showed widespread and confluent right ventricular scarring.
        supports: SUPPORT
