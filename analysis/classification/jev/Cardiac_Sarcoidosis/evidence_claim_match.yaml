          term:
            id: CL:0000492
            label: CD4-positive helper T cell
        biological_processes:
        - preferred_term: granuloma formation
          modifier: INCREASED
          term:
            id: GO:0002432
            label: granuloma formation
        - preferred_term: Macrophage fusion into multinucleated giant cells
          modifier: INCREASED
          term:
            id: GO:0000768
            label: syncytium formation by cell-cell fusion
        - preferred_term: inflammatory response
          modifier: INCREASED
          term:
            id: GO:0006954
            label: inflammatory response
      selected_evidence:
        snippet: Although granulomas are often composed of tight epithelioid macrophage aggregates, early
          granulomas comprise loosely associated macrophages with lymphocyte predominance.
