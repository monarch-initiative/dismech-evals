      assertion_type: Discussion
      assertion:
        discussion_id: gap_cardiac_sarcoidosis_immunosuppression_arrhythmia_mortality
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does immunosuppression in cardiac sarcoidosis reduce ventricular arrhythmia burden or
          mortality, or only recover atrioventricular conduction and stabilize left ventricular function?
        attaches_to:
        - pathophysiology#Active Granulomatous Myocardial Inflammation
        - pathophysiology#Scar-Mediated Re-entrant Ventricular Tachyarrhythmia
        rationale: 'The curated treatment chain models corticosteroids as inhibiting the active inflammatory
          node, which is well supported for AV conduction recovery and for prevention of LV functional
          deterioration. It is deliberately NOT extended to the scar-mediated arrhythmia node, because
          the systematic review of 34 publications and 1297 patients found no randomized trials and explicitly
          declined to draw conclusions for ventricular arrhythmia and mortality. This matters mechanistically:
          if arrhythmic risk is carried by fixed scar rather than by active inflammation, suppressing
          inflammation should not be expected to abolish it, and the persistence of VT after PET normalization
          is consistent with that. Curators must not add a treatment edge from immunosuppression to the
          arrhythmia node on current evidence.'
        proposed_experiments:
        - experiment_id: exp_cardiac_sarcoidosis_rct_arrhythmic_endpoints
          name: Randomized trial of immunosuppression with arrhythmic endpoints
          description: A randomized controlled trial of corticosteroid-based versus steroid-sparing immunosuppression
            in clinically manifest cardiac sarcoidosis, powered for device-detected ventricular arrhythmia
            burden and all-cause mortality rather than for imaging surrogates.
      selected_evidence:
        snippet: The data quality is too limited to draw conclusions for ventricular arrhythmias and mortality.
        supports: SUPPORT
    origin:
