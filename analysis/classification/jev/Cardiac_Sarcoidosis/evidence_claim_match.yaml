      assertion:
        name: 2016 Japanese Circulation Society (JCS) guideline criteria
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: The JCS guideline is the Japanese national framework, developed by a community that
          has led cardiac-sarcoidosis guideline work. It differs from HRS in both diagnostic thresholds
          and management triggers - for example it recommends an electrophysiological study in all patients
          with LVEF 35-50% - and it is markedly more restrictive than HRS when both are applied to the
          same cohort.
        scope: Clinical and histologic diagnosis and management of cardiac sarcoidosis
      selected_evidence:
        snippet: The 2016 JCS document is broadly similar, with the major exception that it is recommended
          that all patients with LVEF 35-50% should have an EP study.
