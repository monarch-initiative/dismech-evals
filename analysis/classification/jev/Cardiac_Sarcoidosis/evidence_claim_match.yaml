      assertion:
        name: Multifactorial susceptibility
        inheritance_term:
          preferred_term: Non-Mendelian inheritance
          term:
            id: HP:0001426
            label: Non-Mendelian inheritance
        description: Cardiac sarcoidosis is not a Mendelian disorder. It arises in genetically susceptible
          individuals as an organ-specific expression of systemic sarcoidosis, whose susceptibility is
          polygenic (HLA and non-HLA alleles); no causal gene is established for the cardiac phenotype
          specifically, and MONDO:0001707 records no causal gene relation.
      selected_evidence:
        snippet: Major progress in the care of CS awaits the key to its molecular-genetic pathogenesis
          and large-scale controlled clinical trials.
        supports: SUPPORT
