        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: The JCS guideline is the Japanese national framework, developed by a community that
          has led cardiac-sarcoidosis guideline work. It differs from HRS in both diagnostic thresholds
          and management triggers - for example it recommends an electrophysiological study in all patients
