      assertion_type: Definition
      assertion:
        name: 2014 Heart Rhythm Society (HRS) expert consensus criteria
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: The 2014 HRS international expert consensus statement is the most widely used framework
          in Europe and North America. It allows a clinical diagnosis of cardiac sarcoidosis from histologically
          proven extracardiac sarcoidosis plus a qualifying cardiac abnormality (high-grade AV block,
          ventricular arrhythmia, reduced LVEF, or characteristic CMR/FDG-PET findings), with histologic
          diagnosis reserved for myocardial biopsy. Its screening arm is symptoms plus electrocardiography
          plus conventional echocardiography.
        scope: Clinical and histologic diagnosis of cardiac involvement in sarcoidosis
      selected_evidence:
        snippet: Heart Rhythm Society (HRS) screening algorithm is commonly used and comprises the presence
          of cardiac symptoms, electrocardiography and conventional echocardiography.
        supports: SUPPORT
    origin:
