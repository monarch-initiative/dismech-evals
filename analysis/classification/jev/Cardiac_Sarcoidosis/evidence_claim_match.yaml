              label: cardiac sarcoidosis
        context: []
      assertion_type: Biochemical
      assertion:
        name: Elevated high-sensitivity cardiac troponin
        presence: Elevated
        context: High-sensitivity cardiac troponin reports ongoing cardiomyocyte injury from the active
          granulomatous lesion, and is repeatable enough to follow disease activity serially under immunosuppression.
          Cumulative troponin release after prednisolone initiation - rather than any single pre- or post-treatment
          value - predicts ventricular arrhythmia, worsening heart failure, and sudden cardiac death,
          which fits the entry's model in which the reversible inflammatory arm and the fixed scar arm
          diverge over time.
        readouts:
        - target: Active Granulomatous Myocardial Inflammation
          relationship: READOUT_OF
          direction: POSITIVE
          endpoint_context: PROGNOSTIC
          interpretation: Rising cumulative troponin reports continuing cardiomyocyte injury from the
            active granulomatous lesion this node represents.
      selected_evidence:
        snippet: Although high-sensitivity cardiac troponins may be sensitive and easily repeatable markers
          of disease activity in patients with cardiac sarcoidosis (CS), the association between longitudinal
          cardiac troponin trajectory and adverse events remains unclear.
        supports: SUPPORT
    origin:
