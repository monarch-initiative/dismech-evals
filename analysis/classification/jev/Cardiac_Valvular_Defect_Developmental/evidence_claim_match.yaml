        - name: p.Thr495fs32*
          description: Frameshift variant from the original two-family report.
          clinical_significance: PATHOGENIC
        - name: c.2882+2T>C
          description: Splice donor variant from the original two-family report.
          clinical_significance: PATHOGENIC
        - name: c.1062-59A>G
          description: Deep intronic variant that would normally be filtered out of a diagnostic pipeline.
            Transcript work on the fetus and mother showed it causes a 76-bp intronic insertion and skipping
            of exon 11, producing a frameshift and premature stop - so a non-canonical intronic PLD1 variant
            can be the second hit.
