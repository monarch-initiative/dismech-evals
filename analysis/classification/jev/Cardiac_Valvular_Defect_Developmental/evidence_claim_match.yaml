          value:
            name: Pld1 knockout mouse
            species: Mouse
            genotype: PLD1 knockout
            publication: PMID:27799408
            description: Constitutive PLD1 knockout mice were examined by echocardiography and histology.
              They reproduce the right-sided valve lesion - tricuspid regurgitation with right atrial
              enlargement, and a narrowed pulmonic valve with thickened leaflets - which is the human
              phenotype's defining topography.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Right-Sided Valve Dysplasia
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: TISSUE
        description: The knockout reproduces the right-sided distribution and, at histology, thickened
          and narrowed pulmonic leaflets - but the two sources disagree on whether it reproduces a structural
          malformation at all, which is why this is partial recapitulation rather than recapitulation.
        limitations: The delineating cohort states that no overt structural cardiac defects were noted
          in these mice, only impaired valve function on echocardiography, and calls the human-versus-mouse
          difference in severity unexplained. The original report's histology does describe narrowed,
          thickened pulmonic leaflets, so the structural claim is contested rather than absent. Either
          way the mice show nothing like the atresia, Ebstein's anomaly, right ventricular hypoplasia
          or fetal loss that dominate the patient series, and a complete null does not model the hypomorphic
          missense alleles most patients carry.
        divergences:
        - divergence_type: BOUNDARY_OMISSION
          materiality: QUALIFYING
          description: The node is a structural valve malformation, and that lesion is outside what the
            model produces. What the mice reliably show is impaired pulmonary and tricuspid valve function
            on echocardiography, with the delineating cohort reporting no overt structural defect; the
            severe structural lesions that define the human disease are absent.
        - divergence_type: SPECIES_MISMATCH
          materiality: QUALIFYING
          description: The mouse-versus-human difference in severity is explicitly unexplained in the
            literature, so the gap is not a known quantitative offset that can be corrected for when reading
            the model.
        readouts:
        - name: Tricuspid regurgitation and pulmonic valve leaflet thickening on echocardiography
          target: Right-Sided Valve Dysplasia
          direction: INCREASED
          interpretation: Structural and functional correlate of the human right-sided valve lesion.
      selected_evidence:
        snippet: Although no overt structural cardiac defects were noted, mice lacking PLD1 (36) displayed
          impaired function of the pulmonary and tricuspid valves on echocardiography
        supports: REFUTE
        directness: DIRECT
