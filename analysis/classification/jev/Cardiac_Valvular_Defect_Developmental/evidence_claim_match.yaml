      assertion:
        name: Myocardial Dysfunction
        biological_scale: TISSUE
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: 'Cardiomyopathy in PLD1 disease is recorded in two forms that must be kept apart.
          The delineating cohort associated recessive PLD1 variants with isolated neonatal cardiomyopathy
          - that is, cardiomyopathy without an accompanying structural valve defect - which is why this
          node is not drawn as a consequence of the valve lesion. Separately, dilated cardiomyopathy with
          left ventricular enlargement has been reported in older patients who also carry the valve disease,
          where a contribution from chronic valvular loading cannot be separated from a primary myocardial
          effect.

          Conforms to the primary-insult node of cardiomyopathy_maladaptive_remodeling. The module''s
          generic node lists sarcomere organization alongside muscle contraction; PLD1 is not a sarcomere
          protein and no source implicates sarcomere assembly here, so only the contraction process is
          substituted. The module''s downstream neurohormonal and remodelling chain is deliberately not
          reproduced: no source establishes it in PLD1 disease, and conforming further down would assert
          a cascade this entry cannot cite.'
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: muscle contraction
          term:
            id: GO:0006936
            label: muscle contraction
          modifier: DECREASED
      selected_evidence:
        snippet: We also associated recessive PLD1 variants with isolated neonatal cardiomyopathy.
        supports: SUPPORT
        directness: DIRECT
