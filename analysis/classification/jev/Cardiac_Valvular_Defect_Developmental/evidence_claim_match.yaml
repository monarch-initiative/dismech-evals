      assertion_type: Prevalence
      assertion:
        population: Ashkenazi Jewish population
        measure_type: BIRTH_PREVALENCE
        prevalence_class: BAND_1_5_PER_10000
        rate_per_100000: 40.0
        rate_denominator: LIVE_BIRTHS
        notes: Predicted, not observed. The figure is the homozygote frequency the authors derive from
          the p.Ile668Phe allele frequency of 2.1% in 410 PCA-defined Ashkenazim - 1 in 2,500, which is
          40 per 100,000. Two caveats follow from how it was obtained. It is a Hardy-Weinberg projection
          from an allele frequency measured in a congenital heart disease cohort rather than a count of
          patients in the population, and it covers only homozygotes for this one founder allele, so it
          omits compound heterozygotes carrying it with a second rare variant. Against that, fetal loss
          and termination are documented for this disorder, so the number of liveborn affected individuals
          would be lower than the genotype frequency predicts.
      selected_evidence:
        snippet: Among 410 PCA-defined Ashkenazim in our cohort, the overall allele frequency of p.Ile668Phe
          was 2.1%, predicting a homozygote frequency of 1 in 2,500.
        supports: SUPPORT
        directness: DIRECT
