        description: Dysplastic, thickened or atretic tricuspid and pulmonary valves, with the tricuspid
          lesion frequently taking the form of Ebstein's anomaly. The mitral valve is involved in a minority.
          This right-sided predominance is the defining feature of the entity and distinguishes it from
          the other genetically defined cardiac valvular dysplasias.
      selected_evidence:
        snippet: Patients with autosomal-recessive variants of PLD1 are predisposed to Cardiac Valvular
          Dysplasia-1 (CVDP1), which predominantly affects the right-sided heart valves, including the
          pulmonic, tricuspid, and mitral valves.
        supports: SUPPORT
