  24ed517203f72b773e98481058141698a3ea152a2e4528646a1b8c663e3b92de:
    claim:
      about:
        disease:
          name: PLD1-Related Congenital Heart Disease
          disease_term:
            preferred_term: cardiac valvular defect, developmental
            term:
              id: MONDO:0008913
              label: cardiac valvular defect, developmental
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pld1_right_sided_predominance
        kind: KNOWLEDGE_GAP
        prompt: Why is the phenotype right-sided, when phosphatidic acid is required for endothelial-to-mesenchymal
          transition in both the inflow and outflow cushions?
        attaches_to:
        - pathophysiology#Impaired Cardiac Endothelial-to-Mesenchymal Transition
        - pathophysiology#Right-Sided Valve Dysplasia
        rationale: 'The mechanism as stated is not side-specific: the cushions supply both left and right
          heart structures, so a general reduction in the transition should damage the mitral and aortic
          valves as much as the tricuspid and pulmonary ones. It does not - the mitral valve is involved
          in a minority, two of 28 phenotyped patients, and aortic involvement is reported once. Three
          candidate explanations are on record and none has been tested against the others. The delineating
          cohort''s own is that the two sides of the heart present different environments - cell populations,
          extracellular matrix, haemodynamics - so right-sided cells may be less able to compensate for
          the same disruption of EndoMT in the common cushions. The chick expression data suggest a simpler
          one: PLD1 transcription narrows specifically to the atrioventricular valves and the right ventricular
          outflow tract, making this a matter of where the gene is expressed. And the hedgehog dependence
          invoked for the arterial pole is itself regionalised. Resolving this would say whether the right-sided
          predominance is a property of the gene''s expression domain, of differential pathway dependence,
          or of differential capacity to compensate.'
        proposed_experiments:
        - experiment_id: pld1_side_resolved_endmt_assay
          name: Side-resolved transition assay across inflow and outflow cushions
          description: Quantify endothelial-to-mesenchymal transition separately in left- and right-sided
            cushion explants under graded PLD1 inhibition, to test whether the right-sided structures
            are more sensitive at equal inhibition or merely express more of the enzyme.
          would_support:
          - pathophysiology#Right-Sided Valve Dysplasia
          supporting_outcome:
          - Right-sided cushion explants lose the transition at lower degrees of PLD1 inhibition than
            left-sided explants from the same embryos.
          refuting_outcome:
          - Both sides lose the transition at the same degree of inhibition, locating the asymmetry in
            expression level rather than pathway dependence.
      selected_evidence:
        snippet: In the endocardial cushions, EndoMT provides the mesenchymal cells and remodeled matrix
          essential for the formation of both left and right heart structures
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
