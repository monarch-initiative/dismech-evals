        description: Without sufficient cushion mesenchyme and remodelled matrix, the inflow cushions
          that become the tricuspid and mitral valves and the outflow cushions that become the arterial
          valves fail to form normal leaflets. PLD1 expression in the developing chick heart narrows to
          exactly these sites - adjacent to the atrioventricular valves and the right ventricular outflow
          tract - as development proceeds.
        cell_types:
        - preferred_term: mesenchymal cell
          term:
            id: CL:0008019
            label: mesenchymal cell
        biological_processes:
        - preferred_term: endocardial cushion morphogenesis
          term:
            id: GO:0003203
            label: endocardial cushion morphogenesis
          modifier: DECREASED
        - preferred_term: heart valve morphogenesis
          term:
            id: GO:0003179
            label: heart valve morphogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: Improper morphogenesis of the endocardial cushion leads to septal and valvular abnormalities,
          which contribute to the largest proportion of congenital heart diseases (CHDs).
        supports: SUPPORT
        directness: DIRECT
