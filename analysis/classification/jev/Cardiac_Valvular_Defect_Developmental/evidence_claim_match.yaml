      assertion_type: AnimalModel
      assertion:
        name: Chick embryo PLD1 expression
        species: Chicken
        genotype: Wild type
        publication: PMID:27799408
        description: 'In situ hybridisation in the chick embryo localised PLD1 expression to the forming
          heart from E2 to E8, initially throughout the heart and later narrowing to the atrioventricular
          valves and the right ventricular outflow tract. This is an expression-mapping model, not a disease
          model: it supplies the spatial argument for where the defect acts, and does not itself produce
          a phenotype.'
        modeled_mechanisms:
        - target: Deficient Endocardial Cushion Remodelling
          relationship: MEASURES
          fidelity: UNKNOWN
          model_scale: TISSUE
          description: Maps where the gene is expressed during valvulogenesis, which is the structures
            that are malformed in patients.
          limitations: Expression is not function - the model shows where PLD1 is transcribed, not that
            cushion remodelling fails without it. It is also a non-mammalian embryo, and the authors read
            the temporal pattern as tracking developmental apoptosis, which is a different proposed mechanism
            from the endothelial-to-mesenchymal transition the main chain follows.
          readouts:
          - name: PLD1 transcript distribution in the developing heart
            target: Deficient Endocardial Cushion Remodelling
            interpretation: Localises the gene to the atrioventricular valves and right ventricular outflow
              tract, the sites of the human lesion.
      selected_evidence:
        snippet: Here we show that in chick embryos PLD1 expression is confined to the forming heart (E2-E8)
          and homogeneously expressed all over the heart during days E2-E3.
        supports: SUPPORT
        directness: DIRECT
