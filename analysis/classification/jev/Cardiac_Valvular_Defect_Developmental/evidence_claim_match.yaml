      assertion_type: Genetic
      assertion:
        name: PLD1
        gene_term:
          preferred_term: PLD1
          term:
            id: hgnc:9067
            label: PLD1
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        notes: Phospholipase D1, at 3q26.31. Biallelic loss-of-function variants are the cause of this
          disorder. Missense alleles are concentrated in the catalytic core and most reduce enzymatic
          activity directly, and nonsense, frameshift and splice alleles also occur, so the mechanism
          is loss of catalytic function. ClinGen's Congenital Heart Disease GCEP classifies the relationship
          Definitive under an autosomal recessive model, having reached the maximum genetic-evidence score;
          the record notes that further evidence exists beyond the publications it scored.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_d37e1c81-cb59-45db-9481-338149fa5064-2024-12-02T170000.000Z
        variants:
        - name: p.Ile668Phe
          description: Founder missense variant in the Ashkenazi Jewish population, at an allele frequency
            of about 2%. In a separate 5,424-proband congenital heart disease exome study, founder variants
            in GDF1 and PLD1 together accounted for most of the recessive-genotype contribution among
            Ashkenazi Jewish probands.
          clinical_significance: PATHOGENIC
          population_effects:
          - population: Ashkenazi Jewish probands with congenital heart disease
            ancestry_terms:
            - preferred_term: Ashkenazi Jewish
              term:
                id: HANCESTRO:0324
                label: Ashkenazi Jew
            ancestry_basis: GENETICALLY_INFERRED
            effect_differences:
            - ALLELE_FREQUENCY
            cohort_size: 410
            description: The variant is enriched to founder frequency in this population, so recessive
              PLD1 genotypes account for a disproportionate share of congenital heart disease there. Recorded
              as GENETICALLY_INFERRED rather than self-reported because the study defines the group by
              principal-component analysis of its own sequence data ("410 PCA-defined Ashkenazim"), not
              by reported ethnicity.
        - name: p.His442Pro
          description: Missense variant at a highly conserved site, one of the three alleles in the original
