      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pld1_apoptosis_route
        hypothesis_label: Loss of developmentally programmed apoptosis in the valve primordia
        status: EMERGING
        description: An alternative to the endothelial-to-mesenchymal transition account. The original
          report noted that the chick PLD1 expression pattern follows the known dynamic patterning of
          apoptosis in the developing heart, and read this as consistent with PLD1's established role
          in promoting apoptosis - implying the valve defect arises because sculpting apoptosis fails
          rather than because cushion mesenchyme is not generated. The two accounts are not exclusive
          and neither has been tested against the other in cardiac tissue; the entry's main chain follows
          the transition route because that is the one with a direct perturbation experiment behind it.
      selected_evidence:
        snippet: This pattern of expression follows the known dynamic patterning of apoptosis in the developing
          heart, consistent with the known role of PLD1 in the promotion of apoptosis.
        supports: SUPPORT
        directness: INDIRECT
