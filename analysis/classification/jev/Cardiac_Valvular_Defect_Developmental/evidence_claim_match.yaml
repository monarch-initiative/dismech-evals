  4074f9614772b18e8878289369141e786893a38d44a46c2333b2d731c97ed76e:
    claim:
      about:
        disease:
          name: PLD1-Related Congenital Heart Disease
          disease_term:
            preferred_term: cardiac valvular defect, developmental
            term:
              id: MONDO:0008913
              label: cardiac valvular defect, developmental
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: pld1_cardiomyopathy_primary_or_loading
        kind: KNOWLEDGE_GAP
        prompt: Is the cardiomyopathy in PLD1 disease a primary myocardial defect, or secondary to chronic
          valvular loading?
        attaches_to:
        - pathophysiology#Myocardial Dysfunction
        rationale: 'The two reported forms point in opposite directions. Isolated neonatal cardiomyopathy
          without a structural valve defect argues for a primary myocardial requirement for phospholipase
          D1, which is plausible given that the enzyme is highly expressed in the heart and that phosphatidic
          acid signalling operates in cardiomyocytes. But the dilated cardiomyopathy reported in older
          patients arrives after years of valve disease and multiple operations, where loading is an adequate
          explanation on its own. Nothing yet separates the two, and the answer changes surveillance:
          a primary myocardial effect would mean echocardiographic follow-up is indicated even in a biallelic
          carrier whose valves look normal.'
        proposed_experiments:
        - experiment_id: pld1_cardiomyocyte_specific_loss
          name: Myocardial phenotyping of PLD1-deficient hearts without valve obstruction
          description: Assess contractile function and chamber dimensions in a model in which PLD1 is
            lost in cardiomyocytes only, leaving valve development intact, so that any cardiomyopathy
            cannot be attributed to altered loading.
          would_support:
          - pathophysiology#Myocardial Dysfunction
          supporting_outcome:
          - Reduced systolic function and ventricular dilation in the absence of any valve lesion or outflow
            obstruction.
          refuting_outcome:
          - Normal contractile function and chamber dimensions throughout life when valve development
            is unaffected.
      selected_evidence:
        snippet: We also associated recessive PLD1 variants with isolated neonatal cardiomyopathy.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
