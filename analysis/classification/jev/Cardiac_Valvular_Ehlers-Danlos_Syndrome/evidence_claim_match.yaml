  a281b98de2ee0a7fea7fc0fa0ac0288bfc7e1f2531af30f0f6e33ac0b8b6be9f:
    claim:
      about:
        disease:
          name: Cardiac Valvular Ehlers-Danlos Syndrome
          disease_term:
            preferred_term: cardiac valvular Ehlers-Danlos syndrome
            term:
              id: MONDO:0009159
              label: Ehlers-Danlos syndrome, cardiac valvular type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cveds_valve_specific_mechanism_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does complete loss of the proα2(I) collagen chain damage cardiac valves while sparing
          bone, when the same gene's dominant-negative variants cause osteogenesis imperfecta?
        attaches_to:
        - pathophysiology#Progressive Cardiac Valve Matrix Failure
        - pathophysiology#Generalized Soft Tissue Laxity Without Bone Fragility
        rationale: The founding report described the valve-specific, bone-sparing outcome of complete
          proα2(I) absence as "surprising", and the tissue-selectivity has not since been mechanistically
          explained. Why an α1(I) homotrimer suffices for skeletal mineralization but not for long-term
          valve leaflet integrity is unresolved, and with only a handful of reported patients there is
          no histopathological series of affected valves to work from. This is why the causal edge from
          the absent chain to valve matrix failure is curated as indirect with unknown intermediates.
        proposed_experiments:
        - experiment_id: cveds_valve_histopathology_series
          name: Histopathology of explanted cvEDS valve tissue
          description: Collect and characterize valve tissue explanted at surgery from molecularly confirmed
            cvEDS patients, comparing collagen fibril ultrastructure and matrix composition with valves
            from non-cvEDS degenerative valve disease.
        - experiment_id: cveds_homotrimer_biomechanics
          name: Comparative biomechanics of alpha1(I) homotrimeric collagen
          description: Compare the tensile and fatigue properties of α1(I) homotrimeric versus normal
            heterotrimeric type I collagen matrices under cyclic loading that mimics valve leaflet motion
            versus static skeletal loading, to test whether cyclic-load fatigue explains the valve-selective
            failure.
      selected_evidence:
        snippet: The complete absence of pro alpha 2(I) chains has the surprising effect of producing
          cardiac valvular disease without bone involvement.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
