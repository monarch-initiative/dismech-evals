              label: Ehlers-Danlos syndrome, cardiac valvular type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: COL1A2 Null Allele and Nonsense-Mediated mRNA Decay
        biological_scale: MOLECULAR
        description: 'Biallelic COL1A2 null variants destabilize the transcript. Splice-site variants
          lead to use of cryptic splice donor sites, creating a downstream premature termination codon
          and extremely unstable mRNA; homozygous nonsense codons act directly. Either route engages the
          nonsense-mediated RNA decay pathway, so essentially no COL1A2 message survives to be translated.
          The order in which neighboring introns are removed is an important determinant of whether a
          given splice-site variant produces exon skipping or this decay-activating outcome.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: nonsense-mediated mRNA decay
          modifier: INCREASED
          term:
            id: GO:0000184
            label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
      selected_evidence:
        snippet: The splice site mutations led to use of cryptic splice donor sites, creation of a downstream
          premature termination codon, and extremely unstable mRNA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
