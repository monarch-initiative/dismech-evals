      assertion_type: Pathophysiology
      assertion:
        name: Complete Absence of proalpha2(I) Collagen Chains
        biological_scale: MOLECULAR
        description: 'Type I collagen is normally a heterotrimer of two proα1(I) chains and one proα2(I)
          chain. With no proα2(I) available, the molecule is assembled instead as an α1(I) homotrimer.
          This altered composition is detectable by SDS-PAGE analysis of collagens extracted from cultured
          skin fibroblasts, which remains a practical way to identify affected individuals.

          '
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        cellular_components:
        - preferred_term: collagen type I trimer
          modifier: ABNORMAL
