  e5334c03435e735a82f71262ffc93f29b6772afe5209444800ba23856e7f1d53:
    claim:
      about:
        disease:
          name: PRKACA-Related Cardioacrofacial Dysplasia
          disease_term:
            preferred_term: cardioacrofacial dysplasia 1
            term:
              id: MONDO:0030876
              label: cardioacrofacial dysplasia 1
        context: []
      assertion_type: Genetic
      assertion:
        name: PRKACA
        gene_term:
          preferred_term: PRKACA
          term:
            id: hgnc:9380
            label: PRKACA
        association: Causative
        relationship_type: CAUSATIVE
        features: 'PRKACA (chromosome 19p13.12) encodes the catalytic subunit alpha of cAMP-dependent
          protein kinase (PKA). Heterozygous gain-of-function variants cause autosomal-dominant cardioacrofacial
          dysplasia 1 (CAFD1, OMIM 619142): the recurrent missense c.409G>A (p.Gly137Arg) and an in-frame
          deletion c.870_878del (p.Asn290_Ile292del), both of which weaken PKA binding to its regulatory
          subunits and raise PKA activity. Truncating/loss-of-function variants do not cause CAFD1. The
          paralogous gene PRKACB causes the closely related CAFD2 (OMIM 619143) by the same mechanism.
          Distinct somatic PRKACA alterations (the DNAJB1-PRKACA fusion) cause fibrolamellar hepatocellular
          carcinoma, an unrelated entity.'
        gene_disease_validity:
        - validity_classification: MODERATE
          classified_by: CLINGEN
          external_id: CGGV:assertion_a4864f8e-3019-440b-b279-e708a77bbeb1-2026-09-02T160000.000Z
        variants:
        - name: p.Gly137Arg
          description: Recurrent missense variant (c.409G>A), the archetypal CAFD1 allele, at a conserved
            regulatory-subunit tethering surface; gain-of-function. All classically reported CAFD1 patients
            to date carry this variant.
        - name: p.Asn290_Ile292del
          description: In-frame three-amino-acid deletion (c.870_878del) in the alpha-I helix substrate-tethering
            region; reduces type-II regulatory-subunit binding and overactivates PKA, with reduced patient-cell
            ciliation. Its phenotype differs from the recurrent missense allele — the single reported
            patient had PDA/PFO rather than AVSD or polydactyly, with skeletal dysplasia plus vasculopathy
            — so it is an expanded-spectrum allele.
      selected_evidence:
        snippet: we identified heterozygous germline or mosaic missense variants in PRKACA or PRKACB.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
