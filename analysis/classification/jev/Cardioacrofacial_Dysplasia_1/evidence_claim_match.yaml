        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inhibition of Hedgehog Signaling
        biological_scale: CELLULAR
        description: 'PKA is a negative regulator of Hedgehog signaling: it phosphorylates GLI transcription
          factors (GLI3) to promote repressor processing. The CAFD1 variants keep PKA inappropriately
          active, so Hedgehog target-gene transcription is attenuated. Mutant PRKACA inhibited Hedgehog
          signaling in NIH 3T3 fibroblasts.'
        biological_processes:
        - preferred_term: Hedgehog (smoothened) signaling pathway
          modifier: DECREASED
          term:
            id: GO:0007224
            label: smoothened signaling pathway
      selected_evidence:
        snippet: When GLI3 is phosphorylated, it undergoes C-terminal processing and becomes a strong
          repressor of Hedgehog (Hh) signaling.
        supports: SUPPORT
    origin:
