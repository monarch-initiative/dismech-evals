  394b38902f744c62ecc09a6dd72be9f1889b1fa4c3daea0837e9a33563cb209e:
    claim:
      about:
        disease:
          name: PRKACA-Related Cardioacrofacial Dysplasia
          disease_term:
            preferred_term: cardioacrofacial dysplasia 1
            term:
              id: MONDO:0030876
              label: cardioacrofacial dysplasia 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PRKACA Gain-of-Function
        biological_scale: MOLECULAR
        description: Heterozygous PRKACA variants (the recurrent missense p.Gly137Arg and an in-frame
          deletion p.Asn290_Ile292del) alter the PKA catalytic subunit alpha at surfaces that tether the
          regulatory subunits, weakening that interaction so the holoenzyme is more easily activated by
          cAMP. The net effect is raised PKA pathway activity; the gain comes from loss of regulatory-subunit
          restraint (ClinGen describes the mechanism as partial loss-of-function at the protein level,
          and the in-frame-deletion protein has lower intrinsic catalytic activity) rather than from higher
          intrinsic catalysis.
        genes:
        - preferred_term: PRKACA
          term:
            id: hgnc:9380
            label: PRKACA
        molecular_functions:
        - preferred_term: cAMP-dependent protein kinase activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004691
            label: cAMP-dependent protein kinase activity
        genetic_context:
          functional_impact_category: GAIN_OF_FUNCTION
          variant_origin: GERMLINE
      selected_evidence:
        snippet: we found that they lead to PKA holoenzymes which are more sensitive to activation by
          cAMP than are the wild-type proteins.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33058759
      reference_title: Germline and Mosaic Variants in PRKACA and PRKACB Cause a Multiple Congenital Malformation
        Syndrome.
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      explanation: Functional assays show the variants increase PKA sensitivity to cAMP, the gain-of-function
        lesion.
