            term:
              id: MONDO:0015280
              label: cardiofaciocutaneous syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: BRAF Mutations
        association: Causative
        notes: 'BRAF mutations account for ~75% of CFC cases. Unlike somatic BRAF V600E mutations in cancer,
          germline CFC mutations are typically kinase-impaired but still activate the pathway through
          RAF dimerization (Q257R, E501G).

          '
      selected_evidence:
        snippet: The majority of cases (18 out of 23) are caused by mutations in BRAF, a gene frequently
          mutated in cancer. Of the 11 mutations identified, two result in amino acid substitutions that
          occur in tumors, but most are unique and suggest previously unknown mechanisms of B-Raf activation.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
