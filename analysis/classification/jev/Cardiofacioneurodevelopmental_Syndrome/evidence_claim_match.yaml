        discussion_id: ccdc32_phenotype_denominator_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the true frequency of each CFNDS feature, and what is the natural history beyond
          childhood?
        rationale: 'Fewer than ten affected individuals have been reported, in four separate papers, with
          non-uniform investigation: not every patient is documented as having had brain imaging, echocardiography
          or audiometry, so an apparent absence of a feature may be an absence of testing. No prospective
          natural history study, no survival data, no adult outcome and no population prevalence or carrier
          frequency exists. This entry therefore asserts no frequency band on any phenotype and no prevalence
          rate. The gap will close only through a multicentre case collection, which the diagnostic difficulty
          documented in PMID:41639596 suggests is likely to keep growing as RNA sequencing enters routine
          practice.'
      selected_evidence:
        snippet: So far, CFNDS has only been described in four living individuals and one terminated fetus
          from four families
        supports: SUPPORT
