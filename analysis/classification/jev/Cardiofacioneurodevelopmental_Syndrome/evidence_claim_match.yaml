  79c32da4fe361bdc89331891b7d43db4a6e55a06b55d8234276b37d0c487c75f:
    claim:
      about:
        disease:
          name: Cardiofacioneurodevelopmental Syndrome
          disease_term:
            preferred_term: cardiofacioneurodevelopmental syndrome
            term:
              id: MONDO:0030873
              label: cardiofacioneurodevelopmental syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ccdc32_ciliary_model
        hypothesis_label: Ciliary Contribution Model
        status: ALTERNATIVE
        description: The original disease report proposed that CFNDS is at least partly a ciliopathy.
          Its authors noted that several patient features overlap defects common to ciliopathies, showed
          that zebrafish ccdc32 depletion recapitulates the human phenotypes, and showed that ccdc32 is
          required for normal cilium formation in zebrafish embryos and in mammalian cell culture. The
          presence of laterality anomalies in the original families is the clinical observation that most
          strongly favours a ciliary contribution, since laterality determination is a canonical motile-cilium-dependent
          process.
        notes: 'Classified ALTERNATIVE rather than CANONICAL, and carried on a PROVISIONAL pathophysiology
          node, because the finding has not been independently replicated since 2020, its own authors
          phrased the conclusion as ciliary defects being "at least partially" involved, and none of the
          three subsequent mechanistic papers on CCDC32 examined cilia at all. The two models are not
          mutually exclusive: AP-2 and clathrin-mediated endocytosis have documented roles in ciliary
          membrane trafficking, so an endocytic primary defect could produce a secondary ciliary phenotype.'
      selected_evidence:
