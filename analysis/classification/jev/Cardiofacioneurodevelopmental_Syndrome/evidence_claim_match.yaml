              clathrin assemblies that fail to curve and invaginate. Invagination of the nascent coated
              pit is the checkpoint that determines whether a pit matures productively or aborts, so this
              is the point at which the molecular defect becomes a cell-biological one.
            biological_scale: CELLULAR
            mechanism_confidence: ESTABLISHED
            cellular_components:
            - preferred_term: Clathrin-coated pit
              term:
                id: GO:0005905
                label: clathrin-coated pit
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Deficient Clathrin-Mediated Endocytosis
        causal_link_type: DIRECT
        description: Coated pits that cannot invaginate cannot become coated vesicles, so cargo internalisation
          falls.
      selected_evidence:
        snippet: our data demonstrate the function of a novel endocytic accessory protein, CCDC32, in
          regulating CCP stabilization and invagination, critical early stages of CME
        supports: SUPPORT
