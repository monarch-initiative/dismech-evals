      assertion_type: Discussion
      assertion:
        discussion_id: ccdc32_ap2_versus_cilia
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Do the craniofacial, cardiac and brain malformations of CFNDS arise from the endocytic
          consequences of failed AP-2 assembly, from a ciliary defect, or from both?
        attaches_to:
        - pathophysiology#Defective Ciliogenesis
        - pathophysiology#Deficient Clathrin-Mediated Endocytosis
        rationale: 'The endocytic arm has by far the stronger molecular evidence: three independent structural
          and cell-biological studies published between 2024 and 2026 converge on CCDC32 being the assembly
          chaperone of AP-2, and a patient-derived truncation has been shown directly to abolish AP2 binding
          and inhibit endocytosis. The ciliary arm rests on one 2020 paper, has not been replicated, and
          was hedged by its own authors as being "at least partially" involved. But the endocytic arm
          has never been connected to a human malformation: its supporting argument for the developmental
          phenotype is the resemblance between CFNDS and mouse AP2-subunit knockouts, which is an analogy
          rather than a demonstration. Meanwhile the laterality anomalies in the founding families are
          hard to explain from endocytosis alone and are the canonical readout of motile-cilium dysfunction.
          The two models are not mutually exclusive, because clathrin-mediated endocytosis participates
          in ciliary membrane trafficking, so an endocytic primary defect could produce a secondary ciliary
          phenotype. Resolving this would require examining cilia in cells carrying a patient CCDC32 genotype,
          which no published study has done.'
        notes: Both edges into the morphogenesis node are curated as INDIRECT_UNKNOWN_INTERMEDIATES precisely
          because of this gap.
      selected_evidence:
        snippet: arguing that ciliary defects are at least partially involved in the pathomechanism of
          this disorder
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
