      assertion:
        name: Failure of AP-2 Adaptor Complex Assembly
        description: 'AP-2 is a heterotetramer of alpha, beta2, mu2 and sigma2 subunits and is the principal
          cargo adaptor of clathrin-mediated endocytosis. Its assembly is a chaperoned, ordered process:
          AAGAB first stabilises the alpha and sigma2 subunits, CCDC32 then displaces AAGAB to form an
          alpha-sigma2-CCDC32 ternary template, and that template sequentially recruits mu2 and beta2
          before CCDC32 is released. Without CCDC32 the handover cannot occur and cells lose AP-2 complexes.'
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        cellular_components:
        - preferred_term: AP-2 adaptor complex
          term:
            id: GO:0030122
            label: AP-2 adaptor complex
