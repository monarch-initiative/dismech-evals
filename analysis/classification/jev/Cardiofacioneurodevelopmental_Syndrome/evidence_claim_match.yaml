  90f76e552a2aed62eb54c95b57aebdbffe954e1327bf989465e5fec879382078:
    claim:
      about:
        disease:
          name: Cardiofacioneurodevelopmental Syndrome
          disease_term:
            preferred_term: cardiofacioneurodevelopmental syndrome
            term:
              id: MONDO:0030873
              label: cardiofacioneurodevelopmental syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ccdc32_recurrent_15q15_deletion
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Are the two large CCDC32 deletions a single recurrent allele generated by non-allelic
          homologous recombination at 15q15.1, or a founder allele, or coincidentally similar independent
          events?
        attaches_to:
        - pathophysiology#Biallelic CCDC32 Loss of Function
        rationale: 'Three of the five reported CFNDS families carry a structural deletion rather than
          a point mutation, which is an unusually high proportion for a gene this small, and two of those
          deletions have near-identical breakpoints. ClinVar records the Abdalla allele as NC_000015.10:g.40529942_40562524del
          (VCV001690313) and the Fernandes da Rocha allele as NC_000015.10:g.(40529939_40562522)del (VCV002431643)
          - a difference of 3 bp at the proximal breakpoint and 2 bp at the distal one, between patients
          ascertained independently in Egypt/Hamburg and in Porto. Two mechanisms would explain that:
          a repeat-mediated recurrent rearrangement, in which flanking low-copy repeats at 15q15.1 make
          the same deletion arise repeatedly by non-allelic homologous recombination, or a shared founder
          haplotype. The two have opposite consequences for practice. A recurrent NAHR allele would mean
          the deletion arises de novo at appreciable frequency in any population, that a targeted breakpoint
          assay would be a worthwhile first-line test worldwide, and that carrier screening cannot be
          restricted by ancestry. A founder allele would confine that reasoning to one population. Nothing
          published distinguishes them: no segmental-duplication analysis of the interval has been reported,
          neither paper reports a breakpoint junction sequence, no haplotype has been typed across the
          two families, and the difference of a few base pairs may be nothing more than differing CNV-calling
          resolution between two laboratories rather than a real difference in the alleles. Resolving
          this needs breakpoint-junction sequencing in both families plus a repeat-content analysis of
          15q15.1; both are straightforward and neither has been done.'
        notes: THIS IS A HYPOTHESIS, NOT A FINDING, AND IS CURATED AS A KNOWLEDGE GAP FOR THAT REASON.
          The breakpoint coordinates quoted in the rationale are ClinVar record fields retrieved from
          the NCBI eutils ClinVar esummary endpoint on 2026-08-01, not statements made by either publication;
          the Fernandes da Rocha report (PMID:38818818) is indexed in PubMed without an abstract and its
          full text is not in the reference cache, so no evidence item can quote its breakpoints and the
          inference is explicitly not attributed to its authors. The ClinVar coordinates for that allele
          are additionally parenthesised, which in HGVS notation means the breakpoints are uncertain -
          so the apparent 2-to-3-bp difference may not be a real difference at all. The lead was raised
          in section 4.2 of the deep-research artifact for this entry and is recorded here rather than
          dropped, with its provenance and its unresolved status stated, because it is testable and consequential.
      selected_evidence:
        snippet: 'A novel homozygous deletion in CCDC32 gene causing cardiofacioneurodevelopmental syndrome:
          the fourth patient reported.'
        supports: SUPPORT
