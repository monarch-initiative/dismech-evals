              id: MONDO:0030873
              label: cardiofacioneurodevelopmental syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Ciliogenesis
        description: An alternative, and possibly parallel, arm of the pathomechanism. Depletion of ccdc32
          in zebrafish embryos and in mammalian cell culture impairs cilium formation. Because primary
          and motile cilia govern Hedgehog signalling, left-right patterning and craniofacial neural-crest
          development, a ciliary defect would account for the laterality anomalies and for the overlap
          of the CFNDS phenotype with recognised ciliopathies.
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        biological_processes:
        - preferred_term: Cilium assembly
          term:
            id: GO:0060271
            label: cilium assembly
          modifier: DECREASED
        notes: PROVISIONAL, not ESTABLISHED. The evidence is a single 2020 paper, has not been independently
          replicated, and the three subsequent mechanistic studies of CCDC32 did not examine cilia. It
          is also unresolved whether any ciliary phenotype is a primary function of CCDC32 or a secondary
          consequence of impaired clathrin-mediated endocytosis, which is itself required for ciliary
          membrane trafficking.
      selected_evidence:
        snippet: we show that ccdc32 is required for normal cilia formation in zebrafish embryos and mammalian
          cell culture, arguing that ciliary defects are at least partially involved in the pathomechanism
          of this disorder
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
