        - preferred_term: AP-2 clathrin adaptor complex
          term:
            id: GO:0030122
            label: AP-2 adaptor complex
      selected_evidence:
        snippet: These findings demonstrate that AP2 is assembled by a handover mechanism switching from
          AAGAB-based initiation complexes to CCDC32-based template complexes.
        supports: SUPPORT
