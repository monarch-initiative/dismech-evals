      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cardiofaciocutaneous syndrome
        description: 'A RASopathy caused by heterozygous gain-of-function variants in BRAF, MAP2K1, MAP2K2
          or KRAS. It is included here primarily as a NAMING hazard rather than a close clinical mimic:
          "cardiofaciocutaneous" and "cardiofacioneurodevelopmental" differ by one word element, both
          abbreviate to a CF acronym, and a literature search or an automated entity resolver can silently
          substitute one for the other. Clinically the two do share craniofacial dysmorphism, congenital
          heart disease, growth retardation and intellectual disability, so the distinction also matters
          at the bedside. The discriminators are the ectodermal features and the inheritance pattern.'
        distinguishing_features:
        - Autosomal dominant, usually de novo, versus autosomal recessive for CFNDS
        - Caused by RAS-MAPK pathway genes (BRAF, MAP2K1, MAP2K2, KRAS), not CCDC32
        - Hyperkeratotic skin and sparse curly hair are cardinal, and have not been reported in CFNDS
        - Bilateral cleft lip and palate is the core craniofacial feature of CFNDS but is not characteristic
          of cardiofaciocutaneous syndrome
        - Pulmonic stenosis and hypertrophic cardiomyopathy are the characteristic RASopathy cardiac lesions
        disease_term:
          preferred_term: cardiofaciocutaneous syndrome
          term:
            id: MONDO:0015280
            label: cardiofaciocutaneous syndrome
        notes: Verified not to be an ancestor of MONDO:0030873. `runoak -i sqlite:obo:mondo ancestors
          MONDO:0030873` returns only MONDO:0003847 (hereditary disease), MONDO:7770008, MONDO:7770009,
          MONDO:0000001 and MONDO:0700096 above this entry, none of which is MONDO:0015280.
      selected_evidence:
        snippet: The diagnosis of CFC syndrome is established in a proband with suggestive clinical findings
          by the identification of a heterozygous pathogenic variant in BRAF, MAP2K1, MAP2K2, or KRAS
          by molecular genetic testing.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
