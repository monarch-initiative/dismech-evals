          name: Cardiofacioneurodevelopmental Syndrome
          disease_term:
            preferred_term: cardiofacioneurodevelopmental syndrome
            term:
              id: MONDO:0030873
              label: cardiofacioneurodevelopmental syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ccdc32_ap2_chaperone_mechanism
        kind: CONTROVERSY
        status: OPEN
        prompt: Is CCDC32 a transient assembly chaperone that is released before AP-2 matures, or does
          it also bind the mature complex and act at clathrin-coated pits?
        attaches_to:
        - pathophysiology#Failure of AP-2 Adaptor Complex Assembly
        - pathophysiology#Clathrin-Coated Pit Destabilization
        rationale: 'PMID:39145939 reconstituted an ordered handover in which AAGAB initiates assembly,
          CCDC32 forms a ternary template that recruits the remaining subunits, and CCDC32 is then released;
          those authors could not detect interaction between a C-terminally tagged CCDC32 and the mature
          AP2 complex. PMID:41489497 reports the opposite on that point, finding that CCDC32 binds full-length
          AP2 complexes in cells, is recruited to clathrin-coated pits, and is required for their stabilisation
          and invagination, and it notes the discrepancy explicitly. PMID:42234739 adds a third layer:
          in solution CCDC32 prevents assembly and actively disassembles AP-2 tetramers, and it is the
          presence of PIP2-containing membrane that permits assembly to complete, so the protein is proposed
          to be an inhibitor released by a membrane switch. The disagreement may be partly technical,
          since the tagging strategy differs between studies, but it is unresolved. For CFNDS the practical
          consequence is limited: on all three models, a truncation that removes the AP-2-binding helix
          is loss of function.'
      selected_evidence:
        snippet: Unexpectedly, in solution, CCDC32 prevents complex assembly and actively disassembles
          AP-2 tetramers.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
