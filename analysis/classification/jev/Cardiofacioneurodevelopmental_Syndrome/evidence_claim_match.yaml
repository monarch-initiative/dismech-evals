      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ccdc32_ap2_endocytic_model
        hypothesis_label: AP-2 Assembly Chaperone / Clathrin-Mediated Endocytosis Model
        status: CANONICAL
        description: The best-supported model is that CCDC32 is a dedicated assembly factor for the AP-2
          clathrin adaptor complex, and that loss of CCDC32 causes a cell-wide deficit in clathrin-mediated
          endocytosis which in turn disrupts the signalling and receptor-trafficking events on which craniofacial,
          cardiac and neural development depend. The model is supported by an unbiased co-essentiality
          screen that first linked the gene to AP2, by biochemical reconstitution of the AAGAB-to-CCDC32
          handover that builds AP2, by live-cell imaging showing that CCDC32 depletion destabilises clathrin-coated
          pits, and by structural work showing that CCDC32 deletion causes loss of all AP-2 subunits in
          vivo. It is further supported by the observation that all the disease alleles characterised
          to date truncate CCDC32 before the alpha-helix that mediates AP-2 binding.
      selected_evidence:
        snippet: We identified CCDC32 as another chaperone regulating AP2 assembly.
        supports: SUPPORT
    origin:
