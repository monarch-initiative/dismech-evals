          A (exon 3A) is the higher-affinity carrier expressed almost exclusively in heart, skeletal muscle,
          and diaphragm; isoform B (exon 3B) is ubiquitous. Because most reported pathogenic SLC25A3 alleles
          lie in exon 3A or its splice acceptor, the resulting carrier defect is restricted to striated
