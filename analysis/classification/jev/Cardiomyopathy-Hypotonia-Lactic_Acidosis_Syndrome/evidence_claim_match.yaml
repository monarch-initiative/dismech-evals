      assertion_type: Pathophysiology
      assertion:
        name: Substrate Limitation of ATP Synthase and Impaired Oxidative Phosphorylation
        biological_scale: MOLECULAR
        description: 'Inorganic phosphate is a substrate of ATP synthase, so matrix Pi depletion limits
          proton-motive-force-driven ATP synthesis even when the respiratory chain complexes themselves
          are intact and normally assembled. This is the biochemical signature of the disorder: patient
          muscle mitochondria show deficient ATP synthesis while respiratory-chain enzyme activities are
          normal, and the defect is present in muscle but absent in fibroblasts, tracking the exon 3A/3B
          expression pattern.'
        mechanism_confidence: ESTABLISHED
        biological_processes:
        - preferred_term: proton motive force-driven mitochondrial ATP synthesis
          term:
