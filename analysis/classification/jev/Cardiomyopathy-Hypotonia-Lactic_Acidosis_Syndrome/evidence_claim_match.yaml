            term:
              id: MONDO:0012557
              label: cardiomyopathy-hypotonia-lactic acidosis syndrome
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Molecular diagnosis by SLC25A3 sequencing
        description: Because the classical presentation - early-onset hypertrophic cardiomyopathy with
          lactic acidosis - is shared with several other mitochondrial and metabolic cardiomyopathies
          (and with infantile-onset Pompe disease), and because standard respiratory-chain enzyme panels
          and fibroblast studies are normal in this disorder, molecular sequencing of SLC25A3 is the practical
          diagnostic route. Sequencing should be considered even in isolated cardiomyopathy without myopathy
          or lactic acidosis.
      selected_evidence:
        snippet: Sequencing of SLC25A3 should be considered in patients with isolated cardiomyopathy,
          even those without generalized skeletal myopathy or lactic acidosis.
        supports: SUPPORT
