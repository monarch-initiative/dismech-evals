        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_genotype_phenotype_severity_spectrum
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines whether an individual with biallelic SLC25A3 variants dies in the first
          year of life or survives into adulthood with non-progressive hypertrophic cardiomyopathy?
        attaches_to:
        - pathophysiology#Cardiomyocyte and Skeletal Muscle Energy Deficit
        rationale: 'The reported phenotypic range is extreme for a disorder with fewer than a dozen published
          patients: the index siblings died within the first year of life, whereas patients homozygous
          for the recurrent c.158-9A>G splice allele have survived to ages 9, 17, and 32 years with non-progressive
          hypertrophic cardiomyopathy and normal cognition, and one compound heterozygote had isolated
          cardiomyopathy with normal lactate and no myopathy. Whether the determinant is residual exon
          3A transcript level, isoform-B compensation, modifier loci, or the standard of supportive care
          available at the time cannot be resolved from the published cases. The cohort is too small for
          a genotype-phenotype analysis, and no natural-history study exists.'
      selected_evidence:
        snippet: This case supports the expansion of the clinical spectrum of mitochondrial PiC deficiency
          by presenting a patient with a later-onset phenotype compared to previously reported cases.
        supports: SUPPORT
