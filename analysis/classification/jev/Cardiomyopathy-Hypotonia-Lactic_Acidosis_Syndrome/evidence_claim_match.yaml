  545fe785c513f31dfb3fee550cfd8c0d6b43a40c50d241c4cfc8db146fa4fc8d:
    claim:
      about:
        disease:
          name: Cardiomyopathy-Hypotonia-Lactic Acidosis Syndrome
          disease_term:
            preferred_term: cardiomyopathy-hypotonia-lactic acidosis syndrome
            term:
              id: MONDO:0012557
              label: cardiomyopathy-hypotonia-lactic acidosis syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_copper_cox_arm_not_seen_in_patients
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does the copper-transport / cytochrome c oxidase arm of SLC25A3 function, demonstrated
          in knockdown cell lines and reconstituted systems, actually contribute to human cardiomyopathy-hypotonia-lactic
          acidosis syndrome, given that patient muscle biopsies show normal respiratory-chain enzyme activities?
        attaches_to:
        - pathophysiology#Impaired Mitochondrial Copper Delivery and Cytochrome c Oxidase Biogenesis
        - pathophysiology#Loss of Mitochondrial Phosphate Carrier Function in Heart and Skeletal Muscle
        rationale: SLC25A3 has been shown directly, in Lactococcus lactis and reconstituted liposomes,
          to transport copper, and knockdown or deletion in murine and human cell lines produces an isolated
          cytochrome c oxidase deficiency that copper supplementation rescues. If that arm operated in
          patients, one would expect reduced COX activity in affected muscle. Instead, the patient muscle
          biopsy reported by Mayr et al. showed normal respiratory-chain enzyme activities with only the
          carrier protein reduced, and histopathology in a long-surviving adult showed mildly increased
          rather than decreased COX and SDH staining. The evidence therefore exists in a model system
          but its translational validity to human SLC25A3 disease is the open question, which is why this
          is recorded as HUMAN_MODEL_MISMATCH rather than a plain knowledge gap. Possible resolutions
          include isoform specificity (the copper work used total SLC25A3 loss, whereas most patient alleles
          ablate only isoform A), residual isoform B sufficing for copper delivery in patient muscle,
          or the copper function being dispensable in vivo.
        proposed_experiments:
        - experiment_id: exp_slc25a3_isoform_copper_cox
          name: Isoform-resolved copper transport and COX metalation assay
          description: In isogenic human iPSC-derived cardiomyocytes engineered to carry (a) an exon 3A-specific
            patient allele, (b) a total SLC25A3 knockout, and (c) the corrected genotype, quantify matrix
            copper, COX holoenzyme assembly and activity, and the response to copper supplementation.
            This directly tests whether the copper/COX arm is engaged by isoform-A-selective patient alleles
            or only by total carrier loss, reconciling the cell-line and patient-muscle observations.
          experiment_type:
            preferred_term: iPSC-derived cardiomyocyte perturbation assay
          model_systems:
          - name: Human iPSC-derived cardiomyocyte
            description: Cardiomyocytes differentiated from isogenic iPSC lines carrying exon-3A-selective
              versus total SLC25A3 loss, preserving the human isoform architecture that mouse and immortalised
              cell models do not reproduce.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: In a muscle biopsy normal activity of respiratory chain enzymes was found; however the
          amount of the mitochondrial phosphate carrier was decreased.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21763135
      reference_title: Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy
