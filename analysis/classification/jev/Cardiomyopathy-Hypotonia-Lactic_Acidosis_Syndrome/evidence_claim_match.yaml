          modifier: DECREASED
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
      selected_evidence:
        snippet: Functional investigation of intact mitochondria showed a deficiency of ATP synthesis
          in muscle but not in fibroblasts, which correlated with the tissue-specific expression of exon
          3A in muscle versus exon 3B in fibroblasts.
        supports: SUPPORT
