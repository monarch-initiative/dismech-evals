      assertion:
        name: Cardiomyocyte Hypertrophy and Ventricular Remodeling
        biological_scale: TISSUE
        conforms_to: cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling
        description: The myocardial response to chronic bioenergetic insufficiency is hypertrophic remodeling.
          In patients this is seen as hypertrophic cardiomyopathy, usually already present in the neonatal
          period; in long-term survivors it can be non-progressive. Cardiac-specific deletion of Slc25a3
          in mice reproduces the remodeling arm directly - profound hypertrophy with ventricular dilation
          and depressed cardiac function - establishing that carrier loss in cardiomyocytes is sufficient
          to cause the cardiomyopathy. This node is the disease-specific instance of the "Ventricular
          Remodeling" step of the conserved cardiomyopathy maladaptive-remodeling module. The module's
          intervening neurohormonal-activation step has not been studied in SLC25A3 deficiency and is
          deliberately not asserted here.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        locations:
