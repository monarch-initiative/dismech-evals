      assertion_type: Discussion
      assertion:
        discussion_id: gap_genotype_phenotype_severity_spectrum
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines whether an individual with biallelic SLC25A3 variants dies in the first
          year of life or survives into adulthood with non-progressive hypertrophic cardiomyopathy?
        attaches_to:
        - pathophysiology#Cardiomyocyte and Skeletal Muscle Bioenergetic Stress
        rationale: Published outcomes include infantile death, stable childhood or adult survival, and
          survival after transplantation. The recurrent splice allele itself occurs with both early death
          and longer survival. Residual transcript/protein, isoform compensation, modifiers and supportive
          treatment are plausible contributors but are not resolved by these small reports; a genotype
          alone should not be treated as prognostic.
      selected_evidence:
        snippet: This case supports the expansion of the clinical spectrum of mitochondrial PiC deficiency
          by presenting a patient with a later-onset phenotype compared to previously reported cases.
        supports: SUPPORT
