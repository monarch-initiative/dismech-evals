        name: Compensatory Glycolysis and Lactate Accumulation
        biological_scale: ORGANISM
        description: With oxidative ATP synthesis constrained, striated muscle shifts ATP production to
          anaerobic glycolysis, and the accumulating lactate spills into the circulation and produces
          the lactic acidosis that, together with hypertrophic cardiomyopathy, defines the classical neonatal
          presentation. Lactate elevation is often persistent and can remain high for decades in long-surviving
          patients even when they are clinically stable. Glycolytic byproduct accumulation has additionally
          been linked in SLC25A3-knockout cardiomyocytes to the calcium-handling imbalance that accompanies
          the hypertrophic phenotype.
