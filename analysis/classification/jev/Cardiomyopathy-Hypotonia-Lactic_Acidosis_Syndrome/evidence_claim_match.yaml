            term:
              id: MONDO:0012557
              label: cardiomyopathy-hypotonia-lactic acidosis syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC25A3 biallelic pathogenic variants
        gene_term:
          preferred_term: SLC25A3
          term:
            id: hgnc:10989
            label: SLC25A3
        features: 'SLC25A3 encodes the mitochondrial inorganic phosphate carrier. Reported disease alleles
          cluster on the muscle-specific exon 3A and its splice acceptor: a homozygous exon 3A missense
          allele (c.215G>A, p.Gly72Glu) in the Turkish index family, and a recurrent homozygous splice-region
          allele (c.158-9A>G) that creates a novel splice site and removes over 95% of the wild-type exon
          3A transcript, found in a second family, in an unrelated patient, and in a late-onset adult.
          One patient is a compound heterozygote for two novel coding variants outside exon 3A. Because
