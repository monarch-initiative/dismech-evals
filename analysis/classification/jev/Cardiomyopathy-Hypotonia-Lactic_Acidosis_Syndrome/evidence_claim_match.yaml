          name: Cardiomyopathy-Hypotonia-Lactic Acidosis Syndrome
          disease_term:
            preferred_term: cardiomyopathy-hypotonia-lactic acidosis syndrome
            term:
              id: MONDO:0012557
              label: cardiomyopathy-hypotonia-lactic acidosis syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_copper_cox_arm_not_seen_in_patients
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: How much do copper transport, phosphate supply and mitochondrial organization each contribute
          to human SLC25A3 disease across alleles and tissues?
        attaches_to:
        - pathophysiology#Reduced Mitochondrial Copper Delivery
        - pathophysiology#Impaired Cytochrome c Oxidase Biogenesis
        - pathophysiology#Reduced Mitochondrial ATP Synthesis
        rationale: 'Direct transport and copper-selective rescue establish a copper-dependent carrier
          function in models, and human G72E has been tested in engineered fibroblasts. Patient studies,
          however, use different tissues and assays: some report normal respiratory-chain activity, while
          the founding paper gives COX 81 U/g against a 90–281 reference range in one sibling, later highlighted
          by Boulet et al. as a possible mild deficiency. Increased COX histochemical staining in another
          patient is not the same measurement. These observations limit a uniform clinical COX-deficiency
          claim without refuting carrier copper transport. Residual isoforms, allele, developmental timing
          and assay conditions require matched investigation.'
        proposed_experiments:
        - experiment_id: exp_slc25a3_isoform_copper_cox
          experiment_design: TARGETED_PERTURBATION
          name: Isoform-resolved copper transport and COX metalation assay
          description: Compare isogenic human cardiomyocytes carrying G72E, the recurrent splice variant,
            shared-exon variants and corrected controls. Measure isoform abundance, phosphate flux, matrix
            copper, COX assembly and activity under matched conditions. Copper-selective rescue would
            help separate substrate effects; translation to clinical tissues requires direct validation.
          experiment_type:
            preferred_term: iPSC-derived cardiomyocyte perturbation assay
          model_systems:
          - name: Human iPSC-derived cardiomyocyte
            description: Human isogenic cardiomyocytes with patient alleles and corrected controls to
              extend existing engineered mouse-cell evidence.
            experimental_model_type: OTHER
      selected_evidence:
        snippet: In SLC25A3, the L175A mutation separates Cu and phosphate transport by fully restoring
          COX activity and mitochondrial Cu levels without rescuing phosphate transport.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
