  0b57409e0edf798a0d97ef5d06372c0cc62045d43553a3261cad9717e273e1d2:
    claim:
      about:
        disease:
          name: Cardiomyopathy-Hypotonia-Lactic Acidosis Syndrome
          disease_term:
            preferred_term: cardiomyopathy-hypotonia-lactic acidosis syndrome
            term:
              id: MONDO:0012557
              label: cardiomyopathy-hypotonia-lactic acidosis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tissue-Specific Exon 3A/3B Alternative Splicing of SLC25A3
        biological_scale: MOLECULAR
        description: The single SLC25A3 gene produces two mutually exclusive carrier isoforms by alternative
          splicing of exon 3A or exon 3B, which differ in 13 amino acids near the N-terminus. Isoform
          A (exon 3A) is the higher-affinity carrier expressed almost exclusively in heart, skeletal muscle,
          and diaphragm; isoform B (exon 3B) is ubiquitous. Because most reported pathogenic SLC25A3 alleles
          lie in exon 3A or its splice acceptor, the resulting carrier defect is restricted to striated
          muscle while other tissues retain functional isoform B. This splicing architecture is the mechanistic
          explanation for the cardiac-and-muscle-predominant phenotype and for the observation that patient
          fibroblasts, which use isoform B, have normal ATP synthesis.
        mechanism_confidence: ESTABLISHED
        gene:
          preferred_term: SLC25A3
          term:
            id: hgnc:10989
            label: SLC25A3
        biological_processes:
        - preferred_term: alternative mRNA splicing, via spliceosome
          term:
            id: GO:0000380
            label: alternative mRNA splicing, via spliceosome
        locations:
        - preferred_term: heart
          term:
            id: UBERON:0000948
            label: heart
        - preferred_term: skeletal muscle tissue
          term:
            id: UBERON:0001134
            label: skeletal muscle tissue
      selected_evidence:
        snippet: Isoform A is highly expressed in heart and skeletal muscle. Isoform B is ubiquitously
          expressed in all tissues that were examined, although at different levels.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8980128
      reference_title: Tissue-specific expression of the two isoforms of the mitochondrial phosphate carrier
        in bovine tissues.
      evidence_source: MODEL_ORGANISM
      explanation: Northern blot analysis establishes the tissue-restricted expression of the exon IIIA
        isoform in heart and skeletal muscle. Evidence source is MODEL_ORGANISM because the measurements
        were made in bovine, not human, tissue.
