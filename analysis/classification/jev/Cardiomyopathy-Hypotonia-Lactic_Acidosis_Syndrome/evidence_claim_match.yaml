        biological_scale: MOLECULAR
        description: Biallelic SLC25A3 variants reduce the amount and/or transport activity of the inorganic
          phosphate carrier in the inner mitochondrial membrane of cardiomyocytes and skeletal myofibres.
          The Turkish index family carried a homozygous missense allele in exon 3A (p.Gly72Glu); other
          families carry a homozygous splice-acceptor allele (c.158-9A>G) that creates a novel splice
          site and eliminates more than 95% of the wild-type exon 3A transcript, and one patient is a
          compound heterozygote for two novel coding alleles. Muscle biopsy in affected children shows
          reduced carrier protein.
        mechanism_confidence: ESTABLISHED
