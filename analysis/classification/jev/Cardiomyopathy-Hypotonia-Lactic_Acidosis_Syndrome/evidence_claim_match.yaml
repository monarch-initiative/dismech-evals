      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mitochondrial Copper Delivery and Cytochrome c Oxidase Biogenesis
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: 'Beyond phosphate, SLC25A3 has been shown in cell and reconstituted systems to transport
          copper into the mitochondrial matrix, supplying the labile copper pool required to metalate
          cytochrome c oxidase (complex IV). Knockdown or deletion of SLC25A3 in cultured cells causes
          an isolated COX deficiency that is rescued by copper supplementation, and restoring the carrier
          restores matrix copper delivery. Whether this second transport function contributes to the human
          disease is unresolved: patient muscle biopsies have shown normal respiratory-chain enzyme activities,
          so the copper/COX arm is recorded here as a provisional mechanism rather than an established
          component of the patient phenotype (see the HUMAN_MODEL_MISMATCH discussion).'
        biological_processes:
        - preferred_term: copper ion transmembrane transport
          term:
            id: GO:0035434
            label: copper ion transmembrane transport
          modifier: DECREASED
        - preferred_term: respiratory chain complex IV assembly
          term:
            id: GO:0008535
            label: respiratory chain complex IV assembly
          modifier: DECREASED
        chemical_entities:
        - preferred_term: copper
          term:
            id: CHEBI:28694
            label: copper atom
          modifier: DECREASED
      selected_evidence:
        snippet: SLC25A3 knockdown or deletion consistently resulted in an isolated COX deficiency in
          these cells, and copper addition to the culture medium suppressed these biochemical defects.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
