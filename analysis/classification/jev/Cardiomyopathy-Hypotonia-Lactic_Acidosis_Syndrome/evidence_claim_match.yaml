          term:
            id: UBERON:0002349
            label: myocardium
        biological_processes:
        - preferred_term: cardiac muscle hypertrophy
          term:
            id: GO:0003300
            label: cardiac muscle hypertrophy
          modifier: INCREASED
      selected_evidence:
        snippet: mice lacking Slc25a3 in the heart serve as a novel model of metabolic, mitochondrial-driven
          cardiomyopathy
        supports: SUPPORT
