        biological_processes:
        - preferred_term: ATP metabolic process
          term:
            id: GO:0046034
            label: ATP metabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: The critical dependence on mitochondria as an energy source is especially evident in
          tissues with high-energy demands such as the heart, muscle; defects in the mitochondrial energy
          production machinery underlie a wide range of primary mitochondrial disorders that present with
          cardiac and muscle diseases.
        supports: SUPPORT
