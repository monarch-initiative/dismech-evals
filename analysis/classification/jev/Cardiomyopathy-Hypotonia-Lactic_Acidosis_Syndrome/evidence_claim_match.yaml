  361625cc43dd8ea753c339b21b895bc848552b329d6fd129646544260e105606:
    claim:
      about:
        disease:
          name: Cardiomyopathy-Hypotonia-Lactic Acidosis Syndrome
          disease_term:
            preferred_term: cardiomyopathy-hypotonia-lactic acidosis syndrome
            term:
              id: MONDO:0012557
              label: cardiomyopathy-hypotonia-lactic acidosis syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC25A3 biallelic pathogenic variants
        gene_term:
          preferred_term: SLC25A3
          term:
            id: hgnc:10989
            label: SLC25A3
        features: 'SLC25A3 encodes the mitochondrial inorganic phosphate carrier. Reported disease alleles
          cluster on the muscle-specific exon 3A and its splice acceptor: a homozygous exon 3A missense
          allele (c.215G>A, p.Gly72Glu) in the Turkish index family, and a recurrent homozygous splice-region
          allele (c.158-9A>G) that creates a novel splice site and removes over 95% of the wild-type exon
          3A transcript, found in a second family, in an unrelated patient, and in a late-onset adult.
          One patient is a compound heterozygote for two novel coding variants outside exon 3A. Because
          the ubiquitous exon 3B isoform is retained in the exon 3A alleles, the biochemical defect is
          restricted to heart and skeletal muscle.'
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        variants:
        - name: SLC25A3 c.215G>A (p.Gly72Glu), exon 3A
          description: 'The first reported SLC25A3 disease allele: a homozygous missense variant in the
            muscle-specific exon 3A, identified in two sisters from a non-consanguineous Turkish family
            who both died within the first year of life. Pathogenicity was confirmed by yeast complementation.'
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: SLC25A3
            term:
              id: hgnc:10989
              label: SLC25A3
        - name: SLC25A3 c.158-9A>G (IVS2-9A>G), exon 3A splice acceptor region
          description: A recurrent homozygous intronic variant immediately 5' of the muscle-specific exon
            3A. It creates a novel splice site and abolishes more than 95% of the wild-type transcript.
            First reported in a family with three affected children, subsequently found in an unrelated
            patient with neonatal cardiomyopathy and in a woman who survived to age 32 with hypertrophic
            cardiomyopathy and myopathy - making it the allele most clearly associated with the milder,
            longer-surviving end of the phenotypic spectrum.
          clinical_significance: PATHOGENIC
          gene:
            preferred_term: SLC25A3
            term:
              id: hgnc:10989
              label: SLC25A3
        - name: SLC25A3 c.599T>G (p.Leu200Trp) and c.886_898delinsCAGATAC (p.Gly296_Ser300delinsGlnIlePro)
          description: Two novel coding variants found in a compound heterozygous patient with neonatal
            cardiomyopathy but no skeletal myopathy and no elevated lactate. Protein structure analysis
            indicated both are likely pathogenic. These lie outside exon 3A, so they affect both carrier
            isoforms; the patient nonetheless presented with isolated cardiomyopathy.
          clinical_significance: LIKELY_PATHOGENIC
          gene:
            preferred_term: SLC25A3
            term:
              id: hgnc:10989
              label: SLC25A3
      selected_evidence:
        snippet: Variants in the SLC25A3 gene, which codes for the mitochondrial phosphate transporter
          (PiC), lead to a failure of inorganic phosphate (Pi) transport across the mitochondrial membrane,
          which is required in the final step of oxidative phosphorylation.
        supports: SUPPORT
