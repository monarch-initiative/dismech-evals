        limitations: 'A knockdown in a fish, not the human nonsense allele in a mammal, and the readout
          is larval cardiac function rather than the adult-onset dilated cardiomyopathy of the reported
          family. Morpholino knockdown also depletes the protein globally, so a cardiomyocyte-autonomous
          interpretation is not established: VEZF1 is primarily a vascular-development factor and an endothelial
          contribution to the cardiac phenotype has not been excluded.'
        readouts:
