      assertion_type: Treatment
      assertion:
        name: Cascade Genetic Testing and Surveillance of At-Risk Relatives
        description: The highest-yield action this entity supports, and the one most specific to it. Once
          the familial variant is known, first-degree relatives can be tested directly; a relative of
          a carrier has a 50% prior, and on the single available pedigree penetrance was complete, so
          a genotype-positive relative should be assumed to be at risk rather than reassured. Genotype-positive
          relatives then need longitudinal cardiac surveillance so that ventricular dysfunction is caught
          before it presents as heart failure or sudden death, and genotype-negative relatives can be
          released from it.
        treatment_term:
          preferred_term: cascade genetic testing and genetic counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
        target_phenotypes:
        - preferred_term: Dilated cardiomyopathy
          term:
            id: HP:0001644
            label: Dilated cardiomyopathy
        notes: Carries no `target_mechanisms`. Testing and surveillance are diagnostic and monitoring
          actions, not therapeutic ones acting on a pathograph node. Note also that the complete penetrance
          figure comes from one pedigree and should not be quoted to a family as a general penetrance
          estimate.
      selected_evidence:
        snippet: relatives of a proband with DCM to inform cardiac surveillance and allow early detection
          and treatment of DCM to improve long-term outcome
        supports: SUPPORT
