      assertion:
        name: VEZF1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: VEZF1 (vascular endothelial zinc finger 1)
          term:
            id: hgnc:12949
            label: VEZF1
        notes: 'The only gene attributed to this entity, and the attribution rests on one family. There
          is no ClinGen gene-disease validity assertion for VEZF1 in any cardiomyopathy, no second reported
          family, and no case series. The supporting evidence is strong for a single-family report (segregation
          at complete penetrance, absence from 200 unrelated DCM patients, 400 controls, dbSNP, HGMD and
          gnomAD, plus a reporter assay showing loss of transactivation) but it is exactly the shape of
          evidence that a gene curation panel would classify as Limited or Moderate rather than Definitive.
          Treat the gene-disease relationship as provisional.


          VEZF1 has substantial independent cardiovascular biology that makes the attribution biologically
          plausible rather than merely statistical: it was characterized first as a regulator of vasculogenesis
          and angiogenesis, it represses the antiangiogenic factor Cited2 in endothelial cells, and its
          expression falls in diseased human myocardium.'
        variants:
        - name: VEZF1 c.490A>T p.(Lys164*)
          description: The only reported disease allele. A nonsense change truncating the protein at codon
            164, heterozygous, segregating with dominant DCM through one family at complete penetrance.
            It was absent from 200 unrelated DCM patients, 400 unrelated healthy individuals, dbSNP, HGMD
            and gnomAD, which is a stronger absence argument than most single-family alleles carry.
          gene:
            preferred_term: VEZF1
            term:
              id: hgnc:12949
              label: VEZF1
          clinical_significance: LIKELY_PATHOGENIC
          type: nonsense
      selected_evidence:
        snippet: Vascular endothelial zinc finger 1 (Vezf1), is a Krüppel-like zinc finger protein that
          plays a vital role in vascular development.
        supports: SUPPORT
