      assertion_type: Pathophysiology
      assertion:
        name: VEZF1 Nonsense Variant Abolishes Transcriptional Transactivation
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: PROVISIONAL
        conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
        description: 'The initiating lesion is a heterozygous nonsense variant, c.490A>T p.(Lys164*),
          truncating vascular endothelial zinc finger 1 partway through the protein. VEZF1 is a zinc-finger
          transcription factor, so the functional consequence is measured as a loss of transactivation
          rather than as a structural defect: in a dual-luciferase reporter system the mutant protein
          failed to drive the promoters of MYH7 and ET1, both of which are already implicated in dilated
          cardiomyopathy. This is why the entity sits apart mechanistically from the sarcomeric members
          of the numbered series, where the lesion is in the contractile machinery itself.'
        genes:
        - preferred_term: VEZF1
          term:
            id: hgnc:12949
            label: VEZF1
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity of VEZF1
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: DECREASED
        genetic_context:
          gene:
            preferred_term: VEZF1
            term:
              id: hgnc:12949
              label: VEZF1
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous germline nonsense allele. Only one such allele has been reported,
            in a single family.
      selected_evidence:
        snippet: 'In this investigation, whole-exome sequencing and bioinformatics analyses were conducted
          in a family suffering from DCM, and a novel heterozygous mutation in the VEZF1 gene (coding
          for a zinc finger-containing transcription factor critical for cardiovascular development and
          structural remodeling), NM_007146.3: c.490A > T; p.(Lys164*), was identified.'
        supports: SUPPORT
