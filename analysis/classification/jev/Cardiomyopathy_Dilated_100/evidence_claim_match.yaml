      assertion_type: Discussion
      assertion:
        discussion_id: vezf1_cardiomyocyte_autonomous_or_vascular
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is the cardiac phenotype cardiomyocyte-autonomous, or does it arise partly through VEZF1's
          better-established role in the vasculature?
        attaches_to:
        - pathophysiology#Reduced Transcription of Cardiomyocyte Contractile and Growth Targets
        - pathophysiology#Impaired Cardiomyocyte Contractile Function and Compensatory Growth
        rationale: 'This entry models the disease as a cardiomyocyte transcription-factor defect, because
          that is what the two direct measurements support: the human variant fails to transactivate MYH7,
          and the zebrafish work identifies cardiomyocyte Myh7 as the key target with an MCAT box and
          TEAD-1 as partner. But VEZF1 was characterized first, and is still best characterized, as a
          vascular-development factor. It is required for endothelial differentiation, and it represses
          the antiangiogenic factor Cited2 in endothelial cells. The zebrafish experiment is a whole-organism
          knockdown and the human allele is germline, so neither excludes an endothelial or microvascular
          contribution to the cardiac phenotype. Distinguishing these is not a technicality: a myocyte-autonomous
          transcriptional defect and a microvascular developmental defect predict different natural histories
          and different things about whether the myocardium can be supported.'
        proposed_experiments:
        - experiment_id: vezf1_conditional_knockout_lineage
          name: Compare cardiomyocyte-restricted and endothelial-restricted Vezf1 loss
          description: Generate cardiomyocyte-specific and endothelial-specific conditional Vezf1 knockouts
            and compare cardiac growth, contractile reserve and Myh7 expression. If the myocyte-restricted
            animal reproduces the phenotype the cardiomyocyte-autonomous model in this entry is correct;
            if only the endothelial-restricted or the combined animal does, the pathograph needs an endothelial
            node.
      selected_evidence:
        snippet: We further identify a key role for an MCAT binding site in the Myh7 promoter regulating
          the response to Vezf1 knockdown and show that TEAD-1 is a binding partner of Vezf1.
        supports: SUPPORT
