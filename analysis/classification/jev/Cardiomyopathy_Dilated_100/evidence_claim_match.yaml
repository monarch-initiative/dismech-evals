          target: Impaired Cardiomyocyte Contractile Function and Compensatory Growth
          direction: DECREASED
          interpretation: Blunted inotropic reserve is the functional signature of the contractile deficit
            and indicates the defect emerges under load.
        - name: Cardiomyocyte calcium transient kinetics
          target: Impaired Cardiomyocyte Contractile Function and Compensatory Growth
          direction: UNCHANGED
          interpretation: A genuine negative result. Intact calcium handling excludes excitation-contraction
            coupling as the site of the lesion and places it downstream, at the contractile apparatus.
