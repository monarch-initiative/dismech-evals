        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: vezf1_dcm_gene_validity
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is VEZF1 established as a dilated cardiomyopathy gene, or is this still a single-family
          candidate?
        attaches_to:
        - pathophysiology#VEZF1 Nonsense Variant Abolishes Transcriptional Transactivation
        rationale: 'The whole entity rests on one report of one family with one nonsense allele, plus
          a dual-luciferase assay. The supporting evidence is good of its kind: segregation at complete
          penetrance, absence from 200 unrelated DCM patients, 400 controls, dbSNP, HGMD and gnomAD, and
          a measured loss of transactivation at two DCM-relevant promoters. But there is no second family,
          no case series, and no ClinGen gene-disease validity assertion for VEZF1 in any cardiomyopathy.
          On the ClinGen framework this is the shape of evidence that would classify as Limited or at
          most Moderate, not Definitive. That matters for how a VEZF1 variant found on a research exome
          should be reported, and it is why the trigger and its two downstream nodes carry `mechanism_confidence:
          PROVISIONAL` while the final structural node, which is generic dilated cardiomyopathy, does
          not.'
        proposed_experiments:
        - experiment_id: vezf1_dcm_cohort_replication
          name: Look for further VEZF1 loss-of-function alleles in DCM cohorts
          description: Query large sequenced familial dilated cardiomyopathy cohorts for rare VEZF1 loss-of-function
            alleles and test segregation. VEZF1 is absent from most established cardiomyopathy gene panels,
            so replication requires exome or genome data rather than panel data, and the absence of further
            reports since 2023 may reflect that nobody has looked rather than that nobody has found.
      selected_evidence:
        snippet: In this investigation, whole-exome sequencing and bioinformatics analyses were conducted
          in a family suffering from DCM
        supports: SUPPORT
    origin:
