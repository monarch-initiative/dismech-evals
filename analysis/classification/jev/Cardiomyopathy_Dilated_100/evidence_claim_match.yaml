          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: Gene ontology enrichment analysis indicates that Vezf1 regulates cardiac muscle contraction
          and dilated cardiomyopathy related genes and we identify cardiomyocyte Myh7/β-MHC as key target
          for Vezf1.
        supports: SUPPORT
    origin:
