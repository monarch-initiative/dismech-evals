        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmd2c_small_evidence_base
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How secure are the gene-disease relationship, the phenotype spectrum and the genotype-phenotype
          rule, given 12 patients in eight families?
        attaches_to:
        - genetic#PPCS
        - phenotypes#Hypotonia
        - phenotypes#Rhabdomyolysis
        rationale: 'The PPCS link rests on three clinical reports, and family B appears in two of them.
          Three of the families share the same p.Glu233Val allele. The causal case is coherent: segregation,
          patient-cell protein and CoA reduction with genetic rescue, yeast complementation and a fly
          hypomorph. ClinGen has not curated it. The proposed rule that exon 3 variants cause DCM only
          while exon 1 and 2 variants add neuromuscular and metabolic disease is exploratory and based
          on n=12. Extracardiac features such as dysmorphism, cutis laxa and PAH come from single patients
          and may be coincidental.'
        proposed_experiments:
        - experiment_id: exp_cmd2c_natural_history_registry
          experiment_design: HUMAN_OBSERVATIONAL
          name: Natural history registry with exome reanalysis
          description: Pool unsolved pediatric DCM and fatty-acid-oxidation-like crisis cases with normal
            ACADVL testing for PPCS reanalysis. Follow genotyped patients prospectively with standardized
            cardiac, neuromuscular and metabolic phenotyping to test the exon-based genotype-phenotype
            rule.
      selected_evidence:
        snippet: in contrast the p.Glu233Val variant leads to an isolated DCM presentation with variable
          expressivity, suggesting that different clinical presentations may be related to the position
          of the mutations within the gene.
        supports: SUPPORT
        directness: INDIRECT
