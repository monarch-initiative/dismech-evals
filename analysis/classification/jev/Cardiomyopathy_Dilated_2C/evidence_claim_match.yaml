  3a4c8ba3450e8282c708c659c12fabc6234ee83e8d7a85df0fa51edf89e414a6:
    claim:
      about:
        disease:
          name: Cardiomyopathy Dilated 2C
          disease_term:
            preferred_term: cardiomyopathy, dilated, 2c
            term:
              id: MONDO:0032592
              label: cardiomyopathy, dilated, 2c
        context: []
      assertion_type: Treatment
      assertion:
        name: Pantethine supplementation
        description: Oral pantethine enters the CoA pathway downstream of PPCS and so bypasses the defective
          step. It has been given as compassionate treatment to four patients at about 10-24 mg/kg/day.
          Family B siblings started it as adolescents and adults after cardiac damage. One improved (EF
          36% to 48%) and the other stayed stable; the 2018 authors saw no significant clinical improvement.
          F6:IV.1 died at 21 of SARS-CoV-2 complications after four years on pantethine, with cardiac
          function reported stable through the infection. F1:II has had no rhabdomyolysis since starting
          it and has low-normal LV function. F5:IV.1 recovered full LV function, but she was also on a
          beta-blocker and ACE inhibitor and had an ICD. After starting pantethine, F1:II began excreting
          3-methylcrotonylglycine; he carries a homozygous MCCC1 variant of uncertain significance, and
          the significance of this is unclear. No controlled data exist, and every treated patient also
          received standard care, so benefit cannot be attributed to pantethine alone. In vitro, pantethine
          raises CoA in patient cells and partly rescues cardiomyocyte phenotypes. It also rescues viability
          in dPPCS hypomorph flies.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: pantethine
            term:
              id: CHEBI:31959
              label: pantethine
      selected_evidence:
        snippet: CoA biosynthesis can occur with pantethine as a source independent from PPCS, suggesting
          pantethine as targeted treatment for the affected individuals still alive.
        supports: SUPPORT
        directness: INDIRECT
    origin:
