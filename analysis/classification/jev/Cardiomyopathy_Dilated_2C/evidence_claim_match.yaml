        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmd2c_cardiac_coa_and_tissue_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does a ubiquitous CoA-synthesis defect damage mainly the heart, and is cardiac CoA
          actually depleted in patients?
        attaches_to:
        - pathophysiology#Cellular Coenzyme A Deficiency
        - pathophysiology#Impaired Long-Chain Fatty Acid Oxidation
        - pathophysiology#Cardiomyocyte Energy Deficit
        rationale: CoA has been measured only in fibroblasts and iPSC-derived cells, never in patient
          or animal myocardium. The fatty-acid-activation and energy-deficit steps are inferred from acylcarnitines
          and from the authors' reasoning about cardiomyocyte metabolism. Fasting respiratory quotient
          in two patients showed normal whole-body fat oxidation. Proposed explanations include greater
          fatty-acid dependence of maturing cardiomyocytes, tissue-specific PPCS isoforms and cysteine
          toxicity; none has been tested.
        proposed_experiments:
        - experiment_id: exp_cmd2c_cardiomyocyte_acylcoa_flux
          experiment_design: TARGETED_PERTURBATION
          name: Acyl-CoA profiling and fatty-acid flux in patient cardiomyocytes
          description: Measure free CoA, acetyl-CoA and long-chain acyl-CoA pools, and run 13C-palmitate
            oxidation and Seahorse respirometry in day-60 patient and isogenic-corrected iPSC cardiomyocytes,
            with and without pantethine. Test whether the energy deficit precedes sarcomere disorganization.
      selected_evidence:
        snippet: However, considering the ubiquitous presence of the enzymatic PPCS activity, it remains
          unexplained why the brain and in general the other organs are not affected in PPCS-deficient
          individuals.
        supports: SUPPORT
        directness: DIRECT
