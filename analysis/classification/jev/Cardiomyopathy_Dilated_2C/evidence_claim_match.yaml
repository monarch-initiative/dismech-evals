          Engineered heart patches have a shortened effective refractory period and more arrhythmic events.
          Pantethine reduces both. These in vitro findings are a plausible substrate for the ventricular
          fibrillation and cardiac arrests seen in patients. The shortened refractory period in vitro
          does not mirror the QT prolongation seen in some patients, so this node is not linked to Prolonged
          QT Interval.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: We also detected arrhythmic events in 42% of CMs from patient 95595 and 54% of CMs from
          patient 103596, which were reduced to 26% and 24%, respectively, bypantethine treatment
        supports: SUPPORT
        directness: DIRECT
