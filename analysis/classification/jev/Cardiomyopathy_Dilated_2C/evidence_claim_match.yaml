        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Do the available models capture the human disease well enough to support the cellular
          nodes of the mechanism?
        attaches_to:
        - pathophysiology#Cardiomyocyte Contractile Dysfunction
        - pathophysiology#Cardiomyocyte Arrhythmogenicity
        rationale: No mammalian Ppcs model exists. The fly hypomorph lowers expression rather than destabilizing
          the protein, and fly heart-tube kinematics are a loose proxy for DCM. The iPSC cardiomyocyte
          data come from two patient lines, one clone each, without isogenic controls, in immature cells.
          The cellular nodes are therefore PROVISIONAL, not ESTABLISHED.
        proposed_experiments:
        - experiment_id: exp_cmd2c_knockin_mouse
          experiment_design: TARGETED_PERTURBATION
          name: Ppcs p.Glu233Val knock-in mouse
          description: Generate a homozygous knock-in of the recurrent human allele and measure cardiac
            CoA, acylcarnitines and echocardiographic function under fasting and infection-like stress,
            with and without dietary pantethine.
      selected_evidence:
        snippet: PPCS-deficiency is a relatively new disease with unclear pathogenesis and no targeted
          therapy.
        supports: SUPPORT
        directness: INDIRECT
