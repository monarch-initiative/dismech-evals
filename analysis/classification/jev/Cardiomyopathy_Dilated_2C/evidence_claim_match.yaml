          sites. The 2018 dried-blood-spot profiles of the index patients showed low long-chain acylcarnitines
          (C16, C18) with a raised C0/(C16+C18) ratio, resembling CPT1 deficiency. That fits the authors'
          proposal that less cytosolic CoA means fewer activated long-chain acyl-CoAs. In contrast, the
          2025 table records acylcarnitines as elevated in six patients. During crises F1:II and F4:II
          showed a VLCADD-like C14:1/C14:2 pattern, elevated long-chain acyl species and dicarboxylic
          aciduria, which suggests a block downstream of activation. Against a fixed systemic defect,
          the fasting respiratory quotient in two family B siblings was consistent with normal fat oxidation,
          and acylcarnitines were normal when patients were well. Acyl-CoA pools and fatty-acid flux have
          not been measured in patient cells or heart.
        biological_processes:
        - preferred_term: long-chain fatty acid metabolic process
          modifier: DECREASED
          term:
            id: GO:0001676
            label: long-chain fatty acid metabolic process
        - preferred_term: fatty acid beta-oxidation
          modifier: DECREASED
          term:
            id: GO:0006635
            label: fatty acid beta-oxidation
      selected_evidence:
        snippet: Acylcarnitine profiles in dried blood spots of the probands revealed normal levels of
          free carnitine (C0) but relatively low concentrations of long chain acylcarnitines C16 and C18,
          leading to an elevated ratio C0/(C16+C18) and reduced ratio (C16+C18:1)/C0 (Table 2).
        supports: SUPPORT
        directness: INDIRECT
