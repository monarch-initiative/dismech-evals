  22ff5952583d1244eb7d51c2b7ea347cef0baaa1133b5db02fca71ee7e6d0e4a:
    claim:
      about:
        disease:
          name: Cardiomyopathy Dilated 2C
          disease_term:
            preferred_term: cardiomyopathy, dilated, 2c
            term:
              id: MONDO:0032592
              label: cardiomyopathy, dilated, 2c
        context: []
      assertion_type: AnimalModel
      assertion:
        name: dPPCS1 hypomorphic Drosophila
        species: Drosophila melanogaster
        genotype: dPPCS1/dPPCS1 homozygous; P-element insertion in the 5' UTR of CG5629 that lowers dPPCS
          expression
        publication: PMID:29754768
        description: Homozygous hypomorphic dPPCS flies have reduced viability. Their pre-pupal hearts
          show higher heart rate and arrhythmia index, more wall shortening and shorter systolic length.
          Dietary pantethine rescues viability; vitamin B5 was used as a control. Null dPPCS alleles are
          lethal at the first larval instar. The allele is not a patient allele, and fly CoA levels were
          not reported in this study.
        modeled_mechanisms:
        - target: Cardiomyocyte Contractile Dysfunction
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Altered contraction parameters in the fly heart tube, which the authors take as
            analogous to dilated cardiomyopathy.
          limitations: The Drosophila heart is a tubular organ without chambers, so ejection fraction
            or dilation cannot be measured. The allele lowers dPPCS expression rather than reproducing
            a patient missense change. Cardiac function after pantethine was not reported.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Heart-tube kinematics in pre-pupae are a proxy for human ventricular systolic
              function.
