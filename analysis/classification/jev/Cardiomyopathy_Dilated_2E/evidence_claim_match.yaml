          description: A homozygous single-nucleotide insertion producing a stop codon, found in consanguineous
            Iranian families with neonatal dilated cardiomyopathy and confirmed by segregation analysis.
            The first loss-of-function JPH2 allele described in disease.
      selected_evidence:
        snippet: Previously, missense variants in JPH2 have been linked to hypertrophic cardiomyopathy;
          however, pathogenic "loss of function" (LOF) variants have not been described.
