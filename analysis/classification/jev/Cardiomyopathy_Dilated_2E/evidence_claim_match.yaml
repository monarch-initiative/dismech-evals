      assertion:
        name: Failure of Junctional Membrane Complex Assembly
        biological_scale: CELLULAR
        description: 'Without junctophilin-2 the t-tubule sarcolemma and the junctional sarcoplasmic reticulum
          are not held together, so the dyad does not assemble and the distance between the two membranes
          becomes variable. The lesion is geometric: nothing about either channel is altered, they are
          simply no longer reliably apposed.'
        cellular_components:
        - preferred_term: T-tubule
          modifier: ABNORMAL
          term:
            id: GO:0030315
            label: T-tubule
        - preferred_term: sarcoplasmic reticulum
          term:
            id: GO:0016529
            label: sarcoplasmic reticulum
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: JPH2 deficiency resulted in loss of excitation-contraction coupling gain, precipitated
          by a reduction in the number of junctional membrane complexes and increased variability in the
          plasmalemma-sarcoplasmic reticulum distance.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
