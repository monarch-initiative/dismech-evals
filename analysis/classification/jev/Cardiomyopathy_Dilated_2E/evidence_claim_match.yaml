      assertion:
        name: Hypertrophic Cardiomyopathy 17
        description: Dominant JPH2 hypertrophic cardiomyopathy has a predominantly hypertrophic phenotype
          and a different allelic mechanism. Inheritance, ventricular geometry, segregation, and variant-level
          interpretation distinguish it from recessive CMD2E; missense versus truncating status alone
          is insufficient.
        distinguishing_features:
        - Predominant ventricular hypertrophy rather than a primary dilated phenotype.
        - Usually heterozygous disease-associated variants with dominant inheritance; confirm the variant-specific
          relationship.
      selected_evidence:
        snippet: In analyzing the 24 probands described in the studies, we found that autosomal recessive,
          loss-of-function variants are associated with severe, early onset DCM, while autosomal dominant
          missense variants are associated with a wider range of cardiac disease, including HCM, arrhythmia,
          SCD, and cardiac conduction disease.
        supports: SUPPORT
