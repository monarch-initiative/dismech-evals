          8.34-Mb inversion interrupting intron 5 and separating the coding transcript from its 3-prime
          UTR. Proteomic downregulation and reduced UTR-containing transcripts supported the authors'
          biallelic interpretation. This is preliminary single-patient evidence, not a validated diagnostic
          workflow or proof of a particular RNA-decay mechanism. The proband presented at age 10-15 years,
