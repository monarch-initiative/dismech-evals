      assertion_type: Pathophysiology
      assertion:
        name: JPH2 Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic loss-of-function JPH2 alleles remove junctophilin-2. The reported recessive
          alleles are truncating: a homozygous single-nucleotide insertion producing p.E641* in consanguineous
          Iranian families, and a nonsense allele in a Finnish childhood cardiomyopathy kindred. This
          is the axis that separates CMD2E from the dominant JPH2 disease, which runs on missense alleles
          that alter the protein''s regulation of the ryanodine receptor rather than removing it.'
        genes:
        - preferred_term: JPH2
          term:
            id: hgnc:14202
            label: JPH2
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Family-based genetic analysis of GME individuals with cardiomyopathic disease identified
          an Iranian patient with dilated cardiomyopathy (DCM) as a carrier of a novel, homozygous single
          nucleotide insertion in JPH2 resulting in a stop codon (JPH2-p.E641*).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
