        role: trigger
        mechanism_confidence: PROVISIONAL
        description: Reported pathogenic alleles are nonsense or frameshift variants (p.Arg197Ter, p.Arg390Ter
          and p.His7ThrfsTer5 in Japanese families; p.Lys149AsnfsTer6 in a Middle Eastern family), carried
          homozygously or in compound heterozygosity. The gene-disease link rests on about seven families,
          so the trigger is graded provisional rather than established.
        genes:
        - preferred_term: BAG5
          term:
            id: hgnc:941
            label: BAG5
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          allele_type: nonsense and frameshift
          description: Most reported patients are homozygous; two Japanese patients are reported, secondhand,
            as compound heterozygous for p.Arg197Ter and p.Arg390Ter. Loss of function is inferred from
            the truncating allele class, absent Bag5 protein in a knock-in mouse, and reduced BAG5 immunostaining
            in patient myocardium.
      selected_evidence:
        snippet: Subsequently, Inoue et al. reported two unrelated cases of DCM caused by compound heterozygous
          truncating variants in BAG5.
        supports: SUPPORT
        directness: DIRECT
