              label: cardiomyopathy, dilated, 2F
        context: []
      assertion_type: Genetic
      assertion:
        name: BAG5
        gene_term:
          preferred_term: BAG5
          term:
            id: hgnc:941
            label: BAG5
        variant_origin: GERMLINE
        association: 'Autosomal recessive DCM gene supported by about seven families: four Japanese families
          (five homozygous patients) in the founding report, two unrelated compound-heterozygous Japanese
          patients known here only from a secondhand summary, and one consanguineous Middle Eastern family
          with three affected genotyped siblings. Two recurrent nonsense alleles (p.Arg197Ter, p.Arg390Ter)
          appear in several Japanese families.'
        notes: ClinGen classifies BAG5 for the broader term dilated cardiomyopathy (MONDO:0005021), autosomal
          recessive, Moderate (2024-06-14). Because that record is not for MONDO:0030680 or an exact-match
          term, gene_disease_validity is left empty. relationship_type is left unset because the schema
          defines CAUSATIVE as ClinGen Definitive or Strong, and ClinGen rates BAG5 Moderate (AR) under
          the parent term. The 2026 ClinGen DCM panel reassessment lists BAG5 among newly assessed high-evidence
          genes, a category that includes Moderate. Heterozygous truncating BAG5 variants were also reported
          in three patients with tachycardia-induced cardiomyopathy; that is a separate, unconfirmed susceptibility
          claim and not part of CMD2F.
      selected_evidence:
        snippet: we identified that homozygous truncating mutations in the gene encoding Bcl-2–associated
          athanogene (BAG) co-chaperone 5 (BAG5) caused inherited DCM in five patients among four unrelated
          families with complete penetrance.
        supports: SUPPORT
        directness: DIRECT
