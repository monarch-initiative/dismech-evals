  8927521587fa296f60620539b05c1b40ce8241fdd7b65728210c68d8bd32a07a:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 2G
          disease_term:
            preferred_term: cardiomyopathy, dilated, 2G
            term:
              id: MONDO:0030887
              label: cardiomyopathy, dilated, 2G
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Thin-Filament Length
        biological_scale: MOLECULAR
        role: effector
        description: 'Leiomodin-2 nucleates and elongates actin at the pointed end of the sarcomeric thin
          filament, setting its length. Losing it dysregulates thin-filament length, which changes the
          extent of thin-thick filament overlap available for cross-bridge formation. This is a geometric
          lesion unique within the series: the motor, its calcium regulation, its scaffold and its quality-control
          machinery are all intact, but the filament they act on is built to the wrong specification.
          Patient-derived iPSC-cardiomyocytes and a mouse model carrying the homologous mutation both
          show this dysregulation.'
        cell_types:
        - preferred_term: Cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: Sarcomere Organization
          term:
            id: GO:0045214
            label: sarcomere organization
          modifier: ABNORMAL
        - preferred_term: Actin Filament Organization
          term:
            id: GO:0007015
            label: actin filament organization
          modifier: ABNORMAL
        cellular_components:
        - preferred_term: Actin thin filament
          term:
            id: GO:0005884
            label: actin filament
      selected_evidence:
        snippet: we discovered dysregulated actin-thin filament lengths, altered contractility and calcium
          handling properties
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
