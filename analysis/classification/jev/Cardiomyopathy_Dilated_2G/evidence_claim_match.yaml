      assertion_type: Pathophysiology
      assertion:
        name: Nonsense-Mediated LMOD2 Transcript Decay
        biological_scale: MOLECULAR
        description: Nonsense-mediated decay lowers mature LMOD2 mRNA carrying W398Ter or Arg513Ter in
