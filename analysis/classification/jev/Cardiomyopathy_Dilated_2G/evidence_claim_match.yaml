        gene_term:
          preferred_term: LMOD2
          term:
            id: hgnc:6648
            label: LMOD2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_d19140d6-8200-4fce-9906-fdda527a4f7e-2026-03-04T170000.000Z
        notes: Established alleles include c.1193G>A (p.Trp398Ter), c.1537C>T (p.Arg513Ter), c.1243_1244delCT
          (p.Leu415ValfsTer108), and c.273+1G>A. Homozygosity and compound heterozygosity are both documented.
          The Leu415 frameshift preserves more mutant protein in minigene assays than the two studied
          nonsense alleles. The same Trp398Ter allele has neonatal and four-month presentations, so onset
          cannot be inferred from genotype alone. No population penetrance estimate is established.
      selected_evidence:
        snippet: Exome sequencing identified a homozygous LMOD2 variant in both siblings, (GRCh38)chr7:g.123656237G
          > A; NM_207163.2:c.273 + 1G > A, ablating the donor 5' splice-site of intron-1.
        supports: SUPPORT
