              label: cardiomyopathy, dilated, 2H
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: which_ta_substrate_drives_the_heart_phenotype
        kind: KNOWLEDGE_GAP
        prompt: Which tail-anchored protein substrates, among the many depleted by GET3 loss, actually
          account for the cardiac phenotype?
        attaches_to:
        - pathophysiology#Impaired Tail-Anchored Protein Insertion
        - pathophysiology#Disrupted Cardiomyocyte Membrane Trafficking and Proteostasis
        rationale: 'The index paper narrows this considerably: inspecting the predicted human tail-anchored
          proteome it names seven already associated with human cardiomyopathy - DMPK, DYSF, EMD, JPH2,
          PLN (printed as PPLA in the source), SYNE1 and SYNE2. So the gap is not that no candidates exist
          but which of that shortlist is rate-limiting. There is also a partial negative result to work
          against: emerin localized correctly to the nuclear membrane in patient myocardium, though nuclei
          were irregularly shaped, which argues against emerin mislocalization being the proximate lesion.
          Tail-anchored proteins are roughly 5% of integral membrane proteins and the mouse work reports
          reduced expression of multiple substrates collectively, so the shortlist is where the question
          becomes tractable.'
      selected_evidence:
        snippet: 'revealed 7 proteins of interest that have been associated with cardiomyopathy in humans:
          DMPK (myotonin-protein kinase; Q09013), DYSF (dysferlin; O75923), EMD (emerin; P50402), JPH2
          (junctophilin-2; Q9BR39), PPLA (cardiac phospholamban; P26678), SYNE1 (nesprin-1; Q8NF91), and
          SYNE2 (nesprin-2; Q8WXH0).'
        supports: SUPPORT
    origin:
