        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Tail-Anchored Protein Insertion
        description: GET3/ASNA1 is the central ATP-dependent chaperone that receives tail-anchored proteins
          from the BAG6/UBL4A/TRC35 pre-targeting complex and delivers them to the WRB/CAML receptor in
          the endoplasmic reticulum membrane. Losing it both destabilizes that pre-targeting complex and
          reduces the expression of multiple tail-anchored substrates. Tail-anchored proteins are roughly
          5% of integral membrane proteins, which is why a single chaperone defect has such broad downstream
          consequences.
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: tail-anchored membrane protein insertion into ER membrane
          term:
            id: GO:0071816
            label: tail-anchored membrane protein insertion into ER membrane
          modifier: DECREASED
      selected_evidence:
        snippet: ASNA1 (also known as TRC40 or GET3) serves as the central ATP-dependent chaperone delivering
          TA proteins to the endoplasmic reticulum (ER) membrane.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41370295
      reference_title: ASNA1 is essential for cardiac development and function by regulating tail-anchored
        protein stability and vesicular transport in cardiomyocytes.
      evidence_source: MODEL_ORGANISM
