  c63d7157fb2932432c3221359137a5ff34fac16431aa4fce35ddcb4692dac8e5:
    claim:
      about:
        disease:
          name: Cardiomyopathy Dilated 2H
          disease_term:
            preferred_term: cardiomyopathy, dilated, 2H
            term:
              id: MONDO:0859358
              label: cardiomyopathy, dilated, 2H
        context: []
      assertion_type: Genetic
      assertion:
        name: GET3
        notes: 'Biallelic variants in GET3 (HGNC-approved symbol; long known as ASNA1 and also called
          TRC40), encoding the central ATP-dependent targeting factor of the GET/TRC tail-anchored protein
          insertion pathway. The reported genotype is three variants across two alleles, not two: c.867C>G
          p.(Cys289Trp) and c.913C>T p.(Gln305*) in cis on the paternal allele, and c.488T>C p.(Val163Ala)
          on the maternal allele. The cis pairing matters - Cys289 is part of an essential zinc-binding
          site, so the paternal allele is doubly compromised rather than simply truncated. All three were
          absent from gnomAD v2.0.2, and the index paper cites a pLI of 0.92 from that release as evidence
          of loss-of-function intolerance. Treat that number as version-bound: current gnomAD gives a
          much lower pLI for this gene, so the constraint estimate has moved between releases and only
          the v2.0.2 value should be attributed to the paper. Note that the entire published human literature
          uses the ASNA1 symbol.'
        gene_term:
          preferred_term: GET3
          term:
            id: hgnc:752
            label: GET3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: The c.488T>C variant on the maternal allele results in a valine to alanine substitution
          at residue 163 (p.Val163Ala).
        supports: SUPPORT
