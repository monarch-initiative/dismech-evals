  e25d7184328beea12ac41631d6b031d70b3b9763cdf0cabdf7486a8d38c06fab:
    claim:
      about:
        disease:
          name: Cardiomyopathy Dilated 2H
          disease_term:
            preferred_term: cardiomyopathy, dilated, 2H
            term:
              id: MONDO:0859358
              label: cardiomyopathy, dilated, 2H
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic GET3 Loss of Function
        description: 'Three variants across two alleles, not two. The paternal allele carries c.867C>G
          p.(Cys289Trp) and c.913C>T p.(Gln305*) in cis; the maternal allele carries c.488T>C p.(Val163Ala).
          The cis pairing matters mechanistically: Cys289 is part of an essential zinc-binding site, so
          the paternal allele is doubly compromised rather than simply truncated. Reduced protein abundance
          was demonstrated directly in patient myocardium and skin fibroblasts. The maternal missense
          allele leaves protein present but misfolded. Notably the premature stop codon does not trigger
          nonsense-mediated decay - wild-type and mutant transcripts were present in equal amounts - so
          the truncated protein is made.'
        biological_scale: MOLECULAR
        genetic_context:
          zygosity: COMPOUND_HETEROZYGOUS
          variant_origin: GERMLINE
          allele_type: nonsense and missense
          functional_impact_category: LOSS_OF_FUNCTION
          description: 'Three variants across two alleles: c.867C>G p.(Cys289Trp) and c.913C>T p.(Gln305*)
            in cis on the paternal allele, c.488T>C p.(Val163Ala) on the maternal. The premature stop
            escapes nonsense-mediated decay, so truncated protein is made rather than cleared.'
        molecular_functions:
        - preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The c.913C>T variant on the paternal allele is predicted to result in a premature stop
          codon p.(Gln305*), and likely explains the decreased protein expression observed in myocardial
          tissue and skin fibroblasts.
        supports: SUPPORT
    origin:
