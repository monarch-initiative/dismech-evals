        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: RNA sequencing analysis of CAP2-KO hearts and isolated cardiomyocytes revealed overactivation
          of fetal genes, including serum response factor-regulated (SRF-regulated) genes such as Myl9
          and Acta2 prior to the emergence of cardiac disease.
        supports: SUPPORT
        directness: DIRECT
