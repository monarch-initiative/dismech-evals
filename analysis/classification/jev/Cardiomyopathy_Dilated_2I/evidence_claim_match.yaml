        status: OPEN
        prompt: Is dilated cardiomyopathy a cardiomyocyte-autonomous consequence of CAP2 loss, or does
          it require loss in other cell types?
        attaches_to:
        - animal_models#Cardiomyocyte-specific Cap2 knockout mouse
        - pathophysiology#Impaired Myocardial Contractility
        rationale: The 2015 study found that cardiomyocyte-specific knockout mice die of complete heart
          block before significant DCM, whereas the 2019 study from the same group reports robust DCM
          in the conditional line and used it for the SRF-inhibitor experiment. The difference may reflect
          timing, background or how DCM was assessed.
      selected_evidence:
        snippet: We found that the mice developed CCD, leading to sudden cardiac death from complete heart
          block, but no longer developed DCM or the other phenotypes, including sex bias.
        supports: SUPPORT
        directness: DIRECT
