      assertion:
        name: MRTF-SRF Pathway Activation
        description: Cap2 knockout hearts show nuclear accumulation of MRTFB and activation of SRF-dependent
          and fetal genes such as Myl9, Acta2 and Nppa before overt cardiac disease. An SRF inhibitor
          reduced these targets and delayed disease in cardiomyocyte-specific knockout mice, supporting
          a contributory rather than initiating role. In mouse embryonic fibroblasts, CAP2 loss instead
          reduces basal nuclear MRTF-A and SRF activity, so the direction of the effect depends on cell
          type. This has not been measured in patients. GO:0045944 is bound because GO has no SRF-specific
          process term.
        biological_scale: CELLULAR
        role: modulator
        mechanism_confidence: PROVISIONAL
        biological_processes:
