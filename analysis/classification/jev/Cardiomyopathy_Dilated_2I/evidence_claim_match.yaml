        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mouse_human_extracardiac_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Why do Cap2 knockout mice show male-biased lethality, microphthalmia and growth failure
          that are not reported in patients?
        attaches_to:
        - animal_models#Cap2 whole-body knockout mouse
        - animal_models#Cap2 gene-trap mouse
        rationale: Whole-body knockout mice resemble the contiguous 6p22 deletion syndrome, whereas the
          founding patients reproduce the cardiac features only. Some mouse extracardiac features may
          reflect species differences or background effects. Human sex differences cannot be assessed
          with five patients.
      selected_evidence:
        snippet: CAP2 knockouts resembled patients with 6p22 syndrome in that mice were smaller and they
          developed microphthalmia and cardiac disease.
        supports: SUPPORT
        directness: DIRECT
