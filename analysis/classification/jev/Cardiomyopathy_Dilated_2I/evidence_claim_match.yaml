              label: cardiomyopathy, dilated, 2I
        context: []
      assertion_type: Genetic
      assertion:
        name: CAP2
        gene_term:
          preferred_term: CAP2
          term:
            id: hgnc:20039
            label: CAP2
        variant_origin: GERMLINE
        association: Autosomal recessive cause of pediatric dilated cardiomyopathy supported by homozygous
          loss-of-function variants in four families (five genotyped patients), patient-cell loss-of-function
          studies and concordant mouse models. The human evidence is limited to a few families, and there
          is no ClinGen gene-disease validity classification.
        notes: Reported alleles (NM_006366) are an exon 7 donor splice-site variant (Bedouin family; exact
          HGVS not in the cached abstract), a homozygous nonsense allele in a Pakistani family (reported
          as p.Tyr316Ter in panel curation; not stated in the cached text), c.1288delT p.Cys430fs, and
          c.551G>A p.Trp184Ter. The symbol CAP2 was formerly also used for SERPINB8, and "CAP2" is also
          the name of an unrelated left atrial appendage closure registry; this entry refers only to cyclase-associated
          protein 2 (hgnc:20039). relationship_type is left unset because no ClinGen or other external
          tier classifies CAP2 for this disease, and the schema reserves CAUSATIVE for Definitive or Strong
          relationships.
      selected_evidence:
        snippet: Using exome sequencing and searching for rare homozygous variations, we identified a
          nucleotide change in the donor splice consensus sequence of exon 7 in CAP2 as the causative
          mutation.
        supports: SUPPORT
        directness: DIRECT
    origin:
