      assertion_type: Discussion
      assertion:
        discussion_id: srf_direction_cell_type
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does CAP2 loss activate or suppress MRTF-SRF signaling in human cardiomyocytes?
        attaches_to:
        - pathophysiology#MRTF-SRF Pathway Activation
        rationale: Knockout mouse hearts show MRTFB nuclear accumulation and SRF target activation, whereas
          knockout mouse embryonic fibroblasts show reduced nuclear MRTF-A and SRF activity. No measurement
          exists in patient cardiomyocytes or iPSC-derived cardiomyocytes, although such cells have been
          generated from one patient.
      selected_evidence:
        snippet: In summary, our data revealed that in MEFs CAP2 controls basal MRTF-A localization and
          SRF activity, while it was dispensable for serum-induced nuclear MRTF-A translocation and SRF
          stimulation.
        supports: SUPPORT
        directness: DIRECT
