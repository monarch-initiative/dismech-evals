      assertion_type: Pathophysiology
      assertion:
        name: Reduced Flightless-I Function in Cardiomyocytes
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'Flightless-I is a member of the gelsolin superfamily and was first described as
          a regulator of actin dynamics; it also localises at cell-adhesion sites. In the heart that combination
          gives it several jobs at once, and the three edges out of this node are the three the defining
          paper measured, with a fourth added from independent mouse work.

          The authors'' own summary of what the protein turned out to be doing is worth keeping intact
          rather than paraphrasing: Flii dysfunction affects the structural components of the ventricular
          myocardium - myofibrils and cell adhesion complexes - *and* dysregulates DCM-related signalling
          pathways during ventricular chamber morphogenesis. This is not a protein with one downstream
          consequence.'
        biological_processes:
        - preferred_term: actin filament organization
          modifier: DECREASED
          term:
            id: GO:0007015
            label: actin filament organization
        cell_types:
