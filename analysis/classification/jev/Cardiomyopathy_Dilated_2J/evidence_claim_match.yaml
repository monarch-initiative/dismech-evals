      assertion_type: Pathophysiology
      assertion:
        name: Defective Ventricular Trabeculation
        biological_scale: TISSUE
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'Trabeculation is how the embryonic ventricle builds the muscular complexity it needs
          before a coronary circulation exists. In flii mutant zebrafish it fails: the patient-mimicking
          line has less organised, more primitive trabeculae, and the severe truncating line has almost
          none, together with cardiomyocytes extruding toward the abluminal side of the ventricle.

          This node is why CMD2J reads as a morphogenetic disease rather than a degenerative one. A ventricle
          that never trabeculated properly starts life with a structural deficit, which is consistent
          with presentation at two to five months rather than in later childhood.'
        biological_processes:
        - preferred_term: heart morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0003007
            label: heart morphogenesis
      selected_evidence:
        snippet: we provided insights into the function of Flii during ventricular chamber morphogenesis
          in vivo, including myofibril organization and cardiomyocyte cell adhesion, as well as trabeculation
        supports: SUPPORT
        directness: DIRECT
