            term:
              id: MONDO:0957984
              label: cardiomyopathy, dilated, 2j
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic FLII Variants
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'The initiating lesion. Four variants were found across the three families: one predicted
          to introduce a premature stop codon, three missense changes at highly conserved residues. All
          were absent from gnomAD or present at very low frequency in the heterozygous state.

          The authors expected the mechanism to be hypomorphic rather than null, and that expectation
          is load-bearing for the whole entry: complete loss of FLII function is embryonic-lethal in Drosophila,
          zebrafish and mouse, so a viable human recessive disease has to involve alleles that leave some
          protein working. The zebrafish modelling is built around that distinction, with the patient-mimicking
          knock-ins compared against a pre-existing severe truncating line.'
        genes:
        - preferred_term: FLII
          term:
            id: hgnc:3750
            label: FLII
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: Curated as partial rather than complete loss of function on the authors' own reasoning
            - null FLII is embryonic-lethal across three model species, and these patients are alive with
            a cardiac-restricted phenotype - and on the zebrafish result that the patient-mimicking alleles
            give a milder phenotype than the severe truncating line. Note this is an inference about the
            alleles' consequence, not a direct measurement of residual flightless-I protein in a patient.
      selected_evidence:
        snippet: 1 of the variants was predicted to result in a premature stop codon, and the other 3
          variants were missense, affecting highly conserved amino acids
        supports: SUPPORT
        directness: DIRECT
