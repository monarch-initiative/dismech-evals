        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or Genome Sequencing in Idiopathic Early-Onset Dilated Cardiomyopathy
        description: 'CMD2J is reached by broad sequencing in an infant with idiopathic dilated cardiomyopathy,
          not by clinical suspicion: the phenotype has no feature that points at FLII specifically. Two
          of the three families were found by family-based whole-exome sequencing, and the third by the
          same approach in a non-consanguineous family.

          Two practical points for a laboratory encountering a novel FLII variant. The absence of extracardiac
          features is informative - it argues against the syndromic and metabolic causes that dominate
          the infantile dilated cardiomyopathy differential. And the parents should be screened echocardiographically
          as well as genotyped: in all three families the heterozygous parents were clinically unaffected,
          which is the observation that supports a recessive interpretation of a novel biallelic genotype.'
      selected_evidence:
        snippet: No additional extracardiac features were detected.
        supports: SUPPORT
        directness: DIRECT
