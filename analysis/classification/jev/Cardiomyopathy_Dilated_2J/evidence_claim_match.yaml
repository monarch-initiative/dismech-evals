              id: MONDO:0957984
              label: cardiomyopathy, dilated, 2j
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Dilated cardiomyopathy 2G (LMOD2)
        description: 'Worth separating out from the general differential, because the two entities are
          mechanistically linked rather than merely adjacent. LMOD2 lengthens sarcomeric thin filaments;
          flightless-I, in mouse, sets their length with tropomodulin-1, and leiomodin-2 overexpression
          partially rescues cardiac Flii deletion. Both present as severe early-onset recessive dilated
          cardiomyopathy.

          Clinically they separate on course rather than on presentation: CMD2G is frequently lethal in
          the first weeks to months, whereas all three CMD2J patients were alive and stable or improved
          at two to nine years. That is three patients against a small series, so it is a difference to
          watch rather than a rule.'
      selected_evidence:
        snippet: Indeed, overexpression of leiomodin-2 in the heart, which lengthens the actin-containing
          thin filaments, partially rescued disease due to heart-specific deletion of Flii.
        supports: SUPPORT
        directness: DIRECT
