      assertion_type: Genetic
      assertion:
        name: FLII
        gene_term:
          preferred_term: FLII
          term:
            id: hgnc:3750
            label: FLII
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'FLII encodes flightless-I, a gelsolin-superfamily actin-remodelling protein with an N-terminal
          leucine-rich repeat domain and C-terminal gelsolin-like domains. Four alleles are reported across
          the three families: one predicted premature stop, three missense changes at conserved residues,
          all rare or absent in gnomAD.

          Reading the FLII literature needs one distinction held firmly. There are two separate genetic
          claims about FLII and the heart, and conflating them would misstate both. This entry - CMD2J
          - is the recessive, biallelic, infantile disease. Separately, a common FLII variant, R1243H,
          was associated with cardiac remodelling in genome-wide association studies and studied in mice;
          that is a population-level risk allele acting in the heterozygous state, not a cause of CMD2J.
          Both bodies of work are cited here, and only the first establishes this entity.

          Two of the three families were previously published in a consanguineous pediatric-cardiomyopathy
          cohort, where FLII appeared as a candidate gene without functional validation. The 2023 paper
          is what converted the candidate into a gene-disease relationship, by adding a third independent
          family and modelling the patients'' own alleles in zebrafish.'
      selected_evidence:
        snippet: Taken together, our data provide experimental evidence for a role for FLII in the pathogenesis
          of pediatric CM and report biallelic variants as a genetic cause of pediatric CM.
        supports: SUPPORT
        directness: DIRECT
