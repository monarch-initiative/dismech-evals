      assertion_type: Phenotype
      assertion:
        name: Secundum Atrial Septal Defect
        category: Cardiovascular
        description: Reported in one of the three patients (patient 2-II:1). One patient of three, so
          no frequency band; and a secundum atrial septal defect is common enough in the general infant
          population that a single occurrence cannot establish it as part of this syndrome. It is curated
          because it is a structural cardiac malformation in a disorder whose mechanism is morphogenetic,
          which makes it worth watching for in the next patient rather than dismissing as coincidence.
        notes: 'Deliberately not wired into the pathograph. No node in this entry causes atrial septation
          to fail: the morphogenetic lesion that is evidenced here is ventricular - trabeculation, myofibril
          organisation, cardiomyocyte adhesion in the ventricular wall - and nothing in either source
          connects flightless-I loss to atrial septation. Drawing an edge from the ventricular trabeculation
          node would assert a developmental relationship that no source supports. It stays as an unattached
