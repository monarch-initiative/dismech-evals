  fb4a937ed38251b7378e087267ac131e6f3c625cd2c7ea4e37ce2b8364aab16e:
    claim:
      about:
        disease:
          name: Dilated Cardiomyopathy 2J
          disease_term:
            preferred_term: cardiomyopathy, dilated, 2j
            term:
              id: MONDO:0957984
              label: cardiomyopathy, dilated, 2j
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysregulated Notch and Hippo Signaling
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: 'Two developmental signalling pathways, both independently linked to trabeculation
          and to dilated cardiomyopathy, are disturbed in flii-deficient myocardium. Notch reporter expression
          is strongly reduced in compact-layer cardiomyocytes while being preserved in the atrioventricular
          canal and outflow tract - a regionally specific loss rather than a global one. Nuclear localisation
          of the Hippo effector Wwtr1/Taz is strongly reduced in the same ventricular myocardium.

          Marked PROVISIONAL for two reasons that should not be collapsed. Both measurements come from
          the severe truncating zebrafish line rather than from the patient-mimicking alleles; and both
          are readouts, not mechanisms - what connects loss of an actin-remodelling protein to reduced
          Notch reporter activity and to Taz nuclear exclusion is not established here. The likely bridge
          is mechanotransduction, since Taz is a mechanosensitive effector and the myofibrillar and adhesion
          lesions upstream both change how force is generated and transmitted; but that is reasoning,
          not a result in this paper, and it is stated as such.'
        biological_processes:
        - preferred_term: Notch signaling pathway
          modifier: DECREASED
          term:
            id: GO:0007219
            label: Notch signaling pathway
        - preferred_term: hippo signaling
          modifier: DYSREGULATED
          term:
            id: GO:0035329
            label: hippo signaling
      selected_evidence:
        snippet: Notch reporter expression was present in the AVC and OFT of fliiD110fs/D110fs larvae,
          it was strongly reduced in compact layer cardiomyocytes of the mutants
        supports: SUPPORT
        directness: DIRECT
