      assertion_type: Discussion
      assertion:
        discussion_id: cmd2j_two_genetic_claims_about_flii
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is thin-filament shortening part of the mechanism of recessive CMD2J, or a property of
          the separate common-variant FLII association with cardiac remodelling?
        attaches_to:
        - pathophysiology#Sarcomeric Thin Filament Shortening
        rationale: Mouse cardiac deletion and R1245H perturb thin-filament length and contractile function.
          These are distinct genotypes from recessive human CMD2J. Measuring filament length in human
          or patient-equivalent models would test whether this mechanism contributes alongside adhesion
          and developmental effects.
        proposed_experiments:
        - experiment_id: exp_cmd2j_thin_filament_length_patient_cells
          name: Measure thin-filament length in CMD2J patient-derived cardiomyocytes
          description: Derive induced pluripotent stem cell cardiomyocytes from a patient with biallelic
            FLII variants, or use the patient-mimicking zebrafish, and measure sarcomeric actin thin-filament
            length by super-resolution imaging against isogenic controls, alongside tropomodulin-1 and
            leiomodin-2 localisation. Test whether leiomodin-2 overexpression rescues contractile function
            as it does in the mouse deletion model.
      selected_evidence:
        snippet: identified nominal associations between the FLII rs8821 variant and multiple cardiovascular
          diseases and phenotypes in humans
        supports: SUPPORT
