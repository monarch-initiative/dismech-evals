              label: cardiomyopathy, dilated, 2j
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiomyocyte Cell Adhesion Complex Failure
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'The finding the defining paper puts in its own title, and the one that separates
          flightless-I from an ordinary sarcomeric protein. Vinculin, imaged live as a fusion protein
          in zebrafish cardiomyocytes, normally concentrates into discrete foci at the lateral membrane.
          In flii mutants it is dispersed along the membrane instead. The adhesion machinery is present
          but no longer organised into the discrete anchor points a cardiomyocyte needs to transmit force
          to its neighbours.

          Note what this claim rests on. The dispersal was measured in the severe truncating line, not
          in the patient-mimicking knock-in - so the strength of the evidence here is for flightless-I''s
          role in adhesion-complex patterning, with the extension to the hypomorphic patient alleles resting
          on the shared myofibrillar and contractile phenotype rather than on a vinculin measurement in
          those animals.'
        biological_processes:
        - preferred_term: cell-cell adhesion
          modifier: DECREASED
          term:
            id: GO:0098609
            label: cell-cell adhesion
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: in flii+/? siblings, Vcl-EGFP was distinctly concentrated in foci (Figure 6A, left panel),
          whereas in fliiD110fs/D110fs embryos, Vcl-EGFP was dispersed throughout the lateral cardiomyocyte
          membranes
        supports: SUPPORT
        directness: DIRECT
