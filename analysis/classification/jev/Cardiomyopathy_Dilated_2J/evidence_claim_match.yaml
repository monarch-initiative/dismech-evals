      assertion:
        target: Cardiomyocyte Cell Adhesion Complex Failure
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Live imaging of a vinculin-EGFP fusion shows the protein dispersed along the lateral
          cardiomyocyte membrane instead of concentrated into foci.
        limitations: This is a severe truncating allele, not a patient allele. It demonstrates what flightless-I
          does for adhesion-complex patterning; it does not show that the patients' hypomorphic alleles
          disturb vinculin in the same way, which was not measured.
        readouts:
        - name: Vinculin-EGFP focal concentration at the lateral membrane
          target: Cardiomyocyte Cell Adhesion Complex Failure
          direction: DECREASED
          interpretation: Loss of focal concentration, with the protein present but dispersed, is a patterning
            failure rather than a loss of the adhesion machinery.
        - name: Cadherin2-GFP focal distribution at cell-cell junctions
          target: Cardiomyocyte Cell Adhesion Complex Failure
          direction: DECREASED
          interpretation: A second, independent junctional protein shows the same patterning failure -
            uniform smear along the junction instead of discrete foci - which is what distinguishes a
            general adhesion-complex localisation defect from a vinculin-specific one. The authors ran
            this experiment for exactly that reason.
      selected_evidence:
        snippet: these data show that Flii dysfunction not only affects structural components of the ventricular
          myocardium, including myofibrils and cell adhesion complexes, but it also results in the dysregulation
          of DCM-related signaling pathways during ventricular chamber morphogenesis
        supports: SUPPORT
        directness: INDIRECT
