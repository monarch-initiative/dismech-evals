          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: FLII, a member of the gelsolin superfamily, was initially described to be involved in
          the regulation of actin dynamics
        supports: SUPPORT
        directness: INDIRECT
