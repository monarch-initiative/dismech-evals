            genotype: flii D110fs homozygous premature stop in exon 5, lacking functional gelsolin domains
            publication: PMID:37561591
            description: A pre-existing severe truncating line, used as the strong end of an allelic series
              rather than as a model of the patients. It carries most of the mechanistic readouts in the
              paper - adhesion-complex patterning, Notch reporter activity, Taz nuclear localisation -
