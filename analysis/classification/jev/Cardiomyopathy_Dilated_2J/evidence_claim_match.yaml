      assertion_type: Pathophysiology
      assertion:
        name: Sarcomeric Thin Filament Shortening
        biological_scale: MOLECULAR
        role: modulator
        mechanism_confidence: PROVISIONAL
        description: 'A fourth arm, reached from a different direction and in a different genetic model.
          Mouse work driven by a common FLII variant found in cardiac-remodelling genome-wide association
          studies showed that Flii binds the sarcomeric actin thin filament and influences its length,
          acting together with tropomodulin-1, and that deleting Flii from the heart - or introducing
          the R1245H substitution - causes cardiomyopathy through thin-filament shortening.

          The rescue is the part that makes this more than an association: overexpressing leiomodin-2,
          which lengthens thin filaments, partially rescued the disease caused by cardiac Flii deletion.
          That is a manipulation of the proposed mechanism reversing the phenotype, which is stronger
          evidence than a correlation - and it links this entry to dilated cardiomyopathy 2G, the LMOD2
          disease, at the level of one shared physical parameter.

          PROVISIONAL for this entity all the same, and the reason is genetic rather than experimental.
          The mouse work concerns a common heterozygous-state variant and a cardiac-specific deletion;
          CMD2J is a recessive disease of biallelic hypomorphic alleles in infants. Thin-filament length
          has not been measured in a CMD2J patient or in the patient-mimicking zebrafish, and the defining
          paper does not report it.'
        biological_processes:
        - preferred_term: actin cytoskeleton organization
          modifier: ABNORMAL
          term:
            id: GO:0030036
            label: actin cytoskeleton organization
      selected_evidence:
        snippet: Deletion of Flii from the heart, or mice with the R1245H amino acid substitution, show
          cardiomyopathy due to shortening of the actin thin filaments.
        supports: SUPPORT
        directness: DIRECT
