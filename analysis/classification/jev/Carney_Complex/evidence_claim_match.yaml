      assertion_type: Pathophysiology
      assertion:
        name: Loss of RIalpha Restraint on cAMP-Stimulated PKA Signaling
        conforms_to: germline_two_hit_tumor_predisposition#Biallelic Tumor Suppressor Inactivation in
          a Susceptible Cell
        description: The rate-limiting state. RIalpha holds the PKA catalytic subunits inactive until
          displaced by cyclic AMP; losing it therefore changes the shape of the response rather than simply
          raising output. Carney complex tumours show decreased basal PKA activity but increased cAMP-stimulated
          activity relative to non-Carney tumours — an inversion of the normal relationship between stimulus
          and kinase output that is the biochemical correlate of the syndrome's paradoxical endocrine
          responses.
        role: central_effector
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: cAMP-dependent protein kinase regulator activity
          term:
            id: GO:0008603
            label: cAMP-dependent protein kinase regulator activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: In CNC families mapping to 17q, we detected loss of heterozygosity (LOH) in the vicinity
          of the gene (PRKAR1A) encoding protein kinase A regulatory subunit 1-alpha (RIalpha), including
          a polymorphic site within its 5' region.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
