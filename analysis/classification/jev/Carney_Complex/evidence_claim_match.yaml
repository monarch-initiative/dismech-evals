      assertion_type: Treatment
      assertion:
        name: Lifelong Echocardiographic Surveillance for Cardiac Myxoma
        notes: 'Curated under `treatments:` as a management intervention, not as a claim that imaging
          or biochemistry is itself therapeutic. In a two-hit predisposition syndrome the second hit cannot
          be prevented, so the only available lever is stage at detection: surveillance is the intervention
          that converts an unavoidable tumor into a resectable one. Where a `target_mechanisms` link is
          present it points at the clinical-outcome node for that reason, and never at an upstream mechanistic
          node.'
        description: The single most consequential intervention in Carney complex. Because myxomas arise
          at a young age, in any chamber, and recur after excision, echocardiography begins in childhood
          and moves to twice-yearly in anyone who has already had one excised. Surveillance does not end
          after a successful operation — recurrence in retained tissue is expected, which is the clinical
          expression of independent second hits.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: Echocardiography Test
          term:
            id: NCIT:C16525
            label: Echocardiography Test
      selected_evidence:
        snippet: Echocardiography annually beginning in childhood, biannually for those with a history
          of excised myxoma
        supports: SUPPORT
