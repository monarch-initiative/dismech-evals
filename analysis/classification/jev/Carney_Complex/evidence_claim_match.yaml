      assertion_type: Pathophysiology
      assertion:
        name: Multiple Neoplasia and Paradoxical Endocrine Overactivity
        conforms_to: germline_two_hit_tumor_predisposition#Early-Onset, Multifocal, and Bilateral Tumor
          Spectrum
        description: 'The clinical output: spotty skin pigmentation, cardiac and cutaneous myxomas, endocrine
          overactivity — primary pigmented nodular adrenocortical disease causing ACTH-independent Cushing
          syndrome, growth-hormone-secreting pituitary adenoma, thyroid and testicular tumors — and psammomatous
          melanotic schwannoma. Lesions are characteristically multiple and recurrent, and cardiac myxomas
          may be multichambered and recur after resection, which is why surveillance continues lifelong
          rather than ending after successful surgery. The resemblance to McCune-Albright syndrome, which
          reaches constitutive cAMP signalling by a somatic activating GNAS variant instead, is mechanistic
          rather than coincidental and was part of the reasoning that identified PRKAR1A.'
        role: consequence
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Carney complex (CNC) is a multiple neoplasia syndrome characterized by spotty skin pigmentation,
          cardiac and other myxomas, endocrine tumours and psammomatous melanotic schwannomas.
        supports: SUPPORT
