      assertion_type: Genetic
      assertion:
        name: SLC25A20 pathogenic variants
        gene_term:
          preferred_term: SLC25A20
          term:
            id: hgnc:1421
            label: SLC25A20
        features: 'CACT deficiency is caused by biallelic pathogenic variants in SLC25A20, encoding the
          mitochondrial inner membrane carnitine-acylcarnitine translocase. The protein functions via
          an alternating-access mechanism with asymmetric conformational changes. Over 30 pathogenic variants
          have been described. The acylcarnitine profile overlaps with CPT II deficiency, requiring SLC25A20
          sequencing or functional assays for definitive diagnosis.

          '
        inheritance:
        - name: Autosomal recessive
          description: 'CACT deficiency is inherited in an autosomal recessive manner. Each sibling of
            an affected individual has a 25% chance of being affected, 50% chance of being a carrier,
            and 25% chance of being unaffected. Heterozygous carriers are asymptomatic.

            '
        variants:
        - name: c.199-10T>G splice variant in SLC25A20
          description: 'A recurrent splice variant common in a Chinese cohort (14/15 patients homozygous),
            associated with severe early-onset disease.

            '
          gene:
            preferred_term: SLC25A20
            term:
              id: hgnc:1421
              label: SLC25A20
        - name: p.Gly20Asp (c.59G>A) variant
          description: 'Novel variant identified in a Spanish patient with severe neonatal-onset disease
            and fatal outcome during intercurrent infection in the first year.

            '
          gene:
            preferred_term: SLC25A20
            term:
              id: hgnc:1421
              label: SLC25A20
        - name: Asp231His and Ala281Val pathogenic mutations
          description: 'In silico structural modeling demonstrates that Asp231His disrupts the matrix
            salt-bridge network and Ala281Val impairs helix packing and conformational transitions required
            for substrate transport.

            '
          gene:
            preferred_term: SLC25A20
            term:
              id: hgnc:1421
              label: SLC25A20
      selected_evidence:
        snippet: The diagnosis of CACT deficiency is confirmed by identification of biallelic pathogenic
          variants in SLC25A20
        supports: SUPPORT
