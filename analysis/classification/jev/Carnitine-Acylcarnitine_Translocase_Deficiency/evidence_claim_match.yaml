          using acylcarnitine profiling. Elevated long-chain acylcarnitines are the primary markers. Use
          of ratio indices improves discrimination and reduces false-positive rates. Because CACT deficiency
          often presents before routine screening collection timing, early clinical vigilance is also
          important.

          '
