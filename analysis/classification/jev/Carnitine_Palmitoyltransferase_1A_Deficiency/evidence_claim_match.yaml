              label: carnitine palmitoyl transferase 1A deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: CPT1A
        gene_term:
          preferred_term: CPT1A
          term:
            id: hgnc:2328
            label: CPT1A
        relationship_type: CAUSATIVE
        association: Biallelic loss of function
        features: Pathogenic alleles include missense, nonsense, splice-site and small insertion/deletion
          variants, with rare exon or multiexon deletions. Residual enzyme activity and clinical penetrance
          vary by allele; hypomorphic population variants should not be equated with uniformly severe
          classic disease.
        inheritance:
        - name: Autosomal recessive
          description: For two carrier parents, recurrence risk is 25% affected, 50% carrier and 25% neither.
            For a carrier and an affected parent, risk is 50% affected and 50% carrier. Unaffected carriers
            generally have no metabolic phenotype; pregnancy with an affected fetus is a separate maternal
            risk context.
        variants:
        - name: p.Pro479Leu (c.1436C>T)
          description: Common hypomorphic allele in several northern Indigenous populations. A patient
            fibroblast study found approximately 20% residual activity and partial resistance to malonyl-CoA
            inhibition. Most homozygotes are asymptomatic, but supervised fasting in five children demonstrated
            reduced ketogenesis and symptomatic hypoglycemia in two. Population associations with infectious
            illness and infant mortality do not establish a direct immune defect or an inevitable clinical
            outcome. In the Nunavik population-genetic study, the allele frequency was 95.5% among 100
            analyzed adults after exclusions from 113 recruits; this is not disease prevalence or penetrance.
        - name: p.Gly710Glu (c.2129G>A)
          description: Hutterite founder allele causing catalytic inactivity despite preserved protein
            stability and mitochondrial targeting.
        - name: p.Ser34Pro (c.100T>C)
          description: Micronesian founder allele associated with a mild biochemical phenotype. Twenty-two
            homozygotes had no significant metabolic decompensation in the reported follow-up, including
            ten without dietary management. Residual activity of 26% was measured in one asymptomatic
            adult, not across all 22 patients.
        - name: p.Ser708Arg (c.2122A>C)
          description: Niuean founder allele associated with classic disease. Among three reported homozygotes,
            two presented clinically and the third was identified through sibling testing before later
            mild illness-associated decompensations.
        - name: p.Lys455Thr (c.1364A>C)
          description: 'Finnish recurrent allele: five of six reported patients were homozygous and one
            was compound heterozygous with p.Tyr498Ser. Crises generally occurred with illness or fasting
            and were uncommon during dietary treatment.'
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_dcea255c-11e4-46fd-b0f7-2de68311a75c-2018-01-23T170000.000Z
