          depend on CPT1B rather than CPT1A, CPT1A deficiency is largely restricted to a hepatic phenotype
          and characteristically spares cardiac and skeletal muscle, contrasting with CPT2, CACT, and
          VLCAD deficiencies, which cause cardiomyopathy and rhabdomyolysis.

