              label: carnitine palmitoyltransferase II deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Triheptanoin (Dojolvi)
        description: 'An odd-chain (C7) triglyceride providing anaplerotic substrate to sustain the TCA
          cycle, gluconeogenesis and energy production - the rationale being that conventional even-chain
          MCT supplies acetyl-CoA but does not replenish depleted TCA-cycle intermediates. Unlike bezafibrate,
          triheptanoin is an approved therapy: it is licensed as a source of calories and fatty acids
          for long-chain fatty acid oxidation disorders, the class that includes CPT II deficiency. A
          double-blind randomized comparison against MCT showed a positive cardiac effect, with improvement
          in major clinical events in open-label extension studies.

          '
        treatment_term:
          preferred_term: nutritional supplementation
          term:
            id: NCIT:C15433
            label: Nutritional Support
          therapeutic_agent:
          - preferred_term: triheptanoin
        target_phenotypes:
        - preferred_term: Myalgia
          term:
            id: HP:0003326
            label: Myalgia
        - preferred_term: Cardiomyopathy
          term:
            id: HP:0001638
            label: Cardiomyopathy
        - preferred_term: Exercise intolerance
          term:
            id: HP:0003546
            label: Exercise intolerance
        - preferred_term: Rhabdomyolysis
          term:
            id: HP:0003201
            label: Rhabdomyolysis
        notes: 'Triheptanoin is approved for long-chain fatty acid oxidation disorders as a class rather
          than for CPT II deficiency by name, so trial and licensing evidence is drawn from mixed LC-FAOD
          cohorts that include CPT II patients. Early use should be considered before symptom onset in
          severe disease. GeneReviews gives the dosing target as triheptanoin for one third of daily calories,
          with MCT oil substituted where triheptanoin is unavailable. Principal adverse effect is gastrointestinal
          intolerance, comparable to conventional MCT oil. Ontology note: therapeutic_agent deliberately
          carries NO term binding. CHEBI has no triheptanoin class, and the only available parent, CHEBI:17855
          triglyceride, would be actively misleading here - long-chain triglyceride is precisely the substrate
          class that CPT II deficiency management restricts, so binding the therapy to it inverts the
          clinical point. NCIT:C166587 Triheptanoin exists but was rejected by the term validator as not
          reachable from the ChemicalEntityTerm enum roots. preferred_term carries the agent identity
          until a usable term is available; an NTR to CHEBI would resolve this.

          '
      selected_evidence:
        snippet: Side effects of triheptanoin are primarily GI intolerance similar to conventional MCT
          oil.
        supports: SUPPORT
