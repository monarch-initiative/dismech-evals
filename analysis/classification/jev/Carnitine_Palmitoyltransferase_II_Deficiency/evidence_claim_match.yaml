  b0d93a48edf4aad93d096fb8ccea0a8595b82e76fa705155b1fdb1204fb2da12:
    claim:
      about:
        disease:
          name: Carnitine Palmitoyltransferase II Deficiency
          disease_term:
            preferred_term: carnitine palmitoyltransferase II deficiency
            term:
              id: MONDO:0015515
              label: carnitine palmitoyltransferase II deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: CPT2 gene variants
        association: Causative
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: CPT2
          term:
            id: hgnc:2330
            label: CPT2
        notes: 'CPT2 is the sole causal gene of this disease, and the three clinical forms are allelic
          rather than locus-heterogeneous: the myopathic, severe infantile and lethal neonatal subtypes
          are all bound to CPT2 and are separated by residual enzyme activity and by which variants are
          carried, not by which gene is mutated.'
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: CPT2 - p.Ser113Leu (S113L)
          description: 'The most common pathogenic variant, found in approximately 90% of myopathic CPT
            II patients with an allele frequency of 60-70%. Produces a thermolabile enzyme with abnormal
            sensitivity to malonyl-CoA inhibition.

            '
        - name: CPT2 - c.338C>T and c.482G>A compound heterozygote
          description: 'Compound heterozygous CPT2 variants identified by whole-genome sequencing in a
            patient with recurrent rhabdomyolysis and normal inter-episode acylcarnitine profiles.

            '
        - name: CPT2 - Various private mutations
          description: 'More than 60 mostly private mutations have been described in CPT2 beyond the common
            S113L variant. Novel variants include p.F352L, p.R498L, p.F434S, p.A515P, and c.153-2A>G reported
            in a Chinese pediatric cohort.

            '
        features: 'CPT II deficiency results from biallelic pathogenic variants in CPT2 encoding the inner
          mitochondrial membrane enzyme CPT-II. Unlike CPT-I, there are no tissue-specific isoforms of
          CPT-II, so clinical heterogeneity reflects different mutations and their impact on enzyme stability
          and activity. The S113L variant is by far the most common, particularly in the myopathic form.

          '
      selected_evidence:
        snippet: The review detailed 245 cases across various forms, including lethal neonatal, severe
          infantile hepatocardiomuscular, and myopathic forms.
        supports: SUPPORT
