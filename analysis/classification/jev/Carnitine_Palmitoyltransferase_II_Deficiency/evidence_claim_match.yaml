  1ee7930bac31f0e51e7296664e5388893e56f18f235dd9391f9cc967bfdbadb4:
    claim:
      about:
        disease:
          name: Carnitine Palmitoyltransferase II Deficiency
          disease_term:
            preferred_term: carnitine palmitoyltransferase II deficiency
            term:
              id: MONDO:0015515
              label: carnitine palmitoyltransferase II deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Bezafibrate
        description: 'A fibrate investigated as pharmacotherapy for CPT II deficiency on the basis of
          in vitro evidence that fibrates upregulate CPT2 expression. A randomized, double-blind, crossover
          trial in patients with CPT II (n=5) and VLCAD (n=5) deficiency found NO effect: despite the
          expected lipid-lowering, there were no changes in palmitate oxidation, total fatty acid oxidation,
          or heart rate during exercise. The authors graded this Class I evidence that bezafibrate is
          ineffective, and concluded that the in vitro therapeutic promise does not translate in vivo.
          Bezafibrate is recorded here as a refuted therapeutic hypothesis, not a candidate treatment.

          '
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: bezafibrate
            term:
              id: NCIT:C87449
              label: Bezafibrate
        target_phenotypes:
        - preferred_term: Exercise intolerance
          term:
            id: HP:0003546
            label: Exercise intolerance
        - preferred_term: Myalgia
          term:
            id: HP:0003326
            label: Myalgia
        - preferred_term: Rhabdomyolysis
          term:
            id: HP:0003201
            label: Rhabdomyolysis
        notes: 'Bezafibrate is not approved for CPT II deficiency and the controlled evidence is negative,
          not merely inconclusive. Earlier open-label reports of benefit were not confirmed when the question
          was tested under randomization and blinding; the trial authors attribute the discrepancy to
          in vitro findings failing to translate in vivo. Retained in the entry as a documented negative
          result rather than removed, so that the refuted hypothesis is not silently re-proposed.

          '
      selected_evidence:
        snippet: Bezafibrate does not improve clinical symptoms or FAO during exercise in patients with
          CPT II and VLCAD deficiencies.
        supports: REFUTE
