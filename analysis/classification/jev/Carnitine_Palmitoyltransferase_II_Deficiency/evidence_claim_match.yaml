        subtype: Myopathic
        description: 'Renal failure secondary to massive rhabdomyolysis and myoglobin nephrotoxicity.
          Managed with aggressive fluid resuscitation and occasionally hemodialysis; GeneReviews lists
          intravenous hydration and/or dialysis for rhabdomyolysis and myoglobinuria among acute inpatient
          measures.

          '
        notes: 'No frequency band is asserted. The previous OCCASIONAL (5-29%) sat against the cited source
          describing AKI as "one of the most common complications" of massive rhabdomyolysis, which points
          higher, but neither source quantifies it. Omitted rather than guessed.

