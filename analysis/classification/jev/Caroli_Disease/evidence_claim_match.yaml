      assertion:
        name: Presinusoidal Portal Hypertension
        role: consequence
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
        description: Portal pressure rises because of the periportal fibrous obstruction, producing splenomegaly
          with hypersplenic cytopenias and portosystemic collaterals — principally oesophageal and gastric
          fundal varices that bleed recurrently. The presinusoidal site of obstruction explains the characteristic
          dissociation between severe portal hypertension and near-normal liver biochemistry early in
          the course. Over years, repeated decompensation and progressive cholestasis erode hepatic reserve,
          converting a compensated Child-Pugh class A patient into a transplant candidate.
        locations:
        - preferred_term: liver
