      assertion_type: Subtype
      assertion:
        name: Simple Caroli disease
        display_name: Simple (type I) Caroli disease — ductal ectasia without hepatic fibrosis
        description: Segmental saccular dilatation of the large intrahepatic bile ducts without congenital
          hepatic fibrosis. Clinical disease is dominated by bile stasis complications — hepatolithiasis,
          recurrent bacterial cholangitis and biliary sepsis — rather than by portal hypertension. Frequently
          segmental or monolobar, which makes curative hepatic resection possible.
      selected_evidence:
        snippet: Congenital intrahepatic bile duct dilatation without fibrosis is called Caroli disease
          (CD), and is called Caroli syndrome (CS) when it has fibrotic and cirrhotic liver morphology.
        supports: SUPPORT
