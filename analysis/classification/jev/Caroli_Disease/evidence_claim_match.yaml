      assertion_type: Pathophysiology
      assertion:
        name: Ductal Plate Malformation of the Intrahepatic Biliary Tree
        role: intermediate
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: 'The intrahepatic bile ducts form from the ductal plate, a cylindrical sleeve of
          biliary precursors around each portal vein branch that is normally remodelled into tubular ducts
          during fetal life. In the fibrocystic liver diseases this remodelling fails, leaving persistent,
          abnormally shaped embryonic duct structures. Which level of the biliary tree is affected determines
          the clinical entity: dysgenesis of the small interlobular ducts produces congenital hepatic
          fibrosis, dysgenesis of the larger intrahepatic ducts produces Caroli disease, and involvement
          of both produces Caroli syndrome.'
        cell_types:
        - preferred_term: intrahepatic cholangiocyte
          term:
            id: CL:0002538
            label: intrahepatic cholangiocyte
        locations:
        - preferred_term: intrahepatic bile duct
          term:
            id: UBERON:0003704
            label: intrahepatic bile duct
        biological_processes:
        - preferred_term: intrahepatic bile duct development
          term:
            id: GO:0035622
            label: intrahepatic bile duct development
          modifier: ABNORMAL
      selected_evidence:
        snippet: leading to biliary microhamartomas and segmental bile duct dilations. Biliary changes
          are accompanied by progressive deposition of abundant peribiliary fibrosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
