      assertion_type: Pathophysiology
      assertion:
        name: Progressive Peribiliary Fibrosis
        role: intermediate
        biological_scale: TISSUE
        mechanism_confidence: ESTABLISHED
        description: Abundant fibrous tissue accumulates in the portal and periportal space around the
          malformed ducts. In Caroli syndrome this is the congenital hepatic fibrosis component and is
          developmental in origin, present from the outset rather than acquired; recurrent cholangitis
          adds a secondary inflammatory fibrogenic stimulus. The fibrosis is periportal and bridging rather
          than a true cirrhotic regenerative-nodule architecture, which is why hepatocellular synthetic
          function is characteristically preserved long after portal hypertension has become severe.
        conforms_to: fibrotic_response#Excessive ECM Deposition
        locations:
        - preferred_term: liver
          term:
            id: UBERON:0002107
            label: liver
        biological_processes:
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
          modifier: INCREASED
      selected_evidence:
        snippet: Peribiliary fibrosis and biliary cysts are the fundamental lesions of FLDs and are responsible
          for the main clinical manifestations, such as portal hypertension, recurrent cholangitis, cholestasis,
          sepsis and eventually cholangiocarcinoma.
        supports: SUPPORT
