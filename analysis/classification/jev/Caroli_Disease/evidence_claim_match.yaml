        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: caroli_cca_incidence_uncertainty
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the true incidence of cholangiocarcinoma in Caroli disease and Caroli syndrome,
          and can any risk factor stratify which patients will develop it?
        attaches_to:
        - pathophysiology#Cholangiocarcinoma
        rationale: Reported cholangiocarcinoma incidence ranges from 2.7% to 37.5% across studies, with
          pooled estimates of 6.6% (systematic review) and 7.1% (German multicentre series). All available
          series are retrospective and drawn from surgical cohorts, so they are subject to referral bias,
          and no predictor of malignant transformation has been identified. This matters clinically because
          malignancy risk is one of the arguments used to justify prophylactic resection, yet the tumours
          are almost always found incidentally in the specimen because preoperative imaging cannot detect
          them.
        proposed_experiments:
        - experiment_id: exp_caroli_prospective_cca_incidence
          name: Prospective unselected-cohort cholangiocarcinoma incidence study
          description: Registry-based prospective follow-up of an unselected (not surgically referred)
            Caroli disease and Caroli syndrome cohort with standardised imaging surveillance, to estimate
            cholangiocarcinoma incidence free of surgical referral bias.
          decision_criterion: An incidence estimate with confidence intervals that exclude the extremes
            of the currently reported 2.7-37.5% range would settle whether prophylactic resection is justified
            by malignancy risk alone.
        - experiment_id: exp_caroli_cca_risk_factor_case_control
          name: Nested case-control analysis of cholangiocarcinoma risk factors
          description: Within such a cohort, compare patients who did and did not develop cholangiocarcinoma,
            testing candidate risk factors (disease extent, cholangitis frequency, hepatolithiasis burden,
            age, PKHD1 genotype).
          decision_criterion: Identification of any factor that stratifies risk would convert a uniform
            resection recommendation into a targeted surveillance strategy.
      selected_evidence:
        snippet: The development of intrahepatic carcinoma is described in both conditions, but the reported
          incidence varies extensively. Potential risk factors for the malignant transformation were not
          described.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32884228
      reference_title: 'Risk of malignancy in Caroli disease and syndrome: A systematic review.'
      evidence_source: HUMAN_CLINICAL
      explanation: States both halves of this knowledge gap explicitly — the incidence varies extensively
        and no risk factors for malignant transformation are known.
