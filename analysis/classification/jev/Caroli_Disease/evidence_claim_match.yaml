      assertion_type: Pathophysiology
      assertion:
        name: Fibrocystin Loss from the Cholangiocyte Primary Cilium
        role: root
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: Biallelic PKHD1 variants reduce or abolish fibrocystin/polyductin, a large receptor-like
          protein that in normal biliary epithelium localises to the single primary cilium projecting
          from each cholangiocyte into the duct lumen. Loss of fibrocystin leaves the cilium structurally
          abnormal — shortened and with bulbous deformities — so the cholangiocyte can no longer transduce
          the ciliary signals that normally govern planar cell polarity and oriented growth of the developing
          duct. Because the same protein is required in renal tubular cilia, the biliary lesion is typically
          accompanied by the renal phenotype of autosomal recessive polycystic kidney disease.
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        gene:
          preferred_term: PKHD1
          term:
