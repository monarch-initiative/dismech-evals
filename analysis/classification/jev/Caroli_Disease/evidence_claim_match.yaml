            term:
              id: MONDO:0010913
              label: Caroli disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: caroli_no_targeted_therapy
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Can the cholangiociliopathy mechanism be targeted therapeutically, rather than only managing
          the downstream biliary and portal complications?
        attaches_to:
        - pathophysiology#Fibrocystin Loss from the Cholangiocyte Primary Cilium
        rationale: Every treatment curated in this entry acts on a consequence — infection, portal pressure,
          variceal bleeding, or the malformed anatomy itself — and none acts on the ciliary defect or
          on peribiliary fibrogenesis. A contributing obstacle is that fibrocystin/polyductin's molecular
          function is still not established, so there is no well-defined pathway to drug.
        proposed_experiments:
        - experiment_id: exp_caroli_fibrocystin_function_organoid
          name: Fibrocystin function in patient-derived cholangiocyte organoids
          description: Define the molecular function of fibrocystin/polyductin in cholangiocyte cilia
            (interactome and ciliary signalling readouts) in human cholangiocyte organoids derived from
            PKHD1-mutant patients versus isogenic controls.
          decision_criterion: Identification of a defined signalling axis downstream of ciliary fibrocystin
            would provide the first druggable target in this disease.
        - experiment_id: exp_caroli_antifibrotic_pck_rat
          name: Antifibrotic intervention trial in the PCK rat
          description: Test antifibrotic candidates against peribiliary fibrogenesis in the PCK rat, using
            portal pressure and periportal collagen deposition as endpoints.
          decision_criterion: A reduction in portal pressure and periportal collagen relative to untreated
            PCK controls would justify translation toward a portal-hypertension-modifying therapy.
      selected_evidence:
        snippet: Targeted medical therapy is not available yet and thus the current treatment aims at
          controlling the complications.
        supports: SUPPORT
    origin:
