      assertion:
        name: Advanced carotid atheroma with necrotic core and fibrous cap
        role: effector
        conforms_to: atherogenesis#Advanced Atheroma with Necrotic Core and Fibrous Cap
        description: Continued lipid accumulation, foam-cell death, and matrix remodeling produce an advanced
          carotid atheroma with a lipid-rich necrotic core enclosed by a fibrous cap. Neovascularization,
          intraplaque hemorrhage, cap thinning, and surface ulceration can destabilize the lesion. This
          optional mature-plaque stage is represented without assuming that it caused every chronic or
          non-acute occlusion in the cited cohorts.
        cell_types:
        - preferred_term: vascular smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
        locations:
        - preferred_term: internal carotid artery
          term:
            id: UBERON:0001532
            label: internal carotid artery
        biological_processes:
        - preferred_term: extracellular matrix organization
          modifier: INCREASED
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: 'In macroscopic evaluation, vulnerable plaques are characterized by one or more of the
          following features: microcalcification; neovascularization; lipid-rich necrotic cores (LRNCs);
          intraplaque hemorrhage (IPH); thin fibrous caps; plaque surface ulceration; huge dimensions,
          suggesting stenosis; and plaque rupture.'
        supports: SUPPORT
