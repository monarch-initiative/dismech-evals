      assertion_type: Genetic
      assertion:
        name: Shared cardiometabolic and stroke susceptibility loci (indirect context)
        association: Risk Factor
        presence: Positive
        notes: The European-ancestry GWAS examined coronary disease, myocardial infarction, heart failure,
          atrial fibrillation, all stroke, ischemic stroke, and risk-factor traits including carotid intima-media
