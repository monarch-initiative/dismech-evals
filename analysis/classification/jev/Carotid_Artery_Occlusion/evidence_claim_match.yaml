      assertion_type: Pathophysiology
      assertion:
        name: Thrombotic carotid occlusion
        description: Atherosclerotic plaque growth and associated thrombotic or occlusive remodeling can
          produce non-acute or chronic long-segment occlusion of the internal carotid artery. Occlusion
          anatomy and plaque location influence recanalization feasibility and re-occlusion risk. The
          available cohort evidence does not distinguish acute rupture or erosion from chronic plaque
          growth and occlusive remodeling, so this node is not restricted to the rupture-driven atherogenesis
          consequence.
        biological_processes:
        - preferred_term: blood coagulation
          modifier: INCREASED
          term:
            id: GO:0007596
            label: blood coagulation
      selected_evidence:
        snippet: To investigate the significance of atherosclerotic plaque location in hybrid surgery
          comprising both endovascular recanalization approaches and carotid endarterectomy for symptomatic
          atherosclerotic non-acute long-segment occlusion of the internal carotid artery (ICA), 162 patients
          were enrolled, including 120 (74.1%) patients in the proximal plaque group and 42 (25.9%) in
          the distal plaque group.
        supports: SUPPORT
