        name: NCT02089217
        phase: NOT_APPLICABLE
        status: COMPLETED
        description: 'CREST-2 comprised two parallel randomized trials in asymptomatic stenosis of at
          least 70%: 1245 patients in the stenting comparison and 1240 in the endarterectomy comparison.
          At 4 years, the primary composite was lower with stenting plus intensive medical management
          (2.8% versus 6.0%, P=.02); the endarterectomy comparison was neutral (3.7% versus 5.3%, P=.24).
          Neither comparison showed cognitive benefit through 4 years in the prespecified secondary cognitive
          analysis. The trials do not directly compare stenting with endarterectomy.'
        target_phenotypes:
        - preferred_term: Ischemic stroke
          term:
            id: HP:0002140
            label: Ischemic stroke
        notes: ClinicalTrials.gov registry checked 2026-10-04; last posted update 2025-10-01. The registry
          lists 2486 enrolled; the publication reports 2485 randomized, which is the denominator used
          here. TCAR was not included.
      selected_evidence:
        snippet: The primary outcome was a composite of any stroke or death, assessed from randomization
          to 44 days, or ipsilateral ischemic stroke, assessed during the remaining follow-up period up
          to 4 years.
