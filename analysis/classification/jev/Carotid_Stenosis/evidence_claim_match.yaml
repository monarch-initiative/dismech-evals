        description: Perfusion MRI or CT can show delayed ipsilateral hemispheric contrast arrival in
          a subset with severe stenosis. Delay alone does not establish infarction or a reversible cause
          of cognitive impairment.
        phenotype_term:
          preferred_term: Delayed cerebral perfusion
        notes: 'Needs term: delayed cerebral perfusion. The OAK query `runoak -i ols:hp search ''l~perfusion''
          ''l~cerebral blood flow'' ''l~hypoperfusion''` returned pulmonary perfusion defect, maternal
          vascular malperfusion, iris hypoperfusion, ophthalmic artery hypoperfusion, and cilioretinal
          arteriolar hypoperfusion, with no cerebral-perfusion term. A cerebral ischemia binding would
          overstate what contrast-arrival delay alone establishes.'
      selected_evidence:
        snippet: Magnetic resonance or computed tomographic perfusion imaging tested for baseline hemodynamic
          impairment defined by delayed time-to-peak (TTP) arrival of intravenous contrast in the hemisphere
          ipsilateral minus contralateral to the stenotic artery.
        supports: SUPPORT
        directness: DIRECT
