      assertion_type: Diagnosis
      assertion:
        name: Distinguishing near-occlusion from conventional stenosis and complete occlusion
        description: Near-occlusion is a tight proximal ICA stenosis with distal lumen reduction, with
          or without a threadlike full collapse. Residual lumen distinguishes it from complete occlusion.
          The collapsed distal vessel is not a valid normal denominator for routine percentage stenosis;
          confirm this configuration before applying conventional thresholds.
      selected_evidence:
        snippet: Carotid near-occlusion is distal ICA luminal collapse beyond a tight stenosis, where
          the distal lumen should not be used for calculating percentage stenosis.
        supports: SUPPORT
        directness: DIRECT
