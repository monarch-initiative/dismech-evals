      assertion_type: Treatment
      assertion:
        name: Carotid endarterectomy
        description: Carotid endarterectomy removes the atheromatous lesion. NASCET established benefit
          for selected recently symptomatic 70-99% stenosis; prompt assessment is important, with timing
          depending on neurologic stability and infarct burden. Older ACAS results supported selected
          asymptomatic patients, but in the separate modern CREST-2 endarterectomy trial the 4-year composite
          rate was 3.7% with surgery plus intensive management versus 5.3% with intensive management alone
          (P=.24). This neutral asymptomatic result does not negate symptomatic-trial benefit.
        treatment_term:
          preferred_term: Carotid Endarterectomy
          term:
            id: NCIT:C157807
            label: Carotid Endarterectomy
        target_phenotypes:
        - preferred_term: Ischemic stroke
          term:
            id: HP:0002140
            label: Ischemic stroke
        - preferred_term: Transient ischemic attack
          term:
            id: HP:0002326
            label: Transient ischemic attack
        therapeutic_modality: SURGERY
        notes: Conventional high-grade stenosis results should not be extrapolated to near-occlusion.
          Contemporary evidence for benefit in near-occlusion is limited, especially for the full-collapse
          subgroup; individualized specialist assessment is required.
      selected_evidence:
        snippet: Symptomatic CNO have no benefit with revascularization in studies with "good" CNO diagnostics,
          which foremost applies to the moderate subtype (without full collapse).
        supports: SUPPORT
        directness: DIRECT
