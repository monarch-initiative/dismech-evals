        snippet: The degree of the stenosis is calculated by either the NASCET criteria, that calculates
          the ratio of the stenosis to the normal lumen distal to the stenosis, or the ECST criteria,
          which characterises the degree of the stenosis in relation to the estimated normal lumen at
          the same level
