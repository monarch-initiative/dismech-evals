        description: CTA with axial and oblique sagittal reconstructions identifies the shelf and septum.
          Complementary ultrasound or vessel-wall MRI can resolve uncertainty; DSA is useful for unresolved
          diagnosis or intervention. The recommendation to use two modalities is an expert-review proposal,
          not a validated universal criterion. A web found ipsilateral to stroke still requires evaluation
          for competing causes.
        diagnosis_term:
          preferred_term: Diagnostic Procedure
          term:
            id: NCIT:C18020
            label: Diagnostic Procedure
      selected_evidence:
        snippet: A carotid web was defined on CTA as a thin intraluminal filling defect along the posterior
          wall of the carotid bulb just beyond the carotid bifurcation on oblique sagittal section CTA
          that was seen as a septum on axial CTA.
        supports: SUPPORT
        directness: DIRECT
