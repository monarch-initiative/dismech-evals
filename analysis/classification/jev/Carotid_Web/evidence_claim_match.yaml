        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        locations:
        - preferred_term: internal carotid artery
          term:
            id: UBERON:0001532
            label: internal carotid artery
        notes: The CFD study assumed rigid walls and Newtonian blood, used a small symptomatic sample,
          and included older atherosclerotic comparators. Six normal geometries came from contralateral
          arteries of web patients. Hemodynamic thresholds were exploratory; modeled stasis is not a direct
          assay of coagulation or a validated individual stroke predictor.
      selected_evidence:
        snippet: Patients with CaW had significantly larger regions containing low shear rate, high OSI,
          low velocity, and flow stasis in comparison to subjects with mild atherosclerosis or normal
          bifurcations.
        supports: SUPPORT
