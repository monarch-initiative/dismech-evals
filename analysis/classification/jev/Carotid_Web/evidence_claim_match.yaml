        description: Symptomatic ipsilateral carotid web is associated with a higher risk of early and
          longer-term recurrent ischemic stroke.
        phenotype_term:
          preferred_term: Ischemic stroke
          term:
            id: HP:0002140
            label: Ischemic stroke
      selected_evidence:
        snippet: 'When compared to patients without ipsilateral carotid web, those with an ipsilateral
          carotid web had a higher risk of recurrent ischemic stroke (adjusted RR: 4.38, 95% CI: 1.38–13.85)
          and recurrent ipsilateral large vessel occlusion (adjusted RR: 4.49, 95% CI: 1.41–14.21).'
        supports: SUPPORT
