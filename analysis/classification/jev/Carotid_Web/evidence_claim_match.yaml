          search 'l~transcarotid' 'l~TCAR' returned no matches on 2026-10-04; the term does not encode
          the transcarotid access or flow-reversal protection.
      selected_evidence:
        snippet: 'Over a median follow-up of 9 months (IQR: 6-21), no patients experienced recurrent ischemic
          stroke in the treated vascular territory, suggesting potential effectiveness of revascularization
          in preventing recurrence in selected patients with carotid webs.'
        supports: SUPPORT
