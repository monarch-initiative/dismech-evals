        definition_type: CASE_DEFINITION
        description: A thin shelf-like filling defect of the posterior carotid bulb seen on oblique sagittal
          CTA and as a septum on axial images. The imaging lesion may be present without a clinical ischemic
          event.
        scope: Structural imaging definition; attribution of a stroke requires clinical and etiologic
          assessment.
