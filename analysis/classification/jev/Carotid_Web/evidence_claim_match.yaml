      assertion_type: Pathophysiology
      assertion:
        name: Pro-thrombotic carotid hemodynamics
        description: Patient-specific flow modeling shows that carotid webs create larger regions of low
          shear, high oscillatory shear, low velocity, and flow stasis than comparable mild atherosclerotic
          lesions or normal carotid bifurcations.
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        - preferred_term: platelet
          term:
            id: CL:0000233
            label: platelet
        biological_processes:
        - preferred_term: blood coagulation
          term:
            id: GO:0007596
            label: blood coagulation
          modifier: INCREASED
        - preferred_term: platelet activation
          term:
            id: GO:0030168
            label: platelet activation
          modifier: INCREASED
      selected_evidence:
        snippet: Patients with CaW had significantly larger regions containing low shear rate, high OSI,
          low velocity, and flow stasis in comparison to subjects with mild atherosclerosis or normal
          bifurcations.
        supports: SUPPORT
