      assertion_type: Definition
      assertion:
        name: Imaging and anatomic definition of carotid web
        definition_type: CASE_DEFINITION
        description: Carotid web is recognized as a fibrous shelf-like intimal flap projecting into the
          lumen from the posterior wall of the internal carotid bulb.
        scope: Imaging-defined carotid web in stroke and vascular-neurology practice
      selected_evidence:
        snippet: A carotid web (CaW) is an atypical form of fibromuscular dysplasia characterized by a
          fibrous, shelf-like intimal flap originating from the posterior wall of the internal carotid
          bulb projecting into the arterial lumen.
        supports: SUPPORT
