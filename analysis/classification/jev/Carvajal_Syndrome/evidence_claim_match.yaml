      assertion_type: Pathophysiology
      assertion:
        name: Biallelic DSP Deficiency — Desmosome-IF Uncoupling
        conforms_to: desmosomal_adhesion_failure#Desmosomal Component Loss or Blockade
        description: Biallelic DSP mutations cause severe desmoplakin deficiency, disrupting the critical
          link between desmosomal cadherins and the intermediate filament (IF) network. The prototype
          mutation 7901delG produces a truncated protein lacking the C domain of the tail region, which
          is essential for IF attachment. This molecular defect underlies both the cutaneous and cardiac
          manifestations of Carvajal syndrome.
        genes:
        - preferred_term: DSP
          term:
            id: hgnc:3052
            label: DSP
        molecular_functions:
        - preferred_term: structural constituent of cytoskeleton
          term:
            id: GO:0005200
            label: structural constituent of cytoskeleton
        biological_processes:
        - preferred_term: Desmosome organization
          term:
            id: GO:0002934
            label: desmosome organization
          modifier: DECREASED
        - preferred_term: Cell-cell junction assembly
          term:
            id: GO:0007043
            label: cell-cell junction assembly
          modifier: DECREASED
      selected_evidence:
        snippet: we describe the first recessive human mutation, 7901delG, in the desmoplakin gene which
          causes a generalized striate keratoderma particularly affecting the palmoplantar epidermis,
          woolly hair and a dilated left ventricular cardiomyopathy
        supports: SUPPORT
