        prompt: What surgical components and hormonal regimens independently reduce recurrence?
        rationale: Combined interventions, referral selection and variable follow-up make treatment effects
          difficult to separate. The 2024 CP cohort has inconsistent hormone-treated recurrence counts
          between abstract and body, so those counts are not reused here. The 2026 review synthesizes
          earlier studies and reuses published meta-analysis estimates rather than performing a new pooled
          analysis.
