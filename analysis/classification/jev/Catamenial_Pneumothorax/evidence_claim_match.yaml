      assertion_type: DifferentialDiagnosis
      assertion:
        name: Primary spontaneous pneumothorax
        description: Primary spontaneous pneumothorax shares the presenting lung collapse but is not defined
          by menstrual timing or thoracic endometriotic lesions. Smoking is a major risk factor, although
          its presence or absence alone cannot distinguish the diagnoses.
        distinguishing_features:
        - Repeated association with the perimenstrual window supports CP; a single coincident episode
          alone is less informative.
        - Thoracic endometriotic lesions or diaphragmatic defects support an endometriosis-associated
          mechanism, while blebs may also occur in CP.
      selected_evidence:
        snippet: Tobacco smoking is a major risk factor for primary spontaneous pneumothorax
        supports: SUPPORT
