        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cp-etiology-and-diagnostic-boundaries
        prompt: Which mechanisms explain histology-negative catamenial pneumothorax?
        rationale: Menstrual timing and histological thoracic endometriosis define overlapping populations.
          Negative pathology can reflect missed stromal lesions or different mechanisms. Transport, metaplasia,
          cyclic breakdown, and prostaglandin models should not be promoted to proven etiologies solely
          from clinical timing or treatment response.
      selected_evidence:
        snippet: Pulmonary endometric lesions, however, often detected in patients with hemothorax and
          hemoptysis, may be absent in a proportion of cases of pneumothorax.
        supports: SUPPORT
        directness: DIRECT
