            id: hgnc:1041
            label: BFSP2
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Reported dominant alleles (NM_003571): c.697_699del p.(Glu233del) in exon 3, recurrent
          in unrelated families from the United States and China; c.859C>T p.(Arg287Trp) in exon 4 (juvenile-onset
          family, one adult carrier without confirmed cataract); c.1091G>A p.(Arg339His) in exon 5; and
          c.335G>A p.(Gly112Glu). c.265C>T p.(Arg89Trp), in the head domain, was classed as a variant
