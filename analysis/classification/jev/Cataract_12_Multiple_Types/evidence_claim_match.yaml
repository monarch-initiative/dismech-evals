        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous Dominant BFSP2 Variants
        biological_scale: MOLECULAR
        description: 'Dominant alleles cluster in the alpha-helical central rod domain, which mediates
          coiled-coil dimerization: R287W, the recurrent in-frame E233del and R339H; G112E lies near the
          head-rod boundary. E233 and R287 are conserved across species and among intermediate filament
          proteins, and deleting E233 is predicted to shift the heptad repeat phase. Because a likely
          null allele causes no cataract in heterozygous carriers, the dominant alleles are thought to
          act by a mechanism other than haploinsufficiency; no functional study of a human BFSP2 allele
          was found.'
        genes:
        - preferred_term: BFSP2
          term:
            id: hgnc:1041
            label: BFSP2
        molecular_functions:
        - preferred_term: structural constituent of eye lens
          term:
            id: GO:0005212
            label: structural constituent of eye lens
          modifier: DECREASED
      selected_evidence:
        snippet: This mutation alters an evolutionarily conserved arginine residue in the central rod
          domain of the intermediate filament.
        supports: SUPPORT
    origin:
