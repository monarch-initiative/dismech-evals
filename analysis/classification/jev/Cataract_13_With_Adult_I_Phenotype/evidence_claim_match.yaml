      assertion_type: Definition
      assertion:
        name: Copy-number analysis is required alongside sequencing
        definition_type: DIAGNOSTIC_CRITERIA
        derivation_basis: ESTABLISHED_CRITERIA
        description: Because a large share of reported GCNT2 alleles are multi-kilobase Alu-mediated deletions,
          a molecular workup for congenital cataract that relies on sequence variants alone can return
          negative in a patient who has a causal GCNT2 allele. Copy-number analysis of 6p24, or breakpoint
          mapping by long-range PCR, is what closes that gap.
      selected_evidence:
        snippet: Analysis of whole exome sequencing data in a patient affected with congenital cataracts
          identified a pathogenic deletion which was further defined by other techniques.
        supports: SUPPORT
