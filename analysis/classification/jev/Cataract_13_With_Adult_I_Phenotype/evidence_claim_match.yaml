      reference_title: Case report of homozygous deletion involving the first coding exons of GCNT2 isoforms
        A and B and part of the upstream region of TFAP2A in congenital cataract.
      evidence_source: HUMAN_CLINICAL
      explanation: States the isoform-to-phenotype rule as it stood before the exon 1B case completed
        it.
