  fdafa2b67b67fbf6fa6bd936d817b24e2a57536216fc9b71a9058d170f631121:
    claim:
      about:
        disease:
          name: Cataract 13 With Adult I Phenotype
          disease_term:
            preferred_term: cataract 13 with adult I phenotype
            term:
              id: MONDO:0007289
              label: cataract 13 with adult I phenotype
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Lens Glycan Branching
        biological_scale: TISSUE
        conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
        description: 'The I antigen is present on lens epithelium as well as on red cells, and loss of
          branching there is what produces the cataract. The isoform expression data put the lens-relevant
          transcripts and the erythroid transcript on different exon 1 variants, which is what makes the
          two consequences separable.

          How the loss of a glycan branch actually causes lens opacification is not established. The published
          work demonstrates that GCNT2 is expressed in lens epithelium and that its loss co-segregates
          with cataract; it does not demonstrate the intervening step, whether that is altered membrane
          protein trafficking, osmotic change, or protein aggregation. This node therefore states the
          association and stops there rather than supplying a mechanism the literature does not.'
        cell_types:
        - preferred_term: lens epithelial cell
          term:
            id: CL:0002224
            label: lens epithelial cell
        mechanism_confidence: PROVISIONAL
        notes: 'On the module conformance declared above: this node substitutes the disorder-specific
          insult, as cataract_lens_opacification''s own notes direct, and two of that module node''s expectations
          are deliberately not met. It does not carry the module node''s response to oxidative stress
          process, because the GCNT2 lesion is a glycan-branching defect and asserting oxidative stress
          here would be inventing a mechanism. It binds only lens epithelial cell and not the module''s
          lens fiber cell, because the sources locate the I antigen and GCNT2 expression in lens epithelium.'
      selected_evidence:
        snippet: enzyme function assays and expression patterns for the 3 IGnT transcripts in reticulocytes
          and lens-epithelium cells were analyzed
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12424189
      reference_title: The molecular genetics of the human I locus and molecular background explain the
        partial association of the adult i phenotype with congenital cataracts.
      evidence_source: IN_VITRO
      explanation: The isoform expression analysis in lens epithelium specifically, which is what grounds
        the lens as the affected tissue.
