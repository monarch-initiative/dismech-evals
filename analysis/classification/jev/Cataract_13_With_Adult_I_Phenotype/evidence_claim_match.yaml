              label: cataract 13 with adult I phenotype
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: isoform_partition_model
        hypothesis_label: Tissue-partitioned GCNT2 isoforms explain the partial coupling of cataract and
          adult i
        status: CANONICAL
        description: 'Different first exons and tissue expression partition GCNT2 function: GCNT2B was
          detected in adult lens epithelium and GCNT2C in reticulocytes. Shared-exon variants can affect
          both traits, while C-specific variants provide blood-group-only comparators. Human cataract
          with A/B deletions and the 2026 B-specific frameshift support a lens role for B. This is a supported
          explanatory model, not a deterministic rule for every allele or population; developmental expression
          and the lens injury pathway remain incompletely resolved.'
        notes: The 2026 abstract (PMID:41813616) reports a 1B/1C deletion, whereas the same-case ACMG
          poster reports a paternal 1A/1B deletion. The maternal NM_001491.3:c.760dup p.H254Pfs*2 exon-1B
          variant is consistent between them. The poster is not independent replication. Its authors could
          not completely exclude an alternative syndromic cataract explanation for unexplained nonocular
          findings. The 2016 A/B-deletion family has no reported I/i serology; intact C coding sequence
          is not proof of normal erythroid expression.
      selected_evidence:
        snippet: In Japan, 18 individuals of phenotype i, including our case, have been found in ten unrelated
          families. Seventeen of them had congenital cataract. Cataract was not found in any of the 45
          phenotype I members in these families.
        supports: SUPPORT
