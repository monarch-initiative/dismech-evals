              label: cataract 13 with adult I phenotype
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: COS-7 expression of mutant GCNT2 isoforms
        experimental_model_type: CELL_LINE
        cell_source: COS-7 cells expressing recombinant human GCNT2 constructs
        description: Secreted recombinant enzyme constructs were expressed in COS-7 cells and GlcNAc transfer
          to an acceptor substrate was assayed. Shared-exon missense variants abolished activity across
          isoforms; vector controls and wild-type constructs provide the comparator. This is an enzyme-function
          model, not a human lens-opacity model.
        publication: PMID:12424189
        modeled_mechanisms:
        - target: Loss of I-Branching Glycosyltransferase Activity
          relationship: RECAPITULATES
          limitations: Heterologous recombinant enzyme measurements do not demonstrate lens glycan changes
            or cataract formation.
          readouts:
          - name: Mutant GlcNAc-transferase activity
            target: Loss of I-Branching Glycosyltransferase Activity
            direction: ABOLISHED
            interpretation: Shared-exon missense constructs lost activity relative to their wild-type
              isoforms in the reported assay.
      selected_evidence:
        snippet: 'The Gly350Glu and Arg385His changes

          in the C-terminal segments of the IGnTA- and IGnTC-encoded

          GlcNAcTs effectively eliminated the original GlcNAc-transferring

          activity, similar to the effects of the Gly348Glu and Arg383His

          changes on IGnTB'
        supports: SUPPORT
