          disease_term:
            preferred_term: cataract 13 with adult I phenotype
            term:
              id: MONDO:0007289
              label: cataract 13 with adult I phenotype
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: isoform_partition_model
        hypothesis_label: Tissue-partitioned GCNT2 isoforms explain the partial coupling of cataract and
          adult i
        status: CANONICAL
        description: 'The three GCNT2 transcripts share exons 2 and 3 and differ in exon 1. GCNT2C is
          the erythroid transcript and sets the blood group; exon 1B-containing transcripts are the lens-relevant
          ones. Which exon a variant hits therefore predicts which traits appear, and this is what explains
          the long-standing clinical observation that the i-cataract association is strong in some populations
          and weak in others.

          This is marked CANONICAL rather than EMERGING because it has the strongest kind of support a
          genotype-phenotype model can have: a matched pair of dissociating observations in opposite directions.
          An exon 1C missense variant gives adult i without cataract, and an exon 1B truncating variant
          gives cataract, each in a person. Neither is a single-case fluke read in isolation; together
          they are a genetic experiment.'
        notes: One caveat that the primary papers themselves raise. The exon 1B case is a single proband,
          and its second allele is a 75 kb deletion spanning both 1B and 1C, so the cataract cannot be
          attributed to exon 1B alone with the certainty a homozygous 1B-only genotype would give. Separately,
          the 98 kb deletion case also removes part of the intergenic region upstream of TFAP2A, and those
          authors explicitly say an effect on TFAP2A cannot be ruled out.
      selected_evidence:
        snippet: In Japan, 18 individuals of phenotype i, including our case, have been found in ten unrelated
          families. Seventeen of them had congenital cataract. Cataract was not found in any of the 45
          phenotype I members in these families.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:432928
      reference_title: Phenotype i associated with congenital cataract in Japanese.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The Japanese series that established the strong arm of the association: 17 of 18 phenotype
        i individuals had cataract, and none of the 45 phenotype I family members did.'
