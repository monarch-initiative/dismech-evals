      assertion:
        name: Loss of I-Branching Glycosyltransferase Activity
        biological_scale: MOLECULAR
        description: Biallelic GCNT2 variants abolish or greatly reduce I-branching beta-1,6-N-acetylglucosaminyltransferase
          activity. Reported alleles include nonsense variants in shared exon 2 that truncate all three
          isoforms at once, frameshifts, and large Alu-mediated deletions removing whole exons. A missense
          allele in exon 1C has been shown by direct enzyme assay to reduce rather than abolish activity,
          which is the finer-grained version of the same lesion.
        molecular_functions:
        - preferred_term: I-branching beta-1,6-N-acetylglucosaminyltransferase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0008109
            label: N-acetyllactosaminide beta-1,6-N-acetylglucosaminyltransferase activity
      selected_evidence:
        snippet: The human i and I antigens are characterized as linear and branched repeats of N-acetyllactosamine,
          respectively. Conversion of the i to the I structure requires I-branching beta-1,6-N-acetylglucosaminyltransferase
          activity.
        supports: SUPPORT
