      assertion_type: Genetic
      assertion:
        name: GCNT2
        gene_term:
          preferred_term: GCNT2
          term:
            id: hgnc:4204
            label: GCNT2
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Biallelic loss-of-function variants in GCNT2 at 6p24. Two features of the variant spectrum
          matter clinically. First, a large share of reported alleles are structural: Alu-mediated deletions
          of 75 to 98 kb removing one or more exons, arising by non-homologous recombination between flanking
          AluS elements. The same 93 kb deletion was found in two apparently unrelated Pakistani families,
          by recurrent Alu-Alu recombination or an old founder effect. A sequencing-only workup can therefore
          return negative on a patient who has a causal GCNT2 allele. Second, which exon is hit determines
          which traits appear: shared exons 2 and 3 truncate all isoforms, exon 1C alone gives blood group
          without cataract, and a truncating exon 1B variant has been reported with cataract.'
      selected_evidence:
        snippet: The deletion is flanked by Alu repeats of the AluS family on both sides and microsatellite
          genotyping suggested that its occurrence in the two families was the product of recurrent Alu-Alu
          repeat-mediated nonhomologous recombinations or an old founder effect.
        supports: SUPPORT
    origin:
