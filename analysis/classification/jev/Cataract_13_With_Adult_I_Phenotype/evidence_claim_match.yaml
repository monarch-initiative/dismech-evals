        association: Causative
        relationship_type: CAUSATIVE
        notes: Reported variants include shared-exon missense and nonsense alleles, the four-base deletion
          c.1163_1166delATCA (a frameshift, not a point substitution), and exon-spanning deletions. The
          recurrent 93-kb deletion was attributed to Alu-mediated recombination or an old founder effect.
          A separate breakpoint-resolved 97.974-kb deletion removes GCNT2A/B first coding exons and upstream
          intergenic sequence while sparing GCNT2C and TFAP2A coding regions. Possible regulatory effects
          on intact genes were not measured; I/i serology was not reported for those siblings. A further
          family carries an approximately 190-kb deletion with an accompanying insertion only suspected.
          The 2026 exon-1B case supports lens involvement but has a discordant exon label for its deletion
          between abstract and poster. These reports do not establish a population proportion of structural
          alleles. The 2017 publisher correction to the 190-kb deletion report clarifies that flanking
          SNPs were identified outside the deleted region and corrects their coordinates; the original
          paragraph should not be used for breakpoint annotation.
      selected_evidence:
        snippet: The deletion is flanked by Alu repeats of the AluS family on both sides and microsatellite
          genotyping suggested that its occurrence in the two families was the product of recurrent Alu-Alu
          repeat-mediated nonhomologous recombinations or an old founder effect.
        supports: SUPPORT
