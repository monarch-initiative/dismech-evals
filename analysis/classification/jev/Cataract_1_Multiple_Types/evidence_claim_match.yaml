      assertion:
        name: GJA8
        gene_term:
          preferred_term: GJA8
          term:
            id: hgnc:4281
            label: GJA8
        association: Causative
        relationship_type: CAUSATIVE
        notes: 'Dominant missense alleles include p.(Pro88Ser), p.(Glu48Lys), p.(Pro88Gln), p.(Val44Glu),
          p.(Trp45Ser), p.(Gly46Val), p.(Asp47Asn), p.(Val79Leu), p.(Pro189Leu), p.(Arg198Gln), p.(Arg198Trp)
          and p.(Ser258Phe); p.(Asp51Asn), p.(Gly46Glu) and p.(Gly94Arg) are associated with microphthalmia,
          sclerocornea, aphakia or acorea. Recessive alleles are frameshifts: c.670insA p.(Thr203AsnfsX47),
          ins776G, and c.855delG with c.1125delC. p.(Ile247Met), once reported as a cataract allele, behaves
          as a rare polymorphism. No ClinGen gene-disease validity record for GJA8 is present in the reference
          cache or in the committed ClinGen export (cache/clingen/gene_validity.csv), so no gene_disease_validity
          assertion is recorded.'
        case_fractions:
        - population: Indian probands with congenital or developmental cataract
          case_fraction_percent: 3.3
          cohort_size: 60
          notes: Two of 60 unrelated probands screened by SSCP and sequencing.
        variants:
        - name: P88S (c.262C>T)
          description: Second transmembrane domain; zonular pulverulent cataract in the original CZP1
            family. Forms no channels, is a dominant negative inhibitor of wild-type Cx50, and accumulates
            intracellularly.
        - name: E48K
          description: First extracellular domain; zonular nuclear pulverulent cataract.
        - name: G46V (c.137G>T)
          description: First extracellular domain; congenital total cataract. Traffics normally but forms
            hyperactive hemichannels that kill expressing cells.
        - name: D51N (c.151G>A)
          description: First extracellular domain; severe microphthalmia and sclerocornea in a de novo
            case, and acorea-microphthalmia-cataract in a Japanese family.
        - name: c.670insA (p.Thr203AsnfsX47)
          description: Recessive frameshift that replaces the C-terminal region; the mutant is retained
            in the endoplasmic reticulum.
        - name: I247M (c.741G>T)
          description: Earlier proposed as a cataract allele; found in an unaffected parent and forms
            normal channels, so it is treated as a rare polymorphism.
      selected_evidence:
        snippet: These studies provide the first direct evidence that GJA8 plays a vital role in the maintenance
          of human lens transparency and identify the genetic defect believed to underlie the first inherited
          disease to be linked to a human autosome.
        supports: SUPPORT
