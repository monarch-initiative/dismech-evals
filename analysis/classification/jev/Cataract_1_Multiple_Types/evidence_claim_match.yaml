      assertion:
        discussion_id: gja8_allele_severity_spectrum
        kind: KNOWLEDGE_GAP
        prompt: Why do a few GJA8 missense alleles (G94R, D51N, G46E) cause microphthalmia, sclerocornea,
          aphakia or acorea, while most cause isolated cataract with or without microcornea?
        attaches_to:
        - has_subtypes#Severe ocular malformation
        - pathophysiology#Reduced Lens and Eye Growth
        rationale: The severe alleles cluster in specific residues and G94R correlates with sclerocornea
          across families, but the functional studies cited in this entry do not explain why these alleles
          add anterior segment and globe malformations. The mouse growth defect accounts for a small eye,
          not for sclerocornea or acorea.
      selected_evidence:
        snippet: Furthermore, we confirm an important genotype-phenotype correlation between sclerocornea
          and the p.(Gly94Arg) variant
        supports: SUPPORT
