            name: GJA8 Variant
            biological_scale: MOLECULAR
            conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
            description: 'Germline GJA8 variants alter connexin 50. Most are heterozygous missense substitutions,
              many in the first extracellular and transmembrane domains (P88S, P88Q, E48K, V44E, W45S,
              G46V, D47N, D51N, V79L); the recessive alleles are frameshifts that replace the C-terminal
              part of the protein. Different alleles act through different routes: absent channel function,
              failure to reach the plasma membrane, dominant inhibition of wild-type lens connexins, altered
              gating, or, for G46V, excess hemichannel activity.'
            genes:
            - preferred_term: GJA8
              term:
                id: hgnc:4281
                label: GJA8
            genetic_context:
              variant_origin: GERMLINE
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Loss of Connexin 50 Channel Function
        causal_link_type: DIRECT
        description: Most tested alleles form no functional gap junction channels on their own.
      selected_evidence:
        snippet: In contrast, the P88S mutant connexin failed to form functional gap junctional channels
          when paired homotypically.
        supports: SUPPORT
    origin:
