      assertion_type: Treatment
      assertion:
        name: Cataract Surgery
        description: Lens extraction for visually significant opacity, followed by optical correction
          (contact lens or intraocular lens) and amblyopia therapy. The cited outcomes come from infantile
          cataract cohorts of all causes. Visual axis opacification and glaucoma are the main long-term
          complications. No GJA8-specific therapy exists.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: cataract surgery
          term:
            id: NCIT:C157809
            label: Cataract Surgery
        target_phenotypes:
