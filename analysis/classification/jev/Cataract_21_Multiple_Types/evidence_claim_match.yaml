        prompt: How does a variant in a lens transcription factor produce a small cornea or iris coloboma,
          and why do these features vary between relatives with the same allele?
        rationale: Microcornea and coloboma recur in MAF families but affect only some carriers, and in
          mice the Ofl anterior segment phenotype depends on genetic background. The reports infer that
          the lens directs anterior segment development, but no study traces the steps from MAF to cornea
          or iris.
      selected_evidence:
        snippet: Three of the six members showed microcornea and one showed iris coloboma.
        supports: SUPPORT
