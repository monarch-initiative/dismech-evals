  15865515999dfef767bc87b2a451f88aa7701c590a787e349ebd205e8ea43f4f:
    claim:
      about:
        disease:
          name: Cataract 21 Multiple Types
          disease_term:
            preferred_term: cataract 21 multiple types
            term:
              id: MONDO:0012437
              label: cataract 21 multiple types
        context: []
      assertion_type: Genetic
      assertion:
        name: MAF
        gene_term:
          preferred_term: MAF
          term:
            id: hgnc:6776
            label: MAF
        relationship_type: CAUSATIVE
        association: Causative
        variant_origin: GERMLINE
        presence: PRESENT
        notes: MAF is also the gene for Ayme-Gripp syndrome; the published split is by domain, with C-terminal
          DNA-binding-domain variants causing isolated cataract and N-terminal transactivation-domain
          variants causing the syndrome. The c.177dup frameshift (transactivation domain, residue 60)
          was reported in a family described only as having congenital cataract. No ClinGen gene-disease
          validity record for MAF is cached in this repository, so gene_disease_validity is omitted.
        variants:
        - name: R288P (c.863G>C)
          description: Basic region; pulverulent cataract with variable microcornea and iris coloboma.
            Abolishes transactivation on a crystallin promoter element and mislocalizes MAF to nuclear
            foci.
        - name: K297R (c.890A>G)
          description: Basic region; cerulean cataract with microcornea in some carriers.
        - name: R299S (c.895C>A)
          description: Basic region; congenital cataract-microcornea.
        - name: V271E (c.812T>A)
          description: Extended homology region; nuclear and lamellar cataract; reduces transactivation
            of crystallin and non-crystallin genes.
        - name: Y301H (c.901T>C)
          description: Basic region; total congenital cataract in a Chinese family.
        - name: K308E (c.922A>G)
          description: Flanks the leucine zipper; de novo; bilateral nuclear and cortical congenital cataract
            without anterior segment anomalies.
        - name: Gln303 missense (reported as Q303L)
          description: Basic region; congenital cataract with microcornea in three and iris coloboma in
            one of six affected relatives. The abstract names Q303L; a later review tabulates the same
            family as c.908A>C (p.Gln303Pro).
        - name: L316P (c.947T>C)
          description: Leucine zipper; congenital cataract.
        - name: t(5;16)(p15.3;q23.2)
          description: Balanced and unbalanced translocation whose 16q23.2 breakpoint transects the MAF
            genomic-control domain; cataract, anterior segment dysgenesis and microphthalmia.
      selected_evidence:
        snippet: Through mutation screening of a panel of patients with hereditary congenital cataract
          we identified a mutation in MAF in a three-generation family with cataract, microcornea and
          iris coloboma.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11772997
      reference_title: Domain disruption and mutation of the bZIP transcription factor, MAF, associated
