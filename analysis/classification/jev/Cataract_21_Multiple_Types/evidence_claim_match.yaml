            term:
              id: MONDO:0012437
              label: cataract 21 multiple types
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pathogenic MAF Variant
        biological_scale: MOLECULAR
        description: 'Heterozygous germline MAF alleles, nearly all missense changes at conserved residues
          of the C-terminal DNA-binding domain: the extended homology region (V271E), the basic region
          (R288P, K297R, R299S, Y301H, Gln303) and the leucine zipper and its flank (K308E, L316P). One
          family carries a t(5;16)(p15.3;q23.2) translocation whose 16q23.2 breakpoint transects the MAF
          genomic-control domain, and one family carries an N-terminal frameshift (c.177dup). How each
          allele changes MAF function differs (see the downstream nodes and the dominance discussion).'
        genes:
        - preferred_term: MAF
          term:
            id: hgnc:6776
            label: MAF
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
          modifier: ABNORMAL
          description: The alleles alter the DNA-binding transcription factor in ways that differ between
            variants (loss of transactivation, selective change in DNA-binding specificity), so the change
            is recorded as ABNORMAL rather than a uniform decrease.
        cell_types:
        - preferred_term: lens fiber cell
          term:
            id: CL:0011004
            label: lens fiber cell
      selected_evidence:
        snippet: The mutation results in the substitution of an evolutionarily highly conserved arginine
          with a proline at residue 288 (R288P) in the basic region of the DNA-binding domain of MAF.
        supports: SUPPORT
