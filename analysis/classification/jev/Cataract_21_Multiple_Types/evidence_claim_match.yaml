      assertion_type: DifferentialDiagnosis
      assertion:
        name: Ayme-Gripp syndrome
        description: The allelic MAF disorder. It shares early bilateral cataract but is caused mainly
          by N-terminal transactivation-domain variants that impair GSK3 phosphorylation, and adds sensorineural
          hearing loss, seizures, developmental delay, short stature and a characteristic face. Where
          the variant lies in MAF is the main molecular discriminator.
        disease_term:
          preferred_term: Ayme-Gripp syndrome
          term:
            id: MONDO:0010992
            label: Ayme-Gripp syndrome
        distinguishing_features:
        - Sensorineural hearing loss, seizures, developmental delay and short stature are features of
          Ayme-Gripp syndrome and absent in cataract 21.
        - Ayme-Gripp variants are mostly in the N-terminal transactivation domain; cataract 21 variants
          are mostly in the C-terminal DNA-binding domain.
      selected_evidence:
        snippet: We demonstrated associations of variants in the MAF C-terminal DNA-binding domain with
          CCs and associations of variants in the N-terminal transactivation domain of MAF with AYGRPS.
        supports: SUPPORT
