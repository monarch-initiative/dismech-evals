        discussion_id: maf_dominant_mechanism
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Pathogenic MAF Variant
        - pathophysiology#Mutant MAF Sequestration in Nuclear Foci
        prompt: Do the dominant DNA-binding-domain alleles act by haploinsufficiency, by interfering with
          the wild-type protein, or by changing which targets MAF activates?
        rationale: Mice heterozygous for a Maf null allele have clear lenses while heterozygous R291Q
          (Ofl) mice have cataract, which argues against simple haploinsufficiency. R288P sequesters partner
          proteins in nuclear foci, Ofl selectively changes DNA-binding specificity, and a mouse transactivation-domain
          allele (D90V) increases rather than decreases target activation, so more than one mechanism
          may operate. None of these has been tested in human lens tissue.
      selected_evidence:
        snippet: Since mice heterozygous for knockouts of Maf show no cataracts, this suggests that the
          Ofl R291Q mutant protein has a dominant effect.
        supports: SUPPORT
