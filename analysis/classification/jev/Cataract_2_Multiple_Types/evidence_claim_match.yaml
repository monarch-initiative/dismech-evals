            term:
              id: MONDO:0100436
              label: cataract 2, multiple types
        context: []
      assertion_type: Genetic
      assertion:
        name: CRYGC
        gene_term:
          preferred_term: CRYGC
          term:
            id: hgnc:2410
            label: CRYGC
        relationship_type: CAUSATIVE
        association: Causative
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'Residue numbering differs between reports: some biophysical papers number the processed
          protein without the initiator methionine, so the same allele can appear with positions differing
          by one. Two Chinese four-generation W157X families with nuclear cataract and microcornea (PMID:19204787,
          c.470G>A; PMID:22876111, c.471G>A) may be the same family reported twice. No ClinGen gene-disease
          validity record for CRYGC is cached in this repository, so gene_disease_validity is omitted;
          the published ClinGen-protocol curation cited below is not a ClinGen-issued assertion.'
        variants:
        - name: T5P (p.Thr5Pro)
          description: Coppock-like cataract allele; misfolded, destabilized and largely insoluble.
        - name: c.119_123dup (p.Cys42AlafsX63)
          description: Five-base duplication in exon 2 causing a frameshift; variable zonular pulverulent
            cataract in a seven-generation family.
        - name: R168W (c.502C>T)
          description: Lamellar or nuclear cataract; native-like fold with increased self-aggregation.
        - name: G129C (c.385G>T)
          description: Nuclear cataract; disrupts the C-terminal domain and lowers stability.
        - name: W157X (c.470G>A / c.471G>A)
          description: Truncates the C-terminal 18 residues; nuclear cataract with microcornea; also reported
            de novo.
      selected_evidence:
        snippet: To our knowledge, these findings are the first evidence of an involvement of CRYGC and
          support the role of CRYGD in human cataract formation.
        supports: SUPPORT
    origin:
