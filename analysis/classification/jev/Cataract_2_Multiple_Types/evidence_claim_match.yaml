        prompt: How does a mutant lens crystallin produce a small cornea or small eye?
        rationale: Microcornea recurs in CRYGC families and microphthalmia has been reported with a de
          novo frameshift, but the studies here describe only protein aggregation and lens fiber cell
          stress. Nothing in this entry connects those lens events to growth of the cornea or globe, so
          these two phenotypes have no causal edge.
      selected_evidence:
        snippet: All affected individuals in this family exhibited nuclear cataracts and microcornea.
        supports: SUPPORT
