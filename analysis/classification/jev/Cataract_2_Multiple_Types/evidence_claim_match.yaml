        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Lens Light Scattering and Loss of Transparency
        prompt: Why does the same CRYGC allele cause very different cataract severity between relatives,
          and even between the two eyes of one person?
        rationale: The 5-bp duplication family has highly variable cataracts. In transgenic mice severity
          follows transgene expression level, but the cause of that variation is unknown and the authors
          suggest a stochastic process during lens development; this has not been tested in patients.
      selected_evidence:
        snippet: Although we currently do not have a good theory to explain the variability in CRYG5bpdup
          mRNA levels or phenotype, some sort of stochastic process during lens development seems likely
          based on the available data.
        supports: SUPPORT
