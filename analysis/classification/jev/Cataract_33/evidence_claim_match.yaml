        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BFSP1 Loss of Function
        biological_scale: MOLECULAR
        description: Recessive alleles are exon deletions predicted to shift the reading frame (exon 6;
          exons 3-5) or truncate the tail domain; dominant alleles include tail-domain missense (D348N,
          G602R), a splice-site variant and a tail-domain frameshift. In HEK293T cells the D348N mutant
          was expressed at lower levels than wild type. Whether dominant alleles act by haploinsufficiency
          or by interfering with filament co-assembly has not been resolved; mouse heterozygotes for a
          null allele do develop mild light scattering.
        genes:
        - preferred_term: BFSP1
          term:
            id: hgnc:1040
            label: BFSP1
        molecular_functions:
        - preferred_term: structural constituent of eye lens
          term:
            id: GO:0005212
            label: structural constituent of eye lens
          modifier: DECREASED
      selected_evidence:
        snippet: Direct sequencing revealed a 3343 bp deletion including exon 6 (c.736-1384_c.957-66 del)
          predicted to result in a shift of the open reading frame.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
