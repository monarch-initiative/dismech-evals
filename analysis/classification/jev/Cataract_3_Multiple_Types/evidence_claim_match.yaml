        description: Heterozygous variants in CRYBB2. The recurrent exon 6 nonsense allele Q155X (c.463C>T,
          also numbered c.475C>T) truncates the protein within the fourth Greek key motif. It, and the
          exon 5 changes R145W, Q147R and T150M, match the sequence of the pseudogene CRYBB2P1 about 230
          kb away and are explained by gene conversion from the pseudogene. Other alleles are missense
          changes across both domains (for example A2V, I21N, S31W, W59C, G119R, D128V, S143F, V146L,
          G149V, W151C, W151R, V187M, R188H, R188C) and further truncations such as Y154* and E167X. Most
          alleles cluster in exons 5 and 6, which encode the C-terminal domain.
        genes:
        - preferred_term: CRYBB2
          term:
            id: hgnc:2398
            label: CRYBB2
        molecular_functions:
        - preferred_term: structural constituent of eye lens
          term:
            id: GO:0005212
            label: structural constituent of eye lens
          modifier: ABNORMAL
          description: BetaB2-crystallin is a densely packed, soluble structural protein of the lens.
            Mutant protein is still made but is destabilized or aggregation-prone, so the structural role
            is altered qualitatively rather than only reduced; hence ABNORMAL.
        cell_types:
        - preferred_term: lens fiber cell
          term:
