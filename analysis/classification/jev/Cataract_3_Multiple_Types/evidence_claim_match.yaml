      assertion_type: Discussion
      assertion:
        discussion_id: crybb2_q155x_dominance
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#CRYBB2 Pathogenic Variant
        - inheritance#Autosomal Dominant
        prompt: Why does heterozygous Q155X cause dominant cataract when it arises by gene conversion,
          while heterozygous carriers of a CRYBB2-CRYBB2P1 fusion carrying the same exon 6 stop codon
          are unaffected?
        rationale: Q155X segregates as a dominant trait in many families, which together with the biophysical
          data suggests a harmful truncated protein. In one recessive family the same stop codon sits
          in a fusion gene whose 3' end comes from the pseudogene, and only homozygotes are affected;
          the authors suggest the fusion transcript may be unstable, but this has not been tested. Knockout
          mice show that loss of betaB2 alone causes a later cataract. Whether dominant alleles act by
          a toxic gain or a dominant-negative effect, and what level of mutant protein is needed, is unresolved.
      selected_evidence:
        snippet: The precise pathogenic mechanism of cataractogenesis due to the fusion of CRYBB2 and
          CRYBB2P1 remains unclear.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
