  081c32fa8c3dbd2b836bbbbe8a74a63bbaa3d813db793c76188e066d2f4d93f5:
    claim:
      about:
        disease:
          name: Cataract 3, Multiple Types
          disease_term:
            preferred_term: cataract 3 multiple types
            term:
              id: MONDO:0011104
              label: cataract 3 multiple types
        context: []
      assertion_type: Genetic
      assertion:
        name: CRYBB2
        gene_term:
          preferred_term: CRYBB2
          term:
            id: hgnc:2398
            label: CRYBB2
        relationship_type: CAUSATIVE
        association: Causative
        variant_origin: GERMLINE
        presence: PRESENT
        notes: The recurrent Q155X allele is numbered c.463C>T or c.475C>T in different reports. CRYBB2P1
          is over 97% identical to CRYBB2, so short-read sequencing can mismap reads between them, and
          gene-specific primers are needed to confirm an exon 5 or exon 6 call. No ClinGen gene-disease
          validity record for CRYBB2 is cached in this repository, so gene_disease_validity is omitted;
          the published ClinGen-protocol curation cited below is not a ClinGen-issued assertion. One consanguineous
          Pakistani family had recessive nuclear cataract from a homozygous 228-kb deletion that fuses
          CRYBB2 exons 1 to 5 to the Q155X-carrying exon 6 of CRYBB2P1, with unaffected heterozygous carriers;
          that family is described here but recessive inheritance is not asserted for this dominant entry.
        variants:
        - name: Q155X (c.463C>T)
          description: Recurrent exon 6 nonsense allele identical to the CRYBB2P1 sequence; cerulean,
            Coppock-like, pulverulent, coronary and polymorphic opacities in families of many ancestries.
        - name: R145W, Q147R, T150M (exon 5 gene conversion)
          description: Three exon 5 changes copied from CRYBB2P1 by a de novo gene conversion in an Ashkenazi
            Jewish family.
        - name: W151C (c.465G>C)
          description: Nuclear or progressive membranous cataract; destabilizes the protein and forms
            aggregates in lens epithelial cells.
        - name: A2V (c.5C>T)
          description: Posterior subcapsular cataract; impairs tetramer formation without unfolding the
            protein.
        - name: R188C
          description: Posterior polar cataract; destabilizes betaB2 and dissociates dimers.
        - name: V187M (c.607G>A)
          description: Congenital nuclear cataract in a Basotho family.
      selected_evidence:
        snippet: We report linkage in this family to the region on chromosome 22q that includes two beta
          crystallin genes (CRYBB2, CRYBB3) and one pseudogene (CRYBB2P1).
        supports: SUPPORT
    origin:
