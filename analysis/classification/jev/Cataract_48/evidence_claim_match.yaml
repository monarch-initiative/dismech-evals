        target: Epithelial Junction and E-cadherin Disorganization
        relationship: PARTIALLY_RECAPITULATES
        fidelity: LOW
        model_scale: CELLULAR
        description: Knockdown disrupts development of lens-secreting cells, E-cadherin localization and
          septate junction distribution, and halves electroretinogram amplitudes in young flies.
        limitations: The insect compound-eye lens is a secreted cuticular structure, not a cellular lens
          built from crystallin-filled fiber cells, and septate junctions are only functional counterparts
          of vertebrate tight junctions. The model shows a junctional defect, not lens opacity.
        divergences:
        - divergence_type: SPECIES_MISMATCH
