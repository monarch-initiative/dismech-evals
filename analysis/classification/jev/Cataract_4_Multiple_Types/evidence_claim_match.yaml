      assertion:
        discussion_id: p23t_morphological_variability
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Lens Light Scattering and Loss of Transparency
        - phenotypes#Coralliform cataract
        - phenotypes#Cerulean cataract
        - phenotypes#Aculeiform cataract
        prompt: Why does one CRYGD allele produce several distinct lens morphologies, sometimes in siblings?
        rationale: P23T has been reported with coralliform, cerulean, aculeiform, lamellar and fasciculiform
          cataract, and R58H with both aculeiform and coral-like cataract within one family. The biophysics
          of each mutant protein is well characterized, but nothing in this entry explains how the same
          condensed phase or crystal produces different spatial patterns of opacity. Modifier loci, the
          timing of mutant expression across fiber cell generations, and environmental factors are untested
          possibilities.
      selected_evidence:
        snippet: Coralliform cataract can represent variable expressivity for the same mutation rather
          than a distinct entity.
        supports: SUPPORT
