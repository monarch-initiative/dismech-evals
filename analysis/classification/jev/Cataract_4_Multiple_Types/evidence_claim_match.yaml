            term:
              id: MONDO:0007281
              label: cataract 4 multiple types
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CRYGD Pathogenic Variant
        biological_scale: MOLECULAR
        conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
        description: 'Heterozygous missense, nonsense and frameshift variants in CRYGD. Most pathogenic
          missense alleles change surface residues (R14C, P23T, R36S, R58H, E107A); others change structurally
          critical residues (W43R) or truncate the C-terminal Greek key motifs (W156X, Y134X, and frameshifts).
          The biophysical studies below attribute the cataract to properties gained by the mutant protein.
          One allele points the other way: in transfected cells R36P lowers the total and soluble amount
          of gamma-D crystallin without increasing the insoluble fraction, so a reduced soluble pool may
          contribute for some alleles; this has not been tested in lens.'
        genes:
        - preferred_term: CRYGD
          term:
            id: hgnc:2411
            label: CRYGD
        molecular_functions:
        - preferred_term: structural constituent of eye lens
          term:
            id: GO:0005212
            label: structural constituent of eye lens
          modifier: ABNORMAL
          description: Gamma-D crystallin serves the lens as a densely packed, highly soluble structural
            protein. Mutant protein is still made and often folds normally, but it no longer stays in
            solution with its neighbours; the structural role is altered qualitatively rather than reduced
            in amount, hence ABNORMAL rather than DECREASED.
        cell_types:
        - preferred_term: lens fiber cell
          term:
            id: CL:0011004
            label: lens fiber cell
      selected_evidence:
        snippet: A single base alteration resulting in an Arg- 14 --> Cys (R14C) substitution in gammaD-crystallin
          was subsequently identified.
        supports: SUPPORT
