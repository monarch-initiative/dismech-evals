      assertion_type: Treatment
      assertion:
        name: Cataract Surgery
        description: Lens extraction is the standard management of visually significant CRYGD cataract,
          performed from early infancy for dense congenital opacities and in childhood or adolescence
          for the progressive R14C cataract. In paediatric cataract generally it is lens aspiration with
          or without intraocular lens implantation, followed by amblyopia therapy, and for dense bilateral
          congenital cataract the timing of surgery in the first weeks of life governs visual outcome.
          The timing and technique evidence comes from cohorts that were not genotyped. Complications
          after paediatric cataract surgery include secondary membranes over the visual axis requiring
          re-operation and glaucoma, both more frequent after surgery in the first four weeks of life.
          No CRYGD-specific therapy exists.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: cataract surgery
          term:
            id: NCIT:C157809
            label: Cataract Surgery
        target_phenotypes:
        - preferred_term: Developmental cataract
          term:
            id: HP:0000519
            label: Developmental cataract
      selected_evidence:
        snippet: The opacification evolves relatively slowly, generally necessitating removal of the lens
          in childhood or early adolescence.
        supports: SUPPORT
