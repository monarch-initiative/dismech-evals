    claim:
      about:
        disease:
          name: Cataract 4, Multiple Types
          disease_term:
            preferred_term: cataract 4 multiple types
            term:
              id: MONDO:0007281
              label: cataract 4 multiple types
        context: []
      assertion_type: Genetic
      assertion:
        name: CRYGD
        gene_term:
          preferred_term: CRYGD
          term:
            id: hgnc:2411
            label: CRYGD
        relationship_type: CAUSATIVE
        association: Causative
        variant_origin: GERMLINE
        presence: PRESENT
        notes: Residue numbering differs between reports. Much of the biophysical literature numbers the
          processed protein without the initiator methionine (R14C, P23T, R36S, R58H, W42R), while HGVS
          numbering from the coding sequence adds one (p.R15C, p.P24T, p.R37S, p.R59H, p.W43R). The recurrent
          c.70C>A (P23T, p.P24T) allele has been reported in Moroccan, Indian, Australian, Caucasian,
          Saudi and Chinese families. No ClinGen gene-disease validity record for CRYGD is cached in this
          repository, so gene_disease_validity is omitted; the published ClinGen-protocol curation cited
          below is not a ClinGen-issued assertion.
        variants:
        - name: R14C (p.Arg15Cys)
          description: Introduces an exposed cysteine; causes progressive juvenile-onset cataract through
            thiol-mediated oligomerization.
        - name: P23T (p.Pro24Thr, c.70C>A)
          description: Recurrent allele with markedly lowered, retrograde solubility; associated with
            coralliform, cerulean, aculeiform, lamellar and fasciculiform cataract.
        - name: R36S (p.Arg37Ser)
          description: Crystal-forming allele causing crystalline cataract.
        - name: R58H (p.Arg59His)
          description: Crystal-forming allele recurrent in aculeiform cataract.
        - name: W43R (p.Trp43Arg, c.127T>C)
          description: Destabilizing allele causing congenital nuclear cataract.
        - name: Y151X (c.451_452insGACT)
          description: Truncating allele in Greek key motif 4 that destabilizes the protein and forms
            insoluble aggregates in cultured cells.
      selected_evidence:
        snippet: A genome-wide search in our kindred revealed linkage at 2q33-35 where the gamma-crystallin
          gene cluster resides.
        supports: SUPPORT
    origin:
