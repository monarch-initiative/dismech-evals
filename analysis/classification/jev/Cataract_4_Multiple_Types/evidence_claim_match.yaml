        prompt: Can a small molecule that restores mutant gamma-D crystallin solubility prevent or slow
          opacity in vivo?
        rationale: Surgery is the only treatment. A chemical chaperone, sodium 4-phenylbutyrate, restored
          solubility of a frameshift mutant in cultured cells, and second-site substitutions near residue
          23 restore P23T solubility in vitro, but no study reviewed here tested a solubility-restoring
          agent in a Crygd mouse or in patients. The progressive R14C form, whose lenses are clear at
          birth, is the setting where such an agent could matter most.
      selected_evidence:
        snippet: We examined the mutants P23S, P23V, P23TInsP24, and P23TN24K and found that the latter
          two mutations can restore the solubility of the P23T mutant.
        supports: SUPPORT
