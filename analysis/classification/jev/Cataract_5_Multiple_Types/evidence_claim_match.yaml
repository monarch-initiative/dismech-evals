      assertion_type: Subtype
      assertion:
        name: Autosomal dominant
        display_name: Autosomal dominant HSF4 cataract (lamellar and Marner)
        description: Heterozygous HSF4 missense variants in the DNA-binding domain, segregating with lamellar
          cataract in Chinese and British families and with Marner cataract in a large Danish pedigree.
          Variants are proposed to act as dominant negatives on the HSF4 trimer.
      selected_evidence:
        snippet: We screened individuals of three Chinese families for mutations in HSF4 (a gene at this
          locus that encodes heat-shock transcription factor 4) and discovered that in each family, a
          distinct missense mutation, predicted to affect the DNA-binding domain of the protein, segregates
          with the disorder.
        supports: SUPPORT
