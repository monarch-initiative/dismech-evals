            label: HSF4
        association: Causative
        relationship_type: CAUSATIVE
        notes: Dominant alleles cluster in the DNA-binding domain (p.Lys64Glu on NM_001040667.2 in the
          British family; older reports number residues one higher than newer transcripts). Recessive
          alleles include c.1327+4A>G, c.595_599delGGGCC and c.1213C>T p.(Arg405*). The p.Arg116His variant
          reported in age-related cataract and in about 2% of controls produces lamellar cataract in transgenic
          mice, suggesting reduced penetrance or under-ascertainment of mild opacities. No ClinGen gene-disease
          validity record for this pair was found in the local cache.
      selected_evidence:
        snippet: Here, we demonstrate via BAC (bacterial artificial chromosome) transgenesis that p.Arg116His
          recreates the childhood lamellar cataract in mice suggesting that incomplete penetrance associated
          with early cataracts may not be an absence but a limitation of the detection of the phenotype.
        supports: SUPPORT
