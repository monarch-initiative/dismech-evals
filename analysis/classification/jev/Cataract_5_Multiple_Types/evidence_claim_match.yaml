          families with congenital cataract. MONDO has no separate term for this form; it is kept here
          because the gene and the downstream lens mechanism are shared.
      selected_evidence:
        snippet: This is the first report describing association of an autosomal recessive cataract with
          the HSF4 locus on 16q21-q22.1
        supports: SUPPORT
