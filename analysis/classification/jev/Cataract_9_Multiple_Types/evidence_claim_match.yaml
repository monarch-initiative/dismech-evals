      assertion:
        name: CRYAA Dominant Missense Variant
        biological_scale: MOLECULAR
        conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
        description: 'Heterozygous missense substitutions, mostly at arginine residues in the N-terminal
          region (R12, R21, R49, R54) or the alpha-crystallin domain (R116), alter alphaA-crystallin structure.
          The effect on chaperone activity is allele-dependent: R116C and R116H lose most activity, R12C,
          R21L and R21W lose a moderate amount, and R49C and R54C retain normal activity against the ADH
          client in vitro, so reduced chaperone capacity is not the only route to disease.'
        genes:
        - preferred_term: CRYAA
          term:
            id: hgnc:2388
            label: CRYAA
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
        molecular_functions:
        - preferred_term: alphaA-crystallin chaperone (holdase) activity
          term:
            id: GO:0044183
            label: protein folding chaperone
          modifier: DECREASED
      selected_evidence:
        snippet: Chaperone-like activity of the alphaA R116C mutant is approximately 4-fold lower than
          wild type, whether measured before or after conversion to a polydisperse population with incubation.
        supports: SUPPORT
