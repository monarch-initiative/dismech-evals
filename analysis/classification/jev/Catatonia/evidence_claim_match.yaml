      assertion_type: Treatment
      assertion:
        name: Amantadine and memantine
        description: Uncompetitive NMDA receptor antagonists used as second-line pharmacotherapy when
          benzodiazepines fail or are not tolerated. Amantadine additionally enhances central dopamine
          release and delays synaptic dopamine reuptake, which is the proposed reason it suits a syndrome
          hypothesised to involve hypodopaminergic tone. The supporting literature is case reports and
          case series rather than trials, so this is curated as a mechanistically motivated second-line
          option, not an established one.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: amantadine
            term:
              id: CHEBI:2618
              label: amantadine
          - preferred_term: memantine
            term:
              id: CHEBI:64312
              label: memantine
        notes: Curated from the BAP consensus guideline's own summary of the case-report and case-series
          literature (18 amantadine cases across 11 articles, plus later additions). No controlled trial
          evidence exists for either agent in catatonia.
      selected_evidence:
        snippet: Medications such as amantadine and memantine serve as uncompetitive antagonists of the
          NMDA receptor and thus may be helpful in patients with catatonia.
        supports: SUPPORT
