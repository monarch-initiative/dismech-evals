        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Distributed Psychomotor Network Destabilization
        - pathophysiology#Orbitofrontal Emotional-Motor Processing Dysfunction
        prompt: How much of the imaging evidence for the distributed-network model is an artifact of studying
          schizophrenia-spectrum patients in the post-acute state rather than catatonia in the acute state
          across its full diagnostic range?
        rationale: The two limitations compound. The multimodal MRI evidence comes from a schizophrenia-spectrum
          sample, and the orbitofrontal fMRI evidence comes from post-acute patients whose authors explicitly
          interpret the finding as a trait marker of predisposition rather than a state correlate. A network
          signature derived under both constraints may describe the vulnerability of one diagnostic group
          rather than the mechanism of the acute syndrome. This is a limit on how causally the hub node
          may be read, and it is recorded rather than smoothed over.
      selected_evidence:
        snippet: key limitations remain, including the overrepresentation of schizophrenia-spectrum samples
          and limited acute-state data
        supports: SUPPORT
