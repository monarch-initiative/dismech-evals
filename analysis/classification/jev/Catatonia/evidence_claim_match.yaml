      assertion_type: DifferentialDiagnosis
      assertion:
        name: Neuroleptic malignant syndrome
        description: Malignant catatonia and neuroleptic malignant syndrome share precipitants (dopamine
          antagonist exposure), an overlapping motor phenotype, and autonomic instability. Whether they
          are one entity or two has been debated for decades and is not settled here.
        distinguishing_features:
        - NMS is defined by a temporal relationship to dopamine-antagonist exposure, whereas malignant
          catatonia may arise without it.
        - In practice the distinction is often retrospective, and treatment converges on withdrawal of
          the offending agent, supportive care, and ECT.
      selected_evidence:
        snippet: abulia/akinetic mutism, delirium, major neurocognitive disorders, locked-in syndrome,
          late-stage Parkinson's disease, stiff-person syndrome, akathisia, mania, malignant catatonia/neuroleptic
          malignant syndrome, autoimmune encephalitis, and serotonin syndrome
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
