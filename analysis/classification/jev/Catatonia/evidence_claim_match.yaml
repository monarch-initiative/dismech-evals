      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: immune_mediated_model
        hypothesis_label: Immune-mediated NMDA receptor perturbation in autoimmune subgroups
        status: EMERGING
        description: In a mechanistically distinct subgroup, catatonia arises from autoimmune perturbation
          of glutamatergic signaling — most clearly in NMDA receptor antibody encephalitis, where catatonia
          is present in a majority of reported cases. The subgroup matters clinically because its treatment
          is immunotherapy directed at the antibody-mediated process, not only benzodiazepines. The arm
          is EMERGING rather than established as a general mechanism because it accounts for a subgroup
          rather than the syndrome, and because peripheral inflammatory biomarkers remain nonspecific.
      selected_evidence:
        snippet: Immune mechanisms are particularly relevant in subgroups, especially in autoimmune encephalitis
          and inflammatory CNS conditions, whereas peripheral biomarkers remain nonspecific.
        supports: SUPPORT
    origin:
