      assertion_type: Pathophysiology
      assertion:
        name: Heterogeneous Upstream Liability
        biological_scale: ORGANISM
        description: 'The entry point to catatonia is not a single lesion but any of a wide range of upstream
          conditions: mood disorders, schizophrenia-spectrum illness, autism, autoimmune encephalitis
          (particularly NMDA receptor encephalitis), systemic lupus erythematosus, thyroid disease, epilepsy,
          and medication-induced or withdrawal states. This node exists so that the downstream mechanism
          can be curated once and referenced from the many disorders in which catatonia appears, rather
          than duplicated per disease. Genetic and developmental data are consistent with this framing:
          they support vulnerability rather than a single syndrome-specific architecture.'
      selected_evidence:
        snippet: It can occur in a wide range of psychiatric and neurological conditions, including depression,
          mania, schizophrenia, autism, autoimmune encephalitis (particularly NMDAR encephalitis), systemic
          lupus erythematosus, thyroid disease, epilepsy and medication-induced and -withdrawal states.
        supports: SUPPORT
    origin:
