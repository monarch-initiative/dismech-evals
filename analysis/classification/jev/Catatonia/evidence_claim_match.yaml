              label: catatonia
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: gabaergic_deficit_model
        hypothesis_label: Cortical GABA-A receptor deficit as the proximate substrate of the akinetic
          form
        status: ALTERNATIVE
        description: The oldest mechanistically specific account starts from the syndrome's most striking
          pharmacological fact — akinesia and anxiety that remit within minutes of lorazepam — and locates
          the lesion at the GABA-A receptor. In vivo benzodiazepine-receptor SPECT in akinetic catatonia
          found reduced iomazenil binding in the left sensorimotor cortex, interpreted as decreased GABA-A
          receptor density, with symptom severity correlating with the binding deficit. This is recorded
          as ALTERNATIVE rather than CANONICAL because it is a single small study of the akinetic subtype,
          and because the broader neurochemical evidence points to interacting rather than single-transmitter
          disturbance.
      selected_evidence:
        snippet: Reduced iomazenil binding suggests decreased density of GABA-A receptors in the left
          sensorimotor cortex in akinetic catatonia.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:10486389
      reference_title: 'Decreased density of GABA-A receptors in the left sensorimotor cortex in akinetic
        catatonia: investigation of in vivo benzodiazepine receptor binding.'
      evidence_source: HUMAN_CLINICAL
      explanation: Direct in vivo receptor-imaging evidence for the GABA-A deficit this hypothesis is
        built on.
