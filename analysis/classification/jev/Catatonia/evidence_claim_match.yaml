      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: striatal_dopamine_hypofunction_model
        hypothesis_label: Reduced striatal dopaminergic transmission as a transdiagnostic psychomotor
          substrate
        status: ALTERNATIVE
        description: 'A parallel account places the proximate lesion in the dorsal striatum, proposing
          that reduced dopaminergic transmission is a transdiagnostic substrate for psychomotor retardation
          shared by Parkinson disease, drug-induced parkinsonism, neuroleptic malignant syndrome, catatonia,
          and depression. Two clinical observations anchor it: dopamine antagonists can induce catatonia,
          and dopaminergic medication can relieve it. It is recorded as ALTERNATIVE because the primary
          evidence is a hypothesis-level synthesis about psychomotor retardation broadly rather than catatonia
          specifically, and because CSF dopamine-catabolite measurement has been inconsistent and nonspecific.'
      selected_evidence:
        snippet: Parkinson's disease and catatonia generally respond well to dopaminergic medication.
          In contrast, dopamine antagonists can induce both parkinsonism and catatonia.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/2
      evidence_path: /mechanistic_hypotheses/2/evidence/1
