      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: distributed_psychomotor_network_model
        hypothesis_label: Catatonia as distributed psychomotor network dysfunction, not a single-lesion
          disorder
        status: CANONICAL
        description: 'The best-supported current model treats catatonia as a final common phenotype of
          disturbed psychomotor regulation. Heterogeneous upstream liabilities converge on a shared set
          of networks — cortico-striatal-thalamic, cortico-cerebellar, orbitofrontal, cingulate, and motor-premotor
          — destabilizing them and producing a recognizable but internally heterogeneous syndrome. The
          model''s explanatory strength is that it accommodates the syndrome''s transdiagnostic breadth,
          which any schizophrenia-centered or single-transmitter account fails to do. Its principal weakness
          is sampling: the imaging literature is dominated by schizophrenia-spectrum cohorts and by post-acute
          rather than acute states.'
      selected_evidence:
        snippet: The best-supported mechanistic model to date comes from neuroimaging studies implicating
          cortico-striatal-thalamic, cortico-cerebellar, orbitofrontal, cingulate, and motor-premotor
          networks.
        supports: SUPPORT
