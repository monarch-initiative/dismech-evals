      assertion:
        discussion_id: catatonia_evidence_quality_ceiling
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Distributed Psychomotor Network Destabilization
        prompt: Can treatment recommendations for catatonia be raised above their current evidence ceiling,
          given that first-line therapy rests on observational studies and case series rather than randomized
          trials?
        rationale: Catatonia is unusual in that its first-line treatments are both effective and poorly
          evidenced by contemporary standards. The BAP consensus guideline states plainly that clinical
          trials were uncommon and that its recommendations are mainly informed by small observational
          studies, case series, and case reports. The 76% lorazepam response rate curated in this entry
          comes from an open, non-randomized prospective protocol in 28 patients. Any downstream use of
          this entry for therapeutic inference should carry that ceiling with it.
      selected_evidence:
        snippet: Clinical trials were uncommon, and the recommendations in this guideline are mainly informed
          by small observational studies, case series and case reports, which highlights the need for
          randomised controlled trials and prospective cohort studies in this area.
        supports: SUPPORT
