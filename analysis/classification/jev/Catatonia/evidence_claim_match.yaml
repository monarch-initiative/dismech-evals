            label: microglial cell
        biological_processes:
        - preferred_term: glutamate receptor signaling pathway
          term:
            id: GO:0007215
            label: glutamate receptor signaling pathway
          modifier: DECREASED
        - preferred_term: microglial cell activation
          term:
            id: GO:0001774
            label: microglial cell activation
          modifier: INCREASED
      selected_evidence:
        snippet: The most prevalent signs were immobility/stupor (70%), mutism (67%), excitement (50%),
          posturing/catalepsy (34%), stereotypies (31%), and rigidity (30%).
        supports: SUPPORT
