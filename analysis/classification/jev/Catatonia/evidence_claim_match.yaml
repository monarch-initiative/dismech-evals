            label: G protein-coupled dopamine receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Neuroimaging studies also generally support the association of psychomotor retardation
          with reduced dopaminergic transmission, particularly in the dorsal striatum.
        supports: SUPPORT
