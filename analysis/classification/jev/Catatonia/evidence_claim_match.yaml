      assertion_type: Discussion
      assertion:
        discussion_id: catatonia_no_unified_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Distributed Psychomotor Network Destabilization
        prompt: Is there a single mechanism or biomarker that accounts for catatonia across its psychiatric,
          neurologic, autoimmune, and medical contexts, or is the convergent-network account the correct
          final level of explanation?
        rationale: 'This is the central open question of the entry and the reason the pathophysiology
          is curated as several parallel routes into one hub rather than as a single chain. The literature
          is explicit that no single biomarker or unified mechanism fully accounts for catatonia across
          contexts, and that the neurochemical evidence describes interacting rather than single-transmitter
          disturbance. Resolving it matters practically: if the convergent-network account is correct,
          subtype-sensitive treatment selection is the achievable goal and a universal catatonia biomarker
          is not.'
        proposed_experiments:
        - experiment_id: exp_catatonia_acute_state_multimodal_cohort
          name: Prospective acute-state multimodal phenotyping across upstream causes
          description: 'Recruit an acute-state catatonia cohort stratified by upstream cause (mood disorder,
            schizophrenia-spectrum, autoimmune encephalitis, medical or drug-induced) and acquire the
            same multimodal battery in every stratum: resting-state and emotional-task fMRI, GABA-A receptor
            imaging, striatal dopaminergic imaging, CSF and serum neuronal autoantibodies, and dimensional
            Bush-Francis and Northoff scale scoring. The discriminating test is whether the network signature
            is shared across strata while the neurochemical signature differs by stratum — the prediction
            of the convergent model — or whether each stratum has its own network signature.'
      selected_evidence:
        snippet: No single biomarker or unified mechanism fully accounts for catatonia across contexts.
        supports: SUPPORT
