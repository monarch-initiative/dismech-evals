      assertion_type: Genetic
      assertion:
        name: Chromosome 15q15 periodic catatonia susceptibility locus
        presence: Linkage confirmed in a subset of multiplex families
        relationship_type: SUSCEPTIBILITY
        association: Periodic catatonia, a familial sub-phenotype with recurrent hyperkinetic and akinetic
          psychomotor episodes, maps to a major susceptibility locus on chromosome 15q15, confirmed in
          a second independent genome scan. No causal gene has been established at the locus, and the
          same study demonstrated genetic heterogeneity between families, so this is recorded as a susceptibility
          locus rather than as a catatonia gene.
        notes: Linkage-era evidence. The locus has not been resolved to a gene, and subsequent candidate-gene
          work in the region was negative; treat as historical support for familial aggregation in a sub-phenotype
          rather than as an actionable genetic finding.
      selected_evidence:
        snippet: Here, we confirm mapping of a major gene locus on chromosome 15q15 in a second genome
          scan in a new set of four multiplex families.
        supports: SUPPORT
