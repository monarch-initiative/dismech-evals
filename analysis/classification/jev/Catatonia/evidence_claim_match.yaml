        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Autonomic Decompensation
        - pathophysiology#Reduced Striatal Dopaminergic Transmission
        prompt: Are malignant catatonia and neuroleptic malignant syndrome one entity with two names,
          or two entities that share a striatal dopaminergic substrate?
        rationale: The two syndromes share precipitants, an overlapping motor phenotype, autonomic instability,
          and a treatment pathway that converges on withdrawing the offending agent and ECT. The striatal-dopamine
          hypothesis supplies a mechanism that would unify them. Against unification, malignant catatonia
          occurs without dopamine-antagonist exposure. The question is recorded as an open controversy
          because the entity distinction currently rests on exposure history rather than on any mechanistic
          discriminator.
      selected_evidence:
        snippet: In addition, there are close epidemiological relationships between depression and Parkinson's
          disease, and between catatonia and neuroleptic malignant syndrome.
        supports: SUPPORT
