        context: []
      assertion_type: Genetic
      assertion:
        name: TGDS
        gene_term:
          preferred_term: TGDS
          term:
            id: hgnc:20324
            label: TGDS
        relationship_type: CAUSATIVE
        association: Biallelic germline loss-of-function variants
        variant_origin: GERMLINE
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_394662b6-d975-4041-a9ea-308f0d6e1bee-2024-07-18T160000.000Z
        notes: Reported alleles are mostly missense, with one frameshift (c.270_271del, p.Lys91Asnfs*22)
          in the gene-discovery cohort. c.298G>T (p.Ala100Ser) recurs and was shown by haplotype reconstruction
          to be probably a founder allele. TGDS is not found in every patient given a clinical diagnosis
          of Catel-Manzke syndrome (PMID:31923704). Patients with a Catel-Manzke-like phenotype and variants
          in KYNU or IMPAD1 (now BPNT2) are curated under their own diseases and listed here as differential
          diagnoses, not as additional causal genes; see the entry-level notes. UXS1 appears in this entry
          only as the downstream enzyme in the mechanism.
      selected_evidence:
        snippet: Due to the spectrum of the amino acid changes, we suggest that loss of function in TGDS
          is the underlying mechanism of Catel-Manzke syndrome.
        supports: SUPPORT
