  e1e62b04899a2ed125779f13351ecbb29be31090be2c0818e7c694207c51740b:
    claim:
      about:
        disease:
          name: Catel-Manzke Syndrome
          disease_term:
            preferred_term: Catel-Manzke syndrome
            term:
              id: MONDO:0014507
              label: Catel-Manzke syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deficient UDP-4-keto-6-deoxyglucose Production
        biological_scale: MOLECULAR
        description: 'TGDS converts UDP-glucose to UDP-4-keto-6-deoxyglucose. This product resembles the
          reaction intermediate of UXS1 and acts as an "enzyme-rescue metabolite": it lets UXS1 regenerate
          its bound NAD+ cofactor in a compartment where free NAD+ is scarce. With TGDS deficient, too
          little of the metabolite is made.'
        chemical_entities:
        - preferred_term: UDP-4-keto-6-deoxyglucose
          term:
            id: CHEBI:16553
            label: UDP-4-dehydro-6-deoxy-D-glucose
          modifier: DECREASED
      selected_evidence:
        snippet: We found that the enzyme TGDS produces UDP-4-keto-6-deoxyglucose, a mimic of the reaction
          intermediate of the enzyme UXS1, which regenerates the essential cofactor NAD+ within the catalytic
          pocket of UXS1 by completing its catalytic cycle.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40836090
      reference_title: A missing enzyme-rescue metabolite as cause of a rare skeletal dysplasia.
