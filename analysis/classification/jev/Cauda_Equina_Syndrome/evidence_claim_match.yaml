            label: Guillain-Barre syndrome
        description: An acute autoimmune polyradiculoneuropathy can mimic compressive CES with weakness,
          reduced reflexes and sensory or autonomic involvement. Symmetric ascending weakness and root
          enhancement without a compressive lesion favor GBS. Acute inflammatory demyelinating polyradiculoneuropathy
          is a common GBS subtype, not a synonym for every GBS case.
        distinguishing_features:
        - Autoimmune polyradiculoneuropathy without a concordant compressive lesion.
        - Typically symmetric ascending weakness with hyporeflexia.
        - Root thickening and enhancement can occur; imaging is interpreted with the clinical course.
      selected_evidence:
        snippet: Guillain-Barré syndrome, neurosarcoidosis, and MOGAD may cause nerve root thickening
          and enhancement
