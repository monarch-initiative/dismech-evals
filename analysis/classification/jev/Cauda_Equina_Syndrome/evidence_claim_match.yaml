        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Conus medullaris syndrome
        description: Injury to the conus medullaris (spinal cord termination, ~T12-L2) rather than the
          nerve roots below it. It overlaps clinically with CES but tends to produce earlier, more symmetric
          bladder and bowel dysfunction and mixed upper- and lower-motor-neuron signs, whereas CES is
          a pure lower-motor-neuron root syndrome that is often asymmetric.
        distinguishing_features:
        - Lesion at the T12-L2 conus level rather than nerve-root compression below the conus.
        - Mixed upper- and lower-motor-neuron signs, versus the pure lower-motor-neuron pattern of CES.
        - Earlier and more symmetric bladder/bowel involvement than typical CES.
      selected_evidence:
        snippet: Conus medullaris syndrome results from damage at the T12-L2 level, while cauda equina
          syndrome arises from nerve root compression below the conus
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
