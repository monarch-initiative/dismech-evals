  63a00d2425c42a556c7bfbbfd702231a3905151d5b2a23918987279fa9ed6c14:
    claim:
      about:
        disease:
          name: Cauda Equina Syndrome
          disease_term:
            preferred_term: cauda equina syndrome
            term:
              id: MONDO:0005693
              label: cauda equina syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: CESR
        display_name: Cauda equina syndrome with retention (CESR)
        description: 'CES with retention: painless urinary retention with overflow incontinence and loss
          of executive bladder control. CESR is the more severe pole of the two-stage classification and
          is associated with a worse prognosis, often described as the "point of no return." Todd (PMID:19416598)
          frames the transition to complete CES as the point at which the bladder becomes paralysed, producing
          painless retention of urine with overflow incontinence; he argues CESI should be decompressed
          urgently before this transition because outcomes at CESI are generally favourable whereas outcomes
          after bladder paralysis are less favourable.'
      selected_evidence:
        snippet: The two-stage system of incomplete CES (CESI) versus CES with retention (CESR) is the
          most commonly used classification, and has prognostic value
        supports: SUPPORT
