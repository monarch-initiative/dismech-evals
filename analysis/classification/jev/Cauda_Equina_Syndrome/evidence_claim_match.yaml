          bladder and bowel dysfunction and mixed upper- and lower-motor-neuron signs, whereas CES is
          a pure lower-motor-neuron root syndrome that is often asymmetric.
        distinguishing_features:
        - Lesion at the T12-L2 conus level rather than nerve-root compression below the conus.
        - Mixed upper- and lower-motor-neuron signs, versus the pure lower-motor-neuron pattern of CES.
        - Earlier and more symmetric bladder/bowel involvement than typical CES.
