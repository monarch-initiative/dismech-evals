          value:
            name: Cauda equina nerve root compression
            description: Space-occupying compression within the lumbar spinal canal mechanically compresses
              the lumbosacral nerve roots of the cauda equina. The most common cause is a large central
              (midline) lumbar intervertebral disc herniation; other causes include tumor, epidural abscess,
              epidural hematoma, trauma or fracture, and severe lumbar spinal stenosis.
            cell_types:
            - preferred_term: neuron
              term:
                id: CL:0000540
                label: neuron
            locations:
            - preferred_term: cauda equina
              term:
                id: UBERON:0012337
                label: cauda equina
            - preferred_term: vertebral canal
              term:
                id: UBERON:0006692
                label: vertebral canal
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Nerve root ischemia and demyelination
        description: Mechanical compression of the nerve roots reduces microvascular perfusion and venous
          outflow, producing nerve root ischemia and demyelination.
      selected_evidence:
        snippet: Compression of the spinal cord or nerve roots may lead to structural neuronal damage,
          neuronal ischemia or edema, and axonal transport block.
        supports: SUPPORT
