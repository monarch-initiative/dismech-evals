              label: cauda equina syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: CESI
        display_name: Incomplete cauda equina syndrome (CESI)
        description: 'Incomplete CES: altered urinary sensation or difficulty voiding with retained executive
          bladder control. CESI is the earlier, less severe pole of the most commonly used two-stage classification
          and carries a more favorable prognosis than CESR. In Todd''s operational definition (Todd NV,
          An algorithm for suspected cauda equina syndrome, Ann R Coll Surg Engl 2009;91:358-9, PMID:19416598),
          CESI is present when there is subjective and/or objective neurological loss - impaired bladder,
          urethral, or rectal sensation, and/or objective genital/peri-anal (S3-S5) sensory disturbance
          and/or reduced anal tone - provided the bladder is still functioning normally.'
      selected_evidence:
        snippet: The two-stage system of incomplete CES (CESI) versus CES with retention (CESR) is the
          most commonly used classification, and has prognostic value
        supports: SUPPORT
