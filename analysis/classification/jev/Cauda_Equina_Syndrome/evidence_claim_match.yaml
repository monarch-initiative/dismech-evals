        prompt: Which clinical features, alone or combined, can reliably identify patients with MRI-proven
          cauda equina syndrome and safely triage who needs emergent imaging?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - diagnosis#Emergency MRI of the lumbosacral spine
        rationale: 'Because history and examination poorly discriminate true from suspected CES, a large
          majority of urgently scanned patients have no compressive pathology, yet no validated clinical
          decision rule exists to reduce unnecessary out-of-hours MRI without missing true cases. Todd
          (PMID:19416598) notes a key confounder for the sentinel urinary symptom: the commonest cause
          of difficulty passing urine in patients with lumbar degenerative disorders is pain rather than
          a cauda equina syndrome, though that difficulty cannot safely be attributed to pain alone.'
        posed_date: '2026-07-10T00:00:00Z'
      selected_evidence:
        snippet: There is low evidence that individual symptoms or signs from the patient history or clinical
          examination, respectively, can be used to diagnose CES
        supports: SUPPORT
