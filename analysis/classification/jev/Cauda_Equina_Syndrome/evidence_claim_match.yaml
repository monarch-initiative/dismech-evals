            description: Space-occupying compression within the lumbar spinal canal mechanically compresses
              the lumbosacral nerve roots of the cauda equina. The most common cause is a large central
              (midline) lumbar intervertebral disc herniation; other causes include tumor, epidural abscess,
              epidural hematoma, trauma or fracture, and severe lumbar spinal stenosis.
            cell_types:
