      assertion_type: Stage
      assertion:
        name: CESI
        description: Incomplete CES includes neurogenic urinary difficulties while voluntary executive
          bladder control and the ability to void are retained. Altered perineal sensation is common but
          not mandatory.
        notes: Clinical severity categories from the comprehensive classification assembled by Lavy et
          al., not distinct etiological subtypes or a mandatory sequence traversed by every patient.
      selected_evidence:
        snippet: They define CESI as CES where there are urinary difficulties of neurogenic origin such
          as altered urinary sensation, loss of desire to void, poor stream or the need to strain, but
          there is still executive control of bladder function and voiding is possible even if difficult.
        supports: SUPPORT
        directness: DIRECT
