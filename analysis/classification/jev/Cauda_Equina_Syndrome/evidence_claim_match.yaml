      assertion:
        name: Scan-negative suspected CES and noncompressive radiculopathy
        description: Many patients investigated for CES have no concordant cauda equina compression on
          MRI. This finding prompts assessment for other neurological, urological, pain-related or functional
          explanations; the absence of a single bedside sign does not establish a benign cause.
        distinguishing_features:
        - No concordant cauda equina compression on appropriately reviewed MRI.
        - Clinical symptoms overlap; absent saddle sensory loss or retention alone cannot exclude compressive
          CES before imaging.
      selected_evidence:
        snippet: many MRI scans obtained from patients presenting with signs and/or symptoms of CES do
          not reveal concordant pathology
        supports: SUPPORT
