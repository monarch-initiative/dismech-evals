        name: Nerve root ischemia and demyelination
        description: Compression of the cauda equina nerve roots impairs their microcirculation and axoplasmic
          transport, causing intraneural edema, ischemia, and demyelination. Sustained compression leads
          to axonal injury and irreversible nerve root damage, which is why timely decompression is critical.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
