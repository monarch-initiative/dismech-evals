      assertion_type: Discussion
      assertion:
        discussion_id: disc_ces_clinical_prediction
        prompt: Which clinical features, alone or combined, can reliably identify patients with MRI-proven
          cauda equina syndrome and safely triage who needs emergent imaging?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - diagnosis#Emergency MRI of the lumbosacral spine
        rationale: Symptoms and examination findings alone have limited diagnostic discrimination. Low
          residual bladder volume can occur with confirmed compression. Safer triage strategies remain
          a research question; this uncertainty must not be used to withhold urgent MRI when CES is suspected.
        posed_date: '2026-07-10T00:00:00Z'
      selected_evidence:
        snippet: We therefore recommend that bladder scan/PVR does not dictate the decision to get an
          early MRI scan.
        supports: SUPPORT
        directness: DIRECT
