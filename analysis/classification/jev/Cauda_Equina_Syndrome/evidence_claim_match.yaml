  ac9face0bd0597996ff43bbdfd4b052942983955a33b6790c9b3fedd89d415e6:
    claim:
      about:
        disease:
          name: Cauda Equina Syndrome
          disease_term:
            preferred_term: cauda equina syndrome
            term:
              id: MONDO:0005693
              label: cauda equina syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: Emergency surgical decompression
        description: Surgical decompression is the main treatment for MRI-confirmed compressive CES. WFNS
          consensus recommends surgery within 48 hours, preferably within 24 hours. Historical pooled
          studies associate earlier surgery with better outcomes, but a prospective UK cohort found no
          adjusted association between symptom-to-surgery time and bladder or disability outcomes. Most
          patients in that cohort underwent prompt surgery after referral, so it cannot establish that
          delaying treatment is safe. Retention at presentation does not preclude postoperative improvement.
        treatment_term:
          preferred_term: surgical procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
        notes: Procedure depends on the compressive lesion. For degenerative-disc CES, discectomy through
          laminectomy or laminotomy is described. Laminectomy and discectomy are not equivalent to every
          decompression for other etiologies. Routine corticosteroid benefit in acute CES is unestablished.
          The PMC URL and PMID:38496349 identify the same WFNS paper; the URL cache supplies the full
          text.
        therapeutic_modality: SURGERY
      selected_evidence:
        snippet: There was a significant advantage to treating patients within 48 hours versus more than
          48 hours after the onset of cauda equina syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
