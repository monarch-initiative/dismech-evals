          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Nerve root ischemia and demyelination
        description: Mechanical compression of the nerve roots reduces microvascular perfusion and venous
          outflow, producing nerve root ischemia and demyelination.
      selected_evidence:
