  80a5473ac8374dd3e49dba6f5bfb94962d4c0fac58df44b38f5465ae96d06c16:
    claim:
      about:
        disease:
          name: Celiac Disease
          disease_term:
            preferred_term: celiac disease
            term:
              id: MONDO:0005130
              label: celiac disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_gluten_hladq_ttg_enteropathy_model
        hypothesis_label: Canonical Gluten / HLA-DQ2-DQ8 / tTG Enteropathy Model
        status: CANONICAL
        description: Celiac disease arises in HLA-DQ2 / HLA-DQ8 positive individuals from a CD4 T-cell-mediated
          immune response to dietary gluten/gliadin peptides that have been deamidated by tissue transglutaminase
          2 (TG2/tTG). Deamidation converts neutral glutamine residues to negatively charged glutamate,
          dramatically increasing peptide affinity for HLA-DQ2/DQ8 and licensing presentation to gluten-reactive
          CD4 T cells in the lamina propria. The resulting mixed Th1/Th17/IL-21 cytokine response, together
          with IL-15-driven innate epithelial activation (proposed as a co-required signal in the three-signal
          model, so far demonstrated as a strict co-requirement only in an engineered mouse), drives intraepithelial
          lymphocyte cytotoxicity, B-cell expansion with anti-TG2 autoantibody production, crypt hyperplasia,
          and villous atrophy. Gluten-free diet remission, HLA-DQ2/DQ8 restriction, and the ZED1227 randomized
          TG2-inhibitor trial (attenuated the gluten-induced fall in villus-height/crypt-depth ratio)
          all corroborate the gluten / HLA / TG2 axis as the canonical pathogenic mechanism.
        notes: 'Retained as CANONICAL. The 2026 openscientist hypothesis-search report (kb/hypotheses/Celiac_Disease/canonical_gluten_hladq_ttg_enteropathy_model)
          finds STRONGLY SUPPORTED with five required mechanistic expansions. Core gluten → TG2-deamidation
          → HLA-DQ2/DQ8 presentation → CD4 T-cell activation → mucosal injury cascade is validated by
          ZED1227 Phase 2a (TG2 inhibition attenuated gluten-induced mucosal injury — the first causal
          human perturbation of the axis), HLA-DQ2 tetramer and direct-cloning studies (0.5–1.8% of intestinal
          CD4 T cells gluten-reactive by cloning and 0.1–1.2% tetramer-positive, correlating with Marsh
          grade and serum IgA anti-TG2), and gluten-free-diet remission. The report''s five proposed expansions
          are recorded here with the dispositions from the 2026 assessment sidecar (assessments/openscientist-assessment-by-codex.yaml),
          which are weaker than the report''s own wording: (1) IL-15 / innate immunity co-required for
          villous atrophy — three-signal model (IL-15 + HLA-DQ + gluten) — QUALIFIED: demonstrated in
          an engineered HLA-DQ8 mouse overexpressing IL-15, not established as a universal human co-requirement
          (see the HUMAN_MODEL_MISMATCH discussion); (2) the cytokine response is mixed Th1/Th17/IL-21
          rather than pure Th1/IFN-γ — QUALIFIED: IL-17A and IL-21 production is documented in active
          human mucosa, largely in cells that also make IFN-γ, which is cytokine complexity rather than
          a coequal independent Th17 driver; (3) three nested positive feedback loops (IgA-CD71 retrotranscytosis,
          IFN-γ / thioredoxin/TG2 activation, B-cell APC amplification) drive chronicity — QUALIFIED:
          each loop has separate experimental support, but they have never been tested as an integrated
          system and the histologic follow-up cohorts do not attribute incomplete healing to them; (4)
          wheat amylase-trypsin inhibitors (ATIs) provide parallel TLR4-mediated innate signaling as adjuvant
          — QUALIFIED: TLR4 activation and low-grade murine intestinal inflammation are shown, contribution
          to human celiac initiation is not; (5) transcellular IgA-CD71 retrotranscytosis is the dominant
          gluten transport route — REJECTED: the cited work demonstrates a transport mechanism in epithelial
          monolayers, not its quantitative dominance over the paracellular route in patients, so no route
          ranking is asserted here. The tolerance-breaking trigger — what converts ~97% of HLA-DQ2/DQ8
          carriers (oral-tolerant) into the ~1–3% who develop disease — remains unresolved. Boundary conditions
          where the model is insufficient: seronegative CeD (~1.7%), refractory CeD type II (gluten-independent
          clonal T-cell expansion), and DQ8-specific mechanistic differences.'
      selected_evidence:
        snippet: Transglutaminase 2 (TG2) plays a pivotal role in the pathogenesis of
        supports: SUPPORT
