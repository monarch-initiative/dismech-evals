        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_celiac_integrated_feedback_loops
        prompt: Do the proposed amplification loops of celiac disease operate as one integrated system,
          and would disrupting a single loop collapse the cascade?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#canonical_gluten_hladq_ttg_enteropathy_model
        - pathophysiology#Autoantibody Production
        - pathophysiology#Barrier Dysfunction
        rationale: 'Three amplification loops are commonly invoked to explain why celiac disease escalates
          quickly and heals slowly: secretory IgA delivering gliadin peptides back across the epithelium
          through CD71, IFN-gamma driving thioredoxin release that reactivates extracellular TG2, and
          TG2-reactive B cells presenting gluten peptides to gluten-specific T cells. Each has separate
          experimental support, but they were characterized in different reductionist systems and have
          never been perturbed together in one system, so their joint contribution is an inference rather
          than a measurement. The follow-up cohorts that document delayed or incomplete mucosal recovery
          on a gluten-free diet describe the outcome without attributing it to these loops.'
        proposed_experiments:
        - experiment_id: exp_celiac_combinatorial_loop_perturbation
          name: Combinatorial loop perturbation in patient-derived intestinal organoid immune co-cultures
          description: In duodenal organoid or air-liquid-interface cultures retaining tissue-resident
            immune cells from celiac patients, block CD71-mediated retrotranscytosis, extracellular TG2
            activity and B-cell antigen presentation singly and in combination during gliadin exposure,
            reading out gluten-specific T-cell activation, epithelial injury and anti-TG2 output.
          would_support:
          - pathophysiology#Autoantibody Production
          supporting_outcome:
          - Blocking any single loop produces a disproportionate reduction in gluten-specific T-cell activation
            and epithelial injury, which is the signature of a coupled amplifying system.
          refuting_outcome:
          - Single blockades produce only additive, proportionate reductions, indicating three parallel
            contributors rather than one nested self-amplifying circuit.
      selected_evidence:
        snippet: In the presence of celiac IgA or SIgA against p31-49, transport of intact 3H-p31-49 increased
          significantly across Caco-2 monolayers; this transport was inhibited by soluble CD71 or Tgase2
          inhibitors.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22750506
      reference_title: Interactions among secretory immunoglobulin A, CD71, and transglutaminase-2 affect
        permeability of intestinal epithelial cells to gliadin peptides.
      evidence_source: IN_VITRO
      explanation: Demonstrates the retrotranscytosis loop as a transport mechanism in epithelial cell
        monolayers. It establishes that the route exists and is CD71 and TG2 dependent, and deliberately
        does not establish that it is the dominant route to the lamina propria in patients.
