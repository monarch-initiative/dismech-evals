        description: The humoral response spreads from TG2 to the related epidermal enzyme transglutaminase
          3 (TG3), and patients with dermatitis herpetiformis carry an antibody population specific for
          TG3 with markedly higher avidity for it than for TG2. The granular IgA precipitates that define
          the skin lesion contain TG3, so the antigen and the deposit are established. The terminal sequence
          - immune-complex deposition in dermal papillae, complement and endothelial activation, neutrophil
          recruitment and protease-mediated injury at the dermal-epidermal junction - is the part not
          fully demonstrated, and dermal IgA deposits can occur without clinical disease, so the edge
          is recorded as indirect.
