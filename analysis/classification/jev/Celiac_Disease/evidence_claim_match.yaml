    evidence_metadata:
      reference: PMID:34192430
      reference_title: A Randomized Trial of a Transglutaminase 2 Inhibitor for Celiac Disease.
      evidence_source: HUMAN_CLINICAL
      explanation: 'ZED1227 Phase 2a randomized trial (CEC-3) provides the strongest interventional evidence
        for the canonical gluten/HLA/TG2 axis: pharmacological TG2 inhibition attenuated the loss of villus-height/crypt-depth
        ratio during gluten challenge. The primary-endpoint differences from placebo were 0.44 (10 mg),
        0.49 (50 mg) and 0.48 (100 mg), so the trial establishes a causal contribution of TG2 and its
        therapeutic tractability rather than a monotonic dose response or strict necessity of TG2 in every
        genotype and disease context.

        '
