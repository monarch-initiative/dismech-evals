  8180d3fc6a9e3b3d1e97b8503c4ffccd8fd5fbfae410f5770d9dc5f2e974f493:
    claim:
      about:
        disease:
          name: Celiac Disease
          disease_term:
            preferred_term: celiac disease
            term:
              id: MONDO:0005130
              label: celiac disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_celiac_proposed_but_unplaced_chains
        prompt: Cerebellar ataxia, abdominal pain and bloating each have a coherent proposed chain from
          celiac disease and no demonstrated intermediate step in patients. What evidence would place
          any of them in the pathograph?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Cerebellar Ataxia
        - phenotypes#Abdominal Pain
        - phenotypes#Bloating
        rationale: 'These three differ from the wholly unexplained manifestations: each has a specific
          proposed route, and each route stops one step short of what a causal edge would assert. Cerebellar
          ataxia is the closest to placement and the most instructive. Its proposed chain mirrors the
          dermatitis herpetiformis chain that is wired in this entry - a transglutaminase isoform outside
          the gut, here TG6, with antibodies plus tissue pathology - and cerebellar neuropathology is
          documented: Purkinje cell loss, gliosis, and lymphocytic infiltration with perivascular cuffing.
          What is missing is the step that makes the dermatitis herpetiformis edge assertable: there,
          the antigen was demonstrated inside the lesion-defining deposit, whereas TG6 remains a candidate
          antigen and antibody sufficiency has not been shown. Neurologic gluten sensitivity also occurs
          without enteropathy, and genetic, paraneoplastic, nutritional and other autoimmune ataxias compete.
          Abdominal pain and bloating have physiologically coherent chains - mucosal nociception and luminal
          distension for the former, brush-border enzyme loss to carbohydrate maldigestion, microbial
          fermentation and gas for the latter - but neither has been demonstrated end to end in celiac
          patients, and irritable bowel syndrome, lactose or FODMAP intolerance and bacterial overgrowth
          produce both.'
        proposed_experiments:
        - experiment_id: exp_celiac_tg6_antibody_sufficiency
          name: TG6 antibody sufficiency and cerebellar target engagement in gluten ataxia
          description: 'Establish for TG6 what is already established for TG3 in dermatitis herpetiformis:
            demonstrate the antigen within the cerebellar lesion, then test sufficiency by passive transfer
            or by an ex vivo cerebellar preparation exposed to patient IgA, with titer tracked against
            imaging and ataxia severity before and during gluten withdrawal in antibody-positive and antibody-negative
            patients.'
          would_support:
          - pathophysiology#Autoantibody Production
          supporting_outcome:
          - TG6 is demonstrated in cerebellar tissue lesions and patient antibody produces Purkinje cell
            injury in a preparation free of other celiac factors, with titer tracking ataxia severity.
          refuting_outcome:
          - Anti-TG6 titer is unrelated to cerebellar injury and ataxia severity, or cerebellar pathology
            occurs as often in antibody-negative patients, indicating the antibodies are a marker of gluten
            exposure rather than the effector.
      selected_evidence:
        snippet: In gluten ataxia, loss of Purkinje cells, atrophy, gliosis and astrocytosis were apparent,
          as well as diffuse lymphocytic infiltration and perivascular cuffing with lymphocytes.
        supports: SUPPORT
