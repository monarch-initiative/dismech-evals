      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Clonal Intraepithelial Lymphocyte Expansion
        biological_scale: CELLULAR
        description: Chronic IL-15-rich signaling in the damaged epithelium selects intraepithelial lymphocyte
          clones that acquire JAK1 and STAT3 gain-of-function mutations, giving them cytokine-independent
          survival and proliferative fitness. The clinical counterpart is refractory celiac disease type
          II, a low-grade clonal intraepithelial lymphoproliferation that commonly precedes enteropathy-associated
          T-cell lymphoma. This is the mechanism through which the neoplastic risk of celiac disease is
          realized, and it is also why the risk is concentrated in patients whose mucosa does not heal.
        cell_types:
        - preferred_term: intraepithelial lymphocyte
          term:
            id: CL:0002496
            label: intraepithelial lymphocyte
        biological_processes:
        - preferred_term: cell surface receptor signaling pathway via JAK-STAT
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
          modifier: GAIN_OF_FUNCTION
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: often preceded by low-grade clonal intraepithelial lymphoproliferation, referred to as
          type II refractory CeD (RCDII)
        supports: SUPPORT
