    evidence_metadata:
      reference: PMID:29787419
      reference_title: A locus at 7p14.3 predisposes to refractory celiac disease progression from celiac
        disease.
      evidence_source: HUMAN_CLINICAL
      explanation: A susceptibility variant specific to the progression and absent from celiac susceptibility
        indicates the refractory state has partly separate genetic determinants, reinforcing it as a boundary
        rather than a late stage of the same mechanism.
