        disease:
          name: Celiac Disease
          disease_term:
            preferred_term: celiac disease
            term:
              id: MONDO:0005130
              label: celiac disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_three_signal_villous_atrophy_requirement
        prompt: Is dual epithelial and lamina propria IL-15 overexpression a genuine co-requirement for
          villous atrophy in human celiac disease, as it is in the engineered HLA-DQ8 mouse, or is IL-15
          an amplifier whose removal does not by itself prevent gluten-induced mucosal injury?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#canonical_gluten_hladq_ttg_enteropathy_model
        - pathophysiology#Intestinal Epithelial Damage
        - phenotypes#Villous Atrophy
        rationale: 'The three-signal model (gluten + HLA-DQ + IL-15) is the single most consequential
          expansion the 2026 openscientist report proposed, and the canonical hypothesis description leans
          on it. Its direct demonstration is a mouse engineered to overexpress IL-15 in two gut compartments
          while expressing HLA-DQ8; that construction shows the three signals are jointly sufficient in
          the model, not that each is separately necessary in patients. Human biopsy work supports IL-15
          involvement and shows epithelial stress and adaptive antigluten immunity acting in synergy,
          but it does not establish the engineered configuration as a universal human rule. The published
          anti-IL-15 trial cuts the other way: AMG 714 did not prevent mucosal injury during gluten challenge,
          which is what removing one of three strictly required signals should have done. Curate the three-signal
          model as strong model-organism support plus a human mechanistic hypothesis, and do not assert
          a proven human co-requirement.'
        proposed_experiments:
        - experiment_id: exp_celiac_il15_blockade_active_disease
          name: IL-15 blockade in gluten-exposed celiac disease, powered for histology and stratified
            by HLA-DQ
          description: Building on the AMG 714 phase 2a result, run an adequately powered randomized trial
            of IL-15 or IL-15Ralpha blockade during a standardized gluten challenge, stratified by HLA-DQ2
            homozygosity, DQ2 heterozygosity and DQ8, with predefined co-primary histologic and intraepithelial
            lymphocyte endpoints and mucosal transcriptomics. Include an arm combining IL-15 blockade
            with TG2 inhibition to separate additive from synergistic action of the innate and adaptive
            arms.
          would_support:
          - pathophysiology#Intestinal Epithelial Damage
          would_refute:
          - mechanistic_hypotheses#canonical_gluten_hladq_ttg_enteropathy_model
          supporting_outcome:
          - IL-15 blockade alone prevents the gluten-induced fall in villus height-to-crypt depth ratio,
            establishing IL-15 as a required signal in humans rather than an amplifier.
          refuting_outcome:
          - Adequately powered IL-15 blockade again fails to protect mucosal architecture while TG2 inhibition
            in the same trial does, indicating that the human requirement is carried by the adaptive arm
            and that the engineered mouse configuration does not transfer.
      selected_evidence:
        snippet: AMG 714 did not prevent mucosal injury due to gluten challenge.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/2
      context_paths:
