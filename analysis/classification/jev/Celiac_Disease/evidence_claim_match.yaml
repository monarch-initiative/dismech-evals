      - /disease_term
    evidence_metadata:
      reference: PMID:31494096
      reference_title: 'Safety and efficacy of AMG 714 in adults with coeliac disease exposed to gluten
        challenge: a phase 2a, randomised, double-blind, placebo-controlled study.'
      evidence_source: HUMAN_CLINICAL
      explanation: The strong reading of the three-signal model predicts that removing IL-15 should block
        villous atrophy. A randomized anti-IL-15 antibody trial in gluten-challenged patients missed that
        endpoint, which is the central reason this is recorded as an open human-model mismatch rather
        than as an established human co-requirement. Note the trial was in treated patients undergoing
        short gluten challenge and did show a smaller intraepithelial lymphocyte rise at 300 mg, so it
        constrains the necessity claim without excluding an IL-15 contribution.
