      assertion:
        target: Female infertility
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'Anti-TG2 antibodies from untreated patients bind TG2 on the maternal-facing syncytiotrophoblast
          and inhibit its local activity, and in primary human trophoblasts they reduce invasiveness and
          matrix metalloprotease activity and increase apoptosis — the proposed route from the humoral
          arm to impaired implantation and placentation. Epidemiologically, the excess of adverse reproductive
          outcomes is confined to undiagnosed disease and attenuates after diagnosis and gluten-free diet,
          tying the phenotype to disease activity. Mechanism attribution remains contested: malabsorption-related
          nutrient deficiency and systemic inflammation are credible parallel contributors, and the antibody
          evidence is from human tissue and cell systems with no in vivo perturbation in women, so the
          edge is recorded as indirect. How much weight that tissue-level and cell-level work can carry
          is itself unsettled in the literature, which is why the chain is placed no more strongly than
          indirect.'
      selected_evidence:
        snippet: the binding of anti-tTG antibodies to trophoblast might represent a key mechanism by
          which the embryo implantation and pregnancy outcome are impaired in untreated celiac pregnant
          women
        supports: SUPPORT
