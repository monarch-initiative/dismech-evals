      assertion:
        discussion_id: gap_celiac_gfd_responsive_extraintestinal_mechanisms
        prompt: By what mechanism does gluten exposure produce recurrent aphthous stomatitis, sterile
          inflammatory arthropathy, constipation-predominant bowel dysfunction, fatigue, and peripheral
          neuropathy in celiac disease, when each improves on a gluten-free diet but no intermediate step
          has been demonstrated in patients?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Recurrent Aphthous Stomatitis
        - phenotypes#Arthritis
        - phenotypes#Constipation
        - phenotypes#Fatigue
        - phenotypes#Peripheral Neuropathy
        rationale: 'For each of these five phenotypes the association and a gluten-free-diet response
          are documented, but the mechanism is not, so no causal edge is recorded in the pathograph. Recurrent
          aphthous stomatitis: candidate routes are hematinic (iron/folate/B12) deficiency from malabsorption
          versus gluten-driven mucosal immune inflammation; the diet-response evidence is four adherent
          responders in an uncontrolled series, and nutrient correction has never been factorially separated
          from gluten withdrawal. Arthritis: a rigorously investigated case of sterile non-erosive polyarthritis
          remitted within three weeks of gluten withdrawal, and ultrasound series report more subclinical
          synovitis with gluten exposure, but synovial tissue has rarely been profiled and shared immune
          susceptibility to coincident rheumatic disease is a live alternative. Constipation: four weeks
          of gluten-free diet shortened small-bowel and colonic transit and increased contractility in
          newly diagnosed patients, yet the treatment diet itself - low in fiber and rich in refined substitutes
          - can cause constipation, so the phenotype can arise from the disease and from its treatment
          in the same patient. Fatigue: a prospective controlled study found it substantially reduced
          after twelve months of gluten-free diet yet still higher than in matched controls, and associated
          with depression and pain rather than with disease activity or nutritional deficiency - so neither
          the hematinic nor the inflammatory route is established and a psychosocial contribution cannot
          be separated out. Peripheral neuropathy: nerve biopsies show axonopathy, loss of myelinated
          fibers and perivascular inflammatory infiltration, which points to immune injury without settling
          whether the effector is humoral (anti-TG6 or antiganglioside antibodies) or cell-mediated; B12
          or copper deficiency, diabetes and coincident autoimmune neuropathy also have to be excluded.'
        proposed_experiments:
        - experiment_id: exp_celiac_blinded_gluten_challenge_extraintestinal
          name: Blinded gluten challenge with phenotype-specific endpoints
          description: In patients in remission on a gluten-free diet with a history of one of these manifestations,
            a randomized blinded gluten challenge with phenotype-specific endpoints (blinded ulcer counts,
            ultrasound synovitis scoring, wireless motility capsule transit), stratified by corrected
            versus uncorrected hematinic deficiency and with quantified fiber intake, to separate gluten-driven
            from nutritional and diet-composition routes.
          would_support:
          - pathophysiology#Gluten-Triggered Immune Response
          supporting_outcome:
          - The manifestation recurs or objectively worsens during blinded gluten challenge and not on
            placebo, independent of nutrient status and fiber intake.
          refuting_outcome:
          - No difference between gluten and placebo challenge, indicating the manifestation tracks nutrient
            status, diet composition, or a coincident disease rather than gluten-driven immunity.
