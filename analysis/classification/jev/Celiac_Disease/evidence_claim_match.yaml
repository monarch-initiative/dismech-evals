      assertion:
        discussion_id: mismatch_celiac_ati_tlr4_adjuvant
        prompt: Do wheat amylase-trypsin inhibitors contribute to human celiac disease as a TLR4-dependent
          innate adjuvant, or is the evidence confined to cell lines, mice and non-celiac inflammatory
          settings?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - environmental#Wheat Food Products
        - pathophysiology#Gluten-Triggered Immune Response
        rationale: Amylase-trypsin inhibitors are a non-gluten wheat component proposed as a parallel
          innate signal that lowers the threshold for the adaptive gluten response, and they are one reason
          wheat is singled out among cereals. The supporting work is TLR4 reporter activation in mouse
          and human cell lines plus modest intestinal inflammation in healthy mice fed dietary concentrations
          of ATIs. The most frequently paired second citation concerns ATIs as adjuvants of allergic inflammation
          in PBMC-humanized mice, which is a different disease context. No cited experiment shows an ATI
          contribution to initiation or enteropathy in celiac patients, and the gluten-free diet that
          treats the disease removes ATIs and gluten together, so the clinical observation cannot separate
          them. Recorded here rather than as a pathophysiology node, because adding a node would assert
          a human celiac mechanism the evidence does not reach.
      selected_evidence:
        snippet: Concentrations of ATIs found in a normal daily gluten-containing diet increased low-level
          intestinal inflammation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
