      assertion_type: Discussion
      assertion:
        discussion_id: gap_celiac_rcd2_gluten_independent_clonal_expansion
        prompt: What sustains the clonal intraepithelial lymphocyte expansion of refractory celiac disease
          type II once it no longer depends on gluten stimulation, and at what point does the canonical
          model stop applying?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#canonical_gluten_hladq_ttg_enteropathy_model
        - pathophysiology#Intestinal Epithelial Damage
        - treatments#Corticosteroids
        rationale: Refractory celiac disease type II is the clearest boundary condition on the canonical
          model in this entry. Dominant T-cell receptor beta clonotypes recovered from these patients
          are patient-specific and bear no homology to known gliadin-specific sequences, and the clones
          persist stably for years on a strict gluten-free diet, so the driving stimulus is no longer
          the antigen the rest of the entry is built around. Genetic susceptibility to the progression
          also appears to be separate from susceptibility to celiac disease itself. What the entry cannot
          yet say is what does drive the expansion, which matters because this is the pre-lymphomatous
          state that the gluten-free diet does not treat.
      selected_evidence:
        snippet: SNP rs2041570 on chromosome 7 was significantly associated with progression to RCDII
          (P=2.37×10, odds ratio=2.36) but not with CeD susceptibility.
        supports: SUPPORT
    origin:
