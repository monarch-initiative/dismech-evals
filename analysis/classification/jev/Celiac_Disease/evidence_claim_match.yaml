      reference_title: Nutritional Wheat Amylase-Trypsin Inhibitors Promote Intestinal Inflammation via
        Activation of Myeloid Cells.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that dietary-level ATI intake produces measurable intestinal inflammation,
        in healthy mice and via TLR4-responsive cell lines. This is the strongest form of the claim the
        primary literature supports, and it is not a celiac-specific or human result.
