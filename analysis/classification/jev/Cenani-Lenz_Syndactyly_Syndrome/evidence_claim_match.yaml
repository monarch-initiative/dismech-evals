          signaling. Patient missense proteins lose this activity in reporter assays, and several fail
          to reach the plasma membrane normally, consistent with misfolding of the extracellular domain.
          The result is excess canonical Wnt signaling in tissues where LRP4 acts, including the limb-bud
          ectoderm and the ureteric bud.
        genes:
        - preferred_term: LRP4
          term:
            id: hgnc:6696
            label: LRP4
        - preferred_term: LRP6
          term:
            id: hgnc:6698
            label: LRP6
        molecular_functions:
        - preferred_term: inhibition of LRP6-dependent Wnt signaling by LRP4
          modifier: DECREASED
          term:
            id: GO:0030547
            label: signaling receptor inhibitor activity
        biological_processes:
        - preferred_term: negative regulation of canonical Wnt signaling pathway
          modifier: DECREASED
          term:
            id: GO:0090090
            label: negative regulation of canonical Wnt signaling pathway
        - preferred_term: canonical Wnt signaling pathway
          modifier: INCREASED
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
        - preferred_term: protein localization to plasma membrane
          modifier: DECREASED
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
      selected_evidence:
        snippet: Wild type LRP4 was able to inhibit LRP6-dependent WNT signaling robustly. The two mutants
          p.(Asp99His) and p.(Arg545Trp) inhibited WNT signaling less effectively, suggesting they reduced
          LRP4 function.
        supports: SUPPORT
