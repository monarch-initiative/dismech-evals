      assertion_type: Pathophysiology
      assertion:
        name: Impaired Agrin-LRP4-MuSK Signaling at the Neuromuscular Junction
        biological_scale: CELLULAR
        description: LRP4 is the muscle receptor for neural agrin and activates MuSK to cluster acetylcholine
          receptors. The beta1-propeller p.Tyr607Cys protein reaches the plasma membrane and binds MuSK
          normally, but binds agrin and Wnt11 less, and agrin-induced MuSK phosphorylation is reduced.
          Patient myotubes formed fewer and smaller agrin- and Wnt11-induced acetylcholine receptor clusters.
          Most CLSS alleles have not been tested for this function and most patients have no neuromuscular
          symptoms.
        cell_types:
        - preferred_term: myotube
          term:
            id: CL:0002372
            label: myotube
        biological_processes:
        - preferred_term: skeletal muscle acetylcholine-gated channel clustering
          modifier: DECREASED
          term:
            id: GO:0071340
            label: skeletal muscle acetylcholine-gated channel clustering
      selected_evidence:
        snippet: Mechanistic expression studies show a significant decrease of AChR aggregation in cultured
          patient myotubes, as well as altered in vitro binding of agrin and Wnt11 ligands to the mutated
          β1 propeller domain of LRP4 explaining the dual phenotype characterized clinically and electoneuromyographically
          in the patient.
        supports: SUPPORT
    origin:
