  3f2e7dfff1a844706ac669a26b45482d2e0611b0159cdf4697bb3467bac8d127:
    claim:
      about:
        disease:
          name: Cenani-Lenz Syndactyly Syndrome
          disease_term:
            preferred_term: Cenani-Lenz syndactyly syndrome
            term:
              id: MONDO:0008931
              label: Cenani-Lenz syndactyly syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: LRP4
        gene_term:
          preferred_term: LRP4
          term:
            id: hgnc:6696
            label: LRP4
        relationship_type: CAUSATIVE
        notes: Biallelic germline variants, homozygous in most reported families (largely consanguineous)
          and compound heterozygous in some. LRP4 variants were found in 12 of 14 families in the gene-identification
          study. Missense variants in the extracellular domain predominate; nonsense, frameshift and early-truncating
          splice alleles are associated with the severe and prenatally lethal end of the spectrum.
        variants:
        - name: c.2858T>C p.Leu953Pro
          description: Homozygous in a consanguineous Pakistani pedigree with nine affected members whose
            disease was restricted to the limbs and kidneys.
        - name: c.316+1G>A
          description: Homozygous canonical splice-donor variant predicted to truncate the protein early;
            severe CLSS with short stature, cleft lip and kidney hypoplasia or agenesis in a five-generation
            family.
        - name: c.295G>C p.Asp99His and c.1633C>T p.Arg545Trp
          description: Two homozygous missense variants in Pakistani families; both reduce LRP4 inhibition
            of LRP6-dependent Wnt signaling in a reporter assay.
        - name: c.1820A>G p.Tyr607Cys
          description: Homozygous beta1-propeller variant in a patient with CLS limb and kidney malformations
            plus congenital myasthenic syndrome; reduces agrin and Wnt11 binding.
      selected_evidence:
        snippet: We used a homozygosity-mapping approach to map the CLS1 locus to chromosome 11p11.2-q13.1.
          By sequencing candidate genes, we identified recessive LRP4 mutations in 12 families with CLS.
        supports: SUPPORT
