  49b0574dfa34de6034af4301ded4444228c12ebcc75f90bed6be08a17c479bc5:
    claim:
      about:
        disease:
          name: Central Areolar Choroidal Dystrophy
          disease_term:
            preferred_term: central areolar choroidal dystrophy
            term:
              id: MONDO:0008982
              label: central areolar choroidal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PRPH2 Outer-Segment Structural Defect
        description: Pathogenic PRPH2 (peripherin-2) variants disrupt the photoreceptor outer-segment
          disc rim. Peripherin-2 is a tetraspanin that oligomerizes with ROM1 to maintain disc morphogenesis
          and rim curvature; defective outer-segment structure compromises rod and cone photoreceptor
          homeostasis in the central macula. This is the initiating lesion in the most common (CACD3)
          form.
        cell_types:
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: photoreceptor cell outer segment organization
          term:
            id: GO:0035845
            label: photoreceptor cell outer segment organization
          modifier: DECREASED
      selected_evidence:
        snippet: They are functionally related to photoreceptors (either in the phototransduction process,
          as in the case of GUCY2D, or the recovery of retinal photodegradation in photoreceptors for
          GUCA1A, or the formation and maintenance of specific structures within photoreceptors for PRPH2).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35656327
      reference_title: New Insights on the Regulatory Gene Network Disturbed in Central Areolar Choroidal
        Dystrophy-Beyond Classical Gene Candidates.
      evidence_source: HUMAN_CLINICAL
      explanation: The systematic review links PRPH2 to the formation and maintenance of photoreceptor
        outer-segment structures, the initiating molecular lesion in the dominant PRPH2 form of CACD.
