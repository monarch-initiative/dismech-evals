  5001e20a470799738b8b32956616f88158251e64a68f6526924c470349acfd5f:
    claim:
      about:
        disease:
          name: Central Areolar Choroidal Dystrophy
          disease_term:
            preferred_term: central areolar choroidal dystrophy
            term:
              id: MONDO:0008982
              label: central areolar choroidal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Phototransduction Recovery Dysregulation
        description: In the GUCY2D (CACD2) and GUCA1A CACD-spectrum forms, the primary defect is in the
          calcium-dependent recovery phase of phototransduction. GUCY2D encodes retinal guanylate cyclase-1
          (retGC1) and GUCA1A encodes its calcium sensor GCAP1; pathogenic variants dysregulate cGMP/Ca2+
          homeostasis in photoreceptors, producing photoreceptor stress and degeneration that converges
          on the same macular RPE/choriocapillaris atrophy.
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
        biological_processes:
        - preferred_term: phototransduction
          term:
            id: GO:0007602
            label: phototransduction
          modifier: ABNORMAL
      selected_evidence:
        snippet: The mutation was shown in zebrafish to cause significant disruptions in photoreceptors
          and retinal pigment epithelium, together with atrophies of retinal vessels and choriocapillaris.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28125083
      reference_title: GUCA1A mutation causes maculopathy in a five-generation family with a wide spectrum
        of severity.
      evidence_source: MODEL_ORGANISM
      explanation: A GUCA1A p.R120L variant disrupting the GCAP1/retGC1 phototransduction recovery axis
        recapitulated photoreceptor, RPE, and choriocapillaris damage in zebrafish, supporting phototransduction-recovery
        dysregulation as an alternative initiating mechanism in CACD-spectrum maculopathy.
