              id: MONDO:0008982
              label: central areolar choroidal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: RPE and Photoreceptor Degeneration
        description: Progressive dysfunction and loss of the central macular retinal pigment epithelium
          and overlying photoreceptors, the primary degenerative event in CACD, preceding clinically apparent
          choriocapillaris loss. Reported CACD-causing genes are photoreceptor-expressed, supporting a
          photoreceptor/RPE-first cascade.
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        - preferred_term: eye photoreceptor cell
          term:
            id: CL:0000287
            label: eye photoreceptor cell
      selected_evidence:
        snippet: We corroborated the alteration of the outer segment structure, and we found changes in
          the synaptic connectivity in the outer plexiform layer as well as gliosis and signs of microglial
          activation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37914688
      reference_title: Prph2 knock-in mice recapitulate human central areolar choroidal dystrophy retinal
        degeneration and exhibit aberrant synaptic remodeling and microglial activation.
      evidence_source: MODEL_ORGANISM
      explanation: The PRPH2 p.Arg195Leu knock-in mouse demonstrates outer-segment structural disruption
        and progressive retinal degeneration, supporting photoreceptor degeneration as a core CACD mechanism.
