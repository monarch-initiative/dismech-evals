  a59058903f395b90d0f6cfc78b3f6cf1513c6be795e337431a502096d805281b:
    claim:
      about:
        disease:
          name: Central Core Myopathy
          disease_term:
            preferred_term: central core myopathy
            term:
              id: MONDO:0007294
              label: central core myopathy
        context: []
      assertion_type: Phenotype
      assertion:
        name: Type 1 muscle fiber predominance
        description: 'Skeletal muscle biopsy frequently shows predominance or near-uniformity of type
          1 (slow oxidative) fibers, with type 2 fibers reduced in number and often atrophic. The selective
          involvement reflects the higher RyR1 abundance and oxidative-metabolism dependence of type 1
          fibers, which are most affected by RyR1-driven Ca2+ leak and mitochondrial damage. Type 1 fiber
