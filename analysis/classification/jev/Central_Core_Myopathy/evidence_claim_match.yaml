      assertion_type: Subtype
      assertion:
        name: AD-CCD
        display_name: Autosomal dominant central core disease
        description: Dominantly inherited RYR1-related central core disease is typically caused by heterozygous
          missense variants in RYR1 hotspot regions. It often presents from infancy or childhood with
          mild-to-moderate static or slowly progressive proximal weakness, delayed motor development,
          orthopedic complications, and clinically important malignant hyperthermia susceptibility.
      selected_evidence:
        snippet: Dominant mutations, typically missense, were frequently located in recognized mutational
          hotspot regions, while recessive mutations were distributed throughout the entire coding sequence.
        supports: SUPPORT
