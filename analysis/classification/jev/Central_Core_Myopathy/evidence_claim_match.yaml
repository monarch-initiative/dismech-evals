      assertion_type: Genetic
      assertion:
        name: RYR1 mutations
        association: Causative
        gene_term:
          preferred_term: RYR1
          description: 'Ryanodine receptor 1, encoding a homotetrameric calcium release channel of 5,038
            amino acids. Mapping to chromosome 19q13.2 and comprising 106 exons, it is the principal skeletal
            muscle sarcoplasmic reticulum calcium release channel fundamental to excitation-contraction
            coupling.

            '
          term:
            id: hgnc:10483
            label: RYR1
        notes: 'RYR1 is the major causative gene for CCD. Over 300 pathogenic variants have been identified.
          Dominant mutations are typically missense changes clustered in recognized hotspot regions including
          the C-terminal pore-forming domain. Recessive mutations are distributed throughout the entire
          coding sequence and include nonsense and splice mutations expected to result in reduced RyR1
          protein. RYR1 mutations are also the most frequent genetic cause of congenital myopathies overall.

          '
      selected_evidence:
        snippet: 'Mapping to chromosome 19q13.2, the gene comprises 106 exons and encodes a protein of
          5,038 amino acids. Mutations in the gene have been found in association with several diseases:
          the pharmacogenetic disorder, malignant hyperthermia (MH); and three congenital myopathies,
          including central core disease (CCD), multiminicore disease (MmD), and in an isolated case of
          a congenital myopathy characterized on histology by cores and rods.

          '
        supports: SUPPORT
