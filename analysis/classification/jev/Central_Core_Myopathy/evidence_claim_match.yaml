      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial depletion and oxidative metabolism deficiency in cores
        description: 'The central cores that define this myopathy histologically represent focal regions
          of myofibrillar disorganization with depletion of mitochondria and absence of oxidative enzyme
          activity. Cores run along the longitudinal axis of type 1 muscle fibers and are visualized as
          unstained regions on NADH-TR and cytochrome oxidase histochemistry. Mitochondrial calcium overload
          from dysfunctional RyR1 channels generates energetic strain and oxidative stress, contributing
          to the ultrastructural disorganization characteristic of cores.

          '
        cell_types:
        - preferred_term: Skeletal muscle fiber
          term:
