        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Anesthetic-triggered malignant hyperthermia mechanism
        description: 'RYR1 mutations predispose to malignant hyperthermia (MH), a pharmacogenetic disorder
          triggered by volatile anesthetic agents and succinylcholine. The susceptible RyR1 channel exhibits
          exaggerated calcium release in response to these triggers, causing sustained muscle contraction,
          hypermetabolism, rhabdomyolysis, and potentially fatal hyperthermia. CCD and MHS are allelic
          conditions and a single RYR1 mutation may result in either or both phenotypes.

          '
        biological_processes:
        - preferred_term: Muscle contraction
          modifier: INCREASED
          term:
            id: GO:0006936
            label: muscle contraction
        - preferred_term: Calcium ion homeostasis
          modifier: DYSREGULATED
          term:
            id: GO:0055074
            label: calcium ion homeostasis
      selected_evidence:
        snippet: 'One of these mutations was also detected in an unrelated MH pedigree whose members are
          asymptomatic of CCD. The data suggest a model to explain how a single mutation may result in
          two apparently distinct clinical phenotypes.

          '
        supports: SUPPORT
