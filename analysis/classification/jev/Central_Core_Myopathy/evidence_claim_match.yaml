      assertion_type: Diagnosis
      assertion:
        name: Muscle biopsy and oxidative histochemistry
        description: Muscle biopsy should evaluate hematoxylin/eosin and modified trichrome morphology,
          oxidative enzyme stains such as NADH-TR and COX/SDH, fiber type, and ultrastructure. Diagnostic
          findings include well-demarcated cores in type 1 fibers, absent oxidative enzyme activity in
          core regions, mitochondrial depletion, and often type 1 fiber predominance or uniformity.
        diagnosis_term:
          preferred_term: biopsy of muscle tissue
          term:
            id: NCIT:C51895
            label: Muscle Biopsy
      selected_evidence:
        snippet: The pathological hallmark of central core disease is the presence of well-demarcated
          cores (round or oval shaped regions within a muscle fiber that lack oxidative enzyme activity
          on histochemical stains) within type 1 muscle fibers (Fig. 3).
        supports: SUPPORT
