          prospective trials and two national protocol cohorts found no association between focal or whole-ventricular
          radiation and metastatic rather than local relapse among patients who had already failed treatment.
          Conditioning on failure and omitting field-specific denominators for all treated patients means
          that result cannot estimate field-specific failure incidence or rebut the ACNS1123 pattern.
          The seed review describes optimal field and dose as controversial and minimizing long-term sequelae
          while preserving control as an unresolved challenge. Comparative disease-control and late-effect
          evidence is missing; no universal conclusion that either craniospinal or reduced-field radiation
          is optimal is warranted. This question is intentionally limited to response-qualified localized
          NGGCT and field selection at a fixed protocol-defined dose; dose optimization and germinoma
          protocols require separate evaluation.
        proposed_experiments:
        - experiment_id: exp_localized_nggct_risk_adapted_radiation_trial
          name: Risk-adapted radiation field trial with molecular residual-disease surveillance
          description: In a prospective international trial, centrally confirm localized NGGCT, induction
            response, histologic composition, serum and CSF markers, and second-look pathology. Compare
            protocol-defined radiation fields under contemporary protocol consensus and ethical oversight
            while embedding serial CSF molecular residual-disease testing and lifelong late-effect follow-up.
          experiment_type:
            preferred_term: randomized risk-adapted radiation field trial
          model_systems:
          - name: Response-qualified localized CNS NGGCT cohort
            description: Stratify by complete versus partial response, pure versus mixed histology, residual
              teratoma, marker status, age, sex, location, and protocol-defined molecular residual disease.
          perturbations:
          - name: Protocol-defined radiation-field assignment
            target: has_subtypes#Central Nervous System Nongerminomatous Germ Cell Tumor
            description: Compare reduced ventricular or ventricular-plus-spinal strategies with a consensus
              broader-field control, holding the prescribed dose schedule and systemic therapy constant
              and using centrally reviewed dose-volume constraints.
          readouts:
          - name: Disease-control and failure geography
            target: has_subtypes#Central Nervous System Nongerminomatous Germ Cell Tumor
            description: Measure event-free and overall survival, local, ventricular, spinal, and disseminated
              relapse, salvage success, serial tumor markers, and CSF molecular residual disease.
            assays:
            - preferred_term: magnetic resonance surveillance
            - preferred_term: cerebrospinal-fluid molecular residual-disease assay
            direction: THRESHOLD_DEPENDENT
          - name: Long-term treatment burden
            target: has_subtypes#Central Nervous System Nongerminomatous Germ Cell Tumor
            description: Prospectively assess neurocognition, school and employment function, endocrine
              replacement, growth, hearing, vascular events, and secondary neoplasms for at least ten
              years.
            assays:
            - preferred_term: longitudinal late-effect assessment
            direction: NEGATIVE
          controls:
          - name: Central treatment-quality control
            description: Review pathology, response, second-look surgery, imaging, target contours, dosimetry,
              and protocol adherence before or during treatment.
          - name: Prespecified competing-risk analysis
            description: Lock noninferiority and late-effect estimands, account for salvage and competing
              mortality, and report every failure location rather than only aggregate progression-free
              survival.
          decision_criterion: A reduced field is acceptable only if it meets a prespecified noninferiority
            margin for disease control without an excess of spinal or disseminated relapse and produces
            a clinically meaningful late-effect benefit. If baseline or on-treatment CSF molecular residual
            disease reproducibly identifies spinal risk, test a biomarker-adapted field strategy prospectively
            rather than assigning a field from association alone. Similar disease control without measurable
            long-term benefit does not justify field reduction.
      selected_evidence:
        snippet: Current treatment predominantly relies on surgery, radiotherapy, and chemotherapy, though
          the optimal radiation field and dose remain controversial.
