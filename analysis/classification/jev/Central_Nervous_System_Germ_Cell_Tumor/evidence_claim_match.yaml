  5271bc25bcd91b1ba9374e7cfee018c6e0cc40077b311dad1f2f54e8a88293f7:
    claim:
      about:
        disease:
          name: Central Nervous System Germ Cell Tumor
          disease_term:
            preferred_term: central nervous system germ cell tumor
            term:
              id: MONDO:0003000
              label: central nervous system germ cell tumor
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cns_gct_developmental_origin_and_driver_timing
        prompt: Do CNS germ cell tumors arise from a mis-migrated primordial germ cell, an endogenous
          neural stem or progenitor cell, or another precursor; when do lineage divergence and global
          methylation changes occur; and are MAPK/PI3K alterations initiating lesions, later cooperating
          events, or dispensable markers of particular components?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#common_ancestry_developmental_state_divergence
        rationale: The strongest human evidence is cross-sectional. Methylation profiles in 61 primary
          tumors and integrated transcriptome/methylome profiles in 84 cases map germinoma and NGGCT to
          different developmental reference states, while shared MAPK/PI3K variants in microdissected
          mixed components and component-shared 12p status in a separate cohort support within-tumor common
          ancestry. SNRPN hypomethylation is also present in mouse and human neural stem cells, and two
          non-tumor fetal autopsies prompted an author hypothesis of local germinal-matrix derivation.
          These observations do not trace a tumor lineage. The studies do not observe embryonic migration,
          establish whether the relevant precursor is a bona fide primordial germ cell, an endogenous
          neural stem or progenitor cell, or another precursor, or determine whether pathway alterations
          precede or follow epigenetic state divergence. The 62-tumor sequencing cohort found KIT/RAS
          or AKT/mTOR lesions in 53%, with KIT mutations restricted to germinomas in that cohort, so one
          pathway chain cannot be generalized across the family. Direct temporal, lineage, and perturbational
          evidence that compares competing precursor models is required before adding an established developmental-escape
          or MAPK/PI3K pathophysiology edge.
        proposed_experiments:
        - experiment_id: exp_cns_gct_spatial_clonal_developmental_atlas
          name: Spatial single-cell clonal atlas across pure and mixed CNS germ cell tumors
          description: Prospectively collect treatment-naive pure germinomas, pure NGGCT histologies,
            and multiple spatially mapped components of mixed tumors. Integrate single-cell DNA, RNA,
            chromatin accessibility, methylation, and spatial pathology with matched normal DNA and a
            preregistered human embryonic germ-cell reference atlas.
          experiment_type:
            preferred_term: spatial single-cell multi-omic lineage study
          model_systems:
          - name: Treatment-naive CNS germ cell tumor cohort
            description: Include age-, sex-, location-, and histology-stratified tumors with central pathology
              review and separate sampling of every visible mixed component.
          - name: Human developmental reference atlas
            description: Use ethically sourced published and prospectively generated reference profiles
              spanning primordial germ-cell specification and migration, neural stem and progenitor states,
              and early embryonic differentiation without treating nearest-neighbor similarity as proof
              of ancestry.
          perturbations:
          - name: Component-resolved sampling
            target: mechanistic_hypotheses#common_ancestry_developmental_state_divergence
            description: Laser-capture and single-cell profile each component separately while preserving
              spatial relationships and shared somatic variants.
          readouts:
          - name: Clonal order and developmental-state assignment
            target: mechanistic_hypotheses#common_ancestry_developmental_state_divergence
            description: Infer trunk and branch lesions, allele-specific copy number, methylation erasure
              or acquisition, lineage programs, and uncertainty-calibrated similarity to developmental
              references.
            assays:
            - preferred_term: single-cell DNA and RNA sequencing
            - preferred_term: single-cell methylome and chromatin accessibility profiling
            - preferred_term: spatial transcriptomics
            direction: THRESHOLD_DEPENDENT
          controls:
          - name: Histology and site controls
            description: Analyze germinoma and each NGGCT component separately, include gonadal germ cell
              tumor comparators, and adjust for purity, immune infiltration, age, sex, anatomic site,
              and specimen handling.
          - name: Clonal-inference controls
            description: Confirm trunk variants by orthogonal targeted sequencing and test alternative
              phylogenies rather than selecting a lineage tree from transcriptomic similarity alone.
          decision_criterion: Common ancestry is supported when spatially distinct mixed components share
            orthogonally validated trunk lesions and diverge into reproducible component-specific epigenetic
            states. A particular precursor-of-origin model gains support only if tumor trunk states reproducibly
            align with a defined developmental interval across cohorts, fit competing precursor models
            materially less well, and cannot be explained by tumor purity or convergence; developmental
            similarity alone does not establish lineage. Divergent trunk lesions across components would
            refute a single common tumor ancestor, whereas component differences arising after a shared
            trunk are expected under developmental-state divergence and do not refute it. Inconsistent
            developmental assignments leave cell of origin unresolved rather than refuting common ancestry.
          would_support:
          - mechanistic_hypotheses#common_ancestry_developmental_state_divergence
          would_refute:
          - mechanistic_hypotheses#common_ancestry_developmental_state_divergence
        - experiment_id: exp_cns_gct_stage_specific_driver_epistasis
          name: Stage-specific MAPK/PI3K developmental epistasis
          description: Introduce recurrent KIT, RAS, AKT1, or mTOR alterations singly and in combinations
            at defined stages of human primordial-germ-cell-like-cell and embryonic differentiation, then
            test whether a lesion initiates, maintains, or merely accelerates a tumor-compatible state.
          experiment_type:
            preferred_term: isogenic developmental-stage causal epistasis study
          model_systems:
          - name: Isogenic human candidate-precursor differentiation series
            description: Compare multiple donor backgrounds of primordial-germ-cell-like cells and CNS
              neural stem or progenitor cells, with inducible editing at matched specification and differentiation
              stages.
          - name: Component-specific CNS germ cell tumor organoids
            description: Establish centrally reviewed germinoma and NGGCT organoids with isogenic correction
              or introduction of candidate lesions.
          perturbations:
          - name: Timed driver introduction and correction
            target: mechanistic_hypotheses#common_ancestry_developmental_state_divergence
            description: Activate or correct one candidate pathway lesion at each developmental stage,
              with matched kinase-dead, vector, and unedited controls.
          readouts:
          - name: State maintenance and transformation
            target: mechanistic_hypotheses#common_ancestry_developmental_state_divergence
            description: Measure survival without developmental cues, methylation state, differentiation
              trajectory, clonogenicity, invasion, and tumor formation in an anatomically relevant xenograft.
            assays:
            - preferred_term: longitudinal multi-omic profiling
            - preferred_term: clonogenic transformation assay
            direction: POSITIVE
          controls:
          - name: Lesion and developmental-stage controls
            description: Compare each alteration across matched primordial-germ-cell-like and neural stem
              or progenitor backgrounds and developmental stages, include pathway correction and pharmacologic
              rescue, and analyze germinoma-like and NGGCT-like outputs separately.
          decision_criterion: An initiating role requires a lesion to reproducibly create a self-maintaining
            tumor-compatible state only when introduced at a defined precursor stage, with loss of that
            phenotype after isogenic correction. A maintenance role is favored if correction collapses
            established tumor state but introduction does not initiate it. Lack of necessity and sufficiency
            supports a passenger or context-marker interpretation.
          would_support:
          - mechanistic_hypotheses#common_ancestry_developmental_state_divergence
          would_refute:
          - mechanistic_hypotheses#common_ancestry_developmental_state_divergence
      selected_evidence:
        snippet: Recent exhaustive genomic studies showed that mutations of the genes involved in the
          MAPK and/or PI3K pathways are common in iGCTs; however, the mechanisms of how different subtypes
          develop, often as a mixed-GCT, are unknown.
        supports: SUPPORT
