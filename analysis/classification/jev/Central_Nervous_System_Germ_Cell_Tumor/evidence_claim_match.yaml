  6f90160fe71f406e50cd6d59753989cdaaa2b8e305c03145c71ce5b5007f177e:
    claim:
      about:
        disease:
          name: Central Nervous System Germ Cell Tumor
          disease_term:
            preferred_term: central nervous system germ cell tumor
            term:
              id: MONDO:0003000
              label: central nervous system germ cell tumor
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_nggct_refractory_and_relapse_mechanism
        prompt: Which cellular, lineage, genomic, epigenetic, microenvironmental, or pharmacologic states
          cause primary refractory disease, viable progression, growing teratoma syndrome, and post-treatment
          relapse in CNS NGGCT, and which are actionable rather than correlates of histology?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - has_subtypes#Central Nervous System Nongerminomatous Germ Cell Tumor
        - mechanistic_hypotheses#nggct_failure_state_specific_persistence_and_evolution
        - mechanistic_hypotheses#mir214_bcl2l11_cisplatin_response_candidate
        - pathophysiology#Immune Checkpoint-Expressing Tumor Immune Microenvironment
        rationale: Clinical failure is heterogeneous. A pooled analysis separated 24 progressions during
          treatment, 11 growing-teratoma-syndrome events, and 83 post-treatment relapses. Large genomic
          studies predominantly profile primary tumors, and the recent NGGCT cohort sequenced only 12
          paired tumor-blood samples; neither design compares diagnosis with residual, progressive, and
          relapsed viable tumor within patients. A separate study observed early-branched evolution across
          only two histology-changing longitudinal cases, which supports feasibility but not a recurrent
          driver. An older serial yolk-sac-tumor case likewise showed increasing copy-number complexity
          over two recurrences, but its single-case, arm-level design and unreported regimen or exposure
          details do not establish a resistance locus. Molecular subtypes such as immune-hot, MYC/E2F,
          and SHH are therefore candidates, not validated resistance states. The miR-214-3p–BCL2L11 result
          supplies a specific in-vitro cisplatin-tolerance candidate, but lacks a resistant-versus-sensitive
          clinical cohort, a patient-derived CNS model, and rescue evidence. Histologic mixture, sampling
          bias, radiation geography, pharmacokinetics, an immunosuppressive checkpoint-expressing microenvironment,
          and therapy-selected clonal evolution remain competing explanations. The immune profile is cross-sectional
          in every available CNS germ cell tumor series, so a microenvironmental sanctuary is a competing
          hypothesis rather than a demonstrated failure route. A resistance node, predictive biomarker,
          or targeted therapy should not be added until longitudinal molecular change is linked to function
          and outcome.
        proposed_experiments:
        - experiment_id: exp_nggct_paired_failure_evolution_cohort
          name: Paired diagnosis-residual-progression-relapse NGGCT evolution cohort
          description: Build an international prospective cohort with central pathology review, multi-region
            diagnosis sampling, protocol-level treatment exposure, and tissue at second-look surgery,
            progression, GTS resection, or relapse. Collect serial plasma and CSF before, during, and
            after therapy.
          experiment_type:
            preferred_term: prospective longitudinal tumor evolution study
          model_systems:
          - name: Longitudinal CNS NGGCT clinical cohort
            description: Enroll pure and mixed NGGCT histologies and preserve separate strata for induction
              nonresponse, GTS, local viable progression, metastatic progression, and late relapse.
          - name: Response-matched comparator cohort
            description: Include durable responders matched on stage, histology, markers, radiation field,
              age, sex, location, and treatment regimen.
          perturbations:
          - name: Protocol-defined chemotherapy and radiotherapy exposure
            target: mechanistic_hypotheses#nggct_failure_state_specific_persistence_and_evolution
            description: Record cumulative agent doses, dose intensity, delays, surgery, radiation volumes
              and dosimetry, and supportive medications as time-varying exposures.
          readouts:
          - name: Within-patient clonal and lineage-state evolution
            target: mechanistic_hypotheses#nggct_failure_state_specific_persistence_and_evolution
            description: Compare somatic variants, copy number, ecDNA, methylation, transcriptome, chromatin
              accessibility, immune state, and histologic composition across every within-patient time
              point.
            assays:
            - preferred_term: single-cell and bulk multi-omic sequencing
            - preferred_term: spatial pathology
            direction: THRESHOLD_DEPENDENT
          - name: Serial molecular residual disease
            target: mechanistic_hypotheses#nggct_failure_state_specific_persistence_and_evolution
            description: Track patient-specific mutations, copy-number changes, methylation, and validated
              germ-cell-tumor RNAs in CSF and plasma alongside AFP, beta-hCG, imaging, and clinical response.
            assays:
            - preferred_term: cerebrospinal-fluid circulating tumor DNA assay
            - preferred_term: serial tumor-marker measurement
            direction: POSITIVE
          controls:
          - name: Failure-state separation
