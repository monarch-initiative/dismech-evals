      - /disease_term
    evidence_metadata:
      reference: PMID:31773448
      reference_title: Tumor immune microenvironment is associated with the growth of intracranial germinomas.
      evidence_source: HUMAN_CLINICAL
      explanation: An eight-patient germinoma series relating checkpoint and lymphocyte staining to symptom
        duration and tumor size. It is the smallest and most selected observation here, it concerns tumor
        growth rather than treatment failure, and the authors' own wording is associative.
