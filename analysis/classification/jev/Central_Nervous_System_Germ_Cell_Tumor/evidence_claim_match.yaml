        hypothesis_label: miR-214-3p–BCL2L11 Cisplatin-Response Candidate
        status: EMERGING
        applies_to_subtypes:
        - Central Nervous System Nongerminomatous Germ Cell Tumor
        description: 'In a subset of malignant NGGCT, altered regulation of the miR-199/214 cluster may
          increase miR-214-3p, reduce the pro-apoptotic protein BCL2L11/BIM, and shift apoptosis and survival
          after cisplatin exposure. This is a candidate response-modifying chain: the current causal evidence
          comes from forced miR-214-3p expression and a BCL2L11-knockdown phenocopy in one adult mediastinal
          mixed-germ-cell-tumor line. It does not establish direct miR-214-3p binding to BCL2L11, endogenous
          necessity, rescue, or a difference between resistant and sensitive CNS NGGCT in patients.'
        notes: This is a cisplatin-response candidate, not a validated intrinsic-tolerance mechanism or
          clinical resistance biomarker. No independent functional replication in a patient-derived intracranial
          model or resistant-versus-sensitive clinical comparison was retrieved. NCCIT is not a patient-derived
          CNS NGGCT model; testicular or mediastinal GCT apoptosis and DNA-repair studies and non-germ-cell
          miR-214 targets remain indirect alternatives, not direct CNS evidence or refutation.
      selected_evidence:
        snippet: We identified Noxa as the only Bcl-2 family protein to be highly correlated with Oct-4
          status and cisplatin sensitivity.
