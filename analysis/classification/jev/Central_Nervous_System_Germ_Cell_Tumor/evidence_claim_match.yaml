        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Recurrent AKT-mTOR Signaling Alterations
        description: A subset of intracranial germ cell tumors carries AKT/mTOR-pathway lesions, including
          focal AKT1 copy-number gain with increased AKT1 expression and recurrent somatic MTOR point
          mutations. Tumor-derived mutant MTOR is pathway-activating and supports anchorage-independent
          growth in cell culture, so these lesions are not inert passengers; recurrence and in-vitro activation
          still do not establish when the alteration arose in a patient or whether it is sufficient for
          transformation of a germ-cell precursor.
        genes:
        - preferred_term: AKT1
          term:
            id: hgnc:391
            label: AKT1
        - preferred_term: MTOR
          term:
            id: hgnc:3942
            label: MTOR
      selected_evidence:
        snippet: Novel somatic alterations in the AKT/mTOR pathway included copy number gains of the AKT1
          locus at 14q32.33 in 19% of patients, with corresponding upregulation of AKT1 expression.
        supports: SUPPORT
    origin:
