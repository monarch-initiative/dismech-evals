    evidence_metadata:
      reference: PMID:28695992
      reference_title: 'Optimal radiotherapy target volumes in intracranial nongerminomatous germ cell
        tumors: Long-term institutional experience with chemotherapy, surgery, and dose- and field-adapted
        radiotherapy.'
      evidence_source: HUMAN_CLINICAL
      explanation: Every spinal relapse in this 34-patient retrospective series followed local-field irradiation,
        but the same four patients also had elevated baseline AFP, so exposure geography and tumor biology
        are confounded in exactly the way the geography branch has to disentangle. The same series reported
        no statistically significant difference in overall survival, disease-free survival, or patterns
        of failure between limited and larger radiotherapy volumes, and the distant-CNS recurrence difference
        (32% vs 0% at ten years) was not significant.
