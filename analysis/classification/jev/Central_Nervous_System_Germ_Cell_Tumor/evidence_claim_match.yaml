      explanation: A 3' UTR reporter assay in nasopharyngeal carcinoma cells shows miR-214 can directly
        target BIM/BCL2L11, which makes the proposed regulatory edge molecularly plausible. Nasopharyngeal
        carcinoma is not a germ cell tumor, and no reporter, seed-mutant, AGO2-occupancy, or miRNA-insensitive
        BCL2L11 rescue experiment has been reported in CNS NGGCT, so direct binding in this disease remains
        unconfirmed.
