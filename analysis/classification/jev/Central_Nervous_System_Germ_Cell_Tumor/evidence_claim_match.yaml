        description: Somatic alterations in KIT and other KIT/RAS-pathway genes recur in human intracranial
          germ cell tumors. They are enriched in germinoma but are not present in every tumor. Cross-sectional
          sequencing establishes recurrence, not whether these lesions initiate disease or are required
          to maintain it.
        genes:
        - preferred_term: KIT
          term:
            id: hgnc:6342
            label: KIT
        - preferred_term: KRAS
          term:
            id: hgnc:6407
            label: KRAS
        - preferred_term: NRAS
          term:
            id: hgnc:7989
            label: NRAS
      selected_evidence:
        snippet: We find the KIT/RAS signalling pathway frequently mutated in more than 50% of IGCTs,
          including novel recurrent somatic mutations in KIT, its downstream mediators KRAS and NRAS,
          and its negative regulator CBL.
        supports: SUPPORT
