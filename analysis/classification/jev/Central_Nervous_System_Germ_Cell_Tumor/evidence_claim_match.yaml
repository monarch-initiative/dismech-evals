      reference_title: A case series and literature review on 98 pediatric patients of germ cell tumor
        developing growing teratoma syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: The largest assembled pediatric GTS series (98 patients, 52 intracranial) shows intracranial
        GTS arises predominantly at the original tumor site and soon after treatment, which fits teratomatous
        persistence or expansion rather than distant malignant relapse; 96.9% of the pooled cohort were
        alive. The series is retrospective and literature-assembled, so it cannot distinguish treatment-associated
        maturation from expansion of a pre-existing teratomatous component.
