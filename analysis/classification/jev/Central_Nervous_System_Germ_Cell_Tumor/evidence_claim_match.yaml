        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: nggct_failure_state_specific_persistence_and_evolution
        hypothesis_label: NGGCT Failure-State-Specific Persistence and Evolution Model
        status: EMERGING
        applies_to_subtypes:
        - Central Nervous System Nongerminomatous Germ Cell Tumor
        description: CNS-NGGCT failures are clinically partitioned into induction progression, marker-negative
          growing teratoma syndrome (GTS), viable residual or progressive disease, and post-treatment
          relapse. Clinical separability does not establish molecular separability. GTS may reflect persistence
          or expansion of a pre-existing teratomatous lineage or treatment-associated maturation and must
          be distinguished from viable malignant disease; it is not uniformly benign. Malignant progression
          or relapse may reflect selection of a pre-existing malignant clone or state, acquired genomic
          or epigenetic changes, reversible treatment-tolerant adaptation, treatment exposure or geography,
          or sampling. These alternatives must not be pooled or assumed to be therapy-selected without
          paired, component-resolved longitudinal evidence. No adequately powered diagnosis-to-failure
          molecular series currently establishes which route is causal.
        notes: This model operationally separates GTS, viable malignant progression, and post-treatment
          relapse without claiming that each category has a distinct molecular cause. It does not promote
          SHH, MYC/E2F, immune-hot, MAPK, or PI3K status to a clinical resistance biomarker without longitudinal
          validation.
      selected_evidence:
        snippet: A total of 118 patients experienced a treatment failure. Twenty-four patients had progressive
          disease during therapy, and additional 11 patients were diagnosed with growing teratoma syndrome
          (GTS).
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
