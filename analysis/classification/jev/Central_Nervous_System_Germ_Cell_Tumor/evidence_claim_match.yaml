      evidence_source: HUMAN_CLINICAL
      explanation: Human tumor multi-omic analysis links the miR-199/214 cluster to methylation state
        in a cross-sectional NGMGCT-versus-germinoma subtype comparison. Histology and differentiation
        state therefore confound any resistance inference, and no longitudinal resistant-versus-sensitive
        comparison was performed.
