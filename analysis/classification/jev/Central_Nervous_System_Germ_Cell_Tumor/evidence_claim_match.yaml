            target: mechanistic_hypotheses#nggct_failure_state_specific_persistence_and_evolution
            description: Record cumulative agent doses, dose intensity, delays, surgery, radiation volumes
              and dosimetry, and supportive medications as time-varying exposures.
          readouts:
          - name: Within-patient clonal and lineage-state evolution
            target: mechanistic_hypotheses#nggct_failure_state_specific_persistence_and_evolution
            description: Compare somatic variants, copy number, ecDNA, methylation, transcriptome, chromatin
