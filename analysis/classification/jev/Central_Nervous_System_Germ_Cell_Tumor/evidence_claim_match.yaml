      evidence_source: HUMAN_CLINICAL
      explanation: Failure location tracked the irradiated volume in this 32-patient retrospective NGGCT
        series, which keeps radiation geography alive as a competing branch-specific explanation for local
        relapse. Three events in a five-patient subgroup cannot separate field geometry from the stage,
        histology, response, and era differences that determined who received the smaller field.
