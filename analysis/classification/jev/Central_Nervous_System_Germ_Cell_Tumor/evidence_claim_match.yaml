  67bc8f85eae7251cf7a931da68b5eaf97ce30517f99b4511cc91556023c1d66f:
    claim:
      about:
        disease:
          name: Central Nervous System Germ Cell Tumor
          disease_term:
            preferred_term: central nervous system germ cell tumor
            term:
              id: MONDO:0003000
              label: central nervous system germ cell tumor
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: common_ancestry_developmental_state_divergence
        hypothesis_label: Common-Ancestry and Developmental-State Divergence Model
        status: EMERGING
        applies_to_subtypes:
        - Central Nervous System Germinoma
        - Central Nervous System Nongerminomatous Germ Cell Tumor
        description: 'Histologically distinct components within an individual mixed CNS germ cell tumor
          may descend from a common tumor ancestor and subsequently diverge into a primordial-germ-cell-like,
          hypomethylated germinoma state or one of several more differentiated NGGCT states. Cross-sectional
          resemblance does not identify that ancestor: a mis-migrated primordial germ cell and an endogenous
          neural stem or progenitor cell are competing cell-of-origin models to be tested rather than
          assumed. MAPK/PI3K-pathway alterations may cooperate with developmental state and can be shared
          by distinct components of a mixed tumor, but their temporal position and necessity for initiation
          remain unresolved.'
        notes: This is a within-tumor developmental model inferred mainly from cross-sectional human profiles.
          It does not posit an ancestor shared across patients, discriminate a mis-migrated primordial
          germ cell from an endogenous neural stem or progenitor cell or another precursor, or generalize
          germinoma hypomethylation to every NGGCT component.
      selected_evidence:
        snippet: Pure germinomas and non-germinomatous germ cell tumors (NGGCTs), as well as CNS and testicular
          GCTs, showed similar mutational profiles, suggesting that GCTs share a common molecular pathogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/8
