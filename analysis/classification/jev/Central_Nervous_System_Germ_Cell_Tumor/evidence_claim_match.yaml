    evidence_metadata:
      reference: PMID:26956871
      reference_title: Recurrent neomorphic mutations of MTOR in central nervous system and testicular
        germ cell tumors may be targeted for therapy.
      evidence_source: HUMAN_CLINICAL
      explanation: The largest CNS-versus-testicular sequencing comparison finds the same recurrent MAPK
        and PI3K lesions across germinoma and NGGCT and across anatomic sites. This is a cohort-level
        similarity of mutational profiles, not observation of a shared ancestor within an individual mixed
        tumor, and it does not order the pathway lesion relative to developmental-state divergence.
