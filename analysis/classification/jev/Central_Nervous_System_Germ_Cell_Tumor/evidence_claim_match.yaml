  ad2bf870f8a56a05d841609d8722dbb26ad3ee9e2fc185f8ca295b336f11598b:
    claim:
      about:
        disease:
          name: Central Nervous System Germ Cell Tumor
          disease_term:
            preferred_term: central nervous system germ cell tumor
            term:
              id: MONDO:0003000
              label: central nervous system germ cell tumor
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Immune Checkpoint-Expressing Tumor Immune Microenvironment
        description: 'CNS germ cell tumors sit in a T-cell-infiltrated microenvironment in which PD-1,
          PD-L1, and CTLA-4 are expressed in most tumors, regulatory T cells are present, and the checkpoint
          profile differs between arms of the family: CTLA-4 higher in germinoma, PD-L1 higher in NGGCT.
          These are cross-sectional immunohistochemical observations on resected tumors. They do not show
          that this microenvironment shelters residual disease from therapy, and they do not support describing
          NGGCT as immune-cold, since PD-1 and PD-L1 were positive in over 90% of tumors in both arms
          and infiltration was heterogeneous case to case.'
        cell_types:
        - preferred_term: FOXP3+ regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
        - preferred_term: PD-1-positive CD8+ tumor-infiltrating lymphocyte
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
      selected_evidence:
        snippet: Our data suggest that the tumor immune microenvironment, including PD-1/PD-L1 signaling,
          is associated with the growth of intracranial germinomas.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/2
      context_paths:
