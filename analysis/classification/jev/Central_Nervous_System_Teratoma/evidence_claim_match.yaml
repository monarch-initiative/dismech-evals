      assertion:
        name: Primordial Germ Cell Developmental Origin
        description: CNS teratomas arise within the CNS germ cell tumor spectrum, where the prevailing
          developmental model is that primordial germ cells or germ-cell-like precursors become ectopically
          located in midline CNS structures and then form tumors with embryonic differentiation potential.
        cell_types:
        - preferred_term: primordial germ cell
          term:
            id: CL:0000670
            label: primordial germ cell
        locations:
        - preferred_term: central nervous system
          term:
            id: UBERON:0001017
            label: central nervous system
        biological_processes:
        - preferred_term: germ cell migration
          modifier: ABNORMAL
          term:
            id: GO:0008354
            label: germ cell migration
        - preferred_term: germ cell development
          modifier: ABNORMAL
          term:
            id: GO:0007281
            label: germ cell development
      selected_evidence:
        snippet: In line with the hypothesis that the primordial germ cell is the cell-of-origin, histopathological
          examinations for this pathology involve a diverse range of components mirroring the embryogenic
          developmental dimensions.
        supports: SUPPORT
