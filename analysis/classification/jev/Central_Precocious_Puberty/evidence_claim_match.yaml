      assertion:
        name: Loss of Paternally Expressed Imprinted Restraint on the GnRH Pulse Generator
        description: MKRN3 and DLK1 are both expressed only from the paternal allele, and both act to
          hold the hypothalamic GnRH pulse generator quiescent through childhood. Hypothalamic Mkrn3 transcript
          is abundant in the arcuate nucleus of prepubertal mice and falls immediately before puberty,
          so withdrawal of this brake is part of the normal pubertal trigger. A paternally transmitted
          loss-of-function variant in either gene removes the brake before the normal age of puberty;
          in the family in which the DLK1 defect was found, the deletion removed the DLK1 translational
          start site and left circulating DLK1 undetectable in every affected member.
        biological_scale: MOLECULAR
