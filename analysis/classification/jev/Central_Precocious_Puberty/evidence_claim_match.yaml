      assertion_type: Subtype
      assertion:
        name: DLK1
        display_name: DLK1-related CPP (CPPB2)
        description: CPP caused by loss-of-function variants in DLK1 (delta-like non-canonical Notch ligand
          1), another paternally expressed imprinted gene at the 14q32 locus. Like MKRN3, DLK1 is transmitted
          in a parent-of-origin (paternal) pattern and may be associated with a broader metabolic phenotype
          including early obesity, hyperlipidemia, and type 2 diabetes.
      selected_evidence:
        snippet: "Only family \nmembers who inherited the defect from their father have precocious puberty,\
          \ \nconsistent with the known imprinting of DLK1."
        supports: SUPPORT
