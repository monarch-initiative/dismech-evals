  73a7baa9d84bcf4f991f72fe79e95e6fbf2ad1486f8e752ae6240b6c4f161980:
    claim:
      about:
        disease:
          name: Central Precocious Puberty
          disease_term:
            preferred_term: central precocious puberty
            term:
              id: MONDO:0019165
              label: central precocious puberty
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Paternally Expressed Imprinted Restraint on the GnRH Pulse Generator
        description: MKRN3 and DLK1 are both expressed only from the paternal allele, and both act to
          hold the hypothalamic GnRH pulse generator quiescent through childhood. Hypothalamic Mkrn3 transcript
          is abundant in the arcuate nucleus of prepubertal mice and falls immediately before puberty,
          so withdrawal of this brake is part of the normal pubertal trigger. A paternally transmitted
          loss-of-function variant in either gene removes the brake before the normal age of puberty;
          in the family in which the DLK1 defect was found, the deletion removed the DLK1 translational
          start site and left circulating DLK1 undetectable in every affected member.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MKRN3
          term:
            id: hgnc:7114
            label: MKRN3
        - preferred_term: DLK1
          term:
            id: hgnc:2907
            label: DLK1
        locations:
        - preferred_term: arcuate nucleus of hypothalamus
          term:
            id: UBERON:0001932
            label: arcuate nucleus of hypothalamus
      selected_evidence:
        snippet: Levels of Mkrn3 mRNA were high in the arcuate nucleus of prepubertal mice, decreased
          immediately before puberty, and remained low after puberty.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23738509
      reference_title: Central precocious puberty caused by mutations in the imprinted gene MKRN3.
