          value:
            name: Premature Reactivation of Pulsatile GnRH Secretion
            description: The central event in CPP is premature reawakening of the hypothalamic GnRH pulse
              generator. Hypothalamic GnRH neurons resume high-amplitude pulsatile GnRH secretion before
              the normal age of puberty, driving pituitary gonadotropin release. Upstream kisspeptin (KISS1/KISS1R)
              signaling stimulates GnRH neurons, while inhibitory factors including the paternally expressed
              imprinted genes MKRN3 and DLK1 normally restrain the axis during childhood; loss of this
              restraint or gain of kisspeptin tone triggers premature secretion.
            cell_types:
            - preferred_term: GnRH neuron
              term:
                id: CL:0011111
                label: hypothalamic gonadotropin-releasing hormone neuron
            biological_processes:
            - preferred_term: Gonadotropin secretion
              term:
                id: GO:0032274
                label: gonadotropin secretion
              modifier: INCREASED
            - preferred_term: Positive regulation of gonadotropin secretion
              term:
                id: GO:0032278
                label: positive regulation of gonadotropin secretion
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Early HPG Axis Activation and Premature Gonadarche
        description: Premature high-amplitude pulsatile GnRH secretion activates pituitary gonadotrophs,
          driving early HPG axis activation and premature gonadarche.
        causal_link_type: DIRECT
      selected_evidence:
        snippet: "Central precocious puberty (CPP) results from early activation of the \nhypothalamic\
          \ - pituitary -gonadal (HPG) axis and follows the same sequence as \nnormal puberty."
        supports: SUPPORT
