              the normal age of puberty, driving pituitary gonadotropin release. Upstream kisspeptin (KISS1/KISS1R)
              signaling stimulates GnRH neurons, while inhibitory factors including the paternally expressed
              imprinted genes MKRN3 and DLK1 normally restrain the axis during childhood; loss of this
              restraint or gain of kisspeptin tone triggers premature secretion.
