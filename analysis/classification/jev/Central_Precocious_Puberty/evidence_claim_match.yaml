        context: []
      assertion_type: Subtype
      assertion:
        name: MKRN3
        display_name: MKRN3-related CPP (CPPB1)
        description: The most common identified monogenic cause of familial CPP. Loss-of-function variants
          in MKRN3 (makorin ring finger protein 3), an imprinted gene on chromosome 15q11.2 expressed
          only from the paternal allele, cause CPP when transmitted from the father. MKRN3 acts as an
          inhibitory brake on GnRH secretion; its loss removes prepubertal restraint and permits premature
          GnRH pulsatility. Circulating MKRN3 normally declines before clinical puberty.
      selected_evidence:
        snippet: "MKRN3 is a paternally expressed, imprinted gene located in the \nPrader-Willi syndrome\
          \ critical region (chromosome 15q11-q13). All affected \npersons inherited the mutations from\
          \ their fathers, a finding that indicates \nperfect segregation with the mode of inheritance\
          \ expected for an imprinted gene."
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23738509
      reference_title: Central precocious puberty caused by mutations in the imprinted gene MKRN3.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes MKRN3 loss-of-function as a paternally inherited imprinted cause of CPP.
