      assertion:
        name: Corticosteroid Exposure
        exposure_term:
          preferred_term: corticosteroid exposure
          term:
            id: ECTO:0000173
            label: exposure to corticosteroid
        notes: 'Exogenous corticosteroid use (systemic, inhaled, intranasal, topical, epidural, or intravitreal)
          is the most consistently identified and strongly associated modifiable risk factor for CSCR.
          Corticosteroids act through mineralocorticoid receptor overstimulation in choroidal endothelial
          cells, amplifying hyperpermeability. Corticosteroid-associated CSCR is characterized by more
          severe disease with bilateral involvement, multiple RPE detachments, greater fluorescein leakage,
          and increased choroidal thickness. Discontinuation of corticosteroids is a key first intervention
          when feasible.

          '
      selected_evidence:
        snippet: Recent evidence describing the pathogenesis of and risk factors for CSC focuses on possible
          dysfunction of the choroid and retinal pigment epithelium, and the role of corticosteroids.
        supports: SUPPORT
