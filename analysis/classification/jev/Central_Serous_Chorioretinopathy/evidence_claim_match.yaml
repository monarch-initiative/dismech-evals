      assertion_type: Treatment
      assertion:
        name: Intravitreal Anti-VEGF Therapy
        description: Intravitreal anti-VEGF agents (bevacizumab, ranibizumab, aflibercept) are standard
          treatment specifically for CSCR complicated by active choroidal neovascularization (type 1 CNV).
          The MINERVA randomized trial supported anti-VEGF efficacy for CSC with macular neovascularization.
          Anti-VEGF is not effective as monotherapy for uncomplicated CSCR without CNV and meta-analyses
          have not confirmed efficacy in non-neovascular acute CSCR. One randomized study showed ranibizumab
          inferior to low-fluence PDT for anatomical outcomes in non-CNV CSCR.
