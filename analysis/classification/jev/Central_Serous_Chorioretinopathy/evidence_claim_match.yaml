      assertion_type: Phenotype
      assertion:
        name: Blurred Central Vision
        description: The cardinal symptom of CSCR. Subretinal fluid beneath the macula displaces and distorts
          the overlying photoreceptors, causing reduction in best-corrected visual acuity. Visual acuity
          typically ranges from 20/20 to 20/200 depending on the degree and duration of detachment. In
          acute CSCR, spontaneous recovery to 20/20 is expected in 90-95% of cases; in chronic CSCR, permanent
          acuity loss is common. Some patients remain asymptomatic in the initial phase of the disease.
        frequency: VERY_FREQUENT
        phenotype_term:
          preferred_term: Visual impairment
          term:
            id: HP:0000505
            label: Visual impairment
      selected_evidence:
        snippet: Symptoms tend to include blurred or distorted vision (metamorphopsia), moderate dyschromatopsia,
          relative central scotoma, hypermetropization, micropsia and reduced contrast sensitivity.
        supports: SUPPORT
    origin:
