        context: []
      assertion_type: Environmental
      assertion:
        name: Male Sex and Hormonal Factors
        notes: 'Male sex is a major epidemiological risk factor for CSCR, with men comprising 72–87.5%
          of patients. Older women show similar prevalence to men, implicating hormonal changes. High
          levels of glucocorticoids, mineralocorticoids, and testosterone are found in CSCR patients.
          Pregnancy and Cushing syndrome (excess endogenous cortisol) are associated with CSCR. Expression
          and splicing QTL analyses link GWAS hits to genes in genital organs, potentially contributing
          to sex differences in CSCR susceptibility.

          '
      selected_evidence:
        snippet: Expression/splicing quantitative trait loci (QTL) analyses showed an association of all
          these hits with the expression and/or splicing of genes in genital organs, which may explain
          the sex differences in CSC.
        supports: SUPPORT
