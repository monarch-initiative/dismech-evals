      assertion:
        name: Fluorescein Angiography
        description: Fluorescein angiography (FA) demonstrates the characteristic inkblot or smokestack
          pattern of focal RPE leakage in CSCR. The smokestack pattern (ascending and expanding dye column)
          is pathognomonic for acute CSCR; inkblot (radially expanding fluorescence) is more common. FA
          defines the leakage point for focal laser treatment planning. In chronic CSCR, diffuse RPE decompensation
          produces multiple, ill-defined leakage zones.
        diagnosis_term:
          preferred_term: fluorescein angiography
          term:
            id: NCIT:C190541
            label: Fluorescein Angiography
