              label: central serous chorioretinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Choroidal Hyperpermeability and Pachychoroid Dysfunction
        description: The primary anatomical and vascular event in CSCR is choroidal hyperpermeability
          with thickening and dilation of the choroid, especially in Haller's outer vascular layer (pachyvessels).
          Choriocapillaris hyperpermeability and attenuation of the inner layers (Sattler's layer) follow.
          CSCR is classified as the first described pachychoroid spectrum disease, a group characterized
          by dilated outer choroidal vessels driving pressure-mediated choriocapillaris dysfunction. Intervortex
          venous anastomoses and choroidal venous congestion may reflect underlying vascular endothelial
          phosphatase (VE-PTP; PTPRB) dysfunction and abnormal choroidal venous drainage, supporting the
          recently proposed "venous overload choroidopathy" hypothesis.
        cell_types:
        - preferred_term: choroidal endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: positive regulation of vascular permeability
          term:
            id: GO:0043117
            label: positive regulation of vascular permeability
          modifier: INCREASED
        - preferred_term: blood vessel remodeling
          term:
            id: GO:0001974
            label: blood vessel remodeling
          modifier: ABNORMAL
        locations:
        - preferred_term: choroid
          term:
            id: UBERON:0001776
            label: optic choroid
      selected_evidence:
        snippet: Abnormal choroidal veins in central serous chorioretinopathy patients have been shown
          to have similarities with varicose veins.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
