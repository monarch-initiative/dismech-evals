      assertion_type: Diagnosis
      assertion:
        name: Optical Coherence Tomography
        description: OCT is the primary diagnostic modality for CSCR, demonstrating subretinal fluid (SRF)
          as an optically clear space between the neurosensory retina and the RPE. Enhanced depth imaging
          OCT (EDI-OCT) additionally reveals subfoveal choroidal thickening (pachychoroid), pigment epithelial
          detachments (PEDs), and disruption of the ellipsoidal zone band correlating with visual acuity
          loss. OCT-A (angiography) detects choroidal neovascularization at the level of the choriocapillaris
          as an abnormal flow signal. OCT is used for diagnosis, monitoring SRF resolution, and treatment
          response assessment.
        diagnosis_term:
          preferred_term: optical coherence tomography
          term:
            id: NCIT:C20828
            label: Optical Coherence Tomography
      selected_evidence:
        snippet: OCT B-scan of the right eye showing visible subretinal fluid (low-density area) indicates
          the area of serous retinal detachment
        supports: SUPPORT
