          was uncited, and a controlled study of 109 patients against 247 matched controls found no significant
          difference in sleep quality or mood; that study is cited below as refuting evidence. An approximately
          5-fold sleep-apnea risk figure was also uncited, and the largest propensity-matched cohort reports
          incident CSCR in 0.4% of patients with obstructive sleep apnea against 0.2% of matched controls,
          which is a real but much smaller association.

          '
      selected_evidence:
        snippet: The risk factor associated with CSC is psychosocial stress, type A personality, pregnancy,
