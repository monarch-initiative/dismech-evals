      assertion_type: Treatment
      assertion:
        name: Observation and Risk Factor Modification
        description: 'First-line approach for acute CSCR, as approximately 90–95% of cases spontaneously
          resolve within 2–3 months. Observation includes: discontinuation of corticosteroids when possible,
          management of psychosocial stress, treatment of obstructive sleep apnea, and close monitoring
          with OCT and visual acuity assessments at 4–6 week intervals. Intervention is considered if
          SRF persists beyond 3–4 months or if the patient has special visual demands. Recurrence rates
          remain 15–50% after resolution, higher without treatment.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
        target_phenotypes:
        - preferred_term: Visual impairment
          term:
            id: HP:0000505
            label: Visual impairment
      selected_evidence:
        snippet: We propose a step-wise chart for clinical decision-making in the management and treatment
          of CSC. New data on long-term visual outcomes and the pathogenesis of CSC in relation to the
          pachychoroid disease spectrum provide a better understanding to inform our management of this
          disease.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
