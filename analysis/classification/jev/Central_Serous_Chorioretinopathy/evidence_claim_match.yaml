              id: MONDO:0018616
              label: central serous chorioretinopathy
        context: []
      assertion_type: Subtype
      assertion:
        name: Chronic CSCR
        description: Persistent form lasting more than 3–4 months, defined by continuing subretinal fluid
          with progressive RPE decompensation. Associated with diffuse RPE atrophy, photoreceptor outer
          segment disruption, and risk of choroidal neovascularization (CNV) in 2–15.6% of cases. Approximately
          12.8% develop legal blindness after mean 11.3-year follow-up without treatment. Intervention
          with half-dose PDT is indicated when SRF persists beyond 3–4 months.
      selected_evidence:
        snippet: Available evidence supports half-dose (or half-fluence) verteporfin photodynamic therapy
          as the treatment of choice for CSC to reduce choroidal hyperpermeability. A subset of patients
          with chronic CSC can develop choroidal neovascularisation, and these patients should be treated
          with intravitreal anti-vascular endothelial growth factor agents.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1038/s41433-025-03894-z
      reference_title: 'Treatment of central serous chorioretinopathy: new options for an old disease.'
      evidence_source: HUMAN_CLINICAL
      explanation: International expert consensus review distinguishes chronic CSC as requiring active
        treatment (PDT) and identifies CNV as a known serious complication requiring anti-VEGF.
