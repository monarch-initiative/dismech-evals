        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Subretinal Fluid Accumulation and Photoreceptor Injury
        description: Fluid accumulation beneath the neurosensory retina separates the photoreceptor layer
          from the RPE, disrupting outer segment renewal, nutritional exchange, and visual signal transduction.
          Photoreceptor outer segments elongate abnormally in response to subretinal fluid; the ellipsoidal
          zone (EZ) band disruption on OCT correlates directly with visual acuity loss. Prolonged detachment
          in chronic CSCR leads to progressive photoreceptor atrophy, ganglion cell loss, and permanent
          visual impairment. Choroidal neovascularization (CNV; type 1) develops in 2–15.6% of chronic
          CSCR eyes and further threatens visual prognosis. Legal blindness develops in approximately
          12.8% of patients after mean 11.3-year follow-up.
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        biological_processes:
        - preferred_term: visual perception
          term:
            id: GO:0007601
            label: visual perception
          modifier: DECREASED
        - preferred_term: positive regulation of angiogenesis
          term:
            id: GO:0045766
            label: positive regulation of angiogenesis
          modifier: INCREASED
        locations:
        - preferred_term: macula lutea
          term:
            id: UBERON:0000053
            label: macula lutea
        - preferred_term: retina
          term:
            id: UBERON:0000966
            label: retina
      selected_evidence:
        snippet: Half-dose photodynamic therapy (PDT) remains the mainstay of clinical practice, with
          about 95% of patients with chronic CSCR improving to visual acuity (VA) of 20/30 or better.
        supports: SUPPORT
