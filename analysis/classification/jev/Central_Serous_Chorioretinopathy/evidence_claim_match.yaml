  da87b28eb9972c23169f764cfcb1548961604752f131bf1f369dfc12495fcc2d:
    claim:
      about:
        disease:
          name: Central Serous Chorioretinopathy
          disease_term:
            preferred_term: Central Serous Chorioretinopathy
            term:
              id: MONDO:0018616
              label: central serous chorioretinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Retinal Pigment Epithelium Dysfunction
        description: Hydrostatic and complement-mediated stress from the congested pachychoroid leads
          to focal RPE breakdown. RPE cells lose tight junction integrity and ion transport function,
          allowing fluid to leak through focal RPE defects into the subretinal space, visible as fluorescein
          angiography leakage points. In acute CSCR, single focal leaks predominate; in chronic CSCR,
          diffuse RPE atrophy and decompensation develop. Reduced serum lipocalin 2 (LCN2/NGAL) in CSCR
          patients reflects susceptibility to excessive oxidative stress and innate immune dysregulation,
          compounding RPE barrier failure.
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
