          value:
            name: Serum Lipocalin 2 (LCN2/NGAL)
            presence: DECREASED
            context: Serum LCN2 (lipocalin-2, also known as NGAL) is significantly reduced in both acute/recurrent
              and chronic CSCR compared to age- and sex-matched healthy controls. Low LCN2 reflects susceptibility
              to oxidative stress and innate immune dysregulation at the RPE level. The 80 ng/mL serum
              cutoff discriminates acute/recurrent CSCR from controls with 80.3% sensitivity and 75.8%
              specificity. Serum NGAL/MMP-9 complex is similarly reduced (cutoff 38 ng/mL, 69.6% sensitivity,
              80.3% specificity). LCN2 reduction is consistent across both CSCR subtypes, providing a
              potential systemic biomarker link between acute and chronic disease forms.
          role: ancestor
      assertion_type: BiomarkerReadout
      assertion:
        target: Retinal Pigment Epithelium Dysfunction
        relationship: READOUT_OF
        direction: NEGATIVE
        endpoint_context: DIAGNOSTIC
        interpretation: Reduced serum LCN2 reflects systemic susceptibility to oxidative stress and innate
          immune dysregulation that contributes to RPE barrier failure in CSCR. Low LCN2 distinguishes
          CSCR patients from healthy controls and correlates with the oxidative stress component of RPE
          dysfunction.
      selected_evidence:
        snippet: A ROC curve showed that for LCN2 serum levels, the 80-ng/ml cutoff value allows to discriminate
          acute/recurrent CSCR from controls with 80.3% sensitivity and 75.8% specificity
        supports: SUPPORT
