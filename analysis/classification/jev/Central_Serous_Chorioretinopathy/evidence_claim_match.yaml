      assertion_type: Subtype
      assertion:
        name: Acute CSCR
        description: Self-limiting form lasting less than 3–4 months. Subretinal fluid resolves spontaneously
          with recovery of visual acuity in approximately 90–95% of cases. Most common form, predominantly
          affecting young to middle-aged males under psychological or corticosteroid-related stress. Recurrence
          rates of 15–50% are observed across series.
      selected_evidence:
        snippet: CSCR is the first ever described pachychoroid disease. Most recently, hypothetical venous
          overload choroidopathy is also proposed due to its distinguished morphological and pathological
          characteristics, including choroidal thickening, choriocapillaris hyperpermeability, remodelling,
          and intervortex venous anastomoses.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
