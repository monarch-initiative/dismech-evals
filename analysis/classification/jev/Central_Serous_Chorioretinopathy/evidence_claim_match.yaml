  8e92c188b64d962cce100e9e07deea7f8619babd8254932fcb683b1cc2ca6585:
    claim:
      about:
        disease:
          name: Central Serous Chorioretinopathy
          disease_term:
            preferred_term: Central Serous Chorioretinopathy
            term:
              id: MONDO:0018616
              label: central serous chorioretinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Complement Factor H Pathway Dysregulation
        description: Genetic variation at the CFH locus (1q31.3) is among the most consistently replicated
          susceptibility signals for CSCR across multiple GWAS. Complement factor H (CFH) and its related
          proteins (CFHR1-5) regulate the alternative complement pathway through competition for C3b binding.
          Functional enrichment analysis of genes mapped from GWAS meta-analysis identified 26 CFH- or
          CFHR-related pathways significantly associated with CSCR. Protein quantitative trait loci analyses
          support protein-level contribution of the CFH pathway to CSCR pathogenesis. The mechanism likely
          involves local complement dysregulation in the choroidal-RPE interface, driving tissue damage
          and chronic vascular inflammation, in parallel with the mineralocorticoid pathway.
        biological_processes:
        - preferred_term: complement activation
          term:
            id: GO:0006956
            label: complement activation
          modifier: INCREASED
      selected_evidence:
        snippet: Protein QTL also suggested the protein-level contribution of the complement factor H
          pathway to CSC pathogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1038/s41598-025-92210-6
      reference_title: Genome-wide association and multi-omics analyses provide insights into the disease
        mechanisms of central serous chorioretinopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: 2025 multi-ethnic GWAS meta-analysis (8,811 discovery, 4,338 replication) supports
        protein-level contribution of the CFH pathway to CSCR pathogenesis via protein quantitative trait
