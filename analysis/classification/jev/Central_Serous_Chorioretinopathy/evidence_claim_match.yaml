              id: MONDO:0018616
              label: central serous chorioretinopathy
        context: []
      assertion_type: Treatment
      assertion:
        name: Half-Dose Verteporfin Photodynamic Therapy
        description: Half-dose (3 mg/m² instead of 6 mg/m²) photodynamic therapy with verteporfin is the
          established treatment of choice for chronic CSCR. Verteporfin selectively accumulates in abnormal
          choroidal vessels; laser activation at 689 nm induces choriocapillaris vascular remodeling,
          reducing choroidal hyperpermeability and subretinal fluid accumulation. Half-dose protocol minimizes
          RPE damage compared to standard PDT. SRF resolution rates of 91% at 19 months of follow-up are
          reported; approximately 95% of treated patients achieve VA of 20/30 or better. PDT reduces recurrence
          to approximately 20% versus 53.8% with observation alone. The PLACE randomized trial demonstrated
          superiority of half-dose PDT over high-density subthreshold micropulse laser in chronic CSCR.
          Half-fluence PDT is an alternative reduced dosing strategy with comparable safety.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Photodynamic therapy
          term:
            id: NCIT:C15300
            label: Photodynamic Therapy
          therapeutic_agent:
          - preferred_term: verteporfin
            term:
              id: CHEBI:32293
              label: verteporfin
        target_phenotypes:
        - preferred_term: Visual impairment
          term:
            id: HP:0000505
            label: Visual impairment
      selected_evidence:
        snippet: Available evidence supports half-dose (or half-fluence) verteporfin photodynamic therapy
          as the treatment of choice for CSC to reduce choroidal hyperpermeability.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
      context_paths:
