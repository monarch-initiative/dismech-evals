        context: []
      assertion_type: Treatment
      assertion:
        name: Mineralocorticoid Receptor Antagonists
        description: Eplerenone and spironolactone, oral mineralocorticoid receptor antagonists, were
          investigated as pharmacological treatments targeting the MR/cortisol pathway implicated in CSCR
          pathogenesis. The VICI randomized controlled trial (eplerenone vs. placebo in chronic CSCR)
          failed to meet its primary endpoint of improving best-corrected visual acuity at 12 months.
          Despite mechanistic rationale and early observational evidence, eplerenone did not demonstrate
          significant benefit over placebo for visual acuity in this pivotal trial. Routine use for chronic
          CSCR remains controversial; these agents may be considered when PDT is unavailable or contraindicated,
          but are not a substitute for PDT. Long-term RCT data are warranted before routine clinical adoption.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: eplerenone
            term:
              id: CHEBI:31547
              label: eplerenone
          - preferred_term: spironolactone
            term:
              id: CHEBI:9241
              label: spironolactone
      selected_evidence:
        snippet: The VICI study found that oral eplerenone (25 mg/day for 1 week then increasing to 50
          mg/day for up to 12 months) was not superior to placebo
        supports: REFUTE
