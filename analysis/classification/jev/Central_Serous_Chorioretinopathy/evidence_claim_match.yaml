  ed6afe8778f128ab69a607bc40f1a1a9a418430f7aa2c0dfdb81cd95fcd2626d:
    claim:
      about:
        disease:
          name: Central Serous Chorioretinopathy
          disease_term:
            preferred_term: Central Serous Chorioretinopathy
            term:
              id: MONDO:0018616
              label: central serous chorioretinopathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mineralocorticoid and Glucocorticoid Receptor Overstimulation
        description: Elevated glucocorticoids and mineralocorticoids—from exogenous corticosteroid use,
          endogenous hypercortisolism, or stress-driven neuroendocrine activation— overstimulate mineralocorticoid
          receptors (MR; encoded by NR3C2) in choroidal endothelial cells. This upregulates vascular permeability
          factors, disrupts endothelial tight junctions, and promotes choroidal congestion. NR3C2 variants
          have been associated with CSCR in candidate-gene haplotype studies (not genome-wide significant
          in the cited GWAS), linking genetic predisposition to the glucocorticoid/mineralocorticoid axis.
          Corticosteroid use is the strongest and most consistently documented modifiable environmental
          risk factor for CSCR, producing more severe disease with higher recurrence and bilateral involvement.
        biological_processes:
        - preferred_term: glucocorticoid receptor signaling pathway
          term:
            id: GO:0042921
            label: nuclear receptor-mediated glucocorticoid signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Recent evidence describing the pathogenesis of and risk factors for CSC focuses on possible
          dysfunction of the choroid and retinal pigment epithelium, and the role of corticosteroids.
          It is suggested that CSC lies within the spectrum of pachychoroid disorders that share the characteristic
          of thickened choroidal tissue.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1038/s41433-025-03894-z
      reference_title: 'Treatment of central serous chorioretinopathy: new options for an old disease.'
      evidence_source: HUMAN_CLINICAL
      explanation: 2025 international expert review directly implicates corticosteroids and choroid-RPE
        dysfunction in CSCR pathogenesis, consistent with the mineralocorticoid receptor mechanism.
