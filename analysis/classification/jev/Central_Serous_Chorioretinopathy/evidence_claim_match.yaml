            term:
              id: MONDO:0018616
              label: central serous chorioretinopathy
        context: []
      assertion_type: Treatment
      assertion:
        name: Subthreshold Micropulse Laser
        description: High-density subthreshold micropulse laser (577 nm HSML) delivers sub-lethal retinal
          laser energy to stimulate RPE function without causing visible burns. Complete SRF resolution
          rates range from 36–100% across studies. The PLACE randomized trial demonstrated that half-dose
          PDT was superior to high-density micropulse laser for chronic CSCR in SRF resolution rate and
          recurrence. Micropulse laser is a reasonable alternative when PDT is unavailable, contraindicated,
