          for MTM1, DNM2 and BIN1 mutations. This form sits apart from the others mechanistically: the
          classic CNM genes act on excitation-contraction coupling at the triad, whereas titin is the
          giant sarcomeric protein forming the myofibrillar backbone, so the shared centronuclear histology
          here is reached by a different route.'
