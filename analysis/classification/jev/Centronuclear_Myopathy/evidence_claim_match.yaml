        description: 'Converging on a final common pathway, the CNM genes disrupt the structure of the
          triad — the close apposition of the T-tubule with the terminal sarcoplasmic reticulum that regulates
          excitation-contraction coupling. CNM animal models across genotypes share pathological anomalies
          in T-tubule remodeling, ECC, organelle mispositioning, and protein homeostasis. T-tubule disorganization
          displaces the calcium-handling machinery and contributes to mispositioning of nuclei and organelles
          toward the fiber center.

          '
        cell_types:
