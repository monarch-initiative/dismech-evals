        name: Reproductive Endocrine Axis Dysfunction
        description: 'Central (hypogonadotropic) hypogonadism arises from dysfunction at the hypothalamic
          GnRH-neuron and pituitary gonadotrope levels. Pulsatile GnRH administration can transiently
          restore gonadotropin and sex-steroid secretion early in the course, indicating a primarily hypothalamic
          GnRH deficiency with a superimposed and progressive pituitary component. The result is delayed/absent
          puberty, lack of secondary sexual characteristics, and low gonadotropins and sex steroids.

          '
