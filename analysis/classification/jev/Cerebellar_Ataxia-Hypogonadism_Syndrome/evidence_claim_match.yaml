              label: cerebellar ataxia-hypogonadism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disordered Ubiquitination and Impaired Protein Quality Control
        description: 'The core molecular lesion in RNF216-, OTUD4-, and STUB1/CHIP-related Gordon Holmes
          syndrome is disruption of the ubiquitin-proteasome system and protein quality control. RNF216
          is an RBR/RING-class E3 ubiquitin ligase that attaches ubiquitin to substrates (including upstream
          activators of NF-kB signaling), marking them for proteasome-mediated degradation; OTUD4 is a
          partnering deubiquitinase. STUB1 encodes CHIP, a co-chaperone E3 ligase central to protein quality
          control. Biallelic loss-of-function (or loss of critical E3 activity) in these enzymes impairs
          ubiquitination and turnover of client proteins. The digenic RNF216/OTUD4 form reflects an epistatic
          interaction within a shared pathway.

          '
        genes:
        - preferred_term: RNF216
          term:
            id: hgnc:21698
