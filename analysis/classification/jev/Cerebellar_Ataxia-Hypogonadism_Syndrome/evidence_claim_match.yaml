        context: []
      assertion_type: Inheritance
      assertion:
        name: Digenic inheritance (RNF216/OTUD4)
        inheritance_term:
          preferred_term: Digenic inheritance
          term:
            id: HP:0010984
            label: Digenic inheritance
        description: 'Alongside the usual biallelic RNF216 form, one consanguineous family carried homozygous
          mutations at two loci at once - RNF216 and OTUD4 - in three affected siblings. The pairing is
          mechanistically coherent rather than incidental: RNF216 is a ubiquitin E3 ligase and OTUD4 a
          deubiquitinase, so the two lesions hit opposite arms of the same ubiquitination cycle. Because
          the Inheritance class has no genes slot the contributing loci are named here: RNF216 and OTUD4;
          both have records in the genetic section. Note this is digenic in the sense of two homozygous
          loci co-segregating, not the double-heterozygote pattern of RP7.'
      selected_evidence:
        snippet: Digenic homozygous mutations in RNF216 and OTUD4, which encode a ubiquitin E3 ligase
          and a deubiquitinase, respectively, were found in three affected siblings in a consanguineous
          family.
        supports: SUPPORT
