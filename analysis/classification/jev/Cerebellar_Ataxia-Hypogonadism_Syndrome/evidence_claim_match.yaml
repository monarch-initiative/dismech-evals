              label: cerebellar ataxia-hypogonadism syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PNPLA6 / Neuropathy Target Esterase Phospholipid Dysfunction
        description: Biallelic PNPLA6 variants can reduce neuropathy target esterase (NTE) activity. This
          endoplasmic-reticulum-associated phospholipase participates in phospholipid homeostasis. Variant-specific
          residual activity helps explain tissue involvement across the PNPLA6 spectrum, including its
          Gordon Holmes presentation; downstream neuronal and endocrine pathways remain incompletely defined.
        genes:
        - preferred_term: PNPLA6
          term:
            id: hgnc:16268
            label: PNPLA6
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
        notes: The 2024 study found lower estimated residual activity associated with retinopathy and
          endocrinopathy across the PNPLA6 spectrum, but no clear relationship with age at onset. These
          research estimates are not a validated individual prognostic threshold. GHS remains clinically
          distinguishable from the retinal-predominant Boucher-Neuhauser/Oliver-McFarlane overlap.
        molecular_functions:
        - preferred_term: glycerophospholipase activity
          term:
            id: GO:0004620
            label: glycerophospholipase activity
          modifier: DECREASED
      selected_evidence:
        snippet: PNPLA6 disorders span a phenotypic continuum characterized by variable combinations of
          cerebellar ataxia; upper motor neuron involvement manifesting as spasticity and/or brisk reflexes;
          chorioretinal dystrophy associated with variable degrees of reduced visual function; and hypogonadotropic
          hypogonadism
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
