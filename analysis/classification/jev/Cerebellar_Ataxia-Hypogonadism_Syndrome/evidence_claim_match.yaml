      assertion_type: Pathophysiology
      assertion:
        name: RNF216 K63-linked ubiquitination deficiency
        description: GHS-associated RNF216 catalytic-region variants impair E3 ubiquitin ligase activity.
          RNF216 synthesizes K63-linked chains in biochemical assays, implicating altered ubiquitin signaling.
          The relevant neuronal substrates and the steps connecting this defect to human neurodegeneration
          remain incompletely resolved.
        genes:
        - preferred_term: RNF216
          term:
            id: hgnc:21698
            label: RNF216
        molecular_functions:
        - preferred_term: ubiquitin protein ligase activity
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: protein K63-linked ubiquitination
          term:
            id: GO:0070534
            label: protein K63-linked ubiquitination
          modifier: DECREASED
        notes: ARC and endocytic proteins were candidate interactors or substrates in overexpression and
          lysate experiments. These findings do not establish a complete human disease pathway through
          proteasomal degradation.
      selected_evidence:
        snippet: Strikingly, we found that TRIAD3 synthesises specifically lysine-63 (K63)-linked poly-ubiquitin
          chains in vitro, a chain type that usually plays a role in mediating signalling events rather
          than triggering proteasomal degradation.
        supports: SUPPORT
    origin:
