  35aca1b290ceac54a5c5877e250dfc98a56ab8c2a8fdb6c2141ee537d4adbcc4:
    claim:
      about:
        disease:
          name: cerebellar ataxia, brain abnormalities, and cardiac conduction defects
          disease_term:
            preferred_term: cerebellar ataxia, brain abnormalities, and cardiac conduction defects
            term:
              id: MONDO:0859200
              label: cerebellar ataxia, brain abnormalities, and cardiac conduction defects
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: EXOSC5 Subunit Dysfunction
        biological_scale: MOLECULAR
        description: Biallelic EXOSC5 variants (recurrent hypomorphic missense such as p.Thr114Ile plus
          null alleles including intragenic deletions and frameshifts) alter EXOSC5, a structural subunit
          of the RNA exosome. Some variants reduce RNA exosome function and alter interactions with other
          exosome subunits; the Slavotinek study concludes that disease mechanism varies with the specific
          variant. The nine-subunit exosome core (EXOSC1-9) is catalytically inactive and the 3' to 5'
          exoribonuclease activity is supplied by the associated DIS3 and EXOSC10 nucleases, so the GO:0000175
          binding here represents the activity of the whole complex that EXOSC5 scaffolds rather than
          a catalytic function lost from EXOSC5 itself.
        genes:
        - preferred_term: EXOSC5
          term:
            id: hgnc:24662
            label: EXOSC5
        molecular_functions:
        - preferred_term: RNA exosome 3' to 5' exoribonuclease activity
          modifier: DECREASED
          term:
            id: GO:0000175
            label: 3'-5'-RNA exonuclease activity
      selected_evidence:
        snippet: We identified five patients with biallelic variants in EXOSC5, which encodes a structural
          subunit of the RNA exosome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32504085
      reference_title: Biallelic variants in the RNA exosome gene EXOSC5 are associated with developmental
        delays, short stature, cerebellar hypoplasia and motor weakness.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes EXOSC5 as a structural RNA-exosome subunit altered by biallelic disease
        variants.
