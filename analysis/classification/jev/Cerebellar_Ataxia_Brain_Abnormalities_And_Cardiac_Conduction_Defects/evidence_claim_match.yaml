  f0ba2efa2f10ab2006d877bac6a90045100521fb9edd6f2694b109e38b03d234:
    claim:
      about:
        disease:
          name: cerebellar ataxia, brain abnormalities, and cardiac conduction defects
          disease_term:
            preferred_term: cerebellar ataxia, brain abnormalities, and cardiac conduction defects
            term:
              id: MONDO:0859200
              label: cerebellar ataxia, brain abnormalities, and cardiac conduction defects
        context: []
      assertion_type: Genetic
      assertion:
        name: EXOSC5 variants
        gene_term:
          preferred_term: EXOSC5
          term:
            id: hgnc:24662
            label: EXOSC5
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Biallelic EXOSC5 variants cause CABAC syndrome. The recurrent missense allele p.Thr114Ile
          (c.341C>T, NM_020158.4) is carried by most patients with conduction disease and is seen compound
          heterozygous with null alleles or with other missense variants; homozygous missense (p.Leu206His,
          p.Met148Thr), an in-frame single-codon deletion (p.Glu77del) and null alleles (an exon 5-6 deletion
          and an early frameshift) are also reported. Slavotinek et al. conclude that disease mechanism
          varies with the specific variant. No ClinGen gene-disease validity (CGGV) record for EXOSC5
          is cached in this repository, so gene_disease_validity is omitted; GenCC lists the gene-disease
          relationship as Strong (autosomal recessive).
        variants:
        - name: p.Thr114Ile (c.341C>T)
          description: Recurrent pathogenic missense variant (NM_020158.4:c.341C>T, p.Thr114Ile), seen
            compound heterozygous with an exon 5-6 deletion, with an early frameshift, and with p.Thr101Lys,
            and associated with cardiac conduction disease.
        - name: p.Thr101Lys (c.302C>A)
          description: Novel missense variant (NM_020158.4:c.302C>A, p.Thr101Lys) found in trans with
            p.Thr114Ile in two affected siblings.
        - name: Homozygous and null alleles
          description: Additional biallelic genotypes include homozygous p.Leu206His, homozygous p.Met148Thr
            (via paternal chromosome 19 isodisomy), an exon 5-6 deletion and an early frameshift in trans
            with p.Thr114Ile.
        - name: p.Glu77del (c.230_232del)
          description: Homozygous in-frame single-codon deletion (NM_020158.4:c.230_232del, p.Glu77del)
            in the exoribonuclease phosphorolytic domain, reported in a consanguineous patient with CABAC
            syndrome and renal thrombotic microangiopathy.
      selected_evidence:
        snippet: We identified five patients with biallelic variants in EXOSC5, which encodes a structural
          subunit of the RNA exosome.
        supports: SUPPORT
