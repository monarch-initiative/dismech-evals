        name: Endolysosomal Trafficking and Autophagy Defect (CAMRQ2)
        description: 'WDR81 is a BEACH/WD40-repeat transmembrane protein expressed in developing brain,
          including the Purkinje cell layer of the cerebellum. It is required for normal endolysosomal
          membrane dynamics and selective autophagic clearance. Biallelic loss-of-function or pathogenic
          missense variants (originally the homozygous p.P856L allele in a consanguineous Turkish kindred)
          disrupt these vesicular and autophagic processes in neurons, with secondary impact on cerebellar
          circuit formation and Purkinje cell function.

          '
        gene:
          preferred_term: WDR81
          description: 'BEACH/WD40-repeat protein required for endolysosomal dynamics and selective autophagy;
            biallelic loss causes CAMRQ2.

