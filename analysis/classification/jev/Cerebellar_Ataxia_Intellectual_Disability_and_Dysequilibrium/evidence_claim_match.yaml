      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Reelin Signaling (CAMRQ1)
        description: 'VLDLR is a transmembrane receptor for the secreted glycoprotein Reelin. Reelin signaling
          through VLDLR (and the paralog ApoER2) provides positional cues for radially migrating neuroblasts
          in the developing cerebral cortex and cerebellum. Loss of VLDLR — by homozygous deletion or
          pathogenic missense alleles that impair plasma-membrane trafficking — disrupts Reelin-mediated
          neuronal migration and cerebellar lamination, producing the CAMRQ1 phenotype.

          '
        gene:
          preferred_term: VLDLR
          description: 'Very-low-density lipoprotein receptor, the Reelin co-receptor lost in CAMRQ1.

            '
          modifier: DECREASED
          term:
            id: hgnc:12698
