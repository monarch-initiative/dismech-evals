            description: 'A common downstream substrate across all four CAMRQ subtypes is impaired development
              and/or function of the cerebellar cortex, with hypoplasia of the inferior cerebellum and
              vermis. Purkinje cells — the sole output neuron of the cerebellar cortex — are central targets:
              CA8 is enriched in Purkinje cells; ATP8A2 is required for Purkinje cell membrane integrity;
              Reelin signaling via VLDLR governs Purkinje cell layer formation.

              '
