            id: GO:0038026
            label: reelin-mediated signaling pathway
          modifier: DECREASED
        - preferred_term: neuron migration
          term:
            id: GO:0001764
            label: neuron migration
          modifier: DECREASED
      selected_evidence:
        snippet: VLDLR is part of the reelin signaling pathway, which guides neuroblast migration in the
          cerebral cortex and cerebellum.
