            description: 'CAMRQ1 (OMIM #224050) is caused by biallelic loss-of-function variants in VLDLR
              (very-low-density lipoprotein receptor), a co-receptor in the Reelin signaling pathway that
              guides neuronal migration during cerebellar and cortical development. First described in
