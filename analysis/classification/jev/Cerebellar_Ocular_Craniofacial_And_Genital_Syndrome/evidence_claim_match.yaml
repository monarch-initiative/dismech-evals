          Pitx3, Maf and Sfrp2 and housekeeping genes of DNA and nucleotide metabolism, before the cells
          die. The authors propose that MAB21L1 acts as a nuclear factor modulating these programmes.
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: lens placode formation
          term:
            id: GO:0001743
            label: lens placode formation
          modifier: DECREASED
      selected_evidence:
        snippet: Moreover, gene ontology analysis of the 279 differentially expressed genes indicated
          enrichment in housekeeping genes associated with DNA/nucleotide metabolism prior to cell death.
        supports: SUPPORT
