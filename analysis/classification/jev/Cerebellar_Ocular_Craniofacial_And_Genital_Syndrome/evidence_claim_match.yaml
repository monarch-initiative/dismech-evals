          placode also gives rise to the cornea and iris. Patients with biallelic loss of function have
          a milder eye phenotype, dominated by bilateral corneal dystrophy and opacity; one patient also
          needed cataract extraction. The step from the mouse lens defect to the human corneal phenotype
          is inferred.
