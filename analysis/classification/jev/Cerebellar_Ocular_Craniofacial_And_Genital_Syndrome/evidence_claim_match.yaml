  53084d9d11f3b6c3eb77bde26ec65de3b8b07aa5b49418ac9ec00b250334b0e7:
    claim:
      about:
        disease:
          name: Cerebellar, Ocular, Craniofacial, and Genital Syndrome
          disease_term:
            preferred_term: cerebellar, ocular, craniofacial, and genital syndrome
            term:
              id: MONDO:0032774
              label: cerebellar, ocular, craniofacial, and genital syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MAB21L1 Biallelic Loss of Function
        description: Homozygous frameshift and nonsense variants, plus one missense variant (p.Gln233Pro)
          predicted to disrupt an alpha helix, are expected to abolish MAB21L1 function. MAB21L1 has the
          nucleotidyltransferase fold of cGAS, but no nucleotidyltransferase activity has been demonstrated,
          so the lost function is thought to be non-catalytic; the protein associates with the PAX6 regulators
          MEIS1, MEIS2 and PBX1. Loss of these interactions in patients is proposed but has not been measured.
          All coding variants lie in the single coding exon.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MAB21L1
          term:
            id: hgnc:6757
            label: MAB21L1
        molecular_functions:
        - preferred_term: binding to the PAX6 regulators MEIS1, MEIS2 and PBX1
          term:
            id: GO:0140297
            label: DNA-binding transcription factor binding
          modifier: DECREASED
      selected_evidence:
        snippet: The mutations in MAB21L1 identified in this study as well as the previously identified
          variant in an additional family with a similar phenotype are frameshift/nonsense variants except
          one missense allele, most likely leading to complete loss of function of the protein, including
          loss of interactions with potential partner proteins.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30487245
      reference_title: MAB21L1 loss of function causes a syndromic neurodevelopmental disorder with distinctive
        cerebellar, ocular, craniofacial and genital features (COFG syndrome).
      evidence_source: HUMAN_CLINICAL
      explanation: The patient alleles are predicted to cause complete loss of MAB21L1 function.
