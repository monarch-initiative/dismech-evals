      assertion_type: DifferentialDiagnosis
      assertion:
        name: MAB21L1-related autosomal dominant microphthalmia and aniridia
        description: Heterozygous missense variants at MAB21L1 codon Arg51, often de novo, cause an eye-restricted
          disorder (microphthalmia, aniridia, or blepharophimosis with anterior segment and macular dysgenesis)
          without the cerebellar, craniofacial, genital or cognitive features of COFG.
        distinguishing_features:
        - Monoallelic Arg51 missense variants rather than biallelic loss of function.
        - Autosomal dominant or de novo rather than recessive.
        - Ocular anomalies only.
      selected_evidence:
        snippet: Heterozygous pathogenic variants in MAB21L1 account for a new AD BAMD syndrome, which
          is completely different from COFG caused by homozygous variants in MAB21L1.
        supports: SUPPORT
