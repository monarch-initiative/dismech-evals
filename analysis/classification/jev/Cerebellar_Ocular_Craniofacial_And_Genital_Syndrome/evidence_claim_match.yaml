            term:
              id: MONDO:0032774
              label: cerebellar, ocular, craniofacial, and genital syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: MAB21L1
        gene_term:
          preferred_term: MAB21L1
          term:
            id: hgnc:6757
            label: MAB21L1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: Homozygous frameshift, nonsense and missense variants in the single coding exon. Heterozygous
          carriers are unaffected; monoallelic Arg51 missense variants cause a different, dominant eye-only
          disorder.
        gene_disease_validity:
        - validity_classification: STRONG
          classified_by: CLINGEN
          external_id: CGGV:assertion_8fae9544-f1fa-4155-8ff4-7719efb37d1a-2024-04-19T160000.000Z
        variants:
        - name: c.841delG (p.Glu281Aspfs*20)
          description: Homozygous frameshift in four affected members of an Iranian family (family 1).
        - name: c.698A>C (p.Gln233Pro)
          description: The only missense allele, homozygous in an Iranian boy (family 2); predicted to
            disrupt an alpha helix. Its equivalence to null alleles has not been tested functionally.
        - name: c.279_286delACTGCCCG (p.Ser93Serfs*48)
          description: Homozygous frameshift in a Lebanese girl (family 3).
        - name: c.859delC (p.Arg287Glufs*14)
          description: Homozygous frameshift in a Turkish family (family 4).
        - name: c.840C>G (p.Tyr280*)
          description: Homozygous nonsense variant in three affected Turkish siblings (family 5).
        - name: c.735dupG (p.Cys246Leufs*18)
          description: Homozygous frameshift in the first reported patient, an Algerian boy.
      selected_evidence:
