        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vessel-wall degeneration and fragility
        description: Progressive vascular amyloid deposition is accompanied by loss of vascular smooth
          muscle cells, vessel-wall thickening, and altered cerebrovascular physiology, weakening the
          vessel wall. Hypertension is a major non-genetic trigger that promotes vessel-wall weakening
          and hemorrhage. These changes progress through altered cerebrovascular physiology to non-hemorrhagic
          brain injury.
        cell_types:
        - preferred_term: Vascular smooth muscle cell of the brain vasculature
          term:
            id: CL:0002590
            label: smooth muscle cell of the brain vasculature
          modifier: DECREASED
      selected_evidence:
        snippet: "(stage two) \nalteration of cerebrovascular physiology, (stage three) non-haemorrhagic\
          \ brain injury"
        supports: SUPPORT
