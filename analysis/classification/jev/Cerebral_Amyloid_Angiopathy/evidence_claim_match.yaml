          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: Vascular endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
      selected_evidence:
        snippet: it plays a known role in processing, production, aggregation, and clearance
        supports: SUPPORT
