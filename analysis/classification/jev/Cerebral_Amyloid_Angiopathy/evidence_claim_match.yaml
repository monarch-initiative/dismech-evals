      assertion_type: Pathophysiology
      assertion:
        name: Impaired perivascular amyloid-beta clearance
        description: Reduced clearance of soluble Abeta along perivascular (intramural periarterial) drainage
          pathways leads to its progressive accumulation in cortical and leptomeningeal vessel walls.
          APOE modulates Abeta processing, aggregation, and clearance, making APOE genotype the dominant
          common genetic determinant of sporadic CAA.
        biological_processes:
        - preferred_term: Amyloid-beta clearance
          term:
            id: GO:0097242
            label: amyloid-beta clearance
          modifier: DECREASED
        cell_types:
