      assertion_type: Pathophysiology
      assertion:
        name: Periventricular White Matter Injury
        description: In preterm infants, hypoxia-ischemia and inflammation injure the periventricular
          white matter (periventricular leukomalacia). Pre-myelinating oligodendrocyte precursor cells
          are selectively vulnerable to glutamate excitotoxicity, free-radical (oxidative/nitrative) attack,
          and cytokine injury, producing focal necrosis and diffuse hypomyelination of the white matter
          tracts carrying descending motor fibers to the legs — the substrate of spastic diplegia.
        biological_scale: TISSUE
        cell_types:
        - preferred_term: pre-myelinating oligodendrocyte precursor cell
          term:
            id: CL:0002453
            label: oligodendrocyte precursor cell
          modifier: DECREASED
        biological_processes:
        - preferred_term: oligodendrocyte differentiation
          term:
            id: GO:0048709
            label: oligodendrocyte differentiation
          modifier: DECREASED
        - preferred_term: myelination
          term:
            id: GO:0042552
            label: myelination
          modifier: DECREASED
        locations:
        - preferred_term: periventricular white matter
          term:
            id: UBERON:0002316
            label: white matter
      selected_evidence:
        snippet: This type of brain injury is generally thought to consist primarily of periventricular
          leukomalacia (PVL), a distinctive form of cerebral white matter injury.
        supports: SUPPORT
