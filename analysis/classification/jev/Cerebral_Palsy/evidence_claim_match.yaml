          nucleus, and other deep grey structures, causing neurotoxic injury that manifests as dyskinetic
          (choreoathetoid) cerebral palsy, often with auditory neuropathy and gaze abnormalities.
        biological_scale: TISSUE
        locations:
        - preferred_term: basal ganglia
          term:
            id: UBERON:0002420
            label: basal ganglion
        notes: Modeled as a distinct postnatal etiologic root (no upstream edge from the developing-brain-injury
          node) because bilirubin encephalopathy is a metabolic/toxic insult mechanistically independent
          of the antenatal and intrapartum injury pathways; it converges downstream on basal ganglia and
          thalamic injury.
      selected_evidence:
        snippet: traditional and evolving definitions ranging from classical kernicterus with athetoid
          cerebral palsy, impaired upward gaze and deafness
        supports: SUPPORT
