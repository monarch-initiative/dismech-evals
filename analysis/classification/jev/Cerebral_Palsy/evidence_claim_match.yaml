      assertion_type: Pathophysiology
      assertion:
        name: Hypoxic-Ischemic Encephalopathy
        description: In term infants, an acute perinatal hypoxic-ischemic insult causes energy failure,
          glutamate excitotoxicity, and a delayed phase of oxidative stress, mitochondrial dysfunction,
          and apoptotic/necrotic neuronal death. Depending on severity and duration, injury targets the
          cerebral cortex, watershed white matter, and — in acute profound asphyxia — the deep grey nuclei
          (basal ganglia and thalamus).
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
          modifier: DECREASED
        biological_processes:
        - preferred_term: response to hypoxia
          term:
            id: GO:0001666
            label: response to hypoxia
          modifier: INCREASED
        - preferred_term: glutamate excitotoxicity
          term:
            id: GO:0007215
            label: glutamate receptor signaling pathway
          modifier: INCREASED
        - preferred_term: response to oxidative stress
          term:
            id: GO:0006979
            label: response to oxidative stress
          modifier: INCREASED
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
        notes: The glutamate excitotoxicity process is annotated with the generic GO term "glutamate receptor
          signaling pathway" (GO:0007215); the pathological claim here is excessive/overactivated signaling
          (captured by the INCREASED modifier), as GO has no dedicated excitotoxicity term.
      selected_evidence:
        snippet: HIE pathophysiology involves oxidative stress, mitochondrial energy production failure,
          glutaminergic excitotoxicity, and apoptosis.
        supports: SUPPORT
