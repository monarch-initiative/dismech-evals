      assertion_type: Pathophysiology
      assertion:
        name: Non-Progressive Developing-Brain Injury
        description: Cerebral palsy results from a static (non-progressive) disturbance or lesion of the
          developing fetal or infant brain. Although the underlying brain lesion is fixed, its clinical
          expression evolves as the child grows. The injury is heterogeneous in timing and mechanism (antenatal,
          perinatal, or early postnatal) and defines the motor phenotype.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: CP was thus defined as a non-progressive developmental disorder of movement and/or posture
          impairing motor function.
        supports: SUPPORT
