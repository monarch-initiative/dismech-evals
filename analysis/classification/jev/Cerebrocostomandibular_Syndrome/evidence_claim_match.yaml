        discussion_id: ccms_chondrogenesis_direction
        kind: KNOWLEDGE_GAP
        prompt: Is chondrogenesis increased or decreased in the tissues that malform? The in-vitro and
          in-vivo evidence point in opposite directions.
        attaches_to:
        - pathophysiology#Impaired Osteogenic and Altered Chondrogenic Differentiation
        - pathophysiology#Costal Patterning Failure
        rationale: SNRPB knockdown promotes chondrogenesis in HEPM craniofacial mesenchymal cells, while
          in the chick rib model Wnt inhibition reduces Sox9 and the authors conclude that inhibited chondrogenesis
          precipitates the rib defects. Both may be right if the direction is tissue-specific -- craniofacial
          mesenchyme and somite-derived costal cartilage are different lineages -- but nothing published
          tests that, and the two systems also differ in species and in whether SNRPB itself is perturbed.
          Until it is resolved, this entry does not route the in-vitro chondrogenic finding to the costal
          lesion.
        status: OPEN
      selected_evidence:
        snippet: On the other hand, low SmB/B' led to promoted chondrogenesis in HEPM mesenchymal stem
          cells.
        supports: SUPPORT
