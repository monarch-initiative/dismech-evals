                  label: SNRPB
              allele_type: SNV
              variant_origin: GERMLINE
              zygosity: HETEROZYGOUS
              functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
              description: 'The alternative-exon alleles are hypomorphic rather than null: total SNRPB
                expression in three patients ran at 0.53-0.66 of control. A true null allele appears to
                give a different and more severe disease, so the quantitative shortfall, not absence of
                the protein, is the lesion.'
            biological_processes:
            - preferred_term: regulation of alternative mRNA splicing
              modifier: ABNORMAL
              term:
                id: GO:0008380
                label: RNA splicing
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Reduced SNRPB Expression Through Nonsense-Mediated Decay
        causal_link_type: DIRECT
        description: Inclusion of the PTC-containing exon routes the transcript to nonsense-mediated decay,
          so increased inclusion lowers the amount of SNRPB message that survives to be translated.
      selected_evidence:
        snippet: This exon contains a premature termination codon that triggers nonsense-mediated mRNA
          decay when included in the transcript. These mutations cause increased inclusion of the alternative
          exon and decreased overall expression of SNRPB.
        supports: SUPPORT
