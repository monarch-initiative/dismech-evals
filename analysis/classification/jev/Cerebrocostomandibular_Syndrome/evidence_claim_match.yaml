        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ccms_rib_gap_respiratory_contribution
        kind: KNOWLEDGE_GAP
        prompt: How much of the neonatal respiratory failure is caused by the rib gaps themselves, as
          opposed to the upper airway obstruction and the abnormal costovertebral articulation?
        attaches_to:
        - pathophysiology#Restrictive and Unstable Thorax
        - pathophysiology#Neonatal Respiratory Failure
        rationale: 'The rib gaps are the sign everyone reaches for, but an anatomical review argues they
          may be close to mechanically neutral because increased chest wall compliance from the gaps is
          offset by decreased compliance at the costovertebral complex. The same review nominates a fourth
          contributor the gaps get credited for: absent or vestigial rib formation, which it links to
          respiratory distress and increased lethality and proposes counting as a priority indicator for
          treatment planning. So the question is not only "how much do the gaps contribute" but "which
          of the four thoracic features should be measured", and no prospective respiratory-mechanics
          study exists to settle either.'
        status: OPEN
      selected_evidence:
        snippet: a further absence of ribs or vestigial rib formation is associated with respiratory distress
          and increased lethality.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37265362
      reference_title: Consideration of the thoracic phenotype of cerebro-costo-mandibular syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Names the fourth contributor that the gap statement would otherwise omit, and the one
        the review argues is prognostically relevant.
