      assertion_type: Genetic
      assertion:
        name: NHEJ1
        association: Causal loss-of-function variant
        gene_term:
          preferred_term: NHEJ1
          term:
            id: hgnc:25737
            label: NHEJ1
        notes: Cernunnos-XLF deficiency is caused by pathogenic NHEJ1 variants that can abolish detectable
          NHEJ1 protein and are typically inherited in an autosomal recessive pattern. The reported allelic
          spectrum is broad - nonsense, frameshift, splice-site and intronic variants have all been described
          - and an in-frame splice consequence does not predict a milder outcome, because in-frame exon
          skipping can still leave no detectable protein.
      selected_evidence:
        snippet: Patients were found to have a homozygous splice site mutation immediately downstream
          of exon 3 in NHEJ1 (c.390 + 1G > C).
        supports: SUPPORT
