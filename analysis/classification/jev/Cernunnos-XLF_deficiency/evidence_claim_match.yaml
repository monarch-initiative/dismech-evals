            term:
              id: MONDO:0012650
              label: Cernunnos-XLF deficiency
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Clonal haematological evolution
        notes: Recorded as one patient's course rather than a disease-level pattern. Monosomy 7 appearing
          at five and a half years disappeared from subsequent annual marrow biopsies; seven and a half
          years later a del(20q) clone emerged and expanded, and the blood count improved rather than
          deteriorated as it did so. A clone arising in an NHEJ1-deficient marrow is therefore not automatically
          a step towards leukaemia, which matters for transplant timing decisions in a disease where a
          donor may not be available.
      selected_evidence:
        snippet: Monosomy 7 was not detected anymore in subsequent bone marrow biopsies that were repeated
          in yearly intervals. Instead, seven and a half years later, a novel clone with a del(20q) appeared
          and steadily increased thereafter.
        supports: SUPPORT
