      assertion_type: Diagnosis
      assertion:
        name: Lymphocyte subset immunophenotyping
        description: Flow-cytometric subset analysis narrows the differential before sequencing. The combination
          that points at Cernunnos is a fall in recent thymic emigrants and naive T cells with markedly
          elevated memory T cells, alongside normal-to-high IgM with low IgG and IgA - a profile the Egyptian
          cohort found discriminating specifically in T-B-NK+ SCID patients who have survived into later
          childhood, where the classic infantile SCID presentation is no longer the prompt.
        presence: Decreased recent thymic emigrants and naive T cells, elevated memory T cells, normal
          to high IgM with decreased IgG and IgA.
      selected_evidence:
        snippet: This immune profile is highly suggestive of Cernunnos deficiency in T-B-NK + SCID patients
          especially surviving for older ages.
        supports: SUPPORT
