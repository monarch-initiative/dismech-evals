          NHEJ1-deficient survivor presented with refractory cytopenia and monosomy 7, which later disappeared
          and was replaced by a del(20q) clone accompanied by gradual improvement in blood counts. Consistent
          with this, the Egyptian cohort describes premature aging of haematopoietic stem cells and occasional
          myeloproliferative disease.
        phenotype_term:
          preferred_term: Refractory cytopenia with clonal cytogenetic evolution
          term:
            id: HP:0002863
            label: Myelodysplasia
      selected_evidence:
        snippet: Cernunnos deficiency is a rare genetic disorder characterized by immunodeficiency, microcephaly,
          growth retardation, bird-like facies, sensitivity to ionizing radiation, few autoimmune manifestations,
          premature aging of hematopoietic stem cells at an early age, and occasional myeloproliferative
          disease.
        supports: SUPPORT
        directness: INDIRECT
