      assertion_type: ProgressionInfo
      assertion:
        phase: Long-term survival without transplantation
        age_range: Third decade
        notes: The disease is not uniformly lethal in childhood. The Arabian Gulf family included a patient
          alive at 30 years without ever having been transplanted, reported as the longest known survivor;
          independently, an NHEJ1-deficient boy for whom no suitable donor could be found had a blood
          count that remained stable for over 20 years with no specific therapy. Both are single patients
          and neither establishes a survival distribution, but together they are the reason a Cernunnos
          diagnosis should still be considered in an adult with the syndromic phenotype, and the reason
          the Egyptian cohort flags the immune profile as most useful in patients "surviving for older
          ages."
      selected_evidence:
        snippet: We discuss our data in the context of one of our patients who is still alive at the age
          of 30 years, without transplantation, and who is the longest known survivor of this disease.
        supports: SUPPORT
