      assertion_type: Pathophysiology
      assertion:
        name: Silva Pattern of Invasion
        description: The Silva pattern classification (Pattern A, B, C) stratifies HPV-associated endocervical
          adenocarcinomas by the architecture of stromal invasion and directly predicts the risk of lymph
          node metastasis. Pattern A tumors are well-demarcated with no lymphovascular invasion or nodal
          disease; Pattern B shows focal destructive invasion; Pattern C is diffusely destructive and
          is associated with approximately 22.5% nodal metastasis, driving more aggressive surgical and
          adjuvant management.
        cell_types:
        - preferred_term: Endocervical glandular epithelial cell
          term:
            id: CL:0000150
            label: glandular secretory epithelial cell
      selected_evidence:
        snippet: how HPV status, pattern of invasion as described by Silva and colleagues, histological
          features and molecular markers can be used to refine diagnosis and prognostication for patients
          with cervical adenocarcinoma
        supports: SUPPORT
