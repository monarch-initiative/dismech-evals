      assertion_type: Subtype
      assertion:
        name: HPV-Independent (HPVI)
        display_name: HPV-Independent Cervical Adenocarcinoma
        description: A minority subtype not driven by HPV infection, comprising the gastric-type, clear-cell,
          mesonephric, and endometrioid variants. HPV-independent tumors present at older age and more
          advanced stage, with substantially worse overall survival than HPV-associated adenocarcinoma.
          Gastric-type is the most clinically important HPV-independent variant; clear-cell has historical
          association with in utero diethylstilbestrol (DES) exposure.
      selected_evidence:
        snippet: HPVI cases were more frequent in older patients, presenting at more advanced stages and
          with worse OS.
        supports: SUPPORT
