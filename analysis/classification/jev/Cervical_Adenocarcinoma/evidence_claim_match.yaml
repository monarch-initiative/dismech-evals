              label: cervical adenocarcinoma
        context: []
      assertion_type: Subtype
      assertion:
        name: HPV-Associated (HPVA)
        display_name: HPV-Associated Endocervical Adenocarcinoma
        description: The dominant subtype of endocervical adenocarcinoma, driven by persistent infection
          with high-risk HPV (predominantly HPV-16, HPV-18, and HPV-45). Pathologically defined by apical
          mitoses and apoptotic bodies on the surface of glands and includes the "usual type" and villoglandular/mucinous
          variants. Better prognosis than HPV-independent adenocarcinoma. The 2020 WHO classification
          reorganized cervical adenocarcinoma around the HPVA vs HPV-independent axis.
      selected_evidence:
        snippet: the separation of cervical adenocarcinomas into HPV‐associated (HPVA) and HPV‐independent
          has resulted in a transformation of the classification system for cervical adenocarcinomas
        supports: SUPPORT
