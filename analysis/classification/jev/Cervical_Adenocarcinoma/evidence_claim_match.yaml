        description: A subset of cervical adenocarcinomas arises without HPV involvement, driven instead
          by recurrent somatic alterations in TP53, KRAS, CDKN2A, STK11, and other oncogenes/tumor suppressors.
          MSK-IMPACT prospective sequencing of 177 cervical cancers found PIK3CA (25%), ERBB2 (12%), KMT2C
          (10%), and KMT2D (9%) as the most prevalent alterations across cervical cancer histologies;
          STK11 alterations were enriched in gastric/clear-cell-associated tumors (33%, 7/21).
        cell_types:
        - preferred_term: Endocervical glandular epithelial cell
          term:
            id: CL:0000150
