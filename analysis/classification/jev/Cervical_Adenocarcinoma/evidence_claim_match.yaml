  47341518360ba5980e471a9e6af8ad94997cde7e90284944c6b5a8d920e768f7:
    claim:
      about:
        disease:
          name: Cervical Adenocarcinoma
          disease_term:
            preferred_term: cervical adenocarcinoma
            term:
              id: MONDO:0005153
              label: cervical adenocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HPV E6/E7-Mediated Oncogenesis in Glandular Epithelium
        description: Persistent infection of endocervical glandular epithelial cells by high-risk HPV
          (with HPV-16, HPV-18, and HPV-45 dominant) leads to integration of viral DNA and dysregulated
          expression of E6 and E7. E6 promotes p53 degradation; E7 inactivates pRB. The resulting loss
          of cell-cycle and apoptotic control, combined with HPV-driven genomic instability, drives progression
          from adenocarcinoma in situ to invasive HPV-associated adenocarcinoma.
        cell_types:
        - preferred_term: Endocervical glandular epithelial cell
          term:
            id: CL:0000150
            label: glandular secretory epithelial cell
        biological_processes:
        - preferred_term: Viral process
          term:
            id: GO:0016032
            label: viral process
        - preferred_term: Regulation of cell cycle
          term:
            id: GO:0051726
            label: regulation of cell cycle
          modifier: DECREASED
        - preferred_term: Apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: DECREASED
      selected_evidence:
        snippet: It has become evident that human papillomavirus (HPV) infection does not drive all adenocarcinomas,
          and appropriate classification is critical for patient management, especially in the era of
          the HPV vaccine and HPV‐only screening.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1111/his.13995
      reference_title: 'Cervical adenocarcinoma: integration of HPV status, pattern of invasion, morphology
        and molecular markers into classification'
      evidence_source: HUMAN_CLINICAL
      explanation: Park 2020 frames HPV-driven oncogenesis as the dominant but not exclusive mechanism
        of cervical adenocarcinoma, motivating subclassification by HPV status.
