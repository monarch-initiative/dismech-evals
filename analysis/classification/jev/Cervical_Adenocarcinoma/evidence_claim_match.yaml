      assertion_type: Subtype
      assertion:
        name: Gastric-Type
        display_name: Gastric-Type Endocervical Adenocarcinoma
        description: The most clinically prominent HPV-independent adenocarcinoma subtype. Frequently
          presents with profuse watery vaginal discharge and a barrel-shaped cervix; often eludes HPV-based
          screening. Recurrent somatic alterations include TP53, KRAS, CDKN2A, and STK11 mutations. Encompasses
          the older "minimal deviation adenocarcinoma" / "adenoma malignum" terminology.
      selected_evidence:
        snippet: Non‐HPV‐associated adenocarcinomas can be divided by their distinct morphology and molecular
          genomics with very different responses to standard therapies and potential for future targeted
          therapies. These include gastric‐type, clear‐cell, mesonephric and endometrioid adenocarcinomas.
        supports: SUPPORT
