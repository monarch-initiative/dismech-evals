          modifier: ABNORMAL
        - preferred_term: Apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: DECREASED
      selected_evidence:
        snippet: The most prevalent genomic alterations were somatic mutations or amplifications in PIK3CA
          (25%), ERBB2 (12%), KMT2C (10%), and KMT2D (9%).
        supports: SUPPORT
