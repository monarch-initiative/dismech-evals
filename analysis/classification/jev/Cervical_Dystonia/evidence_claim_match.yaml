      assertion:
        name: Sensorimotor Network Dysfunction
        biological_scale: ORGANISM
        description: 'The primary abnormality, and it is distributed rather than focal. Dystonia is understood
          as a disorder of a network spanning basal ganglia, thalamus, sensorimotor cortex and cerebellum,
          in which no single structure is lesioned and the pathology lies in how they operate together.
          This node is stated at network scale deliberately: assigning the fault to one structure would
          claim more than the evidence supports, and decades of attempts to localise it are why the network
          formulation exists.'
      selected_evidence:
        snippet: Dystonia is conceptualized as a network disorder involving basal ganglia, thalamus, sensorimotor
          cortex and the cerebellum.
        supports: SUPPORT
