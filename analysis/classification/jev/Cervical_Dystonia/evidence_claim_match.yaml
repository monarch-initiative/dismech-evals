      assertion:
        population: Adults, sex distribution
        measure_type: UNKNOWN
        prevalence_class: UNKNOWN
        notes: 'Women predominate in cervical dystonia, with reported female-to-male ratios close to two.
          Recorded with measure_type UNKNOWN rather than POINT_PREVALENCE because a sex ratio is not a
          prevalence measure at all: it describes the composition of the affected population rather than
          its size, and forcing it into a prevalence slot would misrepresent what was measured. The predominance
          is not general to dystonia: it reverses in task-specific upper limb dystonia, which argues that
          it reflects something about craniocervical forms specifically rather than a general ascertainment
          bias toward women.'
      selected_evidence:
        snippet: Women predominated over men in blepharospasm, oromandibular, laryngeal and cervical dystonia;
          the sex ratio was reversed in task-specific upper limb dystonia; and no clear sex difference
          emerged in non-task-specific upper limb dystonia and lower limb dystonia.
        supports: SUPPORT
