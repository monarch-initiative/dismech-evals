    evidence_metadata:
      reference: PMID:37445923
      reference_title: Genetic Screening of a Hungarian Cohort with Focal Dystonia Identified Several
        Novel Putative Pathogenic Gene Variants.
      evidence_source: HUMAN_CLINICAL
      explanation: Nine relevant variants from 209, of which only three were likely pathogenic, is the
        quantitative basis for treating these genes as contributors in a minority rather than as causes
        of the common disease.
