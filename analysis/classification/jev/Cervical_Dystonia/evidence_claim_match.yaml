        biological_scale: TISSUE
        description: 'Sustained or intermittent co-contraction of cervical muscles, including inappropriate
          activation of antagonists, producing abnormal head posture and frequently a dystonic tremor.
          The muscles themselves are normal, which is why treatment aimed at them is symptomatic: the
          fault is in the command, not the effector.'
