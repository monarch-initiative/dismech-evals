  4f7c9f346cafbaaa56053115a94244fb7b88935bef151b625fa9f57a8ac668b0:
    claim:
      about:
        disease:
          name: Cervical Dystonia
          disease_term:
            preferred_term: Cervical Dystonia
            term:
              id: MONDO:0000481
              label: cervical dystonia
        context: []
      assertion_type: Genetic
      assertion:
        name: Polygenic and multifactorial susceptibility
        relationship_type: SUSCEPTIBILITY
        notes: Most adult-onset isolated cervical dystonia is sporadic and multifactorial. A set of genes
          recurs in screening studies of focal dystonia cohorts, including THAP1, GNAL and ANO3, but they
          explain a small minority of unselected cases. A 30-gene panel applied to a focal dystonia cohort
          found many heterozygous variants and very few that were clinically and genetically relevant,
          which is the honest summary of where genetic testing currently stands in the common disease.
          No causal gene is bound at the disease level for that reason.
      selected_evidence:
        snippet: Assessment of 30 CD- and BSP-associated genes from 121 patients revealed a total of 209
          different heterozygous variants in 24 genes.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/3
