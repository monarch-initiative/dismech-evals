        context: []
      assertion_type: Treatment
      assertion:
        name: Botulinum Toxin Type A
        description: First-line treatment, and mechanistically instructive for where it acts. Injected
          into the overactive muscles, it cleaves the SNARE machinery required for acetylcholine release
          at the neuromuscular junction, weakening the muscle that the disordered network is commanding.
          It therefore works at the far end of the chain, downstream of everything this entry models as
          the actual pathophysiology, which is precisely why it is effective, why it must be repeated
          as terminals recover, and why it modifies nothing.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: botulinum toxin type A
            term:
              id: CHEBI:3160
              label: Botulinum toxin type A
        notes: The same review found no evidence distinguishing between formulations, and none that electromyographic
          guidance improved efficacy outcomes. Both are recorded here because they are frequently assumed
          in practice.
      selected_evidence:
        snippet: We found no evidence supporting the existence of a clear dose-response relationship between
          BtA and improvement in cervical dystonia-specific impairment, a destinction between BtA formulations,
          or a variation with use of EMG-guided injection for efficacy outcomes.
        supports: SUPPORT
