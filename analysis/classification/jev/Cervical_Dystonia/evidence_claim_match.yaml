      assertion_type: Phenotype
      assertion:
        name: Tremor
        category: Neurological
        description: Dystonic head tremor accompanying the posture in a substantial minority. It is distinguished
          from essential tremor by its association with the dystonic posture and by its tendency to worsen
          when the head is moved away from the direction of pull.
        phenotype_term:
          preferred_term: Tremor
          term:
            id: HP:0001337
            label: Tremor
        notes: No frequency band is asserted, and the reason is worth stating because the number is tempting.
          The registry table reports tremor in 516 of 1701, which is 30.3 per cent, but that denominator
          is every patient with idiopathic adult-onset dystonia of any distribution. The same table gives
          CD-specific rows where it means CD, quoting neck pain in cervical dystonia against a denominator
          of 848, so the absence of a CD row for tremor is informative rather than accidental. A band
          derived from the all-dystonia figure would be a claim about cervical dystonia that this source
          does not make.
      selected_evidence:
        snippet: Women and men were characterised by a similar proportion of sensory trick, eye symptoms
          in blepharospasm (BSP), neck pain in cervical dystonia (CD) and family history of dystonia or
          tremor; tremors in the neck and/or in the upper limb tended to be more frequent in women than
          in men, but the difference did not reach the level of statistical significance after Bonferroni
          correction (p=0.05/5=0.01) (table 2).
        supports: SUPPORT
        directness: INDIRECT
    origin:
