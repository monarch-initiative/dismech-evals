            id: NCIT:C21024
            label: Deep Brain Stimulation
        notes: The efficacy evidence here is a single-centre series of 24 patients with refractory craniocervical
          dystonia, which is not cervical dystonia alone and not a controlled trial, so the improvement
          figures describe this cohort rather than establishing an effect size.
      selected_evidence:
        snippet: The mean total BFMDRS motor scores at the 3 different time points were 13.3 ± 9.4 preoperatively,
          5.0 ± 4.7 (55.3% improvement, p < 0.001) at 6 months, and 4.5 ± 3.6 (56.6% improvement, p <
          0.001) at last follow-up.
        supports: SUPPORT
