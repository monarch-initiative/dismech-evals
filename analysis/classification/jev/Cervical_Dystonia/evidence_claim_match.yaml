              label: cervical dystonia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disordered Sensorimotor Integration
        biological_scale: ORGANISM
        description: 'Abnormal processing of sensory information in the service of movement, rather than
          a purely efferent motor fault. The clinical evidence for this is unusually direct and unusually
          strange: a light touch to the chin or cheek can transiently abolish the dystonic posture. A
          sensory input that switches off an involuntary motor output is difficult to explain if the lesion
          is downstream of the motor command, and it is the single most informative sign in the disease.'
      selected_evidence:
        snippet: The geste antagoniste (also known as the sensory trick) describes a voluntary action
          by the patient that can reduce or even completely suppress abnormal postures or dystonic movements,
          for example, touching the chin in cervical dystonia.
        supports: SUPPORT
