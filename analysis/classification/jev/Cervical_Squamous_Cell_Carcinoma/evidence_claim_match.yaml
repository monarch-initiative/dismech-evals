        name: Genomic Instability and CIN Progression
        description: Continuous cell-cycle propagation driven by HPV E6/E7 activity permits accumulation
          of DNA damage and progression of the affected squamous epithelium through cervical intraepithelial
          neoplasia (CIN1 -> CIN2 -> CIN3) before invasion.
        notes: APOBEC-driven mutational signatures and copy-number changes are frequently described in
          cervical squamous cell carcinoma genomes, but are listed only as emerging biomarkers (not mechanistic
          claims) in the cited reviews and are therefore not asserted with primary evidence here.
        cell_types:
        - preferred_term: Squamous epithelial cell
          term:
            id: CL:0000076
            label: squamous epithelial cell
      selected_evidence:
