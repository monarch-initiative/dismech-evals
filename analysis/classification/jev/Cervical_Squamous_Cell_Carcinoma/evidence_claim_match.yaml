            label: exposure to cigarette smoking
        effect: HARMFUL
        description: Cigarette smoking is an independent cervical-cancer risk factor whose effect does
          not require HPV co-infection to manifest, with a dose-response relationship and risk normalization
          roughly 15 years after smoking cessation. A 109-study meta-analysis found pooled RR 1.70 (95%
          CI 1.53-1.88) for invasive cervical cancer in current vs never smokers.
      selected_evidence:
        snippet: We included 109 studies providing a pooled RR of invasive CC and preinvasive lesions,
          respectively, of 1.70 [95% confidence interval (CI), 1.53–1.88] and 2.11 (95% CI, 1.85–2.39)
          for current versus never smokers
        supports: SUPPORT
