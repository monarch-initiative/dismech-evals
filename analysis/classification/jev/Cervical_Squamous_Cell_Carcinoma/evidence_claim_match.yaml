  84a6fcf94dd0a51a113a9a57d40787edc2a0ec29d66bab7592d2bb546a8cf8c9:
    claim:
      about:
        disease:
          name: Cervical Squamous Cell Carcinoma
          disease_term:
            preferred_term: cervical squamous cell carcinoma
            term:
              id: MONDO:0006143
              label: cervical squamous cell carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Persistent High-Risk HPV Infection
        description: Persistent infection of the cervical squamous epithelium by high-risk HPV (most commonly
          HPV-16) is the main aetiological event in cervical squamous cell carcinoma. Persistent infection
          commits infected cells to a transforming viral cycle in which the E6 and E7 oncoproteins are
          continuously expressed.
        notes: Viral DNA integration into the host genome, with disruption of the E2 repressor and consequent
          dysregulation of E6/E7, is a frequently observed molecular event in cervical squamous cell carcinoma
          but is not modeled here as a separate atomic node because it is not directly quoted from the
          cited mechanistic review.
        cell_types:
        - preferred_term: Squamous epithelial cell
          term:
            id: CL:0000076
            label: squamous epithelial cell
        biological_processes:
        - preferred_term: Viral process
          term:
            id: GO:0016032
            label: viral process
      selected_evidence:
        snippet: The main aetiological factor for developing cervical cancer is the persistent infection
          of Human papillomavirus (HPV).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40216282
      reference_title: Novel therapeutic strategies for targeting E6 and E7 oncoproteins in cervical cancer
      evidence_source: HUMAN_CLINICAL
      explanation: Ranasinghe & McMillan 2025 directly identify persistent high-risk HPV infection as
        the main aetiological event in cervical cancer, supporting this node as the initiating step of
        cervical squamous cell carcinoma pathophysiology.
