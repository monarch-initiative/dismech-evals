              label: cervical squamous cell carcinoma
        context:
        - path: /pathophysiology/1
          value:
            name: E6/E7 Inactivation of p53 and pRB
            description: HPV E6 causes degradation of p53, impairing the cellular stress response, while
              HPV E7 impairs the activity of the retinoblastoma protein (pRB), resulting in continuous
              cell cycle propagation. Combined loss of p53 and pRB function removes the principal checkpoints
              that normally restrain proliferation of damaged cells.
            notes: Mechanistically, p53 degradation by E6 proceeds via the E6AP ubiquitin ligase and pRB
              inactivation by E7 releases E2F transcription factors driving S-phase entry; these molecular
              details are well established but are not directly stated in the abstract cited here.
            cell_types:
            - preferred_term: Squamous epithelial cell
              term:
                id: CL:0000076
                label: squamous epithelial cell
            biological_processes:
            - preferred_term: Negative regulation of p53 signaling
              term:
                id: GO:1901797
                label: negative regulation of signal transduction by p53 class mediator
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Genomic Instability and CIN Progression
      selected_evidence:
        snippet: The E7 protein impairs the activity of retinoblastoma protein (pRb) resulting in continuous
          cell cycle propagation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1/downstream/0
      evidence_path: /pathophysiology/1/downstream/0/evidence/0
      context_paths:
      - /name
