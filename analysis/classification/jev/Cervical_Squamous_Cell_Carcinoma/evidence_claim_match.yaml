        name: HPV-Associated SCC
        display_name: HPV-Associated Cervical Squamous Cell Carcinoma
        description: The dominant subtype, accounting for the vast majority of cervical squamous cell
          carcinomas (~90-95%). Defined by persistent infection with high-risk HPV and identified pathologically
          by block-type p16 immunohistochemistry (a surrogate marker for high-risk HPV).
      selected_evidence:
        snippet: The 2020 WHO classification is focused on the distinction between HPV-associated and
          HPV-independent squamous cell carcinoma of the lower female genital organs.
        supports: SUPPORT
