      reference_title: 'Cesium toxicity: a case of self-treatment by alternate therapy gone awry.'
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the diagnostic triad of syncope or arrhythmia, hypokalemia, and QT prolongation
        that reverses on withdrawal of cesium.
