      assertion:
        name: Myocardial delayed rectifier potassium channel blockade
        description: Cesium blocks the potassium channels that carry the repolarizing current of the ventricular
          action potential. Classical voltage-clamp work in cardiac Purkinje fibers established cesium
          as a blocker of cardiac potassium currents, and the clinical literature attributes the observed
          repolarization delay to delayed rectifier inhibition.
        biological_scale: MOLECULAR
        locations:
        - preferred_term: cardiac ventricle
          term:
            id: UBERON:0002082
            label: cardiac ventricle
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        molecular_functions:
        - preferred_term: delayed rectifier potassium channel activity
          modifier: DECREASED
          term:
            id: GO:0005251
            label: delayed rectifier potassium channel activity
        notes: The clinical literature consistently attributes cesium-induced QT prolongation to delayed
          rectifier blockade, while the classical voltage-clamp study reports the delayed outward rectifier
          as the one current cesium spared in sheep Purkinje fibers. Both statements are quoted here rather
          than reconciled, because the apparent conflict may reflect preparation, species, and concentration
          differences rather than an error in either source.
      selected_evidence:
        snippet: exposure to Cs blocks both the pacemaker current iK2 and the instantaneous outward current
          iK1, while the delayed outward rectifying potassium current ix is not affected
        supports: SUPPORT
        directness: INDIRECT
