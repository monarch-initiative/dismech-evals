      reference_title: 'Cardiac Purkinje fibers: cesium as a tool to block inward rectifying potassium
        currents.'
      evidence_source: IN_VITRO
      explanation: Voltage-clamp evidence that cesium blocks cardiac potassium currents. Graded INDIRECT
        because in this sheep Purkinje preparation the currents blocked were the pacemaker and inward
        rectifier currents while the delayed outward rectifier was spared, so it establishes cesium as
        a cardiac potassium-channel blocker without confirming the specific delayed rectifier attribution
        made in the clinical literature.
