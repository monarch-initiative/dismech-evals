        name: Internal Radioactive Cesium Contamination
        display_name: Internal radioactive cesium (cesium-137) contamination
        description: Internal contamination with radioactive cesium, principally cesium-137 released from
          a damaged medical or industrial source or a reactor accident. Harm is delivered as continuing
          internal beta and gamma irradiation; at sufficient absorbed dose this produces hematopoietic
          injury, frequently alongside external irradiation that must be assessed separately.
      selected_evidence:
        snippet: After this accident, 249 cases out of 112,000 people examined for contamination had significant
          internal or external radioactive contamination
        supports: SUPPORT
