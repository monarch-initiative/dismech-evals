      assertion_type: Definition
      assertion:
        name: Practical diagnostic definition for suspected chemical cesium poisoning
        definition_type: DIAGNOSTIC_CRITERIA
        description: Practical recognition rests on an exposure history for a cesium-containing product
          together with a prolonged QT interval and hypokalemia, confirmed where available by an elevated
          blood or urine cesium concentration.
        scope: Clinical recognition and laboratory confirmation in suspected chemical cesium poisoning
      selected_evidence:
        snippet: The authors describe a case of cesium toxicity manifested by syncope, polymorphic ventricular
          tachycardia, hypokalemia, and a QT interval prolonged to 650 milliseconds that resolved over
          4 days following withdrawal of cesium.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/1
      evidence_path: /definitions/1/evidence/0
      context_paths:
