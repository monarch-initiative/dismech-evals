      assertion_type: Definition
      assertion:
        name: Clinical toxic exposure syndrome definition for cesium poisoning
        definition_type: CASE_DEFINITION
        description: Cesium poisoning is an exposure-defined toxic disorder. In its chemical form it is
          a cardiac-dominant syndrome of hypokalemia, prolonged ventricular repolarization, and ventricular
          arrhythmia following ingestion or injection of cesium salts; in its radiological form it is
          internal contamination with radioactive cesium causing continuing internal irradiation.
        scope: Disease-level clinical framing spanning the chemical and radiological exposure routes
      selected_evidence:
        snippet: Following absorption, cesium is distributed throughout the body, where it inhibits ion
          channels, mainly for potassium.
        supports: SUPPORT
    origin:
      assertion_path: /definitions/0
      evidence_path: /definitions/0/evidence/0
