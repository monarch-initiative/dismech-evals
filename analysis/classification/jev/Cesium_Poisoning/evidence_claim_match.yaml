        description: Superfused Purkinje strands and ventricular myocardium from dogs and guinea pigs,
          exposed to 3.6 to 4.0 mM cesium with extracellular potassium reduced to 2 to 3 mM at slow pacing
          rates. This is the preparation in which the triggered-activity step of the mechanism was measured
          directly rather than inferred.
        modeled_mechanisms:
        - target: Triggered ventricular arrhythmia
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Reproduces the afterdepolarization step under the same two conditions the human
            disease creates, cesium exposure together with low extracellular potassium.
          limitations: An ex vivo fiber preparation at fixed cesium and potassium concentrations and slow
            pacing, so it establishes the cellular mechanism but supplies no human tissue threshold and
            no whole-heart arrhythmia outcome. The clinical arrhythmia is an organ-level event that this
            preparation cannot show.
          readouts:
          - name: Late early afterdepolarization incidence in Purkinje fibers
            target: Triggered ventricular arrhythmia
            direction: INCREASED
            interpretation: Proportion of fibers developing the triggered activity that initiates the
              arrhythmia.
      selected_evidence:
        snippet: In Ca(2+)-loaded preparations, delayed afterdepolarizations (DADs) as well as L-EADs
          developed.
        supports: SUPPORT
