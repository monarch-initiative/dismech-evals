        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_chagas_persistence_vs_autoimmunity
        prompt: In chronic Chagas cardiomyopathy, how much of the ongoing myocardial injury is driven
          by persistent parasitism versus a self-sustaining autoimmune/ inflammatory process, and why
          does clearing parasitemia with benznidazole fail to halt cardiac deterioration once cardiomyopathy
          is established?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#Chronic Th1 myocarditis and parasite persistence
        rationale: 'The relative contributions of direct parasite persistence and of an immune-mediated
          (partly autoimmune) response to chronic Chagas cardiomyopathy are long debated. The BENEFIT
          trial sharpened the question: benznidazole significantly reduced serum parasite detection but
          did not reduce cardiac clinical deterioration over 5 years, implying that parasite clearance
          alone is insufficient once remodeling is established — consistent with a self-sustaining inflammatory/fibrotic
          process, an irreversibility threshold, or treatment given too late in the disease course.'
        proposed_experiments:
        - experiment_id: exp_chagas_early_vs_late_trypanocidal
          name: Trypanocidal therapy timing versus myocardial fibrosis progression
          description: Compare benznidazole given in the indeterminate phase versus established cardiomyopathy,
            tracking cardiac MRI fibrosis, inflammatory biomarkers, and clinical outcomes to test whether
            an irreversibility threshold explains the BENEFIT null and to define the treatment window
            in which parasite clearance still alters cardiac trajectory.
          experiment_type:
            preferred_term: prospective cohort study
      selected_evidence:
        snippet: The role of trypanocidal therapy in patients with established Chagas' cardiomyopathy
          is unproven.
        supports: SUPPORT
    origin:
