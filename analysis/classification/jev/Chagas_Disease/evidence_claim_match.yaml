  ae6668a94e41eb418f7cd0209f5c9755a740c010ac10fd6b05d6d0c8a3f6bd8f:
    claim:
      about:
        disease:
          name: Chagas disease
          disease_term:
            term:
              id: MONDO:0001444
              label: Chagas disease
            preferred_term: Chagas disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_chagas_serodiagnostic_parasite_vs_host_variation
        prompt: Is the geographic variability and serodiscordance of anti-T. cruzi serological assays
          driven mainly by local parasite genetic/antigenic diversity (DTU composition and divergence
          of the antigens used in commercial tests), or mainly by host-to-host variation in the anti-T.
          cruzi antibody repertoire - and can a conserved multi-epitope antigen panel close the gap either
          way?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - diagnosis#Serologic diagnosis (anti-T. cruzi IgG)
        rationale: 'Serology is the confirmatory test for chronic Chagas disease, but there is no gold-standard
          assay and discordant results are common, so the question is operational as well as mechanistic:
          a case definition, a blood-bank screen, and a treatment-eligibility decision all rest on it.
          Two mechanistically different explanations are on the table and the same group has published
          on both sides. Comparative genomics across 52 strains shows that several antigens used in current
          commercial tests are poorly conserved across DTUs, making antigenic diversity a plausible driver
          of the Central/North American performance deficit. Against that, high-density peptide-microarray
          profiling of confirmed-positive versus serodiscordant plasma concluded that individual variation
          in antibody profiles, rather than parasite diversity, was the main factor. A 2026 preprint genotyping
          the parasite populations carried by 73 patients ("cruziome") in Argentina, Honduras and Mexico
          then reported clustering of TcI, TcII and TcV haplotypes with discordant serology, reviving
          the parasite-diversity explanation. That preprint is not peer-reviewed and is recorded here
          as a lead, not as an asserted mechanism; the two peer-reviewed studies are what make this a
          live controversy rather than a settled question. The practical stake is whether an improved
          universal assay must broaden antigen coverage across parasite lineages, broaden epitope coverage
          across human antibody repertoires, or both.'
        proposed_experiments:
        - experiment_id: exp_chagas_paired_cruziome_and_epitope_profiling
          name: Paired parasite-genotype and host-epitope profiling in serodiscordant patients
          description: In a prospective multi-country cohort of PCR-confirmed T. cruzi infections spanning
            Southern Cone, Central American and North American transmission settings, genotype the infecting
            parasite population (deep mini-exon / whole-genome sequencing of the cruziome) and profile
            the host IgG epitope repertoire by high-density peptide microarray in the same individual,
            then test which of the two - parasite DTU/antigen-sequence divergence or host epitope-recognition
            breadth - better predicts discordance across a panel of commercial assays. Pairing the two
            measurements in the same patients is what distinguishes the competing explanations; prior
            studies measured one or the other.
          experiment_type:
            preferred_term: prospective cohort study
        - experiment_id: exp_chagas_lineage_matched_antigen_panel
          name: Lineage-matched versus conserved-epitope antigen panel head-to-head
          description: Build two candidate assays - one using antigen variants matched to the DTUs circulating
            locally, one using the conserved multi-epitope peptide combination - and evaluate both against
            the same well-characterized confirmed-positive and serodiscordant panels from multiple geographic
            sites. If lineage matching recovers sensitivity where the conserved panel does not, parasite
            antigenic diversity is the dominant factor at that site; if the conserved panel wins everywhere,
            host repertoire breadth dominates.
          experiment_type:
            preferred_term: diagnostic accuracy study
      selected_evidence:
        snippet: Individual variation in antibody profiles rather than T. cruzi diversity appears to be
          the main factor driving differences in serological diagnostic performance according to geography
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38381980
      reference_title: Identification of highly conserved Trypanosoma cruzi antigens for the development
        of a universal serological diagnostic assay.
      evidence_source: HUMAN_CLINICAL
      explanation: Peptide-microarray and peptide-ELISA study of confirmed-positive versus serodiscordant
        human plasma arguing for the host-antibody-repertoire side of the controversy.
