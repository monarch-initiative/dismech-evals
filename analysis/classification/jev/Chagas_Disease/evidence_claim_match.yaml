        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_chagas_vector_chemosensory_domiciliation
        prompt: How does evolutionary remodeling of the chemosensory (odorant-receptor) repertoire in
          Rhodnius and other triatomine vectors drive adaptation from sylvatic to domestic (domiciliary)
          habitats, and can this be exploited for vector control to reduce human transmission?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - transmission#Triatomine fecal contamination during blood feeding
        rationale: 'Vectorial transmission dominates human Chagas disease, and the key driver of human
          exposure is vector domiciliation (triatomines colonizing dwellings). A comparative-genomics
          preprint reports lineage-specific odorant-receptor expansions and shifts in selective constraint
          between sylvatic and domiciliary Rhodnius species, suggesting host-seeking/habitat-selection
          chemosensory remodeling underlies domiciliation. Whether these molecular signatures translate
          to behavioral domiciliation and offer control targets (e.g., attractants/repellents) is an open,
          translationally important question. Note: this lead rests on a non-peer-reviewed preprint and
          vector-evolution data rather than direct disease mechanism, so it is recorded as a gap rather
          than an asserted mechanism.'
      selected_evidence:
        snippet: Several receptors, including Orco, also displayed shifts in selective constraints between
          sylvatic and domiciliary species, consistent with sensory remodeling associated with adaptation
          to domestic habitats.
        supports: SUPPORT
