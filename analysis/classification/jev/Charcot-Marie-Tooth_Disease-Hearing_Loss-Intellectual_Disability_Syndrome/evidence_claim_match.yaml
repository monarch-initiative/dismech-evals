        due to absence of large neurons in dorsal root ganglia and anterior horns, clinically associated
        with deafness, mental retardation, and epilepsy (HMSN-ADM).
      evidence_source: HUMAN_CLINICAL
      explanation: Autopsy evidence that absence of large myelinated peripheral fibers reflects a primary
        lack of large neurons in the dorsal root ganglia and anterior horns (a neuronopathy), with additional
        cerebellar dentate neuron loss.
