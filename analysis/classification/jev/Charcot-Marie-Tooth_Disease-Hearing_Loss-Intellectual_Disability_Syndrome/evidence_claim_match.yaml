        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absence of Large Myelinated Nerve Fibers
        biological_scale: TISSUE
        description: Serial sural biopsies in the original family and biopsies in two subsequently reported
          brothers showed selective absence of large myelinated fibers with a preserved small-fiber complement.
          The latter brothers had no axonal degeneration in the sampled nerves; demyelination was seen
          only in the younger brother. This is a characteristic pathological finding, not evidence that
          every patient has been biopsied or that all neuropathy is uniformly demyelinating.
        cell_types:
        - preferred_term: Sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        notes: Orphanet describes a demyelinating neuropathy, while the primary biopsy and autopsy reports
          also support a large-fiber neuronopathy. Retain both observations without generalizing a single
          autopsy to every patient. The developmental hypothesis does not establish a molecular pathway
          or the direction of change in neuron development.
      selected_evidence:
        snippet: Sural nerve biopsy, performed in both patients, showed absence of large myelinated fibers
          with normal density of small myelinated fibers without axonal degeneration.
        supports: SUPPORT
