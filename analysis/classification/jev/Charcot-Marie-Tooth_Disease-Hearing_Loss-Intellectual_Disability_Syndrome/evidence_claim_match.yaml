      assertion_type: Discussion
      assertion:
        discussion_id: gap_unknown_causal_gene
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the causal gene of the Charcot-Marie-Tooth disease-hearing-loss-intellectual-disability
          syndrome (HMSN-ADM)? The entity was delineated clinically and pathologically from a small number
          of families but remains genetically unsolved.
        attaches_to:
        - pathophysiology#Loss of Large-Caliber Neurons in Dorsal Root Ganglia and Anterior Horns
        rationale: The disorder was defined as a distinct clinicopathological entity in the 1990s from
          a small number of (mostly southern Italian) families and is presumed autosomal recessive, but
          no causal gene has been identified. In the only autopsied case, targeted molecular analysis
          explicitly excluded the survival motor neuron gene (SMN1) and PMP22. Modern exome/genome sequencing
          of the reported pedigrees (or newly ascertained families) is needed to resolve the molecular
          basis.
        proposed_experiments:
        - experiment_id: exp_wgs_hmsn_adm_pedigrees
          name: Exome/genome sequencing of HMSN-ADM pedigrees
          description: Perform trio or affected-sib-pair whole-exome/whole-genome sequencing on the originally
            reported families and any newly ascertained cases to identify the recessive causal variant,
            leveraging the shared geographic origin to test for a founder allele.
      selected_evidence:
        snippet: Molecular genetic analyses in our case revealed neither genetic alterations in the survival
          motor neuron gene nor in the PMP-22 gene.
        supports: SUPPORT
