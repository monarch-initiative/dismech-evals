        absence of sensory large myelinated fibers: confirmation of a new entity.'
      evidence_source: HUMAN_CLINICAL
      explanation: Sural nerve biopsy in two affected brothers shows the selective absence of large myelinated
        fibers with preserved small fibers and no axonal degeneration.
