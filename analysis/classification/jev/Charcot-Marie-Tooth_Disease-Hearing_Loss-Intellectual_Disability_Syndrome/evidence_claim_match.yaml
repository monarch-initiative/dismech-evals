          term:
            id: GO:0048666
            label: neuron development
          modifier: ABNORMAL
      selected_evidence:
        snippet: The autopsy showed complete absence of large myelinated fibers in peripheral motor and
          sensory nerves corresponding to a lack of large neurons in dorsal root ganglia and anterior
          horns of the spinal cord, moderate neurogenic muscle atrophy, and nearly complete absence of
          neurons in the dentate nucleus of the cerebellum.
        supports: SUPPORT
