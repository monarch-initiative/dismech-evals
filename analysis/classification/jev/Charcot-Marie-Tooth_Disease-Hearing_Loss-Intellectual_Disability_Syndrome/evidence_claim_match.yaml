              label: Charcot-Marie-Tooth disease-hearing loss-intellectual disability syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Large-Caliber Neurons in Dorsal Root Ganglia and Anterior Horns
        biological_scale: CELLULAR
        description: 'The primary lesion is a lack of large-caliber neurons in the dorsal root ganglia
          (large sensory neurons) and the spinal anterior horns (large motor neurons), demonstrated at
          autopsy. A developmental abnormality with faulty neuronal growth, followed by axonal atrophy,
          is the proposed (still hypothetical) basis for the selective loss of the large-fiber population.

          '
        cell_types:
        - preferred_term: Anterior horn motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        - preferred_term: Dorsal root ganglion sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        biological_processes:
        - preferred_term: Neuron development
          term:
            id: GO:0048666
            label: neuron development
          modifier: ABNORMAL
      selected_evidence:
        snippet: The autopsy showed complete absence of large myelinated fibers in peripheral motor and
          sensory nerves corresponding to a lack of large neurons in dorsal root ganglia and anterior
          horns of the spinal cord, moderate neurogenic muscle atrophy, and nearly complete absence of
          neurons in the dentate nucleus of the cerebellum.
        supports: SUPPORT
    origin:
