          inheritance, without a molecular diagnosis. In the autopsied child, the reported assays detected
          no alterations in the survival motor neuron gene or PMP22; this is a case-specific negative
          result, not comprehensive exclusion of these genes in every family. Modern reanalysis could
          determine whether the historical families share a cause or represent more than one molecular
          disorder.
        proposed_experiments:
        - experiment_id: exp_wgs_hmsn_adm_pedigrees
          experiment_design: HUMAN_OBSERVATIONAL
          name: Exome/genome sequencing of HMSN-ADM pedigrees
          description: Sequence affected relatives and parents from well-phenotyped pedigrees, test segregation
            and alternative inheritance models, and compare across families before assuming a single recessive
            cause.
      selected_evidence:
        snippet: Molecular genetic analyses in our case revealed neither genetic alterations in the survival
          motor neuron gene nor in the PMP-22 gene.
        supports: SUPPORT
