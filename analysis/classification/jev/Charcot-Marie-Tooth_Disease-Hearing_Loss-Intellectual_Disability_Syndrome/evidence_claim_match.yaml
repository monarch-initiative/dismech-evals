  e1d26bc3283f54d1028146c577990581236457f3f052957260a33687e89289b9:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease-Hearing Loss-Intellectual Disability Syndrome
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease-hearing loss-intellectual disability syndrome
            term:
              id: MONDO:0008960
              label: Charcot-Marie-Tooth disease-hearing loss-intellectual disability syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absence of Large Myelinated Nerve Fibers
        biological_scale: TISSUE
        description: 'Sural nerve biopsy shows a selective absence of large myelinated fibers with a normal
          density/complement of small myelinated fibers and, in most cases, no primary axonal degeneration;
          overt demyelinating change is variable and has been seen only in some (younger) patients. This
          selective large-fiber deficit is the diagnostic pathological hallmark of the entity.

          '
        cell_types:
        - preferred_term: Sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        notes: 'Deliberate modeling divergence: the Orphanet/MONDO definition glosses this entity as a
          "demyelinating" HMSN, but the primary literature (autopsy PMID:11442171; biopsy PMID:9475604
          with demyelination in only the younger patient) shows the large-fiber deficit reflects loss
          of large-caliber parent neurons, not a uniform demyelinating process. The neuronopathy model
          follows the primary evidence and is intentionally not "corrected" back to the ontology gloss.'
      selected_evidence:
        snippet: Sural nerve biopsy, performed in both patients, showed absence of large myelinated fibers
          with normal density of small myelinated fibers without axonal degeneration.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
