      assertion:
        name: CMT1
        display_name: Charcot-Marie-Tooth Disease Type 1 (Demyelinating)
        description: Autosomal dominant demyelinating form with reduced motor nerve conduction velocities
          (<38 m/s in median nerve). The most common clinical category; in a 1,515-patient specialist
          cohort, CMT1 comprised 41.0% of cases and achieved the highest genetic diagnosis rate (96.8%).
          CMT1A (PMP22 duplication) is the dominant subtype. Schwann cell dysfunction with onion-bulb
          formation on nerve biopsy.
      selected_evidence:
        snippet: 621 patients had CMT1 (41.0%)
        supports: SUPPORT
