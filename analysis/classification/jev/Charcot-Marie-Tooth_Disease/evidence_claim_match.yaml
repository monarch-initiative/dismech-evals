          MFN2-CMT2A relationship. Human proof-of-concept for PMP22-lowering therapies remains the critical
          translational gap: no cited study demonstrates clinical benefit in humans from direct PMP22
          lowering; the five human ascorbic-acid trials to date were negative, and only PXT3003 showed
