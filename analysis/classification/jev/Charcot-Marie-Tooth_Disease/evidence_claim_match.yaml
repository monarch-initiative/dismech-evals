        hypothesis_label: Canonical PMP22 / MPZ / Axonal & Demyelinating Peripheral Neuropathy Model
        status: CANONICAL
        description: Charcot-Marie-Tooth (CMT) disease is a clinically and genetically heterogeneous group
          of inherited peripheral neuropathies caused by variants in >100 genes encoding myelin components
          (PMP22, MPZ, GJB1) and axonal cytoskeleton/transport proteins (MFN2, NEFL), plus other Schwann-cell-axon
          interface factors. KIF1B is a historical CMT2A1 candidate gene, but it carries only Limited
          ClinGen gene-disease validity evidence, not the established causal status of MFN2 (see notes).
          CMT1A (most common, PMP22 duplication on 17p11.2) produces demyelinating neuropathy through
          PMP22 overexpression-driven Schwann cell dysfunction and secondary axonal loss. Axonal CMT2
          forms (MFN2, MPZ, others) primarily impair axonal function. The uniform clinical phenotype —
          distal motor and sensory loss in a length-dependent pattern, with foot deformity, distal weakness,
          and absent reflexes — frequently converges on length-dependent axonal degeneration as a late-stage
          correlate of disability across CMT1A and CMT2 subtypes, though not a universal mechanism in
          every model (see notes). The PMP22 duplication CMT1A mouse and rat models recapitulate the human
          phenotype, and PMP22-lowering ASO and PXT3003 (low-dose drug combination) corroborate the PMP22-dosage
          axis as a canonical mechanism in the most common subtype.
        notes: 'Retained as CANONICAL. The 2026 openscientist hypothesis-search report (kb/hypotheses/Charcot-Marie-Tooth_Disease/canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model)
          finds the broad canonical framework SUPPORTED, but several report-level claims required source-,
          model-, subtype-, and species-scoping before independent reconciliation into this entry (issue
          #7405; sidecar assessment in PR #7406). Core architecture remains validated: >100 genes show
          genetic heterogeneity; CMT1A and CMT2 subtypes frequently converge on length-dependent axonal
          degeneration as a late-stage correlate of disability, though not as a universal sufficient mechanism
          — adult C3-PMP22 (CMT1A) model mice show no detectable myelinated-fibre loss despite functional
          impairment (PMID:21487305); transgenic models recapitulate the human phenotype. PMP22 duplication
          accounts for 505/1165 (43.3%) of genetically solved cases and 505/1515 (33.3%) of all clinically
          diagnosed participants in a single specialist-centre cohort (PMID:38481354, cited below via
          DOI:10.1093/brain/awae064); a separately cited ~60% figure (PMID:31852984) is a background statement
          about the share of pathogenic CMT variants attributable to the PMP22 duplication, not a comparable
          diagnosed-case estimate, and should not be blended with the cohort figure into a single "43-60%"
          range. Seven substantive, source-scoped refinements: (1) dysmyelination is a real developmental
          component, not a categorical replacement for demyelinating classification — dermal-fibre biopsies
          from 32 CMT1A patients show uniformly shortened internodal length and absent segmental demyelination,
          suggesting a developmental internode defect (PMID:19923170), and long-term PMP22-overexpressing
          mice show delayed, incomplete developmental myelination with stable adult myelin (PMID:21487305)
          — conventional demyelinating features and a developmental dysmyelination component coexist,
          they are not mutually exclusive; (2) PMP22 acting as a structural organizer of nodal/Schmidt-Lanterman-incisure
          architecture is shown specifically in CMT1A and HNPP model mice (PMID:41400104), not yet established
          as a human CMT-wide mechanism; (3) UPR/ER-stress modulation (Sephin1/IFB-088) improved neuropathy
          in C3-PMP22 (CMT1A) and MpzR98C (CMT1B) mice (PMID:35501630) — convergence is demonstrated across
          these two mouse models, not broadly across CMT subtypes or in humans; (4) SARM1 acting as an
          executioner of axonal degeneration, with a feedback loop to mitochondrial dysfunction, is shown
          in one Mfn2-H361Y CMT2A rat model (PMID:36287202) — a single-model finding, not yet a cross-subtype
          or human result (SARM1 inhibitors are in development); (5) macrophage/CSF1-driven secondary
          neuroinflammation amplifying demyelination is documented predominantly in CMT1B (P0+/- mice)
          and CMT1X (connexin-32-deficient mice) models (PMID:16775375 review; PMID:26865613), not established
          as a general driver across all CMT subtypes; systemic terminal complement (C6) inhibition in
          two PMP22-overexpressing CMT1A mouse models reduced neuroinflammation but did not improve motor
          function (PMID:36926597) — this was a mouse experiment, not a failed human trial, and must not
          be counted among failed human CMT1A trials; (6) cholesterol trafficking is disrupted by both
          loss- and gain-of-function PMP22 mutations, but the rescue evidence is directionally specific:
          myelination deficits in dorsal root ganglia explants were improved by cholesterol supplementation
          only in heterozygous PMP22-deficient (loss-of-function) mice (PMID:32511821) — this does not
          support a supplementation strategy for PMP22-duplication (gain-of-function) CMT1A, the reverse
          direction; (7) KIF1B is listed among the CMT axonal-transport genes, but the KIF1B-CMT2A1 relationship
          arose from a small pedigree base, and ClinGen''s Charcot-Marie-Tooth Disease Gene Curation Expert
          Panel classified it as Limited in June 2026 (CGGV:assertion_ae6ffeae-9609-47bf-89a9-4863cf6ef05c-2026-06-12T160000.000Z,
          cited below) — it should not be presented as equivalent in evidentiary weight to the established
          MFN2-CMT2A relationship. Human proof-of-concept for PMP22-lowering therapies remains the critical
          translational gap: no cited study demonstrates clinical benefit in humans from direct PMP22
          lowering; the five human ascorbic-acid trials to date were negative, and only PXT3003 showed
          a modest, single-trial Phase III benefit. Preclinical human-cell evidence is further along than
          the clinical evidence: PMP22 downregulation ameliorated myelin defects in patient-derived CMT1A
          iPSC-organoids (PMID:36511878), and AAV-mediated editing of the PMP22 duplication rescued disease
          features in patient-derived CMT1A iPS Schwann cells (PMID:38017287) — the PMP22-dosage axis
          therefore has direct human-cell (not yet human-trial) proof of concept, alongside the rodent
          validation. ASO and AAV9-miRNA gene therapies are advancing toward clinical translation. A 2026-09
          reconciliation pass against the same openscientist report added source-scoped citations for
          three claims this entry previously asserted without one, plus two qualifications it did not
          carry at all. (a) The failed human arm is now cited: five ascorbic-acid trials were undertaken
          worldwide and none demonstrated significant effectiveness (PMID:26450076), the largest being
          a 2-year randomised trial in 277 CMT1A adults that found no CMTNS difference from placebo at
          24 months (PMID:21393063). Saturable ascorbate absorption has been proposed as the reason they
          failed (PMID:23525455), but that paper argues the case pharmacokinetically rather than testing
          it against the alternatives (target biology, intraneural exposure, outcome sensitivity, model
          fidelity), so it is deliberately not curated here as an established cause. (b) Direct PMP22
          lowering is now cited at the treatment level: post-onset antisense oligonucleotide treatment
          restored myelination and nerve conduction in two rodent CMT1A models (PMID:29202483), and an
          intrathecal AAV9 vector carrying the artificial miRNA miR871 lowered PMP22 and improved disease
          in a humanized mouse model, with dosing, toxicity and biodistribution work in mice and non-human
          primates (PMID:41948127). Both remain preclinical, so the human-validation gap above is unchanged.
          (c) Two further qualifications of the convergence framing: Schwann cells mount an endogenous
          c-Jun repair programme that prevents loss of distal myelinated sensory axons in the C3-PMP22
          CMT1A model (PMID:25216747), so axonal degeneration is actively opposed rather than following
          inevitably from the myelin lesion; and children with CMT2A progress measurably faster on the
          CMTPedS than children with CMT1A over two years (PMID:28796392), so a shared terminal node does
          not imply a shared disease course. Lipidomic and transcriptomic profiling of CMT1A mouse sciatic
          nerve and of patient-derived iPSC Schwann cell precursors extends the cholesterol branch into
          the duplication (gain-of-function) direction and into human cells (PMID:38743588), which the
          PMP22-deficient explant rescue in refinement (6) does not cover. Plasma NfL and GFAP are curated
          below as severity-correlated biomarkers; no CMT biomarker has been shown to change in response
          to an effective disease-modifying therapy, which is recorded as a knowledge gap rather than
          as biomarker validation.'
      selected_evidence:
        snippet: Furthermore, we identified reduced lipid raft dynamics, disturbed plasma membrane fluidity
          and impaired cholesterol incorporation and storage, all of which could result from altered lipid
          storage homeostasis in the patient-derived CMT1A iPSC-SCPs.
        supports: SUPPORT
