          validation. ASO and AAV9-miRNA gene therapies are advancing toward clinical translation. A 2026-09
          reconciliation pass against the same openscientist report added source-scoped citations for
          three claims this entry previously asserted without one, plus two qualifications it did not
          carry at all. (a) The failed human arm is now cited: five ascorbic-acid trials were undertaken
          worldwide and none demonstrated significant effectiveness (PMID:26450076), the largest being
          a 2-year randomised trial in 277 CMT1A adults that found no CMTNS difference from placebo at
