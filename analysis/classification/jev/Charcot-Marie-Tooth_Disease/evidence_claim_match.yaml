          not imply a shared disease course. Lipidomic and transcriptomic profiling of CMT1A mouse sciatic
          nerve and of patient-derived iPSC Schwann cell precursors extends the cholesterol branch into
          the duplication (gain-of-function) direction and into human cells (PMID:38743588), which the
          PMP22-deficient explant rescue in refinement (6) does not cover. Plasma NfL and GFAP are curated
          below as severity-correlated biomarkers; no CMT biomarker has been shown to change in response
          to an effective disease-modifying therapy, which is recorded as a knowledge gap rather than
          as biomarker validation.'
