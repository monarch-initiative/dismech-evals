        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt_biomarker_response_to_therapy
        prompt: Has any CMT biomarker been shown to change in response to an effective disease-modifying
          therapy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - biochemical#Plasma Neurofilament Light Chain
        - biochemical#Plasma Glial Fibrillary Acidic Protein
        rationale: 'Quantitative calf muscle MRI fat fraction, plasma NfL, and plasma GFAP all separate
          CMT from controls and track severity, and fat fraction moves enough over 12 months to be proposed
          as a trial endpoint. None has been measured against a therapy that works, because until PXT3003
          no CMT therapy did, and PXT3003 was not run with these readouts. Responsiveness to untreated
          progression is necessary but not sufficient for surrogacy: a marker can track decline faithfully
          and still fail to move when the upstream mechanism is corrected. Treating any of these as a
          validated surrogate endpoint would overstate what has been shown, and the biomarker substudy
          belongs inside the first direct-lowering trial rather than after it.'
      selected_evidence:
        snippet: We demonstrated a consistent progression of calf muscle MRI fat over 4 years, significant
          longitudinal correlation between CMT Examination Score and calf muscle fat, and potential as
          a bridging biomarker by 1 year change in fat correlating with long-term clinical progression.
        supports: SUPPORT
