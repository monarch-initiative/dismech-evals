          as a human CMT-wide mechanism; (3) UPR/ER-stress modulation (Sephin1/IFB-088) improved neuropathy
          in C3-PMP22 (CMT1A) and MpzR98C (CMT1B) mice (PMID:35501630) — convergence is demonstrated across
