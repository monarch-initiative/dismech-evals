          and CMT1X (connexin-32-deficient mice) models (PMID:16775375 review; PMID:26865613), not established
          as a general driver across all CMT subtypes; systemic terminal complement (C6) inhibition in
          two PMP22-overexpressing CMT1A mouse models reduced neuroinflammation but did not improve motor
          function (PMID:36926597) — this was a mouse experiment, not a failed human trial, and must not
          be counted among failed human CMT1A trials; (6) cholesterol trafficking is disrupted by both
          loss- and gain-of-function PMP22 mutations, but the rescue evidence is directionally specific:
          myelination deficits in dorsal root ganglia explants were improved by cholesterol supplementation
          only in heterozygous PMP22-deficient (loss-of-function) mice (PMID:32511821) — this does not
