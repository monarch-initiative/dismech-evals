          PMP22 overexpression-driven Schwann cell dysfunction and secondary axonal loss. Axonal CMT2
          forms (MFN2, MPZ, others) primarily impair axonal function. The uniform clinical phenotype —
          distal motor and sensory loss in a length-dependent pattern, with foot deformity, distal weakness,
          and absent reflexes — frequently converges on length-dependent axonal degeneration as a late-stage
          correlate of disability across CMT1A and CMT2 subtypes, though not a universal mechanism in
          every model (see notes). The PMP22 duplication CMT1A mouse and rat models recapitulate the human
          phenotype, and PMP22-lowering ASO and PXT3003 (low-dose drug combination) corroborate the PMP22-dosage
