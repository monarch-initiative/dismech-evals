  d82b0964b3de2b59c77a11a89ca7179cd5597937b519ae2193084897a8e0a30a:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease
            term:
              id: MONDO:0015626
              label: Charcot-Marie-Tooth disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: human_proof_of_concept_pmp22_lowering
        prompt: Does lowering PMP22 modify disease in people with CMT1A, as it does in rodent models?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - mechanistic_hypotheses#canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model
        - treatments#PMP22-Lowering Antisense Oligonucleotide
        - treatments#AAV9-miR871 PMP22 Silencing Gene Therapy
        rationale: 'The PMP22 dosage axis is the load-bearing claim of the canonical model and is validated
          only in rodents and in patient-derived cells. Antisense oligonucleotide and AAV9-miRNA approaches
          both improve established disease in rodent CMT1A models, and PMP22 downregulation rescues myelin
          defects in patient-derived organoids and iPS Schwann cells, but no human trial of direct PMP22
          lowering has reported results. Every agent actually given to people with CMT1A has acted indirectly:
          five ascorbic-acid trials were negative, and PXT3003 is a three-drug combination whose modest
          phase III benefit cannot be attributed to PMP22 lowering specifically. Until a first-in-human
          trial of direct lowering reads out, the axis is a preclinical inference rather than a demonstrated
          human mechanism.'
        proposed_experiments:
        - experiment_id: exp_cmt_first_in_human_pmp22_lowering
          name: First-in-human dose-escalation trial of direct PMP22 lowering in CMT1A
          description: 'Phase 1/2 dose escalation in adults with genetically confirmed CMT1A of mild to
            moderate severity, using either a PMP22 antisense oligonucleotide or an intrathecal AAV9-miRNA
            vector. Pair target engagement, measured as PMP22 mRNA in serial skin biopsies, with the two
            outcome measures that have shown movement over 12 months in this disease: quantitative calf
            muscle MRI fat fraction and plasma neurofilament light chain.'
          decision_criterion: Dose-dependent reduction of skin PMP22 mRNA accompanied by stabilisation
            of calf muscle fat fraction and of plasma NfL against the untreated natural-history trajectory
            would establish PMP22 dosage as a modifiable human mechanism.
          would_support:
          - mechanistic_hypotheses#canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model
          would_refute:
          - mechanistic_hypotheses#canonical_pmp22_mpz_axonal_demyelinating_neuropathy_model
          supporting_outcome:
          - Skin PMP22 mRNA falls dose-dependently, and calf muscle fat fraction and plasma NfL stabilise
            relative to the natural-history trajectory.
          refuting_outcome:
          - Skin PMP22 mRNA falls to the degree that rescues rodent models while calf muscle fat fraction
            and plasma NfL continue on their untreated trajectory, indicating that PMP22 dosage is not
            rate-limiting for established human disease.
      selected_evidence:
        snippet: To support clinical translation, we confirmed on-target specificity of miR871 for PMP22
          in vitro, identified a safe and effective dosing range in mice, demonstrated absence of significant
          toxicity in rodents and non-human primates (NHPs), and performed a detailed AAV biodistribution
          study in a large animal model.
        supports: SUPPORT
