    evidence_metadata:
      reference: PMID:25216747
      reference_title: c-Jun activation in Schwann cells protects against loss of sensory axons in inherited
        neuropathy.
      evidence_source: MODEL_ORGANISM
      explanation: Conditional inactivation of Schwann-cell c-Jun in the C3-PMP22 CMT1A mouse worsened
        distal sensory axon loss, so the same cell that carries the genetic lesion also mounts a protective
        repair programme against the shared terminal node. Length-dependent axonal degeneration is therefore
        a modulated outcome in this model rather than an inevitable consequence of the myelin defect.
