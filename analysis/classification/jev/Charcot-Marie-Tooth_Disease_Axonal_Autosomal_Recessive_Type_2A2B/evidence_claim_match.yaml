  ec2617c0236b0274386d3a671ae01ff869a1f481a92e3ab13a1fd6fb6988bd5d:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease, Axonal, Autosomal Recessive, Type 2A2B
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease, axonal, autosomal recessive, type 2A2B
            term:
              id: MONDO:0014906
              label: Charcot-Marie-Tooth disease, axonal, autosomal recessive, type 2a2b;
        context: []
      assertion_type: Genetic
      assertion:
        name: MFN2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: MFN2
          term:
            id: hgnc:16877
            label: MFN2
        notes: 'MFN2 encodes mitofusin-2, an outer-mitochondrial-membrane GTPase. It is the commonest
          cause of axonal Charcot-Marie-Tooth disease, and the overwhelming majority of that is the dominant
          CMT2A2A (OMIM 609260, MONDO:0012231). This entity is OMIM 617087, the biallelic form.

          Expert classification. ClinGen''s Charcot-Marie-Tooth Disease Gene Curation Expert Panel classifies
          the MFN2 gene-disease relationship for Charcot-Marie-Tooth disease type 2A2 as Definitive with
          a **semidominant** mode of inheritance - not autosomal dominant and not autosomal recessive.
          That single field is the most compact statement of this entity''s mechanism available anywhere.
          It is not cited as an evidence item here: the current assertion is absent from the ClinGen gene-validity
          snapshot pinned in `data/clingen/MANIFEST.yaml` (`just clingen-refresh` fails on checksum drift),
          and the older assertion that is in the pin carries a disease label MONDO has since obsoleted.
          Building a cache file from an unpinned download would commit an artifact that cannot be reproduced
          from the pin, and repinning is a separate change from curating a disease. The claim was read
          directly from the ClinGen gene-validity download and is corroborated by the two primary papers
          cited in the inheritance block, which reach the same conclusion from patient data.

          Three traps for anyone extending this entry from the gene rather than from the disease.

          First and most important, **biallelic MFN2 does not mean this disease**. Recessive MFN2 variants
          also cause a lipodystrophy/multiple-symmetric-lipomatosis phenotype that has nothing to do with
          neuropathy, and MFN2 appears as a rare cause in genetically confirmed familial partial lipodystrophy
          cohorts; dismech curates that association in `Familial_Partial_Lipodystrophy`. A search for
          "recessive MFN2" returns both diseases.

          Second, MFN2 causes several *dominant* entities beyond CMT2A2A - hereditary motor and sensory
          neuropathy VIA with optic atrophy (CMT6) and forms with upper motor neuron involvement (CMT5)
          - and dismech separately curates `Autosomal_Dominant_Optic_Atrophy_Plus`. Optic atrophy itself
          does not separate the forms: GeneReviews puts it at about 7 percent in the dominant form and
          about 20 percent in the recessive one, so a paper about MFN2 and optic atrophy has to be read
          for genotype before it is assigned to either.

          Third, MFN2 is heavily studied as a general mitochondrial-dynamics and metabolism gene, in cardiac,
          hepatic, adipose and cancer biology. That literature is far larger than the neuropathy literature
          and is not about any disease curated here.'
      selected_evidence:
        snippet: A causal relationship between Mitofusin (MFN) 2 gene mutations and the hereditary axonal
          neuropathy Charcot-Marie-Tooth disease type 2A (CMT2A) was described over 15 years ago.
        supports: SUPPORT
