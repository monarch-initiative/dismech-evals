      assertion_type: Pathophysiology
      assertion:
        name: Failure of Mitochondrial Outer Membrane Fusion
        biological_scale: MOLECULAR
        description: 'Mitofusin-2 is a transmembrane GTPase of the mitochondrial outer membrane whose
          job is to tether and fuse adjacent mitochondria, and so to shape the large connected networks
          that mitochondria form inside cells. Dysfunctional mitofusin-2 breaks that step. One reported
          homozygous allele shows how directly: an in-frame deletion removing the proline-rich domain
          and the first transmembrane domain was predicted by modelling to insert into the outer membrane
          in a drastically altered topology, and the corresponding fibroblasts contained mitochondria
          tethered to one another but unable to complete fusion.'
        genes:
        - preferred_term: MFN2
          term:
            id: hgnc:16877
            label: MFN2
        biological_processes:
