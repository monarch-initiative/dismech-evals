        snippet: Severe early-onset axonal neuropathy (SEOAN) is a heterogeneous phenotype first delineated
          by Ouvrier et al., characterized by progressive axonal degeneration with gait problems often
          progressing to wheelchair requirement and later respiratory involvement.
