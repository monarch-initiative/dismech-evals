        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mitochondrial Quality Control
        biological_scale: CELLULAR
        description: 'Fusion competence is how a cell decides which mitochondria to keep: organelles that
          can fuse are retained in the network, and those that cannot are sequestered and cleared by mitophagy.
          Losing mitofusin-2 therefore does more than fragment the network - it disrupts that sorting
          step. A 2020 review proposes this as the reason MFN2 dysfunction preferentially affects peripheral
          nerve.'
      selected_evidence:
        snippet: Here, a different perspective of why, in humans, MFN2 dysfunction preferentially impacts
          peripheral nerves is provided based on recent insights into its role in determining whether
          individual mitochondria will be fusion-competent and retained within the cell, or are fusion-impaired,
          sequestered, and eliminated by mitophagy.
        supports: SUPPORT
