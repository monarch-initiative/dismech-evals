      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'Rare enough that the literature is single case reports and small series rather than a
          cohort: the founding study of three individuals, a compound-heterozygous family, an infant case
          report, a homozygous child, a consanguineous Pakistani family, and a severe antenatal case.
          The 2016 case report describes biallelic MFN2 cases as infrequently described, which remains
          an accurate summary. A pain study that recruited MFN2 patients from a CMT clinic enrolled eight
          with MFN2 variants across CMT2A and CMT2A2B together without breaking down the two.

          No prevalence estimate exists for the biallelic form, and none can be derived - the numerator
          is a scattered case literature and there is no denominator at all, so prevalence_class is NOT_YET_DOCUMENTED
          and no rate_per_100000 is given. GeneReviews puts the recessive form at about 10 percent of
          MFN2 hereditary motor and sensory neuropathy; that is a share of an MFN2 cohort, not a population
          rate.'
      selected_evidence:
        snippet: Approximately 90% of MFN2-HMSN is inherited an autosomal dominant (AD) manner, and approximately
          10% is inherited in an autosomal recessive (AR) manner.
