            term:
              id: MONDO:0014906
              label: Charcot-Marie-Tooth disease, axonal, autosomal recessive, type 2a2b;
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dysfunctional Mitofusin-2 Above the Semidominant Dosage Threshold
        biological_scale: MOLECULAR
        description: 'This node is the entity''s defining mechanistic claim and the reason it is a separate
          disease from its dominant sibling rather than simply a severe version of it. The determinant
          of disease is the proportion of mitofusin-2 in the cell that is dysfunctional, not the number
          of mutated alleles.

          The evidence for that is a natural experiment. A nonsense allele carried alone is phenotypically
          silent - no clinical and no electrophysiological neuropathy - so removing half the protein does
          nothing. A semidominant missense allele carried alone produces a mild, almost subclinical neuropathy,
          because roughly half the protein is dysfunctional and half is normal. The same missense allele
          in trans with the nonsense allele produces severe disease, because now essentially all the mitofusin-2
          the cell makes is the dysfunctional kind. And two dysfunctional alleles - the homozygous and
          compound-heterozygous missense patients - give the severe early-onset picture.

          The threshold framing is a synthesis of those observations rather than a measured quantity;
          no study has titrated mutant against wild-type mitofusin-2 in patient neurons.'
        genes:
        - preferred_term: MFN2
          term:
            id: hgnc:16877
            label: MFN2
      selected_evidence:
        snippet: The p.R250W variant behaves as semidominant by causing only a mild, almost subclinical,
          neuropathy when heterozygous; the nonsense mutation in the father was phenotypically silent,
          suggesting that haploinsufficiency for MFN2 is not disease causative, but was deleterious in
          the daughter who had only one active mutated MFN2 allele.
        supports: SUPPORT
