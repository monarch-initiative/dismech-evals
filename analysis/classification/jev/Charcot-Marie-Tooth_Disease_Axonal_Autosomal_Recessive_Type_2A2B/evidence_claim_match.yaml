          include seven months in the compound heterozygote with diaphragmatic paresis and early childhood
          in the homozygous child with the atypical severe phenotype, against a typical dominant CMT2A
          onset in the first two decades. The founding series' syndrome is defined as severe early-onset.
          GeneReviews gives a median onset of eight years in the AR form against twelve in the AD form,
          a smaller gap than the infant case reports suggest. Precise ages are not given for the three
          founding patients in the source available here.
      selected_evidence:
        snippet: This case highlights several clinical findings not typically associated with MFN2 pathogenic
          variants, including young age of onset and rapidly progressing diaphragmatic paresis that necessitated
          tracheostomy and mechanical ventilation, and adds to the growing list of features identified
          in autosomal recessive MFN2-related CMT2.
        supports: SUPPORT
