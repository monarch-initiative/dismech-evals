        name: Supportive and rehabilitative care
        description: 'No disease-modifying therapy exists for CMT2A2B and none has been trialled. Management
          is the supportive care used across Charcot-Marie-Tooth disease and directed at what fails: physical
          and occupational therapy, orthoses and mobility aids, orthopaedic management of foot deformity,
          respiratory surveillance with ventilatory support where diaphragmatic or respiratory muscle
          weakness develops, and genetic counselling. GeneReviews sets out this management for MFN2 hereditary
          motor and sensory neuropathy as a whole, adding low vision aids for optic atrophy; none of it
          is specific to the biallelic form or reported with an outcome in a biallelic patient.'
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: 'No target_mechanisms link, deliberately: a mechanism link would assert an effect on the
          pathograph that nothing demonstrates. The one intervention actually reported in a biallelic
          patient - tracheostomy and mechanical ventilation for diaphragmatic paresis - is curated as
          part of that phenotype rather than as a treatment, because the source describes it as a consequence
          of the disease course rather than as a therapy with an assessed outcome.'
      selected_evidence:
        snippet: Neuropathy is often managed by a multidisciplinary team that includes a neurologist,
          a physiatrist, an orthopedic surgeon, and physical and occupational therapists.
        supports: SUPPORT
        directness: INDIRECT
