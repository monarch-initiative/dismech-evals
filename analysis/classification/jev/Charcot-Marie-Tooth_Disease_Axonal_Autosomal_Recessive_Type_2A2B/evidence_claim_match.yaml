              label: Charcot-Marie-Tooth disease, axonal, autosomal recessive, type 2a2b;
        context: []
      assertion_type: Treatment
      assertion:
        name: Pharmacological enhancement of mitochondrial fusion
        description: 'Mitofusin-activating peptides and small molecules have been developed, and a 2020
          review discusses their potential for pharmacological enhancement of mitochondrial fusion and
          motility in CMT2A. This is the one therapeutic direction that targets the mechanism rather than
          the consequences.

          It is recorded here as a direction, not as a treatment. The review discusses potential applications;
          no trial in CMT2A of any inheritance pattern is cited in the sources available here, and nothing
          has been reported in a biallelic patient. There is also a mechanistic reason for caution specific
          to this entity: if the lesion is a dose of dysfunctional protein rather than a shortage of functional
          protein, a fusion-activating agent must act on the mutant protein to help, and whether it does
          is allele-dependent.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: mitofusin activation
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
        notes: No target_mechanisms link is declared. The agents act on the fusion step this entry curates
          as a node, so the link would be mechanistically natural, but declaring it would assert an effect
          on this disease's pathograph and the only source is a review discussing potential applications
          in CMT2A generally.
      selected_evidence:
        snippet: Finally, in the context of recently described mitofusin activating peptides and small
          molecules, an overview is provided of potential therapeutic applications for pharmacological
          enhancement of mitochondrial fusion and motility in CMT2A and other neurodegenerative conditions.
        supports: SUPPORT
        directness: INDIRECT
