          modifier: DECREASED
          term:
            id: GO:0003924
            label: GTPase activity
        cellular_components:
        - preferred_term: mitochondrial outer membrane
          term:
            id: GO:0005741
            label: mitochondrial outer membrane
      selected_evidence:
        snippet: MFN2 is a transmembrane GTPase located on the mitochondrial outer membrane that contributes
          to mitochondrial fusion, shaping large mitochondrial networks within cells.
        supports: SUPPORT
