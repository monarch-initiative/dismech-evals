        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: trpv4_reduced_surface_expression
        hypothesis_label: Reduced channel surface expression and haploinsufficiency
        status: DEPRECATED
        description: A directly opposed reading of the same variants, and the entry records it because
          the disagreement is real rather than settled. The 2010 gene-discovery study found that R269H,
          R315W and R316C reduced or abolished cell-surface expression and produced decreased stimulus-dependent
          channel activity in HeLa cells, and proposed haploinsufficiency as the likely pathomechanism
          - the opposite direction to the gain-of-function reading this entry otherwise adopts. The weight
          of later evidence favours gain of function, particularly the in vivo endothelial work, but a
          curator reading only the GOF papers would not know this was ever in question.
      selected_evidence:
        snippet: Based on our results using HeLa cells as a heterologous expression system, we suggest
          that the mutations described here lead to decreased stimulus-dependent TRPV4 channel activity.
        supports: SUPPORT
    origin:
