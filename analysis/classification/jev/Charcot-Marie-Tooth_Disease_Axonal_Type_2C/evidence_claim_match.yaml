      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: trpv4_endothelial_non_cell_autonomous
        hypothesis_label: Non-cell-autonomous degeneration via endothelial barrier breakdown
        status: CANONICAL
        description: The account with the strongest in vivo support. Knock-in mice carrying the same ankyrin-domain
          substitutions found in patients develop weakness and regional motor neuron loss, and deleting
          the mutant allele specifically from endothelial cells rescues them, while deleting it from neurons,
          glia or muscle does not. The proximate lesion is focal breakdown of the blood-spinal cord barrier,
          driven by gain of mutant channel function in neural vascular endothelial cells. On this account
          motor neuron death is a consequence of vascular barrier failure rather than of channel activity
          in the neuron itself.
      selected_evidence:
        snippet: Genetic deletion of the mutant Trpv4 allele from endothelial cells (but not neurons,
          glia, or muscle) rescued these phenotypes.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38776392
      reference_title: Gain-of-function mutations of TRPV4 acting in endothelial cells drive blood-CNS
        barrier breakdown and motor neuron degeneration in mice.
      evidence_source: MODEL_ORGANISM
      explanation: The cell-type-specific rescue experiment, which is what makes this a claim about the
        driving cell type rather than about where the channel happens to be expressed.
