        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: trpv4_neuron_autonomous_calcium_toxicity
        hypothesis_label: Neuron-autonomous cytotoxic calcium overload
        status: ALTERNATIVE
        description: 'The account this entry''s pathophysiology chain models in detail: mutant channel
          activity raises intracellular calcium to cytotoxic levels and kills the cell directly, with
          the death reversible by channel blockade. It rests on transfected-cell work rather than on in
          vivo genetics, and the cell-type-specific rescue above argues that in the intact animal the
          neuron is not the cell in which the decisive channel activity occurs. The two are not mutually
          exclusive - calcium toxicity is the proximate cause of cell death in whichever cell type carries
          the decisive activity - but an entry that modelled only the neuronal version would misstate
          where the lesion begins.'
      selected_evidence:
        snippet: Cells transfected with R232C and R316H displayed increased intracellular Ca(2+) levels
          and reversible cell death by the TRPV channel antagonist, ruthenium red.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
