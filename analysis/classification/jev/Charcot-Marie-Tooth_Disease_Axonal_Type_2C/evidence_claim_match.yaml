          name: Charcot-Marie-Tooth Disease Axonal Type 2C
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease axonal type 2C
            term:
              id: MONDO:0011633
              label: Charcot-Marie-Tooth disease axonal type 2C
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: trpv4_channel_blockade_human_translation
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does systemic TRPV4 antagonism, which rescues symptomatic knock-in mice, benefit human
          CMT2C, given that the mouse disease is lethal and vascular-dominant while the human disease
          is chronic and usually non-lethal?
        attaches_to:
        - pathophysiology#Endothelial Blood-CNS Barrier Breakdown
        - pathophysiology#Cytotoxic Intracellular Calcium Elevation
        rationale: Systemic administration of a TRPV4-specific antagonist abrogates the barrier impairment
          and markedly rescues symptomatic mutant mice, so the open question is not whether channel blockade
          works in an animal but whether the animal is the right animal. The knock-in mice show early
          lethality and a vascular-dominant phenotype, whereas human CMT2C is a chronic, slowly progressive
          neuropathy in which patients characteristically survive to adulthood - so a rescue measured
          against early death in mice does not straightforwardly predict benefit against decades of axonal
          loss in people. The reversibility of the barrier lesion is the encouraging part; the severity
          mismatch is the caveat.
      selected_evidence:
        snippet: TRPV4 mutant mice exhibited weakness, early lethality, and regional motor neuron loss.
        supports: SUPPORT
