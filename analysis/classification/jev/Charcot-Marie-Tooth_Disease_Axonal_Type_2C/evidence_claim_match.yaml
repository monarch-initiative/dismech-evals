              label: Charcot-Marie-Tooth disease axonal type 2C
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: trpv4_ankyrin_domain_phenotype_discordance
        kind: KNOWLEDGE_GAP
        prompt: What determines whether a TRPV4 ankyrin-repeat-domain variant produces CMT2C, scapuloperoneal
          spinal muscular atrophy, congenital distal spinal muscular atrophy, or no neuropathy at all,
          given that the same residues and even the same variant can yield different phenotypes?
        attaches_to:
        - pathophysiology#TRPV4 Ankyrin-Repeat Domain Gain-of-Function Variant
        rationale: TRPV4 genotype-phenotype relationships are discordant at two levels. Within the neuromuscular
          group, the same variant can present as phenotypic CMT2C with vocal cord paresis in one individual
          and as undifferentiated CMT2 in another from the same family, so the laryngeal feature that
          defines the entity is not genotype-determined. Across the wider spectrum, TRPV4 variants outside
          the ankyrin domain cause skeletal dysplasias with no neuropathy, and affected individuals typically
          have either neuromuscular or skeletal manifestations rather than both. A calcium-toxicity model
          explains why an ankyrin-domain gain of function kills neurons, but not why it kills these neurons
          in this pattern, nor why other gain-of-function variants spare neurons entirely and hit cartilage
          instead. Modifier genes, cell-type-specific channel regulation and differential expression are
          all candidates; none is established.
      selected_evidence:
        snippet: Individuals with the same mutation may have nondistinct CMT2 or have phenotypic CMT2C
          with vocal cord paresis.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
