        name: BAG3-related distal hereditary motor neuronopathy
        description: A third neuropathy phenotype of the same gene, and the closest differential to CMT2JJ.
          The truncating variant p.Val505GlyfsTer6 causes an adult-onset, slowly progressive, symmetric
          distal motor neuronopathy with absent Achilles reflexes and neurogenic changes on biopsy, in
          a family of eight affected individuals with mean onset at 46 years. It is distinguished from
          CMT2JJ by being purely motor — CMT2JJ is sensorimotor, indeed sensory-predominant — and by incomplete
          penetrance in women, with one obligate female carrier surviving to 73 without weakness. The
          larger European series links nonsense and frameshift BAG3 variants to this distal motor phenotype
          and to isolated dilated cardiomyopathy, as against the missense IPV-motif alleles of CMT2JJ
          and myofibrillar myopathy.
      selected_evidence:
        snippet: Seven patients developed slowly progressive and symmetric distal weakness and atrophy
          of lower limb muscles, along with absent Achilles reflexes.
        supports: SUPPORT
