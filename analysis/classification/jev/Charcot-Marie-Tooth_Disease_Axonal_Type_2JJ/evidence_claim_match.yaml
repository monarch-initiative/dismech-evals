      assertion_type: Pathophysiology
      assertion:
        name: BAG3 IPV Motif Variant
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: Heterozygous variants affect the conserved IPV motif region of BAG3, the surface
          through which it binds the small heat shock protein HSPB8. The recurrent CMT2JJ allele is p.Pro209Ser
          (c.625C>T), reported in three families and then independently in a Chinese family, and proposed
          on that basis to be a hotspot with more than one ethnic origin. It sits at the same codon as
          the myofibrillar myopathy allele p.Pro209Leu (c.626C>T) — adjacent nucleotides, one codon, two
          diseases.
        genes:
        - preferred_term: BAG3
          term:
            id: hgnc:939
            label: BAG3
        genetic_context:
          functional_impact_category: GAIN_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: 'Heterozygous germline missense variants at the IPV motif. The action is a toxic
            gain of function, not haploinsufficiency or a simple dominant negative: the Pro209 mutants
            as a class acquire a new property, relocating themselves and their chaperone partners into
            insoluble aggresomes. This was shown for all Pro209 mutants together, p.Pro209Ser included,
            rather than inferred from the myopathy allele alone.'
      selected_evidence:
        snippet: Recently, a novel c.625C>T (p.Pro209Ser) mutation in BAG3 was reported to cause axonal
          Charcot-Marie-Tooth (CMT) disease in three families.
        supports: SUPPORT
