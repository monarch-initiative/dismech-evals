  4fbd9f208eda1c1d79f3c38269b173dcdad909003b84ea1411f60f129148fce3:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth disease, axonal, type 2JJ
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease, axonal, type 2JJ
            term:
              id: MONDO:0976227
              label: Charcot-Marie-tooth disease, axonal, type 2JJ
        context: []
      assertion_type: Phenotype
      assertion:
        category: Neurologic
        name: Preserved Ambulation
        description: 'A prognostically important negative, stated at allele resolution. The p.Pro209Ser
          variant that defines CMT2JJ is associated with a pure CMT2 phenotype, in contrast to the recurrent
          p.Pro209Leu allele at the same codon, where most patients lose ambulation and develop respiratory
          insufficiency and restrictive cardiomyopathy. This is the practical reason a BAG3 result must
          be read at codon resolution rather than gene level.

          Deliberately NOT claimed here: that CMT2JJ patients resemble the ten non-p.Pro209Leu patients
          in the European BAG3-NMD cohort. That group carried p.Arg309*, p.Val505Glyfs*6 and p.Pro209Gln,
          had pure distal motor weakness with ENMG compatible with dHMN, and the same paper places p.Pro209Ser
          outside the cohort entirely. Borrowing their course would import the phenotype of the very entity
          this entry''s differential diagnoses separate CMT2JJ from.'
      selected_evidence:
        snippet: However, the p.(Pro209Ser) variant is associated with a pure CMT2 phenotype and no overt
          cardiac disease.
        supports: SUPPORT
    origin:
      assertion_path: /phenotypes/2
      evidence_path: /phenotypes/2/evidence/0
      context_paths:
