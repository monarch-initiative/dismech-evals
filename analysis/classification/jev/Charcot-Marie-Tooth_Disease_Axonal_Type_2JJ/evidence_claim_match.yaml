      assertion_type: Discussion
      assertion:
        discussion_id: cmt2jj_no_approved_neuromuscular_treatment
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is any therapy in the BAG3 preclinical pipeline applicable to the neuropathic p.Pro209Ser
          phenotype, or does the whole pipeline target the myopathic arm?
        attaches_to:
        - pathophysiology#Misfolded Protein Aggregation in Peripheral Neurons
        rationale: 'No treatment is approved for the neuromuscular manifestations of BAG3-related disease,
          and this entry therefore curates no `treatments` block. The gap is recorded rather than left
          as an absence because the preclinical landscape is not empty: metformin rescues muscle function
          in a zebrafish model of BAG3 myofibrillar myopathy. That result is about the MYOPATHIC arm —
          the p.Pro209Leu entity, not this one — and nothing establishes that a muscle-function rescue
          transfers to an axonal neuropathy driven by the same codon but a different substitution. Curating
          metformin as a CMT2JJ treatment would be exactly the codon-resolution error this entry exists
          to prevent.'
        proposed_experiments:
        - experiment_id: exp_cmt2jj_metformin_in_a_neuropathic_model
          name: Test metformin in a p.Pro209Ser neuropathic model
          description: Determine whether the metformin rescue reported for BAG3 myofibrillar myopathy
            extends to a p.Pro209Ser model with a peripheral-nerve readout, rather than assuming the myopathy
            result generalises across codon-209 substitutions.
      selected_evidence:
        snippet: no treatments are approved for the neuromuscular manifestations of BAG3-related disease,
          but several therapies are at a preclinical development stage.
        supports: SUPPORT
