        context: []
      assertion_type: Genetic
      assertion:
        name: BAG3
        gene_term:
          preferred_term: BAG3
          term:
            id: hgnc:939
            label: BAG3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'BAG3 (10q26.11) encodes a multifunctional co-chaperone responsible for protein quality
          control. The recurrent CMT2JJ allele is c.625C>T (p.Pro209Ser), reported across three families
          and independently in a Chinese family, and proposed as a hotspot on the basis of its differing
          ethnic origins. Note the adjacent-nucleotide contrast that makes this gene instructive: c.626C>T
          (p.Pro209Leu) at the same codon causes myofibrillar myopathy 6 and dilated cardiomyopathy rather
          than neuropathy. BAG3 disease should be considered in CMT genetic testing, which is the practical
          recommendation the reporting authors make.

          Codon 209 carries THREE reported substitutions, not two, and stating only the Ser-versus-Leu
          pair understates the delimitation problem. p.Pro209Gln is a third, de novo allele associated
          with a neuromyopathy, and it was among the non-p.Pro209Leu variants in the European BAG3-NMD
          cohort. All three sit in one of the two isoleucine-proline-valine motifs that bind the small
          heat-shock proteins HSPB1, HSPB5/alpha-B-crystallin and HSPB8, which is why one codon can produce
          a neuropathy, a myopathy, and a neuromyopathy depending on the residue substituted. A BAG3 codon-209
          result is therefore not interpretable without the specific amino acid change.

          Other BAG3 neuromuscular alleles outside codon 209 include p.Arg309* (a nonsense variant otherwise
          known for isolated dilated cardiomyopathy), p.Val505Glyfs*6 (causing distal hereditary motor
          neuropathy) and p.Pro470Ser. These are recorded here as the surrounding allelic landscape, not
          as CMT2JJ.'
      selected_evidence:
        snippet: This study further enforces the association between BAG3 gene and CMT disease, indicating
          that BAG3 should be considered in the genetic testing for CMT.
        supports: SUPPORT
    origin:
