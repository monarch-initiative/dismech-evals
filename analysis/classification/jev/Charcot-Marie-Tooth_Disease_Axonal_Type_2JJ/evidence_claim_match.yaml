            term:
              id: MONDO:0976227
              label: Charcot-Marie-tooth disease, axonal, type 2JJ
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Misfolded Protein Aggregation in Peripheral Neurons
        biological_scale: CELLULAR
        role: central_effector
        mechanism_confidence: PROVISIONAL
        conforms_to: loss_of_proteostasis#Misfolded-Protein Aggregation
        description: 'Aggresome formation and client entrapment are directly demonstrated for the Pro209
          mutants, so the aggregation itself is not in doubt. What remains PROVISIONAL is specifically
          the peripheral-neuron step: the aggresome work was done in cell lines, no study has shown aggregates
          in nerve tissue from a CMT2JJ patient, and the supporting argument that aggregation is what
          damages the axon leans additionally on the analogy with HSPB1 p.Pro182Leu in CMT2. A closer
          corroboration than that analogy is that HSPB8 — one of the small heat-shock proteins the Pro209
          motif binds directly — itself causes axonal CMT2 when mutated, so the client side of this chaperone
          relationship is independently established as a peripheral-neuropathy mechanism. The gradual
          loss of protein homeostasis these mutants produce is the plausible route to axonal degeneration;
          it has not been observed in the affected tissue.'
        biological_processes:
        - preferred_term: protein folding
          modifier: ABNORMAL
          term:
            id: GO:0006457
            label: protein folding
        cell_types:
        - preferred_term: Sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
        - preferred_term: Motor neuron
          term:
            id: CL:0000100
            label: motor neuron
      selected_evidence:
        snippet: Mutations in HsbP8 also cause axonal CMT2 (6).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
