        conforms_to: loss_of_proteostasis#Loss of Proteostasis
        description: 'BAG3 is the co-chaperone of chaperone-assisted selective autophagy: with HSPB8 and
          Hsp70 it transports misfolded proteins to the microtubule organizing center for degradation
          in autophagosomes. The Pro209 mutants do not merely fail at this — they actively subvert it,
          relocating CASA-complex chaperones into insoluble aggresomes and trapping ubiquitinylated client
          proteins there so they cannot be cleared. This was demonstrated for the Pro209 mutant class
          including p.Pro209Ser, which is why this node is ESTABLISHED rather than inferred from the myopathy
          allele.'
        biological_processes:
        - preferred_term: chaperone-mediated autophagy
          modifier: DECREASED
          term:
            id: GO:0061684
            label: chaperone-mediated autophagy
        - preferred_term: protein folding
          modifier: ABNORMAL
          term:
            id: GO:0006457
            label: protein folding
      selected_evidence:
        snippet: BAG3 interacts with chaperones HSPB8 and Hsp70 to transport misfolded proteins to the
          Microtubule Organizing Center (MTOC) and degrade them in autophagosomes in a process known as
          Chaperone Assisted Selective Autophagy (CASA).
        supports: SUPPORT
