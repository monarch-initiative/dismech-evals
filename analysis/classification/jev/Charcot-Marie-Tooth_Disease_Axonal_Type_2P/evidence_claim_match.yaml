  4aa29d911747a8714436637d96c46d6bfc5308837e18420586c6180005af8ceb:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Axonal Type 2P
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease axonal type 2P
            term:
              id: MONDO:0013753
              label: Charcot-Marie-Tooth disease axonal type 2P
        context: []
      assertion_type: Genetic
      assertion:
        name: LRSAM1
        notes: 'The sole gene for this disorder, at 9q33.3, encoding a universally expressed RING-type
          E3 ubiquitin ligase also known as Tal. Its domain architecture divides the work: the leucine-rich
          repeat domain targets substrates and the RING domain catalyses ubiquitin transfer, which is
          why disease variants clustered in the RING-encoding exons abolish catalysis while leaving substrate
          binding intact. Outside this disease the same ligase is required for ubiquitin-dependent autophagy
          of intracellular Salmonella, which is where much of what is known about its substrate targeting
          comes from.

          '
        gene_term:
          preferred_term: LRSAM1
          term:
            id: hgnc:25135
            label: LRSAM1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: A homozygous pathogenic variant was identified in the gene encoding leucine rich repeat
          and sterile alpha motif 1 (LRSAM1) by direct DNA sequencing of genes within the region in affected
          DNA samples.
        supports: SUPPORT
