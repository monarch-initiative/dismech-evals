              label: Charcot-Marie-Tooth disease axonal type 2P
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Nigral Neuron Degeneration
        biological_scale: CELLULAR
        description: 'An emerging and unexplained branch. Within one generation of the original dominant
          Dutch kindred, three of five affected members developed Parkinson disease between the ages of
          50 and 65, many years after their neuropathy began. The authors propose that the parkinsonism
          is part of the LRSAM1 phenotype rather than coincidence, and say plainly that how the mutant
          protein affects substantia nigra neurons is unclear. Nothing connects the ligase to nigral biology,
          and the observation rests on one family plus scattered later cases, so this node exists to hold
          the association rather than to explain it.

          '
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: Within one generation of the original Dutch family in which the dominant LRSAM1 mutation
          was identified, three of the five affected family members have developed Parkinson's disease
          between ages 50 and 65 years, many years after neuropathy onset.
        supports: SUPPORT
