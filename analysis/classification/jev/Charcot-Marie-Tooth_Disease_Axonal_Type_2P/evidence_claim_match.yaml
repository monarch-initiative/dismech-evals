      assertion_type: Pathophysiology
      assertion:
        name: Increased Vulnerability of Long Peripheral Axons
        biological_scale: CELLULAR
        description: 'The node that carries the length-dependence, and the one the mouse model speaks
          to most directly. Lrsam1 is abundantly expressed in peripheral motor and sensory neurons. Mutant
          mice, homozygous or heterozygous, have largely normal neuromuscular performance and only a very
          mild age-related neuropathy - so loss of the ligase is not sufficient to degenerate a mouse
          axon on its own. It does, however, lower the threshold: mutant mice are more sensitive than
          controls to acrylamide, a neurotoxin that causes axon degeneration, which the authors read as
          showing the axons are compromised.

          A transcriptomic observation points the same way from the human side. Patient cells carrying
          p.Cys694Tyr upregulate TNFRSF21, a key regulator of axonal degeneration, alongside the E3 ligase
          NEDD4L.

          '
