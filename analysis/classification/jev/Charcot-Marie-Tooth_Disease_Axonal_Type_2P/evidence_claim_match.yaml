              label: Charcot-Marie-Tooth disease axonal type 2P
        context: []
      assertion_type: Genetic
      assertion:
        name: LRSAM1
        notes: LRSAM1 encodes a RING-type E3 ubiquitin ligase. Dominant alleles include RING-domain missense
          substitutions, in-frame indels and truncating or elongating frameshifts; the original recessive
          splice allele removes the RING domain. Reduced penetrance occurs. French families included p.Gln698_Gln701del
          and p.Pro702_Gln711dup; a shared approximately 450-kb haplotype in four deletion-carrying families
          suggested a founder effect. LRR-dependent bacterial recognition and RING-dependent ubiquitination
          are normal-biological experimental findings, not evidence that infection causes CMT2P.
        gene_term:
          preferred_term: LRSAM1
          term:
            id: hgnc:25135
            label: LRSAM1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: A common haplotype of ~450 kb suggesting a founder effect was noted around LRSAM1 in
          4 families carrying the first variant.
        supports: SUPPORT
