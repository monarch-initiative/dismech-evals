        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of E2-E3 Interaction and Loss of Ubiquitylation Activity
        biological_scale: MOLECULAR
        description: 'Where the two allelic routes converge, and the best-measured step in the disease.
          Three separate disease alleles - the p.Leu708Argfs frameshift and the missense alleles p.Pro707Leu
          and p.Cys694Tyr - were assayed and all showed in vitro ubiquitylation activity largely abrogated.
          The reason is specific: they lose the E2-E3 interaction that ubiquitin transfer requires.

          The negative result in the same experiment is what makes this node precise. LRSAM1 dimerisation
          and its binding to TSG101 were not disrupted, so the lesion is in catalysis rather than in assembly
          or substrate recognition. A therapeutic strategy aimed at restoring substrate binding would
          therefore be aimed at a step that is not broken.

          '
        molecular_functions:
        - preferred_term: ubiquitin protein ligase activity
          modifier: DECREASED
          term:
            id: GO:0061630
            label: ubiquitin protein ligase activity
        biological_processes:
        - preferred_term: protein ubiquitination
          modifier: DECREASED
          term:
            id: GO:0016567
            label: protein ubiquitination
      selected_evidence:
        snippet: We demonstrate that loss of the E2-E3 interaction that is an essential prerequisite for
          supporting ubiquitylation of target substrates, underlies this reduced ubiquitylation capacity.
        supports: SUPPORT
