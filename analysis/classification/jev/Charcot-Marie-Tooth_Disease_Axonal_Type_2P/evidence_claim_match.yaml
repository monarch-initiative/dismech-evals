    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Axonal Type 2P
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease axonal type 2P
            term:
              id: MONDO:0013753
              label: Charcot-Marie-Tooth disease axonal type 2P
        context: []
      assertion_type: Treatment
      assertion:
        name: Neuropathic Pain Management
        description: 'The gap between what this entry says distinguishes CMT2P and what it offered clinically.
          Pain is prominent enough here that the largest series calls the disorder a cause of painful
          neuropathy specifically, and pain is treatable where the neuropathy is not.

          A caution on the evidence, because the sources sit at three different scopes and none is CMT2P-specific.
