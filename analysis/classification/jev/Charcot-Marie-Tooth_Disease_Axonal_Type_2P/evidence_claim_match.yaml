          50 and 65, many years after their neuropathy began. The authors propose that the parkinsonism
          is part of the LRSAM1 phenotype rather than coincidence, and say plainly that how the mutant
          protein affects substantia nigra neurons is unclear. Nothing connects the ligase to nigral biology,
          and the observation rests on one family plus scattered later cases, so this node exists to hold
          the association rather than to explain it.

          '
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
