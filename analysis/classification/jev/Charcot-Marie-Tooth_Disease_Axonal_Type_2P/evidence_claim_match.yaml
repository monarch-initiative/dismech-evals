      assertion_type: Treatment
      assertion:
        name: Neuropathic Pain Management
        description: 'The gap between what this entry says distinguishes CMT2P and what it offered clinically.
          Pain is prominent enough here that the largest series calls the disorder a cause of painful
          neuropathy specifically, and pain is treatable where the neuropathy is not.

          A caution on the evidence, because the sources sit at three different scopes and none is CMT2P-specific.
          That pain needs treating in CMT2 is stated by the CMT2 GeneReviews chapter. That pain is a major
          and inadequately managed problem across CMT is established in a patient cohort. The specific
          agent classes - tricyclic antidepressants, carbamazepine, gabapentin - are named only in the
          GeneReviews chapter for MFN2-related CMT2, a sibling subtype, as generic symptomatic management
          rather than anything MFN2-specific. No trial of any of these agents in CMT2P exists, and none
          is likely to. The agents are curated because a queryable treatment with no named agent is not
          useful to a clinician, and every item is graded INDIRECT with its scope stated.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: gabapentin
            term:
              id: CHEBI:42797
              label: gabapentin
          - preferred_term: carbamazepine
            term:
              id: CHEBI:3387
              label: carbamazepine
          - preferred_term: amitriptyline
            term:
              id: CHEBI:2666
              label: amitriptyline
