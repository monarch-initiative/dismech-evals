          an additional Lrsam1 genotype effect. These findings support compromised axonal maintenance,
          but do not establish a human toxic-exposure mechanism or explain every dominant allele. NEDD4L
          and TNFRSF21 transcript increases in p.Cys694Tyr lymphoblasts are ancillary observations, not
