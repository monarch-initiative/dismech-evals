        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired TSG101-Dependent Endosomal Sorting
        biological_scale: CELLULAR
        description: 'The weakest link in the chain, and it is marked as such. TSG101, a component of
          the ESCRT-I complex, is the only well-validated LRSAM1 ubiquitylation target; LRSAM1 was originally
          characterised as Tal, a Tsg101-specific E3 ligase regulating receptor endocytosis and retrovirus
          budding. Loss of that ubiquitylation is expected to perturb endosomal sorting and multivesicular-body
          traffic, and several other CMT gene products act in the same pathway, which is the argument
          for its relevance here.

          But the inference is not demonstrated in neurons. Two observations complicate it. In transfected
          cells LRSAM1 localises to a perinuclear compartment just beyond the Golgi and shows little colocalisation
          with endosome-to-lysosome trafficking machinery, which the authors take as a reason to consider
          other cellular mechanisms. And in patient lymphoblasts carrying p.Cys694Tyr, TSG101 protein
          levels were unchanged. This node is therefore curated as an inferred step, not an established
          one.

          '
        cellular_components:
        - preferred_term: endosome
          term:
            id: GO:0005768
            label: endosome
        biological_processes:
        - preferred_term: endosome organization
          modifier: ABNORMAL
          term:
            id: GO:0007032
            label: endosome organization
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: We report a novel protein, Tal (Tsg101-associated ligase), whose RING finger is necessary
          for multiple monoubiquitylation of Tsg101.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
