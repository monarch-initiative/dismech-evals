      assertion_type: Pathophysiology
      assertion:
        name: Nonsense-Mediated Decay and Complete Loss of LRSAM1 Protein
        biological_scale: MOLECULAR
        description: 'The recessive route. In the founding kindred a single base change converts an intronic
          acceptor splice site from AG to AA; the affected exon is mis-spliced, an obligatory frameshift
          truncates the protein, and western blotting of immortalised patient cells shows no detectable
          LRSAM1 at all. A carrier keeps one functioning allele and is unaffected, which is what makes
          this route recessive.

          '
        genes:
        - preferred_term: LRSAM1
          term:
            id: hgnc:25135
            label: LRSAM1
          modifier: DECREASED
        genetic_context:
          description: Homozygous intronic splice-acceptor variant causing aberrant splicing and truncation,
            with no detectable protein product.
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Direct analysis of RNA from patient blood demonstrated aberrant splicing of the affected
          exon, causing an obligatory frameshift and premature truncation of the protein.
        supports: SUPPORT
