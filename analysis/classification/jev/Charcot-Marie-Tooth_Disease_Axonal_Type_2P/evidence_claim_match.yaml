            term:
              id: MONDO:0013753
              label: Charcot-Marie-Tooth disease axonal type 2P
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: LRSAM1 RING-Domain Variants
        biological_scale: MOLECULAR
        description: 'LRSAM1 encodes a universally expressed RING-type E3 ubiquitin ligase with an LRR-coiled-coil-SAM-PDZ-binding-RING
          architecture, in which the LRR domain selects substrates and the RING domain catalyses ubiquitin
          transfer. Pathogenic variants cluster tightly in the 3-prime exons encoding the C-terminal RING
          domain: a homozygous splice-acceptor variant in the founding recessive kindred, the dominant
          frameshift p.Leu708Argfs*28, and the missense alleles p.Pro707Leu and p.Cys694Tyr. Reported
          series add further alleles, most of them novel and most of them dominant.

          The clustering is not incidental. Because these variants sit near the end of the transcript,
          whether the premature termination codon they introduce is recognised by nonsense-mediated decay
          is genuinely uncertain in individual cases, which is what makes variant interpretation here
          difficult and what determines the inheritance pattern.

          '
        genes:
        - preferred_term: LRSAM1
          term:
            id: hgnc:25135
            label: LRSAM1
        genetic_context:
          description: Germline LRSAM1 variants concentrated in the 3-prime RING-encoding exons, heterozygous
            in the dominant families and homozygous in the recessive kindred.
          variant_origin: GERMLINE
      selected_evidence:
        snippet: Due to variable inheritance patterns and clustering of pathogenic variants in 3´-prime
          exons, interpretation of genetic variants in LRSAM1 is challenging.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
