        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Disturbed Ribosome Biogenesis and Translation
        prompt: 'Which IGHMBP2-dependent RNA process (pre-rRNA processing, tRNA metabolism, translation,
          mRNA export) is rate-limiting in long peripheral axons, and why does partial loss spare respiratory
          motor neurons while abolished activity does not?

          '
        rationale: 'IGHMBP2 has several proposed roles in gene expression and the field has not determined
          which, when dysregulated, causes neurodegeneration; the residual-activity threshold that separates
          CMT2S from SMARD1 is established at the biochemical level but its cellular basis in neuron subtypes
          is not.

          '
      selected_evidence:
        snippet: More than 20 years after the link between IGHMBP2 and SMARD1 was revealed, and 10 years
          after the discovery of the association between IGHMBP2 and CMT2S, the pathogenic mechanism of
          these diseases is still not well defined.
        supports: SUPPORT
