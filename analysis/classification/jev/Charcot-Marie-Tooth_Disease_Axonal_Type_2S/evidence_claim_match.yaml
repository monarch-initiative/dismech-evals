            term:
              id: MONDO:0014511
              label: Charcot-Marie-Tooth disease axonal type 2S
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disturbed Ribosome Biogenesis and Translation
        description: 'IGHMBP2, with ABT1, binds the 47S pre-rRNA 5'' external transcribed spacer and U3
          snoRNA, implicating it in pre-rRNA processing; it is also associated with tRNA and translation
          machinery. Loss of activity is proposed to impair ribosome biogenesis and translation, with
          a low-grade integrated stress response in knockout cells, but which of IGHMBP2''s RNA-metabolic
          roles drives neuronal pathology is unresolved.

          '
        biological_scale: CELLULAR
