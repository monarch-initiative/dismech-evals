  785a830fa65842a703a730eaa4f71f449f59db49f5bd4219d130c8452927ff72:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Axonal Type 2S
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease axonal type 2S
            term:
              id: MONDO:0014511
              label: Charcot-Marie-Tooth disease axonal type 2S
        context: []
      assertion_type: Genetic
      assertion:
        name: IGHMBP2
        gene_term:
          preferred_term: IGHMBP2
          term:
            id: hgnc:5542
            label: IGHMBP2
        relationship_type: CAUSATIVE
        notes: Biallelic IGHMBP2 variants cause CMT2S and the allelic SMARD1 spectrum. In the 2022 CMT2S
          literature synthesis, two-thirds of reported variants were missense changes and one-third were
          presumed loss-of-function nonsense, frameshift or splice variants. Residual protein abundance
          and biochemical activity correlate with severity in selected cell lines and alleles, but are
          not validated predictors across genotypes. Identical biallelic variants can produce different
          respiratory and neurological courses within a family. Deep intronic splice-altering alleles
          can be missed by coding-region analysis.
        variants:
        - name: c.2770C>T (p.His924Tyr)
          description: 'CMT2S-associated missense variant in the C-terminal region; alters IGHMBP2 activity
            to a lesser extent than the SMARD1 variant p.Asp565Asn while maintaining association with
            ABT1, and the equivalent H922Y knock-in mouse has a normal lifespan without respiratory pathology,
            modelling the CMT2S end of the spectrum.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.1156T>C (p.Trp386Arg) / c.2747G>A (p.Cys916Tyr)
          description: Compound heterozygous missense variants in a boy with CMT2S who developed diaphragmatic
            weakness at 9 years.
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.1235+894C>A (deep intronic splice variant)
          variant_type: single nucleotide variant
          genomic_contexts:
          - intron
          description: The paternal intron-8 variant was identified in trans with maternal p.Leu577Pro
            in a CMT2S patient. It activates a cryptic splice acceptor and inserts a 182-base-pair pseudoexon,
            disrupting the reading frame and promoting nonsense-mediated decay. VCA-894A targets this
            splice defect; its rescue does not establish efficacy for other IGHMBP2 variants.
      selected_evidence:
        snippet: Further sequencing revealed a total of 11 CMT2 families with recessively inherited IGHMBP2
          gene mutations.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
