  beaaf71567e3e2cc4c8e8160b25e678ee579f72d1dff7f540e81c99202782568:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Axonal Type 2S
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease axonal type 2S
            term:
              id: MONDO:0014511
              label: Charcot-Marie-Tooth disease axonal type 2S
        context: []
      assertion_type: Genetic
      assertion:
        name: IGHMBP2
        gene_term:
          preferred_term: IGHMBP2
          term:
            id: hgnc:5542
            label: IGHMBP2
        relationship_type: CAUSATIVE
        notes: 'Biallelic IGHMBP2 (11q13.3) variants cause CMT2S; the same gene causes SMARD1, and compound
          heterozygotes for one severe and one milder allele can present with either phenotype, even within
          a sibship. Two-thirds of reported CMT2S variants are missense changes clustering in the helicase
          and ATPase domains and one-third are presumed loss-of-function (nonsense, frameshift, splice)
          alleles; missense changes near the RNA-binding channel or the nucleotide-binding pocket may
          be associated with more severe outcomes. Residual protein level and biochemical (ATPase/helicase)
          activity correlate with the SMARD1-versus-CMT2S outcome. Deep intronic variants activating cryptic
          splice sites are a recognised class.

          '
        variants:
        - name: c.2770C>T (p.His924Tyr)
          description: 'CMT2S-associated missense variant in the C-terminal region; alters IGHMBP2 activity
            to a lesser extent than the SMARD1 variant p.Asp565Asn while maintaining association with
            ABT1, and the equivalent H922Y knock-in mouse has a normal lifespan without respiratory pathology,
            modelling the CMT2S end of the spectrum.

            '
          type: missense
          clinical_significance: PATHOGENIC
        - name: c.1156T>C (p.Trp386Arg) / c.2747G>A (p.Cys916Tyr)
          description: Compound heterozygous missense variants in a boy with CMT2S who developed diaphragmatic
            weakness at 9 years.
          type: missense
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Further sequencing revealed a total of 11 CMT2 families with recessively inherited IGHMBP2
          gene mutations.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25439726
      reference_title: Truncating and missense mutations in IGHMBP2 cause Charcot-Marie Tooth disease
        type 2.
      evidence_source: HUMAN_CLINICAL
      explanation: The paper that established IGHMBP2 as the CMT2S gene, in 11 recessive families.
