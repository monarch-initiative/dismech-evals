              label: Charcot-Marie-Tooth disease axonal type 2S
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuromuscular Junction Denervation and Distal Muscle Atrophy
        description: 'Loss of motor axons denervates neuromuscular junctions, causing neurogenic distal
          muscle atrophy, weakness, foot deformity and gait impairment. In compound heterozygous Ighmbp2
          D564N/H922Y mice NMJ denervation and reduced fibre area are marked, whereas the CMT2S-like H922Y
          homozygote shows minimal NMJ changes even at six months; patient-derived neuromuscular co-cultures
          show high fatigue and chaotic tetanus that are rescued by restoring IGHMBP2.

          '
        biological_scale: TISSUE
        conforms_to: peripheral_axonal_degeneration#Length-Dependent Nerve Fiber Dysfunction
        biological_processes:
        - preferred_term: neuromuscular junction development
          term:
            id: GO:0007528
            label: neuromuscular junction development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Neuromuscular junction analyses revealed high fatigue and chaotic tetanus formulation
          in untreated patient cells. We demonstrate rescue of NMJ function following ASO treatment, captured
          by a reduction in fatigue and chaotic tetanus responses.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
