            term:
              id: MONDO:0014511
              label: Charcot-Marie-Tooth disease axonal type 2S
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic IGHMBP2 Variants
        description: 'CMT2S alleles reduce, but do not abolish, IGHMBP2 abundance and its ATP-dependent
          DNA/RNA helicase activity. Association with the activator ABT1 stimulates IGHMBP2 ATPase and
          helicase activity, and CMT2S variants such as p.His924Tyr retain ABT1 association and substantial
          activity, whereas SMARD1 variants such as p.Asp565Asn lose it; in compound heterozygotes the
          summed activity of the two mutant proteins predicts severity. This residual-activity threshold
          is the disorder-specific insult to peripheral neurons.

          '
        biological_scale: MOLECULAR
        conforms_to: peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells
        molecular_functions:
        - preferred_term: DNA/RNA helicase activity
          term:
            id: GO:0003678
            label: DNA helicase activity
          modifier: DECREASED
        - preferred_term: RNA helicase activity
          term:
            id: GO:0003724
            label: RNA helicase activity
          modifier: DECREASED
      selected_evidence:
        snippet: For the first time, we demonstrate a correlation between the altered IGHMBP2 biochemical
          activity associated with the D565N and H924Y mutations and disease severity and pathology in
          patients and our Ighmbp2 mouse models.
        supports: SUPPORT
