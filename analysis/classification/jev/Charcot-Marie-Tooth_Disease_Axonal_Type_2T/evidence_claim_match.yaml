      assertion_type: Genetic
      assertion:
        name: MME
        gene_term:
          preferred_term: MME
          term:
            id: hgnc:7154
            label: MME
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: MME encodes neprilysin, a membrane metallopeptidase with extracellular catalytic activity
          and multiple peptide substrates. Biallelic loss-of-function alleles establish recessive CMT2T;
          selected heterozygous variants confer incompletely penetrant neuropathy risk. RNA splicing and
          catalytic effects have been measured for particular alleles, while many truncation/NMD or structural
          effects remain predicted. Biallelic MME disease also includes a motor-predominant/dHMN spectrum,
          so sensory involvement is not obligatory. The 2024 Italian classifications describe 8 patients
          with pathogenic, 13 with likely pathogenic, 10 with uncertain and one with likely benign variants;
          these are patient counts, not 32 distinct variants. Diagnostic yield estimates derive from selected
          cohorts and do not establish an MME-first testing algorithm.
      selected_evidence:
        snippet: MME was most frequently involved and accounted for 34.8% of genetically solved cases.
        supports: SUPPORT
