        target: Length-Dependent Axonal Degeneration
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: The Japanese authors explicitly hypothesize axonal degeneration through impaired
          Schwann cell–axon interactions. Human axonal loss is established, while this intervening molecular
          route is provisional.
      selected_evidence:
        snippet: In our study, given that all patients with MME mutations showed late‐onset CMT, we believe
          that similar degeneration process may be present in both conditions by impairing Schwann cell–axonal
          interactions.
