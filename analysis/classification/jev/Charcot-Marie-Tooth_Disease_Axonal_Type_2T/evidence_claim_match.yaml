              label: Charcot-Marie-Tooth disease type 2T
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt2t_alloimmunisation_and_pharmacovigilance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What are the reproductive and pharmacological consequences of neprilysin deficiency, and
          should long-term neprilysin inhibition in heart failure carry neurological surveillance?
        attaches_to:
        - pathophysiology#Neprilysin Deficiency in Peripheral Nerve
        rationale: Maternal alloimmunization against neprilysin can cause membranous nephropathy in offspring
          of neprilysin-null women. The renal disease and neonatal deaths described in those pedigrees
          belong to the children and are not CMT2T maternal phenotypes. The source recommends family screening
          and long-term neurological vigilance during neprilysin-inhibitor therapy, while explicitly reporting
          no observed drug-associated adverse effect. These recommendations are not proof of treatment-induced
          neuropathy. The affected adults’ mild proteinuria in the Japanese cohort is a separate observation
          with unresolved attribution.
        proposed_experiments:
        - experiment_id: exp_cmt2t_neprilysin_inhibitor_neuropathy_surveillance
          name: Long-term neurological outcomes in patients on neprilysin inhibitors
          description: Follow a cohort on combined angiotensin-receptor and neprilysin inhibition with
            serial nerve conduction studies over a decade or more, against matched heart-failure patients
            on other regimens, to determine whether pharmacological neprilysin inhibition produces any
            measurable axonal effect.
      selected_evidence:
        snippet: Identification of MME-related Charcot-Marie-Tooth disease in families should lead to
          early screening of women predisposed to feto-maternal allo-immunization and renal complications
          in their offspring.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
