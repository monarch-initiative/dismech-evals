            term:
              id: MONDO:0044640
              label: Charcot-Marie-Tooth disease type 2T
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance with age-related incomplete penetrance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: Selected heterozygous MME loss-of-function and missense variants segregate with late-onset
          axonal neuropathy in an age-dependent, incompletely penetrant pattern. The 2020 study expanded
          the original 2016 cohort, including its 51 initial patients, and interpreted the heterozygous
          variants as dominantly inherited susceptibility alleles. The Spanish study found nonsegregation
          for tested heterozygous variants, including alternative genetic diagnoses in some families.
          These observations require variant- and family-specific counseling; a heterozygous MME finding
          alone does not establish causation. The 2024 Italian cohort included uncertain and likely benign
          findings, and its cross-sectional severity comparisons do not establish a longitudinal progression
          rate. A heterozygous parent has a 50% probability of transmitting that allele to each child;
          this transmission probability is distinct from the uncertain, age-dependent probability of neuropathy
          after inheriting it.
      selected_evidence:
        snippet: MME mutations segregated in an autosomal-dominant fashion with age-related incomplete
          penetrance and some affected individuals were isolated case subjects.
        supports: SUPPORT
