  ee5519673fe34c77767fd36802cd9e4cb4752addbf6465fcf305c385af802f9d:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth disease, axonal, type 2T
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease, axonal, type 2T
            term:
              id: MONDO:0044640
              label: Charcot-Marie-Tooth disease type 2T
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt2t_dominant_versus_recessive
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Are heterozygous MME variants a dominant cause of late-onset neuropathy with age-dependent
          penetrance, or a susceptibility factor that requires something else to produce disease?
        attaches_to:
        - pathophysiology#MME Loss-of-Function Variant
        - pathophysiology#Neprilysin Deficiency in Peripheral Nerve
        rationale: Biallelic pathogenic MME variants establish recessive neuropathy, while selected heterozygous
          variants segregate with disease and are enriched among late-onset neuropathy cohorts. The 2020
          study already framed the latter as dominantly inherited susceptibility and partly reused the
          2016 cohort. The Spanish series showed nonsegregation for tested heterozygous variants, with
          an alternative AIFM1 diagnosis for neuropathy/deafness and a pathogenic SOD1 variant in an ALS
          family. These findings are not evidence that every heterozygous allele causes disease. The 2024
          Italian cohort contained 13 biallelic, 18 monoallelic and one unphased case, including ten VUS
          and one likely benign classification. Its Results describe the greater severity after ten years
          as not statistically significant because of an outlier, whereas the Discussion calls it significant;
          this cross-sectional contrast cannot establish an individual longitudinal progression rate.
          Age- and population-specific penetrance, modifying factors and variant-specific mechanisms remain
          unresolved.
        proposed_experiments:
        - experiment_id: exp_cmt2t_carrier_penetrance_cohort
          name: Age-stratified penetrance in unselected heterozygous carriers
          description: Ascertain heterozygous MME loss-of-function carriers from population biobanks rather
            than from neuropathy clinics, and measure the age-specific prevalence of clinical and electrophysiological
            neuropathy against matched non-carriers. Clinic ascertainment cannot distinguish incomplete
            penetrance from susceptibility; population ascertainment can.
        - experiment_id: exp_cmt2t_neprilysin_activity_vs_phenotype
          name: Enzymatic activity as a quantitative predictor across zygosities
          description: Measure blood and, where available, nerve neprilysin activity across monoallelic
            and biallelic carriers and relate it to onset age and progression rate. If a dosage model
            holds, activity should predict phenotype continuously across zygosity rather than in two discrete
            groups.
      selected_evidence:
        snippet: Transmission of MME variants was often consistent with an incompletely penetrant autosomal-dominant
          trait and less frequently with autosomal-recessive inheritance.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33144514
      reference_title: 'The genetic landscape of axonal neuropathies in the middle-aged and elderly: Focus
        on MME.'
      evidence_source: HUMAN_CLINICAL
      explanation: The expanded cohort supports incompletely penetrant transmission; 51 patients overlapped
        with the original 2016 screening series.
