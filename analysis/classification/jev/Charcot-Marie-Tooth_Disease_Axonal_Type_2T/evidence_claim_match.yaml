        context: []
      assertion_type: Diagnosis
      assertion:
        name: MME Sequencing in Unexplained Late-Onset Axonal Neuropathy
        description: MME analysis can identify the cause of otherwise unexplained late-onset axonal neuropathy,
          including cases without a clear family history. The 2020 study used both WES and targeted testing.
          Test selection and interpretation require the differential diagnosis, variant classification
          and segregation; its diagnostic yield alone does not establish a universal MME-first algorithm.
          GeneReviews supports detailed family history and molecular genetic testing to identify the specific
          cause within the broader CMT differential.
      selected_evidence:
        snippet: We recruited patients, collected clinical data, and conducted whole-exome sequencing
          (WES; n = 126) and MME single-gene sequencing (n = 104).
        supports: SUPPORT
