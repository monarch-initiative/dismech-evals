      assertion_type: Diagnosis
      assertion:
        name: Nerve Conduction Studies
        description: Nerve-conduction studies and EMG characterize axonal motor/sensory dysfunction and
          denervation. Reduced response amplitudes with relatively preserved velocities are typical, but
          some CMT2T nerves have intermediate or demyelinating-range velocities. Such values do not automatically
          point away from MME disease; the full clinical, electrophysiological and genetic picture is
          required.
      selected_evidence:
        snippet: We observe a relatively mild axonal sensory-motor neuropathy with a greater impairment
          of the lower extremities.
        supports: SUPPORT
