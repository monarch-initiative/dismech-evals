        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Dementia
        prompt: Does neprilysin deficiency alter late-life dementia risk in CMT2T?
        rationale: One biallelic Spanish patient had Alzheimer dementia beginning at 67, but a patient
          with the same homozygous variant had no cognitive impairment. Negative cohort screening and
          single-patient PET observations do not establish lifetime absence. Neither a specific MME-mediated
          brain lesion nor excess age-adjusted dementia risk is demonstrated, so no causal edge is asserted.
          The Spanish dementia patient also had extensive diffuse white-matter damage; that table wording
          does not establish the multifocal hyperintensity pattern described in Iranian VI.4.
      selected_evidence:
        snippet: Contrary to our expectation, neuropsychological testing revealed no obvious cognitive
          deficits in 9 patients evaluated by MMSE scores.
        supports: SUPPORT
