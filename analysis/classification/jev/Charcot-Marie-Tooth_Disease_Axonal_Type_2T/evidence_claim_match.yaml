        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which endogenous substrates and glial or axonal processes explain variable age-dependent
          neuropathy after neprilysin deficiency?
        attaches_to:
        - pathophysiology#Proposed Disruption of Schwann Cell–Axon Signaling
        rationale: Human genotype/nerve-protein evidence establishes an etiological link to neuropathy,
          and the authors explicitly propose impaired Schwann cell–axon interactions. The relevant substrates
          and intervening molecular pathway are not established. Peptide turnover and nociceptive signaling
          remain candidates. Normal young-mouse repair after sciatic crush does not exclude every chronic
          support mechanism in humans. Negative amyloid PET in one Japanese patient and absent deposits
          in selected peripheral tissues do not exclude future dementia or every amyloid-related pathway;
          one biallelic Spanish patient developed late-life Alzheimer dementia. Onset varies substantially
          rather than invariably taking five decades.
        proposed_experiments:
        - experiment_id: exp_cmt2t_nerve_peptidomics
          name: Peptidomic profiling of neprilysin-deficient peripheral nerve
          description: Compare the peptidome of sural nerve from genotyped CMT2T patients against age-matched
            controls, and of sciatic nerve from aged MME-null mice against wild type, to identify substrates
            that accumulate in the affected compartment rather than inferring from the known substrate
            list.
        - experiment_id: exp_cmt2t_long_axon_model
          name: A model with axons long enough to fail
          description: The mouse does not develop the disease and its axons are an order of magnitude
            shorter than a human's. Test whether neprilysin loss injures long axons specifically, using
            human induced-pluripotent-stem-cell-derived sensory neurons in microfluidic long-axon culture
            with MME knocked out, with distal axon integrity as the readout.
      selected_evidence:
        snippet: In our study, given that all patients with MME mutations showed late‐onset CMT, we believe
          that similar degeneration process may be present in both conditions by impairing Schwann cell–axonal
          interactions.
        supports: SUPPORT
        directness: INDIRECT
