            description: Loss of neprilysin-mediated peptide processing is proposed to disturb support
              of peripheral axons by Schwann cells. Neprilysin localization in peripheral myelin and the
              human nerve lesions motivate this hypothesis, but no endogenous substrate has been shown
              to accumulate to a pathogenic concentration in CMT2T nerve. Young knockout mice repair a
              sciatic crush normally, limiting a simple universal remyelination-defect model; this result
              does not exclude all chronic human axon-support mechanisms.
            biological_scale: CELLULAR
            role: effector
            mechanism_confidence: HYPOTHETICAL
