        name: Chronic inflammatory demyelinating polyneuropathy
        description: CIDP is both a differential and, in at least one patient, a comorbidity. A genotyped
          CMT2T patient developed demyelinating electrophysiology and an inflammatory biopsy and responded
          to immunoglobulin. So a demyelinating feature in a patient with a confirmed MME genotype does
          not exclude CIDP - it may indicate a treatable second process superimposed on the genetic one.
