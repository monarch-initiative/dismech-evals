          endoneurial edema, thinly myelinated fibers and a prompt clinical and electrophysiological response
          to immunoglobulin. The authors hypothesize that neprilysin-related myelin fragility predisposed
          to an immune response. Genetic predisposition is unproved, and other MME patients misdiagnosed
          with CIDP did not improve with immunomodulation.
