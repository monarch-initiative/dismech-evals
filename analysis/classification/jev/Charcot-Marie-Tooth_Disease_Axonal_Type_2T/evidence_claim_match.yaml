  6c092e0ce37e167643637f60fbdef67945fc15ac559d2004d42c75159272ad9b:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth disease, axonal, type 2T
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease, axonal, type 2T
            term:
              id: MONDO:0044640
              label: Charcot-Marie-Tooth disease type 2T
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt2t_age_and_spectrum
        kind: INTERPRETATION
        prompt: How should clinical timing, allelic presentations and cohort scope be interpreted?
        rationale: 'Adult onset is typical but variable: symptomatic individuals in the 2021 family follow-up
          began between 30 and 43 years, while one 41-year-old carrier had subclinical findings. Spanish
          biallelic onset ranged from 35 to 73 years. The 2019 and 2024 Chinese reports describe a motor-predominant/dHMN
          allelic spectrum; the 2019 series includes onset at 16, so its abstract’s late-onset summary
          is not universal. Isolated finger contracture and hand tremor in those dHMN cases and a Babinski
          sign in the 2024 motor-predominant proband are not transferred automatically to the sensorimotor
          CMT2T annotation set. General wording about frequent muscle contractures in the Spanish report
          does not establish fixed joint contractures. The 2026 Iranian cohort reports a second DNA2 likely-pathogenic
          variant with rimmed-vacuole myopathic pathology in one case; that myopathy is not assigned to
          MME. Somatic or allelic non-neuropathy associations are not phenotype evidence for CMT2T. The
          Italian table separately labels age-associated, immune, vascular and neoplastic diagnoses as
          comorbidities; their occurrence does not establish MME manifestations. Fatigue in one biallelic
          patient is a nonspecific accompanying report and is not used as evidence for the distinct exercise-intolerance
          term.'
      selected_evidence:
        snippet: Up to now, she has no significant neurologic symptom. Clinical examination showed only
          a mild sensory impairment (25% of errors in pinprick-touch discrimination on feet and left ankle
          reflex abolishment).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/6
      evidence_path: /discussions/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
