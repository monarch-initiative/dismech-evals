        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'Biallelic pathogenic MME variants cause the defining recessive CMT2T phenotype.
          The original Japanese series contained ten affected patients, and segregation was confirmed
          in independent Spanish and Iranian families. Clinical expression is age dependent: the 2021
          family follow-up included a 41-year-old biallelic woman with no significant neurological symptoms
          but sensory examination and nerve-conduction abnormalities. Complete symptomatic penetrance
          at every age is therefore not asserted. Counseling requires identifying the familial variants
          before predictive or reproductive testing. For two heterozygous parents, Mendelian segregation
          gives a one-in-four probability of a biallelic genotype at each conception; timing and severity
          of expression remain age and allele dependent. The general overview’s asymptomatic-carrier assumption
          is not applied to all MME alleles.'
      selected_evidence:
        snippet: We identified recessive mutations in MME in 10 patients.
        supports: SUPPORT
