            term:
              id: MONDO:0014736
              label: Charcot-Marie-Tooth disease axonal type 2Z
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: MORC2-mutant iPSC-derived motor neurons
        experimental_model_type: IPSC_DERIVED_MODEL
        description: Human iPSC-derived motor neurons carrying three MORC2 alleles spanning the clinical
          spectrum — p.Ser87Leu from the SMA-like end, p.Gln400Arg and p.Asp466Asn from the CMT2Z end.
          Having all three in one system is what makes the severity ordering interpretable rather than
          anecdotal.
        publication: PMID:41548771
        modeled_mechanisms:
        - target: Axonal Degeneration
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Human motor neurons carrying patient alleles develop the axonal pathology directly,
            and the severity ordering matches the clinical ordering.
          limitations: Cultured neurons have no target muscle, no Schwann cells and no length dimension,
            so a length-dependent neuropathy cannot be modelled as such. The readouts are neurite measurements
            over weeks against a human disease that progresses over decades.
          readouts:
          - name: Neurite length and axonal swelling count
            target: Axonal Degeneration
            direction: DECREASED
            interpretation: Shortened neurites with increased breakage and swellings, worst in the allele
              with the worst clinical phenotype.
        - target: Impaired PARP1-Dependent DNA Repair
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Inhibiting PAR degradation restored PAR levels, reduced DNA damage and improved
            axonal pathology in p.Ser87Leu neurons, which is a rescue rather than a description.
          limitations: Rescue was shown for one allele in cell culture. There is no animal efficacy data
            and no pharmacokinetic work, so this is a mechanistic demonstration, not a preclinical package.
          readouts:
          - name: Cellular PAR level
            target: Impaired PARP1-Dependent DNA Repair
            direction: RESTORED
            interpretation: PAR restoration is the proximate pharmacodynamic effect through which the
              axonal improvement is proposed to act.
      selected_evidence:
        snippet: we used iPSC-derived motor neurons (iPSC-MNs) carrying three distinct MORC2 mutations,
          p.S87L (SMA-like), p.Q400R, and p.D466N (CMT2Z), to examine their effects on cellular processes
        supports: SUPPORT
    origin:
