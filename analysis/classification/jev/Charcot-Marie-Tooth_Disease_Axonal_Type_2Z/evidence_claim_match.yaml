            term:
              id: MONDO:0014736
              label: Charcot-Marie-Tooth disease axonal type 2Z
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neuronal Transcriptional Dysregulation
        biological_scale: CELLULAR
        description: 'Mutant MORC2 changes gene expression in patient fibroblasts and in neurons, and
          the magnitude of that change tracks clinical severity: the p.Ser87Leu allele, associated with
          the most severe phenotype, produced more pronounced transcriptional change and abnormal axonal
          morphology than p.Arg252Trp in the same experimental system. MORC2 is highly expressed in human
          embryonic and adult neural tissue and its murine orthologue is developmentally regulated, which
          is the proposed reason a ubiquitously expressed chromatin gene produces a neuron-selective disease.'
        cell_types:
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
      selected_evidence:
        snippet: We show that the full-length form of MORC2 is highly expressed in both embryonic and
          adult human neural tissues and that Morc2 expression is dynamically regulated in both the developing
          and the maturing murine nervous system.
        supports: SUPPORT
