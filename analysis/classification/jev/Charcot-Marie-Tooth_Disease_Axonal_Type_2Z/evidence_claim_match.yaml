    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Axonal Type 2Z
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease axonal type 2Z
            term:
              id: MONDO:0014736
              label: Charcot-Marie-Tooth disease axonal type 2Z
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: MORC2-mutant iPSC-derived motor neurons
        experimental_model_type: IPSC_DERIVED_MODEL
        description: Human iPSC-derived motor neurons carrying p.Ser87Leu, associated with an SMA-like
          phenotype, and p.Gln400Arg or p.Asp466Asn, associated with CMT2Z, permit comparison of cellular
          effects across the MORC2 spectrum.
        publication: PMID:41548771
        modeled_mechanisms:
        - target: Axonal Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Patient-variant human motor neurons reproduce axonal abnormalities in culture;
            the p.Ser87Leu line was most severely affected among the variants tested.
          limitations: Cultured motor neurons do not reproduce an intact motor unit, peripheral nerve
            environment or decades of length-dependent disease progression. The readouts measure neurite
            pathology in vitro.
          readouts:
          - name: Neurite length
            target: Axonal Degeneration
            direction: DECREASED
            interpretation: Neurites were shorter in variant-bearing iPSC-derived motor neurons.
          - name: Axonal breakage and swelling
            target: Axonal Degeneration
            direction: INCREASED
            interpretation: Axonal breaks and swellings increased, with the strongest abnormalities in
              p.Ser87Leu neurons.
        - target: Impaired PARP1-Dependent DNA Repair
          relationship: RESCUES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Inhibiting PAR degradation restored PAR levels, reduced DNA damage and improved
            axonal pathology in p.Ser87Leu neurons, which is a rescue rather than a description.
          limitations: The cited rescue was shown in p.Ser87Leu cell culture. Clinical benefit, pharmacokinetics
            and in vivo efficacy of this PAR-restoring intervention were not established in this report.
          readouts:
          - name: Cellular PAR level
            target: Impaired PARP1-Dependent DNA Repair
            direction: RESTORED
            interpretation: PAR restoration is the proximate pharmacodynamic effect through which the
              axonal improvement is proposed to act.
      selected_evidence:
        snippet: we used iPSC-derived motor neurons (iPSC-MNs) carrying three distinct MORC2 mutations,
          p.S87L (SMA-like), p.Q400R, and p.D466N (CMT2Z), to examine their effects on cellular processes
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
      evidence_path: /experimental_models/0/evidence/0
      context_paths:
