          term:
            id: CL:0000100
            label: motor neuron
      selected_evidence:
        snippet: Mechanistically, these mutations impair DNA repair by disrupting the interaction between
          MORC2 and PARP1, leading to reduced PARP1 activity and expression, as well as diminished DNA
          repair protein expression and recruitment.
        supports: SUPPORT
