  203d9b5bcdaabf9ce776430046675b54ce9e8a75922e7c7249e611b7e91dcfd0:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Axonal Type 2Z
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease axonal type 2Z
            term:
              id: MONDO:0014736
              label: Charcot-Marie-Tooth disease axonal type 2Z
        context: []
      assertion_type: Genetic
      assertion:
        name: MORC2
        gene_term:
          preferred_term: MORC2
          term:
            id: hgnc:23573
            label: MORC2
        relationship_type: CAUSATIVE
        notes: CMT2Z is associated primarily with heterozygous missense variants in MORC2. Functional
          effects differ by allele and assay; increased HUSH repression is established for p.Arg252Trp
          but is not a universal molecular consequence. p.Arg252Trp and p.Arg190Trp are the same recurrent
          variant numbered using protein isoforms differing by 62 N-terminal amino acids. Quantitative
          penetrance has not been established by the cited small pedigrees and referral cohorts.
        variants:
        - name: p.Arg252Trp (p.Arg190Trp in the shorter isoform)
          description: Recurrent CMT2Z variant that hyperactivates HUSH-mediated repression in neuronal
            cell models. Early distal weakness and sensory loss can progress proximally. The same variant
            was reported as p.Arg190Trp in eight unrelated Japanese families using the shorter protein
            isoform.
        - name: p.Ser87Leu
          description: Associated with severe early-onset neuropathy with SMA-like features. It produced
            greater transcriptional changes and axonal abnormalities than p.Arg252Trp in the compared
            neuronal-expression system, and the most severe pathology among the variants tested in the
            cited iPSC motor-neuron study.
        - name: p.Ala406Val
          description: Reported in three individuals from two families with severe neuropathy progressing
            from distal to proximal weakness.
        - name: p.Gly444Arg and p.His446Gln
          description: p.Gly444Arg segregated in a family with adult-onset sensorimotor CMT, while p.His446Gln
            was found in a separate patient with adult pure motor neuropathy. Overexpression assays supported
            deleterious effects of both variants, alongside the clinical evidence; the pure motor presentation
            is an allelic comparison rather than a CMT2Z subtype.
        - name: p.Ala12Pro and p.Arg283His
          description: A 2026 Chinese family study classified both variants as likely pathogenic, reporting
            p.Ala12Pro protein instability and reduced p.Arg283His transcript abundance in transfected
            HEK293T cells. p.Arg283His failed segregation in an earlier family, so the newer segregating
            family and functional results should be considered alongside that conflicting evidence.
        case_fractions:
        - population: Japanese CMT type 2 diagnostic cohort
          case_fraction_percent: 2.7
          notes: Share of CMT type 2 patients attributable to MORC2 in a Japanese diagnostic series, where
            MORC2 ranked second after MFN2. The series screened 781 unrelated CMT patients of all types;
            the CMT2 subset that is the actual denominator for this percentage is not separately stated,
            so cohort_size is left empty rather than given as 781. The Spanish national collection describes
            MORC2 as a rare cause of CMT without reporting a comparable fraction, so this figure should
            not be read as generalising beyond Japan.
      selected_evidence:
        snippet: p.Arg190Trp, as a mutational hotspot, was observed in eight unrelated families.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
