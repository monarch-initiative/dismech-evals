      assertion:
        name: Reduced ATP Hydrolysis in p.Arg252Trp MORC2
        biological_scale: MOLECULAR
        description: Purified MORC2(1–603) carrying the CMT2Z p.Arg252Trp variant has modestly reduced
          ATP hydrolysis. Structural analysis proposes disruption of the regulatory ATPase–CW interface,
          with altered dimer dynamics explaining increased cellular silencing despite reduced hydrolysis.
          The molecular-function decrease is specific to this tested allele and construct.
        genes:
        - preferred_term: MORC2
          term:
            id: hgnc:23573
            label: MORC2
        molecular_functions:
        - preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          modifier: DECREASED
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
        notes: Across the wider MORC2 spectrum, p.Ser87Leu stabilizes ATP-bound dimers and lowers ATPase
          activity, whereas the SMA-associated p.Thr424Arg variant increases ATP hydrolysis and reduces
          reporter repression. These comparisons preclude generalizing a single functional direction to
          all alleles.
      selected_evidence:
        snippet: The R252W MORC2 variant hyperactivates HUSH-mediated transgene silencing4, but has reduced
          ATPase activity in vitro.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
