          cells. MORC2 is recruited by HUSH to support chromatin compaction; SETDB1 deposits H3K9me3.
          This measured gain in cellular silencing does not mean that MORC2 ATP hydrolysis is increased,
          and it is not established for every MORC2 variant.
        biological_processes:
        - preferred_term: chromatin remodeling
          modifier: INCREASED
          term:
            id: GO:0006338
            label: chromatin remodeling
        - preferred_term: heterochromatin formation
          modifier: INCREASED
          term:
            id: GO:0031507
            label: heterochromatin formation
        cellular_components:
        - preferred_term: heterochromatin
          term:
            id: GO:0000792
            label: heterochromatin
      selected_evidence:
        snippet: The ATPase activity of MORC2 is critical for HUSH-mediated silencing, and the most common
          alteration affecting the ATPase domain in CMT patients (p.Arg252Trp) hyperactivates HUSH-mediated
          repression in neuronal cells.
        supports: SUPPORT
