            term:
              id: MONDO:0014736
              label: Charcot-Marie-Tooth disease axonal type 2Z
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MORC2 Variant Dysregulation of HUSH Silencing
        biological_scale: MOLECULAR
        description: MORC2 is the ATPase recruited by the HUSH complex to H3K9me3-marked heterochromatin,
          where its ATPase activity is required for silencing. CMT2Z alleles are not nulls. The most common
          ATPase-domain variant, p.Arg252Trp, hyperactivates HUSH-mediated repression in neuronal cells,
          and the ATPase module variants that cause the developmental syndrome do the same. So the disease
          mechanism is gain of silencing, not loss of it — which is the opposite of what a loss-of-function
          reading of a chromatin gene would predict, and matters because it changes what a therapeutic
          strategy would have to do.
        biological_processes:
        - preferred_term: chromatin remodeling
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0006338
            label: chromatin remodeling
        - preferred_term: heterochromatin formation
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0031507
            label: heterochromatin formation
        cellular_components:
        - preferred_term: heterochromatin
          term:
            id: GO:0000792
            label: heterochromatin
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: we identified MORC2 as an essential gene required for epigenetic silencing by the HUSH
          complex
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28581500
      reference_title: Hyperactivation of HUSH complex function by Charcot-Marie-Tooth disease mutation
        in MORC2.
      evidence_source: IN_VITRO
      explanation: Establishes MORC2's normal function, which is what the disease alleles distort.
