  491e73bdb242d6b6d39e37954d05787580a73c9d3ea81a5d9d05a2535cf20c6d:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Axonal Type 2Z
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease axonal type 2Z
            term:
              id: MONDO:0014736
              label: Charcot-Marie-Tooth disease axonal type 2Z
        context: []
      assertion_type: Genetic
      assertion:
        name: MORC2
        gene_term:
          preferred_term: MORC2
          term:
            id: hgnc:23573
            label: MORC2
        relationship_type: CAUSATIVE
        notes: 'MORC2 (22q12.2) encodes a microrchidia-family CW-type zinc finger ATPase that acts as
          the effector of the HUSH complex and also participates in double-strand break repair. More than
          twenty pathogenic variants are reported. They cluster in the ATPase module and act by hyperactivating
          HUSH-mediated silencing rather than by abolishing MORC2 function.

          The commonest allele is population-dependent, which is worth knowing before reading any single
          cohort''s genotype table: p.Arg252Trp is described as the most common variant in the Spanish
          and US literature, while the Japanese series found p.Arg190Trp as a hotspot in eight of thirteen
          unrelated families. Those are different residues, and treating either as "the" common allele
          would mislead.'
        variants:
        - name: p.Arg252Trp
          description: The most frequently reported allele in the European and US literature, and the
            most common ATPase-domain alteration. Hyperactivates HUSH-mediated repression in neuronal
            cells. Onset of distal weakness and sensory loss in the first or second decade.
        - name: p.Arg190Trp
          description: A mutational hotspot in the Japanese series, present in eight unrelated families,
            and the commonest allele in that population.
        - name: p.Ser87Leu
          description: Associated with the most severe end of the spectrum, an infantile spinal muscular
            atrophy-like presentation. In cell models it produces the largest transcriptional change and
            the worst axonal pathology of the alleles tested, so the severity ordering is reproduced in
            vitro.
        - name: p.Ala406Val
          description: Reported in three individuals from two families with severe neuropathy progressing
            from distal to proximal weakness.
        - name: p.Gly444Arg and p.His446Gln
          description: Two variants established as pathogenic by a cell-based survival and apoptosis assay
            developed for variants of uncertain significance, associated respectively with dominant CMT
            and with adult late-onset proximal motor neuropathy.
        case_fractions:
        - population: Japanese CMT type 2 diagnostic cohort
          case_fraction_percent: 2.7
          notes: Share of CMT type 2 patients attributable to MORC2 in a Japanese diagnostic series, where
            MORC2 ranked second after MFN2. The series screened 781 unrelated CMT patients of all types;
            the CMT2 subset that is the actual denominator for this percentage is not separately stated,
            so cohort_size is left empty rather than given as 781. The Spanish national collection describes
            MORC2 as a rare cause of CMT without reporting a comparable fraction, so this figure should
            not be read as generalising beyond Japan.
      selected_evidence:
        snippet: p.Arg190Trp, as a mutational hotspot, was observed in eight unrelated families.
        supports: SUPPORT
