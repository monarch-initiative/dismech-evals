      assertion_type: Pathophysiology
      assertion:
        name: Impaired PARP1-Dependent DNA Repair
        biological_scale: CELLULAR
        description: 'MORC2 relaxes chromatin to facilitate double-strand break repair. In iPSC-derived
          motor neurons carrying three different MORC2 alleles, the mutants disrupt the MORC2-PARP1 interaction,
          reducing PARP1 activity and expression and the recruitment of downstream repair proteins, with
          accumulating DNA damage and apoptosis. This branch is a second, more recent account of how a
          chromatin gene kills axons, and it comes with a candidate intervention: blocking PAR degradation
          restored PAR levels and improved axonal pathology in the p.Ser87Leu neurons.'
        biological_processes:
        - preferred_term: double-strand break repair
          modifier: DECREASED
          term:
