          series states explicitly that none of its patients had extensor plantar responses or spasticity,
          so the sign is curated with both the claim and its contradiction rather than as a uniform feature.
          Note this is the same population-dependence the entry records for the p.Arg252Trp and p.Arg190Trp
          hotspots, appearing on the clinical axis.
