      assertion_type: AnimalModel
      assertion:
        name: Morc2a S87L heterozygous mouse
        species: Mouse
        genotype: Morc2a S87L/+ (knock-in, heterozygous)
        publication: PMID:42656289
        description: A knock-in carrying the mouse equivalent of a patient allele. It reproduces the peripheral
          neuropathy and, unusually for a CMT model, also the central features — cerebellar ataxia and
          motor neuron degeneration — which is the part that bears on this entry's central nervous system
          node.
        modeled_mechanisms:
        - target: Axonal Degeneration
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Axonal neuropathy with motor and sensory involvement and skeletal muscle weakness,
            which is the human presentation.
          limitations: S87L is not among the alleles that dominate the human literature, where p.Arg252Trp
            and p.Arg190Trp are the hotspots, so allele-specific effects are not addressed by this model.
        - target: Central Nervous System Involvement
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: The mouse shows cerebellar ataxia and motor neuron degeneration. The human central
            phenotype in CMT2Z is cognitive impairment in about a third of patients, and the Spanish series
            reports no cerebellar findings at all, so the model's central involvement is not the same
            central involvement.
          limitations: Cerebellar ataxia is not a reported CMT2Z feature in the human series that looked
            for it. Treating this as a model of the human central phenotype would assert a correspondence
            the clinical literature contradicts.
      selected_evidence:
        snippet: Notably, Morc2a mRNA and Morc2a protein expression in the quadriceps muscle and cerebellum
          were consistently decreased in Morc2a S87L/+ mice compared to wild-type mice
        supports: SUPPORT
