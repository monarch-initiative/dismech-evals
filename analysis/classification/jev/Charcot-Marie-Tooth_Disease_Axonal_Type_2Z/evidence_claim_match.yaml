      reference_title: Clinical and mutational spectrum of Charcot-Marie-Tooth disease type 2Z caused
        by MORC2 variants in Japan.
      evidence_source: HUMAN_CLINICAL
      explanation: The recurrent variant in the Japanese series, reported using the shorter isoform's
        p.Arg190Trp numbering rather than p.Arg252Trp.
