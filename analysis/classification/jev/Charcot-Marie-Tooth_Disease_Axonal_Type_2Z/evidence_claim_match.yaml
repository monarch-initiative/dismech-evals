        experimental_model_type: CELL_LINE
        description: 'A variant-classification system rather than a disease model: wild-type or mutant
          MORC2 is overexpressed and survival, apoptosis and neurite outgrowth are quantified over time,
          to separate pathogenic alleles from polymorphisms.'
        publication: PMID:35904125
        modeled_mechanisms:
        - target: MORC2 Variant Dysregulation of HUSH Silencing
          relationship: MEASURES
          fidelity: LOW
          model_scale: CELLULAR
          description: Scores the cellular toxicity of a MORC2 allele as a proxy for its pathogenicity.
          limitations: Overexpression is not the heterozygous dose patients carry, and a cortical neuron
            is not a peripheral sensory or motor neuron. The readout is apoptosis, which is downstream
            of, and not specific to, the HUSH mechanism the node names.
      selected_evidence:
        snippet: Likewise, we show that MORC2 mutants affect survival and trigger apoptosis over time
          in SH-EP cell line. Furthermore, overexpression in primary cortical neurons increases apoptotic
          cell death and decreases neurite outgrowth.
        supports: SUPPORT
