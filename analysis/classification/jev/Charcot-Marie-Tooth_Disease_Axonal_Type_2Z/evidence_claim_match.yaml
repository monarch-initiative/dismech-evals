        description: MORC2 variants alter gene expression through HUSH-dependent repression and promoter
          DNA hypermethylation. p.Arg252Trp and p.Ser87Leu alter transcription in patient fibroblasts
          and rodent sensory-neuron expression models. Separately, fibroblast profiling across the MORC2
          spectrum identified reduced ERCC8, NDUFAF2 and FKTN transcripts. These named target changes
          were measured in fibroblasts; their contribution to peripheral-neuron pathology is not established.
