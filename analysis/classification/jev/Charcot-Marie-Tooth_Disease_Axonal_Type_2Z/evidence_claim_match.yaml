        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        notes: NDUFAF2 protein reduction and respiratory-chain changes were demonstrated in the broader
          MORC2 cohort. One CMT fibroblast line had respiration intermediate between a Leigh-syndrome
          line and control; this does not establish the same target-gene defect in every CMT2Z patient
          or tissue.
      selected_evidence:
        snippet: These changes were more pronounced and accompanied by abnormal axonal morphology, in
          neurons expressing the MORC2 p.S87L mutation, which is associated with a more severe clinical
          phenotype.
        supports: SUPPORT
