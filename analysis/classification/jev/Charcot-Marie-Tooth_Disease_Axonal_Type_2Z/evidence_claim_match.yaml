        name: Distal muscle weakness
        description: 'Length-dependent distal weakness is the core presentation, progressing proximally
          over years to decades. In the Spanish cohort a scapuloperoneal, asymmetric pattern with early
          proximal upper-limb involvement was more common than the classic length-dependent one.

          The VERY_FREQUENT band here rests on this feature being definitional rather than on a published
          fraction. No source reports a distal-weakness denominator for CMT2Z, because distal weakness
          is how a patient is ascertained as having an axonal CMT in the first place — every reported
          patient has it by construction. Distal amyotrophy, by contrast, is graded FREQUENT: it is neither
          definitional nor given a denominator in any located source.'
        phenotype_term:
          preferred_term: Distal muscle weakness
          term:
            id: HP:0002460
            label: Distal muscle weakness
        frequency: VERY_FREQUENT
      selected_evidence:
        snippet: The neuropathy began in childhood to early adulthood, with distal weakness progressing
          to proximal weakness.
        supports: SUPPORT
