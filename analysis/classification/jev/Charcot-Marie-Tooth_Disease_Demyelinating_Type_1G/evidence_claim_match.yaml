        name: PMP2 Variant Altering P2 Lipid Handling
        biological_scale: MOLECULAR
        description: The initiating lesion. Heterozygous PMP2 variants sit in or beside the fatty-acid-binding
          cavity of the P2 beta-barrel. Structural work across three variants found only minor changes
          to the fold and to solution structure, but reduced thermal stability and altered fatty acid
          binding - so the protein is made and folded, and what changes is what it binds.
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: UNKNOWN
        genes:
        - preferred_term: PMP2
          term:
            id: hgnc:9117
            label: PMP2
        molecular_functions:
        - preferred_term: fatty acid binding
          modifier: DYSREGULATED
          term:
            id: GO:0005504
            label: fatty acid binding
      selected_evidence:
        snippet: The crystal and solution structures of the I50del, M114T and V115A variants of P2 showed
          minor differences to the wild-type protein, whereas their thermal stability was reduced.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34138518
      reference_title: 'Human myelin protein P2: from crystallography to time-lapse membrane imaging and
        neuropathy-associated variants.'
      evidence_source: IN_VITRO
      explanation: Establishes that the variants do not grossly misfold - the barrel is intact and only
        its stability is reduced, which is why the mechanism is modelled as altered ligand handling rather
