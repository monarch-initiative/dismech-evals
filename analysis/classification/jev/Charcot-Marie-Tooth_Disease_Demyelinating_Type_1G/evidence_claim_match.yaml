              label: Charcot-Marie-Tooth disease, demyelinating, type 1G
        context: []
      assertion_type: Genetic
      assertion:
        name: PMP2
        gene_term:
          preferred_term: PMP2
          term:
            id: hgnc:9117
            label: PMP2
        relationship_type: CAUSATIVE
        notes: Heterozygous missense and small in-frame deletion alleles. Reported variants include p.Ile43Asn,
          p.Thr51Pro, p.Ile52Thr, p.Ile50del, p.Met114Thr and p.Val115Ala. The first four cluster in the
          lipid-binding cavity of the beta-barrel, and p.Ile50del is recurrent across unrelated families.
          No truncating or whole-gene-deletion allele has been reported, which is consistent with a mechanism
          that needs an expressed protein rather than simple haploinsufficiency.
      selected_evidence:
        snippet: In this study, we identified p.I43N mutation in PMP2 from a family exhibiting autosomal
          dominant demyelinating CMT neuropathy by whole exome sequencing and characterized the clinical
          features.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26828946
      reference_title: A Mutation in PMP2 Causes Dominant Demyelinating Charcot-Marie-Tooth Neuropathy.
      evidence_source: HUMAN_CLINICAL
      explanation: The first report establishing PMP2 as a CMT1 gene, and the source of the p.I43N allele.
