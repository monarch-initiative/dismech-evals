        description: Loss of PMP2 does not reproduce the human demyelinating phenotype. Whatever the human
          alleles do, abolishing the protein is not it.
        limitations: 'A mouse null is not the human genotype: every reported human allele is a heterozygous
          missense or in-frame deletion, so the model tests a genetic situation no patient has. Mouse
          peripheral myelin may also tolerate loss of P2 better than human myelin does - the two species''
          myelin protein stoichiometries differ - so a null being near-normal in mouse does not establish
          that a human null would be. The finding constrains the mechanism; it does not settle it.'
      selected_evidence:
        snippet: a knockout mouse model for PMP2 was generated; however, there was no typical phenotype
          of peripheral neuropathy except for a slight reduction in the nerve conduction velocity
