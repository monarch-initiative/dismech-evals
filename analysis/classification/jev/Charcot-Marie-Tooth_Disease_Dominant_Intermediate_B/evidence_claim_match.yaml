              label: Charcot-Marie-Tooth disease dominant intermediate B
        context:
        - path: /animal_models/1
          value:
            name: Dnm2 K562E/+ knock-in mouse and the CNM/CMT compound cross
            species: Mouse
            genotype: Dnm2 K562E/+ (CMT); crossed with Dnm2 S619L/+ (CNM) to give Dnm2 S619L/K562E
            publication: PMID:40393994
            description: A genetic test of the opposite-directions hypothesis. If CNM variants raise dynamin-2
              activity and CMT variants lower it, then combining them in one animal should move activity
              back toward normal - and it does. The compound heterozygote has improved motor coordination,
              strength and mass over either single mutant, with normalized muscle structure and nerve
              fibre organization.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced Dynamin-2 Membrane Fission Activity
        relationship: RESCUES
        fidelity: MODERATE
        description: 'The node the cross literally rescues. Adding a CNM allele restores the CMT mutant''s
          lipid binding to wild-type level in vitro, which is the strongest available support for the
          loss-of-function direction assigned to the CMT variant: the rescue only makes sense if the two
          alleles push dynamin-2 activity opposite ways.'
        limitations: The rescue is genetic, not therapeutic - it requires carrying a second disease-causing
          allele, so it demonstrates the direction of the defect rather than offering a treatment. The
          binding readout is a recombinant-protein liposome assay, so it establishes the biochemical direction
          rather than restored fission in a patient's Schwann cells.
        readouts:
        - name: Recombinant DNM2 binding to PIP2 liposomes
          target: Reduced Dynamin-2 Membrane Fission Activity
          direction: RESTORED
          interpretation: The CMT mutant's reduced lipid binding returns to wild-type level when it is
            co-oligomerized with the CNM mutant - the biochemical event underlying the whole-animal rescue
            below.
      selected_evidence:
        snippet: This study reveals that two distinct disease-causing mutations within the DNM2 gene compensate
          each other in vivo, leading to corrections of most individual phenotypes.
        supports: SUPPORT
    origin:
