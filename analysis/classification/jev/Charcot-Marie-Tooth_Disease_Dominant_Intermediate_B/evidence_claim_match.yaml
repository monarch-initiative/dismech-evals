  a78f2e7710012f8a9c83d5cf069f1d6bdd82dcea48a8695a315a0efd94b3c33a:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Dominant Intermediate B
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease dominant intermediate B
            term:
              id: MONDO:0011674
              label: Charcot-Marie-Tooth disease dominant intermediate B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Schwann Cell Myelin Dysfunction
        description: The demyelinating arm, and it is directly demonstrated rather than inferred. In a
          peripheral nerve model built from Dnm2-deficient mouse tissue, CMTDIB-associated dynamin-2 mutants
          impaired myelination while centronuclear myopathy mutants did not - which supplies both the
          Schwann cell lesion and, in one experiment, the tissue specificity that separates the two DNM2
          diseases. Schwann cells expressing the CMT mutants show defective clathrin-mediated endocytosis
          with altered protein surface levels, and myelination is strictly dependent on Dnm2 and clathrin-mediated
          endocytosis function.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: myelination
          modifier: DECREASED
          term:
            id: GO:0042552
            label: myelination
      selected_evidence:
        snippet: Schwann cells and neurons from the peripheral nervous system expressing dominant intermediate
          Charcot-Marie-Tooth neuropathy mutants showed defects in clathrin-mediated endocytosis. We demonstrate
          that, as a consequence, protein surface levels are altered in Schwann cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
