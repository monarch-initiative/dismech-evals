      assertion_type: HistopathologyFinding
      assertion:
        name: Sural Nerve - Mixed Axonal Loss and Myelin Abnormality
        description: 'The human tissue counterpart of the "intermediate" label, and the reason it is more
          than an electrophysiological convention. A single biopsy shows both arms at once: diffuse loss
          of large myelinated fibres and clusters of regenerating myelinated axons, which is axonal pathology
          with regeneration, alongside fibres with focal myelin thickenings, which is a myelin abnormality.
          The same picture was reported independently in an Australian family.'
      selected_evidence:
        snippet: Sural nerve biopsy in a Dutch patient with Lys558Glu mutation showed diffuse loss of
          large myelinated fibres, presence of many clusters of regenerating myelinated axons and fibres
          with focal myelin thickenings--findings very similar to those previously reported in the Australian
          family.
        supports: SUPPORT
