            term:
              id: MONDO:0011674
              label: Charcot-Marie-Tooth disease dominant intermediate B
        context: []
      assertion_type: Genetic
      assertion:
        name: DNM2
        notes: Heterozygous DNM2 variants segregate with dominant intermediate neuropathy. Most reported
          variants involve the pleckstrin homology domain, with middle- and proline-rich-domain variants
          also documented. Functional direction must be assessed per allele and assay. Neutropenia and
          cataracts vary among families, and clinically silent carriers preclude assuming universal clinical
          penetrance.
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: DNM2
          term:
            id: hgnc:2974
            label: DNM2
        variants:
        - name: Lys558Glu
          description: Lys558Glu was found in Australian and Dutch families. Hematological abnormalities
            accompanied the Australian family but were absent in the Dutch family with the same allele.
        - name: Gly358Arg
          description: A middle-domain variant, one of the two exceptions to the pleckstrin homology domain
            clustering.
        - name: Thr855_Ile856del
          description: The first disease-causing variant reported in the proline-rich domain of dynamin-2.
        - name: Met580Thr
          description: Missense variant segregating with neuropathy in a large Czech family with variable
            onset and electrophysiology.
        - name: Gly537Ser
          description: The heterozygous c.1609G>A variant was reported in two affected adult siblings
            and their symptomatic mother. The authors considered it clinically likely pathogenic based
            on segregation and predicted effects; no direct functional assay was supplied.
      selected_evidence:
        snippet: This missense mutation segregated with the neuropathy, indicating the causal character
          of this mutation.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
