  64333c2ab7fb5002a0232a66aece3d4fd0ed63377e6635053b93dec3e66cc405:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Dominant Intermediate B
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease dominant intermediate B
            term:
              id: MONDO:0011674
              label: Charcot-Marie-Tooth disease dominant intermediate B
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extraneural Dynamin-2 Dependence
        description: 'DNM2 is ubiquitously expressed, and two non-neural features accompany the neuropathy
          in some families: asymptomatic neutropenia, which cosegregated with the neuropathy in two families
          carrying different variants at the same residue (Lys558), and early-onset cataracts. The residue-specific
          cosegregation is the strongest available hint that these are genotype-dependent consequences
          of the same protein defect rather than incidental findings - but neither the tissue mechanism
          nor the genotype correlation has been worked out, and a large Czech family with a different
          variant had neither feature.'
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Interestingly, in the Australian and Belgian families, which carry two different mutations
          affecting the same amino acid (Lys558), Charcot-Marie-Tooth cosegregated with neutropaenia.
          In addition, early onset cataracts were observed in one of the Charcot-Marie-Tooth families.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
