  a14b1153b66491278e26452d5dc885751bc92523dbf8bb8cc72919051ad7aea3:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Dominant Intermediate B
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease dominant intermediate B
            term:
              id: MONDO:0011674
              label: Charcot-Marie-Tooth disease dominant intermediate B
        context: []
      assertion_type: Genetic
      assertion:
        name: DNM2
        notes: 'Encodes dynamin-2. CMT-associated variants cluster in the pleckstrin homology domain,
          with documented exceptions in the middle and proline-rich domains. Variants at Lys558 are associated
          with cosegregating neutropenia.

          The allelic relationship with centronuclear myopathy is the mechanistically notable point and
          is deliberately kept as a contrast rather than merged into this entry: the proposal in the literature
          is that CNM variants make the protein hyperactive while CMT variants reduce its activity, so
          the two diseases sit on opposite sides of normal.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: DNM2
          term:
            id: hgnc:2974
            label: DNM2
        variants:
        - name: Lys558Glu
          description: One of two variants at Lys558 - the other is Lys558del - carried by the Australian
            and Belgian families in which the neuropathy cosegregated with neutropenia. The residue, not
            the specific substitution, is what the neutropenia association tracks.
        - name: Gly358Arg
          description: A middle-domain variant, one of the two exceptions to the pleckstrin homology domain
            clustering.
        - name: Thr855_Ile856del
          description: The first disease-causing variant reported in the proline-rich domain of dynamin-2.
      selected_evidence:
        snippet: Diagnosis requires identification of a heterozygous pathogenic variant in DNM2, the only
          gene known to be associated with DI-CMTB.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
