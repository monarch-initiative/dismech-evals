      assertion_type: Discussion
      assertion:
        discussion_id: inf2_renal_penetrance
        kind: OPEN_QUESTION
        status: OPEN
        prompt: What fraction of INF2 neuropathy carriers develop clinically significant renal disease,
          and does that fraction justify lifelong renal surveillance?
        attaches_to:
        - phenotypes#Focal Segmental Glomerulosclerosis
        - phenotypes#Proteinuria
        rationale: Every published frequency estimate is unusable for this question because of how the
          cohorts were assembled. The founding series genotyped patients selected for having CMT *and*
          FSGS, so 100% renal involvement in it is a property of the inclusion criteria. The one family
          ascertained neurologically had normal albumin and creatinine and at most mildly raised urine
          protein into the ninth decade. What is missing is an unselected INF2 neuropathy cohort with
          prospective renal follow-up; until it exists the entry records renal involvement as FREQUENT
          on published cases rather than as a penetrance figure.
      selected_evidence:
        snippet: Plasma albumin and creatinine were normal in all four cases, and urine protein was normal
          in one case and mildly raised in three patients
        supports: SUPPORT
