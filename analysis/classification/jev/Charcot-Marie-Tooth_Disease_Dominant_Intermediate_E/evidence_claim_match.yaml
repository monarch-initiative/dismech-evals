  9dfb67fcd26d29e2abadceb25e9e4197f1f6b73447ea7475bcf1c898d22109e2:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Dominant Intermediate E
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease dominant intermediate E
            term:
              id: MONDO:0013758
              label: Charcot-Marie-Tooth disease dominant intermediate E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Facilitated Autoinhibition of INF2
        biological_scale: MOLECULAR
        description: Wild-type INF2 is not autoinhibited when purified; it accelerates actin polymerisation
          from monomers as efficiently as a construct lacking the DID entirely. The brake is supplied
          in trans by a complex of cyclase-associated protein with lysine-acetylated actin, and that inhibition
          requires the DID. Disease-associated INF2 mutants are poorly inhibited by this complex, so a
          DID variant releases the formin from an externally imposed control rather than crippling it
          - which is why this node is tagged GAIN_OF_FUNCTION rather than INCREASED.
        molecular_functions:
        - preferred_term: actin binding
          term:
            id: GO:0003779
            label: actin binding
        biological_processes:
        - preferred_term: actin filament polymerization
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0030041
            label: actin filament polymerization
      selected_evidence:
        snippet: Interestingly, purified INF2 is not autoinhibited, suggesting the existence of other
          cellular inhibitors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
