          modifier: ABNORMAL
          term:
            id: GO:0007015
            label: actin filament organization
        notes: This node has no downstream edge of its own. It is a characterisation of the same Schwann
          cell lesion that "Schwann Cell Myelin Maintenance Failure" carries into the pathograph, and
          duplicating the edge would double-count the chain.
      selected_evidence:
        snippet: Our results suggest that these lesions reflect a global disorder of the actin cytoskeleton
          in Schwann cells and that CMTDIE is the first peripheral nerve disorder associated with a Schwann
          cell actinopathy.
        supports: SUPPORT
