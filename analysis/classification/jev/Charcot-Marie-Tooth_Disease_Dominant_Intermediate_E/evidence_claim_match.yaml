          name: Charcot-Marie-Tooth Disease Dominant Intermediate E
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease dominant intermediate E
            term:
              id: MONDO:0013758
              label: Charcot-Marie-Tooth disease dominant intermediate E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dynein-Mediated Nephrin Mistrafficking and Proteasomal Degradation
        biological_scale: MOLECULAR
        description: 'A specific route from the actin lesion to podocyte failure, worked out in detail
          for the INF2 R218Q allele. Normally INF2 sequesters dynein light chain 1; the mutant fails to,
          so Dynll1 is captured by PI31 and dynein carries the slit-diaphragm protein nephrin to the proteasome.
          Knocking down Dynll1 or PI31, inactivating dynein, or inhibiting the proteasome each restores
          nephrin, and bortezomib rescues the mouse.

          Two things limit how far this can be carried into CMTDIE, and both are recorded here rather
          than glossed. R218 lies in the residue range associated with monogenic FSGS, not in the range
          associated with the dual CMT/FSGS phenotype, so this is an adjacent allele rather than a CMTDIE
          allele. And nephrin is a podocyte protein, so nothing here speaks to the nerve arm at all.'
        cell_types:
        - preferred_term: podocyte
          term:
            id: CL:0000653
            label: podocyte
        biological_processes:
        - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: INCREASED
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
      selected_evidence:
        snippet: The R218Q mutation in INF2 disrupted sequestration of Dynll1 by INF2, allowing Dynll1
          to be captured by PI31 and promoting dynein-mediated transport of nephrin to the proteasome.
        supports: SUPPORT
        directness: INDIRECT
    origin:
