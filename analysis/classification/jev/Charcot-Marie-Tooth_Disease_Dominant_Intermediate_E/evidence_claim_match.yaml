        name: Molecular diagnosis
        description: Molecular testing that includes INF2 can establish the cause of a compatible neuropathy,
          especially with proteinuria or renal disease. Testing should not be restricted to patients with
          both organs affected. Splice consequences may require functional assessment even when a DNA
          variant appears to encode a missense change. General CMT evaluation includes PMP22 dosage analysis
          and then an appropriate multigene panel or genomic testing; INF2 coverage should be confirmed
          when this phenotype is suspected.
      selected_evidence:
        snippet: Consequently, INF2 mutation analysis should not be restricted to individuals with coincident
          neuropathy and renal disease.
