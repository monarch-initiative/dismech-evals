    evidence_metadata:
      reference: PMID:37491439
      reference_title: Characterization of cytoskeletal and structural effects of INF2 variants causing
        glomerulopathy and neuropathy.
      evidence_source: IN_VITRO
      explanation: The authors' own statement that the tissue selectivity is not resolved by their result,
        which is why this stays a KNOWLEDGE_GAP rather than being closed.
