        prompt: What is the age- and allele-specific risk of clinically significant kidney disease in
          INF2 neuropathy?
        attaches_to:
        - phenotypes#Focal Segmental Glomerulosclerosis
        - phenotypes#Proteinuria
        rationale: The original study selected patients with both CMT and FSGS, whereas a cryptic-splice
          family had minimal renal dysfunction. The later Japanese neuropathy cohort found renal disease
          in all eight INF2 cases, often progressing during adolescence, but remains a small retrospective
          referral series. Population penetrance and optimal surveillance intervals remain uncertain;
          that uncertainty does not negate the authors' recommendation for longitudinal renal assessment.
      selected_evidence:
        snippet: All patients also developed kidney dysfunction, with 7/8 (88%) progressing to end-stage
          renal disease at a median age of 15 years.
        supports: SUPPORT
