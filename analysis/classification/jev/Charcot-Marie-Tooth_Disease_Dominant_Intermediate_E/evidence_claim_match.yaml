  e30577b567235e9f943ab437e2ff1df904a90befdf7ab74fd85d115931d87626:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Dominant Intermediate E
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease dominant intermediate E
            term:
              id: MONDO:0013758
              label: Charcot-Marie-Tooth disease dominant intermediate E
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: inf2_organ_selectivity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does the same INF2 diaphanous-inhibitory-domain variant produce isolated glomerulosclerosis
          in one carrier and combined neuropathy plus glomerulosclerosis in a relative?
        attaches_to:
        - pathophysiology#Loss of Facilitated Autoinhibition of INF2
        - pathophysiology#Disruption of the INF2-MAL-CDC42 Pathway in Schwann Cells
        rationale: 'Part of this is now answered, and the answer is positional. Variants between residues
          184 and 245 produce monogenic FSGS; variants between residues 57 and 184 produce the dual CMT-plus-FSGS
          disease. So where in the diaphanous inhibitory domain the substitution falls predicts which
          organs are involved, and a cell-biological correlate has been measured: CMT/FSGS variants cause
          more prominent mitochondrial fragmentation and distribution change than FSGS variants, and the
          difference tracks the severity of cytoskeletal disruption. The dual phenotype looks like the
          more globally disruptive end of one gradient rather than a separate mechanism.

          What that does not explain is the intrafamilial variability, and it is worth being precise about
          why. The c.451T>C allele lies in the CMT-range segment, yet it segregated as isolated FSGS in
          some members of one family and as the dual phenotype in others. Position therefore sets what
          an allele *can* produce and something else decides what it *does* - a modifier, a threshold
          effect, or ascertainment. Nothing published identifies it, and the authors who established the
          positional rule end by saying that tissue-specific pathways in the two phenotypes still need
          clarifying.'
      selected_evidence:
        snippet: Variants between residues 184 and 245 of INF2, an actin assembly factor, produce the
          monogenic FSGS phenotype. Meanwhile, variants between residues 57 and 184 cause a dual-faceted
          disease involving peripheral neurons and podocytes (Charcot-Marie-Tooth CMT/FSGS).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37491439
      reference_title: Characterization of cytoskeletal and structural effects of INF2 variants causing
        glomerulopathy and neuropathy.
      evidence_source: IN_VITRO
      explanation: The positional rule, which is the part of this question that has an answer and which
        the earlier version of this entry did not have.
