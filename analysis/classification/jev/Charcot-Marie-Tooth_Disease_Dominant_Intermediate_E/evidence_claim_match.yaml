        biological_scale: CELLULAR
        description: The nerve-biopsy series draws a stronger conclusion than "demyelination", and it
          is the conclusion that ties the peripheral nerve lesion back to the molecular mechanism. Across
          six CMTDIE patients the lesions were read as a global disorder of the Schwann cell actin cytoskeleton,
          with abnormal cytoplasmic accumulation of the actin isoform itself, making CMTDIE the first
          peripheral nerve disorder described as a Schwann cell actinopathy.
