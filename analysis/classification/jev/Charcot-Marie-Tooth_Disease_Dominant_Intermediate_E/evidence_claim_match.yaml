  f2befcabf13288f7f14d46d71baaa05d5c5637f0dbb386d781905cf96a36e2cc:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Dominant Intermediate E
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease dominant intermediate E
            term:
              id: MONDO:0013758
              label: Charcot-Marie-Tooth disease dominant intermediate E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: INF2 Diaphanous-Inhibitory-Domain Variant
        biological_scale: MOLECULAR
        description: A heterozygous variant in the amino-terminal region of INF2. In the founding CMT-plus-FSGS
          series every allele lay in exons 2 and 3, which encode the diaphanous inhibitory domain, and
          a systematic review of the whole pathogenic allele set a decade later reached the same conclusion
          for INF2 disease as a whole. Missense substitutions dominate, but the spectrum also includes
          a cryptic splicing allele (c.271C>G, p.Arg91Gly) whose real consequence is an in-frame 40-amino-acid
          deletion inside the same domain.
        genes:
        - preferred_term: INF2
          term:
            id: hgnc:23791
            label: INF2
        genetic_context:
          allele_type: missense, and one cryptic splice allele producing an in-frame 40-residue deletion
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: 'Categorised as gain of function on two independent lines: disease-associated INF2
            mutants escape inhibition by the CAP-KAc-actin complex in vitro, and in mice a disease point
            mutation confers susceptibility to glomerular disease where the knockout does not.

            The two lines differ in allele coverage. The biochemistry tested both ranges - R218Q, an FSGS
            allele, and L77R, which the source calls a CMTD mutant and which sits at residue 77, inside
            the 57-184 CMT-associated span this entry describes - and found reduced CAP-KAc-actin inhibition
            of both, so that line bears on CMT alleles directly. The mouse work uses R218Q alone, so it
            is the in vivo line whose inference to CMT-range alleles is stated rather than assumed. It
            is drawn here and not for the nephrin route because the two claims have different scopes.
            Gain versus loss of function is a property of the *domain*: every pathogenic INF2 allele sits
            in the DID, the biochemical escape from CAP-KAc-actin inhibition was measured across disease
            mutants rather than on one, and the knockout-versus-point-mutant comparison tests the class
            of mechanism, not a residue. The nephrin route is the opposite - a specific molecular pathway,
            in one cell type, demonstrated for one allele - so it stays allele-local. Every evidence item
            on both is graded INDIRECT regardless.'
      selected_evidence:
        snippet: We identified nine new heterozygous mutations in 12 of the 16 index patients (75%), all
          located in exons 2 and 3, encoding the diaphanous-inhibitory domain of INF2.
        supports: SUPPORT
    origin:
