            term:
              id: MONDO:0036484
              label: Charcot-Marie-Tooth disease, dominant intermediate G
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Intermediate-Range Nerve Conduction Slowing
        biological_scale: TISSUE
        description: Upper-limb motor conduction velocities fall in the intermediate band of roughly 25-45
          m/s, in proximal as well as distal nerve segments, and this is what the CMTDIG label denotes.
          The important interpretive point is that a slow velocity is conventionally read as demyelination,
          but velocity also depends on axonal calibre — so a widespread reduction in calibre produces
          the same reading with normal myelin. NEFL is a neuronal protein and is not expressed in myelinating
          cells at all.
      selected_evidence:
        snippet: Electrophysiology showed uniform nerve conduction slowing in the intermediate range,
          both in distal and proximal nerve segments.
        supports: SUPPORT
        directness: DIRECT
