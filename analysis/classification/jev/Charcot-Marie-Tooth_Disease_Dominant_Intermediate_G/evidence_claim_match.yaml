      reference_title: Mutations in the neurofilament light chain gene (NEFL) cause early onset severe
        Charcot-Marie-Tooth disease.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Onion bulbs, the histological hallmark of demyelination and remyelination, appear
        in a nerve whose primary pathology is axonal and whose causal gene is not expressed by Schwann
        cells at all. This is the histological form of the entry''s central claim: the myelin-range findings
        in NEFL neuropathy are secondary to the axon, not a primary Schwann-cell lesion.'
