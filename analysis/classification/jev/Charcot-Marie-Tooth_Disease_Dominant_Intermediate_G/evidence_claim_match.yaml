          evoked potentials and blink reflex studies showed central sensorimotor pathway dysfunction,
          and the patients had a spastic gait. In a second dominant-intermediate pedigree the proband
          had cerebellar ataxia, nystagmus and dysarthria with cerebellar atrophy on MRI, and had been
          misdiagnosed as sporadic early-onset cerebellar ataxia. The route from NEFL aggregation to these
          findings is not established, which is why the edge into this node is typed as having unknown
          intermediates.
