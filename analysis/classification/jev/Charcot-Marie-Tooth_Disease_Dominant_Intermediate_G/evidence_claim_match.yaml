            term:
              id: MONDO:0036484
              label: Charcot-Marie-Tooth disease, dominant intermediate G
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Radial Axonal Growth
        biological_scale: TISSUE
        description: Neurofilaments are the structures responsible for radial growth of axons during development
          and for maintaining axonal diameter afterwards. Losing them from the axon leaves a thin axon.
          This is the step that makes CMTDIG intermediate rather than axonal or demyelinating, and it
          has been measured directly in the mouse carrying the CMTDIG variant, where sciatic axon area
          and diameter are reduced from postnatal day 21 onward.
        biological_processes:
        - preferred_term: radial growth and maintenance of axon diameter
          term:
            id: GO:0031133
            label: regulation of axon diameter
          modifier: DECREASED
      selected_evidence:
        snippet: Neurofilaments are neuron-specific intermediate filaments essential for the radial growth
          of axons during development and the maintenance of the axonal diameter.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
