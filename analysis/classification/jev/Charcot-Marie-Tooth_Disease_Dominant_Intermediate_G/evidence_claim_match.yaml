      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No population prevalence has been published for CMTDIG, and none can be derived, because
          the label is applied on an electrophysiological threshold rather than to a fixed set of variants.
          What is published is the size of the parent set and the share within it: NEFL accounts for under
          1% of CMT in large cohorts, and within NEFL-related CMT the intermediate classification was
          applied to 29% of 58 kindreds in a pooled literature analysis and to 64.9% of patients in a
          Korean national series. Those two shares are not reconcilable with each other, which is itself
          informative about how stable the category is.'
      selected_evidence:
        snippet: it is a rare form of inherited neuropathy, accounting for less than 1% of all CMT cases
          in large cohorts
