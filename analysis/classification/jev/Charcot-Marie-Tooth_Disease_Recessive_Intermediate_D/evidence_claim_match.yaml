  9241a6dec656f7f1174788815cc3df09c89bf6f234d6bf24fa56747d40d1c120:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Recessive Intermediate D
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease recessive intermediate D
            term:
              id: MONDO:0014467
              label: Charcot-Marie-Tooth disease recessive intermediate D
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Isoform-Restricted Tissue Vulnerability
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: 'The candidate explanation for why a defect in a housekeeping respiratory subunit
          presents as a peripheral neuropathy. Adult cardiac and skeletal muscle switch their complex
          IV 6A subunit from the ubiquitous COX6A1 to the muscle-specific COX6A2, so those high-demand
          tissues carry a substitute for the missing subunit. Peripheral nerve does not, and long axons
          have both the highest ATP cost per cell and no capacity for compensatory isoform switching,
          which would leave them the tissue at risk.

          The substitution step is not speculative: forced expression of COX6A2 in COX6A1-knockdown human
          cells restores both holoenzyme and activity, so the two isoforms are interchangeable at the
          level of the complex. What is unproven is the step from there to the human disease - nobody
          has shown that endogenous COX6A2 expression is what protects muscle in a COX6A1-deficient patient,
          and no CMTRID patient tissue has been compared for COX6A2 content. The node is therefore kept
          at HYPOTHETICAL: the biochemistry is established, the explanation of the clinical tissue selectivity
          is not. It is curated rather than omitted because it is the mechanism a reader would otherwise
          supply silently, and naming it makes it falsifiable.'
        biological_processes:
        - preferred_term: aerobic respiration
          term:
            id: GO:0009060
            label: aerobic respiration
          modifier: DECREASED
        cell_types:
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        - preferred_term: sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
      selected_evidence:
        snippet: We found extensive CIV-containing supramolecular organization in murine musculature at
          advanced developmental stages, while a switch in the expression from ubiquitous to muscle-specific
          isoforms of CIV was also detected.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36961412
      reference_title: Switching ubiquitous and muscle-specific isoforms of mitochondrial respiratory
        complex IV in skeletal muscle fine-tunes complex IV activity.
      evidence_source: MODEL_ORGANISM
      explanation: 'Documents that the isoform switch actually occurs in maturing muscle, which is what
        makes the rescue experiment above relevant in vivo. INDIRECT: the observation is in normal mouse
        muscle, and the inference to human nerve versus muscle is the curator''s.'
