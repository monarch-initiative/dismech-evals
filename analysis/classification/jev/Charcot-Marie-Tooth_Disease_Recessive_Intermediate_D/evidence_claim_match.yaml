        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        description: 'The candidate explanation for why a defect in a housekeeping respiratory subunit
          presents as a peripheral neuropathy. Adult cardiac and skeletal muscle switch their complex
          IV 6A subunit from the ubiquitous COX6A1 to the muscle-specific COX6A2, so those high-demand
          tissues carry a substitute for the missing subunit. Peripheral nerve does not, and long axons
          have both the highest ATP cost per cell and no capacity for compensatory isoform switching,
          which would leave them the tissue at risk.

