        description: 'Two distinct molecular routes to the same endpoint have been reported. The founding
          allele is a five-base deletion in the polypyrimidine tract of intron 2 (c.247-10_247-6delCACTC)
          that disrupts splicing of the adjacent third exon; the consequence measured in patients was
          reduced COX6A1 expression in peripheral white blood cells. The second is a stop-loss substitution
          that reads through the normal termination codon and extends the protein by 41 residues, reducing
          steady-state protein levels. Neither is a missense change altering catalysis: both reduce the
          amount of COX6A1 available, which is why the entry treats the lesion as a dosage problem.'
        genes:
