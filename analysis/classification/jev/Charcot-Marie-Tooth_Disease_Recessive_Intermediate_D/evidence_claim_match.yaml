      assertion_type: Pathophysiology
      assertion:
        name: Possible COX6A2-Mediated Tissue Compensation
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        description: Substitution by the muscle-specific paralogue COX6A2 is one proposed explanation
          for tissue selectivity. Forced expression rescues COX6A1-knockdown cells, and an isoform switch
          occurs during mouse muscle development. Neither observation demonstrates muscle protection or
          absence of compensation in patient nerve. Residual COX6A1 and other tissue-specific vulnerabilities
          remain alternative explanations.
        notes: 'This remains an unconnected protective hypothesis: endogenous compensation has not been
          demonstrated in patient tissues, and a positive causal arrow into energy failure or neuropathy
          would misrepresent the proposed direction. The existing rescue experiment and unresolved tissue
          comparison are represented in the model and discussion records.'
      selected_evidence:
        snippet: We found extensive CIV-containing supramolecular organization in murine musculature at
          advanced developmental stages, while a switch in the expression from ubiquitous to muscle-specific
          isoforms of CIV was also detected.
        supports: SUPPORT
        directness: INDIRECT
