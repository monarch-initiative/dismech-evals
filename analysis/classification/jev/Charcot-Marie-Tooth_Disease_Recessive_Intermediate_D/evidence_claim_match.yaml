        prompt: Does CMTRID meet a fixed electrophysiological definition of intermediate CMT?
        attaches_to:
        - pathophysiology#Motor Conduction Slowing
        rationale: The historical intermediate label can obscure the axonal and mixed patterns observed
          across patients.
        resolution_note: 'Full primary reports provide the previously missing measurements: the founding
          siblings had motor NCVs below 38 m/s at ages 30–39 and sural onion bulbs, whereas the Czech
          case had median motor NCV 46.4 m/s and ulnar NCV 44 m/s with low CMAPs at age 24. The entry
          therefore records variable axonal or mixed physiology and does not impose a fixed intermediate
          range. Larger longitudinal studies remain desirable, but absence of published human NCVs is
          not a valid knowledge gap.'
      selected_evidence:
        snippet: The affected siblings of family 1 initially had slightly reduced median motor nerve conduction
          velocities (NCVs) and onion bulb formation in the sural nerve at young ages, but they had motor
          NCVs below 38 m/s when they were aged 30–39 years, indicating mixed CMT
        supports: SUPPORT
        directness: DIRECT
