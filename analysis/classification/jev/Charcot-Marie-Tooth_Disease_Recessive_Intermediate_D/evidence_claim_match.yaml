        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does COX6A2 compensate for COX6A1 deficiency in patient muscle?
        attaches_to:
        - pathophysiology#Possible COX6A2-Mediated Tissue Compensation
        rationale: Forced COX6A2 expression rescues HEK293 knockdown cells, but physiological compensation
          in patients remains unmeasured. The null mouse has liver COX and ATP measurements and sciatic
          conduction measurements; a matched biochemical comparison of nerve, skeletal muscle and heart
          remains informative. Residual COX6A1 function and differential tissue vulnerability are alternative
          explanations.
        proposed_experiments:
        - experiment_id: cmtrid_tissue_resolved_cox_activity
          name: Tissue-resolved complex IV activity in the Cox6a1-null mouse
          description: Compare COX activity and COX6A2 abundance in sciatic nerve, dorsal root ganglion,
            skeletal muscle and heart of null and wild-type mice, with liver as a measured reference tissue.
          would_support:
          - pathophysiology#Possible COX6A2-Mediated Tissue Compensation
          supporting_outcome:
          - Relative preservation of enzyme activity in tissues expressing COX6A2 would support compensation,
            without proving causality.
          would_refute:
          - pathophysiology#Possible COX6A2-Mediated Tissue Compensation
          refuting_outcome:
          - Comparable loss of activity despite high COX6A2 expression would argue against simple isoform
            substitution as the explanation.
      selected_evidence:
        snippet: the null mice showed statistically significant reductions in COX activity and ATP contents
          in liver cells (p < 0.001; Figures 4A and 4B) and delayed motor NCV (p < 0.01; Figure 4C) relative
          to control animals.
        supports: SUPPORT
        directness: DIRECT
