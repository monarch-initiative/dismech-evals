        relationship_type: CAUSATIVE
        notes: Reported pathogenic mechanisms include a recurrent intronic splice-region deletion and
          a protein-extending stop-loss substitution. Different haplotypes in Japanese and Czech deletion
          families support recurrent mutation. Neither population prevalence, penetrance nor a modifier-gene
          effect is established by these small reports. COX6A2 is a distinct muscle-specific paralogue,
          not the causal gene for CMTRID.
