          cells restores both holoenzyme and activity, so the two isoforms are interchangeable at the
          level of the complex. What is unproven is the step from there to the human disease - nobody
          has shown that endogenous COX6A2 expression is what protects muscle in a COX6A1-deficient patient,
          and no CMTRID patient tissue has been compared for COX6A2 content. The node is therefore kept
          at HYPOTHETICAL: the biochemistry is established, the explanation of the clinical tissue selectivity
          is not. It is curated rather than omitted because it is the mechanism a reader would otherwise
          supply silently, and naming it makes it falsifiable.'
