        prompt: How does the early severe COX6A1 phenotype relate to neuropathy-predominant CMTRID?
        attaches_to:
        - pathophysiology#COX6A1 Stop-Loss Variant
        - phenotypes#Global Developmental Delay
        rationale: 'The three primary clinical reports describe five affected individuals in four families:
          three Japanese deletion cases, one Czech deletion case and one stop-loss child. The child had
          developmental delay, elevated lactate and death after febrile illness at 3.5 years. These observations
          cannot establish whether broader involvement reflects allele severity, modifiers or a distinct
          nosological boundary. Frequency estimates are not justified.'
