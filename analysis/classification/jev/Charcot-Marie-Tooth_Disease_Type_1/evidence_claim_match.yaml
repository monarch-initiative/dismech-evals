                label: Charcot-Marie-Tooth disease type 1F
            genes:
            - preferred_term: NEFL
              term:
                id: hgnc:7739
                label: NEFL
            description: 'The demyelinating presentation of NEFL-related CMT. NEFL encodes neurofilament
              light protein, one of five proteins that co-assemble to form neurofilaments, and its variants
              produce three electrophysiological presentations that the literature designates separately:
              demyelinating (CMT1F), axonal (CMT2E) and dominant intermediate (DI-CMTG). Sural nerve biopsies
              in NEFL-related CMT uniformly lose large myelinated fibres, and onion bulbs or thin myelin
              sheaths were seen in two-thirds of 21 reported biopsies, which is what places this presentation
              in the demyelinating compartment.

              The designation is a presentation rather than a mechanism, and the entry records it as such.
              A review of the published NEFL cases found that the same variant can be classified as CMT1F
              in one patient and CMT2E or DI-CMTG in another, and argued that the underlying process is
              most likely primarily axonal in every case. NEFL therefore crosses the compartment boundary
              in both directions: the axonal presentation is curated as CMT2E on Charcot-Marie-Tooth Disease
              Type 2, and the intermediate presentation has its own entry, Charcot-Marie-Tooth Disease
              Dominant Intermediate G.'
          role: subtype
      assertion_type: Genetic
      assertion:
        name: NEFL
        gene_term:
          preferred_term: NEFL
          term:
            id: hgnc:7739
            label: NEFL
        association: Causal
        relationship_type: CAUSATIVE
        subtype: CMT1F
        notes: NEFL encodes neurofilament light chain. Its variants are classified as CMT1F, CMT2E or
          DI-CMTG by electrodiagnostic findings rather than by genotype, and a review of the published
          cases found the same variant classified differently in different patients. The CMT2E presentation
          is curated on Charcot-Marie-Tooth Disease Type 2 and the intermediate presentation has its own
          entry, Charcot-Marie-Tooth Disease Dominant Intermediate G. ClinGen's Charcot-Marie-Tooth Disease
          Gene Curation Expert Panel has two NEFL rows in the committed cache, Definitive for Charcot-Marie-Tooth
          disease (MONDO:0015626, autosomal dominant) and Definitive for Charcot-Marie-Tooth disease type
          2 (MONDO:0018993, autosomal recessive); neither is scored against CMT1F, so the demyelinating
          designation is not separately graded.
      selected_evidence:
        snippet: Mutations in the neurofilament light polypeptide (NEFL) gene produce diverse clinical
          phenotypes, including demyelinating (CMT1F), axonal (CMT2E), and intermediate (CMTDIG) neuropathies.
