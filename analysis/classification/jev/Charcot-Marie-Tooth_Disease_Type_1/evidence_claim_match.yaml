          report mapped CMT1C to chromosome 16p13.1-p12.3 and found clustered missense mutations G112S,
          T115N and W116G in three pedigrees. LITAF is widely expressed and its transcript level in sciatic
          nerve does not change during development or in response to nerve injury, which the founding
          report calls a stark contrast to the other known CMT1 genes, so the lesion is not a myelin structural
          protein defect; the endolysosomal phenotype it produces is modeled in this entry's pathophysiology.
