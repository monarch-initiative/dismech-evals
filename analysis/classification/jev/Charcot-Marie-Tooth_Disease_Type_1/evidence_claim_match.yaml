          term:
            id: GO:0014037
            label: Schwann cell differentiation
          modifier: DECREASED
        notes: CMT1D (EGR2-related CMT)
      selected_evidence:
        snippet: Egr2(-/-) mice display disrupted hindbrain segmentation and development, and a block
