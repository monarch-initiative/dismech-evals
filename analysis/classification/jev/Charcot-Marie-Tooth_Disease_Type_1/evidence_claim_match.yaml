        context: []
      assertion_type: Subtype
      assertion:
        name: CMT1H
        display_name: CMT1H (FBLN5-related, with skin and retinal involvement)
        subtype_term:
          preferred_term: Charcot-Marie-Tooth disease, demyelinating, type 1H
          term:
            id: MONDO:0030689
            label: Charcot-Marie-Tooth disease, demyelinating, IIA 1H
        description: Autosomal dominant demyelinating CMT caused by heterozygous FBLN5 missense variants.
          FBLN5 encodes fibulin-5, an extracellular matrix protein required for elastic fibre assembly;
          the same gene causes recessive cutis laxa and is associated with age-related macular degeneration.
          Reported CMT families combine neuropathy with hyperextensible skin, and a mild-to-severe peripheral
          neuropathy was found in most FBLN5-mutation carriers ascertained through macular degeneration,
          so the subtype is best understood as one face of an oculo-neuro-cutaneous phenotype.
        genes:
        - preferred_term: FBLN5
          term:
            id: hgnc:3602
            label: FBLN5
      selected_evidence:
        snippet: A mild to severe peripheral neuropathy was detected in the majority of patients with
          age-related macular degeneration carrying mutations in fibulin-5.
        supports: SUPPORT
