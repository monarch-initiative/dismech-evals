          Cells
        description: The most common cause of CMT (CMT1A) is a 1.4 Mb tandem duplication of chromosome
          17p11.2 containing the peripheral myelin protein 22 (PMP22) gene. PMP22 overexpression destabilizes
          compact myelin and disrupts the structural organization of the myelin sheath, causing dysmyelination,
          demyelination, and characteristic onion-bulb formation from repeated Schwann-cell remyelination
          attempts. Slowed nerve conduction follows, and chronic secondary axonal loss eventually drives
          the clinical phenotype.
        cell_types:
