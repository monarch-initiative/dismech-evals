              label: Charcot-Marie-Tooth disease type 1
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NEFL Neurofilament Assembly and Transport Defect
        biological_scale: MOLECULAR
        description: 'NEFL encodes neurofilament light protein, one of five proteins that co-assemble
          to form neurofilaments, and its variants are classified as demyelinating (CMT1F), axonal (CMT2E)
          or dominant intermediate (DI-CMTG) according to electrodiagnostic findings. Many reports find
          that missense mutations in NEFL disrupt neurofilament assembly in cultured cells. How that produces
          the absence of neurofilaments from axons is less settled: the review collating the published
          cases calls it less clear, and says only that it seems likely to involve defective assembly
          and/or transport, which is why this node is named for both and asserts neither alone. The same
          review argues that the CMT1F, CMT2E and DI-CMTG classification reflects variable presentation
          rather than different mechanisms, and that the process is most likely primarily axonal in all
          cases; the node is placed in this entry because sural nerve biopsies in NEFL-related CMT show
          onion bulbs or thin myelin sheaths in two-thirds of cases alongside uniform loss of large myelinated
          fibres.'
        genes:
        - preferred_term: NEFL
          term:
            id: hgnc:7739
            label: NEFL
        molecular_functions:
        - preferred_term: structural molecule activity
          term:
            id: GO:0005198
            label: structural molecule activity
          modifier: DECREASED
        cellular_components:
        - preferred_term: neurofilament
          term:
            id: GO:0005883
            label: neurofilament
        biological_processes:
        - preferred_term: intermediate filament organization
          term:
            id: GO:0045109
            label: intermediate filament organization
          modifier: DECREASED
        notes: CMT1F (NEFL-related CMT, demyelinating presentation)
      selected_evidence:
        snippet: Mutations in the neurofilament light polypeptide (NEFL) gene produce diverse clinical
          phenotypes, including demyelinating (CMT1F), axonal (CMT2E), and intermediate (CMTDIG) neuropathies.
        supports: SUPPORT
