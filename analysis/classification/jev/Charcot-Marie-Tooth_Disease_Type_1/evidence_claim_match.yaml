          term:
            id: GO:0014037
            label: Schwann cell differentiation
          modifier: DECREASED
        notes: CMT1D (EGR2-related CMT)
      selected_evidence:
        snippet: we have identified one recessive and two dominant missense mutations in EGR2 (within
