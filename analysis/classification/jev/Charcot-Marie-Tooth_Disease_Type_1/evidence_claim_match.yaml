        association: Causal
        relationship_type: CAUSATIVE
        subtype: CMT1H
        notes: Heterozygous FBLN5 missense variants cause demyelinating CMT (CMT1H). The relationship
          was established by mapping a dominant CMT1 family to chromosome 14q32 and resequencing the interval,
          then finding two further missense variants among 112 unclassified CMT probands. ClinGen's Charcot-Marie-Tooth
          Disease Gene Curation Expert Panel classifies FBLN5 as Moderate for demyelinating hereditary
          motor and sensory neuropathy, so this is a supported but not definitively established gene-disease
          relationship.
      selected_evidence:
        snippet: This study identifies fibulin-5 as a gene involved in Charcot-Marie-Tooth neuropathies
