      assertion_type: Pathophysiology
      assertion:
        name: PMP22 Overexpression and Dysmyelination
        conforms_to: schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann
          Cells
        description: The most common cause of CMT (CMT1A) is a 1.4 Mb tandem duplication of chromosome
          17p11.2 containing the peripheral myelin protein 22 (PMP22) gene. PMP22 overexpression destabilizes
          compact myelin and disrupts the structural organization of the myelin sheath, causing dysmyelination,
          demyelination, and characteristic onion-bulb formation from repeated Schwann-cell remyelination
          attempts. Slowed nerve conduction follows, and chronic secondary axonal loss eventually drives
          the clinical phenotype.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: Myelination in the peripheral nervous system
          term:
            id: GO:0022011
            label: myelination in peripheral nervous system
          modifier: DECREASED
        genes:
        - preferred_term: PMP22
          term:
            id: hgnc:9118
            label: PMP22
      selected_evidence:
        snippet: The most common genetic diagnosis was PMP22 duplication (CMT1A; 505/1165, 43.3%)
        supports: SUPPORT
