  dc9582e1f97cfa2b5d04a74a6b8a8ff6dfbd5808d2c225add45509d23f89ac6a:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Type 1E
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease type 1E
            term:
              id: MONDO:0007311
              label: Charcot-Marie-Tooth disease type 1E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Store-Operated Calcium Handling
        description: 'A third consequence of the mutant protein, on a different axis from proteostasis
          and lipid trafficking. PMP22 modulates store-operated calcium channel activity: heterologous
          expression increases currents resembling those carried by store-operated channels, particularly
          TRPC1. A PMP22 whose amount or sequence is abnormal therefore changes Schwann-cell calcium handling
          as well as its own disposal and its lipid environment.

          Marked PROVISIONAL and drawn as an INDIRECT edge. The measurement is in a heterologous expression
          system, and it is about PMP22 rather than about a CMT1E allele specifically, so its weight for
          this disease is inferential.'
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
      selected_evidence:
        snippet: heterologous PMP22 expression increases the amplitude of currents similar to those ascribed
          to store-operated calcium (SOC) channels, particularly those involving transient receptor canonical
          channel 1 (TrpC1).
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31213528
      reference_title: Peripheral myelin protein 22 modulates store-operated calcium channel activity,
        providing insights into Charcot-Marie-Tooth disease etiology.
      evidence_source: IN_VITRO
      explanation: The electrophysiological measurement. Graded INDIRECT because it establishes that PMP22
        modulates these currents, not that a CMT1E allele's effect on them causes disease; the authors'
        own framing is that the role of PMP22 in Schwann cell physiology is not well understood.
