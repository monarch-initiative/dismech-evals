              label: Charcot-Marie-Tooth disease type 1E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cholesterol Sequestration in the Golgi
        description: 'Cholesterol is retained with the mutant protein in the Golgi, and plasma-membrane
          cholesterol falls correspondingly. Because cholesterol is a structural lipid of compact myelin,
          this diverts a myelin building block away from the membrane where it is needed.

          Note the source paper contrasts this directly with the CMT1A mechanism in the same experiments:
          PMP22 overexpression sequesters cholesterol to lysosomes instead. The two PMP22 diseases therefore
          mis-route the same lipid to different compartments, which is a sharper statement of "different
          mechanism" than a severity comparison would be.'
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        cellular_components:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
        biological_processes:
        - preferred_term: cholesterol transport
          modifier: DECREASED
          term:
            id: GO:0030301
            label: cholesterol transport
      selected_evidence:
        snippet: In Schwann cells from homozygous Trembler J (TrJ) mice carrying a Leu16Pro mutation,
          cholesterol was retained with TrJ-PMP22 in the Golgi, alongside a corresponding reduction in
          its plasma membrane level.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
