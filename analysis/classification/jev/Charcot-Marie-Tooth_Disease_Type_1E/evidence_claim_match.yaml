  d8b884c49e36684146511c283ae73ebf5ede3f7da0c49c1956d159b213859e53:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Type 1E
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease type 1E
            term:
              id: MONDO:0007311
              label: Charcot-Marie-Tooth disease type 1E
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exclude the PMP22 duplication before sequencing
        description: 'The testing ORDER is the practical consequence of this entry''s whole argument.
          CMT1A is the common PMP22 disease and is a copy-number change, so it is found by dosage analysis,
          not by sequencing; CMT1E is a coding change and is found by sequencing, not by dosage analysis.
          A laboratory that sequences first will call a CMT1A patient negative, and one that stops at
          MLPA will call a CMT1E patient negative. The reported combined strategy is dosage analysis of
          PMP22 with sequencing of the common CMT1 genes.

          This is also why CMT1E cohorts are assembled from duplication-negative families: the Korean
          series that supplies most of this entry''s clinical data screened 850 families that had already
          tested negative for the 17p12 duplication.'
        diagnosis_term:
          preferred_term: PMP22 dosage analysis with sequencing of the common CMT1 genes
          term:
            id: NCIT:C15709
            label: Genetic Testing
      selected_evidence:
        snippet: the diagnostic yield of the combined strategy of Multiplex-ligation-dependent-probe-amplification
          (MLPA) of PMP22/GJB1/MPZ and GJB1/MPZ/PMP22 Sanger sequencing was 63.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/2
      evidence_path: /diagnosis/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32506583
      reference_title: Diagnostic yield of targeted sequential and massive panel approaches for inherited
