            term:
              id: MONDO:0007311
              label: Charcot-Marie-Tooth disease type 1E
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extracellular Matrix Remodelling With Macrophage-Derived Metalloproteinases
        description: 'The inflammatory arm, and the only route in this entry to a cellular participant
          other than the Schwann cell. In Trembler-J nerve the basement membrane is remodelled - laminin
          modestly increased, full-length collagen IV and fibronectin decreased - with MMP-2 and MMP-9
          detectable and gelatinolytic activity up. The paper attributes a significant share of both enzymes
          to infiltrating macrophages.

          This matters because the rest of the pathograph is Schwann-cell-autonomous, so without this
          node the entry would imply that nothing else participates in the nerve pathology.'
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        cell_types:
        - preferred_term: infiltrating macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: extracellular matrix disassembly
          modifier: INCREASED
          term:
            id: GO:0022617
            label: extracellular matrix disassembly
      selected_evidence:
        snippet: macrophages are a significant source of both MMP-2 and MMP-9.
        supports: SUPPORT
