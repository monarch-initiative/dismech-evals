        context: []
      assertion_type: Diagnosis
      assertion:
        name: Nerve Conduction Studies
        description: 'Motor nerve conduction velocities are normal or near-normal (>38 m/s) in CMT2, distinguishing
          it from CMT1 where velocities are significantly reduced (<38 m/s). Compound muscle action potential
          amplitudes are reduced, reflecting axonal loss rather than demyelination.

          '
        notes: Key diagnostic criterion distinguishing CMT2 from CMT1
      selected_evidence:
        snippet: Median nerve motor nerve conduction velocities (MNCV) were always less than 38 m/s in
          CMT1A patients, whereas this was also the case in 16% of the CMT2 patients. Sensory nerve conduction
          velocities showed less overlap. In both CMT1A and CMT2 CMAP and SNAP amplitudes were often reduced
          or not obtainable in the legs.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
