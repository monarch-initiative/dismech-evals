      assertion_type: Discussion
      assertion:
        discussion_id: gap_cmt2b2_med25_modifier
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the MED25 p.Ala335Val variant contribute anything to the CMT2B2 phenotype, or is
          it purely a passenger on the founder haplotype?
        rationale: The founder haplotype confounds PNKP p.Gln517Ter with MED25 p.Ala335Val. Five additional
          patients have two pathogenic PNKP alleles but only one MED25 allele. The 2018 authors proposed
          a possible protective modifier effect of homozygous MED25, but age, genotype and ascertainment
          were not controlled. The 2009 study demonstrated altered SH3-peptide binding and Med25/Pmp22
          coexpression in Pmp22 animal models, not a PNKP disease model or modifier rescue experiment.
        attaches_to:
        - genetic#MED25
        - pathophysiology#Homozygous PNKP p.Gln517Ter
        - pathophysiology#Compound Heterozygous PNKP p.Gln517Ter and p.Thr408del
      selected_evidence:
        snippet: it would be possible to hypothesize that the MED25 variant confers a protective effect
          in them.
        supports: SUPPORT
        directness: INDIRECT
