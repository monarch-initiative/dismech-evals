      assertion:
        name: Impaired DNA Single-Strand Break Repair
        role: central_effector
        biological_scale: MOLECULAR
        description: Primary fibroblasts from PNKP patients spanning the whole disease spectrum show a
          markedly reduced rate of single-strand break repair. The same study looked for a double-strand
          break repair defect and did not find one, which matters because PNKP participates in both pathways
          and the double-strand route would have been the natural assumption. Restoring repair in those
          cells needed both catalytic activities plus the FHA domain that binds XRCC1.
        cell_types:
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: single strand break repair
          term:
            id: GO:0000012
            label: single strand break repair
          modifier: DECREASED
      selected_evidence:
        snippet: In contrast, the rate of SSB repair (SSBR) is markedly reduced.
        supports: SUPPORT
