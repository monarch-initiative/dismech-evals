      assertion_type: Genetic
      assertion:
        name: PNKP
        gene_term:
          preferred_term: PNKP
          term:
            id: hgnc:9154
            label: PNKP
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal Recessive
        notes: PNKP encodes the bifunctional DNA end-processing enzyme polynucleotide kinase 3'-phosphatase.
          The original family carries homozygous c.1549C>T (p.Gln517Ter), whereas five additional Costa
          Rican patients carry p.Gln517Ter in trans with c.1221_1223del (p.Thr408del). Only the p.Gln517Ter
          allele cosegregates with MED25 p.Ala335Val on the founder haplotype. Genotype does not establish
          a strict clinical boundary between neuropathy-predominant disease and AOA4.
        variants:
        - name: PNKP c.1549C>T (p.Gln517Ter)
          gene:
            preferred_term: PNKP
            term:
              id: hgnc:9154
              label: PNKP
          description: Last-exon nonsense allele removing Q517–G521; homozygous in the original family
            and paired with p.Thr408del in five additional patients.
        - name: PNKP c.1221_1223del (p.Thr408del)
          gene:
            preferred_term: PNKP
            term:
              id: hgnc:9154
              label: PNKP
          description: In-frame deletion of Thr408; in trans with p.Gln517Ter in the five additional Costa
            Rican patients. The same deletion also occurs in broader PNKP ataxia-neuropathy presentations.
      selected_evidence:
        snippet: Using exome sequencing, we now identified a homozygous nonsense variant (p.Gln517ter)
          in the last exon of an adjacent gene, the polynucleotide kinase 3'-phosphatase (PNKP) gene.
        supports: SUPPORT
        directness: DIRECT
