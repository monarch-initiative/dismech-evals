        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal Recessive
        notes: 'PNKP encodes polynucleotide kinase 3''-phosphatase, a bifunctional DNA end-processing
          enzyme. Two disease alleles are reported in this entity: c.1549C>T p.Gln517ter, homozygous in
          the original Costa Rican family, and c.1221_1223del p.Thr408del, carried in compound heterozygosity
          with it by five further Costa Rican patients and previously associated with AOA4. Both lie on
          the same ancestral founder haplotype as the MED25 variant that was originally proposed. ClinGen
          has no curation of the PNKP-CMT2B2 relationship itself; its PNKP record covers microcephaly,
          seizures and developmental delay (MONDO:0013254, Definitive).'
      selected_evidence:
        snippet: Re-assessing the first and only reported family by WES, Leal et al. identified a homozygous
          stop mutation in PNKP, a gene that is located in the same linkage region
        supports: SUPPORT
