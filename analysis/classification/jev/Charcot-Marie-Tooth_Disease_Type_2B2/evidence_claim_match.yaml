      assertion:
        name: Accumulation of Unrepaired Single-Strand Breaks in Post-Mitotic Neurons
        role: effector
        biological_scale: CELLULAR
        description: The step from a measured repair-rate deficit in fibroblasts to break burden in human
          neurons is an inference, not a measurement, and is curated as one. What supports it is that
          the study's own conclusion frames reduced single-strand break repair as the source of the neurodegenerative
          as well as the neurodevelopmental pathology, and that the extent of the reduction tracks disease
          severity.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: DNA repair
          term:
            id: GO:0006281
            label: DNA repair
          modifier: DECREASED
      selected_evidence:
        snippet: these data implicate reduced rates of SSBR, not DSBR, as the source of both neurodevelopmental
          and neurodegenerative pathology in PNKP-mutated disease
        supports: SUPPORT
        directness: INDIRECT
    origin:
