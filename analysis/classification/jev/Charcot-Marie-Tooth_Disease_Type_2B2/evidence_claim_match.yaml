              id: MONDO:0011570
              label: Charcot-Marie-Tooth disease type 2B2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PNKP Loss-of-Function Variant
        role: trigger
        biological_scale: MOLECULAR
        description: The founding family is homozygous for PNKP c.1549C>T p.Gln517ter, a nonsense variant
          in the last exon that removes the final five residues. Five further Costa Rican patients are
          compound heterozygous for that allele and c.1221_1223del p.Thr408del, an in-frame deletion previously
          reported in ataxia with oculomotor apraxia type 4. Both alleles sit on the same ancestral haplotype
          as the MED25 p.Ala335Val variant that was originally proposed as causative, which is why an
          exhaustive Sanger screen of the interval reached the wrong gene in 2009.
        genetic_context:
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: Using exome sequencing, we now identified a homozygous nonsense variant (p.Gln517ter)
          in the last exon of an adjacent gene, the polynucleotide kinase 3'-phosphatase (PNKP) gene.
        supports: SUPPORT
