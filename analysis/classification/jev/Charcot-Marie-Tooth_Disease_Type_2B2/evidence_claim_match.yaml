        name: PNKP Sequencing, and Reading the Whole Gene
        description: The cautionary detail from the original work is that the causal variant was present
          in the first Sanger screen and was discarded, because the PNKP gene annotation in use at the
          time contained an upstream stop codon that placed the variant outside the coding sequence. A
          last-exon variant in a gene with a contested annotation is exactly what a filtering step drops.
