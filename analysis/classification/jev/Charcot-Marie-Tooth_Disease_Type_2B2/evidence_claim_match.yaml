            term:
              id: MONDO:0011570
              label: Charcot-Marie-Tooth disease type 2B2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilised PNKP C-Terminus and Loss of DNA End-Processing Activity
        role: central_effector
        biological_scale: MOLECULAR
        description: 'PNKP is bifunctional: a 5''-kinase and a 3''-phosphatase that together convert damaged
          break termini into the 5''-phosphate/3''-hydroxyl ends that ligation requires. Its two catalytic
          domains both bind DNA and the C-terminus is buried between them, contacting residues in each.
          The residues removed by p.Gln517ter are exactly those contacts, so the predicted lesion is destabilisation
          of the folded enzyme rather than loss of a catalytic residue.'
        molecular_functions:
        - preferred_term: PNKP polynucleotide 5'-kinase activity
          term:
            id: GO:0046404
            label: ATP-dependent polydeoxyribonucleotide 5'-hydroxyl-kinase activity
          modifier: LOSS_OF_FUNCTION
        - preferred_term: PNKP polynucleotide 3'-phosphatase activity
          term:
            id: GO:0046403
            label: polynucleotide 3'-phosphatase activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: PKNP catalyzes the 5-prime phosphorylation of nucleic acids and also has an associated
          3-prime phosphatase activity
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
