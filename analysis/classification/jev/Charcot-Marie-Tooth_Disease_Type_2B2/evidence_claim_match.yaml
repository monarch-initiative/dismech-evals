        name: Absence of Microcephaly, Seizures and Developmental Delay
        description: Curated as a positive finding because it is what separates this entity from MCSZ,
          the severe neurodevelopmental end of the same gene's spectrum. Neither cognitive impairment,
          nor microcephaly, nor seizures was found on neurological examination.
        phenotype_term:
          preferred_term: Absence of microcephaly, seizures and developmental delay
        notes: 'Deliberately carries no `term:`. The HPO has no class for the coordinated absence of three
          features, and binding any one of them would assert its presence. Deliberately left unwired to
          the pathograph as well: it is a negative finding that bounds the entity against its allelic
          siblings, not a consequence of any node in the causal chain.'
      selected_evidence:
        snippet: Detailed clinical reassessment of the initial family and the new individuals revealed
          in all an adult-onset slowly progressive CMT2 associated with signs of cerebellar dysfunction
          such as slurred speech and oculomotor involvement, but neither microcephaly, seizures, nor developmental
          delay.
        supports: SUPPORT
