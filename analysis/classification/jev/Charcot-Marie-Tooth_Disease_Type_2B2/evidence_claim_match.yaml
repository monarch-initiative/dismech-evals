      assertion_type: Treatment
      assertion:
        name: Physiotherapy, orthoses and rehabilitation
        description: 'Care is supportive and is extrapolated from general Charcot-Marie-Tooth practice:
          individualised physiotherapy, ankle-foot orthoses and mobility aids, and orthopaedic assessment
          of fixed foot deformity or scoliosis.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: physical therapy and rehabilitation
          term:
            id: NCIT:C15302
            label: Physical Therapy
        target_phenotypes:
        - preferred_term: Distal muscle weakness
          term:
            id: HP:0002460
            label: Distal muscle weakness
        - preferred_term: Loss of ambulation
          term:
            id: HP:0002505
            label: Loss of ambulation
        notes: No treatment study specific to CMT2B2 appears in the sources curated here, so this records
          what is done rather than what has been tested in this entity. It is grounded in the general
          CMT2 management literature instead, and the source used for that is a GeneReviews chapter that
          has been formally RETIRED by its publisher and is flagged as possibly out of date. It is cited
          because it is the general CMT2 management literature the entry's description already says the
          care is extrapolated from, and leaving the extrapolation unsourced would have been the weaker
          option; but a current chapter should replace it when one exists. Note also that the retired
          chapter is written around the dominant CMT2 subtypes, while this entity is recessive.
      selected_evidence:
