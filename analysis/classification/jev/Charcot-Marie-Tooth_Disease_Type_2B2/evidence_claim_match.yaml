      assertion:
        name: Ataxia with oculomotor apraxia type 4 (AOA4)
        description: 'The same gene and, in five of the reported CMT2B2 patients, literally one of the
          same alleles: p.Thr408del was described first in AOA4. AOA4 leads with ataxia and oculomotor
          apraxia; CMT2B2 leads with the neuropathy and has cerebellar signs that are mild by comparison.
