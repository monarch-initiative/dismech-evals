            label: MTMR2
        - preferred_term: SBF2
          term:
            id: hgnc:2135
            label: SBF2
      selected_evidence:
        snippet: we identified two different nonsense mutations in the myotubularin-related 13 gene, MTMR13.
        supports: SUPPORT
