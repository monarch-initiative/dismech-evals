      assertion:
        name: Charcot-Marie-Tooth Disease Type 4K
        description: CMT4K (MONDO:0014733, SURF1-related) is a cytochrome c oxidase assembly defect rather
          than a Schwann-cell myelin-maintenance defect, and is distinguished clinically by lactic acidosis
          and by putaminal and periaqueductal lesions developing years after the neuropathy — features
          no other CMT4 subtype shows. It is listed in the has_subtypes roster above, because it is a
          hierarchical MONDO descendant of this entry's own term, and is kept here as well for those distinguishing
          features. Four subtypes of this compartment carry dedicated dismech entries - CMT4B3, CMT4C,
          CMT4D and CMT4K.
        distinguishing_features:
        - Lactic acidosis
        - Putaminal and periaqueductal brain MRI lesions
        - Cerebellar ataxia developing years after the polyneuropathy
      selected_evidence:
        snippet: We found SURF1 mutations in 5% of families (2/41) presenting with CMT4.
        supports: SUPPORT
