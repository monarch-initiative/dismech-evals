        description: The shared terminal node of the autosomal-recessive CMT4 compartment. The diverse
          Schwann-cell and neuronal lesions (GDAP1 mitochondrial dysfunction, myotubularin phosphoinositide
          dysregulation, SH3TC2 trafficking defect, NDRG1 and periaxin loss) converge on demyelination
          — often with redundant myelin outfoldings or onion-bulb formation — and, over time, length-dependent
          secondary axonal degeneration. It is this secondary axonal loss, affecting the longest motor
          and sensory fibers first, that produces the progressive distal clinical deficit shared across
          all CMT compartments, typically with earlier onset and greater severity in the recessive forms.
        cell_types:
