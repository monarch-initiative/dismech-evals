            term:
              id: MONDO:0018995
              label: Charcot-Marie-Tooth disease type 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Demyelination and Secondary Axonal Loss
        conforms_to: peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination
        description: 'The shared terminal node of the autosomal-recessive CMT4 compartment. The diverse
          Schwann-cell and neuronal lesions (GDAP1 mitochondrial dysfunction, myotubularin phosphoinositide
          dysregulation, SH3TC2 trafficking defect, NDRG1 and periaxin loss, the EGR2 differentiation
          block, the frabin actin-remodelling defect, and the FIG4 endolysosomal defect) converge on demyelination
          — often with redundant myelin outfoldings or onion-bulb formation — and, over time, length-dependent
          secondary axonal degeneration. It is this secondary axonal loss, affecting the longest motor
          and sensory fibers first, that produces the progressive distal clinical deficit shared across
          all CMT compartments, typically with earlier onset and greater severity in the recessive forms.
          HK1 (CMT4G) is deliberately not linked to this or any other node: the CMT4G founder variant''s
          functional effect is explicitly unresolved, so what is established for that subtype is an early-onset
          demyelinating neuropathy, not a mechanism through which the gene acts.'
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        - preferred_term: Sensory neuron of peripheral nervous system
          term:
            id: CL:0000101
            label: sensory neuron
        biological_processes:
        - preferred_term: Myelination in the peripheral nervous system
          term:
            id: GO:0022011
            label: myelination in peripheral nervous system
          modifier: DECREASED
      selected_evidence:
        snippet: Autosomal recessive peripheral neuropathies are relatively rare but are clinically more
          severe than autosomal dominant forms of CMT
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
