        description: Biallelic loss of the myotubularin-family phosphoinositide phosphatases MTMR2 (CMT4B1)
          and SBF2 / MTMR13 (CMT4B2) dysregulates Schwann-cell membrane phosphoinositide turnover. The
          resulting membrane-trafficking defect produces the redundant, focally folded (outfolded) myelin
          that is the histological hallmark of CMT4B, and a demyelinating neuropathy.
        cell_types:
