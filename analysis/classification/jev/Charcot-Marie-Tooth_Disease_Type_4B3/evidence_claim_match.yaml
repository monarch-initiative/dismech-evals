        category: Neurologic
        name: Decreased Motor Nerve Conduction Velocity
        diagnostic: true
        description: Slowed motor conduction is the electrophysiological signature of the classic demyelinating
          form and is what places it in CMT4. It is specifically not present in the syndromic axonal families,
          where conduction velocities are relatively preserved and the abnormality is reduced amplitude.
        phenotype_term:
          preferred_term: Decreased motor nerve conduction velocity
          term:
            id: HP:0003431
            label: Decreased motor nerve conduction velocity
        subtype: Classic CMT4B3
      selected_evidence:
        snippet: In contrast to CMT4B1, CMT4B2, and the pure neuropathic form of CMT4B3, which are all
          characterized by demyelinating neuropathy with focally folded myelin sheaths, both families
          presented a predominantly axonal sensory motor neuropathy with evidence of denervation, markedly
          reduced amplitude of action potentials, and relatively preserved nerve conduction velocities
        supports: SUPPORT
