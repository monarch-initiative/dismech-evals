        context: []
      assertion_type: AnimalModel
      assertion:
        name: Mtmr5-null mouse
        species: Mus musculus
        genotype: Mtmr5-/- (Sbf1 knockout)
        description: Constitutive Mtmr5-null mice. Adult nerves contain fewer myelinated axons, attributed
          to defective axon radial sorting, and Mtmr5 expression peaks during radial sorting and falls
          after postnatal day 7. Critically, these mice do NOT develop the CMT4B-like myelin outfoldings
          that define the human disease. Combined Mtmr5/Mtmr13 deletion is perinatally lethal.
        publication: PMID:34718573
        genes:
        - preferred_term: SBF1
          term:
            id: hgnc:10542
            label: SBF1
        modeled_mechanisms:
        - target: Impaired Axon Radial Sorting
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: The mouse is the primary evidence that MTMR5's peripheral-nerve role is in radial
            sorting.
          limitations: Mouse, not human, and the sorting defect is inferred from reduced myelinated axon
            counts in adult nerve rather than measured during sorting itself.
        - target: Focally Folded and Redundant Myelin
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: TISSUE
          description: The mouse does not reproduce the histological hallmark of human CMT4B3.
          limitations: A complete null in mouse produces no myelin outfoldings, while human CMT4B3 nerve
            biopsy shows them. Either the mouse lacks a human-specific requirement for MTMR5 in myelin
            maintenance, or the human outfoldings arise by a route the null allele does not model. Until
            that is resolved, this model cannot be used to study the outfolding pathology.
      selected_evidence:
        snippet: This study enhances our understanding of the non-redundant roles of the endosomal regulators
          MTMR5 and MTMR13 during normal peripheral nerve development and disease.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
