        context: []
      assertion_type: Diagnosis
      assertion:
        name: Sural nerve biopsy
        diagnosis_term:
          preferred_term: sural nerve biopsy
          term:
            id: NCIT:C217131
            label: Nervous System Biopsy Procedure
        presence: PRESENT
        description: The CMT4B group's diagnostic hallmark. Distal sural nerve biopsy in the index Korean
          family showed focally folded myelin sheaths with loss of large myelinated fibers - the finding
          that placed SBF1 disease in CMT4B and named the disease. It is no longer required for diagnosis
          now that sequencing is available, but a historical biopsy showing myelin outfoldings in an unsolved
          recessive neuropathy is a reason to sequence SBF1.
        results: Focally folded (outfolded) myelin sheaths and loss of large myelinated fibers, with myelinated
          fiber counts differing from CMT4B1 and CMT4B2.
      selected_evidence:
        snippet: We enrolled 14 members of a Korean family in which 3 individuals had demyelinating CMT4B
          phenotype and obtained distal sural nerve biopsies from all affected participants.
        supports: SUPPORT
