  28db61a039b402ba569b7bd38326f63c0745fe3972815d5b0b423615d9b72142:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Type 4B3
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease type 4B3
            term:
              id: MONDO:0014117
              label: Charcot-Marie-Tooth disease type 4B3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt4b3_dominant_report
        prompt: Does the reported heterozygous SBF1 p.H466Q mother-daughter pair establish a dominant
          form of SBF1 neuropathy, or is a second allele or another cause unaccounted for?
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - inheritance#Autosomal Recessive
        rationale: Every other published SBF1 family, and ClinGen's expert-panel assertion, is autosomal
          recessive, and mouse work states that all CMT-causing MTMR5 and MTMR13 mutations are recessive
          and consistent with loss of function. A 2024 report describes a mother and daughter heterozygous
          for a novel SBF1 missense variant, both with early-onset distal atrophy and an axonal electrophysiological
          pattern, and argues for autosomal dominant CMT4B3. The support offered is co-segregation in
          two individuals plus in-silico pathogenicity and protein structure prediction; no functional
          assay of the variant and no demonstration that a second SBF1 allele was excluded at the transcript
          level are reported. This entry therefore curates CMT4B3 as autosomal recessive and records the
          dominant claim here rather than in the inheritance block. It is a real published claim and should
          not be dismissed; it is also, on the evidence presented, a single family.
      selected_evidence:
        snippet: heterozygous SBF1 variants were observed in children with persistent toe walking and
          accompanying mild neuromotor/musculoskeletal features that partially overlap with reported CMT4B3
          phenotypes; however, these findings are descriptive and do not establish causality or enrichment
        supports: SUPPORT
