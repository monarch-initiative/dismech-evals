              label: Charcot-Marie-Tooth disease type 4B3
        context: []
      assertion_type: Subtype
      assertion:
        name: Classic CMT4B3
        display_name: Classic demyelinating CMT4B3
        description: 'The presentation of the index Korean family and the one that named the disease:
          a pure sensorimotor demyelinating neuropathy with focally folded myelin sheaths on nerve biopsy,
          closely resembling CMT4B1 and CMT4B2, with first-decade onset of distal weakness and atrophy,
          impaired vibration and position sense, areflexia and pes planus, and no cognitive, dysmorphic
          or other extraneurological features. These patients were compound heterozygous for two missense
          variants that most in-silico tools called benign or tolerated.'
      selected_evidence:
        snippet: In the original Korean family, 3 siblings showed a homogeneous phenotype of pure sensory
          motor demyelinating neuropathy with focally folded myelin sheaths, closely resembling CMT4B1
          and CMT4B2.
        supports: SUPPORT
