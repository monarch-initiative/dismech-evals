              of a multisystem neurodevelopmental syndrome: progressive microcephaly, intellectual disability,
              syndactyly, cerebellar atrophy with ataxia and pyramidal signs, and multiple cranial neuropathies
              producing ophthalmoparesis, facial weakness, dysarthria and dysphagia. Unlike classic CMT4B3,
              the neuropathy here is predominantly axonal, with markedly reduced action potential amplitudes
              and relatively preserved conduction velocities. Brain MRI in two families showed the "fork
              and bracket" sign at the pontine and mesencephalic level. Reported families carry variants
              predicted deleterious, or frameshift and splice-site null alleles.'
          role: subtype
