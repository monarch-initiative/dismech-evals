            term:
              id: MONDO:0014117
              label: Charcot-Marie-Tooth disease type 4B3
        context: []
      assertion_type: Subtype
      assertion:
        name: Syndromic SBF1 Neuropathy
        display_name: Severe syndromic SBF1-related neuropathy
        description: 'A far more severe early-onset disease in which the polyneuropathy is one part of
          a multisystem neurodevelopmental syndrome: progressive microcephaly, intellectual disability,
          syndactyly, cerebellar atrophy with ataxia and pyramidal signs, and multiple cranial neuropathies
          producing ophthalmoparesis, facial weakness, dysarthria and dysphagia. Unlike classic CMT4B3,
          the neuropathy here is predominantly axonal, with markedly reduced action potential amplitudes
          and relatively preserved conduction velocities. Brain MRI in two families showed the "fork and
          bracket" sign at the pontine and mesencephalic level. Reported families carry variants predicted
          deleterious, or frameshift and splice-site null alleles.'
      selected_evidence:
        snippet: In the second SBF1-mutated family, from Saudi Arabia, the 3 affected siblings presented
          a more complex syndromic phenotype. Sensory motor polyneuropathy was associated with progressive
          microcephaly, intellectual disability, syndactyly, and multiple cranial nerve involvement, which
          resulted in ophthalmoparesis, absence of pupil reactivity to light, mild facial weakness, swallowing
          difficulties, and dysarthria.
        supports: SUPPORT
