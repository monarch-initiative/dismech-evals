      assertion_type: Diagnosis
      assertion:
        name: Nerve conduction studies and electromyography
        diagnosis_term:
          preferred_term: nerve conduction study
          term:
            id: NCIT:C154784
            label: Electroneurography
        presence: PRESENT
        description: Neurophysiology classifies the neuropathy rather than making the diagnosis, and in
          CMT4B3 the classification is not uniform. The classic form shows demyelinating slowing, which
          is what places it in CMT4; the syndromic and the severe infantile forms show reduced compound
          muscle action potential amplitudes with denervation on EMG and relatively preserved velocities.
          A normal or near-normal conduction velocity therefore does not exclude CMT4B3.
        results: Either slowed motor conduction velocity (demyelinating range) or reduced CMAP amplitude
          with preserved velocity (axonal pattern), depending on the presentation.
      selected_evidence:
        snippet: Electroneurography disclosed severe motor polyneuropathy with predominant axonal features,
          diffuse reduction of compound action muscular potentials (CMAP, values under 1.5 mV) and only
          slight decrement of NCV (38-43 m/s).
        supports: SUPPORT
