              label: Charcot-Marie-Tooth disease type 4B3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt4b3_mouse_lacks_outfoldings
        prompt: Why does a complete Mtmr5 null in mouse produce no myelin outfoldings, when focally folded
          myelin is the diagnostic hallmark of human CMT4B3 - and does that mean radial sorting, not myelin
          maintenance, is the mechanism in patients too?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Focally Folded and Redundant Myelin
        - pathophysiology#Impaired Axon Radial Sorting
        - animal_models#Mtmr5-null mouse
        rationale: 'This is the central translational problem for CMT4B3. Human sural nerve biopsies show
          focally folded myelin sheaths, which is why the disease was classified in CMT4B at all. The
          Mtmr5-null mouse does not develop them; what it shows instead is a reduced myelinated axon count
          attributed to defective radial sorting, with Mtmr5 expression peaking during sorting and falling
          after postnatal day 7. The paper frames this as a division of labour, with Mtmr13 rather than
          Mtmr5 responsible for Schwann cell myelination - a framing that fits human CMT4B1 and CMT4B2,
          which are characterized by outfoldings, but not human CMT4B3, which also shows them. Either
          the two pseudophosphatases have genuinely non-redundant roles and human CMT4B3 outfoldings arise
          indirectly, or the mouse fails to model a human-specific requirement. The distinction is not
          academic: it decides whether the mouse can be used as a preclinical model for the myelin lesion,
          and it is the reason patient-derived iPSC lines were generated. A zebrafish full-gene deletion
          does show dysmyelination, but described qualitatively as "reminiscent" of the human pathology
          rather than as outfoldings.'
      selected_evidence:
        snippet: The form of Charcot-Marie-Tooth type 4B (CMT4B) disease caused by mutations in myotubularin-related
          5 (MTMR5; also called SET binding factor 1, SBF1) shows a spectrum of axonal and demyelinating
          nerve phenotypes. This contrasts with the CMT4B subtypes caused by MTMR2 or MTMR13 (SBF2) mutations,
          which are characterized by myelin outfoldings and classic demyelination.
        supports: SUPPORT
