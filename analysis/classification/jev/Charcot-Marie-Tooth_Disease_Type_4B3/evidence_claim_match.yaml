        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Axon Radial Sorting
        biological_scale: TISSUE
        description: 'Radial sorting is the developmental step in which Schwann cells segregate large-calibre
          axons out of bundles into 1:1 relationships before myelinating them. Mouse work places MTMR5''s
          main peripheral-nerve role here rather than in myelin maintenance: Mtmr5-null nerves contain
          fewer myelinated axons and show sorting defects, while Mtmr13 loss produces the outfoldings.
          Whether this division of labour holds in human CMT4B3, where outfoldings are seen, is unresolved
          - see the model-mismatch discussion below.'
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: Myelination in peripheral nervous system
          term:
            id: GO:0022011
            label: myelination in peripheral nervous system
          modifier: DECREASED
      selected_evidence:
        snippet: Loss of Mtmr5 in mice did not cause CMT4B-like myelin outfoldings. However, adult Mtmr5-/-
          mouse nerves contained fewer myelinated axons than control nerves, likely as a result of axon
          radial sorting defects.
        supports: SUPPORT
