      assertion_type: Discussion
      assertion:
        discussion_id: cmt4b3_spectrum_boundaries
        prompt: Are the demyelinating/axonal and pure/syndromic axes of SBF1 disease two descriptions
          of one severity gradient, or genuinely separable entities?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - has_subtypes#Classic CMT4B3
        - has_subtypes#Syndromic SBF1 Neuropathy
        rationale: 'The two subtypes recorded in this entry are a descriptive convenience, not a validated
          nosology, and one published case breaks the correlation they imply. The tidy story is: mild
          missense alleles give pure demyelinating CMT4B3, deleterious or null alleles give severe syndromic
          axonal disease. Against it, the Italian child carried compound heterozygous missense variants
          and had severe, rapidly progressive infantile axonal neuropathy with normal cognition and normal
          brain and spinal MRI throughout - severe and axonal without being syndromic. So "axonal" and
          "syndromic" are not the same axis, and neither maps cleanly onto allele severity. With fewer
          than ten published families, this cannot be settled from the current literature; it is recorded
          so the subtype split in this entry is read as provisional.'
      selected_evidence:
        snippet: We report a case of severe CMT4B3 characterized by early-onset motor and axonal polyneuropathy
          in an Italian child in absence of any evidence of brain and spine MRI abnormalities or intellectual
          disability and with a biochemical profile suggestive of mitochondrial disease.
        supports: REFUTE
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/1
      context_paths:
