        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Central Nervous System and Cranial Nerve Involvement
        biological_scale: ORGANISM
        description: 'In the syndromic families, SBF1 loss also produces progressive microcephaly, intellectual
          disability, cerebellar atrophy with ataxia and pyramidal signs, and degeneration of multiple
          cranial nerves. The mechanism is not established. Two observations argue that it is not simply
          more of the same Schwann-cell lesion: the syndromic variants fall in the DENN domain, which
          only SBF1 and SBF2 carry among the myotubularins, and the mtmr5-null zebrafish develops reduced
          head size and brain volume rather than a purely peripheral phenotype. Not every severe case
          has it - one child with severe infantile axonal disease had normal brain MRI and normal cognition
          throughout.'
      selected_evidence:
        snippet: Four siblings of consanguineous Bedouin kindred presented at infancy with an autosomal
          recessive syndrome of congenital microcephaly, facial dysmorphism, strabismus, developmental
          delay and ataxia with positive pyramidal signs.
        supports: SUPPORT
