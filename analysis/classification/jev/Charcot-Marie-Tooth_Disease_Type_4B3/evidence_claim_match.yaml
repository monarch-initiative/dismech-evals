    evidence_metadata:
      reference: PMID:41737274
      reference_title: 'Pediatric toe-walking cohort with heterozygous SBF1 variants: A phenotypic description.'
      evidence_source: HUMAN_CLINICAL
      explanation: An independent cohort in which monoallelic SBF1 variants, mostly VUS, sit beside a
        mild neuromotor phenotype and the authors decline to call them causal. It is the same interpretive
        problem the dominant report faces, in a larger sample.
