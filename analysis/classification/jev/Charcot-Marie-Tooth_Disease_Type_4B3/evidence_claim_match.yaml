        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Charcot-Marie-Tooth Disease Type 4B1
        description: 'MTMR2-related CMT4B1 is the closest mimic: autosomal recessive demyelinating neuropathy
          with the same focally folded myelin sheaths. MTMR2 is the active phosphatase that MTMR5 regulates,
          so the two diseases sit on the same molecular axis. Clinically the classic CMT4B3 phenotype
          resembles CMT4B1 only "to some extent" - the number of myelinated fibers on biopsy differs -
          and CMT4B1 does not produce the microcephaly, intellectual disability or cranial neuropathy
          seen in syndromic SBF1 disease. Separation is by gene.'
        distinguishing_features:
        - Causal gene MTMR2 rather than SBF1
        - No syndromic CNS or cranial nerve involvement
        - Different absolute myelinated fiber counts on nerve biopsy
      selected_evidence:
        snippet: Clinical phenotypes of affected study participants with CMT4B were similar, to some extent,
          to patients with CMT4B1 and CMT4B2.
        supports: SUPPORT
