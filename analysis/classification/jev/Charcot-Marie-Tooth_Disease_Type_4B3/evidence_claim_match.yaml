        notes: SBF1 (also MTMR5, DENND7A) at 22q13.33. Reported pathogenic alleles include compound heterozygous
          and homozygous missense variants clustering in the DENN and SBF2 domains, a homozygous splice-site
          null allele, and a homozygous frameshift deletion. Because MTMR5 has no catalytic activity of
          its own, the shared consequence is loss of its regulatory and scaffolding functions - MTMR2
          activation and localization, and DENN-domain Rab GTPase activation.
