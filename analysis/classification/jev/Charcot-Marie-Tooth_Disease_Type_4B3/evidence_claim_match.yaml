              id: MONDO:0014117
              label: Charcot-Marie-Tooth disease type 4B3
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmt4b3_syndromic_mechanism
        prompt: By what mechanism does SBF1 loss produce microcephaly, intellectual disability, cerebellar
          atrophy and cranial neuropathy in some families and a purely peripheral neuropathy in others?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Central Nervous System and Cranial Nerve Involvement
        - has_subtypes#Syndromic SBF1 Neuropathy
        rationale: The CNS arm of CMT4B3 has no worked mechanism. Two clues exist and neither is a mechanism.
          First, the variants in the two originally reported syndromic families fall in the DENN domain,
          which among the myotubularins only SBF1 and SBF2 carry and which acts on Rab GTPases and subcellular
          localization - suggesting functions beyond MTMR2 binding. But that argument is weakened by an
          SBF2 deletion removing the whole D-DENN module producing non-syndromic demyelinating neuropathy,
          and by later syndromic families carrying frameshift and splice-site null alleles rather than
          DENN missense. Second, the mtmr5-null zebrafish develops reduced brain volume, so a CNS requirement
          for MTMR5 is real in at least one vertebrate. What is missing is any account of which cell type
          in the CNS requires MTMR5 and what it requires it for.
      selected_evidence:
        snippet: However, the severe syndromic phenotype shown by 2 SBF1-mutated families calls for additional
          explanations.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27123480
      reference_title: '"Fork and bracket" syndrome expands the spectrum of SBF1-related sensory motor
        polyneuropathies.'
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' own statement that the MTMR2-partnering mechanism does not account for
        the syndromic phenotype.
