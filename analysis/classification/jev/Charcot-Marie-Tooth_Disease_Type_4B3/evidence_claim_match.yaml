        discussion_id: cmt4b3_no_disease_modifying_therapy
        prompt: Is there any tractable therapeutic target in CMT4B3, given that the lost protein is a
          scaffold rather than an enzyme?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        rationale: 'Every treatment in this entry is supportive. Nothing addresses the mechanism, and
          the shape of the lesion makes the usual routes awkward: MTMR5 has no catalytic activity to restore
          with a small molecule, and its role is to activate and localize another protein. The candidate
          strategies that follow from the mechanism - raising residual MTMR2 activity, or correcting the
          phosphoinositide imbalance downstream - have not been tested in CMT4B3. The zebrafish model
          was built partly to enable in vivo drug screening, so this gap has an identified route to being
          closed rather than just being a statement of ignorance.'
      selected_evidence:
        snippet: There is an incomplete understanding of the disease pathomechanism(s) underlying Charcot-Marie-Tooth
          type 4B3, and despite its severe clinical presentation, currently no disease-modifying therapies.
        supports: SUPPORT
