      assertion:
        name: Loss of the SH3TC2-Rab11 Interaction
        biological_scale: MOLECULAR
        description: 'Wild-type SH3TC2 is a Rab11 effector: it binds preferentially to GTP-loaded Rab11
          and is thereby held on the perinuclear recycling endosome. Disease-causing variants cannot associate
          with Rab11, and are mistargeted away from that compartment. The authors of the localization
          study proposed this mistargeting as the fundamental molecular defect of CMT4C — the step where
          truncating and missense alleles converge.'
        molecular_functions:
        - preferred_term: SH3TC2 binding to GTP-loaded Rab11
          term:
            id: GO:0031267
            label: small GTPase binding
          modifier: DECREASED
        cellular_components:
        - preferred_term: recycling endosome
          term:
            id: GO:0055037
            label: recycling endosome
      selected_evidence:
        snippet: We show that wild-type SH3TC2 targets to the intracellular recycling endosome by associating
          with the small GTPase, Rab11, which is known to regulate the recycling of internalized membrane
          and receptors back to the plasma membrane.
        supports: SUPPORT
        directness: DIRECT
