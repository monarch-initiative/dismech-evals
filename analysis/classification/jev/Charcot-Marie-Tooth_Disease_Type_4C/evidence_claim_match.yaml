        context: []
      assertion_type: Treatment
      assertion:
        name: Neurotrophin-3 Surrogate Gene Therapy (preclinical)
        description: 'An alternative to correcting the Schwann cell gene: intramuscular scAAV1.tMCK.NT-3
          turns skeletal muscle into a source of circulating neurotrophin-3, an autocrine factor for Schwann
          cell survival, differentiation and myelination. In Sh3tc2-/- mice it improved rotarod, grip
          strength and conduction velocity, and improved hypomyelination and neuromuscular junction denervation.
          Its rationale is explicitly the difficulty of reaching human Schwann cells with an intrathecal
          vector, so it is a bypass rather than a correction of the SH3TC2 defect. Preclinical only.'
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: NT-3 gene therapy improved functional and electrophysiological outcomes including rotarod,
          grip strength and nerve conduction velocity.
        supports: SUPPORT
        directness: DIRECT
