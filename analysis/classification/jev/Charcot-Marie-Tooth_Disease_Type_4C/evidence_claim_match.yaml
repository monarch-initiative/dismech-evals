        notes: SH3TC2 (originally KIAA1985) is the only gene known to cause CMT4C. The p.Arg954* nonsense
          allele is the dominant recurrent variant across European cohorts, and founder effects have been
          reported in French Canadians and in a Swedish cohort in which all five patients were homozygous
          for it. Carrier frequency is relatively high in some populations, notably individuals of Spanish
          Roma heritage.
        case_fractions:
        - population: All Charcot-Marie-Tooth disease
          case_fraction_low: 0.0
