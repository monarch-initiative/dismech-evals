              label: Charcot-Marie-Tooth disease type 4D
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: CMT4G (HMSN-Russe, HK1-related)
        description: The closest differential in the population where CMT4D is commonest. CMT4G is the
          other recessive demyelinating neuropathy caused by a founder mutation private to the Roma, and
          in the Slovak series the two accounted for all four families tested - two CMT4D and two CMT4G.
          Ancestry and clinical phenotype therefore do not discriminate them; the HK1 versus NDRG1 genotype
          does, which is the practical argument for testing both together rather than sequentially.
      selected_evidence:
        snippet: We detected mutation p.R148X (g.631C>T) in the NDRG1 (NM_006096.3) gene in two families
          and mutation g.9712G>C in the HK1 (NM_033498) gene in the other two families. These mutations
          cause CMT4D and CMT4G, respectively.
        supports: SUPPORT
