            term:
              id: MONDO:0011085
              label: Charcot-Marie-Tooth disease type 4D
        context: []
      assertion_type: Genetic
      assertion:
        name: NDRG1
        gene_term:
          preferred_term: NDRG1
          term:
            id: hgnc:7679
            label: NDRG1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        presence: PRESENT
        notes: 'NDRG1 sits at 8q24.22 and encodes a 43-kDa protein of the alpha/beta hydrolase superfamily
          that is considered catalytically inactive; its structure comprises a central alpha/beta hydrolase
          fold flanked by a short N terminus and a C-terminal region of three ten-residue repeats whose
          conformation changes on lipid binding. It is ubiquitously expressed but unusually abundant in
          Schwann cells.

          Twenty-two pathogenic variants have been reported across 72 patients. The Roma founder allele
          p.Arg148* accounts for 64 percent of them, which is why ancestry is a useful prior in CMT genetic
          testing but not a gate: CMT4D has now been reported in families of Italian, Turkish, Indian,
          Chinese, Saudi and Bulgarian Muslim origin, and one Italian patient''s novel frameshift allele
          prompted the explicit conclusion that CMT4D is not a private Romani disease. Two splice-acceptor
          alleles, c.538-1G>A and c.327-2A>G, are founder mutations in a second and distinct ethnic minority,
          the Bulgarian Muslims, on ancestral haplotypes of 2.4 and 9.6 Mb respectively.

          The allelic spectrum spans nonsense, frameshift, canonical splice-site, exon-duplication and
          missense classes. That breadth is mechanistically informative rather than incidental: the missense
          alleles p.Leu146Pro and p.Arg234Gln reduce NDRG1 protein abundance by accelerating its degradation
          rather than truncating it, so the disease can be produced by hypomorphic protein levels alone.
          Consistently, no genotype-phenotype partition within NDRG1 has been established - unlike genes
          such as BAG3 where allele class selects the tissue affected, every reported CMT4D allele produces
          the same demyelinating neuropathy with deafness.'
      selected_evidence:
        snippet: We detected an ~6.25 kb homozygous intragenic duplication in NDRG1, a gene known to be
          causative for recessive HMSNL/CMT4D, in three individuals from a Turkish family with CMT neuropathy.
        supports: SUPPORT
