        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other autosomal recessive demyelinating CMT (CMT4 subtypes)
        description: 'CMT4D must be separated from the other CMT4 subtypes - CMT4A (GDAP1), CMT4B1 and
          CMT4B2 (MTMR2, SBF2), CMT4C (SH3TC2), CMT4F (PRX) and CMT4J (FIG4) - which share recessive inheritance,
          early onset and slowed conduction. Two features point towards NDRG1: sensorineural deafness,
          which is not a general CMT4 feature, and the early severity of axonal loss. Neither is decisive,
          and the entity is defined genetically. Curated in this knowledge base as `Charcot-Marie-Tooth_Disease_Type_4`,
          which also carries CMT4D as a subtype block.'
      selected_evidence:
        snippet: should be considered in the differential diagnosis of recessive demyelinating CMT
        supports: SUPPORT
