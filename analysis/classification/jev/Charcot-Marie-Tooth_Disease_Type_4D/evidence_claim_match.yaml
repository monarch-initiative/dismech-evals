  491c1a8cf9c2ab04fe320f1869da44a970e130fd259fcfd537d5ac9c4f1a6906:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth disease type 4D
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease type 4D
            term:
              id: MONDO:0011085
              label: Charcot-Marie-Tooth disease type 4D
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Schwann Cell Vesicular Trafficking
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: PROVISIONAL
        description: The leading account of what NDRG1 actually does in the Schwann cell is vesicular
          trafficking. NDRG1 regulates endosomal recycling through Rab4a-positive compartments and low-density
          lipoprotein receptor turnover; CMT4D missense mutants leave the NDRG1-Rab4a interaction intact
          but produce enlarged Rab4a-positive compartments and fail to support LDL uptake or to restore
          receptor levels at the cell surface. The proposal that follows - that a trafficking Schwann
          cell simply cannot meet the membrane demand of myelin growth - is supported by a striking timing
          coincidence in the stretcher mouse, where widespread large-fibre demyelination coincides exactly
          with the period in which myelin volume and length in large fibres increase several hundred-fold,
          and small fibres are spared. It is marked PROVISIONAL because the trafficking defect is demonstrated
          in cell lines and the demand-mismatch argument is an inference from the timing rather than a
          direct measurement of membrane flux in a CMT4D nerve. The same work explicitly argues against
          several earlier candidate functions.
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: endosomal recycling of membrane receptors
          modifier: DECREASED
          term:
            id: GO:0032456
            label: endocytic recycling
      selected_evidence:
        snippet: However, NDRG1-knockdown cells expressing mutant NDRG1 displayed enlarged Rab4a-positive
          compartments.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28776325
      reference_title: Identification and functional characterization of two missense mutations in NDRG1
        associated with Charcot-Marie-Tooth disease type 4D.
      evidence_source: IN_VITRO
      explanation: Shows a recycling-endosome abnormality specific to the CMT4D mutant protein, with the
        NDRG1-Rab4a interaction itself preserved.
