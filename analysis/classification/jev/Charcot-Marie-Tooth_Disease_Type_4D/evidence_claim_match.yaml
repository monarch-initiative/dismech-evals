        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        conforms_to: peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells
        description: 'The initiating lesion is biallelic loss of NDRG1. The founder allele p.Arg148* (c.442C>T)
          introduces a premature termination codon and accounts for roughly two-thirds of reported patients.
          The remaining alleles converge on the same functional endpoint by different routes: frameshifts
          (p.His247Thrfs*74, p.Ser317Argfs*4, p.Glu170Glyfs*35), further nonsense alleles, canonical splice-acceptor
          variants whose transcripts favour exon skipping, a duplication of exons 6-8, and two missense
          alleles (p.Leu146Pro, p.Arg234Gln) that destabilise the protein rather than truncating it. The
          missense alleles matter mechanistically because they show the disease can be produced by reduced
          NDRG1 abundance alone, with no truncation involved.'
        genes:
        - preferred_term: NDRG1
          term:
            id: hgnc:7679
            label: NDRG1
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: Germline biallelic loss of function, most often homozygous for a founder nonsense
            allele. Functional characterisation of the novel Bulgarian splice-site alleles showed shorter
            gene products consistent with loss of protein function, and cell-culture work on the missense
            alleles showed accelerated degradation and lower steady-state protein levels.
      selected_evidence:
        snippet: 'Sequence analysis of two genes located in the critical region identified the founder
