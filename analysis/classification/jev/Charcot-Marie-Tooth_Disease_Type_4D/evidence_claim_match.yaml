      assertion_type: Pathophysiology
      assertion:
        name: Attenuated Neuregulin 1-ErbB Signaling
        biological_scale: MOLECULAR
        role: mediator
        mechanism_confidence: PROVISIONAL
        description: 'Axonal neuregulin 1 signalling through Schwann-cell ErbB2/ErbB3 is the main route
          by which an axon instructs its Schwann cell how much myelin to make. In Ndrg1-deficient mice
          this pathway is decoupled in an informative way: ligand and receptor are not scarce - neuregulin
          1 and total ErbB2/3 are both increased - yet the phosphorylated receptors and their downstream
          cascades are reduced, and integrin beta-4, the co-receptor that positively regulates the pathway,
          is markedly reduced. The lesion is therefore in receptor activation, not in ligand supply, which
          fits a trafficking defect that fails to present or maintain the receptor complex correctly at
          the Schwann-cell membrane. Marked PROVISIONAL for a specific reason: every one of these measurements
          comes from mouse sciatic nerve, and no equivalent has been shown in human CMT4D nerve. The same
          paper reports that its mouse does not reproduce the axonal loss that defines the human disease.'
        cell_types:
        - preferred_term: Schwann cell
          term:
            id: CL:0002573
            label: Schwann cell
        biological_processes:
        - preferred_term: ERBB signaling pathway
          modifier: DECREASED
          term:
            id: GO:0038127
            label: ERBB signaling pathway
      selected_evidence:
        snippet: In the absence of NDRG1, although the total ErbB2/3 receptors expressed by Schwann cells
          were significantly increased, levels of the phosphorylated forms of ErbB2/3 and their downstream
          signaling cascades were decreased.
        supports: SUPPORT
