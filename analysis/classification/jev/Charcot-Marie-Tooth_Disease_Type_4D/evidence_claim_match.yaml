        context: []
      assertion_type: Diagnosis
      assertion:
        name: Targeted NDRG1 Sequencing
        description: 'Molecular confirmation. Because a single founder allele accounts for most cases,
          targeted testing of NDRG1 has a high yield in patients of Roma origin with early-onset demyelinating
          neuropathy, and the authors of the Slovak series argue for making it routine in that setting.
          It must not be restricted to that setting, however: whole-exome and targeted panel sequencing
          have found NDRG1 alleles in patients with no Roma ancestry.'
      selected_evidence:
        snippet: Providing genetic analysis of these genes for patients with Roma origin as a common part
          of diagnostic procedure would contribute to a better rate of diagnosed cases of demyelinating
          neuropathy
        supports: SUPPORT
