      assertion_type: DifferentialDiagnosis
      assertion:
        name: SURF1-Related Leigh Syndrome
        description: SURF1-related Leigh syndrome and neuropathy-predominant CMT4K overlap molecularly
          and clinically. The distinction concerns the presenting features and disease course, not absent
          versus residual COX activity. Both can have elevated lactate, peripheral neuropathy and brain
          lesions. A normal early MRI or a neuropathy-leading presentation does not define a separate
          molecular mechanism. Adult-onset SURF1-related Leigh syndrome has also been reported; age alone
          does not define the distinction.
      selected_evidence:
        snippet: Neuroimaging demonstrated lesions characteristic of LS in 28/33 (85%) and atypical findings
          in 3/33 (9%).
        supports: SUPPORT
