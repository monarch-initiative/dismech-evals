  82de4998470193c37cdfbee20f88ba53fc456e5a9c5121198532a1bb8d3f86a3:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Type 4K
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease type 4K
            term:
              id: MONDO:0014733
              label: Charcot-Marie-Tooth disease type 4K
        context: []
      assertion_type: Biochemical
      assertion:
        name: Complex IV (cytochrome c oxidase) activity in muscle and fibroblasts
        notes: 'The diagnostic biochemical abnormality and the pivot of this entry''s mechanism: activity
          is reduced but, unlike in SURF1-related Leigh syndrome, not abolished. That partial retention
          is the proposed reason the presentation is a neuropathy rather than an encephalopathy.

          Left without a biomarker_term for a schema reason, not an ontology one. biomarker_term ranges
          over BiomarkerDescriptor, whose term binding is BiomarkerTerm, rooted at NCIT:C16342 — so an
          HP CURIE cannot go here whatever it says. The peer SURF1-Related_Leigh_Syndrome entry leaves
          its own complex IV record unbound the same way. The finding is instead grounded as a phenotype,
          Decreased Complex IV Activity, bound to HP:0008347.

          An earlier version of this paragraph asserted that HPO has no term for decreased cytochrome
          c oxidase activity. That was false, and it is worth recording how it got here. The deep-research
          report twice named HP:0002850 as "Cytochrome c oxidase deficiency"; that CURIE is in fact Decreased
          circulating IgM concentration. Review repeated the report''s pairing without checking it; this
          entry caught the wrong label but then searched HPO for "cytochrome c oxidase" and, finding only
          the stain finding HP:0003688, concluded no term existed. HP:0008347 Decreased activity of mitochondrial
          complex IV was in cache/hp/terms.csv the whole time, filed under the entry''s own preferred
          vocabulary — complex IV, the phrase used in this record''s name and in every pathophysiology
          node above. Five KB entries already bind it, two of them COX-deficiency entries this entry cites
          as precedent for its own split.

          The lesson is not that a search failed. It is that a bare "no term exists" in notes is a load-bearing
          negative claim, exactly as this entry''s own notes argue about natural history and prevalence,
          and it would have sent the next curator away from a term sitting in the cache.'
        presence: DECREASED
      selected_evidence:
        snippet: The c.107-2A>G mutation produced no normally spliced transcript, leading to SURF1 absence.
          However, complex IV remained partially functional in muscle and fibroblasts.
        supports: SUPPORT
    origin:
