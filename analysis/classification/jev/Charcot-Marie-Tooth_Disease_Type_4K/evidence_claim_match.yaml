    evidence_metadata:
      reference: PMID:24027061
      reference_title: SURF1 deficiency causes demyelinating Charcot-Marie-Tooth disease.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Residual complex IV activity measured directly in the 2 patients from the consanguineous
        family carrying c.107-2A>G. This paper''s functional analysis is scoped to that variant; the third
        CMT4K patient in the same series carries two additional SURF1 mutations, and complex IV activity
        is not separately reported for that patient. So this quote is a 2/2 observation for the assayed
        variant, not a 3/3 observation across the whole series. Tagged VERY_FREQUENT on mechanistic grounds
        rather than on a cohort measurement: SURF1 is a complex IV assembly factor, so a complex IV assembly
        defect is close to definitional for a SURF1-related disorder, and it was measured directly in
        2 of the 2 patients assayed here. No larger cohort has measured it in the CMT4K presentation specifically.'
