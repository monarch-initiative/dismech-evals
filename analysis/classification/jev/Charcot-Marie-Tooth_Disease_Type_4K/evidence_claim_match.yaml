              gene-therapy study. JeTI-hSURF1v2 given by lumbar intrathecal injection at postnatal day
              10 improved cerebral COX activity; later treatment at day 28 did not significantly improve
              that cerebral readout. Exercise-lactate improvement was a trend relative to untreated knockout
              animals (p=0.0609), despite a stronger interpretation in the paper.
          role: ancestor
