      assertion_type: Pathophysiology
      assertion:
        name: Delayed Basal Ganglia and Brainstem Injury
        biological_scale: TISSUE
        description: Complex IV deficiency also injures the putamen and periaqueductal grey — the lesion
          distribution of Leigh syndrome — but in CMT4K this appears years after the presenting polyneuropathy
          rather than as the initial event. This node is the mechanistic bridge between CMT4K and SURF1-related
          Leigh syndrome, and why the two are the same molecular defect with different tempo.
      selected_evidence:
        snippet: Two patients had brain MRI abnormalities, including putaminal and periaqueductal lesions,
          and developed cerebellar ataxia years after polyneuropathy.
        supports: SUPPORT
