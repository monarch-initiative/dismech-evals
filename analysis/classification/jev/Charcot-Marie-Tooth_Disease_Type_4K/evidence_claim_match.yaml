        name: Other CMT4 Subtypes
        description: 'Other recessive demyelinating CMT disorders can resemble CMT4K clinically and electrophysiologically.
          Their mechanisms are heterogeneous: GDAP1 is itself a mitochondrial protein. Lactate elevation
          or central signs justify broader investigation, but neither feature should be asserted to exclude
          all other CMT subtypes.'
      selected_evidence:
        snippet: GDAP1, the most frequent genetic cause for CMT4, encodes a protein anchored to the mitochondrial
          outer membrane, thus demonstrating that mitochondrial disorders may manifest with demyelinating
          polyneuropathy as the predominant feature.
        supports: SUPPORT
