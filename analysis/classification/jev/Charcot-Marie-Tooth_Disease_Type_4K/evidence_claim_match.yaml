  a971e5b8e29b8c12729bd3e9f2e189d94b1854309c2a7f818ea4f7d449c32fc4:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Type 4K
          disease_term:
            preferred_term: Charcot-Marie-Tooth disease type 4K
            term:
              id: MONDO:0014733
              label: Charcot-Marie-Tooth disease type 4K
        context: []
      assertion_type: Genetic
      assertion:
        name: SURF1
        gene_term:
          preferred_term: SURF1
          term:
            id: hgnc:11474
            label: SURF1
        relationship_type: CAUSATIVE
        notes: The original series identified a homozygous splice-site variant in two siblings and a compound
          heterozygous missense/frameshift pair in an unrelated patient. Functional studies were limited
          to the splice-site proband. The same c.107-2A>G allele has also been reported in trans with
          another allele in Leigh syndrome; genotype alone does not establish a neuropathy-only course.
        case_fractions:
        - population: Genetically unresolved CMT4 referral families in the original study
          case_fraction_percent: 5.0
          cohort_size: 41
          notes: 'Two of 41 families, comprising the index family and 40 screened families. This is an
            enriched referral series, not a population prevalence or the fraction of all CMT4 caused by
            SURF1. The screening panel was not uniform: PMP22, MPZ and GJB1 had been analyzed in all 40
            additional patients, while GDAP1, MTMR2, PRX and SH3TC2 had been screened in 20.'
        variants:
        - name: NM_003172.3:c.107-2A>G
          gene:
            preferred_term: SURF1
            term:
              id: hgnc:11474
              label: SURF1
          variant_type: single nucleotide variant
          genomic_contexts:
          - intron
          description: Homozygous intron-2 acceptor variant in the original siblings. Proband fibroblasts
            showed aberrant splicing and absent detectable SURF1. The transcript accession is the one
            used in the primary study.
        - name: c.574C>T (p.Arg192Trp)
          gene:
            preferred_term: SURF1
            term:
              id: hgnc:11474
              label: SURF1
          variant_type: single nucleotide variant
          genomic_contexts:
          - coding sequence
          description: Maternal missense allele in trans with c.799_800del in the unrelated patient. Pathogenicity
            predictions and prior reporting were described; functional samples from this patient were
            unavailable.
        - name: c.799_800del (p.Leu267GlufsX24)
          gene:
            preferred_term: SURF1
            term:
              id: hgnc:11474
              label: SURF1
          variant_type: deletion
          genomic_contexts:
          - coding sequence
          description: Paternal two-base deletion in trans with c.574C>T; the paper predicts a frameshift
            and abnormal C terminus. Protein fate was not measured in this patient.
      selected_evidence:
        snippet: The proband and his sister harbored a homozygous change in SURF1 gene, the recently reported
          A to G substitution (c.107-2A>G), abolishing the invariable consensus AG splice acceptor site
          of intron 2 (figure 1F).8
        supports: SUPPORT
