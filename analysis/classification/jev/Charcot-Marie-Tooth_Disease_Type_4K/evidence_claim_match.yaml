        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Reduced Complex IV Activity
        prompt: Which model readouts predict peripheral nerve benefit from SURF1 restoration?
        rationale: SURF1-deficient mouse lines differ substantially in survival, COX deficit and stress
          responses. Human and mouse fibroblasts also differ in assembly-intermediate turnover and supercomplex
          incorporation. Biochemical rescue in the 2025 gene-therapy study does not establish correction
          of demyelinating neuropathy; treatment-related rat toxicity demonstrates that tolerated mouse
          exposure does not alone establish translational safety.
      selected_evidence:
        snippet: the current animal model makes it difficult to determine whether the number of cells
          we are targeting with the current therapy is enough to provide any neurological benefits.
        supports: SUPPORT
        directness: INDIRECT
