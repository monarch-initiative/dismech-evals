      assertion_type: AnimalModel
      assertion:
        name: Viable Surf1-deficient B6D2F1 Mouse
        species: Mus musculus
        genotype: Surf1−/−
        background: B6D2F1/J (C57BL/6J × DBA2)
        publication: PMID:24911525
        description: The viable truncated-Surf1 model was studied in male mice aged 5–7 months for heart
          and skeletal-muscle energetics. COX activity fell 71% in heart and 53% in muscle, but isolated
          mitochondrial ATP production was not significantly reduced. Mitochondrial biogenesis markers
          increased in both tissues; UPRmt markers increased principally in muscle and Nrf2/HO-1 in heart.
          Basal and exercise lactate increased and endurance declined. These adaptations do not demonstrate
          a compensatory mechanism in human CMT4K nerve.
        modeled_mechanisms:
        - target: Reduced Complex IV Activity
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: COX deficiency without proportional failure of every energetic readout.
          limitations: Mouse peripheral nerve was not characterized as a CMT4K disease model; isolated
            mitochondrial and whole-animal readouts differ.
        - target: Systemic Lactate Elevation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Higher basal lactate and a greater rise during treadmill running.
          limitations: Mouse exercise physiology does not explain tissue selectivity or establish a neuropathy
            mechanism in human patients.
      selected_evidence:
        snippet: Surprisingly, despite the reduction of COX activity, no significant difference in ATP
          production was found in isolated heart or skeletal muscle mitochondrial preparations from Surf1−/−
          mice compared to wild type mice
        supports: SUPPORT
        directness: INDIRECT
