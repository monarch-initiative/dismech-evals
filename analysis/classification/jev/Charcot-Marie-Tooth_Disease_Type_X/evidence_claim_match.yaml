              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: Subtype
      assertion:
        name: CMTX3
        display_name: CMTX3 (Xq27.1 interchromosomal insertion)
        description: X-linked recessive CMT caused not by a coding variant but by a 78 kb interchromosomal
          insertion originating from chromosome 8q24.3 into the CMTX3 locus at Xq26.3-q27.3. Coding mutations
          were excluded by exome sequencing in the two mapped families, and the lesion was found only
          by whole genome sequencing. How the insertion produces neuropathy — presumably by perturbing
          regulation of a neighbouring gene — is not established.
      selected_evidence:
        snippet: The 78 kb insertion originates from chromosome 8q24.3, segregates fully with the disease
          in the two families, and is absent from the general population
        supports: SUPPORT
    origin:
