        biological_scale: CELLULAR
        description: Hyperactive PDK3 is proposed to maintain pyruvate dehydrogenase complex in a phosphorylated
          inactive state, limiting pyruvate oxidation. Impaired ATP production or lactate accumulation
          are possible consequences. The founding study measured recombinant kinase activity and binding,
          and called for neural-cell studies to establish the downstream metabolic consequences.
        subtypes:
