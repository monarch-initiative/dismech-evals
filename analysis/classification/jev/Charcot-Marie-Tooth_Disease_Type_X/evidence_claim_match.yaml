        description: CMTX1 and CMTX6 are transmitted in an X-linked dominant manner. Affected males transmit
          the variant to all daughters and no sons; heterozygous females have a 50% transmission risk
          to each child. Hemizygous males are consistently affected, whereas heterozygous females range
          from asymptomatic to mild-to-moderate and progressive. Skewed X-inactivation across the Schwann
          cell population is the traditional explanation for that variability, but it is not supported
          by the only direct measurement in affected nerve (see the refuting evidence below), and no alternative
          mechanism is established.
        inheritance_term:
          preferred_term: X-linked dominant inheritance
          term:
            id: HP:0001423
            label: X-linked dominant inheritance
      selected_evidence:
        snippet: Affected males transmit the GJB1 pathogenic variant to all of their daughters and none
          of their sons.
