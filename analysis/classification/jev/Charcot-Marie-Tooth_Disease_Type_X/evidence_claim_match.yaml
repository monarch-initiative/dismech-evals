              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Intermediate Conduction Velocity with Absent Male-to-Male Transmission
        description: 'The practical diagnostic signature of CMTX1: a CMT phenotype with intermediate motor
          conduction velocities (roughly 30-40 m/s in males), negative for the CMT1A duplication and the
          HNPP deletion, in a family showing a dominant trait but no male-to-male transmission. The last
          feature is what distinguishes X-linked from autosomal dominant inheritance on the pedigree alone.'
      selected_evidence:
        snippet: All patients having the CMT phenotype and intermediate conduction velocities who are
          negative for CMT1A duplication/hereditary neuropathy with liability to pressure palsies (HNPP)
          deletion, and whose family shows a dominant trait without male-to-male transmission, should
          be screened for CMTX1.
        supports: SUPPORT
