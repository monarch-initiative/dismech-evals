            value:
              preferred_term: cochlear implant
              term:
                id: NCIT:C157820
                label: Cochlear Implant
      selected_evidence:
        snippet: 'Case 4: A 32-year-old man with PRPS1 -associated CMTX5 and profound prelingual SNHL
          showed improved sound awareness (20-30 dB HL) post-CI but had no speech perception gains due
