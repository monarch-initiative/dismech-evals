  67ad0297c4ec28166af866a42845fe29a2ebff3bc7b317ceef0a737f6e663bd8:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Type X
          disease_term:
            preferred_term: X-linked Charcot-Marie-Tooth disease (CMTX)
            term:
              id: MONDO:0018994
              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oligodendrocyte Connexin-32 Loss and Transient CNS Dysfunction
        biological_scale: TISSUE
        description: 'Connexin-32 is expressed by oligodendrocytes as well as Schwann cells, and CMTX1
          is consequently the one CMT compartment with a recognized central nervous system phenotype.
          This takes two forms: fixed white-matter abnormalities, and stereotyped acute, self-limited,
          fully reversible episodes of CNS dysfunction — typically weakness and dysarthria, sometimes
          presenting as stroke-like episodes and mimicking cerebral ischaemia. The episodes are self-limited
          and treatment is supportive. Triggers are described - fever, infection, exercise, altitude,
          and in one report pollen exposure - but the mechanism linking any of them to the white-matter
          lesion is not established, and the pollen case explicitly leaves an allergic mechanism unproven.
          That the deficits resolve completely, with imaging lesions that also resolve, argues for reversible
          metabolic or ionic decompensation of oligodendrocyte-supported white matter rather than for
          infarction.'
        cell_types:
        - preferred_term: Oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        genes:
        - preferred_term: GJB1
          term:
            id: hgnc:4283
            label: GJB1
      selected_evidence:
        snippet: the mutants associated with CNS phenotypes failed to reach the cell membrane and were
          instead retained
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12111842
      reference_title: Cellular mechanisms of connexin32 mutations associated with CNS manifestations.
      evidence_source: IN_VITRO
      explanation: 'Distinguishes the CNS-associated GJB1 alleles cellularly: those reported to cause
        clinical CNS dysfunction are retained intracellularly rather than trafficking to the membrane,
        suggesting the CNS phenotype tracks a trafficking-defective subgroup rather than all loss-of-function
        alleles.'
