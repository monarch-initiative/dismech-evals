          reported temporal associations, not established causes: the pollen case explicitly notes that
          an allergic mechanism is unproven because allergy-specific biomarkers were not obtained during
          the acute phase. No ECTO exposure term is bound because the entry is a heterogeneous set of
          systemic stressors rather than one exposure concept; ECTO was searched and has no term covering
          the set.'
