              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: Treatment
      assertion:
        name: AAV9-Mediated Schwann-Cell-Targeted GJB1 Gene Replacement
        description: Investigational, preclinical only. An AAV9 vector delivering GJB1/Cx32 under the
          Schwann-cell-specific Mpz promoter, given by lumbar intrathecal injection. Gene replacement
          is a rational strategy here precisely because the human mechanism is loss of function, so restoring
          wild-type Cx32 to myelinating Schwann cells addresses the primary lesion rather than a downstream
          consequence. Treatment both before and after neuropathy onset improved motor performance, conduction
          velocity, myelination and blood biomarkers in Gjb1-null mice. No human trial has been reported,
          and symptomatic management remains the only clinical option.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: demonstrated improved motor performance and sciatic nerve conduction velocities along
          with improved myelination and reduced inflammation in peripheral nerve tissues
        supports: SUPPORT
