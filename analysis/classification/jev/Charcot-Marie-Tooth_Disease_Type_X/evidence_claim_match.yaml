      assertion_type: Pathophysiology
      assertion:
        name: Connexin-32 Reflexive Gap Junction Loss in Schwann Cells
        conforms_to: schwann_cell_myelin_maintenance#Myelin Gene Dosage or Structural Lesion in Schwann
          Cells
        biological_scale: MOLECULAR
        description: Loss-of-function variants in GJB1 remove connexin-32 from the non-compact myelin
          of myelinating Schwann cells, where it assembles the reflexive gap junctions that connect the
          cell's own abaxonal and adaxonal cytoplasmic compartments across the myelin spiral. Those junctions
          provide a short radial diffusion path — on the order of micrometres — for ions and small metabolites
          that would otherwise have to travel the entire spiral length of the sheath. Connexin-32 is normally
          expressed in myelinated peripheral nerve, and the reported variants span nearly all protein
          domains yet converge on loss of function rather than a toxic gain, which is why whole-gene deletions
          are no more severe than missense alleles.
        cell_types:
        - preferred_term: Myelinating Schwann cell
          term:
            id: CL:0000218
            label: myelinating Schwann cell
        biological_processes:
        - preferred_term: Gap junction assembly in non-compact myelin
          term:
            id: GO:0016264
            label: gap junction assembly
          modifier: DECREASED
        genes:
        - preferred_term: GJB1
          term:
            id: hgnc:4283
            label: GJB1
      selected_evidence:
        snippet: this radial pathway is approximately one million times faster than the circumferential
          pathway
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
