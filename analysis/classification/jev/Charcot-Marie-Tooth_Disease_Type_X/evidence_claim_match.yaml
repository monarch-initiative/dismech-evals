        biological_scale: MOLECULAR
        description: 'In CMTX6 the PDK3 p.R158H variant is hyperactivating rather than inactivating, which
          is unusual among CMT mechanisms. Mutant PDK3 binds the inner-lipoyl (L2) domain of the E2p chain
          more tightly than wild type and hyper-phosphorylates the pyruvate dehydrogenase complex, which
          inhibits it. Pyruvate entry into the Krebs cycle is throttled, leaving the long peripheral axon
          - the compartment least able to tolerate an ATP shortfall - energetically unsupported. Note
          the two-level direction here: the kinase gains activity, and the pathway it regulates loses
          flux.'
