          value:
            name: Systemic stressors preceding transient CNS episodes in CMTX1
            notes: Fever, infection, exertion, hyperventilation, head trauma and re-acclimatization after
              returning from high altitude have preceded some CMTX1 CNS episodes. Pollen exposure preceded
              one reported episode; an allergic mechanism was unproven because acute allergy biomarkers
              were unavailable. These are possible precipitants of a genetic disorder, not causes of CMTX.
              No single exposure ontology term is used for this heterogeneous set.
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Transient Stroke-like CNS Episodes
        environmental_effect: TRIGGERS
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: Reported stressors temporally precede some CNS episodes; the link is indirect and
          the cellular intermediates remain unknown. The pollen observation does not establish an allergic
          causal mechanism.
      selected_evidence:
        snippet: While some episodes appear to occur without provocation ..., most are associated with
          stressors such as hyperventilation or exertion ..., re-acclimatization after return from high
          altitude ..., fever ..., head trauma ..., or minor infections ....
        supports: SUPPORT
