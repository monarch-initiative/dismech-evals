              term:
                id: MONDO:0010549
                label: Charcot-Marie-Tooth disease X-linked dominant 1
            description: GJB1-related intermediate motor and sensory neuropathy, usually more severe in
              males than females. Pathogenic coding and noncoding variants impair Cx32 expression, trafficking
              or channel function. Loss of normal function explains much of the peripheral phenotype,
              but some CNS-associated alleles may have additional toxic effects. Females can have progressive
              disease. This subtype is the principal clinical focus of the entry.
            genes:
            - preferred_term: GJB1
              term:
                id: hgnc:4283
                label: GJB1
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Cx32 Dysfunction in Oligodendrocytes
        biological_scale: MOLECULAR
        description: Cx32 is expressed in oligodendrocytes as well as Schwann cells. In transfected HeLa
          cells, several CNS-associated Cx32 mutants were retained in the endoplasmic reticulum or Golgi,
          with rare plaques for some mutants, and did not alter Cx45 expression. These experiments support
          abnormal mutant handling but do not establish that simple Cx32 absence explains all CNS episodes.
          Toxic effects and disrupted glial coupling remain candidate mechanisms.
        subtypes:
        - CMTX1
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        genes:
        - preferred_term: GJB1
          term:
            id: hgnc:4283
            label: GJB1
      selected_evidence:
        snippet: In communication-incompetent cells, the mutants associated with CNS phenotypes failed
          to reach the cell membrane and were instead retained in the endoplasmic reticulum (A39V, T55I)
          or Golgi apparatus (M93V, R164Q, R183H)
        supports: SUPPORT
