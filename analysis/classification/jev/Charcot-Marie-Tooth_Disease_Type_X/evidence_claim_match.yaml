        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: We postulate these combined effects of R158H PDK3 are likely to lock PDC in a predominantly
          phosphorylated inactive state leading to impaired ATP production and or lactate accumulation.
