            term:
              id: MONDO:0018994
              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: Treatment
      assertion:
        name: AAV9-Mediated Schwann-Cell-Targeted GJB1 Gene Replacement
        description: Investigational AAV9-Mpz-GJB1 gene replacement was tested in Gjb1-null mice, using
          lumbar intrathecal administration before onset at two months and after onset at six months.
          Compared with mock-vector controls, treatment improved grip strength, conduction velocity, myelin
          pathology and selected blood biomarkers. Correction was partial; CMAP amplitudes did not improve
          significantly and late-treatment conduction velocities remained below wild-type values. Schwann-cell-specific
          expression does not establish treatment of CNS episodes. These experiments provide no human
          efficacy or safety result.
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: However, morphological improvement in treated mice was only partial, as demonstrated
          by the comparison to WT tissues
        supports: SUPPORT
    origin:
      assertion_path: /treatments/4
      evidence_path: /treatments/4/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33692503
      reference_title: AAV9-mediated Schwann cell-targeted gene therapy rescues a model of demyelinating
        neuropathy.
      evidence_source: MODEL_ORGANISM
