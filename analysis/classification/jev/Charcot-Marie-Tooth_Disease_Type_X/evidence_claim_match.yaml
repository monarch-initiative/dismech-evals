        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Oligodendrocyte Connexin-32 Loss and Transient CNS Dysfunction
        biological_scale: TISSUE
        description: 'Connexin-32 is expressed by oligodendrocytes as well as Schwann cells, and CMTX1
          is consequently the one CMT compartment with a recognized central nervous system phenotype.
          This takes two forms: fixed white-matter abnormalities, and stereotyped acute, self-limited,
          fully reversible episodes of CNS dysfunction — typically weakness and dysarthria, sometimes
          presenting as stroke-like episodes and mimicking cerebral ischaemia. The episodes are self-limited
          and treatment is supportive. Triggers are described - fever, infection, exercise, altitude,
          and in one report pollen exposure - but the mechanism linking any of them to the white-matter
          lesion is not established, and the pollen case explicitly leaves an allergic mechanism unproven.
          That the deficits resolve completely, with imaging lesions that also resolve, argues for reversible
          metabolic or ionic decompensation of oligodendrocyte-supported white matter rather than for
          infarction.'
        cell_types:
        - preferred_term: Oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        genes:
        - preferred_term: GJB1
          term:
            id: hgnc:4283
            label: GJB1
      selected_evidence:
        snippet: acute, self-limited episodes of transient neurologic dysfunction (especially weakness
          and dysarthria)
        supports: SUPPORT
