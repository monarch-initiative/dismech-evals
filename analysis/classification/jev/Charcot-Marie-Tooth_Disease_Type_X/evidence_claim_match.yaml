      assertion:
        name: Reduced SOX3 Expression During Early Neural Differentiation
        biological_scale: CELLULAR
        mechanism_confidence: PROVISIONAL
        subtypes:
        - CMTX3
        genes:
        - preferred_term: SOX3
          term:
            id: hgnc:11199
            label: SOX3
        description: 'Patient-derived CMTX3 iPSCs and caudal neuroepithelial progenitors show reduced
          SOX3 abundance. NanoString detected an approximately 5.7-fold iPSC RNA reduction. In progenitors
          from two patients and three controls, DESeq2 detected approximately 3.89-fold lower RNA; edgeR
          narrowly missed its significance threshold (FDR 0.0506). Proteomics in three patient and three
          control progenitor lines independently detected reduced SOX3 protein. Later differentiation
          stages did not show significant NanoString differences. SOX3 is a leading candidate regulatory
          target, not an established causal CMT gene: the study lacked isogenic controls and functional
          rescue, patient lines were related, and neuronal or glial dysfunction from altered SOX3 was
          not demonstrated. The specific regulatory interaction and expression outside the assayed developmental
          stages remain unresolved.'
      selected_evidence:
        snippet: At the iPSC stage, 12 of 21 candidate genes showed no detectable expression. Among the
          remaining genes, SOX3 was the only transcript significantly differentially expressed between
          CMTX3 and control iPSC lines (p = 0.0012), exhibiting an approximately 5.7‐fold reduction in
          patient‐derived iPSCs (log2(Ratio) = ‐2.51) (Figure 4A).
        supports: SUPPORT
