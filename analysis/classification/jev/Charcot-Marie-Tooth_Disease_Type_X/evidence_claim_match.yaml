              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: Inheritance
      assertion:
        name: X-linked inheritance in CMTX1
        description: Affected males transmit a GJB1 pathogenic variant to all daughters and no sons. Heterozygous
          females have a 50% transmission probability for each child. Females may have little disease
          or substantial progressive neuropathy. Mosaic X-inactivation remains a plausible contributor
          to variability, but its relationship to severity is incompletely established. A two-patient
          study found random X-inactivation in bulk archived sural nerve; it did not measure GJB1 expression
          in isolated Schwann cells and cannot exclude cell-specific or regional effects.
        inheritance_term:
          preferred_term: X-linked dominant inheritance
          term:
            id: HP:0001423
            label: X-linked dominant inheritance
      selected_evidence:
        snippet: Affected males transmit the GJB1 pathogenic variant to all of their daughters and none
