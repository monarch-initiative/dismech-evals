      reference: PMID:40759929
      reference_title: 'Random X chromosome inactivation in female Charcot-Marie-Tooth disease type X1:
        insights from sural nerve biopsy analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Directly refutes skewed X-inactivation as the explanation for female phenotypic variability.
        A HUMARA assay on archived sural nerve from two female CMTX1 patients found a random inactivation
        pattern no different from controls. This is a two-patient pilot, so it weakens rather than settles
        the hypothesis, but it is the only measurement made in the affected tissue, which is why this
        entry declines to assert mosaicism.
