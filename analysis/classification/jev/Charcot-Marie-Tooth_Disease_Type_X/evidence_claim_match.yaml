      assertion_type: Treatment
      assertion:
        name: Cochlear Implantation
        description: For the CMTX5 and CMTX4 hearing loss rather than the neuropathy. A small case series
          in CMT reports benefit, with outcomes shaped by whether the lesion is cochlear or a retrocochlear
          auditory neuropathy, and by how early implantation is done. Three of the four reported cases
          carry CMTX genotypes (GJB1/CMTX1, AIFM1, and PRPS1/CMTX5), so the series speaks to this entry
          directly rather than by extrapolation from CMT generally. Evidence is four patients, so this
          is a considered option and not an established standard.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: cochlear device implantation
