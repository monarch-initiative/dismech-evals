              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Slow progression in both sexes with CMTX1
        notes: The prospective 2023 GJB1 cohort showed increasing CMTES over follow-up in both sexes.
          Rates did not differ significantly between males and females over eight years, although cross-sectional
          age associations suggested slower lifetime progression in females. At three years the mean CMTES
          change was 1.3 ± 2.6; mildly affected patients had greater responsiveness of the score. These
          are cohort outcome-measure results, not fixed individual trajectories. Earlier cross-sectional
          absence of a female age correlation did not establish nonprogression.
      selected_evidence:
        snippet: Males and females progressed similarly up to 8 years, but baseline regression analysis
          suggested that over a longer period, females progress more slowly.
        supports: SUPPORT
