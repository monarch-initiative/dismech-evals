        context: []
      assertion_type: Subtype
      assertion:
        name: CMTX1
        display_name: CMTX1 (GJB1 / connexin-32-related)
        subtype_term:
          preferred_term: Charcot-Marie-Tooth disease X-linked dominant 1
          term:
            id: MONDO:0010549
            label: Charcot-Marie-Tooth disease X-linked dominant 1
        description: X-linked dominant intermediate CMT caused by loss-of-function variants in GJB1 encoding
          the gap junction protein connexin-32, which forms reflexive gap junctions in the non-compact
          myelin of myelinating Schwann cells. CMTX1 accounts for the large majority of CMTX and is the
          second most common cause of CMT overall. Over 260 distinct GJB1 variants have been reported
          across nearly all protein domains, and the weight of genotype-phenotype evidence is that they
          converge on simple loss of connexin-32 function rather than a toxic gain of function. Hemizygous
          males are more severely and more uniformly affected than heterozygous females.
        genes:
        - preferred_term: GJB1
          term:
            id: hgnc:4283
            label: GJB1
      selected_evidence:
        snippet: Taken together, these data suggest that most GJB1 mutations cause neuropathy by a loss
          of normal connexin 32 function.
        supports: SUPPORT
