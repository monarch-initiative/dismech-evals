      assertion_type: Subtype
      assertion:
        name: CMTX3
        display_name: CMTX3 (Xq27.1 interchromosomal insertion)
        description: 'A founder 77,856-bp insertion from chromosome 8q24.3 into intergenic Xq27.1 segregated
          with neuropathy in related families. It contains ARHGAP39 exons 1-7, but neuronal studies did
          not find a disease-specific fusion transcript or ARHGAP39 overexpression. A 2026 patient-derived
          iPSC study prioritizes SOX3: RNA and protein were reduced during early neural differentiation,
          while FGF13 changes previously observed in lymphoblasts were not consistently reproduced. SOX3
          causality remains unproven without functional perturbation or rescue. Males had childhood-onset
          intermediate neuropathy; carrier females could have subtle signs. Earlier linkage-defined families
          are not all molecularly equivalent: one was subsequently found to carry a BSCL2 variant.'
        subtype_term:
          preferred_term: Charcot-Marie-Tooth disease X-linked recessive 3
          term:
            id: MONDO:0010551
            label: Charcot-Marie-Tooth disease X-linked recessive 3
      selected_evidence:
        snippet: The 78 kb insertion originates from chromosome 8q24.3, segregates fully with the disease
          in the two families, and is absent from the general population
        supports: SUPPORT
