        name: Noncoding and Copy-number Coverage in Genetic Testing
        description: GJB1 analysis should include its relevant upstream regulatory region, 5-prime UTR,
          noncoding exons and splice sites, and 3-prime UTR. Consider deletion/duplication analysis after
          unrevealing sequence analysis and a neuropathy panel or broader genomic testing where appropriate.
          Exome sequencing alone can miss noncoding lesions; the CMTX3 interchromosomal insertion was
          identified using whole-genome sequencing after coding variants were excluded.
