      assertion_type: Discussion
      assertion:
        discussion_id: cmtx1_radial_diffusion
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Cx32 Loss of Function in Schwann Cells
        prompt: Which Cx32-specific functions are necessary for peripheral nerve maintenance despite preserved
          radial dye diffusion in knockout myelin?
        rationale: In teased mouse nerves, small dyes reached the adaxonal Schwann-cell cytoplasm even
          without Cx32, with no significant difference in the estimated diffusion rate. This argues against
          abolition of all radial communication. Cx32-specific permeability or signaling remains possible.
          The millionfold radial advantage discussed in the paper is a geometric diffusion-time estimate,
          not a measured dye-transport ratio.
      selected_evidence:
        snippet: The radial diffusion of low molecular weight dyes across the myelin sheath was not interrupted
          in myelinating Schwann cells from cx32-null mice, indicating that other connexins participate
          in forming gap junctions in these cells.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9722620
      reference_title: Functional gap junctions in the schwann cell myelin sheath.
      evidence_source: IN_VITRO
      explanation: Ex vivo teased-nerve dye transfer limits the complete-radial-blockade account; it does
