        name: Intermediate Conduction Velocity with Absent Male-to-Male Transmission
        description: Intermediate upper-limb motor conduction velocities, a compatible neuropathy phenotype
          and an X-linked pedigree can prompt GJB1 testing. Absence of male-to-male transmission alone
          does not prove X-linked inheritance, and a negative family history does not exclude CMTX1. Molecular
          testing confirms the diagnosis.
