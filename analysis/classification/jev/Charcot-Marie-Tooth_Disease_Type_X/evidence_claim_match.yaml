  46e06dce6ea1f2ac0c13c9ed1429d184608065973a10ddc3d99020529ebbd501:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Type X
          disease_term:
            preferred_term: X-linked Charcot-Marie-Tooth disease (CMTX)
            term:
              id: MONDO:0018994
              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: Genetic
      assertion:
        name: GJB1
        notes: Encodes connexin-32, the gap junction protein of Schwann cell non-compact myelin. Loss-of-function
          variants cause CMTX1, the great majority of CMTX and the second most common cause of CMT overall.
          Over 260 distinct variants have been reported spanning nearly all protein domains. The variant
          classes implicated span missense, nonsense, frameshift and non-coding variants as well as whole-coding-region
          deletions - the breadth is itself an argument for loss of function, since a single toxic mechanism
          would not be shared by a deletion and a missense allele alike. In the largest classified series,
          154 distinct GJB1 variants across 387 patients were adjudicated under ACMG/ACGS criteria adapted
          for CMTX1, of which 82.4% were pathogenic or likely pathogenic - a higher yield than ClinVar's
          classification of the same variants. Of the five most common variants, the non-coding c.-17G>A
          produced the most severe phenotype. Against that, a large cross-sectional cohort found no phenotypic
          correlation with specific variants overall, so genotype-phenotype signal in CMTX1 appears confined
          to particular alleles rather than being a general feature.
        case_fractions:
        - population: Hungarian CMT cohort (genetic epidemiology series)
          case_fraction_percent: 9.2
          notes: Share of all affected individuals in a national CMT cohort, second only to PMP22 at 40.5%.
            A share of CMT cases, not a population rate. Corroborating cohorts put GJB1 in roughly the
            7-16% range.
        gene_term:
          preferred_term: GJB1
          term:
            id: hgnc:4283
            label: GJB1
        relationship_type: CAUSATIVE
      selected_evidence:
        snippet: Direct sequencing of the connexin32 gene showed seven different mutations in affected
          persons from eight CMTX families.
        supports: SUPPORT
