  2b612f41bd5757f5db125e30cf0004c54b864bcd4b5dbc6a6d07ef3aa9022081:
    claim:
      about:
        disease:
          name: Charcot-Marie-Tooth Disease Type X
          disease_term:
            preferred_term: X-linked Charcot-Marie-Tooth disease (CMTX)
            term:
              id: MONDO:0018994
              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: Genetic
      assertion:
        name: GJB1
        notes: 'GJB1 encodes connexin-32. Pathogenic alleles include missense, nonsense, frameshift, splice
          and regulatory variants and whole-coding-region deletions. The 2023 study analyzed 387 patients
          with 154 GJB1 variants: 319 patients (82.4%) carried variants classified as pathogenic or likely
          pathogenic, whereas 109 of the 154 distinct variants (70.8%) received those classifications.
          The c.-17G>A 5-prime UTR variant had the most severe phenotype among the five most common variants
          studied; some intracellular-domain missense variants were milder. These findings do not imply
          that all missense alleles have the same channel defect or that clinical resemblance alone establishes
          pathogenicity of a VUS. The P2-promoted NM_000166 transcript and its regulatory regions are
          relevant to Schwann-cell expression.'
        case_fractions:
        - population: Hungarian CMT cohort (genetic epidemiology series)
          case_fraction_percent: 9.2
          notes: GJB1 variants accounted for 9.2% of all affected individuals in the studied Hungarian
            cohort (409 CMT1 and 122 CMT2 patients). This is a study-cohort fraction, not population prevalence
            or a fraction restricted to genetically solved cases.
        - population: Individuals with CMT neuropathy (GeneReviews synthesis)
          case_fraction_low: 10
          case_fraction_high: 20
          notes: GeneReviews describes CMT1X as at least 10%-20% of people with CMT neuropathy. These
            approximate reported range endpoints describe the GJB1-associated share of CMT, not population
            prevalence, a confidence interval, or a newly measured cohort.
        gene_term:
          preferred_term: GJB1
          term:
            id: hgnc:4283
            label: GJB1
        relationship_type: CAUSATIVE
      selected_evidence:
        snippet: Direct sequencing of the connexin32 gene showed seven different mutations in affected
          persons from eight CMTX families.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
