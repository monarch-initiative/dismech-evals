            term:
              id: MONDO:0018994
              label: Charcot-Marie-Tooth disease type X
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmtx1_axon_vs_myelin_ordering
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Demyelination with Secondary Axonal Loss
        prompt: Does axonal pathology in CMTX1 precede demyelination in humans, as it does in the Gjb1-null
          mouse, or is the human disease genuinely primary demyelination with secondary axonal loss?
        rationale: 'The two evidence streams point opposite ways, and the difference is mechanistically
          load-bearing rather than semantic. In Gjb1-null mice at 2-4 months, when there is minimal or
          no demyelination, axon diameters are already reduced, neurofilaments are dephosphorylated and
          densely packed, beta-amyloid precursor protein is elevated, and fast axonal transport is slowed
          - so the axon is affected first, and the authors conclude Cx32 loss affects axons independently
          of demyelination. Human nerve conduction studies in CMTX1 families are instead read as primary
          demyelination with secondary axonal loss. Both readings cannot be the mechanism. The discrepancy
          may be real species divergence, or it may be a detection-sensitivity artefact: mouse histology
          and axonal-transport assays interrogate the axon far more sensitively than clinical nerve conduction
          studies can, so human axonal involvement could simply be invisible at the stage where conduction
          slowing is first measured. Resolving it matters for therapy timing - if axonal injury is upstream,
          a myelin-directed intervention delivered after conduction slowing appears is already late. Note
          the two are not fully independent claims: human electrophysiology in CMTX1 is itself described
          as showing less demyelination and more axonal loss than other CMT1 subtypes, which leans toward
          the mouse.'
      selected_evidence:
        snippet: The electrophysiological findings were consistent with a primary demyelinating neuropathy
          with secondary axonal loss and support this model of disease progression.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/1
      context_paths:
      - /name
      - /disease_term
