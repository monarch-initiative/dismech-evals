      assertion_type: Treatment
      assertion:
        name: Cochlear Implantation
        description: Cochlear implantation can be considered for severe hearing impairment or auditory
          neuropathy after individual audiological assessment. A four-case series included GJB1-associated
          disease, AIFM1-related auditory neuropathy, PRPS1-associated CMTX5 and one indeterminate CMT
          subtype with multiple sclerosis. The AIFM1 case does not by itself establish the Cowchock subtype.
          Outcomes ranged from improved speech perception to sound awareness without speech gains. Age,
          genotype and auditory deprivation differed between cases, so the series does not isolate an
          effect of early implantation.
        therapeutic_modality: DEVICE
        treatment_term:
          preferred_term: cochlear device implantation
          term:
            id: NCIT:C15329
            label: Surgical Procedure
          qualifiers:
          - predicate:
              preferred_term: medical device
              term:
                id: NCIT:C16830
                label: Medical Device
            value:
              preferred_term: cochlear implant
              term:
                id: NCIT:C157820
                label: Cochlear Implant
      selected_evidence:
        snippet: Cochlear implants (CIs) have been used to rehabilitate hearing loss in CMT, but their
          effectiveness remains poorly understood due to the central and peripheral neurological complexities
          of the disease.
        supports: SUPPORT
        directness: INDIRECT
