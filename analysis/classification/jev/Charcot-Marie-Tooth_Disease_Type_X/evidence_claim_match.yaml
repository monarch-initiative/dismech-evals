        prompt: Does GJB1 loss predispose to inflammatory CNS demyelination (multiple sclerosis), and
          if so by what mechanism?
        rationale: Three MS cases occurred in a single-centre cohort of 70 GJB1 patients followed over
          20 years. The reported incidence comparison with historical background rates is an association
          signal with small numbers, not proof that GJB1 causes inflammatory demyelination. Ascertainment,
          comparator and diagnostic overlap limit causal interpretation; replication and a mechanism remain
          lacking.
      selected_evidence:
        snippet: The resulting 20-year MS incidence (4.3%) differed significantly from the highest background
          20-year MS incidence ever reported from Greece (p=0.00039)
