    evidence_metadata:
      reference: PMID:9722620
      reference_title: Functional gap junctions in the schwann cell myelin sheath.
      evidence_source: IN_VITRO
      explanation: 'Quantifies why the reflexive route matters: dye-injection measurements in teased myelinating
        Schwann cells show the radial path across the sheath is about a million-fold faster than travelling
        the spiral circumferentially, which is what makes its loss consequential.'
