        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Peripheral Myelin Abnormalities in CMTX1
        - pathophysiology#Impaired Axonal Transport in Gjb1-null Mice
        prompt: How does Schwann-cell Cx32 dysfunction injure axons, and what is the temporal relationship
          to myelin injury in human CMTX1?
        rationale: Gjb1-null mice show early axonal transport and cytoskeletal changes with little demyelination.
          A human family study interpreted electrophysiology as primary demyelination with secondary axonal
          loss. Different measurements and sampling stages do not establish opposing causal mechanisms
          or a proven species mismatch. The mouse result does not show that axonal injury causes demyelination,
          nor that clinical conduction slowing identifies the first biological event in patients.
      selected_evidence:
        snippet: we studied Gjb1-null mice at early stages (i.e. 2-4 months old) of the neuropathy, when
          there is minimal or no demyelination
        supports: SUPPORT
