        biological_scale: MOLECULAR
        description: 'AIFM1 forms a redox-regulated complex with the mitochondrial intermembrane space
          import and assembly protein MIA40 (CHCHD4), and deficiency of either protein impairs assembly
          of mitochondrial respiratory complex I (and complex IV). A neuropathy-associated AIFM1 missense
          mutation (p.Phe210Leu) caused abnormal assembly of mitochondrial complexes I and III, providing
          a mechanistic link between AIFM1 dysfunction and defective oxidative phosphorylation in affected
          peripheral nerve.

          '
        genes:
        - preferred_term: AIFM1
          term:
            id: hgnc:8768
            label: AIFM1
        biological_processes:
        - preferred_term: Mitochondrial respiratory chain complex I assembly
          term:
            id: GO:0032981
            label: mitochondrial respiratory chain complex I assembly
          modifier: ABNORMAL
        - preferred_term: Protein import into mitochondrial intermembrane space
          term:
            id: GO:0045041
            label: protein import into mitochondrial intermembrane space
          modifier: ABNORMAL
      selected_evidence:
        snippet: this Phe210Leu mutation resulted in abnormal assembly of mitochondrial complex I and
          III, and failed to disrupt AIFM1 binding with mitochondrial intermembrane space import and assembly
          protein 40 (MIA40) in the patients' cells.
        supports: SUPPORT
