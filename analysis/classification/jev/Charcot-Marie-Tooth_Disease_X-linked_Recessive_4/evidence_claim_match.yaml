            term:
              id: MONDO:0010689
              label: Charcot-Marie-Tooth disease X-linked recessive 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered AIF Redox Function
        biological_scale: MOLECULAR
        description: 'CMTX4 is caused by hemizygous missense mutations in AIFM1, encoding apoptosis-inducing
          factor (AIF), an FAD-dependent NADH oxidoreductase imported into the mitochondrial intermembrane
          space. The founding p.Glu493Val mutation lies at a highly conserved residue and alters the redox
          properties of AIF without impairing the enzymatic activity of the respiratory chain complexes
          — implicating a change in AIF''s redox behaviour rather than a simple loss of OXPHOS enzyme
          activity. This redox-switch perturbation forks downstream into two arms: loss of the AIF-dependent
          mitochondrial import/assembly function, and a shift toward increased (caspase-independent) apoptotic
          cell death.

          '
        genes:
        - preferred_term: AIFM1
          term:
            id: hgnc:8768
            label: AIFM1
        molecular_functions:
        - preferred_term: NADH oxidoreductase activity
          term:
            id: GO:0003954
            label: NADH dehydrogenase activity
      selected_evidence:
        snippet: Exome sequencing of an affected individual from the originally described family identified
          a missense change c.1478A>T (p.Glu493Val) in AIFM1, the gene encoding apoptosis-inducing factor
          (AIF) mitochondrion-associated 1.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
