        status: CANONICAL
        description: The best-supported ARSACS model is biallelic SACS loss of function causing sacsin
          deficiency, with convergent effects on protein chaperoning, microtubule/cytoskeletal organization,
          mitochondrial function, and neuronal vulnerability in cerebellar and motor systems.
      selected_evidence:
        snippet: Sacsin has been confirmed to be involved in chaperon activities, controlling the microtubule
          balance or cell migration. Additionally, sacsin may also play a crucial role in regulating the
          mitochondrial functions.
        supports: SUPPORT
