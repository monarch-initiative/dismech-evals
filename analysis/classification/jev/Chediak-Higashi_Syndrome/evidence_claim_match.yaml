        distinguishing_features:
        - Griscelli type 2 lacks the giant cytoplasmic granules pathognomonic of CHS.
        - Hair-shaft microscopy shows large, irregular pigment clumps and melanosomes are retained in
          melanocytes.
        - Caused by RAB27A (not LYST) and without the neutrophil giant-granule phenotype.
      selected_evidence:
        snippet: "genetic \ndefects in this machinery can affect all LROs or only an individual LRO, \n\
          resulting in a variety of clinical features"
        supports: SUPPORT
