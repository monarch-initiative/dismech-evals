      assertion_type: ProgressionInfo
      assertion:
        phase: Classic childhood-onset disease
        notes: Severe childhood-onset presentations ("classic" CHS) and milder adolescent- to adult-onset
          presentations ("atypical" CHS) form a phenotypic continuum rather than discrete categories;
          the pathognomonic giant leukocyte granules are the universal feature across the spectrum. All
          individuals with CHS are at risk of the accelerated phase and of neurologic manifestations.
      selected_evidence:
        snippet: Because of the considerable overlap between classic CHS and atypical CHS, the disorder
          is best understood as a continuum of severe to milder phenotypes, with the universal feature
          being the pathognomonic giant granules within leukocytes observed on peripheral blood smear.
        supports: SUPPORT
