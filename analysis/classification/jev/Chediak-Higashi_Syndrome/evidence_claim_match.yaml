          virus (EBV). Because CHS cytotoxic lymphocytes cannot kill infected/antigen-presenting targets,
          the immune response is not contracted; activated T lymphocytes and macrophages proliferate and
          infiltrate the liver, spleen, bone marrow, and lymph nodes with pancytopenia, high fever, and
          hemophagocytosis. The accelerated phase is the usual cause of early death.

          '
