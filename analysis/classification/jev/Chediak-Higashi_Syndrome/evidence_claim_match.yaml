              label: Chediak-Higashi syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: LYST Loss and Aberrant Lysosome-Related Organelle Biogenesis
        conforms_to: lysosome_related_organelle_biogenesis#Loss of a Lysosome-Related Organelle Biogenesis
          or Trafficking Component
        description: 'Biallelic loss-of-function of LYST, the lysosomal trafficking regulator, disrupts
          the regulated biogenesis, size control, and membrane fusion of lysosomes and lysosome-related
          organelles (LROs). The result is the formation of enlarged, dysfunctional giant granules (the
          pathognomonic CHS inclusion bodies) and mis-sorting of granule proteins across many cell lineages,
          the common upstream lesion for all downstream CHS manifestations.

          '
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: lysosome organization
          term:
            id: GO:0007040
            label: lysosome organization
          modifier: ABNORMAL
        - preferred_term: vesicle-mediated transport
          term:
            id: GO:0016192
            label: vesicle-mediated transport
          modifier: ABNORMAL
      selected_evidence:
        snippet: "The CHS hallmark is \nthe occurrence of giant inclusion bodies and organelles in a variety\
          \ of cell \ntypes, and protein sorting defects into these organelles."
        supports: SUPPORT
