      assertion_type: Genetic
      assertion:
        name: DPYD pharmacogenomic susceptibility
        gene_term:
          preferred_term: DPYD
          term:
            id: hgnc:3012
            label: DPYD
        association: Germline reduced-function DPYD variants increase fluoropyrimidine toxicity risk
        relationship_type: RISK_FACTOR
        variant_origin: GERMLINE
        notes: CID is not Mendelian, but DPYD is a clinically actionable pharmacogenomic risk factor for
          fluoropyrimidine toxicity. The matching deep-research artifact summarizes diarrhea-specific
          associations including DPYD*2A carrier diarrhea rates of 12.0%-100% versus 1.4%-27.5% in wild
          type, DPYD*13 carrier diarrhea rates of 50%-100% versus 5.8%-22% in wild type, and c.2846A>T
          pooled OR 6.0 for diarrhea.
        variants:
        - name: DPYD*2A
          description: Splice variant c.1905+1G>A, repeatedly implicated in severe fluoropyrimidine toxicity
            and highlighted in the deep-research artifact as a high-effect diarrhea risk allele.
        - name: DPYD*13
          description: Reduced-function variant c.1679T>G, repeatedly implicated in severe fluoropyrimidine
            toxicity.
        - name: DPYD c.2846A>T
          description: Missense variant p.D949V, associated with increased fluoropyrimidine toxicity risk.
        - name: DPYD HapB3
          description: Reduced-function haplotype, included among the key clinically actionable DPYD variants
            in pharmacogenomics reviews.
      selected_evidence:
        snippet: Germline variants in the DPYD gene, which encodes the enzyme dihydropyrimidine dehydrogenase
          (DPD), are known to impair drug metabolism and increase the risk of severe toxicity.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
