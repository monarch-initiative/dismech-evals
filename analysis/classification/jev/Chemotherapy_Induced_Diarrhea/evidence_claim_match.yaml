        role: predisposing host factor
        description: Germline variation in the enzymes that inactivate the two antineoplastic classes
          this entry identifies as its principal diarrheagenic agents — fluoropyrimidines and irinotecan
          — sets how much active drug the intestine sees for a given prescribed dose. Reduced-function
          UGT1A1 alleles lower SN-38 glucuronidation after irinotecan, and reduced-function DPYD alleles
          impair fluoropyrimidine catabolism, so the same regimen produces greater intestinal exposure
          and greater toxicity in carriers. This node is the host side of the exposure the trigger node
          describes, and it is where the two pharmacogenes this entry curates enter the pathograph.
        molecular_functions:
