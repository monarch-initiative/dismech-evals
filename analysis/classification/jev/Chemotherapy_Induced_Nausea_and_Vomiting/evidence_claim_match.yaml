  7a00af175769d029dfa93c390d44cfc3a3187721077c9d2c444cf26280e8bea8:
    claim:
      about:
        disease:
          name: Chemotherapy-Induced Nausea and Vomiting
        context: []
      assertion_type: Treatment
      assertion:
        name: Cannabinoid-Based Antiemetics
        description: Synthetic cannabinoid receptor agonists (nabilone, dronabinol) are approved for treatment
          of CINV. Nabilone is superior to placebo and prochlorperazine but does not add benefit beyond
          5-HT3 receptor antagonists. These agents offer a useful additional option particularly when
          standard antiemetics are inadequate, though side effects including euphoria, drowsiness, and
          dizziness are more frequent than with conventional antiemetics.
        notes: Cannabis and cannabinoid-based therapies have been used for decades to manage CINV. While
          synthetic cannabinoids like nabilone are FDA-approved for this indication, the role of botanical
          cannabis remains an area of active debate. Cannabinoid receptor agonists act through a unique
          mechanism distinct from 5-HT3 and NK1 antagonists. However, they have been underutilized historically
          due to legal restrictions and the notoriety of marijuana. Current evidence suggests they are
          most useful as adjunctive or rescue therapy rather than first-line treatment, as they do not
          add benefit to 5-HT3 antagonist-based regimens.
        treatment_term:
          preferred_term: cannabinoid antiemetic therapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: The mechanistic value of cannabinoids has been well known for many years, but these agents
          may have been underutilized in the past because of the notoriety and legal status of marijuana.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/1
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:28235999
      reference_title: 'Concise review of the management of iatrogenic emesis using cannabinoids: emphasis
        on nabilone for chemotherapy-induced nausea and vomiting.'
      explanation: Notes the historical underutilization of cannabinoids despite established efficacy,
        due to legal and social factors.
