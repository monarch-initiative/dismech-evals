      assertion:
        name: Acute CINV
        description: Nausea and vomiting occurring within the first 24 hours after chemotherapy administration.
          Primarily mediated by serotonin release from enterochromaffin cells activating 5-HT3 receptors
          on vagal afferents.
      selected_evidence:
        snippet: Chemotherapy-induced nausea and vomiting (CINV) are classified as acute, occurring within
          the first 24h, or delayed, occurring after the first 24h.
        supports: SUPPORT
