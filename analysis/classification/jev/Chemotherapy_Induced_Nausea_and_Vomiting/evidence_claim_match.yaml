      about:
        disease:
          name: Chemotherapy-Induced Nausea and Vomiting
        context: []
      assertion_type: Subtype
      assertion:
        name: Anticipatory CINV
        description: A conditioned response occurring before or during chemotherapy administration, triggered
          by sensory cues associated with prior emetic episodes. Driven by central nervous system conditioning
          rather than direct chemotherapy effects.
      selected_evidence:
        snippet: The different types of CINV (ie, acute, delayed, anticipatory, breakthrough, and refractory)
          are controlled through various pathways and neurotransmitters, so the pharmacologic approach
          to prevention and treatment varies based on the type of CINV.
        supports: SUPPORT
