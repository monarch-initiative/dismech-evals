  11f5b159d8d20c9c82ffb15a6331038c1bb279b5340e371ba84627e256cf5d45:
    claim:
      about:
        disease:
          name: Chemotherapy-Induced Nausea and Vomiting
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Serotonin Release from Enterochromaffin Cells
        description: Chemotherapy induces the release of serotonin (5-HT) from enterochromaffin cells
          in the small intestinal mucosa. This serotonin activates 5-HT3 receptors on vagal afferent neurons
          innervating the gastrointestinal tract, initiating the emetic reflex. This is the primary mechanism
          driving acute CINV.
        biological_processes:
        - preferred_term: Serotonin secretion
          term:
            id: GO:0001820
            label: serotonin secretion
          modifier: INCREASED
        cell_types:
        - preferred_term: Enterochromaffin cell
          term:
            id: CL:0000577
            label: type EC enteroendocrine cell
      selected_evidence:
        snippet: Evidence suggests that chemotherapy induces the release of 5-HT from enterochromaffin
          cells in the small intestine.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:1387926
      reference_title: Mechanism of the anti-emetic activity of 5-HT3 receptor antagonists.
      explanation: Establishes that chemotherapy triggers serotonin release from enterochromaffin cells
        as a key initiating event in the emetic reflex.
