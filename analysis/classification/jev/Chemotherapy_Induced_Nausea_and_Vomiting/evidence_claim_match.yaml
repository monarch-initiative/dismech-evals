  c9f5bda530686f40142d26cb6baae3f825e611950244663a1791a265e1f76e6e:
    claim:
      about:
        disease:
          name: Chemotherapy-Induced Nausea and Vomiting
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Central Emetic Signaling via Area Postrema
        description: The area postrema (chemoreceptor trigger zone) in the hindbrain contains 5-HT3 receptors,
          providing a second central site for emetic activation. This area lies outside the blood-brain
          barrier and integrates peripheral and central emetic inputs.
        biological_processes:
        - preferred_term: Signal transduction
          term:
            id: GO:0007165
            label: signal transduction
      selected_evidence:
        snippet: 5-HT3 receptors are also found in the hind-brain vomiting system including the area postrema
          (the site of the chemoreceptor trigger zone for emesis). Therefore, following chemotherapy,
          5-HT activates 5-HT3 receptors at 2 sites to induce emesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:1387926
      reference_title: Mechanism of the anti-emetic activity of 5-HT3 receptor antagonists.
      explanation: Identifies the area postrema/chemoreceptor trigger zone as a second site where 5-HT3
        receptor activation drives emesis.
