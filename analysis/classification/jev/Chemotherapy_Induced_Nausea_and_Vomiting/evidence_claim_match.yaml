      assertion:
        name: Substance P/NK1 Receptor Signaling
        description: Substance P acting on neurokinin-1 (NK1) receptors contributes to the emetic response,
          particularly in delayed CINV. This pathway is distinct from the serotonin-mediated acute phase
          and is targeted by NK1 receptor antagonists such as aprepitant.
      selected_evidence:
        snippet: The development of acute emesis is known to depend on serotonin. The pathophysiology
          of delayed emesis is less well understood, and multiple mechanisms may contribute, including
          substance P.
        supports: SUPPORT
