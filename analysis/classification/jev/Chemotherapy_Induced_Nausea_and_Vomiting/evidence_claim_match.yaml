  b7d6ba0e50d7db5a13cadbe5a2f2bd48ca6504f1700b319a2b519d263237dc4f:
    claim:
      about:
        disease:
          name: Chemotherapy-Induced Nausea and Vomiting
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Vagal Afferent 5-HT3 Receptor Activation
        description: Serotonin released by enterochromaffin cells activates 5-HT3 receptors on vagal afferent
          neurons innervating the gastrointestinal tract. Signals are relayed via the vagus nerve to the
          central vomiting system, initiating the emetic reflex.
        biological_processes:
        - preferred_term: Chemical synaptic transmission
          term:
            id: GO:0007268
            label: chemical synaptic transmission
        cell_types:
        - preferred_term: Vagal afferent sensory neuron
          term:
            id: CL:0000101
            label: sensory neuron
      selected_evidence:
        snippet: Ondansetron, a potent and highly selective 5-HT3 receptor antagonist, prevents emesis
          following chemotherapy by antagonising the action of 5-hydroxytryptamine (5-HT) at 5-HT3 receptors
          on vagal afferent neurons that innervate the gastrointestinal tract and 5-HT3 receptors in the
          central vomiting system.
        supports: SUPPORT
    origin:
