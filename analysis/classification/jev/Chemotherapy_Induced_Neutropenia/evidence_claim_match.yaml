  5d628d571e0aa9be4fd8a8272904aff3429c0a088d3e0524d68a9abe4c438a2a:
    claim:
      about:
        disease:
          name: Chemotherapy-Induced Neutropenia
          disease_term:
            preferred_term: chemotherapy-induced neutropenia
            term:
              id: MONDO:0001475
              label: neutropenia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cell-cycle-dependent vulnerability of proliferating progenitors
        description: 'Marrow toxicity is not simply a matter of drug reaching the bone marrow: it depends
          on the haematopoietic stem and progenitor pool being in active cell cycle when the cytotoxic
          agent arrives. That cell-cycle dependence is what makes the marrow a preferential target, and
          it is also a pharmacologically addressable step - holding progenitors in G1 for the duration
          of drug exposure protects them without changing the drug or its dose.'
        role: mechanism
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        - preferred_term: hematopoietic progenitor cell
          term:
            id: CL:0008001
            label: hematopoietic precursor cell
        biological_processes:
        - preferred_term: cell cycle
          term:
            id: GO:0007049
            label: cell cycle
      selected_evidence:
        snippet: trilaciclib induces a transient, reversible G1 cell cycle arrest of proliferating haematopoietic
          stem and progenitor cells in bone marrow, thus protecting them from damage during chemotherapy
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33861388
      reference_title: 'Trilaciclib: First Approval.'
      evidence_source: OTHER
      explanation: 'Pharmacological demonstration that the vulnerability is cell-cycle dependent: removing
        progenitors from cycle protects them from an otherwise unchanged chemotherapy exposure, which
        is the evidence that this is a distinct mechanistic step rather than a restatement of the trigger.'
