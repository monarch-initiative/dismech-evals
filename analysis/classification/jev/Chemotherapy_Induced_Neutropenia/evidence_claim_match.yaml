  7aa2a0705d0cc3c895a2a7bfa6f0cb9bd8069a326aceac568ba4116738ce8899:
    claim:
      about:
        disease:
          name: Chemotherapy-Induced Neutropenia
          disease_term:
            preferred_term: chemotherapy-induced neutropenia
        context: []
      assertion_type: Genetic
      assertion:
        name: TPMT pharmacogenomic susceptibility
        gene_term:
          preferred_term: TPMT
          term:
            id: hgnc:12014
            label: TPMT
        association: Reduced-function TPMT alleles increase thiopurine-associated myelosuppression risk
        relationship_type: RISK_FACTOR
        variant_origin: GERMLINE
        notes: TPMT methylates thiopurines to inactive metabolites, so reduced-function alleles leave
          more drug available for conversion to active thioguanine nucleotides. Within oncology the relevant
          agents are mercaptopurine, the backbone of acute lymphoblastic leukaemia maintenance regimens,
          and thioguanine; azathioprine, the third thiopurine covered by the same guideline, is an immunosuppressant
          rather than an antineoplastic and is out of scope for this entry.
      selected_evidence:
        snippet: Thiopurine methyltransferase (TPMT) and Nudix hydrolase 15 (NUDT15) are key enzymes that
          catabolize thiopurines. Decreased or no-function alleles in TPMT and NUDT15 are associated with
          reduced or no enzyme activity and predictive of pronounced adverse effects, including severe
          myelosuppression, that may occur among individuals treated with standard doses of thiopurines.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/2
      evidence_path: /genetic/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41618934
      reference_title: 'Clinical Pharmacogenetics Implementation Consortium (CPIC) Guideline for Thiopurine
        Dosing Based on TPMT and NUDT15 Genotypes: 2025 Update.'
      evidence_source: OTHER
      explanation: The consensus dosing guideline states the TPMT mechanism and the myelosuppression consequence.
        Evidence source is OTHER because this is a guideline rather than a primary study.
