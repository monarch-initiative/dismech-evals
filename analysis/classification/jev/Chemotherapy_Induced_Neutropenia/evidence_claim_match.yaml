      - /disease_term
    evidence_metadata:
      reference: PMID:11990381
      reference_title: UGT1A1*28 polymorphism as a determinant of irinotecan disposition and toxicity.
      evidence_source: HUMAN_CLINICAL
      explanation: Links a reduced-function allele to lower inactivation of the active metabolite and
        to greater marrow toxicity, which is the claim this node makes.
