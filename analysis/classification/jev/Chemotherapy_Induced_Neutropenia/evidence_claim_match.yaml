  877d377cd6606715dd0f3742061648c490edc24c3d8bc23ac8962cb5a7910218:
    claim:
      about:
        disease:
          name: Chemotherapy-Induced Neutropenia
          disease_term:
            preferred_term: chemotherapy-induced neutropenia
        context: []
      assertion_type: Treatment
      assertion:
        name: Trilaciclib
        description: A short-acting intravenous CDK4/6 inhibitor given before chemotherapy rather than
          as treatment for established neutropenia. It holds haematopoietic stem and progenitor cells
          in a transient, reversible G1 arrest for the duration of cytotoxic exposure, so the marrow is
          protected without altering the chemotherapy regimen. Approved in the USA in February 2021 for
          extensive-stage small cell lung cancer receiving platinum/etoposide or topotecan. This is prophylactic
          myeloprotection, mechanistically distinct from G-CSF, which accelerates recovery after the injury
          has occurred.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
