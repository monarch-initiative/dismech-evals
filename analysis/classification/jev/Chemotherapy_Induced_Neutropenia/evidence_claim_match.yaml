  4f4486e6d8ac7f760ab329245afe9f5581a0ac91e7c0968abce8b8be0e47bc60:
    claim:
      about:
        disease:
          name: Chemotherapy-Induced Neutropenia
          disease_term:
            preferred_term: chemotherapy-induced neutropenia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Host pharmacogenetic variation in cytotoxic drug inactivation
        biological_scale: MOLECULAR
        role: modifier
        description: 'How much active cytotoxic drug the marrow actually sees for a given administered
          dose is set in part by the patient''s own drug-inactivating enzymes. Reduced-function germline
          alleles in the enzyme that clears a given agent raise systemic exposure to the active species
          and so deepen the progenitor injury downstream: UGT1A1 glucuronidates SN-38, the active metabolite
          of irinotecan; dihydropyrimidine dehydrogenase, encoded by DPYD, is the rate-limiting step in
          fluorouracil catabolism; and TPMT and NUDT15 between them catabolise thiopurines. This is the
          step that pre-treatment pharmacogenomic testing acts on: it changes the starting dose rather
          than the drug, and unlike every node downstream of it, it is determined by the patient''s germline
          rather than by the treatment.'
        biological_processes:
        - preferred_term: xenobiotic metabolic process
          term:
            id: GO:0006805
            label: xenobiotic metabolic process
          modifier: DECREASED
        genes:
        - preferred_term: UGT1A1
          term:
            id: hgnc:12530
            label: UGT1A1
        - preferred_term: DPYD
          term:
            id: hgnc:3012
            label: DPYD
        - preferred_term: TPMT
          term:
            id: hgnc:12014
            label: TPMT
        - preferred_term: NUDT15
          term:
            id: hgnc:23063
            label: NUDT15
      selected_evidence:
        snippet: screening for UGT1A1*28 polymorphism may identify patients with lower SN-38 glucuronidation
          rates and greater susceptibility to irinotecan induced gastrointestinal and bone marrow toxicity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
