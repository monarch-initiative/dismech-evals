        notes: 'DPYD encodes dihydropyrimidine dehydrogenase, the rate-limiting enzyme of fluorouracil
          catabolism. Note that the enzyme phenotype and the genotype are separately measured in the founding
          series: the 3.4-fold excess of grade IV neutropenia is reported for patients with partial DPD
          enzyme deficiency, while the IVS14+1G>A allele accounts for half of the genotyped patients who
          had grade IV neutropenia. The two are related but not the same measurement.'
