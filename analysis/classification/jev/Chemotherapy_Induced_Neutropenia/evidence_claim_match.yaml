      assertion:
        name: NUDT15 pharmacogenomic susceptibility
        gene_term:
          preferred_term: NUDT15
          term:
            id: hgnc:23063
            label: NUDT15
        association: Reduced-function NUDT15 alleles increase thiopurine-associated neutropenia risk
        relationship_type: RISK_FACTOR
        variant_origin: GERMLINE
        notes: NUDT15 is one of the two enzymes that catabolise thiopurines, and the c.415C>T (p.Arg139Cys)
          allele carries most of the thiopurine-toxicity signal in East Asian populations, where TPMT
          variants are less frequent than in people of European descent while thiopurine-induced leukopenia
          is more common. The effect size is larger for leukopenia than for neutropenia in the leukaemia
          meta-analysis below, so the two endpoints should not be quoted interchangeably.
        variants:
        - name: NUDT15 c.415C>T (p.Arg139Cys)
          description: The allele carrying most of the reported thiopurine myelosuppression signal in
            acute lymphoblastic leukaemia cohorts.
      selected_evidence:
        snippet: Despite a lower frequency of TPMT mutations in Asians, the incidence of thiopurine-induced
          leukopenia is higher in Asians than in individuals of European descent.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/3
      evidence_path: /genetic/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25108385
      reference_title: A common missense variant in NUDT15 confers susceptibility to thiopurine-induced
        leukopenia.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the population asymmetry stated in the notes, which is why NUDT15 rather than
        TPMT carries most of the signal in East Asian cohorts.
