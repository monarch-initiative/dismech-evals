        association: Reduced-function UGT1A1 variants increase irinotecan-associated neutropenia risk
        relationship_type: RISK_FACTOR
        variant_origin: GERMLINE
        notes: 'Reduced UGT1A1 activity limits SN-38 glucuronidation after irinotecan exposure, increasing
          bone marrow toxicity including neutropenia. Two alleles carry most of the reported signal: *28,
          an extra TA repeat in the UGT1A1 promoter TATA sequence, and *6, whose association with severe
          irinotecan-induced neutropenia has been quantified mainly in Chinese and Japanese study populations.'
        variants:
        - name: UGT1A1*28
          description: Promoter repeat allele - an additional TA repeat in the TATA sequence - associated
            with lower SN-38 glucuronidation and increased irinotecan myelotoxicity susceptibility.
        - name: UGT1A1*6
          description: Allele associated with an increased risk of severe irinotecan-induced neutropenia
            in a meta-analysis of twelve studies.
      selected_evidence:
        snippet: Patients with recessive models (GA + AA vs. GG) of UGT1A1*6 showed an increased risk
          (OR 2.03, 95% CI 1.54-2.68; RD = 0.11, P < 0.001).
        supports: SUPPORT
