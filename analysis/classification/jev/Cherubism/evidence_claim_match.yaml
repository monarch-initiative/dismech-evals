  e28e27b5ee532654d7d4f5998deb72e7d9da44e118ab84faa07c3143b8b289cb:
    claim:
      about:
        disease:
          name: Cherubism
          disease_term:
            preferred_term: cherubism
            term:
              id: MONDO:0007315
              label: cherubism
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cherubism_mouse_systemic_vs_human_jaw_restricted
        prompt: Why is human cherubism anatomically restricted to the mandible and maxilla and self-limiting
          after puberty, whereas the Sh3bp2 knock-in mouse develops TNF-alpha-dependent systemic inflammation
          with generalized trabecular bone loss and cortical erosion? What jaw-specific and age-dependent
          factors confine the human disease and drive its spontaneous regression?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Macrophage TNF-alpha Overproduction
        - pathophysiology#Excessive Osteoclastic Bone Resorption
        rationale: 'The Sh3bp2 knock-in mouse faithfully reproduces the SH3BP2 gain-of-function, macrophage
          TNF-alpha overproduction, and osteoclast-driven bone loss, but its phenotype is systemic rather
          than jaw-restricted and does not spontaneously regress, unlike human cherubism. This mismatch
          is mechanistically important: the local factors that restrict human disease to the tooth-bearing
          jaws (e.g., dental development and eruption, jaw-specific RANKL or inflammatory signals) and
          the pubertal changes that trigger regression are not captured by the systemic mouse model, so
          the model may not predict organ-restricted human behavior or the natural history that is central
          to management.'
        proposed_experiments:
        - experiment_id: exp_cherubism_jaw_local_factors
          name: Jaw-restriction and regression factor analysis in SH3BP2 models
          description: Compare tooth-eruption-associated local RANKL, inflammatory cytokine, and osteoclastogenic
            signaling in the developing jaw versus long bones of Sh3bp2 knock-in mice and, where available,
            human cherubism lesion tissue across ages, to identify jaw-specific amplifiers and pubertal
            changes that could explain anatomic restriction and spontaneous regression.
      selected_evidence:
        snippet: proliferative fibroosseous lesions limited to the mandible and maxilla
        supports: SUPPORT
