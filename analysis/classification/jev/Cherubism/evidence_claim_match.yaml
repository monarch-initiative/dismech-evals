        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: autoinflammatory syndrome
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 7 "Autoinflammatory
          disorders", section 3 "Non-Inflammasome Related Conditions", the SH3BP2 row. Cherubism is an
          unusual member of the table because its inflammation is anatomically confined to the jaws rather
          than systemic: IUIS records the affected cells as stroma and bone cells and the functional defect
          as hyperactive macrophages with increased NF-kappaB, the same myeloid NF-kappaB axis that puts
          the other non-inflammasome entries there. This assignment sits alongside the ISDS skeletal group
          below, which covers the osteolytic bone lesion.'
      selected_evidence:
        snippet: Cherubism SH3BP2 AD 118400 Stroma cells, bone cells Hyperactive macrophage and increase
          NF -kB Bone degeneration in jaws
        supports: SUPPORT
