        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Systolic Tonsillar Piston Effect
        biological_scale: ORGANISM
        description: Each systolic filling of the brain imparts a pressure wave to intracranial CSF that
          is normally accommodated by sudden movement into the upper spinal canal. Obstructed, the tonsils
          instead thrust downward with every systole, acting as a piston on the partially isolated spinal
          CSF. The effect was seen directly on intraoperative ultrasound and disappeared immediately on
          decompression — which is the strongest causal evidence in this entry, since the mechanism and
          its reversal were observed in the same patients.
      selected_evidence:
        snippet: Immediately after surgery, the pulsatile downward thrust of the tonsils and constriction
          of the spinal cord and syrinx disappeared. Syringomyelia resolved within 1 to 6 months after
          surgery in all patients.
        supports: SUPPORT
        directness: DIRECT
    origin:
