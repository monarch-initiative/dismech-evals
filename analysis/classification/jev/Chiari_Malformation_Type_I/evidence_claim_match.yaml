    claim:
      about:
        disease:
          name: Chiari Malformation Type I
          disease_term:
            preferred_term: Chiari malformation type I
            term:
              id: MONDO:0007316
              label: Chiari malformation type I
        context:
        - path: /animal_models/0
          value:
            name: Cavalier King Charles Spaniel Chiari-like malformation
            species: Dog
            category: Naturally occurring breed-associated disease
            description: A naturally occurring, highly prevalent breed disease in which a shallow caudal
              cranial fossa — the homologue of the human posterior cranial fossa — produces cerebellar
              herniation at the foramen magnum and syringomyelia. It is the only spontaneous animal counterpart
              of CM-I, and the volumetric work in it is the closest thing to a controlled test of the
              overcrowding hypothesis that exists.
            publication: PMID:20536691
            notes: The veterinary literature calls this Chiari-LIKE malformation, and the hedging is deliberate
              on their part; it is kept here. Recorded as an animal model rather than as a separate disease
              entry.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Syringomyelia
        relationship: RECAPITULATES
        fidelity: MODERATE
        model_scale: ORGANISM
        description: Syringomyelia develops spontaneously and its transverse width correlates with the
          degree of caudal fossa overcrowding and with ventricle size.
        limitations: 'Correlational rather than interventional: no decompression arm is reported in these
          studies, so the dog data support the association between overcrowding and syrinx without testing
          reversibility the way the human intraoperative ultrasound series does.'
      selected_evidence:
        snippet: A more marked overcrowding of the CCF is associated with SM, which may explain the high
          incidence of SM in CKCS with CM.
        supports: SUPPORT
        directness: DIRECT
