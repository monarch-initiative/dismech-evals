      assertion_type: Pathophysiology
      assertion:
        name: Occipital Somite Underdevelopment
        biological_scale: TISSUE
        description: Underdevelopment of the occipital enchondral bone — specifically the exocciput and
          supraocciput — arising from the occipital somite of the paraxial mesoderm. This is the initiating
          lesion in the primary form, and it is a bone defect, not a brain defect.
        biological_processes:
        - preferred_term: endochondral ossification of the occipital bone
          modifier: DECREASED
          term:
            id: GO:0001958
            label: endochondral ossification
      selected_evidence:
        snippet: These results suggest that in adult-type Chiari malformation an underdeveloped occipital
          bone, possibly due to underdevelopment of the occipital somite originating from the paraxial
          mesoderm, induces overcrowding in the posterior cranial fossa, which contains the normally developed
          hindbrain.
        supports: SUPPORT
        directness: INDIRECT
    origin:
