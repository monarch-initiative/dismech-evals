    claim:
      about:
        disease:
          name: Chiari Malformation Type I
          disease_term:
            preferred_term: Chiari malformation type I
            term:
              id: MONDO:0007316
              label: Chiari malformation type I
        context: []
      assertion_type: Treatment
      assertion:
        name: Posterior fossa decompression with duraplasty
        description: 'Opening the dura and expanding it with a graft, in addition to the bony decompression.
          This is the live clinical question in CM-I surgery rather than a refinement: adding duraplasty
          buys better clinical improvement and fewer recurrences in patients with a syrinx, and costs
          CSF leak, aseptic meningitis and pseudomeningocele. In patients without a syrinx the meta-analysis
          finds no clinical gain, so the bone-only operation is preferred there.'
        treatment_term:
          preferred_term: posterior fossa decompression with duraplasty
          term:
            id: NCIT:C15656
            label: Neurosurgical Procedure
        therapeutic_modality: SURGERY
        notes: Curated as a separate treatment rather than as a qualifier on the bony decompression because
          the two have different indications and different complication profiles, and the choice between
          them is unsettled. The meta-analysis is pooled retrospective and prospective observational data,
          not randomised; its own conclusion calls for randomised studies.
      selected_evidence:
        snippet: PFDD can be an optimal surgical strategy because of its higher clinical improvement and
          lower recurrence rate in the patients with syringomyelia.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/1
      context_paths:
