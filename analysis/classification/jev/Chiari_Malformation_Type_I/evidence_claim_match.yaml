          value:
            name: Systolic Tonsillar Piston Effect
            biological_scale: ORGANISM
            description: Each systolic filling of the brain imparts a pressure wave to intracranial CSF
              that is normally accommodated by sudden movement into the upper spinal canal. Obstructed,
              the tonsils instead thrust downward with every systole, acting as a piston on the partially
              isolated spinal CSF. The effect was seen directly on intraoperative ultrasound and disappeared
              immediately on decompression — which is the strongest causal evidence in this entry, since
              the mechanism and its reversal were observed in the same patients.
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Syringomyelia
        causal_link_type: DIRECT
        description: The systolic pressure wave acting on the cord surface drives syrinx formation and
          progression, with no ventricle-to-syrinx communication required.
      selected_evidence:
        snippet: No patient had evidence of a patent communication between the fourth ventricle and the
          syrinx on anatomical MR images, dynamic MR images, or intraoperative ultrasound studies.
        supports: SUPPORT
        directness: DIRECT
