      assertion:
        target: Posterior Fossa Overcrowding
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: TISSUE
        description: Reproduces the volume mismatch between the caudal fossa and its contents, and links
          the degree of mismatch to syrinx formation.
        limitations: The mismatch arises differently. This entry's central claim for human CM-I is a small
          fossa containing a normally sized hindbrain; in the CKCS the fossa volume does not differ between
          affected and unaffected dogs, and what differs is the parenchyma inside it, with the breed carrying
          a relatively larger cerebellum than other small breeds. So the dog models the consequence of
          overcrowding while inverting which side of the mismatch causes it, and canine skull morphology
          is a selectively bred brachycephalic trait with no human counterpart.
      selected_evidence:
        snippet: A more marked overcrowding of the CCF is associated with SM, which may explain the high
          incidence of SM in CKCS with CM.
