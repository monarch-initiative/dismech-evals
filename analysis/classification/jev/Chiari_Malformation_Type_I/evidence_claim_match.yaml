      assertion:
        name: Craniocervical Hypermobility and Cranial Settling
        biological_scale: TISSUE
        description: 'A second, non-developmental route to the same craniocervical mechanics, seen in
          the 12.7% of CM-I patients who meet criteria for Ehlers-Danlos syndrome or a related heritable
          connective tissue disorder. Here the fossa is not the problem: occipitoatlantal and atlantoaxial
          hypermobility permits cranial settling in the upright position, which is reducible by traction
          or by lying down. It adds lower brainstem symptoms and retro-odontoid pannus to the picture,
          and it changes what surgery should address, which is why it is modelled as its own upstream
          node rather than as a comorbidity.'
      selected_evidence:
        snippet: The diagnostic criteria for Ehlers-Danlos syndrome and related HDCT were met in 357 (12.7%)
          of the 2813 cases.
