            id: UBERON:0000315
            label: subarachnoid space
      selected_evidence:
        snippet: The most consistent magnetic resonance imaging findings were obliteration of the retrocerebellar
          cerebrospinal fluid spaces (364 patients), tonsillar herniation of at least 5 mm (332 patients),
          and varying degrees of cranial base dysplasia.
        supports: SUPPORT
        directness: DIRECT
