      assertion_type: Transmission
      assertion:
        name: Airborne/respiratory droplet transmission
        description: 'VZV is transmitted primarily via the airborne route through inhalation of infectious
          aerosols or respiratory droplets from an infected individual. The virus is well-recognized as
          an airborne pathogen alongside measles and tuberculosis, requiring airborne infection isolation
          precautions (N95 respirators) in healthcare settings. The infectious period extends from 1-2
          days before rash onset until all lesions have crusted over.

          '
      selected_evidence:
        snippet: these terms are often used confusingly when discussing specific infection control interventions
          for individual pathogens that are accepted to be mostly transmitted by the airborne (aerosol)
          route (e.g. tuberculosis, measles and chickenpox)
        supports: SUPPORT
