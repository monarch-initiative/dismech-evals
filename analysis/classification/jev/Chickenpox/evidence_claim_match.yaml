          term:
            id: NCBITaxon:10335
            label: Human alphaherpesvirus 3
        description: 'VZV (human herpesvirus 3) is a neurotropic alphaherpesvirus with a biphasic lifecycle
          comprising lytic infection in permissive tissues and latent infection in sensory ganglia. VZV
          encodes immune evasion proteins (ORF61p, ORF47p, IE-62) that antagonize type I interferon signaling,
          and envelope glycoproteins (gB, gE, gH/gL, gI, gM) that mediate cell-to-cell spread and skin
          tropism. During latency, transcription is restricted to VZV latency-associated transcripts (VLTs)
          and VLT-ORF63 fusion transcripts.

          '
      selected_evidence:
        snippet: Our large scanning analysis identifies and subsequent experiments confirm 200 VZV circRNAs.
        supports: SUPPORT
