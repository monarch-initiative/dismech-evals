        description: 'During primary infection, VZV gains access to peripheral nerves and sensory ganglia,
          establishing lifelong latency in cranial nerve and dorsal root ganglia neurons. Latency is characterized
          by highly restricted viral transcription dominated by VZV latency-associated transcripts (VLTs)
          and VLT-ORF63 fusion transcripts, while most lytic genes are silenced. The virus may reactivate
          decades later as herpes zoster, particularly with aging or immunosuppression.

          '
        cell_types:
