      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mpox (monkeypox)
        description: 'Mpox presents with a vesiculopustular rash that can closely mimic varicella. Both
          diseases feature fever and progressive skin lesions that evolve through macules, papules, vesicles,
          and crusts. The 2022 global outbreak increased clinical overlap concerns.

          '
        disease_term:
          preferred_term: monkeypox
          term:
            id: MONDO:0002594
            label: monkeypox
        distinguishing_features:
        - Mpox lesions are typically deeper, firmer, and progress synchronously (same stage)
        - Prominent lymphadenopathy is characteristic of mpox but not varicella
        - Mpox has a longer incubation period (5-21 days vs 10-21 days)
        - Varicella lesions appear in successive crops with multiple stages simultaneously
      selected_evidence:
        snippet: Although Mpox may mimic other diseases such as chickenpox or syphilis, lymphadenopathy
          is a distinguishing feature.
        supports: SUPPORT
