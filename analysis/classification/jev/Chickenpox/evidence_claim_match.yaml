        name: Vertical transmission
        description: 'Maternal varicella infection during pregnancy can result in transplacental transmission
          to the fetus. Infection in the first or second trimester may cause congenital varicella syndrome,
          while maternal infection around delivery (5 days before to 2 days after birth) can result in
          severe neonatal varicella with mortality up to 30% without treatment.

          '
      selected_evidence:
        snippet: Early commencement of acyclovir is recommended for children with both varicella and altered
          cell mediated immunity, newborns during the first 2 weeks of life, preterm infants in the neonatal
          nursery, and severe varicella or shingles (including ocular zoster) in any patient, as well
          as during pregnancy.
        supports: SUPPORT
