          to rash onset. The secondary viremia seeds the virus to the skin and mucous membranes, producing
          the characteristic vesicular exanthem. Concurrent innate immune evasion through IRF3 antagonism
          (by ORF61p, ORF47p, and IE-62) and suppression of type I interferon signaling facilitates systemic
          spread.

          '
