        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_il17ra_blockade_untested_in_human_chikungunya
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is IL-17RA blockade a viable therapeutic strategy in chikungunya, and what would have
          to be shown before it could be curated as a treatment?
        rationale: 'Brodalumab is an approved IL-17RA antagonist for plaque psoriasis, and the preprint
          reports that it raises interferon production and lowers viral replication in human cardiac fibroblasts
          and in HEK 293 cells, including when given after infection. That is a mechanistically coherent
          repurposing proposal and nothing more: there is no clinical study in chikungunya, no human safety
          or dosing data in acute arboviral infection, and the intervention is immunosuppressive in a
          setting where IL-17 also contributes to control of infection. This entry therefore deliberately
          carries no treatment record for IL-17RA blockade and records the proposal here instead, so that
          a future curator can see that the omission was a decision rather than an oversight. The bar
          for promoting it to a treatment with a target_mechanisms edge is a clinical study in infected
          patients, not a stronger preclinical result.'
        attaches_to:
        - pathophysiology#IL-17RA Signalling in Cardiac Tissue
        proposed_experiments:
        - experiment_id: exp_chikv_il17ra_blockade_clinical
          name: Controlled trial of IL-17RA blockade in acute chikungunya with cardiac involvement
          description: A randomised controlled study of IL-17RA blockade in acute chikungunya, powered
            on cardiac endpoints such as troponin, echocardiographic function and arrhythmia, with viral
            load as a mechanistic readout and explicit monitoring for the infectious complications that
            IL-17 blockade is known to carry.
      selected_evidence:
        snippet: Cardiac compromise is not so common in isolated episodes
        supports: SUPPORT
    origin:
