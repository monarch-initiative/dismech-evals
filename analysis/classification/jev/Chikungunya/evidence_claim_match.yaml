  47c52b93969df59e3ff64b8d7586a8a3bc76fdfff9afd78e6118a20e47f67a30:
    claim:
      about:
        disease:
          name: Chikungunya
          disease_term:
            term:
              id: MONDO:0017941
              label: chikungunya
            preferred_term: Chikungunya
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hmm_il17a_cardiac_interferon_arm
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does IL-17A restrain the type I interferon response in the human chikungunya-infected
          heart, or is that direction of effect an artefact of an interferon-receptor-deficient mouse?
        rationale: 'The mismatch here is unusually pointed, because the model system is compromised in
          precisely the axis the hypothesis is about. The directional claim rests on a heterozygous interferon
          alpha, beta and gamma receptor-deficient mouse, so the interferon response being measured is
          already operating at reduced receptor dosage; whether the same restraint would be visible, or
          would matter, in a fully interferon-competent host is not established. The human arm of the
          same source is primary cardiac fibroblast culture, which supplies the correct species and cell
          type but no immune compartment, no vasculature and no chronic timescale. On the peer-reviewed
          side there is a clean separation of what is known: elevated IL-17 in patient sera, and IL-17A
          dependence of joint and muscle inflammation in mice, neither of which speaks to interferon or
          to the heart. Note also that the source is a preprint and has not been peer reviewed, so the
          usual caution about a single unreviewed result applies on top of the model question.'
        attaches_to:
        - pathophysiology#Restrained Cardiac Type I Interferon Response
        - pathophysiology#IL-17RA Signalling in Cardiac Tissue
        proposed_experiments:
        - experiment_id: exp_chikv_il17a_interferon_competent_host
          name: IL-17A blockade in an interferon-competent chikungunya cardiac model
          description: Repeat the IL-17RA blockade and Il17a deletion experiments in an immunocompetent
            mouse cardiac infection model of the kind used to establish MAVS dependence, measuring cardiac
            interferon output and viral burden. If the interferon restraint is real rather than a consequence
            of reduced receptor dosage, it should be recoverable in a host with an intact receptor complement.
        - experiment_id: exp_chikv_human_cardiac_il17_tissue
          name: IL-17 and interferon signatures in human chikungunya cardiac tissue
          description: Measure IL-17A and type I interferon signatures in myocardial tissue or pericardial
            fluid from patients with chikungunya-associated cardiac disease, with arboviral and non-arboviral
            myocarditis comparators. The human evidence at present is serum cytokine measurement in a
            musculoskeletal disease cohort, which cannot localise either signal to the heart.
      selected_evidence:
        snippet: Using a novel heterozygous interferon receptor-deficient mouse model
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PPR:PPR1294570
      evidence_source: MODEL_ORGANISM
      explanation: 'The authors'' own statement of the animal system used, which is what makes the mismatch
        explicit: the interferon claim is made in a host with an engineered interferon receptor deficiency.'
