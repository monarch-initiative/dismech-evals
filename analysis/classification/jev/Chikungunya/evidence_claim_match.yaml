      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: il17a_interferon_restraint
        hypothesis_label: IL-17A signalling restrains the cardiac type I interferon response
        status: EMERGING
        description: 'Under this model the IL-17A that chikungunya virus infection induces in the heart
          is not merely a marker of inflammation but an active brake on the antiviral response: IL-17A
          acting through IL-17RA suppresses local type I interferon production, so viral clearance from
          cardiac tissue is slowed and the resulting viral burden drives myocardial inflammation and injury.
          The prediction that distinguishes it from a bystander account is directional and testable, and
          has been tested only in a preprint so far: removing IL-17A signalling should raise interferon
          output and lower viral burden rather than simply lowering inflammation. Genetic deletion of
          Il17a or Il17ra and antibody blockade of IL-17RA both do exactly that in mouse hearts and in
          primary human cardiac fibroblasts. The status is EMERGING rather than CANONICAL because the
          only source making the interferon claim is not peer reviewed, and because the peer-reviewed
          human data show elevated circulating IL-17 in patients without establishing its direction of
          effect on interferon or on the heart.'
      selected_evidence:
        snippet: we demonstrate that IL-17A signaling facilitates CHIKV replication via suppressing antiviral
          type I interferon responses
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PPR:PPR1294570
      evidence_source: MODEL_ORGANISM
      explanation: States the hypothesis in the direction that defines this group, that IL-17A acts upstream
        of the interferon response rather than downstream of the damage.
