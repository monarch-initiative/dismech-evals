        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Restrained Cardiac Type I Interferon Response
        biological_scale: TISSUE
        mechanism_confidence: PROVISIONAL
        description: 'Clearance of chikungunya virus from the heart depends on a local type I interferon
          response raised by both infected and uninfected cardiac cells. Anything that blunts that response
          therefore converts a self-limiting cardiac infection into a persistent one. Two routes to a
          blunted response reach this node and they differ sharply in standing: loss of MAVS-dependent
          innate sensing is a peer-reviewed genetic result and has its own upstream node, whereas restraint
          by IL-17RA signalling is the emerging claim and is marked as such on its incoming edge. The
          node is PROVISIONAL because interferon insufficiency has not been measured in the hearts of
          infected humans.'
        biological_processes:
        - preferred_term: type I interferon production
          modifier: DECREASED
          term:
            id: GO:0032606
            label: type I interferon production
      selected_evidence:
        snippet: In immunocompetent mice, CHIKV is cleared from cardiac tissue without significant damage
          through the induction of a local type I interferon response from both infected and non-infected
          cardiac cells
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37537212
      evidence_source: MODEL_ORGANISM
      explanation: Establishes that the local interferon response is what normally prevents cardiac damage,
        which is what makes its restraint pathogenic.
