  e52e8d76083a39708691e07746ab9a143a647e88708145ed0b7e40ddd6134eb3:
    claim:
      about:
        disease:
          name: Chikungunya
          disease_term:
            term:
              id: MONDO:0017941
              label: chikungunya
            preferred_term: Chikungunya
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MAVS-Dependent Innate Sensing Failure
        biological_scale: MOLECULAR
        mechanism_confidence: PROVISIONAL
        description: 'Loss of signalling through the mitochondrial antiviral-signaling protein MAVS, the
          adaptor for cytoplasmic viral RNA sensing. In the model system this state is produced genetically
          rather than by the virus, which is why it is curated as an upstream host lesion with no incoming
          edge from infection: the reviewer-suggested route from cardiac infection to sensing failure
          is not something the source shows. What the source does show is the consequence — mice deficient
          in MAVS signalling fail to clear chikungunya virus from the heart — so the outgoing edge, not
          an incoming one, is where the evidence sits. PROVISIONAL because no comparable sensing lesion
          has been demonstrated in patients with chikungunya cardiac disease.'
        locations:
        - preferred_term: heart
          term:
            id: UBERON:0000948
            label: heart
        biological_processes:
        - preferred_term: cytoplasmic pattern recognition receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0002753
            label: cytoplasmic pattern recognition receptor signaling pathway
      selected_evidence:
        snippet: Using mice deficient in major innate immunity signaling components, we found that signaling
          through the mitochondrial antiviral-signaling protein (MAVS) is required for viral clearance
          from the heart
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37537212
      evidence_source: MODEL_ORGANISM
      explanation: Establishes MAVS-dependent sensing as the innate signalling step whose loss prevents
        cardiac viral clearance, and states that the deficiency is a property of the mouse rather than
        an effect of the infection.
