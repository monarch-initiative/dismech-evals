      assertion_type: Pathophysiology
      assertion:
        name: Impaired PI(3,5)P2 Synthesis
        description: VAC14 is the scaffold of the PI(3,5)P2 regulatory complex, contacting both the PIKFYVE/Fab1
          kinase and the FIG4 phosphatase. Without a functional scaffold the complex cannot generate normal
          levels of PI(3,5)P2 on endolysosomal membranes. PI(3,5)P2 levels were not measured in patient
          cells; the deficiency is inferred from the yeast and mouse work and from the vacuolation phenotype.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: VAC14
          term:
            id: hgnc:25507
            label: VAC14
        protein_complexes:
        - preferred_term: PIKFYVE-FIG4-VAC14 (PAS) complex
          term:
            id: GO:0070772
            label: PAS complex
        molecular_functions:
        - preferred_term: PIKFYVE 1-phosphatidylinositol-3-phosphate 5-kinase activity
          term:
            id: GO:0000285
            label: 1-phosphatidylinositol-3-phosphate 5-kinase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: PI(3,5)P2 biosynthesis
          term:
            id: GO:0046854
            label: phosphatidylinositol phosphate biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: 'we predict that yeast and mammalian Vac14 are composed entirely of HEAT repeats and
          demonstrate that Vac14 exerts an effect as a scaffold for the PI(3,5)P(2) regulatory complex
          by direct contact with the known regulators of PI(3,5)P(2): Fig4, Fab1, Vac7 and Atg18.'
        supports: SUPPORT
    origin:
