          supported by rescue of the fibroblast vacuole phenotype with wild-type VAC14; one adult patient''s
          missense variants instead enhanced VAC14 homodimerization without fibroblast vacuoles, so the
          functional consequence may not be uniform across alleles.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: VAC14
          term:
            id: hgnc:25507
            label: VAC14
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic compound heterozygous or homozygous alleles. Loss of function is inferred
            from wild-type cDNA rescue of patient fibroblasts.
      selected_evidence:
        snippet: The patients were compound heterozygotes for two novel variants in the VAC14 gene, p.Ala582Thr
          and p.Arg681His.
        supports: SUPPORT
