          name: childhood-onset motor and cognitive regression syndrome with extrapyramidal movement disorder
          disease_term:
            preferred_term: UBTF neuroregression syndrome
            term:
              id: MONDO:0044701
              label: childhood-onset motor and cognitive regression syndrome with extrapyramidal movement
                disorder
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ubtf_gof_vs_lof
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does UBTF E210K cause disease through gain of function (as in patient fibroblasts) or
          through impaired preinitiation-complex assembly / loss of function (as in the knock-in model),
          and which mechanism drives neuronal death?
        attaches_to:
        - pathophysiology#Enhanced UBF-rDNA Binding and Impaired Pol I Preinitiation Complex Assembly
        rationale: Patient fibroblasts show increased UBF-rDNA binding and rRNA overexpression, taken
          as gain of function, and neuronal expression of the mutant protein is lethal in Drosophila.
          In contrast, E210K knock-in cells show reduced rDNA transcription and reduced SL1 recruitment,
          and Ubtf+/- haploinsufficiency mice show only mild signs. The models therefore disagree on whether
          the net effect on rRNA transcription is up or down, and no human neuropathology is available
          to adjudicate how either translates into neuronal loss. A further caveat is that the knock-in
          readouts come from homozygous UbtfE210K/E210K cells, whereas the human disease is caused by
          a single de novo allele; a homozygous model therefore does not test the heterozygous gain-of-function
          hypothesis directly and may exaggerate any loss-of-function component.
      selected_evidence:
        snippet: We suggest the underlying cause of the UBTF-E210K syndrome is therefore a reduction in
          cooperative UBTF1-SL1 promoter recruitment that may be partially compensated by enhanced rDNA
          activation.
        supports: SUPPORT
