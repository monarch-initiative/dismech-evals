            publication: PMID:35139074
            description: Homozygous UbtfE210K/E210K mice are viable but develop behavioral abnormalities
              that worsen with increasing postnatal age (the detailed organismal phenotype is reported
              elsewhere). The molecular readouts curated here come from cultured UbtfE210K/E210K mouse
              embryonic fibroblasts (MEFs), which show enhanced UBTF1 splice variant and more active rDNA
              copies but reduced rDNA transcription and reduced SL1 promoter recruitment, interpreted
              as a loss-of-function contribution partly compensated by enhanced rDNA activation. This
              informs the molecular mechanism at the preinitiation-complex node.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Enhanced UBF-rDNA Binding and Impaired Pol I Preinitiation Complex Assembly
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        model_scale: MOLECULAR
        description: Recapitulates the impaired cooperative UBTF1-SL1 recruitment and altered rDNA transcription
          attributed to the variant.
        limitations: Cell-level readouts from cultured MEFs; the mice do show age-progressive behavioral
          abnormalities, but the readouts curated here do not capture the cerebral/cerebellar neuroregression
          of the human disease. Crucially, this is a homozygous (UbtfE210K/E210K) model, so it does not
          test the heterozygous, single-allele de novo gain-of-function hypothesis on which the human
          disease rests, and the loss-of-function contribution it points to is in apparent tension with
          the gain-of-function data from patient fibroblasts.
      selected_evidence:
        snippet: E210K knock-in cells show enhanced levels of the UBTF1 splice variant and a concomitant
          increase in active rDNA copies. In contrast, they also display reduced rDNA transcription and
          promoter recruitment of SL1.
