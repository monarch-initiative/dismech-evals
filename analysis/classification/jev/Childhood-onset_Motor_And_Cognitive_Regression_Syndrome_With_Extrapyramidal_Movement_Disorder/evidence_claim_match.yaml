        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: The disorder is autosomal dominant and, in essentially all reported individuals,
          caused by the recurrent UBTF c.628G>A (p.Glu210Lys) variant arising de novo. Because the variant
          is de novo, sibling recurrence risk is low, with residual risk from parental germline mosaicism,
          which has not been documented.
      selected_evidence:
        snippet: In seven unrelated affected individuals, all suffering from developmental regression
          starting at 2.5-7 years, we identified a heterozygous variant, c.628G>A in UBTF, encoding p.Glu210Lys
          in UBF, which occurred de novo in all cases.
        supports: SUPPORT
