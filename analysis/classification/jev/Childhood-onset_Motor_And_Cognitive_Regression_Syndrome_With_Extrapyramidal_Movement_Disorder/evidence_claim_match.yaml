                label: UBTF
            relationship_type: CAUSATIVE
            variant_origin: DE_NOVO
            gene_disease_validity:
            - validity_classification: DEFINITIVE
              classified_by: CLINGEN
              external_id: CGGV:assertion_1a5d6060-b955-49a0-9804-265838495310-2023-08-16T190000.000Z
            features: UBTF encodes the upstream binding transcription factor (UBF), an RNA polymerase
              I general transcription initiation factor for ribosomal DNA. The recurrent E210K variant
              in HMG-box 2 confers a molecular gain of function on UBF, with increased rDNA-promoter binding
              and overexpression of rRNA.
            notes: The only ClinGen Gene-Disease Validity assertion for this pair is the Definitive classification
              recorded in gene_disease_validity above; no other external classification was copied.
          role: ancestor
      assertion_type: Variant
      assertion:
        name: p.Glu210Lys (c.628G>A)
        description: Recurrent heterozygous de novo missense variant NM_014233:c.628G>A (p.Glu210Lys,
          E210K) in the second HMG-box homology domain of UBF. The substitution yields a positively charged
          stretch of three lysine residues and strengthens UBF binding to negatively charged DNA. It is
          absent from population databases and reported as pathogenic.
        variant_type: single nucleotide variant
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: we describe 4 patients with very similar patterns of neuroregression due to recurrent
          de novo mutations in UBTF
        supports: SUPPORT
