      assertion:
        name: Enhanced Thalamic T-type Calcium Current
        description: Low-threshold (T-type) calcium currents in thalamic relay and reticular neurons promote
          low-threshold calcium spikes and rebound burst firing. An enhanced or dysregulated T-type current
          lowers the threshold for the rhythmic bursting that underlies spike-wave oscillation. This node
          captures the single concept of the pro-oscillatory calcium current.
        role: mediator
        conforms_to: epilepsy_excitation_inhibition_imbalance#Ion Channel and Synaptic Dysfunction
        cell_types:
        - preferred_term: Thalamic excitatory neuron
          term:
            id: CL:4023068
            label: thalamic excitatory neuron
        biological_processes:
        - preferred_term: Regulation of membrane potential
          term:
            id: GO:0042391
            label: regulation of membrane potential
          modifier: INCREASED
      selected_evidence:
        snippet: would increase firing of neurons, with three of them inducing oscillations at similar
          frequencies, as observed during absence seizures
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
