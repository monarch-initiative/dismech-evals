      assertion_type: HarrisonsChapterAssignment
      assertion:
        classification_value: GENETICS_ENVIRONMENT_DISEASE
        notes: Secondary Part only. CAE susceptibility is largely complex/polygenic (CACNA1H, GABRG2,
          GABRB3, GABRA1), so this tags the genetic axis of the syndrome rather than a single-gene etiology.
          The monogenic SLC2A1 (GLUT1 deficiency) subset is captured in the genetic section.
      selected_evidence:
        snippet: In 2017, the International League Against Epilepsy (ILAE) Classification of Epilepsies
          described the "genetic generalized epilepsies" (GGEs), which contained the "idiopathic generalized
          epilepsies" (IGEs). The goal of this paper is to delineate the four syndromes comprising the
          IGEs, namely childhood absence epilepsy, juvenile absence epilepsy, juvenile myoclonic epilepsy,
          and epilepsy with generalized tonic-clonic seizures alone.
        supports: SUPPORT
