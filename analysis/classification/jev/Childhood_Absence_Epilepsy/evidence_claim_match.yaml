      assertion_type: Pathophysiology
      assertion:
        name: Genetic Susceptibility to Absence Epilepsy
        description: CAE has a strong genetic basis that is usually complex (polygenic) rather than single-gene.
          Variants affecting thalamic T-type calcium channels (e.g., CACNA1H) and GABA-A receptor subunits
          (e.g., GABRG2, GABRB3) shift the excitation-inhibition balance of the thalamocortical circuit
          toward abnormal oscillation. This node captures the single concept of the predisposing genetic
          variation.
        role: trigger
        gene:
          preferred_term: CACNA1H
          term:
            id: hgnc:1395
            label: CACNA1H
      selected_evidence:
        snippet: The two main phenotypes were childhood absence epilepsy (CAE) and febrile seizures (FS)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11326275
      reference_title: Mutant GABA(A) receptor gamma2-subunit in childhood absence epilepsy and febrile
        seizures.
      evidence_source: HUMAN_CLINICAL
      explanation: A GABA-A receptor gamma-2 subunit mutation segregated with childhood absence epilepsy
        in a large family, implicating GABAergic genes in susceptibility.
