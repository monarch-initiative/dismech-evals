      assertion_type: Discussion
      assertion:
        discussion_id: cae-attention-cognition-mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Absence Seizures
        - pathophysiology#Abnormal Thalamocortical Oscillation and Hypersynchrony
        prompt: Although childhood absence epilepsy is often called benign, many children have attentional
          and subtle cognitive difficulties. Are these caused directly by recurrent spike-wave activity
          disrupting attention networks (and therefore potentially reversible with seizure control), or
          do they reflect a shared genetic/developmental substrate independent of the seizures themselves?
        rationale: Attentional dysfunction is prominent in childhood absence epilepsy and is also modulated
          by drug choice, but pre-treatment deficits suggest a disease-intrinsic component. Distinguishing
          a seizure-driven mechanism from a shared developmental substrate would change how aggressively
          seizure freedom is pursued for cognitive protection.
        proposed_experiments:
        - experiment_id: cae-attention-longitudinal
          name: Longitudinal attention and seizure-burden study
          description: Follow newly diagnosed, treatment-naive children with absence epilepsy with serial
            neuropsychological testing and EEG spike-wave quantification, testing whether attentional
            performance tracks spike-wave burden and improves with seizure control independent of medication
            effects.
          readouts:
          - name: Attention scores versus spike-wave burden over time
            target: pathophysiology#Absence Seizures
          would_support:
          - pathophysiology#Absence Seizures
      selected_evidence:
        snippet: Attentional dysfunction was more common with valproic acid than with ethosuximide
        supports: SUPPORT
