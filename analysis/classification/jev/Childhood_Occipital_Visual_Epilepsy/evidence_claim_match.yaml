      assertion_type: DifferentialDiagnosis
      assertion:
        name: Migraine with Aura
        disease_term:
          preferred_term: migraine with aura
          term:
            id: MONDO:0005475
            label: migraine with aura
        description: The most common and most consequential misdiagnosis, because the visual symptom plus
          headache maps onto migraine so naturally that children are often treated for migraine for years.
          The two conditions may also genuinely coexist.
        distinguishing_features:
        - Seizure imagery is elementary, multicoloured and circular, whereas migraine aura is classically
          achromatic, linear and zigzag.
        - Seizure duration is seconds to a few minutes, whereas migraine aura typically builds over five
          to twenty minutes.
        - Occipital spikes with fixation-off sensitivity on the electroencephalogram.
        - Ictal blindness and eye deviation are seizure features rather than aura features.
      selected_evidence:
        snippet: Idiopathic childhood occipital epilepsy of Gastaut is frequently misdiagnosed as migraine
          with visual aura, acephalgic, or basilar migraine.
        supports: SUPPORT
