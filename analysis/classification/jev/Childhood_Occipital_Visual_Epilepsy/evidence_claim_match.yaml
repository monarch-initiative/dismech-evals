            id: MONDO:0020307
            label: self-limited epilepsy with autonomic seizures
        description: The other occipital-associated self-limited epilepsy of childhood, historically called
          Panayiotopoulos syndrome. Both may show occipital spikes, but the syndromes are otherwise almost
          opposite in presentation.
        distinguishing_features:
        - Onset is earlier, typically in the preschool years rather than mid-childhood.
        - Seizures are autonomic, dominated by vomiting and pallor, rather than visual.
        - Seizures are infrequent, prolonged and often nocturnal, rather than brief, frequent and diurnal.
        - Consciousness is often impaired, whereas it is characteristically preserved in visual seizures.
      selected_evidence:
        snippet: 'Epilepsy syndromes beginning in childhood have been divided into three categories: (1)
          self-limited focal epilepsies, comprising four syndromes: self-limited epilepsy with centrotemporal
          spikes, self-limited epilepsy with autonomic seizures, childhood occipital visual epilepsy,
