      assertion_type: Inheritance
      assertion:
        name: Presumed genetic, no established locus
        description: The syndrome is grouped with the self-limited focal epilepsies of childhood, which
          as a family show familial clustering and are presumed to have a genetic contribution, but no
          causative gene or susceptibility locus has been established specifically for childhood occipital
          visual epilepsy. Family history of epilepsy is recorded as a clinical variable in outcome studies
          rather than as an established mechanism. No inheritance_term is bound because the mode of inheritance
          is not known, and binding a Mendelian mode here would assert more than the literature supports.
      selected_evidence:
        snippet: 'The following clinical characteristics were evaluated: gender, patient age at seizure
          onset, history of febrile seizures and migraine, family history of epilepsy, duration and seizure
          manifestations, circadian distribution and frequency of seizures, history of medications including
          the number of drugs, therapeutic response and final outcome.'
        supports: SUPPORT
    origin:
      assertion_path: /inheritance/0
      evidence_path: /inheritance/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26498733
      reference_title: Clinical dissection of childhood occipital epilepsy of Gastaut and prognostic implication.
      evidence_source: HUMAN_CLINICAL
      explanation: Family history of epilepsy is treated as a clinical variable to be collected, which
        is the level at which heritability is currently discussed for this syndrome. It supports the presumption
        of a genetic contribution without establishing a locus.
