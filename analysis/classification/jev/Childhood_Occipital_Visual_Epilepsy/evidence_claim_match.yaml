  ce3f1147574f8cfdd4528e92c4ab78c577cad2cdc9b3b99f0aebe60911b18357:
    claim:
      about:
        disease:
          name: Childhood Occipital Visual Epilepsy
          disease_term:
            preferred_term: childhood occipital visual epilepsy
            term:
              id: MONDO:0020308
              label: childhood occipital visual epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cove_why_some_do_not_remit
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do about a third of children with childhood occipital visual epilepsy fail to remit,
          and is the coexistence of another epileptic syndrome the cause of the worse outcome or a marker
          of a different underlying condition that was misclassified as this syndrome?
        attaches_to:
        - pathophysiology#Age-Dependent Remission of the Epileptogenic State
        rationale: The syndrome is defined as self-limited, but the self-limitation is statistical rather
          than absolute, since roughly a third are still having seizures at sixteen. The largest long-term
          cohort found that the split runs along a specific line, namely whether the occipital epilepsy
          occurs in isolation or alongside another epileptic syndrome, with the latter group responding
          worse to monotherapy and being less often seizure-free at the end of follow-up. That finding
          admits two readings. It may be that having a second epileptic process genuinely worsens the
          trajectory of the occipital one, through a more widely excitable cortex. Or it may be that the
          presence of a second syndrome indicates the child never had the self-limited entity in the first
          place, and was carrying a broader epilepsy of which the occipital seizures were one expression.
          Nothing in the existing data separates these, because the classification was made at referral
          rather than by a mechanism test, and no molecular or physiological marker of the syndrome exists
          to adjudicate membership independently of the clinical picture.
        proposed_experiments:
        - experiment_id: cove_outcome_stratification_prospective
          name: Prospective stratification by isolated versus syndrome-associated status
          description: A prospective cohort recruited at diagnosis rather than at referral, classified
            as isolated or syndrome-associated by protocol at entry, with the second syndrome ascertained
            by prolonged electroencephalography rather than by history, followed to age eighteen for seizure
            freedom and electroencephalographic resolution.
          decision_criterion: If the outcome difference persists when the second syndrome is ascertained
            rigorously at entry, the coexistence is doing causal work. If the difference shrinks substantially
            when classification is made by protocol rather than at referral, the finding was largely a
            misclassification artefact.
        - experiment_id: cove_remission_predictors_electrographic
          name: Electrographic predictors of remission
          description: Serial electroencephalography through adolescence in a cohort with this syndrome,
            testing whether features of the occipital discharge at diagnosis, such as its spatial extent,
            whether it remains strictly unilateral, and the strength of fixation-off gating, predict which
            children remit and which do not.
          decision_criterion: An electrographic feature at diagnosis that predicts non-remission would
            identify a mechanistically distinct subgroup within the current syndrome definition. Absence
            of any predictive feature would suggest the non-remitting third differ by something not visible
            on scalp recording.
      selected_evidence:
        snippet: Patients usually respond well to antiepileptic medication and about two-thirds remit
          by the age of 16 years.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19955346
      reference_title: 'Idiopathic childhood occipital epilepsy of Gastaut: a review and differentiation
        from migraine and other epilepsies.'
      evidence_source: HUMAN_CLINICAL
      explanation: 'Establishes the size of the non-remitting group, which is what the gap is about: a
        third of children do not follow the self-limited course the syndrome name implies.'
