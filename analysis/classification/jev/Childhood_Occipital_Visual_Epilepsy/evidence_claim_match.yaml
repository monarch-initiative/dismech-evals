              label: childhood occipital visual epilepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Age-Dependent Hyperexcitability of the Occipital Cortex
        biological_scale: TISSUE
        description: 'The proximal state of the syndrome is a transient, age-restricted hyperexcitability
          confined to the occipital cortex. It is inferred rather than measured directly: the seizures
          are occipital in origin, the interictal discharges are occipital, the brain is structurally
          normal on imaging, and the whole state appears in childhood and disappears by mid-adolescence
          in most patients. Nothing about the substrate is known at the molecular level, which is why
          this node carries cellular and anatomical annotation but no gene and no named molecular lesion.'
        locations:
        - preferred_term: occipital lobe
          term:
            id: UBERON:0002021
            label: occipital lobe
        cell_types:
        - preferred_term: cortical pyramidal neuron
          term:
            id: CL:0000598
            label: pyramidal neuron
        biological_processes:
        - preferred_term: neuronal action potential
          term:
            id: GO:0019228
            label: neuronal action potential
          modifier: INCREASED
      selected_evidence:
        snippet: The electroencephalography is the only investigation with abnormal results, showing occipital
          spikes and often occipital paroxysms demonstrating fixation-off sensitivity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
