  520c1bc03bd6a29ea9112f780f599c18ab516d2b5376764f5aec37450947068c:
    claim:
      about:
        disease:
          name: Childhood Occipital Visual Epilepsy
          disease_term:
            preferred_term: childhood occipital visual epilepsy
            term:
              id: MONDO:0020308
              label: childhood occipital visual epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cove_migraine_shared_substrate
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Does the post-ictal headache of childhood occipital visual epilepsy arise because the
          seizure recruits the same trigeminovascular machinery that produces migraine headache, or do
          the two conditions share an underlying occipital cortical hyperexcitability and simply co-occur?
        attaches_to:
        - pathophysiology#Post-Ictal Headache
        rationale: 'The syndrome is misdiagnosed as migraine often enough that the overlap cannot be dismissed
          as coincidence of symptom vocabulary. Two mechanistic accounts are available. On the first,
          the occipital seizure is an intracortical event that, like the cortical event thought to underlie
          migraine aura, is capable of activating trigeminovascular afferents and thereby generating a
          headache with migrainous character. On the second, an inherited tendency to occipital cortical
          hyperexcitability predisposes to both epileptic visual seizures and migraine aura in the same
          children, and the headache after a seizure is a genuinely migrainous attack that has been triggered
          rather than a post-ictal phenomenon. These have different consequences: the first predicts that
          suppressing seizures should abolish the headaches, the second predicts that headaches should
          persist at some rate after seizures are controlled. This entry models the association without
          asserting either.'
        proposed_experiments:
        - experiment_id: cove_headache_after_seizure_control
          name: Headache trajectory after seizure control
          description: Longitudinal follow-up of children whose visual seizures are fully controlled on
            medication, tracking headache frequency and phenotype before and after control, using standardized
            headache criteria rather than clinical impression.
          decision_criterion: Near-complete resolution of headache alongside seizure control supports
            the seizure-triggered account. Persistence of migrainous headache at a rate above the population
            baseline after seizures stop supports the shared-substrate account.
        - experiment_id: cove_migraine_family_history_enrichment
          name: Family history and comorbid migraine enrichment
          description: Systematic ascertainment of personal and family history of migraine in a cohort
            with this syndrome against matched children with a non-occipital self-limited focal epilepsy,
            testing whether migraine burden is specifically enriched in the occipital syndrome rather
            than in childhood epilepsy generally.
          decision_criterion: Enrichment specific to the occipital syndrome would support a shared occipital
            substrate. Comparable migraine burden across focal epilepsy syndromes would argue that the
            association is with epilepsy in general rather than with occipital excitability.
      selected_evidence:
        snippet: Idiopathic childhood occipital epilepsy of Gastaut is frequently misdiagnosed as migraine
          with visual aura, acephalgic, or basilar migraine.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19955346
      reference_title: 'Idiopathic childhood occipital epilepsy of Gastaut: a review and differentiation
        from migraine and other epilepsies.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the clinical overlap that the question is about, and that it is systematic
        rather than occasional.
