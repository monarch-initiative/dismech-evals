          of the syndrome. Forward spread to oculomotor territory gives eye deviation and oculoclonic
          movements; further spread gives the hemiconvulsive or, rarely, bilateral convulsive seizures
          that occur in a minority. Impairment of consciousness is characteristically rare, which is itself
          an argument that propagation is usually limited.
