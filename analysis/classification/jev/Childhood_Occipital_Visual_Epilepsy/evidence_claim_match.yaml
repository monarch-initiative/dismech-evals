              label: childhood occipital visual epilepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ictal Recruitment of Striate and Extrastriate Visual Cortex
        biological_scale: TISSUE
        description: When the discharge recruits visual cortex, the patient experiences what that cortex
          represents. Recruitment of striate and early extrastriate territory produces elementary rather
          than formed imagery, which is why the hallucinations are small coloured circles rather than
          faces or scenes; spread that suppresses rather than activates the same territory produces loss
          of vision. Both are positive evidence that the seizure is occupying visual cortex, and the elementary
          character of the imagery is the argument that onset is early in the visual hierarchy.
        locations:
        - preferred_term: primary visual cortex
          term:
            id: UBERON:0002436
            label: primary visual cortex
      selected_evidence:
        snippet: The typical clinical features are visual seizures that typically consist of brief elementary
          visual hallucinations, which are mainly multicolored and circular.
        supports: SUPPORT
