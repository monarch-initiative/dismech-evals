  d6c9a219015760c8b608b41bd7f7b26f95389eab6aea3b519c8ce146d0094cdc:
    claim:
      about:
        disease:
          name: Childhood Occipital Visual Epilepsy
          disease_term:
            preferred_term: childhood occipital visual epilepsy
            term:
              id: MONDO:0020308
              label: childhood occipital visual epilepsy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Fixation-Dependent Gating of Occipital Discharges
        biological_scale: TISSUE
        description: The most mechanistically interesting feature of the syndrome is that the epileptic
          discharge is switched on and off by whether the eyes are fixating. Eliminating central vision
          and fixation, by eye closure in the dark or with fixation-abolishing lenses, releases occipital
          paroxysms; restoring fixation suppresses them. This is called fixation-off sensitivity. The
          physiological reading is that the same occipital circuitry that generates the alpha rhythm and
          is normally suppressed by visual input is, in these children, released into paroxysmal activity
          when that input is removed. Whether this gating is part of the causal chain to seizures or is
          a marker of occipital excitability that rarely produces seizures by itself is genuinely unsettled,
          and is curated as a controversy rather than asserted here.
        locations:
        - preferred_term: primary visual cortex
          term:
            id: UBERON:0002436
            label: primary visual cortex
        biological_processes:
        - preferred_term: visual perception
          term:
            id: GO:0007601
            label: visual perception
          modifier: ABNORMAL
      selected_evidence:
        snippet: A 7-year-old boy presented with episodic blindness for the last 2 months with occipital
          paroxysms and fixation-off sensitivity on electroencephalography (EEG). The clinico-EEG features
          were suggestive of idiopathic childhood occipital epilepsy of Gastaut.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24810088
      reference_title: Fixation-off sensitivity in idiopathic childhood occipital epilepsy of Gastaut.
      evidence_source: HUMAN_CLINICAL
      explanation: A worked case in which fixation-off sensitivity and occipital paroxysms co-occur with
        the clinical syndrome, supporting the gating phenomenon as a real feature of this specific epilepsy.
