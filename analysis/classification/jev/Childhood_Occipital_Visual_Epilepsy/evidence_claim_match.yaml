      assertion_type: DifferentialDiagnosis
      assertion:
        name: Structural Occipital Lobe Epilepsy
        description: Focal epilepsy of occipital origin caused by a visible lesion such as a cortical
          malformation, gliosis, tumour or occipital calcification. The seizures can be clinically indistinguishable,
          which is precisely why imaging is mandatory. No MONDO disease_term is bound because this is
          a lesional category rather than a single named entity.
        distinguishing_features:
        - Abnormal brain magnetic resonance imaging showing an occipital lesion.
        - Seizures may be drug-resistant rather than responsive to monotherapy.
        - No age-dependent remission.
        - Neurological examination or visual field testing may be abnormal between seizures.
      selected_evidence:
        snippet: Differentiation from symptomatic occipital epilepsy, particularly when children are otherwise
          normal, can be difficult.
        supports: SUPPORT
