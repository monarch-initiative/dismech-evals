      assertion_type: Pathophysiology
      assertion:
        name: Post-Ictal Headache
        biological_scale: ORGANISM
        description: 'Headache follows the seizure often enough, and closely enough, that the whole syndrome
          is routinely mistaken for migraine with visual aura. The mechanism of the headache is not established.
          Two readings are available and are not mutually exclusive: the seizure may recruit trigeminovascular
          machinery in the way experimental cortical events do, or the two conditions may share a substrate
          of occipital cortical hyperexcitability and simply co-occur. This entry models the association
          and declines to assert the mechanism.'
      selected_evidence:
        snippet: Idiopathic childhood occipital epilepsy of Gastaut is frequently misdiagnosed as migraine
          with visual aura, acephalgic, or basilar migraine.
        supports: SUPPORT
