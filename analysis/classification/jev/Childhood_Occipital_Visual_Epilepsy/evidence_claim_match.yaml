      - /disease_term
    evidence_metadata:
      reference: PMID:19955346
      reference_title: 'Idiopathic childhood occipital epilepsy of Gastaut: a review and differentiation
        from migraine and other epilepsies.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the abnormality is electrical and occipital, and that no structural
