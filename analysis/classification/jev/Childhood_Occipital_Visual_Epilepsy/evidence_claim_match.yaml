          that happens to travel with the syndrome?
        attaches_to:
        - pathophysiology#Fixation-Dependent Gating of Occipital Discharges
        rationale: 'Fixation-off sensitivity is the most distinctive electrographic feature of this syndrome
          and it is tempting to read it mechanistically: removing visual input releases the occipital
          cortex, the cortex discharges, and the discharge becomes a seizure. The difficulty is that when
          the phenomenon is searched for systematically outside this syndrome, it turns up in a wide range
          of unrelated epilepsies, and in that setting it is remarkably poor at producing actual seizures.
          In a twelve-year video-electroencephalography series that deliberately excluded children with
          idiopathic occipital paroxysms, only one patient had a seizure documented as induced by the
          fixation-off state. If fixation-off sensitivity were straightforwardly seizure-generating, that
          number should be higher. The alternative reading is that fixation-off sensitivity reports on
          the state of occipital excitability without itself driving the transition to seizure, in which
          case it is a superb biomarker and a poor mechanism. The distinction matters practically, because
          a causal reading would predict that manipulating fixation could be therapeutic, and a marker
          reading predicts it would not.'
        proposed_experiments:
        - experiment_id: cove_fos_seizure_induction_yield
          name: Prospective quantification of seizure induction by fixation-off within this syndrome
          description: Prolonged video-electroencephalography in a prospective cohort of children meeting
            current criteria for childhood occipital visual epilepsy, with repeated standardized fixation-off
            manoeuvres, recording how often the fixation-off state produces a clinical visual seizure
            rather than an electrographic paroxysm alone. The comparison of interest is the ratio of electrographic
            to clinical events under fixation-off within this syndrome, against the near-zero clinical
            yield reported in other epilepsies.
          decision_criterion: A substantially higher rate of fixation-off-induced clinical seizures in
            this syndrome than in the reported non-idiopathic populations would support a causal role.
            A comparably negligible clinical yield, with electrographic paroxysms alone, would support
            the marker reading.
        - experiment_id: cove_fos_habitual_seizure_correlation
          name: Correlation of habitual seizure timing with fixation-off conditions
          description: Seizure diaries paired with ambulatory recording, testing whether habitual spontaneous
            seizures cluster around real-world fixation-eliminating conditions such as darkness, eye closure,
            or waking, rather than being distributed across the day independently of visual engagement.
          decision_criterion: Clustering of habitual seizures around fixation-eliminating conditions would
            support a causal role for the gating mechanism. A diurnal distribution unrelated to visual
            engagement, in a syndrome whose seizures are already known to be diurnal, would argue against
            it.
      selected_evidence:
        snippet: Seven of these patterns were associated with habitual seizures in seven patients, but
          actual FOS-induced seizures (absences) were documented with video EEG in only one patient; three
          others had some historical evidence suggesting that, under some circumstances, their FOS EEG
          abnormalities might generate clinical seizures.
