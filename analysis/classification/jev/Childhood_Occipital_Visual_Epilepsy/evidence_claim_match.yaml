        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Age-Dependent Remission of the Epileptogenic State
        biological_scale: ORGANISM
        description: The excitability state is not permanent. In most patients the seizures and the electroencephalographic
          abnormalities both resolve during adolescence, which is the property that puts the syndrome
          among the self-limited rather than the encephalopathic epilepsies. The resolution of the electrographic
          abnormality alongside the seizures is the strongest argument that what remits is the underlying
          substrate and not merely its clinical expression. What drives that resolution is unknown; the
          obvious candidate is normal maturation of the same occipital circuits, but nothing establishes
          it.
      selected_evidence:
        snippet: Childhood occipital epilepsy of Gastaut has an overall favourable prognosis and a good
          response to antiepileptic therapy with resolution of seizures and of electroencephalogram abnormalities.
        supports: SUPPORT
