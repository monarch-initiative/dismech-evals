  ef1435394e06aed4cae1289f51252e51dba47effed1e7d477dec9f3b2e3a9ae0:
    claim:
      about:
        disease:
          name: Childhood Occipital Visual Epilepsy
          disease_term:
            preferred_term: childhood occipital visual epilepsy
            term:
              id: MONDO:0020308
              label: childhood occipital visual epilepsy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cove_absent_genetic_basis
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the genetic basis of childhood occipital visual epilepsy, and why has no locus
          been established for it when neighbouring self-limited focal epilepsies have yielded candidate
          genes?
        attaches_to:
        - pathophysiology#Age-Dependent Hyperexcitability of the Occipital Cortex
        rationale: This entry carries no genetic section, and the absence is deliberate. The syndrome
          sits inside a family of epilepsies that is presumed genetic and shows familial clustering, and
          its age-dependent onset and remission look like a developmental genetic programme rather than
          an acquired state. Yet no gene has been established for it. Part of the reason is likely practical,
          since the syndrome is the rarest of the four self-limited focal epilepsies, so cohorts large
          enough for gene discovery are hard to assemble. Part may be substantive, if the susceptibility
          is polygenic and the occipital localization is determined by something other than the variants
          themselves. Filling this section by borrowing candidate genes from the centrotemporal syndrome
          would be fabrication, so the gap is recorded here instead.
        proposed_experiments:
        - experiment_id: cove_multicentre_sequencing_cohort
          name: Multicentre sequencing cohort assembled on strict syndrome criteria
          description: Exome or genome sequencing of a multicentre cohort recruited strictly on current
            ILAE criteria for childhood occipital visual epilepsy, with parental samples where available,
            powered by aggregation across the centres that already contribute to the long-term outcome
            literature.
          decision_criterion: Identification of a gene or locus enriched in cases against ancestry matched
            controls would establish a genetic basis. A null result at adequate power would support a
            polygenic architecture and argue against a monogenic model.
        - experiment_id: cove_polygenic_score_transfer
          name: Transfer of self-limited focal epilepsy polygenic signal
          description: Testing whether polygenic scores derived from the better-powered self-limited epilepsy
            with centrotemporal spikes cohorts are elevated in children with the occipital syndrome, which
            would indicate shared susceptibility architecture across the family.
          decision_criterion: An elevated transferred polygenic score supports shared susceptibility with
            syndrome-specific localization determined elsewhere. No transfer would indicate the occipital
            syndrome has a distinct genetic architecture despite its nosological grouping.
      selected_evidence:
        snippet: 'Epilepsy syndromes beginning in childhood have been divided into three categories: (1)
          self-limited focal epilepsies, comprising four syndromes: self-limited epilepsy with centrotemporal
          spikes, self-limited epilepsy with autonomic seizures, childhood occipital visual epilepsy,
          and photosensitive occipital lobe epilepsy'
        supports: SUPPORT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35503717
      reference_title: 'International League Against Epilepsy classification and definition of epilepsy
        syndromes with onset in childhood: Position paper by the ILAE Task Force on Nosology and Definitions.'
      evidence_source: OTHER
      explanation: Places the syndrome inside the self-limited focal epilepsy family, which is the basis
        for the presumption of a genetic contribution and for the proposed polygenic transfer experiment.
