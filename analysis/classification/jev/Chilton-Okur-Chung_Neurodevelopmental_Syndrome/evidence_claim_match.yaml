      assertion_type: Discussion
      assertion:
        discussion_id: mouse_model_lacks_heterozygous_phenotype
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Abnormal Brain Development
        - pathophysiology#CDC42BPB Heterozygous Variant
        prompt: The only Cdc42bpb mouse model shows diaphragm and heart defects in homozygous null embryos,
          while heterozygotes, the genotype that matches the human disorder, show no morphological difference
          from wild type and were not assessed for brain or behaviour. Does a heterozygous Cdc42bpb mouse
          have any neurodevelopmental phenotype?
        rationale: The human disorder is caused by one altered allele, but the published mouse phenotypes
          are ventral diaphragmatic hernia and lethal ventricular septal defects in homozygous knockouts.
          Knock-in embryos carrying one or two copies of a patient missense variant had only minimal ventral
          diaphragm gaps. No brain imaging, neuronal morphology, or behavioural testing was reported for
          any genotype, so the model neither supports nor refutes the brain chain in this entry. The single
          human carrier studied in that work, a boy with an isolated dorsal diaphragmatic hernia, had
          normal neurodevelopment, so diaphragm and heart defects are not listed as phenotypes here.
        proposed_experiments:
        - experiment_id: exp_cdc42bpb_heterozygous_mouse_neurodevelopment
          experiment_design: TARGETED_PERTURBATION
          name: Neurodevelopmental phenotyping of heterozygous Cdc42bpb mice
          description: Assess heterozygous Cdc42bpb null and patient-variant knock-in mice for cerebellar
            vermis and corpus callosum structure, cortical and hippocampal dendrite morphology, and behaviours
            relevant to autism and learning, against wild-type littermates.
          would_support:
          - pathophysiology#Impaired Neuronal Dendrite Development
          - pathophysiology#Abnormal Brain Development
      selected_evidence:
        snippet: Homozygous loss of Cdc42bpb leads to large ventral gaps in the diaphragm with high penetrance,
          minor changes in lung morphology, and lethal heart septation defects.
        supports: SUPPORT
