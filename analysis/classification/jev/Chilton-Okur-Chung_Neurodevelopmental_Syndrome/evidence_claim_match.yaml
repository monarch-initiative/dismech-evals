      assertion:
        discussion_id: missense_variant_mechanism
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#CDC42BPB Heterozygous Variant
        - pathophysiology#Reduced MRCKbeta Actomyosin Regulation
        prompt: Do the clustered CDC42BPB missense variants reduce MRCKbeta kinase activity, as the truncating
          variants are predicted to, or do they act through a different mechanism?
        rationale: Most reported variants are missense, and four of nine in the founding series fall in
          one 20-amino-acid segment between two coiled-coil regions, with two recurrent. That clustering
          is unusual for a simple haploinsufficiency disorder. The founding report leaves the missense
          mechanism open, and no functional study of patient variants has been published, so the loss-of-function
          chain in this entry is established only for truncating alleles.
      selected_evidence:
        snippet: Future studies will help to delineate the natural history and to elucidate the underlying
          biological mechanisms of the missense variants leading to the neurodevelopmental and behavioral
          phenotypes.
        supports: SUPPORT
