          notes: LOINC:3455-3 is the method-less, Serum-or-Plasma identity code. Only the therapeutic
            target range is banded here. The fatal/toxic tier the same source reports -- "serum levels
            exceeding 50 mg/L" -- is a strict inequality, and a half-open interpretation_bands entry with
            an inclusive lower_bound at 50 would assert that a level of exactly 50 mg/L is fatal-range,
            which this citation does not state.
          interpretation_bands:
          - name: Therapeutic target range
            lower_bound: 15.0
            upper_bound: 25.0
            unit: mg/L
            abnormal_flag: NORMAL
            interpretation: The range levels should generally be maintained within to avoid grey baby
              syndrome.
      selected_evidence:
        snippet: The occurrence of grey baby syndrome is generally associated with serum levels exceeding
          50 mg/L, so levels should generally be maintained between 15 and 25 mg/L
        supports: SUPPORT
