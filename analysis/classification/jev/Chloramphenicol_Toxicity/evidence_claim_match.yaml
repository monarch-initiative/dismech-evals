        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neonatal Hepatic Glucuronidation
        description: Neonates, especially premature infants, have immature hepatic UDP-glucuronosyltransferase
          activity and immature renal excretion, so they cannot conjugate and clear chloramphenicol. A
          standard weight-based dose therefore accumulates to toxic serum concentrations - the basis of
          neonatal susceptibility to gray baby syndrome.
        biological_scale: MOLECULAR
      selected_evidence:
        snippet: Newborns, particularly preterm infants, have underdeveloped livers and relatively low
          glucuronidation capacity, making them highly susceptible to chloramphenicol toxicity and the
          highest-risk group for gray baby syndrome
        supports: SUPPORT
