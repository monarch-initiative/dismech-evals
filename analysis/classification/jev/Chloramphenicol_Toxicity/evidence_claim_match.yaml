      assertion_type: Diagnosis
      assertion:
        name: Clinical recognition and serum concentration
        description: Diagnosis rests on a temporal link to chloramphenicol exposure with a compatible
          toxidrome, supported by a serum chloramphenicol concentration; high levels predict severe toxicity
          and death, which is also the basis for therapeutic monitoring in neonates.
        measurements:
        - preferred_term: Serum chloramphenicol
          term:
            id: LOINC:3455-3
            label: Chloramphenicol [Mass/volume] in Serum or Plasma
        reference_ranges:
        - loinc_term:
            id: LOINC:3455-3
            label: Chloramphenicol [Mass/volume] in Serum or Plasma
          lower_bound: 15.0
          upper_bound: 25.0
          unit: mg/L
          population: neonates and infants, therapeutic monitoring target
          notes: LOINC:3455-3 is the method-less, Serum-or-Plasma identity code. Only the therapeutic
            target range is banded here. The fatal/toxic tier the same source reports -- "serum levels
            exceeding 50 mg/L" -- is a strict inequality, and a half-open interpretation_bands entry with
            an inclusive lower_bound at 50 would assert that a level of exactly 50 mg/L is fatal-range,
            which this citation does not state.
          interpretation_bands:
          - name: Therapeutic target range
            lower_bound: 15.0
            upper_bound: 25.0
            unit: mg/L
            abnormal_flag: NORMAL
            interpretation: The range levels should generally be maintained within to avoid grey baby
              syndrome.
      selected_evidence:
        snippet: fatal cases consistently showing serum chloramphenicol levels exceeding 50
        supports: SUPPORT
