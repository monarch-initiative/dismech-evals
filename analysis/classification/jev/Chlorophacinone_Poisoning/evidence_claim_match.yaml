  4f3e12d295081811b7ef10f6da8bba06f8b650b011ebd8b934b26a4d18bcfe55:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: Treatment
      assertion:
        name: Coagulation Factor Replacement
        description: For active bleeding, immediate replacement of the missing factors is given alongside
          vitamin K1, since vitamin K takes hours to restore carboxylation. Prothrombin complex concentrate
          is preferred because it contains exactly the four deficient factors; fresh frozen plasma is
          the fallback, and recombinant activated factor VII has also been used.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: four-factor prothrombin complex concentrate
            term:
              id: NCIT:C208347
              label: Four-factor Prothrombin Complex Concentrate
        notes: 'Thrombotic complications accompanying haemostatic therapy have been reported in this class
          of poisoning, so factor replacement is reserved for active bleeding rather than used to correct
          a number. Only four-factor prothrombin complex concentrate is bound as a therapeutic_agent.
          Recombinant activated factor VII and fresh frozen plasma, both named in the same recommendation,
          are not: no suitable term was resolved for either.'
      selected_evidence:
        snippet: Adjunctive hemostatic therapy with recombinant factor VIIa and prothrombin complex concentrate
          has been reported, and phenobarbital has been used to expedite LAAR metabolism.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/1
      evidence_path: /treatments/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
