  12ecfa1626e91275dc12c9f4226fc83a1d6278acc214fef7ef785976604191cf:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hepatic Accumulation and Prolonged Elimination
        biological_scale: ORGANISM
        description: 'Chlorophacinone is lipid-soluble, accumulates in liver and undergoes enterohepatic
          recirculation, so its biological half-life is long and grows longer with larger ingested doses.
          This is the property that separates the long-acting rodenticides from warfarin clinically, and
          it is what makes the coagulopathy last weeks rather than days. Chlorophacinone is nevertheless
          shorter-acting than the second-generation compounds: the class treatment durations reported
          in reviews are driven by brodifacoum and should not be read as a chlorophacinone expectation.'
        notes: Because enterohepatic recirculation is part of what sustains this node, interrupting it
          is a plausible therapeutic target. A bile sequestrant, cholestyramine, cut mortality from 67
          per cent to 11 per cent in a rabbit model of brodifacoum poisoning (PMID:29897553). That is
          a different compound in a different species, and no chlorophacinone data exist, so no treatment
          is curated from it. Recorded because the node names the mechanism the intervention would act
          on.
        chemical_entities:
        - preferred_term: chlorophacinone
          term:
            id: CHEBI:81796
            label: Chlorophacinone
      selected_evidence:
        snippet: Chlorophacinone accumulation in target cells or existence of an unidentified metabolite
          may explain persistence of the hypocoagulability syndrome at low plasmatic concentrations of
          chlorophacinone.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/2
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:10216974
      reference_title: Toxicological management of chlorophacinone poisoning.
      evidence_source: HUMAN_CLINICAL
      explanation: Observes that the coagulopathy outlasts measurable plasma chlorophacinone. Marked indirect
        because the authors offer tissue accumulation as one of two candidate explanations rather than
        demonstrating it.
