  719ba9c4a143314f9013b1f54cb7c7f47470bbae70740a5f8c95a70cb7d2a509:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: first_generation_versus_long_acting
        kind: INTERPRETATION
        prompt: Should chlorophacinone be curated as a first-generation anticoagulant rodenticide or as
          a long-acting anticoagulant rodenticide?
        rationale: Two authoritative sources place chlorophacinone in opposite groups, and both are right
          on their own terms. Watt and colleagues group it with the long-acting rodenticides on human
          duration of effect. Esther and colleagues list it with warfarin and coumatetralyl as first-generation,
          which is a statement about rodent potency and the number of feeds needed to kill a rat. "Generation"
          is a rodent-efficacy term and "long-acting" is a human-toxicology term, so chlorophacinone is
          first-generation by potency and long-acting by duration. The distinction matters clinically,
          because the first-generation label wrongly implies a warfarin-length course of treatment. This
          entry curates the human-toxicology reading and records the conflict rather than resolving it
          silently.
      selected_evidence:
        snippet: This group includes the second generation 4-hydroxycoumarins brodifacoum, bromadiolone,
          difenacoum, flocoumafen and the indanedione derivatives chlorophacinone and diphacinone.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:16499407
      reference_title: Anticoagulant rodenticides.
      evidence_source: OTHER
      explanation: Places chlorophacinone in the long-acting anticoagulant rodenticide group.
