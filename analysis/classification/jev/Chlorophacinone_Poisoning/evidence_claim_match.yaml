  00612d898e2bd5cecb48bc42910a8150452b11fcf7d634241e379288811f725e:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Accidental chlorophacinone poisoning in lambs
        species: Sheep
        genotype: wild type
        description: 'Eleven lambs reached old bait placed between the wall studs of their housing through
          a hole in the plywood. Two were necropsied, with chlorophacinone confirmed in liver at 0.58
          and 0.50 ppm. A second species with a confirmed chlorophacinone tissue burden, and the source
          of the tempo: these animals died within one to two hours of the first sign.'
        publication: PMID:17037620
        modeled_mechanisms:
        - target: Multicompartment Hemorrhage
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces multicompartment haemorrhage with epistaxis as the presenting sign,
            in a second ruminant species and at liver concentrations roughly sixfold below the calf series.
          limitations: An uncontrolled accidental exposure with no measured ingested dose, no coagulation
            assays, and no treatment arm. The liver concentrations differ sixfold from the calf epizootic,
            and age, species and dose timing all differ, so no lethal threshold can be derived from the
            pair. The centrilobular hepatocellular necrosis reported at necropsy is most parsimoniously
            hypoxic in an exsanguinating animal and is deliberately not curated as chlorophacinone hepatotoxicity.
            Ovine vitamin K handling, including rumen microbial synthesis, differs from human.
          readouts:
          - name: Time from first clinical sign to death
            target: Multicompartment Hemorrhage
            direction: DECREASED
            interpretation: Records how fast the haemorrhagic phase can run once it declares itself in
              a heavily exposed animal.
      selected_evidence:
        snippet: The anticoagulant chlorophacinone was detected in the livers at 0.58 ppm and 0.50 ppm
          (wet weight), respectively.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /animal_models/1
      evidence_path: /animal_models/1/evidence/0
      context_paths:
      - /name
