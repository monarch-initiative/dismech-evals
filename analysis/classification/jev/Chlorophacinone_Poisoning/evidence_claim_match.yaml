            term:
              id: CHEBI:8069
              label: phenobarbital
        notes: Recorded because it is the specific adjunct repeatedly tried in chlorophacinone poisoning,
          not because the evidence is strong. Both supporting reports are uncontrolled single-patient
          observations with historical comparators.
      selected_evidence:
        snippet: Under phenobarbital 200 mg/day, chlorophacinone exhibited an apparent elimination half-life
