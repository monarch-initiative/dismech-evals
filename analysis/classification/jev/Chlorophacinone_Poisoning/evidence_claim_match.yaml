          VII has the shortest half-life of the four, the prothrombin time and INR move first; the activated
          partial thromboplastin time follows as factors IX, X and II decline.
        notes: The order in which the four factors fall, and the resulting fact that the prothrombin time
          moves before the activated partial thromboplastin time, follows from their differing plasma
          half-lives. That is standard coagulation physiology and is not demonstrated in any source cited
          in this entry, which report the depressed factor activities without measuring the sequence.
          The ordering is stated because it explains the delayed onset and the assay pattern, not because
          a cited paper establishes it.
