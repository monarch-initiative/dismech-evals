  5fbf252c884988b2dcdfc15ef74f16df77b7fb3ea958f048aa1418969920abcd:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hepatic Accumulation and Prolonged Elimination
        biological_scale: ORGANISM
        description: 'Chlorophacinone is lipid-soluble, accumulates in liver and undergoes enterohepatic
          recirculation, so its biological half-life is long and grows longer with larger ingested doses.
          This is the property that separates the long-acting rodenticides from warfarin clinically, and
          it is what makes the coagulopathy last weeks rather than days. Chlorophacinone is nevertheless
          shorter-acting than the second-generation compounds: the class treatment durations reported
          in reviews are driven by brodifacoum and should not be read as a chlorophacinone expectation.'
        notes: Because enterohepatic recirculation is part of what sustains this node, interrupting it
          is a plausible therapeutic target. A bile sequestrant, cholestyramine, cut mortality from 67
          per cent to 11 per cent in a rabbit model of brodifacoum poisoning (PMID:29897553). That is
          a different compound in a different species, and no chlorophacinone data exist, so no treatment
          is curated from it. Recorded because the node names the mechanism the intervention would act
          on.
        chemical_entities:
        - preferred_term: chlorophacinone
          term:
            id: CHEBI:81796
            label: Chlorophacinone
      selected_evidence:
        snippet: 'The greater potency and duration of action of long-acting anticoagulant rodenticides
          is attributed to their: (i) greater affinity for vitamin K(1)-2,3-epoxide reductase; (ii) ability
          to disrupt the vitamin K(1)-epoxide cycle at more than one point; (iii) hepatic accumulation;
          and (iv) unusually long biological half-lives due to high lipid solubility and enterohepatic
          circulation.'
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:16499407
      reference_title: Anticoagulant rodenticides.
      evidence_source: OTHER
      explanation: 'Names hepatic accumulation, lipid solubility and enterohepatic circulation as the
        basis for the prolonged action of the long-acting group, to which the same review assigns chlorophacinone.
        Marked indirect because the sentence is about the class. Only clauses (iii) and (iv), hepatic
        accumulation and long biological half-life, are curated on this node. Clauses (i) and (ii), greater
        VKOR affinity and disruption of the cycle at more than one point, are deliberately not carried
        over: this entry also records that rodent-efficacy sources call chlorophacinone first-generation,
        which is a statement about lower potency, so a class-level affinity claim cannot be asserted for
        it here.'
