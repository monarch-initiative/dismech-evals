  1e127a4b98a1c9b09377efece4bcdfc2ad1dba7035093631aef497d3fd1ff6ce:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Accidental chlorophacinone poisoning in calves
        species: Cattle
        genotype: wild type
        description: Fourteen crossbred calves ingested chlorophacinone powder present in their housing.
          Three were submitted for necropsy, with chlorophacinone confirmed in liver at 2.9 to 4.2 ppm.
          This is a naturally occurring, dose-uncontrolled veterinary poisoning rather than a designed
          experimental model, and it is recorded here because it couples a confirmed chlorophacinone tissue
          burden to a documented anatomical distribution of haemorrhage.
        publication: PMID:35000500
        modeled_mechanisms:
        - target: Multicompartment Hemorrhage
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the multicompartment haemorrhage of human chlorophacinone poisoning,
            with the same agent confirmed analytically in tissue.
          limitations: An uncontrolled accidental exposure in a ruminant, with no measured ingested dose,
            no coagulation assays reported, and no treatment arm. Bovine vitamin K handling and rumen
            microbial vitamin K synthesis differ from human, so the dose-response cannot be carried across.
          readouts:
          - name: Chlorophacinone concentration in liver
            target: Multicompartment Hemorrhage
            direction: INCREASED
            interpretation: Confirms that the haemorrhage occurred against a measured chlorophacinone
              tissue burden rather than a presumed exposure.
      selected_evidence:
        snippet: Three calves were submitted to the Iowa State University Veterinary Diagnostic Laboratory
          for diagnostic evaluation following an abrupt increase in morbidity and mortality in a calf
          herd associated with epistaxis and widespread hemorrhage.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
    evidence_metadata:
