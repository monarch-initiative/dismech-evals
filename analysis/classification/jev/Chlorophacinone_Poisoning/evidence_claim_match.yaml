      assertion:
        name: International normalized ratio
        presence: PRESENT
        notes: The INR is the practical bedside measure of the coagulopathy and the quantity used to decide
          when and how long to give vitamin K1. In a poisoning that is not already bleeding, guidance
          is to measure it 36 to 48 hours after exposure, since an INR drawn earlier can still be normal.
      selected_evidence:
        snippet: 'Coagulation function tests revealed average values of aPTT, PT, and INR of aPTT: 110
          (3.71 ∼ 212) s, PT: 100 (11.6 ∼ 300) s and INR: 9 (0.98 ∼ 38.2), respectively, all significantly
          exceeding normal ranges.'
        supports: SUPPORT
        directness: INDIRECT
