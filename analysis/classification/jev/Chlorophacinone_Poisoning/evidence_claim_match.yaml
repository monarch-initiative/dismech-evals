  a34103cc4504bda94e2c23a9935aa096af7e3e3456ad4df1d119d4d2135cfe78:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: Treatment
      assertion:
        name: High-Dose Prolonged Vitamin K1 (Phytomenadione)
        description: Phytomenadione (vitamin K1) is the antidote. Supplying vitamin K from outside restores
          the carboxylase cofactor that the inhibited epoxide reductase can no longer regenerate, and
          the coagulation profile corrects within hours. Because chlorophacinone persists, the dose required
          is far above ordinary warfarin reversal doses and treatment must continue for weeks; withdrawal
          before the drug has cleared produces rebound coagulopathy.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
