  96d6b85471644605af3e0becfb2d5a1d698d82a5e9173f6b265a48165c763642:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cyp_induction_transferability
        kind: INTERPRETATION
        prompt: Does the published argument against using cytochrome P450 inducers in long-acting anticoagulant
          rodenticide poisoning apply to chlorophacinone?
        attaches_to:
        - pathophysiology#Hepatic Accumulation and Prolonged Elimination
        rationale: 'This entry curates phenobarbital enzyme induction as a reported adjunct. A published
          position argues against CYP inducers in this poisoning, but its reasoning is specific to brodifacoum,
          which the authors state does not undergo significant hepatic metabolism. Chlorophacinone does:
          three hydroxy-metabolites have been identified and metabolism is described as extensive in rat.
          The argument therefore does not obviously transfer, and the two chlorophacinone reports that
          used phenobarbital are uncontrolled single patients. Recorded as an open interpretation rather
          than settled either way, because the safety objection about sedating a bleeding patient stands
          regardless of the metabolism question.'
      selected_evidence:
        snippet: Therefore, we propose that CYP inducers should not be used to accelerate the clearance
          of brodifacoum from poisoned patients, but that alternative approaches such as reducing enterohepatic
          recirculation of brodifacoum, or using lipid emulsions to scavenge brodifacoum throughout the
          body, be considered.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/4
      evidence_path: /discussions/4/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:30689138
      reference_title: Should Cytochrome P450 Inducers be Used to Accelerate Clearance of Brodifacoum
        from Poisoned Patients?
      evidence_source: OTHER
      explanation: 'States the position being weighed, in full: the authors do not simply reject enzyme
        induction, they redirect to interrupting enterohepatic recirculation or scavenging the drug. Marked
        indirect because it is a proposal about brodifacoum, not chlorophacinone.'
