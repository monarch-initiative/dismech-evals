  b44000752cbbdb22679ddf182c9bf379cf234af0900d2be451fda10610740537:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: persistence_after_plasma_clearance
        kind: KNOWLEDGE_GAP
        prompt: Why does chlorophacinone-induced hypocoagulability persist after plasma chlorophacinone
          concentrations have fallen to low values?
        attaches_to:
        - pathophysiology#Hepatic Accumulation and Prolonged Elimination
        rationale: In a monitored human poisoning the hypocoagulability outlasted the measurable plasma
          concentration. The treating authors offered two candidate explanations, accumulation in target
          cells and an unidentified active metabolite, and distinguished neither. Which of the two operates
          determines whether plasma chlorophacinone concentration is a usable guide to stopping vitamin
          K therapy.
        proposed_experiments:
        - experiment_id: chlorophacinone_metabolite_vs_compartment
          name: Paired hepatic and plasma chlorophacinone measurement with metabolite profiling
          description: Measure chlorophacinone and its metabolites in plasma alongside INR through the
            resolution phase of human poisonings, with untargeted metabolite profiling, to determine whether
            a persisting parent compound compartment or an active metabolite accounts for the residual
            effect.
      selected_evidence:
        snippet: Extensive metabolism of chlorophacinone was also found, and was similar (in nature and
          proportion of metabolites) across strains (3 OH-metabolites identified).
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:23109180
      reference_title: Bioaccumulation of chlorophacinone in strains of rats resistant to anticoagulants.
      evidence_source: MODEL_ORGANISM
      explanation: Three hydroxy-metabolites of chlorophacinone have been identified in rat, so the metabolite
        arm of this question is not that no metabolite is known but that none has been shown active in
        humans. Marked indirect because the work is in rat.
