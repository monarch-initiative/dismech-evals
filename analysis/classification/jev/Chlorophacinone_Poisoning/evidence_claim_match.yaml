  cbffc99a3d8d9a10d08f9d45ee85ad0430edd400ee708f8e4bb2b105406172fa:
    claim:
      about:
        disease:
          name: Chlorophacinone Poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: indandione_mitochondrial_uncoupling
        kind: KNOWLEDGE_GAP
        prompt: Do indandione anticoagulants, chlorophacinone among them, uncouple oxidative phosphorylation,
          and does that contribute to human toxicity beyond the coagulopathy?
        attaches_to:
        - pathophysiology#Systemic Chlorophacinone Exposure
        rationale: 'Toxicology reference texts repeatedly describe the indandiones as uncouplers of oxidative
          phosphorylation, a property the 4-hydroxycoumarins are said to lack, and attribute cardiopulmonary
          and neurologic injury in laboratory rodents to it. The claim is not curated here because no
          primary source for it could be located: PubMed queries pairing chlorophacinone, and separately
          indandione, diphacinone and pindone, with uncoupling, mitochondria and oxidative phosphorylation
          returned no records. The gap is recorded rather than the claim, because a widely repeated mechanism
          with no retrievable primary citation is worth flagging. Note that chlorophacinone does have
          a documented off-target activity, FXR antagonism, cited below; the absent evidence is for uncoupling
          in particular, not for off-target action in general.'
        proposed_experiments:
        - experiment_id: chlorophacinone_mitochondrial_respirometry
          name: Respirometry of isolated mitochondria exposed to chlorophacinone
          description: Measure oxygen consumption, membrane potential and ATP synthesis in isolated hepatic
            and cardiac mitochondria across a chlorophacinone concentration range spanning those reached
            in human poisoning, against a 4-hydroxycoumarin comparator and a known uncoupler control,
            to establish whether the uncoupling property exists and at what concentration.
        notes: 'The cited evidence item records a different off-target mechanism rather than the uncoupling
          claim itself. No source is offered for uncoupling, because that is the point of the entry: attaching
          a reference that does not make the claim would defeat it.'
      selected_evidence:
        snippet: Our results showed that chlorophacinone and ivermectin had distinct modes of action (MOA)
          in modulating FXR-coregulator interactions and compound selectivity against the four aforementioned
          functionally-relevant nuclear receptors.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/3
      evidence_path: /discussions/3/evidence/0
      context_paths:
      - /name
    evidence_metadata:
      reference: PMID:27773686
      reference_title: Differential modulation of FXR activity by chlorophacinone and ivermectin analogs.
      evidence_source: IN_VITRO
      explanation: Chlorophacinone has a documented off-target activity, antagonism of the nuclear receptor
        FXR in a validated screen. It is cited here so this gap is not read as "chlorophacinone has no
        off-target activity"; what lacks a primary source is uncoupling specifically. Marked indirect
        because the assays are cell-based and the paper makes no claim about human poisoning.
    first_seen_at: '2026-09-25T15:19:20.604355+00:00'
    first_seen_revision: fc510ecca031fdabb75960970c310382a89bff8e
