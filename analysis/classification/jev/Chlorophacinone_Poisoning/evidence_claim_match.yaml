        kind: KNOWLEDGE_GAP
        prompt: Does loss of gamma-carboxylation of the anticoagulant proteins C and S explain the thrombotic
          events reported in anticoagulant rodenticide poisoning?
        attaches_to:
        - pathophysiology#Impaired Gamma-Carboxylation of Vitamin K-Dependent Clotting Factors
        rationale: Proteins C and S are vitamin K-dependent substrates of the same hepatic carboxylase
          as factors II, VII, IX and X, so a vitamin K antagonist depletes anticoagulant and procoagulant
          proteins together. Thrombotic events, including a fatal cerebral vein thrombosis reported as
          a suspected chlorophacinone poisoning, occur in this class and are difficult to reconcile with
          pure anticoagulation. No cited source here measures protein C or protein S activity in a chlorophacinone
