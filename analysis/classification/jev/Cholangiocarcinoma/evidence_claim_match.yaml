  53f99d893c74a94efcf1a1de8055efa970925f6f9451aeaad5d33f8e83a9d01e:
    claim:
      about:
        disease:
          name: Cholangiocarcinoma
          disease_term:
            preferred_term: cholangiocarcinoma
            term:
              id: MONDO:0019087
              label: cholangiocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Epigenetic Dysregulation
        description: IDH1/2 mutations produce the oncometabolite 2-hydroxyglutarate (2-HG), which inhibits
          alpha-ketoglutarate-dependent dioxygenases including TET2 and histone demethylases. This leads
          to DNA and histone hypermethylation, blocking cholangiocyte differentiation and promoting a
          progenitor-like state. EZH2 overexpression further drives epigenetic silencing of tumor suppressors.
          vCAF-derived IL-6 induces epigenetic alterations in CCA cells, particularly upregulating EZH2.
        biological_processes:
        - preferred_term: chromatin organization
          modifier: ABNORMAL
          term:
            id: GO:0006325
            label: chromatin organization
        - preferred_term: epigenetic regulation of gene expression
          modifier: ABNORMAL
          term:
            id: GO:0040029
            label: epigenetic regulation of gene expression
      selected_evidence:
        snippet: We observed a negative selection of RTK/RAS/ERK pathway co-alterations, and an enrichment
          of epigenetic modifiers such as ARID1A and BAP1 in patients with IDH1/2 and FGFR2 alterations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36528236
      reference_title: Charting co-mutation patterns associated with actionable drivers in intrahepatic
        cholangiocarcinoma.
      explanation: Shows that IDH1/2 and FGFR2-altered tumors co-occur with mutations in epigenetic modifiers,
        supporting epigenetic dysregulation as a key mechanism.
