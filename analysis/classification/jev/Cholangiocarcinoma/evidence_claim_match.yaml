      assertion_type: Pathophysiology
      assertion:
        name: Accumulation of Oncogenic Mutations
        description: CCA harbors a diverse mutational landscape. Common alterations include IDH1/2 mutations
          (10-20% of iCCA), FGFR2 fusions/rearrangements (10-16% of iCCA), TP53 mutations, KRAS mutations,
          ARID1A mutations, BAP1 loss, and PBRM1 mutations. The mutational profile differs by anatomic
          and pathologic subtype, with IDH and FGFR alterations enriched in small duct iCCA and KRAS mutations
          more common in large duct and extrahepatic subtypes.
        biological_processes:
        - preferred_term: regulation of cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0042127
            label: regulation of cell population proliferation
      selected_evidence:
        snippet: KRAS and PIK3CA mutations were more frequent in the large duct type, while IDH1/2 mutations
          and FGFR2 fusions were more common in the small duct type.
        supports: SUPPORT
