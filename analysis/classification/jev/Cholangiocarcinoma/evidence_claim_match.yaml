      assertion_type: Pathophysiology
      assertion:
        name: Desmoplastic Stromal Reaction
        description: CCA is characterized by a prominent desmoplastic stroma comprising cancer-associated
          fibroblasts (CAFs), extracellular matrix proteins, and inflammatory cells. Single-cell analysis
          identified six distinct fibroblast subsets, with vascular CAFs (vCAFs) dominant and expressing
          high levels of IL-6. Matricellular glycoproteins including periostin, osteopontin, and tenascin-C
          promote proliferation, invasion, EMT, and immune evasion. The dense stroma limits immune cell
          infiltration and drug delivery.
        cell_types:
        - preferred_term: cancer-associated fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: extracellular matrix organization
          modifier: INCREASED
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: the interplay between cholangiocarcinoma cells, CAFs, and TAMs in particular play a critical
          role in promoting cholangiocarcinoma progression, therapeutic resistance, and immune evasion
        supports: SUPPORT
