      assertion_type: Pathophysiology
      assertion:
        name: Hepatic Cholesterol Hypersecretion and Biliary Supersaturation
        conforms_to: cholelithiasis_biliary_supersaturation#Biliary Cholesterol Supersaturation
        role: trigger
        biological_scale: ORGANISM
        description: Hepatocytes secrete cholesterol into bile in excess of the bile salts and phospholipids
          needed to hold it in mixed micelles and vesicles, so gallbladder bile becomes supersaturated
          and physically metastable. The excess is driven by the hepatocanalicular sterol transporter
          ABCG5/G8 in the genetic form and by insulin resistance and obesity in the common metabolic form.
          This is the step that distinguishes cholesterol stones from pigment stones, which instead precipitate
          bilirubin and arise in chronic haemolysis, cirrhosis or biliary infection.
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        biological_processes:
        - preferred_term: cholesterol homeostasis
          term:
            id: GO:0042632
            label: cholesterol homeostasis
          modifier: ABNORMAL
        - preferred_term: bile acid metabolic process
          term:
            id: GO:0008206
            label: bile acid metabolic process
          modifier: ABNORMAL
      selected_evidence:
        snippet: 'Cholesterol crystal formation requires the presence of one or more of the following:
          (a) cholesterol supersaturation, (b) accelerated nucleation, or (c) gallbladder hypomotility/bile
          stasis.'
        supports: SUPPORT
    origin:
