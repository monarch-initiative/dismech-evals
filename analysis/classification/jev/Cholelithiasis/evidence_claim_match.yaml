      assertion:
        discussion_id: gap_which_silent_gallstones_become_symptomatic
        prompt: Which asymptomatic gallstones will become symptomatic or obstruct, and what distinguishes
          them from the large majority that never do?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Stone Impaction and Biliary Obstruction
        rationale: 'The edge into the impaction node is marked indirect for this reason: stone formation
          is well understood, but the transition from silent stones to biliary pain and obstruction is
          not. The natural-history review states plainly that it is not clear who will develop symptoms,
          and the only recognised predictors are diabetes and detection at laparotomy. The question is
          not academic, because the whole case for expectant management of incidental stones rests on
          the base rate rather than on any ability to identify the minority at risk.'
      selected_evidence:
        snippet: The increasing detection of asymptomatic gallstones leads to difficult decisions for
          the surgeon and patient about whether the stones should be managed expectantly or surgically.
        supports: SUPPORT
