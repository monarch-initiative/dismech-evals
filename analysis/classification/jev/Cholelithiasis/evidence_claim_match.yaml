      assertion_type: Pathophysiology
      assertion:
        name: Gallbladder Hypomotility and Bile Stasis
        conforms_to: cholelithiasis_biliary_supersaturation#Gallbladder Hypomotility and Bile Stasis
        role: trigger
        biological_scale: TISSUE
        description: 'Gallbladder smooth muscle contracts incompletely after a meal, leaving an enlarged
          residual volume and stagnant bile. The prolonged residence time is what converts nucleation
          into stone formation: crystals that would otherwise be emptied into the intestine are retained
          long enough to aggregate and grow. The cited review lists it as one of three conditions of which
          one or more must be present, so it is modelled as an independent input to stone growth rather
          than as a consequence of nucleation.'
        cell_types:
        - preferred_term: gallbladder smooth muscle cell
          term:
            id: CL:0000192
            label: smooth muscle cell
        biological_processes:
        - preferred_term: smooth muscle contraction
          term:
            id: GO:0006939
            label: smooth muscle contraction
          modifier: DECREASED
      selected_evidence:
        snippet: 'Cholesterol crystal formation requires the presence of one or more of the following:
          (a) cholesterol supersaturation, (b) accelerated nucleation, or (c) gallbladder hypomotility/bile
          stasis.'
        supports: SUPPORT
