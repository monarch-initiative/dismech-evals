      assertion_type: Treatment
      assertion:
        name: Prophylactic Ursodeoxycholic Acid During Rapid Weight Loss
        description: Rapid weight loss, above all after bariatric surgery, transiently drives bile toward
          cholesterol supersaturation and a large fraction of patients form stones in that window. A course
          of oral ursodeoxycholic acid over the high-risk months lowers the bile's cholesterol saturation
          and reduces the rate of new gallstones. This is prophylaxis across a defined risk window, not
          dissolution of established stones.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ursodeoxycholic acid
            term:
              id: CHEBI:9907
              label: ursodeoxycholic acid
      selected_evidence:
        snippet: Oral UDCA treatment significantly reduces the risks of developing gallstones in postoperative
          bariatric patients
        supports: SUPPORT
    origin:
      assertion_path: /treatments/2
      evidence_path: /treatments/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37872257
      reference_title: Role of Ursodeoxycholic Acid in the Prevention of Gallstones Formation in Bariatric
