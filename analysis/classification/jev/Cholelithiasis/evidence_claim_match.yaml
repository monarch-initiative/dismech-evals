      assertion_type: Pathophysiology
      assertion:
        name: Stone Impaction and Biliary Obstruction
        conforms_to: cholelithiasis_biliary_supersaturation#Cholelithiasis
        role: consequence
        biological_scale: ORGANISM
        description: 'A stone impacted in the gallbladder neck or cystic duct raises intraluminal pressure
          and produces biliary pain and, when obstruction persists, acute cholecystitis. A stone that
          passes into the common bile duct obstructs biliary drainage, giving jaundice, and can obstruct
          the pancreatic duct, giving gallstone pancreatitis. Most stones never reach this node: the majority
          of people with incidentally detected gallstones remain asymptomatic.'
        notes: No biological process is bound here. Impaction is a mechanical event - a stone lodged in
          a duct - and the consequence is raised intraluminal pressure rather than an altered metabolic
          flux; GO:0008206 bile acid metabolic process was bound on an earlier pass and asserts a change
          in bile acid metabolism that this node does not claim. Searched GO for bile secretion, obstruction
          and duct terms; GO:0032782 bile acid secretion and its relatives describe the hepatocyte process,
          not duct occlusion.
      selected_evidence:
        snippet: Gallstones may present as biliary pain, acute cholecystitis, biliary obstruction or pancreatitis,
          but it is not clear who will develop symptoms and what are the commonest initial symptoms.
        supports: SUPPORT
