      assertion_type: Pathophysiology
      assertion:
        name: Gallstone Growth in the Gallbladder
        conforms_to: cholelithiasis_biliary_supersaturation#Gallstone Aggregation and Growth
        role: effector
        biological_scale: TISSUE
        description: Cholesterol monohydrate crystals, embedded in the mucin gel of a poorly emptying
          gallbladder, aggregate and coalesce into macroscopic stones. Growth is sustained while supersaturation
          and stasis persist, which is why stones are usually multiple and why they recur after non-operative
          clearance.
        notes: No biological process is bound here. Crystal aggregation and coalescence into a macroscopic
          stone is a physical phase-growth process, not a transport or metabolic one, and GO has no term
          for it; GO:0030301 cholesterol transport was bound on an earlier pass and describes a different
          claim. Searched GO for crystal, aggregation, precipitation and biomineral terms; the biomineral-formation
          branch is matrix-mediated biological mineralisation, which this is not.
      selected_evidence:
        snippet: Hypersecretion of gallbladder mucus occurs in response to a lithogenic diet in experimental
          animals, and mucus accumulates as a viscous gel within the gallbladder lumen before gallstone
          formation.
        supports: SUPPORT
    origin:
