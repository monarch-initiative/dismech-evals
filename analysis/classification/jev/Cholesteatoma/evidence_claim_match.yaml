        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'Graded identically to the Eustachian tube link into this same node, which is the
          right order rather than a failure to discriminate: the two are proposed to act by the same route,
          since upper-airway mucosal disease is thought to matter through ventilation and shared mucosal
          inflammation. The evidence here is a case-control association with odds ratios rather than a
          mechanism, and the entry already frames it as an association.'
      selected_evidence:
        snippet: Chronic rhinitis, chronic sinusitis and nasal polyposis were more common in cholesteatoma
          patients than in controls (OR 1.5 to 2.5) as were both adenoid and tonsil surgery (OR > 4)
        supports: SUPPORT
