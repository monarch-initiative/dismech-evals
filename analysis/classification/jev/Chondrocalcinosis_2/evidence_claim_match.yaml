      assertion_type: Treatment
      assertion:
        name: Probenecid
        description: Probenecid inhibits ANK-dependent ATP efflux from chondrocytes, the step upstream
          of extracellular pyrophosphate generation, and is the only agent studied that acts on the pyrophosphate
          axis rather than on inflammation. It has been used off-label within a maintenance regimen in
          an ANKH P5S case, and an early phase 1 study (NCT02243631, eight participants) measured synovial
          fluid ATP before and after five days of treatment. No clinical benefit in ANKH-variant disease
          has been shown and it is not a recommended treatment.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
