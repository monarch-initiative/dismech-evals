  ff4171268ae56cb59dac5c672b8ad7a379d764ce9d35b39f902a6a2ffa1968ab:
    claim:
      about:
        disease:
          name: Chondrocalcinosis 2
          disease_term:
            preferred_term: chondrocalcinosis 2
            term:
              id: MONDO:0007319
              label: chondrocalcinosis 2
        context: []
      assertion_type: Genetic
      assertion:
        name: ANKH
        gene_term:
          preferred_term: ANKH
          term:
            id: hgnc:15492
            label: ANKH
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: ANKH encodes a 492-residue multipass transmembrane protein that moves intracellular inorganic
          pyrophosphate into the extracellular matrix. The CCAL2 variants are small (one to four residues)
          and cluster at the amino terminus, with one carboxy-terminal single-codon deletion; functionally
          they increase ANK activity or abundance rather than removing it.
        variants:
        - name: p.Met48Thr (M48T)
          description: Missense substitution of a conserved residue in a predicted transmembrane segment,
            found in the British CCAL2 family.
          gene:
            preferred_term: ANKH
            term:
              id: hgnc:15492
              label: ANKH
          clinical_significance: PATHOGENIC
          type: missense_variant
          variant_type: single nucleotide variant
        - name: c.-11C>T (5'-UTR upstream start codon)
          description: A 5'-untranslated-region change that creates a new ATG and adds four residues to
            the amino terminus of ANKH, found in the French (Alsace) CCAL2 family.
          gene:
            preferred_term: ANKH
            term:
              id: hgnc:15492
              label: ANKH
          clinical_significance: PATHOGENIC
          type: 5_prime_UTR_variant
          variant_type: single nucleotide variant
        - name: p.Pro5Leu (P5L)
          description: Amino-terminal missense variant reported in an Argentine family of northern Italian
            ancestry; the variant with the strongest increase in extracellular PPi in chondrocyte culture.
          gene:
            preferred_term: ANKH
            term:
              id: hgnc:15492
              label: ANKH
          clinical_significance: PATHOGENIC
          type: missense_variant
          variant_type: single nucleotide variant
        - name: p.Pro5Thr (P5T)
          description: Amino-terminal missense variant found independently in two unrelated US families
            on distinct haplotypes; codon 5 is a mutational hot spot.
          gene:
            preferred_term: ANKH
            term:
              id: hgnc:15492
              label: ANKH
          clinical_significance: PATHOGENIC
          type: missense_variant
          variant_type: single nucleotide variant
        - name: p.Pro5Ser (P5S)
          description: Third substitution at codon 5, reported in a woman with early-onset, widespread
            CPPD and inherited from her affected father.
          gene:
            preferred_term: ANKH
            term:
              id: hgnc:15492
              label: ANKH
          clinical_significance: LIKELY_PATHOGENIC
          type: missense_variant
          variant_type: single nucleotide variant
        - name: p.Glu490del (E490del)
          description: Single-codon deletion at the carboxy terminus, first found in a UK patient with
            sporadic chondrocalcinosis and in her sister; in transfected chondrocytes the mutant protein
            is retained in the cytoplasm yet still increases mineralization.
          gene:
            preferred_term: ANKH
            term:
              id: hgnc:15492
              label: ANKH
          clinical_significance: LIKELY_PATHOGENIC
          type: inframe_deletion
          variant_type: deletion
      selected_evidence:
        snippet: Here, we show that two previously described families with CCAL2 have mutations in the
          human homolog of the mouse progressive ankylosis gene (ANKH).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12297987
      reference_title: Mutations in ANKH cause chondrocalcinosis.
      evidence_source: HUMAN_CLINICAL
      explanation: Gene identification in the two linked CCAL2 families.
