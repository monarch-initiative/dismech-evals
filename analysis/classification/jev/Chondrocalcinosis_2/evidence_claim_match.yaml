          value:
            name: Increased Chondrocyte Pyrophosphate Export
            biological_scale: CELLULAR
            description: ANK sits in the chondrocyte plasma membrane and exports intracellular PPi into
              the matrix. Chondrocytes expressing CCAL2-mutant ANK release more extracellular PPi than
              cells expressing wild-type ANK, most consistently for P5L; the 5'-UTR and E490del variants
              also increase ANKH translation in vitro, so part of the effect may be more protein rather
              than a faster transporter. Later work models ANK as also mediating ATP efflux, with extracellular
              ENPP1 converting the ATP to pyrophosphate; by either route the net output of the node is
              more matrix pyrophosphate.
            cell_types:
            - preferred_term: articular chondrocyte
              term:
                id: CL:1001607
                label: articular chondrocyte
            biological_processes:
            - preferred_term: inorganic pyrophosphate export from chondrocytes
              term:
                id: GO:0030505
                label: inorganic diphosphate transport
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Extracellular Pyrophosphate Excess in Articular Cartilage
        causal_link_type: DIRECT
        description: More export from chondrocytes raises the pyrophosphate concentration of the cartilage
          matrix.
      selected_evidence:
        snippet: promoting CPPD crystal deposition via extracellular matrix PPi supersaturation
        supports: SUPPORT
