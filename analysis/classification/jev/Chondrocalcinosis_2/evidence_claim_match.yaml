          ANKH variants increase the activity or abundance of the ANK pyrophosphate exporter rather than
          removing it: in a cellular PPi assay all three original human variants were more active than
          the mouse ank nonsense allele, and in a direct oocyte transport assay the chondrocalcinosis
          mutants retain wild-type transport and rescue the Ank-null joint phenotype, which the loss-of-function
          CMD mutants cannot do.'
