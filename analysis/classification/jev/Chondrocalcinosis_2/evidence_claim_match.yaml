        description: Independently of inflammation, CPP crystals have direct catabolic effects on chondrocytes
          and synoviocytes, eliciting matrix metalloproteinases and prostaglandins, and deposits alter
          the mechanical properties of cartilage. The result is a chronic, polyarticular, osteoarthritis-like
          arthropathy with unusually severe articular damage, which in familial disease begins decades
          earlier than sporadic CPPD. Whether crystals cause or follow the cartilage degradation is not
          settled in sporadic disease; the early-onset familial form argues for crystals first.
        cell_types:
        - preferred_term: chondrocyte
