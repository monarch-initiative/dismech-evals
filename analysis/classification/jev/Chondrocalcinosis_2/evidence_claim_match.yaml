  1d956169d1ac89e0e0dd448f7c22c392abdc34362d163369b3d460459d17c255:
    claim:
      about:
        disease:
          name: Chondrocalcinosis 2
          disease_term:
            preferred_term: chondrocalcinosis 2
            term:
              id: MONDO:0007319
              label: chondrocalcinosis 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Increased Chondrocyte Pyrophosphate Export
        biological_scale: CELLULAR
        description: ANK sits in the chondrocyte plasma membrane and exports intracellular PPi into the
          matrix. Chondrocytes expressing CCAL2-mutant ANK release more extracellular PPi than cells expressing
          wild-type ANK, most consistently for P5L; the 5'-UTR and E490del variants also increase ANKH
          translation in vitro, so part of the effect may be more protein rather than a faster transporter.
          Later work models ANK as also mediating ATP efflux, with extracellular ENPP1 converting the
          ATP to pyrophosphate; by either route the net output of the node is more matrix pyrophosphate.
        cell_types:
        - preferred_term: articular chondrocyte
          term:
            id: CL:1001607
            label: articular chondrocyte
        biological_processes:
        - preferred_term: inorganic pyrophosphate export from chondrocytes
          term:
            id: GO:0030505
            label: inorganic diphosphate transport
          modifier: INCREASED
      selected_evidence:
        snippet: This -4-bp transition, as well as 2 mutations previously linked with familial and sporadic
          chondrocalcinosis (+14 bp C-to-T and C-terminal GAG deletion, respectively), but not the French
          familial chondrocalcinosis kindred 143-bp T-to-C mutation, increased reticulocyte ANKH transcription/ANKH
          translation in vitro.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15818664
      reference_title: Association of sporadic chondrocalcinosis with a -4-basepair G-to-A transition
        in the 5'-untranslated region of ANKH that promotes enhanced expression of ANKH protein and excess
        generation of extracellular inorganic pyrophosphate.
      evidence_source: IN_VITRO
      explanation: Shows that two of the heritable variants raise ANKH protein output, one route to more
        export; also records that the M48T (143 T-to-C) variant does not.
