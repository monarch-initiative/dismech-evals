      assertion_type: AnimalModel
      assertion:
        name: Ank-null and ank/ank progressive ankylosis mouse
        species: Mouse
        genotype: Ank null (targeted) or ank (E440 nonsense) homozygous
        description: 'The loss-of-function ANK mouse. It is curated here because it is the model the CCAL2
          variants were tested against and because it does not reproduce the human disease: homozygous
          loss of Ank deposits hydroxyapatite, not CPPD, in almost every joint from a few weeks of age
          and progresses to ankylosis, whereas the dominant human variants retain transport, rescue this
          phenotype when reconstructed in a BAC transgene, and produce adult-onset CPPD crystals. There
          is no published mouse carrying a CCAL2 allele that develops CPPD crystal deposition.'
        publication: PMID:17186460
        modeled_mechanisms:
        - target: Calcium Pyrophosphate Crystal Deposition in Hyaline and Fibrocartilage
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: TISSUE
          description: Loss of ANK produces ectopic joint mineral, but of the wrong kind and in the wrong
            direction of the pyrophosphate axis.
          limitations: Recessive loss of function versus dominant gain of function; the deposit is hydroxyapatite
            driven by low extracellular PPi, not CPPD driven by high PPi; and the human CCAL2 alleles
            rescue rather than reproduce this phenotype.
          divergences:
          - divergence_type: PROXY_QUANTITY
            materiality: INVALIDATING
            description: The model's mineral is hydroxyapatite formed when pyrophosphate is absent; the
              node's mineral is calcium pyrophosphate formed when pyrophosphate is in excess. Same tissue,
              opposite lesion.
      selected_evidence:
        snippet: Anknull/Anknull mice develop severe ectopic postnatal crystal deposition in almost every
          joint of the body, leading to eventual joint fusion and loss of mobility.
        supports: SUPPORT
