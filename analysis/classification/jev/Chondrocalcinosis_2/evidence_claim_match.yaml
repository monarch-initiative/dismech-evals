        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Extracellular Pyrophosphate Excess in Articular Cartilage
        biological_scale: TISSUE
        description: Pyrophosphate in cartilage is normally generated from extracellular ATP by ENPP1
          and degraded by alkaline phosphatase; at physiological levels it inhibits hydroxyapatite formation.
          In CCAL2 the exporter pushes matrix PPi above the concentration at which it instead precipitates
          with calcium. Lymphocytes and fibroblasts from familial CPPD patients also carry high PPi, so
          the excess is systemic even though the deposits are articular.
        chemical_entities:
        - preferred_term: extracellular inorganic pyrophosphate
          term:
            id: CHEBI:18361
            label: diphosphate(4-)
          modifier: INCREASED
        locations:
        - preferred_term: articular cartilage
          term:
            id: UBERON:0010996
            label: articular cartilage of joint
      selected_evidence:
        snippet: CPPD is caused by elevated extracellular-pyrophosphate concentrations in the cartilage
          and causes inflammation by activation of the NLRP3 inflammasome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
