        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: controversy_ankh_gain_versus_loss
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - pathophysiology#ANKH Gain-of-Function Variant
        - pathophysiology#Increased Chondrocyte Pyrophosphate Export
        prompt: Do CCAL2 ANKH variants increase pyrophosphate export by changing the transporter's activity,
          by increasing the amount of ANKH protein, or by some non-transport effect, and is "gain of function"
          the right label for all of them?
        rationale: 'The gene-discovery papers disagreed from the start: one group postulated loss of function,
          the other measured increased activity in a cellular PPi assay. A direct oocyte transport assay
          later found the chondrocalcinosis mutants indistinguishable from wild type while the CMD mutants
          transported nothing, so the dominant human phenotype cannot be read off transporter kinetics
          alone. Translation assays showed the 5''-UTR and E490del variants increase ANKH protein output
          and the M48T variant does not, and the E490del protein is largely cytoplasmic yet still raises
          mineralization and ENPP1 activity. The variants may therefore reach the same extracellular PPi
          excess by different routes, which matters for any attempt to drug ANKH directly. The entry labels
          the lesion GAIN_OF_FUNCTION on the net-output evidence while this stays open.'
        posed_by: dismech curation
        posed_date: '2026-10-13T00:00:00Z'
      selected_evidence:
        snippet: We postulate that loss of function of ANKH causes elevated extracellular PPi levels,
          predisposing to CPPD crystal deposition.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12297989
      reference_title: Autosomal dominant familial calcium pyrophosphate dihydrate deposition disease
        is caused by mutation in the transmembrane protein ANKH.
      evidence_source: HUMAN_CLINICAL
      explanation: The competing loss-of-function postulate from the second 2002 gene-discovery paper;
        refutes the gain-of-function label as stated, though not the PPi excess.
