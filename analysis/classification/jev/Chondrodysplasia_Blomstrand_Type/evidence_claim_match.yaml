          homozygous nonsense allele, R104X, which truncates the receptor and is assigned to the severe
          type I form, and a homozygous intronic substitution (designated intron M4+27C>T) that creates
          a novel splice site preferentially used in patient fibroblasts while a low level of wild-type
          transcript survives, assigned to the milder type II form along with P132L. The allelic spectrum
          here is limited to alleles supported by a cached source; a 2025 review surfaced by the deep-research
          artifact lists a further frameshift allele, c.1093delG, which is not recorded here because that
          review is not in references_cache. PTH1R is the locus of a striking allelic series in which
          the direction of the receptor defect predicts the direction of the skeletal phenotype: constitutively
          activating heterozygous alleles cause Jansen metaphyseal chondrodysplasia with delayed chondrocyte
          differentiation, complete loss-of-function recessive alleles cause Blomstrand chondrodysplasia
          with accelerated differentiation, and a recessive C-terminal cytoplasmic-tail truncation causes
          Eiken syndrome with delayed ossification.

          '
      selected_evidence:
        snippet: In one of the type I BOCD cases, a homozygous nonsense mutation (R104X) was found, resulting
          in a truncated PTHR1.
        supports: SUPPORT
