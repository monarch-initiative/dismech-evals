      assertion_type: Pathophysiology
      assertion:
        name: Failure of PTH/PTHrP-Stimulated Signaling in Growth Plate Chondrocytes
        biological_scale: CELLULAR
        description: 'PTHrP produced in the periarticular perichondrium normally acts on PTH1R borne by
          proliferating and prehypertrophic growth plate chondrocytes, raising cAMP and mobilizing inositol
          phosphates. In Blomstrand chondrodysplasia the receptor on the patient''s own chondrocytes is
          non-functional, so this ligand-stimulated second messenger response is abolished. Loss of both
          the cAMP and the inositol phosphate arm has been demonstrated for the alleles recovered from
          affected fetuses.

          '
        cell_types:
        - preferred_term: growth plate chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: PTH1R-stimulated cAMP second messenger signaling
          modifier: DECREASED
          term:
            id: GO:0007189
            label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
      selected_evidence:
        snippet: PTH-induced cAMP accumulation was severely reduced in COS-7 cells expressing P132L receptors
          compared to that of cells expressing wild-type receptors, and PTH-induced inositol phosphate
          accumulation was not detectable in cells expressing the mutant receptor.
        supports: SUPPORT
