  da9b65a2ba798d2eede2b97366b8d82cbda2486649c924c5fa7081d9b3db5400:
    claim:
      about:
        disease:
          name: Chondrodysplasia Blomstrand Type
          disease_term:
            preferred_term: Blomstrand osteochondrodysplasia
            term:
              id: MONDO:0008970
              label: chondrodysplasia Blomstrand type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: blomstrand_osteosclerosis_absent_from_mouse_null
        kind: HUMAN_MODEL_MISMATCH
        prompt: 'Why is generalized osteosclerosis a cardinal radiographic feature of human Blomstrand
          chondrodysplasia when the PTH/PTHrP receptor-null mouse is reported for accelerated chondrocyte
          differentiation and mid-gestation lethality rather than for increased bone density?

          '
        rationale: 'The cellular lesion — accelerated chondrocyte differentiation — is faithfully reproduced
          in the Pth1r-null mouse, and the review literature states that PTH1R-ablated animals show premature
          endochondral ossification. But the defining human radiographic finding, generalized osteosclerosis,
          is not what the mouse work reports; most null embryos die in mid-gestation, before a skeleton
          dense enough to assess radiographically has formed. It is therefore unresolved whether human
          osteosclerosis is simply the accumulated end state of premature ossification carried to 25-40
          weeks of gestation, or whether it additionally requires a species-specific or later-gestation
          contribution (for example altered osteoclast activity in the absence of PTH1R signaling in bone)
          that the mouse never lives long enough to display. This matters because it determines whether
          the mouse can be used to test any intervention aimed at the sclerotic phenotype.

          '
        attaches_to:
        - pathophysiology#Premature and Advanced Endochondral Ossification
        - phenotypes#Generalized osteosclerosis
        proposed_experiments:
        - experiment_id: blomstrand_conditional_pth1r_late_gestation
          name: Chondrocyte-restricted, late-gestation Pth1r deletion with skeletal radiography
          description: 'Delete Pth1r conditionally in growth plate chondrocytes at a stage that bypasses
            mid-gestation lethality, and image the skeleton radiographically and by micro-CT through late
            gestation and the perinatal period, to test whether generalized osteosclerosis emerges once
            the animal survives long enough.

            '
          would_support:
          - phenotypes#Generalized osteosclerosis
          supporting_outcome:
          - Radiographic bone density rises progressively once mid-gestation lethality is bypassed, reproducing
            the human sclerotic phenotype from the same chondrocyte-autonomous lesion
          refuting_outcome:
          - Late-gestation chondrocyte-restricted deletion accelerates ossification without producing
            generalized osteosclerosis, implying an additional non-chondrocyte or human-specific contribution
        - experiment_id: blomstrand_bse_histomorphometry
          name: Quantitative mineral density distribution in human Blomstrand bone
          description: 'Quantitative backscattered-electron imaging and histomorphometry on non-decalcified
            bone from molecularly confirmed Blomstrand fetuses, compared with gestational-age-matched
            controls, to establish whether the radiographic osteosclerosis reflects true tissue hypermineralization
            or the geometry of prematurely ossified, structurally abnormal bone.

            '
          would_support:
          - pathophysiology#Premature and Advanced Endochondral Ossification
          supporting_outcome:
          - Tissue mineral density is normal and the radiographic density reflects prematurely formed
            bone occupying space that should still be cartilage
          refuting_outcome:
          - Bone tissue is genuinely hypermineralized, implying a mineralization defect additional to
            accelerated ossification
      selected_evidence:
        snippet: X-rays of four fetuses evaluated postmortem showed advanced bone maturation, generalized
          osteosclerosis, and dumbbell-like appearance of long bones due to metaphyseal enlargement.
        supports: SUPPORT
