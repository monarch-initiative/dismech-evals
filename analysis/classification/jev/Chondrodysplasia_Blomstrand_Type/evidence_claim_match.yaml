          the epithelial-mesenchymal interactions that build the mammary gland and position the erupting
          tooth, and both PTHrP and PTH1R are expressed in the developing human breast and tooth. Loss
          of receptor function therefore produces extraskeletal developmental defects in the same fetuses,
          which is the most direct human evidence that this pathway is required outside the growth plate.

          '
        biological_processes:
        - preferred_term: PTHrP-dependent epithelial-mesenchymal signaling in breast and tooth development
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0071374
            label: cellular response to parathyroid hormone stimulus
        notes: 'GO has no term for PTHrP-dependent epithelial-mesenchymal signaling in mammary or tooth
          development. GO:0071374 is the closest available process: it names the cellular response to
          the ligand class this receptor transduces, which is exactly what is lost here, but it says nothing
          about the epithelial-mesenchymal interaction or the tissues involved. The binding is kept because
          it is accurate as far as it goes; the more specific claim is carried by preferred_term and by
          this node''s description rather than by a manufactured narrower term.

          '
      selected_evidence:
        snippet: Compatible with the involvement of PTHR1 and PTHrP in human breast and tooth morphogenesis,
          both were expressed within the developing breasts and teeth of normal human fetuses.
        supports: SUPPORT
