        context: []
      assertion_type: Subtype
      assertion:
        name: Type I
        display_name: BOCD type I (complete PTH1R inactivation)
        description: 'The severe form, in which the PTH1R allele is completely inactivated and no receptor
          activity remains. The reported type I allele is a homozygous nonsense substitution, R104X, which
          truncates the receptor. Type I is the more severe end of the skeletal spectrum on which the
          two-type division of Blomstrand osteochondrodysplasia is based; the division is by severity
          of the skeletal abnormalities, and the molecular correlate is how much residual receptor activity
          survives.

          '
      selected_evidence:
        snippet: In one of the type I BOCD cases, a homozygous nonsense mutation (R104X) was found, resulting
          in a truncated PTHR1.
        supports: SUPPORT
