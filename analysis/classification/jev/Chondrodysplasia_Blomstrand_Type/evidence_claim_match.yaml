        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: UNKNOWN
        prevalence_class: ULTRA_RARE
        notes: 'No population-based prevalence estimate exists. Blomstrand chondrodysplasia is described
          in the literature only as case reports and very small fetal series (the largest published series
          below comprises five fetuses collected over 19 years at a single prenatal diagnosis unit), and
          it is consistently characterized as "ultrarare". Because ascertainment depends on prenatal imaging
          followed by fetal autopsy and molecular confirmation, published counts are certainly an undercount;
          no numerator/denominator is available, so no numeric rate is asserted here.

          '
      selected_evidence:
        snippet: 'Blomstrand osteochondrodysplasia (BOCD, MIM #215045) is an ultrarare lethal skeletal
          dysplasia (LSD) perinatally, characterized by extremely advanced bone maturation, generalized
          osteosclerosis, and severe tetramicromelia caused by biallelic loss-of-function mutations in
          the parathyroid hormone receptor-1 gene (PTHR1).'
        supports: SUPPORT
    origin:
      assertion_path: /prevalence/0
      evidence_path: /prevalence/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35808914
