            term:
              id: MONDO:0008970
              label: chondrodysplasia Blomstrand type
        context: []
      assertion_type: Subtype
      assertion:
        name: Type II
        display_name: BOCD type II (near-complete PTH1R inactivation with residual activity)
        description: 'The relatively milder form, in which the receptor is not completely inactivated
          and a low level of residual activity survives. Two type II alleles are described: a homozygous
          intronic substitution that creates a novel splice site preferentially used in patient dermal
          fibroblasts, while the wild-type transcript persists at low levels; and the recurrent homozygous
          P132L missense substitution, which functional analysis shows to retain low residual activity.
          Type II is still perinatally lethal; the contrast with type I is in the severity of the skeletal
          abnormalities, not in survival.

          '
      selected_evidence:
        snippet: We performed mutation analysis in two families with type I and in three families with
          the less severe form of BOCD type II.
        supports: SUPPORT
