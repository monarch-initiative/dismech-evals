  327bab93b67a16e409da6e460ca0601e6846e1c71ab0a71bfa7258bf0a2f9dd0:
    claim:
      about:
        disease:
          name: Chondrodysplasia Blomstrand Type
          disease_term:
            preferred_term: Blomstrand osteochondrodysplasia
            term:
              id: MONDO:0008970
              label: chondrodysplasia Blomstrand type
        context: []
      assertion_type: Genetic
      assertion:
        name: PTH1R
        gene_term:
          preferred_term: PTH1R
          term:
            id: hgnc:9608
            label: PTH1R
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'PTH1R at 3p21.31 encodes the 593-residue type 1 PTH/PTHrP receptor, a class B G protein-coupled
          receptor that couples to both Gs (cAMP) and Gq (inositol phosphate) pathways. Reported Blomstrand
          alleles include a homozygous P132L missense substitution in the N-terminal extracellular ligand-binding
          domain (recovered independently by two groups) and a maternally inherited splice-site-creating
          substitution at nucleotide 1176 that deletes the first 11 residues of the fifth transmembrane
          domain, with the paternal allele not expressed. A later five-family series adds two more: a
          homozygous nonsense allele, R104X, which truncates the receptor and is assigned to the severe
          type I form, and a homozygous intronic substitution (designated intron M4+27C>T) that creates
          a novel splice site preferentially used in patient fibroblasts while a low level of wild-type
          transcript survives, assigned to the milder type II form along with P132L. The allelic spectrum
          here is limited to alleles supported by a cached source; a 2025 review surfaced by the deep-research
          artifact lists a further frameshift allele, c.1093delG, which is not recorded here because that
          review is not in references_cache. PTH1R is the locus of a striking allelic series in which
          the direction of the receptor defect predicts the direction of the skeletal phenotype: constitutively
          activating heterozygous alleles cause Jansen metaphyseal chondrodysplasia with delayed chondrocyte
          differentiation, complete loss-of-function recessive alleles cause Blomstrand chondrodysplasia
          with accelerated differentiation, and a recessive C-terminal cytoplasmic-tail truncation causes
          Eiken syndrome with delayed ossification.

          '
      selected_evidence:
        snippet: To our knowledge, this is the first description of opposite manifestations resulting
          from distinct recessive mutations in the same gene.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15525660
      reference_title: Recessive mutations in PTHR1 cause contrasting skeletal dysplasias in Eiken and
        Blomstrand syndromes.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents that different recessive PTH1R alleles produce opposite skeletal phenotypes,
        the basis for the allelic-series note above.
