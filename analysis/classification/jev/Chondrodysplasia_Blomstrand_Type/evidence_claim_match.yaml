      assertion:
        name: PTH/PTHrP receptor null mouse
        species: Mus musculus
        genotype: Pth1r (PTH/PTHrP receptor) homozygous null, generated by homologous recombination
        category: KNOCKOUT
        genes:
        - preferred_term: PTH1R
          term:
            id: hgnc:9608
            label: PTH1R
        publication: PMID:8662561
        description: 'Germline deletion of the murine PTH/PTHrP receptor. Most homozygotes die in mid-gestation;
          survivors show accelerated chondrocyte differentiation, and their bones are refractory to PTHrP
          and hedgehog in explant culture. This is the closest available model of the human disease and
          it reproduces both the cellular lesion and the lethality.

          '
        modeled_mechanisms:
        - target: Accelerated Chondrocyte Hypertrophic Differentiation
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Receptor-null mice show the same accelerated chondrocyte differentiation that
            defines the human condition, from the same molecular lesion (complete loss of PTH1R function).

            '
          limitations: The mouse is a complete germline null while human Blomstrand alleles are point
            mutations that leave a surface-expressed but signaling-dead receptor, and most null embryos
            die in mid-gestation before the skeletal phenotype can be fully assessed, so the surviving
            embryos are a selected subset. Radiographic osteosclerosis, the cardinal human finding, is
            not reported in this paper.
          readouts:
          - name: Chondrocyte differentiation timing in developing bone
            target: Accelerated Chondrocyte Hypertrophic Differentiation
            direction: INCREASED
            interpretation: 'Accelerated differentiation in the receptor-null mouse is the direct cellular
              counterpart of the accelerated chondrocyte differentiation described in human Blomstrand
              autopsy histology.

              '
        - target: Failure of PTH/PTHrP-Stimulated Signaling in Growth Plate Chondrocytes
          relationship: RECAPITULATES
          fidelity: HIGH
          description: 'Explanted receptor-null bone is unresponsive to PTHrP and hedgehog, demonstrating
            in tissue the same signaling failure shown for human Blomstrand alleles in transfected cells.

            '
          limitations: Responsiveness was assayed in explant culture rather than in vivo, and the hedgehog
            ligand used was Sonic rather than Indian hedgehog.
          readouts:
          - name: Responsiveness of explanted bone to PTHrP and hedgehog
            target: Failure of PTH/PTHrP-Stimulated Signaling in Growth Plate Chondrocytes
            direction: ABOLISHED
            interpretation: 'Loss of ligand responsiveness in receptor-null tissue is the tissue-level
              equivalent of the abolished cAMP and inositol phosphate response measured for Blomstrand
              alleles in transfected cells.

              '
      selected_evidence:
        snippet: Most PTH/PTHrP receptor (-/-) mutant mice died in mid-gestation, a phenotype not observed
          in PTHrP (-/-) mice, perhaps because of the effects of maternal PTHrP.
