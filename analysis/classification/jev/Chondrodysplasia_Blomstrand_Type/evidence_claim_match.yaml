      assertion_type: Pathophysiology
      assertion:
        name: Biallelic PTH1R Loss-of-Function
        biological_scale: MOLECULAR
        description: 'PTH1R encodes the type 1 PTH/PTHrP receptor, a class B G protein-coupled receptor.
          Blomstrand alleles run from complete inactivation to near-complete inactivation with a low level
          of residual activity, and that difference is what the type I / type II division tracks. At the
          null end, a nonsense allele (R104X) truncates the receptor, and a splice-creating point mutation
          deletes the first 11 residues of the fifth transmembrane domain, yielding a receptor that reaches
          the cell surface but neither binds PTH or PTHrP nor generates cAMP or inositol phosphates. At
          the hypomorphic end, the recurrent P132L substitution in the N-terminal extracellular domain
          leaves surface expression intact but cripples ligand binding, and is assigned to the milder
          type II. The two laboratories that reported P132L in 1998 differ on how complete the defect
          is: one measured maximal specific radioligand binding at under 10 percent of wild type with
          severely reduced rather than absent cAMP, the other detected no binding and no cAMP at all.
          The 2007 functional re-analysis resolves this as low residual activity. Both alleles must be
          affected; heterozygous carrier parents are unaffected.

          '
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          description: 'Biallelic germline PTH1R alleles, reported both homozygous and compound heterozygous,
            with complete or near-complete loss of receptor function. `zygosity` is deliberately left
            unset: the cited source reports both homozygous and compound heterozygous genotypes, the slot
            is single-valued, and there is no biallelic permissible value, so asserting HOMOZYGOUS would
            narrow the claim past what the source supports.'
        gene:
          preferred_term: PTH1R
          modifier: LOSS_OF_FUNCTION
          term:
            id: hgnc:9608
            label: PTH1R
