              label: chondrodysplasia punctata, tibial-metacarpal type
        context: []
      assertion_type: Prevalence
      assertion:
        population: Published case literature
        notes: No population prevalence estimate was identified. The Falcon report and cached primary
          literature support only small case-series and case-report evidence.
      selected_evidence:
        snippet: We describe 7 patients with a new form of chondrodysplasia punctata. Its principal clinical
          manifestations are flat midface and nose, short limbs, and otherwise normal development. Consistent
          radiologic manifestations in the newborn infant are discrete calcific stippling, coronal clefts
          of vertebral bodies, short tibiae, and shortness of the 2nd and 3rd metacarpal bones. Radiologic
          findings in the older child include shortness of tibiae and the 3rd and 4th metacarpals.
        supports: SUPPORT
    origin:
