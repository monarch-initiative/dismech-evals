          IMPAD1) lies at 8q12.1 and encodes inositol monophosphatase domain-containing protein 1, also
          called Golgi 3''-phosphoadenosine 5''-phosphate 3''-phosphatase (gPAPP). The allele spectrum
          is not curated here: no cached reference enumerates the reported variants, and the deep-research
          report committed with this entry describes missense substitutions near the phosphatase active
          site alongside nonsense and frameshift alleles without a verifiable source, so nothing about
          allele class is asserted.'
