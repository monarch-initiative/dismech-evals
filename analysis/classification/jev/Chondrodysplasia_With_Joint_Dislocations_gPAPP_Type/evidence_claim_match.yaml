        relationship_type: CAUSATIVE
        notes: 'HGNC identifier taken from the MONDO:0013561 has_material_basis_in_germline_mutation_in
          axiom (identifiers.org/hgnc/26019 ! BPNT2), which matches the stub. Issue #10762 quotes hgnc:26428
