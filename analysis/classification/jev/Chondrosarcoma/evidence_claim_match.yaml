            figure.
      selected_evidence:
        snippet: Central conventional chondrosarcoma is the most common subtype and is associated with
          isocitrate dehydrogenase 1 and 2 (IDH1 and IDH2) gene mutations in 50% to 60% of cases.
        supports: SUPPORT
