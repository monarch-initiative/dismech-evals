          as secondary peripheral malignant transformation of an osteochondroma in a minority of carriers,
          so the relationship recorded here is RISK_FACTOR rather than CAUSATIVE: an EXT1 variant is neither
          necessary (the commonest presentation in the cohorts cited in this entry is sporadic central
          conventional disease) nor sufficient (both lifetime transformation estimates quoted elsewhere
          in this entry are well under half). The two sources give different estimates - 0.5-5% on the
          Secondary Peripheral subtype row and in the EXT1/EXT2 pathophysiology node, and ~2%-10% in the
          GeneReviews item below - and both are quoted rather than reconciled.'
