        notes: 'Somatic IDH1 mutations are the commonest recurrent genetic event in conventional central
          chondrosarcoma. They are neomorphic rather than inactivating: the mutant enzyme generates the
          oncometabolite D-2-hydroxyglutarate, which is the mechanism modelled in the pathophysiology
          chain of this entry. No prognostic claim is attached to IDH status here: the sequencing cohort
          cited below found no survival difference by IDH mutation, and the multi-omics series cited on
          the IDH2 record reports the same.'
        case_fractions:
