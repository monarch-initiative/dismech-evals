      assertion_type: Pathophysiology
      assertion:
        name: Epithelial-Mesenchymal Transition and Local Invasion
        description: Chordoma malignant cells acquire a partial epithelial-mesenchymal transition (p-EMT)
          state, characterized by loss of E-cadherin together with gain of N-cadherin and vimentin. This
