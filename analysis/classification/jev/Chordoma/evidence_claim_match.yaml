      assertion:
        name: TGFβ-TBXT Signaling Network
        description: Chordoma depends on a hyperactivated TBXT/TGF-β/SOX6/SOX9 signaling network that
          mirrors transcriptional programs active in the embryonic notochord. Transcriptional profiling
          identifies TGF-β pathway activation as a core feature of chordoma biology, with experimental
          studies confirming that chordoma cell proliferation and survival depend on TGF-β signaling.
          This represents a druggable regulatory axis that is mechanistically distinct from the RTK and
          PI3K pathway alterations described elsewhere in chordoma.
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
      selected_evidence:
        snippet: the TBXT/transforming growth factor beta (TGF-β)/SOX6/SOX9 pathway was hyperactivated
          in the tumor, suggesting that pathways associated with chondrogenesis were a central driver
          of chordoma development
        supports: SUPPORT
