      assertion:
        name: Cell-Cycle Dysregulation via CDKN2A Loss
        conforms_to: cdk46_inhibitor_resistance#Cyclin D-CDK4/6-RB Pathway Dependency
        description: Homozygous deletion of CDKN2A at chromosome 9p21 is one of the most recurrent somatic
          events in chordoma. Loss of the p16(INK4a) tumor suppressor product derepresses CDK4/CDK6-cyclin
          D activity and enables bypass of the G1/S checkpoint, supporting unconstrained proliferation.
          This molecular subset provides a rationale for CDK4/6 inhibitor strategies under clinical investigation.
        biological_processes:
        - preferred_term: G1/S transition of mitotic cell cycle
          modifier: INCREASED
          term:
            id: GO:0000082
            label: G1/S transition of mitotic cell cycle
        - preferred_term: regulation of cell cycle
          modifier: ABNORMAL
          term:
            id: GO:0051726
            label: regulation of cell cycle
      selected_evidence:
        snippet: Collectively, these studies have identified recurrent loss of CDKN2A as a key driver
          in chordoma development.
        supports: SUPPORT
