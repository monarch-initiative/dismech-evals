  448d4c4c4b6e75808f6b0f213e9b7cdc081489f30c3e82096d6114e6f5725ffa:
    claim:
      about:
        disease:
          name: Chorioamnionitis
          disease_term:
            preferred_term: chorioamnionitis
            term:
              id: MONDO:0000409
              label: chorioamnionitis
        context: []
      assertion_type: Stage
      assertion:
        name: Maternal Inflammatory Response
        description: 'The maternal arm of the acute lesion, corresponding to the pathophysiology node
          Maternal Inflammatory Response and Acute Chorioamnionitis, and to the Histologic Acute subtype.
          It is staged by how far maternal neutrophils have advanced from the decidual side toward the
          amniotic cavity, with a separate two-tier grade for severity. This is the more reproducible
          of the two axes.

          '
        substages:
        - name: MIR Stage 1
          description: 'Acute subchorionitis or subchorionic chorionitis: maternal neutrophils confined
            to the subchorionic fibrin and the chorionic plate, the earliest recognizable maternal response.

            '
        - name: MIR Stage 2
          description: 'Acute chorioamnionitis proper: neutrophils have advanced through the chorionic
            connective tissue and into the amnion. This is the stage the unqualified term chorioamnionitis
            usually denotes.

            '
        - name: MIR Stage 3
          description: 'Necrotizing chorioamnionitis: amnionic epithelial necrosis, basement membrane
            thickening, and karyorrhectic neutrophil debris, indicating a prolonged rather than merely
            severe process.

            '
        notes: 'The stage boundaries are carried as substage descriptions, which assert nothing beyond
          the standard Amsterdam definitions and require no evidence. The attached evidence covers only
          what the cited abstract actually supports: that the maternal and fetal responses are separately
          graded and staged, and how reproducible each scheme is. The full Amsterdam Stage 1-3 and Grade
          1-2 text lives in the consensus chapter body rather than in any cached abstract, so it is described
          but never quoted as evidence.'
      selected_evidence:
        snippet: Grading and staging of maternal and fetal inflammatory responses was found to be more
          reproducible using a two- versus three-tiered grading system than a three- versus five-tiered
          staging system (overall agreement 81% vs. 71%).
        supports: SUPPORT
    origin:
      assertion_path: /stages/0
      evidence_path: /stages/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:14708737
      reference_title: 'Amniotic infection syndrome: nosology and reproducibility of placental reaction
