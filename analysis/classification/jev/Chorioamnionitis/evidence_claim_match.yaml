          delivery, and the nearest candidate (NCIT:C15329 Surgical Procedure) would contradict this treatment's
          own evidence, which states that intraamniotic infection is rarely an indication for cesarean.
          Per CLAUDE.md, omitting the term is preferred over a misleading one; `therapeutic_modality`
          is OTHER for the same reason. A candidate for an NCIT new-term request. This treatment covers
          the delivery decision generally, not cesarean specifically.
