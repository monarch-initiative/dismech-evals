      assertion_type: Subtype
      assertion:
        name: Clinical
        display_name: Clinical chorioamnionitis (intraamniotic infection, Triple I)
        description: 'The intrapartum clinical syndrome, suspected when maternal fever is accompanied
          by additional maternal or fetal signs of inflammation. The 2015 NICHD workshop argued this label
          had been stretched across a heterogeneous set of conditions and proposed the descriptive replacement
          term Triple I, stressing that isolated maternal fever is not the same thing as chorioamnionitis.

          '
      selected_evidence:
        snippet: It is particularly important to recognize that an isolated maternal fever is not synonymous
          with chorioamnionitis.
        supports: SUPPORT
