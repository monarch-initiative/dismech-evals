          engage the same innate receptors as microbial products, producing an inflammatory lesion indistinguishable
          from the infectious one in the absence of demonstrable organisms. This arm is not a curiosity:
          in cohorts of preterm labor it is detected more often than microbial invasion itself, and it
          is the reason chorioamnionitis is modeled here as an inflammatory rather than a purely infectious
          final common pathway.

          '
