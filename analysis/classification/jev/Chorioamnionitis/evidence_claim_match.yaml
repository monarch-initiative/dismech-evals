              id: MONDO:0000409
              label: chorioamnionitis
        context: []
      assertion_type: Subtype
      assertion:
        name: Histologic Acute
        display_name: Acute histologic chorioamnionitis
        description: 'The placental-pathology diagnosis: diffuse neutrophilic infiltration of the chorioamniotic
          membranes, staged and graded by the Amsterdam criteria. It is far more common than the clinical
          syndrome and its frequency rises steeply as gestational age at delivery falls. It is subdivided
          into the maternal inflammatory response (maternal neutrophils in chorion and amnion) and the
          fetal inflammatory response (funisitis and chorionic vasculitis).

          '
      selected_evidence:
        snippet: The terminology and microscopic descriptions for maternal vascular malperfusion, fetal
          vascular malperfusion, delayed villous maturation, patterns of ascending intrauterine infection,
          and villitis of unknown etiology were agreed upon.
        supports: SUPPORT
