      assertion_type: Pathophysiology
      assertion:
        name: Reduced Myometrial Contractility at Term
        biological_scale: TISSUE
        description: 'At term the inflammatory milieu is associated with the opposite uterine behavior
          from the preterm case: decreased uterine activity, failure to progress in labor, higher cesarean
          rates, and postpartum uterine atony with hemorrhage. This is curated as a distinct node rather
          than as a sign-reversing edge on the uterotonic arm, because the mechanisms are separated by
          gestational age and receptor context rather than contradicting one another.

          '
      selected_evidence:
        snippet: Maternal morbidity from intraamniotic infection also can be significant, and may include
          dysfunctional labor requiring increased intervention, postpartum uterine atony with hemorrhage,
          endometritis, peritonitis, sepsis, adult respiratory distress syndrome and, rarely, death.
        supports: SUPPORT
