              id: MONDO:0000409
              label: chorioamnionitis
        context: []
      assertion_type: Subtype
      assertion:
        name: Chronic
        display_name: Chronic chorioamnionitis
        description: 'A mechanistically distinct lesion sharing the name: lymphohistiocytic rather than
          neutrophilic, characterized by maternal CD8+ T cell infiltration of the chorioamniotic membranes
          and attributed to maternal anti-fetal rejection rather than to infection. It is the most common
          placental lesion of late spontaneous preterm birth. It is curated here so that the acute infectious
          entity is not silently conflated with it.

          '
      selected_evidence:
        snippet: Chronic chorioamnionitis is the most common lesion in late spontaneous preterm birth
          and is characterized by the infiltration of maternal CD8+ T cells into the chorioamniotic membranes.
        supports: SUPPORT
