      assertion_type: Pathophysiology
      assertion:
        name: NLRP3 Inflammasome Activation and Pyroptosis
        biological_scale: CELLULAR
        description: 'Assembly of the NLRP3 inflammasome activates caspase-1, which both matures pro-IL-1
          beta and IL-18 and cleaves gasdermin D. Gasdermin D pores drive pyroptosis of amnion and decidual
          cells, releasing further alarmins and closing a self-amplifying loop. This is the step that
          converts a local signal into a syndrome: transcription alone yields inactive pro-IL-1 beta,
          so without this node the mechanism by which the cytokine becomes biologically active is unexplained.
          The node is engaged in both the infectious and the sterile arm, which is part of why the two
          are indistinguishable downstream.

          '
        biological_processes:
        - preferred_term: interleukin-1 beta production
          term:
            id: GO:0032611
            label: interleukin-1 beta production
          modifier: INCREASED
        cellular_components:
        - preferred_term: NLRP3 inflammasome complex
          term:
            id: GO:0072559
            label: NLRP3 inflammasome complex
      selected_evidence:
        snippet: Gasdermin D was detected in the amniotic fluid and chorioamniotic membranes from women
          who underwent spontaneous preterm labor/birth with either sterile intra-amniotic inflammation
          or intra-amniotic infection, but was rarely detected in those without intra-amniotic inflammation.
        supports: SUPPORT
