  1e049158b835e943d92e26e5f5e33f5f62ab0b7964bb2a07274c8caa4134c20b:
    claim:
      about:
        disease:
          name: Chorioamnionitis
          disease_term:
            preferred_term: chorioamnionitis
            term:
              id: MONDO:0000409
              label: chorioamnionitis
        context: []
      assertion_type: Stage
      assertion:
        name: Fetal Inflammatory Response
        description: 'The fetal arm, corresponding to the pathophysiology node Fetal Inflammatory Response
          with Funisitis and Chorionic Vasculitis, and to the Histologic Acute subtype. It is staged by
          which fetal vessels neutrophils have entered. It predicts neonatal outcome considerably better
          than the maternal stage, because it reflects the fetus''s own response rather than the mother''s.

          '
        substages:
        - name: FIR Stage 1
          description: 'Chorionic vasculitis or umbilical phlebitis: fetal neutrophils in the chorionic
            plate vessels or the umbilical vein only.

            '
        - name: FIR Stage 2
          description: 'Umbilical arteritis: involvement of one or both umbilical arteries. Arterial involvement
            matters because arterial blood is flowing from the fetus, so it marks a more established systemic
            fetal response.

            '
        - name: FIR Stage 3
          description: 'Necrotizing funisitis: concentric perivascular bands of neutrophil debris and
            cellular necrosis in Wharton''s jelly, indicating a chronic and advanced fetal response and
            carrying the worst prognosis.

            '
      selected_evidence:
        snippet: Grading and staging of maternal and fetal inflammatory responses was found to be more
          reproducible using a two- versus three-tiered grading system than a three- versus five-tiered
          staging system (overall agreement 81% vs. 71%).
        supports: SUPPORT
