            label: fetal membrane
      selected_evidence:
        snippet: Intraamniotic infection, also known as chorioamnionitis, is an infection with resultant
          inflammation of any combination of the amniotic fluid, placenta, fetus, fetal membranes, or
          decidua.
        supports: SUPPORT
