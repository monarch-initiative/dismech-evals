  2af62c10c0846514e268fba3b8cbdde25af6cfad88cfca496fb86cffd4260fb3:
    claim:
      about:
        disease:
          name: Chorioamnionitis
          disease_term:
            preferred_term: chorioamnionitis
            term:
              id: MONDO:0000409
              label: chorioamnionitis
        context:
        - path: /has_subtypes/1
          value:
            name: Histologic Acute
            display_name: Acute histologic chorioamnionitis
            description: 'The placental-pathology diagnosis: diffuse neutrophilic infiltration of the
              chorioamniotic membranes, staged and graded by the Amsterdam criteria. It is far more common
              than the clinical syndrome and its frequency rises steeply as gestational age at delivery
              falls. It is subdivided into the maternal inflammatory response (maternal neutrophils in
              chorion and amnion) and the fetal inflammatory response (funisitis and chorionic vasculitis).

              '
          role: subtype
      assertion_type: HistopathologyFinding
      assertion:
        name: Acute Chorioamnionitis, Funisitis and Chorionic Vasculitis
        description: 'The defining acute inflammatory lesions of the placenta: diffuse neutrophilic infiltration
          at different sites in the organ. Site determines whose response it is, which is the whole diagnostic
          point. Neutrophils in chorion and amnion are maternal; neutrophils in the umbilical cord (funisitis)
          and chorionic plate vessels (chorionic vasculitis) are fetal. Severity progresses from subchorionitis
          through chorioamnionitis to necrotizing chorioamnionitis, and in the fetal compartment from
          umbilical phlebitis through arteritis to necrotizing funisitis.

          '
        diagnostic: true
        subtype: Histologic Acute
        finding_term:
          preferred_term: Acute histologic chorioamnionitis
          term:
            id: NCIT:C111944
            label: Histologic Chorioamnionitis
        notes: Only the chorioamnionitis component is bindable. NCIT does have NCIT:C97077 Funisitis and
          NCIT:C117324 Fetal Chorionic Vasculitis, but both sit under NCIT:C2991 Disease or Disorder rather
          than under NCIT:C83490 Histopathology Result, so neither is reachable from the HistopathologyFindingTerm
          enum roots and neither can be bound here. That is an upstream NCIT placement gap, not a curation
          choice.
      selected_evidence:
        snippet: These lesions include acute chorioamnionitis, funisitis, and chorionic vasculitis and
          represent a host response (maternal or fetal) to a chemotactic gradient in the amniotic cavity.
        supports: SUPPORT
    origin:
