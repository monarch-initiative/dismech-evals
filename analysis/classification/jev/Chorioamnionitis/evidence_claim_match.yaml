        rationale: The largest meta-analysis found a significant pooled association but also strong evidence
          of publication bias, more conservative adjusted estimates, and infants exposed to chorioamnionitis
          being younger and lighter at birth. Its authors explicitly declined to call chorioamnionitis
          a definitive risk factor. The corresponding evidence items are recorded as PARTIAL rather than
          SUPPORT.
