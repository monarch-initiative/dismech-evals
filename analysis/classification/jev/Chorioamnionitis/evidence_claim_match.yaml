        description: 'Universal antenatal vaginal-rectal GBS culture at 36 0/7 to 37 6/7 weeks, with intrapartum
          penicillin for those who screen positive. This is prevention rather than treatment: it targets
          the ascending-invasion node before it is reached, and it is the reason Streptococcus agalactiae
          is a far less common cause of early-onset neonatal sepsis than its virulence would otherwise
          predict.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: penicillin G
            term:
              id: CHEBI:18208
              label: benzylpenicillin
        notes: The frequently quoted population effect of universal screening plus prophylaxis (early-onset
          GBS disease falling from roughly 1.8 to 0.23 per 1,000 live births) comes from CDC surveillance
          reports rather than from this committee opinion, so it is described here but not asserted as
          a quoted evidence claim.
      selected_evidence:
        snippet: The American College of Obstetricians and Gynecologists now recommends performing universal
          GBS screening between 36 0/7 and 37 6/7 weeks of gestation.
        supports: SUPPORT
