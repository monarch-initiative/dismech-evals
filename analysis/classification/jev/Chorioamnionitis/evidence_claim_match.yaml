      assertion_type: Pathophysiology
      assertion:
        name: Alarmin Release and Sterile Intra-amniotic Inflammation
        biological_scale: MOLECULAR
        description: 'Endogenous danger signals released by cellular stress or cell death in the membranes
          engage the same innate receptors as microbial products, producing an inflammatory lesion indistinguishable
          from the infectious one in the absence of demonstrable organisms. This arm is not a curiosity:
          in cohorts of preterm labor it is detected more often than microbial invasion itself, and it
          is the reason chorioamnionitis is modeled here as an inflammatory rather than a purely infectious
          final common pathway.

          '
        role: trigger
      selected_evidence:
        snippet: Danger signals that are released during the course of cellular stress or cell death can
          also induce the release of neutrophil chemokines.
        supports: SUPPORT
