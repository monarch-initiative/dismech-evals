      assertion_type: HistopathologyFinding
      assertion:
        name: Biphasic/Triphasic Trophoblastic Proliferation without Chorionic Villi
        finding_term:
          preferred_term: Biphasic trophoblastic proliferation without chorionic villi
          term:
            id: NCIT:C35867
            label: Morphologic Finding
        frequency: VERY_FREQUENT
        diagnostic: true
        description: 'The defining microscopic pattern: intimately admixed mononuclear trophoblast (cytotrophoblast
          and intermediate trophoblast) and multinucleated syncytiotrophoblast, recapitulating the architecture
          of primitive villous trophoblast but without forming chorionic villi. Absence of villi is the
          feature that separates choriocarcinoma from invasive mole. Term note: NCIT has no concept for
          this composite trophoblastic architecture, so the branch root NCIT:C35867 Morphologic Finding
          is bound as the closest available term with a more specific `preferred_term`.'
      selected_evidence:
        snippet: "its main diagnostic features are a trimorphic population of \ntrophoblast cells and\
          \ an absence of chorionic villi."
        supports: SUPPORT
