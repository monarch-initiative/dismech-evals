  1f6cc99842091ea2a0f860094c584407ecceb10163bbfcf0690a24549e4e16a8:
    claim:
      about:
        disease:
          name: Choriocarcinoma
          disease_term:
            preferred_term: Choriocarcinoma
            term:
              id: MONDO:0005207
              label: choriocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: High Proliferative Fraction and Chemosensitivity
        biological_scale: CELLULAR
        role: therapeutic_vulnerability
        description: 'The same feature that makes choriocarcinoma lethal untreated — a near-maximal proliferative
          fraction with Ki-67 frequently above 90% — makes it exceptionally vulnerable to cell-cycle-dependent
          cytotoxics. Antifolate (methotrexate), intercalating/transcription-blocking (dactinomycin),
          topoisomerase-II (etoposide), alkylating (cyclophosphamide) and antimitotic (vincristine) agents
          all act preferentially on rapidly cycling cells. Combined with a quantitative serum biomarker
          that permits treatment to a biochemical endpoint, this makes gestational choriocarcinoma one
          of the most curable of all solid malignancies — single-agent therapy cures low-risk disease
          and EMA-CO cures the great majority of high-risk disease. Non-gestational germ cell choriocarcinoma
          does not share this degree of sensitivity to the GTN regimens and is treated on germ cell lines.
          Modelling note: this node deliberately bundles a cellular property (near-maximal proliferative
          fraction) with the therapeutic-response property it produces, because the chemosensitivity is
          the clinically load-bearing consequence and three cytotoxic treatments attach to it via `target_mechanisms`.
          A future refactor could split it into a proliferation node and a drug-response node.'
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: 'Gestational choriocarcinoma is highly chemosensitive

          and responds well to single-agent methotrexate (low-risk

          disease) or EMA-CO (etoposide, methotrexate, actinomycin

          D, cyclophosphamide, vincristine) combination che-

          motherapy (high-risk disease) with an excellent prognosis'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
