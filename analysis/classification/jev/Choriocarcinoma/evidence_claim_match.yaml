      assertion_type: Subtype
      assertion:
        name: Non-Gestational
        display_name: Non-Gestational (Germ Cell) Choriocarcinoma
        subtype_term:
          preferred_term: Non-gestational (germ cell) choriocarcinoma
          term:
            id: NCIT:C2948
            label: Choriocarcinoma
        description: 'A malignant germ cell tumour showing choriocarcinomatous (trophoblastic) differentiation
          but arising from the patient''s own genome rather than from a gestation. In females it typically
          occurs in children or young adults, involves the ovary, and may be one component of a mixed
          germ cell tumour; it also occurs in the testis and at extragonadal midline sites. Management
          follows germ cell tumour principles — surgical staging and cytoreduction followed by bleomycin-based
          (BEP-type) chemotherapy — rather than the methotrexate/EMA-CO algorithm used for gestational
          disease. It is generally reported as having a worse outcome, but the evidence cited here supports
          the different treatment pathway rather than a quantified survival comparison. Note on term choice:
          NCIT:C39991 (Non-Gestational Ovarian Choriocarcinoma) is site-restricted, so the generic NCIT:C2948
          concept is bound here with a more specific preferred_term.'
      selected_evidence:
        snippet: 'Non-gestational choriocarcinoma of germ cell origin in

          female patients usually occurs in children or in young

          adults, involves the ovary, and may contain other non-

          choriocarcinomatous components as part of a mixed germ

          cell tumor'
        supports: SUPPORT
