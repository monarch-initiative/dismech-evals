        description: 'Anti-PD-1 (pembrolizumab) and anti-PD-L1 (avelumab) antibodies target the checkpoint
          axis that the allogeneic tumour uses to escape host T cells. Response rates of 50-70% are reported,
          and the principal role is in chemoresistant disease: in the TROPHIMMUN phase II trial avelumab
          was active in GTN resistant to single-agent chemotherapy, though not after multiagent failure.
          Checkpoint blockade is also being explored to de-escalate or replace cytotoxic therapy in young
          women for whom long-term chemotherapy toxicity matters, and in combination with VEGFR-2-directed
          agents.'
