          is in practice diagnosed biochemically rather than histologically: a plateauing or rising hCG
          after evacuation of a mole establishes the diagnosis and triggers chemotherapy without a tissue
          confirmation. This is why choriocarcinoma has become a rare specimen in pathology laboratories
          even though the disease still occurs.'
        diagnosis_term:
          preferred_term: Human Chorionic Gonadotropin Measurement
          term:
            id: NCIT:C75387
            label: Human Chorionic Gonadotropin Measurement
        markers: serum total hCG
        results: Plateauing or rising hCG after uterine evacuation, or persistence of a detectable level,
          defines persistent/malignant trophoblastic disease.
      selected_evidence:
        snippet: "Follow-up with \nhuman chorionic gonadotropin (hCG) is essential for early diagnosis\
          \ of \ngestational trophoblastic neoplasia (GTN)."
        supports: SUPPORT
