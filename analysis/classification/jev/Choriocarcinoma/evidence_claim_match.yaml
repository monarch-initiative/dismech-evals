        context: []
      assertion_type: Genetic
      assertion:
        name: Host (Non-Paternal) Genome of Non-Gestational Choriocarcinoma
        notes: Non-gestational choriocarcinoma of germ cell origin carries only the patient's own alleles;
          the absence of a distinct paternal complement on STR genotyping is what identifies it. Somatic
          carcinomas with trophoblastic differentiation (which also lack paternal alleles) are the other
          member of this differential and are more aggressive and chemoresistant still. Because immunohistochemistry
          — including SALL4 — cannot discriminate these entities, genotyping rather than morphology drives
          the treatment decision.
      selected_evidence:
        snippet: "DNA genotyping \nprovides a decisive tool in the separation of gestational trophoblastic\
          \ \nneoplasia from non-gestational counterparts/mimics of either germ cell or \nsomatic origin."
        supports: SUPPORT
