  1c37954693025418a5702d21cc01dc76c9c5e8fcbc5fe25261b75bddeab6fa8f:
    claim:
      about:
        disease:
          name: Choriocarcinoma
          disease_term:
            preferred_term: Choriocarcinoma
            term:
              id: MONDO:0005207
              label: choriocarcinoma
        context: []
      assertion_type: Genetic
      assertion:
        name: Paternal (Androgenetic) Allele Complement of Gestational Choriocarcinoma
        notes: Gestational choriocarcinoma carries the genome of the antecedent conceptus and therefore
          contains paternal alleles that are absent from the patient's own tissues; when the precursor
          is a complete hydatidiform mole the conceptus genome is entirely androgenetic. Short-tandem-repeat
          (STR) genotyping of tumour against patient normal tissue detects this foreign allele complement
          and is the definitive test separating gestational from non-gestational choriocarcinoma — a distinction
          with direct therapeutic consequences. Genotyping also identifies the index gestation and the
          interval since it, both of which are scored terms in the FIGO/WHO prognostic system. The imprinting
          mechanics of the molar precursor (CDKN1C/p57KIP2 loss on the absent maternal allele) are curated
          in Hydatidiform_Mole and Gestational_Trophoblastic_Neoplasm.
      selected_evidence:
        snippet: 'Genotyping detection of a

          distinct paternal genetic complement not present in the

          patient’s normal tissues'
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34088998
      reference_title: 'Genotyping diagnosis of gestational trophoblastic disease: frontiers in precision
        medicine.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the paternal allele complement as the genetic signature of gestational
        origin and the basis of the genotyping assay.
