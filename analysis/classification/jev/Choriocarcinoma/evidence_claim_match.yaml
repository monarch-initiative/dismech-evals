      assertion_type: DifferentialDiagnosis
      assertion:
        name: Invasive hydatidiform mole
        disease_term:
          preferred_term: invasive hydatidiform mole
          term:
            id: MONDO:0020549
            label: invasive hydatidiform mole
        description: 'Molar tissue invading the myometrium. It is the commonest cause of a rising or plateaued
          post-molar hCG and is therefore the entity most often treated as "post-molar GTN" without histological
          confirmation - which is precisely why the boundary with choriocarcinoma matters: both are diagnosed
          on the same hCG criteria and treated on the same FIGO/WHO risk score, but only choriocarcinoma
          lacks chorionic villi.'
        distinguishing_features:
        - Chorionic villi are retained, whereas the defining histological feature of choriocarcinoma is
          trophoblastic proliferation WITHOUT chorionic villi.
        - Generally a lower FIGO/WHO risk score and a better prognosis than choriocarcinoma.
      selected_evidence:
        snippet: "They consist of invasive mole, choriocarci-\nnoma, placental-site \ntrophoblastic tumour\
          \ (PSTT) \nand epithelioid trophoblastic tumour (ETT)."
        supports: SUPPORT
