  63422b5d463b55e930bfb8a78ab9d0a922c1091096f720e3c9e903f2bd3915d6:
    claim:
      about:
        disease:
          name: Choriocarcinoma
          disease_term:
            preferred_term: Choriocarcinoma
            term:
              id: MONDO:0005207
              label: choriocarcinoma
        context: []
      assertion_type: Biochemical
      assertion:
        name: Serum Human Chorionic Gonadotropin (total hCG)
        presence: INCREASED
        biomarker_term:
          preferred_term: Human Chorionic Gonadotropin
          term:
            id: NCIT:C2275
            label: Human Chorionic Gonadotropin
        context: Markedly elevated and proportional to viable tumour burden; used for diagnosis, FIGO/WHO
          risk scoring, response monitoring and relapse detection.
        notes: 'hCG is the operational endpoint of therapy in gestational trophoblastic neoplasia: chemotherapy
          is continued to normalisation and then consolidated, and a plateauing or rising titre defines
          resistance. Pre-treatment hCG is one of eight weighted terms in the FIGO/WHO prognostic score.
          Assay caveats matter clinically — heterophile-antibody interference produces so-called phantom
          hCG and can prompt unnecessary chemotherapy, and the high-dose hook effect can spuriously lower
          very high results unless the sample is diluted. The analyte is deliberately bound to the TOTAL
          hCG LOINC code 19080-1 rather than the free beta-subunit code 21198-7: gestational trophoblastic
          neoplasia monitoring and the FIGO/WHO score both use a total-hCG assay, even though "beta-hCG"
          is the usual clinical shorthand.'
        reference_ranges:
        - loinc_term:
            id: LOINC:19080-1
            label: Choriogonadotropin [Units/volume] in Serum or Plasma
          upper_bound: 5.0
          unit: IU/L
          population: non-pregnant women
          notes: The interpretation bands above the normal range are the pre-treatment serum hCG tiers
            of the modified WHO prognostic scoring system as adapted by FIGO (scores 0, 1, 2 and 4). They
            are prognostic strata, not analytic decision limits, and apply only to the pre-treatment measurement.
          interpretation_bands:
          - name: Non-pregnant reference range
            upper_bound: 5.0
            unit: IU/L
            abnormal_flag: NORMAL
            interpretation: Below the non-pregnant upper reference limit; in a treated patient, normalisation
              of hCG is the endpoint that defines complete biochemical remission.
          - name: Elevated, FIGO pre-treatment hCG score 0
            lower_bound: 5.0
            upper_bound: 1000.0
            unit: IU/L
            abnormal_flag: HIGH
            interpretation: Elevated but within the lowest FIGO pre-treatment hCG tier (below 10^3 IU/L),
              which contributes 0 points to the prognostic score.
          - name: FIGO pre-treatment hCG score 1
            lower_bound: 1000.0
            upper_bound: 10000.0
            unit: IU/L
            abnormal_flag: HIGH
            severity: MILD
            interpretation: 10^3 to 10^4 IU/L; contributes 1 point to the FIGO/WHO prognostic score.
          - name: FIGO pre-treatment hCG score 2
            lower_bound: 10000.0
            upper_bound: 100000.0
            unit: IU/L
            abnormal_flag: HIGH
            severity: MODERATE
            interpretation: 10^4 to 10^5 IU/L; contributes 2 points to the FIGO/WHO prognostic score.
          - name: FIGO pre-treatment hCG score 4
            lower_bound: 100000.0
            unit: IU/L
            abnormal_flag: CRITICAL_HIGH
            severity: SEVERE
            interpretation: Above 10^5 IU/L; contributes the maximum 4 points on the hCG axis of the FIGO/WHO
              prognostic score and, with other adverse factors, drives the total into the high-risk (7
              or more) category requiring multiagent chemotherapy.
      selected_evidence:
        snippet: 'GTN is nowadays diagnosed primarily based on

          serum hCG measurement combined with imaging studies.'
        supports: SUPPORT
