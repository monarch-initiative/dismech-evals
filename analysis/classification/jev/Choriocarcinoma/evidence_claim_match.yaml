        upper_bound: 5.0
        unit: IU/L
        population: non-pregnant women
        notes: The interpretation bands above the normal range are the pre-treatment serum hCG tiers of
          the modified WHO prognostic scoring system as adapted by FIGO (scores 0, 1, 2 and 4). They are
          prognostic strata, not analytic decision limits, and apply only to the pre-treatment measurement.
        interpretation_bands:
