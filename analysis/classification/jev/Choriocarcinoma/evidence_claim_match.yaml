      assertion:
        name: Paraneoplastic Consequences of Extreme hCG Elevation
        biological_scale: ORGANISM
        role: consequence
        description: hCG shares an alpha subunit with TSH, LH and FSH and is a weak agonist at the thyrotropin
          receptor; when tumour-derived concentrations exceed roughly 100,000 mIU/mL, that weak cross-reactivity
          becomes clinically significant and produces biochemical or overt hyperthyroidism. The same extreme
          gonadotropin-like signal overstimulates the ovaries, producing bilateral theca-lutein cysts
          (occasionally with virilisation), and is associated with hyperemesis and pre-eclampsia. These
          paraneoplastic features are a direct dose-dependent consequence of the biomarker itself rather
          than of tumour mass, and they resolve as hCG falls with treatment.
        cell_types:
        - preferred_term: syncytiotrophoblast cell
          term:
            id: CL:0000525
            label: syncytiotrophoblast cell
        biological_processes:
