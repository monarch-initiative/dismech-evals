        description: 'Nuclei are markedly atypical, often bizarre, with a high mitotic rate including
          atypical mitotic figures and a very high Ki-67 proliferation index. This extreme proliferative
          fraction is the cytological correlate of the tumour''s aggressiveness and, reciprocally, of
          its exceptional sensitivity to antimetabolite and antimitotic chemotherapy. No `frequency` band
          is asserted: the sources describe brisk mitotic activity qualitatively and report Ki-67 above
          90% in a single documented case, neither of which supports a quantitative band.'
      selected_evidence:
