              label: choriocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neoplastic Trophoblastic Transformation without Villous Formation
        biological_scale: CELLULAR
        role: central_effector
        description: 'The transformed cell population reconstitutes the two differentiation states of
          early implanting trophoblast — a proliferative mononuclear cytotrophoblast compartment and a
          fused, hormonally active syncytiotrophoblast compartment — but does so as a solid, sheet-like
          proliferation that never organises chorionic villi. Loss of the villous scaffold is not a cosmetic
          difference: villous architecture normally constrains trophoblast to a defined invasive front,
          and its absence accompanies unconstrained, vessel-permeating growth. The proliferative fraction
          is extreme (Ki-67 often above 90%), with marked nuclear atypia and atypical mitoses.'
        cell_types:
        - preferred_term: mononuclear cytotrophoblast cell
          term:
            id: CL:0000523
            label: mononuclear cytotrophoblast cell
        - preferred_term: syncytiotrophoblast cell
          term:
            id: CL:0000525
            label: syncytiotrophoblast cell
        biological_processes:
        - preferred_term: cell population proliferation
          modifier: INCREASED
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: 'the tumor consists of bi- or triphasic

          arrangements of mononuclear trophoblastic cells and

          multinucleated syncytiotrophoblast.'
        supports: SUPPORT
