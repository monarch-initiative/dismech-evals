        description: 'Normal extravillous trophoblast is physiologically one of the most invasive cell
          types in human biology: it penetrates decidua and myometrium and remodels spiral arteries, and
          it does so as a tightly regulated, self-limiting program. Choriocarcinoma is that program run
          without its brakes. Tumour trophoblast permeates myometrium and directly invades vascular channels,
          so intravasation is an early rather than a late event — this is the mechanistic reason choriocarcinoma
          metastasises hematogenously at small primary volumes and may present with a metastasis before
          any uterine lesion is apparent. Conformance note: the module''s canonical upstream driver is
          EMT activation in a somatic epithelium; here the invasive phenotype is a retained developmental
          program of trophoblast rather than a de-differentiation event, so this node conforms at the
          invasion/intravasation step without asserting the module''s EMT trigger node.'
