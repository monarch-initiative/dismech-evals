  d34a9a0375d20ab7fbff55b6dc8b5b53a3f4eb2b943d6ad35e306bca273d9eb4:
    claim:
      about:
        disease:
          name: Choriocarcinoma
          disease_term:
            preferred_term: Choriocarcinoma
            term:
              id: MONDO:0005207
              label: choriocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: VEGF-Driven Neoangiogenesis
        biological_scale: CELLULAR
        role: effector
        conforms_to: tumor_angiogenesis#Angiogenic Switch and VEGF-Driven Neovascularization
        description: 'Neoplastic trophoblast drives VEGF-dependent neovascularisation, building the fragile,
          disorganised tumour vasculature that both sustains the rapidly expanding mass and creates the
          bleeding diathesis characteristic of choriocarcinoma deposits. This is the mechanistic anchor
          for the antiangiogenic arm of therapy: the VEGFR-2 inhibitor apatinib is combined with PD-1
          blockade in multidrug-resistant disease, so the pathograph needs a node for that drug to target.'
        notes: Evidence tier. The direct mechanistic demonstration that VEGF secretion drives angiogenic
          capacity in choriocarcinoma is IN_VITRO (choriocarcinoma cell lines), and no cited source quantifies
          VEGF expression or microvessel density in primary human gestational choriocarcinoma tissue.
          The clinical evidence is therapeutic-response evidence for VEGFR-2 inhibition rather than direct
