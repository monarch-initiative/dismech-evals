        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cc_no_validated_driver_gene
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Multidrug-Resistant Refractory Disease
        prompt: What determines which choriocarcinomas become multidrug resistant, given that no validated
          somatic driver gene or resistance biomarker exists?
        rationale: Fewer than 5% of patients die, essentially all from multidrug-resistant disease, yet
          there is no recurrent somatic driver for choriocarcinoma and no validated predictor of resistance.
          Candidate resistance pathways surfaced in the deep-research sweep (DPP4/cholesterol synthesis,
          RSK2-SOX8, cfDNA signals involving BMPR1A and MAP3K1) are investigational and were deliberately
          not curated into the pathograph. Since the FIGO/WHO score is a clinical proxy rather than a
          biological one, a molecular predictor would change who is escalated up front.
        proposed_experiments:
        - experiment_id: exp_cc_paired_resistance_multiomics
          name: Paired chemosensitive versus chemoresistant choriocarcinoma multi-omics
          description: Profile matched pre-treatment and post-relapse tumour material by whole-exome and
            transcriptome sequencing, with serial cell-free DNA sampling through treatment, to identify
            somatic or transcriptional changes that accompany the emergence of multidrug resistance in
            an otherwise near-curable disease.
        - experiment_id: exp_cc_resistance_biomarker_vs_figo
          name: Prospective comparison of candidate resistance biomarkers against the FIGO/WHO score
          description: Prospectively measure candidate resistance markers at diagnosis and test whether
            any adds predictive value over the FIGO/WHO prognostic score for single-agent failure, which
            would allow biologically rather than clinically driven up-front escalation.
      selected_evidence:
        snippet: "some \n(<5.0%) will die as a result of multi-drug resistance, underscoring the need\
          \ for \nnovel approaches in this group of patients."
        supports: SUPPORT
