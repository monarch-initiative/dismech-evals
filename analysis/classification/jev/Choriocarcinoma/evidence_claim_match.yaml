        context: []
      assertion_type: Subtype
      assertion:
        name: Gestational
        display_name: Gestational Choriocarcinoma
        subtype_term:
          preferred_term: Gestational Choriocarcinoma
          term:
            id: NCIT:C4646
            label: Gestational Choriocarcinoma
        description: 'The common form, arising from the trophoblast of an antecedent gestation. Roughly
          half of cases follow a complete hydatidiform mole, a quarter follow a term pregnancy, and a
          quarter follow abortion, ectopic or other gestational events. Because the tumour genome derives
          wholly or partly from the paternal contribution to that gestation, it is genetically foreign
          to the patient — a partial or complete allograft — which underlies both its intrinsic immunogenicity
          and the STR-genotyping test that identifies it. Gestational choriocarcinoma is highly chemosensitive:
          low-risk disease is cured by single-agent methotrexate or dactinomycin, high-risk disease by
          EMA-CO.'
      selected_evidence:
        snippet: "Approximately 50%, 25%, and 25% of gestational choriocarcinoma occur \nafter molar pregnancies,\
          \ term pregnancies, and other gestational events, \nrespectively."
        supports: SUPPORT
    origin:
