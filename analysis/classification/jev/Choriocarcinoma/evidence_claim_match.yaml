      assertion_type: Pathophysiology
      assertion:
        name: Multidrug-Resistant Refractory Disease
        biological_scale: CELLULAR
        role: outcome
        description: Fewer than 5% of women with gestational choriocarcinoma die, and when they do it
          is overwhelmingly from disease that has become resistant to multiple cytotoxic agents rather
          than from untreated bulk. This small refractory population — together with the inherently less
          chemosensitive non-gestational and intermediate-trophoblast tumours — is the entire remaining
          unmet need in an otherwise near-curable disease, and is the population in which PD-1/PD-L1 blockade
          has produced durable responses.
      selected_evidence:
        snippet: "Most patients \nwith gestational choriocarcinoma are cured with chemotherapy; however,\
          \ some \n(<5.0%) will die as a result of multi-drug resistance, underscoring the need for \n\
          novel approaches in this group of patients."
        supports: SUPPORT
