  214588ddecf28e71efeb929b136bd853674639942acc42cfdf934c9a01123841:
    claim:
      about:
        disease:
          name: Choriocarcinoma
          disease_term:
            preferred_term: Choriocarcinoma
            term:
              id: MONDO:0005207
              label: choriocarcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Paternal Genome Content and Semi-Allogeneic Tumour Identity
        biological_scale: MOLECULAR
        role: trigger
        description: 'Gestational choriocarcinoma derives from the trophoblast of a prior conceptus, so
          its genome contains a paternal allele complement that is absent from the patient''s own tissues.
          In the most common precursor, the complete hydatidiform mole, the conceptus genome is entirely
          androgenetic. The tumour is therefore a partial or complete natural allograft. Two consequences
          follow and organise the rest of the pathograph: detection of that foreign paternal allele set
          by STR genotyping definitively separates gestational from non-gestational choriocarcinoma, which
          matters because the two are treated differently; and the allogeneic tumour is intrinsically
          immunogenic and must actively suppress host T cells to survive. Non-gestational (germ cell)
          choriocarcinoma, by contrast, carries only the patient''s own genome and lacks this feature.
          The imprinting biology of the molar precursor itself (CDKN1C/p57 loss) is curated in Hydatidiform_Mole
          and Gestational_Trophoblastic_Neoplasm.'
        cell_types:
        - preferred_term: trophoblast cell
          term:
            id: CL:0000351
            label: trophoblast cell
        notes: 'No `biological_processes` term is asserted on this node. The obvious candidate, GO:0071514
          genomic imprinting, would over-claim: the evidence here concerns paternal genome *content* (an
          allele complement foreign to the host), not the imprinting *process*, and the imprinting mechanics
          of the molar precursor are deliberately curated in Hydatidiform_Mole and Gestational_Trophoblastic_Neoplasm
          rather than restated here.'
      selected_evidence:
        snippet: 'Genotyping detection of a

          distinct paternal genetic complement not present in the

          patient’s normal tissues'
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
