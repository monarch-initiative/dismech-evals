        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: ICDOMorphologyAssignment
      assertion:
        classification_value: Trophoblastic Tumor
        notes: Choriocarcinoma is ICD-O morphology code 9100/3; MONDO:0005207 carries the ICDO:9100/3
          cross-reference. This entry previously carried ``Carcinoma`` with a note recording that the
          enum had no trophoblastic axis value; ``Trophoblastic Tumor`` (NCIT:C3422) was added for exactly
          this gap and is now assigned. The value covers both forms this entry models - gestational choriocarcinoma
          and the non-gestational germ-cell form - because NCIT:C3422 is defined as "a gestational or
          non-gestational neoplasm characterized by excessive proliferation of trophoblastic cells". Where
          a case is known to be the non-gestational variant, that is a germ cell tumour clinically and
          is treated as one; the morphology axis is single-valued, so the trophoblastic family is recorded
          here and the germ-cell reading is left to the entry's prose.
      selected_evidence:
        snippet: "Gestational choriocarcinoma is the most common form of gestational \ntrophoblastic neoplasm."
        supports: SUPPORT
        directness: INDIRECT
    origin:
