        finding_term:
          preferred_term: Confluent tumour necrosis with haemorrhage
          term:
            id: NCIT:C41612
            label: Extensive Necrosis
        description: 'Choriocarcinoma grows as a bulky, friable, destructive mass with confluent haemorrhage
          and necrosis, so that viable tumour is often only a thin rim at the periphery. This reflects
          rapid growth outstripping a vasculature the tumour itself erodes, and explains the clinical
          tendency to catastrophic bleeding at metastatic sites. No `frequency` band is asserted: the
          source says the tumour "typically forms" such masses, which does not license a quantitative
          band.'
      selected_evidence:
        snippet: 'Choriocarcinoma typically forms bulky, destructive mass

          lesions with extensive hemorrhage and necrosis within the

          involved organ.'
        supports: SUPPORT
