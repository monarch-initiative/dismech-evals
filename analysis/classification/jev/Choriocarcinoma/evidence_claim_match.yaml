      assertion_type: DifferentialDiagnosis
      assertion:
        name: Placental site trophoblastic tumour
        disease_term:
          preferred_term: placental site trophoblastic tumor
          term:
            id: MONDO:0020552
            label: placental site trophoblastic tumor
        description: A gestational trophoblastic neoplasm of intermediate (implantation-site) trophoblast
          rather than of the biphasic cytotrophoblast/syncytiotrophoblast population that defines choriocarcinoma.
          It is the single most important GTN differential because it is relatively chemoresistant, so
          the distinction changes management from chemotherapy to hysterectomy.
        distinguishing_features:
        - Composed of mononuclear implantation-site intermediate trophoblast, without the biphasic/triphasic
          pattern and without the syncytiotrophoblastic component of choriocarcinoma.
        - Serum hCG is characteristically low relative to tumour burden, in contrast to the extreme hCG
          elevation of choriocarcinoma.
        - Relatively chemoresistant, so primary hysterectomy rather than methotrexate-based chemotherapy
          is the treatment of choice.
      selected_evidence:
        snippet: "They consist of invasive mole, choriocarci-\nnoma, placental-site \ntrophoblastic tumour\
          \ (PSTT) \nand epithelioid trophoblastic tumour (ETT)."
        supports: SUPPORT
