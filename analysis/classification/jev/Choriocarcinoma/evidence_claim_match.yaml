            term:
              id: MONDO:0005207
              label: choriocarcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cc_nongestational_evidence_base
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Paternal Genome Content and Semi-Allogeneic Tumour Identity
        prompt: Does non-gestational (germ cell) choriocarcinoma share the pathophysiology modelled here
          beyond the shared trophoblastic morphology, and how much worse is its outcome once stage and
          burden are matched?
        rationale: The non-gestational subtype is asserted as a mechanistically distinct arm of this entry,
          yet the entire arm rests on a handful of references, the largest of which is a pooled analysis
          of only 39 published cases. Nothing in the literature retrieved for this entry establishes whether
          the hCG-driven paraneoplastic axis, the PD-L1 immune-resistance mechanism, or the extreme chemosensitivity
          apply to the germ-cell form, and no matched comparative survival analysis against gestational
          disease exists. Because the gestational-versus-non-gestational call directly changes therapy,
          this is a consequential gap rather than an academic one.
        proposed_experiments:
        - experiment_id: exp_cc_ngc_matched_outcome_cohort
          name: Matched-outcome cohort of genotype-confirmed non-gestational choriocarcinoma
          description: Assemble a multi-centre cohort of choriocarcinomas in which STR genotyping has
            confirmed the absence of a paternal allele complement, and compare stage- and burden-matched
            survival and chemotherapy response against genotype-confirmed gestational cases treated at
            the same centres. This would replace the current reliance on small pooled case series and
            test whether the worse outcome attributed to non-gestational disease survives adjustment for
            stage and tumour burden.
        - experiment_id: exp_cc_ngc_pdl1_immune_profiling
          name: PD-L1 and tumour-infiltrating lymphocyte profiling of non-gestational choriocarcinoma
          description: Apply the PD-L1 immunohistochemistry and immune-infiltrate profiling that established
            the adaptive immune-resistance mechanism in gestational choriocarcinoma to genotype-confirmed
            non-gestational cases. Because the non-gestational tumour is autologous rather than allogeneic,
            this directly tests whether the immune-evasion arm of this pathograph, and therefore the rationale
            for checkpoint blockade, generalises to the germ cell form.
      selected_evidence:
        snippet: Only 39 patients were retrieved from 36 studies in total.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
