      assertion:
        name: Non-gestational choriocarcinoma
        disease_term:
          preferred_term: non-gestational ovarian choriocarcinoma
          term:
            id: MONDO:0004322
            label: non-gestational ovarian choriocarcinoma
        description: 'Choriocarcinoma arising from a germ cell tumour (or, rarely, as somatic dedifferentiation)
          rather than from a gestation. It is histologically indistinguishable from gestational choriocarcinoma,
          so the distinction rests entirely on DNA genotyping for paternal alleles. This is the most consequential
          differential in the entry: non-gestational disease lacks the semi-allogeneic paternal genome
          that the trigger node models, does not carry the same exquisite methotrexate sensitivity, and
          is treated on germ-cell (BEP-type) rather than GTN protocols with a worse prognosis. It is curated
          here both as a has_subtypes entry and as a differential for that reason.'
        distinguishing_features:
        - Absence of paternal-specific alleles on short tandem repeat DNA genotyping; the tumour genome
          matches the patient.
        - Arises in the ovary or other germ-cell sites rather than following an identifiable index gestation.
        - Treated with platinum/bleomycin-based germ-cell chemotherapy and surgical staging rather than
          the methotrexate-based GTN protocols.
      selected_evidence:
        snippet: 'DNA genotyping provides a decisive tool in the separation of gestational

          trophoblastic neoplasia from non-gestational counterparts/mimics of either germ cell or

          somatic origin.'
        supports: SUPPORT
