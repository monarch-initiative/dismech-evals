            context: Markedly elevated and proportional to viable tumour burden; used for diagnosis, FIGO/WHO
              risk scoring, response monitoring and relapse detection.
            notes: 'hCG is the operational endpoint of therapy in gestational trophoblastic neoplasia:
              chemotherapy is continued to normalisation and then consolidated, and a plateauing or rising
              titre defines resistance. Pre-treatment hCG is one of eight weighted terms in the FIGO/WHO
              prognostic score. Assay caveats matter clinically — heterophile-antibody interference produces
              so-called phantom hCG and can prompt unnecessary chemotherapy, and the high-dose hook effect
              can spuriously lower very high results unless the sample is diluted. The analyte is deliberately
              bound to the TOTAL hCG LOINC code 19080-1 rather than the free beta-subunit code 21198-7:
              gestational trophoblastic neoplasia monitoring and the FIGO/WHO score both use a total-hCG
              assay, even though "beta-hCG" is the usual clinical shorthand.'
