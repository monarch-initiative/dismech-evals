          differentiation. This is the only reliable discriminator - morphology and the trophoblastic
          immunohistochemical panel (including SALL4) cannot separate the entities - and it changes therapy,
          so it should precede treatment whenever origin is uncertain. Genotyping additionally identifies
          the index gestation and the interval since it, two scored terms in the FIGO/WHO prognostic system.
