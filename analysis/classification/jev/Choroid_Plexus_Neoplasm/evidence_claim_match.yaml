        description: 'Conditional expression of a stabilised c-Myc together with Trp53 inactivation in
          the choroid plexus of newborn mice produces choroid plexus carcinoma with complete penetrance
          across all brain ventricles, with a lateral- and fourth-ventricular predominance matching the
          human site distribution, and death from hydrocephalus within 150 days. The tumours recapitulate
          human carcinoma histology and show dysregulated cell-cycle and DNA-damage-response programs.
          Translational caveat: MYC stabilisation is an engineered lesion, not a recurrent human alteration,
          so the model demonstrates sufficiency of the p53-loss-plus-oncogene combination rather than
          fidelity to the human genotype.'
      selected_evidence:
        snippet: Choroid plexus tumours occurred with a complete penetrance in all brain ventricles, with
          prevalence in the lateral and fourth ventricles.
        supports: SUPPORT
