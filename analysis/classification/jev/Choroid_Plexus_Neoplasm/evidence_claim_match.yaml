        description: The second of the two hydrocephalus mechanisms, and independent of the first. The
          intraventricular mass can occlude the ventricular outflow route directly - for example a fourth-ventricular
          tumor blocking the outlets - producing hydrocephalus with a normal cerebrospinal fluid formation
          rate. In addition, obstruction of the subarachnoid pathways and increased cerebrospinal fluid
          outflow resistance, attributed to repeated subarachnoid bleeding from these highly vascular
          tumors and to raised cerebrospinal fluid protein, can persist after complete tumor removal,
          which is why some patients remain shunt-dependent despite radical resection and no residual
          tumor.
        biological_processes:
