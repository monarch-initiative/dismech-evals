        name: Choroid plexus hyperplasia (villous hypertrophy)
        description: Diffuse enlargement of the choroid plexus without a discrete neoplastic mass. It
          causes hydrocephalus by the same cerebrospinal fluid overproduction mechanism as a papilloma,
          so the mechanistic overlap is genuine even though the lesion is not a tumor - which makes it
          the one differential that shares this entry's core pathophysiology.
        distinguishing_features:
        - Imaging shows bilateral diffuse plexus enlargement rather than a solitary lobulated mass.
        - Hydrocephalus is communicating and purely overproduction-driven, with no obstructive component
          from mass effect.
      selected_evidence:
        snippet: Whereas these data are regarded as conclusive evidence of CSF overproduction by a choroid
          plexus papilloma
        supports: SUPPORT
