        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: acpp_molecular_identity
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is atypical choroid plexus papilloma a distinct biological entity, or a histologic risk
          stratum within choroid plexus papilloma?
        attaches_to:
        - pathophysiology#Malignant Progression to High-Grade Carcinoma
        rationale: WHO grade 2 atypical choroid plexus papilloma is defined purely by a mitotic-count
          threshold, and that threshold is genuinely prognostic for recurrence. But genome-wide copy-number,
          expression and methylation profiling has repeatedly failed to separate atypical papilloma from
          ordinary papilloma, and the authors of the largest such study concluded the two histologic subgroups
          are a single molecular entity. Whether the mitotic threshold captures a distinct biology or
          simply samples the upper tail of a continuous proliferative distribution within one entity is
          unresolved, and it matters for whether adjuvant decisions should be driven by grade or by molecular
          class.
        proposed_experiments:
        - experiment_id: acpp_mitotically_stratified_profiling
          name: Mitotically stratified molecular profiling of papilloma
          description: Prospective single-cell and methylation profiling of a papilloma cohort stratified
            by mitotic count, testing whether a molecular discontinuity exists at the 2-mitoses-per-10-HPF
            threshold.
          supporting_outcome:
          - A step change in molecular profile at the 2-mitoses-per-10-HPF threshold.
          refuting_outcome:
          - A continuous molecular gradient across mitotic counts with no discontinuity.
        - experiment_id: acpp_grade_versus_methylation_prognosis
          name: Head-to-head prognostic comparison of grade versus methylation class
          description: Correlate methylation subgroup (pediatric A / pediatric B / adult) against mitotic
            count and recurrence in a pooled registry to determine which better predicts outcome.
          supporting_outcome:
          - Mitotic count outperforming methylation class as a predictor of recurrence.
          refuting_outcome:
          - Methylation class outperforming mitotic count as a predictor of recurrence.
      selected_evidence:
        snippet: molecular similarities among the papillomas suggest that these two histologic subgroups
          are indeed a single molecular entity
        supports: SUPPORT
