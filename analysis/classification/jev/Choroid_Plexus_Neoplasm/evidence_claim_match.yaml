            label: Neurodevelopmental abnormality
        frequency: FREQUENT
        subtype: CPC
        description: Neurodevelopmental and sensorineural impairment in carcinoma survivors reflects the
          combined burden of infantile hydrocephalus, tumor and surgical injury, and treatment neurotoxicity.
          Even in radiation-sparing protocols the majority of survivors have significant neurocognitive
          or sensorial deficits. The FREQUENT band and the scope of this claim are deliberately restricted
          to choroid plexus carcinoma survivors, the only group in which it has been quantified; grade
