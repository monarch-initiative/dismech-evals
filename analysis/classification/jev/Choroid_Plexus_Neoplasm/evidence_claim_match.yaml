        action_category: DIAGNOSTIC
        description: 'Paired germline TP53 testing with genetic counselling is indicated in essentially
          every child with choroid plexus carcinoma, irrespective of family history, and must be performed
          before treatment starts. It is the highest-value single action in the entry because it changes
          three things at once: the treatment plan (avoiding radiotherapy and genotoxic chemotherapy in
          carriers), lifelong surveillance for the patient, and cascade testing for relatives.'
        treatment_term:
          preferred_term: Genetic Testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        therapeutic_modality: OTHER
      selected_evidence:
        snippet: It is critical to perform TP53 testing before the initiation of treatment in order to
          avoid in carriers, if possible, radiotherapy and genotoxic chemotherapies.
