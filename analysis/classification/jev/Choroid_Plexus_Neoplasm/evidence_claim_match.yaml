          term:
            id: UBERON:0000315
            label: subarachnoid space
      selected_evidence:
        snippet: The persisting hydrocephalus is probably caused by an increase of the CSF outflow resistance
          because of a distal CSF-pathway obstruction.
        supports: SUPPORT
