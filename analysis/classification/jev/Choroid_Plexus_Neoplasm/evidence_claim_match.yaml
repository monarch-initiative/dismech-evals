  f1d469fac9c5be9753439e36f2496a84edae3335fa891b5ad3b08fcd24d35331:
    claim:
      about:
        disease:
          name: Choroid Plexus Neoplasm
          disease_term:
            preferred_term: choroid plexus neoplasm
            term:
              id: MONDO:0016717
              label: choroid plexus neoplasm
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Adult-Specific TERT Promoter Activation
        biological_scale: MOLECULAR
        role: driver
        description: 'A separate, adult-restricted route into the same tumor. TERT promoter mutations
          occur in a quarter of adult choroid plexus tumor patients, reactivating telomerase and conferring
          replicative capacity; they are essentially absent from the pediatric-dominant subgroups, where
          TP53 is the recurrent lesion instead. TERT promoter mutation is prognostic in adults, associating
          with shorter progression-free survival, and a rare CCDC47-PRKCA fusion is a further adult-specific
          alteration reported in an aggressive papilloma. The pediatric counterpart of this telomere-maintenance
          requirement is telomerase-independent: alternative lengthening of telomeres is enriched in choroid
          plexus carcinoma (23% of cases) and is tied to somatic, not germline, TP53 mutation.'
        genes:
        - preferred_term: TERT
          term:
            id: hgnc:11730
            label: TERT
        biological_processes:
        - preferred_term: telomere maintenance
          modifier: INCREASED
          term:
            id: GO:0000723
            label: telomere maintenance
        cell_types:
        - preferred_term: choroid plexus epithelial cell
          term:
            id: CL:0000706
            label: choroid plexus epithelial cell
      selected_evidence:
        snippet: On the contrary, TERT promoter mutations were encountered in 7/28 adult patients (25%)
          and associated with shorter progression-free survival (log-rank test, p=0.015).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
