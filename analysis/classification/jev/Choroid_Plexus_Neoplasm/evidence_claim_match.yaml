        association: Germline pathogenic TP53 variants cause Li-Fraumeni syndrome / heritable TP53-related
          cancer syndrome, of which choroid plexus carcinoma is a sentinel tumor. In the landmark multi-institutional
          series, every patient with a germline TP53 mutation fulfilled Li-Fraumeni criteria and every
          patient not meeting those criteria had wild-type TP53. Roughly a third of choroid plexus carcinomas
          occur in the setting of Li-Fraumeni syndrome. Cross-reference kb/disorders/Li-Fraumeni_Syndrome.yaml.
        frequency: 'Reported estimates range widely with cohort and ascertainment: approximately 36% in
          a 10-study narrative review, and 4 of 13 patients in the prospective SJYC07 cohort were germline
          carriers. Li-Fraumeni guideline sources quote higher fractions in children. Treat any single
          point estimate as cohort-dependent.'
        notes: Because a tumor-only TP53 result cannot distinguish germline from somatic origin, paired
          germline testing with genetic counselling is indicated in essentially every choroid plexus carcinoma,
          irrespective of family history, and must precede treatment planning because it changes radiotherapy
          and genotoxic-chemotherapy decisions.
      selected_evidence:
        snippet: All individuals with germline TP53 mutations fulfilled LFS criteria, whereas all patients
          not meeting these criteria harbored wild-type TP53 (P < .001).
        supports: SUPPORT
