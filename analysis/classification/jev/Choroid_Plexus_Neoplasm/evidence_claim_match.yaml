        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: sv40_aetiology
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does simian virus 40 contribute to human choroid plexus tumorigenesis, or is the historical
          SV40 association entirely an artefact of PCR contamination and transgenic-mouse extrapolation?
        attaches_to:
        - environmental#Simian virus 40 (SV40) exposure
        rationale: 'SV40 large T antigen reliably produces choroid plexus tumors in transgenic mice, and
          SV40 DNA sequences were reported in human choroid plexus tumors, which generated a long-lived
          aetiological hypothesis. The two strongest human tests point the other way: a nationwide Danish
          cohort found no excess of choroid plexus tumor after SV40-contaminated poliovirus vaccine exposure,
          and SV40 large T antigen was undetectable by immunohistochemistry in 82 central nervous system
          tumors. The residual gap is that these are negative studies of population exposure and protein
          detection respectively; neither formally excludes a hit-and-run or low-prevalence mechanism,
          and the discordance with earlier PCR-positive series has never been fully resolved. This entry
          therefore records the question as contested and currently unsupported rather than settled.'
        proposed_experiments:
        - experiment_id: sv40_contamination_controlled_sequencing
          name: Contamination-controlled deep sequencing for SV40 in a contemporary cohort
          description: Deep sequencing of a contemporary, well-powered choroid plexus tumor cohort with
            rigorous contamination controls, reporting SV40 read counts against matched normal tissue
            from the same patients.
          supporting_outcome:
          - Reproducible SV40 reads above matched-normal background in a meaningful fraction of tumors.
          refuting_outcome:
          - Absence of SV40 reads above background across an adequately powered cohort.
        - experiment_id: sv40_harmonised_pcr_reanalysis
          name: Harmonised reanalysis of discordant PCR series
          description: Pooled reanalysis of the discordant PCR-positive and PCR-negative series using
            harmonised assay controls, to determine whether laboratory contamination explains the geographic
            pattern of positivity.
          supporting_outcome:
          - Persistence of geographic positivity after assay harmonisation.
          refuting_outcome:
          - Disappearance of positivity under common contamination controls.
      selected_evidence:
        snippet: Exposure to SV40-contaminated poliovirus vaccine in Denmark was not associated with increased
          cancer incidence.
        supports: REFUTE
    origin:
