        context: []
      assertion_type: Environmental
      assertion:
        name: Simian virus 40 (SV40) exposure
        exposure_term:
          preferred_term: viral exposure
          term:
            id: ECTO:3000001
            label: exposure to virus
        presence: ABSENT
        description: 'An aetiological role for SV40 in choroid plexus tumors was proposed historically
          on the basis of SV40 DNA sequences detected in tumor tissue and of SV40 large T antigen driving
          choroid plexus tumors in transgenic mice, and was linked to the accidental SV40 contamination
          of early poliovirus vaccine. This entry treats the claim as contested and, on current evidence,
          largely discounted rather than established: a nationwide Danish cohort of 69.5 million person-years
          found no excess of choroid plexus tumor in the vaccine-exposed birth cohorts, and immunohistochemistry
          for SV40 large T antigen was negative in all of 82 central nervous system tumors including choroid
          plexus lesions. The entry therefore asserts neither causation nor definitive exclusion; it records
          that the epidemiological and protein-level evidence does not support SV40 as a cause.'
        notes: '`presence: ABSENT` is the closest available schema value for "exposure examined and found
          not to be associated"; the enum has no NOT_ASSOCIATED value, and `effect:` is deliberately left
          unset because neither a causal nor a protective label is correct. Read the description and the
          REFUTE-tagged evidence, not the enum, for the intended claim. The residual uncertainty is that
          the negative studies address vaccine-era population exposure and large T antigen protein detection,
          not every proposed SV40 mechanism.'
      selected_evidence:
        snippet: Specifically, SV40 exposure was not associated with increased incidence of mesothelioma,
          ependymoma, choroid plexus tumor, or non-Hodgkin's lymphoma.
        supports: REFUTE
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
