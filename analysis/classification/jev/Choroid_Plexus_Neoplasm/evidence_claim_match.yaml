            preferred_term: choroid plexus neoplasm
            term:
              id: MONDO:0016717
              label: choroid plexus neoplasm
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Choroid plexus cyst
        description: A benign, usually incidental fluid-filled cyst of the choroid plexus stroma, most
          often detected on second-trimester fetal ultrasound and associated with trisomy 18 when other
          markers are present. Despite the shared anatomical name it is not a neoplasm, has no relationship
          to the choroid plexus tumor family, and is included here explicitly because the name similarity
          is a recognised source of literature and curation confusion.
        distinguishing_features:
        - A choroid plexus cyst is a non-enhancing, non-solid cystic structure that typically resolves
          spontaneously, produces no mass effect and no hydrocephalus, and requires no oncological management.
        - Choroid plexus neoplasms are solid, intensely enhancing intraventricular masses that present
          with hydrocephalus.
        notes: The HPO term HP:0002190 Choroid plexus cyst records this distinct, non-neoplastic concept;
          it is not bound as `disease_term` here because the descriptor takes a disease rather than a
          phenotype term.
      selected_evidence:
        snippet: Choroid plexus cysts (CPCs) are fluid-filled structures within the choroid plexus of
          the lateral ventricles, most frequently identified during routine second-trimester ultrasound
          examinations.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/4
      evidence_path: /differential_diagnoses/4/evidence/0
      context_paths:
