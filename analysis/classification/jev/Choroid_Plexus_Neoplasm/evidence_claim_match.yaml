        context: []
      assertion_type: Subtype
      assertion:
        name: aCPP
        display_name: Atypical Choroid Plexus Papilloma (WHO grade 2)
        subtype_term:
          preferred_term: atypical choroid plexus papilloma
          term:
            id: MONDO:0002684
            label: atypical choroid plexus papilloma
        description: WHO grade 2 intermediate entity defined operationally by increased mitotic activity
          - at least 2 mitoses per 10 high-power fields - which was the only atypical histologic feature
          independently associated with recurrence in the series that established the definition. Ancillary
          features (hypercellularity, nuclear pleomorphism, blurring of the papillary architecture, necrosis)
          may be present but are not required. Recurrence risk is intermediate between papilloma and carcinoma.
          Notably, DNA-methylation and copy-number profiling has not separated aCPP from CPP, so the entity
