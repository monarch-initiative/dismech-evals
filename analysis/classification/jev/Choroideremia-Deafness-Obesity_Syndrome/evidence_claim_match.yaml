        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Xq21 Contiguous Gene Deletion
        biological_scale: MOLECULAR
        description: 'An interstitial deletion of the Xq21 region removes several contiguous genes, including
          the choroideremia gene CHM and the POU-domain transcription factor gene POU3F4 (DFN3), plus
          additional neighbouring loci in the X-linked mental retardation (MRX) region. The size and gene
          content of the deletion determine which extra-ocular features accompany the choroideremia.

          '
      selected_evidence:
        snippet: The deleted region harbors 12 OMIM genes, of which POU3F4, CHM, and ZNF711 might have
          contributed to the patient's phenotype including hearing loss, poor vision, and intellectual
          disability.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
