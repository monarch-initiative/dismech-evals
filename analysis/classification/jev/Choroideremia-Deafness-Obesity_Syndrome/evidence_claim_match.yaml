            term:
              id: MONDO:0010558
              label: choroideremia-deafness-obesity syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: REP1 (CHM) Deficiency and Impaired Rab Prenylation
        biological_scale: CELLULAR
        description: 'Deletion of CHM eliminates Rab escort protein 1 (REP1), which presents Rab GTPases
          to geranylgeranyltransferase for prenylation. Defective Rab prenylation disrupts intracellular
          vesicular trafficking, especially in the retinal pigment epithelium and photoreceptors, leading
          to progressive degeneration of the choriocapillaris, RPE, and photoreceptor layer (choroideremia).

          '
        molecular_functions:
        - preferred_term: Rab geranylgeranyltransferase activity
          term:
            id: GO:0004663
            label: Rab geranylgeranyltransferase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: protein geranylgeranylation
          term:
            id: GO:0018344
            label: protein geranylgeranylation
          modifier: DECREASED
        - preferred_term: Rab protein signal transduction
          term:
            id: GO:0032482
            label: Rab protein signal transduction
          modifier: ABNORMAL
      selected_evidence:
        snippet: Lymphoblasts from choroideremia subjects showed a marked deficiency in the activity of
          component A, but not component B, of Rab GG transferase.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
