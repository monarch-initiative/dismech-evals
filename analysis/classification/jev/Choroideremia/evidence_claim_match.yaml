      assertion_type: Treatment
      assertion:
        name: Subretinal AAV2-REP1 Gene Therapy (Timrepigene Emparvovec)
        description: 'Subretinal delivery of an AAV2 vector carrying CHM, intended to restore REP1 in
          the surviving central island. The randomized phase 3 trial in 169 adult men did NOT meet its
          primary endpoint of best-corrected visual acuity improvement at 12 months, so key secondary
          endpoints were not formally tested; a numerically larger proportion of treated than control
          participants gained 10 or more ETDRS letters. Adverse events were mostly mild or moderate. This
          is recorded as an investigational therapy with a negative pivotal trial, not as standard of
          care. The authors identify entry criteria (more preserved retinal area), surgical technique
          and endpoint selection as the levers for future studies - which is consistent with the natural
          history data showing residual RPE area, not acuity, to be the quantity that changes measurably.

          '
        therapeutic_modality: GENE_THERAPY
        treatment_term:
          preferred_term: gene therapy
          term:
            id: NCIT:C15238
            label: Gene Therapy
      selected_evidence:
        snippet: The trial did not meet its primary endpoint of best-corrected visual acuity (BCVA) improvement.
        supports: SUPPORT
