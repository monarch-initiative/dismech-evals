              id: MONDO:0010557
              label: choroideremia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Rab Prenylation and Intracellular Vesicle Trafficking
        description: 'Without REP1 a subset of Rab GTPases goes unprenylated and cannot associate with
          the membranes whose traffic they direct. The consequence is a vesicle trafficking deficiency,
          which in the retina plausibly disrupts the processes that depend most heavily on high-throughput
          membrane traffic: daily phagocytosis and digestion of shed photoreceptor outer segment discs
          by the retinal pigment epithelium, melanosome and lysosome transport, and outer-segment renewal
          itself. The paralogue REP2 substitutes for REP1 in most tissues, which is why the systemic prenylation
          defect is clinically silent outside the eye.

          '
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        biological_processes:
        - preferred_term: Vesicle-mediated transport
          term:
            id: GO:0016192
            label: vesicle-mediated transport
          modifier: DECREASED
        - preferred_term: Rab protein signal transduction
          term:
            id: GO:0032482
            label: Rab protein signal transduction
          modifier: DECREASED
      selected_evidence:
        snippet: Mutations in the Rab escort protein-1 (REP-1), an ubiquitously encoded protein of the
          CHM gene, lead to prenylation and vesicle trafficking deficiency in the protein, resulting in
          the progressive degeneration of choriocapillaris, retinal pigment epithelium (RPE), and photoreceptors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
