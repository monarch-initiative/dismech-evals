        description: 'Atrophy begins in the midperiphery and advances inward, sparing a shrinking central
          island of retinal pigment epithelium that preserves good central acuity long after the peripheral
          field has gone - patients are often legally blind by field criteria while still reading. That
          island''s area, measured by fundus autofluorescence, declines exponentially with age at a rate
          independent of how much was present at baseline, so the disease follows a strikingly regular
          course over about six decades and log-transformed residual RPE area serves as an anatomic trial
          endpoint. Central vision fails when the island is finally consumed, typically in the fifth to
          seventh decade.

          '
        role: consequence
