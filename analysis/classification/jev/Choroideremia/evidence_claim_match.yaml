  df3a50e9e32dec55603fa3339cd955199236670e40fb7a8c41df48dc5e969a6e:
    claim:
      about:
        disease:
          name: Choroideremia
          disease_term:
            preferred_term: choroideremia
            term:
              id: MONDO:0010557
              label: choroideremia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CHM Loss of Function and REP1 Deficiency
        description: 'A hemizygous loss-of-function variant in CHM - most often nonsense, frameshift,
          splice or deletion, with essentially no missense hotspot - abolishes Rab escort protein 1. REP1
          is not itself an enzyme: it binds newly synthesized Rab GTPases and presents them to Rab geranylgeranyltransferase,
          then escorts the prenylated Rab to its target membrane. The gene is expressed ubiquitously,
          so the lesion is systemic even though the disease is not.

          '
        role: trigger
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: Protein prenylation
          term:
            id: GO:0018342
            label: protein prenylation
          modifier: DECREASED
      selected_evidence:
        snippet: Choroideremia is caused by mutations in the CHM gene which encodes Rab escort protein
          1 (REP1), an ubiquitously expressed protein involved in intracellular trafficking and prenylation
          activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30627697
      reference_title: 'Choroideremia: from genetic and clinical phenotyping to gene therapy and future
        treatments.'
      evidence_source: OTHER
      explanation: 'Identifies the gene, the protein and its two coupled functions - prenylation and intracellular
        trafficking - and states the ubiquitous expression that makes the eye-restricted phenotype notable.
        Evidence source is OTHER because this is a review.

        '
