              id: MONDO:0010557
              label: choroideremia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Progressive Chorioretinal Degeneration
        description: 'Photoreceptors, retinal pigment epithelium and choriocapillaris all degenerate,
          producing the scalloped, sharply demarcated atrophy that exposes bare sclera and gives the disease
          its name. Which tissue fails first is not settled: the RPE, the photoreceptor and the choroid
          are all plausible primary sites, they are metabolically interdependent, and the loss of any
          one would take the others with it. This entry records that uncertainty rather than resolving
          it, because the answer determines which cell type gene therapy must reach.

          '
        role: effector
        biological_scale: TISSUE
        cell_types:
        - preferred_term: retinal pigment epithelial cell
          term:
            id: CL:0002586
            label: retinal pigment epithelial cell
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000210
            label: photoreceptor cell
        - preferred_term: choroidal cell of the eye
          term:
            id: CL:0000348
            label: choroidal cell of the eye
        biological_processes:
        - preferred_term: Photoreceptor cell maintenance
          term:
            id: GO:0045494
            label: photoreceptor cell maintenance
          modifier: DECREASED
        locations:
        - preferred_term: optic choroid
          term:
            id: UBERON:0001776
            label: optic choroid
        - preferred_term: pigmented layer of retina
          term:
            id: UBERON:0001782
            label: pigmented layer of retina
        conforms_to: photoreceptor_degeneration#Rod Photoreceptor Apoptosis
      selected_evidence:
        snippet: The exact site of pathogenesis remains unclear but results in degeneration of the photoreceptors,
          retinal pigment epithelium and choroid.
        supports: SUPPORT
    origin:
