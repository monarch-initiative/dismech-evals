      reference_title: 'The large Hellenic Study of Uveitis: epidemiology, etiologic factors and classification.'
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the infectious/non-infectious split in a 30-year tertiary uveitis cohort,
