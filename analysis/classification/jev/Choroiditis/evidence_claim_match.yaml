        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: 'Impaired host immunity permits the organism to grow and persist rather than causing
          it to arrive, which is why this is recorded as exacerbating. Pointed at pathogen persistence
          and not at this entry''s unopposed-immunosuppression node, which is a distinct claim: that node
          models iatrogenic immunosuppression given for a misdiagnosed infection, whereas this exposure
          is host immunocompromise however arising.'
      selected_evidence:
        snippet: Immunocompromised patients showed a significantly larger size of retinitis than immunocompetent
          patients.
