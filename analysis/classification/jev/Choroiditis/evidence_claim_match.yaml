        subtype_term:
          preferred_term: ocular toxoplasmosis
          term:
            id: MONDO:0005879
            label: ocular toxoplasmosis
        description: Necrotising retinochoroiditis caused by Toxoplasma gondii, the leading infectious
          cause of posterior uveitis worldwide. Classically presents as a focal white retinal lesion with
          overlying vitritis, frequently recurring at the border of a pre-existing pigmented chorioretinal
          scar as tissue cysts reactivate. Requires antiparasitic therapy; corticosteroid must never be
          given without antiparasitic cover.
