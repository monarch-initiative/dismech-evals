            label: pigmented layer of retina
        - preferred_term: outer nuclear layer of retina
          term:
            id: UBERON:0001789
            label: outer nuclear layer of retina
      selected_evidence:
        snippet: The histological findings of the lesions are atrophy of the choriocapillaris, retinal
