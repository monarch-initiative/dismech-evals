        context: []
      assertion_type: Pathophysiology
      assertion:
        name: HLA-A29-Restricted Antigen Presentation in Birdshot Chorioretinopathy
        biological_scale: MOLECULAR
        role: driver
        description: 'Birdshot chorioretinopathy carries one of the strongest HLA-disease associations
          documented in human medicine: essentially all patients are HLA-A29 positive. In a classic series
          47 of 49 birdshot patients (95.9%) carried HLA-A29, and the linked HLA-B12(B44) association
          is explained by linkage disequilibrium with HLA-A29 rather than by independent effect. Mechanistically
          the association is not merely a marker - genetic modifiers act on the peptide-loading pathway
          that supplies HLA-A29. ERAP1 and ERAP2 haplotypes that increase ERAP2 expression and decrease
          ERAP1 expression raise risk in HLA-A29 carriers, while a haplotype disrupting ERAP2 expression
          is protective, and homozygosity for HLA-A29 further increases susceptibility. Together these
          implicate a peptide-presentation threshold model in which excess presentation of ERAP2-shaped
          peptides on HLA-A29 activates the immune response in the choroid.'
        cell_types:
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: antigen processing and presentation of peptide antigen via MHC class I
          modifier: INCREASED
          term:
            id: GO:0002474
            label: antigen processing and presentation of peptide antigen via MHC class I
        genes:
        - preferred_term: HLA-A29
          term:
            id: hgnc:4931
            label: HLA-A
        - preferred_term: ERAP1
          term:
            id: hgnc:18173
            label: ERAP1
        - preferred_term: ERAP2
          term:
            id: hgnc:29499
            label: ERAP2
        locations:
        - preferred_term: choroid
          term:
            id: UBERON:0001776
            label: optic choroid
      selected_evidence:
        snippet: Of these 49 patients, 47 (95.9%) had the HLA-A29 antigen.
        supports: SUPPORT
