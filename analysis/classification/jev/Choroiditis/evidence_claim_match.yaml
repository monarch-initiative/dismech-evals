      assertion_type: Environmental
      assertion:
        name: Immunocompromise
        notes: Left ontologically unbound deliberately. ECTO's only immunosuppression term, ECTO:9001747,
          is defined as exposure to an immunosuppressive agent (RO:0002309 some CHEBI:35705) -- a drug
          exposure. This entry describes immunosuppression as a host state with non-drug causes, so that
          term would assert something the entry's own description rules out. No host-immunosuppression-state
          exposure term exists.
        presence: PRESENT
      selected_evidence:
        snippet: Immunocompromised patients showed a significantly larger size of retinitis than immunocompetent
          patients.
        supports: SUPPORT
