      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Choroiditis is a leading cause of irreversible vision loss from posterior uveitis.
          Photoreceptor and RPE loss is permanent, one-fifth of eyes in a treated ocular toxoplasmosis
          cohort ended with acuity of 20/200 or worse, and recurrent disease plus choroidal neovascularization
          accrue further deficit over decades. Many patients require indefinite immunosuppression with
          its own morbidity, and the disease typically affects working-age adults.
      selected_evidence:
        snippet: At the final visit, 21% of all affected eyes suffered VA ≤ 20/200.
        supports: SUPPORT
