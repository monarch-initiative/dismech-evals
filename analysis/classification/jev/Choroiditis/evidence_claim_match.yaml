        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Ocular syphilis
        description: 'Syphilitic chorioretinitis is curated as a subtype here, but ocular syphilis is
          also the universal differential: it can imitate essentially any ocular inflammatory presentation,
          and serologic exclusion is mandatory before immunosuppression.'
        distinguishing_features:
        - Positive treponemal serology using the CDC reverse screening algorithm
        - Acute syphilitic posterior placoid chorioretinitis morphology with leopard-spot hypofluorescence
        - Frequent HIV co-infection and neurosyphilis
        - Rapid resolution on penicillin
        disease_term:
          preferred_term: syphilis
          term:
            id: MONDO:0005976
            label: syphilis
        notes: No MONDO term for ocular syphilis exists at time of curation, so the parent term syphilis
          is bound rather than a stage-specific term - ocular involvement can occur at any stage, so binding
          to secondary syphilis would contradict this entry's own cited evidence.
      selected_evidence:
        snippet: ocular syphilis should always be a part of the differential diagnosis of most, if not
          all, ocular infectious and inflammatory presentations
        supports: SUPPORT
