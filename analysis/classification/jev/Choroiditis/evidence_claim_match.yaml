      assertion_type: DifferentialDiagnosis
      assertion:
        name: Ocular tuberculosis
        description: Tubercular choroiditis is curated as a subtype of this entry, but it is simultaneously
          the standing differential for every non-infectious granulomatous choroiditis, above all ocular
          sarcoidosis and idiopathic serpiginous choroiditis, because misclassification leads to harmful
          unopposed immunosuppression.
        distinguishing_features:
        - Positive interferon-gamma release assay or tuberculin skin test
        - Residence in or travel to a tuberculosis-endemic area
        - Choroidal tubercle or tuberculoma
        - Occlusive retinal vasculitis
        - Response to antitubercular therapy
        disease_term:
          preferred_term: ocular tuberculosis
          term:
            id: MONDO:0006876
            label: ocular tuberculosis
      selected_evidence:
        snippet: Tuberculosis is a classic differential diagnosis to be wary of, especially in people
          who have spent time in endemic areas.
        supports: SUPPORT
