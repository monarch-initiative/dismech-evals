        classification: etiologic_infectious
        description: Ocular involvement by Treponema pallidum, "the great masquerader". It can imitate
          almost any uveitic phenotype, and its one relatively distinctive form is acute syphilitic posterior
          placoid chorioretinitis (ASPPC), a large yellowish placoid outer-retinal lesion at the posterior
          pole. Serologic exclusion of syphilis is mandatory before immunosuppressing any choroiditis.
          No MONDO term for ocular/syphilitic chorioretinitis exists at time of curation, so this subtype
          carries no subtype_term.
      selected_evidence:
        snippet: In all patients, posterior segment examination in the involved eyes revealed a large,
