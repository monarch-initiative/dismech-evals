          term:
            id: MONDO:0006876
            label: ocular tuberculosis
        description: Choroidal inflammation attributable to Mycobacterium tuberculosis, presenting as
          choroidal tubercles/tuberculoma, multifocal choroiditis, or — most treacherously — a diffuse
          serpiginous-like choroiditis that phenocopies idiopathic serpiginous choroiditis. Because the
          idiopathic phenocopy is conventionally treated with immunosuppression, misclassification here
          is the canonical harm scenario of the infectious/non-infectious fork.
      selected_evidence:
        snippet: Key criteria for tubercular uveitis were a compatible uveitic syndrome, including (1)
          anterior uveitis with iris nodules, (2) serpiginous-like tubercular choroiditis, (3) choroidal
          nodule (tuberculoma)
