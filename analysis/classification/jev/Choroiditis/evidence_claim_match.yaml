        biological_scale: TISSUE
        role: amplifier
        description: The signature relapsing behaviour of ocular toxoplasmosis. Bradyzoites encysted in
          the retina at the edge of an old pigmented chorioretinal scar convert back to proliferating
          tachyzoites, producing a new satellite focus of necrotising retinochoroiditis at the scar border.
          Each reactivation enlarges the area of destroyed outer retina, so cumulative visual loss is
          driven by recurrence count and lesion location rather than by any single episode. Immunocompromise
          markedly worsens lesion size and visual outcome.
        cell_types:
        - preferred_term: photoreceptor cell
          term:
            id: CL:0000287
            label: eye photoreceptor cell
        locations:
        - preferred_term: choroid
          term:
            id: UBERON:0001776
            label: optic choroid
      selected_evidence:
        snippet: The cumulative incidence of recurrent OT at three years was 33.9%
        supports: SUPPORT
