  427f250bf73c846ab1be4cf1b519cf1e70ab9a0343165ef0a035fd794248a00d:
    claim:
      about:
        disease:
          name: Choroiditis
          disease_term:
            preferred_term: choroiditis
            term:
              id: MONDO:0001280
              label: choroiditis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unopposed Immunosuppression of Unrecognised Infectious Choroiditis
        biological_scale: ORGANISM
        role: amplifier
        description: The harm arm of the aetiologic fork, and the reason the fork must be modelled mechanistically
          rather than as a list. When infectious choroiditis is misclassified as an idiopathic non-infectious
          entity, it receives the correct treatment for the wrong diagnosis — corticosteroid and/or steroid-sparing
          immunosuppression without antimicrobial cover. The expected consequence is loss of host immune
          restraint on a replicating organism; note that the documented evidence here is for the misclassification
          hazard and for the superiority of adding antimicrobial therapy, rather than a trial measuring
          harm from unopposed immunosuppression directly. Tubercular serpiginous-like choroiditis is the
          canonical case, because its idiopathic phenocopy is conventionally immunosuppressed; syphilis
          is the second, because it can imitate essentially any uveitic phenotype. This is why serologic
          and mycobacterial exclusion precede immunosuppression in all choroiditis.
        locations:
        - preferred_term: choroid
          term:
            id: UBERON:0001776
            label: optic choroid
      selected_evidence:
        snippet: Choroidal tuberculosis (TB) infection may present itself as a diffuse choroiditis that
          resembles serpiginous choroiditis, usually treated with immunossupressants.
        supports: SUPPORT
