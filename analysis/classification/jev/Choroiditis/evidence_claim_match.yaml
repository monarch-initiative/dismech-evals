      assertion_type: Pathophysiology
      assertion:
        name: Choriocapillaris Hypoperfusion and Non-Perfusion
        biological_scale: TISSUE
        role: central_effector
        description: 'The shared final common pathway of several white-dot entities. Inflammation of the
          choriocapillaris and its precapillary supply produces hypo- or non-perfusion of choroidal lobules,
          which is the defining clinicopathological mechanism of the primary inflammatory choriocapillaropathies.
          The calibre of vessel affected grades disease severity: involvement of only terminal choriocapillaries
          gives the benign end of the spectrum (MEWDS), whereas involvement of larger choriocapillaris
          or precapillary vessels gives the severe forms - APMPPE, idiopathic multifocal choroiditis and
          serpiginous choroiditis. Because the choriocapillaris is the sole blood supply of the outer
          retina and RPE, its non-perfusion is directly ischaemic to the photoreceptor/RPE complex, and
          it is imaged as patchy lobular hypofluorescence on indocyanine green angiography.'
        cell_types:
        - preferred_term: endothelial cell
