        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Granulomatous Choroidal Inflammation
        biological_scale: TISSUE
        role: effector
        description: In sarcoidosis, tuberculosis and sympathetic ophthalmia the choroidal infiltrate
          organises into granulomas. Sarcoid granulomas are non-caseating epithelioid granulomas; tubercular
          disease produces choroidal tubercles and tuberculoma; sympathetic ophthalmia produces Dalen-Fuchs
          nodules, focal aggregates of epithelioid cells between Bruch's membrane and the RPE. That both
          an infectious (TB) and a sterile (sarcoid) trigger yield broadly overlapping granulomatous choroiditis
          is a second, tissue-level restatement of why the aetiologic fork is not reliably settled on
          morphology alone - tuberculosis is the standing differential for ocular sarcoidosis, and caseation,
          while suggestive of tuberculosis, is often unavailable because ocular biopsy is rarely performed.
        cell_types:
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: granuloma formation
          modifier: INCREASED
          term:
            id: GO:0002432
            label: granuloma formation
        locations:
        - preferred_term: choroid
          term:
            id: UBERON:0001776
            label: optic choroid
        - preferred_term: Bruch's membrane
          term:
            id: UBERON:0003957
            label: Bruch's membrane
      selected_evidence:
        snippet: The diagnosis is based on histology with the presence of non-caseating epithelioid granulomas.
        supports: SUPPORT
