      assertion_type: Diagnosis
      assertion:
        name: Treponemal and Non-Treponemal Serology for Syphilis
        description: Mandatory exclusion test in any choroiditis before immunosuppression, given that
          ocular syphilis mimics nearly every uveitic phenotype. SUN criteria for syphilitic uveitis require
          a positive treponemal test alongside a compatible uveitic presentation, using the CDC reverse
          screening algorithm. Every patient with ocular syphilis also needs CSF testing for neurosyphilis
          and HIV serology.
        notes: 'Left without a diagnosis_term deliberately: NCIT has no term for the combined treponemal-plus-non-treponemal
          syphilis serology algorithm this entry describes. NCIT:C132388 Treponema pallidum Antibody Measurement
          covers only the treponemal half and would misrepresent the recommended two-test CDC reverse
          screening sequence.'
      selected_evidence:
        snippet: Key criteria for syphilitic uveitis included a compatible uveitic presentation (anterior
          uveitis; intermediate uveitis; or posterior or panuveitis with retinal, retinal pigment epithelial,
          or retinal vascular inflammation) and evidence of syphilis infection with a positive treponemal
          test.
        supports: SUPPORT
