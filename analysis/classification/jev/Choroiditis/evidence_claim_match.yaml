            term:
              id: MONDO:0001280
              label: choroiditis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aetiologic Fork - Infectious versus Non-Infectious Choroidal Inflammation
        biological_scale: ORGANISM
        role: trigger
        description: 'The root branch point of the entry. Choroidal inflammation may be driven by a replicating
          pathogen within ocular tissue or by an antigen-driven autoimmune/autoinflammatory process against
          ocular self-antigen. Both arms produce clinically overlapping choroiditis, and both converge
          on the same downstream tissue-injury cascade, but they diverge completely at the level of management:
          the infectious arm requires antimicrobial eradication and is made worse by unopposed immunosuppression,
          whereas the non-infectious arm requires exactly that immunosuppression. Distinguishing the arms
          is therefore the single most consequential diagnostic act in choroiditis.'
        locations:
        - preferred_term: choroid
          term:
            id: UBERON:0001776
            label: optic choroid
      selected_evidence:
        snippet: Out of 6191 cases with uveitis, 1925 were infectious, 4125 were non-infectious
        supports: SUPPORT
