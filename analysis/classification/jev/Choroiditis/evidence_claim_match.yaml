            term:
              id: MONDO:0001280
              label: choroiditis
        context: []
      assertion_type: Treatment
      assertion:
        name: Corticosteroid Therapy
        description: First-line anti-inflammatory therapy for non-infectious choroiditis, given locally
          or systemically. It is the mainstay of the non-infectious arm and remains first-line in ocular
          sarcoidosis. In the infectious arm it is permissible only in combination with antimicrobial
          therapy; given alone to an unrecognised infectious choroiditis it removes immune restraint on
          the organism. Up to 30% of sarcoidosis patients require high doses, which is what drives the
          move to steroid-sparing agents.
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: corticosteroid
            term:
              id: CHEBI:50858
              label: corticosteroid
        notes: Safety caveat central to this entry - corticosteroid monotherapy is contraindicated until
          infectious causes (toxoplasmosis, tuberculosis, syphilis) have been excluded or are being concurrently
          treated.
      selected_evidence:
        snippet: Choroidal tuberculosis (TB) infection may present itself as a diffuse choroiditis that
          resembles serpiginous choroiditis, usually treated with immunossupressants.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/1
      context_paths:
