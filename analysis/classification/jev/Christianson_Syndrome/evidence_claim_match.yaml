    claim:
      about:
        disease:
          name: Christianson Syndrome
          disease_term:
            preferred_term: Christianson syndrome
            term:
              id: MONDO:0010278
              label: Christianson syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC9A6
        gene_term:
          preferred_term: SLC9A6
          term:
            id: hgnc:11079
            label: SLC9A6
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: Loss of Function, X-linked
        notes: 'Loss of function is the usual mechanism, but not the only one. A de novo missense variant
          in the ion translocation domain, p.Gly218Arg, behaves as a potential gain of function: it alkalinises
          rather than acidifies the endosome and still causes the core phenotype, while sparing the motor
          deterioration usually seen after the first decade. The gene is therefore better described as
          setting endosomal pH than as acidifying or alkalinising it.'
      selected_evidence:
        snippet: The patient manifested several core symptoms typical of CS, including pronounced cognitive
          impairment, mutism, epilepsy, ataxia and microcephaly; however, deterioration of motor function
          often observed after the first decade of life in CS children with total loss of SLC9A6/NHE6
          function was not evident.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30296617
      reference_title: A potential gain-of-function variant of SLC9A6 leads to endosomal alkalinization
        and neuronal atrophy associated with Christianson Syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Documents the gain-of-function allele producing the core phenotype without the later
        motor deterioration, which is the basis for the allelic nuance in these notes.
