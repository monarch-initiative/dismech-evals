      assertion_type: AnimalModel
      assertion:
        name: Nhe6-null mouse
        species: Mouse
        genotype: Slc9a6 knockout
        publication: PMID:29349289
        description: The principal model, and unusual in reproducing both halves of the human disease.
          Brain volume changes reflect undergrowth and tissue loss together, with Purkinje cell loss confirmed
          in two independent knockout lines.
        modeled_mechanisms:
        - target: Progressive Neurodegeneration with Purkinje Cell Loss
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces progressive Purkinje cell loss beginning in the cerebellum, with wider
            cortical, hippocampal and striatal volume loss appearing later.
          limitations: Mice do not accumulate insoluble endogenous tau or amyloid-beta, so this model
            cannot address the tau deposition reported in human post-mortem material. That is what the
            rat model below was made for.
        - target: Impaired Endosomal Maturation and Lysosomal Function
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the selective neuronal glycolipid and cholesterol storage with loss
            of beta-hexosaminidase activity, closely resembling a lysosomal storage disorder.
          limitations: The storage is regionally selective rather than global, so the model does not explain
            why particular neuronal populations are vulnerable.
      selected_evidence:
        snippet: We report PC loss in two distinct Nhe6-null mouse models.
        supports: SUPPORT
