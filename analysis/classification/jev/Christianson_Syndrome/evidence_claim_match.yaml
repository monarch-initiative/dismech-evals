  562f71737d87e063d783d681a95f1a547bb2608a29989fb88a768c94bda7f3fe:
    claim:
      about:
        disease:
          name: Christianson Syndrome
          disease_term:
            preferred_term: Christianson syndrome
            term:
              id: MONDO:0010278
              label: Christianson syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endosomal Over-Acidification
        biological_scale: MOLECULAR
        description: 'Endosomal pH falls below its set point. The direction matters and is easy to get
          backwards: NHE6 removes protons from the lumen, so losing it acidifies rather than alkalinises.
          A rare gain-of-function variant produces the opposite derangement, and causes disease too, which
          indicates the compartment is tuned rather than simply requiring acidity.'
        biological_processes:
        - preferred_term: regulation of intracellular pH
          modifier: ABNORMAL
          term:
            id: GO:0051453
            label: regulation of intracellular pH
        molecular_functions:
        - preferred_term: sodium:proton antiporter activity
          modifier: DECREASED
          term:
            id: GO:0015385
            label: sodium:proton antiporter activity
      selected_evidence:
        snippet: Compared to wild-type, G218R-containing endosomes were atypically alkaline and showed
          impaired uptake of recycling endosomal cargo.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30296617
      reference_title: A potential gain-of-function variant of SLC9A6 leads to endosomal alkalinization
        and neuronal atrophy associated with Christianson Syndrome.
      evidence_source: IN_VITRO
      explanation: The mirror-image experiment. A gain-of-function allele alkalinises the endosome and
        still impairs cargo uptake, which is why this node is framed as loss of pH control rather than
        as acidification alone.
