      assertion:
        name: Reduced BDNF-TrkB Endosomal Signalling
        biological_scale: CELLULAR
        description: TrkB and Akt phosphorylation fall. This is the arm that plausibly links a housekeeping
          trafficking defect to a specifically neuronal phenotype, since BDNF-TrkB signalling drives arborisation
          and synapse formation. It was demonstrated in the cochlea rather than in the forebrain, so its
          extension to the cognitive phenotype was, until recently, inference. A TrkB agonist rescue in
          hippocampal neurons has since supplied the forebrain evidence that was missing.
        biological_processes:
        - preferred_term: neurotrophin TRK receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0048011
            label: neurotrophin TRK receptor signaling pathway
        mechanism_confidence: PROVISIONAL
      selected_evidence:
        snippet: Nhe6 KO mice showed significant reductions in TrkB and Akt phosphorylation in the OC.
