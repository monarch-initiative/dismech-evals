          value:
            name: Progressive Neurodegeneration with Purkinje Cell Loss
            biological_scale: TISSUE
            description: The degenerative arm, and what makes this disorder unusual. Purkinje cells are
              lost early and rapidly, with a more protracted cerebral course behind it. In the rat this
              proceeds to amyloid-beta and tau aggregation, matching the tau deposition reported in human
              post-mortem material. Cerebellar atrophy is documented in 30 to 60% of patients.
            cell_types:
            - preferred_term: Purkinje cell
              term:
                id: CL:0000121
                label: Purkinje cell
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Upper Motor Neuron Dysfunction
        causal_link_type: DIRECT
        description: The degenerative process is not confined to the cerebellum. Corticospinal tract signs
          appear in the majority over age ten, which is what makes the motor picture mixed rather than
          purely cerebellar.
      selected_evidence:
        snippet: Importantly, also older patients (ie, age 20 and greater) present with evidence of motor
          dysfunction with signs of corticospinal tract, i.e., upper motor neuron damage such as increased
          tone, weakness, increased and abnormal reflexes.
        supports: SUPPORT
