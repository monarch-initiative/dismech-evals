      assertion:
        name: Heterozygous female Slc9a6 knockout mouse
        species: Mouse
        genotype: Slc9a6 KO heterozygous female, lacZ reporter
        publication: PMID:26515654
        description: Addresses the female carrier question directly by using a lacZ reporter knocked into
          the mutant allele, so X-inactivation can be visualised alongside the pathology it produces.
        modeled_mechanisms:
        - target: Impaired Endosomal Maturation and Lysosomal Function
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reproduces the storage and Purkinje cell pathology in mosaic distribution, matching
            the partial and variable phenotype of human female carriers.
          limitations: Mouse X-inactivation patterns need not match human ones, so the model supports
            the mechanism of variability rather than predicting any individual carrier's severity.
      selected_evidence:
        snippet: In heterozygous female Slc9a6 KO mice, β-Gal serves as a transcriptional/XCI reporter
          and thus facilitates testing of effects of mosaic expression of the mutant allele on penetrance
          of the abnormal phenotype.
        supports: SUPPORT
