      assertion_type: Pathophysiology
      assertion:
        name: Distal Nephron Intercalated Cell Origin
        biological_scale: CELLULAR
        description: 'chRCC arises from the intercalated cells of the distal nephron and collecting duct.
          This is the single fact from which most of the rest of chRCC biology follows: the intercalated
          cell is mitochondria-rich, which anticipates the tumor''s oxidative metabolic phenotype, and
          it is also the presumed cell of origin of renal oncocytoma, which is why the two tumors overlap
          so heavily on morphology and immunophenotype. Clear cell and papillary RCC instead arise from
          the proximal tubule.'
        cell_types:
        - preferred_term: kidney collecting duct intercalated cell
          term:
            id: CL:1001432
            label: kidney collecting duct intercalated cell
        locations:
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
      selected_evidence:
        snippet: The result is consistent that ChRCC originates from the distal nephron compared with
          other kidney cancers with more proximal origins.
        supports: SUPPORT
    origin:
