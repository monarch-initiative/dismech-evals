      assertion_type: AnimalModel
      assertion:
        name: Kidney-specific Flcn knockout mouse
        species: Mouse
        genotype: Conditional Flcn knockout targeted to the renal proximal tubule
        genes:
        - preferred_term: FLCN
          term:
            id: hgnc:27310
            label: FLCN
        publication: PMID:26083655
        description: Kidney-specific disruption of mouse Flcn produces renal cysts followed by early-onset,
          highly penetrant renal neoplasia in which chromophobe RCC is the predominant histology in mice
          under one year of age. mTOR and TGF-beta signaling are upregulated in the resulting tumors,
          and ten months of rapamycin treatment suppresses tumor growth - the preclinical basis for mTOR
          inhibition in FLCN-driven renal tumors.
        modeled_mechanisms:
        - target: mTORC1 Pathway Hyperactivation
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Flcn loss activates mTOR signaling in the mouse kidney, reproducing the pathway
            state that PTEN, MTOR, TSC1, TSC2 and FLCN lesions converge on in human chRCC.
          limitations: The model routes to mTORC1 activation exclusively through FLCN loss, so it represents
            the hereditary Birt-Hogg-Dube arm rather than the somatic PTEN and MTOR-pathway mutations
            that drive sporadic disease.
          readouts:
          - name: Renal tumor growth under rapamycin treatment
            target: mTORC1 Pathway Hyperactivation
            direction: DECREASED
            interpretation: Pharmacologic mTOR inhibition suppresses tumor growth, confirming the tumors
              depend on the mTOR signaling state modeled by this node.
        - target: Indolent Chromophobe Tumor Growth
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: The model generates chromophobe RCC as the predominant histology in younger mice,
            so it reproduces the tumor type, but not the genomic route by which humans reach it.
          limitations: Two mismatches matter. The knockout is targeted to the proximal tubule, whereas
            human chRCC arises from distal nephron intercalated cells. And the model reproduces none of
            the defining sporadic genomics - the whole-chromosome loss signature, TP53 mutation, or TERT
            promoter rearrangement. Histology in older knockout mice shifts to papillary RCC, so the chromophobe
            phenotype is also age-dependent.
          readouts:
          - name: Predominant renal tumor histology in mice under one year
            target: Indolent Chromophobe Tumor Growth
            direction: INCREASED
            interpretation: Chromophobe RCC is the dominant tumor histology in the model at younger ages,
              supporting partial recapitulation of the human tumor type.
      selected_evidence:
        snippet: Thus, our model recapitulates human Birt-Hogg-Dubé kidney tumorigenesis, provides a valuable
          tool for further study of Flcn-deficient renal tumorigenesis, and tests new drugs/approaches
          to their treatment.
        supports: SUPPORT
