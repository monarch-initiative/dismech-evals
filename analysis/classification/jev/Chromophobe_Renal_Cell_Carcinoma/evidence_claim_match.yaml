        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chrcc_mtdna_driver_or_passenger
        prompt: Are the somatic mitochondrial DNA mutations found in most chromophobe renal cell carcinomas
          drivers of the tumor's oxidative phenotype, or passengers of its mitochondria-rich cell of origin?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Mitochondrial Accumulation and Oxidative Metabolic Phenotype
        rationale: Somatic mtDNA mutations, including frameshifting changes in complex I subunit genes,
          are present in the majority of chRCCs, and the tumor shows the highest mitochondrial gene expression
          among RCC subtypes. But the intercalated cell of origin is itself mitochondria-rich, so an oxidative
          phenotype is the expected inheritance rather than necessarily an acquired one. The original
          sequencing study explicitly declined to assign a causal role. Resolving this matters therapeutically,
          because targeting mitochondrial metabolism has been proposed as a chRCC-specific vulnerability
          and that proposal presumes a driver role.
      selected_evidence:
        snippet: Although somatic mtDNA mutations are found in chromophobe RCCs, their role in the maintenance
          of tumor cell phenotype or in tumorigenesis remains to be elucidated.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
