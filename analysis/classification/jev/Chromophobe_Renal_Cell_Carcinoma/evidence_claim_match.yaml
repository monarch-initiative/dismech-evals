      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Accumulation and Oxidative Metabolic Phenotype
        biological_scale: CELLULAR
        description: chRCC cells accumulate mitochondria and show near-universal upregulation of Krebs
          cycle and electron transport chain genes relative to normal kidney, together with the highest
          expression of mitochondrially encoded genes among RCC subtypes. Somatic mitochondrial DNA mutations,
          including frameshifting changes in complex I subunit genes, are found in the majority of tumors.
          This is a genuinely distinct metabolic state, not a variant of the glycolytic Warburg shift
          that characterizes VHL-mutant clear cell RCC, and it is why this entry does not conform to the
          aerobic-glycolysis node of the deregulated_cellular_energetics module. Whether the mtDNA mutations
          are drivers or passengers of this phenotype remains unresolved.
        biological_processes:
        - preferred_term: oxidative phosphorylation
          modifier: INCREASED
          term:
            id: GO:0006119
            label: oxidative phosphorylation
      selected_evidence:
        snippet: Combined mtDNA and gene expression analysis implicates changes in mitochondrial function
          as a component of the disease biology, while suggesting alternative roles for mtDNA mutations
          in cancers relying on oxidative phosphorylation.
        supports: SUPPORT
    origin:
