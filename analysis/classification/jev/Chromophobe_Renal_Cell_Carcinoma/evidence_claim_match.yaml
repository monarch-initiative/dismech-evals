        description: The principal benign mimic and the reason chRCC diagnosis matters. Both tumors are
          thought to arise from intercalated cells, both may show a central scar with spoke-wheel enhancement
          on CT, and the eosinophilic variant of chRCC closely resembles oncocytoma on morphology alone.
        distinguishing_features:
        - chRCC shows the characteristic combined loss of chromosomes 1, 2, 6, 10, 13, 17 and 21, which
          renal oncocytoma lacks; copy-number testing is diagnostic in morphologically ambiguous cases.
        - CK7 is diffuse and uniform in classic chRCC but only focal or negative in oncocytoma. This discriminator
          weakens for the eosinophilic variant of chRCC, where CK7 expression is rare or patchy.
      selected_evidence:
        snippet: we have identified loss of chromosome 2, 10, 13, 17 and 21 as discriminating alteration
          between chromophobe RCCs and ROs. Therefore, detection of these chromosomal changes can be used
          for the accurate diagnosis in routine histology.
