  f116eae73dc75ebbf7a3221f5165bee071d568d5d76a84aeb44c244ad0ac96ec:
    claim:
      about:
        disease:
          name: Chromophobe Renal Cell Carcinoma
          disease_term:
            preferred_term: chromophobe renal cell carcinoma
            term:
              id: MONDO:0017885
              label: chromophobe renal cell carcinoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Recurrent Whole-Chromosome Loss
        biological_scale: CELLULAR
        description: 'The genomic hallmark of chRCC is the combined loss of entire chromosomes 1, 2, 6,
          10, 13, 17 and 21, present in 70-93% of tumors and specific enough to be used diagnostically
          against renal oncocytoma. What makes this pattern mechanistically unusual is its company: chRCC
          carries roughly seven chromosome losses alongside only about thirty exonic somatic mutations,
          so the dominant oncogenic signal is copy-number rather than point mutation. Roughly 40% of tumors
          have no identified driver mutation in any known oncogene or tumor suppressor, which implicates
          the aneuploidy itself as a primary transforming event. The upstream cause of the loss pattern
          is not established.'
        biological_processes:
        - preferred_term: chromosome segregation
          modifier: DECREASED
          term:
            id: GO:0007059
            label: chromosome segregation
      selected_evidence:
        snippet: We conclude that a specific combination of multiple chromosomal losses characterizes
          chromophobe renal cell carcinomas and may help to differentiate them unequivocally from other
          types of kidney cancer.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7519827
      reference_title: Specific loss of chromosomes 1, 2, 6, 10, 13, 17, and 21 in chromophobe renal cell
        carcinomas revealed by comparative genomic hybridization.
      evidence_source: HUMAN_CLINICAL
      explanation: The original comparative genomic hybridization study establishing the specific multi-chromosome
