        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chrcc_hypodiploidy_versus_gains
        prompt: Is the hypodiploid model of chromophobe renal cell carcinoma still accurate, given that
          later studies have documented frequent chromosomal gains alongside the classic loss pattern?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Recurrent Whole-Chromosome Loss
        - pathophysiology#Sarcomatoid Dedifferentiation
        rationale: The long-standing description of chRCC as a hypodiploid tumor comes from comparative
          genomic hybridization studies of the 1990s. Higher-resolution methods have since shown a more
          complex and heterogeneous picture in which chromosomal gains are also frequent, and gains are
          specifically associated with sarcomatoid tumors and with metastatic progression through imbalanced
          chromosome duplication. Whether hypodiploidy remains the right summary of chRCC genomics, or
          is better treated as the baseline state on which later gains are superimposed during progression,
          is unsettled and matters for how the diagnostic copy-number test is interpreted in aggressive
          tumors.
      selected_evidence:
        snippet: It was thought for many years that ChRCC exhibits a hypodiploid genome. Recent studies
          using advanced molecular genetics techniques have shown more complex and heterogenous pattern
          with frequent chromosomal gains.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
