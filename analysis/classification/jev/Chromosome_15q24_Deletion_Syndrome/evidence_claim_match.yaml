  5f5774c3d8eacdc21f8b00cf61f48768f0345d3209bc3d61026a7ef19154c5ba:
    claim:
      about:
        disease:
          name: Chromosome 15q24 Deletion Syndrome
          disease_term:
            preferred_term: chromosome 15q24 deletion syndrome
            term:
              id: MONDO:0013256
              label: chromosome 15q24 deletion syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: Recurrent 15q24 contiguous-gene deletion
        association: Causative (heterozygous contiguous-gene deletion)
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: Breakpoints lie within segmental-duplication (low-copy-repeat) clusters LCR15q24A-E, so
          most deletions arise by NAHR; deletion sizes and exact breakpoints vary between patients. The
          smallest region of overlap (~1.1-1.2 Mb between LCR15q24B and LCR15q24C) carries the core cognitive
          phenotype. There is no single causal gene; candidate dosage-sensitive genes in the interval
          include SIN3A, CSK, STRA6, ARID3B, SEMA7A, CPLX3 and CYP11A1.
      selected_evidence:
        snippet: High-resolution analysis showed that in three patients both proximal and distal breakpoints
          co-localized to highly identical segmental duplications (>51 kb in length, > 94% identity),
          suggesting non-allelic homologous recombination as the likely mechanism of origin.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17360722
      reference_title: Characterization of a recurrent 15q24 microdeletion syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes NAHR between segmental duplications as the mechanism generating the recurrent
        deletion.
