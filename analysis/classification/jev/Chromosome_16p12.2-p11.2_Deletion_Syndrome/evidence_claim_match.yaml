            term:
              id: MONDO:0013320
              label: chromosome 16p12.2-p11.2 deletion syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Constitutional Heterozygous Loss of the 16p12.2-p11.2 Interval
        biological_scale: MOLECULAR
        genetic_context:
          variant_type: deletion
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
          affected_regions:
          - name: 16p12.2-p11.2 deletion interval
            chromosomal_region: 16p12.2-p11.2
            description: Reported 7.1-8.7 Mb deletions share a distal breakpoint at 16p12.2 and vary in
              their proximal breakpoint at 16p11.2. This cytoband range describes the syndrome interval
              without assigning a single pair of nucleotide coordinates or a fixed deleted gene set to
              every patient.
        description: A heterozygous 7.1-8.7 Mb deletion present in all cells. Reported cases share a common
          distal breakpoint at 16p12.2 and vary in the proximal breakpoint at 16p11.2, so the deleted
          gene set is not identical between patients - which is one reason gene-to-feature attribution
          has been hard to pin down. Deletions have been recurrent and de novo in the originally reported
          individuals.
      selected_evidence:
        snippet: All reported patients so far share a common distal breakpoint at 16p12.2 but vary in
          the proximal breakpoint at 16p11.2.
        supports: SUPPORT
