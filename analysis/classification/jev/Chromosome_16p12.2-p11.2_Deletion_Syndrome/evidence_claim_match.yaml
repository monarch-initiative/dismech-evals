            term:
              id: MONDO:0013320
              label: chromosome 16p12.2-p11.2 deletion syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-Allelic Homologous Recombination Between 16p Segmental Duplications
        biological_scale: MOLECULAR
        description: The short arm of chromosome 16 is rich in segmental duplications. Complex low-copy
          repeats flank the 16p12.2-p11.2 interval, and misalignment between them during meiosis supports
          non-allelic homologous recombination, which excises the intervening segment. This is why the
          deletion recurs with reproducible breakpoints in unrelated individuals rather than occurring
          at random positions.
      selected_evidence:
        snippet: The identification of common clinical features in these four individuals along with the
          characterization of complex segmental duplications flanking the deletion regions suggests that
          nonallelic homologous recombination mediated these rearrangements and that deletions in 16p11.2-p12.2
          constitute a previously undescribed syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17704777
      reference_title: Discovery of a previously unrecognized microdeletion syndrome of 16p11.2-p12.2.
      evidence_source: HUMAN_CLINICAL
      explanation: States the NAHR mechanism inferred from the flanking segmental duplications, and its
        role in producing a recurrent syndrome.
