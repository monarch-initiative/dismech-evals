      assertion:
        name: Haploinsufficiency Across a Gene-Dense Interval
        biological_scale: CELLULAR
        description: Loss of one copy of dozens of genes simultaneously. That the phenotype follows from
          dosage across the interval is not in doubt; which genes carry which feature is. No gene in this
          interval has been shown to account for a feature of this syndrome on its own, and the gene-level
          candidates commonly cited for 16p come from studies of the smaller nested 16p11.2 CNVs rather
          than from this deletion. The node is therefore deliberately stated at the level the evidence
          supports.
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
