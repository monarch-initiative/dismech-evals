          term:
            id: GO:0007399
            label: nervous system development
          modifier: DECREASED
      selected_evidence:
        snippet: Minor facial anomalies, feeding difficulties, significant delay in speech development,
          and recurrent ear infections are common symptoms of the microdeletion syndrome 16p11.2-p12.2.
        supports: SUPPORT
