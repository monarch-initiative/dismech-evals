      assertion_type: Definition
      assertion:
        name: HNF1B score for selecting patients for genetic testing
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'A 17-item weighted clinical, imaging and biochemical score developed to decide who
          should be sent for HNF1B genetic testing, covering antenatal discovery, family history and kidney,
          pancreas, liver and genital tract involvement. It is a rule-out instrument rather than a diagnostic
          one: at the optimal cutoff of 8 its negative predictive value exceeds 99 per cent with sensitivity
          98.2 per cent, but specificity is only 41.1 per cent, so a score above threshold does not make
          the diagnosis. Note the scope caveat for this entry: the score is validated for HNF1B disease
          as a whole, not for the 17q12 deletion specifically, and a positive score is followed by sequencing,
          which cannot see the deletion.

          '
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: Assessed by ROC analysis in a 433-individual cohort containing 56 HNF1B cases, against
            genetic testing as the gold standard, giving an AUC of 0.78.
      selected_evidence:
        snippet: The optimal cutoff threshold for the negative predictive value to rule out HNF1B mutations
          in a suspected individual was 8 (sensitivity 98.2%, specificity 41.1%, and negative predictive
          value over 99%).
        supports: SUPPORT
    origin:
      assertion_path: /definitions/1
      evidence_path: /definitions/1/evidence/0
