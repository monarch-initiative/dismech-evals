        association: CAUSATIVE
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'HNF1B lies inside the deleted interval, and its haploinsufficiency accounts for the
          renal and pancreatic phenotype. It is the gene whose point mutations cause renal cysts and diabetes
          syndrome, which is why the deletion reproduces that phenotype. It does not account for the neurodevelopmental
          phenotype.

          '
      selected_evidence:
        snippet: We detected a recurrent 1.4 Mb deletion at 17q12, which harbors HNF1B, the gene responsible
          for renal cysts and diabetes syndrome (RCAD), in 18/15,749 patients, including several with
          ASD, but 0/4,519 controls.
        supports: SUPPORT
