  3af8ce27278ee31931b11910405af57480fab7e618fb7e20383025fdd68bb7bb:
    claim:
      about:
        disease:
          name: Chromosome 17q12 Deletion Syndrome
          disease_term:
            preferred_term: chromosome 17q12 deletion syndrome
            term:
              id: MONDO:0013797
              label: chromosome 17q12 deletion syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: deletion_milder_renal_than_point_mutation
        kind: KNOWLEDGE_GAP
        prompt: Why do 17q12 deletion carriers have less advanced kidney disease than HNF1B point-mutation
          carriers, when the deletion removes the whole gene?
        attaches_to:
        - phenotypes#Chronic kidney disease
        - pathophysiology#HNF1B Haploinsufficiency
        rationale: 'A 201-patient cohort found CKD stage 3-4 and end-stage renal disease significantly
          less frequent in deletion carriers than in point-mutation carriers, both at diagnosis and in
          the long term. A pure haploinsufficiency model predicts the two should be equivalent, and a
          dominant-negative effect of some missense alleles would explain the direction but has not been
          shown for the alleles in that cohort. Ascertainment is the competing explanation: deletion carriers
          are often found through neurodevelopmental or antenatal routes and point-mutation carriers through
          nephrology, which would bias renal severity the way observed. The study does not separate these,
          and no subsequent work has. A later prenatal-and-postnatal comparison across 82 studies asked
          the differentiation question directly in its title and concluded only that both mutation groups
          show high phenotypic heterogeneity, so the difference remains unexplained rather than refuted.

          '
      selected_evidence:
        snippet: Overall, both mutation groups showed a high phenotypic heterogeneity.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31498910
      reference_title: 'Prenatal diagnosis of HNF1B-associated renal cysts: Is there a need to differentiate
        intragenic variants from 17q12 microdeletion syndrome?'
      evidence_source: HUMAN_CLINICAL
      explanation: A study set up to compare 17q12 microdeletions against intragenic HNF1B variants found
        heterogeneity in both rather than a clean genotype-phenotype split, which is why this gap is recorded
        as open.
