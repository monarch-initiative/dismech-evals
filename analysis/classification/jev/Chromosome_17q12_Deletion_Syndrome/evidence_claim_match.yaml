              dose reduction to specific organ phenotypes, by identifying the patterning genes the orthologue
              controls in each organ primordium. Note that it is a loss-of-function fish mutant, whereas
              this disorder is human heterozygous whole-gene deletion in a contiguous interval, so it
              models the HNF1B limb and nothing else.

              '
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Neurodevelopment
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: 'The model has a hindbrain patterning phenotype through valentino, but nothing corresponding
          to the human neurodevelopmental and psychiatric phenotype, and it cannot have one: the deletion''s
          brain phenotype is attributed to non-HNF1B interval genes, and this model perturbs only the
          HNF1B orthologue.'
        limitations: Behavioural and cognitive phenotypes are not assessable in this model, and autism
          and schizophrenia have no zebrafish counterpart. The failure is structural rather than empirical,
          which is why fidelity is LOW rather than the link being omitted.
      selected_evidence:
        snippet: The similarity between vhnf1-associated fish phenotypes and human symptoms suggests a
          correlation between developmental functions of vhnf1 and the molecular etiology of MODY5 and
          GCKD.
        supports: NO_EVIDENCE
