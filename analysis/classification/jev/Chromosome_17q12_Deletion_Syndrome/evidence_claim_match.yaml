      assertion_type: AnimalModel
      assertion:
        name: vhnf1 zebrafish insertional mutant
        species: Zebrafish
        genotype: vhnf1 (hnf1b) loss-of-function insertional alleles
        publication: PMID:11731484
        description: 'Insertional mutant alleles of the zebrafish HNF1B orthologue, isolated in a mutagenesis
          screen. It is the model that supplies the mechanistic route from a transcription-factor dose
          reduction to specific organ phenotypes, by identifying the patterning genes the orthologue controls
          in each organ primordium. Note that it is a loss-of-function fish mutant, whereas this disorder
          is human heterozygous whole-gene deletion in a contiguous interval, so it models the HNF1B limb
          and nothing else.

          '
        modeled_mechanisms:
        - target: Disrupted Nephron and Collecting System Development
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Kidney cyst formation arising from patterning defects, with loss of proper pax2
            and wt1 expression in the pronephric primordium.
          limitations: A zebrafish pronephros is not a mammalian metanephros, and the alleles are loss-of-function
            rather than heterozygous deletion. It establishes the developmental mechanism, not the human
            dose-response.
        - target: Impaired Pancreatic Beta Cell Development and Insulin Secretion
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Pancreatic underdevelopment, with loss of proper pdx1 and shh expression in the
            gut endoderm. pdx1 is the master pancreatic specification factor, which supplies the route
            from HNF1B dose to reduced beta cell mass.
          limitations: Same species and allele-type caveats. The model reports organ hypoplasia rather
            than insulin secretion, so the diabetes phenotype itself is inferred.
        - target: Impaired Neurodevelopment
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: 'The model has a hindbrain patterning phenotype through valentino, but nothing
            corresponding to the human neurodevelopmental and psychiatric phenotype, and it cannot have
            one: the deletion''s brain phenotype is attributed to non-HNF1B interval genes, and this model
            perturbs only the HNF1B orthologue.'
          limitations: Behavioural and cognitive phenotypes are not assessable in this model, and autism
            and schizophrenia have no zebrafish counterpart. The failure is structural rather than empirical,
            which is why fidelity is LOW rather than the link being omitted.
      selected_evidence:
        snippet: Mutations in the homeobox gene vHnf1 are associated with human diseases MODY5 (maturity-onset
          diabetes of the young, type V) and familial GCKD (glomerulocystic kidney disease).
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
