      assertion_type: Pathophysiology
      assertion:
        name: Recurrent 1.4 Mb Heterozygous Deletion at 17q12
        biological_scale: MOLECULAR
        description: 'A recurrent heterozygous deletion of approximately 1.4 Mb removes about fifteen
          genes at chromosome 17q12. Its recurrence and fixed breakpoints are what make it detectable
          by chromosomal microarray and, equally, what make it invisible to the sequencing panels used
          to work up maturity-onset diabetes of the young. This node is the initiating lesion and branches
          into two mechanistically separate arms.

          '
      selected_evidence:
        snippet: The diagnosis is established in a proband by detection of the 1.4-Mb heterozygous recurrent
          deletion at chromosome 17q12 by chromosomal microarray testing or other genomic methods.
        supports: SUPPORT
