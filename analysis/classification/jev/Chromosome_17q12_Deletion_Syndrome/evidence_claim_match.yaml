              label: chromosome 17q12 deletion syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: contiguous_gene_model
        hypothesis_label: Contiguous gene syndrome extending beyond HNF1B
        status: CANONICAL
        description: 'The renal and pancreatic phenotype is HNF1B haploinsufficiency; the neurodevelopmental
          and neuropsychiatric phenotype comes from loss of one or more of the other fourteen genes in
          the interval. The evidence for the split is a contrast rather than a positive identification:
          the deletion carries an ASD and schizophrenia risk that HNF1B point mutations do not, at case-control
          effect sizes large enough to survive correction in tens of thousands of controls. A second dataset
          reproduced the direction of the schizophrenia signal without reaching significance, so the replication
          is partial.

          '
      selected_evidence:
        snippet: In addition, the phenotypic features of patients with this CNV are consistent with a
          contiguous gene syndrome that extends beyond RCAD, which is caused by HNF1B mutations only.
        supports: SUPPORT
    origin:
