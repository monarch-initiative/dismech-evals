        biological_scale: TISSUE
        description: 'Two further organ limbs of HNF1B haploinsufficiency, grouped because both come from
          the same source and both are curated at low confidence in humans. Liver abnormalities are named
          in the GeneReviews manifestations list and warrant periodic hepatic monitoring, and sensorineural
          hearing loss warrants hearing screening throughout childhood; neither is characterised further
          there. The developmental route comes from the zebrafish HNF1B orthologue, whose loss gives underdevelopment
          of the liver and reduction in size of the otic vesicles alongside the kidney and pancreatic
          phenotypes. That the same gene patterns all four primordia is what makes a single upstream node
          plausible for all four limbs.

          '
        biological_processes:
        - preferred_term: liver development
