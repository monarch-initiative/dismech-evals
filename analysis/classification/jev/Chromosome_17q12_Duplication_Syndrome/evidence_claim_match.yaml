  f89dbefab053b5e30fae6ab8ff5f9f0e3f57c19323f4e4a8d7446cd05540927d:
    claim:
      about:
        disease:
          name: Chromosome 17q12 Duplication Syndrome
          disease_term:
            preferred_term: chromosome 17q12 duplication syndrome
            term:
              id: MONDO:0013796
              label: chromosome 17q12 duplication syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Increased 17q12 Gene Dosage
        biological_scale: MOLECULAR
        description: Three copies of a ~1.4-1.9 Mb interval containing about 15 OMIM genes. The proteins
          are structurally normal; what is abnormal is how much of each there is. HNF1B is the gene the
          literature treats as the dosage-sensitive driver, with LHX1 and ACACA named alongside it. Which
          of the interval genes actually produces which feature is not established for the duplication,
          so this node deliberately claims dosage imbalance and not an HNF1B-specific mechanism.
        genes:
        - preferred_term: HNF1B
          modifier: INCREASED
          term:
            id: hgnc:11630
            label: HNF1B
        - preferred_term: LHX1
          modifier: INCREASED
          term:
            id: hgnc:6593
            label: LHX1
        - preferred_term: ACACA
          modifier: INCREASED
          term:
            id: hgnc:84
            label: ACACA
      selected_evidence:
        snippet: The aberrations encompass the genes, HNF1B, LHX1, and ACACA, among others.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
