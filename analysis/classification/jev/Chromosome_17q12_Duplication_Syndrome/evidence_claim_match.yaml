      assertion_type: ProgressionInfo
      assertion:
        phase: Adolescent and adult psychiatric presentation
        notes: Schizophrenia and psychosis have their own onset window in adolescence and adulthood, so
          a carrier assessed in childhood has not yet passed through the period of greatest psychiatric
          risk. The Swedish CNV study put the odds ratio for schizophrenia at about 4.
      selected_evidence:
        snippet: In light of recent reports of association of this locus with schizophrenia, we performed
          a detailed psychiatric assessment and confirmed that one family member has symptoms consistent
          with a diagnosis of schizophrenia and another has a prodromal syndrome with attenuated positive
          symptoms of psychosis.
        supports: SUPPORT
