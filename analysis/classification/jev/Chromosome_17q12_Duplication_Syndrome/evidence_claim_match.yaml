      assertion_type: DifferentialDiagnosis
      assertion:
        name: Chromosome 17q12 deletion syndrome
        description: The reciprocal rearrangement at the same breakpoints. It shares renal disease, learning
          disability, behavioural abnormality, epilepsy, autism, schizophrenia, structural brain anomalies,
          facial dysmorphism and joint laxity with the duplication, but its renal and diabetes phenotype
          (RCAD / MODY5) is far more consistent. Microarray distinguishes them immediately; clinical features
          do not.
        distinguishing_features:
        - Delayed language development, learning disability, kidney involvement and eye dysmorphism with
          strabismus are the features most consistently shared among deletion patients.
        - The duplication group is characterised instead by an extremely wide and less predictable spectrum,
          weighted toward neurodevelopmental and psychiatric features rather than renal disease and diabetes.
      selected_evidence:
        snippet: Delayed language development, learning disability, kidney involvement, and eye dysmorphism
          and strabismus were the most consistently shared features among patients with 17q12 deletion.
        supports: SUPPORT
