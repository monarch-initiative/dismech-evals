            term:
              id: MONDO:0013796
              label: chromosome 17q12 duplication syndrome
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Prenatal detection on ultrasound anomaly
        notes: Where the duplication is found before birth it is usually because a fetal ultrasound anomaly,
          renal or a duodenal "double bubble" or a cardiac finding, prompted amniocentesis and chromosomal
          microarray. Prenatal series are therefore enriched for the malformation end of the spectrum
          and say nothing about how a carrier ascertained any other way will present.
      selected_evidence:
        snippet: Retrospective data were collected for 16 fetuses diagnosed with 17q12 deletion and seven
          fetuses with 17q12 duplication through SNP-array during prenatal diagnosis at a single Chinese
          tertiary medical center from January 2017 to December 2023.
        supports: SUPPORT
    origin:
      assertion_path: /progression/0
      evidence_path: /progression/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39433644
      reference_title: 'Prenatal diagnosis, ultrasound findings, and pregnancy outcome of 17q12 deletion
        and duplication syndromes: a retrospective case series.'
      evidence_source: HUMAN_CLINICAL
      explanation: Describes the ascertainment route and its scale. Seven duplication fetuses is the whole
        prenatal duplication series, which is why its percentages are treated cautiously throughout this
        entry.
