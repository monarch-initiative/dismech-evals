      assertion_type: Diagnosis
      assertion:
        name: Chromosomal microarray analysis
        description: The duplication is about 1.4 Mb, below the resolution of a karyotype, so chromosomal
          microarray is the diagnostic test. Prenatally, SNP-array or CNV-seq on amniotic fluid is the
          equivalent. Parental testing follows, because inheritance from an apparently unaffected parent
          is common and changes the recurrence risk.
      selected_evidence:
        snippet: Peripheral blood from the parents was extracted to determine whether the CNVs in the
          fetuses were inherited or de novo.
        supports: SUPPORT
