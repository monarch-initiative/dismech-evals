  7d6c457948a46aae6b6ca0c7ab8afe70b2453ef78f67a05aa072831191180af3:
    claim:
      about:
        disease:
          name: Chromosome 17q12 Duplication Syndrome
          disease_term:
            preferred_term: chromosome 17q12 duplication syndrome
            term:
              id: MONDO:0013796
              label: chromosome 17q12 duplication syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NAHR Between 17q12 Segmental Duplications
        biological_scale: MOLECULAR
        description: The 17q12 interval is flanked by segmental duplications that misalign during meiosis,
          so unequal crossing-over generates a reciprocal deletion and duplication at the same breakpoints.
          This architecture is why the rearrangement recurs independently in unrelated families rather
          than being inherited from a common ancestor, and why no founder haplotype or population is involved.
        genetic_context:
          variant_origin: GERMLINE
          allele_type: structural variant (recurrent copy-number gain)
      selected_evidence:
        snippet: We found that 6% of fetal material showed evidence of microdeletion or microduplication,
          including three independent events that likely resulted from unequal crossing-over between segmental
          duplications.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
