        context: []
      assertion_type: Genetic
      assertion:
        name: HNF1B
        gene_term:
          preferred_term: HNF1B
          term:
            id: hgnc:11630
            label: HNF1B
        relationship_type: CAUSATIVE
        notes: 'HNF1B is the gene the literature treats as the dosage-sensitive driver of the 17q12 interval,
          and it is the gene whose point mutations and whole-gene deletion cause MODY5 and renal cystic
          disease. Its role in the duplication is an inference from that, plus the zebrafish overexpression
          result: no study has shown which interval gene produces which duplication phenotype. The relationship
          is recorded as CAUSATIVE because the duplication is causative and HNF1B is in it, not because
          HNF1B-specific causation has been demonstrated for the duplication phenotype.'
      selected_evidence:
        snippet: One of the microdeletions, identified in a fetus with multicystic dysplastic kidneys,
          encompasses the TCF2 gene on 17q12, previously shown to be mutated in maturity-onset diabetes,
          as well as in a subset of pediatric renal abnormalities.
        supports: SUPPORT
    origin:
