      assertion_type: Prevalence
      assertion:
        population: Norwegian Mother, Father and Child Cohort newborns, 12,252 trios
        measure_type: BIRTH_PREVALENCE
        prevalence_class: ABOVE_1_IN_1000
        rate_per_100000: 480.0
        rate_denominator: LIVE_BIRTHS
        notes: 0.48% of live-born children carry a deletion or duplication at one of the 13 recurrent
          neurodevelopmental CNV regions. This is the figure for all 26 CNVs together, not for the 17q12
          duplication, and is recorded because it is the best-quality unselected denominator available.
          The same study reports the 17q12 deletion at about 1 in 4,000; it does not give a separate figure
          for the duplication, so no duplication-specific rate is curated here.
      selected_evidence:
        snippet: 'We estimate the total prevalence of recurrent NDD CNVs (duplications and deletions)
          in live-born children to 0.48% (95% C.I.: 0.37-0.62%), i.e., ~1 in 200 newborns has either a
          deletion or duplication in these NDDs associated regions.'
        supports: SUPPORT
