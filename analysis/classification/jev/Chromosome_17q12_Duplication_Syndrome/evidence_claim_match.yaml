          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: The duplication segregates as an autosomal dominant trait with reduced penetrance.
          GeneReviews puts the de novo fraction at about 10%, so roughly nine carriers in ten inherited
          it, usually from a parent who is minimally affected or phenotypically normal. That locus-specific
          figure is lower than the 34% de novo rate measured across recurrent neurodevelopmental CNVs
          as a class in newborn trios, which is recorded below for contrast rather than as a figure for
          this duplication. The combination of dominant transmission, reduced penetrance and wide expressivity
          is what makes the recurrence risk easy to state and the prognosis hard to.
      selected_evidence:
        snippet: The duplication is often inherited from an apparently unaffected parent.
        supports: SUPPORT
