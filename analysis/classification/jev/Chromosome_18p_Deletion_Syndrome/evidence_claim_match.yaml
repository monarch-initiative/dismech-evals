        context: []
      assertion_type: Pathophysiology
      assertion:
        name: 18p haploinsufficiency
        description: Terminal or interstitial deletion of the short arm of chromosome 18 removes one copy
          of multiple dosage-sensitive genes, producing a contiguous-gene haploinsufficiency syndrome.
          The extent of the deleted region and which dosage-sensitive genes are rendered hemizygous determine
          the phenotypic spectrum, including a critical region for intellectual disability and the distal
          location of genes (e.g., TGIF1) underlying midline brain defects and growth-hormone deficiency.
        cell_types:
        - preferred_term: neural cell
          term:
            id: CL:0002319
            label: neural cell
      selected_evidence:
        snippet: The deletion 18p syndrome is one of the most common chromosome abnormalities. The medical
          problems are mental and postnatal growth retardation, and sometimes malformations of the heart
          and brain.
        supports: SUPPORT
