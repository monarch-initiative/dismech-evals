  5f00e2128ebf11d27269688f7d0f5f40356ecc574935fda4c06625639ee07425:
    claim:
      about:
        disease:
          name: Chromosome 18p Deletion Syndrome
          disease_term:
            preferred_term: chromosome 18p deletion syndrome
            term:
              id: MONDO:0007800
              label: chromosome 18p deletion syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SMCHD1-dependent epigenetic derepression
        description: 'SMCHD1 (at 18p11.32) is a chromatin modifier that maintains heavy methylation of
          the D4Z4 macrosatellite repeat on chromosome 4q35, repressing the DUX4 retrogene. In 18p deletion
          carriers, SMCHD1 hemizygosity combined with a permissive (moderately sized) D4Z4 allele on chromosome
          4 can cause facioscapulohumeral muscular dystrophy type 2 (FSHD2) through digenic inheritance,
          DUX4 derepression, and muscle degeneration.

          The digenic claim here belongs to FSHD2, not to 18p deletion syndrome. 18p deletion is a chromosomal,
          usually de novo event, so this entry binds no digenic inheritance term (HP:0010984) and is not
          a member of the Digenic and Oligogenic Disorders grouping; Facioscapulohumeral Muscular Dystrophy
          is a member, on exactly this SMCHD1-plus-permissive-4qA mechanism. What 18p deletion contributes
          is one route to the SMCHD1 hemizygosity that FSHD2 needs.'
        genes:
        - preferred_term: SMCHD1
          term:
            id: hgnc:29090
            label: SMCHD1
      selected_evidence:
        snippet: Digenic inheritance of a SMCHD1 mutation and a moderately sized D4Z4 repeat on a facioscapulohumeral
          muscular dystrophy (FSHD) permissive genetic background of chromosome 4 can cause FSHD type
          2 (FSHD2).
        supports: SUPPORT
