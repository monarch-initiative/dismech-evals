      assertion_type: Inheritance
      assertion:
        name: De novo terminal deletion
        description: Most cases arise from a de novo terminal deletion of the short arm of chromosome
          18, with the remaining alleles typically a normal karyotype in the parents. A minority arise
          from unbalanced translocations or familial transmission.
      selected_evidence:
        snippet: The aims of present study were to clinically and molecularly characterize the syndrome
          further in seven subjects with de novo 18p deletions and to perform genotype-phenotype correlation.
          All seven subjects had terminal deletions and no interstitial deletion was observed with subtelomeric
          FISH analyses.
        supports: SUPPORT
