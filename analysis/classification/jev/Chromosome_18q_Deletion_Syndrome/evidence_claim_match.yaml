        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced central white-matter myelination
        description: 'The distal 18q region (18q23) includes MBP, encoding myelin basic protein. 18q deletion
          is classically associated with reduced white-matter myelination and abnormal cerebral white-matter
          MRI signal. Note that the mechanistic basis is debated: a single autopsy study of a ring-18
          patient with confirmed MBP haploinsufficiency found intact myelin and attributed the MRI signal
          to gliosis rather than dysmyelination (see discussions).'
        cell_types:
        - preferred_term: oligodendrocyte
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: myelination
          modifier: DECREASED
          term:
            id: GO:0042552
            label: myelination
        genes:
        - preferred_term: MBP
          term:
            id: hgnc:6925
            label: MBP
      selected_evidence:
        snippet: CAA is frequently seen in individuals with an 18q deletion, which is characterized by
          intellectual disability, reduced white-matter myelination, foot deformities, and distinctive
          facial features.
        supports: SUPPORT
