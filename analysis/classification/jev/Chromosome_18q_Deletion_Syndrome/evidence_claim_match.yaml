      assertion:
        name: Cardiac morphogenesis dysregulation
        description: Congenital heart defects occur in roughly a quarter to a third of affected individuals,
          with a shared distal 18q22.3-q23 overlap region; the most common lesions are pulmonary valve
          anomalies and atrial septal defects. In proximal deletions, cardiac defects often map distal
          to GATA6, implying an alternative mechanism rather than GATA6 haploinsufficiency.
        biological_processes:
        - preferred_term: heart morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0003007
            label: heart morphogenesis
      selected_evidence:
        snippet: All 19 individuals shared a small overlapping deletion region between 18q22.3q23. The
          most common cardiac defects detected were pulmonary valve anomalies and atrial septal defects.
        supports: SUPPORT
