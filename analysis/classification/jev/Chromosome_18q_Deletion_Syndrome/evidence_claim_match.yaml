  c530ab5c657d16c332b41c1bbe347bc1955de05e63b434f1fe59708824d050ad:
    claim:
      about:
        disease:
          name: Chromosome 18q Deletion Syndrome
          disease_term:
            preferred_term: chromosome 18q deletion syndrome
            term:
              id: MONDO:0011147
              label: chromosome 18q deletion syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_18q_mbp_myelination_vs_gliosis
        prompt: Is the abnormal cerebral white-matter MRI signal in 18q deletion syndrome caused by MBP-haploinsufficiency
          dysmyelination, or by gliosis with intact myelin? A single autopsy study of a ring-18 patient
          with confirmed MBP haploinsufficiency found the brain to be well myelinated and attributed the
          MRI signal to gliosis, contradicting the long-standing dysmyelination model.
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Reduced central white-matter myelination
        rationale: 'The MBP-dysmyelination hypothesis is mechanistically attractive (MBP lies in the deleted
          18q23 region and is required for myelin compaction), but human pathology evidence is limited
          to a single autopsy case in which myelin was histologically and ultrastructurally intact despite
          confirmed MBP haploinsufficiency, with the MRI signal instead reflecting gliosis. This is a
          model/observation mismatch rather than absent evidence: the imaging finding is real and reproducible,
          but its cellular basis (dysmyelination vs gliosis) is unresolved, which matters for interpreting
          MBP dosage as the driver of the white-matter phenotype.'
        proposed_experiments:
        - experiment_id: exp_18q_mbp_autopsy_quantitative_ihc
          name: Quantitative MBP immunohistochemistry and electron microscopy in confirmed terminal 18q23
            deletion
          description: Conduct additional autopsy studies with quantitative myelin basic protein immunohistochemistry
            and electron microscopy in patients with confirmed terminal 18q23 deletion (not ring chromosome)
            to determine whether the gliosis finding generalizes beyond the single ring-18 case, or whether
            true dysmyelination is detectable when MBP haploinsufficiency arises from a simple terminal
            deletion rather than a ring rearrangement.
        - experiment_id: exp_18q_mbp_dti_mtr_invivo
          name: Diffusion tensor imaging and magnetization transfer ratio cohort study
          description: Perform diffusion tensor imaging (DTI) and magnetization transfer ratio studies
            to distinguish dysmyelination from gliosis in vivo across a cohort of 18q deletion patients
            with varying breakpoints, testing whether white-matter microstructural metrics track with
            the extent of the deleted 18q23 interval and the presence of MBP haploinsufficiency.
      selected_evidence:
        snippet: the brain was well myelinated, contrary to established hypotheses about this disorder.
          The MRI signal abnormalities in 18q-syndrome could be attributed to gliosis and not to dysmyelination.
        supports: SUPPORT
