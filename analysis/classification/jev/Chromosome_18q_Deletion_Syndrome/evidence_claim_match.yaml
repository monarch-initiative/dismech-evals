            term:
              id: MONDO:0011147
              label: chromosome 18q deletion syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: 18q contiguous-gene haploinsufficiency
        description: Heterozygous terminal or interstitial deletion of the long arm of chromosome 18 removes
          one copy of a contiguous set of genes, producing a haploinsufficiency syndrome. The clinical
          spectrum reflects which dosage-sensitive genes fall within the deleted interval, so the phenotype
          varies with breakpoint position and deletion size. The syndrome is conventionally split into
          a common distal (terminal) form and a rarer proximal interstitial form (18q11.2-q21.1).
      selected_evidence:
        snippet: 18q- syndrome is a rare chromosomal disease caused by the deletion of the long arm of
          chromosome 18.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
