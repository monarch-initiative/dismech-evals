      assertion:
        name: 1p36 terminal deletion
        association: Causal
        notes: Terminal (or interstitial) deletion of distal 1p36 (copy-number loss), of variable size
          across the ~30 Mb region; the most common terminal deletion in humans. No single causal gene;
          haploinsufficiency of more than one gene contributes, and candidate genes include RERE, KCNAB2,
          GABRD, SKI, PRDM16, MMP23B, and CASZ1. No coordinate slot exists in the schema; the deletion
          is recorded here in prose.
      selected_evidence:
        snippet: Although 1p36 deletion syndrome is considered clinically recognizable, there is significant
          phenotypic variation among affected individuals.
        supports: SUPPORT
