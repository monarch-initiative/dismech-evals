      assertion_type: Pathophysiology
      assertion:
        name: Haploinsufficiency of 1p36 Genes
        biological_scale: MOLECULAR
        description: Reduced dosage of contiguous 1p36 genes produces the multisystem phenotype. Severity
          does not track cleanly with deletion size, implicating position effects and haploinsufficiency
          of more than one gene; candidate contributors include RERE, KCNAB2 (seizures), GABRD, SKI, PRDM16
          (cardiomyopathy), MMP23B, CASZ1, and others.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: The major clinical features of monosomy 1p36 deletion are developmental delay and hypotonia
          associated with short stature and craniofacial dysmorphisms.
        supports: SUPPORT
