          programs SATB2 controls in the palate, cortex, and skeleton.
        genes:
        - preferred_term: SATB2
          term:
            id: hgnc:21637
            label: SATB2
        biological_processes:
        - preferred_term: transcriptional regulation
          modifier: DECREASED
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: Haploinsufficiency of one of these genes, SATB2, a DNA-binding protein that regulates
          gene expression, has been implicated as causative in the cleft or high palate of individuals
          with 2q32q33 microdeletion syndrome.
        supports: SUPPORT
