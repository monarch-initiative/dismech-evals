        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Contiguous-gene 2q32-q33 haploinsufficiency
        description: Interstitial deletion of chromosome 2q32-q33 removes one copy of a contiguous block
          of genes. The commonly deleted region contains SATB2 plus neighbouring dosage-sensitive genes
          (GLS, MYO1B, TMEFF2, PGAP1, among others), so the phenotype reflects combined haploinsufficiency,
          with SATB2 loss as the major driver of the cognitive and craniofacial/palatal features.
        genes:
        - preferred_term: SATB2
          term:
            id: hgnc:21637
            label: SATB2
        - preferred_term: GLS
          term:
            id: hgnc:4331
            label: GLS
        - preferred_term: MYO1B
          term:
            id: hgnc:7596
            label: MYO1B
        - preferred_term: TMEFF2
          term:
            id: hgnc:11867
            label: TMEFF2
        - preferred_term: PGAP1
          term:
            id: hgnc:25712
            label: PGAP1
      selected_evidence:
        snippet: The commonly deleted region contains at least seven genes.
        supports: SUPPORT
