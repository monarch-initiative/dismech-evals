      assertion_type: DifferentialDiagnosis
      assertion:
        name: 3q29 microduplication syndrome
        description: The reciprocal product of the same non-allelic homologous recombination event at
          the same locus. It shares the mechanism and the interval but is a distinct, generally milder
          disorder — a useful natural dosage comparator rather than a diagnostic trap, since microarray
          distinguishes them unambiguously.
        distinguishing_features:
        - Copy-number gain rather than loss at the same interval
        - Generally milder and more variable phenotype
      selected_evidence:
        snippet: 3q29 microduplication syndrome is characterized by widely variable clinical presentation,
          but generally mild features.
        supports: SUPPORT
