  ceb0601cd942be3e3ad5fcfd2073924ef0107d0ff5131b41a25144c04f436057:
    claim:
      about:
        disease:
          name: Chromosome 3q29 Microdeletion Syndrome
          disease_term:
            preferred_term: Chromosome 3q29 Microdeletion Syndrome
            term:
              id: MONDO:0012269
              label: chromosome 3q29 microdeletion syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Non-Allelic Homologous Recombination at 3q29 Low-Copy Repeats
        biological_scale: MOLECULAR
        description: The initiating event, and the reason the deletion is recurrent rather than private.
          Two nearly identical low-copy repeats flank the interval; misalignment between them during meiosis
          and unequal crossing-over excises the intervening sequence, producing near-identical breakpoints
          in unrelated patients. The reciprocal product of the same event is the 3q29 microduplication,
          which is a distinct and generally milder disorder.
        biological_processes:
        - preferred_term: recombinational repair
          term:
            id: GO:0000725
            label: recombinational repair
          modifier: ABNORMAL
      selected_evidence:
        snippet: The presence of two nearly identical low-copy repeat sequences in BAC clones on each
          side of the deletion breakpoint suggests that nonallelic homologous recombination is the likely
          mechanism of disease causation in this syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
