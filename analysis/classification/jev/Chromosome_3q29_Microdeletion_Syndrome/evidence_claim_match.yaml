        context: []
      assertion_type: Diagnosis
      assertion:
        name: Psychiatric and Neurodevelopmental Assessment
        description: Formal assessment is recommended for every individual with the deletion, not only
          those who look impaired — a point with real consequences, because cognitive ability does not
          predict psychiatric burden here. Someone with an IQ in the normal range carries the same requirement
          for behavioural evaluation as anyone else with the deletion. Autism evaluation in particular
          is argued to be standard of care, since autistic features are present in many individuals who
          do not carry an autism diagnosis.
      selected_evidence:
        snippet: Cognitive ability is not a strong indicator of other neurodevelopmental or psychiatric
          impairment; thus, individuals with 3q29 deletion syndrome who exhibit IQ scores within the normal
          range should receive all recommended behavioural evaluations.
        supports: SUPPORT
