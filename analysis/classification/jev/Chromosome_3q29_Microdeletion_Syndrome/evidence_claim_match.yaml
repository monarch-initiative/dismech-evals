        name: Cortical Excitation-Inhibition Imbalance
        biological_scale: TISSUE
        description: In the syntenic mouse model, whole-brain imaging after a behavioural task showed
          neuronal hyperactivation that was strikingly exaggerated but spatially restricted rather than
          global, accompanied by reduced parvalbumin expression in cortex. That combination — excess excitatory
          activity with reduced inhibitory interneuron marker expression — is the standard shape of an
          excitation-inhibition imbalance, and it is the cellular phenotype the mouse work offers for
          the psychiatric arm of the syndrome. It is a model-organism finding; no equivalent human cortical
          measurement exists.
