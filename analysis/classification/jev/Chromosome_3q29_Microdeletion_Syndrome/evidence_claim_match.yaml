        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: q3q29_psychosis_model_gap
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does antipsychotic-reversible prepulse-inhibition impairment in the syntenic mouse tell
          us anything about the psychosis risk that defines this syndrome in humans?
        attaches_to:
        - pathophysiology#Cortical Excitation-Inhibition Imbalance
        rationale: The mouse work is genuinely strong on its own terms — construct validity by design,
          a restricted cortical hyperactivation phenotype, reduced parvalbumin expression, and a behavioural
          deficit that antipsychotics reverse. But prepulse inhibition is a sensorimotor gating measure,
          not psychosis, and the drug reversal demonstrates that the proxy is pharmacologically responsive
          rather than that the model captures the human illness. The mismatch matters here more than usual
          because the >40-fold schizophrenia risk is the syndrome's signature finding, so the phenotype
          we most want a model for is precisely the one no rodent can carry. The cortical excitation-inhibition
          node is curated at PROVISIONAL confidence for this reason.
        proposed_experiments:
        - experiment_id: q3q29_human_cortical_circuit_measures
          name: Human cortical excitation-inhibition measures in deletion carriers
          description: Apply non-invasive measures of cortical excitation-inhibition balance — for example
            magnetic resonance spectroscopy of GABA and glutamate, or TMS-EEG-derived cortical inhibition
            — in deletion carriers with and without psychotic symptoms, to test whether the imbalance
            the mouse shows has a human correlate that tracks psychiatric outcome.
      selected_evidence:
        snippet: These findings are reminiscent of the growth defects and neuropsychiatric behavioral
          phenotypes in patients with 3q29 deletion syndrome and exemplify that the mouse model achieves
          some part of face validity and predictive validity.
        supports: SUPPORT
