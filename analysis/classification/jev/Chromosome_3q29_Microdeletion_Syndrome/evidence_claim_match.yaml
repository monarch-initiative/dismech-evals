      assertion_type: Pathophysiology
      assertion:
        name: Posterior Fossa and Cerebellar Maldevelopment
        biological_scale: TISSUE
        description: 'A structural signature specific enough to be a candidate biomarker. Quantitative
          MRI shows smaller cerebellar cortex volumes and, in the opposite direction, larger cerebellar
          white matter volumes, together with elevated rates of posterior fossa arachnoid cysts and mega
          cisterna magna. The dissociation within that list matters: cerebellar grey and white matter
          volumes track visual perception, visual-motor integration and IQ, whereas the cystic malformations
          — the findings most likely to be flagged on a clinical read — showed no behavioural association
          at all. Reporting the cyst without the volumetrics would therefore be reporting the part that
          does not predict anything.'
        locations:
        - preferred_term: cerebellum
          term:
            id: UBERON:0002037
            label: cerebellum
      selected_evidence:
        snippet: 3q29Del participants had smaller cerebellar cortex volumes than controls, before and
          after correction for intracranial volume (ICV).
        supports: SUPPORT
