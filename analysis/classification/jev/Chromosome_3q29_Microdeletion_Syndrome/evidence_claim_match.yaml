        snippet: Here, we report the first in vivo quantitative neuroimaging study in individuals with
          3q29Del (N = 24) and neurotypical controls (N = 1608) using structural MRI. ... 3q29Del participants
          also had larger cerebellar white matter volumes than controls following ICV-correction and displayed
          elevated rates of posterior fossa arachnoid cysts and mega cisterna magna findings independent
          of cerebellar volume. Cerebellar white matter and subregional gray matter volumes were associated
          with visual-perception and visual-motor integration skills as well as IQ, while cystic/cyst-like
          malformations yielded no behavioral link.
