  a1dbc0c0ad36aaca12a75c6298c4e3f70aeb20c4a31af6417d69b1ce2264fd17:
    claim:
      about:
        disease:
          name: Chromosome 3q29 Microdeletion Syndrome
          disease_term:
            preferred_term: Chromosome 3q29 Microdeletion Syndrome
            term:
              id: MONDO:0012269
              label: chromosome 3q29 microdeletion syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Combinatorial Haploinsufficiency Across the 3q29 Interval
        biological_scale: MOLECULAR
        description: 'Hemizygosity for the ~21 protein-coding genes in the interval. The load-bearing
          curatorial point is negative: no single gene has been shown to be necessary and sufficient for
          the syndrome, and this node deliberately does not nominate one. The leading candidates are DLG1
          and PAK2, autosomal paralogues of the X-linked intellectual disability genes DLG3 and PAK3,
          and NCBP2, which behaves as a broad enhancer of the other genes'' phenotypes rather than as
          a driver in its own right. A pairwise interaction screen across 314 combinations of 14 homologs
          found dozens of interactions and traced the NCBP2 effect to increased apoptosis, which was rescued
          by apoptosis inhibitors — evidence that the mechanism is interaction between genes in the interval,
          not the failure of any one of them.'
        genes:
        - preferred_term: DLG1
          term:
            id: hgnc:2900
            label: DLG1
        - preferred_term: PAK2
          term:
            id: hgnc:8591
            label: PAK2
        - preferred_term: NCBP2
          term:
            id: hgnc:7659
            label: NCBP2
        biological_processes:
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The deletion encompasses 22 genes, including PAK2 and DLG1, which are autosomal homologues
          of two known X-linked mental retardation genes, PAK3 and DLG3.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15918153
      reference_title: '3q29 microdeletion syndrome: clinical and molecular characterization of a new
        syndrome.'
