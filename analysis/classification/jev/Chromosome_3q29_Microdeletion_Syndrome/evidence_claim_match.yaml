        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: q3q29_driver_gene_attribution
        kind: KNOWLEDGE_GAP
        prompt: Which gene or combination of genes in the 3q29 interval is responsible for the neurodevelopmental
          and psychiatric phenotype?
        attaches_to:
        - pathophysiology#Combinatorial Haploinsufficiency Across the 3q29 Interval
        rationale: 'Two decades after the syndrome was described, no gene in the interval has been shown
          to be necessary and sufficient, and single-gene knockouts of the leading candidates do not reproduce
          it. The evidence points instead at combinatorial haploinsufficiency, with NCBP2 acting as an
          enhancer of other genes'' effects and PAK2 contributing to a measured metabolic deficit. This
          gap is what stops the entry nominating a driver, and it is not merely academic: a therapeutic
          strategy aimed at one gene presupposes an answer that does not exist. Note also that the interval''s
          genes are functionally heterogeneous — synaptic scaffolding, actin regulation, mRNA cap binding,
          ubiquitination and SUMOylation — so "combinatorial" here does not yet mean "converging on one
          pathway".'
        proposed_experiments:
        - experiment_id: q3q29_single_gene_rescue_in_isogenic_organoids
          name: Single-gene dosage restoration in isogenic 3q29 deletion organoids
          description: Restore each interval gene individually and in defined combinations in the isogenic
            deletion organoid background, and test which restorations rescue the mitochondrial and transcriptomic
            phenotypes. A single-gene rescue would identify a driver; a requirement for combinations would
            confirm the combinatorial model directly rather than by inference from knockdown screens.
      selected_evidence:
        snippet: Despite its importance towards neurodevelopment, the role of individual genes, genetic
          interactions, and disrupted biological mechanisms underlying the deletion have not been thoroughly
          characterized.
        supports: SUPPORT
