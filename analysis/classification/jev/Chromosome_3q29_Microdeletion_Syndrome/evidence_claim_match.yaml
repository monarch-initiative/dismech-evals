      assertion_type: AnimalModel
      assertion:
        name: 3q29 deletion (Df/+) mouse
        species: Mouse
        genotype: Chromosome-engineered deletion syntenic to the human 3q29 interval
        publication: PMID:31216562
        description: A chromosome-engineered mouse carrying the syntenic deletion, offering construct
          validity by design and, as it turned out, elements of face and predictive validity too.
        modeled_mechanisms:
        - target: Cortical Excitation-Inhibition Imbalance
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Regionally restricted cortical neuronal hyperactivation with reduced parvalbumin
            expression, plus impaired prepulse inhibition that is reversed by antipsychotics.
          limitations: Prepulse inhibition is a sensorimotor gating proxy, not psychosis; a mouse cannot
            model the syndrome's defining psychiatric outcome, and its reversal by antipsychotics demonstrates
            pharmacological responsiveness of the proxy rather than of the human illness. Reduced parvalbumin
            expression is a marker measurement, not a demonstration of interneuron loss.
      selected_evidence:
        snippet: 3q29 deletion (Df/+) mice showed reduced body weight and brain volume and, more importantly,
          impaired social interaction and prepulse inhibition.
        supports: SUPPORT
