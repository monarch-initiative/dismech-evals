  a076a88f763bd5c431faf37643ddd82b8551eb9bdc3e8c167ea4691d0d333caf:
    claim:
      about:
        disease:
          name: Chromosome 3q29 Microduplication Syndrome
          disease_term:
            preferred_term: chromosome 3q29 microduplication syndrome
            term:
              id: MONDO:0012761
              label: chromosome 3q29 microduplication syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NAHR Between 3q29 Low-Copy Repeats
        biological_scale: MOLECULAR
        description: 'The 3q29 interval is flanked by almost identical low-copy repeats, and non-allelic
          homologous recombination between them generates a reciprocal deletion/duplication pair. Optical
          genome mapping across 18 probands localised the crossovers tightly: in 89% of them the breakpoints
          lay within paralogous copies of one 20 kb segment inside the segmental duplications. Unlike
          the 8p and 15q recurrent rearrangements, no parent-of-origin inversion polymorphism has been
          found at this locus.'
      selected_evidence:
        snippet: Finally, we found no evidence of inversions in parent-of-origin chromosomes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37165454
      reference_title: High level of complexity and global diversity of the 3q29 locus revealed by optical
        mapping and long-read sequencing.
      evidence_source: HUMAN_CLINICAL
      explanation: 'A negative result worth curating: the inversion-polymorphism model that explains other
        recurrent NAHR rearrangements was looked for here and not found.'
