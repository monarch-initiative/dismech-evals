        biological_scale: ORGANISM
        description: The clinical layer. Isolated 3q29 duplications produce mainly mild neurodevelopmental
          impairment - a high rate of learning disability against a low proportion with frank intellectual
          disability - and the same duplication is carried by mildly affected or unaffected relatives.
          Additional genetic findings were identified in a substantial minority of patients, which is
          why the cohort authors advise looking further when the presentation is severe.
      selected_evidence:
        snippet: Focusing on apparently isolated 3q29 duplications, patients present mainly mild NDD as
          suggested by a high rate of learning disabilities in contrast to a low proportion of patients
          with intellectual disabilities.
