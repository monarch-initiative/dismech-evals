        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dup3q29_critical_region
        kind: CONTROVERSY
        status: OPEN
        prompt: Does 3q29 duplication syndrome have a minimal critical region - BDH1, or DLG1 with BDH1
          - or is no critical region supported by the data?
        attaches_to:
        - pathophysiology#Gain of Dosage of Synaptic and Metabolic Candidate Genes
        rationale: 'Two lines of evidence point opposite ways and neither is obviously weaker. Successive
          small duplications have been used to shrink the region: 448 kb containing DLG1 and BDH1, then
          a second independent family with a 433 kb duplication of the same two genes, then five patients
          with 232-486 kb duplications used to argue for BDH1 alone. Against that, the largest published
          cohort - 31 families, nine of them with duplications under 1 Mb - looked at exactly this question
          in its own data and concluded there is no evidence for any critical region.

          The disagreement is not about a boundary, it is about the kind of disorder this is. A single-gene
          critical region would make it a BDH1 dosage disorder with a tractable mechanism. No critical
          region would make it a contiguous-gene effect in which the phenotype needs the interval rather
          than any member of it. The entry curates the candidate genes as candidates and the node''s causal
          link to the clinical layer as INDIRECT_UNKNOWN_INTERMEDIATES for this reason.

          What would settle it is not another small duplication. Given the reduced penetrance and the
          frequency of second findings, small-duplication series are the wrong instrument - unaffected
          carriers of the small region are what the region-shrinking argument has to explain, and one
          of the two-gene families reports exactly that, an unaffected sibling and an unaffected transmitting
          mother with the same 432.8 kb duplication.'
      selected_evidence:
        snippet: Besides, the study of small 3q29 duplications does not provide evidence for any critical
          region.
        supports: REFUTE
