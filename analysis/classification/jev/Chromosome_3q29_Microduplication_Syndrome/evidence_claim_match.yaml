        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: dup3q29_not_the_deletion
        kind: INTERPRETATION
        status: OPEN
        prompt: Which 3q29 findings transfer between the deletion and the duplication, and which do not?
        attaches_to:
        - disease#Chromosome 3q29 Microduplication Syndrome
        - pathophysiology#Increased Dosage of the 3q29 Interval
        rationale: 'The 3q29 literature is dominated by the deletion, and the most cited finding in it
          - the schizophrenia association - is a deletion finding. It is worth recording explicitly that
          it does not transfer, because the reciprocal relationship makes it easy to assume it does.

          The direct comparison gives three distinct patterns rather than one. Most phenotypes occur on
          both sides but significantly less often in duplication carriers. Overweight and weight deficit
          are mirrored, running opposite ways. And schizophrenia, generalised anxiety disorder and recurrent
          ear infections are reported as unique to deletion carriers. A counselling conversation that
          treats the duplication as a milder deletion gets the first pattern right and the other two wrong.'
      selected_evidence:
        snippet: Most of the phenotypes were observed in both groups but were significantly less common
          among individuals with 3q29 duplications.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
