        name: Increased Dosage of the 3q29 Interval
        biological_scale: MOLECULAR
        description: The recurrent lesion carries 21 protein-coding genes at three copies rather than
          two. The functional consequence is presumed increased expression of dosage-sensitive genes rather
          than loss of any function, which is why the duplication phenotype is not simply a milder version
          of the deletion phenotype and why some features mirror rather than parallel it.
      selected_evidence:
        snippet: There are 21 protein-coding genes lost or gained as a result of such recurrent 1.6-Mbp
          deletions or duplications, respectively, in the 3q29 locus.
        supports: SUPPORT
