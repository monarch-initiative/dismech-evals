      assertion_type: Pathophysiology
      assertion:
        name: Gain of Dosage of Synaptic and Metabolic Candidate Genes
        biological_scale: CELLULAR
        description: Which gene or genes in the interval drive the phenotype is unresolved. The candidates
          repeatedly nominated are synaptic - DLG1, PAK2, FBXO45 - plus the mitochondrial ketone-body
          enzyme BDH1, and successive minimal-region analyses have converged on DLG1 with BDH1 and then
          on BDH1 alone. The largest cohort disputes that any critical region exists. This node therefore
          asserts the class of mechanism, not the gene.
        genes:
        - preferred_term: DLG1
          term:
            id: hgnc:2900
            label: DLG1
        - preferred_term: BDH1
          term:
            id: hgnc:1027
            label: BDH1
        biological_processes:
        - preferred_term: synapse organization
          modifier: ABNORMAL
          term:
            id: GO:0050808
            label: synapse organization
        notes: The genes listed here are the candidates the literature nominates, not established drivers.
          No functional experiment in any cited source tests dosage of DLG1 or BDH1 against the phenotype;
          the nominations rest on interval overlap.
      selected_evidence:
        snippet: Gene content analysis of the duplicated region suggests that gain-of-dosage of DLG1 and
          BDH1 may be a good candidate for the main clinical features of this syndrome.
        supports: SUPPORT
