    claim:
      about:
        disease:
          name: Chromosome Xq Duplication
          disease_term:
            preferred_term: chromosome Xq duplication
            term:
              id: MONDO:0017010
              label: partial duplication of the long arm of chromosome X
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of X-Chromosome Dosage Compensation
        biological_scale: CELLULAR
        description: 'X-chromosome inactivation, initiated from the X-inactivation centre (XIC) at Xq13,
          normally equalises X-linked gene expression between XX and XY cells. This safeguard fails in
          three distinguishable ways. In XY males there is no second X to inactivate, so any structural
          Xq disomy is obligatorily functional disomy. In females carrying an intrachromosomal duplication,
          inactivation is usually skewed towards the abnormal X, which rescues the phenotype; manifesting
          females are those with a random inactivation pattern. In females with an unbalanced X/autosome
          translocation, the translocated X segment is physically separated from its XIC in cis and therefore
          cannot be inactivated at all, so the phenotype is fully expressed and can be as severe as in
          males.

          '
        biological_processes:
        - preferred_term: X-chromosome inactivation
          term:
            id: GO:0009048
            label: dosage compensation by inactivation of X chromosome
          modifier: DECREASED
      selected_evidence:
        snippet: "In XY males, structural X disomy always results in functional disomy. In \nfemales,\
          \ failure of X chromosome dosage compensation could result from a variety \nof mechanisms, including\
          \ an unfavourable pattern of inactivation, a breakpoint \nseparating an X segment from the X-inactivation\
          \ centre in cis, or a small ring \nchromosome."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
