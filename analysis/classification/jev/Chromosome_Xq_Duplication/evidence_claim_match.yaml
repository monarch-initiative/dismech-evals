  0362c11cd57fd4f2d24aa67b70db4419bc2a21d20ae5910f3d7d721f7a1650cc:
    claim:
      about:
        disease:
          name: Chromosome Xq Duplication
          disease_term:
            preferred_term: chromosome Xq duplication
            term:
              id: MONDO:0017010
              label: partial duplication of the long arm of chromosome X
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_xq_dup_irak1_vs_aspiration
        kind: KNOWLEDGE_GAP
        prompt: 'Is the recurrent-infection phenotype of Xq28 functional disomy caused by increased innate-immune
          gene dosage (IRAK1/IKBKG), or is it secondary to aspiration from severe hypotonia and feeding
          difficulty?

          '
        attaches_to:
        - pathophysiology#Increased IRAK1 Dosage
        rationale: 'The IRAK1/IKBKG dosage hypothesis is stated only speculatively in the primary literature
          ("might result from"), and the one direct pathway test found that patient cells do not show
          increased canonical NF-kB signalling despite the IRAK1 duplication, leaving the innate-immune
          route unsupported at the pathway level. A purely mechanical explanation is plausible given that
          severe axial hypotonia, dysphagia and gastroesophageal reflux are themselves near-universal
          in this population. The distinction matters clinically: an immune mechanism would justify immunological
          evaluation and possibly prophylaxis, whereas an aspiration mechanism directs management to feeding
          and airway protection.

          '
        proposed_experiments:
        - experiment_id: exp_xq_dup_irak1_signalling
          name: Innate immune signalling assay in patient-derived cells
          description: 'Quantify IRAK1 and IKBKG transcript and protein levels and measure TLR/IL-1 pathway
            output in cells from individuals with Xq28 duplication, stratified by whether the duplication
            includes IRAK1/IKBKG.

            '
        - experiment_id: exp_xq_dup_infection_stratified
          name: Genotype-stratified infection burden comparison
          description: 'Compare respiratory infection rates between individuals whose duplications do
            and do not encompass IRAK1/IKBKG, controlling for degree of hypotonia and documented aspiration.

            '
      selected_evidence:
        snippet: "Patients with MECP2/IRAK1 duplication syndrome do not show increased \ncanonical NF-κB\
          \ signaling in immortalized fibroblasts, PBMCs, and whole blood."
        supports: SUPPORT
