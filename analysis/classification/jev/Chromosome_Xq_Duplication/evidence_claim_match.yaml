            term:
              id: MONDO:0017010
              label: partial duplication of the long arm of chromosome X
        context: []
      assertion_type: Inheritance
      assertion:
        name: X-linked inheritance
        description: 'Most Xq duplications in affected males are inherited from a carrier mother who is
          herself unaffected or only mildly affected because of skewed X-inactivation; de novo events
          and unbalanced products of a parental balanced rearrangement also occur. Rearrangement architecture
          predicts recurrence risk: de novo events are much more common among terminal duplications than
          tandem duplications.

          '
        inheritance_term:
          preferred_term: X-linked inheritance
          term:
            id: HP:0001417
            label: X-linked inheritance
      selected_evidence:
        snippet: The recurrence risk is significant if a structural rearrangement is present in one of
          the parent, the most frequent situation being that of an intrachromosomal duplication inherited
          from the mother.
        supports: SUPPORT
    origin:
