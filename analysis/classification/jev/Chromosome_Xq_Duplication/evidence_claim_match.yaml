        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_xq_dup_female_manifesting_carriers
        kind: KNOWLEDGE_GAP
        prompt: 'What determines whether a female carrier of an Xq duplication is asymptomatic or manifests
          a male-like phenotype?

          '
        attaches_to:
        - pathophysiology#Failure of X-Chromosome Dosage Compensation
        rationale: 'X-inactivation pattern explains most of the variance - skewing towards the duplicated
          X protects, random inactivation manifests, and an unbalanced translocation separating the segment
          from the XIC in cis produces full expression. But rare manifesting females have been described
          despite favourable skewing, for which local escape from inactivation, expression of recessive
          alleles on the active X, or gene disruption at the breakpoint have all been proposed without
          resolution. Predicting carrier outcome is directly actionable for genetic counselling.

          '
      selected_evidence:
        snippet: 'In rare cases, a favourable skewed

          X-inactivation is observed. For these cases, other explana-

          tions such as local escape from inactivation, expression of

          recessive genes from the active X, or disruption of a gene

          by the rearrangement have been suggested'
        supports: SUPPORT
