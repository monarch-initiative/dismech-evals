        biological_scale: MOLECULAR
        description: 'MeCP2 is a methyl-CpG-binding chromatin protein expressed most highly in post-mitotic,
          post-migratory neurons. Its level must be tightly regulated in both directions: loss of function
          causes Rett syndrome, while a roughly twofold increase from duplication is itself pathogenic.
          The duplicated allele is structurally wild type, so this is a quantitative overexpression rather
          than a qualitative change in protein function. Copy number is transmitted through to protein:
          patient-derived lymphoblastoid RNA and protein levels are correlated, and triplications produce
          significantly more MECP2 transcript than duplications.

          '
        cell_types:
        - preferred_term: neuron
