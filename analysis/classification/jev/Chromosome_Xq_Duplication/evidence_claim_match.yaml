          term:
            id: hgnc:6112
            label: IRAK1
        biological_scale: MOLECULAR
        description: 'IRAK1 and IKBKG lie immediately telomeric to MECP2 and are usually contained within
          the duplicated Xq28 segment. Both are innate immune signalling components downstream of the
          Toll-like and IL-1 receptors, and their increased dosage has been proposed as the explanation
          for the recurrent respiratory infections that distinguish Xq28 functional disomy from other
          X-linked intellectual disability/hypotonia syndromes. This remains a proposed rather than demonstrated
          mechanism: the one direct pathway test found that patient cells do not show increased canonical
          NF-kB signalling despite the IRAK1 duplication.

          '
        biological_processes:
        - preferred_term: toll-like receptor signaling pathway
          term:
            id: GO:0002224
            label: toll-like receptor signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: "Patients with MECP2/IRAK1 duplication syndrome do not show increased \ncanonical NF-κB\
          \ signaling in immortalized fibroblasts, PBMCs, and whole blood."
        supports: REFUTE
