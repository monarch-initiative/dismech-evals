        display_name: Xq26–qter duplication / distal Xq functional disomy
        description: 'Larger, cytogenetically visible duplications of the distal long arm, spanning Xq26–q28
          (often reported as Xq27–qter). These yield the classic recognisable distal Xq disomy phenotype
          and overlap the Xq28/MECP2 subtype in gene content, but carry a heavier burden of growth failure,
          microcephaly, and craniofacial dysmorphism.

          '
      selected_evidence:
        snippet: 'In particular, the Xq26–q28 chromosome region yields a

          recognisable phenotype including distinctive facial fea-

          tures, major axial hypotonia, severe developmental delay,

          severe feeding difficulties, abnormal genitalia and prone-

          ness to infections'
        supports: SUPPORT
