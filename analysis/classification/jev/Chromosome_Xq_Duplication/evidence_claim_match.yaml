        relationship_type: COOPERATING
        notes: 'L1 cell adhesion molecule at Xq28, consistently co-duplicated with MECP2 in the interstitial
          Xq28 interval.

          Deliberately not wired to a pathophysiology node. The cited evidence establishes that L1CAM
          lies inside the obligate duplicated segment and is an intellectual-disability gene, and it is
          bound as a gene of the `Xq28 (MECP2)` subtype on that basis. It does not establish that increased
          L1CAM dosage contributes to the phenotype - L1CAM disease is classically caused by loss of function
          - so no mechanism node is asserted here. That is a different state from IRAK1, where a dosage
          mechanism has been proposed in print and directly tested.

          '
      selected_evidence:
        snippet: "The duplications in the four patients vary in \nsize from 0.4 to 0.8 Mb and harbor several\
          \ genes, which, for each duplication, \ninclude the MR-related L1CAM and MECP2 genes."
