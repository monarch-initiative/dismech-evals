  ccd5d39978c0affabf498b51968a7938438f87ac4c3fac17a86859484847930b:
    claim:
      about:
        disease:
          name: Chromosome Xq Duplication
          disease_term:
            preferred_term: chromosome Xq duplication
            term:
              id: MONDO:0017010
              label: partial duplication of the long arm of chromosome X
        context: []
      assertion_type: Subtype
      assertion:
        name: Xq28 (MECP2)
        display_name: Xq28 duplication encompassing MECP2
        subtype_term:
          preferred_term: MECP2 duplication syndrome
          term:
            id: MONDO:0010283
            label: syndromic X-linked intellectual disability Lubs type
        description: 'Duplication spanning MECP2 at Xq28, consistently including L1CAM in the interstitial
          microduplication form. The most frequently reported and best characterised Xq duplication; increased
          MECP2 dosage is the principal driver of the neurodevelopmental phenotype. Rearrangement structures
          are heterogeneous — tandem duplications, terminal duplications (mostly translocations), inverted
          triplications and other complex genomic rearrangements — and this architecture modulates severity.
          Corresponds to the separately curated entry MECP2 Duplication Syndrome (MONDO:0010283).

          '
        genes:
        - preferred_term: MECP2
          term:
            id: hgnc:6990
            label: MECP2
        - preferred_term: L1CAM
          term:
            id: hgnc:6470
            label: L1CAM
      selected_evidence:
        snippet: "Duplication sizes in the cohort ranging from 64.6 kb to 16.5 Mb were \nclassified into\
          \ four categories comprising of tandem duplications (48%), \nterminal duplications (22%), inverted\
          \ triplications (20%), and other CGRs (10%)."
        supports: SUPPORT
    origin:
