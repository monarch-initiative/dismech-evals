        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dosage- and Architecture-Dependent Severity Gradient
        biological_scale: ORGANISM
        description: 'Severity is graded rather than all-or-none, and is set by two partly separable variables:
          the absolute level of MeCP2 (triplication worse than duplication) and the structural class of
          the rearrangement itself. Phenotypic burden — survival, developmental level, microcephaly, epilepsy,
          and genitourinary/eye anomalies — worsens progressively across tandem duplications, other complex
          rearrangements, terminal duplications/translocations, and triplications. Rearrangement structure
          therefore contributes to expression variability independently of copy number alone, plausibly
          through position effects and disruption of regulatory architecture at the breakpoints.

          '
      selected_evidence:
        snippet: "Genotype-phenotype analyses indicated a gradual \nworsening of phenotypic features,\
          \ including overall survival, developmental \nlevels, microcephaly, epilepsy, and genitourinary/eye\
          \ abnormalities in the \nfollowing order: Tandem duplications, Other complex duplications, Terminal\
          \ \nduplications/Translocations, and Triplications encompassing MECP2."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
