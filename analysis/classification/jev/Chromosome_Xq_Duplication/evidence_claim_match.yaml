        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: UNKNOWN
        prevalence_class: NOT_YET_DOCUMENTED
        notes: 'No prevalence estimate exists for Xq duplications as a class. The 2009 review counted
          roughly 40 reported cases of cytogenetically visible Xq28 functional disomy and about 50 cryptic
          MECP2-encompassing duplications; array CGH has since raised ascertainment, but no denominator-based
          estimate has been published for the grouping. A birth-prevalence figure exists only for the
          MECP2 subtype and is recorded on MECP2_Duplication_Syndrome.yaml.

          '
      selected_evidence:
        snippet: "Prevalence of Xq duplications remains unknown. About 40 cases of Xq28 \nfunctional disomy\
          \ due to cytogenetically visible rearrangements, and about 50 \ncases of cryptic duplications\
          \ encompassing the MECP2 gene have been reported."
        supports: SUPPORT
    origin:
