        disease_term:
          preferred_term: sarcoidosis
          term:
            id: MONDO:0019338
            label: sarcoidosis
        description: 'Sarcoidosis is the principal differential and the reason CBD is under-recognised:
          the two are histologically indistinguishable noncaseating granulomatous diseases, and CBD is
          routinely diagnosed as sarcoidosis when an occupational history is not taken. Both entries in
          this knowledge base conform to the same granuloma_formation module; what separates them is the
          beryllium-specific adaptive immune response, not the granuloma itself.'
        distinguishing_features:
        - Beryllium sensitization demonstrable by BeLPT, absent in sarcoidosis
        - Documented occupational or environmental beryllium exposure history
        - Lower lung function and a more frequently restrictive pattern than sarcoidosis
      selected_evidence:
        snippet: Chronic beryllium disease (CBD) is considered a phenocopy of sarcoidosis, generally caused
          by occupational exposure to beryllium.
        supports: SUPPORT
