      assertion_type: Genetic
      assertion:
        name: HLA-DPB1
        gene_term:
          preferred_term: HLA-DPB1
          term:
            id: hgnc:4940
            label: HLA-DPB1
        relationship_type: SUSCEPTIBILITY
        notes: 'HLA-DPB1 alleles encoding a glutamic acid at position 69 of the beta chain (HLA-DPB1 Glu69)
          are the dominant genetic risk factor for beryllium sensitization and chronic beryllium disease.
          The Glu69 acidic pocket coordinates the beryllium cation and is required to present the beryllium-modified
          neoantigen to CD4+ T cells. Higher-affinity Glu69 alleles (e.g. HLA-DPB1*17:01, *02:01) confer
          greater risk, and gene copy/expression level further modulates susceptibility. This is a susceptibility
          locus, not a Mendelian cause: exposure is required for disease.'
      selected_evidence:
        snippet: Among CBD cases, 97 percent expressed the HLA-DPB1*0201-associated glutamic acid (unaffected
          population, 30 percent; P < 0.001) at residue 69
        supports: SUPPORT
    origin:
