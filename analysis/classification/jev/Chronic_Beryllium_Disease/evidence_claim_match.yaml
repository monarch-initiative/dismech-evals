      assertion:
        name: Progressive Pulmonary Fibrosis and Restrictive Lung Disease
        biological_scale: TISSUE
        role: consequence
        conforms_to: granuloma_formation#Tissue Containment versus Destruction and Fibrosis
        description: Because the beryllium stimulus cannot be cleared, the granulomatous response persists
          and, in a subset of patients, drives progressive interstitial fibrosis. Fibroblast recruitment
          and excessive collagen deposition around and between granulomas produce a restrictive ventilatory
          defect with impaired gas exchange, progressive dyspnea, and, in advanced disease, respiratory
          failure and cor pulmonale. This fibrotic end state is the pathological (destructive) arm of
          the granuloma module's containment-versus-destruction consequence.
        cell_types:
        - preferred_term: fibroblast
          term:
