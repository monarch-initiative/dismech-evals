        biological_scale: CELLULAR
        role: amplifier
        description: On re-encounter with beryllium in the lung, the expanded beryllium-specific CD4+
          T cells polarize to a T-helper-1 effector phenotype and secrete interferon-gamma, tumor necrosis
          factor, and interleukin-2. These are predominantly effector-memory Th1 cells that accumulate
          in the bronchoalveolar space, producing the compartmentalized, beryllium-driven Th1 cytokine
          milieu that licenses macrophage activation and granuloma formation. This cytokine output is
          the disease-specific engine upstream of the conserved granuloma-formation amplifier.
