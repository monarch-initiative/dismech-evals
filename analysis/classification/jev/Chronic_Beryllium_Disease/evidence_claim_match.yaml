              label: chronic beryllium disease
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cbd_sensitization_to_disease_progression
        prompt: What determines whether a beryllium-sensitized individual progresses to chronic beryllium
          disease? Beryllium sensitization is necessary but not sufficient for organ disease, yet the
          host, exposure, and immunologic factors that convert the sub-clinical beryllium-specific T-cell
          response into progressive granulomatous lung disease are not defined.
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Beryllium-Specific CD4+ T Cell Sensitization
        - pathophysiology#Noncaseating Granuloma Assembly
        - pathophysiology#Progressive Pulmonary Fibrosis and Restrictive Lung Disease
        rationale: Roughly half of sensitized workers already have CBD at first evaluation, and in longitudinal
          follow-up a substantial minority of the remainder convert to disease over several years, with
          no consistent difference in age, sex, smoking, or measured exposure time between progressors
          and non-progressors. Because the beryllium-specific CD4+ Th1 response is present in both sensitization
          and disease, the step that tips a contained immune response into destructive, fibrosing granulomatous
          inflammation is the central unresolved question - relevant to whether early immunomodulation
          of sensitized but disease-free individuals could prevent CBD.
        proposed_experiments:
        - experiment_id: exp_cbd_progression_immune_biomarkers
          name: Longitudinal immunophenotyping of beryllium-sensitized workers to predict CBD conversion
          description: Prospectively follow a cohort of beryllium-sensitized but disease-free workers
            with serial bronchoalveolar lavage and blood sampling, tracking beryllium-specific CD4+ T-cell
            frequency, effector-memory/regulatory T-cell balance, IFN-gamma/TNF cytokine output, and HLA-DP
            Glu69 allele affinity, to identify immunologic determinants that predict progression to biopsy-proven
            granulomatous CBD versus stable sensitization.
      selected_evidence:
        snippet: Disease developed in 17 sensitized individuals (31%) within an average follow-up period
          of 3.8 years (range, 1.0-9.5 years).
        supports: SUPPORT
    origin:
