      assertion_type: Pathophysiology
      assertion:
        name: Inhaled Beryllium Particle Deposition and Alveolar Macrophage Uptake
        biological_scale: TISSUE
        role: trigger
        conforms_to: granuloma_formation#Persistent Indigestible Stimulus
        description: Inhaled beryllium particles deposit in the distal airways and alveoli, where they
          are taken up by alveolar macrophages and dendritic cells. Beryllium is a poorly soluble, biopersistent
          metal that the macrophage cannot degrade or clear, so it acts as a persistent indigestible stimulus
          that sustains a chronic, rather than self-limited, macrophage response - the disease-specific
          substitution for the generic persistent stimulus of the granuloma module.
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        - preferred_term: dendritic cell
          term:
            id: CL:0000451
            label: dendritic cell
        biological_processes:
        - preferred_term: chronic inflammatory response
          term:
            id: GO:0002544
            label: chronic inflammatory response
          modifier: INCREASED
      selected_evidence:
        snippet: Chronic beryllium disease (CBD) is a fibrotic lung disorder caused by beryllium (Be)
          exposure and is characterized by granulomatous inflammation and the accumulation of Be-responsive
          CD4(+) T cells in the lung.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
