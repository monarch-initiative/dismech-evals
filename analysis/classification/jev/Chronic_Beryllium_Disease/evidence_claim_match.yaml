        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_cbd_hla_dp2_transgenic_mouse_fibrosis
        prompt: Does the HLA-DP2 transgenic mouse model of chronic beryllium disease, which reproduces
          beryllium-specific CD4+ T-cell responses and granulomatous inflammation, also faithfully reproduce
          the progressive interstitial fibrosis that drives human CBD morbidity - or is the fibrotic end
          stage the point of divergence between the animal model and human disease?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Beryllium-Specific CD4+ T Cell Sensitization
        - pathophysiology#Noncaseating Granuloma Assembly
        - pathophysiology#Progressive Pulmonary Fibrosis and Restrictive Lung Disease
        rationale: 'The HLA-DP2 transgenic mouse is the flagship in-vivo model that links the HLA-DP Glu69
          genetic lesion to a beryllium-specific CD4+ T-cell response and granulomatous lung inflammation,
          validating the upstream immunologic arm of the disease. However, the immunologic sensitization/granuloma
          steps are far better recapitulated in the model than the downstream, chronic fibrotic remodeling
          that determines long-term human outcome. Whether the fibrotic consequence node is model-faithful
          is therefore mechanistically important: if murine granulomas resolve or fail to progress to
          human-like fibrosis, the model is well suited to studying antigen recognition and early granuloma
          biology but a weaker platform for testing anti-fibrotic interventions in CBD.'
        proposed_experiments:
        - experiment_id: exp_cbd_dp2_mouse_fibrosis_fidelity
          name: Longitudinal fibrosis phenotyping of beryllium-exposed HLA-DP2 transgenic mice versus
            human CBD
          description: Expose HLA-DP2 transgenic mice to beryllium oxide and follow them longitudinally
            with quantitative histologic fibrosis scoring, hydroxyproline collagen assays, and lung mechanics,
            benchmarking the trajectory against human CBD explant/biopsy fibrosis and pulmonary-function
            decline to determine whether and when the murine model diverges from the human fibrotic end
            stage.
      selected_evidence:
        snippet: Using HLA-DP2 transgenic (Tg) mice, we developed a model of CBD that replicates the major
          features of the human disease.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26129650
      reference_title: Metal-specific CD4+ T-cell responses induced by beryllium exposure in HLA-DP2 transgenic
        mice.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the HLA-DP2 transgenic mouse as a model that replicates the major (chiefly
        immunologic) features of CBD, making the fidelity of its downstream fibrotic phenotype the open
        translational question. Evidence source is MODEL_ORGANISM.
