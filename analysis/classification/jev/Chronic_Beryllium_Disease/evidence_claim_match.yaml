      assertion_type: Environmental
      assertion:
        name: Dermal beryllium exposure
        description: Skin contact with beryllium-containing particles is a second route to sensitization,
          distinct from inhalation. It is the route that explains why falling airborne beryllium concentrations
          have not produced a matching fall in sensitization and disease, and it is why contemporary worker
          protection targets skin as well as inhalation exposure.
        exposure_term:
          preferred_term: dermal beryllium exposure
          term:
            id: ECTO:9000941
            label: exposure to beryllium
        notes: ECTO has no route-specific dermal beryllium exposure term, so this entry reuses the substance-level
          term ECTO:9000941 and carries the route in the name and description. Binding a route-specific
          term would mean inventing one.
      selected_evidence:
        snippet: Reduction in inhalation exposure to beryllium has not resulted in a concomitant reduction
          in the occurrence of beryllium sensitization or CBD, suggesting that continued prevalence may
          be due, in part, to unchecked skin exposure to beryllium-containing particles.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16231190
      reference_title: 'Beryllium exposure: dermal and immunological considerations.'
      evidence_source: OTHER
      explanation: 'The epidemiological observation motivating a distinct dermal route: the inhalational
