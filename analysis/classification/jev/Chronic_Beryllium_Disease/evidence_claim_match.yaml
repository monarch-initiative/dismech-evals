        biological_scale: CELLULAR
        role: mechanism
        description: Recognition of the HLA-DP/Glu69-presented beryllium neoantigen by the T-cell receptor
          of naive CD4+ T cells drives their clonal expansion into a beryllium-specific memory/effector
          population. This antigen-driven expansion is beryllium sensitization (BeS), the immunological
          state that precedes organ disease and is measured clinically by the beryllium lymphocyte proliferation
          test (BeLPT), in which a patient's blood or lung lymphocytes proliferate on exposure to beryllium
          salts in vitro. Sensitization is necessary but not sufficient for CBD.
        cell_types:
        - preferred_term: beryllium-specific CD4+ T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
