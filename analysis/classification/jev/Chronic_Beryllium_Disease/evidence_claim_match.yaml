            label: T cell proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: Chronic beryllium disease (CBD) is a lung disorder related to beryllium exposure and
          is characterized by the accumulation in the lung of beryllium-specific CD4+ major histocompatibility
          complex (MHC) class II-restricted T lymphocytes.
        supports: SUPPORT
