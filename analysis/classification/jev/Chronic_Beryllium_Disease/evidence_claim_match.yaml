        biological_scale: MOLECULAR
        role: mechanism
        description: Within the antigen-presenting cell, ionic beryllium (Be2+) is incorporated into the
          peptide-binding groove of HLA-DP class II molecules, coordinating with acidic residues of the
          HLA-DP beta chain and a bound self-peptide. Rather than acting as a classical hapten that modifies
          a protein covalently, beryllium is buried at the interface between the HLA-DP molecule and the
          peptide, altering the surface chemistry and conformation of the peptide-MHC complex so that
          it is seen as a neoantigen. This creates the antigenic determinant that beryllium-specific T
          cells recognize.
        cell_types:
        - preferred_term: dendritic cell
          term:
            id: CL:0000451
            label: dendritic cell
        biological_processes:
        - preferred_term: antigen processing and presentation of peptide antigen via MHC class II
          term:
            id: GO:0002495
            label: antigen processing and presentation of peptide antigen via MHC class II
          modifier: INCREASED
      selected_evidence:
        snippet: the T cell ligand is created when a Be(2+) cation becomes buried in an HLA-DP2/peptide
          complex, where it is coordinated by both MHC and peptide acidic amino acids.
        supports: SUPPORT
