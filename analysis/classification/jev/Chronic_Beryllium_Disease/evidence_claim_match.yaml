      assertion_type: Pathophysiology
      assertion:
        name: HLA-DP Glu69-Restricted Antigen Presentation
        biological_scale: MOLECULAR
        role: mechanism
        description: Presentation of the beryllium-modified neoantigen is restricted to HLA-DP molecules
          whose beta chain carries a glutamic acid (a negatively charged residue) at position 69 (HLA-DPB1
          Glu69, e.g. HLA-DPB1*02:01, *06:01, *17:01). The Glu69 residue lines an acidic pocket that is
          required to coordinate the positively charged beryllium cation; HLA-DP molecules lacking Glu69
          cannot bind beryllium and do not present it. This single genetic feature explains the dominant
          heritable susceptibility to sensitization and disease and is the molecular basis of the gene-environment
          interaction.
        cell_types:
        - preferred_term: dendritic cell
          term:
            id: CL:0000451
            label: dendritic cell
        biological_processes:
        - preferred_term: antigen processing and presentation of peptide antigen via MHC class II
          term:
            id: GO:0002495
            label: antigen processing and presentation of peptide antigen via MHC class II
          modifier: INCREASED
      selected_evidence:
        snippet: an unusual solvent exposed acidic pocket formed between the peptide backbone and the
          HLA-DP2 beta-chain alpha-helix and containing three glutamic acids from the beta-chain, including
          betaGlu69
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
