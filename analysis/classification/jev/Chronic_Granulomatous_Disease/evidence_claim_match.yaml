        description: 'The most common form (about two-thirds of cases), caused by hemizygous pathogenic
          variants in CYBB at Xp21.1, encoding gp91phox (NOX2), the catalytic membrane subunit. Typically
          the most severe form with earliest onset. A larger deletion extending into the neighbouring
          XK/Kell locus can additionally produce McLeod neuroacanthocytosis syndrome, curated separately
          in kb/disorders/McLeod_Neuroacanthocytosis_Syndrome.yaml. OMIM phenotype: 306400 (MONDO:0010600).'
        genes:
        - preferred_term: CYBB
