              label: chronic granulomatous disease
        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: phagocyte defect
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 5 "Congenital
          defects of phagocyte number or function", section 3 (Defects of Respiratory Burst). This entry
          covers all six Table 5 respiratory-burst rows, one per NADPH oxidase component, and its has_subtypes
          list matches them exactly: CYBB (XL, MIM 306400), CYBA (AR, MIM 608508), CYBC1/EROS (AR, MIM
          618334), NCF1 (AR, MIM 608512), NCF2 (AR, MIM 608515) and NCF4 (AR, MIM 613960). The affected
          function is killing through faulty O2- production, on the functional rather than the quantitative
          axis of the table: phagocytes are present in normal numbers and cannot kill.

          The seventh row of that section, G6PD deficiency class I (MIM 305900), is a separate disease
          and is not covered here.'
      selected_evidence:
        snippet: X-linked chronic granulomatous disease (CGD), gp91phox CYBB XL 306400
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
      evidence_path: /classifications/iuis_category/evidence/1
