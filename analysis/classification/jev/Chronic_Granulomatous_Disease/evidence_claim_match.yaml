      assertion_type: Pathophysiology
      assertion:
        name: Failed respiratory burst and ROS deficiency
        conforms_to: phagocyte_oxidative_burst_failure#Failed Respiratory Burst and Phagosomal ROS Deficiency
        description: The assembled NADPH oxidase normally catalyzes the respiratory (oxidative) burst,
          reducing molecular oxygen to superoxide, which is dismutated and converted to hydrogen peroxide,
          hypohalous acids, and other reactive oxygen species within the phagosome. In CGD this burst
          is absent or markedly reduced, so phagocytes ingest microbes but fail to generate the oxidants
          required for efficient microbicidal activity.
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        biological_processes:
        - preferred_term: respiratory burst
          term:
            id: GO:0045730
            label: respiratory burst
          modifier: DECREASED
        - preferred_term: reactive oxygen species metabolic process
          term:
            id: GO:0072593
            label: reactive oxygen species metabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: resulting from impaired killing of bacteria and fungi
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22876374
      reference_title: Chronic Granulomatous Disease.
      evidence_source: OTHER
      explanation: The oxidase defect produces impaired phagocyte killing of bacteria and fungi via loss
