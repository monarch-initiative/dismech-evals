            term:
              id: HP:0001417
              label: X-linked inheritance
      selected_evidence:
        snippet: biallelic pathogenic variants in CYBA, CYBC1, NCF1, NCF2, and NCF4 cause autosomal recessive
          CGD; pathogenic variants in CYBB cause X-linked CGD.
        supports: SUPPORT
