      reference_title: 'Intravenous immunoglobulin in chronic inflammatory demyelinating polyradiculoneuropathy
        (CIDP): mechanisms of action and clinical and genetic considerations.'
      explanation: Indirect and therapeutic-inference only. Downregulation of macrophage activation is
        listed as one of several proposed IVIg mechanisms -- alongside anti-idiotypic, FcRn, anti-complement,
        and FcγRIIB effects -- so the review does not establish macrophage myelin stripping as the pathogenic
        mechanism, only as a plausible therapeutic target among others.
