      assertion_type: Pathophysiology
      assertion:
        name: Daytime Impairment and Downstream Health Risk
        description: The clinical endpoint, and the reason insomnia matters beyond the night. Daytime
          impairment is a diagnostic requirement, not an optional consequence. Beyond it, Mendelian randomisation
          in the large genetic study identified causal effects of insomnia on depression, diabetes, and
          cardiovascular disease - which is a stronger form of evidence than the observational associations
          usually cited, because it is less vulnerable to reverse causation, and matters most for depression,
          where the direction of effect has long been contested. It should still be read as a genetic-instrument
          inference and not as a demonstrated clinical effect of treating insomnia.
        role: consequence
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Mendelian randomization identified the causal effects of insomnia on depression, diabetes,
          and cardiovascular disease, and the protective effects of educational attainment and intracranial
          volume.
        supports: SUPPORT
    origin:
