      assertion_type: Diagnosis
      assertion:
        name: Polysomnography only to exclude another disorder
        description: Polysomnography is not indicated for uncomplicated chronic insomnia and does not
          establish the diagnosis. It is used to exclude a comorbid sleep disorder - sleep-disordered
          breathing, periodic limb movements - when clinical features suggest one, or when the patient
          has not responded to adequate treatment. Expect a discrepancy between recorded and reported
          sleep if it is performed; that gap is characteristic of the disorder rather than evidence against
          it.
      selected_evidence:
        snippet: Primary insomnia is defined as difficulties in falling asleep, maintaining sleep or non-restorative
          sleep accompanied by significantly impaired daytime functioning in the absence of a specific
          physical, mental or substance-related cause.
        supports: SUPPORT
