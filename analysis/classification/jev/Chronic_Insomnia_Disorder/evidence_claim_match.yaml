  60ed2a3078e26356a266c84191fd9aab53fd92ce2628fb3ebf268dc0e7d4b193:
    claim:
      about:
        disease:
          name: Chronic Insomnia Disorder
          disease_term:
            preferred_term: insomnia
            term:
              id: MONDO:0013600
              label: insomnia
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Clinical diagnosis against explicit criteria, with a sleep diary
        description: 'Chronic insomnia disorder is a clinical diagnosis: persistent difficulty initiating
          or maintaining sleep with significant daytime impairment, despite adequate opportunity, for
          at least three months. A prospective sleep diary over one to two weeks is the core instrument.
          Which criteria are applied matters more here than in most disorders - see the prevalence record,
          where four standard criteria sets applied to the same 21,083-person cohort gave prevalences
          from 8.5% to 23.6%, the difference driven largely by whether daytime impairment is adequately
