  e363ed675251802dab59d85cea6ec67bf56f10ac282e8ca2de7c0aa24d7cbc98:
    claim:
      about:
        disease:
          name: Chronic Insomnia Disorder
          disease_term:
            preferred_term: insomnia
            term:
              id: MONDO:0013600
              label: insomnia
        context: []
      assertion_type: Genetic
      assertion:
        name: Polygenic architecture (202 loci, no established single gene)
        notes: 'Insomnia is substantially heritable but has no Mendelian form and no established causal
          gene. The largest genome-wide analysis - 1,331,010 individuals - identified 202 loci implicating
          956 genes through positional, eQTL, and chromatin mapping, and the meta-analysis explained 2.6%
          of the variance. Curated as an architecture rather than as a gene list because no individual
          locus is established as causal and none is clinically actionable. The informative signal is
          where the enrichment sits: cortical and subcortical tissue and striatal, hypothalamic, and claustrum
          neurons, with considerable genetic correlation to psychiatric traits - which is what locates
          the vulnerability in emotion-arousal rather than sleep-regulatory circuits.'
        relationship_type: SUSCEPTIBILITY
      selected_evidence:
        snippet: We identify 202 loci implicating 956 genes through positional, expression quantitative
          trait loci, and chromatin mapping.
        supports: SUPPORT
