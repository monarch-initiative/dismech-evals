  42af84a8dec2a2ece3bf4a0b213979016c7501ae020a3396fd6fa50a05bb33b1:
    claim:
      about:
        disease:
          name: Chronic Insomnia Disorder
          disease_term:
            preferred_term: insomnia
            term:
              id: MONDO:0013600
              label: insomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Perpetuating Behavioural and Cognitive Responses
        description: 'A learned arm, and the one that turns an episode into a disorder. Once sleep has
          been disturbed, people respond in ways that are individually reasonable and collectively counterproductive:
          extending time in bed to "catch up", which dilutes sleep across a longer window and weakens
          the bed-sleep association; napping; monitoring the clock; and developing sleep-related worry
          and rumination that raise arousal precisely at bedtime. These perpetuating factors are why chronic
          insomnia frequently outlives the precipitant that started it, and - crucially - they are the
          specific targets of cognitive-behavioural therapy, which is why the most effective treatment
          for this disorder acts on the learned arm rather than on the physiological one.'
        role: amplifier
        biological_scale: ORGANISM
      selected_evidence:
        snippet: primary insomnia may be conceptualized as a final common pathway resulting from the interplay
          between a genetic vulnerability for an imbalance between arousing and sleep-inducing brain activity,
          psychosocial/medical stressors and perpetuating mechanisms
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19481481
      reference_title: 'The hyperarousal model of insomnia: a review of the concept and its evidence.'
      evidence_source: OTHER
      explanation: Establishes the three-part structure this entry's pathophysiology follows - vulnerability,
        stressor, and perpetuation - and frames the disorder as a final common pathway rather than a single
        lesion.
