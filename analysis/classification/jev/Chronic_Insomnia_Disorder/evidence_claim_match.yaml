  4358f736cfb25d4530b2720c5d1aea23dbe6cdeb3cc18d2d9f7fcb5c8cabac9f:
    claim:
      about:
        disease:
          name: Chronic Insomnia Disorder
          disease_term:
            preferred_term: insomnia
            term:
              id: MONDO:0013600
              label: insomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Persistent 24-Hour Physiological Hyperarousal
        description: 'The central effector and the disorder''s best-established abnormality. Elevated
          arousal is demonstrable across independent measurement domains - autonomic, neuroendocrine,
          neuroimmunological, electrophysiological, and neuroimaging - and the convergence across modalities
          is what makes it robust rather than any single finding. Its critical property is temporal: arousal
          is elevated during the day as well as at night. That distinguishes insomnia sharply from sleep
          deprivation, which produces daytime sleepiness, and explains the characteristic complaint of
          exhaustion without the ability to nap. A specific circuit-level account has been proposed -
          a locus coeruleus that is abnormally sensitive to, or abnormally driven by, salience-network
          input, remaining responsive even during REM sleep when it should be silent, so that the overnight
          adaptation to emotional distress that REM sleep normally provides fails and distress accumulates.'
        role: central_effector
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: regulation of the sleep/wake cycle
          term:
            id: GO:0042749
            label: regulation of circadian sleep/wake cycle
          modifier: ABNORMAL
      selected_evidence:
        snippet: Autonomous, neuroendocrine, neuroimmunological, electrophysiological and neuroimaging
          studies demonstrate increased levels of arousal in primary insomnia during both night and daytime.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19481481
      reference_title: 'The hyperarousal model of insomnia: a review of the concept and its evidence.'
      evidence_source: OTHER
      explanation: Gives both the multi-modal convergence and the 24-hour character, which are the two
        properties this node rests on.
