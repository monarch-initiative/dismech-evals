  813b5da50d1b32eeb0de8efc8ab838d681fb86bc65b07593ae2e6227e4d205aa:
    claim:
      about:
        disease:
          name: Chronic Insomnia Disorder
          disease_term:
            preferred_term: insomnia
            term:
              id: MONDO:0013600
              label: insomnia
        context: []
      assertion_type: Treatment
      assertion:
        name: Dual Orexin Receptor Antagonist (Suvorexant)
        description: 'A hypnotic that reduces arousal drive by blocking orexin receptors, rather than
          by potentiating GABA-A as the benzodiazepine-receptor agonists do. It acts on the arousal node,
          which is the node the hyperarousal framework makes central, and is the pharmacological class
          best matched to that framework. Curated with an explicit caution: its efficacy does NOT indicate
          an orexin abnormality in these patients, and this entry does not conform to the orexin module
          on the strength of it. It reduces sleep-onset latency and increases sleep duration objectively
          and subjectively, with somnolence the commonest adverse effect and no strong rebound or withdrawal
          signal.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: suvorexant
            term:
              id: CHEBI:82698
              label: suvorexant
      selected_evidence:
        snippet: Suvorexant was shown to decrease sleep onset times and increase sleep duration, whether
          assessed objectively by polysomnography or subjectively by sleep diaries in primary insomnia
          patients.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/1
