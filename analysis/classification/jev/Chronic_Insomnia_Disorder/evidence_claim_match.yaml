      assertion_type: Treatment
      assertion:
        name: Cognitive Behavioural Therapy for Insomnia
        description: 'First-line treatment, and mechanistically the best-matched: its components - sleep
          restriction, stimulus control, cognitive therapy, relaxation, sleep hygiene - map directly onto
          the perpetuating node, dismantling the learned associations and compensatory behaviours rather
          than sedating the arousal. Meta-analysis of randomised trials against inactive comparators shows
          clinically meaningful improvements in sleep-onset latency, wake after sleep onset, and sleep
          efficiency, with benefit sustained at later timepoints and no adverse outcomes reported - a
          profile no hypnotic matches. Note the trade-off the same data reveal: total sleep time improved
          by only about eight minutes and not significantly, so the treatment works by consolidating and
          re-associating sleep rather than by producing more of it.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: Behavioral counseling
          term:
            id: NCIT:C181743
            label: Behavioral Counseling
      selected_evidence:
        snippet: CBT-i is an effective treatment for adults with chronic insomnia, with clinically meaningful
          effect sizes.
        supports: SUPPORT
