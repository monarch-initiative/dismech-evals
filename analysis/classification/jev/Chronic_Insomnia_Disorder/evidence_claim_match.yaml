  9dbaefee3c915ff394eb72b0a13cc9f952922c776fec7524a11b869e1d5a1d82:
    claim:
      about:
        disease:
          name: Chronic Insomnia Disorder
          disease_term:
            preferred_term: insomnia
            term:
              id: MONDO:0013600
              label: insomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Sleep Initiation and Maintenance
        description: 'The presenting abnormality: prolonged sleep-onset latency, wakefulness after sleep
          onset, early-morning awakening, or non-restorative sleep, in any combination and typically shifting
          between them over time. It is a failure of sleep against adequate opportunity, which is what
          separates it from insufficient sleep syndrome - the commonest cause of unrefreshing sleep in
          the population and not this disorder. A persistent discrepancy between subjective and objective
          measures is characteristic, with patients consistently reporting worse sleep than polysomnography
          records, and this is a feature of the disorder rather than an artefact to be corrected: it is
          consistent with the hyperarousal framework, in which cortical arousal persists into physiologically
          scored sleep.'
        role: effector
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: sleep
          term:
            id: GO:0030431
            label: sleep
          modifier: DECREASED
      selected_evidence:
        snippet: Primary insomnia is defined as difficulties in falling asleep, maintaining sleep or non-restorative
          sleep accompanied by significantly impaired daytime functioning in the absence of a specific
          physical, mental or substance-related cause.
        supports: SUPPORT
    origin:
