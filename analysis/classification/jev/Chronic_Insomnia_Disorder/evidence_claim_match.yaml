            term:
              id: MONDO:0013600
              label: insomnia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Predisposing Vulnerability in Emotion and Arousal Circuits
        description: The trigger arm, and the level at which the disorder's causes actually sit. Insomnia
          is substantially heritable, and the largest genome-wide analysis - over 1.3 million individuals,
          202 loci - shows enrichment not in circadian or homeostatic sleep machinery but in cortical
          and subcortical tissues and in striatal, hypothalamic, and claustrum neurons, with considerable
          genetic correlation with psychiatric traits. Early-life stress, major life events, and brain
          structural and functional variation contribute alongside. The integrated reading is that vulnerability
          lies in circuits regulating emotion and arousal rather than in circuits regulating sleep itself
          - which reframes insomnia as a disorder of arousal regulation that manifests during sleep, rather
          than as a disorder of sleep.
        role: trigger
        biological_scale: ORGANISM
      selected_evidence:
        snippet: We show gene set enrichments for the axonal part of neurons, cortical and subcortical
          tissues, and specific cell types, including striatal, hypothalamic, and claustrum neurons.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30804565
      reference_title: Genome-wide analysis of insomnia in 1,331,010 individuals identifies new risk loci
        and functional pathways.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies the implicated cell types, which are notably not the classical sleep-switch
        nuclei - the observation that motivates locating vulnerability in arousal and emotion circuits.
