  6e54effcd11aeaf4331725f96d959f47fdbd95edd76619c1f7be5d0329f7beec:
    claim:
      about:
        disease:
          name: Chronic Intestinal Pseudoobstruction
          disease_term:
            preferred_term: chronic intestinal pseudoobstruction
            term:
              id: MONDO:0017574
              label: chronic intestinal pseudoobstruction
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Thymidine Phosphorylase Deficiency and Mitochondrial DNA Instability
        description: 'The mitochondrial arm of CIPO begins one step further back than the neuropathic
          and myopathic arms: biallelic loss of TYMP removes thymidine phosphorylase, the cytosolic enzyme
          that catabolises thymidine and deoxyuridine. Those nucleosides then accumulate systemically,
          the mitochondrial deoxyribonucleoside-triphosphate pools they feed become imbalanced, and mitochondrial
          DNA acquires multiple deletions, depletion and site-specific point mutations. The step from
          imbalanced dNTP pools to the mtDNA lesion is a hypothesis the field has not closed: the founding
          review states the exact mechanism remains unknown, so the edge out of this node is recorded
          as indirect with an unknown intermediate rather than as a direct one.'
        genes:
        - preferred_term: TYMP
          term:
            id: hgnc:3148
            label: TYMP
        cell_types:
        - preferred_term: enteric smooth muscle cell
          term:
            id: CL:0002504
            label: enteric smooth muscle cell
        molecular_functions:
        - preferred_term: thymidine phosphorylase activity
          modifier: DECREASED
          term:
            id: GO:0009032
            label: thymidine phosphorylase activity
        biological_processes:
        - preferred_term: mitochondrial DNA replication
          modifier: ABNORMAL
          term:
            id: GO:0006264
            label: mitochondrial DNA replication
        chemical_entities:
        - preferred_term: thymidine
          modifier: INCREASED
          term:
            id: CHEBI:17748
            label: thymidine
        locations:
        - preferred_term: intestine
          term:
            id: UBERON:0000160
            label: intestine
      selected_evidence:
        snippet: "The accumulation of nucleosides also causes imbalances in mitochondrial DNA \n(mtDNA)\
          \ deoxyribonucleoside triphosphates (dNTPs), which may play a direct or \nindirect role in the\
          \ mtDNA depletion/deletion abnormalities, although the exact \nunderlying mechanism remains\
          \ unknown."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/2
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28261062
      reference_title: 'Mitochondrial Neurogastrointestinal Encephalomyopathy Caused by Thymidine Phosphorylase
        Enzyme Deficiency: From Pathogenesis to Emerging Therapeutic Options.'
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the dNTP-pool imbalance step and is also the source for this node's statement
        that the mechanism linking it to the mtDNA lesion is not settled.
    first_seen_at: '2026-09-25T15:33:59.470500+00:00'
