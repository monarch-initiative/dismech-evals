        variant_origin: GERMLINE
        subtype: Myopathic
        notes: 'ACTG2 encodes enteric smooth muscle gamma-2 actin and is one of the most commonly identified
          genes when a CIPO patient proves to have a familial or sporadic visceral myopathy. The cited
          source says "one of the most common disease-causing genes"; this record does not upgrade that
          to "the most common". It sits on a clinical continuum with megacystis-microcolon-intestinal
          hypoperistalsis syndrome, which dismech curates separately; the MMIHS2 entry covers the MYH11
          form of that continuum. Before this record, ACTG2 was named in prose and in snippets but bound
          nowhere in `kb/` (`git grep ''id: hgnc:145$'' <base> -- kb/` returns nothing), which is exactly
          the invisibility the genetics-gap campaign measures: a gene a reader can see and a knowledge-graph
          comparison cannot. No ClinGen validity classification is recorded here because the gene-validity
          CSV committed in this repository has no ACTG2 row (`grep ''"ACTG2",'' cache/clingen/gene_validity.csv`
