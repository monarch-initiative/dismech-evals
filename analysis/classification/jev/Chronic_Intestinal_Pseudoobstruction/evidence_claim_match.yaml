      assertion_type: Pathophysiology
      assertion:
        name: Smooth Muscle Contractile Failure
        description: Myopathic CIPO arises from intrinsic smooth-muscle defects of the intestinal wall
          — poorly contractile or acontractile smooth muscle that cannot generate the propulsive contractions
          needed for peristalsis, regardless of the integrity of the enteric nervous system. Familial
          and sporadic visceral myopathies, as well as mitochondrial bioenergetic failure of smooth muscle
          in MNGIE, feed this node.
        genes:
        - preferred_term: ACTG2
          term:
            id: hgnc:145
            label: ACTG2
        cell_types:
        - preferred_term: enteric smooth muscle cell
          term:
            id: CL:0002504
            label: enteric smooth muscle cell
        biological_processes:
