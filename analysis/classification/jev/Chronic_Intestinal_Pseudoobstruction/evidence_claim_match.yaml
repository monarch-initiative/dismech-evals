          modifier: DECREASED
          term:
            id: GO:0006939
            label: smooth muscle contraction
        locations:
        - preferred_term: intestine
          term:
            id: UBERON:0000160
            label: intestine
      selected_evidence:
        snippet: exome sequencing revealed an Arg148Ser mutation in the enteric smooth muscle actin gamma
          2 (ACTG2) gene
        supports: SUPPORT
