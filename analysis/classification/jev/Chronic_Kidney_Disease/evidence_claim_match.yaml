  2b35ae1e68f87c015acf1b19574cdaeb00f0f21c56f6915f96223c33b38cb40d:
    claim:
      about:
        disease:
          name: Chronic Kidney Disease
          disease_term:
            preferred_term: chronic kidney disease
            term:
              id: MONDO:0005300
              label: chronic kidney disease
        context: []
      assertion_type: Biochemical
      assertion:
        name: NMR metabolomic risk score (MetRS)
        specificity: 'A research composite, not a clinical assay. MetRS is a machine-learning score built
          from the top 30 of 313 Nightingale Health NMR plasma measures, derived and replicated in UK
          Biobank. It does not replace eGFR and albuminuria, which define and stage chronic kidney disease.

          '
        context: 'In the UK Biobank metabolome-phenome atlas, MetRS classified prevalent chronic kidney
          disease with an area under the curve of 0.933, one of the four highest diagnostic figures the
          source reports. No presence value is recorded because MetRS is a derived multi-analyte score
          rather than a measured analyte. Creatinine is itself among the panel''s measures and is reported
          as one of the highest-ranking metabolites across all diseases, so the classification performance
          is not independent of the analyte that defines the diagnosis; the score should be read as recovering
          the known biochemical picture of reduced clearance rather than as adding a novel marker. The
          cohort is a single, predominantly European-ancestry volunteer population.

          '
        readouts:
        - target: Nephron Loss
          relationship: CORRELATES_WITH
          direction: POSITIVE
          endpoint_context: DIAGNOSTIC
          interpretation: 'The score is dominated by measures that accumulate or shift as glomerular filtration
            falls, so it reads out the systemic consequence of nephron loss rather than any single upstream
            mechanism.

            '
      selected_evidence:
        snippet: the highest ranking of GlycA and creatinine across all diseases demonstrated their critical
          diagnostic and predictive values
        supports: SUPPORT
