          accumulates in proximal tubular epithelial cells and causes mitochondrial proximal tubular injury
          (Fanconi-type tubulopathy and glomerular filtration rate decline) - a recognized iatrogenic
          contributor to CKD in people on long-term antiretroviral therapy.
