        biological_scale: MOLECULAR
        description: Profibrotic stimulation of kidney interstitial fibroblasts engages IL11RA1-mediated,
          ERK-dependent autocrine IL-11 signalling that drives their myofibroblast conversion and fibrogenic
          protein synthesis. This IL-11 receptor-signalling arm is an organ-specific instance of the conserved
          IL-11 signalling module and feeds tubulointerstitial fibrosis; IL-11 pathway antagonism reduces
          renal fibrosis in vivo.
        locations:
        - preferred_term: Kidney
          term:
            id: UBERON:0002113
            label: kidney
        cell_types:
        - preferred_term: Kidney interstitial fibroblast
          term:
            id: CL:1000692
            label: kidney interstitial fibroblast
        biological_processes:
        - preferred_term: Interleukin-11-mediated signaling pathway
          term:
            id: GO:0038154
            label: interleukin-11-mediated signaling pathway
          modifier: INCREASED
        - preferred_term: ERK1 and ERK2 cascade
          term:
            id: GO:0070371
            label: ERK1 and ERK2 cascade
          modifier: INCREASED
      selected_evidence:
        snippet: In mice, fibroblast-specific Il11 transgene expression or Il-11 injection causes heart
          and kidney fibrosis and organ failure, whereas genetic deletion of Il11ra1 protects against
          disease.
        supports: SUPPORT
