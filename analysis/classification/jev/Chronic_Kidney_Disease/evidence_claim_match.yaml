        notes: Modifiable behavioural exposure named alongside hyperglycemia and blood pressure in this
          entry's mechanistic hypotheses and proposed experiments. The same meta-analysis reports a null
          smoking-proteinuria association in the general population, so the effect is not curated as acting
          through albuminuria.
