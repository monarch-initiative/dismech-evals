            term:
              id: MONDO:0017297
              label: chronic lymphocytic inflammation with pontine perivascular enhancement responsive
                to steroids
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Revised upward from the impression the founding cohort gives. Across the whole published
          literature the relapse rate is 59.2% and overall mortality is 10%, rising to 30% in the patients
          whose CLIPPERS is associated with malignancy. Every reported patient worsens when corticosteroids
          are withdrawn, so treatment is indefinite with the cumulative toxicity that implies, and repeated
          untreated attacks produce brainstem and cerebellar atrophy with permanent disability. A tenth
          of patients dying, in a condition usually described as steroid-responsive, is what places this
          at HIGH rather than MODERATE.
      selected_evidence:
        snippet: The overall mortality rate was 10%, but mortality in patients with malignancy was 30%
          and it was 12% in patients with relapses.
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
      evidence_path: /clinical_burden/evidence/0
