        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Long-term course
        notes: 'Relapsing-remitting, with no progressive phase described. Disability therefore accrues
          stepwise from the severity of individual relapses rather than accumulating between them, and
          the patients who ended with a high residual score are the ones who had had severe relapses and
          who show brainstem and spinal cord atrophy on imaging. This is the structural reason the entry
          treats delayed or withheld treatment as the thing that determines outcome: the one untreated
          patient in the series reached a score of 10.'
      selected_evidence:
        snippet: Four patients with a final EDSS score of 4 or higher had experienced previous severe
          relapses (EDSS score, ≥5) and brainstem and spinal cord atrophy.
        supports: SUPPORT
