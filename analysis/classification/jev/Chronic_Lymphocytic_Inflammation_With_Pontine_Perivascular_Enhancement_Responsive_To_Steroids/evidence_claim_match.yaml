          value:
            name: Impaired Cytotoxic Lymphocyte Granule-Mediated Killing
            description: 'Present in a genetic subgroup rather than in every patient. Roughly a third
              of adult CLIPPERS patients tested carry biallelic mutations in primary HLH genes - PRF1,
              whose product perforin punctures the target-cell membrane, or UNC13D, whose product Munc13-4
              is required one step earlier for cytotoxic granule fusion. Both lesions converge on the
              same failure: cytotoxic lymphocytes cannot kill. The proposed consequence is that antigen-bearing
              target cells are not cleared, so the T cell response against them persists instead of resolving
              - which would make the chronic perivascular infiltrate a consequence of failed killing rather
              than of excessive activation.

              Two things keep this node hypothetical rather than established. None of the mutated patients
              met systemic HLH criteria, so this is not simply HLH presenting in the brain. And three
              of the four went on to show findings atypical for CLIPPERS, one developing systemic non-Hodgkin
              lymphoma - which leaves open whether they had CLIPPERS at all.

              '
            biological_scale: CELLULAR
