        kind: KNOWLEDGE_GAP
        prompt: Is CLIPPERS a single disease entity, or a syndrome that collects several overlapping diseases
          and the prodromal phases of some of them - CNS lymphoma in particular?
        attaches_to:
        - disease#Chronic Lymphocytic Inflammation With Pontine Perivascular Enhancement Responsive To
          Steroids
        rationale: 'This question was raised in print by the authors of the first fatal case and has not
          been settled. Patients meeting the full clinical, radiological and histopathological definition
          have gone on to biopsy-confirmed lymphomatoid granulomatosis and fatal CNS B-cell lymphoma,
          in one case after seven months of reliable steroid response. The 2017 criteria sharpened the
          boundary but were derived from a cohort with a median follow-up of 44 months, and the concern
          is specifically about what declares itself later than that. The entity question bears directly
          on how this entry should be read: if CLIPPERS is partly a prodrome, then the pathograph above
          describes a common final inflammatory pattern rather than a disease mechanism.'
      selected_evidence:
