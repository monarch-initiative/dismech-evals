        description: 'The earliest event anyone has observed. Biopsy of affected brainstem white matter
          shows a dense perivascular infiltrate dominated by CD3-positive T lymphocytes, with mild B-lymphocyte
          and moderate macrophage components, present in meninges and in both white and grey matter. Granulomas,
          organisms, lymphoma and vasculitis are absent, which is what distinguishes the finding rather
          than what explains it. What recruits these cells, and against what, is unknown - see the knowledge
          gap attached to this node.

          The T-cell predominance in this node''s name is the finding of the founding and criteria-defining
          cohorts, and it is contested: a six-patient Chinese series found the infiltrate dominated by
          CD20-positive B cells in three of the four biopsies that showed an infiltrate at all. The node
          keeps its name because the larger cohorts support it, but the lineage should be read as the
          majority finding rather than a settled one. The contradiction is recorded as a REFUTE item below
          and in the clippers_infiltrate_lineage_contested discussion.

          '
