  c745ddb8306c74731334440ee1826532a336c1eb39e768357640bf4c03dfd1bb:
    claim:
      about:
        disease:
          name: Chronic Lymphocytic Inflammation With Pontine Perivascular Enhancement Responsive To Steroids
          disease_term:
            preferred_term: chronic lymphocytic inflammation with pontine perivascular enhancement responsive
              to steroids
            term:
              id: MONDO:0017297
              label: chronic lymphocytic inflammation with pontine perivascular enhancement responsive
                to steroids
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: clippers_infiltrate_lineage_contested
        kind: KNOWLEDGE_GAP
        prompt: Is the perivascular infiltrate in CLIPPERS T-cell dominant, as the founding and criteria-defining
          cohorts report, or can it be B-cell dominant?
        attaches_to:
        - pathophysiology#Perivascular T-Lymphocytic Infiltration of Brainstem White Matter
        rationale: 'The disease''s histopathological signature, and the name of the node it occupies in
          this entry, is a perivascular CD3-positive T-lymphocytic infiltrate. A six-patient series from
          mainland China reports the opposite in most of its biopsies: of four patients with an infiltrate,
          one was CD3-dominant and three were CD20-dominant, and the authors state the generalisation
          rather than leaving it as a local observation.

          Both readings cannot be the disease''s typical histology, and the difference is not cosmetic.
          A B-cell-dominant infiltrate would sit differently against the entity-versus-syndrome question
          recorded separately in this entry, since the lymphomas that have declared themselves in CLIPPERS
          patients have been B-cell lymphomas. It would also change which maintenance agent the mechanism
          argues for.

          This entry keeps the T-cell node because the larger and criteria-defining cohorts support it
          and because the downstream pathograph - barrier breakdown, tissue injury, brainstem dysfunction
          - is unaffected either way, but it does not present the lineage as settled. Resolving it needs
          a re-read of archived biopsies under one staining protocol rather than another case series.'
      selected_evidence:
        snippet: among whom only 1 patient was dominated by CD3+ T cell infiltration and the other 3 patients
          were dominated by CD20+ B cell infiltration
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33498046
      reference_title: 'Increased Number of Perivascular CD20-Positive B Lymphocytes in the Neuropathology
        of CLIPPERS: Findings of 6 Patients from Mainland China.'
      evidence_source: HUMAN_CLINICAL
      explanation: Gives the split this discussion is about, with the denominator, in one sentence.
