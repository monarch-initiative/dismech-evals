  f10b9d5acfe64de4872160ffa4d546ed9fcccd73e64e2f0a81d2b0bd8fe74c9e:
    claim:
      about:
        disease:
          name: Chronic Lymphocytic Inflammation With Pontine Perivascular Enhancement Responsive To Steroids
          disease_term:
            preferred_term: chronic lymphocytic inflammation with pontine perivascular enhancement responsive
              to steroids
            term:
              id: MONDO:0017297
              label: chronic lymphocytic inflammation with pontine perivascular enhancement responsive
                to steroids
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: failed_cytotoxic_clearance
        hypothesis_label: Failed cytotoxic clearance sustains the infiltrate
        status: EMERGING
        description: 'That in at least a subgroup, CLIPPERS is driven by an inability of cytotoxic lymphocytes
          to kill. Biallelic PRF1 or UNC13D lesions leave an antigen-bearing target uncleared, so the
          T cell response against it never resolves and becomes the chronic perivascular infiltrate that
          defines the disease. The attraction of this model is that it explains the chronicity - a feature
          the "immune-mediated inflammation" account merely restates - and it predicts the steroid dependence,
          since suppression removes the response without removing its stimulus. It is EMERGING rather
          than established: the association rests on 4 of 12 tested patients in one cohort plus two further
          UNC13D patients, no step between the degranulation defect and the brainstem lesion has been
          traced, and three of the four mutated patients subsequently showed features atypical for CLIPPERS.'
      selected_evidence:
        snippet: In our patients presenting with adult-onset CLIPPERS, one-third have HLH gene mutations.
          This genetic treatable condition should be searched in patients with CLIPPERS, especially in
          those presenting with atypical findings.
        supports: SUPPORT
