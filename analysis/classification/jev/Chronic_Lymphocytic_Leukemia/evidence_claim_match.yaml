        description: BCL2 inhibitor venetoclax combined with the anti-CD20 antibody obinutuzumab, given
          as fixed-duration (1 year) therapy in previously untreated CLL. In the randomized CLL14 study
          it gave markedly superior progression-free survival to chlorambucil-obinutuzumab, and minimal
          residual disease status at the end of therapy predicted how long that benefit lasted. The fixed-duration
          principle for venetoclax plus an anti-CD20 antibody was established separately in the relapsed/refractory
          setting by MURANO, which used rituximab rather than obinutuzumab.
        treatment_term:
          preferred_term: targeted therapy
