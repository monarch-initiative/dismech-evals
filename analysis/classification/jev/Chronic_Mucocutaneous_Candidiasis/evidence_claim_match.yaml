          the Y238X allele is a relatively common polymorphism, and the reported phenotype (recurrent
          vulvovaginal candidiasis, onychomycosis) is at the mild end of the CMC spectrum, so the evidence
          supports a predisposing rather than a fully penetrant Mendelian role. Dectin-1 (CLEC7A) is the
          beta-glucan receptor upstream of CARD9; the Y238X early-stop allele impairs beta-glucan binding
          and IL-17, TNF and IL-6 induction. Notably, and unlike CARD9 deficiency, phagocytosis and fungal
          killing are preserved, so dectin-1 deficiency causes mucosal but NOT invasive disease - a natural
          dissection that localizes CARD9''s invasive-disease risk to myeloid effector function downstream
          of the receptor. No separate subtype is modelled because the phenotype is confined to the mucosal
          arm already captured by the shared IL-17 nodes, and the association rests on a single kindred.
          MONDO delimits the concept as candidiasis, familial, 4 (MONDO:0013140), attributed to CLEC7A;
          the CURIE is recorded here so that this decision is findable from the identifier and not only
          from the gene symbol.'
      selected_evidence:
        snippet: In contrast, fungal phagocytosis and fungal killing were normal in the patients, explaining
          why dectin-1 deficiency was not associated with invasive fungal infections and highlighting
          the specific role of dectin-1 in human mucosal antifungal defense.
        supports: SUPPORT
    origin:
