    evidence_metadata:
      reference: PMID:19864674
      reference_title: Human dectin-1 deficiency and mucocutaneous fungal infections.
      evidence_source: IN_VITRO
      explanation: 'The key contrast with CARD9 deficiency: preserved myeloid killing means dectin-1 deficiency
        stops at the mucosa, supporting the entry''s separation of the mucocutaneous and invasive arms.'
