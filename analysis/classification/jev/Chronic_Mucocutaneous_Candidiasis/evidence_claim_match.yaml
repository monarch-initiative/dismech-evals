        snippet: Major clinical improvement was achieved after 8 weeks of ruxolitinib treatment, while
          sustained suppression of IFNγ- and IFNα-induced phosphorylation of STAT1, STAT3, and STAT5,
          as well as increased STAT3-inducible and Th17-related gene expression, was demonstrated ex vivo.
        supports: SUPPORT
