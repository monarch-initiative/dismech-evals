            name: STAT1 GOF
            display_name: STAT1 gain-of-function CMC (CANDF7 / IMD31C)
            subtype_term:
              preferred_term: immunodeficiency 31C, chronic mucocutaneous candidiasis, autosomal dominant
              term:
                id: MONDO:0013599
                label: autoimmune enteropathy and endocrinopathy - susceptibility to chronic infections
                  syndrome
            description: 'The commonest genetic cause of CMC. Heterozygous, usually coiled-coil-domain
              STAT1 substitutions that impair nuclear dephosphorylation of activated STAT1 and thereby
              increase STAT1-dependent responses; the resulting suppression of IL-17-producing T-cell
              development causes CMC. Unlike the direct IL-17-circuit defects, STAT1 GOF is not confined
              to Candida: it carries substantial bacterial, viral and mycobacterial infection risk, autoimmunity
              (especially hypothyroidism), cerebral aneurysm and carcinoma. It is the only CMC subtype
              with a mechanism-directed therapy (JAK inhibition).'
            genes:
            - preferred_term: STAT1
              term:
                id: hgnc:11362
                label: STAT1
          role: subtype
      assertion_type: Biochemical
      assertion:
        name: Interferon-induced STAT1 phosphorylation
        presence: INCREASED
        subtype: STAT1 GOF
        notes: Flow-cytometric measurement of STAT1 phosphorylation in peripheral blood mononuclear cells
          after IFN-alpha, IFN-gamma or IL-27 stimulation, with prolonged or exaggerated phosphorylation
          indicating a gain-of-function allele. Recommended as a rapid functional adjunct alongside -
          not instead of - STAT1 sequencing.
      selected_evidence:
        snippet: Measurement of IFN- or IL-induced STAT1 phosphorylation in PBMC provides a fast and reliable
          diagnostic tool and should be carried out in addition to genetic testing.
        supports: SUPPORT
