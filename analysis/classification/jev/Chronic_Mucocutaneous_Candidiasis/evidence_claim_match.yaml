      assertion_type: ProgressionInfo
      assertion:
        phase: Early childhood onset with lifelong relapsing course
        age_range: Median onset 1 year (range 0-24 years) in STAT1 gain-of-function
        notes: 'CMC typically begins in infancy or early childhood, most often as persistent oral thrush,
          and spreads over time to nails, skin, oesophagus and genital mucosa. In STAT1 gain-of-function
          the median age at onset is one year. The course is chronic and relapsing rather than staged:
          treatment induces remission but relapse after withdrawal is the norm (87% for oesophageal disease).
          The complications that determine prognosis - oesophageal stricture, squamous cell carcinoma,
          and, in STAT1 GOF, invasive infection, cerebral aneurysm and cancer - accumulate with disease
          duration, which is the argument for early diagnosis and sustained suppression rather than intermittent
          treatment of flares.'
      selected_evidence:
        snippet: The median age of the 274 patients was 22 years (range, 1-71 years); 98% of them had
          CMC, with a median age at onset of 1 year (range, 0-24 years).
