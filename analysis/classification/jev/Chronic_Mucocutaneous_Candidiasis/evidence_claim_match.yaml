        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: stat1_gof_inversion
        hypothesis_label: A gain of STAT1 function produces a loss of Th17 immunity (signalling cross-inhibition,
          not STAT1 haploinsufficiency)
        status: CANONICAL
        description: 'STAT1 gain-of-function CMC is mechanistically counter-intuitive and is frequently
          mis-stated as a STAT1 deficiency. The alleles are genuinely hypermorphic: coiled-coil-domain
          substitutions impair nuclear dephosphorylation of activated STAT1, so STAT1-dependent transcription
          is increased. The loss of IL-17 immunity is a downstream consequence of that gain, by two convergent
          routes. First, IFN-alpha/beta, IFN-gamma and IL-27 are physiological inhibitors of IL-17-producing
          T-cell development and act through STAT1; amplifying their signal amplifies the brake. Second,
          IL-6 and IL-21 are physiological inducers of Th17 cells that act through STAT3 but also activate
          STAT1; shifting the STAT1/STAT3 balance toward STAT1 at the shared receptors diverts the inducing
          signal. The prediction that follows - that pharmacologically dialling the signal back down should
          restore IL-17 immunity - is borne out clinically by JAK inhibition, making this the rare inborn
          error where the mechanism directly names its own treatment.'
        applies_to_subtypes:
        - STAT1 GOF
      selected_evidence:
        snippet: Stronger cellular responses to the STAT1-dependent IL-17 inhibitors IFN-α/β, IFN-γ, and
          IL-27, and stronger STAT1 activation in response to the STAT3-dependent IL-17 inducers IL-6
          and IL-21, hinder the development of T cells producing IL-17A, IL-17F, and IL-22.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
