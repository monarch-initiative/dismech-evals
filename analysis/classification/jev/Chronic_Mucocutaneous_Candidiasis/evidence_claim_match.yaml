  c313e544a17756a5cee551ed12fb38e5264fd4dd236a679e9bc7b88c1aa37d2c:
    claim:
      about:
        disease:
          name: Chronic Mucocutaneous Candidiasis
          disease_term:
            preferred_term: chronic mucocutaneous candidiasis
            term:
              id: MONDO:0015279
              label: chronic mucocutaneous candidiasis
        context:
        - path: /has_subtypes/5
          value:
            name: RORC deficiency
            display_name: RORgamma/RORgammaT deficiency
            description: 'Bi-allelic RORC loss of function removes the master transcription factor for
              IL-17A/F-producing lymphocytes, so IL-17A/F-producing T cells are absent and CMC results.
              Unlike the receptor and adaptor defects, RORC deficiency is not confined to Candida: the
              same patients have severe mycobacterial disease, unexpectedly through a separate defect
              in Mycobacterium-specific IFN-gamma production by gamma-delta and CCR6+CXCR3+ T cells. This
              subtype therefore sits at the boundary of CMC and MSMD. No subtype_term is bound: the matching
              MONDO class (MONDO:0014710, autosomal recessive Mendelian susceptibility to mycobacterial
              diseases due to complete RORgamma receptor deficiency) sits under MONDO:0020573 inherited
              disease susceptibility, which is outside the source_nodes of the DiseaseOrSubtypeTerm dynamic
              enum. It is used as the disease_term of the corresponding differential diagnosis below,
              where the DiseaseTerm enum does admit that branch.'
            genes:
            - preferred_term: RORC
              term:
                id: hgnc:10260
                label: RORC
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Loss of the Th17-Inducing Transcriptional Program
        biological_scale: MOLECULAR
        role: trigger
        description: An alternative route to the same deficit, entered by lesions in the transcriptional
          machinery that builds IL-17-producing lymphocytes rather than in the signals that restrain them.
          Bi-allelic RORC loss of function removes RORgamma/RORgammaT, the master transcription factor
          for IL-17A/F-producing lymphocytes, abolishing those cells entirely. Dominant-negative STAT3
          (AD-HIES) prevents naive T cells polarizing to Th17 and lowers RORgammat expression. DOCK8 deficiency
          reduces Th17 numbers as part of a broader combined immunodeficiency.
        genes:
        - preferred_term: RORC
          term:
            id: hgnc:10260
            label: RORC
        - preferred_term: STAT3
          term:
            id: hgnc:11364
            label: STAT3
        - preferred_term: DOCK8
          term:
            id: hgnc:19191
            label: DOCK8
        biological_processes:
        - preferred_term: T-helper 17 cell differentiation
          term:
            id: GO:0072539
            label: T-helper 17 cell differentiation
          modifier: DECREASED
        cell_types:
        - preferred_term: T-helper 17 cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        subtypes:
        - RORC deficiency
      selected_evidence:
        snippet: The lack of functional RORγ and RORγT isoforms resulted in the absence of IL-17A/F-producing
          T cells in these individuals, probably accounting for their chronic candidiasis.
        supports: SUPPORT
