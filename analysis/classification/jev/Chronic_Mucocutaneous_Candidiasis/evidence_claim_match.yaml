        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmc_stat1_gof_aneurysm_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does STAT1 gain-of-function cause cerebral aneurysm?
        attaches_to:
        - pathophysiology#Broad STAT1-Driven Immune Dysregulation
        rationale: Cerebral aneurysms occur in 6% of STAT1 GOF patients and are among the three strongest
          predictors of poor outcome, yet the causal edge from STAT1 hyperactivation to arterial wall
          failure is modelled as INDIRECT_UNKNOWN_INTERMEDIATES because no mechanism is established. Candidate
          explanations include chronic interferon-driven vasculitis, a direct effect of STAT1 signalling
          on vascular smooth muscle or endothelium, and secondary damage from recurrent infection. Distinguishing
          these determines whether JAK inhibition would be expected to modify aneurysm risk, which is
          currently unknown and clinically important given that patients may take JAK inhibitors for decades.
        proposed_experiments:
        - experiment_id: exp_cmc_stat1_aneurysm_imaging_by_jaki_exposure
          name: Cerebral vascular imaging stratified by JAK-inhibitor exposure
          description: Cross-sectional cerebral vascular imaging in a STAT1 GOF cohort stratified by cumulative
            JAK-inhibitor exposure, to test whether reducing STAT1 signalling modifies aneurysm prevalence.
        - experiment_id: exp_cmc_stat1_aneurysm_wall_histopathology
          name: Aneurysm wall histopathology and interferon signature
          description: Histopathological characterization of aneurysm wall tissue from STAT1 GOF patients
            for interferon-signature gene expression and inflammatory infiltrate, to distinguish interferon-driven
            vasculitis from a non-inflammatory vascular effect.
      selected_evidence:
        snippet: STAT1 GOF mutations underlie AD CMC, as well as an unexpectedly wide range of other clinical
          features, including not only a variety of infectious and autoimmune diseases, but also cerebral
          aneurysms and carcinomas that confer a poor prognosis.
        supports: SUPPORT
    origin:
