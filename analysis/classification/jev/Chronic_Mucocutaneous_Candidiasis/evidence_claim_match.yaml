      assertion_type: DifferentialDiagnosis
      assertion:
        name: Autoimmune polyendocrine syndrome type 1 (APECED/APS-1)
        disease_term:
          preferred_term: autoimmune polyendocrine syndrome type 1
          term:
            id: MONDO:0009411
            label: autoimmune polyendocrine syndrome type 1
        description: 'The most consequential overlap. CMC is typically the FIRST manifestation of APS-1,
          appearing years before the endocrine features, so an apparently isolated CMC in a child may
          be a pre-endocrine APS-1. This is a temporal trap, not merely a phenotypic one: withholding
          the diagnosis risks a fatal unrecognized adrenal crisis. APS-1 is simultaneously an APECED subtype
          of CMC (modelled in has_subtypes) and a differential diagnosis for apparently isolated CMC -
          both framings are correct and both are recorded here deliberately.'
        distinguishing_features:
        - Neutralizing anti-IL-17A/IL-17F/IL-22 autoantibodies are present in APS-1 and absent in STAT1
          GOF CMC, making autoantibody testing the decisive discriminator
        - Hypoparathyroidism, primary adrenal insufficiency and ectodermal dystrophy
        - Biallelic AIRE variants
        - Because the autoantibodies precede the CMC, a negative endocrine screen at presentation does
          not exclude APS-1 and surveillance is required
        notes: Full curation of APS-1 (AIRE, thymic tolerance failure, endocrine autoimmunity) is in kb/disorders/Autoimmune_Polyendocrine_Syndrome_Type_1.yaml
          and is intentionally not duplicated in this entry.
      selected_evidence:
        snippet: In autoimmune polyendocrinopathy candidiasis ectodermal dystrophy (APECED, or autoimmune
          polyendocrine syndrome 1), CMC is often the first sign, but the underlying immunodeficiency
          is a long-standing puzzle.
        supports: SUPPORT
