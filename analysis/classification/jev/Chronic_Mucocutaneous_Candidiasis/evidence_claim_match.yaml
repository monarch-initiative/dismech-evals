          hyperactivation, loss of the RORgammat/STAT3 transcriptional program, CARD9-dependent myeloid
          instruction, or a dominant-negative IL17F allele that makes the cytokine but renders it inert,
          the shared result is that too little bioactive IL-17A, IL-17F and IL-22 reaches the barrier.
