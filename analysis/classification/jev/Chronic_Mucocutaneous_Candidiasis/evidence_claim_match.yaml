          peptides (beta-defensins, S100 proteins) and the chemokines (CXCL1/GRO-alpha, IL-6, G-CSF) that
          recruit and sustain neutrophils at the mucosal surface. The functional readout used to diagnose
          the defect is exactly this: patient fibroblasts and keratinocytes fail to induce IL-6 and GRO-alpha
          in response to IL-17A or IL-17F. The tissue consequence is that Candida hyphae are not cleared
          from the superficial epithelium.'
        biological_processes:
        - preferred_term: antimicrobial humoral response
