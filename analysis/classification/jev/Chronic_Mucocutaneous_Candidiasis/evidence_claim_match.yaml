        description: The commonest acquired cause of persistent oropharyngeal and oesophageal candidiasis,
          and the single most important diagnosis to exclude before invoking an inborn error. CD4 depletion
          removes the Th17 compartment among much else, so the mucosal phenotype can be indistinguishable
          at presentation.
        distinguishing_features:
        - Positive HIV serology or nucleic acid testing with CD4 lymphopenia
