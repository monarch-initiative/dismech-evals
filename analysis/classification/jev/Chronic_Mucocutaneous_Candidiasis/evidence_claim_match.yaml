              dermatophytosis. The distinction is clinically decisive: a CMC patient with CNS or deep-tissue
              fungal disease should be worked up for CARD9, and management cannot be limited to topical
              or intermittent mucosal antifungal therapy. No subtype_term is bound: the matching MONDO
              class (MONDO:0008905, predisposition to invasive fungal disease due to CARD9 deficiency)
              sits under MONDO:0020573 inherited disease susceptibility, outside the source_nodes of the
