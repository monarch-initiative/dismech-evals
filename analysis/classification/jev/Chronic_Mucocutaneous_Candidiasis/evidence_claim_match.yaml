        context:
        - path: /has_subtypes/6
          value:
            name: CARD9 deficiency
            display_name: CARD9 deficiency (invasive and CNS fungal disease)
            description: 'Autosomal recessive deficiency of CARD9, the cytosolic adaptor that transduces
              C-type lectin receptor (Dectin-1) signals in myeloid cells. CARD9-deficient patients do
              have low Th17 counts and CMC, but the defect is upstream of, and broader than, the IL-17
              circuit itself: it also cripples myeloid antifungal effector function. This subtype is therefore
              NOT mucocutaneous-only - it uniquely and characteristically permits invasive and central
              nervous system fungal disease (including fatal Candida infection of the brain) and deep
              dermatophytosis. The distinction is clinically decisive: a CMC patient with CNS or deep-tissue
              fungal disease should be worked up for CARD9, and management cannot be limited to topical
              or intermittent mucosal antifungal therapy. No subtype_term is bound: the matching MONDO
              class (MONDO:0008905, predisposition to invasive fungal disease due to CARD9 deficiency)
              sits under MONDO:0020573 inherited disease susceptibility, outside the source_nodes of the
              DiseaseOrSubtypeTerm dynamic enum; it is used as the disease_term of the corresponding differential
              diagnosis below.'
            genes:
            - preferred_term: CARD9
              term:
                id: hgnc:16391
                label: CARD9
          role: subtype
        - path: /has_subtypes/0
          value:
            name: STAT1 GOF
            display_name: STAT1 gain-of-function CMC (CANDF7 / IMD31C)
            subtype_term:
              preferred_term: immunodeficiency 31C, chronic mucocutaneous candidiasis, autosomal dominant
              term:
                id: MONDO:0013599
                label: autoimmune enteropathy and endocrinopathy - susceptibility to chronic infections
                  syndrome
            description: 'The commonest genetic cause of CMC. Heterozygous, usually coiled-coil-domain
              STAT1 substitutions that impair nuclear dephosphorylation of activated STAT1 and thereby
              increase STAT1-dependent responses; the resulting suppression of IL-17-producing T-cell
              development causes CMC. Unlike the direct IL-17-circuit defects, STAT1 GOF is not confined
              to Candida: it carries substantial bacterial, viral and mycobacterial infection risk, autoimmunity
              (especially hypothyroidism), cerebral aneurysm and carcinoma. It is the only CMC subtype
              with a mechanism-directed therapy (JAK inhibition).'
            genes:
            - preferred_term: STAT1
              term:
                id: hgnc:11362
                label: STAT1
          role: subtype
