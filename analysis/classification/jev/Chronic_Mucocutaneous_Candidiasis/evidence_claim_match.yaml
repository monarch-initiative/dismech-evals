                  syndrome
            description: 'The commonest genetic cause of CMC. Heterozygous, usually coiled-coil-domain
              STAT1 substitutions that impair nuclear dephosphorylation of activated STAT1 and thereby
              increase STAT1-dependent responses; the resulting suppression of IL-17-producing T-cell
              development causes CMC. Unlike the direct IL-17-circuit defects, STAT1 GOF is not confined
              to Candida: it carries substantial bacterial, viral and mycobacterial infection risk, autoimmunity
              (especially hypothyroidism), cerebral aneurysm and carcinoma. It is the only CMC subtype
              with a mechanism-directed therapy (JAK inhibition).'
            genes:
            - preferred_term: STAT1
              term:
                id: hgnc:11362
                label: STAT1
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Broad STAT1-Driven Immune Dysregulation
        biological_scale: ORGANISM
        role: consequence
        description: The non-Candida arm of STAT1 gain-of-function, kept as a separate node because it
          is subtype-specific and must not be attributed to CMC as a class. The same enhanced STAT1-dependent
          responsiveness that suppresses Th17 development also produces bacterial infection (74%, mostly
          Staphylococcus aureus), viral infection (38%, mostly Herpesviridae), mycobacterial disease,
          autoimmunity (37%, dominated by hypothyroidism at 22%), cerebral aneurysms (6%) and carcinoma
          (6%). Invasive infection, cerebral aneurysm and cancer were the strongest predictors of poor
          outcome in the largest cohort. Patients with pure CMC disease from IL-17-circuit lesions do
          not develop this spectrum.
        genes:
        - preferred_term: STAT1
          term:
            id: hgnc:11362
            label: STAT1
        biological_processes:
        - preferred_term: cell surface receptor signaling pathway via JAK-STAT
          term:
            id: GO:0007259
            label: cell surface receptor signaling pathway via JAK-STAT
          modifier: INCREASED
        subtypes:
        - STAT1 GOF
      selected_evidence:
        snippet: Invasive infections (25%), cerebral aneurysms (6%), and cancers (6%) were the strongest
          predictors of poor outcome.
        supports: SUPPORT
