        description: 'Fluconazole is the mainstay for extensive oral, oesophageal, nail or recurrent disease,
          with topical agents for limited mucosal or cutaneous involvement. Treatment controls rather
          than cures: in a STAT1 GOF cohort azoles achieved complete response in 38% and partial remission
          in 62% of treated oral disease, 58% required continuing prophylaxis, and in the larger international
          cohort CMC persisted in 39% of patients on prolonged antifungal therapy. Chronic azole exposure
          selects resistant Candida, which is the principal long-term limitation.'
