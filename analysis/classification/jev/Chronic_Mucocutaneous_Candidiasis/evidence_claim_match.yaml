        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: il17_axis_convergence
        hypothesis_label: Convergence of independent genetic lesions on the IL-17 axis is the inferential
          basis for IL-17 as the mucosal antifungal pathway
        status: CANONICAL
        description: 'The intellectual core of this entry. CMC is not merely explained by IL-17 deficiency;
          historically the inference ran the other way. Between 2010 and 2015, six mechanistically independent
          human lesions - neutralizing anti-IL-17A/IL-17F/IL-22 autoantibodies (APECED), IL-17RA deficiency,
          IL-17F dominant-negative deficiency, ACT1/TRAF3IP2 deficiency, IL-17RC deficiency and RORC deficiency
          - were each shown to produce the same narrow phenotype: mucocutaneous candidiasis, with little
          or no other infectious susceptibility. Because these lesions sit at different points on one
          circuit (cytokine, receptor, adaptor, transcription factor, autoantibody-mediated neutralization)
          yet converge on one clinical picture, they constitute a natural knock-out series establishing
          that human IL-17A/IL-17F immunity is both necessary for mucocutaneous defence against Candida
          albicans and largely redundant for defence against other pathogens. The authors of these papers
          describe them explicitly as experiments of nature. Causal edges belonging to this argument carry
          this hypothesis group.'
      selected_evidence:
        snippet: These experiments of nature indicate that human IL-17RC is essential for mucocutaneous
          immunity to C. albicans but is otherwise largely redundant.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25918342
      reference_title: Inherited IL-17RC deficiency in patients with chronic mucocutaneous candidiasis.
      evidence_source: HUMAN_CLINICAL
      explanation: A fourth, independent lesion on the same circuit reproduces the identical narrow phenotype,
        strengthening the convergence argument.
