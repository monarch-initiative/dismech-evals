            term:
              id: MONDO:0015279
              label: chronic mucocutaneous candidiasis
        context: []
      assertion_type: Treatment
      assertion:
        name: JAK inhibition (ruxolitinib, baricitinib)
        description: 'The mechanism-directed therapy for STAT1 gain-of-function CMC and the clinical vindication
          of the inversion model: because the IL-17 deficit is a downstream consequence of excessive JAK-STAT1
          signalling, pharmacologically reducing that signal should restore Th17 immunity - and it does.
          Ruxolitinib suppressed IFN-induced STAT1/3/5 phosphorylation and raised Th17-related gene expression
          ex vivo alongside major clinical improvement. In the largest series, JAK inhibitors produced
          partial or complete remission in 87% of 45 STAT1 GOF patients. Important caveats: this is off-label,
          adverse events (infection, weight gain) occurred in 38% of patients, the effect is not sustained
          after withdrawal so long-term administration is required, and it does not apply to the IL-17
          receptor, adaptor, ligand or autoantibody etiologies.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: ruxolitinib
            term:
              id: NCIT:C77888
              label: Ruxolitinib
          - preferred_term: baricitinib
            term:
              id: NCIT:C127012
              label: Baricitinib
      selected_evidence:
        snippet: JAK1/2 inhibition with ruxolitinib represents a viable option for treatment of refractory
          CMC, if HSCT is not considered. However, long-term administration is necessary, as the effect
          is not sustained after treatment discontinuation.
        supports: SUPPORT
