              label: chronic mucocutaneous candidiasis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Secondary (acquired) chronic mucocutaneous candidiasis, general
        description: An umbrella differential covering acquired, non-germline permissive states for persistent
          mucocutaneous candidiasis - most often HIV infection, systemic or inhaled corticosteroids and
          other immunosuppression, broad-spectrum antibiotic use, poorly controlled diabetes mellitus,
          or thymoma with anti-cytokine autoantibodies - that must be excluded before an inborn error
          of the IL-17 circuit is diagnosed. The three most clinically important individual causes (HIV/
          AIDS, drug-associated candidiasis, diabetes mellitus) are curated as their own differential-diagnosis
          entries above with cause-specific distinguishing features; this entry records the shared acquired-cause
          framing rather than duplicating that detail.
        distinguishing_features:
        - No family history and no childhood-onset thrush, nail or genital candidiasis preceding the acquired
          insult
        - Clear temporal relationship to the immunosuppressive drug, HIV seroconversion, uncontrolled
          hyperglycaemia, or thymoma diagnosis
        - Same downstream complications (oesophageal stricture, squamous cell carcinoma risk) as the germline
          forms, but resolving or attenuating once the acquired cause is treated or removed
      selected_evidence:
        snippet: Secondary immune deficiencies are most often due to human immunodeficiency virus (HIV)
          infection, antibiotic use and immunosuppressive treatment (steroids, chemotherapy).
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/9
      evidence_path: /differential_diagnoses/9/evidence/0
