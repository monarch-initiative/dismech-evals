                id: MONDO:0009411
                label: autoimmune polyendocrine syndrome type 1
            description: In AIRE-deficient APECED/APS-1, CMC is typically the first manifestation, and
              it is caused not by a germline lesion in the IL-17 circuit but by high-titre neutralizing
              autoantibodies against IL-17A, IL-17F and IL-22 - an acquired phenocopy of the genetic IL-17
              defects. The autoantibodies precede the CMC in all informative cases, and the same autoantibodies
              explain CMC in the rare thymoma patients who develop it. Only the CMC arm of APS-1 is modelled
              here; the loss of AIRE-dependent thymic tolerance and the hypoparathyroidism / adrenal insufficiency
              / broader autoimmune spectrum are curated in kb/disorders/Autoimmune_Polyendocrine_Syndrome_Type_1.yaml
              and are deliberately not duplicated.
            genes:
            - preferred_term: AIRE
              term:
                id: hgnc:360
                label: AIRE
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Neutralizing Anti-IL-17A, Anti-IL-17F and Anti-IL-22 Autoantibodies
        biological_scale: MOLECULAR
        role: trigger
        description: The acquired phenocopy. In AIRE-deficient APECED/APS-1, failure of thymic negative
          selection generates high-titre neutralizing autoantibodies against IL-17A, IL-17F and IL-22.
          Th17 cells and IL-17 receptors are structurally intact; the cytokines are simply removed from
          circulation before they can signal. The entry point into the shared pathway is therefore one
          step downstream of the genetic etiologies - at the receptor rather than at cytokine production.
          The autoantibodies precede CMC onset in all informative cases, establishing direction of causation,
          and the same autoantibodies explain CMC in rare thymoma patients. Only this arm of APS-1 is
          modelled here; AIRE-dependent tolerance failure and the endocrine autoimmunity are curated in
          the APS-1 entry.
        genes:
        - preferred_term: AIRE
          term:
            id: hgnc:360
            label: AIRE
        cell_types:
        - preferred_term: medullary thymic epithelial cell
          term:
            id: CL:0002365
            label: medullary thymic epithelial cell
        subtypes:
        - APECED
      selected_evidence:
        snippet: We found high titers of autoantibodies (auto-Abs) against IL-17A, IL-17F, and/or IL-22
          in the sera of all 33 patients tested, as detected by multiplex particle-based flow cytometry.
        supports: SUPPORT
