          term:
            id: GO:0002221
            label: pattern recognition receptor signaling pathway
          modifier: DECREASED
        - preferred_term: defense response to fungus
          term:
            id: GO:0050832
            label: defense response to fungus
          modifier: DECREASED
        cell_types:
        - preferred_term: monocyte
          term:
            id: CL:0000576
            label: monocyte
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        subtypes:
        - CARD9 deficiency
      selected_evidence:
        snippet: Healthy family members had wild-type expression of the CARD9 protein; the four patients
          lacked wild-type expression, which was associated with low numbers of Th17 cells (helper T cells
          producing interleukin-17).
        supports: SUPPORT
