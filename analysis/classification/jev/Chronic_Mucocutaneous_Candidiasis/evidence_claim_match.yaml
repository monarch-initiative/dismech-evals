              label: chronic mucocutaneous candidiasis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cmc_th17_count_not_diagnostic
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do 18% of STAT1 gain-of-function patients have a normal circulating IL-17A-producing
          T-cell count despite manifesting CMC?
        attaches_to:
        - pathophysiology#Deficient IL-17A, IL-17F and IL-22 Production
        rationale: The pathograph treats deficient IL-17A/F/IL-22 production as the convergence node for
          the STAT1, RORC, STAT3 and CARD9 routes, yet the largest STAT1 GOF cohort found low circulating
          IL-17A-producing T cells in only 82% of patients tested. Either the peripheral blood Th17 count
          is an insensitive proxy for tissue-level IL-17 availability at the barrier, or a subset of STAT1
          GOF patients develop CMC through a mechanism that does not require quantitative Th17 depletion
          (for example impaired IL-17 functional output from a numerically normal compartment, or a direct
          effect of excessive interferon signalling on the epithelium). Resolving this matters clinically
          because a normal Th17 count is currently, and incorrectly, treated by some as evidence against
          the diagnosis.
        proposed_experiments:
        - experiment_id: exp_cmc_barrier_il17_vs_blood_th17
          name: Barrier-site IL-17 quantification stratified by blood Th17 count
          description: Quantify IL-17A, IL-17F and IL-22 protein and transcript at the oral mucosal barrier
            (rather than in blood) in STAT1 GOF patients stratified by circulating Th17 count, to test
            whether tissue IL-17 availability is uniformly low even when blood Th17 numbers are normal.
        - experiment_id: exp_cmc_per_cell_candida_il17_output
          name: Per-cell Candida-specific IL-17 functional output
          description: Compare Candida-specific IL-17 secretion per Th17 cell in STAT1 GOF patients with
            normal versus low Th17 numbers, to test whether a functional rather than numerical deficit
            explains the discordant subset.
      selected_evidence:
        snippet: Circulating interleukin-17A-producing T-cell count was low for most (82%) but not all
          of the patients tested.
        supports: SUPPORT
