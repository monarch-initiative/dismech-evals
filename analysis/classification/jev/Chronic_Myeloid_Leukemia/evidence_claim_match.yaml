    evidence_metadata:
      reference: PMID:42401590
      reference_title: Pan-cancer profiling of CDH2 and a GSK3β-sensitive anti-proliferative effect in
        K562 chronic myeloid leukemia cells.
      evidence_source: IN_VITRO
      explanation: This IN_VITRO evidence from K562 cells demonstrates CDH2-GSK3β-sensitive anti-proliferation
        but explicitly acknowledges mechanistic uncertainty and context-dependence across cancer types,
        indicating that human validation is required to interpret this as a generalizable CML mechanism
        rather than a K562 cell-line artifact.
