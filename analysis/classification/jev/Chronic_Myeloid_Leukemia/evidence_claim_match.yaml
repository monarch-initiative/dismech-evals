        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BCR-ABL1 Fusion Oncogene Formation
        conforms_to: sustaining_proliferative_signaling#Oncogenic Growth-Signal Lesion
        description: The t(9;22)(q34;q11) translocation juxtaposes the ABL1 tyrosine kinase gene on chromosome
          9 with the BCR gene on chromosome 22, creating the Philadelphia chromosome. The resulting BCR-ABL1
          fusion protein has constitutive tyrosine kinase activity independent of normal regulatory mechanisms.
        genetic_context:
          variant_origin: SOMATIC
          functional_impact_category: GAIN_OF_FUNCTION
          genes:
          - preferred_term: BCR
            term:
              id: hgnc:1014
              label: BCR
          - preferred_term: ABL1
            term:
              id: hgnc:76
              label: ABL1
          description: 'Acquired somatic t(9;22)(q34;q11) reciprocal translocation; the fusion product
            in CML is typically the p210 BCR-ABL1 protein. The lesion is a gene fusion rather than a point
            mutation, so the two partner genes are bound here together: neither is altered in isolation,
            and the gain-of-function belongs to the chimeric product.'
        genes:
        - preferred_term: BCR
          term:
            id: hgnc:1014
            label: BCR
        - preferred_term: ABL1
          term:
            id: hgnc:76
            label: ABL1
        cell_types:
        - preferred_term: hematopoietic stem cell
          term:
            id: CL:0000037
            label: hematopoietic stem cell
        biological_processes:
        - preferred_term: protein phosphorylation
          term:
            id: GO:0006468
            label: protein phosphorylation
        gene_products:
        - preferred_term: BCR-ABL1 fusion protein
          term:
            id: NCIT:C16325
            label: BCR/ABL1 Fusion Protein
      selected_evidence:
        snippet: BCR-ABL is a constitutively activated tyrosine kinase that causes chronic myeloid leukemia
          (CML). Since tyrosine kinase activity is essential to the transforming function of BCR-ABL,
          an inhibitor of the kinase could be an effective treatment for CML.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:11287972
      reference_title: Efficacy and safety of a specific inhibitor of the BCR-ABL tyrosine kinase in chronic
        myeloid leukemia.
      explanation: This landmark paper establishes that BCR-ABL is a constitutively activated tyrosine
        kinase that causes CML, directly supporting the pathophysiology description.
