              label: chronic myeloid leukemia
        context: []
      assertion_type: Genetic
      assertion:
        name: BCR
        gene_term:
          preferred_term: BCR
          term:
            id: hgnc:1014
            label: BCR
        association: Somatic fusion partner (5' partner of BCR::ABL1)
        relationship_type: SOMATIC_DRIVER
        variant_origin: SOMATIC
        notes: 'BCR is the chromosome 22 partner of the t(9;22)(q34;q11) translocation. It contributes
          the 5'' end of the fusion transcript, and its coiled-coil oligomerisation domain is what forces
          the ABL1 kinase into the constitutively active state. BCR is therefore a genuine constituent
          of the CML lesion but is not itself mutated: no germline or somatic point variant of BCR causes
          CML, and a BCR allele outside the fusion is unremarkable. This is why the record is graded SOMATIC_DRIVER
          rather than CAUSATIVE, and it is the basis of this entry''s disagreement with MONDO, which asserts
          `RO:0004003 has material basis in germline mutation in BCR` for MONDO:0011996 and in consequence
          classifies chronic myeloid leukemia under `MONDO:0003847 hereditary disease`.'
      selected_evidence:
        snippet: These studies provide evidence that genetically complex cancers retain dependence on
          an initial oncogenic event.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
      context_paths:
