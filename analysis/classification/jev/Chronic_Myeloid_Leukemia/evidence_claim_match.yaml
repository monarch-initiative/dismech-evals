        gene_term:
          preferred_term: ABL1
          term:
            id: hgnc:76
            label: ABL1
        association: Somatic fusion partner (3' partner of BCR::ABL1); kinase-domain resistance mutations
        relationship_type: SOMATIC_DRIVER
        variant_origin: SOMATIC
        notes: 'ABL1 is the chromosome 9 partner of the translocation and contributes the tyrosine kinase
          domain that the fusion deregulates. Unlike BCR, ABL1 also acquires ordinary point mutations
          in this disease, but as a *later* event: kinase-domain substitutions such as T315I arise under
          tyrosine-kinase-inhibitor selection and cause acquired resistance rather than initiating the
          leukemia. Both roles are somatic, which is why one SOMATIC_DRIVER record covers them and the
          distinction is drawn here rather than by splitting the gene in two.'
      selected_evidence:
        snippet: "In six of \nnine patients, resistance was associated with a single amino acid substitution\
