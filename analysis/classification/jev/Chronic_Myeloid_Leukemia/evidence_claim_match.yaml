  613f4caa4b0e9774343abfa8ef7853a7af823112c543bdb9f724719ba4470347:
    claim:
      about:
        disease:
          name: Chronic Myeloid Leukemia, BCR-ABL1 Positive
          disease_term:
            preferred_term: chronic myeloid leukemia
            term:
              id: MONDO:0011996
              label: chronic myeloid leukemia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cml_cdh2_gsk3beta_translational_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Uncontrolled Myeloid Proliferation
        - pathophysiology#Constitutive Tyrosine Kinase Activation
        - pathophysiology#PI3K-AKT Pathway Activation
        - pathophysiology#JAK-STAT Pathway Activation
        prompt: Does CDH2 (N-cadherin) mediated GSK3β-sensitive suppression of proliferation observed
          in K562 leukemia cells represent a tractable therapeutic vulnerability in human CML, or is it
          a cell-line artifact without relevance to BCR-ABL1 driven pathophysiology?
        rationale: K562 CML cells represent a well-established model but may diverge from primary CML
          stem cells and patient-derived xenografts in GSK3β signaling and CDH2 expression context. CDH2
          exhibits pan-cancer context-dependent effects, suggesting that anti-proliferative phenotype
          in K562 cells may not generalize to human CML. The paper's own conclusion notes "the precise
          molecular mechanism remains unresolved" and identifies this as a "therapeutic vulnerability
          in this model" — language that appropriately caveat-gates claims to the K562 cell line. Clarifying
          whether the CDH2-GSK3β axis operates as a disease mechanism (not just in vitro drug target)
          is mechanistically meaningful for CML's relationship to Wnt/β-catenin and MAPK checkpoint signaling.
        proposed_experiments:
        - experiment_id: exp_cml_cdh2_gsk3beta_primary_cells
          name: CDH2-GSK3β axis validation in primary CML progenitors and patient-derived xenografts
          description: Quantify CDH2 and GSK3β expression levels in primary CML stem cells (CD34+), patient-derived
            xenografts (PDX), and K562 cells to determine whether K562 model recapitulates the expression
            and signaling context of human disease. Test whether CDH2 overexpression or GSK3β inhibition
            (CHIR-99,021) suppresses proliferation in primary human CML progenitors or PDX models matching
            K562 phenotype. If the effect does not replicate, the mechanism is K562-specific.
          experiment_type:
            preferred_term: gene-perturbation proliferation assay in primary progenitors and xenografts
          model_systems:
          - name: Primary CML CD34+ progenitor culture
            description: Patient-derived CD34+ chronic myeloid leukemia stem/progenitor cells, the primary-cell
              context against which the K562 CDH2-GSK3β phenotype is tested for translational validity.
            experimental_model_type: PRIMARY_CELL_CULTURE
          - name: CML patient-derived xenograft (PDX)
            description: In vivo engraftment of primary CML cells used to assess whether CDH2 overexpression
              or GSK3β inhibition reproduces the K562 anti-proliferative effect in a disease-faithful
              microenvironment.
            experimental_model_type: OTHER
          - name: K562 CML cell line
            description: The immortalized BCR-ABL1-positive cell line in which the original CDH2-GSK3β-sensitive
              anti-proliferative effect was observed.
            experimental_model_type: CELL_LINE
        - experiment_id: exp_cml_cdh2_bcr_abl1_intersection
          name: Mechanistic intersection of CDH2-GSK3β axis with BCR-ABL1 signaling
          description: 'Map CDH2-GSK3β axis to BCR-ABL1 signaling: determine whether CDH2 upregulation
            suppresses BCR-ABL1-driven proliferation through MAPK/PI3K/JAK-STAT checkpoint effects, or
            through an off-axis Wnt/GSK3β-independent route. Mechanistically contextualize CDH2 effects
            within the documented CML pathophysiology nodes (Uncontrolled Myeloid Proliferation, Constitutive
            Tyrosine Kinase Activation, PI3K-AKT Pathway Activation, JAK-STAT Pathway Activation).'
          experiment_type:
            preferred_term: signaling-pathway epistasis mapping assay
          model_systems:
          - name: K562 CML cell line
            description: BCR-ABL1-positive cell line used to map the CDH2-GSK3β axis onto BCR-ABL1 downstream
              checkpoint signaling (MAPK/PI3K/JAK-STAT).
            experimental_model_type: CELL_LINE
          - name: Primary CML CD34+ progenitor culture
            description: Patient-derived CD34+ progenitors used to confirm any BCR-ABL1 intersection observed
              in the K562 model in disease-relevant cells.
            experimental_model_type: PRIMARY_CELL_CULTURE
      selected_evidence:
        snippet: CDH2 overexpression suppressed proliferation, induced cell cycle arrest and early apoptosis.
          This was accompanied by increased total β-catenin protein but a reduced nuclear-to-cytoplasmic
          β-catenin ratio, without consistent changes in canonical Wnt target gene expression. Notably,
          the GSK3 inhibitor CHIR-99,021 reversed the anti-proliferative effect of CDH2, whereas the β-catenin
          degrader MSAB did not rescue it. CDH2 exhibits context-dependent expression across malignancies.
          In K562 CML cells, CDH2 overexpression suppresses proliferation through a GSK3β-sensitive mechanism.
          However, the precise molecular mechanism remains unresolved.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
