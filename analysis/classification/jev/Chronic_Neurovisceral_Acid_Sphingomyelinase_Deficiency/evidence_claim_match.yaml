      assertion_type: Pathophysiology
      assertion:
        name: Partial Acid Sphingomyelinase Deficiency from SMPD1 Variants
        conforms_to: lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency
        description: Biallelic SMPD1 variants leave intermediate residual acid sphingomyelinase activity,
          greater than in infantile type A but insufficient for normal sphingomyelin turnover. The residual
          activity partially protects the CNS, giving an intermediate neurovisceral phenotype rather than
          the fatal infantile course.
        gene:
          preferred_term: SMPD1
          term:
            id: hgnc:11120
            label: SMPD1
        biological_processes:
        - preferred_term: sphingomyelin catabolic process
          modifier: DECREASED
          term:
            id: GO:0006685
            label: sphingomyelin catabolic process
      selected_evidence:
        snippet: All patients with types A and B NPD have mutations in the gene encoding ASM (SMPD1),
          and thus the disease is more accurately referred to as ASM deficiency (ASMD).
        supports: SUPPORT
