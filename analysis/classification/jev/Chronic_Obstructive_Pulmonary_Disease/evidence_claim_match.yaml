      assertion:
        target: Oxidative Stress and Mitochondrial Dysfunction
        environmental_effect: EXACERBATES
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: 'Inhaled pollutants are named at this node alongside cigarette smoke as drivers of
          mitochondrial reactive oxygen species. Recorded as exacerbating rather than triggering because
          both cited studies measure effects on respiratory health rather than initiation, and the intermediates
          are left unknown because neither measures an oxidative or mitochondrial marker. Worth stating
          plainly, because the smoking link into the inflammation node was graded from node wording rather
          than from evidence: this node''s own text uses the word trigger for pollutants, and would on
          its face have supported a triggering grade here too. It is not taken, because that verb describes
          what pollutants do to reactive oxygen species production once inhaled, not whether the exposure
          starts the disease, and on that question the entry''s own note and both cited studies say the
          same thing, that pollution worsens established disease. The entry does hold a paper on oxidant
          and antioxidant balance, but its quotable sentence names oxidative stress without naming pollution,
          so it cannot carry an exposure-to-node claim and is not cited here.'
      selected_evidence:
        snippet: Evidence from epidemiological studies finding consistent associations between air pollution
          and various outcomes (respiratory symptoms, reduced lung function, chronic bronchitis and mortality),
          has suggested that outdoor air pollution is a contributing cause of morbidity and mortality.
        supports: SUPPORT
