        target: Alveolar Destruction
        direction: UNCHANGED
        interpretation: The directly exposed epithelium was preserved while the unexposed endothelium
          failed, a negative result that reverses the expected order of susceptibility.
      selected_evidence:
        snippet: Here, we demonstrated that endothelial cells were more susceptible to cigarette smoke
          exposure compared to AEC2 as vascular networks disintegrated while the alveolar epithelium remained
          intact.
