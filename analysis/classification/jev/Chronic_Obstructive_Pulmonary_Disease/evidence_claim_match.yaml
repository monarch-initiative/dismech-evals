              term:
                id: UBERON:0002299
                label: alveolus of lung
            notes: The cell types bound here are the review's prediction from metabolic dependency, not
              a reported observation in COPD lung. Curated under the emerging_cuproptosis_metabolic_immune_axis
              hypothesis group for that reason.
