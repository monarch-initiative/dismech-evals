              label: chronic obstructive pulmonary disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cuproptosis of Alveolar Structural Cells
        biological_scale: CELLULAR
        description: Copper-dependent regulated cell death, mechanistically distinct from other death
          pathways, in which copper binds lipoylated TCA-cycle components and the resulting protein aggregation
          and iron-sulfur cluster loss produce proteotoxic stress. Because the pathway depends on mitochondrial
          respiration, the review proposes that oxidative-phosphorylation-reliant alveolar type II epithelial
          cells and M2 macrophages are the vulnerable populations in COPD. That cell-type-specific prediction
          is the review's hypothesis, not an observation in COPD lung.
        cell_types:
        - preferred_term: Alveolar Type II Epithelial Cell
          term:
            id: CL:0002063
            label: pulmonary alveolar type 2 cell
        - preferred_term: anti-inflammatory M2 macrophage
          term:
            id: CL:0000890
            label: M2 macrophage
        biological_processes:
        - preferred_term: Cuproptosis
          modifier: INCREASED
          term:
            id: GO:0160119
            label: cuproptosis
        - preferred_term: mitochondrial proteotoxic stress
          term:
            id: GO:0141164
            label: mitochondrial protein quality control
          description: Closest available binding for the mitochondrial proteotoxic stress the review names
            as the driver of cuproptosis. GO has no term for proteotoxic stress itself, so this names
            the machinery that stress acts on rather than the stress; a narrower term would be a new-term
            request.
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          description: Named as the metabolic dependency that is proposed to determine which cells are
            vulnerable, not as a process altered by this node — hence no modifier.
        locations:
        - preferred_term: alveolus of lung
          term:
            id: UBERON:0002299
            label: alveolus of lung
        notes: The cell types bound here are the review's prediction from metabolic dependency, not a
          reported observation in COPD lung. Curated under the emerging_cuproptosis_metabolic_immune_axis
          hypothesis group for that reason.
      selected_evidence:
        snippet: we show in human cells that copper-dependent, regulated cell death is distinct from known
          death mechanisms and is dependent on mitochondrial respiration
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35298263
      reference_title: Copper induces cell death by targeting lipoylated TCA cycle proteins.
      evidence_source: IN_VITRO
      explanation: The primary experimental report establishing cuproptosis as a distinct, respiration-dependent
        regulated cell death; it is the basis for the metabolic-vulnerability argument applied to COPD.
