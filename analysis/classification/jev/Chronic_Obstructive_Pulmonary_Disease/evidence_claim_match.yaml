          value:
            name: Cuproptosis of Alveolar Structural Cells
            biological_scale: CELLULAR
            description: Copper-dependent regulated cell death, mechanistically distinct from other death
              pathways, in which copper binds lipoylated TCA-cycle components and the resulting protein
              aggregation and iron-sulfur cluster loss produce proteotoxic stress. Because the pathway
              depends on mitochondrial respiration, the review proposes that oxidative-phosphorylation-reliant
              alveolar type II epithelial cells and M2 macrophages are the vulnerable populations in COPD.
              That cell-type-specific prediction is the review's hypothesis, not an observation in COPD
              lung.
            cell_types:
            - preferred_term: Alveolar Type II Epithelial Cell
              term:
                id: CL:0002063
                label: pulmonary alveolar type 2 cell
            - preferred_term: anti-inflammatory M2 macrophage
              term:
