  0a8646f3fe1b91bf6cb5c1819d368dd0f63e8ee4cf29d18d90e4bfd586ae0716:
    claim:
      about:
        disease:
          name: Chronic_Obstructive_Pulmonary_Disease
          disease_term:
            preferred_term: chronic obstructive pulmonary disease
            term:
              id: MONDO:0005002
              label: chronic obstructive pulmonary disease
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: emerging_cuproptosis_metabolic_immune_axis
        hypothesis_label: Emerging Cuproptosis Metabolic-Immune Cell Death Axis
        status: EMERGING
        description: 'A 2026 review proposes that cuproptosis — copper-dependent regulated cell death
          driven by mitochondrial proteotoxic stress — is not a bystander consequence of COPD but an amplifier
          of it, running as a self-sustaining loop: smoke-induced disruption of pulmonary copper homeostasis
          permits cuproptotic death of alveolar epithelium and M2 macrophages, the resulting DAMP release
          drives neutrophilic inflammation and pro-inflammatory macrophage polarization, and that inflammation
          further impairs copper handling in surviving cells. The grouping exists to keep the edges of
          this loop distinguishable in the pathograph from the entry''s established protease/antiprotease
          and oxidative-stress mechanisms. The cuproptosis mechanism itself is established in human cells
          (PMID:35298263); what is hypothesized here is its operation in COPD lung. Its central vulnerability
          claim — that OXPHOS-dependent cells are the preferential targets — is stated by the authors
          as a prediction, and the review is a synthesis rather than a report of primary human COPD data.'
        notes: Contrast with the entry's other cell-death and inflammation nodes, which rest on primary
          human airway data. No competing hypothesis grouping is declared, because the established mechanisms
          in this entry are not framed as alternatives to this one — the axis is proposed as superimposed
          on them. No clinical trials of cuproptosis-directed therapy have been conducted in COPD, and
          no direct human COPD evidence for the axis is curated here because none is cited.
      selected_evidence:
        snippet: In this review, we advance the hypothesis that cuproptosis functions not merely as a
          passive consequence but as a critical amplifier within a self-sustaining "Metabolic-Immune Cell
          Death Axis" that drives disease chronicity and progression.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42604614
      reference_title: 'Cuproptosis: The metabolic-immune axis in chronic obstructive pulmonary disease
        pathogenesis and therapeutics.'
      evidence_source: OTHER
      explanation: The authors frame the axis as a hypothesis in their own words, which is what fixes
        this grouping's status as EMERGING rather than CANONICAL.
