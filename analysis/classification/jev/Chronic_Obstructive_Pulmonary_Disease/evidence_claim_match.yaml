        biological_scale: MOLECULAR
        description: Cigarette smoke disrupts copper handling in the lung, producing a microenvironment
          in which intracellular copper is no longer held below the threshold that homeostatic mechanisms
          normally maintain. This is the proposed initiating step of the cuproptosis arm and is a state
          of the copper-handling machinery, not yet cell death.
        biological_processes:
        - preferred_term: Copper Ion Homeostasis
          modifier: DYSREGULATED
          term:
            id: GO:0055070
            label: copper ion homeostasis
          description: 'DYSREGULATED rather than DECREASED: the claim is that homeostatic control of copper
            is lost and intracellular copper rises above its threshold, which is the qualitative case,
            not a process running below its normal level.'
        - preferred_term: stress response to copper ion
          term:
            id: GO:1990169
            label: stress response to copper ion
          description: 'The cellular response to the copper excess this node names. Carried over from
            the bundled node that PR #10119 merged to main; it belongs here rather than on the cuproptosis
            node because it is the response to copper itself and not the death programme that response
            can end in.'
        locations:
        - preferred_term: lung
          term:
            id: UBERON:0002048
            label: lung
        notes: Curated as a distinct node from the cuproptosis event it enables, because a change in copper
          handling is a molecular state and the death of a cell is not.
      selected_evidence:
        snippet: cigarette smoke actively disrupts pulmonary copper homeostasis, creating a microenvironment
          permissive for cuproptosis.
        supports: SUPPORT
