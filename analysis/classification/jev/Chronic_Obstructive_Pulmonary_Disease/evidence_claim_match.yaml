                label: M2 macrophage
            biological_processes:
            - preferred_term: Cuproptosis
              modifier: INCREASED
              term:
                id: GO:0160119
                label: cuproptosis
            - preferred_term: mitochondrial proteotoxic stress
              term:
                id: GO:0141164
                label: mitochondrial protein quality control
              description: Closest available binding for the mitochondrial proteotoxic stress the review
                names as the driver of cuproptosis. GO has no term for proteotoxic stress itself, so this
                names the machinery that stress acts on rather than the stress; a narrower term would
                be a new-term request.
            - preferred_term: oxidative phosphorylation
              term:
