      assertion_type: ModelMechanismLink
      assertion:
        target: Alveolar Destruction
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Repeated whole cigarette smoke exposure disintegrated the alveolar microvascular
          network. The informative control is that the epithelium itself stayed intact and that vascular
          networks exposed to smoke without an overlying epithelium were undamaged, which locates the
          vascular injury downstream of an epithelial signal rather than in direct smoke contact. This
          supports the vascular limb of the alveolar destruction in emphysema.
        limitations: The AEC2-dependence experiment rests on two donors and is described by the authors
          as preliminary; the mediating epithelial factors are unidentified. The model also captures capillary
          loss over days rather than the airspace enlargement and elastin degradation that define emphysema
          over decades, and it has no infiltrating leukocytes.
        readouts:
        - name: Integrity of the alveolar endothelial-pericyte vascular network
          target: Alveolar Destruction
          direction: DECREASED
          interpretation: Loss of continuous CD31-positive vessels after smoke exposure is the microvascular
            correlate of alveolar destruction.
        - name: Alveolar epithelial monolayer morphology after smoke exposure
          target: Alveolar Destruction
          direction: UNCHANGED
          interpretation: The directly exposed epithelium was preserved while the unexposed endothelium
            failed, a negative result that reverses the expected order of susceptibility.
      selected_evidence:
        snippet: These data are however still preliminary and need further repetition and expansion to
          identify AEC2-derived factors involved in the disintegration of the vascular networks upon smoke
          exposure.
        supports: SUPPORT
