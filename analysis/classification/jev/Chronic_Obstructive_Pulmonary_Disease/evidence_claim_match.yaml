      assertion_type: Discussion
      assertion:
        discussion_id: gap_copd_cuproptosis_direct_human_evidence
        prompt: Does cuproptosis actually occur in human COPD airway tissue, and are OXPHOS-dependent
          cells (alveolar type II epithelium, M2 macrophages) the preferentially vulnerable populations
          the metabolic-immune axis model predicts?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Pulmonary Copper Dyshomeostasis
        - pathophysiology#Cuproptosis of Alveolar Structural Cells
        rationale: 'The entire cuproptosis arm of this entry rests on one review, and that review''s own
          roadmap puts direct human evidence first among what is missing. The cell-type vulnerability
          claim is stated as a prediction from metabolic dependency rather than as an observation, so
          the cell-type bindings on the cuproptosis node (CL:0002063, CL:0000890) record what the model
          expects rather than what has been measured in patient tissue. Resolving this would need demonstration
          of the cuproptosis signature — copper-dependent aggregation of lipoylated mitochondrial proteins
          and Fe-S cluster loss — in COPD lung with the affected cells identified, which would move the
          emerging_cuproptosis_metabolic_immune_axis grouping toward established status or refute it.
          The related therapeutic question is separately blocked: every proposed copper chelator, ionophore,
          nanoplatform and PROTAC sensitizer is preclinical, so none is curated under treatments.'
        notes: 'Seeded from PMID:42604614 alongside the cuproptosis node added in #10119. Retargeted from
          that PR''s single `Cuproptosis-Driven Cell Death` node onto the two nodes of this entry''s split
          chain that carry the claims the gap is about — the copper-handling step and the cell-death step.'
      selected_evidence:
        snippet: we emphasize that all these approaches remain at preclinical or early exploratory stages,
          with no clinical trials yet conducted in COPD
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
