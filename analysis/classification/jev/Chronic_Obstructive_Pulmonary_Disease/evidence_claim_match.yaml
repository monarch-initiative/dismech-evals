          value:
            target: Alveolar Destruction
            relationship: PARTIALLY_RECAPITULATES
            fidelity: MODERATE
            description: Repeated whole cigarette smoke exposure disintegrated the alveolar microvascular
              network. The informative control is that the epithelium itself stayed intact and that vascular
              networks exposed to smoke without an overlying epithelium were undamaged, which locates
              the vascular injury downstream of an epithelial signal rather than in direct smoke contact.
              This supports the vascular limb of the alveolar destruction in emphysema.
            limitations: The AEC2-dependence experiment rests on two donors and is described by the authors
              as preliminary; the mediating epithelial factors are unidentified. The model also captures
              capillary loss over days rather than the airspace enlargement and elastin degradation that
              define emphysema over decades, and it has no infiltrating leukocytes.
          role: ancestor
