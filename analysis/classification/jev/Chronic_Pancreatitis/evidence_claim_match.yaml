      assertion_type: Genetic
      assertion:
        name: SPINK1
        gene_term:
          preferred_term: SPINK1
          term:
            id: hgnc:11244
            label: SPINK1
        association: Risk Factor
        relationship_type: RISK_FACTOR
        notes: 'Kazal-type inhibitor of trypsin, wired to the Premature Intrapancreatic Trypsinogen Activation
          node on that basis. The biochemistry is settled; the disease mechanism of the common N34S allele
          is not, and the refuting evidence item below records why: N34S does not impair SPINK1''s inhibition
          of trypsin in vitro. The same review states that whether loss of SPINK1 changes trypsin activity
          in the pancreas is unknown at all, which is quoted on the Premature Intrapancreatic Trypsinogen
          Activation node. The allele has instead been linked to the SPINK1 enhancer, suggesting reduced
          transcription rather than a defective inhibitor.'
        case_fractions:
        - population: North Indian tropical calcific pancreatitis cohort
          case_fraction_percent: 44.0
          cohort_size: 66
          notes: N34S carrier rate among 66 unrelated tropical calcific pancreatitis patients, against
            2.2% of 92 healthy controls. This is the share for the Tropical Pancreatitis subtype row of
            this entry, not for chronic pancreatitis as a whole.
      selected_evidence:
        snippet: 'Pathogenic and likely-pathogenic variants associated with the risk of CP development
          were identified in the following genes: CTRC (37.1% of patients), CFTR (18.1%), SPINK1 (8.6%),
          PRSS1 (8.6%), and CPA1 (6.7%).'
        supports: SUPPORT
    origin:
      assertion_path: /genetic/1
      evidence_path: /genetic/1/evidence/0
      context_paths:
