      assertion_type: Pathophysiology
      assertion:
        name: Premature Intrapancreatic Trypsinogen Activation
        conforms_to: pancreatitis_acinar_autodigestion#Premature Intra-Acinar Trypsinogen Activation
        biological_scale: MOLECULAR
        description: 'The trypsin-dependent arm of genetic susceptibility to chronic pancreatitis. Trypsinogen
          is normally activated only in the duodenum; intrapancreatic conversion to trypsin is held in
          check by the Kazal-type inhibitor SPINK1 and by chymotrypsin C (CTRC), which degrades trypsinogen
          in concert with trypsin. PRSS1 gain-of-function variants raise intrapancreatic trypsin both
          by accelerating trypsinogen autoactivation and by making trypsinogen less susceptible to CTRC-dependent
          degradation, and loss of CTRC removes the same degradative step. This is the pathway the three
          protease-balance genes curated in this entry (PRSS1, CTRC, SPINK1) share, and the reason they
          are modelled on one node rather than separately.

          The node asserts the pathway, not its causal primacy. The review cited here concludes that intrapancreatic
          trypsin is at most a mediator of pancreatitis responses rather than the initiating culprit,
          and that whether loss of SPINK1 changes trypsin activity in the pancreas is still unknown. Both
          statements are carried as refuting evidence below, so the node is not read as a stronger claim
          than its sources support.

          '
        cell_types:
        - preferred_term: Pancreatic Acinar Cell
          term:
            id: CL:0002064
            label: pancreatic acinar cell
        molecular_functions:
        - preferred_term: trypsin activity within the pancreas
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
          modifier: INCREASED
        - preferred_term: SPINK1-mediated trypsin inhibition
          term:
            id: GO:0004867
            label: serine-type endopeptidase inhibitor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: Trypsinogen Activation
          term:
            id: GO:0031638
            label: zymogen activation
          modifier: INCREASED
        - preferred_term: Intrapancreatic Proteolysis
          term:
            id: GO:0006508
            label: proteolysis
          modifier: INCREASED
        genes:
        - preferred_term: PRSS1
          term:
            id: hgnc:9475
            label: PRSS1
        - preferred_term: CTRC
          term:
            id: hgnc:2523
            label: CTRC
        - preferred_term: SPINK1
          term:
            id: hgnc:11244
            label: SPINK1
      selected_evidence:
        snippet: Restoring CTRC locus in C57BL/6 mice reduced trypsinogen activation in CER-AP, demonstrating
          CTRC's protective role against intrapancreatic trypsin accumulation in experimental pancreatitis
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
