      assertion_type: Pathophysiology
      assertion:
        name: Cortisol Deficiency and Loss of HPA Feedback
        description: Loss of cortisol output removes negative feedback on the hypothalamic-pituitary-adrenal
          axis, driving compensatory hypersecretion of corticotropin-releasing hormone and ACTH. Because
          ACTH is processed from the POMC precursor that also yields alpha- and gamma-melanocyte stimulating
          hormones, sustained POMC over-production produces the characteristic hyperpigmentation of CPAI.
          Loss of cortisol also impairs gluconeogenesis and stress responses, contributing to hypoglycemia
          and reduced vascular tone.
        biological_processes:
        - preferred_term: glucocorticoid metabolic process
          term:
            id: GO:0008211
            label: glucocorticoid metabolic process
          modifier: DECREASED
        - preferred_term: gluconeogenesis
          term:
            id: GO:0006094
            label: gluconeogenesis
          modifier: DECREASED
        locations:
