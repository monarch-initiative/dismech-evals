              id: MONDO:0015129
              label: chronic primary adrenal insufficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aldosterone Deficiency and RAAS Disinhibition
        description: 'Loss of aldosterone output from a damaged zona glomerulosa disinhibits the renin-angiotensin-aldosterone
          system — plasma renin activity rises in response to volume depletion — but the absent adrenal
          response leaves sodium retention impaired and renal potassium excretion reduced. The result
          is the characteristic mineralocorticoid-deficient electrolyte phenotype of CPAI: hyponatremia,
          volume depletion with hypotension, and hyperkalemia.'
        biological_processes:
        - preferred_term: mineralocorticoid biosynthetic process
          term:
            id: GO:0006705
            label: mineralocorticoid biosynthetic process
          modifier: DECREASED
        locations:
        - preferred_term: zona glomerulosa of adrenal gland
          term:
            id: UBERON:0002053
            label: zona glomerulosa of adrenal gland
      selected_evidence:
        snippet: Elevated plasma levels of adrenocorticotropin and renin confirm the diagnosis.
        supports: SUPPORT
    origin:
