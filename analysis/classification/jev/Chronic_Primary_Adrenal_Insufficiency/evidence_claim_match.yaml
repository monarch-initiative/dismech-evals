      assertion_type: Pathophysiology
      assertion:
        name: Adrenal Cortex Destruction
        description: 'Across CPAI etiologies, the proximal lesion is loss of the steroidogenic cells of
          the adrenal cortex (zona fasciculata for cortisol, zona glomerulosa for aldosterone, zona reticularis
          for adrenal androgens). Mechanisms differ by subtype: immune-mediated destruction by autoreactive
          T cells and 21-hydroxylase autoantibodies in autoimmune adrenalitis; granulomatous destruction
          in tuberculosis; very long chain fatty acid accumulation and cell dysfunction in X-ALD; impaired
          adrenal organogenesis in adrenal hypoplasia congenita; ACTH signalling failure in familial glucocorticoid
          deficiency; or physical replacement of cortex by hemorrhage, metastasis, or infiltrate.'
        cell_types:
