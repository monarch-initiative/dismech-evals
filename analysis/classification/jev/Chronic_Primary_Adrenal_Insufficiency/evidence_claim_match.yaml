        name: Adrenal Crisis
        description: Adrenal crisis is the acute, life-threatening decompensation of adrenal insufficiency,
          characterized by severe hypotension or shock, hyponatremia, hyperkalemia, hypoglycemia, and
          often fever and abdominal symptoms. It is typically precipitated by intercurrent illness, surgery,
