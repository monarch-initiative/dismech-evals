              label: chronic recurrent multifocal osteomyelitis
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Diagnosis of Exclusion
        description: Until the 2025 classification criteria there were no prospectively tested, widely
          accepted diagnostic criteria and no disease biomarker, so CNO was and largely remains a diagnosis
          of exclusion. Infection and malignancy are the two exclusions that matter most - a solitary
          lesion in particular can be indistinguishable from bacterial osteomyelitis or from a bone tumour
          without biopsy. The absence of a biomarker is not a gap in this entry's sourcing; it is a stated
          property of the disease.
        diagnosis_term:
          preferred_term: diagnosis of exclusion
      selected_evidence:
        snippet: In the absence of prospectively tested and widely accepted diagnostic criteria or disease
          biomarkers, CNO remains a diagnosis of exclusion, and infections, malignancy and other differentials
          require consideration
        supports: SUPPORT
