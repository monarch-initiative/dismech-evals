      assertion_type: Genetic
      assertion:
        name: FBLIM1
        relationship_type: SUSCEPTIBILITY
        gene_term:
          preferred_term: FBLIM1
          term:
            id: hgnc:24686
            label: FBLIM1
        association: The only susceptibility gene reported for sporadic CNO, and the reason the entry
          does not claim the disease has no genetic component - it has no established Mendelian cause,
          which is a different statement. Two biallelic hits in the filamin-binding domain were found
          by exome sequencing in unrelated South Asian patients. FBLIM1 is proposed to act as an anti-inflammatory
          brake on bone remodelling through regulation of RANKL activation, which places it on the same
          osteoclast arm the bisphosphonates target.
      selected_evidence:
        snippet: in the filamin-binding domain of the FBLIM1 gene were detected in unrelated CNO patients
          from South Asia
        supports: SUPPORT
