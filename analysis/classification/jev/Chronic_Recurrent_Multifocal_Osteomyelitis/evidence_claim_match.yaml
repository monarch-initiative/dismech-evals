      assertion_type: Pathophysiology
      assertion:
        name: Innate Immune Signalling Dysregulation
        biological_scale: MOLECULAR
        description: The upstream lesion, and the one the literature is least certain about. Variable
          defects in the TLR4/MAPK/inflammasome signalling cascade are implicated. No single causal gene
          is established for sporadic CNO/CRMO - unlike its monogenic mimics - so this node describes
          a class of defects rather than one.
      selected_evidence:
        snippet: it appears likely that variable defects in the TLR4/MAPK/inflammasome signaling cascade
          result in an imbalance between pro- and anti-inflammatory cytokine expressions in monocytes
          from CNO/CRMO patients
        supports: SUPPORT
    origin:
