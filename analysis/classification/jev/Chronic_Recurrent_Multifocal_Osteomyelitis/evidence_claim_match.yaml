      assertion:
        target: Sterile Osteoinflammation
        treatment_effect: INHIBITS
        description: Bisphosphonates suppress the osteoclastic bone resorption driven by the pro-inflammatory
          cytokine milieu, without correcting the upstream innate signalling defect.
