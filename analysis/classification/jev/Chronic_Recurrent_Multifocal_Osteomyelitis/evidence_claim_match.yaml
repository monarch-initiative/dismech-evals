      assertion_type: DifferentialDiagnosis
      assertion:
        name: Bacterial osteomyelitis
        description: The differential the disease is named against. Imaging and histology can look identical,
          and it is an explicit exclusion criterion in the 2025 classification criteria. Distinguishing
          them is what the entire diagnostic workup exists to do, and getting it wrong in either direction
          is harmful - antibiotics for CNO, or immunosuppression for an untreated infection.
        distinguishing_features:
        - No causative organism is isolated in CNO
        - CNO lesions do not respond to antibiotics
        - CNO is typically multifocal and symmetrical with a waxing and waning course
      selected_evidence:
        snippet: exclusion criteria of malignancy, infection, vitamin C deficiency, and hypophosphatasia
        supports: SUPPORT
