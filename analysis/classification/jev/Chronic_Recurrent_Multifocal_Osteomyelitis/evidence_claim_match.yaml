        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Majeed syndrome
        description: A monogenic autoinflammatory syndrome (LPIN2) whose features include CRMO alongside
          congenital dyserythropoietic anaemia and, in some patients, a neutrophilic dermatosis. It is
          the reason a child with CRMO plus unexplained anaemia should be considered for genetic evaluation
          rather than treated as sporadic disease.
        distinguishing_features:
        - Majeed syndrome pairs CRMO with congenital dyserythropoietic anaemia from early infancy
        - Monogenic and inherited, versus sporadic CNO with no established causal gene
        - Onset is characteristically early with a lifelong course
        - 'Treatment response separates the two: Majeed is an IL-1-beta-mediated disease that responds
          to IL-1 blockade while TNF-alpha blockers have almost no effect, whereas in sporadic CNO/CRMO
          anti-TNF agents are reported to be highly effective in a significant percentage of patients'
      selected_evidence:
        snippet: TNFα blockers have almost no effect
        supports: SUPPORT
