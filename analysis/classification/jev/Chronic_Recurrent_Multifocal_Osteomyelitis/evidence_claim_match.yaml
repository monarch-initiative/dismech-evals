      assertion:
        name: Escalation Therapy
        description: 'For patients who do not respond adequately to NSAIDs: corticosteroids, disease-modifying
          anti-rheumatic drugs and cytokine-blocking agents. Corticosteroids control inflammatory activity
          quickly but rarely induce long-term remission, so they function as a bridge rather than as maintenance.
          Anti-TNF agents are reported to be highly effective in a significant percentage of patients,
          though every report is retrospective and small, which is why the evidence base - not the drug
          class - is the limiting factor here.'
