  c58767d3cb373084cc85aab0c71adcf87ad5407e18cdf4bd0b3723b0b272ca4c:
    claim:
      about:
        disease:
          name: Chronic Recurrent Multifocal Osteomyelitis
          disease_term:
            preferred_term: chronic recurrent multifocal osteomyelitis
            term:
              id: MONDO:0009813
              label: chronic recurrent multifocal osteomyelitis
        context: []
      assertion_type: Genetic
      assertion:
        name: IL10
        relationship_type: MODIFIER
        gene_term:
          preferred_term: IL10
          term:
            id: hgnc:5962
            label: IL10
        association: 'Promoter haplotypes at rs1800896/rs1800871/rs1800872 set IL-10 expression capacity,
          and IL-10 drives STAT3, which in turn regulates FBLIM1 - so the two genetic findings in this
          disease sit on one axis rather than two. The direction of the cohort finding is counterintuitive
          and is curated as reported: high-expression (GCC) haplotypes were the ones over-represented
          in CRMO, not low-expression ones.'
        notes: Two tensions are left visible rather than resolved. First, the entry curates IL-10 production
          as DECREASED at the cellular level while this cohort reports over-representation of high-expression
          germline haplotypes; these are different measurements - monocyte output in disease versus promoter
          capacity - but the tension is real. Second, the review's own reconciliation, that low-expression
          carriers may present as other inflammatory conditions and so never be diagnosed as CNO, is explicitly
          flagged there as an unconfirmed hypothesis, so it is recorded as such and not curated as mechanism.
      selected_evidence:
        snippet: IL-10 expression is predetermined by genetic variants within the IL10 proximal promoter
          region.
        supports: SUPPORT
