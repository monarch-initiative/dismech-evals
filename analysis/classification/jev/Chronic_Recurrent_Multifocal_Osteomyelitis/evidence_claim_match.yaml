          value:
            name: Bisphosphonate Therapy
            description: 'Curated as its own node rather than folded into generic escalation because its
              target differs from the rest of the escalation ladder: bisphosphonates act on the osteoclast-mediated
              bone resorption arm rather than on cytokine signalling. It is prioritised where vertebral
              bodies are involved, which is also where the disease does its irreversible structural damage.
              As with every treatment here the evidence is retrospective and small - the cited review
              states plainly that large prospective trials to determine the best medication are lacking.'
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
