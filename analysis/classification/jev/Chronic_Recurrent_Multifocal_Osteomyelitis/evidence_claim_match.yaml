      assertion_type: Definition
      assertion:
        name: EULAR/ACR 2025 classification criteria for paediatric chronic nonbacterial osteomyelitis
        definition_type: PHENOTYPE_ALGORITHM
        derivation_basis: ESTABLISHED_CRITERIA
        description: 'Jointly developed EULAR/ACR classification criteria for paediatric CNO. The structure
          mirrors the disease''s diagnostic problem: an obligatory entry requirement of typical radiographic
          or MRI findings plus bone pain, then explicit exclusion of malignancy, infection, vitamin C
          deficiency and hypophosphatasia, and only then additive weighted scoring across five clinical
          domains (site and pattern of bone lesions, age at onset, coexisting conditions, fever) and four
          pathology/laboratory domains (bone biopsy findings if performed, anaemia, C-reactive protein,
          erythrocyte sedimentation rate). A total score of at least 55 classifies as CNO.

          These are classification criteria, developed for research cohort definition, not diagnostic
          criteria for individual patient care - a distinction the entry preserves because they are not
          interchangeable.'
        validation_status:
          status: VALIDATED_AGAINST_GOLD_STANDARD
          rationale: Weights and threshold were refined in a development cohort of 441 patients and tested
            in a separate validation cohort of 514 patients, achieving 82% sensitivity and 98% specificity.
            The high specificity relative to sensitivity is consistent with criteria built around exclusion.
      selected_evidence:
        snippet: The new EULAR/ACR classification criteria for CNO require typical radiographic or magnetic
          resonance imaging findings and bone pain as an obligatory entry criterion and exclusion criteria
          of malignancy, infection, vitamin C deficiency, and hypophosphatasia, followed by additive weighted
          criteria in 5 clinical (site of bone lesions, pattern of bone lesions, age at onset, coexisting
          conditions, fever) and 4 pathology/laboratory domains (bone biopsy findings if done, anaemia,
          C-reactive protein level, and erythrocyte sedimentation rate).
        supports: SUPPORT
