      assertion:
        name: Repetitive Head Trauma
        description: The initiating exposure is repeated concussive and subconcussive head impacts sustained
          over years, as in contact sports, military blast injury, and other causes of recurrent head
          trauma. This mechanical exposure triggers the downstream neurodegenerative tauopathy after a
          long latency.
        role: trigger
      selected_evidence:
        snippet: Chronic traumatic encephalopathy (CTE) is a form of neurodegeneration believed to result
          from repeated head injuries.
        supports: SUPPORT
