      assertion_type: Pathophysiology
      assertion:
        name: Perivascular Hyperphosphorylated Tau Pathology
        description: The pathognomonic lesion of CTE is the accumulation of abnormal hyperphosphorylated
          tau (p-tau) in neurons and astroglia clustered around small blood vessels at the depths of cortical
          sulci in an irregular pattern. This perivascular, sulcal-depth distribution distinguishes CTE
          from other tauopathies such as Alzheimer disease and progressive supranuclear palsy.
        role: central_effector
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: inclusion body assembly
          term:
            id: GO:0070841
            label: inclusion body assembly
          modifier: INCREASED
      selected_evidence:
        snippet: Chronic traumatic encephalopathy (CTE) is a neurodegeneration characterized by the abnormal
          accumulation of hyperphosphorylated tau protein within the brain.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
