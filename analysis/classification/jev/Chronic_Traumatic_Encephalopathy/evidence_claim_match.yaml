      assertion:
        name: TDP-43 Proteinopathy
        conforms_to: tdp43_proteinopathy#Cytoplasmic TDP-43 Aggregation
        description: 'Beyond the dominant tauopathy, CTE shows supportive TDP-43 proteinopathy: TDP-43-immunoreactive
          neuronal cytoplasmic inclusions in the hippocampus, anteromedial temporal cortex, and amygdala.
          This places CTE within the family of TDP-43 proteinopathies and is mechanistically relevant
          to the motor neuron disease seen in a subset of cases.'
        role: amplifier
