          modifier: INCREASED
      selected_evidence:
        snippet: Supportive non-p-tau pathologies include TDP-43 immunoreactive neuronal cytoplasmic inclusions
          and dot-like structures in the hippocampus, anteromedial temporal cortex and amygdala.
        supports: SUPPORT
