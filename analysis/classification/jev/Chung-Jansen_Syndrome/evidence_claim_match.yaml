                syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: chromatin_reader_crl4_recruitment
        hypothesis_label: Trivalent Chromatin Reading and CRL4 Recruitment Failure Branch
        status: CANONICAL
        description: The canonical molecular lesion is loss of PHIP's activity as a multivalent chromatin
          reader. PHIP engages the nucleosome through three coordinated reader surfaces - a Tudor domain
          reading H3K4 methylation, BD1 reading H3K14ac, and BD2 reading H4K12ac - and it is this chromatin
          engagement that allows PHIP to act as the substrate receptor recruiting the CRL4 ubiquitin ligase
          to chromatin. Disease-associated PHIP variants map into each reader domain and into the linker
          between them, and are predicted to disrupt chromatin binding. This is the branch that makes
          CHUJANS a chromatinopathy rather than a generic NDD, and it is corroborated at the patient level
          by the disorder's DNA methylation episignature and by that signature's overlap with the PHF6
          and DDB1 disorders.
      selected_evidence:
        snippet: PHIP binds to chromatin through a trivalent reader domain consisting of a H3K4-methyl
          binding Tudor domain and two bromodomains (BD1 and BD2).
        supports: SUPPORT
    origin:
