        biological_processes:
        - preferred_term: positive regulation of POMC transcription by RNA polymerase II
          term:
            id: GO:0045944
            label: positive regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: In cells, we found that nuclear PHIP (pleckstrin homology domain interacting protein)
