      assertion_type: Diagnosis
      assertion:
        name: DNA methylation episignature testing
        description: 'A specific and sensitive DNA methylation episignature for Chung-Jansen syndrome
          has been defined on Infinium Methylation EPIC arrays from patient blood. Its practical role
          is variant interpretation: it can reclassify PHIP variants of uncertain significance and can
          be deployed within a multiclass episignature classifier. Because the CHUJANS signature partially
          overlaps those of DDB1- and PHF6-related disorders, a combined signature for the three has also
          been developed, which means an episignature result should be read as evidence about this functional
          group rather than as a fully orthogonal single-gene test.'
        diagnosis_term:
          preferred_term: DNA methylation episignature analysis
          term:
            id: NCIT:C63328
            label: DNA Methylation Analysis
        results: A positive Chung-Jansen episignature supports pathogenicity of a PHIP variant of uncertain
          significance.
      selected_evidence:
        snippet: These newly defined episignatures can be used as part of a multiclass episignature classifier
          for screening of affected individuals with rare disorders and interpretation of genetic variants
          of unknown clinical significance
        supports: SUPPORT
