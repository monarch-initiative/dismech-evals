        name: Trio exome or genome sequencing
        description: Diagnosis is molecular. The facial gestalt is suggestive but not pathognomonic, intellectual
          disability is often mild, and obesity is neither congenital nor obligatory, so CHUJANS is normally
          identified by trio exome or genome sequencing performed for developmental delay rather than
          by targeted testing. PHIP should be on neurodevelopmental and syndromic-obesity panels. Trio
          (rather than proband-only) testing matters disproportionately here because a meaningful minority
          of alleles are inherited from a parent whose own mild learning, behavioral, or weight phenotype
          is recognized only in retrospect.
        diagnosis_term:
          preferred_term: trio exome or genome sequencing
