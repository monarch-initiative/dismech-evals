          disability with central obesity, muscle wasting, and dysmorphism - an overlap that was itself
          used as an argument that PHIP acts through the ubiquitin ligase pathway. Discriminators are
          the X-linked inheritance and male predominance of the CUL4B disorder; facial phenotyping also
          separates the two.'
