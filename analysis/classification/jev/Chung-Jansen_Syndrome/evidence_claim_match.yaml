      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: replication_stress_genome_integrity
        hypothesis_label: Replication Fork Protection / Genome Integrity Branch
        status: EMERGING
        description: Full-length PHIP is also DCAF14, a replication stress response protein. Two CHUJANS
          missense variants in different functional elements (the WD40 repeat domain and the pleckstrin-homology-binding
          region) both cause defective replication fork progression under replication stress and fail
          to complete DNA replication after genotoxic insult. Whether this replication-associated genome
          instability contributes to the clinical phenotype - as opposed to being a parallel consequence
          of the same protein loss - is unresolved; no CHUJANS-specific cancer predisposition or chromosome-instability
          clinical phenotype has been established.
      selected_evidence:
        snippet: Using DNA fiber assays, we reveal that cells expressing either variant exhibit defective
          replication fork progression in conditions of replication stress.
        supports: SUPPORT
