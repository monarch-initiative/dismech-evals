        description: PHIP (as DCAF14) is one of several substrate receptors of the CUL4-DDB1 (CRL4) E3
          ubiquitin ligase, and it is specifically the chromatin-associated one - PHIP is required for
          CRL4 to be recruited to chromatin at all. Reduced PHIP dose therefore removes chromatin-localized
          CRL4 activity, with consequences for ubiquitin-dependent turnover of chromatin substrates and
          for chromatin-templated transcription. The clinical corroboration of this node is the phenotypic
          overlap of PHIP loss with CUL4B deficiency, which likewise causes intellectual disability with
          central obesity and dysmorphism.
