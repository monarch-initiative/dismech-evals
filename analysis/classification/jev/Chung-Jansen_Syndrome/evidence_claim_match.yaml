        name: Chung-Jansen DNA Methylation Episignature
        description: Affected individuals carry a specific and sensitive genome-wide DNA methylation signature
          detectable on Infinium Methylation EPIC arrays. Two things make this more than a diagnostic
          convenience. First, it is direct patient-level (not cell-line) evidence that PHIP haploinsufficiency
          perturbs the epigenome, which is the prediction of the chromatin-reader model. Second, the CHUJANS
          signature partially overlaps those of White-Kernohan syndrome (DDB1 - the very CRL4 adaptor
          that PHIP docks onto) and Borjeson-Forssman-Lehmann syndrome (PHF6, another chromatin-associated
          NDD protein), so the shared episignature independently recovers the functional relationship
          rather than merely the clinical resemblance.
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: We assessed the DNAm profiles of affected individuals with pathogenic and likely pathogenic
          PHIP variants with Infinium Methylation EPIC arrays and report a specific and sensitive DNAm
          episignature biomarker for Chung-Jansen syndrome.
        supports: SUPPORT
