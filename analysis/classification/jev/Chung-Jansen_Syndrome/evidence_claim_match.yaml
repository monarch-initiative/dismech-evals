      assertion:
        name: Repressed POMC Transcription
        description: PHIP has nuclear and cytoplasmic pools, and it is the nuclear pool that acts on POMC.
          Nuclear PHIP directly enhances transcription of pro-opiomelanocortin, the precursor from which
          the anorexigenic melanocortin peptides are cleaved, and obesity-associated PHIP variants repress
          that transcription. The physiological setting is the hypothalamic arcuate POMC neuron, the first-order
          anorexigenic node of the leptin-melanocortin pathway; the experimental demonstration, however,
          was in cells rather than in human hypothalamic neurons, which is the principal limitation of
          this arm.
        biological_scale: MOLECULAR
