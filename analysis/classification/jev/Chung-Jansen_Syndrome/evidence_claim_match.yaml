      assertion_type: Diagnosis
      assertion:
        name: Copy-number analysis by chromosomal microarray or exome CNV calling
        description: Sequence-level analysis alone will miss a real fraction of cases. Intragenic, whole-gene,
          and contiguous 6q14.1 deletions encompassing PHIP are an established route to the phenotype,
          and microdeletions including PHIP were part of the original evidence that the mechanism is loss
          of function. Copy-number analysis should therefore run in parallel with sequencing, with qPCR
          or FISH used to confirm a detected deletion and test parental segregation.
        diagnosis_term:
          preferred_term: chromosomal microarray analysis
          term:
            id: NCIT:C18477
            label: Microarray Analysis
        results: A heterozygous deletion involving PHIP establishes the diagnosis; a deletion extending
          well beyond PHIP predicts additional features from co-deleted genes.
      selected_evidence:
        snippet: technologies such as exome sequencing or array analyses have led to the identification
          of distinct types of alterations of PHIP
