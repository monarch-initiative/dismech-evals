          one in the pleckstrin-homology-binding region - both cause defective replication fork progression
          under replication stress and both fail to complete DNA replication after genotoxic exposure,
          implicating DCAF14 in the protection of stalled forks. The authors accordingly predict replication-associated
          genome instability in CHUJANS. Note that this is a prediction: no clinical instability phenotype
          (cancer predisposition, chromosome breakage) has been demonstrated in CHUJANS patients, so this
          node is modelled as a cellular defect without a curated clinical consequence.'
