              id: MONDO:0035133
              label: PHIP-related behavioral problems-intellectual disability-obesity-dysmorphic features
                syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pomc_melanocortin_repression
        hypothesis_label: POMC Repression / Central Melanocortin Branch
        status: EMERGING
        description: 'The obesity arm has its own, mechanistically distinct and comparatively well-developed
          model: nuclear PHIP directly enhances transcription of POMC, the precursor of the anorexigenic
          melanocortin peptides, and obesity-associated PHIP variants repress POMC transcription - linking
          PHIP dosage to central leptin-melanocortin satiety signaling. The status is EMERGING rather
          than CANONICAL because the demonstration is cell-based rather than in human hypothalamic POMC
          neurons, and because obesity is not fully penetrant in CHUJANS. This branch is not a competitor
          to the chromatin-reader branch; it is plausibly a tissue-specific readout of the same transcriptional-coactivator
          deficit, but that connection has not been shown directly.'
      selected_evidence:
        snippet: In cells, we found that nuclear PHIP (pleckstrin homology domain interacting protein)
          directly enhances transcription of pro-opiomelanocortin (POMC), a neuropeptide that suppresses
          appetite. Obesity-associated PHIP variants repressed POMC transcription.
        supports: SUPPORT
