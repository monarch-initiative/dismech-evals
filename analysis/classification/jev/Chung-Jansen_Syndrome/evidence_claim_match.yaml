                syndrome
        context: []
      assertion_type: Phenotype
      assertion:
        category: Metabolic
        name: Obesity and Overweight
        frequency: FREQUENT
        description: 'Overweight or obesity affects a slight majority of individuals and is the feature
          that gave the syndrome its historical acronyms (DIDOD, BIDOD, ID-overweight syndrome). Crucially
          it is neither congenital nor obligatory: it emerges between early childhood and puberty, becomes
          more prevalent in the over-12 age group, and is absent in a sizeable minority - one independent
          cohort explicitly reported a lower obesity frequency than earlier series. Weight should therefore
          not be used as a gatekeeping criterion for testing. The bound term is the increased-body-weight
          parent rather than obesity alone because every cohort denominator behind the frequency band
          pools overweight with obesity (55.8%, 13/23, "weight problems"). Documented obesity-driven complications
          - obstructive sleep apnea, impaired glucose tolerance, and oligomenorrhea - are listed as sequelae
          below.'
        phenotype_term:
          preferred_term: Overweight or obesity
          term:
            id: HP:0004324
            label: Increased body weight
          clinical_course: PROGRESSIVE
      selected_evidence:
        snippet: Overall, 55.8% of individuals were obese/overweight.
        supports: SUPPORT
