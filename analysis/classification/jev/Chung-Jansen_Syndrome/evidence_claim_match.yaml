  fd6dfb4f9a20b57b3d38e7ed5bb0c51baa295f56fa414bba531001dce310eae8:
    claim:
      about:
        disease:
          name: Chung-Jansen Syndrome
          disease_term:
            preferred_term: Chung-Jansen syndrome
            term:
              id: MONDO:0035133
              label: PHIP-related behavioral problems-intellectual disability-obesity-dysmorphic features
                syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: PHIP Pathogenic Variants
        gene_term:
          preferred_term: PHIP
          term:
            id: hgnc:15673
            label: PHIP
        association: Causative
        presence: Positive
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: PHIP lies at 6q14.1. Reported pathogenic alleles are heterozygous and span nonsense, frameshift,
          splice-site, and missense substitutions plus intragenic, whole-gene, and contiguous deletions;
          the 2022 European cohort used NM_017934.7 as the reference transcript. There is no mutational
          hotspot, and the facial gestalt does not discriminate variant class, so genotype-based prognostication
          is not currently possible. The locus produces more than one protein product (PHIP/DCAF14 and
          NDRP) and the genotype-phenotype evidence assigns causality to loss of PHIP/DCAF14. Contiguous
          deletions extending beyond PHIP can blend in features attributable to co-deleted neighbouring
          genes, and dual molecular diagnoses have been reported (one patient carried pathogenic variants
          in both PHIP and CLCN4), so an atypically severe presentation warrants looking beyond the PHIP
          allele rather than assuming expressivity.
      selected_evidence:
        snippet: Amongst these, PHIP was shown to have an enrichment of disruptive mutations in the individuals
          with ID (5 out of 3,275).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
