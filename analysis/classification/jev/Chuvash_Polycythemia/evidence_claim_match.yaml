  6b22db40a901b4046a566ebb9fee707b0c8f54f39c467f2f0f3b20efa722f8ed:
    claim:
      about:
        disease:
          name: Chuvash Polycythemia
          disease_term:
            preferred_term: Chuvash Polycythemia
            term:
              id: MONDO:0009892
              label: Chuvash polycythemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Normoxic HIF-alpha Stabilization
        biological_scale: MOLECULAR
        description: 'HIF-1-alpha and HIF-2-alpha accumulate and dimerize with HIF-1-beta at normal oxygen
          tension. The cell believes it is short of oxygen while sitting in ordinary room air, which is
          why the whole phenotype reads as permanent altitude acclimatization. Both isoforms are elevated
          in patients, but they are not interchangeable: mouse genetics show heterozygosity for Hif2a,
          and not Hif1a, suppresses both the polycythemia and the pulmonary hypertension, so HIF-2-alpha
          is the dominant effector for the erythroid and pulmonary-vascular arms.'
        biological_processes:
        - preferred_term: normoxic hypoxia response
          term:
            id: GO:0001666
            label: response to hypoxia
          modifier: GAIN_OF_FUNCTION
      selected_evidence:
        snippet: VHL(R200W) homozygotes have elevated hypoxia-inducible factor 1α (HIF-1α) and HIF-2α
          levels, increased red cell mass, propensity to thrombosis, and early mortality.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
