          value:
            name: VhlR200W knock-in mouse
            species: Mouse
            genotype: Vhl R200W homozygous knock-in
            description: A knock-in mouse homozygous for the same R200W substitution, and the workhorse
              of the field. It recapitulates the polycythemia, the enhanced normoxic respiration, and
              the pulmonary hypertension, and it has been the system in which the isoform question, the
              therapeutic questions, and the pulmonary-versus-erythroid independence question were all
              settled.
            publication: PMID:20197624
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Pulmonary Vascular Tone and Remodeling
        relationship: RECAPITULATES
        fidelity: HIGH
        description: The mouse develops pulmonary hypertension independently of the polycythemia, with
          vascular remodeling, hemorrhage, edema, and macrophage infiltration, and Hif2a heterozygosity
          suppresses it. This is what establishes the pulmonary arm as a parallel branch rather than a
          consequence of the raised hematocrit.
        limitations: Older mice additionally develop pulmonary fibrosis, which is not a documented feature
          of the human disease, so the model overshoots on that axis. Mouse pulmonary vascular physiology
          differs from human, and the inflammatory component was not suppressed by Hif2a heterozygosity
          even though the vascular changes were.
