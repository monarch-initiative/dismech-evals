        kind: KNOWLEDGE_GAP
        prompt: Does any current management of Chuvash erythrocytosis change outcome?
        attaches_to:
        - treatments#Therapeutic Phlebotomy
        rationale: There are no randomized trials in this disease. Everything in the treatments section
          is cohort inference, expert opinion, mouse data, or single cases. The two most-used interventions,
          phlebotomy and aspirin, have both failed to show benefit in retrospective analysis, and phlebotomy
          is additionally associated with harm on two separate axes. The authors of the definitive cohort
          work called for prospective study two decades ago and it has not happened.
      selected_evidence:
        snippet: Retrospective analyses among patients with Chuvash polycythemia have not shown benefit
          for therapy with phlebotomy or aspirin, but these and other modes of therapy should be studied
          prospectively.
        supports: SUPPORT
