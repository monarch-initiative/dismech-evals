          six index subjects in the original Chuvash series were all under 20 years old. Onset is insidious
          rather than acute, and there is no presenting event.
      selected_evidence:
        snippet: Familial and congenital polycythemia, not due to high oxygen affinity hemoglobin or reduced
          2,3-diphosphoglycerate in erythrocytes, is common in the Chuvash population of the Russian Federation.
