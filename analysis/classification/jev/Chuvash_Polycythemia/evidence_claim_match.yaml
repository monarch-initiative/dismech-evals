        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: vhl_socs1_jak2_dysregulation
        hypothesis_label: Loss of VHL-SOCS1-Mediated Degradation of Phospho-JAK2
        status: ALTERNATIVE
        description: 'A competing account of why erythroid progenitors are hypersensitive to erythropoietin.
          pVHL is proposed to heterodimerize with SOCS1 to form an E3 ligase that degrades phosphorylated
          JAK2, and Chuvash-associated VHL mutants are proposed to have altered SOCS1 affinity and to
          fail to degrade phospho-JAK2, so erythropoietin signaling runs hot independently of HIF. A selective
          JAK2 inhibitor reversed the phenotype in the knock-in mouse. Human data cut against it: the
          Croatian H191D genotype, which the model treats the same way, has erythroid progenitors that
          are explicitly not hypersensitive to erythropoietin. Recorded as an alternative rather than
          dismissed, because the mouse rescue is real and the isolated human report of clinical improvement
          on a JAK2 inhibitor is consistent with it, though JAK2 inhibition would blunt erythropoietin
          signaling regardless of why that signaling is high.'
      selected_evidence:
        snippet: Here we show that VHL directly binds suppressor of cytokine signaling 1 (SOCS1) to form
          a heterodimeric E3 ligase that targets phosphorylated JAK2 (pJAK2) for ubiquitin-mediated destruction.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
