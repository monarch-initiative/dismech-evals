      assertion:
        phase: Adult event-driven course
        notes: Hematologically the disease is stable or slowly progressive; clinically it is event-driven,
          punctuated by discrete thrombotic and cerebrovascular events that accumulate with age and produce
          premature mortality. Pulmonary artery pressure is a progressive variable that is modifiable
          by iron status.
      selected_evidence:
        snippet: In this matched cohort study, VHL 598C>T homozygosity was associated with vertebral hemangiomas,
          varicose veins, lower blood pressures, and elevated serum vascular endothelial growth factor
          (VEGF) concentrations (P <.0005), as well as premature mortality related to cerebral vascular
          events and peripheral thrombosis.
        supports: SUPPORT
