      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Thrombosis and cerebrovascular events drive premature mortality, with an 8.9-fold increase
          in thrombotic risk over eleven years of prospective follow-up against matched controls. Chronic
          headache, fatigue, and reduced exercise capacity persist between events, and about a third of
          patients carry mild pulmonary hypertension. Notably absent is any excess cancer risk, despite
          the causative gene being a tumor suppressor. There is no therapy of demonstrated benefit, and
          the standard of care, phlebotomy, is itself associated with increased thrombotic risk and with
          higher pulmonary artery pressure through iron depletion.
      selected_evidence:
        snippet: However, the major cause of morbidity and mortality in Chuvash erythrocytosis is thrombosis.
        supports: SUPPORT
