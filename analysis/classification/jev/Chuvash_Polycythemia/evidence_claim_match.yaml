      assertion:
        name: Classical von Hippel-Lindau Syndrome
        description: Same gene, opposite disease. Classical VHL syndrome is autosomal dominant, tumor-predominant
          (hemangioblastoma, clear cell renal cell carcinoma, pheochromocytoma), and erythrocytosis is
          uncommon. Chuvash erythrocytosis is recessive, hypomorphic, and has no demonstrated excess cancer
          risk. Routine lifelong VHL tumor surveillance is not standard for R200W homozygotes.
        distinguishing_features:
        - Autosomal dominant heterozygous VHL loss versus homozygous hypomorphic R200W
        - Tumor predisposition versus no demonstrated excess cancer risk
        - Erythrocytosis uncommon versus obligate
      selected_evidence:
        snippet: Spinocerebellar hemangioblastomas, renal carcinomas, and pheochromocytomas typical of
          classical VHL tumor predisposition syndrome have not been found, and no increased risk of cancer
          has been demonstrated.
        supports: SUPPORT
