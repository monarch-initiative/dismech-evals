            term:
              id: MONDO:0009892
              label: Chuvash polycythemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired pVHL Binding to Hydroxylated HIF-alpha
        biological_scale: MOLECULAR
        description: 'pVHL is the substrate-recognition subunit of a Cullin-2 RING E3 ubiquitin ligase.
          Under normal oxygen tension, prolyl hydroxylases hydroxylate conserved prolines in HIF-1-alpha
          and HIF-2-alpha, pVHL binds the hydroxyproline, and the HIF-alpha subunit is polyubiquitinated
          and destroyed by the proteasome. The Arg200Trp substitution weakens that interaction. It does
          not abolish it, and that distinction carries the whole disease: a hypomorph produces a chronically
          mis-set oxygen thermostat, where a null would produce the tumor syndrome.'
        genes:
        - preferred_term: VHL
          term:
            id: hgnc:12687
            label: VHL
        biological_processes:
        - preferred_term: proteasome-mediated degradation of HIF-alpha
          term:
            id: GO:0043161
            label: proteasome-mediated ubiquitin-dependent protein catabolic process
          modifier: DECREASED
        - preferred_term: HIF-alpha ubiquitination
          term:
            id: GO:0016567
            label: protein ubiquitination
          modifier: DECREASED
      selected_evidence:
        snippet: Our data indicate that the Arg200Trp substitution impairs the interaction of VHL with
          HIF1alpha, reducing the rate of degradation of HIF1alpha and resulting in increased expression
          of downstream target genes including EPO (encoding erythropoietin), SLC2A1 (also known as GLUT1,
          encoding solute carrier family 2 (facilitated glucose transporter), member 1), TF (encoding
          transferrin), TFRC (encoding transferrin receptor (p90, CD71)) and VEGF (encoding vascular endothelial
          growth factor).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
