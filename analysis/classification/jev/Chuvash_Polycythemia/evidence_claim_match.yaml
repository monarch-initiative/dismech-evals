          name: Chuvash Polycythemia
          disease_term:
            preferred_term: Chuvash Polycythemia
            term:
              id: MONDO:0009892
              label: Chuvash polycythemia
        context: []
      assertion_type: Treatment
      assertion:
        name: Therapeutic Phlebotomy
        description: 'The contested standard of care. Phlebotomy reliably reduces hematocrit and relieves
          hyperviscosity symptoms, and that is the whole of its demonstrated benefit. Against it: it causes
          iron deficiency, low ferritin independently predicts higher pulmonary artery pressure, and thrombotic
          risk is paradoxically increased by phlebotomy in this disease. Current expert opinion is that
          cytoreductive therapy should be avoided and phlebotomy is seldom warranted, with frequency set
          by symptom control rather than a hematocrit threshold. This is the rare treatment whose target
          node and harm node are different nodes, and the entry models it that way.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: phlebotomy
          term:
            id: NCIT:C28221
            label: Phlebotomy
      selected_evidence:
        snippet: Phlebotomies reduce hematocrit and hyperviscosity symptoms.
        supports: SUPPORT
