              label: Chuvash polycythemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Erythropoietin Excess and Erythroid Expansion
        biological_scale: TISSUE
        description: 'Circulating erythropoietin is roughly tenfold higher than in matched controls after
          adjusting for hemoglobin, yet the response to acute hypoxia is identical to normal, so the axis
          is intact and merely reset. Erythroid progenitors expand in marrow and, at least in the mouse
          model, in spleen. Erythroid progenitors from R200W homozygotes are additionally hypersensitive
          to erythropoietin, an asymmetry that is not shared by the Croatian H191D genotype. Note the
          discriminator from polycythemia vera: white cell and platelet counts are normal, indeed often
          lower than controls, rather than expanded.'
        cell_types:
        - preferred_term: erythroid progenitor cell
          term:
            id: CL:0000038
            label: erythroid progenitor cell
        - preferred_term: kidney interstitial fibroblast
          term:
            id: CL:1000692
            label: kidney interstitial fibroblast
        biological_processes:
        - preferred_term: erythrocyte differentiation
          term:
            id: GO:0030218
            label: erythrocyte differentiation
          modifier: INCREASED
        locations:
        - preferred_term: bone marrow
          term:
            id: UBERON:0002371
            label: bone marrow
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
      selected_evidence:
        snippet: Although hemoglobin-adjusted serum erythropoietin concentrations were approximately 10-fold
          higher in VHL 598C>T homozygotes than in controls, erythropoietin response to hypoxia was identical.
        supports: SUPPORT
