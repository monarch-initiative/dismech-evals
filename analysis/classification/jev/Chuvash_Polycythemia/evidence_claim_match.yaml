      assertion_type: Pathophysiology
      assertion:
        name: HIF Target Gene Program Activation
        biological_scale: MOLECULAR
        description: 'The stabilized HIF dimers transcribe the full hypoxia-response program at normal
          oxygen: erythropoietin, the glucose transporter SLC2A1, transferrin and its receptor, vascular
          endothelial growth factor, and endothelin-1. This is the fan-out point of the disease, and it
          is why a single amino-acid change produces phenotypes in blood, lung, vasculature, iron handling,
          and muscle metabolism at once. Note that hypoxic regulation itself remains intact and correctly
          shaped; only the setpoint has moved.'
        biological_processes:
        - preferred_term: cellular response to hypoxia
          term:
            id: GO:0071456
            label: cellular response to hypoxia
          modifier: INCREASED
      selected_evidence:
        snippet: Our data indicate that the Arg200Trp substitution impairs the interaction of VHL with
          HIF1alpha, reducing the rate of degradation of HIF1alpha and resulting in increased expression
          of downstream target genes including EPO (encoding erythropoietin), SLC2A1 (also known as GLUT1,
          encoding solute carrier family 2 (facilitated glucose transporter), member 1), TF (encoding
          transferrin), TFRC (encoding transferrin receptor (p90, CD71)) and VEGF (encoding vascular endothelial
          growth factor).
        supports: SUPPORT
