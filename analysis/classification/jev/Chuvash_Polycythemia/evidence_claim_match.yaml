        description: 'Autosomal recessive. Heterozygotes are clinically unaffected but not biologically
          silent: they have increased HIF-1-alpha activity and appear to be protected from anemia, with
          the odds of anemia reduced about 5.6-fold compared with non-carriers. That heterozygote advantage
          is the leading explanation for why an allele that shortens homozygote life expectancy has persisted
          at 5.7% in Chuvashia and 7.0% on Ischia. The allele descends largely from a single ancient founder
          event, but not exclusively so, since at least one Turkish homozygote carries a distinct haplotype.'
      selected_evidence:
        snippet: By multivariate logistic regression, the odds of anemia were reduced an estimated 5.6-fold
          in the VHL(R200W) heterozygotes compared to controls (95% confidence interval 1.4-22.7; P=0.017).
