      assertion:
        name: Polycythemia Vera
        description: The principal differential and the one whose management rules must not be carried
          over. Polycythemia vera is an acquired JAK2-mutated myeloproliferative neoplasm with trilineage
          expansion and low erythropoietin. Chuvash erythrocytosis is congenital, JAK2-unmutated, has
          high or inappropriately-normal erythropoietin, and has normal or low white cell and platelet
          counts. Applying the polycythemia vera hematocrit target here is the specific error the recent
          literature warns against.
        distinguishing_features:
        - JAK2 V617F or exon 12 mutation present in polycythemia vera, absent here
        - Erythropoietin low in polycythemia vera, high or inappropriately normal here
        - Leukocytosis and thrombocytosis in polycythemia vera; normal or low counts here
        - Acquired adult onset versus congenital lifelong erythrocytosis
      selected_evidence:
