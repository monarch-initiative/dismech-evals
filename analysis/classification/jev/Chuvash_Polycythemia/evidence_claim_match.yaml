        context: []
      assertion_type: Diagnosis
      assertion:
        name: VHL Genetic Testing
        description: Targeted single-variant testing for VHL c.598C>T is efficient where the allele is
          common; otherwise a congenital erythrocytosis gene panel covering VHL, EPAS1, EGLN1, EPOR, the
          globin genes, and BPGM, escalating to exome or genome sequencing. A coding-exon-only assay can
          miss splice-altering variants including those in a cryptic intron-1 exon, so a clean coding
          VHL result in a high-suspicion case is a reason to look further rather than to stop.
      selected_evidence:
        snippet: Despite a lower frequency (8%) compared to literature, our results suggest that the relatively
          simpler PCR-RFLP for VHL:c.598C > T mutation may be considered for the initial genetic screening
          of unexplained, suspected congenital erythrocytosis in regions where Chuvash polycythemia comprises
          a large proportion of inherited erythrocytosis, after polycythemia vera and common acquired
          secondary causes are excluded.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/1
      evidence_path: /diagnosis/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37362405
      reference_title: A Screening Approach for Inherited Erythrocytosis due to the VHL:c.598C > T Mutation
