      assertion:
        name: Tempol (IRP1-Mediated HIF-2-alpha Repression)
        description: A mouse-only strategy that works by a different route to the same target. Dietary
          Tempol increases the iron-responsive-element binding activity of Irp1, which translationally
          represses Hif2a. In VhlR200W mice it decreased erythropoietin production, corrected splenomegaly,
          normalized hematocrit, and increased lifespan, and the effect was abolished when Irp1 was genetically
          ablated, which is a clean demonstration that the mechanism is the one proposed. No human data
          exist.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: Here, we fed VhlR200W mice supplemented with Tempol, a small, stable nitroxide molecule
          and observed that Tempol decreased erythropoietin production, corrected splenomegaly, normalized
          hematocrit levels, and increased the lifespans of these mice.
        supports: SUPPORT
