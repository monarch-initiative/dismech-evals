      assertion_type: Genetic
      assertion:
        name: VHL c.598C>T (p.Arg200Trp) Homozygosity
        gene_term:
          preferred_term: VHL
          term:
            id: hgnc:12687
            label: VHL
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: 'Homozygosity for the germline VHL missense allele c.598C>T, p.Arg200Trp (rs28940298),
          at chromosome 3p25. The functional consequence is partial loss of function: the substitution
          weakens rather than abolishes pVHL binding to hydroxylated HIF-alpha. That hypomorphic character
          is why this is a hypoxia-sensing disorder and not a tumor syndrome. Congenital erythrocytosis
          also arises from compound heterozygosity of R200W with a second VHL allele and from other homozygous
          VHL alleles such as the Croatian H191D, which is phenotypically distinct. Coding-exon-only assays
          can miss splice-altering variants including a cryptic intron-1 exon, so a negative coding panel
          does not exclude VHL-related erythrocytosis.'
        frequency: OBLIGATE
      selected_evidence:
        snippet: The gene associated with von Hippel-Lindau syndrome, VHL, maps to this region, and homozygosity
          with respect to a C-->T missense mutation in VHL, causing an arginine-to-tryptophan change at
          amino-acid residue 200 (Arg200Trp), was identified in all individuals affected with Chuvash
          polycythemia.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
