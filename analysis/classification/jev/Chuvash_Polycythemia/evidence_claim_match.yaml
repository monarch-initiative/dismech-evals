      assertion_type: Discussion
      assertion:
        discussion_id: chuvash_hif2a_inhibition_outcome_endpoint
        kind: KNOWLEDGE_GAP
        prompt: Does HIF-2-alpha inhibition reduce thrombosis and mortality in VHL R200W homozygotes,
          or does it only normalize the hematocrit, which is not what kills people?
        attaches_to:
        - pathophysiology#Prothrombotic State
        rationale: Belzutifan reverses polycythemia and pulmonary hypertension in the mouse, and a human
          case of response exists in a compound heterozygote. But the disease's own literature has established
          that hematocrit is not the determinant of thrombotic risk, so a therapy validated on hematocrit
          is being validated on the wrong endpoint. The trial that matters would have to be powered on
          thrombotic events, in R200W homozygotes, with erythropoietin rather than hematocrit as the intermediate
          marker. Belzutifan also carries a known anemia and hypoxia toxicity profile, and HIF-2-alpha
          inhibition overshoots easily.
        proposed_experiments:
        - experiment_id: chuvash_hif2a_thrombosis_endpoint_trial
          name: HIF-2-alpha inhibition with a thrombotic-event endpoint
          description: A controlled trial of HIF-2-alpha inhibition in VHL R200W homozygotes powered on
            incident thrombotic events rather than hematocrit, with serum erythropoietin as the mechanistic
            intermediate and haemoglobin monitored for the known overshoot into anemia.
      selected_evidence:
        snippet: Erythropoietin elevation, but not hematocrit or ferritin, correlated with thrombosis
          risk.
        supports: SUPPORT
