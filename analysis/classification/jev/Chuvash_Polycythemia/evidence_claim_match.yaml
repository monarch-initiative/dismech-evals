      assertion:
        discussion_id: chuvash_iron_repletion_question
        kind: KNOWLEDGE_GAP
        prompt: Should iron be repleted in Chuvash erythrocytosis, given that iron deficiency raises pulmonary
          artery pressure but iron repletion has never been studied in a patient with suppressed hepcidin
          and HIF-driven iron avidity?
        attaches_to:
        - pathophysiology#Hepcidin Suppression and Iron Mobilization
        rationale: Low ferritin independently predicts higher tricuspid regurgitation velocity, and the
          commonest cause of low ferritin in these patients is the phlebotomy their doctors prescribe.
          The obvious corrective, iron repletion, has not been tested in a physiology where hepcidin is
          suppressed threefold and transferrin and transferrin receptor are transcriptionally induced.
          There is also a signal that iron status determines which HIF isoform dominates, so repletion
          could shift the phenotype in a direction that is not simply the reverse of the depletion.
      selected_evidence:
        snippet: Lower ferritin concentration, which is associated with phlebotomy, independently predicts
          higher tricuspid regurgitation velocity (www.clinicaltrials.gov identifier NCT00495638).
        supports: SUPPORT
