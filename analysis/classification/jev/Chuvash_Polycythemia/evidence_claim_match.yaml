        context: []
      assertion_type: Diagnosis
      assertion:
        name: Diagnostic Workup for Congenital Erythrocytosis
        description: Confirm persistent erythrocytosis, then exclude polycythemia vera (JAK2 unmutated;
          and note that white cell and platelet counts are normal or low here rather than expanded), exclude
          acquired secondary causes such as cardiopulmonary disease, high-altitude residence, sleep apnea,
          renal artery stenosis, and erythropoiesis-stimulating agents, then measure erythropoietin (high
          or inappropriately normal, and a normal value does not exclude the diagnosis) and p50 (normal
          here, left-shifted in high-affinity hemoglobinopathies), then confirm genetically.
      selected_evidence:
        snippet: Workup for hereditary/congenital erythrocytosis requires documentation of family history
          and laboratory screening for high-oxygen affinity hemoglobin variants, 2, 3 biphosphoglycerate
          deficiency, and germline mutations that are known to alter cellular oxygen sensing (e.g., PHD2,
          HIF2A, VHL) or EPO signaling (e.g., EPOR mutations); the latter is uniquely associated with
          subnormal EPO.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34021251
      reference_title: 'JAK2 unmutated erythrocytosis: current diagnostic approach and therapeutic views.'
      evidence_source: HUMAN_CLINICAL
      explanation: Sets out the diagnostic algorithm for congenital erythrocytosis including the VHL oxygen-sensing
        route.
