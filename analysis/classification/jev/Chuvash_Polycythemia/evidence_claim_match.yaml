      assertion_type: Pathophysiology
      assertion:
        name: Hepcidin Suppression and Iron Mobilization
        biological_scale: ORGANISM
        description: 'Hepcidin, the master regulator of iron export, is suppressed roughly threefold in
          homozygotes, and the suppression survives adjustment for both erythropoietin and ferritin, so
          it is a direct consequence of the raised hypoxic response rather than a downstream effect of
          accelerated erythropoiesis. Transferrin and transferrin receptor are induced as HIF targets.
          The clinically important interaction is iatrogenic: therapeutic phlebotomy drives iron deficiency
          on top of this program, and lower ferritin independently predicts higher pulmonary artery pressure.'
      selected_evidence:
        snippet: After adjustment for serum erythropoietin and ferritin concentrations by multiple linear
          regression, the geometric mean (95% confidence interval of mean) hepcidin concentration was
          8.1 (6.3-10.5) ng/mL in VHL(R200W) homozygotes versus 26.9 (18.6-38.0) ng/mL in controls (P
          < .001).
        supports: SUPPORT
