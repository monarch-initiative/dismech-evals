          syndrome?
        attaches_to:
        - pathophysiology#Impaired pVHL Binding to Hydroxylated HIF-alpha
        rationale: 'This is an absence with a mechanism, and worth curating as one. Three explanations
          converge. First, dose: R200W is a hypomorph retaining substantial pVHL function, whereas classical
          VHL tumors require much deeper biallelic inactivation. Second, sufficiency: the matched cohort
          found no hemangioblastomas, renal carcinomas, or pheochromocytomas despite raised HIF-1-alpha
          and vascular endothelial growth factor, so HIF overexpression is not sufficient for tumorigenesis.
          Third, a preserved HIF-independent function: pVHL stabilizes hydroxylated TFAM to sustain mitochondrial
          biogenesis, tumorigenic VHL variants fail to bind hydroxylated TFAM, and the R200W protein still
          binds it. That last result is a clean molecular dissociation between the erythrocytosis arm
          and the oncogenic arm.'
