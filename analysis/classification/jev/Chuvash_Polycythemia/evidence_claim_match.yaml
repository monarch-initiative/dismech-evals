      assertion:
        name: Metabolic Reprogramming Toward Glycolysis
        biological_scale: CELLULAR
        description: Raised HIF activity induces glycolytic enzymes and pyruvate dehydrogenase kinase,
          shifting substrate use away from oxidative phosphorylation. During exercise this shows up as
          early phosphocreatine depletion and acidosis in skeletal muscle, greater blood lactate accumulation,
          and reduced maximum exercise capacity, with elevated muscle transcripts for pyruvate dehydrogenase
          kinase, phosphofructokinase, and muscle pyruvate kinase. This is the physiological substrate
          of the fatigue and exercise limitation patients report, and it is a rare opportunity to observe
          HIF-driven metabolic regulation at whole-organism level in humans.
        biological_processes:
