      assertion_type: Pathophysiology
      assertion:
        name: Gambierdiscus Ciguatoxin Production on Reef Substrate
        biological_scale: ORGANISM
        description: The environmental origin of the toxin. Benthic dinoflagellates of the genera Gambierdiscus
          and Fukuyoa live epiphytically on macroalgae, dead coral and reef detritus in tropical and subtropical
          waters, where they synthesise the ciguatoxin precursors known as gambiertoxins. Toxin production
          is species-specific rather than a property of the genus as a whole, which is why Gambierdiscus
          abundance alone is a poor predictor of local risk.
        notes: Deliberately carries no ontology-bound process descriptor. The node denotes a process occurring
          in a free-living marine microalga, not in the human host, and the GO terms available describe
          host-side biology.
      selected_evidence:
        snippet: 'Ciguatoxins (CTXs) are produced by marine microbial eukaryotes (Gambierdiscus/Fukuyoa,
          Dinophyta: Alveolata) that live epiphytically on macroalgae and other substrates.'
        supports: SUPPORT
