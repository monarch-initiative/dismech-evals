  3469fa45abb21890e72f7713416013b6df375344784186d986ac664ca735989e:
    claim:
      about:
        disease:
          name: Ciguatera Fish Poisoning
          disease_term:
            preferred_term: ciguatera fish poisoning
            term:
              id: MONDO:0043230
              label: ciguatera fish poisoning
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other marine and fish-borne toxin syndromes
        description: Ciguatera shares symptoms with paralytic, neurotoxic and diarrhetic shellfish poisoning,
          scombrotoxin (histamine) fish poisoning, pufferfish tetrodotoxin poisoning and hallucinatory
          fish poisoning. All arrive through the same "I ate seafood and got sick" history, so the exposure
          story does not discriminate between them.
        distinguishing_features:
        - Cold allodynia - burning pain on innocuous cold contact - is the discriminating feature, and
          is described as pathognomonic for ciguatera.
        - 'The implicated species differs: ciguatera follows carnivorous reef fish (jacks, groupers, snappers,
          barracuda, moray eels, amberjack).'
        notes: Deliberately short. The features that separate ciguatera from each named alternative individually
          - the histamine mechanism of scombroid, the ascending paralysis of tetrodotoxin - are standard
          clinical teaching but are not stated by any reference cited in this entry, so they are omitted
          rather than asserted without a source. Adding them means citing a source that makes each comparison.
      selected_evidence:
        snippet: The classic dysaesthesia is cold allodynia, often described as reversal of hot and cold
          sensation, but a more accurate description is burning pain on exposure to cold.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28535116
      reference_title: Is mannitol the treatment of choice for patients with ciguatera fish poisoning?
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      explanation: Supports cold allodynia as the discriminating feature. Its specificity against the
        other syndromes named here is not quantified in any source cited by this entry, so "near-pathognomonic"
        is the clinical consensus rather than a measured test characteristic.
