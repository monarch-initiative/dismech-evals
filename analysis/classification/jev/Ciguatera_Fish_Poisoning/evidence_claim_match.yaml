          mostly under the traits of neurological and psychiatric disorders (i.e., tenacious fatigue,
          paraesthesia, dysesthesia, pruritus, attention deficit disorder, anxiety, depression) ... These
          manifestations can be expressed continuously or through transient reactivation peaks, triggered
          by multiple factors (e.g., consumption of marine/fresh water-related products, even from non-endemic
