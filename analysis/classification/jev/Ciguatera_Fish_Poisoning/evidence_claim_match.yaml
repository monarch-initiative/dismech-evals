            term:
              id: MONDO:0043230
              label: ciguatera fish poisoning
        context: []
      assertion_type: Environmental
      assertion:
        name: Consumption of ciguatoxin-contaminated carnivorous reef fish
        description: The sole route of exposure. Carnivorous reef predators - jacks and trevallies, snappers,
          groupers, barracuda, moray eels, amberjack and king mackerel - carry the highest toxin burden
          because the toxin biomagnifies up the reef food chain, and liver, roe and viscera concentrate
          it further. Contaminated fish are indistinguishable from safe ones by taste, smell or appearance,
          and the toxins survive cooking, salting and freezing, so no consumer-level precaution short
          of avoiding the species removes the risk.
        exposure_term:
          preferred_term: dietary exposure to ciguatoxin in contaminated reef fish
          term:
            id: ECTO:0000537
            label: exposure to toxin
        food_source:
          preferred_term: sea water fish food product
          term:
            id: FOODON:00001055
            label: sea water fish food product
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
          exposure_route:
          - classification_value: ORAL
          exposure_duration:
          - classification_value: ACUTE
        notes: 'Bound to `ECTO:0000537` exposure to toxin. ECTO was searched through this repository''s
          adapter (`sqlite:obo:ecto`) for a ciguatoxin or ciguatera exposure class and none exists. The
          nearest classes under `ECTO:0000537` are mycotoxin, phytoalexin, phytotoxin, nephrotoxin, uremic
          toxin and virulence factor, and the fish-ingestion classes that do exist (`ECTO:0070099` bluefish,
          `ECTO:0070100` swordfish, `ECTO:0070189` whitefish, `ECTO:0070209` dark fish flesh) name unrelated
          species. One algal-toxin class does exist outside that subtree - `ECTO:8000033` exposure to
          accumulation of toxins from algal bloom process, whose parent is `ECTO:8000000` exposure to
          environmental process, so a descendant walk from `ECTO:0000537` misses it. It was considered
          and not used: ciguatoxin reaches people through years of food-chain accumulation in fish, not
          through a bloom event, and this entry''s exposure is a meal rather than an environmental process.
          The specific agent is carried in `preferred_term`, and the toxin itself is bound to `CHEBI:61275`
          on the pathophysiology nodes where it acts. `food_source` names the marine fish product class
          rather than a species, because the implicated species differ by ocean basin and the slot takes
          a single term.'
      selected_evidence:
        snippet: Ciguatoxins, a class of tasteless, heat-stable, polycyclic toxins produced by dinoflagellates,
          accumulate through the food chain and concentrate in various carnivorous fish, such as groupers,
          barracudas, wrasses, amberjack, kingfishes, and eels.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
