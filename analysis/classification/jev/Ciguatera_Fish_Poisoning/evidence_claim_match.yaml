      assertion:
        name: Cold Sensitisation of Nav1.8/TRPA1-Positive Afferents
        biological_scale: CELLULAR
        description: Ciguatoxin confers cold sensitivity on a subpopulation of normally cold-insensitive
          afferents that co-express Nav1.8 and TRPA1, so innocuous cooling drives a nociceptive response.
          In spinal recordings, cold hypersensitivity is abolished by a Nav1.8 antagonist, only partially
          prevented by a TRPA1 antagonist, and unaffected by a TRPM8 antagonist - which places the lesion
          on the Nav1.8/TRPA1 population rather than on the canonical cold receptor.
        biological_processes:
        - preferred_term: detection of temperature stimulus involved in sensory perception of pain
          modifier: ABNORMAL
          term:
            id: GO:0050965
            label: detection of temperature stimulus involved in sensory perception of pain
        cell_types:
        - preferred_term: Nav1.8/TRPA1-positive primary afferent neuron
          term:
            id: CL:0000101
            label: sensory neuron
        notes: '`cell_types` stays on the generic `CL:0000101` deliberately. CL was searched for a Nav1.8-
          or TRPA1-defined afferent class and has neither: its channel-marker neuron types are the segment-specific
          transcriptomic series (`CL:4079002` cervical dorsal root ganglion Nav1.7 neuron and its lumbar,
          sacral and thoracic siblings), which name a different channel and add a spinal level this claim
          does not make. The sibling node for CGRP release does get a specific term, `CL:4033176`, because
          CL carries a level-independent class there; no such class exists for Nav1.8 or TRPA1.'
      selected_evidence:
        snippet: Subcutaneous injection of 10 nm ciguatoxin-2 into the receptive field increased neuronal
          responses to innocuous and noxious cooling.
        supports: SUPPORT
