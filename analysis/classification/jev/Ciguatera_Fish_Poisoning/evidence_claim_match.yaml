      assertion:
        discussion_id: cfp-host-nav-susceptibility
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does variation in human voltage-gated sodium channel genes modify susceptibility to, or
          the symptom profile of, ciguatera fish poisoning?
        attaches_to:
        - pathophysiology#Voltage-Gated Sodium Channel Site 5 Activation
        rationale: Ciguatoxin acts directly on Nav1.1 to Nav1.9, and the isoform carrying a given symptom
          has been separated pharmacologically in rodents, so allelic variation at SCN1A, SCN9A, SCN10A
          or SCN11A is a biologically obvious candidate modifier of who becomes symptomatic and how. No
          human genetic association study exists. This entry deliberately has no `genetic:` section rather
          than one inferred from channel pharmacology, and that absence is the gap being recorded.
      selected_evidence:
        snippet: P-CTX-1-induced visceral and cutaneous pain behaviours were significantly decreased after
          pharmacological inhibition of NaV1.8 and the tetrodotoxin-sensitive isoforms NaV1.7 and NaV1.6,
          respectively.
        supports: SUPPORT
