      assertion_type: AnimalModel
      assertion:
        name: Rat spinal dorsal horn ciguatoxin cold hypersensitivity model
        species: Rat
        category: Induced
        publication: PMID:26454262
        description: Subcutaneous Pacific ciguatoxin-2 into the receptive field of a dorsal horn wide-dynamic-range
          neuron, with in vivo electrophysiological recording of responses to cooling. This is the model
          that assigned ciguatera cold allodynia to Nav1.8 and TRPA1 rather than to the canonical cold
          receptor TRPM8.
        modeled_mechanisms:
        - target: Cold Sensitisation of Nav1.8/TRPA1-Positive Afferents
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Local ciguatoxin reproduces the cold hypersensitivity, and the channel dependence
            is established by selective antagonists.
          limitations: The readout is a spinal neuronal firing rate in a non-sentient preparation, not
            a reported sensation, so the mapping onto human cold allodynia is an inference the authors
            make explicitly rather than a measurement. The toxin is injected locally at a known concentration
            rather than ingested and distributed, so absorption, congener mixture and dose are all bypassed.
          readouts:
          - name: Dorsal horn neuronal response to innocuous and noxious cooling
            target: Cold Sensitisation of Nav1.8/TRPA1-Positive Afferents
            direction: INCREASED
            interpretation: Increased firing to cooling after local ciguatoxin is the electrophysiological
              correlate of cold allodynia.
      selected_evidence:
        snippet: This study examined, for the first time, the neural substrates and molecular components
          of Pacific ciguatoxin-2-induced cold hypersensitivity.
        supports: SUPPORT
    origin:
