            label: myelinating Schwann cell
      selected_evidence:
        snippet: This was confirmed by a biopsy of the sural nerve, which revealed a striking edema in
          the adaxonal layer of the Schwann cell cytoplasm, with axonal compression and vesicular degeneration
          of the myelin.
        supports: SUPPORT
