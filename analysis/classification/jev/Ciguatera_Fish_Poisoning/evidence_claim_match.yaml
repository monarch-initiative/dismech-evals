        description: The one structural lesion of ciguatera documented in human tissue. Sural nerve biopsy
          in severe cases shows striking oedema of the adaxonal layer of the Schwann cell cytoplasm, compressing
          the axon, with vesicular degeneration of the myelin.
        diagnostic: false
        notes: No `finding_term` is bound. HPO's nearest terms describe peripheral myelination abnormality
          (`HP:0003130`) and onion bulb formation (`HP:0003383`), neither of which denotes adaxonal Schwann
          cell oedema, and binding a broader myelination term would assert a different lesion. The finding
          is carried as prose and as the `Nodal and Adaxonal Schwann Cell Swelling` pathophysiology node
          instead.
      selected_evidence:
        snippet: In two severe cases, edema of myelin fibers, sometimes intra-axonal, or of the adaxonal
          Schwann cell cytoplasm, were revealed in biopsied sural nerves
        supports: SUPPORT
