          term:
            id: CL:4033176
            label: dorsal root ganglion CGRP neuron
      selected_evidence:
        snippet: P-CTX-1-induced CGRP release from skin is dependent on extracellular calcium and sodium,
          but independent from the activation of various thermosensory transient receptor potential (TRP)
          ion channels.
        supports: SUPPORT
