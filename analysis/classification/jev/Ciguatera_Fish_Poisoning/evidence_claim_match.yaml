        target: Cold Sensitisation of Nav1.8/TRPA1-Positive Afferents
        causal_link_type: DIRECT
        description: Depolarisation, not firing, is what shifts the voltage dependence of TRPA1 activation
          so that cooling opens it. Cold sensitisation is therefore a sibling consequence of the same
          depolarisation as the repetitive firing, not a consequence of the firing itself.
      selected_evidence:
        snippet: Thus, a cumulative effect on sodium and potassium currents would result in activation
          of TRPA1 upon cooling but not TRPM8.
