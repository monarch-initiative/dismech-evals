              label: ciguatera fish poisoning
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cfp-chronic-phase-no-model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Every experimental model of ciguatera reproduces the acute channel lesion over minutes
          to hours. None reproduces the chronic relapsing syndrome that affects at least a fifth of patients
          for months to years. Does chronicity reflect persisting channel dysregulation, a sensitised
          nociceptive circuit, or something the acute models cannot express?
        attaches_to:
        - progression#Chronic ciguatera
        - pathophysiology#Repetitive Firing of Peripheral Sensory Afferents
        rationale: The mismatch matters because it is the chronic phase, not the acute one, that carries
          most of the disability, and every mechanistic claim about it in the literature is inference
          from acute pharmacology. The rat cold hypersensitivity model and the mouse CGRP release preparations
          recorded in this entry both measure an effect within hours of toxin application; neither has
          been run over the time course on which human symptoms relapse, and the reported triggers of
          relapse - alcohol, nuts, a further fish meal - have no counterpart in any model. Reactivation
          months after the toxin has cleared is not obviously a channel-occupancy phenomenon at all, which
          is what makes this a translational gap rather than a missing experiment.
      selected_evidence:
        snippet: Considering that at least 20% of the persons affected by CP are likely to develop a persistent
          form
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34564650
      reference_title: 'Screening for Predictors of Chronic Ciguatera Poisoning: An Exploratory Analysis
