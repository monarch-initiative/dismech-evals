        biological_scale: MOLECULAR
        description: Ciguatoxins bind neurotoxin receptor site 5 on the alpha subunit of voltage-gated
          sodium channels - the same site targeted by the structurally related brevetoxins - and act as
          allosteric activators rather than blockers. Binding shifts the voltage dependence of activation
          to more hyperpolarised potentials and impairs inactivation, so a fraction of channels is open
          at or near the resting membrane potential. The effect is close to non-selective across Nav1.1
          to Nav1.9, with the largest activation shifts at the tetrodotoxin-resistant isoforms Nav1.8
          and Nav1.9.
        molecular_functions:
        - preferred_term: ciguatoxin-activated voltage-gated sodium channel activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0005248
            label: voltage-gated sodium channel activity
        chemical_entities:
        - preferred_term: ciguatoxin
          term:
            id: CHEBI:61275
            label: ciguatoxin
        notes: '`modifier: GAIN_OF_FUNCTION` rather than `INCREASED` is deliberate, and follows the CLAUDE.md
          rule for a qualitative rather than quantitative claim: the channel is not simply more active,
          it is opening outside its normal voltage-dependent constraint. There is no host variant anywhere
          in this entry, so `functional_impact_category` has nothing to describe - the same situation
          the knowledge base records for virally driven pathway activation.'
      selected_evidence:
        snippet: This diverse symptomatology is believed to be caused by the interaction of the ciguatoxins
          with site 5 of the voltage-gated sodium channels (NaV)
        supports: SUPPORT
