              label: ciguatera fish poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Conduction and Vasomotor Disturbance
        biological_scale: TISSUE
        description: 'How ciguatoxin slows the heart is contested, and both positions are recorded below.
          The clinical literature argues an indirect route: stimulation of unmyelinated vagal cardiac
          afferents inhibiting central vasomotor centres, so sympathetic output and peripheral resistance
          fall. Mouse histology argues a direct one: cardiac myocytes swell in a pattern read as myocardial
          sodium channel activation rather than as an action on cardiac autonomic nerves. Either route,
          combined with hypovolaemia from gastrointestinal losses, produces bradycardia, hypotension and
          conduction disorders. These are the least frequent features but the ones that make the illness
          life-threatening. They do respond to atropine, fluids and dopamine, but reversal can require
          unusually large or prolonged atropine dosing - 45 mg and 30 mg over 48 hours in the two published
          cases cited here.'
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        notes: '`cell_types` binds the cardiac muscle cell for the direct-myocyte position only, which
          is the mouse-histology side of the controversy this node records. The competing clinical account
          places the lesion on cardiac autonomic nerves rather than on the myocyte, and CL has no term
          for the unmyelinated vagal cardiac afferent that account names, so only one side of the dispute
          is bindable here.'
        biological_processes:
        - preferred_term: membrane depolarization
          modifier: INCREASED
          term:
            id: GO:0051899
            label: membrane depolarization
      selected_evidence:
        snippet: We report two patients with persistent bradycardia and hypotension after eating mackerel
          fish.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/11
      evidence_path: /pathophysiology/11/evidence/0
