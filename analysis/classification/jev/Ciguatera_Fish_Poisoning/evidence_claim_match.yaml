        description: 'Sodium entry with obligate water movement swells the nodes of Ranvier of myelinated
          fibres and the adaxonal Schwann cell cytoplasm. This is the one structural lesion of ciguatera
          that has been seen in patients: sural nerve biopsies in severe cases show adaxonal Schwann cell
          oedema with axonal compression and vesicular myelin degeneration, and skin biopsy months after
          poisoning has shown diffuse axonal swellings with preserved intraepidermal fibre density.'
