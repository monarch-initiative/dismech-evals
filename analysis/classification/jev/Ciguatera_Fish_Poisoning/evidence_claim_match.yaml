          potential channel activation. Nav1.9 alone, and Nav1.7 with Nav1.1 together, carry most of the
          release. Intradermal ciguatoxin in human volunteers produces a long-lasting painful axon reflex
          flare, which is the neurogenic-inflammation readout of this step, and CGRP signalling is the
          plausible route from afferent firing to itch.
