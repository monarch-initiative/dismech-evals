    claim:
      about:
        disease:
          name: Ciguatera Fish Poisoning
          disease_term:
            preferred_term: ciguatera fish poisoning
            term:
              id: MONDO:0043230
              label: ciguatera fish poisoning
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Cook Islands naturally occurring canine and feline ciguatera
        species: Dog
        category: Natural disease
        publication: PMID:32158145
        description: 'Not an engineered model. Dogs and cats in Rarotonga eat reef fish and fish scraps
          and develop ciguatera in numbers large enough to study: 246 cases in six years of records from
          the only veterinary clinic in the territory, 165 dogs and 81 cats. The presentation is motor-dominant
          - ataxia, paresis and recumbency - rather than the sensory-dominant syndrome seen in people,
          which is the main reason this is recorded as partially recapitulating rather than recapitulating.'
        modeled_mechanisms:
        - target: Ingestion and Systemic Distribution of Ciguatoxin
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: The same exposure route and the same toxin, in a naturally exposed non-human population
            with veterinary follow-up that human series rarely match.
          limitations: 'The clinical picture diverges from the human one: motor signs dominate and the
            sensory disturbances that define human ciguatera cannot be elicited from an animal at all,
            so the syndrome is not comparable symptom by symptom. Dose is unmeasured and probably higher
            than a human meal, because these animals scavenge viscera and whole carcasses where the toxin
            concentrates. No toxin assay confirmed exposure in individual cases; the case definition is
            clinical.'
        notes: 'Recorded under a single `species: Dog` entry although the source series covers dogs and
          cats together; the slot takes one value and dogs are the larger group. The feline cases are
          described in the same papers and the quoted findings are reported for both species.'
      selected_evidence:
        snippet: The survival rate was >90% and almost all mortalities occurred in the first week of hospitalization.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
