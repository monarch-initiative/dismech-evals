      assertion_type: Pathophysiology
      assertion:
        name: Platinum-DNA Adduct Formation
        description: Aquated cisplatin binds DNA and forms crosslinks. This is the therapeutic mechanism
          and the toxic mechanism, and they are the same mechanism - there is no separate off-target lesion
          to find. Adducts form in nuclear DNA and in mitochondrial DNA, and the distinction matters because
          the mitochondrion cannot repair them.
        role: central_effector
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: DNA damage response
          term:
            id: GO:0006974
            label: DNA damage response
          modifier: INCREASED
      selected_evidence:
        snippet: cisplatin induces apoptosis in dorsal root ganglion (DRG) sensory neurons by covalently
          binding to nuclear DNA (nDNA), resulting in DNA damage, subsequent p53 activation and Bax-mediated
          apoptosis via the mitochondria
        supports: SUPPORT
