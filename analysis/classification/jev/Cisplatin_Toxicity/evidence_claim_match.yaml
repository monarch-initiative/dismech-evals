      assertion_type: Pathophysiology
      assertion:
        name: Cochlear Hair Cell Death
        description: Death of cochlear hair cells, beginning with the outer hair cells of the basal turn,
          which is why the loss starts at high frequency. Hair cell death is not the only cochlear lesion
          - stria vascularis injury and spiral ganglion degeneration are reported alongside it - and this
          entry does not model it as the sole route.
        role: intermediate
        biological_scale: TISSUE
        conforms_to: sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death
        cell_types:
        - preferred_term: cochlear outer hair cell
          term:
            id: CL:0000601
            label: cochlear outer hair cell
        notes: Conformance is asserted at the module's hair-cell death node. The module node names mechanotransduction
          failure as well as death; the sources cited here establish hair cell death and the intracellular
          injury behind it, and do not report a mechanotransduction measurement. Read the conformance
          as covering the death half.
      selected_evidence:
        snippet: The main etiologies are stria vascularis injury, spiral ganglion degeneration, and hair
          cell death.
        supports: SUPPORT
