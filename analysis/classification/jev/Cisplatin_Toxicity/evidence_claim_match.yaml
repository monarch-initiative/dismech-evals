  8f6925bb584468ebb64d1137f25a2086963337e642ebd31d7236c4d2b172e7ad:
    claim:
      about:
        disease:
          name: Cisplatin Toxicity
          disease_term:
            preferred_term: cisplatin toxicity
            term:
              id: MONDO:0027664
              label: cisplatin toxicity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dorsal Root Ganglion Sensory Neuron Injury
        description: Platinum accumulates in dorsal root ganglion sensory neurons, which sit outside the
          blood-nerve barrier and are therefore not protected the way the rest of the peripheral nervous
          system is. The primary lesion here is at the cell body, not at the far end of the axon, even
          though the symptoms begin distally.
        role: intermediate
        biological_scale: CELLULAR
        conforms_to: peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells
        cell_types:
        - preferred_term: dorsal root ganglion sensory neuron
          term:
            id: CL:1001451
            label: sensory neuron of dorsal root ganglion
        notes: Conformance is asserted at the module's insult node, which is where a toxic injury to peripheral
          sensory neurons belongs. This entry deliberately does NOT conform to the module's "Distal Axonal
          Degeneration and Demyelination" node. Cisplatin neuropathy is a sensory neuronopathy - the platinum
          accumulates in and kills the ganglion cell body - and none of the sources cited here reports
          demyelination. Symptoms begin distally, which is a different claim from the lesion being distal,
          and the entry keeps those apart.
      selected_evidence:
        snippet: cisplatin induces apoptosis in dorsal root ganglion (DRG) sensory neurons by covalently
          binding to nuclear DNA (nDNA), resulting in DNA damage, subsequent p53 activation and Bax-mediated
          apoptosis via the mitochondria
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/8
      evidence_path: /pathophysiology/8/evidence/0
      context_paths:
