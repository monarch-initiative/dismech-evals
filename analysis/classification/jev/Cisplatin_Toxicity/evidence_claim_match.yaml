      assertion:
        name: Emetogenic Response to Cisplatin
        description: 'Cisplatin is the archetypal highly emetogenic drug: without antiemetic prophylaxis
          it makes nearly nine in ten patients vomit. This arm is separated from the four injury arms
          because it is not a cytotoxic lesion - nothing dies - and because it is the toxicity that modern
          prophylaxis has most changed.'
