          with a delayed NK1/substance P phase - is not asserted here. The cited source describes the
          antiemetic classes used against this toxicity rather than the receptor biology producing it,
          and no source in this entry states the mechanism directly.
      selected_evidence:
        snippet: One of the most common side effects of cisplatin is chemotherapy-induced nausea and vomiting
          (CINV), affecting nearly 90% of patients who receive high-dose cisplatin without antiemetic
          treatment
        supports: SUPPORT
