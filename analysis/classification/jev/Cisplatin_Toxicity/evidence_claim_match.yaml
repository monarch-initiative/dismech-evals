              id: MONDO:0027664
              label: cisplatin toxicity
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cisplatin Uptake by Transporter-Expressing Cells
        description: Cisplatin does not enter cells freely. It is carried in, chiefly by the organic cation
          transporter OCT2 and the copper transporter Ctr1, and the tissues that express those transporters
          most heavily are the tissues that are injured. This node is the selectivity step of the whole
          disease - it explains why a drug that crosslinks DNA everywhere produces damage in four particular
          organs and not uniformly.
        role: trigger
        biological_scale: CELLULAR
        conforms_to: drug_induced_nephrotoxicity#Nephrotoxic Drug Exposure and Tubular Uptake
      selected_evidence:
        snippet: the present results indicated that renal rOCT2 expression was the major determinant of
          cisplatin-induced tubular toxicity
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:16242669
      reference_title: Association between tubular toxicity of cisplatin and expression of organic cation
        transporter rOCT2 (Slc22a2) in the rat.
      evidence_source: MODEL_ORGANISM
      explanation: Identifies transporter expression, not intrinsic cellular sensitivity, as what determines
        where the toxicity falls. This is the claim the node is built on. Graded MODEL_ORGANISM because
        the quoted conclusion rests on the in vivo rat arm - sex differences in renal uptake clearance,
        urinary N-acetyl-beta-D-glucosaminidase, and the castrated-male comparison - even though the paper
        also reports transfected-cell work.
