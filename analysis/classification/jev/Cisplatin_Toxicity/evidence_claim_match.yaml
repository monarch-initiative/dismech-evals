              label: cisplatin toxicity
        context: []
      assertion_type: Treatment
      assertion:
        name: Sodium thiosulfate otoprotection
        description: 'A sulfur nucleophile that inactivates platinum, given six hours after the cisplatin
          infusion. The delay is the whole design: given at the same time it would protect the tumour
          too, and pharmacokinetic work put six hours as the interval that protects the ear without doing
          that. In a randomised phase 3 trial in children with standard-risk hepatoblastoma it cut hearing
          loss from 63 percent to 33 percent without reducing survival.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: sodium thiosulfate
            term:
              id: NCIT:C1230
              label: Sodium Thiosulfate
        notes: Bound to NCIT:C1230 Sodium Thiosulfate, which names the administered salt. An earlier draft
          used CHEBI:26977 thiosulfate and justified it on the more specific term being absent from this
          repository's term cache; that was not a real constraint, since the cache is populated by validation,
          and the reasoning is recorded here as corrected rather than quietly replaced. The trial population
          was children with standard-risk hepatoblastoma receiving cisplatin monotherapy, chosen because
          otoprotection can be tested there without confounding by other agents. Generalisation to adults
          and to multi-agent regimens is not established by this trial.
      selected_evidence:
        snippet: Sodium thiosulfate protects against cisplatin-induced hearing loss in children and is
          not associated with serious adverse events attributed to its use.
        supports: SUPPORT
