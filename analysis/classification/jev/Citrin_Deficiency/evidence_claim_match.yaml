        context: []
      assertion_type: Diagnosis
      assertion:
        name: Newborn screening with molecular second-tier testing
        description: 'Citrin deficiency is detectable by newborn screening via tandem mass spectrometry
          using elevated citrulline as the primary marker. However, dried blood spot citrulline can be
          borderline or normal, leading to false negatives. Second-tier NGS-based genetic testing with
          specific detection of hotspot variants like IVS16ins3kb has been implemented to improve sensitivity.
          In a Hong Kong study, two citrullinemia type II cases would have been missed without molecular
          second-tier testing.

          '
        diagnosis_term:
          preferred_term: disease screening
          term:
            id: NCIT:C15419
            label: Disease Screening
        results: Elevated citrulline or biallelic SLC25A13 pathogenic variants support diagnosis, but
          molecular second-tier testing improves detection when biochemical screening is borderline.
      selected_evidence:
        snippet: "The false positive \nrate for these six conditions after the NGS second-tier test was\
          \ only 0.017%, \nand two cases of citrullinemia type II would have been missed as false negatives\
          \ \nif only biochemical first-tier testing was performed."
        supports: SUPPORT
