        subtype: CTLN2 (Adult-onset Type II Citrullinemia)
        phase: Adult-onset hyperammonemic decompensation
        age_range: Usually 20 to 50 years, one or more decades after the earlier phases
        notes: 'Onset is sudden. Recurrent hyperammonemia with neuropsychiatric manifestations (aggression,
          irritability, restlessness, hyperactivity, delusions, nocturnal delirium) and neurologic manifestations
          (flapping tremor, memory loss, disorientation, drowsiness, convulsive seizures, coma). Crises
