          value:
            name: FTTDCD (Failure to Thrive and Dyslipidemia caused by Citrin Deficiency)
            description: 'Childhood-onset presentation characterized by growth impairment, dyslipidemia,
              fatigue, and food preference for protein- and lipid-rich foods with aversion to carbohydrate-rich
              foods. Occurs after resolution of NICCD or as the first recognized clinical stage.

              '
            genes:
            - preferred_term: SLC25A13
              term:
                id: hgnc:10983
                label: SLC25A13
          role: subtype
      assertion_type: ProgressionInfo
      assertion:
        subtype: FTTDCD (Failure to Thrive and Dyslipidemia caused by Citrin Deficiency)
        phase: Post-infantile apparently-well / FTTDCD phase
        age_range: Beyond one year through childhood and adolescence
        notes: 'Historically called the "apparently healthy" or silent period, but this phase is not asymptomatic:
          poor weight gain, growth deficiency, severe fatigue, anorexia and impaired quality of life occur
          alongside dyslipidemia, recurrent hypoglycemia, a raised lactate-to-pyruvate ratio, elevated
          urinary oxidative stress markers and deviated TCA-cycle metabolites. The characteristic protein-
          and lipid-rich food preference with carbohydrate aversion emerges here and is a protective physiological
          adaptation, not a behavioural quirk.

          '
      selected_evidence:
        snippet: Clinical abnormalities may include poor weight gain, growth deficiency, severe fatigue,
          anorexia, and impaired quality of life.
        supports: SUPPORT
