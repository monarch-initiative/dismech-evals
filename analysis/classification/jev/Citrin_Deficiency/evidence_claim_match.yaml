  c540356f41d614a4122d996228be203d89b06040b792528cce4fd108f810a76b:
    claim:
      about:
        disease:
          name: Citrin Deficiency
          disease_term:
            preferred_term: citrin deficiency
            term:
              id: MONDO:0016602
              label: citrin deficiency
        context:
        - path: /treatments/1
          value:
            name: Avoidance of contraindicated agents and diets
            description: 'Citrin deficiency has a distinctive and partly counterintuitive contraindication
              set. Intravenous glycerol-, fructose- and glucose-containing solutions are contraindicated
              and potentially lethal - they exacerbate the GAPDH-step metabolic block and worsen hepatocyte
              ATP depletion under impaired MAS function, with a documented risk of brain edema. Critically,
              LOW-PROTEIN, HIGH-CARBOHYDRATE diets are also contraindicated: this is the opposite of the
              protein restriction that is standard management in most urea cycle disorders, and treating
              citrin deficiency as a conventional urea cycle defect will worsen it. Alcohol is a further
              avoidance and a recognised CTLN2 crisis precipitant.

              '
            therapeutic_modality: BEHAVIORAL
            treatment_term:
              preferred_term: dietary intervention
              term:
                id: NCIT:C15447
                label: Dietary Intervention
            notes: 'Two distinct safety points, both easy to get wrong. (1) Standard fructose- or glycerol-containing
              IV solutions - routine osmotic agents - can precipitate fatal metabolic crisis. (2) Protein
              restriction, the reflex management for hyperammonemia in urea cycle disorders, is contraindicated
              here; patients self-select protein- and lipid-rich foods for good physiological reason,
              and overriding that preference is harmful.

              '
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Impaired hepatic glycolysis and carbohydrate toxicity
        treatment_effect: INHIBITS
        description: Avoiding fructose, glycerol, glucose, and high carbohydrate load reduces exacerbation
          of carbohydrate toxicity.
      selected_evidence:
        snippet: "Agents/circumstances to avoid: Low-protein and \nhigh-carbohydrate diets; glycerol,\
          \ fructose, and glucose infusions due to risk \nof brain edema; alcohol."
        supports: SUPPORT
