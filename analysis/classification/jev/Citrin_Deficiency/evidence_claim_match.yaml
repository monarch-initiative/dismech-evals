      assertion_type: Genetic
      assertion:
        name: SLC25A13 pathogenic variants
        gene_term:
          preferred_term: SLC25A13
          term:
            id: hgnc:10983
            label: SLC25A13
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: IVS16ins3kb hotspot structural variant
          description: 'IVS16ins3kb is a hotspot structural variant in SLC25A13 that requires specific
            copy number variant calling approaches for detection. It is particularly relevant for newborn
            screening programs in East Asian populations.

            '
        - name: Novel nonsense, frameshift, and deletion variants
          description: 'The variant spectrum of SLC25A13 continues to expand. A 2023 case series identified
            three novel variants including a nonsense mutation in exon 17 (c.1803C>G), a frameshift mutation
            in exon 11 (c.1141delG), and a whole exon 11 deletion.

            '
        features: 'Biallelic pathogenic variants in SLC25A13 (encoding citrin/AGC2) cause citrin deficiency
          across all phenotypic stages. The gene is located on chromosome 7q21.3. Over 100 pathogenic
          variants have been reported including missense, nonsense, frameshift, splice-site mutations,
          and large structural rearrangements. Compound heterozygosity is common. Carrier rates are high
          in East Asian populations - reported at 1/42 to 1/69 in Japan, with a disease-associated allele
          frequency of about 1/45 in a large Chinese newborn-screening study, against 1/90 in Thai and
          1/112 in Korean populations. See the prevalence section for the database-derived carrier frequencies,
          which are the figures this entry treats as authoritative.

          '
      selected_evidence:
        snippet: The prevalence of heterozygous carriers of pathogenicSLC25A13variants is high in East
          Asian populations, particularly in Japan, with a frequency of 1/42 to 1/69
        supports: SUPPORT
