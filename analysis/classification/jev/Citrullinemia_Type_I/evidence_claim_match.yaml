        description: Hyperammonemic episodes resemble those of the neonatal form but begin later in life
          for reasons that are not fully understood. Initial neurologic findings are often more subtle
          because of the older age at presentation - intense headache, scotomas, migraine-like episodes,
          ataxia, slurred speech, lethargy and drowsiness - which delays recognition. Serious raised intracranial
          pressure may still occur.
      selected_evidence:
        snippet: The episodes of hyperammonemia are similar to those seen in the acute neonatal form,
          but the initial neurologic findings may be more subtle because of the older age of the affected
          individuals.
