  a8f674f0c8ffc8c2a79f30d6afd63bc56f5ed31136bc9fe9d0045de577c3cf88:
    claim:
      about:
        disease:
          name: Citrullinemia Type I
          disease_term:
            preferred_term: citrullinemia type I
            term:
              id: MONDO:0008988
              label: citrullinemia type I
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Genotype-to-phenotype correlation through residual ASS1 activity
        description: 'The severity spectrum of CTLN1 (classic neonatal, late-onset, pregnancy-triggered,
          asymptomatic) is determined by residual ASS1 enzyme activity. Pathogenic variants affect the
          citrulline-binding site, oligomerization helix stability, protein expression levels, or cause
          premature truncation. Variants with less than 2% of wild-type activity typically produce classic
          neonatal presentations, while hypomorphic variants may allow milder or late-onset disease. A
          biallelic expression system measuring residual activity across 71 individuals and 48 ASS1 variants
          established a quantitative threshold: residual activity of 8% or less predicts more frequent
          and more severe hyperammonemic events and lower cognitive function than activity above 8%, making
          residual activity a usable severity-stratification tool rather than only a retrospective explanation.

          '
        biological_processes:
        - preferred_term: protein tetramerization
          term:
            id: GO:0051262
            label: protein tetramerization
        genes:
        - preferred_term: ASS1
          term:
            id: hgnc:758
            label: ASS1
        molecular_functions:
        - preferred_term: argininosuccinate synthase activity
          term:
            id: GO:0004055
            label: argininosuccinate synthase activity
      selected_evidence:
        snippet: the C- terminal helix domain of the mutant protein structure, which was an important
          structure for ASS1 protein to form protein tetramers, was indeed more unstable than that of
          the wild-type protein structure.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39649700
      reference_title: 'Visualization of argininosuccinate synthetase by in silico analysis: novel insights
        into citrullinemia type I disorders.'
      evidence_source: COMPUTATIONAL
      explanation: In silico analysis showing C-terminal helix instability disrupts ASS1 tetramerization.
