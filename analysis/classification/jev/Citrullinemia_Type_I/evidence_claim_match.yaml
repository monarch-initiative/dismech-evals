              label: citrullinemia type I
        context: []
      assertion_type: Genetic
      assertion:
        name: ASS1 pathogenic variants
        gene_term:
          preferred_term: ASS1
          term:
            id: hgnc:758
            label: ASS1
        inheritance:
        - name: Autosomal recessive
        variants:
        - name: ASS1 - p.P217del (c.649-651del)
          description: 'Novel in-frame deletion that results in decreased ASS1 expression at both protein
            and transcription levels, with highly significant reduction in enzyme activity.

            '
        - name: ASS1 - p.Q350* (c.1048C>T)
          description: 'Novel nonsense variant producing a truncated ASS1 protein with marked decrease
            in expression at the protein level and highly significant reduction in enzyme activity.

            '
        - name: ASS1 - p.Arg265Cys (rs148918985)
          description: 'Rare pathogenic coding variant leading to ASS1 enzyme deficiency. Found in patients
            with late-onset citrullinemia type I and associated with hyperammonemia-related dementia.

            '
        - name: ASS1 - p.Gly390Arg (rs121908641)
          description: 'Rare pathogenic coding variant that renders ASS1 enzyme completely inactive. In
            compound heterozygosity can produce late-onset citrullinemia type I.

            '
        - name: ASS1 - c.-4C>T (5'UTR hypomorphic variant)
          description: 'A non-coding variant in the 5''UTR region of ASS1 that reduces expression at both
            protein and transcription levels but does not directly affect enzyme activity. Represents
            a hypomorphic variant that may modify disease severity.

            '
        features: 'Over 100 pathogenic variants in ASS1 have been documented. The clinical spectrum from
          classic neonatal-onset to asymptomatic is determined by residual enzyme activity. Variants affecting
          the citrulline-binding site, the C-terminal oligomerization helix required for tetramer formation,
          or causing premature truncation typically produce severe disease, while hypomorphic variants
          allow milder presentations. Nonsense mutations account for approximately 7-10% of ASS1 variants.

          '
      selected_evidence:
        snippet: the C- terminal helix domain of the mutant protein structure, which was an important
          structure for ASS1 protein to form protein tetramers, was indeed more unstable than that of
          the wild-type protein structure.
        supports: SUPPORT
