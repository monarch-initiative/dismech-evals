        description: Infants appear normal at birth and within days develop hyperammonemia with progressive
          lethargy, poor feeding, vomiting and signs of raised intracranial pressure, advancing without
          intervention to increased neuromuscular tone, spasticity, ankle clonus, seizures, loss of consciousness
          and death. Prompt treatment permits survival but usually with significant neurologic deficits.
      selected_evidence:
        snippet: Infants with the acute neonatal form appear normal at birth.
        supports: SUPPORT
