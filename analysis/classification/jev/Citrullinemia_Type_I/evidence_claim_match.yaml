          known patients - GeneReviews advises scrupulous attention to diet and medication through these
          periods. This is the actionable counterpart to the pregnancy/postpartum-onset subtype: the risk
          window is predictable, so surveillance can be planned rather than relying on recognition of
          a crisis in an obstetric setting where a urea cycle disorder is rarely in the differential.

          '
