        rate_per_100000: 0.855
        notes: 'Analysis of highly sensitive newborn-screening data covering over 6 million births across
          seven large US states gives a combined birth frequency of 1 in 117,000 for argininosuccinate
          synthetase deficiency (CTLN1) and argininosuccinate lyase deficiency together. The two distal
          urea-cycle disorders are reported jointly in this analysis, so this is an upper bound on CTLN1
          alone rather than a CTLN1-specific rate.

