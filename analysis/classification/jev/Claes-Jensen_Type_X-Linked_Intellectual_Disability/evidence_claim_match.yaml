      assertion_type: Variant
      assertion:
        name: KDM5C p.Arg1115His
        description: 'A missense variant identified in an individual with MRXSCJ-like features plus autism.
          Functionally exceptional: it has no measurable effect on either enzymatic activity or protein
          stability, yet when overexpressed in post-mitotic neurons it fails to fully suppress KDM5C target
          genes and additionally perturbs a distinct gene set. It is the primary evidence that KDM5C has
          disease-relevant non-enzymatic roles, and the reason the pathophysiology here models an enzymatic
          and a scaffolding arm separately.

          '
        gene:
          preferred_term: KDM5C
          term:
            id: hgnc:11114
            label: KDM5C
        type: MISSENSE
      selected_evidence:
        snippet: Here, we report a novel KDM5C mutation, R1115H, identified in an individual displaying
          MRXSCJ-like symptoms.
        supports: SUPPORT
