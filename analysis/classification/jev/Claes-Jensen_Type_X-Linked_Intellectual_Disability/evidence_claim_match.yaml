        context: []
      assertion_type: Diagnosis
      assertion:
        name: Peripheral Blood DNA Methylation Episignature
        description: 'Claes-Jensen syndrome has a validated peripheral-blood DNA methylation episignature
          comprising 1769 CpGs and 9 genomic regions, derived from 7 affected males against 56 matched
          controls. Healthy heterozygous female carriers show intermediate, distinguishable changes, so
          the assay identifies carriers as well as patients. Its principal clinical use is resolving variants
          of uncertain significance and confirming carrier status. The reported 100% accuracy figures
          come from a 7-patient training cohort and reflect specificity against large control sets more
          than sensitivity across the full allelic spectrum; independent multicentre work has shown published
          episignatures perform very unequally, so this performance should not be generalised.

          '
      selected_evidence:
        snippet: Genome-wide DNA methylation analysis of 7 male patients affected with Claes-Jensen syndrome
          and 56 age- and sex-matched controls identified a specific DNA methylation defect (epi-signature)
          in the peripheral blood of these patients, including 1769 individual CpGs and 9 genomic regions.
        supports: SUPPORT
