      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: wnt_window_rescue
        hypothesis_label: Transient developmental-window WNT inhibition is disease-modifying
        status: EMERGING
        description: 'Because KDM5C sets neurodevelopmental tempo through WNT output during a circumscribed
          prenatal window, transient WNT-pathway inhibition confined to that window may be disease-modifying
          rather than merely symptomatic. The evidence is a single high-quality study in Kdm5c-knockout
          mice and patient-derived iPSCs. The central translational obstacle is that the window plausibly
          closes before postnatal molecular diagnosis is achievable.

          '
      selected_evidence:
        snippet: Treatment with WNT signalling modulators at specific times reveal that only a transient
          alteration of the canonical WNT signalling pathway is sufficient to rescue the transcriptomic
          and chromatin landscapes in patient-derived cells
        supports: SUPPORT
