          histone deacetylase inhibitor SAHA (vorinostat) rescued KDM5C depletion, recovered H3K4me3 signalling
          and improved neuronal differentiation in Arx-knockout mouse embryonic stem-cell-derived neurons,
          and improved behaviour in ARX-deficient C. elegans. IMPORTANT LIMITATION: this rescue was demonstrated
          in models where KDM5C is transcriptionally downregulated because its upstream activator ARX
          is lost, not in models carrying a KDM5C coding variant. Raising expression of a mutant KDM5C
          allele would not be expected to help in most Claes-Jensen genotypes, so this hypothesis is at
          best applicable to a hypothetical regulatory-variant subset and should not be read as a therapeutic
          lead for typical KDM5C loss-of-function disease.

          '
      selected_evidence:
        snippet: In Arx-KO murine ES-derived neurons, SAHA was able to rescue KDM5C depletion, recover
          H3K4me3 signalling and improve neuronal differentiation.
