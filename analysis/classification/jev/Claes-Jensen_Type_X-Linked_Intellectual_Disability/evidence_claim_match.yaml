  7ff5ba6cb1dd5c6a72b12ee1b9b9da81b489e2fa82f81dc69490b01c18c72c6e:
    claim:
      about:
        disease:
          name: Claes-Jensen Type X-Linked Intellectual Disability
          disease_term:
            preferred_term: syndromic X-linked intellectual disability Claes-Jensen type
            term:
              id: MONDO:0010355
              label: syndromic X-linked intellectual disability Claes-Jensen type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mistimed Canonical WNT Signalling and Progenitor Transition
        biological_scale: CELLULAR
        description: 'During a defined prenatal window of corticogenesis, KDM5C directly controls canonical
          WNT output to set the timing of the primary-to-intermediate neural progenitor transition and
          therefore the tempo of neurogenesis. Loss of KDM5C removes this timing safeguard. The deficit
          is developmental-window dependent and, in mice and patient-derived induced pluripotent stem
          cells, transiently reversible: WNT-pathway modulation restricted to that window rescues the
          transcriptomic and chromatin landscapes in patient-derived cells and rescues behavioural abnormalities
          in Kdm5c-knockout mice. Conversely, a single WNT3A injection into wild-type embryonic mouse
          brain produces anxiety and memory changes. This is the most therapeutically actionable mechanism
          identified to date, but the window may close before postnatal molecular diagnosis is possible.

          '
        biological_processes:
        - preferred_term: Canonical Wnt signaling pathway
          term:
            id: GO:0060070
            label: canonical Wnt signaling pathway
          modifier: ABNORMAL
        - preferred_term: Cerebral cortex neuron differentiation
          term:
            id: GO:0021895
            label: cerebral cortex neuron differentiation
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        locations:
        - preferred_term: Cerebral cortex
          term:
            id: UBERON:0000956
            label: cerebral cortex
      selected_evidence:
        snippet: KDM5C is identified as a safeguard to ensure that neurodevelopment occurs at an appropriate
          timescale, the disruption of which leads to intellectual disability.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
