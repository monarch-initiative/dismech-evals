            term:
              id: MONDO:0010355
              label: syndromic X-linked intellectual disability Claes-Jensen type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kdm5c_female_penetrance_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What determines whether a heterozygous KDM5C female is affected, given that skewed X-inactivation
          does not reliably explain it?
        attaches_to:
        - pathophysiology#Loss of KDM5C H3K4me3/me2 Demethylase Function
        rationale: 'Skewed X-inactivation is the conventional explanation for variable expression in X-linked
          disease, but it is a poor fit here. KDM5C escapes X-inactivation, so the inactive-X allele still
          contributes, and a symptomatic de novo female with no significant XCI skewing is documented.
          Meanwhile X-inactivation pattern did correlate with phenotypic expression in another cohort.
          Without a mechanism, counselling for a female fetus carrying a familial variant cannot be individualised
          beyond a population-level probability.

          '
        proposed_experiments:
        - experiment_id: xci_allele_specific_expression
          name: Allele-specific KDM5C expression versus XCI in heterozygous females
          description: 'Quantify allele-specific KDM5C expression in accessible tissues from affected
            versus unaffected heterozygous females, paired with a quantitative X-chromosome inactivation
            assay, to test whether residual KDM5C dose rather than XCI pattern predicts phenotype.

            '
          decision_criterion: 'Allele-specific KDM5C expression separates affected from unaffected heterozygotes
            more cleanly than the XCI ratio does.

            '
          supporting_outcome:
          - KDM5C dose, not XCI skewing per se, determines female manifestation.
          refuting_outcome:
          - XCI skewing remains the dominant determinant and the escape-from-XCI argument is not phenotypically
            relevant.
        - experiment_id: xci_single_cell_mosaic
          name: Single-cell profiling of heterozygous female patient-derived neurons
          description: 'Single-cell transcriptomic profiling of patient-derived neurons from heterozygous
            females to test whether mosaic cell-by-cell KDM5C dose, rather than tissue-average dose, predicts
            the phenotype.

            '
          decision_criterion: 'The fraction of neurons falling below a KDM5C expression threshold correlates
            with clinical severity better than mean expression.

            '
          supporting_outcome:
          - A cellular-mosaic threshold model of female manifestation.
          refuting_outcome:
          - A simple average-dose model of female manifestation.
      selected_evidence:
        snippet: X-chromosome inactivation (XCI) analysis showed no significant skewed X-inactivation.
        supports: SUPPORT
    origin:
