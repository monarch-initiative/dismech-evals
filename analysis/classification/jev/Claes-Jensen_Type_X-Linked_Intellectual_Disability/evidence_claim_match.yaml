              label: syndromic X-linked intellectual disability Claes-Jensen type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kdm5c_single_cell_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which specific neuronal subtypes and brain regions mediate the cognitive and behavioural
          phenotype of KDM5C loss?
        attaches_to:
        - pathophysiology#Reduced Dendritic Arborisation and Spine Density
        rationale: 'Mouse data show strongly region-specific consequences, with the amygdala considerably
          more affected than the frontal cortex in both transcriptome and dendritic morphology. No single-cell
          or spatial transcriptomic dataset specific to this disorder has been published, so the cell
          types that actually mediate the phenotype remain inferred rather than identified. This limits
          both mechanistic understanding and the design of any cell-type-directed therapy.

          '
        proposed_experiments:
        - experiment_id: kdm5c_snrnaseq_spatial_atlas
          name: Single-nucleus and spatial transcriptomics of Kdm5c-knockout brain
          description: 'Single-nucleus RNA-seq and spatial transcriptomics across amygdala, hippocampus
            and cortex in Kdm5c-knockout versus wild-type mice at multiple developmental stages, to identify
            which neuronal subtypes carry the transcriptional lesion.

            '
          decision_criterion: 'One or a small number of neuronal subtypes account for the majority of
            differentially expressed genes.

            '
          supporting_outcome:
          - A cell-type-restricted mechanism amenable to targeted intervention.
          refuting_outcome:
          - A pan-neuronal mechanism with no privileged cell-type target.
        - experiment_id: kdm5c_celltype_conditional_ko
          name: Cell-type-restricted conditional Kdm5c deletion
          description: 'Conditional Kdm5c deletion restricted to defined excitatory and inhibitory neuronal
            subtypes to test which population is sufficient to produce the behavioural phenotype.

            '
          decision_criterion: 'Deletion in a single defined subtype reproduces the social, memory or aggression
            phenotype of the global knockout.

            '
          supporting_outcome:
          - Sufficiency of a specific neuronal population for the behavioural phenotype.
          refuting_outcome:
          - A requirement for distributed loss across multiple neuronal populations.
      selected_evidence:
        snippet: our findings suggest that loss of KDM5C function may impact gene expression in multiple
          regulatory pathways relevant to the clinical phenotypes
        supports: SUPPORT
