              label: syndromic X-linked intellectual disability Claes-Jensen type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Pathogenic KDM5C Variant
        biological_scale: MOLECULAR
        description: 'A hemizygous (males) or heterozygous (females) pathogenic variant in KDM5C is the
          shared upstream lesion from which the two mechanistic arms of this disorder diverge. Most reported
          variants reduce or abolish JmjC-domain catalytic output, engaging the demethylase arm. However,
          catalytic loss is not required: the R1115H substitution leaves both enzymatic activity and protein
          stability intact yet still fails to repress KDM5C target genes, demonstrating that disruption
          of the non-enzymatic REST/HDAC1-2/G9a scaffolding role is a parallel consequence of the variant
          rather than a downstream consequence of demethylase loss. The two arms are therefore modelled
          as siblings fanning out from this node, not as a chain.

          '
      selected_evidence:
        snippet: The KDM5C-R1115H substitution does not have an impact on enzymatic activity nor protein
          stability.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29670509
      reference_title: Altered Gene-Regulatory Function of KDM5C by a Novel Mutation Associated With Autism
        and Intellectual Disability.
      evidence_source: IN_VITRO
      explanation: 'A pathogenic variant that spares catalytic activity establishes that the scaffolding
        arm can be engaged independently of demethylase loss, which is what licenses both arms to hang
        off the variant node in parallel.

        '
