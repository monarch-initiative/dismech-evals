      assertion_type: DifferentialDiagnosis
      assertion:
        name: Wiedemann-Steiner syndrome
        disease_term:
          preferred_term: Wiedemann-Steiner syndrome
          term:
            id: MONDO:0011518
            label: Wiedemann-Steiner syndrome
        description: 'The mechanistic mirror image of this disorder: KMT2A writes the same H3K4 methyl
          mark that KDM5C erases, and the two mouse models share reduced dendritic spines and increased
          aggression. Because KMT2A is frequently discussed in KDM5C mechanism papers, this pairing is
          a recognised source of entity confusion; the two are distinct diseases with distinct genes,
          and a KDM5C entry must not absorb Wiedemann-Steiner content.

          '
        distinguishing_features:
        - Caused by autosomal dominant KMT2A variants, not X-linked KDM5C variants
        - Hypertrichosis cubiti and a distinct facial gestalt
        - No sex-biased severity, unlike the male-predominant severity of Claes-Jensen type
      selected_evidence:
        snippet: we show functional interactions of a writer-eraser duo, KMT2A and KDM5C, which are responsible
          for Wiedemann-Steiner Syndrome (WDSTS), and mental retardation X-linked syndromic Claes-Jensen
          type (MRXSCJ), respectively
        supports: SUPPORT
