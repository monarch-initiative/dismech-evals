            label: X-linked inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        description: 'Heterozygous females are frequently affected, which the strict recessive label does
          not convey. Contemporary series report intellectual disability or learning disability in a majority
          of heterozygous females, predominantly mild, with behavioural disturbance common and endocrine
          problems more frequent than in males. A minority of heterozygotes are wholly asymptomatic. The
          mechanistic basis is that KDM5C escapes X-inactivation, so females normally express it from
          both X chromosomes and carry a higher baseline dose; heterozygosity therefore produces a partial
          rather than an all-or-none dose reduction. Skewed X-inactivation is an incomplete explanation
          - a symptomatic de novo female with no significant XCI skewing is documented. This has direct
          counselling consequences: a female fetus inheriting the familial variant cannot be described
          as an unaffected carrier.

          '
      selected_evidence:
        snippet: Four heterozygous females were asymptomatic.
