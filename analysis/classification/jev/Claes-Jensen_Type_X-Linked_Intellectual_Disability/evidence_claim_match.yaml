      assertion_type: Treatment
      assertion:
        name: Genetic Counseling and Cascade Testing
        description: 'Counselling must be updated for current evidence. De novo variants are now the majority
          mode, so recurrence risk in an apparently sporadic family is far lower than the classic X-linked-recessive
          family framing implies (with an empiric allowance for gonadal mosaicism). Crucially, a daughter
          who inherits the familial variant cannot be counselled as an unaffected carrier: a majority
          of heterozygous females have learning disability or intellectual disability, and a substantial
          minority have seizures. Cascade testing of at-risk female relatives is therefore both a reproductive
          and a diagnostic intervention. The DNA methylation episignature independently identifies carriers.
          Prenatal diagnosis and preimplantation genetic testing are available once the familial variant
          is known.

          '
        treatment_term:
