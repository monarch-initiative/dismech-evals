  76bb42142afa95724e8290d6ce802bc44b6c7ee2b3606219e28bcb790099430e:
    claim:
      about:
        disease:
          name: Claes-Jensen Type X-Linked Intellectual Disability
          disease_term:
            preferred_term: syndromic X-linked intellectual disability Claes-Jensen type
            term:
              id: MONDO:0010355
              label: syndromic X-linked intellectual disability Claes-Jensen type
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: kdm5c_wnt_window_translatability
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Is the WNT-dependent developmental window that permits phenotypic rescue in Kdm5c-knockout
          mice still open at the age at which human patients are diagnosed?
        attaches_to:
        - pathophysiology#Mistimed Canonical WNT Signalling and Progenitor Transition
        rationale: 'The rescue result is strong but window-bounded: only transient WNT modulation during
          a specific developmental period rescues transcriptomic, chromatin and behavioural phenotypes.
          In humans, KDM5C-related disease is typically diagnosed postnatally after developmental delay
          becomes apparent, by which time the corticogenesis window that the mouse experiment targets
          has almost certainly closed. Whether any residual window exists in humans, and whether the mouse
          window maps onto a human developmental stage at all, is unresolved and determines whether this
          mechanism is therapeutically reachable or only explanatory.

          '
        proposed_experiments:
        - experiment_id: wnt_window_organoid_mapping
          name: Map the human WNT-sensitive window in cortical organoids
          description: 'Define the developmental interval during which WNT modulation rescues transcriptomic
            and chromatin phenotypes in KDM5C patient-derived human cortical organoids, and align it against
            the equivalent mouse corticogenesis stages.

            '
          decision_criterion: 'A WNT-sensitive interval is identifiable in human organoids and can be
            mapped onto a defined human gestational stage.

            '
          supporting_outcome:
          - The mouse rescue window has a definable human counterpart.
          refuting_outcome:
          - The rescue window is a mouse-specific developmental feature without a human analogue.
        - experiment_id: wnt_postnatal_modulation
          name: Postnatal-equivalent WNT modulation in Kdm5c-knockout mice
          description: 'Test whether WNT modulation delivered after the previously defined embryonic window
            confers any partial behavioural or transcriptomic benefit in Kdm5c-knockout mice.

            '
          decision_criterion: 'Any statistically significant behavioural improvement after postnatal dosing
            relative to vehicle.

            '
          supporting_outcome:
          - A residual therapeutic window exists after the age at which human diagnosis is realistic.
          refuting_outcome:
          - The mechanism is explanatory only and not therapeutically reachable postnatally.
      selected_evidence:
        snippet: only a transient alteration of the canonical WNT signalling pathway is sufficient to
          rescue the transcriptomic and chromatin landscapes in patient-derived cells
        supports: SUPPORT
    origin:
