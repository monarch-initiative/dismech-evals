          male, 18% female), Ghasemi''s literature review gives 64% male / 19% female, and the RARE-X
          newly recruited female subcohort gives 56%. Registry self-enrolment enriches for symptomatic
          females while historical XLMR-family literature enriches for severely affected males; per docs/frequency-evidence-guidelines.md
          the band is omitted rather than guessed. Variants in the catalytic domain appear enriched for
          seizures.

          '
        phenotype_term:
          preferred_term: Seizure
          term:
