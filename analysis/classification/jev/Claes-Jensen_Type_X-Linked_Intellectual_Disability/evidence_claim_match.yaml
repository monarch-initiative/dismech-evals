          name: Claes-Jensen Type X-Linked Intellectual Disability
          disease_term:
            preferred_term: syndromic X-linked intellectual disability Claes-Jensen type
            term:
              id: MONDO:0010355
              label: syndromic X-linked intellectual disability Claes-Jensen type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of KDM5C H3K4me3/me2 Demethylase Function
        biological_scale: MOLECULAR
        description: 'KDM5C is a JmjC-domain, Fe(II)/2-oxoglutarate-dependent histone demethylase that
          converts H3K4me3 to H3K4me2 and H3K4me1 (but not to the unmethylated product). Pathogenic variants
          abolish or reduce this catalytic output by several distinct routes: nonsense/frameshift alleles
          that eliminate the transcript or protein, missense alleles that destabilise the protein, and
          missense alleles within or adjacent to the catalytic JmjC/C5HC2 module that directly impair
          turnover. Variants adjacent to the accessory ARID and PHD1 domains additionally corrupt substrate
          recognition by enhancing non-specific DNA binding. ClinGen assigns KDM5C a haploinsufficiency
          score of 3, and the gene is extremely loss-of-function intolerant, consistent with a pure loss-of-function
          mechanism rather than gain-of-function or dominant-negative action.

          '
        molecular_functions:
        - preferred_term: histone H3K4 demethylase activity
          term:
            id: GO:0032453
            label: histone H3K4 demethylase activity
          modifier: DECREASED
        - preferred_term: histone H3K4me/H3K4me2/H3K4me3 demethylase activity
          term:
            id: GO:0034647
            label: histone H3K4me/H3K4me2/H3K4me3 demethylase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: Protein demethylation
          term:
            id: GO:0006482
            label: protein demethylation
          modifier: DECREASED
        - preferred_term: Chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: ABNORMAL
        locations:
        - preferred_term: Brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: One gene found to be genetically altered in the X-linked intellectual disability disorder
          Claes-Jensen syndrome is KDM5C, which encodes a histone demethylase that regulates transcription
          by altering chromatin.
        supports: SUPPORT
