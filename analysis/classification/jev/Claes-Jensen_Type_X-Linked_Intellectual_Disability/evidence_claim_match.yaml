            term:
              id: MONDO:0010355
              label: syndromic X-linked intellectual disability Claes-Jensen type
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Locus-Specific H3K4me3 Fine-Tuning at CpG-Island Promoters
        biological_scale: MOLECULAR
        description: 'In neurons KDM5C is recruited to CpG-island promoters already decorated with high
          H3K4me3, where it trims rather than erases the mark. The consequence of KDM5C loss is therefore
          not a bulk collapse of chromatin state but a locus-specific failure of transcriptional fine-tuning,
          biased toward upregulation of lowly expressed target genes. KDM5C performs the same trimming
          function at activity-regulated enhancers during neuronal maturation. This distinction matters
          mechanistically: global H3K4 methylation levels are preserved in patient fibroblasts and in
          Kdm5c-null neurons, so the pathology arises from mis-set thresholds at specific regulatory elements.

          '
        biological_processes:
        - preferred_term: Chromatin remodeling
          term:
            id: GO:0006338
            label: chromatin remodeling
          modifier: ABNORMAL
        - preferred_term: Regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: ABNORMAL
        cell_types:
        - preferred_term: Neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: In neurons, Kdm5c is recruited to promoters that harbor CpG islands decorated with high
          levels of H3K4me3, where it fine-tunes H3K4me3 levels.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
