          term:
            id: UBERON:0002421
            label: hippocampal formation
      selected_evidence:
        snippet: dKDM-ifKOs display more severe behavioral impairments than the single ifKOs along with
          altered hippocampal expression of ion channels and increased excitability of CA1 pyramidal neurons
        supports: SUPPORT
