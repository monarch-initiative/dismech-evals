              id: MONDO:0010355
              label: syndromic X-linked intellectual disability Claes-Jensen type
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Trio Exome or Genome Sequencing
        description: 'Molecular diagnosis is the definitive test; there are no formal clinical diagnostic
          criteria for this disorder and the phenotype is not specific enough to be distinguished clinically
          from other X-linked intellectual disability. Trio-based exome or genome sequencing is first-line
          for unexplained global developmental delay, and the trio design matters because de novo variants
          are now the majority mode. Chromosomal microarray covers the small Xp11.22 microdeletion fraction.
          Synonymous and splice-region variants can be pathogenic through splicing effects, so RNA studies
          should be considered before dismissing a segregating variant of this type.

          '
      selected_evidence:
        snippet: The study identified a novel variant, c.2704C>T:p.Gln902X, located in exon 19 of the
          KDM5C gene (NM_004187.5) using Whole exome sequencing (WES), highlighting the utility of this
          approach in identifying rare genetic disorders.
        supports: SUPPORT
