      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: h3k4_writer_eraser_rebalancing
        hypothesis_label: Rebalancing the KMT2A/KDM5C writer-eraser pair ameliorates the phenotype
        status: EMERGING
        description: 'KDM5C (eraser) and KMT2A (writer) act on the same H3K4 mark, and their respective
          loss-of-function mouse models share reduced dendritic spines and increased aggression. Combined
          loss of both mutually suppresses these phenotypes, suggesting that pharmacological reduction
          of KMT2A activity could ameliorate KDM5C deficiency. This is a genetic proof of principle in
          mice only; no pharmacological agent has been tested in this context. Note that KMT2A is the
          Wiedemann-Steiner syndrome gene - it is cited here purely as a mechanistic counterweight, and
          Wiedemann-Steiner syndrome is a distinct disease entity, not a synonym or subtype of this disorder.

          '
      selected_evidence:
        snippet: Double mutation of Kmt2a and Kdm5c clearly reversed dendritic morphology, key behavioral
          traits including aggression, and partially corrected altered transcriptomes and H3K4me landscapes.
        supports: SUPPORT
    origin:
