              label: classic Hodgkin lymphoma
        context: []
      assertion_type: Genetic
      assertion:
        name: KLHDC8B
        gene_term:
          preferred_term: KLHDC8B
          term:
            id: hgnc:28557
            label: KLHDC8B
        association: Germline predisposition in familial classic Hodgkin lymphoma
        relationship_type: SUSCEPTIBILITY
        variant_origin: GERMLINE
        notes: 'The only germline record in this otherwise somatic entry, and the only one graded below
          SOMATIC_DRIVER. KLHDC8B is a midbody kelch protein required for cytokinesis, and its loss produces
          binucleate cells - the morphology that defines the Reed-Sternberg cell - so the mechanistic
          story is unusually specific for a predisposition gene. The human genetic evidence is a segregating
          translocation in one pedigree, a 5''-UTR variant associated with and segregating in further
          pedigrees, and LOH in sorted RS cells from one of three informative sporadic cases; a 2023 whole-genome
          study of 36 HL pedigrees independently recovered the same 5''-UTR variant among its top four
          recurrent risk variants.

          It is graded SUSCEPTIBILITY rather than CAUSATIVE on three grounds. The evidence is a familial
          risk allele of incomplete penetrance rather than a Mendelian lesion; a five-member nodular-sclerosis
          pedigree with linkage at 3p21 was sequenced in 2018 and carried no KLHDC8B variant at all, with
          KLHDC8B expression indistinguishable between carriers and non-carriers; and the ClinGen gene-validity
          CSV committed in this repository has no KLHDC8B row (`grep ''"KLHDC8B",'' cache/clingen/gene_validity.csv`
          returns nothing), so there is no expert-panel classification to defer to. The refuting study
          is recorded below as its own evidence item rather than being left out.

          The grading is deliberate and is expected to be flattened by the current KGX exporter, which
          hardcodes `biolink:contributes_to` and never reads `relationship_type` (dismech#12320) - so
          this will export looking like the somatic drivers beside it until that is fixed.'
      selected_evidence:
        snippet: We tested KLHDC8B as a candidate gene for cHL and found that a 5'-UTR polymorphism responsible
          for decreasing its translational expression is associated with cHL in probands from other families
          with cHL and segregates with disease in those pedigrees
        supports: SUPPORT
    origin:
      assertion_path: /genetic/10
      evidence_path: /genetic/10/evidence/0
      context_paths:
