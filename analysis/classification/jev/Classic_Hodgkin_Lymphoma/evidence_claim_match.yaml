            term:
              id: MONDO:0009348
              label: classic Hodgkin lymphoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mutation-Driven MHC Class I Loss
        genetic_context:
          variant_origin: SOMATIC
        description: One of two genetically separate antigen-presentation arms, split from its class II
          sibling because the two reach the same immune-evasion endpoint by different immunological routes.
          Recurrent somatic B2M lesions disrupt beta-2-microglobulin, the invariant light chain every
          class I molecule needs to reach the cell surface, so HRS cells lose surface MHC class I and
          with it direct CD8 cytotoxic T-cell recognition. This is not the same mechanism as checkpoint-ligand-mediated
          inhibition of the T cells that do still recognise the tumour.
        genes:
        - preferred_term: B2M
          term:
            id: hgnc:914
            label: B2M
        cell_types:
        - preferred_term: germinal center B cell
          term:
            id: CL:0000844
            label: germinal center B cell
        biological_processes:
        - preferred_term: antigen processing and presentation of peptide antigen via MHC class I
          modifier: DECREASED
          term:
            id: GO:0002474
            label: antigen processing and presentation of peptide antigen via MHC class I
      selected_evidence:
        snippet: Hodgkin Reed-Sternberg (HRS) cells evade antitumor immunity by multiple means, including
          gains of 9p24.1/ CD274(PD-L1)/ PDCD1LG2(PD-L2) and perturbed antigen presentation.
        supports: SUPPORT
    origin:
