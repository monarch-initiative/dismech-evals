          comprehensive review, 11 patients from 9 families had been reported.

          '
      selected_evidence:
        snippet: 'In 2018, Blackburn et al. (2018) identified biallelic variants in the adipocyte enhancer
          binding protein 1 (AEBP1) gene in patients displaying EDS-like features that were considered
          to represent a new subtype of EDS and were tentatively named classical-like type 2 (clEDS2;
          MIM #618000)'
        supports: SUPPORT
