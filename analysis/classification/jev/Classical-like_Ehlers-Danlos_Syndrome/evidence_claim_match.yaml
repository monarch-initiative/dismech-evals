        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Skin Fragility and Hyperextensibility
        biological_scale: TISSUE
        locations:
        - preferred_term: dermis
          term:
            id: UBERON:0002067
            label: dermis
        description: Reduced dermal tensile strength manifests as hyperextensible, often translucent and
          thin skin, easy bruising, delayed wound healing, and piezogenic pedal papules (subcutaneous
          fat herniation through weakened dermis). clEDS-1 is characteristically without the atrophic
          (cigarette-paper) scarring of classic EDS, but clEDS-2 does show atrophic scarring -- a subtype
          difference in how the same underlying dermal weakness resolves during healing.
      selected_evidence:
        snippet: Affected individuals have generalized joint hypermobility, hyperextensible skin, and
          easy bruising, but do not have atrophic scarring, as is seen in cEDS.
        supports: SUPPORT
