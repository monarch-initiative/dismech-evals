        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: heterozygous_tnxb_and_hypermobile_eds
        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#TNXB
        - inheritance#Autosomal Recessive Inheritance
        prompt: Do heterozygous (carrier) TNXB variants contribute to hypermobile Ehlers-Danlos syndrome
          (hEDS) or a milder connective-tissue phenotype, beyond the biallelic loss-of-function threshold
          that causes clEDS-1 itself?
        rationale: 'This entry models clEDS-1 as strictly autosomal recessive, with heterozygous carriers
          "generally unaffected or only mildly symptomatic" per the cited GeneReviews chapter. Two independent
          2026 case reports complicate that picture without settling it: a four-sibling Nusayri family
          in which the one heterozygous carrier met clinical criteria for hEDS while his parents (also
          heterozygous) were asymptomatic, and a Polish cohort in which a heterozygous frameshift carrier
          and her father both showed mild joint hypermobility with no phenotype in other non-carrier relatives.
          Both papers explicitly stop short of a causal claim, citing incomplete penetrance and variable
          expressivity as unresolved. The gap is recorded here rather than folded into a confident phenotype/inheritance
          claim, since the evidence is small-pedigree and inconsistent (symptomatic vs. asymptomatic carriers
          within the same reports).'
      selected_evidence:
        snippet: The clinical findings suggest the potential role of TNXB haploinsufficiency in hEDS;
          however, further research is needed to elucidate the variable expressivity and possible incomplete
          penetrance associated with hmEDS.
        supports: SUPPORT
        directness: DIRECT
    origin:
