      assertion_type: Pathophysiology
      assertion:
        name: IL-6 Inflammatory Signaling
        description: ARID1A and PIK3CA cooperation converges on sustained IL-6 signaling, linking chromatin
          remodeling defects and PI3K pathway activation to a pro-tumorigenic inflammatory state. In human
          disease, elevated IL-6 is strongest in advanced OCCC and is associated with thrombotic risk
          and worse progression outcomes.
        biological_processes:
        - preferred_term: interleukin-6-mediated signaling pathway
          modifier: INCREASED
          term:
            id: GO:0070102
            label: interleukin-6-mediated signaling pathway
      selected_evidence:
        snippet: Cross-species gene expression comparisons support a role for IL-6 inflammatory cytokine
          signalling in OCCC pathogenesis. We further show that ARID1A and PIK3CA mutations cooperate
          to promote tumour growth through sustained IL-6 overproduction.
        supports: SUPPORT
    origin:
