            id: CL:0002656
            label: glandular endometrial unciliated epithelial cell
        locations:
        - preferred_term: ovary
          term:
            id: UBERON:0000992
            label: ovary
      selected_evidence:
        snippet: All of the 31 informative cases showed loss of ARID1A immunoreactivity in the carcinoma
          and in the endometriotic cyst epithelium in direct continuity with the carcinoma but not in
          the cyst epithelium that was not adjacent to the tumor.
        supports: SUPPORT
