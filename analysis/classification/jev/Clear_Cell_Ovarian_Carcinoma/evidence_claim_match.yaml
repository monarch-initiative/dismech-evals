          term:
            id: GO:0006979
            label: response to oxidative stress
      selected_evidence:
        snippet: Augmented cell survival was based on the reduced ROS activity derived from metabolic
          alteration such as shift from oxidative phosphorylation to glycolysis and increased intracellular
          anti-oxidant, glutathione (GSH).
        supports: SUPPORT
