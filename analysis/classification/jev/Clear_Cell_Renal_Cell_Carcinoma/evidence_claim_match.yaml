      assertion_type: Pathophysiology
      assertion:
        name: Metabolic Reprogramming and Aerobic Glycolysis
        conforms_to: deregulated_cellular_energetics#Aerobic Glycolysis (Warburg Effect)
        description: 'Constitutive HIF stabilization from VHL loss reprograms tumor-cell metabolism toward
          aerobic glycolysis (the Warburg effect): HIF induces the glucose transporter GLUT1, glycolytic
          enzymes, lactate dehydrogenase A, and PDK1, while the TCA cycle is downregulated. Carbon is
          diverted into the pentose phosphate pathway and, together with increased fatty-acid synthesis,
          into biomass. The resulting glycogen and lipid accumulation produces the characteristic clear
          (lipid-laden) cytoplasm for which the tumor is named.'
        cell_types:
        - preferred_term: kidney epithelial cell
          term:
            id: CL:0002518
            label: kidney epithelial cell
        biological_processes:
        - preferred_term: glycolytic process
          modifier: INCREASED
          term:
            id: GO:0006096
            label: glycolytic process
        - preferred_term: tricarboxylic acid cycle
          modifier: DECREASED
          term:
            id: GO:0006099
            label: tricarboxylic acid cycle
      selected_evidence:
        snippet: Aggressive cancers demonstrated evidence of a metabolic shift, involving downregulation
          of genes involved in the TCA cycle, decreased AMPK and PTEN protein levels, upregulation of
          the pentose phosphate pathway and the glutamine transporter genes, increased acetyl-CoA carboxylase
          protein
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23792563
      reference_title: Comprehensive molecular characterization of clear cell renal cell carcinoma.
      evidence_source: HUMAN_CLINICAL
      explanation: The TCGA molecular characterization of more than 400 ccRCC tumors documents a recurrent
        metabolic shift (TCA-cycle downregulation, pentose-phosphate-pathway and glutamine-transporter
        upregulation) that correlates with stage and severity, supporting aerobic-glycolysis-directed
        metabolic reprogramming.
