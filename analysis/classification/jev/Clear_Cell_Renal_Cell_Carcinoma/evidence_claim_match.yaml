  912dc6f54514df04ca5117ff5ce8d172a7359dd75b9ba4b5180d157238398fe4:
    claim:
      about:
        disease:
          name: Clear Cell Renal Cell Carcinoma
          disease_term:
            preferred_term: clear cell renal cell carcinoma
            term:
              id: MONDO:0005005
              label: clear cell renal carcinoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ccrcc_vegfr_tki_hypertension_as_efficacy_biomarker
        prompt: Should on-treatment hypertension be used to guide VEGFR TKI dosing in metastatic ccRCC
          — titrating dose upward until blood pressure rises — or does it only index drug exposure retrospectively?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Treatment-Emergent Vasoconstriction and Increased Peripheral Vascular Resistance
        - phenotypes#Treatment-Emergent Hypertension
        - treatments#VEGFR Tyrosine Kinase Inhibitors
        rationale: 'ccRCC is where this question is decided, because the pivotal data are in sunitinib-treated
          mRCC rather than in the drug class at large. Two independent analyses of the pooled sunitinib
          trial database associate on-treatment hypertension with markedly better response, progression-free
          survival, and overall survival, and the association survives adjustment for baseline IMDC risk.
          That is a strong pharmacodynamic signal: because the toxicity is on-target, a blood-pressure
          rise plausibly reports how much VEGF pathway inhibition a given patient actually achieved. It
          is nonetheless recorded here as an open question, not as an established prognostic or dosing
          rule, for two reasons. First, both analyses are retrospective analyses of the same pooled database,
          so they are not independent replications; the time-dependent-covariate and landmark analyses
          address immortal-time bias but do not make the design prospective. Second, an association between
          a toxicity and a good outcome does not license the inverse intervention — no trial has shown
          that deliberately dose-escalating to a blood-pressure target improves survival, and treating
          the absence of hypertension as undertreatment would be a clinically consequential inference
          drawn from an observational correlation. Curating this as settled would license exactly that
          inference. This is the ccRCC-specific instance of the module-level open question recorded as
          vegfi_hypertension_as_efficacy_biomarker in kb/modules/vegf_inhibitor_hypertension.yaml.'
      selected_evidence:
        snippet: In patients with metastatic renal cell carcinoma, sunitinib-associated HTN is associated
          with improved clinical outcomes without clinically significant increases in HTN-associated adverse
          events, supporting its viability as an efficacy biomarker.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21527770
      reference_title: Hypertension as a biomarker of efficacy in patients with metastatic renal cell
        carcinoma treated with sunitinib.
      evidence_source: HUMAN_CLINICAL
      explanation: The primary source of the biomarker claim in ccRCC. Note its own wording is "supporting
        its viability as", i.e. a candidate biomarker, which is why this is curated as an open question
        rather than as established practice.
