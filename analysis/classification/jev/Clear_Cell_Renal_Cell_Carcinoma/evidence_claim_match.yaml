      assertion_type: Pathophysiology
      assertion:
        name: Immune Evasion via PD-L1 and Immunosuppressive Microenvironment
        conforms_to: immune_checkpoint_blockade#Adaptive Immune Resistance
        description: ccRCC is among the most immune-infiltrated solid tumors, with abundant CD8+ T cells
          in the tumor microenvironment. However, chronic VHL-HIF signaling promotes an immunosuppressive
          milieu through VEGF-mediated inhibition of dendritic cell maturation, PD-L1 upregulation on
          tumor cells, and recruitment of regulatory T cells and myeloid-derived suppressor cells. This
          inherent immunogenicity combined with adaptive immune resistance provides the rationale for
          checkpoint inhibitor therapy.
        cell_types:
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: Negative Regulation of T Cell Mediated Immunity
          term:
            id: GO:0002710
            label: negative regulation of T cell mediated immunity
          modifier: INCREASED
      selected_evidence:
        snippet: The interaction of PD-1 and PD-L1 negatively regulates adaptive immune response mainly
          by inhibiting the activity of effector T cells while enhancing the function of immunosuppressive
          regulatory T cells (Tregs), largely contributing to the maintenance of immune homeostasis that
          prevents dysregulated immunity and harmful immune responses. However, cancer cells exploit the
          PD-1/PD-L1 axis to cause immune escape in cancer development and progression.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38762484
      reference_title: Regulatory mechanisms of PD-1/PD-L1 in cancers.
      evidence_source: OTHER
      explanation: Review describing how tumors including ccRCC exploit PD-1/PD-L1 signaling to suppress
