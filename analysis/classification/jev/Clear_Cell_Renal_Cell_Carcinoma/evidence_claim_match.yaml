        frequency: VERY_FREQUENT
        description: New or worsened systemic arterial hypertension emerging during VEGFR tyrosine kinase
          inhibitor therapy. This is a therapy-emergent manifestation, not a feature of untreated ccRCC,
          and it is usually reversible on interruption of the culprit drug. In the pooled sunitinib mRCC
          trial database (>98% clear cell histology) 614 of 770 patients (80%) met a systolic threshold
          for on-treatment hypertension, though that figure uses a blood-pressure cut-off rather than
          CTCAE grading and so runs higher than trial-reported adverse-event rates.
        phenotype_term:
          preferred_term: Hypertension
          term:
            id: HP:0000822
            label: Hypertension
      selected_evidence:
        snippet: Among the 770 patients included in the analyses, 614 (80%), 365 (47%), 172 (22%), 179
          (23%), and 583 (76%) experienced on-treatment SBP-defined hypertension, neutropenia (grade ⩾2),
          thrombocytopenia (grade ⩾2), hand-foot syndrome (grade >0), and asthenia/fatigue (grade >0),
          respectively.
        supports: SUPPORT
