        context: []
      assertion_type: Pathophysiology
      assertion:
        name: VSP Inhibitor Blockade of Systemic Endothelial VEGF Signaling
        description: 'The therapy-emergent arm of this entry, and the mirror image of the tumor arm above.
          The VEGFR tyrosine kinase inhibitors used to treat ccRCC do not act only on tumor endothelium:
          they silence the same VEGFA-VEGFR2 signal in the systemic vasculature, where it is a tonic homeostatic
          input rather than a tumor-driven one. Because the ccRCC angiogenic phenotype is the reason the
          drug class is used here, this vascular toxicity is on-target and inseparable from the therapeutic
          effect, not an idiosyncratic reaction. Curated in ccRCC specifically because ccRCC is where
          the pivotal clinical data on this toxicity were generated.'
        role: trigger
        biological_scale: MOLECULAR
        conforms_to: vegf_inhibitor_hypertension#VEGF Signaling Pathway Inhibition
        cell_types:
        - preferred_term: vascular endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: vascular endothelial growth factor receptor signaling pathway
          term:
            id: GO:0048010
            label: vascular endothelial growth factor receptor signaling pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Hypertension (HTN) is an on-target effect of the vascular endothelial growth factor pathway
          inhibitor, sunitinib.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21527770
      reference_title: Hypertension as a biomarker of efficacy in patients with metastatic renal cell
        carcinoma treated with sunitinib.
      evidence_source: HUMAN_CLINICAL
      explanation: States in the renal-cell-carcinoma setting that the blood-pressure effect of sunitinib
        is on-target VEGF pathway inhibition, which is exactly what this trigger node asserts for the
        ccRCC treatment context.
