          angiogenic/RTK pathways (such as crizotinib, pazopanib, sunitinib, and the selective MET inhibitor
          AMG 337) have been evaluated clinically in advanced or metastatic CCS, though retrospective
          clinical series show minimal efficacy with immediate progression on sunitinib and pazopanib
          and only transient disease stabilization in a small subset of patients treated with crizotinib.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
