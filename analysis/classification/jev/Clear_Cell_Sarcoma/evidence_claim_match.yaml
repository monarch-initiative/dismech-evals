              label: pazopanib
          - preferred_term: sunitinib
            term:
              id: CHEBI:38940
              label: sunitinib
      selected_evidence:
        snippet: However, two patients treated with crizotinib, a multi-TKI targeting MET, were still
          stable for at least three months in our cohort (Fig. 3, pat. 9 and 10) but this could also be
          due to a more indolent course of their disease.
        supports: SUPPORT
