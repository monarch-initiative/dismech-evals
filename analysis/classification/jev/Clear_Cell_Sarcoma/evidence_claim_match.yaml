              id: MONDO:0002926
              label: clear cell sarcoma
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cutaneous or Metastatic Melanoma
        disease_term:
          preferred_term: cutaneous melanoma
          term:
            id: MONDO:0005012
            label: cutaneous melanoma
        description: Cutaneous or metastatic malignant melanoma shares morphological features and melanocytic
          marker expression (S100, HMB-45, Melan-A, MITF) with clear cell sarcoma, requiring molecular
          testing for EWSR1-ATF1/CREB1 fusions and adjunct PRAME immunohistochemistry for accurate distinction.
        distinguishing_features:
        - Absence of EWSR1-ATF1 or EWSR1-CREB1 translocation in melanoma
        - Superficial localization with epidermal infiltration and higher mitotic activity in melanoma
          versus deep location associated with tendons and aponeuroses and low mitotic activity in CCS
        - Diffuse nuclear PRAME positivity in cutaneous melanoma versus typically absent or focal PRAME
          staining in CCS (used as an adjunct immunohistochemical discriminator alongside molecular fusion
          testing)
      selected_evidence:
        snippet: 'Despite morphological and immunophenotypic similarities to melanoma, CCS arises from
          connective tissues and is characterized by a distinct genetic hallmark: the EWSR1-ATF1 fusion
          resulting from t(12;22)(q13;q12) translocation. This genetic signature is absent in melanoma,
          making molecular diagnosis essential for accurate differentiation.'
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40004764
      reference_title: 'Clear Cell Sarcoma (CCS) of the Soft Tissue: An Update Narrative Review with Emphasis
        on the Utility of PRAME in Differential Diagnosis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Directly supports melanoma as the primary differential diagnosis of CCS and establishes
        EWSR1-ATF1 testing as the key discriminator.
