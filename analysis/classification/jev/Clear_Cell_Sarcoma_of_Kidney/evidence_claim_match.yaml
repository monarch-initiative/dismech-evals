        name: High-Dose Chemotherapy with Autologous Stem-Cell Rescue
        description: High-dose chemotherapy followed by autologous bone marrow transplantation (ABMT)
          for relapsed disease. In the combined SIOP and AIEOP series it was given to 14 of 37 relapsed
          patients after chemotherapy, surgery and/or radiotherapy. Among the patients who completed the
          intended relapse treatment it was given to 13 of the 21 who reached a second complete remission
          and to 1 of the 7 who did not, a comparison the authors say their numbers do not allow them
          to test statistically. They conclude that intensive treatment aiming for local control, followed
          by high-dose chemotherapy and ABMT, seems to be of benefit to enhance survival. Summarising
          their series and earlier reports, 12 of 24 relapsed patients so treated were alive without disease
          after a median follow-up of 52 months, but the authors caution that the treatment is mostly
          given to patients who have already reached a second complete remission and that it carries direct
          and late toxicity. No standard treatment guidelines are available for relapsed CCSK, because
          too few relapsed patients have been reported to establish the contribution of each treatment.
        treatment_term:
          preferred_term: high-dose chemotherapy with autologous bone marrow transplantation
          term:
            id: NCIT:C16039
            label: Autologous Hematopoietic Stem Cell Transplantation
        therapeutic_modality: CELL_THERAPY
      selected_evidence:
        snippet: Relapse treatment consisted of chemotherapy (n=30), surgery (n=19) and/or radiotherapy
          (n=18), followed by high-dose chemotherapy and autologous bone marrow transplantation (ABMT)
          in 14 patients. ... Intensive treatment aiming for local control, followed by high dose chemotherapy
          and ABMT, seems to be of benefit to enhance survival.
