      reference_title: Diffuse and strong cyclin D1 immunoreactivity in clear cell sarcoma of the kidney.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'Mirkovic et al. stained the following for cyclin D1: 14 CCSKs, 25 Wilms tumours and
        four rhabdoid tumours (all among 59 renal tumours that also included Ewing sarcomas and CMNs),
        plus four neuroblastomas. Every CCSK stained diffusely and strongly. The blastema of most Wilms
        tumours showed only rare positive nuclei, and the rhabdoid tumours showed rare to focal staining,
        whereas all four neuroblastomas stained diffusely (moderate to strong). The authors conclude that
        cyclin D1 helps distinguish CCSK from Wilms tumour and rhabdoid tumour but not from neuroblastoma.
        The rhabdoid and neuroblastoma comparisons rest on four tumours each.'
