      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Zhang et al. studied children with CCSK treated following NWTS strategies at children's
        hospitals in Shanghai. Treatment comprised upfront radical nephrectomy, followed by radiotherapy
        and intensive chemotherapy. In their conclusions the authors say the upfront surgery of NWTS strategies
        gives a definite pathological diagnosis, and that reducing tumour rupture during surgery is important,
        especially in developing countries. The sentences summarise this cohort's NWTS-based protocol,
        not a cooperative-group protocol, so they support the claim for this cohort rather than for every
        patient treated on NWTS strategies.
