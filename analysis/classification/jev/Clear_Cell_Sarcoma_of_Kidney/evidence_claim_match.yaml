            term:
              id: CHEBI:28445
              label: vincristine
          - preferred_term: doxorubicin
            term:
              id: CHEBI:28748
              label: doxorubicin
          - preferred_term: cyclophosphamide
            term:
              id: CHEBI:4027
              label: cyclophosphamide
          - preferred_term: etoposide
            term:
              id: CHEBI:4911
              label: etoposide
        therapeutic_modality: SMALL_MOLECULE
        effect_modifiers:
        - effect_modifier_type: BASELINE_SEVERITY
          stratum: stages I and II
          comparator_stratum: higher stage disease (stages III and IV)
          modified_outcome: disease control compared with the three-drug NWTS-4 regimen
          effect_in_stratum: LARGER_EFFECT
          modification_analysis: CROSS_STUDY_COMPARISON
          description: Comparison of the single-arm NWTS-5 trial with the earlier NWTS-4 trial, with NWTS-4
            patients reclassified by NWTS-5 staging criteria. The paper reports no formal test of a stage-by-treatment
            interaction, so the stage gradient is a cross-trial observation rather than a tested subgroup
            effect. For higher-stage disease the authors found no apparent benefit of regimen I over the
            NWTS-4 regimen.
      selected_evidence:
        snippet: 'Treatment consisted of vincristine/doxorubicin/cyclophosphamide alternating with cyclophosphamide/etoposide
          for 24 weeks and radiation to sites of disease. ... One hundred eight eligible patients were
          enrolled on study (69% males, 63% Caucasian), with a median age of 22 months. Stage distribution
          was as follows: stage I, 12; II, 44; III, 45; IV, 7. ... Five-year EFS and OS were 79% (95%
          CI: 71%-88%) and 90% (95% CI: 84%-96%). Five-year EFS for stage I-IV was 100%, 88%, 73%, and
          29%, respectively. ... The outcome for patients with CCSK treated on NWTS-5 was similar to NWTS-4
          and accomplished over a shorter treatment duration. Stage was highly predictive of outcome.
          Brain metastases occurred more frequently than on NWTS-4. Regimen I showed more benefit for
          patients with stage I and II disease as compared with higher stages of disease where new therapies
          are needed.'
