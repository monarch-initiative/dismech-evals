  8454c520c2586bf5fd9b627de9568df7396bd90049ee0b3d13c2a3f5457dd6b7:
    claim:
      about:
        disease:
          name: Clear Cell Sarcoma of Kidney
          disease_term:
            preferred_term: clear cell sarcoma of kidney
            term:
              id: MONDO:0005006
              label: clear cell sarcoma of kidney
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Wilms Tumor
        disease_term:
          preferred_term: Wilms tumor
          term:
            id: MONDO:0006058
            label: Wilms tumor
        description: A 1985 series concluded that, until CCSK is shown to be related to nephroblastoma,
          identifying it as a non-Wilms sarcoma seems appropriate. BCOR internal tandem duplication and
          cyclin D1 immunostaining help distinguish CCSK from blastemal Wilms tumour, but neither test
          is absolute. In a cohort of 159 CCSKs, 11.8% carried neither the ITD nor the YWHAE fusion, so
          a negative ITD test does not exclude CCSK. Strong diffuse cyclin D1 staining was seen in only
          11 of 18 CCSKs in one tissue-microarray series, and in another the epithelial component of most
          Wilms tumours stained diffusely and often strongly while the blastema was negative in most,
          so the cyclin D1 contrast holds for Wilms tumour blastema.
        distinguishing_features:
        - BCOR internal tandem duplication, found in most but not all CCSKs, and in none of 193 other
          paediatric renal tumours tested in one series and none of 18 Wilms tumours in another
        - Diffuse strong cyclin D1 immunostaining in most CCSKs (all 14 cases in one series, 7 of 7 assessable
          cases in a second, 11 of 18 in a third), against only rare positive nuclei in the blastema of
          most Wilms tumours in the first series and negative blastema in 18 Wilms tumours in the second;
          in a fourth series the epithelial component of most Wilms tumours stained, so the contrast applies
          to blastema
        - Cytokeratin-negative immunostaining in all CCSKs of one series, including epithelioid tumours
          that mimicked Wilms tumour, where consistently negative stains helped exclude other tumours
          in the differential diagnosis
      selected_evidence:
        snippet: BCOR ITDs were not found in a cohort of other childhood renal tumours (18 Wilms tumours
          and 9 congenital mesoblastic nephromas) and soft-tissue sarcomas (n=10).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26573325
      reference_title: Recurrent internal tandem duplications of BCOR in clear cell sarcoma of the kidney.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In the study that found BCOR internal tandem duplications in most clear cell sarcomas
        of the kidney, the duplications were not found in a cohort of other childhood renal tumours that
        included 18 Wilms tumours and 9 congenital mesoblastic nephromas, nor in 10 soft-tissue sarcomas.
        This directly supports BCOR ITD as a feature that separates CCSK from Wilms tumour.
