    evidence_metadata:
      reference: PMID:26098867
      reference_title: Consistent in-frame internal tandem duplications of BCOR characterize clear cell
        sarcoma of the kidney.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'The authors report their own finding: in their series, internal tandem duplications
        in BCOR affecting the C terminus were present in all 20 CCSK tumours and in none of 193 other
        paediatric renal tumours, and the CCSK tumours expressed only an aberrant BCOR allele. They read
        this as a close correlation between the BCOR aberration and CCSK tumorigenesis. This supports
        the node as a recurrent lesion of CCSK which, in this series, was absent from all the other paediatric
        renal tumours tested. The 100% figure comes from a single 20-tumour series and is not a frequency
        for CCSK as a whole. The abstract does not say whether the duplications are somatic, and it reports
        a correlation, not a demonstrated causal mechanism.'
