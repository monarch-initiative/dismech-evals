        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Relapse
        notes: In a combined SIOP and AIEOP series, 37 of 237 patients (16%) relapsed after complete remission,
          at a median of 17 months from diagnosis; 35 of the 37 relapses (95%) were metastatic, most often
          to the brain (13), lungs (7) and bone (5), and five-year event-free and overall survival after
          relapse were 18% and 26%. A review describes a propensity for late relapse and attributes to
          improved intensive chemotherapy regimens a change in the clinical course, with late relapses
          now less frequent and the brain having overtaken bone as the most common site of relapse.
      selected_evidence:
        snippet: 'Thirty-seven of 237 CCSK patients (16%) treated according to SIOP and AIEOP protocols
          developed a relapse. Median time from initial diagnosis to relapse was 17 months (range, 5.5
          months - 6.6 years). Thirt-five out of thirty-seven relapses (95%) were metastatic; the most
          common sites of relapse were the brain (n=13), lungs (n=7) and bone (n=5). ... Five-year event-free
          survival (EFS) after relapse was 18% (95% CI: 4%-32%), and 5-year overall survival (OS) was
          26% (95% CI: 10%-42%).'
        supports: SUPPORT
        directness: DIRECT
