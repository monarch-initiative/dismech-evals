      reference: PMID:30255545
      reference_title: Impact of cyclophosphamide and etoposide on outcome of clear cell sarcoma of the
        kidney treated on the National Wilms Tumor Study-5 (NWTS-5).
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'From the NWTS-5 report on its own prospective single-arm trial. The abstract gives
        the protocol, vincristine/doxorubicin/cyclophosphamide alternating with cyclophosphamide/etoposide
        for 24 weeks with radiation to sites of disease, and its outcome: five-year EFS 79%, OS 90%, and
        five-year EFS for stages I to IV of 100%, 88%, 73% and 29%. The full-text methods and discussion
        describe the radiation: postoperative radiation to the tumour bed (10 Gy) and to other infradiaphragmatic
        and metastatic sites as necessary, given to all sites of disease however completely the tumour
        was resected. This directly establishes radiotherapy as part of first-line CCSK therapy on NWTS-5,
        but supports its effect on outcome only indirectly, because every patient also received the chemotherapy
        and there was no unirradiated group. The authors attribute the stage I and II improvement over
        NWTS-4 to the chemotherapy, because patients on both trials received tumour-bed radiation, and
        state that the role of radiation therapy in this cancer needs to be further elucidated.'
