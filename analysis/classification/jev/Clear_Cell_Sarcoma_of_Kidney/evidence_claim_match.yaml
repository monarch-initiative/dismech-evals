    evidence_metadata:
      reference: PMID:24937667
      reference_title: 'Treatment and outcome of patients with relapsed clear cell sarcoma of the kidney:
        a combined SIOP and AIEOP study.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Among 237 CCSK patients treated on SIOP and AIEOP protocols, 37 (16%) relapsed after
        complete remission at the end of primary treatment, at a median of 17 months from diagnosis. 35
        of the 37 relapses (95%) were metastatic, most often to the brain (13), lungs (7) and bone (5).
        Five-year event-free and overall survival after relapse, both measured from the date of relapse,
        were 18% (95% CI 4% to 32%) and 26% (95% CI 10% to 42%), so outcome after relapse is poor. 'Thirt-five'
        is the source's own spelling and is kept as written.
