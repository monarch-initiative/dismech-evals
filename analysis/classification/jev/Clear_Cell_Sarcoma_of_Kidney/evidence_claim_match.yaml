  69f93fdd95da84ac875c481ffb111a9b15654b4078caf9ab1e13ed4715a5e4b9:
    claim:
      about:
        disease:
          name: Clear Cell Sarcoma of Kidney
          disease_term:
            preferred_term: clear cell sarcoma of kidney
            term:
              id: MONDO:0005006
              label: clear cell sarcoma of kidney
        context: []
      assertion_type: Stage
      assertion:
        name: Stage I
        description: On the National Wilms Tumor Study-5 (NWTS-5), 12 of the 108 staged patients had stage
          I disease, and five-year event-free survival for stage I was 100%. On the Children's Oncology
          Group (COG) studies AREN0321 and AREN03B2, 10 of 132 patients (7.6%) were stage I, with a pooled
          four-year event-free survival of 90%. AREN0321 omitted radiotherapy for stage I disease when
          lymph nodes were sampled; none of the seven stage I patients treated without it had a local
          recurrence, and one stage I recurrence occurred in the brain. COG stage I rests on upfront nephrectomy
          and SIOP stage I on the tumour after preoperative chemotherapy, so a tumour that would be COG
