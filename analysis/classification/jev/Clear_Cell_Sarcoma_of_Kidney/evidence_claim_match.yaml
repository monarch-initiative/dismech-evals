      - /disease_term
    evidence_metadata:
      reference: PMID:30864973
      reference_title: 'BCOR Overexpression in Renal Malignant Solitary Fibrous Tumors: A Close Mimic
        of Clear Cell Sarcoma of Kidney.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In a 2019 series, Argani et al. report five undifferentiated renal or perirenal sarcomas
        whose morphology and strong BCOR immunoreactivity raised the differential diagnosis of CCSK, and
        which RNA sequencing showed to be malignant solitary fibrous tumours. The patients were aged 30
        to 62 years, so the series does not bear on the review's statement about paediatric renal tumours,
        but it shows that strong BCOR staining also occurs in a tumour that mimics CCSK.
