      reference_title: 'Treatment and outcome of patients with relapsed clear cell sarcoma of the kidney:
        a combined SIOP and AIEOP study.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In the SIOP and AIEOP series, 35 of 37 relapses were metastatic, and 14 patients received
        high-dose chemotherapy with autologous bone marrow transplantation after the rest of their relapse
        treatment. That the consolidation acts against the metastatic disease is an inference from its
        place in the sequence; the series reports no outcome for the 14 patients as a group in this passage.
        'Thirt-five' is the source's own spelling and is kept as written.
