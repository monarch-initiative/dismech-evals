    evidence_metadata:
      reference: PMID:30255545
      reference_title: Impact of cyclophosphamide and etoposide on outcome of clear cell sarcoma of the
        kidney treated on the National Wilms Tumor Study-5 (NWTS-5).
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Abstract of the NWTS-5 report on its own prospective single-arm trial in clear cell
        sarcoma of the kidney. Treatment was vincristine/doxorubicin/cyclophosphamide alternating with
        cyclophosphamide/etoposide for 24 weeks, with radiation to sites of disease; the full-text introduction
        calls this four-drug chemotherapy regimen I. Of the 108 eligible patients, 12, 44, 45 and 7 had
        stage I to IV disease. Five-year EFS was 79% and OS 90%, and five-year EFS for stages I to IV
        was 100%, 88%, 73% and 29%, so the stage I and stage IV figures come from groups of 12 and 7 patients.
        The authors judge the overall outcome similar to NWTS-4 but reached over a shorter treatment duration,
        note that brain metastases were more frequent than on NWTS-4, and conclude that regimen I showed
        more benefit for stage I and II disease than for higher stages, where new therapies are needed.
        That benefit comes from comparison with the earlier NWTS-4 trial, not from a randomised comparison;
        the full text attributes it to the chemotherapy because patients on both trials received tumour-bed
        radiation, and finds no benefit at higher stages. Every NWTS-5 patient also received radiation,
        so the survival figures belong to the combined-modality protocol, not to regimen I alone.
