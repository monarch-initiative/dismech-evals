      reference_title: Outcomes of children with clear cell sarcoma of kidney following NWTS strategies
        in Shanghai China (2003-2021).
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: In this retrospective multicentre cohort of 54 children treated in Shanghai following
        NWTS strategies and staged by the NWTS system, 21 were stage III and five-year event-free survival
        for stage III was 71.1%. Six patients had an inferior vena cava tumour thrombus and five a tumour
        rupture around surgery, four of them intraoperative spills. On univariate analysis across the
        whole cohort, stage III or IV disease, inferior vena cava tumour thrombus (41.7% against 87.4%)
        and tumour rupture before or during surgery (40% against 86.8%) were associated with inferior
        outcome. The sentence does not name the measure behind the percentages; the methods relate event-free
        and overall survival to these factors, and the discussion sets the 41.7% beside an event-free
        survival figure, so they are read as event-free survival. Each factor rests on five or six patients.
