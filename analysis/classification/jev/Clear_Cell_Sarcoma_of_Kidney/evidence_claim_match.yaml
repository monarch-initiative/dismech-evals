            term:
              id: MONDO:0005006
              label: clear cell sarcoma of kidney
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BCOR Internal Tandem Duplication
        description: 'The recurrent lesion of CCSK: a somatic internal tandem duplication (ITD) clustering
          in the C terminus of BCOR, within the sequence encoding the PUFD domain, which is important
          for forming the variant polycomb repressive complex 1 and through which BCOR binds PCGF1 in
          that complex. BCOR can act as a transcriptional corepressor: it interacts selectively with the
          POZ domain of BCL-6 and can potentiate BCL-6 repression. Somatic ITDs were found in 23 of 27
          paediatric CCSKs (85%) from two independent cohorts, identical in primary and relapsed tumour
          pairs and absent from adjacent normal kidney and blood, and mutant BCOR transcripts and proteins
          were markedly upregulated in ITD-positive tumours. In another series the ITD was found in all
          20 CCSKs and in none of 193 other paediatric renal tumours, and these CCSKs expressed only an
          aberrant BCOR allele, which the authors read as a close correlation between the BCOR aberration
          and CCSK tumorigenesis. Expression profiling of patient tumours suggested that CCSK arises within
          a renal mesenchymal cell, a later study suggested a primitive mesodermal cell able to differentiate
          towards both nephrons and stroma, and the cell of origin is not established.'
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: SOMATIC
          variant_type: duplication
        gene:
          preferred_term: BCOR
          term:
            id: hgnc:20893
            label: BCOR
        molecular_functions:
        - preferred_term: transcription corepressor activity
          term:
            id: GO:0003714
            label: transcription corepressor activity
        protein_complexes:
        - preferred_term: variant polycomb repressive complex 1.1 (BCOR complex)
          term:
            id: GO:0140261
            label: BCOR complex
        cell_types:
        - preferred_term: putative renal mesenchymal cell
          term:
            id: CL:0008019
            label: mesenchymal cell
        locations:
        - preferred_term: kidney
          term:
            id: UBERON:0002113
            label: kidney
        notes: 'functional_impact_category is not set and transcription corepressor activity carries no
          modifier: the cited sources place the duplication in the PUFD domain and show the mutant allele
          expressed and upregulated, but do not establish whether corepressor function is lost, retained
          or altered. The cell type is a hedged suggestion from expression profiling, not an established
          cell of origin. OLS4 searches of CL restricted to label and synonym fields on 28 Oct 2026 returned
          no CL class for renal mesenchymal cell or for kidney mesenchymal cell; the second query matched
          only the imported GO process GO:0072161 (mesenchymal cell differentiation involved in kidney
          development). The same search for metanephric mesenchyme returned CL:0000324 metanephric mesenchyme
          stem cell (is_a CL:0000134 mesenchymal stem cell; OLS4 shows no definition for it), which is
          not bound because neither source names that cell: PMID:16299227 proposes only a renal mesenchymal
          cell, and PMID:24488803 offers a primitive mesodermal cell as a possibility, places the CCSK
          phenotype in the window of differentiation between intermediate mesoderm and pretubular aggregates,
          and states that the cell of origin is unknown. The generic CL:0008019 mesenchymal cell is therefore
          bound, with putative renal mesenchymal cell as preferred_term.'
      selected_evidence:
        snippet: As this marker discriminates the intermediate mesoderm from other mesodermal structures,
          our study could suggest that CCSK arises from a mesodermal cell type that retains the capacity
          to initiate differentiation towards both nephrons and stroma, but remains locked in a primitive
          state.
        supports: SUPPORT
        directness: INDIRECT
