      assertion:
        name: Regimen I Chemotherapy
        description: On the single-arm National Wilms Tumor Study-5, the 108 eligible patients received
          vincristine/doxorubicin/cyclophosphamide alternating with cyclophosphamide/etoposide for 24
          weeks (regimen I) with radiation to sites of disease, and had five-year event-free survival
          of 79% and overall survival of 90%. Five-year event-free survival for stages I to IV was 100%,
          88%, 73% and 29%, from groups of 12, 44, 45 and 7 patients, so the stage I and stage IV figures
          rest on small numbers. The outcome was similar to the earlier NWTS-4 regimen but reached over
          a shorter treatment duration, and the authors concluded that regimen I showed more benefit for
          stage I and II disease than for higher stages, where new therapies are needed.
        treatment_term:
          preferred_term: chemotherapy
          term:
            id: NCIT:C15632
            label: Chemotherapy
          therapeutic_agent:
