          term:
            id: NCIT:C40998
            label: Immunophenotypic Finding
        description: In the National Wilms Tumor Study Group Pathology Center review, immunohistochemical
          stains were performed on 45 cases and only vimentin was consistently immunoreactive. All CCSKs
          were cytokeratin-negative, including epithelioid tumours that mimicked Wilms tumour, and MIC2-negative,
          including cellular tumours that mimicked primitive neuroectodermal tumour, and these consistently
          negative results helped exclude other tumours in the differential diagnosis.
        notes: MIC2 is a previous HGNC symbol of CD99 (hgnc:7082). The full OLS4 descendant listing of
          NCIT:C40998 Immunophenotypic Finding, retrieved through the OLS4 API on 28 Oct 2026, includes
          positive-result terms for both stains, NCIT:C81765 Cytokeratin-Positive Neoplastic Cells Present
          and NCIT:C51145 CD99-Positive Neoplastic Cells Present, which state the opposite of this finding,
          and no term for vimentin or for a negative cytokeratin or CD99 result. The row is therefore
          bound to the branch term, NCIT:C40998 Immunophenotypic Finding.
