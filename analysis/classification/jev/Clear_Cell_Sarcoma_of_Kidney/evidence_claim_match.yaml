    evidence_metadata:
      reference: PMID:10632483
      reference_title: 'Clear cell sarcoma of the kidney: a review of 351 cases from the National Wilms
        Tumor Study Group Pathology Center.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: This National Wilms Tumor Study Group Pathology Center case series of clear cell sarcoma
        of the kidney reports a mean age at diagnosis of 36 months, with a range of 2 months to 14 years,
        in its NWTS group (the cases entered on National Wilms Tumor Study Group trials), which gives
        the mean and range directly. It then reports a male to female ratio of 2:1 in a sentence that
        names no cohort, so the ratio is attributed to the series rather than to the NWTS group alone.
        The 36-month mean places the typical age at diagnosis in early childhood, but the abstract gives
        no breakdown by age band and the range reaches 14 years. The ratio comes from a pathology-center
        and trial series, not a population-based incidence study.
