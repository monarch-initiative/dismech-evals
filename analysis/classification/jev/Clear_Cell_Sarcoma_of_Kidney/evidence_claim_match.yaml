        the blastemal component was negative in most, and the authors conclude that cyclin D1 is very
        helpful in distinguishing blastema-rich Wilms tumour from CCSK. The contrast with CCSK therefore
        holds for Wilms tumour blastema, not for its epithelial component. The same abstract calls cyclin
        D1 sensitive but not specific for CCSK, and reports diffuse strong staining in most or all neuroblastomas
        and renal Ewing sarcomas.
