      selected_evidence:
        snippet: We analysed a cohort of 159 CCSKs and can now not only confirm that there is indeed mutual
          exclusivity of these BCOR and YWHAE mutations, but also show that a substantial proportion (in
          this series 11.8%) of CCSKs bear neither mutation when tested by these assays, raising the possibility
          of distinct aetiologies for subsets of CCSK.
