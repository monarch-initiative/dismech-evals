      reference: PMID:27000436
      reference_title: 'Mutually exclusive BCOR internal tandem duplications and YWHAE-NUTM2 fusions in
        clear cell sarcoma of kidney: not the full story.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Kenny et al. tested 159 clear cell sarcomas of the kidney for the two lesions their
        abstract has just named, the BCOR internal tandem duplication and the YWHAE-NUTM2 transcript,
        and confirm that the two are mutually exclusive. In this series 11.8% of tumours carried neither
        when tested by these assays, which the authors read as raising the possibility of distinct aetiologies
        for subsets of CCSK. This is the largest cohort cited here for the exclusivity, and because the
        abstract names the fusion as YWHAE-NUTM2, placing its lesion under this node needs no inference.
        The abstract does not give the number of tumours carrying each lesion, and 'neither' is relative
        to the assays used, as the sentence itself says.
