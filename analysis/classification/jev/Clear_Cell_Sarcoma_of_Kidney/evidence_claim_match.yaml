      reference: PMID:25751590
      reference_title: Novel Karyotypes and Cyclin D1 Immunoreactivity in Clear Cell Sarcoma of the Kidney.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'A second series, by a different group, shows the same direction for Wilms tumour,
        rhabdoid tumour and neuroblastoma. The two series differ on mesoblastic nephroma: this one reports
        positive staining in 3 mesoblastic nephromas and concludes that cyclin D1 does not separate them
        from CCSK, whereas the first found it helpful for some. Cyclin D1 was diffuse and strong in 7
        of 7 assessable CCSKs (one case was excluded for poor antigenicity). On tissue microarrays of
        other paediatric renal tumours, the blastemal areas of 18 Wilms tumours were negative and 6 rhabdoid
        tumours showed patchy and weak staining, while 18 of 29 neuroblastomas stained. The authors conclude
        that cyclin D1 helps distinguish CCSK from blastemal Wilms tumour and rhabdoid tumours but not
        from neuroblastomas. Neuroblastoma staining was frequent but not universal in this series, and
        the comparator tumours were stained on tissue microarray cores rather than whole sections.'
