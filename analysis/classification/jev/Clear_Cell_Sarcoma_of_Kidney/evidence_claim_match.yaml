    evidence_metadata:
      reference: PMID:22294382
      reference_title: Characterization of the chromosomal translocation t(10;17)(q22;p13) in clear cell
        sarcoma of kidney.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: O'Meara et al. used fluorescently labelled BACs and chromosome walking on an index
        CCSK with t(10;17)(q22;p13) to map the breakpoints to 17p13.3 and 10q22.3. The translocation rearranges
        YWHAE on chromosome 17 and FAM22 on chromosome 10 into an in-frame YWHAE-FAM22 fusion transcript,
        joining exons 1 to 5 of YWHAE to exons 2 to 7 of FAM22 (structure determined by RT-PCR), and the
        transcript was detected in six of 50 further CCSKs tested, which the authors report as an overall
        incidence of 12% in their cohort. The FAM22 members involved in these cases include FAM22B and
        FAM22E, which HGNC records as previous symbols of NUTM2B (hgnc:23445, NUT family member 2B) and
        NUTM2E (hgnc:23448, NUT family member 2E). YWHAE-FAM22 is therefore the fusion this node calls
        YWHAE::NUTM2.
