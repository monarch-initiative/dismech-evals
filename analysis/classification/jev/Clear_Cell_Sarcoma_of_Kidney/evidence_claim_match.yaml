          and the YWHAE fusion were mutually exclusive, and 11.8% of tumours carried neither when tested
          by those assays. In a 39-patient cohort tested by PCR, FISH or Sanger sequencing, a YWHAE rearrangement
          (1 tumour), BCOR ITD (34) and BCOR::CCNB3 fusion (1) were mutually exclusive, and 3 tumours
          had none of them detected.'
