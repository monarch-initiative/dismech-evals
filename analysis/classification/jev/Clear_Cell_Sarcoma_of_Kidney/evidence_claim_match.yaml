    evidence_metadata:
      reference: PMID:27000436
      reference_title: 'Mutually exclusive BCOR internal tandem duplications and YWHAE-NUTM2 fusions in
        clear cell sarcoma of kidney: not the full story.'
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      explanation: 'Kenny et al. open the abstract of their clear cell sarcoma of kidney cohort study
        by restating earlier work: the BCOR internal tandem duplication lies within the gene sequence
        that encodes the PUFD domain, and that domain is important in forming the non-canonical (variant)
        polycomb repressor complex 1. The sentence states both points outright. Binding the node''s protein
        complex to GO:0140261 BCOR complex is the curator''s mapping of the sentence''s variant polycomb
        repressor complex 1 onto the GO class whose definition names the corepressor BCOR among its subunits;
        it is not a claim the sentence makes. Kenny et al. restate both points rather than test them,
        and this item does not rely on the sentence''s figure for the earlier series. The sentence does
        not say that BCOR acts as a transcriptional corepressor, and it does not say whether the duplication
        raises or lowers the activity of the complex.'
