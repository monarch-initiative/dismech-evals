      reference_title: Role of Cyclin D1 and BCOR Immunohistochemistry in Differentiating Clear Cell Sarcoma
        of Kidney From its Mimics.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Singh et al. stained CCSKs and Wilms tumours on tissue microarrays, and the malignant
        rhabdoid tumours and congenital mesoblastic nephromas individually. Strong, diffuse nuclear BCOR
        staining was seen in 15 of 18 CCSKs (83%) and in 2 of 10 Wilms tumours, which the authors report
        as significantly less, and none of the rhabdoid tumours or mesoblastic nephromas showed any immunoreactivity.
        Strong diffuse staining was therefore not seen in every CCSK. The series is small, and the cyclin
        D1 results in the same sentence are covered under the Wilms Tumor differential diagnosis.
