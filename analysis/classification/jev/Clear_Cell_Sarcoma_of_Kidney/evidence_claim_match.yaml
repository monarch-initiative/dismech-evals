      reference: PMID:16299227
      reference_title: 'Clear cell sarcoma of the kidney: up-regulation of neural markers with activation
        of the sonic hedgehog and Akt pathways.'
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: The authors compared gene expression in patient CCSKs with Wilms tumours and fetal
        kidney, confirmed key proteins, and proposed that CCSK arises within a renal mesenchymal cell
        that expresses many neural markers. This is the basis for the putative renal mesenchymal cell
        annotation on this node (bound to CL:0008019 mesenchymal cell). The authors offer it only as a
        suggestion, and their abstract describes the pathogenesis of CCSK as an enigma, so the cell of
        origin is not established. The study came before the reports of BCOR internal tandem duplications
        in CCSK (PMID:26098867, PMID:26573325) and does not report on BCOR, so it supports the cell-type
        annotation only, not the duplication itself.
