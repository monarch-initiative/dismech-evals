      reference_title: Expression of cyclin D1 in clear cell sarcoma of kidney. Is it useful in differentiating
        it from its histological mimics?
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Uddin et al. stained 19 CCSKs, 9 Wilms tumours and other paediatric tumours for cyclin
