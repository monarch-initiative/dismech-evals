      assertion:
        name: Salvage Chemotherapy for Relapsed Disease
        description: Chemotherapy for relapse after complete remission. In a combined SIOP and AIEOP series,
          30 of 37 relapsed patients received chemotherapy in different combinations, 19 had surgical
          excision and 18 radiotherapy, and 14 went on to high-dose chemotherapy with autologous bone
          marrow transplantation; 22 of the 37 reached a second complete remission, 15 of whom relapsed
          again. Five of the 13 patients with an isolated brain relapse received ICE (ifosfamide, carboplatin
          and etoposide), and three of them achieved a long-term complete response, which the authors
          read as possibly promising for brain relapse while noting that they have no data on the influence
          of upfront treatment; one patient died of septic shock after one cycle of ICE. The agents and
          regimen bound here are those of ICE, one of the combinations used. No standard treatment guideline
          was available for relapsed CCSK except in the United Kingdom, and the authors state that too
          few relapsed patients have been reported to establish the contributions of chemotherapy, high-dose
          chemotherapy with stem-cell transplantation, radiotherapy and surgery, so no standard treatment
          guidelines are available for this patient group.
        treatment_term:
