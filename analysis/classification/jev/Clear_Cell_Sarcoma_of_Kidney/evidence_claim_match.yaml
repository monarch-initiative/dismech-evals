      - /disease_term
    evidence_metadata:
      reference: PMID:24488803
      reference_title: Clear cell sarcoma of the kidney demonstrates an embryonic signature indicative
        of a primitive nephrogenic origin.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: 'A later study profiled patient CCSKs by SNP array, expression array and marker immunofluorescence.
        FOXD1 (stromal progenitors) and CITED1 (nephron progenitors) were both highly expressed, and OSR1,
        the intermediate mesoderm marker that ''this marker'' in the quote refers to, was expressed at
        higher levels than in Wilms tumour or normal kidney. From this the authors suggest that CCSK arises
        from a primitive mesodermal cell able to differentiate towards both nephrons and stroma. Reading
        that as a renal mesenchymal cell takes one inference step: the paper''s introduction places both
        progenitor lineages in the metanephric mesenchyme, while its closing text places the CCSK phenotype
        in the window of differentiation between intermediate mesoderm and pretubular aggregates. The
        authors present the origin as a possibility, the same abstract says the cell of origin of CCSK
        is unknown, and the paper states that its findings do not by themselves prove a nephrogenic origin.
        Like PMID:16299227, the study came before the BCOR internal tandem duplication reports and supports
        only the cell-type annotation.'
