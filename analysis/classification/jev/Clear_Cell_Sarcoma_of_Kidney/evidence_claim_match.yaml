      assertion:
        name: BCOR Immunoreactivity
        finding_term:
          preferred_term: BCOR immunoreactivity
          term:
            id: NCIT:C40998
            label: Immunophenotypic Finding
        description: 'A review states that immunohistochemistry for BCOR has been shown to be a sensitive
          and specific marker for CCSK in the context of paediatric renal tumours. In one series, strong
          diffuse nuclear BCOR immunoreactivity was seen in 15 of 18 CCSKs (83%) and in 2 of 10 Wilms
          tumours, and none of the malignant rhabdoid tumours or congenital mesoblastic nephromas showed
          any immunoreactivity, so the lack of strong diffuse staining does not exclude CCSK. Strong BCOR
          staining is not confined to CCSK: five renal or perirenal sarcomas in patients aged 30 to 62
          years, which raised the differential diagnosis of CCSK because of their morphology and strong
          BCOR immunoreactivity, proved on RNA sequencing to be malignant solitary fibrous tumours.'
        notes: The full OLS4 descendant listing of NCIT:C40998 Immunophenotypic Finding, retrieved through
          the OLS4 API on 28 Oct 2026, includes no BCOR term, and OLS4 searches of NCIT for BCOR Positive
          and BCOR Expression returned BCOR genetic-alteration, fusion and tumour terms and the BCORL1
          gene (for example NCIT:C178467 BCOR-CCNB3 Fusion Protein Expression) but no BCOR immunostaining
          result. The row is therefore bound to the branch term, NCIT:C40998 Immunophenotypic Finding.
      selected_evidence:
        snippet: Immunohistochemistry for BCOR has also been shown to be a sensitive and specific marker
          for clear cell sarcoma of the kidney in the context of pediatric renal tumors.
        supports: SUPPORT
        directness: DIRECT
