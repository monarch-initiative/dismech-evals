      assertion:
        name: Variant Histologic Patterns
        finding_term:
          preferred_term: multiple blended histologic patterns
          term:
            id: NCIT:C35867
            label: Morphologic Finding
        description: CCSK shows several histological patterns besides the classic one. A National Wilms
          Tumor Study Group Pathology Center review identified nine major patterns (classic, myxoid, sclerosing,
          cellular, epithelioid, palisading, spindle, storiform and anaplastic), and virtually all tumours
          contained multiple patterns that blended with one another. Citing that review, a later paper
          lists the components mixed with the classic pattern in descending order of frequency as myxoid,
          sclerosing, cellular, epithelioid, palisading, spindle-cell, storiform and anaplastic. A review
          notes that this diversity of patterns can mimic most other paediatric renal tumours and often
          leads to confusion and misdiagnosis.
        notes: NCIT has terms for several of the single patterns, for example NCIT:C35998 Myxoid Stroma
          Formation, NCIT:C49015 Nuclear Palisading and NCIT:C35888 Storiform Growth Pattern. Its terms
          for a mixture are not bound. NCIT defines NCIT:C201796 Heterogeneous Morphology as the presence
          of two or more distinct neoplastic cellular components in a tissue sample, and NCIT:C35907 Biphasic
          Pattern as the presence of two morphologically distinct cellular components, whereas the source
          describes patterns that blend with one another; NCIT:C41610 Mixed Cellular Population describes
          a cellular infiltrate. The row is therefore bound to NCIT:C35867 Morphologic Finding, which
          NCIT defines as a light microscopic finding that describes the cellular characteristics and
          architectural patterns of cell populations in a tissue sample. The candidates came from a label
          search of the full OLS4 descendant listings of NCIT:C83490 Histopathology Result and NCIT:C35867,
          retrieved through the OLS4 API on 28 Oct 2026.
      selected_evidence:
        snippet: Nine major histologic patterns were identified (classic, myxoid, sclerosing, cellular,
          epithelioid, palisading, spindle, storiform, and anaplastic); virtually all tumors contained
          multiple patterns that blended with one another.
        supports: SUPPORT
        directness: DIRECT
