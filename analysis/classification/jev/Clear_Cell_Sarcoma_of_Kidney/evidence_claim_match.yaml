    evidence_metadata:
      reference: PMID:26573325
      reference_title: Recurrent internal tandem duplications of BCOR in clear cell sarcoma of the kidney.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Roy et al. profiled paediatric clear cell sarcomas of the kidney from two independent
        cohorts by whole-exome, transcriptome and targeted sequencing. They report somatic BCOR internal
        tandem duplications (ITDs) clustering in the BCOR C terminus in 23 of 27 (85%) tumours, identical
        ITDs in primary and relapsed tumour pairs, no ITD in adjacent normal kidney or blood, and markedly
        upregulated mutant BCOR transcripts and proteins in ITD-positive tumours. The quoted abstract
        sentences state each part of the claim directly; the abstract does not say how many relapsed pairs
        or normal samples were tested.
