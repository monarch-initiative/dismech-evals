      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: On multivariate analysis tumour rupture was the only independent adverse prognostic
        factor (HR 5.9, 95% CI 1.4 to 24.5; '95%Cl' is the source's spelling). In the discussion the authors
        attribute part of their stage III result to the proportion of tumour rupture (9.3%), give an event-free
        survival of about 86% for stage III patients without rupture, and note the poor prognosis (41.7%)
