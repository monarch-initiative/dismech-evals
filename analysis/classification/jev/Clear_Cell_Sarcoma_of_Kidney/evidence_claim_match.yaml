    evidence_metadata:
      reference: PMID:26573325
      reference_title: Recurrent internal tandem duplications of BCOR in clear cell sarcoma of the kidney.
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      explanation: Roy et al. report, from their analysis of tumours from two independent cohorts (their
        own sequencing and re-analysed TARGET consortium transcriptomes), that every BCOR internal tandem
        duplication identified in their study targets the C-terminal PUFD domain. Citing earlier work,
        they add that this is the domain through which BCOR physically interacts with PCGF1 within a variant
        PRC1, the PRC1.1/BCOR complex, which GO names the BCOR complex (GO:0140261). That the domain is
        important for forming the complex is one inference step from this, because it is the domain through
        which BCOR binds PCGF1 inside the complex. The sentence says where the duplications sit and what
        the domain binds; it does not say that BCOR acts as a transcriptional corepressor, or whether
        the duplication raises or lowers the activity of the complex. 'PCR1' is the source's own spelling
        of PRC1 and is kept as written.
