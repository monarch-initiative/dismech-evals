      reference_title: BCoR, a novel corepressor involved in BCL-6 repression.
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      explanation: 'Huynh et al. identified BCoR in cell-based reporter and protein-interaction studies
        as a corepressor: it can function as a corepressor when tethered to DNA, can potentiate repression
        by BCL-6 when overexpressed, and interacts selectively with the POZ domain of BCL-6. This is the
        basis for binding transcription corepressor activity (GO:0003714) to this node, with no modifier.
        The study describes normal BCOR function in cultured cells and says nothing about the CCSK duplication
        or its effect on that function.'
