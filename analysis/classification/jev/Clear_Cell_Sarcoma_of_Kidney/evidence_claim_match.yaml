        description: 'On NWTS-5, 45 of the 108 staged patients had stage III disease, with five-year event-free
          and overall survival of 73% and 89%. NWTS-5 assessed prognostic factors, tumour spill among
          them, in its stage II and III patients together: no factor predicted overall survival on multivariate
          analysis, and only age of 12 months or more correlated with better event-free and overall survival
          on univariate analysis. On AREN0321 and AREN03B2, the 65 stage III patients had a pooled four-year
          event-free survival of 82.8%. Stage II and III patients on AREN0321 received regimen I with
          radiotherapy, all three local recurrences occurred in local stage III disease, and among local
          stage III tumours neither the initial procedure type, margin status nor lymph node involvement
          was prognostic. In a multicentre cohort of 54 children treated in Shanghai following NWTS strategies
          and staged by the NWTS system, five-year event-free survival was 71.1% for the 21 stage III
          patients. Across that cohort, inferior vena cava tumour thrombus (6 patients; event-free survival
          41.7% against 87.4% without it) and tumour rupture before or during surgery (5 patients; 40%
          against 86.8%) were adverse factors on univariate analysis, and tumour rupture was the only
          independent adverse factor on multivariate analysis (HR 5.9, 95% CI 1.4 to 24.5). The authors
          attribute part of their stage III result to tumour rupture, with event-free survival of about
          86% for stage III patients without it.'
      selected_evidence:
        snippet: Multivariate analysis revealed that tumor rupture was independent poor prognostic factor
          (P = 0.01, HR 5.9, 95%Cl 1.4–24.5). ... The stage III prognosis in our study may have been somewhat
          poor partly due to the higher proportion of tumor rupture (9.3%), Tumor rupture was independent
          poor prognostic factor. ... For stage III patients without tumor rupture, the EFS was about
          86% in our study. But the patients with inferior vena cava tumor thrombus also had poor prognosis
          (41.7%), for such patient, a more intense chemotherapy regimen including carboplatin maybe indicated.
        supports: SUPPORT
        directness: DIRECT
