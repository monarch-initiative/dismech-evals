        tumours that mimicked Wilms tumour, and for MIC2, including cellular tumours that mimicked primitive
        neuroectodermal tumour. The authors report that these consistently negative results helped exclude
        other tumours in the differential diagnosis. The abstract names no other antibodies and does not
        say how many of the 45 tumours were stained with each.
