              label: cleft lip/palate
        context: []
      assertion_type: Subtype
      assertion:
        name: Nonsyndromic CL/P
        display_name: Nonsyndromic (isolated) cleft lip with or without cleft palate
        description: 'Cleft lip with or without cleft palate occurring in isolation, without other major
          malformations or a recognized syndrome. Etiology is multifactorial, with common and rare variants
          at multiple loci interacting with environmental exposures. Accounts for roughly 70% of cleft
          lip +/- palate cases. Note: cleft lip with or without cleft palate (CL/P) and isolated cleft
          palate only (CPO) are partly distinct developmental and genetic entities (they arise in different
          embryonic windows and some loci, e.g., the IRF6 rs642961 enhancer variant, associate with cleft
          lip but not isolated cleft palate); this entry (MONDO:0016044) centers on the CL/P axis.'
      selected_evidence:
        snippet: approximately 70% of cases of CLP occur as isolated entities with no other apparent cognitive
          or structural abnormalities
        supports: SUPPORT
