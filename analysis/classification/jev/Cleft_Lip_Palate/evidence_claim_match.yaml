        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disruption of the Orofacial Developmental Gene Regulatory Network
        description: Lip and palate morphogenesis is governed by a conserved gene regulatory network in
          which transcription factors and signaling pathways (IRF6-GRHL3 in the periderm/oral epithelium;
          SHH, BMP4, FGF, and WNT signaling; MSX1, FOXE1, PAX7, TP63) coordinate epithelial-mesenchymal
          interactions. Pathogenic variants and common risk alleles at these loci perturb the network,
          reducing the developmental robustness of fusion and increasing cleft susceptibility. IRF6 is
          the single most important locus, contributing to both syndromic (Van der Woude) and nonsyndromic
          clefting.
        gene:
          preferred_term: IRF6
          term:
            id: hgnc:6121
            label: IRF6
        cell_types:
        - preferred_term: oral periderm cell
          term:
            id: CL:0000078
            label: peridermal cell
        biological_processes:
        - preferred_term: roof of mouth development
          term:
            id: GO:0060021
            label: roof of mouth development
      selected_evidence:
        snippet: The A allele is significantly overtransmitted (P = 1 x 10(-11)) in families with NSCL/P,
          in particular those with cleft lip but not cleft palate.
        supports: SUPPORT
    origin:
