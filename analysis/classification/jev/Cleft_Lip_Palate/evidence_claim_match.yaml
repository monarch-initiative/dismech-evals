              label: cleft lip/palate
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Lip and Primary Palate Fusion
        description: During weeks 4-7 of development, cranial neural crest-derived mesenchyme populates
          the frontonasal prominence and paired maxillary prominences. Formation of the upper lip and
          primary palate requires the medial nasal prominences to merge with each other and with the maxillary
          prominences. Deficient neural crest cell migration, proliferation, or survival, or failure of
          epithelial seam breakdown at the sites of contact, prevents fusion and produces a cleft of the
          lip (with or without the alveolus), which may be unilateral or bilateral.
        cell_types:
        - preferred_term: cranial neural crest cell
          term:
            id: CL:0011012
            label: neural crest cell
        biological_processes:
        - preferred_term: neural crest cell migration
          term:
            id: GO:0001755
            label: neural crest cell migration
        - preferred_term: primary palate development
          term:
            id: GO:1903929
            label: primary palate development
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
      selected_evidence:
        snippet: The common forms of CLP involve disruption of tissue planes above the lip extending into
          the nares and/or the palate (hard and/or soft)
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
