  2554622b1a0f87136656683e82ec9ff2459f501efb742bb60a036ea3310412d7:
    claim:
      about:
        disease:
          name: Cleft Lip/Palate
          disease_term:
            preferred_term: cleft lip/palate
            term:
              id: MONDO:0016044
              label: cleft lip/palate
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Secondary Palatal Shelf Elevation and Fusion
        description: Between weeks 6 and 9, the paired secondary palatal shelves grow vertically beside
          the tongue, elevate to a horizontal position above the descending tongue, grow toward the midline,
          and fuse. Fusion requires apposition of the medial edge epithelia, formation of a midline epithelial
          seam, and subsequent removal of the seam by epithelial apoptosis and/or epithelial-mesenchymal
          transition, allowing mesenchymal confluence. Disruption of shelf growth, delayed or failed elevation,
          impaired seam formation, or persistence of the medial edge epithelium yields a cleft of the
          secondary palate.
        cell_types:
        - preferred_term: palatal shelf mesenchyme (cranial neural crest-derived)
          term:
            id: CL:0011012
            label: neural crest cell
        biological_processes:
        - preferred_term: secondary palate development
          term:
            id: GO:0062009
            label: secondary palate development
        - preferred_term: epithelial cell apoptosis in palatal shelf fusion
          term:
            id: GO:1990134
            label: epithelial cell apoptotic process involved in palatal shelf morphogenesis
        - preferred_term: roof of mouth development
          term:
            id: GO:0060021
            label: roof of mouth development
      selected_evidence:
        snippet: the embryonic primary and secondary palatal shelves develop as outgrowths from the medial
          nasal and maxillary prominences, respectively, remodel and fuse to form the intact roof of the
          oral cavity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22186724
      reference_title: 'Palatogenesis: morphogenetic and molecular mechanisms of secondary palate development.'
      evidence_source: OTHER
      explanation: Describes the palatal shelf outgrowth, remodeling, and midline fusion whose failure
