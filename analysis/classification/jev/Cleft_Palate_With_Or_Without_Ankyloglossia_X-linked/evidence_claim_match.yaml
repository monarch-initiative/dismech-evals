        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: abers_mechanism_gap
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Do the TBX22 variants found in Abruzzo-Erickson syndrome act by loss of function like
          classic CPX alleles, or by a different mechanism that would explain the extra coloboma, deafness,
          hypospadias and limb findings?
        attaches_to:
        - has_subtypes#Abruzzo-Erickson Syndrome
        - pathophysiology#TBX22 Loss of Function
        rationale: ClinGen lumped Abruzzo-Erickson syndrome with classic CPX on the view that the molecular
          mechanism does not differ. The original splice acceptor variant was predicted to cause aberrant
          splicing, as were splice variants in classic CPX families. A 2026 case series of a second family
          proposes gain of function instead. No functional study of the Abruzzo-Erickson alleles has compared
          them with classic alleles.
      selected_evidence:
        snippet: we found no difference in molecular mechanism, inheritance pattern, or phenotypic variability
        supports: SUPPORT
