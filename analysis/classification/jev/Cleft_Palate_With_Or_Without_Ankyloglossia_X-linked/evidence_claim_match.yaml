        context: []
      assertion_type: Genetic
      assertion:
        name: TBX22
        gene_term:
          preferred_term: TBX22
          term:
            id: hgnc:11600
            label: TBX22
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: TBX22 lies at Xq21.1 and encodes a T-box transcriptional repressor. Disease alleles include
          nonsense, frameshift, canonical and non-canonical splice, T-box missense and promoter variants;
          the mechanism is loss of function. In the mouse, palatal Tbx22 expression is activated by MN1
          and, in the early face, induced by FGF8 and restricted by BMP4.
        gene_disease_validity:
        - validity_classification: DEFINITIVE
          classified_by: CLINGEN
          external_id: CGGV:assertion_c7700e51-c293-487b-a06a-1392fb1b6209-2024-09-19T160000.000Z
        case_fractions:
        - population: Patients with non-syndromic cleft palate (pooled estimate)
          case_fraction_percent: 5.0
          notes: Around 5% of non-syndromic cleft palate, as summarised from earlier patient screens.
        - population: Thai patients with non-syndromic cleft palate
          case_fraction_percent: 7.5
          cohort_size: 53
          notes: Four potentially pathogenic variants in 53 unrelated patients.
        variants:
        - name: c.358C>T (p.Arg120Trp)
          description: T-box domain missense variant segregating with CPX in a Tunisian family with four
            affected males and two affected females.
        - name: c.767+1G>A
          description: Canonical splice donor variant found in classic CPX.
        - name: c.-73G>A (promoter)
          description: Promoter variant at an ETS-1 binding site, co-segregating with cleft palate without
            ankyloglossia in a six-generation family.
      selected_evidence:
        snippet: Here we show that CPX is caused by mutations in the gene encoding the recently described
          T-box transcription factor TBX22 (ref. 14).
        supports: SUPPORT
