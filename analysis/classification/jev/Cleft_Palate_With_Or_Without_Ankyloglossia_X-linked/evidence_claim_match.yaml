      assertion_type: Pathophysiology
      assertion:
        name: TBX22 Loss of Function
        biological_scale: MOLECULAR
        description: Nonsense, frameshift, splice-site, missense and promoter variants abolish or reduce
          TBX22 function. TBX22 is a sequence-specific transcriptional repressor; pathogenic missense
          variants cluster in the DNA-binding T-box domain, weaken DNA binding and impair repression,
          and all of them lose SUMO-1 conjugation at lysine 63, which the repressor activity requires.
          Promoter variants that lower transcription of an otherwise normal gene produce the same phenotype.
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
        genes:
        - preferred_term: TBX22
          term:
            id: hgnc:11600
            label: TBX22
        molecular_functions:
        - preferred_term: DNA-binding transcription repressor activity
          modifier: DECREASED
          term:
            id: GO:0001227
            label: DNA-binding transcription repressor activity, RNA polymerase II-specific
        biological_processes:
        - preferred_term: TBX22 sumoylation
          modifier: DECREASED
          term:
            id: GO:0016925
            label: protein sumoylation
      selected_evidence:
        snippet: The spectrum of nonsense, splice-site, frameshift and missense mutations we have identified
          in this study indicates that the cleft phenotype results from a complete loss of TBX22 function.
        supports: SUPPORT
