        status: OPEN
        prompt: Why are about a third of human heterozygous carrier females affected while heterozygous
          Tbx22 mutant female mice are all unaffected?
        attaches_to:
        - inheritance#X-linked semidominant
        - pathophysiology#TBX22 Loss of Function
        rationale: Carrier-female expression is what makes CPX semidominant rather than recessive, and
          it matters for counseling daughters of affected men. The mouse model reproduces the hemizygous
          male phenotype but not the carrier phenotype, and its authors name additional genetic or environmental
          factors or differences in X-inactivation as possible explanations. None has been tested.
      selected_evidence:
        snippet: It is also interesting to note that unlike in the human, female heterozygote mutant mice
          are all unaffected whereas the null females are the same as male null animals.
        supports: SUPPORT
