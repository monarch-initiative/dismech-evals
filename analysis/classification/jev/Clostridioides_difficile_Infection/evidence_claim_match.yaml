        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Colonization Resistance
        description: 'The healthy microbiome normally prevents C. difficile colonization through multiple
          mechanisms: nutrient competition (especially for proline, amino acids), niche exclusion, and
          production of bacteriocins and antimicrobial peptides. Antibiotic disruption removes these competitive
          barriers.

          '
        notes: 'Metagenomics studies consistently show CDI patients have depleted Lachnospiraceae, Ruminococcaceae,
          and Collinsella spp. compared to controls. BugSigDB signatures for CDI-related studies confirm
          depletion of these protective taxa. The Lachnospiraceae member C. scindens is particularly important
          for bile acid-mediated resistance.

          '
      selected_evidence:
        snippet: A general feature of a normal, healthy gut microbiota can generate conditions in the
          gut that disfavor colonization of enteric pathogens. This is termed colonization-resistance
          (CR). Upon disturbance of the microbiota, CR can be transiently disrupted, and pathogens can
          gain the opportunity to grow to high levels.
        supports: SUPPORT
    origin:
