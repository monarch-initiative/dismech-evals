              label: Clostridium difficile colitis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cdi_spore_adherence_biofilm_persistence
        prompt: The paper identifies E-cadherin-binding spore ligands (CotE, CdeM, CDIF27147_03838, CDIF27147_02282)
          mediating adherence to intestinal epithelial cells and notes their conservation across classical
          C. difficile clades. However, synthetic peptide competition assays unexpectedly failed to disrupt
          binding despite mapping discrete binding motifs. The mechanistic progression from initial E-cadherin-mediated
          spore adherence to stable biofilm formation and long-term mucosal persistence—the critical step
          in recurrent CDI—remains unresolved. What additional molecular interactions (beyond E-cadherin-peptide
          engagement) sustain spore persistence in intestinal biofilms, and why do synthetic peptides
          fail to competitively block binding in vitro?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#E-Cadherin-Mediated Spore Adherence
        rationale: Spore adherence to epithelium and persistence in biofilms are critical drivers of recurrent
          CDI, affecting 20-30% of initial CDI patients. The conserved nature of the E-cadherin-binding
          mechanism across C. difficile clades suggests it is mechanistically important, but the failure
          of synthetic peptide competition assays to disrupt binding points to additional structural/binding
          complexity. Understanding how initial adherence progresses to stable biofilm formation is essential
          for developing targeted therapies that prevent recurrence by disrupting spore persistence.
      selected_evidence:
        snippet: However, competitive E-cadherin pull-down assays using synthetic peptides of these motifs
          did not reduce E-cadherin binding to C. difficile spores.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:42299067
      reference_title: Coupling Far-Western Blotting with Peptide Microarrays Reveals Novel E-Cadherin
        Spore-Surface Ligands in Clostridioides difficile.
      evidence_source: IN_VITRO
      explanation: Despite identifying discrete binding motifs, synthetic peptide competition failed to
        disrupt spore-E-cadherin interaction, suggesting additional binding mechanisms or high-affinity
        interactions not captured by peptide assays.
