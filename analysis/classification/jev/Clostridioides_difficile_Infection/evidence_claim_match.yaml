        description: 'In CDT-positive strains, including the hypervirulent NAP1/BI/ribotype-027 lineage,
          the binary toxin axis contributes to virulence and increased disease severity through two arms.
          Enzymatically, the CDTa ADP-ribosyltransferase modifies globular actin and blocks actin polymerization;
          the resulting depolymerization promotes microtubule protrusions that markedly increase C. difficile
          adherence to epithelial cells. Independently, CDT (via its pore-forming CDTb component) can
          activate inflammasome-linked inflammatory pathways in myeloid cells in vitro, though this inflammasome
          activity was not required for CDT-associated disease severity in a mouse infection model.

          '
