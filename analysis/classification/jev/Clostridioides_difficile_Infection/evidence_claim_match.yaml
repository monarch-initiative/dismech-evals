          value:
            name: E-Cadherin-Mediated Spore Adherence
            description: 'C. difficile spores persist in the gut through adherence to intestinal epithelial
              cells via interaction with E-cadherin, a transmembrane adhesion molecule on the host epithelium.
              Proteomic studies have identified four spore surface ligands that bind E-cadherin: the spore
              coat proteins CotE and CdeM, along with two uncharacterized proteins (CDIF27147_03838 and
              CDIF27147_02282). These ligands carry discrete E-cadherin-binding motifs (9-20 amino acid
              regions) that are conserved across all five classical C. difficile clades (C1-C5) and predicted
              to be surface-exposed. E-cadherin-mediated adherence anchors spores to the epithelial surface,
              representing a foundational mechanism for spore persistence and recurrent infection. Toxin-mediated
              injury amplifies this interaction: TcdA and TcdB open adherens junctions and increase E-cadherin
              accessibility, further enhancing spore adherence and internalization and providing a plausible
              route to recurrent infection. The progression from initial E-cadherin-mediated adherence
              to stable biofilm formation and recurrent disease remains incompletely understood, particularly
              regarding the roles of secondary adhesion mechanisms, integration with nutrient/bile acid
              sensing, and the identity of additional spore-epithelial/spore-spore interactions stabilizing
              persistent infection.'
