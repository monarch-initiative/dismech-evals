  626569327cc830640ba86e4007076df6139fb48d6bbf08092ca9e864affa93a1:
    claim:
      about:
        disease:
          name: Clostridioides difficile Infection
          disease_term:
            preferred_term: Clostridium difficile colitis
            term:
              id: MONDO:0000705
              label: Clostridium difficile colitis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: E-Cadherin-Mediated Spore Adherence
        description: 'C. difficile spores persist in the gut through adherence to intestinal epithelial
          cells via interaction with E-cadherin, a transmembrane adhesion molecule on the host epithelium.
          Proteomic studies have identified four spore surface ligands that bind E-cadherin: the spore
          coat proteins CotE and CdeM, along with two uncharacterized proteins (CDIF27147_03838 and CDIF27147_02282).
          These ligands carry discrete E-cadherin-binding motifs (9-20 amino acid regions) that are conserved
          across all five classical C. difficile clades (C1-C5) and predicted to be surface-exposed. E-cadherin-mediated
          adherence anchors spores to the epithelial surface, representing a foundational mechanism for
          spore persistence and recurrent infection. Toxin-mediated injury amplifies this interaction:
          TcdA and TcdB open adherens junctions and increase E-cadherin accessibility, further enhancing
          spore adherence and internalization and providing a plausible route to recurrent infection.
          The progression from initial E-cadherin-mediated adherence to stable biofilm formation and recurrent
          disease remains incompletely understood, particularly regarding the roles of secondary adhesion
          mechanisms, integration with nutrient/bile acid sensing, and the identity of additional spore-epithelial/spore-spore
          interactions stabilizing persistent infection.'
        role: virulence
        cell_types:
        - preferred_term: Colonic Epithelial Cell
          term:
            id: CL:0011108
            label: colon epithelial cell
        biological_processes:
        - preferred_term: Cell Adhesion
          term:
            id: GO:0007155
            label: cell adhesion
      selected_evidence:
        snippet: The spore surface proteins CotE (CDIF27147_01458) and CdeM (CDIF27147_01682), along with
          two uncharacterized proteins, CDIF27147_03838 and CDIF27147_02282, interact with E-cadherin.
        supports: SUPPORT
    origin:
