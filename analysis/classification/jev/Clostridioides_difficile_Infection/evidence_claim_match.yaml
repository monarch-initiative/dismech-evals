      assertion_type: Pathophysiology
      assertion:
        name: Loss of Secondary Bile Acid Production
        description: 'Loss of bile acid 7α-dehydroxylating bacteria (Clostridium scindens, C. hylemonae,
          and related taxa) prevents conversion of primary bile acids (cholate, chenodeoxycholate) to
          secondary bile acids (deoxycholate, lithocholate). Primary bile acids promote C. difficile spore
          germination; secondary bile acids inhibit both germination and vegetative growth.

          '
        notes: 'The bai (bile acid-inducible) operon encodes the 7α-dehydroxylation pathway. ~2mM deoxycholate
          is sufficient to inhibit C. difficile growth in vitro.

          '
      selected_evidence:
        snippet: Amendment of Oligo-MM12 with C. scindens normalized the large intestinal bile acid composition
          by reconstituting 7α-dehydroxylation. These changes had only minor effects on the composition
          of the native Oligo-MM12, but significantly decreased early large intestinal C. difficile colonization
          and pathogenesis.
        supports: SUPPORT
