  25cd929f4c66c836d8cad5512294c4d657f48488e399835d256ff9e639354e2e:
    claim:
      about:
        disease:
          name: Clouston Syndrome
          disease_term:
            preferred_term: Clouston syndrome
            term:
              id: MONDO:0007510
              label: Clouston syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: GJB6 pathogenic variants
        gene_term:
          preferred_term: GJB6
          term:
            id: hgnc:4288
            label: GJB6
        inheritance:
        - name: Autosomal dominant
        variants:
        - name: p.Gly11Arg (G11R)
          description: 'Most common mutation worldwide. Results from c.31G>C substitution in the N-terminus
            of Cx30. Found in French-Canadian, Polish, Lebanese-German, and other populations.

            '
        - name: p.Ala88Val (A88V)
          description: 'Second most common mutation, c.263C>T. Introduces a hydrophobic residue in the
            transmembrane M2 domain. Recurrently reported in Chinese Han families.

            '
        - name: p.Val37Glu (V37E)
          description: Less common mutation identified in HED families.
        - name: p.Asp50Asn (D50N)
          description: Fourth known pathogenic mutation in GJB6 causing HED.
        - name: p.Asn14Ser (N14S)
          description: Novel mutation identified in a Han Chinese pedigree.
        - name: p.Gly45Ala (G45A)
          description: 'Novel heterozygous missense variant (c.134G>C) identified in a large Chinese pedigree
            with a unique phenotype including cold-triggered nail pain. Classified as likely pathogenic
            by ACMG criteria.

            '
        features: 'Missense mutations in GJB6, encoding connexin 30 (Cx30), a gap junction protein expressed
          in skin, hair follicles, and nail matrix. At least four recurrent mutations (G11R, A88V, V37E,
          D50N) cause HED. Mutant Cx30 forms dysfunctional gap junctions with gain-of-function hemichannel
          activity, leading to aberrant ATP release that may alter paracrine signaling in the epidermis.

          '
      selected_evidence:
        snippet: Four mutations (p.G11R, p.A88V, p.V37E and p.D50N) in gap junction beta 6 (GJB6) gene,
          which codes connexin30 protein, have been found to cause HED in different populations
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32843087
      reference_title: A recurrent mutation of GJB6 in a big Chinese family with Hidrotic ectodermal dysplasia.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the four known pathogenic GJB6 mutations causing hidrotic ectodermal dysplasia
        across different populations.
