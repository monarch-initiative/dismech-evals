          so the association is not CWP-specific. It is curated as a susceptibility modifier on that basis
          and not as a CWP-only effect estimate.
      selected_evidence:
        snippet: The analysis revealed that allele A of TNFα-308, allele A of TNFα-238, and allele C of
          IL-1RA + 2018 were identified as risk factors for the development of diseases.
        supports: SUPPORT
