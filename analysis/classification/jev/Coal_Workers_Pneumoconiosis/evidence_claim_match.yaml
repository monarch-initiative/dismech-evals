        display_name: Complicated CWP / Progressive Massive Fibrosis (PMF)
        description: Defined by conglomerate fibrotic masses one centimetre or larger (ILO large opacity
          categories A, B, C) formed by coalescence of nodular lesions. Carries a substantially worse
          prognosis than simple CWP and is characteristically relentless — it can progress after dust
          exposure ends. Its prevalence in long-tenured central Appalachian miners has risen roughly tenfold
          from a late 1990s nadir.
      selected_evidence:
        snippet: the prevalence of PMF has increased from 0.33% to 3.2% in miners with 25 years or more
          of tenure
        supports: SUPPORT
