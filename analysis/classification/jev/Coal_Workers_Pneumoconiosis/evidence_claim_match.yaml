      assertion_type: Subtype
      assertion:
        name: Rapidly Progressive Pneumoconiosis
        display_name: Rapidly Progressive Pneumoconiosis (RPP)
        description: An accelerated presentation in which radiographic profusion advances unusually fast,
          often in younger miners with shorter tenure. Lung pathology in these cases shows features of
          accelerated silicosis and mixed-dust lesions with abundant birefringent silica and silicates
          rather than the classic coal-predominant macule, so this subtype is better understood as a silica-driven
          variant of coal mine dust lung disease than as fast simple CWP.
      selected_evidence:
        snippet: Our findings suggest that rapidly progressive pneumoconiosis in these miners was associated
          with exposure to coal mine dust containing high concentrations of respirable silica and silicates.
        supports: SUPPORT
