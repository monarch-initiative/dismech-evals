        association: Host susceptibility modifier. The TNF-alpha promoter polymorphisms -308 and -238
          are associated with CWP risk in meta-analysis of candidate-gene case-control studies, chiefly
          in Chinese coal-miner cohorts. These are common regulatory variants that amplify the TNF-alpha-driven
          inflammatory response to retained dust; they modify risk and are neither necessary nor sufficient
          without the exposure.
