      assertion_type: Pathophysiology
      assertion:
        name: Silica-Enriched Dust Burden
        description: The crystalline silica and silicate fraction of the retained dust, which in contemporary
          thin-seam mining is markedly higher than historically because accessing thin coal seams requires
          cutting silica-bearing rock strata. Silica is far more cytotoxic and fibrogenic per particle
          than carbonaceous coal, so a silica-enriched burden shifts the disease toward the accelerated
          and silica-type severe forms rather than merely producing more of the same lesion.
        role: driver
        biological_scale: TISSUE
      selected_evidence:
        snippet: In situ mineralogic analysis showed that the percentage (26.1% vs. 17.8%; P < 0.01) and
          concentration (47.3 × 108 vs. 25.8 × 108 particles/cm3; P = 0.036) of silica particles were
          significantly greater in specimens from contemporary miners compared with their historical counterparts.
        supports: SUPPORT
