      assertion_type: Pathophysiology
      assertion:
        name: Macrophage Mitochondrial Dysfunction and Defective Mitophagy
        description: Coal-silica dust collapses mitochondrial membrane potential and impairs oxidative
          phosphorylation in macrophages, while suppressing PINK1/Parkin signalling so the damaged mitochondria
          are not cleared. The failure of mitochondrial quality control amplifies the oxidant load and
          feeds both macrophage death and the inflammatory output, rather than being a passive consequence
          of them.
        role: driver
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        biological_processes:
        - preferred_term: mitophagy
          term:
            id: GO:0000423
            label: mitophagy
          modifier: DECREASED
        notes: Demonstrated in mice and cells, not in human coal miner tissue, and the branch was added
          on a reviewer's suggestion after the report flagged its translational status as unconfirmed.
          It is curated because the rescue arm below makes it a testable causal claim rather than an observation,
          but the human evidence is not there yet.
      selected_evidence:
        snippet: CSD exposure triggered ROS accumulation, mitochondrial membrane potential collapse, and
          impaired oxidative phosphorylation, leading to reduced adenosine triphosphate synthesis.
        supports: SUPPORT
