        name: Dust-Laden Macrophage Death
        description: Poorly biodegradable particles — the silica fraction especially — are cytotoxic to
          the macrophages that ingested them, and pro-apoptotic signalling rises in the alveolar compartment
          after coal dust exposure. Particles freed by dying cells are available for re-uptake by newly
          recruited macrophages, a loop that keeps the lesion building without further inhaled dust. How
          much of the early injury this cell death actually accounts for is contested; see the refuting
          evidence below.
        role: driver
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        biological_processes:
