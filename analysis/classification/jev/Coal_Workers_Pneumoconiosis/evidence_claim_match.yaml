  f950b0d8d5d94f474a41eaa4bcb20f330616d1cdbbb83cb8fa77276b8633f5ec:
    claim:
      about:
        disease:
          name: Coal Workers Pneumoconiosis
          disease_term:
            preferred_term: coal workers' pneumoconiosis
            term:
              id: MONDO:0006654
              label: anthracosis
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Caplan Syndrome
        disease_term:
          preferred_term: Caplan syndrome
          term:
            id: MONDO:0005690
            label: Caplan syndrome
        description: 'Rheumatoid pneumoconiosis: well-defined peripheral pulmonary nodules with necrobiotic
          centres retaining mineral dust, arising in a dust-exposed worker who also has rheumatoid arthritis.
          First described in Welsh coal miners, and a genuine consideration in any miner presenting with
          nodules.'
        distinguishing_features:
        - Coexisting rheumatoid arthritis, which ordinary CWP does not require
        - Peripheral, well-defined nodules rather than the upper-zone rounded opacities of simple CWP
        - Necrobiotic nodule centre retaining mineral dust
        - Nodules may appear before, at, or years after the arthritis is diagnosed
        notes: 'Curated as a differential rather than as a CWP subtype because MONDO makes it a sibling,
          not a child: MONDO:0005690 is a direct subclass of MONDO:0015926 pneumoconiosis, the parent
          of MONDO:0006654 anthracosis, and it arises on silicosis and asbestosis as readily as on coal
          dust. Recording it under has_subtypes would both misstate that nosology and, because subtype
          terms count as curated, retire MONDO:0005690 from the curation queue as though this entry covered
          it.

          The cited case had silica and asbestos exposure rather than coal mining, so it is used for the
          generic rheumatoid-pneumoconiosis lesion and not as a coal-miner case. A coal-miner Caplan citation
          would be a worthwhile addition; none was found in the cached reference set.'
      selected_evidence:
        snippet: Classically, they form peripheral well-defined pulmonary nodules with characteristic
          silica retained in the necrobiotic center.
        supports: SUPPORT
    origin:
