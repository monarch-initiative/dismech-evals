          the mainstay for medical surveillance of pneumoconioses in dusty trades. ... Coal mine dust
          lung disease (CMDLD), or black lung, is a group of lung conditions caused by exposure to coal
          mine dust, including emphysema, chronic obstructive pulmonary disease, dust-related diffuse
          fibrosis, and coal worker’s pneumoconiosis (CWP). CWP can be diagnosed by finding rounded or
          irregular linear opacities on chest imaging in association with a compatible exposure history.
          Pathologic studies have shown that rounded opacities on chest imaging correspond to coal macules
          and coal nodules, and irregular opacities to interstitial fibrosis.
