      assertion:
        name: Simple CWP
        display_name: Simple (Uncomplicated) Coal Workers' Pneumoconiosis
        description: The early form, defined radiographically by small rounded opacities (ILO profusion
          categories 1-3) reflecting coal macules and micronodules, without conglomerate masses. Frequently
          asymptomatic and detected only on surveillance radiography, which is what makes periodic screening
          the key intervention window.
      selected_evidence:
        snippet: Early pneumoconiosis can be asymptomatic, but advanced disease often leads to disability
          and premature death.
        supports: SUPPORT
