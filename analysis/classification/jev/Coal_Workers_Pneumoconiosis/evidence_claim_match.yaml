      assertion_type: Pathophysiology
      assertion:
        name: Alveolar Macrophage Phagocytosis of Retained Dust
        description: Alveolar macrophages recognize and internalize the deposited particles in an attempt
          to clear them. Coal and silica particles are poorly biodegradable, so the macrophage cannot
          resolve the load and instead becomes the persistently activated cell around which the lesion
          is built.
        role: driver
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: alveolar macrophage
          term:
            id: CL:0000583
            label: alveolar macrophage
        biological_processes:
        - preferred_term: phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
          modifier: INCREASED
      selected_evidence:
        snippet: Human and laboratory studies have suggested oxidant injury, and increased recruitment
          and activity of macrophages play important roles in dust-induced lung injury.
