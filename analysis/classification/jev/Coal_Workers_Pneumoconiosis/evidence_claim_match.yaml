  49a847e6b9ac4ae264518570698998aaef3a3d40d2a3c897489d32310a0d3559:
    claim:
      about:
        disease:
          name: Coal Workers Pneumoconiosis
          disease_term:
            preferred_term: coal workers' pneumoconiosis
            term:
              id: MONDO:0006654
              label: anthracosis
        context: []
      assertion_type: Environmental
      assertion:
        name: Occupational inhalation of respirable coal mine dust
        description: Cumulative inhalation of respirable coal mine dust during underground or surface
          coal mining is the necessary cause of CWP. Classic risk work is underground extraction, with
          roof bolting and continuous-miner operation among the dustiest tasks; contemporary thin-seam
          mining raises the silica fraction of the dust because accessing the seam requires cutting silica-bearing
          rock.
        exposure_term:
          preferred_term: exposure to respirable coal mine dust
          term:
            id: ECTO:7000005
            label: exposure to coal dust
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
            notes: Coal mine dust is a mineral dust, classified as a chemical agent in the occupational-hygiene
              scheme (ILO section 1.1), not as a physical agent.
          exposure_route:
          - classification_value: INHALATION
            notes: Only the respirable fraction reaching the terminal bronchioles and alveoli is pathogenic;
              the route is what defines the exposure.
          exposure_duration:
          - classification_value: CHRONIC
            notes: ATSDR chronic duration (365 days and longer). Classic CWP follows one to several decades
              of underground work; the rapidly progressive form compresses this but is still a multi-year
              exposure, not an intermediate or acute one.
          ghs_health_hazard_class:
          - classification_value: STOT_REPEATED_EXPOSURE
            notes: Specific target organ toxicity from repeated exposure — a non-lethal, organ-specific
              effect (lung) accumulating over prolonged exposure rather than an acute toxic response.
          exposome_domain:
          - classification_value: SPECIFIC_EXTERNAL
            notes: An identifiable individual-level occupational agent, in Wild's specific external domain
              rather than the general external environment.
        notes: No iarc_carcinogen_group is recorded. IARC evaluated coal dust in Monographs volume 68
          and placed it in Group 3 (not classifiable as to carcinogenicity to humans); the schema's IARCCarcinogenGroupEnum
          was checked and does admit GROUP_3, so this omission is a judgement rather than a schema limit
          — the Group 3 listing is for coal dust as an agent, while the exposure curated here is coal
          *mine* dust, a mixture whose silica fraction carries its own classification. Crystalline silica's
          Group 1 listing belongs to the Silicosis entry's exposure, not to this one. The cohort association
          between coal mine dust and lung cancer mortality is instead curated as evidence, on the mortality
          items below.
      selected_evidence:
        snippet: Among workers employed in the mining industry, the highest PMR was among underground
          mining machine operators (164.6).
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:41411198
      reference_title: Coal Workers' Pneumoconiosis-Associated Deaths - United States, 2020-2023.
