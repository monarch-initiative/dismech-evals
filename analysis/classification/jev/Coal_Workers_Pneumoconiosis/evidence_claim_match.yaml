          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: In rats exposed to BNF, CD exposure increased alveolar expression of the proapoptotic
          mediator Bax but decreased CYP1A1 induction relative to BNF exposure alone.
        supports: SUPPORT
        directness: INDIRECT
