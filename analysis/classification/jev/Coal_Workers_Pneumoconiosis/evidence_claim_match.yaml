      assertion_type: Diagnosis
      assertion:
        name: Occupational exposure history with ILO-classified chest radiography
        diagnosis_term:
          preferred_term: Chest Radiography
          term:
            id: NCIT:C38103
            label: Chest Radiography
        description: 'CWP is diagnosed clinically, not histologically: a compatible coal mine dust exposure
          history plus a characteristic chest radiograph classified under the ILO International Classification
          of Radiographs of Pneumoconioses, read by a NIOSH-certified B Reader. Profusion of small opacities
          is graded 0-3 with size categories p/q/r, and large opacities A/B/C define the complicated form.
          Tissue sampling is reserved for atypical presentations or a separate indication such as suspected
          malignancy. Certification matters measurably — non-certified readers over-read both presence
          and severity.'
        notes: Radiography does not distinguish between the coal-dust-induced interstitial lung diseases,
          so a surveillance "case of CWP" is an opacity-based definition rather than a claim about which
          lesion is present. Genetic testing has no diagnostic role; the susceptibility loci curated in
          `genetic:` are research findings.
      selected_evidence:
        snippet: Diagnosis of silicosis, coal workers’ pneumoconiosis, or asbestosis may be made based
          on a suggestive occupational history and typical chest imaging without the need for tissue sampling.
        supports: SUPPORT
