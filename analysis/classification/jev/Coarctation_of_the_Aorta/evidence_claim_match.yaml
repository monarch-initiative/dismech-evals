            label: Polygenic inheritance
        description: 'Coarctation sits within the left-sided obstructive lesion spectrum, which is clearly
          heritable - nonsyndromic defects recur in families and carry a high sibling recurrence risk
          - without following a Mendelian pattern. The currently accepted genes for this spectrum explain
          only 10-20% of patients, and the emerging picture is combinatorial: common and rare variants
          acting together. That is why the three genes curated below are all typed SUSCEPTIBILITY rather
          than causative, despite NOTCH1 and MYH6 being well-replicated associations.

          '
      selected_evidence:
        snippet: nonsyndromic defects are often observed in multiple family members and associated with
          high sibling recurrence risk. This clear evidence for a heritable basis has driven a lengthy
          search for disease-causing variants
        supports: SUPPORT
