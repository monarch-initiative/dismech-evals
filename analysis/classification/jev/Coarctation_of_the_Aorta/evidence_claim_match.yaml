      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: reduced_fetal_flow
        hypothesis_label: Reduced fetal isthmic flow
        status: ALTERNATIVE
        description: 'Any fetal lesion diverting blood from the ascending aorta and arch reduces antegrade
          flow through the isthmus, which then fails to grow. This predicts exactly the clustering that
          is observed - coarctation with bicuspid or stenotic aortic valve, with ventricular septal defect,
          with arch or descending aortic hypoplasia - and predicts that isolated coarctation should be
          the exception rather than the rule. It is the same reasoning applied to hypoplastic left heart
          syndrome, and it shares that debate''s central difficulty: the association is compatible with
          reduced flow causing the hypoplasia and with a shared developmental lesion causing both.

          '
      selected_evidence:
        snippet: ischemic hypoplasia results from prenatal decrease of blood flow to the ascending aorta
        supports: SUPPORT
