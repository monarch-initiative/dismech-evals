      assertion_type: Pathophysiology
      assertion:
        name: Ectopic Ductal Tissue at the Aortic Isthmus
        biological_scale: TISSUE
        role: trigger
        description: 'On the ductal-tissue account, contractile smooth muscle of ductus arteriosus type
          extends ectopically into the wall of the aortic isthmus. When the ductus constricts and closes
          after birth, this ectopic tissue contracts with it, drawing the posterior aortic wall inward
          as a shelf. The account explains the characteristic juxtaductal location of the narrowing and
          the timing of neonatal decompensation, which follows ductal closure rather than birth.

          '
        locations:
        - preferred_term: thoracic aorta
          term:
            id: UBERON:0001515
            label: thoracic aorta
        - preferred_term: ductus arteriosus
          term:
            id: UBERON:0005440
            label: ductus arteriosus
        cell_types:
        - preferred_term: aortic smooth muscle cell
          term:
            id: CL:0000359
            label: vascular associated smooth muscle cell
      selected_evidence:
        snippet: The anterior ostium to the descending aorta was obstructed by constricted ductus arteriosus
          in some infants with COA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
