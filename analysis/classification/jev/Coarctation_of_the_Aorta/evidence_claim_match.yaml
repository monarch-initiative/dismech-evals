        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Elevated Sympathetic Outflow and Baroreflex Impairment
        biological_scale: ORGANISM
        description: 'Directly measured muscle sympathetic nerve activity is elevated in repaired coarctation
          patients and the sympathetic baroreflex is dampened, while the cardiac baroreflex is preserved
          - a dissociation suggesting the abnormality lies in the arterial baroreceptor limb rather than
          in central autonomic control generally. Because the carotid and aortic baroreceptors sit in
          the abnormal proximal vasculature, this is plausibly the arteriopathy expressing itself through
          the autonomic nervous system rather than a separate lesion.

          '
      selected_evidence:
        snippet: dampened sympathetic baroreflex function (-2.2±2.1 vs. -7.0±5.6 bursts/100heartbeats·mm·Hg-1,
          p=0.007), normal cardiac baroreflex function
        supports: SUPPORT
