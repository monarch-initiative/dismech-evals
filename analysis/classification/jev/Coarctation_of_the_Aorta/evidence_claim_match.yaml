  f9d25dac4ac27580a56abf7bb5b08430cb1e462ccb3b57275d43c1bbb35926ac:
    claim:
      about:
        disease:
          name: Coarctation of the Aorta
          disease_term:
            preferred_term: aorta coarctation
            term:
              id: MONDO:0007345
              label: aorta coarctation
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Left Ventricular Outflow Tract Developmental Program Disruption
        biological_scale: MOLECULAR
        role: trigger
        description: 'Coarctation is highly heritable and sits within a genetically shared spectrum of
          left ventricular outflow tract malformations. NOTCH1 variants recur across bicuspid aortic valve,
          aortic aneurysm, hypoplastic left heart, and coarctation. A rare MYH6 missense variant carried
          by around a fifth of Icelandic coarctation cases associates with coarctation and with bicuspid
          valve. PRDM6, a smooth-muscle-specific transcription factor already implicated in patent ductus
          arteriosus, links the ductal and aortic lesions at the level of smooth muscle identity - the
          same cell type the ductal-tissue hypothesis invokes. Loss of one X chromosome short arm in Turner
          syndrome reproduces the bicuspid-valve/coarctation pair, localizing a dosage-sensitive contribution
          to Xp.

          '
        genes:
        - preferred_term: NOTCH1
          term:
            id: hgnc:7881
            label: NOTCH1
        - preferred_term: MYH6
          term:
            id: hgnc:7576
            label: MYH6
        - preferred_term: PRDM6
          term:
            id: hgnc:9350
            label: PRDM6
      selected_evidence:
        snippet: Approximately 20% of individuals with CoA in Iceland carry this mutation. We show that
          p.Arg721Trp also associates with other CHDs, in particular bicuspid aortic valve.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29590334
      reference_title: A rare missense mutation in MYH6 associates with non-syndromic coarctation of the
        aorta.
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies a single MYH6 variant's contribution to coarctation in a population-based
        genome-wide study and links it to the bicuspid valve.
