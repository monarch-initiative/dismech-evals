      assertion_type: Pathophysiology
      assertion:
        name: Ductal-Dependent Systemic Perfusion in Critical Coarctation
        biological_scale: ORGANISM
        description: 'In the most severe form, the neonate is well while the ductus arteriosus is open
          because systemic flow below the coarctation is supplied right-to-left across it. Ductal closure
          in the first days of life abruptly removes that supply, producing shock, acidosis, and heart
          failure. The presentation is therefore timed by ductal physiology rather than by the anatomy,
          and it is reversible in the short term by reopening the ductus pharmacologically.

          '
        locations:
        - preferred_term: ductus arteriosus
          term:
            id: UBERON:0005440
            label: ductus arteriosus
      selected_evidence:
        snippet: lesions with ductus dependent systemic blood flow e.g. critical aortic stenosis, coarctation
          of aorta, interruption of aortic arch
        supports: SUPPORT
