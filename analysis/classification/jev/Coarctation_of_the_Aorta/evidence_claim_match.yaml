      assertion_type: Pathophysiology
      assertion:
        name: Reduced Antegrade Flow Through the Fetal Aortic Isthmus
        biological_scale: TISSUE
        role: trigger
        description: 'On the flow account, any fetal lesion that diverts blood away from the ascending
          aorta and arch - a bicuspid or stenotic aortic valve, a ventricular septal defect shunting left
          to right, a small left ventricle - reduces antegrade flow through the isthmus, and the underperfused
          segment fails to grow. This predicts what is observed: coarctation clusters with other left-heart
          obstructive lesions rather than occurring in isolation, is combined with bicuspid aortic valve
          in more than half of cases, and coexists with arch or descending aortic hypoplasia in about
          half.

          '
        locations:
        - preferred_term: thoracic aorta
          term:
            id: UBERON:0001515
            label: thoracic aorta
        biological_processes:
        - preferred_term: aorta development
          term:
            id: GO:0035904
            label: aorta development
          modifier: ABNORMAL
      selected_evidence:
        snippet: ischemic hypoplasia results from prenatal decrease of blood flow to the ascending aorta
        supports: SUPPORT
