  4b91ee6c2f81e837f76f0d31a8f67b218a5a66a5b8eaf3d17f9809dfb1b9beed:
    claim:
      about:
        disease:
          name: Coarctation of the Aorta
          disease_term:
            preferred_term: aorta coarctation
            term:
              id: MONDO:0007345
              label: aorta coarctation
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coa_morphogenesis_ductal_vs_flow
        kind: CONTROVERSY
        attaches_to:
        - pathophysiology#Ectopic Ductal Tissue at the Aortic Isthmus
        - pathophysiology#Reduced Antegrade Flow Through the Fetal Aortic Isthmus
        prompt: 'Does the isthmic narrowing arise from constriction of ectopic ductal tissue, from failure
          of an underperfused isthmus to grow, or from both in different patients?

          '
        rationale: 'The two accounts predict different things about what repair can achieve. If the lesion
          is an active constriction of misplaced ductal muscle, the aorta proximal and distal to it may
          be structurally normal and complete excision should be curative. If the isthmus failed to grow
          because it was underperfused, the whole left-heart-and-arch complex is developmentally abnormal
          and the narrowing is one visible part of a larger lesion. The persistence of hypertension and
          arteriopathy after technically perfect repair is easier to reconcile with the second, but does
          not settle it, because a shared genetic program could produce both the ductal-tissue anomaly
          and the arterial wall abnormality independently. Contemporary genetics is uncomfortable for
          a clean separation: PRDM6 is a smooth-muscle-identity gene implicated in the ductal lesion,
          while MYH6 and NOTCH1 sit in the outflow-tract program that the flow account invokes.

          '
        proposed_experiments:
        - experiment_id: exp_coa_isthmic_flow_fetal_imaging
          name: Prospective fetal flow measurement in isthmic narrowing
          description: Serially quantify antegrade isthmic flow by fetal echocardiography in pregnancies
            at risk of coarctation, and relate flow trajectory to postnatal isthmic dimensions and to
            the presence of a discrete posterior shelf. A shelf appearing in fetuses with preserved isthmic
            flow would support the ductal-tissue account; progressive isthmic hypoplasia tracking with
            falling flow would support the growth-failure account.
        - experiment_id: exp_coa_resected_segment_histology_genotype
          name: Histologic and transcriptional characterization of resected coarctation segments by genotype
          description: Characterize resected coarctation segments for ductal-type smooth muscle markers
            and compare across genotype strata (PRDM6, MYH6, NOTCH1 variant carriers versus non-carriers).
            Enrichment of ductal-type tissue in PRDM6 carriers specifically would connect the genetic
            and morphogenetic accounts rather than leaving them as parallel narratives.
      selected_evidence:
        snippet: ischemic hypoplasia results from prenatal decrease of blood flow to the ascending aorta,
          and localized stenosis is related to abnormal distribution of the ductal tissue to the descending
          aorta and post-natal constriction of the ductus arteriosus.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7057615
      reference_title: Angiocardiographic study of coarctation of the aorta--morphology and morphogenesis.
      evidence_source: HUMAN_CLINICAL
      explanation: The clearest statement that both accounts are needed - one for the hypoplastic component
        and one for the localized stenosis. Graded PARTIAL because the authors present it explicitly as
        a working hypothesis compatible with their angiographic findings, not as a demonstrated morphogenesis.
