      assertion_type: Pathophysiology
      assertion:
        name: Left Ventricular Outflow Tract Developmental Program Disruption
        biological_scale: MOLECULAR
        role: trigger
        description: 'Coarctation is highly heritable and sits within a genetically shared spectrum of
          left ventricular outflow tract malformations. NOTCH1 variants recur across bicuspid aortic valve,
          aortic aneurysm, hypoplastic left heart, and coarctation. A rare MYH6 missense variant carried
          by around a fifth of Icelandic coarctation cases associates with coarctation and with bicuspid
          valve. PRDM6, a smooth-muscle-specific transcription factor already implicated in patent ductus
          arteriosus, links the ductal and aortic lesions at the level of smooth muscle identity - the
          same cell type the ductal-tissue hypothesis invokes. Loss of one X chromosome short arm in Turner
          syndrome reproduces the bicuspid-valve/coarctation pair, localizing a dosage-sensitive contribution
          to Xp.

          '
        genes:
        - preferred_term: NOTCH1
          term:
            id: hgnc:7881
