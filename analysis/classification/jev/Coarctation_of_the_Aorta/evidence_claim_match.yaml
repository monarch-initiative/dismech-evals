        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: ductal_tissue_migration
        hypothesis_label: Ectopic ductal tissue constriction
        status: CANONICAL
        description: 'Contractile tissue of ductus arteriosus type extends ectopically into the aortic
          isthmus; when the ductus constricts after birth, the ectopic tissue contracts with it and draws
          in the aortic wall. This is the traditional account and explains the juxtaductal location of
          the shelf and the timing of neonatal decompensation at ductal closure. It predicts that the
          narrowing is an active, tissue-intrinsic constriction rather than a growth failure. The PRDM6
          association - a smooth-muscle-specific transcription factor causal for patent ductus arteriosus
          and reported in patients who also have coarctation - is the most direct contemporary support
          for a shared ductal/aortic smooth-muscle lesion, though it falls short of demonstrating the
          ectopic tissue itself.

          '
      selected_evidence:
        snippet: localized stenosis is related to abnormal distribution of the ductal tissue to the descending
          aorta and post-natal constriction of the ductus arteriosus.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
