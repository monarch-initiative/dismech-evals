          term:
            id: CL:0000115
            label: endothelial cell
      selected_evidence:
        snippet: CT angiography (CTA) confirmed a severe coarctation, with a minimal luminal diameter
          of 3 mm, located 38 mm distal to the left subclavian artery, and extensive collateral circulation
          via intercostal and internal mammary arteries.
        supports: SUPPORT
