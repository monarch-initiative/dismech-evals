    evidence_metadata:
      reference: PMID:12044126
      reference_title: Mechanism of cocaine-induced hyperthermia in humans.
      evidence_source: HUMAN_CLINICAL
      explanation: Randomised double-blind placebo-controlled crossover trial of passive heat stress in
        cocaine-naive volunteers, establishing impaired dissipation rather than increased production as
        a mechanism in humans.
