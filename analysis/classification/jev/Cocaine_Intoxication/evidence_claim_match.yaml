      assertion_type: Pathophysiology
      assertion:
        name: Ventricular Arrhythmogenesis
        biological_scale: TISSUE
        description: 'Three substrates converge: slowed conduction supporting reentry, delayed repolarisation
          supporting triggered activity, and ischaemic myocardium. Catecholamine excess is superimposed
          on all three, which is why the arrhythmia burden of cocaine cannot be attributed to any single
          one of its actions.

          This node deliberately declares no conforms_to. The obvious target, xenobiotic_cardiac_channel_perturbation#Xenobiotic-Induced
          Cardiac Arrhythmia, is excluded by that module''s own scope note: "the xenobiotic must act on
          the channel itself. A drug that causes arrhythmia through electrolyte disturbance, ischaemia,
          or structural injury belongs elsewhere, even when the endpoint looks the same." This node is
          a mixed channel, ischaemia and catecholamine endpoint and takes an inbound edge from the supply-demand
          node, so conforming it would assert a channel attribution the entry itself contradicts. The
          three upstream nodes that do act on the channel carry the conformance instead.'
      selected_evidence:
        snippet: Excessive catecholamines, combined with sodium and potassium channel blockades, give
          rise to a wide variety of supra-ventricular and ventricular rhythms.
        supports: SUPPORT
