      assertion_type: Treatment
      assertion:
        name: Beta-Adrenergic Blockade
        therapeutic_modality: SMALL_MOLECULE
        description: 'Curated as a contested treatment, not a recommended one. The mechanistic case against
          it is that blocking beta receptors leaves alpha-mediated vasoconstriction unopposed, and this
          has been measured directly in humans: intracoronary propranolol after cocaine further reduced
          coronary flow and further raised coronary vascular resistance. The outcome case for it is that
          a meta-analysis of five studies and 1794 patients found no difference in infarction or mortality.
          Both are curated here, the first as SUPPORT for the mechanism and the second as REFUTE against
          the claim that the mechanism translates into harm. See the mechanistic_hypotheses block.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: propranolol
            term:
              id: CHEBI:8499
              label: propranolol
      selected_evidence:
        snippet: Beta-adrenergic blocking agents probably should be avoided in patients with cocaine-associated
          myocardial ischemia or infarction.
        supports: SUPPORT
