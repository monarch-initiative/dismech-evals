      assertion_type: Pathophysiology
      assertion:
        name: Impaired Thermoregulatory Heat Dissipation
        biological_scale: ORGANISM
        description: Cocaine raises the core temperature threshold at which cutaneous vasodilation and
          sweating begin, and blunts the perception of heating that would normally drive a person to seek
          shade or remove clothing. Heat production rising is the familiar half of the story; the losing
          half is that the body stops getting rid of it, and stops noticing. The clustering of cocaine-associated
          hyperthermia in hot weather is what prompted this hypothesis, rather than something the finding
          explains.
        biological_processes:
        - preferred_term: core body temperature homeostasis
          modifier: DECREASED
          term:
            id: GO:0001659
            label: temperature homeostasis
      selected_evidence:
        snippet: In humans, impaired heat dissipation is a major mechanism by which cocaine elevates body
          temperature.
        supports: SUPPORT
