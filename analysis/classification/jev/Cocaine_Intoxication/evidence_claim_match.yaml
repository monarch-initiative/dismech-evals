        biological_scale: TISSUE
        description: Reduced sodium current slows impulse propagation through the ventricular myocardium,
          widening the QRS complex. Because the QRS narrows promptly when extracellular sodium is raised
          and pH shifted with sodium bicarbonate, the widening is a reversible consequence of channel
          blockade rather than structural damage.
