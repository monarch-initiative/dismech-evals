      assertion:
        name: Granuloma formation and containment
        role: effector
        biological_scale: TISSUE
        conforms_to: granuloma_formation#Organized Granuloma Assembly
        description: 'The host attempts to contain Coccidioides infection through granuloma formation,
          a hallmark of the tissue response. Granulomas consist of epithelioid macrophages, multinucleated
          giant cells, and a surrounding cuff of lymphocytes. TNF-alpha is essential for granuloma formation
          and maintenance. CD14-positive macrophages localize to granuloma cores while CD206-positive
          macrophages are present internally and peripherally. Effective granuloma formation correlates
          with disease containment, while failure to form organized granulomas (as in immunocompromise
          or TNF-alpha blockade) is associated with dissemination and mortality.

          '
