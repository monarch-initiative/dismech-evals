    evidence_metadata:
      reference: PMID:18852250
      reference_title: Vaccine-induced cellular immune responses differ from innate responses in susceptible
        and resistant strains of mice infected with Coccidioides posadasii.
      evidence_source: MODEL_ORGANISM
      explanation: 'The failure arm of the same comparison: where the organized granuloma is not formed,
        the lesion is neutrophilic, the organism is abundant, T cells collapse, and the animal dies. This
        is the model-organism counterpart of the human containment-versus-cavitation dichotomy, and it
        is the observation that makes granuloma organization a candidate determinant of outcome rather
        than an incidental morphology. It remains correlational - no architecture was perturbed - so it
        does not establish that the organized structure is what causes containment.'
