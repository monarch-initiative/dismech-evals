      reference: PMID:39611685
      reference_title: Spatiotemporal analysis of lung immune dynamics in lethal Coccidioides posadasii
        infection.
      evidence_source: MODEL_ORGANISM
      explanation: 'The publication behind GSE274766 and GSE274767, the two datasets this hypothesis names
        as the instruments most capable of resolving its cell-identity component. It supplies a first
        answer: the dominant macrophage state recovered from infected lung is a monocyte-derived, Spp1-expressing
        profibrotic population rather than the epithelioid and giant-cell program the hypothesis borrows
        from tuberculosis. This does not settle the hypothesis - the model is lethal acute murine infection,
        not a contained human granuloma, and a profibrotic remodeling state and an epithelioid state are
        not mutually exclusive - but it moves the cell-identity question from unaddressed to partially
        addressed.'
