        notes: 'STAT4 E626G dominant-negative mutation reduces IFN-gamma responses to IL-12/IL-18 stimulation,
          increasing susceptibility to disseminated coccidioidomycosis. Subtype scope: the human genetic
          evidence for the Th1 axis comes from patients with DISSEMINATED disease, so it speaks to what
          prevents dissemination and should not be read as explaining severity within primary pulmonary
          infection.

          '
      selected_evidence:
        snippet: All affected family members had a single heterozygous base change in STAT4, c.1877A>G,
          causing substitution of glycine for glutamate at AA626 (STAT4E626G/+ ). A knockin mouse, heterozygous
          for the substitution, developed more severe experimental coccidioidomycosis than did wild-type
          mice.
        supports: SUPPORT
