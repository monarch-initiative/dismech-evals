              term:
                id: GO:0045087
                label: innate immune response
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Phagocytosis-resistant spherule persistence
        description: 'Morphogenesis from the small, readily phagocytosed arthroconidium into the large
          tissue-phase spherule is what converts the organism into a stimulus that an individual phagocyte
          cannot clear.

          '
        causal_link_type: DIRECT
      selected_evidence:
