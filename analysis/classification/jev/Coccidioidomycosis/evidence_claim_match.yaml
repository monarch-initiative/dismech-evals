  6fc5857660b52ca6a7a5ce6b4a8d832a3a76e2f5fe0bd95359037c8422c74f90:
    claim:
      about:
        disease:
          name: Coccidioidomycosis
          disease_term:
            preferred_term: coccidioidomycosis
            term:
              id: MONDO:0005706
              label: coccidioidomycosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_epithelioid_transformation_edges_unmeasured
        prompt: Has anyone shown, in Coccidioides-infected tissue, that Th1/Th17 and TNF signalling drives
          macrophages into the epithelioid and multinucleated giant-cell program, and that this transformation
          is what organizes and maintains the granuloma rather than being a bystander marker of it?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Epithelioid transformation and multinucleated giant cell formation
        - pathophysiology#Granuloma formation and containment
        - mechanistic_hypotheses#granuloma_composition_containment_model
        rationale: 'The two module-conforming edges at the centre of this entry are the ones with no Coccidioides
          measurement behind them. Both ends of the chain are documented in this disease: the spherule
          genuinely resists phagocytosis, the Th1/Th17 and TNF requirement is established by human genetic
          defects and by TNF blockade, and organized granulomas track with containment across mouse strains
          while the human cavity is neutrophilic and non-granulomatous. What is missing is the middle.
          The mechanistic cascade in which IFN-gamma primes macrophages to make TNF and IL-1 and thereby
          produces epithelioid and giant-cell differentiation was worked out in hypersensitivity pneumonitis
          and in antigen-bead granulomas, not in coccidioidomycosis, and no study has perturbed macrophage
          differentiation in a Coccidioides model to ask whether granuloma organization and containment
          are lost when fungal burden is held constant.

          This is a gap in evidence, not a suspected error: the entry''s giant-cell node is anchored on
          human tissue histopathology showing spherules inside multinucleated giant cells, so the transformation
          demonstrably occurs. The open question is whether it is driven by the signals the model names
          and whether it does the containing. It matters because the entry''s conformance to `granuloma_formation`
          rests on these two edges, and because the field''s default move - reasoning from tuberculosis
          - is exactly what the hypothesis flags as unvalidated.

          Note what would not close this gap. Etiology-comparative granuloma transcriptomics is sometimes
          cited as already showing that granuloma programs diverge by cause; the study most often invoked
          here (PMID:33276795) compares tissue sites within sarcoidosis, includes only three coccidioidomycosis
          subjects, and makes no direct coccidioidomycosis-versus-tuberculosis comparison, so it motivates
          the caution without measuring the edges.'
        proposed_experiments:
        - experiment_id: exp_spatial_coupling_macrophage_state_to_cytokine_niche
          name: Spatial transcriptomic coupling of macrophage differentiation state to local Th1/Th17
            cytokine fields in contained versus necrotic coccidioidal lesions
          description: Apply spatially resolved transcriptomics and single-cell profiling to coccidioidal
            lesions stratified by architecture - organized granuloma versus neutrophilic or caseous lesion
            - and ask whether epithelioid and giant-cell macrophage signatures are spatially coupled to
            local IFN-gamma, IL-17, and TNF fields, and whether that coupling separates contained from
            progressive lesions. The mouse datasets already recorded in this entry (GSE274766 and GSE274767)
            are matched to the question but were generated in lethal acute infection, so contained lesions
            and human tissue would have to be added for the contrast to exist.
          would_support:
          - pathophysiology#Epithelioid transformation and multinucleated giant cell formation
          would_refute:
          - mechanistic_hypotheses#granuloma_composition_containment_model
          supporting_outcome:
          - Epithelioid and giant-cell macrophage signatures localize to Th1/Th17-cytokine-rich niches
            and are enriched in contained lesions relative to necrotic ones.
          refuting_outcome:
          - Macrophage differentiation state is unrelated to local cytokine fields, or lesion outcome
            tracks neutrophil and inflammasome signatures irrespective of macrophage state, which would
            favour the alternative neutrophil/inflammasome model over this one.
        - experiment_id: exp_block_giant_cell_fusion_at_constant_burden
          name: Conditional blockade of macrophage fusion and epithelioid programming in a murine Coccidioides
            model
          description: Interrupt giant-cell fusion or epithelioid differentiation - for example by targeting
            the fusion machinery - during established murine coccidioidal infection, and measure granuloma
            architecture, containment, and dissemination while holding fungal burden constant. This is
            the perturbation that separates a driver from a marker, and it is the experiment no published
            Coccidioides study has performed.
          would_support:
          - pathophysiology#Granuloma formation and containment
          would_refute:
          - mechanistic_hypotheses#granuloma_composition_containment_model
          decision_criterion: Loss of organized granuloma architecture and of containment at unchanged
            fungal burden distinguishes a causal maintenance role from an incidental morphological correlate.
          supporting_outcome:
          - Blocking the transformation disorganizes the granuloma and degrades containment without altering
            the organism load.
          refuting_outcome:
          - Granuloma organization and containment are preserved despite loss of epithelioid and giant-cell
            differentiation, making the transformation a marker rather than the maintaining mechanism.
      selected_evidence:
        snippet: we do not know what cells are recruited to the granuloma, what signals form and maintain
          the granuloma structure, nor details on the immune microenvironment within the granuloma interior
        supports: SUPPORT
    origin:
