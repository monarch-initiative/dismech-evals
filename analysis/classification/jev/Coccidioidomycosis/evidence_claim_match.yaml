        context:
        - path: /pathophysiology/3
          value:
            name: Pulmonary cavitary disease
            role: consequence
            biological_scale: TISSUE
            conforms_to: granuloma_formation#Tissue Containment versus Destruction and Fibrosis
            description: 'The destructive arm of the module''s double-edged consequence node, specialized
              to Coccidioides. Where the granulomatous response contains the organism the infection resolves
              or leaves a quiescent nodule; where it fails to contain it, the granulomatous focus necroses
              and cavitates, and the cavity can rupture into the pleural space or bleed. Cavitary disease
              may be detected incidentally or during evaluation of cough or hemoptysis.

              Important qualifier on this conformance: the established cavity is where containment has
              already been lost, and human surgical pathology shows the cavity wall itself is characteristically
              NOT granulomatous - it shows chronic inflammation and occasional giant cells but no granulomas,
              with the lining composed of neutrophils and caseous necrosis, while granulomas persist in
              the adjacent lung as satellite lesions. The node therefore conforms to the module''s destruction
              arm as the outcome of granulomatous containment failing, not as a granulomatous lesion in
              its own right. That same lining of neutrophils and necrosis is what the `neutrophil_inflammasome_immunopathology_model`
              hypothesis group proposes is doing the damage.

              '
            locations:
            - preferred_term: lung
              term:
                id: UBERON:0002048
                label: lung
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Hemoptysis
        description: 'Cavitary lung disease in coccidioidomycosis can present when hemoptysis is investigated.

          '
        causal_link_type: DIRECT
      selected_evidence:
        snippet: Cavitary lung disease may be found incidentally or when investigating symptoms such as
          cough or hemoptysis.
        supports: SUPPORT
