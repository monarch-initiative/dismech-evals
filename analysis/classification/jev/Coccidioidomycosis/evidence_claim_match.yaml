        cells are recruited" component of the `granuloma_composition_containment_model` hypothesis directly
        rather than by analogy. Species scope matters here and the source insists on it: the same paper
        reports that human coccidioidal pulmonary granulomas carried roughly equivalent numbers of T and
        B lymphocytes, and describes its own canine result as distinct from both human and mouse lesions.
        Cited as MODEL_ORGANISM evidence for the peripheral T-cell organization of the lesion, not as
        a statement of human granuloma composition.'
