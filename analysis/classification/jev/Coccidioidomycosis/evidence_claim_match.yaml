  3c17643bb2822477bdb2cbbc24c7afdf16a186c845c8f92a26b45c2d28e65fec:
    claim:
      about:
        disease:
          name: Coccidioidomycosis
          disease_term:
            preferred_term: coccidioidomycosis
            term:
              id: MONDO:0005706
              label: coccidioidomycosis
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_regulatory_and_b_cell_granuloma_maintenance
        prompt: Do regulatory T cells and B-cell or ectopic-lymphoid structures govern whether a coccidioidal
          granuloma contains the organism or injures the lung, as they do in comparator granulomatous
          diseases?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Granuloma formation and containment
        - mechanistic_hypotheses#granuloma_composition_containment_model
        rationale: 'The curated model for this entry describes granuloma maintenance almost entirely as
          drive: Th1 and Th17 cytokines and TNF licensing a macrophage transformation. In the two granulomatous
          comparators this entry already names through the shared `granuloma_formation` module, the decisive
          variables include regulation as well as drive. In an HLA-DP2 transgenic model of chronic beryllium
          disease, depleting regulatory T cells worsened lung inflammation and increased granuloma formation,
          and depleting B cells dissolved the lymphoid aggregates and granulomas while increasing lung
          injury, with B cells found at the granuloma periphery in human disease too.

          No equivalent measurement exists for coccidioidomycosis. Neither cell type has been depleted,
          expanded, or systematically enumerated in a Coccidioides granuloma, so the entry cannot say
          whether the regulatory arm is absent from this disease or merely unstudied. That distinction
          is the gap.

          Deliberately not curated as pathophysiology nodes. Both supporting results come from a sterile
          particulate exposure in transgenic mice, and adding regulatory T cell or B cell nodes to this
          entry on that basis would assert a coccidioidal mechanism nobody has measured. The comparator
          evidence is recorded here, where its provenance stays visible, until Coccidioides-specific data
          exist.'
        proposed_experiments:
        - experiment_id: exp_treg_and_b_cell_depletion_in_murine_coccidioidomycosis
          name: Timed regulatory T cell and B cell depletion in murine pulmonary coccidioidomycosis
          description: Deplete regulatory T cells, or B cells, at defined phases of established murine
            Coccidioides infection and read out granuloma architecture, lymphoid aggregate formation,
            fungal burden, lung injury, and dissemination. Running both arms against the same infection
            separates a regulatory contribution to containment from a regulatory contribution to tissue
            tolerance, and pairs the disease with the comparator results that motivate the question.
          would_support:
          - pathophysiology#Granuloma formation and containment
          supporting_outcome:
          - Depletion changes lesion architecture or lung injury without a proportional change in fungal
            burden, establishing a regulatory arm in coccidioidal granuloma maintenance analogous to the
            comparator diseases.
          refuting_outcome:
          - Depletion leaves granuloma organization, injury, and burden unchanged, indicating that the
            comparator finding does not transfer and that this entry's drive-centred model is adequate.
      selected_evidence:
        snippet: Depletion of Treg cells in BeO-exposed HLA-DP2 Tg mice exacerbated lung inflammation
          and enhanced granuloma formation.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/2
      evidence_path: /discussions/2/evidence/0
      context_paths:
