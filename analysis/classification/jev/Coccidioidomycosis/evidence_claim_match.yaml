      - /disease_term
    evidence_metadata:
      reference: PMID:24912188
      reference_title: Regulatory T cells modulate granulomatous inflammation in an HLA-DP2 transgenic
        murine model of beryllium-induced disease.
      evidence_source: MODEL_ORGANISM
      explanation: Comparator-disease evidence that regulatory T cells modulate the granulomatous response.
        Cited to establish that the question is live in granuloma biology generally; it says nothing about
        Coccidioides, which is the gap.
