          term:
            id: GO:0000768
            label: syncytium formation by cell-cell fusion
          modifier: INCREASED
      selected_evidence:
        snippet: scattered large thick-walled spherules containing variable-sized endospores, predominantly
          within the multinucleated giant cells
        supports: SUPPORT
