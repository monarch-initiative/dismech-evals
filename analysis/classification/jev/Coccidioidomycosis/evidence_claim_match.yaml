      assertion_type: Pathophysiology
      assertion:
        name: Spherule rupture-triggered inflammasome activation and neutrophil recruitment
        biological_scale: CELLULAR
        description: 'The alternative, macrophage-independent axis of this entry. Rupture of the mature
          spherule - not the intact spherule - engages NLRP3 and pyrin inflammasomes with GSDMD/GSDME
          pore formation, releasing IL-1beta and recruiting neutrophils, which in human tissue congregate
          in and around rupturing spherules.

          Two loss-of-function results make this a genuine competitor to the macrophage/granuloma containment
          model rather than an elaboration of it, because in both the host does BETTER with less of this
          response: CXCR2 (IL-8R2)-deficient mice have fewer lung neutrophils and, unexpectedly, fewer
          organisms, with higher Ifng/Il17a - the authors'' interpretation being that neutrophils interfere
          with development of the protective Th1/Th17 response; and caspase-1-deficient mice show improved
          disease tolerance at equivalent fungal burden. Under this model, outcome is set by inflammasome-driven
          immunopathology rather than by the quality of the epithelioid/giant-cell program, and the neutrophil-and-caseous-necrosis
          lining of the human cavity is its destructive end point.

          This node deliberately carries no downstream edge to Th1/Th17: the claim there is that neutrophil
          influx *impairs* the protective response, and `CausalEdge` has no polarity slot, so an edge
          would misread as promotion.'
        cell_types:
        - preferred_term: neutrophil
          term:
            id: CL:0000775
            label: neutrophil
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: canonical inflammasome complex assembly
          term:
            id: GO:0140632
            label: canonical inflammasome complex assembly
          modifier: INCREASED
        - preferred_term: NLRP3 inflammasome complex assembly
          term:
            id: GO:0044546
            label: NLRP3 inflammasome complex assembly
          modifier: INCREASED
      selected_evidence:
        snippet: Caspase-1-deficient mice show improved disease tolerance to coccidioidomycosis despite
          equivalent fungal burdens
        supports: SUPPORT
