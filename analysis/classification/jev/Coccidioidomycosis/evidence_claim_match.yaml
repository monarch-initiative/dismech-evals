        role: central_effector
        biological_scale: CELLULAR
        conforms_to: granuloma_formation#Epithelioid Transformation and Multinucleated Giant Cell Formation
        description: 'In the activated milieu, lung macrophages undergo the module''s defining transformations:
          they differentiate into interdigitated epithelioid cells and fuse into multinucleated giant
          cells. In coccidioidomycosis the giant cells are the compartment in which spherules are characteristically
          found on tissue histopathology, so this step is simultaneously the granuloma-forming transformation
          and the containment of the organism the host could not phagocytose as a single cell.'
        cell_types:
        - preferred_term: epithelioid macrophage
          term:
            id: CL:0002150
