              id: MONDO:0005706
              label: coccidioidomycosis
        context: []
      assertion_type: Environmental
      assertion:
        name: Dust storm and windblown dust events
        exposure_term:
          preferred_term: exposure to windblown dust from a dust storm
          term:
            id: ECTO:7000001
            label: exposure to dust
        environment_context:
          preferred_term: dust
          term:
            id: ENVO:00002008
            label: dust
        description: 'Haboobs and strong regional wind events lift large volumes of semi-desert subsoil,
          the reservoir in which Coccidioides grows as mycelium, and are the most visible route by which
          arthroconidia become airborne over populated areas. Dust storm frequency in the American Southwest
          has risen sharply (reported as a 240% increase from the 1990s to the 2000s), and is a prominent
          mechanism in climate-change projections of expanding Valley Fever incidence.

          Scope caveat - two claims must be kept apart here. That a dust event aerosolizes and transports
          arthroconidia is not in dispute, and is what the mechanism edge below asserts. Whether dust
          storms *specifically* drive measurable subsequent increases in coccidioidomycosis cases is actively
          disputed: a superposed-epoch analysis of all recorded 2006-2020 dust storms near Phoenix and
          Bakersfield found no difference in case patterns after dust storms versus non-dust-storm conditions,
          and arthroconidia are also transported in low-wind conditions. That disagreement is recorded
          as a CONTROVERSY discussion rather than being resolved in favour of either side.

          '
        effect: Aerosolizes soil arthroconidia over populated areas; population-level attribution of case
          increases to dust storms is contested.
      selected_evidence:
        snippet: The intensified onset of climate change has caused frequencies and possibly intensities
          of natural hazard events like dust storms and drought to increase, which has been correlated
          with greater prevalence of VF.
        supports: SUPPORT
