              required to initiate and maintain the granuloma, so pharmacological TNF neutralization for
              an unrelated inflammatory indication removes the cytokine arm on which coccidioidal containment
              depends. This is the coccidioidomycosis instance of the granuloma-module drug pattern read
              in reverse: what is therapeutic in sterile granulomatous disease is a dissemination risk
              when a live, contained fungus is present.

              '
            effect: Predisposes to symptomatic and disseminated coccidioidomycosis.
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Th1/Th17 cell-mediated adaptive immunity
        environmental_effect: PREDISPOSES
        causal_link_type: DIRECT
        description: TNF blockade acts directly on the Th1/TNF-driven macrophage-activation step that
          licenses granuloma formation, degrading containment of the organism.
      selected_evidence:
        snippet: immune suppression by TNF inhibitors have been validated in later cohort studies
        supports: SUPPORT
