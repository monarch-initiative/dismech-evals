    evidence_metadata:
      reference: PMID:21129481
      reference_title: Coccidioides releases a soluble factor that suppresses nitric oxide production
        by murine primary macrophages.
      evidence_source: IN_VITRO
      explanation: 'Adds an active-suppression arm to the persistence of the spherule: the parasitic-phase
        organism does not merely resist ingestion, it releases a soluble factor that shuts down nitric
        oxide and iNOS output in IFN-gamma/LPS-activated macrophages, and phagocytosis is not required
        for the effect. This is the one direct Coccidioides measurement bearing on the granuloma interior
        microenvironment that the `granuloma_composition_containment_model` hypothesis names as unresolved.
        Scope caveat: the same study found macrophages from iNOS-deficient mice killed Coccidioides as
        efficiently as wild-type ones, so the suppression is documented but its contribution to containment
        is not established, and the fungal factor is unidentified.'
