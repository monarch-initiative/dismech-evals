        - path: /pathophysiology/0
          value:
            name: Arthroconidia inhalation and spherule morphogenesis
            biological_scale: CELLULAR
            description: 'Coccidioides exists as a mycelial form in soil. When soil is disturbed, arthroconidia
              (barrel-shaped spores 2-5 micrometers in size) become airborne and are inhaled into the
              lungs, reaching terminal bronchioles. In host tissues at 37 degrees C, arthroconidia undergo
              a morphological transition to spherules, which are large round structures that undergo internal
              division to produce hundreds of endospores. Developing spherules secrete a metalloproteinase
              that contributes to immune masking. Rupture of mature spherules releases endospores that
              trigger rapid immune cell influx and can spread hematogenously.

              '
            cell_types:
            - preferred_term: alveolar macrophage
              term:
                id: CL:0000583
                label: alveolar macrophage
            - preferred_term: neutrophil
              term:
                id: CL:0000775
                label: neutrophil
            - preferred_term: dendritic cell
              term:
