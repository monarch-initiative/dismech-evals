        description: 'Coccidioides is endemic to the southwestern United States (Arizona, California,
          New Mexico, Texas), northern Mexico, and parts of Central and South America. The fungus thrives
          in alkaline, sandy soils with hot summers and mild winters. Disturbance of soil by construction,
          earthquakes, or agricultural activities releases arthroconidia into the air; wind-driven disturbance
          is curated separately as "Dust storm and windblown dust events", because the population-level
          attribution of cases to discrete dust storms is contested in a way the general soil-exposure
          claim is not. Cases have been increasing, with reported incidence surging notably in California
          and Arizona.

          '
