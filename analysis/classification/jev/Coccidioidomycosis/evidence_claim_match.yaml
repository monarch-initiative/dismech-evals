        histological analogy - the assumption this hypothesis flags as unmeasured. Support is PARTIAL
        and the claim is bounded: the study is sarcoidosis-centred with only three coccidioidomycosis
        subjects, it reports commonalities as well as divergences, and it performs no direct comparison
        between coccidioidomycosis and tuberculosis, which is the specific analogy at issue. It motivates
        the EMERGING status without settling it.'
