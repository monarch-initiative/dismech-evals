          This entry''s conformance to the `granuloma_formation` module therefore rests on two causal
          edges (Th1/Th17 -> epithelioid transformation, and epithelioid transformation -> organized granuloma)
          whose evidence is PARTIAL for exactly this reason; those edges are tagged into this hypothesis
          group so the dependency is explicit rather than implied.

          Two comparators already in the knowledge base bear on the same question through the shared module:
          Sarcoidosis (`antigen_persistence_granuloma_chronicity_model`) and Chronic_Beryllium_Disease.
          The mouse scRNA-seq time course (GSE274766) and Visium spatial transcriptomics (GSE274767) recorded
          in this entry''s `datasets` block are the matched data most directly capable of addressing the
          cell-identity and spatial-organization components.'
      selected_evidence:
        snippet: At 24 h post-infection, robust immune infiltration is detected in the lung, marked by
          high levels of inflammatory PD-L1+ neutrophils and fungal-contact-dependent pro-fibrotic Spp1+
          macrophages.
        supports: SUPPORT
