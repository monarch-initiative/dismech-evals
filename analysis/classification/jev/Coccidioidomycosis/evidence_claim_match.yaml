      assertion_type: Pathophysiology
      assertion:
        name: Th1/Th17 cell-mediated adaptive immunity
        role: amplifier
        biological_scale: CELLULAR
        conforms_to: granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation
        description: 'Protective immunity against Coccidioides depends on robust Th1 and Th17 CD4+ T cell
          responses. IFN-gamma produced by Th1 cells activates macrophages to kill fungal organisms. IL-17
          from Th17 cells recruits neutrophils and supports mucosal immunity. The IL-12/IFN-gamma signaling
          axis is critical; genetic defects in IL12RB1, STAT4, or STAT3 impair these responses and increase
          susceptibility to severe disseminated disease. TNF-alpha is essential for granuloma formation
          and maintenance. Th2 skewing or immunosuppression (particularly TNF-alpha blockade) predisposes
          to dissemination. This is the coccidioidomycosis-specific substitution for the module''s Th1/TNF-driven
          macrophage recruitment and activation step: the cytokine-rich milieu that licenses the epithelioid
          and giant-cell transformations downstream.

          '
        genes:
        - preferred_term: STAT4
          term:
            id: hgnc:11365
            label: STAT4
        - preferred_term: STAT3
          term:
            id: hgnc:11364
            label: STAT3
        - preferred_term: IL12RB1
          term:
            id: hgnc:5971
            label: IL12RB1
        cell_types:
        - preferred_term: T-helper 1 cell
          term:
            id: CL:0000545
            label: T-helper 1 cell
        - preferred_term: T-helper 17 cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        - preferred_term: CD4-positive, alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        - preferred_term: macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: T-helper 1 type immune response
          term:
            id: GO:0042088
            label: T-helper 1 type immune response
        - preferred_term: T-helper 17 type immune response
          term:
            id: GO:0072538
            label: T-helper 17 type immune response
        - preferred_term: macrophage activation
          term:
            id: GO:0042116
            label: macrophage activation
          modifier: INCREASED
      selected_evidence:
        snippet: the host response to this organism is very effective at resolving the infection in most
          cases and immunizing to prevent second infections. People who are immunocompromised are much
          more likely to develop disseminated infection.
        supports: SUPPORT
