      assertion:
        hypothesis_group_id: granuloma_composition_containment_model
        hypothesis_label: Coccidioidal Granuloma Composition and Maintenance Model
        status: EMERGING
        description: 'A hypothesis about the cellular and signaling composition of the coccidioidal granuloma,
          and about which features of it determine containment versus progression to cavitation and dissemination.
          The model proposed here is that the spherule''s resistance to phagocytosis obliges a specific,
          sustained macrophage-transformation program - epithelioid differentiation and giant-cell fusion
          under Th1/Th17 and TNF drive - and that the identity of the recruited cells, the signals that
          maintain the structure, and the immune microenvironment inside the granuloma are what distinguish
          a contained lesion from one that necroses and disseminates.

          The status is EMERGING rather than CANONICAL because the intermediate steps are borrowed rather
          than measured. Granuloma biology in coccidioidomycosis is currently modeled largely by analogy
          to tuberculosis: morphologies have been described, but the cells recruited, the maintenance
          signals, and the interior microenvironment are explicitly unresolved in the primary literature.
          This entry''s conformance to the `granuloma_formation` module therefore rests on two causal
          edges (Th1/Th17 -> epithelioid transformation, and epithelioid transformation -> organized granuloma)
          whose evidence is PARTIAL for exactly this reason; those edges are tagged into this hypothesis
          group so the dependency is explicit rather than implied.

          Two comparators already in the knowledge base bear on the same question through the shared module:
          Sarcoidosis (`antigen_persistence_granuloma_chronicity_model`) and Chronic_Beryllium_Disease.
          The mouse scRNA-seq time course (GSE274766) and Visium spatial transcriptomics (GSE274767) recorded
          in this entry''s `datasets` block are the matched data most directly capable of addressing the
          cell-identity and spatial-organization components.'
      selected_evidence:
        snippet: we do not know what cells are recruited to the granuloma, what signals form and maintain
          the granuloma structure, nor details on the immune microenvironment within the granuloma interior
        supports: SUPPORT
