      assertion_type: Definition
      assertion:
        name: Clinical case definition
        definition_type: CASE_DEFINITION
        description: Coccidioidomycosis is a systemic fungal infection caused by inhalation of arthroconidia
          from the dimorphic soil fungi Coccidioides immitis or Coccidioides posadasii. The disease spectrum
          ranges from asymptomatic seroconversion (approximately half of infections) to acute self-limited
          pneumonia, chronic progressive pulmonary disease, or disseminated extrapulmonary infection involving
          skin, bones, joints, and meninges. Diagnosis is established by serologic testing (IgM and IgG
          antibodies, complement fixation titers), culture isolation of Coccidioides species, or histopathologic
          identification of characteristic spherules containing endospores in tissue specimens.
      selected_evidence:
        snippet: Coccidioidomycosis is a disease caused by soil fungi of the genus Coccidioides, divided
          genetically into Coccidioides immitis (California isolates) and Coccidioides posadasii (isolates
          outside California).
        supports: SUPPORT
