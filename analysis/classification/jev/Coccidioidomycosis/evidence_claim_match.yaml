        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: neutrophil_inflammasome_immunopathology_model
        hypothesis_label: Neutrophil and Inflammasome Immunopathology Model
        status: ALTERNATIVE
        description: 'The competing account of what determines outcome in coccidioidomycosis. Instead
          of outcome being set by the quality of the macrophage epithelioid/giant-cell containment program,
          this model holds that it is set by inflammasome-driven immunopathology: spherule rupture engages
          NLRP3 and pyrin inflammasomes, IL-1beta drives neutrophil recruitment, and the resulting neutrophilic
          response damages tissue and impairs the protective Th1/Th17 arm.

          It is registered as ALTERNATIVE rather than as a component of the granuloma model because two
          independent loss-of-function experiments run the opposite way to a protective reading: CXCR2-deficient
          mice have fewer neutrophils and *fewer* organisms with higher Ifng/Il17a, and caspase-1-deficient
          mice show improved tolerance at *equivalent* fungal burden. A model in which neutrophil influx
          and inflammasome signaling are protective effectors of containment does not predict either result.

          The two models are not mutually exclusive and share a trigger: both descend from the phagocytosis-resistant
          spherule, diverging at rupture. Where they make different predictions is the composition of
          the destructive lesion, and there the available human evidence favours this model - the wall
          of the established human cavity shows no granulomas, and its lining is neutrophils and caseous
          necrosis (PMID:24321524). Curated as ALTERNATIVE rather than promoted because the two decisive
          experiments are murine, the human evidence is descriptive pathology rather than perturbation,
          and the IL-1/IL-18 axis also has documented protective functions in this infection.'
      selected_evidence:
        snippet: IL-8R2-deficient mice had fewer neutrophils in infected lungs than controls, but unexpectedly
          the IL-8R2-deficient mice had fewer organisms in their lungs than the control mice.
        supports: SUPPORT
