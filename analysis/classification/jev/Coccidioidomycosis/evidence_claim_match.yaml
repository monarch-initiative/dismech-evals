          required to initiate and maintain the granuloma, so pharmacological TNF neutralization for an
          unrelated inflammatory indication removes the cytokine arm on which coccidioidal containment
          depends. This is the coccidioidomycosis instance of the granuloma-module drug pattern read in
          reverse: what is therapeutic in sterile granulomatous disease is a dissemination risk when a
          live, contained fungus is present.

          '
        effect: Predisposes to symptomatic and disseminated coccidioidomycosis.
      selected_evidence:
        snippet: Specific genetic variants, sex, and immune suppression by TNF inhibitors have been validated
          in later cohort studies, confirming the original hypotheses.
        supports: SUPPORT
