  246a8fa33b15a3841899ad025b53c18fb4b4c363a4ccc658dd3ef6212e38f6c0:
    claim:
      about:
        disease:
          name: Cockayne Syndrome
          disease_term:
            preferred_term: Cockayne syndrome
            term:
              id: MONDO:0016006
              label: Cockayne syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: Cockayne syndrome type A
        display_name: Cockayne syndrome type A (CSA / ERCC8)
        classification: molecular
        subtype_term:
          preferred_term: Cockayne syndrome type A
          term:
            id: MONDO:0019569
            label: Cockayne syndrome type 1
        description: 'The ERCC8/CSA complementation group, the smaller of the two. This row exists because
          Cockayne syndrome is subdivided on two independent axes that the literature and MONDO both label
          with numbers: a *molecular* axis (type A = ERCC8, type B = ERCC6) and a *clinical severity*
          axis (types I/II/III). The rows below carry the severity axis; this row and its type B sibling
          carry the molecular one. Assignment to a molecular group does not predict severity - the ERCC6
          cohort cited here spans CS I, CS II and CS III - so the two axes must not be collapsed.

          MONDO:0019569 is bound here rather than on the severity row named "type I" because MONDO''s
          own definition for it is gene-specific ("Cockayne syndrome caused by mutation(s) in the ERCC8
          gene") even though its label reads "type 1"; the gene claim belongs on the molecular row.'
        genes:
        - preferred_term: ERCC8
          term:
            id: hgnc:3439
            label: ERCC8
        inheritance:
        - name: Autosomal recessive
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: classically subdivided into three forms and characterized by a clinical spectrum without
          a clear genotype-phenotype correlation for both the two causative genes ERCC6 (CS type B) and
          ERCC8 (CS type A)
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38674442
      reference_title: 'Spectrum of ERCC6-Related Cockayne Syndrome (Type B): From Mild to Severe Forms.'
      evidence_source: HUMAN_CLINICAL
      explanation: States the gene-to-letter correspondence that defines this row (ERCC8 = CS type A)
        and, in the same sentence, that it does not predict the clinical form - the reason the molecular
        and severity axes are kept apart.
