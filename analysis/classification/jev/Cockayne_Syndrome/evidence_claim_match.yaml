        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: Cockayne syndrome type B
        frequency: VERY_FREQUENT
        notes: 'ERCC6 (CSB) is the major causative gene, accounting for approximately 75% of cases, and
          is associated with type B disease. CSB is an ATP-dependent chromatin remodeler that couples
          DNA repair to transcription.

          ERCC6 is allelic with two other conditions dismech curates separately, so this is not the only
          entry that binds it: `COFS_Syndrome` (the severe prenatal-onset end, which ClinGen scopes into
          one "Cockayne spectrum with or without cerebrooculofacioskeletal syndrome" assertion together
          with CS) and `UV-Sensitive_Syndrome` (the mild, photosensitivity-only end, which also binds
          ERCC8). No de Sanctis-Cacchione entry exists in kb/disorders.'
