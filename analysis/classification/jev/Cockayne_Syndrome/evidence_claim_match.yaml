              label: Cockayne syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Transcription-Coupled Nucleotide Excision Repair
        description: 'Pathogenic ERCC6/ERCC8 variants impair transcription-coupled nucleotide excision
          repair (TC-NER), disrupting removal of transcription-blocking DNA lesions in actively transcribed
          genes. TC-NER is initiated by stalling of elongating RNA polymerase complexes at damaged sites.
          Both causative genes act at this single node: CSB (ERCC6) is the ATP-dependent chromatin remodeler
          recruited to the stalled polymerase, and CSA (ERCC8) is the substrate-recognition subunit of
          the ubiquitin ligase that acts with it, so loss of either produces the same repair defect.'
        genes:
        - preferred_term: ERCC6
          term:
            id: hgnc:3438
            label: ERCC6
        - preferred_term: ERCC8
          term:
            id: hgnc:3439
            label: ERCC8
        biological_processes:
        - preferred_term: transcription-coupled nucleotide-excision repair
          term:
            id: GO:0006283
            label: transcription-coupled nucleotide-excision repair
      selected_evidence:
        snippet: A branch of the nucleotide excision repair (NER) pathway, transcription-coupled repair
          (TCR or TC-NER) specifically operates on the template DNA strand of actively transcribed genes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
