      assertion_type: Pathophysiology
      assertion:
        name: Abnormal ERK-RSK2-Sp1 transcriptional signaling
        description: RSK2 normally modulates ERK output. RSK2 deficiency leads to abnormally increased
          ERK1/2 activity with altered transcriptional control in neural cells.
        biological_processes:
        - preferred_term: MAPK cascade
          modifier: ABNORMAL
          term:
            id: GO:0000165
            label: MAPK cascade
        - preferred_term: Sp1-dependent regulation of transcription
          modifier: ABNORMAL
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: We show that Rsk2 silencing leads also to an elevation of ERK1/2 phosphorylation as well
          as of GluR2 expression and that the increased level of GluR2 expression results from the increased
          ERK1/2 activity on the transcription factor Sp1.
        supports: SUPPORT
