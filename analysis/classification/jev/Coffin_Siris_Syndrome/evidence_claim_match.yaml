        description: ARID1A haploinsufficiency impairs ARID1A-BAF binding at enhancers of epithelial-to-mesenchymal
          transition (EMT) genes, disrupts ZIC2 occupancy at these enhancers, and impairs delamination/migration
          of cranial neural crest cells. Conserved BAF complex activity (via BAF155/BAF170) is also required
          during murine neural crest development for correct craniofacial, pharyngeal arch and outflow
          tract formation. Failure of cranial neural crest specification underlies coarse facial dysmorphism,
          micrognathism, and other craniofacial features of CSS.
        genes:
        - preferred_term: ARID1A
