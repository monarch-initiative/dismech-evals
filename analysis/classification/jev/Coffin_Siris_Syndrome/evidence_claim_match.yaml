      assertion:
        name: Limb skeletal patterning defect from SOXC and BAF dysfunction
        description: SOX11 and its SOXC paralogs (SOX4/SOX12) are required in limb mesenchyme for growth
          plate formation and skeletal elongation through noncanonical Wnt/PCP signaling. SoxC deletion
          in limb bud skeletogenic mesenchyme abolishes growth plate formation and produces severely shortened
          skeletal elements. SOX11 also positively regulates GDF5 in the joint interzone, contributing
          to joint and digit development. CSS-causing SOX11 variants therefore plausibly underlie the
          signature distal phalanx and fifth-digit hypoplasia, complementing the broader BAF-complex requirement
          for skeletal differentiation.
        genes:
