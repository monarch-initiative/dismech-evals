              label: Autosomal dominant inheritance
        description: 'The SMARCA4-related form of Coffin-Siris syndrome, corresponding to OMIM 614609.
          SMARCA4 encodes BRG1, the catalytic ATPase subunit of the BAF/PBAF chromatin-remodelling complex
          - so this is the subtype in which the motor of the complex is damaged rather than one of its
          scaffolding or targeting subunits.

          The subtype carries two names for one concept, and the second name is the informative one. MONDO''s
          primary label is "intellectual disability, autosomal dominant 16" (MRD16); its synonyms include
          "Coffin-Siris syndrome 4" and "SMARCA4-related BAFopathy"; and its definition is explicitly
          "any Coffin-Siris syndrome in which the cause of the disease is a mutation in the SMARCA4 gene".
          The MRD16 label exists because a substantial fraction of SMARCA4 patients come to attention
          as non-syndromic intellectual disability or autism rather than as classic Coffin-Siris syndrome:
          in one series of eight children with novel SMARCA4 missense variants, all had moderate to severe
          intellectual disability and seven had autistic or likely-autistic features, while being *less*
          likely than published Coffin-Siris patients to show the craniofacial or finger and toe anomalies.
          Reading MRD16 as a separate disease from Coffin-Siris syndrome would split one gene''s phenotypic
          range in two along an ascertainment line.

          Genotype-phenotype, stated with the hedge the sources put on it. SMARCA4 variants in Coffin-Siris
          syndrome were originally all non-truncating - missense or in-frame deletion - which is the variant
          class this subtype was defined on, and which distinguishes it from the germline loss-of-function
          SMARCA4 alleles that cause rhabdoid tumour predisposition syndrome 2. That distinction has since
          softened: a 15-patient SMARCA4 registry cohort included two individuals with nonsense variants
          who had milder learning and behavioural differences and no organ-system involvement. At the
          level of gene families rather than individual alleles, SMARC-related Coffin-Siris patients have
          been proposed to have more severe organ-related complications than ARID-related patients - but
          the same study that reports that correlation concludes that everyone with a BAF-related condition
          is at risk of most of the phenotype and that surveillance should be broad. The correlation is
          a tendency, not a triage rule.'
      selected_evidence:
        snippet: 'The diagnosis of CSS is established in a proband with suggestive findings and a heterozygous
          pathogenic variant in one of the following 14 known genes identified by molecular genetic testing:
          ARID1A, ARID1B, ARID2, BICRA, DPF2, PHF6, SMARCA2, SMARCA4, SMARCB1, SMARCC2, SMARCD1, SMARCE1,
          SOX4, or SOX11.'
        supports: SUPPORT
        directness: DIRECT
