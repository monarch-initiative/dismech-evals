        context:
        - path: /pathophysiology/10
          value:
            name: Limb skeletal patterning defect from SOXC and BAF dysfunction
            description: SOX11 and its SOXC paralogs (SOX4/SOX12) are required in limb mesenchyme for
              growth plate formation and skeletal elongation through noncanonical Wnt/PCP signaling. SoxC
              deletion in limb bud skeletogenic mesenchyme abolishes growth plate formation and produces
              severely shortened skeletal elements. SOX11 also positively regulates GDF5 in the joint
              interzone, contributing to joint and digit development. CSS-causing SOX11 variants therefore
              plausibly underlie the signature distal phalanx and fifth-digit hypoplasia, complementing
              the broader BAF-complex requirement for skeletal differentiation.
            genes:
            - preferred_term: SOX11
              term:
                id: hgnc:11191
                label: SOX11
            - preferred_term: SOX4
              term:
                id: hgnc:11200
                label: SOX4
            cell_types:
            - preferred_term: chondrocyte
              term:
                id: CL:0000138
                label: chondrocyte
            - preferred_term: skeletal mesenchymal cell
              term:
                id: CL:0000134
                label: mesenchymal stem cell
            locations:
            - preferred_term: limb
              term:
                id: UBERON:0002101
                label: limb
            biological_processes:
            - preferred_term: skeletal system development
              term:
                id: GO:0001501
                label: skeletal system development
            - preferred_term: chondrocyte differentiation
              term:
                id: GO:0002062
                label: chondrocyte differentiation
            - preferred_term: planar cell polarity pathway involved in axis elongation
              term:
                id: GO:0060071
                label: Wnt signaling pathway, planar cell polarity pathway
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Hypoplastic fifth fingernail
        description: Disrupted SOXC-driven growth plate formation and joint patterning, combined with
          BAF-dependent skeletal differentiation defects, plausibly underlie the distal phalangeal hypoplasia
          and fifth-digit nail anomalies that are the signature physical feature of CSS.
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        intermediate_mechanisms:
        - Disrupted SOXC-driven Wnt/PCP signaling in limb mesenchyme
        - Impaired growth plate formation
        - Disrupted GDF5-dependent joint formation
      selected_evidence:
        snippet: SoxC(Prx1Cre) mice, which deleted SoxC genes in limb bud skeletogenic mesenchyme, were
          born with tiny appendicular cartilage primordia because of failure to form growth plates.
        supports: SUPPORT
