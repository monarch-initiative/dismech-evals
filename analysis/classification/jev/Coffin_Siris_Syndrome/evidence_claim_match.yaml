        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
        description: The ARID2-related form of Coffin-Siris syndrome, corresponding to OMIM 617808. ARID2
          is a PBAF-specific subunit - an intrinsic component of the polybromo brahma-associated factor
          SWI/SNF subcomplex - so this is a subtype in which a targeting subunit of the complex is damaged
          rather than its catalytic ATPase, which is the CSS4 lesion. The mechanism is loss of function
          through truncating variants, mostly de novo. ARID2 is already curated in this entry's `genetic:`
          block, where it is recorded as a less frequent CSS gene with a somewhat milder but still recognisably
          classic phenotype and a higher rate of hip dysplasia; this row adds the MONDO subtype identity
          that the gene record did not carry. ClinGen classifies the gene-disease relationship as Definitive
          against Coffin-Siris syndrome itself (MONDO:0015452).
      selected_evidence:
        snippet: 'The majority of variants are de novo , although in at least one individual the variant
          was inherited from a mildly affected mother (PMID: 35813374).'
        supports: SUPPORT
