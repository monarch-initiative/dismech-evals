  294aa52aee498257cca35f9e6451a412c1f7aec26b483dd16fc0fa69ec126f95:
    claim:
      about:
        disease:
          name: Cogan Syndrome
          disease_term:
            preferred_term: Cogan syndrome
            term:
              id: MONDO:0015453
              label: Cogan syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Molecular mimicry and autoantibody generation
        description: The proposed initiating mechanism is post-infectious molecular mimicry. An immunodominant
          peptide recognized by IgG from Cogan syndrome patients shares sequence similarity with the reovirus
          III major core protein and the SSA/Ro autoantigen, breaking immune tolerance and generating
          autoantibodies that cross-react with inner-ear and endothelial self-antigens (including CD148/DEP-1
          and connexin 26). Infection may contribute, but autoimmunity is regarded as the primary driver;
          the pathogenesis remains incompletely defined.
        biological_processes:
        - preferred_term: immunoglobulin production
          term:
            id: GO:0002377
            label: immunoglobulin production
          modifier: DYSREGULATED
        - preferred_term: adaptive immune response
          term:
            id: GO:0002250
            label: adaptive immune response
          modifier: DYSREGULATED
      selected_evidence:
        snippet: We identified an immunodominant peptide that shows similarity with autoantigens such
          as SSA/Ro and with the reovirus III major core protein
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
