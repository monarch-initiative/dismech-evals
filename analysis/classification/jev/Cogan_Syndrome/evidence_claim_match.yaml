        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Autoantibodies bind CD148 on inner ear sensory epithelium and endothelial cells
        description: Autoantibodies recognize CD148/DEP-1 expressed on inner ear sensory epithelium and
          endothelial cells.
        cell_types:
        - preferred_term: sensory epithelial cell
          term:
            id: CL:0000098
            label: sensory epithelial cell
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        notes: 'Anti-CD148/DEP-1 autoantibodies were characterised in a research setting: purified patient
          IgG inhibited proliferation of DEP-1/CD148-expressing cells and passive transfer reproduced
          features of Cogan syndrome in mice, establishing pathogenic potential. Despite promising research-stage
          diagnostic performance, anti-CD148 antibody testing is not routinely available and is not part
          of the standard diagnostic workup; diagnosis of Cogan syndrome remains clinical and exclusionary.
          This biomarker is therefore represented here as pathophysiology rather than as a clinical diagnostic
          test.'
      selected_evidence:
        snippet: The peptide sequence shows similarity also with the cell-density enhanced protein tyrosine
          phosphatase-1 (DEP-1/CD148), which is expressed on the sensory epithelia of the inner ear and
          on endothelial cells.
        supports: SUPPORT
