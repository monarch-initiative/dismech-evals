      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: molecular_mimicry_postinfectious
        hypothesis_label: Post-infectious molecular mimicry model
        status: EMERGING
        description: 'The leading model holds that an antecedent infection triggers an autoimmune response
          via molecular mimicry: an immunodominant peptide recognized by patient IgG shares sequence similarity
          with the reovirus III major core protein and the SSA/Ro autoantigen, generating autoantibodies
          that cross-react with inner-ear and endothelial self-antigens (CD148/DEP-1, connexin 26) and
          drive tissue injury.'
        notes: Status EMERGING because the pathogenesis is described in the literature as unknown; the
          mimicry epitope and animal passive-transfer data are the strongest mechanistic support but a
          definitive infectious trigger is unproven. The trigger-level downstream edges on the "Molecular
          mimicry and autoantibody generation" pathophysiology node opt into this hypothesis group.
      selected_evidence:
        snippet: We identified an immunodominant peptide that shows similarity with autoantigens such
          as SSA/Ro and with the reovirus III major core protein
        supports: SUPPORT
