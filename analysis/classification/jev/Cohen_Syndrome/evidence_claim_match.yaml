      assertion_type: IUISAssignment
      assertion:
        classification_value: phagocyte defect
        notes: 'IUIS 2022 phenotypic classification (Tangye et al., PMID:35748970), Table 5 "Congenital
          defects of phagocyte number or function", section 1 (Congenital Neutropenias): row "Cohen syndrome
          VPS13B AR 607817", affected cells N, affected function myeloid differentiation, associated features
          dysmorphism, mental retardation, obesity, deafness and neutropenia.

          Scope: iuis_category is single-valued, so this tag records that Cohen syndrome occupies a Table
          5 row, not that it is primarily an inborn error of immunity. The mild-to-moderate neutropenia
          present in almost all affected individuals — curated here as the Neutropenia phenotype — is
          what puts it in the phagocyte table; the entry is otherwise curated as a Golgi-membrane intellectual-disability
          syndrome, and the mechanism linking VPS13B loss to the neutropenia is not established (see that
          phenotype''s own notes).'
      selected_evidence:
        snippet: Cohen syndrome VPS13B AR 607817
        supports: SUPPORT
