  14328d3e6c8f97743add900eb19719ad8afc4782fb038ff4b31033dac054bbb4:
    claim:
      about:
        disease:
          name: Cohen Syndrome
          disease_term:
            preferred_term: Cohen syndrome
            term:
              id: MONDO:0008999
              label: Cohen syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Adipocyte Insulin-Response Dysregulation
        description: A tissue-specific branch explaining the syndrome's most counterintuitive feature
          - truncal obesity appearing in the early teens without any increase in appetite or intake. Loss
          of VPS13B in pre-adipocytes and in patient fibroblasts accelerates adipogenic differentiation
          through an increased response to insulin stimulation; the resulting fat cells then show reduced
          AKT2 phosphorylation after insulin, i.e. insulin resistance. This makes the obesity a cell-intrinsic
          adipocyte phenotype rather than a hypothalamic appetite phenotype, and grounds the increased
          type 2 diabetes risk.
        role: effector
        biological_scale: CELLULAR
      selected_evidence:
        snippet: In both models, VPS13B invalidation led to accelerated differentiation into fat cells,
          which was confirmed by the earlier and increased expression of specific adipogenic genes, consequent
          to the increased response of cells to insulin stimulation.
        supports: SUPPORT
    origin:
