  20c1b0000159ee396049fe6c2d05bb0e66ac354181ea28db105a6694bd7ffb7c:
    claim:
      about:
        disease:
          name: Cohen Syndrome
          disease_term:
            preferred_term: Cohen syndrome
            term:
              id: MONDO:0008999
              label: Cohen syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Golgi Membrane Expansion and Integrity
        description: VPS13B is concentrated at the interface between cis and trans Golgi sub-compartments,
          where its lipid-transport activity is thought to supply membrane for Golgi expansion. In VPS13B-null
          cells, re-formation of the Golgi complex after Brefeldin A-induced disruption is delayed - a
          direct functional demonstration that the organelle depends on VPS13B. The same delay follows
          loss of FAM177A1, a VPS13B interactor whose own mutations also cause a developmental disorder,
          and the two genes interact genetically in zebrafish.
        role: central_effector
        biological_scale: CELLULAR
        cellular_components:
        - preferred_term: Golgi apparatus
          term:
            id: GO:0005794
            label: Golgi apparatus
      selected_evidence:
        snippet: Here we show that VPS13B is localized at the interface between cis and trans Golgi sub-compartments
          and that Golgi complex re-formation after Brefeldin A (BFA) induced disruption is delayed in
          VPS13B KO cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38187698
      reference_title: VPS13B is localized at the cis-trans Golgi complex interface and is a functional
        partner of FAM177A1.
      evidence_source: IN_VITRO
      explanation: 'The core mechanistic observation: precise sub-Golgi localisation plus a functional
        deficit in Golgi re-formation when VPS13B is absent.'
