        name: Prader-Willi syndrome
        description: 'The principal differential for the combination of infantile hypotonia, poor early
          feeding, intellectual disability and later truncal obesity. The discriminator is appetite: in
          Cohen syndrome the teenage weight gain occurs without any change in appetite or food intake,
          whereas Prader-Willi obesity is driven by hyperphagia. Neutropenia and retinal dystrophy also
          point to Cohen syndrome.'
      selected_evidence:
