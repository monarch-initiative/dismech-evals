            term:
              id: MONDO:0008999
              label: Cohen syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Glycosylation and Secretory Output
        description: 'Golgi dysfunction impairs the glycosylation and secretory processing that the organelle
          performs. Because every affected tissue depends on Golgi-dependent processing, this is the step
          that converts a single lipid-transport defect into a multisystem phenotype spanning brain, retina
          and marrow. No cell type is bound to this node: the sources cited here establish the glycosylation
          defect but not the mechanism linking it to any particular lineage, and in particular the route
          from Golgi dysfunction to the near-universal neutropenia is not established, so neutropenia
          is curated as a phenotype rather than as a mechanistic claim at this node.'
        role: effector
        biological_scale: CELLULAR
      selected_evidence:
        snippet: Cohen Syndrome (CS) is a rare autosomal recessive disorder, with defective glycosylation
          secondary to mutations in the VPS13B gene, which encodes a protein of the Golgi apparatus.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26358774
      reference_title: Insulin response dysregulation explains abnormal fat storage and increased risk
