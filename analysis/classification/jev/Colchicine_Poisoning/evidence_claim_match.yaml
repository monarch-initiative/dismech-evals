              are arrested. This is the step that makes colchicine poisoning lethal rather than merely
              severe, and it is why the second phase of the illness is the dangerous one even when the
              patient looks better than they did on day one.
            role: central_effector
            biological_scale: TISSUE
            conforms_to: myelosuppression#Bone Marrow Hematopoietic Suppression
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Multilineage Peripheral Cytopenias
        causal_link_type: DIRECT
        description: Marrow failure shows in the blood as the existing circulating cells are consumed
          and not replaced, so the cytopenia lags the marrow injury by roughly the lifespan of each lineage.
      selected_evidence:
        snippet: A 19-year-old man developed pancytopenia four days after ingestion of approximately 50-60
          0.6-mg colchicine tablets in a suicide attempt.
        supports: SUPPORT
