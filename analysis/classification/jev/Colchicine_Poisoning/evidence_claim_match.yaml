  73bcf773579cf8b73aca77d73f37829d037f77f162751108ca6db77d8d5bd574:
    claim:
      about:
        disease:
          name: Colchicine Poisoning
          disease_term:
            preferred_term: colchicine poisoning
            term:
              id: MONDO:0017859
              label: colchicine poisoning
        context: []
      assertion_type: Environmental
      assertion:
        name: Ingestion of a colchicine-containing plant
        description: Colchicine is a plant alkaloid, and poisoning also follows eating the plant that
          makes it - autumn crocus (Colchicum autumnale) or glory lily (Gloriosa superba). This route
          is not a medication error and does not involve a prescription at all, so nothing about drug
          interactions or renal clearance predicts it. The exposure history has to ask for it separately,
          which is why the diagnostic entry above names plants as a third history to take.
        exposure_term:
          preferred_term: exposure to colchicine-containing plant material
          term:
            id: ECTO:9000271
            label: exposure to alkaloid
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
          exposure_route:
          - classification_value: ORAL
          exposure_duration:
          - classification_value: ACUTE
        notes: Bound to ECTO:9000271 exposure to alkaloid rather than to ECTO:0000509 exposure to drug,
          because this route is not a medicinal exposure. Neither term is colchicine-specific; ECTO has
          no such class through this repository's adapter. The cited sources establish the plants as the
          source, the route as a recognised exposure history, and a case fatality of 10 percent in a 297-patient
          Gloriosa superba cohort. That figure is a population rate from one country's self-poisoning
          presentations and should not be read as a case fatality for plant ingestion generally.
      selected_evidence:
        snippet: Gloriosa superba is a flowering plant that contains colchicine. Deliberate self-poisoning
          with this plant in Sri Lanka is common and potentially fatal.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/1
