              label: colchicine poisoning
        context: []
      assertion_type: Environmental
      assertion:
        name: Colchicine exposure above the therapeutic window
        description: 'Exposure by two routes that differ in tempo but not in mechanism: an acute ingestion
          in self-harm or in error, and slow accumulation at prescribed doses when clearance falls. The
          second route is the one that catches clinicians out, because the prescription is correct and
          the patient is poisoned anyway.'
        exposure_term:
          preferred_term: exposure to colchicine
          term:
            id: ECTO:0000509
            label: exposure to drug
        exposure_classifications:
          hazard_agent_type:
          - classification_value: CHEMICAL
          exposure_route:
          - classification_value: ORAL
        notes: Bound to ECTO:0000509 exposure to drug, which is correct for this entry because this entry
          is the medicinal route. ECTO was searched through this repository's own adapter (sqlite:obo:ecto)
          for a colchicine-specific exposure class and none exists. ECTO:9000271 exposure to alkaloid
          also resolves; it is used on the plant-ingestion entry below rather than here, since that route
          is not a drug exposure. A term resolving in OLS would not be sufficient in either case, because
          dismech does not validate ECTO against OLS.
      selected_evidence:
        snippet: Renal and hepatic dysfunction and medications that inhibit cytochrome P450 3A4 isozyme
          (CYP3A4) and P-glycoprotein (P-gp) appear to be the most significant risk factors.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36512928
      reference_title: 'Systematic review of colchicine neuromyopathy: Risk factors, duration and resolution.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the accumulation route - impaired clearance and interacting drugs - as
        the dominant risk setting for toxicity at ordinary doses.
