            name: Microtubule-Dependent Intracellular Transport Failure
            description: Loss of the microtubule tracks on which intracellular cargo moves. In muscle
              and in long peripheral axons this matters more than mitosis does, because those cells are
              post-mitotic and depend on transport over distances no other mechanism can cover. This arm
              is slower than the marrow arm and is what dominates the chronic-accumulation route.
            role: intermediate
            biological_scale: CELLULAR
            conforms_to: peripheral_axonal_degeneration#Axonal Transport Impairment and Mitochondrial
              Dysfunction
            biological_processes:
            - preferred_term: microtubule-based transport
              term:
                id: GO:0099111
                label: microtubule-based transport
              modifier: DECREASED
            notes: 'Conformance to the module''s axonal-transport node is asserted on the transport arm
              only. The module node also carries mitochondrial dysfunction; this entry makes no mitochondrial
              claim for colchicine, because none of the cited human sources reports one. Note also the
              direction of the evidence here: the cited statements are about microtubule function in general,
              and the specifically axonal reading is inference from the clinical neuropathy, not a direct
              measurement of axonal transport in a poisoned patient.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Colchicine Neuromyopathy
        causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
        description: Transport failure in myocytes and in peripheral axons produces the vacuolar myopathy
          and the accompanying axonal neuropathy. The intermediates - lysosomal accumulation in the vacuolar
          myopathy, distal axonal degeneration in the neuropathy - are described in the clinical literature,
          so the link is not direct.
      selected_evidence:
        snippet: Definitive diagnosis usually requires histologic examination where a characteristic vacuolar
          myopathy is typically present.
        supports: SUPPORT
