              id: MONDO:0017859
              label: colchicine poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Colchicine Neuromyopathy
        description: Proximal myopathy with elevated creatine kinase, accompanied in about half of reported
          cases by a peripheral neuropathy. It is characteristically insidious, arises at ordinary therapeutic
          doses rather than in overdose, and resolves on stopping the drug - which is what separates it
          from the acute poisoning syndrome and makes recognising it worthwhile.
        role: outcome
        biological_scale: TISSUE
        conforms_to: peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination
        notes: Conformance is asserted at the level of a toxic peripheral neuromyopathy reaching the module's
          degeneration node. The module node names axonal degeneration and demyelination; the sources
          cited here establish a colchicine-associated neuropathy co-occurring with myopathy but do not
          themselves classify the fibre pathology, and the predominant finding in the systematic review
          is myopathic rather than neuropathic. The conformance should be read as partial on that basis.
      selected_evidence:
        snippet: Most of these cases presented with features of both neuropathy and myopathy
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36512928
