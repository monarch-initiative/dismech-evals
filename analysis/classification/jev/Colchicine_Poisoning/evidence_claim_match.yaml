      assertion_type: Diagnosis
      assertion:
        name: Clinical recognition from exposure history and toxidrome
        description: 'The diagnosis is made by putting an exposure history against a characteristic toxidrome.
          Both halves are needed - the toxidrome alone reads as gastroenteritis with shock, which is why
          the poisoning is missed in its first phase. The history must reach for three routes, not one:
          tablets, parenteral administration, and ingestion of colchicine-containing plants. Plasma colchicine
          concentration is measurable and strongly predicts death, but it is a prognostic measurement
          in a research cohort rather than a routinely available diagnostic test, and this entry does
          not curate it as one.'
      selected_evidence:
        snippet: Colchicine poisoning should be suspected in patients with access to the drug and the
          typical toxidrome (gastroenteritis, hypotension, lactic acidosis, and prerenal azotemia).
        supports: SUPPORT
