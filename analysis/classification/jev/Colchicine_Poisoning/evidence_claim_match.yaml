      assertion_type: ProgressionInfo
      assertion:
        phase: Chronic-accumulation neuromyopathy
        duration: median 21 days to resolution after the drug is stopped
        notes: A separate time course belonging to the chronic route rather than to acute overdose. The
          systematic review found a mean total daily dose of 1.25 mg - that is a therapeutic dose - and
          48 percent had been taking colchicine for more than twelve months before the neuromyopathy declared.
          Stopping the drug resolved symptoms completely in 70 percent, at a median of 21 days.
      selected_evidence:
        snippet: Cessation of colchicine generally led to complete resolution of symptoms in 70% of cases
          within a median of 21 days.
        supports: SUPPORT
