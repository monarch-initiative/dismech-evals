      assertion_type: Pathophysiology
      assertion:
        name: Hepatic and Renal Injury
        description: 'Injury to the two organs that clear colchicine. This node matters less for the organ
          failure it names than for what it does to the rest of the pathograph: hepatic elimination carries
          most of the drug''s clearance, so damaging the liver slows removal of the poison doing the damage.
          The loop is why late presentation and pre-existing hepatic or renal impairment carry a worse
          prognosis.'
        role: intermediate
        biological_scale: TISSUE
        cell_types:
