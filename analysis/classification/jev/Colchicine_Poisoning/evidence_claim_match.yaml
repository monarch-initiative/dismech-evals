        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Colchicine-Tubulin Binding and Microtubule Assembly Failure
        description: Colchicine binds tubulin dimers in roughly equimolar fashion and prevents them polymerising
          into microtubules. This is the same binding that makes the drug therapeutic at low dose, and
          the entire toxicity is a continuation of it - not a separate off-target effect. Microtubules
          serve both the mitotic spindle and intracellular transport, which is why one lesion produces
          two clinically distinct syndromes.
        role: central_effector
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: tubulin binding
          term:
            id: GO:0015631
            label: tubulin binding
        biological_processes:
        - preferred_term: microtubule polymerization
          term:
            id: GO:0046785
            label: microtubule polymerization
          modifier: DECREASED
      selected_evidence:
        snippet: Colchicine's toxicity is an extension of its mechanism of action - binding to tubulin
          and disrupting the microtubular network.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:20586571
      reference_title: 'Colchicine poisoning: the dark side of an ancient drug.'
