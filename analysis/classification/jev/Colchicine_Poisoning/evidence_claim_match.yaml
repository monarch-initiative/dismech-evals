              label: colchicine poisoning
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Colchicine Clearance via CYP3A4 and P-Glycoprotein Inhibition
        description: Colchicine is metabolised by CYP3A4 and effluxed by P-glycoprotein, so a drug that
          inhibits either raises the concentration reached at an unchanged prescribed dose. Renal or hepatic
          impairment does the same thing by a different route. This is the mechanism behind the toxicity
          that appears at ordinary doses, and it is the reason a patient can be poisoned without ever
          taking an overdose.
        role: modifier
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: CYP3A4-mediated colchicine oxidation
          term:
            id: GO:0004497
            label: monooxygenase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: P-glycoprotein-mediated colchicine efflux
          term:
            id: GO:0042908
            label: xenobiotic transport
          modifier: DECREASED
        notes: Modelled as a modifier feeding the exposure node rather than as a second trigger, because
          the interaction does not injure anything by itself - it acts entirely by raising the concentration
          the patient reaches.
      selected_evidence:
        snippet: Colchicine is metabolized to 2- and 3-demethylcolchicine by the CYP 3A4 isoform of cytochrome
          P450 in hepatocytes, followed by biliary excretion
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36028733
      reference_title: Progress in the management of acute colchicine poisoning in adults.
      evidence_source: OTHER
      explanation: Establishes CYP3A4 as the metabolic route whose inhibition raises exposure.
