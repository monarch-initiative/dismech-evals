        name: Recognition of colchicine neuromyopathy
        description: A different diagnostic problem from the acute poisoning. The patient is on a correct
          prescription, the onset is insidious, and the available tests do not settle it. Recognition
          matters because stopping the drug resolved symptoms completely in 70 percent of reviewed cases,
          so the cost of missing it is weakness that need not have continued. Nearly half of the reviewed
          patients had been taking colchicine for over a year before the neuromyopathy was recognised.
      selected_evidence:
        snippet: The symptoms of this disorder are frequently insidious, and the diagnostic tests used
          in its evaluation are mostly nonspecific.
        supports: SUPPORT
