          lesion, keeping the patient alive through the cytopenic window is the whole of the treatment.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Supportive Care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: 'Colchicine-specific Fab fragments are not curated as a treatment of this disease because
          they are not commercially available, per the cited systematic review. Extracorporeal removal
          is likewise not curated as a means of clearing the drug: the volume of distribution cited above
          makes colchicine a poor dialysis candidate, and the renal replacement therapy used in the reported
          cases was for the acute kidney injury rather than for drug removal.'
      selected_evidence:
        snippet: Although a specific experimental treatment (Fab fragment antibodies) for colchicine poisoning
          has been used, it is not commercially available.
        supports: SUPPORT
