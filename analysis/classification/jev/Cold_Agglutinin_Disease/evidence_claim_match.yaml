          value:
            name: Cold exposure of the acral circulation
            description: Ambient cooling of the peripheral circulation is the proximate trigger for the
              antibody-binding step of this disease. The monoclonal IgM binds the I antigen only below
              core temperature, so the fingers, toes, ears and nose — which run several degrees cooler
              than the trunk — are where agglutination and complement fixation begin. Cold avoidance and
              thermal protection are the corresponding non-pharmacological management, and are sometimes
              sufficient. Cold exposure triggers the agglutination and circulatory limb; it does not explain
              the year-round hemolysis, which continues at core temperature once complement has been fixed.
            exposure_term:
              preferred_term: exposure to decreased ambient temperature
              term:
                id: ECTO:0001057
                label: exposure to decreased temperature
            effect: Triggers erythrocyte agglutination and cold-induced circulatory symptoms.
            notes: The climate gradient in the multinational cohort is an association between ambient
              temperature and diagnosed disease; the authors do not establish whether it reflects true
              incidence, symptom-driven ascertainment, or both.
          role: ancestor
      assertion_type: EnvironmentalMechanismTarget
      assertion:
        target: Cold-Dependent Erythrocyte Agglutination
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: Cooling of peripheral blood below the antibody's thermal amplitude is what permits
          the IgM to bind the I antigen and cross-link red cells.
      selected_evidence:
        snippet: In CAD, immunoglobulin M (IgM) autoantibodies (cold agglutinins) preferentially bind
          to the “I” antigen on erythrocytes at temperatures ≤37°C and may result in erythrocyte agglutination.
