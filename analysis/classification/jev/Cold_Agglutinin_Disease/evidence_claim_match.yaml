  457aa28938fd5cee7311395c47916cad4f6324374d746249bae5623d3f8de503:
    claim:
      about:
        disease:
          name: Cold Agglutinin Disease
          disease_term:
            preferred_term: Primary cold agglutinin disease
            term:
              id: MONDO:0018922
              label: cold agglutinin disease
        context: []
      assertion_type: Environmental
      assertion:
        name: Cold exposure of the acral circulation
        description: Ambient cooling of the peripheral circulation is the proximate trigger for the antibody-binding
          step of this disease. The monoclonal IgM binds the I antigen only below core temperature, so
          the fingers, toes, ears and nose — which run several degrees cooler than the trunk — are where
          agglutination and complement fixation begin. Cold avoidance and thermal protection are the corresponding
          non-pharmacological management, and are sometimes sufficient. Cold exposure triggers the agglutination
          and circulatory limb; it does not explain the year-round hemolysis, which continues at core
          temperature once complement has been fixed.
        exposure_term:
          preferred_term: exposure to decreased ambient temperature
          term:
            id: ECTO:0001057
            label: exposure to decreased temperature
        effect: Triggers erythrocyte agglutination and cold-induced circulatory symptoms.
        notes: The climate gradient in the multinational cohort is an association between ambient temperature
          and diagnosed disease; the authors do not establish whether it reflects true incidence, symptom-driven
          ascertainment, or both.
      selected_evidence:
        snippet: For the first time, we demonstrate fourfold differences between cold and warmer climates
          regarding prevalence (20 vs 5 cases/million) and incidence (1.9 vs 0.48 cases/million per year).
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32374875
      reference_title: 'Cold agglutinin disease revisited: a multinational, observational study of 232
        patients.'
      evidence_source: HUMAN_CLINICAL
      explanation: A fourfold difference in prevalence and incidence between cold and warm climates is
        population-level evidence that ambient temperature shapes who is diagnosed with this disease.
