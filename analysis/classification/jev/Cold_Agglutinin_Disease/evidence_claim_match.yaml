              back to core temperature the IgM dissociates, but the covalently bound C3b does not — which
              is why the direct antiglobulin test in CAD is strongly positive for C3d (the degradation
              remnant of C3b) and negative or only weakly positive for IgG. The opsonized cell is now
              marked for phagocytic clearance and, if the cascade continues, for terminal-pathway lysis.
            biological_scale: MOLECULAR
            biological_processes:
            - preferred_term: C3b opsonization of the erythrocyte membrane
              term:
                id: GO:0008228
                label: opsonization
              modifier: INCREASED
