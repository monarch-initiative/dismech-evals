      assertion:
        name: Strict WHO-HAEM5 CAD-LPD Morphology Is Met by a Minority
        description: The WHO-HAEM5 morphological description of CAD-LPD is a desirable rather than an
          essential criterion, and in practice most CAD marrows do not meet it in full even when clonality
          is demonstrable by other means. Treating the strict morphological picture as a diagnostic requirement
          would therefore misclassify the majority of genuine cases, which is why sensitive ancillary
          techniques are recommended alongside morphology.
        diagnostic: false
      selected_evidence:
        snippet: Surprisingly, while ancillary methods detected clonality in the majority (84%), only
          5 (11%) of 45 CAD cases strictly fulfilled the WHO-HAEM5 morphological description for CAD-LPD.
        supports: SUPPORT
