      assertion_type: DifferentialDiagnosis
      assertion:
        name: Paroxysmal cold hemoglobinuria
        description: A separate cold-reactive, complement-dependent hemolytic anemia mediated by a biphasic
          IgG Donath-Landsteiner antibody with anti-P specificity, causing predominantly intravascular
          hemolysis. Classically post-viral and self-limiting in children.
        distinguishing_features:
        - Biphasic IgG Donath-Landsteiner antibody rather than a monoclonal IgM agglutinin
        - Predominantly intravascular rather than hepatic extravascular hemolysis
      selected_evidence:
        snippet: Complement activation plays a definitive but limited role in warm-antibody AIHA (w-AIHA),
          whereas primary cold agglutinin disease (CAD), secondary cold agglutinin syndrome (CAS), and
          paroxysmal cold hemoglobinuria (PCH) are entirely complement-dependent disorders. The details
          of complement involvement differ among these subtypes.
        supports: SUPPORT
    origin:
