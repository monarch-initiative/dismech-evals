      assertion_type: Pathophysiology
      assertion:
        name: Monoclonal IgM Cold Agglutinin Production
        description: 'The secreted paraprotein is a monoclonal IgM, kappa-restricted in about 94% of patients
          and encoded by IGHV4-34 with somatic hypermutation, whose variable region recognises the carbohydrate
          blood-group antigen I on the erythrocyte surface. Binding is temperature-dependent: affinity
          is maximal well below 37 degrees Celsius, and the thermal amplitude — the highest temperature
          at which the antibody still agglutinates — rather than the titre alone determines whether an
          individual cold agglutinin is pathogenic in vivo.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: cold-dependent binding of IgM to the erythrocyte I antigen
          term:
            id: GO:0003823
            label: antigen binding
        biological_processes:
        - preferred_term: monoclonal IgM production by the CAD clone
          term:
            id: GO:0002377
            label: immunoglobulin production
          modifier: INCREASED
      selected_evidence:
        snippet: Primary chronic cold agglutinin disease is a rare hemolytic disease mediated by monoclonal
          IGHV4-34-encoded cold agglutinins with a predominant specificity for the blood group antigen
          I.
        supports: SUPPORT
