        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Cold agglutinin syndrome (secondary)
        description: 'Cold agglutinins arising secondary to an identifiable cause: Mycoplasma pneumoniae
          or Epstein-Barr virus infection, an overt B-cell lymphoma, or another autoimmune disorder. Post-infectious
          cold agglutinins are typically polyclonal and transient and resolve with the underlying illness;
          lymphoma-associated ones are monoclonal but are produced by a clinically or radiologically overt
          neoplasm rather than by the occult marrow clone of primary CAD. Management is directed at the
          underlying cause, so the distinction changes treatment.'
        distinguishing_features:
        - An identifiable underlying infection, lymphoma or autoimmune disease
        - Polyclonal and transient cold agglutinins in the post-infectious form
        - Clinically or radiologically overt lymphoma in the malignancy-associated form
      selected_evidence:
        snippet: CAD is distinguished from cold agglutinin syndrome, which is transient and secondary
          to infections, overt malignant, or autoimmune conditions.
        supports: SUPPORT
    origin:
