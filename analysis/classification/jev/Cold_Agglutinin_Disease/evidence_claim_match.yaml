        context: []
      assertion_type: Diagnosis
      assertion:
        name: Bone marrow biopsy with flow cytometry and clonality testing
        description: 'Establishes the underlying clonal B-cell lymphoproliferative disorder and excludes
          an overt lymphoma that would reclassify the case as secondary cold agglutinin syndrome. Sensitive
          ancillary methods matter: in a recent 56-patient series only 11% of confirmed CAD cases met
          the full WHO-HAEM5 morphological description of CAD-LPD, while 84% showed clonality by ancillary
          techniques.'
      selected_evidence:
        snippet: Surprisingly, while ancillary methods detected clonality in the majority (84%), only
          5 (11%) of 45 CAD cases strictly fulfilled the WHO-HAEM5 morphological description for CAD-LPD.
          These data imply that sensitive techniques should be used in BM evaluation in CAD.
        supports: SUPPORT
