      assertion_type: Treatment
      assertion:
        name: Splenectomy
        description: Ineffective in cold agglutinin disease and not recommended. The C3b-opsonized red
          cell is cleared by hepatic Kupffer cells, not by splenic macrophages, so removing the spleen
          does not remove the effector organ. This is the clearest instance in the entry of mechanism
          predicting therapeutic failure.
        treatment_term:
          preferred_term: splenectomy
          term:
            id: NCIT:C15328
            label: Splenectomy
        therapeutic_modality: SURGERY
      selected_evidence:
        snippet: it explains why therapies effective in warm AIHA, such as corticosteroids and splenectomy,
          are largely ineffective in CAD, where hemolysis is complement-driven and predominantly hepatic
          rather than Fc-mediated and splenic
        supports: SUPPORT
