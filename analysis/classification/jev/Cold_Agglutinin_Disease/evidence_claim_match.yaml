      assertion_type: Pathophysiology
      assertion:
        name: Acral Microcirculatory Obstruction
        description: 'Agglutinated red cells impede flow through the small vessels of fingers, toes, ears
          and nose on cold exposure, producing acrocyanosis, Raynaud-like phenomena and livedo reticularis.
          This branch of the mechanism is purely agglutination-driven: it does not require complement,
          and complement inhibitors therefore do not relieve it — a distinction with direct therapeutic
          consequences, since a patient whose dominant complaint is circulatory rather than hemolytic
          will not benefit from sutimlimab.'
        biological_scale: TISSUE
      selected_evidence:
        snippet: Importantly, these symptoms are not complement-mediated and are therefore not addressed
          by complement inhibitors, a distinction with direct therapeutic relevance.
        supports: SUPPORT
