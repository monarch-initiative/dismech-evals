        name: Clonal Bone Marrow B-Cell Lymphoproliferation
        description: A small, low-grade clonal B-cell population sits in the bone marrow as circumscribed
          intraparenchymatous nodules of monotonous CD20+, surface IgM+, IgD+, CD27+, CD23-negative B
          cells, with a limited number of monotypic IgM+ plasma cells scattered diffusely outside the
          nodules. It lacks plasmacytoid cytology, the plasma-cell transcription factors MUM1, XBP1 and
          BLIMP1, and the MYD88 L265P mutation, which is what distinguishes CAD-associated lymphoproliferative
          disorder from lymphoplasmacytic lymphoma and Waldenstrom macroglobulinemia. The WHO fifth edition
          recognises it as a distinct entity. This clone is the source of the pathogenic cold agglutinin
          and the target of B-cell-directed therapy.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: clonal CD20+ IgM+ CD27+ marrow B cell
          term:
            id: CL:0000236
            label: B cell
        - preferred_term: monotypic IgM+ kappa plasma cell
          term:
            id: CL:0000786
            label: plasma cell
        biological_processes:
        - preferred_term: clonal B cell proliferation in the bone marrow
          term:
            id: GO:0042100
            label: B cell proliferation
          modifier: INCREASED
      selected_evidence:
        snippet: Of interest, the MYD88 L265P mutation, typical of lymphoplasmacytic lymphoma, was not
