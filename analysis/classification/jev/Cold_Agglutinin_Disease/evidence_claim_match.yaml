        context: []
      assertion_type: Treatment
      assertion:
        name: Eculizumab
        description: 'Anti-C5 monoclonal antibody, tested prospectively in CAD (the DECADE trial) and
          informative mainly as a mechanistic control. Blocking the terminal pathway cut LDH substantially
          but raised hemoglobin only from 9.35 to 10.15 g/dL, because it leaves the C3b-opsonization step
          — and therefore the dominant hepatic extravascular clearance — completely intact. Cold-induced
          circulatory symptoms were likewise unaffected, as expected for a branch that is not complement-mediated
          at all. The trial result is the strongest single piece of evidence that this entry''s graph
          is oriented correctly: inhibiting the minority branch produces a minority benefit.'
        treatment_term:
          preferred_term: terminal complement inhibition
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: complement inhibitor
            term:
              id: NCIT:C199456
              label: Complement Inhibitor
        therapeutic_modality: MONOCLONAL_ANTIBODY
      selected_evidence:
        snippet: In contrast to hemolysis, cold-induced circulatory symptoms remained unaffected.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/5
      evidence_path: /treatments/5/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30291112
      reference_title: 'Eculizumab in cold agglutinin disease (DECADE): an open-label, prospective, bicentric,
        nonrandomized phase 2 trial.'
      evidence_source: HUMAN_CLINICAL
      explanation: Confirms that the acral circulatory branch is untouched by complement inhibition of
        any kind, which is why this entry models it as a separate limb leaving the agglutination node.
