        name: Downregulation of Complement Receptor 1 on Clonal B Cells
        description: RNA sequencing and flow cytometry of sorted clonal CAD B cells show complement receptor
          1 (CR1/CD35) to be the most strongly downregulated gene relative to IgM+ memory B cells from
          healthy donors. CR1 is a negative regulator of B-cell activation and differentiation, so its
          loss is proposed to lower the activation threshold of the CAD clone and increase its antibody
          output. The functional consequence is inferred from CR1 biology rather than demonstrated in
          CAD, so this node is provisional.
        biological_scale: MOLECULAR
        mechanism_confidence: HYPOTHETICAL
        cell_types:
        - preferred_term: clonal CAD B cell
          term:
            id: CL:0000236
            label: B cell
      selected_evidence:
        snippet: complement receptor 1 (CR1/CD35) was downregulated 11-fold in clonal CAD B cells compared
          to control B cells
        supports: SUPPORT
