              label: cold agglutinin disease
        context: []
      assertion_type: Treatment
      assertion:
        name: Sutimlimab
        description: A humanized IgG4 monoclonal antibody that selectively inhibits the classical complement
          pathway at C1s, leaving the lectin and alternative pathways intact. It blocks the effector arm
          of the disease without touching the clone, so hemolysis stops within days and the hemoglobin,
          bilirubin and fatigue all respond within the first weeks — but the cold agglutinin is still
          produced, and the agglutination-driven circulatory symptoms are not relieved. Approved for CAD
          on the strength of the CARDINAL and CADENZA trials.
        treatment_term:
          preferred_term: classical-pathway complement inhibition
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: sutimlimab
            term:
              id: NCIT:C153093
              label: Sutimlimab
        therapeutic_modality: MONOCLONAL_ANTIBODY
      selected_evidence:
        snippet: In patients with cold agglutinin disease who received sutimlimab, selective upstream
          inhibition of activity in the classic complement pathway rapidly halted hemolysis, increased
          hemoglobin levels, and reduced fatigue.
        supports: SUPPORT
