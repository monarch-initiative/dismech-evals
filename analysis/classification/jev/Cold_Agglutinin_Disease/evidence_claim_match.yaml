        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somatic KMT2D and CARD11 Mutation in the CAD B-Cell Clone
        description: The bone-marrow clone that underlies CAD carries recurrent somatic lesions, most
          consistently loss-of-function mutation of the histone methyltransferase gene KMT2D and gain-of-function
          mutation of the NF-kB scaffold gene CARD11, together with trisomies of chromosomes 3, 12 and
          18. These are somatic events in the neoplastic B cells, not germline predisposition alleles,
          and their combination is one of the features that separates the CAD clone from lymphoplasmacytic
          lymphoma, in which MYD88 L265P is near-universal and absent here.
        biological_scale: MOLECULAR
        genetic_context:
          genes:
          - preferred_term: KMT2D
            term:
              id: hgnc:7133
              label: KMT2D
          - preferred_term: CARD11
            term:
              id: hgnc:16393
              label: CARD11
          variant_origin: SOMATIC
          functional_impact: KMT2D carries loss-of-function mutations and CARD11 gain-of-function mutations;
            the two impacts differ, so no single functional_impact_category value describes the pair.
          description: Recurrent somatic mutations in the clonal B cells of primary cold agglutinin disease.
      selected_evidence:
        snippet: The identification of recurrent somatic mutations in the KMT2D and CARD11 genes and trisomies
          of chromosomes 3, 12, and 18 in a proportion of CAD patients further strengthens the notion
          of it being a distinct entity
        supports: SUPPORT
    origin:
