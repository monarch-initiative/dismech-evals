              id: MONDO:0018922
              label: cold agglutinin disease
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Warm autoimmune hemolytic anemia
        description: IgG autoantibodies active at 37 degrees Celsius, cleared by Fc receptor-bearing splenic
          macrophages. The direct antiglobulin test is IgG-positive, corticosteroids and splenectomy work,
          and there is no cold-induced circulatory syndrome. The mechanistic contrast — spleen and Fc
          receptor versus liver and complement receptor — is what makes the two diseases respond to different
          drugs.
        distinguishing_features:
        - IgG-positive direct antiglobulin test rather than C3d-positive
        - Response to corticosteroids and splenectomy
        - No cold-induced acrocyanosis or Raynaud-like symptoms
      selected_evidence:
        snippet: Unlike warm AIHA, which is driven by immunoglobulin G (IgG)-mediated, Fc receptor-dependent
          splenic clearance, CAD is defined by the convergence of two processes
        supports: SUPPORT
