        causal_link_type: DIRECT
        description: Dense C3b deposition builds C5 convertase and drives the cascade on to C5b-9; this
          is the minority route and occurs mainly during exacerbations.
      selected_evidence:
        snippet: Although hemolysis is primarily driven by classical complement and extravascular hemolysis
          in CAD, severe disease may see further, terminal complement activation, with increased C3b deposition
