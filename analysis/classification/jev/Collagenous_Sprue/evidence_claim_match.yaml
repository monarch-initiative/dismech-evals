  2e1e3abeee118e976719230cd09ae236dd0188eb88137f6c40e9f5a44a1ca149:
    claim:
      about:
        disease:
          name: Collagenous Sprue
          disease_term:
            preferred_term: collagenous sprue
            term:
              id: MONDO:0044092
              label: collagenous sprue
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Subepithelial collagen deposition with entrapment of lamina propria elements
        description: The defining lesion is a thickened band of collagen beneath the surface epithelium
          of the small bowel, confirmed as collagen by histochemical and ultrastructural study, which
          entraps capillaries, inflammatory cells and fibroblasts. Band thickness varies widely between
          cases and does not track symptom severity. The cellular and molecular drivers of the deposition
          — the fibroblast or myofibroblast population responsible, and the balance of collagen synthesis
          against matrix turnover — have not been characterized in collagenous sprue itself; see the `fibrogenic_mediators_uncharacterized`
          discussion.
        cell_types:
        - preferred_term: myofibroblast
          term:
            id: CL:0000186
            label: myofibroblast cell
        - preferred_term: capillary endothelial cell
          term:
            id: CL:0002144
            label: capillary endothelial cell
        biological_processes:
        - preferred_term: positive regulation of collagen biosynthetic process
          term:
            id: GO:0032965
            label: regulation of collagen biosynthetic process
        - preferred_term: extracellular matrix organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
        locations:
        - preferred_term: subepithelial lamina propria
          term:
            id: UBERON:0000030
            label: lamina propria
      selected_evidence:
        snippet: Collagenous sprue is a severe malabsorptive disorder, histologically characterized by
          small intestinal villous and crypt atrophy, and a subepithelial collagen deposit, thicker than
          12 µm, that entraps lamina propria cellular elements.
        supports: SUPPORT
        directness: DIRECT
