      assertion:
        name: Refractory celiac disease
        disease_term:
          preferred_term: refractory celiac disease
          term:
            id: MONDO:0018353
            label: refractory celiac disease
        description: 'Refractory celiac disease and collagenous sprue both present as villous atrophy
          that does not respond to a gluten-free diet, and they overlap: about half of the celiac patients
          in one collagenous sprue series had refractory disease. The collagen band separates them histologically,
          and aberrant intraepithelial lymphocyte phenotypes — the hallmark of type II refractory celiac
          disease — were absent throughout that series.'
        distinguishing_features:
        - Subepithelial collagen band present in collagenous sprue
        - Phenotypically aberrant intraepithelial lymphocytes in type II refractory celiac disease, not
          found in collagenous sprue
        - Documented celiac disease with initial gluten-free diet response precedes refractory celiac
          disease
      selected_evidence:
        snippet: Seventeen (89%) had celiac disease and two had unclassified sprue; 9 of 17 (53%) celiac
          disease patients had refractory disease
        supports: SUPPORT
