      assertion_type: DifferentialDiagnosis
      assertion:
        name: Microscopic colitis
        disease_term:
          preferred_term: microscopic colitis
          term:
            id: MONDO:0000702
            label: microscopic colitis
        description: Collagenous colitis, the collagen-band subtype of microscopic colitis, is the colonic
          counterpart of the same lesion and co-occurs with collagenous sprue in a substantial fraction
          of cases, so the distinction is one of site and extent rather than of a different process. Colonic
          biopsies are therefore part of the workup rather than an alternative to small-bowel biopsy.
        distinguishing_features:
        - Collagen band in colonic mucosa in collagenous colitis, small-bowel mucosa in collagenous sprue
        - Villous atrophy is intrinsic to collagenous sprue and absent from a purely colonic process
        - Concurrent collagenous colitis is present in a large minority of collagenous sprue patients,
          so the two are not mutually exclusive
      selected_evidence:
        snippet: Seven cases were associated with collagenous colitis and 1 also had features of lymphocytic
          colitis.
        supports: SUPPORT
        directness: DIRECT
