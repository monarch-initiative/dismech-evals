  2f72d3f81adbc3fa5bcdd291383820048db2fc1fd5578f1d4a3c85abb81f7176:
    claim:
      about:
        disease:
          name: Collagenous Sprue
          disease_term:
            preferred_term: collagenous sprue
            term:
              id: MONDO:0044092
              label: collagenous sprue
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Epithelial detachment and villous atrophy
        description: The collagen band is accompanied by epithelial detachment from the basement membrane
          and by villous atrophy that is total in roughly half of reported cases, producing the flattened
          mucosal lesion responsible for malabsorption. Histologic severity does not correlate with symptom
          severity, and histologic recovery lags clinical response to treatment — in one series the villous
          architecture normalized fully in only one of four clinically improved patients. Whether tight-junction
          proteins are involved has not been examined in collagenous sprue.
        biological_processes:
        - preferred_term: cell junction organization
          term:
            id: GO:0034330
            label: cell junction organization
        - preferred_term: epithelial cell differentiation
          term:
            id: GO:0030855
            label: epithelial cell differentiation
        locations:
        - preferred_term: duodenal mucosa
          term:
            id: UBERON:0002108
            label: small intestine
      selected_evidence:
        snippet: In addition to a thickened collagenous band, villous atrophy, intraepithelial lymphocytosis,
          detachment of the epithelium and entrapment of capillaries, inflammatory cells and fibroblasts
          within the collagen band can be found.
        supports: SUPPORT
        directness: DIRECT
