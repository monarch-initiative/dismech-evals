        association: Contested susceptibility locus, inherited through the celiac association
        relationship_type: SUSCEPTIBILITY
        notes: 'The HLA link to collagenous sprue is entirely indirect: it is inherited from the frequent
          co-occurrence with celiac disease, which is HLA-DQ2/DQ8-restricted. No study has typed HLA in
          an unselected collagenous sprue cohort and found an association independent of celiac disease,
          and the one series that typed all its patients found them uniformly DQ2/DQ8-negative. Both directions
          are cited below.'
      selected_evidence:
        snippet: None of the patients had ever had coeliac-specific antibodies, and all were negative
          for HLA-DQ2 and HLA-DQ8 phenotype.
        supports: REFUTE
        directness: DIRECT
