              id: MONDO:0044092
              label: collagenous sprue
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: hla_association_is_inherited_from_celiac
        kind: CONTROVERSY
        status: OPEN
        attaches_to:
        - genetic#HLA-DQA1
        prompt: Is there an HLA association with collagenous sprue that is independent of its co-occurrence
          with celiac disease?
        rationale: Referral series report celiac disease in up to 89% of collagenous sprue patients, which
          makes an HLA-DQ2/DQ8 enrichment inevitable without implying that HLA predisposes to the collagen
          band. The one series that typed all its patients found them uniformly DQ2/DQ8-negative and celiac-seronegative,
          and concluded that collagenous sprue should be separated from celiac disease. The two positions
          are both cited on the HLA-DQA1 record, one as SUPPORT and one as REFUTE. Ascertainment is the
          likely explanation for the difference — the 89% figure comes from a celiac referral centre's
          pathology database — but no study has tested that.
      selected_evidence:
        snippet: Its exact etiology is still under investigation, and its relationship with classic celiac
          disease and other refractory, spruelike intestinal disorders remains controversial.
        supports: SUPPORT
        directness: DIRECT
