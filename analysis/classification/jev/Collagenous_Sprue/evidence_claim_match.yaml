        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Celiac disease
        disease_term:
          preferred_term: celiac disease
          term:
            id: MONDO:0005130
            label: celiac disease
        description: Celiac disease shares chronic diarrhea, weight loss and villous atrophy with collagenous
          sprue and frequently co-occurs with it, so the two are separated histologically by the subepithelial
          collagen band rather than clinically. Most collagenous sprue patients are celiac-seronegative,
          and collagenous sprue patients are more symptomatic and need parenteral nutrition and hospitalization
          far more often than celiac patients.
        distinguishing_features:
        - Subepithelial collagen band present in collagenous sprue, absent in celiac disease
        - Positive tTG and endomysial antibodies in most celiac patients; positive in about a quarter
          of collagenous sprue patients
        - HLA-DQ2/DQ8 restriction in celiac disease; collagenous sprue occurs in DQ2/DQ8-negative patients
        - Sustained response to gluten-free diet in celiac disease; fewer than half of collagenous sprue
          patients respond to diet alone
      selected_evidence:
        snippet: CS should be separated from coeliac disease.
        supports: SUPPORT
        directness: DIRECT
