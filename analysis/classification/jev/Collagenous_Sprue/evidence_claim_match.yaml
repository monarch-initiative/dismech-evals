  01486f4d9e5c0796be9136fa99a69b06d055318d2363475452e206560e042829:
    claim:
      about:
        disease:
          name: Collagenous Sprue
          disease_term:
            preferred_term: collagenous sprue
            term:
              id: MONDO:0044092
              label: collagenous sprue
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fibrogenic_mediators_uncharacterized
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Subepithelial collagen deposition with entrapment of lamina propria elements
        - genetic#
        prompt: Which cells deposit the collagen band in collagenous sprue, and what shifts the balance
          between matrix synthesis and matrix turnover in favour of accumulation?
        rationale: This entry previously carried five gene records — TGFB1, MMP1, MMP9, TIMP1 and TJP1
          — each asserting a direction of change (TGF-beta driven fibroblast activation, reduced MMP activity,
          elevated TIMP1, reduced ZO-1). Every one of them was supported only by a histology sentence
          that named no gene, transcript or protein, and two of those sentences came from papers about
          collagenous gastritis and ARB-induced gastritis rather than about collagenous sprue. The records
          have been removed rather than re-sourced, because the searches run for this re-curation found
          no study that measures any of these mediators in collagenous sprue tissue. The model is plausible
          and is imported wholesale from collagenous colitis and from general gut-fibrosis biology; importing
          it was how the entity confusion this issue tracks got in. It is recorded here as an open question
          so that a future study can reinstate the nodes with real measurements.
        notes: Resolving this needs tissue-level work — immunohistochemistry or transcriptomics on collagenous
          sprue duodenal biopsies against celiac and normal controls — not another literature pass.
      selected_evidence:
        snippet: Future studies are needed to more precisely define molecular and genetic biomarkers that
          identify homogeneous groups and permit the development of improved treatment strategies for
          this increasingly recognized disorder.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21523258
      reference_title: Collagenous sprue.
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      explanation: A review of collagenous sprue stating that the molecular and genetic biomarkers are
        still undefined, which is the gap recorded here.
