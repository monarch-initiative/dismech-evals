        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mucosal immune activation with intraepithelial lymphocytosis
        description: 'Small-bowel biopsies in collagenous sprue show intraepithelial lymphocytosis and
          a lamina propria infiltrate that may include plasma cells, neutrophils and eosinophils, alongside
          the collagen band and villous atrophy. Clonal T-cell populations are detectable in a majority
          of tested cases, and clinical response to thiopurines — whose active metabolite induces T-cell
          apoptosis — is the main functional argument for a T-cell-driven process. The immune activation
          is dissociable from celiac disease: it occurs in patients with negative celiac serology and
          without the HLA-DQ2/DQ8 haplotypes. The upstream trigger is unknown.'
        cell_types:
        - preferred_term: intraepithelial lymphocyte
          term:
            id: CL:0002496
            label: intraepithelial lymphocyte
        - preferred_term: plasma cell
