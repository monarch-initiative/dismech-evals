  e86bce8d706d207c8f0065862fa630feb3c74fb949690883db8ee3113555e80e:
    claim:
      about:
        disease:
          name: Colobomatous Microphthalmia-Rhizomelic Dysplasia Syndrome
          disease_term:
            preferred_term: colobomatous microphthalmia-rhizomelic dysplasia syndrome
            term:
              id: MONDO:0014380
              label: colobomatous microphthalmia-rhizomelic dysplasia syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Chondrocyte Proliferation in the Proximal Limb Bud
        biological_scale: CELLULAR
        description: 'Conditional deletion of Mab21l2 in the mouse limb bud malforms the stylopods. The
          defect is developmentally narrow and specific: reduced chondrocyte proliferation in the prospective
          humerus region at E10.5, a critical window confined to E9.5-10.5, a smaller cartilage template
          by E13.5, a three-day delay in endochondral ossification, and humerus shortening at birth. Mab21l2
          is expressed in the distal mesenchyme during that window while the affected structure is proximal,
          so the authors conclude it acts non-autonomously — the gene is not where the damage is.'
        cell_types:
        - preferred_term: limb bud chondrocyte
          term:
            id: CL:0000138
            label: chondrocyte
        biological_processes:
        - preferred_term: chondrocyte proliferation
          modifier: DECREASED
          term:
            id: GO:0035988
            label: chondrocyte proliferation
        - preferred_term: endochondral ossification
          modifier: DECREASED
          term:
            id: GO:0001958
            label: endochondral ossification
      selected_evidence:
        snippet: Histological examination revealed a three-day delay of endochondral ossification in the
          Prx1-cre; Mab21l2flox/flox mice.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40054064
      reference_title: Mab21l2 is required to promote cell proliferation in stylopods during early limb
