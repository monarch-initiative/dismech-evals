          endochondral ossification.
        limitations: This is a conditional null, whereas the human disorder is caused by a specific heterozygous
          missense allele; the model therefore tests what MAB21L2 does in the limb rather than what p.Arg51Cys
          does to it. The Prx1-cre driver also restricts deletion to limb mesenchyme, so the model says
          nothing about the ocular or cognitive components.
        readouts:
