          target: Reduced Chondrocyte Proliferation in the Proximal Limb Bud
          direction: DECREASED
          interpretation: The proliferation deficit is the earliest measured lesion in the chain to a
            shortened humerus.
        - name: Timing of endochondral ossification
          target: Reduced Chondrocyte Proliferation in the Proximal Limb Bud
          direction: DECREASED
          interpretation: A three-day delay, which is the histological correlate of the shortened proximal
            segment.
      selected_evidence:
        snippet: By conditional gene knockout model, we found that removing Mab21l2 by Prx1-cre during
          early limb development led to malformation of the stylopods.
        supports: SUPPORT
