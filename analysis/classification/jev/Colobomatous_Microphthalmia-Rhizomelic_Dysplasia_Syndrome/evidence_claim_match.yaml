      assertion_type: Pathophysiology
      assertion:
        name: MAB21L2 p.Arg51Cys Substitution
        biological_scale: MOLECULAR
        genes:
        - preferred_term: MAB21L2
          term:
            id: hgnc:6758
            label: MAB21L2
        genetic_context:
          gene:
            preferred_term: MAB21L2
            term:
              id: hgnc:6758
              label: MAB21L2
          allele_type: recurrent missense c.151C>T (p.Arg51Cys)
          zygosity: HETEROZYGOUS
          variant_origin: DE_NOVO
        description: A specific recurrent substitution, not a generic MAB21L2 loss. The same residue change
          recurs in unrelated individuals with the oculo-skeletal phenotype, while other MAB21L2 alleles
          produce eye malformation without skeletal involvement — an allele-specific association that
          argues the skeletal phenotype is not simply the severe end of a dosage series. The same substitution
          modelled in transgenic mice reproduces severe appendicular skeletal anomalies.
      selected_evidence:
        snippet: Recent exome studies showed that these characteristics are part of the phenotypic spectrum
          of MAB21L2 gene mutations which cause a range of structural eye malformations such as microphthalmia/anophthalmia
          and ocular coloboma.
        supports: SUPPORT
