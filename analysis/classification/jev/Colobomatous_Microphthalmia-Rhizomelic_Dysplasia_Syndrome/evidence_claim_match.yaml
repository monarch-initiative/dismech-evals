        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Optic Cup and Fissure Morphogenesis
        biological_scale: TISSUE
        genes:
        - preferred_term: MAB21L2
          term:
            id: hgnc:6758
            label: MAB21L2
        description: MAB21L2 is required for eye development, and its variants produce a graded range
          of structural eye malformation — coloboma where the optic fissure fails to close, microphthalmia
          where the optic cup is undergrown, anophthalmia at the severe end. This node records that the
          ocular and skeletal components of the syndrome are parallel consequences of the same allele
          rather than one causing the other. The cellular lesion in the eye has not been resolved to the
          same depth as the limb one.
        biological_processes:
        - preferred_term: eye morphogenesis
          modifier: DECREASED
          term:
            id: GO:0048592
            label: eye morphogenesis
      selected_evidence:
        snippet: MAB21L2 gene mutations which cause a range of structural eye malformations such as microphthalmia/anophthalmia
          and ocular coloboma
        supports: SUPPORT
