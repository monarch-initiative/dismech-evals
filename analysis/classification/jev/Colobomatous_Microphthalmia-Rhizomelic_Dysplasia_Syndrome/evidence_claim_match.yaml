        relationship_type: CAUSATIVE
        notes: A male abnormal 21 like 2 family member, required for eye and limb development. The oculo-skeletal
          presentation is associated specifically with the recurrent p.Arg51Cys substitution; other MAB21L2
          alleles give eye malformation without a skeletal phenotype, and biallelic alleles have been
          reported with ocular involvement only. Reporting a MAB21L2 variant as causal for this syndrome
          therefore requires attention to which allele it is, not only to which gene.
      selected_evidence:
        snippet: The two unrelated individuals described here in detail are heterozygous carriers of the
          same de novo missense mutation c.151C > T (p.Arg51Cys) in MAB21L2.
        supports: SUPPORT
