      assertion_type: HistopathologyFinding
      assertion:
        name: Poorly differentiated clusters
        finding_term:
          preferred_term: Poorly differentiated clusters
          term:
            id: HP:0025461
            label: Abnormal cell morphology
        description: 'Poorly differentiated clusters (PDCs) are clusters of five or more cancer cells
          lacking a gland-like structure. Quantifying PDCs into a site-specific grade (Grade(PDC): G1
          fewer than 5, G2 5-9, G3 ten or more clusters in the field with the maximum clusters) stratifies
          recurrence-free survival independently of, and in the original series more strongly than, TNM
          stage.'
        notes: finding_term falls back to HP:0025461 because NCIT has no poorly-differentiated-cluster
          or Grade(PDC) term in the Histopathology Result branch (searched 2026-08-17); its retired "Poorly
          Differentiated" grade term is a tumor-differentiation grade, not this cluster-counting finding.
          PDCs are a genuine cell-arrangement and differentiation finding, so the fallback fits better
          here than for the TIL finding.
      selected_evidence:
        snippet: Multivariate analysis showed that Grade exerted an influence on prognostic outcome independently
          of TNM staging
        supports: SUPPORT
