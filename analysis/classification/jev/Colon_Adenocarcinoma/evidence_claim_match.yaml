      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Adenoma-Carcinoma Sequence
        treatment_effect: INHIBITS
        description: Anti-MUC1 immunity is intended to eliminate MUC1-overexpressing adenomatous epithelium
          and reduce adenoma recurrence, intercepting the adenoma-carcinoma sequence; in the trial the
          vaccine did not reduce adenoma recurrence in the intention-to-treat population (aRR 0.83, 95%
          CI 0.60-1.14, P = 0.25), and the 38% absolute reduction observed in immune responders was likewise
          not statistically significant (aRR 0.41, 95% CI 0.15-1.11, P = 0.08) — hypothesis-generating
          rather than confirmatory.
      selected_evidence:
        snippet: a 38% absolute reduction in adenoma recurrence compared with placebo was observed in
          participants who had an immune response at week 12 and with the booster injection.
        supports: SUPPORT
