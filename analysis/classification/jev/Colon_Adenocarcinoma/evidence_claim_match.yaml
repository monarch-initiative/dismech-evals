      assertion:
        name: Metastatic
        description: Advanced colorectal adenocarcinoma with distant spread, most commonly hepatic. Liver
          colonization, KRAS/BRAF-driven signaling, WNT pathway activation, and stromal cooperation are
          recurring mechanistic themes; MSI-high disease represents a distinct immune-responsive metastatic
          subset.
        notes: Folded in from the former Metastatic_Colorectal_Cancer entry (cancer granularity ladder,
          design decisions §3a). That entry was scoped to colorectal cancer broadly (MONDO:0005575); its
          dissemination biology is carried by this entry's Liver Tropism and Hepatic Colonization, EMT-Linked
          Invasive Dissemination, Anoikis Escape, Angiogenic Remodeling, and Seed-and-Soil Microenvironment
          Support nodes.
      selected_evidence:
        snippet: Of new colorectal cancer diagnoses, 20% of patients have metastatic disease at presentation
          and another 25% who present with localized disease will later develop metastases.
        supports: SUPPORT
