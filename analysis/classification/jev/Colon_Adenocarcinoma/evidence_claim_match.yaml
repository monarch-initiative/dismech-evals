      assertion_type: Treatment
      assertion:
        name: GUCY2C Agonist (Investigational Chemoprevention)
        description: Oral GUCY2C agonists (linaclotide, plecanatide) aim to reactivate the tumor-suppressive
          GUCY2C axis that is silenced early in colorectal carcinogenesis, restoring cGMP-dependent homeostatic
          signaling and restraining epithelial proliferation. In a human study oral linaclotide activated
          GUCY2C and reduced colorectal epithelial proliferation, but only after colon preparation — the
          FDA-approved gastric-release formulation does not reliably reach the colorectum, so a colorectum-targeted
          formulation is required before this can serve as a chemopreventive.
        therapeutic_modality: PEPTIDE
        treatment_term:
          preferred_term: chemoprevention
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: linaclotide
            term:
              id: CHEBI:68551
              label: linaclotide
      selected_evidence:
        snippet: The study results highlight the importance of developing a novel GUCY2C agonist formulated
          for release and activity targeted to the large intestine for colorectal cancer prevention
        supports: SUPPORT
