            description: MUC1 is an epithelial glycoprotein aberrantly expressed on colorectal adenomas
              and carcinomas, making it a candidate shared antigen for immunoprevention. A MUC1 peptide
              vaccine aims to raise anti-MUC1 immunity to intercept recurrent adenoma formation in individuals
              with a prior advanced adenoma. In a randomized, placebo-controlled prevention trial the
