  2d6c47ccb20b91d087eb16df05e83b4ebce9e30dfc6bbbd04a8c321a5652050a:
    claim:
      about:
        disease:
          name: Colon Adenocarcinoma
          disease_term:
            preferred_term: colon adenocarcinoma
            term:
              id: MONDO:0002271
              label: colon adenocarcinoma
        context: []
      assertion_type: HistopathologyFinding
      assertion:
        name: Tumor-infiltrating lymphocytes (Immunoscore)
        finding_term:
          preferred_term: Tumor-infiltrating lymphocytes
          term:
            id: NCIT:C35983
            label: Lymphocytic Infiltrate
        description: The type, density, and location of tumor-infiltrating lymphocytes - in particular
          CD3+ and cytotoxic CD8+ T cells at the tumor core and invasive margin, quantified as the consensus
          Immunoscore - is a favorable, stage-independent prognostic marker in colon adenocarcinoma. A
          dense adaptive immune infiltrate predicts lower recurrence risk and is under evaluation to help
          guide adjuvant chemotherapy selection.
        notes: 'finding_term is NCIT:C35983 Lymphocytic Infiltrate, "a morphologic finding referring to
          the presence of a cellular infiltrate that is composed of non-neoplastic or neoplastic lymphocytes
          in a tissue sample" - the closest match to the Immunoscore reading, which is a CD3+/CD8+ lymphocyte
          density. Candidates passed over (searched 2026-08-17, revised 2026-08-25): NCIT:C35980 Chronic
          Inflammatory Infiltrate is a morphologic finding but asserts a chronic-inflammatory character
          and admits lymphoplasmacytic cells and reactive plasma cells that the Immunoscore does not measure;
          NCIT:C12546 Tumor Infiltrating Lymphocyte is a cell type rather than a finding; NCIT:C160833
          Tumor Infiltrating Lymphocyte Absent asserts the inverse of this finding; NCIT:C160832 and NCIT:C204678
          are a CRF question and a count measurement rather than findings. The specific CD3+/CD8+ Immunoscore
          reading is carried by preferred_term and the description.'
      selected_evidence:
        snippet: the immunological data (the type, density, and location of immune cells within the tumor
          samples) were found to be a better predictor of patient survival than the histopathological
          methods currently used to stage colorectal cancer.
        supports: SUPPORT
    origin:
      assertion_path: /histopathology/2
      evidence_path: /histopathology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17008531
      reference_title: Type, density, and location of immune cells within human colorectal tumors predict
        clinical outcome.
      evidence_source: HUMAN_CLINICAL
      explanation: This landmark study shows that in situ immune-cell type, density, and location predict
        survival better than standard histopathologic staging in colorectal cancer.
