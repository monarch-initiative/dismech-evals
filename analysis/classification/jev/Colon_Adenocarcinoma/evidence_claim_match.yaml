      assertion_type: Pathophysiology
      assertion:
        name: GUCY2C Tumor-Suppressive Axis Silencing
        biological_scale: MOLECULAR
        description: The intestinal receptor guanylyl cyclase C (GUCY2C) enforces epithelial homeostasis
          and restrains crypt proliferation. Early in colorectal carcinogenesis its endogenous hormones
          guanylin and uroguanylin are lost, silencing GUCY2C-cGMP signaling and removing a tumor-suppressive
          brake — a change that permits progression along the adenoma-carcinoma sequence and is the rationale
          for GUCY2C-agonist chemoprevention.
        biological_processes:
        - preferred_term: receptor guanylyl cyclase signaling pathway
          modifier: DECREASED
          term:
            id: GO:0007168
            label: receptor guanylyl cyclase signaling pathway
      selected_evidence:
        snippet: Guanylate cyclase C (GUCY2C) is a tumor-suppressing receptor silenced by loss of expression
          of its luminocrine hormones guanylin and uroguanylin early in colorectal carcinogenesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28396341
      reference_title: Bioactivity of Oral Linaclotide in Human Colorectum for Cancer Chemoprevention.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports GUCY2C as a tumor-suppressive axis silenced early in colorectal carcinogenesis
        by loss of its endogenous ligands.
