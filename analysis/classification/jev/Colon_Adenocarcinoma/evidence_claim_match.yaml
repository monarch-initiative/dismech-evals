        description: MUC1 is an epithelial glycoprotein aberrantly expressed on colorectal adenomas and
          carcinomas, making it a candidate shared antigen for immunoprevention. A MUC1 peptide vaccine
          aims to raise anti-MUC1 immunity to intercept recurrent adenoma formation in individuals with
          a prior advanced adenoma. In a randomized, placebo-controlled prevention trial the vaccine was
          immunogenic only in vaccine recipients but did not significantly reduce adenoma recurrence overall;
          a 38% absolute reduction was seen in the subset who mounted an immune response. It remains investigational.
        therapeutic_modality: VACCINE
        treatment_term:
          preferred_term: vaccination
          term:
