        name: Aspirin Chemoprevention
        description: Low-dose aspirin is an established chemopreventive ("interception") agent that reduces
          the recurrence of colorectal adenomas — the precursor lesions of colon adenocarcinoma. The cited
          randomized trial evaluated secondary prevention in higher-risk individuals with a recent history
          of documented adenomas; the 81 mg dose reduced adenoma recurrence while 325 mg did not. Its
          antineoplastic effect in the large bowel is attributed largely to inhibition of COX/prostaglandin-driven
          pro-tumorigenic signaling within the adenoma-carcinoma sequence. Preventive use is balanced
          against gastrointestinal bleeding risk.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
