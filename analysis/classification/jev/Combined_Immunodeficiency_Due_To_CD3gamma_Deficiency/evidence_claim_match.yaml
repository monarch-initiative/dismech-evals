        description: Biallelic CD3G variants impair the CD3gamma subunit of the TCR/CD3 complex. Complete
          transcript and protein loss was demonstrated for homozygous c.1A>G in cultured blasts from one
          child; PBMC protein loss was also shown in the two adults reported in 2026. These results establish
          that human T-cell development can persist without detectable CD3gamma; they do not establish
          identical residual function for every reported allele. The original Spanish siblings were compound
          heterozygotes, not homozygotes for the initiation-codon variant.
