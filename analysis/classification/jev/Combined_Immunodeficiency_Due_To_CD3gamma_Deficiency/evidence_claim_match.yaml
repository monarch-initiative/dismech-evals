      assertion_type: DifferentialDiagnosis
      assertion:
        name: CD3delta, CD3epsilon and CD3zeta deficiencies
        description: CD3D, CD3E and CD247/CD3zeta deficiencies typically present with classical SCID and
          profound T-cell developmental impairment. CD3G deficiency more often retains peripheral T cells,
          but severe clinical SCID-like CD3G presentations also occur; gene and allele-specific evaluation
          is required.
        disease_term:
          preferred_term: severe combined immunodeficiency
          term:
            id: MONDO:0015974
            label: severe combined immunodeficiency
        distinguishing_features:
        - Typical profound T-cell depletion in other CD3-chain defects
        - Variable retained T-cell numbers and autoimmunity in CD3G deficiency
        - Gene-specific molecular diagnosis rather than clinical severity alone
      selected_evidence:
        snippet: Our results show that patients with CD3δ, CD3ε, and CD3ζ deficiencies typically present
          with a classic SCID phenotype. In contrast, patients with CD3γ deficiency may either show an
          SCID phenotype or a milder, less severe CID phenotype.
        supports: SUPPORT
