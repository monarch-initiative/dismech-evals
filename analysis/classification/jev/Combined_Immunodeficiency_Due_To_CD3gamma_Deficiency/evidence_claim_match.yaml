      assertion_type: Discussion
      assertion:
        discussion_id: gap_cd3g_genotype_phenotype
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which modifiers account for different clinical courses among relatives sharing a CD3G
          variant?
        attaches_to:
        - genetic#CD3G
        - pathophysiology#Multisystem Autoimmunity
        rationale: Identical variants accompany divergent infection and autoimmune outcomes. Demonstrated
          protein loss for particular alleles shows that residual CD3gamma is not required for all retained
          human T-cell development; it does not exclude allele-specific effects across the whole spectrum.
          Preserved Taiwanese Treg function and variable age/stimulus-dependent proliferation are correlates,
          not validated prognostic rules.
      selected_evidence:
        snippet: Notably, patients carrying identical deleterious variants exhibited substantial variability
          in clinical presentation and outcomes, indicating that no obvious genotype-phenotype correlation
          could be established based on the currently available data.
        supports: SUPPORT
