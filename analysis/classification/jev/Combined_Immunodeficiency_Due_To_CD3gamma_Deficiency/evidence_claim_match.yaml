      assertion_type: Pathophysiology
      assertion:
        name: Reduced Thymic Output and Altered T-Cell Homeostasis
        biological_scale: CELLULAR
        description: Human CD3G case studies infer reduced thymic output from low TRECs and naive-cell
          numbers despite preservation or later accumulation of peripheral polyclonal memory T cells.
          Absolute CD4/CD8 counts vary, and TCR/CD3-dependent gating can underestimate cells. The relative
          effects of production, selection, peripheral survival and treatment cannot be separated in every
          patient.
      selected_evidence:
        snippet: Thus, the peripheral T lymphocyte pool was comparatively well preserved in human CD3gamma
          deficiencies despite poor thymus output or clinical outcome.
        supports: SUPPORT
        directness: INDIRECT
