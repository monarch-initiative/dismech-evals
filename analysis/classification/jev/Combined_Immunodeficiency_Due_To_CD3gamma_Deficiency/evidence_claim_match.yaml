      assertion_type: Pathophysiology
      assertion:
        name: Impaired TCR/CD3 Complex Assembly and Surface Expression
        biological_scale: MOLECULAR
        description: CD3gamma deficiency lowers, without invariably abolishing, surface TCR/CD3 expression
          in human T cells. CD3G-knockdown Jurkat cells show unstable partial receptor ensembles, ER retention
          and deficient zeta-dimer incorporation, but their profound receptor loss does not quantitatively
          reproduce patient cells. Patient-cell reconstitution supports a role for CD3gamma in surface
          expression; the precise assembly/export constraints depend on the cellular system. Human gamma-delta
          receptors can incorporate CD3delta, providing a supported explanation for partial compensation
          in that lineage.
        protein_complexes:
        - preferred_term: alpha-beta T cell receptor complex
          modifier: DECREASED
          term:
            id: GO:0042105
            label: alpha-beta T cell receptor complex
        cell_types:
        - preferred_term: mature alpha-beta T cell
          term:
            id: CL:0000791
            label: mature alpha-beta T cell
      selected_evidence:
        snippet: 'Western blot analysis of PBMC-derived protein

          demonstrated complete absence of CD3 g expression, while ﬂow

          cytometry revealed reduced expression of the TCR/CD3 complex,

          conﬁrming the diagnosis of CD3 g deﬁciency (Figures 1B– D).'
        supports: SUPPORT
