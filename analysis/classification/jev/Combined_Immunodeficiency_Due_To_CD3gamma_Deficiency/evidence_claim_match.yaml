          help as a contributor to B-cell maturation failure. CD40L was measured after PMA/ionomycin,
          not direct TCR triggering; the CD3G-to-CD40L route and its prevalence remain unresolved, and
          the proposed Tfh/B-cell coculture was not performed.
      selected_evidence:
        snippet: 'The CD40L expression of activated CD4 + in the patient was around half that

          of the healthy control, while CD69 expression was used as an a ctivation marker after stimulation
          with 10 ng/mL PMA and 1 ug/m L ionomycin for 5 h. T wo duplicates

          were performed.'
        supports: SUPPORT
