        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mismatch_cd3g_mouse_vs_human
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Which developmental and receptor-composition differences explain retained human T cells,
          and how faithfully do these systems reproduce human tolerance defects?
        attaches_to:
        - pathophysiology#Distorted Thymic Selection and Self-Reactive Repertoire
        - pathophysiology#Impaired TCR/CD3 Complex Assembly and Surface Expression
        rationale: Cd3g-null mice retain only 2–5% of normal peripheral T cells. Human CD3delta rescues
          gamma-delta development in double-deficient mice, but this does not reconstruct the human alpha-beta/Treg
          pathway. Mature Jurkat knockdown and congenital patient-derived cells also differ; the immature-organ-culture
          perturbation in the 2021 study was CD3D. None of these observations proves that autoimmunity
          is absent from every model or that no model can study it.
      selected_evidence:
        snippet: Peripheral lymphoid organs are also practically devoid of T cells, with absolute numbers
          of peripheral T cells reduced to only 2-5% of those in normal mice.
        supports: SUPPORT
