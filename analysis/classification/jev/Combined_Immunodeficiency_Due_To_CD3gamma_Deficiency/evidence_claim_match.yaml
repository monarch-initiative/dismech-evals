              label: combined immunodeficiency due to CD3gamma deficiency
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Cd3g-deficient mouse
        species: Mouse
        genotype: Cd3g null (selective loss of CD3gamma expression)
        publication: PMID:9524111
        description: Cd3g-null mice have thymic cellularity below 1% and peripheral T-cell numbers at
          2–5% of normal, with severe impairment of both TCR lineages. This differs from the substantial
          peripheral T-cell compartment retained by many human patients, although human clinical disease
          can also be severe. Residual mouse cells are not described as wholly absent.
        modeled_mechanisms:
        - target: Impaired TCR/CD3 Complex Assembly and Surface Expression
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'The mouse does reproduce the receptor-expression defect: surface TCR and CD3epsilon
            are severely reduced on thymocytes and peripheral T cells.'
          limitations: The developmental and quantitative receptor deficits are more severe than in typical
            human cases. This limits direct translation to mature patient T cells, without proving that
            no mature-cell question can be studied in the model.
          readouts:
          - name: Surface TCR and CD3epsilon expression on thymocytes and peripheral T cells
            target: Impaired TCR/CD3 Complex Assembly and Surface Expression
            direction: DECREASED
            interpretation: The receptor-expression component of the human lesion is present in the mouse.
        - target: Distorted Thymic Selection and Self-Reactive Repertoire
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: The profound mouse developmental bottleneck does not reproduce the preserved, variably
            skewed peripheral repertoire studied in human autoimmune cohorts. The cited experiments do
            not directly establish fidelity for human Treg dysfunction or clinical autoimmunity.
          limitations: Peripheral mouse T cells are reduced to 2–5%, not absent. Human CD3delta rescues
            gamma-delta development in double-deficient mice, explaining a lineage-specific compensation
            mechanism; this does not fully explain preserved human alpha-beta development or establish
            all autoimmune outcomes in the model.
      selected_evidence:
        snippet: Peripheral lymphoid organs are also practically devoid of T cells, with absolute numbers
          of peripheral T cells reduced to only 2-5% of those in normal mice.
        supports: SUPPORT
