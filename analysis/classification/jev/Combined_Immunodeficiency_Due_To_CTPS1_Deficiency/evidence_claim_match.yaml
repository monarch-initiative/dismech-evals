            term:
              id: MONDO:0014391
              label: combined immunodeficiency due to CTPS1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure to Control Herpesvirus-Infected B Cells
        role: consequence
        biological_scale: ORGANISM
        description: 'The clinical centre of gravity of the disease. EBV is the pathogen that most stresses
          the capacity this disease removes, because containing it requires a large expansion of EBV-specific
          CD8 T cells against a B-cell population that EBV itself drives to proliferate; varicella zoster
          produces a comparable problem by a different route. There is a second, less-appreciated arm:
          EBV upregulates CTPS1 in the B cells it transforms, so the same enzyme is both the host defence
          bottleneck and a dependency of the transformed cell.'
      selected_evidence:
        snippet: the defective expansion of EBV-specific CD8 T cells results from mutations in genes involved
          in T-cell activation (such as RASGRP1, MAGT1, and ITK), DNA metabolism (CTPS1) or co-stimulatory
          pathways (CD70, CD27, and TNFSFR9 (also known as CD137/4-1BB)) leads to impaired elimination
          of proliferating EBV-infected B cells and the occurrence of lymphoma
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:31402499
      reference_title: 'Signaling pathways involved in the T-cell-mediated immunity against Epstein-Barr
        virus: Lessons from genetic diseases.'
      evidence_source: HUMAN_CLINICAL
      explanation: Places CTPS1 explicitly in the DNA-metabolism class of EBV-susceptibility genes, distinct
        from the activation and co-stimulation classes, and states the mechanism this node asserts.
