            term:
              id: MONDO:0014391
              label: combined immunodeficiency due to CTPS1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired T-Independent B-Cell Response to Polysaccharide Antigen
        role: consequence
        biological_scale: CELLULAR
        description: 'The arm of the disease that explains its bacterial half, and the reason this is
          called a combined immunodeficiency rather than a viral-susceptibility syndrome. Antibody responses
          to polysaccharide antigens do not require T-cell help, so they cannot be explained by the failure
          of T-cell immunity - but they do require the B cell to divide, which is what this disease removes.

          It also resolves an otherwise confusing laboratory picture: total immunoglobulin is normal or
          even elevated in these patients while specific antipneumococcal titres are low. Bulk antibody
          is not the problem; making a new clonal response is.'
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
      selected_evidence:
        snippet: This may directly participate to the susceptibility to encapsulated bacterial infections
          seen in CTPS1-deficient patients and account for the low titers of S. pneumoniae antibodies
          as it is a T-independent B-cell response.
        supports: SUPPORT
