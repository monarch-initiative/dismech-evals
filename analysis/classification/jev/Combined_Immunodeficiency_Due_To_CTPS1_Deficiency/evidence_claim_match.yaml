      assertion_type: Treatment
      assertion:
        name: Cytidine or CTP Supply Restoration
        therapeutic_modality: SMALL_MOLECULE
        description: 'Supplying the product the missing enzyme cannot make, or its nucleoside precursor,
          which the salvage pathway can convert. This restores proliferation of patient-derived cells
          in culture.

          It is curated as an experimental rationale rather than an established therapy, because the only
          evidence is in vitro rescue. Whether cytidine can be delivered to activated lymphocytes in vivo
          at the concentrations that work in culture is untested, and no patient has been reported treated
          this way.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: cytidine
            term:
              id: CHEBI:17562
              label: cytidine
      selected_evidence:
        snippet: Normal T-cell proliferation was restored in CTPS1-deficient cells by expressing wild-type
          CTPS1 or by addition of exogenous CTP or its nucleoside precursor, cytidine.
        supports: SUPPORT
