              label: combined immunodeficiency due to CTPS1 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CTPS1 Loss of Function from a Founder Splice Variant
        role: trigger
        biological_scale: MOLECULAR
        description: Homozygous loss-of-function variation in CTPS1. The human disease is defined by a
          single founder frameshift splice variant, c.1692-1G>C (p.T566Dfs26X), which removes exon 18
          from the transcript. How much protein survives is disputed - see the controversy recorded on
          this entry - but both readings agree that the enzyme activity available to an activated lymphocyte
          is grossly insufficient.
        genetic_context:
          gene:
            preferred_term: CTPS1
            term:
              id: hgnc:2519
              label: CTPS1
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          description: Recorded as PARTIAL_LOSS_OF_FUNCTION on the strength of the direct measurement
            in patient cells, which found 10-20% residual protein with normal per-molecule catalytic activity.
            The earlier transplant series describes the same allele as giving complete absence of protein.
            The partial reading is preferred here because it rests on a quantitative measurement made
            for that purpose, and because the mouse null is embryonic lethal while these patients survive
            to transplant.
      selected_evidence:
        snippet: Here we report the identification of a loss-of-function homozygous mutation (rs145092287)
          in CTPS1 in humans that causes a novel and life-threatening immunodeficiency, characterized
          by an impaired capacity of activated T and B cells to proliferate in response to antigen receptor-mediated
          activation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24870241
      reference_title: CTP synthase 1 deficiency in humans reveals its central role in lymphocyte proliferation.
      evidence_source: HUMAN_CLINICAL
      explanation: The gene-disease assignment from the study that made it, together with the defining
        cellular defect.
