      assertion:
        name: Failure to Expand the CTP Pool on Lymphocyte Activation
        role: central_effector
        biological_scale: MOLECULAR
        description: 'Antigen-receptor engagement normally triggers a sharp rise in CTPS1 expression and
          a corresponding rise in intracellular CTP, supplying the nucleotide demand of the DNA, RNA and
          phospholipid synthesis that clonal expansion requires. In deficiency that rise does not happen.
          This is the node at which the disease becomes lymphocyte-specific: resting cells need little
          CTP and are unaffected, and other tissues meet their demand through the CTPS2 isoform and nucleoside
          salvage.'
        genes:
        - preferred_term: CTPS1
          term:
            id: hgnc:2519
