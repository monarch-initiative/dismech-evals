        therapeutic_modality: OTHER
        description: 'Directed treatment of the EBV-driven complications rather than of the underlying
          defect. B-cell depletion removes the compartment EBV proliferates in, and adoptive transfer
          of EBV-specific cytotoxic T lymphocytes supplies from outside exactly the expanded effector
          population the patient cannot generate. The second of these is mechanistically the most precisely
          targeted therapy in this entry, since it substitutes for the specific failed step.

          Curated at the level the evidence supports: both were used in the transplant series, before
          and after transplant, and no comparative outcome is reported for either.'
        treatment_term:
          preferred_term: Therapeutic procedure
          term:
            id: NCIT:C49236
            label: Therapeutic Procedure
      selected_evidence:
        snippet: Four patients with EBV-driven LPD received rituximab and three EBV-specific cytotoxic
          T-lymphocytes (CTLs) (two pre-transplant and one post-transplant).
