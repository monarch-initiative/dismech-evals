        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic Haematopoietic Stem Cell Transplantation
        therapeutic_modality: CELL_THERAPY
        description: 'The only intervention that addresses the cause rather than the consequences, by
          replacing the lymphoid compartment with one that has a functioning enzyme. The defect is cell-intrinsic
          to haematopoietic cells and the enzyme is not secreted, so replacing the compartment is curative
          in principle and, in the published series, in practice.

          It is not a benign option, and this record keeps the cost next to the benefit. Overall survival
          in the largest series was 72%, below what the same centres achieve for other combined immunodeficiencies,
          and the deaths were from EBV reactivation and from unusually severe chronic graft-versus-host
          disease. Both failure modes are plausibly consequences of the underlying disease rather than
          of the transplant.'
        treatment_term:
          preferred_term: Hematopoietic cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
      selected_evidence:
        snippet: We report on 11 patients with CTPS1 mutations who underwent hematopoietic stem cell transplant
          (HSCT) at three UK centres (London, Manchester and Newcastle).
        supports: SUPPORT
