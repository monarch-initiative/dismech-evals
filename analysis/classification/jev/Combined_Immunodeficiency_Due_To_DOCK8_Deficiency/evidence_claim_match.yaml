            preferred_term: Combined immunodeficiency due to DOCK8 deficiency
            term:
              id: MONDO:0009478
              label: combined immunodeficiency due to DOCK8 deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Allogeneic Hematopoietic Stem Cell Transplantation
        description: 'The only curative therapy. Because DOCK8 is expressed almost exclusively in haematopoietic
          cells, replacing the haematopoietic compartment corrects the lesion at its source. In an 81-patient
          international cohort transplanted at a median age of 9.7 years, 84% were alive after a median
          26 months, with 89% survival after matched-related and 81% after matched-unrelated grafts. Transplantation
          restores lymphocyte differentiation and function and lowers total and allergen-specific IgE
          over time. Manifestations do not all respond equally: eczema, infections and mollusca resolve
          faster than food allergies or failure to thrive, and food allergy may persist.'
        therapeutic_modality: CELL_THERAPY
        treatment_term:
          preferred_term: allogeneic haematopoietic stem cell transplantation
          term:
            id: NCIT:C15431
            label: Hematopoietic Cell Transplantation
        notes: Interpreting per-manifestation response is complicated by somatic reversion, which can
          independently soften the allergic phenotype (see the DOCK8 somatic reversion genetic record).
      selected_evidence:
        snippet: HSCT is curative in most DOCK8-deficient patients, confirming this approach as the treatment
          of choice.
        supports: SUPPORT
