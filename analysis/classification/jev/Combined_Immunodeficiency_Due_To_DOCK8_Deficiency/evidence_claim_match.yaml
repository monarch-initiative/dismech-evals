      assertion_type: Genetic
      assertion:
        name: DOCK8 somatic reversion
        gene_term:
          preferred_term: DOCK8
          term:
            id: hgnc:19191
            label: DOCK8
        relationship_type: MODIFIER
        variant_origin: SOMATIC
        association: Somatic repair of the germline DOCK8 lesion — by second-site mutation, original-site
          back mutation, gene conversion or intragenic crossover — restores DOCK8 expression in a subset
          of lymphocytes, preferentially antigen-experienced T cells and NK cells rather than naive T
          or B cells. Revertant patients are older and have milder allergic disease, but infection susceptibility
          persists and reversion is not curative. It is the principal known within-patient modifier of
          disease severity, and is a further reason to interpret residual DOCK8 protein on a flow-cytometry
          assay carefully.
      selected_evidence:
        snippet: We identified 17 of 34 DOCK8-deficient patients who had germline mutations with variable
          degrees of reversion caused by somatic repair.
        supports: SUPPORT
