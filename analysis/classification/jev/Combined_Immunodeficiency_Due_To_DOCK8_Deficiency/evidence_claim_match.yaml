              label: combined immunodeficiency due to DOCK8 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of CDC42 Activation at the Leading-Edge Membrane
        biological_scale: MOLECULAR
        description: 'DOCK8 is a CDC42-specific atypical guanine nucleotide exchange factor whose DHR-2
          domain loads GTP onto CDC42. Its DHR-1 (C2-like) domain targets it to phosphoinositide-rich
          membrane, so DOCK8 acts locally rather than globally: in its absence, bulk cellular CDC42-GTP
          is unchanged but CDC42 activation at the leading-edge membrane fails, and with it amoeboid polarization.'
        biological_processes:
        - preferred_term: CDC42 activation at the leading-edge membrane
          term:
            id: GO:0032489
            label: regulation of Cdc42 protein signal transduction
          modifier: DECREASED
      selected_evidence:
        snippet: we show that DOCK8 is a Cdc42-specific guanine nucleotide exchange factor that is critical
          for interstitial DC migration
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22461490
      reference_title: DOCK8 is a Cdc42 activator critical for interstitial dendritic cell migration during
