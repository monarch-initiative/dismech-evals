            term:
              id: MONDO:0009478
              label: combined immunodeficiency due to DOCK8 deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: DOCK8
        gene_term:
          preferred_term: DOCK8
          term:
            id: hgnc:19191
            label: DOCK8
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: 'Biallelic loss-of-function variants in DOCK8 (9p24.3) cause the disease. DOCK8 encodes
          an atypical guanine nucleotide exchange factor for CDC42 that is expressed almost exclusively
          in immune cells. Nearly all reported alleles are null: large intragenic or whole-gene deletions
          and complex rearrangements predominate, with frameshift, nonsense and splice-site point mutations
          accounting for most of the remainder and missense variants being rare. The locus is unusually
          rich in repetitive sequence, which explains both the deletion-heavy mutational spectrum and
          the somatic recombination-mediated reversion seen in a substantial minority of patients.'
        notes: HGNC identifier verified against the HGNC REST API (rest.genenames.org), which returns
          hgnc_id HGNC:19191, symbol DOCK8, name "dedicator of cytokinesis 8", location 9p24.3, NCBI Gene
          81704, UniProt Q8NF50. The lowercase `hgnc:` form is this repository's convention. The same
          CURIE is already bound to DOCK8 in kb/disorders/Chronic_Mucocutaneous_Candidiasis.yaml.
      selected_evidence:
        snippet: "Novel homozygous or compound heterozygous \ndeletions and point mutations in the gene\
          \ encoding the dedicator of cytokinesis \n8 protein (DOCK8) led to the absence of DOCK8 protein\
          \ in lymphocytes."
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
