              label: combined immunodeficiency due to DOCK8 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Th17 Differentiation Block
        biological_scale: CELLULAR
        description: Naive CD4 T cells from DOCK8-deficient patients are profoundly blocked in differentiating
          to Th17 cells, and a missense variant that disrupts GEF activity while sparing protein expression
          reproduces the block — tying the defect to catalytic function rather than to a scaffolding role
          alone. The resulting collapse of IL-17/IL-22 mucocutaneous defence is the shared mechanism behind
          the candidiasis and staphylococcal susceptibility that DOCK8 deficiency and STAT3-HIES have
          in common.
        cell_types:
        - preferred_term: T-helper 17 cell
          term:
            id: CL:0000899
            label: T-helper 17 cell
        biological_processes:
        - preferred_term: T-helper 17 cell differentiation
          term:
            id: GO:0072539
            label: T-helper 17 cell differentiation
          modifier: DECREASED
      selected_evidence:
        snippet: DOCK8 interacts with STAT3 and regulates its activation and the outcome of STAT3-dependent
          TH17 differentiation. These findings might explain the phenotypic overlap between DOCK8 deficiency
          and autosomal dominant HIES.
        supports: SUPPORT
    origin:
