      assertion_type: Pathophysiology
      assertion:
        name: Defective NK Cell Lytic Immunological Synapse
        biological_scale: CELLULAR
        description: NK-cell killing requires focused F-actin accumulation at the lytic immunological
          synapse, driven by CDC42-activated WASP. DOCK8-deficient NK cells retain normal total F-actin
          but cannot concentrate it at the synapse, form defective conjugates, and fail to polarize LFA-1
          and cytolytic granules toward the target. Cytotoxicity is reduced and is not rescued by IL-2.
        cell_types:
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        biological_processes:
        - preferred_term: lytic immunological synapse formation
          term:
            id: GO:0001771
            label: immunological synapse formation
          modifier: DECREASED
        - preferred_term: natural killer cell mediated cytotoxicity
          term:
            id: GO:0042267
            label: natural killer cell mediated cytotoxicity
          modifier: DECREASED
      selected_evidence:
        snippet: NK cells depleted of DOCK8 showed defective conjugate formation, along with decreased
          polarization of LFA-1, F-actin, and cytolytic granules toward the cytotoxic synapse
        supports: SUPPORT
    origin:
