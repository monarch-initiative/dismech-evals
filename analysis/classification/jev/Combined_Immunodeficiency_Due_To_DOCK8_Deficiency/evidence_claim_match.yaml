              label: combined immunodeficiency due to DOCK8 deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Lymphocyte Cytothripsis During Interstitial Migration
        biological_scale: CELLULAR
        description: When DOCK8-deficient T and NK cells squeeze through confined, collagen-dense tissue
          such as dermis, they cannot maintain shape integrity. Chemotaxis itself is preserved, but the
          cells develop abnormal shape and nuclear deformation and rupture, dying by a distinctive catastrophic
          mode the discovering authors named cytothripsis. This is the mechanism that singles out the
          skin — where collagen makes up as much as a third of the wet weight — as the organ where DOCK8
          deficiency fails first.
        cell_types:
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
        biological_processes:
        - preferred_term: leukocyte migration through dense interstitium
          term:
            id: GO:0050900
            label: leukocyte migration
          modifier: ABNORMAL
        - preferred_term: catastrophic lymphocyte death during confined migration
          term:
            id: GO:0008219
            label: cell death
          modifier: INCREASED
      selected_evidence:
        snippet: We show that when DOCK8-deficient T and NK cells migrate through confined spaces, they
          develop cell shape and nuclear deformation abnormalities that do not impair chemotaxis but contribute
          to a distinct form of catastrophic cell death we term cytothripsis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25422492
      reference_title: DOCK8 regulates lymphocyte shape integrity for skin antiviral immunity.
