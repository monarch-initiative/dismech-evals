              label: combined immunodeficiency due to DOCK8 deficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Intracellular DOCK8 protein staining by flow cytometry
        description: 'Because nearly all patients lack DOCK8 protein entirely, intracellular staining
          for DOCK8 on peripheral blood mononuclear cells is a fast screen that avoids immunoblotting
          or sequencing. It also detects carriers and can track lineage-specific DOCK8 expression after
          transplantation. Residual expression does not exclude the diagnosis: somatic reversion restores
          DOCK8 in some antigen-experienced T and NK cells.'
        diagnosis_term:
          preferred_term: flow cytometry for intracellular DOCK8 expression
          term:
            id: NCIT:C16585
            label: Flow Cytometry
        results: Absent or markedly reduced intracellular DOCK8 protein
      selected_evidence:
        snippet: We present here a flow cytometry assay that could facilitate the diagnosis of DOCK8 deficiency,
          detection of carrier status, and investigation of lineage-specific DOCK8 expression following
          HCT.
        supports: SUPPORT
