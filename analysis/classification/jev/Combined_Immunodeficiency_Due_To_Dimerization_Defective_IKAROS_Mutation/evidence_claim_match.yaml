        - phenotypes#Anemia
        - phenotypes#Neutropenia
        - phenotypes#Vasculitis
        prompt: Are the cytopenias of dimerization-defective IKAROS disease autoimmune, marrow-intrinsic,
          or both, and what drives the vasculitis seen in some carriers?
        rationale: The founding cohort reported thrombocytopenia, anemia and neutropenia, some as Evans
          syndrome, which points to autoimmune destruction. IKAROS also regulates myeloid, megakaryocyte
          and erythroid differentiation, so impaired production is equally plausible. No study has separated
          the two in carriers of this allele class, so the cytopenia phenotypes carry no causal edge.
          The same holds for the ANCA-negative vasculitis and its pulmonary complications in the M494Vfs*86
          family, whose immune mechanism has not been studied.
      selected_evidence:
        snippet: Index patients presented with hematologic disease consisting of cytopenias (thrombocytopenia,
          anemia, neutropenia)/Evans syndrome and malignancies (T-cell acute lymphoblastic leukemia, Burkitt
          lymphoma).
        supports: SUPPORT
