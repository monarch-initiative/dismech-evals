      assertion_type: Pathophysiology
      assertion:
        name: IKZF1 Dimerization Domain Variant Disrupts IKAROS Dimerization
        biological_scale: MOLECULAR
        description: IKAROS uses its four N-terminal zinc fingers to bind DNA and its two C-terminal zinc
          fingers (ZF5 and ZF6) to form homodimers and heterodimers with HELIOS, AIOLOS and EOS. Germline
          heterozygous variants in ZF5 or ZF6 abolish or reduce both homo- and heterodimerization of the
          mutant protein.
        genes:
        - preferred_term: IKZF1
          term:
            id: hgnc:13176
            label: IKZF1
        molecular_functions:
        - preferred_term: IKAROS homodimerization
          term:
            id: GO:0042803
            label: protein homodimerization activity
          modifier: DECREASED
        - preferred_term: IKAROS heterodimerization with HELIOS, AIOLOS and EOS
          term:
            id: GO:0046982
            label: protein heterodimerization activity
          modifier: DECREASED
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          zygosity: HETEROZYGOUS
          variant_origin: GERMLINE
      selected_evidence:
        snippet: These dimerization defective mutants disrupt homo- and heterodimerization in a complete
          or partial manner, but they do not affect the wild-type allele function.
        supports: SUPPORT
