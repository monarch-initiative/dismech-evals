      assertion_type: Pathophysiology
      assertion:
        name: IKAROS Dimerization Haploinsufficiency
        biological_scale: MOLECULAR
        description: The mutant allele contributes few or no functional IKAROS dimers. The mutant protein
          loses pericentromeric heterochromatin targeting, binds DNA abnormally and fails to recruit the
          NuRD complex, so it cannot repress IKAROS target genes. It does not prevent the wild-type protein
          from reaching pericentromeric heterochromatin, so the net effect is a half-dose of IKAROS activity
          rather than dominant interference.
        genes:
        - preferred_term: IKZF1
          term:
            id: hgnc:13176
            label: IKZF1
        biological_processes:
        - preferred_term: IKAROS-mediated transcriptional repression
          term:
            id: GO:0000122
            label: negative regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: Rather, targeting was dependent on the amino-terminal DNA-binding zinc finger domain
          and carboxy-terminal dimerization domain of Ikaros.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/4
      context_paths:
