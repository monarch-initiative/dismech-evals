            term:
              id: MONDO:0979288
              label: combined immunodeficiency due to dimerization defective IKAROS mutation
        context: []
      assertion_type: Genetic
      assertion:
        name: IKZF1
        gene_term:
          preferred_term: IKZF1
          term:
            id: hgnc:13176
            label: IKZF1
        relationship_type: CAUSATIVE
        presence: PRESENT
        variant_origin: GERMLINE
        notes: 'Disease-causing variants map to ZF5 and ZF6 (the C-terminal dimerization domain). Not
          every ZF5/ZF6 missense variant is deleterious: in a systematic functional screen only some patient
          variants in this domain impaired dimerization, so a variant here needs functional testing before
          it is called causal.'
        variants:
        - name: IKZF1 p.Y503*
          description: ZF6 nonsense variant segregating in a family with B-cell acute lymphoblastic leukemia,
            recurrent infections and specific antibody deficiency, with three asymptomatic carriers. The
            mutant protein is unstable, dimerizes only residually, fails pericentromeric targeting and
            is poorly SUMOylated, without a dominant-negative effect on wild-type IKAROS.
        - name: IKZF1 p.M494Vfs*86
          description: ZF6 frameshift variant in a family with ANCA-negative vasculitis, B-cell lymphopenia,
            low IgG and poor vaccine responses, and one asymptomatic carrier. Mutant protein was undetectable
            and total IKAROS reduced in patient cells. The frameshift could not be reconstructed as a
            construct, so it was not tested for dimerization; it is assigned to this allele class by its
            ZF6 location.
      selected_evidence:
        snippet: IKZF1 | IKAROS family zinc finger 1 | hgnc:13176 | Disease-causing germline mutation(s)
          in
        supports: SUPPORT
