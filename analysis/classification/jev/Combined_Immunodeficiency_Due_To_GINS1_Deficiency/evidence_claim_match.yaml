      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic GINS1 Variants
        biological_scale: MOLECULAR
        description: 'Compound heterozygous GINS1 variants reduce, but never abolish, functional GINS1
          protein. Complete loss is not a possible disease state: homozygous null mutations of GINS component-encoding
          genes are embryonic lethal in mice, so every viable patient genotype is a partial one.

          '
        genes:
        - preferred_term: GINS1
          term:
            id: hgnc:28980
            label: GINS1
          modifier: DECREASED
        genetic_context:
          description: Compound heterozygous hypomorphic GINS1 alleles retaining 3-16% of normal activity.
            Complete biallelic loss is not represented among patients and is expected to be embryonic
            lethal, so the disease state is necessarily partial rather than complete loss of function.
          allele_type: SNV
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
        biological_processes:
        - preferred_term: DNA replication initiation
          modifier: DECREASED
          term:
            id: GO:0006270
            label: DNA replication initiation
      selected_evidence:
        snippet: The GINS complex is essential for eukaryotic DNA replication, and homozygous null mutations
          of GINS component-encoding genes are embryonic lethal in mice.
        supports: SUPPORT
