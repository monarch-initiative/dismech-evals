              label: combined immunodeficiency due to GINS1 deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gins1_no_model_reproduces_the_triad
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Bone Marrow Maturation Blockade of Granulocyte and NK Lineages
        - pathophysiology#Impaired NK Cell Differentiation
        prompt: No available model reproduces the human triad of growth retardation, neutropenia and NK
          cell deficiency together. Does a hypomorphic Gins1 knock-in reproduce it, and specifically does
          it reproduce the NK deficiency?
        rationale: The models split the disease rather than reproducing it. Complete GINS subunit loss
          in mice is embryonic lethal, so the null cannot be studied past peri-implantation. Psf1 heterozygosity
          gives a marrow proliferative defect, but only under 5-FU regenerative stress and with no reported
          NK phenotype - and the human genotype is not heterozygous null but compound hypomorphic at 3-16%
          residual activity, a lower dose than one intact allele. Patient fibroblasts reproduce the cellular
          replication phenotype faithfully but are not a haematopoietic lineage at all. The NK deficiency,
          which is the defining and most uniform feature of the human disease, is therefore modelled by
          nothing. A knock-in carrying a patient allele at patient dosage is the missing experiment, and
          until it exists the causal edge from the replication phenotype to the NK phenotype rests on
          human correlation across four CMG genes rather than on any model.
        proposed_experiments:
        - experiment_id: gins1_hypomorphic_knockin_nk_lineage
          name: Hypomorphic Gins1 knock-in mouse with NK lineage phenotyping
          description: Knock a patient GINS1 allele combination into mice to reach residual activity in
            the 3-16% range, then phenotype growth, neutrophil counts and NK cell development in parallel,
            with bone marrow progenitor immunophenotyping rather than peripheral counts alone.
          would_support:
          - pathophysiology#Impaired NK Cell Differentiation
          supporting_outcome:
          - A selective NK developmental block at patient-equivalent GINS1 dosage, alongside growth restriction
            and neutropenia, would establish the lineage selectivity as a dose-dependent property of the
            replication defect rather than a human-specific observation.
          refuting_outcome:
          - Proportionate impairment across lymphoid lineages, or an NK compartment spared at patient-equivalent
            dosage, would argue the human NK selectivity depends on something absent from the mouse and
            would redirect the question toward human NK developmental biology.
      selected_evidence:
        snippet: targeted disruption of SLD5 in mice causes a defect in cell proliferation in the inner
          cell mass, resulting in embryonic lethality at the peri-implantation stage
        supports: SUPPORT
