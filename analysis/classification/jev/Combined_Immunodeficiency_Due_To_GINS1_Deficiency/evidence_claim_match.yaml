        prompt: Why does a ubiquitous, quantitatively uniform defect in replicative helicase assembly
          selectively remove the NK lineage while largely sparing T and B cell numbers?
        rationale: Every cell in the body needs the CMG helicase, and the defect is present in every cell,
          yet the immune lesion is lineage-restricted. Until this is explained, the causal edge from the
          cellular replication phenotype to the NK phenotype is a correlation observed across four genes
          (MCM4, GINS1, MCM10, GINS4) rather than a mechanism. The review literature states the question
          is unresolved.
