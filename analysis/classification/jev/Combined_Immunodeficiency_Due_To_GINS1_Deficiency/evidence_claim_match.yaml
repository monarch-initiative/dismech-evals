        context:
        - path: /classifications
          value: {}
          role: ancestor
      assertion_type: IUISAssignment
      assertion:
        classification_value: innate immunity defect
        notes: 'Grouped with MCM4, MCM10 and GINS4 as CMG-helicase causes of NK cell deficiency, an innate-immunity
          defect. Note the tension with the MONDO label and the OMIM title, both of which call this a
          *combined* immunodeficiency: the T-cell compartment is measurably affected (low CD8+ T cells
          in early childhood in the two patients tested, slightly reduced in vitro T-cell proliferation
          in all patients), so the combined-immunodeficiency label is not simply wrong. The IUIS placement
          here reflects which lineage carries the defining and most consistent lesion, not a claim that
          T cells are spared.'
      selected_evidence:
        snippet: Natural killer cell deficiency (NKD) is one such IEI where natural killer (NK) cells
          are the main immune lineage affected.
        supports: SUPPORT
    origin:
      assertion_path: /classifications/iuis_category
