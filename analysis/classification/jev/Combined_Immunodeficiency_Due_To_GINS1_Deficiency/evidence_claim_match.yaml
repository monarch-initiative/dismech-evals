  f9807a6835cafd4fa09d988fc02592f1d839b168cd9211c056f3f98b49dcf587:
    claim:
      about:
        disease:
          name: Combined Immunodeficiency Due To GINS1 Deficiency
          disease_term:
            preferred_term: combined immunodeficiency due to GINS1 deficiency
            term:
              id: MONDO:0044725
              label: combined immunodeficiency due to GINS1 deficiency
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Psf1 (Gins1) heterozygous mouse
        species: Mouse
        genotype: Psf1 heterozygous; Sld5 (Gins4) heterozygous and null comparators
        publication: PMID:24244394
        description: 'Two things make this model informative, and they pull in opposite directions. Psf1
          haploinsufficiency causes failure of acute bone marrow haematopoietic stem cell proliferation
          during reconstitution after 5-FU ablation - the closest animal counterpart to the human marrow
          phenotype. But heterozygous deletion of Sld5, another GINS subunit, does not significantly affect
          bone marrow reconstitution, so the marrow requirement is not a generic property of GINS dosage.

          '
        modeled_mechanisms:
        - target: Bone Marrow Maturation Blockade of Granulocyte and NK Lineages
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'Reproduces a marrow proliferative failure from reduced Psf1 dosage, but only under
            regenerative stress and without the NK-lineage specificity that defines the human disease.

            '
          limitations: 'The mouse phenotype is elicited by 5-FU ablation rather than arising at baseline,
            so it models regenerative demand rather than the steady-state maturation blockade seen in
            patients. NK cell numbers are not reported. Mouse Psf1 heterozygosity is also not the human
            genotype: patients are compound heterozygous for hypomorphic alleles retaining 3-16% activity,
            which is a different and lower dose than one intact allele.'
          readouts:
          - name: Bone marrow HSC proliferation after 5-FU ablation
            target: Bone Marrow Maturation Blockade of Granulocyte and NK Lineages
            direction: DECREASED
            interpretation: Marrow proliferative failure attributable to reduced Psf1 dosage.
          - name: Bone marrow reconstitution in Sld5 heterozygotes
            target: Bone Marrow Maturation Blockade of Granulocyte and NK Lineages
            direction: UNCHANGED
            interpretation: A real negative result. Reduced dosage of a different GINS subunit does not
              reproduce the marrow phenotype, so the requirement is subunit-specific rather than a general
              consequence of GINS haploinsufficiency.
      selected_evidence:
        snippet: targeted disruption of SLD5 in mice causes a defect in cell proliferation in the inner
          cell mass, resulting in embryonic lethality at the peri-implantation stage
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24244394
      reference_title: Requirement of SLD5 for early embryogenesis.
      evidence_source: MODEL_ORGANISM
      explanation: 'Establishes the embryonic lethality of complete GINS-subunit loss in mice, which is
        why every viable human genotype is hypomorphic.

        '
