            description: MALT1 is a cysteine protease that cleaves negative regulators of NF-kappaB and
              mRNA-destabilising proteins. In one protease-dead knock-in mouse line the protease was largely
              dispensable for crossing the lymphocyte activation threshold but essential for regulatory
              T cell development, which is how one gene produces both immunodeficiency and immune dysregulation.
              A second protease-deficient line showed reduced T cell proliferation, IL-2 production and
              Th17 differentiation in vitro, so the protease also contributes to effector T cell responses.
            molecular_functions:
