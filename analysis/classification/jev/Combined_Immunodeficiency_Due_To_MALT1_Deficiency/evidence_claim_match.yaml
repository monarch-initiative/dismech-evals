        presence: PRESENT
        variant_origin: GERMLINE
        notes: 'Reported alleles span the protein: missense in the N-terminal CARD domain (p.Ser89Ile,
          the index family) and in the caspase-like domain (p.Asp471Asn), a further missense allele (p.Ile600Asn),
