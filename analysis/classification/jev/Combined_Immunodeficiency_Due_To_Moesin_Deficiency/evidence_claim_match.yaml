        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: xmaid_evidence_base_is_one_series
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: What is the natural history and treatment outcome of X-MAID beyond the founding series
          and a single transplant case?
        attaches_to:
        - disease#Combined Immunodeficiency Due To Moesin Deficiency
        - treatments#Allogeneic hematopoietic stem cell transplantation
        rationale: 'Nearly all the clinical content of this entry comes from one 2016 series of seven
          males from five families, with an independent exome diagnosis confirming the gene in one further
          patient. The only curated treatment evidence is a single transplant case report.

          That is enough to establish the disease and its mechanism, and not enough to say how it behaves
          over time or how well transplantation works. Specifically unaddressed: whether the fluctuating
          cytopenias fluctuate predictably or progress, whether the varicella susceptibility persists
          after immune reconstitution, what proportion of patients need transplantation rather than immunoglobulin
          replacement and prophylaxis, and whether the autoimmune arm predicted by the mouse CD8+ Treg
          finding appears in patients followed long enough.

          The last of these is the sharpest, because the mouse and the human series currently point in
          different directions: the mouse loses self-tolerance, the patients present with infection.'
      selected_evidence:
        snippet: We investigated 7 male patients (from 5 different families)
        supports: SUPPORT
