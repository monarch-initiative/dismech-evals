        notes: 'MSN encodes moesin, one of the three ERM (ezrin-radixin-moesin) proteins that cross-link
          cortical actin to the plasma membrane. The gene is on the X chromosome, which is why the disorder
          is X-linked and all reported patients are male.

          The binding here is hgnc:7373. Note that a substring search for "MSN" in HGNC also returns SAMSN1
          (hgnc:10528) and MSNP1 (hgnc:7374), the moesin pseudogene; the CURIE bound here was resolved
          with an exact-label lookup for that reason.'
