      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: symptomatic_cmamma_mitochondrial_model
        hypothesis_label: Mitochondrial inefficiency as the cause of symptomatic CMAMMA
        status: EMERGING
        description: Selected clinical series report childhood metabolic decompensation and adult neurologic
          or psychiatric disease in individuals with CMAMMA, and ACSF3 knockout cells show impaired mitochondrial
          metabolism. Whether that mitochondrial defect causes these clinical features is unsettled. An
          unselected, newborn-screened cohort had a favorable course regardless of treatment, and its
          authors suggest that CMAMMA is probably benign and that symptomatic cases may reflect ascertainment
          bias. The edges from the mitochondrial node to clinical phenotypes are grouped here so they
          read as a contested model rather than an established causal chain.
      selected_evidence:
        snippet: After uneventful early decades, four patients were diagnosed in adulthood with neurological
          manifestations (seizures, memory problems, psychiatric disease, and/or cognitive decline) without
          vitamin B12 deficiency.
        supports: SUPPORT
