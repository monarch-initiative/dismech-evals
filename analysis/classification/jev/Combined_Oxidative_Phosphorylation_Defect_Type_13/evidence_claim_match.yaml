        role: driver
        mechanism_confidence: ESTABLISHED
        description: 'PNPase is catalytically active only as a trimer, with the active site inside the
          toroidal core the six RNase PH domains build between them, so the disease alleles converge on
          the same functional endpoint by different structural routes. Blue-native gels of fibroblasts
          from the founding patient found no PNPase complex at all; the same was true of the Australian
          siblings'' fibroblasts. Structural work refined that picture: p.Gln387Arg and p.Glu475Gly do
          not simply prevent oligomerisation, they force a dimer whose KH and S1 domains can no longer
          engage RNA. Not every allele works this way - the Leigh-syndrome alleles left the trimer intact
          and instead disabled RNA processing directly, so trimer integrity is not a reliable functional
          screen.'
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        molecular_functions:
        - preferred_term: polyribonucleotide nucleotidyltransferase activity
          term:
            id: GO:0004654
            label: polyribonucleotide nucleotidyltransferase activity
          modifier: DECREASED
        - preferred_term: 3'-5' RNA exonuclease activity
          term:
            id: GO:0000175
            label: 3'-5'-RNA exonuclease activity
          modifier: DECREASED
      selected_evidence:
        snippet: The trimerization of PNPase is essential for the RNA processing and transportation function
          of PNPase protein
        supports: SUPPORT
