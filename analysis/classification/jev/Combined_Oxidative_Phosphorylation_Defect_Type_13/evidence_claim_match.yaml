        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial Double-Stranded RNA Accumulation and Cytosolic Escape
        biological_scale: CELLULAR
        role: driver
        mechanism_confidence: PROVISIONAL
        description: Bidirectional transcription of the compact circular mitochondrial genome generates
          overlapping complementary transcripts capable of forming long duplexes. The SUV3-PNPase degradosome
          normally keeps this species highly unstable. When PNPase is lost the duplexes accumulate and
          escape into the cytosol - and, notably, that escape is itself PNPase-dependent, so the enzyme
          has a dual role in preventing both formation and release. This has been shown in patients carrying
          hypomorphic PNPT1 mutations, not only in knockdown cells. Confidence is PROVISIONAL because
          it is the accumulation, not its contribution to the patients' clinical features, that has been
          demonstrated.
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: patients carrying hypomorphic mutations in the gene PNPT1, which encodes PNPase, display
          mitochondrial double-stranded RNA accumulation coupled with upregulation of interferon-stimulated
          genes and other markers of immune activation
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30046113
      reference_title: Mitochondrial double-stranded RNA triggers antiviral signalling in humans.
      evidence_source: HUMAN_CLINICAL
      explanation: The observation in PNPT1 patients themselves, which is what makes this branch part
        of the disease rather than only a cell-biology finding.
