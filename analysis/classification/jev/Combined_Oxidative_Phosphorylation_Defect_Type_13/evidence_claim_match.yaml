            label: Autosomal recessive inheritance
        description: 'Every reported COXPD13 patient carries two PNPT1 alleles - homozygous missense substitutions
          in consanguineous families, or compound heterozygous pairs in outbred ones, with each parent
          heterozygous for one allele. No patient with a biallelic null genotype has been described, and
          constitutive Pnpt1 knockout is embryonic lethal in the mouse, so living patients are expected
          to retain residual PNPase function.

          Note that heterozygous PNPT1 variants are not silent: truncating alleles in the S1 domain cause
          dominantly inherited spinocerebellar ataxia type 25, a separate entity from this recessive disease.'
      selected_evidence:
        snippet: Bi-allelic pathogenic PNPT1 variants cause heterogeneous clinical phenotypes affecting
          multiple organs without any established genotype-phenotype correlations.
        supports: SUPPORT
