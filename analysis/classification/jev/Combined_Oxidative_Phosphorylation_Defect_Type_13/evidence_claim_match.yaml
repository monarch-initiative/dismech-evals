        role: driver
        mechanism_confidence: ESTABLISHED
        description: 'In the matrix, PNPase partners the ATP-dependent helicase SUV3 as the mitochondrial
          RNA degradosome, which processes polycistronic transcripts and clears degradation intermediates.
          In patient cells this fails visibly: unprocessed intermediates from the ND6 region of the mitochondrial
          genome and small mRNA fragments accumulate in myoblasts, and unprocessed transcripts accumulate
          in fibroblasts. This is the branch of the mechanism that is directly measurable in patients,
          and it is more sensitive than downstream respiratory-chain enzymology.'
        locations:
        - preferred_term: mitochondrial matrix
          term:
