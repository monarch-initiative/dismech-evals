      assertion_type: Pathophysiology
      assertion:
        name: Type I Interferon Activation
        biological_scale: ORGANISM
        role: modifier
        mechanism_confidence: PROVISIONAL
        description: 'Some patients with biallelic PNPT1 variants have a chronically elevated interferon
          signature in blood, and at least one presented as Aicardi-Goutieres syndrome with a massively
          elevated interferon score on longitudinal assessment. Two unrelated patients in a neuroimaging
          series had cystic leukoencephalopathy resembling RNASET2 deficiency, Aicardi-Goutieres syndrome
          or congenital CMV - imaging that is characteristic of an interferonopathy rather than of a respiratory-chain
          disorder.

          This node is deliberately typed as a modifier and not as an obligatory step. The interferon
          response is documented in PNPT1 deficiency and plainly dominates some presentations; what has
          not been shown is how much it contributes to the encephalopathy of a typical COXPD13 patient.
          See the corresponding entry under discussions.'
        biological_processes:
        - preferred_term: type I interferon-mediated signaling pathway
          term:
            id: GO:0060337
            label: type I interferon-mediated signaling pathway
          modifier: INCREASED
      selected_evidence:
        snippet: Longitudinal assessment of the interferon signature showed a massively elevated interferon
          score and chronic type I interferon-mediated autoinflammation.
        supports: SUPPORT
