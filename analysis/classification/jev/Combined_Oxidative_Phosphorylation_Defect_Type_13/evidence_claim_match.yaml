      assertion_type: AnimalModel
      assertion:
        name: Pnpt1 knockout mouse embryonic fibroblasts and conditional hair-cell knockout
        species: Mouse
        genotype: Pnpt1 knockout (MEF clones) and Atoh1-Cre conditional deletion in cochlear hair cells
        publication: PMID:30024931
        description: The only reported mammalian model of PNPase loss. Constitutive knockout is embryonic
          lethal, so the work uses knockout mouse embryonic fibroblasts adapted to respiratory deficiency
          and a hair-cell-restricted conditional deletion. The hair-cell arm reproduces the human auditory
          phenotype directly; the fibroblast arm reproduces the bioenergetic failure but adds a lesion
          - complete mtDNA loss - that is not a feature of the human hypomorphic disease.
        modeled_mechanisms:
        - target: Cochlear Hair Cell and Auditory Neuron Dysfunction
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Deleting Pnpt1 in cochlear hair cells produces progressive hearing loss, which
            the authors relate directly to the human PNPT1 hearing phenotype.
          limitations: A complete knockout restricted to one cell type, whereas patients carry hypomorphic
            alleles expressed everywhere - so the model isolates the cochlear contribution but cannot
            say whether human hearing loss is hair-cell-autonomous. The relevant human comparator is also
            the allelic DFNB70 deafness phenotype rather than COXPD13 itself, in which hearing loss is
            one feature among many.
          readouts:
          - name: Progressive hearing loss in hair-cell knockout mice
            target: Cochlear Hair Cell and Auditory Neuron Dysfunction
            direction: DECREASED
            interpretation: Auditory function declines over time after hair-cell-restricted Pnpt1 deletion,
              the animal counterpart of the human sensorineural loss.
        - target: Cellular Energy Failure in High-Demand Tissues
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          description: Knockout fibroblasts are respiration-deficient and grow slowly, with a transcriptional
            profile resembling mtDNA-deleted rho-zero cells.
          limitations: Fidelity is LOW because the model reaches the energy deficit by a different route
            than the disease does. Complete PNPase loss caused mitochondrial DNA to be lost outright,
            whereas the Leigh-syndrome patient's mtDNA abundance was normal and the proximal defect was
            post-transcriptional RNA metabolism. A null model of an essential gene is a loss-of-function
            boundary, not a genotype-matched model of a hypomorphic human allele.
          readouts:
          - name: Biomass accumulation rate of knockout fibroblasts
            target: Cellular Energy Failure in High-Demand Tissues
            direction: DECREASED
            interpretation: A quantitative growth readout of the respiratory deficiency, standing in for
              the ATP deficit measured in patient fibroblasts.
      selected_evidence:
        snippet: we established PNPase knockout (PKO) systems by first shifting culture conditions to
          enable cell growth with defective respiration
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
