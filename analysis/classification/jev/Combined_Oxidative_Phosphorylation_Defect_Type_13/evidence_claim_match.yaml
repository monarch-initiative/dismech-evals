      assertion_type: Diagnosis
      assertion:
        name: Functional assay of mitochondrial RNA processing
        description: For a novel or uncertain allele, the informative assay is the RNA one - Northern
          blot or RNA sequencing for unprocessed mitochondrial transcripts and degradation intermediates
          - not respiratory-chain enzymology. This is not a preference but a measured difference in sensitivity,
          and it inverts the usual mitochondrial-disease workup order. Complementation with wild-type
          PNPT1 in patient cells is the confirmatory step used in three separate families.
      selected_evidence:
        snippet: Our findings suggest that functional analyses of the RNA processing function of PNPase
          are more sensitive than testing downstream defects in oxidative phosphorylation (OXPHPOS) enzyme
          activities.
        supports: SUPPORT
