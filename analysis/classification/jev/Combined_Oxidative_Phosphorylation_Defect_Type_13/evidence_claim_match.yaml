            label: mitochondrial RNA catabolic process
          modifier: DECREASED
      selected_evidence:
        snippet: Our evidence indicates that PNPase activity is essential for the correct maturation of
          the ND6 transcripts, and likely for the efficient removal of degradation intermediates.
