      assertion_type: Diagnosis
      assertion:
        name: Trio exome or genome sequencing including PNPT1
        description: 'Molecular diagnosis is the route in practice, and every published case was made
          this way. A panel restricted to Leigh-syndrome or encephalopathy genes can miss the presentations
          that begin as axonal neuropathy, delayed myelination, or an interferonopathy, so a broad nuclear
          mitochondrial-disease panel or exome with parental segregation is the safer test. Zygosity and
          allele class must be read carefully: biallelic missense means COXPD13, while a heterozygous
          truncating or splice allele in the S1 domain means SCA25.'
      selected_evidence:
        snippet: Our data emphasise the value of WES even in patients with apparently normal results of
          OXPHOS respiratory chain enzymology
