            term:
              id: MONDO:0013977
              label: combined oxidative phosphorylation defect type 13
        context:
        - path: /genetic/0
          value:
            name: PNPT1
            gene_term:
              preferred_term: PNPT1
              term:
                id: hgnc:23166
                label: PNPT1
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            association: 'PNPT1 encodes the human polynucleotide phosphorylase, a 3''-5'' phosphorolytic
              exoribonuclease whose catalytically active form is a trimer. Each protomer carries two RNase
              PH domains joined by an alpha-helical domain plus KH and S1 RNA-binding domains, and an
              N-terminal targeting sequence directs the protein to mitochondria. Disease alleles are missense
              and act by several distinct structural routes rather than by simple loss of expression.

              PNPT1 is unusual among mitochondrial disease genes in carrying three separate inherited
              phenotypes on different allele classes. Biallelic hypomorphic missense alleles cause this
              disease (COXPD13, OMIM 614932). A distinct biallelic allele, p.Glu475Gly, was reported in
              a Moroccan family with autosomal recessive nonsyndromic hearing impairment, DFNB70 (OMIM
              614934) - curated separately, though long-term follow-up of one such family found the "isolated"
              deafness later evolving into multisystem neurodegeneration, so the two may be ends of one
              spectrum rather than distinct entities. Heterozygous truncating and splice variants in the
              S1 domain cause dominant spinocerebellar ataxia type 25, a third and clearly separate entity.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: PNPT1 c.1160A>G (p.Gln387Arg)
        description: The founding homozygous allele, reported in two siblings of consanguineous Moroccan
          parents with severe encephalomyopathy and choreoathetosis. It abolishes the PNPase trimer in
          patient fibroblasts. Structural work later showed that this substitution and p.Glu475Gly both
          break the protomer-protomer interface, so the enzyme assembles as a catalytically poor dimer
          rather than failing to assemble at all.
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Other disease-associated hPNPase variants with single amino acid substitutions, Q387R
          and E475G, disrupt the protomer-protomer interface within the trimer, resulting in the formation
          of dimers rather than the catalytically active trimers.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0/variants/0
      evidence_path: /genetic/0/variants/0/evidence/1
      context_paths:
      - /name
      - /disease_term
      - /genetic/0
    evidence_metadata:
      reference: PMID:40996428
      reference_title: Human polynucleotide phosphorylase in mitochondrial RNA metabolism.
      evidence_source: OTHER
      explanation: Resolves the structural consequence of this allele - a defective dimer, not an absence
        of oligomer.
