        role: driver
        mechanism_confidence: PROVISIONAL
        description: 'Mammalian mitochondria import a small set of nuclear-encoded noncoding RNAs - 5S
          rRNA, the RNase MRP and RNase P RNAs, some tRNAs and miRNAs - and PNPase is one of the few identified
          components of that route. Fibroblasts from the founding patient imported significantly less
          5S rRNA and MRP-related RNA, and fibroblasts from the Japanese siblings imported less RNase
          P RNA. Both defects were corrected by re-expressing wild-type PNPT1.

          Confidence is PROVISIONAL rather than ESTABLISHED because how much of the disease runs through
          this branch is genuinely contested. The Leigh-syndrome patient''s alleles impaired RNA processing
          with the trimer intact, and the authors of that study note that the role and location of PNPase
          within human mitochondria remain controversial.'
