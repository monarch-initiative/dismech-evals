  c6726ec4d9dc036bf55d551940afc2bc56fcc2f96f1bdf22caf4ea318544994a:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 13
          disease_term:
            preferred_term: Combined oxidative phosphorylation defect type 13
            term:
              id: MONDO:0013977
              label: combined oxidative phosphorylation defect type 13
        context: []
      assertion_type: Genetic
      assertion:
        name: PNPT1
        gene_term:
          preferred_term: PNPT1
          term:
            id: hgnc:23166
            label: PNPT1
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: 'PNPT1 encodes the human polynucleotide phosphorylase, a 3''-5'' phosphorolytic exoribonuclease
          whose catalytically active form is a trimer. Each protomer carries two RNase PH domains joined
          by an alpha-helical domain plus KH and S1 RNA-binding domains, and an N-terminal targeting sequence
          directs the protein to mitochondria. Disease alleles are missense and act by several distinct
          structural routes rather than by simple loss of expression.

          PNPT1 is unusual among mitochondrial disease genes in carrying three separate inherited phenotypes
          on different allele classes. Biallelic hypomorphic missense alleles cause this disease (COXPD13,
          OMIM 614932). A distinct biallelic allele, p.Glu475Gly, was reported in a Moroccan family with
          autosomal recessive nonsyndromic hearing impairment, DFNB70 (OMIM 614934) - curated separately,
          though long-term follow-up of one such family found the "isolated" deafness later evolving into
          multisystem neurodegeneration, so the two may be ends of one spectrum rather than distinct entities.
          Heterozygous truncating and splice variants in the S1 domain cause dominant spinocerebellar
          ataxia type 25, a third and clearly separate entity.'
        variants:
        - name: PNPT1 c.1160A>G (p.Gln387Arg)
          description: The founding homozygous allele, reported in two siblings of consanguineous Moroccan
            parents with severe encephalomyopathy and choreoathetosis. It abolishes the PNPase trimer
            in patient fibroblasts. Structural work later showed that this substitution and p.Glu475Gly
            both break the protomer-protomer interface, so the enzyme assembles as a catalytically poor
            dimer rather than failing to assemble at all.
          clinical_significance: PATHOGENIC
        - name: PNPT1 c.760C>A / c.1528G>C (p.Gln254Lys / p.Ala510Pro)
          description: Compound heterozygous alleles in two brothers from a non-consanguineous family
            with severe axonal neuropathy, optic atrophy, intellectual disability and auditory neuropathy.
            Patient fibroblasts had markedly reduced PNPT1 message and protein and no detectable PNPase
            complex, and expression of wild-type PNPT1 rescued complex I and IV activity.
          clinical_significance: PATHOGENIC
        - name: PNPT1 c.1399C>T (p.Pro467Ser)
          description: Homozygous allele in a patient whose presentation was an Aicardi-Goutieres-like
            interferonopathy with early-onset encephalopathy, neurodevelopmental regression, secondary
            microcephaly and white-matter hyperintensities, with a persistently elevated interferon score.
            Structurally it lies in an RNase PH2 loop near the S1 domain and favours the enzyme's open
            conformation, impairing RNA degradation without disrupting the trimer.
          clinical_significance: PATHOGENIC
        - name: PNPT1 c.1453A>G (p.Met485Val)
          description: Homozygous allele in a 34-month-old boy with global developmental delay, hypotonia,
            hearing impairment, chorea and dystonia, whose imaging added delayed myelination, progressive
            basal ganglia atrophy and brainstem signal change. Crystallographic modelling placed the substitution
            at the protein's active site.
          clinical_significance: PATHOGENIC
        - name: PNPT1 c.1033A>G (p.Lys345Glu)
          description: Homozygous allele in the first reported Chinese patient, a boy with multiorgan
            involvement, white-matter change, epilepsy, global developmental delay, growth retardation
            and visual and auditory impairment. Pathogenicity here rests on structural prediction rather
            than on a functional assay, which is weaker than the evidence behind the earlier alleles.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: PNPT1 is a mitochondrial RNA transport protein that has been linked to two discrete phenotypes,
          namely isolated sensorineural hearing loss (OMIM 614934) and combined oxidative phosphorylation
          deficiency (OMIM 614932).
        supports: SUPPORT
