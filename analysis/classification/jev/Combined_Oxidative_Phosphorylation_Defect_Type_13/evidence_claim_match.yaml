      assertion_type: Pathophysiology
      assertion:
        name: Cellular Energy Failure in High-Demand Tissues
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'With several respiratory complexes under-assembled, cells cannot meet their ATP
          demand oxidatively and lean on glycolysis. Tissues differ in how much slack they have, and the
          disease''s organ selectivity follows that gradient: the basal ganglia and brainstem, cerebral
          white matter, the cochlea, the optic pathway and skeletal muscle are the ones that fail. The
          tissue-by-tissue enzymology in the Leigh-syndrome autopsy makes the gradient explicit rather
          than assumed.'
        biological_processes:
        - preferred_term: aerobic respiration
          term:
            id: GO:0009060
            label: aerobic respiration
          modifier: DECREASED
      selected_evidence:
        snippet: Exogenous expression of wild-type PNPT1, but not mutants, rescued ATP production in patient
          skin fibroblasts, suggesting the pathogenicity of the identified mutations.
