            term:
              id: MONDO:0013987
              label: combined oxidative phosphorylation defect type 15
        context: []
      assertion_type: Genetic
      assertion:
        name: MTFMT
        notes: MTFMT (15q22.31) encodes the mitochondrial methionyl-tRNA formyltransferase that generates
          fMet-tRNA(Met) for translation initiation. The recurrent c.626C>T allele is hypomorphic — it
          alters splicing but permits residual full-length protein — which is the accepted explanation
          for the comparatively mild course of MTFMT-related Leigh syndrome.
        gene_term:
          preferred_term: MTFMT
          term:
            id: hgnc:29666
            label: MTFMT
        relationship_type: CAUSATIVE
        variants:
        - name: MTFMT c.626C>T
          description: The recurrent founder allele, present in 11 of 13 index cases in the 2014 cohort
            and among the most frequent disease alleles across OXPHOS disorders as a class.
          type: splice-affecting substitution
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: Using targeted sequencing of the mtDNA and nuclear exons encoding the mitochondrial proteome
          (MitoExome), we identified compound heterozygous mutations in MTFMT in two unrelated children
          presenting with Leigh syndrome and combined OXPHOS deficiency.
        supports: SUPPORT
    origin:
