      assertion:
        name: Biallelic ELAC2 Variants
        biological_scale: MOLECULAR
        description: Missense, nonsense, frameshift and canonical splice-site variants across ELAC2. In
          the reported genotypes at least one allele is typically a missense or splice variant that leaves
          some activity; a conditional mouse knockout is lethal, so complete loss is not expected to be
          compatible with a liveborn phenotype, although no human genotype has been shown to be fully
          null.
        genes:
        - preferred_term: ELAC2
          term:
            id: hgnc:14198
            label: ELAC2
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          gene:
            preferred_term: ELAC2
            term:
              id: hgnc:14198
              label: ELAC2
          notes: Recorded as partial loss of function because the recurrent missense alleles reduce but
            do not abolish RNase Z activity in vitro (p.Phe154Leu and p.Thr520Ile at 20-80% of wild-type
            kcat/KM), and the splice alleles reduce ELAC2 expression. Zygosity and allele type are left
            off because both vary between families.
      selected_evidence:
        snippet: We report the identification of mutations in ELAC2 in five individuals with infantile
          hypertrophic cardiomyopathy and complex I deficiency.
        supports: SUPPORT
