        context: []
      assertion_type: Genetic
      assertion:
        name: ELAC2
        notes: Encodes the long form of RNase Z (RNase ZL), dual targeted to mitochondria and nucleus.
          The recurrent c.460T>C (p.Phe154Leu) allele is an Arabian founder variant. ClinGen classifies
          ELAC2 as Definitive for autosomal recessive "mitochondrial disease" (MONDO:0044970), a lumped
          ClinGen disease rather than this entry's MONDO term, so it is cited as evidence but not recorded
          as gene_disease_validity. ELAC2 was earlier proposed as a hereditary prostate cancer susceptibility
          gene; that association concerns common or rare heterozygous variants, has been contested, and
          is a separate question that this entry does not curate.
        gene_term:
          preferred_term: ELAC2
          term:
            id: hgnc:14198
            label: ELAC2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: A total of 34 individuals from 23 consanguineous families were identified, of whom 30
          were genetically confirmed to harbor the homozygous ELAC2 founder variant c.460T>C; p.(Phe154Leu).
        supports: SUPPORT
