  95158d1d70c4ff15195e2d997fbe618c14aba1479b757ae780abd50f73177e23:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 17
          disease_term:
            preferred_term: combined oxidative phosphorylation defect type 17
            term:
              id: MONDO:0014190
              label: combined oxidative phosphorylation defect type 17
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Mitochondrial RNase Z Activity
        biological_scale: MOLECULAR
        description: 'Two routes lead to the same deficit. Most missense substitutions leave a stable
          recombinant protein with reduced catalytic efficiency, mostly through lower kcat; the reduction
          ranges from moderate (p.Phe154Leu, p.Thr520Ile) to about 1% of wild type (p.Pro493Leu, p.Tyr729Cys).
          Other variants, including the c.1423+2T>A splice allele and the variants in the 2023 French
          series, reduce ELAC2 expression or protein abundance in patient cells. ELAC2 is dual targeted:
          translation from the first AUG produces the mitochondrial isoform and from the second AUG a
          nuclear isoform, and the disease mechanism curated here concerns the mitochondrial activity.
          ELAC2 acts in a complex with the MRPP1/MRPP2 (TRMT10C/HSD17B10) subcomplex, which retains the
          5''-processed tRNA and enhances 3'' cleavage.'
        genes:
        - preferred_term: ELAC2
          term:
            id: hgnc:14198
            label: ELAC2
        molecular_functions:
        - preferred_term: 3'-tRNA processing endoribonuclease activity
          modifier: DECREASED
          term:
            id: GO:0042781
            label: 3'-tRNA processing endoribonuclease activity
      selected_evidence:
        snippet: In particular, the p.Pro493Leu and p.Tyr729Cys substitutions most severely impaired enzyme
          function, resulting in ~1% of WT enzyme activity.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
