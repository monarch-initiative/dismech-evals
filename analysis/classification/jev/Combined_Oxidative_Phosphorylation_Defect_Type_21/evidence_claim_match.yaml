      assertion_type: Pathophysiology
      assertion:
        name: TARS2 Biallelic Loss of Function
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: 'TARS2 encodes a 718-residue mitochondrial threonyl-tRNA synthetase with four domains:
          an N1 domain, an editing domain that clears mischarged seryl-tRNA-Thr, an aminoacylation domain,
          and an anticodon-binding domain. Disease variants are predominantly missense and cluster in
          three places: the Rag GTPase-binding region between the editing and catalytic core domains,
          the editing domain, and the anticodon-binding domain. Recurrent alleles are common, including
          p.(Thr157Arg), which recurs in Chinese families and is absent from other populations, and p.(Pro155Leu),
          p.(Glu512Lys) and p.(Ser258Leu), each seen in more than one unrelated family.

          Which domain an allele hits matters. Variants in the Rag-binding region behave differently from
          the rest, both in the laboratory and in the clinic, and are the basis of the second mechanistic
          hypothesis curated here.'
        genes:
        - preferred_term: TARS2
          term:
            id: hgnc:30740
            label: TARS2
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
          description: Biallelic germline variants, homozygous in consanguineous families and compound
            heterozygous otherwise. Categorised as partial rather than complete loss of function because
            the near absence of truncating alleles indicates that complete loss is not compatible with
            life.
        molecular_functions:
        - preferred_term: threonine-tRNA ligase activity
          modifier: DECREASED
          term:
            id: GO:0004829
            label: threonine-tRNA ligase activity
      selected_evidence:
        snippet: Some missense variants cluster, such as those in the TARS2-Rag GTPase binding region
          and in the editing and AB domains.
        supports: SUPPORT
