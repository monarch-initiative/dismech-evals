      assertion:
        name: Systematic Cardiac, Renal and Auditory Screening
        description: 'Not a diagnostic test for the disorder but a recommendation that follows from it.
          Cardiomyopathy, renal tubular acidosis and hearing loss each occur in a minority, each is easy
          to miss without being sought, and the cohort authors note that all three may be underestimated
          because no affected individual had a specific work-up. All three are also actionable: one patient
          reached end-stage kidney disease by four and a half years.'
      selected_evidence:
        snippet: A cardiological evaluation, urine analysis for tubulopathy and hearing screening is warranted
          in patients with biallelic TARS2 variants.
