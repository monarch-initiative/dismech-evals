        - path: /animal_models/0
          value:
            name: Zebrafish tars2 morpholino knockdown
            species: Zebrafish
            genotype: tars2 splice-blocking morpholino knockdown
            publication: PMID:37454282
            description: 'A morpholino knockdown of tars2 in zebrafish embryos, validated by rescue with
              either zebrafish tars2 or human TARS2 messenger RNA, which is what establishes that the
              phenotypes are specific to loss of Tars2 and that the function is conserved. The model was
              then used as an assay: seventeen human variants were tested for their ability to rescue,
              and none rescued fully.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Progressive Cerebellar and Cerebral Atrophy
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Morphants show reduced head size, a smaller cerebellum, extensive brain apoptosis,
          reduced myelination and increased seizure-associated gene expression, which map onto the human
          microcephaly, cerebellar atrophy, white matter change and epilepsy. It is partial rather than
          full recapitulation because the model produces developmental hypoplasia in an embryo rather
          than the progressive postnatal atrophy that characterises the human disease, and because heart
          edema is a morphant phenotype without a direct human counterpart.
        limitations: Morpholino knockdown is a transient, dose-dependent reduction rather than a model
          of the human hypomorphic missense alleles, and morpholinos are known to produce off-target phenotypes.
          The rescue experiments control for that but do not make the knockdown a genetic model of the
          disease. The readouts are embryonic, so nothing in this model speaks to the progressive postnatal
          course.
        readouts:
        - name: Head size at 3 days post fertilization
          target: Progressive Cerebellar and Cerebral Atrophy
          direction: DECREASED
          interpretation: Reduced head size in morphants, restored by co-injection of wild-type zebrafish
            or human messenger RNA.
        - name: Cerebellum area in the Tg(olig2:DsRed2) reporter line
          target: Progressive Cerebellar and Cerebral Atrophy
          direction: DECREASED
          interpretation: Smaller cerebellum in morphants, the readout chosen because cerebellar atrophy
            dominates the human imaging.
        - name: Myelination and seizure-associated gene expression
          target: Progressive Cerebellar and Cerebral Atrophy
          direction: ALTERED
          interpretation: Reduced mbpa, the myelin basic protein transcript, and elevated c-fos, a marker
            of seizure activity.
      selected_evidence:
        snippet: This evidence confirms that the observed phenotypes resulted from tars2 downregulation
          and demonstrates functional conservation across species.
        supports: SUPPORT
    origin:
