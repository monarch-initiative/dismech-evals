              id: MONDO:0014398
              label: combined oxidative phosphorylation defect type 21
        context: []
      assertion_type: Genetic
      assertion:
        name: TARS2
        notes: 'TARS2 encodes the mitochondrial threonyl-tRNA synthetase. The mutational spectrum is dominated
          by missense variants and by recurrence: of the twenty-four families reported by 2023, seventeen
          carried a recurrent variant. Recurrent alleles include p.(Thr157Arg), which is a Chinese-specific
          founder variant recurring in six Chinese individuals and absent from other populations, plus
          p.(Pro155Leu), p.(Glu512Lys), p.(Ser258Leu), p.(Phe323Cys) and p.(Arg346Cys). Two splice variants
          also recur, c.387+6T>C and c.695+3A>G.

          Genotype-phenotype correlation is weak but not absent. p.(Pro155Leu) was associated with a severe
          phenotype in two unrelated individuals, while p.(Glu512Lys) and p.(Ser258Leu) were associated
          with moderate intellectual disability and milder motor and cerebellar dysfunction. Variants
          in the Rag-binding region behave as a group: all but one individual carrying them in compound
          heterozygosity showed basal ganglia and cerebellar signal change without cerebellar atrophy,
          and one of them, p.(Arg327Gln), is the allele associated with neonatal diabetes.'
        gene_term:
          preferred_term: TARS2
          term:
            id: hgnc:30740
            label: TARS2
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
      selected_evidence:
        snippet: It is noteworthy that 17 of the 24 families reported to date harbor recurrent TARS2 variants
        supports: SUPPORT
