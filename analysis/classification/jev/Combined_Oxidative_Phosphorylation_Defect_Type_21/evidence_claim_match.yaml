              label: combined oxidative phosphorylation defect type 21
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Rag GTPase Binding and mTORC1 Dysregulation
        biological_scale: MOLECULAR
        role: intermediate
        mechanism_confidence: PROVISIONAL
        description: 'The non-translational arm. mTORC1 is recruited to and activated at the lysosomal
          surface by Rag GTPases in response to amino acid availability, and TARS2 is part of how threonine
          availability is read: on threonine supplementation it binds RagC preferentially and drives the
          conversion of the Rag heterodimer to its active form. The region responsible, residues 301 to
          381, sits between the editing and catalytic core domains, and four disease variants fall inside
          it. All four bound RagA and RagC significantly less than wild type.

          The confidence is PROVISIONAL and the limitations are specific. The transfected variant constructs
          also had reduced basal expression, between 39 and 66 percent of wild type, which the authors
          attribute to intrinsic instability, so reduced binding cannot be entirely separated from reduced
          protein. mTORC1 activity itself was not measured in patient cells. What is measured downstream
          comes from the zebrafish knockdown, where two mTORC1 targets move in opposite directions as
          expected.'
        biological_processes:
        - preferred_term: TORC1 signaling
          modifier: DYSREGULATED
          term:
            id: GO:0038202
            label: TORC1 signaling
      selected_evidence:
        snippet: Upon threonine supplementation, TARS2 preferentially binds RagCGTP and promotes the conversion
          of inactive Rag GTPases (RagAGDP/RagCGTP) into the active form (RagAGTP/RagCGDP). This is sufficient
          to recruit mTORC1 to lysosomes.
        supports: SUPPORT
