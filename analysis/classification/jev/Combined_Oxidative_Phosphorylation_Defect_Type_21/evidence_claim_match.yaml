              label: combined oxidative phosphorylation defect type 21
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: noncanonical_mtorc1_model
        hypothesis_label: Reduced Rag GTPase binding and mTORC1 dysregulation
        status: EMERGING
        description: 'A mechanism that does not involve translation at all. TARS2 senses threonine and
          binds Rag GTPases at the lysosome, which recruits and activates mTORC1. A cluster of disease
          variants falls in the residue 301 to 381 region that mediates that binding and reduces it, downstream
          mTORC1 targets are dysregulated in a zebrafish knockdown, and one Rag-binding-region variant
          is associated with neonatal diabetes, a beta cell phenotype where mTORC1 is essential and which
          the translation model does not predict.

          It is EMERGING rather than CANONICAL for three reasons. The binding reduction was measured by
          co-immunoprecipitation of transfected constructs, and those constructs also had reduced basal
          expression, so reduced binding and reduced protein cannot be fully separated. mTORC1 activity
          itself was not measured in patient cells, only inferred. And the in vivo evidence is a morpholino
          knockdown in zebrafish rather than a model of the human alleles.'
      selected_evidence:
        snippet: In vitro studies showed that variants within the TARS2301-381 region had decreased binding
          to Rag GTPases, likely impairing mTORC1 activity.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
