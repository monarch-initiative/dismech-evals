        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: canonical_aminoacylation_model
        hypothesis_label: Impaired mitochondrial aminoacylation and combined respiratory chain deficiency
        status: CANONICAL
        description: The mechanism shared by the whole family of mitochondrial aminoacyl-tRNA synthetase
          disorders. Reduced TARS2 protein lowers the supply of charged mitochondrial threonyl-tRNA, mitochondrial
          translation of the thirteen mitochondrially encoded respiratory chain subunits falls, and the
          four complexes that contain those subunits are deficient together while complex II is spared.
          This is the model the disease was named for, and it is supported by direct measurement in patient
          material and by rescue of the respiratory defect on re-expression of wild-type TARS2.
      selected_evidence:
        snippet: The amount of VARS2 and TARS2 proteins and valyl-tRNA and threonyl-tRNA levels were decreased
          in samples of afflicted patients according to the genetic defect.
        supports: SUPPORT
