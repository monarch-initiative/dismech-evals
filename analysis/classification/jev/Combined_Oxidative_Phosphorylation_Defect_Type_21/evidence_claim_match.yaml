        context: []
      assertion_type: Diagnosis
      assertion:
        name: Respiratory Chain Enzymology in Muscle
        description: 'Historically the route to the diagnosis, and still informative when positive, but
          its limitations are the reason it no longer leads. The combined deficiency is found in muscle
          tissue and not reliably in fibroblasts or liver, so tissue choice determines the answer. Even
          in muscle it is inconsistent: of two patients biopsied in the largest cohort, one showed complex
          I deficiency and the other showed nothing. A normal or isolated result therefore does not exclude
          the diagnosis.'
      selected_evidence:
        snippet: Only 2 patients underwent muscle biopsy showing features of complex I deficiency in 1
          of them.
        supports: SUPPORT
