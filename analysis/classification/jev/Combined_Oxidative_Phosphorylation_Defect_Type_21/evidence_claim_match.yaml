  462e6eff3a4728c22f9a450fac8564d984fdd53753e1cf2147220d6d96b4f10e:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 21
          disease_term:
            preferred_term: combined oxidative phosphorylation defect type 21
            term:
              id: MONDO:0014398
              label: combined oxidative phosphorylation defect type 21
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coxpd21_two_mechanisms_relative_contribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How much of the phenotype comes from impaired mitochondrial translation and how much from
          impaired mTORC1 signalling, and does the answer differ by which domain a variant hits?
        attaches_to:
        - pathophysiology#Combined Respiratory Chain Complex Deficiency
        - pathophysiology#Reduced Rag GTPase Binding and mTORC1 Dysregulation
        - pathophysiology#Progressive Cerebellar and Cerebral Atrophy
        rationale: 'Two mechanisms are curated here as separate hypothesis groups, and the honest position
          is that their relative contribution is unknown. The translational one is established: reduced
          synthetase, reduced charged tRNA, combined respiratory chain deficiency, rescued by wild-type
          TARS2. The mTORC1 one is supported but not established, and the evidence for it is indirect
          at every step.

          There are three concrete reasons to think it is not merely a laboratory artefact. Four disease
          variants cluster in the residue 301 to 381 Rag-binding region, which is not where you would
          put variants if aminoacylation were the only thing that mattered. Those variants group clinically
          as well as biochemically, showing basal ganglia and cerebellar signal change without cerebellar
          atrophy. And one of them, p.(Arg327Gln), is associated with neonatal diabetes, a beta cell phenotype
          that the translational model does not predict and that no other TARS2 allele produces.

          Against that, the binding experiments used transfected constructs whose basal expression was
          itself reduced to between 39 and 66 percent of wild type, so less binding and less protein are
          confounded. mTORC1 activity was never measured in patient cells. And the in vivo evidence is
          a morpholino knockdown, which removes the protein altogether and therefore cannot separate a
          specific Rag-binding defect from general loss of the synthetase.

          The question is not academic. The cohort authors end by asking whether mTORC1 drug modulators
          could be therapeutic here, and that question cannot be answered without knowing whether mTORC1
          dysregulation drives the phenotype or accompanies it.'
        proposed_experiments:
        - experiment_id: coxpd21_patient_cell_mtorc1_activity
          name: Direct measurement of mTORC1 activity in patient cells stratified by variant domain
          description: Measure mTORC1 activity, by phosphorylation of S6 kinase and 4E-BP1 under threonine
            withdrawal and repletion, in fibroblasts from patients carrying Rag-binding-region variants
            against patients carrying catalytic or editing domain variants and against controls. This
            tests the step the current evidence infers rather than measures, and the domain stratification
            is what would show whether the mTORC1 arm is variant-specific.
        - experiment_id: coxpd21_separation_of_function_alleles
          name: Separation-of-function allele series in a knock-in cell model
          description: Engineer knock-in alleles at the endogenous locus rather than transfecting constructs,
            so protein level is set by the allele rather than by transfection, and measure aminoacylation
            and Rag binding independently in each. This removes the expression confound that currently
            prevents the binding result from being read cleanly.
        - experiment_id: coxpd21_beta_cell_model_of_r327q
          name: Beta cell model of the p.(Arg327Gln) allele
          description: Differentiate beta cells from induced pluripotent stem cells carrying p.(Arg327Gln)
            and test insulin secretion, survival and mTORC1 activity against isogenic controls and against
            a catalytic-domain variant. The neonatal diabetes association is the single strongest human
            argument for the mTORC1 arm, and this is what would turn it from an association into a mechanism.
      selected_evidence:
        snippet: Besides impaired aminoacylation, other factors have been reported to explain the variety
          of phenotypes present in ARS2-related disorders. These factors include non-canonical functions,
          tissue-specific developmental differences in energy requirements, and downstream effects of
          mitochondrial dysfunction on other intracellular organelles.
        supports: SUPPORT
