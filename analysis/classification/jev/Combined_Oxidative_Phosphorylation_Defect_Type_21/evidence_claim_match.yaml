        phase: Outcome and mortality
        notes: 'Mortality is substantial and early. Three of eighteen individuals in the largest cohort
          died within the first two years of life, of cardiorespiratory failure in the context of infection
          or under palliative care. In the four individuals with the p.(Arg327Gln) diabetes phenotype,
          all four died before 24 months. Among survivors, function is severely limited: at last evaluation
          only four of eighteen could walk without support and eight were nonverbal. There is no published
          survival curve, and these are counts from two small series rather than a natural-history study.'
      selected_evidence:
