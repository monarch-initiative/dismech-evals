          matrix. This complex process requires ribosomal and transfer RNAs (rRNAs and tRNAs), encoded
          by mtDNA, and more than 100 proteins, encoded by nuclear genes, translated by cytosolic ribosomes
          and imported into mitochondria.
        supports: SUPPORT
