        - path: /pathophysiology/5
          value:
            name: Reduced Rag GTPase Binding and mTORC1 Dysregulation
            biological_scale: MOLECULAR
            role: intermediate
            mechanism_confidence: PROVISIONAL
            description: 'The non-translational arm. mTORC1 is recruited to and activated at the lysosomal
              surface by Rag GTPases in response to amino acid availability, and TARS2 is part of how
              threonine availability is read: on threonine supplementation it binds RagC preferentially
              and drives the conversion of the Rag heterodimer to its active form. The region responsible,
              residues 301 to 381, sits between the editing and catalytic core domains, and four disease
              variants fall inside it. All four bound RagA and RagC significantly less than wild type.

              The confidence is PROVISIONAL and the limitations are specific. The transfected variant
              constructs also had reduced basal expression, between 39 and 66 percent of wild type, which
              the authors attribute to intrinsic instability, so reduced binding cannot be entirely separated
              from reduced protein. mTORC1 activity itself was not measured in patient cells. What is
              measured downstream comes from the zebrafish knockdown, where two mTORC1 targets move in
              opposite directions as expected.'
            biological_processes:
            - preferred_term: TORC1 signaling
              modifier: DYSREGULATED
              term:
                id: GO:0038202
                label: TORC1 signaling
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Progressive Cerebellar and Cerebral Atrophy
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        hypothesis_groups:
        - noncanonical_mtorc1_model
        description: Proposed as a route to the neurodevelopmental phenotype independent of the respiratory
          chain defect, acting through neuronal proliferation and apoptosis. The intermediates between
          mTORC1 dysregulation and the human brain phenotype are not established, hence the indirect link
          type.
      selected_evidence:
        snippet: Taken together, our results suggest that TARS2 plays an essential role in early CNS development,
          possibly affecting neuronal proliferation and apoptosis through aberrant mTORC1 signaling.
        supports: SUPPORT
