      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mitochondrial Translation
        biological_scale: MOLECULAR
        description: Wobble hypomodification degrades codon-anticodon pairing, so synthesis of the thirteen
          mtDNA-encoded respiratory chain subunits falls. The founding series calls this a severe mitochondrial
          translation defect. Because those thirteen subunits are distributed across complexes I, III,
          IV and V, the downstream deficiency is combined rather than isolated - which is the structural
          reason this disease is named as a combined oxidative phosphorylation defect.
        biological_processes:
        - preferred_term: mitochondrial translation
          modifier: DECREASED
          term:
            id: GO:0032543
            label: mitochondrial translation
      selected_evidence:
        snippet: Mutations in GTPBP3 are associated with a severe mitochondrial translation defect
        supports: SUPPORT
