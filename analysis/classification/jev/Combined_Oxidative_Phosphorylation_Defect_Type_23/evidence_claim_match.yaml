        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: MTO1 deficiency (COXPD10)
        description: The closest differential by some distance, and the one this entry exists to distinguish
          itself from. MTO1 encodes the partner subunit of the same wobble-uridine taurinomethylation
          enzyme, and MTO1 deficiency presents with the same infantile hypertrophic cardiomyopathy with
          lactic acidosis. dismech curates it separately as MTO1_Deficiency. Two things separate the two
          entities. Clinically, the founding GTPBP3 series observed that, unlike MTO1 patients, most GTPBP3
          patients develop neurological symptoms with thalamic, putaminal and brainstem MRI involvement
          resembling Leigh syndrome. Cellularly, the two defects drive the HIF-PPAR-gamma-UCP2-AMPK axis
          in opposite directions. Neither difference is a diagnostic test - separation in practice rests
          on sequencing - but the second is the only known biological asymmetry between two defects in
          one reaction.
      selected_evidence:
        snippet: In contrast to individuals with mutations in MTO1, the protein product of which is predicted
          to participate in the generation of the same modification, most individuals with GTPBP3 mutations
          developed neurological symptoms and MRI involvement of thalamus, putamen, and brainstem resembling
          Leigh syndrome.
        supports: SUPPORT
