              label: combined oxidative phosphorylation defect type 23
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Taurinomethyluridine Modification of Mitochondrial tRNAs
        biological_scale: MOLECULAR
        description: GTPBP3 and MTO1 jointly catalyse the formation of 5-taurinomethyluridine at the wobble
          (position 34) uridine of five mitochondrial tRNAs - those for Gln, Glu, Lys, Leu(UUR) and Trp.
          GTPBP3 contributes the potassium-dependent GTPase activity and binds methylene-tetrahydrofolate;
          the modification promotes decoding at cognate codons and restricts mispairing at near-cognate
          ones. Patient alleles reduce or abolish that activity, and structural work on individual variants
          shows multimerisation, aggregation and proteasomal degradation of the protein as the route to
          it.
        genes:
        - preferred_term: GTPBP3
          term:
            id: hgnc:14880
            label: GTPBP3
        biological_processes:
        - preferred_term: mitochondrial tRNA wobble uridine modification
          modifier: DECREASED
          term:
            id: GO:0070900
            label: mitochondrial tRNA modification
      selected_evidence:
        snippet: consistent with the predicted function of the protein in catalyzing the formation of
          5-taurinomethyluridine (τm(5)U) in the anticodon wobble position of five mitochondrial tRNAs.
        supports: SUPPORT
    origin:
