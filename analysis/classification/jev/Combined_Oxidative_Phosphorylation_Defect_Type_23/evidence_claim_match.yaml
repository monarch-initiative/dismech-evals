      assertion_type: Genetic
      assertion:
        name: GTPBP3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: GTPBP3
          term:
            id: hgnc:14880
            label: GTPBP3
        notes: 'GTPBP3 is a nuclear gene on chromosome 19p13.11 encoding mitochondrial GTP-binding protein
          3, the GTPase half of the two-enzyme system that installs 5-taurinomethyluridine on five mitochondrial
          tRNAs. ClinGen''s Mitochondrial Diseases expert panel classifies the gene-disease relationship
          as Definitive with loss of function as the mechanism, and has lumped every GTPBP3 phenotype
          into one entity.

          A naming trap worth recording. ClinGen curated this gene twice: against Leigh syndrome spectrum
          in 2020, reaching Moderate, and then against primary mitochondrial disease in 2024, reaching
          Definitive. The later curation explicitly includes the three cases from the earlier one. Both
          assertions are live in the ClinGen download, and a curator who picks the 2020 record will report
          a weaker classification against a narrower disease than the panel currently holds. This entry
          cites the 2024 record.

          A second trap, in the literature rather than the ontology. One 2026 report gives COXPD23 the
          OMIM number 608536; that is the number for the GTPBP3 gene, and the disease is OMIM 616198.
          The entry uses 616198 and does not repeat the error.'
      selected_evidence:
        snippet: In summary, there is definitive evidence to support the relationship between GTPBP3 and
          primary mitochondrial disease.
        supports: SUPPORT
