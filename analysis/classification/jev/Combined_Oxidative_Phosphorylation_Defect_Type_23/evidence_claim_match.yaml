              label: combined oxidative phosphorylation defect type 23
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic GTPBP3 Variant
        biological_scale: MOLECULAR
        description: 'Two damaged copies of GTPBP3. The allelic spectrum is broad - missense, frameshift,
          in-frame deletion, nonsense and splice-site changes are all reported - and the mechanism is
          loss of function. Two quantitative observations give that reading its force: loss-of-function
          variants are markedly over-represented in patients relative to gnomAD, and patient variants
          cluster significantly in the TrmE-type G domain that binds guanine nucleotides and Mg2+ and
          hydrolyses GTP. The recurrent c.689A>C (p.Gln230Pro) allele is a hotspot, particularly in Chinese
          cohorts.'
        genes:
        - preferred_term: GTPBP3
          term:
            id: hgnc:14880
            label: GTPBP3
        genetic_context:
          genes:
          - preferred_term: GTPBP3
            term:
              id: hgnc:14880
              label: GTPBP3
          allele_type: missense, frameshift, in-frame deletion, nonsense and splice-site alleles
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Biallelic in every reported family, homozygous or compound heterozygous. ClinGen
            records loss of function as the mechanism of disease.
          notes: 'The zygosity slot is single-valued and HOMOZYGOUS is chosen because homozygosity is
            the configuration that carries the genotype-phenotype signal in this disease - it is significantly
            over-represented in the severe cluster. Compound heterozygosity is at least as common overall
            and is recorded in the description and in the inheritance block. The loss-of-function category
            is not a default: it rests on the over-representation of loss-of-function alleles relative
            to population data, on the clustering of patient variants in the catalytic G domain, and on
            direct measurement of reduced GTPase activity for individual alleles.'
      selected_evidence:
        snippet: Compared with the variants in gnomAD, the proportion of LOFVs in GTPBP3 was higher in
          COXPD23 patients (48.6% versus 8.9%, p < 0.0001 ****), and 31% of them were frameshift variants,
          showing the LOF mechanism of GTPBP3.
        supports: SUPPORT
