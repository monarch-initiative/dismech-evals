      assertion_type: AnimalModel
      assertion:
        name: Gtpbp3 patient-allele knock-in mice
        species: Mouse
        genotype: homozygous E230P, homozygous N374D, and compound heterozygous E230P/N374D knock-in
        publication: PMID:41957021
        description: 'The first mammalian models of this disease, reported in 2026 and built to carry
          the patient''s own alleles rather than a null. The result splits by genotype: homozygous N374D
          is embryonic lethal, while homozygous E230P and compound heterozygous E230P/N374D animals survive
          and develop cardiac and muscular dysfunction attributed to altered mitochondrial translation.
          That split is itself informative, because the two alleles came from one compound-heterozygous
          patient.'
        modeled_mechanisms:
        - target: Impaired Mitochondrial Translation
          relationship: RECAPITULATES
          fidelity: HIGH
          description: The surviving knock-in genotypes develop cardiac and muscular dysfunction that
            the authors attribute to altered mitochondrial translation, which is the same causal step
            the human entry asserts.
          limitations: A mouse, and one reported in a single 2026 paper with no independent replication.
            The lethal genotype cannot be studied postnatally at all, so the model covers the milder half
            of the allelic range by construction. The mouse phenotype is described as cardiac and muscular;
            no thalamic or encephalopathic phenotype is reported, so the neurological half of the human
            disease remains unmodelled in any mammal.
          readouts:
          - name: Survival by knock-in genotype
            target: Impaired Mitochondrial Translation
            direction: ALTERED
            interpretation: Homozygous N374D is embryonic lethal while homozygous E230P and the compound
              heterozygote survive with cardiac and muscular dysfunction, so allele severity orders the
              mouse phenotype as it appears to order the human one.
        - target: Loss of Taurinomethyluridine Modification of Mitochondrial tRNAs
          relationship: RESCUES
          fidelity: MODERATE
          description: Virus-mediated expression of Gtpbp3 reversed the mitochondrial dysfunction and
            pathology in these animals as well as in cells, which is the first intervention result reported
            for this disease.
          limitations: Preclinical. This is a mouse rescue in a single study; no human trial exists and
            none is registered. The report does not establish durability, dose, delivery route in humans,
            or whether the neurological phenotype - absent from the mouse - would respond at all. Reading
            it as a therapy in prospect for patients would go beyond what the source claims.
          readouts:
          - name: Mitochondrial function and pathology after virus-mediated Gtpbp3 expression
            target: Loss of Taurinomethyluridine Modification of Mitochondrial tRNAs
            direction: RESTORED
            interpretation: Mitochondrial dysfunction and pathology reverse in both cells and animals
              after exogenous Gtpbp3 expression.
      selected_evidence:
        snippet: pathogenic studies based on mammalian animal models of hGTPBP3 deficiency are currently
          lacking
        supports: SUPPORT
