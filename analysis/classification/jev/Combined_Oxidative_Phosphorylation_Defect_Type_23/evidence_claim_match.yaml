              both the functional and histological level, which is what makes it usable as the tissue-level
              evidence for a node that has never been biopsied in a patient.
            limitations: A complete knockout in a fish, against biallelic missense and truncating alleles
              in humans, several of which retain partial activity. The cardiac readout is embryonic and
              the human cardiomyopathy is progressive over years. Nothing here models the encephalopathy
