      assertion_type: Discussion
      assertion:
        discussion_id: coxpd23_vs_mto1_same_reaction_two_diseases
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#GTPBP3-Specific Metabolic Reprogramming
        - pathophysiology#Thalamic and Brainstem Injury
        prompt: Why are GTPBP3 and MTO1 deficiency not the same disease, given that the two proteins catalyse
          the same modification?
        rationale: 'They should be the same disease and they nearly are. GTPBP3 and MTO1 form a complex
          and install one modification on five mitochondrial tRNAs; both deficiencies present as infantile
          hypertrophic cardiomyopathy with lactic acidosis, and the standard advice is that they are separated
          by sequencing rather than by phenotype. dismech curates them as separate entries, and MTO1_Deficiency
          lists this disease as its closest differential.

          Two asymmetries are nonetheless on record. The clinical one comes from the founding GTPBP3 series:
          in contrast to MTO1 patients, most GTPBP3 patients developed neurological symptoms with thalamic,
          putaminal and brainstem MRI involvement resembling Leigh syndrome. The cellular one is sharper
          and more surprising. MTO1-deficient fibroblasts inactivate AMPK, down-regulate UCP2 and PPAR-gamma
          and activate HIF-1; GTPBP3-depleted cells do the exact opposite on all four. The authors of
          that study draw the obvious conclusion - that one of the two proteins must do something besides
          tRNA modification - and stop there.

          What remains open is which protein, and what the something is. The candidates are not equally
          testable: an additional GTPBP3 function, an additional MTO1 function, or a difference in how
          the two partial complexes behave when one subunit is missing rather than an extra function in
          either. A cytoplasm-localised GTPBP3 isoform has been described and called an unknown potential
          noncanonical function, which is at least a place to look. Until that is resolved, the clinical
          difference between the two entities has no mechanistic explanation, and this entry does not
          offer one.'
        proposed_experiments:
        - experiment_id: exp_coxpd23_reciprocal_reprogramming
          name: Test whether the reprogramming difference survives complementation
          description: Express wild-type GTPBP3 in MTO1-deficient cells and wild-type MTO1 in GTPBP3-deficient
            cells, and read out AMPK phosphorylation, UCP2, PPAR-gamma and HIF-1 in each. If the axis
            is driven by an extra function of one protein, only that protein's own complementation should
            normalise it, and cross-complementation should not. If instead the difference arises from
            how the residual partial complex behaves, both should partially normalise. The experiment
            distinguishes the two accounts without needing to identify the extra function first.
          readouts:
          - name: HIF-PPAR-gamma-UCP2-AMPK axis state after complementation
            target: pathophysiology#GTPBP3-Specific Metabolic Reprogramming
            direction: RESTORED
            interpretation: Normalisation only on same-gene complementation would support an additional
              function in one protein; partial normalisation in both directions would support a complex-level
              explanation instead.
          would_support:
          - pathophysiology#GTPBP3-Specific Metabolic Reprogramming
          supporting_outcome:
          - Gene-specific normalisation of the axis would establish that the divergence is a property
            of the individual protein rather than of the partial complex.
      selected_evidence:
        snippet: In contrast to individuals with mutations in MTO1, the protein product of which is predicted
          to participate in the generation of the same modification, most individuals with GTPBP3 mutations
          developed neurological symptoms and MRI involvement of thalamus, putamen, and brainstem resembling
          Leigh syndrome.
        supports: SUPPORT
