      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        description: 'GTPBP3 is nuclear-encoded and autosomal, and every reported family is biallelic
          - either homozygous, typically in consanguineous unions, or compound heterozygous. Segregation
          has been demonstrated repeatedly: in the Italian sibship both variants were inherited one from
          each parent, were present in the affected sister and absent in a healthy brother; in an adult
          hypertrophic cardiomyopathy case the two alleles traced to the mother and the paternal grandmother
          respectively. The homozygous-versus-compound-heterozygous distinction is not merely bookkeeping
          here - homozygosity is over-represented in the severe cluster.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: By whole-exome and candidate gene sequencing, we identified 11 individuals from 9 families
          carrying compound heterozygous or homozygous mutations in GTPBP3, encoding the mitochondrial
          GTP-binding protein 3.
        supports: SUPPORT
