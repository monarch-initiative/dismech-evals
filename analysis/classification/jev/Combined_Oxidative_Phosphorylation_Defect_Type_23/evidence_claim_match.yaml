        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        - animal_models#Mouse
        prompt: Is there a disease-modifying treatment for COXPD23?
        rationale: 'Not for patients. What exists is a 2026 preclinical result: virus-mediated GTPBP3
          expression reversed mitochondrial dysfunction and pathology in patient-allele knock-in mice
          and in cells. That is the first intervention data of any kind for this disease and it is curated
          under animal_models, with its limitations attached, rather than under treatments.

          The gap between that and a therapy is wide and specific. The mouse models cover only the surviving
          genotypes - the homozygous N374D knock-in is embryonic lethal - so the severe end of the allelic
          range is unmodelled. The mouse phenotype is cardiac and muscular; no thalamic or encephalopathic
          phenotype is reported in any mammal, so the neurological half of the human disease has not been
          shown to respond to anything. No trial is registered. And the disease''s own natural history
          complicates any future trial design: outcome in the milder cluster is determined by progression
          of cardiomyopathy over years, and neither lactate nor MRI predicts severity, so there is no
          validated surrogate endpoint to run a trial against.

          What patients actually receive is the generic mitochondrial cocktail - levocarnitine, thiamine,
          ascorbic acid, riboflavin, idebenone - and drug-responsive antiseizure medication where epilepsy
          is present. Neither is disease-modifying and neither is reported with a controlled outcome.'
      selected_evidence:
        snippet: This study provides valuable insights into the etiology of and promising intervention
          strategies for GTPBP3-related diseases.
        supports: SUPPORT
