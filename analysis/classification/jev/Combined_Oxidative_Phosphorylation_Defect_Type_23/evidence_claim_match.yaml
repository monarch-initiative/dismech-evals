          Heart-valve involvement is reported in the same sentence and is deliberately not bound: the
          source names no valve, no lesion and no patient count.

          This is the one phenotype in the entry deliberately left unwired in the pathograph. Brainstem
          involvement is documented in this disease and would make an oculomotor mechanism easy to assert,
          but the source that reports the strabismus proposes no mechanism for it and calls it a newly
          observed symptom; drawing the edge would manufacture a causal claim nobody has made.'
      selected_evidence:
        snippet: Additionally, they displayed new symptoms such as eye problems like strabismus and heart
          issues related to valve function.
        supports: SUPPORT
