          cardiomyopathy is the feature this disease was named for. What the human data establish is the
          association; the causal step from a translation defect to myocyte hypertrophy is supplied by
          the zebrafish knockout, in which loss of gtpbp3 produced cardiomyocyte hypertrophy and myocardial
          fibre disarray in the ventricles together with reduced fractional shortening, and by knock-in
          mice carrying patient alleles, which develop cardiac and muscular dysfunction attributed to
          altered mitochondrial translation.
        locations:
        - preferred_term: myocardium
          term:
            id: UBERON:0002349
            label: myocardium
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
        mechanism_confidence: PROVISIONAL
        notes: PROVISIONAL because no myocardial tissue study is reported in a GTPBP3 patient. The hypertrophy
          is documented echocardiographically in patients and histologically only in model organisms,
          so the tissue-level account here rests on the zebrafish and mouse work and is marked as such;
          the incoming edge is INDIRECT_UNKNOWN_INTERMEDIATES for the same reason.
      selected_evidence:
        snippet: These cardiac defects in the gtpbp3 knock-out zebrafish recapitulated the clinical phenotypes
          in HCM patients carrying the GTPBP3 mutation(s).
        supports: SUPPORT
        directness: INDIRECT
