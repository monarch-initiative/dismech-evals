  ab79b26323201f9d9b6bd250aaf6fa10dfff5588ee86ed613537efbe6a8e6231:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 23
          disease_term:
            preferred_term: combined oxidative phosphorylation defect type 23
            term:
              id: MONDO:0014525
              label: combined oxidative phosphorylation defect type 23
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GTPBP3-Specific Metabolic Reprogramming
        biological_scale: CELLULAR
        description: The one thing that separates this disease from MTO1 deficiency at the cellular level.
          Both enzymes catalyse the same modification and both defects cause infantile hypertrophic cardiomyopathy
          with lactic acidosis, but the compensatory response runs in opposite directions. MTO1-deficient
          fibroblasts inactivate AMPK, down-regulate UCP2 and PPAR-gamma and activate HIF-1; GTPBP3-depleted
          cells do the reverse - AMPK is activated, UCP2 and PPAR-gamma rise and HIF-1 is inactivated.
          The authors read that divergence as evidence that one of the two proteins has a role beyond
          tRNA modification.
        biological_processes:
        - preferred_term: cellular response to energy stress
          modifier: DYSREGULATED
          term:
            id: GO:0031669
            label: cellular response to nutrient levels
        mechanism_confidence: PROVISIONAL
        notes: 'PROVISIONAL, and deliberately so. The divergence between the two defects is measured,
          in cultured cells, and is not in doubt. What is provisional is the interpretation - that one
          of the two proteins therefore has an additional function - which the authors themselves present
          as a strong suggestion rather than a finding, and which nothing in the patient literature tests.
          The node is curated because it is the only mechanistic handle anyone has on why two defects
          in one reaction are not identical diseases, not because the extra function has been demonstrated.

          The GO binding is imperfect and is flagged rather than glossed. There is no GO term for the
          HIF-PPAR-gamma-UCP2-AMPK axis as such. Cellular response to nutrient levels is bound because
          AMPK activation and PPAR-gamma induction are nutrient-sensing responses, and that is the arm
          of the axis the source measures. Cellular response to hypoxia was considered first and rejected:
          the defining observation in this node is HIF-1 inactivation, so a hypoxia-response binding would
          have been semantically inverted. The modifier is DYSREGULATED rather than a direction, because
          the whole point of the node is that the direction is opposite to the sibling disease.'
      selected_evidence:
        snippet: Unexpectedly, this response is different from that triggered by the GTPBP3 defect, as
          GTPBP3-depleted cells exhibit AMPK activation, increased levels of UCP2 and PPARγ, and inactivation
          of HIF-1.
        supports: SUPPORT
