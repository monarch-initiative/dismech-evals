  ed35b339e0945e62902b7052f7120c5e11df19a43c5a1eb4f7a906aa01aaad63:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 24
          disease_term:
            preferred_term: combined oxidative phosphorylation defect type 24
            term:
              id: MONDO:0014547
              label: combined oxidative phosphorylation defect type 24
        context: []
      assertion_type: Genetic
      assertion:
        name: NARS2
        gene_term:
          preferred_term: NARS2
          term:
            id: hgnc:26274
            label: NARS2
        relationship_type: CAUSATIVE
        notes: 'NARS2 encodes the mitochondrial asparaginyl-tRNA synthetase. It is one of a group of mitochondrial
          aminoacyl-tRNA synthetase genes that between them cause a strikingly tissue-specific set of
          diseases; DARS2 causes LBSL, LARS2 and HARS2 cause Perrault syndrome, RARS2 causes pontocerebellar
          hypoplasia type 6.

          The allele spectrum spans splice, nonsense and missense changes, and the reported molecular
          consequences differ between them in ways that have been measured rather than predicted: absent
          protein, reduced protein with disrupted dimerisation, and reduced protein with intact oligomerisation.'
        variants:
        - name: c.822G>C
          description: Homozygous in the two founding siblings. Despite its nomenclature it acts as a
            splice variant, disrupting the 3' splice site of exon 7 and removing exon 7 and part of exon
            8 from the transcript.
        - name: c.637G>T, p.Val213Phe
          description: Homozygous in nonsyndromic hearing loss DFNB94. It does not affect NARS2 oligomerisation,
            and overexpressing it fails to rescue oxygen consumption and electron transport chain activity
            in Leigh syndrome fibroblasts.
        - name: c.969T>A, p.Tyr323*
          description: One of the two compound heterozygous Leigh syndrome alleles. The predicted truncated
            protein is not detectable.
        - name: c.1142A>G, p.Asn381Ser
          description: The second Leigh syndrome allele. It further decreases NARS2 protein levels and
            disrupts dimerisation.
        - name: p.Pro214Leu
          description: Homozygous in three Scandinavian patients with early-onset mitochondrial encephalopathy
            and a variable disease course.
        - name: p.(Phe216Leu)
          description: Homozygous in four of the eight children found by screening 397 cases of early-onset
            diabetes of unknown genetic cause. The most frequent allele in the neonatal diabetes group;
            no functional characterisation is published.
        - name: p.(Thr180Asn)
          description: Homozygous in three of the same eight neonatal diabetes children. No functional
            characterisation is published.
        - name: p.(Val440Leu)
          description: Homozygous in one of the same eight neonatal diabetes children. No functional characterisation
            is published.
      selected_evidence:
        snippet: Our findings establish lesions in NARS2 as a new cause for nonsyndromic hearing loss
          and Leigh syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
