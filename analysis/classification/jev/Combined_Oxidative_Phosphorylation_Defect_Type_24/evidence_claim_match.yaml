      assertion_type: Pathophysiology
      assertion:
        name: NARS2 Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic NARS2 variants reduce or abolish mitochondrial asparaginyl-tRNA synthetase.
          The reported mechanisms differ by allele and are not all the same: the founding c.822G>C change
          disrupts the 3'' splice site of exon 7 and removes exon 7 and part of exon 8 from the transcript;
          p.Tyr323* yields no detectable protein; p.Asn381Ser lowers protein level and disrupts dimerisation;
          and p.Val213Phe, the hearing-loss allele, leaves oligomerisation intact.'
        genes:
        - preferred_term: NARS2
          term:
            id: hgnc:26274
            label: NARS2
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: asparagine-tRNA ligase activity
          modifier: DECREASED
          term:
            id: GO:0004816
            label: asparagine-tRNA ligase activity
      selected_evidence:
        snippet: The c.822G>C variant affects the 3' splice site of exon 7, leading to skipping of the
          whole exon 7 and a part of exon 8 in the NARS2 mRNA.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
