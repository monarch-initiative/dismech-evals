              in the patient line, and the DFNB94 allele p.Val213Phe does not. The paired arms establish
              that the biochemical deficit follows from the NARS2 lesion, and grade p.Val213Phe as functionally
              deficient.
            limitations: Rescue is incomplete and the authors say so, offering several candidate reasons
              including a heteroplasmic mt-tRNA-Cys variant they found in the same patient. Overexpression
              from a lentiviral construct is also not restoration of endogenous dosage, so the arm shows
              that supplying functional NARS2 helps, not that the deficit is quantitatively explained
              by the amount of NARS2 lost.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Oxygen consumption rate after p.Val213Phe transduction
        target: NARS2 Loss of Function
        direction: UNCHANGED
        interpretation: The hearing-loss allele fails to complement, which is the negative arm that makes
          the wild-type result interpretable and is the functional evidence for that allele's pathogenicity.
      selected_evidence:
        snippet: However, overexpression of the hearing loss associated p.Val213Phe mutant protein in
          these fibroblasts cannot complement the OCR and ETC defects.
        supports: SUPPORT
