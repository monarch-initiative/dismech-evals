              label: combined oxidative phosphorylation defect type 24
        context:
        - path: /experimental_models/0
          value:
            name: LS06 patient fibroblasts with lentiviral wild-type and p.Val213Phe NARS2 complementation
            experimental_model_type: PRIMARY_CELL_CULTURE
            publication: PMID:25807530
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            cell_types:
            - preferred_term: dermal fibroblast
              term:
                id: CL:0000057
                label: fibroblast
            cell_source: Dermal fibroblasts from proband II.1 of family LS06, compound heterozygous for
              c.969T>A p.Tyr323* and c.1142A>G p.Asn381Ser, stably transduced by lentivirus with cDNA
              encoding either wild-type NARS2 or the DFNB94 allele p.Val213Phe.
            culture_system: Adherent monolayer. Respiration measured on a Seahorse XF24 analyser with
              the Mitostress substrate and inhibitor sequence, alongside spectrophotometric respiratory-chain
              enzymology and Northern blot for steady-state mt-tRNA-Asn.
            description: 'The only model system in this disease that does more than describe it. It has
              two arms, and the second is what makes it worth recording: re-expressing wild-type NARS2
              in the patient''s own fibroblasts raises oxygen consumption and complex I, III and IV activity,
              while re-expressing the hearing-loss allele p.Val213Phe in the same cells does not. That
              pairing is what converts a correlation between genotype and biochemistry into a causal claim,
              and it simultaneously grades the DFNB94 allele as pathogenic in a system where no DFNB94
              patient tissue is available.'
            notes: 'Curated as an experimental_models entry because patient fibroblasts are a non-animal
              system. No animal model of NARS2 disease is published, so this is the only model the entry
              has. The EBV-transformed lymphoblast line from the founding family (PMID:25385316), in which
              the reduced charged mt-tRNA-Asn was first shown, is not recorded as a separate model: that
              paper reports it as a single measurement in patient material rather than as a manipulable
              system, and its result is already curated as evidence on the tRNA node.'
          role: ancestor
        - path: /experimental_models/0/modeled_mechanisms/2
          value:
            target: Reduced Charged Mitochondrial tRNA-Asn
            relationship: MEASURES
            fidelity: MODERATE
            model_scale: MOLECULAR
            description: Northern blot for steady-state mt-tRNA-Asn in the patient fibroblasts, against
              the parents and a control.
            limitations: What this model measures is the size of the mt-tRNA-Asn pool, not the fraction
              of it that is charged. The same paper measured the charged to uncharged ratio in the same
              cells and found it normal, so the node's claim that less charged tRNA-Asn reaches the ribosome
              rests on the reduced pool here plus the directly reduced charged fraction that the founding
              family's lymphoblasts show, and not on this measurement alone. High passage number also
              prevented the measurement in the second proband, so n is one patient.
          role: ancestor
      assertion_type: ExperimentalReadout
      assertion:
        name: Steady-state mt-tRNA-Asn level
        target: Reduced Charged Mitochondrial tRNA-Asn
        direction: DECREASED
        interpretation: The tRNA pool available to mitochondrial translation is smaller in the patient
