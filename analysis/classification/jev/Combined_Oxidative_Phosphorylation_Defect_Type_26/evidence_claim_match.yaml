              label: combined oxidative phosphorylation defect type 26
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TRMT5 Biallelic Loss of Function
        description: Biallelic TRMT5 variants remove or degrade the nuclear-encoded methyltransferase
          that catalyses m1G37 formation on mitochondrial tRNAs. TRMT5 is the human orthologue of yeast
          Trm5p, and residues involved in catalysis are absolutely conserved between the two - which is
          what made a heterologous yeast complementation assay a usable pathogenicity test for the patient
          alleles. In the neuropathy series the missense allele p.Ile222Thr is predicted by structural
          modelling to destabilise tRNA binding rather than to abolish the catalytic site.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: TRMT5
          term:
            id: hgnc:23141
            label: TRMT5
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          allele_type: VARIANT
          variant_origin: GERMLINE
          zygosity: COMPOUND_HETEROZYGOUS
        molecular_functions:
        - preferred_term: tRNA (guanine(37)-N1)-methyltransferase activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0052906
            label: tRNA (guanine(37)-N1)-methyltransferase activity
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
      selected_evidence:
        snippet: TRMT5 encodes a mitochondrial protein with strong homology to members of the class I-like
          methyltransferase superfamily.
        supports: SUPPORT
