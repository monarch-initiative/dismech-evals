      assertion_type: Pathophysiology
      assertion:
        name: Combined Respiratory Chain Complex Deficiency
        description: 'Because every mtDNA-encoded subunit passes through the same translational bottleneck,
          the enzymology in muscle shows several complexes affected together rather than one. In the founding
          individuals this took the form of a marked histochemical and biochemical cytochrome c oxidase
          deficiency with a complex III defect in one, and decreased complex IV with borderline-low complex
          I in the other.

          This node is where the literature disagrees, and the entry does not resolve the disagreement
          - see the CONTROVERSY discussion. The 2022 neuropathy series found normal respiratory-chain
          activity in the skeletal muscle of all three of its patients bar a mild complex I decrease in
          one, despite giant mitochondria on morphology.'
        biological_scale: CELLULAR
        biological_processes:
        - preferred_term: oxidative phosphorylation
          modifier: DECREASED
          term:
            id: GO:0006119
            label: oxidative phosphorylation
      selected_evidence:
        snippet: Subsequent evaluation led to the diagnosis of a mitochondrial myopathy associated with
          a marked histochemical and biochemical deficiency of cytochrome c oxidase (COX), along with
          a defect in complex III activity.
        supports: SUPPORT
