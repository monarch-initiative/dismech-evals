  da62cbcec83c76608cf2fa7d4b16331bbe16f60e06d2c5c28387178304d39f12:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 26
          disease_term:
            preferred_term: combined oxidative phosphorylation defect type 26
            term:
              id: MONDO:0014684
              label: combined oxidative phosphorylation defect type 26
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: m1G37 Hypomodification of Mitochondrial tRNA
        description: 'The direct molecular consequence, and the one measured in patients. Reverse-transcriptase
          primer-extension across position 37 of mt-tRNA-Leu(CUN) shows markedly increased readthrough
          in patient material, meaning the methyl group is missing. Two controls make this causal rather
          than correlative: siRNA depletion of TRMT5 in control cells reproduces the hypomodification,
          and lentiviral re-expression of wild-type TRMT5 in patient fibroblasts reverses it to control
          levels.

          A negative result is worth recording here too: loss of m1G37 does not destabilise the tRNA.
          Steady-state mt-tRNA-Leu(CUN) levels are similar in control and patient fibroblasts, so the
          downstream defect is a translation-fidelity or efficiency problem rather than a loss of the
          tRNA pool.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: mitochondrial tRNA methylation
          modifier: DECREASED
          term:
            id: GO:0070901
            label: mitochondrial tRNA methylation
      selected_evidence:
        snippet: However, mt-tRNALeu(CUN) was found to have considerably decreased levels of the m1G37
          modification in primary fibroblasts from both individuals, as demonstrated by increased readthrough
          past G37 (Figure 4B).
        supports: SUPPORT
    origin:
