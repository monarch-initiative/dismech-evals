  5ba3f2652642592bc864a81e5afb5fc5bfe161080ffb54ec6788487ec617779e:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 26
          disease_term:
            preferred_term: combined oxidative phosphorylation defect type 26
            term:
              id: MONDO:0014684
              label: combined oxidative phosphorylation defect type 26
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coxpd26_respiratory_chain_deficiency_not_obligate
        kind: CONTROVERSY
        status: OPEN
        prompt: The disorder is named for a combined oxidative phosphorylation deficiency, but the largest
          published patient group had normal skeletal-muscle respiratory-chain activity. Is the biochemical
          defect the disease, or one variable consequence of it?
        attaches_to:
        - pathophysiology#Combined Respiratory Chain Complex Deficiency
        - diagnosis#Respiratory Chain Enzymology in Skeletal Muscle
        - histopathology#Proliferation of giant mitochondria in skeletal muscle
        - disease#Combined Oxidative Phosphorylation Defect Type 26
        rationale: 'Well-conducted reports disagree about the disorder''s defining feature, and the disagreement
          is not reconciled anywhere in the literature cited here. It is not an even split: of the three
          reports with muscle enzymology, two find it abnormal and one does not.

          The founding report defines COXPD26 by "multiple mitochondrial respiratory-chain-complex deficiencies
          in skeletal muscle" in both of its individuals, with cytochrome c oxidase deficiency and a complex
          III defect in one and decreased complex IV with borderline-low complex I in the other. The Chinese
          case report, published the same year as the series below, independently found reduced respiratory-chain
          complex enzyme activities on muscle biopsy in its patient - a third patient group, and a second
          report on that side.

