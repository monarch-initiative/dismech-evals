          activity in three genetically confirmed patients, so a normal muscle assay does not exclude
          the diagnosis in a patient with a compatible phenotype.'
      selected_evidence:
        snippet: Respiratory-chain analysis in frozen muscle tissue showed decreased activity of respiratory
          complex IV and borderline-low complex I activity (Table 1), whereas fibroblast studies showed
          normal values.
