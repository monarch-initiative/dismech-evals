        description: 'The hypomodification is not uniform across tissues. In the founding report the deficit
          was described as particularly prominent in skeletal muscle, with severely diminished pausing
          at G37 in muscle biopsy RNA - more marked than in the same patients'' fibroblasts. The clinical
          correlate is direct and diagnostically important: in one of the two founding individuals, muscle
          respiratory-chain analysis showed decreased complex IV and borderline-low complex I activity
          while fibroblast studies were normal.

