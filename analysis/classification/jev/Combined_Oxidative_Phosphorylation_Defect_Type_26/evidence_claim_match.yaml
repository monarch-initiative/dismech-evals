        - path: /genetic/0
          value:
            name: TRMT5
            notes: 'Encodes tRNA methyltransferase 5, the human orthologue of yeast Trm5p, which catalyses
              N1-methylation of guanosine at position 37 of mitochondrial tRNAs. The gene is nuclear,
              so the disorder is inherited in Mendelian recessive fashion despite being a mitochondrial
              disease.

              Every published patient is compound heterozygous rather than homozygous, which is worth
              noting because it is unusual for an ultra-rare recessive disorder and may reflect that complete
              loss of TRMT5 is not compatible with life - the founding report''s alleles all retain some
              activity, and the yeast complementation assay was used precisely to show that they are hypomorphic
              rather than null.

              Note that TRMT5 also appears in the cancer literature as an upregulated gene in hepatocellular
              carcinoma. That is a separate, somatic, gain-of-expression context and has no bearing on
              this recessive loss-of-function disorder; it is mentioned here only so that a reader searching
              the gene does not conflate them.'
            relationship_type: CAUSATIVE
            gene_term:
              preferred_term: TRMT5
              term:
                id: hgnc:23141
                label: TRMT5
          role: ancestor
      assertion_type: Variant
      assertion:
        name: c.312_315del (p.Ile105Serfs*4)
        description: Known pathogenic frameshift allele, carried by all three patients of the 2022 neuropathy
          series in trans with a rare missense change.
      selected_evidence:
        snippet: All three patients carried the same two compound heterozygous variants of the TRMT5 (tRNA
          Methyltransferase 5) gene
        supports: SUPPORT
