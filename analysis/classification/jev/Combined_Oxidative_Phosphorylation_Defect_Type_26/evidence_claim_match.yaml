        description: 'The clinical endpoint, and the least uniform part of the disease. Reported presentations
          range from adult-onset exercise intolerance with exertional dyspnoea, through childhood failure
          to thrive with hypertrophic cardiomyopathy, to infantile severe developmental delay with demyelinating
          neuropathy, seizures, spastic diplegia, and hepatic and renal involvement. Lactic acidosis is
          the recurring biochemical accompaniment.

          The tissues that fail are the ones the founding authors predicted would: the heart is called
          out as specifically vulnerable to a diminished mitochondrial translation rate, a threshold-effect
          argument they draw from the shared cardiomyopathy across three tRNA-modification disorders.'
        biological_scale: ORGANISM
      selected_evidence:
        snippet: although the clinical presentation of the two affected subjects was remarkably different;
          one presented in childhood with failure to thrive and hypertrophic cardiomyopathy, and the other
          was an adult with a life-long history of exercise intolerance
