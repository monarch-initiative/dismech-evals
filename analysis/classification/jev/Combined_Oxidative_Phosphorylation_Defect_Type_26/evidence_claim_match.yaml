              id: MONDO:0014684
              label: combined oxidative phosphorylation defect type 26
        context: []
      assertion_type: Genetic
      assertion:
        name: TRMT5
        notes: 'Encodes tRNA methyltransferase 5, the human orthologue of yeast Trm5p, which catalyses
          N1-methylation of guanosine at position 37 of mitochondrial tRNAs. The gene is nuclear, so the
          disorder is inherited in Mendelian recessive fashion despite being a mitochondrial disease.

          Every published patient is compound heterozygous rather than homozygous, which is worth noting
          because it is unusual for an ultra-rare recessive disorder and may reflect that complete loss
          of TRMT5 is not compatible with life - the founding report''s alleles all retain some activity,
          and the yeast complementation assay was used precisely to show that they are hypomorphic rather
          than null.

          Note that TRMT5 also appears in the cancer literature as an upregulated gene in hepatocellular
          carcinoma. That is a separate, somatic, gain-of-expression context and has no bearing on this
          recessive loss-of-function disorder; it is mentioned here only so that a reader searching the
          gene does not conflate them.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: TRMT5
          term:
            id: hgnc:23141
            label: TRMT5
        variants:
        - name: c.312_315del (p.Ile105Serfs*4)
          description: Known pathogenic frameshift allele, carried by all three patients of the 2022 neuropathy
            series in trans with a rare missense change.
        - name: c.665T>C (p.Ile222Thr)
          description: Rare missense allele in the 2022 series. Structural modelling suggests it acts
            by destabilising tRNA binding rather than by disabling catalysis - a mechanistic distinction
            that may matter for the milder biochemical phenotype in those patients.
      selected_evidence:
        snippet: Taken together, our results thus far establish TRMT5 as the methyltransferase responsible
          for m1G37 modification in human mitochondrial tRNAs and suggest the variants detected in subjects
          65205 and 73901 as responsible for their respiratory-chain abnormalities.
        supports: SUPPORT
