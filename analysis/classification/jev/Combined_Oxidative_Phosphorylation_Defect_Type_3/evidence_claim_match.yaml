      assertion_type: Genetic
      assertion:
        name: TSFM
        gene_term:
          preferred_term: TSFM
          term:
            id: hgnc:12367
            label: TSFM
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: TSFM encodes mitochondrial translation elongation factor Ts, the guanine nucleotide
          exchange factor that recycles EF-Tu (TUFM) from its GDP-bound to its GTP-bound form during the
          elongation step of mitochondrial translation. Reported alleles include the recurrent missense
          p.Arg333Trp, further missense alleles, nonsense, frameshift and splice alleles; null alleles
          have only been seen in trans with a missense or splice allele.
        notes: 'Variant numbering differs between papers. The recurrent allele is c.997C>T p.Arg333Trp
          on NM_001172696, reported as R312W by Vedrenne et al. and as R325W in the biochemical study
          of Akama et al.; the three papers describe the same arginine-to-tryptophan change at the EF-Tu-binding
          subdomain. Likewise the Finnish nonsense allele is c.856C>T p.Gln286Ter in Ahola et al., and
          a nonsense allele reported as c.919C>T p.Gln307Ter on NM_001172696.1 is described by van Riesen
          et al. as previously published in three patients; that the two are the same allele is plausible
          but not stated by either source, so they are listed separately.

          ClinGen classifies TSFM as Definitive for the umbrella term mitochondrial disease (MONDO:0044970)
          and Moderate for Leigh syndrome (MONDO:0009723). Neither is this entry''s disease_term, so no
          gene_disease_validity assertion is recorded here.'
        variants:
        - name: TSFM c.997C>T (p.Arg333Trp)
          description: The recurrent allele, reported homozygous in unrelated families with a fatal neonatal
            encephalomyopathy, a fatal infantile hypertrophic cardiomyopathy and infantile liver failure,
            and in trans with p.Val119Leu in a child with stabilised hypertrophic cardiomyopathy. It sits
            in the subdomain of EF-Ts that contacts EF-Tu and halves EF-Ts stimulation of elongation in
            vitro by weakening EF-Tu binding.
          clinical_significance: PATHOGENIC
        - name: TSFM c.355G>C (p.Val119Leu)
          description: Missense allele found in trans with p.Arg333Trp in a girl with hypertrophic cardiomyopathy
            from age 3 who survived into adolescence. Classified likely pathogenic by the reporting authors
            on segregation and conservation; no functional study.
          clinical_significance: LIKELY_PATHOGENIC
        - name: TSFM c.856C>T (p.Gln286Ter)
          description: Nonsense allele with a heterozygous carrier frequency of about 1 in 80 in Finland,
            found in trans with p.Cys315Tyr in two siblings and with a splice-site change in a third patient.
            No homozygote has been found.
          clinical_significance: PATHOGENIC
        - name: TSFM c.944G>A (p.Cys315Tyr)
          description: Missense allele in trans with p.Gln286Ter in two Finnish siblings whose infantile
            cardiomyopathy progressed to juvenile-onset Leigh syndrome, neuropathy and optic atrophy.
            Modelled and shown in patient cells to destabilise the protein.
          clinical_significance: PATHOGENIC
        - name: TSFM c.547G>A (p.Gly183Ser)
          description: Homozygous missense allele in a boy with infantile-onset encephalocardiomyopathy
            and sensorineural hearing loss.
          clinical_significance: LIKELY_PATHOGENIC
        - name: TSFM c.408_409delGT (p.Leu137GlyfsTer24) with c.505C>T
          description: Frameshift allele in trans with a missense allele in a woman with dilated cardiomyopathy
            and biventricular fibro-adipose replacement who underwent heart transplantation at 33.
      selected_evidence:
        snippet: These phenotypes and the translation defect were rescued by retroviral expression of
          either EFTs or EFTu.
        supports: SUPPORT
