          value:
            name: TSFM
            gene_term:
              preferred_term: TSFM
              term:
                id: hgnc:12367
                label: TSFM
            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            association: TSFM encodes mitochondrial translation elongation factor Ts, the guanine nucleotide
              exchange factor that recycles EF-Tu (TUFM) from its GDP-bound to its GTP-bound form during
              the elongation step of mitochondrial translation. Reported alleles include the recurrent
              missense p.Arg333Trp, further missense alleles, nonsense, frameshift and splice alleles;
              null alleles have only been seen in trans with a missense or splice allele.
            notes: 'Variant numbering differs between papers. The recurrent allele is c.997C>T p.Arg333Trp
              on NM_001172696, reported as R312W by Vedrenne et al. and as R325W in the biochemical study
              of Akama et al.; the three papers describe the same arginine-to-tryptophan change at the
              EF-Tu-binding subdomain. Likewise the Finnish nonsense allele is c.856C>T p.Gln286Ter in
              Ahola et al., and a nonsense allele reported as c.919C>T p.Gln307Ter on NM_001172696.1 is
              described by van Riesen et al. as previously published in three patients; that the two are
              the same allele is plausible but not stated by either source, so they are listed separately.

              ClinGen classifies TSFM as Definitive for the umbrella term mitochondrial disease (MONDO:0044970)
              and Moderate for Leigh syndrome (MONDO:0009723). Neither is this entry''s disease_term,
              so no gene_disease_validity assertion is recorded here.'
          role: ancestor
      assertion_type: Variant
      assertion:
        name: TSFM c.997C>T (p.Arg333Trp)
        description: The recurrent allele, reported homozygous in unrelated families with a fatal neonatal
          encephalomyopathy, a fatal infantile hypertrophic cardiomyopathy and infantile liver failure,
          and in trans with p.Val119Leu in a child with stabilised hypertrophic cardiomyopathy. It sits
          in the subdomain of EF-Ts that contacts EF-Tu and halves EF-Ts stimulation of elongation in
          vitro by weakening EF-Tu binding.
        clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: The p.(Arg333Trp) variant identified in our proband, has been previously detected in
          seven patients, transmitted in an autosomal recessive manner, manifesting with heterogeneous
          phenotypes and are all associated with death during infancy.
        supports: SUPPORT
