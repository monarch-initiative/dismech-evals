          or a movement disorder, TSFM is easily left out of a phenotype-restricted panel. In Finland
          the p.Gln286Ter allele is common enough to be worth specific attention.
        diagnosis_term:
          preferred_term: Whole Exome Sequencing
          term:
            id: NCIT:C101295
            label: Whole Exome Sequencing
      selected_evidence:
        snippet: Whole exome sequencing identified compound heterozygous variants, p.Arg333Trp and p.Val119Leu,
          in TSFM, a nuclear gene that encodes a mitochondrial translation elongation factor, resulting
          in impaired oxidative phosphorylation and juvenile hypertrophic cardiomyopathy.
        supports: SUPPORT
