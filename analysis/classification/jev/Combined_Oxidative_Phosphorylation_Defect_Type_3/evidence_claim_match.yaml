        name: Respiratory chain enzymology showing a combined defect with spared complex II
        description: 'Reduced activity or assembly of complexes I and IV, with or without III and V, in
          muscle, heart or fibroblasts, with complex II preserved, points at mitochondrial translation
          rather than a single complex. The informative tissue varies: fibroblasts showed reduced complex
          assembly in the founding patients, the adult heart showed a combined complex I and IV defect
          while her fibroblasts compensated with normal oxygen consumption, and one toddler''s muscle
          showed only a complex IV defect. A normal fibroblast study does not exclude the disease.'
      selected_evidence:
        snippet: This feature was paralleled by reduction of the steady-state levels of selected C-I and
          C-IV subunits, while C-II, C-III and C-V subunits were spared
