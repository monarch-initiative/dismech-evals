        description: Biallelic TSFM variants reduce the amount or activity of EF-Ts. The recurrent p.Arg333Trp
          substitution lies in the subdomain that contacts EF-Tu and weakens EF-Tu binding, so nucleotide
          exchange on EF-Tu is impaired; other coding alleles destabilise EF-Ts so that it is absent from
          patient cells. Either way the cell has less capacity to recharge EF-Tu with GTP between rounds
          of aminoacyl-tRNA delivery.
        genetic_context:
