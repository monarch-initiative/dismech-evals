      assertion:
        name: TUFM-related combined oxidative phosphorylation deficiency
        disease_term:
          preferred_term: Combined oxidative phosphorylation defect type 4
          term:
            id: MONDO:0012534
            label: combined oxidative phosphorylation defect type 4
        description: TUFM encodes EF-Tu, the partner that EF-Ts recharges, so the two diseases break the
          same elongation step and produce the same combined deficiency with lactic acidosis. TUFM disease
          is classically a neonatal encephalopathy with polymicrogyria and leukodystrophy, while TSFM
          disease is more often cardiac, but both have cardiac and neurological presentations and the
          distinction is molecular.
        distinguishing_features:
        - Not reliably separable clinically or by respiratory chain enzymology; sequencing decides.
      selected_evidence:
        snippet: A mutation of Arg336 to Gln in EF-Tu(mt) causes infantile encephalopathy caused by defects
          in mitochondrial translation.
        supports: SUPPORT
