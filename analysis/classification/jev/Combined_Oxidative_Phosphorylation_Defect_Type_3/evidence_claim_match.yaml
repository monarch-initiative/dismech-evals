        description: 'With the mtDNA-dependent complexes under-assembled, cells cannot meet ATP demand
          by oxidative phosphorylation and shift to glycolysis. The organs that fail are those with the
          highest and least flexible oxidative demand: heart, brain and, in the neonatal period, liver.
          Why one patient''s disease is cardiac and another''s is neurological or hepatic is not explained;
          the founding authors invoked genetic modifiers because the same homozygous allele produced different
          organ involvement.'
        biological_processes:
