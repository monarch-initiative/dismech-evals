          description: Patient fibroblasts show the joint loss of EF-Ts and EF-Tu and reduced assembly
            of complexes I, IV and V, and retroviral EF-Ts or EF-Tu corrects it.
          limitations: Fibroblasts are not an affected tissue, and in at least one patient they compensated
            by up-regulating EF-Tu and mitochondrial biogenesis and had normal oxygen consumption while
            her heart was severely deficient. The size of the defect in fibroblasts is therefore not a
            guide to severity in heart, brain or liver.
          readouts:
          - name: Assembled respiratory chain complexes I, IV and V
            target: Combined Respiratory Chain Complex Deficiency
