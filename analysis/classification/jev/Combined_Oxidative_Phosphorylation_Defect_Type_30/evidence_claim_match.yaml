            term:
              id: MONDO:0014856
              label: combined oxidative phosphorylation defect type 30
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: PRORP-related combined oxidative phosphorylation deficiency 54
        description: The third subunit of the same holoenzyme, and the closest mechanistic neighbour.
          Biallelic PRORP variants impair the same 5'-cleavage reaction from the nuclease side rather
          than the scaffold side, and the disease-associated variants are shown to reduce pre-tRNA cleavage
          in reconstituted assays with TRMT10C and SDR5C1. The phenotype is different — a spectrum from
          Perrault syndrome, with sensorineural hearing loss and ovarian insufficiency, to leukodystrophy
          — so the same biochemical lesion in a different subunit does not give the same clinical picture,
          which is worth knowing before assuming one from the other.
      selected_evidence:
        snippet: Biallelic hypomorphic variants in PRORP have been recently described as causing the autosomal
          recessive disorder combined oxidative phosphorylation deficiency type 54 (COXPD54). COXPD54
          encompasses a phenotypic spectrum of sensorineural hearing loss and ovarian insufficiency (Perrault
          syndrome) to leukodystrophy.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37558808
      reference_title: Novel homozygous variants in PRORP expand the genotypic spectrum of combined oxidative
        phosphorylation deficiency 54.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the third-subunit disorder and its distinct phenotypic spectrum.
