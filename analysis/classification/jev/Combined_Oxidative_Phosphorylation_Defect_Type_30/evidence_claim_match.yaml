            term:
              id: MONDO:0014856
              label: combined oxidative phosphorylation defect type 30
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mrpp1_mrpp3_interface_disruption
        hypothesis_label: The disease variants act by disrupting the MRPP1-MRPP3 interface rather than
          by depleting MRPP1 uniformly
        status: EMERGING
        description: The reported variants impair 5'-cleavage while leaving m1R9 methylation intact. Since
          methylation is carried out by the MRPP1-MRPP2 subcomplex and cleavage additionally requires
          MRPP3, which contributes the nuclease active site, an interface-selective defect would explain
          why one activity of MRPP1 is lost and the other preserved. The alternative, that a simple reduction
          in MRPP1 abundance is enough to limit cleavage without limiting methylation, is not excluded
          by the available data. The two models are distinguishable experimentally and neither has been
          tested.
      selected_evidence:
        snippet: Therefore, one attractive hypothesis is to suggest that the p.Arg181Leu and p.Thr272Ala
          TRM10C variants disrupt the interaction between MRPP1 and MRPP3 without affecting the complex
          with MRPP2, although this requires future investigation.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
