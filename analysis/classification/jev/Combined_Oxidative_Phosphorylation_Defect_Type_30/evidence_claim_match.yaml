            term:
              id: MONDO:0014856
              label: combined oxidative phosphorylation defect type 30
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Preserved m1R9 Methyltransferase Activity
        biological_scale: MOLECULAR
        description: 'MRPP1 has a second activity, separable from RNase P: with MRPP2 it methylates position
          9 of mt-tRNAs, a modification needed for most of them to fold into the canonical cloverleaf
          rather than an extended hairpin. This activity is measurably unaffected by the disease variants,
          tested two independent ways — primer extension on mt-tRNA-Leu(UUR), where the m1R9 mark stalls
          reverse transcriptase, and RNA-seq error rate at position 9. The node is included because it
          is the negative result that assigns the disease mechanism to the cleavage arm specifically;
          it is not a step in the causal chain and has no downstream edge. Note that the biological_processes
          descriptor below deliberately carries no modifier: the finding is that this process is unchanged,
          and ModifierEnum has no value for a measured normal result. The gap is recorded on dismech issue
          #10108. The GO binding itself is safe -- unlike an HP term, GO:0070901 names the reaction without
          asserting that it is impaired, so a consumer reading only the bound term does not get the reverse
          claim.'
        biological_processes:
        - preferred_term: mitochondrial mt-tRNA m1R9 methylation
          term:
            id: GO:0070901
            label: mitochondrial tRNA methylation
      selected_evidence:
        snippet: These data indicate that the m1R9 methyltransferase activity is not affected by the p.Arg181Leu
          and p.Thr272Ala MRPP1 variants.
        supports: SUPPORT
