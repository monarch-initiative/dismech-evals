              label: combined oxidative phosphorylation defect type 30
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Mitochondrial Protein Synthesis
        biological_scale: CELLULAR
        description: 'Reduced de novo synthesis of the 13 mtDNA-encoded polypeptides. Because those 13
          subunits are distributed across complexes I, III, IV and V but none sits in complex II, a translation-level
          lesion produces a characteristic biochemical signature: combined deficiency with complex II
          spared. This is the step that converts a single RNA-processing defect into a multi-complex respiratory
          chain phenotype.'
        biological_processes:
        - preferred_term: mitochondrial translation
          modifier: DECREASED
          term:
            id: GO:0032543
            label: mitochondrial translation
      selected_evidence:
        snippet: The loss of MRPP1 protein level correlates with decreased steady-state levels of subunits
          of complex I (NDUFB8) and complex IV (COXI)
        supports: SUPPORT
