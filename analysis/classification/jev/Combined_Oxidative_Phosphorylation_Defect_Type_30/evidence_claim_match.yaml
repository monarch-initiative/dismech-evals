      assertion_type: Pathophysiology
      assertion:
        name: MRPP1 Protein Destabilization
        biological_scale: MOLECULAR
        description: 'MRPP1 steady-state levels fall in patient fibroblasts while its two RNase P partners,
          MRPP2 and MRPP3, are unchanged. The subunit stoichiometry of the holoenzyme is therefore skewed
          rather than the complex being globally lost, which is the opposite of the arrangement seen in
          MRPP2/HSD17B10 disease, where loss of MRPP2 secondarily drags MRPP1 down with it. Residual MRPP1
          protein is present in both subjects, and the amount does not order the severity: the compound
          heterozygote had the lower MRPP1 level but the milder translation defect, implying the p.Arg181Leu
          protein is more stable but less active than p.Thr272Ala.'
      selected_evidence:
        snippet: On the other hand, levels of MRPP2 and MRPP3, the other two subunits of RNase P, were
          unchanged in fibroblasts from affected individuals
        supports: SUPPORT
