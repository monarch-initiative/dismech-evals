      assertion_type: DifferentialDiagnosis
      assertion:
        name: HSD10 mitochondrial disease (MRPP2/HSD17B10 deficiency)
        description: 'The other RNase P subunit disorder, and the closest biochemical mimic: HSD17B10
          variants also produce accumulation of mitochondrial RNA precursors without depleting mature
          transcripts. The discriminator is direction of subunit loss — in HSD10 disease MRPP2 loss secondarily
          reduces MRPP1, whereas in COXPD30 MRPP1 falls while MRPP2 and MRPP3 are unchanged. HSD10 disease
          is also X-linked, against autosomal recessive here.'
      selected_evidence:
        snippet: In HSD10 knock-down cells, MRPP1 protein content was also reduced, indicating that HSD10
          is important for the maintenance of normal MRPP1 protein levels.
        supports: SUPPORT
