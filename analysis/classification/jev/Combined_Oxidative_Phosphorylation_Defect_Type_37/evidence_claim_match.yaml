              label: combined oxidative phosphorylation deficiency 37
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Cristae Junctions and Inner Membrane Contact Sites
        role: mechanism
        biological_scale: CELLULAR
        description: 'The structural lesion of the disease. Cristae junctions are the narrow necks that
          connect each crista to the inner boundary membrane, and they do two things: they hold the folded
          surface area on which respiratory complexes are concentrated, and they partition the intermembrane
          space so that the crista lumen is a distinct compartment. Contact sites link the inner membrane
          to the outer.

          Losing them is therefore not simply a morphological finding. It removes the geometry that makes
          oxidative phosphorylation efficient, which is why an architectural defect presents as a bioenergetic
          disease.'
        cellular_components:
        - preferred_term: mitochondrial crista junction
          term:
            id: GO:0044284
            label: mitochondrial crista junction
          modifier: ABSENT
      selected_evidence:
        snippet: resulting in aberrant cristae structure and a loss of cristae junctions and contact sites.
        supports: SUPPORT
