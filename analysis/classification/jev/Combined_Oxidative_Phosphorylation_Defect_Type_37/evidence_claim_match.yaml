  3f477e58575b097628c47dbb3e5495b65a5cfeca5b2c65965533cea8e2444a51:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 37
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 37
            term:
              id: MONDO:0032679
              label: combined oxidative phosphorylation deficiency 37
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of MICOS Complex Assembly
        role: mechanism
        biological_scale: MOLECULAR
        description: 'MICOS13 is a small subunit whose job is to build and hold together the rest of the
          complex. Its loss is therefore not the loss of one component among seven: a defined subcomplex
          comprising MIC10, MIC26, MIC27 and QIL1 fails to form.

          In Kishita et al.''s patient the protein was directly shown to be absent from fibroblast mitochondria,
          so the assembly failure follows from protein loss rather than from a hypomorphic variant with
          residual function.

          The founding report makes the selectivity sharper still. In those patients'' fibroblasts both
          MIC13 and MIC10 were absent while MIC60 was present at normal abundance. MIC60 is the core of
          the other MICOS subcomplex, so what fails is one arm of the complex rather than the complex
          as a whole - which is a more specific claim than "MICOS is disrupted" and is consistent with
          the MIC10-MIC26-MIC27-QIL1 subcomplex loss reported independently.'
        cellular_components:
        - preferred_term: MICOS complex
          term:
            id: GO:0061617
            label: MICOS complex
          modifier: ABSENT
        biological_processes:
        - preferred_term: cristae formation
          term:
            id: GO:0042407
            label: cristae formation
          modifier: DECREASED
      selected_evidence:
        snippet: Disassembly of MICOS complex subunits displays lack of MIC10-MIC26-MIC27-QIL1 subcomplex,
          resulting in aberrant cristae structure and a loss of cristae junctions and contact sites.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29618761
      reference_title: QIL1-dependent assembly of MICOS complex-lethal mutation in C19ORF70 resulting
        in liver disease and severe neurological retardation.
      evidence_source: IN_VITRO
      explanation: Names the specific subcomplex that is lost, which is the precise form of the assembly
        claim and is what distinguishes it from a general statement that MICOS is disrupted.
    first_seen_at: '2026-09-25T15:42:42.189557+00:00'
