          name: Combined Oxidative Phosphorylation Defect Type 37
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 37
            term:
              id: MONDO:0032679
              label: combined oxidative phosphorylation deficiency 37
        context: []
      assertion_type: Genetic
      assertion:
        name: MICOS13
        gene_term:
          preferred_term: MICOS13
          term:
            id: hgnc:33702
            label: MICOS13
        relationship_type: CAUSATIVE
        notes: 'MICOS13 goes by four names in the literature - MICOS13, QIL1, MIC13 and C19orf70 - and
          all four appear across the primary papers, sometimes in the same sentence. A literature search
          on any single one of them misses part of the evidence base; this was a practical problem in
          curating the entry and is worth knowing for anyone extending it.

          The reported alleles are frameshift, splice-donor and duplication variants, and all are predicted
          or shown to be null. Guarani et al.''s c.30-1G>A is the clearest case: it removes the transmembrane-domain
          exon, so the predicted protein retains nine residues of MICOS13 and nothing else.

          The gene encodes a small subunit of the MICOS complex whose function is assembly. Its loss removes
          a defined MIC10-MIC26-MIC27-QIL1 subcomplex rather than degrading MICOS uniformly.'
      selected_evidence:
        snippet: MICOS13 (also known as QIL1, MIC13, or C19orf70) is a component of the MICOS complex,
          which plays crucial roles in the maintenance of cristae junctions at the mitochondrial inner
          membrane.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
