              label: combined oxidative phosphorylation deficiency 37
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: Patient-derived fibroblasts with lentiviral MICOS13 rescue
        experimental_model_type: PRIMARY_CELL_CULTURE
        description: 'Fibroblasts from the second patient, used both to characterise the defect and, with
          a wild-type MICOS13 cDNA restored by lentivirus, to test causation.

          This is the experiment that makes the entry''s central causal claim more than an association.
          Complementation in the patient''s own cells controls for genetic background in a way that no
          comparison with unrelated controls can.'
        modeled_mechanisms:
        - target: Combined Respiratory Chain Deficiency
          relationship: RESCUES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Restoring MICOS13 restores respiratory chain complex activity in the patient's
            own cells.
          limitations: Fibroblasts are not the affected tissue. The disease's burden is in brain and liver,
            and the rescue says nothing about whether restoring MICOS13 in those organs, or at a clinically
            reachable time point, would help.
          readouts:
          - name: Mitochondrial respiratory chain complex activity after wild-type MICOS13 expression
            target: Combined Respiratory Chain Deficiency
            direction: RESTORED
            interpretation: Restoration on complementation establishes that the absence of MICOS13 is
              the cause of the respiratory deficiency, not a bystander.
        - target: Failure of MICOS Complex Assembly
          relationship: MEASURES
          fidelity: HIGH
          model_scale: CELLULAR
          description: The system in which protein loss and reduced cristae number were demonstrated.
          limitations: Cristae number here was assessed in fibroblasts rather than in an affected organ.
            The founding report does document abnormal cristae morphology in patient liver, so the architectural
            lesion is not purely inferred - but no patient brain ultrastructure has been reported, and
            that is where most of the disease burden is.
          readouts:
          - name: MICOS13 protein level and cristae number in patient fibroblast mitochondria
            target: Failure of MICOS Complex Assembly
            direction: DECREASED
            interpretation: Absent protein with reduced cristae is the architectural lesion, measured
              directly.
      selected_evidence:
        snippet: We found loss of MICOS13 protein and fewer cristae structures in the mitochondria of
          fibroblasts derived from the patient.
        supports: SUPPORT
    origin:
