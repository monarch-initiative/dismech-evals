  0845928209d89a8030111979029b47a6839bcbc6c54e9866c7c39712c0b9e928:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 37
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 37
            term:
              id: MONDO:0032679
              label: combined oxidative phosphorylation deficiency 37
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: CRISPR MIC13-knockout human cell line
        experimental_model_type: CELL_LINE
        description: 'The first cell line deleted for MIC13, made with CRISPR/Cas in human cells. Where
          the patient fibroblasts show the lesion sitting alongside the disease, a knockout in a clean
          genetic background shows that removing MIC13 is by itself enough to abolish cristae junctions.

          This model also separates the entry''s two mechanistic claims, and the separation is informative
          rather than tidy. Cristae junctions are lost completely and the assembly of MIC10, MIC26 and
          MIC27 into MICOS fails, exactly as in patients. Respiratory chain complex assembly, by contrast,
          is unaffected and respiration falls only moderately, so the model does not reproduce the combined
          respiratory chain deficiency that names the human disease. Either the human deficiency needs
          something this model does not have - an affected tissue, a developmental context, time - or
          the architectural lesion is not a sufficient cause of it.'
        modeled_mechanisms:
        - target: Failure of MICOS Complex Assembly
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: Deleting MIC13 reproduces the selective subcomplex assembly failure observed in
            patient fibroblasts, and shows it follows from the loss of MIC13 alone.
          readouts:
          - name: Assembly of MIC10, MIC26 and MIC27 into the MICOS complex
            target: Failure of MICOS Complex Assembly
            direction: ABOLISHED
            interpretation: The same arm of the complex fails in the knockout as in patients, with the
              MIC60 subcomplex again spared.
        - target: Loss of Cristae Junctions and Inner Membrane Contact Sites
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: CELLULAR
          description: Complete loss of cristae junctions on deletion of MIC13, which is the strongest
            available demonstration that the junction loss is caused by the MIC13 lesion rather than accompanying
            it.
          readouts:
          - name: Crista junction formation in MIC13-knockout mitochondria
            target: Loss of Cristae Junctions and Inner Membrane Contact Sites
            direction: ABOLISHED
            interpretation: Junction formation does not merely decrease, it fails.
        - target: Combined Respiratory Chain Deficiency
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          model_scale: CELLULAR
          description: The knockout does not reproduce the combined respiratory chain deficiency. Complex
            assembly is unaffected and respiration falls only moderately.
          limitations: This is a negative result in a transformed human cell line, not in an affected
            organ. The disease's respiratory deficiency was measured in patient liver and muscle, both
            post-mitotic and both far more dependent on oxidative phosphorylation than a cultured line
            in glucose-containing medium. The model therefore cannot settle whether the architectural
            lesion is insufficient to cause the deficiency, or whether the cellular context needed to
            reveal it is missing - but it does mean the entry's chain from cristae collapse to combined
            deficiency is not demonstrated in the one system where the lesion is isolated.
          readouts:
          - name: Respiratory chain complex assembly and respiration rate in MIC13-knockout cells
            target: Combined Respiratory Chain Deficiency
            direction: UNCHANGED
            interpretation: Complex assembly is preserved; the respiration decrement is moderate rather
              than the severe combined deficiency seen in patient tissue.
      selected_evidence:
        snippet: We show that MIC13 is an inner membrane protein physically interacting with MIC60, a
          central subunit of the MICOS complex.
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/1
      evidence_path: /experimental_models/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27479602
      reference_title: Mic13 Is Essential for Formation of Crista Junctions in Mammalian Cells.
      evidence_source: IN_VITRO
      explanation: Establishes the molecular relationship the model is built to interrogate, which is
        what makes a MIC13 deletion informative about MICOS architecture.
