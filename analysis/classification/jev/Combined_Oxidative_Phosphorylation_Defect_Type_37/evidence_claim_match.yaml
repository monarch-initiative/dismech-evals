        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Mitochondrial DNA Depletion
        role: mechanism
        biological_scale: CELLULAR
        description: 'Reduced mitochondrial DNA copy number, found in Kishita et al.''s patient - the
          reason that group proposed reclassifying MICOS13 as a cause of mitochondrial DNA depletion syndrome
          - and independently again in Ammar et al.''s patient six years later.

          Two independent reports is what moves this from a single-patient observation towards a feature
          of the disease. It remains true that not every report measured copy number, so the denominator
          is the number who looked rather than the number who have it.

          This is unusual for the gene class. Depletion syndromes are typically caused by defects in deoxyribonucleotide
          metabolism or in the mtDNA replication machinery, and MICOS13 is neither. The authors say so
          themselves. Whether cristae collapse causes depletion, or the two are parallel consequences
          of a failing organelle, is not established.'
        biological_processes:
        - preferred_term: mitochondrial DNA replication
          term:
            id: GO:0006264
            label: mitochondrial DNA replication
          modifier: DECREASED
      selected_evidence:
        snippet: Our findings suggest that the novel c.13_29del (p.Trp6Profs*71) MICOS13 variant causes
          hepato-encephalopathy with MTDPS. We propose that MICOS13 is classified as the cause of MTDPS.
        supports: SUPPORT
