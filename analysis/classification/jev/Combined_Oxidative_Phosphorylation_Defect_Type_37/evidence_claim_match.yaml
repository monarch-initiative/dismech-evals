              label: combined oxidative phosphorylation deficiency 37
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic MICOS13 Loss-of-Function
        role: trigger
        biological_scale: MOLECULAR
        description: 'Several reported alleles, all loss of function and all removing the protein rather
          than altering it. The gene is small and every reported variant truncates it.

          The founding allele is the homozygous frameshift p.(Gly15Glufs*75), in a consanguineous brother
          and sister. Later reports add a splice-site variant in C19orf70, the homozygous frameshift c.13_29del
          (p.Trp6Profs*71) which truncates within the first ten residues, and c.209dupT (p.Ala73Argfs*32),
          which removes the second RDSWN motif required for MIC13 function.

          Fibroblasts from the c.13_29del patient have no detectable MICOS13, so these are true nulls
          rather than hypomorphs.'
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: A novel mutation of an essential splice site in the C19orf70 gene encoding QIL1 induces
          severe mitochondrial encephalopathy, hepatopathy and lactate acidosis consistent with psychomotor
          retardation.
        supports: SUPPORT
    origin:
