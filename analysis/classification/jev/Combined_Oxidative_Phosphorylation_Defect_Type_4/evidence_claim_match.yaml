  79e12443d887508c3f046cdc3f4eb8bada15c383e5c677d95d7533a1aa6c34a6:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 4
          disease_term:
            preferred_term: Combined oxidative phosphorylation defect type 4
            term:
              id: MONDO:0012534
              label: combined oxidative phosphorylation defect type 4
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Respiratory chain enzymology showing a combined defect with spared complex II
        description: 'Reduced activity of complexes I, III and IV with preserved complex II in muscle
          or fibroblasts points at mitochondrial translation rather than at any single complex, and narrows
          the search to the nuclear genes of the mitochondrial translation apparatus. The discriminating
          value comes from complex II being normal, not from the other complexes being low.

          The reduced-I/III/IV half of that pattern is now directly reported: an adult proband had reduced
          activity in complexes I, III and IV on endomyocardial biopsy. The complex II *sparing* is still
          inference from the nuclear origin of its subunits rather than a reported measurement, so the
          two halves of this claim do not rest on the same footing. Note also that the informative tissue
          varied - the reported assay was cardiac, not muscle or fibroblast.'
      selected_evidence:
        snippet: He has sensorineural hearing loss, hyperlactatemia with mild illness, and reduced activity
          in mitochondrial complexes I, III, and IV on endomyocardial biopsy.
        supports: SUPPORT
