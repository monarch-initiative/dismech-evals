              label: combined oxidative phosphorylation defect type 4
        context: []
      assertion_type: Genetic
      assertion:
        name: TUFM
        gene_term:
          preferred_term: TUFM
          term:
            id: hgnc:12420
            label: TUFM
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: TUFM encodes mitochondrial elongation factor Tu, a GTPase that binds charged aminoacyl-tRNAs
          and delivers them to the A site of the mitochondrial ribosome. It is one of three nuclear-encoded
          elongation factors of the mitochondrial translation apparatus, alongside TSFM (EF-Ts) and GFM1
          (EF-G1); pathogenic variants in each cause a combined oxidative phosphorylation deficiency,
          and the three were among the first nuclear-gene causes of a mitochondrial translation defect
          to be identified. Reported TUFM alleles are missense, so residual elongation capacity is retained.
        variants:
        - name: TUFM c.1016G>A (p.Arg339Gln)
          description: A recurrent allele reported in four separate publications, found in patients from
            Turkey and proposed as a founder mutation in that population.
          clinical_significance: PATHOGENIC
        - name: TUFM c.344A>C (p.His115Pro)
          description: Homozygous missense allele in the patient who presented with dilated cardiomyopathy
            and lactic acidosis rather than progressive encephalopathy.
          clinical_significance: PATHOGENIC
        - name: TUFM c.1025T>G (p.Val342Gly)
          description: Homozygous allele in the only reported adult patient, whose presentation was hypertrophic
            cardiomyopathy, chronic kidney failure and sensorineural hearing loss with little neurological
            involvement.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: novel mutations in the mitochondrial elongation factor G1 (EFG1) in one affected baby
          and, for the first time, in the mitochondrial elongation factor Tu (EFTu) in another one
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
