              label: combined oxidative phosphorylation defect type 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Combined Respiratory Chain Complex Deficiency
        biological_scale: CELLULAR
        description: Complexes I, III, IV and V each contain at least one mtDNA-encoded subunit and cannot
          be assembled in normal amounts when mitochondrial translation is limiting. Complex II contains
          none and is spared. That pattern - several complexes down together with complex II normal -
          is the diagnostic signature that distinguishes a translation defect from a lesion in an individual
          complex, and it is what the "combined" in the disease name denotes.
        locations:
        - preferred_term: mitochondrion
          term:
            id: GO:0005739
            label: mitochondrion
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex assembly
          term:
            id: GO:0033108
            label: mitochondrial respiratory chain complex assembly
          modifier: DECREASED
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
