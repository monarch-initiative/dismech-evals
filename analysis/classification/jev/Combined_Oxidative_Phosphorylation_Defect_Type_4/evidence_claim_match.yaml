        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: GFM1-related combined oxidative phosphorylation deficiency
        description: GFM1 encodes mitochondrial elongation factor G1, which catalyses translocation. It
          was reported in the same 2007 study that first identified TUFM, in a patient who presented with
          early-onset Leigh syndrome rather than the macrocystic leukodystrophy seen in the EF-Tu patient.
        distinguishing_features:
        - Neuroimaging may differ, with Leigh-pattern basal ganglia and brainstem lesions for GFM1 against
          macrocystic leukodystrophy with polymicrogyria in the index TUFM patient, but this rests on
          single patients and should not be relied on.
        - The distinction is ultimately molecular.
      selected_evidence:
        snippet: The EFG1-mutant patient had early-onset Leigh syndrome, whereas the EFTu-mutant patient
          had severe infantile macrocystic leukodystrophy with micropolygyria.
        supports: SUPPORT
    origin:
