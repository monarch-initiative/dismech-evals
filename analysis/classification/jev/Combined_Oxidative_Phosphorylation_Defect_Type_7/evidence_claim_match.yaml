          panel and an inherited neuropathy panel, and a patient presenting to any one specialty may be
          tested on a panel that omits it. The authors of the Behr series recommend screening the gene
          not only in patients with a demonstrated respiratory chain deficiency but in inherited peripheral
          neuropathies, spastic paraplegias and ataxias, especially where optic atrophy came first.

          Muscle biopsy and respiratory chain enzymology support the diagnosis but do not exclude it:
          the deficiency pattern varies between patients and complexes, and one reported patient had isolated
          complex IV deficiency with I, II and III normal.'
      selected_evidence:
        snippet: "We think that C12orf65 mutations are more frequent \nthan previously suggested and screening\
          \ of this gene should \nbe considered not only in patients with mitochondrial \nrespiratory\
          \ chain deficiencies, but also in inherited \nperipheral neuropathies, spastic paraplegias and\
          \ ataxias, \nespecially with pre-existing optic atrophy."
        supports: SUPPORT
