  a6c66bc9c3e86be5bc79f1ac881cb90b2afcd69d0fc69562b55b0161e208f479:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 7
          disease_term:
            preferred_term: combined oxidative phosphorylation defect type 7
            term:
              id: MONDO:0013306
              label: combined oxidative phosphorylation defect type 7
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mtrfr_species_tolerance_mismatch
        kind: HUMAN_MODEL_MISMATCH
        prompt: Mtrfr-null mice die as embryos, mtrfr-null zebrafish are healthy and fertile, and humans
          with biallelic truncating MTRFR alleles live into adult life with a progressive optic-atrophy-neuropathy-spasticity
          syndrome. What accounts for the three-way difference, and which species should a therapy be
          tested in?
        attaches_to:
        - animal_models#Mtrfr K155* knock-in mouse with human MTRFR transgene rescue
        - animal_models#mtrfr knockout zebrafish
        - pathophysiology#Failure of Mitoribosome Rescue
        rationale: 'This is not the ordinary complaint that a mouse model is imperfect. The mouse cannot
          carry the human genotype at all: a truncating Mtrfr allele of the same class as every reported
          human one is embryonic-lethal in homozygosity, and two independent groups have now failed to
          make a viable null line. Meanwhile the zebrafish carries the same genotype and is healthy and
          fertile, showing a deficit only under starvation. Humans sit between the two, surviving but
          degenerating slowly in three specific neuronal populations.

          The obvious explanation is compensation, and the zebrafish paper offers a concrete one for the
          fish: teleost Ict1 lacks the large-subunit binding motif that most metazoan orthologues carry,
          so Mtrfr may partially substitute for Ict1 there - a redundancy structure that does not exist
          in mammals and therefore cannot explain human survival. So the fish''s tolerance is accounted
          for and the human''s is not. Something lets a person live for decades without a mitoribosome
          rescue factor that a mouse embryo cannot do without, and nobody has identified it.

          That gap has a practical edge. The replacement strategy was necessarily tested by preventing
          a lethal embryonic phenotype in a rescued mouse, because no other mouse experiment is possible
          - there is no untreated null animal to treat. What a patient needs is the opposite experiment:
          intervention after a decade of accumulated optic atrophy and axonal loss, with a median diagnostic
          delay of 17 years between onset and molecular diagnosis. No model currently supports that experiment.
          The human iPSC-derived neurons come closest and are a knockdown rather than a knockout, in dissociated
          culture rather than in a projecting axon.

          The delivery problem underneath this is concrete rather than hypothetical, and the same authors
          name it: an intraocular approach could plausibly treat the optic neuropathy, and delivery to
          the eye would do nothing for the peripheral neuropathy. COXPD7 fails in retina, corticospinal
          tract and peripheral nerve, and no single route reaches all three.

          Answering the compensation question would do more than tidy the species table. If a mammalian
          factor partially substitutes for MTRFR in humans and not in mice, that factor is a therapeutic
          target in its own right, and one that would not require gene delivery to the retina and spinal
          cord at all.'
        proposed_experiments:
        - experiment_id: exp_coxpd7_compensation_screen_and_delayed_rescue
          name: Identify the human compensating factor, and test delayed MTRFR restoration
          description: Two linked arms. First, compare the mitoribosome quality control machinery of human,
            mouse and zebrafish cells depleted of MTRFR - quantitative proteomics of the mitoribosome
            and its associated factors, plus a CRISPR modifier screen in human MTRFR-null cells for genes
            whose additional loss becomes lethal - to identify what substitutes in humans and not in mice.
            Second, in human iPSC-derived retinal ganglion cells and motor neurons carrying a patient
            GGQ-domain truncating allele rather than a knockdown, allow the mitochondrial and axonal phenotypes
            to establish over an extended culture period, then deliver AAV9-MTRFR and measure whether
            respiration, membrane potential and axonal integrity recover or merely stop deteriorating.
          would_support:
          - pathophysiology#Failure of Mitoribosome Rescue
          supporting_outcome:
          - A human-specific factor is identified whose loss makes MTRFR essential, and delayed restoration
            in patient-genotype neurons recovers respiration and axonal integrity rather than only arresting
            decline, which would make post-diagnosis gene replacement a coherent clinical goal and would
            supply a second, non-delivery-dependent target.
          would_refute:
          - pathophysiology#Failure of Mitoribosome Rescue
          refuting_outcome:
          - No compensating factor distinguishes the species, and delayed restoration corrects the biochemistry
            without recovering axonal integrity, which would mean the neuronal loss is irreversible once
            established and would confine any replacement strategy to presymptomatic infants identified
            by family history or newborn genomic screening.
      selected_evidence:
        snippet: A truncating mutation (K155*) was generated in mice; however, homozygotes die embryonically
          whereas mice heterozygous for this K155* allele are normal.
        supports: SUPPORT
