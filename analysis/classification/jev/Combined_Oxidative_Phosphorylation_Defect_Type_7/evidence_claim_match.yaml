          a lethal embryonic phenotype in a rescued mouse, because no other mouse experiment is possible
          - there is no untreated null animal to treat. What a patient needs is the opposite experiment:
          intervention after a decade of accumulated optic atrophy and axonal loss, with a median diagnostic
          delay of 17 years between onset and molecular diagnosis. No model currently supports that experiment.
          The human iPSC-derived neurons come closest and are a knockdown rather than a knockout, in dissociated
          culture rather than in a projecting axon.

