    evidence_metadata:
      reference: PMID:25995486
      reference_title: Homozygous p.V116* mutation in C12orf65 results in Leigh syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: 'The strongest single argument that the clinical labels are not genotype-determined:
        the same p.V116* allele is reported once as Leigh syndrome and once as CMT6. It does not refute
        the positional severity rule, but it does mean position cannot be the whole story, and it is why
        the proposed reanalysis tests label against position rather than assuming they agree.'
