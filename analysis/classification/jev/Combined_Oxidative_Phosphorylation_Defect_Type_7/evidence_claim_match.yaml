        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Mitoribosome Rescue
        description: 'Without MTRFR, a mitoribosome that stalls during elongation is not cleared. The
          nascent chain stays attached, the ribosome is not recycled, and the pool of ribosomes available
          for productive synthesis shrinks. This node is where the disease''s specificity lies: MTRFR
          does not read stop codons, so the lesion is not a failure to finish normal proteins but a failure
          to recover from abnormal termination events.

          A sibling factor, ICT1, performs a related rescue and is additionally a structural protein of
          the mitochondrial large ribosomal subunit, which is why its loss is lethal where MTRFR loss
          is not. That difference is the reason a human can live with no MTRFR at all.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: rescue of stalled mitochondrial ribosome
          term:
            id: GO:7770016
            label: rescue of stalled mitochondrial ribosome
          modifier: DECREASED
      selected_evidence:
        snippet: We report the discovery of a mitoribosome-associated quality control pathway that responds
          to interruptions during elongation, and we present structures at 3.1- to 3.3-angstrom resolution
          of mitoribosomal large subunits trapped during ribosome rescue.
        supports: SUPPORT
