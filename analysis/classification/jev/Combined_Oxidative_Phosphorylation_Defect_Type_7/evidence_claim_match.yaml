            term:
              id: MONDO:0013306
              label: combined oxidative phosphorylation defect type 7
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Mitoribosome Rescue
        description: 'Without MTRFR, a mitoribosome that stalls during elongation is not cleared. The
          nascent chain stays attached, the ribosome is not recycled, and the pool of ribosomes available
          for productive synthesis shrinks. This node is where the disease''s specificity lies: MTRFR
          does not read stop codons, so the lesion is not a failure to finish normal proteins but a failure
          to recover from abnormal termination events.

          A sibling factor, ICT1, performs a related rescue and is additionally a structural protein of
          the mitochondrial large ribosomal subunit, which is why its loss is lethal where MTRFR loss
          is not. That difference is the reason a human can live with no MTRFR at all.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: rescue of stalled mitochondrial ribosome
          term:
            id: GO:7770016
            label: rescue of stalled mitochondrial ribosome
          modifier: DECREASED
      selected_evidence:
        snippet: ICT1 also functions as a ribosomal protein of the mitochondrial large ribosomal subunit
          (mtLSU) in mice and humans, and its deletion is lethal. In contrast, MTRFR does not share this
          role.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40376928
      reference_title: 'Knockout of the mitoribosome rescue factors Ict1 or Mtrfr is viable in zebrafish
        but not mice: compensatory mechanisms underlying each factor''s loss.'
      evidence_source: MODEL_ORGANISM
      explanation: Why the two rescue factors are not interchangeable, and why complete MTRFR loss is
