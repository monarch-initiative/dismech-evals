      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: mitoribosome_rescue_failure_model
        hypothesis_label: Failed mitoribosome rescue causing a global mitochondrial translation defect
        status: CANONICAL
        description: 'MTRFR is a member of the mitochondrial class I peptide release factor family and
          carries the GGQ motif those factors use, but it does not hydrolyse peptidyl-tRNA on bacterial
          ribosomes in vitro, so it is not a conventional stop-codon release factor. Structural work on
          stalled mitoribosomes places it in a quality-control pathway instead: MTRFR ejects the nascent
          chain from a mitoribosome that has stalled during elongation, while a partner protein ejects
          the peptidyl-tRNA. Losing that rescue step leaves ribosomes occupied, and the measured consequence
          in patient fibroblasts is a global and uniform decrease in mitochondrial translation, with no
          reduction in mitochondrial mRNAs, tRNAs, rRNAs, elongation factors or ribosomal proteins - so
          it is the process that fails, not its substrates or machinery.'
      selected_evidence:
        snippet: Release factor homolog C12orf65 (mtRF-R) and RNA binding protein C6orf203 (MTRES1) eject
          the nascent chain and peptidyl transfer RNA (tRNA), respectively, from stalled ribosomes.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
