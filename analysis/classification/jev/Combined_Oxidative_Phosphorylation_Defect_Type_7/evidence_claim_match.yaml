              label: combined oxidative phosphorylation defect type 7
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Energy Failure in Long-Projection and Optic Neurons
        description: 'The clinical selectivity of COXPD7 is the selectivity of a bioenergetic disease.
          Retinal ganglion cells with long unmyelinated intraretinal axons, corticospinal tract neurons
          and long peripheral motor axons are the cells that fail, which is why the disease presents as
          optic atrophy plus spastic paraparesis plus axonal neuropathy rather than as a generalised encephalopathy.
          Nerve biopsy in one family showed loss of large myelinated and unmyelinated fibres, and electrophysiology
          in the Behr-phenotype series localised widespread lower motor neuron and anterior horn cell
          lesions.

          The cell-selectivity argument is inference. It is the standard reasoning applied to mitochondrial
          optic neuropathies and it fits the phenotype, but no study has measured respiratory chain function
          in a patient''s retinal ganglion cells or corticospinal neurons, and the fibroblasts and lymphoblasts
          that were assayed are not the cells that die.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: retinal ganglion cell
          term:
            id: CL:0000740
            label: retinal ganglion cell
        - preferred_term: motor neuron
          term:
            id: CL:0000100
            label: motor neuron
        locations:
        - preferred_term: optic nerve
          term:
            id: UBERON:0000941
            label: cranial nerve II
        - preferred_term: brainstem
          term:
            id: UBERON:0002298
            label: brainstem
      selected_evidence:
        snippet: Our study broadens the phenotypic spectrum of C12orf65 defects and highlights the triad
          of optic atrophy, axonal neuropathy and spastic paraparesis as its key clinical features.
        supports: SUPPORT
