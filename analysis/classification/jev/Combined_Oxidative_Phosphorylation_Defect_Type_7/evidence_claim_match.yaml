  61b3d2254f9cf5b4abbf03ef036f6038ef66fbe99a2dc700bea80baa5072a6a7:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 7
          disease_term:
            preferred_term: combined oxidative phosphorylation defect type 7
            term:
              id: MONDO:0013306
              label: combined oxidative phosphorylation defect type 7
        context: []
      assertion_type: Genetic
      assertion:
        name: MTRFR
        notes: 'MTRFR at 12q24.31, previous symbol C12orf65, encodes a mitochondrial matrix protein of
          the class I peptide release factor family. It carries the family''s GGQ motif but is not a conventional
          release factor: it does not hydrolyse peptidyl-tRNA on bacterial ribosomes, and structural work
          places it in mitoribosome quality control, ejecting the nascent chain from a ribosome stalled
          during elongation.

          Its closest functional relative in human mitochondria is ICT1, which performs a related rescue
          but is also a structural protein of the mitochondrial large ribosomal subunit. That difference
          matters clinically: ICT1 deletion is lethal, MTRFR loss is not, and the asymmetry is what makes
          a complete-null human disease possible for one gene and not the other.

          Every reported disease allele is truncating. There is no reported missense COXPD7 allele, so
          the human data contain no hypomorphic series, and severity is instead graded by where the truncation
          falls - GGQ-domain disruption at the severe end, C-terminal truncation at the milder. A synonymous
          variant, c.282G>A p.Lys94Lys, is in the pathogenic set because it destroys a splice site and
          retains an intron, acting as a frameshift.

          Genetic background may modify the phenotype. In one Chinese series, three of four patients homozygous
          for the same MTRFR variant also carried variants in MT-ND4 and OPA1, and the authors propose
          that the heterogeneity of the optic neuropathy in MTRFR disease may be shaped by other genes
          affecting mitochondrial function. That is a hypothesis from co-occurrence in a small series,
          not a demonstrated modifier effect.'
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: MTRFR
          term:
            id: hgnc:26784
            label: MTRFR
      selected_evidence:
        snippet: 'gene at chromosome 12q24.31

          comprises three exons'
        supports: SUPPORT
