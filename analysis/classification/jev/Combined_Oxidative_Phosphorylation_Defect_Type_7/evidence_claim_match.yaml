          value:
            name: Mtrfr K155* knock-in mouse with human MTRFR transgene rescue
            species: Mouse
            genotype: Mtrfr K155* homozygous, with a transgene expressing wild-type or partially functional
              human MTRFR
            publication: PMID:40452409
            description: 'A gene-replacement feasibility study built on a mouse that should not exist.
              A truncating K155* allele was engineered; homozygotes die embryonically while heterozygotes
              are normal. Transgenic strains expressing wild-type or partially functional human MTRFR
              were then crossed in: a single copy of the wild-type transgene completely rescued the homozygous
              phenotype, the mutant transgene rescued less efficiently, and detailed evaluation of the
              rescued animals found no abnormalities. Neither transgene caused adverse effects in vivo,
              despite dose-dependent phenotypes from overexpression in cell culture.'
            genes:
            - preferred_term: MTRFR
              term:
                id: hgnc:26784
                label: MTRFR
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: MTRFR Biallelic Loss of Function
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: The mouse null does not model the human disease because it does not survive to have
          one. Human patients homozygous for truncating MTRFR alleles are born, develop normally for months
          to years, and present in childhood; the equivalent mouse dies in utero. That is a qualitative
          species difference in tolerance of the same genotype, not a difference in severity, and it is
          recorded as a failure rather than as partial recapitulation because there is no phenotype in
          the homozygote to compare with a patient's.
        limitations: 'The lethality is not marginal and it is not an artefact of a badly chosen allele.
          Homozygous embryos are recovered at the expected frequency at E10.5 and E11.5 and none at all
          from E12.5 onward, using an allele that should retain partial activity by extrapolation from
          the human truncation series - so a genotype milder than several human ones is still lethal in
          mid-gestation. The authors'' conclusion is that mice are more sensitive to loss of Mtrfr than
          humans are.

          Embryonic lethality means no untreated homozygous animal exists to characterise, so every observation
          in this line comes from transgene-rescued animals. The rescue therefore tests whether supplying
          MTRFR prevents the mouse phenotype, which is a different question from whether supplying it
          helps a patient whose disease has already begun. The transgene is human MTRFR expressed from
          a non-native promoter, so neither its level nor its tissue distribution matches endogenous expression.'
        readouts:
        - name: Survival of Mtrfr K155* homozygotes
          target: MTRFR Biallelic Loss of Function
          direction: ABOLISHED
          interpretation: Homozygous null mouse embryos do not survive to birth, where homozygous null
            humans reach adult life.
      selected_evidence:
        snippet: A truncating mutation (K155*) was generated in mice; however, homozygotes die embryonically
          whereas mice heterozygous for this K155* allele are normal.
        supports: SUPPORT
