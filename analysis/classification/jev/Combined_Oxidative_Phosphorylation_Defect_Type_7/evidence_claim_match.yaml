        context: []
      assertion_type: Treatment
      assertion:
        name: Multidisciplinary Supportive Care with Genetic Counselling
        description: 'There is no disease-modifying treatment. Management is supportive and multidisciplinary
          - low-vision support for the optic atrophy, physical therapy and orthoses for the spasticity
          and foot drop, and respiratory and nutritional surveillance in patients with bulbar involvement
          - together with counselling for a recessive condition carrying a 25 percent sibling recurrence
          risk.

          The mitochondrial vitamin cocktail routinely offered in mitochondrial disease has been given
          and reported not to alter the course in the severe Leigh presentation. That is a single patient,
          so it is recorded as an observation rather than as evidence against the practice.'
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: supportive care
          term:
            id: NCIT:C15747
            label: Supportive Care
        notes: Gene replacement is not curated as a treatment. The work is preclinical and is recorded
          under animal_models and experimental_models, where its central limitation - that the mouse the
          strategy was tested in had to be rescued from embryonic lethality that human patients do not
          experience - can be stated beside it. No MTRFR-specific clinical trial was identified.
      selected_evidence:
        snippet: COXPD7 associated with the C12orf65 gene results from homozygous or compound heterozygous
          mutations, with primary clinical manifestations of optic nerve atrophy and delays in intellectual
          and motor development.
        supports: SUPPORT
