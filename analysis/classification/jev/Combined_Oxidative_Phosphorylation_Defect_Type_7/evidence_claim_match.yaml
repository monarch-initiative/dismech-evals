  56700671223817b6fed1efd107d95dd29095bdc33a78d58a9aca61b79698c195:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Defect Type 7
          disease_term:
            preferred_term: combined oxidative phosphorylation defect type 7
            term:
              id: MONDO:0013306
              label: combined oxidative phosphorylation defect type 7
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coxpd7_nosology_behr_spg55_leigh
        kind: KNOWLEDGE_GAP
        prompt: Biallelic MTRFR loss is reported under at least five disease names - COXPD7, SPG55, Behr
          syndrome, Leigh syndrome and a CMT6-like neuropathy. Is there anything other than referral route
          that distinguishes them?
        attaches_to:
        - disease#Combined Oxidative Phosphorylation Defect Type 7
        - genetic#MTRFR
        - progression#Diagnostic delay
        rationale: 'The five names are not five diseases. They are the same recessive truncating-allele
          disorder named after whichever of its features presented first: an ophthalmologist sees optic
          atrophy and thinks Behr, a neurologist sees spastic paraparesis and thinks hereditary spastic
          paraplegia, a paediatrician sees a symmetrical brainstem lesion and thinks Leigh, and a biochemist
          sees a combined respiratory chain deficiency and calls it COXPD7. This entry curates them as
          one entity for that reason, and does not create subtypes.

          What is not settled is whether any real axis underlies the labels. The candidate is the positional
          genotype-phenotype rule: GGQ-domain truncations at the severe, Leigh-like, cognitively impaired
          end and C-terminal truncations at the milder, cognition-sparing end. That rule is stated as
          anticipated and expected by the authors who proposed it and was supported in a second family
          by the general observation that a longer surviving protein gives a milder phenotype - but it
          has never been tested against the whole reported cohort with a defined severity scale, and the
          review that classified 27 patients by severity found that severe variants were only *more likely*
          to affect the GGQ domain, not restricted to it.

          There is also a direct counter-observation. The identical p.V116* allele has been reported as
          Leigh syndrome in monozygotic twins and, previously, as Charcot-Marie-Tooth disease type 6 in
          an unrelated Indian family. One allele, two labels - so whatever the positional rule explains,
          it cannot be the whole determinant of which clinic a patient ends up in.

          Two things make this worth resolving rather than leaving as a nomenclature curiosity. The diagnostic
          delay is a median of 13 years, and a large part of it is that each specialty tests a panel built
          around its own label; establishing that these are one entity is what would put MTRFR on all
          of them. And if the positional rule holds, a family receiving a C-terminal truncation result
          could be told something useful about cognitive prognosis at diagnosis, which is currently not
          possible.

          There is also an unresolved disagreement to record rather than paper over. The 2015 series argues
          that classical Behr syndrome is typically an MTRFR disease and that the phenotype Behr described
          was probably not caused by the genes usually credited with it; dismech''s own Behr Syndrome
          entry is organised around OPA1 with MTRFR listed as one of several phenocopy genes. Both cannot
          be the best description of the same concept.'
        proposed_experiments:
        - experiment_id: exp_coxpd7_pooled_genotype_severity_analysis
          name: Pooled reanalysis of all reported MTRFR patients against variant position
          description: Assemble every published MTRFR patient with individual-level data, code each variant
            by the position of its predicted stop relative to the GGQ domain and by predicted residual
            protein length, and score each patient on a prespecified severity scale covering cognitive
            status, ambulation, bulbar involvement and MRI findings. Test whether residual protein length
            predicts severity, and separately whether the clinical label the patient was given predicts
            anything once variant position is accounted for.
          would_support:
          - genetic#MTRFR
          supporting_outcome:
          - Residual protein length predicts severity across the pooled cohort while the assigned clinical
            label adds nothing once position is included, which would confirm the five names as referral
            artefacts, put a usable prognostic statement into counselling, and justify adding MTRFR to
            every panel that any of the five labels routes a patient to.
          would_refute:
          - genetic#MTRFR
          refuting_outcome:
          - Severity is unrelated to variant position, which would retire the positional rule, leave the
            phenotypic heterogeneity unexplained by genotype, and redirect the search towards the modifier
            hypothesis raised by the co-occurring MT-ND4 and OPA1 variants in the Chinese pedigrees.
      selected_evidence:
        snippet: Interestingly, the identical mutation was previously reported in an Indian family with
          Charcot-Marie Tooth disease type 6, which displayed some overlapping clinical features with
          the twins.
        supports: SUPPORT
