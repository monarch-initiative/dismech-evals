      assertion_type: Pathophysiology
      assertion:
        name: Combined Respiratory Chain Complex Deficiency
        description: 'The four complexes built partly from mitochondrially encoded subunits fail together,
          and complex II - encoded entirely in the nucleus - is spared. The pattern reported in the founding
          patients is a severe decrease in complexes I, IV and V with a smaller decrease in complex III.
          Individual patients depart from that: one had isolated complex IV deficiency at 40 percent of
          control values with complexes I, II and III normal, another had complex V assembly and activity
          reduced with a fall in respiration rate and mitochondrial membrane potential. A normal assay
          on one complex in one tissue therefore does not exclude the diagnosis.'
        biological_scale: MOLECULAR
        biological_processes:
        - preferred_term: mitochondrial respiratory chain complex assembly
          term:
            id: GO:0033108
            label: mitochondrial respiratory chain complex assembly
          modifier: DECREASED
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
      selected_evidence:
        snippet: complex V activity and stability (blue native gel assay), decrease in mitochondrial respiration
          rate and reduction of mitochondrial membrane potential.
        supports: SUPPORT
