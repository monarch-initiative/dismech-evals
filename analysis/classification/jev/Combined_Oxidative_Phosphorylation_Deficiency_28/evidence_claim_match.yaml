        description: 'Sildenafil, bosentan and intravenous treprostinil are the standard escalation for
          paediatric pulmonary arterial hypertension, and in the one reported SLC25A26 patient they failed:
          pulmonary pressures stayed near systemic and repeated attempts to wean inhaled nitric oxide
          provoked tachypnoea, hypoxaemia and worsening echocardiographic hypertension. The failure is
          the clinically useful part of the record, and it is why this treatment is curated alongside
          the rescue therapy rather than omitted.

          '
