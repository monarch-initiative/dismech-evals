      assertion_type: Diagnosis
      assertion:
        name: Differential against the lipoic-acid and PDH-complex disorders
        description: 'The impaired lipoic acid biosynthesis in this disease puts it in the same biochemical
          neighbourhood as the multiple mitochondrial dysfunction syndromes (NFU1, BOLA3, ISCA2, IBA57),
          which share lactic acidosis, combined respiratory-chain defects, and impairment of the lipoic-acid-dependent
          dehydrogenases. That overlap is the diagnostically useful fact: it is why SLC25A26 sits on pyruvate-dehydrogenase-complex
          deficiency gene panels rather than being reached by targeted testing, and why a patient with
          low PDHC activity and no PDHA1 variant should have this gene covered.

          '
      selected_evidence:
        snippet: characterized by lactic acidosis, hyperglycinemia, multiple defects of the respiratory
          chain complexes, and impairment of four lipoic acid-dependent enzymes
        supports: SUPPORT
