      assertion_type: ExperimentalModel
      assertion:
        name: Saccharomyces cerevisiae SAM5-null complementation assay
        experimental_model_type: OTHER
        organism:
          preferred_term: Saccharomyces cerevisiae
          term:
            id: NCBITaxon:4932
            label: Saccharomyces cerevisiae
        publication: PMID:26522469
        description: 'A yeast strain lacking the SAMC ortholog SAM5 cannot grow on non-fermentable carbon
          sources. Expressing each human patient allele in that strain asks whether the allele can do
          the job, and grades how well. This is the functional proof that the human protein is the SAM
          carrier and that the patient alleles impair it, and it produced the residual-activity gradient
          the entry''s genotype-severity reading rests on.

          Filed under experimental_models rather than animal_models: yeast is not an animal, and ExperimentalModel
          is where non-animal systems belong. experimental_model_type is OTHER because a complementation
          assay in a null strain is not an organoid, cell line, chip or primary culture.

          '
        modeled_mechanisms:
        - target: SLC25A26 Loss of Function
          relationship: MEASURES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: The assay measures the transport competence of each human allele directly, which
            is precisely what this node asserts is impaired.
          limitations: Growth rescue in yeast reports carrier function in a yeast membrane and says nothing
            about the human tissue distribution of the consequence, nor about which downstream methylation
            reactions fail first. It also cannot address the SAM-versus-SAH branch, since the readout
            is growth rather than directional flux.
          readouts:
          - name: Growth on non-fermentable carbon sources after complementation
            target: SLC25A26 Loss of Function
            direction: DECREASED
            interpretation: Failure to restore growth indicates the allele cannot perform the carrier
              function.
      selected_evidence:
        snippet: SAMCΔ1–88 was completely inactive, whereas p.Ala102Val and p.Pro199Leu variants exhibited
          negligible activity, and p.Val148Gly strongly inhibited SAMC activity (15% of wild-type SAMC).
        supports: SUPPORT
    origin:
      assertion_path: /experimental_models/0
