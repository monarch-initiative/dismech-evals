  c71ed00e14ecd0d95b88a35c3560708891d80199654c2ceb000a3b794e3a23de:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 28
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 28
            term:
              id: MONDO:0014775
              label: combined oxidative phosphorylation deficiency 28
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: sam_versus_sah_transport_branch
        hypothesis_label: SAM-import versus SAH-export loss sets the severity
        status: EMERGING
        description: 'That the severity of COXPD28 is determined by which leg of the antiport a variant
          impairs, rather than by how much total carrier activity it removes. Variants reducing SAM import
          give severe neonatal disease; variants preferentially impairing SAH export give mild, adult-onset
          mitochondrial myopathy. If correct this is directly actionable - it makes the genotype prognostic
          in a disease that has no other prognostic marker - and it would also predict that SAM supplementation
          helps one group and not the other.

          EMERGING rather than established. The directional claim rests on two unrelated adult patients
          plus mouse and fruit fly models; the authors themselves write "likely". No human assay separates
          the two transport activities, so a patient''s branch is currently inferred from phenotype, which
          makes the correlation hard to test without circularity.'
      selected_evidence:
        snippet: Our findings associate a novel pathomechanism with a known disease-causing protein and
          highlight the quests of precision medicine in optimizing diagnosis, therapeutic intervention
          and prognosis.
        supports: SUPPORT
