      assertion:
        name: SLC25A26 Loss of Function
        description: 'Biallelic SLC25A26 variants reduce expression and function of SAMC, the mitochondrial
          S-adenosylmethionine carrier. The reported alleles are transmembrane missense changes that lower
          rather than abolish the protein, which is consistent with a spectrum of severity rather than
          a uniform lethal phenotype.

          '
        biological_scale: MOLECULAR
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
        genes:
        - preferred_term: SLC25A26
          term:
            id: hgnc:20661
            label: SLC25A26
        molecular_functions:
        - preferred_term: S-adenosyl-L-methionine transmembrane transporter activity
          modifier: DECREASED
          term:
            id: GO:0000095
            label: S-adenosyl-L-methionine transmembrane transporter activity
        notes: 'SAMC abundance is itself regulated: FBXO24, an F-box protein of the SCF E3 ubiquitin ligase
          complex, mediates K6-linked polyubiquitylation of SLC25A26 at lysine 31 and targets it for degradation.
          Recorded here as a note on this node rather than as a `genetic` row with `relationship_type:
          MODIFIER`, because the work is in mouse spermiogenesis and no human FBXO24 variant has been
          linked to this disease; calling it a modifier would assert a human genotype-phenotype relationship
          that nobody has reported. It is worth carrying because it establishes that the carrier has a
          dose that something controls, which is the shape a modifier would take if one is found - and
          because the same study shows elevated SLC25A26 is also deleterious, matching the overexpression
          result cited on the methylation node.'
      selected_evidence:
        snippet: the expression levels of SLC25A26 mRNA and S-adenosylmethionine carrier (SAMC) protein
          in cells transfected with SLC25A26 mutant plasmid were significantly lower than those transfected
          with wild type plasmid
        supports: SUPPORT
