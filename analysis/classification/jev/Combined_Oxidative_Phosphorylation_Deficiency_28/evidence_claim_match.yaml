        context: []
      assertion_type: Treatment
      assertion:
        name: Riociguat for Refractory Pulmonary Hypertension
        description: 'Riociguat, an oral soluble guanylate cyclase stimulator, was used as rescue therapy
          in a four-month-old with compound heterozygous SLC25A26 mutation and near-systemic pulmonary
          hypertension, after conventional combination PAH therapy had failed. It allowed successful weaning
          off inhaled nitric oxide over one week.

          Two caveats are load-bearing. This is a single patient in a two-case series, and the other case
          had an unrelated genotype (TBX4), so nothing here is specific to SLC25A26 beyond the fact that
          this patient had it. And riociguat acts on the pulmonary vasculature, not on the carrier defect
          - it treats the most dangerous complication of the disease without touching its cause.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: riociguat
            term:
              id: CHEBI:76018
              label: riociguat
      selected_evidence:
        snippet: Case 2 is a 4-month-old term male with compound heterozygous SLC25A26 mutation and severe
          pulmonary hypertension. Initial cardiac catheterization showed PVRi 28.2 WU*m2.
        supports: SUPPORT
