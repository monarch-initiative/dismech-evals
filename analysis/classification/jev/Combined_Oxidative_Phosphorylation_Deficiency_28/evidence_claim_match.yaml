            term:
              id: MONDO:0014775
              label: combined oxidative phosphorylation deficiency 28
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Matrix SAH Export
        description: 'The second limb of the antiport. SAH is the by-product of every methylation reaction,
          and mitochondria have no route to regenerate it - both SAM synthesis and SAH recycling are cytoplasmic
          - so SAH must leave the matrix on the carrier that brings SAM in. When export is preferentially
          impaired, matrix SAH accumulates and product-inhibits the same methyltransferases that SAM depletion
          would starve. The consequence converges on the node below, which is why one gene gives one biochemical
          syndrome by two routes.

          This limb is associated with the mild, adult-onset phenotype, and the association was established
          in mouse and fruit fly rather than in patients.

          '
        biological_scale: MOLECULAR
        chemical_entities:
        - preferred_term: S-adenosyl-L-homocysteine
          modifier: INCREASED
          term:
            id: CHEBI:16680
            label: S-adenosyl-L-homocysteine
        cellular_components:
        - preferred_term: mitochondrial matrix
          term:
            id: GO:0005759
            label: mitochondrial matrix
      selected_evidence:
        snippet: Therefore, the intramitochondrial SAM-dependent methyltransferases require the import
          of SAM and export of SAH for recycling.
        supports: SUPPORT
    origin:
