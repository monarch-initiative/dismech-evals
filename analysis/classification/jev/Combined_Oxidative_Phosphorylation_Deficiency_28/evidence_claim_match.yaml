  fa24b021ef1e107f81e72ffd7663d79ff50ac37ead877c59d3193bcf58a18d17:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 28
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 28
            term:
              id: MONDO:0014775
              label: combined oxidative phosphorylation deficiency 28
        context: []
      assertion_type: Genetic
      assertion:
        name: SLC25A26
        gene_term:
          preferred_term: SLC25A26
          term:
            id: hgnc:20661
            label: SLC25A26
        relationship_type: CAUSATIVE
        notes: 'SLC25A26 encodes SAMC, a member of the mitochondrial carrier family expressed in all human
          tissues examined.

          The reported allele spectrum is mostly missense but is not exclusively so, and the exception
          is the informative one. Of the three index families: P1 was homozygous for c.443T>C (p.Val148Gly);
          P2 compound heterozygous for c.305C>T (p.Ala102Val) and c.596C>T (p.Pro199Leu); and P3 homozygous
          for the splice allele c.33+1G>A, whose transcript lacks the first two transmembrane helices,
          fails to reach mitochondria, and is a functional null. The two later Chinese patients carry
          the recurrent compound-heterozygous pair c.34G>C (p.A12P) and c.197C>A (p.A66E) in transmembrane
          regions 1 and 2. The two adults carry c.425G>A (p.Arg142Gln) homozygous, and c.190+4A>G with
          c.404A>G (p.Glu135Gly) in compound heterozygosity.

          Residual carrier activity tracks severity, and it was measured rather than inferred. Yeast complementation
          and in vitro reconstitution graded the alleles: the splice-derived SAMCdelta1-88 completely
          inactive, p.Ala102Val and p.Pro199Leu negligible, p.Val148Gly retaining 15% of wild-type activity.
          P3, carrying the functional null, died at five days; the adults sit at the other end. That gradient
          is the entry''s basis for treating severity as allele-dependent rather than stochastic - and
          it is why the earlier formulation of this note, which claimed reported variants were "missense
          rather than nulls", was wrong: the null exists and is the severe end of the very gradient the
          claim was reaching for.

          '
      selected_evidence:
        snippet: The novel compound heterozygous SLC25A26 variants (c.34G > C, p.A12P; c.197C > A; p.A66E)
          were identified in a Chinese patient with COXPD28. These two variants are located in the transmembrane
          region 1 and transmembrane region 2, respectively.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34375635
      reference_title: Identification and characterization of novel compound variants in SLC25A26 associated
