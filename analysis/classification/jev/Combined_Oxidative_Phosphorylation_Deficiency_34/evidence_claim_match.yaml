      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: BELOW_1_IN_1000000
        notes: 'Three patients in two families, reported in 2015 and 2022, and no further case found in
          a September 2026 PubMed and Europe PMC search on the gene symbol. No population estimate exists
          and none could be made: both families were ascertained through diagnostic exome sequencing,
          the first from a mitochondrial-disease phenotype and the second from a premature ovarian insufficiency
          phenotype. The prevalence_class is the numeric floor tier; no rate_per_100000 is given because
          none has been reported.

          One caveat on the count of three. The falcon deep-research report committed alongside this entry
          states, from the full text of the 2022 paper, that the second family also included a similarly
          affected sister whose genotype was not reported. The abstract - which is all that was retrievable
          into the reference cache - does not mention her, so that fourth individual could not be verified
          against a quotable source and is not counted in the denominators used throughout this entry.
          If she is real, every "of 3" figure below is a "of 4" with an ungenotyped member, which would
          not change any band.'
      selected_evidence:
        snippet: Variants in MRPS7 have been described only once in the literature and were identified
          in sisters, one of whom presented with congenital sensorineural hearing loss and POI, consistent
          with our patient phenotype.
        supports: SUPPORT
