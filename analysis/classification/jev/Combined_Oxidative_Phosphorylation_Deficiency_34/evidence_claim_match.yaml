  7837fa89509aa516e324b188aebce1e7be1f963e1d3a72e479210c22d15bd9d5:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 34
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 34
            term:
              id: MONDO:0054741
              label: combined oxidative phosphorylation deficiency 34
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Destabilization of the uS7m Protein of the Mitoribosomal Small Subunit
        biological_scale: MOLECULAR
        description: 'MRPS7 is a 12S ribosomal-RNA-binding protein of the small subunit of the mitochondrial
          ribosome and is required for that subunit''s assembly. The mammalian mitoribosome is a 55S particle
          built from a 28S small subunit - 12S rRNA plus about thirty nuclear-encoded proteins - and a
          39S large subunit, with the proteins arranged largely on the periphery around the catalytic
          RNA core. A missense change at a conserved residue in one of those thirty proteins is therefore
          a defect in the scaffold that holds the rRNA in place, not in a catalytic site.

          The general rule established across mitoribosomal-protein disease is that such variants reduce
          the steady-state level of the affected protein, and this entry follows that reading. No direct
          measurement of MRPS7 protein abundance in patient cells is reported in the sources cited here,
          so this node is an inference from the assembly and rRNA phenotypes below rather than a measured
          quantity.'
        genes:
        - preferred_term: MRPS7
          term:
            id: hgnc:14499
            label: MRPS7
        cellular_components:
        - preferred_term: mitochondrial small ribosomal subunit
          term:
            id: GO:0005763
            label: mitochondrial small ribosomal subunit
        molecular_functions:
        - preferred_term: 12S rRNA binding
          term:
            id: GO:0070181
            label: small ribosomal subunit rRNA binding
      selected_evidence:
        snippet: MRPS7 is a 12S ribosomal RNA-binding subunit of the small mitochondrial ribosomal subunit,
          and is required for the assembly of the small ribosomal subunit.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
