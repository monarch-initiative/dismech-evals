  34881bf9ad134466b0c4c6de13d50932bc637c4b21abb73daec3a3d6f4dfa59e:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 34
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 34
            term:
              id: MONDO:0054741
              label: combined oxidative phosphorylation deficiency 34
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Combined respiratory-chain deficiency followed by exome sequencing
        description: 'The diagnostic logic in the founding family runs from the biochemistry to the gene.
          A *combined* deficiency of complexes I, III and IV - sparing complex II, the one complex with
          no mtDNA-encoded subunit - localises the lesion to mitochondrial gene expression, which narrows
          an otherwise unmanageable candidate list to the mitoribosome, the mitochondrial aminoacyl-tRNA
          synthetases, the translation factors and mtDNA maintenance. Whole-exome sequencing then names
          the gene. There is no MRPS7-specific biomarker and nothing that distinguishes this entity from
          any other mitochondrial translation defect short of sequencing.

          The second family reached the same gene from the opposite direction, through an exome performed
          for premature ovarian insufficiency. That is worth recording as a diagnostic route in its own
          right: a patient can arrive at this gene through a reproductive-endocrine presentation with
          no mitochondrial-disease workup at all.'
      selected_evidence:
        snippet: Functional defects of the mitochondrial translation machinery, as a result of mutations
          in nuclear-encoded genes, have been associated with combined oxidative phosphorylation (OXPHOS)
          deficiencies.
        supports: SUPPORT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
