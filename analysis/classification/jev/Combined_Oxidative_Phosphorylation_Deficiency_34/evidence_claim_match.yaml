        biological_scale: MOLECULAR
        description: Two damaged copies of MRPS7. Three alleles are known across the two published families.
          The 2015 sisters are homozygous for c.550A>G, p.Met184Val, replacing a highly conserved methionine.
          The 2022 patient carries c.373A>T, p.(Lys125*), a nonsense allele, in trans with c.536G>A, p.(Arg179His);
          both were novel at the time of report and were called pathogenic on in-silico prediction rather
          than on a functional assay, which is a real limit on that family's molecular evidence.
        genes:
        - preferred_term: MRPS7
          term:
            id: hgnc:14499
            label: MRPS7
        genetic_context:
          genes:
          - preferred_term: MRPS7
            term:
              id: hgnc:14499
              label: MRPS7
          allele_type: a homozygous conserved-residue missense variant in one family, and a nonsense variant
            in trans with a missense variant in the other
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Zygosity differs between the two families - homozygous in the 2015 siblings, compound
            heterozygous in the 2022 patient - so no single zygosity value describes the entity and the
            slot is left unset rather than asserting one family's configuration for both.
          notes: LOSS_OF_FUNCTION rests on the 2015 family alone, where wild-type MRPS7 complementation
            restored respiratory-chain activity and 12S rRNA levels in patient fibroblasts. The 2022 alleles
            were not functionally tested; a nonsense allele at codon 125 of a 242-residue protein is a
            plausible null, but that is an inference and no protein or transcript measurement was reported
            for it.
      selected_evidence:
        snippet: Whole-exome sequencing revealed a homozygous mutation in the gene encoding mitochondrial
          ribosomal protein S7 (MRPS7), a c.550A>G transition that encodes a substitution of valine for
          a highly conserved methionine (p.Met184Val) in both affected siblings.
        supports: SUPPORT
