            name: Lentiviral wild-type MRPS7 complementation of patient fibroblasts
            experimental_model_type: PRIMARY_CELL_CULTURE
            description: 'Patient fibroblasts from the 2015 family were complemented with wild-type MRPS7.
              Two independent readouts recovered: complex I and complex IV enzyme activities, and 12S
              rRNA transcript level. This is the only functional experiment in the entity, and it does
              two things at once - it establishes causation, and it orders the molecular events, since
              the rRNA deficit is corrected by supplying the protein.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Combined Deficiency of Respiratory Chain Complexes I, III and IV
        relationship: RESCUES
        fidelity: HIGH
        description: Supplying wild-type MRPS7 to the patients' own cells restores respiratory-chain activity,
          which demonstrates that the MRPS7 variant rather than something else in that genome causes the
          combined deficiency.
        limitations: A cultured fibroblast, so it says nothing about liver, kidney, cochlea or ovary -
          the four tissues that carry the clinical phenotype. The rescue is reported for complexes I and
          IV; complex III, although deficient, is not named among the rescued activities, and the source
          does not say whether it was assayed. Only the 2015 family was tested; the 2022 alleles have
          no functional data at all. Lentiviral overexpression is non-physiological in level and timing.
        readouts:
        - name: Complex I and complex IV enzyme activities after wild-type MRPS7 expression
          target: Combined Deficiency of Respiratory Chain Complexes I, III and IV
          direction: RESTORED
          interpretation: Both activities recover in complemented patient fibroblasts. The magnitude of
            recovery is not given in the source available here.
      selected_evidence:
        snippet: Exogenous expression of wild-type MRPS7 in patient fibroblasts rescued complexes I and
          IV activities, demonstrating the deleterious effect of the mutation on RC function.
        supports: SUPPORT
