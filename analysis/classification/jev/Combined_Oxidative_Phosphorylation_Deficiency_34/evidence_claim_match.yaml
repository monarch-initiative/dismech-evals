        target: Reduced 12S rRNA and Impaired Small Subunit Assembly
        relationship: RESCUES
        fidelity: HIGH
        description: The same complementation restores 12S rRNA to normal levels, which is what establishes
          the direction of the relationship between the protein defect and the rRNA loss.
        limitations: Transcript level is a proxy for subunit assembly rather than a measurement of it;
          no sucrose-gradient, blue-native or complexome profile of the mitoribosome in patient cells
          is reported, so the assembly claim in the node this links to is inferred from rRNA abundance
          and translation output rather than observed directly.
        readouts:
        - name: 12S rRNA transcript level after wild-type MRPS7 expression
          target: Reduced 12S rRNA and Impaired Small Subunit Assembly
          direction: RESTORED
          interpretation: 12S rRNA returns to normal levels when wild-type MRPS7 is supplied, placing
            the rRNA deficit downstream of the protein defect.
      selected_evidence:
        snippet: Moreover, reduced 12S rRNA transcript levels observed in the patient's fibroblasts were
          also restored to normal levels by exogenous expression of wild-type MRPS7.
