            description: 'Patient fibroblasts from the 2015 family were complemented with wild-type MRPS7.
              Two independent readouts recovered: complex I and complex IV enzyme activities, and 12S
              rRNA transcript level. This is the only functional experiment in the entity, and it does
              two things at once - it establishes causation, and it orders the molecular events, since
              the rRNA deficit is corrected by supplying the protein.'
          role: ancestor
