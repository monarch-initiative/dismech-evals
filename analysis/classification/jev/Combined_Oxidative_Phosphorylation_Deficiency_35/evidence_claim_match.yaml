  e130bdd49f35354c773be124a5b1c7649cec08e7f3d986e217ac9c175849efd4:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 35
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 35
            term:
              id: MONDO:0054742
              label: combined oxidative phosphorylation deficiency 35
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic TRIT1 Variants
        biological_scale: MOLECULAR
        description: Two damaged copies of TRIT1. The alleles are mostly private. They include homozygous
          missense variants (p.Arg323Gln in the founding family, p.Met82Ile), compound heterozygous missense,
          splice and nonsense combinations (p.Glu327Lys with c.682+2T>C; p.Ile109Thr with p.Arg327*; p.Arg323Trp
          with p.Glu295Glyfs*8), and a homozygous splice-acceptor variant (c.1235-3C>G). p.Arg323Gln does
          not lower TRIT1 protein levels. It replaces one of a row of basic residues that contact the
          anticodon stem of the substrate tRNA. Structural modelling put it at substrate binding rather
          than catalysis. The missense alleles are therefore hypomorphic rather than null.
        genes:
        - preferred_term: TRIT1
          term:
            id: hgnc:20286
            label: TRIT1
        genetic_context:
          genes:
          - preferred_term: TRIT1
            term:
              id: hgnc:20286
              label: TRIT1
          allele_type: missense, splice-site and truncating variants, homozygous or compound heterozygous
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Zygosity differs between families, so the slot is left unset rather than asserting
            one family's configuration for all.
          notes: LOSS_OF_FUNCTION rests on the founding p.Arg323Gln family. In those cells i6A37 was lost
            from both tRNA pools and wild-type TRIT1 restored it. Most later alleles were called pathogenic
            from segregation and in-silico prediction. Two later patients showed reduced TRIT1 isoform
            1 protein on immunoblot, and one showed reduced i6A and ms2i6A in blood and urine.
      selected_evidence:
        snippet: Using next-generation exome sequencing, we identified in a patient with severe combined
          mitochondrial respiratory chain defects and corresponding perturbation in mitochondrial protein
          synthesis, a homozygous p.Arg323Gln mutation in TRIT1.
        supports: SUPPORT
    origin:
