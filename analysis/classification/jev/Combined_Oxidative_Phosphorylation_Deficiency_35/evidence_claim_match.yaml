            name: Schizosaccharomyces pombe tit1-deletion strain complemented with human TRIT1
            experimental_model_type: OTHER
            description: Fission yeast lacking the TRIT1 homologue grow slowly on glycerol, a respiratory
              defect. Human wild-type TRIT1 complemented an i6A37-dependent tRNA suppression assay in
              this strain, and the p.Arg323Gln mutant did not. Later work in the same strain traced the
              respiratory growth defect to cytosolic tRNA-Tyr, not mitochondrial tRNA. In yeast, then,
              i6A37 loss produces a mitochondria-like phenotype through the cytosol.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Reduced tRNA Isopentenyltransferase Activity
        relationship: PARTIALLY_RECAPITULATES
        fidelity: MODERATE
        description: Shows that the human enzyme works in a heterologous host and that the patient allele
          loses activity in vivo.
        limitations: Yeast lacks the ms2i6A37 hypermodification found on mammalian mitochondrial tRNAs.
          Its i6A37 substrate set differs from the human one. Its respiratory phenotype arises through
          cytosolic tRNA-Tyr rather than through mitochondrial translation, the opposite of what the human
          patient cells suggest.
