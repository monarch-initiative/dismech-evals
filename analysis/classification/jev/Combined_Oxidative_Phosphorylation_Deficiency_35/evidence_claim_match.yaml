            label: TRIT1
        notes: TRIT1 (chromosome 1p34.2) encodes tRNA isopentenyltransferase. MONDO records it as the
          causal gene for MONDO:0054742. The relationship rests on the founding family's complementation
          result and on recurrence of biallelic variants with the same neurological phenotype in more
          than ten unrelated families. TRIT1 also has a cancer literature, originally as a candidate lung-cancer
          tumour suppressor and later in prognostic signatures. That literature does not concern this
          disease.
