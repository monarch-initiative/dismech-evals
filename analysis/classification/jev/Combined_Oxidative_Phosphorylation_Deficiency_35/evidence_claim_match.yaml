        context: []
      assertion_type: Pathophysiology
      assertion:
        name: i6A37 Hypomodification of Mitochondrial tRNAs
        biological_scale: MOLECULAR
        description: Patient fibroblasts were severely deficient in i6A37 on mitochondrial tRNAs, measured
          on mt-tRNA-Ser(UCN). Wild-type TRIT1 corrected this. The unmodified mt-tRNA-Ser(UCN) was also
          less stable, with steady-state levels about 40 percent lower. The defect is therefore both less
          active tRNA and less tRNA. In mammalian mitochondria the i6A37 product is further methylthiolated
          to ms2i6A37, and both were sharply reduced in blood and urine RNA of a later patient. This gives
          a non-invasive readout of the same lesion.
        biological_processes:
        - preferred_term: mitochondrial tRNA i6A37 modification
          modifier: DECREASED
          term:
            id: GO:0070900
            label: mitochondrial tRNA modification
      selected_evidence:
        snippet: We show that patient cells bearing the p.Arg323Gln TRIT1 mutation are severely deficient
          in i6A37 in both cytosolic and mitochondrial tRNAs.
        supports: SUPPORT
