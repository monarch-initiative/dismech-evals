          in the product. Recombinant p.Arg323Gln TRIT1 had lower activity towards several tRNA substrates
          in vitro. The reduction is substrate-dependent rather than a loss of catalysis. Heavy overexpression
          of the mutant enzyme restored modification of the cytosolic substrate tested almost fully, but
          restored the mitochondrial substrate poorly.
        genes:
        - preferred_term: TRIT1
