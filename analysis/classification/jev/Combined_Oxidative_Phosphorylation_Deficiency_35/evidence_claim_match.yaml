        biological_scale: MOLECULAR
        description: The same patient cells lack i6A37 on cytosolic tRNAs, shown for cytosolic tRNA-Ser(UGA).
          Here, unlike the mitochondrial case, steady-state tRNA levels were not reduced. Whether this
          half of the lesion contributes to disease is unknown. In fission yeast, loss of the homologous
          enzyme causes a mitochondria-like respiratory growth defect that is due to cytosolic tRNA-Tyr,
          not to mitochondrial tRNA. TRIT1 also isopentenylates the selenocysteine tRNA. Patient fibroblasts
          did not show a general fall in selenoproteins, but neuron-specific Trit1 knockout mice showed
          a reduction in one brain selenoprotein. No causal edge is drawn from this node. The knowledge-gap
          discussion records why.
        biological_processes:
        - preferred_term: cytosolic tRNA i6A37 modification
          modifier: DECREASED
          term:
            id: GO:0006400
            label: tRNA modification
      selected_evidence:
        snippet: We show that patient cells bearing the p.Arg323Gln TRIT1 mutation are severely deficient
          in i6A37 in both cytosolic and mitochondrial tRNAs.
        supports: SUPPORT
