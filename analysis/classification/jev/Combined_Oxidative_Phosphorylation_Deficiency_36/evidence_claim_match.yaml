          term:
            id: HP:0007392
            label: Excessive wrinkled skin
        notes: 1 of 4 published patients; the second 2018 patient is explicitly recorded as having no
          skin involvement, the 2022 patient's physical examination is reported as revealing no abnormal
          findings, and the 2024 abstract does not mention skin. So this is a variable feature with high
          diagnostic value when present and no negative predictive value when absent — which is worth
          stating because the founding paper's framing could be read as making it a requirement.
      selected_evidence:
        snippet: Skin wrinkling, most pronounced on the abdomen and hands, was apparent from birth.
