      assertion:
        phase: Infantile presentation
        notes: 'The first patient presented from birth with wrinkled skin and minor dysmorphism, then
          failure to thrive in the first year and psychomotor delay. The second presented later — recurrent
          hypoglycaemia from eighteen months, walking at twenty-two months — and was not investigated
          for hypoglycaemia until six years. The 2022 patient is the clearest case of the same delay:
          hearing loss at four, gallstones at four and nine months, two years of vomiting, and a genetic
          test only at six and a half, ordered because the cause of the hypoglycaemia was unknown. That
          gap between first symptom and investigation is the diagnostic delay this entity''s stub was
          nominated for.'
      selected_evidence:
        snippet: Subject 2, a boy, presented with fasting hypoglycemia at the age of 6 years.
        supports: SUPPORT
