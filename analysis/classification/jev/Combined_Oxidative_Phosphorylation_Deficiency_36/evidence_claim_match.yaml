      assertion_type: Discussion
      assertion:
        discussion_id: copd36_late_assembly_severity
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Does the position of a mitoribosomal protein in the assembly pathway predict how severe
          the resulting disease is?
        rationale: 'The founding authors propose that variants in subunits that join late produce milder
          disease than variants in subunits that join early, and offer MRPS2 as their case: the roughly
          300 kDa early subassembly containing MRPS22 and MRPS16 is still present in patient cells, and
          these patients were alive at eleven where about a third of the mitoribosomal-disease series
          died before one year.

          Recorded as an open question rather than as mechanism because it is a hypothesis about the whole
          mitoribosomal group, testable across it, and the authors state plainly that the order of steps
          in mitoribosomal assembly is not known. A single mild entity is consistent with the hypothesis
          and does not establish it; the comparison that would is an assembly-order ranking against outcome
          across all the MRPS and MRPL disorders, which nobody has published.'
        attaches_to:
        - pathophysiology#Failure of Mitoribosomal Small Subunit Assembly
      selected_evidence:
        snippet: Despite recent advances in elucidating the structure of the mammalian mitoribosome,3
          the order of steps in the assembly process of the mitochondrial ribosome remains elusive.
        supports: SUPPORT
        directness: INDIRECT
