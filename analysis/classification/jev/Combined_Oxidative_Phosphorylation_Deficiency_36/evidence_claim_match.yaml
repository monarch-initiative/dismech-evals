        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Combined Deficiency of OXPHOS Complexes I and IV
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: 'In fibroblasts, complexes I and IV are reduced, complex III and the nucleus-encoded
          complex II are not, and complex V is present at normal amount but with subcomplexes that do
          not occur in control cells. In tissue the picture is broader: multiple complexes are deficient
          in liver and muscle in the first patient, and in liver and fibroblasts with an isolated complex
          IV deficiency in muscle in the second.

          That discrepancy between fibroblast and tissue, and between the two patients'' muscle, is worth
          stating rather than smoothing over. It means a normal muscle respiratory-chain panel does not
          exclude the diagnosis, and it is the reason the entity is named for a combined deficiency even
          though any single biopsy may show something narrower.

          This is the convergence point of the entry. Every systemic feature below is downstream of this
          node.'
        biological_processes:
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
        cell_types:
        - preferred_term: patient-derived skin fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Measurements of OXPHOS complex activities showed a decrease in multiple complexes in
          liver and fibroblasts and a complex IV deficiency in muscle.
        supports: SUPPORT
        directness: DIRECT
