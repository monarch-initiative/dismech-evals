          retarded while her motor development was normal, so the delay is not uniformly global across
          the series and this binding is the term that covers the 2018 patients rather than all four.
          Speech delay in every patient who has it was attributed by the reporting authors to the hearing
          loss and improved once that was corrected, which is why it is recorded under hearing loss rather
          than as a separate phenotype.'
