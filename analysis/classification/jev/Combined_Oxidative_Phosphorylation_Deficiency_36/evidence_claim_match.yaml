  6901f81e7244d2b949bab5073a290ef9b18c052696d56ab3bdd3419b2cb75411:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 36
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 36
            term:
              id: MONDO:0054781
              label: combined oxidative phosphorylation deficiency 36
        context: []
      assertion_type: Treatment
      assertion:
        name: Carbohydrate Administration for Acute Hypoglycaemia
        therapeutic_modality: SMALL_MOLECULE
        description: 'The 2022 patient''s hypoglycaemia and lactic acidosis both improved on sugary liquid
          with supportive treatment, and her appetite recovered as glucose normalised. It is the only
          treatment in this disease with a reported response, and the response includes the lactate —
          which is not obvious, since giving glucose to a patient who cannot oxidise pyruvate could reasonably
          be expected to raise it.

          It is also not a cure, and the entry does not present it as one: the same patient''s hypoglycaemia
          recurred and she was admitted repeatedly.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: glucose
            term:
              id: CHEBI:17234
              label: glucose
        notes: 'No published treatment trial, cohort or disease-specific guideline exists for MRPS2 disease.
          Management follows the symptom-based standards for primary mitochondrial disease generally —
          the Mitochondrial Medicine Society recommendations and their national adaptations — because
          there is nothing more specific to follow, and those standards are explicit that treatment guidance
          in this field is symptom-based rather than mechanism-based.

          This entry deliberately does not carry the generic mitochondrial cofactor cocktail: no source
          reports it being given to any MRPS2 patient or having any effect, and listing it would be importing
          a habit from the wider mitochondrial literature rather than curating this disease.'
      selected_evidence:
        snippet: Her condition improved after the administration of sugary liquid and supportive treatments.
          However, her hypoglycemia was recurring.
        supports: REFUTE
        directness: DIRECT
