          does not mention glucose. The 2022 patient''s presentation differs in a way worth noting: her
          hypoglycaemia came with two years of recurrent vomiting and poor appetite rather than with a
          documented fast, so the trigger there is reduced intake rather than fasting duration.'
      selected_evidence:
        snippet: Medical history was marked by several acute episodes of hypoglycemia after an overnight
