  112c6a21411d14ba47e12caa748b2d5847abe736b8f4b97da137a04d0c6392ad:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 36
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 36
            term:
              id: MONDO:0054781
              label: combined oxidative phosphorylation deficiency 36
        context:
        - path: /pathophysiology/0
          value:
            name: Biallelic MRPS2 Missense Variants
            biological_scale: MOLECULAR
            mechanism_confidence: ESTABLISHED
            description: 'Four missense alleles are known across three genotyped families. The Austrian
              patient is compound heterozygous for c.328C>T, p.Arg110Cys and c.340G>A, p.Asp114Asn; the
              Tunisian patient is homozygous for c.413G>A, p.Arg138His; the Chinese patient is homozygous
              for c.412C>G, p.Arg138Gly. The 2018 alleles change residues conserved across species, were
              predicted damaging by at least two of three in-silico tools, and appear in gnomAD only as
              very rare heterozygotes.

              The fourth allele is the interesting one. c.412C>G and c.413G>A are adjacent nucleotides
              of the same codon, so two unrelated families — one Tunisian, one Chinese — independently
              carry substitutions of the same arginine, to histidine in one and to glycine in the other.
              Two independent hits at one residue in a series of three genotyped families is a stronger
              statement about which part of the protein matters than any single allele makes, and it is
              a statement no in-silico predictor supplied.

              Two things are worth keeping separate here. That the alleles are rare and conserved is a
              prediction; that they are pathogenic is a measurement, made by the lentiviral complementation
              experiment recorded further down this chain. This entry treats the second as the basis for
              the LOSS_OF_FUNCTION call, not the first.

              The positions of the residues within the assembled subunit also differ between the families,
              and the founding authors use that difference to explain a quantitative difference in the
              biochemistry: Arg110 and Asp114 face the 12S rRNA and contact several other proteins, while
              Arg138 sits near the surface of the small subunit, and 12S rRNA loss was correspondingly
              deeper in the compound heterozygote.'
            genes:
            - preferred_term: MRPS2
              term:
                id: hgnc:14495
                label: MRPS2
            genetic_context:
              genes:
              - preferred_term: MRPS2
                term:
                  id: hgnc:14495
                  label: MRPS2
              allele_type: two missense variants in trans in one family, and a homozygous missense variant
                in the other
              variant_origin: GERMLINE
              functional_impact_category: LOSS_OF_FUNCTION
              description: Zygosity differs between the two founding families — compound heterozygous
                in one, homozygous in the other — so no single zygosity value describes the entity and
                the slot is left unset rather than asserting one family's configuration for both.
              notes: 'LOSS_OF_FUNCTION is supported by measurement rather than prediction: patient fibroblasts
                carry reduced steady-state MRPS2, and re-expressing wild-type MRPS2 restores mitochondrial
                translation and OXPHOS assembly in both patients'' cells. No allele is a nonsense or frameshift
                variant, so this is a hypomorphic loss rather than a demonstrated null, which is consistent
                with the comparatively mild course.'
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Destabilization of the MRPS2 Protein
        causal_link_type: DIRECT
        description: Each of the three missense substitutions reduces the steady-state amount of MRPS2
          protein in patient fibroblasts, so the primary consequence of the allele is loss of the protein
          rather than a protein present but inactive.
      selected_evidence:
        snippet: SDS-PAGE analysis of mitochondrial extracts (for methods, see Supplemental Data) from
          these fibroblasts showed decreased steady-state amounts of the protein MRPS2 in both S1 and
          S2 fibroblasts
        supports: SUPPORT
        directness: DIRECT
