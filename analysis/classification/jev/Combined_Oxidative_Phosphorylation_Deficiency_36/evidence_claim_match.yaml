      assertion_type: Pathophysiology
      assertion:
        name: Anaerobic Redirection of Pyruvate and Accumulation of Krebs-Cycle Intermediates
        biological_scale: ORGANISM
        mechanism_confidence: ESTABLISHED
        description: 'A respiratory chain that cannot reoxidise NADH leaves pyruvate to be reduced to
          lactate and leaves the Krebs cycle backed up behind its NAD-dependent dehydrogenases. In these
          patients that shows as raised blood lactate, raised serum alanine — the transamination product
          of the pyruvate that accumulates with it — and increased urinary excretion of 2-oxoglutarate,
          with a trace of succinate.

          2-oxoglutarate is the more informative of the two urinary findings, because its dehydrogenase
          is NAD-dependent and it is the intermediate the founding authors single out as part of the recognisable
          biochemical signature.'
        biological_processes:
        - preferred_term: tricarboxylic acid cycle
          term:
            id: GO:0006099
            label: tricarboxylic acid cycle
          modifier: DECREASED
        chemical_entities:
        - preferred_term: lactate
          term:
            id: CHEBI:24996
            label: lactate
          modifier: INCREASED
        - preferred_term: 2-oxoglutarate
          term:
            id: CHEBI:30915
            label: 2-oxoglutaric acid
          modifier: INCREASED
      selected_evidence:
        snippet: elevated serum alanine (up to 850 μmol/L; reference values = 99–350 μmol/L), and increased
          excretion of Krebs cycle intermediates
        supports: SUPPORT
        directness: DIRECT
