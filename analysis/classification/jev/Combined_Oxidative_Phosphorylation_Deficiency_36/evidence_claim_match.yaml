        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Fasting Metabolic Adaptation
        biological_scale: ORGANISM
        mechanism_confidence: PROVISIONAL
        description: 'Both 2018 patients become hypoglycaemic on fasting, and in the second patient a
          formal fasting test reproduced it with a simultaneous rise in lactate to 5 mmol/L and increased
          2-oxoglutarate excretion. The coupling of hypoglycaemia to hyperlactataemia within one provoked
          test is what identifies the defect as a failure of energy-dependent hepatic adaptation rather
          than, say, hyperinsulinism, where lactate would not rise.

          Graded PROVISIONAL rather than ESTABLISHED because no measurement of gluconeogenic flux or of
          hepatic ATP exists in any MRPS2 patient. What is established is the clinical coupling; the hepatocyte-level
          explanation is inferred from the liver OXPHOS deficiency measured in the same patients.'
        biological_processes:
        - preferred_term: gluconeogenesis
          term:
            id: GO:0006094
            label: gluconeogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: A clinical fasting test showed hypoglycemia with hyperlactatemia (5 mmol/L) and slightly
          increased excretion of 2-oxoglutarate
        supports: SUPPORT
        directness: DIRECT
