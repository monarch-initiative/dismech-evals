      reference: PMID:30283131
      reference_title: Pathogenic variants in glutamyl-tRNA(Gln) amidotransferase subunits cause a lethal
        mitochondrial cardiomyopathy disorder.
      evidence_source: IN_VITRO
      explanation: 'The central observation: a GATC variant depletes all three subunits, with the authors''
        own hedged explanation.'
