              label: combined oxidative phosphorylation deficiency 42
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic GATC Missense Variant
        biological_scale: MOLECULAR
        role: trigger
        mechanism_confidence: ESTABLISHED
        description: The initiating lesion is the homozygous GATC missense allele c.233T>G (p.Met78Arg),
          the only GATC variant reported in this disorder. That it is a missense rather than a null allele
          is not incidental. Complete loss of a tRNA-charging function is thought to be embryonically
          lethal, so a viable patient must retain some residual activity; every patient in the defining
          series carried at least one missense allele. The authors go further and propose that severity
          tracks the degree of conservation of the affected residue - the prenatal-onset GATB and QRSL1
          families had variants at highly conserved residues, while the infantile-onset GATC families
          had a variant at a moderately conserved one. On that reading the later onset of COXPD42 relative
          to its GatCAB siblings is a consequence of a milder residual activity, not of the subunit affected.
        genes:
        - preferred_term: GATC
          term:
            id: hgnc:25068
            label: GATC
        genetic_context:
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          description: 'Homozygous germline missense. Curated as PARTIAL_LOSS_OF_FUNCTION rather than
            LOSS_OF_FUNCTION because residual activity is not an inference from the phenotype alone: GatC
            protein is reduced to about 20 percent of control rather than abolished, and the reasoning
            that complete loss would be embryonically lethal is stated explicitly in the source.'
      selected_evidence:
        snippet: Due to their essential role in protein synthesis, residual enzyme activity characterizes
          disorders of tRNA synthetases, and complete loss-of-function is thought to be embryonically
          lethal
        supports: SUPPORT
    origin:
