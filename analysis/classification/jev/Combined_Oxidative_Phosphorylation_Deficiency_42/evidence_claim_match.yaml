        context: []
      assertion_type: Pathophysiology
      assertion:
        name: GatCAB Trimer Destabilization
        biological_scale: MOLECULAR
        role: central_effector
        mechanism_confidence: ESTABLISHED
        description: 'In the bacterial complex GatA carries the amidase function and GatB the kinase function,
          while GatC serves as a stabilizing linker between them. The patient data show that this architectural
          role is what fails. In GATC patient fibroblasts GatC protein falls to about 20 percent of control,
          and GatA and GatB fall by a comparable amount - even though neither of their genes is mutated.
          The likely explanation is that the individual subunits are unstable when not incorporated into
          the trimer.

          Crucially this is post-transcriptional: mRNA levels of QRSL1, GATB and GATC were unchanged in
          patient fibroblasts, so the loss of GatA and GatB is protein instability rather than a transcriptional
          response. A GATC lesion therefore behaves as a lesion of the whole amidotransferase, which is
          why a subunit with no catalytic activity of its own produces the same disease as the catalytic
          subunits.'
      selected_evidence:
        snippet: In subject P4B with mutations in GATC, the steady state level of GatC in fibroblasts
          was decreased to 20% of controls (Fig. 3e), and the GatA and GatB protein levels were equally
          substantially decreased (Fig. 3e), probably due to the instability of the individual subunits
          when they are not incorporated in the GatCAB trimer.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
