        name: Impaired Transamidation of Glu-mt-tRNA(Gln)
        biological_scale: MOLECULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        description: 'Mitochondria have no glutaminyl-tRNA synthetase. Glutaminyl mt-tRNA is therefore
          charged indirectly in two steps: EARS2 mischarges it with glutamate, and GatCAB transamidates
          the Glu-mt-tRNA(Gln) to Gln-mt-tRNA(Gln) using free glutamine as amide donor. The same paper
          closed the obvious escape route - cytoplasmic QARS had been reported in some databases as dual-localised,
          but QARS-GFP did not co-localise with TOM20, cellular fractionation showed no mitochondrial
          enrichment, and the trace that did fractionate with mitochondria was proteinase-K sensitive.
          Mitochondria depend exclusively on GatCAB.

          The defect is conditional on substrate supply, which is the single most important practical
          fact about this disorder. In standard glutamine-rich culture medium patient fibroblasts charge
          mt-tRNA(Gln) similarly to controls; only after three days without glutamine does charging fall.
          A normal-looking fibroblast assay run under standard conditions is therefore not evidence against
          the diagnosis.'
        molecular_functions:
        - preferred_term: glutaminyl-tRNA(Gln) formation by transamidation
          modifier: DECREASED
          term:
            id: GO:0050567
            label: glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
      selected_evidence:
        snippet: mt-tRNAGln is indirectly charged by a transamidation reaction involving the GatCAB aminoacyl-tRNA
          amidotransferase complex.
        supports: SUPPORT
