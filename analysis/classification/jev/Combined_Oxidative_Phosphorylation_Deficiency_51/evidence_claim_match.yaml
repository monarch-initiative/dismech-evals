      assertion:
        discussion_id: coxpd51_leigh_versus_leigh_like
        kind: CONTROVERSY
        status: OPEN
        prompt: Is PTCD3 deficiency a cause of Leigh syndrome, or of a Leigh-like syndrome that does not
          meet the diagnostic criteria?
        attaches_to:
        - pathophysiology#Subacute Necrotizing Degeneration of Basal Ganglia and Thalamus
        - disease#Combined Oxidative Phosphorylation Deficiency 51
        rationale: 'The founding 2019 report diagnosed its patient with Leigh syndrome. A letter in the
          same journal argued the imaging and clinical picture met criteria only for a Leigh-like syndrome.
          The 2023 series then titled itself "Leigh syndrome is the main clinical characteristic of PTCD3
          deficiency" and set out to settle the question in favour of Leigh syndrome; the 2024 report
          nonetheless describes its own severe patient as Leigh-like, and its two adult patients as neither.

          This entry does not adjudicate. It records the position of each report and keeps the pathophysiology
          node named for the lesion (necrotizing degeneration of basal ganglia and thalamus) rather than
          for either syndrome label, so that the mechanism does not inherit the dispute.

          This entry quotes the 2023 series'' summary of the challenge rather than the challenging Letter
          itself. The reason is recorded in the entry notes.'
      selected_evidence:
        snippet: Brain MRI showed abnormal bilateral signals at the basal ganglia and brainstem, and the
          patient was diagnosed as Leigh syndrome.
        supports: SUPPORT
