  813ebce12d506d9e863b2a27576661a05ca09e4ac44b9c84b1892d6ca93cb3f7:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 51
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 51
            term:
              id: MONDO:0033631
              label: combined oxidative phosphorylation deficiency 51
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing, with RNA-seq or minigene assay for splicing alleles
        description: 'The molecular diagnosis has been made by whole-exome and by whole-genome sequencing,
          but sequencing alone has repeatedly been insufficient in this gene. Two of the reported alleles
          were initially called variants of uncertain significance because they sit in exons and read
          as missense changes; both turned out to cause exon skipping. RNA-seq of patient fibroblasts
          prioritised PTCD3 in one family through an aberrant splicing signal, and minigene assays established
          causality for three alleles.

          The practical rule: an exonic PTCD3 variant of uncertain significance in a compatible phenotype
          warrants an RNA-level test before it is dismissed.'
      selected_evidence:
        snippet: In addition, RNA‐seq was also performed on P1 fibroblasts, which prioritized PTCD3 as
          a candidate disease gene, as an aberrant splicing was detected.
        supports: SUPPORT
