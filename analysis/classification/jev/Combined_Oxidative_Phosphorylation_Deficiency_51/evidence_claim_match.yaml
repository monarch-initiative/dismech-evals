      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hereditary optic neuropathy and hereditary ataxia
        description: The adult pole of COXPD51 was worked up for years as hereditary ataxia and hereditary
          optic neuropathy. Mitochondrial DNA sequencing, Friedreich ataxia repeat testing, an NGS ataxia
          panel, spinocerebellar ataxia repeat analysis and whole-exome sequencing were all negative in
          that family before whole-genome sequencing found PTCD3. This is the practical reason to keep
          PTCD3 in an adult ataxia-with-optic-atrophy differential.
        distinguishing_features:
        - A standard ataxia gene panel and exome will miss it; the reported adult family was diagnosed
          only on whole-genome sequencing.
        - The combination of optic atrophy, nystagmus, ataxia and a motor polyneuropathy with preserved
          cognition is the phenotype that should prompt mitochondrial testing.
      selected_evidence:
        snippet: The results of mtDNA sequencing, Friedreich ataxia repeat expansion analysis, NGS ataxia
          gene panel (case 1), nucleotide repeat expansion analysis for all known types of spinocerebellar
          ataxia (case 1) and whole exome sequencing (case 2) did not reveal the cause of the disease.
        supports: SUPPORT
