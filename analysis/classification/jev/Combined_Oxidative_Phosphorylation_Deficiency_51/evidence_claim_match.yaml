        name: Respiratory chain enzymology in fibroblasts, read for the pattern rather than the magnitude
        description: 'Fibroblast enzymology shows reduced complex I and complex IV with normal or above-range
          complex II. Two cautions from the reported patients: the deficit can be modest, and in one patient
          a decreased complex IV activity fell back inside the control range once normalised to citrate
          synthase - so a normalised-only report may read as normal. Muscle histochemistry showed COX-negative
          fibres in the same patient whose normalised fibroblast values were unremarkable.'
      selected_evidence:
        snippet: Mitochondrial respiratory chain analysis in fibroblasts revealed decreased activity of
          complex IV. However, when normalized to citrate synthetase, the values fall within the control
          range
        supports: SUPPORT
