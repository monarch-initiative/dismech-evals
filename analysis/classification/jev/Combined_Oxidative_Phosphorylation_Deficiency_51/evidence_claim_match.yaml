      assertion_type: AnimalModel
      assertion:
        name: Drosophila melanogaster PTCD3 loss-of-function mutant
        species: Drosophila melanogaster
        genotype: Loss-of-function mutant of CG4679, the Drosophila PTCD3 ortholog
        publication: PMID:38074476
        description: 'The only published whole-organism model of PTCD3 loss. The mutant dies during the
          second larval instar with reduced expression of mitochondrial-function and ribosome-biogenesis
          genes and, unexpectedly, up-regulated neuronal-development genes. It establishes that the gene
          is essential for development in an intact animal, which no patient genotype can show, but it
          cannot model the human disease: every reported human genotype retains some function, and the
          fly has no basal-ganglia or optic-nerve counterpart to the human lesions.'
        modeled_mechanisms:
        - target: Impaired Mitochondrial mRNA Translation
          relationship: PARTIALLY_RECAPITULATES
          fidelity: LOW
          model_scale: ORGANISM
          description: Transcriptional evidence of a coordinated loss of mitochondrial and ribosome-biogenesis
            gene expression on loss of the PTCD3 ortholog.
          limitations: A null allele in an invertebrate, lethal at the second instar, against a human
            disease in which every reported genotype retains residual protein. The readout is transcriptomic
            rather than a direct measurement of mitochondrial protein synthesis, and no respiratory-chain
            enzymology was reported, so the link to the human translation defect is inferential.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Drosophila has no optic nerve, basal ganglia or thalamus, so the two tissue-level
              nodes that define the human disease have no counterpart in this organism. The model can
              speak to the molecular and cellular nodes only.
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The model's measured quantity is the expression level of mitochondrial-function
              and ribosome-biogenesis genes. The node's quantity is the rate of mitochondrial protein
              synthesis. Reduced transcript abundance for ribosome components is a proxy for, not a measurement
              of, translation output.
          readouts:
          - name: Expression of mitochondrial-function and ribosome-biogenesis genes
            target: Impaired Mitochondrial mRNA Translation
            direction: DECREASED
            interpretation: Coordinated down-regulation of the mitochondrial translation apparatus on
              loss of the PTCD3 ortholog.
      selected_evidence:
        snippet: we focus on the Drosophila melanogaster homolog of PPR domain 3
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
