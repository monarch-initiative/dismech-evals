  044220b65d95fd9bb77b240c36c9602fe51823b2103a9d0d51096c4da848668d:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 51
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 51
            term:
              id: MONDO:0033631
              label: combined oxidative phosphorylation deficiency 51
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coxpd51_no_mammalian_model
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: The only published whole-organism PTCD3 model is a lethal Drosophila null. Does any available
          model reproduce the human disease, in which every reported genotype retains residual protein?
        attaches_to:
        - animal_models#Drosophila melanogaster PTCD3 loss-of-function mutant
        - pathophysiology#Depletion of PTCD3 Protein
        rationale: 'Evidence exists in a model system, and its translational validity is the open question
          - which is what separates this from the gaps above. The Drosophila null dies in the second instar
          and mouse loss of function is reported as causing neurodevelopmental defects and early lethality.
          Both are null phenotypes. No reported human patient is null: the severity range that defines
          this disorder lies entirely in the hypomorphic range, and neither organism has been studied
          at a hypomorphic dose.

          Neither organism has the tissues the disease targets, either - a fly has no optic nerve or basal
          ganglia, and no mouse study reporting optic atrophy or basal-ganglia lesions on partial PTCD3
          loss has been published. So the models establish that the gene is essential and say nothing
          about why partial loss produces this particular focal degeneration.

          What would resolve it is a hypomorphic mammalian allele - a knock-in of one of the human leaky
          splice alleles, or a graded conditional knockdown - assessed for optic nerve and basal-ganglia
          pathology rather than for lethality.'
      selected_evidence:
        snippet: Similarly, PTCD3 loss‐of‐function mice exhibit neurodevelopmental defects and early lethality.
        supports: SUPPORT
