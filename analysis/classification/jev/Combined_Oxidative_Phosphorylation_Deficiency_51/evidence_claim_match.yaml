      assertion_type: Diagnosis
      assertion:
        name: Functional complementation in patient fibroblasts
        description: Lentiviral re-expression of wild-type PTCD3 in immortalised patient fibroblasts restores
          OXPHOS subunit levels and respiratory capacity. It is not a routine clinical test, but it is
          the assay that has been used in both functionally characterised families to convert candidate
          variants into a diagnosis, and it is what a reference laboratory would be asked for when the
          genotype is ambiguous.
      selected_evidence:
        snippet: The expression of wild‐type PTCD3 cDNA using a lentiviral vector resulted in a complete
          recovery of the steady‐state levels of the altered OXPHOS subunits in both patients (Figure
          7A,B). Furthermore, the mitochondrial respiratory capacity, which was significantly reduced
          in naïve patient's cells, was recovered upon lentiviral transduction with wild‐type PTCD3 but
          not when cells were transduced with an empty plasmid (Figure 7C).
        supports: SUPPORT
