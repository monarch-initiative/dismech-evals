  f27eb651b66dd2ba4dae3d01366cf51ff2f6dd77d0e76ef814d31d7c8d306c41:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 51
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 51
            term:
              id: MONDO:0033631
              label: combined oxidative phosphorylation deficiency 51
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coxpd51_regional_selectivity_unexplained
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do the optic nerve and the basal ganglia and thalamus degenerate when the translation
          defect is present in every cell?
        attaches_to:
        - pathophysiology#Subacute Necrotizing Degeneration of Basal Ganglia and Thalamus
        - pathophysiology#Optic Nerve Degeneration
        rationale: 'PTCD3 is expressed in all tissues and the mitoribosome is required in all of them,
          yet the disease is focal: the optic nerve in essentially every patient, the basal ganglia and
          thalamus in the severe pole, the peripheral nerve in several, and almost nothing else. Cardiac,
          hepatic and renal involvement, which is common across the mitoribosomal protein disorders as
          a class, has been minimal in these patients.

          The only explanation offered is a general one - that retinal ganglion cells are especially vulnerable
          to defects in mitochondrial gene expression - and it is asserted rather than tested in PTCD3.
          It also does not address the basal-ganglia selectivity, which is shared with more than 75 unrelated
          Leigh-syndrome genes and is unexplained for all of them. The two selectivities may not have
          the same cause, and nothing in the PTCD3 literature distinguishes them.

          This is recorded as a gap rather than a controversy because no source argues the other side;
          the question has not been addressed.'
      selected_evidence:
        snippet: Defects in mitochondrial replication, RNA transcription and translation initiate early‐onset
          optic atrophy, as these cells are highly vulnerable to mitochondrial dysfunction.
        supports: SUPPORT
