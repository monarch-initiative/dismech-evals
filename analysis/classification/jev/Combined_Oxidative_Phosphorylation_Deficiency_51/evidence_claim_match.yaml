              label: combined oxidative phosphorylation deficiency 51
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Leigh syndrome of other genetic cause
        description: More than 75 genes, mitochondrial and nuclear, produce Leigh syndrome, and nothing
          in the clinical picture or the neuroimaging distinguishes PTCD3 from them. Optic atrophy, which
          is the most consistent PTCD3 feature, occurs in Leigh syndrome of other aetiologies too, and
          the reporting authors say explicitly that it is not useful for guiding the clinical diagnosis.
        distinguishing_features:
        - Not separable clinically or radiologically; the distinction is molecular.
        - A combined complex I and IV deficiency with spared complex II narrows the differential to the
          mitochondrial gene-expression disorders but does not identify the gene.
      selected_evidence:
        snippet: On the other hand, optic atrophy is a clinical sign that has been observed in patients
          with Leigh syndrome of other etiologies, and thus it is not useful in guiding the clinical diagnosis
        supports: SUPPORT
