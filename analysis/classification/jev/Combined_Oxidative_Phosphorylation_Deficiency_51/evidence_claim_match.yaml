  beae6ccb1cf5e9981133d3051219225819f0ba41e3aa8c6691f77442ce2cf389:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 51
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 51
            term:
              id: MONDO:0033631
              label: combined oxidative phosphorylation deficiency 51
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coxpd51_carrier_respirometry_confound
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: If an unaffected heterozygous carrier has the same reduced fibroblast basal respiration
          as her affected son, what does a reduced basal respiration rate actually establish in this disorder?
        attaches_to:
        - pathophysiology#Reduced Mitochondrial Respiratory Capacity and ATP Deficit
        - diagnosis#Functional complementation in patient fibroblasts
        rationale: 'In the 2024 report the mother of the adult proband - clinically unaffected, carrying
          one PTCD3 allele - had a basal respiration rate as low as her son''s, with no significant difference
          between them. The authors draw the conclusion themselves: a lower oxygen consumption rate is
          seen in both affected and unaffected carriers, and that reduction is not by itself sufficient
          to cause disease.

          The gap this leaves is a measurement gap. Basal respiration is being used as supporting functional
          evidence for variant classification in this gene, and in this family it did not discriminate
          patient from carrier. What has discriminated, in the two other functionally characterised families,
          is the complementation assay: subunit levels and maximal uncoupled capacity restored by wild-type
          PTCD3. Nobody has reported a maximal-capacity or complementation result on a heterozygous carrier,
          so it is not known whether those assays are any more discriminating.'
      selected_evidence:
        snippet: The similar results were observed in his unaffected mother, who is a carrier of the His269Tyr
          variant, concluding that both heterozygous unaffected and affected carriers exhibit a lower
          OCR.
        supports: SUPPORT
