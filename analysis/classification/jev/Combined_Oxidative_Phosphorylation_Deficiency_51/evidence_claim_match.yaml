        notes: Two distinct courses. The severe course is a progressive neurodegeneration with accumulating
          dystonia, epilepsy, dysphagia and respiratory failure, punctuated by intensive-care admissions.
          The mild course is a slowly progressive ataxia and optic neuropathy in which patients remain
          cognitively near-normal into their thirties but become blind and non-ambulatory. The disorder
          has no described plateau in either course.
      selected_evidence:
        snippet: Both are legally blind, retaining only light perception, experiencing mild cognitive
          decline and being non‐ambulatory.
        supports: SUPPORT
