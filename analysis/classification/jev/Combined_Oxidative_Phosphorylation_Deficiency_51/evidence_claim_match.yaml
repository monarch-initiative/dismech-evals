  8d623b1351eb5def42f05301c09961bae16bd5e981ff460c7068ba3fe4a918d8:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 51
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 51
            term:
              id: MONDO:0033631
              label: combined oxidative phosphorylation deficiency 51
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: coxpd51_residual_protein_hypothesis_untested
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the amount of residual PTCD3 protein explain why one genotype kills at 16 months
          and another allows independent survival into the fourth decade?
        attaches_to:
        - pathophysiology#Depletion of PTCD3 Protein
        - genetic#PTCD3
        rationale: 'The only proposed explanation for the disorder''s enormous severity range is quantitative:
          the index patient''s two truncating alleles leave PTCD3 nearly absent, while the leaky splice
          alleles of the later patients leave 15-30% of normal protein, and the 2024 authors extend the
          same reasoning to a missense allele. It is a plausible dose-response account and it is entirely
          uncontrolled - each level was measured in a different laboratory, in a different patient, with
          a different second allele, and nobody has plotted protein level against any severity measure.

          What is missing is a graded series. Titrating PTCD3 in one cell background and measuring mitoribosome
          assembly, translation and respiration at each level would test whether the relationship is even
          monotonic. Until that exists the entry treats the residual-protein account as a hypothesis and
          does not use it for prognosis.'
      selected_evidence:
        snippet: We hypothesise that PTCD3 missense pathogenic variants lead to a milder form of combined
          oxidative phosphorylation deficiency, probably due the higher level of residual PTCD3.
        supports: SUPPORT
