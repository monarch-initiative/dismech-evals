        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other mitochondrial ribosomal protein (MRP) disorders
        description: Thirteen genes encoding mitoribosomal proteins had been implicated in human disease
          by 2023. As a class they present neonatally or in infancy with lactic acidosis and combined
          OXPHOS deficiency, and with myopathy, cardiac, hepatic, renal or hearing involvement. PTCD3
          sits inside that class and shares its biochemistry; what distinguishes it clinically, on the
          evidence available, is the near-constant optic atrophy and nystagmus rather than the multiorgan
          pattern.
        distinguishing_features:
        - Shared biochemistry - lactic acidosis with combined OXPHOS deficiency - across the whole class,
          so enzymology does not separate them.
        - Cardiac, hepatic and renal involvement is common in the MRP class but has not been a feature
          of the reported PTCD3 patients, one of whom had only slight left ventricular hypertrophy.
      selected_evidence:
        snippet: Similar to previously reported individuals, this reported female proband presented with
          psychomotor retardation, sensorineural hearing loss, hypertrophic cardiomyopathy, failure to
          thrive, and lactic acidosis.
        supports: SUPPORT
        directness: INDIRECT
