      assertion:
        name: Combined Respiratory Chain Deficiency with Complex II Spared
        biological_scale: CELLULAR
        role: effector
        mechanism_confidence: ESTABLISHED
        conforms_to: mitochondrial_dysfunction#Bioenergetic Decline and Oxidative Stress
        description: 'The biochemical signature of the disorder, and the reason it is named a "combined"
          deficiency. Complex I and complex IV activities are reduced in fibroblasts across the reported
          patients; complex III is reduced in some. Complex V subunit levels were unchanged in the two
          patients in whom they were measured, and complex II - alone among the five complexes, built
          entirely from nuclear-encoded subunits - was not reduced and in fact ran slightly above the
          control range once normalised to citrate synthase.

          The spared complex II is not an incidental negative. It is the finding that points the differential
          at the translation apparatus rather than at an assembly factor or a structural subunit of one
          complex, and it is what a curator or clinician should look for in the enzymology report.'
        biological_processes:
        - preferred_term: oxidative phosphorylation
          term:
            id: GO:0006119
            label: oxidative phosphorylation
          modifier: DECREASED
      selected_evidence:
        snippet: Mitochondrial respiratory chain analysis in fibroblasts revealed decreased activity of
          complex I, complexes I + III and complex IV
        supports: SUPPORT
