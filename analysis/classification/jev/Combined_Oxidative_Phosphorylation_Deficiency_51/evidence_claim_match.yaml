  5288c8b90703059f81c64fc9b3a5b04f2f0927fc763610e4afe02a1b99c8316c:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 51
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 51
            term:
              id: MONDO:0033631
              label: combined oxidative phosphorylation deficiency 51
        context: []
      assertion_type: Genetic
      assertion:
        name: PTCD3
        gene_term:
          preferred_term: PTCD3
          term:
            id: hgnc:24717
            label: PTCD3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: 'PTCD3 (MRPS39, mS39) encodes a pentatricopeptide-repeat RNA-binding protein that
          forms the mRNA entry channel of the small mitoribosomal subunit. Its function was established
          a decade before any patient was reported: knockdown in human cells reduced mitochondrial protein
          synthesis, respiration, and complex III and IV activity without changing mitochondrial mRNA
          levels, which located it in translation rather than in RNA processing or stability.

          The striking feature of the reported allelic spectrum is how many of the pathogenic alleles
          act through splicing. Of the nine variants published across the three case reports, six alter
          mRNA processing - two canonical acceptor-site variants, one intronic +4 variant, and two exonic
          variants initially called variants of uncertain significance that turned out on minigene assay
          to cause exon skipping. That last pair matters practically: an exonic missense-looking change
          in PTCD3 cannot be assumed to act as a missense change.'
        variants:
        - name: PTCD3 c.415-2A>G
          description: Canonical splice acceptor variant, in trans with a frameshift allele in the index
            patient. Together the two alleles leave the protein nearly absent, which is the genotype the
            2023 series proposes as the explanation for that patient's exceptionally severe course.
          clinical_significance: PATHOGENIC
        - name: PTCD3 c.1453-1G>C
          description: Canonical acceptor-site variant abolishing the intron 18 splice site, causing exon
            19 skipping and a transcript degraded by nonsense-mediated decay. On minigene assay it had
            the strongest effect of the four variants tested.
          clinical_significance: PATHOGENIC
        - name: PTCD3 c.902C>T
          description: Initially classified as a variant of uncertain significance because it sits inside
            exon 12 and reads as a missense change. Minigene assay showed it causes skipping of the exon
            it sits in, producing a truncating transcript alongside a leaky pool of correctly spliced
            mRNA.
          clinical_significance: PATHOGENIC
        - name: PTCD3 c.538+4A>G
          description: Homozygous intronic variant in a consanguineous family, absent from gnomAD, shown
            by RT-PCR to cause skipping of the 124 bp exon 7. The only homozygous genotype reported to
            date.
          clinical_significance: PATHOGENIC
        - name: PTCD3 c.1182T>A (p.Tyr394Ter)
          description: Nonsense allele carried by the adult sibling pair, in trans with the p.His269Tyr
            missense allele. It removes the C-terminal half of the protein including much of the central
            fold, so the product cannot be incorporated into the mitoribosome; western blot showed it
            is not cleared by nonsense-mediated decay.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: This is the first report of an association of PTCD3 mutations with Leigh syndrome along
          with combined oxidative phosphorylation deficiencies caused by defects in the mitochondrial
          translation machinery.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
