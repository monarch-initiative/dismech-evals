              label: combined oxidative phosphorylation deficiency 52
        context: []
      assertion_type: Genetic
      assertion:
        name: NFS1 variants
        gene_term:
          preferred_term: NFS1
          term:
            id: hgnc:15910
            label: NFS1
        relationship_type: CAUSATIVE
        variants:
        - name: p.Arg72Gln
          description: The recurrent missense allele (c.215G>A), homozygous in all reported severe infantile
            cases and present on at least one allele in every published patient. It destabilizes NFS1,
            reducing its transcript and protein level. It has recurred in unrelated populations (Old Order
            Mennonite and Christian Arab) with no shared haplotype, so it behaves as a recurrent de novo
            hot-spot rather than a single founder allele.
        - name: p.Arg412His
          description: Reported in trans with p.Arg72Gln in a single compound-heterozygous young adult
            with a milder, survivable presentation.
        notes: No ClinGen gene-disease validity classification is recorded for NFS1 in this disorder,
          so no gene_disease_validity assertion is carried; the evidence rests on three independent reports
          with functional data and a recurrent destabilizing allele.
      selected_evidence:
        snippet: we identified c.215G>A, p.Arg72Gln in NFS1 as the likely causative mutation.
        supports: SUPPORT
