        name: Combined Deficiency of Fe-S-Dependent Respiratory Chain Complexes and Aconitase
        biological_scale: CELLULAR
        description: Respiratory-chain complexes I, II and III each require Fe-S clusters, so a shortfall
          in cluster supply reduces their activity together while the Fe-S-free complex IV is relatively
          spared - the biochemical pattern that names the disease. Patient muscle and liver show complex
          II and III deficiency (with variable complex I involvement), and both mitochondrial and cytosolic
          aconitase activities are reduced, reflecting the broader Fe-S enzyme dependence; lipoylation
          of pyruvate and 2-oxoglutarate dehydrogenase is only mildly affected.
        biological_processes:
