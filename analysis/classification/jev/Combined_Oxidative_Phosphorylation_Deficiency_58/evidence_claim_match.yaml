      assertion:
        name: Impaired Mitochondrial Transcription Elongation
        biological_scale: MOLECULAR
        description: With less TEFM activity, POLRMT terminates early. Promoter-distal mitochondrial mRNAs
          and tRNA precursors fall while promoter-proximal transcripts rise. Both mitochondrial rRNAs
          are reduced, the promoter-distal 16S rRNA much more than 12S. The same gradient is seen when
          TEFM is knocked down in cultured cells and in the heart of conditional Tefm knockout mice.
        biological_processes:
        - preferred_term: mitochondrial transcription
          modifier: DECREASED
          term:
            id: GO:0006390
            label: mitochondrial transcription
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: Skeletal muscle samples from P1 and 2 and fibroblast samples from P2, 3 and 6 showed
          a more severe decrease of promoter-distal mt-mRNA, consistent with the reduced levels of TEFM
          in patient samples
        supports: SUPPORT
