          tefm knockdown reduced embryonic movement, shrank presynaptic clusters and reduced the overlap
          of presynaptic and postsynaptic markers at the neuromuscular junction. TEFM is now listed among
          congenital myasthenic syndrome genes. One later patient with the same fatigable picture had
          a normal repetitive stimulation test.
        biological_processes:
        - preferred_term: cholinergic synaptic transmission
          modifier: DECREASED
