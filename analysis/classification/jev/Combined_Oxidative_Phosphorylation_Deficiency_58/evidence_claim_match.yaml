  13df8d8be5631e68903b1e4c8c7a5457d452e7cc37d950e0aecddc83e2f1da8f:
    claim:
      about:
        disease:
          name: Combined Oxidative Phosphorylation Deficiency 58
          disease_term:
            preferred_term: combined oxidative phosphorylation deficiency 58
            term:
              id: MONDO:0957537
              label: combined oxidative phosphorylation deficiency 58
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic TEFM Variants
        biological_scale: MOLECULAR
        description: Two damaged copies of TEFM. The founding alleles are four missense variants (p.Arg34Trp,
          p.Pro157Ala, p.Ile159Lys, p.Lys188Arg), an in-frame two-residue deletion (p.Glu162_Arg163del),
          a frameshift, and a splice variant that causes exon 2 skipping and a second frameshift (p.Glu11Glyfs*2).
          Most missense changes cluster in the linker subdomain. Recombinant mutant proteins stimulated
          POLRMT processivity less than wild type, and TEFM protein was reduced in patient fibroblasts
          carrying p.Pro157Ala or p.Ile159Lys. All tested alleles kept residual activity, and no homozygous
          loss-of-function variant is seen in gnomAD.
        genes:
        - preferred_term: TEFM
          term:
            id: hgnc:26223
            label: TEFM
        molecular_functions:
        - preferred_term: transcription elongation factor activity
          modifier: DECREASED
          term:
            id: GO:0003711
            label: transcription elongation factor activity
        genetic_context:
          genes:
          - preferred_term: TEFM
            term:
              id: hgnc:26223
              label: TEFM
          allele_type: missense, in-frame deletion, frameshift and splice variants, homozygous or compound
            heterozygous
          variant_origin: GERMLINE
          functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
          notes: PARTIAL_LOSS_OF_FUNCTION because the founding authors describe all tested alleles as
            hypomorphic with relatively high residual activity, and Tefm knockout is embryonic lethal
            in mice. The pathogenicity of the p.Arg34Trp and p.Lys188Arg pair in one family remains less
            certain; both have relatively high gnomAD frequencies.
      selected_evidence:
        snippet: In the present work, we report the identification of seven TEFM variants (four missense,
          two frameshift and one in-frame 2-amino acid deletion) in seven individuals from five unrelated
          families who present with mitochondrial respiratory chain deficiency
        supports: SUPPORT
