      assertion_type: Discussion
      assertion:
        discussion_id: coxpd58_nmj_energetic_or_direct
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Neuromuscular Transmission Defect
        prompt: Is the neuromuscular transmission defect in TEFM disease a consequence of the respiratory
          chain deficiency, or does TEFM have a separate role at the synapse?
        rationale: The founding authors propose both explanations. The junction has a high density of
          mitochondria and a high energy demand, which favours the energetic one. But the myasthenic picture
          is prominent in TEFM disease and in SLC25A1 disease, and reviews have proposed a mitochondrial
          subtype of congenital myasthenic syndrome on that basis. Only some TEFM alleles appear to produce
          it, and one patient with the same fatigable picture had a normal repetitive stimulation study.
          The pathograph draws the edge from the respiratory chain node as the more likely route.
      selected_evidence:
        snippet: Recently, two mitochondrial genes-SLC25A1 and TEFM-have been reported in patients with
          suspected CMS, prompting a discussion about the role of mitochondria at the neuromuscular junction
          (NMJ).
        supports: SUPPORT
