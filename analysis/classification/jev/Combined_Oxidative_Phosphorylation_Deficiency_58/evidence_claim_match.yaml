        variant_origin: GERMLINE
        gene_term:
          preferred_term: TEFM
          term:
            id: hgnc:26223
            label: TEFM
        notes: TEFM (chromosome 17q11.2) encodes the mitochondrial transcription elongation factor. MONDO
          records it as the causal gene for MONDO:0957537. No ClinGen gene-disease validity classification
          exists for the pair, so gene_disease_validity is left unset. The founding authors call TEFM
          a candidate disease gene; causality rests on biallelic variants in five families with transcript,
          respiratory-chain and recombinant-protein evidence, a zebrafish model, and an eighth patient
          carrying a recurrent allele. TEFM also has a cancer-expression literature (hepatocellular carcinoma,
          glioma) that does not concern this disease.
      selected_evidence:
        snippet: Our in vivo and in vitro functional studies establish TEFM as a candidate disease gene
          that should be considered in the genetic diagnostic workup of patients that present with neonatal
          or childhood onset mitochondrial encephalomyopathy, fatigable muscle weakness, epilepsy and
          variable degree of intellectual disability.
        supports: SUPPORT
