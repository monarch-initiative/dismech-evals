            preferred_term: combined oxidative phosphorylation deficiency 60
            term:
              id: MONDO:0978298
              label: combined oxidative phosphorylation deficiency 60
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic Hypomorphic MRPL49 Variants
        biological_scale: MOLECULAR
        description: 'The three missense alleles (p.Arg88Cys, p.Arg88His and p.His92Pro) alter conserved
          residues in a beta-hairpin loop of mL49 that forms part of its interface with the 16S rRNA in
          the large mitoribosomal subunit. The only other allele, a frameshift, occurred in trans to p.Arg88Cys.
          No homozygous loss-of-function allele has been observed, and the authors interpret the missense
          variants as hypomorphic: mL49 itself was reduced in patient fibroblasts, and complete loss is
          predicted to be lethal by analogy with other mitoribosomal large-subunit knockouts. The loop-to-rRNA
          interface is a structural model; no mL49 variant has been shown experimentally to break rRNA
          contact.'
        genes:
        - preferred_term: MRPL49
          term:
            id: hgnc:1176
            label: MRPL49
        molecular_functions:
        - preferred_term: structural constituent of the mitoribosomal large subunit
          term:
            id: GO:0003735
            label: structural constituent of ribosome
          modifier: DECREASED
        cellular_components:
        - preferred_term: mitochondrial large ribosomal subunit
          term:
            id: GO:0005762
            label: mitochondrial large ribosomal subunit
      selected_evidence:
        snippet: Structurally, residues Arg88 and His92 are situated at a beta-hairpin loop of the MRPL49
          protein, which forms part of the protein interface with 16S rRNA
        supports: SUPPORT
