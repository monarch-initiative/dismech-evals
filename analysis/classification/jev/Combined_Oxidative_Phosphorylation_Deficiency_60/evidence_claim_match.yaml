      assertion_type: Genetic
      assertion:
        name: MRPL49
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: MRPL49
          term:
            id: hgnc:1176
            label: MRPL49
        notes: MRPL49 (chromosome 11q13, previous symbol C11orf4, alias NOF) encodes mL49 of the large
          mitoribosomal subunit, which has a yeast homologue (Img2) but no bacterial counterpart. MONDO
          records it as the causal gene for MONDO:0978298. No ClinGen gene-disease validity record exists
          for the pair, so gene_disease_validity is left unset. Causality rests on one multicentre report
          of nine families with three missense alleles and one frameshift, a shared founder haplotype
          in the two p.His92Pro families, and fibroblast rRNA, complexome and OXPHOS data from two individuals.
          A Turkish woman earlier attributed to homozygous PANX1 variants was also homozygous for MRPL49
          p.Arg88Cys, and the authors reassign her diagnosis to MRPL49. No mouse or other animal model
          of MRPL49 loss exists.
      selected_evidence:
        snippet: The different bi-allelic variants in MRPL49 in multiple unrelated families with similar
          clinical features meet the evidence criteria for a rare disease-gene association.
        supports: SUPPORT
