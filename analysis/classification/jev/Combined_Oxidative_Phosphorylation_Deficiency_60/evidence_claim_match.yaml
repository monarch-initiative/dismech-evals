        prompt: Is mitochondrial translation actually reduced in MRPL49 patient cells, and is the defect
          present in affected tissue rather than only fibroblasts?
        rationale: The founding study measured 16S rRNA, mitoribosome content and OXPHOS complexes in
          two fibroblast lines but did not measure de novo mitochondrial protein synthesis, study muscle
          or another affected tissue, or rescue the defect with wild-type MRPL49. No animal model exists.
          The translation node is therefore inferred from the data on either side of it.
      selected_evidence:
        snippet: To date, no mrpl49 knockout mouse models have been reported.
