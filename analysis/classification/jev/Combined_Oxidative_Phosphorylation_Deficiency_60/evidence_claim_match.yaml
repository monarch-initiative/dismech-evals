      assertion:
        name: Mitochondrial Energy Failure in High-Demand Tissues
        conforms_to: mitochondrial_translation_deficiency#Tissue-Selective Energy Failure
        biological_scale: TISSUE
        description: 'The tissues affected (cochlea, ovary, cerebral white matter and globus pallidus,
          retina, kidney) are energy-dependent tissues commonly hit in mitochondrial translation disorders.
          Why a given patient has some of these and not others is unexplained: the two families homozygous
          for p.His92Pro share a founder haplotype, yet one has Perrault syndrome and the other neither
          hearing loss nor ovarian failure. The authors propose an unidentified genetic modifier. MRPL49
          protein was detected in mitochondria of mouse cochlear hair cells and supporting cells, which
          fits but does not explain the hearing phenotype.'
      selected_evidence:
        snippet: We infer an undefined genetic modifier underpinning these phenotypic differences.
        supports: SUPPORT
