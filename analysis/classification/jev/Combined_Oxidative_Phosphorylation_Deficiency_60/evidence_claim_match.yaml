        attaches_to:
        - pathophysiology#Mitochondrial Energy Failure in High-Demand Tissues
        - phenotypes#Sensorineural hearing impairment
        - phenotypes#Premature ovarian insufficiency
        prompt: Why do individuals homozygous for the same founder MRPL49 allele differ in whether they
          have hearing loss and ovarian failure?
        rationale: The two Pakistani families homozygous for p.His92Pro share a founder haplotype, yet
          the index sisters have Perrault syndrome while the affected woman in the second family has normal
          hearing and menstruation. The authors propose an undefined genetic modifier. The answer decides
          whether MRPL49 should be tested in isolated Perrault syndrome alone or also in leukoencephalopathy
          without hearing loss.
      selected_evidence:
        snippet: The two families with homozygous His92Pro variants have intrafamilial phenotypic concordance
          but striking interfamilial differences.
        supports: SUPPORT
