              label: combined oxidative phosphorylation deficiency 60
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Perrault syndrome due to other genes
        disease_term:
          preferred_term: Perrault syndrome
          term:
            id: MONDO:0017312
            label: Perrault syndrome
        description: Two of the nine MRPL49 families (the index British Pakistani sisters and the Turkish
          girl in family 5) have the Perrault phenotype, and a 2026 review lists MRPL49 among fifteen
          Perrault genes. The dismech Perrault syndrome entry deliberately does not curate MRPL49 as a
          Perrault gene, because the evidence is a single report in which most individuals do not have
          the full Perrault phenotype. This entry records MRPL49 disease as its own COXPD, of which Perrault
          syndrome is the mild presentation, rather than as a Perrault subtype.
        distinguishing_features:
        - Progressive leukodystrophy with symmetrical globus pallidus T2 signal was present in every imaged
          MRPL49 individual, whereas white matter change varies by gene in other Perrault syndrome (common
          with CLPP, absent with HARS2).
        - Learning disability and microcephaly are frequent in MRPL49 disease.
        - Some MRPL49 individuals have neither hearing loss nor ovarian failure.
        - The distinction is molecular.
      selected_evidence:
        snippet: This consistency contrasts with other genes associated with Perrault syndrome where brain
          white matter changes are variable in frequency, from commonly present in individuals with CLPP-associated
          Perrault syndrome to absent with HARS2-associated disease.
        supports: SUPPORT
