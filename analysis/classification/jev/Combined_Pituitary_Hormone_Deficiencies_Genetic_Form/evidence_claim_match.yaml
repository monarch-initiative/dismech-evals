  590f3ff6a676840fe81d549850f8e872098c8ac75ed1f5f0caa47c372f14ff6e:
    claim:
      about:
        disease:
          name: Combined Pituitary Hormone Deficiencies, Genetic Form
          disease_term:
            preferred_term: non-acquired combined pituitary hormone deficiency
            term:
              id: MONDO:0018762
              label: non-acquired combined pituitary hormone deficiency
        context: []
      assertion_type: Subtype
      assertion:
        name: CPHD4
        display_name: CPHD4 (LHX4-related, with sella turcica and hindbrain defects)
        description: The dominant LHX4 form. Heterozygous LHX4 variants cause combined pituitary hormone
          deficiency with a skull-base and hindbrain signature - a small or poorly developed sella turcica,
          an ectopic posterior pituitary lobe, and cerebellar defects. The founding kindred segregated
          the splice variant in a fully penetrant dominant pattern over three generations, but in the
          largest screened cohort most variants showed incomplete penetrance and variable expressivity,
          and a de novo case has been reported, so full penetrance should not be generalized from the
          original family.
        subtype_term:
          preferred_term: short stature-pituitary and cerebellar defects-small sella turcica syndrome
          term:
            id: MONDO:0009880
            label: short stature-pituitary and cerebellar defects-small sella turcica syndrome
        genes:
        - preferred_term: LHX4
          term:
            id: hgnc:21734
            label: LHX4
        inheritance:
        - name: Autosomal dominant inheritance
          inheritance_term:
            preferred_term: autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          penetrance: INCOMPLETE
      selected_evidence:
        snippet: LHX4 mutations were found to be associated with variable expressivity, and most of them
          with incomplete penetrance; their contribution to pituitary deficits that are associated with
          an ectopic posterior pituitary and/or a sella turcica defect is ∼1.4% in the 417 probands tested.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:27820671
      reference_title: Contribution of LHX4 Mutations to Pituitary Deficits in a Cohort of 417 Unrelated
        Patients.
      evidence_source: HUMAN_CLINICAL
      explanation: The largest reported LHX4 screening cohort, establishing variable expressivity and
        incomplete penetrance for most variants. This is why the entry does not carry the full-penetrance
        claim MONDO's Orphanet-derived definition makes from the original kindred.
