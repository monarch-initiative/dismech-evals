            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: CPHD-type 3 (CPHD3; MIM# 221750) is caused by recessive mutations in LHX3, a LIM-homeodomain
          transcription factor gene.
        supports: SUPPORT
