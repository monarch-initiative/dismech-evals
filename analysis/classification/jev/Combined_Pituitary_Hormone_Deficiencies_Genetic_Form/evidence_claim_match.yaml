                label: LHX4
          role: subtype
      assertion_type: Phenotype
      assertion:
        category: Imaging
        name: Small Sella Turcica
        subtype: CPHD4
        description: An underdeveloped bony pituitary fossa is part of the LHX4 neuroradiological signature
          and is one of the two structural findings on which the largest reported LHX4 screening cohort
          selected its patients.
        phenotype_term:
          preferred_term: small sella turcica
          term:
            id: HP:0010538
            label: Small sella turcica
      selected_evidence:
        snippet: Brain magnetic resonance imaging (MRI) revealed pituitary hypoplasia, ectopic posterior
          pituitary gland, and small sella turcica in all probands.
        supports: SUPPORT
