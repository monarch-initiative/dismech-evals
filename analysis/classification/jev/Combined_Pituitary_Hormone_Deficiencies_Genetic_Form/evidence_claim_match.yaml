      assertion_type: Subtype
      assertion:
        name: CPHD3
        display_name: CPHD3 (LHX3-related, with cervical spine abnormalities and hearing loss)
        description: The recessive LHX3 form. Biallelic LHX3 loss of function produces deficiency of the
          anterior pituitary hormones other than ACTH together with an extrapituitary skeletal phenotype
          - a rigid cervical spine limiting head rotation - and, in series published after the founding
          report, sensorineural hearing loss. The extrapituitary features are what MONDO's label for the
          class is built on, and no LHX3 report reviewed here describes the sella turcica or hindbrain
          findings that characterize the LHX4 subtype.
        subtype_term:
          preferred_term: non-acquired combined pituitary hormone deficiency with spine abnormalities
          term:
            id: MONDO:0009091
            label: non-acquired combined pituitary hormone deficiency with spine abnormalities
        genes:
