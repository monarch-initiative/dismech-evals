              deficiency with a skull-base and hindbrain signature - a small or poorly developed sella
              turcica, an ectopic posterior pituitary lobe, and cerebellar defects. The founding kindred
              segregated the splice variant in a fully penetrant dominant pattern over three generations,
              but in the largest screened cohort most variants showed incomplete penetrance and variable
              expressivity, and a de novo case has been reported, so full penetrance should not be generalized
              from the original family.
            subtype_term:
              preferred_term: short stature-pituitary and cerebellar defects-small sella turcica syndrome
              term:
                id: MONDO:0009880
                label: short stature-pituitary and cerebellar defects-small sella turcica syndrome
            genes:
