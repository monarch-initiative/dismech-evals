      assertion:
        name: Prosaposin Deficiency and Loss of All Saposins
        conforms_to: lysosomal_substrate_accumulation#Lysosomal Hydrolase or Cofactor Deficiency
        description: Biallelic null PSAP variants abolish the prosaposin precursor, eliminating all four
          saposins (A-D). Each saposin is an essential cofactor for a distinct lysosomal sphingolipid
          hydrolase, so their combined loss simultaneously impairs multiple degradation pathways.
        gene:
          preferred_term: PSAP
          term:
            id: hgnc:9498
            label: PSAP
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
      selected_evidence:
        snippet: This gene encodes a protein, prosaposin, that cleaves into four constituent proteins,
          each of which has a role as a cofactor for the enzymes whose deficiency results in Krabbe disease,
          metachromatic leukodystrophy, Gaucher disease, and Farber disease, respectively.
        supports: SUPPORT
    origin:
