            term:
              id: MONDO:0015517
              label: common variable immunodeficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: BAFF/APRIL Receptor Signaling Deficiency
        biological_scale: MOLECULAR
        description: 'The TNF-family survival axis of the B-cell compartment, represented here by the
          two receptors BAFF-R (TNFRSF13C) and TACI (TNFRSF13B) and by the ligand TNFSF13, which MONDO
          names APRIL in the subtype term it defines. Loss of BAFF-R arrests B-cell development at the
          transitional stage; TACI variants were found in 4 of 19 unrelated CVID patients in the original
          report, in heterozygous form, and are modelled in this entry as risk alleles rather than determinants.
          TNFSF12 is deliberately not placed on this node: this entry has no source connecting it to either
          receptor, and grouping it here on family membership alone would assert a relationship it cannot
          support.'
        genes:
        - preferred_term: TNFRSF13C
          term:
            id: hgnc:17755
            label: TNFRSF13C
        - preferred_term: TNFRSF13B
          term:
            id: hgnc:18153
            label: TNFRSF13B
        - preferred_term: TNFSF13
          term:
            id: hgnc:11928
            label: TNFSF13
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: tumor necrosis factor-mediated signaling pathway
          modifier: DECREASED
          term:
            id: GO:0033209
            label: tumor necrosis factor-mediated signaling pathway
      selected_evidence:
        snippet: Without BAFF-R, B-cell development is arrested at the stage of transitional B cells and
          the numbers of all subsequent B-cell stages are severely reduced.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19666484
      reference_title: B-cell activating factor receptor deficiency is associated with an adult-onset
        antibody deficiency syndrome in humans.
      evidence_source: HUMAN_CLINICAL
      explanation: The developmental consequence of losing this signalling axis in humans, and the direct
        basis for the downstream edge below.
