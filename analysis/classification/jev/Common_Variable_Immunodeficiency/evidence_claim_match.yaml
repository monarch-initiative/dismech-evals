        snippet: Histological analysis shows that T and B cells are abundantly present in the granulomas
          that are less well organized and are frequently associated with lymphoid hyperplasia. Increased
          presence of activation markers such as soluble IL-2 receptor (sIL-2R) and IFN-ɣ, suggest increased
          Th1-cell activity. Moreover, B-cell abnormalities are prominent in CVID, with elevated IgM,
          BAFF, and CD21low B cells correlating with granulomatous disease progression.
        supports: SUPPORT
