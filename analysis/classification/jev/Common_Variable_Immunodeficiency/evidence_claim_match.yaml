        - path: /has_subtypes/13
          value:
            name: CVID15
            display_name: Common variable immunodeficiency 15 (SEC61A1)
            subtype_term:
              preferred_term: immunodeficiency, common variable, 15
              term:
                id: MONDO:0958013
                label: immunodeficiency, common variable, 15
            genes:
            - preferred_term: SEC61A1
              term:
                id: hgnc:18276
                label: SEC61A1
            description: 'The most narrowly defined subtype in this list: heterozygous SEC61A1 variants
              give an intrinsic failure of B cells to become plasma cells, with peripheral B- and T-cell
              subpopulations otherwise normal. MONDO files this term both under common variable immunodeficiency
              and under SEC61A1 deficiency, and carries no causal gene edge on the CVID child, so it too
              was absent from the gap list; ClinGen''s Moderate classification for the gene is likewise
              recorded against the SEC61A1-deficiency term rather than this one.'
          role: subtype
      assertion_type: Genetic
      assertion:
        name: SEC61A1 Deficiency
        association: Causative
        relationship_type: CAUSATIVE
        subtype: CVID15
        gene_term:
          preferred_term: SEC61A1
          term:
            id: hgnc:18276
            label: SEC61A1
        notes: ClinGen does curate this gene, but against MONDO:0100337 SEC61A1 deficiency rather than
          against the CVID15 term - searching the committed gene-validity download for "common variable,
          15" returns nothing while searching for SEC61A1 returns that row, classified Moderate. MONDO
          makes CVID15 a child of both concepts, so the two are describing the same gene-disease pair
          under different names. ClinGen also records that SEC61A1 patients have been diagnosed with entities
          well outside antibody deficiency, including autosomal dominant tubulointerstitial kidney disease
          and severe congenital neutropenia, so the CVID presentation is one arm of a broader gene phenotype.
      selected_evidence:
        snippet: Genetic analysis and targeted sequencing identified novel heterozygous missense (c.254T>A,
          p.V85D) and nonsense (c.1325G>T, p.E381*) mutations in SEC61A1, segregating with the disease
          phenotype.
        supports: SUPPORT
