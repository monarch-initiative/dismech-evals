        biological_scale: MOLECULAR
        description: Two CVID subtypes sit on the two arms of NF-kB signalling. NFKB1 haploinsufficiency
          reduces the canonical p50 subunit and is reported as the commonest monogenic cause of CVID in
          Europeans; NFKB2 C-terminal truncating variants leave the non-canonical precursor p100 unprocessable,
          so the mature p52 subunit is not made. The two are grouped on one node because both converge
          on impaired B-cell differentiation, and separated in the bound processes because the pathways
          themselves are distinct.
        genes:
        - preferred_term: NFKB1
          term:
            id: hgnc:7794
            label: NFKB1
        - preferred_term: NFKB2
          term:
            id: hgnc:7795
            label: NFKB2
        biological_processes:
        - preferred_term: canonical NF-kappaB signal transduction
          modifier: DECREASED
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
        - preferred_term: non-canonical NF-kappaB signal transduction
          modifier: DECREASED
          term:
            id: GO:0038061
            label: non-canonical NF-kappaB signal transduction
      selected_evidence:
        snippet: we conclude that the CVID phenotype in these families is caused by NF-κB1 p50 haploinsufficiency.
        supports: SUPPORT
