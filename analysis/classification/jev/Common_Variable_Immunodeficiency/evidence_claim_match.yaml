          value:
            name: CVID13
            display_name: Common variable immunodeficiency 13 (IKZF1/IKAROS)
            subtype_term:
              preferred_term: pancytopenia due to IKZF1 mutations
              term:
                id: MONDO:0014810
                label: pancytopenia due to IKZF1 mutations
            genes:
            - preferred_term: IKZF1
              term:
                id: hgnc:13176
                label: IKZF1
            description: IKAROS haploinsufficiency, defined by progressive loss of circulating B cells
              with reduced early B-cell precursors in marrow. MONDO names this term after the pancytopenia
              and carries CVID13 only as a synonym, so the CVID identity of the concept is invisible to
              a label search; the term is nonetheless a direct child of common variable immunodeficiency
              and ClinGen's Antibody Deficiencies panel classifies the relationship as Definitive.
          role: subtype
      assertion_type: Genetic
      assertion:
        name: IKZF1 (IKAROS) Haploinsufficiency
        association: Causative
        relationship_type: CAUSATIVE
        subtype: CVID13
        gene_term:
          preferred_term: IKZF1
          term:
            id: hgnc:13176
            label: IKZF1
        notes: MONDO files the IKZF1 entity under the primary label "pancytopenia due to IKZF1 mutations"
          and carries CVID13 only as a synonym, so a search on the CVID label alone does not find it.
          ClinGen's Definitive classification is recorded against that same pancytopenia label. The defining
          lesion is loss of the B-cell compartment - the series below found a striking decrease in B-cell
          numbers across 29 affected people - and that is where the gene is wired into the pathograph;
          the autoimmune cytopenia and pancytopenia the MONDO label names are the second arm of the same
          phenotype.
      selected_evidence:
        snippet: Six different heterozygous mutations in IKZF1, the gene encoding the transcription factor
          IKAROS, were identified in 29 persons from six families.
        supports: SUPPORT
    origin:
