            term:
              id: MONDO:0015517
              label: common variable immunodeficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Early B Cell Lymphopoiesis Failure
        biological_scale: CELLULAR
        description: 'A lesion upstream of, and distinct from, the germinal-centre failure the node above
          describes. IKAROS is a lymphoid transcription factor, and the six reported mutations all fall
          in its DNA-binding domain, producing a progressive loss of circulating B cells with markedly
          reduced early B-cell precursors in marrow. Plasma cells were still present in the marrow of
          the reported patients, which is why this is modelled as its own node rather than added to the
          differentiation-and-class-switch node: the hypogammaglobulinemia follows from having too few
          B cells rather than from B cells that cannot finish differentiating.'
        genes:
        - preferred_term: IKZF1
          term:
            id: hgnc:13176
            label: IKZF1
        cell_types:
        - preferred_term: precursor B cell
          term:
            id: CL:0000817
            label: precursor B cell
        biological_processes:
        - preferred_term: B cell differentiation
          modifier: DECREASED
          term:
            id: GO:0030183
            label: B cell differentiation
      selected_evidence:
        snippet: Heterozygous mutations in the transcription factor IKAROS caused an autosomal dominant
          form of CVID that is associated with a striking decrease in B-cell numbers.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
