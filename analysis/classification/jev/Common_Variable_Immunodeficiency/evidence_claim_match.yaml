        name: Secondary hypogammaglobulinemia
        description: Hypogammaglobulinemia acquired from B-cell-depleting therapy (rituximab and other
          anti-CD20 agents), other immunosuppressants, protein loss, or lymphoid malignancy can reproduce
          the CVID laboratory phenotype and must be excluded before CVID is diagnosed.
        distinguishing_features:
        - History of B-cell depletion immunotherapy, immunosuppression, protein-losing state, or hematologic
          malignancy
        - Onset after a documented period of normal immunoglobulin levels
        - No requirement for a primary immune defect; immunoglobulins may recover after the cause is removed
      selected_evidence:
        snippet: 12 patients with "secondary" hypogammaglobulinemia due to a previous B-cell depletion
          immunotherapy for autoimmune or malignant disease several years ago
