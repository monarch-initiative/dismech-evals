  a32d2d0e39cfeb049ad47682eec5cbc281a917fd455b30af6f596ec96864886c:
    claim:
      about:
        disease:
          name: Common Variable Immunodeficiency
          disease_term:
            preferred_term: Common Variable Immunodeficiency
            term:
              id: MONDO:0015517
              label: common variable immunodeficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Immune Dysregulation and Autoimmunity
        description: 'Approximately 25-50% of CVID patients develop autoimmune complications, most commonly
          autoimmune cytopenias (immune thrombocytopenia and autoimmune hemolytic anemia). This reflects
          a breakdown of peripheral tolerance and defective regulatory T cell function, particularly through
          the CTLA-4/LRBA checkpoint axis. Expansion of autoreactive CD21low B cells contributes to antibody-mediated
          autoimmunity. IKZF1 (IKAROS) is bound here as a second placement, not as its primary mechanism:
          its CVID lesion is the loss of the B-cell compartment modelled on the Early B Cell Lymphopoiesis
          Failure node, and it appears again here because autoimmune cytopenias are a recurrent part of
          the IKAROS phenotype rather than an incidental feature of one case.'
        genes:
        - preferred_term: CTLA4
          term:
            id: hgnc:2505
            label: CTLA4
        - preferred_term: LRBA
          term:
            id: hgnc:1742
            label: LRBA
        - preferred_term: IKZF1
          term:
            id: hgnc:13176
            label: IKZF1
        cell_types:
        - preferred_term: Regulatory T cell
          term:
            id: CL:0000815
            label: regulatory T cell
        biological_processes:
        - preferred_term: Immune Response
          term:
            id: GO:0006955
            label: immune response
      selected_evidence:
        snippet: human CTLA4 haploinsufficiency caused dysregulation of FoxP3(+) regulatory T (Treg) cells,
          hyperactivation of effector T cells, and lymphocytic infiltration of target organs. Patients
          also exhibited progressive loss of circulating B cells, associated with an increase of predominantly
          autoreactive CD21(lo) B cells and accumulation of B cells in nonlymphoid organs.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25213377
      reference_title: Immune dysregulation in human subjects with heterozygous germline mutations in
        CTLA4.
      evidence_source: HUMAN_CLINICAL
      explanation: Shows that CTLA4 haploinsufficiency, found in a subset of CVID patients, causes Treg
        dysfunction, expansion of autoreactive CD21low B cells, and immune dysregulation, explaining autoimmune
        manifestations in CVID.
    first_seen_at: '2026-09-25T15:08:55.594729+00:00'
    first_seen_revision: fc510ecca031fdabb75960970c310382a89bff8e
