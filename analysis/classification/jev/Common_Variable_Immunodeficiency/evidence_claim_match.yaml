  19a4a616a2b6f1704b31fcc0fbc6a8cd8562f07417c4a76eb11626c5bb77a45a:
    claim:
      about:
        disease:
          name: Common Variable Immunodeficiency
          disease_term:
            preferred_term: Common Variable Immunodeficiency
            term:
              id: MONDO:0015517
              label: common variable immunodeficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: T Cell Dysregulation
        description: 'Many CVID patients exhibit T cell abnormalities including reduced naive CD4+ T cells,
          expanded CD21low B cells, impaired T cell proliferation, and skewed T helper cell responses.
          T follicular helper cell dysfunction contributes to impaired germinal center reactions and defective
          B cell help. ICOS deficiency specifically impairs T cell help for late B cell differentiation
          and memory B cell generation. IL-21, a cytokine of the same follicular helper compartment, is
          grouped here for the same reason: its loss removes the T-cell-derived signal for B-cell differentiation
          rather than damaging the B cell itself.'
        genes:
        - preferred_term: ICOS
          term:
            id: hgnc:5351
            label: ICOS
        - preferred_term: IL21
          term:
            id: hgnc:6005
            label: IL21
        cell_types:
        - preferred_term: CD4+ T Cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
        biological_processes:
        - preferred_term: T Cell Activation
          term:
            id: GO:0042110
            label: T cell activation
      selected_evidence:
        snippet: we found four of 32 patients to lack ICOS, the "inducible costimulator" on activated
          T cells, due to an inherited homozygous deletion in the ICOS gene. T cells from these individuals
          were normal with regard to subset distribution, activation, cytokine production and proliferation.
          In contrast, naive, switched and memory B cells were reduced.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:12577056
      reference_title: Homozygous loss of ICOS is associated with adult-onset common variable immunodeficiency.
      evidence_source: HUMAN_CLINICAL
      explanation: Demonstrates that ICOS deficiency causes CVID through impaired T cell costimulation
        for B cell differentiation, with reduced naive, switched, and memory B cells despite normal T
        cell subsets.
