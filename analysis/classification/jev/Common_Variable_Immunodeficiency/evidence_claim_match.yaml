  febf7296493bd5d68f63a7d1f9a9ab47b8efad95ac50d38a7ae1f4bd68aa1a46:
    claim:
      about:
        disease:
          name: Common Variable Immunodeficiency
          disease_term:
            preferred_term: Common Variable Immunodeficiency
            term:
              id: MONDO:0015517
              label: common variable immunodeficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: B Cell Coreceptor Complex Failure
        biological_scale: MOLECULAR
        description: 'Three of the numbered CVID subtypes disable the same structure: the B-cell coreceptor
          complex of CD19, CD21 (CR2), CD81 and CD225, which lowers the activation threshold of the B-cell
          antigen receptor. CD19 carries the signalling function, CD81 is required for CD19 to reach the
          surface, and CD21 supplies the C3d costimulus. MS4A1 (CD20) is not a subunit of that complex;
          it is grouped on this node because ClinGen''s assessment records that CD20 regulates signalling
          through the B-cell receptor, and because the reported patient''s defect was in antibody formation
          rather than in B-cell development. Across these subtypes B-cell development is largely preserved
          and what fails is the response to antigen, which is why they present as CVID rather than as
          agammaglobulinemia.'
        genes:
        - preferred_term: CD19
          term:
            id: hgnc:1633
            label: CD19
        - preferred_term: CD81
          term:
            id: hgnc:1701
            label: CD81
        - preferred_term: CR2
          term:
            id: hgnc:2336
            label: CR2
        - preferred_term: MS4A1
          term:
            id: hgnc:7315
            label: MS4A1
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: B cell receptor signaling pathway
          modifier: DECREASED
          term:
            id: GO:0050853
            label: B cell receptor signaling pathway
      selected_evidence:
        snippet: The CD19 protein forms a complex with CD21, CD81, and CD225 in the membrane of mature
          B cells. Together with the B-cell antigen receptor, this complex signals the B cell to decrease
          its threshold for activation by the antigen.
        supports: SUPPORT
    origin:
