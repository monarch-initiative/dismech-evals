        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Monogenic inborn errors of immunity presenting as CVID
        description: Genetic work-up reassigns a subset of clinically diagnosed CVID patients to distinct
          IEIs classified in other IUIS tables — for example activated PI3K-delta syndrome, LRBA deficiency,
          and CTLA4 haploinsufficiency — with different prognoses and targeted treatments. See also the
          cvid_umbrella_cuts_across_the_iuis_tables discussion in the Predominantly Antibody Deficiencies
          IEIs grouping.
        distinguishing_features:
        - Early onset, positive family history, marked autoimmunity or lymphoproliferation raise the prior
          for a monogenic cause
        - A pathogenic variant in a non-CVID IUIS gene reclassifies the diagnosis
        - Targeted therapy may be available (e.g. abatacept for CTLA4/LRBA disease, PI3K-delta inhibitors
          for APDS)
      selected_evidence:
        snippet: This discovery led us to consider a possible metamorphosis of CVID, which, once studied
          from a genetic perspective, actually reveals very different IEIs.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/2
      evidence_path: /differential_diagnoses/2/evidence/0
