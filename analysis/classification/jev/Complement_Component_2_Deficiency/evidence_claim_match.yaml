      assertion_type: Phenotype
      assertion:
        name: Hypogammaglobulinemia
        category: Laboratory
        description: 'Progressive reduction in serum immunoglobulins, reported as affecting all three
          classes by adolescence in a long-term follow-up. This is deliberately not given a frequency
          band: the longitudinal observation is a single patient in one family, and the authors present
          it as a possible association calling for further study rather than an established feature. It
          is curated because it changes management — it argues for periodic immunoglobulin monitoring
          in a disease where nobody would otherwise order it — and because it is distinct from the separately
          curated isotype-specific deficits (low IgG4, IgD and IgG2), which are a cross-sectional property
          of C2 deficiency rather than a progressive panhypogammaglobulinemia.

          No incoming causal edge, deliberately. Nothing cited explains how C2 loss would produce a progressive
          fall in all three immunoglobulin classes, and the observation rests on one patient followed
          to age 16. Attaching it to the convertase or clearance nodes would invent a route to justify
          a connection.'
        phenotype_term:
          preferred_term: Hypogammaglobulinemia
          term:
            id: HP:0004313
            label: Decreased circulating immunoglobulin concentration
          clinical_course: PROGRESSIVE
      selected_evidence:
        snippet: At the age of 16, the younger brother developed progressive hypogammaglobulinemia of
          all three classes, IgA, IgM and IgG.
        supports: SUPPORT
