              label: complement component 2 deficiency
        context: []
      assertion_type: Treatment
      assertion:
        name: Vaccination Against Encapsulated Bacteria
        description: Pneumococcal, meningococcal and Haemophilus influenzae type b vaccination is the
          primary preventive intervention, and it works in C2 deficiency for a mechanistically specific
          reason. C2-deficient individuals mount normal antibody titres — the block is in effector function,
          not in the humoral response — and those antibodies restore opsonophagocytosis by driving complement
          activation through the alternative pathway, bypassing the missing C2 step. Vaccination therefore
          does not repair the classical pathway; it routes around it.
        therapeutic_modality: VACCINE
        treatment_term:
          preferred_term: vaccination against encapsulated bacteria
          term:
            id: NCIT:C15346
            label: Vaccination
      selected_evidence:
        snippet: Post-vaccination IgG antibodies against pneumococci serotype 6B and 23F at a concentration
          ≥1.0mg/L was found in similar frequency in C2D persons and controls.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22842196
      reference_title: Vaccination against encapsulated bacteria in hereditary C2 deficiency results in
        antibody response and opsonization due to antibody-dependent complement activation.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes that the antibody response itself is intact in C2 deficiency, which is
        what makes vaccination worth giving.
