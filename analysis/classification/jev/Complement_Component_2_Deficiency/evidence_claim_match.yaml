      assertion_type: Treatment
      assertion:
        name: Antibiotic Prophylaxis
        description: 'Long-term prophylactic penicillin is recommended alongside vaccination. The evidence
          for it is weaker than the recommendation''s ubiquity suggests, and the entry records both sides
          rather than the favourable one: a 21-year two-brother follow-up reports no severe or invasive
          infection under combined vaccination and prophylaxis, while the 77-patient European registry
          found no association between prophylactic antibiotic use and subsequent infection risk. The
          registry also found prescribing varied by country rather than by patient, which is what a practice
          without a settled evidence base looks like.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: antibiotic prophylaxis
          term:
            id: NCIT:C51993
            label: Antibiotic Prophylaxis
          therapeutic_agent:
          - preferred_term: benzathine benzylpenicillin
            term:
              id: CHEBI:51352
              label: benzylpenicillin benzathine
          - preferred_term: phenoxymethylpenicillin
            term:
              id: CHEBI:27446
              label: phenoxymethylpenicillin
          - preferred_term: amoxicillin
            term:
              id: CHEBI:2676
              label: amoxicillin
        notes: The two findings are not necessarily contradictory — the registry measured an association
          across mixed complement defects and could not isolate C2, and the follow-up describes vaccination
          and prophylaxis given together, so neither isolates the antibiotic's contribution. Recorded
          as a genuine disagreement rather than resolved.
      selected_evidence:
        snippet: Antibiotic prophylaxis was also started, initially with intramuscular benzathine benzylpenicillin
          every 21 d, replaced by oral phenoxymethylpenicillin in 2002 and currently with oral amoxicillin
          in a single daily dose.
        supports: SUPPORT
