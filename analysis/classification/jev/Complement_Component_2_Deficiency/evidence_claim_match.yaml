      assertion_type: Subtype
      assertion:
        name: Type II
        display_name: Type II C2 deficiency (selective block in secretion)
        description: A rarer form caused by missense variants that permit C2 synthesis but block its secretion,
          so the protein is retained intracellularly rather than absent from the transcript.
      selected_evidence:
        snippet: Pulse-chase biosynthetic labeling experiments indicated that the C111Y mutant C2 was
          retained by transfected COS cells and secreted only in minimal amounts.
        supports: SUPPORT
