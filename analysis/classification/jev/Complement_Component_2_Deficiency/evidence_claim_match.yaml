        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Classical Pathway C3 Convertase Failure
        biological_scale: MOLECULAR
        description: C2 is an obligate component of the classical pathway C3 convertase C4b2a. Its absence
          blocks classical-pathway C3 cleavage, measurable as absent CH50. The lectin pathway converges
          on the same C4b2a convertase — MASP-2 cleaves C4 and C2 — so its effector arm fails too; only
          the alternative pathway (C3bBb) remains intact, which is why lysis is preserved and the phenotype
          is milder than a C3 deficiency.
        biological_processes:
        - preferred_term: Complement activation, classical pathway
          term:
            id: GO:0006958
            label: complement activation, classical pathway
          modifier: DECREASED
      selected_evidence:
        snippet: Reduced C2 levels in plasma (P = 2 × 10-9 ) and impaired function of the classical complement
          pathway (P = 0.03) were detected in SLE patients with heterozygous C2 deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
