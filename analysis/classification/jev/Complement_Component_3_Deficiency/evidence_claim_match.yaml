      assertion_type: Pathophysiology
      assertion:
        name: Failure of Complement Activation at the C3 Convergence Point
        biological_scale: MOLECULAR
        description: The classical, lectin and alternative pathways all converge on cleavage of C3. With
          no C3, no C3b is deposited on targets, the alternative-pathway amplification loop cannot run,
          the C5 convertases (which incorporate C3b) cannot assemble, and the C3a anaphylatoxin is not
          generated. Both classical (CH50) and alternative pathway haemolytic activity are absent, and
          adding purified C3 restores them in vitro.
        biological_processes:
        - preferred_term: Complement activation
          term:
            id: GO:0006956
            label: complement activation
          modifier: DECREASED
        - preferred_term: Complement activation, alternative pathway
          term:
            id: GO:0006957
            label: complement activation, alternative pathway
          modifier: DECREASED
        - preferred_term: Complement activation, classical pathway
          term:
            id: GO:0006958
            label: complement activation, classical pathway
          modifier: DECREASED
      selected_evidence:
        snippet: C3 is the point at which all complement pathways converge, and complete deficiency of
          C3 invariably leads to severe infections, including those caused by meningococci and pneumococci.
        supports: SUPPORT
    origin:
