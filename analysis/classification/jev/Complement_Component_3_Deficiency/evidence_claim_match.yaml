        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Recessive
        description: 'Complete deficiency requires homozygous or compound heterozygous C3 loss-of-function
          alleles. Heterozygous parents and siblings typically have about 50% of normal serum C3 and are
          clinically unaffected, although carriers vary: some reported heterozygous parents with C3 near
          the lower limit of normal have had recurrent infections, which the authors of the Moroccan series
          read as incomplete clinical penetrance in carriers. Founder alleles occur in populations with
          endogamy, such as the Afrikaans exon 22-23 deletion and a Moroccan splice-site variant found
          in two unrelated families from the Taounat region.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: His parents had both the normal and abnormal C3 mRNA and were shown to be heterozygous
          for this mutation by sequence analysis of genomic DNA amplified by PCR.
        supports: SUPPORT
