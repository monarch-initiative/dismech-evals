      assertion:
        name: Defective Immune Complex Solubilization and Clearance
        biological_scale: CELLULAR
        description: C3 fragments solubilise immune complexes and opsonise them, and apoptotic cells,
          for transport and clearance. In their absence immune complexes persist and deposit in glomeruli
          and vessel walls, and uncleared apoptotic material is thought to drive loss of tolerance. This
          is the accepted explanation for the glomerulonephritis and SLE-like disease, but it rests on
          case observations and mechanistic inference rather than on direct measurement of clearance in
          C3-deficient patients.
        biological_processes:
        - preferred_term: immune complex clearance
          term:
            id: GO:0002434
            label: immune complex clearance
          modifier: DECREASED
        - preferred_term: apoptotic cell clearance
          term:
            id: GO:0043277
            label: apoptotic cell clearance
          modifier: DECREASED
      selected_evidence:
        snippet: Impaired clearance of apoptotic cellular debris, which also depends on C3-mediated opsonization,
          may further contribute to the breach of self-tolerance observed in affected patients
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
