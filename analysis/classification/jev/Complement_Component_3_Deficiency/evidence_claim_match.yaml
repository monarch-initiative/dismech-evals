      assertion_type: AnimalModel
      assertion:
        name: C3-deficient mouse
        species: Mouse
        genotype: C3(-/-)
        publication: PMID:12496386
        description: Targeted C3 knockout mice, used to test which humoral responses need C3. The cited
          studies address the adaptive-immunity arm of the disease, not the infection or immune-complex
          disease arms.
        modeled_mechanisms:
        - target: Impaired Complement-Dependent Adaptive Immune Priming
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: C3-deficient mice mount a poor primary antibody response to a bacterial capsular
            polysaccharide, without class switching, and fail to deliver antigen and immune complexes
            to marginal zone B cells and follicular dendritic cells. This is a mechanism for the poor
            polysaccharide responses and memory B-cell deficit reported in patients.
          limitations: 'The antigens are group B streptococcal type III polysaccharide and experimental
            IgG3 immune complexes, not the pneumococcal, meningococcal and Haemophilus antigens relevant
            to patients. In patients the antibody defect is variable: one series of eight mounted normal
            toxoid responses, so the knockout''s uniform defect overstates the human phenotype. The cited
            studies do not examine infection susceptibility, lupus-like disease or glomerulonephritis.'
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: Mouse splenic marginal zone B-cell and follicular dendritic cell handling of
              polysaccharide antigen is the readout; how closely human polysaccharide responses depend
              on the same route is not tested in these studies.
          - divergence_type: PROXY_QUANTITY
            materiality: QUALIFYING
            description: The model measures antibody to a single experimental polysaccharide antigen,
              standing in for the node's broader claim about memory B-cell generation and specific antibody
              responses in patients.
          readouts:
          - name: Primary antibody response to capsular polysaccharide
            target: Impaired Complement-Dependent Adaptive Immune Priming
            direction: DECREASED
            interpretation: Low IgM without switching to IgG after polysaccharide immunisation.
          - name: Antigen deposition on follicular dendritic cells
            target: Impaired Complement-Dependent Adaptive Immune Priming
            direction: DECREASED
            interpretation: Without C3, antigen and immune complexes are not captured by marginal zone
              B cells or deposited on follicular dendritic cells.
      selected_evidence:
        snippet: Mice deficient in C3 or Cr2 had an impaired primary immune response to III-PS.
        supports: SUPPORT
