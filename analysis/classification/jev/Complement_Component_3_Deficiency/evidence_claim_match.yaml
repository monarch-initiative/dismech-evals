        biological_scale: MOLECULAR
        description: The classical, lectin and alternative pathways all converge on cleavage of C3. With
          no C3, no C3b is deposited on targets, the alternative-pathway amplification loop cannot run,
          the C5 convertases (which incorporate C3b) cannot assemble, and the C3a anaphylatoxin is not
          generated. Both classical (CH50) and alternative pathway haemolytic activity are absent, and
          adding purified C3 restores them in vitro.
        biological_processes:
        - preferred_term: Complement activation
          term:
