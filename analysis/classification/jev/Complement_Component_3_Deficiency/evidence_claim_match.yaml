        context: []
      assertion_type: Pathophysiology
      assertion:
        name: C3 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: 'Reported alleles are mostly null: nonsense variants with nonsense-mediated mRNA
          decay, splice-site variants causing exon skipping or frameshift, and partial gene deletions.
          Some in-frame splice or missense alleles allow synthesis but block secretion, so the protein
          is retained in the secretory pathway and degraded. In each case serum C3 is undetectable. C3
          is made mainly by hepatocytes, with a smaller contribution from monocytes and kidney.'
        genetic_context:
          gene:
            preferred_term: C3
            term:
              id: hgnc:1318
              label: C3
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: C3 fragment receptor ligand activity
          term:
            id: GO:0048018
            label: receptor ligand activity
          modifier: DECREASED
        cell_types:
        - preferred_term: Hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Our results indicate the presence of a premature termination codon in the C3 gene that
          results in a lack of the protein in patient's serum, which correlates with the acceleration
          of C3 mRNA decay in the patient's fibroblasts.
        supports: SUPPORT
