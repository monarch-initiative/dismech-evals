          value:
            name: Impaired Complement-Dependent Adaptive Immune Priming
            biological_scale: CELLULAR
            description: 'Cells from C3-deficient patients show impaired monocyte-to-dendritic-cell differentiation
              and maturation, few switched memory B cells, reduced regulatory T-cell induction and defective
              Th1 induction. Antibody responses are variable: one patient failed to sustain a vaccine
              response, while a series of eight patients mounted normal toxoid responses with an abnormal
              IgG subclass pattern. The defect is therefore a skewing of adaptive immunity rather than
              a uniform antibody deficiency. The direction of the T-helper change is unsettled: the in
              vitro study (PMID:24321396) reports impaired Th1 induction from patient T cells, while the
              in vivo subclass data (PMID:25446578) show increased Th1-related IgG3 responses. The DECREASED
              modifier on the Th1 process below follows the in vitro measurement, and the IgG3 evidence
              item is curated as REFUTE against it.'
