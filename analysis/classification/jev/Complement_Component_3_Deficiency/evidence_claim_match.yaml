          modifier: DECREASED
        - preferred_term: Complement activation, classical pathway
          term:
            id: GO:0006958
            label: complement activation, classical pathway
          modifier: DECREASED
      selected_evidence:
        snippet: An in vitro addition of purified C3 restored the classical pathway-dependent haemolytic
          activity of his serum.
        supports: SUPPORT
    origin:
