      assertion_type: Pathophysiology
      assertion:
        name: Reduced Immune Complex and Apoptotic Debris Clearance
        biological_scale: CELLULAR
        description: 'Classical-pathway opsonisation (C4b, then C3b) tags immune complexes and apoptotic
          cells for CR1-mediated transport and phagocytic clearance. With less functional C4 this clearance
          is impaired, so immune complexes and apoptotic debris persist. Direct human measurement of this
          defect is mixed: one study tied reduced prevention of immune precipitation to low C4A, while
          a later study (PMID:15932521) found the defect independent of C4A null alleles.'
        biological_processes:
        - preferred_term: immune complex clearance
          term:
            id: GO:0002434
            label: immune complex clearance
          modifier: DECREASED
        - preferred_term: apoptotic cell clearance
          term:
            id: GO:0043277
            label: apoptotic cell clearance
          modifier: DECREASED
      selected_evidence:
        snippet: PIP was positively correlated with levels of C4 (P = 3 x 10(-5)) and in particular the
          C4A isotype (P = 9 x 10(-10)) whereas C4B was redundant.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
