              label: complement component 4a deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: c4a_hla_confounding
        kind: KNOWLEDGE_GAP
        attaches_to:
        - phenotypes#Systemic Lupus Erythematosus
        prompt: How much of the SLE risk attributed to C4A deficiency is independent of the linked HLA
          class II alleles (e.g. HLA-DRB1*03:01) on the same 8.1 ancestral haplotype?
        rationale: C4A deficiency in Europeans sits on the 8.1 ancestral haplotype in strong linkage disequilibrium
          with HLA-DRB1*03:01, so disentangling the complement effect from the HLA effect is difficult.
          One British analysis found partial C4 deficiency not independent of DRB1*03, while the East
          Asian data, where C4A deficiency is not linked to DRB1*03:01, support an HLA-independent complement
          effect. The question is unresolved in Europeans.
        proposed_experiments:
        - experiment_id: c4a_hla_conditioned_assoc
          name: HLA-conditioned association analysis of C4A copy number in SLE
          description: Test C4A copy number against SLE risk conditioning on HLA-DRB1 genotype in a large
            European cohort.
      selected_evidence:
        snippet: The association of homozygous deletion of C4A and SLE is accompanied by the presence
          of HLA-DRB1*0301 without a proven pathophysiological mechanism.
        supports: SUPPORT
    origin:
