      - /disease_term
    evidence_metadata:
      reference: PMID:17503323
      reference_title: 'Gene copy-number variation and associated polymorphisms of complement component
        C4 in human systemic lupus erythematosus (SLE): low copy number is a risk factor for and high
        copy number is a protective factor against SLE susceptibility in European Americans.'
