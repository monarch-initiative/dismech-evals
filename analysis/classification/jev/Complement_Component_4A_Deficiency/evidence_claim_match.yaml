              label: complement component 4a deficiency
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal Recessive
        description: Complete C4A deficiency reflects biallelic loss of functional C4A gene copies (zero
          C4A copy number), typically from the monomodular short RCCX haplotype carrying a single short
          C4B gene. Heterozygous (single-copy) C4A deficiency is a weaker risk factor and is curated here
          as a risk-factor genetic record rather than as the disease.
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
      selected_evidence:
        snippet: Total absence of C4A genes (homozygous C4A deficiency) had a frequency of 6.5% in female
          patients with SLE, compared with 1.3% in unrelated controls (OR=5.27; 95% CI 1.87-14.8; P=.001).
        supports: SUPPORT
    origin:
