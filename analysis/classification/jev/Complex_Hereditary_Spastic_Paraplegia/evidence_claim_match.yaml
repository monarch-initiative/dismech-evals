        - path: /pathophysiology/1
          value:
            name: Pleiotropic SPG-Protein Dysfunction Beyond the Corticospinal Tract
            description: 'In complex HSP the mutated SPG proteins have diverse housekeeping functions
              — axonal transport, endoplasmic reticulum tubular network morphogenesis, mitochondrial quality
              control, myelin formation, and endolysosomal/autophagic membrane trafficking. Loss of these
              functions injures neuronal and glial populations beyond the corticospinal tract (cortical
              neurons, cerebellar neurons, peripheral nerve, retina, and oligodendrocyte myelin), producing
              the additional "complicating" features (thin corpus callosum, cognitive decline, ataxia,
              neuropathy, retinopathy) that distinguish complex from pure HSP. This pleiotropy explains
              why complex forms cluster among loci with broad subcellular roles (e.g., SPG11/SPG15 endolysosomal-autophagy,
              SPG7 mitochondrial, SPG2/PLP1 myelin).

