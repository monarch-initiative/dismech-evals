          2 is caused by homozygous KIF1C variants, and SPOAN syndrome by a non-coding deletion upstream
          of KLC2 that raises KLC2 expression in patient fibroblasts and patient-derived motor neurons
          - a gain, not a loss, of gene product. Both diseases are recorded as subtype rows on this entry,
          so this node''s downstream consequence is the length-dependent corticospinal-tract axonopathy
          of the entry''s core node.'
        genes:
