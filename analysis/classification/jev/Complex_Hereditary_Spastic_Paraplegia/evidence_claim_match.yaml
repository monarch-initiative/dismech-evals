          lipid peak detectable by magnetic resonance spectroscopy; PNPLA6 encodes neuropathy target esterase,
          which maintains phospholipid homeostasis in the nervous system; ABHD16A is the main brain phosphatidylserine
          hydrolase; and B4GALNT1 loss abolishes synthesis of GM2 and the downstream complex gangliosides.
          Each of these genes causes a complex HSP recorded on this entry, and the DDHD2 report shows
