            term:
              id: MONDO:0015150
              label: complex hereditary spastic paraplegia
        context: []
      assertion_type: Subtype
      assertion:
        name: AR Complex HSP
        display_name: Autosomal Recessive Complex Hereditary Spastic Paraplegia
        description: 'Autosomal recessive forms of complex HSP, the group most strongly associated with
          thin corpus callosum and progressive cognitive decline. SPG11 (spatacsin) is the most common
          form and is characteristically associated with thin corpus callosum, intellectual disability/cognitive
          decline, peripheral neuropathy, and pseudobulbar involvement. SPG15 (ZFYVE26/spastizin) causes
          complicated autosomal-recessive spastic paraplegia including Kjellin syndrome (with pigmentary
          maculopathy). SPG7 (paraplegin) frequently presents with cerebellar ataxia and optic atrophy
          reflecting mitochondrial dysfunction. Additional characteristic autosomal recessive complex
          forms include SPG35 (FA2H, with leukodystrophy, seizures, and intellectual disability), SPG20/Troyer
          syndrome (SPART/spartin, with distal amyotrophy, dysarthria, and short stature), and the AP-4-associated
          HSP disorders (AP4B1/AP4M1/AP4E1/AP4S1; SPG47/50/51/52), a childhood-onset complex form with
          severe developmental delay and microcephaly.

          '
        genes:
        - preferred_term: SPG11
          term:
            id: hgnc:11226
            label: SPG11
        - preferred_term: ZFYVE26
          term:
            id: hgnc:20761
            label: ZFYVE26
        - preferred_term: SPG7
          term:
            id: hgnc:11237
            label: SPG7
        - preferred_term: FA2H
          term:
            id: hgnc:21197
            label: FA2H
        - preferred_term: SPART
          term:
            id: hgnc:18514
            label: SPART
        - preferred_term: AP4B1
          term:
            id: hgnc:572
            label: AP4B1
        inheritance:
        - name: Autosomal Recessive (Complex)
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
      selected_evidence:
        snippet: the identification of ZFYVE26, which encodes a zinc-finger protein with a FYVE domain
          that we named spastizin, as the cause of SPG15
        supports: SUPPORT
