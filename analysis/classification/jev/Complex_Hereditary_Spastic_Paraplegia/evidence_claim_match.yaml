          myelin formation, and endolysosomal/autophagic membrane trafficking. Loss of these functions
          injures neuronal and glial populations beyond the corticospinal tract (cortical neurons, cerebellar
          neurons, peripheral nerve, retina, and oligodendrocyte myelin), producing the additional "complicating"
          features (thin corpus callosum, cognitive decline, ataxia, neuropathy, retinopathy) that distinguish
          complex from pure HSP. This pleiotropy explains why complex forms cluster among loci with broad
          subcellular roles (e.g., SPG11/SPG15 endolysosomal-autophagy, SPG7 mitochondrial, SPG2/PLP1
          myelin).

