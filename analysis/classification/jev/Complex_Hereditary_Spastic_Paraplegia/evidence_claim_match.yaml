        description: 'Calcium efflux from the endoplasmic reticulum into the cytoplasm is controlled by
          inositol 1,4,5-trisphosphate binding to its receptor, and activated receptors are then degraded
          by the endoplasmic-reticulum-associated degradation pathway. Two complex-HSP genes on this entry
          act in that degradation step: ERLIN2, whose biallelic variants cause SPG18, and RNF170, the
          ubiquitin E3 ligase that targets the receptors and whose bi-allelic variants cause SPG85. The
          RNF170 report names inositol 1,4,5-trisphosphate signalling as a candidate key pathway for the
          hereditary spastic paraplegias, which is the claim this node records.'
        genes:
        - preferred_term: ERLIN2
