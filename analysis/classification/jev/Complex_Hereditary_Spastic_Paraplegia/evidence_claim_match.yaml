      assertion:
        name: AD Complex HSP
        display_name: Autosomal Dominant Complex Hereditary Spastic Paraplegia
        description: 'Autosomal dominant forms of complex HSP (MONDO:0015087), in which dominantly transmitted
          spastic paraplegia is accompanied by additional neurologic features. Representative loci include
          SPG10 (KIF5A, with peripheral neuropathy and distal amyotrophy), SPG9 (ALDH18A1, with cataracts
          and other systemic features), SPG17/Silver syndrome (BSCL2, with amyotrophy of the hands), and
          complicated presentations of otherwise "pure" dominant loci such as SPG3A (ATL1) and SPG4 (SPAST).
          Penetrance is age-dependent.

          '
        genes:
        - preferred_term: KIF5A
          term:
            id: hgnc:6323
            label: KIF5A
        - preferred_term: ALDH18A1
          term:
            id: hgnc:9722
            label: ALDH18A1
        inheritance:
        - name: Autosomal Dominant (Complex)
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: cause both autosomal dominant HSP (SPG17), Charcot-Marie-Tooth type 2, and distal hereditary
          motor neuropathy type V
        supports: SUPPORT
