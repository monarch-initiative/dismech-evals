              label: complex lethal osteochondrodysplasia
        context:
        - path: /pathophysiology/2
          value:
            name: Loss of TAPT1-SUCO Protection of Newly Synthesized Proteins
            description: In mouse brain and cultured cells TAPT1 sits in the endoplasmic reticulum and
              binds SUCO. The complex keeps newly synthesized proteins from being treated as misfolded
