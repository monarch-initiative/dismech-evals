      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: aberrant_host_response_model
        hypothesis_label: CRPS as an aberrant host response to tissue injury rather than a disease of
          the injury
        status: CANONICAL
        description: The organizing framework. The inciting trauma is often trivial and is always common;
          CRPS is rare. What distinguishes patients is therefore the response, not the injury — an exaggerated
          and self-sustaining inflammatory, vasomotor, and neuroplastic reaction whose three pathways
          are activated to different degrees in different people. This is what the entry's branching pathograph
          encodes, and it is also why the clinical picture is so heterogeneous that a four-domain criteria
          set was needed to capture it.
      selected_evidence:
        snippet: Collectively, the evidence points to CRPS being a multifactorial disorder that is associated
          with an aberrant host response to tissue injury.
        supports: SUPPORT
