      assertion_type: DifferentialDiagnosis
      assertion:
        name: Complex regional pain syndrome type 2
        description: The same clinical syndrome following a confirmed peripheral nerve lesion. The distinction
          is by definition rather than by mechanism, and is not without critics, since fracture and surgery
          damage small nerve fibres yet the resulting CRPS is almost always classified as type 1.
        distinguishing_features:
        - A demonstrable major nerve lesion, established by history, examination, and electrodiagnostic
          study, reclassifies the case as type 2. Nerve conduction studies and EMG are used principally
          to make this exclusion.
        - 'Type 2 is roughly an order of magnitude less common: the same population study reported 5.46
          per 100,000 person-years for type 1 against 0.82 for type 2.'
      selected_evidence:
        snippet: A distinction is made between CRPS-1, in which a nerve lesion can not be identified,
          and CRPS-2, in which it can.
        supports: SUPPORT
