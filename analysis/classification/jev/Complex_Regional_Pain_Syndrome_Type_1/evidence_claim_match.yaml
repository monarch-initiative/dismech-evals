          originally described as acute inflammatory bone atrophy, and the structural correlate of the
          intense periarticular uptake on the delayed phase of three-phase bone scintigraphy. It is curated
          as a distinct node because it is the target of the treatment with the strongest randomized evidence
          in this disease: intravenous bisphosphonate.'
