      assertion_type: Pathophysiology
      assertion:
        name: Cortical Somatosensory Reorganization
        biological_scale: TISSUE
        description: The cortical representation of the affected hand in primary somatosensory cortex
          shrinks and its centre shifts toward the lip representation, while tactile-evoked S1 responses
          on the affected side are increased. The extent of reorganization correlates with pain and, more
          strongly, with mechanical hyperalgesia, and mechanical hyperalgesia is its best single predictor.
          This node is the target of the rehabilitative treatments — graded motor imagery and mirror therapy
          — that work by restoring coherent sensorimotor representation rather than by any pharmacological
          action.
        locations:
        - preferred_term: primary somatosensory cortex
          term:
            id: UBERON:0008933
            label: primary somatosensory cortex
      selected_evidence:
        snippet: The center of the hand was shifted toward the cortical representation of the lip.
