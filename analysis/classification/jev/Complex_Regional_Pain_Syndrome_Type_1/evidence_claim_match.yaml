        biological_scale: CELLULAR
        description: 'Microglia and astrocytes in the dorsal horn and in pain-related brain regions become
          and remain activated. The passive transfer experiment shows this state persisting long after
          the peripheral inflammatory response has resolved, and identifies microglia-derived IL-1beta
          as the mediator — with IL-1 receptor blockade both preventing it and reversing an already established
          phenotype. It is curated separately from the sensitization it produces because the two have
          different drug targets: IL-1 blockade acts here, NMDA antagonism acts downstream.'
