      assertion_type: Diagnosis
      assertion:
        name: Budapest criteria
        description: 'The IASP-adopted clinical criteria: continuing disproportionate pain, at least one
          reported symptom in three of the four domains (sensory, vasomotor, sudomotor/oedema, motor/trophic),
          at least one observed sign in two domains, and no better explanation. Their point is specificity:
          the earlier IASP criteria had sensitivity 1.00 with specificity 0.41, meaning they diagnosed
          CRPS in most patients who did not have it, and the four-domain structure is what recovered specificity
          without losing sensitivity.'
      selected_evidence:
        snippet: In comparison, the Budapest clinical criteria retained the exceptional sensitivity of
          the IASP criteria (0.99), but greatly improved upon the specificity (0.68).
        supports: SUPPORT
