      assertion:
        name: Peripheral Tissue Trauma
        biological_scale: TISSUE
        description: The initiating event, and almost always a common one — distal limb fracture above
          all, with sprain, crush, surgery, and immobilization also recognized. In the Olmsted County
          population study every identified case reported an antecedent event and fracture was the trigger
          in 46%. Because the trigger is ubiquitous and the syndrome is rare, this node is necessary but
          far from sufficient, which is the premise of the whole entry.
        locations:
        - preferred_term: manus
          term:
            id: UBERON:0002398
            label: manus
      selected_evidence:
        snippet: All cases reported an antecedent event and fracture was the most common trigger (46%).
        supports: SUPPORT
