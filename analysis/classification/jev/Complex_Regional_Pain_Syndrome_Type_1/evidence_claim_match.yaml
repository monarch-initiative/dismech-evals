      assertion:
        name: Sympathetic Vasomotor Dysregulation
        biological_scale: ORGANISM
        description: 'Disturbed sympathetic vasomotor control of the affected limb, producing the temperature
          and colour asymmetry of the vasomotor Budapest domain: an early warm, vasodilated phase and
          a later cold, cyanotic one. Importantly, not all CRPS pain is sympathetically maintained — a
          subset is sympathetically independent — which is the clearest explanation for why sympathetic
          blockade helps some patients and not others, and why this entry does not curate sympathetic
          block as a general treatment.'
