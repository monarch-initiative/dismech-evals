          loss occurs. The specific cytokine-RANKL cascade proposed for CRPS in the deep-research report
          was extrapolated from the general inflammatory bone-loss literature rather than from CRPS-specific
          primary data, and is deliberately not asserted here.
      selected_evidence:
        snippet: The primary pathology of both types of CRPS (Type I, also known as reflex sympathetic
          dystrophy, RSD; Type II, also known as causalgia) is featured by allodynia, edema, changes in
          skin color and temperature, and dystrophy, predominantly affecting extremities.
        supports: SUPPORT
