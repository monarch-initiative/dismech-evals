            term:
              id: MONDO:0011441
              label: complex regional pain syndrome type 1
        context: []
      assertion_type: AnimalModel
      assertion:
        name: CRPS IgG passive transfer into incised mice
        species: Mouse
        genotype: Female C57BL/6 with plantar skin-muscle incision, treated with purified IgG from patients
          with longstanding CRPS
        publication: PMID:31182576
        description: 'The model that makes the autoimmune arm causal. Purified IgG from patients with
          longstanding CRPS, given daily to mice with a small plantar incision, produces prolonged swelling
          and stable hyperalgesia and sustained central glial activation relative to healthy-control IgG.
          The design is what earns the weight: a human-derived agent, a healthy-donor control arm, a mechanistic
          knockout, a pharmacological block, and a treatment arm started after the phenotype was established.'
        modeled_mechanisms:
        - target: Spinal Glial Activation
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the sustained microglial and astrocyte activation in the dorsal horn
            and pain-related brain regions that defines this node, driven by the human patient-derived
            agent rather than by a synthetic surrogate.
          limitations: The donor IgG comes from patients with longstanding CRPS, so the model speaks to
            maintenance rather than initiation; the recipients are female C57BL/6 mice with a surgical
            incision rather than a fracture; and the hyperalgesia readout does not capture the vasomotor,
            sudomotor, and trophic domains that make up three quarters of the human criteria set.
          readouts:
          - name: Dorsal horn and brain microglial and astrocyte activation
            target: Spinal Glial Activation
            direction: INCREASED
            interpretation: Sustained glial activation after the peripheral inflammatory response has
              subsided is the model's evidence for a central, antibody-driven maintaining mechanism.
        - target: Autoantibody Production Against Autonomic Receptors
          relationship: PERTURBS
          fidelity: HIGH
          description: The model does not reproduce autoantibody production — it supplies the antibodies
            directly, which is precisely what isolates their contribution from everything else in the
            patient.
          limitations: Because the antibodies are administered rather than generated, the model is silent
            on how tolerance is broken in patients, which remains unexplained.
          readouts:
          - name: Paw swelling and mechanical hyperalgesia after patient IgG transfer
            target: Autoantibody Production Against Autonomic Receptors
            direction: INCREASED
            interpretation: A CRPS-like phenotype produced by patient antibodies alone, against a healthy-donor
              IgG control, is the causal evidence for this node.
      selected_evidence:
        snippet: These results indicate that persistent CRPS is often contributed to by autoantibodies
          and highlight a potential therapeutic use for clinically licensed antagonists, such as anakinra,
          to prevent or treat CRPS via blocking IL-1 actions.
        supports: SUPPORT
