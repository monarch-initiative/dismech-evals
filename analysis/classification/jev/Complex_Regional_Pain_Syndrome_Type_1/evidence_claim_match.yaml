      assertion_type: Pathophysiology
      assertion:
        name: Neurogenic Inflammation
        biological_scale: TISSUE
        description: Activated C-fibre nociceptors release substance P and CGRP into the injured limb,
          producing vasodilation, plasma extravasation, oedema, erythema, and increased sweating, and
          recruiting local immune cells. This node is the direct substrate of three of the four Budapest
          domains — vasomotor, sudomotor/oedema, and part of the trophic — and it is what makes early
          CRPS a warm, swollen limb rather than a purely sensory complaint.
        cell_types:
        - preferred_term: sensory neuron of dorsal root ganglion
          term:
            id: CL:1001451
            label: sensory neuron of dorsal root ganglion
        biological_processes:
        - preferred_term: neuropeptide signaling pathway
          term:
            id: GO:0007218
            label: neuropeptide signaling pathway
          modifier: INCREASED
        - preferred_term: positive regulation of vascular permeability
          term:
            id: GO:0043117
            label: positive regulation of vascular permeability
          modifier: INCREASED
      selected_evidence:
        snippet: Compelling evidence implicates biological pathways that underlie aberrant inflammation,
          vasomotor dysfunction, and maladaptive neuroplasticity in the clinical features of CRPS.
        supports: SUPPORT
