        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: maladaptive_neuroplasticity_model
        hypothesis_label: Maladaptive cortical reorganization coupled to symptom severity
        status: CANONICAL
        description: Above the spinal cord, the somatosensory representation of the affected hand shrinks
          and shifts toward the lip representation. What makes this more than an epiphenomenon is that
          the magnitude of reorganization correlates with CRPS pain and, most strongly, with mechanical
          hyperalgesia — and that the rehabilitative treatments aimed at this level (graded motor imagery,
          mirror therapy) have a real effect on pain. The direction of causation between reorganization
          and symptom is not settled by the correlational imaging alone, which is why the treatment evidence
          is curated alongside it.
      selected_evidence:
        snippet: The authors found a significant shrinkage of the extension of the cortical hand representation
          for the CRPS affected side.
        supports: SUPPORT
