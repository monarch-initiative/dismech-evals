  a9796d520140a1729615fe2b901873fa6b316ceaaa7cadb9f7c3ae7b17e17a08:
    claim:
      about:
        disease:
          name: Complex Regional Pain Syndrome Type 1
          disease_term:
            preferred_term: complex regional pain syndrome type 1
            term:
              id: MONDO:0011441
              label: complex regional pain syndrome type 1
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: autoimmune_model
        hypothesis_label: Autoantibodies against autonomic receptors as a pathogenic, IL-1-dependent maintaining
          loop
        status: CANONICAL
        description: 'The strongest mechanistic result in the modern CRPS literature, and the reason this
          is not merely an inflammation story. Functionally active IgG against the beta-2 adrenergic and
          muscarinic-2 receptors is present in a subset of patients; transferring patient IgG into mice
          with a plantar incision produces prolonged swelling and stable hyperalgesia together with sustained
          microglial and astrocyte activation. Crucially the experiment includes its own mechanistic rescue:
          IL-1 knockout or IL-1 receptor blockade prevents the transferred phenotype, and blockade started
          eight days after incision reverses it. Curated as CANONICAL for that causal structure, with
          the caveat that the autoantibodies define a subset rather than all patients.'
      selected_evidence:
        snippet: Herein, we demonstrate the presence of autoantibodies in a subset of CRPS patients with
          agonistic-like properties on the β(2) adrenergic receptor and/or the muscarinic-2 receptor.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21816540
      reference_title: Autoimmunity against the β2 adrenergic receptor and muscarinic-2 receptor in complex
        regional pain syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the autoantibodies and their targets in patients, with the "subset" qualifier
