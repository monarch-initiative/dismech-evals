              label: cone-rod dystrophy 20
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic POC1B Loss-of-Function Variants
        biological_scale: MOLECULAR
        description: Biallelic POC1B variants. Missense and in-frame alleles such as p.Arg106Pro and p.Gln67del
          lost basal-body localization in overexpressed RPE1 cells and lost the interaction with FAM161A,
          although p.Arg106Pro localized normally to the centrosome in a separate HEK293T assay, so the
          localization defect is assay-dependent; nonsense, frameshift and splice alleles, including a
          deep-intronic variant that activates a pseudoexon, are predicted to remove the protein.
        genes:
        - preferred_term: POC1B
          term:
            id: hgnc:30836
            label: POC1B
        molecular_functions:
        - preferred_term: POC1A-POC1B heterodimerization
          modifier: DECREASED
          term:
            id: GO:0046982
            label: protein heterodimerization activity
      selected_evidence:
        snippet: We demonstrate the importance of an interaction network organised by POC1A-POC1B heterodimers
          within the centriole lumen, where the WD40 domain of POC1B localises close to the centriole
          wall, while the POC5-interacting WD40 of POC1A resides in the centriole lumen.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39543170
      reference_title: An interaction network of inner centriole proteins organised by POC1A-POC1B heterodimer
        crosslinks ensures centriolar integrity.
      evidence_source: IN_VITRO
      explanation: POC1B acts as one half of the POC1A-POC1B heterodimer that organises the inner-scaffold
        interaction network; this is the molecular activity lost when POC1B is absent or mislocalised.
