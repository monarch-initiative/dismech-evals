      assertion_type: Genetic
      assertion:
        name: POC1B
        association: Causal biallelic variant
        gene_term:
          preferred_term: POC1B
          term:
            id: hgnc:30836
            label: POC1B
        notes: The recurrent p.Arg106Pro allele was also reported homozygous in a family with Joubert
          syndrome, early-onset severe retinal dystrophy and polycystic kidney disease, which led to POC1B
          being proposed as a Joubert syndrome gene. Long-read genome sequencing later found a homozygous
          deep-intronic CEP290 variant, 1.28 Mb away and co-inherited in cis, that fully explains the
          syndromic features, and the authors withdrew the Joubert attribution. The syndromic presentation
          is therefore not part of this disease. No ClinGen gene-disease validity record was found for
          POC1B.
      selected_evidence:
        snippet: in POC1B, encoding POC1 centriolar protein B, in three siblings with autosomal-recessive
          cone dystrophy or cone-rod dystrophy
