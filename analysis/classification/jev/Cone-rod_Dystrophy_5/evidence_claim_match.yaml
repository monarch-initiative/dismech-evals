            genetic_context:
              variant_origin: GERMLINE
              zygosity: HETEROZYGOUS
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Cone Photoreceptor Dysfunction
        causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
        description: The steps between the variant and loss of cone function are unknown. The authors
          of the defining report propose a role for PITPNM3 in phototransduction by analogy with rdgB.
      selected_evidence:
        snippet: Our finding on the first mutation in the human homologue of Drosophila rdgB indicates
          novel pathways and a potential important role of the PITPNM3 in mammalian phototransduction.
        supports: SUPPORT
        directness: INDIRECT
