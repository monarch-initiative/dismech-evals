        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cord5_mechanism_of_pitpnm3_variant
        kind: KNOWLEDGE_GAP
        prompt: How does heterozygous PITPNM3 p.Gln626His damage cone photoreceptors, and does it act
          by loss of function or dominantly?
        attaches_to:
        - pathophysiology#PITPNM3 PYK2-Binding Region Missense Variant
        - pathophysiology#Cone Photoreceptor Dysfunction
        rationale: The variant sits in the PYK2-interacting C-terminal region, and PITPNM3 lacks the phospholipid
          transfer domain through which rdgB acts in flies, so the fly mechanism does not carry over directly.
          No study has measured PYK2 binding, protein stability or localization of the p.Gln626His protein,
          and the only animal model carries a different allele. Binding assays of the variant protein
          and a p.Gln626His knock-in would distinguish loss of function from a dominant-negative or gain-of-function
          effect.
        proposed_experiments:
        - experiment_id: cord5_q626h_pyk2_binding
          name: PYK2 binding of PITPNM3 p.Gln626His
          description: Compare binding of wild-type and p.Gln626His PITPNM3 C-terminal regions to the
            PYK2 N-terminal domain, with protein stability and subcellular localization of the full-length
            variant in a photoreceptor-derived cell line.
          decision_criterion: Reduced PYK2 binding or reduced stability of the variant protein would support
            a loss-of-interaction mechanism; normal binding and stability would point elsewhere.
          would_support:
          - pathophysiology#PITPNM3 PYK2-Binding Region Missense Variant
        - experiment_id: cord5_q626h_knock_in
          experiment_design: TARGETED_PERTURBATION
          name: Heterozygous Pitpnm3 p.Gln626His knock-in mouse
          description: Generate a knock-in of the CORD5 allele on an rd1-free background and follow heterozygotes
            with photopic and scotopic ERG and retinal histology beyond one year.
          decision_criterion: A cone-selective ERG decline in heterozygotes, with rods spared, would support
            the allele as sufficient for cone dysfunction.
          would_support:
          - pathophysiology#Cone Photoreceptor Dysfunction
      selected_evidence:
        snippet: PITPNM3 has been identified as a crucial gene associated with various phenotypes of retinal
          disease in humans; however, detailed mechanisms through which PITPNM3 mutations result in these
          conditions are not fully understood.
        supports: SUPPORT
