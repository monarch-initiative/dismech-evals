        context: []
      assertion_type: Genetic
      assertion:
        name: CEP78
        association: Causal biallelic variant
        gene_term:
          preferred_term: CEP78
          term:
            id: hgnc:25740
            label: CEP78
        frequency: The gene of CRDHL1; CEP250 accounts for the sibling disorder CRDHL2.
        notes: 'Three points for anyone interpreting a CEP78 result.

          The allelic spectrum is wider than sequencing alone will find. It began as seven truncating
          variants, then added a destabilising missense founder allele, then structural variants - a recurrent
          15 kb partial-gene deletion with a Belgian and British founder haplotype, and a 235 kb whole-gene
          deletion. A negative exome does not exclude the gene.

          Reported case counts are an undercount by construction. CEP78 became a disease gene only in
          September 2016, so a disruptive variant found before then would have been classified as being
          in a gene of uncertain significance and might never have reached the report. One published family
          was solved only when panel testing repeated what a 2015 exome had not returned.

          Misdiagnosis runs in one particular direction. The founding authors and the missense-allele
          authors both note that CEP78 loss-of-function may be under-recognised in patients labelled as
          having Usher syndrome.'
      selected_evidence:
        snippet: A founder haplotype was demonstrated for the latter SV in cases of Belgian and British
          origin, respectively.
        supports: SUPPORT
