        name: PHARC syndrome
        description: Biallelic ABHD12. It shares retinal degeneration with hearing loss, but it adds polyneuropathy,
          ataxia and cataract, and the full pentad is the exception rather than the rule - which is what
          makes it a genuine differential rather than an obviously different disease. Hearing loss is
          most often the presenting symptom in both disorders, and PHARC carries a mean diagnostic delay
          of twenty years, so an incomplete PHARC presenting through the ear is exactly the case that
          could be mistaken for this disorder.
        disease_term:
          preferred_term: PHARC syndrome
          term:
            id: MONDO:0012984
            label: PHARC syndrome
        distinguishing_features:
        - Biallelic ABHD12 rather than CEP78
        - Polyneuropathy, ataxia and cataract in addition to the retinal and auditory features
        - Retinitis pigmentosa rather than a cone-predominant dystrophy
        - A metabolic lipase defect rather than a centriolar one
      selected_evidence:
        snippet: The results showed that hearing loss was the most common initial symptom, with a complete
          syndrome observed in only 31.6% of reported cases.
        supports: SUPPORT
