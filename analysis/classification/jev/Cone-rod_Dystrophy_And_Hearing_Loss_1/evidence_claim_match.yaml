        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Elevated CP110 and Disordered Cilium Assembly
        biological_scale: CELLULAR
        conforms_to: ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction
        description: 'CP110 caps the distal end of the centriole and suppresses ciliogenesis; CEP78 restrains
          it via EDD1. Without CEP78, CP110 rises and ciliogenesis is disordered. The direction of the
          cellular phenotype is worth noting because it is counterintuitive: patient cells grow cilia
          that are too long, not too few, so this is a length-control and assembly defect rather than
          a simple failure to ciliate.'
        biological_processes:
        - preferred_term: cilium assembly
          modifier: DECREASED
          term:
            id: GO:0060271
            label: cilium assembly
        - preferred_term: protein ubiquitination
          term:
            id: GO:0016567
            label: protein ubiquitination
      selected_evidence:
        snippet: Consistently, cells lacking CEP78 display significantly increased cellular and centrosomal
          levels of CP110, and depletion of CP110 in CEP78-deficient cells restored ciliation frequency
          to normal.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34259627
      reference_title: CEP78 functions downstream of CEP350 to control biogenesis of primary cilia by
        negatively regulating CP110 levels.
      evidence_source: IN_VITRO
      explanation: 'The rescue is what makes this causal rather than correlative: removing CP110 in a
        CEP78-null cell restores ciliation.'
