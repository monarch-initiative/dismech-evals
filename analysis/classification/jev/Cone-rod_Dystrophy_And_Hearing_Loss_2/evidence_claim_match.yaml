            description: A knock-in carrying an actual patient allele - the same c.562C>T, p.R188* nonsense
              variant found both in the Japanese cone-rod-dystrophy family and in a consanguineous family
              with non-syndromic retinitis pigmentosa. Among the models curated here it is the one that
