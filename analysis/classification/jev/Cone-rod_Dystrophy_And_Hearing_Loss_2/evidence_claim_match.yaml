      assertion_type: Discussion
      assertion:
        discussion_id: gap_crdhl2_second_locus_attribution
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How much of the retinal phenotype in the family that established CEP250 is attributable
          to CEP250, given that a second ciliary-gene nonsense allele segregated in the same pedigree?
        attaches_to:
        - genetic#CEP250
        - pathophysiology#Progressive Cone-Predominant Photoreceptor Degeneration
        rationale: The discovery family carried nonsense variants in two ciliary genes, CEP250 and C2orf71.
          Individuals homozygous for both had early-onset severe retinitis pigmentosa; individuals homozygous
          for CEP250 with a single mutant C2orf71 allele had only mild retinal degeneration. The authors
          read this as an additive effect. That reading has since been supported indirectly, in that CEP250
          families without a second locus also show mild retinal disease - but the contribution of a heterozygous
          C2orf71 allele to even the mild phenotype has not been separately assessed, and no series has
          been powered to test digenic contribution. The practical consequence is that severe early-onset
          retinal disease should not be quoted as part of the CEP250 phenotype on the strength of that
          pedigree.
      selected_evidence:
        snippet: Our patients with CEP250 variants exhibited nonsense and frameshift variants suggesting
          that this phenotype of mild RP with progressive SNHL may be specific for biallelic CEP250 nonsense
          or frameshift variants that lead to defective proteins in the absence of pathogenic variants
          in other genes.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:34223797
      reference_title: Expanding the clinical phenotype in patients with disease causing variants associated
        with atypical Usher syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: A later series proposing exactly this reading - that mild retinal disease with progressive
        hearing loss is what CEP250 alone produces - stated as a suggestion rather than a demonstration,
        which is why the gap remains open.
