            term:
              id: MONDO:0020780
              label: cone-rod dystrophy and hearing loss 2
        context: []
      assertion_type: Genetic
      assertion:
        name: CEP250
        association: Causal biallelic variant
        gene_term:
          preferred_term: CEP250
          term:
            id: hgnc:1859
            label: CEP250
        notes: 'Two cautions attach to the reported allelic spectrum. First, the original family that
          established the gene segregated a second ciliary-gene allele: the individuals homozygous for
          the CEP250 nonsense variant who also carried a single C2orf71 nonsense allele had mild retinal
          degeneration, while the double homozygotes had early-onset severe retinitis pigmentosa, which
          the authors read as an additive effect. Severe early retinal disease in that family therefore
          should not be attributed to CEP250 alone. Second, the same class of truncating allele has been
          reported with apparently isolated hearing loss and with non-syndromic retinitis pigmentosa,
          so a biallelic truncating genotype does not predict which organ presents.

          A second, independent CEP250-biallelic patient also carried a monoallelic rare variant in another
          Usher gene - a heterozygous USH2A missense change with no second USH2A hit found. Two of the
          small number of reported patients therefore carry an unexplained single allele in a second retinal
          gene, which is why the second-locus question is recorded as an open gap rather than treated
          as settled.'
      selected_evidence:
        snippet: The severe retinal involvement in the double homozygotes indicates an additive effect
          caused by nonsense mutations in genes encoding ciliary proteins.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
