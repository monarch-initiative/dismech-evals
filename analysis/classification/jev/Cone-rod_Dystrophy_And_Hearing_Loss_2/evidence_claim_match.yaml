          region, and a nonsense allele reported in a deafness family produces a protein that no longer
          reaches the centrosome at all.'
        genes:
        - preferred_term: CEP250
          term:
            id: hgnc:1859
            label: CEP250
      selected_evidence:
        snippet: WES of the proband identified compound heterozygous variants c.361C>T, p.R121*, and c.562C>T,
          p.R188* in CEP250. The variants were found to co-segregate with the disease in five members
          of the family.
        supports: SUPPORT
