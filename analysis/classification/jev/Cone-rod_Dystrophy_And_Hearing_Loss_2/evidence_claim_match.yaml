        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Photoreceptor Connecting Cilium Dysfunction
        biological_scale: CELLULAR
        description: The connecting cilium is the only conduit between the photoreceptor inner segment,
          where outer-segment proteins are made, and the outer segment, where they work. Disorders of
          the photoreceptor cilium are a recognised cause of retinal degeneration for this reason. What
          C-Nap1 contributes at that structure is not established in detail; that it is present there
          and interacts with ciliary partners including CEP78 is what links the gene to the retinal phenotype.
        cellular_components:
        - preferred_term: photoreceptor connecting cilium
          term:
            id: GO:0032391
            label: photoreceptor connecting cilium
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        - preferred_term: retinal rod cell
          term:
            id: CL:0000604
            label: retinal rod cell
      selected_evidence:
        snippet: Degeneration of retinal photoreceptors is frequently observed in diverse ciliopathy disorders,
          and photoreceptor cilium gates the molecular trafficking between the inner and the outer segment
          (OS).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
