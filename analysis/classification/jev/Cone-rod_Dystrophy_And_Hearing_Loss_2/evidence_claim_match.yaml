        context:
        - path: /animal_models/3
          value:
            name: Cep250 CRISPR knockout mouse (cochlear morphology line)
            species: Mouse
            genotype: Cep250 homozygous null, generated by CRISPR/Cas9
            publication: DOI:10.21203/rs.3.rs-4515679/v1
            description: A CRISPR-generated Cep250-null line phenotyped specifically for the inner ear,
              with auditory brainstem responses, a swimming test for vestibular function, and hair-cell
              counts by immunofluorescence. It is the model that speaks most directly to what separates
              this disorder from classical Usher syndrome, because it tests hearing and balance in the
              same animals. It is a Research Square preprint and has not been peer reviewed; that is recorded
              here rather than treated as equivalent to the published models.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Cochlear Hair Cell Degeneration
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Homozygous nulls lose cochlear hair cells and lose hearing, with the deficit concentrated
          in the high frequencies, while vestibular function is spared and heterozygotes are unaffected.
        limitations: Preprint, not peer reviewed, so the measurements have not been through external scrutiny.
          The mouse is a complete null while patients carry truncating alleles in a large protein, and
          hearing was assessed only over P30 to P60, which does not test the progressive course seen in
          patients.
        readouts:
        - name: Cochlear hair cell number
          target: Cochlear Hair Cell Degeneration
          direction: DECREASED
          interpretation: Independent confirmation, in a second knockout line, of the hair-cell lesion
            proposed to underlie the human hearing loss.
        - name: Auditory brainstem response threshold by frequency
          target: Cochlear Hair Cell Degeneration
          direction: INCREASED
          interpretation: A raised threshold is reduced hearing sensitivity, so INCREASED here is a hearing
            deficit. The high-frequency predominance matches the sloping loss reported in patients.
      selected_evidence:
        snippet: Heterozygous mice show no significant changes in hearing, indicating that a single allele
          mutation in Cep250 is insufficient to affect normal Cep250 expression levels.
        supports: SUPPORT
