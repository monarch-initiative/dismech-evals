              where outer-segment proteins are made, and the outer segment, where they work. Disorders
              of the photoreceptor cilium are a recognised cause of retinal degeneration for this reason.
              What C-Nap1 contributes at that structure is not established in detail; that it is present
              there and interacts with ciliary partners including CEP78 is what links the gene to the
              retinal phenotype.
