        relationship: RECAPITULATES
        fidelity: MODERATE
        description: Homozygous knock-in mice show significantly reduced retinal thickness and reduced
          electroretinographic responses.
        limitations: The retinal impairment is described as severe, whereas the human phenotype associated
          with this same allele is mild, so the model overstates severity. It was made to characterise
          a non-syndromic retinitis pigmentosa presentation and its hearing was not reported, so it says
          nothing about the auditory branch.
        readouts:
        - name: Retinal thickness and electroretinogram response
          target: Progressive Cone-Predominant Photoreceptor Degeneration
          direction: DECREASED
          interpretation: Structural and functional confirmation that a patient truncating allele is sufficient
            to cause photoreceptor disease.
      selected_evidence:
        snippet: Remarkably, the disruption of Cep250 resulted in severe impairment of retinal function
          and significant retinal morphological alterations.
        supports: SUPPORT
