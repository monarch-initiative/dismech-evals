              label: cone-rod dystrophy and hearing loss 2
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Usher syndrome
        description: The disorder this one is repeatedly compared with, and the reason the literature
          calls it atypical Usher syndrome. Usher syndrome is caused by disruption of the Usher protein
          interactome, which organises the stereocilia hair bundle and the photoreceptor periciliary region;
          C-Nap1 is not part of that network. Clinically, Usher types 1 and 2 have congenital hearing
          loss and rod-first retinitis pigmentosa, with vestibular areflexia in type 1.
        disease_term:
          preferred_term: Usher syndrome
          term:
            id: MONDO:0019501
            label: Usher syndrome
        distinguishing_features:
        - Postlingual progressive hearing loss rather than congenital deafness
        - Cone-predominant retinal dystrophy rather than rod-cone retinitis pigmentosa
        - Vestibular function spared
        - Centriolar cohesion protein rather than a component of the Usher interactome
      selected_evidence:
        snippet: Classically, Usher syndrome is characterized by the association of sensorineural hearing
          loss (SNHL), retinitis pigmentosa (RP) and possible vestibular dysfunction. Pathogenic bi-allelic
          variants in CEP250 cause atypical autosomal recessive Usher syndrome, which is associated with
          SNHL and photoreceptors dysfunction without vestibular signs.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
