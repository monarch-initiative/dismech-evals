        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of C-Nap1 from the Centriole
        biological_scale: MOLECULAR
        description: C-Nap1 docks at the proximal ends of both parent centrioles and anchors the rootletin
          fibres that hold them together; NEK2 phosphorylation of C-Nap1 is what releases that linkage
          at mitosis. Losing the protein from the centriole therefore removes the anchor for centriole-centriole
          cohesion. Because the mother centriole is also the basal body from which a primary cilium is
          built, the same lesion is felt at the ciliary base.
        cellular_components:
        - preferred_term: centriole
          term:
            id: GO:0005814
            label: centriole
        biological_processes:
        - preferred_term: centriole-centriole cohesion
          modifier: DECREASED
          term:
            id: GO:0010457
            label: centriole-centriole cohesion
      selected_evidence:
        snippet: C-Nap1 is expressed in photoreceptor cilia and interacts with other ciliary proteins,
          including Rootletin and NEK2 [9].
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37759551
      reference_title: Novel Variant in CEP250 Causes Protein Mislocalization and Leads to Nonsyndromic
        Autosomal Recessive Type of Progressive Hearing Loss.
      evidence_source: OTHER
      explanation: Establishes the protein's ciliary localisation and its rootletin and NEK2 partners,
        the components of the centriole linker.
