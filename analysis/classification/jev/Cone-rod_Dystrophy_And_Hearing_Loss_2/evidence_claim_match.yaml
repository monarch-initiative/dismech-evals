              label: cone-rod dystrophy and hearing loss 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_crdhl2_organ_selectivity_and_presentation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does loss of a ubiquitously expressed centriole-linker protein produce disease confined
          to photoreceptors and cochlear hair cells, and what decides whether a given patient presents
          through the eye, through the ear, or with only one of the two?
        attaches_to:
        - pathophysiology#Loss of C-Nap1 from the Centriole
        - pathophysiology#Photoreceptor Connecting Cilium Dysfunction
        - genetic#CEP250
        rationale: C-Nap1 is a general centrosomal protein and centriole cohesion is a general cell-cycle
          process, yet the disease is restricted to two post-mitotic sensory cell types. The obvious hypothesis
          is the ciliary one - the mother centriole is the basal body of the photoreceptor connecting
          cilium and C-Nap1 is expressed there - but what C-Nap1 does at that structure has not been established,
          and it does not by itself explain the hair cell. The variability is at least as unexplained.
          Reported patients with the same class of truncating allele have had a cone-rod dystrophy with
          hearing loss, apparently isolated hearing loss with a normal retina, or apparently non-syndromic
          retinitis pigmentosa. In the largest series the dual-sensory presentation was the majority but
          not the whole of it - five of seven patients - and the largest series raised the possibility
          that loss- and gain-of-function effects coexist, which it noted would complicate gene therapy.
          Nothing currently predicts which presentation a genotype will produce.
      selected_evidence:
        snippet: The coexistence of loss- and gain-of-function effects may exist, complicating the development
          of gene therapy.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39610034
      reference_title: The phenotypic spectrum of CEP250 gene variants.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' statement that the variant mechanism itself is unresolved, and its therapeutic
