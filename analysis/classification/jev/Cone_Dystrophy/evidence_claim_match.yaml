        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cone CNG Channel Loss of Function
        description: A distinct recessive arm that does not raise cGMP. CNGA3 and CNGB3 encode the cone
          cyclic nucleotide-gated channel, which reads the cGMP signal rather than degrading it. Biallelic
          loss removes the dark current, leaving cones chronically hyperpolarised with low rather than
          elevated outer-segment calcium, and abolishing cone signalling. Because the channel is the route
          by which cGMP elevation becomes calcium influx, its loss is also partially protective against
          the calcium-driven death pathway - which is why this arm is modelled separately from the cGMP
          node rather than feeding it.
        cell_types:
        - preferred_term: retinal cone cell
          term:
            id: CL:0000573
            label: retinal cone cell
        biological_processes:
        - preferred_term: phototransduction
          modifier: DECREASED
          term:
            id: GO:0007602
            label: phototransduction
      selected_evidence:
        snippet: rd1*Cngb1-/- double-mutant mice, which lack the beta subunit of the rod cyclic nucleotide-gated
          (CNG) channel and are partially protected from rd1 degeneration
        supports: SUPPORT
    origin:
