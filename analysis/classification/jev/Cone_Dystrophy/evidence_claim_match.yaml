  9fe0d82406dd6a30860a163d113ee4473b78a6bb665f5986fbc93211455bb2e4:
    claim:
      about:
        disease:
          name: Cone Dystrophy
          disease_term:
            preferred_term: cone dystrophy
            term:
              id: MONDO:0000455
              label: cone dystrophy
        context:
        - path: /pathophysiology/2
          value:
            name: Cone CNG Channel Loss of Function
            description: A distinct recessive arm that does not raise cGMP. CNGA3 and CNGB3 encode the
              cone cyclic nucleotide-gated channel, which reads the cGMP signal rather than degrading
              it. Biallelic loss removes the dark current, leaving cones chronically hyperpolarised with
              low rather than elevated outer-segment calcium, and abolishing cone signalling. Because
              the channel is the route by which cGMP elevation becomes calcium influx, its loss is also
              partially protective against the calcium-driven death pathway - which is why this arm is
              modelled separately from the cGMP node rather than feeding it.
            cell_types:
            - preferred_term: retinal cone cell
              term:
                id: CL:0000573
                label: retinal cone cell
            biological_processes:
            - preferred_term: phototransduction
              modifier: DECREASED
              term:
                id: GO:0007602
                label: phototransduction
          role: ancestor
