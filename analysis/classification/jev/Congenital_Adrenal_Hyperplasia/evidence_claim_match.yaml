      assertion:
        name: STAR pathogenic variants
        gene_term:
          preferred_term: STAR
          term:
            id: hgnc:11359
            label: STAR
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: Lipoid CAH
        features: STAR variants cause lipoid congenital adrenal hyperplasia by impairing cholesterol delivery
          for steroidogenesis.
        notes: 'STAR is the one gene in this entry that encodes neither an enzyme nor an enzyme''s electron
          donor: the steroidogenic acute regulatory protein delivers cholesterol to the inner mitochondrial
          membrane, so its loss starves the first committed step rather than blocking a later one. That
          places the defect above every enzymatic block modelled here and explains the near-complete loss
          of adrenal and gonadal steroid output and the cholesterol ester accumulation that gives the
          lipoid form its name. A minority of clinically lipoid CAH is due to CYP11A1 rather than STAR;
          MONDO has no congenital-adrenal-hyperplasia child term for the CYP11A1 form (its only CYP11A1
          CAH classes are non-human-animal ones), so no subtype row is recorded for it here.'
      selected_evidence:
        snippet: The classical form usually occurs with loss-of-function in the StAR gene
        supports: SUPPORT
