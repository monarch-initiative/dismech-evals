  f19ff7919079702232798d273edf175f2d028a3778a038641bcebda35fd03184:
    claim:
      about:
        disease:
          name: Congenital Adrenal Hyperplasia
          disease_term:
            preferred_term: congenital adrenal hyperplasia
            term:
              id: MONDO:0018479
              label: congenital adrenal hyperplasia
        context: []
      assertion_type: Subtype
      assertion:
        name: POR-D
        display_name: P450 oxidoreductase deficiency
        description: 'CAH caused by POR deficiency. Mechanistically it is the odd one out of this family:
          POR is not a steroidogenic enzyme but the NADPH-dependent electron donor that every endoplasmic-reticulum
          cytochrome P450 requires, so a single lesion partially disables CYP17A1 and CYP21A2 together
          and produces a combined rather than a single-step block. The same dependency explains the features
          no other CAH subtype has: impaired aromatase (CYP19A1) activity can virilize the mother during
          pregnancy, skeletal malformation overlapping Antley-Bixler syndrome occurs, and hepatic drug
          metabolism is affected.'
        subtype_term:
          preferred_term: congenital adrenal hyperplasia due to cytochrome P450 oxidoreductase deficiency
          term:
            id: MONDO:0013310
            label: congenital adrenal hyperplasia due to cytochrome P450 oxidoreductase deficiency
        genes:
        - preferred_term: POR
          term:
            id: hgnc:9208
            label: POR
      selected_evidence:
        snippet: Less frequent types of CAH are 11β-hydroxylase deficiency (CYP11B1-D, up to 8% cases),
          17α-hydroxylase/17–20 lyase deficiency (CYP17A1-D), 3β-hydroxysteroid dehydrogenase deficiency
          (HDS3B2-D), P450 oxidoreductase deficiency (POR-D), P450 cytochrome side-chain cleavage deficiency
          (CYP11A1-D), and StAR deficiency (StAR-D).
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/8
      evidence_path: /has_subtypes/8/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:33415088
      reference_title: Congenital Adrenal Hyperplasias Presenting in the Newborn and Young Infant.
      evidence_source: HUMAN_CLINICAL
      explanation: Names POR deficiency in this review's enumeration of the less frequent types of congenital
        adrenal hyperplasia. The source's typo in the 3-beta symbol (HDS3B2-D) is preserved because the
        snippet must be exact.
