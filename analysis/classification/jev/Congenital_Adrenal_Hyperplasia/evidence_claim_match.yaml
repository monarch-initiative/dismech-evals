    claim:
      about:
        disease:
          name: Congenital Adrenal Hyperplasia
          disease_term:
            preferred_term: congenital adrenal hyperplasia
            term:
              id: MONDO:0018479
              label: congenital adrenal hyperplasia
        context:
        - path: /has_subtypes/8
          value:
            name: POR-D
            display_name: P450 oxidoreductase deficiency
            description: 'CAH caused by POR deficiency. Mechanistically it is the odd one out of this
              family: POR is not a steroidogenic enzyme but the NADPH-dependent electron donor that every
              endoplasmic-reticulum cytochrome P450 requires, so a single lesion partially disables CYP17A1
              and CYP21A2 together and produces a combined rather than a single-step block. The same dependency
              explains the features no other CAH subtype has: impaired aromatase (CYP19A1) activity can
              virilize the mother during pregnancy, skeletal malformation overlapping Antley-Bixler syndrome
              occurs, and hepatic drug metabolism is affected.'
            subtype_term:
              preferred_term: congenital adrenal hyperplasia due to cytochrome P450 oxidoreductase deficiency
              term:
                id: MONDO:0013310
                label: congenital adrenal hyperplasia due to cytochrome P450 oxidoreductase deficiency
            genes:
            - preferred_term: POR
              term:
                id: hgnc:9208
                label: POR
          role: subtype
      assertion_type: Genetic
      assertion:
        name: POR pathogenic variants
        gene_term:
          preferred_term: POR
          term:
            id: hgnc:9208
            label: POR
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: POR-D
        features: POR variants cause P450 oxidoreductase deficiency, a combined form of CAH.
        notes: POR encodes the NADPH-dependent electron donor shared by the endoplasmic-reticulum cytochrome
          P450 enzymes, so its loss partially disables several steroidogenic steps at once rather than
          one. Within this entry that makes POR the only gene whose lesion reaches more than one enzymatic
          node, which is how it is wired in the pathograph. Complete null alleles appear not to be compatible
          with life.
      selected_evidence:
        snippet: POR-D was first described in 2004 (59) as a rare form of CAH.
        supports: SUPPORT
