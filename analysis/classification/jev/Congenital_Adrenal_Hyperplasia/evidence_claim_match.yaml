          by the glucocorticoid, mineralocorticoid and sex-steroid branches, so unlike the 21- and 11-beta-hydroxylase
          blocks this one impairs gonadal as well as adrenal steroidogenesis. The placental isozyme HSD3B1
          is a different gene and is not implicated.
