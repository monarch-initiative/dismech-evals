            description: Classic CYP21A2-related CAH with severe 21-hydroxylase deficiency; includes salt-wasting
              and simple-virilizing clinical forms.
            subtype_term:
              preferred_term: classic congenital adrenal hyperplasia due to 21-hydroxylase deficiency
              term:
                id: MONDO:0008728
                label: classic congenital adrenal hyperplasia due to 21-hydroxylase deficiency
            genes:
            - preferred_term: CYP21A2
              term:
                id: hgnc:2600
                label: CYP21A2
          role: subtype
      assertion_type: Genetic
      assertion:
        name: CYP21A2 pathogenic variants
        gene_term:
          preferred_term: CYP21A2
          term:
            id: hgnc:2600
            label: CYP21A2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: Classic 21-OHD
        features: CYP21A2 variants cause 21-hydroxylase deficiency, producing the dominant CAH subtype
          and a phenotype spectrum from classic salt-wasting disease to nonclassic hyperandrogenism.
        notes: 'The lesion type here is unlike the rest of this entry''s genes. CYP21A2 sits in the RCCX
          copy-number-variable module of the MHC class III region beside an inactive, highly homologous
          pseudogene, CYP21A1P. Most disease alleles are therefore not independent new mutations but transfers
          of the pseudogene''s own deleterious variants into the functional gene: the cited review attributes
          over 95% of deleterious 21OHD alleles to intergenic recombination, of which microconversions
          from the pseudogene are 70% to 75% and non-uniform meiotic crossing-over - which produces CYP21A1P/CYP21A2
          chimeric genes and a 30-kb deletion - is 20% to 25%. Only 5% to 10% of small pathogenic variants
          arise outside these recombination events.

          Two practical consequences follow and are the reason this is recorded rather than left implicit.
          First, a small recurrent set of pathogenic variants is seen in every population, because they
          are the pseudogene''s variants rather than population-specific founder alleles. Second, the
          homology defeats ordinary sequencing: the review states that next-generation sequencing is not
          yet recommended for CYP21A2 genotyping because it can call pseudogene variants as gene variants,
          and that MLPA plus selective long-range amplification is the recommended approach.'
      selected_evidence:
        snippet: 21OHD is due to an insufficiency of 21-hydroxylase enzyme, which is encoded by the CYP21A2
          gene and involved in cortisol and aldosterone production.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
