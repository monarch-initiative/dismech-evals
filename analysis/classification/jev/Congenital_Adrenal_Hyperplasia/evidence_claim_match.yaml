          usual one and the reason the node is named after the gene, and loss of electron supply from
          POR, which reduces the same enzyme''s catalysis without any CYP21A2 variant. The node name is
          kept because `kb/node_classes/pathograph_node_classes.txt` cites it as a worked example.'
