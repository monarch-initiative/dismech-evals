              label: congenital amegakaryocytic thrombocytopenia 1
        context: []
      assertion_type: Treatment
      assertion:
        name: Thrombopoietin Receptor Agonists (investigational)
        description: Not an established treatment. Null MPL alleles leave no receptor for these drugs
          to act on. In cell models, some missense receptors respond to an agonist that binds the transmembrane
          domain (the eltrombopag class) but not to thrombopoietin or to agonists that bind the extracellular
          domain, and the R464G receptor responded to eltrombopag only when mutant calreticulin was co-expressed.
          No clinical efficacy data in CAMT1 are available, and a pediatric review lists CAMT as a question
          for future study.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: eltrombopag
            term:
              id: CHEBI:85010
              label: eltrombopag
      selected_evidence:
        snippet: These findings suggest that a small subset of patients with congenital amegakaryocytic
          thrombocytopenia might respond to treatment with thrombopoietin receptor agonists, but that
          responsiveness will depend on the type of mutation and agonist used.
        supports: SUPPORT
        directness: INDIRECT
