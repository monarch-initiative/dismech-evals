        description: Cholesterol synthesis and apolipoprotein B-containing lipoprotein output rise, producing
          marked hypercholesterolemia with raised LDL cholesterol and apolipoprotein B; HDL cholesterol
          and triglycerides are usually normal in adults. The hypercholesterolemia is generally read as
          part of the compensation, with lipoproteins contributing oncotic pressure and taking over some
          fatty acid transport, and it falls transiently when albumin is infused. In the Nagase analbuminemic
          rat, hepatic HMG-CoA reductase activity is increased. The phenotype resembles the lipid response
          to albumin loss in nephrotic syndrome.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: The severe hypercholesterolemia may be the result of a compensatory mechanism for the
          lack of ALB and provides evidence for the possible role of ALB in controlling lipoprotein metabolism
          (Crook, 2016).
        supports: SUPPORT
