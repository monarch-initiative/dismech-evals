        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Plasma Oncotic Pressure
        description: Without albumin, colloid osmotic pressure falls. Edema is milder than this would
          predict, because the rise in other plasma proteins partly restores oncotic pressure, the hydrostatic
          gradient from capillary to interstitium falls, and capillary protein permeability falls. Lower
          blood pressure is part of this adaptation. The fall is still enough to cause mild edema in adults,
          edema and fluid retention in infants, and it is the proposed basis of oligohydramnios and placental
          abnormalities before birth.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: The unique occurrence helps confirm earlier reports that albumin is not the exclusive
          factor responsible for maintaining colloid oncotic pressure.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
