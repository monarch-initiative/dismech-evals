        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic ALB Loss of Function
        description: 'More than 27 ALB loss-of-function variants are known, nearly all private to one
          family: splice-site variants, nonsense variants, frameshift deletions and insertions, and one
          start-codon variant. Each truncates or prevents translation of preproalbumin. Truncated products
          lacking the signal and propeptide are thought to be misrouted and degraded inside the hepatocyte,
          and some transcripts are probably removed by nonsense-mediated decay. One frameshift deletion,
          Kayseri (c.228_229del), accounts for about a third of known cases, which suggests a founder
          effect.'
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: fatty acid binding
          term:
            id: GO:0005504
            label: fatty acid binding
          modifier: LOSS_OF_FUNCTION
        genes:
        - preferred_term: ALB
          term:
            id: hgnc:399
            label: ALB
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        genetic_context:
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          gene:
            preferred_term: ALB
            term:
              id: hgnc:399
              label: ALB
          description: Usually homozygous, often in consanguineous families; compound heterozygosity is
            also reported.
      selected_evidence:
        snippet: Most are unique, peculiar for each affected family, but one, a frame-shift deletion called
          Kayseri, has been found to cause about one third of the known cases allowing to presume a founder
          effect.
        supports: SUPPORT
