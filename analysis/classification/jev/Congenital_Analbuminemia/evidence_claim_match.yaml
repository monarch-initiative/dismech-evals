  f71611a82a3fd2e76a829f51eca1a2caf60a7c39081d55f1ee7e6c0eba1e650b:
    claim:
      about:
        disease:
          name: Congenital Analbuminemia
          disease_term:
            preferred_term: congenital analbuminemia
            term:
              id: MONDO:0014449
              label: congenital analbuminemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Plasma Oncotic Pressure
        description: Without albumin, colloid osmotic pressure falls. Edema is milder than this would
          predict, because the rise in other plasma proteins partly restores oncotic pressure, the hydrostatic
          gradient from capillary to interstitium falls, and capillary protein permeability falls. Lower
          blood pressure is part of this adaptation. The fall is still enough to cause mild edema in adults,
          edema and fluid retention in infants, and it is the proposed basis of oligohydramnios and placental
          abnormalities before birth.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: Systemic and pronounced oedema is not seen, because oedema-preventive mechanisms are
          operative such as mitigation of the effect on the oncotic gradient and lowering of the hydrostatic
          blood pressure gradient from the capillaries to the interstitial fluids as well as a decrease
          in the capillary permeability of proteins (Koot et al., 2004).
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
