      assertion_type: Diagnosis
      assertion:
        name: Serum protein electrophoresis and ALB sequencing
        description: Serum protein electrophoresis shows absent or near-absent albumin with increased
          globulin fractions. Because renal or intestinal protein loss and liver disease can also leave
          albumin very low, sequencing of ALB is needed to confirm the diagnosis. The disorder should
          be suspected when albumin is very low with no renal or gastrointestinal albumin loss (for example,
          no proteinuria) and no liver disease. In children it is often misdiagnosed as protein-losing
          enteropathy or nephrotic syndrome.
      selected_evidence:
        snippet: CAA should be suspected in the presence of a low or undetectable plasma albumin concentration
          in the absence of renal or gastrointestinal albumin loss or hepatic disease.
        supports: SUPPORT
