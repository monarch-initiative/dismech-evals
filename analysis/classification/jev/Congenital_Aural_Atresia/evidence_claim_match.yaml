              label: aural atresia, congenital
        context: []
      assertion_type: Prevalence
      assertion:
        population: Published TSHZ1 point-mutation families
        measure_type: CASES_IN_LITERATURE
        notes: Four affected individuals and one unaffected carrier in two families with TSHZ1 point mutations,
          found by sequencing 11 people with isolated bilateral CAA type IIA; two further families carried
          18q22.3 microdeletions spanning TSHZ1. Congenital aural atresia of any cause occurs in roughly
          1 in 10,000 live births, but that figure is not a prevalence for this gene-defined disease.
      selected_evidence:
        snippet: In total, four individuals and one unaffected relative showed heterozygous loss-of-function
          mutations, including a sporadic affected person (individual 5), his unaffected mother, and a
          family with three affected individuals consisting of a mother and her two daughters (individuals
          6–8) (Table 1).
        supports: SUPPORT
    origin:
