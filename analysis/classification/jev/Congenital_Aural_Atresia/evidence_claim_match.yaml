        name: Autosomal dominant with reduced penetrance
        description: Heterozygous TSHZ1 loss-of-function alleles segregate dominantly, but an unaffected
          carrier mother transmitted the nonsense allele p.Trp241X to an affected son, so penetrance is
          incomplete. In 18q deletion carriers, aural atresia is reported in 26% of any 18q deletion and
          up to 78% of deletions covering the critical region including TSHZ1; those figures describe
          deletion carriers, not point-mutation penetrance.
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: As expected, this mutation showed an autosomal-dominant segregation pattern.
        supports: SUPPORT
