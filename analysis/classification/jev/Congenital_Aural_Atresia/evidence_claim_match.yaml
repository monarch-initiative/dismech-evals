        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The minimal region of deletion overlap (72.9-73.4 Mb) contained only one known gene,
          TSHZ1, which was recently shown to be important for murine middle-ear development.
        supports: SUPPORT
