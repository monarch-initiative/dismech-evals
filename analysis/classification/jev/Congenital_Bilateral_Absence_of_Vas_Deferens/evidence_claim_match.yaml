  1b0422ed1961c17bcc206bba200452348aefdb42278e8bfcf14571cfa503f001:
    claim:
      about:
        disease:
          name: Congenital Bilateral Absence of Vas Deferens
          disease_term:
            preferred_term: congenital bilateral absence of vas deferens
            term:
              id: MONDO:0018801
              label: congenital bilateral absence of vas deferens
        context: []
      assertion_type: Genetic
      assertion:
        name: CFTR
        gene_term:
          preferred_term: CFTR
          term:
            id: hgnc:1884
            label: CFTR
        relationship_type: CAUSATIVE
        notes: 'The dominant cause, and the allele class that defines it is the intronic poly-T tract.
          The 5T variant - written IVS8-5T in the older numbering and IVS9-5T in the newer - reduces exon-skipping
          fidelity and so lowers the amount of full-length CFTR transcript without abolishing it. That
          is the unnamed "mild allele" in the compound-heterozygous configuration this entry describes,
          and in a Chinese CBAVD series it was the only recurrent variant: no other CFTR hotspot appeared,
          and no ADGRG2 variants were found at all.


          p.Arg117His is the other allele worth naming, and it carries a counselling problem rather than
          a mechanistic one. It is usually in cis with the benign T7 tract, its overall phenotype is mild,
          and sweat chloride does not track severity - so a man ascertained through CBAVD cannot be reassured
          or alarmed on the basis of a sweat test. What matters is his partner''s genotype: in the French
          series five couples at risk of a child with cystic fibrosis were identified this way.


          Practically, this allele spectrum is why panel testing under-serves this disease. Standard panels
          are built around cystic-fibrosis-causing variants, and the alleles that cause isolated CBAVD
          are disproportionately the mild, intronic and rearrangement ones those panels do not carry.'
      selected_evidence:
        snippet: Some mutations in the gene encoding cystic fibrosis transmembrane conductance regulator
          (CFTR) can lead to CBAVD as a monosymptomatic form of CF.
        supports: SUPPORT
