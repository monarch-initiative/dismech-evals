            term:
              id: MONDO:0018801
              label: congenital bilateral absence of vas deferens
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Luminal Fluid and Anion Secretion
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
        description: CFTR in the apical membrane of genital tract epithelium drives anion and therefore
          water movement into the lumen. With reduced conductance the luminal secretion becomes scanty
          and viscous. Fluid secretion is required for normal mesonephric duct development, so this is
          the step at which an ion-transport defect becomes a developmental one.
        biological_processes:
        - preferred_term: chloride transmembrane transport
          modifier: DECREASED
          term:
            id: GO:1902476
            label: chloride transmembrane transport
        cell_types:
        - preferred_term: epididymal epithelial cell
          term:
            id: CL:0000068
            label: duct epithelial cell
        locations:
        - preferred_term: mesonephric duct
          term:
            id: UBERON:0003074
            label: mesonephric duct
        notes: 'Checked CL for a term anatomically scoped to the mesonephric/Wolffian duct epithelium
          (mesonephric duct, efferent duct, and epididymal duct epithelial cells) - none exists. CL has
          organ-specific duct epithelial cells for kidney collecting duct, prostatic duct, and lactiferous
          duct, but nothing for the male excurrent ducts, so the generic "duct epithelial cell" (CL:0000068)
          is bound rather than reaching for a wrong-organ match. That is the most specific accurate term
          available: the mesonephric duct epithelium is a duct epithelium, so this is not a case where
          a broader binding is safer.'
      selected_evidence:
        snippet: It has also been demonstrated that fluid secretion is necessary for the normal development
          of the mesonephric duct
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
