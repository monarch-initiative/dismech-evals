        snippet: The CF group also demonstrated a significantly higher rate of rescue testicular sperm
          extraction (70.0% vs 27.6%, P < 0.03) and lower fertilization rate with ICSI (32.5% vs 68.9%,
          P < 0.01).
        supports: SUPPORT
