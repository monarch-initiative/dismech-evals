      assertion_type: Subtype
      assertion:
        name: CFTR-related
        display_name: CFTR-related CBAVD
        description: The large majority. Patients carry CFTR variants - usually one severe and one mild
          allele in compound heterozygosity - whose combined residual function is above the threshold
          for pulmonary and pancreatic disease but below what the mesonephric duct derivatives require.
          Reported CFTR-positive rates vary with ascertainment and testing depth, and are consistently
          lower in men who also have a solitary kidney.
        subtype_term:
          preferred_term: congenital bilateral aplasia of vas deferens from CFTR mutation
          term:
            id: MONDO:0010178
            label: congenital bilateral aplasia of vas deferens from CFTR mutation
        genes:
        - preferred_term: CFTR
          term:
            id: hgnc:1884
            label: CFTR
      selected_evidence:
        snippet: 60-70% of patients with CBAVD carry pathogenic CFTR mutations (Online Mendelian Inheritance
          in Man no. 602421), usually one severe and one mild, in compound heterozygosity
        supports: SUPPORT
