            loss of the vas deferens with an underdeveloped epididymis - in the gene that accounts for
            most human cases.
          limitations: The rat shows more pronounced hypospermatogenesis than men with CBAVD do, so the
            model overstates the testicular component of a condition that is otherwise obstructive with
            preserved spermatogenesis. The cited source is a comparative review rather than the primary
            description of the model.
          readouts:
