      assertion_type: Pathophysiology
      assertion:
        name: Loss of ADGRG2 Signalling in Efferent Ducts
        genes:
        - preferred_term: ADGRG2
          term:
            id: hgnc:4516
            label: ADGRG2
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: The alternative entry point. ADGRG2 is an adhesion GPCR expressed specifically in
          the epididymis and efferent ducts, where it is required for fluid reabsorption. Hemizygous truncating
          variants abolish it. That a receptor governing duct fluid handling and a channel governing duct
          fluid secretion both produce the same anatomical endpoint is the strongest argument that luminal
          fluid balance, rather than any one gene product, is what the mesonephric duct derivatives depend
          on.
        genetic_context:
          gene:
            preferred_term: ADGRG2
            term:
              id: hgnc:4516
              label: ADGRG2
          functional_impact_category: LOSS_OF_FUNCTION
        locations:
