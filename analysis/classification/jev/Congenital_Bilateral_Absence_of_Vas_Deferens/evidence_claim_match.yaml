      assertion_type: Treatment
      assertion:
        name: Surgical Sperm Retrieval with ICSI
        therapeutic_modality: SURGERY
        description: 'The definitive management, and it works because the lesion is obstructive. Sperm
          are recovered from the epididymis or testis and used for intracytoplasmic sperm injection. Outcomes
          in isolated CBAVD are notably better than in men with full cystic fibrosis: in a two-centre
          comparison the CF group had lower retrieved sperm concentration and motile count, needed rescue
          testicular extraction far more often, and had roughly half the fertilisation rate. That gradient
          is evidence that CFTR affects sperm function itself and not only the conduit - which qualifies
          the tidy "obstruction only" account this entry otherwise gives.'
        treatment_term:
          preferred_term: sperm retrieval
          term:
            id: NCIT:C94427
            label: Sperm Retrieval
