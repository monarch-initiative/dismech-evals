      assertion_type: Genetic
      assertion:
        name: ADGRG2
        gene_term:
          preferred_term: ADGRG2
          term:
            id: hgnc:4516
            label: ADGRG2
        relationship_type: CAUSATIVE
        notes: 'X-linked, about 2% of cases, and confined to CFTR-negative men. Worth testing for precisely
          because the inheritance differs: an ADGRG2 diagnosis changes the counselling from partner CFTR
          screening to X-linked recurrence in the extended family. Penetrance is not complete. A nonsense
          variant, p.Ser303*, was found in an X-linked azoospermia pedigree and also in a male relative
          with normal reproductive capability, and genital phenotypes among carriers ranged from normal
          to dilated vas deferens, spermatic veins and epididymis. So an ADGRG2 diagnosis predicts recurrence
          risk in the family without predicting the phenotype of any given carrier.'
      selected_evidence:
        snippet: Approximately 2% of the cases of CAVD are hemizygous for a loss-of-function mutation
          in the ADGRG2 gene
        supports: SUPPORT
