      assertion_type: ProgressionInfo
      assertion:
        phase: Fetal and early postnatal
        notes: 'The window in which the disease happens. The duct forms, is obstructed and degraded by
          mucus by 12-18 weeks, and the process worsens as gestation proceeds and probably continues after
          birth. After that it is static: there is no adult progression, and the clinical course is a
          fixed obstructive azoospermia. The therapeutic corollary is in the prenatal CFTR modulator entry
          - restoration during this window preserved the duct in one reported case, while postnatal modulators
          do not restore fertility.'
      selected_evidence:
        snippet: unlike CAVDs related to CFTR or ADGRG2 mutations, which might be the result of progressive
          degeneration that begins later in fetal life and probably continues after birth
        supports: SUPPORT
