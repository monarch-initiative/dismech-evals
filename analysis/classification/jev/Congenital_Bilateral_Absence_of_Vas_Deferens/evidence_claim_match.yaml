  cdd1e7dec820e7bf311be92151aefc6eede234f0265d5eb712d0f2f157c9d291:
    claim:
      about:
        disease:
          name: Congenital Bilateral Absence of Vas Deferens
          disease_term:
            preferred_term: congenital bilateral absence of vas deferens
            term:
              id: MONDO:0018801
              label: congenital bilateral absence of vas deferens
        context: []
      assertion_type: Treatment
      assertion:
        name: Prenatal CFTR Modulator Therapy
        therapeutic_modality: SMALL_MOLECULE
        description: 'The one intervention that appears to reach the mechanism rather than bypass it,
          and it is a single case. A male fetus with cystic fibrosis whose heterozygous carrier mother
          began elexacaftor/tezacaftor/ivacaftor at 27+4 weeks had bilateral vasa deferentia demonstrable
          on ultrasound at 8 weeks of age - a structure absent in nearly all males with cystic fibrosis
          at birth.


          The timing is what makes it mechanistically informative rather than merely encouraging. Men
          already born and taking modulators show no improvement in infertility. A structure that can
          be preserved at 27 weeks and not recovered afterwards is a structure that is being lost during
          gestation, which is independent evidence for the progressive-involution model this entry is
          built on and against fixed early agenesis.


          n=1, uncontrolled, and the ethical position for a heterozygous fetus - who would not develop
          the disease - is unresolved. Recorded because of what it establishes about the mechanism, not
          as a management recommendation.'
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
      selected_evidence:
        snippet: These findings suggest that prenatal CFTR modulation - even when initiated late in gestation
          - may alter the trajectory of CF-related organ manifestations, including male reproductive development.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
