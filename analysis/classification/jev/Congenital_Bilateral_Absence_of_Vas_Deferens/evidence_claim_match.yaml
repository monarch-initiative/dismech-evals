      assertion:
        name: Adgrg2 (He6/Gpr64) knockout mouse (efferent duct fluid dysregulation)
        species: Mouse
        genotype: He6 (Adgrg2/Gpr64) hemizygous null (7TM-domain deletion)
        publication: PMID:15367682
        description: The original functional evidence for this receptor in male fertility, predating the
          human ADGRG2-CBAVD discovery (PMID:27476656) by twelve years. Hemizygous knockout males develop
          age-dependent infertility from dysregulated fluid reabsorption in the efferent ductules, causing
          dilation and spermatozoal obstruction there and a backup of fluid into the testis - the same
          tissue-restricted, duct-fluid-handling mechanism this entry attributes to human ADGRG2 loss.
        modeled_mechanisms:
        - target: Progressive Involution of Mesonephric Duct Derivatives
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: 'An isolated fluid-reabsorption defect in the efferent ductules causing duct dilation,
            spermatozoal obstruction, and testicular fluid backup - the same class of duct-fluid-handling
            failure this entry attributes to human ADGRG2 loss, from the mouse ortholog of the same receptor.
            Partial rather than full recapitulation: the lesion sits in a different duct segment and the
            duct is not lost.'
          limitations: This is a constitutive knockout of the murine ortholog (then named He6/Gpr64),
            not a model of any specific human truncating ADGRG2 allele, and the reported pathology centers
            on efferent-ductule dilation and testicular fluid backup rather than the progressive vas deferens/epididymis
            involution described in human CBAVD.
          readouts:
          - name: Efferent ductule dilation and luminal obstruction by spermatozoa
            target: Progressive Involution of Mesonephric Duct Derivatives
            direction: INCREASED
            interpretation: Structural correlate of the fluid-reabsorption defect, and the proximate cause
              of the infertility in this model.
          - name: Testicular fluid accumulation and rete testis expansion
            target: Progressive Involution of Mesonephric Duct Derivatives
            direction: INCREASED
            interpretation: Back-pressure consequence of the efferent-duct obstruction, mirroring the
              entry's own account of obstruction upstream of the testis.
      selected_evidence:
        snippet: Mutant mice reveal a dysregulation of fluid reabsorbtion within the efferent ductules,
          leading to a backup of fluid accumulation in the testis and a subsequent stasis of spermatozoa
          within the efferent ducts.
        supports: SUPPORT
