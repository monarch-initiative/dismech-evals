            relationship: RECAPITULATES
            fidelity: MODERATE
            description: Loss of Slc9a3 destabilizes CFTR protein in the epididymis and vas deferens,
              producing the same progressive luminal obstruction and duct compromise seen with direct
              CFTR or ADGRG2 loss - support for this entry's claim that ductal fluid handling, not any
              one gene product, is the shared dependency of the mesonephric duct derivatives.
            limitations: 'The mechanism is indirect: SLC9A3 loss acts by reducing CFTR protein abundance
              rather than through a CFTR-independent route, and the mouse phenotype requires a homozygous
              null genotype whereas the human genetic evidence for SLC9A3 is a heterozygous single-copy
              deletion with no ClinGen assertion.'
          role: ancestor
