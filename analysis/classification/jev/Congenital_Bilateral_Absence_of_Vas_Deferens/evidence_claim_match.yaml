        context: []
      assertion_type: Genetic
      assertion:
        name: SLC9A3
        gene_term:
          preferred_term: SLC9A3
          term:
            id: hgnc:11073
            label: SLC9A3
        relationship_type: SUSCEPTIBILITY
        notes: 'A sodium/proton exchanger. Single-copy SLC9A3 deletions are found in Taiwanese CBAVD patients
          who carry no major CFTR mutation, and the knockout mouse gives a mechanism: losing Slc9a3 dramatically
          reduces CFTR protein in the epididymis and vas deferens and produces obstructive azoospermia.


          Recorded as SUSCEPTIBILITY rather than CAUSATIVE, and the distinction matters. The human evidence
          is a heterozygous single-copy deletion in a small number of men, with no ClinGen assertion;
          the causal demonstration is in a homozygous-null mouse. That is variants conferring susceptibility
          in combination with other factors, not variants sufficient in a mendelian sense - which is what
          CAUSATIVE asserts in this schema.


          What the mouse does establish, and what makes SLC9A3 worth carrying at all, is that it acts
          by destabilising CFTR. So it is evidence for the entry''s central claim that the shared dependency
          is on ductal fluid handling rather than on any one gene product - reached through a modifier
          of CFTR abundance rather than through a third independent route.'
      selected_evidence:
        snippet: we found that CFTR expression was dramatically decreased in the epididymis and vas deferens
          of Slc9a3 knockout mice
        supports: SUPPORT
