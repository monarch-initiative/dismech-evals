      assertion_type: ClinicalBurden
      assertion:
        burden_level: MODERATE
        rationale: 'The burden is confined to fertility - there is no organ damage, no shortened life,
          and no progression after the duct is lost. Against that, it is usually the reason a couple presents,
          and it is treatable: 39 of 46 men in a consecutive series had their own children through retrieval
          and ICSI. Rated MODERATE rather than LOW because the diagnosis also identifies a CFTR carrier
          couple, and the child at risk has cystic fibrosis - a far more serious disease than the father''s.'
      selected_evidence:
        snippet: After proper counseling, all patients can undergo sperm retrieval from their epididymis
          or testis, and most of them can have their own children through ICSI.
        supports: SUPPORT
