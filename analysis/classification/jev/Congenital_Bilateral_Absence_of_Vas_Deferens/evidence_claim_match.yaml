            description: Constitutive Slc9a3 knockout mice develop obstructive azoospermia from progressively
              worsening luminal secretions and calcification in the efferent ductules, epididymis, and
              vas deferens, driven by a dramatic loss of CFTR protein in those same tissues. The knockout
