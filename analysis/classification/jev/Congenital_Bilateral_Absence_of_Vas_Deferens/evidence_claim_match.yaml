  0eda57921264ac50b3ce2b5b000c35a899cacbd808919ae49831a2ab8ecb3cb4:
    claim:
      about:
        disease:
          name: Congenital Bilateral Absence of Vas Deferens
          disease_term:
            preferred_term: congenital bilateral absence of vas deferens
            term:
              id: MONDO:0018801
              label: congenital bilateral absence of vas deferens
        context: []
      assertion_type: Subtype
      assertion:
        name: ADGRG2-related
        display_name: X-linked ADGRG2-related CBAVD
        description: About 2% of cases. Hemizygous truncating variants in ADGRG2, which encodes an adhesion
          G protein-coupled receptor expressed specifically in the epididymis and efferent ducts. These
          men are CFTR-negative, and because the inheritance is X-linked the recurrence risk and the counselling
          are entirely different from the CFTR case - which is the practical reason the subtype matters.
        subtype_term:
          preferred_term: vas deferens, congenital bilateral aplasia of, X-linked
          term:
            id: MONDO:0010511
            label: vas deferens, congenital bilateral aplasia of, X-linked
        genes:
        - preferred_term: ADGRG2
          term:
            id: hgnc:4516
            label: ADGRG2
      selected_evidence:
        snippet: We identified three protein-truncating hemizygous mutations, c.1545dupT (p.Glu516Ter),
          c.2845delT (p.Cys949AlafsTer81), and c.2002_2006delinsAGA (p.Leu668ArgfsTer21), in ADGRG2, encoding
          the epididymal- and efferent-ducts-specific adhesion G protein-coupled receptor G2, in four
          subjects, including two related individuals with X-linked transmission of their infertility.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
      - /name
      - /disease_term
