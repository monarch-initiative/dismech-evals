            term:
              id: MONDO:0014564
              label: congenital bile acid synthesis defect 5
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Peroxisomal Import of C27 Bile Acid and Branched-Chain Acyl-CoA Esters
        role: amplifier
        biological_scale: MOLECULAR
        description: 'The CoA thioesters of DHCA and THCA, and of 2-methyl branched-chain fatty acids
          such as pristanic acid, are no longer delivered into the peroxisomal matrix. The failure is
          substrate-selective: beta-oxidation of the very-long-chain fatty acid C26:0 was normal in the
          index patient''s fibroblasts, so the straight-chain very-long-chain route into the organelle
          is not the one that is lost.'
        biological_processes:
        - preferred_term: import of acyl-CoA esters into the peroxisomal matrix
          modifier: DECREASED
          term:
            id: GO:0015916
            label: fatty-acyl-CoA transport
        cellular_components:
        - preferred_term: peroxisomal matrix
          term:
            id: GO:0005782
            label: peroxisomal matrix
      selected_evidence:
        snippet: Peroxisomal beta-oxidation of C26:0 was normal, but beta-oxidation of pristanic acid
          was reduced.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25168382
      reference_title: A novel bile acid biosynthesis defect due to a deficiency of peroxisomal ABCD3.
