          term:
            id: HP:0002910
            label: Elevated circulating hepatic transaminase concentration
      selected_evidence:
        snippet: 'It is worth noting that one patient with cholestasis presented with hepatosplenomegaly,
          jaundice, and pruritus. Biochemical features included elevated transaminases, CBIL, and total
          serum bile acids, while GGT levels remained normal. Liver transient elastography showed an average
          liver stiffness of 9.2 kPa, indicating mild to moderate fibrosis. Genetic sequencing analysis
          identified suspected P variants associated with the disease phenotype. Compound heterozygous
          mutations were found in the ABCD3 gene at exon 10: C.846C>G (p.Y282Ter) and intron 21: C.1845+9G>A
          (p.?). Both variants have not been previously reported.'
        supports: SUPPORT
