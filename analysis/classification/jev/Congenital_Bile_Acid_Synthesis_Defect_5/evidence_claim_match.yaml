        conforms_to: peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect
        description: 'Biallelic loss-of-function ABCD3 variants remove PMP70 from the peroxisomal membrane.
          In the index patient''s fibroblasts, immunofluorescence and immunoblot showed loss of the transporter
          while ABCD1 and PEX14 were present, and the peroxisomes themselves were fewer and enlarged but
          still competent to import matrix protein. This node enters the peroxisomal module by its transporter
          arm: the organelle is assembled, and it is one substrate route into it that is lost.'
        genetic_context:
          zygosity: HOMOZYGOUS
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Homozygous in the index patient; the second reported child was compound heterozygous,
            so the zygosity recorded here is that of the better-characterised genotype rather than a property
            of the disease.
