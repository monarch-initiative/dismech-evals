      assertion_type: Diagnosis
      assertion:
        name: Plasma bile acid profiling by mass spectrometry
        description: 'The step that makes the diagnosis reachable. Quantifying DHCA and THCA by liquid
          chromatography-mass spectrometry separates the peroxisomal bile acid synthesis defects from
          every other cause of infantile cholestasis, because these C27 intermediates are below the detection
          limit in controls. It does not by itself identify ABCD3 as the lesion: acyl-CoA oxidase 2 deficiency
          and the Zellweger-spectrum disorders raise the same analytes. In the index patient the abnormal
          bile acid profile, combined with abnormal very-long-chain fatty acid ratios, is what prompted
          the peroxisomal workup.'
        markers: DHCA (3alpha,7alpha-dihydroxy-5beta-cholestan-26-oic acid) and THCA (3alpha,7alpha,12alpha-trihydroxy-5beta-cholestan-26-oic
          acid); total serum bile acids; serum gamma-glutamyltransferase, which stays normal.
        diagnosis_term:
          preferred_term: plasma bile acid intermediate profiling by liquid chromatography-mass spectrometry
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: In all controls, THCA and DHCA levels were below the detection limit.
        supports: SUPPORT
