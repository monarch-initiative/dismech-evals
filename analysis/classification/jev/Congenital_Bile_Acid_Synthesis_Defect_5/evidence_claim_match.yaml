              id: MONDO:0014564
              label: congenital bile acid synthesis defect 5
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cbas5-primary-bile-acid-replacement
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does oral primary bile acid replacement alter the course of ABCD3 deficiency, as it does
          in the enzyme-defect bile acid synthesis disorders?
        attaches_to:
        - treatments#
        - pathophysiology#Accumulation of C27 Bile Acid Intermediates
        rationale: 'The mechanistic case is straightforward and unproven. Replacing the missing primary
          bile acids restores the FXR-mediated feedback that suppresses CYP7A1, which should reduce flux
          into the pathway and so reduce production of the C27 intermediates that accumulate. That argument
          is generic to the bile acid synthesis defects and does not depend on where the block sits, so
          it applies to a transport lesion as readily as to an enzyme lesion. What is missing is any reported
          use in ABCD3 deficiency: the index patient received ursodeoxycholic acid rather than a primary
          bile acid and progressed to transplantation, and no treatment was reported for the second child.
          Evidence that primary bile acid supplementation lowers these intermediates exists for the peroxisome
          biogenesis disorders, which is a different lesion in the same pathway.'
      selected_evidence:
        snippet: In patients with ZSD, levels of bile acid intermediates can be lowered by a primary bile
          acid supplementation treatment; therefore, measuring their levels could help evaluate treatment
          effectiveness.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36511274
      reference_title: Development of a system adapted for the diagnosis and evaluation of peroxisomal
        disorders by measuring bile acid intermediates.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the premise of the open question - that primary bile acid supplementation
        lowers these intermediates - in Zellweger spectrum disorder, not in ABCD3 deficiency. Marked INDIRECT
        because carrying it across to this disease requires the inference that the feedback argument is
        lesion-independent, which is exactly what is unproven.
