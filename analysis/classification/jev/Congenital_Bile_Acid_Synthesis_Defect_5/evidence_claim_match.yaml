      assertion:
        name: Autosomal recessive inheritance
        description: 'Biallelic ABCD3 variants. The index patient was homozygous for a 1758 bp genomic
          deletion, born to consanguineous parents, with both parents confirmed carriers; the second reported
          child was compound heterozygous for two previously unreported variants. Penetrance and expressivity
          are recorded as UNKNOWN rather than complete and consistent: with two reported families there
          is no unaffected biallelic carrier to argue from and no phenotypic range to characterise, so
          any stronger statement would be an inference from an n of two rather than an observation.'
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: UNKNOWN
        expressivity: UNKNOWN
      selected_evidence:
        snippet: Genetic analysis revealed a homozygous deletion at the DNA level of 1758bp, predicted
          to result in a truncated ABCD3 protein lacking the C-terminal 24 amino acids (p.Y635NfsX1).
        supports: SUPPORT
