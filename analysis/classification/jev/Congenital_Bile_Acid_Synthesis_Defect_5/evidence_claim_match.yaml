          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0015607
            label: ABC-type fatty-acyl-CoA transporter activity
        cellular_components:
        - preferred_term: peroxisomal membrane
          term:
            id: GO:0005778
            label: peroxisomal membrane
        biological_processes:
        - preferred_term: peroxisome number and size are abnormal, while matrix import is preserved
          modifier: ABNORMAL
          term:
            id: GO:0007031
            label: peroxisome organization
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Investigation of peroxisomal parameters in skin fibroblasts revealed a reduced number
