        prompt: Does the branched-chain fatty acid arm of ABCD3 deficiency ever become clinically manifest,
          for example with age, with a phytanic-acid-rich diet, or in a patient who survives the liver
          disease?
        attaches_to:
        - pathophysiology#Reduced Peroxisomal Beta-Oxidation of Branched-Chain Fatty Acids
        rationale: 'ABCD3 imports branched-chain acyl-CoA esters as well as the C27 bile acid intermediates,
          and the biochemical defect in that arm is demonstrable: pristanic acid beta-oxidation was reduced
          in the index patient''s fibroblasts, and the knockout mouse accumulates phytanic acid when phytol-loaded.
          Yet the index patient''s plasma phytanic and pristanic acid concentrations were within the reference
          range and she had no neurological phenotype, dying of liver disease at four. Whether that is
          because the arm is metabolically well compensated, because dietary phytol intake in a young
          child is low, or simply because neither reported patient lived long enough or was old enough
          for it to declare, cannot be settled from two patients.'
      selected_evidence:
        snippet: Abcd3-/- mice accumulated the branched chain fatty acid phytanic acid after phytol loading.
        supports: SUPPORT
