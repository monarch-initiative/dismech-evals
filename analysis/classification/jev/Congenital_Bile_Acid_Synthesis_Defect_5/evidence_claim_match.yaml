        context: []
      assertion_type: Diagnosis
      assertion:
        name: Peroxisomal function studies in cultured skin fibroblasts
        description: What distinguishes an ABCD3 transport defect from a biogenesis defect and from the
          enzyme defects of the same pathway. In the index patient, catalase immunofluorescence showed
          matrix-import-competent peroxisomes that were fewer and enlarged; ABCD3 was absent from the
          peroxisomal membrane while ABCD1 and PEX14 were present; C26:0 beta-oxidation was normal while
          pristanic acid beta-oxidation was reduced; and acyl-CoA oxidase 1, D-bifunctional protein, sterol
          carrier protein X and dihydroxyacetonephosphate acyltransferase activities were all reported
          as normal. Acyl-CoA oxidase 2 was not part of that panel.
        markers: Peroxisomal C26:0 and pristanic acid beta-oxidation rates; ABCD3 immunofluorescence and
          immunoblot; catalase immunofluorescence for peroxisome number and morphology; plasmalogens;
          DHAPAT, ACOX1, D-bifunctional protein and SCPx activities.
        diagnosis_term:
          preferred_term: peroxisomal function studies in cultured fibroblasts
          term:
            id: NCIT:C25294
            label: Laboratory Procedure
      selected_evidence:
        snippet: Investigation of peroxisomal parameters in skin fibroblasts revealed a reduced number
          of enlarged import-competent peroxisomes.
        supports: SUPPORT
