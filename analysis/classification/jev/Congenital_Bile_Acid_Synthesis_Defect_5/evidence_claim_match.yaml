            term:
              id: MONDO:0014564
              label: congenital bile acid synthesis defect 5
        context: []
      assertion_type: Genetic
      assertion:
        name: ABCD3
        gene_term:
          preferred_term: ABCD3
          term:
            id: hgnc:67
            label: ABCD3
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'ABCD3 encodes PMP70, one of the three peroxisomal-membrane ABC half-transporters. Both
          reported genotypes are predicted to abolish the transporter: a homozygous 1758 bp deletion removing
          exon 24 and part of the 3'' UTR, truncating the protein by its C-terminal 24 residues, and a
          compound heterozygous pair comprising a nonsense allele and an intronic variant near a splice
          site.'
        variants:
        - name: ABCD3 c.1903-573_*1108del (p.Tyr635AsnfsTer1)
          description: Homozygous 1758 bp genomic deletion removing exon 24 and part of the 3' UTR in
            the index patient, predicted to truncate the protein by its C-terminal 24 amino acids. Both
            parents were carriers.
          type: deletion
          clinical_significance: PATHOGENIC
        - name: ABCD3 c.846C>G (p.Tyr282Ter) and c.1845+9G>A
          description: 'Compound heterozygous pair reported in a second child with cholestasis; both alleles
            were novel at the time of report. `clinical_significance` is deliberately left unset: the
            publication calls them suspected pathogenic variants associated with the phenotype, which
            is not a completed ACMG classification, and recording either PATHOGENIC or UNCERTAIN_SIGNIFICANCE
            would assert a call the source did not make.'
          type: compound_heterozygous
      selected_evidence:
        snippet: The defects of ABCD1 and ABCD3 are responsible for two genetic disorders called X-linked
          adrenoleukodystrophy and congenital bile acid synthesis defect 5, respectively.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
