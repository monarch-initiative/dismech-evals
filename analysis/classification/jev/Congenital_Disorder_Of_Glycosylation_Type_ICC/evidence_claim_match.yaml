            term:
              id: MONDO:0026729
              label: congenital disorder of glycosylation, type ICC
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: magnesium_transporter_model
        hypothesis_label: Mg2+ second-messenger transporter model
        status: DEPRECATED
        description: 'The original model, in which MAGT1 acts as a magnesium transporter and the loss
          of NKG2D and of EBV cytotoxicity follows from a Mg2+ homeostasis defect, with supraphysiological
          magnesium predicted to rescue the defect. This model is retained here because it drove the disorder''s
          original name, its clinical trial, and much of the older literature — but it is recorded as
          DEPRECATED. Magnesium did not significantly rescue NKG2D expression in CRISPR-engineered human
          cell lines or in patient cells, did not rescue the hypoglycosylation defect, and produced no
          change in EBV or NKG2D status in a randomized controlled trial.

          '
      selected_evidence:
        snippet: These observations reveal a role for Mg(2+) as an intracellular second messenger coupling
          cell-surface receptor activation to intracellular effectors and identify MAGT1 as a possible
          target for novel therapeutics.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
      evidence_path: /mechanistic_hypotheses/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21796205
      reference_title: Second messenger role for Mg2+ revealed by human T-cell immunodeficiency.
