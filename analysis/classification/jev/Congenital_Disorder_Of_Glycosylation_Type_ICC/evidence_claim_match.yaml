  ff4990453cb5d92e769f57a359369219139c30ef644d66cfa629337574a26c87:
    claim:
      about:
        disease:
          name: Congenital Disorder of Glycosylation, Type ICC
          disease_term:
            preferred_term: congenital disorder of glycosylation, type ICC
            term:
              id: MONDO:0026729
              label: congenital disorder of glycosylation, type ICC
        context: []
      assertion_type: Treatment
      assertion:
        name: Magnesium Supplementation (tested and ineffective)
        description: 'Oral magnesium L-threonate and intravenous magnesium sulfate were tested on the
          now-superseded premise that MAGT1 deficiency is primarily a magnesium-homeostasis defect. A
          randomized, double-blind, placebo-controlled crossover trial (NCT02496676) found no change in
          EBV or NKG2D status, in vitro supplementation of cells from 14 patients failed to significantly
          rescue NKG2D expression, and the trial was stopped. One EBV-naive patient was withdrawn after
          asymptomatic elevation of liver enzymes on intravenous magnesium sulfate.

          This entry exists to record a negative result, NOT to recommend a therapy. It is curated because
          the magnesium rationale is embedded in this disorder''s name and in much of its older literature,
          so a curator or clinician meeting the entry needs to find the refutation here rather than infer
          efficacy from the historical framing.

          '
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: magnesium sulfate
            term:
              id: CHEBI:32599
              label: magnesium sulfate
      selected_evidence:
        snippet: Although small, this study indicates magnesium supplementation is unlikely to be an effective
          therapeutic option in XMEN disease.
        supports: REFUTE
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
