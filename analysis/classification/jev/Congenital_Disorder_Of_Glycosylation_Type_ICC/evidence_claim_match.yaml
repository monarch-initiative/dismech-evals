  e65365bdfe63619fd6723c7d7f189e52c47e2e7783f42b0ff543202d34d8e94e:
    claim:
      about:
        disease:
          name: Congenital Disorder of Glycosylation, Type ICC
          disease_term:
            preferred_term: congenital disorder of glycosylation, type ICC
            term:
              id: MONDO:0026729
              label: congenital disorder of glycosylation, type ICC
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: NKG2D Hypoglycosylation and Loss from Cytotoxic Lymphocytes
        biological_scale: CELLULAR
        description: 'NKG2D, the activating receptor encoded by KLRK1, is underglycosylated at a defined
          site in MAGT1-deficient patients, and its steady-state surface expression on CD8+ cytotoxic
          T lymphocytes and NK cells is consequently lost. NKG2D is the best characterized but not the
          only affected client: glycoproteomic work describes a restricted set of hypoglycosylated immune
          glycoproteins also including CD28, HLA-DR beta and the T cell receptor alpha chain. Those additional
          substrates are stated in prose only, without an evidence block, because the cited abstracts
          here support the "restricted subset" claim generically rather than naming them. NKG2D and CD70
          are required for control of Epstein-Barr virus, so this is the proximate immunological lesion.
          Critically, this step is a glycosylation defect and not a magnesium-signalling defect: magnesium
          neither restores NKG2D expression nor rescues the hypoglycosylation.

          '
        cell_types:
        - preferred_term: CD8-positive, alpha-beta T cell
          term:
            id: CL:0000625
            label: CD8-positive, alpha-beta T cell
        - preferred_term: natural killer cell
          term:
            id: CL:0000623
            label: natural killer cell
      selected_evidence:
        snippet: Here, we show that the reduced steady-state levels of NKG2D are caused by hypoglycosylation
          of the protein and we pinpoint the exact site that is underglycosylated in MAGT1-deficient patients.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35182234
      reference_title: Lack of NKG2D in MAGT1-deficient patients is caused by hypoglycosylation.
      evidence_source: IN_VITRO
      explanation: Establishes hypoglycosylation as the cause of NKG2D loss, the mechanistic core of this
        node.
