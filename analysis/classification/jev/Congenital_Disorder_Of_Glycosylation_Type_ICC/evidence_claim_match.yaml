        description: 'Loss-of-function mutation of the X-linked MAGT1 gene removes a subunit of the STT3B
          oligosaccharyltransferase complex, the machinery that performs post-translational N-glycosylation.
          TUSC3, the MAGT1 homolog, is upregulated, which may partially compensate. Note that MAGT1 is
          a non-catalytic subunit, so the annotation here is the decrease in the N-glycosylation process
          rather than loss of a catalytic molecular function; GO:0008250 (oligosaccharyltransferase complex)
          names the complex MAGT1 belongs to but is a cellular component and is not a valid MolecularFunctionTerm.

          '
        biological_processes:
        - preferred_term: protein N-linked glycosylation
          term:
            id: GO:0006487
            label: protein N-linked glycosylation
          modifier: DECREASED
