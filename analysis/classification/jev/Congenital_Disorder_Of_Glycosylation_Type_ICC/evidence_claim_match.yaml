              label: congenital disorder of glycosylation, type ICC
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: glycosylation_defect_model
        hypothesis_label: STT3B/OST hypoglycosylation model
        status: CANONICAL
        description: 'MAGT1 is a subunit of the STT3B oligosaccharyltransferase complex, so its loss impairs
          post-translational N-glycosylation of a restricted subset of client glycoproteins. On this model
          the immunological phenotype is a direct consequence of glycoprotein hypoglycosylation: the loss
          of steady-state NKG2D is caused by hypoglycosylation of NKG2D itself at a defined site, not
          by a downstream signalling defect. This is the model the current evidence supports.

          '
      selected_evidence:
        snippet: Here, we show that the reduced steady-state levels of NKG2D are caused by hypoglycosylation
          of the protein and we pinpoint the exact site that is underglycosylated in MAGT1-deficient patients.
        supports: SUPPORT
    origin:
