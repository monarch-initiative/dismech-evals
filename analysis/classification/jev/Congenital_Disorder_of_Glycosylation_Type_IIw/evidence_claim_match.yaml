            expressed G6PT1 isoform, removing the C-terminal ER retrieval motif.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: We report seven individuals who presented with liver dysfunction multifactorial coagulation
          deficiency and cardiac issues and were heterozygous for the same variant, c.1267C>T (p.Arg423∗),
          in SLC37A4; the affected individuals were from four unrelated families.
        supports: SUPPORT
