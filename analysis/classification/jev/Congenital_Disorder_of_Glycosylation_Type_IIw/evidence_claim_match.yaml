        description: 'The recurrent c.1267C>T (p.Arg423*) allele truncates the last seven residues of
          G6PT1, deleting the C-terminal ER retrieval signal that normally returns the transporter to
          the endoplasmic reticulum. This is the initiating lesion, and it is a loss of an address label
          rather than a loss of transport activity.

          '
        genetic_context:
          gene:
