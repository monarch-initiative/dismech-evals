            label: Autosomal dominant inheritance
        description: 'All reported affected individuals are heterozygous for the same de novo SLC37A4
          allele, c.1267C>T (p.Arg423*). The disease is dominant because the truncated transporter acts
          where it should not be rather than because the remaining wild-type allele is insufficient, which
          is why it segregates as a dominant trait while biallelic loss of the same gene segregates as
          a recessive one.

          '
      selected_evidence:
        snippet: Loss-of-function of the glucose-6-phosphate transporter is caused by biallelic mutations
          in SLC37A4 and leads to glycogen storage disease Ib. Here we describe a second disease caused
          by a single dominant mutation in the same gene.
        supports: SUPPORT
