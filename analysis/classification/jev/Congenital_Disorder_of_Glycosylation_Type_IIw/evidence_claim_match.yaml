      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: er_exit_site_model
        hypothesis_label: Relocation to a non-Golgi compartment (possible ER exit sites)
        status: EMERGING
        description: 'On this model the mutant transporter does not simply accumulate in the Golgi: a
          portion of it reaches a distinct compartment that is not the Golgi, possibly ER exit sites.
          The claim comes from a CRISPR base-edited hepatoma line engineered to carry the patient allele,
          which reproduced the secreted glycosylation abnormality and so is a system in which the localization
          question can be asked. This does not displace the downstream Golgi pH and morphology changes,
          which the same study reports; it disputes only where the mutant protein sits.

          '
      selected_evidence:
        snippet: These cells replicated the secreted abnormalities seen in serum N-glycosylation, and
          a portion of the mutant protein appears to relocate to a distinct, non-Golgi compartment, possibly
          ER exit sites.
        supports: SUPPORT
