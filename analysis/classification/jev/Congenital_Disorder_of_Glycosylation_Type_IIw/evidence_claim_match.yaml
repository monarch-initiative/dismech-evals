          structures on secreted glycoproteins together with hyposialylation and hypogalactosylation.
          The defect is tissue-restricted in a way that is diagnostically and mechanistically informative:
          serum glycoproteins are grossly abnormal while N-glycans in fibroblasts and undifferentiated
          iPSC are normal, which points at the liver as the site of disease and rules out a cell-autonomous
          defect of the glycosylation machinery.

          '
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
