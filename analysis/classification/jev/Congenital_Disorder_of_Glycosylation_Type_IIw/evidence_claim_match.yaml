        features: 'Every reported patient carries the same heterozygous de novo nonsense allele, c.1267C>T
          (p.Arg423*), which removes the final seven amino acids of the widely expressed G6PT1 isoform
          and with them the C-terminal KKXX-type ER retrieval motif. The allele is recurrent rather than
          familial, and the phenotype is caused by mislocalization of the truncated protein rather than
          by reduced transporter activity: the wild-type allele remains sufficient for glucose-6-phosphate
          transport.

          '
        variants:
        - name: c.1267C>T (p.Arg423*)
