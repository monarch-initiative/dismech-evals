      assertion:
        hypothesis_group_id: golgi_retention_model
        hypothesis_label: Golgi retention of the truncated transporter
        status: CANONICAL
        description: 'On this model, truncating the ER retrieval motif exposes a weak Golgi retention
          signal already present in G6PT1, so the mutant transporter is captured in the Golgi and disturbs
          N-glycan processing there. This is the model under which the disease was first described, and
          it is the one the disorder''s common name (mislocalization to the Golgi) encodes.

          '
      selected_evidence:
        snippet: This causes mislocalization of the glucose-6-phosphate transporter to the Golgi leading
          to a congenital disorder of glycosylation type II (SLC37A4-CDG).
        supports: SUPPORT
