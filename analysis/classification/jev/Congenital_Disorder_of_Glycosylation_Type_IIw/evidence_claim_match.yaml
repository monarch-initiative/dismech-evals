              label: SLC37A4
          allele_type: SNV
          variant_origin: DE_NOVO
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
          description: Heterozygous de novo nonsense allele removing the ER retrieval motif. The functional
            impact is scored against the retrieval motif, which is abolished; transporter catalytic function
            is not the affected property.
        biological_processes:
        - preferred_term: protein retention in ER lumen
          term:
            id: GO:0006621
            label: protein retention in ER lumen
          modifier: DECREASED
      selected_evidence:
        snippet: In SLC37A4‐CDG, recently reported in one patient, a heterozygous de novo variant (c.1267C>T;
          p.R423*) on one allele removes the final seven amino acids of the translated protein. This contains
          the ER retrieval signal and its removal exposes a Golgi retention signal.
        supports: SUPPORT
