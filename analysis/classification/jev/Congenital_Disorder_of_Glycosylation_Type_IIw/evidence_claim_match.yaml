              label: congenital disorder of glycosylation, type IIw
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Intraluminal Golgi pH and Altered Golgi Morphology
        biological_scale: CELLULAR
        description: 'The mislocalized transporter lowers Golgi intraluminal pH and alters Golgi morphology
          in a manner that tracks allele dosage. The pH change is the mechanistic hinge: Golgi glycosyltransferases
          and glycosidases have narrow pH optima, so an acidification shift is sufficient to derange processing
          without any defect in the glycosylation enzymes themselves. Independent support comes from serum
          bikunin proteoglycan isoforms, whose esterified heavy forms are known to report Golgi pH and
          are severely reduced here.

          '
        biological_processes:
        - preferred_term: Golgi lumen acidification
          term:
            id: GO:0061795
            label: Golgi lumen acidification
          modifier: INCREASED
        - preferred_term: Golgi organization
          term:
            id: GO:0007030
            label: Golgi organization
          modifier: DECREASED
      selected_evidence:
        snippet: SLC37A4-CDG was shown to be associated with an increased acidification of intraluminal
          Golgi pH
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
