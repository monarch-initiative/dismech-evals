            term:
              id: MONDO:0019403
              label: congenital dyserythropoietic anemia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Ineffective erythropoiesis
        description: 'The unifying mechanism of all CDA subtypes is ineffective erythropoiesis: erythropoietin-driven
          expansion of erythroid precursors with apoptosis and maturation arrest of late-stage erythroblasts,
          so that the bone marrow shows erythroid hyperplasia and dyserythropoiesis while the peripheral
          reticulocyte response is inadequate for the degree of anemia. Subtype-specific molecular lesions
          (CDAN1/CDIN1 chromatin and nucleolar defects, SEC23B COPII trafficking defects, KIF23 cytokinesis
          defects) all converge on failed terminal erythroid maturation.'
        cell_types:
        - preferred_term: erythroblast
          term:
            id: CL:0000765
            label: erythroblast
        - preferred_term: erythroid lineage cell
          term:
            id: CL:0000764
            label: erythroid lineage cell
        biological_processes:
        - preferred_term: erythrocyte differentiation
          term:
            id: GO:0030218
            label: erythrocyte differentiation
          modifier: DECREASED
        - preferred_term: erythrocyte maturation
          term:
            id: GO:0043249
            label: erythrocyte maturation
          modifier: DECREASED
        - preferred_term: apoptotic process
          term:
            id: GO:0006915
            label: apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: Congenital dyserythropoietic anemia (CDA) is characterized by anemia—mild to severe,
          hemolysis, ineffective erythropoiesis, and in some cases, iron overload.
        supports: SUPPORT
