      assertion:
        name: CDA II COPII trafficking and hypoglycosylation defect
        description: In CDA II, biallelic SEC23B variants impair the COPII coat component required for
          endoplasmic-reticulum-to-Golgi vesicular transport. Disrupted secretory trafficking alters glycosylation
          of erythrocyte membrane proteins (e.g., band 3 hypoglycosylation), and patient erythroblasts
          show an additional membrane of residual endoplasmic reticulum beneath the plasma membrane. Patient-derived
          cells show reduced SEC23B protein without compensatory SEC23A upregulation, consistent with
          a loss-of-function mechanism.
