        context: []
      assertion_type: Pathophysiology
      assertion:
        name: CDA I chromatin and nucleolar dysfunction
        description: In CDA I, biallelic CDAN1 (codanin-1) or CDIN1 variants disrupt erythroid chromatin
          organization and nucleolar structure/function. Codanin-1 physically interacts with CDIN1, so
          CDAN1 and CDIN1 variants cause CDA I through a common pathway. Affected erythroblasts show delayed
          terminal differentiation, widespread changes in chromatin accessibility, increased proliferation
          and apoptosis, and the pathognomonic "spongy" heterochromatin seen on electron microscopy.
        genes:
        - preferred_term: CDAN1
          term:
            id: hgnc:1713
            label: CDAN1
        - preferred_term: CDIN1
          term:
            id: hgnc:26929
            label: CDIN1
        cell_types:
        - preferred_term: erythroblast
          term:
            id: CL:0000765
            label: erythroblast
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: erythroid cells in this condition show a delay during terminal erythroid differentiation,
          associated with increased proliferation and widespread changes in chromatin accessibility. We
          also show that the proteins encoded by CDAN1 and CDIN1 are enriched in nucleoli which are structurally
          and functionally abnormal in CDA-I.
        supports: SUPPORT
