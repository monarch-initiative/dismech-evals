      assertion_type: Pathophysiology
      assertion:
        name: Ineffective erythropoiesis
        description: 'The unifying mechanism of all CDA subtypes is ineffective erythropoiesis: erythropoietin-driven
          expansion of erythroid precursors with apoptosis and maturation arrest of late-stage erythroblasts,
          so that the bone marrow shows erythroid hyperplasia and dyserythropoiesis while the peripheral
          reticulocyte response is inadequate for the degree of anemia. Subtype-specific molecular lesions
          (CDAN1/CDIN1 chromatin and nucleolar defects, SEC23B COPII trafficking defects, KIF23 cytokinesis
          defects) all converge on failed terminal erythroid maturation.'
        cell_types:
        - preferred_term: erythroblast
