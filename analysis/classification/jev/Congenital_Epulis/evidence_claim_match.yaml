      assertion_type: Pathophysiology
      assertion:
        name: Congenital Gingival Granular Cell Proliferation
        description: 'Congenital epulis is a localized benign congenital lesion of gingival or alveolar-ridge
          soft tissue. Current pathology literature favors a non-neural, likely mesenchymal or hamartomatous
          origin, although the exact histogenesis remains uncertain. A hypothesized intrauterine hormonal
          influence has been proposed to explain the strong female predilection and postnatal growth arrest,
          but it remains unproven. Local granular-cell proliferation forms the exophytic neonatal oral
          mass and can mechanically impair feeding or, rarely, respiration.

          '
        cell_types:
        - preferred_term: mesenchymal cell
          term:
            id: CL:0008019
            label: mesenchymal cell
        biological_processes:
        - preferred_term: cell population proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: ABNORMAL
        locations:
        - preferred_term: gingiva
          term:
            id: UBERON:0001828
            label: gingiva
        - preferred_term: alveolar ridge
          term:
            id: UBERON:0004103
            label: alveolar ridge
      selected_evidence:
        snippet: Congenital gingival granular cell tumours (CGCT) are rare and always benign intraoral
          tumours originating from the alveolar ridge.
        supports: SUPPORT
