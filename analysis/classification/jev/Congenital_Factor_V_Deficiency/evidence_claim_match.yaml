        description: A factor V minigene expressed at under 0.1% of normal in the liver rescues Fv-/-
          mice through the perinatal period to adulthood without spontaneous haemorrhage, demonstrating
          that minimal factor V expression suffices for survival - a plausible explanation for why nearly
          all human patients retain some residual factor V.
