        notes: F5 is on chromosome 1q24 and spans 25 exons. The disorder is genetically heterogeneous,
          with missense variants predominating and the remainder null (nonsense, frameshift, splice-site,
          large deletions distributed across the gene); no single founder variant dominates, and routine
          exon-focused sequencing misses an appreciable fraction of alleles (large deletions, non-canonical
          splice variants), so multiplex ligation-dependent probe amplification is needed alongside sequencing.
          Per-gene case fractions are not curated because F5 is the sole causative locus.
      selected_evidence:
        snippet: A total of 42 genetic alterations (of which 33 were uniquely different mutations), comprising
