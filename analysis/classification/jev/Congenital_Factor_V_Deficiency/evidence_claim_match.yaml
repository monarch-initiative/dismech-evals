      assertion_type: AnimalModel
      assertion:
        name: F5 knockout mouse
        species: Mouse
        genotype: Fv-/- (targeted deletion of coagulation factor V)
        publication: PMID:8900278
        description: The Cui et al. (1996) factor V knockout. About half of homozygous embryos die at
          embryonic day 9-10, possibly from a yolk-sac vascular abnormality; the rest reach term but die
          of massive haemorrhage within two hours of birth. The model established the absolute requirement
          for factor V in prothrombinase activity and revealed a developmental role for the coagulation
          system.
        modeled_mechanisms:
        - target: Systemic Bleeding Tendency
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Complete absence of factor V produces fatal spontaneous bleeding, reproducing the
            organism-level bleeding tendency.
          limitations: Total factor V deficiency is embryonic or perinatally lethal in the mouse, whereas
            human disease is a survivable chronic diathesis in which some residual factor V (plasma or
            platelet) is essentially always present. The model cannot report the human natural history,
            genotype-phenotype relation, or long-term treatment, and its lethality is why human complete
            deficiency is so rare.
      selected_evidence:
        snippet: The remaining Fv-/- mice progress normally to term, but die from massive haemorrhage
          within 2 hours of birth.
        supports: SUPPORT
