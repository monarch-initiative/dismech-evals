        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Can a factor-V-specific replacement therapy be developed and licensed?
        attaches_to:
        - treatments#
        rationale: Factor V deficiency is the rare bleeding disorder still without a licensed factor-specific
          concentrate, unlike factor X and factor XIII deficiencies. Two candidates have reached preclinical
          or in-vitro stage - a plasma-derived factor V concentrate that corrects clotting times and thrombin
          generation in patient plasma, and an engineered activated factor V (superFVa) - but neither
          has completed human trials, so plasma and platelet transfusion remain the only options.
      selected_evidence:
        snippet: Congenital factor V (FV) deficiency, affecting approximately 1 in 1 million individuals
          worldwide, remains among the rare bleeding disorders (RBDs) without a licensed factor-specific
          replacement therapy.
        supports: SUPPORT
