      assertion_type: Pathophysiology
      assertion:
        name: Impaired Prothrombinase Cofactor Function
        biological_scale: MOLECULAR
        description: The non-redundant step. Activated factor V (factor Va) is the non-enzymatic cofactor
          of the prothrombinase complex, assembling with factor Xa on an anionic phospholipid surface
          and accelerating prothrombin cleavage far beyond what factor Xa achieves alone. Because both
          the extrinsic and intrinsic arms of the cascade converge on this common-pathway step, neither
          can compensate for the defect.
        biological_processes:
        - preferred_term: blood coagulation, common pathway
          modifier: DECREASED
          term:
            id: GO:0072377
            label: blood coagulation, common pathway
        cell_types:
        - preferred_term: activated platelet supplying the anionic phospholipid surface
          term:
            id: CL:0000233
            label: platelet
      selected_evidence:
        snippet: Either thrombin or factor Xa converts factor V to the plasma cofactor of the prothrombinase
          complex. This complex, composed of calcium, phospholipids, factor Va, and factor Xa, is essential
          for converting prothrombin to thrombin.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
