  3d03a4909cb24d2e035c5f52e67b9e20684d05aca1c66b1a26a2e2f5946055e8:
    claim:
      about:
        disease:
          name: Congenital Factor V Deficiency
          disease_term:
            preferred_term: congenital factor V deficiency
            term:
              id: MONDO:0009210
              label: congenital factor V deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Residual Platelet Factor V
        biological_scale: CELLULAR
        description: About a fifth to a quarter of the body's factor V is stored in platelet alpha-granules,
          acquired by megakaryocyte endocytosis of plasma factor V rather than synthesised in the platelet.
          In patients with undetectable plasma factor V, a measurable platelet-derived factor V/Va pool
          can persist and be released locally at a wound, where it is the predominant cofactor for thrombin
          generation at the platelet surface. This pool, not any residual plasma factor V, is the leading
          explanation for the mild phenotype of many severely deficient patients.
        cell_types:
        - preferred_term: platelet storing factor V in alpha-granules
          term:
            id: CL:0000233
            label: platelet
        - preferred_term: megakaryocyte endocytosing plasma factor V
          term:
            id: CL:0000556
            label: megakaryocyte
        cellular_components:
        - preferred_term: platelet alpha granule, the factor V store
          term:
            id: GO:0031091
            label: platelet alpha granule
      selected_evidence:
        snippet: release of the patient's platelet-derived FV/Va (7% of normal) following platelet activation
          resulted in robust thrombin generation, similar to that in an individual with normal plasma-
          and platelet-derived FV concentrations
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
