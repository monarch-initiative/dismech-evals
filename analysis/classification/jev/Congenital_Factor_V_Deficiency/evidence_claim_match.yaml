            of the null mouse, modelling the viability threshold rather than the symptomatic human phenotype.
          limitations: The transgene is expressed from a heterologous promoter at a fixed low level, not
            from the native locus, so it tests a viability threshold rather than reproducing any particular
            human genotype or its bleeding pattern.
      selected_evidence:
        snippet: Rescued Tg+,Fv-/- mice have undetectable FV (<0.1%) in both plasma and platelet compartments,
          but survive the perinatal period and mature to adulthood without spontaneous hemorrhage.
