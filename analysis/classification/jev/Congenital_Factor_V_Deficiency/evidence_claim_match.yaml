      assertion:
        name: Low Plasma Tissue Factor Pathway Inhibitor
        biological_scale: MOLECULAR
        description: Factor-V-deficient plasma carries physiologically low levels of tissue factor pathway
          inhibitor, possibly because factor V affects TFPI stability or clearance in vivo. The reduced
          TFPI lowers the factor V threshold needed for minimal thrombin generation and so works alongside
          residual platelet factor V to protect deficient patients from severe bleeding.
        genes:
        - preferred_term: TFPI
          term:
            id: hgnc:11760
            label: TFPI
        molecular_functions:
        - preferred_term: tissue factor pathway inhibitor serine protease inhibitor activity
          modifier: DECREASED
          term:
            id: GO:0004867
            label: serine-type endopeptidase inhibitor activity
      selected_evidence:
        snippet: Low TFPI levels decreased the FV requirement for minimal thrombin generation in FV-deficient
          plasma to less than 1% and might therefore protect FV-deficient patients from severe bleeding.
        supports: SUPPORT
