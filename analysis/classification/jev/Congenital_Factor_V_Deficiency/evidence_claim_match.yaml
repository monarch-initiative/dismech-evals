  1281d275872c459835f3ec717069f098494632ed3c64f4811743bc21783a8bcd:
    claim:
      about:
        disease:
          name: Congenital Factor V Deficiency
          disease_term:
            preferred_term: congenital factor V deficiency
            term:
              id: MONDO:0009210
              label: congenital factor V deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: fv_activity_severity_discordance
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why does plasma factor V activity predict bleeding severity so poorly, and can platelet
          factor V or thrombin generation do better?
        attaches_to:
        - pathophysiology#Systemic Bleeding Tendency
        - pathophysiology#Preserved Platelet-Dependent Thrombin Generation
        rationale: Patients with undetectable plasma factor V range from mild bleeders to neonates with
          fatal intracranial haemorrhage, and plasma FV:C does not sort them. The leading candidate explanations
          - residual platelet factor V and low TFPI sustaining thrombin generation - are supported by
          case-level work, and thrombin generation in platelet-rich plasma may track bleeding better than
          a one-stage plasma assay, but no prospective study has established a platelet or thrombin-generation
          measure as a clinical predictor. This bears directly on which laboratory value should set a
          prophylaxis threshold.
      selected_evidence:
        snippet: While the reasons for this variable phenotypic expression are largely unknown, several
          observations from different laboratories indicate platelets as crucial players in FV deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19438479
      reference_title: Advances in understanding the bleeding diathesis in factor V deficiency.
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      explanation: States that the reasons for the variable phenotype are largely unknown and points to
        platelets as the leading candidate, which is the gap here.
