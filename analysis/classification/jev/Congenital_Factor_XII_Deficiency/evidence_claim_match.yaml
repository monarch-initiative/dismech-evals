  e1e8f05a09afaaef923ad38f81f16f32e9288dab325d288ac472775b66981451:
    claim:
      about:
        disease:
          name: Congenital Factor XII Deficiency
          disease_term:
            preferred_term: congenital factor XII deficiency
            term:
              id: MONDO:0009315
              label: congenital factor XII deficiency
        context: []
      assertion_type: Phenotype
      assertion:
        name: Abnormal Bleeding
        category: Hematologic
        description: 'Contested, and the one claim in this entry where cohorts disagree. The long-standing
          position is that factor XII deficiency causes no bleeding, supported by homozygous patients
          coming through major surgery without hemostatic support. A Russian cohort of 33 patients instead
          reported that mild hemorrhagic manifestations are common, and the East China cohort describes
          individual patients with heavy menstrual bleeding or difficulty stopping bleeding after trauma
          while concluding the deficiency is not linked to bleeding risk.

          The cohorts are not comparable, and that asymmetry is most of the apparent conflict. The study
          reporting common bleeding enrolled patients with factor XII below 60%, a partial-deficiency
          group in which eight were homozygous for the hypomorphic 46C>T polymorphism with no coding variant
          at all. The studies reporting none examined homozygous or severely deficient patients. Coexisting
          hemostatic defects are not systematically excluded in most reports.'
        phenotype_term:
          preferred_term: Abnormal bleeding
          term:
            id: HP:0001892
            label: Abnormal bleeding
      selected_evidence:
        snippet: We obtained and analysed genetic and clinical data from 33 apparently unrelated patients
          with FXII plasma levels below 60% and genetic data from 26 healthy controls with no history
          of FXII deficiency.
        supports: SUPPORT
    origin:
