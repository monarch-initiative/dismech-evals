        rationale: 'The two directions are not merely unreconciled but opposite, and the question bears
          directly on whether factor XII is a safe antithrombotic target. Publication bias in case reports
          of thrombosis in deficient patients is the obvious candidate explanation and has not been quantified.
          The signal is not confined to isolated reports: the East China cohort cited throughout this
          entry contains a proband with inferior vena cava and right common iliac thrombus.'
      selected_evidence:
        snippet: In conclusion, we do not consider factor XII to be a determinant of deep-vein thrombosis.
        supports: SUPPORT
