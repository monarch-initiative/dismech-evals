        context: []
      assertion_type: Treatment
      assertion:
        name: No Hemostatic Prophylaxis
        description: Factor XII deficiency needs no replacement or prophylaxis, including before surgery.
          The prolonged aPTT invites plasma transfusion that has no proven benefit, and homozygous patients
          have come through major operations without hemostatic support. The management decision here
          is to withhold treatment, not to give it.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: observation without hemostatic prophylaxis
        notes: Deliberately unbound. TreatmentTerm is rooted at NCIT:C25218 Clinical Intervention or Procedure,
          and every term there names an action given, whereas this record's content is an action withheld.
          Against ols:ncit, `l~watchful` and `l^Watchful` return only questionnaire items; `l~observation`
          returns NCIT:C25598 Observation Activity and NCIT:C16084 Observational Study, which are study
          rather than intervention concepts; and `l~no treatment`, `l~expectant` and `l~deferred` return
          nothing relevant. A search for "Watchful Waiting" surfaces NCIT:C15722 Patient Observation,
          which exists but which `just validate-terms` rejects as outside the TreatmentActionTerm enum.
          NCIT:C15747 Supportive Care was rejected because it asserts care delivered.
      selected_evidence:
        snippet: Patients do not experience a higher risk of surgical bleeding despite a markedly prolonged
          activated partial thromboplastin time.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
