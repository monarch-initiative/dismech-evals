    evidence_metadata:
      reference: PMID:42035525
      reference_title: 'Factor XII Deficiency and Thrombosis Risk: A Systematic Review and Meta-Analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: The adjusted estimate is null, while the unadjusted pooled risk ratio of 1.34 (95%
        CI 0.99-1.81) sits at the edge of significance. Recording both is why the entry treats the question
        as open rather than closed.
