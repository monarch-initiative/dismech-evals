              label: congenital factor XII deficiency
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: f12_deficiency_thrombosis_claim
        prompt: Is factor XII deficiency a thrombophilia, as case reports have long suggested? Pooled
          analysis finds no significant association, and biobank data suggest heterozygous loss is protective
          rather than harmful. What explains the persistent case-report signal?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired Polyphosphate-Driven Thrombus Propagation
        rationale: 'The two directions are not merely unreconciled but opposite, and the question bears
          directly on whether factor XII is a safe antithrombotic target. Publication bias in case reports
          of thrombosis in deficient patients is the obvious candidate explanation and has not been quantified.
          The signal is not confined to isolated reports: the East China cohort cited throughout this
          entry contains a proband with inferior vena cava and right common iliac thrombus.'
      selected_evidence:
        snippet: 'A third analysis pooling adjusted ORs from two studies showed no association (OR 1.03;
          95% CI: 0.65'
        supports: SUPPORT
    origin:
