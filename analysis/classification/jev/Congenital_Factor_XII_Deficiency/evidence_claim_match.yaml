  f59bf8629794603899ab43ba5945ffa14050634279b40a05e9fc3609d9d9c82e:
    claim:
      about:
        disease:
          name: Congenital Factor XII Deficiency
          disease_term:
            preferred_term: congenital factor XII deficiency
            term:
              id: MONDO:0009315
              label: congenital factor XII deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: F12 Loss of Function
        biological_scale: MOLECULAR
        description: 'Biallelic F12 variants abolish or reduce production of functional factor XII. The
          spectrum is population-dependent: missense alleles dominate in a Han Chinese cohort, where the
          abstract reports clustering in the catalytic and kringle domains although its own body describes
          the variants as spread across the gene, while a Russian cohort is 92.5% promoter and splice
          variants with no missense predominance. Most variant carriers have a quantitative (type I) defect
          in which antigen falls with activity; a qualitative (type II) defect with preserved antigen
          is less common. The common promoter polymorphism 46C>T lowers factor XII levels and contributes
          additively in many probands.'
        genes:
        - preferred_term: F12
          term:
            id: hgnc:3530
            label: F12
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
        molecular_functions:
        - preferred_term: serine-type endopeptidase activity
          modifier: DECREASED
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Genetic analysis revealed that 94.1% of probands carried genetic defects, with 29 mutations
          pinpointed in the F12 gene.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
