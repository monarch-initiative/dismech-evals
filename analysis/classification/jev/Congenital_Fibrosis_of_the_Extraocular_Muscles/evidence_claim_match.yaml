        genes:
        - preferred_term: KIF21A
          term:
            id: hgnc:19349
            label: KIF21A
        biological_scale: MOLECULAR
        description: KIF21A is an anterograde kinesin whose motor activity is normally restrained by an
          intramolecular autoinhibitory interaction between its third coiled-coil stalk and its motor
          domain. The recurrent CFEOM1 missense variants cluster in exactly these two elements and attenuate
          that autoinhibition, so the motor is inappropriately active. This is a gain-of-function lesion,
          not haploinsufficiency, which is why heterozygous missense variants are pathogenic while KIF21A
          null alleles are not a recognised cause of CFEOM.
        molecular_functions:
        - preferred_term: KIF21A microtubule motor activity
          term:
            id: GO:0003777
            label: microtubule motor activity
          modifier: GAIN_OF_FUNCTION
        cell_types:
        - preferred_term: oculomotor alpha motor neuron
          term:
            id: CL:0008038
            label: alpha motor neuron
      selected_evidence:
        snippet: We establish a gain-of-function mechanism and find that human motor or stalk mutations
          attenuate Kif21a autoinhibition, providing in vivo evidence for mammalian kinesin autoregulation.
        supports: SUPPORT
