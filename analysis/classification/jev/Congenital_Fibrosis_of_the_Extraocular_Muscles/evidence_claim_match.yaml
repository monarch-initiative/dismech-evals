            term:
              id: MONDO:0007614
              label: congenital fibrosis of extraocular muscles
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant Reinnervation of Extraocular Muscles
        biological_scale: TISSUE
        description: Denervated extraocular muscles are secondarily and inappropriately reinnervated by
          misrouted branches of the surviving oculomotor nerve, most characteristically the lateral rectus.
          Because the aberrantly supplied muscle now fires with its new parent nerve rather than with
          its normal partner, the eye makes paradoxical, synkinetic movements - upshoots and downshoots
          on attempted adduction, A-pattern deviation, and in the rarest form synergistic divergence,
          in which attempted adduction produces abduction of both eyes. This is the same aberrant-reinnervation
          logic that produces globe retraction in Duane retraction syndrome.
        biological_processes:
        - preferred_term: aberrant motor neuron axon guidance to extraocular muscle
          term:
            id: GO:0008045
            label: motor neuron axon guidance
          modifier: DYSREGULATED
        - preferred_term: neuromuscular junction development at the misinnervated muscle
          term:
            id: GO:0007528
            label: neuromuscular junction development
          modifier: DYSREGULATED
      selected_evidence:
        snippet: Additionally, when one nerve is absent, its normal target muscles attract other motor
          neurons.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/1
      context_paths:
