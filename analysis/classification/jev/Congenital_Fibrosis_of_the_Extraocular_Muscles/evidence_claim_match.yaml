        prompt: By what mechanism does a KIF21A lesion that stalls ocular motor axons also reduce optic
          nerve size?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - phenotypes#Optic Nerve Hypoplasia
        rationale: The pathophysiology curated here runs entirely through the ocular motor (efferent)
          system, yet genotyped CFEOM1 subjects show a subclinical but highly significant reduction in
          optic nerve size - a sensory pathway. No curated source proposes a mechanism connecting the
          kinesin lesion to optic nerve development, so this phenotype is deliberately left without a
          causal edge rather than wired to a motor-axon node it does not belong to.
      selected_evidence:
        snippet: Subjects with CFEOM1 exhibited subclinical but highly significant reduction from normal
          in mean optic nerve size (P < 0.001).
        supports: SUPPORT
