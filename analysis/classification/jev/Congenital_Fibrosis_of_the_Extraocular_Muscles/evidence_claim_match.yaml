            label: PHOX2A
        biological_scale: CELLULAR
        description: PHOX2A (ARIX) is a homeodomain transcription factor required to specify the midbrain
          oculomotor (nIII) and trochlear (nIV) motor nuclei. Biallelic loss-of-function variants remove
          that determinant, so the motor neuron pools that should innervate the extraocular muscles are
          never properly formed. This is the CFEOM2 route into the shared downstream lesion, and it is
          upstream of axon guidance rather than a guidance defect itself.
