      assertion_type: Discussion
      assertion:
        discussion_id: gap_cfeom_selective_oculomotor_vulnerability
        prompt: Why do ubiquitously expressed lesions in KIF21A, TUBB3, TUBB2B, and COL25A1 produce a
          phenotype largely restricted to the oculomotor and trochlear nerves rather than a generalised
          axonopathy?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#KIF21A Kinesin Autoinhibition Loss
        - pathophysiology#Beta-Tubulin Microtubule Dysfunction in Cranial Motor Neurons
        - pathophysiology#Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
        rationale: KIF21A and the beta-tubulins are expressed far more widely than the ocular motor nuclei,
          yet CFEOM1 is a clinically isolated eye movement disorder. The mouse work names this as a selective
          vulnerability of the developing oculomotor nerve to cytoskeletal perturbation but does not explain
          what confers it, and the TUBB3 alleles that do add extraocular features show the restriction
          is allele-dependent rather than absolute. Without a mechanism for the selectivity, genotype-phenotype
          prediction across the spectrum remains descriptive.
        proposed_experiments:
        - experiment_id: exp_cfeom_ocular_motor_neuron_specific_profiling
          name: Developmental-stage profiling of ocular motor versus spinal motor neurons
          description: Compare the transcriptome, cytoskeletal composition, and kinesin cargo complement
            of developing oculomotor, trochlear, abducens, and spinal motor neurons at the stage at which
            CFEOM axons stall, in wild-type and in Kif21a and Tubb3 knockin animals, to identify features
            that distinguish the vulnerable from the spared pools.
          decision_criterion: Identification of a factor whose loss or supplementation shifts the stalling
            phenotype between ocular motor and spared motor neuron populations.
          would_support:
          - pathophysiology#Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
      selected_evidence:
        snippet: highlights a selective vulnerability of the developing oculomotor nerve to perturbations
          of the axon cytoskeleton
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
