        - preferred_term: trochlear nerve development
          term:
            id: GO:0021558
            label: trochlear nerve development
          modifier: DECREASED
        cell_types:
        - preferred_term: oculomotor and trochlear alpha motor neuron
          term:
            id: CL:0008038
            label: alpha motor neuron
      selected_evidence:
        snippet: 'These disorders can arise through one of two mechanisms: (a) defective motor neuron
          specification, usually by loss of a transcription factor necessary for brainstem patterning,
          or (b) axon growth and guidance abnormalities of the oculomotor, trochlear, and abducens nerves.'
        supports: SUPPORT
