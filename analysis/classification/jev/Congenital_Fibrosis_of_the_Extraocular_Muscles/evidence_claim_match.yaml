            label: Tukel syndrome
        description: An autosomal recessive syndromic variant in which non-progressive restrictive ophthalmoplegia
          with blepharoptosis is accompanied by postaxial (ulnar) oligodactyly or oligosyndactyly of the
          hands. Described in a large consanguineous Turkish family and mapped by linkage to chromosome
