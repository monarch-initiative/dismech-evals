            id: hgnc:20772
            label: TUBB3
        description: Autosomal dominant, more variable and often asymmetric or unilateral form caused
          by heterozygous missense variants in TUBB3, the neuron-specific beta-tubulin isotype III. Unlike
          CFEOM1, the eyes are not always infraducted and one eye may be spared. Some TUBB3 alleles add
          extraocular features - intellectual and behavioural impairment, facial weakness, and a later-onset
