        context:
        - path: /pathophysiology/4
          value:
            name: Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
            biological_scale: CELLULAR
            description: The convergent cellular lesion of the cytoskeletal CFEOM subtypes. Axons of the
              oculomotor nerve, and most consistently those of its superior division that supply the levator
              palpebrae superioris and superior rectus, stall in the proximal nerve. Their growth cones
              enlarge, extend excessive filopodia, and take random trajectories instead of following their
              stereotyped path to the orbit; axons of the inferior division reach the orbit but branch
              ectopically. This selective vulnerability of the developing oculomotor nerve to perturbations
              of the axon cytoskeleton is what makes an otherwise ubiquitously expressed motor or tubulin
              lesion present as an isolated eye movement disorder.
            biological_processes:
            - preferred_term: motor neuron axon guidance
              term:
                id: GO:0008045
                label: motor neuron axon guidance
              modifier: DYSREGULATED
            - preferred_term: axon extension of the oculomotor nerve
              term:
                id: GO:0048675
                label: axon extension
              modifier: DECREASED
            cell_types:
            - preferred_term: oculomotor alpha motor neuron
              term:
                id: CL:0008038
                label: alpha motor neuron
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Aberrant Reinnervation of Extraocular Muscles
        causal_link_type: DIRECT
        description: Misrouted and ectopically branching oculomotor axons reach muscles they do not normally
          supply, most characteristically the lateral rectus.
      selected_evidence:
        snippet: Subjects with the R954W and R954Q substitutions frequently exhibited A-pattern strabismus,
          with misinnervation of the lateral rectus muscle by an oculomotor nerve branch.
        supports: SUPPORT
