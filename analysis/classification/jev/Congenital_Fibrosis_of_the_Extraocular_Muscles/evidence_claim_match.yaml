              label: congenital fibrosis of extraocular muscles
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cfeom_mondo_myopathy_classification
        prompt: Should CFEOM continue to be classified ontologically as a myopathy of extraocular muscle
          and a progressive muscular dystrophy when the evidence establishes it as a non-progressive neurogenic
          dysinnervation disorder?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Hypoplasia of the Oculomotor and Trochlear Nerves
        - pathophysiology#Denervation-Driven Extraocular Muscle Maldevelopment and Fibrosis
        rationale: MONDO:0007614 is currently placed under both myopathy of extraocular muscle and progressive
          muscular dystrophy. Human neuropathology and genotyped orbital MRI both establish that the neuronal
          lesion is primary and the myopathy secondary, and every characterisation of the disorder describes
          it as non-progressive. The ontology placement therefore asserts two things the curated mechanism
          contradicts. This entry records the discrepancy rather than silently reclassifying; resolving
          it belongs upstream in MONDO.
      selected_evidence:
        snippet: These findings suggest that neuronal disease is primary in CFEOM1, with myopathy arising
          secondary to abnormal innervation and minimal rectus pulley abnormality secondary to reduced
          EOM forces.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15671279
      reference_title: Magnetic resonance imaging evidence for widespread orbital dysinnervation in congenital
        fibrosis of extraocular muscles due to mutations in KIF21A.
      evidence_source: HUMAN_CLINICAL
      explanation: States the primary-neurogenic, secondary-myopathic ordering that conflicts with a myopathy
        or dystrophy classification.
