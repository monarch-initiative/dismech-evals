        description: The clinical endpoint of the cascade. The eyes are held in a fixed, usually infraducted
          position and cannot be raised above the horizontal midline, ocular ductions are severely restricted
          in all directions, and there is bilateral blepharoptosis with poor levator function. The deficit
          is present from birth and does not progress, which distinguishes it from the acquired and progressive
          external ophthalmoplegias. Because both eyes are effectively immobile, patients adopt a compensatory
          chin-up head posture to see through the small residual field of gaze, and are at risk of amblyopia
          and exposure keratopathy.
