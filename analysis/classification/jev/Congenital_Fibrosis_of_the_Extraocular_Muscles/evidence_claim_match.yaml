        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cfeom_genetically_unsolved_probands
        prompt: What accounts for the majority of CFEOM and related ocular congenital cranial dysinnervation
          disorder probands who remain genetically unsolved after exome and genome sequencing?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
        - pathophysiology#Hypoplasia of the Oculomotor and Trochlear Nerves
        rationale: The named CFEOM subtypes account for only part of the clinical spectrum. A large sequencing
          study of previously unsolved ocular CCDD pedigrees resolved fewer than one in ten probands and
          left most of the cohort without a pathogenic variant, so the curated gene list here is a floor
          rather than a complete account of the disorder. The locus-defined CFEOM3C subtype and the unmapped
          Tukel syndrome gene are the same gap visible from the nosological side.
        proposed_experiments:
        - experiment_id: exp_cfeom_noncoding_and_functional_replication
          name: Non-coding and functional replication of prioritized oCCDD candidates
          description: Extend sequencing of unsolved CFEOM pedigrees beyond protein-coding regions to
            regulatory and structural variation affecting the established axon-guidance genes, and functionally
            test prioritized candidate variants in ocular motor neuron models for the stalling and misrouting
            phenotype.
          decision_criterion: Replication of a candidate gene or regulatory variant in independent pedigrees
            together with a reproducible ocular motor axon phenotype in a model system.
          would_support:
          - pathophysiology#Oculomotor Axon Stalling and Aberrant Growth Cone Guidance
      selected_evidence:
        snippet: Analyses elucidated phenotypic subgroups, identified pathogenic/likely pathogenic variant(s)
          in 43 of 467 probands (9.2%), and prioritized variants of uncertain significance in 70 of 467
          additional probands (15.0%).
