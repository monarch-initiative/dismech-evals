              label: congenital fibrosis of extraocular muscles
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Denervation-Driven Extraocular Muscle Maldevelopment and Fibrosis
        biological_scale: TISSUE
        description: Deprived of their motor innervation during development, the affected extraocular
          muscles - most consistently the levator palpebrae superioris and superior rectus - are hypoplastic
          and atrophic, show increased internal nuclei and central mitochondrial clumping, and are progressively
          replaced by fibrous connective tissue. The muscles become mechanically restrictive, which is
          why forced duction testing is positive and why the ophthalmoplegia is restrictive rather than
          simply paralytic. Because the fibrosis is a consequence of denervation rather than a primary
          myopathy, no myopathic therapy addresses it.
        biological_processes:
        - preferred_term: extraocular skeletal muscle development
          term:
            id: GO:0002074
            label: extraocular skeletal muscle development
          modifier: DECREASED
        - preferred_term: skeletal muscle atrophy
          term:
            id: GO:0014732
            label: skeletal muscle atrophy
          modifier: INCREASED
        - preferred_term: collagen fibril organization in the fibrotic muscle
          term:
            id: GO:0030199
            label: collagen fibril organization
          modifier: INCREASED
        cell_types:
        - preferred_term: extraocular skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        - preferred_term: fibroblast
          term:
            id: CL:0000057
            label: fibroblast
      selected_evidence:
        snippet: In addition, increased numbers of internal nuclei and central mitochondrial clumping
          are found in other extraocular muscles, suggesting that the muscle pathology extends beyond
          the muscles innervated by the superior division of cranial nerve III.
        supports: SUPPORT
    origin:
