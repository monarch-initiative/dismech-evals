          enlargement of the globe (buphthalmos), edema, and opacification of the cornea with rupture
          of Descemet's membrane (Haab's striae), thinning of the anterior sclera and iris atrophy, anomalously
          deep anterior chamber, and structurally normal posterior segment except for progressive glaucomatous
          optic atrophy.
