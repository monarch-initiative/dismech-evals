      assertion_type: Subtype
      assertion:
        name: GLC3C
        display_name: GLC3C - 14q24-linked Primary Congenital Glaucoma
        description: A third autosomal recessive PCG locus on 14q24. LTBP2, which lies about 1.3 Mb proximal
          to the documented GLC3C interval, harbours null mutations that cause PCG; whether LTBP2 is the
          GLC3C gene itself or an adjacent second gene at the locus was left unresolved by the original
          report and is recorded here as an open question rather than a settled equivalence.
        classification: molecular
        subtype_term:
          preferred_term: glaucoma 3, primary congenital, C
          term:
            id: MONDO:0013121
            label: glaucoma 3, primary congenital, C
      selected_evidence:
        snippet: LTBP2 maps to chromosome 14q24.3 but is around 1.3 Mb proximal to the documented GLC3C
          locus. Therefore, it remains to be determined whether LTBP2 is the GLC3C gene or whether a second
          adjacent gene is also implicated in PCG.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/3
      evidence_path: /has_subtypes/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:19361779
      reference_title: Null mutations in LTBP2 cause primary congenital glaucoma.
      evidence_source: HUMAN_CLINICAL
      explanation: States the unresolved relationship between LTBP2 and the GLC3C locus that is the reason
