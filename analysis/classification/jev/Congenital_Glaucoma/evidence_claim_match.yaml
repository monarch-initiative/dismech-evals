                label: PITX2
            - preferred_term: PAX6
              term:
                id: hgnc:8620
                label: PAX6
          role: subtype
      assertion_type: Genetic
      assertion:
        name: FOXC1
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: ASD Congenital Glaucoma
        notes: A forkhead transcription factor acting in the neural-crest-derived periocular mesenchyme.
          Causes Axenfeld-Rieger spectrum disease, in which glaucoma tends to begin earlier and show broader
          variability than in the PITX2 form. Curated here as a route into congenital glaucoma; the syndrome
          itself is Axenfeld-Rieger_syndrome.yaml.
        gene_term:
          preferred_term: FOXC1
          term:
            id: hgnc:3800
            label: FOXC1
      selected_evidence:
        snippet: 128 individuals with causative variants in PITX2 or FOXC1, including 81 new cases, were
          investigated. Ocular anomalies showed significant overlap but with broader variability and earlier
          onset of glaucoma for FOXC1-related ARS.
        supports: SUPPORT
