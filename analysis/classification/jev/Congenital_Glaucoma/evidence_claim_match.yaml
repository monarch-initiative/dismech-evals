      - /disease_term
    evidence_metadata:
      reference: PMID:12624268
      reference_title: Modification of ocular defects in mouse developmental glaucoma models by tyrosinase.
      evidence_source: MODEL_ORGANISM
      explanation: Documents the pharmacological rescue whose translational validity this mismatch discussion
        questions.
