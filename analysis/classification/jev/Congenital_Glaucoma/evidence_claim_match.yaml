              label: congenital glaucoma
        context: []
      assertion_type: Subtype
      assertion:
        name: GLC3E
        display_name: GLC3E - TEK-related Primary Congenital Glaucoma
        description: 'PCG caused by heterozygous loss-of-function variants in TEK (TIE2), the endothelial
          angiopoietin receptor. Unlike the other GLC3 subtypes this one is autosomal dominant, acting
          through haploinsufficiency with markedly variable expressivity, so an obligate carrier parent
          may be unaffected or only mildly affected. The lesion is vascular-developmental: the Schlemm
          canal, a hybrid vessel with lymphatic and venous features, fails to form properly.'
        classification: molecular
        subtype_term:
          preferred_term: glaucoma 3, primary congenital, E
          term:
            id: MONDO:0014998
            label: glaucoma 3, primary congenital, E
        genes:
        - preferred_term: TEK
          term:
            id: hgnc:11724
            label: TEK
      selected_evidence:
        snippet: Primary congenital glaucoma (PCG) is a leading cause of blindness in children worldwide
          and is caused by developmental defects in 2 aqueous humor outflow structures, Schlemm's canal
          (SC) and the trabecular meshwork.
        supports: SUPPORT
    origin:
