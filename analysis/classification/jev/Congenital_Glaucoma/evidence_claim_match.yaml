  e5ebdebcd38e0592e8cefe57a153c67fac63b24f59b2e081a78c3605af02afff:
    claim:
      about:
        disease:
          name: Congenital Glaucoma
          disease_term:
            preferred_term: congenital glaucoma
            term:
              id: MONDO:0020366
              label: congenital glaucoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cyp1b1_mouse_phenotype_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: How faithfully does the Cyp1b1-null mouse model the human CYP1B1 congenital glaucoma phenotype,
          given that its severity depends on tyrosinase genotype and can be pharmacologically rescued?
        attaches_to:
        - pathophysiology#CYP1B1 Deficiency in the Developing Anterior Segment
        rationale: Cyp1b1-null mice do develop ocular drainage structure abnormalities resembling human
          disease, so the model is informative. But the magnitude of that dysgenesis is set by a second
          locus, Tyr, and the severe phenotype in doubly deficient eyes is alleviated by administering
          the tyrosinase product L-DOPA. That makes the mouse phenotype a property of a particular strain
          background as much as of CYP1B1 loss. Whether an analogous modifier axis operates in humans
          is unknown, and it bears directly on how much weight the mouse rescue result can carry as a
          therapeutic lead. Human CYP1B1 disease does show incomplete penetrance and variable expressivity,
          which is consistent with modifiers existing but does not identify them or establish that the
          tyrosinase pathway is among them.
        proposed_experiments:
        - experiment_id: exp_cg_tyr_modifier_founder_cohort
          name: Test the tyrosinase/L-DOPA axis as a modifier in human CYP1B1 congenital glaucoma
          description: Genotype pigmentation-pathway loci, TYR foremost, in a cohort of patients homozygous
            for the same founder CYP1B1 allele but discordant for disease severity. A founder population
            is required so that the CYP1B1 allele is held constant while severity varies; the Slovakian
            Roma and Saudi cohorts are the natural settings.
      selected_evidence:
        snippet: The severe dysgenesis in eyes lacking both CYP1B1 and TYR was alleviated by administration
          of the tyrosinase product dihydroxyphenylalanine (l-dopa).
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
