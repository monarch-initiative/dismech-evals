            label: LTBP2
        role: trigger
        biological_scale: MOLECULAR
        description: LTBP2, the largest member of the latent TGF-beta binding protein family, is an extracellular
          matrix protein with homology to the fibrillins and a probable role as a structural component
          of microfibrils. Biallelic null mutations cause congenital glaucoma in consanguineous Pakistani
          and Roma families. LTBP2 localises to the anterior segment at the ciliary body and particularly
          the ciliary process, and the proposal is that its loss compromises the structural integrity
          of the anterior chamber and ciliary muscle tone rather than disturbing a signalling cascade
          -- making this an extracellular-matrix route to outflow failure, mechanistically parallel to
          but separate from the metabolic (CYP1B1) and vascular (TEK/ANGPT1) routes.
