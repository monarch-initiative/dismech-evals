        - path: /animal_models/2
          value:
            name: Zebrafish cyp1b1 knockout
            species: Zebrafish
            genotype: cyp1b1 null
            publication: PMID:39890032
            description: The wh5 cyp1b1 mutant line (Cyp1b1 truncated at 388 aa by an early stop codon),
              the model behind the geo:GSE272589 dataset curated in this entry. It is included specifically
              because it does NOT reproduce the glaucoma phenotype, which is the structural counterpart
              of the cyp1b1_mouse_phenotype_fidelity discussion. An independently generated cyp1b1 knockout
              line (Alexandre-Moreno et al. 2021) is cited alongside it for the histological angle and
              corneal result, which the wh5 study did not itself measure.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Trabeculodysgenesis and Congenital Outflow Obstruction
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: 'Zebrafish cyp1b1 loss does not produce the angle lesion this node describes. A separately
          generated cyp1b1 knockout line was examined histologically and showed no glaucoma-related defect
          of the anterior chamber angle or cornea, and its authors concluded that zebrafish are not an
          adequate model of cyp1b1-associated glaucoma. The wh5 line curated here was characterised behaviourally,
          metabolomically and transcriptomically rather than morphologically: it is abnormal -- larvae
          are hyperactive on a vision-based assay and adult eyes carry 26 differentially abundant metabolites
          -- but its own authors state the findings could not point to specific ocular defects over other
          neurobehavioral phenotypes. The model is informative about Cyp1b1 metabolic function but is
          not a phenocopy of congenital glaucoma, and must not be cited as evidence that CYP1B1 loss produces
          angle dysgenesis.'
        limitations: 'Species divergence in the Cyp1 family is the wh5 authors'' own proposed explanation:
          zebrafish carry Cyp1c and Cyp1d enzymes absent from mammals, so zebrafish Cyp1b1 may not parallel
          mammalian CYP1B1 function. The negative result therefore bounds what the zebrafish system can
          be used for rather than casting doubt on the human gene-disease relationship. Note also that
          the morphological negative result comes from a different knockout line than the wh5 line tied
          to this entry''s dataset, and that wh5 mutants are not phenotypically normal -- they show altered
          responses to visual stimuli whose ocular versus neurological origin was not resolved.'
      selected_evidence:
        snippet: we did not observe ocular glaucoma-related histological defects associated with complete
          cyp1b1 LoF in zebrafish, which might be due to developmental species differences and shows that
          zebrafish are not adequate to model cyp1b1-associated glaucoma
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/2/modeled_mechanisms/0
      evidence_path: /animal_models/2/modeled_mechanisms/0/evidence/0
