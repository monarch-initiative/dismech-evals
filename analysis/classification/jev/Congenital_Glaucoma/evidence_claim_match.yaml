        description: 'The branch that has no counterpart in the glaucoma_optic_neuropathy module, because
          it depends on a property of the infant eye rather than on the pressure itself. Before about
          three years of age the sclera and cornea are still elastic, so sustained ocular hypertension
          stretches them: the globe enlarges (buphthalmos), the corneal diameter increases beyond roughly
          12 mm (megalocornea), the anterior sclera thins, and the axial elongation produces a progressive
          myopic shift. This node covers the biomechanical stretch alone; the corneal consequences of
          that stretch are the separate downstream node, because they are a distinct event with a distinct
          location and are what makes the eye cloudy rather than merely large.'
