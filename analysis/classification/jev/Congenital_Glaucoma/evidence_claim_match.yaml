      assertion:
        name: Neural Crest-Derived Periocular Mesenchyme Maldevelopment
        genes:
        - preferred_term: FOXC1
          term:
            id: hgnc:3800
            label: FOXC1
        - preferred_term: PITX2
          term:
            id: hgnc:9005
            label: PITX2
        - preferred_term: PAX6
          term:
            id: hgnc:8620
            label: PAX6
        conforms_to: anterior_segment_dysgenesis#Disrupted Periocular Mesenchyme Migration and Differentiation
        role: trigger
        biological_scale: CELLULAR
        description: 'The trabecular meshwork, corneal endothelium and stroma, iris stroma, and ciliary
          body all derive from cranial neural crest cells that migrate around the optic cup as periocular
          mesenchyme. Congenital glaucoma is at root a neurocristopathy of that migration and differentiation
          programme: when the periocular mesenchyme fails to remodel normally into the drainage apparatus,
          the outflow structures are abnormal from the outset rather than degenerating later. This is
          the common developmental origin shared by primary congenital glaucoma and the anterior segment
          dysgenesis syndromes, and it explains why the same transcription factors (FOXC1, PITX2, PAX6)
          recur across both.'
        locations:
        - preferred_term: Periocular Mesenchyme
          term:
            id: UBERON:0004017
            label: periocular mesenchyme
        - preferred_term: Iridocorneal Angle
          term:
            id: UBERON:0006206
            label: iridocorneal angle
        cell_types:
        - preferred_term: Migratory Cranial Neural Crest Cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
        biological_processes:
        - preferred_term: Neural Crest Cell Migration
          term:
            id: GO:0001755
            label: neural crest cell migration
          modifier: ABNORMAL
        - preferred_term: Trabecular Meshwork Development
          term:
            id: GO:0002930
            label: trabecular meshwork development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Indeed, abnormalities in neural crest development cause craniofacial defects and ocular
          anomalies, such as Axenfeld-Rieger syndrome and primary congenital glaucoma.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
