          value:
            name: ASD Congenital Glaucoma
            display_name: Congenital Glaucoma Secondary to Non-Acquired Anterior Segment Dysgenesis
            description: Congenital and infantile glaucoma occurring as a complication of a non-acquired
              ocular anomaly of the anterior segment -- principally the Axenfeld-Rieger spectrum (PITX2,
              FOXC1), Peters anomaly (PAX6, FOXC1, PITX2, CYP1B1, B3GLCT and others), and PAX6-related
              aniridia. In the CGRN scheme these are secondary rather than primary childhood glaucomas,
              and in genomically characterised childhood-glaucoma cohorts they outnumber PCG. The underlying
              syndromes have their own dismech entries (Axenfeld-Rieger_syndrome, Peters_Plus_Syndrome);
              this subtype exists to hold the shared route by which their angle anomaly becomes congenital
              glaucoma, and the mechanism is not always the same as in PCG -- adhesional angle closure
              can operate alongside, or instead of, trabeculodysgenesis.
            classification: clinical_phenotype
            genes:
            - preferred_term: FOXC1
              term:
                id: hgnc:3800
                label: FOXC1
            - preferred_term: PITX2
