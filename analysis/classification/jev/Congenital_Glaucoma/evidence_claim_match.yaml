      assertion_type: Pathophysiology
      assertion:
        name: Optic Nerve Head Degeneration and Glaucomatous Cupping
        conforms_to: glaucoma_optic_neuropathy#Optic Nerve Degeneration and Neuroinflammation
        role: effector
        biological_scale: TISSUE
        description: 'Loss of ganglion cell axons remodels the optic nerve head into the glaucomatous
          cup. Congenital disease qualifies this step in one important way: optic disc cupping in an infant
          is partially reversible once intraocular pressure is controlled, which is not true of established
          adult cupping. Reversal reflects recovery of the compliant immature lamina cribrosa rather than
          regrowth of lost axons, so a reversing cup is evidence of pressure control and must NOT be read
          as recovered ganglion cells. This node exists separately from the ganglion cell node precisely
          so that the reversible tissue change and the irreversible cell loss are not conflated.'
        locations:
        - preferred_term: Optic Disc
          term:
            id: UBERON:0001783
            label: optic disc
      selected_evidence:
        snippet: however optic disc cupping can be reversible with treatment
        supports: SUPPORT
