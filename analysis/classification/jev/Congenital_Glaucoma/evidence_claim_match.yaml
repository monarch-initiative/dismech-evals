              label: congenital glaucoma
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cyp1b1_expression_site
        kind: CONTROVERSY
        status: OPEN
        prompt: Is CYP1B1 expressed in the trabecular meshwork itself, or does it act on the developing
          outflow apparatus from the ciliary body and neuroepithelium?
        attaches_to:
        - pathophysiology#CYP1B1 Deficiency in the Developing Anterior Segment
        rationale: 'The two published answers are directly contradictory. The original GLC3A mapping paper
          reports demonstrating CYP1B1 expression in trabecular meshwork cells; a later cohort study states
          expression is found in fetal and adult ciliary body and neuroepithelium but not in the trabecular
          meshwork, and a 2024 review describes trabecular expression as controversial. The disagreement
          is mechanistically load-bearing rather than a bookkeeping detail: cell-autonomous action within
          the meshwork implies a different therapeutic target from a diffusible metabolite generated elsewhere
          in the anterior segment and acting on the meshwork at a distance. This entry therefore records
          the CYP1B1 node''s mechanism as an unresolved metabolic route rather than asserting a site of
          action, and the expression evidence is marked PARTIAL.'
        proposed_experiments:
        - experiment_id: exp_cg_cyp1b1_expression_scrnaseq
          name: Single-cell transcriptomic mapping of CYP1B1 in the developing human anterior segment
          description: Single-cell or spatial transcriptomic profiling of human fetal iridocorneal angle
            across the developmental window in which the meshwork forms, reporting CYP1B1 per annotated
            cell type, would settle whether trabecular expression exists at the developmentally relevant
            stage. Both conflicting reports rest on bulk or adult tissue, where a transient fetal signal
            in a small cell population could be missed.
      selected_evidence:
        snippet: CYP1B1 gene has previously been mapped within the GLC3A candidate region and its expression
          in the trabecular meshwork cells has been demonstrated in this study.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
