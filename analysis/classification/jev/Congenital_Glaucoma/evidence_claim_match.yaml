  e17b2296448b678bf46fb2d90788bcf61ad887b5e4d58546c675424c3287f1a6:
    claim:
      about:
        disease:
          name: Congenital Glaucoma
          disease_term:
            preferred_term: congenital glaucoma
            term:
              id: MONDO:0020366
              label: congenital glaucoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Angiopoietin-TEK Signaling Insufficiency and Schlemm Canal Hypoplasia
        genes:
        - preferred_term: TEK
          term:
            id: hgnc:11724
            label: TEK
        - preferred_term: ANGPT1
          term:
            id: hgnc:484
            label: ANGPT1
        role: trigger
        biological_scale: MOLECULAR
        description: A mechanistically distinct route to the same outflow failure runs through the vascular
          development of Schlemm canal rather than through the trabecular mesenchyme. Schlemm canal is
          a hybrid vessel with lymphatic and venous features, and its formation depends on angiopoietin
          ligand signalling through the endothelial receptor tyrosine kinase TEK (TIE2). Heterozygous
          TEK loss-of-function variants cause congenital glaucoma by haploinsufficiency, with several
          different cellular routes to that shared endpoint -- absent protein production, aggregation,
          accelerated proteasomal degradation, mislocalisation, and blunted ligand responsiveness. Rare
          variants in the ligand ANGPT1 act on the same axis from the other side. Because the defect is
          gene-dosage-sensitive rather than all-or-none, expressivity is variable and inheritance is autosomal
          dominant, unlike the recessive CYP1B1 and LTBP2 routes.
        locations:
        - preferred_term: Canal of Schlemm
          term:
            id: UBERON:0004029
            label: canal of Schlemm
        cell_types:
        - preferred_term: Schlemm's Canal Endothelial Cell
          term:
            id: CL:4033097
            label: Schlemm's canal endothelial cell
        biological_processes:
        - preferred_term: Tie Signaling Pathway
          term:
            id: GO:0048014
            label: Tie signaling pathway
          modifier: DECREASED
        - preferred_term: Vasculature Development
          term:
            id: GO:0001944
            label: vasculature development
          modifier: ABNORMAL
        genetic_context:
          gene:
            preferred_term: TEK
            term:
              id: hgnc:11724
              label: TEK
          functional_impact_category: LOSS_OF_FUNCTION
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
      selected_evidence:
        snippet: Herein, we identified rare TEK variants in 10 of 189 unrelated PCG families and demonstrated
          that each mutation results in haploinsufficiency due to protein loss of function.
        supports: SUPPORT
