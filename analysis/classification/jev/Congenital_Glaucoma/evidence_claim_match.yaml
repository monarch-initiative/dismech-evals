            term:
              id: MONDO:0020366
              label: congenital glaucoma
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Examination Under Anesthesia
        description: The diagnostic act in congenital glaucoma is a full examination under general anaesthesia,
          because an infant cannot cooperate with tonometry, gonioscopy, corneal diameter measurement,
          axial length measurement, or disc examination while awake. The diagnosis rests on the combination
          -- elevated intraocular pressure, globe enlargement, increased corneal diameter, corneal clouding,
          Descemet membrane breaks, and an anomalously deep anterior chamber -- rather than on any single
          measurement, which matters because anaesthesia itself perturbs the pressure reading.
      selected_evidence:
        snippet: A proper diagnostic evaluation under anesthesia is advisable for all children who do
          not cooperate for an office examination.
        supports: SUPPORT
