        description: 'Second-line surgery after failed angle incision: trabeculectomy, usually with an
          antifibrotic agent because the pediatric healing response scars a bleb aggressively, or implantation
          of a glaucoma drainage device. Both create an outflow route that bypasses the natural drainage
          pathway entirely rather than repairing it. Cyclodestructive procedures, which reduce aqueous
          production instead of improving egress, are reserved for eyes with poor visual potential.'
