              id: MONDO:0020366
              label: congenital glaucoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Deprivation and Refractive Amblyopia
        role: effector
        biological_scale: ORGANISM
        description: 'A second, non-glaucomatous route to permanent vision loss that is specific to disease
          onset during the critical period of visual development. Corneal opacification degrades the retinal
          image (deprivation), and the axial elongation of an enlarging globe -- often asymmetric between
          the two eyes -- produces high myopia and anisometropia (refractive). Either can prevent normal
          cortical visual development even after intraocular pressure is fully controlled and the optic
          nerve is spared, which is why management of congenital glaucoma is not complete when pressure
          is normalised: refractive correction and amblyopia therapy are required in parallel.'
      selected_evidence:
        snippet: Myopia is common among children with PCG, and appropriate optical refractive correction
          in the form of glasses or contact lenses should be provided. Amblyopia therapy should be instituted
          to ensure overall visual development in the early developmental years.
        supports: SUPPORT
