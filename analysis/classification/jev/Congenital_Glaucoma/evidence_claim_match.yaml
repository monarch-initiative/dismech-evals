        conforms_to: glaucoma_optic_neuropathy#Trabecular Meshwork Outflow Dysfunction
        role: amplifier
        biological_scale: TISSUE
        description: 'The convergence point of the primary congenital routes. Instead of the acquired
          juxtacanalicular extracellular matrix accumulation and trabecular cell loss that raise outflow
          resistance in adult open-angle glaucoma, the congenital lesion is an angle that never matured:
          gonioscopy shows an immature appearance of arrested development, with a high flat iris insertion,
          peripheral scalloping, and circumferential iris vessels. Resistance to aqueous egress is therefore
          abnormal from birth. This node substitutes the disorder-specific developmental lesion into the
          module''s conserved outflow-dysfunction step; the module''s own trabecular-ECM-accumulation
          annotation is deliberately not copied here, because the mechanism is dysgenetic rather than
          degenerative.'
        locations:
        - preferred_term: Eye Trabecular Meshwork
          term:
            id: UBERON:0005969
            label: eye trabecular meshwork
        - preferred_term: Iridocorneal Angle
