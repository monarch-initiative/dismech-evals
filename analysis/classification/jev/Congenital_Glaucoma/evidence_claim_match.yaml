  7de4ad8dcba93237b265cd1544f2d92b207fa2a81910661f07dc22e4ccef0eeb:
    claim:
      about:
        disease:
          name: Congenital Glaucoma
          disease_term:
            preferred_term: congenital glaucoma
            term:
              id: MONDO:0020366
              label: congenital glaucoma
        context: []
      assertion_type: Subtype
      assertion:
        name: GLC3A
        display_name: GLC3A - CYP1B1-related Primary Congenital Glaucoma
        description: Autosomal recessive PCG mapping to 2p21 and caused by biallelic CYP1B1 variants.
          CYP1B1 is by far the most frequently implicated gene in congenital glaucoma worldwide, though
          its share of cases is strongly population-dependent, being highest in consanguineous and founder
          populations and much lower in outbred cohorts. Penetrance is incomplete and expressivity is
          variable, so mildly affected relatives of a proband can be missed.
        classification: molecular
        subtype_term:
          preferred_term: glaucoma 3A
          term:
            id: MONDO:0009277
            label: glaucoma 3A
        genes:
        - preferred_term: CYP1B1
          term:
            id: hgnc:2597
            label: CYP1B1
      selected_evidence:
        snippet: The mutations detected in the affected members of these families were not present in
          470 chromosomes from randomly selected normal individuals, thus strongly suggesting that CYP1B1
          is the gene for the GLC3A locus on 2p21.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9097971
      reference_title: Identification of three different truncating mutations in cytochrome P4501B1 (CYP1B1)
        as the principal cause of primary congenital glaucoma (Buphthalmos) in families linked to the
        GLC3A locus on chromosome 2p21.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes CYP1B1 as the GLC3A gene, which is the definition of this subtype.
