  60d0ab7f556cbdf3de31746882869295b03d47e195ae60435c6a873cd198835d:
    claim:
      about:
        disease:
          name: Congenital Glaucoma
          disease_term:
            preferred_term: congenital glaucoma
            term:
              id: MONDO:0020366
              label: congenital glaucoma
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Secondary Angle Obstruction in Anterior Segment Dysgenesis
        conforms_to: glaucoma_optic_neuropathy#Trabecular Meshwork Outflow Dysfunction
        role: amplifier
        biological_scale: TISSUE
        description: 'The parallel route taken by congenital glaucoma arising in a non-acquired anterior
          segment anomaly. Here outflow can fail by two mechanisms that are not interchangeable: trabeculodysgenesis
          of the kind seen in primary congenital glaucoma, and adhesional angle closure in which iridocorneal
          or lenticulocorneal adhesions physically obliterate the drainage angle. Which operates depends
          on the anomaly and its severity -- in a small single-centre Peters anomaly series glaucoma was
          absent in eyes with an isolated posterior corneal defect and present in the majority of eyes
          with lens abnormalities, though the reported trend across stages did not reach statistical significance
          in that 31-eye series, so a severity gradient is suggested rather than established. In PAX6-related
          aniridia the mechanism remains genuinely unsettled, with congenital trabecular dysfunction,
          progressive angle closure, and postoperative ocular hypertension all proposed. This distinction
          matters therapeutically: angle incision surgery addresses a dysgenetic meshwork but not an obliterated
          angle.'
        locations:
        - preferred_term: Iridocorneal Angle
          term:
            id: UBERON:0006206
            label: iridocorneal angle
        - preferred_term: Cornea
          term:
            id: UBERON:0000964
            label: cornea
        biological_processes:
        - preferred_term: Camera-Type Eye Development
          term:
            id: GO:0043010
            label: camera-type eye development
          modifier: ABNORMAL
      selected_evidence:
        snippet: The pathogenesis of glaucoma secondary to Peters anomaly is thought to result from trabeculodysgenesis
          or angle closure mechanisms associated with iridocorneal and lenticulocorneal adhesions
        supports: SUPPORT
