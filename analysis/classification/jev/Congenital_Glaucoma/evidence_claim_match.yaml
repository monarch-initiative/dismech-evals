        description: 'Impaired aqueous egress raises intraocular pressure in the first weeks to months
          of life. The pressure itself is the same stressor as in the module''s conserved chain, but its
          consequences differ because it is applied to an immature eye: it acts both on the optic nerve
          head, driving retinal ganglion cell loss, and on the still-distensible coats of the globe, which
          the adult eye cannot do. The two downstream branches from this node -- neurodegenerative and
          biomechanical -- are what make congenital glaucoma clinically distinct.'
