  511fe81bf7fb1bdaf3e0d64019213e0bb19ebe8a900957cf10704b07a58fad04:
    claim:
      about:
        disease:
          name: Congenital Glaucoma
          disease_term:
            preferred_term: congenital glaucoma
            term:
              id: MONDO:0020366
              label: congenital glaucoma
        context: []
      assertion_type: Treatment
      assertion:
        name: Angle Surgery (Goniotomy or Trabeculotomy)
        description: 'Incision of the dysgenetic trabecular meshwork to open a direct route from the anterior
          chamber into Schlemm canal. Goniotomy requires a clear cornea to visualise the angle; trabeculotomy
          ab externo does not, and is therefore preferred when the cornea is edematous, which is common
          at presentation in regions where disease is advanced at diagnosis. This is first-line surgery
          in primary congenital glaucoma and is mechanism-directed rather than symptomatic -- it addresses
          the dysgenetic meshwork itself. Note the corollary: where the angle is obliterated by adhesions
          rather than dysgenetic, as in some Peters anomaly eyes, angle incision is much less effective.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: surgical procedure
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: Angle surgery is usually the first-line treatment in the surgical management of primary
          congenital glaucoma because it has a relatively good success rate with a low complication rate.
        supports: SUPPORT
    origin:
      assertion_path: /treatments/0
      evidence_path: /treatments/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26886124
      reference_title: Updates on the Surgical Management of Pediatric Glaucoma.
      evidence_source: OTHER
      explanation: Establishes angle surgery as first-line, with the risk-benefit reasoning. Evidence
        source is OTHER because this is a surgical review.
