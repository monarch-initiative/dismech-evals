          term:
            id: GO:0002930
            label: trabecular meshwork development
          modifier: ABNORMAL
      selected_evidence:
        snippet: The autosomal recessive disorder primary congenital glaucoma (PCG) is caused by unknown
          developmental defect(s) of the trabecular meshwork and anterior chamber angle of the eye.
