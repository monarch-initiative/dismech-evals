      assertion_type: Subtype
      assertion:
        name: PCG
        display_name: Primary Congenital Glaucoma (nonsyndromic)
        description: Isolated, nonsyndromic developmental glaucoma with onset from birth to age three,
          caused by an isolated dysgenesis of the trabecular meshwork and iridocorneal angle with no other
          ocular or systemic anomaly. This is the parent of the numbered GLC3 subtypes below and the most
          common childhood glaucoma. Inheritance is usually autosomal recessive with incomplete penetrance
          and a strong association with consanguinity, but the majority of cases worldwide are sporadic.
        classification: clinical_phenotype
        subtype_term:
          preferred_term: primary congenital glaucoma
          term:
            id: MONDO:0000365
            label: primary congenital glaucoma
      selected_evidence:
        snippet: Primary congenital glaucoma (PCG) is isolated, non-syndromic glaucoma that occurs in
          the first three years of life and is a major cause of childhood blindness.
        supports: SUPPORT
