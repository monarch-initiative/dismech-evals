          in that 31-eye series, so a severity gradient is suggested rather than established. In PAX6-related
          aniridia the mechanism remains genuinely unsettled, with congenital trabecular dysfunction,
          progressive angle closure, and postoperative ocular hypertension all proposed. This distinction
          matters therapeutically: angle incision surgery addresses a dysgenetic meshwork but not an obliterated
          angle.'
