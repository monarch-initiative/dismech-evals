        role: consequence
        biological_scale: ORGANISM
        description: 'The clinical endpoint, reached by two converging routes -- irreversible ganglion
          cell and axon loss, and amblyopia from deprivation and anisometropia. Childhood glaucoma accounts
          for roughly 5% of childhood blindness worldwide. The outcome is not fixed: with prompt diagnosis
          and effective pressure control the disease is frequently stationary and useful vision is retained,
          so the endpoint here is contingent on treatment timing rather than an inevitable consequence
          of the genotype.'
