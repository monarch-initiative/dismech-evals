            term:
              id: MONDO:0012393
              label: congenital brain dysgenesis due to glutamine synthetase deficiency
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide, published case reports
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'Five molecularly confirmed patients were found in the literature searched for this entry:
          three homozygous for missense variants (p.Arg324Cys, p.Arg341Cys, p.Arg324Ser), a fourth homozygous
          for p.Arg41Cys, and a fifth with a homozygous whole-gene deletion. Two further siblings, reported
          as compound heterozygous for p.Arg106* and p.Lys14Asn, bring the count to seven. Neither of
          their variants was functionally tested, and unlike the earlier patients they had normal plasma
          glutamine, normal baseline ammonia and unremarkable neuroimaging, with hyperammonemia appearing
          only on valproate; the authors suggest only that the nonsense-plus-missense genotype may have
          produced a non-lethal phenotype. They were also the first in whom valproate precipitated hyperammonemic
          encephalopathy. The minireview argues the disorder is underdiagnosed because low amino acid
          values attract less attention than raised ones.'
      selected_evidence:
        snippet: 'This case report describes 2 siblings with myoclonic epilepsy who had novel mutations
          in the glutamine synthetase (GLUL) gene: c.316C>T, p.(Arg106*) and c.42G>C, p.(Lys14Asn).'
        supports: SUPPORT
    origin:
