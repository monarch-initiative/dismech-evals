  92f3321756cb11c091acdc4658456e469caf32bc55c83fdbcb7e9c18c41598bc:
    claim:
      about:
        disease:
          name: Congenital Glutamine Synthetase Deficiency
          disease_term:
            preferred_term: congenital glutamine synthetase deficiency
            term:
              id: MONDO:0012393
              label: congenital brain dysgenesis due to glutamine synthetase deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: GLUL
        gene_term:
          preferred_term: GLUL
          term:
            id: hgnc:4341
            label: GLUL
        relationship_type: CAUSATIVE
        notes: Reported alleles are homozygous missense variants at catalytic-site arginines, one homozygous
          whole-gene deletion that also removed RNASEL, and one compound-heterozygous nonsense-plus-missense
          genotype shared by two siblings. Severity tracks residual activity. Heterozygous start-loss
          and 5' UTR splice variants cause the separate dominant disorder DEE116 by stabilizing the enzyme,
          the opposite effect.
        variants:
        - name: p.Arg324Cys (c.970C>T)
          description: Homozygous in the first index patient, who died on day 2. The mutant retained about
            12% of wild-type activity in immortalized lymphocytes. Arg324 forms a salt bridge with the
            ATP-derived beta-phosphate, so its loss impairs ATP binding.
        - name: p.Arg341Cys (c.1021C>T)
          description: Homozygous in the second index patient, who died at four weeks. Activity in transfected
            COS7 cells was about 58% of wild type; Arg341 is thought to be needed for the helix closure
            that allows glutamate binding.
        - name: p.Arg324Ser (c.970C>A)
          description: Homozygous in the longest-surviving patient (six years). Molecular simulation suggests
            water-mediated contacts to ATP partially offset the lost salt bridge, consistent with higher
            residual activity than R324C.
        - name: p.Arg41Cys (c.121C>T)
          description: Homozygous in a girl with seizures from five months, microcephaly and hypotonia,
            mild hyperammonemia and plasma glutamine near the normal range.
        - name: Homozygous GLUL whole-gene deletion
          description: Diagnosed prenatally; the deletion also removed RNASEL and was associated with
            immune dysfunction in the fetus. It shows total absence of GLUL is compatible with development
            beyond the embryonic period in humans.
        - name: p.Arg106* / p.Lys14Asn (compound heterozygous)
          description: Found in two Filipino sisters (21 and 12 years old at report), compound heterozygous
            for a c.316C>T p.(Arg106*) nonsense allele and a c.42G>C p.(Lys14Asn) missense allele, bi-parentally
            inherited. Neither variant was functionally tested. Unlike the homozygous patients they had
            normal plasma glutamine, normal baseline ammonia and unremarkable neuroimaging, with hyperammonemic
            encephalopathy appearing only on valproate; the authors suggest the nonsense-plus-missense
            genotype may retain more residual activity.
      selected_evidence:
        snippet: Each infant had a homozygous mutation in the glutamine synthetase gene (R324C and R341C).
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
