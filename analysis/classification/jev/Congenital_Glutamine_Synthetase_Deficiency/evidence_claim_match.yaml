        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Astrocyte-Neuron Glutamine-Glutamate-GABA Cycle Failure
        description: Astrocytic glutamine synthetase converts glutamate taken up from synapses into glutamine,
          which neurons use to remake glutamate and GABA. With the enzyme impaired, brain glutamine is
          very low and the neurotransmitter pools cannot be replenished; glutamate is not raised in plasma
          or CSF and was slightly low on spectroscopy, so excitotoxic glutamate excess is not the documented
          mechanism. Cortex-specific Glul knockout mice show low glutamate, glutamine and GABA, astrogliosis
          and then spontaneous seizures.
        mechanism_confidence: PROVISIONAL
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        chemical_entities:
