  f3a2a092d3da855240ba132d9c5acc2fe039b5a644789217767042bec8048ebb:
    claim:
      about:
        disease:
          name: Congenital Glutamine Synthetase Deficiency
          disease_term:
            preferred_term: congenital glutamine synthetase deficiency
            term:
              id: MONDO:0012393
              label: congenital brain dysgenesis due to glutamine synthetase deficiency
        context:
        - path: /treatments/2
          value:
            name: Carglumic acid
            action_category: THERAPEUTIC
            description: In the two compound-heterozygous siblings, valproate controlled seizures but
              precipitated hyperammonemic encephalopathy; carglumic acid, a CPS-I activator, lowered plasma
              ammonia while valproate was continued, with ammonia falling within hours and tracking carglumic-acid
              dosing. It bypasses the deficient glutamine-synthetase ammonia-fixing step by opening the
              urea cycle, so it manages the hyperammonemia arm rather than correcting the enzyme defect.
              The authors could not determine whether carglumic acid works by relieving valproate's inhibition
              of residual glutamine synthetase or by driving the urea cycle via CPS-I directly, since
              valproate metabolites could not be measured.
            therapeutic_modality: SMALL_MOLECULE
            treatment_term:
              preferred_term: Pharmacotherapy
              term:
                id: NCIT:C15986
                label: Pharmacotherapy
              therapeutic_agent:
              - preferred_term: carglumic acid
                term:
                  id: CHEBI:71028
                  label: carglumic acid
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Impaired High-Affinity Ammonia Clearance
        treatment_effect: BYPASSES
        description: Carglumic acid stimulates CPS-I, opening the urea cycle as an alternative ammonia-removal
          route that does not depend on glutamine synthetase.
      selected_evidence:
        snippet: Due to the inefficiency of GS in our patients, they need an active urea cycle to effectively
          remove a sufficient amount of ammonia to prevent encephalopathy.
        supports: SUPPORT
