        description: Loss of the only glutamine-synthesizing enzyme leaves the fetus and infant short
          of glutamine. Fetal brain development is starved of a substrate it needs for proliferation and
          differentiation, and postnatally the astrocyte-neuron glutamine-glutamate-GABA cycle cannot
          be replenished. Astrocyte-specific Glul knockout mice die of a 14-fold fall in cortical glutamine
          with only a 1.6-fold rise in ammonia, which places glutamine lack rather than ammonia at the
          centre of the brain phenotype.
