          glutamine synthetase. Glutamine synthetase has a far lower Km for ammonia than the urea-cycle
          enzymes, so it is the high-affinity, low-capacity half of ammonia detoxification; its loss produces
          chronic moderate rather than catastrophic hyperammonemia.
        mechanism_confidence: ESTABLISHED
        biological_scale: ORGANISM
