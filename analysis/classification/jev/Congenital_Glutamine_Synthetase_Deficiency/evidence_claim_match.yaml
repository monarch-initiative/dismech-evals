          fibroblasts, leukocytes and immortalized blood stem cells are NAD+ depleted and are rescued
          by glutamine or nicotinamide. The necrolytic, pellagra-like erythema seen in two patients during
          very low glutamine periods is the clinical sign this would predict. The contribution to the
          neurological phenotype is unmeasured.
