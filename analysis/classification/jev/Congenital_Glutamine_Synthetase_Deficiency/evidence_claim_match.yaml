        hypothesis_label: Chronic hyperammonemia as a contributing neurotoxin
        status: ALTERNATIVE
        description: 'Loss of the high-affinity ammonia-clearing step causes chronic moderate hyperammonemia,
          which is neurotoxic through oxidative stress, energy failure and disturbed astrocytic potassium
          buffering. This arm is real but not sufficient: mice lacking only hepatic glutamine synthetase
          are hyperammonemic with behavioral and synaptic-plasticity deficits and no malformation. It
          is therefore treated as contributing to the postnatal encephalopathy rather than explaining
          the prenatal brain dysgenesis.'
      selected_evidence:
        snippet: a general impairment of astrocyte function due to glutamine deficiency and hyperammonemia
          in the patients may lead to a failure of the regulation of neuronal homeostasis and disturbance
          of the excitation-inhibition balance
        supports: SUPPORT
