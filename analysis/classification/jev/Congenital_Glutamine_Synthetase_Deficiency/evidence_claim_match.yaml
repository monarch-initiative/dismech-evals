          term:
            id: CHEBI:18050
            label: L-glutamine
          modifier: DECREASED
        - preferred_term: gamma-aminobutyric acid
          term:
            id: CHEBI:16865
            label: gamma-aminobutyric acid
          modifier: DECREASED
      selected_evidence:
        snippet: the concentrations of glutamate were not elevated in the plasma or CSF of patients with
          GS deficiency, and were even slightly decreased on MRS in patient 3
        supports: SUPPORT
