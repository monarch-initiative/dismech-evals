      assertion_type: Treatment
      assertion:
        name: Carglumic acid
        action_category: THERAPEUTIC
        description: In the two compound-heterozygous siblings, valproate controlled seizures but precipitated
          hyperammonemic encephalopathy; carglumic acid, a CPS-I activator, lowered plasma ammonia while
          valproate was continued, with ammonia falling within hours and tracking carglumic-acid dosing.
          It bypasses the deficient glutamine-synthetase ammonia-fixing step by opening the urea cycle,
          so it manages the hyperammonemia arm rather than correcting the enzyme defect. The authors could
          not determine whether carglumic acid works by relieving valproate's inhibition of residual glutamine
          synthetase or by driving the urea cycle via CPS-I directly, since valproate metabolites could
          not be measured.
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: carglumic acid
            term:
              id: CHEBI:71028
              label: carglumic acid
      selected_evidence:
        snippet: Addition of carglumic acid reduced ammonia levels but drug coverage was declined.
