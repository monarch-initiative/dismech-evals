      assertion_type: Pathophysiology
      assertion:
        name: PRKD1 Kinase Dysfunction
        biological_scale: MOLECULAR
        description: Heterozygous PRKD1 variants alter the activity of protein kinase D1, a diacylglycerol/PKC-activated
          serine/threonine kinase. The recurrent de novo missense variants that characterize the dominant
          syndrome behave as gain-of-function alleles, while biallelic truncating variants (which cause
          a related recessive truncus arteriosus phenotype) and some heterozygous loss-of-function alleles
          reduce kinase function. Both perturbations disrupt PRKD1-dependent developmental signaling.
        genes:
        - preferred_term: PRKD1
          term:
            id: hgnc:9407
            label: PRKD1
        genetic_context:
          variant_origin: GERMLINE
          functional_impact_category: GAIN_OF_FUNCTION
          gene:
            preferred_term: PRKD1
            term:
              id: hgnc:9407
              label: PRKD1
        molecular_functions:
        - preferred_term: protein serine/threonine kinase activity
          modifier: GAIN_OF_FUNCTION
          term:
            id: GO:0004674
            label: protein serine/threonine kinase activity
      selected_evidence:
        snippet: We identified three S-CHD individuals with de novo missense mutations in PRKD1, with
          two having identical DNMs, a mutational pattern suggestive of gain of function
        supports: SUPPORT
        directness: INDIRECT
