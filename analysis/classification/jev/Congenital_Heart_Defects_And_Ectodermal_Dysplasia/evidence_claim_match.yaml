      assertion_type: Discussion
      assertion:
        discussion_id: gap_prkd1_gof_vs_lof_mechanism
        prompt: How do gain-of-function missense variants and loss-of-function alleles in PRKD1 each produce
          congenital heart defects and ectodermal dysplasia, and does the dominant CHDED syndrome share
          a mechanism with the recessive biallelic-truncating truncus arteriosus phenotype?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#PRKD1 Kinase Dysfunction
        - genetic#PRKD1 variants
        rationale: The recurrent de novo missense variants of the dominant syndrome are read as gain-of-function,
          yet biallelic truncating (loss-of-function) PRKD1 variants cause a related recessive truncus
          arteriosus phenotype and the available mouse model is a loss-of-function deletion. Whether opposite
          perturbations of PRKD1 activity converge on the same developmental pathway, and the precise
          molecular consequence of the dominant missense alleles, remain unresolved.
      selected_evidence:
        snippet: A homozygous PTV in PRKD1 has recently been associated with truncus arteriosus through
          autozygosity mapping
        supports: SUPPORT
