          recessive truncus arteriosus phenotype, so the genotype-mechanism relationship is heterogeneous.
          No external gene-disease validity classification (for example ClinGen) for the PRKD1-CHDED pair
          was located at curation time, so no gene_disease_validity assertion is recorded.
