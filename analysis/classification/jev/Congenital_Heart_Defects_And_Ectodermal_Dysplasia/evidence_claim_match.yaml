        description: PRKD1 phosphorylates class IIa histone deacetylases, promoting their nuclear export
          and derepressing MEF2- and TBX5-dependent transcription. Altered PRKD1 kinase activity dysregulates
          this axis, perturbing the transcriptional programs that control cardiac and ectodermal morphogenesis.
        biological_processes:
        - preferred_term: regulation of transcription by RNA polymerase II
          modifier: ABNORMAL
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
      selected_evidence:
        snippet: PRKD1 is known to regulate pathologic cardiac hypertrophy through its action on class
          II histone deacetylases (HDACs) and signalling via the myocyte enhancer factor-2 family (MEF2)
          and TBX5
        supports: SUPPORT
        directness: INDIRECT
