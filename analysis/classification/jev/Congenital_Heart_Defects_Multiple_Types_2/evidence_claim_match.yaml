        kind: KNOWLEDGE_GAP
        attaches_to:
        - phenotypes#Hearing impairment
        prompt: By what route does reduced TAB2 dosage cause hearing loss?
        rationale: Hearing loss occurs in 18% of pooled subjects, which is well above the threshold at
          which this entry curates a phenotype, but nothing connects it to a mechanism node. The cohort
          that reports it groups it with myopia as an additional feature rather than with the connective
          tissue cluster, and no study has examined TAB2 in the cochlea or middle ear. It is therefore
          left with no incoming causal edge on purpose. Hanging it off the connective tissue node would
          assert a syndromic connective-tissue route by analogy with Stickler and Ehlers-Danlos syndromes,
          which is plausible and unsupported.
      selected_evidence:
        snippet: 15% (6/39) had myopia and 18% (7/39) experienced hearing loss
        supports: SUPPORT
