  7e753e581a98c3a4006f1201a14d145084f81b695088aad121218e28298d1715:
    claim:
      about:
        disease:
          name: Congenital Heart Defects, Multiple Types, 2
          disease_term:
            preferred_term: congenital heart defects, multiple types, 2
            term:
              id: MONDO:0014000
              label: congenital heart defects, multiple types, 2
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired TAK1 Complex Signaling
        biological_scale: MOLECULAR
        description: 'TAB2 is the adaptor that links TNFR1 and other receptors to the TAK1 complex by
          binding Lys63-linked polyubiquitin chains. Reduced TAB2 impairs that coupling. The consequence
          is not a single pathway output: TAB2 can act as a TAK1 activator or suppressor depending on
          cell type, and this node therefore branches into a developmental arm and a myocardial survival
          arm rather than into one effect. Which downstream output actually tracks disease is not settled.
          A cell-based screen of 47 TAB2 variants found that AP-1 transcriptional activity, the output
          of the stress-activated MAPK arm, predicted variant pathogenicity while NF-kappaB activity did
          not, so the NF-kappaB binding below records a dysregulated pathway rather than the discriminating
          readout.'
        biological_processes:
        - preferred_term: canonical NF-kappaB signal transduction
          term:
            id: GO:0007249
            label: canonical NF-kappaB signal transduction
          modifier: DYSREGULATED
        - preferred_term: stress-activated MAPK cascade signalling to AP-1
          term:
            id: GO:0051403
            label: stress-activated MAPK cascade
          modifier: DYSREGULATED
      selected_evidence:
        snippet: TGF-β–activated kinase 1 binding protein 2 (TAB2) is an adaptor protein linking signals
          from TNFR1 and other receptors to the TAK1 signaling complex by binding to Lys63-linked polyubiquitin
          chains
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
