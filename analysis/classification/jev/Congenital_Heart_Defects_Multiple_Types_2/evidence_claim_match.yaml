        context: []
      assertion_type: Pathophysiology
      assertion:
        name: TAB2 Haploinsufficiency
        biological_scale: MOLECULAR
        description: 'Heterozygous deletion of 6q25.1 including TAB2, or a heterozygous loss-of-function
          variant within the gene, halves TAB2 dosage. The critical region was narrowed to 850 kb on 6q25.1
          and TAB2 identified within it; the causal role was then confirmed by intragenic missense variants
          and by a translocation disrupting TAB2 that cosegregated with familial congenital heart disease.
          The loss-of-function framing of this node covers the deletion and truncating-variant class that
          defines the entity. It is not the whole allelic series: a functional screen of 47 variants found
          gain-of-function alleles alongside loss-of-function ones, with distinct phenotypes, so a pathogenic
          TAB2 missense variant cannot be assumed to reduce function.'
        genetic_context:
          gene:
            preferred_term: TAB2
            term:
              id: hgnc:17075
              label: TAB2
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Genotype-phenotype correlations in 12 patients carrying a chromosomal deletion on 6q
          delineated a critical 850 kb region on 6q25.1 harboring five genes.
        supports: SUPPORT
