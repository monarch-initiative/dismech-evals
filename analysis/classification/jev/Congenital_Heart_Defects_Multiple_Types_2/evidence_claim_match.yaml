              id: MONDO:0014000
              label: congenital heart defects, multiple types, 2
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: tab2_allelic_series_lof_and_gof
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#TAB2 Haploinsufficiency
        - pathophysiology#Impaired TAK1 Complex Signaling
        prompt: Is TAB2 disease uniformly a loss-of-function mechanism, and if not, what does the gain-of-function
          class do?
        rationale: 'This entry is built on haploinsufficiency, which is well supported for whole-gene
          deletions and truncating variants. A scalable luciferase screen of 47 TAB2 variants reported
          both loss-of-function and gain-of-function alleles with distinct phenotypes, and found that
          AP-1 rather than NF-kappaB activity separated pathogenic from benign. Two things follow that
          this entry cannot yet model. First, the pathograph has one molecular entry point, so a gain-of-function
          allele has nowhere to attach. Second, the genotype-phenotype split reported for partial loss-of-function
          variants runs opposite to the entity''s name: those patients mostly do not have congenital heart
          disease, and instead have developmental delay, hypotonia and dysmorphic features. Whether that
          is a second mechanism, a dosage threshold effect, or ascertainment is open, and resolving it
          would change how the entry is structured rather than just adding an edge.'
      selected_evidence:
        snippet: Missense variant represents a major proportion of non-synonymous TAB2 variants reported
          in gnomAD (295/576) and Clinvar (16/73), most of which are variants of uncertain significance
          (VUSs).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: DOI:10.1093/hmg/ddac252
      reference_title: Assigning pathogenicity for TAB2 variants using a novel scalable functional assay
        and expanding TAB2 disease spectrum
      evidence_source: IN_VITRO
      explanation: Establishes that the missense class, where the gain-of-function alleles sit, is the
        numerically dominant and least interpreted part of the allelic series.
