              label: congenital heart defects, multiple types, 2
        context:
        - path: /pathophysiology/3
          value:
            name: RIPK1-Dependent Cardiomyocyte Death
            biological_scale: CELLULAR
            description: In the mature myocardium TAB2 suppresses RIPK1 kinase activation by mediating
              its phosphorylation at Ser321 through TAK1. Loss of TAB2 releases that restraint, and RIPK1
              assembles either the RIPK1-FADD-caspase-8 apoptotic complex or the RIPK1-RIPK3 necroptotic
              complex. This is a survival mechanism operating in the formed heart, which is why cardiomyopathy
              can arise without any structural defect.
            cell_types:
            - preferred_term: cardiomyocyte
              term:
                id: CL:0000746
                label: cardiac muscle cell
            biological_processes:
            - preferred_term: necroptotic process
              term:
                id: GO:0070266
                label: necroptotic process
              modifier: INCREASED
            - preferred_term: apoptotic process
              term:
                id: GO:0006915
                label: apoptotic process
              modifier: INCREASED
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Dilated cardiomyopathy
        causal_link_type: DIRECT
      selected_evidence:
        snippet: genetic inactivation of RIPK1 with Ripk1-K45A knockin effectively rescued cardiac remodeling
          and dysfunction in Tab2-deficient mice
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3/downstream/0
      evidence_path: /pathophysiology/3/downstream/0/evidence/0
      context_paths:
