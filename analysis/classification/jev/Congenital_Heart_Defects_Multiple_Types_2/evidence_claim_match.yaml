      assertion_type: Pathophysiology
      assertion:
        name: Connective Tissue Matrix Involvement
        biological_scale: TISSUE
        description: The extra-cardiac half of the phenotype - short stature, joint hypermobility, abnormal
          skin texture and the facial gestalt - clusters as a connective tissue disorder, and most individuals
          with TAB2 single nucleotide variants present that way. The molecular route from reduced TAK1
          signalling to matrix involvement is not established, so this node is curated as the tissue-level
          observation it is rather than as a mechanism, and its outgoing edges carry unknown intermediates.
      selected_evidence:
        snippet: The most commonly co-occurring features with CHD or cardiomyopathy were facial dysmorphism,
          skeletal and connective tissue defects and most subjects with TAB2 variants present as a connective
          tissue disorder.
        supports: SUPPORT
