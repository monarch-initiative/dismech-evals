      assertion:
        name: FLT4 Heterozygous Loss of Function
        description: Heterozygous germline FLT4 variants, most of them predicted loss of function (nonsense,
          frameshift, canonical and near-canonical splice-site variants, and an 8-kb deletion), reduce
          the dose of functional VEGFR3. FLT4 is highly intolerant of loss-of-function variation in population
          databases, consistent with haploinsufficiency. ClinGen split this disease from Milroy disease
          partly on mechanism, loss of function here against the dominant negative kinase-dead alleles
          of Milroy disease.
        biological_scale: MOLECULAR
        genes:
        - preferred_term: FLT4
          term:
            id: hgnc:3767
            label: FLT4
        molecular_functions:
        - preferred_term: VEGFR3 receptor tyrosine kinase activity
          modifier: DECREASED
          term:
            id: GO:0005021
            label: vascular endothelial growth factor receptor activity
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: FLT4 was highly intolerant to LoF variation in ExAC (pLI = 1) and only one LoF allele
          was identified among 3,578 parental controls.
        supports: SUPPORT
