              label: congenital heart defects, multiple types, 7
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Perinuclear ER Aggregation of Missense FLT4 Protein
        description: Missense FLT4 variants found in patients with tetralogy of Fallot, expressed in primary
          human endothelial cells, cause the receptor to aggregate in the perinuclear endoplasmic reticulum
          and activate proteostatic and metabolic signaling. Milroy disease variants and wild-type FLT4
          do not. The variant cells show altered expression in developmental signaling pathways, and inhibiting
          proteostatic signaling abrogates these effects. This is a mechanism for the missense subset
          of alleles, distinct from the dominant negative mechanism of Milroy alleles.
        biological_scale: CELLULAR
        genes:
        - preferred_term: FLT4
          term:
            id: hgnc:3767
            label: FLT4
        molecular_functions:
        - preferred_term: VEGFR3 receptor tyrosine kinase activity
          term:
            id: GO:0005021
            label: vascular endothelial growth factor receptor activity
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        cellular_components:
        - preferred_term: endoplasmic reticulum
          term:
            id: GO:0005783
            label: endoplasmic reticulum
        biological_processes:
        - preferred_term: response to endoplasmic reticulum stress
          term:
            id: GO:0034976
            label: response to endoplasmic reticulum stress
          modifier: INCREASED
      selected_evidence:
        snippet: FLT4 variants identified in patients with TOF, when expressed in primary human endothelial
          cells, cause aggregation of FLT4 protein in the perinuclear endoplasmic reticulum, activating
          proteostatic and metabolic signalling, whereas lymphoedema-associated FLT4 variants and wild-type
          (WT) FLT4 do not.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
