      assertion_type: Pathophysiology
      assertion:
        name: Increased Substrate Tyrosine Phosphorylation
        biological_scale: CELLULAR
        description: 'Hyperactive ABL1 raises global cellular phosphotyrosine and specifically hyperphosphorylates
          canonical ABL1 substrates, of which STAT5/STAT5B is the best-characterised readout across all
          three functional studies. An unbiased phosphoproteomic survey of one patient-derived allele
          additionally found increased phosphorylation of UFD1, AXIN1, and ATRX, nominating candidate
          effectors that could link kinase hyperactivity to the cardiac, digital, and growth phenotypes
          - notably UFD1, which the authors relate to the cardiac phenotype of 22q11.2 deletion syndrome.
          These effector assignments are hypotheses generated in a cell line, not validated patient-tissue
          mechanisms.

          '
        biological_processes:
        - preferred_term: peptidyl-tyrosine phosphorylation
          term:
            id: GO:0018108
            label: peptidyl-tyrosine phosphorylation
          modifier: INCREASED
        - preferred_term: STAT5 tyrosine phosphorylation
          term:
            id: GO:0007260
            label: tyrosine phosphorylation of STAT protein
          modifier: INCREASED
      selected_evidence:
        snippet: "Western blotting confirmed that tyrosine phosphorylation in STAT5, a substrate of ABL1,\
          \ was enhanced, and the novel \nmutation was proved to be a gain-of-function mutation."
        supports: SUPPORT
