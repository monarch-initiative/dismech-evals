            term:
              id: MONDO:0060532
              label: congenital heart defects and skeletal malformations syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chdskm_lineage_route_to_malformation
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Through which developmental cell lineages and downstream effectors does ABL1 kinase hyperactivity
          produce the specific CHDSKM malformation set (cardiac septa and outflow tract, digits, axial
          skeleton, aortic root)?

          '
        attaches_to:
        - pathophysiology#Increased Substrate Tyrosine Phosphorylation
        - pathophysiology#Disrupted Cardiac Septation and Outflow Tract Development
        rationale: 'Steps 1 to 3 of the causal chain - autoinhibition loss, kinase hyperactivity, increased
          substrate phosphorylation - are experimentally solid and independently replicated. The step
          from generalised phosphotyrosine excess to a specific, reproducible malformation pattern is
          entirely inferential. The only concrete effector nominations come from a single phosphoproteomic
          experiment in a transfected cell line (UFD1, AXIN1, ATRX), and even the cell types involved
          - cardiomyocytes, endocardial and valvular interstitial cells, cardiac neural crest derivatives,
          chondrocytes, craniofacial mesenchyme - remain plausible candidates rather than demonstrated
          targets. This is why the pathophysiology edges leading out of the phosphorylation node are typed
          INDIRECT_UNKNOWN_INTERMEDIATES and why no cell types are asserted on the cardiac node.

          '
        proposed_experiments:
        - experiment_id: chdskm_lineage_restricted_knockin
          name: Lineage-restricted CHDSKM allele knock-in in mouse
          description: 'Conditional knock-in of a recurrent human allele (p.Tyr245Cys or p.Glu528Lys)
            restricted to cardiac mesoderm, cardiac neural crest, endocardium, and limb/skeletal mesenchyme,
            with staged phenotyping of septation and outflow tract development.

            '
          decision_criterion: 'A lineage in which the knock-in reproduces septal or outflow tract defects
            identifies the cell population through which kinase hyperactivity acts.

            '
        - experiment_id: chdskm_ipsc_lineage_phosphoproteomics
          name: Phosphoproteomics in disease-relevant differentiated cell types
          description: 'Differentiate patient-derived iPSCs to cardiomyocytes and chondrocytes and repeat
            phosphoproteomic profiling in those lineages rather than in HEK293T, testing whether UFD1,
            AXIN1, and ATRX hyperphosphorylation reproduces outside the overexpression system.

            '
          decision_criterion: 'Reproduction of the effector hyperphosphorylation in a developmentally
            relevant lineage would upgrade those nominations from hypothesis to candidate mechanism.

            '
      selected_evidence:
        snippet: AXIN1 and ATRX may be important in elucidating the mechanisms of other phenotypes, such
          as finger contracture and failure to thrive. Verification of these hypotheses would lead to
          further understanding of the pathophysiology and the development of treatment methods.
        supports: SUPPORT
