      assertion:
        name: Constitutive ABL1 Tyrosine Kinase Hyperactivity
        biological_scale: MOLECULAR
        description: 'With autoinhibition relieved, the mutant kinase is catalytically more active than
          wild type. This has been demonstrated repeatedly and independently: by transient transfection
          of HEK293T cells with each of the reported disease alleles, and by purified-protein biophysics
          for the alpha-I-helix allele p.Glu528Lys. Crucially, the increased activity is pharmacologically
          suppressible - imatinib abolished the excess phosphorylation across all tested constructs in
          vitro, which is the entire (preclinical) basis for interest in ABL-directed tyrosine kinase
          inhibitors in this syndrome.

          '
        molecular_functions:
        - preferred_term: ABL1 tyrosine kinase catalytic activity
          term:
            id: GO:0004715
            label: non-membrane spanning protein tyrosine kinase activity
          modifier: INCREASED
        biological_processes:
        - preferred_term: ABL1 autophosphorylation at Tyr245 (allele-dependent direction; increased for
            myristoyl-pocket alleles, reduced for the SH2-kinase-linker alleles p.Val244Ala and p.Tyr245Cys,
            which activate the kinase independently of Tyr245 phosphorylation status)
          term:
            id: GO:0038083
            label: peptidyl-tyrosine autophosphorylation
      selected_evidence:
        snippet: "We overexpressed the mutant constructs in HEK 293T cells and \nobserved increased tyrosine\
          \ phosphorylation, suggesting increased ABL1 kinase \nactivities associated with both the p.Tyr245Cys\
          \ and p.Ala356Thr substitutions."
        supports: SUPPORT
