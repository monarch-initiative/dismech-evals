          growth restriction and failure to thrive, microcephaly, and hearing impairment, none of which
          are Marfan features.
        - Ectopia lentis, a cardinal Marfan diagnostic feature, has not been reported in any published
          CHDSKM patient, although "distinct ocular abnormalities" of unspecified type are part of the
          CHDSKM spectrum, so this discriminator should be applied with care.
        - The TGF-beta dysregulation that characterises FBN1-related aortopathy was tested in CHDSKM and
          not found (SMAD2/SMAD3 phosphorylation unchanged).
        - Causal gene ABL1 rather than FBN1.
      selected_evidence:
        snippet: Due to cardiac and skeletal manifestations, differential diagnoses commonly included
          connective tissue disorders, e.g. Marfan syndrome in families 3.
        supports: SUPPORT
