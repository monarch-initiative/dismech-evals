        description: 'There are no consensus clinical diagnostic criteria and no biochemical biomarker
          for CHDSKM; diagnosis is molecular. Both the founding cohort and the expanded series were identified
          by exome sequencing after targeted testing for known disease genes was negative. The practical
          trigger for testing is syndromic congenital heart disease plus digital or skeletal anomalies
          with the characteristic narrow facies and growth restriction. Interpretation should weigh whether
          the missense allele lies in a known autoinhibitory region consistent with the gain-of-function
          mechanism; functional kinase assays remain research tools, not validated clinical tests.

          '
      selected_evidence:
        snippet: Exome sequencing and Sanger fill-in of regions poorly covered by exome sequencing did
          not identify any causal variants in known disease genes
