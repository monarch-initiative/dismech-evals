              label: congenital heart defects and skeletal malformations syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Human ABL1 Deficiency Syndrome
        description: 'The allelic counterpart of CHDSKM at the same locus. Biallelic loss-of-function
          ABL1 variants cause a distinct recognisable syndrome of multiple congenital malformations and
          facial dysmorphism that is described as opposite to CHDSKM in many respects - the clearest possible
          demonstration that ABL1 activity must be held within a narrow band during development, and the
          reason the two must never be merged into one entity.

          '
        distinguishing_features:
        - ABL1 deficiency syndrome is autosomal recessive, arises in consanguineous families, and is caused
          by homozygous loss-of-function alleles.
        - CHDSKM is autosomal dominant and caused by heterozygous gain-of-function missense alleles.
        - The dysmorphic gestalts are reported as opposite in many features.
        - Molecular reports must therefore state zygosity and predicted functional direction, not merely
          that an ABL1 variant is present.
      selected_evidence:
        snippet: "The associated phenotype is multiple \ncongenital malformations and distinctive facial\
          \ dysmorphism that are opposite in \nmany ways to CHDSKM. We suggest that a tight balance of\
          \ ABL1 activity is \nrequired during embryonic development and that both germline gain of function\
          \ \nand loss of function variants result in distinctively different allelic \ncongenital malformation\
          \ disorders."
        supports: SUPPORT
