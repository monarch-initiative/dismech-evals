      assertion:
        name: Progressive Aortic Root Dilatation
        biological_scale: TISSUE
        description: 'Aortic root enlargement is reported chiefly in older children and adults, consistent
          with a progressive rather than a static congenital lesion, and at least one patient has had
          severe and rapidly progressive dilatation. The true risk of aneurysm and dissection is not known:
          as of the 2021 pooled 18-case review the authors reported no awareness of any affected individual
          having required surgical intervention for rapid progressive dilatation, which they suggested
          may indicate a more indolent course than Marfan syndrome - though a 2023 case has since described
          exactly that pattern, so the indolent-course reading should be treated as provisional. The uncertainty
          itself is the clinically actionable point: published expert recommendation is baseline and serial
          aortic root measurement modelled on Marfan surveillance until natural-history data exist.

          '
        locations:
        - preferred_term: aortic root
          term:
            id: UBERON:0001496
            label: ascending aorta
      selected_evidence:
        snippet: "he had several features not \npreviously documented, including severe and rapidly progressive\
          \ aortic root \ndilatation"
