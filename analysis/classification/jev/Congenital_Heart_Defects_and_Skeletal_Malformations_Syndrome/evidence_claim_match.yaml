          autosomal dominant, each pregnancy of an affected heterozygous parent carries a one-in-two transmission
          risk; the documented father-to-child and mother-to-child transmissions of p.Tyr245Cys make this
          a real rather than theoretical counseling scenario. Counseling must convey that expressivity
          is variable, so severity in an affected child cannot be predicted from the parent''s phenotype,
          and that most probands to date have carried de novo variants. Once a familial variant is known,
          prenatal diagnosis and preimplantation genetic testing for monogenic disease are technically
          available reproductive options.

