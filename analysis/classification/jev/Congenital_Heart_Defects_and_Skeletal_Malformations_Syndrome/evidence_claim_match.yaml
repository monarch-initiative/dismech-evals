              label: congenital heart defects and skeletal malformations syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Skeletal and Connective Tissue Morphogenesis
        biological_scale: TISSUE
        description: 'The skeletal arm of the syndrome affects the digits most consistently, then the
          axial skeleton and thoracic cage: camptodactyly and finger contractures, fifth-finger clinodactyly,
          2-3 toe syndactyly, hindfoot deformity, scoliosis, and pectus excavatum. A connective-tissue
          dimension runs in parallel - thin skin, joint hypermobility, arachnodactyly, high-arched palate,
          and spontaneous pneumothorax - which is why these patients are routinely referred to connective-tissue
          clinics before the molecular diagnosis is made. Notably, the canonical connective-tissue mechanism
          of increased TGF-beta signalling was tested and NOT found: SMAD2 and SMAD3 phosphorylation were
          unchanged in the mutant constructs, so CHDSKM does not conform to the TGF-beta-dysregulation
          aortopathy pattern of Marfan and Loeys-Dietz syndromes despite the clinical resemblance. That
          negative is the reason this entry declares no conforms_to link to the aortopathy_tgfbeta_dysregulation
          module.

          '
        biological_processes:
        - preferred_term: skeletal system morphogenesis
          term:
            id: GO:0048705
            label: skeletal system morphogenesis
          modifier: ABNORMAL
      selected_evidence:
        snippet: Common skeletal abnormalities included pectus excavatum, scoliosis, and finger/toe deformities,
          in particular hindfoot deformity, and finger contractures
        supports: SUPPORT
