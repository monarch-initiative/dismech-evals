  e9fe7b46b5c3b3142a8e3f0def14564c000d29b6d6d8f9cae8b5585b4da70538:
    claim:
      about:
        disease:
          name: Congenital Heart Defects and Skeletal Malformations Syndrome
          disease_term:
            preferred_term: congenital heart defects and skeletal malformations syndrome
            term:
              id: MONDO:0060532
              label: congenital heart defects and skeletal malformations syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: ABL1 Gain-of-Function Missense Variants
        gene_term:
          preferred_term: ABL1
          term:
            id: hgnc:76
            label: ABL1
        association: CAUSAL
        relationship_type: CAUSATIVE
        notes: 'ABL1 (9q34.12) encodes a ubiquitously expressed non-receptor tyrosine kinase. CHDSKM alleles
          are heterozygous germline missense substitutions annotated against the isoform 1b transcript
          NM_007313.2. They are not haploinsufficiency alleles: mouse heterozygotes for Abl1 null alleles
          are largely unaffected, and the human alleles increase rather than decrease kinase output. Reported
          disease alleles include p.Val244Ala, p.Tyr245Cys, p.Gln300Glu, p.Ala356Thr, p.Ala452Thr, p.Ile508Leu,
          p.Val525Ala, and p.Glu528Lys, plus p.Thr136Met, p.Pro249Leu, p.Val525Met, and p.Trp67Arg. The
          recurrent alleles p.Tyr245Cys and p.Ala356Thr account for a disproportionate share of reported
          patients. Note that only a subset of these alleles has been localised to a named regulatory
          element: the myristoyl-pocket cluster (Ala356, Ala452, Val525, Glu528) and the SH2-kinase linker
          (Val244, Tyr245) are mapped, whereas p.Trp67Arg, p.Thr136Met, p.Pro249Leu, p.Gln300Glu, and
          p.Ile508Leu are reported without a domain assignment beyond, for p.Ile508Leu, the kinase domain.

          '
      selected_evidence:
        snippet: "The variant c.734A>G (p.Tyr245Cys) was found to occur de novo or \ncosegregate with\
          \ disease in five individuals (families 1-3)."
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
