        description: 'Heterozygous ABL1 missense alleles act dominantly. Most reported probands carry
          de novo variants, but vertical transmission from an affected parent to an affected child has
          been documented for the recurrent p.Tyr245Cys allele, establishing cosegregation rather than
          de novo occurrence alone. Expressivity is variable - stature, for example, ranges from short
          to tall within the same molecular condition - and numerical penetrance cannot be estimated from
          the small published pedigrees.

          '
      selected_evidence:
        snippet: "Here we report ABL1 \ngermline variants cosegregating with an autosomal dominant disorder\
          \ \ncharacterized by congenital heart disease, skeletal abnormalities, and failure \nto thrive."
