            term:
              id: MONDO:0060532
              label: congenital heart defects and skeletal malformations syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: ABL1 Autoinhibitory Regulatory Core Disruption
        biological_scale: MOLECULAR
        description: 'Wild-type ABL1 is held in a low-activity state by an assembled SH3-SH2-kinase regulatory
          core. Three intramolecular "linchpins" enforce this: docking of the SH3 domain onto the SH2-kinase
          linker, insertion of the N-terminal myristoyl group of isoform 1b into a pocket in the kinase
          domain, and an N-terminal brace over the SH3-SH2 unit. The CHDSKM missense substitutions whose
          position has been mapped fall in these regulatory elements - four of the five alleles in the
          largest functionally characterised series lie in the myristoyl-binding pocket, with others in
          the SH2-kinase linker and the C-terminal alpha-I helix - and destabilise the assembled core.
          Several later-reported alleles (p.Trp67Arg, p.Thr136Met, p.Gln300Glu, p.Ile508Leu) have not
          been assigned to a defined autoinhibitory element by their source reports, so the clustering
          claim is scoped to the characterised alleles. This is the same autoinhibition failure that the
          somatic BCR::ABL1 fusion achieves by deleting the myristoylated N-terminus, which is why the
          two conditions share a molecular logic while remaining entirely distinct diseases.

          '
        molecular_functions:
        - preferred_term: ABL1 non-receptor tyrosine kinase activity
          term:
            id: GO:0004715
            label: non-membrane spanning protein tyrosine kinase activity
          modifier: INCREASED
        gene:
          preferred_term: ABL1
          term:
            id: hgnc:76
            label: ABL1
        genetic_context:
          gene:
            preferred_term: ABL1
            term:
              id: hgnc:76
              label: ABL1
          allele_type: missense
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: 'Heterozygous germline missense variants clustering in the myristoyl-binding pocket
            of the ABL1 regulatory core. Recorded as GAIN_OF_FUNCTION: loss of autoinhibition increases
            tyrosine kinase activity and substrate phosphorylation.'
      selected_evidence:
        snippet: "Four of the variants cluster in the \nmyristoyl-binding pocket of ABL1, a region critical\
          \ for auto-inhibitory \nregulation of the kinase domain."
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
