          name: Congenital Heart Defects and Skeletal Malformations Syndrome
          disease_term:
            preferred_term: congenital heart defects and skeletal malformations syndrome
            term:
              id: MONDO:0060532
              label: congenital heart defects and skeletal malformations syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chdskm_model_organism_mismatch
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: 'Do the available Abl1 mouse models, which are all loss-of-function, have any translational
          validity for a human heterozygous gain-of-function syndrome?

          '
        attaches_to:
        - pathophysiology#ABL1 Autoinhibitory Regulatory Core Disruption
        rationale: 'Every published Abl1 mouse model is a null or truncation allele. Their phenotypes
          - growth delay, cardiac hyperplasia, osteoporosis, lymphopenia, perinatal lethality - establish
          that ABL1 matters in development but point in the opposite functional direction from the human
          disease. The mismatch is not incidental: the original authors specifically re-examined ventricular
          wall thickness in their patients and confirmed the absence of the cardiac hyperplasia seen in
          the knockout mice, attributing the difference to increased versus abolished kinase activity.
          Mouse heterozygotes are largely unaffected, so there is no dosage model either. No knock-in
          model of a recurrent human CHDSKM allele has been reported.

          '
        proposed_experiments:
        - experiment_id: chdskm_knockin_versus_null
          name: CHDSKM knock-in mouse compared against Abl1 null
          description: 'Generate constitutive and conditional knock-in mice carrying the human p.Tyr245Cys
            or p.Glu528Lys allele, assess whether cardiac septal defects, digital contractures, growth
            restriction, and aortic root dilatation are recapitulated, and compare directly against Abl1
            null animals in the same genetic background.

            '
          decision_criterion: 'Recapitulation of the human malformation set by the knock-in, with a phenotype
            distinct from the null, would establish a valid model and confirm the functional direction
            of the human alleles.

            '
      selected_evidence:
        snippet: Abl1 knockout mice have growth delay, cardiac hyperplasia and osteoporosis
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
