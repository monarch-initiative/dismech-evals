          disease in the great majority of patients. The reported lesions are concentrated at the septa
          and the left and right outflow tracts: atrial and ventricular septal defects, patent ductus
          arteriosus, supravalvular pulmonary stenosis, bicuspid aortic valve, and aortic root dilatation.
          The specific developmental lineage through which kinase hyperactivity produces these defects
          has not been established; the phosphoproteomic nomination of UFD1, the 22q11.2 cardiac gene,
          is the only concrete candidate link so far.

          '
