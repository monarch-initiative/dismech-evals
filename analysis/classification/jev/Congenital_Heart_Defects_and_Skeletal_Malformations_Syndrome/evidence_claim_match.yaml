  d6cd2c0642bb7d2bf8b8c5082b2b5ae48d62b439c3c3bb4106420242685aa48d:
    claim:
      about:
        disease:
          name: Congenital Heart Defects and Skeletal Malformations Syndrome
          disease_term:
            preferred_term: congenital heart defects and skeletal malformations syndrome
            term:
              id: MONDO:0060532
              label: congenital heart defects and skeletal malformations syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: ABL-Directed Tyrosine Kinase Inhibition (Investigational)
        description: 'NOT an established treatment. Imatinib abolishes the excess phosphorylation of mutant
          ABL1 constructs in vitro, which makes the gain-of-function mechanism pharmacologically tractable
          in principle and is the sole basis for interest in ABL-directed tyrosine kinase inhibitors here.
          The authors of that work do advance a therapeutic hypothesis: because the germline alleles functionally
          mimic the loss of the ABL1 N-terminus in BCR-ABL, they expect TKIs effective against BCR-ABL
          to be similarly effective against the variant proteins, and they raise limiting aortic root
          dilatation as a candidate indication. Three considerations nevertheless weigh against clinical
          use outside a rigorously justified research protocol. First, the malformations arise during
          embryofetal development, so any meaningful effect would require treatment from a very early
          age and lifelong exposure. Second, imatinib is expected to be teratogenic in pregnancy, and
          severe congenital malformations have been reported in fetuses exposed to it - though the original
          authors caution that no definitive conclusion about imatinib teratogenicity can be drawn from
          the small number of cases, several of which also involved exposure to other teratogens such
          as warfarin or hydroxyurea. Third, structural work shows that type II ATP-site inhibitors such
          as imatinib promote disassembly of the very regulatory core whose disassembly drives the disease,
          whereas the allosteric myristoyl-pocket inhibitor asciminib stabilises the alpha-I helix instead
          - so the two inhibitor classes are not interchangeable and leukaemia dosing cannot simply be
          transplanted into a developmental syndrome.

          '
        action_category: THERAPEUTIC
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: imatinib
            term:
              id: CHEBI:45783
              label: imatinib
      selected_evidence:
        snippet: "In contrast, the \nallosteric inhibitor asciminib strongly reduces Abl's activity by\
          \ fixating the \nαI-helix and reducing the force onto the SH2 domain."
        supports: SUPPORT
    origin:
