        name: Aortic Root Surveillance by Serial Echocardiography
        description: 'Baseline measurement of the aortic root diameter at diagnosis and ongoing serial
          imaging, explicitly modelled on Marfan syndrome surveillance. The expert recommendation is explicitly
          precautionary: the true risk of aneurysm and dissection in CHDSKM is unknown, and as of the
          2021 pooled series no patient had been reported to require surgical intervention for rapid progressive
          dilatation. A 2023 case has since documented severe and rapidly progressive dilatation, which
          strengthens rather than weakens the case for surveillance; the recommendation stands until natural-history
          data become available.

