          allele_type: missense
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: GAIN_OF_FUNCTION
          description: 'Heterozygous germline missense variants clustering in the myristoyl-binding pocket
            of the ABL1 regulatory core. Recorded as GAIN_OF_FUNCTION: loss of autoinhibition increases
            tyrosine kinase activity and substrate phosphorylation.'
      selected_evidence:
        snippet: Our analysis supports an ABL1 gain-of-function mechanism due to loss of auto-inhibition,
          and demonstrates the potential for pharmacological inhibition using imatinib.
        supports: SUPPORT
