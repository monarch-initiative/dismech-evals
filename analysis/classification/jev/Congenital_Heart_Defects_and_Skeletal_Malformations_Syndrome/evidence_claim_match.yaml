  517d69dd013e400b2673e7211b4376103b8879aa21adac4c9cd3c4e76811b2b3:
    claim:
      about:
        disease:
          name: Congenital Heart Defects and Skeletal Malformations Syndrome
          disease_term:
            preferred_term: congenital heart defects and skeletal malformations syndrome
            term:
              id: MONDO:0060532
              label: congenital heart defects and skeletal malformations syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chdskm_malignancy_risk
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Do germline ABL1 gain-of-function alleles confer an increased lifetime risk of haematological
          or other malignancy?

          '
        attaches_to:
        - pathophysiology#Constitutive ABL1 Tyrosine Kinase Hyperactivity
        rationale: 'ABL1 is a proto-oncogene and its constitutive activation in the somatic BCR::ABL1
          fusion drives chronic myeloid leukaemia, so a germline activating allele raises an obvious question.
          No malignancy has been reported in any CHDSKM patient, but the total described cohort is very
          small and mostly young, so absence of events is weak evidence of absence of risk. There is a
          mechanistic argument for reassurance - disruption of myristoyl binding alone may not activate
          ABL1 enough to drive malignancy because two other autoinhibitory linchpins remain intact, whereas
          BCR::ABL1 loses both the myristoyl group and the N-terminal brace - but this is reasoning, not
          data. Notably, the authors of the largest functional series report that none of the activating
          germline variants they describe has been associated with somatic tyrosine kinase inhibitor resistance
          in leukaemia - though one residue, Ala452, is shared between the germline and somatic settings,
          so the separation is not absolute.

          '
        proposed_experiments:
        - experiment_id: chdskm_longitudinal_registry
          name: Longitudinal CHDSKM malignancy registry
          description: 'Establish a prospective registry capturing routine blood counts and malignancy
            events in molecularly confirmed CHDSKM patients into adulthood, alongside aortic dimensions,
            hearing, growth, and neurodevelopment.

            '
          decision_criterion: 'Accumulated person-years without haematological malignancy, or an excess
            of events, would for the first time bound the lifetime risk.

            '
        - experiment_id: chdskm_hspc_transformation_assay
          name: Transformation capacity of germline-allele haematopoietic cells
          description: 'Assess whether patient-derived or engineered haematopoietic stem and progenitor
            cells carrying the germline CHDSKM alleles show clonal advantage or transformation capacity
            relative to BCR::ABL1-expressing controls.

            '
          decision_criterion: 'Absence of clonal advantage would support the mechanistic argument that
            myristoyl-pocket disruption alone is insufficient for transformation.

            '
      selected_evidence:
        snippet: No patients with the ABL1 skeletal and cardiac malformation syndrome described here or
          elsewhere are reported to have haematological malignancy, but longitudinal follow up of these
          patients will be required to better determine this.
        supports: SUPPORT
