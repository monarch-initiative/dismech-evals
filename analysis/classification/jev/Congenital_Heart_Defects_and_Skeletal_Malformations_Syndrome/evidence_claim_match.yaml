        description: 'NM_007313.2:c.1582G>A, p.(Glu528Lys). A de novo CHDSKM allele in the C-terminal
          alpha-I helix. Structural and biophysical work has since shown that Glu528 forms a salt bridge
          with the kinase-domain C-lobe; breaking it increases the mechanical force the alpha-I helix
          exerts on the SH2 domain, disassembling the regulatory core and strongly activating the kinase.
          This is the best mechanistically resolved CHDSKM allele.

          '
