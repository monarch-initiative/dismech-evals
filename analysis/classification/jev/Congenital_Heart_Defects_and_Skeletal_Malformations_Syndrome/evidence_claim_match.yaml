        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: chdskm_unlinked_phenotype_mechanisms
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: 'Through what mechanism does germline ABL1 kinase hyperactivity produce the craniofacial
          gestalt and micrognathia, the ear and ocular anomalies, the conductive or mixed hearing impairment,
          microcephaly and developmental delay, the lipodystrophy-like features, and the renal, genital,
          and gastrointestinal manifestations of CHDSKM?

          '
        attaches_to:
        - phenotypes#Characteristic Facial Dysmorphism
        - phenotypes#Micrognathia
        - phenotypes#Ear Malformation
        - phenotypes#Ocular Abnormalities
        - phenotypes#Hearing Impairment
        - phenotypes#Microcephaly
        - phenotypes#Developmental Delay
        - phenotypes#Lipodystrophy-Like Features
        - phenotypes#Renal Hypoplasia
        - phenotypes#Hypospadias
        - phenotypes#Gastrointestinal Dysmotility and Reflux
        rationale: 'The pathophysiology of this entry reaches the cardiac, skeletal, connective-tissue,
          aortic, and growth phenotypes through tissue-level developmental nodes, but no comparable node
          exists for the craniofacial, sensory, neurodevelopmental, adipose, renal, genital, or gastrointestinal
          manifestations. The literature documents these features - several were added to the spectrum
          only by the 2020 expansion series and the 2021 pooled review - without proposing any mechanism
          for them beyond the generic observation that ABL1 is ubiquitously expressed; even candidate
          cell lineages (craniofacial mesenchyme, otic and ocular primordia, neural progenitors, metanephric
          mesenchyme) are unnamed in the CHDSKM sources. Wiring these phenotypes to the existing substrate-phosphorylation
          node would assert a specificity the sources do not contain, so they are left causally unexplained
          until lineage-level evidence exists; the proposed experiments under chdskm_lineage_route_to_malformation
          would bear on this gap as well.

          '
      selected_evidence:
        snippet: thereby expanding the phenotypic spectrum of CHDSKM to include hearing impairment, lipodystrophy-like
          features, renal hypoplasia, and distinct ocular abnormalities.
        supports: SUPPORT
