      assertion:
        name: Teratogenic drug and infectious exposures during cardiac organogenesis
        effect: Increases risk
        description: Definitive teratogens for congenital cardiovascular defects include maternal rubella
          infection, untreated maternal phenylketonuria, thalidomide, vitamin A congeners and retinoids,
          and indomethacin tocolysis. Their shared feature is action during the roughly 3-8 week window
          of cardiac organogenesis. Rubella is a teratogenic maternal infection, not a disease transmitted
          from the affected infant — CHD itself is neither infectious nor transmissible.
        notes: A single entry covering a heterogeneous exposure set, because the cited AHA statement classifies
          them together as definitive rather than reporting per-agent effect sizes. No single ECTO class
          covers the set.
