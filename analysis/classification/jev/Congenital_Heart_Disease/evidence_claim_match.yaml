        context:
        - path: /experimental_models/0
          value:
            name: Hypoplastic left heart syndrome patient-derived iPSC-cardiomyocytes
            experimental_model_type: IPSC_DERIVED_MODEL
            cell_source: PATIENT_DERIVED
            organism:
              preferred_term: human
              term:
                id: NCBITaxon:9606
                label: Homo sapiens
            publication: PMID:39273002
            description: 'Cardiomyocytes differentiated from iPSCs reprogrammed from HLHS patients. These
              are curated here for a specific reason rather than as generic model-system completeness:
              they bear directly on the open question in chd_flow_dependent_human_evidence. If HLHS were
              purely a flow-deprivation phenomenon, patient cardiomyocytes removed from the haemodynamic
              environment should behave normally. They do not - they show impaired cardiac-lineage differentiation
              and structural/electromechanical defects in dish - which is human-derived evidence for a
              cell-autonomous contribution alongside, not instead of, the flow mechanism.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Flow-Dependent Cardiac Morphogenesis Failure
        relationship: MEASURES
        fidelity: MODERATE
        description: 'Provides the counterfactual the zebrafish model cannot: human patient cells cultured
          entirely outside a haemodynamic environment still show intrinsic defects, evidencing the "shared
          upstream developmental cause" alternative that the HUMAN_MODEL_MISMATCH discussion sets against
          pure flow dependence.'
        limitations: iPSC-derived cardiomyocytes are transcriptionally and structurally immature, closer
          to fetal than adult myocardium, and a monolayer of one cell type cannot represent chamber-level
          morphogenesis at all. The findings are also from small patient-derived series with the genetic
          heterogeneity of HLHS uncontrolled, so they establish that a cell-autonomous component exists
          without quantifying its share relative to flow.
        readouts:
        - name: Connexin 43 expression and cardiac myocyte alignment in HLHS iPSC-CMs
          target: Flow-Dependent Cardiac Morphogenesis Failure
          direction: DECREASED
          interpretation: Reduced CX43 with impaired electromechanical transduction and failure of myocyte
            alignment, measured with no haemodynamic input present.
        - name: Myofibril and organelle organisation in HLHS iPSC-CMs
          target: Flow-Dependent Cardiac Morphogenesis Failure
          direction: ALTERED
          interpretation: Structural disorganisation of the contractile apparatus intrinsic to the patient-derived
            cells.
      selected_evidence:
        snippet: They report an impairment in the differentiation process to the cardiac lineage of fully
          formed mature CMs.
        supports: SUPPORT
