      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Neural Crest Migration and Outflow Tract Septation Failure
        biological_scale: CELLULAR
        description: Cardiac neural crest cells delaminate from the postotic (vagal) hindbrain, migrate
          through the caudal pharyngeal arches, and enter the outflow tract, where they are indispensable
          for formation of the aorticopulmonary septum that divides the common truncus into aorta and
          pulmonary trunk. The same population patterns the aortic arch arteries and contributes to the
          semilunar valves and the proximal coronary arteries. Crucially, cardiac neural crest and second
          heart field cells migrate in opposite directions at the same developmental stage, so a perturbation
          of either population produces overlapping conotruncal phenotypes. Because these cells also build
          craniofacial and pharyngeal-arch derivatives, their failure explains the recurrent clinical
          co-occurrence of conotruncal CHD with craniofacial and pharyngeal anomalies (22q11.2 deletion,
          CHARGE) — the cardiac face of the neurocristopathy concept.
        genes:
        - preferred_term: TBX1
          term:
            id: hgnc:11592
            label: TBX1
        - preferred_term: TFAP2B
          term:
            id: hgnc:11743
            label: TFAP2B
        - preferred_term: GATA6
          term:
            id: hgnc:4174
            label: GATA6
        cell_types:
        - preferred_term: migratory cardiac neural crest cell
          term:
            id: CL:2000073
            label: migratory cardiac neural crest cell
        biological_processes:
        - preferred_term: cardiac neural crest cell migration involved in outflow tract morphogenesis
          term:
            id: GO:0003253
            label: cardiac neural crest cell migration involved in outflow tract morphogenesis
          modifier: DECREASED
        - preferred_term: neural crest cell migration
          term:
            id: GO:0001755
            label: neural crest cell migration
          modifier: DECREASED
        - preferred_term: outflow tract morphogenesis
          term:
            id: GO:0003151
            label: outflow tract morphogenesis
          modifier: DECREASED
        locations:
        - preferred_term: outflow tract
          term:
            id: UBERON:0004145
            label: outflow tract
      selected_evidence:
        snippet: These are due to the absence or dysfunction of the two main cell types, i.e., neural
          crest cells and secondary heart field cells that migrate in opposite directions at the same
          stage of development.
        supports: SUPPORT
