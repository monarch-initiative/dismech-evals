      assertion_type: Diagnosis
      assertion:
        name: Chromosomal microarray as first-tier genetic testing
        diagnosis_term:
          preferred_term: genetic testing
          term:
            id: NCIT:C15709
            label: Genetic Testing
        description: 'Chromosomal microarray is the first-tier genetic test in an infant with severe CHD,
          followed by exome or genome sequencing when the array is normal. The curatorially important
          point is that the yield is not confined to dysmorphic or syndromic infants: a clinical geneticist''s
          dysmorphology examination does not reliably identify which apparently isolated CHD cases carry
          a pathogenic copy-number variant, so testing is recommended regardless of lesion type or extracardiac
          findings.'
        results: Diagnostic chromosomal microarray in 14.6% of tested infants overall and in 6.5% of apparently
          isolated CHD; overall genetic-testing yield 17% once second-tier molecular testing is included.
          An independent neonatal cohort reported the same 17% overall figure (32/188).
      selected_evidence:
        snippet: In total, 376 (85.5%) had chromosome microarray (CMA), of which 55 (14.6%) were diagnostic
          in syndromic (N = 35) or isolated (N = 20) presentations.
        supports: SUPPORT
    origin:
