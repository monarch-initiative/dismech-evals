      assertion_type: Inheritance
      assertion:
        name: De novo variation in severe sporadic congenital heart disease
        description: 'A distinct inheritance mode within CHD rather than an alternative to the multifactorial
          model: severe CHD impairs reproductive fitness, so a large share of severe sporadic cases is
          caused by newly arisen variants absent from both parents. The de novo contribution is strongly
          stratified by phenotype — it is small in isolated CHD and large when neurodevelopmental disability
          and extracardiac anomalies accompany the cardiac lesion.'
        inheritance_term:
          preferred_term: Sporadic
          term:
            id: HP:0003745
            label: Sporadic
        de_novo_rate: De novo mutations accounted for 8% of cases overall, ~3% of isolated CHD and ~28%
          of CHD with both neurodevelopmental and extracardiac congenital anomalies (Jin 2017, n=2,871
          probands).
      selected_evidence:
        snippet: Many cases occur sporadically and impair reproductive fitness, suggesting a role for
          de novo mutations.
        supports: SUPPORT
