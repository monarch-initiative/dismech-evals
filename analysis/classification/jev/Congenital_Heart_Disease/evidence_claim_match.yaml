        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Flow-Dependent Cardiac Morphogenesis Failure
        biological_scale: TISSUE
        description: 'Cardiac morphogenesis is not driven by the genome alone. The developing heart begins
          to function while it is still being built, and the resulting haemodynamic forces — shear stress
          on the endocardium and cyclic strain on the myocardium — are themselves morphogenetic inputs
          that the tissue senses and responds to. Removing or altering those forces produces abnormal
          heart development. This is the mechanistic content of the clinical "no flow, no grow" principle,
          and it is what converts a focal primary lesion into a global one: an early valvar or arch obstruction
          reduces flow through the structures downstream of it, whose growth is then secondarily curtailed,
          so that a point stenosis becomes hypoplastic left heart syndrome or aortic arch hypoplasia.
          It also means that a CHD lesion at birth is the compound product of the original developmental
          error and months of altered loading — a caveat that limits how directly a neonatal anatomical
          phenotype can be read back to a single genetic first cause. This node is unbroken ground in
          dismech; the Hypoplastic_Left_Heart_Syndrome and Coarctation_of_the_Aorta entries assert the
          flow-limitation step in prose without anchoring the general mechanism.'
        biological_processes:
        - preferred_term: response to fluid shear stress
          term:
            id: GO:0034405
            label: response to fluid shear stress
          modifier: DYSREGULATED
        - preferred_term: heart morphogenesis
          term:
            id: GO:0003007
            label: heart morphogenesis
          modifier: DECREASED
        locations:
        - preferred_term: heart
          term:
            id: UBERON:0000948
            label: heart
      selected_evidence:
        snippet: This theme is particularly evident in the developing heart as progression of cardiac
          development is accompanied by increased and altered hemodynamic forces.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/7
      evidence_path: /pathophysiology/7/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:26969993
      reference_title: 'Organ Function as a Modulator of Organ Formation: Lessons from Zebrafish.'
      evidence_source: MODEL_ORGANISM
      explanation: Supports the coupling of developmental progression to changing haemodynamic load.
