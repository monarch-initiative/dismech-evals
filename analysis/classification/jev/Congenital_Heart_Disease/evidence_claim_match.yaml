          The human evidence is weaker than for the septation network genes curated above: ClinGen''s
          Congenital Heart Disease Gene Curation Expert Panel grades HAND1-congenital heart disease (MONDO:0005453)
          Moderate under an autosomal dominant model, read from the ClinGen Gene-Disease Validity CSV
