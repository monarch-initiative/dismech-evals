      assertion_type: Inheritance
      assertion:
        name: Multifactorial inheritance
        description: 'Most isolated CHD is not Mendelian. The prevailing model is multifactorial: common
          variation, rare inherited variants of modest effect, de novo variants, and maternal environmental
          exposures combine to cross a developmental threshold. Recurrence risk after an isolated non-syndromic
          case is empirically a few percent, and a defined Mendelian or chromosomal diagnosis replaces
          that empiric figure with disorder-specific counselling. A genetic cause remains unidentified
          in a majority of patients.'
        inheritance_term:
          preferred_term: Multifactorial inheritance
          term:
            id: HP:0001426
            label: Non-Mendelian inheritance
      selected_evidence:
        snippet: however, the cause of the disease remains unexplained in up to 60% of CHD patients
        supports: SUPPORT
