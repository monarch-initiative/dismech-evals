          per 1000 (95% CI 8.602-10.253), i.e. 941 per 100,000. CHD as an umbrella is emphatically not
          a rare disease: it is the commonest congenital anomaly in humans, and the rate sits an order
          of magnitude above the EU rare-disease threshold. The prevalence_class is therefore ABOVE_1_IN_1000,
          the Orphanet class for rates above 100 per 100,000, which is unbounded above and so accommodates
          this figure directly.'
      selected_evidence:
        snippet: The birth prevalence of CHD from 1970-2017 progressively increased to a maximum in the
          period 2010-17 of 9.410/1000 [95% CI (confidence interval) 8.602-10.253].
        supports: SUPPORT
