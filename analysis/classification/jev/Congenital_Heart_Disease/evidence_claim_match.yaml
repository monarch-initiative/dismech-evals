      assertion_type: Treatment
      assertion:
        name: Prostaglandin E1 infusion for duct-dependent circulation
        therapeutic_modality: SMALL_MOLECULE
        description: In duct-dependent lesions the arterial duct is the sole route for either systemic
          or pulmonary blood flow after birth; its physiological closure in the first days of life precipitates
          shock or profound cyanosis. Prostaglandin E1 (alprostadil) maintains ductal patency and is the
          single most time-critical medical intervention in neonatal CHD — it does not treat the malformation
          but buys the interval to reach definitive surgery or catheter intervention. Delay in starting
          the infusion can be fatal.
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: alprostadil
            term:
              id: CHEBI:15544
              label: prostaglandin E1
      selected_evidence:
        snippet: Delay in starting prostaglandin infusion can have deleterious effects on infants and
          can even lead to death.
        supports: SUPPORT
    origin:
