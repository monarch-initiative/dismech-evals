      assertion_type: Environmental
      assertion:
        name: Maternal pregestational diabetes mellitus
        effect: Increases risk
        description: Diabetes present before conception (type 1 or type 2, with no material difference
          in effect size between them) is the strongest established modifiable risk factor for CHD, tripling
          the odds. Gestational diabetes, which begins after the window of cardiac organogenesis has largely
          closed, carries a substantially smaller effect — an internal consistency check that supports
          a causal, timing-dependent mechanism rather than confounding by maternal metabolic phenotype
          alone.
        notes: 'Deliberately left without an exposure_term: ECTO was searched and has no class for exposure
          to a maternal metabolic disease state (its maternal branch covers substances such as alcohol,
          nicotine and pharmacotherapy). Recording a substance exposure here would misrepresent the exposure.'
      selected_evidence:
        snippet: Pregestational diabetes (PGDM) was associated with CHDs (OR, 3.51; 95% CI, 2.86-4.3),
          without difference between type 1 and type 2 PGDM.
        supports: SUPPORT
    origin:
