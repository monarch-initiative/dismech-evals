          term:
            id: CL:0002350
            label: endocardial cell
        - preferred_term: endocardial cushion cell
          term:
            id: CL:0008022
            label: endocardial cushion cell
        biological_processes:
        - preferred_term: endocardial cushion formation
          term:
            id: GO:0003272
            label: endocardial cushion formation
          modifier: DECREASED
        - preferred_term: epithelial to mesenchymal transition involved in endocardial cushion formation
          term:
            id: GO:0003198
            label: epithelial to mesenchymal transition involved in endocardial cushion formation
          modifier: DECREASED
        - preferred_term: endocardial cushion morphogenesis
          term:
            id: GO:0003203
