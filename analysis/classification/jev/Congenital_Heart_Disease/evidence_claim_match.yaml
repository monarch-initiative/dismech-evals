        context: []
      assertion_type: Subtype
      assertion:
        name: Septal
        display_name: Septal defects (atrial and ventricular)
        description: Communications across the interatrial or interventricular septum — secundum and primum
          atrial septal defect, and perimembranous, muscular, inlet and outlet ventricular septal defect.
          Together with patent ductus arteriosus these are the mild-end lesions that dominate reported
          CHD birth prevalence. No single MONDO class covers the atrial-plus-ventricular septal group;
          the constituent lesions are curated as Atrial_Septal_Defect (MONDO:0006664) and Ventricular_Septal_Defect
          (MONDO:0002070).
      selected_evidence:
        snippet: The change in prevalence of mild CHD lesions (ventricular septal defect, atrial septal
          defect and patent ductus arteriosus) together explained 93.4% of the increased overall prevalence
        supports: SUPPORT
