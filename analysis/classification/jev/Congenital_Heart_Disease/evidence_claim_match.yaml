              label: congenital heart disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Circulatory Physiology
        biological_scale: ORGANISM
        description: 'The shared physiological consequence of structural malformation, and the level at
          which otherwise unrelated lesions become clinically interchangeable. Four patterns recur: left-to-right
          shunting with pulmonary overcirculation and volume loading; outflow obstruction with pressure
          loading of the upstream ventricle; obligatory mixing or right-to-left shunting with systemic
          hypoxaemia and cyanosis; and duct-dependent circulation, in which either systemic or pulmonary
          blood flow is supplied through the arterial duct and collapses when it closes in the first days
          of life. Long-term, the volume- and pressure-loaded and hypoxaemic circulations drive pulmonary
          vascular remodelling, ventricular hypertrophy and fibrosis, arrhythmia and heart failure. The
          lesion-specific elaboration of each pattern is curated in the individual lesion entries (notably
          Eisenmenger_Syndrome for the shunt-to-pulmonary-vascular-disease trajectory) and is deliberately
          not re-derived here.'
      selected_evidence:
        snippet: Infants with duct-dependent critical CHD remain well during the fetal period and may
          deteriorate when the ductus arteriosus (commonly called 'duct') closes after birth.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/9
      evidence_path: /pathophysiology/9/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:29162633
