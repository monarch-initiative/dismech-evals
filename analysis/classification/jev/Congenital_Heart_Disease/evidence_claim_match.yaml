      assertion:
        category: Congenital anomaly
        name: Extracardiac congenital anomaly
        description: Non-cardiac structural anomaly co-occurring with CHD, at roughly twice the background
          newborn rate. Mechanistically expected from this entry's model, because the cardiac neural crest
          and the chromatin-modifying genes that dominate the CHD de novo burden are shared with craniofacial,
          limb and other developmental programmes.
        phenotype_term:
          preferred_term: Extracardiac congenital anomaly
        notes: 'NEEDS TERM / NTR CANDIDATE. Deliberately left unbound. The claim is an extracardiac structural
          or functional anomaly of ANY organ system, and the cited evidence is likewise system-agnostic.
          HPO was searched (2026-08-19) for a system-agnostic congenital-anomaly class: the only "congenital
          malformation of" terms are cardiac (HP:0011603, HP:0011723, HP:0045017), there is no "multiple
          congenital anomalies" class, and every "Abnormality of the X system" term names a single system.
          An earlier revision bound this to HP:0000924 (Abnormality of the skeletal system), which silently
          narrowed a whole-organism claim to the skeleton and was removed on review - no term beats a
          bad term. An HPO new-term request for a system-agnostic extracardiac/multiple congenital anomaly
          class would be the right resolution.'
      selected_evidence:
        snippet: Extra-cardiac congenital anomalies (CA, structural or functional anomalies that arise
          in utero) occur in approximately 13% of newborns with congenital heart disease (CHD), including
          2% with a genetic syndrome, almost twice the prevalence observed in infants without CHD
        supports: SUPPORT
