      assertion:
        name: Endocardial Cushion Formation and Endothelial-to-Mesenchymal Transition Failure
        biological_scale: CELLULAR
        description: The atrioventricular canal and outflow tract cushions are the swellings of cardiac
          jelly that are colonised when a subset of endocardial cells loses cell-cell adhesion, delaminates
          and transforms into invasive mesenchyme (endothelial-to-mesenchymal transition, a cardiac-specific
          instance of EMT driven by TGF-beta, BMP and NOTCH signalling from the adjacent myocardium).
          Those mesenchymal cells then remodel into the atrioventricular and semilunar valve leaflets
          and into the membranous portions of the atrial and ventricular septa. Failure at this step is
          therefore simultaneously a valve lesion and a septation lesion, which is why the atrioventricular
          septal defect is a single malformation rather than a coincidence of two. NOTCH1 loss of function
          in this programme is the established cause of bicuspid aortic valve with early calcification.
        genes:
        - preferred_term: NOTCH1
          term:
            id: hgnc:7881
            label: NOTCH1
        - preferred_term: PLD1
          term:
            id: hgnc:9067
            label: PLD1
        cell_types:
