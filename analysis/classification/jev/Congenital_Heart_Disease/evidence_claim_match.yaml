        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Left-Right Patterning and Cardiac Looping Failure
        biological_scale: CELLULAR
        description: The linear heart tube must break bilateral symmetry and loop rightward (dextral looping)
          for the systemic and pulmonary circulations to be placed in their correct series arrangement.
          Handedness is set upstream at the embryonic left-right organizer, where motile-cilium-driven
          leftward flow establishes asymmetric NODAL, LEFTY and PITX2 expression; ZIC3 acts at the earliest
          stages of this process. Failure randomises the axis, producing situs ambiguus (heterotaxy) with
          its complex atrial, venous and ventriculoarterial mis-connections, or complete situs inversus.
          This node is the point at which the CHD root meets the ciliopathy_dysfunction and Visceral_Heterotaxy
          entries; those curate the ciliary machinery and the individual HTX loci in detail and are deliberately
          not re-derived here.
        genes:
        - preferred_term: ZIC3
          term:
            id: hgnc:12874
            label: ZIC3
        - preferred_term: SMAD2
          term:
            id: hgnc:6768
            label: SMAD2
        biological_processes:
        - preferred_term: determination of left/right symmetry
          term:
            id: GO:0007368
            label: determination of left/right symmetry
          modifier: LOSS_OF_FUNCTION
        - preferred_term: left/right pattern formation
          term:
            id: GO:0060972
            label: left/right pattern formation
          modifier: DECREASED
        - preferred_term: heart looping
          term:
            id: GO:0001947
            label: heart looping
          modifier: DECREASED
      selected_evidence:
        snippet: The frameshift allele is also associated with situs inversus among some heterozygous
          females, suggesting that ZIC3 functions in the earliest stages of LR-axis formation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:9354794
      reference_title: X-linked situs abnormalities result from mutations in ZIC3.
      evidence_source: HUMAN_CLINICAL
      explanation: Places a human CHD/laterality gene at the earliest step of left-right axis formation,
