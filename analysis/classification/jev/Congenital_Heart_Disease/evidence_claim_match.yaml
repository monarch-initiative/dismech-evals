        context: []
      assertion_type: Diagnosis
      assertion:
        name: Newborn pulse oximetry screening for critical congenital heart disease
        diagnosis_term:
          preferred_term: disease screening
          term:
            id: NCIT:C15419
            label: Disease Screening
        description: Postductal (or pre- and postductal) oxygen-saturation measurement in the asymptomatic
          newborn, exploiting the fact that most critical CHD produces a detectable arterial saturation
          deficit before it produces visible cyanosis or a murmur. Its high specificity is what makes
          it viable as universal screening; its moderate sensitivity means a normal result does not exclude
          CHD, and it will not detect non-cyanotic lesions such as an isolated ventricular septal defect.
        results: Pooled sensitivity 76.5% (95% CI 67.7-83.5), specificity 99.9%, false-positive rate 0.14%.
          Screening after 24 hours of age reduces the false-positive rate roughly tenfold (0.05% vs 0.50%).
      selected_evidence:
        snippet: Pulse oximetry is highly specific for detection of critical congenital heart defects
          with moderate sensitivity, that meets criteria for universal screening.
        supports: SUPPORT
