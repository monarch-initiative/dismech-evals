  f69497ee7a3282e915264ac738542e5075181a6b86afeb989c5357a820b25a4d:
    claim:
      about:
        disease:
          name: Congenital Heart Disease
          disease_term:
            preferred_term: congenital heart disease
            term:
              id: MONDO:0005453
              label: congenital heart disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Developmental Gene Dosage Disruption
        biological_scale: MOLECULAR
        description: 'The upstream molecular trigger of most severe CHD: loss of normal dosage or function
          of genes required for cardiac morphogenesis. Three genetic mechanisms converge here — chromosomal
          aneuploidy, recurrent and non-recurrent copy-number variants, and point mutations (predominantly
          de novo in severe sporadic cases). De novo damaging variants are concentrated in genes highly
          expressed in the developing heart and, strikingly, in chromatin-modifying genes that write,
          read and erase H3K4 methylation and H2BK120 ubiquitination — the marks that characterise the
          "poised" promoters and enhancers of key developmental genes. Because the same genes are also
          highly expressed in the developing brain, this node also explains the co-occurrence of CHD with
          neurodevelopmental disability and extracardiac anomalies. Roughly 400 developing-heart-expressed
          genes are inferred to contribute.'
        genes:
        - preferred_term: KMT2D
          term:
            id: hgnc:7133
            label: KMT2D
        - preferred_term: CHD7
          term:
            id: hgnc:20626
            label: CHD7
        - preferred_term: RBFOX2
          term:
            id: hgnc:9906
            label: RBFOX2
        biological_processes:
        - preferred_term: chromatin organization
          term:
            id: GO:0006325
            label: chromatin organization
          modifier: LOSS_OF_FUNCTION
        - preferred_term: regulation of transcription by RNA polymerase II
          term:
            id: GO:0006357
            label: regulation of transcription by RNA polymerase II
          modifier: DECREASED
      selected_evidence:
        snippet: We find a marked excess of de novo mutations in genes involved in the production, removal
          or reading of histone 3 lysine 4 (H3K4) methylation, or ubiquitination of H2BK120, which is
          required for H3K4 methylation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:23665959
      reference_title: De novo mutations in histone-modifying genes in congenital heart disease.
      evidence_source: HUMAN_CLINICAL
      explanation: Identifies chromatin modification of developmental promoters/enhancers as the molecular
        process disrupted by de novo mutation in severe CHD.
    first_seen_at: '2026-09-25T15:20:25.264792+00:00'
