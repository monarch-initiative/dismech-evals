              id: MONDO:0005453
              label: congenital heart disease
        context: []
      assertion_type: Phenotype
      assertion:
        category: Cardiovascular
        name: Arrhythmia
        description: 'Rhythm and conduction disturbance, arising in CHD by two mechanistically distinct
          routes that this entry keeps separate. First, developmental: the septation transcription factor
          network also builds and maintains the atrioventricular conduction system, so NKX2-5 haploinsufficiency
          produces septal defect together with progressive atrioventricular block. Second, acquired: surgical
          scar, chamber dilation from chronic volume or pressure loading, and hypoxaemia create reentrant
          and triggered substrates in the repaired or palliated heart. Arrhythmia is the dominant late-mortality
          mechanism in adult survivors, which is why it is curated at root level rather than left to the
          individual lesion entries.'
        phenotype_term:
          preferred_term: Arrhythmia
          term:
            id: HP:0011675
            label: Arrhythmia
      selected_evidence:
        snippet: CAs associated with cardiovascular diseases cause structural or functional alterations
          of the heart, affecting the cardiac chambers, valves, coronary arteries, aorta, and cardiac
          conduction, thus increasing the likelihood of arrhythmias, cardiac arrest, and sudden cardiac
          death (SCD).
        supports: SUPPORT
