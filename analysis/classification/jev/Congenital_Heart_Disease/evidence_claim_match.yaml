  9c9374103ba8d2258dad8f13ac91367809fb43858f5a6a7cf775b872bdf33edd:
    claim:
      about:
        disease:
          name: Congenital Heart Disease
          disease_term:
            preferred_term: congenital heart disease
            term:
              id: MONDO:0005453
              label: congenital heart disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Maternal Metabolic and Teratogenic Perturbation of Cardiogenesis
        biological_scale: ORGANISM
        description: The non-genetic arm of CHD causation. During the window of cardiac organogenesis
          (roughly gestational weeks 3-8) the embryonic heart is vulnerable to the maternal metabolic
          and pharmacological environment. Pregestational diabetes is by a wide margin the strongest established
          modifiable risk factor; the proposed mediators are persistent embryonic hyperglycaemia, oxidative
          stress, dysregulation of hypoxia-inducible factor 1, and downregulation of the very NOTCH1 and
          NKX2-5 programmes that the genetic arm of this entry disrupts. Definitive teratogenic exposures
          include maternal rubella, untreated maternal phenylketonuria, thalidomide, retinoids and vitamin
          A congeners, and indomethacin tocolysis. Periconceptional folic acid / multivitamin intake is
          the principal candidate protective exposure.
        biological_processes:
        - preferred_term: cellular response to oxidative stress
          term:
            id: GO:0034599
            label: cellular response to oxidative stress
          modifier: INCREASED
      selected_evidence:
        snippet: Factors such as persistent maternal hyperglycemia, oxidative stress, polymorphism of
          uncoupling protein 2, polymorphism of adiponectin gene, Notch 1 pathway, Nkx2.5 disorders, dysregulation
          of the hypoxia-inducible factor 1, and viral etiologies are associated with the occurrence of
          congenital heart diseases in the offspring of mothers with pregestational diabetes mellitus.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35838899
      reference_title: Effect of maternal pregestational diabetes mellitus on congenital heart diseases.
      evidence_source: HUMAN_CLINICAL
      explanation: Names the proposed molecular mediators, which converge on the same NOTCH1 and NKX2-5
        programmes as the genetic arm.
