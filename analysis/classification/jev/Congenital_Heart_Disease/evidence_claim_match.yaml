            genotype: Wild-type and contractility/flow-perturbed embryos (e.g. cardiac troponin and myosin
              morphants that abolish or alter intracardiac flow while the heart tube continues to form)
            publication: PMID:26969993
            description: The optically accessible, externally developing zebrafish embryo can survive
              by diffusion for long enough to tolerate near-complete loss of cardiac output, which is
              what makes it possible to remove flow and still observe morphogenesis. It is the system
              that supplies essentially all of the direct evidence behind the "no flow, no grow" node
              in this entry, and therefore the model on which the chd_flow_dependent_human_evidence HUMAN_MODEL_MISMATCH
              discussion turns.
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Flow-Dependent Cardiac Morphogenesis Failure
        relationship: PERTURBS
        fidelity: MODERATE
        description: Experimentally removes or alters haemodynamic force during cardiac development and
          observes the morphogenetic consequence, establishing flow as a causal morphogenetic input rather
          than a correlate of it.
        limitations: 'Substantial species divergence at exactly the points this entry cares about: the
          zebrafish heart is two-chambered, undergoes no atrial or ventricular septation and has no separate
          pulmonary circulation, so the septation, conotruncal and duct-dependent arms of the model cannot
          be represented at all. Embryo scale also places the developing zebrafish heart in a different
          flow regime from the human embryo. The node is consequently curated with evidence_source MODEL_ORGANISM,
          and the translational question is left open in discussions.chd_flow_dependent_human_evidence
          rather than closed by this model.'
        readouts:
        - name: Cardiac morphogenesis under experimentally altered haemodynamic force
