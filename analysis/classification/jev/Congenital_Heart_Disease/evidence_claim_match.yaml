      assertion_type: Subtype
      assertion:
        name: LVOTO
        display_name: Left ventricular outflow tract obstruction
        description: 'Obstructive lesions of the left heart and systemic outflow — hypoplastic left heart
          syndrome, aortic valve stenosis, bicuspid aortic valve, coarctation of the aorta, and Shone
          complex. Mechanistically the class in which flow-dependent morphogenesis ("no flow, no grow")
          is most clearly implicated: an early obstruction limits flow through left heart structures,
          whose growth is then secondarily curtailed.'
      selected_evidence:
        snippet: the prevalence of lesions grouped together as left ventricular outflow tract obstruction
          (which includes hypoplastic left heart syndrome) decreased
        supports: SUPPORT
