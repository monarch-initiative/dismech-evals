      assertion_type: Genetic
      assertion:
        name: TFAP2B
        gene_term:
          preferred_term: TFAP2B
          term:
            id: hgnc:11743
            label: TFAP2B
        association: Pathogenic Variants
        relationship_type: CAUSATIVE
        notes: 'Transcription factor AP-2 beta, expressed in neural crest cells and reported to have a
          role in ductal, facial and limb development. No `subtype` foreign key is set on this record:
          the lesion this gene produces is patent ductus arteriosus, and none of this entry''s seven lesion
          rows covers it. The Septal row is limited to communications across the interatrial and interventricular
          septum and names the duct only in passing, and a patent duct is not a septal defect. The gene
          is wired to the cardiac neural crest node, which is where its mechanism sits. Pathogenic variants
          span Char syndrome, in which patent ductus arteriosus accompanies facial dysmorphism and hand
          anomalies, and familial nonsyndromic patent ductus arteriosus; ClinGen lumps both into TFAP2B-related
          congenital heart disease spectrum disorder (MONDO:1010098) and grades it Definitive under an
          autosomal dominant model, read from the ClinGen Gene-Disease Validity CSV on 2026-09-24. The
          isolated patent ductus arteriosus entries in this knowledge base (Patent_Ductus_Arteriosus,
          Patent_Ductus_Arteriosus_3) curate PRDM6, a different gene, and do not cover this one.

          '
      selected_evidence:
        snippet: Dimerization of both mutants with normal TFAP2B adversely affected transactivation, demonstrating
          a dominant-negative mechanism.
        supports: SUPPORT
        directness: DIRECT
