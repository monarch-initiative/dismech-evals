          interpretation: Heart development is abnormal when the forces are absent or disrupted, which
            is the observation the node's causal claim rests on.
      selected_evidence:
        snippet: Here, we discuss concepts of how embryonic heart function contributes to heart development
          using lessons learned mostly from studies in zebrafish.
        supports: SUPPORT
