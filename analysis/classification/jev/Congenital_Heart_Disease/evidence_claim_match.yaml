          term:
            id: GO:0060411
            label: cardiac septum morphogenesis
          modifier: DECREASED
      selected_evidence:
        snippet: These data indicate that NKX2-5 is important for regulation of septation during cardiac
          morphogenesis and for maturation and maintenance of atrioventricular node function throughout
          life.
        supports: SUPPORT
