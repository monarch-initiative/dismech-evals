              label: congenital heart disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Cardiac Progenitor Specification and Second Heart Field Deployment Failure
        biological_scale: CELLULAR
        description: The heart is not built from a single progenitor pool. The first heart field forms
          the linear heart tube and gives rise principally to the left ventricle and part of the atria;
          the second heart field (SHF) is a distinct population of progenitors that is progressively added
          to both poles of the elongating tube. The SHF supplies the right ventricle, the outflow tract
          myocardium and the ventricular septal myocardium at the arterial pole, and atrial including
          atrial septal myocardium at the venous pole. Because SHF deployment lays down the template on
          which septation is later performed, and because it orchestrates outflow tract development jointly
          with the neural crest, a deficit in progenitor addition is a single upstream lesion that can
          produce conotruncal, right ventricular hypoplastic, and septal phenotypes. This node is the
          reason a "root" CHD entry is mechanistically coherent rather than merely a list.
        genes:
        - preferred_term: HAND1
          term:
            id: hgnc:4807
            label: HAND1
        - preferred_term: HAND2
          term:
            id: hgnc:4808
            label: HAND2
        biological_processes:
        - preferred_term: embryonic heart tube development
          term:
            id: GO:0035050
            label: embryonic heart tube development
          modifier: DECREASED
        - preferred_term: embryonic heart tube morphogenesis
          term:
            id: GO:0003143
            label: embryonic heart tube morphogenesis
          modifier: DECREASED
        - preferred_term: heart development
          term:
            id: GO:0007507
            label: heart development
          modifier: DECREASED
      selected_evidence:
        snippet: The SHF gives rise to ventricular septal, right ventricular and outflow tract myocardium
          at the arterial pole, and atrial, including atrial septal myocardium, at the venous pole.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38488639
      reference_title: On the involvement of the second heart field in congenital heart defects.
      evidence_source: OTHER
      explanation: Defines exactly which cardiac structures depend on second heart field addition, and
        therefore which lesions a deployment deficit can produce.
