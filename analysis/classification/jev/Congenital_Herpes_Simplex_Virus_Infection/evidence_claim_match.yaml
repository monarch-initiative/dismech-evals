      assertion_type: Transmission
      assertion:
        name: Intrapartum transmission from infected maternal genital secretions
        description: The dominant route. The neonate is infected during passage through an infected birth
          canal, which is why this is a perinatal rather than a transplacental disease in most cases,
          and why maternal shedding at delivery rather than maternal viraemia is the operative exposure.
      selected_evidence:
        snippet: 'Considering when the transmission of the infection from the mother to the fetus/newborn
          occurs, three types of neonatal infection can be distinguished: intrauterine infection (5% of
          cases), postnatal infection (10% of cases), and perinatal infections (85% of cases).'
        supports: SUPPORT
