              the peritoneal cavity. It reliably relieves raised intracranial pressure and generally produces
              a greater reduction in ventricular size than endoscopic treatment, but it creates lifelong
              shunt dependence with a substantial revision and infection burden, and — importantly for
              this entry — it does not address a genetic cause and yields only marginal improvement in
              neurocognitive deficits.'
            therapeutic_modality: SURGERY
