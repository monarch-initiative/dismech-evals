              label: congenital hydrocephalus
        context: []
      assertion_type: Treatment
      assertion:
        name: Endoscopic Third Ventriculostomy with Choroid Plexus Cauterization
        description: 'The shunt-free alternative: an endoscopic stoma in the floor of the third ventricle
          diverts CSF flow, and cauterization of the choroid plexus reduces CSF production. It is technically
          harder than shunting and fails more often in the first months, but virtually all its failures
          occur within six months, after which the risk is low — a decisive advantage where urgent shunt-revision
          surgery is not reliably available. In a randomized trial in Ugandan infants with post-infectious
          hydrocephalus, cognitive outcomes at 12 months did not differ significantly from ventriculoperitoneal
          shunting. Uniquely among the treatments here, its cauterization component acts on the CSF hypersecretion
          node rather than only on the fluid already accumulated.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: endoscopic third ventriculostomy
          term:
            id: NCIT:C182204
            label: Third Ventriculostomy
      selected_evidence:
        snippet: This single-center study involving Ugandan infants with postinfectious hydrocephalus
          showed no significant difference between endoscopic ETV-CPC and ventriculoperitoneal shunting
          with regard to cognitive outcomes at 12 months.
        supports: SUPPORT
