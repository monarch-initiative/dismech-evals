              id: MONDO:0016349
              label: congenital hydrocephalus
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired CSF Absorption and Perivascular Clearance
        biological_scale: TISSUE
        role: effector
        description: 'The distal, non-obstructive route to ventricular enlargement: CSF is produced normally
          but cannot be translocated out of the craniospinal compartment. In the familiar bulk-flow model
          this is failure at the arachnoid granulations, but up to a third of CSF leaves the skull along
          cranial nerve sheaths into the lymphatic system, and CSF has been shown to move along paravascular
          pathways into the parenchyma and thence to the systemic circulation. This entry deliberately
          does NOT declare conforms_to against the glymphatic_dysfunction module here. Conformance is
          a structural assertion that tooling reads as satisfied, and the honest state of the evidence
          does not support it: the source literature states plainly that whether disturbances of the lymphatic
          exit pathway contribute to human hydrocephalus is not known, and the module itself carries an
          unresolved convective-versus-diffusive controversy. The relationship is recorded as a KNOWLEDGE_GAP
          discussion attached to this node instead, which is where a claim this uncertain belongs.'
        cell_types:
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: cerebrospinal fluid circulation
          term:
            id: GO:0090660
            label: cerebrospinal fluid circulation
          modifier: DECREASED
        locations:
        - preferred_term: perivascular space
          term:
            id: UBERON:0014930
            label: perivascular space
        - preferred_term: brain
          term:
            id: UBERON:0000955
            label: brain
      selected_evidence:
        snippet: Recently, CSF has also been found to flow in a pulsatile manner from the intracranial
          subarachnoid space into the brain parenchyma, and then into the systemic circulation, along
          paravascular pathways
        supports: SUPPORT
