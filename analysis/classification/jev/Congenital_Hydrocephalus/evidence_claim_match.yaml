  0af8054e608e9a67836e956ce00919a6c11e8597a1da39d0066c3eb0b8860de0:
    claim:
      about:
        disease:
          name: Congenital Hydrocephalus
          disease_term:
            preferred_term: congenital hydrocephalus
            term:
              id: MONDO:0016349
              label: congenital hydrocephalus
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Choroid Plexus CSF Hypersecretion
        biological_scale: CELLULAR
        role: effector
        description: 'The choroid plexus epithelium secretes more fluid than any other epithelium. In
          a rat model of post-haemorrhagic hydrocephalus, TLR4-dependent activation of the Ste20-type
          stress kinase SPAK phosphorylates and stimulates the apical NKCC1 cotransporter, producing an
          approximately three-fold, bumetanide-sensitive increase in CSF secretion — so on that evidence
          the secretion rate rises rather than the absorption surface simply failing. Scope caveat, and
          it is the same discipline applied to the cilia and perivascular-clearance nodes: the entire
          SPAK-NKCC1 chain here is rodent, and no human measurement of post-haemorrhagic CSF hypersecretion
          is curated in this entry. The node carries a HUMAN_MODEL_MISMATCH discussion for that reason.
          It remains the node with the clearest pharmacological handle in the entry, and it is the mechanistic
          rationale for choroid plexus cauterization as a component of endoscopic treatment.'
        cell_types:
        - preferred_term: choroid plexus epithelial cell
          term:
            id: CL:0000706
            label: choroid plexus epithelial cell
        locations:
        - preferred_term: choroid plexus
          term:
            id: UBERON:0001886
            label: choroid plexus
        biological_processes:
        - preferred_term: cerebrospinal fluid secretion
          term:
            id: GO:0033326
            label: cerebrospinal fluid secretion
          modifier: INCREASED
        molecular_functions:
        - preferred_term: NKCC1 sodium-potassium-chloride cotransport
          term:
            id: GO:0008511
            label: sodium:potassium:chloride symporter activity
          modifier: INCREASED
      selected_evidence:
        snippet: Genetic depletion of TLR4 or SPAK normalizes hyperactive CSF secretion rates and reduces
          PHH symptoms
        supports: SUPPORT
