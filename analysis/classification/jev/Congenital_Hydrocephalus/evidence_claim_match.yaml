            label: X-linked hydrocephalus with stenosis of the aqueduct of Sylvius
        description: 'The severe end of the L1CAM-related L1 syndrome spectrum (which also includes MASA
          syndrome / X-linked complicated spastic paraplegia type 1 and X-linked complicated corpus callosum
          agenesis). Affected males are born with severe hydrocephalus, adducted thumbs and spasticity,
          and hypoplasia or aplasia of the corticospinal tracts is near-constant at autopsy. It is the
          single most frequently identified monogenic cause of otherwise isolated congenital hydrocephalus.
          Note the phenotypic overlap trap: callosal abnormality, aqueductal stenosis and adducted thumbs
          are all seen in L1CAM-negative hydrocephalus too, so none of them confirms or excludes the diagnosis.'
        genes:
