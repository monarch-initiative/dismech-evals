  62965026c2f21242ecbf546215d26b6cad6bc7e61cb54bb14fedf8c6fbf5a5b2:
    claim:
      about:
        disease:
          name: Congenital Hydrocephalus
          disease_term:
            preferred_term: congenital hydrocephalus
            term:
              id: MONDO:0016349
              label: congenital hydrocephalus
        context: []
      assertion_type: Subtype
      assertion:
        name: Dandy-Walker-associated
        display_name: Hydrocephalus associated with Dandy-Walker malformation
        subtype_term:
          preferred_term: isolated Dandy-Walker malformation with hydrocephalus
          term:
            id: MONDO:0017110
            label: isolated Dandy-Walker malformation with hydrocephalus
        description: 'Hydrocephalus accompanying the Dandy-Walker malformation (vermian hypoplasia, cystic
          dilatation of the fourth ventricle, enlarged posterior fossa). The obstruction is distal — at
          the level of the fourth ventricle and its outflow tracts — rather than at the aqueduct, and
          a single shunt controlling both ventricle and cyst is generally effective. Outcome is governed
          more by the associated malformations and the degree of vermian involvement than by the hydrocephalus
          itself. This subtype deliberately carries only the CSF-diversion behaviour: the malformation
          itself, its ZIC1/ZIC4 and FOXC1 developmental mechanism, and the without-hydrocephalus form
          are curated as kb/disorders/Dandy-Walker_Syndrome.yaml (MONDO:0009072), which holds MONDO:0017110
          as a subtype for the same reason this entry does. The two entries cut one concept along different
          axes - by hydrocephalus aetiology here, by malformation there - and neither should grow a copy
          of the other''s content.'
      selected_evidence:
        snippet: Among therapeutical strategies, single shunting (ventriculo-peritoneal or cyst-peritoneal
          shunts) appears effective in the control of both ventricle and cyst size.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/5
      evidence_path: /has_subtypes/5/evidence/0
      context_paths:
