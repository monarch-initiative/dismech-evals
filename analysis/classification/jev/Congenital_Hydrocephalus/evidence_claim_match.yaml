            subtype_term:
              preferred_term: isolated Dandy-Walker malformation with hydrocephalus
              term:
                id: MONDO:0017110
                label: isolated Dandy-Walker malformation with hydrocephalus
            description: 'Hydrocephalus accompanying the Dandy-Walker malformation (vermian hypoplasia,
              cystic dilatation of the fourth ventricle, enlarged posterior fossa). The obstruction is
              distal — at the level of the fourth ventricle and its outflow tracts — rather than at the
              aqueduct, and a single shunt controlling both ventricle and cyst is generally effective.
              Outcome is governed more by the associated malformations and the degree of vermian involvement
              than by the hydrocephalus itself. This subtype deliberately carries only the CSF-diversion
              behaviour: the malformation itself, its ZIC1/ZIC4 and FOXC1 developmental mechanism, and
              the without-hydrocephalus form are curated as kb/disorders/Dandy-Walker_Syndrome.yaml (MONDO:0009072),
              which holds MONDO:0017110 as a subtype for the same reason this entry does. The two entries
              cut one concept along different axes - by hydrocephalus aetiology here, by malformation
              there - and neither should grow a copy of the other''s content.'
          role: subtype
      assertion_type: Phenotype
      assertion:
        category: Neurological
        name: Dandy-Walker Malformation
        description: Vermian hypoplasia with cystic dilatation of the fourth ventricle and an enlarged
          posterior fossa, producing distal obstruction of CSF egress.
        phenotype_term:
          preferred_term: Dandy-Walker malformation
          term:
            id: HP:0001305
            label: Dandy-Walker malformation
        subtype: Dandy-Walker-associated
