        relationship: RECAPITULATES
        fidelity: LOW
        description: Reproduces loss of intracellular and intercellular rotational alignment of ependymal
          motile cilia, with measurably slower generated flow and consequent hydrocephalus.
        limitations: 'Fidelity is recorded as LOW deliberately, not because the mouse experiment is weak
          but because its translational validity to human congenital hydrocephalus is contested: human
          ventriculomegaly typically begins in utero before ependymal cilia functionally mature, and human
          motile ciliopathies infrequently cause hydrocephalus. See the gap_cilia_hypothesis_human_translatability
          discussion.'
        readouts:
