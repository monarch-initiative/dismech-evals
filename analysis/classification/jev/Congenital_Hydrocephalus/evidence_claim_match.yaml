      assertion:
        name: Intraventricular Haemorrhage and Choroid Plexus Inflammatory Activation
        biological_scale: TISSUE
        role: trigger
        description: Intraventricular blood — germinal matrix haemorrhage of prematurity, or cryptic prenatal
          microhaemorrhage detectable only as hemosiderin-laden macrophages within a structurally normal
          aqueduct — activates a Toll-like receptor 4 and NF-kB-dependent inflammatory response in the
          choroid plexus epithelium. This is an inflammatory rather than a mechanical lesion, and it is
          why post-haemorrhagic hydrocephalus is curated as more than an obstructed or scarred absorption
          surface.
        cell_types:
        - preferred_term: choroid plexus epithelial cell
          term:
            id: CL:0000706
            label: choroid plexus epithelial cell
        locations:
        - preferred_term: choroid plexus
          term:
            id: UBERON:0001886
            label: choroid plexus
      selected_evidence:
        snippet: In a rat model of PHH, we demonstrate that IVH causes a Toll-like receptor 4 (TLR4)-
          and NF-κB-dependent inflammatory response in the CPE that is associated with a ∼3-fold increase
          in bumetanide-sensitive CSF secretion.
        supports: SUPPORT
