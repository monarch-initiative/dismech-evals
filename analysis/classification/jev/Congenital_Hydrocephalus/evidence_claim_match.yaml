      assertion_type: Treatment
      assertion:
        name: Prenatal Repair of Myelomeningocele
        description: 'In utero closure of the open neural tube defect before 26 weeks of gestation. In
          the MOMS randomized trial it roughly halved the rate of shunt placement by 12 months and improved
          hindbrain herniation, at the cost of increased preterm delivery and uterine dehiscence. Mechanistically
          this is the only treatment in the entry that acts on the *upstream* trigger rather than on the
          accumulated fluid: closing the defect restores the embryonic ventricular pressure whose absence
          produces the Chiari II configuration.'
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: neurosurgical procedure
          term:
            id: NCIT:C15656
            label: Neurosurgical Procedure
      selected_evidence:
        snippet: However, prenatal surgery was associated with an increased risk of preterm delivery and
          uterine dehiscence at delivery.
        supports: SUPPORT
