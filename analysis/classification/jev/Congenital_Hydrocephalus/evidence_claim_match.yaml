  bdba59ec144f16ca1d7c6655cea899a5bd05c025917b6d53960a3443cb0ccc86:
    claim:
      about:
        disease:
          name: Congenital Hydrocephalus
          disease_term:
            preferred_term: congenital hydrocephalus
            term:
              id: MONDO:0016349
              label: congenital hydrocephalus
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_cilia_hypothesis_human_translatability
        prompt: Does ependymal motile cilia dysfunction cause human congenital hydrocephalus, or is the
          mouse ciliopathy phenotype a species-specific result that does not translate to the human fetal
          brain?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Ependymal Motile Cilia Beat Dysfunction and Loss of Directional CSF Flow
        - pathophysiology#Neuroepithelial Planar Polarity and Apical Constriction Failure
        rationale: 'This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP: the evidence exists and
          is strong, but it is murine, and its translational validity is precisely what is disputed. Three
          mismatches apply. Human ventriculomegaly typically arises in utero, before ependymal cilia have
          functionally matured, so cilia cannot be the primary propeller of CSF at the time the phenotype
          begins. Human motile ciliopathies — primary ciliary dyskinesia — infrequently cause hydrocephalus,
          in contrast to the mouse models on which the hypothesis was built. And ciliary genes have functions
          in signalling and neural stem cell fate beyond generating flow, so a hydrocephalus phenotype
          in a ciliary-gene mutant may report altered neurodevelopment rather than lost flow — which would
          move the finding onto the dysgenesis hypothesis arm of this entry rather than the CSF-dynamics
          arm. Curators should not upgrade the module-conformance link at these nodes into a claim that
          cilia-driven flow determines human fetal ventricular volume.'
        proposed_experiments:
        - experiment_id: exp_ch_cilia_human_fetal_flow_timing
          name: Timing of ependymal ciliary maturation relative to onset of ventriculomegaly in human
            fetal brain
          description: In human fetal brain across the gestational window in which ventriculomegaly is
            first detectable by ultrasound (14-20 weeks), stage ependymal multiciliation and ciliary beat
            competence against the timing of ventricular enlargement in the same specimens, and compare
            cases carrying ciliary-gene variants against cases carrying neural-stem-cell-fate gene variants.
            The discriminating prediction is that ventricular enlargement preceding functional ciliary
            maturation cannot be caused by lost cilia-generated flow.
        - experiment_id: exp_ch_pcd_cohort_ventricular_volume
          name: Systematic ventricular volumetry in a genotyped primary ciliary dyskinesia cohort
          description: Measure ventricular volume systematically, rather than by clinical referral, in
            a genotyped primary ciliary dyskinesia cohort stratified by the affected axonemal component,
            to establish whether subclinical ventriculomegaly is common in human motile ciliopathy and
            merely under-ascertained, or genuinely rare as the clinical literature implies.
      selected_evidence:
        snippet: Second, we highlight that in contrast to mouse models, motile ciliopathies infrequently
          cause hydrocephalus in humans.
        supports: REFUTE
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36341771
      reference_title: Rethinking the cilia hypothesis of hydrocephalus.
      evidence_source: OTHER
      explanation: 'The core mismatch: the human phenotype does not follow the mouse phenotype, which
        is what makes this a translational-validity question rather than an evidence gap.'
