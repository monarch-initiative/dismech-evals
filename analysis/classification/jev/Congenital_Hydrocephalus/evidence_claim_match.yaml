      assertion:
        name: Impaired Fetal Neuro-Gliogenesis and Brain Dysgenesis
        biological_scale: CELLULAR
        role: effector
        description: 'The parallel, non-plumbing arm. Multiple congenital hydrocephalus genes are regulators
          of neural stem cell biology and converge on human transcriptional networks and cell types specific
          to fetal neuro-gliogenesis. On this reading, the enlarged ventricle in a subset of patients
          is a read-out of periventricular brain that was never properly built, rather than of fluid pushed
          against an obstruction. The prediction is clinical and testable: CSF diversion should not normalize
          outcome in these patients, and indeed poor neurodevelopmental outcomes and persistent ventriculomegaly
          after surgery are what motivated the search.'
        cell_types:
        - preferred_term: neural stem cell
