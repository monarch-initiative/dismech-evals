  cf62d58b7169bef073d4f8a6b99554e5b90127228b3b43e7b71da59bc8661e7e:
    claim:
      about:
        disease:
          name: Congenital Hydrocephalus
          disease_term:
            preferred_term: congenital hydrocephalus
            term:
              id: MONDO:0016349
              label: congenital hydrocephalus
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_csf_absorption_glymphatic_role_in_hydrocephalus
        prompt: Do disturbances of perivascular (glymphatic) and cranial-nerve-sheath lymphatic CSF efflux
          contribute causally to human congenital hydrocephalus, or is impaired absorption in this disease
          adequately described by failure at the arachnoid granulations?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Impaired CSF Absorption and Perivascular Clearance
        rationale: 'This is a KNOWLEDGE_GAP, not a HUMAN_MODEL_MISMATCH: the human evidence is absent
          rather than contradicted by a model. Up to a third of CSF is known to leave the skull along
          cranial nerve sheaths into the lymphatic system, and paravascular CSF-parenchyma exchange is
          established physiology, but the source literature states plainly that whether disturbances of
          that efflux route participate in the pathogenesis of human hydrocephalus is not known. This
          entry therefore declines to declare conformance to the glymphatic module at all: conformance
          is a structural assertion tooling reads as satisfied, and the anatomical route is established
          while its causal role in human hydrocephalus is not. The module''s own unresolved convective-versus-diffusive
          controversy is a second reason to withhold the link rather than a caveat attached to a declared
          one. This discussion is the artifact that records the relationship instead. Resolving this matters
          practically: if the lymphatic and perivascular routes are causal contributors, communicating
          congenital hydrocephalus acquires a therapeutic target that CSF diversion does not address.'
        proposed_experiments:
        - experiment_id: exp_ch_perivascular_efflux_infant_tracer
          name: Non-invasive assessment of perivascular and lymphatic CSF efflux in infant hydrocephalus
          description: In infants with communicating congenital hydrocephalus versus age-matched controls,
            assess perivascular and cranial-nerve-sheath lymphatic efflux with non-invasive imaging (intrathecal-contrast-free
            MRI surrogates plus cervical lymphatic imaging), acquired before and after CSF diversion.
            Measuring both before and after diversion is what separates a causal absorption deficit from
            a consequence of the distended ventricle — the cause-versus-consequence ambiguity the source
            review flags for CSF pulsatility.
      selected_evidence:
        snippet: but whether they play a role in the pathogenesis of human hydrocephalus is not yet known
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24932902
      reference_title: 'Infantile hydrocephalus: a review of epidemiology, classification and causes.'
      evidence_source: HUMAN_CLINICAL
      explanation: The explicit statement of the gap, made by the review that introduces the lymphatic
        efflux route into the hydrocephalus literature.
