        hypothesis_label: CSF Dynamics (Obstruction, Hypersecretion and Absorption Failure) Model
        status: CANONICAL
        description: 'The classical and still-dominant reading: hydrocephalus is an active distension
          of the ventricular system caused by physical or functional obstruction of CSF flow between its
          point of production and its point of absorption, with post-haemorrhagic disease adding a hypersecretory
          component. Under this model the ventricular enlargement is the primary lesion, raised intracranial
          pressure is its mediator, and CSF diversion is mechanistically curative of the fluid problem.'
        notes: 'Scope boundary: this model is not in dispute for post-haemorrhagic, post-infectious and
          frankly obstructive disease. What the alternative hypothesis disputes is its sufficiency for
          the sporadic and Mendelian developmental forms.'
      selected_evidence:
        snippet: Our preferred definition is that proposed as part of the International Hydrocephalus
          Working Group, which describes “an active distension of the ventricular system...resulting from
          inadequate passage of cerebrospinal fluid from its point of production within the cerebral ventricles
          to its point of absorption into the systemic circulation
        supports: SUPPORT
