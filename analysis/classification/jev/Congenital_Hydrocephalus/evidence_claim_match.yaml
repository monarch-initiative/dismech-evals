            description: 'Compound conditional ablation of the three Dishevelled genes in the ependymal
              lineage. The informative feature is what is spared: ependymal cells differentiate normally
              and cilia are assembled, so the phenotype isolates loss of ciliary planar alignment from
              loss of cilia themselves.'
            publication: PMID:25043421
