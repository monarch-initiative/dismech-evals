              label: congenital hydrocephalus
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_csf_hypersecretion_human_translatability
        prompt: Does inflammation-driven choroid plexus CSF hypersecretion occur in human post-haemorrhagic
          hydrocephalus, or is the TLR4-SPAK-NKCC1 axis a rodent finding whose magnitude and therapeutic
          relevance in the preterm human infant are unmeasured?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Choroid Plexus CSF Hypersecretion
        - pathophysiology#Intraventricular Haemorrhage and Choroid Plexus Inflammatory Activation
        rationale: 'This is a HUMAN_MODEL_MISMATCH for the same reason as the cilia discussion: the evidence
          is strong and mechanistically complete — including loss-of-function rescue — but it is entirely
          rat. No human measurement of post-haemorrhagic CSF secretion rate is curated here. The mismatch
          matters because this node carries the entry''s only pharmacological target: if human post-haemorrhagic
          hydrocephalus is dominated by impaired absorption rather than by hypersecretion, then bumetanide
          or SPAK inhibition would be treating a mechanism that is not rate-limiting in patients, and
          the observed benefit of choroid plexus cauterization would need a different explanation. The
          entry states the rodent provenance in the node description rather than letting the SPAK-NKCC1
          chain read as established human physiology.'
        proposed_experiments:
        - experiment_id: exp_ch_human_phh_csf_secretion_rate
          name: Direct measurement of CSF secretion rate in preterm infants with post-haemorrhagic ventricular
            dilatation
          description: In preterm infants already undergoing CSF drainage for post-haemorrhagic ventricular
            dilatation, measure CSF production rate directly from drainage volumes under controlled pressure,
            comparing infants with recent intraventricular haemorrhage against infants drained for non-haemorrhagic
            indications. Pair with choroid plexus inflammatory markers and phospho-NKCC1 in the drained
            CSF. The discriminating prediction is that the haemorrhagic group shows a raised production
            rate; if production is equal and only clearance differs, the rodent axis does not carry to
            humans.
      selected_evidence:
        snippet: PHH is classically attributed to primary impairments in CSF reabsorption, but little
          experimental evidence supports this concept. In contrast, the potential contribution of CSF
          secretion to PHH has received little attention.
        supports: SUPPORT
