              label: congenital hydrocephalus
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ch_dysgenesis_versus_dynamics_case_assignment
        prompt: For an individual infant with congenital hydrocephalus, what evidence assigns the case
          to the CSF-dynamics model versus the neural stem cell dysgenesis model, and does that assignment
          predict the neurodevelopmental benefit of CSF diversion?
        kind: OPEN_QUESTION
        status: OPEN
        attaches_to:
        - pathophysiology#Progressive Ventricular Dilatation and Raised Intracranial Pressure
        - pathophysiology#Impaired Fetal Neuro-Gliogenesis and Brain Dysgenesis
        rationale: 'The two mechanistic hypotheses curated in this entry are not merely theoretical alternatives
          — they predict different things about what shunting can achieve, and the persistence of ventriculomegaly
          and poor neurodevelopmental outcome in some post-surgical patients is the clinical observation
          that motivated the dysgenesis model. What is missing is a prospective test: whether genotype
          (a burdened neural-stem-cell-fate gene versus an obstructive or haemorrhagic aetiology) predicts
          the neurodevelopmental response to CSF diversion. Until that exists, curators should not collapse
          the two hypothesis groups, and should not present genotype as a treatment-selection criterion.'
        proposed_experiments:
        - experiment_id: exp_ch_genotype_stratified_shunt_outcome
          name: Genotype-stratified prospective cohort of neurodevelopmental outcome after CSF diversion
          description: Enrol infants undergoing first CSF diversion for congenital hydrocephalus with
            trio exome or genome sequencing at baseline, and follow standardized neurodevelopmental outcome
            to at least 24 months. Pre-specify the comparison of patients carrying damaging variants in
            neural-stem-cell-fate genes against those with obstructive, haemorrhagic or infectious aetiology.
            The dysgenesis model predicts that pressure relief is achieved in both groups while neurodevelopmental
            trajectory improves only in the second.
      selected_evidence:
        snippet: The poor neurodevelopmental outcomes and persistence of ventriculomegaly in some post-surgical
          patients highlight our limited knowledge of disease mechanisms.
        supports: SUPPORT
