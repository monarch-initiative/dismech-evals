  3976a8dc2283bc2f6818bd408b53ac0e8c54443ae9044562d759162cf057a3ee:
    claim:
      about:
        disease:
          name: Congenital Hydrocephalus
          disease_term:
            preferred_term: congenital hydrocephalus
            term:
              id: MONDO:0016349
              label: congenital hydrocephalus
        context: []
      assertion_type: Subtype
      assertion:
        name: Chiari II-associated
        display_name: Hydrocephalus secondary to myelomeningocele with Chiari II malformation
        description: 'Hydrocephalus complicating open neural tube defect. The great majority of infants
          undergoing myelomeningocele repair carry a diagnosis of hydrocephalus. Under the McLone-Knepper
          unified theory the hindbrain deformity itself is a downstream consequence of the open neural
          tube: fluid and pressure fail to accumulate in the embryonic ventricular system, the posterior
          fossa stays small, and the hindbrain is displaced — which then obstructs CSF egress. This subtype
          is a comorbid complication of myelomeningocele, and cross-references but does not absorb the
          separate spina bifida cystica disease entity.'
      selected_evidence:
        snippet: A weighted total of 10,627 inpatient MMC repairs were documented in the NIS, 8233 (77.5%)
          of which had documented hydrocephalus
        supports: SUPPORT
