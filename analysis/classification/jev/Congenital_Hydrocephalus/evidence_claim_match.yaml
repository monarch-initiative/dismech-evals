  876868f705127bdd22a3216593ddc56d096d4a5ae7741c8be20ad7545277401e:
    claim:
      about:
        disease:
          name: Congenital Hydrocephalus
          disease_term:
            preferred_term: congenital hydrocephalus
            term:
              id: MONDO:0016349
              label: congenital hydrocephalus
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: neural_stem_cell_dysgenesis_model
        hypothesis_label: Neural Stem Cell Fate Disruption and Fetal Brain Dysgenesis Model
        status: EMERGING
        description: 'The competing reading from large trio exome cohorts: in a substantial fraction of
          sporadic congenital hydrocephalus the causal lesion is genetic disruption of early brain development
          — ventricular-zone neural stem cell fate and prenatal neuro-gliogenesis — rather than impaired
          CSF dynamics. Ventriculomegaly is then a consequence of the dysgenesis, which predicts that
          CSF diversion will relieve pressure without restoring neurodevelopmental trajectory. Curated
          as EMERGING, not CANONICAL: the evidence is strong human genetics with a stated mechanistic
          inference, and it applies to a subset of patients, not to the disease as a whole.'
        notes: The two hypotheses are not mutually exclusive at the level of the disease — they may both
          be true of different patients — but they are mutually exclusive at the level of an individual
          case, and they make different predictions about what shunting can achieve. That is why they
          are curated as two hypothesis groups over a shared central effector node rather than as one
          blended chain.
      selected_evidence:
        snippet: These data implicate genetic disruption of early brain development, not impaired CSF
          dynamics, as the primary pathomechanism of a significant number of patients with sporadic CH.
        supports: SUPPORT
    origin:
