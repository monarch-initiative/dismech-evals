      assertion:
        name: Aqueductal Stenosis, Atresia and Forking
        biological_scale: TISSUE
        role: effector
        description: 'Narrowing, atresia or forking of the cerebral aqueduct is the single most common
          structural lesion in hydrocephalus that is otherwise confined to the brain, and it is the classic
          proximal obstruction. In CCDC88C-related disease the lesion is not a plug but a developmental
          malformation: multifocal atresia-forking, with the residual channel replaced by rosettes of
          ependymal cells, extending beyond the aqueduct into the central canal of the medulla. Note that
          aqueductal patency at autopsy does not exclude the subtype — an affected 20-week fetus in one
          CCDC88C family had a patent aqueduct despite MRI evidence of obstruction.'
        cell_types:
        - preferred_term: ependymal cell
