          term:
            id: hgnc:6470
            label: L1CAM
        inheritance:
        - name: X-linked
      selected_evidence:
        snippet: Males with HSAS are born with severe hydrocephalus, adducted thumbs, and spasticity;
          intellectual disability is severe.
        supports: SUPPORT
