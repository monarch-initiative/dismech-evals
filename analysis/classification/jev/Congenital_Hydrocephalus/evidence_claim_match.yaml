      assertion_type: Environmental
      assertion:
        name: Intrauterine infection (cytomegalovirus, Toxoplasma gondii, enterovirus, lymphocytic choriomeningitis
          virus)
        description: Congenital infection acquired in utero is an established route to hydrocephalus present
          at birth, and neonatal ventriculitis is the dominant aetiology of infant hydrocephalus in sub-Saharan
          Africa. The contribution of unrecognized intrauterine infection to apparently idiopathic congenital
          hydrocephalus is suspected but not quantified.
        effect: Triggers post-infectious congenital hydrocephalus through ventriculitis, ependymal injury
          and impaired CSF flow or absorption.
        notes: No ECTO exposure_term is bound. The concept needed here is intrauterine infection by a
          specific congenital pathogen, and binding a generic infectious-agent exposure term would be
          less accurate than free text; see the dismech-terms rule that no term beats a bad one.
      selected_evidence:
        snippet: The high crude birth rate, greater proportion of patients with postinfectious etiology,
          and higher incidence of NTDs all contribute to a case volume in low- and middle-income countries
          that outweighs that in high-income countries by more than 20-fold.
        supports: SUPPORT
