      assertion:
        name: Ependymal Motile Cilia Beat Dysfunction and Loss of Directional CSF Flow
        biological_scale: CELLULAR
        role: effector
        genes:
        - preferred_term: FOXJ1
          term:
            id: hgnc:3816
            label: FOXJ1
        conforms_to: ciliopathy_dysfunction#Motile Cilia Beat Dysfunction
        description: 'Multiciliated ependymal cells line the ventricular wall and generate directional
          CSF movement by coordinated ciliary beating. When intracellular and intercellular rotational
          alignment of the basal bodies is lost — as in compound ablation of the Dishevelled genes, the
          same non-canonical Wnt effectors that DAPLE regulates — the cilia are present and the cells
          differentiate normally, but the flow they generate is significantly slower, and hydrocephalus
          follows. This node is curated with an explicit caveat: the supporting mechanistic evidence is
          murine, human motile ciliopathies infrequently cause hydrocephalus, and the entry does not treat
          cilia-driven flow as the primary determinant of human fetal ventricular volume (see the HUMAN_MODEL_MISMATCH
          discussion).'
        cell_types:
        - preferred_term: ependymal cell
          term:
            id: CL:0000065
            label: ependymal cell
        biological_processes:
        - preferred_term: cilium movement
          term:
            id: GO:0003341
            label: cilium movement
          modifier: ABNORMAL
        - preferred_term: cerebrospinal fluid circulation
          term:
            id: GO:0090660
            label: cerebrospinal fluid circulation
          modifier: DECREASED
        locations:
        - preferred_term: brain ventricle
          term:
            id: UBERON:0004086
            label: brain ventricle
      selected_evidence:
        snippet: Defects in ependymal (E) cells, which line the ventricle and generate cerebrospinal fluid
          flow through ciliary beating, can cause hydrocephalus.
        supports: SUPPORT
