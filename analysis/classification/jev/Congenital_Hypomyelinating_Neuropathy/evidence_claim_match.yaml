  39273576daedd01b8915a72907df3b3fa9cc7f2c7d9fea960b0a5c46efd33b34:
    claim:
      about:
        disease:
          name: Congenital Hypomyelinating Neuropathy
          disease_term:
            preferred_term: neuropathy, congenital hypomyelinating
            term:
              id: MONDO:0033352
              label: neuropathy, congenital hypomelinating
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Myelin Protein Mistrafficking and Loss of Surface Adhesion
        description: 'CHN-causing MPZ variants are predicted to destabilize the protein''s fold, and the
          mutant protein fails to reach the plasma membrane, accumulating instead in the cytosol with
          reduced adhesive properties. Because myelin protein zero compacts myelin lamellae by homophilic
          adhesion across the extracellular face, a protein that never reaches the surface cannot perform
          that function, whatever else is wrong with it.

          Evidence scope: the localization was measured in transfected cells, not in Schwann cells, and
          the destabilization is a modeling prediction rather than a measurement. The mislocalization
          is specifically *cytosolic*, which is not the same as the ER and Golgi retention documented
          for other myelin-gene variants — so this node evidences the mistrafficking arm of the module
          node it conforms to, and NOT the proteostatic-stress/unfolded-protein-response arm. A curator
          should not read ER stress into this entry without evidence for it in CHN.'
        role: amplifier
        biological_scale: CELLULAR
        conforms_to: schwann_cell_myelin_maintenance#Schwann Cell Proteostatic Stress and Myelin Protein
          Mistrafficking
        genes:
        - preferred_term: MPZ
          term:
            id: hgnc:7225
            label: MPZ
        cell_types:
        - preferred_term: myelinating Schwann cell
          term:
            id: CL:0000218
            label: myelinating Schwann cell
        biological_processes:
        - preferred_term: protein localization to plasma membrane
          term:
            id: GO:0072659
            label: protein localization to plasma membrane
          modifier: DECREASED
      selected_evidence:
        snippet: Subcellular location studies were performed and revealed that the mutant protein loses
          its correct location on the cell membrane surface and is mainly expressed in the cytosol, reducing
          its adhesive properties.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22176150
      reference_title: Congenital hypomyelinating neuropathy due to a novel MPZ mutation.
      evidence_source: IN_VITRO
      explanation: Direct demonstration of the mistrafficking mechanism and its functional consequence
        for myelin adhesion.
