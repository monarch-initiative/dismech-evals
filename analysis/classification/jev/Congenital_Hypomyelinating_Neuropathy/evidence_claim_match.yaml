          direction: RESTORED
          interpretation: The conduction and motor phenotype is reversible by restoring the protein postnatally,
            indicating the deficit is not fixed at birth in this model.
      selected_evidence:
        snippet: To understand the human neuropathology and to model human CNTNAP1C323R and CNTNAP1R764C
          mutations, we generated Cntnap1C324R and Cntnap1R765C mouse mutants, respectively.
