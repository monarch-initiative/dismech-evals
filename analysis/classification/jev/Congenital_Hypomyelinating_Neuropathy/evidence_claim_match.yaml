        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Peripheral Nerve Myelination
        description: 'Peripheral nerve fibers remain non-myelinated or only thinly myelinated. The histological
          signature on sural nerve biopsy is diagnostic and distinguishes CHN from acquired and later-onset
          inherited demyelinating neuropathy: poorly myelinated and unmyelinated axons surrounded by basal-lamina
          onion bulbs, with an absence of myelin breakdown products, because the myelin was never made
          rather than destroyed. The onion bulbs here reflect abortive Schwann cell ensheathment attempts
          rather than the repeated demyelination-remyelination cycles that produce them in CMT1.'
        role: central_effector
        biological_scale: TISSUE
        conforms_to: schwann_cell_myelin_maintenance#Dysmyelination and Segmental Demyelination of Peripheral
          Nerve
