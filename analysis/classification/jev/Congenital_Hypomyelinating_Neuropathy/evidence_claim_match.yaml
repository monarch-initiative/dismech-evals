      assertion_type: Pathophysiology
      assertion:
        name: Myelination Gene Lesion in Developing Schwann Cells
        description: A variant in a gene the Schwann cell requires to build compact myelin — MPZ (the
          principal compact-myelin adhesion protein), EGR2/KROX20 (the transcription factor driving the
          myelination program), PMP22, or MTMR2 — disables myelination during the perinatal window when
          peripheral nerve is normally myelinated. Because the lesion strikes before rather than after
          myelin is laid down, the resulting nerve is hypomyelinated from the outset rather than demyelinated,
          which is the defining difference between CHN and the later-onset demyelinating neuropathies
          caused by variants in the same genes.
