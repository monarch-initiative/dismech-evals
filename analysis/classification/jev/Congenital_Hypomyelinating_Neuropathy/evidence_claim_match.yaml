          name: Congenital Hypomyelinating Neuropathy
          disease_term:
            preferred_term: neuropathy, congenital hypomyelinating
            term:
              id: MONDO:0033352
              label: neuropathy, congenital hypomelinating
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Paranodal Axo-Glial Junction Failure
        description: 'The CHN3 arm, and the one place this entry''s mechanism is not about compact myelin
          at all. CNTNAP1 encodes a transmembrane cell-adhesion protein that forms the axonal side of
          the paranodal septate-like junction, in a complex with Contactin and the glial 155-kDa Neurofascin
          isoform. CHN3-causing variants destabilize the protein and leave it in the neuronal soma rather
          than the paranode, so the junction never assembles: myelin loops evert, the barrier separating
          nodal from juxtaparanodal domains is lost, and juxtaparanodal potassium channels mislocalize
          into the paranode. Saltatory conduction depends on that domain organization, so this node reaches
          the same conduction-slowing endpoint as the compact-myelin arm by a different route.

          Evidence scope: the human genetic link is established in patients, but the ultrastructural and
          mislocalization findings come from knock-in mice carrying the mouse equivalents of two human
          CNTNAP1 variants, and are graded MODEL_ORGANISM accordingly.'
        role: trigger
        biological_scale: CELLULAR
        genes:
        - preferred_term: CNTNAP1
          term:
            id: hgnc:8011
            label: CNTNAP1
        cell_types:
        - preferred_term: myelinating Schwann cell
          term:
            id: CL:0000218
            label: myelinating Schwann cell
        cellular_components:
        - preferred_term: paranodal junction
          term:
            id: GO:0033010
            label: paranodal junction
          modifier: ABNORMAL
        biological_processes:
        - preferred_term: protein localization to paranode region of axon
          term:
            id: GO:0002175
            label: protein localization to paranode region of axon
          modifier: DECREASED
      selected_evidence:
        snippet: Human CNTNAP1 mutations are linked to hypomyelinating neuropathy-3, which causes severe
          neurological deficits.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
