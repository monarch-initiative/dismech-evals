  58291116656da9cb604b0f5d37d6c1594d0439d90875f2c0dc9bbf66eb8cc11a:
    claim:
      about:
        disease:
          name: Congenital Insensitivity to Pain
          disease_term:
            preferred_term: congenital insensitivity to pain
            term:
              id: MONDO:0015364
              label: hereditary sensory and autonomic neuropathy
        context: []
      assertion_type: Subtype
      assertion:
        name: SCN9A AR-CIP
        display_name: SCN9A-related channelopathy-associated congenital insensitivity to pain
        subtype_term:
          preferred_term: channelopathy-associated congenital insensitivity to pain, autosomal recessive
          term:
            id: MONDO:0009459
            label: channelopathy-associated congenital insensitivity to pain, autosomal recessive
        description: Nondevelopmental channelopathy branch in which nociceptors are present but Nav1.7
          loss of function prevents effective nociceptive signaling; congenital anosmia is the classic
          associated clue.
        genes:
        - preferred_term: SCN9A
          term:
            id: hgnc:10597
            label: SCN9A
      selected_evidence:
        snippet: The commonest condition within this group is CIP-SCN9A (also called channelopathy associated
          with CIP). In CIP-SCN9A the only additional feature is congenital anosmia (absence of the sense
          of smell), and many adults have gone undiagnosed, and/or unbelieved when they explain that they
          don’t feel pain.
        supports: SUPPORT
    origin:
