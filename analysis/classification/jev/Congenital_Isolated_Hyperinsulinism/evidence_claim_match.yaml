          value:
            name: Ectopic Beta-Cell Monocarboxylate Transport
            description: 'Monocarboxylate transporter 1 (MCT1, encoded by SLC16A1) is normally silenced
              in the beta cell, which is what keeps circulating pyruvate and lactate from acting as insulin
              secretagogues. Promoter variants that de-repress SLC16A1 transcription in the beta cell
              let pyruvate enter, be oxidized, and stimulate insulin release. The transporter activity
              is increased in the beta cell because the protein is expressed there ectopically, not because
              the encoded transporter is more active. Because the trigger is an exogenous monocarboxylate
              rather than glucose, hypoglycemia appears after anaerobic exercise or a pyruvate load rather
              than on fasting.

              '
            biological_scale: CELLULAR
            cell_types:
            - preferred_term: pancreatic beta cell
              term:
