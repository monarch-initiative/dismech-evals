              term:
                id: hgnc:10922
                label: SLC16A1
            description: Dominantly inherited hyperinsulinism in which hypoglycemia is provoked by anaerobic
              exercise or by a pyruvate load rather than occurring in the fasting newborn. Promoter variants
              in SLC16A1 de-repress monocarboxylate transporter 1 (MCT1) in the beta cell, where the transporter
              is normally silenced, so circulating pyruvate and lactate enter the cell, are oxidized,
              and trigger insulin release at a time when insulin should be suppressed. The defect is therefore
              one of failed cell-specific transcriptional silencing rather than of the K-ATP channel or
              of an enzyme step.
          role: subtype
      assertion_type: Genetic
      assertion:
        name: SLC16A1 promoter-activating variants (HHF7)
        subtype: EIHI
        gene_term:
          preferred_term: SLC16A1
          term:
            id: hgnc:10922
            label: SLC16A1
        association: Causative
        relationship_type: CAUSATIVE
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: Dominant transmission in two Finnish pedigrees mapped by genome-wide linkage.
        features: 'SLC16A1 encodes monocarboxylate transporter 1 (MCT1), aliases MCT and MCT1. The pathogenic
          variants sit in the promoter rather than the coding sequence: they increase transcription-factor
          binding and de-repress SLC16A1 in the beta cell, a tissue where the gene is normally silent.
          Coding-region screens of eight monocarboxylate transporter genes had been negative before the
          promoter was examined.'
        variants:
        - name: SLC16A1 promoter variants
          description: Two distinct promoter variants in separate pedigrees, each increasing protein binding
            to its promoter element and stimulating a SLC16A1 promoter-reporter construct three- to ten-fold.
      selected_evidence:
        snippet: By contrast, when examined in beta cells, either of two SLC16A1 mutations identified
          in separate pedigrees resulted in increased protein binding to the corresponding promoter elements
          and marked (3- or 10-fold) transcriptional stimulation of SLC16A1 promoter-reporter constructs.
        supports: SUPPORT
