        description: 'Inactivating variants in ABCC8 (SUR1) or KCNJ11 (Kir6.2), which together form the
          beta-cell ATP-sensitive potassium (K-ATP) channel, cause loss of channel expression or function.
          The K-ATP channel is the central regulator of insulin secretion: under normal conditions it
          keeps the beta-cell membrane hyperpolarized when glucose is low. Loss of K-ATP channel function
          removes this brake on the membrane potential. K-ATP channel defects are the most common molecular
          cause of CHI and underlie both diffuse and focal histological disease.

          '
