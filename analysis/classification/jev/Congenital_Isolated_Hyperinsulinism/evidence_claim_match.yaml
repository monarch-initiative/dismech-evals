          bodies it would normally use as an alternative fuel during fasting, so neuroglycopenia is more
          profound than in other causes of hypoglycemia. Recurrent or prolonged hypoglycemia carries a
          considerable risk of seizures, developmental delay, and permanent neurological damage.

          '
