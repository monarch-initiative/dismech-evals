        - preferred_term: L-glutamate dehydrogenase [NAD(P)+] activity
          term:
            id: GO:0004353
            label: L-glutamate dehydrogenase [NAD(P)+] activity
          modifier: INCREASED
        - preferred_term: SCHAD (HADH) inhibitory regulation of glutamate dehydrogenase
          term:
            id: GO:0004857
            label: enzyme inhibitor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: insulin secretion
          term:
            id: GO:0030073
            label: insulin secretion
          modifier: INCREASED
        genes:
        - preferred_term: GLUD1
          term:
            id: hgnc:4335
            label: GLUD1
