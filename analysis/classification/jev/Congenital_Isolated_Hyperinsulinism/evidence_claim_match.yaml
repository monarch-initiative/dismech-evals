        display_name: Focal KATP Hyperinsulinism
        description: A localized lesion of hyperfunctional beta-cells arising from a paternally inherited
          recessive ABCC8/KCNJ11 variant unmasked by post-zygotic loss of the maternal 11p15 allele within
