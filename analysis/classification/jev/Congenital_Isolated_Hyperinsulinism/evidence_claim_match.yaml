      assertion_type: Pathophysiology
      assertion:
        name: Glutamate Dehydrogenase Dysregulation (Amino-Acid-Driven HI)
        description: 'In a distinct mechanistic arm, dominant activating GLUD1 variants (hyperinsulinism-hyperammonemia
          syndrome) or recessive HADH/SCHAD deficiency increase glutamate dehydrogenase (GDH) activity
          in the beta cell. Leucine allosterically activates GDH, driving glutamate oxidation through
          the TCA cycle, raising the ATP/ADP ratio, and converging on the same K-ATP-channel closure and
          insulin-release pathway, producing protein/leucine-sensitive hypoglycemia. Increased GDH activity
          in liver/kidney also generates the mild hyperammonemia characteristic of HI/HA syndrome.

          '
        cell_types:
        - preferred_term: pancreatic beta cell
          term:
            id: CL:0000169
            label: type B pancreatic cell
        biological_processes:
        - preferred_term: insulin secretion
          term:
            id: GO:0030073
            label: insulin secretion
          modifier: INCREASED
        genes:
        - preferred_term: GLUD1
          term:
            id: hgnc:4335
            label: GLUD1
        - preferred_term: HADH
          term:
            id: hgnc:4799
            label: HADH
      selected_evidence:
        snippet: Mutations in GLUD1 and HADH lead to leucine-induced HH, and these two genes encode the
          key enzymes glutamate dehydrogenase and short chain 3-hydroxyacyl-CoA dehydrogenase which play
          a key role in amino acid and fatty acid regulation of insulin secretion respectively.
        supports: SUPPORT
