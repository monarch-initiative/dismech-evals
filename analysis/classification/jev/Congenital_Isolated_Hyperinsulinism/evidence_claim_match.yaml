      assertion_type: Pathophysiology
      assertion:
        name: Glucokinase Glucose-Sensing Threshold Shift
        description: 'Activating variants in GCK, the beta-cell glucose sensor, raise glucokinase catalytic
          efficiency and lower its glucose half-saturation concentration. Because glucokinase sets the
          glucose concentration at which glycolytic flux begins to raise the beta-cell ATP/ADP ratio,
          the whole secretory system is recalibrated downwards: insulin is released at plasma glucose
          levels that would normally silence it. The channel itself is intact, which is why this arm converges
          on the same depolarization node rather than replacing it.

          '
        biological_scale: MOLECULAR
        cell_types:
