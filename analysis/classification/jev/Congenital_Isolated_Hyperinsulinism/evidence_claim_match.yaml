        - preferred_term: HADH
          term:
            id: hgnc:4799
            label: HADH
      selected_evidence:
        snippet: amino acids can trigger release of insulin in response to the oxidation of amino acids
          through glutamate via GDH into the TCA cycle under allosteric activation of GDH by leucine.
