          variants in the K-ATP channel genes ABCC8 (SUR1, HHF1) or KCNJ11 (Kir6.2, HHF2). This is the
          most common cause of severe, early-onset, diazoxide-unresponsive CHI; refractory disease may
          require near-total pancreatectomy.
