        description: Dominantly inherited hyperinsulinism in which hypoglycemia is provoked by anaerobic
          exercise or by a pyruvate load rather than occurring in the fasting newborn. Promoter variants
          in SLC16A1 de-repress monocarboxylate transporter 1 (MCT1) in the beta cell, where the transporter
          is normally silenced, so circulating pyruvate and lactate enter the cell, are oxidized, and
          trigger insulin release at a time when insulin should be suppressed. The defect is therefore
          one of failed cell-specific transcriptional silencing rather than of the K-ATP channel or of
          an enzyme step.
        inheritance:
        - name: Autosomal dominant
          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
          description: Segregated as a dominant trait in two Finnish pedigrees mapped by genome-wide linkage.
