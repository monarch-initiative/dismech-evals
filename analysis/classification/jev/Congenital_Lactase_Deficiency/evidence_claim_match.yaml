          value:
            name: LCT Loss-of-Function and Absent Lactase-Phlorizin Hydrolase Activity
            conforms_to: diet_induced_osmotic_diarrhea#Loss of a Substrate-Specific Brush-Border Digestive
              or Absorptive Step
            description: Biallelic loss-of-function variants in the coding region of LCT prevent normal
              biosynthesis, folding, intracellular trafficking, or catalytic function of lactase-phlorizin
              hydrolase (LPH), the brush-border enzyme that hydrolyzes lactose. Several characterized
              CLD variants (e.g. p.Y1390*, p.E1612*, p.S1150Pfs*19, p.S1121L, p.R1587H, p.S688P) produce
              LPH proteins that are transport-incompetent and enzymatically inactive, so essentially no
              functional enzyme reaches the apical enterocyte membrane.
            genes:
            - preferred_term: LCT
              term:
                id: hgnc:6530
                label: LCT
            cell_types:
            - preferred_term: enterocyte
              term:
                id: CL:0000584
                label: enterocyte
            molecular_functions:
            - preferred_term: lactase activity
              term:
                id: GO:0000016
                label: lactase activity
              modifier: ABSENT
            biological_processes:
            - preferred_term: protein transport
              term:
                id: GO:0015031
                label: protein transport
              modifier: ABNORMAL
          role: ancestor
      assertion_type: CausalEdge
      assertion:
        target: Failure to Hydrolyze Lactose into Glucose and Galactose
        causal_link_type: DIRECT
        description: Absent brush-border lactase activity prevents hydrolysis of dietary lactose into
          its absorbable monosaccharides, glucose and galactose.
      selected_evidence:
        snippet: some infants are born with an inability to digest lactase (congenital lactase deficiency
          or CLD) due to low levels of LPH activity, which results in severe clinical consequences if
          not properly diagnosed and treated by lactose avoidance.
        supports: SUPPORT
    origin:
