      assertion:
        name: LCT loss-of-function variants
        gene_term:
          preferred_term: LCT
          term:
            id: hgnc:6530
            label: LCT
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        features: CLD is caused by mutations in the coding (translated) region of LCT that inactivate
          the lactase-phlorizin hydrolase enzyme, in contrast to the common adult-type hypolactasia variant,
          which lies in a distal regulatory element and only reduces developmental transcription of an
          otherwise normal LCT gene. The Finnish founder mutation is a nonsense variant, c.4170T>A (Y1390X);
          other populations carry distinct nonsense, frameshift, or missense LCT variants.
      selected_evidence:
        snippet: our data demonstrate that, in contrast to common adult-type hypolactasia (lactose intolerance)
          caused by a variant of the regulatory element, the severe infancy form represents the outcome
          of mutations affecting the structure of the protein inactivating the enzyme.
        supports: SUPPORT
    origin:
