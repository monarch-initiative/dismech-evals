  0056eb48c5f5bbdad53973f5896bf3b272358ae1bae85d28ffd508913505688e:
    claim:
      about:
        disease:
          name: Congenital Laryngomalacia
          disease_term:
            preferred_term: congenital laryngomalacia
            term:
              id: MONDO:0007878
              label: congenital laryngomalacia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reflux-Associated Supraglottic Oedema
        description: 'Gastric contents reaching the laryngopharynx irritate the supraglottic mucosa, and
          the resulting oedema adds tissue bulk exactly where the lumen is already narrowed. Reflux is
          common in this population and its presence tracks with worse outcomes. The causal direction
          is genuinely unsettled, and this entry does not resolve it: laryngomalacia may equally well
          promote reflux by altering the thoraco-abdominal pressure gradient, so the node is modelled
          as an aggravator of an existing obstruction rather than as an upstream cause.'
        role: mechanism
        biological_scale: TISSUE
        locations:
        - preferred_term: larynx
          term:
            id: UBERON:0001737
            label: larynx
        notes: The reverse-causation possibility is not a hedge. Modelling reflux as an upstream cause
          would predict that acid suppression should shorten the disease course, and the cited evidence
          supports symptom improvement rather than that.
      selected_evidence:
        snippet: Of 2212 neonates identified with CLM, 585 (26.45%) had RD.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:39525522
      reference_title: 'Reflux disease and congenital laryngomalacia in neonates: A Kids'' Inpatient Database
        analysis.'
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies co-occurrence in a national inpatient cohort, which is the frequency claim
        this node makes.
