      assertion_type: Treatment
      assertion:
        name: Supraglottoplasty
        description: Endoscopic division of short aryepiglottic folds and trimming of redundant arytenoid
          mucosa. It does not correct the reflex deficit either; it removes the tissue that collapse depends
          on, so the same loss of tone no longer obstructs. Reserved for aspiration, failure to thrive,
          or the consequences of obstruction and hypoxia. In a comparative series it produced complete
          improvement in 5 weeks against 29 for watchful waiting.
        therapeutic_modality: SURGERY
        treatment_term:
          preferred_term: supraglottoplasty
          term:
            id: NCIT:C15329
            label: Surgical Procedure
      selected_evidence:
        snippet: Supraglottoplasty was found to lead to significantly faster complete improvement of laryngomalacia
          than wait-and-see policy (5 weeks vs. 29, p = 0.026).
        supports: SUPPORT
        directness: DIRECT
