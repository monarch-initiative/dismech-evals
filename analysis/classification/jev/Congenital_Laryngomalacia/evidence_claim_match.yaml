  c57582d474752a90640e107e4b0b7c8c54406a79a7faf961ec43e84910060226:
    claim:
      about:
        disease:
          name: Congenital Laryngomalacia
          disease_term:
            preferred_term: congenital laryngomalacia
            term:
              id: MONDO:0007878
              label: congenital laryngomalacia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Inspiratory Collapse of Supraglottic Structures
        description: Inspiration generates negative pressure across the supraglottic airway. Where tone
          is reduced and the configuration is permissive, that pressure draws the epiglottis, aryepiglottic
          folds and arytenoid mucosa inward toward the glottis. Because the driving force is the infant's
          own inspiratory effort, anything that increases it - crying, feeding, agitation, intercurrent
          illness - deepens the collapse, which is the positive feedback that makes severe episodes self-reinforcing.
        role: mechanism
        biological_scale: TISSUE
        locations:
        - preferred_term: larynx
          term:
            id: UBERON:0001737
            label: larynx
      selected_evidence:
        snippet: Diagnosis is established by associating the clinical manifestations with laryngoscopic
          findings in a dynamic form.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18392498
      reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports that the defining finding is dynamic collapse observed during breathing rather
        than a static appearance, which is what this node asserts.
