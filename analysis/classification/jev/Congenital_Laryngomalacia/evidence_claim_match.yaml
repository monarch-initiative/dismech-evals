  708c09a5cd59d5a1e56c918ed3209f228b4c59077807fb6aeea2c906e552149e:
    claim:
      about:
        disease:
          name: Congenital Laryngomalacia
          disease_term:
            preferred_term: congenital laryngomalacia
            term:
              id: MONDO:0007878
              label: congenital laryngomalacia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Predisposing Supraglottic Configuration
        description: 'A set of anatomical features that make collapse easier: an omega-shaped epiglottis
          that curls and falls posteriorly, short aryepiglottic folds that tether the epiglottis inward,
          redundant arytenoid mucosa that prolapses forward, and oedema of the posterior larynx. These
          are consistently seen on dynamic endoscopy and are reproducible between examiners, which is
          what makes them diagnostic criteria. They are modelled here as a parallel predisposing factor
          rather than as the cause: they set how much collapse a given loss of tone produces.'
        role: mechanism
        biological_scale: TISSUE
        locations:
        - preferred_term: epiglottis
          term:
            id: UBERON:0000388
            label: epiglottis
        - preferred_term: arytenoid cartilage
          term:
            id: UBERON:0001740
            label: arytenoid cartilage
        - preferred_term: aryepiglottic fold
          term:
            id: UBERON:0014385
            label: aryepiglottic fold
      selected_evidence:
        snippet: 'A protocol of videolaryngoscopic evaluation for patients with laryngomalacia was created
          encompassing the following items: anterior displacement of the arytenoids; omega-shaped epiglottis;
          short aryepiglottic folds; posterior displacement of epiglottis; vocal folds being visible or
          not; edema of the posterior larynx.'
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18392498
      reference_title: Flexible nasolaryngoscopy accuracy in laryngomalacia diagnosis.
      evidence_source: HUMAN_CLINICAL
      explanation: Enumerates the anatomical features this node records, as the items of a validated evaluation
