        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Supraglottic Tone and Dynamic Tissue Laxity
        description: 'With reflex support blunted, the supraglottic tissues are no longer actively held
          clear of the lumen. The resulting laxity is dynamic rather than fixed: the larynx looks normal
          at rest and collapses only when airflow demand rises, which is why the disease is intermittent
          and situational and why static imaging is useless for it.'
        role: mechanism
        biological_scale: TISSUE
        locations:
        - preferred_term: larynx
          term:
            id: UBERON:0001737
            label: larynx
      selected_evidence:
        snippet: Laryngomalacia is an enigmatic disease in which laryngeal tone is weak, resulting in
          dynamic prolapse of tissue into the larynx.
        supports: SUPPORT
        directness: DIRECT
