        disease:
          name: Congenital Laryngomalacia
          disease_term:
            preferred_term: congenital laryngomalacia
            term:
              id: MONDO:0007878
              label: congenital laryngomalacia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Swallow-Breathe Discoordination and Aspiration
        description: 'Feeding requires breathing and swallowing to be interleaved precisely, and an infant
          working hard to inspire cannot do that reliably. The clinically important finding is how often
          the resulting aspiration is silent: among infants with laryngomalacia investigated for recurrent
          respiratory or feeding problems, aspiration was present in 42% and was silent in 98% of those.
          That is the argument for instrumented swallow assessment rather than clinical observation, and
          it is the route from an airway disease to failure to thrive and recurrent chest infection.'
        role: consequence
        biological_scale: ORGANISM
        notes: The 42% and 90% figures are denominators of a selected group - infants referred for a swallow
          study because of recurrent respiratory or feeding problems, 142 of 395 diagnosed that year.
          They are not the rate of aspiration in all laryngomalacia, and should not be read as such.
      selected_evidence:
        snippet: Aspiration was identified in 60 patients (42.3%), and silent aspiration was documented
          in 59 (98.3%) of these 60 patients.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/6
      evidence_path: /pathophysiology/6/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:30589926
      reference_title: Evaluation of Aspiration in Infants With Laryngomalacia and Recurrent Respiratory
