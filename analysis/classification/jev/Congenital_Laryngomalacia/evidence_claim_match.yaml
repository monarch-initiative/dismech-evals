      about:
        disease:
          name: Congenital Laryngomalacia
          disease_term:
            preferred_term: congenital laryngomalacia
            term:
              id: MONDO:0007878
              label: congenital laryngomalacia
        context:
        - path: /treatments/3
          value:
            name: Supraglottoplasty
            description: Endoscopic division of short aryepiglottic folds and trimming of redundant arytenoid
              mucosa. It does not correct the reflex deficit either; it removes the tissue that collapse
              depends on, so the same loss of tone no longer obstructs. Reserved for aspiration, failure
              to thrive, or the consequences of obstruction and hypoxia. In a comparative series it produced
              complete improvement in 5 weeks against 29 for watchful waiting.
            therapeutic_modality: SURGERY
            treatment_term:
              preferred_term: supraglottoplasty
              term:
                id: NCIT:C15329
                label: Surgical Procedure
          role: ancestor
      assertion_type: TreatmentMechanismTarget
      assertion:
        target: Predisposing Supraglottic Configuration
        treatment_effect: INHIBITS
        description: 'Surgery removes the anatomical substrate rather than restoring tone, so it acts
          on the predisposing configuration node and leaves the trigger node unchanged. Recorded as INHIBITS
          rather than BYPASSES: the operation abolishes the node it targets, where BYPASSES would imply
          routing around a mechanism that is still running.'
      selected_evidence:
        snippet: Supraglottoplasty is safe and effective in treatment of severe laryngomalacia.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /treatments/3/target_mechanisms/0
      evidence_path: /treatments/3/target_mechanisms/0/evidence/0
      context_paths:
