  ccc52b720bd8d0707535e2d35fea591ff982994a4fdea33df05c0bdb333b4155:
    claim:
      about:
        disease:
          name: Congenital Laryngomalacia
          disease_term:
            preferred_term: congenital laryngomalacia
            term:
              id: MONDO:0007878
              label: congenital laryngomalacia
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Immature Sensorimotor Integrative Function of the Larynx
        description: 'The initiating abnormality is in laryngeal sensorimotor control rather than in the
          cartilage. Laryngopharyngeal sensory testing delivers a calibrated air pulse to the aryepiglottic
          fold to trigger the laryngeal adductor reflex; in laryngomalacia the pressure needed to elicit
          that reflex is raised, and it is raised in proportion to disease severity. Two features make
          this a mechanism rather than an association: the threshold tracks severity across mild, moderate
          and severe groups, and it falls back toward normal at nine months in step with symptom resolution.
          A structurally soft cartilage would not behave that way.'
        role: trigger
        biological_scale: ORGANISM
        locations:
        - preferred_term: aryepiglottic fold
          term:
            id: UBERON:0014385
            label: aryepiglottic fold
      selected_evidence:
        snippet: The initial LPST was higher (P < .001) in infants with moderate (6.8 mm Hg) and severe
          disease (7.4 mm Hg) compared with those with mild disease (4.1 mm Hg).
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17513991
      reference_title: 'Abnormal sensorimotor integrative function of the larynx in congenital laryngomalacia:
        a new theory of etiology.'
      evidence_source: HUMAN_CLINICAL
      explanation: Quantifies the sensory threshold across severity groups, which is the dose-like relationship
