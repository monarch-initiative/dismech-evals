          term:
            id: GO:0042102
            label: positive regulation of T cell proliferation
          modifier: DECREASED
      selected_evidence:
        snippet: Leptin deficiency was associated with reduced numbers of circulating CD4(+) T cells and
          impaired T cell proliferation and cytokine release, all of which were reversed by recombinant
          human leptin administration.
        supports: SUPPORT
