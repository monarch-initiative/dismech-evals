        context: []
      assertion_type: Treatment
      assertion:
        name: Metreleptin
        description: 'Daily subcutaneous recombinant human leptin, which replaces the missing hormone
          and restores hypothalamic leptin signalling. It is uniquely effective here because the receptor
          and all downstream circuitry are intact — the defect is the ligand alone. Response spans every
          arm of the disease: appetite and fat mass fall, thyroid hormone rises, gonadotropin secretion
          and puberty are induced, and the T cell defect corrects.

          Dosing is not uniform across subtypes, however. Classical and biologically inactive deficiency
          take the same starting dose, but antagonistic variants antagonise metreleptin itself at the
          receptor, so those patients require higher initial doses and variant-tailored tapering.'
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Pharmacotherapy
