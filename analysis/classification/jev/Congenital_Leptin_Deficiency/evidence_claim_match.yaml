        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Starvation-Pattern Neuroendocrine Suppression
        biological_scale: ORGANISM
        description: Leptin is also the permissive signal that tells the hypothalamus there is enough
          stored energy to run reproduction and full metabolic activity. Read as starvation, the hypothalamus
          suppresses GnRH-driven gonadotropin secretion, so LH and FSH remain prepubertal and are not
          pulsatile, and it blunts the thyroid and growth hormone axes. Puberty therefore does not begin,
          despite obesity — the combination that distinguishes this disease from common obesity, where
          puberty is typically early.
        biological_processes:
        - preferred_term: gonadotropin secretion
          term:
            id: GO:0032274
            label: gonadotropin secretion
          modifier: DECREASED
      selected_evidence:
        snippet: Initially, the patient had prepubertal basal and stimulated luteinizing hormone (LH)
          and follicle-stimulating hormone (FSH) levels, low growth hormone and insulin-like growth factor
          1 (IGF1) levels and no pulsatile secretion of LH and FSH.
        supports: SUPPORT
