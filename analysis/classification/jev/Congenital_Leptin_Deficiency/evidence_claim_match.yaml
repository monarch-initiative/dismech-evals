        relationship_type: CAUSATIVE
        notes: Biallelic LEP variants cause the disease. The founding lesion was a homozygous single-guanine
          deletion in codon 133 producing no secreted hormone; later missense variants (for example p.D100Y,
          p.N103K) are secreted but biologically inactive, so circulating leptin is detectable. Fewer
          than 20 LEP-mutation carriers had been reported by 2012, and the condition remains very rare.
      selected_evidence:
        snippet: a homozygous frame-shift mutation involving the deletion of a single guanine nucleotide
          in codon 133 of the gene for leptin was found
        supports: SUPPORT
