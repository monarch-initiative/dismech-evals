          in contrast to common obesity where puberty tends to be early.

          Not independent of Hypogonadotropic Hypogonadism above: the systematic series counts delayed
          puberty inside that same 16/103 figure, as one of the signs by which the hypogonadism is recognised.
          Recorded separately because it is the presenting complaint, not because it is a second cohort.

          The frequency band therefore carries the same age caveat as its sibling, and for the same reason:
          16% is the rate across a cohort that is mostly small children in whom puberty cannot yet be
          late, while all 12 adult patients showed hypogonadism. Read it as unobservable before pubertal
          age and effectively obligate after, not as a 16% lifetime risk.'
        phenotype_term:
