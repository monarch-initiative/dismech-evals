        biological_scale: CELLULAR
        description: Leptin is also an immunomodulatory cytokine acting on lymphocytes, and its absence
          reduces circulating CD4-positive T cell numbers and impairs T cell proliferation and cytokine
          release. Clinically this presents as a high rate of childhood infection, which historically
          accounted for deaths in leptin-deficient kindreds. Like the endocrine arm, it is reversed by
          leptin replacement, establishing it as a direct consequence of the deficiency rather than a
          secondary effect of obesity.
        cell_types:
        - preferred_term: CD4-positive, alpha-beta T cell
          term:
            id: CL:0000624
            label: CD4-positive, alpha-beta T cell
