              id: MONDO:0013991
              label: obesity due to congenital leptin deficiency
        context: []
      assertion_type: Diagnosis
      assertion:
        name: Circulating leptin measurement with LEP sequencing
        description: 'Serum leptin is the discriminating first-line test, and it separates this disease
          from its closest mimic: it is undetectable in LEP mutation carriers but extremely elevated in
          LEPR (receptor) mutation carriers, whose clinical picture is otherwise similar and who do not
          respond to leptin replacement.

          The important caveat is that a normal or high leptin level does not exclude the diagnosis, and
          it fails in two different ways for the two non-classical subtypes. For biologically inactive
          leptin, combining a regular ELISA with the bioLEP assay — which measures receptor-binding capacity
          rather than hormone mass — separates it robustly. For antagonistic leptin, both assays read
          inconspicuous, so leptin measurement does not identify the disease at all and only sequencing
          will. LEP sequencing should therefore be considered in any severely obese, hyperphagic child
          even when circulating leptin is normal and even when the bioLEP assay is also normal.'
      selected_evidence:
        snippet: 'Measurement of circulating leptin may help for the diagnosis of such obesity: it is
          undetectable in LEP mutation carriers or extremely elevated in LEPR mutation carriers.'
        supports: SUPPORT
