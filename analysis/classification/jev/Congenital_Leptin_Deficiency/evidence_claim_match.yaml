      assertion_type: Pathophysiology
      assertion:
        name: Failure of Hypothalamic Leptin Signaling
        biological_scale: CELLULAR
        description: Without a functional ligand, leptin receptors on arcuate nucleus neurons are never
          engaged, so the JAK2/STAT3 cascade downstream of LEPR is not activated. Anorexigenic POMC/CART
          neurons lose their principal excitatory drive and orexigenic AgRP/NPY neurons lose their principal
          inhibition. The hypothalamus therefore reports depleted energy stores irrespective of the actual,
          greatly expanded, adipose mass — the central pathogenic inversion of this disease.
        cell_types:
        - preferred_term: pro-opiomelanocortin neuron of the arcuate nucleus
          term:
            id: CL:4042033
            label: pro-opiomelanocortin neuron
        - preferred_term: arcuate AgRP/NPY neuron
          term:
            id: CL:0000540
            label: neuron
        locations:
        - preferred_term: arcuate nucleus of hypothalamus
          term:
            id: UBERON:0001932
            label: arcuate nucleus of hypothalamus
        biological_processes:
        - preferred_term: leptin-mediated signaling pathway
          term:
            id: GO:0033210
            label: leptin-mediated signaling pathway
          modifier: DECREASED
        - preferred_term: energy homeostasis
          term:
            id: GO:0097009
            label: energy homeostasis
          modifier: DECREASED
      selected_evidence:
        snippet: The severe obesity found in these congenitally leptin-deficient subjects provides the
