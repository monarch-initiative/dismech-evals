  0ca25bbbb4ecad32c775fc024908979d00e8e374b5d26507f81cfdc323aa8f33:
    claim:
      about:
        disease:
          name: Congenital Leptin Deficiency
          disease_term:
            preferred_term: obesity due to congenital leptin deficiency
            term:
              id: MONDO:0013991
              label: obesity due to congenital leptin deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Absent or Bioinactive Leptin
        biological_scale: MOLECULAR
        description: 'Biallelic LEP variants remove the circulating leptin signal. The classical lesion
          is a frameshift or nonsense variant producing no secreted hormone, so serum leptin is low or
          undetectable despite a greatly expanded fat mass. A second, later-recognised class of missense
          variants yields a hormone that is secreted and immunoreactive — so measured leptin is normal
          or high — but biologically inactive or antagonistic at the receptor. Both classes cripple leptin
          signalling while leaving the assay result normal or high, which is why a normal leptin level
          does not exclude the diagnosis. "Cripple" rather than "abolish" is deliberate: antagonistic
          variants trigger no or only little downstream signalling rather than none at all, and p.Gly59Ser
          retains partial agonist activity.'
        gene:
          preferred_term: LEP
          term:
            id: hgnc:6553
            label: LEP
        cell_types:
        - preferred_term: adipocyte
          term:
            id: CL:0000136
            label: adipocyte
        molecular_functions:
        - preferred_term: leptin hormone activity
          term:
            id: GO:0005179
            label: hormone activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: a homozygous frame-shift mutation involving the deletion of a single guanine nucleotide
          in codon 133 of the gene for leptin was found
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
