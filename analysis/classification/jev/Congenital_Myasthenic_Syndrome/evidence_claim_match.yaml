      assertion_type: Pathophysiology
      assertion:
        name: Endplate Acetylcholinesterase Deficiency
        description: In synaptic (basal-lamina) CMS, loss of COLQ removes the collagen tail that anchors
          acetylcholinesterase in the synaptic cleft. The resulting endplate AChE deficiency prolongs
          ACh dwell time, causing cationic overload and depolarization block / endplate myopathy. Because
          residual AChE activity is already absent, cholinesterase inhibitors provide no benefit and may
          be harmful.
        cell_types:
        - preferred_term: Skeletal muscle fiber endplate
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        genes:
        - preferred_term: COLQ
          term:
            id: hgnc:2226
            label: COLQ
      selected_evidence:
        snippet: Mutations in the collagen-like tail subunit gene (COLQ) of acetylcholinesterase are responsible
          for recessive forms of synaptic congenital myasthenic syndromes with end plate acetylcholinesterase
          deficiency.
        supports: SUPPORT
