        context: []
      assertion_type: Subtype
      assertion:
        name: Synaptic
        display_name: Synaptic (Basal-Lamina) CMS
        classification: nmj_compartment
        children:
        - CMS5
        - CMS19
        description: 'Defects in proteins of the synaptic basal lamina. The prototype is COLQ-CMS: COLQ
          encodes the collagen-like tail subunit that anchors acetylcholinesterase (AChE) in the synaptic
          cleft, so biallelic loss produces endplate AChE deficiency with prolonged ACh action. Other
          synaptic-cleft genes include LAMB2, LAMA5, and COL13A1. Synaptic CMS characteristically does
          NOT respond to (and may worsen with) cholinesterase inhibitors, but responds to ephedrine and
          salbutamol.'
      selected_evidence:
        snippet: Mutations in the collagen-like tail subunit gene (COLQ) of acetylcholinesterase are responsible
          for recessive forms of synaptic congenital myasthenic syndromes with end plate acetylcholinesterase
          deficiency.
        supports: SUPPORT
    origin:
