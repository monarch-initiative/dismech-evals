              in PREPL, a serine peptidase whose physiological substrate is unknown. PREPL loss does not
              cause endplate AChR deficiency; it inhibits refilling of acetylcholine into synaptic vesicles,
              reduces the number of releasable quanta and lowers the probability of vesicular release.
              PREPL and SLC3A1 are encoded on opposite strands and overlap at their 3-prime ends, so a
              deletion spanning both gives hypotonia-cystinuria syndrome. Ten reported patients, including
              those with the contiguous deletion, were initially diagnosed as Prader-Willi syndrome. Cholinesterase
              inhibitors are effective.
