        conforms_to: neuromuscular_transmission_failure#Reduced Postsynaptic Endplate Response to Acetylcholine
        description: The largest mechanistic group. Variants in AChR subunit genes (CHRNE, CHRNA1, CHRNB1,
          CHRND) reduce endplate AChR density (primary AChR deficiency) or alter channel gating kinetics
          — prolonged openings in slow-channel CMS (cationic overload, endplate degeneration) or abbreviated
          openings in fast-channel CMS (reduced response to ACh). Variants in the agrin-LRP4-MuSK-DOK7-rapsyn
          signaling axis (AGRN, LRP4, MUSK, DOK7, RAPSN) impair AChR clustering and endplate development/maintenance.
        cell_types:
        - preferred_term: Skeletal muscle fiber postsynaptic membrane
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        biological_processes:
        - preferred_term: Skeletal muscle acetylcholine-gated channel clustering
          term:
