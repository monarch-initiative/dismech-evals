        - CMS2C
        - CMS3A
        - CMS3B
        - CMS3C
        - CMS4
        - CMS8
        - CMS9
        - CMS10
        - CMS11
        - CMS17
        description: Defects of the postsynaptic membrane — by far the largest group. Includes primary
          AChR deficiency and AChR kinetic abnormalities (slow-channel and fast-channel syndromes) from
          variants in the AChR subunit genes (CHRNE, CHRNA1, CHRNB1, CHRND, CHRNG), and defects of endplate
          development / maintenance and AChR clustering (RAPSN, DOK7, MUSK, AGRN, LRP4). CHRNE low-expressor
          variants and DOK7 are among the most common CMS genotypes overall. Slow-channel CMS (SCCMS)
          is the principal autosomal dominant form.
      selected_evidence:
        snippet: CHRNE-low expressor variants were the most common (23.8%), followed by variants in DOK7
          (18.7%) and RAPSN (14%).
        supports: SUPPORT
