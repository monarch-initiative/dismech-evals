      assertion_type: Pathophysiology
      assertion:
        name: Defective SNARE-Mediated Synaptic Vesicle Fusion
        conforms_to: neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release
        description: 'Calcium entering the motor nerve terminal through the P/Q-type calcium channel binds
          the two C2B domains of synaptotagmin-2 and triggers assembly of the SNARE complex - SNAP25,
          syntaxin and the vesicle SNARE synaptobrevin-1 (VAMP1) - which fuses acetylcholine-laden synaptic
          vesicles with the presynaptic membrane. Variants in SYT2 or VAMP1 break that calcium-to-fusion
          coupling, so fewer quanta are released per nerve impulse. The result is a Lambert-Eaton-like
          electrophysiology, with a decrement on low-frequency repetitive nerve stimulation and an increment
          at high frequency, which is why amifampridine, which enhances calcium entry into the nerve terminal,
          is effective in this group. This node is distinct from the upstream acetylcholine synthesis
          and vesicle-loading defects: here the vesicles are filled, but they do not fuse on cue.'
        cell_types:
        - preferred_term: Motor neuron presynaptic terminal
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: Acetylcholine secretion at the nerve terminal
          term:
            id: GO:0014055
            label: acetylcholine secretion, neurotransmission
          modifier: DECREASED
        - preferred_term: Calcium-ion regulated exocytosis of synaptic vesicles
          term:
            id: GO:0017156
            label: calcium-ion regulated exocytosis
          modifier: DECREASED
        genes:
        - preferred_term: SYT2
          term:
            id: hgnc:11510
            label: SYT2
        - preferred_term: VAMP1
          term:
            id: hgnc:12642
            label: VAMP1
      selected_evidence:
        snippet: The calcium ions bind to two C2B domains of synaptotagmin 2 (SYT2), and activate the
          SNARE complex to fuse synaptic vesicles containing ACh to the presynaptic membrane
        supports: SUPPORT
