        description: Defects in acetylcholine (ACh) synthesis, vesicular packaging, or release at the
          motor nerve terminal. CHAT (choline acetyltransferase) is the commonest presynaptic gene; other
          genes include SLC5A7, SLC18A3, SNAP25, SYT2, VAMP1, and UNC13A. Presynaptic CMS comprise roughly
          5-10% of all CMS and frequently present prenatally/neonatally with a severe phenotype that can
          include arthrogryposis, developmental delay, and episodic/sudden apneic crises (classically
          CHAT-CMS, "CMS with episodic apnea").
        mappings:
          mondo_mappings:
          - term:
              id: MONDO:0009689
              label: congenital myasthenic syndrome 6
            mapping_predicate: skos:narrowMatch
            mapping_source: MONDO
            mapping_justification: MONDO:0009689 (congenital myasthenic syndrome 6) is defined in MONDO
              as CMS caused specifically by CHAT mutations and is_a MONDO:0700466 (presynaptic congenital
              myasthenic syndrome); it is narrower than this Presynaptic subtype, which also covers SLC5A7-,
              SLC18A3-, SNAP25-, SYT2-, VAMP1-, and UNC13A-related presynaptic CMS. CHAT-CMS is modeled
              here as the commonest presynaptic gene, with a dedicated CHAT genetic entry below, and is
              curated in full as Congenital_Myasthenic_Syndrome_6.yaml.
      selected_evidence:
        snippet: They can result from a dysfunction in acetylcholine (ACh) synthesis or recycling, in
          its packaging into synaptic vesicles, or its subsequent release into the synaptic cleft.
        supports: SUPPORT
