        classification: nmj_compartment
        children:
        - CMS12
        - CMS13
        description: Defects in the N-linked protein glycosylation pathway (GFPT1, DPAGT1, ALG2, ALG14,
          GMPPB) that impair glycosylation of multiple NMJ glycoproteins, including the AChR, producing
          a "combination" endplate defect. These typically present as a limb-girdle CMS, often with tubular
          aggregates on muscle biopsy and elevated creatine kinase, and respond to cholinesterase inhibitors.
          Glycosylation genes are an increasingly recognized cause, accounting for over 20% of cases in
          some cohorts.
      selected_evidence:
        snippet: postsynaptic defects were most common (62.4%), followed by glycosylation defects (21.3%),
          synaptic basal lamina genes (4.3%) and presynaptic defects (2.8%).
        supports: SUPPORT
