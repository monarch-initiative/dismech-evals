      assertion_type: Pathophysiology
      assertion:
        name: Impaired Neuromuscular Junction Transmission
        conforms_to: neuromuscular_transmission_failure#Loss of the Safety Factor of Neuromuscular Transmission
        description: The shared terminal mechanism of all CMS subtypes. A defect in any component of the
          motor endplate — presynaptic ACh handling, synaptic AChE anchoring, postsynaptic AChR density/kinetics,
          AChR clustering, or NMJ glycoprotein glycosylation — reduces the safety factor of cholinergic
          synaptic transmission. The endplate potential generated by ACh release becomes insufficient
          to consistently trigger a postsynaptic muscle fiber action potential, and this insufficiency
          worsens with repetitive activity, producing fatigable weakness.
        cell_types:
        - preferred_term: Skeletal muscle fiber (postsynaptic motor endplate)
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        - preferred_term: Motor neuron (presynaptic terminal)
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: Cholinergic synaptic transmission at the NMJ
          term:
            id: GO:0007271
            label: synaptic transmission, cholinergic
          modifier: DECREASED
        - preferred_term: Neuromuscular synaptic transmission
          term:
            id: GO:0007274
            label: neuromuscular synaptic transmission
          modifier: DECREASED
      selected_evidence:
        snippet: Congenital myasthenic syndromes (CMS) are a heterogeneous group of disorders characterized
          by impaired neuromuscular signal transmission due to germline pathogenic variants in genes expressed
          at the neuromuscular junction (NMJ).
        supports: SUPPORT
