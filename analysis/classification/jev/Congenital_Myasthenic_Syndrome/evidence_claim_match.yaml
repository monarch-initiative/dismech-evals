              label: Autosomal recessive inheritance
        description: Lambert-Eaton-like CMS caused by biallelic loss-of-function variants in VAMP1, which
          encodes synaptobrevin-1, the vesicle SNARE. Because the lesion is in vesicle fusion itself,
          low-frequency repetitive nerve stimulation produces a decrement while high-frequency stimulation
          produces an increment, as in Lambert-Eaton myasthenic syndrome. Cholinesterase inhibitors are
          effective; amifampridine has not been given and its effect is unknown.
