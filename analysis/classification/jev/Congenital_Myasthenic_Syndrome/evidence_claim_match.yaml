        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Motor Nerve Terminal Formation
        description: A distinct presynaptic lesion in which the nerve terminal itself is built wrongly,
          rather than the acetylcholine cycle or the fusion machinery failing within an otherwise normal
          terminal. MYO9A, an unconventional myosin with a Rho GTPase-activating domain, regulates intracellular
          transport in peripheral nerve; SLC25A1 is a mitochondrial inner-membrane transporter. Knockdown
          of either in zebrafish disturbs the elongation and branching of spinal motor axons and compromises
          neuromuscular junction formation, so the myasthenia in CMS23 and CMS24 is attributed to defective
          nerve terminal development. Cholinesterase inhibitors are effective in MYO9A-CMS, whereas both
          cholinesterase inhibitors and amifampridine are generally ineffective in SLC25A1-CMS.
        cell_types:
        - preferred_term: Motor neuron presynaptic terminal
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: Presynapse assembly at the motor endplate
          term:
            id: GO:0099054
            label: presynapse assembly
          modifier: ABNORMAL
        - preferred_term: Neuromuscular junction development
          term:
            id: GO:0007528
            label: neuromuscular junction development
          modifier: ABNORMAL
        genes:
        - preferred_term: SLC25A1
          term:
            id: hgnc:10979
            label: SLC25A1
        - preferred_term: MYO9A
          term:
            id: hgnc:7608
            label: MYO9A
      selected_evidence:
        snippet: Knockdown of two orthologs, myo9aa/ab, in zebrafish causes shortening and abnormal branching
          of spinal motor neurons, and defective NMJ signal transmission
        supports: SUPPORT
