        description: Slow-channel CMS (SCCMS) caused by a heterozygous missense variant in CHRNA1, the
          AChR alpha-1 subunit. Slow-channel variants abnormally prolong the AChR channel opening time,
          so the resting membrane potential depolarizes, AChRs desensitize, and excessive calcium influx
          produces an endplate myopathy. Cholinesterase inhibitors are mostly ineffective, whereas quinidine
          and fluoxetine ameliorate the slow-channel phenotype.
      selected_evidence:
        snippet: SCCMS | CHRNA1 | CMS1A | (14) | AD | decrement, repetitive CMAP
