          modifier: DECREASED
        genes:
        - preferred_term: COL13A1
          term:
            id: hgnc:2190
            label: COL13A1
      selected_evidence:
        snippet: Introduction of the pathogenic variants into C2C12 myotubes reduced AChR clustering
        supports: SUPPORT
