  8d55c6f0851881cfb7d9b67bf593668529e3d6ac75a32234f836139d1d1b757a:
    claim:
      about:
        disease:
          name: Congenital Myasthenic Syndrome
          disease_term:
            preferred_term: Congenital Myasthenic Syndrome
            term:
              id: MONDO:0018940
              label: congenital myasthenic syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Presynaptic Acetylcholine Handling Defect
        conforms_to: neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release
        description: 'The acetylcholine-handling arm of presynaptic CMS: the lesion lies in the supply
          of transmitter rather than in the release machinery. Choline acetyltransferase (CHAT) synthesizes
          ACh, the high-affinity choline transporter (SLC5A7) recovers choline into the terminal, the
          vesicular ACh transporter (SLC18A3) loads it into synaptic vesicles, and PREPL is required for
          those vesicles to be refilled. A defect at any of these steps lowers the quantal content of
          ACh release and so the endplate potential. In this group a decrement on low-frequency stimulation
          is elicited at rest in some patients, but only after exercise or high-frequency stimulation
          in the others. The downstream fusion step is modeled separately in Defective SNARE-Mediated
          Synaptic Vesicle Fusion, and terminal development in Defective Motor Nerve Terminal Formation.'
        cell_types:
        - preferred_term: Motor neuron presynaptic terminal
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: Acetylcholine biosynthetic process
          term:
            id: GO:0008292
            label: acetylcholine biosynthetic process
          modifier: DECREASED
        genes:
        - preferred_term: CHAT
          term:
            id: hgnc:1912
            label: CHAT
        - preferred_term: SLC5A7
          term:
            id: hgnc:14025
            label: SLC5A7
        - preferred_term: SLC18A3
          term:
            id: hgnc:10936
            label: SLC18A3
        - preferred_term: PREPL
          term:
            id: hgnc:30228
            label: PREPL
      selected_evidence:
        snippet: They can result from a dysfunction in acetylcholine (ACh) synthesis or recycling, in
          its packaging into synaptic vesicles, or its subsequent release into the synaptic cleft.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
