  2497493f4f62ed23e2dbbce5b3585e4c430986e0ac1158664c91dc914e4d56f3:
    claim:
      about:
        disease:
          name: Congenital Myasthenic Syndrome 15
          disease_term:
            preferred_term: Congenital myasthenic syndrome 15
            term:
              id: MONDO:0014542
              label: congenital myasthenic syndrome 15
        context: []
      assertion_type: Genetic
      assertion:
        name: ALG14
        gene_term:
          preferred_term: ALG14
          term:
            id: hgnc:28287
            label: ALG14
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        association: ALG14 encodes a subunit of the UDP-N-acetylglucosamine transferase complex that it
          forms with ALG13 and DPAGT1 on the cytoplasmic face of the endoplasmic reticulum. The complex
          catalyses the first two committed steps of the dolichol-linked oligosaccharide pathway that
          supplies N-linked glycans. Because the gene is a general component of that pathway rather than
          a synapse-specific protein, the neuromuscular phenotype reflects the particular sensitivity
          of the endplate to reduced glycosylation capacity, and the severity of an allele determines
          how far beyond the endplate the disease extends. Two of the other subunits of the same pathway,
          DPAGT1 and ALG2, are themselves congenital myasthenic syndrome genes.
        variants:
        - name: ALG14 c.220G>A (p.Asp74Asn)
          description: The recurrent allele in the severe infantile neurodegenerative form, found homozygously
            in two patients and heterozygously in three others across three families.
          clinical_significance: PATHOGENIC
        - name: ALG14 c.422T>G (p.Val141Gly)
          description: A second allele in the severe infantile cohort, carried heterozygously in trans
            with p.Asp74Asn.
          clinical_significance: PATHOGENIC
        - name: ALG14 c.326G>A (p.Arg109Gln)
          description: A third allele in the severe infantile cohort, likewise carried heterozygously
            in trans with p.Asp74Asn.
          clinical_significance: PATHOGENIC
        - name: ALG14 c.590T>G (p.Val197Gly)
          description: One half of the compound heterozygous genotype in the long-surviving siblings,
            whose course was markedly milder than the lethal infantile cohort despite a comparably severe
            neonatal presentation.
          clinical_significance: PATHOGENIC
        - name: ALG14 c.433G>A (p.Gly145Arg)
          description: The other half of the compound heterozygous genotype in the long-surviving siblings.
          clinical_significance: PATHOGENIC
      selected_evidence:
        snippet: We identify ALG14 and ALG2 as novel genes in which mutations cause a congenital myasthenic
          syndrome.
        supports: SUPPORT
