            p.Asp74Asn allele of the severe form and the p.Val197Gly / p.Gly145Arg compound heterozygous
            pair reported in long-surviving siblings.
        biological_processes:
        - preferred_term: protein N-linked glycosylation
          term:
            id: GO:0006487
            label: protein N-linked glycosylation
          modifier: DECREASED
        - preferred_term: dolichol-linked oligosaccharide biosynthetic process
          term:
            id: GO:0006488
            label: dolichol-linked oligosaccharide biosynthetic process
          modifier: DECREASED
      selected_evidence:
