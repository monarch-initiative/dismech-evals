  8ffc8eff84bea07ea4aa5a06c189f54f2e39060556d9c0399fdb2bb0799bea26:
    claim:
      about:
        disease:
          name: Congenital Myasthenic Syndrome 15
          disease_term:
            preferred_term: Congenital myasthenic syndrome 15
            term:
              id: MONDO:0014542
              label: congenital myasthenic syndrome 15
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypoglycosylation of Endplate Proteins
        biological_scale: MOLECULAR
        description: ALG14 is concentrated at the muscle motor endplate, so the postsynaptic membrane
          is a site where reduced N-glycosylation capacity is felt disproportionately. Acetylcholine receptor
          subunits require N-linked glycans for correct folding, pentameric assembly and export; when
          the glycan supply is limited, fewer complete receptors reach the surface. The receptor genes
          themselves are intact, so this is a failure of post-translational processing rather than a receptor
          lesion.
        cell_types:
        - preferred_term: Skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        locations:
        - preferred_term: Neuromuscular junction
          term:
            id: GO:0031594
            label: neuromuscular junction
        biological_processes:
        - preferred_term: protein N-linked glycosylation
          term:
            id: GO:0006487
            label: protein N-linked glycosylation
          modifier: DECREASED
      selected_evidence:
        snippet: We show that ALG14 is concentrated at the muscle motor endplates and small interfering
          RNA silencing of ALG14 results in reduced cell-surface expression of muscle acetylcholine receptor
          expressed in human embryonic kidney 293 cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
