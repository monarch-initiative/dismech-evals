        description: Biallelic ALG14 variants reduce the function of the ALG13-ALG14-DPAGT1 multiglycosyltransferase
          complex, which catalyses the first two committed steps of asparagine-linked protein glycosylation
          on the cytoplasmic face of the endoplasmic reticulum. Reported alleles are predominantly missense,
          so residual activity is retained; the amount retained appears to set where a patient falls on
          the phenotypic spectrum.
        genetic_context:
          genes:
          - preferred_term: ALG14
            term:
              id: hgnc:28287
