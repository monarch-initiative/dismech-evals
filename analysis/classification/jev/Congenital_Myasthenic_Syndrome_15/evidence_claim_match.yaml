      assertion_type: Diagnosis
      assertion:
        name: Repetitive nerve stimulation
        description: A decremental compound muscle action potential response localises the defect to the
          neuromuscular junction. It does not distinguish CMS15 from other congenital myasthenic syndromes,
          and in the severe infantile form the profound hypotonia and encephalopathy can make the myasthenic
          component easy to miss altogether.
      selected_evidence:
        snippet: Repetitive nerve stimulation test showed an abnormal decrease in compound muscle action
          potential.
        supports: SUPPORT
