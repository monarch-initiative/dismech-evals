      assertion_type: Pathophysiology
      assertion:
        name: Endplate Acetylcholine Receptor Deficiency
        biological_scale: TISSUE
        description: The postsynaptic membrane carries too few acetylcholine receptors to guarantee that
          each nerve impulse depolarises the muscle fibre to threshold. Transmission consequently fails
          intermittently and use-dependently, which is measured electrophysiologically as a decremental
          response of the compound muscle action potential to repetitive nerve stimulation.
        cell_types:
        - preferred_term: Skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        locations:
        - preferred_term: Neuromuscular junction
          term:
            id: GO:0031594
            label: neuromuscular junction
        molecular_functions:
        - preferred_term: acetylcholine receptor activity
          term:
            id: GO:0015464
            label: acetylcholine receptor activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: neuromuscular synaptic transmission
          term:
            id: GO:0007274
            label: neuromuscular synaptic transmission
          modifier: DECREASED
      selected_evidence:
        snippet: Repetitive nerve stimulation test showed an abnormal decrease in compound muscle action
          potential.
        supports: SUPPORT
