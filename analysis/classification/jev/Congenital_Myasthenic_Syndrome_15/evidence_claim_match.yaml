      assertion_type: Diagnosis
      assertion:
        name: Exome or genome sequencing of ALG14
        description: Definitive diagnosis rests on identifying biallelic ALG14 variants. Because the severe
          form presents as an encephalopathy with contractures rather than as a myasthenia, it is frequently
          reached by broad sequencing rather than by a targeted neuromuscular panel.
      selected_evidence:
        snippet: Exome sequencing indicated that the siblings had novel compound heterozygous missense
          variants, c.590T>G (p.Val197Gly) and c.433G>A (p.Gly145Arg), in exon 4 of ALG14.
        supports: SUPPORT
