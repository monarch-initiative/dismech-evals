        context: []
      assertion_type: Treatment
      assertion:
        name: Pyridostigmine
        description: 'An acetylcholinesterase inhibitor, the standard first-line treatment for postsynaptic
          congenital myasthenic syndromes. By slowing the hydrolysis of acetylcholine it prolongs transmitter
          dwell time in the cleft, partially compensating for the reduced number of endplate receptors.
          It does not address the glycosylation defect, which is why the response tracks the severity
          of the underlying allele: benefit was only temporary in the lethal infantile cohort, while long-surviving
          siblings gained respirator-free time.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: pyridostigmine
            term:
              id: CHEBI:8665
              label: Pyridostigmine
      selected_evidence:
        snippet: After treatment with pyridostigmine, the time off the respirator increased.
        supports: SUPPORT
