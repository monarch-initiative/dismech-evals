            relationship_type: CAUSATIVE
            variant_origin: GERMLINE
            association: ALG14 encodes a subunit of the UDP-N-acetylglucosamine transferase complex that
              it forms with ALG13 and DPAGT1 on the cytoplasmic face of the endoplasmic reticulum. The
              complex catalyses the first two committed steps of the dolichol-linked oligosaccharide pathway
              that supplies N-linked glycans. Because the gene is a general component of that pathway
              rather than a synapse-specific protein, the neuromuscular phenotype reflects the particular
              sensitivity of the endplate to reduced glycosylation capacity, and the severity of an allele
              determines how far beyond the endplate the disease extends. Two of the other subunits of
              the same pathway, DPAGT1 and ALG2, are themselves congenital myasthenic syndrome genes.
          role: ancestor
