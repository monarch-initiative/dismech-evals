      assertion_type: Treatment
      assertion:
        name: Genetic Counseling
        description: CMS18 alleles reported to date are de novo and heterozygous, so recurrence risk for
          the parents of an affected child is low but not zero (germline mosaicism cannot be excluded),
          while an affected individual would carry a 50% transmission risk. Molecular subtype identification
          is itself therapeutically consequential in the congenital myasthenic syndromes, because a drug
          that helps one subtype can worsen another.
        therapeutic_modality: OTHER
        treatment_term:
          preferred_term: Genetic Counseling
          term:
            id: NCIT:C15240
            label: Genetic Counseling
      selected_evidence:
        snippet: Precise diagnosis and molecular subtype identification are critical for treatment as
          medication for one subtype may exacerbate disease in another
        supports: SUPPORT
