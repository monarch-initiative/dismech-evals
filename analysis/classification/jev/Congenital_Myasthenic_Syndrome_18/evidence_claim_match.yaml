          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: CMS18 alleles reported to date are heterozygous and de novo, arising in the affected
          individual with unaffected parents. This distinguishes CMS18 from the majority of congenital
          myasthenic syndromes, which are autosomal recessive loss-of-function disorders; the dominant
          behaviour of SNAP25 alleles is attributed to a dominant-negative effect of the mutant SNAP-25B
          subunit incorporated into SNARE complexes.
      selected_evidence:
        snippet: Exome sequencing identified a dominant de novo variant, p.Ile67Asn, in SNAP25B, a SNARE
          protein essential for exocytosis of synaptic vesicles from nerve terminals and of dense-core
          vesicles from endocrine cells.
        supports: SUPPORT
