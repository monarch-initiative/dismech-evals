      assertion_type: DifferentialDiagnosis
      assertion:
        name: Lambert-Eaton Myasthenic Syndrome
        description: 'The acquired autoimmune presynaptic disorder, in which autoantibodies against presynaptic
          voltage-gated calcium channels reduce evoked quantal release. This is the closest mechanistic
          mimic of CMS18: both act presynaptically on quantal release, both produce post-tetanic facilitation
          of the compound muscle action potential, and both respond to 3,4-diaminopyridine - which is
          why CMS18 is classified within the LEMS-like group of congenital myasthenic syndromes. The separation
          is aetiological rather than physiological.'
        distinguishing_features:
        - LEMS is antibody-mediated and typically adult-onset and paraneoplastic (commonly small cell
          lung cancer), whereas CMS18 is a de novo germline SNAP25 disorder presenting from birth or early
          childhood
        - CMS18 additionally carries a central SNARE phenotype - epileptiform EEG, ataxia, and intellectual
          disability - that LEMS does not
        - The shared 3,4-diaminopyridine response reflects a shared presynaptic release defect and is
          therefore not discriminating
        disease_term:
          preferred_term: Lambert-Eaton myasthenic syndrome
          term:
            id: MONDO:0018556
            label: Lambert-Eaton myasthenic syndrome
      selected_evidence:
        snippet: 9 Lambert-Eaton myasthenic syndrome (LEMS)-like CMS SYT2, SNAP25, VAMP1, UNC13A, RPH3A,
          LAMA5
        supports: SUPPORT
