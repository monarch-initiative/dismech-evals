              id: MONDO:0014590
              label: congenital myasthenic syndrome 18
        context: []
      assertion_type: Treatment
      assertion:
        name: Amifampridine (3,4-Diaminopyridine)
        description: Amifampridine (3,4-diaminopyridine) is the mechanistically rational therapy for CMS18.
          It blocks presynaptic voltage-gated potassium channels, prolonging the nerve terminal action
          potential and increasing calcium entry, which raises the number of acetylcholine quanta released
          per impulse and so directly counteracts the reduced release probability caused by the defective
          SNARE complex. In the index patient it improved strength, but it did not improve the ataxia
          - an important expectation-setting point, since the central nervous system components of CMS18
          are not corrected by a drug acting on presynaptic release at the neuromuscular junction.
