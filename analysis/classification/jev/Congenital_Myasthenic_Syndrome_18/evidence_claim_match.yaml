  270bace97640fa6133bd3647df2f1628c1e659ee6b994a3dab303f3cca366d3c:
    claim:
      about:
        disease:
          name: Congenital Myasthenic Syndrome 18
          disease_term:
            preferred_term: Congenital Myasthenic Syndrome 18
            term:
              id: MONDO:0014590
              label: congenital myasthenic syndrome 18
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Dominant-Negative Disruption of the SNARE Complex
        biological_scale: MOLECULAR
        description: 'De novo heterozygous SNAP25 variants impair the SNAP-25B moiety of the ternary SNARE
          complex. In the index allele p.Ile67Asn, a highly hydrophobic isoleucine in the coiled-coil
          interface is replaced by a strongly hydrophilic asparagine, disrupting the hydrophobic packing
          that holds the four-helix SNARE bundle together. Because the mutant subunit is incorporated
          into complexes alongside wild-type SNAP-25B, the effect is dominant-negative rather than simple
          haploinsufficiency: co-expression of mutant with wild-type protein still markedly impairs evoked
          exocytosis.'
        cell_types:
        - preferred_term: Motor neuron presynaptic terminal
          term:
            id: CL:0000100
            label: motor neuron
        biological_processes:
        - preferred_term: SNARE complex assembly
          term:
            id: GO:0035493
            label: SNARE complex assembly
          modifier: DECREASED
      selected_evidence:
        snippet: depolarization of bovine chromaffin cells transfected with mutant SNAP25B or with mutant
          plus wild-type SNAP25B markedly reduced depolarization-evoked exocytosis compared with wild-type
          transfected cells.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/1
      context_paths:
