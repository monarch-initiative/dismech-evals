          value:
            name: Impaired Calcium-Triggered Synaptic Vesicle Exocytosis
            biological_scale: CELLULAR
            description: Calcium-triggered exocytosis requires assembly of the vesicular SNARE synaptobrevin
              with the presynaptic t-SNAREs SNAP-25B and syntaxin. With a defective SNAP-25B moiety, fusion
              is hindered even in a reconstituted liposome system, and depolarization-evoked release from
              dense-core vesicles in chromaffin cells is markedly reduced. The same defect operates at
              cholinergic motor nerve terminals and at central synapses, which is why CMS18 is a combined
              neuromuscular and CNS disorder rather than a purely neuromuscular one.
            cell_types:
