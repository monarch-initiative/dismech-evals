      assertion:
        name: Molecular genetic testing
        description: Definitive subtype assignment requires identification of the causal SNAP25 variant,
          because clinical and electrophysiological features cannot discriminate between CMS genes. Both
          reported CMS18 alleles were found by unbiased sequencing - the index p.Ile67Asn by whole-exome
          sequencing with Sanger confirmation of de novo status, and the neonatal p.Gln177Ter by rapid
          whole-genome sequencing.
        diagnosis_term:
