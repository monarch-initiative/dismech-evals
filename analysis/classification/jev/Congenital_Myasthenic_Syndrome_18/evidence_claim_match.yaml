      assertion_type: Diagnosis
      assertion:
        name: In vitro microelectrode study of the intercostal muscle endplate
        description: The definitive mechanistic diagnostic, available at only a few centers. In vitro
          microelectrode recording from an intercostal muscle endplate biopsy localizes the defect to
          presynaptic quantal release rather than to postsynaptic acetylcholine receptor number or endplate
          structure, and is what established the CMS18 mechanism in the index patient.
        diagnosis_term:
          preferred_term: in vitro endplate microelectrode electrophysiology
          term:
            id: NCIT:C38056
            label: Electromyography
        results: Reduced quantal content and reduced numbers of readily releasable quanta with a normal
          endplate acetylcholine receptor complement indicate a presynaptic release defect.
      selected_evidence:
        snippet: Intercostal muscle EP electrophysiology studies showed a slightly reduced MEPP amplitude,
          but the number of AChRs per EP was normal.
        supports: SUPPORT
