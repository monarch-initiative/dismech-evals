      evidence_source: IN_VITRO
      explanation: 'Refines the CMS18 mechanism in mouse hippocampal neurons: I67N raises the energy barrier
        for fusion, reducing both spontaneous and evoked release, without depleting the readily releasable
        pool. This is mechanistically distinct from the SNAP25 encephalopathy alleles V48F and D166Y,
        which act at the synaptotagmin-1 interface and instead show gain-of-function spontaneous release.'
