        - experiment_id: cms18_rns_in_dee_ascertained_cohort
          name: Systematic neuromuscular electrophysiology in SNAP25 variant carriers ascertained through
            epilepsy
          description: Perform repetitive nerve stimulation and single-fibre EMG in a cohort of patients
            carrying de novo SNAP25 variants who were ascertained through epilepsy or developmental-encephalopathy
            channels, to determine what fraction have an unrecognized - and potentially 3,4-diaminopyridine
            responsive - neuromuscular transmission defect.
        - experiment_id: cms18_variant_position_stratification
          name: Variant-position stratification of the myasthenic component
          description: Test whether variant position (SNARE four-helix bundle versus synaptotagmin-1-binding
            interface) predicts the presence and severity of the myasthenic component and the response
            to 3,4-diaminopyridine.
      selected_evidence:
        snippet: 'We studied three mutations in SNAP25 that cause epileptic encephalopathy: V48F, and
          D166Y in the synaptotagmin-1 (Syt1)-binding interface, and I67N, which destabilizes the SNARE
          complex.'
        supports: SUPPORT
