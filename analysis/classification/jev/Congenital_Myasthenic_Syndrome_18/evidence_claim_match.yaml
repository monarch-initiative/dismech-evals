          of MONDO:0014590 - the same term this entry uses - so there is no distinct MONDO identifier
          to bind, and binding the entry's own term to its differential would be self-referential. The
          dismech SNAP25_Encephalopathy entry is anchored on that same MONDO:0014590 for the same reason.
          Splitting the two concepts depends on monarch-initiative/mondo#10532, which proposes a rename
          and re-parent of MONDO:0014590 and is still open.
      selected_evidence:
        snippet: We provide a comprehensive description of SNAP25-DEE with intellectual disability and
          early-onset epilepsy
        supports: SUPPORT
