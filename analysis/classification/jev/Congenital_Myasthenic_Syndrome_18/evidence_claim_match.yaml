              label: congenital myasthenic syndrome 18
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Calcium-Triggered Synaptic Vesicle Exocytosis
        biological_scale: CELLULAR
        description: Calcium-triggered exocytosis requires assembly of the vesicular SNARE synaptobrevin
          with the presynaptic t-SNAREs SNAP-25B and syntaxin. With a defective SNAP-25B moiety, fusion
          is hindered even in a reconstituted liposome system, and depolarization-evoked release from
          dense-core vesicles in chromaffin cells is markedly reduced. The same defect operates at cholinergic
          motor nerve terminals and at central synapses, which is why CMS18 is a combined neuromuscular
          and CNS disorder rather than a purely neuromuscular one.
        cell_types:
        - preferred_term: Motor neuron presynaptic terminal
          term:
            id: CL:0000100
            label: motor neuron
        - preferred_term: Central nervous system neuron
          term:
            id: CL:0000540
            label: neuron
        biological_processes:
        - preferred_term: Calcium-ion regulated exocytosis
          term:
            id: GO:0017156
            label: calcium-ion regulated exocytosis
          modifier: DECREASED
        - preferred_term: Synaptic vesicle exocytosis
          term:
            id: GO:0016079
            label: synaptic vesicle exocytosis
          modifier: DECREASED
      selected_evidence:
        snippet: the Ca(2+) triggered fusion of liposomes incorporating v-SNARE with liposomes containing
          t-SNAREs was hindered when t-SNAREs harbored the mutant SNAP25B moiety.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
