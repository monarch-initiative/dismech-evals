          feature that links CMS7 to the hereditary motor neuropathies and is why the dominant form was
          first described as a combined myasthenic and motor-neuropathy phenotype. Whether the axonal
          degeneration is a consequence of chronically failing transmission or an independent synaptotagmin-2
          function in the axon is not established.
