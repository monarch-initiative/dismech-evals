            description: 'Biallelic frameshift, splice-site or exonic-deletion alleles. Severe and early:
              profound weakness, hypotonia, areflexia, bulbar involvement and motor developmental delay,
              with denervation atrophy.'
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic SYT2 Loss of Function
        biological_scale: MOLECULAR
        subtypes:
        - CMS7 recessive
        conforms_to: neuromuscular_transmission_failure#Endplate Component Lesion
        description: The recessive lesion removes the protein or its C-terminal SNARE-interaction surface.
          That surface sits at the bottom face of the C2B domain and is not a calcium-binding site, so
          this is a mechanistically distinct route to the same endpoint - the sensor cannot engage the
          fusion machinery rather than cannot read calcium. Alleles include frameshift, splice-donor variants
          causing in-frame skipping of the C2A exon, and a deletion spanning exons 2 to 9. The resulting
          disease is markedly more severe than the dominant form.
        genetic_context:
          gene:
            preferred_term: SYT2
            term:
              id: hgnc:11510
              label: SYT2
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
        molecular_functions:
        - preferred_term: synaptotagmin-2 SNARE engagement
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0000149
            label: SNARE binding
      selected_evidence:
        snippet: Modeling of the mutation using the rat Syt1 C2B x-ray structure revealed that Arg397Serfs*37
          disrupts a highly conserved amino acid sequence at the bottom face of the C2B domain not directly
          involved in calcium binding, but crucial for synaptotagmin-SNARE interaction and exocytosis.
        supports: SUPPORT
