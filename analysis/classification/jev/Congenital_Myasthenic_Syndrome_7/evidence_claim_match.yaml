      assertion:
        name: SYT2
        gene_term:
          preferred_term: SYT2
          term:
            id: hgnc:11510
            label: SYT2
        presence: Positive
        association: Dominant C2B Missense and Recessive Loss-of-Function Variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: 'Two allelic classes with different inheritance. Dominant: C2B calcium-binding domain missense,
          principally c.920A>C p.Asp307Ala and c.923C>T p.Pro308Leu (the same two changes are reported
          elsewhere with the nucleotide substitutions written as c.920T>G and c.923G>A - see the note
          at the bottom of this entry). A third dominant allele class is an in-frame deletion rather than
          a missense change: c.1082_1096del (NM_177402.4), removing five residues from C2B, reported as
          a de novo event in a simplex case. Recessive: frameshift (c.1191delG p.Arg397Serfs*37, c.328_331dup),
          splice-donor (c.465+1G>A causing in-frame skipping of exon 4 in the C2A domain), and a multi-exon
          deletion spanning exons 2-9. Population constraint: gnomAD reports SYT2 as loss-of-function
          intolerant and missense-constrained - pLI 0.70, LOEUF upper bound 0.58, LoF z-score 3.34, missense
          z-score 2.62, synonymous z-score 0.98. These are database-derived summary statistics with no
          quotable publication behind them, so they are recorded here as notes rather than as an evidence-backed
          claim, and dismech has no structured slot for gene-level constraint metrics.'
      selected_evidence:
        snippet: In-frame skipping of exon 4 that encodes part of the C2A calcium-binding domain of SYT2
          is associated with a loss-of-function effect resulting in a decrease of neurotransmitter release
          and severe pre- and postsynaptic NMJ defects.
        supports: SUPPORT
    origin:
