          prolonged, up to 60 minutes. The genetic diagnosis is made on a CMS gene panel or exome sequencing;
          note that a multi-exon deletion has been reported, so a copy-number-aware method or confirmatory
          microarray is needed to avoid a false-negative in a consanguineous family. Acetylcholine receptor
          and voltage-gated calcium channel antibodies are negative, which is the test that separates
          CMS7 from the two acquired disorders its electrophysiology imitates; seronegativity is an expected
          consequence of a Mendelian channel-coupling defect rather than a finding any SYT2 series reports
          as a measured result, so it is carried here as prose supported indirectly rather than as a cited
          positive observation.'
        notes: 'Differential diagnosis: Lambert-Eaton myasthenic syndrome, which the electrophysiology
          closely resembles but which is acquired and antibody mediated; other presynaptic congenital
          myasthenic syndromes (CHAT/CMS6, the SNAP25, VAMP1 and MUNC13-1 syndromes); and hereditary motor
          neuropathy, which the foot deformity and distal wasting suggest on their own. Coexisting foot
          deformity and a facilitating CMAP is the combination that points to SYT2.'
      selected_evidence:
        snippet: Although clinical signs similar to LEMS can be present, the main hallmark is the electrophysiological
          findings, which are identical to autoimmune LEMS.
        supports: SUPPORT
