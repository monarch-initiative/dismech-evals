      assertion:
        name: Autosomal Dominant
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        expressivity: VARIABLE
        description: The originally described form is autosomal dominant, caused by heterozygous missense
          variants in the SYT2 C2B calcium-binding domain and segregating through multiple generations.
          A de novo heterozygous in-frame deletion has also been reported in a simplex case, so an affected
          proband with unaffected parents does not exclude the dominant form and a negative parental test
          does not exclude SYT2. Penetrance in the reported multigenerational pedigrees appears high,
          but no cohort has been assembled that would let it be quantified, so the structured `penetrance`
          slot is deliberately left unset rather than recorded as COMPLETE.
      selected_evidence:
        snippet: Via whole-exome sequencing, we identified heterozygous missense mutations in the C2B
          calcium-binding domain of the gene encoding Synaptotagmin 2 in two multigenerational families
          presenting with peripheral motor neuron syndromes.
        supports: SUPPORT
