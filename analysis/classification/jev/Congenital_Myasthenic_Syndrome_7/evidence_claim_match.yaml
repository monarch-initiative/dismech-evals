      assertion_type: Treatment
      assertion:
        name: Oral Salbutamol
        description: 'A beta-2 adrenergic agonist that is standard symptomatic treatment in several congenital
          myasthenic syndromes and, in animal studies, remodels the endplate. It is curated here for a
          negative result: in a 12-month open trial of motor neuropathies with neuromuscular junction
          dysfunction, including SYT2, it produced no clear benefit on motor function and no clear change
          in neurophysiological parameters, with significant off-target beta-adrenergic side effects.
          The one positive signal was patient-reported fatigue. Albuterol was also ineffective in the
          separately reported recessive case. It is not a recommended treatment for CMS7 on current evidence.'
        therapeutic_modality: SMALL_MOLECULE
