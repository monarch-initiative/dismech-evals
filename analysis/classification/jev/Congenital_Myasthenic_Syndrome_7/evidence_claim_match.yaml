  6aa76cecce27a0cfe1ee74b01d9d414ed3376372a3c3928f4eddebbba5a5936b:
    claim:
      about:
        disease:
          name: Congenital Myasthenic Syndrome 7
          disease_term:
            preferred_term: congenital myasthenic syndrome 7
            term:
              id: MONDO:0014468
              label: congenital myasthenic syndrome 7
        context:
        - path: /has_subtypes/0
          value:
            name: CMS7 dominant
            display_name: CMS7, autosomal dominant (SYT2 C2B missense)
            description: 'Heterozygous C2B-domain variants acting through a dominant-negative mechanism:
              principally the missense changes p.Asp307Ala and p.Pro308Leu, and also a de novo in-frame
              deletion, c.1082_1096del, removing five residues from C2B. Later onset, foot deformities
              and lower-limb wasting, fatigable ocular and lower-limb weakness, and an accompanying non-progressive
              or slowly progressive motor neuropathy. Clinically the milder of the two forms.'
          role: subtype
      assertion_type: Pathophysiology
      assertion:
        name: SYT2 C2B Dominant-Negative Calcium Sensor Disruption
        biological_scale: MOLECULAR
        subtypes:
        - CMS7 dominant
        conforms_to: neuromuscular_transmission_failure#Endplate Component Lesion
        description: 'Synaptotagmin-2 is the fast calcium sensor of the motor nerve terminal: its tandem
          C2 domains bind calcium entering through active-zone channels and trigger SNARE-mediated vesicle
          fusion within a millisecond. The dominant variants sit in the C2B calcium-binding pocket - p.Asp307Ala
          removes an essential calcium-coordinating aspartate, p.Pro308Leu the adjacent proline - so the
          sensor is expressed but cannot read the calcium signal. The effect is dominant-negative rather
          than haploinsufficient: the mutant subunit is incorporated into the release machinery alongside
          wild-type protein and actively degrades its function, which is why a single allele suffices
          and why the recessive form is not simply a more severe dose of the same lesion.'
        genetic_context:
          gene:
            preferred_term: SYT2
            term:
              id: hgnc:11510
              label: SYT2
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
        molecular_functions:
        - preferred_term: calcium sensing by the synaptotagmin-2 C2B domain
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0005509
            label: calcium ion binding
        cellular_components:
        - preferred_term: synaptic vesicle
          term:
            id: GO:0008021
            label: synaptic vesicle
      selected_evidence:
        snippet: An essential calcium-binding aspartate residue, Asp307Ala, was disrupted by a c.920A>C
          change in one family that presented with an autosomal-dominant presynaptic neuromuscular junction
          disorder resembling Lambert-Eaton myasthenic syndrome.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
