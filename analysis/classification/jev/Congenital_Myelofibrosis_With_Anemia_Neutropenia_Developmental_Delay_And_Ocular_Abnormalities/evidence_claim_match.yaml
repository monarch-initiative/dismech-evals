  ef46716a299eb91cbbfdf451da3f7bc40bd2e82189b7fb4af168b5d589754750:
    claim:
      about:
        disease:
          name: Congenital Myelofibrosis with Anemia, Neutropenia, Developmental Delay, and Ocular Abnormalities
          disease_term:
            preferred_term: myelofibrosis, congenital, with anemia, neutropenia, developmental delay,
              and ocular abnormalities
            term:
              id: MONDO:0975797
              label: myelofibrosis, congenital, with anemia, neutropenia, developmental delay, and ocular
                abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: rbsn_allelic_series_nosology
        kind: OPEN_QUESTION
        status: OPEN
        prompt: Is the RBSN p.Gly425Arg patient of PMID:25233840 a case of this disease, a case of Kariminejad
          neurodevelopmental syndrome, or a third RBSN phenotype?
        attaches_to:
        - disease#Congenital Myelofibrosis with Anemia, Neutropenia, Developmental Delay, and Ocular Abnormalities
        - genetic#RBSN
        rationale: 'RBSN carries at least two separately named Mendelian disorders. ClinVar keys the p.Gly97Arg
          allele to this condition and the two FYVE-domain alleles p.Arg180Gly and p.Gly183Arg to Kariminejad
          neurodevelopmental syndrome (MONDO:0975795); the paper reporting the latter concludes that distinct
          germline RBSN mutations cause non-overlapping phenotypes with discrete endolysosomal defects.
          That is a clean two-way split, and this entry follows it.

          The p.Gly425Arg patient does not fit the split. She was reported in 2014 with developmental
          delay, no speech, inability to walk, dysmorphic features, delayed bone age, transient neutropenia,
          macrocytosis with megaloblastoid erythropoiesis and a mild increase in marrow reticulin fibrosis
          - which is this entry''s phenotype at lower severity, with seizures added. Her authors themselves
          drew the connection to the VPS45 marrow disease, four years before it was reported, and a later
          review of trafficking disorders lists her among the RBSN cases with craniofacial dysmorphism.
          But ClinVar does not classify her allele as pathogenic for either named condition, and OMIM''s
          definition of this disease cites only the 2018 Letter. Deciding the case would mean reading
          that Letter, which is not retrievable in text form; the 2022 framework predicts phenotype from
          which interaction an allele disrupts, and this curation found no publication applying it to
          p.Gly425Arg.

          Recorded rather than decided. If it belongs here, this entry''s phenotype range widens to include
          seizures and a much milder marrow phenotype, and its earliest case becomes 2014.

          '
        notes: 'Kariminejad neurodevelopmental syndrome (MONDO:0975795) is not curated in dismech. This
          change adds a stub for it: it is a legitimate separate curation target, not a subtype of this
          entry.'
      selected_evidence:
        snippet: We conclude that distinct germline mutations in RBSN cause non-overlapping phenotypes
          with specific and discrete endolysosomal cellular defects.
        supports: SUPPORT
