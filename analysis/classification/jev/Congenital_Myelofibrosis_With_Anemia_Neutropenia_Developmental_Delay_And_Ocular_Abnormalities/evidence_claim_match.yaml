              id: MONDO:0975797
              label: myelofibrosis, congenital, with anemia, neutropenia, developmental delay, and ocular
                abnormalities
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'Recorded as autosomal recessive on the strength of the disease class rather than
          of a published segregation analysis for this gene. Congenital myelofibrosis presents in childhood,
          clusters in consanguineous families, and is attributed to germline variants in MPL, VPS45 and
          RBSN; the VPS45 counterpart is explicitly biallelic. The PubMed record for the defining RBSN
          Letter is indexed with the MeSH terms Consanguinity and Pedigree, which is consistent but is
          indexing metadata rather than a reported finding, so it is not cited as evidence here. No published
          quote states the zygosity of the RBSN allele in the index patient; ClinVar records one pathogenic
          germline variant for this condition without a mode-of-inheritance assertion.

          '
      selected_evidence:
        snippet: Defective endosomal intracellular protein trafficking due to biallelic mutations in VPS45
          underlies a new immunodeficiency syndrome involving impaired neutrophil function.
        supports: SUPPORT
        directness: INDIRECT
    origin:
