        - preferred_term: receptor-mediated endocytosis
          modifier: DECREASED
          term:
            id: GO:0006898
            label: receptor-mediated endocytosis
      selected_evidence:
        snippet: Depletion of Rabenosyn-5, but not of other early endosomal proteins such as early endosome
          antigen 1, resulted in impaired transferrin uptake and lysosomal degradation of transferrin
          receptors.
        supports: SUPPORT
