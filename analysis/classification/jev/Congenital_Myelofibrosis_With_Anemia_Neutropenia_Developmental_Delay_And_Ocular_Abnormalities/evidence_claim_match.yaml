  7da7ba6a87b2493715f9110ab1d383d053c41abb5a394c9806bee9914c788856:
    claim:
      about:
        disease:
          name: Congenital Myelofibrosis with Anemia, Neutropenia, Developmental Delay, and Ocular Abnormalities
          disease_term:
            preferred_term: myelofibrosis, congenital, with anemia, neutropenia, developmental delay,
              and ocular abnormalities
            term:
              id: MONDO:0975797
              label: myelofibrosis, congenital, with anemia, neutropenia, developmental delay, and ocular
                abnormalities
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: Hematologic disease is apparent in infancy and is multilineage - neutropenia, anemia
          and variable thrombocytopenia over a fibrotic marrow. On top of that sits severe neurodevelopmental
          delay with absent speech and inability to walk, which is lifelong and is not addressed by any
          treatment directed at the marrow. The only intervention reported to change the hematologic course
          is hematopoietic transplantation. In the partner disease - the closest comparator with published
          outcomes - transplanting into a fibrotic marrow niche is itself described as a challenge, and
          eight of the sixteen reported patients died before, during or after transplantation.
      selected_evidence:
        snippet: Additional features include severe neurodevelopmental delay with absent speech and inability
          to walk, delayed bone age, ocular abnormalities, and dysmorphic facial features.
        supports: SUPPORT
