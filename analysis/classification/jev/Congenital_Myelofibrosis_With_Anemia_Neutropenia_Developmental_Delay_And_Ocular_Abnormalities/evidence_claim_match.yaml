            term:
              id: MONDO:0975797
              label: myelofibrosis, congenital, with anemia, neutropenia, developmental delay, and ocular
                abnormalities
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_ocular_and_craniofacial_mechanism
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: How does loss of an early-endosomal Rab5 effector produce optic-nerve and anterior-segment
          maldevelopment?
        attaches_to:
        - phenotypes#Abnormality of the eye
        - phenotypes#Abnormal facial shape
        rationale: 'Ocular abnormality is in the disease''s name, and nothing in this entry explains it.
          The features annotated to the concept are developmental - optic nerve hypoplasia and aplasia,
          hypoplastic optic chiasm, coloboma, aniridia, microphthalmia - which would place the lesion
          in eye morphogenesis rather than in a degenerative process. This curation found no study connecting
          rabenosyn-5 to that programme; a Europe PMC search for rabenosyn or RBSN together with neural,
          neuron or brain on 2026-09-19 returned no relevant work.

          The craniofacial half of the question has at least been asked. A 2021 review places intracellular
          trafficking defects among the causes of craniofacial disease and includes rabenosyn-5 in that
          set, on the strength of the p.Gly425Arg patient''s midfacial hypoplasia - but it offers no mechanism
          either, and that patient''s relationship to this disease is itself unsettled (see `rbsn_allelic_series_nosology`).

          Both phenotype nodes are therefore left with no incoming causal edge, which is the honest state
          rather than a curation oversight.

          '
      selected_evidence:
        snippet: RBSN-5 contributes to the recycling of transferrin receptors to the PM and the trafficking
          of cathepsin D from the Golgi to lysosomes.
        supports: SUPPORT
        directness: INDIRECT
