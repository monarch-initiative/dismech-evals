  9e805c2369241c755079c55e180c7b20d5d88ac85bf8ba7b4ff94506f78d1f6c:
    claim:
      about:
        disease:
          name: Congenital Myelofibrosis with Anemia, Neutropenia, Developmental Delay, and Ocular Abnormalities
          disease_term:
            preferred_term: myelofibrosis, congenital, with anemia, neutropenia, developmental delay,
              and ocular abnormalities
            term:
              id: MONDO:0975797
              label: myelofibrosis, congenital, with anemia, neutropenia, developmental delay, and ocular
                abnormalities
        context: []
      assertion_type: Genetic
      assertion:
        name: RBSN
        gene_term:
          preferred_term: RBSN
          term:
            id: hgnc:20759
            label: RBSN
        relationship_type: CAUSATIVE
        notes: 'RBSN, formerly ZFYVE20, encodes rabenosyn-5. Both the cached MedGen record for this concept
          and the ClinVar record for the associated variant give the gene location as 3p25.1 (ClinVar
          VCV003340062, GRCh38 chr3:15090399); both were read through NCBI on 2026-09-19. The gene CURIE
          binds to what `runoak -i sqlite:obo:hgnc info hgnc:20759` returns, which is RBSN. ZFYVE20 is
          the previous symbol rather than a current alias: the live HGNC record for HGNC:20759 gives symbol
          RBSN, prev_symbol ZFYVE20 and location 3p25.1 (fetched from the HGNC REST API on 2026-09-19).
          That is why the older literature cited in this entry writes ZFYVE20 for the same gene.

          The disease-associated allele is recorded in ClinVar as NM_022340.4(RBSN):c.289G>C (p.Gly97Arg),
          classified Pathogenic for this condition with no assertion criteria provided, and cross-referenced
          to OMIM allelic variant 609511.0002. The defining Letter characterises the change as loss of
          function in its own title. Neither ClinVar nor the MedGen record states the zygosity in the
          index patient, and the Letter is not quotable, so no zygosity is asserted anywhere in this entry.

          '
      selected_evidence:
        snippet: Some of the genes and associated syndromes in this category are WAS (Wiskott-Aldrich
          syndrome protein), SBDS (Shwachman-Bodian-Diamond syndrome), G6PC (glycogen storage disease),
          CXCR4 (WHIM syndrome), TAZ (Barth syndrome), RBSN (syndromic myelofibrosis and neutropenia),
          and SMARCD2.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35605178
      reference_title: Inherited bone marrow failure in the pediatric patient.
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      explanation: A hematology review naming RBSN as the gene of a syndromic disorder of myelofibrosis
        with neutropenia, which is this entry's disease.
