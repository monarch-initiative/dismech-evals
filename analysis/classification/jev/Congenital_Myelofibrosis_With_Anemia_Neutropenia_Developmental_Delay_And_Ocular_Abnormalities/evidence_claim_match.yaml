        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: gap_fibrogenic_cell_in_rbsn_marrow
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Which cell deposits the reticulin in RBSN-related congenital myelofibrosis, and what recruits
          it?
        attaches_to:
        - pathophysiology#Bone Marrow Reticulin Fibrosis
        rationale: 'The pathograph reaches marrow fibrosis by analogy with the VPS45 disease and stops
          there. The gap is not this entry''s reading of a thin literature; it is stated by the people
          who reviewed the partner disease, who say the mechanism is not known and name transforming growth
          factor beta from apoptotic neutrophils and abnormal megakaryocytes only as a possible contributor.
          Nothing equivalent has been looked at in RBSN patients at all.

          Three consequences in this entry follow from that. The `Bone Marrow Reticulin Fibrosis` node
          carries no cell type. The edge into it is `INDIRECT_UNKNOWN_INTERMEDIATES`. And the entry declares
          no conformance to the `fibrotic_response` module, whose chain runs through inflammatory recruitment
          and mesenchymal cell activation - neither of which has been shown here, in a disease where the
          candidate profibrotic source is a dying neutrophil rather than an activated mesenchymal cell.

          '
      selected_evidence:
        snippet: The exact mechanism underlying this phenomenon is not known, although increased release
          of transforming growth factor (TGF)- ß and other mediators from apoptotic neutrophils and abnormal
          megakaryocytes may play a role.
        supports: SUPPORT
        directness: INDIRECT
