      assertion_type: Pathophysiology
      assertion:
        name: Disrupted Receptor Signalling in the Developing Nervous System
        description: 'The neurodevelopmental arm, and the part of the mechanism that is an inference rather
          than a result. Rabenosyn-5 controls the recycling rate of many receptor species, including growth-factor
          and neurotransmitter receptors, so a recycling defect is a plausible route to impaired neurodevelopment.
          This curation found no study of rabenosyn-5 in neural tissue or neural cells in any RBSN-related
          disorder - a Europe PMC search for rabenosyn or RBSN together with neural, neuron or brain returned
          no such work on 2026-09-19 - and the node carries no cell type for that reason.

          '
        biological_scale: CELLULAR
        mechanism_confidence: HYPOTHETICAL
        biological_processes:
        - preferred_term: endocytic recycling
          modifier: DECREASED
          term:
            id: GO:0032456
            label: endocytic recycling
      selected_evidence:
        snippet: By controlling the rate of recycling of numerous receptors, Rbsn-5 affects critical cellular
          functions, amongst which are the absorption and cellular uptake of high molecular weight nutrients,
          the signaling capacity of growth factor and neurotransmitter receptors, and the ability of integrins
          to control cellular motility.
        supports: SUPPORT
        directness: INDIRECT
