        name: Impaired Endosomal Receptor Recycling and Cargo Sorting
        description: 'The cellular consequence, and the step that is best evidenced in this disease''s
          biology. Rabenosyn-5 determines what happens to receptors after clathrin-mediated internalisation:
          depleting it sends transferrin receptors to lysosomal degradation instead of back to the surface,
          and it impairs recycling of beta1 integrin. Because rabenosyn-5 sets the recycling rate of many
          receptors rather than one, the consequences are not confined to a single ligand - nutrient uptake,
          growth-factor and neurotransmitter signalling, and integrin-dependent motility all depend on
          it.

          '
        biological_scale: CELLULAR
        mechanism_confidence: ESTABLISHED
