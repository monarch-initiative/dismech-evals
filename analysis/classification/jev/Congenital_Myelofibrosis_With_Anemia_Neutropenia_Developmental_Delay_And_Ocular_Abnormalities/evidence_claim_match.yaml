            label: Abnormality of the eye
        description: 'The umbrella node, retained because "ocular abnormalities" is what the disease name
          and the quotable definition say. The two lesions consistently named for this concept - microphthalmia
          and optic nerve hypoplasia - are now recorded as their own phenotypes below. The HPO clinical-feature
          list on the cached MedGen record also annotates optic nerve aplasia, hypoplastic optic chiasm,
          iris coloboma, iris hypoplasia, congenital aniridia and microcornea to this concept; together
          these point at anterior-segment and optic-nerve maldevelopment rather than at an acquired ocular
          problem. That list is per-feature annotation with no disease-specific sentence behind it, so
          those further features are left uncurated rather than added on annotation alone.

          Nothing in this entry points a causal edge at this node: no mechanism links a receptor-recycling
          defect to eye development in this disease, and inventing one would be worse than leaving the
          node unwired.

