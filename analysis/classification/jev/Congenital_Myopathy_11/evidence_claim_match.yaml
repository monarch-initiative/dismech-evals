      assertion_type: Discussion
      assertion:
        discussion_id: canine_centronuclear_versus_human_cftd
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#T-Tubule and Sarcoplasmic Membrane Disorganization
        - animal_models#Canis lupus familiaris
        prompt: Is the T-tubule and sarcoplasmic membrane lesion of HACD1-deficient dogs part of the human
          disease, given that human biopsies show fiber-type disproportion without centronuclear or membrane
          changes, and that the human course improves while the canine course progresses?
        rationale: Most mechanistic data on HACD1 deficiency come from the Labrador model, in which the
          myopathy is classified as centronuclear and the membrane lesion worsens with age. Human patients
          improve, and their biopsies, taken in early childhood, show small type 1 fibers with only rare
          internal nuclei. The difference may reflect biopsy age, species differences in HACD2 compensation
          or allele type, and it decides whether membrane maintenance or myoblast fusion is the mechanism
          to pursue in patients.
        proposed_experiments:
        - experiment_id: adult_patient_muscle_ultrastructure
          name: Ultrastructure of adult HACD1 patient muscle
          description: Electron microscopy and T-tubule immunostaining of muscle from adult HACD1 patients,
            compared with age-matched controls, to test whether the canine membrane lesion appears with
            age in humans.
          would_support:
          - pathophysiology#T-Tubule and Sarcoplasmic Membrane Disorganization
      selected_evidence:
        snippet: Labrador retrievers affected by spontaneous centronuclear myopathy (cnm) have clinical
          and histological features of the human disorder and represent the first model of recessive autosomal
          centronuclear myopathy.
        supports: SUPPORT
