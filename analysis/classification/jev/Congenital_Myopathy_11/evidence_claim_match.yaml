      assertion:
        name: HACD1 Biallelic Loss of Function
        biological_scale: MOLECULAR
        description: Homozygous nonsense (c.744C>A p.Tyr248*, c.458G>A), splice-site (c.373_375+2delGAGGT,
          c.785-1G>T, c.785-2A>T) and LINE retrotransposon insertion alleles remove functional HACD1.
          The p.Tyr248* allele reduces muscle HACD1 mRNA to 31% of control through nonsense-mediated decay,
          and the encoded protein has no 3-hydroxyacyl-CoA dehydratase activity.
        genes:
        - preferred_term: HACD1
          term:
            id: hgnc:9639
            label: HACD1
        genetic_context:
          variant_origin: GERMLINE
          zygosity: HOMOZYGOUS
          functional_impact_category: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: The mutation results in non-sense mediated decay of the HACD1 mRNA to 31% of control
          levels in patient muscle and completely abrogates the enzymatic activity of dehydration of 3-hydroxyacyl-CoA,
          the third step in the elongation of very long-chain fatty acids (VLCFAs).
        supports: SUPPORT
