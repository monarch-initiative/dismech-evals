          PMID:32426512, a case letter with no abstract). ClinGen classifies HACD1 as Definitive for autosomal
          recessive congenital myopathy under the parent class MONDO:0019952, not under this MONDO term,
          so no gene_disease_validity assertion is recorded here.'
