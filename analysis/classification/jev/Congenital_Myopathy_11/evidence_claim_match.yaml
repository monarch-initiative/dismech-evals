  e227197146d80d87b781b97886251ab566df8942efb14ad6c7d927ffc2c7dce4:
    claim:
      about:
        disease:
          name: Congenital Myopathy 11
          disease_term:
            preferred_term: congenital myopathy 11
            term:
              id: MONDO:0859264
              label: congenital myopathy 11
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Labrador retriever HACD1 centronuclear myopathy
        species: Canis lupus familiaris
        genotype: HACD1 (PTPLA) exon 2 SINE insertion, homozygous (PTPLA cnm allele)
        publication: PMID:15829503
        description: Naturally occurring autosomal recessive myopathy of Labrador retrievers, spread worldwide
          from a single recent founder. Affected dogs have hypotonia, generalized weakness and reduced
          exercise capacity, and the canine disease is classified histologically as a centronuclear myopathy.
        associated_phenotypes:
        - Generalized muscle weakness and reduced walking distance
        - Centronuclear myopathy histology
        - T-tubule dilatation and mislocalized triads
        modeled_mechanisms:
        - target: HACD1 Biallelic Loss of Function
          relationship: RECAPITULATES
          fidelity: HIGH
          model_scale: MOLECULAR
          description: The insertion disrupts splicing so that wild-type HACD1 transcript falls to about
            1% in muscle.
          limitations: A hypomorphic splicing allele rather than the nonsense, splice-site or exon 6 insertion
            alleles seen in patients.
        - target: Impaired Myoblast Fusion
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: CELLULAR
          description: Reduced myoblast fusion in HACD1-deficient Labradors.
        - target: T-Tubule and Sarcoplasmic Membrane Disorganization
          relationship: RECAPITULATES
          fidelity: LOW
          model_scale: CELLULAR
          description: Progressive membrane system defects in canine muscle.
          limitations: Membrane and nuclear-position changes are prominent in dogs but have not been described
            in human HACD1 biopsies, so this node may be canine-specific or age-dependent.
          divergences:
          - divergence_type: SPECIES_MISMATCH
            materiality: QUALIFYING
            description: The dog disease is progressive and centronuclear, whereas the human disease improves
              with age and shows fiber-type disproportion with only rare internal nuclei; the T-tubule
              lesion has been documented only in the dog.
        - target: Myofiber Hypotrophy With Fiber Size Disproportion
          relationship: RECAPITULATES
          fidelity: MODERATE
          model_scale: TISSUE
          description: Fiber size disproportion with generalized weakness, as in patients.
      selected_evidence:
        snippet: Described herein is a disease-associated insertion within PTPLA exon 2, found in both
