      assertion_type: Pathophysiology
      assertion:
        name: Reduced 3-Hydroxyacyl-CoA Dehydratase Activity in Muscle
        biological_scale: MOLECULAR
        description: HACD1 is one of four mammalian 3-hydroxyacyl-CoA dehydratases (HACD1-4) that dehydrate
          3-hydroxyacyl-CoA to trans-2-enoyl-CoA in the endoplasmic reticulum elongation cycle, interacting
          with the ELOVL condensing enzymes. HACD1 is the most highly expressed isoform in skeletal muscle.
          In Hacd1 knockout mouse muscle total dehydratase activity falls by only about 40%, because HACD2
          carries a redundant activity, which may explain the relatively mild and improving human course.
        genes:
        - preferred_term: HACD1
          term:
            id: hgnc:9639
            label: HACD1
        cell_types:
        - preferred_term: skeletal muscle fiber
          term:
            id: CL:0008002
            label: skeletal muscle fiber
        - preferred_term: skeletal muscle myoblast
          term:
            id: CL:0000515
            label: skeletal muscle myoblast
        molecular_functions:
        - preferred_term: very-long-chain 3-hydroxyacyl-CoA dehydratase activity
          term:
            id: GO:0102158
            label: very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase activity
          modifier: DECREASED
        biological_processes:
        - preferred_term: very long-chain fatty acid biosynthetic process
          term:
            id: GO:0042761
            label: very long-chain fatty acid biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: We demonstrate that all four of these human proteins are indeed 3-hydroxyacyl-CoA dehydratases,
          in growth suppression experiments using a PHS1-shut off yeast strain and/or in vitro 3-hydroxypalmitoyl-CoA
          dehydratase assays.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
