        notes: 'Reported biallelic alleles (NM_007034.5), all homozygous: J-domain missense c.74G>A p.(Arg25Gln),
          c.105G>C p.(Lys35Asn), c.181A>G p.(Arg61Gly); C-terminal missense c.785T>C p.(Leu262Ser); nonsense
          c.547C>T p.(Arg183*), c.775C>T p.(Arg259*), c.856A>T p.(Lys286*); frameshift c.308del p.(Gly103Glufs*25);
          an exon 2 deletion; and a whole-gene deletion. In a small cohort, J-domain missense alleles
          were associated with earlier onset (median 0.5 vs 28 years) and higher mortality (75% vs 14%).
          The heterozygous c.270T>A p.(Phe90Leu) variant in the G/F-rich domain causes a separate autosomal
          dominant distal myopathy with a proposed gain-of-function mechanism and is not part of this
          entry. The homozygous p.(Arg61Gly) family was first reported in an intellectual disability cohort
          (PMID:36344539); cognition was normal in the 2024 cohort. No ClinGen gene-disease validity record
          for this pair was found in the local cache.'
      selected_evidence:
        snippet: These data demonstrate a novel chaperonopathy associated with DNAJB4 causing a myopathy
          with early respiratory failure.
        supports: SUPPORT
