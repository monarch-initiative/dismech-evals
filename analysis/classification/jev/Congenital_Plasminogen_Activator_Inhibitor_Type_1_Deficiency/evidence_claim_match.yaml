        snippet: The diagnosis of complete PAI-1 deficiency is established in a proband when PAI-1 antigen
          is undetectable and PAI-1 activity is lower than 1 IU/mL and/or biallelic SERPINE1 pathogenic
          variants are identified on molecular genetic testing.
