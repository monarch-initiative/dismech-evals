        description: Biallelic null variants in SERPINE1 abolish PAI-1, a serine protease inhibitor (serpin)
          that is the primary inhibitor of tissue-type and urokinase-type plasminogen activators. In the
          first characterised kindred a frameshift in exon 4 left homozygotes with undetectable PAI-1
          antigen. The DECREASED modifier records the loss of the inhibitor protein, not a measured change
          in its specific activity.
        molecular_functions:
        - preferred_term: plasminogen activator inhibitor activity
          modifier: DECREASED
