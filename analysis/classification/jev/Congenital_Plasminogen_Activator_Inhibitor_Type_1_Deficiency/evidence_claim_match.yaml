        name: Derepressed Cardiomyocyte TGF-beta Signaling
        biological_scale: CELLULAR
        description: PAI-1 deficiency paradoxically causes cardiac-selective fibrosis. In PAI-1-null mice,
          ventricular myocytes are a source of TGF-beta, and loss of PAI-1 increases cardiomyocyte TGF-beta
          production and Smad signalling, with endothelial-to-mesenchymal transition contributing in aged
          hearts. iPSC-derived cardiomyocytes from homozygous Amish patients released more TGF-beta1 after
          angiotensin II. The human evidence is the imaging and iPSC data; the signalling detail comes
          from mice.
        cell_types:
        - preferred_term: cardiomyocyte
          term:
            id: CL:0000746
            label: cardiac muscle cell
        biological_processes:
        - preferred_term: transforming growth factor beta receptor signaling pathway
          modifier: INCREASED
          term:
            id: GO:0007179
            label: transforming growth factor beta receptor signaling pathway
      selected_evidence:
        snippet: The numbers of phosphorylated Smad2-, phosphorylated Smad3-, and phosphorylated ERK1/2
          MAPK-, but not pAkt/PKB-, positive cells were significantly increased in PAI-1-deficient myocardial
          tissues.
        supports: SUPPORT
