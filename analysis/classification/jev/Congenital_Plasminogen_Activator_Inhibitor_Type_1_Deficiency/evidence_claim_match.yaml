          variant_origin: GERMLINE
          functional_impact_category: LOSS_OF_FUNCTION
          gene:
            preferred_term: SERPINE1
            term:
              id: hgnc:8583
              label: SERPINE1
      selected_evidence:
        snippet: We previously reported a child with abnormal bleeding and complete PAI-1 deficiency caused
          by a frame-shift mutation in exon 4 of the PAI-1 gene.
        supports: SUPPORT
