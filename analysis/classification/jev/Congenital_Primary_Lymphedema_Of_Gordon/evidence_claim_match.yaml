      assertion_type: Pathophysiology
      assertion:
        name: VEGFC Haploinsufficiency
        biological_scale: MOLECULAR
        description: Heterozygous frameshift, nonsense and splice-site VEGFC variants are all predicted
          to truncate the protein so that it lacks a complete VEGF homology domain, which is required
          to activate VEGFR3. The c.571_572insTT protein is stable but poorly secreted. In a zebrafish
          floorplate overexpression assay the mutant proteins lose the ability to induce vessel sprouting,
          and co-expression with wild-type VEGFC does not suppress wild-type activity, so the mutant allele
          acts by loss of function (haploinsufficiency) rather than as a dominant negative. VEGFC is secreted
          as an inactive precursor that becomes an active VEGFR3 ligand only after proteolytic processing
          by the ADAMTS3-CCBE1 complex. The biallelic p.Ser65Arg allele, reported in one patient, altered
          this processing in vitro.
        genes:
        - preferred_term: VEGFC
          term:
            id: hgnc:12682
            label: VEGFC
        molecular_functions:
        - preferred_term: vascular endothelial growth factor receptor 3 binding
          modifier: DECREASED
          term:
            id: GO:0043185
            label: vascular endothelial growth factor receptor 3 binding
      selected_evidence:
        snippet: Functional characterization of the p.(Ser65Arg) variation in vitro showed alterations
          in VEGF-C processing.
        supports: SUPPORT
    origin:
