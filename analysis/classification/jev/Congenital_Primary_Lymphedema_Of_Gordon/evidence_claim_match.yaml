      assertion_type: Genetic
      assertion:
        name: VEGFC
        association: Heterozygous loss-of-function (truncating, frameshift, splice-site) variants
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: VEGFC
          term:
            id: hgnc:12682
            label: VEGFC
        variants:
        - name: c.571_572insTT
          type: frameshift
          clinical_significance: PATHOGENIC
          description: Exon 4 two-base insertion found in the founding three-generation family; the encoded
            protein lacks activity in the zebrafish sprouting assay.
        - name: p.Arg210Ter (c.628C>T)
          type: nonsense
          clinical_significance: PATHOGENIC
          description: Exon 4 stop-gain variant segregating with lymphedema in a Spanish family.
        - name: c.361+5G>A
          type: splice site
          clinical_significance: PATHOGENIC
          description: Intron 2 donor splice-site variant causing exon 2 skipping, a frameshift and premature
            stop (p.Ala50ValfsTer18), removing the entire VEGF homology domain.
        - name: c.148-3_148-2delCA
          type: splice site
          clinical_significance: PATHOGENIC
          description: Acceptor splice-site deletion causing exon skipping, first reported in its own
            family (Fastre et al. 2018) and later found in trans with p.Ser65Arg in a biallelic proband.
        - name: c.552G>A
          type: synonymous (splice-disrupting)
          clinical_significance: PATHOGENIC
          description: Coded as synonymous but disrupts splicing and causes exon skipping, predicted to
            truncate the protein; a synonymous annotation alone would miss its effect.
        - name: p.Ser65Arg (c.195T>G)
          type: missense
          description: Novel missense allele found in trans with the splice variant c.148-3_148-2delCA
            in a single proband; it altered VEGFC processing in vitro. Its contribution on its own is
            not established, so no clinical significance is asserted here.
      selected_evidence:
        snippet: In this study, we provide independent evidence that VEGFC mutations are causative of
          primary lymphedema of the type originally described by Gordon et al.
        supports: SUPPORT
