        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: megaureter_no_clingen_gene_disease_relationship
        prompt: Is there a single-gene or oligogenic cause of isolated primary megaureter distinct from
          the broader CAKUT gene set (PAX2, TBX18, SIX2, BMP4, NRIP1, and others), which explain CAKUT
          generally but have not been shown to cause isolated megaureter specifically?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - genetic#
        rationale: 'No ClinGen-level gene-disease validity relationship, recurrent pathogenic variant,
          inheritance pattern, or carrier frequency has been established for isolated congenital primary
          megaureter. This is why `genetic:` is deliberately absent from this entry: the broader CAKUT
          gene set is well documented for CAKUT as a whole, but attributing it to isolated primary megaureter
          specifically would be unsupported extrapolation.'
      selected_evidence:
        snippet: Defects in specific genes such as PAX2, TBX18, NRIP1, REX, SIX2, BMP4, and chromosome
          17 cause CAKUT.
        supports: SUPPORT
