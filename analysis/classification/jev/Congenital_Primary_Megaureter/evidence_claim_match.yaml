          an abnormal circular-to-longitudinal smooth muscle fiber ratio together with excess interposed
          collagen deposition between and around the muscle bundles. This disrupted muscular architecture
          prevents the coordinated, wavelike smooth muscle contraction required to propagate a peristaltic
          wave, so the segment cannot actively transport the urine bolus across the ureterovesical junction
          even though it is not narrowed (not a fixed anatomic stricture). This lesion is common to all
          four Smith/King forms of primary megaureter.

          '
        biological_scale: TISSUE
        cell_types:
        - preferred_term: ureter smooth muscle cell
          term:
            id: CL:1000979
            label: ureter smooth muscle cell
        biological_processes:
        - preferred_term: ureteric peristalsis
          modifier: ABSENT
          term:
            id: GO:0072105
            label: ureteric peristalsis
        - preferred_term: collagen fibril organization
          modifier: INCREASED
          term:
            id: GO:0030199
            label: collagen fibril organization
        locations:
        - preferred_term: ureterovesical junction
          term:
            id: UBERON:0009973
            label: ureterovesical junction
      selected_evidence:
        snippet: the obstructed segment had no muscle conductivity due to excess collagen irrespective
          of presence of telocytes
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
      context_paths:
