      assertion:
        name: Non-obstructed Non-refluxing
        display_name: Non-obstructed, non-refluxing primary megaureter
        description: 'The commonest form: the aperistaltic segment produces ureteral dilation without
          a demonstrable functional obstruction or reflux. Most cases are detected antenatally or incidentally,
          remain stable or improve with growth of the ureter and resolution of the relative caliber mismatch
          across the segment, and are managed with observation rather than surgery.

          '
        subtype_term:
          preferred_term: congenital primary megaureter, nonrefluxing and unobstructed form
          term:
            id: MONDO:0016552
            label: congenital primary megaureter, nonrefluxing and unobstructed form
      selected_evidence:
        snippet: PMU is the result of an atonic or stenotic segment of the distal ureter, resulting in
          congenital dilation of the ureter, and is frequently diagnosed on routine antenatal ultrasound.
        supports: SUPPORT
