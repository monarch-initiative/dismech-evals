  04cfefb18278b4dd1c09dcf23753113dbd4776363708d8988b0e1dbe05cd9485:
    claim:
      about:
        disease:
          name: Congenital Primary Megaureter
          disease_term:
            preferred_term: congenital primary megaureter
            term:
              id: MONDO:0018960
              label: congenital primary megaureter
        context: []
      assertion_type: Subtype
      assertion:
        name: Obstructed
        display_name: Obstructed primary megaureter
        description: 'The aperistaltic juxtavesical segment functionally impedes antegrade urine bolus
          transport (a dynamic, not a fixed anatomic, obstruction) without reflux, producing progressive
          proximal ureteral dilation and, in more severe or bilateral cases, hydroureteronephrosis and
          risk of impaired differential renal function.

          '
        subtype_term:
          preferred_term: congenital primary megaureter, obstructed form
          term:
            id: MONDO:0016550
            label: congenital primary megaureter, obstructed form
      selected_evidence:
        snippet: Indications for surgical intervention include symptoms such as febrile UTIs or pain,
          and in the asymptomatic patient, a DRF below 40% associated with massive or progressive hydronephrosis,
          or a drop in differential function on serial renograms.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24206785
      reference_title: British Association of Paediatric Urologists consensus statement on the management
        of the primary obstructive megaureter.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports that the obstructed form risks progressive hydronephrosis and impaired differential
        renal function that may require surgical correction.
