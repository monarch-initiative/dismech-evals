      assertion_type: Diagnosis
      assertion:
        name: Voiding Cystourethrography to Exclude Reflux and Bladder Outlet Obstruction
        description: 'A micturating cystourethrogram (MCUG/VCUG) is performed to exclude vesicoureteral
          reflux and bladder outlet obstruction (e.g., posterior urethral valves). This step is what makes
          the diagnosis "primary" rather than secondary: a positive reflux finding does not exclude the
          disease, but instead reclassifies the case into the refluxing or combined form, while a mechanical
          bladder-outlet lesion reclassifies it as secondary megaureter, out of scope for this entry.

          '
        diagnosis_term:
          preferred_term: cystography
          term:
            id: NCIT:C38049
            label: Cystography
