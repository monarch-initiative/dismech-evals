        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aperistaltic Juxtavesical Ureteric Segment
        description: 'A short segment of ureter immediately proximal to the ureterovesical junction shows
          an abnormal circular-to-longitudinal smooth muscle fiber ratio together with excess interposed
          collagen deposition between and around the muscle bundles. This disrupted muscular architecture
          prevents the coordinated, wavelike smooth muscle contraction required to propagate a peristaltic
          wave, so the segment cannot actively transport the urine bolus across the ureterovesical junction
          even though it is not narrowed (not a fixed anatomic stricture). This lesion is common to all
          four Smith/King forms of primary megaureter.

          '
        biological_scale: TISSUE
        cell_types:
        - preferred_term: ureter smooth muscle cell
          term:
            id: CL:1000979
            label: ureter smooth muscle cell
        biological_processes:
        - preferred_term: ureteric peristalsis
          modifier: ABSENT
          term:
            id: GO:0072105
            label: ureteric peristalsis
        - preferred_term: collagen fibril organization
          modifier: INCREASED
          term:
            id: GO:0030199
            label: collagen fibril organization
        locations:
        - preferred_term: ureterovesical junction
          term:
            id: UBERON:0009973
            label: ureterovesical junction
      selected_evidence:
        snippet: Marked muscle hypoplasia and sparse or no ICCs occurred in the longitudinal muscle layer
          of the restricted ureteral segments.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:17301719
      reference_title: C-kit positive interstitial cells of Cajal network in primary obstructive megaureter.
      evidence_source: HUMAN_CLINICAL
      explanation: Surgical specimens of primary obstructive megaureter show the muscular abnormality
        is confined to the longitudinal muscle layer of the restricted (aperistaltic) segment, supporting
        an abnormal circular-to-longitudinal muscle architecture at this site.
