        subtype: Non-obstructed Non-refluxing
        age_range: Infancy through early childhood (typically resolves within several years of diagnosis)
        notes: The commonest form usually stabilizes or resolves without surgery as the ureter grows and
          the relative caliber mismatch across the aperistaltic segment lessens.
