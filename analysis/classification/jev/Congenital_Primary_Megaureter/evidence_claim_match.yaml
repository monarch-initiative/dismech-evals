      assertion_type: Subtype
      assertion:
        name: Refluxing
        display_name: Refluxing primary megaureter
        description: 'The aperistaltic segment coincides with a separate, shortened intravesical (submucosal)
          ureteric tunnel that renders the ureterovesical junction incompetent, producing vesicoureteral
          reflux in addition to the primary ureteral dilation from impaired antegrade transport.

          '
        subtype_term:
          preferred_term: congenital primary megaureter, refluxing form
          term:
            id: MONDO:0016551
            label: congenital primary megaureter, refluxing form
      selected_evidence:
        snippet: Refluxing megaureters contained only 55% +/- 15% type I collagen. However, there was
          an increase in type III collagen (16% +/- 4%) versus (4.5% +/- 2%) in controls (P <0.05).
        supports: SUPPORT
    origin:
