      - /disease_term
    evidence_metadata:
      reference: PMID:9610598
      reference_title: 'A quantitative histologic analysis of collagen subtypes: the primary obstructed
        and refluxing megaureter of childhood.'
      evidence_source: HUMAN_CLINICAL
      explanation: Quantitative histology shows the refluxing form has a distinct collagen subtype composition
        (relatively more type III collagen) compared with the obstructed form, a stiffer, less distensible
        fiber associated with lower surgical reimplantation success in the source study.
