      assertion_type: Pathophysiology
      assertion:
        name: Ureterovesical Junction Incompetence
        description: 'In the refluxing and combined obstructed-and-refluxing forms, the ureterovesical
          junction fails to prevent retrograde urine flow during bladder filling and voiding — the feature
          that classifies these two forms as "refluxing" in the Smith/King scheme, distinct from the obstructed
          and non-obstructed non-refluxing forms. The valve-incompetence mechanism is presumed analogous
          to that described for isolated primary vesicoureteral reflux (a shortened, poorly supported
          intravesical ureteric tunnel; see Familial_Vesicoureteral_Reflux.yaml), but this has not been
          independently confirmed histologically in megaureter specifically — a knowledge gap rather than
          an established finding.

          '
        biological_scale: TISSUE
        locations:
