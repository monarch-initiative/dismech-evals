        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Lupus anticoagulant-hypoprothrombinaemia syndrome
        description: An acquired, antibody-mediated hypoprothrombinaemia that presents with the same screening
          pattern as the congenital disorder - prolonged PT and aPTT with a reduced factor II level -
          but has a completely different mechanism. Non-neutralizing antiprothrombin antibodies accelerate
          clearance of the prothrombin-antibody complex from the circulation rather than any F2 lesion,
          and the syndrome is triggered by autoimmune disease or infection. It is frequently the reason
          a low factor II level in a previously well patient is not congenital, and it must not be curated
          as a subtype of this disease.
        distinguishing_features:
        - Lupus anticoagulant positive in essentially all cases, which is definitional for the acquired
          syndrome
        - High-titre anticardiolipin and anti-beta-2-glycoprotein I antibodies
        - Acquired onset, frequently post-infectious or autoimmune, in a previously unaffected person
        - Other coagulation factors usually normal
        - Responds to immunosuppression, which has no role in the congenital disorder
      selected_evidence:
        snippet: Lupus anticoagulant (LA) is positive in 100% of cases, as this represents a defining
          feature.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/1
