        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Defective Vitamin K-Dependent Gla-Domain Membrane Binding
        biological_scale: MOLECULAR
        description: Prothrombin is a vitamin K-dependent protein. Gamma-carboxylation of the glutamate
          residues of its Gla domain creates the calcium-dependent conformation that docks the zymogen
          onto the anionic phospholipid surface where prothrombinase assembles. Variants that block propeptide
          cleavage - the step that presents the Gla domain correctly - remove that anchoring. The same
          step is what acquired vitamin K deficiency, vitamin K antagonists, and the hereditary combined
          vitamin K-dependent factor deficiencies interrupt, which is why those conditions phenocopy this
          disease.
        molecular_functions:
        - preferred_term: calcium-dependent phospholipid membrane binding by the Gla domain
          modifier: DECREASED
          term:
            id: GO:0005543
            label: phospholipid binding
        biological_processes:
        - preferred_term: peptidyl-glutamic acid carboxylation
          term:
            id: GO:0017187
            label: peptidyl-glutamic acid carboxylation
      selected_evidence:
        snippet: Prothrombin is a plasma glycoprotein and zymogen of a serine protease requiring vitamin
          K for normal biosynthesis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/0
      context_paths:
      - /name
      - /disease_term
