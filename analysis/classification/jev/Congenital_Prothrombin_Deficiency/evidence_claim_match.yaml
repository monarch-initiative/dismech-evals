              label: congenital prothrombin deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Thrombomodulin-Dependent Protein C Activation
        biological_scale: MOLECULAR
        description: 'Thrombin bound to endothelial thrombomodulin activates protein C, the principal
          physiological brake on further thrombin generation. This anticoagulant output is lost alongside
          the procoagulant ones, so the net haemostatic consequence of prothrombin deficiency is not a
          simple subtraction, and the offset is a plausible contributor to the weak correlation between
          residual factor II activity and bleeding severity. It is not the explanation for the rare dysprothrombin
          variants that present with thrombosis: those escape inhibition by antithrombin, which is a separate
          mechanism acting on the mutant thrombin itself rather than on this thrombomodulin-protein C
          arm.'
        cell_types:
        - preferred_term: endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: regulation of blood coagulation
          modifier: DECREASED
          term:
            id: GO:0030193
            label: regulation of blood coagulation
        notes: Deliberately left with no downstream edge. The loss of this arm does not contribute to
          the bleeding phenotype - it opposes it - and no source quantifies its net effect in congenital
          prothrombin deficiency. See the `anticoagulant_arm_offset` discussion.
      selected_evidence:
        snippet: Conversely, thrombin also exerts anticoagulant effects, enhancing the protein C activity
          while complexed with thrombomodulin.
        supports: SUPPORT
