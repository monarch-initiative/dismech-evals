          disease_term:
            preferred_term: congenital prothrombin deficiency
            term:
              id: MONDO:0013361
              label: congenital prothrombin deficiency
        context: []
      assertion_type: Genetic
      assertion:
        name: F2
        gene_term:
          preferred_term: F2
          term:
            id: hgnc:3535
            label: F2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        inheritance:
        - name: Autosomal recessive inheritance
          inheritance_term:
            preferred_term: Autosomal recessive inheritance
            term:
              id: HP:0000007
              label: Autosomal recessive inheritance
        notes: 'F2 encodes prothrombin and is the only gene in which variants cause this disorder. The
          common F2 c.*97G>A (G20210A) 3'' untranslated-region allele is a distinct entity: it raises
          prothrombin and predisposes to venous thrombosis rather than causing deficiency, and must not
          be conflated with the loss-of-function alleles curated here.'
        variants:
        - name: Prothrombin Vellore 1 (p.Ala362Thr)
          description: A novel missense change affecting the B chain of alpha-thrombin, found in compound
            heterozygosity with a propeptide-cleavage-site variant in an Indian patient with 17.5% residual
            coagulant activity. Modelling places it adjacent to the catalytic-triad histidine.
        - name: p.Val322Glu
          description: A homozygous missense variant causing severe dysprothrombinaemia. The mutant zymogen
            cannot complete the zymogen-to-proteinase transition; ecarin-driven activation accumulates
            the meizothrombin intermediate, which retains some fibrinogen-degrading activity and may explain
            the patient's mild clinical phenotype despite activity below 1%.
      selected_evidence:
        snippet: Thirty-nine different mutations have been identified and characterized in prothrombin
          deficiency.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/1
