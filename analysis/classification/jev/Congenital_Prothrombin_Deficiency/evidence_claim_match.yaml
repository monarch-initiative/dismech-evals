      assertion:
        name: Deficient Thrombin Activity at the Site of Injury
        biological_scale: ORGANISM
        description: Thrombin is the hub of the haemostatic response, and this node is where the single
          upstream lesion fans out. Thrombin converts fibrinogen to fibrin, activates platelets through
          protease-activated receptors, feeds back to activate factors V, VIII and XI so that its own
          generation becomes a burst, activates factor XIII to cross-link the fibrin mesh, and - complexed
          with thrombomodulin - switches on protein C. Losing one enzyme therefore removes five distinct
          outputs at once.
        biological_processes:
        - preferred_term: blood coagulation
          modifier: DECREASED
          term:
            id: GO:0007596
            label: blood coagulation
      selected_evidence:
        snippet: The conversion of prothrombin (FII) to the serine protease, thrombin (FIIa), is a key
          step in the coagulation cascade because FIIa triggers platelet activation, converts fibrinogen
          to fibrin, and activates regulatory pathways that both promote and ultimately suppress coagulation.
        supports: SUPPORT
    origin:
