        kind: OPEN_QUESTION
        status: OPEN
        prompt: What is the human phenotype of complete prothrombin deficiency, and is the inference of
          lethality from animal models safe?
        attaches_to:
        - pathophysiology#Deficient Thrombin Activity at the Site of Injury
        - disease#Congenital Prothrombin Deficiency
        rationale: No living patient with undetectable plasma prothrombin has ever been reported, and
          every described genotype leaves residual activity. The claim that complete absence is incompatible
          with life is therefore an inference from an absence of human observations plus two independent
          prothrombin-null mouse lines and a zebrafish model, not a human finding. This entry states it
          as a constraint on the disease model rather than as an observed human phenotype.
      selected_evidence:
        snippet: No living patient with undetectable plasma prothrombin has been reported to date.
        supports: SUPPORT
