          on an anionic phospholipid membrane in the presence of calcium ions - is what converts prothrombin
          to thrombin at a physiologically useful rate. Whether the lesion is too little substrate (type
          I), a substrate that cannot be activated (type II), or a substrate that cannot reach the membrane,
          the rate-limiting step is the same one, and the measurable consequence is a reduced and slowed
          thrombin generation curve.
