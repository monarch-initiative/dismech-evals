            term:
              id: MONDO:0013361
              label: congenital prothrombin deficiency
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Biallelic F2 Pathogenic Variants
        biological_scale: MOLECULAR
        description: Homozygous or compound heterozygous pathogenic variants in F2, on chromosome 11,
          are the initiating lesion. Most are missense; nonsense, frameshift, splice-site and small in-frame
          deletions are also described. Variants distribute between the catalytic domain, the anion-binding
          exosite, the Na+-binding loop, the kringle domains, and the propeptide/Gla processing region,
          and the domain hit is what determines whether the result is a quantitative or a qualitative
          defect.
        molecular_functions:
        - preferred_term: serine-type endopeptidase activity of thrombin
          modifier: DECREASED
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
        cell_types:
        - preferred_term: hepatocyte
          term:
            id: CL:0000182
            label: hepatocyte
      selected_evidence:
        snippet: Prothrombin deficiency is a very rare disorder caused by mutations in the F2 gene that
          generate hypoprothrombinemia or dysprothrombinemia and is characterized by bleeding manifestations
          that can vary from clinically irrelevant to life-threatening.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
