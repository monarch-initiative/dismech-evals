      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hereditary combined vitamin K-dependent coagulation factor deficiency
        description: 'Biallelic GGCX or VKORC1 defects impair gamma-carboxylation of every vitamin K-dependent
          protein, so factor II falls together with factors VII, IX and X and with proteins C and S. The
          overlap with congenital prothrombin deficiency is mechanistic as well as clinical: both act
          on the Gla-domain membrane-binding step, but the combined deficiency does so for the whole vitamin
          K-dependent family rather than for prothrombin alone.'
        distinguishing_features:
        - Proportionate reduction of factors II, VII, IX and X plus proteins C and S, rather than an isolated
          factor II defect
        - Frequently at least partially responsive to vitamin K
      selected_evidence:
        snippet: found to have immunologically recognizable coagulation factors II, VII, IX, and X that
          lacked γ-carboxyglutamic acid residues
        supports: SUPPORT
