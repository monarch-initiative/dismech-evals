      assertion_type: AnimalModel
      assertion:
        name: Prothrombin-null mouse (F2 knockout)
        species: Mouse
        genotype: F2 homozygous null (FII-/-)
        publication: PMID:9636195
        description: Targeted inactivation of the murine prothrombin gene. Roughly half the null embryos
          die between embryonic days 9.5 and 11.5 with bleeding into the yolk sac cavity; those that reach
          term die of haemorrhage within days of birth. The model is the principal evidence that complete
          prothrombin loss is incompatible with survival, and so bounds what the human disease can be.
        modeled_mechanisms:
        - target: Deficient Thrombin Activity at the Site of Injury
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          model_scale: ORGANISM
          description: Complete genetic ablation of prothrombin, producing total loss of thrombin generation
            and fatal haemorrhage.
          limitations: The model is a complete null. Every described human patient retains measurable
            residual prothrombin activity, and no living human with undetectable prothrombin has been
            reported, so the mouse models the lethal limit of the disease rather than any clinically observed
            genotype. Its embryonic and neonatal lethality also prevents study of the chronic, episodic
            bleeding that defines the human disorder.
          readouts:
          - name: Survival of homozygous null neonates
            target: Deficient Thrombin Activity at the Site of Injury
            direction: DECREASED
            interpretation: Null neonates that reach term die of haemorrhage within days, showing that
              prothrombin is required postnatally and not only developmentally.
      selected_evidence:
        snippet: The rare Cf2(-/-) neonates died of hemorrhage on the first postnatal day.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
