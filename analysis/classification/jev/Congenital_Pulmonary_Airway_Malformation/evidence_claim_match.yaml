      assertion_type: DifferentialDiagnosis
      assertion:
        name: Pleuropulmonary Blastoma
        disease_term:
          preferred_term: pleuropulmonary blastoma
          term:
            id: MONDO:0011014
            label: pleuropulmonary blastoma
        description: Purely cystic (type I) pleuropulmonary blastoma (formerly classified as CPAM type
          4) closely mimics macrocystic CPAM on prenatal and postnatal imaging but is a malignant DICER1-associated
          mesenchymal neoplasm with potential to progress to high-grade type II or III sarcoma.
        distinguishing_features:
        - Presence of germline and/or somatic hotspot DICER1 mutations (present in 70-80% of PPB cases)
          rather than somatic KRAS or FGFR2 mutations.
        - Solid tumor components in types II and III, whereas purely cystic type I requires histopathology
          and DICER1 genetic analysis to distinguish from CPAM.
      selected_evidence:
        snippet: While types II and III are usually identifiable on imaging due to their solid tumor components,
          the purely cystic type I represents a particular diagnostic challenge. In imaging, it is often
          difficult to distinguish from benign congenital lung malformations such as congenital pulmonary
          airway malformation (CPAM, formerly congenital cystic adenomatoid malformation or CCAM), sequestration,
          or bronchogenic cyst.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
