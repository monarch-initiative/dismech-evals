      selected_evidence:
        snippet: By contrast, pleuropulmonary blastoma is associated with germline mutations within the
          DICER1 gene in approximately 70–80% of cases. These represent the first “hit,” resulting in
          monoallelic loss of function. A subsequent somatic “second hit,” often a hotspot mutation in
          the RNase IIIb domain, leads to biallelic inactivation and tumorigenesis. This two-hit model
          forms the basis of DICER1 tumor predisposition syndrome, with pleuropulmonary blastoma being
          its hallmark neoplasm.
        supports: SUPPORT
