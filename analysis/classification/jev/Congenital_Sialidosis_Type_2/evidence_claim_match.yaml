      assertion_type: Genetic
      assertion:
        name: NEU1
        association: Biallelic severe loss-of-function variants in NEU1 (chromosome 6p21.33) that abolish
          catalytic activity and/or lysosomal localization of neuraminidase-1 (Class I and Class II variants,
          such as c.679G>A p.Gly227Arg).
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        gene_term:
          preferred_term: NEU1
          term:
            id: hgnc:7758
            label: NEU1
        features: 'Genotype-phenotype correlation depends on residual NEU1 activity and lysosomal localization:
          congenital and severe type II sialidosis result from two catalytically inactive alleles (Class
          I variants retained in pre-lysosomal compartments or Class II variants that reach lysosomes
          but lack enzymatic activity), whereas type I sialidosis retains at least one mild, catalytically
          active Class III variant.'
      selected_evidence:
        snippet: The mutation, c.679G > A; p.Gly227Arg, reported in our patients, lies within the important
          β N (second strand of the third sheet) repeat region of the sialidase molecule. This mutation
          is predicted to produce a severe phenotype. The misfolded mutant protein is retained in the
          pre-lysosomal compartment with impaired lysosomal targeting and resulting lack of enzyme activity
        supports: SUPPORT
