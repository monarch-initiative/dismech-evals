      assertion:
        name: Systemic Sodium Depletion and Metabolic Acidosis
        conforms_to: electrolyte_transport_related_diarrhea#Ion-Specific Systemic Depletion and Acid-Base
          Derangement
        description: The systemic arm, and the acid-base mirror image of congenital chloride diarrhea.
          NHE3 exports a proton into the lumen for every sodium it absorbs; when the exchanger fails,
          that proton is retained in the body while sodium is lost in stool. The result is hyponatremia
          with metabolic ACIDOSIS - the opposite derangement to the hypochloremic metabolic ALKALOSIS
          produced when the chloride/bicarbonate exchanger DRA fails in congenital chloride diarrhea.
          Urinary sodium is low-to-normal, confirming that the loss is enteric rather than renal, which
          is the discriminating measurement.
        role: effector
        biological_scale: ORGANISM
        biological_processes:
        - preferred_term: Systemic acid-base regulation
          term:
            id: GO:0006885
            label: regulation of pH
          modifier: ABNORMAL
      selected_evidence:
        snippet: The diagnosis of CSD in 4 of 5 patients was based on daily fecal sodium excretion between
          98 and 190 mmol/L, hyponatremia, metabolic acidosis, and low-to-normal urinary sodium concentrations.
        supports: SUPPORT
