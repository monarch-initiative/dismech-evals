        conforms_to: electrolyte_transport_related_diarrhea#Luminal Electrolyte Retention and Failure
          of Net Ion Absorption
        description: The rate-limiting step. NHE3-mediated electroneutral sodium absorption is the principal
          route by which the small intestine and colon reclaim luminal sodium, and it is the driving force
          for the water absorption that follows it. When that step fails - whether the exchanger is absent,
          non-functional, or inhibited by excess cGMP - sodium is retained in the lumen at concentrations
          far above what the remaining absorptive routes can clear, and in the GUCY2C form active chloride
          secretion adds to the luminal ion load. This is the disorder-agnostic convergence point of all
          three genetic forms and the reason fecal sodium is disproportionately high, which is the diagnostic
          signature.
        role: central_effector
        biological_scale: TISSUE
