            description: Recessive SPINT2 loss of function. Intestinal disease plus choanal or anal atresia,
              hypertelorism and corneal erosions. Occurred in ten families in the delineating cohort.
              SPINT2 also causes a syndromic form of congenital tufting enteropathy.
          role: subtype
      assertion_type: Genetic
      assertion:
        name: SPINT2 loss-of-function variants
        gene_term:
          preferred_term: SPINT2
          term:
            id: hgnc:11247
            label: SPINT2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        subtype: Syndromic CSD
        features: 'Homozygous or compound heterozygous SPINT2 variants, encoding a Kunitz-type serine
          protease inhibitor, cause the syndromic form. Reported alleles include a recurrent c.593-1G>A
          splice variant plus p.Y163C, c.1A>T, c.337+2T>C and c.553+2T>A. They act by loss of protein
          synthesis or by failure to inhibit the serine protease trypsin, so the proposed mechanism is
          excess serine protease activity in affected tissues. Genotype-phenotype separation is clean:
          SPINT2 variants were found in all syndromic patients and in none of the classic-CSD patients.
          SPINT2 variants also cause a syndromic form of congenital tufting enteropathy, so the same gene
          reaches two CODE classes.'
      selected_evidence:
        snippet: The same mutation and four distinct, homozygous or compound heterozygous mutations (p.Y163C,
          c.1A-->T, c.337+2T-->C, c.553+2T-->A) were identified in all syndromic patients. No SPINT2 mutations
          were found in classic-CSD patients.
        supports: SUPPORT
