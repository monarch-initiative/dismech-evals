  cad0065acd95a3f9380dff15ff1ad652f256ad6b88f0c555900e3359c86259da:
    claim:
      about:
        disease:
          name: Congenital Sodium Diarrhea
          disease_term:
            preferred_term: congenital sodium diarrhea
            term:
              id: MONDO:0015170
              label: congenital sodium diarrhea
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Constitutive Guanylate Cyclase C Activation
        description: 'The upstream lesion of the GUCY2C arm only. A dominant activating variant in guanylate
          cyclase C raises cyclic GMP on ligand exposure. Excess cGMP acts in two directions: it hyperactivates
          CFTR, driving chloride and water secretion, and it inhibits NHE3, which is itself a downstream
          target of GC-C. This node is therefore placed upstream of the NHE3 lesion rather than beside
          it - the two are sequential in the GUCY2C arm, not alternative entry points at the same level.
          Conformers entering through SLC9A3 do not pass through this node.'
        genes:
        - preferred_term: GUCY2C
          term:
            id: hgnc:4688
            label: GUCY2C
        role: trigger
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: Small-intestinal enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        molecular_functions:
        - preferred_term: Guanylate cyclase C activity
          term:
            id: GO:0004383
            label: guanylate cyclase activity
          modifier: GAIN_OF_FUNCTION
        biological_processes:
        - preferred_term: Cyclic GMP production
          term:
