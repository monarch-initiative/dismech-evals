  300b8f40f4faf22447e1d191179db6db094761093b5202a92fdab352d226eb58:
    claim:
      about:
        disease:
          name: Congenital Thrombotic Thrombocytopenic Purpura
          disease_term:
            preferred_term: congenital thrombotic thrombocytopenic purpura
            term:
              id: MONDO:0010122
              label: congenital thrombotic thrombocytopenic purpura
        context: []
      assertion_type: ProgressionInfo
      assertion:
        phase: Neonatal onset
        age_range: First days of life
        notes: 'Between 35% and 50% of patients present in the first days after birth with severe haemolysis,
          jaundice and thrombocytopenia, and the presentation is often fatal without effective treatment.
          The proposed trigger is haemodynamic rather than infective: fetal flow through the ductus arteriosus
          is low-shear, but at birth the shunt reverses and the duct narrows, producing turbulent circulation
          that unfolds ultralarge VWF and permits platelet aggregation. On this account prompt ductal
          closure is protective and a patent duct sustains the trigger. Clinically the important consequence
          is a misdiagnosis trap: newborn cTTP is commonly called haemolytic disease of the fetus and
          newborn and treated with exchange transfusion, which prevents kernicterus and so masks the error.
          Severe thrombocytopenia is the feature that should stop that reading, because HDFN does not
          cause it.'
      selected_evidence:
        snippet: The diagnosis of newborn-onset hTTP should be considered because HDFN does not cause
          severe thrombocytopenia, which might be effectively treated with recombinant ADAMTS13.
        supports: SUPPORT
    origin:
