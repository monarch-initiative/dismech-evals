      assertion_type: Discussion
      assertion:
        discussion_id: onset_timing_not_explained_by_residual_activity
        kind: KNOWLEDGE_GAP
        prompt: Why do two patients with the same residual ADAMTS13 activity present decades apart — one
          in the neonatal period and one in a first pregnancy?
        attaches_to:
        - pathophysiology#Severe Plasma ADAMTS13 Activity Deficiency
        rationale: 'The bimodal age distribution of cTTP is not explained by the enzyme deficiency alone.
          The international registry showed directly that residual ADAMTS13 activity is not the only determinant
          of age at first manifestation, and produced a counterintuitive result: compound heterozygous
          carriers of the recurrent c.4143_4144dupA allele had a *larger* proportion with onset before
          three months than homozygotes, despite homozygotes having lower measured activity. Something
          beyond the ADAMTS13 genotype sets when disease becomes overt.

          The mouse work says the same thing from the other direction, and narrows it usefully. Adamts13-null
          mice are viable with normal survival; spontaneous thrombocytopenia requires a permissive genetic
          background, and a full TTP-like syndrome requires an added toxin challenge. Two constraints
          follow. The permissive factor is not simply VWF level, because plasma VWF did not correlate
          with severity, so the modifying genes are distinct from VWF. And the human triggers are identifiable
          in outline (birth, pregnancy, infection) without those modifiers being known at all. The open
          question is therefore specific rather than vague: what are the non-VWF susceptibility loci,
          and do they account for the residual-activity paradox in the registry?'
      selected_evidence:
        snippet: We found a larger proportion of compound heterozygous than homozygous carriers of ADAMTS13
          c.4143_4144dupA with overt disease onset at < 3 months of age (50% vs 37%), despite the fact
          that ADAMTS13 activity was <1% in 18 of 20 homozygous, but in only 8 of 14 compound heterozygous
          carriers.
        supports: SUPPORT
