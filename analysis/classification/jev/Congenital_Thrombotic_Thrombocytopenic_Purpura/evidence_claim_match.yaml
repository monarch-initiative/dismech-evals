  b8bd528681d85272d70eecc198acbc2f8bdadebd998c1a987a1d1a0b551361dd:
    claim:
      about:
        disease:
          name: Congenital Thrombotic Thrombocytopenic Purpura
          disease_term:
            preferred_term: congenital thrombotic thrombocytopenic purpura
            term:
              id: MONDO:0010122
              label: congenital thrombotic thrombocytopenic purpura
        context: []
      assertion_type: Treatment
      assertion:
        name: Plasma Prophylaxis in Pregnancy
        description: 'Pregnancy physiologically raises VWF and is the dominant trigger of adult cTTP,
          so prophylaxis through pregnancy is a distinct management question rather than a special case
          of routine prophylaxis. In a cohort of 14 women with hereditary TTP across 71 pregnancies, 24%
          ended in pregnancy loss and 45% were complicated by severe obstetric morbidity; plasma-treated
          pregnancies had markedly less severe obstetric morbidity and far fewer preterm TTP exacerbations.
          Response is not uniform: higher non-pregnant VWF antigen predicted morbidity even among treated
          women, which is a candidate stratifier rather than an established one.'
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
          preferred_term: Fresh Frozen Plasma Transfusion
          term:
            id: NCIT:C116475
            label: Fresh Frozen Plasma Transfusion
      selected_evidence:
        snippet: Among the treated women, median NPVWF antigen levels were higher in those with SOM than
          in those without SOM (225% vs 165%, p = .047).
        supports: SUPPORT
    origin:
      assertion_path: /treatments/3
      evidence_path: /treatments/3/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:36889591
