              label: congenital thrombotic thrombocytopenic purpura
        context: []
      assertion_type: Environmental
      assertion:
        name: Neonatal ductal flow transition
        description: A physiological rather than exogenous exposure, and the clearest worked example of
          the trigger mechanism. Fetal flow through the ductus arteriosus is low-shear; at birth the shunt
          reverses and the duct narrows, producing turbulence that unfolds ultralarge VWF. Prompt ductal
          closure ends the exposure and the newborn survives; a patent duct sustains it.
        exposure_term:
          preferred_term: turbulent ductal blood flow in the neonatal transition
      selected_evidence:
        snippet: The greatest risk for hTTP is in their first days after birth, when 35-50% of patients
          will have severe hemolysis, jaundice, and thrombocytopenia.
        supports: SUPPORT
