      assertion:
        name: Recombinant ADAMTS13 Prophylaxis
        description: Intravenous recombinant ADAMTS13 (40 IU/kg) given as routine prophylaxis replaces
          the missing protease directly. In the phase 3 crossover trial no acute TTP event occurred during
          recombinant ADAMTS13 prophylaxis, activity reached approximately 100% of normal, drug-related
          adverse events occurred in 9% of patients against 48% on standard therapy, no patient discontinued
          for an adverse event, and no neutralising antibodies developed.
        therapeutic_modality: PROTEIN_REPLACEMENT
        treatment_term:
