        - name: ADAMTS13 c.4143_4144dupA (p.Glu1382Argfs*6)
          description: 'The one recurrent allele in an otherwise largely private mutational spectrum:
            present on 60 of 246 alleles in the international registry. Its frequency is a founder effect
            rather than a mutational hotspot - haplotype analysis across 17 intragenic markers found identical
            haplotypes in every informative family, and carriers cluster in Northern and Central Europe.'
        - name: ADAMTS13 p.R1060W
          description: A recurrent missense allele associated with low but measurable residual ADAMTS13
            activity, reported alongside the founder-mutation haplotype study.
        notes: 'Biallelic loss-of-function variants in ADAMTS13 cause cTTP. The mutational spectrum is
          broad and largely private: 98 different variants were found across 123 registry patients. Variants
          abolish or severely reduce VWF-cleaving protease activity, and prespacer-domain variants are
          associated with earlier, childhood onset.'
      selected_evidence:
        snippet: Of the 98 different ADAMTS13 mutations detected, c.4143_4144dupA (exon 29; p.Glu1382Argfs*6)
          was the most frequent mutation, present on 60 of 246 alleles.
