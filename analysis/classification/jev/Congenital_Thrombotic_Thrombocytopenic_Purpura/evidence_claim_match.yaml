            term:
              id: NCIT:C169784
              label: Apadamtase Alfa
      selected_evidence:
        snippet: No acute TTP event occurred during prophylaxis with recombinant ADAMTS13, whereas 1 patient
          had an acute TTP event during prophylaxis with standard therapy (mean annualized event rate,
          0.05).
        supports: SUPPORT
