              label: congenital thrombotic thrombocytopenic purpura
        context: []
      assertion_type: Environmental
      assertion:
        name: Systemic physiological stressors that raise VWF or shear
        description: Pregnancy and infection are the two commonest precipitants of an acute cTTP episode,
          and they are the same triggers as in immune TTP - which is informative, because it says the
          trigger acts on the shared downstream pathway rather than on the aetiology. In cTTP the enzyme
          deficiency is constitutional and lifelong, so what varies is not the protease but the load placed
          on it; the disease is episodic because the trigger is.
        exposure_term:
          preferred_term: pregnancy or systemic infection as a physiological stressor
      selected_evidence:
        snippet: Sixty-nine percent of adult presentations were associated with pregnancy.
        supports: SUPPORT
    origin:
      assertion_path: /environmental/0
      evidence_path: /environmental/0/evidence/0
