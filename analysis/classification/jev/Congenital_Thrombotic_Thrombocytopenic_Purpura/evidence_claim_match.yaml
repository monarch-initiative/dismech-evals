      assertion_type: Diagnosis
      assertion:
        name: ADAMTS13 activity assay with inhibitor testing
        description: Severe deficiency at or below 10% of normal establishes TTP; the absence of a functional
          inhibitor is what makes it congenital rather than immune. Both halves are required - activity
          alone does not separate the two diseases, and getting it wrong sends the patient to immunosuppression
          that cannot work.
      selected_evidence:
        snippet: Diagnosis of congenital thrombotic thrombocytopenic purpura was confirmed by severely
          deficient ADAMTS13 activity (≤10% of normal) in the absence of a functional inhibitor and the
          presence of ADAMTS13 mutations on both alleles.
