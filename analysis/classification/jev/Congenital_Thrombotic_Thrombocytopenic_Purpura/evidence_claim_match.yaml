        context: []
      assertion_type: Diagnosis
      assertion:
        name: Recognising neonatal cTTP behind a haemolytic-disease-of-the-newborn label
        description: Not a test but a decision point, and the one most often missed. Newborn cTTP is commonly
          treated as HDFN with exchange transfusion, which prevents kernicterus and so conceals the error.
          Severe thrombocytopenia is the feature that should stop that reading, because HDFN does not
          cause it.
      selected_evidence:
        snippet: The diagnosis of newborn-onset hTTP should be considered because HDFN does not cause
          severe thrombocytopenia, which might be effectively treated with recombinant ADAMTS13.
        supports: SUPPORT
