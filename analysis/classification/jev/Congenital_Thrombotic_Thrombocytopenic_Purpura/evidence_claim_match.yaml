      assertion_type: Biochemical
      assertion:
        name: Plasma ADAMTS13 activity
        notes: The defining laboratory abnormality. Severe deficiency is activity at or below 10% of normal;
          many cTTP patients are below 1%. Recombinant ADAMTS13 restores mean maximum activity to approximately
          101% of normal, against 19% with plasma-derived standard therapy — a fivefold difference that
          is the pharmacodynamic basis for the trial result.
      selected_evidence:
        snippet: ADAMTS13 activity was <1% in 18 of 20 homozygous, but in only 8 of 14 compound heterozygous
          carriers
        supports: SUPPORT
