            activity, reported alongside the founder-mutation haplotype study.
        notes: 'Biallelic loss-of-function variants in ADAMTS13 cause cTTP. The mutational spectrum is
          broad and largely private: 98 different variants were found across 123 registry patients. Variants
          abolish or severely reduce VWF-cleaving protease activity, and prespacer-domain variants are
          associated with earlier, childhood onset.'
