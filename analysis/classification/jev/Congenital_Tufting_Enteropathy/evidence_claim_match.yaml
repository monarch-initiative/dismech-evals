          term:
            id: GO:0034109
            label: homotypic cell-cell adhesion
          modifier: DECREASED
        locations:
        - preferred_term: Small intestine
          term:
            id: UBERON:0002108
            label: small intestine
      selected_evidence:
        snippet: Immunohistochemistry and Western blot of patient intestinal tissue revealed decreased
          expression of EpCAM.
        supports: SUPPORT
