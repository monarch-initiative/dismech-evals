    claim:
      about:
        disease:
          name: Congenital Tufting Enteropathy
          disease_term:
            preferred_term: congenital tufting enteropathy
            term:
              id: MONDO:0013184
              label: congenital diarrhea 5 with tufting enteropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Epithelial Dysplasia and Focal Tuft Formation
        conforms_to: enterocyte_polarity_trafficking_failure#Abnormal Villus Architecture
        description: 'The morphological signature that names the disease. Loss of EpCAM-dependent adhesion
          at bicellular junctions shifts the mechanical balance of the epithelium: myosin IIa/IIb accumulates
          at tricellular junctions, which become hypercontractile, while the apical domain of individual
          cells expands abnormally. The result is focal crowding of disorganised enterocytes at the villus
          tips forming teardrop-shaped "tufts", on a background of partial or total villous atrophy and
          crypt hyperplasia, characteristically without inflammatory infiltration. Basement-membrane abnormalities
          (increased heparan sulfate proteoglycan and collagen IV, decreased laminin) and abnormal alpha-2-beta-1
          integrin distribution accompany the dysplasia.'
        role: effector
        biological_scale: TISSUE
        cell_types:
        - preferred_term: Small-intestinal enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        locations:
        - preferred_term: Small intestine
          term:
            id: UBERON:0002108
            label: small intestine
      selected_evidence:
        snippet: The loss of EpCAM-dependent cell-cell adhesion at bicellular junctions in CTE leads to
          tricellular junction hypercontractility due to accumulation of myosin IIa/IIb.
        supports: SUPPORT
    origin:
