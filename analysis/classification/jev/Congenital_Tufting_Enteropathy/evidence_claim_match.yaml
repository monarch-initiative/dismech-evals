              label: congenital diarrhea 5 with tufting enteropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Loss of Absorptive and Ion-Transport Function
        conforms_to: enterocyte_polarity_trafficking_failure#Loss of a Functionally Polarized Absorptive
          Epithelial Surface
        description: The functional arm, running in parallel with the morphological one and explaining
          why the diarrhea of CTE has both a secretory and an osmotic component. Ion transporters are
          differentially affected - NKCC1 is mislocalized and reduced while CFTR is unchanged, and NHE3
          is affected in murine models - which together with tight-junction loss accounts for the secretory
          component. Separately, the glucose transporters SGLT1 and GLUT2 and the brush-border glycoside
          hydrolases (maltase, sucrase, lactase) are disrupted, which accounts for the osmotic component
          and for the compromised caloric uptake driving weight loss. This dual mechanism is why enteral
          feeding worsens CTE and why parenteral nutrition is usually the only reliable route.
        role: effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Small-intestinal enterocyte
          term:
            id: CL:0000584
            label: enterocyte
        biological_processes:
        - preferred_term: Intestinal absorption
          term:
            id: GO:0050892
            label: intestinal absorption
          modifier: DECREASED
      selected_evidence:
        snippet: Alteration in expression and localization of ion transporters and tight junction proteins
          explains the secretory nature of diarrhea found in CTE, whereas changes in glucose transporters
          explain osmotic diarrhea seen in these patients
        supports: SUPPORT
