              label: congenital diarrhea 5 with tufting enteropathy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Apical Junctional Complex Disassembly and Barrier Failure
        conforms_to: enterocyte_polarity_trafficking_failure#Loss of a Functionally Polarized Absorptive
          Epithelial Surface
        description: 'The rate-limiting step. EpCAM''s transmembrane and intracellular regions recruit
          claudin-7 to the tight junction, so loss of EpCAM substantially reduces claudin-7 at the junction
          and prevents normal tight-junction formation. Other claudins (2, 3, 15) and the tight-junction
          proteins ZO-1 and occludin are also reduced. Because adherens junctions govern tight-junction
          assembly, the whole apical junctional complex is destabilised, and with it epithelial barrier
          function and the apical-basal polarity that the complex maintains. Claudin-15 loss is of particular
          functional consequence: it mediates paracellular sodium permeability, whose failure impairs
          the sodium-coupled glucose absorption that normally drives fluid uptake.'
        role: central_effector
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: Intestinal epithelial cell
          term:
            id: CL:0002563
            label: intestinal epithelial cell
        biological_processes:
        - preferred_term: Tight junction assembly
          term:
            id: GO:0120192
            label: tight junction assembly
          modifier: DECREASED
        cellular_components:
        - preferred_term: Tight junction
          term:
            id: GO:0070160
            label: tight junction
      selected_evidence:
        snippet: In CTE, the absence of EpCAM substantially reduces the recruitment of claudin-7 to TJs,
          leading to loss of TJ formation.
        supports: SUPPORT
