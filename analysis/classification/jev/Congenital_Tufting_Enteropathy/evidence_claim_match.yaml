      assertion_type: Pathophysiology
      assertion:
        name: Loss of Functional EpCAM at the Epithelial Cell Surface
        genes:
        - preferred_term: EPCAM
          term:
            id: hgnc:11529
            label: EPCAM
        - preferred_term: SPINT2
          term:
            id: hgnc:11247
            label: SPINT2
        conforms_to: enterocyte_polarity_trafficking_failure#Loss of Junctional Adhesion Machinery
        description: 'The initiating lesion. EpCAM is a transmembrane glycoprotein localized to the tight
          junctions, adherens junctions and lateral membrane of intestinal epithelial cells. Biallelic
          EPCAM variants reduce its abundance or mislocalize it, and the syndromic SPINT2 form reaches
          the same endpoint indirectly: without HAI-2 to restrain matriptase, EpCAM is proteolytically
          depleted. The node is therefore defined by loss of functional EpCAM at the cell surface, not
          by the identity of the mutated gene - which is why the two genotypes produce indistinguishable
          intestinal histology.'
        role: trigger
        biological_scale: MOLECULAR
        cell_types:
        - preferred_term: Intestinal epithelial cell
          term:
            id: CL:0002563
            label: intestinal epithelial cell
        biological_processes:
