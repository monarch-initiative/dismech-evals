        rationale: 'It has been proposed that NAD deficiency is a pleiotropic mechanism uniting VACTERL,
          limb-body wall complex, OEIS complex, MURCS, sirenomelia and others. The proposal is explicitly
          a hypothesis, and its author states that no confirmatory experimental studies in humans exist.
          Recording it as an open question rather than as background is the honest treatment: if it were
          true, the scope of this entry would be considerably larger than three genes.'
