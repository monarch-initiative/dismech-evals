              label: congenital vertebral-cardiac-renal anomalies syndrome
        context: []
      assertion_type: Subtype
      assertion:
        name: VCRL3
        display_name: Vertebral, cardiac, renal, and limb defects syndrome 3 (NADSYN1)
        description: Caused by biallelic NADSYN1 variants that abolish NAD synthetase 1, the terminal
          step shared by the de novo and Preiss-Handler routes. Because the block is downstream of the
          point at which dietary nicotinic acid enters, nicotinic acid is predicted not to rescue a NADSYN1-null
          individual. That vitamer specificity was shown in Nadsyn1-null mice and has not been tested
          in humans. This is the most phenotypically variable subtype, spanning prenatal lethality to
          individuals with no malformation at all.
        subtype_term:
          preferred_term: vertebral, cardiac, renal, and limb defects syndrome 3
          term:
            id: MONDO:0030077
            label: vertebral, cardiac, renal, and limb defects syndrome 3
        genes:
        - preferred_term: NADSYN1
          term:
            id: hgnc:29832
            label: NADSYN1
      selected_evidence:
        snippet: we present five individuals from four unrelated families, individuals who share similar
          phenotypes with disease-causal bi-allelic variants in NADSYN1, encoding NAD synthetase 1, the
          final enzyme of the nicotinamide adenine dinucleotide (NAD) de novo synthesis pathway
        supports: SUPPORT
    origin:
