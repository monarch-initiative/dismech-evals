            term:
              id: MONDO:0020831
              label: congenital vertebral-cardiac-renal anomalies syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Insufficient Maternal NAD Precursor Provision
        description: NAD available to the conceptus depends on maternal circulating tryptophan and vitamin
          B3 vitamers, which reach the embryo via the yolk sac before the embryonic liver is functional.
          Low maternal precursor supply lowers embryonic NAD independently of the embryo's own genotype,
          and is the environmental arm of the gene-environment interaction that sets phenotype severity.
        biological_scale: ORGANISM
      selected_evidence:
        snippet: C57BL/6J wild-type mice had offspring exhibiting similar malformations when their supply
          of the NAD precursors tryptophan and vitamin B3 in the diet was restricted during pregnancy.
