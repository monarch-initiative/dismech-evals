        name: Impaired Somitogenesis
        description: Vertebrae and ribs form from somites budding sequentially off the presomitic mesoderm
          during weeks 4 to 6 of human gestation. NAD deficiency during this window perturbs segmentation,
          producing the hemivertebrae, vertebral fusions and rib anomalies characteristic of the disorder.
          The lesion is in the metabolic substrate the forming somites depend on rather than in the segmentation
          clock itself.
        biological_scale: TISSUE
        biological_processes:
