        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: human_efficacy_of_antenatal_b3_prevention
        kind: KNOWLEDGE_GAP
        prompt: Does periconceptional and gestational vitamin B3 supplementation prevent congenital NAD
          deficiency disorder in an at-risk human pregnancy?
        rationale: 'Prevention in mice is well established and the mechanism is clear, but no trial or
          observational cohort has tested whether supplementation in a subsequent pregnancy after an affected
          child prevents recurrence. The only human data are population-level: a meta-analysis of 14 case-control
          studies associates insufficient maternal niacin intake with congenital anomalies in general
          (PMID:34748060), which is a different and much weaker claim. The gap matters because the intervention
          is cheap and low-risk while the outcome it would prevent is often lethal, and because families
          are being counselled now on mouse data alone. It is also unusually hard to close, since the
          disorder is rare enough that a conventional randomized trial is unlikely to be feasible.'
        attaches_to:
        - treatments#Antenatal NAD precursor supplementation
        - pathophysiology#Embryonic NAD Deficiency
      selected_evidence:
        snippet: Additional clinical trials are needed before accurate dosage recommendations required
          to prevent CNDD-dependent malformation can be made.
        supports: SUPPORT
