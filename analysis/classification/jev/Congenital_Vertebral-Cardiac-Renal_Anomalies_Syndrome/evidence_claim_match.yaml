        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mouse_diet_conditionality_vs_human_ascertainment
        kind: HUMAN_MODEL_MISMATCH
        prompt: Does the mouse dependence of the CNDD phenotype on maternal dietary NAD precursor restriction
          hold in humans, whose background vitamin B3 intake is generally higher and often fortified?
        rationale: In every mouse model the malformation phenotype is conditional on a B3-restricted maternal
          diet; null animals on a replete diet are largely protected. Human CNDD patients, by contrast,
          are ascertained without any documented maternal dietary deficiency. Either human de novo synthesis
          contributes a larger share of embryonic NAD than the mouse experiments imply, or unmeasured
          variation in maternal precursor status is doing work that nobody has quantified. Which of these
          is true determines whether maternal nutritional assessment belongs in the counselling of an
          at-risk family, so this is not merely a modelling curiosity.
        attaches_to:
        - pathophysiology#Insufficient Maternal NAD Precursor Provision
        - animal_models#Haao-null mouse
      selected_evidence:
        snippet: C57BL/6J wild-type mice had offspring exhibiting similar malformations when their supply
          of the NAD precursors tryptophan and vitamin B3 in the diet was restricted during pregnancy.
        supports: SUPPORT
    origin:
