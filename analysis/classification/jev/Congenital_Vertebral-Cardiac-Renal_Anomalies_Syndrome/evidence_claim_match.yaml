      assertion_type: DifferentialDiagnosis
      assertion:
        name: Hydroxykynureninuria without malformation
        description: KYNU variants that leave residual kynureninase activity produce the biochemical picture
          of this disorder, hydroxykynureninuria with xanthurenic aciduria, in individuals who have no
          congenital malformations. It is the same gene and the same metabolic block, separated only by
          how much enzyme is left, which is why a raised xanthurenic acid alone does not establish CNDD.
          The cited review does not report the zygosity of the reported brothers' variant, so this entry
          does not assert it; the mechanistic claim it does make is about residual enzyme activity, not
          about allele configuration.
      selected_evidence:
        snippet: Christensen et al. described two brothers with a missense variant in KYNU, resulting
          in a threonine to alanine amoinoacid exchange (p.Thr198Ala), presenting with hydroxykynureninuria
          and xanthurenic aciduria but without congenital malformations
        supports: SUPPORT
