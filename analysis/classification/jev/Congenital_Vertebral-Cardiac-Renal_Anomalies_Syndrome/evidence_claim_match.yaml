        - path: /has_subtypes/2
          value:
            name: VCRL3
            display_name: Vertebral, cardiac, renal, and limb defects syndrome 3 (NADSYN1)
            description: Caused by biallelic NADSYN1 variants that abolish NAD synthetase 1, the terminal
              step shared by the de novo and Preiss-Handler routes. Because the block is downstream of
              the point at which dietary nicotinic acid enters, nicotinic acid is predicted not to rescue
              a NADSYN1-null individual. That vitamer specificity was shown in Nadsyn1-null mice and has
              not been tested in humans. This is the most phenotypically variable subtype, spanning prenatal
              lethality to individuals with no malformation at all.
            subtype_term:
              preferred_term: vertebral, cardiac, renal, and limb defects syndrome 3
              term:
                id: MONDO:0030077
                label: vertebral, cardiac, renal, and limb defects syndrome 3
            genes:
            - preferred_term: NADSYN1
              term:
                id: hgnc:29832
                label: NADSYN1
          role: subtype
      assertion_type: Phenotype
      assertion:
        category: Dermatological
        name: Pellagra-like dermatitis
        subtype: VCRL3
        description: A postnatal, life-threatening manifestation reported in two siblings with complete
          loss-of-function NADSYN1 variants. Unlike the malformations, which are fixed in utero, this
          is an ongoing consequence of continuing NAD deficiency and was prevented by nicotinamide supplementation.
          It is the one place in the cited literature where supplementation produced a clinical rather
          than a biochemical benefit in a patient.
        phenotype_term:
          preferred_term: pellagra-like dermatitis
          term:
            id: HP:0011123
            label: Inflammatory abnormality of the skin
      selected_evidence:
        snippet: Both siblings, however, experienced previously unseen life-threatening episodes of pellagra-like
          dermatitis, a characteristic postnatal consequence of NAD deficiency (15) that has not been
          reported previously in NADSYN1 deficiency.
        supports: SUPPORT
