  9fa7149c93c7bc5b16235b4c7717c80c48bbfec2b66574d6871e28c306f36122:
    claim:
      about:
        disease:
          name: Congenital Vertebral-Cardiac-Renal Anomalies Syndrome
          disease_term:
            preferred_term: congenital vertebral-cardiac-renal anomalies syndrome
            term:
              id: MONDO:0020831
              label: congenital vertebral-cardiac-renal anomalies syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Kynurenine Pathway Intermediate Accumulation
        description: 'Metabolites immediately upstream of the enzymatic block accumulate and spill into
          plasma and urine. The identity of the accumulating species is gene-specific, which is what makes
          the circulating NAD metabolome diagnostically informative: HAAO loss raises 3-hydroxyanthranilic
          acid, KYNU loss raises 3-hydroxykynurenine and its transamination product xanthurenic acid,
          and NADSYN1 loss raises the terminal precursor deamido-NAD (nicotinate adenine dinucleotide).'
        biological_scale: MOLECULAR
        chemical_entities:
        - preferred_term: 3-hydroxy-L-kynurenine
          term:
            id: CHEBI:17380
            label: 3-hydroxy-L-kynurenine
        - preferred_term: 3-hydroxyanthranilic acid
          term:
            id: CHEBI:15793
            label: 3-hydroxyanthranilic acid
        - preferred_term: deamido-NAD (nicotinate adenine dinucleotide)
          term:
            id: CHEBI:18304
            label: deamido-NAD(+)
        notes: No single biological_processes descriptor fits this node. Quinolinate biosynthesis is decreased
          in the HAAO and KYNU subtypes but not in VCRL3, where the NADSYN1 block sits downstream of quinolinate,
          so a process-level DECREASED tag scoped to the whole node would be wrong for a third of the
          disorder.
      selected_evidence:
        snippet: Increased xanthurenic acid excretion in the urine confirmed the genetic diagnosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
