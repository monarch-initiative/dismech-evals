            term:
              id: CHEBI:17154
              label: nicotinamide
          - preferred_term: nicotinamide mononucleotide
            term:
              id: CHEBI:50383
              label: nicotinamide mononucleotide
      selected_evidence:
        snippet: We reproduced NADSYN1-dependent CNDD in mice and assessed various maternal NAD precursor
