        name: Antenatal NAD precursor supplementation
        description: 'Vitamin B3 supplementation before and during a subsequent at-risk pregnancy is the
          only intervention that addresses the mechanism rather than its consequences, and it is preventive
          rather than curative: it must be in place during organogenesis, which is largely complete before
          most affected pregnancies are recognized. The prevention evidence is from mouse models; no human
          trial has shown prevention of CNDD in an at-risk pregnancy, so this is a mechanistically motivated
          recommendation, not a proven one. The choice of vitamer is likewise a mouse result: in Nadsyn1-null
          mice nicotinic acid was not sufficient and amidated precursors were required, and that has not
          been tested in humans.'
        therapeutic_modality: SMALL_MOLECULE
        treatment_term:
          preferred_term: nutritional supplementation with an NAD precursor
          term:
            id: NCIT:C15433
