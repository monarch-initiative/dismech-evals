        description: All three CNDD genocopies require biallelic loss-of-function variants. Heterozygous
          carriers are clinically unaffected under adequate dietary NAD precursor intake, but mouse data
          show that maternal heterozygosity combined with dietary vitamin B3 restriction is sufficient
          to cause malformations, so carrier status is not phenotypically inert under nutritional stress.
      selected_evidence:
        snippet: CNDD is inherited in an autosomal recessive manner.
