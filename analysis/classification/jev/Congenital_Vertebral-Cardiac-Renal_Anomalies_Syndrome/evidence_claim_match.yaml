        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: unestablished_downstream_effectors_of_embryonic_nad_loss
        kind: KNOWLEDGE_GAP
        prompt: Which NAD-dependent processes actually fail in the embryo when NAD falls, and why do they
          fail in these organs and not others?
        rationale: 'Every node in this entry below Embryonic NAD Deficiency is an organ-level description.
          The layer that would connect them, the NAD-dependent effectors in a proliferating embryonic
          progenitor (PARP-mediated ADP-ribosylation, sirtuin signalling, redox and ATP supply), is not
          curated here because it has not been established. It also has to explain a selectivity problem:
          NAD is required in every cell, yet the malformations fall on a specific and reproducible set
          of organs. Until this is resolved, the pathograph explains that NAD deficiency causes the malformations,
          not how, and any downstream node here should be read as a description rather than a mechanism.'
        attaches_to:
        - pathophysiology#Embryonic NAD Deficiency
        - phenotypes#Developmental delay or intellectual disability
      selected_evidence:
        snippet: However, the mechanism by which NAD+ deficiency causes CNDD developmental anomalies has
          not been determined, nor has NAD+ deficiency been definitively linked to VACTERL association.
        supports: SUPPORT
