              label: Zika virus congenital syndrome
        context: []
      assertion_type: Transmission
      assertion:
        name: Vertical transmission from mother to fetus
        description: 'Congenital Zika syndrome is acquired in utero. Maternal infection is followed by
          viraemia and transplacental passage of the virus to the fetus, where it is neurotropic for cortical
          progenitors. The route into this entry is therefore vertical, not vector-borne: the mosquito
          bite that infects the mother is a step upstream in the maternal infection, and is not how the
          fetus is infected. Placental work shows the interface the virus crosses, spreading from decidua
          to chorionic villi and amniochorionic membranes.'
      selected_evidence:
        snippet: In this report, we describe the case of an expectant mother who had a febrile illness
          with rash at the end of the first trimester of pregnancy while she was living in Brazil.
        supports: SUPPORT
