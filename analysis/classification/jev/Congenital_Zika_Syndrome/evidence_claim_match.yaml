  4f06eca0bc087e2753d90d1ad44fd9a0b8d71be50c0319e5f872964bf86331a9:
    claim:
      about:
        disease:
          name: Congenital Zika Syndrome
          disease_term:
            preferred_term: Zika virus congenital syndrome
            term:
              id: MONDO:0000890
              label: Zika virus congenital syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Tunneling Nanotube-Mediated Intercellular Viral Spread
        biological_scale: CELLULAR
        description: 'ZIKV induces tunneling nanotubes (TNTs) — actin-rich, membrane-bounded intercellular
          conduits that carry viral components directly from cell to cell, bypassing the extracellular
          space. TNT-forming capacity maps to residues 40-52 of the viral nonstructural protein NS1: an
          engineered TNT-deficient mutant (ZIKVΔTNT) disseminates markedly less to maternal and fetal
          tissues than TNT-competent virus across multiple pregnancy models. Because transfer through
          a TNT is shielded from the extracellular compartment, this route also appears to let the virus
          persist in the face of a maternal type III interferon (IFN-lambda) response, implicating TNTs
          in immune evasion as well as in spread.'
        biological_processes:
        - preferred_term: tunneling nanotube formation
          term:
            id: GO:0120031
            label: plasma membrane bounded cell projection assembly
          modifier: INCREASED
        - preferred_term: TNT-shielded escape from maternal type III interferon control
          term:
            id: GO:0042783
            label: symbiont-mediated evasion of host immune response
          modifier: INCREASED
        - preferred_term: maternal type III interferon (IFN-lambda) signaling at the maternal-fetal interface
          term:
            id: GO:0038196
            label: type III interferon-mediated signaling pathway
        notes: No ontology term exists for the tunneling nanotube itself in GO, CL, or UBERON, so the
          structure is carried as a free-text `preferred_term` over the closest available parent process
          rather than being force-bound to `cytoneme` (GO:0035230) or `intercellular bridge` (GO:0045171),
          which name different structures. Recorded as an OBO gap. All evidence for this node is mouse
          in vivo; TNTs have not been demonstrated in human placental tissue in vivo (see the discussions
          block).
      selected_evidence:
        snippet: We previously showed that ZIKV induces tunneling nanotubes (TNTs), actin-rich intercellular
          conduits that enable direct cell-to-cell transfer of viral components.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
