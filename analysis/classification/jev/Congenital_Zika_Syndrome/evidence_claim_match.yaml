        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neurotropic Entry into Fetal Neural Progenitors
        biological_scale: CELLULAR
        description: 'Once in the fetal brain, ZIKV is neurotropic for radial glia and neural progenitor
          cells. Candidate entry receptors enriched on these cells — notably the TAM-family receptor tyrosine
          kinase AXL, which is highly expressed by human radial glia in the developing cortex — are thought
          to mediate or facilitate viral attachment and entry, establishing infection of the founder progenitor
          population during corticogenesis. Neuropathology confirms the target: infection of progenitor
          cells at the germinal matrix has been demonstrated in human material.

          AXL appears on both sides of this entry''s transfer/entry split, and the duplication is real
          biology rather than a curation artefact: the same TAM-family cofactors are used at the placenta
          and on radial glia. They are nonetheless different claims about different cells in different
          organs, and are curated on the node each belongs to.'
        conforms_to: viral_neural_progenitor_cytopathy#Fetal Brain Viral Exposure and Progenitor Infection
        cell_types:
        - preferred_term: Radial glial cell
          term:
            id: CL:0000681
            label: radial glial cell
        - preferred_term: Neural progenitor cell
          term:
            id: CL:0011020
            label: neural progenitor cell
        biological_processes:
        - preferred_term: Viral entry into host cell
          term:
            id: GO:0046718
            label: symbiont entry into host cell
          modifier: INCREASED
        - preferred_term: Viral genome replication
          term:
            id: GO:0019079
            label: viral genome replication
          modifier: INCREASED
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: we found that the candidate viral entry receptor AXL is highly expressed by human radial
          glial cells, astrocytes, endothelial cells, and microglia in developing human cortex and by
          progenitor cells in developing retina.
        supports: SUPPORT
