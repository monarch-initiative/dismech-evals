          of the mouse placental-injury phenotype transfers to human congenital Zika disease?
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        attaches_to:
        - pathophysiology#Tunneling Nanotube-Mediated Intercellular Viral Spread
        - pathophysiology#Placental Infection
        - pathophysiology#Placental Architectural and Functional Disruption
        - pathophysiology#Fetal Growth Restriction
        - pathophysiology#Transplacental Viral Transfer to the Fetal Compartment
        rationale: 'The TNT arm of transplacental dissemination is established entirely in mouse pregnancy
          models, by comparing a TNT-competent virus with an NS1 residue-40-52 TNT-deficient mutant. Two
          distinct translational questions follow. First, TNTs have not been demonstrated to carry ZIKV
          between cells in human placental tissue in vivo, so the mechanism is a strong candidate rather
          than an established human route. Second, and more concretely, the architectural readout does
          not transfer at all: the junctional zone and labyrinth are compartments of the rodent placenta
          with no direct human homolog, so "altered junctional-to-labyrinth architecture" cannot be restated
          as a human placental finding. The nearest human comparison points the other way: in full-term
          placentas from three ZIKV-infected women, viral NS3 antigen localized to Hofbauer cells while
          the placentas showed no anatomic defects (PMID:31709049, the publication behind the GSE139181
          dataset already curated in this entry) — a small series, and not a test of the TNT mechanism,
          but not obviously the same picture either. Fetal growth restriction is therefore curated as
          an ORGANISM-scale pathophysiology node carrying model-organism evidence, and is deliberately
          absent from `phenotypes:`, which would require human evidence.'
        proposed_experiments:
        - experiment_id: exp_czs_tnt_human_placenta
          name: Detection of ZIKV-laden tunneling nanotubes in human placental explants
          description: Live imaging and correlative electron microscopy of ZIKV-infected primary human
            trophoblast and placental explant cultures, scoring actin-rich intercellular conduits carrying
            viral components, with the NS1 residue-40-52 TNT-deficient mutant as the negative control.
      selected_evidence:
        snippet: Although ZIKV NS3 antigens co-localised to placental Hofbauer cells, the placentas showed
          no anatomic defects.
        supports: SUPPORT
