      assertion_type: DifferentialDiagnosis
      assertion:
        name: Other congenital (TORCH) infections
        description: Congenital cytomegalovirus and toxoplasmosis produce overlapping intracranial calcification,
          microcephaly, chorioretinal disease and hearing loss, and are the principal differential. The
          pattern of calcification and the presence of arthrogryposis help, but neither is decisive, so
          discrimination rests on laboratory confirmation of the agent rather than on imaging phenotype.
        distinguishing_features:
        - Arthrogryposis with normal joints and neurogenic electromyographic findings is characteristic
          of CZS and is not a usual feature of congenital CMV or toxoplasmosis.
        - Sensorineural hearing loss occurs in CZS at a frequency similar to that seen with other congenital
          viral infections, so it does not discriminate between them.
      selected_evidence:
        snippet: which is similar to that seen in association with other congenital viral infections
        supports: SUPPORT
