  5b6935d2375268e0366618f11774a7704d5673258cb6698ee368a3d0f5ac7852:
    claim:
      about:
        disease:
          name: Congenital Zika Syndrome
          disease_term:
            preferred_term: Zika virus congenital syndrome
            term:
              id: MONDO:0000890
              label: Zika virus congenital syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Transplacental Viral Transfer to the Fetal Compartment
        biological_scale: TISSUE
        description: 'Crossing the maternal-fetal interface is a transport step, distinct from what the
          virus does once it arrives. Human placental work identifies more than one route rather than
          a single breach: ZIKV productively infects placental macrophages (Hofbauer cells) and, less
          efficiently, cytotrophoblasts in term villous tissue, and separately infects cytotrophoblasts,
          endothelial cells, fibroblasts and Hofbauer cells in chorionic villi together with amniotic
          epithelial cells and trophoblast progenitors in amniochorionic membranes. Those cells express
          the Axl, Tyro3 and TIM1 entry cofactors, so the same TAM-family biology operates here as in
          the fetal brain — but on different cells, in a different organ, supporting a different claim.
          Curating them as one node conflated the two.

          Transfer is not uniformly permissive, and the restriction side explains the timing dependence
          the rest of this entry rests on. Primary human trophoblasts from full-term placentas are refractory
          to ZIKV and constitutively release type III interferon (IFN-lambda1) that protects both trophoblast
          and non-trophoblast cells, so virus reaching the fetal compartment must evade or bypass that
          barrier. Consistent with a barrier that strengthens as gestation proceeds, mid-gestation amniotic
          epithelial cells support higher viral titres than late-gestation cells.'
        cell_types:
        - preferred_term: Hofbauer cell (placental macrophage)
          term:
            id: CL:3000001
            label: Hofbauer cell
        - preferred_term: Cytotrophoblast
          term:
            id: CL:0000523
            label: mononuclear cytotrophoblast cell
        biological_processes:
        - preferred_term: type III interferon production by trophoblast
          term:
            id: GO:0034343
            label: type III interferon production
        locations:
        - preferred_term: placenta
          term:
            id: UBERON:0001987
            label: placenta
        mechanism_confidence: ESTABLISHED
      selected_evidence:
        snippet: Our results suggest a mechanism for intrauterine transmission in which ZIKV gains access
          to the fetal compartment by directly infecting placental cells and disrupting the placental
          barrier.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
