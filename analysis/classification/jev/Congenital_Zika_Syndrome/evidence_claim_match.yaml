        biological_scale: ORGANISM
        description: 'Absent or greatly reduced fetal movement, the consequence of losing spinal motor
          neurons. This node exists because the resulting arthrogryposis is neurogenic rather than articular,
          and the distinction is testable: in the reported series, high-definition ultrasonography of
          the joints showed no abnormality, while needle electromyography showed motor unit remodeling
          and reduced recruitment, and spinal MRI showed apparent cord thinning with reduced ventral roots.
          The joints are normal; the nerves supplying them are not.'
