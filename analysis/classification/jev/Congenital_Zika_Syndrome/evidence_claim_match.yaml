      assertion:
        category: Neurologic
        name: Seizures
        frequency: FREQUENT
        description: 'Epilepsy is one of the two dominant post-natal complications of CZS (the other is
          dysphagia) and is a direct clinical consequence of the cortical malformation curated at the
          Impaired Neurogenesis and Congenital Cortical Malformation node. Its phenotype is age-structured
          rather than uniform: onset is typically after the third month, most often as infantile spasms,
          with focal epilepsy predominating in the second year. Seizure control is poor, which is why
          this is a driver of long-term care need and not only a diagnostic feature.'
        phenotype_term:
          preferred_term: Seizure
          term:
            id: HP:0001250
            label: Seizure
          onset:
            onset_category: INFANTILE
      selected_evidence:
        snippet: Seizures typically began after the third month of life, usually as infantile spasms,
          with atypical electroencephalographic abnormalities.
        supports: SUPPORT
