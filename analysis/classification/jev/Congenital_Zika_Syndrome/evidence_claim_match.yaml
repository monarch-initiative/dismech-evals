      assertion_type: Discussion
      assertion:
        discussion_id: gap_czs_ns1_tnt_therapeutic_target
        prompt: Is the NS1 determinant of tunneling-nanotube formation (residues 40-52) a tractable antiviral
          target for preventing transplacental ZIKV transmission, and does the same TNT route operate
          in other vertically transmitted viruses?
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - pathophysiology#Tunneling Nanotube-Mediated Intercellular Viral Spread
        rationale: 'A discrete viral protein determinant whose loss reduces dissemination, placental injury,
          and fetal growth restriction without abolishing viral viability is an unusually clean target
          hypothesis, and it addresses the transmission step rather than the downstream progenitor cytopathy
          — a much wider therapeutic window than the one the existing therapy gap describes. Nothing here
          has been tested as an intervention: the evidence is a genetically engineered mutant virus, not
          a drug or an antibody, and no NS1-directed agent has been shown to block TNT formation. The
          authors also raise, without testing, whether TNTs matter for other vertically transmitted or
          emerging viruses; that generalization has no evidence in this entry and should not be curated
          onto other disease entries on the strength of this paper alone.'
      selected_evidence:
        snippet: These findings identify TNTs as a previously underappreciated pathway of viral transmission
          during pregnancy and suggest new therapeutic targets.
        supports: SUPPORT
