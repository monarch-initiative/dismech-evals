            name: Dengue-immune cynomolgus macaque ZIKV pregnancy model
            species: Cynomolgus macaque
            genotype: Wild type, DENV-immune prior to ZIKV challenge
            publication: PMID:37878671
            description: 'A nonhuman primate model of vertical transmission on a developmental timeline
              close to the human one, used to ask why some ZIKV-exposed fetuses are severely affected
              and others are not. Its answer is a maternal immunological one that this entry otherwise
              has no account of: prior dengue immunity worsens fetal outcome.'
          role: ancestor
      assertion_type: ModelMechanismLink
      assertion:
        target: Impaired Neurogenesis and Congenital Cortical Malformation
        relationship: RECAPITULATES
        fidelity: HIGH
        description: Fetuses of DENV-immune macaques infected with ZIKV in early pregnancy developed significantly
          more severe CZS than naive controls, with reduced cortical thickness and increased neuronal
          death, haemorrhage, cellular infiltration, calcification and lissencephaly — the same lesion
          set reported in human postmortem material.
        limitations: The enhancement is demonstrated in macaques and has not been shown to operate in
          human pregnancy, so it is a candidate explanation for the variable human severity rather than
          an established one. The model also cannot separate antibody-dependent enhancement from other
          consequences of prior flavivirus exposure.
        readouts:
        - name: Fetal head circumference and biparietal diameter by serial ultrasound
          target: Impaired Neurogenesis and Congenital Cortical Malformation
          direction: DECREASED
          interpretation: In vivo growth measurement across gestation, directly comparable to the human
            antenatal measure.
        - name: Fetal brain histopathology
          target: Impaired Neurogenesis and Congenital Cortical Malformation
          direction: INCREASED
          interpretation: The lesion set matches human CZS neuropathology, which is what makes the model
            informative rather than merely a growth phenotype.
      selected_evidence:
        snippet: We found significantly increased severity of congenital Zika syndrome (CZS) in fetuses
          of DENV-immune cynomolgus macaques infected with ZIKV in early pregnancy compared with naïve
          controls, which occurred despite no effect on maternal ZIKV infection or antibody responses.
        supports: SUPPORT
