              label: congestive splenomegaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Hypersplenism
        description: 'The enlarged, congested spleen excessively sequesters and destroys circulating blood
          cells. Platelets are most affected due to splenic pooling, but red blood cells and white blood
          cells are also trapped and destroyed, leading to varying degrees of pancytopenia. Reduced hepatic
          thrombopoietin production in chronic liver disease further compounds the thrombocytopenia. Increased
          splenic macrophage activity and immune-mediated mechanisms accelerate blood cell destruction.

          '
        cell_types:
        - preferred_term: Platelet
          term:
            id: CL:0000233
            label: platelet
        - preferred_term: Macrophage
          term:
            id: CL:0000235
            label: macrophage
        biological_processes:
        - preferred_term: Erythrocyte Clearance
          term:
            id: GO:0034102
            label: erythrocyte clearance
        - preferred_term: Phagocytosis
          term:
            id: GO:0006909
            label: phagocytosis
      selected_evidence:
        snippet: Splenomegaly is associated with a poor prognosis in cirrhosis and is caused by spleen
          congestion and by enlargement and hyperactivation of splenic lymphoid tissue. Hypersplenism
          can lead to thrombocytopenia caused by increased sequestering and breakdown of platelets in
          the spleen.
        supports: SUPPORT
