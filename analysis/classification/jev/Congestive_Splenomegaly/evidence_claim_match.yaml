              label: congestive splenomegaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Portal and Splenic Venous Congestion
        description: 'Elevated portal venous pressure, most commonly from liver cirrhosis, transmits back
          through the splenic vein to the spleen. As intrahepatic vascular resistance increases (backward
          flow), compensatory splanchnic vasodilation increases portal inflow (forward flow), creating
          a local hyperdynamic state around the spleen. The splenic artery resistance index is selectively
          elevated in cirrhotic patients. Splenic vein thrombosis can produce isolated left-sided portal
          hypertension with the same congestion effect.

          '
        cell_types:
        - preferred_term: Splenic Endothelial Cell
          term:
            id: CL:2000053
            label: splenic endothelial cell
        biological_processes:
        - preferred_term: Vasodilation
          term:
            id: GO:0042311
            label: vasodilation
      selected_evidence:
        snippet: The increase in spleen size is followed by an increase in splenic blood flow, which participates
          in portal hypertension actively congesting the portal system.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/2
