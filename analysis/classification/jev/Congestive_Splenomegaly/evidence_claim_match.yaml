          name: Congestive Splenomegaly
          disease_term:
            preferred_term: congestive splenomegaly
            term:
              id: MONDO:0037251
              label: congestive splenomegaly
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Red Pulp Congestion and Fibrosis
        description: 'Chronic venous congestion leads to progressive changes in splenic architecture.
          The red pulp becomes engorged with erythrocytes, and the macrophagic system is activated with
          histiocyte hyperplasia. Reticular fibers increase and myofibroblasts proliferate in the splenic
          cords, driven by oxidative stress and TGF-beta signaling. Over time, diffuse fibrosis develops
          throughout the parenchyma. The degree of fibrosis correlates with severity of thrombocytopenia
          and splenomegaly. Repeated microhemorrhages deposit hemosiderin and calcium, forming characteristic
          Gamma-Gandy bodies.

          '
        cell_types:
        - preferred_term: Erythrocyte
          term:
            id: CL:0000232
            label: erythrocyte
        - preferred_term: Splenic Red Pulp Macrophage
          term:
            id: CL:0000874
            label: splenic red pulp macrophage
        biological_processes:
        - preferred_term: Extracellular Matrix Organization
          term:
            id: GO:0030198
            label: extracellular matrix organization
      selected_evidence:
        snippet: In course of experimental pre-hepatic portal hypertension in the rat, the most important
          histological alterations in the spleen, are represented by pooling of blood in the red pulp,
          activation of the macrophagic system, with hyperplasia of the histiocytes, increase of reticular
          fibers and of subcapsular myo-fibroblasts, and finally by evolution towards a diffuse fibrosis
          all over the parenchyma.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8170720
      reference_title: 'Experimental congestive splenomegaly: histological observations in the rat.'
      evidence_source: MODEL_ORGANISM
      explanation: This experimental model of congestive splenomegaly directly demonstrates the sequence
        of pathological changes from red pulp congestion through macrophage activation to diffuse fibrosis.
