      assertion_type: Pathophysiology
      assertion:
        name: Somatic Polymerase Proofreading Loss and Ultra-Hypermutation
        biological_scale: MOLECULAR
        role: amplifier
        mechanism_confidence: ESTABLISHED
        description: An early somatic mutation in the exonuclease (proofreading) domain of POLE or POLD1
          is frequently acquired and selected in CMMRD high-grade tumours - every ultra-hypermutated tumour
          in the index series carried one. Loss of proofreading on top of absent mismatch repair removes
          both layers of replication-error correction, and mutations then accumulate in a rapid burst
          rather than gradually. The resulting ultra-hypermutant genome (in excess of 100, and in brain
          tumours often over 250, mutations per megabase) is the highest burden recorded in human cancer
          and carries a strand-biased signature attributable to the mutant polymerase.
        molecular_functions:
        - preferred_term: 3'-5' exonuclease activity
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0008408
            label: 3'-5' exonuclease activity
        biological_processes:
        - preferred_term: DNA replication proofreading
          modifier: LOSS_OF_FUNCTION
          term:
            id: GO:0045004
            label: DNA replication proofreading
        genetic_context:
          allele_type: SOMATIC
          variant_origin: SOMATIC
          functional_impact_category: LOSS_OF_FUNCTION
          description: Somatic exonuclease-domain variants in POLE or POLD1 acquired within the tumour,
            on the constitutional biallelic MMR background. These are tumour-restricted second events,
            not part of the inherited genotype.
      selected_evidence:
        snippet: Biallelic mismatch repair deficiency (bMMRD) in tumours is frequently associated with
          somatic mutations in the exonuclease domains of DNA polymerases POLE or POLD1, and results in
          a characteristic mutational profile.
        supports: SUPPORT
