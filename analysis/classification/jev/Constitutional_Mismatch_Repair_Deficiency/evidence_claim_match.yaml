            description: The ultra-hypermutant coding genome produces neoepitopes at a density several
              times higher than in melanoma, lung cancer or sporadic MSI-high gastrointestinal cancer.
              These are presented on MHC and drive CD8-positive T cell recognition, converting even conventionally
              immune-cold tumours such as high-grade glioma into immune-infiltrated lesions. Microsatellite
              insertion-deletion load contributes independently of total mutation burden, which is why
              MS-indels predict response in tumours whose overall burden is only moderately elevated.
