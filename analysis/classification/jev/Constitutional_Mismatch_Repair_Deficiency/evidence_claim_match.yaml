              label: mismatch repair cancer syndrome
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Polymerase Proofreading-Associated Polyposis
        description: 'Germline heterozygous POLE or POLD1 exonuclease-domain variants causing multiple
          colorectal adenomas and early-onset colorectal cancer. The mechanistic mirror image of the somatic
          proofreading loss modelled here: in CMMRD the proofreading defect is acquired in the tumour
          on top of a constitutional mismatch repair defect, whereas in PPAP it is the constitutional
          lesion and mismatch repair is intact. That difference is what the laboratory sees - PPAP tumours
          are hypermutated but microsatellite stable and retain normal MMR protein staining, while CMMRD
          shows constitutional microsatellite instability and MMR protein loss in normal tissue. Inheritance
          is dominant rather than recessive.'
      selected_evidence:
        snippet: we identified specific heterozygous POLE or POLD1 germline variants in several multiple-adenoma
          and/or CRC cases but in no controls
        supports: SUPPORT
