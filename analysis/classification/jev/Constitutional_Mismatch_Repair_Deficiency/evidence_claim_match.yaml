  ee43b0227cee4f3bb084793183ac63278516ac40311385de5ddc672c9e213a07:
    claim:
      about:
        disease:
          name: Constitutional Mismatch Repair Deficiency
          disease_term:
            preferred_term: constitutional mismatch repair deficiency syndrome
            term:
              id: MONDO:0031219
              label: mismatch repair cancer syndrome
        context: []
      assertion_type: Inheritance
      assertion:
        name: Autosomal recessive inheritance
        inheritance_term:
          preferred_term: Autosomal recessive inheritance
          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        penetrance: INCOMPLETE
        penetrance_percentage: 90% cumulative cancer incidence by age 18 years
        expressivity: VARIABLE
        description: 'CMMRD requires two defective alleles of a single mismatch repair gene (homozygous
          or compound heterozygous). Both parents are obligate heterozygous carriers and are managed as
          Lynch syndrome. Consanguinity and endogamy raise the local frequency substantially. Penetrance
          is very high but not formally complete: cumulative cancer incidence reaches 90% by age 18 years,
          and 97% of patients in the largest cohort had developed cancer, so it is recorded as INCOMPLETE
          with a penetrance_percentage of 90 at age 18 rather than COMPLETE. Expressivity is highly variable
          by gene and by variant class - MLH1 and MSH2 biallelic variants give the earliest onset and
          worst survival, PMS2 and MSH6 are later and milder, and hypomorphic alleles can delay first
          cancer into adulthood, producing a Lynch-like presentation.'
      selected_evidence:
        snippet: Constitutional mismatch repair deficiency (CMMRD) syndrome is a distinct childhood cancer
          predisposition syndrome that results from biallelic germline mutations in one of the four MMR
          genes, MLH1, MSH2, MSH6 or PMS2.
        supports: SUPPORT
    origin:
