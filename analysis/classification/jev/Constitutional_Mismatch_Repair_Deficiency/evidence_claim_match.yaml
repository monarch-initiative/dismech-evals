  97c2612e496d90be849c9d1f8f7ad050bc412ba478a56d16d1bcf2886e46f64b:
    claim:
      about:
        disease:
          name: Constitutional Mismatch Repair Deficiency
          disease_term:
            preferred_term: constitutional mismatch repair deficiency syndrome
            term:
              id: MONDO:0031219
              label: mismatch repair cancer syndrome
        context:
        - path: /discussions/0
          value:
            discussion_id: cmmrd_normal_tissue_mmr_kinetics
            kind: KNOWLEDGE_GAP
            status: OPEN
            prompt: Why do CNS, gastrointestinal and lymphoid compartments transform preferentially in
              CMMRD when mismatch repair is absent from every tissue?
            attaches_to:
            - pathophysiology#Constitutional Microsatellite Instability and Mutator Phenotype
            - pathophysiology#Accelerated Multi-Organ Tumorigenesis
            rationale: Constitutional instability is systemic, yet the tumour spectrum is not. Constitutional
              instability scores differ by tissue (gastrointestinal > blood > brain) and rise with age
              within an individual, so the tissue-specific transformation risk is not simply a function
              of measured instability. The determinants - proliferative index of the stem compartment,
              tissue-specific dependence on MMR versus backup pathways, immune surveillance, or the tissue-specific
              probability of acquiring the somatic POLE/POLD1 hit - have not been disentangled. Getting
              this right would sharpen surveillance intervals, which are currently uniform rather than
              risk-weighted by tissue.
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: exp_cmmrd_tissue_resolved_mutation_burden
        name: Clone-resolved mutation burden across matched normal tissues in CMMRD
        description: Measure somatic mutation burden and microsatellite indel load at single-cell or clone-resolved
          depth in matched normal brain, intestinal crypt and haematopoietic compartments from the same
          CMMRD individual, and test whether the compartment with the highest measured instability is
          the compartment that transforms first.
      selected_evidence:
        snippet: In normal cells, MMRDness scores differed between tissues (GI > blood > brain)
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0/proposed_experiments/0
      evidence_path: /discussions/0/proposed_experiments/0/evidence/0
      context_paths:
