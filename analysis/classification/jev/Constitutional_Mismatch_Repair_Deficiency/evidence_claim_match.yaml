  0806f270a7b4d11cd16f05555e9babe04a593a836d80190674c8c7082426959a:
    claim:
      about:
        disease:
          name: Constitutional Mismatch Repair Deficiency
          disease_term:
            preferred_term: constitutional mismatch repair deficiency syndrome
            term:
              id: MONDO:0031219
              label: mismatch repair cancer syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Germline MMR-deficient de novo mouse glioma model (Msh2 or Msh6 loss)
        species: Mouse
        genotype: De novo high-grade glioma with germline or somatic Msh2 or Msh6 loss
        publication: PMID:41433099
        description: 'De novo mouse models of germline and somatic MMR-deficient high-grade glioma, built
          to test which parts of the human MMR-deficient glioma phenotype follow from MMR loss alone.
          The answer was largely negative, which is what makes this model informative: germline MMR deficiency
          accelerated progression from low-grade to high-grade glioma and shortened survival, but did
          so through the tumour immune microenvironment rather than by producing the hypermutation and
          checkpoint sensitivity that define human CMMRD gliomas.'
        modeled_mechanisms:
        - target: Somatic Polymerase Proofreading Loss and Ultra-Hypermutation
          relationship: FAILS_TO_RECAPITULATE
          fidelity: LOW
          description: Loss of Msh2 or Msh6 in mouse glioma did not produce high tumour mutation burden
            or microsatellite instability, and did not confer response to PD-1 blockade. The hypermutation
            that makes human CMMRD gliomas checkpoint-responsive therefore does not follow from MMR loss
            alone in this system.
          limitations: The mouse models carry MMR loss without the somatic POLE or POLD1 exonuclease-domain
            lesion that this node asserts is the source of ultra-hypermutation in human CMMRD tumours,
            so the negative result is consistent with the two-step model curated here rather than a refutation
            of it - but it does mean the model cannot be used to study the hypermutant state or its checkpoint
            sensitivity. The same paper reports the corresponding discordance in human GBM, so this is
            not a purely murine artefact.
          readouts:
          - name: Tumour mutation burden and microsatellite instability in MMR-null mouse glioma
            target: Somatic Polymerase Proofreading Loss and Ultra-Hypermutation
            description: TMB and MSI measured in de novo mouse gliomas after Msh2 or Msh6 loss, with anti-PD-1
              response as the functional readout.
            direction: UNCHANGED
            interpretation: 'A real negative: MMR loss alone leaves mutation burden and microsatellite
              status unchanged, so the ultra-hypermutant phenotype requires the additional somatic proofreading
              lesion.'
        - target: Accelerated Multi-Organ Tumorigenesis
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Germline MMR deficiency accelerated progression from low-grade to high-grade glioma
            and shortened survival, reproducing the accelerated-tumorigenesis consequence in the CNS compartment
            that dominates the human tumour spectrum.
          limitations: Only the CNS arm is modelled, so the multi-organ distribution the node asserts
            is not reproduced, and the effect was driven by the tumour immune microenvironment rather
            than being tumour-cell intrinsic. That is a mechanistically different route to accelerated
            progression from the cell-intrinsic mutation accumulation curated upstream of this node.
          readouts:
          - name: Progression from low-grade to high-grade glioma and survival
            target: Accelerated Multi-Organ Tumorigenesis
            description: Grade progression and overall survival in germline MMR-deficient versus MMR-proficient
              tumour-bearing mice.
            direction: INCREASED
            interpretation: Faster grade progression with shorter survival is the model's counterpart
              of accelerated tumorigenesis, restricted to the CNS.
      selected_evidence:
        snippet: Here, we developed de novo mouse models of germline and somatic MMR-deficient (MMRd)
          HGGs.
        supports: SUPPORT
