      assertion_type: Treatment
      assertion:
        name: Structured Cancer Surveillance Protocol
        description: 'The consensus international surveillance protocol - annual brain MRI, regular upper
          and lower gastrointestinal endoscopy, whole-body MRI and clinical examination - beginning at
          molecular diagnosis. This is the single most effective intervention in CMMRD: five-year survival
          is 90% when the cancer is found asymptomatically against 50% when it presents symptomatically,
          and adherence to full surveillance is associated with four-year survival of 79% against 15%
          for those not under surveillance. Its effectiveness is unevenly distributed: nearly all gastrointestinal
          and other solid tumours and three-quarters of brain cancers are caught asymptomatically, but
          only a small minority of haematological malignancies are. These are non-randomised comparisons
          and are vulnerable to lead-time and ascertainment bias.'
        therapeutic_modality: BEHAVIORAL
        treatment_term:
          preferred_term: cancer screening
          term:
            id: NCIT:C15406
            label: Cancer Screening
      selected_evidence:
        snippet: Patient outcome measured by adherence to the surveillance protocol revealed 4-year OS
          of 79% (95% CI, 54.8 to 90.9) for patients undergoing full surveillance, 55% (95% CI, 28.5 to
          74.5) for partial surveillance, and 15% (95% CI, 5.2 to 28.8) for those not under surveillance
          (P < .0001).
        supports: SUPPORT
