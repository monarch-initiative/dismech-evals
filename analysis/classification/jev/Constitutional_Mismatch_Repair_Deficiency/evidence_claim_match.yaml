        context:
        - path: /discussions/1
          value:
            discussion_id: cmmrd_hypomorphic_penetrance_boundary
            kind: KNOWLEDGE_GAP
            status: OPEN
            prompt: How much residual mismatch repair activity is compatible with an adult-onset, Lynch-like
              phenotype, and where does the CMMRD/Lynch management boundary fall for biallelic carriers
              of hypomorphic variants?
            attaches_to:
            - pathophysiology#Biallelic Germline Mismatch Repair Gene Inactivation
            rationale: Late-onset CMMRD is currently recognised case by case, after constitutional MSI
              testing contradicts an assumed Lynch diagnosis. There is no calibrated relationship between
              residual repair activity and age at first cancer, so a biallelic carrier of two leaky variants
              cannot be assigned to a surveillance schedule on genotype. The two schedules differ substantially
              (annual brain MRI and gastrointestinal endoscopy from early childhood in CMMRD; adult gastrointestinal
              and gynaecological surveillance in Lynch), so the cost of guessing is high in both directions.
          role: ancestor
      assertion_type: Experiment
      assertion:
        experiment_id: exp_cmmrd_hypomorphic_residual_activity_calibration
        name: Calibration of residual mismatch repair activity against age at first cancer
        description: Assay residual mismatch repair activity quantitatively across a series of candidate
          hypomorphic MMR variants (leaky splice and missense alleles) and correlate the measured activity
          with constitutional instability score and age at first cancer, to establish whether residual
          activity predicts the CMMRD-versus-Lynch management boundary.
      selected_evidence:
        snippet: MLH1 c.306G>A was shown to cause leaky exon 3 skipping.
        supports: SUPPORT
    origin:
