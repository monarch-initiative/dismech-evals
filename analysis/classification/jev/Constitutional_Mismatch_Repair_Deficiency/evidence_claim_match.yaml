              label: mismatch repair cancer syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: constitutional_mutator_ultrahypermutation_model
        hypothesis_label: Constitutional Mutator plus Somatic Polymerase Proofreading Loss Model
        status: CANONICAL
        description: Biallelic germline MMR loss removes post-replicative mismatch correction from every
          cell of the body, so microsatellite instability and an elevated base-substitution rate are present
          constitutionally rather than only in tumour tissue. Proliferative compartments (neural/glial
          progenitors, intestinal crypt stem cells, lymphoid precursors) accumulate driver mutations first,
          which is why CNS, gastrointestinal and haematological tumours dominate the spectrum. In most
          high-grade tumours an early somatic mutation in the exonuclease (proofreading) domain of POLE
          or POLD1 is frequently selected, and the combined loss of proofreading and mismatch repair produces
          an ultra-hypermutant genome that accumulates mutations in a rapid burst. This two-step model
          explains both the distinctive pathognomonic mutational signature used diagnostically and the
          extreme neoantigen load that makes these tumours checkpoint-inhibitor responsive.
      selected_evidence:
        snippet: The ensuing mutation signatures and numbers are unique and diagnostic of childhood germ-line
          bMMRD
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25642631
      reference_title: Combined hereditary and somatic mutations of replication error repair genes result
        in rapid onset of ultra-hypermutated cancers.
      evidence_source: HUMAN_CLINICAL
      explanation: Supports the combined germline-MMR plus somatic-polymerase model as producing a distinctive,
        diagnostic mutational output.
