  57acf67143beef9d410447a35afc261e040360aba1e05ea83a85d36ffdadf6a5:
    claim:
      about:
        disease:
          name: Constitutional Mismatch Repair Deficiency
          disease_term:
            preferred_term: constitutional mismatch repair deficiency syndrome
            term:
              id: MONDO:0031219
              label: mismatch repair cancer syndrome
        context: []
      assertion_type: AnimalModel
      assertion:
        name: MMR knockout mouse panel (Msh2, Msh6, Mlh1, Pms2)
        species: Mouse
        genotype: Homozygous germline knockout of Msh2, Msh6, Mlh1 or Pms2
        publication: PMID:26708047
        description: Germline knockout lines for each of the four genes that cause CMMRD in humans. Because
          the knockouts are homozygous null they match the biallelic constitutional state, unlike the
          heterozygous lines used to model Lynch syndrome, and they establish that loss of each gene alone
          is sufficient for a systemic mutator phenotype and cancer predisposition. The same panel supplies
          the only in vivo evidence for the class-switch-recombination arm of the syndrome.
        modeled_mechanisms:
        - target: Constitutional Microsatellite Instability and Mutator Phenotype
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Null mice for each of the four genes develop a systemic mutator phenotype and are
            cancer-predisposed, which is the constitutional consequence this node asserts.
          limitations: The review is framed around modelling Lynch syndrome and sporadic MMR-deficient
            colorectal cancer rather than CMMRD, and reports the mutator and cancer-predisposition phenotypes
            without establishing the CNS-predominant tumour distribution that defines the human syndrome.
            Treat the model as informative for the mutator phenotype itself, not for the tissue-specific
            transformation risk that the tumour-spectrum knowledge gap asks about.
          readouts:
          - name: Mutator phenotype and cancer predisposition in MMR-null mice
            target: Constitutional Microsatellite Instability and Mutator Phenotype
            description: Mutation-rate and tumour-incidence phenotypes reported across the Msh2, Msh6,
              Mlh1 and Pms2 null lines.
            direction: INCREASED
            interpretation: Each of the four genes that cause human CMMRD produces the mutator phenotype
              on its own when knocked out, matching the genetic architecture of the syndrome.
        - target: Impaired Immunoglobulin Class-Switch Recombination and Somatic Hypermutation
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: The same knockout panel is where the requirement for MMR proteins in B cell maturation
            was established, which is the mechanistic basis for the immunoglobulin abnormalities seen
            in CMMRD patients.
          limitations: The abstract reports an essential function in B cell maturation without separating
            class-switch recombination from somatic hypermutation or quantifying the immunoglobulin deficit,
            and mouse B cell development is not a substitute for the human immunological phenotype, which
            in patients is a laboratory abnormality rather than overt clinical immunodeficiency.
      selected_evidence:
        snippet: the generation and analysis of mouse lines with knockout mutations in all of the known
          MMR genes has provided insight into how loss of individual MMR genes affects genome stability
          and contributes to cancer susceptibility
        supports: SUPPORT
