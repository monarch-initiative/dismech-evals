        mechanism_confidence: ESTABLISHED
        description: The constitutional mutator state converts every proliferative compartment into a
          site of accelerated clonal evolution, so tumours arise early, in multiple organs, and repeatedly
          over a lifetime rather than as a single event. In the IRRDC cohort 339 cancers occurred in 97%
          of 201 patients, the median interval between successive cancers was under two years, and neoplasms
          arose in fifteen different organs. CNS tumours dominate and carry the worst survival; gastrointestinal
          and haematological malignancies follow. Low-grade lesions are not indolent - the great majority
          progress to high grade within a few years if not resected, which is what makes structured surveillance
          rather than symptom-driven presentation the decisive management variable.
        cell_types:
        - preferred_term: glial cell
          term:
