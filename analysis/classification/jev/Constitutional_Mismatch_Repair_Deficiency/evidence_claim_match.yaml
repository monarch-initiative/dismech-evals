      assertion_type: Diagnosis
      assertion:
        name: Constitutional Microsatellite Instability Testing (LOGIC / low-pass genome sequencing)
        description: Quantitative genomic-instability scoring on blood or saliva DNA. Because CMMRD produces
          microsatellite instability in normal tissue, a functional constitutional assay can make the
          diagnosis without a tumour and can resolve cases where genotype is ambiguous (variants of uncertain
          significance, hypomorphic alleles). The LOGIC assay was 100% sensitive and specific in childhood
          cancers and clearly outperformed the conventional MSI panel, immunohistochemistry and tumour
          mutational burden. It remains a specialised rather than a universally available test.
      selected_evidence:
        snippet: Overall, LOGIC was 100% sensitive and specific in detecting MMRD in childhood cancers
          (N = 376).
        supports: SUPPORT
