            term:
              id: MONDO:0031219
              label: mismatch repair cancer syndrome
        context: []
      assertion_type: Treatment
      assertion:
        name: CTLA-4 Blockade After Anti-PD-1 Failure
        description: 'Anti-CTLA-4 antibody added to checkpoint-inhibitor-based therapy continued beyond
          progression. Progression on anti-PD-1 monotherapy is not the end of the immune-directed option:
          CTLA-4 expression rises over time, and CTLA-4 inhibition produces response or stable disease
          in most such patients. Continuing checkpoint-inhibitor-based salvage after a second progression
          prolongs survival, most clearly in tumours with extreme mutation burden. Local and systemic
          immune adverse events are frequent, and are more frequent in biallelic mismatch repair deficiency
          than in Lynch syndrome.'
        notes: Reirradiation and RAS-MAPK-pathway inhibition are curated as separate treatments; the source
          reports all three as arms of the same salvage strategy, but they are different modalities with
          different evidence.
        therapeutic_modality: MONOCLONAL_ANTIBODY
        treatment_term:
          preferred_term: Pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: anti-CTLA-4 monoclonal antibody
            term:
              id: NCIT:C128036
              label: Anti-CTLA-4 Monoclonal Antibody
      selected_evidence:
        snippet: After second progression/recurrence (n = 55), continuing ICI-based salvage prolonged
          survival to 11.6 months (n = 38; P < 0.001), particularly for those with extreme mutation burden
          (P = 0.03).
        supports: SUPPORT
