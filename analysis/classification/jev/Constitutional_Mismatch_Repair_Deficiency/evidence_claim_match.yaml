              label: mismatch repair cancer syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: hypomorphic_allele_late_onset_model
        hypothesis_label: Hypomorphic Allele / Residual Repair Model of Late-Onset CMMRD
        status: EMERGING
        description: A subset of biallelic MMR carriers present in adulthood with a Lynch-like tumour
          spectrum rather than in childhood. The proposed explanation is that the variants are hypomorphic
          - a leaky splice variant or a missense change that retains partial repair capacity - so residual
          mismatch repair delays the accumulation of driver mutations without preventing it. If correct,
          constitutional microsatellite instability testing rather than genotype alone is what discriminates
          such patients from true Lynch syndrome, and it predicts that the phenotype should scale with
          residual repair activity. This is currently supported by case-level functional and constitutional-MSI
          data, not by a systematic genotype-function series.
      selected_evidence:
        snippet: A hypomorphic effect of these and other variants found in additional late onset CMMRD
          cases, identified by literature review, likely explains a LS-like phenotype.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/1
