      assertion_type: DifferentialDiagnosis
      assertion:
        name: Lynch Syndrome
        description: The monoallelic disease caused by variants in the same four genes. Distinguished
          by inheritance (dominant versus recessive), age (adult versus childhood), tumour spectrum (gastrointestinal/genitourinary
          versus CNS-predominant), and decisively by the absence of constitutional microsatellite instability
          and of normal-tissue MMR protein loss. A late-onset CMMRD patient with hypomorphic alleles can
          present exactly like Lynch syndrome, so constitutional MSI testing is what resolves the two.
      selected_evidence:
        snippet: Lynch syndrome (LS) and constitutional mismatch repair deficiency (CMMRD) are distinct
          cancer syndromes caused, respectively, by mono- and bi-allelic germline mismatch repair (MMR)
          variants. LS predisposes to mainly gastrointestinal and genitourinary cancers in adulthood.
          CMMRD predisposes to brain, haematological, and LS-spectrum cancers from childhood.
        supports: SUPPORT
