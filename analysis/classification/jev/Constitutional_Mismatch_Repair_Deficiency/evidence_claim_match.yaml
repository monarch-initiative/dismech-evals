        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired Immunoglobulin Class-Switch Recombination and Somatic Hypermutation
        biological_scale: CELLULAR
        role: consequence
        mechanism_confidence: ESTABLISHED
        description: 'MMR heterodimers act as a backup pathway for repair of activation-induced cytidine
          deaminase-induced lesions during class-switch recombination and somatic hypermutation. In CMMRD
          this produces measurable B-cell abnormalities - reduced somatic hypermutation frequency, skewed
          IGH subclass usage, reduced class-switched memory B cells and plasmablasts. Crucially, these
          are biological rather than clinical findings: a systematic cohort study found no consistent
          laboratory pattern and no warning signs of primary immunodeficiency, so CMMRD should not be
          curated or managed as an immunodeficiency syndrome. The node is retained because the B-cell
          phenotype is real and mechanistically informative about MMR function in vivo.'
        cell_types:
        - preferred_term: B cell
          term:
            id: CL:0000236
            label: B cell
        biological_processes:
        - preferred_term: somatic hypermutation of immunoglobulin genes
          modifier: DECREASED
          term:
            id: GO:0016446
            label: somatic hypermutation of immunoglobulin genes
        - preferred_term: isotype switching
          modifier: ABNORMAL
          term:
            id: GO:0045190
            label: isotype switching
      selected_evidence:
        snippet: results of next generation sequencing-based analyses of antigen-selected B-cell receptor
          rearrangements showed a significantly reduced frequency of SHM and an increased number of rearranged
          immunoglobulin heavy chain (IGH) transcripts that use IGHG3, IGHG1, and IGHA1 subclasses
        supports: SUPPORT
    origin:
