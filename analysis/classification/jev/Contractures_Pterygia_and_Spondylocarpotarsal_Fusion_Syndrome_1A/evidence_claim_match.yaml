            term:
              id: MONDO:0008338
              label: contractures, pterygia, and spondylocarpotarsal fusion syndrome 1A
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: MYH3 Motor Domain Dysfunction
        biological_scale: MOLECULAR
        description: 'Missense variants alter residue interactions within the embryonic myosin motor domain,
          changing how it engages actin and nucleotide. This is the studied lesion class and the one the
          mechanistic work below rests on - a change in motor behaviour rather than an absence of motor.
          It is not the only allele class reported in this part of the MYH3 spectrum: the recurrent CPSFS/spondylocarpotarsal
          allele is c.-9+1G>A, a 5''UTR splice variant that cannot alter motor-domain residue interactions
          at all and points instead at reduced expression. Note that where it has been described alongside
          this phenotype it was compound heterozygous, in trans with a head-region missense - so it is
          not established as a dominant-acting allele, and the dominant disease this entry covers may
          not be the setting in which it operates. See the REFUTE items below and the knowledge gap.'
        molecular_functions:
        - preferred_term: embryonic myosin motor activity
          term:
            id: GO:0000146
            label: microfilament motor activity
          modifier: DECREASED
        - preferred_term: actin binding by embryonic myosin
          term:
            id: GO:0003779
            label: actin binding
          modifier: INCREASED
      selected_evidence:
        snippet: "molecular modeling \nstudies, which indicate that the F437I and A234T mutations affect\
          \ specific amino \nacid residue interactions within the myosin motor domain that may alter \n\
          interaction with actin and nucleotide"
        supports: SUPPORT
        directness: INDIRECT
    origin:
