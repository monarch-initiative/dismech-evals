  fc5eb4b99a9850d8abf7381cb26c1592ae6771d5cb9ff1a8e734a51631ccf0a4:
    claim:
      about:
        disease:
          name: Contractures, Pterygia, and Spondylocarpotarsal Fusion Syndrome 1A
          disease_term:
