    evidence_metadata:
      reference: PMID:27706140
      reference_title: Formation of new chromatin domains determines pathogenicity of genomic duplications.
      evidence_source: MODEL_ORGANISM
      explanation: Primary experimental evidence supports the mechanism of the corresponding duplication
        class. The mouse Dup-C and Dup-C2 alleles are engineered models, not the human hg19 allele; patient
        fibroblast 4C-seq separately supports the ectopic contacts. The paper's main text does not resolve
        the POSTRE coordinate pair to nucleotide-level human junctions.
