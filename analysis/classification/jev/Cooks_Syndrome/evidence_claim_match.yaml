      assertion_type: Genetic
      assertion:
        name: 17q24.3 Boundary-Crossing Duplication
        gene_term:
          preferred_term: KCNJ2
          term:
            id: hgnc:6263
            label: KCNJ2
        association: Causative
        relationship_type: CAUSATIVE
        variant_origin: GERMLINE
        notes: A tandem duplication at 17q24.3 spanning the SOX9/KCNJ TAD boundary and including the KCNJ2
          and KCNJ16 coding sequences plus SOX9 upstream regulatory sequence. Four overlapping duplications
          in an approximately 2 Mb interval were reported in the original four families, and a 1.9 Mb
          duplication in a later Chinese family. Because the lesion is a copy-number variant with a regulatory
          mechanism, exome sequencing is negative — the Chinese family was solved only after array CGH.
          KCNJ2 coding mutations cause Andersen-Tawil syndrome, an unrelated phenotype.
      selected_evidence:
        snippet: However, through whole-exome sequencing (WES), we detected no pathogenic mutations in
          genes conferred to bone development.
        supports: SUPPORT
