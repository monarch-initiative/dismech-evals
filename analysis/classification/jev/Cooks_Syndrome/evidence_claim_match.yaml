            id: hgnc:6263
            label: KCNJ2
        regulatory_category: GOE
        description: Approximately 2.02 Mb duplication represented in POSTRE Table 1 patient Nr3 and Supplementary
          Data 3 as hg19 chr17:68020547-70038208, attributed there to the Cooks syndrome patient in Franke
          et al. (2016). These are POSTRE-reported interval bounds, not independently verified nucleotide-resolved
          junctions or a newly identified patient. The interval contains KCNJ2 and KCNJ16 coding sequence
          and intergenic regulatory sequence 5' of SOX9, while sparing SOX9 itself. KCNJ2 is both physically
          duplicated and the regulatory target. The pathogenic model is enhancer adoption within a neo-TAD,
          supported by patient-fibroblast chromatin contacts and corresponding engineered mouse alleles
          with ectopic digit expression. The GOE assignment uses the mouse spatial-expression evidence;
          it is not a claim that POSTRE experimentally measured this patient's expression.
        functional_effects:
        - function: Neo-TAD formation across the SOX9/KCNJ boundary
          type: Regulatory structural rearrangement
          regulatory_element_type: TAD_BOUNDARY
          regulatory_mechanism: Boundary-crossing tandem duplication and neo-TAD formation
          description: Duplicated parts of the adjacent regulatory domains form an insulated neo-TAD containing
            KCNJ2 and SOX9 regulatory sequence. This is domain reorganization rather than deletion of
            the boundary sequence.
        - function: Ectopic KCNJ2 expression in developing digits
          type: Regulatory gain of ectopic expression
          regulatory_category: GOE
          regulatory_element_type: ENHANCER
          affected_developmental_stage: Embryonic digit development; mouse limb assays at E12.5 and E17.5
          regulatory_mechanism: Enhancer adoption from the duplicated SOX9 regulatory landscape
          description: Kcnj2 adopts a Sox9-like digit expression pattern in the corresponding mouse duplication
            model. Expression and phenotype controls distinguish this effect from an extra Kcnj2 copy
            within its original regulatory domain; no altered intrinsic potassium-channel activity is
            established.
      selected_evidence:
        snippet: However, incorporation of the next flanking gene, Kcnj2, in the neo-TAD resulted in ectopic
          contacts of Kcnj2 with the duplicated part of the Sox9 regulatory region, consecutive misexpression
          of Kcnj2, and a limb malformation phenotype.
        supports: SUPPORT
        directness: INDIRECT
