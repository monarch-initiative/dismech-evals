        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Neo-TAD Formation and Ectopic KCNJ2 Enhancer Contact
        role: central_effector
        biological_scale: MOLECULAR
        mechanism_confidence: ESTABLISHED
        description: The duplicated KCNJ2 gene occupies the neo-TAD together with part of the SOX9 regulatory
          landscape. Capture Hi-C and 4C-seq in engineered Dup-C mouse limb buds demonstrate new contacts
          within this domain; patient fibroblast 4C-seq also demonstrates ectopic KCNJ2 contacts with
          the duplicated SOX9 regulatory region. SOX9 itself remains outside the duplication. A gene-free
          neo-TAD in the Dup-L control is phenotypically silent, so domain formation alone is insufficient
          for the limb phenotype. The contact measurements are distinct from the expression assays below.
        gene:
          preferred_term: KCNJ2
          term:
            id: hgnc:6263
            label: KCNJ2
        biological_processes:
        - preferred_term: KCNJ2 enhancer-promoter contacts within the neo-TAD
          term:
            id: GO:0140588
            label: chromatin looping
          modifier: ABNORMAL
      selected_evidence:
        snippet: However, incorporation of the next flanking gene, Kcnj2, in the neo-TAD resulted in ectopic
          contacts of Kcnj2 with the duplicated part of the Sox9 regulatory region, consecutive misexpression
          of Kcnj2, and a limb malformation phenotype.
        supports: SUPPORT
