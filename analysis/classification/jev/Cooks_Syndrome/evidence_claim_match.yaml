        genetic_context:
          gene:
            preferred_term: KCNJ2
            term:
              id: hgnc:6263
              label: KCNJ2
          variant_type: duplication
          genomic_contexts:
          - coding sequence
          - intergenic region
          variant_origin: GERMLINE
          description: Tandem duplications include KCNJ2 coding sequence and intergenic SOX9 regulatory
            sequence, crossing the boundary between their TADs while sparing SOX9 coding sequence. The
            POSTRE Table 1 Nr3 interval is one reported example of this lesion class.
        description: Boundary-crossing duplications at 17q24.3 copy KCNJ2 and neighboring noncoding regulatory
          sequence. The original Cooks duplications also include KCNJ16. Their regulatory consequence
          depends on the extent of the duplicated interval. In the experimental mouse series, duplicating
          Kcnj2 and Kcnj16 within their original TAD did not produce the digit phenotype, whereas incorporation
          of Kcnj2 into a neo-TAD with Sox9 regulatory sequence did. This distinguishes the pathogenic
          regulatory rearrangement from gene copy-number gain alone.
        gene:
          preferred_term: KCNJ2
          term:
            id: hgnc:6263
            label: KCNJ2
      selected_evidence:
        snippet: which is involved in two coding regions of KCNJ2 and KCNJ16
        supports: SUPPORT
