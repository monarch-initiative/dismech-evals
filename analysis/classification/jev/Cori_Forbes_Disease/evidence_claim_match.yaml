          term:
            id: HP:0000007
            label: Autosomal recessive inheritance
        description: 'GSD III follows autosomal recessive inheritance. The AGL gene is located on chromosome
          1p21.2. Carrier frequency varies by population, with notably higher prevalence in certain ethnic
          groups including Faroese, North African Jewish, and Inuit communities.

          '
      selected_evidence:
        snippet: GSD III is inherited in an autosomal recessive manner. If both parents are known to be
          heterozygous for an AGL pathogenic variant, each sib of an affected individual has at conception
          a 25% chance of being affected with GSD III, a 50% chance of being an asymptomatic carrier,
          and a 25% chance of inheriting neither of the familial AGL pathogenic variants.
        supports: SUPPORT
    origin:
