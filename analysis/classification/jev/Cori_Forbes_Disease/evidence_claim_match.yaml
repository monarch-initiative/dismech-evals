      assertion_type: Pathophysiology
      assertion:
        name: Glycogen debranching enzyme deficiency
        description: 'Deficiency of the glycogen debranching enzyme (AGL) impairs the complete degradation
          of glycogen. The enzyme normally has two catalytic activities: oligo-1,4-1,4-glucantransferase
          (transferase) and amylo-1,6-glucosidase (glucosidase). Without this enzyme, glycogen breakdown
          halts at the branch points, leading to accumulation of limit dextrin (abnormally short-branched
          glycogen) in hepatocytes, skeletal myocytes, and cardiomyocytes.

          '
        gene:
          preferred_term: AGL
          description: Amylo-1,6-glucosidase, 4-alpha-glucanotransferase; the glycogen debranching enzyme
            with dual transferase and glucosidase activities.
          modifier: DECREASED
          term:
            id: hgnc:321
