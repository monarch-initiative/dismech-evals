        classification: entity
        description: Meesmann corneal dystrophy, the KRT12 form. Autosomal dominant fragility of the anterior
          corneal epithelium. KRT12 encodes one of the two cornea-specific keratins of the epithelial
          intermediate filament cytoskeleton, and the disease-causing substitutions fall in the conserved
          keratin helix boundary motifs where dominant mutations in other keratins are known to compromise
          cytoskeletal function.
        subtype_term:
