  b19ca60b9f5d39311019c1a87db1bc59deaf11c909f7f09ed5daf8167d9c9840:
    claim:
      about:
        disease:
          name: Corneal Dystrophy
          disease_term:
            preferred_term: corneal dystrophy
            term:
              id: MONDO:0018102
              label: corneal dystrophy
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Layer-Restricted Corneal Deposition or Cellular Failure
        biological_scale: TISSUE
        role: trigger
        description: 'Each dystrophy begins with an inherited defect expressed in one corneal layer, and
          the layer determines both the mechanism and the syndrome. In the epithelial, epithelial-stromal
          and stromal categories the lesion causes abnormal material to accumulate — mutant TGFBI protein
          in the epithelial-stromal group, abnormally sulphated keratan sulphate in macular dystrophy,
          cholesterol and phospholipid in Schnyder dystrophy. The endothelial category works differently:
          the corneal endothelium does not regenerate and functions as a dehydrating pump, so its progressive
          failure admits fluid into the stroma instead of depositing anything. Curating these as one node
          reflects a shared consequence, not a shared molecular mechanism.'
        locations:
        - preferred_term: cornea
          term:
            id: UBERON:0000964
            label: cornea
        genes:
        - preferred_term: TGFBI
          term:
            id: hgnc:11771
            label: TGFBI
        - preferred_term: CHST6
          term:
            id: hgnc:6938
            label: CHST6
        - preferred_term: UBIAD1
          term:
            id: hgnc:30791
            label: UBIAD1
        - preferred_term: SLC4A11
          term:
            id: hgnc:16438
            label: SLC4A11
      selected_evidence:
        snippet: On the basis of revisiting the cellular origin of corneal dystrophy, a modified anatomic
          classification is proposed consisting of (1) epithelial and subepithelial dystrophies, (2) epithelial-stromal
          TGFBI dystrophies, (3) stromal dystrophies, and (4) endothelial dystrophies.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:25564336
      reference_title: IC3D classification of corneal dystrophies--edition 2.
      evidence_source: HUMAN_CLINICAL
      explanation: States the four-category anatomic classification and, critically, that it was derived
        by revisiting the cellular origin of each dystrophy — which is what makes the corneal layer the
