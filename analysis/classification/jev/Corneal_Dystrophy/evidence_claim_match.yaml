      assertion:
        name: Loss of Corneal Transparency
        biological_scale: TISSUE
        role: central_effector
        description: The convergent node. Corneal transparency depends on regular collagen fibril spacing,
          a deturgesced stroma and an intact smooth epithelium; every dystrophy degrades at least one
          of these. The result is corneal opacity, with or without stromal oedema depending on whether
          the endothelium is the affected layer.
        locations:
        - preferred_term: cornea
          term:
            id: UBERON:0000964
            label: cornea
      selected_evidence:
        snippet: Deposition of opaque substances in epithelial, subepithelial, epithelial-stromal TGFBI
          or stromal corneal dystrophies may also result in vision reduction. Visual loss may also occur
          in endothelial corneal dystrophies because of corneal epithelial or stromal edema consequent
          to endothelial dysfunction.
        supports: SUPPORT
