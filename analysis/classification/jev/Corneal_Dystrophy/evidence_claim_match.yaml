        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Subepithelial Corneal Amyloid Deposition
        biological_scale: TISSUE
        role: trigger
        description: The gelatinous drop-like mechanism. Three nonsense variants and one frameshift in
          TACSTD2 (reported as M1S1) were found in the original gene study, so the mechanism is loss of
          the encoded protein; severe corneal amyloidosis follows, presenting as raised yellowish-grey
          gelatinous masses that severely impair acuity by the third decade. The truncated protein itself
          aggregates in the perinuclear region of the cell that makes it, where the normal protein is
          distributed diffusely through the cytoplasm — so the intracellular aggregate and the subepithelial
          amyloid deposit are recorded as two observations rather than collapsed into one process.
        biological_processes:
        - preferred_term: corneal amyloid fibril formation
          modifier: INCREASED
          term:
            id: GO:1990000
            label: amyloid fibril formation
        locations:
        - preferred_term: cornea
          term:
            id: UBERON:0000964
            label: cornea
        genes:
        - preferred_term: TACSTD2
          term:
            id: hgnc:11530
            label: TACSTD2
      selected_evidence:
        snippet: Gelatinous drop-like corneal dystrophy (GDLD; OMIM 204870) is an autosomal recessive
          disorder characterized by severe corneal amyloidosis leading to blindness, with an incidence
          of 1 in 300,000 in Japan.
        supports: SUPPORT
