              id: MONDO:0018102
              label: corneal dystrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: ic3d_evidence_category_is_part_of_the_classification
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#Layer-Restricted Corneal Deposition or Cellular Failure
        prompt: How should dismech represent an entity whose status as a distinct disease is itself graded
          by the source classification?
        rationale: IC3D assigns every corneal dystrophy an evidence category from 1 (well characterised
          clinically, histopathologically and genetically) to 4 (a suspected entity that may not be distinct),
          and revises those grades between editions. Entities have been dissolved on review — autosomal
          dominant CHED (CHED1) was found insufficiently distinct and reassigned to posterior polymorphous
          corneal dystrophy — and others have been promoted as genes were identified. dismech has no slot
          for "the source classification doubts this is a real disease", so an IC3D category 4 entity
          and a category 1 entity would be curated identically. This matters because MONDO carries descendants
          of `MONDO:0018102` that correspond to entities IC3D has since downgraded or merged, and curating
          them as subtypes would assert more confidence than the source does. No category 3 or 4 entity
          is curated as a subtype here.
      selected_evidence:
        snippet: The new information was used to update the anatomic classification and each of the 22
          standardized templates including the level of evidence for being a corneal dystrophy
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:38359414
      reference_title: IC3D Classification of Corneal Dystrophies-Edition 3.
