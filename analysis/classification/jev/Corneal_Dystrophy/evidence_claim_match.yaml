      assertion_type: Pathophysiology
      assertion:
        name: Cornea-Specific Keratin Filament Fragility
        biological_scale: CELLULAR
        role: trigger
        description: The Meesmann mechanism. The intermediate filament cytoskeleton of the corneal epithelium
          is built from the cornea-specific pair K3 and K12; a heterozygous substitution in either, falling
          in a conserved keratin helix boundary motif, leaves the anterior epithelium mechanically fragile.
          A dominant-negative effect on the filament is the hypothesis the gene report set out to test,
          and is presented there as such rather than demonstrated. This is the same class of lesion that
          produces keratinocyte fragility phenotypes in skin keratins, restricted here to the one tissue
          where K3 and K12 are expressed.
        cell_types:
        - preferred_term: corneal epithelial cell
          term:
            id: CL:0000575
            label: corneal epithelial cell
        cellular_components:
        - preferred_term: keratin filament
          term:
            id: GO:0045095
            label: keratin filament
        locations:
        - preferred_term: corneal epithelium
          term:
            id: UBERON:0001772
            label: corneal epithelium
        genes:
        - preferred_term: KRT12
          term:
            id: hgnc:6414
            label: KRT12
        - preferred_term: KRT3
          term:
            id: hgnc:6440
            label: KRT3
      selected_evidence:
        snippet: All mutations occur in the highly conserved keratin helix boundary motifs, where dominant
          mutations in other keratins have been found to severely compromise cytoskeletal function, leading
          to keratinocyte fragility phenotypes.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/3
      evidence_path: /pathophysiology/3/evidence/1
