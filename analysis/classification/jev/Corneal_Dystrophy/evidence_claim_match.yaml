      assertion_type: Pathophysiology
      assertion:
        name: Progressive Visual Impairment Requiring Surgical Restoration
        biological_scale: ORGANISM
        role: consequence
        description: The clinical endpoint. Management escalates from lubricants, hyperosmotic agents
          and bandage contact lenses, through phototherapeutic or lamellar keratectomy, to keratoplasty.
          Because the dystrophies are layer-restricted, layer-selective grafts (anterior lamellar for
          anterior disease, endothelial keratoplasty for endothelial disease) are now preferred over penetrating
          keratoplasty — the anatomic classification maps directly onto the choice of operation. Recurrence
          in the graft is possible because the genetic defect persists in the host.
      selected_evidence:
        snippet: Anterior lamellar or endothelial keratoplasty are now preferred to penetrating keratoplasty,
          although the latter still remains the only possible option in some cases.
        supports: SUPPORT
