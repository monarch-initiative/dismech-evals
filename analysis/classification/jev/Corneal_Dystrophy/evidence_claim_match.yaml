  d235b39f1529571e961590d2eacfafdc3fac106784707470e4e98e21f0037ccf:
    claim:
      about:
        disease:
          name: Corneal Dystrophy
          disease_term:
            preferred_term: corneal dystrophy
            term:
              id: MONDO:0018102
              label: corneal dystrophy
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: mondo_files_two_non_dystrophies_under_this_family
        kind: KNOWLEDGE_GAP
        attaches_to:
        - has_subtypes#
        prompt: Should a disease that MONDO classifies as a corneal dystrophy, but that the source classification
          for corneal dystrophies does not recognise as one, be curated as a subtype here?
        rationale: 'Two descendants of MONDO:0018102 are curated neither as entity rows here nor as children
          of any anatomic category, and the reason is the same for both: the authoritative classification
          of the corneal dystrophies does not contain them.

          MONDO:0007848 autosomal dominant keratitis is a direct child of MONDO:0018102 with a PAX6 causal
          gene edge. Its reported features include corneal vascularization and foveal hypoplasia, neither
          of which is a corneal dystrophy finding — IC3D defines the dystrophies as non-inflammatory and
          cornea-restricted — and the gene-identification paper places it with the PAX6 anterior segment
          malformations rather than with the dystrophies. ClinGen curates PAX6 only as PAX6-related ocular
          dysgenesis (Definitive, autosomal dominant), and dismech''s PAX6 home is Aniridia.yaml. Ruling:
          out of scope for this family; the concept belongs with the PAX6 ocular dysgenesis spectrum.

          MONDO:0014089 corneal intraepithelial dyskeratosis-palmoplantar hyperkeratosis-laryngeal dyskeratosis
          syndrome is filed by MONDO under MONDO:0020212 superficial corneal dystrophy with an NLRP1 causal
          gene edge. It is a multisystem NLRP1 inflammasome disorder with palmoplantar and laryngeal involvement,
          and the corneal finding is one feature of a syndrome rather than an isolated dystrophy. The
          cached full text of IC3D edition 3 (PMID:38359414) contains no occurrence of "dyskeratosis"
          or of "NLRP1". Ruling: out of scope for this family; it would need its own entry as an NLRP1-related
          autoinflammatory syndrome, which dismech does not yet have.

          Both rulings are disagreements with MONDO''s placement rather than with its gene edges, which
          are themselves well supported.'
      selected_evidence:
        snippet: The finding that mutations in PAX6 underlie ADK, along with a recent report that mutations
          in PAX6 also underlie Peters anomaly, implicates PAX6 broadly in human anterior segment malformations.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/1
      context_paths:
      - /name
