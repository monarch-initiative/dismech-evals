          inheritance_term:
            preferred_term: Autosomal dominant inheritance
            term:
              id: HP:0000006
              label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Heterozygous missense mutations in K3 (E509K) and in K12 (V143L; R135T) completely co-segregated
          with MCD in the families and were not found in 100 normal unrelated chromosomes.
        supports: SUPPORT
