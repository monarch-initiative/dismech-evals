      assertion:
        name: Corneal Stromal Endosomal Sorting Defect
        biological_scale: CELLULAR
        role: trigger
        description: 'The fleck dystrophy mechanism. PIKFYVE (identified as PIP5K3) governs the morphogenesis
          and function of multivesicular bodies and the sorting of peripheral endosomes carrying cargo
          destined for lysosomes; missense, frameshift and protein-truncating variants leave discrete
          white flecks scattered through the full thickness of the stroma. The node is named for the compartment
          rather than for a cell type: the gene report goes no further than saying the histological and
          clinical findings are consistent with a role in endosomal sorting.'
        biological_processes:
        - preferred_term: multivesicular body sorting of endosomal cargo
          modifier: ABNORMAL
          term:
            id: GO:0032509
            label: endosome transport via multivesicular body sorting pathway
        locations:
        - preferred_term: corneal stroma
          term:
            id: UBERON:0001777
            label: substantia propria of cornea
        genes:
        - preferred_term: PIKFYVE
          term:
            id: hgnc:23785
            label: PIKFYVE
      selected_evidence:
        snippet: PIP5K3 is a member of the phosphoinositide 3-kinase family and regulates the sorting
          and traffic of peripheral endosomes that contain lysosomally directed fluid phase cargo, by
          controlling the morphogenesis and function of multivesicular bodies.
        supports: SUPPORT
