      assertion:
        name: Collapse of Cohesin-Mediated Chromatin Loops
        biological_scale: MOLECULAR
        description: Reduced chromatin-bound cohesin weakens enhancer-promoter contacts and CTCF insulation.
          Acute NIPBL depletion in vivo diminishes chromatin loops rapidly, and the genes that depend
          most on NIPBL-supported conformation are cell-identity and developmental genes sitting near
          super-enhancers. That selectivity is what turns a globally acting chromatin factor into a developmental
          disorder.
        biological_processes:
