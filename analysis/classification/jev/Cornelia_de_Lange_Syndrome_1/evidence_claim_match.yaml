    evidence_metadata:
      reference: PMID:18074387
      reference_title: Descriptive epidemiology of Cornelia de Lange syndrome in Europe.
      evidence_source: HUMAN_CLINICAL
      explanation: 'Registry-level confirmation that the disorder does not recur in families, and that
        neither parental age is a risk factor. Both halves matter: the first makes de novo origin the
        default assumption, and the second rules out the paternal-age effect that de novo dominant disorders
        usually show.'
