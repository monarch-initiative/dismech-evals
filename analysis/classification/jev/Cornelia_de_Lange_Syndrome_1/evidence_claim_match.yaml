      assertion_type: Diagnosis
      assertion:
        name: Alternative-tissue sequencing after negative blood testing
        description: The diagnostic consequence of mosaicism, and the practical point most likely to change
          what a clinician does. Somatic deleterious NIPBL variants are under negative selection in blood,
          so blood-based testing misses mosaic cases. In a phenotypically classical patient with negative
          blood testing, buccal swab or fibroblast sequencing should follow before NIPBL is excluded.
        presence: PRESENT
      selected_evidence:
        snippet: we demonstrate a negative selection against somatic deleterious NIPBL variants in blood.
        supports: SUPPORT
    origin:
