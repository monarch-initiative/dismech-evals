      assertion:
        name: Collective Small Gene-Expression Perturbations
        biological_scale: CELLULAR
        description: 'The distinctive feature of this disease''s mechanism, and the reason it resists
          the usual one-pathway account. Hundreds to thousands of genes change expression and nearly all
          the changes are modest, usually under 1.5-fold. No single perturbation is individually pathogenic;
          the phenotype is the sum. This is also why there is no obvious therapeutic target: there is
          no dominant node to correct.'
      selected_evidence:
        snippet: Nearly all such changes are modest, however--usually less than 1.5-fold--raising the
          intriguing possibility that, in CdLS, severe developmental defects result from the collective
          action of many otherwise innocuous perturbations.
