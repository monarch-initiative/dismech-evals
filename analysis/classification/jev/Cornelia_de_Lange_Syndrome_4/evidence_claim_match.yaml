      assertion_type: DifferentialDiagnosis
      assertion:
        name: Classic NIPBL-Related Cornelia de Lange Syndrome
        description: The principal differential and the comparison that defines CdLS4. NIPBL acts as the
          cohesin loading factor and its disease is a dosage problem; RAD21 sits inside the ring. Clinically,
          NIPBL-related disease has more severe facial morphology, limb anomalies and, especially, cognitive
          and behavioural involvement, and is overwhelmingly de novo where RAD21 variants are often familial.
          dismech curates the umbrella as Cornelia de Lange syndrome.
      selected_evidence:
        snippet: Their phenotype is an attenuated CdLS phenotype compared to that caused by variants in
          NIPBL or SMC1A for facial morphology, limb anomalies, and especially for cognition and behavior.
        supports: SUPPORT
        directness: DIRECT
