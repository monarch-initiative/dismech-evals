      assertion_type: Diagnosis
      assertion:
        name: Molecular diagnosis after CdLS clinical scoring
        description: Diagnosis rests on identifying a heterozygous RAD21 variant. Whether the international
          CdLS consensus score reliably selects these patients for testing is the one place the two main
          sources disagree, and the disagreement is curated rather than resolved. The dedicated 49-individual
          RAD21 series found that every patient with full clinical data scored at least five, which is
          above the threshold of four that indicates molecular testing, and states outright that no RAD21
          variant would have been missed by the consensus criteria. The later systematic review nonetheless
          had to exclude patients from its own statistics for scoring under four. Both authors also note
          that the clinical diagnosis is harder here than in classic CdLS. The practical reading is that
          the score is adequate as a gate to testing on present evidence, but that recognising CdLS clinically
          is not, and the attenuated presentation means it will more often be reached through broad sequencing
          than through a CdLS-shaped clinical suspicion.
      selected_evidence:
        snippet: No RAD21 variant would have been missed using the CdLS consensus criteria for molecular
          studies
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /diagnosis/0
      evidence_path: /diagnosis/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:32193685
      reference_title: Delineation of phenotypes and genotypes related to cohesin structural protein RAD21.
      evidence_source: HUMAN_CLINICAL
      explanation: The authors' explicit finding that the consensus criteria do not under-select RAD21
        patients for testing. This is the statement that prevents this entry from asserting the opposite,
        which the systematic review's exclusion rule would otherwise have suggested.
