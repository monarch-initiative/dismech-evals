        context: []
      assertion_type: Genetic
      assertion:
        name: RAD21
        gene_term:
          preferred_term: RAD21
          term:
            id: hgnc:9811
            label: RAD21
        relationship_type: CAUSATIVE
        association: Heterozygous Pathogenic Variants
        notes: 'RAD21 is the only gene that causes CdLS4. The dosage axis matters clinically and is the
          reason this gene needs an entry rather than a subtype line: heterozygous variants give attenuated
          CdLS, whereas biallelic variants give Mungan syndrome, an enteric neuromyopathy with chronic
          intestinal pseudo-obstruction, which is not a severe CdLS and is not curated in dismech. Variants
          concentrate in exon 14 (30.6% of published cases) and in the RAD21-SMC1A interaction domain.
          Twelve of 28 patients with a known transmission pattern inherited the variant; sixteen were
          de novo.'
      selected_evidence:
        snippet: RAD21 | HGNC:9811 | Cornelia de Lange syndrome | MONDO:0016033 | AD | Definitive
        supports: SUPPORT
        directness: DIRECT
