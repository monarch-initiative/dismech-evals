              label: Cornelia de Lange syndrome 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Disruption of the Cohesin Ring at the RAD21 Subunit Interfaces
        biological_scale: MOLECULAR
        description: 'RAD21 is the kleisin that closes the tripartite cohesin ring: its N-terminus engages
          SMC3, its C-terminus engages SMC1, and its central STAG domain recruits STAG1 or STAG2. CdLS4
          variants act at those interfaces. This is the step that distinguishes CdLS4 from classic CdLS
          at the level of mechanism — NIPBL is the cohesin loading factor and NIPBL-related disease is
          a dosage problem in getting cohesin onto chromatin, whereas CdLS4 is a lesion in the ring itself.'
        cellular_components:
        - preferred_term: cohesin complex
          term:
            id: GO:0008278
            label: cohesin complex
      selected_evidence:
        snippet: Mechanistically, these mutations act at the RAD21 interface with the other cohesin proteins
          STAG2 and SMC1A
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
