  de0eeb65b64d9b9e35e0b60e310f5d07e0e0b2e7ee89c0830b096fdc84323310:
    claim:
      about:
        disease:
          name: Cornelia de Lange Syndrome 4
          disease_term:
            preferred_term: Cornelia de Lange syndrome 4
            term:
              id: MONDO:0013864
              label: Cornelia de Lange syndrome 4
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Heterozygous RAD21 Variant
        biological_scale: MOLECULAR
        description: 'A single altered RAD21 allele. The variant spectrum is dominated by frameshift alleles
          (36% of 36 published patients), followed by missense (19%) and nonsense (17%), with whole-gene
          and intragenic microdeletions also reported. Where variants have been mapped to protein domains,
          most fall in the RAD21-SMC1A interaction domain. The allelic gradient runs the opposite way
          to intuition for a structural subunit: dominant missense alleles cause worse structural and
          cognitive findings than loss-of-function alleles do, which argues that the missense protein
          interferes with the ring rather than simply failing to join it.'
        genetic_context:
          gene:
            preferred_term: RAD21
            term:
              id: hgnc:9811
              label: RAD21
          zygosity: HETEROZYGOUS
      selected_evidence:
        snippet: Our data suggest that, compared to loss-of-function mutations, dominant missense mutations
          result in more severe functional defects and cause worse structural and cognitive clinical findings.
        supports: SUPPORT
        directness: DIRECT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:22633399
      reference_title: RAD21 mutations cause a human cohesinopathy.
      evidence_source: HUMAN_CLINICAL
      explanation: The allelic gradient this node describes, in the paper that established RAD21 as a
