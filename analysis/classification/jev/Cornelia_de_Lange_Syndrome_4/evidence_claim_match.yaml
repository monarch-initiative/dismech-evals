  e00223aeadfc329dd1e89883417e4129be53d755a35df8df59b1fd658ce8e1cb:
    claim:
      about:
        disease:
          name: Cornelia de Lange Syndrome 4
          disease_term:
            preferred_term: Cornelia de Lange syndrome 4
            term:
              id: MONDO:0013864
              label: Cornelia de Lange syndrome 4
        context: []
      assertion_type: Prevalence
      assertion:
        population: Worldwide
        measure_type: CASES_IN_LITERATURE
        prevalence_class: ULTRA_RARE
        notes: 'No population prevalence exists for CdLS4 specifically. Two overlapping published case
          counts bound it: 36 patients with confirmed RAD21 variants reported worldwide between May 2012
          and March 2024, and 49 individuals from 33 families in a dedicated RAD21 series that included
          24 previously unpublished cases. CdLS overall has a reported prevalence of 1:30,000 to 1:10,000
          live births, and RAD21 accounts for a small minority of it; that umbrella figure is deliberately
          not converted into a rate for this entry, because the RAD21 share is a diagnostic-cohort proportion
          rather than a population one. Such a proportion does exist: a 716-proband cohort solved 422
          molecularly, of which six (about 1%) were RAD21. That figure sits in the full text of PMID:37377026
          and not in its cached abstract, so it is recorded here rather than quoted as evidence; it also
          measures ascertainment through a CdLS-shaped clinical suspicion, which an attenuated phenotype
          passes less often.'
      selected_evidence:
        snippet: We reviewed 36 patients with CdLS related to RAD21 gene variants reported worldwide from
          May 2012 to March 2024.
        supports: SUPPORT
        directness: DIRECT
