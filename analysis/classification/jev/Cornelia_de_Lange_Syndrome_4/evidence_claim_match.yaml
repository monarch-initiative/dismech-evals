      assertion_type: Pathophysiology
      assertion:
        name: Attenuated Cornelia de Lange Phenotype
        biological_scale: ORGANISM
        description: The clinical result is recognisably CdLS but muted. Compared with NIPBL- and SMC1A-related
          disease the facial morphology and limb anomalies are milder, and cognition and behaviour are
          considerably less affected — 14 of 26 scored patients were mild and only one severe on the CdLS
          severity score. Because the consensus clinical score is built around the classic phenotype,
          CdLS4 patients score low on it, which is a diagnostic problem rather than a cosmetic difference.
      selected_evidence:
        snippet: Notably, unlike children with mutations in NIPBL, SMC1A, or SMC3, these individuals have
          much milder cognitive impairment than those with classical CdLS.
        supports: SUPPORT
        directness: DIRECT
