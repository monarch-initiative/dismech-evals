      assertion_type: DifferentialDiagnosis
      assertion:
        name: Mungan Syndrome
        description: 'The other RAD21 disease, and the reason the gene cannot be reduced to a single CdLS
          subtype line. Biallelic RAD21 variants cause an enteric neuromyopathy with chronic intestinal
          pseudo-obstruction, megaduodenum, long-segment Barrett oesophagus and cardiac abnormalities.
          Its mechanism runs through RAD21''s transcriptional targets rather than through a general cohesin
          dosage effect: the mutant protein fails to bind the APOB promoter, RUNX1 expression falls in
          patient cells, and rad21a-knockdown zebrafish show delayed intestinal transit with greatly reduced
          enteric neuron numbers. Mungan syndrome is not curated in dismech.'
      selected_evidence:
        snippet: We identified a homozygous mutation (p.622, encodes Ala>Thr) in RAD21 in patients from
          a consanguineous family with CIPO.
        supports: SUPPORT
        directness: DIRECT
