              label: Cornelia de Lange syndrome 5
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: NIPBL-related Cornelia de Lange syndrome
        description: 'The classic and much commoner form, accounting for the large majority of CdLS with
          typical facies. The mechanistic distinction is the arm of the cohesin cycle that fails: NIPBL
          loads cohesin, HDAC8 licenses its reuse. The two converge on the same transcriptional readout,
          so they cannot be told apart by that; they are separated by sequencing, by the discriminating
          craniofacial features, and by inheritance pattern.'
      selected_evidence:
        snippet: Cornelia de Lange syndrome (CdLS) is a dominantly inherited congenital malformation disorder,
          caused by mutations in the cohesin-loading protein NIPBL for nearly 60% of individuals with
          classical CdLS, and by mutations in the core cohesin components SMC1A (~5%) and SMC3 (<1%) for
          a smaller fraction of probands.
        supports: SUPPORT
    origin:
      assertion_path: /differential_diagnoses/0
      evidence_path: /differential_diagnoses/0/evidence/0
      context_paths:
