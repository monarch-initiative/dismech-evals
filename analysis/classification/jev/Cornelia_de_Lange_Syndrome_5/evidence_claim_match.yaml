        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cdls5_structure_function_to_severity
        kind: KNOWLEDGE_GAP
        attaches_to:
        - genetic#HDAC8
        prompt: Can the biochemical consequence of an HDAC8 missense allele predict clinical severity?
        rationale: The structural work has measured catalytic loss and thermostability for many of the
          disease mutants, and there is an obvious temptation to read those numbers as a severity predictor.
          The authors of that work explicitly warn against it, because X-inactivation sits between the
          allele and the phenotype in the heterozygous females who make up most reported cases. A structure-to-severity
          model would need the X-inactivation pattern in the affected tissue, which is not what is measured.
      selected_evidence:
        snippet: Genotype-phenotype relationships for HDAC8 are influenced by several factors, including
          catalytic activity, thermostability, and X-inactivation, so the influence of structure-function
          relationships for HDAC8 mutations on clinical phenotypes must be interpreted with caution.
        supports: SUPPORT
    origin:
