              label: Cornelia de Lange syndrome 5
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cdls5_mouse_skull_translational_validity
        kind: HUMAN_MODEL_MISMATCH
        attaches_to:
        - pathophysiology#Derepression of Cranial Neural Crest Patterning Genes
        - animal_models#Hdac8-null mouse
        - animal_models#Cranial neural crest conditional Hdac8 knockout mouse
        prompt: Does the mouse Hdac8-null skull phenotype represent the human CdLS5 craniofacial phenotype,
          or a different consequence of the same lesion?
        rationale: 'The evidence is not absent, which is what separates this from the other gaps here:
          a specific transcriptional mechanism has been demonstrated, twice, in a lineage-restricted conditional
          as well as a global knockout. What is uncertain is whether it transfers. The mouse phenotype
          is skull instability severe enough to kill the animal perinatally; the human phenotype is a
          viable, dysmorphic skull with hypertelorism and a late-closing fontanelle. Those are not obviously
          the same defect at different severities, and three differences could explain the divergence:
          the mouse is a constitutive null while most human alleles are missense with residual activity,
          the human females who make up most cases are X-inactivation mosaics with no mouse counterpart,
          and the vertebrate-specific skull elements the paper implicates differ between the species.
          No human cranial neural crest experiment has been done, so the translation rests on the plausibility
          of the mechanism rather than on evidence.'
      selected_evidence:
        snippet: These findings reveal how the identity and patterning of vertebrate-specific portions
          of the skull are epigenetically controlled by a histone deacetylase.
        supports: SUPPORT
