        discussion_id: cdls5_hdac8_activator_rescue
        kind: KNOWLEDGE_GAP
        attaches_to:
        - pathophysiology#HDAC8 Loss of Deacetylase Function
        prompt: Does small-molecule reactivation of mutant HDAC8 translate into anything clinically meaningful?
        rationale: 'Several catalytically impaired HDAC8 mutants can be partially or fully reactivated
          in vitro by an N-acylthiourea activator. That is a genuine and unusual therapeutic lead for
          a loss-of-function developmental disorder, and it is also, so far, entirely in vitro. The harder
          question is timing rather than chemistry: the phenotype is established in embryogenesis, so
          it is not clear what postnatal restoration of deacetylase activity would be expected to change.'
      selected_evidence:
        snippet: Intriguingly, catalytic activity in many HDAC8 mutants can be partially or fully restored
          by an N-acylthiourea activator, suggesting a plausible strategy for the chemical rescue of compromised
          HDAC8 catalysis in vivo.
        supports: SUPPORT
