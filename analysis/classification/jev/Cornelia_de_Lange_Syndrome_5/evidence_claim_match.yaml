      assertion:
        name: HDAC8 Loss of Deacetylase Function
        biological_scale: MOLECULAR
        genetic_context:
          gene:
            preferred_term: HDAC8
            term:
              id: hgnc:13315
              label: HDAC8
          variant_origin: GERMLINE
          allele_type: MISSENSE
          functional_impact_category: LOSS_OF_FUNCTION
          description: Mostly de novo missense alleles, hemizygous in males and heterozygous in females.
            Recorded as LOSS_OF_FUNCTION because every missense allele tested lost enzymatic activity;
            the mechanism is loss of catalysis or of protein stability rather than an altered or acquired
            activity.
        description: HDAC8 is the vertebrate deacetylase for the cohesin subunit SMC3, a zinc-dependent
          hydrolase acting on the acetyl-lysine mark placed during S phase. The disease alleles remove
          that activity, either by disrupting substrate binding and catalysis directly or by destabilising
          the fold.
        molecular_functions:
        - preferred_term: SMC3 lysine deacetylase activity
          term:
            id: GO:0033558
            label: protein lysine deacetylase activity
          modifier: LOSS_OF_FUNCTION
      selected_evidence:
        snippet: Here we identify HDAC8 as the vertebrate SMC3 deacetylase, as well as loss-of-function
          HDAC8 mutations in six CdLS probands.
        supports: SUPPORT
