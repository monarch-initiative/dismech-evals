            term:
              id: MONDO:0010471
              label: Cornelia de Lange syndrome 5
        context: []
      assertion_type: Genetic
      assertion:
        name: HDAC8
        gene_term:
          preferred_term: HDAC8
          term:
            id: hgnc:13315
            label: HDAC8
        relationship_type: CAUSATIVE
        presence: PRESENT
        variant_origin: GERMLINE
        notes: 'Most reported variants are missense and de novo. Functional testing of the missense set
          found that all of them lose enzymatic activity, so the disease mechanism is loss of deacetylase
          function regardless of where in the fold the substitution sits. Structural work adds a second
          axis: some mutants lose catalysis directly, others are destabilised, and the two do not map
          cleanly onto clinical severity because X-inactivation intervenes. A splice-region variant producing
          leaky aberrant splicing has also been reported, which supplies a mechanism for intrafamilial
          variability on top of X-inactivation.'
      selected_evidence:
        snippet: HDAC8 encodes the lysine deacetylase for the cohesin subunit SMC3 and analysis of the
          functional consequences of the missense mutations indicates that all cause a loss of enzymatic
          function.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24403048
      reference_title: Loss-of-function HDAC8 mutations cause a phenotypic spectrum of Cornelia de Lange
        syndrome-like features, ocular hypertelorism, large fontanelle and X-linked inheritance.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes loss of enzymatic function as the shared consequence of the missense alleles,
        which is what makes this a single mechanistic entity.
