            name: ALCAPA
            display_name: Bland-White-Garland syndrome (ALCAPA)
            description: Anomalous origin of the left coronary artery from the pulmonary artery (ALCAPA),
              also known as Bland-White-Garland syndrome. After the postnatal fall in pulmonary vascular
              resistance, perfusion of the left coronary territory becomes inadequate and depends on retrograde
              flow from the right coronary artery via collaterals, with coronary steal into the pulmonary
              trunk. Infants typically present with heart failure, mitral regurgitation, and dilated cardiomyopathy;
              adults may present with arrhythmia or sudden death.
            classification: anatomic
            subtype_term:
              preferred_term: anomalous left coronary artery from the pulmonary artery
              term:
