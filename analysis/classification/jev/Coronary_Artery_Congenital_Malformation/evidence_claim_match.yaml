        category: Cardiovascular
        name: Cardiomyopathy
        description: Sustained ischemia from ALCAPA produces dilated cardiomyopathy in infants. Left ventricular
          function typically normalises within 6 months of restoring dual coronary perfusion.
        phenotype_term:
          preferred_term: Cardiomyopathy
          term:
            id: HP:0001638
            label: Cardiomyopathy
        subtype: ALCAPA
      selected_evidence:
        snippet: The median normalisation time of left ventricular function was 6 months.
        supports: SUPPORT
