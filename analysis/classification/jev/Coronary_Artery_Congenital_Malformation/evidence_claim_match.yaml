      assertion_type: Pathophysiology
      assertion:
        name: ALCAPA coronary steal and low-pressure perfusion
        description: Subtype-specific mechanism for ALCAPA. The postnatal fall in pulmonary vascular resistance
          leaves the left coronary territory perfused at low pressure from the pulmonary trunk. Once intercoronary
          collaterals develop, blood is shunted retrograde from the right coronary into the pulmonary
          trunk (coronary steal), producing chronic subendocardial ischemia of the left ventricle and
          the classic infantile dilated cardiomyopathy with mitral regurgitation.
        cell_types:
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Overall, 114 (82.6%) patients received coronary reimplantation, 21 (15.2%) underwent
          Takeuchi repair, and three (2.1%) were treated by closure of the ALCAPA plus coronary artery
          bypass graft.
        supports: SUPPORT
