      assertion_type: Subtype
      assertion:
        name: AAOCA
        display_name: Anomalous aortic origin of a coronary artery
        description: A coronary artery (most clinically relevant when the left or right main coronary)
          arises from the inappropriate sinus of Valsalva, often with an interarterial course between
          the aorta and pulmonary artery. Anomalous left coronary from the right aortic sinus (L-AAOCA)
          carries a high risk of sudden cardiac death; anomalous right coronary from the left aortic sinus
          (R-AAOCA) is more common but lower risk. High-risk anatomic features include interarterial course,
          intramural proximal segment, slit-like ostium, and acute take-off angle.
        classification: anatomic
        subtype_term:
          preferred_term: malposition of the coronary ostium
          term:
            id: MONDO:0020426
            label: malposition of the coronary ostium
      selected_evidence:
        snippet: autopsy studies report an associated risk of sudden death with interarterial anomalous
          left coronary artery (ALCA) and anomalous right coronary artery (ARCA).
        supports: SUPPORT
