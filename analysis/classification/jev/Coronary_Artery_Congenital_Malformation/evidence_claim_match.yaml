        context: []
      assertion_type: Pathophysiology
      assertion:
        name: AAOCA interarterial/intramural coronary compression
        description: Subtype-specific mechanism for AAOCA. The anomalous proximal segment may be compressed
          between the aorta and pulmonary trunk (interarterial course), tunnel through the aortic wall
          as an intramural segment with a slit-like ostium, kink at an acute take-off angle, or stretch
          on exertion when aortopulmonary distention increases. These mechanisms reduce coronary luminal
          area and flow reserve during exercise, producing dynamic ischemia that can trigger lethal ventricular
          arrhythmias.
        cell_types:
        - preferred_term: smooth muscle cell of the coronary artery
          term:
            id: CL:0002592
            label: smooth muscle cell of the coronary artery
        - preferred_term: cardiac muscle cell
          term:
            id: CL:0000746
            label: cardiac muscle cell
      selected_evidence:
        snippet: Anomalous left coronary artery from the right aortic sinus (L-AAOCA) with interarterial
          course carries a high risk of sudden cardiac death (SCD); therefore, current guidelines recommend
          exercise restriction and surgical intervention.
        supports: SUPPORT
    origin:
