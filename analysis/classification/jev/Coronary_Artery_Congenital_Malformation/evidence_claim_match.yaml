        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Aberrant coronary artery embryologic development
        description: Coronary arteries form during embryogenesis through coordinated contributions of
          the proepicardium, epicardial epithelial-to-mesenchymal transition (EMT), endothelial progenitor
          migration into the developing myocardium, and connection of the nascent coronary plexus to the
          aortic root at the sinuses of Valsalva. Aberrations in coronary vasculogenesis, coronary stem
          formation, or septation of the outflow tract can produce anomalous origin from the aorta or
          pulmonary trunk, ostial atresia or stenosis, single coronary artery, or fistulous persistence
          of intramural sinusoidal connections. Cardiac neural crest cells and second heart field derivatives
          shape the outflow-tract anatomy that determines the final position of coronary ostia.
        cell_types:
        - preferred_term: endothelial cell of coronary artery
          term:
            id: CL:2000018
            label: endothelial cell of coronary artery
        - preferred_term: smooth muscle cell of the coronary artery
          term:
            id: CL:0002592
            label: smooth muscle cell of the coronary artery
        biological_processes:
        - preferred_term: coronary vasculature morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0060977
            label: coronary vasculature morphogenesis
        - preferred_term: coronary artery morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0060982
            label: coronary artery morphogenesis
        - preferred_term: outflow tract morphogenesis
          modifier: ABNORMAL
          term:
            id: GO:0003151
            label: outflow tract morphogenesis
      selected_evidence:
        snippet: Coronary artery anomalies (CAAs) are a group of congenital conditions characterized by
          abnormal origin or course of any of the 3 main epicardial coronary arteries.
        supports: SUPPORT
