      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: icosapent_ethyl_coronary_plaque_remodeling_model
        hypothesis_label: Icosapent Ethyl Coronary Plaque-Remodeling Model
        status: EMERGING
        description: In statin-treated people with coronary atherosclerosis and persistent hypertriglyceridemia,
          icosapent ethyl may contribute to the observed cardiovascular-event contrast by altering coronary
          plaque composition or progression rather than through isolated change in circulating triglyceride
          concentration. EVAPORATE reported a randomized between-arm imaging signal, but its cached abstract
          reports 80 enrolled without the paired-scan analytic denominator or baseline plaque balance,
          and the reported multivariable model did not adjust for baseline plaque. Missing-scan and regression-to-the-mean
          sensitivity therefore remain unresolved. The trial also used a mineral-oil comparator and a
          surrogate endpoint and did not test whether plaque change mediated clinical events.
        notes: 'This is a small 80-patient surrogate imaging hypothesis, not a treatment-to-pathophysiology
          edge. REDUCE-IT tested a high-risk ASCVD-or-diabetes population broader than coronary artery
          disease; EVAPORATE is the coronary-specific lead and did not test clinical outcomes or mediation.
          Focused research must compare plaque remodeling with: remnant- and apolipoprotein-B particle
          number, composition, trafficking, and arterial retention; platelet activation and thromboxane
          biology; specialized inflammatory-resolution lipid mediators rather than generic C-reactive-protein
          lowering; endothelial nitric-oxide and vascular-function effects; membrane stabilization, lipid
          peroxidation, and oxidized-lipid effects; and biomarker increases observed in mineral-oil-assigned
          participants. Achieved-EPA concentrations and other postrandomization biomarker associations
          may reflect adherence, absorption, or metabolism and cannot identify a mediator without prespecified
          temporal causal-mediation analysis. Distinguish a causal mediator from a baseline effect modifier,
          parallel pharmacodynamic marker, surrogate correlate, or comparator artifact.'
      selected_evidence:
        snippet: A total of 80 patients were enrolled in this randomized, double-blind, placebo-controlled
          trial.
        supports: SUPPORT
