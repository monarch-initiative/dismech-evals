      - /disease_term
    evidence_metadata:
      reference: PMID:42443528
      reference_title: Pervasive interactions between exposures and polygenic risk can inform more effective
        clinical and behavioral interventions.
      evidence_source: COMPUTATIONAL
      explanation: 'Direct source (Nagpal & Gibson 2026): across seven UK Biobank diseases and 75 contexts,
        amplification of genetic effects in adverse contexts is identified as the predominant mechanism
        of PGS×context interaction — the mechanism applied in this hypothesis.'
