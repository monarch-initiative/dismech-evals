  079d3a96064df86a91e5af70aff25c8943fd904e288172e84df3ad01875cc201:
    claim:
      about:
        disease:
          name: Coronary Artery Disease
          disease_term:
            preferred_term: coronary atherosclerosis
            term:
              id: MONDO:0021661
              label: coronary atherosclerosis
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pgs_context_amplification
        hypothesis_label: Amplification of polygenic CAD risk in adverse contexts via shared endothelial-dysfunction
          convergence
        status: EMERGING
        description: 'Polygenic-score-by-context (PGS×C) interactions reported for coronary artery disease
          in the UK Biobank appear to be driven not by different causal variants acting in different environments,
          but by amplification: the same susceptibility loci (e.g. the 9p21 locus, APOE, LDLR, PCSK9)
          exert systematically larger effects in disease-promoting contexts. This entry proposes that
          the amplification arises because the polygenic liability and adverse exposures such as tobacco
          smoking converge on a shared upstream pathophysiology node — Endothelial Dysfunction — so their
          joint effect is super-additive on the liability-threshold scale rather than additive. Nagpal
          & Gibson (Nat Genet 2026, PMID:42443528) report that in past smokers with low omega-6 fatty
          acid levels the majority of CAD genetic effects are nearly perfectly correlated with, but up
          to twofold larger in magnitude than, those in non-smokers with higher omega-6 fatty acids, alongside
          an ~8% higher SNP-heritability — the signature of amplification rather than uncorrelated context-specific
          effects.'
        notes: EMERGING hypothesis motivated by population-scale PGS×context analyses (primary source
          PMID:42443528; general amplification mechanism corroborated by PMID:37228747, which also documents
          testosterone-mediated amplification). The convergence claim (genetic liability + smoking → Endothelial
          Dysfunction) is a mechanistic interpretation and is not itself established as causal — see the
          reverse-causation knowledge gap under discussions.
      selected_evidence:
        snippet: GxSex is pervasive but acts primarily through systematic sex differences in the magnitude
          of many genetic effects
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:37228747
      reference_title: Amplification is the primary mode of gene-by-sex interaction in complex human traits.
      evidence_source: COMPUTATIONAL
      explanation: Establishes amplification — systematic differences in the magnitude of polygenic effects
        rather than in the identity of causal variants — as the primary mode of gene-by-context interaction.
        Sex is among the contexts showing the strongest PGS×context amplification for CAD, so this supports
        amplification as the mechanism underlying the CAD PGS×C interactions modelled here.
