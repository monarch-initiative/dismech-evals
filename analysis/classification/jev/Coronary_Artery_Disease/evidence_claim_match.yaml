              label: coronary atherosclerosis
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Endothelial Dysfunction
        description: At atherosclerosis-prone arterial sites, disturbed flow is associated with endothelial
          stress and senescence, while reduced endothelial nitric-oxide biosynthesis represents the vasomotor
          dysfunction that impairs dilation. This nonconforming coronary endothelial-function branch is
          modeled separately from the conserved subendothelial apoB-retention trigger. The cited disturbed-flow
          evidence derives from mouse carotid arteries and human carotid plaques, so its transfer to coronary
          endothelial dysfunction is explicitly partial.
        cell_types:
        - preferred_term: Endothelial Cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: Nitric Oxide Production
          term:
            id: GO:0006809
            label: nitric oxide biosynthetic process
          modifier: DECREASED
      selected_evidence:
        snippet: CD36 + positive ECs exhibited significant senescence phenotypes following disturbed flow
          stimulation.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:40594772
      reference_title: Single-cell RNA-seq analysis of mouse carotid artery under disturbed flow and human
        carotid plaques identifies key cell populations in atherosclerosis development.
      evidence_source: MODEL_ORGANISM
      explanation: Supports disturbed-flow-associated endothelial senescence as one component of endothelial
        dysfunction. It does not directly measure nitric-oxide biosynthesis and comes from a mouse carotid
        model, so it is not treated as direct coronary or nitric-oxide evidence.
