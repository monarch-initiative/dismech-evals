            term:
              id: MONDO:0010333
              label: corpus callosum agenesis-intellectual disability-coloboma-micrognathia syndrome
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: igbp1_pp2a_dosage_developmental_mechanism
        hypothesis_label: IGBP1/Alpha 4 dosage dysregulation of PP2A as the developmental mechanism
        status: EMERGING
        description: 'The proposed disease mechanism is that the 5''-regulatory IGBP1 (Alpha 4) variants
          alter Alpha 4 protein dosage (via changed translational efficiency, mRNA stability, or splicing),
          perturbing PP2A-regulated dephosphorylation during embryonic midline and craniofacial development.
          Because Alpha 4 is itself regulated by MID1 - the E3 ubiquitin ligase mutated in the phenotypically
          overlapping X-linked Opitz GBBB syndrome - dysregulated Alpha 4 dosage is proposed as a shared
          mechanistic node for the callosal, ocular, and craniofacial malformations. This remains a hypothesis
          stated in the primary literature: no knock-in mouse or patient-cell functional confirmation
          of the specific variants has been reported, and the IGBP1-XLID gene association itself has been
          flagged as needing replication.'
      selected_evidence:
        snippet: Altered expression of Alpha 4, through either a change in translational efficiency, mRNA
          stability or splicing, could explain the clinical phenotype in these boys and the phenotypic
          overlap with Opitz GBBB syndrome
        supports: SUPPORT
    origin:
