              label: corticobasal syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Network-Specific Tau Propagation and Asymmetric Neurodegeneration
        description: CBD behaves as a neural-network-specific disorder. Pathology begins in the dorsolateral
          prefrontal cortex and basal ganglia circuits, with the astrocytic plaque as the earliest lesion,
          and spreads to more posterior regions as the disease advances; tau seeding and propagation are
          strain- and network-specific. The result is progressive, characteristically asymmetric frontoparietal,
          basal ganglia, and nigral neurodegeneration.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: astrocyte
          term:
            id: CL:0000127
            label: astrocyte
        biological_processes:
        - preferred_term: Neuron apoptotic process
          term:
            id: GO:0051402
            label: neuron apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: It initially affects the dorsolateral prefrontal cortex and basal ganglia circuits, with
          more posterior regions affected as the disease progresses.
        supports: SUPPORT
