      assertion_type: Pathophysiology
      assertion:
        name: 4R-Tau Aggregation with Astrocytic Plaques
        description: Corticobasal degeneration, the archetypal pathology of CBS, is defined by the accumulation
          of aggregated, hyperphosphorylated four-repeat (4R) tau in neurons and glia. The pathognomonic
          lesion is the astrocytic plaque, which distinguishes CBD from the tufted astrocytes of PSP;
          ballooned achromatic neurons, neuropil threads, and oligodendroglial coiled bodies are additional
          lesions. 4R tau predominance arises from alternative splicing of MAPT exon 10. This is the upstream
          initiating lesion.
        cell_types:
        - preferred_term: neuron
          term:
            id: CL:0000540
            label: neuron
        - preferred_term: astrocyte (astrocytic plaque)
          term:
            id: CL:0000127
            label: astrocyte
        - preferred_term: oligodendrocyte (coiled body)
          term:
            id: CL:0000128
            label: oligodendrocyte
        biological_processes:
        - preferred_term: Tau (amyloid) fibril formation
          term:
            id: GO:1990000
            label: amyloid fibril formation
          modifier: INCREASED
        - preferred_term: Tau hyperphosphorylation
          term:
            id: GO:0006468
            label: protein phosphorylation
          modifier: INCREASED
        - preferred_term: Disrupted microtubule cytoskeleton organization
          term:
            id: GO:0000226
            label: microtubule cytoskeleton organization
          modifier: ABNORMAL
      selected_evidence:
        snippet: astrocytic plaques are pathognomonic of CBD, whereas PSP is characterized by tufted astrocytes.
        supports: SUPPORT
    origin:
