          parkinsonism combined with cortical signs (limb apraxia, cortical sensory loss, alien limb phenomenon,
          focal dystonia, and myoclonus). Because phenotype tracks the topography and burden of tau pathology,
          CBD can also manifest as aphasic, behavioral, or PSP-like phenotypes rather than classic CBS.'
