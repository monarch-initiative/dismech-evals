      assertion:
        name: Cough Reflex Hypersensitivity
        description: 'Heightened sensitivity of airway cough receptors including vagal C-fibers and rapidly
          adapting receptors, leading to exaggerated cough responses to normally innocuous stimuli. Cough
          hypersensitivity symptom profiles are similar between asthmatic cough and refractory chronic
          cough, suggesting a shared neuronal mechanism across chronic cough phenotypes.

          '
        cell_types:
        - preferred_term: bronchial epithelial cell
          term:
            id: CL:0002328
            label: bronchial epithelial cell
        locations:
        - preferred_term: bronchus
          term:
            id: UBERON:0002185
            label: bronchus
      selected_evidence:
        snippet: The symptoms of cough hypersensitivity may not distinguish between asthmatic cough and
          RCC. This suggests that chronic cough is the primary diagnosis in both phenotypes. It indicates
          a shared mechanism in their cough pathogenesis, despite having potentially different treatable
          traits.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/2
      evidence_path: /pathophysiology/2/evidence/0
      context_paths:
