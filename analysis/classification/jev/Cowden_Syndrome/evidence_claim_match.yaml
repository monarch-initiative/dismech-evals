        description: 'Beyond its well-known role as a lipid phosphatase, PTEN performs nuclear functions
          in maintaining genome integrity, including DNA double-strand break repair and chromosomal stability.
          Quantitative DNA damage response (DDR) modeling of PHTS patient-derived lymphoblastoid cell
          lines (n=43) shows that PTEN nonsense variants have less efficient DNA repair (higher residual
          gamma-H2AX foci 24 h after irradiation) than missense variants, and that DDR dynamics differ
          between PHTS-ASD/DD and PHTS-cancer phenotypic subgroups. This second molecular axis (genome
          instability) likely contributes to the pleiotropy of PHTS — explaining why cancer and neurodevelopmental
          phenotypes can both arise from germline PTEN loss without simply scaling with PI3K/AKT/mTOR
          over-activation.

          '
        cell_types:
