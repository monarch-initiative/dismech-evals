      assertion_type: Discussion
      assertion:
        discussion_id: cs_mtor_inhibition_endpoint_choice
        kind: CONTROVERSY
        status: OPEN
        prompt: Did the everolimus trial show mTOR inhibition does not work in Cowden syndrome, or that
          neurocognition was the wrong endpoint to test it on?
        attaches_to:
        - treatments#mTOR Inhibitor Therapy
        - clinical_trials#NCT02991807
        rationale: The one randomised trial of mTOR inhibition in this disease missed its primary neurocognitive
          endpoint, in 46 participants over six months. It is frequently read as a negative result for
          the drug class. That reading may be too broad. The trial tested neurocognition, a phenotype
          set during fetal and early postnatal development, and asked a six-month adult and paediatric
          course of drug to move it. The hamartoma burden - a lesion that is actively proliferating and
          therefore plausibly mTOR-dependent in real time - was not the endpoint, and the striking anecdotal
          responses in Lhermitte-Duclos disease are in that second category. This entry records the trial
          result as PARTIAL rather than REFUTE for that reason.
      selected_evidence:
        snippet: Everolimus is well tolerated in PHTS; adverse events were similar to previous reports.
          The primary efficacy endpoint did not reveal improvement.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/1
      evidence_path: /discussions/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:35594551
      reference_title: A randomized controlled trial of everolimus for neurocognitive symptoms in PTEN
