  5e86f362c3f8b763c89d07a3a2d1087263c84fab44d0dcbba8c57990f72f4ab1:
    claim:
      about:
        disease:
          name: Cowden Syndrome
          disease_term:
            preferred_term: Cowden syndrome
            term:
              id: MONDO:0016063
              label: Cowden disease
        context: []
      assertion_type: Subtype
      assertion:
        name: Cowden Syndrome 2 (KLLN)
        description: 'Cowden syndrome caused by germline epigenetic silencing (promoter hypermethylation)
          of KILLIN (KLLN), a p53-co-regulated tumor suppressor transcribed from the same bidirectional
          promoter as PTEN. KLLN methylation down-regulates KILLIN expression and is associated with increased
          breast and renal cancer risk.

          '
      selected_evidence:
        snippet: Germline KILLIN methylation is common among patients with Cowden syndrome or Cowden-like
          syndrome and is associated with increased risks of breast and renal cancer over PTEN mutation-positive
          individuals.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/1
      evidence_path: /has_subtypes/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:21177507
      reference_title: Germline epigenetic regulation of KILLIN in Cowden and Cowden-like syndrome.
      evidence_source: HUMAN_CLINICAL
      explanation: Defines KLLN germline epigenetic silencing as the second major cause of Cowden/Cowden-like
        syndrome, conferring higher breast and kidney cancer risk than PTEN mutation alone.
