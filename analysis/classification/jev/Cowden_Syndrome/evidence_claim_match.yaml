      assertion:
        name: Neurodevelopmental Cortical Dysfunction
        description: 'In addition to its cell-autonomous role in restraining cell growth, PTEN regulates
          neuronal differentiation, dendritic arborisation, and synaptic homeostasis. Germline PTEN loss
          causes early-stage neuroectoderm and forebrain organoid abnormalities (disrupted neuronal differentiation,
          radial glia mispositioning, and altered cortical layering) and contributes to macrocephaly and
          autism-spectrum neurobehavioral phenotypes through PI3K/AKT/mTOR over-activation in cortical
          progenitors and neurons. PTEN germline mutations account for ~0.2-1% of all autism spectrum
          disorder (ASD) cases, ~17% of ASD with macrocephaly, and ~20-23% of PHTS individuals are diagnosed
          with ASD.

          '
