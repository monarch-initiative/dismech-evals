  516b7df476f792de7364ec71ccc6ab6f63b254837cbd86fd4e70a1eb7831200e:
    claim:
      about:
        disease:
          name: Cowden Syndrome
          disease_term:
            preferred_term: Cowden syndrome
            term:
              id: MONDO:0016063
              label: Cowden disease
        context: []
      assertion_type: AnimalModel
      assertion:
        name: Mammary Pten loss with constitutive Stat5 activation
        species: Mouse
        genotype: Mammary Pten loss of function with constitutively active Stat5; conditional mammary
          Stat5 ablation as the intervention arm
        genes:
        - preferred_term: PTEN
          term:
            id: hgnc:9588
            label: PTEN
        - preferred_term: STAT5A
          term:
            id: hgnc:11366
            label: STAT5A
        description: 'The breast arm, which the entry''s other two models do not reach. Breast cancer
          is the largest single risk in Cowden syndrome, and this is the model the source describes as
          a genuine mouse model for it. Constitutive Stat5 activation cooperates with Pten loss to accelerate
          preneoplastic lesions and mammary tumours; the mechanism offered is that Stat5 drives transcription
          of Akt1 and of both PI3K subunits, so the two lesions converge on the same prosurvival pathway
          from different directions. The interventional arm is the informative part: mammary-specific
          Stat5 ablation prevents carcinogenesis in that background, which makes the cooperation a dependency
          rather than an association.'
        publication: PMID:24469394
        modeled_mechanisms:
        - target: Increased Cancer Risk
          relationship: PARTIALLY_RECAPITULATES
          fidelity: MODERATE
          description: Reproduces PTEN-driven mammary carcinogenesis, the largest organ-specific risk
            in the syndrome, and identifies a pathway dependency that can be removed to prevent it.
          limitations: Tumour acceleration requires constitutive Stat5 activation alongside Pten loss,
            which is an engineered cooperating lesion rather than something Cowden syndrome patients carry,
            so the model reports on a sensitised background rather than on germline PTEN heterozygosity
            alone. It is a single-organ model and says nothing about the thyroid, endometrial or renal
            risks, and the prevention result is a genetic ablation, not a drug.
          readouts:
          - name: Preneoplastic lesion and mammary tumour formation
            target: Increased Cancer Risk
            direction: ABOLISHED
            interpretation: Mammary-specific Stat5 ablation prevents carcinogenesis in the Pten-deficient
              background. ABOLISHED rather than DECREASED because the source says prevented, not reduced.
        notes: The source proposes Jak2/Stat5 inhibition as a breast-cancer prevention strategy in PTEN
          mutation carriers. That is a hypothesis from a mouse model, not a treatment, and it is deliberately
          not curated in treatments:.
      selected_evidence:
        snippet: we observed that the constitutive activation of Stat5 cooperates with the loss of function
          of the tumor suppressor PTEN by accelerating the formation of preneoplastic lesions and mammary
          tumors
        supports: SUPPORT
