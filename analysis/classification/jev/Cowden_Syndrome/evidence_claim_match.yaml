            term:
              id: MONDO:0016063
              label: Cowden disease
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Reduced Succinate Dehydrogenase Activity
        description: A proposed convergent node, carried explicitly as a hypothesis. Cowden and Cowden-like
          syndrome have genetically unrelated causes - PTEN loss, KLLN promoter hypermethylation, and
          SDHB/SDHD variants - and this node is the only account on offer for why they produce clinically
          indistinguishable disease. SDHx variants reduce succinate dehydrogenase activity by definition;
          the claim that PTEN loss does so as well rests on a single study of 21 carriers that measured
          plasma succinate and inferred the enzyme. Nothing downstream is drawn from this node, because
          what the accumulated succinate would then do in Cowden syndrome has not been shown.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: succinate dehydrogenase activity
          term:
            id: GO:0000104
            label: succinate dehydrogenase activity
          modifier: DECREASED
        chemical_entities:
        - preferred_term: succinate
          term:
            id: CHEBI:30031
            label: succinate(2-)
          modifier: INCREASED
      selected_evidence:
        snippet: Germline SDH mutations/variants occur in a subset of PTEN mutation-negative CS/CS-like
          individuals and are associated with increased frequencies of breast, thyroid, and renal cancers
          beyond those conferred by germline PTEN mutations.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/5
      evidence_path: /pathophysiology/5/evidence/1
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18678321
      reference_title: Germline mutations and variants in the succinate dehydrogenase genes in Cowden
        and Cowden-like syndromes.
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes the SDHx arm that reaches this node by a route nobody disputes, which is
        what makes the PTEN route worth testing.
