      assertion_type: Inheritance
      assertion:
        name: Autosomal dominant inheritance with age-dependent incomplete penetrance
        inheritance_term:
          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        penetrance: INCOMPLETE
        expressivity: VARIABLE
        description: 'Cowden syndrome is inherited as an autosomal dominant trait, and each child of an
          affected individual has a 50% chance of inheriting the variant. Most cases are simplex - no
          known affected relative - but that is not the same as de novo, and GeneReviews declines to put
          a number on the split because the condition is underdiagnosed; perhaps 10-50% of individuals
          have an affected parent. Penetrance is high but incomplete and strongly age-dependent, which
          is why cumulative lifetime cancer risk is the meaningful risk statement for this entry and a
          cross-sectional figure is not. Expressivity is variable even within a single family: the same
          germline PTEN variant can present as isolated macrocephaly with autism in one relative and as
          early breast or thyroid cancer in another. Sex modifies expression: breast and endometrial risk
          apply to female carriers, so a single "any cancer" lifetime figure conceals a large difference
          between sexes.'
      selected_evidence:
        snippet: Each  child of an affected individual has a 50% chance of inheriting the pathogenic  variant
          and developing PHTS.
        supports: SUPPORT
