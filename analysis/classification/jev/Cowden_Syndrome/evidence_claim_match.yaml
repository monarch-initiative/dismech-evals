        description: 'Lhermitte-Duclos disease (LDD, dysplastic gangliocytoma of the cerebellum) is a
          pathognomonic central nervous system manifestation of Cowden syndrome, characterized by replacement
          of normal Purkinje cells with dysplastic ganglion cells. A systematic review of 302 LDD cases
          found that 32.8% were associated with Cowden syndrome and 19.9% had confirmed PTEN mutation.
          Symptoms include headache (57.6%) and cerebellar ataxia (36.1%); the radiologic "tiger-stripe"
          appearance on MRI is pathognomonic.

          '
