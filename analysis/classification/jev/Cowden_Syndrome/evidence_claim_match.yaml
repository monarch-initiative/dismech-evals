                label: STAT5A
            description: 'The breast arm, which the entry''s other two models do not reach. Breast cancer
              is the largest single risk in Cowden syndrome, and this is the model the source describes
              as a genuine mouse model for it. Constitutive Stat5 activation cooperates with Pten loss
              to accelerate preneoplastic lesions and mammary tumours; the mechanism offered is that Stat5
              drives transcription of Akt1 and of both PI3K subunits, so the two lesions converge on the
              same prosurvival pathway from different directions. The interventional arm is the informative
              part: mammary-specific Stat5 ablation prevents carcinogenesis in that background, which
              makes the cooperation a dependency rather than an association.'
            publication: PMID:24469394
            notes: The source proposes Jak2/Stat5 inhibition as a breast-cancer prevention strategy in
              PTEN mutation carriers. That is a hypothesis from a mouse model, not a treatment, and it
              is deliberately not curated in treatments:.
