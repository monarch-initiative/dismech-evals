  c81aec3b9b39ec11234edd847bd6499eb6614ec5eeb9f23ceb759ac97f0188dc:
    claim:
      about:
        disease:
          name: Cowden Syndrome
          disease_term:
            preferred_term: Cowden syndrome
            term:
              id: MONDO:0016063
              label: Cowden disease
        context: []
      assertion_type: ExperimentalModel
      assertion:
        name: PTEN-mutant iPSC-derived forebrain organoids
        experimental_model_type: ORGANOID
        description: 'Forebrain organoids differentiated from gene-edited isogenic iPSCs carrying one
          of two germline PTEN missense alleles - G132D, associated with autism, and M134R, associated
          with cancer. The entry already cited this work as evidence on the neurodevelopmental node; it
          is modelled here as a system so the node carries the fidelity and limitations of the evidence,
          not only its conclusion. Its distinctive value is stage resolution, and the finding that resolution
          produced: the two alleles do not act at the same point. G132D disrupts neuroectoderm formation
          within the first several days, while M134R is morphologically normal then and diverges only
          later. Both converge on disrupted differentiation, radial glia positioning and cortical layering
          by 72+ days. This is human tissue, which the mouse models are not.'
        publication: PMID:38030818
        modeled_mechanisms:
        - target: Neurodevelopmental Cortical Dysfunction
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Human germline-PTEN-genotype cells reproduce disrupted neuronal differentiation,
            radial glial positioning and cortical layering during early forebrain development.
          limitations: 'Organoids lack vasculature, microglia and the full complement of inter-areal connectivity,
            so behavioural and circuit-level consequences cannot be read out at all. The two alleles also
            diverge on different timescales, and the entry should not be read as giving one window: the
            ASD-associated PTEN G132D allele disrupts neuroectoderm formation within the first several
            days of organoid generation, whereas the M134R allele associated with cancer looks like wild
            type at that stage and only diverges by 72+ days. Both windows correspond to fetal development,
            not to the postnatal period in which macrocephaly and autism-spectrum features are recognised
            clinically.'
          readouts:
          - name: Neuronal differentiation, radial glial positioning and cortical layering
            target: Neurodevelopmental Cortical Dysfunction
            direction: ALTERED
            interpretation: Morphological readouts scored in PTEN-mutant versus isogenic control organoids
              at matched differentiation stages.
        - target: PTEN Loss and PI3K/AKT/mTOR Pathway Activation
          relationship: RESCUES
          fidelity: MODERATE
          description: Pharmacological AKT inhibition with perifosine reduced over-activated AKT and partially
            corrected the cellular disorganisation in PTEN G132D organoids. This is the entry's only demonstration
            that the downstream pathway state, rather than PTEN itself, is what produces the cellular
            phenotype - and it is in human tissue.
          limitations: Correction was partial, not complete, and was shown for the G132D allele only.
            Perifosine is not a Cowden syndrome treatment and the experiment says nothing about clinical
            benefit; it is a mechanistic rescue, and the one randomised trial of pathway inhibition in
            patients missed its primary endpoint.
          readouts:
          - name: AKT activation and cellular organisation after perifosine
            target: PTEN Loss and PI3K/AKT/mTOR Pathway Activation
            direction: RESTORED
            interpretation: Over-activated AKT falls and the disrupted cellular organisation is partially
              corrected, in the same organoid system that showed the defect.
      selected_evidence:
        snippet: We generated forebrain organoid cultures from gene-edited isogenic human induced pluripotent
          stem cells (hiPSCs) harboring a PTENG132D (ASD) or PTENM134R (cancer) mutant allele to model
          how these mutations interrupt neurodevelopmental processes.
        supports: SUPPORT
