      assertion_type: Diagnosis
      assertion:
        name: Clinical Cowden syndrome diagnostic criteria
        description: 'Clinical diagnosis should apply the Cowden syndrome pathognomonic, major, and minor
          criteria before or alongside molecular testing. Pathognomonic criteria include adult Lhermitte-Duclos
          disease and characteristic mucocutaneous lesions such as multiple facial trichilemmomas, oral
          mucosal papillomatosis with acral keratoses, or multiple palmoplantar keratoses. Major criteria
          include breast cancer, non-medullary thyroid cancer, macrocephaly, and endometrial carcinoma.
          Minor criteria include other thyroid lesions, intellectual disability, hamartomatous intestinal
          polyps, lipomas, fibromas, genitourinary tumors including renal cell carcinoma, genitourinary
          malformations, and uterine fibroids. A clinical diagnosis is met by a pathognomonic mucocutaneous
          pattern, two or more major criteria, one major plus at least three minor criteria, or four or
          more minor criteria.

          '
        diagnosis_term:
          preferred_term: clinical assessment
          term:
            id: NCIT:C124351
            label: Clinical Evaluation
      selected_evidence:
        snippet: 'Consensus clinical diagnostic criteria have been divided into three categories: pathognomonic,
          major, and minor.'
        supports: SUPPORT
