        context: []
      assertion_type: AnimalModel
      assertion:
        name: Epithelial-specific Pten deletion (colorectal juvenile polyposis)
        species: Mouse
        genotype: Intestinal-epithelium-specific conditional Pten deletion
        genes:
        - preferred_term: PTEN
          term:
            id: hgnc:9588
            label: PTEN
        description: 'Conditional deletion of Pten restricted to the colorectal epithelium. It is the
          first model to reproduce the colorectal juvenile polyposis of Cowden syndrome, and it settled
          a mechanistic question the human material could not: juvenile polyps had been attributed to
          somatic PTEN loss in the stroma, and this model shows epithelial loss alone is sufficient, with
          the stromal changes appearing as a consequence.'
        publication: PMID:24200851
        modeled_mechanisms:
        - target: Hamartoma Formation
          relationship: RECAPITULATES
          fidelity: HIGH
          description: Reproduces the full histopathology of Cowden colorectal juvenile polyps, including
            the stromal alterations and progression to invasive carcinoma.
          limitations: 'Single-tissue conditional model: it captures the colorectal manifestation and
            says nothing about the multi-system distribution of hamartomas that defines the syndrome clinically.
            Polyps form only after a long latency, so timing does not map onto the human course.'
          readouts:
          - name: Colorectal juvenile polyp formation and dysplastic transformation
            target: Hamartoma Formation
            direction: INCREASED
            interpretation: Histopathological readout matched feature-by-feature against human Cowden
              juvenile polyps.
      selected_evidence:
        snippet: Our transgenic model is the first to recapitulate colorectal juvenile polyposis in patients
          with CS. We conclude that stromal PTEN loss is not a prerequisite for the formation of juvenile
          polyps, and that colorectal juvenile polyps in CS are bona fide neoplastic precursor lesions.
        supports: SUPPORT
    origin:
      assertion_path: /animal_models/0
      evidence_path: /animal_models/0/evidence/0
      context_paths:
