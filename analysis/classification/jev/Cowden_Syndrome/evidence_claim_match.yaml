      assertion_type: Pathophysiology
      assertion:
        name: PTEN Loss and PI3K/AKT/mTOR Pathway Activation
        conforms_to: germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation
        description: 'PTEN (phosphatase and tensin homolog) is a tumor suppressor that dephosphorylates
          phosphatidylinositol-3,4,5-trisphosphate (PIP3) to PIP2, thereby inhibiting the PI3K/AKT/mTOR
          signaling axis. Germline loss-of-function mutations in PTEN lead to constitutive accumulation
          of PIP3 and unopposed activation of AKT and downstream mTOR complex 1 (mTORC1), resulting in
          excessive cell proliferation, survival, and growth that underlies hamartoma formation and elevated
          cancer risk across multiple organ systems.

          '
        cell_types:
        - preferred_term: Epithelial cell
          term:
            id: CL:0000066
            label: epithelial cell
        - preferred_term: Fibroblast
          term:
            id: CL:0000057
            label: fibroblast
        biological_processes:
        - preferred_term: PI3K/AKT signaling
          term:
            id: GO:0043491
            label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
          modifier: INCREASED
        - preferred_term: TOR signaling
          term:
            id: GO:0031929
            label: TOR signaling
          modifier: INCREASED
        - preferred_term: Cell proliferation
          term:
            id: GO:0008283
            label: cell population proliferation
          modifier: INCREASED
        - preferred_term: Negative regulation of apoptosis
          term:
            id: GO:0043066
            label: negative regulation of apoptotic process
          modifier: INCREASED
      selected_evidence:
        snippet: PTEN is located on chromosome 10q22-23 and negatively regulates the prosurvival PI3K/Akt/mTOR
          pathway through its lipid phosphatase activity. Loss of PTEN activates this pathway and leads
          to increased cellular growth, migration, proliferation, and survival.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/0
      evidence_path: /pathophysiology/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:18781191
      reference_title: PTEN hamartoma tumor syndromes.
      evidence_source: HUMAN_CLINICAL
      explanation: Directly establishes that PTEN loss leads to PI3K/AKT/mTOR hyperactivation driving
        cellular overgrowth, the central molecular mechanism of Cowden syndrome.
