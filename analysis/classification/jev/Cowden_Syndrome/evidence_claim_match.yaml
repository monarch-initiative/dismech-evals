      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: pten_sdhx_succinate_convergence
        hypothesis_label: PTEN loss and SDHx variants converge on reduced succinate dehydrogenase activity
        status: EMERGING
        description: 'Cowden and Cowden-like syndrome have genetically unrelated causes: PTEN loss of
          function, KLLN promoter hypermethylation, and SDHB/SDHD variants. This hypothesis proposes they
          converge biochemically, on reduced succinate dehydrogenase catalytic activity and consequent
          succinate accumulation. It matters because it would explain why clinically indistinguishable
          patients carry unrelated genotypes, and because it would give the PTEN-negative arm a mechanism
          rather than a list of candidate genes. The supporting data are one study of 21 mutation carriers.
          The proposed direction - that PTEN loss reduces SDH activity - has not been tested directly;
          the study measured the metabolite and inferred the enzyme.'
        notes: Not independently replicated. Recorded as EMERGING rather than ALTERNATIVE because it is
          not a competing account of the same data but a proposed extension covering cases the canonical
          PI3K/AKT/mTOR model does not reach.
      selected_evidence:
        snippet: Our data suggest that mutations in PTEN, SDHB, and SDHD reduce catalytic activity of
          succinate dehydrogenase, resulting in succinate accumulation, and identify a common biochemical
          alteration in these two patient populations
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
