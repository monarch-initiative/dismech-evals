        discussion_id: cs_surveillance_effectiveness
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Does the intensive multi-organ surveillance this entry recommends actually reduce cancer
          mortality in PTEN hamartoma tumour syndrome?
        attaches_to:
        - treatments#Enhanced Cancer Surveillance
        rationale: The surveillance programme is the central management recommendation of the entry and
          of the European guideline behind it, and it asks a great deal of patients - annual imaging across
          several organ systems, beginning young and continuing for life. The guideline that recommends
          it states that its effectiveness needs prospective evaluation. So the strongest treatment recommendation
          in this entry rests on the size of the underlying cancer risk plus the general case for early
          detection, not on evidence that this programme changes outcomes. Curators should not upgrade
          the treatment's evidence grading on the strength of guideline endorsement alone.
      selected_evidence:
        snippet: There is a need for prospective evaluation of the effectiveness of these recommendations
          in the PHTS population.
        supports: SUPPORT
