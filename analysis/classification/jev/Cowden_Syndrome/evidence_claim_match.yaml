      assertion:
        name: Neuronal Pten deletion (macrocephaly and social-behaviour phenotypes)
        species: Mouse
        genotype: Neuron-specific Pten deletion or mutation
        genes:
        - preferred_term: PTEN
          term:
            id: hgnc:9588
            label: PTEN
        description: Neuron-restricted Pten loss produces enlarged neuronal soma, dendritic hypertrophy,
          increased synaptic density, altered long-term potentiation and depression, and deficits in learning,
          memory and social behaviour. These are the cellular substrates of the macrocephaly and autism-spectrum
          features of Cowden syndrome, and they connect the entry's Neurodevelopmental Cortical Dysfunction
          node to measurable synaptic physiology rather than only to organoid morphology.
        publication: PMID:39812527
        modeled_mechanisms:
        - target: Neurodevelopmental Cortical Dysfunction
          relationship: RECAPITULATES
          fidelity: MODERATE
          description: Reproduces neuronal hypertrophy, altered synaptic plasticity, and social and learning
            deficits following Pten loss in neurons.
          limitations: Most published models delete Pten in neurons rather than modelling germline heterozygosity,
            so gene dosage is more severe than in patients. Rodent social-behaviour assays are proxies
            for human autism-spectrum features rather than measurements of them, and the evidence cited
            here is a review synthesising several models rather than one primary study.
          readouts:
          - name: Neuronal soma size, dendritic arborisation and synaptic density
            target: Neurodevelopmental Cortical Dysfunction
            direction: INCREASED
            interpretation: Structural correlates of macrocephaly and altered connectivity in Pten-deficient
              neurons.
      selected_evidence:
        snippet: These changes lead to deficits in learning and memory tasks, as well as impairments in
          social behaviors. PTEN mutations are associated with neurodevelopmental disorders like intellectual
          disability, epilepsy, and autism spectrum disorders accompanied by macrocephaly.
        supports: SUPPORT
