        snippet: The projected estimated lifetime risks of cancer in individuals with PHTS range from
          85 to 89% for any cancer, 67 to 85% for female breast cancer, 6 to 38% for thyroid cancer, 2
          to 28% for endometrial cancer, 2 to 34% for renal cancer, 9 to 20% for colorectal cancer and
          0 to 6% for melanoma.
        supports: SUPPORT
