      assertion_type: Diagnosis
      assertion:
        name: PTEN molecular genetic testing cascade
        description: 'Molecular confirmation of classic PHTS/Cowden syndrome is by identifying a heterozygous
          germline pathogenic PTEN variant. Testing should start with PTEN sequence analysis, then deletion/duplication
          analysis if sequencing is negative, and PTEN promoter sequencing if no pathogenic variant is
          found. If the phenotype remains Cowden-like without a PTEN finding, consider Cowden-like susceptibility
          mechanisms such as KLLN epimutation, SDHx, PIK3CA, AKT1, SEC23B, and WWP1 rather than treating
          them as equivalent to classic PTEN Cowden syndrome.

          '
        diagnosis_term:
          preferred_term: molecular genetic testing
          term:
            id: NCIT:C19770
            label: Molecular Analysis
      selected_evidence:
        snippet: Sequence analysis of <i>PTEN</i> is performed first and followed by gene-targeted deletion/duplication
          analysis if no pathogenic variant is found.
        supports: SUPPORT
