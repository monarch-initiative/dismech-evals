      assertion:
        discussion_id: cs_genotype_phenotype_replication
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Are the reported PTEN variant-class to organ-risk correlations real enough to stratify
          surveillance by?
        attaches_to:
        - genetic#PTEN
        rationale: Correlations have been reported between PTEN variant class and organ risk, with promoter
          variants linked to breast cancer and nonsense variants to colorectal cancer, and catalytically
          inactive but stable missense mutants reported as producing the most severe phenotypes. If they
          hold, they would let surveillance intensity be matched to variant class instead of applied uniformly,
          which directly affects the burden question raised in discussions#cs_surveillance_effectiveness.
          They are currently associations from individual cohorts without independent replication, and
          this entry does not act on them. Recorded so that a future curator finds the open question rather
          than re-deriving it.
      selected_evidence:
        snippet: We demonstrate that PTEN PVs are associated with significantly increased risk for a range
          of cancers.
        supports: SUPPORT
