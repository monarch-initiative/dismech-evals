              in the syndrome, and identifies a pathway dependency that can be removed to prevent it.
            limitations: Tumour acceleration requires constitutive Stat5 activation alongside Pten loss,
              which is an engineered cooperating lesion rather than something Cowden syndrome patients
              carry, so the model reports on a sensitised background rather than on germline PTEN heterozygosity
              alone. It is a single-organ model and says nothing about the thyroid, endometrial or renal
