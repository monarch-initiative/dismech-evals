              id: MONDO:0016063
              label: Cowden disease
        context: []
      assertion_type: Subtype
      assertion:
        name: Cowden Syndrome 4 (SDHB)
        description: 'Historical Cowden syndrome 4 designation for PTEN-negative Cowden-like syndrome
          associated with germline mutations in succinate dehydrogenase subunit B (SDHB). These variants
          are better framed as Cowden-like susceptibility genes rather than classic PTEN-defined Cowden
          syndrome causes. SDH mutations alter mitochondrial metabolism, stabilize HIF-1alpha through
          pseudohypoxia, and activate downstream PI3K/AKT/MAPK signaling in the absence of PTEN mutation.

          '
      selected_evidence:
        snippet: Germline SDH mutations/variants occur in a subset of PTEN mutation-negative CS/CS-like
          individuals and are associated with increased frequencies of breast, thyroid, and renal cancers
          beyond those conferred by germline PTEN mutations.
        supports: SUPPORT
    origin:
