        description: 'Vascular anomalies — including arteriovenous malformations (AVMs), arteriovenous
          fistulas, hemangiomas, and venous malformations — are recognised features of PHTS/Cowden syndrome,
          particularly affecting the extremities and central nervous system. They are thought to arise
          from PTEN-deficient endothelial proliferation and PI3K/AKT pathway dysregulation in the vascular
          bed. Spinal and intracranial AVMs have been reported and may produce neurological signs. The
          descriptor binds to AVM as the most consistently reported vascular lesion in CS case series;
          venous malformations and hemangiomas are also reported but lack a single covering term.

          '
        phenotype_term:
          preferred_term: Arteriovenous malformation
