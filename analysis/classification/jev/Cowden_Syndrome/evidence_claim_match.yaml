      assertion_type: Phenotype
      assertion:
        category: Clinical
        name: Developmental Delay and Intellectual Disability
        description: 'Global developmental delay and intellectual disability are common neurodevelopmental
          manifestations of PHTS/Cowden syndrome, particularly in the childhood-onset Bannayan-Riley-Ruvalcaba
          end of the spectrum. In a 47-patient pediatric PHTS chart-review cohort, macrocephaly with developmental
          delay, intellectual disability, and/or autism spectrum disorder was the most common presenting
          finding, occurring in 66% of patients. Cognitive impairment in PTEN mutation carriers ranges
          from mild language delays to moderate-severe global cognitive dysfunction; impairments in general
          cognitive ability are most common in PTEN-ASD cases but neurobehavioral variability is high
          across the PHTS spectrum.

          '
        phenotype_term:
          preferred_term: Global developmental delay
          term:
            id: HP:0001263
            label: Global developmental delay
      selected_evidence:
        snippet: impairments in general cognitive ability are only common in PTEN-ASD. For most neurobehavioral
          measures, variability within and across patient groups was very large, with some patients functioning
          in the average or above average range in most neurocognitive domains and other patients showing
          moderate to severe global cognitive dysfunction
        supports: SUPPORT
