      assertion_type: Subtype
      assertion:
        name: Cowden Syndrome 3 (PIK3CA)
        description: 'Historical Cowden syndrome 3 designation for PTEN-negative Cowden-like syndrome
          associated with activating germline variants in PIK3CA, the catalytic subunit of PI3-kinase.
          These variants are better framed as Cowden-like susceptibility genes rather than classic PTEN-defined
          Cowden syndrome causes. Reported variants result in elevated PIP3 and activated AKT, mimicking
          PTEN loss at the pathway level.

          '
      selected_evidence:
        snippet: Our observations suggest that PIK3CA and AKT1 are CS susceptibility genes.
        supports: SUPPORT
