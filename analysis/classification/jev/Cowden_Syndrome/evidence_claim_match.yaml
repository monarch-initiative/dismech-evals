  1671b19b0bbd1a8c1d41714d0534fd3bbb1945a0601398d576d6537832e63cbd:
    claim:
      about:
        disease:
          name: Cowden Syndrome
          disease_term:
            preferred_term: Cowden syndrome
            term:
              id: MONDO:0016063
              label: Cowden disease
        context: []
      assertion_type: Treatment
      assertion:
        name: mTOR Inhibitor Therapy
        description: 'Everolimus (RAD001), an mTORC1 inhibitor, targets the hyperactivated PI3K/AKT/mTOR
          pathway in Cowden syndrome. The mechanistic rationale stems directly from PTEN loss driving
          constitutive mTOR activation. A 6-month phase II placebo-controlled randomised trial of everolimus
          in 46 PHTS individuals (5-45 years) demonstrated that the drug is well tolerated; the primary
          neurocognitive endpoint was not met but several secondary neurobehavioral measures and EEG biomarkers
          showed signals of improvement, supporting continued investigation rather than routine clinical
          use.

          '
        treatment_term:
          preferred_term: mTOR inhibitor pharmacotherapy
          term:
            id: NCIT:C15986
            label: Pharmacotherapy
          therapeutic_agent:
          - preferred_term: mTOR inhibitor
            term:
              id: NCIT:C2201
              label: mTOR Inhibitor
          - preferred_term: everolimus
            term:
              id: CHEBI:68478
              label: everolimus
      selected_evidence:
        snippet: PTEN hamartoma tumor syndrome (PHTS) is a complex neurodevelopmental disorder characterized
          by mechanistic target of rapamycin (mTOR) overactivity. Limited data suggest that mTOR inhibitors
          may be therapeutic.
        supports: SUPPORT
