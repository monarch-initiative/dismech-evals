      assertion:
        name: Enhanced Cancer Surveillance
        description: 'PTEN mutation carriers require life-long intensified surveillance protocols. GeneReviews
          and ERN GENTURIS support organ-specific surveillance that includes breast awareness and clinical
          examination, annual breast MRI beginning around age 30 with mammography incorporated by age
          40, yearly thyroid ultrasound, dermatologic evaluation, baseline colonoscopy at age 35-40 with
          intervals based on findings, renal imaging from age 40, and earlier screening 5-10 years before
          the youngest cancer in a family when family history indicates. Endometrial surveillance should
          be framed as consideration rather than universal screening: GeneReviews recommends considering
          screening by age 35 with endometrial biopsy every 1-2 years and/or postmenopausal transvaginal
          ultrasound at clinician discretion, while ERN GENTURIS notes weak evidence and recommends symptom
          education or clinical-trial-based screening.

          '
        treatment_term:
          preferred_term: cancer surveillance
          term:
            id: NCIT:C15406
            label: Cancer Screening
      selected_evidence:
        snippet: Recommendations were put forward for surveillance for breast, thyroid and renal cancers.
          Limited recommendations were developed for other sites including endometrial, colon and skin.
        supports: SUPPORT
