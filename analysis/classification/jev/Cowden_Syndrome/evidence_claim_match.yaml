      assertion_type: Subtype
      assertion:
        name: Cowden Syndrome 1 (PTEN)
        description: 'Classic Cowden syndrome caused by germline loss-of-function mutations in PTEN on
          chromosome 10q22-23, accounting for approximately 80% of cases meeting strict clinical diagnostic
          criteria. Mutations include nonsense, frameshift, missense, splice-site variants, and large
          deletions.

          '
      selected_evidence:
        snippet: Although it was initially reported that approximately 80% of patients with Cowden syndrome
          had an identifiable germline PTEN mutation, more recent work has shown these diagnostic criteria
          to be far less specific.
        supports: SUPPORT
    origin:
      assertion_path: /has_subtypes/0
      evidence_path: /has_subtypes/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:24136893
      reference_title: 'Cowden syndrome and the PTEN hamartoma tumor syndrome: systematic review and revised
        diagnostic criteria.'
      evidence_source: HUMAN_CLINICAL
      explanation: Establishes PTEN mutation as the predominant genetic cause in Cowden syndrome 1, noting
        that original ~80% frequency estimates derived from clinically ascertained cohorts.
