      assertion_type: Biochemical
      assertion:
        name: Plasma succinate
        presence: INCREASED
        context: Elevated plasma succinate is the one biochemical finding reported to be shared across
          the genetically distinct causes of Cowden and Cowden-like syndrome. It was found in 62% of individuals
          carrying a germline PTEN, SDHB or SDHD mutation against 16% of controls, and in 67% of those
          with a pathogenic PTEN mutation against under 20% of mutation-negative individuals meeting the
          same clinical criteria. The authors interpret it as reduced succinate dehydrogenase catalytic
          activity common to both genotype groups. This is a single-centre finding on small numbers, has
          not been independently replicated, and is not in clinical use; it is curated because it is the
          only proposed unifying biomarker for the PTEN-positive and PTEN-negative arms of this entry.
        biomarker_term:
          preferred_term: succinate
          term:
            id: CHEBI:30031
            label: succinate(2-)
        notes: Denominators are small (21 mutation carriers). Treat this as an observation that generates
          a hypothesis rather than a usable marker; see mechanistic_hypotheses#pten_sdhx_succinate_convergence.
      selected_evidence:
        snippet: Elevated plasma succinate was observed in 13/21 (62%) individuals with germline PTEN,
          SDHB, or SDHD mutations as compared with 5/32 (16%) controls (P < 0.001), in 10/15 (67%) individuals
          with pathogenic PTEN mutations but in <20% of mutation-negative individuals meeting identical
          criteria
        supports: SUPPORT
    origin:
      assertion_path: /biochemical/0
      evidence_path: /biochemical/0/evidence/0
