  de507b6d97c7a5988d06394990649b74c34ac9d2d1258d9bcb2e6da35e0f3d30:
    claim:
      about:
        disease:
          name: Congenital Cranial Dysinnervation Disorder with Absent Corneal Reflex and Developmental
            Delay
          disease_term:
            preferred_term: congenital cranial dysinnervation disorder with absent corneal reflex and
              developmental delay
            term:
              id: MONDO:0957563
              label: cranial dysinnervation disorder, congenital, with absent corneal reflex and developmental
                delay
        context: []
      assertion_type: Genetic
      assertion:
        name: NEUROG1
        gene_term:
          preferred_term: NEUROG1
          term:
            id: hgnc:7764
            label: NEUROG1
        association: NEUROG1 (5q31.1) encodes neurogenin 1, a proneural class II basic helix-loop-helix
          transcription factor. It is a single-exon gene encoding a 237-residue protein whose bHLH domain
          spans residues 92-144. It is the only gene associated with this disorder, and the disorder is
          the only human phenotype associated with the gene.
        relationship_type: CAUSATIVE
        variants:
        - name: NEUROG1 whole-gene deletion (5q31.1, 115 kb)
          description: Homozygous 115 kb deletion of 5q31.1 removing NEUROG1 together with DCNP1 and TIFAB,
            in a consanguineous Turkish family. The two co-deleted genes were argued against as candidates
            on expression and function grounds.
          clinical_significance: PATHOGENIC
        - name: NEUROG1 c.347G>T p.(Arg116Leu)
          description: Homozygous missense substitution inside the bHLH domain, reported in 2015 in a
            Middle Eastern child with corneal opacity, absent corneal reflex and mild intellectual disability.
            This entry cites the 2023 review of the series rather than the primary report, which is a
            large exome-screening paper that does not name the variant in its abstract.
          clinical_significance: PATHOGENIC
        - name: NEUROG1 c.202G>T p.(Glu68*)
          description: Homozygous nonsense allele identified by trio-exome sequencing in a Portuguese
            boy. A premature stop upstream of the bHLH domain is what establishes the mechanism as loss
            of function rather than a dominant-negative or neomorphic effect.
          clinical_significance: PATHOGENIC
        - name: NEUROG1 c.228_231dup p.(Thr78ProfsTer122)
          description: Homozygous four-base-pair duplication causing a frameshift, in two Indian sisters.
            The authors note that this allele is predicted to escape nonsense-mediated decay, and build
            their proposed explanation of the autism phenotype on that prediction; the prediction is in
            silico and the protein was never assayed.
          clinical_significance: LIKELY_PATHOGENIC
      selected_evidence:
        snippet: Our findings support the growing compelling evidence that loss of NEUROG1 leads to a
          very distinctive disorder of cranial nerves development.
        supports: SUPPORT
    origin:
      assertion_path: /genetic/0
      evidence_path: /genetic/0/evidence/0
      context_paths:
