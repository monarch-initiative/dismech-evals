          for the eighth nerve, and stenosis where that nerve is absent is the expected finding, but no
          source cited in this entry states that causal step for these patients - the reports record the
          two findings side by side on the same scan. Drawing the edge would be inference from general
          otology rather than from the evidence to hand.'
