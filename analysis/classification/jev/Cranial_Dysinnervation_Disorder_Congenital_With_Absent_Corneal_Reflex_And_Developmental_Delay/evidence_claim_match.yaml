              developmental delay
            term:
              id: MONDO:0957563
              label: cranial dysinnervation disorder, congenital, with absent corneal reflex and developmental
                delay
        context: []
      assertion_type: ClinicalBurden
      assertion:
        burden_level: HIGH
        rationale: 'Profound congenital deafness that did not respond to bilateral cochlear implantation,
          combined with an anaesthetic cornea that opacifies and ulcerates, an inability to chew requiring
          a modified diet, and global developmental delay. Two of the deficits are sensory channels that
          normally substitute for each other, so their combined loss bears on language acquisition in
          a way neither would alone: the first reported patient had no speech acquisition after bilateral
          implantation.

          The burden level is graded from the reported clinical features alone, because nothing else exists
          to grade it from. None of the three published clinical reports of this disorder - all single-family
          case descriptions, between them covering four families - carries a mortality, life-expectancy,
          quality-of-life or care-cost measure. A PubMed search pairing the gene with mortality, survival,
          life-expectancy, quality-of-life and cost terms returned no study of this disorder - the hits
          are cancer-methylation biomarker work, avian genomics and zebrafish toxicology, none of which
          concerns the human phenotype.'
      selected_evidence:
        snippet: At age 4 years, he was fitted with a cochlear implant on the right, but again without
          improving hearing or speech.
        supports: SUPPORT
    origin:
      assertion_path: /clinical_burden
