      assertion_type: DifferentialDiagnosis
      assertion:
        name: Moebius syndrome and its variants
        description: The first report frames this disorder as a Moebius syndrome variant, and the two
          overlap in feeding difficulty, deafness and motor delay. Classical Moebius is defined by sixth-
          and seventh-nerve involvement - facial palsy with limited ocular abduction - which is not what
          these patients have. The NEUROG1 disorder affects the fifth and eighth nerves instead, which
          is why it is a variant rather than the syndrome.
      selected_evidence:
        snippet: Some authors also include Moebius syndrome, which is defined by affection of cranial
          nerves VI and VII, and the Moebius syndrome variants (predominant affection of cranial nerves
          other than VI and VII) in the entity of CCDD
        supports: SUPPORT
