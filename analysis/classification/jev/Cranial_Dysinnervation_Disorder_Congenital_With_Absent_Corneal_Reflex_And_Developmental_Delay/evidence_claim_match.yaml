          and a missense substitution, and they converge on the same target: all disrupt the bHLH domain,
          which carries both the basic region that binds the E-box and the helix-loop-helix region that
          mediates dimerization. A whole-gene deletion and a point lesion producing the same disorder
          is what identifies the mechanism as loss of function.'
