      assertion:
        name: Trigeminal Sensory Ganglion and Nerve Deficiency
        biological_scale: TISSUE
        description: 'Loss of the trigeminal sensory neurons, removing the afferent limb of the fifth
          cranial nerve.

          In humans this node is inferred functionally rather than demonstrated anatomically in most patients.
          Corneal anaesthesia with an absent corneal reflex is present across the reported series, and
          oromotor dysfunction is too, but a structural abnormality of the fifth nerve has been described
          in only one reported patient, and the authors of the fourth report state explicitly that their
          two patients had no fifth-nerve abnormality on imaging. The functional deficit and the imaging
          finding therefore do not track each other, and this entry records the functional claim.'
        locations:
        - preferred_term: trigeminal ganglion
          term:
            id: UBERON:0001675
            label: trigeminal ganglion
        - preferred_term: trigeminal nerve
          term:
            id: UBERON:0001645
            label: trigeminal nerve
        biological_processes:
        - preferred_term: trigeminal ganglion development
          modifier: ABNORMAL
          term:
            id: GO:0061551
            label: trigeminal ganglion development
        - preferred_term: trigeminal nerve development
          modifier: ABNORMAL
          term:
            id: GO:0021559
            label: trigeminal nerve development
      selected_evidence:
        snippet: The inability to chew and swallow, deafness and balance disorder represented congenital
          palsies of cranial nerves V (trigeminal nerve) and VIII (vestibulo-cochlear nerve) and thus
          a congenital cranial dysinnervation disorder.
        supports: SUPPORT
