              developmental delay
            term:
              id: MONDO:0957563
              label: cranial dysinnervation disorder, congenital, with absent corneal reflex and developmental
                delay
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Failure of Proneural Commitment in the Cranial Sensory Placodes
        biological_scale: CELLULAR
        description: 'Neurogenin 1 is expressed by placodal ectodermal cells and acts before neuroblast
          delamination, switching on a cascade of downstream bHLH factors (NeuroD, MATH3, NSCL1) that
          carries the commitment forward. The step it controls is determination, not migration or axon
          guidance, which is what separates this disorder from the CCDDs caused by axon-pathfinding genes.

          The division of labour between the two neurogenins is what makes the phenotype selective: NEUROG1
          specifies the proximal ganglia, which arise from the trigeminal and otic placodes and the neural
          crest, while NEUROG2 specifies the distal, epibranchial-placode-derived ganglia. Only the proximal
          set is lost.'
        cell_types:
        - preferred_term: cranial sensory placodal cell
          term:
            id: CL:0000032
            label: neuroplacodal cell
        locations:
        - preferred_term: trigeminal placode
          term:
            id: UBERON:0003070
            label: trigeminal placode complex
        - preferred_term: otic placode
          term:
            id: UBERON:0003069
            label: otic placode
        biological_processes:
        - preferred_term: neuron fate commitment
          modifier: DECREASED
          term:
            id: GO:0048663
            label: neuron fate commitment
        - preferred_term: cranial ganglion development
          modifier: ABNORMAL
          term:
            id: GO:0061550
            label: cranial ganglion development
      selected_evidence:
        snippet: ngn1 is expressed by placodal ectodermal cells and acts prior to neuroblast delamination.
        supports: SUPPORT
