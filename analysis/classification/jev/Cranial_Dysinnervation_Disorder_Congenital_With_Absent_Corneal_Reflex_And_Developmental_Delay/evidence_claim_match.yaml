          patients with biallelic NEUROG1 loss survive into childhood and beyond with a modified diet.
          What accounts for the difference, and what does it mean for reading mouse data onto the human
          disorder?
        attaches_to:
        - pathophysiology#Trigeminal Sensory Ganglion and Nerve Deficiency
        - animal_models#Neurog1-null mouse
        rationale: 'This is the central translational question for the entry, because the mouse null is
          where the mechanism comes from - it long predates the first human case and every human report
          argues from it.

          The mouse dies as a neonate, unable to suckle and with no milk in the stomach, and the lethality
          has been attributed to the absent trigeminal ganglia depriving suckling of sensory innervation.
          Human patients have the corresponding deficit - they cannot chew and need mashed food - and
          it is not lethal. Two explanations are open and are not distinguished by any source cited here.
          Either the human lesion is quantitatively milder, which is consistent with human fifth-nerve
          involvement being functional rather than anatomical in most patients and with the mouse showing
          outright truncation of nerve V; or the mouse and the human differ in how much a neonate depends
          on trigeminal sensation to feed, in which case the human survives a lesion of the same depth.

          The distinction matters for every inference this entry draws from the model. The eighth-nerve
          and inner-ear links are on firm ground because the human imaging matches the mouse anatomy directly.
          The fifth-nerve link is not: it is carried in humans by a clinical sign, and the one place the
          mouse gives a hard anatomical endpoint is the place the human phenotype most clearly diverges.'
      selected_evidence:
        snippet: These mice showed absence of milk in their stomach, suggesting a suckling defect and
          died as neonates within 12 h of birth
        supports: SUPPORT
