        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cdcrdd_central_neurodevelopmental_features_unexplained
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Are the developmental delay, autism and hypotonia direct consequences of NEUROG1 loss
          in the central nervous system, or downstream of combined deafness, corneal disease and feeding
          difficulty?
        attaches_to:
        - phenotypes#Global Developmental Delay
        - phenotypes#Autism
        - phenotypes#Hypotonia
        rationale: 'Developmental delay is reported in every family and is in the disorder''s name, yet
          nothing in this entry''s pathograph reaches it. That is deliberate.

          A direct central mechanism is plausible - NEUROG1 and NEUROG2 have overlapping expression in
          the developing brain - but the argument offered for the autism phenotype is a chain of predictions:
          a frameshift allele predicted to escape nonsense-mediated decay, producing an abnormal protein
          predicted to act on downstream targets, some of which are autism-associated in a database. No
          protein was assayed, and the authors themselves record that they could not obtain a sample to
          test it.

          The competing explanation is not excluded either. These children are profoundly deaf with no
          benefit from implantation, have an unstable ocular surface, and cannot chew; severe delay in
          language and adaptive milestones is what combined sensory deprivation produces on its own. Distinguishing
          the two would need either a functional assay of the mutant protein or developmental outcomes
          in a patient whose sensory deficits were mitigated early, and neither exists.'
      selected_evidence:
        snippet: Whilst analysis of the NEUROG1 protein expression using Western blot could have helped
          to test this hypothesis, the patient’s guardians were lost to follow-up and re-sampling could
          not been carried out for this analysis.
        supports: SUPPORT
