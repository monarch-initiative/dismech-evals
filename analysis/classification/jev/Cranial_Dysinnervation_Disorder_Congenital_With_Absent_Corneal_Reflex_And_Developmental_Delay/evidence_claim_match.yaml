        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cdcrdd_facial_and_bony_findings_unconnected
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what route does a proneural bHLH lesion in the cranial sensory placodes produce an
          expressionless face and a narrow internal auditory canal?
        attaches_to:
        - phenotypes#Mask-like Facies
        - phenotypes#Narrow Internal Auditory Canal
        rationale: 'Both findings are present in every reported family and neither is connected in the
          pathograph.

          For the face, the only proposed route is that trigeminal dysinnervation produces the atypical
          facial appearance, and it is offered speculatively. Facial expression is a seventh-nerve function,
          the seventh nerve is not reported as affected in any of these patients, and the geniculate ganglion
          is epibranchial and therefore NEUROG2-dependent rather than NEUROG1-dependent - so the obvious
          edge is probably the wrong one. An alternative that no source addresses is that an expressionless
          face in a child who does not blink, does not hear, and cannot move the mouth normally is a composite
          observation rather than a single sign.

          For the canal, the expected explanation is that the bony conduit fails to develop around an
          absent nerve. This is standard otology and is very likely right, but no source cited here states
          it for these patients; the reports record the narrow canal and the absent nerve as two findings
          on one scan.'
      selected_evidence:
        snippet: Dysinnervation of this nerve may likely result in atypical facial features.
        supports: SUPPORT
