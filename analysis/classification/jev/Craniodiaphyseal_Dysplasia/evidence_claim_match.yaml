              id: MONDO:0021021
              label: craniodiaphyseal dysplasia, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Unfolded Protein Response in Osteocytes
        description: 'In a transgenic mouse, activation of the unfolded protein response in early differentiating
          osteocytes delays their maturation, keeps them in an active bone-synthesizing state, and delays
          or suppresses Sost expression. Whether retained mutant sclerostin triggers this response in
          patients is an emerging hypothesis supported only by the mouse model.

          '
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: osteocyte
          term:
            id: CL:0000137
            label: osteocyte
        biological_processes:
        - preferred_term: endoplasmic reticulum unfolded protein response
          modifier: INCREASED
          term:
            id: GO:0030968
            label: endoplasmic reticulum unfolded protein response
      selected_evidence:
        snippet: We showed that in a transgenic mouse model, activation of the UPR in early differentiating
          osteocytes delays maturation, maintaining active bone synthesis. In addition, expression of
          SOST is delayed or suppressed; resulting in active WNT signaling and enhanced periosteal bone
          formation, and the combined outcome is generalized hyperostosis.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
