            id: HP:0000006
            label: Autosomal dominant inheritance
        description: 'Dominant transmission was first proposed from an affected mother and son, and heterozygous
          SOST signal-peptide variants were later identified in two children with craniodiaphyseal dysplasia.
          Most cases appear sporadic, and an apparently mildly affected mother of a severely affected
          boy was suggested to carry the variant in mosaic form.

          '
      selected_evidence:
        snippet: Distinguishing features in these two patients as contrasted to previously described cases
          include a greater degree of hyperostosis and sclerosis than that described for other patients
          with craniodiaphyseal dysplasia, apparent dominant transmission, and significant metaphyseal
          involvement.
        supports: SUPPORT
