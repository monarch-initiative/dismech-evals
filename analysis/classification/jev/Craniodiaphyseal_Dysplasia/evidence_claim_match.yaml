            term:
              id: MONDO:0021021
              label: craniodiaphyseal dysplasia, autosomal dominant
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: SOST Signal Peptide Variant with Impaired Sclerostin Secretion
        description: 'Heterozygous missense variants at codon 21 of SOST (c.61G>A, p.Val21Met; c.61G>T,
          p.Val21Leu) lie in the secretion signal peptide of sclerostin. Expressed in cultured cells,
          both variants greatly reduce sclerostin secretion, and the dominant inheritance of the disorder,
          in contrast to the recessive SOST disorders, suggests that the mutant protein interferes with
          secretion of the wild-type product.

          '
        biological_scale: MOLECULAR
        genes:
        - preferred_term: SOST
          term:
            id: hgnc:13771
            label: SOST
        genetic_context:
          gene:
            preferred_term: SOST
            term:
              id: hgnc:13771
              label: SOST
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          functional_impact_category: DOMINANT_NEGATIVE
          description: Heterozygous signal-peptide missense variants p.Val21Met and p.Val21Leu, found
            in two children with craniodiaphyseal dysplasia; the dominant-negative mechanism is proposed
            by the authors from the inheritance pattern and the secretion defect.
        biological_processes:
        - preferred_term: sclerostin secretion
          modifier: DECREASED
          term:
            id: GO:0009306
            label: protein secretion
      selected_evidence:
        snippet: As these mutations are located in the secretion signal of the SOST gene, we tested their
          effect on secretion by transfecting the mutant constructs into 293E cells. Intriguingly, these
          mutations greatly reduced the secretion of SOST.
        supports: SUPPORT
