            preferred_term: craniodiaphyseal dysplasia, autosomal dominant
            term:
              id: MONDO:0021021
              label: craniodiaphyseal dysplasia, autosomal dominant
        context: []
      assertion_type: MechanisticHypothesis
      assertion:
        hypothesis_group_id: osteocyte_upr_sost_suppression
        hypothesis_label: Misfolded signal-peptide sclerostin activates the unfolded protein response
          in osteocytes, delaying their maturation and suppressing SOST
        status: EMERGING
        description: The SOST signal-peptide variants impair protein folding and secretion. A transgenic
          mouse in which the unfolded protein response is activated in early osteocytes develops generalized
          hyperostosis with delayed osteocyte maturation and delayed or suppressed Sost expression, a
          phenotype the authors judge highly consistent with craniodiaphyseal dysplasia, and the hyperostosis
          is suppressed by a chemical chaperone. The model does not carry a SOST variant, so whether endoplasmic
          reticulum stress contributes to the human disease beyond the direct loss of secreted sclerostin
          is unresolved.
      selected_evidence:
        snippet: As the phenotype is highly consistent with craniodiaphyseal dysplasia (CDD; OMIM 122860),
          we propose activation of the UPR could be part of the disease mechanism for CDD patients as
          these patients are heterozygous for SOST mutations that impair protein folding and secretion.
        supports: SUPPORT
    origin:
      assertion_path: /mechanistic_hypotheses/0
      evidence_path: /mechanistic_hypotheses/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:28973168
      reference_title: Activating the unfolded protein response in osteocytes causes hyperostosis consistent
        with craniodiaphyseal dysplasia.
      evidence_source: MODEL_ORGANISM
      explanation: States the hypothesis and the mouse-phenotype basis on which it rests.
