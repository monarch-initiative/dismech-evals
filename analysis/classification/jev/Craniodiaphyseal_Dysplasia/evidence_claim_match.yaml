      assertion:
        name: Progressive Craniofacial Hyperostosis with Foraminal Encroachment
        description: 'Relentless bone deposition thickens the calvaria, skull base and facial bones, obliterating
          the paranasal sinuses and progressively narrowing the craniofacial foramina, nasal passages,
          nasolacrimal ducts and the cranial cavity itself. Cranial nerves, the brain and the craniocervical
          junction are compressed as a result.

          '
        biological_scale: TISSUE
        locations:
        - preferred_term: skull
          term:
            id: UBERON:0003129
            label: skull
      selected_evidence:
        snippet: The clinical course is typically characterized by progressive encroachment of the craniofacial
          foramina and brain by the relentless deposition of bone. Compression of cranial nerves, the
          foramen magnum, and intracranial contents commonly leads to blindness, loss of hearing, and
          death.
        supports: SUPPORT
