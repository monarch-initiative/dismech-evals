          dysplasia 16 (MONDO:0014915, OMIM:617102), which MONDO classifies under both cranioectodermal
          dysplasia and Jeune syndrome. That term is bound here because the index patient''s phenotype
          was reported as significantly overlapping CED type I; the Jeune entry does not bind it.

          '
      selected_evidence:
        snippet: Whole-exome sequencing revealed a homozygous nonsense variant p.R142* in IFT52 encoding
          an IFT-B core complex protein as the probable cause of her condition.
        supports: SUPPORT
