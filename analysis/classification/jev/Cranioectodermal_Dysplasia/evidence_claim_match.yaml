          preferred_term: cranioectodermal dysplasia 6
          term:
            id: MONDO:0979883
            label: cranioectodermal dysplasia 6
        genes:
        - preferred_term: CILK1
          term:
            id: hgnc:21219
            label: CILK1
        description: 'Caused by a biallelic variant in the C-terminal non-catalytic domain of CILK1, the
          ciliogenesis-associated kinase. CILK1 is not an intraflagellar transport subunit, so this subtype
          is the first non-IFT molecular cause of CED; the affected domain is the one that mediates interaction
          with the IFT-B complex. Biallelic variants in the CILK1 catalytic domain instead cause perinatal-lethal
          skeletal ciliopathies (endocrine-cerebro-osteodysplasia, short-rib polydactyly syndrome), which
          are separate diseases.

          '
      selected_evidence:
        snippet: We present a homozygous frameshift variant in the CILK1 gene that affects the distal
          part of the non-catalytic domain, causing CED in five patients from two pedigrees.
        supports: SUPPORT
