        description: A 37-year-old woman with congenital sensorineural hearing loss, dystopia canthorum,
          a flat facial profile, ulnar deviation with digit contractures and fifth-finger clinodactyly
          — features overlapping both CDHS and Waardenburg syndrome type 3 — had no mutation in any PAX3
          coding exon or splice boundary, with whole-gene deletion excluded by SNP heterozygosity. Craniofacial
          CT showed markedly hypoplastic-to-aplastic paranasal sinuses, underdeveloped mastoids and small
          cochleae with only 1.5 turns, findings not previously associated with Waardenburg syndrome.
          This case raises the possibility of locus heterogeneity within the CDHS-like phenotype.
        distinguishing_features:
        - Normal hand and wrist radiographs and normal nasal bones on CT — the two radiographic features
          that define CDHS.
        - Paranasal sinus, mastoid and cochlear anomalies not described in CDHS.
        - No detectable PAX3 coding or splice-site lesion, with whole-gene deletion excluded.
      selected_evidence:
        snippet: Here we describe a woman who shares some, but not all features of WS type 3 and CDHS,
          and who also has abnormal cranial bones. All sinuses were hypoplastic, and the cochlea were
          small. No sequence alteration in PAX3 was found.
        supports: SUPPORT
