          term:
            id: UBERON:0001846
            label: internal ear
        biological_processes:
        - preferred_term: inner ear morphogenesis
          term:
            id: GO:0042472
            label: inner ear morphogenesis
          modifier: ABNORMAL
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: Lineage tracing and in situ hybridization show that Pax3+ derivatives contribute to S100+,
          Kir4.1+ and Dct+ melanocytes (intermediate cells) in the developing stria vascularis, all of
          which are significantly diminished in Pax3 mutant animals.
        supports: SUPPORT
