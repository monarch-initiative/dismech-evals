        name: PAX3 sequencing and deletion/duplication analysis
        description: Molecular confirmation rests on PAX3 analysis. Sanger or exome sequencing of the
          coding exons and flanking intronic boundaries detects the paired-domain missense alleles; because
          a whole-gene 2q36.1 deletion has produced an overlapping phenotype, chromosomal microarray or
          another copy-number method should be paired with sequencing rather than used only after a negative
          sequencing result. Whole-exome sequencing has the added value of excluding phenocopies, as when
          more than 100 congenital-heart-disease genes were screened in the patient with patent ductus
          arteriosus.
