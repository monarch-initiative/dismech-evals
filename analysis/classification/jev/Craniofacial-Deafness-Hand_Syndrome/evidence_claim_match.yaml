              label: craniofacial-deafness-hand syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cdhs_pax3_null_vs_missense_model_fidelity
        kind: HUMAN_MODEL_MISMATCH
        status: OPEN
        prompt: Does murine Pax3 loss of function model the CDHS craniofacial phenotype, given that the
          splotch mouse is dominated by neural tube closure defects while the human paired-domain missense
          phenotype is dominated by midfacial skeletal hypoplasia with no reported neural tube defect?
        rationale: Every mechanistic claim about CDHS craniofacial development is extrapolated from Pax3
          loss-of-function models, but the direction of the mismatch is substantive rather than cosmetic.
          The murine models are null or severely-hypomorphic alleles whose signature phenotype is exencephaly
          and spina bifida; the human CDHS alleles are paired-domain missense substitutions that the founding
          report proposed to be MORE damaging than the loss-of-function alleles causing Waardenburg syndrome
          type 1, and CDHS patients have not been reported with neural tube defects. A null-allele model
          therefore cannot test the allele-class hypothesis that defines CDHS, and its craniofacial readout
          cannot be assumed to correspond to the human midfacial phenotype. The cochlear melanocyte arm
          of the mechanism is on firmer ground because the murine phenotype (loss of stria vascularis
          intermediate cells) maps directly onto the shared human feature of sensorineural hearing loss.
        attaches_to:
        - pathophysiology#Cranial Neural Crest Patterning Failure
        - pathophysiology#Craniofacial Skeletal Hypoplasia
        proposed_experiments:
        - experiment_id: exp_cdhs_pax3_n47k_knockin_vs_null
          name: Pax3 N47K knock-in versus null allele phenotype comparison
          description: Generate a knock-in mouse carrying the orthologous Pax3 N47K substitution and compare
            its craniofacial, otic and limb phenotypes against a Pax3 null allele on the same genetic
            background, to test directly whether the CDHS allele class acts by a mechanism distinct from
            haploinsufficiency.
        - experiment_id: exp_cdhs_pax3_allele_biochemistry
          name: Comparative DNA-binding and transactivation assay of CDHS versus Waardenburg alleles
          description: Assay DNA binding, target-gene occupancy and transactivation of PAX3 N47K and T31P
            against wild-type protein and against the Waardenburg-associated N47H protein, to determine
            whether the CDHS alleles are hypomorphic, dominant-negative or neomorphic.
      selected_evidence:
        snippet: The splotch (Sp) mouse mutant displays defects in neural tube closure in the form of
          exencephaly and spina bifida.
        supports: SUPPORT
    origin:
      assertion_path: /discussions/0
      evidence_path: /discussions/0/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:8421686
      reference_title: A mutation within intron 3 of the Pax-3 gene produces aberrantly spliced mRNA transcripts
