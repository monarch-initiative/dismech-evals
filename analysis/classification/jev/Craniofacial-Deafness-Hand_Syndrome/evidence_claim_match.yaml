      assertion:
        name: PAX3-Related Waardenburg Syndrome
        disease_term:
          preferred_term: Waardenburg syndrome
          term:
            id: MONDO:0018094
            label: Waardenburg syndrome
        description: The principal differential, and allelic at the same locus. Waardenburg syndrome type
          1 shares sensorineural hearing loss, dystopia canthorum and a broad nasal bridge; type 3 (Klein-Waardenburg)
          adds upper-limb musculoskeletal abnormalities that can closely mimic the CDHS hand phenotype,
          and is caused by a different substitution at the very codon mutated in CDHS.
        distinguishing_features:
        - CDHS shows absent or hypoplastic nasal bones and a hypoplastic ulnar styloid over a normal calvarium,
          an imaging combination not seen in Waardenburg syndrome.
        - The founding CDHS family lacked the pigmentary stigmata (white forelock, heterochromia iridis,
          skin depigmentation) that characterize Waardenburg syndrome.
        - CDHS alleles are paired-domain missense substitutions, whereas most Waardenburg syndrome type
          1 alleles are loss-of-function.
      selected_evidence:
        snippet: The imaging findings and distinct facial features was felt to distinguish CDHS from WS
          type 3.
        supports: SUPPORT
