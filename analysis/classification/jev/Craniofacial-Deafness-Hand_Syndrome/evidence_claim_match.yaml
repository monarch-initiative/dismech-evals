          survival, migration and differentiation of neural crest cells. Disrupted PAX3 transcriptional
          output during the narrow embryonic window of neural crest patterning is the proposed common
          origin of the CDHS triad: the craniofacial skeleton, the melanocytic component of the inner
          ear, and — in the one reported case with cardiac involvement — the cardiac outflow tract are
          all neural-crest derivatives. This node is inferred from PAX3 developmental biology and model-organism
          data rather than from tissue studies of CDHS patients.'
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: migratory cranial neural crest cell
          term:
            id: CL:0000008
            label: migratory cranial neural crest cell
