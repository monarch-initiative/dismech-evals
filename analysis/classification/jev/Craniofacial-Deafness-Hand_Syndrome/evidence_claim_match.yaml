        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Altered Paired-Domain DNA Recognition
        description: The paired domain comprises two helix-turn-helix subdomains whose C-terminal recognition
          helices make base-specific contacts in the DNA major groove. Substitution of a basic residue
          for the asparagine at position 47 — a residue conserved across all known murine Pax and human
          PAX genes — perturbs this base-specific readout. The resulting change in PAX3 transcriptional
          output is proposed to be more damaging than the haploinsufficiency produced by the missense,
          frameshift and deletion alleles that cause Waardenburg syndrome type 1, which is the mechanistic
          rationale for the distinct CDHS phenotype.
        biological_scale: MOLECULAR
        molecular_functions:
        - preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
          modifier: ABNORMAL
        mechanism_confidence: HYPOTHETICAL
      selected_evidence:
        snippet: Substitution of a basic amino acid for asparagine at residue 47, conserved in all known
          murine Pax and human PAX genes, appears to have a more drastic effect on the phenotype than
          missense, frameshift and deletion mutations of PAX3 that cause Waardenburg syndrome type 1.
        supports: SUPPORT
