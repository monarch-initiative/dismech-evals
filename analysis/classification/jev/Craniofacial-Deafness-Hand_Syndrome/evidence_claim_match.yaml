        context: []
      assertion_type: Pathophysiology
      assertion:
        name: PAX3 Paired-Domain Missense Variant
        description: 'CDHS is caused by heterozygous missense substitution within the paired domain, the
          N-terminal sequence-specific DNA-binding module of the PAX3 transcription factor. The founding
          family carries Asn47Lys (N47K) in exon 2; a second, unrelated patient carries p.Thr31Pro (c.A91C)
          in the same domain. The identity of the substitution matters: a different substitution at the
          very same codon, Asn47His, causes Waardenburg syndrome type 3 rather than CDHS, so CDHS is defined
          by an allele class rather than simply by PAX3 dysfunction.'
        biological_scale: MOLECULAR
        genes:
        - preferred_term: PAX3
          term:
            id: hgnc:8617
            label: PAX3
        molecular_functions:
        - preferred_term: sequence-specific DNA binding
          term:
            id: GO:0043565
            label: sequence-specific DNA binding
          modifier: DECREASED
      selected_evidence:
        snippet: In a family of three affected individuals with this syndrome, a mother and two children,
          a missense mutation (Asn47Lys) in the paired domain of PAX3 was initially detected by SSCP analysis.
        supports: SUPPORT
