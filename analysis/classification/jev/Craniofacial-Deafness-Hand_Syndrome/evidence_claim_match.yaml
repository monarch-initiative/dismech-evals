      assertion:
        name: Cochlear Melanocyte Deficiency
        description: Cochlear melanocytes are the intermediate cells of the stria vascularis and generate
          the endocochlear potential on which mechanotransduction depends. They derive from neural crest,
          and in the mouse they arise from Pax3-traced melanoblasts and Plp1-traced Schwann cell precursors.
          Loss of Pax3 in the mouse significantly diminishes these cells, providing the leading mechanism
          for the profound sensorineural hearing loss shared by CDHS and the other PAX3-related disorders.
          This node rests on model-organism evidence; the cochlea has not been examined in a CDHS patient.
        biological_scale: CELLULAR
        cell_types:
        - preferred_term: cochlear melanocyte (stria vascularis intermediate cell)
          term:
            id: CL:0000148
            label: melanocyte
        locations:
