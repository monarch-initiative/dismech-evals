      assertion:
        name: Autosomal dominant
        inheritance_term:
          preferred_term: autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
        description: CDHS segregates as an autosomal dominant trait. In the founding family the phenotype
          was transmitted from an affected mother to two of her children, giving three affected individuals
          across two generations. The two later molecularly characterized patients (a PAX3 p.Thr31Pro
          missense variant and a de novo 2q36.1 deletion encompassing PAX3) were simplex cases with unaffected
          parents, so both inherited and de novo dominant mechanisms are documented.
      selected_evidence:
        snippet: Because of three affected family members in two generations and a phenotype of midfacial
          anomalies and dystopia canthorum resembling Waardenburg syndrome, a search for mutations in
          the PAX3 gene was undertaken.
        supports: SUPPORT
