        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cdhs_cardiovascular_association_single_case
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is the cardiovascular involvement reported in one CDHS patient (patent ductus arteriosus
          with secondary pulmonary hypertension) a genuine part of the CDHS phenotypic spectrum, or a
          coincidental finding in a single patient?
        rationale: The association rests on one 21-year-old patient with a novel PAX3 p.Thr31Pro variant.
          The argument for causality is reasonable — more than 100 congenital-heart-disease genes were
          screened without an alternative explanation, and PAX3 is expressed in cardiac neural crest,
          whose derivatives build the outflow tract — but it remains a single unreplicated case, and no
          cardiac assessment was reported for the founding family. Resolving this matters practically,
          because it determines whether echocardiography belongs in the baseline evaluation of every newly
          diagnosed patient.
        attaches_to:
        - pathophysiology#Cranial Neural Crest Patterning Failure
        proposed_experiments:
        - experiment_id: exp_cdhs_systematic_echocardiography
          name: Systematic echocardiographic screening of ascertained CDHS patients
          description: Perform echocardiography on surviving members of the founding N47K family and on
            any newly ascertained CDHS patient, and report the result whether positive or negative, so
            that the denominator for the cardiovascular association becomes interpretable.
      selected_evidence:
        snippet: The genetic findings provided a definitive diagnosis of Craniofacial-Deafness-Hand Syndrome,
          an extremely rare autosomal dominant condition, but found no variants that explain the patient's
          cardiac phenotype.
        supports: SUPPORT
