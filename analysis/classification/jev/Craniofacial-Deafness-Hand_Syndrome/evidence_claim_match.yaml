  3d0ee9a8f28b7d0b1b9c25a9a85de70f43d06b8894d615826cf071e1635831ee:
    claim:
      about:
        disease:
          name: Craniofacial-Deafness-Hand Syndrome
          disease_term:
            preferred_term: craniofacial-deafness-hand syndrome
            term:
              id: MONDO:0007395
              label: craniofacial-deafness-hand syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Somitic and Limb Musculoskeletal Patterning Disturbance
        description: 'The hand arm of the CDHS triad cannot derive from the cranial neural crest node:
          the wrist skeleton and limb musculature are somite and lateral-plate derivatives, not cranial
          neural crest. PAX3 has a separate, well-established role in this second lineage — it is expressed
          in the lateral dermomyotome that gives rise to limb muscle progenitors, and murine Pax3 loss
          produces limbs without musculature. The same upper-limb musculoskeletal involvement separates
          Waardenburg syndrome type 3 from type 1, so a shared PAX3-dependent limb mechanism is the natural
          reading of the CDHS hand phenotype.

          This node is HYPOTHETICAL and deliberately broad. No study has examined limb or muscle tissue
          from a CDHS patient, and the myogenic route does not by itself account for the skeletal element
          of the phenotype (the hypoplastic ulnar styloid), which is why the accompanying knowledge-gap
          discussion keeps that specific question open rather than treating this node as settled.'
        biological_scale: TISSUE
        mechanism_confidence: HYPOTHETICAL
        biological_processes:
        - preferred_term: skeletal muscle tissue development
          term:
            id: GO:0007519
            label: skeletal muscle tissue development
          modifier: ABNORMAL
      selected_evidence:
        snippet: Pax3 is an evolutionarily conserved transcription factor expressed in the lateral dermomyotome,
          a region that gives rise to limb muscle progenitors.
        supports: SUPPORT
    origin:
      assertion_path: /pathophysiology/4
      evidence_path: /pathophysiology/4/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:7744814
      reference_title: Pax3 inhibits myogenic differentiation of cultured myoblast cells.
      evidence_source: MODEL_ORGANISM
      explanation: Establishes the somitic/limb lineage in which PAX3 acts, distinct from the cranial
