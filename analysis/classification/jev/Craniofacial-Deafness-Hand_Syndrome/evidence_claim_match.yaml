  daa97801a6e240b2e5d0fb5a0070ec402db081a169d467a5c746727ffd608d37:
    claim:
      about:
        disease:
          name: Craniofacial-Deafness-Hand Syndrome
          disease_term:
            preferred_term: craniofacial-deafness-hand syndrome
            term:
              id: MONDO:0007395
              label: craniofacial-deafness-hand syndrome
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: cdhs_hand_phenotype_mechanism_unexplained
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: By what mechanism does a PAX3 paired-domain missense allele produce the hand phenotype
          of CDHS — and specifically, does the somitic/limb-muscle route account for the skeletal findings
          (hypoplastic ulnar styloid) as well as the contractural ones (ulnar deviation, digit flexion
          contractures)?
        rationale: 'The hand is one third of the cardinal triad and carries three diagnostic phenotypes,
          yet it is the least mechanistically supported arm of the entry. Two things are worth separating.
          First, the lineage question is settled enough to model: the wrist and limb musculature are somite
          and lateral-plate derivatives, so they cannot descend from the cranial neural crest node, and
          PAX3''s dermomyotome/limb-muscle role supplies a plausible separate branch — which is why the
          Somitic and Limb Musculoskeletal Patterning Disturbance node exists at HYPOTHETICAL confidence.
          Second, and still open: that myogenic route is a natural explanation for deviation and contracture,
          but not for hypoplasia of a bone. The hypoplastic ulnar styloid therefore has no incoming causal
          edge in this entry, deliberately, rather than being attached to a node that does not explain
          it. No limb or muscle tissue from a CDHS patient has ever been examined, and no murine model
          carries a CDHS allele, so both halves of the question are open on human evidence.'
        attaches_to:
        - pathophysiology#Somitic and Limb Musculoskeletal Patterning Disturbance
        - pathophysiology#Altered Paired-Domain DNA Recognition
        proposed_experiments:
        - experiment_id: exp_cdhs_limb_imaging_and_muscle_phenotyping
          name: Systematic upper-limb imaging and muscle phenotyping in ascertained CDHS patients
          description: Combine hand/wrist radiography with MRI or ultrasound of the forearm and intrinsic
            hand musculature in any ascertained CDHS patient, to establish whether the deformity is primarily
            myogenic (muscle hypoplasia or imbalance with secondary joint deformity) or primarily skeletal
            (a dysplastic ulnar styloid and carpus), which the plain radiographs reported to date cannot
            distinguish.
        - experiment_id: exp_cdhs_limb_phenotype_in_n47k_knockin
          name: Limb phenotyping of a Pax3 N47K knock-in allele
          description: Phenotype forelimb musculature and the distal skeleton in the Pax3 N47K knock-in
            proposed under the model-fidelity discussion, comparing against a Pax3 null allele, to test
