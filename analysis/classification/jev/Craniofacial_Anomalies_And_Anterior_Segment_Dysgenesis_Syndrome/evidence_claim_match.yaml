          family. Nothing stronger can be said: there is no second family, no de novo event, and no functional
          demonstration that either change is pathogenic. Expressivity within the family is described
          by the authors as extremely variable, so the pattern is segregation in one pedigree rather than
          an established mode of inheritance.'
