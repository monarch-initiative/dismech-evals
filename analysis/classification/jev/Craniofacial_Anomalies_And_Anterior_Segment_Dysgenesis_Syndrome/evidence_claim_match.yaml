            term:
              id: MONDO:0013618
              label: craniofacial anomalies and anterior segment dysgenesis syndrome
        context: []
      assertion_type: Genetic
      assertion:
        name: VSX1
        relationship_type: DISPUTED
        variant_origin: GERMLINE
        gene_term:
          preferred_term: VSX1
          term:
            id: hgnc:12723
            label: VSX1
        notes: 'VSX1 encodes a paired-like homeodomain transcription factor with homeo and CVC domains,
          expressed in retinal bipolar cells and in spinal V2 interneuron precursors, where it acts as
          a transcriptional repressor.

          relationship_type is DISPUTED rather than CAUSATIVE, and the reasons are cumulative rather than
          any one being decisive. The syndrome rests on one family, never replicated in twenty-two years.
          The genotype is two changes in cis, one of which the reporting authors themselves classify as
          a variation and which is independently catalogued as a polymorphism. Neither change has been
          functionally characterised, and the tested VSX1 missense changes either enhance repressor activity
          or leave it unchanged, so the direction a loss-of-function reading needs has not been observed
          for this gene. A mouse carrying the equivalent of a VSX1 CVC-domain change reproduces the retinal
          electrophysiology and not the corneal phenotype. And there is no ClinGen gene-disease validity
          assertion for VSX1 - checked against the ClinGen gene-validity download of 2026-09-08.

          This typing is consistent with how the knowledge base already treats this gene. Keratoconus
          types VSX1 DISPUTED, and Posterior_Polymorphous_Corneal_Dystrophy records the historical VSX1-PPCD1
          assignment as unconfirmed or of uncertain significance. Those are different diseases from this
          one, and the evidence for each is separate - but a gene whose two better-studied associations
          have both weakened over time is not one to type CAUSATIVE on a single unreplicated family.

          A search trap for whoever extends this entry. The VSX1 literature is dominated by keratoconus
          candidate-gene studies, most of them negative or equivocal, and by retinal and spinal-cord developmental
          biology in zebrafish, goldfish and mouse. Almost none of it concerns this syndrome, and a search
          on the gene alone will return sixty-odd records of which one is the entity curated here.'
      selected_evidence:
        snippet: While we cannot exclude a role for VSX1 as a risk factor for corneal disease, on its
          own, it does not appear to play a major causative role.
        supports: REFUTE
    origin:
