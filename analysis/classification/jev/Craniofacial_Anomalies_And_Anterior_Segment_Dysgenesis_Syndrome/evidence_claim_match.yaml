        name: Retinal and Auditory Bipolar Cell Dysfunction
        biological_scale: CELLULAR
        description: The one part of this phenotype with support outside the family. Electrophysiology
          found evidence of abnormal cone bipolar cells on visual evoked response and electroretinogram
          in the affected adults, and of abnormal auditory bipolar cells on audiogram and auditory evoked
          brainstem response in the proband. Independently, Vsx1 controls terminal gene expression in
          type 7 ON bipolar cells in mouse, and abnormal inner-retinal function on electroretinography
          has been reported in carriers of two other VSX1 changes in an unrelated family - the one place
          where the VSX1-to-retina link has been seen twice.
        cell_types:
