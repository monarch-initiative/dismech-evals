  8729983f564626347c24b33c79831f61e0c89e24f778e8abd4709ca8c742198d:
    claim:
      about:
        disease:
          name: Craniofacial Anomalies and Anterior Segment Dysgenesis Syndrome
          disease_term:
            preferred_term: craniofacial anomalies and anterior segment dysgenesis syndrome
            term:
              id: MONDO:0013618
              label: craniofacial anomalies and anterior segment dysgenesis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Impaired VSX1 Transcriptional Repression
        biological_scale: MOLECULAR
        description: VSX1 is a paired-like homeodomain protein that acts as a transcriptional repressor,
          and its CVC domain contributes to the DNA binding and repression that the closely related CHX10
          also performs. A keratoconus-associated homeodomain change, R166W, impairs DNA binding and hinders
          repressor function, which is the demonstration that VSX1 repression is disruptable by a coding
          change. Whether A256S does anything of the sort has not been tested.
        genes:
        - preferred_term: VSX1
          term:
            id: hgnc:12723
            label: VSX1
        molecular_functions:
        - preferred_term: DNA-binding transcription repressor activity
          modifier: DECREASED
          term:
            id: GO:0001227
            label: DNA-binding transcription repressor activity, RNA polymerase II-specific
        mechanism_confidence: PROVISIONAL
        notes: 'PROVISIONAL, and the reason is worth stating plainly: this node is an inference from domain
          position, not a measurement. The repression machinery is real and the CVC domain is part of
          it, but no functional study of A256S exists. Worse for the naive reading, the direction is not
          predictable from what has been tested - a later survey of VSX1 missense changes found that they
          either enhanced repressor activity or did not alter it, and the CVC-domain change P247R enhanced
          it. So the modifier here records the direction this entry''s causal chain would need rather
          than one that has been observed for this allele, and a reviewer should treat it as a hypothesis.'
      selected_evidence:
        snippet: VSX1 contains closely related homeo and CVC domains and, like CHX10, also repressed transcription.
        supports: SUPPORT
        directness: INDIRECT
    origin:
      assertion_path: /pathophysiology/1
      evidence_path: /pathophysiology/1/evidence/0
      context_paths:
      - /name
      - /disease_term
    evidence_metadata:
      reference: PMID:15647262
      reference_title: Transcriptional activity of the paired-like homeodomain proteins CHX10 and VSX1.
      evidence_source: IN_VITRO
      explanation: That VSX1 is a repressor and that the CVC domain is one of its functional domains.
        INDIRECT because it establishes the machinery rather than what this family's change does to it.
