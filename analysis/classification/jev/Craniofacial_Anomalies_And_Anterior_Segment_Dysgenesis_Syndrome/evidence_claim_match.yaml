      assertion:
        name: Corneal Endothelial Dysgenesis
        biological_scale: TISSUE
        description: 'Anterior segment anomalies of the corneal endothelium were a constant finding in
          all four affected family members, and the authors take the change to reflect anomalous development
          of the corneal endothelium. Nothing beyond the family supports a VSX1 role here, and one substantial
          piece of evidence runs against it: a mouse carrying the equivalent of the VSX1 CVC-domain change
          p.P247R had no observable corneal defect.'
        locations:
        - preferred_term: corneal endothelium
          term:
            id: UBERON:0001985
            label: corneal endothelium
        mechanism_confidence: PROVISIONAL
        notes: PROVISIONAL because the finding is consistent within one family and contradicted outside
          it. dismech already records VSX1's corneal assignments as unconfirmed or of uncertain significance
          in Posterior_Polymorphous_Corneal_Dystrophy and types the gene DISPUTED in Keratoconus, and
          the mouse model of a CVC-domain change has no corneal phenotype. The node is kept because the
          observation in this family is real and reported in every affected member; the incoming edge
          is marked as having unknown intermediates because no step between a transcription factor and
          a corneal endothelial phenotype has been shown.
      selected_evidence:
        snippet: Anterior segment anomalies of the corneal endothelium were a constant finding in all
          affected family members.
        supports: SUPPORT
