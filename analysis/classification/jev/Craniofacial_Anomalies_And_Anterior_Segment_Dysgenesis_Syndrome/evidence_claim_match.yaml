          preferred_term: Autosomal dominant inheritance
          term:
            id: HP:0000006
            label: Autosomal dominant inheritance
      selected_evidence:
        snippet: Both were present on 1 chromosome at 20p11.2 and were segregated with the 4 affected
          patients.
