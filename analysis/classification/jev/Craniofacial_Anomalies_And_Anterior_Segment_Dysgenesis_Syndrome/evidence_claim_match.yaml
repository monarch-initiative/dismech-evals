  a99827b700c2eeb4772b6553875a3fba82a16b4ff682fe0c9931505e11d129a6:
    claim:
      about:
        disease:
          name: Craniofacial Anomalies and Anterior Segment Dysgenesis Syndrome
          disease_term:
            preferred_term: craniofacial anomalies and anterior segment dysgenesis syndrome
            term:
              id: MONDO:0013618
              label: craniofacial anomalies and anterior segment dysgenesis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: VSX1 CVC-Domain Substitution in cis with a Coding Variant
        biological_scale: MOLECULAR
        description: 'Two changes in VSX1, on the same chromosome, in all four affected members. R131S
          lies outside a critical region and was found in a few controls, and the authors class it as
          a variation rather than a mutation; A256S falls in the conserved CVC domain and was found in
          no control. Only A256S is offered as the causal change. The distinction is not academic: R131S
          is independently catalogued as a previously reported single-nucleotide polymorphism in a keratoconus
          cohort in which no VSX1 variant proved pathogenic.'
        genes:
        - preferred_term: VSX1
          term:
            id: hgnc:12723
            label: VSX1
        genetic_context:
          genes:
          - preferred_term: VSX1
            term:
              id: hgnc:12723
              label: VSX1
          allele_type: two coding substitutions in cis, R131S and A256S, the latter in the CVC domain
          variant_origin: GERMLINE
          zygosity: HETEROZYGOUS
          description: Heterozygous in all four affected members of one pedigree, both changes on the
            same chromosome. No second family has been reported.
          notes: 'No functional_impact_category is recorded, and that is deliberate. Neither change has
            been functionally characterised. The published in vitro work on VSX1 covers the homeodomain
            change R166W, which impairs DNA binding and hinders repressor function, and a set of missense
            changes that either enhanced repressor activity or left it unaltered - A256S is not among
            them. Assigning LOSS_OF_FUNCTION or GAIN_OF_FUNCTION here would be an inference from domain
            position rather than a measurement, and the direction is not even predictable: the closest
            characterised CVC-domain change, P247R, enhanced rather than reduced repressor activity.'
      selected_evidence:
        snippet: 'Two changes in VSX1 (RINX) were identified: a variation (R131S) not in a critical region
          and in few controls, and a mutation (A256S) in the critical CVC-domain and not in any controls.'
        supports: SUPPORT
    origin:
