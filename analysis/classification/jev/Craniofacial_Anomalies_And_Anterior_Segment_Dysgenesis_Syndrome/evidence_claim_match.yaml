              label: craniofacial anomalies and anterior segment dysgenesis syndrome
        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Midline Craniofacial and Sellar Maldevelopment
        biological_scale: TISSUE
        description: The part of the phenotype with no proposed mechanism at all. All four affected members
          had craniofacial features - wide interpupillary distance and unusual pinnae. Neuroimaging found
          an empty sella turcica, a posterior fossa cyst, an anterior encephalocele, hypertelorism and
          severe hydrocephalus in the proband; a partially empty sella with a small pituitary and hypertelorism
          in her mother; and hypertelorism with otherwise normal imaging in her older sister. The authors
          conclude that the mutation results in abnormal craniofacial features and absence of the roof
          of the sella turcica, but propose no route from a retinal transcription factor to a midline
          skull-base defect, and none is invented here.
        locations:
        - preferred_term: sella turcica
          term:
            id: UBERON:0003689
            label: sella turcica
        mechanism_confidence: PROVISIONAL
        notes: PROVISIONAL, and this is the weakest node in the entry. VSX1 is a retinal and spinal interneuron
          transcription factor; no source read here proposes a craniofacial or skull-base role for it,
          no animal model shows one, and the finding rests on imaging of three individuals in one family.
          The posterior fossa cyst and the anterior encephalocele are described in prose rather than bound
          as phenotypes because each was seen in one person and neither is separable from the severe hydrocephalus
          in the same child.
      selected_evidence:
        snippet: Craniofacial features, including wide interpupillary distance and unusual pinnae, occurred
          in the 4 affected patients.
        supports: SUPPORT
