      assertion:
        discussion_id: caasds_no_treatment_or_natural_history
        kind: KNOWLEDGE_GAP
        status: OPEN
        attaches_to:
        - treatments#
        prompt: Is there anything to curate about management?
        rationale: 'No. The source is a genotype-phenotype study, not a clinical follow-up, and it reports
          no intervention for any family member - not for the severe hydrocephalus in the proband, which
          would certainly have been managed somehow, and not for the corneal, retinal or auditory findings.
          No treatment, no outcome and no natural history is recoverable from it, and there is no second
          report to supply them.

          Generic management of the individual findings - shunting for hydrocephalus, corneal transplantation
          for endothelial failure, hearing amplification - would look plausible in a treatments block
          and would be an invention. None of it is reported of these patients, and importing it would
          assert of four people an experience recorded only of others. The treatments section is therefore
          empty, deliberately, and this discussion is why.'
      selected_evidence:
        snippet: Main outcome measures included identification and molecular characterization of 1 variation
          and 1 mutation in VSX1 (RINX) of 4 affected family members (3 adults and 1 child).
        supports: NO_EVIDENCE
