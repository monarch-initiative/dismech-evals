          term:
            id: GO:0048704
            label: embryonic skeletal system morphogenesis
          modifier: ABNORMAL
        locations:
        - preferred_term: pharyngeal arch
          term:
            id: UBERON:0002539
            label: pharyngeal arch
      selected_evidence:
        snippet: supporting a link between spliceosome mutations and impaired neural crest development
          in congenital craniofacial disease
        supports: SUPPORT
