        context: []
      assertion_type: Genetic
      assertion:
        name: SF3B2
        notes: SF3B2 encodes a component of the U2 small nuclear ribonucleoprotein complex. Haploinsufficiency
          shows a highly significant loss-of-function burden in sequenced craniofacial microsomia kindreds,
          and morpholino knockdown in Xenopus disrupts cranial neural crest precursor formation with downstream
          craniofacial cartilage defects. This makes craniofacial microsomia a neural-crest spliceosomopathy
          in this subset, mechanistically adjacent to the EFTUD2 and SF3B4 mandibulofacial dysostoses.
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: SF3B2
          term:
            id: hgnc:10769
            label: SF3B2
      selected_evidence:
        snippet: We perform whole-exome or genome sequencing of 146 kindreds with sporadic (n = 138) or
          familial (n = 8) CFM, identifying a highly significant burden of loss of function variants in
          SF3B2
        supports: SUPPORT
    origin:
