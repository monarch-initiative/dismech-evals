      assertion:
        name: FOXI3
        notes: 'FOXI3 encodes a forkhead-box transcription factor regulating ectodermal and neural crest
          development. Damaging variants act through dosage sensitivity: nuclear-localisation-sequence
          missense variants that mislocalise the protein are found in isolated microtia with aural atresia,
          whereas loss-of-function variants produce microtia with mandibular hypoplasia. Penetrance is
          markedly reduced, and a common allele in trans has been proposed as a severity modifier.'
        relationship_type: CAUSATIVE
        gene_term:
          preferred_term: FOXI3
          term:
            id: hgnc:35123
            label: FOXI3
        case_fractions:
        - population: European and Chinese CFM pedigrees (670 unrelated probands)
          case_fraction_percent: 3.1
          cohort_size: 670
          notes: Likely pathogenic FOXI3 variants in 21 of 670 unrelated probands.
        - population: Microtia-CFM cohort, familial cases
          case_fraction_percent: 13.0
          notes: FOXI3 explained 1% of all cases but 13% of familial cases in this cohort, reflecting
            the enrichment of monogenic causes in multiplex families.
      selected_evidence:
        snippet: We studied a 5-generation kindred with microtia, identifying a missense variant in FOXI3
          (p.Arg236Trp) as the cause of disease (logarithm of the odds = 3.33).
        supports: SUPPORT
