              label: craniofacial microsomia
        context: []
      assertion_type: DifferentialDiagnosis
      assertion:
        name: Treacher Collins Syndrome
        description: Treacher Collins syndrome shares the pharyngeal-arch mechanism and conforms to the
          same serial-homology module, producing an overlapping element bundle of mandibular, malar/zygomatic,
          and external-ear hypoplasia with conductive hearing loss. It is the single most instructive
          comparator for craniofacial microsomia.
        distinguishing_features:
        - 'Laterality: Treacher Collins syndrome is bilaterally symmetric, whereas craniofacial microsomia
          is asymmetric and usually unilateral.'
        - 'Aetiology and recurrence risk: Treacher Collins syndrome is a monogenic ribosomopathy (TCOF1,
          POLR1B/C/D), mostly autosomal dominant with a Mendelian recurrence risk; craniofacial microsomia
          is overwhelmingly sporadic with an empiric 2%-3% sib recurrence risk.'
        - 'Ocular and eyelid features: downslanted palpebral fissures and lower-eyelid colobomas characterise
          Treacher Collins syndrome, whereas epibulbar dermoids characterise the Goldenhar variant of
          craniofacial microsomia.'
        - 'Extracraniofacial burden: preauricular tags and vertebral, cardiac and renal anomalies occur
          in craniofacial microsomia but are not features of Treacher Collins syndrome.'
        disease_term:
          preferred_term: Treacher Collins syndrome
          term:
            id: MONDO:0002457
            label: Treacher-Collins syndrome
      selected_evidence:
        snippet: Treacher Collins syndrome (TCS) is characterized by lower eyelid abnormalities, malar
          hypoplasia, downslanted palpebral fissures, and micro- or retrognathia due to symmetric hypoplasia
          of the zygomatic bones, maxilla, and mandible.
        supports: SUPPORT
