        biological_processes:
        - preferred_term: Embryonic cranial skeleton morphogenesis
          term:
            id: GO:0048701
            label: embryonic cranial skeleton morphogenesis
          modifier: ABNORMAL
        - preferred_term: mRNA splicing, via spliceosome
          term:
            id: GO:0000398
            label: mRNA splicing, via spliceosome
          modifier: ABNORMAL
      selected_evidence:
        snippet: identifying a highly significant burden of loss of function variants in SF3B2 (P = 3.8
          × 10-10), a component of the U2 small nuclear ribonucleoprotein complex, in probands
        supports: SUPPORT
