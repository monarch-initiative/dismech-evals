        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Teratogenic and Maternal-Environmental Disruption
        role: mechanism
        description: Teratogenic and maternal-metabolic exposures during arch morphogenesis reproduce
          or predispose to the phenotype. Maternal pregestational and gestational diabetes is the best-replicated
          risk factor, and vasoactive medication exposure, multiple gestation, higher parity, and second-trimester
          vaginal bleeding have all been associated with craniofacial microsomia. Retinoic acid and thalidomide
          embryopathy are the classic pharmacological phenocopies, both acting on cranial neural crest
          survival and on the embryonic vasculature, but a documented exposure is absent in the great
          majority of cases and these agents should not be equated with idiopathic craniofacial microsomia.
          These exposures act on the same neural-crest and vascular substrate as the vascular-disruption
          model rather than through a separate pathway.
        biological_processes:
        - preferred_term: Neural crest cell migration
          term:
            id: GO:0001755
            label: neural crest cell migration
          modifier: ABNORMAL
      selected_evidence:
        snippet: We found a statistically significant association between diabetes mellitus (DM) and CFM
          (OR 4.01, 95% CI 1.6-10.5).
        supports: SUPPORT
