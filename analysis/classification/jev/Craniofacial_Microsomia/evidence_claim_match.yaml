            term:
              id: MONDO:0015397
              label: craniofacial microsomia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: CFM-GAP-002
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Why do the great majority of craniofacial microsomia cases still lack any identified molecular
          cause?
        attaches_to:
        - pathophysiology#Monogenic and Copy-Number Contributions in a Minority of Cases
        rationale: Even with SF3B2 and FOXI3 established, identified monogenic causes account for only
          a small minority of cases, and MYT1 remains presumptive. The reduced penetrance seen in FOXI3
          families, and the observation that variants are frequently inherited from unaffected parents,
          suggest that oligogenic interaction, modifier alleles, somatic mosaicism, or gene-environment
          interaction with perfusion-related exposures may be needed to explain expression. The lack of
          a refined affected phenotype definition also dilutes genetic association power.
        proposed_experiments:
        - experiment_id: CFM-EXP-004
          name: Somatic mosaicism screen in affected craniofacial tissue
          description: Deep sequencing of surgically resected affected craniofacial tissue paired with
            blood, testing whether post-zygotic mosaic variants explain sporadic, unilateral disease that
            is invisible to germline sequencing.
          supporting_outcome:
          - Recovery of tissue-restricted pathogenic variants absent from blood would explain both sporadicity
            and unilaterality.
        - experiment_id: CFM-EXP-005
          name: Trans-modifier analysis of FOXI3 penetrance
          description: Family-based studies quantifying whether common FOXI3 variation in trans with a
            pathogenic allele modifies penetrance and phenotypic severity, as suggested by existing cohort
            data.
        - experiment_id: CFM-EXP-006
          name: Gene-environment interaction analysis
          description: Population-based analysis combining genotype at established and candidate loci
            with maternal diabetes and other perfusion-related exposures, testing for interaction rather
            than independent main effects.
      selected_evidence:
        snippet: The inheritance pattern is controversial, and the molecular etiology of this syndrome
          is largely unknown.
        supports: SUPPORT
