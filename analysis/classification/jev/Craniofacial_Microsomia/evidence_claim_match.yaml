      assertion_type: Subtype
      assertion:
        name: Goldenhar
        display_name: Goldenhar Syndrome / Oculo-Auriculo-Vertebral Spectrum
        description: The variant of the spectrum in which the craniofacial microsomia phenotype is accompanied
          by epibulbar dermoids or lipodermoids and by vertebral anomalies, together with more frequent
          multisystem (cardiac, renal, central nervous system) involvement. Goldenhar syndrome is not
          a genetically distinct entity but the more extensively affected end of the same aetiological
          continuum, which is why MONDO treats the names as synonyms of a single disease term.
      selected_evidence:
        snippet: Multisystem involvement frequently includes the central nervous system, heart, kidneys,
          and skeletal system, distinguishing it from isolated hemifacial microsomia.
        supports: SUPPORT
