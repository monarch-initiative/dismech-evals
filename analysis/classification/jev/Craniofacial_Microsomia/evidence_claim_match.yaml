        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Monogenic and Copy-Number Contributions in a Minority of Cases
        role: mechanism
        description: 'A minority of individuals with craniofacial microsomia carry a defined genetic cause.
          Two genes are well supported. SF3B2 haploinsufficiency, a component of the U2 small nuclear
          ribonucleoprotein complex, shows a highly significant loss-of-function burden in sequenced kindreds
          and disrupts cranial neural crest precursor formation in Xenopus; this places craniofacial microsomia
          alongside the EFTUD2 and SF3B4 spliceosomopathies as a neural-crest spliceosome disorder. Pathogenic
          variants in FOXI3, a forkhead transcription factor regulating ectodermal and neural crest development,
          are found in roughly 1%-3% of unselected cases and are substantially enriched among familial
          cases. Two further genes have been reported more recently, and both lie at loci the 2016 craniofacial
          microsomia genome-wide association study had already implicated: rare missense variants in the
          homeobox gene GBX2 co-segregated with the phenotype in three unrelated pedigrees ascertained
          from a 201-family exome cohort, and rare deleterious variants in SHROOM3 are enriched in Chinese
          hemifacial microsomia cohorts under a model of dominant inheritance with incomplete penetrance,
          where penetrance tracks the combination of the coding variant with SHROOM3 expression-quantitative-trait
          alleles. Rare variants in MYT1 have been reported in several unrelated individuals but remain
          presumptive. Pathogenic copy-number variants and chromosomal rearrangements account for additional
          cases without a single recurrent lesion. This genetic minority sits inside an overwhelmingly
          sporadic condition, which is why recurrence-risk counselling differs sharply from that of the
          monogenic craniofacial dysostoses.'
        genes:
        - preferred_term: SF3B2
          term:
            id: hgnc:10769
            label: SF3B2
        - preferred_term: FOXI3
