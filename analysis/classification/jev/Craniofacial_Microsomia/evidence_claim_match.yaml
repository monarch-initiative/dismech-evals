            name: Deficient Neural-Crest-Derived Skeletogenic Mesenchyme in the First and Second Arches
            conforms_to: pharyngeal_arch_patterning_serial_homology#Disrupted Pharyngeal-Arch Patterning
              and Neural-Crest Skeletogenesis
            role: central_effector
            description: Whatever the upstream insult, the shared effector step is a regional shortfall
              of neural-crest-derived skeletogenic mesenchyme in the first and second pharyngeal arches
              on the affected side. Because this mesenchyme is the common precursor of the mandible and
              Meckel cartilage, the malleus and incus, the external ear, and the associated muscles and
              soft tissue, its regional depletion produces a coordinated deficiency across all of these
              developmentally related elements rather than an isolated bone defect. Deficiency of the
              masticatory musculature is itself part of the mechanism, contributing to mandibular underdevelopment
              through reduced functional loading rather than merely accompanying it.
            cell_types:
