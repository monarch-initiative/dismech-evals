  310fd91678a556e16858d31c833e5ccf132da796cb59a28450513b757afb2e39:
    claim:
      about:
        disease:
          name: Craniofacial Microsomia
          disease_term:
            preferred_term: craniofacial microsomia
            term:
              id: MONDO:0015397
              label: craniofacial microsomia
        context: []
      assertion_type: Discussion
      assertion:
        discussion_id: CFM-GAP-001
        kind: KNOWLEDGE_GAP
        status: OPEN
        prompt: Is embryonic vascular disruption a genuine cause of craniofacial microsomia, or a correlate
          of a primary neural-crest lesion?
        attaches_to:
        - pathophysiology#Stapedial Artery Haemorrhage and Vascular Disruption
        rationale: The stapedial-artery haemorrhage model has dominated thinking about craniofacial microsomia
          for fifty years and elegantly explains unilaterality and severity gradation, but the most recent
          systematic review found only eight qualifying studies and judged the evidence indirect and heterogeneous.
          The maternal risk factors that support it (diabetes, vasoactive medication, multiple gestation)
          are also compatible with a direct neural-crest insult, and maternal diabetes has an independently
          proposed neural-crest-migration mechanism. The GWAS finding that candidate loci are enriched
          for both neural crest development and vasculogenesis is consistent with either ordering. Distinguishing
          a primary vascular cause from a primary neural-crest cause matters because it determines whether
          prevention should target perfusion or crest biology.
        proposed_experiments:
        - experiment_id: CFM-EXP-001
          name: Prospective vascular imaging of affected versus unaffected side
          description: High-resolution magnetic resonance angiography of both sides of the face in a prospective
            craniofacial microsomia cohort, testing whether regional arterial attenuation is present in
            individuals without skeletal deficiency and whether its severity tracks the OMENS mandible
            score.
          supporting_outcome:
          - Arterial attenuation grading with mandibular deficiency would support a primary vascular mechanism.
          refuting_outcome:
          - Absence of any consistent regional arterial abnormality in severely affected individuals would
            argue for a primary neural-crest lesion.
        - experiment_id: CFM-EXP-002
          name: Human embryonic specimen correlation of stapedial artery regression
          description: Staged human embryonic and fetal specimen studies correlating the timing of stapedial
            artery regression with first- and second-arch mesenchymal volume, establishing whether the
            vascular event precedes the mesenchymal shortfall.
        - experiment_id: CFM-EXP-003
          name: Pathway-stratified genomic analysis by laterality
          description: Integrated genomic analysis testing whether rare-variant burden in vascular-development
            versus neural-crest pathways segregates with unilateral versus bilateral presentations.
      selected_evidence:
        snippet: Further studies integrating genomic analyses, developmental models, and detailed vascular
          imaging are needed to clarify the role of vascular mechanisms in craniofacial microsomia.
        supports: SUPPORT
