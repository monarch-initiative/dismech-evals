        context: []
      assertion_type: Pathophysiology
      assertion:
        name: Stapedial Artery Haemorrhage and Vascular Disruption
        role: mechanism
        description: The classic pathogenic model proposes a focal haemorrhage from the developing stapedial
          artery, the transient embryonic vessel supplying the first and second pharyngeal arch territory.
          An expanding haematoma destroys or displaces differentiating arch mesenchyme, and the extent
          and timing of the bleed determine which arch derivatives are lost and how severely, explaining
          the unilateral distribution and the wide severity range of the phenotype. Contemporary systematic
          review finds the supporting evidence indirect but consistent, and places vascular disruption
          within a broader multifactorial framework rather than treating it as a sufficient explanation.
          Notably, the craniofacial microsomia GWAS loci are enriched for vasculogenesis as well as neural
          crest genes, so the vascular and neural-crest arms are convergent rather than competing.
        cell_types:
        - preferred_term: Endothelial cell
          term:
            id: CL:0000115
            label: endothelial cell
        biological_processes:
        - preferred_term: Blood vessel development
          term:
            id: GO:0001568
            label: blood vessel development
          modifier: ABNORMAL
      selected_evidence:
        snippet: The available evidence is consistent with a possible contribution of disturbances in
          vascular development to the pathogenesis of hemifacial microsomia, particularly in unilateral
          presentations. However, current evidence remains indirect and heterogeneous.
        supports: SUPPORT
