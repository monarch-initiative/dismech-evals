      assertion_type: Genetic
      assertion:
        name: SHROOM3
        notes: SHROOM3 is one of the thirteen loci named by the 2016 craniofacial microsomia genome-wide
          association study, whose authors reported those loci as enriched for genes involved in neural
          crest cell development and vasculogenesis. Two subsequent Chinese studies report both common-variant
          association and enrichment of rare deleterious coding variants in hemifacial or craniofacial
          microsomia cohorts, and describe dominant inheritance with incomplete penetrance in which the
          penetrance of a rare coding allele depends on the SHROOM3 expression-quantitative-trait haplotypes
          carried alongside it. It is curated here as a susceptibility relationship rather than as a Mendelian
          cause because a rare coding variant is, on the authors' own model, not sufficient on its own;
          both reports describe the gene as a likely pathogenic gene rather than an established one.
        relationship_type: SUSCEPTIBILITY
        gene_term:
          preferred_term: SHROOM3
          term:
            id: hgnc:30422
            label: SHROOM3
      selected_evidence:
        snippet: Our study identified 7 deleterious variants in SHROOM3 among the 320 Chinese HFM patients
          and 2 deleterious variants in two HFM trios, respectively, suggesting a model of dominant inheritance
          with incomplete penetrance.
        supports: SUPPORT
