        biological_scale: MOLECULAR
        description: 'Heterozygous missense substitutions at Arg157, Pro160 or Gln161 in a highly conserved
          stretch of the glutamine-rich N-terminus; Arg157 and Pro160 lie in the tankyrase-binding motif
          of AMOTL1. AMOTL1 tolerates loss of function (pLI 0) and Amotl1 deletion mice survive normally,
          while R157C knock-in mice have reduced survival, so the variants are thought to act by gain
          of function or dominant interference rather than haploinsufficiency. The functional category
          is left unset because the sources do not settle it: the mutants also lose a normal function,
          since R157C escapes DDI2 cleavage and so no longer promotes focal-adhesion maturation.'
